prompt: |-
  I help run a county wildlife sighting log — me and about forty volunteers, mostly retirees and a couple of high schoolers, who text me things or fill out a Google Form. In season I get maybe fifty records a week. Two grad students and the state natural heritage office pull from our log, and every few years the town leans on it when it rewrites its open space plan. So the stakes aren't nothing: a record of something rare can trigger a survey that costs real money and holds up a subdivision, and no record can mean a wet spot gets filled in. I've got about five minutes per record, no budget, and a retired state biologist named Dale who goes over whatever I flag, once a week.

  I'm not academic at all, but I got interested in that old Indian epistemology stuff — Nyaya, I think — with its four ways of knowing: pratyaksha (you saw or heard it yourself), anumana (you worked it out from signs like tracks, scat, chewed bark), upamana (you knew it because it was like something you already knew — the example I keep seeing is knowing what a gavaya is from being told it's sort of cow-like), and shabda (somebody told you, or the field guide says so). I probly have some of this garbled. What grabbed me is that our unwritten rule right now is basically no photo, no record, which now looks to me like it worships one of the four and throws the rest in the trash.

  So what I want is a procedure, not a discussion. Give me the questions in the order I should ask them, what counts as a good enough answer to each one, where the procedure just stops and says no, and where it hands the thing to Dale because the real issue is how much risk we're willing to take and not what's true. I need verdict labels I can put in a spreadsheet (confirmed, probable, in-but-unconfirmed, rejected, escalate), and I need it to be runnable by a volunteer in five minutes without me hovering.

  Four things it has to handle, because these are the ones I keep getting stuck on:

  Two reports of the same kind versus two of different kinds. My instinct is that two different kinds agreeing should count for more than two of the same kind — a photo plus a good inference beats two photos — but I don't know if "different kind" is even the right thing to be counting, or what to do when the different kinds disagree.

  Stuff I've started calling laundered perception. A volunteer writes "my neighbor saw one in her yard," and the neighbor did see it, so it feels like perception. But it comes to me as testimony, and I think I've been counting it twice, once as the seeing and once as the telling. Where does the procedure draw that line?

  Negative reports. A lot of what comes in is "walked the beaver marsh every week all summer, never heard a least bittern." Some lists of the ways of knowing seem to have a fifth one for knowing something from NOT seeing it, but the Nyaya four don't. If the four genuinely can't handle a negative, say so plainly instead of squeezing it in, because I'd rather have a hole I know about.

  And there's something I read about checking your own knowing, a kind of second look at the looking. Sounds like a time sink for someone with five minutes, but maybe it's the step that actually matters. Tell me honestly if it earns its place or if I should drop it.

  Then run it on three real-ish cases. First: a volunteer sends a sharp phone photo of a turtle with a yellow chin, first record for our county, with a note that her uncle has been trapping turtles since he was a kid and says it's the state-listed kind. Second: no photo of any animal, but photos of tracks in mud next to a ruler, described as bigger than coyote, round, no claw marks, from a volunteer who has tracked for thirty years — and the state says cougars aren't here, so this one could blow up. Third, and this is the one I care about unfairly: back in 2016 I saw a timber rattlesnake cross the trail on a ridge behind my own house, out walking the dog, no phone on me, and I've wanted the log to mark that ridge as occupied ever since. Run the procedure on my snake and tell me straight. I expect it says no, or in-but-unconfirmed at best, and I want to hear exactly why even though I definately won't like it.

  Also, please don't send me to any reading or give me names of books and papers — I've got no library card and no patience for it, and I don't care who said something first. And if any step is really just my gut wearing a lab coat, label it as that. Finally, tell me what the procedure can't do for me at all.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Runs a county wildlife sighting log with ~40 volunteers (mostly retirees, some HS students).
      *   **Stakeholders:** 2 grad students, state natural heritage office, town planners (open space/subdivision issues).
      *   **Constraints:** 5 minutes per record, no budget, one expert reviewer (Dale, retired state biologist) once a week.
      *   **Philosophical Framework:** Interested in Nyaya epistemology (Pratyaksha = perception, Anumana = inference, Upamana = comparison, Shabda = testimony) but admits to possibly garbling it. Wants to move away from "no photo, no record."
      *   **Deliverable:** A concrete *procedure* (questions, order, stop conditions, verdict labels), not a discussion. Must be runnable by a volunteer.
      *   **Specific Challenges to Address:**
          1.  Corroboration (Two same vs. two different sources).
          2.  "Laundered Perception" (Neighbor saw it, volunteer reports it).
          3.  Negative Reports (Absence of evidence).
          4.  Meta-cognition ("Checking the knowing" – is it worth the time?).
      *   **Test Cases:**
          1.  Turtle photo + Uncle's testimony (State-listed species).
          2.  Cougar tracks (No animal photo, expert tracker, contradicts state range).
          3.  User's own Timber Rattlesnake sighting (2016, no photo, personal bias).
      *   **Constraints on Output:** No reading lists, no academic name-dropping, label "gut wearing a lab coat," state limitations clearly.

  2.  **Deconstruct the Nyaya Framework for Practical Use:**
      *   *Pratyaksha (Perception):* Direct observation (Photo/Video/Audio recording). High reliability.
      *   *Anumana (Inference):* Signs (tracks, scat, damage). Medium reliability, depends on skill.
      *   *Upamana (Comparison):* "It looked like X but with Y feature." Relies on volunteer's baseline knowledge.
      *   *Shabda (Testimony):* "I saw it" or "Expert says it's X." Relies on trustworthiness of source.
      *   *Abhava (Absence/Negative):* Not strictly one of the original four in early Nyaya, but later accepted. Crucial for "never heard a bittern."

  3.  **Drafting the Procedure (The "Five-Mminute Triage"):**
      *   *Goal:* Filter records into the 5 verdict labels (Confirmed, Probable, In-but-Unconfirmed, Rejected, Escalate).
      *   *Structure:* A decision tree or checklist.
      *   *Time Limit:* 5 minutes means max 5-7 questions.

      *   *Step 1: The Evidence Type (The "What do you have?" question).*
          *   Distinguish between Direct (Photo/Audio), Indirect (Tracks/Sign), and Testimony (Sighting only).
      *   *Step 2: The Source (The "Who says?" question).*
          *   Address "Laundered Perception." If the reporter didn't see it, it's Shabda (Testimony), not Pratyaksha.
      *   *Step 3: Corroboration (The "Does it match?" question).*
          *   Address "Two same vs. Two different." Different types (Photo + Track) > Same type (2 Photos) because they attack the problem from different angles (reduces chance of shared error).
      *   *Step 4: The "Gut Check" (Meta-cognition).*
          *   User asked about "checking the knowing." Is it worth 5 mins? Yes, but simplified. "Does this fit the context?" (Season, Location, Habitat).
      *   *Step 5: The Negative Report.*
          *   Handle separately. It's not a sighting; it's a survey effort. Needs a different label or specific criteria (effort hours).

  4.  **Refining the Verdict Labels:**
      *   *Confirmed:* Hard evidence (Photo/Audio) + ID matches.
      *   *Probable:* Strong inference (Tracks by expert) OR Sighting by trusted expert + description matches.
      *   *In-but-Unconfirmed:* Sighting by novice, no photo, plausible. (Good for heat maps, bad for regulatory stops).
      *   *Rejected:* Impossible (wrong season, wrong habitat), contradictory evidence, or laundered perception without source contact.
      *   *Escalate (To Dale):* High stakes (rare species), conflicting evidence, or potential regulatory impact.

  5.  **Addressing the Specific Challenges:**
      *   *Corroboration:* Weight "Different Kinds" higher. Photo + Track > 2 Photos.
      *   *Laundered Perception:* If Reporter $\neq$ Observer, downgrade one tier. Must be able to contact Observer.
      *   *Negative Reports:* Acknowledge Nyaya limitation. Treat as "Effort Data," not "Sighting Data."
      *   *Meta-cognition:* Call it "Context Fit." Keep it to one question: "Does the habitat/season match?"

  6.  **Developing the Test Cases:**
      *   *Case 1 (Turtle):* Photo (Pratyaksha) + Uncle (Shabda). Photo is key. Uncle confirms ID. Verdict: *Probable* (Photo needs expert ID confirmation) or *Escalate* (if state-listed). Let's say *Escalate* because of regulatory stakes.
      *   *Case 2 (Cougar Tracks):* Tracks (Anumana). Expert Tracker (High Shabda/Pratyaksha of sign). State says No (Conflicting Shabda). High Stakes. Verdict: *Escalate*.
      *   *Case 3 (User's Snake):* Memory (Shabda/Pratyaksha decay). No Photo. High Bias (User runs the log). 2016 (Old). Verdict: *In-but-Unconfirmed* (or Rejected depending on strictness). Need to be honest about the bias.

  7.  **Review against Constraints:**
      *   5 minutes? Yes, if questions are binary/simple.
      *   No reading list? Check.
      *   Label "gut" steps? Check.
      *   State limitations? Check.

  8.  **Final Polish (Tone and Structure):**
      *   Keep it direct. No fluff.
      *   Use the User's Nyaya terms but ground them in the workflow.
      *   Ensure the "Laundered Perception" logic is clear (it degrades the evidence type).
      *   Ensure the "Negative Report" is handled honestly (it's not a sighting).
      *   Make sure the User's Snake case gets the hard truth.

      *(Self-Correction during drafting)*: I initially thought about putting the Turtle in "Confirmed." But the User said "State-listed." That triggers regulatory stakes. Dale needs to see it. So "Escalate" is safer.
      *(Self-Correction on Negative Reports)*: Nyaya *does* have *Abhava* (non-existence) as a valid means of knowledge in later schools, but the User said "the Nyaya four don't." I should respect their premise but solve the problem. I will treat negatives as "Effort Logs," not "Sighting Logs."
      *(Self-Correction on Meta-cognition)*: The User asked if it earns its place. In 5 minutes, deep reflection is impossible. But a "Context Check" is essential. I will frame it as "Habitat/Season Plausibility."

  9.  **Finalizing the Procedure Steps:**
      1.  Source Check (Who saw it?).
      2.  Evidence Check (What proof?).
      3.  Context Check (Does it make sense?).
      4.  Stakes Check (Does it matter?).
      5.  Verdict Assignment.

  10. **Writing the Response:** (Proceeding to generate output based on these thoughts).
answer: |-
  Here is the procedure. It is designed to be printed as a one-page checklist for your volunteers. It translates the Nyaya concepts into workflow steps without requiring your volunteers to know the philosophy.

  ### The Five-Minute Triage Procedure

  **Verdict Labels:**
  *   **CONFIRMED:** Hard evidence, ID certain.
  *   **PROBABLE:** Strong signs or expert testimony, ID likely.
  *   **IN-BUT-UNCONFIRMED:** Plausible sighting, low evidence. Good for heat maps, bad for regulations.
  *   **REJECTED:** Impossible, contradictory, or unverifiable.
  *   **ESCALATE:** High stakes, rare species, or conflicting evidence. Goes to Dale.

  ---

  #### Step 1: The Source Check (Handling "Laundered Perception")
  **Question:** Did the person filling out this form see/hear it themselves?
  *   **YES:** Proceed to Step 2. (This is *Pratyaksha* or *Anumana*).
  *   **NO:** (They are reporting for a neighbor/relative). This is *Shabda* (Testimony), not Perception.
      *   **Action:** Do you have the actual observer's name and phone number?
      *   **NO:** Verdict = **REJECTED**. (You cannot verify the source).
      *   **YES:** Proceed to Step 2, but **downgrade** the final verdict by one level (e.g., if it looks like *Confirmed*, mark *Probable*).

  #### Step 2: The Evidence Check (Handling "Two Kinds vs. Two Same")
  **Question:** What evidence is attached?
  *   **Photo/Video/Audio:** (Direct Perception).
  *   **Physical Sign:** (Tracks, scat, chew. This is Inference/*Anumana*).
  *   **Description Only:** (Testimony/*Shabda*).
  *   **Multiple Types:** (e.g., Photo + Tracks).

  **Rule:** If you have **Multiple Types** (Photo + Tracks), upgrade the reliability. Two different kinds of evidence beat two of the same kind because they rule out different errors (e.g., a photo can be mislabeled, tracks can be misread; both together is rare).

  #### Step 3: The Context Check (The "Second Look")
  **Question:** Does the location and season match what we know about this animal?
  *   **YES:** Proceed to Step 4.
  *   **NO:** (e.g., Hibernating species in January, ocean bird in a cornfield).
      *   **Action:** Is there a reasonable explanation provided? (e.g., "Found injured," "Storm blew it in").
      *   **NO Explanation:** Verdict = **REJECTED**.
      *   **Good Explanation:** Proceed to Step 4, but flag for Dale.

  *(Note: This is the "checking the knowing" step. It earns its place because it catches 80% of errors in 30 seconds. It is not deep philosophy; it is a sanity check.)*

  #### Step 4: The Stakes Check
  **Question:** Is this species on the State Watch List or will this record stop a construction project?
  *   **NO:** Proceed to Step 5.
  *   **YES:** Verdict = **ESCALATE**. (Do not decide this yourself. Dale must see it).

  #### Step 5: Assign Verdict
  *   **Photo/Audio + ID matches:** **CONFIRMED**.
  *   **Tracks/Sign by Expert (10+ yrs) + Context fits:** **PROBABLE**.
  *   **Description Only + Context fits + Source Verified:** **IN-BUT-UNCONFIRMED**.
  *   **Description Only + No Contact Info OR Context Fails:** **REJECTED**.

  ---

  ### Handling Your Four Specific Problems

  **1. Two Reports (Same vs. Different)**
  The procedure handles this in **Step 2**.
  *   Two photos of the same deer = Redundant. Counts as one *Confirmed*.
  *   One photo of a deer + One set of deer tracks in the same spot = Compounding. Counts as *Confirmed* with high confidence.
  *   **Disagreement:** If Report A says "Cougar" (Tracks) and Report B says "Dog" (Photo) for the same spot/time: Verdict = **ESCALATE**. Do not average them. Dale decides.

  **2. Laundered Perception**
  The procedure handles this in **Step 1**.
  *   If the volunteer didn't see it, it is not Perception. It is Testimony.
  *   **The Line:** The line is drawn at **contactability**. If you cannot call the neighbor to ask "Did you actually see it or did your dog bark?", it is rejected. This prevents the "telephone game" from entering the log as hard data.

  **3. Negative Reports**
  **Honest Answer:** The Nyaya four (and this procedure) **cannot handle negatives** as "sightings."
  *   "I never saw a bittern" is not a record of a bittern. It is a record of **Effort**.
  *   **Procedure Modification:** Create a separate form tab called "Effort Log."
  *   **Verdict:** Do not give these a sighting verdict. Log them as "Zero Detection / 5 Hours Effort."
  *   **Why:** If you mix negatives with positives, you dilute the value of a "Confirmed" sighting. Keep them separate. Dale can use the Effort Log to know where you *haven't* looked, which is valuable, but it doesn't belong in the sighting spreadsheet.

  **4. Checking Your Own Knowing (Meta-cognition)**
  **Honest Answer:** In a 5-minute triage, deep reflection is a time sink.
  *   **Verdict:** Keep **Step 3 (Context Check)** but keep it shallow. Do not ask "Am I biased?" Ask "Does this fit the map?"
  *   If the step takes more than 60 seconds, drop it. The "Gut wearing a lab coat" is the Stakes Check (Step 4). That is purely intuition about consequences, labeled as a rule to save time.

  ---

  ### Running the Test Cases

  #### Case 1: The Turtle (Photo + Uncle's Testimony)
  *   **Step 1 (Source):** Volunteer saw it (took photo). Uncle is secondary. (Pass).
  *   **Step 2 (Evidence):** Photo (*Pratyaksha*) + Uncle ID (*Shabda*). Multiple types of ID support.
  *   **Step 3 (Context):** Yellow chin turtle in county. Plausible.
  *   **Step 4 (Stakes):** **State-listed species.** This triggers regulatory stoppage.
  *   **Verdict:** **ESCALATE**.
  *   **Why:** Even though the photo is *Confirmed* quality, the stakes require Dale's sign-off. You cannot risk a subdivision halt on a volunteer's ID of a state-listed species, even with a photo. Dale must verify the photo matches the state listing criteria.

  #### Case 2: The Cougar Tracks (Expert Tracker + No Photo)
  *   **Step 1 (Source):** Volunteer saw tracks. (Pass).
  *   **Step 2 (Evidence):** Tracks (*Anumana*). Volunteer has 30 years experience (High reliability).
  *   **Step 3 (Context):** Tracks fit description, **BUT** State says "Not here." This is a Context Conflict.
  *   **Step 4 (Stakes):** **High.** Cougar sighting stops development immediately.
  *   **Verdict:** **ESCALATE**.
  *   **Why:** This is "Different Kinds Disagreeing." The Tracks say Yes, the State Range Map says No. This is exactly what Dale is paid to risk-assess. Do not mark *Probable*. If you mark *Probable*, a developer might sue. If you mark *Rejected*, you might lose a rare population. Dale decides the risk.

  #### Case 3: Your Timber Rattlesnake (2016, No Photo, Your Memory)
  *   **Step 1 (Source):** You saw it. (Pass).
  *   **Step 2 (Evidence):** Description Only (*Shabda*/Memory). No Photo.
  *   **Step 3 (Context):** Ridge habitat fits. Season fits. **BUT** Date is 2016 (8 years ago).
  *   **Step 4 (Stakes):** Timber Rattlesnake is high stakes (protected species).
  *   **Step 5 (Bias Check - *Gut wearing a lab coat*):** You run the log. You want the ridge marked.
  *   **Verdict:** **IN-BUT-UNCONFIRMED**. (With a note: "Admin Sighting, Historic").
  *   **The Hard Truth:** It cannot be *Confirmed* (no photo). It struggles to be *Probable* because memory degrades and you are a biased observer.
  *   **Why "In-but-Unconfirmed"?** If you *Reject* it, you are lying to the data. You did see it. But if you *Confirm* it, you are compromising the log's integrity for personal desire.
  *   **Regulatory Reality:** This record **cannot** stop a subdivision. It is not admissible as hard evidence. It serves only to tell Dale: "Look here during the next survey cycle."
  *   **Procedure Requirement:** Because you are the admin, **you cannot enter this yourself.** You must hand this slip to a volunteer to enter, or hand it directly to Dale. You cannot be the judge of your own evidence.

  ---

  ### What This Procedure Cannot Do For You

  1.  **It cannot fix bad data at the source.** If a volunteer lies, this procedure only catches them if they fail the Context Check or can't provide contact info. It cannot detect a well-constructed lie.
  2.  **It cannot replace Dale on high-stakes negatives.** If an expert says "I looked for 50 hours and found no Bitterns," this procedure treats that as "Effort," not "Proof of Absence." Dale must interpret if that effort was enough to declare the area empty.
  3.  **It cannot resolve "Different Kinds Disagreeing" without Escalation.** If a photo says "Dog" and a track says "Cougar," the procedure forces an Escalate. It does not solve the mystery; it just flags the cost.
  4.  **It cannot validate Memory.** As seen in your snake case, the procedure treats unphotographed past events as weak data. It protects the log's legal standing, but it hurts the historical record. You have to accept that trade-off.

  **Final Instruction:** Print Step 1 through Step 5. Tape it to the monitor of whoever is doing data entry. If they hesitate on a step for more than 2 minutes, the default action is **ESCALATE**.
