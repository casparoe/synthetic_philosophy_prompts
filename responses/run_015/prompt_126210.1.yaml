  The argument I keep having: my philosopher friend says the no-free-lunch theorems are just Hume's problem of induction with better marketing. I think that's wrong, but every time I try to say why I end up just asserting things she doesn't grant. So do the translation job honestly:

  1. Restate, in my vocabulary and as faithfully as you can, Hume's actual argument — the one where any attempt to justify induction either assumes what it's trying to prove (that the future will resemble the past) or sneaks induction in somewhere inside the justification, so what's left is custom and habit rather than reason.
  2. Restate in the same vocabulary the main replies: the Reichenbach-style move that if anything works induction works and that's the most anyone could want; Goodman's grue/bleen business; and the move that says the real extra premise is just that the world happens to be compressible.
  3. Restate in the same vocabulary what the NFL theorems actually say, and what people on my side of the fence take them to establish.
  4. The part I actually care about: the residue report.

  For the residue, be strict. I want three lists: what translated cleanly; what only translated because you quietly smuggled something in (treating a prior as if it were a justification, or reading "no non-circular justification available" as "no performance guarantee available", that sort of thing — flag each one); and what has no counterpart in my vocabulary at all. For every item in the third list, tell me whether you think that's a genuine blind spot in my framework — something ML simply isn't asking and maybe should — or a sign that the philosophical claim was fuzzier than it sounded.

  Two things I want you to chew on specfically, because that's where my intuition is stuck:

  - The single-shot worry. NFL is a claim about an average over a class of problems or environments. But I don't face an average. I have one warehouse, one deployment, and I'm inside it. Hume's skeptic, the way I read him, isn't worried about my average case either; he's worried about the very next instance. Is "the very next instance" versus "the distribution" definately the real hinge here, and does the idea of one environment, once, from the inside, have any expression in my vocabulary at all — or is it exactly the kind of nuisance exchangeability and PAC-Bayes were built to delete?
  - What my colleague calls the entitlement gap, and what I call the second-order lunch. Her point: NFL, Solomonoff, all of it assumes you already have a prior, and Hume's skeptic is asking whether you're entitled to one — "here's a prior" doesn't answer "why that one". Is there anything in my vocabulary that even resembles entitlement, or does my framework only ever hand me conditional guarantees (if the world is in this class, then...) and never unconditional ones? And the second-order bit: whatever NFL says about a fixed learner over a class of environments seems to apply all over again one level up, to whatever picks the learner — the meta-learner, the architecture search, evolution, me and my team. Yet meta-learning obviously works here: the retuned prior beats the hand-written one every quarter. So something is breaking the symmetry somewhere, and it'll have to keep breaking it at every level up the stack. Is the thing that breaks it the same thing that's supposed to answer Hume, or a different thing wearing the same clothes? If it's the same thing, say exactly where it enters and how far the regress goes.

  Don't flatter either side. If the honest answer is that the philosophers' problem dissolves into "pick a prior and eat the log-loss", say that. If the honest answer is that my vocabulary can't even formulate their question, say that instead, and say what I'd have to add to it to formulate it.
