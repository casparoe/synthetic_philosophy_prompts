answer: |-
  You have identified a genuine and widely acknowledged tension in metaphysics, though there is no single, canonical Latin term or specific phrase that names *exactly* this argumentative habit in isolation.

  However, your observation maps precisely onto several established concepts in philosophical methodology and logic. Depending on whether one views this shifting as a flaw in reasoning or a feature of language, philosophers describe it using different terms.

  Here is a breakdown of the established terminology that captures your observation, how it differs from equivocation and legitimate sortal dependence, and what the precise boundaries are.

  ### 1. The Logical Critique: "Special Pleading" or "Ad Hocery"
  If we treat the shifting of criteria as a flaw in reasoning (as your scientific background might suggest it is), the closest established logical term is **Special Pleading**.

  *   **Definition:** Special pleading occurs when a person applies a general principle to a specific case but exempts a particular case without providing a relevant justification for the exemption.
  *   **Application to your observation:** In the statue case, the principle seems to be "Identity requires formal continuity." In the aircraft case, the principle seems to be "Identity requires historical continuity." If a philosopher switches between these principles solely to preserve the pre-theoretic intuition (e.g., "The statue is gone," "The plane remains") without a higher-order rule explaining *why* statues follow one rule and planes follow another, they are engaging in special pleading.
  *   **Related Term:** **Ad Hoc Rescue.** This describes modifying a theory (or criteria of identity) specifically to save it from a counter-example (the intuition) without independent justification.

  ### 2. The Metaphysical Critique: "Unprincipled Sortal Sensitivity"
  You asked how this differs from the legitimate view that "different kinds of things simply have different rules." In philosophy, the legitimate view is called **Sortal Relativism** or **Sortal Dependence of Identity**.

  *   **The Legitimate View:** A "sortal" is a concept that supplies a principle of individuation and counting (e.g., *statue*, *lump of clay*, *aircraft*, *organism*). It is standard orthodoxy (championed by philosophers like David Wiggins) that persistence conditions are sortal-relative. A *biological organism* persists through material change (metabolism); a *constellation* does not persist if the stars move.
  *   **Your Observation:** You are noticing when this sortal dependence appears **arbitrary** or **unprincipled**.
  *   **The Distinction:**
      *   **Legitimate Sortal Dependence:** There is a meta-principle explaining the difference. (e.g., "Functional artifacts persist through part replacement if the function is maintained; constituted artworks persist only as long as their specific form is maintained.")
      *   **Unprincipled Sortal Sensitivity:** The criteria shift without a governing meta-principle, driven solely by the desire to match "folk intuitions."
  *   **Terminology:** While there is no single noun for this, methodologists describe this as a failure of **Theoretical Unity** or **Systematicity**. If you were to coin a term for a paper, **"Metaphysical Opportunism"** or **"Criterion Instability"** would be precise.

  ### 3. The Methodological Context: "Reflective Equilibrium"
  The reason you see this shifting is that many philosophers (particularly in the analytic tradition) use a method called **Reflective Equilibrium** (associated with John Rawls and Norman Daniels).

  *   **The Method:** One starts with specific intuitions (e.g., "The statue is destroyed") and general principles (e.g., "Identity is transitive"). One adjusts both until they cohere.
  *   **The Critique:** Critics of this method (such as Hilary Kornblith or Timothy Williamson) argue that it often degenerates into exactly what you described: **Intuition-Chasing**. Philosophers tweak the criteria of identity case-by-case to ensure the theory outputs the "correct" intuitive answer, rather than deriving the answer from a consistent theory.
  *   **The Name:** In this context, your observation is a critique of **Methodological Intuitionism**. You are pointing out that the "equilibrium" is often achieved by bending the principles rather than correcting the intuitions.

  ### 4. Why It Is Not "Equivocation"
  You asked how this differs from simple equivocation. This is a crucial distinction.

  *   **Equivocation:** This is a semantic fallacy where a *word* changes meaning mid-argument (e.g., using "bank" to mean riverbank in premise 1 and financial bank in premise 2).
  *   **Your Observation:** The word "identity" (or "same") is intended to keep the same logical meaning (numerical identity, $x = y$). What changes are the **truth conditions** or **persistence criteria** applied to the subjects.
  *   **The Nuance:** Some philosophers (Contextualists about Identity, like David Lewis in his *Counterpart Theory*) argue that "identity" *is* context-sensitive. If they are right, it isn't a fallacy at all; it's a feature of the concept. However, if they are wrong, it is not equivocation on the *word*, but inconsistency in the *metaphysics*.

  ### 5. Summary and Suggested Terminology
  To answer your specific question: **No, there is no single, universally recognized technical term that isolates exactly this pattern of shifting criteria.**

  However, if you were discussing this in a philosophical context, the most precise way to describe it would be:

  > **"Unprincipled variation in persistence conditions."**

  Or, if you wish to highlight the methodological flaw:

  > **"Ad hoc adjustment of identity criteria to accommodate folk intuitions."**

  **The Boundary You Asked For:**
  The boundary between this "shifting habit" and the legitimate view (Sortal Relativism) is **Explanatory Depth**.
  *   **Legitimate:** "Statues and planes have different criteria *because* statues are defined by aesthetic form, while planes are defined by functional continuity. Here is the theory of artifacts that explains why."
  *   **The Habit You Noticed:** "Statues and planes have different criteria *because* that is what we feel is right in each case, and we will not provide a unified theory of artifacts that covers both."

  ### A Note from the "Other Side"
  As a scientist, you may appreciate that many professional metaphysicians agree with you. This inconsistency is one of the primary motivations for **Four-Dimensionalism (Perdurantism)**.

  Philosophers like W.V.O. Quine, David Lewis, and Ted Sider argue that the "shifting" you observe proves that our common-sense concept of identity is flawed. They propose that objects are not 3D things persisting through time, but 4D "spacetime worms."
  *   In the statue case, the "statue-worm" is a temporal part of the "clay-worm."
  *   In the aircraft case, the "maintained-aircraft-worm" and the "reassembled-aircraft-worm" are two different 4D objects that share early temporal parts.

  By adopting this view, they eliminate the need to shift criteria. The criteria remain constant (spatiotemporal continuity of parts), and the "shifting" you observe is reclassified as a linguistic ambiguity about which "worm" we are referring to.

  ### Conclusion
  You have not missed a term; you have identified a methodological friction point. The habit is best described as **ad hoc criterion shifting** driven by **pre-theoretic intuition**, and it stands in contrast to **principled sortal relativism**. Your scientific instinct that a unified theory should govern both cases is shared by a significant faction of contemporary metaphysicians who seek to replace these shifting intuitions with a systematic ontology.
