  1. The Scenario
  In the archives of a major metropolitan museum, a verified dossier from the deceased Expressionist painter Elara Vance details the exact pigment chemistry, underdrawing grid, and brushstroke sequence for her destroyed masterpiece, *Vermilion Horizon*. The museum's conservation team utilizes these instructions to fabricate Object R, cataloging and displaying it as the definitive ontological instance of *Vermilion Horizon* restored, despite acknowledging the physical execution is contemporary. Simultaneously, an unaffiliated artisan produces Object F using independent technical analysis to achieve perceptual identity with *Vermilion Horizon*, marketing it transparently as a high-fidelity copy with no claim to authorization or original status. Both Object R and Object F lack Vance's physical touch and are perceptually indistinguishable from the lost original, yet Object R claims the identity of the work through instructional authority, while Object F claims only the status of a derivative artifact, creating a triad of objects that isolates physical genesis, instructional intent, and representational honesty within a standard institutional context.

  2. Verdict Mapping
  The deception-based account assigns full artistic value to Object F but denies it to Object R. Because Object F is marketed openly as a copy, there is no fraudulent misrepresentation of its history or origin, removing the moral and epistemic stain that typically devalues forgeries; however, Object R is presented as the work itself, which constitutes a deceptive claim regarding numerical identity since the object did not originate in Vance's lifetime. Consequently, this account validates the open copy while penalizing the authorized reconstruction for falsifying the work's historical timeline. In contrast, the achieved-intention account assigns full value to Object R but denies it to Object F. Since Vance's archived instructions specify the exact material realization she intended, the conservation team's execution fulfills her artistic will, making Object R a legitimate vessel of her intention; Object F, however, realizes only the copyist's intention to mimic, failing to embody Vance's creative agency. Here, the divergence is sharp: the deception account penalizes R for its identity claim, while the intention account rewards R for its instructional fidelity.

  The causal-connection account assigns diminished value to both Object R and Object F, distinguishing itself from the deception-based account regarding Object F. This theory holds that artistic value is inextricably linked to the physical chain of production originating from the artist's hand; since neither object was touched by Vance, both lack the requisite causal history to command the value of an original. This creates a direct conflict with the deception-based account on Object F: where the deception account sees an honest copy as valuable (no fraud), the causal account sees a physically disconnected artifact as inherently deficient (no genesis). Thus, while the deception account splits R and F based on honesty, and the intention account splits them based on authority, the causal account lumps them together based on physical origin, failing to recognize the normative difference between an authorized reconstruction and an unauthorized copy.

  3. Isolation Analysis
  The single structural feature forcing these explanations apart is the decoupling of *instructional authority* from *physical genesis* and *identity claims*. By granting Object R the artist's verified instructions (satisfying Intentionalism) but denying her physical touch (satisfying Causalism) while asserting numerical identity (triggering Deceptionism), the scenario prevents any single variable from correlating perfectly with value. If Object R were labeled merely as a "copy" like Object F, the deception-based and achieved-intention accounts would converge on high value (no fraud, intent realized), collapsing the distinction on Object R. Conversely, if Object F were sold deceptively, the causal and deception accounts would converge on low value (no touch, plus fraud), collapsing the distinction on Object F. The scenario maintains the split only because R claims identity without touch, and F claims copyhood without touch.

  4. Robustness Check
  If the forger sells Object F deceptively rather than openly, the deception-based account and the causal-connection account now converge on a verdict of low value for Object F. Both theories would agree that Object F is deficient: the causal account because the artist did not execute it, and the deception account because the buyer was defrauded regarding its origin. However, the achieved-intention account remains split from both, still assigning low value to Object F because the artist's intention was not realized, but for a different reason (lack of authorization rather than fraud or physics). While this modification aligns the deception and causal theories, it fails to isolate the intended variable regarding Object F, as the disagreement between deception and causality disappears when fraud is introduced; the case loses its power to distinguish whether the value loss in standard forgeries is due to the lie or the lack of physical contact.

  5. Defense of the Disadvantaged View
  A proponent of the causal-connection account, which fares worst by inability to distinguish Object R from Object F, would attack the legitimacy of the case by arguing that "instructions" are merely data, not art, and that aesthetic value emerges exclusively from the performative event of the artist's physical engagement with the medium. They would contend that treating Object R as distinct from Object F begs the question by assuming artistic intention can be disembodied from the artist's hand, whereas true authenticity requires the trace of the creator's specific motor decisions which instructions cannot capture. This attack succeeds without begging the question only if one accepts a performance-based ontology of art; if one accepts a platonic or structuralist ontology where the work is defined by its instructions, the attack fails, but within the causal framework, the refusal to distinguish R from F is a consistent commitment to the necessity of physical genesis rather than an oversight.
