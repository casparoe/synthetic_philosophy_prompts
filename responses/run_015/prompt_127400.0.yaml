      *   Check the "two years alone" constraint: Emphasize tractability via thought experiments and formal logic, not empirical data.

  8.  **Self-Correction during drafting:** I initially thought about putting "Value Ontology" first. But reconsidering: If I define the lexical threshold as "that which destroys the capacity to value," I don't need to know if pain is one-dimensional. I just need to know if the destruction of valuing capacity is comparable across minds. That's a functional question, not a phenomenal one. So, Threshold Definition is definitely #1.

  9.  **Finalizing the Output Structure:**
      *   Introduction: Acknowledge the depth of the "Inter-modality Problem."
      *   The Ranking (1, 2, 3, Drop).
      *   Detailed Reasoning for each.
      *   Direct Answers to the specific sub-questions (Scale vs. Modality, Salvageability).
      *   Conclusion: The strategic pivot.

