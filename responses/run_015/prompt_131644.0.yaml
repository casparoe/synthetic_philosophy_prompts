answer: |-
  ### Part 1: Operational Distinctions

  Before we get to the checklist, we need to strip the philosophical concepts down to what you can actually ask in a meeting room. Here is how we translate the theory into operational gates.

  1.  **Aesthetic Autonomy → Dependency Test.**
      *   *Theory:* The work stands alone.
      *   *Operation:* Does understanding or appreciating this work *require* knowledge of the artist's biography or intent? If the answer is "Yes," autonomy is low. If the work collapses without the artist's story, you cannot separate them.
  2.  **Moral Taint Transmission → Financial & Platform Flow.**
      *   *Theory:* Badness sticks to the object.
      *   *Operation:* Does this transaction directly fund the accused? Does this platform directly rehabilitate their reputation? Money is easier to track than 'taint'. If funds go to the artist (not a charity, not a seized asset), the institution is complicit.
  3.  **Institutional Complicity → Signal Test.**
      *   *Theory:* We become accomplices.
      *   *Operation:* If a victim walked into the gallery, would this acquisition look like a betrayal? This is about public signal, not private intent.
  4.  **Epistemic Contamination → Cognitive Dissonance Test.**
      *   *Theory:* Viewing requires suppressing harm.
      *   *Operation:* To enjoy the formal properties (colour, composition), must the viewer actively ignore how the work was made or who made it? If appreciating the beauty requires ignoring the suffering, the work is epistemically contaminated.

  ---

  ### Part 2: The Acquisitions Ethics Protocol (45-Minute Version)

  **Instructions:** Complete this sheet for every proposal involving an artist with public moral allegations. Do not skip gates. If a gate triggers a 'STOP', the proposal is rejected. If it triggers 'HAND-OFF', it goes to the Director with this sheet attached.

  **Case Reference:** _______________
  **Date:** _______________
  **Committee Members Present:** _______________

  #### Gate 1: Legal and Safety Baseline
  *   **Question:** Are there active legal restrictions (court orders, sanctions) preventing this transaction, or is there a credible threat of physical disruption to the venue (protests, safety risks)?
  *   **Yes:** **STOP.** Reject proposal. (Reason: Legal/Safety).
  *   **No:** Proceed to Gate 2.

  #### Gate 2: Financial Complicity (The Money Gate)
  *   **Question:** Is this an **acquisition** (not a loan) where purchase funds (or secondary market royalties) will flow directly to the artist or their controlled estate?
  *   **Yes:** **STOP.** Reject proposal. (Reason: Direct financial enablement).
      *   *Note:* This applies even if the art is abstract/non-narrative. Money is fungible; it funds the person, not the canvas.
  *   **No:** (e.g., it is a loan, or funds go to a third party/charity): Proceed to Gate 3.

  #### Gate 3: Constitutive Harm (The Making Gate)
  *   **Question:** Was the alleged harmful behaviour **necessary** to create this specific work? (e.g., manipulation to gain access, coercion of subjects, unsafe conditions during production).
  *   **Yes:** **STOP.** Reject proposal. (Reason: The harm is embedded in the object).
  *   **No:** (e.g., the harm happened in the artist's private life, unrelated to production): Proceed to Gate 4.

  #### Gate 4: Thematic Dissonance (The Content Gate)
  *   **Question:** Does the subject matter of the work directly contradict or trivialise the nature of the alleged harm? (e.g., work about 'consent' by an abuser; work about 'honesty' by a fraudster).
  *   **Yes:** **HAND-OFF.** Send to Director. (Reason: High reputational risk requiring value judgement).
      *   *Instruction to Committee:* Note below whether the work critiques the harm or repeats it.
  *   **No:** (e.g., work is abstract, or thematically neutral): Proceed to Gate 5.

  #### Gate 5: Epistemic Burden (The Viewing Gate)
  *   **Question:** Will a viewer need to suppress knowledge of the artist's behaviour to appreciate the formal properties of the work? (i.e., Is it cognitively dissonant to admire the aesthetics while knowing the context?)
  *   **Yes:** **HAND-OFF.** Send to Director. (Reason: Ethical friction affects reception).
  *   **No:** **PASS.** Recommendation to Acquire/Loan.

  **Director Sign-off Required?** [ ] Yes [ ] No
  **Committee Recommendation:** [ ] Acquire [ ] Loan [ ] Reject

  ---

  ### Part 3: Stress-Testing the Protocol

  Here is how the protocol runs against your three hard cases. I have applied the logic strictly.

  #### Case (a): The Abstract Painter (Convicted Fraud)
  *   **Proposal:** Acquisition of large-scale canvases. No narrative content.
  *   **Gate 1 (Legal):** No active restrictions. **Pass.**
  *   **Gate 2 (Financial):** Acquisition funds go to the artist (or estate). **YES.**
  *   **Outcome:** **STOP. REJECT.**
  *   **Why this bites:** You will likely dislike this. The art is 'innocent'; it carries no narrative of the fraud. Aesthetically, it is autonomous. But the protocol prioritises *institutional complicity* over *aesthetic autonomy*. It forces you to admit that buying the painting funds the fraudster, regardless of what the painting depicts. It blocks the "separate the art" argument at the financial threshold.

  #### Case (b): The Sculptor (Accused Coercive Abuse)
  *   **Proposal:** Loan of new installation explicitly about power dynamics and consent.
  *   **Gate 1 (Legal):** No restrictions. **Pass.**
  *   **Gate 2 (Financial):** It is a loan. No acquisition funds to artist. **Pass.**
  *   **Gate 3 (Constitutive):** The sculpture was made in a studio; abuse allegations are interpersonal, not required for the sculpting. **Pass.**
  *   **Gate 4 (Thematic):** Work is about 'consent'. Allegations are about 'coercion'. This is a direct clash. **YES.**
  *   **Outcome:** **HAND-OFF to Director.**
  *   **Why this is tricky:** The protocol does not reject this automatically. It recognises that showing work *about* abuse by an abuser could be a powerful critique OR a grotesque irony. That is a curatorial judgement, not a logical binary. The committee records the risk; the Director takes the heat.

  #### Case (c): The Photographer (Manipulation for Access)
  *   **Proposal:** Acquisition of intimate portrait series.
  *   **Gate 1 (Legal):** No restrictions. **Pass.**
  *   **Gate 2 (Financial):** Acquisition funds to artist. **YES.**
  *   **Outcome:** **STOP. REJECT.**
  *   *Wait, let's look deeper.* Even if it were a loan (Gate 2 Pass):
  *   **Gate 3 (Constitutive):** Access was obtained *through* manipulation. The photos exist *because* of the harm. **YES.**
  *   **Outcome:** **STOP. REJECT.**
  *   **Why this bites:** The work is "technically brilliant." Committees often want to preserve "important art." This protocol says if the harm is constitutive (the photo *is* the evidence of manipulation), the object is tainted beyond use. You cannot separate the image from the method of capture.

  **The Dislikeable Outcome:**
  I suspect **Case (a)** will be the one you dislike most. Committees often feel comfortable rejecting the photographer (c) because the harm is visible in the process, and the sculptor (b) is too risky anyway. But the abstract painter (a) feels like 'safe' art. Rejecting it because of money feels bureaucratic and philistine to some members. It forces you to prioritise ethics over aesthetics even when the aesthetics seem morally neutral. That is the framework biting.

  ---

  ### Part 4: Limitations and Honest Gaps

  This procedure is a tool, not a moral oracle. Here is where it will misfire, and what you need to tell your Director.

  **1. The "Unproven Allegation" Gap**
  The protocol assumes a baseline of fact (e.g., "convicted", "allegedly obtained"). It cannot adjudicate truth. If an allegation is viral but unproven, Gate 1 might pass, but public outrage (Signal Test) could still burn the centre. The protocol treats ethics as internal consistency; it cannot model external mob dynamics. If the public decides you are guilty, this checklist won't save you.

  **2. The "Dead Artist" Loophole**
  Gate 2 stops funds going to the *artist*. If the artist is dead, funds go to an estate. Sometimes estates are managed by enablers; sometimes they donate to charity. The protocol treats "Estate" as "No Direct Funding," but morally, rehabilitating a dead abuser's legacy can be just as harmful as funding a living one. You will need a side-conversation about legacy management.

  **3. The "Curatorial Mitigation" Blindspot**
  The protocol is binary (Stop/Hand-off/Pass). It cannot account for *how* you show the work. In Case (b), the Sculptor, the ethical weight depends entirely on the wall text. If you label it "Masterpiece of Consent," it's offensive. If you label it "Work by Accused Abuser Regarding Power," it's critique. The protocol flags the risk but cannot evaluate the mitigation strategy. That is entirely on the Director.

  **4. It Cannot Reproduce "Moral Luck"**
  The protocol treats similar harms equally. But society does not. A financial fraudster (a) might be culturally rehabilitated in five years; a sexual abuser (b) might never be. The protocol treats both as "Harm." It cannot predict which harm the public will forgive. You are building a consistent ethical stance, not a PR strategy. If you want consistency, use this. If you want safety, follow the news cycle instead.

  **Final Advice:**
  Use this to clear your conscience, not to clear your risk. If you follow this and still get protested, you can say you followed a rigorous ethical procedure. If you ignore it and get protested, you just look complicit. Run the clock, fill the sheet, and let the Director sign the hard calls.
