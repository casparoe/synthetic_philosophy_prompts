answer: |-
  Here is an analysis of the situation based on the notes you have provided. I have written this in American English as requested, and I have kept the language plain so it is easy to follow.

  ### The Three Rules Hidden in the Past Decisions

  Looking at the four past referenda (the pool, the school, the car park, and the budget), the working group does not seem to be following one single written law. Instead, they seem to be balancing three different principles. Each of these principles fits the past record, but they point in different directions for your new case.

  **Rule 1: The "Bright Line" Rule (Geography)**
  This rule says: *You vote if you live inside the official boundary.*
  *   **Evidence:** This was the main reason for excluding the car park commuters and the holiday home owners. The group explicitly said that if you try to vote based on who is "affected," you can draw the line anywhere, which is too messy.
  *   **Strength:** It is clear and easy to administer. You either live there or you don't.

  **Rule 2: The "Direct Consequence" Rule (Impact)**
  This rule says: *You vote if the decision changes your daily life physically.*
  *   **Evidence:** This explains why they let the hamlet residents vote on the school merger (their kids would be bussed twelve miles) and why they added prisoners and 16-year-olds to the pool vote (they use the facility).
  *   **Strength:** It feels fairer because it gives a voice to people who actually suffer or benefit from the result.

  **Rule 3: The "Lived Experience" Rule (Presence)**
  This rule says: *You vote if you are physically present in the community day-to-day.*
  *   **Evidence:** This is why holiday home owners were excluded (they pay tax but aren't there) and why non-British residents were included (they live there). It focuses on "belonging" to the daily rhythm of the town rather than just owning property or having a legal passport.
  *   **Strength:** It protects the community's character from outside investors or absentees.

  ### How Each Rule Predicts the New Case

  Here is how each of those three rules would handle the specific groups you mentioned regarding the groundwater licence.

  | Group | Rule 1: Bright Line (Geography) | Rule 2: Direct Consequence (Impact) | Rule 3: Lived Experience (Presence) |
  | :--- | :--- | :--- | :--- |
  | **The 3 Villages** | **No Vote.** They are in a different parish and district. | **Yes Vote.** Their wells will dry up. This is a severe physical impact. | **No Vote.** They do not live in the town's daily rhythm. |
  | **The Veto Request** | **No.** A veto changes how votes count, not who votes. Past referenda used simple majorities. | **No.** Even if they vote, a veto gives one group power over the whole. No precedent for this. | **No.** Same as above. |
  | **40% Weighting** | **No.** "One person, one vote" is the standard. Weighting is complex and unseen in past notes. | **Maybe.** If impact is the goal, weighting ensures the affected aren't drowned out. But no past precedent. | **No.** Weighting undermines the idea of equal community membership. |
  | **Unaffected Estate** (Inside Boundary) | **Yes Vote.** They are residents inside the line. | **No Vote.** Their water is metered; they are not affected. | **Yes Vote.** They live in the town day-to-day, even if this specific issue misses them. |
  | **Future Residents** | **No Vote.** They do not exist on the voter list yet. | **No Vote.** You cannot vote on future harm you haven't experienced yet. | **No Vote.** They are not part of the current community. |
  | **Plant Workers** | **No Vote.** Unless they live in town, they are commuters (see Car Park case). | **No Vote.** Economic interest was rejected in the Car Park case. | **No Vote.** They work there, but don't "live" the town life. |

  ### My Best Guess on What They Will Do

  If I had to place a bet, I believe the working group will follow **Rule 1: The Bright Line (Geography)**.

  **Why?**
  1.  **The "Car Park" Precedent is Strong:** The note from the car park decision is the most philosophical statement they have made: *"Once you pick the electorate by who is affected, you can draw the line wherever you like."* This shows they are afraid of setting a precedent where they have to measure "impact" for every single vote. It is too much work and too open to argument.
  2.  **Administrative Safety:** Allowing the three villages to vote creates a problem. If those villages get a vote on the water, do they get a vote on the town's budget next? Do they get a vote on the school? The group dissented on the school merger specifically because it "opened the floodgates." They will likely want to close those floodgates now.
  3.  **The "Town" Nature of the Vote:** The referendum is asking if the *Town Council* should object. Technically, the Council represents the town residents, not the neighboring parishes. Even if the town residents are on mains water, the Council is accountable to them.

  **However, there is a major problem.**
  Under the "Direct Consequence" rule, the town residents *should not vote* because they are not affected. Under the "Bright Line" rule, the villagers *cannot vote* even though they are the only ones affected. This leaves you with a situation where the people voting have no stake in the outcome, and the people with the stake have no vote.

  Despite this unfairness, I predict they will allow the **Unaffected Estate** and other town residents to vote, and exclude the **Three Villages**. They will likely reject the **Veto** and the **Weighting** because those require changing the voting system itself, not just the voter list, and they have never done that before.

  ### What This Choice Commits Them To

  If they choose the **Bright Line (Geography)** rule (my prediction):
  *   **Commitment:** They commit to the idea that local democracy is about *place*, not *consequence*. In the future, the town can vote on projects that harm neighbors (like a noisy road or a polluting factory) without the neighbors having a say.
  *   **Risk:** It makes the town look selfish. It suggests the council believes its authority stops at the border, even if its physical actions do not.

  If they choose the **Direct Consequence (Impact)** rule:
  *   **Commitment:** They commit to investigating the "ripple effects" of every future proposal. They would have to ask, "Who else is hurt by this?" for every single vote.
  *   **Risk:** It creates the "floodgate" problem. If the water villagers get to vote, why not the people downwind of a new factory? Why not the people who drive through the town? The voter list could become huge and unmanageable.

  If they choose the **Lived Experience** rule:
  *   **Commitment:** They focus on who "belongs."
  *   **Risk:** It is vague. "Belonging" is harder to prove than an address or a dry well.

  ### The One Test Case to Tell the Rules Apart

  You mentioned thinking about people who move in after the decision. That is a good test for *time*, but it does not solve your current problem, which is about *space* and *impact*.

  To truly tell which rule the group follows, you would need to put this specific case in front of them:

  **The "Smelly Border" Test:**
  Imagine a proposal to build a sewage treatment plant right on the edge of town.
  *   **The Setup:** The prevailing wind blows the smell *only* to the neighboring village. The town residents smell nothing. The town gets a fee from the plant; the village gets nothing but the odor.
  *   **The Question:** Who gets to vote on whether the plant is built?

  **Why this works:**
  *   If they let the **Village** vote, they have admitted that **Impact** matters more than Geography. This would support your brother-in-law's case for the water referendum.
  *   If they let the **Town** vote (despite smelling nothing), they have admitted that **Geography** matters more than Impact. This confirms my prediction that the villages will be excluded from your water vote.
  *   If they let **Both** vote, they are trying to compromise, which suggests they don't have a firm rule at all.

  ### A Note on the Veto and Weighting

  I want to be honest about the request for a veto and the 40% weighting. Based on your notes, the working group decides *who* is on the list, not *how* the votes are counted.
  *   **The Veto:** This effectively gives one group a "double vote" (they can say yes, but also stop a no). There is no precedent for this in your notes. It is highly unlikely they will agree to this.
  *   **The 40% Weighting:** This is also a change to the counting system, not just the list. While it tries to balance the numbers, it complicates the "one person, one vote" principle. The group prefers simple rules (like the resident list). I do not think they will accept this.

  ### Summary

  Your brother-in-law's situation is difficult because the precedents pull in opposite directions. The **School Case** suggests outsiders can vote if the impact is severe. But the **Car Park Case** suggests outsiders cannot vote because drawing the line is too hard.

  Because the Car Park reasoning was so explicitly stated ("you can draw the line wherever you like"), I believe the group will use that to protect themselves from having to measure impact in the future. They will likely keep the vote inside the town boundary, even though it means the people most affected cannot vote.

  If you want to argue for the villages, do not argue about "fairness." Argue about the **School Precedent**. Remind them that they broke the boundary rule once before for the hamlet because the consequence (bussing kids) was concrete and unavoidable. Drying up a well is also concrete and unavoidable. If they say no to the villages, ask them to explain the difference between a twelve-mile bus ride and a dry water supply. Force them to choose between their two past selves.
