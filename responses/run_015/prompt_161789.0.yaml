  Dear Julian,

  I know you were unable to attend the preliminary hearing before the Simulation Ethics Board today, but I wanted to recount a conversation I witnessed in the waiting room outside the chamber that I think you would have found invaluable for our upcoming paper on epistemic liability. While we waited for the panel to convene, I found myself seated between Elias, who is advising the Board on behalf of the Moorean position, and Sarah, who is representing the skeptical consortium. The air in the room was sterile and quiet, yet the tension between them was palpable as they began to rehearse their opening statements, effectively turning the waiting area into an impromptu seminar on the applicability of classical proofs of an external world to full-immersion simulation dwellers.

  Sarah opened the exchange by leaning forward and noting that the core issue for the Board was not merely whether a simulated subject feels certainty, but whether the premises of their reasoning map onto mind-independent reality. She argued that when a person living entirely within a haptic virtual environment holds up their hands and asserts, Here is one hand, and here is another, they are making a category error. She pressed the point that a simulated hand is composed of code and rendered photons, not biological tissue, and therefore the premise is false if understood in the standard material sense. She insisted that the skeptic does not deny the subject has the experience of hands, but rather denies that the experience warrants the conclusion that a material external world exists. For Sarah, the simulation hypothesis undermines the proof because the subject could go through the exact same motions while being a brain in a vat, disconnected from any physical reality, meaning the proof fails to bridge the gap between appearance and ontological fact.

  Elias listened patiently and responded by challenging the demand for that specific bridge. He reminded Sarah that the structure of the proof relies on the certainty of the premises outweighing the certainty of the skeptical hypothesis. He argued that even within a simulation, the virtual hands are external to the perceiver's mind. They are objects that resist the will, obey physics engines, and exist independently of the subject's immediate whim, which satisfies the crucial distinction between internal mental states and external objects. Elias contended that the proof establishes realism versus idealism, not necessarily base-level materialism versus simulation. He suggested that for the purposes of the Board, establishing that the subject is interacting with a world external to their own consciousness is sufficient to grant them ethical standing, regardless of whether that world is made of atoms or bits.

  Sarah countered this by sharpening her objection regarding reference and begging the question. She pointed out that if the subject is in a simulation, the word hand in their mouth refers to a virtual construct, not a material object, and thus the conclusion An external world exists is equivocal. She argued that Elias was smuggling in the assumption that virtual externality is enough, which precisely begs the question against the simulation hypothesis that the Board is tasked with investigating. She emphasized that a brain in a vat could say, Here is a hand, and be wrong about the existence of a hand in the relevant sense, so using that assertion to prove the world is not a simulation is circular. She insisted that the Board needs to know if the subjects are connected to the shared material reality that the regulators inhabit, not just a private or server-based reality, and Moore's proof cannot guarantee that connection without assuming the very thing it is supposed to prove.

  Elias replied by doubling down on the epistemic weight of common sense premises. He acknowledged that the proof does not rule out the simulation hypothesis logically, but he argued that it is more rational to accept the existence of the hands than to accept the complex hypothesis that one is being deceived by a simulation. He suggested that the demand for a non-question-begging argument against skepticism sets an impossibly high bar that paralyzes all reasoning. Elias posited that the virtual hands are still real objects within the causal network the subject inhabits, and therefore the proof successfully establishes an external world of some kind, which is the necessary condition for ethical consideration. He argued that if the Board rejects the proof because the hands are virtual, they are effectively demanding that the subject prove they are not simulated before they can be allowed to claim knowledge of their environment, which is a requirement no human outside the simulation could meet either.

  Sarah conceded that the demand for absolute certainty might be too high, but she maintained that the specific nature of the externality matters for regulatory purposes. She argued that if the hands are virtual, the consequences of actions taken with them are also virtual, and thus the proof fails to establish the kind of moral stakes the Board is designed to oversee. She pressed the worry that accepting Elias's view would grant full ethical agency to entities that might merely be processing algorithms without genuine contact with the suffering or pleasure of material beings. She insisted that the proof must establish contact with mind-independent material reality to be useful for the Board, and since a simulated hand is mind-dependent in the broader sense of being dependent on the simulator's mind, the proof collapses.

  Elias closed the exchange before the door opened by suggesting that the distinction between mind-independent material reality and mind-independent simulated reality is itself a metaphysical assumption that the subject cannot be expected to verify from the inside. He argued that the proof works because it anchors the subject in a reality that is not their own solipsistic creation, which is the only kind of external world they can ever know. He suggested that the Board should accept that the proof establishes the necessary realism for ethical engagement, even if the ontology of that realism is layered. Sarah nodded but maintained that without knowing the layer, the Board cannot assess liability, leaving them at an impasse as the clerk called them into the chamber.

  I will let you know how the Board rules on the admissibility of the proof once the session concludes, but I thought you would appreciate the clarity with which both sides articulated the tension between epistemic certainty and ontological depth. It seems clear that the decision will hinge on whether the Board values the subjective certainty of the external or the objective nature of the material, and neither side seemed willing to yield that ground. I hope this account helps you finalize your section on the limits of testimonial evidence in simulated environments, and I will send over the transcript of the hearing as soon as it is released.

  Best regards,

  Alex
