answer: |-
  You have put your finger on a very specific, highly frustrating, and structurally significant maneuver in meta-ethics and value theory. While there is no single, canonical Greek-labeled fallacy for this exact oscillation, it is a recognized composite of several logical and rhetorical issues.

  The established terms that get *close* but don't quite capture the specific loop you described are:

  1.  **The Heterogeneity Problem:** This names the *premise* (that pleasures feel different), but not the *defensive maneuvering* you are observing.
  2.  **The No-True-Scotsman Fallacy:** This captures the "shrinking" phase ("That's not *real* pleasure"), but misses the initial "stretching" phase used to broaden the theory's appeal.
  3.  **Ad Hoc Rescue:** This describes the motivation (saving the theory from falsification), but doesn't describe the *mechanism* (conceptual elasticity).
  4.  **The Naturalistic Fallacy (Moore):** This is the underlying error (defining "good" as "pleasure" while secretly defining "pleasure" as "good"), but it doesn't name the rhetorical back-and-forth.

  Because this specific oscillation—stretching the definition to capture scope, then shrinking it to preserve purity—is distinct from simple ambiguity, I propose we coin the term **Defensive Axiological Elasticity**.

  Here is the breakdown of what this phenomenon is, what it isn't, and how to spot the boundary between legitimate refinement and this fallacy.

  ### 1. The Name: Defensive Axiological Elasticity
  *   **Defensive:** The shifts are not made to clarify the concept for its own sake, but specifically to parry objections.
  *   **Axiological:** It pertains to value theory (the study of good/bad/pleasure).
  *   **Elasticity:** The concept stretches to encompass "high" goods (solidarity, truth) and snaps back to exclude "low" goods (schadenfreude, base instincts) depending on the pressure applied.

  ### 2. The Mechanism of the Loop
  The loop operates in two distinct phases that protect Hedonism from being either too narrow (implausible) or too broad (normatively dangerous).

  *   **Phase 1: Expansion (The Scope Move).**
      *   *Trigger:* The critic says, "Hedonism is a philosophy for swine; it ignores higher human goods like knowledge or virtue."
      *   *Response:* The hedonist stretches the definition of pleasure. "Pleasure isn't just sensory; it's 'deep satisfaction,' 'flow,' or 'attitudinal enjoyment'."
      *   *Goal:* To make Hedonism **plausible** by ensuring it covers everything we intuitively think is good.
  *   **Phase 2: Contraction (The Purity Move).**
      *   *Trigger:* The critic says, "If pleasure is just satisfaction, then the sadist's satisfaction counts. Is sadism good?"
      *   *Response:* The hedonist shrinks the definition. "No, that's not *true* pleasure; that's mere gratification/illusion/corruption."
      *   *Goal:* To make Hedonism **normatively safe** by ensuring it excludes everything we intuitively think is bad.

  **The Result:** "Pleasure" becomes a placeholder for "Things we approve of," rendering the theory "Pleasure is the Good" tautological (The Good is the Good).

  ### 3. What It Is Not (The Boundaries)

  To distinguish **Defensive Axiological Elasticity** from legitimate philosophical work, you must look at **independent criteria**.

  #### It is not *The Heterogeneity Problem*
  *   **Heterogeneity** is the observation that eating chocolate and solving a proof feel different. Acknowledging this is honest.
  *   **Elasticity** is claiming they are the *same thing* (pleasure) when it suits the theory, and *different things* (pleasure vs. gratification) when it suits the theory.

  #### It is not *Conceptual Refinement*
  Legitimate refinement happens when a philosopher realizes their initial definition was imprecise and tightens it using **independent criteria**.
  *   **Legitimate:** "We initially thought pleasure was sensory, but neurological data shows 'satisfaction' activates different pathways. We need two categories." (The criteria come from outside the moral judgment).
  *   **Elasticity:** "We need to call this pleasure because it's good, and not call that pleasure because it's bad." (The criteria come from the desired moral conclusion).

  #### It is not simple *Equivocation*
  Equivocation is usually accidental or sloppy. Defensive Axiological Elasticity is often **strategic**. The arguer knows that if they hold the definition static, their theory collapses, so they toggle the definition dynamically to keep the theory afloat.

  ### 4. How to Spot the Boundary (The Falsifiability Test)
  The boundary between legitimate refinement and Defensive Axiological Elasticity lies in **falsifiability**.

  *   **Legitimate Refinement:** The philosopher provides a criterion for "real pleasure" that *could* theoretically apply to something they morally dislike.
      *   *Example:* "Real pleasure requires long-term well-being." (A sadist *could* theoretically have long-term well-being, but doesn't. The criterion is independent).
  *   **Defensive Elasticity:** The criterion for "real pleasure" is inextricably linked to the moral value itself.
      *   *Example:* "Real pleasure is that which contributes to the good." (Now you can't identify pleasure without first knowing what is good. The theory "Pleasure is the Good" is now empty).

  ### Summary for Argumentation
  When you encounter this loop, you can name it to halt the oscillation.

  > "You are engaging in **Defensive Axiological Elasticity**. You are stretching the definition of pleasure to include 'higher goods' so your theory has scope, but shrinking it to exclude 'bad satisfactions' so your theory has normative force. Unless you can provide a criterion for 'real pleasure' that is independent of whether you morally approve of the outcome, you aren't arguing for Hedonism; you're arguing for a tautology where 'Pleasure' just means 'The Good'."

  This distinguishes your critique from the standard Heterogeneity Objection by targeting the *rhetorical maneuver* rather than just the *phenomenological fact*. It forces the hedonist to stop bouncing between definitions and commit to a single, falsifiable standard.
