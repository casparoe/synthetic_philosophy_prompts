answer: |-
  Here is the specification you requested, framed for a stratigrapher evaluating a method of reconstruction where the primary data is reworked and the control set is missing.

  ### I. The Specification: Desiderata for Criteria of Authenticity

  Below are the requirements any criterion must satisfy to count as evidence, ranked by their logical necessity. I have distinguished between **Non-Negotiable** (logical prerequisites for historical inquiry) and **Camp Preferences** (methodological choices that privilege certain outcomes).

  **1. Contextual Plausibility (Non-Negotiable)**
  *   **Requirement:** The tradition must be intelligible within the linguistic, cultural, and religious matrix of first-century Palestine.
  *   **Case:** A stratigraphic layer cannot contain fossils from a different epoch. If a saying reflects later Gentile church concerns or anachronistic theology, it is reworked material.
  *   **Status:** Non-Negotiable. Without this, the reconstruction is fantasy.

  **2. Probability Movement (Non-Negotiable)**
  *   **Requirement:** A criterion must be able to raise the probability that a tradition originates with Jesus ($P(J|T)$) above the baseline probability that it originates with the early Church ($P(C|T)$). It cannot merely lower $P(C|T)$.
  *   **Case:** In geology, a marker bed is useful only if it positively identifies a horizon, not just if it rules out others. If a criterion only acts as a veto (e.g., "The Church wouldn't invent this"), it establishes only that the tradition is *old*, not that it is *Jesus'*.
  *   **Status:** Non-Negotiable for claims of authenticity. Negotiable if the goal is merely to identify pre-Gospel tradition.

  **3. Model Independence (Non-Negotiable)**
  *   **Requirement:** The criterion must not rely on the very conclusion it seeks to prove. It cannot assume a specific model of transmission (e.g., "The Church only invented glory stories") to validate the data that builds the model.
  *   **Case:** This is the bootstrap problem. You cannot use the rock record to date the rock record without an independent clock.
  *   **Status:** Non-Negotiable. Violation renders the method circular.

  **4. Graded Output (Camp Preference)**
  *   **Requirement:** The criterion should output a likelihood ratio or confidence interval, not a binary "authentic/inauthentic" verdict.
  *   **Case:** Sedimentary records are rarely 100% pristine or 100% reworked; they are mixed.
  *   **Status:** Preference of the "critical/skeptical" camp. Traditional history often accepts binary verdicts, though Bayesian approaches prefer graded outputs.

  **5. Neutrality Regarding Confessional Claims (Camp Preference)**
  *   **Requirement:** The criterion must treat confessional material (e.g., resurrection claims) as methodologically suspect *a priori*.
  *   **Case:** This assumes that theological interpretation equals historical fabrication.
  *   **Status:** **Prejudice.** This is an anti-confessional bias dressed as method. A criterion should test consistency, not presuppose falsehood.

  ---

  ### II. The Calibration Set

  You asked for the control group against which these methods are run.

  *   **The Specification:** A valid method requires a body of material whose status (Jesus vs. Church) is known independently of the criteria themselves.
  *   **The Reality:** **There is no calibration set.** There are no contemporary, non-confessional records of Jesus's sayings. We have no "known authentic" sample to test the sensitivity of the criteria, and no "known inauthentic" sample (from the same period) to test specificity.
  *   **Defect or Feature:** This is an **unavoidable feature of the evidence**, not a defect in the criteria *per se*. However, it means the criteria cannot be "validated" in the scientific sense. They remain heuristic tools, not probative tests.
  *   **Implication:** Without calibration, the "error rate" of the criteria is unknown. In stratigraphy, a method that cannot be tested against known sections is considered speculative until it can be.

  ---

  ### III. Treatment of the Three Candidate Desiderata

  **1. The Asymmetry Problem (Negative vs. Positive Evidence)**
  *   **Verdict:** An adequate criterion **must** be able to move probability upward.
  *   **Analysis:** Criteria like *Embarrassment* and *Dissimilarity* are negative filters. They suggest the Church did not create the tradition. They do not prove Jesus did. The tradition could stem from a rival sect, a misunderstanding, or a pre-Jesus Jewish source.
  *   **Implication:** If the honest answer is that these criteria only fail to lower probability, then the strength of the conclusion is limited to: *"This tradition is not a creation of the later Evangelists."* It does not support the stronger claim: *"This tradition comes from Jesus."* Current scholarship often conflates these two.

  **2. The Bootstrap Problem (Model Dependence)**
  *   **Verdict:** A criterion must be able to test the transmission model, not assume it.
  *   **Analysis:** *Multiple Attestation* attempts to solve this by assuming independent sources imply higher reliability. However, if the sources are not actually independent (e.g., Matthew and Luke both using Mark), the criterion fails. Since dependence relations are disputed, the criterion often returns its input assumptions.
  *   **Requirement:** To avoid circularity, a criterion must allow for the possibility that the "Early Church" model is wrong. For example, if a criterion assumes the Church *would not* claim Jesus was baptized by John, but new evidence suggests they *would*, the criterion must update. Currently, most criteria hard-code the model.

  **3. The Incompatibility (Discontinuity vs. Intelligibility)**
  *   **The Conflict:**
      *   *Req A:* Jesus must be discontinuous with the Church (to prove authenticity).
      *   *Req B:* Jesus must be continuous with Judaism (to prove intelligibility).
  *   **The Judgment:** **Req A must be surrendered.**
  *   **Cost:** We lose the ability to isolate a "unique" Jesus distinct from his followers. We must accept that the Jesus we can historically access looks very much like the early Church's memory of him.
  *   **Reason:** A Jesus discontinuous from first-century Judaism is historically impossible (violates Req 1). A Jesus discontinuous from the Church is methodologically convenient but historically unnecessary. The movement arose *from* him; therefore, continuity is expected. Insisting on discontinuity creates an alien figure who cannot explain the effect (the Church).

  ---

  ### IV. Purpose Shifts

  The list of desiderata changes depending on the research goal.

  1.  **Goal: Authenticate Specific Sayings (Ipsissima Verba)**
      *   **List Change:** *Probability Movement* and *Model Independence* become paramount. *Neutrality* is often enforced.
      *   **Result:** The "authentic" corpus shrinks to near zero. The criteria are too blunt for this precision.
  2.  **Goal: Minimal Factual Biography**
      *   **List Change:** *Contextual Plausibility* becomes the primary filter. *Multiple Attestation* is weighted heavily.
      *   **Result:** A skeletal outline (baptized by John, crucified by Pilate) emerges. Criteria function better here.
  3.  **Goal: Explanation of the Movement's Rise**
      *   **List Change:** *Discontinuity* is dropped entirely. *Coherence* and *Plausibility* dominate.
      *   **Result:** The criteria shift from "sifting words" to "assessing impact." This is the most historically robust use of the method.

  ---

  ### V. Final Commitment and Ranking

  You asked me to rank the desiderata by how much they exclude, identify the violation, and commit to what these criteria actually are.

  **Ranking by Exclusivity (Most to Least Excluding):**
  1.  **Probability Movement (Positive Proof):** Excludes almost everything. Current criteria fail this.
  2.  **Model Independence:** Excludes most applications of Dissimilarity and Coherence (due to circularity).
  3.  **Contextual Plausibility:** Excludes anachronisms, but allows most tradition.
  4.  **Neutrality:** Excludes confessional interpretations (but is a prejudice).

  **The Flagrant Violation:**
  The current set of criteria most flagrantly violates **Probability Movement (Asymmetry)**. Scholars use negative criteria (Embarrassment, Dissimilarity) to draw positive conclusions (Authenticity). They treat a failure to disprove as proof. In your terms, they treat a layer that *lacks* reworking indicators as *positively* confirmed as primary depositional, ignoring the possibility of other secondary processes.

  **The Verdict:**
  The Criteria of Authenticity are **codifications of scholarly judgment dressed as method.**

  *   **Reasons:**
      1.  **Lack of Calibration:** They cannot be validated against a control set.
      2.  **Circularity:** They rely on a constructed model of "Early Church" to filter data used to build that model.
      3.  **Inconsistency:** They are applied selectively to yield results that fit the scholar's prior narrative (the "Jesus of the Criteria").
      4.  **Logical Asymmetry:** They function as falsification tools (good for removing obvious forgeries) but are marketed as verification tools (bad for confirming origin).

  *   **Confidence:** **High.** This reflects the current "memory turn" in historical Jesus studies (e.g., Chris Keith, Anthony Le Donne), which argues that the criteria are epistemologically bankrupt for isolating authentic units.

  *   **What Would Change My Mind:**
      1.  **Discovery of a Calibration Set:** If a cache of first-century notes or a non-confessional contemporary account were found allowing us to test the criteria's success rate.
      2.  **Formal Validation:** If a Bayesian model could be constructed showing that applying these criteria to *other* ancient biographical traditions (where we *do* know the truth) successfully isolates the historical subject's words from the biographer's invention. Until then, they remain heuristic guides, not scientific tests.

  **Summary for the Stratigrapher:**
  You are trying to reconstruct a depositional environment using only the reworked sediment, with no access to the source rock and no core samples from known environments to calibrate your tools. The current criteria are like trying to identify the source rock by saying, "This grain doesn't look like the surrounding matrix." That tells you it's exotic, but not where it came from. Treat them as indicators of *complexity*, not *origin*.
