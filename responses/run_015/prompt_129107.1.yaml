prompt: |-
  Construct a realistic, single-paragraph thought experiment—set in an ordinary clinical genetic-counseling or family-planning context, with no science-fiction technology, no perfect predictors, and stakes of the kind a normal person faces—in which Benatar's asymmetry between pleasure and pain for never-existent people delivers a verdict about a specific reproductive choice that conflicts with the verdict of a symmetric, person-affecting view weighing potential welfare equally regardless of actualization. Engineer the case so that the life in question has a clearly specified, modest net-positive profile that nonetheless contains non-trivial suffering, and so that Benatar's asymmetry condemns bringing that person into existence specifically because the absence of pain in non-existence counts as a good that existence undermines, while the presence of pleasure in existence fails to compensate because its absence in non-existence is not a harm. After presenting the scenario, demonstrate that the specification is met: state the reproductive choice at issue, identify the comparison each theory makes between existing with that profile and never existing, explain why Benatar gives his verdict and why the symmetric view gives the opposite one, point to the exact structural feature doing the work (the asymmetrical baseline comparison with non-existence), and then show how a defender of the symmetric view would attack the case—not by disputing the empirical life-profile, but by challenging the baseline treatment of never-existing as a state that can bear axiological weight.
