answer: |-
  This is an exceptionally sharp diagnosis of a classic stalemate in environmental ethics. You are correctly identifying that the seminar is stuck in a "conceptual crossfire" where participants are using the same vocabulary to fire at different targets.

  Here is a diagnosis of the stall, broken down by the layers of disagreement you identified, followed by a prescription for what would actually count as progress in your paper.

  ### 1. The Diagnosis: Three Layers of Disagreement

  You asked if this is verbal, formal, or bedrock. The answer is **all three, nested inside each other.** The debate stalls because participants think they are arguing on the bottom layer (facts/causation), but they are actually stuck on the top layer (normative frameworks), with a messy middle layer (modeling collective harm) obscuring the view.

  #### Layer A: The Semantic/Verbal Layer ("Contribute")
  You are right: the word "contribute" is doing double duty.
  *   **Side A (Causal Efficacy):** Uses "contribute" to mean *marginal causal impact.* Did my specific action change the state of the world (e.g., temperature, total cows slaughtered)? If the supply chain is inelastic, the answer is "no."
  *   **Side B (Complicity/Expression):** Uses "contribute" to mean *participation in a wrongful practice.* Did I align my will with a harmful system? Did I benefit from it? Here, the answer is "yes," regardless of marginal impact.

  **The Stall:** Side A thinks Side B is being irrational about math. Side B thinks Side A is being sociopathic about morality. They talk past each other because they haven't agreed on whether "harm" requires *causal difference-making* or merely *involvement.*

  #### Layer B: The Formal/Empirical Layer (Modeling Harm)
  There is a hidden formal disagreement here about how to model collective harm, specifically regarding **linearity vs. thresholds.**
  *   **The Linear Model (Side A's assumption):** Harm is additive. My burger adds $X$ CO2. $X$ is negligible. Therefore, harm is negligible.
  *   **The Threshold/Triggering Model:** Harm happens in chunks (e.g., a cow is killed only after 10,000 burgers are ordered).
      *   *The Problem:* If we are below the threshold, my burger causes *zero* actual harm. If we are exactly at the threshold, my burger causes *massive* harm (a whole cow).
      *   *The Expected Utility Bridge:* Philosophers like Mark Budolfson argue that while your *actual* impact is likely zero, your *expected* impact is the same as if you caused the average harm. Side A often ignores "expected value" and focuses on "actual outcome."
  *   **The Non-Aggregative Model (Your bridge analogy):** Some harms are structural. The bridge collapses not because of one car, but because the *practice* of driving on it became normalized. Here, the harm isn't the weight; it's the precedent.

  **The Stall:** Side A demands proof of *actual* causal chains. Side B intuitively understands *structural* or *expected* causal chains. Without agreeing on the model of harm, the math will never satisfy Side B, and the ethics will never satisfy Side A.

  #### Layer C: The Bedrock Normative Layer (Worldviews)
  This is the engine of the stalemate.
  *   **Consequentialism (Side A):** The moral value of an act is determined solely by its outcomes. No outcome difference = no moral difference.
  *   **Deontology/Virtue Ethics (Side B):** The moral value of an act is determined by duty, integrity, or character. Being the kind of person who flies less has value *independent* of the CO2 saved. This is the "moral purity" or "integrity" argument.

  **The Stall:** You cannot empirically prove a normative framework. Side A cannot prove to Side B that outcomes are all that matter, and Side B cannot prove to Side A that integrity matters independently of outcomes.

  ### 2. What Counts as Progress?

  Since you cannot resolve the bedrock normative disagreement (that's philosophy, not science), progress in your seminar/paper comes from **disentangling the layers** so people stop pretending they are arguing about Layer A when they are actually fighting about Layer C.

  Here are three specific moves that would constitute progress:

  #### Move 1: Distinguish "Causal Responsibility" from "Moral Complicity"
  Stop using the word "harm" for both.
  *   **Causal Responsibility:** Did this act physically alter the trajectory of climate change? (Side A wins here, mostly).
  *   **Moral Complicity:** Did this act implicate the agent in a wrongful system? (Side B wins here).
  *   **Progress:** Acknowledge that one can be *causally inefficacious* but *morally complicit.* Once you admit this, Side A has to explain why complicity doesn't matter, and Side B has to explain why they keep talking about emissions if they really care about integrity.

  #### Move 2: Introduce the "Expected Utility" Argument
  This is the strongest bridge between the camps.
  *   Even if supply is inelastic, markets operate on probabilities. Your purchase signals demand. In a complex global market, there is a non-zero probability that your specific purchase triggers a reorder, which triggers a slaughter.
  *   **Progress:** If Side A accepts *expected* impact rather than *guaranteed* impact, the math changes. The expected harm of a burger is small, but not zero. This undermines the "0.0000001%" argument without requiring Side A to become a deontologist.

  #### Move 3: Reframe the Question from "Does it Help?" to "What Does it Mean?"
  The question "Does my burger matter?" presupposes a Consequentialist framework (i.e., it only matters if it *does* something).
  *   **Progress:** Shift the seminar question to: *"In the face of collective action problems where individual efficacy is low, what are the obligations of moral agents?"*
  *   This allows for answers like: "Your obligation is to vote/organize (efficacy)" AND "Your obligation is to keep your hands clean (complicity)." It allows both sides to be partially right without requiring one to surrender their framework.

  ### 3. Recommendation for Your Paper

  **Is this debate worth continuing?**
  Yes, but only if you reframe it. If you write a paper trying to prove one side right, you will replicate the stalemate.

  **Suggested Thesis Angle:**
  Argue that the "Individual Impact" debate is a **category error**. The seminar is stuck because it is trying to solve a *structural/political* problem (climate change) with *individual moral* tools (buying/not buying), while using *causal language* to describe *normative commitments.*

  **Proposed Structure:**
  1.  **Map the Stalemate:** Show how "contribution" is being used ambiguously (Causal vs. Complicit).
  2.  **Analyze the Models:** Briefly touch on the threshold/expected utility problem (show you understand the math/empirics).
  3.  **The Pivot:** Argue that the real disagreement is about the **function of individual action in a collective crisis.**
      *   Is individual action a *tool for mitigation*? (Side A: If it doesn't mitigate, don't do it).
      *   Is individual action a *form of testimony*? (Side B: It bears witness to the value of the climate, regardless of mitigation).
  4.  **Conclusion:** Progress requires admitting that individual action might be morally required *even if* it is causally negligible, OR admitting that causal efficacy is the only metric that matters. But we must stop pretending these are the same claim.

  **Final Verdict on the Stall:**
  It is not *just* verbal. It is a **normative disagreement disguised as an empirical one.** Side A pretends they are being "realistic" about math, but they are actually being dogmatic about Consequentialism. Side B pretends they are talking about "harm," but they are actually talking about "virtue."

  Your paper will stand out if you explicitly call out this disguise. Don't try to solve climate change; solve the conversation about climate change.
