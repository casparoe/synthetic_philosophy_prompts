      *   **Goal:** Provide the *desiderata* (requirements) for a theory of legitimate secession, not a verdict or specific legal advice.
      *   **Constraints:** No specific real-world constitutional law (Spain/UK/Canada), no citations/reading lists, fictional country context.
      *   **Key Inputs:**
          *   Real-world cases to handle (Scotland, Catalonia, Quebec, nested minorities, fiscal grievances).
          *   Invented cases to handle (non-contiguous territory, 51-49 vs. internal 70-30, rump state survival needs, new "people"/immigrants).
          *   Distinctions to maintain (self-determination vs. secession, moral vs. legal vs. recognition, legitimacy vs. resistance, franchise/who votes).
          *   Task: Mark non-negotiables vs. camp prejudices.
          *   Task: Flag tensions/incompatibilities between desiderata.
          *   Task: Identify "gut feel" criteria (what readers/characters care about).
          *   Task: Identify the single most exclusionary requirement.
          *   Task: Short scorecard for 3-4 major theory families.
      *   **Tone:** Practical, clear, writer-focused, philosophical but accessible (no jargon dumps).

  2.  **Deconstruct the Desiderata (What makes a theory "good"?):**
      *   A theory needs to explain *why* a group can leave.
      *   It needs to define *who* counts as the group.
      *   It needs to define *where* the border goes.
      *   It needs to address the *costs* to the remaining state.
      *   It needs to be actionable (characters can argue it).

  3.  **Address the Specific Cases (Mental Check):**
      *   *Scotland/Catalonia/Quebec:* Needs to handle negotiated vs. unilateral, constitutional barriers, economic interdependence.
      *   *Non-contiguous:* Land vs. People.
      *   *51-49 vs. Internal Minority:* The boundary problem (who decides the demos?).
      *   *Rump Survival:* Viability of both states.
      *   *New People:* Time/Identity requirements.

  4.  **Drafting the Desiderata (The "Spec"):**
      *   *Requirement 1: The Subject.* Who is seceding? (People vs. Territory).
      *   *Requirement 2: The Cause.* Why are they leaving? (Injustice vs. Choice).
      *   *Requirement 3: The Border.* Where does it end? (Contiguity, enclaves).
      *   *Requirement 4: The Franchise.* Who votes? (Residents, owners, affected parties).
      *   *Requirement 5: The Aftermath.* Viability/Survival of both sides.

  5.  **Addressing Tensions (The "Hard Part"):**
      *   *Democratic Will vs. Minority Protection:* If 51% want out, but 49% don't, is it legitimate? If a sub-region wants to stay, can they? (The "Boundary Problem").
      *   *Justice vs. Stability:* Remedial right only (must be oppressed) vs. Primary right (just want to).
      *   *Predictability vs. Consequence:* Can you know legitimacy *before* the split, or does it depend on whether the new state survives?

  6.  **Categorizing Requirements (Non-negotiable vs. Prejudice):**
      *   *Non-negotiable:* Clarity (must know who votes), Viability (new state must function), Non-tyranny (can't create new oppressed minorities).
      *   *Prejudice:* "Only for injustice" (Remedial), "Majority rules always" (Plebiscitary), "Borders are sacred" (Status Quo).

  7.  **Identifying "Gut Feel" Criteria:**
      *   "You can't take the port." (Economic strangulation).
      *   "You can't cut the country in half." (Geographic viability).
      *   "We were here first." (Historical claim).
      *   "Let us vote." (Democratic consent).

  8.  **Identifying the "Knockout" Requirement:**
      *   The *Boundary Problem* (Who gets to vote/Where is the border?) is usually the theoretical killer. It creates infinite regress.

  9.  **Drafting the Scorecard:**
      *   *Remedial Right:* Only if abused. Good for stability, bad for democratic choice.
      *   *Plebiscitary:* Majority wins. Good for choice, bad for minorities/chaos.
      *   *National/People:* Distinct culture. Good for identity, bad for definition/mixed areas.
      *   *Consequentialist:* Does it work? Good for pragmatism, bad for principle.

  10. **Refining and Polishing (Writer-to-Writer):**
      *   Keep it punchy.
      *   Avoid academic citations.
      *   Focus on *dramatic utility*.
      *   Ensure the distinction between "legitimacy of secession" and "legitimacy of resistance" is clear.
      *   Make sure the "tensions" section is honest about the impossibility of a perfect theory.

  11. **Self-Correction/Review during drafting:**
      *   *Check:* Did I mention specific laws? *No.*
      *   *Check:* Did I answer the "non-contiguous" question? *Yes, under Border/Subject.*
      *   *Check:* Did I address the "who votes" issue? *Yes, crucial.*
      *   *Check:* Is the tone right? *Needs to be respectful of the craft.*
      *   *Check:* Did I highlight the "gut feel" items? *Yes, mark them clearly.*
      *   *Check:* Did I identify the incompatible pair? *Yes, Democratic Majority vs. No New Minorities.*

  12. **Final Polish:** Organize with clear headings. Ensure the "Scorecard" is strictly 3 sentences max per theory. (Wait, the prompt says "three sentences each max" for the scorecard). Make sure to explicitly mark the "Gut Feel" items.

  *(Self-Correction on the "Knockout" requirement)*: Is it the Boundary Problem or Viability? Viability is practical, Boundary is theoretical. The prompt asks what rules *theories* out. The Boundary Problem (Who constitutes the 'self' in self-determination?) is the classic philosophical killer. I'll stick with that.

  *(Self-Correction on Tensions)*: The prompt specifically asks to flag pairs that can't be jointly satisfied. The "Majority Rule vs. Minority Rights" within the secessionist zone is the big one. Also "Procedural Clarity vs. Outcome Viability."

