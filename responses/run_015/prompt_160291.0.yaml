answer: |-
  Here is the spec for a theory of legitimate secession, stripped of legal code and focused on dramatic utility.

  ### The Desiderata: What the Theory Must Deliver

  To be worth arguing about in a room, a theory of secession must answer five questions. If it waffles on these, it's propaganda, not theory.

  1.  **The Subject (Who is the "Self"?):** Does the right belong to a *people* (defined by culture, history, or identity) or a *population* (defined by current residence within an administrative border)?
      *   *Why it matters:* If it's a "people," your immigrants with the distinct accent might be excluded. If it's a "population," the non-contiguous highway strip counts if the people living there vote for it.
  2.  **The Cause (Why Leave?):** Is secession a *remedy* (you must prove abuse, oppression, or theft to leave) or a *primary right* (you can leave just because you want to, like a divorce)?
      *   *Why it matters:* This decides if the fiscal grievance ("we're richer") counts. Remedial theories say no; Primary theories say yes.
  3.  **The Boundary (Where is the Line?):** Does the secession happen within existing administrative borders, or can they be redrawn to match the vote?
      *   *Why it matters:* This handles your 51–49 split. If borders are fixed, the minority inside the region is stuck. If borders are fluid, the minority can try to carve themselves out, potentially forever.
  4.  **The Franchise (Who Votes?):** Does everyone currently living there vote? Only those born there? Does the rump state get a veto? Do the people in the connecting highway corridor get a say?
      *   *Why it matters:* This is the lever your characters will pull to change the outcome. Expanding the franchise to the corridor might kill the secession; restricting it to "historical residents" might guarantee it.
  5.  **The Viability (Can Both Survive?):** Does legitimacy depend on the outcome? If the new state is economically non-viable, or if the rump state is strategically strangled (loses the port/water), does the right vanish?
      *   *Why it matters:* This addresses the "survival" objection. A theory that allows a secession that kills the rump state is a theory of war, not politics.

  ---

  ### Non-Negotiables vs. Camp Prejudices

  **Non-Negotiables (Load-Bearing)**
  *   **Clarity of Franchise:** A theory *must* specify who votes before the vote happens. If this is decided after the results are known, the theory is fraudulent.
  *   **Non-Tyranny:** A theory cannot legitimize secession if it immediately creates a new, oppressed minority within the new borders (e.g., the 70% remain district forced into the new state).
  *   **Mutual Viability:** A theory must account for the physical survival of both entities. If secession renders one side uninhabitable or defenseless, the claim loses legitimacy.

  **Camp Prejudices (Dressed up as Principles)**
  *   **"Only for Injustice":** The idea that you must be abused to leave. This is a prejudice of the *status quo* camp to make secession harder.
  *   **"Majority Rules Always":** The idea that 50% + 1 settles it. This is a prejudice of the *secessionist* camp to ignore internal minorities.
  *   **"Borders are Sacred":** The idea that existing provincial lines cannot be touched. This is a prejudice of the *central government* to avoid the boundary problem.
  *   **"National Identity Required":** The idea that you need a distinct language or religion to be a "people." This is a prejudice used to exclude new groups (like your two-generation immigrants).

  ---

  ### The "Gut Feel" Criteria (Mark these for your characters)

  These are the arguments that will resonate with a reader who doesn't care about political theory. They rely on intuition, not logic.

  *   **[GUT]** **The Strangulation Rule:** You cannot secede if it cuts the rump state's throat. (Taking the only port, damming the only river). Readers feel this as theft, not freedom.
  *   **[GUT]** **The Home Field Rule:** People who live on the land get to decide, not ancestors who left or central bureaucrats. (Residency > Heritage).
  *   **[GUT]** **The Don't Break the Map Rule:** Non-contiguous territory feels like cheating. A state needs to be a shape, not a dotted line. Readers instinctively reject the "highway strip" as a valid border.
  *   **[GUT]** **The Sunk Cost Rule:** If you've benefited from the union for decades (infrastructure, defense), you can't just walk away when the bill comes due. (Addresses the fiscal grievance).

  ---

  ### The Incompatible Pair (The Trap)

  You suspected there was a tension. There is one major contradiction that no theory fully solves.

  **The Democratic Majority vs. The No-New-Minorities Rule.**

  *   **Requirement A:** If a clear majority in a region votes to leave, their democratic will must be respected.
  *   **Requirement B:** Secession cannot be legitimate if it forces a significant minority within that region to live under a government they explicitly rejected.

  **The Conflict:** If your region votes 51–49 to leave, Requirement A says they go. Requirement B says they can't, because 49% are now an oppressed minority in the new state. If you let the 49% split off, you violate Requirement A for the 51%. If you let the 49% split off, *their* internal minority might want to split off again. This is the infinite regress.
  *   **For your scene:** This is where the argument stalls. One character argues for the Will of the People (A); the other argues for the Protection of the Neighbor (B). Neither can win without conceding a principle.

  **Secondary Tension:** **Procedural Clarity vs. Outcome Viability.**
  *   You want to know *before* the vote if the secession is legitimate (Clarity). But legitimacy often depends on whether the new state survives economically (Viability), which nobody knows *until after* the split. A theory that waits for the outcome to judge the right is useless to the voters; a theory that ignores the outcome is dangerous.

  ---

  ### The Knockout Requirement

  **The Boundary Problem (Who constitutes the demos?)**

  This is the single requirement that knocks out the most theories.
  Any theory that says "The people decide" immediately fails because it cannot define "The people" without circular logic. (Who votes? The people in the region. Who is in the region? The people who vote).
  *   If you define it by existing borders, you favor the central government.
  *   If you define it by ethnicity/culture, you favor the secessionists but invite ethnic cleansing.
  *   If you define it by residency, you invite the "gerrymandering" of your highway strip.
  *   **Why it wins:** In your negotiation scene, whichever character can successfully define *who gets to vote* effectively decides the outcome before arguing the merits.

  ---

  ### Theory Scorecard

  **1. Remedial-Right-Only (The "Divorce for Abuse" Model)**
  *   **Core:** You can only leave if the state has seriously violated your rights or stolen from you.
  *   **Verdict:** Handles the fiscal grievance poorly (greed isn't abuse) but handles the "survival" objection well (abuse trumps convenience).
  *   **Flaw:** It makes secession a punishment, not a choice, and requires a trial on "who hurt whom" before politics can begin.

  **2. Plebiscitary / Primary-Right (The "Democratic Choice" Model)**
  *   **Core:** If a majority in a territory wants to leave, they may, for any reason or no reason.
  *   **Verdict:** Solves the "who decides" question cleanly (vote counts) but fails the "No-New-Minorities" test immediately.
  *   **Flaw:** It treats borders like subscription services; readers will feel it ignores the cost to those left behind (the port/water issue).

  **3. National / People-Based (The "Distinct Identity" Model)**
  *   **Core:** Only a distinct "nation" (culture, language, history) can secede, not just a random administrative zone.
  *   **Verdict:** Handles the "two-generation immigrants" problem (are they a nation yet?) but struggles with mixed territories.
  *   **Flaw:** Defining "nation" is subjective; it often excludes the exact groups (like your river valley) that need the theory most.

  **4. Consequentialist / Viability (The "Does It Work" Model)**
  *   **Core:** Secession is legitimate only if both the new state and the rump state remain viable, secure, and functional.
  *   **Verdict:** The only one that captures the "Strangulation Rule" (port/water) effectively.
  *   **Flaw:** It is purely retrospective; you can't know if it's legitimate until after the crash, which doesn't help the characters decide *now*.
