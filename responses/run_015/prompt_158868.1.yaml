prompt: |-
  I sit on the clinical ethics committee of a 600-bed teaching hospital, and we are jointly reviewing a proposal with our new clinical-AI oversight subcommittee. The vendor, Meridian, wants to pilot a system that generates what it calls an extrapolated preference report for patients who lack decision-making capacity and have no available surrogate or advance directive — the "unbefriended" patients, which is a real and growing category on our wards. The system is trained on a patient's own prior digital traces (messages, calendar entries, purchase history, portal messages, clinic notes) together with a population prior, and it runs in either of two modes. In conservative mode it only fills in missing information and discounts statements made under acute pain, delirium, sedation, or untreated depression — the patient's underlying evaluative standards are held fixed. In revisionary mode it also revises those standards themselves, on the theory that a person better informed and more experienced would not merely apply her current values to better facts but would come to have different ones. The vendor's own validation study compared system output against wishes later stated by patients who regained capacity, and reports 71% agreement overall, with disagreements clustering heavily in end-of-life decisions — precisely where the reports would matter most. Our index case is a 74-year-old woman, Mrs. Halvorsen, three weeks post-stroke, no surrogate, no directive, whose retrievable traces contain a decade of repeated statements that she would never want to be a burden and would rather die than live in a nursing home, alongside a two-year stretch of severe, untreated depressive episodes in which many of those statements were made.

  What has split our committee is not the familiarsubstituted-judgment question but what happens when substituted judgment runs out. I want the memo to take up three things specifically. First, the anchoring problem: at what point does an idealized version of Mrs. Halvorsen stop being a version of her at all, and is there a principled stopping rule or only a stipulation the vendor has baked into a parameter? Second, order sensitivity: on the one test case we ran, revising her aversion to being a burden before revising her fatalism about her prognosis yielded a recommendation for continued aggressive treatment, while reversing the order yielded a comfort-focused plan. If the endpoint of extrapolation depends on the sequence of revisions, then a single confident recommendation misrepresents the actual output of the procedure, and I want your view on whether that is a defect in this system or a feature of the idealization idea itself. Third, what I think of as the ventriloquism failure mode: whatever the procedure's theoretical standing, a confident paragraph in the chart will displace clinical judgment and family deliberation rather than inform it, and we should ask whether our safeguards can realistically prevent that.

  Please draft the memo I will circulate before our joint meeting two weeks from Thursday. It should be about 900 to 1,200 words, open with a clear recommendation — authorize the pilot, authorize in conservative mode only, or decline — and then give the reasons in a form the vendor and the clinical leads could actually respond to, including any conditions with dates attached (for instance, what the system would have to demonstrate about path-independence or about how it handles statements made during depression, and by when). It should also give the strongest consideration on the losing side its full weight rather than disposing of it in a sentence, and it should close by naming what evidence or result would most change your recommendation. Please do not spend the memo restating that substituted judgment is our legal standard; assume we know that, and tell us what to do in the cases where there is no one left to substitute.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a clinical ethics committee at a 600-bed teaching hospital.
      *   **Audience:** Joint review with the new clinical-AI oversight subcommittee, vendor (Meridian), and clinical leads.
      *   **Topic:** Pilot proposal for an AI system ("extrapolated preference report") for unbefriended patients lacking capacity/surrogates/directives.
      *   **System Details:** Two modes (Conservative: fills info, holds values fixed; Revisionary: revises values based on "better informed/experienced" theory). Validation: 71% agreement, worse at end-of-life.
      *   **Index Case:** Mrs. Halvorsen (74, post-stroke, unbefriended). Traces show "burden/death over nursing home" statements, but many made during untreated depression.
      *   **Key Issues to Address:**
          1.  *Anchoring Problem:* When does idealization stop being the patient? Is there a principled stopping rule?
          2.  *Order Sensitivity:* Sequence of revisions changes outcomes (aggressive vs. comfort). Is this a defect or a feature?
          3.  *Ventriloquism Failure Mode:* Will the AI report displace judgment/deliberation?
      *   **Format:** Memo, 900-1,200 words.
      *   **Structure:** Open with clear recommendation (Authorize, Conservative Only, or Decline). Give reasons responsive to vendor/leads. Include conditions with dates. Give weight to the losing side. Close with what evidence would change the recommendation.
      *   **Constraint:** Do not rehash substituted judgment legal standards; focus on where that standard runs out.

  2.  **Determine the Recommendation:**
      *   *Option A (Authorize):* Too risky given the order sensitivity and end-of-life disagreement rates.
      *   *Option B (Decline):* Strong ethical stance, but might stifle innovation needed for this vulnerable population.
      *   *Option C (Conservative Only):* Balances the need for decision support with the risk of altering patient identity.
      *   *Decision:* **Authorize in Conservative Mode Only.** This acknowledges the utility of filling information gaps without crossing the line into redefining the patient's values (which the Revisionary mode does). It addresses the "Anchoring" and "Ventriloquism" risks while allowing data collection on the "Order Sensitivity."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State recommendation clearly. (Authorize Conservative Mode Only, with strict conditions).
      *   **Context:** Briefly acknowledge the problem (unbefriended patients) and the vendor's proposal.
      *   **Issue 1: The Anchoring Problem (Identity):**
          *   Focus on Revisionary Mode.
          *   Argument: Revising values creates a "better" person, not *this* person.
          *   Condition: Vendor must define the stopping rule mathematically/ethically.
      *   **Issue 2: Order Sensitivity (Path Dependence):**
          *   Focus on the test case (aggressive vs. comfort based on sequence).
          *   Argument: If the output isn't stable, it's not a prediction; it's a construction.
          *   Condition: Must demonstrate path independence or disclose variance.
      *   **Issue 3: Ventriloquism (Clinical Displacement):**
          *   Focus on how the report is used in the chart.
          *   Argument: A confident paragraph stops thought.
          *   Condition: UI/UX changes to prevent "black box" authority.
      *   **Counter-Argument (The Losing Side):**
          *   Give weight to the Revisionary/Full Pilot argument.
          *   Argument: Unbefriended patients suffer from status quo bias/undertreatment. AI might offer a more "rational" proxy than random chance or default aggressive care.
      *   **Closing:** What evidence would change the mind? (e.g., proof of path independence, higher EOL accuracy).
      *   **Timeline/Conditions:** Specific dates for deliverables.

  4.  **Refining and Polishing (Iterative Process):**

      *   *Word Count Check:* Need to ensure it lands between 900-1,200.
      *   *Tone:* Professional, ethical, firm but collaborative.
      *   *Specifics:* Ensure Mrs. Halvorsen is mentioned as the index case context. Ensure the "71% agreement" stat is contextualized.
      *   *Addressing the Prompt:* Did I cover Anchoring? Yes. Order Sensitivity? Yes. Ventriloquism? Yes. Dates? Need to add specific dates (2 weeks from Thursday is the meeting, so conditions should be pre-pilot or mid-pilot).
      *   *Constraint Check:* Did I avoid lecturing on substituted judgment law? Yes, focus on the *gap* where it fails.

  5.  **Drafting - Step-by-Step (Mental or Scratchpad):**

      *   *Header:* To: Clinical Ethics & AI Oversight Committees. From: [My Name]. Date: [Current Date]. Subject: Recommendation on Meridian Pilot.
      *   *Rec:* Conservative Mode Only.
      *   *Body Paragraph 1 (Anchoring):* Revisionary mode risks creating a stranger. Mrs. Halvorsen's depression complicates the "true self." Where is the line?
      *   *Body Paragraph 2 (Order):* The test case showed path dependence. This is a bug, not a feature. If the algorithm isn't stable, it can't guide life-and-death.
      *   *Body Paragraph 3 (Ventriloquism):* The chart note risk. Clinicians will defer. Need safeguards.
      *   *Counter-argument:* The status quo is terrible for unbefriended. Default aggressive care is also a bias. AI might reduce suffering.
      *   *Conditions:* Vendor must submit path-independence data by [Date]. UI must show confidence intervals.
      *   *Closing:* What changes my mind? 90% EOL accuracy + path stability.

  6.  **Writing the Content (incorporating word count management):**

      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm banning AI entirely. The problem is the *Revisionary* mode and the *confidence* of the output.
      *   *Refining the "Order Sensitivity" argument:* Make sure to explicitly state that if the output depends on the sequence of operations, it lacks objective grounding.
      *   *Refining the "Ventriloquism" argument:* Focus on the "confident paragraph" aspect.
      *   *Dates:* The meeting is two weeks from Thursday. Let's set pre-pilot conditions to be due one week before pilot launch, or immediate deliverables. Let's say "Prior to pilot launch" and "Within 3 months."

  7.  **Final Review against Constraints:**
      *   Word count: Aiming for ~1000.
      *   Recommendation: Clear at start.
      *   Three specific issues addressed? Yes.
      *   Losing side weighted? Yes.
      *   Closing evidence specified? Yes.
      *   No legal lecturing? Yes.

  8.  **Final Polish:** Check flow and tone. Ensure "Mrs. Halvorsen" is used effectively to ground the abstract ethics. (Proceed to generate output).

  *(Self-Correction on Word Count)*: I need to be careful not to be too brief. I need to expand on the *implications* of the order sensitivity to ensure I hit the minimum word count without fluff. I will elaborate on why path dependence undermines the claim of "extrapolation."

  *(Self-Correction on Dates)*: The prompt asks for conditions with dates attached. I will set specific deadlines relative to the meeting date.

  *(Final check on "Losing Side")*: I need to make sure the argument *for* the Revisionary mode is compelling, not a strawman. The argument is that "current self" might be impaired, and "ideal self" is a valid ethical target for unbefriended patients who have no other voice.

  Let's write.
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee; Clinical-AI Oversight Subcommittee
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Meridian "Extrapolated Preference" Pilot

  **Recommendation**
  I recommend we **authorize the pilot in Conservative Mode only**, contingent on specific technical and interface deliverables from Meridian prior to patient enrollment. We must decline the Revisionary Mode for this pilot cycle. While the plight of unbefriended patients like Mrs. Halvorsen demands innovation, the current architecture of the Revisionary Mode introduces ethical risks that outweigh the potential benefits. Specifically, the system currently lacks a principled stopping rule for identity preservation, demonstrates unacceptable output instability (order sensitivity), and presents a high risk of displacing clinical deliberation with algorithmic confidence.

  **The Anchoring Problem and Identity**
  The core ethical promise of this tool is to extend substituted judgment where no surrogate exists. However, the Revisionary Mode shifts from *substituted* judgment to *constructive* judgment. In the case of Mrs. Halvorsen, whose digital traces include vehement statements against life-sustaining treatment made during untreated depressive episodes, the system faces a conflict: honor the explicit statement or correct the "impaired" value formation?

  The vendor argues that a "better informed" version of the patient would revise their standards. But at what point does this idealized agent stop being Mrs. Halvorsen and become a philosophical construct? If we allow the AI to revise values based on a population prior of what a "rational" agent would want, we are no longer speaking for the patient; we are speaking for a demographic category. The vendor's validation study shows 71% agreement overall, but significant divergence on end-of-life decisions. This suggests the system's "idealization" parameter is effectively a stipulation baked into the code, not a discovery of the patient's will.

  *Condition:* Prior to pilot launch (target: November 15), Meridian must provide a formal definition of the "stopping rule" for value revision. We require a mathematical or logical boundary that demonstrates where the extrapolation ends and the invention of a new agent begins. Without this, Revisionary Mode violates the fiduciary duty to the specific individual in the bed.

  **Order Sensitivity and Path Dependence**
  Our internal testing revealed a critical defect: the system is path-dependent. When we processed Mrs. Halvorsen's data, revising her aversion to being a burden *before* revising her prognosis fatalism yielded a recommendation for aggressive treatment. Reversing the order yielded a comfort-focused plan.

  If the endpoint of extrapolation depends on the sequence of revisions, the output is not a stable prediction of preference; it is an artifact of the algorithm's processing order. A single confident recommendation in the chart misrepresents this instability. This is not merely a software bug; it suggests the underlying ethical model lacks a coherent equilibrium. If the "true" preference of the idealized agent changes based on which variable is adjusted first, the concept of a singular "extrapolated preference" is incoherent.

  *Condition:* By the mid-pilot review (February 1, 2024), Meridian must demonstrate path independence or, alternatively, configure the interface to display the variance range resulting from different revision sequences. If the system cannot produce a stable recommendation across permutation tests, it cannot be used for irreversible decisions.

  **The Ventriloquism Failure Mode**
  Even if the math were sound, the interface poses a behavioral risk. A concise, confident paragraph in the Electronic Health Record (EHR) carries immense rhetorical weight. In high-stress environments, particularly with unbefriended patients where no family is present to challenge the data, clinicians are likely to treat the report as a directive rather than a data point. This is the "ventriloquism" risk: the AI speaks, and the care team listens, effectively outsourcing moral responsibility to a vendor.

  *Condition:* Meridian must modify the report output to include explicit confidence intervals and a "challenge prompt" requiring the attending physician to document independent rationale before accepting the AI's recommendation. This feature must be live by the pilot start date.

  **Consideration of the Opposing View**
  I acknowledge the strong argument for authorizing the full pilot, including Revisionary Mode. The status quo for unbefriended patients is ethically untenable. Currently, these patients default to aggressive, often unwanted interventions because clinicians fear liability without a surrogate. This "defensive medicine" approach may violate patient dignity just as surely as an algorithmic error. Proponents argue that a "rational revision" of values is preferable to the randomness of default care protocols. If Mrs. Halvorsen's depression distorted her worldview, the Conservative Mode locks in that distortion, potentially condemning her to a death she would not have chosen if well. There is moral weight to the idea that we should advocate for the patient's *well-being*, not just their historical *statements*. To deny the Revisionary Mode is to potentially prioritize procedural purity over the patient's actual welfare.

  **Conclusion and Threshold for Change**
  While the welfare argument is compelling, the instability of the Revisionary Mode makes it unsafe for deployment. We cannot gamble on a system that admits its output changes based on the order of operations.

  My recommendation would change to authorize the **Revisionary Mode** only if Meridian provides evidence prior to the February 1 review that:
  1.  **Path Independence:** The system produces convergent recommendations regardless of variable revision sequence (variance <5%).
  2.  **End-of-Life Accuracy:** Validation data specific to end-of-life scenarios shows agreement rates exceeding 85% (currently 71%), specifically accounting for mental health confounders like depression.

  Until then, we proceed with Conservative Mode to assist in filling information gaps without redefining the patient.

  **cc:** Hospital Legal Counsel; Chief Medical Officer
