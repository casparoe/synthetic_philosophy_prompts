  1. Coinciding objects are distinct only if their sortal classifications prescribe divergent persistence conditions grounded in their mode of generation.
  2. Identity persists through change only if the alteration respects the functional intention inherent in the object's original creation.
  3. Material continuity is secondary to historical continuity, such that destructive reconstitution creates a new object regardless of qualitative indistinguishability.

  The second principle best captures your intuitions.

  **Clause-by-clause:** 'Functional intention' resolves Case 4 (Lego permits disassembly; bronze does not) and Case 5 (carving implies art; growth does not). 'Original creation' handles Case 1 (statue begins Friday) and Case 3 (cat is a natural kind, not arbitrary). 'Persists only through changes compatible' explains why squashing destroys the statue (Case 1) and firing destroys the clay (your flipping case).

  **New cases:** A caterpillar and butterfly are one organism (biological function persists). A river remains the same despite water replacement (functional flow persists). A company survives staff turnover (legal intention persists).

  **The flipping case:** Firing clay into ceramic violates the 'clay' intention. Your statue is destroyed; a new ceramic object arises. You feel conflict because the *artistic* intention might survive, but the *material* sortal does not.

  **Unsaved verdicts:** This cannot save Case 3's cutoff problem. If 'cat' is defined by biological function, 'cat-minus-tail' lacks a distinct function, so you must deny it exists as a separate object, contradicting your gut. It also struggles with Case 2 (Ship); if 'ship' is defined by function, both repaired and reassembled ships function, so the principle might imply branching identity or ambiguity you rejected. Finally, it forces you to abandon the idea that the lump and statue are two things in Case 1 if you view the lump as lacking a functional intention distinct from the matter itself.
