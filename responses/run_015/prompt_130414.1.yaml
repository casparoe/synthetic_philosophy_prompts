answer: |-
  This is a classic "small foundation, big constraints" problem. You are trying to run a venture capital portfolio (the locked bucket) and a utility company (the unrestricted bucket) with the same spreadsheet, using a scoring system (ITN multiplication) that was designed for cause prioritization, not grant selection.

  Multiplying scores implies the factors are independent and compensatory (a huge "Importance" can save a zero "Tractability"). They aren't. If a problem is unsolvable (Tractability = 0), it doesn't matter how important it is.

  Here is the **Marlow Protocol**. It is designed for your 2-hour limit, your board's numeracy constraints, and the mandatory payout requirement.

  ### Part 1: The Procedure

  Do not score. **Screen and Size.**

  **Step 1: The Bucket Check (Pass/Fail)**
  *   **Question:** Does this legally and philosophically fit the "Future Generations" locked bucket or the "Near-Term" unrestricted bucket?
  *   **Adequate Answer:** Yes/No.
  *   **Stop Rule:** If it doesn't fit the bucket, stop. Do not try to shoehorn a near-term health project into the future-generations bucket just to spend the money. If the locked bucket has no viable deals in a cycle, you must hold cash or make a program-related investment (PRI) if your bylaws allow, rather than fund bad projects. *Note: If your will strictly forbids holding cash, your "adequate answer" becomes "Best available option in domain," lowering the bar for Step 3.*

  **Step 2: The Crowd Check (Neglectedness → "The Gap")**
  *   **Question:** Who else is funding this, and what happens if we *don't* write the check?
  *   **Adequate Answer:** A list of the top 3 other funders and a sentence on whether they are increasing, decreasing, or stable.
  *   **Logic:** If three bigger funders are already there (Case A), you are not funding the *work*; you are funding the *margin*. If the work continues without you, your impact is near zero.
  *   **Stop Rule:** If the project is fully funded by others and has no specific "gap" for a small funder (e.g., risky pilot, bridge funding), **No**.

  **Step 3: The Margin Check (Tractability → "The Leverage")**
  *   **Question:** Is the constraint money, or is it something else (talent, time, regulation)?
  *   **Adequate Answer:** "Money is the constraint" OR "They are constrained by hiring/regulations/supply."
  *   **Logic:** If they can only scale 2x per year due to trainer supply (Case C), giving them 5x money wastes 3x of it.
  *   **Stop Rule:** If money is *not* the binding constraint, **No** (unless you are funding a solution to the constraint).

  **Step 4: The Upside Check (Importance → "The Ceiling")**
  *   **Question:** What is the best-case scenario if this works?
  *   **Adequate Answer:** A narrative description of the outcome (e.g., "10,000 kids treated" vs. "Pandemic risk reduced by 1%").
  *   **Logic:** For the **Unrestricted Bucket**, use Expected Value (Probability × Impact). For the **Locked Bucket**, use **Option Value** (Does this buy us knowledge or position us for a massive win later?).
  *   **Stop Rule:** If the best-case scenario is trivial, **No**.

  ### Part 2: How the Factors Interact

  Stop multiplying. Use **Gating and Sizing**.

  1.  **Gating (Conjunctive):** Steps 1, 2, and 3 are gates. If you fail any of them, the grant is a No. It does not matter how "Important" the cause is if you have no leverage.
  2.  **Sizing (Additive/Comparative):** Once a proposal passes the gates, you do not score it. You size the check based on the **Binding Constraint**.
      *   *Unrestricted Bucket:* Size to fill the funding gap identified in Step 2.
      *   *Locked Bucket:* Size to purchase the "option" (e.g., fund a 1-year pilot to see if the mechanism works).

  ### Part 3: Where the Procedure Stops vs. Board Decision

  *   **Staff Decision (Facts):** Whether the proposal passes the Gates (Steps 1-3). This is analytical.
  *   **Board Decision (Values):** Risk tolerance in the Locked Bucket.
      *   *The Handoff:* "This proposal has a 90% chance of failing, but if it works, it changes the field. It passes the gates. Do we want to own this risk?"
      *   The Accountant wants certainty; the "Mother Test" Trustee wants intuition. Your job is to present the *nature* of the risk, not hide it.

  ### Part 4: Handling Uncertainty (When you can't get a number)

  You cannot get a number. Stop trying.
  *   **Unrestricted Bucket:** Use **Cost Per Output** (e.g., $5 per child). If they can't give you this, they fail Step 3.
  *   **Locked Bucket:** Use **Milestones**. "We fund $100k for 12 months. If Milestone X is hit, we consider renewal. If not, we stop."
  *   **The Number:** Round to **one significant digit**. $150,000, not $147,200. It signals to the Board that this is an estimate, not an invoice.

  ### Part 5: The One-Page Memo Template

  **To:** Board of Directors
  **From:** Program Staff
  **Subject:** Grant Recommendation – [Org Name]
  **Bucket:** [Unrestricted / Locked]
  **Ask:** $[1 Sig Fig] (e.g., $200,000)

  **1. The Story (Mother Test):**
  [2 sentences max. What do they do, and who helps?]

  **2. Why Us? (The Gap):**
  [Who else funds this? Why would this stall without us? If "nobody else," say why we believe they can pull it off.]

  **3. The Constraint (The Leverage):**
  [Is money the bottleneck? If not, how does this grant solve the actual bottleneck?]

  **4. The Risk (Honesty):**
  [What is the most likely way this fails? Be specific.]

  **5. Recommendation:**
  [Fund / Pass / Fund with Milestones]

  ---

  ### Part 6: Running the Cases

  Here is how the protocol applies to your three scenarios. I have applied the rules ruthlessly.

  #### Case A: The Deworming Renewal (Unrestricted Bucket)
  *   **Step 1 (Bucket):** Fits Near-Term. **Pass.**
  *   **Step 2 (Crowd):** Three bigger funders are already in. They are stable. If Marlow exits, the program continues. **Fail.**
  *   **Step 3 (Margin):** Money is not the binding constraint; the program is saturated.
  *   **Verdict:** **NO.**
  *   **Why you won't like it:** This is a "safe" grant with a beloved partner. Rejecting it feels mean and risky. But under this framework, your marginal dollar saves zero lives here because the other funders cover the cost. You are subsidizing rich donors, not helping kids.
  *   **Memo Line:** "Program is fully funded by larger partners. Marlow exit would not impact service delivery. Capital redeployed to higher-leverage gaps."

  #### Case B: Speculative Biosecurity Team (Locked Bucket)
  *   **Step 1 (Bucket):** Fits Future Generations. **Pass.**
  *   **Step 2 (Crowd):** Tiny team, mechanism untested. Few funders willing to touch pre-proof. **Pass.**
  *   **Step 3 (Margin):** Money *is* the constraint (they can't run the experiment without it). **Pass.**
  *   **Step 4 (Upside):** Tail outcome is massive (preventing a pandemic pathway). Base case is a null result.
  *   **Verdict:** **FUND (with Milestones).**
  *   **Logic:** This is the Locked Bucket's job. You are buying information. Even a null result is valuable data for the field.
  *   **Memo Line:** "High risk of technical failure. However, successful validation would open a new mitigation pathway currently unfunded. Marlow funds the 'option value' of this discovery."

  #### Case C: CHW Training Programme (Unrestricted Bucket)
  *   **Step 1 (Bucket):** Fits Near-Term. **Pass.**
  *   **Step 2 (Crowd):** Numbers look great, likely underfunded. **Pass.**
  *   **Step 3 (Margin):** **FAIL.** They can only double size per year due to trainer supply. If you give them money to triple size, 1/3 of it sits idle or lowers quality.
  *   **Verdict:** **NO (as proposed) / COUNTER-OFFER.**
  *   **Logic:** You cannot fund the service delivery; you must fund the *trainer supply*.
  *   **Memo Line:** "Organization is capital-constrained but operationally bottlenecked by trainer supply. Direct service funding will yield diminishing returns. Recommend funding a pilot to solve trainer recruitment first."

  ---

  ### Part 7: Failure Modes (Where this will misfire)

  You asked for honesty about where this breaks. Here it is:

  1.  **The "Locked Bucket" Trap:** If the donor's will requires *spending* the money annually and there are no good biosecurity/future-gen deals, this protocol will tell you to say "No." You will be legally forced to say "Yes."
      *   *Mitigation:* In bad years, classify the Locked Bucket as "Research & Development." Fund the best *learning* opportunity, even if the direct impact is low. Acknowledge this in the memo as "Capacity Building."
  2.  **The Relationship Cost:** Rejecting Case A (Deworming) will damage your relationship with that NGO. They may stop applying for other things. They may talk to other funders.
      *   *Mitigation:* Be transparent. "We love your work, but other funders have stepped up. We need to go where the gap is." Offer to introduce them to the bigger funders to solidify their position.
  3.  **The "Mother Test" Bias:** The Trustee who rejects anything she can't explain at dinner will kill Case B (Biosecurity). It is technical and abstract.
      *   *Mitigation:* Do not explain the mechanism. Explain the *analogy*. "This is like testing a new type of fire extinguisher before the fire starts. We don't know if it works, but if it does, it saves the house."
  4.  **False Precision on Constraints:** In Case C, the NGO might lie about the bottleneck to get more money. You have 2 hours; you can't audit their HR pipeline.
      *   *Mitigation:* Tranche the grant. "Here is 50% now. Show us you hired 5 trainers, then you get the rest."

  ### Summary of Changes for Your Next Meeting

  1.  **Kill the ITN Score.** It is mathematically wrong and gives a false sense of precision.
  2.  **Adopt the Gate System.** If you have no leverage (Crowd/Margin), the grant is a No, regardless of Importance.
  3.  **Differentiate the Buckets.** Unrestricted = Proven Impact per Dollar. Locked = Option Value / Knowledge Gain.
  4.  **One Significant Digit.** $200k, not $198k. It protects you from the Accountant's scrutiny and protects the Board from false confidence.
  5.  **Accept the Friction.** You will recommend rejecting a "safe" renewal (Case A). This is the correct decision for a small foundation trying to maximize marginal impact. If the Board overrides you, that is their prerogative on values, but the record should show the marginal impact was low.

  This system fits on one page, takes under two hours to apply, and forces the hard conversations to happen *before* the board meeting, not during it.
