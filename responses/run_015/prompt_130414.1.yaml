prompt: |-
  Hi — I'm the program officer at the Marlow Fund, a small family foundation. We give away about $5m a year, two program staff (me and one other person), board meets quarterly but we make grant decisions monthly, ~25 grants a year and half of them are renewals. Here's our problem in two parts.

  First: about $1.5m of the annual payout is locked by the donor's will to "work that benefits people who have not been born yet," and the rest is basically unrestricted near-term global health and development. So in the same meeting we score, I dunno, a school-based delivery programme that's been running for six years and a small speculative biosecurity team, and it obviously doesn't work — the units aren't the same, and "do nothing and move the money across" isn't even available in the locked bucket, because the money has to go out the door into that bucket somehow.

  Second: right now we rate every proposal High/Medium/Low on importance, tractability and neglectedness (the three-factor framework you've probably seen floating around the effective-altruism world), turn those into 3/2/1, and multiply. It's silly and we know it. A Medium/Low/High beats a High/High/Low and nobody actually believes that. "Neglectedness" keeps getting scored as "nobody cool is talking about this" rather than as anything to do with money. And our board chair is a retired accountant who says he doesn't want to see any figure with more than one significant digit, while another trustee thinks any cause you can't describe to her mother over dinner is a scam.

  So: give us something we can actually run. Constraints — maybe two hours per proposal, one round of follow-up questions to the applicant, no literature reviews, no outside modelling contractor, and it has to fit on the one-page memo that goes to the board.

  Specifically I want:

  - The order we should establish things in, and what counts as an adequate answer at each step. I suspect we should be checking who else is already funding the space *before* we try to estimate how much good a dollar does, and that tractability should be judged at the margin rather than on average — but you tell me if that's right.
  - How the three factors actually interact, and what to do instead of multiplying, given they clearly aren't independent.
  - Where the procedure stops with a no, and where it has to stop and hand the decision to a person because the question is one of values and not facts.
  - What we do when we can't get a number at all, which is most of the time.
  - How to write the result up so it survives contact with the board: one significant digit, and explainable to someone's mother.
  - Honesty about which steps are judgement dressed up as procedure. I'd rather know now than find out in year three.

  Then run it on three real-ish cases, and at least one should come out in a way I won't like:

  (a) a renewal for a well-run school-based mass deworming / delivery programme that everyone loves, that on the evidence as it stands looks fine, and that at least three bigger funders are already in;
  (b) a cheap speculative research proposal from a tiny team with no track record, testing a mechanism nobody has tested, where the interesting part is the tail outcome and the chance we learn something;
  (c) a community health worker training programme whose numbers look great but which can only roughly double in size per year because of trainer supply.

  Also tell us what the procedure can't do — where it will definately misfire — and don't soften it. We keep tying ourselves in knots in meetings and I'd rather hand the board something with its limits printed on it.
reasoning: |-
  Here's a thinking process that leads to the suggested grantmaking framework:

  1.  **Analyze the User and Context:**
      *   **User:** Program Officer at the Marlow Fund (small family foundation).
      *   **Resources:** $5m/year payout, 2 program staff, quarterly board meetings, monthly grant decisions.
      *   **Volume:** ~25 grants/year (50% renewals).
      *   **Constraint 1 (The Mandate):** $1.5m locked for "future generations" (long-termism/existential risk), $3.5m unrestricted (global health/development). *Crucial:* Money *must* move in the locked bucket.
      *   **Constraint 2 (The Process):** Current ITN (Importance, Tractability, Neglectedness) multiplication is broken. Board has conflicting preferences (Accountant wants 1 sig fig; Trustee wants "dinner table" simplicity).
      *   **Operational Constraints:** 2 hours/proposal max, 1 round of follow-up, no lit reviews, no outside modelers, 1-page memo.
      *   **Desired Output:** A concrete procedure (order of operations, interaction of factors, stop rules, handling uncertainty, reporting format, honesty about judgment), applied to 3 specific cases, plus a "failure modes" section.
      *   **Tone:** Direct, pragmatic, honest about limitations, no fluff.

  2.  **Deconstruct the Problems:**
      *   **Problem 1 (Apples vs. Oranges):** Comparing near-term GH&D to long-term future generations. The "locked bucket" forces spending even if opportunities aren't perfect.
      *   **Problem 2 (Scoring System):** ITN multiplication is mathematically nonsensical (compensatory vs. conjunctive). "Neglectedness" is misunderstood.
      *   **Problem 3 (Board Dynamics):** Need to satisfy the Accountant (simplicity/precision) and the Mother-Test Trustee (narrative/clarity).
      *   **Problem 4 (Resource Constraints):** Can't do deep dive analysis. Need a heuristic that works within 2 hours.

  3.  **Develop the Framework (The "Marlow Protocol"):**

      *   *Philosophy:* Move away from "scoring" to "screening and sizing." Scoring implies precision we don't have. Screening implies thresholds.
      *   *Order of Operations:*
          1.  **Mandate Check:** Does it fit the bucket (Future vs. Near-term)? If not, reject immediately.
          2.  **Neglectedness (Funding Landscape):** *Before* impact. If someone else is already doing it better/cheaper, why us? (Addresses the "who else" intuition).
          3.  **Tractability (at the margin):** Can *this* extra dollar actually move the needle? (Addresses the "average vs. marginal" insight).
          4.  **Importance (Ceiling):** What's the best-case scenario? (Addresses the "tail outcome" for speculative stuff).
      *   *Interaction:* Replace multiplication with a **Gating + Sizing** model.
          *   Gates: Mandate, Integrity, Basic Plausibility.
          *   Sizing: Expected Value (EV) is too hard. Use "Cost per Expected Life/Outcome" or "Strategic Option Value."
      *   *Stop Rules:* Hard "No" on fraud, misalignment, or fully crowded out. Hand-off to Board on "Values" (e.g., risk tolerance in the locked bucket).
      *   *Uncertainty:* Use ranges or qualitative labels (High/Med/Low) but map them to dollar amounts, not scores.
      *   *Reporting:* One page. One significant digit ($1.5m, not $1,482,103). Narrative explanation for the "Mother Test."

  4.  **Refining the "Locked Bucket" Issue:**
      *   This is the trickiest part. If the money *must* be spent on future generations, we can't just say "no good opportunities." We need a "Reserve/Wait" mechanism or a "Best Available" standard.
      *   *Solution:* Treat the locked bucket as a "Venture Capital" portfolio. High risk is acceptable/required. The metric isn't "lives saved now" but "risk reduced" or "knowledge gained."
      *   *Constraint:* The user says "do nothing... isn't available." So we must fund. The framework needs to acknowledge that the *bar* for the locked bucket might be lower on certainty but higher on potential scale.

  5.  **Drafting the Procedure (Iterative refinement):**

      *   *Step 1: Bucket & Fit.* (Pass/Fail).
      *   *Step 2: The Crowd Check (Neglectedness).* Is there a gap? If 3 big funders are there, what is *our* specific niche? (Crucial for Case A).
      *   *Step 3: The Margin (Tractability).* Does money = progress? Or is it constrained by talent/time? (Crucial for Case C).
      *   *Step 4: The Upside (Importance).* For speculative stuff, ignore the base case, look at the 10% chance of massive impact. (Crucial for Case B).
      *   *Decision Rule:* Don't multiply. Use a "Minimum Viable Grant" logic.
      *   *Board Memo:* "Ask," "Why Us," "What if we're wrong," "Number."

  6.  **Addressing the Specific Cases:**

      *   *(a) Deworming Renewal:* High evidence, crowded. *Verdict:* Fund if we add marginal value (e.g., stability), but acknowledge diminishing returns. Maybe reduce size? Or treat as "base load" to free up other funds? Actually, for a small foundation, being a reliable renewer *is* a niche.
      *   *(b) Speculative Biosecurity:* Low evidence, uncrowded (maybe), high tail. *Verdict:* Fund from Locked Bucket. Value is information + option value.
      *   *(c) CHW Training:* Great numbers, scaling bottleneck. *Verdict:* Fund the bottleneck (train the trainers), not the direct service. If they can't scale, our money sits idle. *Correction:* If the constraint is hard, funding is wasted. Need to fund the constraint or say no.

      *   *The "Won't Like" Outcome:* I need to make sure one recommendation feels uncomfortable.
          *   *Idea:* Reject the Deworming (Case A). Why? Because 3 bigger funders are there. Marlow's $200k doesn't move the needle on global health, but it *does* move the needle on biosecurity. Even if Deworming is "safer," the marginal impact is lower. This challenges the "do no harm/safe bet" instinct.
          *   *Alternative:* Fund the CHW program (Case C) *only* if they solve the scaling constraint. If they can't, it's a hard No. This might be unpopular if the program is "loved."
          *   *Decision:* I will recommend **rejecting the Deworming renewal** (Case A) in favor of the Speculative Biosecurity (Case B) for the locked bucket, and highlighting the scaling risk in Case C. Rejecting a "sure thing" for a "speculative thing" is usually the friction point for family foundations. *Wait, better friction:* Recommend funding the Speculative Biosecurity *despite* no track record, and recommend *cutting* the Deworming grant because the marginal dollar does less good there. This hits the "safety vs. impact" tension.

  7.  **Addressing the "Honesty" Requirement:**
      *   Explicitly state where the procedure is just formalized gut check.
      *   Explicitly state where the Board must decide (Risk tolerance).
      *   Explicitly state where the math is fake (The "One Significant Digit" rule).

  8.  **Final Review against Constraints:**
      *   2 hours/proposal? Yes, the steps are quick heuristics.
      *   1-page memo? Yes, structure provided.
      *   Board constraints? Yes, 1 sig fig + narrative.
      *   Locked bucket mandate? Yes, differentiated criteria.

  9.  **Drafting the Content:** (Self-Correction during drafting)
      *   *Correction on ITN:* Don't use ITN at all. It's baggage. Use "Fit, Gap, Leverage, Upside."
      *   *Correction on Multiplication:* Use "Weakest Link" logic for near-term, "Option Value" logic for long-term.
      *   *Memo Format:* Needs to be very specific.
      *   *Case A (Deworming):* I need to be careful. If it's a renewal, stopping it has reputational cost. But the prompt asks for *impact* logic. I will suggest a "Phase Out" or "Reduce" rather than a hard cut, OR a hard cut if the marginal impact is truly low. Let's go with "Reduce/Exit" to show the teeth of the framework.
      *   *Case C (CHW):* The constraint is the key. If they can't scale, funding is waste. The recommendation must be "Fund the constraint or No."

  10. **Final Polish:** Ensure tone is professional but candid ("Honesty about which steps are judgement dressed up as procedure").

  *(Self-Correction on the "Won't Like" outcome)*: The prompt asks for "at least one should come out in a way I won't like."
  *   *Option 1:* Reject the Deworming (safe, popular).
  *   *Option 2:* Fund the Biosecurity (risky, abstract).
  *   *Option 3:* Tell them the CHW program is a trap.
  *   *Selection:* I will recommend **rejecting the Deworming renewal**. Program Officers hate breaking relationships with reliable partners. It demonstrates the "Marginal Impact" rule ruthlessly.

  11. **Final Structure:**
      *   Introduction (Acknowledging the mess).
      *   The Procedure (The 4-Step Filter).
      *   The Decision Logic (Gating vs. Sizing).
      *   The Board Memo (Template).
      *   The Three Cases (Applied).
      *   Failure Modes (Where this breaks).

