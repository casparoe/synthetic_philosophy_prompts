  SOCIETY FOR PSYCHICAL RESEARCH
  INTERNAL MEMORANDUM: COMMITTEE ON ETHICAL PHENOMENA
  DATE: 14 November 1893
  TO: The Council
  FROM: Dr. E. Vance, Secretary
  SUBJECT: Allocation of Funds for Spectral Manifestations

  **1. Preamble**
  Recent inquiries into hauntings at Waverley Abbey and the Hampstead residence have strained the Society's coffers. It is the opinion of this Committee that financial support for ectoplasmic activity must no longer be granted on the basis of mere volume or noise. Henceforth, all proposed manifestations shall be subjected to a tripartite ethical audit derived from Professor Sidgwick's systematic framework. We must determine not only if a ghost *can* appear, but if it *ought* to appear. Fiscal responsibility requires that we treat the afterlife as a ledger of moral accounts.

  **2. The Continuity Coefficient**
  Before ethical calculation may commence, the entity's moral status must be established. We introduce the 'Continuity Coefficient' (CC), a metric ranging from 0.0 to 1.0, measuring the preservation of personal identity post-mortem. A spectre exhibiting only repetitive mechanical actions, such as dragging chains or moaning at fixed intervals, shall be assigned a CC of 0.2. This indicates negligible survival of the moral agent; such phenomena are merely psychic residue, akin to heat left in a room after a fire departs. Funds are withheld from entities with a CC below 0.5, as one cannot owe duties to a mere echo. Only ghosts retaining memory, volition, and specific knowledge of their living counterparts qualify for moral consideration and subsequent funding.

  **3. Method of Egoism (Spirit's Interest)**
  For entities surpassing the CC threshold, we assess the benefit to the apparition itself. Does the manifestation serve the spirit's own happiness or development? Case File 89-B (The Weeping Monk) demonstrates a negative egoistic balance; the entity exhibits clear distress upon materialization, suggesting the act violates its own rational self-interest. Funding such torment is impermissible. We propose a stipend only for spirits who demonstrate measurable satisfaction in communication, verified via planchette sentiment analysis. If the ghost does not wish to be here, we shall not pay for its transit.

  **4. Method of Utilitarianism (Observer Pleasure)**
  The greatest happiness principle must be applied to the living sitters. A haunting that produces terror exceeding thrill is fiscally irresponsible. The Hampstead poltergeist, while energetic, caused fainting in three dowagers and a broken tea service. When calculating net pleasure, the cost of the porcelain and the medical bills for the dowagers must be subtracted from the intellectual excitement of the researchers. The result was a deficit. Future grants require a pre-approval risk assessment ensuring that observer amusement outweighs cardiac distress. We suggest a cap on decibel levels for nocturnal rappings to maximize aggregate comfort.

  **5. Method of Intuitionism (Duty to Manifest)**
  Finally, we consider if there exists an immediate moral obligation for the spirit to appear, regardless of consequences. Certain unresolved estates suggest a duty to reveal wills or locate missing heirlooms. However, intuition must be regulated. A ghost appearing merely to point at a floorboard without subsequent discovery of evidence is failing its intuitive duty. The Committee will require a prospectus of intended revelations before authorizing midnight vigils. Vague ominousness is no longer a billable expense.

  **6. Recommendations**
  Effective immediately, all haunting subsidies are suspended pending CC evaluation. The Weeping Monk is denied further support due to low egoistic return. The Hampstead entity is probationary pending noise reduction and proof of identity continuity. We must apply rigorous reason to the irrational. Please submit all new spectral petitions in triplicate, accompanied by a statement of moral intent.

  Signed,
  Dr. E. Vance
  Secretary, Committee on Ethical Phenomena
