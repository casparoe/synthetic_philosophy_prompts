  SOCIETY FOR PSYCHICAL RESEARCH
  INTERNAL MEMORANDUM: COMMITTEE ON ETHICAL PHENOMENA
  DATE: 14 November 1893
  TO: The Council
  FROM: Dr. E. Vance, Secretary
  SUBJECT: Allocation of Funds for Spectral Manifestations

  1. **Preamble**
  Recent inquiries into hauntings at Waverley Abbey and the Hampstead residence have strained the Society's coffers. It is the opinion of this Committee that financial support for ectoplasmic activity must no longer be granted on the basis of mere volume or noise. Henceforth, all proposed manifestations shall be subjected to a tripartite ethical audit derived from Professor Sidgwick's systematic framework. We must determine not only if a ghost *can* appear, but if it *ought* to appear.

  2. **The Continuity Coefficient**
  Before ethical calculation may commence, the entity's moral status must be established. We introduce the 'Continuity Coefficient' (CC), a metric ranging from 0.0 to 1.0, measuring the preservation of personal identity post-mortem. A spectre exhibiting only repetitive mechanical actions (e.g., dragging chains) shall be assigned a CC of 0.2, indicating negligible survival of the moral agent. Funds are withheld from entities with a CC below 0.5, as one cannot owe duties to a mere echo. Only ghosts retaining memory and volition qualify for moral consideration.

  3. **Method of Egoism (Spirit's Interest)**
  For entities surpassing the CC threshold, we assess the benefit to the apparition itself. Does the manifestation serve the spirit's own happiness or development? Case File 89-B (The Weeping Monk) demonstrates a negative egoistic balance; the entity exhibits clear distress upon materialization. Funding such torment violates the principle of rational self-interest. We propose a stipend only for spirits who demonstrate measurable satisfaction in communication, verified via planchette sentiment analysis.

  4. **Method of Utilitarianism (Observer Pleasure)**
  The greatest happiness principle must be applied to the living sitters. A haunting that produces terror exceeding thrill is fiscally irresponsible. The Hampstead poltergeist, while energetic, caused fainting in three dowagers and a broken tea service. The net pleasure was negative. Future grants require a pre-approval risk assessment ensuring that observer amusement outweighs cardiac distress. We suggest a cap on decibel levels for nocturnal rappings.

  5. **Method of Intuitionism (Duty to Manifest)**
  Finally, we consider if there exists an immediate moral obligation for the spirit to appear, regardless of consequences. Certain unresolved estates suggest a duty to reveal wills. However, intuition must be regulated. A ghost appearing merely to point at a floorboard without subsequent discovery of evidence is failing its intuitive duty. The Committee will require a prospectus of intended revelations before authorizing midnight vigils.

  6. **Recommendations**
  Effective immediately, all haunting subsidies are suspended pending CC evaluation. The Weeping Monk is denied further support due to low egoistic return. The Hampstead entity is probationary pending noise reduction. We must treat the afterlife not as a chaotic mystery, but as a ledger of moral accounts. Please submit all new spectral petitions in triplicate.

  Signed,
  Dr. E. Vance

