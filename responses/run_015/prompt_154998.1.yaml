prompt: |-
  hey — could you write me a deadpan parody of an 1890s Society for Psychical Research internal memo? The conceit is that Sidgwick's ethics committee is rating which hauntings deserve funding, applying the three methods from Methods of Ethics — egoism, utilitarianism, intuitionism — to classify apparitions. Invent a secretary, Dr. E. Vance. The satire should exaggerate how rationalist ethics turns into accounting for souls: every ghost gets scored on observer pleasure, it's own self-interest, and an 'intuitive duty to manifest.' Please inject a made-up idea, the 'continuity coefficient,' measuring how much personal identity survives death so the committee knows if a ghost counts as the same person for moral consideration. Keep it readable even if you don't know Sidgwick well, but fair to someone who does. About 600 words, numbered bureacratic sections, formal deadpan voice. Don't quote real texts — just paraphrase. And no bibliography or reading list; I want this doable without looking anything up.
