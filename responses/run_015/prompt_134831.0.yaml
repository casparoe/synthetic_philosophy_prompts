answer: |-
  This is a high-level debate touching on the exact fault lines where modern decision theory (specifically MIRI's work on Functional Decision Theory and Embedded Agency) is currently struggling. Both friends are grasping real concepts, but one is applying them more correctly than the other.

  Here is the move-by-move breakdown.

  ### Move 1: Friend A
  **Claim:** UDT is right that you shouldn't update on your own choice in Newcomb's; the predictor accounted for your algorithm. Treating your decision as news is double-counting.
  **Rating:** **Clearly Right.**
  **Analysis:** This is the textbook definition of Updateless Decision Theory. UDT functions by selecting a *policy* (a mapping from inputs to outputs) based on a prior, rather than selecting an *action* based on posterior observations. In Newcomb's, updating on the fact that you are about to one-box provides evidence that the predictor already put money in the box. If you treat that evidence as new information to condition on, you sever the logical link between your algorithm and the prediction. A correctly identifies that UDT refuses this update to preserve the acausal leverage.

  ### Move 2: Friend B
  **Claim:** What about logical uncertainty over your own code? (e.g., 15% chance of corruption). "Your decision" becomes ambiguous.
  **Rating:** **Mostly Right.**
  **Analysis:** B is identifying the "Logical Omniscience" assumption in classic UDT. Standard UDT 1.0 assumes you know your own source code perfectly. B is correct that realistic agents have uncertainty about their own implementation. This is a valid stress test. However, B implies this ambiguity breaks the concept of "your decision." Modern iterations (UDT 1.1, FDT) handle this by treating the decision as a probability distribution over logical statements. B is right that it complicates things, but wrong to imply it makes the decision undefined.

  ### Move 3: Friend A
  **Claim:** B is conflating logical uncertainty about implementation with evidential updates about outcomes. UDT only refuses the latter.
  **Rating:** **Clearly Right.**
  **Analysis:** This is the winning technical point. There is a hard distinction between:
  1.  **Empirical/Hardware Uncertainty:** "My CPU might be fried, so I might two-box involuntarily." (UDT *does* update on this).
  2.  **Evidential/Correlational Updating:** "I observe I am one-boxing, therefore the box likely has money." (UDT *refuses* this).
  B is trying to use Type 1 uncertainty to justify Type 2 updating. A correctly calls out that UDT is perfectly happy to update on the probability of its own hardware failing; it only refuses to update on the *implications* of its output for the predictor's past action.

  ### Move 4: Friend B
  **Claim:** In embedded agency, beliefs about code come through physical sensors. You can't cleanly separate them.
  **Rating:** **Mostly Right.**
  **Analysis:** This is the core thesis of the "Embedded Agency" research program. If you are a physical object, your knowledge of your own algorithm is derived from physical observations (proprioception, memory, code scans). Therefore, the distinction between "logical" and "empirical" is blurry at the boundaries. B is right that this is a profound metaphysical problem for UDT. However, B is slightly overstating the collapse: Functional Decision Theory argues that even if accessed via sensors, the *logical relationship* between your algorithm and the predictor's simulation remains distinct from the *causal relationship* of the sensors.

  ### Move 5: Friend A
  **Claim:** Then you're just doing Causal DT with extra steps and relabeling it.
  **Rating:** **Mostly Wrong.**
  **Analysis:** A is making a common CDT rebuttal to FDT/UDT. A claims that if you treat self-knowledge as empirical, you lose the acausal link and collapse back to Causal Decision Theory. This is false. FDT explicitly maintains that while your *access* to your code is physical, the *dependency* between your code and the predictor's simulation is logical. You can be an embedded physical agent and still recognize that your output and the predictor's output are logically correlated computations. A is dismissing the solution (logical counterfactuals) because the implementation is hard, not because it's theoretically impossible.

  ***

  ### The Corruption Example: Red Herring or Breaker?
  **Verdict:** **Red Herring.**

  B's corruption example does not break UDT; it just forces UDT to use a probability distribution over its own source code.
  Here is the logic: UDT asks, "Which policy maximizes expected utility?"
  If there is a 15% chance you are corrupted to two-box, UDT calculates the EV of the policy "One-Box" as:
  $0.85 \times P(\text{Money} | \text{One-Box}) + 0.15 \times P(\text{Money} | \text{Two-Box})$.
  The predictor, knowing your code (including the corruption probability), simulates this exact calculation.
  The corruption adds *noise* to your output, but it does not change the *normative rule* that you should select the policy that correlates with the money. B is confusing "I am uncertain what I will do" with "I should act as if my decision doesn't influence the prediction." UDT handles the uncertainty without surrendering the leverage.

  ***

  ### Final Verdict: Who is More Right?
  **Friend A is more right.**

  **Why:**
  Friend B identifies a real, open research problem (Embedded Agency/Logical Uncertainty), but draws the wrong conclusion from it. B assumes that because self-knowledge is physically mediated, the logical link to the predictor dissolves. This is a category error. The physical *implementation* is embedded, but the *computation* is still subject to logical constraints.

  Friend A correctly defends the core mechanism of UDT: the distinction between updating on hardware reliability (permitted) and updating on the evidential news of your own decision (forbidden). A's final move (claiming it collapses to CDT) is weak, but A's earlier moves correctly identify that B is trying to use hardware uncertainty to smuggle in evidential reasoning, which is the actual error.

  B is pointing at the fact that UDT is hard to implement in the real world. A is pointing at the fact that UDT is still the correct *normative* theory for the problem. In a debate about whether UDT is "right," A wins because B's objections are implementation hurdles, not logical refutations.

  **Winner: Friend A.**
