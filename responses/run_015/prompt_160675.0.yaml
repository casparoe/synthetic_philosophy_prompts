          *   *Critique:* This sounds more like *Gestalt* psychology or *Goodman's* "grue" or standard *narrative theory* (retrospective patterning) than specifically Dennett's MDM. The Cutaneous Rabbit is about *spatiotemporal interpolation* in somatosensory cortex. Reading is semantic/symbolic. The leap is significant.
