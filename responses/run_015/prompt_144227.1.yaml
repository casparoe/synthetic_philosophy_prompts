      *   *Section 2: The Game Theory.* Explain why it's not a Coordination Game (Prisoner's Dilemma / Chicken / Assurance Game mix). Identify the players.
      *   *Section 3: The Load-Bearing Assumption.* Pinpoint "Exogenous Preferences." This is the weak spot.
      *   *Section 4: Better Analogies.* Stigma/Smoking or Currency Run.
      *   *Section 5: Strategic Advice.* How to use this in the dissertation without alienating the supervisor.

  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address Appiah? Yes, need to emphasize that for Appiah, honor *is* a payoff, but arguments change the *value* of that honor.
      *   *Check:* Did I address Williams/Drescher? Yes, the economic payoff is part of the matrix, but the supervisor dismisses the *moral* payoff.
      *   *Nuance:* The supervisor isn't wrong that *some* coordination was needed (MPs voting together). He's wrong that *only* coordination happened.
      *   *Key Insight:* The "Compensation" point the user raised is huge. Conventions don't usually require paying the losers £20 million (in 1830s money). That signals a property rights violation, not a traffic rule change.

  10. **Final Polish:** Ensure the tone is supportive but analytically sharp. (e.g., "Your supervisor is smuggling in a premise," "The analogy is a camouflage.")

  *(Self-Correction on Game Theory specifics)*: Is it a Coordination Game?
  *   Driving: Yes (Battle of the Sexes or Pure Coordination).
  *   Abolition: For the *public*, maybe Assurance (I'll boycott if you boycott). For *Planters vs. State*, it's Conflict. For *MPs*, it might be Coordination (voting bloc).
  *   The supervisor is conflating the MPs' voting behavior (coordination) with the societal shift (norm change).

  *Final Plan:*
  1. Validate the "Coordinating with Whom" intuition.
  2. Audit the Driving Analogy (3 fatal flaws).
  3. Identify the Load-Bearing Assumption (Exogenous Preferences).
