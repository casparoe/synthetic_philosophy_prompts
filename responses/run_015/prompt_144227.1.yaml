answer: |-
  This is an exceptionally sharp diagnosis of a methodological problem. You have correctly identified that your supervisor is using a specific game-theoretic model (Coordination Game with Exogenous Preferences) and disguising it as a neutral "common sense" analogy (driving on the left).

  Your "coordinating with whom" problem is not just a snag; it is the fatal flaw in his model. In a driving convention, the players are symmetric (all drivers). In abolition, the players are asymmetric (enslaved, planters, metropole consumers, state).

  Here is an audit of the analogy, the game theory, and the load-bearing assumption you need to target.

  ### 1. Auditing the "Driving on the Left" Analogy

  If we take the mapping seriously, here is how the correspondence breaks down.

  | Feature | Driving Convention | Atlantic Slavery / Abolition | Why it Matters |
  | :--- | :--- | :--- | :--- |
  | **Payoff Symmetry** | **Symmetric.** I want to match you; you want to match me. We both lose if we mismatch. | **Asymmetric.** Planters gain from slavery; Enslaved lose. Abolitionists gain moral utility; Planters lose capital. | Coordination games require common interests. Abolition was a **conflict game** with coordination elements *within* factions. |
  | **The "Crash"** | **Physical/Immediate.** If we mismatch, we die *now*. | **Social/Moral.** If you keep slaves, you don't physically crash; you incur social shame or naval interdiction. | The "cost" of slavery wasn't inherent to the act (like a crash); it was **constructed** by the norm. |
  | **Preference Stability** | **Fixed.** Everyone prefers not to crash. | **Fluid.** The "honor" payoff changed. In 1780, owning slaves = status. In 1840, owning slaves = shame. | This is the big one. Driving assumes fixed preferences. Abolition requires **endogenous preference change**. |
  | **Compensation** | **None.** Nobody pays you to switch sides of the road. | **£20 Million.** The state compensated planters for "property" loss. | Conventions don't require compensation. Property rights violations do. This proves it wasn't seen as a mere convention shift. |
  | **Enforcement** | **Physics + Police.** | **Naval Squadron + Social Ostracism.** | The Royal Navy had to *force* the coordination. Conventions usually self-enforce once tipped. |

  **The Verdict:** The analogy works only if you assume the *only* thing that mattered was MPs voting together (a coordination problem within Parliament). It fails completely to explain why the *public* or the *planters* changed their behavior.

  ### 2. The "Coordinating With Whom" Problem (Game Structure)

  You got stuck on the matrix because **there is no single 2x2 game here.** Your supervisor is conflating three different games:

  1.  **The Public/Consumer Game (Assurance Game):** "I will boycott sugar if you boycott sugar." Here, arguments *matter* because they solve the assurance problem. Without the argument ("slavery is sin"), there is no focal point for the boycott.
  2.  **The Planter/State Game (Chicken / Conflict):** Planters want slavery; the State (eventually) wants abolition. This is not coordination; it is coercion. The State had to deploy the West Africa Squadron to *force* the planters to comply.
  3.  **The Honor Game (Appiah's Domain):** This is a game of social signalling. The payoff for "Gentleman" status depends on the audience's valuation.

  **Where the Supervisor's Model Breaks:**
  He is treating the **Honor Game** as a **Driving Game**.
  *   **Driving:** The payoff (safety) exists independently of what people say about it.
  *   **Honor:** The payoff (status) exists *only* because of what people say about it.

  If Appiah is right, the "argument" is not an obituary; it is the **mechanism that revalues the currency.** You cannot separate the argument from the payoff shift because the argument *is* the payoff shift.

  ### 3. The Load-Bearing Assumption: Exogenous Preferences

  Your supervisor's conclusion ("arguments were epiphenomenal") rests entirely on one Rational Choice axiom: **Preferences are exogenous (fixed).**

  *   **His Model:** Payoffs are fixed (Profit vs. Cost). Arguments are just cheap talk. People switch when the *external* costs (e.g., sugar prices, French competition) outweigh the benefits.
  *   **Appiah's Model:** Payoffs are endogenous. Arguments change the *internal* cost function (Shame/Honor). If "Honour" is a utility, and arguments change the value of Honour, then arguments are causal variables.

  **The Disanalogy that Kills His Argument:**
  In driving, nobody argues that "Left is morally superior to Right." In abolition, the argument was that "Slavery is morally inferior to Freedom."
  If the supervisor says, "That's just fashion (flared trousers)," he is asserting that moral disgust is identical to aesthetic preference.
  *   **Noise:** Whether they wore trousers or not.
  *   **Load-Bearing:** Whether the "disgust" imposes a material cost.
      *   If I wear flared trousers, you laugh, but I keep my job.
      *   If I own slaves in 1840, you ostracize me, my daughters can't marry, and my credit dries up.
      *   **Therefore:** The argument created a *material sanction* (credit risk, marriage market exclusion). That makes the argument a causal economic force, not just chatter.

  ### 4. Better Analogies (That Might Save or Sink Him)

  If you want to engage him on his own turf, drop the driving analogy. It's too weak. Try these:

  **A. The "Run on the Bank" (Speculative Attack)**
  *   **Mapping:** Slavery is a currency. Abolitionism is a rumor that the currency is toxic.
  *   **Mechanism:** If enough people believe the currency is bad, it *becomes* bad (self-fulfilling prophecy).
  *   **Implication:** The *argument* (the rumor) is the cause of the crash. Without the rumor, the bank stands.
  *   **Does it help him?** No. It makes the "obituary" (the argument) the primary driver of the payoff shift.

  **B. The "Smoking Norm" Shift (1950–2000)**
  *   **Mapping:** Smoking = Slavery. Both were profitable, socially accepted, then stigmatized.
  *   **Mechanism:** Scientific arguments (health) + Moral arguments (second-hand smoke) changed the payoff structure.
  *   **Why it's better:** It acknowledges economic interests (Tobacco lobby = Planters) but shows how social stigma made the practice too costly to maintain, *even when profitable*.
  *   **Does it help him?** Only if he can prove the health studies were epiphenomenal to a hidden cost shift. (Hard to do).

  **C. The "Strike"**
  *   **Mapping:** Abolitionists = Union. Planters = Management.
  *   **Mechanism:** A strike only works if workers coordinate. But they coordinate *based on a grievance*.
  *   **Implication:** You cannot separate the "coordination" from the "grievance." The argument *creates* the coalition.
  *   **Does it help him?** No. It highlights that the *reason* for coordination is causal.

  ### 5. Strategic Advice for the Dissertation

  You don't need to defeat your supervisor to write a good dissertation. You need to **boundary his claim.**

  1.  **Concede the Coordination Point:** Agree that *once* the norm shifted, Parliament acted as a coordination body to codify it. Acknowledge that without a critical mass of MPs, the law wouldn't pass. This validates his RCT intuition without accepting his historical causality.
  2.  **Attack the "Exogenous Preferences" Axiom:** This is your theoretical contribution. Argue that in *moral* markets, discourse is not "cheap talk." It is an investment that alters the payoff matrix by introducing **social sanction costs**.
      *   *Phrase to use:* "Discourse as Endogenous Preference Shaping."
  3.  **Use the Compensation Data:** The £20 million compensation is your empirical hammer. Conventions (driving, trousers) do not trigger state compensation. Property seizures do. This proves the state viewed this as a violation of rights, not a traffic rule update. This implies the "cost" of abolition was high enough to require a bribe, contradicting the idea that the "plug was pulled" simply because it was unprofitable (Williams) or effortless (Convention).
  4.  **Reframe the "Epiphenomenal" Claim:** Suggest that arguments are not the *obituary*, but the **pricing mechanism**. They didn't just record the death; they set the cost of continuing the life.

  **Summary for your Supervisor:**
  "The driving analogy assumes a Coordination Game with fixed payoffs. Abolition looks more like a Stag Hunt where the 'Stag' (Honour) changes value based on communication. If communication changes the payoff matrix, it is causal, not epiphenomenal. I propose we model the 'Shame' variable as a transaction cost introduced by abolitionist discourse."

  This speaks his language (transaction costs, matrices, variables) while forcing him to admit that the "arguments" are the variable introducing the cost. If he denies that, he's no longer doing social science; he's doing dogma.
