prompt: |-
  hi — i'm writing my third-year dissertation on how the Atlantic slave system actually ended, so i've got the Williams thesis (interests: the sugar colonies stopped paying, so the plug got pulled) on one side and Appiah's honour story on the other, and my supervisor is a rational choice guy who keeps deflating the whole thing. His line is that a norm is just a convention, exactly like driving on the left: everybody does it because everybody expects everybody else to, nobody in the history of the world was ever argued out of driving on the left, and when people switch it's because enough other people switched. So the abolitionists' arguments were the obituary, not the cause — they're what people wrote while the real mechanism did its work. He runs the same line on duelling: nobody refuted the code duello, gentlemen just gradually stopped caring. When I pointed out that i vaguely remember someone (Drescher?) arguing the West Indian sugar economy was still growing, not dying, when Britain abolished the trade, he just said fine, then something else in the payoff structure moved and that's what I should be looking for. When I pushed harder he switched analogies entirely: it's like a fashion, nobody argues anyone out of flared trousers.

  The analogy is doing a lot of work in his hands — it's basically what licenses "arguments were epiphenomenal, go find the real cause" — and I can't tell how much of that is the analogy and how much is the model it's riding on. I sat down to to write it out as an actual payoff matrix and got stuck in about ten minutes, because I couldn't work out who the players are even supposed to be (planters? MPs? the people being enslaved? the people boycotting slave-grown sugar? the guys being press-ganged onto the anti-slave-trade patrols?) or whether we're in a common-interest coordination game at all. I've started calling this the "coordinating with whom" problem, which I'm fairly sure isn't a real term.

  Could you audit the driving-on-the-left analogy for me: what corresponds to what if you take the mapping seriously, where it breaks, and specifically which of the disanalogies matter for the conclusion he's using it for and which are just noise. The things I keep getting snagged on: pure conventions are cases where everyone is better off matching, whereas abolishing slavery looks like some people's interests being straight-up defeated (and then compensated, at enormous public expense, which seems like an odd thing for a convention to require); norms come with honour and blame and shame bolted onto them in a way that driving on the left doesn't seem to; and his payoffs look like they're meant to be fixed while Appiah's story seems to be about what people want changing — which, if that's right, means the argument and the payoff shift aren't two separate things he gets to choose between, and the whole "epiphenomenal" move quietly assumes what it needs to prove. If the convention picture genuinely can't carry the anti-argument bit, is there a better analogy that does the work Appiah wants (honour as a kind of credit? a norm as a language? a boycott or a strike, where the argument is part of the mechanism?) — and would that better one rescue my supervisor's conclusion too, or does "the arguments didn't matter" only survive inside the coordination version? I don't need to win the supervision, I just want to know which bit of his picture is load-bearing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** Third-year undergraduate (likely UK system, given "dissertation" and "supervisor"), studying history/political science/economics. High level of sophistication. Understands Williams (economic determinism), Appiah (honor/norms), Drescher (economic counter-argument), and Rational Choice Theory (RCT) basics (payoff matrices, coordination games).
      *   **Supervisor:** Rational Choice theorist. Argues that norms are just conventions (like driving on the left). Believes moral arguments are epiphenomenal (obituaries, not causes). Uses analogies (driving, dueling, fashion) to deflect moral/economic causation debates.
      *   **Problem:** The user suspects the supervisor's analogy is doing too much heavy lifting and might be flawed. They tried to model it as a game matrix and got stuck on player identification and payoff structures. They want an audit of the "driving-on-the-left" analogy.
      *   **Goal:** Determine where the analogy breaks, which disanalogies matter for the supervisor's conclusion ("arguments didn't matter"), and whether a better analogy exists that might save or sink the supervisor's thesis.
      *   **Tone:** Academic, rigorous, slightly conversational (matching the user's "hi — i'm writing..."), critical but constructive.

  2.  **Deconstruct the Supervisor's Argument:**
      *   **Core Claim:** Abolition was a shift in equilibrium of a coordination game.
      *   **Mechanism:** People switch because others switch (network effects/convention), not because of moral persuasion.
      *   **Implication:** Moral arguments are *ex post* rationalizations (epiphenomenal).
      *   **Analogy:** Driving on the left (pure convention).
      *   **Secondary Analogies:** Dueling (honor norm), Fashion (flared trousers).

  3.  **Audit the "Driving-on-the-Left" Analogy:**
      *   *Mapping:*
          *   Left/Right Driving $\rightarrow$ Slavery/Abolition.
          *   Safety/Efficiency $\rightarrow$ Economic/Social Stability.
          *   Drivers $\rightarrow$ Who? (Planters? Voters? MPs?).
          *   Crash $\rightarrow$ Social sanction/Economic loss?
      *   *Breakdown Points:*
          1.  **Symmetry of Payoffs:** Driving is symmetric (I want to match you, you want to match me). Slavery is asymmetric (Planters gain, Enslaved lose massively).
          2.  **Zero-Sum vs. Positive-Sum:** Driving is positive-sum coordination. Abolition involves massive redistribution (compensation to planters, freedom to enslaved).
          3.  **Endogenous Preferences:** Driving preferences are fixed (don't crash). Abolition involves *changing* preferences (honor, morality), which RCT usually treats as exogenous.
          4.  **Enforcement:** Driving is enforced by physics (crash) + state. Slavery was enforced by violence + law. Abolition required *state violence* against former owners (navy patrols).
          5.  **The "Argument" Role:** In driving, arguments don't matter. In abolition, arguments *changed the payoff structure* (shame made slavery costly).

  4.  **Address the "Coordinating with Whom" Problem:**
      *   The user is right to be stuck. A 2x2 matrix fails here because it's a multi-level game.
      *   Players: Enslaved (resistance), Planters (profit), Metropole Public (consumers/voters), State (tax/navy).
      *   It's not a coordination game; it's a *conflict* game with coordination elements *within* groups.

  5.  **Evaluate the "Epiphenomenal Arguments" Claim:**
      *   If norms are just conventions, arguments don't change payoffs.
      *   If norms are *constitutive* (Appiah), arguments *change* the payoffs (shame makes a previously profitable action costly).
      *   *Crucial Point:* The supervisor assumes preferences are fixed. Appiah argues preferences (honor) are malleable via discourse. If discourse changes payoffs, discourse is causal, not epiphenomenal.

  6.  **Develop Better Analogies:**
      *   *Strike/Boycott:* Arguments are essential to coordinate the boycott. The argument *is* the mechanism.
      *   *Currency Devaluation:* Confidence is key. Arguments affect confidence.
      *   *Stigma (e.g., Smoking):* Closer to slavery. Economic interests existed, but social cost shifted. Arguments drove the social cost.

  7.  **Synthesize the "Load-Bearing" Wall:**
      *   The supervisor's conclusion rests on **Exogenous Preferences**.
      *   If preferences can change endogenously (through argument/shame), the RCT model still works, but the "arguments are epiphenomenal" claim fails.
      *   The "Driving" analogy hides this because driving preferences (safety) don't change. Slavery preferences (profit vs. honor) *did* change.

  8.  **Drafting the Response:**
      *   *Acknowledge sophistication:* Validate the "coordinating with whom" insight.
