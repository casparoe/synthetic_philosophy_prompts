answer: |-
  **Question 1**
  You preserve the shift from formal to familiar address that happens halfway through the original. Since English doesn't have different words for formal and familiar "you," you must use a different device to create that same social movement. When you say you are preserving the form here, are you preserving the grammatical mechanism itself, or just the social effect it produces?

  *   **Expected Answer:** She will likely argue that the form *is* the effect on the reader; the grammatical mechanism is just the local tool French uses to achieve it. She will say preserving the effect *is* preserving the form because form is functional.
  *   **Follow-up:** If the form is defined by the effect rather than the mechanism, doesn't that mean you are replacing the original's form with an English functional substitute, rather than carrying the original form across?
  *   **Assumption Flag:** This assumes that "form" must include the specific linguistic machinery (grammar) and not just the structural outcome. She could reject this by defining form purely as relational dynamics.
  *   **Drop Condition:** If she immediately concedes that it is a functional substitute and argues that *all* translation is substitution of machinery, I would drop the distinction between "preserving" and "replacing" and ask instead about the limits of substitution.

  **Question 2**
  Marot embeds his own first name in the middle of the poem to satisfy a rhyme. In your versions, do you keep "Clément" or substitute your own name? If you keep his, you are importing a foreign sound to make an English rhyme work; if you use yours, you become the speaker of the poem. Which of these choices counts as translation, and what does that imply about whether a proper name belongs to the poem's form or its content?

  *   **Expected Answer:** She will likely say she keeps "Clément" to maintain the historical voice, or that she substitutes her name to show the translator's presence is inevitable. She will argue the name is part of the structural constraint (the rhyme) and thus part of the form.
  *   **Follow-up:** If the name is part of the form because it serves a rhyming function, does that mean any word chosen purely for rhyme becomes part of the form, regardless of its meaning?
  *   **Assumption Flag:** This assumes there is a clear boundary between "form" and "content" that a proper noun might cross. She could reject this by saying the distinction is false.
  *   **Drop Condition:** If she argues that proper names are purely content and should always be kept regardless of rhyme, I would rephrase to ask why rhyme should ever override content if content includes identity.

  **Question 3**
  French and English count syllables differently; what counts as one beat in French might be two in English, or vice versa. When you enforce a three-syllable line in English, are you honoring the actual constraint the original satisfies, or only the nearest English analogue to it?

  *   **Expected Answer:** She will admit it is an analogue but argue that it is the only way to honor the *experience* of the constraint. She will say the constraint is the tightness of the space, not the phonetic count itself.
  *   **Follow-up:** If you are honoring the experience of the constraint rather than the constraint itself, doesn't that shift the goal from formal fidelity to psychological fidelity?
  *   **Assumption Flag:** This assumes that an "analogue" is fundamentally different from the "original constraint." She could argue that constraints are abstract patterns that exist independently of specific languages.
  *   **Drop Condition:** If she provides a technical explanation of how syllable counting is universal enough across the two languages, I would drop the "analogue" challenge and ask about specific exceptions.

  **Question 4**
  Rhyme also works differently: French rhymes can rely on grammatical endings that sound identical but carry different meanings, whereas English rhymes often rely on sound alone. If your English rhymes rely on different phonetic properties than the French ones, can you still claim to be preserving the rhyme scheme, or are you preserving the effect of rhyme on a competent reader?

  *   **Expected Answer:** She will likely say she is preserving the effect of rhyme on a competent reader of the translation. She will argue that a rhyme that doesn't sound like a rhyme to the target audience is not a rhyme, regardless of the source.
  *   **Follow-up:** If the definition of rhyme depends on the reader's competence, doesn't that mean the form changes depending on who is reading it, rather than being a fixed property of the poem?
  *   **Assumption Flag:** This assumes that "form" should be an objective property of the text, not dependent on reader reception. She could reject this by adopting a reader-response theory of form.
  *   **Drop Condition:** If she argues that reader competence is irrelevant and only the acoustic signal matters, I would drop the "competence" angle and ask about acoustic mismatches.

  **Question 5**
  You have produced 140 versions that all satisfy the same strict formal constraints. Since the constraint itself cannot distinguish between them, what separates the successful versions from the failed ones? Do you have a criterion for quality that you can state before producing a version, or is quality only recognizable after the fact?

  *   **Expected Answer:** She will likely say quality is recognizable after the fact, based on how naturally the constraint wears or how much surprise the language offers. She may deny there is a pre-stated criterion beyond "fitting the shape."
  *   **Follow-up:** If quality is only visible after the fact, doesn't that make the constraint a generator of options rather than a guide to the right solution?
  *   **Assumption Flag:** This assumes that a robust method should have pre-stated criteria for success. She could reject this by embracing an intuitive or aesthetic judgment model.
  *   **Drop Condition:** If she lists specific pre-stated criteria (e.g., "no archaic words"), I would drop the "after the fact" challenge and ask her to apply those criteria to a specific example.

  **Question 6**
  This form is demanding in English, but for some language pairs, reproducing a form might be almost effortless. Is the difficulty of reproduction part of what makes formal fidelity valuable? Do you accept the consequence that the same degree of formal fidelity might be worth more for one language pair than for another?

  *   **Expected Answer:** She will likely say difficulty is not the point; fidelity is the point. However, she might concede that the *achievement* is more visible when difficult, but the *value* remains in the fidelity itself.
  *   **Follow-up:** If fidelity is valuable regardless of difficulty, why prioritize this demanding form over a simpler one that conveys the sense more clearly?
  *   **Assumption Flag:** This assumes that value is correlated with effort or scarcity. She could reject this by arguing value is intrinsic to the act of fidelity itself.
  *   **Drop Condition:** If she argues that difficulty is irrelevant to value, I would drop the economic/effort framing and ask about the ethical obligation to the form.

  **Question 7**
  Several of your versions address a failing laptop or a stalled car rather than a sick person. On your account that form is content, is the specific occasion—a get-well message—part of the content? If the occasion changes, are these versions translations of Marot's poem, or new occasional poems written in Marot's shape?

  *   **Expected Answer:** She will likely argue that the shape *is* the occasion, or that the playfulness of the shape allows it to inhabit new occasions while remaining a translation of the original's spirit.
  *   **Follow-up:** If the occasion can change, what prevents any poem in that shape from being a translation of Marot, regardless of what it says?
  *   **Assumption Flag:** This assumes that the "speech act" (what the poem is doing) is distinct from the "form" (how it is shaped). She could reject this by merging act and form.
  *   **Drop Condition:** If she claims these are not translations but "variations" or "homages," I would drop the "translation" label challenge and ask about the boundary between variation and translation.

  **Question 8**
  Your book offers 140 versions, and other collections exist with dozens more. What makes all of these versions of one poem rather than a family of English poems with a common ancestor? What do you say to someone who argues that the sheer number is itself evidence that no single one of them is the translation?

  *   **Expected Answer:** She will likely argue that the original is a cluster of possibilities, not a single point, and the 140 versions map that cluster. She will deny that a translation must be singular.
  *   **Follow-up:** If the original is a cluster of possibilities, does that mean the poem doesn't fully exist until it is translated?
  *   **Assumption Flag:** This assumes that a poem has a singular identity that translation might fragment. She could reject this by embracing a pluralistic ontology of the work.
  *   **Drop Condition:** If she argues that the "one poem" concept is a myth, I would drop the unity challenge and ask about the limits of the family resemblance.

  **Question 9**
  Finally, what would count against your method? If readers who know no French consistently prefer the freer versions, or if your most formally exact versions are also your least affecting, would you treat that as evidence that form-first translation fails, or simply as a price worth paying?

  *   **Expected Answer:** She will likely say reader preference is not the metric for success; fidelity is. She might concede affect is important but argue that affect comes *from* the constraint, not despite it.
  *   **Follow-up:** If affect consistently fails when form is prioritized, at what point does the price become too high to pay?
  *   **Assumption Flag:** This assumes that the method is falsifiable by empirical evidence (reader preference/affect). She could reject this by framing it as an aesthetic commitment immune to empirical test.
  *   **Drop Condition:** If she says there is no evidence that could change her mind, I would drop the falsification angle and ask about the personal necessity of the method instead.

  ***

  **Closing Assessment**

  I expect her to handle the questions on **Multiplicity (Q8)** and **Difficulty (Q6)** most comfortably, as these allow her to expand on the generative and expansive nature of her project without conceding ground on fidelity. The line of questioning most likely to collapse into slogan is **Ranking (Q5)**; she may retreat to "you know it when you see it" rather than defining a criterion, which stalls the dialectic. The single argument that would most change my mind is if she can demonstrate that a specific semantic nuance was *only* discoverable *because* the constraint forced her into a corner she wouldn't have otherwise entered; if she can prove constraint as epistemology rather than just aesthetics, the method becomes defensible as a general tool rather than a personal habit.
