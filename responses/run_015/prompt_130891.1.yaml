answer: |-
  This is a profound structural problem for a narrative, because it touches on the friction between *ontology* (what happened) and *normativity* (what we owe each other). The protocol you describe—a bifurcated epistemic regime—is not merely bureaucratic; it is a metaphysical compromise. It attempts to solve a political problem by splitting the concept of truth itself.

  Here is a reconstruction of the philosophical commitments required to sustain such a regime, an analysis of its coherence, and the conditions under which the theory would collapse.

  ### I. Reconstruction of the Implicit Theory

  The institution is operating under a theory I would label **Domain-Specific Epistemic Sovereignty**, grounded in a distinction between **Constitutive Truth** (Public Track) and **Adjudicative Truth** (Juridical Track).

  **1. The Commitment to Functional Contextualism**
  The primary philosophical commitment is that the *validity* of a knowledge claim is not intrinsic to the claim itself but is determined by the *function* of the domain in which it is uttered.
  *   **In the Public Sphere:** The function is *social cohesion, identity formation, and recognition*. Therefore, the "truth" that matters is the one that validates the lived experience of the community. Here, memory is treated not as a faulty recording of the past, but as a present-day constitutive element of the community's identity. To contradict it is an act of violence (epistemic injustice).
  *   **In the Juridical Sphere:** The function is *resource allocation, liability, and boundary setting*. Therefore, the "truth" that matters is the one that is falsifiable, replicable, and impersonal. Documents and forensics serve this because they allow for consistent application of rules.

  **2. The Moral Priority of Recognition over Correspondence**
  The protocol presupposes that in the public sphere, the moral good of *recognition* outweighs the epistemic good of *correspondence*. This draws from Hegelian recognition theory and modern theories of epistemic injustice (e.g., Miranda Fricker). The institution assumes that for a marginalized community, having their memory publicly invalidated causes more harm than the dissemination of a factual inaccuracy. Thus, the Public Track is not an arena of fact-finding, but of *witnessing*.

  **3. The Separation of Meaning from Mechanism**
  The regime assumes that *what happened* (the forensic event) can be separated from *what it means* (the mnemonic narrative).
  *   **Juridical Track:** Concerned with the *mechanism* (Who signed the deed? Where is the bone fragment?).
  *   **Public Track:** Concerned with the *meaning* (We were displaced; this object belongs to our spirit).
  The institution bets that the public can tolerate a disconnect between the mechanism of history and the meaning of history without descending into cynicism.

  ### II. Strict Requirements vs. Accompaniments

  To maintain this bifurcation without immediate collapse, certain conditions are strictly required, while others are merely hopeful accompaniments.

  **Strict Requirements (The Logical Floor):**
  1.  **Non-Contamination:** There must be a firewall preventing the "Public Truth" from entering the "Juridical Record" as evidence, and vice versa. If a curator's label citing community memory is used in court to establish title, the system collapses into contradiction.
  2.  **Distinct Criteria of Success:** The Public Track must be evaluated by *social trust* and *participation*, while the Juridical Track must be evaluated by *procedural consistency* and *enforceability*. If the public demands the legal track adhere to memory, or the legal track demands the public exhibit adhere to forensics, the bifurcation fails.
  3.  **Acceptance of Performative Contradiction:** The institution must implicitly admit it is speaking with two voices. It requires a cultural agreement that this is "code-switching" rather than "lying."

  **Accompaniments (The Hopeful Ceiling):**
  1.  **Eventual Convergence:** The hope that over time, memory and evidence will align. This is not required for the system to work, but it is often sold as the long-term goal.
  2.  **Community Satisfaction:** The assumption that the community *wants* this split. It is possible the community demands mnemonic precedence in court as well. The protocol assumes the community accepts the trade-off: sovereignty in the museum for subordination in the court.
  3.  **Public Literacy:** The assumption that the general public understands the difference between a commemorative narrative and a legal finding. If the public assumes the museum exhibit is "fact" in the scientific sense, the institution is accused of propaganda.

  ### III. Philosophical Underdetermination

  You asked if a single coherent framework licenses this, or if it relies on inconsistent theories. The practice is **philosophically underdetermined**, meaning several rival frameworks could justify the exact same institutional split. This is fertile ground for your narrative, as different characters could believe they are supporting the system for mutually exclusive reasons.

  **Rival Account A: Compensatory Epistemology (The Reparations View)**
  *   *Logic:* The archival record is already tainted by colonial or systemic bias. Therefore, elevating memory in the public sphere is a corrective weighting, like a handicap in a race. The legal track remains rigid because property rights require stability, but the public track is the site of moral repair.
  *   *Motivation:* Justice as Equity.

  **Rival Account B: Pragmatic Stabilization (The Realpolitik View)**
  *   *Logic:* Truth is secondary to peace. If we tell the forensic truth in the museum, there will be riots. If we use memory in court, the economy will collapse due to uncertain property titles. The split is a *modus vivendi* to keep the state functioning.
  *   *Motivation:* Order and Stability.

  **Rival Account C: Radical Pluralism (The Post-Modern View)**
  *   *Logic:* There is no "God's eye view" of history. Forensic evidence is just another narrative with a different rhetoric. Giving memory precedence in the public sphere simply acknowledges that Western empiricism is not the only valid way of knowing. The legal track uses empiricism only because it is the "lingua franca" of the state, not because it is superior.
  *   *Motivation:* Epistemic Decolonization.

  **The Inconsistency:**
  The system is coherent *only if* one accepts that "Truth" is a homonym (same word, different meanings). If one holds a **Unified Correspondence Theory of Truth** (a statement is true if it matches reality, regardless of context), the system is inherently hypocritical. It requires the institution to assert $P$ (Memory) is true in the lobby, and $\neg P$ (Documents) is true in the vault. This is a logical contradiction unless $P$ and $\neg P$ are redefined as different categories of statement (e.g., "True for us" vs. "Proven for them").

  ### IV. What Would Change My Mind

  I am currently analyzing this as a stable, albeit tense, philosophical equilibrium. My analysis would change under the following conditions:

  **1. The Contamination Proof:**
  If it were demonstrated that the "Public Truth" inevitably bleeds into the "Juridical Truth" due to human cognition. For example, if judges or arbitrators, being members of the public, internalize the mnemonic narrative to the point where they cannot impartially weigh forensic evidence. If the bifurcation is psychologically impossible for the agents operating within it, the theory fails because it relies on a compartmentalization of the human mind that does not exist.

  **2. The Harm Threshold:**
  If a specific case arises where the mnemonic precedence in the public sphere directly enables a material harm that the juridical track cannot fix. For instance, if the public narrative incites hostility against a minority subgroup that the legal track is supposed to protect. If the "moral good" of recognition actively undermines the "legal good" of safety/rights, the moral-political theory collapses.

  **3. A Unified Theory of Narrative Evidence:**
  If a legal framework emerges that can successfully integrate community memory as *admissible evidence* without collapsing the rule of law (e.g., oral history traditions in some indigenous legal systems). If memory can be adjudicated, the need for the bifurcation vanishes, revealing the split as a failure of legal imagination rather than a philosophical necessity.

  ### V. The Weakest Point in My Reasoning

  The most vulnerable point in this reconstruction is the **assumption of institutional agency**.

  I have analyzed the protocol as if the institution is a singular rational actor capable of maintaining the boundary. In reality, institutions are collections of individuals. The weakest link is the **curator-archivist**.
  *   If the person writing the museum label is the same person (or trained in the same school as) the person authenticating the artifact for court, the cognitive dissonance will fracture the individual.
  *   My reasoning assumes the "wall" between the tracks is structural. It is most likely **porous**.

  In your narrative, the tension should not just be between the Community and the State, but *inside* the employees of the heritage body. The philosophical contradiction becomes a psychological crisis for the individual who must write the exhibition text (honoring memory) and then testify in court (honoring documents) about the same object on Tuesday and Thursday. The system presupposes a schizoid professional identity that may be unsustainable.

  **Summary for the Novelist:**
  The protocol presupposes that **Justice** and **Truth** are separable commodities. It bets that a community can eat at the table of Recognition (Public) while signing contracts at the table of Evidence (Legal). It is coherent only if you accept that "Truth" changes its definition based on the room you are standing in. The drama lies in the moment a character steps from one room to the other, carrying the truth of the first into the second, and watches the logic of the institution shatter.
