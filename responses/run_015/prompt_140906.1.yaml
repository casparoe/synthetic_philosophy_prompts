answer: |-
  # Q&A Prep Sheet: "Verisimilitude on a Budget"

  **Strategy Overview:**
  Your core vulnerability is the charge of *pragmatism*. You are defining a metaphysical relation (truthlikeness) using epistemic constraints (budgets, menus). The Senior Realist will smell blood here. Your survival depends on convincing the room that *access costs* are constitutive of scientific truthlikeness, not merely instrumental to it. Do not get bogged down in the formalism; keep the focus on the *scientific practice* motivation.

  **Pre-emptive Concessions (Build these into the closing minutes of the talk):**
  1.  **The Pragmatic Surface:** Explicitly concede that your measure *looks* like epistemic utility. State clearly: "I am not denying that this measure tracks investigative efficiency. I am claiming that for working scientists, investigative efficiency *is* how truthlikeness manifests. We cannot separate the cost of finding the truth from the proximity to it."
  2.  **The Relativity of Q:** Concede that the agenda $Q$ is not fixed by metaphysics but by the sociological state of the field. Frame this as a feature: "Truthlikeness is not a relation between a theory and the God's-eye view; it is a relation between a theory and the *problem space* the field currently occupies."

  **The "Must-Land" Reply:**
  You must successfully defend the claim that **error-cost is a truth-making feature.** If the audience accepts that a theory with "expensive errors" is *less truthlike* than a theory with "cheap errors" (even if both are equally false in a static sense), you win. If they reject this and view cost as merely pragmatic, the paper collapses into instrumentalism.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The Senior Realist (The "Utility" Charge)
  **The Objection:** "You've told us this is a theory of *verisimilitude*, but your definition relies on 'budgets,' 'menus,' and 'policies.' You haven't measured closeness to the truth; you've measured *usefulness for inquiry*. You've replaced a metaphysical relation with an epistemic utility function. Why should I call this 'truthlikeness' rather than 'investigative viability'?"
  *   **Concede:** Acknowledge that on traditional static definitions, this looks like utility.
  *   **Hold:** Hold that traditional definitions fail to capture scientific progress (cite the Popper/Tichý deadlock).
  *   **Reply:** "Because science isn't static. A theory that is false but points clearly to its own correction is scientifically *closer* to the truth than a theory that is false and hides its errors behind expensive experimental barriers. If verisimilitude is supposed to explain progress, it must track the *path* to the truth, not just the distance. I'm measuring the distance *along the path we can actually walk*."
  *   **Soft Spot:** You are shifting the definition of "truthlikeness" to fit your model. If they insist "truthlikeness" must be mind-independent, you have changed the subject.

  #### 2. The Metaphysician (The "Gerrymandering" Charge)
  **The Objection:** "You make truthlikeness relative to a partition $Q$. But nothing constrains $Q$ except the 'current agenda.' Couldn't I just choose a partition where my pet theory answers all the questions trivially? If truthlikeness varies with how I carve up logical space, isn't it just subjective?"
  *   **Concede:** $Q$ is not unique or metaphysically privileged.
  *   **Hold:** $Q$ is constrained by the *actual practice* of the field, not by the speaker's whim.
  *   **Reply:** "The partition isn't up to the philosopher; it's up to the community. $Q$ represents the *live questions* the field is actually trying to answer. A theory isn't truthlike in a vacuum; it's truthlike *for a field*. If you change the agenda, you're doing a different science, not measuring the same theory differently."
  *   **Soft Spot:** This makes truthlikeness sociological. If the field asks the wrong questions, your metric says the theory is truthlike, even if it's irrelevant to reality.

  #### 3. The Formal Learning Theorist (The "Limit" Charge)
  **The Objection:** "In learning theory, we care about convergence in the limit. As budget $b \to \infty$, does your measure collapse to standard truthlikeness? If not, you're diverging from the truth at the limit. If so, what work is the budget doing other than adding noise to the standard model?"
  *   **Concede:** At the infinite limit, budget constraints vanish.
  *   **Hold:** Science never operates at the limit.
  *   **Reply:** "We aren't gods. We need a measure that discriminates between theories *now*, with the resources we *have*. A measure that only works at the limit tells us nothing about why we should prefer Newton over Aristotelian physics *today*. My measure explains current preference; the limit measure only explains the ideal endpoint."
  *   **Soft Spot:** You risk severing the link between "truthlikeness" and "truth." If the ordering flips depending on the budget, are you measuring truth or just resource management?

  #### 4. The Formal Epistemologist (The "Credence" Charge)
  **The Objection:** "You're modeling theories as sets of worlds (binary acceptance) and policies as 'best' without specifying a scoring rule or priors. How do you calculate 'expected accuracy' without a probability distribution? Are you smuggling in subjective priors under the label of 'budget'?"
  *   **Concede:** The model assumes a logical space and a way to weigh cells in $Q$.
  *   **Hold:** This is a structural account of *inquiry*, not a psychological account of *belief*.
  *   **Reply:** "I'm not modeling the agent's credences; I'm modeling the *structure of the problem*. The 'expectation' is over the logical space relative to the actual world, not relative to an agent's degrees of belief. The budget constrains the *search*, not the *credence*."
  *   **Soft Spot:** "Expected accuracy" usually implies a probability measure. If you don't specify where the weights come from, the calculation is undefined.

  #### 5. The Historian of Science (The "Phlogiston" Charge)
  **The Objection:** "Take phlogiston. For a long time, it was cheap to use, answered the agenda of combustion, and fit the menu of available inquiries. By your lights, was phlogiston 'truthlike'? It seems you're rewarding theories that are merely *stubbornly resistant to falsification* because they're cheap to maintain."
  *   **Concede:** Phlogiston scores high on *budgeted* truthlikeness for its time.
  *   **Hold:** That is the correct verdict for that time.
  *   **Reply:** "Yes. For Lavoisier's predecessors, phlogiston *was* the most truthlike theory available relative to their menu and agenda. It guided inquiry productively until the menu changed (new experiments became possible). My account explains why it was rational to keep it, and why it was rational to drop it when $M$ expanded."
  *   **Soft Spot:** This sounds like relativism. If phlogiston was "truthlike" then but not now, truthlikeness isn't a stable property of the theory.

  #### 6. The Special Sciences Philosopher (The "Case Study" Charge)
  **The Objection:** "This is all abstract. Walk us through a concrete case. Compare Newtonian Mechanics and General Relativity. Fix a specific $Q$ and $M$. Show me the calculation that proves GR is more truthlike, and tell me if there's a budget where Newton wins."
  *   **Concede:** I won't do the full math in the Q&A.
  *   **Hold:** The qualitative result is clear.
  *   **Reply:** "For questions about planetary orbits ($Q$), with 19th-century telescopes ($M$), Newton is highly truthlike—the budget to find errors is high. With modern atomic clocks and light-bending measurements, the budget to find Newton's errors drops to zero. GR becomes more truthlike because the 'cost' of Newton's errors becomes negligible to detect. The ordering flips as $M$ expands."
  *   **Soft Spot:** If you can't sketch the formal mapping, they will assume the model is too vague to be applied.

  #### 7. The Skeptic (The "Circularity" Charge)
  **The Objection:** "You define truthlikeness by the 'best policy' to find the truth. But to know the best policy, don't you need to know which theory is closer to the truth? Aren't you defining truthlikeness in terms of itself?"
  *   **Concede:** The definition is evaluated at the *actual world*.
  *   **Hold:** It is an objective measure, not a heuristic for agents.
  *   **Reply:** "It's not circular; it's recursive. We fix the actual world to *evaluate* the measure, but the measure is designed to guide agents who *don't* know the actual world. It tells us what property a theory has that makes it a good starting point, given the world is actually $w$."
  *   **Soft Spot:** If agents can't calculate it, what is its normative force?

  #### 8. The "Friendly" Critic (The "Complexity" Charge)
  **The Objection:** "This is a four-place relation. It's much more complex than the standard two-place relation. Have you gained precision at the cost of simplicity? Is the extra machinery worth it?"
  *   **Concede:** It is more complex.
  *   **Hold:** The complexity is necessary to solve the impossibility results.
  *   **Reply:** "The two-place relation is broken. It yields the result that no false theory is closer to the truth than another. I'd rather have a complex measure that gives the right answers than a simple one that gives no answers."
  *   **Soft Spot:** Philosophical parsimony matters. If the extra parameters are ad hoc, the theory is bloated.

  ---

  ### The Dangerous Question (Hope Nobody Asks)

  **The Question:** "If the 'cost' of an error depends on our *current* technology ($M$) and *current* interests ($Q$), haven't you made the *truthlikeness of the theory* depend on *us*? Does the theory of gravity become *more truthlike* just because we built a better telescope? If so, isn't this just a measure of *our competence*, not the *theory's verisimilitude*?"

  **Why it's dangerous:**
  This cuts the throat of the project. It exposes that you may have redefined "truthlikeness" as "ease of use." If the property belongs to the *agent-theory pair* rather than the *theory-world pair*, you are no longer doing metaphysics of science; you are doing methodology. The Senior Realist will seize this to dismiss the paper as a category mistake.

  **If asked:**
  Do not deny the relativity. Lean into it.
  *Reply:* "Science is a human activity. A theory that is true but inaccessible to us is scientifically useless. I am arguing that 'verisimilitude' is the *scientific* virtue of a theory, not the *metaphysical* virtue. Yes, it depends on us. That's why it explains progress."
  *(Risk: This concedes the Realist's point that you aren't talking about truthlikeness in the traditional sense.)*
