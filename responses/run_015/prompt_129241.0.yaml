      *   **Requirements:**
          *   Grounded in philosophy of history (invented vs. discovered).
          *   Practical (questions in order, pass/fail criteria, kill switches).
          *   Address misfires (local vs. global chronology).
          *   Apply to three specific artifacts (1543 anatomy manual, 1320 Damascus astrolabe, 1705 Japanese chart).
          *   One artifact must get a "no tag" result (marketing will hate it).
          *   Explain what the procedure *can't* do.
          *   **Crucial:** Critically evaluate the user's premise (can philosophy be turned into a checklist without bias?).

  2.  **Deconstruct the Philosophical Premise:**
      *   *The Debate:* Essentialism (periods are real structures in time) vs. Constructivism (periods are narratives imposed by later historians).
      *   *Key Thinkers:* Hegel/Marx (structural/epochal), Foucault (episteme/discourse), Koselleck (concepts of time), Butterfield (Whig history).
      *   *The User's Premise:* "Can we turn this philosophical problem into a team checklist without just baking in my own biases?"
      *   *My Verdict:* No, not entirely. Any checklist encodes values. However, a *transparent* checklist makes biases explicit rather than hidden. I need to tell the user this straight, as requested.

  3.  **Drafting the Procedure (The "Periodization Audit"):**
      *   Needs to be fast (15 mins).
      *   Needs hard stops.
      *   Needs to distinguish between *causal cluster* (real connection) and *retroactive frame* (convenient label).
      *   *Step 1: Provenance & Production.* (Where/When was it made?)
      *   *Step 2: Contemporary Self-Description.* (Did they call it this?)
      *   *Step 3: Causal/Technological Continuity.* (Does it link to neighbors in time/place?)
      *   *Step 4: Pedagogical Utility vs. Historical Accuracy.* (The "Punt" step).

  4.  **Developing the "Hard Stops" (Kill Switches):**
      *   If the label didn't exist then -> Warning.
      *   If the artifact functions differently in its local context than the label implies -> Kill.
      *   If the label imposes a Eurocentric timeline on a non-European artifact -> Kill/Flag.

  5.  **Applying to the Three Artifacts:**

      *   *Artifact 1: 1543 Printed Anatomy Manual (Vesalius?)*
          *   Context: Europe, Renaissance/Scientific Revolution.
          *   Analysis: Fits the "Renaissance" narrative well (humanism, printing press, empirical observation).
          *   Verdict: **Tag Allowed** (with caveats).

      *   *Artifact 2: 1320 Brass Astrolabe (Damascus)*
          *   Context: Islamic Golden Age / Mamluk Sultanate.
          *   Label Conflict: "Middle Ages" (European term, often implies stagnation in school curricula) vs. "Islamic Golden Age".
          *   Analysis: Calling it "Middle Ages" is geographically misaligned and conceptually loaded.
          *   Verdict: **No Tag** (or specific regional tag only). This will annoy marketing.

      *   *Artifact 3: 1705 Japanese Astronomical Chart (Edo Period)*
          *   Context: Tokugawa Shogunate.
          *   Label Conflict: "Scientific Revolution" (European) or "Enlightenment".
          *   Analysis: Japan was isolated (Sakoku). While astronomy existed, linking it to the European "Scientific Revolution" is a stretch causally.
          *   Verdict: **Tag with "Early Modern"** (broad) but reject "Scientific Revolution".

      *   *Selection for "No Tag":* The 1320 Astrolabe is the strongest candidate for a hard "No" on standard Eurocentric labels like "Middle Ages" because that term actively misrepresents the flourishing of science in Damascus at that time.

  6.  **Addressing the "Confused Premise" Constraint:**
      *   I must tell the user straight: You cannot eliminate bias via checklist. The checklist *is* a bias management tool, not a bias elimination tool.
      *   The act of defining "causal cluster" requires historical judgment, which non-historians might struggle with without training.
      *   The "15-minute" constraint risks oversimplification.

  7.  **Refining the Output Structure:**
