prompt: |-
  I curate digital timelines for a small history-ed nonprofit and my team of three non-historians has to tag about twenty artefacts a week with period labels — "Middle Ages", "Renaissance", "Scientific Revolution" — for school modules. We keep fighting about whether these boxes are real or just retroactive inventions. I want a reusable decision proceedure (like a 15-minute checklist with hard stops) they can run on any submission to decide if a label describes an actual local continuity or causal cluster, or if it's an anachronistic frame we're forcing on it.

  Ground it in the philosophy-of-history debate about invented vs discovered periods, but keep it practical: the questions to ask in order, what counts as passing each, where it kills the tag, and where it has to punt to values (e.g., "teachers need familiar names"). Be explicit about misfires, especially where local chronology and global labels clash. Then apply it to three submissions:

  1. a 1543 printed anatomy manual
  2. a 1320 brass astrolabe made in Damascus
  3. a 1705 Japanese astronomical chart

  Make sure one of these gets a "no tag" that our marketing team will hate, say what the proceedure flat-out can't do, and if my whole premise — that this philosophical problem can be turned into a team checklist without just baking in my own biases — is confused, tell me straight instead of humoring me.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Curator for a small history-ed nonprofit.
      *   **Team:** Three non-historians.
      *   **Task:** Tag ~20 artifacts/week with period labels (Middle Ages, Renaissance, etc.) for school modules.
