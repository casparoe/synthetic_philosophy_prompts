answer: |-
  The kitchen was cold, the Aga having gone out hours ago. On the scrubbed pine table lay two documents: the yellowed deed of the tenancy, smelling of damp wool and age, and the crisp, heavy paper of the conservation covenant. Outside, the Welsh borders were swallowed by night. You sat at the head of the table, silent, holding a cold cup of tea. Dr Nia Protheroe sat to your left, Dr Alasdair Kemp to your right.

  'The deed changes everything,' Nia said, tapping the parchment. 'You think the Doomsday Argument fails because birth isn't a lottery. But here, it literally is. At each handover, a name drawn from the living descendants. You are the fifth draw. If the total number of draws before someone declines is large, say a hundred, the probability of you being fifth is one in a hundred. If the total is ten, the probability is one in ten. Bayesian updating compels you to favour the shorter sequence.'

  Alasdair stirred his tea, the spoon clinking sharply. 'That assumes you are a random sample from the *sequence* of tenants. You are not. You are a random sample from the *pool of descendants* at the moment of your father's death. The pool has grown from a handful to forty. That growth rate correlates with time. Being the fifth tenant doesn't tell you the sequence is short; it tells you the pool was small enough, early enough, for you to be picked. The mechanism randomises *who*, not *when* in the farm's history you turn up. That distinction is fatal to the inference.'

  'Is it?' Nia leaned forward. 'If the process stops when someone declines, the total number of tenants is the variable. Your position is data. If the farm were destined to last centuries, there would be many tenants. Most tenants in that long history would have high numbers. Finding yourself with a low number is unlikely in a long history. It's the same logic as finding a serial number on a tank.'

  'Tanks are manufactured in a sequence,' Alasdair countered. 'This tenancy is a branching tree. The probability of being the fifth tenant depends on how many descendants were alive at each node. If the family grew exponentially, early nodes have fewer candidates. You are early because the family was small, not because the farm is ending. To make the Doomsday inference work, you'd need a mechanism where the probability of being tenant *n* is independent of the total number of tenants. This lottery doesn't do that. It couples your position to the demographic history of the family.'

  You shifted in your chair. Nia glanced at you, then back to Alasdair.

  'Consider the arrival-time version,' Nia pressed. 'An outsider drops onto a planet, sees a wall, and estimates its remaining lifespan based on how eroded it is. Or Gott's theatrical run: you arrive at a random time, see how long a play has been running, and infer its total duration. That works tolerably well. Why does it work there and not here?'

  'Because the outsider's arrival time is uncorrelated with the wall's construction,' Alasdair said. 'They are temporally random. You are not temporally random relative to the farm. You are causally connected to the previous tenants. You are here because your father died, and because you accepted the lot. The arrival-time argument relies on the "Copernican principle"—that you are not special in time. But you *are* special. You are the heir. Your existence is conditioned on the farm surviving to this point. The wall observer's existence is not conditioned on the wall's age.'

  'But self-locating uncertainty remains,' Nia insisted. 'You don't know *which* heir you are in the total set of all possible heirs across all possible histories. If you treat your identity as a random draw from the set of all observers who could ever say "I am a tenant", the logic holds. The arrival-time success supports this because it shows that lacking specific causal knowledge, typicality is our best guide.'

  'We do have specific causal knowledge,' Alasdair said. 'We know it is 2026. We know the population of the world. We know the pool of descendants is forty.'

  'That brings us to conditionalisation,' Nia said. 'What exactly do you condition on? The thin datum: "I am the fifth tenant"? Or the thick datum: "I am the fifth tenant, alive in 2026, knowing global population statistics"?'

  'The thick one,' Alasdair said firmly. 'If you condition on knowing it is 2026, you already know your temporal location. The Doomsday Argument tries to infer temporal location from rank. If you already know the time, the rank adds nothing. The rule is: conditionalise on all available indexical information. To ignore the date is to pretend ignorance you do not possess. That doesn't smuggle in the conclusion; it respects the evidence.'

  'That rule begs the question,' Nia replied. 'If you condition on "I am alive in 2026", you assume the world exists in 2026. The argument is about whether it exists in 2126. The reference class matters. If the class is "all humans who ever live", your rank is informative. If the class is "humans alive in 2026", it is not. You must choose the class before you know the outcome. The principled rule is: condition on the narrowest reference class that doesn't include the hypothesis you're testing. "Tenants" is the class. "Tenants in 2026" excludes the future tenants you are trying to predict.'

  'And why "tenants"?' Alasdair asked. 'Why not "descendants"? Why not "conscious observers"? The reference class selection is where the magic happens. If you choose "tenants", you get a shift. If you choose "people living on the Welsh borders", the shift vanishes. You cannot derive a probability shift from an arbitrary choice of class.'

  'Let's speak of the decision,' you said, your voice quiet. Both philosophers turned to you. 'The covenant binds the land for ninety-nine years. If the world ends, or the tenancy collapses, it is worthless. The sale helps charities now.'

  'Even if the anthropic shift is real,' Alasdair said, turning to you, 'does it move the needle enough? Ordinary uncertainty swamps it. Climate change, market crashes, policy shifts. The probability of the farm surviving as a working holding might drop from ten per cent to five per cent based on Nia's reasoning. But the probability of the covenant being violated due to legal changes or economic pressure is thirty per cent. The anthropic risk is noise compared to institutional risk.'

  'Not if the shift is large,' Nia argued. 'If the Doomsday reasoning suggests a fifty per cent chance of existential collapse within a century, rather than one per cent, it dominates. The covenant's value depends on a stable world. If the human race is likely to be short-lived, binding land for conservation is vanity. Spending on urgent existential risk reduction—charities working on pandemics or AI safety—becomes paramount. You must ask: how large must the shift be to matter? If it doubles the risk of early termination, it matters.'

  'I concede,' Alasdair said slowly, 'that if the probability of near-term extinction shifted from negligible to substantial, it would override the institutional risks. My objection is that the reasoning does not generate that shift. However, I will admit this: if the lottery mechanism were truly uniform across the sequence, independent of pool size, the evidence would be genuine. It is the demographic coupling that breaks it.'

  Nia nodded. 'And I concede that ordinary uncertainty is the dominant factor. Even if the anthropic argument holds, it is a weak signal compared to the noise of climate and markets. You cannot bet the farm on a philosophical inference alone.'

  'What moves you most?' you asked.

  'The reference class,' Nia said. 'If I could be convinced that "tenants" is not the correct class for self-location, the argument collapses. If "observers" is the class, the farm is irrelevant.'

  'The thick data,' Alasdair replied. 'If I could be shown that knowing the date "2026" does not screen off the information contained in "fifth tenant", I would have to update. But I believe it does.'

  They looked at each other, then at you. The wind rattled the window pane.

  'Regardless of the probability,' Alasdair said, 'you have a daughter born this fortnight. The covenant binds her inheritance. Whether the world lasts ninety-nine years or not, locking her out of a decision she may need to make is a heavy burden.'

  'And,' Nia added, 'whether the anthropic shift is real or not, the uncertainty is real. You are deciding under radical ignorance. The only rational move is to preserve flexibility.'

  'Then we agree,' Alasdair said. 'Do not sign the covenant. Not because the world is ending, but because you cannot know it isn't, and your daughter should not pay for your guess.'

  'Not because the world is ending,' Nia agreed, 'but because binding the land assumes a stability you cannot justify, philosophically or practically. Sell the land. Fund the urgent work. Keep the option open for your daughter.'

  You looked at the deed, then at the covenant. The silence in the kitchen was no longer heavy, but clear. You reached out and pulled the covenant papers towards you.
