  Mara woke to the sound of the tide pulling back, a long wet sigh that seemed to drag the sand with it, and for a moment she forgot where she was. The humidity clung to her skin like a second layer of clothing, heavy and warm. She sat up in the shelter she had built from driftwood and palm fronds and watched the villagers moving along the shoreline. They did not walk so much as they flowed, their movements rhythmic and unbroken. For months she had been listening to them, filling notebook after notebook with symbols that felt slippery in her hand. She had come here expecting a grammar of things, a taxonomy of the world where nouns anchored the verbs like ships to a dock. But the language of the island, which she had tentatively called Aethel, refused to hold still. There was no word for rock, only stone-holding-ground. There was no word for bird, only wing-cutting-air. When a child pointed at the ocean, they did not say water, they said blue-moving-toward-sand. Mara had thought she was making progress when she realized the syntax was entirely event-based. She began to translate their utterances into her own tongue by nominalizing the verbs, turning processes into objects so she could write them down. She wrote rabbit when they said white-fur-bouncing. She wrote tree when they said wood-standing-high. It worked for survival. It helped her ask for food and warn of storms. But late at night, by the light of a dying fire, the doubt would creep in like the tide.

  She was sitting near the tree line when Elias found her. He had been on the island longer than she had, washed up from a cargo freighter five years prior. He had gone native in a way that unsettled her, wearing woven grass and speaking the language with a fluency that sounded less like translation and more like humming. He sat down beside her without speaking, watching a group of children playing near the surf. They were chasing a crab. One of the children shouted a phrase that Mara had transcribed as crab-scuttling-left. Elias laughed softly. You are doing it again, he said. Your pen is moving but your eyes are lying to you. Mara looked down at her notebook. She had written the crab sees the shell. No, she corrected herself, I wrote the shell is seen by the crab. Elias shook his head. There is no crab and there is no shell. There is only the seeing-happening and the hard-surface-happening meeting in the same spot. You keep trying to find the actors in the play, Mara, but this language assumes there is only the dancing. Mara felt a frustration rise in her chest, hot and tight. But if there are no objects, what persists? If I point to you tomorrow, are you the same you? Elias shrugged. Tomorrow is a different slice of time. The Elias-of-tomorrow looks like the Elias-of-today and remembers being him, but that is just a pattern of memory, not a substance. You want to know what exists. They do not care. They only care about what happens.

  Mara looked at her own hand, turning it over in the firelight. She tried to see it not as a hand, a fixed object with fingers and palm, but as a process. Hand-holding-light. Skin-breathing. It felt absurd, like trying to unlearn how to see color. If Quine was right, if the gavagai problem was not just a puzzle but a fundamental limit, then her entire ontology was a projection. She was carving the world into chunks because her brain demanded chunks, not because the world came in chunks. She looked at Elias. So we just pretend? We agree that rabbit means white-fur-bouncing so we don't starve, but we admit we don't know if there is a rabbit? Elias poked the fire with a stick, sending sparks up into the dark. Translation is coordination, Mara. It is not metaphysics. If I say pass the fruit and you pass the fruit, the translation is successful. Whether you think fruit is a thing or a sweet-smelling-event is irrelevant to the hunger. The indeterminacy is only a problem if you think language is a mirror of reality. If you think it is a tool, then the handle fits the hand regardless of what the tool is made of. Mara closed her notebook. The fire crackled, a sound she wanted to describe as wood-breaking but knew she should describe as heat-releasing-sound. She wondered if the difference mattered. She wondered if she would ever be able to hear the world without trying to name it, or if she was forever trapped in the prison of nouns, watching a world of verbs run past her like rabbits in the grass, forever unable to catch one without killing it.

  I want to pause here to reflect on how this narrative engages with the philosophical concepts you mentioned, specifically regarding where it might diverge from Quine's actual arguments. In the story, I portrayed the islanders as having a language without nouns, using only verb-phrases or event descriptions. This is a liberty taken for dramatic effect. Quine's indeterminacy of translation does not rely on the target language lacking nouns or having a radically different grammatical structure. His point in Word and Object is that even if the grammar looks identical to English, and even if the speakers behave exactly as we do, there is still no fact of the matter about whether gavagai refers to a rabbit, undetached rabbit parts, or a temporal stage of a rabbit. The story leans into a stronger version of linguistic relativity, suggesting that the grammar forces a specific ontology, whereas Quine argues that ontology is relative to a background manual of translation, not necessarily dictated by surface grammar alone. The story also implies that Mara could potentially discover the true ontology if she could just stop projecting, but Quine's thesis is that there is no God's-eye view to discover; all ontology is relative to a theory.

  Regarding what would change my mind about the depth of the indeterminacy problem, the strongest counter-argument would come from cognitive science and neuroscience demonstrating universal conceptual primitives. If research showed that human brains are hardwired to segment reality into objects and substances in a uniform way regardless of language, such that the neural representation of rabbit is identical across all cultures despite linguistic differences, it would suggest that the indeterminacy is merely linguistic rather than ontological. If we could map the neural activity corresponding to reference and show that it locks onto specific objects rather than ambiguous stimuli, it would undermine the idea that reference is fundamentally inscrutable. Additionally, if a field linguist could demonstrate a case of radical translation where only one manual was possible due to constraints of human biology or physical interaction with the world, that would challenge the claim that multiple incompatible manuals are always possible.

  The weakest part of my reasoning in the story and this analysis is the conflation of linguistic structure with metaphysical commitment. I leaned heavily on the idea that speaking in verbs forces a process ontology, which is a contested interpretation of linguistic relativity. Many philosophers argue that speakers can understand object permanence and substance regardless of whether their language uses nouns or verbs. Furthermore, in the note, I am assuming that neural correlates would solve the philosophical problem of reference, but a skeptic could argue that neural activity is also subject to interpretation, pushing the indeterminacy back a step rather than solving it. The story simplifies Quine's behaviorism to make it digestible, but in doing so, it risks making the problem seem like a matter of perspective rather than a logical constraint on evidence itself.
