  hey so ive been thinking about this philosophy thing i came across, the gavagai problem by quine i think? the basic idea is that if youre in some remote place and a local shouts gavagai when a rabbit runs by, you cant actually tell if they mean the rabbit itself, or just undetached rabbit parts, or maybe a temporary slice of rabbit-ness happening in that exact moment. and even if you learn all their words perfect, your whole idea of what exists could still be totally different from theirs and you'd never notice because every observation could be translated either way. i was telling my friend about this and they said its just word games but i think its deeper, like maybe we all just project our own categories onto the world without realizing it.

