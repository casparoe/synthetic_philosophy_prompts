prompt: |-
  So I've ended up as the philosopher on our hospital's clinical genomics advisory board — we meet a couple of times a term and sign off on what the genetics clinic offers and how the consent conversation goes, and it's the same argument every time: is it actually good for this patient to be offered this result? I'd like to build the protocol around Good's theorem (the value of information can't be negative, since you can always just ignore what you learn), which I teach as the clean case, but the theorem stops doing any work the moment its assumptions break, and what I want is the assumptions turned into steps.

  Write me a procedure a genetic counsellor can run in about twenty mintues at intake, before any optional result gets offered: the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it has to hand the question back to the patient because it's a values question dressed as a factual one. It has to survive these, which are the ones that actually come up:

  - results that discriminate between no acts the patient would take anyway — variants of uncertain significance, or a risk score for something with no prevention — so the decision value is zero while the hedonic cost isn't;
  - patients who ask for a deliberately coarsened signal, just tell me if there's anything I can do about it, which looks like throwing away information for nothing;
  - patients who decline free results outright, where I want the procedure to tell a mistake apart from a preference about the weeks of waiting;
  - results that are durable and semi-public — in the chart, in the family — so the patient isn't the only one who ends up informed;
  - patients who say they'll act on a result and won't.

  At each step say plainly which bit is decision theory and which bit is a value judgment I've laundered as arithmetic, and flag the cases the procedure can't settle. Then run it on three: the secondary-findings panel we currently offer by default to everyone who gets sequenced; a polygenic score for a late-onset condition with no intervention; and a patient who wants the panel disclosed only if it's actionable. If the procedure tells me we shouldn't be offering something we offer by default, I'd rather hear that now than at the next meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher on a hospital's clinical genomics advisory board.
      *   **Task:** Create a 20-minute intake protocol for genetic counselors to determine if offering a specific genomic result is "good" for a patient.
      *   **Theoretical Basis:** Good's Theorem (Value of Information $\ge$ 0). The user acknowledges the theorem fails when assumptions break. The goal is to turn those assumptions into procedural steps.
      *   **Constraints/Challenges:** Must address specific edge cases (VUS/no action, coarsened signals, declining free results, durability/privacy, non-compliance).
      *   **Output Requirements:** Questions in order, sufficient answers, stop conditions (No), hand-off points (values vs. facts), identification of decision theory vs. value judgments, flagging unsettled cases.
      *   **Test Cases:** Secondary findings panel (default), Polygenic score (late-onset, no intervention), Patient wanting actionable-only disclosure.
      *   **Tone:** Professional, rigorous, philosophical but practical, honest about limitations.

  2.  **Deconstruct Good's Theorem & Its Assumptions:**
      *   *Good's Theorem:* Expected utility of obtaining free information is non-negative. $E[U|Info] \ge E[U|No Info]$.
      *   *Why it fails in clinic:*
          1.  **Cost of Information:** It's not "free." (Psychological burden, time, privacy risk).
          2.  **Actionability:** Information must lead to a different decision to have instrumental value. If actions are fixed, value = 0.
          3.  **Rational Agency:** The patient must be able to update beliefs and act on them rationally. (If they say they'll act but won't, or panic).
          4.  **Utility Function:** The patient's utility function might penalize *knowing* itself (hedonic cost), not just the outcome.
          5.  **Externalities:** The information affects others (family), violating the individual agent assumption.

  3.  **Drafting the Protocol (The "Good's Checklist"):**
      *   *Goal:* Translate the failures above into intake questions.
      *   *Time:* ~20 minutes.
      *   *Structure:* Sequential gates. If a gate fails, stop or flag.

      *   *Step 1: Actionability (The Instrumental Value Check).*
          *   Theory: Info has value only if it changes the decision distribution.
          *   Question: "If this result were positive/negative, would you do something different?"
          *   Value Judgment: Defining "something different" (medical vs. life planning).
          *   Stop: If No action for either outcome.

      *   *Step 2: The Cost of Knowing (The Hedonic Check).*
          *   Theory: Good assumes cost = 0. Reality: Anxiety, stigma.
          *   Question: "What is the emotional cost of waiting vs. knowing?"
          *   Value Judgment: Weighing anxiety against relief.
          *   Stop: If anticipated distress > benefit of action.

      *   *Step 3: Agency & Compliance (The Rational Actor Check).*
          *   Theory: Agent updates and acts.
          *   Question: "Have you stuck to screening plans before? What stops you?"
          *   Value Judgment: Trusting patient self-report vs. history.
          *   Hand-off: If patient admits they might not act, is knowing still good? (Therapeutic privilege vs. autonomy).

      *   *Step 4: Privacy & Externalities (The Boundary Check).*
          *   Theory: Agent is isolated. Reality: Family/Chart.
          *   Question: "Who else needs to know? Who must *not* know?"
          *   Value Judgment: Individual autonomy vs. familial duty.
          *   Hand-off: Conflict between patient privacy and family risk.

      *   *Step 5: Signal Coarsening (The "Just Tell Me" Check).*
          *   Theory: More info is better. Reality: Blunting is a coping strategy.
          *   Question: "Do you want the number or the verdict?"
          *   Value Judgment: Is blunting irrational or a valid coping mechanism?
          *   Resolution: Accept blunting if it reduces hedonic cost without blocking action.

  4.  **Refining the Steps (Addressing Specific User Constraints):**
      *   *VUS/No Prevention:* Addressed in Step 1 (Actionability).
      *   *Coarsened Signal:* Addressed in Step 5.
      *   *Declining Free Results:* Addressed in Step 2 (Cost of Knowing/Waiting).
      *   *Durable/Semi-public:* Addressed in Step 4.
      *   *Will say they'll act but won't:* Addressed in Step 3.

  5.  **Developing the Test Cases:**
      *   *Case 1: Secondary Findings (Default).* High actionability usually, but high privacy risk. Protocol might flag the "default" nature as violating the "Actionability" check for specific individuals.
      *   *Case 2: Polygenic Score (Late-onset, No Intervention).* Fails Step 1 (Actionability). Protocol says "Don't Offer." This challenges current practice.
      *   *Case 3: Actionable-Only Request.* Passes Step 1. Passes Step 5 (Coarsening). Good fit.

  6.  **Writing the Content (Iterative refinement for tone and clarity):**
      *   *Tone:* Needs to sound like a philosopher talking to clinicians. Precise, slightly academic but operational.
      *   *Formatting:* Clear headers, bullet points for "Decision Theory" vs. "Value Judgment."
      *   *Self-Correction during drafting:* I need to make sure I don't just say "No" to everything. Good's theorem says info is *non-negative*, but if cost > 0, it can be negative. I need to make sure the protocol captures the *net* value.
      *   *Crucial distinction:* The prompt asks to turn assumptions into steps. I need to explicitly label which assumption of Good's Theorem is being tested at each step.
      *   *Assumption 1:* Information is costless. -> Step 2 (Hedonic/Privacy Cost).
      *   *Assumption 2:* Agent acts rationally on info. -> Step 1 (Actionability) & Step 3 (Compliance).
      *   *Assumption 3:* Agent is the sole locus of utility. -> Step 4 (Family/Chart).
      *   *Assumption 4:* More precision is always better. -> Step 5 (Coarsening).

  7.  **Final Review against Constraints:**
      *   20 minutes? Yes, 5 steps approx 4 mins each.
      *   Questions in order? Yes.
      *   Sufficient answers? Yes.
      *   Stop conditions? Yes.
      *   Decision Theory vs. Value Judgment labels? Yes.
      *   Test cases run? Yes.
      *   Honest about failures? Yes.

  8.  **Final Polish:** Ensure the distinction between "mistake" (declining due to misunderstanding) and "preference" (declining due to cost of waiting) is clear in Step 2. Ensure the "laundered value judgment" aspect is highlighted. (Self-correction: Make sure to explicitly state where the protocol *cannot* settle the issue).

  *(Self-Correction on Good's Theorem)*: Wait, Good's Theorem specifically assumes the cost of observation is zero. If cost > 0, the theorem doesn't apply directly. The protocol needs to estimate the *net* value. $Value(Info) = Value(Instrumental) - Cost(Psychological/Privacy)$. If Net < 0, don't offer.

  Let's build the response.

  *Structure:*
  1.  Introduction: Acknowledging the tension between Good's Theorem and clinical reality.
  2.  The Protocol (The "Net-Value Intake").
  3.  The Test Cases.
  4.  Conclusion/Recommendation to the Board.

  *Key nuance:* The user wants to know where value judgments are laundered as arithmetic. I need to be very explicit about that. For example, assigning a "cost" to anxiety is a value judgment.

  *Let's write.*
answer: |-
  This is a precise operationalization of a theoretical problem. You are asking to convert the *ceteris paribus* clauses of Good's Theorem into clinical exclusion criteria.

  Good's Theorem states: $E[U|Info] \ge E[U|No Info]$, provided the cost of information is zero and the agent acts to maximize expected utility. In your clinic, the cost is never zero (anxiety, privacy, time), and the agent is often acting under duress or heuristic bias.

  Below is the **Net-Value Intake Protocol (NVIP)**. It is designed for a 20-minute window. It treats Good's Theorem not as a guarantee, but as a balance sheet that must be audited before the transaction (disclosure) occurs.

  ---

  # The Net-Value Intake Protocol (NVIP)

  **Time:** 20 Minutes
  **Operator:** Genetic Counsellor
  **Goal:** Determine if $Value(Instrumental) > Cost(Hedonic + Privacy + Agency)$.

  ## Step 1: The Instrumental Value Check
  **Good's Assumption:** Information allows for a different decision than would be made without it.
  **Decision Theory:** If $P(Action|Positive) = P(Action|Negative)$, the Expected Value of Information (EVI) is zero.
  **Value Judgment Laundered:** Defining what counts as a "decision." (Medical intervention only? Life planning? Reproductive choices?)

  **The Question:**
  "Imagine the result comes back [Positive/High Risk]. What specifically do you do next that you would *not* do if it came back [Negative/Low Risk]?"

  **Sufficient Answer:**
  A concrete, actionable step linked to the result (e.g., "I start colonoscopies at 30," "I tell my sister," "I pursue IVF with PGT").
  *   *Note:* "I worry less" is not an action; it is a hedonic state (covered in Step 2).

  **Stop Condition (NO):**
  If the patient says, "There's nothing I can do," or "I'd do the same screening either way."
  *   *Protocol Action:* **Do not offer.** The EVI is zero; any cost makes the net value negative.
  *   *Exception:* If the patient explicitly values "certainty" over "action" (moves to Step 2).

  **Unsettled Case:**
  Patient says, "I wouldn't change my medical care, but I would plan my retirement differently."
  *   *Flag:* This is a values question. The clinic must decide if "life planning" counts as clinical utility.

  ## Step 2: The Hedonic & Temporal Cost Check
  **Good's Assumption:** The cost of observation is zero.
  **Decision Theory:** $Net Value = EVI - Cost(Waiting) - Cost(Knowing)$.
  **Value Judgment Laundered:** Quantifying anxiety. We treat "weeks of waiting" as a negative utility cost, but we also treat "living with uncertainty" as a cost. Which is heavier is a preference, not a fact.

  **The Question:**
  "Results take [X] weeks. Some patients prefer to know immediately even if it causes stress; others prefer not to know unless there is a fix. Which are you? And if you know a risk exists, will that knowledge itself impair your daily functioning?"

  **Sufficient Answer:**
  "I can handle the wait," or "I need to know now to stop worrying," OR "I don't want to know unless there is a fix."

  **Stop Condition (NO):**
  If $Cost(Knowing) > EVI$. Specifically: "If there's no cure, I don't want to know," AND Step 1 yielded no preventive actions.
  *   *Protocol Action:* **Do not offer.** This distinguishes a *preference* (I value peace of mind over data) from a *mistake* (I think the test is diagnostic when it is probabilistic).

  **Distinguishing Mistake vs. Preference:**
  *   *Mistake:* "I won't take it because the test is inaccurate." (Correct the fact, re-evaluate).
  *   *Preference:* "I won't take it because I don't want the burden." (Respect the refusal).

  ## Step 3: The Agency & Compliance Check
  **Good's Assumption:** The agent updates beliefs and acts rationally to maximize utility.
  **Decision Theory:** If the agent cannot commit to the optimal action post-update, the EVI drops.
  **Value Judgment Laundered:** Paternalism. Deciding when a patient's self-reported intent is unreliable enough to withhold information.

  **The Question:**
  "You mentioned you would [Action from Step 1]. Have you been able to stick to similar screening or lifestyle plans in the past? What usually gets in the way?"

  **Sufficient Answer:**
  "I have a history of following through," or "I have support systems in place to ensure I act."

  **Stop Condition (HAND-OFF):**
  If the patient says, "I know I should, but I probably won't do it," or has a history of non-compliance with high-stakes medical advice.
  *   *Protocol Action:* **Hand back to patient.** "If you get this result and don't act on it, you incur the hedonic cost without the instrumental benefit. Are you sure you want the data?"
  *   *Why Hand-off:* Withholding info here is therapeutic privilege. The board must decide if counsellors are allowed to exercise it.

  ## Step 4: The Boundary & Externality Check
  **Good's Assumption:** The agent is the sole locus of utility.
  **Decision Theory:** Genomic info is non-rivalrous and partially non-excludable (family members share it).
  **Value Judgment Laundered:** Individual Autonomy vs. Familial Duty. We treat the patient as the client, but the data belongs to the lineage.

  **The Question:**
  "This result stays in your medical chart and may be relevant to [Parents/Siblings/Children]. Are there people in your life who *must not* know this, or who *must* know this? How will you handle that?"

  **Sufficient Answer:**
  "I understand this affects my family. I have a plan for disclosure," or "I accept the risk of this entering the permanent record."

  **Stop Condition (FLAG):**
  If disclosure poses a credible threat of harm (e.g., domestic violence, disinheritance, insurance discrimination in non-protected jurisdictions).
  *   *Protocol Action:* **Board Review.** Do not proceed at intake. This violates the "individual agent" assumption too severely for a counsellor to weigh alone.

  ## Step 5: The Signal Coarsening Check
  **Good's Assumption:** Finer partitions of the state space are always preferred (more information is better).
  **Decision Theory:** A coarsened signal (e.g., "Actionable/Not Actionable" vs. "Risk Score 0-100") has lower EVI but may have significantly lower Hedonic Cost.
  **Value Judgment Laundered:** Is "blunting" a rational coping strategy or an avoidance of reality? We treat it as rational if it preserves actionability.

  **The Question:**
  "Do you need the specific number/risk percentage, or is a 'Yes/No' on whether we can act on it sufficient?"

  **Sufficient Answer:**
  "Just tell me if I need to do something."

  **Resolution:**
  If the patient requests coarsening, **grant it.**
  *   *Why:* This minimizes $Cost(Knowing)$ while preserving $EVI$ (since the action is the same). It validates the patient's utility function over the clinician's desire for data completeness.

  ---

  # Running the Protocol on Current Cases

  Here is how the NVIP applies to the three scenarios you raised.

  ### Case 1: The Secondary Findings Panel (Default Offer)
  *Current Practice:* Offered to everyone undergoing sequencing, opt-out only.
  *   **Step 1 (Action):** For most patients, there *is* an action (surveillance for cancer/cardiac risks). **Pass.**
  *   **Step 2 (Hedonic):** Many patients decline because they don't want to know about untreatable risks included in the panel. **Pass** (if they opt-out).
  *   **Step 3 (Agency):** Default assumes compliance.
  *   **Step 4 (Boundary):** Secondary findings often implicate family members who haven't consented. **Flag.**
  *   **Step 5 (Coarsening):** Usually binary (Pathogenic/Not). **Pass.**

  **Verdict:** The "Default" status violates Step 2 and Step 4.
  *   *Philosophical Audit:* By making it default, you assume $Cost(Knowing) \approx 0$. The protocol reveals this is false for a subset of patients.
  *   *Recommendation:* Move from "Opt-Out" to "Active Choice." The counsellor must explicitly run Step 2 before the box is checked. If the patient cannot articulate an action plan for the *range* of conditions on the panel, the default should not apply.

  ### Case 2: Polygenic Score (Late-Onset, No Intervention)
  *Current Practice:* Often offered as "empowerment" or "future-proofing."
  *   **Step 1 (Action):** "What will you do differently?" Patient: "Nothing, there's no prevention."
  *   **Stop Condition:** **NO.**
  *   *Philosophical Audit:* $EVI = 0$. $Cost(Knowing) > 0$ (anxiety, insurance implications). Net Value is negative.
  *   *Recommendation:* **Stop offering this.** You are selling information with zero instrumental value and positive hedonic cost. This is the clearest violation of Good's Theorem assumptions. Unless the patient passes Step 2 by asserting "Certainty itself has utility to me," this should not be in the clinic menu.

  ### Case 3: Patient Wants Panel Disclosed *Only* If Actionable
  *Current Practice:* Often resisted by labs/counsellors who want full transparency.
  *   **Step 1 (Action):** Patient defines actionability as the gate. **Pass.**
  *   **Step 2 (Hedonic):** Reduces $Cost(Knowing)$ by filtering out VUS or non-actionable risks. **Pass.**
  *   **Step 5 (Coarsening):** This is a request for a coarsened signal (Actionable / Not Actionable).
  *   *Philosophical Audit:* Good's Theorem says finer is better. But Good assumes costless info. Here, the patient is paying a hedonic cost for precision. By accepting coarsening, you respect their utility function.
  *   *Recommendation:* **Allow it.** This is the rational response to non-zero information costs. It maximizes *Net* Value, even if it reduces *Gross* Information.

  ---

  # Summary for the Advisory Board

  If you adopt this protocol, three things will happen:

  1.  **Utilization will drop.** You will stop offering Polygenic Scores for untreatable conditions (Case 2). This is ethically correct but may impact revenue or "cutting edge" perception.
  2.  **Consent will slow down.** You cannot "default" patients into Secondary Findings (Case 1) without violating Step 2. You must move to Active Choice.
  3.  **Ambiguity will remain.** Step 3 (Agency) and Step 4 (Family) will generate "Hand-Off" cases. The protocol does not solve them; it isolates them.

  **The Laundered Judgment:**
  The arithmetic of $Net Value$ looks objective, but the inputs are not.
  *   When we decide "Life Planning" counts as Action (Step 1), that is a value judgment.
  *   When we decide "Anxiety" outweighs "Curiosity" (Step 2), that is a value judgment.
  *   When we allow a patient to be irrational about compliance (Step 3), that is a value judgment.

  **The Recommendation:**
  Adopt the protocol, but explicitly codify the "Value Judgments" in your clinic's charter.
  *   *Charter Rule A:* "Clinical Utility" includes life planning, not just medical intervention. (Solves Step 1 ambiguity).
  *   *Charter Rule B:* Patient self-report on compliance is accepted unless contradicted by medical history. (Solves Step 3 paternalism).
  *   *Charter Rule C:* Coarsened signals are permissible if requested to reduce hedonic cost. (Solves Step 5).

  Without those charter rules, the counsellor is just guessing. With them, you have turned Good's Theorem from a mathematical impossibility into a workable clinical triage tool.
