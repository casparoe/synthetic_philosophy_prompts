      *   *No Expression:* "Reasons without consumers." In DevTools, a violation without an owner is a *bug in the process* (unowned package), not a valid state. A lint rule with no purpose is *technical debt* (remove the rule). The system *requires* a consumer (SLO/Spec). Philosophy asks if value exists without a valuer.

