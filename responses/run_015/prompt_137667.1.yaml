  2.  **Deconstruct the Philosophical Debate:**
      *   *Realism (Side A):* Normative facts exist independently of minds. (e.g., "You ought to save the child" is true even if you don't know the child is there).
      *   *Internalism/Constructivism (Side B):* Reasons are tied to motivation, knowledge, or agency. (e.g., "You have a reason to save the child" only makes sense if you know the child is there or care about children).
      *   *The "For/To" distinction:* "There is a reason for X" vs. "X has a reason."
      *   *The "Guidance" constraint:* Reasons are supposed to guide action. If you can't know it, how can it guide?

  3.  **Map to DevTools Vocabulary (The Translation Layer):**

      *   *Concept:* **Reason for Action.**
          *   *DevTools Equivalent:* **Lint Violation / Static Analysis Warning.**
          *   *Why:* It's a signal that something *should* be changed.

      *   *Concept:* **Agent (The one acting).**
          *   *DevTools Equivalent:* **Developer / On-Call Engineer / CODEOWNER.**

      *   *Concept:* **"There is a reason" (Objective/External).**
          *   *DevTools Equivalent:* **A real bug/vulnerability exists in the codebase.**
          *   *Nuance:* Even if no one knows it's there, even if the linter doesn't catch it, even if the repo is archived. The code *is* unsafe.

      *   *Concept:* **"You have a reason" (Subjective/Internal).**
          *   *DevTools Equivalent:* **A ticket assigned to you / A lint error in your PR.**
          *   *Nuance:* It's routed. It's visible. It's actionable *by you*.

      *   *Concept:* **Weighing/Outweighing.**
          *   *DevTools Equivalent:* **Severity Levels (Error vs. Warning vs. Info) & Triage Priority.**
          *   *Nuance:* P0 blocks merge. P3 is backlog.

      *   *Concept:* **Objective vs. Epistemic Reasons.**
          *   *DevTools Equivalent:* **Ground Truth (Runtime Reality) vs. Static Analysis (What the tool can prove).**
          *   *Nuance:* Soundness vs. Completeness. A false negative is an objective reason without an epistemic reason.

      *   *Concept:* **Guidance Condition.**
          *   *DevTools Equivalent:* **Actionability / CI Gate.**
          *   *Nuance:* If the CI doesn't fail, the dev isn't guided.

  4.  **Drafting the Translation (Iterative Process):**

      *   *Attempt 1 (Mental):* So, Side A is like a memory leak nobody found. Side B is like a lint error in your PR. The fight is whether the memory leak counts as a "reason to fix" if nobody knows.
      *   *Refining for the User:* Use their specific terms. "Unowned package," "Suppression," "SLO."
      *   *The "Residue":* What doesn't fit? The idea of a reason that *favors* action but isn't tied to a *goal* (SLO/Spec). In code, everything is instrumental. Fix bug -> meet SLO. Pass lint -> meet Spec. Is there a "reason to code" that isn't about correctness or performance? That's the hard part.

