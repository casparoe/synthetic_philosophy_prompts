prompt: |-
  Hi. I'm one of two people who cover the clinical ethics consult line at a 400-bed community hospital — the other is a nurse practitioner, I'm a hospitalist by training, and between us we have maybe one undergrad philosophy course that I mostly slept through. We get paged three or four times a month, almost always at 2am, almost always by phone, with the family at the bedside and the charge nurse wanting an answer before shift change. I've got 20–30 minutes and whatever's in the EMR. What comes out the other end is a short note in the chart that the attending signs and, if anything is even slightly unusual, risk management has to be able to defend a year later.

  The consults that actually wreck me are all the same shape underneath: is what we're about to do *stopping something* or *making something happen*, and does that difference matter here. The team's working distinction is our medical director's slogan — "we don't do things to kill people, we just stop doing things to them" — which is fine as a bumper sticker and useless at 2am. And the half-remembered philosophy I have doesn't convert either: something about double effect, and something about whether you initiate a lethal sequence or just fail to interrupt one (the "direction of agency," I want to say? whoever it was seems to think *that* is the real cut, not the bodily-movement one). I can't turn either into a checklist, and I've noticed we can't even get started because "letting die" needs a baseline and I genuinely don't know which baseline to use: the disease's natural course (in which case nobody in an ICU is ever "allowing" anything), the patient's current supported state (in which case every withdrawal is a killing), or just whatever this unit normally does for this diagnosis (which feels like it makes the whole thing a local custom with moral language stapled to it). Pick one for me, tell me what breaks under the other two, and mark clearly which part of that choice is a values call I should be naming out loud in the note instead of burying.

  So: write me a decision procedure my NP or I can actually run at 2am, in order, with what counts as a sufficient answer to each question, where it hard-stops with a no, and where it hands off to a person because the question is one of values or of facts nobody can get in thirty minutes. Please keep three questions separate that we constantly mush together: (1) is this permissible at all, (2) is this what a decent clinician should be offering here (those come apart — we can all feel it, I can't say how), and (3) is it fair to ask *this* nurse to be the one in the room, given that "I'll write the order but I don't want to be there" is a position half our staff holds and I've never decided whether it's coherent. The procedure should also tell us when the right move is to do nothing for twelve hours and re-page, and it should say what the chart note has to contain so it survives risk management — I don't want elegant reasoning that reads badly to a lawyer. Give me a one-page cheat-card version and then a slightly longer annotated version, and be straight with me about which steps are really just the intent/foresight distinction in a lab coat and which ones are doing independent work.

  Then run it on three cases.

  1. Terminal extubation, 58-year-old, hypoxic brain injury, family wants it now, two nurses have said they'd rather not be assigned to the room, and the resident has already put in orders for fentanyl and midazolam "for air hunger" starting before we pull the tube.
  2. Deactivating a destination-therapy LVAD in a 61-year-old who is not otherwise dying — no disease process is going to stop his heart, the pump is the only reason it keeps beating, and if we switch it off he dies in minutes. The team is split on whether this is the same as extubation or is something categorically different, and I can't tell if that split is moral or just squeamishness about hardware.
  3. A 79-year-old on the ventilator with a catastrophic GI bleed, where the plan everyone has quietly agreed to is "no escalation" — no more blood products, no more pressor — while leaving the vent running, which means he dies slowly over a day and a half instead of quickly. I have a horrible feeling your procedure is going to tell me this is not morally different from withdrawing and is *worse for him*, and that we only do it because it feels better to us. If that's where it goes, say so and then tell me what I'm supposed to do with that at 2am with his daughter in the room.

  Finally: tell me where the procedure misfires. I already suspect it'll get gamed by framing (we're very good at describing things as "not starting"), that it'll get used to rubber-stamp whatever the attending wanted, and that getting the metaphysics right does nothing at all for a nurse who's been crying in the break room. But you'll see failure modes I haven't. And please: no citations, no reading lists, no "you should really read X" — I have no library access and I want your argument in your own words, not a map to somebody else's.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Hospitalist covering clinical ethics consult line at a 400-bed community hospital. Partnered with an NP. Limited philosophy background ("slept through" undergrad course).
      *   **Context:** High pressure, low resource (2am pages, 20-30 mins, EMR only), high stakes (risk management, legal defensibility).
      *   **Core Problem:** Distinguishing between "stopping something" (allowing to die) vs. "making something happen" (killing). The current slogan ("we don't do things to kill people...") is useless. Philosophical concepts (double effect, acts/omissions, baseline problems) aren't translating to checklists.
      *   **Specific Needs:**
          *   A decision procedure (algorithm/checklist) usable at 2am.
          *   Must separate three mushed questions: Permissibility, Clinical Appropriateness, Staff Conscience/Fairness.
          *   Must specify when to wait (do nothing for 12 hours).
          *   Must specify chart note requirements for risk management.
          *   Must identify where values calls are being made (vs. facts).
          *   Must distinguish between Intent/Foresight (Double Effect) and independent work.
          *   **Deliverables:** One-page cheat card, annotated version, application to three specific cases, analysis of failure modes.
          *   **Constraints:** No citations, no reading lists, plain language, direct argument.

  2.  **Deconstruct the Ethical/Philosophical Core:**
      *   *The Baseline Problem:* The user correctly identifies that "letting die" depends on a baseline.
          *   Option A: Natural course of disease (ICU is always intervention).
          *   Option B: Current supported state (Withdrawal is killing).
          *   Option C: Standard of care/Unit custom (Morality becomes local custom).
      *   *My Recommendation:* The legal and ethical standard in US medicine is effectively **Option B (Current Supported State) treated as a *Provisional Trial*.** Treatment is a trial. If the trial no longer serves the patient's goals, stopping it is allowing the underlying pathology to kill, *provided* the intent is relief of burden, not death. However, for the *procedure*, we need to simplify this. The legal safe harbor is "Medical Futility or Patient/Surrogate Refusal of Burdensome Treatment."
      *   *Acts vs. Omissions:* Legally and ethically, withdrawing = withholding. But psychologically and for staff conscience, they differ. The procedure needs to acknowledge this without getting bogged down in metaphysics.
      *   *Double Effect:* Intent matters. Is the goal death or symptom relief?
      *   *The Three Questions:*
          1.  *Permissibility:* Is it legal/ethical? (Right to refuse treatment).
          2.  *Appropriateness:* Is it medically indicated/reasonable? (Standard of care).
          3.  *Conscience:* Can we ask *this* staff to do it? (Moral distress).

  3.  **Drafting the Decision Procedure (The "2am Algorithm"):**
      *   Need to be binary where possible. Yes/No.
      *   Need to flag "Values Call" clearly.
      *   Need to address the "Wait" option.
      *   *Step 1: Authority.* Who decides? (Patient/Surrogate vs. Medical Futility).
      *   *Step 2: Goal.* Why are we doing this? (Relief of burden vs. Cause death).
      *   *Step 3: Method.* How will we do it? (Palliative sedation vs. Lethal injection).
      *   *Step 4: Staff.* Who does the work? (Conscience clauses).
      *   *Step 5: Documentation.* What goes in the note?

  4.  **Refining the Baseline Choice:**
      *   The user asked me to "Pick one for me, tell me what breaks under the other two."
      *   *Choice:* **The "Provisional Trial" Baseline.** (Treatment is an intervention offered to achieve a goal. If the goal is unachievable or the burden outweighs the benefit, the trial ends. The cause of death is the underlying condition, not the removal of the machine.)
      *   *Why not Natural Course?* Makes ICU care morally suspect from minute one.
      *   *Why not Current State?* Makes withdrawal murder.
      *   *Why not Unit Custom?* Makes morality arbitrary/geographic.
      *   *Values Call:* Defining "Benefit" and "Burden." This must be explicit in the note.

  5.  **Drafting the Cases:**
      *   *Case 1 (Extubation):* Classic withdrawal. Orders for comfort care *before* extubation are crucial (Double Effect). Staff refusal needs management (swap, don't force).
      *   *Case 2 (LVAD):* The hard case. Legally/ethically same as vent (artificial support), but feels like killing. Procedure must hold the line: It's a treatment, not a body part. But acknowledge the psychological weight.
      *   *Case 3 (Slow Death/Non-escalation):* The "Orwellian" case. User suspects this is worse. I need to agree. It prolongs suffering for staff comfort. The procedure should flag this as "Clinically Inappropriate" even if "Permissible."

  6.  **Drafting the Documentation (Risk Management):**
      *   Needs to sound like medical decision making, not philosophy.
      *   Keywords: "Medically inappropriate," "Burdens outweigh benefits," "Goals of care," "Comfort measures," "Underlying pathology."
      *   Avoid: "Killing," "Stopping life," "Ethics."

  7.  **Addressing Failure Modes:**
      *   Framing effects ("Not starting" vs. "Stopping").
      *   Rubber-stamping attending bias.
      *   Metaphysics vs. Moral Distress (The crying nurse).
      *   Time pressure leading to errors.

  8.  **Review against Constraints:**
      *   No citations? Check.
      *   One-page cheat card? Check.
      *   Annotated version? Check.
      *   Three cases run? Check.
      *   Failure modes? Check.
      *   Tone: Direct, pragmatic, peer-to-peer (hospitalist to hospitalist).

  9.  **Self-Correction/Refinement during drafting:**
      *   *Initial thought:* Maybe suggest an ethics committee page.
      *   *Correction:* User said 2am, 30 mins. Committee isn't available. The procedure *is* the triage. If it fails, *then* wait/punt.
      *   *Initial thought:* Dive deep into Double Effect.
      *   *Correction:* User said they can't use it. Translate it into "Primary Intent" check.
      *   *Crucial Point:* The user asked about the nurse who says "I'll write the order but don't want to be there." I need to address the coherence of that. It's coherent for the *order*, but incoherent for the *duty of care*. If you accept the patient, you accept the necessary care. But you can swap tasks.
      *   *Baseline:* I need to be very clear on the "Provisional Trial" baseline. This is the standard legal defense in the US (Cruzan, etc.).

  10. **Final Polish:** Ensure the distinction between Permissibility, Appropriateness, and Conscience is sharp in the procedure. Ensure the "Wait" trigger is clear (e.g., if Surrogate disagrees with Team on Futility).

  *(Self-Correction on Case 3)*: The user suspects the procedure will say "non-escalation while leaving vent on" is morally worse. I should confirm this. It is often "passive euthanasia" by slow starvation/suffocation vs. active palliative withdrawal. It protects the *team* from the feeling of "pulling the plug" but harms the *patient*. I need to give them the script to tell the daughter.

  *(Self-Correction on LVAD)*: This is the hardest one. Some institutions treat LVADs as "organ" vs "device." Consensus is device. I must stick to the "Device = Treatment" line for consistency, or the logic collapses.

  *(Final check on tone)*: Empathetic but firm. No academic fluff. "Here is the tool. Here is how it breaks."

  Let's build the response.
answer: |-
  Here is the tool you asked for. It is designed to be legally defensible, philosophically consistent (within the bounds of US medical law), and usable at 2am.

  ### Part 1: The Baseline Choice

  You asked me to pick a baseline for "letting die."

  **Pick:** **The Provisional Trial Baseline.**
  *Definition:* Any life-sustaining treatment (ventilator, dialysis, LVAD, pressors) is a *trial* offered to achieve a medical goal (recovery, bridge to transplant, comfort). It is not the patient's natural state.

  **Why this one:**
  1.  **Natural Course Baseline (Disease kills):** Breaks because it makes ICU admission itself a moral violation. If the baseline is "dead from pneumonia," then intubating is "making something happen" (interfering with nature). This makes *all* ICU care ethically suspect.
  2.  **Current State Baseline (Machine is life):** Breaks because it makes withdrawal murder. If the ventilator is now "part of the patient," removing it is an attack on the body. This forbids withdrawal entirely.
  3.  **Unit Custom Baseline (What we usually do):** Breaks because it makes morality geographic. It implies a patient in a busy ICU is "more alive" than one in a quiet ward. It offers no defense against "why did you stop for *this* patient?"

  **The Values Call You Must Name:**
  Under the Provisional Trial Baseline, the definition of **"Benefit"** is a values call, not a medical fact.
  *   *In the note, you must write:* "The surrogate defines benefit as [conscious interaction / avoidance of pain / length of life]. The medical team agrees/disagrees that the current trial achieves this."
  *   *Why:* Risk management needs to know you didn't decide the patient's life wasn't worth living based on *your* values. You decided the *treatment* failed to meet *their* goals.

  ***

  ### Part 2: The 2am Decision Procedure (Cheat Card)

  **Print this. Keep it in the badge holder.**

  **STEP 1: AUTHORITY (Who decides?)**
  *   **Q:** Is there a valid surrogate or advance directive requesting withdrawal/limitation?
      *   **YES:** Go to Step 2.
      *   **NO:** Is the treatment *medically futile* (physiologically impossible to achieve goal)?
          *   **YES:** Go to Step 2. (Requires Attending + Second Physician sign-off).
          *   **NO:** **STOP.** You cannot proceed. Default is full treatment. Page Ethics/Admin for conflict resolution. Do not act at 2am.

  **STEP 2: INTENT (Why are we doing this?)**
  *   **Q:** Is the primary intent to relieve suffering caused by the treatment, OR to cause death?
      *   **RELIEVE SUFFERING:** Proceed to Step 3. (Double Effect safe harbor).
      *   **CAUSE DEATH:** **STOP.** Impermissible.
      *   *Test:* If the patient miraculously survived the withdrawal, would we be disappointed? If yes, intent is suspect.

  **STEP 3: METHOD (How does it happen?)**
  *   **Q:** Are comfort meds (opioids/benzos) ordered and administered *before* the physiologic withdrawal?
      *   **YES:** Proceed to Step 4.
      *   **NO:** **STOP.** Do not withdraw. Treat air hunger/pain first.
      *   *Note:* Dose must be titrated to symptom, not fixed to "ensure death."

  **STEP 4: CONSCIENCE (Who does the work?)**
  *   **Q:** Does the assigned nurse refuse to participate in the *act* of withdrawal?
      *   **NO:** Proceed.
      *   **YES:** Can we swap the nurse for the *procedure only*?
          *   **YES:** Swap.
          *   **NO:** **STOP.** Do not force a nurse to violate conscience on a non-emergent withdrawal. Wait for shift change or charge nurse reassignment.
      *   *Note:* "I'll write the order but won't be in the room" is **incoherent**. If you accept the patient assignment, you accept the care plan. You can swap tasks, not abandon the room.

  **STEP 5: TIMING (Do we wait?)**
  *   **Q:** Is there active disagreement among surrogates, or is the "futility" claim debatable?
      *   **NO:** Proceed.
      *   **YES:** **STOP.** Wait 12 hours. Page Ethics Committee. "Not starting" is easier to defend than "stopping" in the face of conflict.

  **DOCUMENTATION REQUIREMENTS (For Risk Management)**
  1.  **Diagnosis:** Underlying fatal pathology (e.g., "Hypoxic brain injury," not "Ventilator dependence").
  2.  **Goal:** "Treatment no longer aligns with patient goals of [X]."
  3.  **Action:** "Discontinuation of non-beneficial medical intervention."
  4.  **Meds:** "Titration of analgesia/sedation for symptom management."
  5.  **Avoid:** "Stopping life support," "Letting die," "Euthanasia," "Killing."

  ***

  ### Part 3: Annotated Procedure (The "Why")

  **Step 1: Authority**
  *   **Work:** This separates *Rights* from *Medicine*.
  *   **Permissibility:** Patients have a legal right to refuse treatment (even life-saving). They do not have a right to demand treatment that doesn't work.
  *   **The Trap:** If the family wants it off and the doctor says "no," you can usually let them off (Step 1 YES). If the family wants it *on* and the doctor says "no" (Futility), you need a higher bar (Second physician).
  *   **2am Rule:** If there is *any* doubt about who the decision-maker is, **Wait.** Do not guess surrogate hierarchy at 2am.

  **Step 2: Intent**
  *   **Work:** This is the **Double Effect** distinction in a lab coat.
  *   **Permissibility vs. Appropriateness:** It is *permissible* to intend relief. It is *inappropriate* to intend death.
  *   **The Trap:** "Terminal Sedation" is permissible if the dose is driven by grimacing/tachycardia. It is impermissible if the dose is driven by the clock ("We need him gone by 0700").
  *   **Risk Management:** The note must reflect symptom-driven dosing. "Fentanyl 50mcg IV q10min for air hunger" is defensible. "Fentanyl 5mg IV push" is not.

  **Step 3: Method**
  *   **Work:** This addresses the "Acts vs. Omissions" worry.
  *   **The Trap:** Withdrawing without comfort meds *is* killing by suffocation. Withdrawing *with* comfort meds is treating the symptom of withdrawal.
  *   **Risk Management:** The sequence matters. Order the comfort meds *first*. Chart the administration *before* the extubation/deactivation.

  **Step 4: Conscience**
  *   **Work:** This addresses your "fairness" question.
  *   **Coherence:** "I'll write the order but won't be there" is **not coherent** for the primary nurse. It creates a two-tier staff. However, *task swapping* is coherent. Nurse A pushes the button; Nurse B manages the family.
  *   **Fairness:** It is unfair to force a nurse to perform an act they view as morally lethal on a non-emergent timeline. It is fair to ask them to care for the dying patient *after* the act.
  *   **2am Rule:** If the nurse is crying in the breakroom, do not make them do it. Find the house supervisor. Swapping takes 20 minutes; moral injury lasts years.

  **Step 5: Timing**
  *   **Work:** This is your safety valve.
  *   **The Trap:** Urgency is often manufactured by shift change anxiety, not patient physiology.
  *   **Rule:** Unless the patient is actively coding or in visible distress *now*, you have 12 hours. Use it.

  ***

  ### Part 4: Running the Cases

  **Case 1: Terminal Extubation (58yo, Brain Injury)**
  *   **Step 1 (Authority):** Family wants it. Surrogate authority assumed valid. **PASS.**
  *   **Step 2 (Intent):** Goal is to stop burdensome intervention, not kill. **PASS.**
  *   **Step 3 (Method):** Resident ordered fentanyl/midaz *before* pull. **PASS.** (Ensure doses are titratable, not fixed bolus to stop heart).
  *   **Step 4 (Conscience):** Two nurses refuse. **STOP/PAUSE.** Do not force them. Charge nurse must reassign the *procedure* to a willing nurse. The refusing nurses can care for the body after death.
  *   **Step 5 (Timing):** Family wants it "now." Is there physiologic distress? If no, you can wait for shift change to solve the nurse staffing. If yes (air hunger), proceed with willing nurse.
  *   **Verdict:** **Permissible.**
  *   **Note:** "Decision made by surrogate to withdraw life-sustaining therapy (ventilator) as treatment no longer supports goals of care. Underlying cause of death: Hypoxic brain injury. Medications administered for symptom management of dyspnea/anxiety prior to withdrawal."

  **Case 2: LVAD Deactivation (61yo, Destination Therapy)**
  *   **Step 1 (Authority):** Patient/Surrogate requests stop. **PASS.**
  *   **Step 2 (Intent):** Team split. Is the LVAD a "body part" or a "pump"? Under **Provisional Trial Baseline**, it is a pump (treatment). Stopping it is allowing the heart failure to kill. **PASS.**
  *   **Step 3 (Method):** Switching off leads to immediate death. Comfort meds *must* be on board *before* the switch. **PASS** (if meds ordered).
  *   **Step 4 (Conscience):** Team squeamishness. This is high moral distress. **PAUSE.** Acknowledge the psychological weight. It feels like killing because the patient is otherwise stable. But ethically, it equals extubation.
  *   **Step 5 (Timing):** Not an emergency. **WAIT.** Do not do this at 2am if the team is split. Convene ethics/leadership.
  *   **Verdict:** **Permissible, but delay for team alignment.**
  *   **Note:** "LVAD is a mechanical circulatory support device. Patient/Surrogate elects to discontinue device trial. Underlying cause of death: End-stage heart failure. Palliative sedation initiated for symptom management prior to device deactivation."

  **Case 3: The Slow Death (79yo, GI Bleed, No Escalation)**
  *   **Step 1 (Authority):** Team/Family agreed on "No Escalation." **PASS.**
  *   **Step 2 (Intent):** **FAIL.** This is the trap. The intent here is to avoid the *moral feeling* of withdrawal while accepting the *outcome* of death.
  *   **Step 3 (Method):** Leaving the vent on while withholding blood/pressors prolongs the dying process. This increases suffering (air hunger, agitation) without benefit.
  *   **Step 4 (Conscience):** Staff feels "safer" because they didn't pull the plug. This is moral cowardice, not conscience.
  *   **Step 5 (Timing):** **STOP.** This plan is clinically inappropriate.
  *   **Verdict:** **Impermissible Plan.** You must convert this to active withdrawal.
  *   **What to tell the Daughter at 2am:** "I know it feels like we are keeping him safe by leaving the machine on. But the machine is now forcing his heart to beat against a body that is shutting down. It is causing him to drown slowly. The kindest thing, and the standard of care, is to give him medicine to sleep deeply, and then turn the machine off so he can die peacefully. Withholding blood while leaving the vent is not care; it is prolonging the dying. I will order the comfort meds now, and we will turn the vent off in 10 minutes. I will be in the room with you."
  *   **Why:** Your suspicion is correct. This is morally worse. It prioritizes the *staff's* moral comfort over the *patient's* physical suffering. The procedure flags this at Step 2 (Intent) and Step 3 (Method).

  ***

  ### Part 5: Where This Procedure Misfires

  You asked for the failure modes. Here they are.

  **1. The Framing Game (The "Not Starting" Loophole)**
  *   **Failure:** Attendings will learn to say "We aren't stopping the LVAD; we are choosing not to replace the battery."
  *   **Fix:** The procedure defines "Treatment" broadly (Step 1). Battery, plug, tube, drug—it's all the "Trial." If you wouldn't start it today, you shouldn't maintain it today. But at 2am, you can't police this.
  *   **Risk:** Risk Management hates this distinction. If you document "Battery not changed" instead of "Device deactivated," a lawyer will argue you abandoned the patient. **Document the deactivation.**

  **2. The Rubber Stamp (Attending Bias)**
  *   **Failure:** The Attending decides the patient is "futile" because they are old/poor/difficult, not because the physiology is impossible. The Procedure (Step 1) relies on the Attending's honesty.
  *   **Fix:** The "Second Physician" requirement for futility is your only shield. If it's a surrogate request, you rely on the surrogate. If it's medical futility, you need backup. At 2am, this means calling the hospitalist on call.
  *   **Reality:** You will miss this. You will sign off on a "futile" claim that was actually "I'm tired of this family." The only fix is random audit later, not 2am prevention.

  **3. The Crying Nurse (Metaphysics vs. Morality)**
  *   **Failure:** The procedure says "Swap the nurse." But in a 400-bed community hospital at 2am, there *is* no other nurse.
  *   **Reality:** The procedure will break here. If the only nurse refuses, you have three bad options:
      1.  Force them (Moral Injury).
      2.  Do it yourself (Hospitalist pushing meds/pulling tubes—risky for liability/scope).
      3.  Wait (Patient suffers).
  *   **The Hard Truth:** If the nurse refuses, **Wait.** Patient suffering from waiting 4 hours for shift change is less legally risky than a nurse sabotaging care or filing a complaint that you coerced them. The "12-hour Wait" (Step 5) is your escape hatch. Use it.

  **4. The "Values Call" Burial**
  *   **Failure:** You will write "Medical Futility" when you mean "Quality of Life is poor."
  *   **Risk:** "Futility" is physiologic (the drug doesn't work). "Quality of Life" is values-based (the outcome is unacceptable).
  *   **Fix:** If the heart *can* beat with the pressor, it is not futile to give the pressor. It is *burdensome*. Change your vocabulary in the note. "Burdens outweigh benefits" is defensible. "Futile" is a lie that gets you deposed.

  **5. The 2am Pressure Cooker**
  *   **Failure:** The Charge Nurse wants the bed. The Family wants relief. You want to go home.
  *   **Result:** You skip Step 4 (Conscience) and Step 5 (Timing).
  *   **Fix:** Put a physical sticky note on your badge: **"IS THIS AN EMERGENCY?"** If the patient is not actively seizing or gasping in front of you, it is not an emergency. Death is not an emergency. Suffering is. Treat the suffering, then take the time.

  ### Final Word

  You are not doing philosophy at 2am. You are doing **triage for moral risk.**
  This procedure prioritizes:
  1.  Legal Authority (Surrogate vs. Futility).
  2.  Symptom Control (Double Effect).
  3.  Staff Retention (Conscience).

  It will not make you a good philosopher. It will keep you out of court, keep your nurses from quitting, and keep the patients from drowning in their own secretions while you argue about baselines. That is the best you can do.
