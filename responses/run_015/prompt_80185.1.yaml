answer: |-
  **Operationalizing Teleosemantics for Novel Systems**

  Standard teleosemantics (Millikan, Papineau) ties content to selection history. Your problem is that gradient descent and reinforcement learning (RL) mimic selection without being biological evolution. To operationalize this, we must distinguish between *evolutionary* proper functions and *learning-derived* proper functions, while strictly separating substrate from software.

  Below is a five-step procedure. It forces explicit theoretical commitments at each junction. If you cannot answer a step affirmatively, the procedure stops or hands off to judgment.

  ### The Procedure

  **Step 1: Vehicle Identification**
  *   **Question:** What is the specific physical or structural state carrying the candidate content?
  *   **Requirement:** Identify the vehicle independently of its interpretation (e.g., "activation pattern in layer 4," not "the belief that Paris is capital").
  *   **Stop Condition:** If the vehicle cannot be individuated without referencing its content, stop. Teleosemantics requires a vehicle that exists prior to content assignment.
  *   **Substrate Note:** Record whether the vehicle is biological (neural spike) or artificial (weight activation). Do not conflate the brain hosting the software with the software itself.

  **Step 2: Selection History Audit**
  *   **Question:** Was this *type* of vehicle selected for producing a specific effect?
  *   **Sufficient Answer:** Yes, via evolutionary history OR via a training process (gradient descent/RL) that functioned as a selection mechanism.
  *   **Stop Condition:** If the vehicle arose via drift or random initialization without selection pressure, stop. No proper function, no content.
  *   **Modification A (Learning History):** You must accept that artificial selection (training loops) counts as a teleological basis. If you reject this, the procedure stops here for all AI cases.

  **Step 3: The Novelty Check (Derived Function)**
  *   **Question:** Is the current use of the vehicle identical to the use during selection?
  *   **If Yes:** Proceed to Step 4.
  *   **If No (Novel Context):** Apply **Modification B (General Mechanism Clause).** Ask: Was the vehicle selected for a *general capacity* (e.g., pattern completion) that covers this new use?
  *   **Sufficient Answer:** The system was selected to minimize loss on a distribution that structurally encompasses the novel case.
  *   **Handoff:** If the novel case is outside the training distribution (OOD), teleosemantics strictly says "no proper function." You must either accept no content or manually assert a *derived proper function* based on the designer's intent (e.g., "The engineer intended this to map truth"). This is a human judgment call, not a theoretical derivation.

  **Step 4: Content Determination**
  *   **Question:** What effect was the vehicle selected to produce?
  *   **Requirement:** The content is the condition required for the vehicle to successfully perform that effect.
  *   **Constraint:** Content is limited to the selection pressure. If selected for reward, content is "reward-condition," not necessarily "truth."
  *   **Stop Condition:** If the selected effect is purely syntactic (e.g., "match token probability"), the semantic content is null or purely structural.

  **Step 5: Misrepresentation Test**
  *   **Question:** Can the vehicle occur while failing to perform its proper function?
  *   **Sufficient Answer:** Yes. The system produces the vehicle, but the world does not match the condition required for success.
  *   **Stop Condition:** If the vehicle only occurs when successful (infallible), there is no misrepresentation capacity. Stop.

  ---

  ### Theoretical Modifications Required

  To run this on AI, you must explicitly adopt two modifications to standard teleosemantics:

  1.  **Learning History Equivalence:** You must treat gradient descent/RL as analogous to natural selection. The "fitness" is loss minimization or reward maximization.
      *   *Price:* This risks over-intellectualizing optimization. A system minimizing loss isn't necessarily "trying" to represent truth; it's trying to match statistics.
  2.  **Derived Proper Function (Artifact View):** For novel uses, you must treat the AI as an artifact whose function is derived from the creator's intent, not just its own history.
      *   *Price:* This shifts the theory from naturalistic teleosemantics to intentional stance attribution. You are relying on the engineer's goals, not the system's history.

  ---

  ### Case Study 1: LLM Factual Claim (Novel Entity)

  **Case:** An LLM states, "The quazor flies at night." The LLM has never encountered "quazor" (a fictional novel entity) in training, but infers properties from context.

  *   **Step 1 (Vehicle):** Token sequence embedding corresponding to "flies at night." (Artificial substrate).
  *   **Step 2 (History):** Selected via gradient descent to predict next token accurately based on training corpus. (Passes via Modification A).
  *   **Step 3 (Novelty):** The entity "quazor" is OOD. The specific claim was not selected for.
      *   *Application of Modification B:* Was it selected for general inference? Yes, next-token prediction on diverse text.
      *   *Problem:* The selection pressure was *syntactic statistical matching*, not *truth-tracking*.
  *   **Step 4 (Content):** The vehicle was selected to match training distribution probabilities.
      *   *Result:* Content is "This token sequence is statistically probable given the prompt," NOT "The quazor actually flies at night."
  *   **Step 5 (Misrepresentation):** Can it fail? It can produce statistically unlikely tokens, but that is just low probability, not falsehood.
      *   **Outcome:** The procedure denies misrepresentation capacity regarding truth. It classifies the output as a successful performance of its proper function (prediction) even if the claim is false.
      *   **Unwanted Answer:** You likely want to say the LLM is *wrong* about the quazor. Teleosemantics says it is *right* about probability. To get "wrong," you must invoke **Derived Proper Function** (Step 3 Handoff): "The engineer intended this system to track truth." This is a manual override, not a theoretical result.

  ### Case Study 2: Robot Visual Policy (Novel Object)

  **Case:** A robot trained to grasp cups encounters a novel object (a mug with a hidden handle) and classifies it as "graspable," but fails to lift it.

  *   **Step 1 (Vehicle):** Activation vector in the visual classification layer. (Artificial software on artificial hardware).
  *   **Step 2 (History):** Selected via RL to maximize reward (successful lift). (Passes via Modification A).
  *   **Step 3 (Novelty):** The specific object morphology is novel.
      *   *Application of Modification B:* Selected for general "graspability" detection.
  *   **Step 4 (Content):** The vehicle was selected to correlate with successful lifts.
      *   *Result:* Content is "This object affords a successful lift under current policy," not "This is a cup."
  *   **Step 5 (Misrepresentation):** The robot classifies it as graspable (vehicle occurs), but the lift fails (proper function not performed).
      *   **Outcome:** Misrepresentation confirmed. The system represented the object as liftable, but it was not.
      *   **Where it Stops:** If the robot's hardware is a biological brain (e.g., a rat controlling a bot), Step 1 requires you to isolate the software weights from the neural substrate. If you cannot separate the learned policy from the biological plasticity, the procedure stops. You must assume the "software" is functionally isolable from the "brain."

  ### Limitations and Failure Points

  This procedure will frustrate you in two specific areas:

  1.  **The Truth vs. Success Gap:** In Case 1, the procedure forces you to admit that LLMs do not represent truth unless you manually import designer intent (Modification B). Standard teleosemantics binds content to survival/reward, not truth. If you want truth-conditional content for LLMs, you have to break the naturalistic chain and rely on human interpretation.
  2.  **The Substrate Entanglement:** In Case 2, if the robot learns via online plasticity in a neuromorphic chip that mimics biology, Step 1 becomes difficult. If the hardware changes during learning, the "vehicle" is unstable. The procedure assumes a static architecture during the selection phase. If the architecture evolves, the procedure stops and requires a judgment call on individuation.

  **Summary for Your Paper:**
  Use this procedure to demonstrate that standard teleosemantics classifies AI outputs as *successful performances* rather than *truth-apt representations* unless you supplement the theory with artifact-based derived functions. This exposes the cost: to save representation for AI, you sacrifice the naturalistic purity of teleosemantics.
