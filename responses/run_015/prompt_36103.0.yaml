answer: |-
  This is one of the stickiest problems in ethics, and you've hit on exactly why it's so frustrating. The core tension is between **causation** and **justification**.

  On one hand, we want moral worth to track what actually *made* the person move their body (causation). On the other hand, we want it to track why they think the action was *good* (justification). When motives are overdetermined—meaning you have multiple reasons, and any single one of them would have been enough to make you act—these two things come apart. The moral reason is present, but it looks "causally idle" because the selfish reason was ready to do the heavy lifting anyway.

  Let's break down the three main ways people try to test for moral worth in these messy cases, and see why each one trips up on your soup kitchen volunteer.

  ### 1. The "But-For" Test (Necessity)
  This is the strictest test. It asks: *But for* the moral motive, would the action have happened? If the answer is "Yes, she would have volunteered anyway because of the crush," then the moral motive gets no credit. It treats moral worth like a scientific cause: if the effect happens without the cause, the cause wasn't real.

  **The Stress Test:**
  Imagine a variation where the woman is a "Moral Overachiever." She cares deeply about hunger, *but* she also happens to really like the guy. She is doubly motivated.
  *   **The Result:** The But-For Test says she gets *less* moral credit than a grumpy miser who hates everyone but volunteers solely out of duty.
  *   **Why it's weird:** It punishes people for having a rich emotional life. It suggests that to be truly moral, you should ideally have no other reasons to do good. It makes moral worth fragile; if you enjoy doing the right thing, you might accidentally undermine the moral worth of the action. That feels counterintuitive. We usually think liking the good thing is a bonus, not a disqualifier.

  ### 2. The "Manner and Style" Test (Counterfactual Sensitivity)
  This test shifts focus from *whether* she acts to *how* she acts. It asks: If the moral motive were removed, would the *quality* of the action change?
  The idea is that a selfish motive might get her to the building, but only the moral motive ensures she treats the diners with dignity, listens to their stories, and doesn't treat them like props for her charity resume.

  **The Stress Test:**
  Let's introduce the "Status-Obsessed Perfectionist." She is there entirely for the social clout. She knows that to get maximum status, she needs to be photographed looking deeply empathetic. She spends extra time holding hands, she learns names, she cries on cue. Her behavior is indistinguishable from the saint.
  *   **The Result:** The Manner Test struggles here. If we only look at the external behavior and its sensitivity to the situation, she passes. But intuitively, we feel she lacks moral worth because her "attentiveness" is just a calculated performance.
  *   **The Reverse Problem:** Now imagine the "Clumsy Saint." She is there purely out of moral duty. She cares deeply. But she's socially awkward, tired, and accidentally spills soup on a diner. Her *manner* is terrible.
  *   **Why it's weird:** The Manner Test might accidentally penalize the truly moral person who lacks social grace, while rewarding the hypocrite who knows how to perform virtue. It conflates *skill* with *worth*.

  ### 3. The "Conflict and Priority" Test (Endorsement)
  This test looks at hierarchy. It asks: If the motives came into conflict, which one would win? Or, which motive does the agent cite as her *primary justification*?
  If the guy stops showing up, does she stay? If volunteering became socially uncool, would she quit? If she stays even when the selfish rewards vanish, the moral motive is revealed as the "real" driver.

  **The Stress Test:**
  Consider the "Unaware Altruist." She genuinely cares about the hungry, but she's terrible at introspection. She *thinks* she's mostly there for the guy. She tells her friends, "I'm just doing this to hang out with Mark." But deep down, if Mark left, she'd stay because she can't bear to see people go hungry. She just doesn't realize that about herself.
  *   **The Result:** If we rely on her own endorsement or stated priorities, she fails. She disavows the moral motive.
  *   **Why it's weird:** It makes moral worth dependent on self-knowledge. A self-deceived person who does the right thing for the right reason (deep down) gets less credit than a navel-gazer who constantly monitors their own motives. It seems moral worth should depend on the actual structure of your cares, not your ability to write a memoir about them.

  ### The "Degrees of Worth" Solution
  You asked if moral worth could come in degrees. This is a very popular way to ease the pressure. Instead of a light switch (On/Off), think of a dimmer.

  In this view, the soup kitchen volunteer *does* have moral worth, but it's diluted.
  *   **100% Worth:** Doing it solely because it's right.
  *   **50% Worth:** Doing it because it's right *and* for status (where both are doing work).
  *   **5% Worth:** Doing it for status, but the moral reason is there in the background, keeping you from cutting corners.

  **The Pros:** It matches our intuition that the "Moral Overachiever" (duty + love) is better than the "Grumpy Miser" (duty only), but both are better than the "Status Seeker." It allows us to say the overdetermined agent isn't a fraud; she's just impure.

  **The Cons:** It creates a measurement problem. How do you weigh motives? Is one unit of "guilt" equal to one unit of "duty"? Also, some ethical views insist moral worth *must* be all-or-nothing. If the action is tainted by selfishness, it's not a "moral action" in the strict sense, it's just a "legal action" (an action that happens to align with morality). If you adopt the degrees view, you have to accept that you can be partially praiseworthy for an action that was also partially selfish.

  ### The "Causal Channel" Twist
  There is one more nuance worth considering, which is how the motives interact.
  Imagine two versions of your volunteer:
  1.  **Parallel Motives:** The moral motive and the crush motive are separate tracks. Either one triggers the car.
  2.  **Integrated Motives:** The moral motive *shapes* the selfish motive. She likes the guy *because* he is charitable. Her desire for status is a desire for status *as a charitable person*.

  In the second case, even if the action is overdetermined, the moral motive is "in the driver's seat" because it organized the other motives. The selfish motives are riding along, but they are hitched to the moral wagon.

  If you use this test, your volunteer gets moral worth if her desire for status is *dependent* on her doing something actually good. If she would have sought status even by doing something neutral or bad, then the status motive is independent, and the moral worth is lower. If she only wants status *as a helper*, then the moral concept is doing the work of defining her selfishness.

  ### Summary
  The problem you're wrestling with shows that "moral worth" isn't a physical property like weight; it's an interpretive label we put on complex psychological machinery.
  *   **Necessity tests** are too strict (they punish having multiple reasons).
  *   **Manner tests** are too superficial (they reward good acting).
  *   **Priority tests** are too introspective (they punish self-deception).

  Moving to a **degrees** model usually helps the most in real life. It allows us to say: "She gets credit for the moral motive, even if it wasn't the only engine running, provided that the moral motive wasn't completely idle." It acknowledges that we are rarely pure, but we can still be good.
