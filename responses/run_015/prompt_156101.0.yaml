answer: |-
  Here is a decision procedure designed for your constraints: a fifteen-minute consensus window, a tri-partite panel with divergent presuppositions, and a need for broadcast-ready clarity without footnotes.

  ### The Triangulation Protocol (15-Minute Version)

  This procedure is not a checklist to accumulate points, but a filter to identify where the risk of error lies. It treats the three panelists not as voters, but as auditors of specific risk categories.

  **Time Allocation:**
  *   **Minutes 0–4:** Source Genealogy & Evidence Siloing.
  *   **Minutes 4–8:** Criteria Application (with Dissimilarity Warning).
  *   **Minutes 8–12:** The Inversion Test (Rival Models).
  *   **Minutes 12–15:** Verdict & Wording Selection.

  #### Step 1: The Genealogical Audit (Minutes 0–4)
  **Goal:** Distinguish independent tradition streams from dependent texts.
  **Procedure:** Map the item onto tradition streams (e.g., Mark, Q, M, L, Johannine, Pauline, Josephus, Gospel of Thomas), not just canonical books.
  *   **Rule:** If Matthew and Luke agree against Mark, do not count this as "three witnesses." Count it as "Mark + Q (hypothetical)."
  *   **Stop Condition:** If an item appears in only one late text (e.g., *Infancy Gospel of Thomas*) with no earlier trace, verdict is automatically **"Followers Believed"** or **"Contested."** Do not spend time on other criteria.
  *   **Sufficient Answer:** A consensus map of which streams carry the tradition.

  #### Step 2: Evidence Siloing (Minutes 4–5)
  **Goal:** Prevent double-counting (Required Move #3).
  **Procedure:** Assign each piece of evidence to *one* criterion bucket.
  *   **Rule:** If a saying contains Aramaic idioms, you may count it under "Semitic Phenomena" *or* "Palestinian Setting," but not both. If a story is embarrassing, you cannot also count it as "Dissimilar from the Early Church" (since embarrassment implies the Church *didn't* want it).
  *   **Sufficient Answer:** A list of distinct evidentiary pillars, not a pile of overlapping arguments.

  #### Step 3: Criteria Application & The Outlier Trap (Minutes 5–8)
  **Goal:** Apply standard criteria while neutralizing the Dissimilarity bias (Required Move #4).
  **Procedure:** Apply Embarrassment, Coherence, and Multiple Attestation. Then, apply Dissimilarity with a mandatory warning.
  *   **The Outlier Trap Warning:** If an item passes the Dissimilarity criterion (unlike Judaism, unlike Church), the panel must explicitly state: *"This certifies the item as unique, but potentially unrepresentative of Jesus's actual Jewish context."*
  *   **Sufficient Answer:** Acknowledgment that a "unique" Jesus is historically less plausible than a "typical" Jewish Jesus.

  #### Step 4: The Inversion Test (Minutes 8–12)
  **Goal:** Stress-test against rival transmission models (Required Move #2).
  **Procedure:** Run the verdict against two opposing models of oral transmission.
      1.  **Model A (Conservative):** Traditions were preserved conservatively like rabbinic memory.
      2.  **Model B (Skeptical):** Traditions evolved to serve community needs (myth-making).
  *   **Rule:** If the verdict holds under Model A but collapses under Model B (or vice versa), the item must be downgraded to **"Contested."** It only rates **"Jesus Said/Did"** if it remains probable under *both* models.
  *   **Sufficient Answer:** A statement on whether the tradition survives the "Legend Growth" hypothesis.

  #### Step 5: Verdict & Editorial Hand-off (Minutes 12–15)
  **Goal:** Assign wording or flag for producer decision.
  **Procedure:**
  *   **Consensus:** All three panelists agree on one of the three wordings.
  *   **Irreducible Judgment:** If the Social Historian says "Plausible in Galilee" but the Skeptic says "Unverifiable," and the Conservative says "Historical," this is a **Hand-off.**
  *   **Hand-off Rule:** The producer (you) decides based on narrative necessity, *but* the on-screen wording must default to the more cautious option ("Followers Believed" or "Contested").
  *   **Stop Point:** If the Genealogical Audit shows only one late source, stop at Step 1.

  ---

  ### Application to Three Items

  Here is the protocol run on your three specific cases.

  #### Item 1: The Baptism of Jesus by John
  *   **Step 1 (Genealogy):** Mark (narrative), Q (implied in Matt/Luke divergence), John (Gospel—independent tradition), Josephus (independent witness to John's movement). **Result:** Strong multiple streams.
  *   **Step 2 (Siloing):** Embarrassment is the primary pillar. Do not also count "Coherence with John's movement."
  *   **Step 3 (Outlier Trap):** Dissimilarity is low (fits John's movement), which is actually a *positive* for historical plausibility here. No warning flag needed.
  *   **Step 4 (Inversion Test):**
      *   *Model A (Conservative):* Happened as described.
      *   *Model B (Skeptical):* Would the Church invent a story where the Son of God submits to a subordinate for repentance? Unlikely.
      *   **Result:** Survives both models.
  *   **Step 5 (Verdict):** **"Jesus Said/Did."**
      *   *Panel Consensus:* High. Even the Skeptic accepts this due to the "Criterion of Embarrassment."
      *   *Wording:* "Jesus was baptized by John."

  #### Item 2: The Divorce Saying (with exceptions)
  *   **Step 1 (Genealogy):** Mark (no exception), Matthew (exception for *porneia*), Paul (1 Cor 7, independent tradition).
      *   **Result:** Multiple streams, but divergent details.
  *   **Step 2 (Siloing):** "Semitic Phenomena" (debate style) cannot be counted separately from "Palestinian Setting" (Jewish law context). Choose one.
  *   **Step 3 (Outlier Trap):** The strict prohibition is dissimilar to Hillel (easy divorce) but similar to Shammai. The *exception* in Matthew looks like Church adaptation to Gentile law.
      *   *Warning:* If we accept the exception as Jesus's words, he looks more like the Early Church (accommodating). If we reject it, he looks stricter.
  *   **Step 4 (Inversion Test):**
      *   *Model A:* Jesus gave a ruling; communities adapted it.
      *   *Model B:* The Church created the saying and debated the exceptions later.
      *   **Result:** The *core prohibition* survives Model B (it's hard to explain why the Church would invent a strict rule they immediately softened). The *exception* does not.
  *   **Step 5 (Verdict):** **"Contested"** (regarding the specific wording) or **"Jesus Said/Did"** (regarding the core prohibition only).
      *   *Recommendation:* To satisfy the 15-minute consensus, split the difference.
      *   *Wording:* "Jesus taught against divorce." (Avoids the exception debate entirely).

  #### Item 3: The Empty Tomb
  *   **Step 1 (Genealogy):** Mark (earliest narrative), Matthew/Luke/John (depend on Mark or Markan trajectory), Paul (1 Cor 15—lists appearances, *no mention of tomb*).
      *   **Result:** Weak genealogy. All narrativized accounts flow from one stream (Mark). Paul's silence is a significant genealogical gap.
  *   **Step 2 (Siloing):** "Women Witnesses" is Embarrassment. Do not also count it as "Dissimilarity from Church" (since the Church *did* preserve the story).
  *   **Step 3 (Outlier Trap):** **WARNING FLAG.** A bodily resurrection before the general resurrection is dissimilar to 1st-century Jewish hope (which was usually eschatological/general). If we accept this based on dissimilarity, we certify Jesus as an outlier to his own Judaism.
  *   **Step 4 (Inversion Test):**
      *   *Model A (Conservative):* Tomb was empty; visions followed.
      *   *Model B (Skeptical):* Visions occurred (psychological/spiritual); Tomb story developed later to physicalize the claim.
      *   **Result:** The verdict *flips*. Under Model B, the empty tomb is theology, not history. Under the Protocol Rule, if the verdict flips, it must be downgraded.
  *   **Step 5 (Verdict):** **"Followers Believed."**
      *   *Panel Consensus:* The Conservative can accept "Followers Believed" (as it doesn't deny the resurrection, only the historical verification of the tomb). The Skeptic requires it (cannot verify miracle). The Historian accepts it (reflects the movement's proclamation).
      *   *Wording:* "The earliest followers proclaimed his tomb was empty."
      *   *Note on Narration:* This allows you to tell the story ("Mary went to the tomb...") without the on-screen text claiming historical fact ("Jesus rose..."). It protects the script while satisfying the panel.

  ---

  ### Limitations: What This Procedure Cannot Do

  You asked for an honest statement of the procedure's limits, specifically regarding "Who Jesus was" vs. "What was attributed to him."

  **1. The Access Problem:**
  This procedure establishes the *history of the tradition*, not necessarily the *history of the event*. Even if an item passes the "Jesus Said/Did" test (like the Baptism), it confirms that the tradition is early and embarrassing, not that the event happened exactly as described. We are analyzing the *memory* of Jesus, not Jesus himself.

  **2. The Twenty-Year Gap:**
  The earliest sources (Paul) begin roughly 20 years after the death of Jesus. The narrative Gospels are 40–70 years after. No set of criteria can bridge that gap with forensic certainty. We can determine what was being attributed to him within twenty years of his death (Paul's data), but the "Galilean Ministry" is accessed through the lens of the post-Easter community.

  **3. The Identity Trap:**
  Historical criteria can isolate a "plausible prophet," but they cannot reconstruct a personality. They can tell us what Jesus likely *did* (baptized, debated Torah), but not *who he thought he was*. The "Son of Man" sayings, for example, fail the Genealogical Audit (mostly Q/John) and trigger the Outlier Trap (dissimilar to Jewish usage). The procedure will force you to label them "Contested" or "Followers Believed," leaving the question of Jesus's self-understanding historically silent.

  **Conclusion for the Series:**
  This protocol will not give you the "Real Jesus." It will give you the "Consensus Jesus"—the figure that a Conservative, a Skeptic, and a Historian can agree is the *most probable explanation* for the movement that emerged. For your narration, this means speaking in the voice of the tradition ("Jesus taught," "Followers reported") rather than the voice of omniscient history ("Jesus knew," "Jesus did"). This distinction is not a weakness; it is the only way to keep your advisory panel signed on and your history honest.
