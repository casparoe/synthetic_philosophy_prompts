answer: |-
  **Mark: 9/20**

  **Justification:**
  The answer is clearly written and engages seriously with the hypothetical scenario, but it rests on a fundamental misreading of Wolf's central distinction in Part (a). Because the student conflates Wolf's objection with the standard over-demandingness objection, their application of Wolf's argument in Part (b) is unsound, even if internally consistent. They earn marks for structure and for attempting the objection/response component, but lose the majority of Part (a) and significant marks in Part (b) for misapplying the philosopher's actual view.

  **Point-by-Point Comments:**

  **Part (a): Reconstruction and Distinction (Score: 2/8)**

  *   **"Her complaint is essentially a demandingness complaint." / "Wolf's worry is, at bottom, the same worry as the over-demandingness objection..."**
      *   **Substantive Mistake:** This is the critical error in the essay. Wolf explicitly distinguishes her view from the over-demandingness objection. The over-demandingness objection claims a moral *theory* is false because it requires too much. Wolf claims that even if morality *does not require* sainthood (i.e., even if sainthood is supererogatory), we still should not view it as an *ideal*. She is objecting to the attractiveness of the life, not merely the burden of the duty.
      *   **Impact:** Because the prompt specifically asked to distinguish these, and the student explicitly conflates them ("Both objections are complaints about how much morality is allowed to ask"), they cannot score highly on this section.
  *   **"Someone who actually lived up to it would... end up exhausted and probably miserable."**
      *   **Loose Phrasing:** Wolf's concern is less about misery/exhaustion and more about the *content* of the life becoming one-dimensional. She worries the saint lacks non-moral virtues (humor, aesthetic appreciation, specific passions) that make a life rich, not just that the saint is tired.
  *   **"Morality's demands have to be curtailed..."**
      *   **Misattribution:** Wolf argues that non-moral reasons can permissibly override moral reasons, not necessarily that morality's demands themselves change. This is a subtle but important distinction in her meta-ethical setup.
  *   **"...best read as an extension of Williams's integrity objection..."**
      *   **Defensible but Incomplete:** This is a sophisticated connection, but to earn the marks, the student needed to explain why Wolf's view *diverges* from Williams (who is usually associated with the demandingness/objection to utilitarianism), rather than using it to prove they are the same worry.

  **Part (b): Divided Sainthood (Score: 7/12)**

  *   **"Divided sainthood does answer the worry."**
      *   **Reasoning Flaw:** This conclusion follows logically from their Part (a) error. If Wolf is only worried about *coerced demand*, then voluntary assumption solves it. However, if Wolf is worried that the life of a saint is *humanly unattractive* (lacking in non-moral excellence), then "dividing" the role doesn't solve the problem; it just concentrates the unattractive life in one person. The student fails to apply Wolf's actual criterion (the quality of the individual life) to the saint in this scenario.
  *   **"The value Wolf is worried about losing... is preserved at the level of the community..."**
      *   **Creative Move:** This is an interesting argument (shifting from individual to collective value), but it requires defense. Wolf's paper is titled "Moral Saints" and focuses on "a human life" (singular). To earn full marks here, the student would need to justify why Wolf's individualist concern can be satisfied by a collective distribution of virtues.
  *   **"Wolf's argument... has nothing to say about a case in which the demands are freely taken on."**
      *   **Substantive Mistake:** Wolf's argument applies precisely to the *ideal*. Even if I freely choose to be a saint, Wolf argues I am choosing a less rich life. The student treats Wolf's argument as a shield against coercion, rather than a critique of a value system.
  *   **"There is a residual worry about the saint herself... But that is her own choice..."**
      *   **Objection Handling:** The student identifies an objection but dismisses it too quickly using the "consent" defense. A stronger engagement would have considered whether consent validates a life that Wolf deems objectively less valuable or interesting. To earn the full 5 marks for verdict/objection, they needed to grapple with why Wolf might still object to the *idealization* of this person, regardless of consent.

  **Interpretive Caveat:**

  My grading assumes the standard reading of Wolf, where she distinguishes her "Ideal" objection from the "Obligation/Demandingness" objection. Wolf writes: *"The objection I am raising is not that the moral saint is too demanding... but that the moral saint is not a desirable ideal."*

  If your seminar adopted a heterodox reading where Wolf is interpreted as making a variant of the demandingness argument (e.g., that the *social pressure* to be a saint is the demand), then the student's answer is much stronger, and the mark should be adjusted upward (likely to the 14–16 range). However, on the text's face, the student misses the specific philosophical contribution Wolf is making in the 1982 paper. You may want to check if your lecture notes or seminar discussion framed Wolf primarily through the lens of demandingness, as that would explain why the student felt confident making this conflation.
