answer: |-
  **JOINT CONCEPTUAL FRAMEWORK ON PREFERENCE AUTHENTICATION AND SOCIAL CORRELATION**

  **Parties:** The Correctionist Working Group & The Situated Knowledge Consortium
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Boundary Between Authentic Preference and Hidden Bias

  ### PREAMBLE

  This document represents a provisional consensus reached during an adversarial collaboration between two philosophical camps historically prone to talking past one another. The **Correctionists** prioritize the identification and removal of social distortions to achieve impartial moral reasoning. The **Situatedists** prioritize the preservation of experiential authority and warn against the epistemic violence of forced neutrality.

  The purpose of this text is not to resolve the substantive moral disagreement, but to isolate the precise structural and meta-ethical points of divergence. By separating verbal confusion from genuine incompatibility, we aim to facilitate more productive future discourse.

  ---

  ### I. SHARED PREMISES (CONSENSUS STATEMENT)

  Both parties endorse the following claims. These statements are phrased to ensure neither camp feels their core methodology is misrepresented or pre-judged.

  1.  **On Introspective Opacity:** Both camps agree that moral agents possess limited introspective access to the causal origins of their own preferences. An agent cannot reliably distinguish, through reflection alone, whether a preference arises from rational conviction, social conditioning, or biological impulse. Therefore, external criteria for evaluating preferences are necessary.
  2.  **On Counterfactual Stability:** Both camps agree that a robust moral preference should demonstrate a degree of stability across counterfactual scenarios. If a preference vanishes entirely when irrelevant circumstantial details are altered, it warrants scrutiny. However, the parties disagree on which circumstantial details count as "irrelevant" (see Section III, Crux 1).
  3.  **On Revision vs. Abandonment:** Both camps distinguish between *revising* a moral belief (updating a factual claim or instrumental strategy while retaining the core value) and *abandoning* a value (rejecting a core commitment). Both agree that conflating these two processes leads to diagnostic errors: Correctionists may accuse Situatedists of refusing to revise facts, while Situatedists may accuse Correctionists of demanding the abandonment of constitutive values.
  4.  **On the Existence of Distortion:** Both camps acknowledge that social structures can produce moral distortions. Correctionists emphasize distortions that mimic impartiality (false universals); Situatedists emphasize distortions that mimic local knowledge (false traditions). Both agree that not all correlations between social position and moral preference are benign.

  ---

  ### II. POINTS OF DIVERGENCE

  The following table isolates the specific conditions under which the two camps classify a preference differently. It specifies the "Burden of Proof" and the "Condition for Concession" for each side.

  | Feature of Disagreement | Correctionist Position | Situatedist Position | Condition for Concession |
  | :--- | :--- | :--- | :--- |
  | **1. The Default Status of Correlation** | A strong correlation between a preference and the agent's social advantage/group membership creates a **presumptive case for bias**. The preference is "guilty until proven innocent." | A strong correlation between a preference and the agent's social position is **neutral data**. It indicates situatedness, not necessarily distortion. | **Correctionist:** If a correlated preference consistently yields superior outcomes for *all* affected parties (including the disadvantaged) under long-term observation.<br>**Situatedist:** If the correlated preference relies on empirically falsifiable claims about the world that, when corrected, cause the preference to collapse. |
  | **2. The Procedural Filter** | Sound moral reasoning requires a **procedural filter** (e.g., idealized reflection, blinding social markers) to strip correlations before evaluation. Neutrality is a methodological requirement. | Sound moral reasoning requires **contextual embedding**. Applying a uniform filter risks removing morally relevant information (situated knowledge), creating a "false neutrality" that favors dominant norms. | **Correctionist:** If the procedural filter systematically excludes solutions that are demonstrably more just according to the filter's own stated goals.<br>**Situatedist:** If the refusal to filter leads to incommensurable moral frameworks that make cooperation or conflict resolution impossible. |
  | **3. The Risk Profile** | The primary error to avoid is **False Negatives** (failing to identify a bias). It is better to mistakenly flag a genuine preference as biased than to let a bias operate unchecked. | The primary error to avoid is **False Positives** (mistakenly identifying a situated value as a bias). It is better to tolerate some bias than to erase legitimate experiential authority. | **Correctionist:** If the rate of False Positives becomes high enough to alienate the very agents the theory aims to help.<br>**Situatedist:** If the tolerance for "situated knowledge" allows for the perpetuation of harms that the agents themselves would reject under safer conditions. |

  ---

  ### III. STRATEGIC CRUXES

  We have identified two sub-questions ("Cruxes") where resolution would significantly shift the position of at least one camp. For each crux, we propose a concrete case study. We record in advance what each camp predicts should the crux be resolved in their favor.

  #### Crux 1: The Non-Circularity Problem
  **The Question:** Is it possible to identify a bias using a criterion that does not itself depend on a contested moral preference? (i.e., Can we define "bias" without already assuming the conclusion of the moral argument?)

  **The Case Study: Obligations to Kin vs. Distant Strangers**
  *Scenario:* A resource allocator must choose between saving a group of five distant strangers or one close family member. In Culture A, 90% of agents choose the family member. In Culture B, 90% choose the strangers. The preference correlates strongly with cultural upbringing.

  *   **Correctionist Prediction:** If the Non-Circularity Problem is solvable, we will find a metric (e.g., aggregate welfare, equal moral worth) that identifies the Kin-Preference as a bias *regardless* of Culture A's internal justification. The correlation with upbringing is evidence of the bias's causal power, not its legitimacy.
  *   **Situatedist Prediction:** If the Non-Circularity Problem is insoluble (as we suspect), any metric used to label the Kin-Preference as "bias" will be revealed as merely the moral preference of Culture B universalized. The "bias" is actually a legitimate variation in moral ontology regarding the scope of obligation.

  #### Crux 2: The "Moral Terroir" Distinction
  **The Question:** Can the phenomenon of "moral terroir" (ethical sensitivities cultivated by local ecological/social conditions that carry unique information) be empirically or phenomenologically distinguished from mere parochialism (limitations imposed by local ignorance)?

  **The Case Study: Ecological Interdependence in Resource-Scarce Regions**
  *Scenario:* A community in a resource-scarce region maintains a taboo against harvesting a specific high-calorie crop during drought years. To outside observers (and economic models), this looks like irrational parochialism that increases starvation risk. The community claims the crop's root system prevents soil collapse, a fact not immediately visible to outsiders.

  *   **Correctionist Prediction:** If "Moral Terroir" is distinct from parochialism, there must be a way to translate the taboo into universalizable empirical claims (e.g., "soil stability") without losing moral force. If the taboo cannot be translated into general principles accessible to outsiders, it is parochialism, not terroir.
  *   **Situatedist Prediction:** If "Moral Terroir" is real, the moral force *resides* in the untranslatable local practice. The moment the taboo is translated into a universal principle, the specific ecological attunement is lost. If the Correctionist demand for translation is enforced, the community will adopt the "rational" universal rule, deplete the soil, and collapse—proving the "parochialism" was actually superior knowledge.

  ---

  ### IV. NEXT STEPS

  Both parties agree to treat the cases in Section III as live experiments rather than rhetorical devices. We commit to the following:

  1.  **Charitable Reconstruction:** When critiquing the opposing view, each side must formulate the critique using the "Shared Premises" from Section I.
  2.  **Empirical Tracking:** In the Ecological Interdependence case, both sides will track not only the material outcome (soil stability) but the *process* of decision-making (whether the taboo was maintained through local authority or external imposition).
  3.  **No Premature Closure:** Neither side will claim victory if a case yields mixed results. Ambiguity in these cases is data, not failure.

  **Signed,**

  *Lead Representative, Correctionist Working Group*
  *Lead Representative, Situated Knowledge Consortium*
