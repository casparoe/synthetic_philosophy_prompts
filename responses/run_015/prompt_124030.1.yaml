answer: |-
  Sir,

  I receive your objection with the utmost seriousness, for it touches upon the very ground upon which I have sought to rebuild the sciences. You know well that in my *Meditations*, I sought to strip away all opinions that could be doubted, even slightly, to find if there remained anything absolutely certain. I found that while I could doubt the existence of the sky, the earth, and even my own body, I could not doubt that I was doubting. And since doubting is a form of thinking, it seemed evident to me that I, who think, must exist.

  You press me on the move from *cogitatio* (thinking) to *ego* (I). You present a case—drawn from the afflictions of the human condition—wherein a man reports that thoughts occur within him, yet he insists they are not *his*. You ask if I have not smuggled the "I" into the premise, relying on the structure of language rather than the light of reason.

  Let me first defend the integrity of my intuition. When I said, "I think, therefore I am," I did not intend this as a syllogism wherein one must first know the major premise "Everything that thinks exists." Rather, it was a simple intuition of the mind. When one doubts, one is immediately aware of the doubt. It is not that I perceive a floating thought and then infer a thinker; rather, the awareness of the thought and the awareness of the self are, in that instant, one and the same perception. To say "there is thinking" is, in the very utterance, to posit a locus of that awareness. Even in the case you describe, where a man claims, "This thought is not mine," he must still be aware of the thought to deny it. The denial itself is a thought. And who denies? If he says "I deny this is mine," he affirms the very "I" he seeks to disown in that specific instance. The consciousness of the alien thought still resides within *his* consciousness. Thus, it seems to me that the thinking cannot be severed from the thinker without contradiction, for a mode cannot exist without a substance in which to inhere.

  However, sir, I am a man who has pledged himself to the truth, even when it cuts against my own deepest hopes. You ask for intellectual honesty, and the rigor of your doubt compels me to pause.

  I have maintained that the "I" is known clearly and distinctly as a *thinking thing* (*res cogitans*), distinct from the body. But your objection reveals a fissure in this clarity. If it is possible for the *experience* of thinking to occur without the *experience* of ownership—as your report of this "thought insertion" suggests—then perhaps my certainty extends only to the *presence of the thought*, and not to the *nature of the subject*.

  I must concede this: If the sense of "mineness" is not intrinsic to every instance of thought, but is rather a quality that can be absent while the thought remains, then my inference that a unified, owning *substance* is immediately given in the *cogito* is not as indubitable as I have claimed. I have assumed that because a mode (thinking) exists, a substance (the Soul) must exist in the specific way I conceive it—as a unified, persistent owner. But if thought can appear as "ownerless" to the very consciousness experiencing it, then perhaps I have been deceived by the prejudices of language, which demands a subject for every verb. I have moved from "thinking is occurring" to "I exist" too swiftly, assuming that the "I" is a *thing* rather than merely the *boundary* of the experience.

  This is a heavy concession. For if the "I" is not immediately revealed as a substance distinct from its thoughts, but is rather a construction added to the flow of cognition, then my proof of the soul's immortality—which relies on its being a distinct substance—is severely weakened. You have shown me that the *cogito* guarantees the existence of *thought*, but perhaps not the existence of the *Thinker* as a distinct entity in the way I had hoped. The shadow of the body, or perhaps some unknown disposition of the brain, may intrude even here, separating the act from the agent in appearance, if not in metaphysical reality.

  Nevertheless, I cannot abandon the central insight entirely. Even if the "I" is not fully grasped in the first instant, *something* exists. Deception cannot occur without a thing that is deceived. Even if the ownership is disputed, the *presence* of the experience is undeniable. There is *something* here, even if its nature as a unified "I" is now clouded by your objection. I must retreat slightly from the claim that I know the *nature* of this "I" perfectly in the Second Meditation, though I still hold that *existence* itself is confirmed.

  You have struck a blow against the certainty of the *res cogitans* as I described it. I shall need to reflect further on whether God's veracity can secure the unity of the self when the inner sense itself reports division. I thank you for this trial; for in philosophy, he who exposes the weakness of our foundations serves the truth better than he who merely defends them.
