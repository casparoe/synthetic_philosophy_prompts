      *   *Defeater 2: The Normative Force Problem.* Rules (grammar) are arbitrary/conventional. Hinges seem to have *epistemic* pressure (e.g., "I have two hands"). If it's just a rule, why does violating it feel like madness/error rather than just playing a different game?
      *   *Defeater 3: Cognitive Science/Developmental Psychology.* If children learn hinges as empirical generalizations first (inductive) and only later treat them as certain, this suggests an epistemic origin, not a purely grammatical one. (User suggested this).
