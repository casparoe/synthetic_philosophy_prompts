      *   *Rank 3: Formal Models.* Showing a system *can* work without hinges doesn't prove humans *do*. Less fatal to a descriptive reading of Wittgenstein.
      *   *Rank 4: Developmental Psych.* Empirical data is tricky to map onto transcendental arguments. A Wittgensteinian might dismiss this as category confusion.

  5.  **Addressing the "Insulation/Unfalsifiability" Question:**

      *   The performative reading is highly insulated. It treats challenges as "internal" to a specific language game. To falsify it, you need to show it fails on its own terms (e.g., internal inconsistency regarding hinge change).
      *   Is it unfalsifiable? Almost. It functions as a transcendental argument.

  6.  **Addressing the "Irrationality" Question:**

      *   If hinges are rules, violating them isn't "irrational" (epistemic failure); it's "nonsensical" (grammatical failure).
