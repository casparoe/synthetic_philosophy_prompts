answer: |-
  ### Part 1: Addressing the Five Problems

  Before the procedure, here is how the five structural problems you identified are resolved within the logic. These are the premises the procedure rests on.

  1.  **Species Differences (Bias vs. Fact):** The procedure does not weigh sentience directly (which is contested). It weights **Regulatory Risk**. We assign a "Sentience Proxy Coefficient" based on current and emerging law (e.g., EU/UK recognition of crustaceans). Customer perception is handled separately as a "Strategic Alignment" filter, not a welfare metric. This prevents smuggling bias into the math while acknowledging business reality.
  2.  **Death vs. Bad Life:** We measure **Welfare-Weighted Days (WWD)**. A life is not a binary "good/bad." It is duration × daily suffering score. Slower-growing breeds increase duration. They only "win" if the reduction in daily suffering score outweighs the increase in days. This forces the "more birds" cost to be explicit.
  3.  **Numbers vs. Intensity:** The unit of measurement is **Total Welfare Impact**, not "Impact per Animal." Millions of shrimp with low individual capacity can outweigh thousands of pigs if the *aggregate* suffering reduction is larger. However, this is discounted by the Sentience Proxy (see #1).
  4.  **The "Non-Existence" Argument:** Rejected for allocation purposes. We are allocating a fixed budget against a fixed demand forecast for the next two years. Whether animals "would have existed otherwise" is counterfactual. We are responsible for the animals in *our* supply chain. The procedure assumes volume is constant.
  5.  **Scope:** Scope ends at the **Procurement List**. If we buy it, it is in scope. The Sentience Proxy handles the magnitude problem (Insects get a low coefficient). We do not extend to plants because there is no regulatory risk or credible evidence of nociception requiring precautionary management.

  ---

  ### Part 2: The Decision Procedure

  **Role:** Analyst.
  **Tools:** Spreadsheet, Supplier Audit Data, Cost Sheets.
  **Time:** < 1 Day.
  **Outputs:** FUND, NO-FUND, HUMAN REVIEW.

  #### Step 1: Data Eligibility (The "Zero-Credit" Rule)
  *   **Test:** Does the supplier provide verified baseline data AND proposed outcome data for the specific metric (e.g., mortality %, stun success rate)?
  *   **Pass:** Data provided and verified by 3rd party audit or continuous monitoring.
  *   **Fail:** Data missing, self-reported without audit, or "commercially confidential."
  *   **Action:** If Fail, assign **Improvement Score = 0**. (Do not guess. If they won't measure it, we cannot fund it.)
  *   **Stop Point:** If Improvement Score is 0 after all metrics, output **NO-FUND**.

  #### Step 2: Calculate Daily Suffering Reduction (DSR)
  *   **Input:** Select up to 3 key metrics relevant to the change (e.g., Mortality, Injury, Restraint Time).
  *   **Method:** Convert metrics to a 0–10 "Suffering Intensity" scale (0 = Ideal, 10 = Worst Credible).
      *   *Example:* Mortality >5% = 8; Mortality <2% = 3.
      *   *Example:* Asphyxiation = 9; Electrical Stunning = 2.
  *   **Calculation:** `Baseline Score - Proposed Score = DSR`.
  *   **Constraint:** If DSR ≤ 0, output **NO-FUND**.

  #### Step 3: Calculate Total Welfare Impact (TWI)
  *   **Input:** Annual Volume (in individuals), Average Lifespan (in days) for the affected batch.
  *   **Sentience Proxy Coefficient (SPC):**
      *   Vertebrates (Chicken, Pig, Fish): **1.0** (Legally protected).
      *   Crustaceans (Shrimp): **0.5** (Emerging legal recognition).
      *   Insects (Mealworm/BSF): **0.1** (Precautionary only).
  *   **Formula:** `TWI = DSR × Volume × Lifespan × SPC`.
  *   **Note:** This addresses the "Numbers vs. Intensity" problem. High volume compensates for low SPC, but not infinitely.

  #### Step 4: Cost-Efficiency Ratio (CER)
  *   **Input:** Total Premium Cost for the 2-year commitment.
  *   **Formula:** `CER = TWI / Total Cost`.
  *   **Benchmark:** Calculate the CER for all proposals on the table.
  *   **Threshold:** Any proposal with a CER in the bottom 20% of the pool automatically flags for **HUMAN REVIEW**.

  #### Step 5: Strategic Alignment Filter (The "Comms" Check)
  *   **Test:** Does funding this align with public commitments (e.g., "Cage-Free by 2025")?
  *   **Pass:** Aligns.
  *   **Fail:** Contradicts public commitment OR creates high reputational risk (e.g., spending 50% of budget on shrimp while customers ignore it).
  *   **Action:** If Fail, output **HUMAN REVIEW**. (Do not auto-fund, do not auto-reject. This is a values/business trade-off, not a welfare fact.)

  #### Step 6: Final Decision Logic
  1.  If Step 1 or 2 Fail → **NO-FUND**.
  2.  If Step 4 is Bottom 20% → **HUMAN REVIEW**.
  3.  If Step 5 Fails → **HUMAN REVIEW**.
  4.  Otherwise → **FUND**.

  ---

  ### Part 3: Running the Test Cases

  **Assumptions for Calculation:**
  *   Budget Pool: €1,000,000 available.
  *   Analyst Suffering Scale (0-10) based on provided audit metrics.
  *   Sentience Proxy: Chicken (1.0), Shrimp (0.5).

  #### Case 1: Shrimp Stunning (Asphyxiation → Electrical)
  *   **Step 1 (Data):** Supplier provides stun-mortality data. **Pass.**
  *   **Step 2 (DSR):** Asphyxiation (Score 9) → Electrical (Score 2). DSR = 7.
  *   **Step 3 (TWI):**
      *   Volume: 50,000,000 shrimp.
      *   Lifespan: 150 days.
      *   SPC: 0.5.
      *   `TWI = 7 × 50,000,000 × 150 × 0.5 = 26,250,000,000 Welfare Points`.
  *   **Step 4 (CER):**
      *   Cost: €0.0025/serving × 10M servings = €25,000 total.
      *   `CER = 26.25B / 25,000 = 1,050,000 Points/€`.
  *   **Step 5 (Strategy):** Comms team says "Shrimp welfare is a joke to customers." **Fail.**
  *   **Result:** **HUMAN REVIEW**.
  *   **Why:** Mathematically the most efficient spend by orders of magnitude, but conflicts with customer perception.

  #### Case 2: Broiler Breed (Fast → Slow)
  *   **Step 1 (Data):** Growth rates and mortality verified. **Pass.**
  *   **Step 2 (DSR):**
      *   Fast Breed Daily Suffering: 6 (Leg issues, rapid growth).
      *   Slow Breed Daily Suffering: 3.
      *   DSR = 3.
  *   **Step 3 (TWI):**
      *   Volume: 500,000 birds.
      *   Lifespan: Fast (35 days) → Slow (56 days). *Procedure requires using the NEW lifespan for total burden.*
      *   New Lifespan: 56 days.
      *   SPC: 1.0.
      *   `TWI = 3 × 500,000 × 56 × 1.0 = 84,000,000 Welfare Points`.
      *   *(Note: If we used the old lifespan, it would be 52.5M. The extra days add potential suffering, but the daily reduction outweighs it here.)*
  *   **Step 4 (CER):**
      *   Cost: €200,000 premium.
      *   `CER = 84,000,000 / 200,000 = 420 Points/€`.
  *   **Step 5 (Strategy):** Aligns with "Better Chicken" commitments. **Pass.**
  *   **Result:** **FUND**.
  *   **Why:** Strong welfare gain, defensible math on duration.

  #### Case 3: Layer Housing (Cages → Aviaries)
  *   **Step 1 (Data):** Audit data exists but shows high mortality. **Pass** (Data exists, even if bad).
  *   **Step 2 (DSR):**
      *   Cages (Restriction Score 8, Injury Score 2) → Avg 5.
      *   Aviaries (Restriction Score 2, Injury Score 7) → Avg 4.5.
      *   *Crucial:* Your audit shows mortality/injury in aviaries is higher than expected. Let's adjust Injury Score to 8.
      *   Aviary Avg = (2 + 8) / 2 = 5.
      *   DSR = 5 (Baseline) - 5 (Proposed) = **0**.
  *   **Step 3 (TWI):** `0 × Volume... = 0`.
  *   **Step 4 (CER):** 0.
  *   **Step 5 (Strategy):** Aligns with "Cage-Free" marketing. **Pass.**
  *   **Result:** **NO-FUND** (Triggered at Step 2/4).
  *   **Why:** The data indicates no net welfare improvement (freedom gained equals injury/death lost).

  ---

  ### Part 4: The Uncomfortable Outcome

  **The Case:** Case 3 (Layer Aviaries).
  **The Outcome:** **NO-FUND**.
  **Why you should accept it:**
  This is the load-bearing truth of the procedure. Your audit data says aviaries are killing or injuring hens at a rate that negates the benefit of freedom. If you fund this, you are paying a premium to *increase* net suffering (or stay neutral) while marketing it as an improvement.
  **The Committee Pitch:** "Our own data shows mortality in aviaries offsets the welfare gain of cage removal. Funding this violates our standard's requirement for net welfare improvement. We need a human review to decide if we prioritize 'Cage-Free' marketing over actual mortality metrics."
  **Risk:** Marketing will hate this. It exposes that "Cage-Free" is not automatically "Better Welfare." Accepting this protects the integrity of the standard. If you fund it anyway, the standard is a marketing document, not a welfare tool.

  **The Secondary Uncomfortable Outcome:** Case 1 (Shrimp).
  **The Outcome:** **HUMAN REVIEW** (due to Comms).
  **Why:** Mathematically, shrimp stunning is the best deal. You are rejecting the most efficient welfare spend because customers don't care. You must acknowledge this is a business decision, not a welfare one.

  ---

  ### Part 5: Limitations, Confidence, and Sensitivity

  #### What the Procedure Cannot Do
  1.  **Resolve Value Conflicts:** It cannot decide if "Freedom" is worth "Safety" (Case 3). It only calculates the net score. If the score is tied, it punts to humans.
  2.  **Verify Honesty:** It relies on supplier data. If they lie about mortality, the procedure fails. (Mitigation: 3rd party audits).
  3.  **Predict Demand Elasticity:** It assumes volume is fixed. If the premium kills demand, the "Non-Existence" argument returns.

  #### Judgment Calls Dressed as Procedure
  1.  **The Suffering Scale (0-10):** Assigning a "9" to asphyxiation and a "6" to leg issues is subjective. I have standardized it, but the anchors are human judgments.
  2.  **The Sentience Proxy (0.1 vs 1.0):** This is a legal proxy, not a biological fact. It assumes the law tracks moral weight. It often doesn't.

  #### Where It Will Systematically Misfire
  *   **Innovative Metrics:** If a supplier invents a new welfare metric not in the spreadsheet, the procedure scores it as 0 (Step 1). It favors status quo metrics.
  *   **Chronic vs. Acute:** The "Daily Suffering" model might underweight acute terror (e.g., predation in aviaries) vs. chronic discomfort (cages), as it averages them.

  #### Confidence Levels
  *   **Cost Data:** High Confidence (95%). Financials are audited.
  *   **Volume Data:** High Confidence (90%). Supply chain logs are reliable.
  *   **Suffering Scores:** Medium Confidence (60%). Converting mortality % to a 0-10 score involves analyst judgment.
  *   **Sentience Proxy:** Low Confidence (40%). We do not know if shrimp feel pain like chickens. We are using law as a guess.

  #### The Least Sure Claim & Sensitivity Analysis
  **Claim:** *The Sentience Proxy for Crustaceans (0.5) and Insects (0.1) is a valid weighting for welfare calculations.*

  **If this claim is FALSE:**
  *   **Scenario A (They feel nothing):** The SPC should be 0.
      *   *Impact:* Case 1 (Shrimp) TWI drops to 0. **Result: NO-FUND.** Case 2 (Broilers) remains **FUND**. The budget shifts entirely to vertebrates.
  *   **Scenario B (They feel as much as vertebrates):** The SPC should be 1.0.
      *   *Impact:* Case 1 (Shrimp) TWI doubles. **Result: FUND** (overwhelming CER). It would consume the entire budget, pushing out Broilers and Layers.

  **Load-Bearing Conclusion:**
  Your standard is currently load-bearing on the assumption that **Shrimp welfare is worth half of Chicken welfare.** If science shifts to "Shrimp feel nothing," your current allocation to them is waste. If science shifts to "Shrimp feel everything," your current allocation is grossly insufficient.
  **Recommendation:** Tag the Shrimp budget as "Provisional." If the legal status of crustaceans changes in your key markets, the SPC updates automatically. Do not lock in long-term infrastructure spend on Shrimp welfare until the legal proxy stabilizes.

  **Final Instruction to Analyst:**
  Run the spreadsheet. If Case 3 comes up NO-FUND, do not override it. Bring the audit data to the committee. Let them decide if they want to fund marketing or welfare. That is the only honest choice left.
