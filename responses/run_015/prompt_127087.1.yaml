      *   **Task:** Create a *decision procedure* (ordered set of tests), not an essay. Must yield: Fund, Don't Fund, or Human Review.
      *   **Constraints:**
          1.  Runnable in a day by an analyst (spreadsheet, no philosophy).
          2.  Evidence must be verifiable by suppliers (metrics, not theory).
          3.  Handle missing data explicitly.
          4.  Defensible to a sourcing committee (2-3 sentences).
          5.  No reliance on contested sentience claims (must work under uncertainty).
      *   **Five Specific Problems to Address:**
          1.  Species differences vs. bias (Shrimp vs. Pig vs. Customer perception).
          2.  Death vs. Bad Life (Slower-growing breeds = more bird-days).
          3.  Numbers vs. Intensity (Millions of shrimp vs. thousands of pigs).
          4.  The "Non-Existence is Not a Harm" argument (Supplier pushback).
          5.  Scope (Where to stop? Insects? Plants?).
      *   **Test Cases:**
          1.  Shrimp stunning (Asphyxiation -> Electrical).
          2.  Broiler breed (Fast -> Slow).
          3.  Layer housing (Cages -> Aviaries).
      *   **Requirements:** Show work on test cases, identify uncomfortable outcomes, list limitations/judgment calls, assess confidence levels, and sensitivity analysis on the least sure claim.

  2.  **Deconstruct the Five Problems & Integrate into Procedure:**

      *   *Problem 1 (Species/Bias):* Cannot rely on sentience science (legal constraint). Must rely on *regulatory baseline* and *risk mitigation*. Customer perception is a business constraint, not a welfare metric, but must be acknowledged as a "Reputational Risk" filter.
      *   *Problem 2 (Death vs. Bad Life):* Need a unit that accounts for duration and intensity. "Welfare-Weighted Days" (WWD) is the standard industry attempt, but needs simplification. The "more birds" issue is a "Total Burden" calculation.
      *   *Problem 3 (Numbers vs. Intensity):* The unit must be *Total Welfare Impact* = (Individual Impact) × (Population Size). If individual impact is uncertain (insects), apply a "Uncertainty Discount."
      *   *Problem 4 (Non-Existence):* This is the "Logic of the Larder." The counter-argument is that we are modifying *existing* demand, not creating new demand from scratch. The procedure should treat the baseline as "animals required to meet current demand." We are changing *how* they live, not *if* they exist (unless demand elasticity is extreme, which is a commercial decision, not welfare).
      *   *Problem 5 (Scope):* Stop at the legal/contractual boundary. If we buy it, we assess it. But apply a "Sentience Probability Weight" based on legal recognition (e.g., Vertebrates = 1.0, Cephalopods/Crustaceans = 0.5, Insects = 0.1). This satisfies the legal team (uses law as proxy for science) and handles the magnitude issue.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**

      *   *Goal:* Fund / No-Fund / Review.
      *   *Inputs:* Cost per unit, Welfare Impact Score, Population Size, Sentience Proxy.
      *   *Step 1: Eligibility (Scope & Data).* Is there data? Is it in scope?
      *   *Step 2: The Sentience Proxy (Legal/Regulatory).* Avoids contested science.
      *   *Step 3: The Welfare Metric (Intensity × Duration).* Address Problem 2 & 3.
      *   *Step 4: The Cost-Benefit Ratio.* Address Budget.
      *   *Step 5: The "Existence" Check.* Address Problem 4.
      *   *Step 6: Reputational/Commercial Filter.* Address Problem 1 (Comms).

  4.  **Refining the Metrics (Analyst Friendly):**

      *   *Unit:* "Expected Welfare Points per Euro" (EWP/€).
      *   *Formula:* `(Baseline Suffering Score - Proposed Suffering Score) × Population × Sentience Proxy / Cost`.
      *   *Suffering Score:* 0-10 scale based on verified metrics (mortality, injury, restraint).
      *   *Sentience Proxy:* Vertebrate (1.0), Crustacean/Fish (0.5), Insect (0.1). *Rationale:* Legal recognition correlates with scientific consensus without requiring the analyst to prove sentience.
      *   *Missing Data:* Apply a "Conservative Penalty" (assume worst credible outcome for baseline, best for proposal? No, assume *no improvement* if data is missing).

  5.  **Addressing the Five Specific Problems in the Preamble:**

      *   Need to explicitly state how the procedure handles these before giving the checklist.
      *   *Species:* Use Legal Status as proxy. Comms is a "Veto" layer, not a welfare layer.
      *   *Death/Life:* Count "Life Days." More days = more potential suffering *and* potential good. Focus on *net* suffering per day.
      *   *Numbers:* Multiply by N.
      *   *Existence:* Ignore. We are fulfilling fixed demand.
      *   *Scope:* Defined by procurement list + Sentience Proxy.

  6.  **Running the Test Cases:**

      *   *Case 1 (Shrimp Stunning):* High N, Low Sentience Proxy (0.5), Low Cost, High Intensity Change (Death method).
      *   *Case 2 (Broiler Breed):* Medium N, High Sentience (1.0), High Cost, Duration Increase (More bird-days).
      *   *Case 3 (Layer Aviary):* Medium N, High Sentience (1.0), Medium Cost, High Risk (Mortality/Injury data is bad).

      *   *Anticipated Conflict:* Case 1 (Shrimp) might score high on efficiency (cheap, millions of animals) but feel wrong to the committee (Comms). Case 3 (Layers) might fail due to missing/bad data (Audit shows high mortality). Case 2 (Broilers) is the classic "quality vs. quantity" trap.
      *   *Prediction:* Case 1 will likely win on pure math but fail the "Comms Veto." Case 3 might trigger "Human Review" due to data conflict. Case 2 is the ethical trap (more life = more suffering risk?).

  7.  **Addressing Confidence & Sensitivity:**

      *   Need to assign confidence to the premises (e.g., Legal Proxy for Sentience, Suffering Scores).
      *   Least sure: The Sentience Proxy for Insects/Crustaceans. If this is wrong (e.g., insects feel nothing), the Shrimp/Insect calculations are waste. If insects feel *more*, we are underweighting them.
      *   Sensitivity: If Insect Sentience = 0, Shrimp/Insect projects drop out. If Broiler "More Days" is counted as pure negative, Case 2 flips.

  8.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Professional, direct, operational. No fluff.
      *   *Structure:*
