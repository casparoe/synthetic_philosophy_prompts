      *(Refining the "Existence" Argument)*: The supplier says "Fewer animals = less suffering."
      *   *Counter:* Our demand is inelastic in the short term (2-year lock-in). We aren't reducing total market demand, we are shifting supply chains. The "non-existence" argument only holds if we reduce *our* volume. The procedure should assume volume is constant for the calculation.

      *(Refining the Comms Problem)*: The prompt asks how to handle the "Shrimp spend looks like a joke" issue.
      *   *Solution:* A "Stakeholder Alignment" gate. It's not welfare science, it's business risk. It belongs in the procedure as a final check, not a welfare metric.

  9.  **Final Review against constraints:**
      *   Runnable in a day? Yes.
      *   Evidence verifiable? Yes (mortality, method, etc.).
      *   Missing data handling? Yes (Zero-credit rule).
      *   Defensible to committee? Yes (Legal/ Risk based).
      *   No contested sentience? Yes (Legal proxy).
      *   Test cases run? Yes.
      *   Confidence levels? Yes.

  10. **Final Polish:** Ensure the "Uncomfortable Outcome" is highlighted. (Likely Case 1 or Case 3). Case 3 (Aviaries) having high mortality is a classic welfare dilemma (freedom vs. safety). If the data shows high mortality, the procedure *must* flag it, even if "cage-free" is the marketing goal. This is the "truth-telling" function of the procedure. I will make Case 3 the uncomfortable one because it challenges the "Cage-Free is always better" narrative with hard data.

      *Wait, re-reading the prompt on Case 3:* "audit data from aviary sites shows mortality and injury figures I am not comfortable publishing."
      *   *Implication:* The welfare outcome might be *worse* than cages on specific metrics.
