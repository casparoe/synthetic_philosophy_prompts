      *Okay, let's finalize the Sentience Proxy.*
      *   Vertebrates (Pig, Chicken, Fish): 1.0 (Legally protected).
      *   Crustaceans (Shrimp): 0.5 (Emerging law, e.g., UK Animal Welfare Sentience Act).
