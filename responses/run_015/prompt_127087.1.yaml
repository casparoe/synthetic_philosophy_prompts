      *Re-evaluating Case 1 (Shrimp):* Low cost, high volume. Might score highest on "Welfare per Euro." But Comms hates it.
      *   *Decision:* I will make Case 1 the "Fund" recommendation based on math, but flag the Comms risk. I will make Case 3 the "Human Review" because the data contradicts the marketing narrative. This shows the procedure's value (finding truth) and limitation (politics).

