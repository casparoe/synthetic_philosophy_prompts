  # JOINT WORKING DRAFT: MORAL WEIGHT & HARDWARE
  **Parties:** Morphometric Gradualists (MG) // Threshold Deontologists (TD)  
  **Status:** Adversarial Collab / Pre-Registration  
  **Date:** Oct 24  

  ---

  ### 1. AGREED CLAIMS (COMMON GROUND)
  *Before we fight, here's what we both sign off on. If you violate these, you're out of the conversation.*

  1.  **Gross Mass is a Proxy, Not a Predicate.**  
      We agree that raw brain weight (grams) is morally inert on its own. An elephant brain is heavier than a human brain, but that extra mass is largely dedicated to motor control and olfactory processing, not necessarily higher-order integration. Weight alone does not buy moral status.
  2.  **The Anencephalic Baseline.**  
      We agree that anencephalic infants (lacking major portions of the cortex and skull) do not possess the hardware required for subjecthood. Moral status requires the *capacity* for experience, not just biological humanity. Absence of cortical architecture = absence of moral weight.
  3.  **Parameters ≠ Phenomenology.**  
      We agree that artificial neural nets with massive parameter counts (even exceeding human synapse counts) currently hold zero moral weight. Without evidence of felt experience (qualia), complexity is just math. You can't suffer because your loss function is high.

  ---

  ### 2. DISAGREEMENTS TABLE
  *Exact wording each camp accepts for its own view. We don't have to agree with the other side's row, but we agree this is what they believe.*

  | Topic | Morphometric Gradualists (MG) | Threshold Deontologists (TD) |
  | :--- | :--- | :--- |
  | **Core Metric** | "Moral weight is analog. It scales with the density of integrated information and synaptic complexity." | "Moral status is binary. You are either a subject of experience or you are not. Hardware specs are irrelevant past the threshold." |
  | **Scaling** | "A mind with 10x the functional integration capacity warrants 10x the moral consideration in trade-off scenarios." | "Scaling by capacity is prejudice in a lab coat. A mouse's suffering is as morally absolute as a human's." |
  | **Reduction** | "If you reduce the hardware (e.g., neurodegeneration), you reduce the moral weight proportionally." | "If you reduce the hardware but subjecthood remains, moral status stays at 100%. Dignity does not atrophy." |

  ---

  ### 3. THE CRUXES
  *Here is where the rubber meets the road. We've picked two specific battles. Below are the thought experiments, and each side is locking in their prediction now.*

  #### CRUX A: The Fractal Question
  **The Issue:** Is moral status a unified field (TD) or distributed across network topology (MG)? Can you have "half" a subject if the network is halved?

  **The Case: The Hemispheric Split**  
  A patient undergoes a complete commissurotomy (split-brain surgery) to treat epilepsy. Post-surgery, the left and right hemispheres demonstrate independent wills, distinct preferences, and separate streams of consciousness (e.g., left hand wants to wear red, right hand wants blue).

  *   **MG Prediction:** Moral weight is distributed. Post-split, there are *two* subjects with roughly half the original computational depth each. In a trolley scenario, saving both hemispheres counts as saving two entities, but each entity has less "weight" than a fully integrated human.
  *   **TD Prediction:** Moral status is invariant. If the pre-split patient was a subject, the post-split patient(s) retain full moral status. You cannot divide dignity. If there are two streams, there are two full subjects, not two halves. The "hardware reduction" doesn't dilute the right to life.

  #### CRUX B: The Cutoff Question
  **The Issue:** Is there a non-arbitrary line where moral status turns "on," or is it a dimmer switch?

  **The Case: The Fading Qualia Drug**  
  A hypothetical drug is administered that gradually suppresses synaptic firing rates without killing the organism. It doesn't target pain specifically; it targets *integration*. At 100% dose, the subject is normal. At 50%, reaction times slow. At 10%, they are vegetative but metabolically active. At 0%, they are dead. We test at the 15% mark.

  *   **MG Prediction:** Moral weight tracks the dimmer. At 15% integration, the subject has 15% of the moral weight of a healthy adult. Sacrificing this subject to save a 100% subject is morally permissible (math checks out).
  *   **TD Prediction:** The cutoff is sharp but hidden. Either the 15% subject is still a "subject of experience" (100% moral status) or they aren't (0% moral status). There is no middle ground where you are "a little bit protected." If they can feel *anything*, the scaling stops. Sacrificing them is forbidden regardless of the integration drop.

  ---

  ### 4. NEXT STEPS
  *   **MG** to provide metric for measuring "functional integration density" without relying on species bias.
  *   **TD** to define the "threshold" without relying on verbal report (which excludes infants/animals).
  *   Both to reconvene when the "Fading Qualia" model is simulatable.

  **Signed,**  
  *The Gradualists* // *The Deontologists*
