answer: |-
  You have not got the data wrong. You have independently rediscovered a distinction that occupies a significant chunk of modern formal semantics and pragmatics. Your intuition is sharper than the friend who suggested "conventional implicature" (which is historically accurate but technically imprecise today) and the one who suggested "presupposition" (which fits half your data).

  Here is the breakdown you requested, structured to help your team operationalize this for rewriting.

  ### 1. Characterization: The "Projection Test"

  You asked for a feature cluster that allows you to test new words. The load-bearing feature is your **Third Feature (Projection)**, combined with your **Second Feature (Context Independence)**.

  To test if a word carries this "second thing," apply the **Family of Sentences Test**.

  Take a sentence $S$ containing the word $W$.
  1.  **Assert $S$:** "John stopped smoking."
  2.  **Negate $S$:** "John didn't stop smoking."
  3.  **Question $S$:** "Did John stop smoking?"
  4.  **Conditionalize $S$:** "If John stopped smoking..."

  **The Characterization:**
  A word carries this "second layer" if the specific background information or attitude associated with $W$ remains constant across all four variations.

  *   *Example (Group A):* "Stop." In all four sentences above, it remains true that John *used to smoke*. That information projects out of the negation/question/conditional.
  *   *Example (Group B):* "Unfortunately." "Unfortunately, John left." / "John didn't unfortunately leave." (This syntax is clunky, try: "It is not the case that unfortunately John left"). The speaker's regret attaches to the proposition regardless of the truth value assigned to the proposition itself.

  **Why this is the load-bearing feature:**
  Ordinary literal content (entailment) vanishes under negation. (If "John killed the plant" is false, "The plant died" is not necessarily true). Conversational suggestions vanish under context changes. Only this "second layer" survives the logical operators.

  ### 2. Verdict on Your Two Groups

  Your split is real. In linguistics, these are treated as two distinct mechanisms, though they behave similarly enough for your practical purposes.

  **Group A: Presupposition Triggers**
  *   **Members:** *Regret, realize, stop, again, too, still, know, manage, before, after.*
  *   **Mechanism:** These words treat the "second thing" as a **precondition for the sentence to make sense**.
  *   **The Reporter Test:** You are correct. In reported speech ("She said she stopped"), the presupposition ("she used to smoke") is attributed to the *subject* (She).
  *   **Risk:** If the presupposition is false, the sentence feels like a "glitch" rather than a lie. (If John never smoked, saying "John stopped smoking" is not false; it is *infelicitous*.)

  **Group B: Conventional Implicatures & Expressives**
  *   **Members:** *But, although, nevertheless, moreover, even, unfortunately, frankly, allegedly, so-called, damn.*
  *   **Mechanism:** These words encode the **speaker's attitude** or the **logical relation** between propositions, without affecting the truth conditions of the main claim.
  *   **The Reporter Test:** You are mostly correct, with a nuance.
      *   *Expressives* ("unfortunately", "damn", "frankly"): These stay with the *current speaker*. If I report, "She said that damn dog bit her," I am likely endorsing the "damn-ness" unless I use scare quotes.
      *   *Discourse Markers* ("but", "therefore"): These describe the relationship between the claims. In reported speech, they usually report the *subject's* logic ("She said X but Y" implies she sees a contrast).
  *   **Risk:** Removing these changes the *tone* or *logical flow*, but not necessarily the facts. However, "allegedly" and "so-called" are legally critical; they modify the commitment to the truth.

  **The Boundary:**
  The boundary lies in **Truth vs. Felicity**.
  *   If you deny Group A ("He didn't stop, because he never started"), you are attacking the *felicity* of the statement (it was the wrong thing to say).
  *   If you deny Group B ("It's not 'unfortunately', it's a good thing"), you are attacking the *speaker's attitude*, not the facts.

  **Items in Between:**
  *   *Only / Just:* These sit on the fence. "He only ate the apple." (Presupposes he ate the apple; implicates he ate nothing else).
  *   *Yet / Already:* These behave like Group A (aspectual), but carry a Group B flavor of expectation management.

  ### 3. Contrasts with Neighbours

  To ensure your team doesn't confuse this with other types of meaning, use this grid:

  | Feature | **Literal Content (Entailment)** | **Conversational Implicature** | **Your "Second Thing" (Presupposition & CI)** |
  | :--- | :--- | :--- | :--- |
  | **Definition** | What the sentence states is true. | What the listener infers from context. | What the word encodes as background/attitude. |
  | **Negation Test** | **Vanishes.** ("He didn't kill it" $\neq$ "It died".) | **Vanishes.** (Context changes.) | **Survives.** ("He didn't stop" = "He used to".) |
  | **Cancellability** | Cannot be denied without contradiction. | **Can be cancelled.** ("It's hot, but I'm not asking for AC.") | **Cannot be cancelled.** ("He stopped, though he never smoked" sounds broken.) |
  | **Context** | Stable. | **Highly dependent** on situation. | **Stable** (encoded in the word). |
  | **Example** | "He killed the plant." $\rightarrow$ Plant is dead. | "Can you pass the salt?" $\rightarrow$ Request, not question. | "He stopped smoking." $\rightarrow$ He smoked before. |

  ### 4. A Name and Definition for Your Team

  Since "Presupposition" only fits Group A and "Conventional Implicature" is jargon, I recommend a functional label for your workflow.

  **Name:** **Fixed Baggage** (or **Encoded Assumptions**)

  **Definition for Team Use:**
  > "Fixed Baggage is meaning that is attached to specific words and survives even if you deny the sentence. It is not the main point of the sentence, but the sentence cannot be used without it."

  **The Decision Procedure (The "Even If" Test):**
  To decide if a word has Fixed Baggage, ask:
  *"If I say this sentence is a lie, is this piece of information still assumed to be true?"*

  *   *Sentence:* "The tenant **failed to** pay rent."
  *   *Lie:* "It is a lie that the tenant failed to pay." (Meaning: They did pay).
  *   *Baggage:* Does it assume rent was due? Yes. Even if they paid, the word "failed" implies an obligation existed.
  *   *Verdict:* "Failed to" carries Fixed Baggage (Obligation).

  *   *Sentence:* "The tenant **did not** pay rent."
  *   *Lie:* "It is a lie that the tenant did not pay." (Meaning: They did pay).
  *   *Baggage:* Does it assume rent was due? Not necessarily. Just states a fact of non-payment.
  *   *Verdict:* "Did not" is cleaner.

  ### 5. Practical Rewriting Rules

  Does this distinction tell you which paraphrases are safe? **Yes.**

  **Rule for Group A (Presuppositions: *stop, again, realize, regret*):**
  *   **Danger:** High. These smuggle in facts.
  *   **Rewrite Strategy:** **Make it Explicit.**
      *   *Original:* "The patient stopped taking the medication."
      *   *Unsafe Plain Language:* "The patient isn't taking the medication." (Loses the history).
      *   *Safe Plain Language:* "The patient was taking the medication, but now they are not."
      *   *Why:* In legal/medical contexts, the history (that they *were* taking it) is often evidence of compliance or side-effects. Do not delete the trigger without promoting the baggage to the main text.

  **Rule for Group B (Framing: *but, unfortunately, allegedly, so-called*):**
  *   **Danger:** Variable.
  *   **Rewrite Strategy:** **Evaluate Legal Relevance.**
      *   *Emotive Framing ("unfortunately", "damn", "frankly"):* **Delete.** These add tone, not law. Plain language aims for neutrality.
      *   *Logical Framing ("but", "although", "therefore"):* **Keep or Replace.** You can change "although" to "however" or split the sentence, but do not lose the logical contrast.
      *   *Evidential Framing ("allegedly", "so-called", "purported"):* **Preserve at all costs.** These are legal hedges. Changing "He allegedly stole" to "He stole" changes the legal status from accusation to fact. This is the most dangerous category for liability.

  ### 6. Critique of Your Three Features

  You asked which features are load-bearing and which are over-generalized.

  *   **Feature 1 (Not the main claim / Denial leads to contradiction):**
      *   *Status:* **Mostly Correct, but terminology is slightly off.**
      *   *Critique:* You described it as "self-contradictory." Linguists call this **Infelicity** or **Presupposition Failure**. It doesn't create a logical contradiction (like "This circle is square"); it creates a conversational crash ("Wait, why are you saying that?").
      *   *Verdict:* Load-bearing. This is what separates it from Entailment.

  *   **Feature 2 (Context Independence):**
      *   *Status:* **Correct and Crucial.**
      *   *Critique:* This is the primary way you distinguish this from Conversational Implicature. If the meaning disappears when you change the room or the people, it's not Fixed Baggage.
      *   *Verdict:* Load-bearing.

  *   **Feature 3 (Projection / Survival under Negation):**
      *   *Status:* **The Strongest Diagnostic.**
      *   *Critique:* You noted it survives "if", negation, and questions. This is the gold standard test in semantics. However, be aware that Group B (Expressives) sometimes behaves differently in questions than Group A. (e.g., "Did he unfortunately leave?" is weird).
      *   *Verdict:* Load-bearing. This is the most reliable test for your team to use.

  **Where you might be over-generalizing:**
  You mentioned: *"A writer who uses one of these words and then adds a clause saying 'not that I mean to suggest such-and-such' produces something that reads as self-contradictory."*
  *   **Warning:** This is true for Group A (Presupposition). It is **not** always true for Group B.
  *   *Example:* "He is rich, but I don't mean to contrast that with anything." (A bit weird, but possible).
  *   *Example:* "Unfortunately, he left, though I don't feel regret." (This is perfectly coherent).
  *   *Advice:* Do not use the "cannot deny" test for Group B words like *unfortunately* or *frankly*. Use the "Survival under Negation" test instead.

  ### Summary Recommendation for Your Team

  1.  **Adopt the term "Fixed Baggage".**
  2.  **Train on the "Negation Test":** If you say "It's not true that X", does the hidden meaning survive? If yes, it's Baggage.
  3.  **Split the Workflow:**
      *   **Group A (Facts):** Promote the baggage to the main text. (Don't hide the history).
      *   **Group B (Attitude):** Delete the emotion, keep the logic, preserve the legal hedges ("allegedly").

  You have correctly identified the mechanism that makes legal language "sticky." It sticks because the baggage is glued to the words, not the situation. Removing the words without unpacking the baggage is where most plain-language rewriting fails.
