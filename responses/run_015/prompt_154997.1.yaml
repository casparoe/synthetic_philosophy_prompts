  Imagine a hospice unit piloting a "continuity-modulated protocol" for terminal patients where a neuro-interface fragments your remaining consciousness into discrete, non-overlapping episodes, each optimized for a specific well-being good like pure pleasure, meaningful achievement, or deep relational bonding. Each episode feels subjectively like a complete, coherent life from birth to natural death, rich with internal narrative arc, but there is zero autobiographical memory linking them; your present self effectively dissolves upon completion and does not survive into the next episode, which is inhabited by a psychologically disconnected successor. To maximize the sense of accomplishment in the "achievement" episode, the system stitches together real biographical data from other patients—presenting their actual accomplishments as yours—while ensuring you never detect the fabrication. You remain in a pod while your body is kept alive, but your conscious experience is chopped into these isolated, optimized lifetimes where the only constant is the biological substrate, not the psychological person.

  Here's how the theories break down on this. Hedonism says enter because the net positive mental states are maxed out; the fragmentation doesn't subtract from the feeling of joy or satisfaction in the moment, so the sum total of good experience is higher than a painful real death. Desire-satisfaction says stay out because your current, integrated self almost certainly desires to persist as itself, not dissolve into a series of strangers who happen to inhabit your body; plugging in frustrates your current desire for continuity. Objective list says stay out because goods like achievement and friendship require authenticity; if you didn't actually write the symphony or love the partner, you haven't secured the objective good, you've just simulated it. The tricky one is narrative-identity: normally you'd think this view requires one long story, but on this specific construal, well-being is about living *a* coherent story from the inside, and since each episode offers a perfect, self-contained narrative arc, the lack of cross-episode unity doesn't diminish the well-being within those frames, so it says enter.

  The feature doing all the work here is the absence of diachronic narrative unity combined with strong internal episode coherence. If you restore normal memory across episodes, the verdicts shift: Desire-satisfaction might flip to enter if you now desire the extra goods, Objective list might flip if the achievements become real, but Narrative-identity definitely strengthens because now you have one long unified story instead of several short ones. On the stitching feature, the objective-list defender calls it cheating because authenticity requires actual agency—you can't claim goods you didn't earn. The hedonist wouldn't attack it at all; for them, if the feeling of pride is identical, the source doesn't matter, so borrowing achievements isn't cheating, it's just efficient engineering.
