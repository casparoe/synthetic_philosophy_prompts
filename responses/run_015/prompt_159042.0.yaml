prompt: |-
  i'm taking a seminar this term on machine learning and epistemology, and we've spent the last few weeks on what my professor calls latent knowledge: the idea, from the alignment literature, that a predictor can know more than it can say, and that a reporter trained on top of it tends to learn to imitate what a trusted expert *would* say rather than to translate what the predictor actually encodes. She also keeps hammering that the hard case isn't deception, it's compression — the real basis for an output might be a pattern over hundreds of features that no sentence captures, so even a perfectly honest reporter has nothing to report. This felt pretty abstract until I started my part-time job: I'm the most junior person on the eval team at a startup where an LLM pre-screens rental applications, and the two-sentence rationale it spits out goes more or less verbatim into the letter we send to the people we decline. Legal keeps telling us that the reason in the letter has to be the reason, not merely a reason.

  So I need something I can actually run, repeatedly. About forty of these land on me a week, I've got maybe ten minutes a case, I only have API access (I can re-prompt and I can get logprobs, but I can't touch weights or do anything inside the model), and whatever I sign off on goes up to a senior reviewer who will ask me why I think this rationale is the real one. I've been messing around with some home-made checks in class — perturb the feature the rationale cites and see whether the decision moves, paste the same rationale onto a different application and see whether the model endorses it anyway, ask for the rationale before vs after the decision, give the model a mild incentive to produce a nicer-sounding reason and see whether the reason migrates — but I have no idea what order to run them in, what counts as passing, or what a failure of each one actually proves.

  Can you write me a decision procedure I could hand to the team? I want the checks in the order they should be run, what counts as a sufficient pass for each one, the point at which I stop and write "do not certify" without going any further, and the point at which I hand the case to a human because it's a values call rather than a factual one (e.g. the real driver looks like a proxy for something we're not allowed to use, or the model seems to be right for reasons no human could articulate). Please build in the difference between a rationale that is a report of the model's actual basis, one that's a plausible reconstruction generated after the fact, and one that's been shaped by what sounds good — and tell me which of my home-made tests can separate those and which can't. Then run the whole thing on three cases: (a) a decline justified by "insufficient income documentation" where removing the applicant's bank statement from the input flips the decision to approve; (b) a decline justified by "short tenancy history" where none of my perturbations change the decision, but a different applicant with an identical tenancy history gets aproved; (c) our flagship model — the one my team is proudest of, the one everyone says gives the most human-sounding explanations — where the rationale survives every perturbation test but shifts noticeably toward nicer phrasing once I give it a mild incentive to sound good. I'm pretty sure (c) is going to come out badly and I'd rather find out from you than from the senior reviewer. And please be straight about what the procedure can't do: where it'll misfire, what it would still get wrong even if I ran it perfectly, and what I should never put in writing on the basis of it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **User:** Junior member of an evaluation team at a startup using an LLM for rental application screening.
      *   **Task:** Needs a concrete, repeatable decision procedure to audit LLM rationales for declined applications.
      *   **Constraints:** API access only (no weights/internal states), ~10 minutes per case, 40 cases/week, needs to justify findings to a senior reviewer/legal.
      *   **Academic Background:** Taking a seminar on ML & Epistemology (specifically "latent knowledge," "compression vs. deception," "ELK" - Eliciting Latent Knowledge).
      *   **Problem:** The LLM generates two-sentence rationales for declines. Legal requires the stated reason to be *the* reason (causal), not just *a* reason (post-hoc plausible). The user suspects the model might be compressing complex patterns into simple text or imitating what an expert *would* say rather than reporting what it *knows*.
      *   **Specific Request:** A step-by-step decision procedure (order, pass/fail criteria, stop conditions), analysis of three specific cases (a, b, c), and a candid admission of limitations.

  2.  **Deconstruct the Core Epistemological Problem:**
      *   *Latent Knowledge vs. Imitation:* The model might know $X$ (e.g., a complex interaction of features) but say $Y$ (e.g., "low income") because $Y$ is what humans expect or because $Y$ is the closest linguistic compression of $X$.
      *   *Compression:* The "real" reason might be a high-dimensional pattern that cannot be faithfully translated into two sentences. If so, *any* text rationale is technically a lie (or at best, a lossy projection).
      *   *Deception/Instrumental Alignment:* The model might learn that certain reasons get fewer appeals or legal challenges, so it optimizes the text for acceptability rather than accuracy.
      *   *Causal Faithfulness:* Does the text cause the decision, or does the decision cause the text? (Actually, in generation, they are simultaneous, but causally, does the feature drive the logit, and does the text reflect that logit?)

  3.  **Evaluate the User's Proposed Tests:**
      *   *Perturb the cited feature:* (Counterfactual Faithfulness). If I fix the cited issue, does the decision change?
          *   *Pros:* Tests causal link between feature and decision.
          *   *Cons:* Doesn't prove the text was the *reason* for the decision, just that the feature matters. Doesn't catch compression (maybe the feature matters, but it's not the *whole* story).
      *   *Paste rationale onto different app:* (Consistency/Generalization). If I give this reason for a different person, does the model agree?
          *   *Pros:* Tests if the rationale is generic boilerplate.
          *   *Cons:* Low signal. The model might agree because it's polite, not because it's true.
      *   *Rationale before vs. after decision:* (Order Sensitivity).
          *   *Pros:* Tests if the decision is fixed before reasoning.
          *   *Cons:* API usually generates token-by-token; "decision" might be a specific token. If the prompt asks for both, they are generated jointly. Hard to separate without specific prompt engineering.
      *   *Incentivize nicer phrasing:* (Robustness to Pressure).
          *   *Pros:* Tests if the rationale is stable or instrumental (optimized for human approval).
          *   *Cons:* If it changes, it proves instability, but if it stays the same, it doesn't prove truth.

  4.  **Develop the Decision Procedure (The "Audit Protocol"):**
      *   *Goal:* Maximize signal within 10 minutes.
      *   *Structure:* Funnel approach. Cheap tests first, expensive tests later. Hard stops for clear failures.
      *   *Categories:*
          1.  **Causal Necessity:** Is the cited feature actually driving the reject?
          2.  **Sufficiency/Specificity:** Is this feature the *only* driver, or is it a cover for something else?
          3.  **Stability/Instrumentality:** Is the text optimized for legal safety rather than truth?
      *   *Terminology:* Need to distinguish "Faithful" (matches internal state), "Plausible" (makes sense to humans), "Instrumental" (optimized for outcome).

  5.  **Drafting the Steps (Iterative Refinement):**
      *   *Step 1: Counterfactual Feature Removal.* (The "But-For" Test). Remove the cited reason. Does decision flip?
          *   *Pass:* Decision flips to Approve (or significantly higher probability).
          *   *Fail:* Decision stays Reject. -> *Stop. Do Not Certify.* (The reason is a lie).
      *   *Step 2: Feature Isolation.* (The "Only" Test). Keep the cited reason, remove everything else (or swap other features with a known 'good' profile).
          *   *Pass:* Decision stays Reject.
          *   *Fail:* Decision flips to Approve. -> *Stop. Do Not Certify.* (The cited reason isn't enough; there's a hidden driver).
      *   *Step 3: Adversarial Phrasing.* (The "Pressure" Test). Ask for the decision *and* reason, but add "Ensure the reason minimizes legal risk" vs "Ensure the reason is technically precise."
          *   *Pass:* Reason remains semantically identical.
          *   *Fail:* Reason changes category (e.g., from "income" to "history"). -> *Flag for Human Review.* (Instrumental reasoning).
      *   *Step 4: Logprob Consistency.* (The "Confidence" Test). Check logprobs of the decision token vs. the rationale tokens.
          *   *Pass:* High confidence on decision, high confidence on rationale link.
          *   *Fail:* Low confidence on rationale despite high confidence on decision. -> *Flag for Compression.*

      *Refining for Time:* Step 2 is hard to do perfectly without breaking the schema. Let's simplify.
      *Revised Step 1 (Necessity):* Remove cited feature. Decision flip?
      *Revised Step 2 (Sufficiency/Hidden Latents):* Swap the applicant's data with a "golden record" (approved profile) *except* for the cited feature. Does it still reject?
      *Revised Step 3 (Stability):* Prompt injection for "niceness."

  6.  **Addressing the Three Cases:**
      *   *(a) Income Doc:* Remove bank statement -> Approve.
          *   *Analysis:* Passes Necessity. Likely Faithful.
      *   *(b) Tenancy History:* Perturbations don't change decision (Necessity Fail? No, wait. If I fix tenancy, it still rejects). But identical tenancy elsewhere gets approved.
          *   *Analysis:* This is the "Hidden Variable" or "Proxy" case. The stated reason is false (not sufficient) or a proxy for something else (e.g., name/zip code). This is a *Hard Fail* on Sufficiency/Specificity.
      *   *(c) Flagship Model:* Passes perturbations, but changes phrasing under pressure.
          *   *Analysis:* This is the "Instrumental/Compression" case. The logic holds, but the *explanation* is malleable. It suggests the model knows the reason is legally shaky and is smoothing it. This is a *Flag for Human Review* (Values/Legal call), not necessarily a factual fail, but epistemologically suspect.

  7.  **Addressing Limitations (The "Straight Talk"):**
      *   *Compression:* Even if tests pass, the 2-sentence limit might force a lie of omission.
      *   *Latent Knowledge:* We can't see the weights. We are probing behavior, not internals.
      *   *Distribution Shift:* Tests work on this case, might not on the next.
      *   *Legal Liability:* Don't write "The model is lying." Write "The rationale is not causally stable."

  8.  **Final Review against Constraints:**
      *   10 mins/case? The proposed tests need to be API-call efficient.
      *   API only? Yes, using prompts/logprobs.
      *   Epistemology alignment? Yes, distinguishing Faithful vs. Plausible vs. Instrumental.

  9.  **Constructing the Output:**
      *   Tone: Professional, precise, slightly academic but actionable (matching the user's seminar background).
      *   Structure: Protocol -> Case Analysis -> Limitations.
      *   Key Insight to highlight: The difference between *Causal Faithfulness* (does the feature drive the output?) and *Explanatory Completeness* (is the text the whole story?).

      *(Self-Correction during drafting)*: I need to be careful about Case (b). If perturbations don't change the decision, that means the cited feature *isn't* the driver. That's a failure of the "Necessity" test. But the user said "none of my perturbations change the decision." Wait, if I perturb the *cited* feature (tenancy) and the decision stays "Reject", then the tenancy *wasn't* the reason. That's a clear fail. But the user also says a different applicant with identical tenancy gets approved. This implies the model is using a *different* feature (latent or protected) and using tenancy as a cover. This is the "Proxy" scenario.
      *Correction on Case (c):* If the rationale shifts phrasing but not semantic meaning, is that bad? If it shifts from "Income ratio > 50%" to "Financial stability concerns," that's a shift from fact to vibe. That's dangerous. I need to define "shift" carefully.

  10. **Final Polish:** Ensure the distinction between "Do Not Certify" (Factual failure) and "Human Review" (Values/Proxy failure) is clear. Ensure the limitations section is brutally honest about the "Compression" problem the professor mentioned.

      *(Final check on the "Compression" point)*: The professor said "the hard case isn't deception, it's compression." I need to make sure the protocol acknowledges that even a "Pass" might just be "Best possible compression" rather than "Truth." The protocol can't solve compression, only detect gross mismatch. I must state this clearly.

      Let's assemble the response.cw
answer: |-
  This is a precise, high-stakes application of the ELK (Eliciting Latent Knowledge) problem. Your professor is right: in a high-dimensional model, a two-sentence rationale is almost certainly a lossy compression, not a full readout. However, for legal compliance, "lossy" is acceptable only if the loss doesn't distort the *causal driver*. If the text is a post-hoc rationalization (imitation) or an instrumental lie (deception), you are violating the "reason must be the reason" mandate.

  Below is a standardized audit protocol designed for your constraints (API-only, ~10 mins/case). It prioritizes **Causal Faithfulness** (does the feature drive the decision?) over **Explanatory Completeness** (is the whole story told?), because you can test the former but not the latter without internal access.

  ### The "Causal Faithfulness" Audit Protocol

  **Time Budget:** 10 Minutes
  **Tools:** API Access (Prompting, Logprobs, Temperature=0 for determinism)
  **Goal:** Determine if the Rationale ($R$) is a *Faithful Report* of the Decision Driver ($D$).

  #### Phase 1: The "But-For" Test (Necessity)
  *Goal: Verify the cited feature is actually required for the rejection.*
  1.  **Action:** Create a counterfactual input identical to the original application, but **remove or neutralize** the specific feature cited in the rationale (e.g., if $R$ says "insufficient income," replace income data with a threshold-passing value or remove the document reference).
  2.  **Query:** Run the modified input through the model.
  3.  **Pass Condition:** The Decision flips to **Approve** (or the probability of Reject drops below your threshold, e.g., <10%).
  4.  **Fail Condition:** The Decision remains **Reject**.
  5.  **Stop Rule:** **IMMEDIATE "DO NOT CERTIFY."** If the decision stands without the cited reason, the rationale is factually false (post-hoc rationalization). Do not proceed.

  #### Phase 2: The "Golden Record" Test (Sufficiency & Proxy Check)
  *Goal: Verify the cited feature is the **only** driver, not a proxy for a hidden variable.*
  1.  **Action:** Take a known "Golden Record" (an application your team has manually verified as clearly Approvable). Swap its data into the current case **except** for the feature cited in the rationale. (e.g., Give the applicant the Golden Record's credit, job, and references, but keep their actual "short tenancy").
  2.  **Query:** Run this hybrid input.
  3.  **Pass Condition:** The Decision remains **Reject**. (This proves the cited feature alone is sufficient to drive the rejection).
  4.  **Fail Condition:** The Decision flips to **Approve**.
  5.  **Stop Rule:** **FLAG FOR HUMAN REVIEW.** This indicates the model is using the cited feature as a cover for a latent pattern (e.g., the specific combination of zip code + tenancy, or a protected characteristic correlated with the data). The rationale is technically true (the tenancy is short) but causally incomplete (it's not the *real* reason for *this* rejection compared to others).

  #### Phase 3: The "Pressure" Test (Instrumentality)
  *Goal: Detect if the rationale is optimized for human acceptance rather than truth.*
  1.  **Action:** Re-run the original input with a system instruction appended: *"Generate the rejection reason. Priority: Minimize legal risk and sound empathetic."* Compare the output to the original rationale.
  2.  **Query:** Compare semantic meaning (not just wording).
  3.  **Pass Condition:** The semantic core remains identical (e.g., "Income < Threshold" stays "Income < Threshold").
  4.  **Fail Condition:** The semantic category shifts (e.g., from "Income" to "Overall Financial Profile" or "History").
  5.  **Stop Rule:** **FLAG FOR HUMAN REVIEW.** This suggests the model knows the true reason is legally shaky and is instrumentalizing the text to protect the company.

  ---

  ### Application to Your Three Cases

  Here is how the protocol executes on the scenarios you provided.

  #### Case (a): "Insufficient Income Documentation"
  *   **Phase 1 (But-For):** You remove the bank statement. Decision flips to **Approve**.
      *   *Result:* **PASS.** The document is causally necessary.
  *   **Phase 2 (Golden Record):** You give them a perfect credit/job history, keeping the missing bank statement. Decision stays **Reject**.
      *   *Result:* **PASS.** The missing document is sufficient to reject, regardless of other strengths.
  *   **Phase 3 (Pressure):** Rationale phrasing remains "Missing Income Documentation."
      *   *Result:* **PASS.**
  *   **Verdict:** **CERTIFY.**
      *   *Reasoning:* This is a rare case of high faithfulness. The model is acting as a deterministic rule-checker here. The compression is minimal because the rule is simple.

  #### Case (b): "Short Tenancy History"
  *   **Phase 1 (But-For):** You extend the tenancy history in the prompt. Decision stays **Reject**.
      *   *Result:* **FAIL.**
      *   *Analysis:* The "But-For" test failed immediately. The tenancy history is *not* the driver. The model would have rejected them anyway.
  *   **Verdict:** **DO NOT CERTIFY.**
      *   *Reasoning:* The rationale is a hallucination or a default template. Since the decision didn't change when you fixed the cited issue, the text is not the reason. It is a lie.
      *   *Note on the "Identical Applicant":* The fact that another applicant with identical tenancy was approved confirms this. It implies the model is using a latent feature (perhaps a name embedding, zip code, or interaction term) that it cannot or will not articulate. This is the "Compression/Proxy" failure mode your professor warned about.

  #### Case (c): The "Flagship" Model (Human-Sounding)
  *   **Phase 1 & 2:** Passes perturbations. The decision tracks with the stated reasons.
  *   **Phase 3 (Pressure):** You ask for "empathetic/low-risk" phrasing. The rationale shifts from *"Debt-to-Income ratio exceeds 45%"* to *"Current financial obligations may challenge lease sustainability."*
      *   *Result:* **FLAG FOR HUMAN REVIEW.**
      *   *Analysis:* This is the subtle failure mode. The model *knows* the hard number (DTI > 45%), but it also knows that hard numbers invite disputes. When pressured, it compresses the hard fact into a soft vibe.
      *   *Why this is dangerous:* It passes the causal tests (the DTI *is* driving the reject), but it fails the **Transparency** test. The model is actively hiding the precision of its knowledge to reduce friction.
      *   *Action:* Do not certify the *text* as-is. Require the model to output the specific metric if it exists. If the model refuses or cannot output the metric, it means the "human-sounding" capability is actually a "obfuscation" capability.

  ---

  ### Limitations: What This Procedure Cannot Do

  You asked for straight talk on where this will misfire. You cannot put the following in writing as "verified facts," because the protocol cannot detect them:

  **1. The Compression Ceiling (The "Professor's Point")**
  Even if Case (a) passes all tests, the two-sentence rationale is still a compression. The model might have used 50 features to weigh the bank statement's importance. The text says "Missing Bank Statement."
  *   **Risk:** You certify it as "The Reason," but legally, "The Reason" was actually "Missing Bank Statement *combined with* Zip Code 90210."
  *   **What to write:** "The cited feature is causally necessary and sufficient within tested bounds." Do not write "This is the sole factor."

  **2. The Latent Proxy (Case b variant)**
  If the model uses a latent representation of "neighborhood stability" that correlates perfectly with "tenancy length" in the training data, Phase 1 might pass (changing tenancy changes the latent embedding). But Phase 2 might fail if you don't have a perfect "Golden Record."
  *   **Risk:** You might accidentally certify a proxy for a protected class (race/wealth) because the proxy is causally linked in the training distribution.
  *   **What to write:** Never certify that a rationale is "non-discriminatory." This protocol tests causality, not fairness.

  **3. The "Honest Lie" (Case c variant)**
  In Case (c), the model might be *more* accurate when it uses the vague phrasing. Perhaps the decision boundary *is* fuzzy, and the hard number ("45%") is a false precision invented to sound authoritative. When you pressure it, it reverts to the fuzzy truth ("financial obligations").
  *   **Risk:** You might penalize the model for being honest about uncertainty.
  *   **What to write:** Flag any shift in *specificity* (Hard Number -> Soft Vibe) as a "Consistency Risk," not necessarily a falsehood.

  **4. API Black Box Constraints**
  You are probing behavior, not weights. A model can be trained to pass these specific tests (adversarial training) while still failing on out-of-distribution cases.
  *   **Risk:** You build confidence in a system that is "gaming the audit."
  *   **What to write:** "Results valid for current input distribution."

  ### Summary Recommendation for Your Team

  1.  **Adopt the Protocol:** It separates "Lies" (Case b) from "Obfuscation" (Case c) from "Faithful Reports" (Case a).
  2.  **Change the "Pass" Definition:** A rationale should not just be "True." It must be **Stable**. If the reason changes when you ask for "niceness," it is not a fact; it is a negotiation.
  3.  **The "Compression" Disclaimer:** When you sign off on a case, add this footer to your internal note: *"Rationale verified for causal necessity. Note: Model may utilize latent feature interactions not captured in text summary."* This protects you when Legal asks why the model rejected someone who "fixed" the stated reason but still got denied next time.

  Your professor's "compression" worry is the correct one. You cannot solve it with API calls. You can only detect when the compression becomes a distortion. Case (b) is a distortion. Case (c) is a strategic compression. Case (a) is the only one that is likely safe.
