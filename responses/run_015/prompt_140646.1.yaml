      *   *The Core Tension:* Side A sees *difference* in the material as signaling *difference* in social sphere. Side B sees *difference* in the material as signaling *intensity* within the same social sphere (household politics).

  3.  **Evaluate the User's Four Hypotheses:**
      *   *1. Verbal Dispute:* Important, but usually resolvable by stipulation. If they agreed on definitions, would they still disagree? Yes. Side B would still say "That's just a big house for feasting," even if we call it "ritualized feasting." So, it's deeper than semantics.
