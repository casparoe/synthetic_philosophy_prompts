  9.  **Final Structure:**
      *   **Diagnosis:** It's Hypothesis 4 (Identifiability) driving Hypothesis 3 (Epistemology).
      *   **The Missing Element:** Ontological commitments regarding social evolution (Uniformity vs. Contingency).
      *   **Why the Loop Persists:** Equifinality makes the data underdetermined.
      *   **Path to Progress:** Shift from "What is it?" to "What does the ambiguity signify?" or use formal modeling.
