      *   **Q4: Strongest Objection (Possible Histories vs. Model Histories).**
          *   *Critique:* The author distinguishes "system's possible histories" from "model's possible histories."
          *   *Argument Break:* How do we access the "system's possible histories" except through models? If we say a model is good if its outputs are in the system's space of possible histories, we need independent access to that space. We don't have it. We only have data (one history) and models.
          *   *Circularity:* We validate the model by checking if it matches the system's modal structure. But we infer the system's modal structure from... models and data. If the model exhibits a behavior we haven't seen in data, is it a "possible history" or a "structural failure"? The distinction relies on a God's-eye view of the system's phase space that we don't possess. The essay assumes we can tell the difference between "a history the system *could* take" and "a history the model *imagines*." In practice, we can't, except by waiting to see if the system does it.

      *   **Q5: Misleading aspects / Cuts / Adds.**
