      *(Self-Correction on Q3)*: The "finite describer" argument is essentially an argument about *computable numbers* vs *real numbers*. If the initial state is a non-computable real number, the future is determined but not computable. The author argues this kills the "point" of determinism. I need to challenge whether the "point" of determinism was ever computation. Laplace's Demon wasn't human. The author is smuggling in an anthropocentric constraint on a metaphysical claim.

