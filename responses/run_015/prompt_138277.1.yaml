          *   *Critique:* The distinction feels shaky. In dynamical systems, "structural stability" is a specific technical term. If a model is on the wrong attractor, isn't that just a parameter error? If I model the Lorenz system but get the Rayleigh number slightly wrong, I might get a fixed point instead of a strange attractor. Is that "structural failure" or just "parameter error"?
          *   *Argument Break:* The author claims structural failure is "not remediable at all." But if I know the structure is wrong, I change the model equations. If I can't change the equations, it's a bad model. If I can, it was just a provisional model. The distinction seems to be between *within-model error* and *model-selection error*. Calling the latter "structural failure" implies the system itself has a fixed structure we might miss, which is true, but is it a *category* of predictive failure distinct from parameter sensitivity?
