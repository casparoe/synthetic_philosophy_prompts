answer: |-
  ### 1. Exam Question

  **Question 4 (30 Marks)**

  Consider the following two cases regarding the influence of cognitive states on perceptual processing:

  **Case A (The Radiologist):** After two years of reading scans alongside an assistive AI that boxes suspicious regions, an experienced radiologist finds that tumours now "jump out" at her even when the AI is off. She has no occurrent belief about any specific image while viewing it, yet her unassisted accuracy has genuinely improved compared to her pre-training baseline.

  **Case B (The Lab Study):** Participants are told before each block what an ambiguous target is most likely to be. In **Version 1**, participants report the target popping out vividly, but signal detection analysis shows their sensory sensitivity ($d'$) is unchanged; only their response criterion ($\beta$) has shifted. In **Version 2**, sensitivity ($d'$) genuinely increases.

  (a) Regarding **Case B**: Explain why Version 1 fails to demonstrate cognitive penetrability of perception proper, whereas Version 2 is a stronger candidate. However, identify one non-cognitive confound (e.g., attention) that could still explain the sensitivity shift in Version 2, and specify what further data would be needed to rule it out. **(10 marks)**

  (b) Regarding **Case A**: Does the radiologist's improved performance count as a case of cognitive penetrability? Explain why the distinction between *diachronic* system retuning and *occurrent* cognitive influence matters for defining penetrability. If this is not penetration, what kind of cognitive-perceptual relationship is it? **(10 marks)**

  (c) Consider the epistemic argument (often associated with Fodor) that if perception is cognitively penetrated, it cannot serve as an independent tribunal for testing beliefs. Does the epistemic threat depend on *what* is doing the penetrating (e.g., a true belief, a mere desire, or an absorbed skill from Case A)? Argue whether a penetrable perceptual system can ever be epistemically benign, or if encapsulation is the only safeguard against circularity. **(10 marks)**

  ***

  ### 2. Model Answer

  **Case B: Sensitivity vs. Criterion vs. Attention**
  Version 1 of the lab study does not demonstrate cognitive penetrability because a shift in response criterion ($\beta$) is a post-perceptual decision effect. The participant sees the same sensory data but changes their willingness to report "target present" based on prior cues. This leaves the perceptual experience itself untouched. Version 2 is a stronger candidate because a change in sensitivity ($d'$) implies a change in the ability to discriminate signal from noise, suggesting the perceptual processing itself has been altered by the cue.

  However, increased sensitivity in Version 2 does not settle the matter. Attention is a major confound. If the cue directs spatial or feature-based attention to the target, sensitivity will improve without high-level cognitive states (like beliefs) penetrating early vision. To rule this out, researchers must control for attention—for example, by using a dual-task paradigm to occupy attentional resources while testing the cue effect. If the sensitivity shift persists when attention is depleted, the case for high-level cognitive penetration is much stronger.

  **Case A: Diachronic vs. Occurrent**
  The radiologist case does not fit the standard definition of cognitive penetrability. Penetrability requires an *occurrent* cognitive state (a belief or desire held at the time of seeing) to influence perceptual processing. In Case A, the influence is *diachronic*: past training has retuned the perceptual system itself. There is no occurrent belief about the tumour doing the work at the moment of viewing; rather, the system has been recalibrated. This is better described as perceptual learning or expertise. While cognition caused the change historically, the current processing is encapsulated from current cognition. Conflating these two mistakes a historical causal claim for a synchronic structural one.

  **Epistemic Implications**
  The epistemic threat of penetration is not uniform; it depends on the nature of the penetrating state. Fodor's worry is circularity: if belief $P$ alters experience $E$, and $E$ is used to justify $P$, justification is compromised. However, this threat is malignant only if the penetrating state is epistemically suspect (e.g., a desire or a false belief). If perception is penetrated by a true, justified belief, the resulting experience may still be reliable, even if not independent.

  Furthermore, the radiologist case (diachronic tuning) suggests a path to epistemic benignity without encapsulation. Her system was tuned by reliable feedback (AI + verification). Her experiences are now shaped by past cognition, but they function as reliable detectors. Thus, encapsulation is not the only safeguard against circularity; reliability is. A penetrable system is epistemically benign if the cognitive inputs influencing it are themselves truth-tracking. If the cut is between reliable and unreliable influence, rather than penetrable and encapsulated, perception can remain a tribunal even if it is permeable.

  ***

  ### 3. Marking Scheme

  | Required move | Marks (out of 30) | What a first-class answer does | The specific mistake that costs the mark |
  | :--- | :---: | :--- | :--- |
  | **Distinguish Criterion vs. Sensitivity (Case B)** | 5 | Identifies criterion shift as decision-level/post-perceptual, leaving experience unchanged; identifies sensitivity shift as affecting discrimination能力. | Treating a change in reporting willingness (criterion) as a change in what is actually seen (experience). |
  | **Rule out Attention Confound (Case B)** | 5 | Identifies attention as a non-cognitive alternative explanation for sensitivity shifts; proposes a method to control for it (e.g., dual-task). | Assuming any change in $d'$ automatically proves high-level cognitive penetration without considering attentional modulation. |
  | **Diachronic vs. Occurrent Distinction (Case A)** | 5 | Clearly separates historical causal influence (training) from synchronic occurrent influence; classifies radiologist as perceptual learning, not penetration. | Assuming the radiologist case counts as penetration merely because cognition was causally involved at some earlier point. |
  | **Define Penetrability Constraints (Case A)** | 5 | Explains that penetrability requires an *occurrent* state modulating processing *during* the experience, not just shaping the system's baseline. | Conflating system retuning (long-term plasticity) with online modulation (temporary state influence). |
  | **Nuance the Epist Threat (Part C)** | 5 | Argues that the epistemic threat varies by the *type* of state (desire vs. true belief) rather than treating all penetration as equally damaging. | Asserting that *any* cognitive influence automatically invalidates perceptual justification regardless of the source's reliability. |
  | **Reliability vs. Encapsulation (Part C)** | 5 | Concludes that encapsulation is not the only epistemic safeguard; reliable tuning (even if diachronic/pentrated) can preserve justificatory power. | Assuming the benign/malignant cut lines up perfectly with the penetrable/encapsulated cut (i.e., that only encapsulated perception is justified). |

