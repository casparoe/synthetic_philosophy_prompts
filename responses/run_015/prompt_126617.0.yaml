      *   *Correction:* On the "Public Good" aspect. Conservation is a public good, but *overfishing* is the negative externality. I need to frame what was *under-provided*. Restraint is the public good.
      *   *Correction:* On the User's Hypothesis. Is it a different model? It's a Principal-Agent problem layered on top of a Commons problem. I should clarify that distinction.

