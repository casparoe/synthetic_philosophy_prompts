              *   *Political Race:* Insulate the regulator from political pressure (independent science body) or diversify the economy (reduce dependency).
              *   *Verdict:* ToC diagnoses the symptom; Political Economy diagnoses the disease. The label "ToC" conceals the state's role as an active participant in the depletion.

      *   **Section 5: Reverse Analysis (Does it confirm or contradict?):**
          *   *Confirmation:* It confirms that without property rights, resources deplete.
          *   *Contradiction:* It contradicts the idea that "State Management" solves ToC. Hardin proposed "mutual coercion." The State provided coercion, but the *wrong kind* (subsidies/expansion).
          *   *Silence:* ToC is silent on *why* the rules were set wrong. It assumes rules are either absent or exogenous. It has no theory of the regulator. It is silent on *uncertainty* (science errors). It is silent on *hysteresis* (non-recovery).
          *   *Conclusion:* The label is too loose. It names the outcome (depletion) but conceals the mechanism (state-led developmentalism + scientific uncertainty).

