  ok so i just finished this exhausting 3-hour arguement with my roomate about some epistemology we're covering in my philosphy of mind class. we got onto williamson's anti-luminosity argument — the idea that conditions like feeling cold aren't luminous because if you know you're cold there's a margin for error that sets up a sorites-style slide. my roomate insists the whole thing collapses if you reject the KK principle, since without knowing-that-you-know there's no chain to drive the paradox. i tried telling him luminosity is about being in a position to know your mental state, not about second-order knowledge, but he said that's just splitting hairs.

