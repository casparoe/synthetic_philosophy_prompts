      *   *Step 1: Looping implies unverifiability of underlying dysfunction?*
          *   Hacking's looping effects show instability in the *extension* and *experience* of the kind, not necessarily the non-existence of underlying biological mechanisms.
          *   Just because a target moves doesn't mean you can't verify a current state or a probabilistic tendency. It complicates verification, but doesn't make it impossible in principle (e.g., neurobiology might still correlate even if behavior changes).
          *   So, the move from "looping exists" to "underlying dysfunction claims are unverifiable in principle" is a non sequitur or an overstatement.
      *   *Step 2: Can administrative labels avoid looping?*
          *   Hacking argues that *any* classification that becomes known to the classified can loop.
          *   Even if you say "this is just for bookkeeping," patients know they are labeled "X for bookkeeping."
          *   They may alter behavior to fit the bookkeeping criteria (to get services) or to escape the stigma of the bookkeeping label.
          *   The intention of the classifier (administrative vs. causal) matters less than the uptake by the classified.
          *   So, the claim that administrative labels stop looping is likely false.

