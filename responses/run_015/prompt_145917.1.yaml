      *   **Tone:** Analytical, direct, helpful, philosophical but grounded.

  2.  **Analyze the Commitments (a-i):**
      *   (a) Normal humans = 1 subject, unified experience.
      *   (b) Split-brain (adult, cut) + lateralized stimulus = 2 subjects/streams.
