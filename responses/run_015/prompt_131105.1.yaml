          *   *Representational Realists:* Mechanistic interpretability recovers causally efficacious, content-bearing states.
          *   *Deflationary Instrumentalists:* Representation attribution is a pragmatic heuristic, no corresponding ontological structure.
      *   **Format Requirements:**
          1.  Numbered list of agreed claims (formal properties, what interpretability delivers, positions *not* at stake).
          2.  Disagreements table (precise positions, focusing on feature superposition).
