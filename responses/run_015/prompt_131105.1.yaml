      *   *Check:* Is the Instrumentalist view too strong (eliminativist)? *Correction:* Make them pragmatic instrumentalists. They admit the talk is useful, just not literally true.
      *   *Check:* Is the Realist view too strong (dualist)? *Correction:* Ground them in physicalist mechanistic causality.

  5.  **Final Polish:** Check the tone. It should read like a document produced after a workshop, respectful but firm on disagreements. (The prompt asks for a "draft the joint statement," so I will write it as the document itself).

