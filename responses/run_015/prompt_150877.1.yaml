answer: |-
  # DISAGREEMENT DIAGNOSTIC TREE
  **Start here:** Two forecasters have stated different probabilities for the same event and haven't converged after reading each other's writeups.

  **1. If you swapped your written definitions of the event, would you still be arguing about the same thing?**
  *   **NO:** → **Leaf A: Event Operationalization Mess**
  *   **YES:** → Go to 2.

  **2. Is the number you submitted exactly what you believe, or did the scoring rules nudge you to adjust it?**
  *   **NOT EXACTLY:** → **Leaf B: Incentive Distortion**
  *   **EXACTLY:** → Go to 3.

  **3. Would the group learn more if we kept these two views separate instead of forcing a compromise?**
  *   **YES:** → **Leaf C: Strategic Divergence**
  *   **NO:** → Go to 4.

  **4. Do you hold a specific piece of information or source that the other person hasn't seen?**
  *   **NO:** → Go to 7.
  *   **YES:** → Go to 5.

  **5. Is that information written in your update where they could see it?**
  *   **NO:** → **Leaf D: Hidden Evidence**
  *   **YES:** → Go to 6.

  **6. Even if they read it, do they know how much weight you personally put on that source?**
  *   **NO:** → **Leaf E: Calibration Gap**
  *   **YES:** → Go to 7.

  **7. Are you finding it hard to move away from an old number you guessed earlier?**
  *   **YES:** → **Leaf F: Anchoring Drag**
  *   **NO:** → Go to 8.

  **8. If you swapped your general assumptions about how governments behave, would your numbers get closer?**
  *   **YES:** → **Leaf G: Worldview Clash**
  *   **NO:** → Go to 9.

  **9. Looking at the exact same documents, do you think they point to the same conclusion?**
  *   **YES:** → *[Impossible: You should agree. See Note 2]*
  *   **NO:** → **Leaf H: Evidence Weighting**

  ---

  ### LEAF DIAGNOSES & ACTIONS

  | Leaf | Name | The Awkward Commitment | Next Standup Step |
  | :--- | :--- | :--- | :--- |
  | **A** | **Event Operationalization Mess** | You admit you weren't actually forecasting the same thing. | Pause scoring; rewrite the question definition together. |
  | **B** | **Incentive Distortion** | You admit your number is shaped by points, not belief. | Agree to submit "true belief" separately from "game score". |
  | **C** | **Strategic Divergence** | You admit convergence is less valuable than covering the space. | Log both numbers; assign each person to find evidence for their side. |
  | **D** | **Hidden Evidence** | You admit you held back information that could have settled it. | Share the link/source immediately; re-forecast after reading. |
  | **E** | **Calibration Gap** | You admit you shared data but not your trust in it. | Add a "confidence score" to the source in your writeup. |
  | **F** | **Anchoring Drag** | You admit your number is sticky because of history, not news. | Force a "blank slate" re-estimate ignoring previous rounds. |
  | **G** | **Worldview Clash** | You admit your baseline assumptions about the world differ. | Map the assumptions explicitly; agree to track which one plays out. |
  | **H** | **Evidence Weighting** | You admit you interpret the same text differently. | Write out the specific sentence causing the split; vote on interpretation. |

  ---

  ### NOTES FOR THE FACILITATOR

  1.  **Indistinguishable Leaves:** In practice, **Leaf G (Worldview Clash)** and **Leaf H (Evidence Weighting)** are often impossible to separate. People express worldview differences *through* evidence weighting. If you land on H but it feels deep, treat it as G.
  2.  **Empty Space:** If you reach **Node 9** and the answer is **YES**, the theorem says you should agree. If you don't, one of you is misreporting (return to Node 2) or misunderstanding (return to Node 1). There is no valid leaf there.
  3.  **Calibration Wrinkle:** **Node 6** is where most "shared evidence" failures hide. People share the link, but not whether they think the source is 50% reliable or 90% reliable. That is a private prior disguised as public evidence.
