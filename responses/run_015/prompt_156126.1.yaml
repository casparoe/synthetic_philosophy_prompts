  **UNIVERSITY RESEARCH ETHICS BOARD (UREB)**
  **DECISION MEMORANDUM**

  **TO:** Dr. [PI Name], Department of Cognitive Science
  **FROM:** UREB Committee Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Protocol #2023-CS-045 (Color-Phi and Post-Hoc Cueing)
  **DECISION:** **APPROVED WITH CONDITIONS**

  ### 1. Executive Summary
  The Board has reviewed your proposal regarding the malleability of phenomenal experience using the color-phi illusion and post-hoc auditory cueing. While the scientific merit is high, the ethical implications regarding deception and the potential for subject distress required extensive deliberation. The Board votes to **approve the protocol contingent upon specific modifications** to the debriefing procedure and the framing of the second experimental session.

  ### 2. Scientific and Ethical Analysis: The Orwellian/Stalinesque Distinction
  A significant portion of the Board's deliberation centered on the theoretical framework underpinning the ethical risk. Specifically, we had to determine whether the study poses a risk of "Orwellian" revision (actual alteration of past phenomenal experience) or merely "Stalinesque" confabulation (alteration of the narrative report based on constructive memory).

  **The Board's Position:**
  Based on current consensus in cognitive science and philosophy of mind (following Dennett & Kinsbourne, 1992, and subsequent empirical work on post-dictive perception), the Board takes the position that the color-phi phenomenon is mechanistically **Stalinesque**, not Orwellian. The illusion arises from the brain's latency in processing and constructing a coherent narrative *before* it enters conscious report, not from a retroactive overwriting of a fixed conscious record.

  Therefore, the ethical objection that this study violates "ontological autonomy" by rewriting a subject's mental history is scientifically unsupported. You are not erasing a fixed past experience; you are testing the limits of constructive perception and memory integration. The "Orwellian" outcome you propose to test is, in our view, a category error regarding how consciousness functions. We are not concerned that you will successfully "rewrite" a subject's mind in a metaphysical sense, because the evidence suggests there is no fixed "original" text to overwrite.

  **The Strongest Argument for the Rejected Position (Side B):**
  However, we acknowledge the strength of the minority argument we are effectively overriding. The dissenting view argued that even if the mechanism is Stalinesque, the *subjective impact* on the participant is Orwellian. If a subject is led to believe their memory was altered (via your "correction" session), they suffer an *epistemic injury*. They are forced to distrust their own access to their immediate past. The argument holds that Informed Consent cannot cover a procedure designed to induce a subject to doubt the veracity of their own phenomenology, regardless of the underlying neural mechanism. To consent to "have your memory tested" is different than consenting to "be gaslit about what you saw." We reject this as a basis for *rejection* of the study, but we accept it as a basis for *risk mitigation*.

  ### 3. Rationale for Approval with Conditions
  The deception employed (labeling the study as "reaction time" rather than "perceptual construction") is standard in psychophysics and necessary to prevent demand characteristics from ruining the illusion. However, the second session, where subjects are asked to "correct" their initial report, introduces a specific risk of psychological distress (epistemic anxiety) that exceeds standard deception protocols.

  Because the Board rejects the claim that you are altering consciousness itself, the risk is not ontological harm but rather **trust-based harm**. If a subject leaves the study believing their mind is fundamentally unreliable, you have caused harm.

  ### 4. Required Modifications
  To mitigate the risk of epistemic distress, the following conditions must be met before recruitment begins:

  1.  **Reframing Session 2 Instructions:**
      *   **Current:** Subjects are asked to "correct" their initial report based on the new cues.
      *   **Required:** Change the language to "update" or "re-evaluate." Avoid language that implies their first report was "wrong" or "false." The script must emphasize that perception is naturally malleable, not that *their* perception was defective.
      *   *Reasoning:* This reduces the implication of personal cognitive failure.

  2.  **Enhanced Debriefing Protocol:**
      *   You must submit a verbatim debriefing script. This script must explicitly explain the Stalinesque nature of the illusion.
      *   **Crucial:** You must explicitly tell the participant: *"Your first report was a valid record of what your brain constructed at that time. It was not a lie, and your experience was not 'erased.' This study demonstrates how all human perception is constructed, not how your memory failed."*
      *   *Reasoning:* This directly counters the "Orwellian" anxiety. You must restore their epistemic confidence before they leave the room.

  3.  **Distress Monitoring:**
      *   Add a brief post-debriefing questionnaire assessing "confidence in memory" and "feelings of confusion." If a subject scores high on confusion/anxiety, a follow-up check-in (email/call) 24 hours later is mandatory.
      *   *Reasoning:* We need data to ensure the "epistemic injury" is transient.

  ### 5. Conclusion
  The Board recognizes that your study aims to probe the boundary between perception and memory. While we disagree with the premise that this constitutes "Orwellian" revision of consciousness, we agree that manipulating a subject's confidence in their own report requires strict ethical guardrails.

  By implementing the changes above, you acknowledge that while the *mind* may not be rewritten, the *person's trust in their mind* is vulnerable. Protecting that trust is the condition of our approval.

  Please submit the revised consent forms, Session 2 script, and debriefing protocol within 14 days.

  **Signed,**

  [Name]
  Chair, University Research Ethics Board
