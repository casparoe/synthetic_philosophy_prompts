answer: |-
  **Joint Statement on the Frame Problem: Status and Stalemate**

  **I. Agreed Claims**

  1.  The term "Frame Problem" conflates three distinct worries: (i) representing inertia without explicit frame axioms; (ii) managing unstated preconditions and ramification; and (iii) selecting relevant beliefs for action without exhaustive search.
  2.  A complete solution must guarantee logical correctness regarding change while maintaining computational tractability in open environments.
  3.  Classical formalisms (e.g., successor state axioms) technically resolve (i) but leave (ii) and (iii) as open engineering challenges dependent on domain constraints.
  4.  Both parties agree that human agents do not suffer combinatorial explosion during routine action.
  5.  Both parties agree that modern latent-state models achieve robust control without explicit fluent lists.
  6.  Both parties agree on the **Articulation Condition**: for any factor the agent ignored, it ought to be able to say why it was safe to ignore it.
  7.  Current systems satisfy (i) formally but fail (iii) robustly in novel contexts.

  **II. Residual Disagreements**

  | Dispute | Formalist Characterization | Enactivist Characterization |
  | :--- | :--- | :--- |
  | **Core Deficit** | Inefficient inference over explicit representations. | Misguided commitment to explicit representation itself. |
  | **Success Metric** | System derives all true consequences efficiently. | System copes adaptively without deriving consequences. |
  | **Articulation** | Requires explicit symbolic justification for ignored factors. | Requires demonstrable sensitivity, not necessarily symbolic justification. |

  **III. Cruxes and Predictions**

  **1. The Verbal Dispute**
  *Question:* Is the stalemate merely verbal, arising from using "Frame Problem" for different items on the list above?
  *Test:* Apply Formalist solution to Enactivist criteria.
  *Argument:* If the Formalist insists (i) is the core problem, the dispute is verbal because the Enactivist cares about (iii). If the Enactivist admits (i) was the historical definition, the Formalist has solved the original problem.
  *Formalist Prediction:* Success on (i) counts as solving the Frame Problem; remaining issues are engineering.
  *Enactivist Prediction:* Success on (i) is irrelevant if (iii) relies on brittle heuristics; the problem is ontological.
  *Resolution Condition:* The dispute is substantive if both agree (iii) is constitutive of agency. It is verbal if definitions remain divergent.

  **2. Latent Models and Articulation**
  *Question:* Do learned latent-state world models dissolve the frame problem or merely relocate it into uninterpretable dynamics?
  *Test:* Perturb an ignored factor in a latent model; demand explanation per the Articulation Condition.
  *Formalist Prediction:* Model fails Articulation (cannot say *why* safe); problem relocated to uninterpretable dynamics. Without explicit fluents, justification is impossible.
  *Enactivist Prediction:* Model passes (saliency/probes constitute explanation); problem dissolved as representation is not propositional. Articulation is satisfied by showing sensitivity, not stating axioms.
  *Falsification:* Formalist concedes if latent models generate valid symbolic explanations automatically. Enactivist concedes if latent models fail safety audits due to unexplainable ignored factors.

  **3. Relevance and Scale**
  *Question:* How is relevance determined in open environments?
  *Test:* Novel environment with distractors.
  *Formalist Prediction:* Explicit relevance axioms required for safety.
  *Enactivist Prediction:* Embodied coupling filters relevance pre-cognitively.
  *Falsification:* Formalist concedes if axioms scale infinitely without combinatorial cost. Enactivist concedes if coupling fails without symbolic backup.

  **Commitment:** Both parties agree that settling Crux 2 is decisive for the future of AI safety. If the Articulation Condition cannot be met by latent models, the Formalist view demands a return to explicit representation. If it can be met via non-symbolic means, the Enactivist view vindicates the dissolution of the classical representational picture.
