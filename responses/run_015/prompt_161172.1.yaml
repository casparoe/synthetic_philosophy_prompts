answer: |-
  This is a sophisticated position—essentially a **Phenomenal Concept Strategy (PCS)** view coupled with **Strong Representationalism**. It is a viable middle ground, but it is a narrow ridge to walk. You are right to worry about the "90-second hole."

  Here is the consistency check, ranked by the severity of the tension, followed by the single revision that secures the position.

  ### 1. The "New Fact" vs. "Epistemic Gap" Contradiction
  **Tension:** **(4) vs. (5)**
  **Severity:** **Critical**

  *   **The Conflict:** Claim (5) states the explanatory gap is *epistemic and conceptual*, not ontological. This entails that once all physical/functional facts are known, no *ontological* facts remain. Claim (4) states Mary gains a **new fact**. In standard metaphysical terminology, if she knows all physical facts and gains a *new fact*, that fact must be non-physical. This directly contradicts (5) and hands the Chalmers-ish person the victory ("You admit property dualism!") while giving the Illusionist ammunition ("You're reifying the gap!").
  *   **Why it dissolves (sort of):** PCS proponents often sloppily say "fact" when they mean "proposition under a mode of presentation." But in a statement of position, "fact" is ontological baggage you cannot afford.
  *   **Cost of Giving Up (4):** You lose the punchy claim that Mary learns something "real."
  *   **Cost of Giving Up (5):** You become a property dualist (Chalmers camp).
  *   **Fix:** You must keep (5) to stay physicalist. You must soften (4) to stay consistent.

  ### 2. The Normativity vs. Representationalism Contradiction
  **Tension:** **(6) vs. (1) & (3)**
  **Severity:** **High**

  *   **The Conflict:** Claim (3) says phenomenology *just is* representational content. Claim (1) says intrinsic qualia are incoherent. Claim (6) says suffering is bad because of *how it feels*, not *what it does* (function), and that a functional duplicate without feeling (a zombie) wouldn't matter.
      *   If (3) is true, phenomenology is fixed by content/function.
      *   If content/function is fixed, the Zombie described in (6) is metaphysically impossible (given your physicalism).
      *   If the Zombie is impossible, using it to ground your moral intuition in (6) is unstable.
      *   Furthermore, if "how it feels" *is* representational content (3), and content is relational/functional, then saying the badness isn't about "what it does" (6) is contradictory. You are grounding normativity in the very thing you say is functional/relational, while denying the functional/relational basis of that normativity.
  *   **Cost of Giving Up (6):** You risk sounding like an Illusionist/Functionalist who thinks a perfect simulation of pain is as bad as real pain.
  *   **Cost of Giving Up (3):** You move toward Dualism (Chalmers camp).
  *   **Fix:** You need to decouple the moral weight from the *possibility* of zombies, grounding it in the *actual* nature of experience without implying zombies are metaphysically possible.

  ### 3. The Indeterminacy vs. Content Determinacy Tension
  **Tension:** **(7) vs. (3)**
  **Severity:** **Medium**

  *   **The Conflict:** Claim (3) identifies phenomenology with representational content. Standard theories of content (causal, teleological, functional) usually yield determinate truth conditions. Claim (7) says that in gradual inversion or simple systems, there is **no fact of the matter** (indeterminate) about the phenomenology. If phenomenology = content, you are implying content itself is indeterminate in these cases. This is a defensible view (vagueness in content), but it requires you to explicitly endorse vague content, or else (7) undermines (3).
  *   **Cost of Giving Up (7):** You lose the nuanced view on vagueness/spectrum inversion.
  *   **Cost of Giving Up (3):** You lose Representationalism.
  *   **Fix:** Explicitly state that representational content *can* be vague/indeterminate.

  ---

  ### The Single Revision That Cleans Up the Most

  **Revise Claim (4).**

  **Why:**
  This is the most immediate "90-second hole." The phrase "gains a new fact" is the specific trigger that allows the Chalmers person to categorize you as a dualist and the Illusionist to categorize you as confused. It is logically incompatible with your commitment in (5) that the gap is purely epistemic.

  If you fix (4), you secure your physicalist credentials (satisfying 5) without conceding the reality of the experience (satisfying 2). It also indirectly helps with (6), because it reinforces that the "extra" thing Mary gets is a *mode of access*, not an ontological ingredient, which aligns with the idea that the moral weight comes from the *instantiation* of that access, not a separate fact.

  **The Revision:**
  Change (4) from:
  > "(4) On Mary: she gains a new fact. Not just an ability to imagine or recognise or remember, and not just a new concept or label — she comes to know something she couldn't have known in the room."

  To:
  > "(4) On Mary: she gains **new knowledge via a new mode of presentation**. She comes to grasp a truth she couldn't have grasped in the room, not because the world changed, but because she acquired a phenomenal concept that allows her to represent the physical reality in a way that was previously cognitively inaccessible."

  **What this costs you:**
  It sounds slightly more technical and less intuitive than "new fact."

  **What this buys you:**
  1.  **Consistency with (5):** It confirms the gap is epistemic/conceptual, not ontological.
  2.  **Defense against Chalmers:** You deny there are non-physical facts.
  3.  **Defense against Illusionist:** You deny it's *just* an ability; it's genuine knowledge/grasping of truth.
  4.  **Consistency with (1):** It avoids reifying the "thick qualia" you rejected in (1).

  **Secondary Note on (6):**
  While (4) is the priority, be prepared for the Illusionist to pounce on (6). If they ask, "If a functional duplicate has the same representational content (per 3), why doesn't its suffering matter?" your answer must be: *"Because moral status requires the content to be **instantiated** phenomenally, not just functionally processed. The 'what it is like' is the content *as experienced*, and that instantiation is what carries weight."* Do not concede that the Zombie is metaphysically possible; treat it as a conceivability heuristic only.
