      *(Refining the "Hard-No")*: Camus argues that unless the state can guarantee it won't kill an innocent and that this specific killing prevents future deaths *that imprisonment cannot*, it must stop. So the Hard-No is on "Irreversibility + Uncertainty."

      *(Refining the "Invisible" twist)*: Camus specifically wrote about the shift from public to private executions. He called private execution a "dirty job." The checklist should flag this as a failure of democratic accountability.

