answer: |-
  Here is the **Camus Audit Protocol**. It translates *Reflections on the Guillotine* into an administrative workflow. It is designed to stress-test the legitimacy of the sentence, not the guilt of the prisoner.

  ### Part 1: The Checklist (Ordered Questions)

  **Phase 1: The Mirror Test (Legitimacy)**
  1.  **Is the state's act premeditated?** (Camus argues a crime of passion is less immoral than a calculated state killing.)
      *   [ ] Yes [ ] No
  2.  **Does the sentence claim to "honor" the victim by killing?**
      *   [ ] Yes [ ] No
  3.  **Is the stated goal retribution or societal protection?**
      *   [ ] Retribution [ ] Protection

  **Phase 2: The Hubris Test (Prediction)**
  4.  **Is there absolute certainty the prisoner will kill again if imprisoned for life?**
      *   [ ] Yes [ ] No [ ] Speculative
  5.  **Is there a non-zero chance of judicial error in this specific case?**
      *   [ ] Yes [ ] No
  6.  **Does the sentence rely on future risk assessment (psychological or statistical)?**
      *   [ ] Yes [ ] No

  **Phase 3: The Transparency Test (The Spectacle)**
  7.  **Will the execution be witnessed by the public or press?**
      *   [ ] Yes [ ] No
  8.  **Is the method designed to appear painless to the observers or the executed?**
      *   [ ] Observers [ ] Executed

  ---

  ### Part 2: Critical Control Points

  **The Hard-No Stopping Point**
  *   **Location:** Phase 2, Question 4 & 5.
  *   **The Logic:** If the answer to Q4 is anything other than "Yes" (which is impossible to prove), or Q5 is "Yes," the audit halts.
  *   **Camus's Rule:** You cannot irreversibly kill a human based on a prediction of the future or a system known to be fallible. If you cannot guarantee 100% necessity and 100% innocence, the state lacks the moral authority to proceed.

  **The "Values Take Over" Spot**
  *   **Location:** Phase 1, Question 3.
  *   **The Logic:** If the goal is "Protection," Camus argues life imprisonment suffices. If the goal is "Retribution," the board must admit the state is acting on emotion, not reason.
  *   **The Decision:** This is where the board decides if "justice" means "moral consistency" (Camus) or "emotional balance" (Retribution). The checklist cannot solve this; it only exposes it.

  **Honest Flags (Where the Checklist Misfires)**
  *   **The Torture Exception:** Camus's logic struggles if the crime involved prolonged torture. The "Mirror Test" feels inadequate when the crime was uniquely sadistic. The checklist may flag the execution as illegitimate, but public moral intuition may demand it.
  *   **The "Incapacitation" Blind Spot:** The checklist assumes life imprisonment is a perfect alternative. If the prison system is corrupt or underfunded (allowing further murders), Phase 2 fails to account for systemic failure outside the board's control.
  *   **Victim Family Agency:** Camus prioritizes the state's moral purity over the victim family's desire for closure. This checklist will often override their wishes.

  ---

  ### Part 3: Scenario Applications

  #### Scenario 1: Prisoner kills guard during escape attempt.
  *   **Phase 1:** State act is premeditated (Yes). Goal is likely Retribution/Deterrence.
  *   **Phase 2:** Can you guarantee he would kill again in max security? **No.** (Hard-No Trigger).
  *   **Camus Verdict:** **Stop.**
  *   **Reasoning:** The prisoner committed a crime of opportunity/passion (escape). The state is committing a crime of calculation. Life in solitary confinement offers equal societal protection without the state becoming a murderer. Executing here is revenge, not safety.

  #### Scenario 2: Jury used a risk algorithm to justify execution.
  *   **Phase 1:** N/A.
  *   **Phase 2:** Relies on future risk assessment? **Yes.** (Hard-No Trigger).
  *   **Camus Verdict:** **Stop.**
  *   **Reasoning:** This is the peak of Hubris. An algorithm predicts probability, not certainty. Camus argues no human or machine can predict the future with the precision required to justify death. Using data to kill is "bureaucratic murder," which Camus viewed as more dangerous than passionate murder.

  #### Scenario 3 (The Twist): Invisible Execution (No witnesses, chemical protocol).
  *   **Phase 3:** Witnessed by public? **No.** Method designed for observers? **Yes** (to hide the violence).
  *   **The Crack:** This breaks the procedure's moral spine.
  *   **Camus Verdict:** **Stop.**
  *   **Reasoning:** Camus argued that if the death penalty is necessary, it must be public. If you hide it, you admit it is shameful.
  *   **Procedural Failure:** An invisible execution removes democratic accountability. It turns the board into a secret tribunal. If the public cannot see the killing, they cannot share the moral burden. The state is essentially sanitizing murder to make it palatable. The checklist flags this as **Cowardice**, rendering the sentence illegitimate regardless of the crime.

  ### Summary for the Board
  If you run this audit:
  1.  **Algorithms and Risk Scores** are automatic disqualifiers (Hubris).
  2.  **Secret Chemical Protocols** are automatic disqualifiers (Cowardice).
  3.  **Retribution** is an invalid legal standard under this framework (Mirror Test).

  You will likely find almost no cases pass Phase 2. That is the intended function of the tool.
