          *   Application to two specific scenarios: (1) Prisoner killing a guard during escape, (2) Jury using a risk algorithm.
          *   Niche twist: Invisible execution method (no witnesses, chemical protocol).
          *   Constraint: Keep it practical, no essays.

  2.  **Deconstruct Camus's Logic:**
      *   *Core Argument 1 (Legitimacy):* The state cannot condemn murder by committing murder. It sets a bad example. It legitimizes violence.
      *   *Core Argument 2 (Irreversibility/Hubris):* We cannot predict the future (recidivism). We cannot undo mistakes (executing the innocent). Premeditated killing by the state is worse than impulsive killing by a criminal.
      *   *Core Argument 3 (Deterrence):* There is no proof it deters. The threat of death is less effective than the threat of life imprisonment.
      *   *Core Argument 4 (Spectacle):* Public execution is barbaric; secret execution is cowardly.

  3.  **Drafting the Checklist (The "Camus Audit"):**
