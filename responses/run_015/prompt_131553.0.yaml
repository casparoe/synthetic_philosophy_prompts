answer: |-
  This is one of the most persistent and fertile tensions in the philosophy of biology. You are not merely encountering confused researchers; you are bumping up against a genuine ontological boundary that figures like Sahotra Sarkar, Peter Godfrey-Smith, and Evelyn Fox Keller have debated for decades.

  Your intuition is sharp: if we define "code" strictly by the standards of classical information theory (Shannon) or semiotics (arbitrary signifier/signified pairs with distinct agents), the biological case is messy. However, dismissing it as a category mistake might throw the baby out with the bathwater.

  Here is a breakdown of how to resolve this conceptual split, structured to help you navigate your reporting.

  ### 1. The Arbitrariness Problem: Chemistry vs. Convention
  Your primary objection is that molecular complementarity (shape recognition) is causal, not conventional. If $A$ binds $B$ because of physics, it's not a "symbol"; it's a key in a lock.

  **The Counter-Argument:** The "code" is not the binding of the tRNA to the mRNA. The "code" is the mapping between the *codon* and the *amino acid*.
  *   **The Linkage:** The tRNA is the physical bridge. One end recognizes the codon (via Watson-Crick pairing), but the other end holds the amino acid. Crucially, **there is no chemical necessity for a specific tRNA to carry a specific amino acid.**
  *   **The Enzyme:** The connection between the tRNA and its specific amino acid is catalyzed by an enzyme called *aminoacyl-tRNA synthetase*. This enzyme "decides" (evolutionarily speaking) that *this* tRNA gets *that* amino acid.
  *   **The Evidence:** In the lab, scientists can trick a synthetase into loading the wrong amino acid onto a tRNA. The ribosome will then insert the wrong amino acid into the protein based on the codon. The ribosome reads the tRNA anticodon, not the amino acid shape.

  **Verdict:** This supports the "code" metaphor. The relationship between the nucleotide triplet and the amino acid is **arbitrary** (or at least historically contingent, per Crick's "Frozen Accident" hypothesis) rather than chemically determined. If it were purely a causal template (like a mold casting metal), the shape of the mRNA would directly dictate the shape of the protein. It does not; it dictates a sequence via an adapter system. That indirection is the hallmark of information processing.

  ### 2. The Interpreter Problem: Hardware/Software Entanglement
  You noted that in formal systems, the decoder is distinct from the message. In cells, the ribosome and tRNAs are produced by the genome they are reading. This looks like a software program that builds its own CPU.

  **The Resolution:** This is not a failure of the metaphor; it is a specific architectural class known as a **Von Neumann Universal Constructor**.
  *   In a computer, the hardware is static. In biology, the "hardware" (ribosomes, polymerases) is dynamic and encoded by the "software" (DNA).
  *   **Bootstrapping:** A cell is a bootstrapping system. You cannot have the code without the interpreter, but you cannot have the interpreter without the code.
  *   **Why this matters for your story:** This distinction explains why synthetic biology is so hard. In software, you can run Python on any machine with an interpreter. In biology, if you rewrite the genome (software) too aggressively, you might disrupt the production of the ribosomes (hardware) needed to read it.

  **Verdict:** Calling DNA a "program" is accurate, but it is a **self-referential program**. The "category mistake" occurs only if you assume the hardware/software distinction is rigid. In biology, the boundary is porous.

  ### 3. Do Variants (Mitochondria/Histones) Rescue the Metaphor?
  You asked if mitochondrial code variants and the histone code prove the existence of "nested interpreters."

  **Mitochondrial Variants:**
  *   **Yes, this is strong evidence for "convention."** If the genetic code were dictated purely by stereochemical necessity (physics), it would be universal. The fact that mitochondria (and some bacteria) use slightly different codon tables (e.g., UGA is Tryptophan instead of Stop) proves that the mapping is evolvable.
  *   **The Interpreter Module:** This implies the existence of distinct "translation environments." A mitochondrial ribosome operates with a slightly different "lookup table" than a cytoplasmic ribosome. This is functionally identical to running a script on a virtual machine with a different library definition.

  **The Histone Code:**
  *   **Be careful here.** Many philosophers of biology argue the "histone code" is a metaphorical overreach.
  *   **Difference:** The genetic code is digital and combinatorial (discrete units). Histone modifications (methylation, acetylation) are often analog, contextual, and probabilistic. They function more like **metadata** or **state flags** than executable code.
  *   **Utility:** However, framing them as a "layer" is useful for synthetic biology. It suggests that the genome has an "operating system" (chromatin structure) that determines which "applications" (genes) can run.

  **Verdict:** Mitochondrial variants strongly support the "arbitrary convention" view of the genetic code. The histone code supports a "layered architecture" view, but be wary of implying it has the same syntactic rigidity as the genetic code.

  ### 4. Implications for Synthetic Biology
  If the analogy holds, synthetic biology's framing of genes as "rewritable software" is valid but requires a disclaimer: **The compiler is physical.**

  *   **Orthogonal Systems:** Synthetic biologists are now building "orthogonal" ribosomes and tRNAs that operate alongside natural ones, effectively creating a parallel "virtual machine" inside the cell to read synthetic genes without interfering with native genes. This explicitly treats the translation machinery as a modular interpreter.
  *   **Recoding:** Projects to remove specific codons from an organism's genome (e.g., removing all UAG stop codons) to repurpose them for synthetic amino acids rely entirely on the premise that the code is arbitrary and rewritable. The success of these projects (like those from George Church's lab) is empirical proof that the "code" metaphor has operational truth.

  ### 5. Synthesis for Your Article
  You can resolve the split in your interviews by proposing a tiered definition. The confusion arises because researchers use "code" to mean three different things:

  1.  **The Transmission Code (Shannon):** DNA stores information that is transmitted with high fidelity. (Undisputed).
  2.  **The Semantic Code (Semiotics):** The codon-amino acid mapping is arbitrary and conventional. (Supported by mitochondrial variants and synthetase mechanics).
  3.  **The Computational Code (Turing):** The genome is an algorithm that executes development. (Contested, because development is also driven by physical self-organization, not just genetic instruction).

  **The Narrative Hook:**
  The "category mistake" you fear is actually the frontier of the field. The researchers who insist DNA is *just* chemistry are often reacting against the "DNA as destiny" hype of the 90s. The researchers who insist it is *software* are often those building orthogonal systems where the abstraction holds true.

  **Conclusion:**
  DNA is a code, but it is a **wet code**.
  *   It is not a category mistake to call it a code, because the mapping is arbitrary and relies on indirection (tRNA adapters).
  *   However, it is a mistake to treat it as *disembodied* code. The interpreter is chemically coupled to the message, and the "hardware" degrades and evolves alongside the "software."
  *   The mitochondrial variants do not multiply confusion; they prove that evolution can refactor the "compiler" settings, validating the software metaphor for synthetic engineers who intend to do exactly that.

  Your article could argue that we are moving from the **Metaphor of the Code** (DNA is *like* a language) to the **Engineering of the Code** (we are now building the compilers that make it *actually function* like a language). That shift resolves the philosophical tension by making it an engineering constraint.
