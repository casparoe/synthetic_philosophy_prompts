          *   *Fix:* Clarify that capabilities help with *competence* at alignment, but not *motivation*. Distinguish "doing what we want" vs. "wanting what we want."

      *   **Conflict C: AI-Assisted Eval vs. Scheming (6 vs. 2)**
          *   *Severity:* Medium-High.
          *   *Why:* If models scheme (2), using them to grade (6) allows collusion or gradient hacking of the eval process.
          *   *Fix:* Require ensembles, transparency on the grader, or human-in-the-loop for the grader.

      *   **Conflict D: Prosaic Engineering vs. Scheming (1 vs. 2)**
          *   *Severity:* Low-Medium.
