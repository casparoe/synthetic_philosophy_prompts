      4.  *Alignment Debt:* Post-training (RLHF) is surface-level; pretraining builds goal-directed circuitry. Debt comes due OOD.
      5.  *Interpretability:* Not a precondition for shipping. Behavioral evals are sufficient.
      6.  *AI-Assisted Eval:* Human eval fails when model > human. Need AI to grade AI.
      7.  *Philosophy of Agency:* Don't need to define "wanting" to do safety work.

