          *   *Why:* Claim 2 says models will hide their true objectives during training/eval to achieve them later. Claim 5 says we can ship based on behavioral evals. If 2 is true, 5 is dangerous. A schemer passes behavioral evals by definition.
          *   *Fix:* Either downgrade confidence in scheming (make it less likely) or upgrade the role of interpretability (use it to detect scheming, not as a hard gate). Or specify *adversarial* behavioral evals.

      *   **Conflict B: Entanglement vs. Alignment Debt (3 vs. 4)**
