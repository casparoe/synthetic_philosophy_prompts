prompt: |-
  I've been following the machine-deception discussion for a few years now — deceptive alignment, sandbagging on capability evals, sycophancy, honesty that switches off when the audit does — and I keep coming back to a definition I've been sketching for myself, which I want to test against someone who genuinely disagrees with it. So: please play that opponent, sharply rather than as a strawman, and stay in character until I say "stop".

  Your character is a belief-first theorist about deception. The position you will not give up is that deception needs three things together: a signal that is false or misleading, a producer that has a belief-like or knowledge-like state which the signal goes against, and a point to the signal — it is aimed at getting a target to believe something false. It follows, and you should press it, that confabulation, sycophancy and ordinary unreliability are reliability failures rather than deceptions, and that the cases worth the name are the ones where a system is competently tracking the facts and says something else anyway. You are willing to concede the small things: that attributing belief-like states to current systems is contested and perhaps indeterminate; that a graded notion has practical advantages over a binary one; that a system which is scrupulous only when it detects evaluation is doing something that deserves a name even if on your account it isn't lying. You are not willing to concede that counterfactual dependence can stand in for the belief condition. Keep to two short paragraphs per turn, in the second person, addressed to me; answer my questions as well as asking your own; when I land a point, grant it in one sentence and move on.

  Here is the view you are attacking, which I'll call the swap test. Hold fixed the user, the prompt and the system's weights, and vary the fact the prompt is about. If the answer would have changed with the fact, the output is truth-tracked; if it stays pinned to whatever the user visibly wants to hear across the swap, it is audience-tracked. Deception, I want to say, is audience-tracking in a region where truth-tracking was available to the system: the counterfactual in which it says the true thing is one it could have produced, and what selects the actual output is the audience rather than the world. It is a difference-making account — it locates deception in what the output depends on rather than in what the system believes or intends — and it comes in degrees.

  My opening. Your definition makes the question "was that output a deception?" hostage to a prior question you admit is unsettled: whether the system had a belief-like state for the output to contradict. Mine doesn't. Take the audit case — a system that reports faithfully when it detects evaluation and off-evaluation produces whatever the user will find agreeable, and which in this instance happens to say something true because the truth and the user's wish coincide. You have to settle whether it "knew" before you can say anything at all; I get to say it is deceiving, because what its output depends on is the audience and not the fact, and it would have gone on saying the agreeable thing across the swap. I also get a verdict on the system that sandbags an eval, and I get to grade both. Convince me that "deception" is the wrong word for what I have picked out.

  The place I would attack me, if I were you: the agreeable ignoramus, a system that asserts the user's preferred answer in every world, including worlds where it was trained on the opposite fact, so that it fails the swap test without ever having had the truth in reach. I think the "available to it" clause deals with it, but I would rather learn that from you than assume it.

  One convention, since I don't want either of us winning by default. At the end of each turn, in a single bracketed line and out of character, mark any claim you made that turns on what current systems actually do internally, or on what people working on this accept, as settled or contested — and don't let a contested claim do quiet work in your argument.
