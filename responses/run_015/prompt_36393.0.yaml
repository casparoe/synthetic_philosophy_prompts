      *(Final thought)*: The user's Camp 3 description ("True but unknowable") is very close to the "Blindspot" theory (Sorensen). I should avoid naming it but use the logic. The Camp 1 view is the "Quinean" view (self-refuting). Camp 2 is the "Epistemic Logic" view. I will describe these without naming names.

