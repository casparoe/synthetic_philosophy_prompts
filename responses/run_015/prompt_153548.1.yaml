      *   *On the Swap:* Praise the ingenuity. Explain the original intent of Chastity (cooling passions, avoiding vanity). Compare it to Attention Stewardship. A scattered mind is a proud mind (thinking oneself too important for every notification). Calming attention prepares the soul for Humility. The chain is not broken; it is adapted.
