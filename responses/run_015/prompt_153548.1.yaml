answer: |-
  My dear friend,

  It gives me great pleasure to hear that you have taken up the little book and the scheme of improvement. There is no greater satisfaction in life than knowing one is better today than one was yesterday, even if the progress is as slow as the hand of a clock.

  You ask if you have broken the logic of the arrangement by substituting "Attention Stewardship" for Chastity. I say to you: no. The list was never intended as scripture, but as a scaffold. When I first drew up the virtues, I sought those that would most contribute to happiness and utility. I placed Temperance first because a cool head is necessary for constant vigilance; a man with a clouded brain cannot guard his tongue nor his ledger. I placed Humility last because, as a Quaker friend once kindly told me, I was in danger of being insufferable without it. He suggested I add it to the end, and I found that while I could not achieve perfection, the attempt made me more agreeable.

  Regarding your substitution: Chastity was placed at twelve to cool the passions and check vanity in one's conduct before attempting the final polish of Humility. It was meant to ensure the body did not rule the mind. Your "Attention Stewardship" serves a similar master. In my day, distraction came from idle gossip or poorly managed business. In yours, it seems the world shouts for your notice through every pocket and wall. If you allow your mind to be pulled into fragments by every message and news-sheet, you become reactive. A reactive mind is a proud mind, for it assumes every notification is of consequence. To steward your attention is to say, "I am not so important that I must answer instantly." This quieting of the ego prepares the soil perfectly for Humility. The chain is not broken; you have merely forged a new link suitable for your times.

  As to your second observation regarding Order and Silence: that is no coincidence. I must confess, Order was the virtue that gave me the most trouble. I never arrived at perfection in it, and indeed, I fell far short. My papers were often in disarray, and my time not so strictly allotted as I wished.

  Here is why your failures cascade: When things are not in their places (Order), you must spend time and energy searching for them. This creates haste. When a man is in haste, he is prone to speak without thinking, to interrupt, or to utter trifles simply to vent his frustration. Thus, Disorder breeds the conditions that break Silence. It is a mechanical fault in the engine. If the foundation is shaky, the structure above it trembles. In my own life, when my study was in chaos, my patience was short, and I was less mindful of my words at the dinner table.

  Do not be discouraged by these black marks in your notebook. I found that a speckled axe is best. A man who tries to polish himself entirely may rub away the metal. The goal is not to be spotless, but to be better than you were. If you find that Attention Stewardship aids your Humility, and that mastering Order helps keep your Silence, then the system works, regardless of the labels.

  Continue your tracking. Be gentle with yourself when you stumble, but strict enough to rise again.

  I remain, your humble servant,

  B. Franklin
