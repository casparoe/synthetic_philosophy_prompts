answer: |-
  To both of you, following our recent series of mediated sessions regarding the ethics and regulation of surrogacy, I am submitting this memorandum to encapsulate the text of the joint statement you have indicated you are willing to sign. This document is designed to reflect the genuine common ground you have established while preserving the integrity of your remaining philosophical divergences. We begin with the factual and normative claims that both camps can genuinely accept without reservation. You both acknowledge that the current global landscape is defined by two distinct regulatory regimes, specifically the European model which generally prohibits commercial surrogacy in favor of altruistic arrangements or total bans, and the American model which permits a regulated commercial market. You agree that both regimes invoke the same core values, namely the protection of the child's welfare, the autonomy of the gestational carrier, and the prevention of exploitation, even though you prioritize and interpret these values differently. Both of you accept that no existing system is perfect, that cross-border reproductive care complicates domestic enforcement, and that the primary goal of any policy must be to minimize harm to the children born of these arrangements and the women who carry them. You further agree that transparency in contracts and independent legal representation for carriers are baseline requirements for ethical practice, regardless of whether money changes hands beyond expenses.

  Having established this shared foundation, the statement must precisely articulate the points of residual disagreement, phrased such that neither side feels misrepresented. The European defender maintains that the commodification of reproductive labor inherent in commercial contracts undermines human dignity and creates inevitable power imbalances that regulation cannot fully rectify, viewing the body as something that should remain outside the market sphere. The American defender maintains that prohibiting commercial compensation restricts the autonomy of women who wish to use their labor to improve their economic standing and denies intended parents equitable access to family formation, viewing the body as something over which the individual must retain sovereign economic control. You agree to record this disagreement not as a failure of dialogue but as a legitimate pluralism in how liberal democracies balance liberty against dignity. The statement will note that while you converge on the need for protection, you diverge on whether protection is best achieved through the shielding of the market or the empowerment of the participant within the market.

  The core of your collaboration, however, rests on two specific cruxes, which are sub-questions where settling the empirical or logical outcome would move at least one side toward the other's position. The first crux concerns whether a prohibition that drives the practice underground increases or decreases the very harm it purports to prevent. Both of you agree that the situation of French citizens traveling to Ukraine or Georgia to engage in surrogacy arrangements that are illegal at home but legal abroad bears directly on this question, as it provides data on how bans interact with cross-border demand. The European camp predicts that despite this travel, the domestic ban maintains a normative firewall that reduces overall volume and prevents the normalization of exploitation within French society, thereby decreasing harm in the long term. The American camp predicts that this travel strips carriers of the legal protections available in regulated markets and leaves children in legal limbo upon return, thereby increasing harm by pushing vulnerable parties into jurisdictions with weaker oversight. The second crux concerns whether the fact that even ban jurisdictions permit paid egg donation reveals an incoherence in the ban's own rationale. Both of you agree that the regulations enforced by the Human Fertilisation and Embryology Authority in the United Kingdom, which allow compensated egg donation while prohibiting commercial surrogacy, serve as the concrete case evidence for this test. The European camp predicts that this distinction is coherent because gestation involves a unique bodily integrity and relational connection that gamete provision does not, making the different treatment logically consistent. The American camp predicts that this distinction is incoherence because both processes involve bodily intrusion and medical risk for compensation, suggesting the ban on surrogacy is driven by cultural intuition rather than consistent ethical principle.

  I must close this memorandum with a brief note on where my own drafting of this agreement is most likely to fail, as a measure of caution for your final review. The claim that both regimes prioritize the child's welfare is more contested than it looks, as the European side may view the child's right to not be bought as fundamental to welfare, while the American side may view the child's right to be born into a prepared family as paramount, and these definitions may prove incompatible upon closer scrutiny. I may have misidentified the egg donation crux, because the European scholar might argue that the distinction between gametes and gestation is so profound that evidence of inconsistency is irrelevant to their core bodily integrity argument, meaning settling the crux would not actually move them. If new evidence emerges showing that altruistic surrogacy arrangements result in higher rates of contract breach or carrier psychological distress than commercial ones, I would need to rephrase the first crux to focus on psychological outcomes rather than legal status. Furthermore, if the American scholar concedes that market pressures can never be fully mitigated by regulation, or if the European scholar concedes that bans inevitably result in greater net suffering due to underground markets, I would doubt that the two could sign this statement at all, as the compromise relies on both sides believing their preferred system is net-positive rather than merely the lesser of two evils.
