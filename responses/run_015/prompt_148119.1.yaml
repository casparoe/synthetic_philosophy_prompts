answer: |-
  Here's the setup for your seminar.

  **The Case**
  Dr. Aris, seeking an inheritance, injects Patient X with a lethal dose of Cardiolene, intending to cause fatal arrhythmia, but X survives completely unharmed due to a rare, undiagnosed enzymatic deficiency that neutralizes the drug instantly. Unknown to the medical community, law enforcement, or any potential offenders, a hidden biochemical variable—a recent, undetected atmospheric pollutant now present in all hospital HVAC systems—reacts with Cardiolene to degrade it into inert saline within seconds of exposure, making any future attempt using this method physically incapable of causing harm. Aris is caught on camera, fully culpable and aware of his intent, but the specific conditions rendering the act harmless are unknowable to anyone else considering similar acts, meaning the threat of punishment cannot alter behavior that is already physically blocked by chemistry.

  **The Breakdown**
  Here's the reversal you need. The **retributivist** goes hard here because they're tracking backward-looking desert based on culpability, not outcomes. Aris formed the intent to kill and took substantial steps to do so; the fact that X survived is just moral luck. Since Aris's will was fully engaged in the wrongdoing, he deserves a punishment proportional to attempted murder, regardless of the biochemical luck that saved the victim. The **consequentialist**, however, argues for leniency (or even release) because the forward-looking math doesn't add up. Actual harm is zero. Crucially, general deterrence is useless because the atmospheric pollutant already prevents future harm physically; punishing Aris adds social cost (prison, resources) without reducing future crime, since potential offenders can't anticipate the variable and thus can't be deterred by law when chemistry has already made the crime impossible.

  **The Pivot Point**
  The exact feature doing the work is the **unknowable physical impossibility** of future harm. If you drop the biochemical twist (i.e., if the drug still works for others), the consequentialist position collapses immediately. In that standard scenario, punishing Aris becomes necessary to maintain the deterrent threat and incapacitate a dangerous actor, likely pushing the consequentialist to support harsher punishment than the retributivist. The reversal only holds because the biochemical variable severs the link between legal punishment and future harm reduction.

  **The Counter-Attack**
  A clever consequentialist defender would attack this by pointing to **expressive and signaling costs**. Even if specific deterrence is useless, letting Aris go sends a signal that attempted murder is tolerated when it fails, which could erode internalized moral norms against violence. If the public perceives the law as lenient on intent because of lucky outcomes, it might weaken the normative barrier against trying other methods that *do* work, ultimately increasing long-term risk despite the current biochemical safety net.
