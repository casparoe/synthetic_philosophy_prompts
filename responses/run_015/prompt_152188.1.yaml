      *   *Revisable vs. Constitutive:* Strawson says constitutive. Incompatibilists say if they rest on false metaphysics, they are irrational/unfair, even if constitutive of current psychology.
      *   *Objective Attitude:* Strawson says it's limited. Incompatibilists (hard determinists) say it should be universalized.
      *   *Nature of Disagreement:* It is a **hybrid**. Part verbal (scope of "responsibility"), part substantive (metaphysics of desert), part empirical (psychology of moral emotions).
