      *   *Incompatibilist Critique (e.g., Galen Strawson, Derk Pereboom, Bruce Reimer):* Reactive attitudes presuppose "basic desert" or ultimate responsibility. If determinism is true, holding someone responsible in this deep sense is unfair/unjust, even if psychologically inevitable.
      *   *Compatibilist Defense (e.g., Watson, Wallace, Fischer):* Responsibility is about answerability or attributability, not metaphysical origination. Reactive attitudes are tools for moral communication, not retributive weapons.
      *   *The User's Insight:* The "emotional" vs. "structural/normative" split.

  3.  **Evaluate the User's Hypothesis (Skepticism Required):**
      *   *Is the distinction actually absent?* Not entirely. R. Jay Wallace (*Responsibility and the Moral Sentiments*) distinguishes between the *emotion* and the *normative expectation*. T.M. Scanlon talks about "impairment of relations." Restorative justice literature (Zehr, etc.) explicitly makes this split. So, the user's claim that it's "largely absent from philosophical literature" is slightly overstated, though perhaps absent from the *core* metaphysical debate about determinism.
      *   *Is the stalemate purely taxonomic?* No. There are deep metaphysical disagreements about the nature of causation and agency. Calling it "verbal" might understate the ontological commitments.
      *   *Is the Restorative Justice observation novel?* It applies pressure, but philosophers like Victoria McGeer have worked on "scaffolding" responsibility. The user's practical insight is valuable but needs to be integrated carefully without assuming philosophers haven't thought of "accountability without anger."

  4.  **Drafting the Diagnosis:**
