answer: |-
  Your observation from the field of restorative justice is sharp, and your hypothesis that the philosophical stalemate is partly taxonomic is plausible. However, you asked for skepticism regarding your premise that this distinction is "largely absent from the philosophical literature" and that a single diagnosis can capture such a heterogeneous dispute. I will not accommodate that premise politely. While your practical insight is valuable, the claim that philosophy has missed the distinction between emotional reactivity and structural accountability is overstated, and the hope that a taxonomic fix alone will dissolve a metaphysical deadlock is likely optimistic.

  Here is a diagnosis of the disagreement, a critique of your framing, and an assessment of what would actually count as progress.

  ### 1. Diagnosis: A Hybrid Disagreement, Not Merely Verbal

  You suggest the dispute is primarily verbal or taxonomic: compatibilists defending the *rationality of emotions*, incompatibilists defending the *fairness of normative demands*. This is a useful heuristic, but it simplifies the actual positions.

  **The Substantive Core:**
  The stalemate is not merely that sides are using "reactive attitudes" to mean different things. It is that they disagree on the **truth conditions of moral address.**
  *   **Compatibilists (e.g., R. Jay Wallace, T.M. Scanlon):** Argue that the normative demand *just is* the disposition to hold the attitude. For them, "accountability" is constituted by the expectation of regard. If the expectation is socially intelligible and the agent had the capacity to grasp the reason, the demand is fair, regardless of determinism. They do not separate emotion from structure as cleanly as you suggest; they view the emotion as the *enactment* of the structure.
  *   **Incompatibilists (e.g., Derk Pereboom, Galen Strawson):** Argue that the normative demand entails a claim about *metaphysical eligibility*. If I demand repair from you, I imply you could have done otherwise in a robust sense. If determinism is true, that implication is false, making the demand a form of coercion or injustice, regardless of whether the emotion feels rational.

  **The Taxonomic Overlap:**
  You are correct that "reactive attitude" is doing too much work. It conflates:
  1.  **Affective Blame:** The phenomenological sting of resentment.
  2.  **Liability Accountability:** The status of being an appropriate target of demands for repair.

  However, philosophers *have* noticed this. David Shoemaker distinguishes between *attributability* (character), *answerability* (reasons-responsiveness), and *accountability* (liability to sanctions). Victoria McGeer has written extensively on the "scaffolding" function of blame in restorative contexts. The literature is not blind to your distinction; rather, the metaphysical debate persists *despite* these distinctions because the incompatibilist insists that even "structural accountability" requires a metaphysical grounding (ultimate sourcehood) to be fair.

  **Verdict on Diagnosis:** This is not a purely verbal dispute. It is a **normative-metaphysical hybrid.** The sides agree on the psychology (mostly) but disagree on whether that psychology licenses a claim of *fairness* without libertarian free will. Your taxonomy identifies a friction point, but it does not resolve the underlying metaphysical worry about unfairness.

  ### 2. Critique of the Restorative Justice Premise

  You posit that restorative justice (RJ) reveals a separation between emotional reaction and structural accountability that philosophy ignores. I offer three skeptical pushbacks on this:

  **A. RJ Does Not Eliminate the Metaphysical Stakes**
  In RJ, when a victim demands "institutional repair" or "relational restoration" from an offender, they are still making a claim about the offender's agency. If the offender replies, "I was determined by my trauma and socio-economic conditions to harm you," the RJ mediator cannot simply say, "That doesn't matter for structural accountability." The legitimacy of the demand *does* rely on a notion of agency. If the offender is viewed as purely a vector of causal forces (the "objective attitude"), the demand for *their* active participation in repair collapses into mere management or therapy. RJ relies on the offender *owning* the act, which reignites the incompatibilist worry: Can they own it if determinism is true?

  **B. The Distinction is Already in the Literature**
  You state this distinction is "largely absent from the philosophical literature." This is empirically false.
  *   **P.F. Strawson himself** distinguished between reactive attitudes (interpersonal) and the objective attitude (treatment/management).
  *   **George Sher** and **Angela Smith** have argued for "non-volitional" responsibility, separating blame from control.
  *   **Restorative Justice Theory** (Zehr, Braithwaite) is itself a philosophical sub-genre that explicitly makes the distinction you claim is missing.
  The problem is not that the distinction is absent, but that the *metaphysical debate* (Compatibilism vs. Incompatibilism) has largely swallowed these nuances because the core question remains: *Is it fair to demand this of a determined agent?*

  **C. Emotion is Often Functional in RJ**
  Your observation suggests emotional resentment is separable from structural accountability. In practice, however, the emotional expression of resentment is often the *mechanism* that drives structural accountability. The "sting" communicates the severity of the norm violation. If you sanitize the process to remove the "reactive" element, you risk turning it into a bureaucratic transaction, which often fails to achieve restoration. The "heat" of the reactive attitude is sometimes necessary to validate the "light" of the structural repair.

  ### 3. What Would Count as Progress?

  Given the diagnosis that this is a normative-metaphysical hybrid rather than a simple verbal confusion, here is what would and would not count as progress.

  **What Would NOT Count as Progress:**
  *   **Purely Empirical Results:** Discovering that humans *can* psychologically separate anger from demands for repair does not tell us if it is *fair* to do so under determinism. (Is/Ought gap).
  *   **Purely Conceptual Stipulation:** Simply defining "Responsibility-Type-A" (emotional) and "Responsibility-Type-B" (structural) does not solve the incompatibilist challenge. They will simply ask if Type-B requires ultimate sourcehood.
  *   **Declaring the Stalemate Appropriate:** While Wittgensteinian quietism is an option, it abandons the practical stakes you are encountering in mediation.

  **What WOULD Count as Progress:**
  *   **A Normative Decoupling Argument:** Progress requires an argument showing that *structural accountability* does not presuppose *basic desert*. Compatibilists need to articulate a theory of "forward-looking responsibility" that satisfies the incompatibilist's demand for fairness without requiring libertarian free will. (e.g., arguing that fairness is about mutual recognition of vulnerability, not metaphysical origination).
  *   **Refining the "Objective Attitude":** Strawson treated the objective attitude as a temporary suspension of relationships. Progress would look like a robust theory of how the objective attitude can be the *default* for structural accountability (e.g., public health models of violence) while retaining reactive attitudes for intimate relationships. This would validate your RJ observation: perhaps institutional repair *should* be objective/structural, while interpersonal forgiveness remains reactive/emotional.
  *   **Pragmatic Justification:** An argument that even if incompatibilists are metaphysically right, the practice of holding agents structurally accountable is a "necessary fiction" or a "pragmatic imperative" for social cohesion, distinct from the truth-claims of metaphysics.

  ### 4. Conclusion on Your Hypothesis

  Your hypothesis is **partially correct but insufficient.**

  You are correct that the conflation of emotional blame and structural accountability muddies the water. Compatibilists often defend the *emotion* to save the *practice*, while Incompatibilists attack the *metaphysics* to undermine the *fairness*. Separating these allows us to see that one might reject retributive resentment (emotion) while retaining restorative demands (structure).

  However, you are incorrect that this distinction is absent from philosophy, and you are optimistic that this distinction alone resolves the dispute. The incompatibilist will concede the distinction but argue that *structural accountability* is still unfair if the agent is not an ultimate source. They will argue that demanding repair from a determined agent is like demanding repair from a hurricane that damaged your house—it might be practical to fix the roof, but it is a category error to hold the hurricane "accountable."

  **Final Recommendation:**
  Do not look for a single diagnosis of the entire debate. Instead, use your RJ data to pressure the **Compatibilist** flank. Challenge them to explain why "structural accountability" doesn't collapse into "management" (the objective attitude) without libertarian free will. If they can show that *answerability* is distinct from *causal origination*, your taxonomy becomes a powerful tool. If they cannot, the incompatibilist wins, and RJ must be reframed not as "justice" but as "conflict management."

  Your insight is a wedge, not a key. It opens the door to a more nuanced conversation, but it does not unlock the metaphysical room inside.
