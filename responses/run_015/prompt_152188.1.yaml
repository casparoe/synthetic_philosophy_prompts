      *   **Core Observation:** In restorative justice, participants distinguish between *emotional reactive responses* (resentment, indignation) and *structural accountability* (demands for repair/restoration). The user suspects this distinction is missing in the philosophical literature on Strawsonian reactive attitudes.
      *   **Core Hypothesis:** The stalemate between compatibilists and incompatibilists regarding reactive attitudes and determinism is partly taxonomic/verbal. Compatibilists focus on the rationality of emotional dispositions; incompatibilists focus on the justification of normative demands for answerability (ultimate sourcehood).
      *   **Task:** Diagnose the nature of the disagreement (empirical, verbal, two different questions, ill-posed?), propose what would count as progress, and *critically evaluate the user's premise* (treat with skepticism, don't just be polite).

