  You must drop or substantially qualify commitment (1) because it is logically incompatible with the moral verdicts you want to secure in (3) and (4).

  The tension between (1) and (3) is fatal. In the teenager case (a same-number, different-people case), the child conceived early is not worse off than they would otherwise have been, since otherwise they would not exist. Commitment (1) therefore entails the act is not wrong, while (3) entails it is. Similarly, the tension between (1) and (4) is fatal regarding climate policy: if policy choices determine who exists, future generations are not worse off than they would otherwise have been, so (1) implies we owe them nothing, contradicting (4). These are not merely apparent tensions; they are direct logical contradictions given your definition of "plain counterfactual sense" in (1).

  The tension between (1) and (2) is only apparent and dissolves upon distinguishing value from obligation. You can consistently hold that a larger happy population is impersonally better (axiology) but that we have no person-affecting reason to create it (obligation), provided you maintain the Asymmetry. Likewise, the tension between (2) and (3) dissolves if you treat them as applying to different domains: (2) governs different-number choices, while (3) governs same-number choices. However, these distinctions only work if you allow impersonal value to ground obligation in same-number cases, which (1) explicitly forbids. Finally, (5) is threatened by keeping (1), because no general axiology based on (1) will generate the verdicts in (3) and (4); you would be forced to rest those verdicts on brute intuitions, violating your methodological constraint.

  Dropping (3) and (4) to save (1) costs you the practical moral stakes of the paper; you would be forced to conclude that climate change does not wrong future generations and that reckless conception is not wrong, which undermines the purpose of addressing the nonidentity problem. Dropping (1) costs you theoretical purity—specifically, the Narrow Person-Affecting View—but allows you to adopt a hybrid axiology that preserves your moral commitments. This is the cheapest revision because it aligns with standard solutions in population ethics (like Parfit's Principle Q) that retain the Asymmetry while solving the nonidentity problem.

  To buy consistency cheapest, replace (1) with a hybrid principle: an act is wrong if it is worse for some particular person *or* if it is impersonally worse in same-number cases. This allows you to derive (3) and (4) from your general axiology (satisfying 5), maintain the Asymmetry in different-number cases (satisfying 2), and avoid the counterintuitive results of the strict person-affecting view.
