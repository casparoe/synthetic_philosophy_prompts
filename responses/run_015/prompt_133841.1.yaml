      *   *Section 2: Detailed Analysis of Real Tensions.*
          *   For (3)/(4): Explain why "objective fact" implies a view from nowhere. Suggest shifting to "robust instrumental reliability."
          *   For (2)/(5): Explain immanent critique.
      *   *Section 3: The Single Revision.*
          *   Target (3). Change "objective comparative fact" to "intersubjectively robust instrumental superiority relative to shared human vulnerabilities."
      *   *Section 4: Conclusion.*

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the specific motivation incompatibility?
      *   *Correction:* For (3)/(4), the motivation for (3) is to avoid relativism (science *is* better). The motivation for (4) is to avoid metaphysics (no God's eye view). The conflict is that avoiding relativism seems to require metaphysics. The solution is to ground "better" in *human nature/suffering* (naturalism) without grounding it in *Reality's Structure* (metaphysics).
      *   *Check:* Did I address (6) vs (5)?
