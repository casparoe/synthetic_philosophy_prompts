  8.  **Final Polish:** Ensure tone is analytical and precise, matching the user's philosophical literacy. (Use terms like "immanent critique," "causal friction," "teleological," "ontological commitment.")

      *(Self-Correction on the "Single Revision"):* Is modifying (3) enough? If I change (3) to say "Science is better for *our* goals," does that weaken the anti-relativist sting? Yes. But it saves the system. Alternatively, modifying (4) to allow a "naturalistic" standpoint (causal, not justificatory) might work. But (4) says "every evaluation... presupposes values." A naturalistic standpoint isn't evaluative. So (3) is the one that needs to stop claiming "objective fact" in a strong sense. I will recommend refining (3).

      *Wait, one more check on (2) vs (5).* If justification is *entirely* internal (2), can I ever legitimately critique another community? Only if I can enter their circle. (5) says I can. The tension is: Do I critique them using *my* norms or *theirs*? (5) says "in terms that its own practitioners can recognize." This implies *their* norms. So (2) holds. The tension is only if (5) implies I use *my* norms to judge *them*. I need to point out this distinction.

