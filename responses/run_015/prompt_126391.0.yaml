  hey im a dev with basically zero formal philosphy background, but ive been reading about the knobe effect -- those experiemnts where people call harmful side-effects intentional but not the good ones. its so asymetrical.

  anyway, G.E.M. Anscombe died in 2001, just before this experimental-philosophy wave really hit, and she wrote Intention in 1957 about practical reasoning. if she was around today and saw the survey data, what do you think she'd actually say? not just about the asymmetry itself, but about whether it shows "intention" is just folk psychology that breaks when you scale it to algorithms.

  heres my own weird injection: i call it the "inverse knobe" for distributed systems -- when a reccomendation algorithm causes harm people blame the architect's intent, but when it accidentally helps they blame the user for misusing it. totally made up, not a real theory, just my brain making connections.

  would Anscombe reject the whole survey-based method, or would she think the asymmetry reveals something deep about practical reasoning that applies even to code? and specifically, do you think she'd laugh at my inverse-knobe idea, or take it seriously as a structural analog?

  no need for citations or reading lists -- just want your gut take.
