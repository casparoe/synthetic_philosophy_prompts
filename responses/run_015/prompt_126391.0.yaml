      *   *Does it break with algorithms?* Yes, but not because of scale. Because algorithms lack *practical knowledge*. They don't ask "Why?" They don't have ends they seek for the sake of something else.
      *   *Nuance:* She would distinguish between the *programmer's* intention and the *system's* operation. The system has no intention. The Knobe effect applied to AI is really about how *we* attribute intention to the creators.

