      *   *Core Thesis:* Intention isn't a mental event or a feeling preceding action. It's found in the *description* of the action under which it is done. "Why?" is the crucial question. If "I don't know" is a valid answer, it's non-intentional. If "Because I wanted to" is the answer, it's intentional.
      *   *Practical Knowledge:* Knowledge *in* intention, not just observational knowledge. I know what I'm doing because I'm doing it, not because I'm watching myself.
      *   *Moral Context:* She was a Wittgensteinian and a Catholic. She cared deeply about moral responsibility. The description of the action matters morally (e.g., "pumping water" vs. "poisoning the inhabitants").
      *   *Style:* Rigorous, analytic, somewhat impatient with empirical psychology if it misses the conceptual point. She distinguishes between *what happened* and *what was intended*.

  3.  **Address Question 1: The Knobe Effect & Survey Method:**
      *   *The Knobe Effect:* People say the CEO *intentionally* harmed the environment (bad side effect) but did *not intentionally* help it (good side effect), even though the mental state (indifference) is identical.
      *   *Anscombe's likely reaction to Method:* She would be skeptical of surveys asking "Did he do it intentionally?" as if it's a fact about the world like "Is the ball red?" For her, intention is tied to the *practical syllogism* and the agent's own account. Asking a third-party observer about someone else's intention is already a step removed from the primary phenomenon.
      *   *Anscombe's likely reaction to Asymmetry:* She wouldn't be shocked. She argues that intention is tied to the *description* of the act. If the act is described as "violating a norm," the intention attaches differently than if it's "supererogatory good." She might say the survey reveals something about *moral judgment* influencing *action description*, not necessarily that the concept of intention is broken. The "Why?" question yields different answers in moral contexts.

  4.  **Address Question 2: Folk Psychology & Algorithms:**
