  # Q&A Prep Sheet: Distributive Pairwise Screening (DPS)
  **Talk Date:** Next Tuesday
  **Audience Mix:** Kantians (Majority), EAs (2), Decision Theorist (1)

  ## Upfront Concessions
  *Do not wait to be cornered on these. Weave them into your opening or closing remarks to disarm critics.*
  1.  **DPS is not a tie-breaker:** Concede that if two parties have *identical* valid claims (e.g., life vs. life), DPS identifies the impasse but doesn't solve it. You need a secondary randomization mechanism (lottery), which you accept.
  2.  **Scope Limitation:** Acknowledge DPS is designed for **non-ideal, finite populations**. It is not a complete theory of global justice or long-termism (this pre-empts the EA and Infinite objections).

  ---

  ## Likely Objections & Replies

  ### 1. The "Numbers Problem" (From the Effective Altruists)
  **The Question:** "Let's say a dam is breaking. On one side, one person will lose a leg. On the other, a million people will lose a leg. Your view says we check pairwise. The one person has a valid complaint against losing their leg. The million have the same complaint. If you don't aggregate the million's suffering to outweigh the one, aren't you forced to let the million suffer just to respect the one? That seems morally monstrous."

  **The Reply (2 mins):**
  "It sounds monstrous only if we assume the only metric is total suffering. DPS asks: *Could the one person reasonably reject a principle that sacrifices them for the million?* Yes. Could the million reject a principle that sacrifices them for the one? Also yes.
  Here is the crucial distinction: DPS doesn't ignore the million. It refuses to treat them as a *single weighted block* that crushes the individual. When we screen pairwise, we see that the *strength* of the claim is identical. Leg vs. Leg.
  In this specific tie-case, I concede we need a lottery. But consider a different case: One person loses their life vs. a million lose a finger. Aggregation says save the million fingers. DPS says the life claim clears the bar of reasonableness; the finger claims do not override it. The 'monstrous' result only appears if you assume numbers *must* count. I'm arguing they shouldn't count when they override a fundamental veto. The million are not disrespected; their claims are acknowledged but found insufficient to violate the one's right to life."

  **🚩 Soft Spot:** The "Tie Case." If the harms are identical (Life vs. Life), DPS stalls. You rely on the lottery concession here. If they press on why the lottery is permissible but aggregation isn't, you're on shaky ground.

  ### 2. The "Aggregation Creep" (From the Kantians)
  **The Question:** "You say you don't aggregate, but you mentioned 'pooling' if every pair clears the bar. Isn't that just aggregation with an extra step? If everyone clears the bar, do you then maximize utility? If so, you've smuggled consequentialism back in through the side door."

  **The Reply (2 mins):**
  "That's a vital distinction. 'Pooling' in my framework isn't summing utility; it's validating the *principle*.
  Think of it like a safety inspection on a plane. You check every bolt (pairwise screening). If every bolt holds (clears the bar), the plane is cleared for takeoff (pooling permission). You aren't adding up the strength of the bolts to see if they hold the wing; you're verifying that *no single bolt* is a point of failure.
  If I allowed aggregation, I'd say: 'This bolt is weak, but the other ten are strong enough to compensate.' I don't say that. I say: 'If any bolt fails the stress test, the principle is rejected.' The 'pooling' is simply the collective authorization that occurs *after* individual vetting, not a mathematical sum that overrides the vetting. It preserves the separateness of persons while allowing cooperative schemes."

  **🚩 Soft Spot:** The definition of "clears the bar." If "clearing the bar" involves comparing intensities of reasons across people, the Kantians might argue you're still making interpersonal comparisons that amount to aggregation.

  ### 3. The "Money Pump" (From the Decision Theorist)
  **The Question:** "Your pairwise screening creates intransitive preferences. If A > B pairwise, and B > C pairwise, but C > A pairwise, you're vulnerable to a money pump. You'll pay to switch from A to B, B to C, and C to A, ending up where you started but poorer. How is DPS consistent with rational choice theory?"

  **The Reply (2 mins):**
  "I accept the intransitivity charge but reject the premise that moral reasonableness must map onto expected utility axioms. Expected utility theory is designed for *risk* and *preference satisfaction* under uncertainty. DPS is a theory of *justification* between agents.
  When I reject a principle because it burdens Agent X, I'm not expressing a preference; I'm citing a normative constraint. Normative constraints don't have to be transitive in the same way preferences do. Consider the game Rock-Paper-Scissors. It's intransitive, but it's not 'irrational.'
  If my theory prevents me from being money-pumped in the real world, it's because moral deliberation isn't a market transaction. I'm not trading rights for utility. I'm testing the validity of rules. If that violates VNM utility axioms, so much the worse for applying those axioms to deontic logic."

  **🚩 Soft Spot:** Decision Theorists hate "ethics is different." They view this as an ad hoc escape hatch. Be prepared for them to press on *why* rationality doesn't apply to moral choice.

  ### 4. The Nightmare Question (Infinite Populations)
  **The Question:** "What happens when the population is infinite? If you have an infinite number of people with small complaints, does your pairwise filter break? Can an infinite sum of small grievances ever clear the bar, or does the screening process never terminate?"

  **The Reply (2 mins):**
  "This is the hardest edge case, and I'll be direct: DPS is a tool for non-ideal, finite moral contexts. It's built for human-scale institutions and policy, not cosmological ethics.
  In infinite cases, standard aggregation *also* breaks—you get infinities that cancel out or dominate arbitrarily. My approach doesn't make the math worse; it just refuses to solve the problem by summing the unsolvable.
  If we face a policy affecting indefinite future generations, DPS defaults to a 'do no harm' baseline for the identifiable present agents. We don't sacrifice the concrete individual for the abstract infinite. I'd rather admit the theory has a boundary than force a mathematical solution that violates the separateness of persons."

  **🚩 Soft Spot:** This is your weakest theoretical point. It sounds like "it works everywhere except where it doesn't." Own it confidently as a feature (finitude) not a bug.

  ---

  ## Housekeeping: The Typo on Slide 4
  **Issue:** You wrote 'reasaonableness'.
  **Verdict:** **Fix it.**
  **Why:** You are defending a theory based on *reasonableness*. Having a typo in the core term undermines the precision of your argument. It signals carelessness.
  **Action:** If you can edit the deck before Tuesday, do it. If you are presenting from a PDF you can't change, address it verbally in the first 30 seconds: *"You'll notice on slide 4 I've misspelled 'reasonableness.' I've been told this is ironic given the topic, but I assure you the concept is spelled correctly in the argument."* Then move on. Do not let it become a running joke.

  ---

  ## Strategic Summary
  *   **Play to the Kantians:** They are your majority. Keep the language focused on *justification* and *veto power*, not outcomes.
  *   **Contain the EAs:** Don't try to convince them aggregation is wrong. Convince them DPS handles the *structure* of rights better, even if outcomes differ.
  *   **Don't Bait the Decision Theorist:** Acknowledge the formal inconsistency but frame it as a category error (Ethics ≠ Economics).
  *   **Own the Limits:** Admitting DPS doesn't solve infinite cases or perfect ties makes you look more rigorous than if you claim it does.
