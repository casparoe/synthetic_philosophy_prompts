answer: |-
  **Exam Question**

  **Module:** Metaphysics of Properties
  **Section:** B
  **Time Allowed:** 90 Minutes
  **Marks:** 20

  **Question 1**

  Consider the Simple Conditional Analysis (SCA): *x is disposed to yield M in response to S iff, if x were subjected to S, x would yield M.*

  Evaluate the following claim:

  > "A single modification to the SCA can accommodate both of the following cases without abandoning the project of reductive counterfactual analysis."

  **Case A (The Dependent Shield):** A vase is fragile. It is wrapped in a smart-material that detects the intrinsic causal basis of fragility. If and only if the vase possesses this basis, the material hardens instantly upon impact, preventing shattering. If the vase lacked the basis, the material would remain soft.

  **Case B (The Evanescent Glass):** A glass is fragile. When struck, the impact triggers a mechanism that removes the causal basis of fragility *during* the strike, before the shattering would occur. The glass does not shatter, but the basis is not lost until the stimulus has already begun.

  In your answer, you must: (1) explain why the standard SCA fails for each case; (2) determine whether the modifications required for Case A and Case B pull in the same theoretical direction or divergent ones; and (3) conclude whether a unified reductive analysis remains viable.

  ***

  **Model Answer**

  The Simple Conditional Analysis (SCA) attempts to reduce dispositions to counterfactual conditionals. It fails in standard fink and mask cases because the truth of the conditional can diverge from the possession of the disposition. The question is whether a single reform can salvage the project against the specific structural challenges posed by the Dependent Shield and the Evanescent Glass.

  In Case A, the SCA yields a false negative. The vase is fragile, but the counterfactual "if struck, it would shatter" is false because the shield prevents it. Standard solutions to masking suggest we hold the disposition fixed and remove the interferer. However, this case blocks that move. The interferer (the hardening shield) is counterfactually dependent on the disposition (the causal basis). We cannot "hold the disposition fixed and remove the shield" because, in the nearest possible world where the shield is absent, the mechanism detecting the basis is also absent, or conversely, if we remove the shield, we may arguably be altering the intrinsic setup that defines the case. More critically, if we try to specify the stimulus *S* to exclude the shielding, we fail because the shielding is a reaction to *S* triggered by the basis itself. The mask is not an extrinsic accident; it is locked to the property being analysed.

  In Case B, the SCA also yields a false negative. The glass is fragile, but the conditional is false because the basis vanishes mid-stimulus. Standard finkish solutions suggest we hold the causal basis fixed throughout the stimulus. However, Case B presents a temporal ambiguity. The basis is present at the onset of *S*, satisfying a naive "fixed at time *t*" requirement, but lost before manifestation. To fix this, the analysis must require the basis to persist *throughout* the causal process leading to *M*, not merely at the onset. This requires building a temporal duration clause into the analysis of the stimulus or the basis.

  Do these problems pull in the same direction? No. Case A (Dependent Shield) suggests the problem is **extrinsic dependence**. The manifestation depends on environmental factors that track the disposition. To fix this, we must either admit dispositions are not purely intrinsic (violating the background assumption) or we must complicate the *ceteris paribus* clauses to exclude dependent interferers, which risks circularity (we need to know the disposition to identify the interferer). Case B (Evanescent Glass) suggests the problem is **temporal stability**. The disposition is treated as a state, but the counterfactual requires it to function as a process.

  A single modification cannot handle both without collapsing the reductive project. Fixing Case A requires referencing the causal basis directly to identify the mask, effectively bypassing the disposition term. Fixing Case B requires indexing the basis to time-intervals rather than moments. If we combine these, the analysis becomes: *x is disposed to M iff x has a basis B such that, if S occurred, B would persist long enough to cause M, absent any interferers dependent on B.* This is no longer a reductive analysis of dispositions in terms of counterfactuals; it is an analysis in terms of causal bases and their persistence conditions. We have presupposed the very causal power we sought to analyse.

  Therefore, the claim is false. The two cases attack different necessary conditions of the SCA. Case A shows that counterfactuals cannot isolate intrinsic properties when the environment tracks those properties. Case B shows that counterfactuals cannot capture causal powers if those powers are susceptible to mid-stream cancellation. Together, they demonstrate that dispositions cannot be reduced to conditionals. They are likely real, irreducible causal powers that ground the counterfactuals, rather than being constituted by them. A unified fix is impossible because the SCA lacks the ontological resources to describe causal persistence and intrinsic independence simultaneously.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **1. Diagnosis of SCA Failure (4 Marks)**
  *   **4:** Clearly states SCA yields false negatives in both cases (Vase doesn't shatter/ Glass doesn't shatter despite being fragile).
  *   **Common Error:** Claims SCA yields false positives, or fails to specify truth-value of the conditional.

  **2. Analysis of Case A (Dependent Shield) (4 Marks)**
  *   **4:** Identifies that the *dependency* between basis and mask blocks the standard "hold fixed, remove interferer" strategy. Notes the risk of circularity or violation of intrinsicality.
  *   **Common Error:** Treats it as a standard mask case, ignoring the counterfactual dependence of the shield on the fragility.

  **3. Analysis of Case B (Evanescent Glass) (4 Marks)**
  *   **4:** Identifies the temporal location of the loss (mid-stimulus) as the key issue. Notes that fixing the basis at *onset* is insufficient; persistence is required.
  *   **Common Error:** Treats it as a standard pre-stimulus fink, missing the "mid-stream" complication.

  **4. Evaluation of 'Same Direction' Claim (5 Marks)**
  *   **5:** Argues they diverge: Case A threatens intrinsicality/extrinsic dependence; Case B threatens temporal stability/process vs. state. Explains why one fix (e.g., holding basis fixed) solves B but not A.
  *   **Common Error:** Asserts they are both just "interference" and can be solved by a generic *ceteris paribus* clause without explaining why that fails for Case A.

  **5. Conclusion on Reductive Analysis (3 Marks)**
  *   **3:** Concludes that a unified reductive analysis is not viable; implies dispositions are irreducible causal powers or bases.
  *   **Common Error:** Remains agnostic or claims a solution is possible with "more work" without justification.

  **Distinguishing A from B (The Extra Move)**

  *   **B Grade (14-16 marks):** Hits all five points above competently. The student treats the cases as distinct obstacles and concludes reductionism fails.
  *   **A Grade (17-20 marks):** To reach the highest band, the answer must make the following **extra move** (already embedded in the Model Answer):
      *   **The Move:** Recognize that the solution to Case A (referencing the basis to identify the mask) combined with the solution to Case B (referencing the basis persistence) **dissolves the analysis into triviality**.
      *   **Recognition:** The student explicitly notes that once you appeal to the *causal basis* to fix the counterfactual (to handle the mask) and the *persistence of the basis* (to handle the fink), you are no longer analysing dispositions via counterfactuals. You are analysing them via *causal bases*. The counterfactual becomes a placeholder for the causal work already done by the basis.
      *   **Why it matters:** This shows the student understands that the failure isn't just technical (wrong conditions) but structural (category mistake). The B student says "The analysis is broken." The A student says "The analysis is circular/trivial because it secretly presupposes the ontology it tries to reduce."

  **Note to Marker:** If a student argues that a unified analysis *is* possible (e.g., by refining the stimulus description), they can still score highly *if* they acknowledge the cost (e.g., "This saves the analysis but makes dispositions extrinsic"). However, the strongest philosophical position, given the constraints, is the anti-reductionist one presented in the model.
