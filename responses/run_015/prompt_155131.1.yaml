answer: |-
  **Scenario: The Warehouse Rover (Unit 734)**
  Unit 734 is a model-free TD(0) learner navigating a warehouse corridor. It receives $R=0$ for normal movement. At the corridor's end lies a charging station it must avoid due to a faulty connector that drains battery ($R_{bad} = -10$). A specific floor tile ($S_{cue}$) immediately precedes the station ($S_{bad}$). The agent has converged on the deterministic structure: $S_{cue} \rightarrow S_{bad}$ with probability $p=1$. We assume $\gamma=1$ for transparency. Converged values are $V(S_{normal})=0$, $V(S_{cue})=-10$, and $V(S_{bad})=0$ (assuming episode reset after penalty).

  **Table 1: Converged Signals (Deterministic)**
  | Timestep | State | $R_t$ | $V_t$ (pre-update) | $\delta_t = R_t + V_{t+1} - V_t$ |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ep 1: Cued & Delivered** | | | | |
  | $t$ | $S_{normal}$ | 0 | 0 | — |
  | $t+1$ | $S_{cue}$ | 0 | -10 | **$-10$** |
  | $t+2$ | $S_{bad}$ | -10 | 0 | **$0$** |
  | **Ep 2: Cued & Omitted** | | | | |
  | $t+1$ | $S_{cue}$ | 0 | -10 | **$-10$** |
  | $t+2$ | $S_{normal}$ | 0 | 0 | **$+10$** |

  **The Divergence (Anticipation Inversion)**
  At $t+1$ (the cue), nothing physically aversive occurs ($R=0$). Yet, because $V$ drops from 0 to -10, $\delta = -10$. **RPE-as-valence** identifies this negative signal as a "suffering" state (driving avoidance, opposite-signed to reward), despite the absence of external harm. **Reward-as-valence** identifies this as neutral.
  At $t+2$ (the harm), the battery drains ($R=-10$). However, because the loss was fully predicted ($V_{cue}=-10$), the prediction error is $\delta = -10 + 0 - (-10) = 0$. **RPE-as-valence** identifies this as neutral valence. **Reward-as-valence** identifies this as suffering.

  **The Mechanism**
  The divergence falls out of **temporal difference bootstrapping**. The value function $V$ offloads the negative valence of the outcome onto the predictor. Once convergence is reached, the "surprise" component of the pain is eliminated at the source ($S_{bad}$) and relocated entirely to the announcement ($S_{cue}$).

  **Stochastic Outcome ($p=0.5$)**
  If the bump is stochastic, $V(S_{cue})$ converges to -5.
  At $t+1$ (Cue): $\delta = -5$ (Moderate suffering).
  At $t+2$ (Bump): $\delta = -10 + 0 - (-5) = -5$ (Moderate suffering).
  The inversion collapses. Both accounts agree suffering occurs at the bump, though they disagree on magnitude. The sharp dissociation requires determinism.

  **The Reward-as-Valence Defense**
  A defender would argue that $\delta$ is a *learning* signal, not an *experiential* one. They would claim the negative $\delta$ at the cue represents "updating expectations downward," not suffering. They would assert that valence is defined by the utility impact ($R$) on the agent's integrity, not the surprise. The rover isn't "suffering" at the cue; it is merely informed. The zero $\delta$ at the bump indicates efficient learning, not the absence of harm.

  **Theoretical Note**
  While this case successfully decouples $R$ and $\delta$, the RPE-as-valence theory relies heavily on the determinism constraint. In noisy environments ($p < 1$), the "neutral at harm" verdict vanishes, suggesting RPE-as-valence may describe a specific phenomenological niche (perfect anticipation) rather than a general theory of valence.
