  ### Example: The Autopoietic Sculpture

  To illustrate this conceptual issue, consider a work of bio-art known as **"The Autopoietic Sculpture."** This artwork consists of a genetically engineered coral structure. To preserve the piece against entropy and death, a continuous, nanotechnological maintenance protocol replaces the coral's living biological cells one by one with synthetic analogues. These analogues are structurally and functionally identical to the original cells but differ in their chemical origin (synthetic vs. organic).

  **The Divergence:**
  The divergence in persistence conditions arises from the conflict between the artwork's identity and the identity of its original matter:
  1.  **The Object (The Artwork):** Intuitively, the sculpture persists through the total replacement of its parts. This aligns with the "Ship of Theseus" intuition, where historical and functional continuity preserves the object's identity despite material turnover.
  2.  **The Constituent Matter (The Original Aggregate):** The specific aggregate of original biological cells does *not* persist. Under the principle of Mereological Essentialism, an aggregate of parts is identical to those specific parts; removing even one cell destroys the original aggregate.

  Thus, the Object survives the process, while the Constituent Matter ceases to exist.

  ### Theoretical Resolution

  Resolving this divergence does **not** require treating constitution as a three-place relation. A standard **two-place constitution view** can successfully accommodate the scenario by redefining the modal properties of the constituted object through **Sortal Sensitivity**.

  #### 1. Why a Three-Place Relation is Not Required
  A three-place relation (among Form, Present Matter, and Origin-Material) attempts to solve the problem by grounding the object's identity in its history. It argues that the synthetic matter constitutes the artwork *because* it stands in a specific causal relation to the origin-material.

  While this explains the *normative* link between the new matter and the old object, it is metaphysically unnecessary to resolve the logical divergence. If constitution requires the "Origin-Material" to exist as a relata, the relation might break when the original aggregate ceases to exist. The divergence is better explained by distinguishing the entities themselves rather than complicating the relation between them.

  #### 2. The Two-Place View via Modal Redefinition
  A standard two-place view ($x$ constitutes $y$) resolves the divergence by accepting that the Object and the Matter are distinct entities that coincide in space and time but possess different **modal profiles**. We "redefine" the modal properties of the object to allow for material flexibility:

  *   **Redefining the Object's Modality:** We treat the Artwork as falling under a sortal (e.g., "Artifact" or "Organism") that grants it the modal property of **Material Contingency**. This means it is *not* essentially tied to its original atoms; it can survive the loss and replacement of parts provided spatiotemporal continuity is maintained.
  *   **Redefining the Matter's Modality:** We treat the Constituent Matter as falling under a sortal (e.g., "Aggregate") that grants it the modal property of **Mereological Rigidity**. This means it *is* essentially tied to its parts; it cannot survive their removal.

  **Conclusion:**
  The divergence is resolved by acknowledging that the Object and the Matter are **non-identical**. By redefining the Object's modal properties to prioritize functional/historical continuity over material composition, the two-place view accommodates the replacement without logical contradiction. The Object persists because it has different persistence conditions than the Matter it is made of.
