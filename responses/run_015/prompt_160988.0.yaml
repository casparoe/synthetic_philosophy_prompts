  IBE remains valid because true explanation is an act of exclusion. It tells you not just what happened, but what could not have happened given the mechanism proposed. If you cannot specify what would prove you wrong, you haven't explained anything; you've merely described a worldview. By folding the mirror test into the criteria for "best," we salvage IBE from storytelling. We demand that explanations be fragile. Only those that break under the wrong conditions are strong enough to hold the truth.
