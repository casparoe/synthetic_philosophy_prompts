      *Drafting text:*
      Inference to the best explanation survives the threat of ad hoc absorption, but only if we accept that a "good" explanation must risk being wrong.

      Your intuition about the mirror test captures a vital truth often obscured by the language of "loveliness": explanatory power isn't just about accommodating data; it's about constraining it. Your brother-in-law's theory fails not because it's complex, but because it is infinitely flexible. It bends to fit any shape, meaning it predicts no shape in particular. If a hypothesis can explain clean water and contaminated water with equal ease by shifting the blame to hidden agents, it has not explained the clean water; it has merely insulated itself from reality.

      Your roommate is technically correct that this maps neatly onto Bayesian inference. In Bayesian terms, a hypothesis that absorbs every counterexample by adding auxiliary assumptions inflates its complexity without improving its likelihood ratio. Every ad hoc clause ("the lab is corrupt," "the reporter was paid") drags down the prior probability. A model that requires ten new assumptions to fit one data point is mathematically penalized. However, reducing IBE solely to Bayes misses the normative force of the mirror test. Bayes tells you how to update confidence; the mirror test tells you what counts as a hypothesis worthy of updating. Without the mirror test, you can construct a Bayesian model for anything, no matter how delusional, provided you assign sufficiently motivated priors.

      So where is the line between your team's valid dismissal of logging artifacts and your brother-in-law's invalid dismissal of water tests? The distinction lies in independent testability. When your team dismisses a dashboard spike as a logging artifact, you are appealing to a known failure mode of the logging system, verified independently of the incident at hand. The "artifact" hypothesis exists whether or not this specific spike occurred; it makes predictions about other logs, other times, other services. Your brother-in-law's conspiracy mechanisms exist *only* to save the theory from the water tests. They are born at the moment of contradiction and serve no other purpose. Good absorption appeals to causal structures already established; bad absorption invents causal structures solely to neutralize friction.

