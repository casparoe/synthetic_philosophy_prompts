  Your intuition about the mirror test captures a vital truth often obscured by the language of "loveliness": explanatory power isn't just about accommodating data; it's about constraining it. Your brother-in-law's theory fails not because it's complex, but because it is infinitely flexible. It bends to fit any shape, meaning it predicts no shape in particular. If a hypothesis can explain clean water and contaminated water with equal ease by shifting the blame to hidden agents, it has not explained the clean water; it has merely insulated itself from reality. It fails the mirror test because it treats the actual outcome as inevitable regardless of the facts, which is the hallmark of storytelling, not science.

