answer: |-
  # Session Plan: The Architecture of Accountability
  **Course:** Advanced Philosophy of Decision  
  **Duration:** 75 Minutes  
  **Participants:** 18 Students  
  **Materials:** Choice Sheets (18), Role Cards (18), Gamble Deck (9 sets), Whiteboard/Projector.

  ---

  ## Phase 1: The Trustees' Dilemma (20 Minutes)

  **Objective:** Elicit the common-consequence preference pattern without naming it, framing outcomes as collective accountability rather than individual gain.

  **Setup:**
  Distribute **Choice Sheets**. Tell students they are acting as Trustees of a "Community Relief Fund." Their choices determine how points are allocated to vulnerable groups. There is no real money; points contribute to their seminar participation grade (participation only, not accuracy).

  **Instructions (Read Aloud):**
  > "You manage a Fund of 1,000 Points. You must make two separate allocation decisions. These decisions are independent. In each pair, choose the option you believe best fulfills your duty as a Trustee.
  >
  > **Decision 1:**
  > *   **Option A:** 100% certainty that 500 people receive aid.
  > *   **Option B:** 89% chance 500 people receive aid; 10% chance 2,000 people receive aid; 1% chance 0 people receive aid.
  >
  > **Decision 2:**
  > *   **Option C:** 11% chance 500 people receive aid; 89% chance 0 people receive aid.
  > *   **Option D:** 10% chance 2,000 people receive aid; 90% chance 0 people receive aid.
  >
  > Record your choices privately. Do not discuss. Hand in your sheets now."

  **Facilitator Action:**
  Collect sheets immediately. Tally the results quickly (mentally or on a hidden sheet). Look for the specific pattern: **A over B** (Certainty) and **D over C** (Risk). This is the target violation.

  ---

  ## Phase 2: The Defense (25 Minutes)

  **Objective:** Force students to experience the conflict between Expected Utility (EU) consistency and Scenario-Integrated coherence.

  **Setup:**
  Divide the room into 9 pairs. In each pair, assign one **Defender** (student who made the choices in Phase 1) and one **Auditor**.
  *Note: If a student chose consistently (A/C or B/D), they are still Defenders, but the dynamic will differ. The activity is designed for those who chose A/D.*

  **Distribute Role Cards:**

  *   **Auditor Card:** "Your goal is to award **Coherence Points (0–10)** based on how well the Defender justifies their Phase 1 choices. You do not judge the choices themselves, only the argument."
  *   **Defender Card:** "You must justify your Phase 1 choices using **ONE** of the following two vocabularies. You cannot mix them."
      *   **Vocabulary 1 (Ex-Ante Maximization):** You must speak only of *weighted sums, linear probability, and aggregate expectation*. **Rule:** If you use this vocabulary, you must apply the same mathematical logic to both Decision 1 and Decision 2. If your choices contradict this logic, you must admit the error.
      *   **Vocabulary 2 (Scenario-Integrated):** You may speak of *counterfactual accountability, narrative consistency, and the weight of avoided alternatives*. **Rule:** You may argue that the 'meaning' of an outcome changes depending on what else was possible. However, you must explicitly state that you are rejecting the principle that 'common consequences should be ignored.'
      *   **The Bonus:** A **Rationality Bonus (5 Points)** is available *only* if your choices preserve Independence (i.e., if you chose A/C or B/D). If you chose A/D, you are ineligible for the Bonus regardless of your argument.

  **Procedure:**
  1.  **Preparation (5 mins):** Defenders prepare their argument. Auditors review the Phase 1 math (provide a small calculator or probability table if needed).
  2.  **Duel (15 mins):** Defenders argue; Auditors assign Coherence Points.
  3.  **Collection (5 mins):** Collect scores. Ask for a show of hands: "Who used Vocabulary 1? Who used Vocabulary 2?"

  **Facilitator Note:**
  Watch for Defenders who chose A/D trying to use Vocabulary 1. They will mathematically fail. They must admit incoherence. This creates the "cost" of the violation. Those using Vocabulary 2 will save face (Coherence Points) but forfeit the Bonus and admit to rejecting standard independence.

  ---

  ## Phase 3: The Surgical Swap (20 Minutes)

  **Objective:** Physically demonstrate the Independence Axiom mechanism and attempt a formal repair.

  **Setup:**
  Keep the pairs. Distribute **Gamble Decks**. Each deck has four cards representing the outcomes of Decision 1 and 2, but broken into components.
  *   Card 1: "89% Chance: 500 Aid"
  *   Card 2: "1% Chance: 0 Aid"
  *   Card 3: "10% Chance: 2,000 Aid"
  *   Card 4: "100% Chance: 500 Aid" (For Option A)
  *   Card 5: "89% Chance: 0 Aid" (For Decision 2 variants)

  **Instructions:**
  1.  **The Excision (5 mins):** "Lay out Option A and Option B from Decision 1. Identify the 'Common Consequence'—the outcome probability that is identical in both options. Physically remove that card from both options. Replace it with the common consequence from Decision 2 (89% chance of 0 Aid)."
      *   *Result:* Option A transforms into Option C. Option B transforms into Option D.
  2.  **Observation (5 mins):** "Look at your new pairs. Did your preference flip? If you preferred A over B, do you now prefer C over D? If your preference flipped, you have physically violated the Independence Axiom."
  3.  **The Axiom Draft (10 mins):** "Working together, draft a formal rule that permits your Phase 1 preference (A > B and D > C) without allowing total chaos (intransitivity). You must write this as a logical condition, not a sentence. Use the format below."

  **Template on Board:**
  > **Standard Independence:** $\forall L, L', K \in \text{Gambles}, \forall p \in (0,1]:$
  > $L \succeq L' \iff pL + (1-p)K \succeq pL' + (1-p)K$
  >
  > **Your Task:** Modify the right side or add a constraint clause $C(L, L', K)$ such that:
  > $L \succeq L' \iff [Modified Condition]$ **UNLESS** $C(L, L', K)$ **holds.**

  **Facilitator Prompt:**
  "Do not write 'unless it feels different.' You must define the condition under which the common consequence $K$ is *not* ignorable. Is it when $K$ is certain? When $K$ involves zero aid?"

  ---

  ## Debrief & Reveal (10 Minutes)

  **Objective:** Map the experience to formal theory and address limitations.

  **1. The Reveal (2 mins):**
  > "The pattern many of you felt—preferring certainty in the first pair but risk in the second—is known in decision theory as the **Allais Paradox**. The principle you tested in Phase 3 is the **Independence Axiom** of Expected Utility Theory."

  **2. Mapping Phase 1 & 2 (4 mins):**
  > "In Phase 2, you felt the structural tension.
  > *   **Vocabulary 1 (EU)** represents *Ex-Ante Maximization*. It treats choice as a calculation before the fact. If you violated independence, this vocabulary forced you to admit error.
  > *   **Vocabulary 2 (Scenario-Integrated)** represents *Ex-Post Accountability*. It treats choice as a narrative. When you chose Certainty in Decision 1, you were buying 'immunity from regret.' If you had chosen Risk and got 0, you would be accountable for losing the sure 500. In Decision 2, both options risked 0, so that accountability vanished.
  > *   **The Cost:** You felt the 'Rationality Bonus' slip away. Standard theory says you should not pay a price to violate independence. But you did. Why? Because standard theory ignores the *context* of the probability."

  **3. Mapping Phase 3 (2 mins):**
  > "In your axiom drafts, many of you tried to make the independence of irrelevant alternatives depend on the *certainty* of the common consequence. You were attempting to construct a **Weighted Utility** or **Regret** model. You found that you cannot simply 'fix' Independence with a small patch without risking transitivity (A > B > C > A). This is why the paradox remains a foundational problem."

  **4. Critical Pitfalls & Limitations (2 mins):**
  > **Pitfall:** "Some of you argued, 'I just hate risk.' That is **Risk Aversion**, not an Independence Violation. Risk aversion means you prefer 100% $50 to 50% $100. An Independence Violation is preferring 100% $50 to 90% $100, *but also* preferring 10% $100 to 11% $50. It is a *reversal* of preference, not just a dislike of variance. Scenario-integration explains the reversal; risk aversion does not."
  >
  > **Limitation:** "Finally, be frank about what this session could not do. We used points. Real utility requires **cardinal measurement**—knowing exactly how much more you value 2,000 aid over 500 aid. A role-play cannot capture the numerical intensity of your preferences across different risk domains. We simulated the *structure* of the conflict, but not the *metric* of the utility. To solve that, you need calculus, not cards."

  **Closing:**
  > "Keep your axiom drafts. Next week, we will compare them against Rank-Dependent Utility and Regret Theory formalizations."

  ---

  ## Facilitator Notes: Predicted Failures & Interventions

  **1. Conflation of Risk Aversion and Independence:**
  *   **Prediction:** Students will argue, "I chose A because I'm risk-averse."
  *   **Intervention:** "If you are risk-averse, you should also choose C over D, because C has a higher probability of winning (11%) than D (10%), even if the payout is lower. If you switched to D, you became risk-seeking. Why did your attitude toward risk change when the 89% common consequence was removed?"

  **2. The "Rationality Bonus" Confusion:**
  *   **Prediction:** Defenders who violated independence will try to argue for the Bonus using Vocabulary 2.
  *   **Intervention:** Remind them: "The Bonus is structural. It is reserved for those who satisfy the Independence Axiom. You have chosen to prioritize Coherence Points (social justification) over the Bonus (systematic consistency). Own that trade-off."

  **3. Axiom Drafting Paralysis:**
  *   **Prediction:** Students will struggle to write formal logic in 10 minutes.
  *   **Intervention:** Suggest they focus on the probability $p$. "Can you write a condition where Independence holds only if $p < 1$? Or only if the common consequence $K$ is not a 'zero' outcome?"

  **4. Cynicism about Points:**
  *   **Prediction:** "It's just points, I don't care."
  *   **Intervention:** "The stakes are not the points; the stakes are your justification. You are being asked to defend a logical contradiction. The discomfort you feel is the data."
