  **The Asymptote and the Estate Agent**

  Elias was signing the final papers to remortgage his flat when his colleague, Julian, walked into the study and stopped dead. On the desk lay a single printed ticket for the St. Petersburg lottery, costing £2,000, and a cheque for £1,000 made out to Elias, marked "Guaranteed Alternative."

  "You're swapping the grand for the ticket?" Julian asked, pointing at the cheque. "Elias, we've talked about this. The expected value is infinite, but no one pays infinite money."

  "I know," Elias said, not looking up from the signature line. "That's why I switched to expected utility. I'm using a logarithmic utility function, standard Bernoulli. It handles the divergence beautifully."

  "Right," Julian said, leaning against the doorframe. "So the concave curve tames the tail. The expectation converges to a finite number. And for your current wealth level, that certainty equivalent is roughly... what? Two hundred pounds?"

  "Actually," Elias said, capping his pen, "given my current leverage and risk profile, the log-utility valuation comes out to £1,500."

  Julian blinked. "So the math says the ticket is worth £1,500. The guaranteed cash is £1,000. But the buy-in is £2,000. You're paying a £500 premium to hold an asset your own model says is overpriced relative to the cost, just because it's underpriced relative to the guarantee?"

  "It's about the tail, Julian. The log function collapses the infinity, yes, but it leaves enough mass in the deep outcomes to justify preferring the gamble over the sure thing."

  "But not over the *cost*," Julian pressed. "To justify taking the £1,000 cash instead of the ticket, you'd need to apply a harder bound. A Menger-style cap. You'd have to assume your utility flattens out completely after a certain wealth level."

  "Exactly."

  "So why not apply the cap? It solves the paradox. It makes the ticket worthless compared to the rent money."

  Elias finally looked up, gesturing to the remortgage documents. "Because if I accept a hard upper bound on utility, I have to admit that there is a amount of money so large that having twice as much would make me no happier."

  "And?"

  "And I'm not willing to sign a philosophical statement saying I'm satiable," Elias said, sliding the ticket into his pocket. "I'd rather lose the flat than admit the marginal utility of a billion pounds is zero. At least this way, the bank thinks I'm reckless, not full."
