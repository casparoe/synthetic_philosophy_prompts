  **The question**

  The classical problem of induction asks whether we are justified in projecting past observations into the future. Hume argued this requires a principle of the uniformity of nature, but cannot justify it without circularity. Machine learning offers a formal analog: No-Free-Lunch theorems show that no learner outperforms another when averaged over all possible objective functions. The standard philosophical response is to ask if this kills induction. I propose a different question. Instead of asking if induction is justified, I ask what specific structural price must be paid to make it work. What is the minimal structural constraint on the space of possible worlds required for any inductive method to systematically outperform random guessing? I hypothesize that the classical principle of uniformity is better cashed out as a complexity bound on the world than as a claim about laws. The determinate question is whether there exists a threshold of structural simplicity—measured in terms of computability, stationarity, or the size of the hypothesis space—below which learning becomes possible and above which it collapses into the skeptical scenario. This shifts the debate from a quest for justification to a measurement of conditions. It treats the theorem as a diagnostic tool revealing which premises must be added to get a learner off the ground. Crucially, this frames the uniformity of nature not as a metaphysical claim about immutable laws, but as a constraint on the information density of the world.

  **Why the existing readings leave it open**

  Philosophers typically read No-Free-Lunch results in one of two ways, both of which stall progress. The skeptical reading argues that since no learner beats any other on average, induction is unjustified. This ignores that the average is taken over a specific distribution of worlds that no serious inductivist accepts. The deflationary reading argues that the theorem only bites if you assume a uniform prior over all functions, which is itself a strong assumption, so the result is just Hume's problem dressed in sums. While closer to the truth, this reading treats the uniform prior as a flaw to be dismissed rather than a variable to be analyzed. Both readings miss the diagnostic value of the theorem. They treat the result as a boundary line rather than a map. Furthermore, both rely on the idea that a uniform average represents neutrality or ignorance. I argue that choosing a uniform average is itself a specific assumption about the structure of possibility space. By failing to analyze what work that choice is doing, existing literature leaves open the crucial question: if we vary that assumption, how much structural commitment is actually required to escape the skeptical conclusion? The debate remains stuck because it treats the background assumptions as fixed rather than as the object of study.

  **Method**

  I will build a bridge between the finite spaces of standard machine learning proofs and the infinite spaces implied by philosophical skepticism. The project proceeds in three steps corresponding to the key wrinkles in the literature. First, I will analyze the transition from finite instance spaces to infinite world spaces. Standard theorems rely on counting arguments that do not hold in the continuous or unbounded spaces a Humean skeptic quantifies over. I will examine how measure theory replaces counting here and whether the uniform average critique survives this transition. Second, I will investigate universal learner results in computable settings that appear to offer a free lunch. I will determine whether these learners rely on hidden structural assumptions about computability that bypass standard constraints, clarifying whether induction is one thing or many. Third, I will treat the prior as a parameter rather than a fixed backdrop. I will map different philosophical stances on nature's uniformity to specific constraints on the hypothesis space, such as bounds on complexity or stationarity. This involves translating philosophical claims into formal bounds. The work is conceptual analysis supported by formal comparison, focusing on the relationship between the assumptions and the learning guarantees rather than deriving new mathematical bounds.

  **What a result would look like**

  A positive result would be a hierarchy of assumptions, showing exactly how much structural constraint is required to guarantee learning gains. This would redefine the principle of uniformity as a quantifiable complexity bound, allowing philosophers to say precisely what must be assumed about the world to justify specific learning strategies. It would provide a vocabulary for distinguishing between weak and strong inductive commitments. A negative result is equally valuable. It might show that the finite No-Free-Lunch framework and the infinite computable learner framework are incommensurable. If the literatures are talking past each other—one about finite averaging, the other about computable limits—then the project clarifies why the philosophical debate remains stalled. Even if the two fields cannot be unified, demonstrating the boundary where the translation fails is a substantive philosophical contribution. Either way, the output is a clarified map of the necessary conditions for induction, replacing vague appeals to nature's uniformity with specific structural requirements or a clear explanation of why such requirements cannot be formalized.

  **Failure modes**

  The primary risk is scope creep. The three wrinkles—finite versus infinite spaces, computable learners, and the status of the prior—could easily become three separate dissertations. I risk getting lost in technical proofs rather than philosophical analysis, producing mathematics that lacks epistemological significance. There is also the risk that the machine learning results are too specific to the formalisms used to bear on general epistemology. To mitigate this, I will focus on the conceptual mapping between the formal constraints and philosophical assumptions, rather than deriving new mathematical bounds. I will maintain a strict focus on the conditions of learning rather than the mechanics of algorithms. If the technical bridge proves too costly, I will prioritize the conceptual analysis of the prior, as that is the core philosophical lever. I will manage this by defining formal terms plainly and keeping focus on epistemological implications. The goal is clarity on the conditions of learning, not a new learning algorithm.
