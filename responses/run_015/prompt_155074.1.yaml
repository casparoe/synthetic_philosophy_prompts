  **Question**

  The separateness of persons objection to utilitarianism is often stated as the claim that it is illegitimate to aggregate benefits and burdens across persons into a single total, but this runs together two distinct claims: first, that such aggregation is illegitimate, and second, that a correct principle must be sensitive to how benefits and burdens are distributed across persons. Since utilitarians can grant the second claim, only the first bites. Consider two cases. Case A: You must choose between imposing a single severe burden on one stranger or imposing barely perceptible burdens on a million strangers, where the summed burden in the second option is stipulated to be larger. Case B: Five people can be saved from severe harm only by imposing a trivial, unconsented cost on a sixth. In Case A, rejecting aggregation seems correct; in Case B, it seems to forbid a clearly permissible trade-off. Reductionism about personal identity holds that what unites a person over time consists in physical and psychological continuities that admit of degrees, making the boundary between persons like the boundary between a nation. Finally, employ the Mirror Test: take whatever principle you endorse for distributing benefits and burdens between persons, apply it to the distribution of benefits and burdens within a single life over time, and then either accept the intrapersonal result or explain what makes the interpersonal case relevantly different.

  Distinguish the two claims identified above. Propose a minimal principle that delivers the intuitive verdict in both Case A and Case B, and name explicitly which attractive claim that principle surrenders. Confront the reductionist reply using the Mirror Test on your proposed principle, identifying a genuine difference-maker if you reject the intrapersonal result.

  ***

  **Model Answer**

  The objection succeeds only by rejecting unrestricted aggregation while accepting trade-offs above a threshold of severity, thereby surrendering the claim that all burdens are strictly incommensurable across persons. To evaluate this, we must distinguish two claims often conflated in the separateness of persons objection. The first claim is that aggregating benefits and burdens across distinct persons into a single total is illegitimate. The second is that a correct principle must be sensitive to how benefits and burdens are distributed across persons. Utilitarians can happily grant the second claim, as distribution affects total utility instrumentally; thus, only the first claim bites. If a student argues only for sensitivity to distribution, they have not challenged utilitarianism fundamentally. The core challenge is whether the boundary between persons blocks summation itself. Without this distinction, the objection collapses into a plea for efficiency that utilitarianism already accepts.

  Consider the two cases. In Case A, a single severe burden on one stranger is weighed against summed larger but barely perceptible burdens on a million strangers. Intuitively, we reject aggregating the million tiny burdens to outweigh the one severe burden. In Case B, five people are saved from severe harm by imposing a trivial cost on a sixth. Here, intuition permits the trade-off. A principle that forbids all aggregation solves Case A but fails Case B, creating an absolutist veto that forbids even trivial unconsented costs to prevent catastrophe. Conversely, a principle allowing unrestricted aggregation solves Case B but fails Case A. We need a minimal principle that navigates between these poles. The dilemma forces us to choose between a weak objection compatible with utilitarianism and a strong objection that yields absurd prohibitions.

  The proposed principle is Threshold Prioritarianism: burdens below a certain threshold of severity may be aggregated across persons, but burdens above that threshold cannot be outweighed by sums of below-threshold burdens. This delivers the intuitive verdict in both cases. In Case A, the severe burden crosses the threshold, blocking the sum of trivial pains. In Case B, the trivial cost remains below the threshold, allowing aggregation to justify saving the five. However, adopting this principle requires surrendering an attractive claim: the claim that moral mathematics is uniform regardless of stakes. We must accept that the moral weight of a burden changes qualitatively, not just quantitatively, once it reaches a certain intensity. This surrenders the simplicity of pure utilitarianism for a more complex, tiered morality. It admits that separateness matters more when stakes are high.

  Reductionism about personal identity complicates this. If persons are just bundles of psychological and physical continuities admitting of degrees, the boundary between persons is morally arbitrary, like the boundary between a nation or a club. If we aggregate across persons, why not aggregate across time within a person? The reductionist argues that if separateness matters, it should matter intrapersonally too, yet we routinely accept severe intrapersonal costs for future benefits. If the boundary is fuzzy, the prohibition on aggregation loses its foothold. The reductionist reply suggests that any principle relying on strict personhood is metaphysically unstable. It challenges the coherence of privileging the person-boundary if that boundary is not a deep metaphysical fact.

  Finally, we apply the Mirror Test to this principle. If we apply Threshold Prioritarianism within a single life, we ask: should I suffer a severe burden now to avoid a sum of trivial burdens later? Intuitively, yes, self-sacrifice over time is rational. But if I sacrifice a limb now to avoid future headaches, rationality wavers. To reject the intrapersonal result while keeping the interpersonal one, we need a genuine difference-maker. Mere numerical distinctness is insufficient, as reductionism shows. The difference-maker is the capacity for separate rational planning. Interpersonal trade-offs impose costs on agents who cannot consent to the plan governing the sacrifice, whereas intrapersonal trade-offs occur within a single locus of consent. Reductionism blurs the boundaries, but it does not erase the fact that distinct consciousnesses require distinct justification. Even if psychological continuity fades, the immediate phenomenological separation remains. You cannot feel my pain, even if I am your future self. Thus, the principle holds, but only if we acknowledge that the surrender of uniform moral mathematics is the price of respecting distinct agencies. We must accept that while persons are not metaphysically deep, they are morally significant units of accountability. The Mirror Test confirms that the principle is stable only if we treat the lack of shared consciousness as the relevant difference, not the metaphysical status of the person. This saves the objection from reductionism without relying on dubious metaphysics.

  ***

  **Marking Scheme**

  The single discriminator separating an A answer from a B answer is the identification of a non-trivial difference-maker in the Mirror Test that withstands reductionist scrutiny.

  *Note on tempting inference:* Candidates often set the objection up as a straight choice between trivial compatibility with utilitarianism and an absurd absolutist veto, without noticing the third option in between; answers that fail to propose a threshold or intermediate principle should not exceed 12 marks.

  1.  **Distinction of Claims (4 marks):** Awards marks for clearly separating the illegitimacy of aggregation from sensitivity to distribution, noting that utilitarians accept the latter. *Typical error:* Treating sensitivity to distribution as itself a challenge to utilitarianism.
  2.  **Case A Analysis (4 marks):** Awards marks for recognizing that rejecting aggregation yields the intuitive verdict in the severe burden versus million trivial burdens case. *Typical error:* Arguing that the summed burden should outweigh the severe burden.
  3.  **Case B Analysis (4 marks):** Awards marks for recognizing that rejecting aggregation yields counter-intuitive results in the trivial cost to save five case, necessitating a qualified principle. *Typical error:* Insisting that no cost can be imposed on the sixth person regardless of stakes.
  4.  **Reductionist Challenge (4 marks):** Awards marks for accurately stating the reductionist view that person-boundaries are like national boundaries and challenge the moral weight of separateness. *Typical error:* Dismissing reductionism as irrelevant to ethics without argument.
  5.  **Mirror Test Application (4 marks):** Awards marks for applying the principle intrapersonally and identifying a difference-maker such as separate consciousness or consent, rather than mere numerical distinctness. *Typical error:* Claiming the difference is simply that they are different people.
