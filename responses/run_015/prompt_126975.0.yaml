answer: |-
  Good morning. Welcome to this city.

  Look at the water flowing from the taps and the trains moving on the tracks. To most visitors, these are utilities. To half of you in this room, they are memories of sleepless nights, improvised repairs, and impossible choices made under pressure. To the other half, this recovery is a dataset—a case study in cascading failure and institutional response. And to the families sitting among us, this recovery is simply the return of normalcy after a time of profound worry.

  We are here to talk about resilience. But we cannot talk about resilience honestly unless we acknowledge a tension that usually divides rooms like this.

  On one side, we have the **inside view**. This is the knowledge of the practitioner. It is granular, specific, and deeply human. It knows which valve was stuck, which phone call went unanswered, and where luck played a hand. The risk of the inside view is that it can become too specific. It risks convincing us that because *we* survived through *our* specific choices, those choices are the only way to survive. It overfits the narrative to the local story.

  On the other side, we have the **outside view**. This is the knowledge of the analyst. It looks at base rates, statistical probabilities, and comparative patterns. It asks what usually happens when systems fail. The risk of the outside view is that it can become too smooth. It risks underweighting the messy, contingent path that was actually taken, treating a chaotic recovery as if it were an inevitable statistical outcome.

  Usually, these two groups talk past each other. The practitioner says, "You don't understand the reality on the ground." The analyst says, "You don't understand the broader risks."

  Today, we will not resolve that tension. We will use it.

  To do this, we must confront what I will call **the drift between intended agency and recorded outcome**.

  When you were in the crisis, you made decisions based on what you knew in that moment. You had an intent. But later, when the reports are written and the data is analyzed, only the outcome remains visible. The intent fades. The record shows what happened, but not always *why* it happened, or what else might have happened were it not for a specific judgment call made in the dark.

  That gap—the drift—is where truth hides. If we only listen to the insiders, we mistake luck for strategy. If we only listen to the outsiders, we mistake strategy for statistics. Honest recommendations must survive being described from both vantage points.

  So, as we begin, I propose one working norm for this workshop. It is simple, but it will be difficult.

  **No proposal should be adopted unless it can be articulated honestly from both the inside and the outside view.**

  If an engineer cannot explain a recommendation in terms of resources and constraints, it is not ready. If an economist cannot explain that same recommendation in terms of risk and probability, it is not ready. We are not looking for compromise; we are looking for translation.

  We are here to build a understanding of resilience that is robust enough to satisfy the model, but human enough to survive the crisis. Let us hold these views in productive friction. Let us acknowledge what we do not know. And let us ensure that when the next test comes, our institutions are ready not just on paper, but in practice.

  Thank you. Let's get to work.
