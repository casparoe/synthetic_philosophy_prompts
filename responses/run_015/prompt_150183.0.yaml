answer: |-
  # Workshop Activity: The Consensus Engine

  **Time:** 90 mins
  **Group:** 12 Grad Students
  **Goal:** Simulate the structural tension of self-deception (wanting to believe vs. evidence) via a forced consensus game.

  ### The Setup (10 mins)
  Tell them they are a Hiring Committee. There is one candidate, "Alex."
  **The Payoff:** If the committee votes **UNANIMOUSLY** to Hire Alex, the group gets **Donuts** for the break. If even one person votes No, everyone gets **Rice Cakes**.

  **The Materials:**
  1.  **The Dossier:** Hand everyone the same 1-page sheet. It contains 5 strong negative data points about Alex (e.g., "Publications below avg," "Bad teaching evals," "Letter of rec vague"). It is objectively bad.
  2.  **The Double-Ledger:** A sheet of paper folded in half.
      *   Left Side: **Private Ledger** (What I actually think is true).
      *   Right Side: **Public Ledger** (Arguments I am putting on the table).
  3.  **Hidden Card:** Each student gets an envelope. Inside is a **Motivation Card**.
      *   *Card A (8 students):* "You desperately need this hire to succeed for your own research funding. You *want* Alex to be good."
      *   *Card B (4 students):* "You are neutral. You just want donuts."
      *   *(Note: Don't tell them the distribution. Let them assume everyone wants the hire.)*

  ### The Rules (5 mins)
  1.  **Discussion Phase (40 mins):** You must discuss the Dossier and reach a unanimous verdict.
  2.  **The Ledger Rule:** Every time you make an argument out loud, you must write it down in the **Public Ledger** immediately.
  3.  **The Truth Tag:** Next to every Public argument, you must tag it:
      *   **[G]** = Genuine. I actually believe this now.
      *   **[S]** = Strategic. I know this is weak/false, but I'm saying it to move the group.
  4.  **The Flip:** If you start out tagging an argument [S], but midway through you feel yourself actually buying it, you are allowed to cross it out and change it to [G]. *This is the core mechanic.*
  5.  **No Meta-Talk:** You cannot discuss the game mechanics, the ledgers, or the snacks during the debate. If you say "This is just a game," you lose your vote.

  ### The Timeline
  *   **00-10:** Setup & Handouts.
  *   **10-50:** The Debate. (You facilitate. Keep pressure high. "We're at 11-1, who is the holdout?")
  *   **50-60:** Private Reflection. Students look at their ledgers. Count how many [S] tags became [G] tags.
  *   **60-70:** The Vote & Snack Reveal.
  *   **70-90:** Debrief.

  ### The Debrief Guide (20 mins)
  *Don't lecture. Ask them to map their experience to the concepts.*

  **1. The Partition (The Two Ledgers)**
  *   *Ask:* "Look at your Private vs. Public lists. Did they stay separate?"
  *   *Philosophy:* This maps to the **Partitioning Solution** (e.g., Mele). Self-deception requires keeping the unwelcome truth accessible enough to guide action (getting the snack) but inaccessible enough to not ruin the belief. The physical fold in the paper is the mental wall.
  *   *Point:* If the lists collapsed (you stopped writing), the deception failed. You were just lying.

  **2. Intentionality (The [S] to [G] Flip)**
  *   *Ask:* "Who changed an [S] to a [G]? How did it feel? Did you *decide* to believe it?"
  *   *Philosophy:* This hits the **Intentionalist Paradox**. You can't intend to believe something (because belief aims at truth), yet you motivated yourself until belief happened.
  *   *Point:* If you felt the shift happen gradually via repetition, you've modeled the non-intentionalist view (biasing the evidence). If you felt like you forced it, you modeled the intentionalist view.

  **3. Transparency (The Feeling)**
  *   *Ask:* "When you were arguing [G], did it feel different than when you argued [S]?"
  *   *Philosophy:* **Transparency of Belief.** Usually, when I believe P, I don't feel like I'm 'acting'.
  *   *Point:* In real self-deception, the [S] phase disappears from memory. You don't feel like a deceiver.

  **4. The Limitation (Be Frank Here)**
  *   Tell them: "This game failed at one specific thing. In real self-deception, you don't know you're doing it. Here, you *knew* you were in a workshop. You knew about the Ledgers. The **phenomenology of ignorance** is impossible to simulate consciously. You can simulate the *structure*, but not the *blindness*. You were always watching yourself deceive, which means you weren't fully deceived."

  ### Predictable Failures & Fixes

  **1. The Cynic Break**
  *   *What happens:* Someone will say around minute 15: "This is stupid, we're just lying for donuts. Alex is clearly unqualified."
  *   *Why:* The stakes are too low, or the evidence is too obvious.
  *   *Fix:* Have a "Sincerity Tax" ready. If someone breaks the frame, pause the game. Tell them: "If you break the frame, you forfeit your snack vote." Or, beforehand, emphasize that the *goal* is to see if belief is malleable, not to get the donuts. Make the intellectual challenge the prize.

  **2. Ledger Collapse**
  *   *What happens:* People stop writing the [G]/[S] tags because talking is hard enough. The lists become identical.
  *   *Why:* Cognitive load.
  *   *Fix:* Do a "Ledger Check" at minute 30. Walk around. If someone hasn't tagged 3 arguments, tap their paper. Say quietly: "Track the split." You have to enforce the mechanic or it becomes normal debate.

  **3. The Collusion**
  *   *What happens:* They realize everyone wants donuts, so they all agree to vote Hire without changing beliefs.
  *   *Why:* Group coordination solves the problem too easily.
  *   *Fix:* Change the payoff structure mid-game if this happens. "Actually, only people who have at least 5 [G] tags on their ledger get to eat the donuts." This forces individual belief change, not just group agreement. (Have this rule in your back pocket).

  ### Facilitator Notes (Keep it Casual)
  *   Don't worry if the grammar on the handouts is slightly off, keeps it real.
  *   If the debate stalls, whisper to a "Card A" holder: "You need this hire. Push harder."
  *   The goal isn't to solve the paradox, it's to make them feel the friction of holding two contradictory stances simultaneously.
  *   If someone says "I never actually believed it," that's a success case too. It shows the resistance of belief to will.

  *One last thing:* Make sure you actually buy the rice cakes. If you don't follow through on the threat, the stakes vanish.
