answer: |-
  Here is the breakdown you asked for, keeping the wine flowing but the logic tight.

  ### Epistemic Status: What We Know vs. What We Fight About

  First, let's clear the deck on Burke himself. There is a settled core and a contested periphery.

  **Settled:** Burke prioritized *prescription* (long usage confers legitimacy), *gradualism* (reform must grow organically from existing structures), and *prudence* (abstract principles must yield to concrete circumstances). He viewed society as a partnership between the dead, the living, and the unborn. He distrusted *a priori* reasoning (what he called "naked reason") when applied to complex social organisms.

  **Contested:** Scholars fight over whether Burke is a "conservative" in the modern sense. He self-identified as a Whig and supported the American Revolution while opposing the French. Some argue his prescription applies only to the British Constitution, not universal governance. Others argue it's a general epistemic humility. Regarding Chesterton: it is consensus that Chesterton is *inspired* by Burke, but your distinction suggests Chesterton simplifies Burke's epistemology. Chesterton assumes the fence has a *discoverable* reason; Burke often implies the fence *is* the reason, regardless of discoverability.

  **Extrapolation:** Burke never saw the administrative state or standardized testing. Applying his principles here requires mapping "tradition" onto "regulatory regimes" and "social custom" onto "admissions criteria." This is an application of his *method*, not his specific views.

  ### Chesterton vs. Burke: Your Distinction Holds

  Your hunch is correct. Chesterton's Fence is indeed more *reason-transparent* than Burkean prescription. Chesterton's parable assumes that if you look hard enough, you will find the farmer's practical reason (keeping cattle off the road). It treats tradition as a repository of *explicit* solutions to *explicit* problems.

  Burke is deeper and darker. For Burke, the value of the fence often lies in the *habit* of respecting it, not just its utility. The "reason-opaque" category you defined—stabilizing expectations, carrying inarticulate know-how—is the heart of Burkean prescription. Burke argues that demanding explicit justification for everything destroys the "latent wisdom" embedded in custom. If you force every institution to justify its existence in the language of current rationality, you privilege the living generation's abstract theories over the accumulated wisdom of ages.

  This leads directly to your two cases.

  ### Case 1: Sunset Clauses ("Sunset and Rebuild")

  **Verdict: OPPOSE**

  A sunset clause flips the burden of proof from "why change?" to "why keep?" On the surface, this looks like Chesterton's Fence applied systematically: don't keep a fence unless you can say why. But through a Burkean lens, this is rationalist arrogance disguised as humility.

  Burke would argue that most successful regulations function like your "reason-opaque" rules. They stabilize expectations. Businesses and citizens arrange their lives around the assumption that the rule exists. Forcing an agency to re-justify the rule on a record every decade assumes that the *articulable* cost-benefit analysis is the only valid form of justification. It ignores the value of stability itself.

  For Burke, the fact that a rule has survived without causing catastrophe is evidence of its fitness. A sunset clause assumes the current administrators possess enough reason to re-evaluate the entire inherited order periodically. This is exactly the kind of "geometric" planning Burke blamed on the French revolutionaries. It treats the state as a machine to be tweaked rather than an organism to be tended. It creates perpetual instability, preventing the "prejudice" (pre-judgment) that allows society to function without constant debate. Burke would see this as destroying the fence to check if it's still holding cattle, every ten years.

  ### Case 2: Test-Optional Admissions

  **Verdict: OPPOSE**

  This is the trickier case because it involves "nested fences." The tests were originally a reform (a new fence) built to stop the old corruption (legacy/prep-school bias). Removing them risks restoring the corruption.

  Burke is not a reactionary who wants to return to the *ancient* past; he is a conservative who wants to preserve the *established* order against rash innovation. For the last 80 years, standardized testing has been part of the prescriptive norm of American higher education. It is the "established institution." The move to test-optional is the *change*.

  Burke would be suspicious of the motivation. If the move is driven by abstract theories of equity (reason-transparent arguments about fairness) rather than concrete evidence that the tests no longer function, he would oppose it. He valued "natural aristocracy" (merit) over "artificial aristocracy" (blood/legacy). If tests serve as a imperfect but functional filter for merit, removing them to satisfy abstract equality concerns risks returning selection to the opaque nepotism of the past.

  Burke accepts that institutions accumulate corruption, but he prefers gradual reform *within* the structure to abrupt dismantling. If the tests are flawed, adjust them. But abolishing the standard because it conflicts with a new theoretical ideal undermines the stability of the institution's selection process. He would likely view the tests as a prescriptive bulwark against the greater evil of pure nepotism, even if the tests themselves are imperfect. To remove them is to tear down a fence because you dislike its look, forgetting it was built to keep wolves (or in this case, legacy hires) out.

  ### The Crux

  The divergence you sensed is real. Chesterton asks for the reason so we don't lose the function. Burke warns that demanding the reason might destroy the substance. In both modern cases, the proposed reforms privilege *articulated justification* (current rationality) over *prescriptive stability* (embedded wisdom). Burke consistently sides with the latter.

  Verdict: sunset=OPPOSE, test-optional=OPPOSE, crux=Prescription Over Articulation
