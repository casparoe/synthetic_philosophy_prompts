      *   Discuss the "90% Copy" problem (Quibbling over probability).

  9.  **Refining the "Copy" Mechanism (Crucial Step):**
      *   If I just tell them "Assume they are a copy," skeptics will defect.
      *   If I tell them "Your score is based on your choice and a *guaranteed match*," it changes the game to a single-player decision.
      *   *Insight:* To make it feel like a Prisoner's Dilemma but function like Superrationality, you need the *tension* of an opponent.
      *   *Proposed Mechanism:* **The "Logical Twin" Pairing.** Pair them up. Give them a script. "You are playing against Person X. You are both receiving this exact note. You are both rational. You both know the other is rational. You both know you are in identical situations." This is the *Common Knowledge* requirement.
      *   *Wait, simpler:* Just tell them: "In this round, if you Cooperate, your opponent *will* Cooperate. If you Defect, your opponent *will* Defect. This is a rule of this round." This removes the doubt and tests if they understand the payoff shift.
