prompt: |-
  I've been down a rabbit hole on Newcomb's problem lately (the one with the opaque box and the predictor — I think I get it now, mostly) and I keep coming back to an argument people call superrationality: the idea that if the other player in a prisoner's dilemma is a copy of you, or reasons exactly the way you do, then cooperating is actually the rational move, because the two decisions aren't independent the way the usual "always defect" argument assumes. It clicks on paper but feels completely backwards, and I want to test it on people I know. I'm running a game night with about 12 friends, one evening, maybe an hour and a half, and no budget, so payoffs have to be points or somthing. Can you design an activity where they first play a normal prisoner's dilemma in pairs until the "defect every time" reflex kicks in, and then play a second round where everyone is told the other player is a perfect copy of their own mind — same reasoning, same information — and they have to decide again? I want them to feel the point where the first round's logic stops working on its own, without me explaining it, and without the name of the argument coming up until the debrief.

  Include the rules, the payoff scheme, and your best answer to the design question I keep going in circles on: how do you actually run the copy round in a room — does one person make both decisions, do you pair up two different people and tell each of them they're the other's copy, or something else, and does that choice change what the game shows? Then a debrief that maps what happened to the real argument: where the "copy" assumption is doing all the work, why the standard dominance proof breaks in this setup, and the strongest objections — like what if the copy is only 90% similar, or what if the argument only works if you fully trust your own reasoning. And be honest about what a staged game can't reproduce (I suspect something about the fact that nobody in the room can actually verify the copy claim), and tell me what will predictably go wrong the first time I run it — I'm worried everyone will just defect anyway and I'll look like an idiot in front of my friends.
