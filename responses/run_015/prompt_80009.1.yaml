      *   Total points determine a prize (e.g., bragging rights, first pick of snacks, or a small cash pot if they chip in, but prompt says no budget). Let's use "Points for a Raffle" or "Bragging Rights."

  7.  **Predicting Failure Modes:**
      *   *Cynicism:* "He's lying about the copy." -> Result: Defect.
      *   *Habit:* Round 1 trained them to Defect. -> Result: Defect.
      *   *Misunderstanding:* They think "Copy" means "I want what they want." -> Result: Confusion.
