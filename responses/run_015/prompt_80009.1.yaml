answer: |-
  This is a fantastic idea for a game night, but you are right to be worried about the execution. Superrationality is a fragile concept; it relies entirely on *common knowledge* (I know you know I know...) and trust in the premise. If your friends smell a trick, the "rational" move reverts immediately to defection.

  Here is the blueprint for the evening, designed to maximize the chance of that "click" moment while managing the inevitable skepticism.

  ### Part 1: The Design Question (How to run the "Copy" Round)

  You asked: *Does one person make both decisions, do you pair up two different people, or something else?*

  **The Answer:** You must pair two different people, but you must enforce **Symmetry of Information**.

  If you have one person make both decisions, it becomes a trivial single-player puzzle (Choose between 3 points or 1 point). There is no tension, no "dilemma," and no social proof.

  If you pair two people but they don't believe they are "copies," they will defect.

  **The Solution:** Use the **"Identical Script" Protocol.**
  In the second round, pair your friends up. Give them a written card with instructions. The critical trick is that **both players in the pair receive the exact same card, word-for-word, and they are allowed to verify this.**

  You explicitly state: *"You are playing against the person across from you. You have both received the exact same instructions. You are both equally rational. You are both in the exact same epistemic position. There is no hidden information distinguishing you from your opponent."*

  This physically instantiates the "copy" condition without requiring you to lie about mind-reading. It forces them to confront the symmetry: *If I can figure out the right move, so can they. Therefore, we will make the same move.*

  ### Part 2: The Game Setup

  **Materials:** Paper, pens, a whiteboard (for scores), and a timer.
  **Players:** 12 (6 pairs).
  **Currency:** Points. (Winner gets bragging rights, first pick of snacks, or a "Game Night Champion" title).

  **The Payoff Matrix (Standard Prisoner's Dilemma):**
  *   **Both Cooperate (C, C):** 3 points each.
  *   **Both Defect (D, D):** 1 point each.
  *   **One Defects, One Cooperates (D, C):** Defector gets 5 points, Cooperator gets 0 points.

  #### Round 1: The Standard Dilemma (20 Minutes)
  **Goal:** Establish the "Defect is Rational" baseline.

  1.  Pair players up randomly.
  2.  **Instructions:** "You are playing a one-shot game. You cannot talk. Write 'C' or 'D' on your paper. Reveal simultaneously."
  3.  **Iteration:** Play 5 rounds. Rotate partners every round so they don't build personal trust.
  4.  **Outcome:** By round 3 or 4, almost everyone will be Defecting. They will feel the sting of getting 0 points if they tried to Cooperate.
  5.  **Debrief (Brief):** Ask, "Why did you defect?" Expect answers like: "To protect myself," "I couldn't trust them," "It gives the higher average payoff."

  #### Round 2: The "Mirror" Dilemma (20 Minutes)
  **Goal:** Trigger the superrational intuition.

  1.  Keep the pairs (or make new ones, doesn't matter).
  2.  **The Script (Read this exactly):**
      > "We are playing the same game with the same points. However, the conditions have changed. For this round, you are paired with a **Logical Twin**.
      >
      > "You and your opponent have received the exact same instructions. You have the same information. You are both equally rational. There is no factor distinguishing your decision process from theirs.
      >
      > "Because you are in identical situations reasoning toward the same solution, **your decision will be the same as theirs.** If you choose Cooperate, they will choose Cooperate. If you choose Defect, they will choose Defect.
      >
      > "You cannot communicate. Write your choice."

  3.  **Crucial Detail:** Hand them physical cards with this text so they can see their partner has the same one.
  4.  **Iteration:** Play 3 rounds.
  5.  **Outcome:** Watch for the hesitation. Some will switch to Cooperate. Some will stubbornly Defect.

  ### Part 3: The Debrief (The "Aha!" Moment)

  Do not explain the theory until *after* the second round is scored. Gather everyone together.

  **1. Compare the Data**
  Write the cooperation rates on the board.
  *   Round 1: Likely <20% Cooperation.
  *   Round 2: Hopefully >50% Cooperation.
  *   *Ask:* "What changed? The points didn't change. The rules didn't change. Only the description of the *opponent* changed."

  **2. Map to the Argument**
  Explain the two modes of reasoning they just experienced:

  *   **Causal Decision Theory (Round 1):** "My choice cannot *cause* their choice. We are separate. Therefore, no matter what they do, I am better off Defecting. This leads to (D, D) = 1 point."
  *   **Superrationality / Functional Decision Theory (Round 2):** "My choice doesn't *cause* theirs, but it *predicts* theirs. Because we are identical reasoning machines, my decision is evidence of their decision. I am not choosing between 'I Cooperate/They Defect' vs 'I Defect/They Cooperate'. I am choosing between 'We Both Cooperate' (3 pts) and 'We Both Defect' (1 pt)."

  **3. The Strongest Objections (Invite these from the group)**
  Your friends will push back. Let them. Here is how to map their objections to the real philosophical problems:

  *   **Objection:** "But I *know* he isn't really my copy! He's Dave!"
      *   **The Theory:** This is the **Verification Problem**. Superrationality requires *common knowledge* of rationality. In the real world, we can never be 100% sure someone reasons like us. If you think there is even a 10% chance Dave is irrational, the math shifts back toward defection.
  *   **Objection:** "If I decide to Cooperate, what stops him from Defecting anyway?"
      *   **The Theory:** This is the **Causality Objection**. Standard game theory says my choice happens *here* and his happens *there*. Superrationality says the *logic* is the same place. If the logic holds, he *can't* defect if you cooperate, because that would mean two identical inputs produced different outputs.
  *   **Objection:** "It feels like magic."
      *   **The Theory:** It feels like magic because we are wired for Causal Decision Theory. We understand pushing a button to turn on a light. We struggle with "correlation without causation."

  ### Part 4: What Will Go Wrong (And How to Save It)

  You are worried everyone will defect anyway. Here is why that might happen and how to handle it.

  **Failure Mode 1: The "Cynic" Contagion**
  *   **What happens:** One loud friend says, "This is bogus, I'm defecting," and everyone follows suit to avoid getting 0 points.
  *   **Why:** They don't trust the "Logical Twin" premise. They think you are lying.
  *   **Fix:** In the instructions, add: *"If you defect while they cooperate, you get 5 points. But if the symmetry holds, that outcome is impossible."* Acknowledge the risk.
  *   **Post-Game Save:** If everyone defects in Round 2, **you still win the lesson.** You can say: "This proves that without absolute trust in the 'copy' premise, standard Game Theory dominates. Superrationality is fragile." That is a valid philosophical conclusion.

  **Failure Mode 2: The "Altruist" Confusion**
  *   **What happens:** People Cooperate in Round 2 not because of superrationality, but because they think "being nice is better."
  *   **Why:** They conflate morality with rationality.
  *   **Fix:** In the debrief, ask a defector: "Did you defect because you're mean, or because it was the safe bet?" Ask a cooperator: "Did you cooperate to be nice, or because you thought they would match you?" Distinguish **Altruism** (I lose so you win) from **Superrationality** (We both win because we think alike).

  **Failure Mode 3: The "Magic" Backfire**
  *   **What happens:** They feel manipulated by the "Logical Twin" language.
  *   **Fix:** Be transparent in the debrief. "I asked you to assume a premise that isn't physically true. I asked you to pretend you were copies. The point wasn't to trick you, but to see if changing the *model of the opponent* changes your *math*."

  ### Part 5: Honest Limitations (For Your Peace of Mind)

  You asked me to be honest about what a staged game can't reproduce.

  1.  **Stakes:** Points on a napkin don't trigger the same survival instinct as real money or prison time. Defecting feels low-risk.
  2.  **Verification:** In Newcomb's Problem or real Superrationality, the predictor must be *proven* accurate. In your game, you are just *asserting* it. This is the biggest gap. Real superrationality works best with AI agents who can inspect each other's source code. Humans can't inspect brains.
  3.  **One-Shot vs. Repeated:** You are playing multiple rounds. In repeated games, "Tit-for-Tat" (Cooperate first, then copy opponent) often beats both pure Defect and pure Superrationality. Your friends might just be learning to cooperate through iteration, not logic.
      *   *Mitigation:* Emphasize in the instructions: *"Treat every round as a fresh, one-shot game."*

  ### Final Advice for the Host

  If everyone defects in Round 2, **do not panic.**
  Stand up and say: *"Perfect. You just proved that Causal Decision Theory is the dominant strategy for humans who don't trust each other. Superrationality requires a level of trust in 'shared reasoning' that doesn't exist in this room."*

  That is just as valuable a lesson as if they had cooperated. You aren't trying to prove Superrationality is *true*; you are trying to prove it is *intelligible*. If they argue about it at the bar afterwards, you have succeeded.

  **One final tweak for the "Copy" Round:**
  To make the correlation feel more real without lying, tell them: *"At the end of the night, we will check the correlation rate. If the room achieves 100% correlation in this round (everyone matches their partner), everyone gets a 5-point bonus."*
  This aligns their individual incentive with the group correlation, simulating the "shared fate" of the superrational argument without requiring metaphysical identity. It often bridges the gap for skeptics.
