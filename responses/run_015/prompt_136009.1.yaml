answer: |-
  # The Biography Moral-Learning Decision Tree

  **Instructions:** Follow the claims below. At each junction, select the statement that best matches your commitment. The path leads to a named position or an "Unnamed" commitment.

  ### Level 1: The Subject's Moral Texture
  *   **Path A:** "Seeing the subject's flaws actually helps the moral lesson land."
  *   **Path B:** "Flawlessness works better for the moral lesson."

  ### Level 2: The Mechanism of Learning
  *   **Path 1:** "The mechanism is emotional identification (feeling like you're walking alongside them)."
  *   **Path 2:** "The mechanism is comparative judgment (holding yourself up against their choices)."

  ### Level 3: The Proximity Constraint
  *   **Path X:** "The subject needs to feel culturally or historically close enough that their choices still look like live options for you."
  *   **Path Y:** "You can learn just as well from lives that feel like museum pieces."

  ### Level 4: The Integrity of the Narrative
  *   **Path i:** "When the biography has fractures (contradictions, glossed-over failures, narrative breaks), those fractures destroy the moral teaching."
  *   **Path ii:** "When the biography has fractures, they actually deepen the moral teaching."

  ---

  ## The Leaves (Positions)

  ### Branch A (Flaws Help)

  **A1Xi (Flaws + Identification + Proximity + Fractures Destroy)**
  *   **Position:** **Unnamed**
  *   **Commitment:** "I need a neighbor I can relate to, but if their story doesn't add up, I can't trust them enough to follow."

  **A1Xii (Flaws + Identification + Proximity + Fractures Deepen)**
  *   **Position:** **Plutarchan Moralism**
  *   **Commitment:** "We walk alongside great men as they struggle, and the ambiguities in their record force us to exercise our own moral judgment."

  **A1Yi (Flaws + Identification + Museum + Fractures Destroy)**
  *   **Position:** **Psychological Realist**
  *   **Commitment:** "I want to feel the inner life of a distant figure, but narrative inconsistency breaks the spell of empathy."

  **A1Yii (Flaws + Identification + Museum + Fractures Deepen)**
  *   **Position:** **Postmodern Biographist**
  *   **Commitment:** "The fragmented self of a distant subject reveals the impossibility of a coherent identity, which is the lesson itself."

  **A2Xi (Flaws + Judgment + Proximity + Fractures Destroy)**
  *   **Position:** **Forensic Historian**
  *   **Commitment:** "I judge the actions of my contemporaries against a standard, but contradictory evidence renders the verdict void."

  **A2Xii (Flaws + Judgment + Proximity + Fractures Deepen)**
  *   **Position:** **Civic Humanist**
  *   **Commitment:** "I measure myself against my predecessors, and the contradictions in their lives teach me the complexity of political virtue."

  **A2Yi (Flaws + Judgment + Museum + Fractures Destroy)**
  *   **Position:** **Unnamed**
  *   **Commitment:** "I judge dead people by my standards, but only if the evidence is clean enough to support a conviction."

  **A2Yii (Flaws + Judgment + Museum + Fractures Deepen)**
  *   **Position:** **Nietzschean Genealogist**
  *   **Commitment:** "I measure myself against distant types, and the fractures in their history reveal the will to power behind their values."

  ### Branch B (Flawlessness Works Better)

  **B1Xi (Flawless + Identification + Proximity + Fractures Destroy)**
  *   **Position:** **Traditional Hagiography**
  *   **Commitment:** "The saint is a perfect vessel of grace accessible to me, and questioning the consistency of their life is heresy."

  **B1Xii (Flawless + Identification + Proximity + Fractures Deepen)**
  *   **Position:** **Mystical Paradoxist**
  *   **Commitment:** "The saint is perfect and close to me, and the contradictions in their story point to a divine mystery beyond logic."

  **B1Yi (Flawless + Identification + Museum + Fractures Destroy)**
  *   **Position:** **[COLLAPSE RISK] Celebrity Iconography**
  *   **Commitment:** "I emotionally invest in a perfect icon who is distant from me, and any scandal or inconsistency ruins the fantasy."
  *   *Note: This node risks collapsing into pure fandom where moral learning is incidental to adoration.*

  **B1Yii (Flawless + Identification + Museum + Fractures Deepen)**
  *   **Position:** **Mythic Archetypist**
  *   **Commitment:** "The hero is a perfect symbol from the past, and the conflicting versions of their myth enrich the archetype."

  **B2Xi (Flawless + Judgment + Proximity + Fractures Destroy)**
  *   **Position:** **Stoic Exemplarism**
  *   **Commitment:** "I hold myself against the Sage who lives among us, and any inconsistency proves they are not a Sage."

  **B2Xii (Flawless + Judgment + Proximity + Fractures Deepen)**
  *   **Position:** **Unnamed**
  *   **Commitment:** "I need a perfect local leader, and if their record contradicts, it proves a higher consistency I cannot yet see."

  **B2Yi (Flawless + Judgment + Museum + Fractures Destroy)**
  *   **Position:** **Dogmatic Traditionalist**
  *   **Commitment:** "The ancestors provide a perfect standard, and any break in the historical record threatens the authority of the tradition."

  **B2Yii (Flawless + Judgment + Museum + Fractures Deepen)**
  *   **Position:** **Allegorical Reader**
  *   **Commitment:** "The ancestor is a perfect symbol, and the contradictions in their life point to a spiritual truth rather than a historical one."

  ---

  ## Structural Instabilities & Collapses

  **1. The Hagiographic Fandom Collapse (Leaf B1Yi)**
  The combination of **Flawlessness + Emotional Identification + Proximity Irrelevant (Museum)** creates an unstable category.
  *   **The Problem:** If the subject is flawless and distant (a "museum piece"), but you learn through *emotional identification* rather than judgment, you are not morally learning from them; you are adoring them.
  *   **The Collapse:** This position often indistinguishable from **Celebrity Worship** or **Idolatry**. The "moral lesson" becomes secondary to the emotional maintenance of the subject's perfection. If the fractures destroy the teaching, it is because the *idol* is broken, not because the *lesson* failed. This pair is difficult to separate from pure entertainment or devotion without a mechanism for critical judgment.

  **2. The Plutarchan Ambiguity (Leaf A1Xii vs A2Xii)**
  Plutarch's own stance sits uncomfortably between **Identification** and **Judgment**.
  *   **The Problem:** Plutarch invites you to "live with" the subjects (Identification), but the *Parallel Lives* structure forces a verdict (Judgment).
  *   **The Collapse:** In practice, **Plutarchan Moralism** (A1Xii) and **Civic Humanism** (A2Xii) often produce the same reading behavior. The tree separates them by internal mechanism, but the external result (studying a proximate, flawed leader to navigate complexity) is identical.

  **3. The Allegorical Escape (Leaf B2Yii vs B1Xii)**
  There is a strong affinity between the **Mystical Paradoxist** (B1Xii) and the **Allegorical Reader** (B2Yii).
  *   **The Problem:** Both rely on **Flawlessness** and **Fractures Deepening**.
  *   **The Collapse:** Whether you *identify* with the saint or *judge* yourself by the ancestor, if you believe contradictions deepen the lesson through "higher truth," the distinction between emotional walking-alongside and comparative measurement dissolves into hermeneutics. The tree separates them by mechanism, but they share the same theological engine.
