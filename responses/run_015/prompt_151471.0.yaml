answer: |-
  **1. Ecological carrying-capacity or infrastructure constraints**
  **Tier: Strong**
  Justification: Preventing tangible physical harm or systemic failure constitutes a robust justification under the harm principle that outweighs abstract development rights.

  **2. Democratic self-determination by existing residents over local land-use rules**
  **Tier: Moderate**
  Justification: Procedural legitimacy grants residents some authority over their immediate environment, but this right is morally bounded by the regional need for housing access.

  **3. Preservation of neighborhood character as a collective cultural good**
  **Tier: Weak**
  Justification: Subjective aesthetic and cultural preferences generally carry less moral weight than the objective human need for shelter and economic opportunity.

  **4. Protection of property values as investment-backed expectations**
  **Tier: Weak**
  Justification: Protecting private asset appreciation is a financial interest that rarely supersedes the basic welfare rights of others to secure housing.

  **5. Intergenerational trustee argument (obligation to preserve affordability for in-migrants rather than exclude)**
  **Tier: Incoherent**
  Justification: As phrased, this argument mandates inclusion rather than exclusion, logically contradicting the goal of blocking new construction.

  ***

  **Conflated Grounds:**
  The two grounds most frequently conflated in public NIMBY discourse are **(2) Protection of property values** and **(3) Preservation of neighborhood character**.

  **Explanation of Distortion:**
  "Neighborhood character" is often deployed as a socially acceptable euphemism for maintaining exclusivity and high property values, which distorts policy evaluation by masking self-interested financial motives as altruistic cultural preservation, thereby making exclusionary zoning appear morally virtuous rather than economically protective.
