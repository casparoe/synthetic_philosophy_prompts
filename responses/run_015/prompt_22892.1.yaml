answer: |-
  For the purposes of a graduate seminar demanding technical rigor over intuitive comfort, **Epistemicism** is the more defensible and internally coherent account. While Supervaluationism offers a metaphysics that aligns better with pre-theoretic intuitions about indeterminacy, it fractures under formal scrutiny, particularly regarding higher-order vagueness and the norms of credence. Epistemicism, despite its metaphysical austerity, provides a stable semantic framework that preserves classical logic and offers a principled epistemology of ignorance.

  Here is the technical case for Epistemicism, structured around your three points of comparison, followed by an analysis of where Supervaluationism fails.

  ### 1. The Metaphysics of Borderline Cases: Regress vs. Complexity

  The central metaphysical dispute concerns the status of the boundary. Supervaluationism posits that a borderline case is one where the predicate's extension is unsettled; the statement is neither true nor false because it is true on some admissible precisifications and false on others. Epistemicism posits a sharp boundary; the statement is true or false, but the boundary is unknowable.

  **The Supervaluationist Vulnerability:**
  The Supervaluationist account relies on the set of "admissible precisifications." However, the property of *admissibility* is itself vague. There is no sharp line between a precisification that respects the meaning of "tall" and one that does not. To handle this, the Supervaluationist must invoke higher-order precisifications (precisifications of the set of precisifications). This generates a regress. If the set of admissible precisifications is vague, then the truth conditions for first-order vague sentences are indeterminate. To fix this, one needs a "super-duper" truth definition. But as McGee (1991) demonstrated, global truth (truth on all admissible precisifications) cannot be defined within the object language without generating paradox or requiring a hierarchy that mirrors the Tarskian hierarchy of truth predicates. This makes the semantics expressively incomplete.

  **The Epistemicist Defense:**
  Williamson's metaphysics avoids this regress by anchoring the extension in actual usage patterns. The boundary is sharp because the causal-social mechanisms that fix reference are determinate, even if complex. The "ignorance" is not a gap in the world, but a limitation in our access to the complex functional role our usage plays in fixing extensions. While this posits a "sharp boundary," it does not posit a *magical* one. It posits a boundary determined by the same naturalistic facts that determine any other semantic fact. The cost is counterintuitive, but the benefit is a semantics that does not require a hierarchy of meta-languages to define truth for vague predicates.

  ### 2. Logic: Supervalidity Pathologies vs. Classical Stability

  This is often presented as a trade-off: Supervaluationism saves classical theorems (like Excluded Middle) while rejecting Bivalence; Epistemicism saves both. However, the technical cost to Supervaluationism is higher than usually acknowledged.

  **The Supervaluationist Vulnerability:**
  Supervaluationism defines validity as the preservation of *supertruth* (truth on all admissible precisifications). While this validates $P \lor \neg P$, it invalidates standard inference rules, most notably **Conditional Proof** and **Reductio Ad Absurdum** in their unrestricted forms.
  Consider: If we assume $P$ (where $P$ is borderline), we cannot derive a contradiction to prove $\neg P$, because $P$ might be true on some precisifications and false on others. Consequently, the deduction theorem fails: $\Gamma, A \models B$ does not guarantee $\Gamma \models A \to B$.
  For a graduate seminar, this is a massive theoretical cost. It requires rewriting the rules of natural deduction to restrict assumptions about borderline cases. It creates a disconnect between truth and assertibility: one can assert $P \lor \neg P$ while being unable to assert $P$ and unable to assert $\neg P$. This fractures the link between logical validity and rational inference.

  **The Epistemicist Defense:**
  Epistemicism retains classical logic wholesale. Bivalence holds, Excluded Middle holds, and all classical inference rules hold. The "paradoxes" of vagueness (like the Sorites) are diagnosed as unsound arguments with a false premise (the major inductive premise), rather than valid arguments with questionable logic. This allows the philosopher to utilize the full power of classical model theory and proof theory without ad hoc restrictions. In terms of theoretical economy, preserving classical logic is a significant virtue that outweighs the metaphysical oddity of sharp boundaries.

  ### 3. Credence and Higher-Order Vagueness: The Measure Problem vs. Margin for Error

  This is the decisive point. As you noted, the handling of credence and higher-order vagueness (HOV) is where the accounts diverge most sharply in terms of formal coherence.

  **The Supervaluationist Vulnerability:**
  To guide action, an agent needs to assign a credence to a borderline proposition (e.g., "This patch is red"). The natural Supervaluationist move is to equate credence with the proportion of admissible precisifications on which the proposition is true. This requires a **probability measure over the set of precisifications**.
  There are two fatal technical problems here:
  1.  **The Measure Problem:** There is no natural or unique way to measure the set of precisifications. Is the space of precisifications uniform? Why should one precisification count as much as another? Without a principled measure, the credence function is arbitrary.
  2.  **The HOV Regress:** As established in point 1, the set of precisifications is vague. If the set is vague, we cannot define a measure over it without precisifying the set itself. This leads to an infinite regress of measures over measures of precisifications. Consequently, Supervaluationism cannot provide a stable norm for rational credence in borderline cases. It leaves the agent with "truth-value gaps" that offer no guidance for decision theory.

  **The Epistemicist Defense:**
  Epistemicism handles this via Williamson's **Margin for Error Principles**. Knowledge requires safety: if you know $P$, then $P$ must be true in all nearby cases. For vague predicates, nearby cases include those across the sharp boundary. Therefore, you cannot know you are at the boundary.
  This yields a formal account of HOV: Iteration of knowledge fails ($K\phi \to KK\phi$ is not valid for vague $\phi$).
  Regarding credence: Since there is a fact of the matter, standard Bayesian probability applies. The agent's uncertainty is standard subjective uncertainty about an objective fact. We do not need a measure over precisifications; we need a prior over the location of the boundary, which is constrained by our usage. While we cannot pinpoint the boundary, we can model our ignorance using standard probability distributions without facing a regress. The Epistemicist integrates vagueness into standard decision theory; the Supervaluationist requires a new, unstable decision theory for "gappy" propositions.

  ### Conclusion: The Verdict

  **Epistemicism is the superior account.**

  Supervaluationism is initially attractive because it validates the intuition that "there is no fact of the matter." However, technically, this intuition is purchased at the price of logical pathologies (failure of Conditional Proof), semantic incompleteness (inexpressibility of global truth), and decision-theoretic paralysis (the measure problem over precisifications). The Supervaluationist attempt to model HOV collapses into a regress that prevents a coherent definition of truth or credence.

  Epistemicism, by contrast, absorbs the shock of vagueness into epistemology. It accepts that our semantic competence does not grant us luminous access to extensions. By maintaining classical logic and standard probability theory, it offers a robust framework for semantic analysis. The "sharp boundary" is not a bug, but a feature of a semantics that refuses to compromise on bivalence or logical validity.

  **Where the Losing Account is Vulnerable:**
  If you are teaching this seminar, press the Supervaluationist side on the **Measure Problem**. Ask them to define the probability space over precisifications without presupposing a sharp boundary between admissible and inadmissible precisifications. If they cannot define the measure, they cannot define rational credence. If they cannot define rational credence, their theory cannot guide action. This renders Supervaluationism technically incomplete as a theory of meaning and mind. Epistemicism avoids this by treating the uncertainty as standard ignorance, which is a solved problem in epistemology and decision theory.
