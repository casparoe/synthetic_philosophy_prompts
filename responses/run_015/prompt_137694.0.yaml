answer: |-
  # Teaching Plan: Lewis's Triviality Results for Indicative Conditionals

  **Session Duration:** 90 Minutes
  **Target Audience:** Graduate Philosophy Reading Group
  **Prerequisites:** Familiarity with Adams's Thesis ($P(A \to B) = P(B|A)$); basic probability theory.
  **Objective:** To demonstrate that Adams's Thesis is incompatible with the assumption that indicative conditionals express standard propositions within a single probability space, leading to the 'Trilemma'.

  ---

  ## 1. The Pedagogical Vehicle: Example and Abstraction

  You should not rely exclusively on the card deck, nor should you begin immediately with the abstract algebra. You require a **hybrid approach**.

  *   **The Intuitive Hook (Minutes 0–20):** Use the **Card Deck** (Heart/Queen).
      *   *Why:* It grounds the conditional probability $P(B|A)$ in something tangible.
      *   *Requirement:* The propositions must be logically independent (a card can be a Heart/Queen, Heart/Not-Queen, etc.).
      *   *Limitation:* You must explicitly state that this example has *fixed* probabilities (e.g., $P(\text{Heart}) = 1/4$).
  *   **The Proof Engine (Minutes 20–60):** Move to the **Generic Four-Cell Diagram** with variable weights $p, q, r, s$.
      *   *Why:* The triviality result turns on the ability to vary probabilities while holding the logical structure fixed. In the card case, one *can* find a proposition that matches the conditional probability for that specific distribution (e.g., a proposition true of exactly 4 cards). The impossibility arises when we demand the *same* proposition work for *different* probability assignments over the same logical space.
      *   *Requirement:* The weights $p, q, r, s$ must be treated as variables subject only to the constraints $p+q+r+s=1$ and non-negativity. They must not be fixed numbers.

  **Instruction:** Do not present the four-cell diagram merely as a truth-table for connectives (as your colleague suggested). Present it as the **exhaustive algebra of propositions** available in this space. This avoids the "magic trick" feeling by shifting the focus from syntax (connectives) to metaphysics (what propositions are available to be believed).

  ---

  ## 2. Sequence of Instruction

  You must adhere to the following order to ensure the logical dependencies are clear. Deviating from this risks the "sleight of hand" objection.

  ### Phase 1: The Setup (Minutes 0–20)
  1.  **Recap Adams's Thesis:** Re-state $P(A \to B) = P(B|A)$. Emphasise its intuitive appeal (the "Equation").
  2.  **The Proposition Assumption:** Explicitly state the target of Lewis's attack. We are assuming that $A \to B$ expresses a **proposition**.
      *   *Definition:* A proposition is a truth-evaluable object, representable as a set of possible states (or cells in our algebra).
      *   *Motivation:* Why assume this? Because we embed conditionals in larger sentences (e.g., "If (if A then B), then C"). To handle this, the conditional must have a truth value.
  3.  **Clarification on Material Conditional:** State explicitly here: **"We are not testing only the material conditional ($A \supset B$). We are testing *any* proposition in the algebra generated by A and B."**
      *   *Reasoning:* If $A \to B$ is a proposition in this space, it must correspond to *some* subset of the four cells. There are no other options.

  ### Phase 2: The Impossibility Proof (Minutes 20–60)
  4.  **Probability as Sum of Weights:** Introduce the four-cell diagram ($A \land B$, $A \land \neg B$, $\neg A \land B$, $\neg A \land \neg B$) with weights $p, q, r, s$.
      *   Establish that the probability of *any* proposition is the sum of the weights of the cells in which it is true.
  5.  **The Contradiction:**
      *   Write the Equation: $P(A \to B) = p / (p + q)$.
      *   Write the Proposition Constraint: $P(A \to B)$ must be a sum of some subset of $\{p, q, r, s\}$.
      *   **The Critical Step:** Show that no subset sum equals $p / (p + q)$ for *all* valid assignments of $p, q, r, s$.
      *   *Method:* Use two different probability distributions over the same cells. Show that a proposition that works for Distribution 1 fails for Distribution 2.
      *   *Note:* This is where you generalise from the fixed card deck. "In the card case, the weights were fixed. But a rational agent can change their mind about the deck composition without changing the meaning of 'Heart' or 'Queen'. The Equation must hold across these changes."

  ### Phase 3: Generalisation and Trilemma (Minutes 60–80)
  6.  **Lewis's Stronger Conclusion:** Move from "This specific conditional fails" to "All conditionals fail."
      *   Explain that if the Equation holds for *all* pairs $A, B$ in the space, the probability function collapses.
      *   Show the collapse: $P(A \land B) = P(A)P(B)$ (independence). If $B = \neg A$, then $P(A) = 0$ or $1$.
      *   *Result:* Only trivial (all-or-nothing) credence functions survive.
  7.  **The Trilemma:** Formulate the three jointly inconsistent commitments:
      1.  Conditionals express standard propositions (truth-evaluable).
      2.  Adams's Thesis holds ($P(A \to B) = P(B|A)$).
      3.  Credences are non-trivial (we can have uncertain beliefs).
      *   *Instruction:* You must state clearly: **"The upshot is not that 'if'-talk is nonsense. It is that we must abandon one of these three commitments."**

  ### Phase 4: Conclusion and Check (Minutes 80–90)
  8.  **Declared Omissions:** Briefly list what you are *not* covering (see Section 5).
  9.  **Final Exercise:** (See Section 6).

  ---

  ## 3. Misconception Map

  You have correctly identified the primary misunderstandings. Below is the mapping of when to intervene.

  | Misconception | Characterisation | Intervention Point | Strategy |
  | :--- | :--- | :--- | :--- |
  | **Target is Material Conditional** | "Lewis just proved the material conditional is bad again." | **Phase 1, Step 3.** | Explicitly state that the proof applies to *any* subset of the four cells, including Stalnaker-style closest-world propositions, provided they are treated as propositions in the space. |
  | **Zero Probability Antecedents** | "The proof only works if $P(A) = 0$." | **Phase 2, Step 5.** | Assume $P(A) > 0$ for the derivation. The contradiction arises from varying $P(A)$, not setting it to zero. |
  | **Non-Truth-Functional Escape** | "Stalnaker's semantics avoids this because it isn't truth-functional." | **Phase 3, Step 6.** | Clarify that Lewis's result targets *propositionhood*, not truth-functionality. A Stalnaker conditional is a proposition (a set of worlds); if it is in the algebra, it is subject to the triviality result. |
  | **Nonsense Upshot** | "Therefore, indicative conditionals don't exist." | **Phase 3, Step 7.** | Frame the result as a 'Trilemma'. We can keep conditionals if we drop Propositionhood (e.g., expressivism) or drop Adams's Thesis. |
  | **Conditional Prob as Updating** | "$P(B|A)$ is just a rule, not a value." | **Phase 1, Step 1 & Phase 4.** | Acknowledge this is a viable way out (taking conditional probability as primitive), but note that it requires revising standard probability theory (Kolmogorov). |

  **Missing Misconception:** You missed one predictable error: **The "Different Space" Objection.**
  *   *Misunderstanding:* Students may argue, "The conditional proposition lives in a *larger* algebra than A and B."
  *   *Intervention:* **Phase 2, Step 5.** Briefly note that Lewis's result can be extended to show that adding more atoms does not help; the triviality propagates. You need not prove this, but acknowledge the objection so they do not cling to it.

  ---

  ## 4. Declared Omissions

  To maintain focus, you must explicitly state what you are leaving out. Do not simply ignore these; name them as "paths not taken" so students know the landscape exists.

  1.  **Primitive Conditional Probability:** Mention that one solution is to treat $P(B|A)$ as primitive (Popper functions) rather than a ratio $P(A \land B)/P(A)$. State that this requires abandoning standard Kolmogorov axioms.
  2.  **Non-Propositional Semantics:** Mention that one solution is to deny that conditionals have truth conditions at all (e.g., Gibbard's expressivism, or treating them as random variables).
  3.  **Dynamic Semantics:** Acknowledge that some frameworks treat conditionals as context-change potentials rather than static propositions.

  **Instruction:** Say: *"I am mentioning these only to mark them as exits from the Trilemma. We will not evaluate their merits today; our goal is to feel the force of the trap Lewis has set."*

  ---

  ## 5. Final Check: The Trilemma Exercise

  Do not ask them to reproduce the algebra. That tests memory, not understanding. In the last ten minutes, present the following prompt on the board:

  > **The Trilemma Choice**
  >
  > Lewis has shown we cannot hold all three of the following:
  > 1.  **Propositionhood:** 'If A, B' expresses a standard proposition (true or false in each state).
  > 2.  **Adams's Thesis:** $P(\text{If A, B}) = P(B|A)$.
  > 3.  **Non-Triviality:** Rational agents can have uncertain beliefs (credences other than 0 or 1).
  >
  > **Task:**
  > 1.  Which of these three commitments are you most inclined to reject, and why?
  > 2.  If you reject **Propositionhood**, what becomes of the meaning of 'if'?
  > 3.  If you reject **Adams's Thesis**, what replaces it as the link between conditionals and probability?
  > 4.  If you reject **Non-Triviality**, what happens to empirical inquiry?

  **Assessment Criterion:** You are looking for students to recognise that the mathematical proof forces a *philosophical* choice. A successful answer will not complain about the math but will identify the philosophical cost of the chosen exit (e.g., "If I drop Propositionhood, I must explain what we are doing when we assert conditionals if not stating facts").

  ---

  ## 6. Summary of Dependencies

  *   You cannot introduce the **Four-Cell Diagram** (Phase 2) before establishing the **Proposition Assumption** (Phase 1). Without the assumption that the conditional *must* map to a subset of cells, the diagram is irrelevant.
  *   You cannot introduce the **Variable Weights** (Phase 2) before establishing the **Fixed Card Case** (Phase 1). Without seeing why it *seems* to work in fixed cases, students will not grasp why the variability is the killer.
  *   You cannot introduce the **Trilemma** (Phase 3) before the **Generalisation** (Phase 3). Students must see that the problem is not local to one conditional but systemic to the probability space.
  *   You must address the **Material Conditional Misconception** (Phase 1) before the **Proof** (Phase 2). If they think you are only attacking $A \supset B$, they will dismiss the proof as irrelevant to their preferred semantics.

  By following this sequence, you ensure that the algebra serves the philosophy, rather than obscuring it. The "magic trick" is avoided because the audience understands *why* the trick is being performed: to test the limits of propositionhood itself.
