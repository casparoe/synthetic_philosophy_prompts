      *   *Philosophical Root:* Hobbes prioritized the *causal story* (construction) over the *symbolic manipulation*. If the construction looked right to him, he thought he had knowledge. He lacked the rigorous formalism to check the construction. So, yes, his blunders are orthogonal to the *truth* of the math, but systematic regarding his *theory of knowledge*.

