      *   *Verdict:* The user's distinction is very close to Hobbes's. Hobbes calls them definitions that show the "possibility" of the thing. If you can't show how it's made, you haven't defined it philosophically, only grammatically.

  4.  **Address Question 2: Connection to the World (Axiomatic vs. Constructive)**

