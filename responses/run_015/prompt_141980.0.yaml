      *   *Hobbes's view:* Hobbes is a materialist. Space is the phantasm of existing things. Geometry is about "body considered as body" but abstracted from specific qualities. The connection isn't "application" (math here, world there); it's that the motions of geometry *are* the fundamental motions of the world.
      *   *Key Concept:* *Conatus* (endeavor) and the idea that geometric points/lines are limits of bodies, not non-entities. However, Hobbes struggles with "indivisibles."
