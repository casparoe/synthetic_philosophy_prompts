      *   **Goal:** Clarify Hobbes's theory of definition, the criterion for scientific definitions, the role of "we make it ourselves," and correct any distortions in the user's paraphrase.

  2.  **Deconstruct Hobbes's Epistemology & Metaphysics (Mental Retrieval & Verification):**

      *   *Nominalism:* Yes, universals are names. Truth is in propositions, not things.
      *   *Science (Scientia):* Knowledge of consequences from names. It's conditional: *If* we call X this, *then* Y follows.
      *   *Geometry:* It is the only science God has given us. Why? Because we construct the figures. We know the cause because we *are* the cause.
      *   *Physics:* We see effects (phenomena) but don't know the specific internal causes (micro-motions). We can hypothesize, but it's not *scientia* in the strict sense, it's prudence/conjecture.
      *   *Definition:* For Hobbes, a definition isn't just a dictionary entry. In *De Corpore*, a philosophical definition must resolve the name into its universal components and, crucially for generable things, specify the *cause* or *generation*.
      *   *Motion:* Everything is body and motion. Geometry is about quantity/motion abstracted from matter.
      *   *The "We Make It" Claim:* This is the hinge. In civil philosophy, we make the sovereign. In geometry, we make the figure. In physics, God made the world.
      *   *The Wallis Feud:* Hobbes insisted on geometric constructibility. Wallis used algebraic/analytic methods which Hobbes thought were "scabrous symbols" lacking clear geometric generation. Hobbes's errors often came from confusing distinct concepts of magnitude or motion, thinking he had a generation when he didn't.

  3.  **Address Question 1: Definitions (Generation vs. Inventory)**

      *   *User's intuition:* "Generation-definitions" vs. "Inventory-definitions."
      *   *Hobbes's view:* In *De Corpore*, a definition of a *generable* thing must express the cause. A circle isn't just "equidistant points"; it's "produced by a line moving around a fixed point."
