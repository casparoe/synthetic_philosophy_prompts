answer: |-
  You have put your finger on the exact pressure point where Hobbes's system tends to creak. The "tidy outline" you describe is the standard textbook summary, but as you've noticed, it glosses over the friction between his nominalist metaphysics (truth is in speech) and his causal epistemology (knowledge is of causes).

  Here is a breakdown of your questions, aiming to preserve the rigor of Hobbes's position without smoothing over the difficulties.

  ### 1. Definitions: Generation vs. Inventory

  Your distinction between "generation-definitions" and "inventory-definitions" is excellent and tracks Hobbes's own distinction in *De Corpore* between **philosophical definitions** and **grammatical (or nominal) definitions**.

  For Hobbes, a definition is not merely a stipulation of how a word will be used. It is a resolution of a name into its universal components. But for a definition to serve as a first principle of *scientia* (demonstrative knowledge), it must do more than list properties; it must show the **possibility** of the thing defined.
  *   **Inventory:** "A circle is a figure where all points are equidistant from a center." This lists a property. It doesn't tell you how a circle comes to be.
  *   **Generation:** "A circle is the figure made by the rotation of a line around one fixed end." This specifies the cause.

  **Why this blocks demonstrative physics:**
  You asked why a physicist can't just stipulate generation-definitions. The answer lies in the authorship of the cause.
  *   In **Geometry**, I can define a circle by its generation because *I* can perform that generation in my imagination (and on paper). I know the cause because I am the cause.
  *   In **Physics**, if I define "gravity" as "a motion downwards caused by X," I am guessing at X. I did not make the stone fall. I observe the effect (the fall). I can hypothesize a cause, but I cannot *define* the cause into existence because I lack the power to generate the phenomenon. I can only define the *name* "gravity" as a label for the observed effect. Therefore, physics remains conjectural (*prudentia*), not demonstrative (*scientia*).

  So, your intuition is correct: the constraint is that a scientific definition must express a cause that is **conceivably generable by the definer**. In physics, we are not the generators.

  ### 2. Connection to the World: Axiomatic vs. Constructive

  Your friend's "axiomatic/implicit definition" reading is indeed anachronistic. It imports a Hilbertian view of mathematics (where consistency is enough) that Hobbes would reject. For Hobbes, consistency of names is not enough; there must be a **phantasm of generation**.

  Hobbes is a materialist. For him, there is no "space" independent of body. Geometric objects are not abstract entities; they are **bodies considered under the aspect of quantity**.
  *   **The Third Option:** You suggested the definitions are legitimate because the generating motions are ones we can actually perform. This is the correct Hobbesian view.
  *   **The Link:** The connection to the world is not "application" (taking a pure math and mapping it to reality). The connection is **ontological identity**. The motions of geometry *are* the fundamental motions of the physical world, abstracted from specific qualities like color or hardness. Because all change in the universe is motion (Hobbes's universal causal principle), the science of universal quantity (geometry) is necessarily the grammar of the science of body (physics).

  However, this creates a vulnerability: if our conception of the motion is wrong, the science fails. Hobbes believes our sensory experience of motion guarantees the basic coherence of geometric generation. We know what it is to move a line because we have moved our hands.

  ### 3. The Contingency Worry (Pythagoras and Naming)

  This is the hardest pill for modern readers to swallow, but Hobbes bites it.
  *   **Truth is in Speech:** Hobbes famously argues that there is no "truth" in things, only in propositions. "Man is a living creature" is true not because of a real essence of Man, but because we have agreed to use the name "Man" for the conjunction of "living" and "creature."
  *   **Necessity:** Does this make the Pythagorean theorem contingent? In a sense, **yes**. It is contingent on the definitions of "triangle," "square," and "right angle." If we changed the definitions, the theorem would not hold.
  *   **But:** Once the definitions are fixed (by the universal consent of geometers), the consequences are **necessary**. Hobbes distinguishes between the *arbitrariness of the institution* of names and the *necessity of the consequence*. We couldn't call a circle a "square" tomorrow without destroying the science, but the truth of the theorem relies on the stability of the naming convention.

  Hobbes is not worried by this. He denies Real Essences. He doesn't need the theorem to be true "in the nature of things" independent of mind. He needs it to be true in the **consequences of names**. Since we control the names (via generation), we control the truth. This is why geometry is the only science God gave us: it is the only domain where we have the authority to fix the essences.

  ### 4. The Test Case: Impossible Figures

  Suppose a geometer defines a figure by a motion that is physically or conceptually impossible (e.g., a line of no breadth, or a "square circle").

  *   **Hobbes's Resource:** Hobbes has a criterion of **conceivability**. A definition is valid only if the mind can form a phantasm of the generation.
  *   **Line of No Breadth:** Hobbes actually struggles here. He rejects the Euclidean definition of a point as "that which has no part." For Hobbes, a point must be something (a body considered without magnitude). A "line of no breadth" is an abstraction, but if it implies a body with *zero* magnitude, Hobbes might call it nonsense. However, he generally allows geometric abstraction as long as it refers to a *possible* motion.
  *   **Square Circle:** This is a contradiction in generation. You cannot generate a figure that is both square and circular by motion. Hobbes would call this a "insignificant name." It sounds like a definition, but it signifies nothing conceivable.
  *   **Does this smuggle in realism?** It risks it. The constraint on definition is no longer just "stipulation"; it is "stipulation constrained by the laws of conceivable motion." Where do those laws come from? For Hobbes, they come from universal sense experience. It's not a Platonic realm; it's the shared structure of human sensory processing.

  So, on your test case: If the motion is inconceivable, it is **fiction/nonsense**, not science. Hobbes does have the resources to distinguish them, but the boundary is "can I imagine making this?" rather than "is this logically consistent?"

  ### 5. Hobbes's Mathematical Career (The Wallis Feud)

  This is where the rubber hits the road. Your suspicion is correct: **Hobbes's mathematical blunders are systematic consequences of his philosophy.**

  *   **Constructibility over Calculation:** Wallis used algebraic analysis (symbols, equations). Hobbes despised this. He called algebra "scabrous symbols" that hid the geometric generation. For Hobbes, if you cannot *draw* the solution, you haven't solved the problem. You haven't found the *cause*.
  *   **Squaring the Circle:** Hobbes believed he had squared the circle because he produced a geometric construction (a drawing) that he claimed worked. When Wallis showed algebraically that the ratios were impossible, Hobbes didn't accept the algebra. He trusted the **visual/causal story** over the **symbolic consequence**.
  *   **The Systematic Error:** Hobbes's theory of definition requires that every magnitude be comparable via geometric construction. He struggled with incommensurability because it threatened the idea that all quantity is generated by comparable motions. He thought he had established something when the calculation said otherwise because, for him, **knowledge is the vision of the cause**. If he saw the construction, he thought he had the cause. The fact that the construction was flawed was a failure of his eyes/hand, not his method.

  So, his errors are not orthogonal to the theory. They are the cost of doing business with a theory of knowledge that demands causal visualization for every truth.

  ### Summary: Correcting the Paraphrase

  Here is how to refine your group's "tidy outline" to withstand scrutiny:

  1.  **Philosophy:** Not just reasoning from definitions, but reasoning from **generative** definitions.
  2.  **Geometry:** Demonstrative not just because we make the definitions, but because we **perform the causes** (motions) that the definitions name. The objects are phantasms of our own making, grounded in universal sense experience of motion.
  3.  **Natural Philosophy:** Not demonstrative because we cannot define the **causes** of natural bodies, only their effects. We can reason from effects to *possible* causes, but never to *the* cause, because we are not the authors of nature.
  4.  **Civil Philosophy:** Demonstrative because the Commonwealth is an **Artificial Man**. We make the Sovereign by covenant. We know the passions (the motions) that drive men because we feel them in ourselves. Therefore, we can deduce the necessary conditions for peace just as we deduce the properties of a circle.
  5.  **The Hinge:** The "we-make-it-ourselves" criterion is not about arbitrary stipulation. It is about **Causal Authorship**. Truth is in speech, but *Science* is knowledge of consequences from causes. We only have scientific knowledge where we are the causal authors (Geometry, Civil Philosophy).

  **The Distortion in your Paraphrase:**
  You wrote: *"geometry... as genuinely about the physical world, the one part of his system that isn't guesswork."*
  **Correction:** Geometry is not about the physical world *directly*; it is about **quantity abstracted from body**. It is applicable to the physical world because the physical world *is* body in motion. But strictly speaking, geometry is about the consequences of our own conceptions of quantity. It is certain *because* it is about our conceptions, not because it matches an external reality (though Hobbes believes the match is guaranteed by the materialist nature of mind).

  **Final Advice for the Group:**
  When you hit *De Corpore*, pay close attention to Hobbes's treatment of **accidents** and **magnitude**. His attempt to ground geometry in a materialist metaphysics (where a point is a body, not a nothing) is the weak link that Wallis exploited. Hobbes wants geometry to be physical enough to be real, but abstract enough to be certain. Keeping that tension in mind will explain why he gets stuck on things like the angle of contact or the squaring of the circle. He isn't just bad at math; he is trying to do math in a way that satisfies his epistemology, and that turned out to be impossible.
