      *   *Honest Assessment:* No rational argument will dislodge the bedrock intuitions. Progress is pragmatic: better models of *reporting* mechanisms that satisfy the functionalists while respecting the *phenomenological constraints* without reifying "qualia" as ghostly particles.

  8.  **Drafting the Response (Iterative refinement):**
