      *   *Honesty:* Don't promise a solution. The prompt asks to state honestly what would count as progress. The honest answer is likely "a shift in framework, not a victory."

  10. **Final Polish:** Check tone (academic, analytical, precise). Ensure all parts of the prompt are addressed. (The prompt asks for a diagnosis, reasons from the camps, and an honest assessment of progress).

