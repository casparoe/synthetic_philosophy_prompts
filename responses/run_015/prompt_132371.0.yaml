      *   **Topic:** The philosophical dispute over qualia, specifically anchored in Dennett's Chase-and-Sanborn coffee tasters intuition pump.
      *   **Core Question:** Is the stalemate verbal (equivocation), substantive but hidden (metaphysical commitments), or cross-purpose (phenomenological vs. metaphysical questions)?
      *   **Requirements:**
          *   Provide a structural diagnosis.
