answer: |-
  The silence in the Hall of Integrity was not empty; it was heavy, pressed against Elian's eardrums like deep water. He stood at the podium, his report open before him, confused by the stillness. He had expected questions about load-bearing coefficients or thermal retention rates. He had not expected the Council to look at him as if he had drawn a weapon.

  "Auditor Elian," Councilor Vane said, his voice tight. "You classified Sector Four as *porous*."

  Elian blinked, adjusting his glasses. "Yes. The structural scan indicates micro-fractures in the outer membrane. Air exchange is at twelve percent above baseline. By definition, the sector is porous. It allows passage."

  "It allows passage," Vane repeated, the words tasting like ash. "Is that what you call them now? Passages?"

  "I call them what they are," Elian said, feeling a flicker of irritation. He was a man of metrics. In Aethel, truth was measured in microns and pressure gradients. "The dictionary definition is clear. *Porous: having minute spaces or holes through which liquid or air may pass.* It is a descriptor of physical state. It carries no moral weight."

  From the gallery, a woman stood up. It was Mara, a resident of Sector Four. Her hands were clenched at her sides. "No moral weight?" Her voice shook, not with fear, but with a suppressed violence. "My grandfather was called Porous. He wasn't allowed to work in the Clean Rooms. My father was called Porous. He was denied housing in the Core. And now you stand there, with your clipboard, and you call *us* Porous."

  "I am calling the *building* porous," Elian insisted, gesturing to the schematic behind him. "Not the people. The distinction is literal."

  "The word doesn't care about your distinction," Mara said, stepping down from the gallery until she stood on the floor of the Hall. "You think language is a container for facts. You think if you pour the right meaning into the word, it stays there. But words aren't containers, Auditor. They're vessels. They carry what everyone else poured into them before you ever touched them."

  Elian frowned. "That is poetics. I am speaking engineering."

  "You are speaking history," Mara countered. "Fifty years ago, when the Plague of Mist came, who died? The people in the sectors that couldn't hold the seal. The *porous* sectors. The word stopped meaning 'holes in the wall' and started meaning 'holes in the soul.' It means you are leaky. It means you cannot hold value. It means you are a risk to the sealed."

  Elian looked down at his report. The word *Porous* sat on the page in bold, black ink. To him, it was a neutral coordinate, a vector pointing to a repair job. To them, it was a verdict. He felt a sudden, vertiginous disconnect, as if the floor beneath him had shifted while the walls remained still.

  "I can amend the report," Elian said slowly. "I can use 'High-Exchange.' Or 'Vented.' Would that satisfy the accuracy requirement?"

  "It would satisfy your requirement," Mara said. "But it wouldn't change the force. If you mark us as different, as less than sealed, you subordinate us. You think you're just describing the world, but you're arranging it. When you say that word, you aren't telling us what we are. You're telling us what we're *for*."

  Elian looked at Councilor Vane. The Councilor wouldn't meet his eyes. That was when Elian understood the trap. He had believed that if his intent was pure, the word would be clean. He had believed that the *locution* (the statement of fact) could override the *illocution* (the social act of ranking). But the community did not hear his intent. They heard the history embedded in the sound.

  The word had a velocity that his explanation could not stop.

  "If I remove the label," Elian asked, his voice quieter now, "the fractures remain. The air still leaks."

  "Yes," Mara said. "The physics remains. But the shame doesn't have to. You can fix the walls without branding the people. You can say 'Needs Sealing.' That implies a future. 'Porous' implies a nature."

  Elian looked at the word again. *Porous.* It was so small. Just two syllables. How could something so small carry enough mass to crush a neighborhood? He realized then that meaning was not a property of the word itself, but a agreement between speakers. He had tried to unilaterally redefine the contract, trusting the dictionary over the people. He had treated language as a private tool for truth, when it was actually a public tool for power.

  He closed the folder.

  "I will rewrite the classification," Elian said.

  "Will you fix the walls?" Vane asked.

  "Yes. But I will not use that word."

  Mara nodded, once. The tension in the room didn't vanish, but it shifted. The weapon was being laid down, not because it was inaccurate, but because it was loaded.

  Elian walked out of the Hall into the cool air of Aethel. He watched the citizens moving through the sealed walkways, safe within their glass shells. He thought about the gap between what he said and what they heard. He had thought the gap was a failure of communication, a bridgeable distance. Now he saw it was a chasm, dug by decades of use, filled with the debris of old hurts.

  He took a pen from his pocket and crossed out *Porous* on the cover sheet. He wrote *Pending Integrity*. It was less precise, technically. It obscured the specific nature of the flaw. But it left the future open.

  He realized he would never trust a dictionary again. Words were not definitions; they were histories. And some histories were too heavy to carry, no matter how lightly you tried to hold them.
