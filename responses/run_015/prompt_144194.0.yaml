  2. Reversibility without Identity: The criterion must define reversibility without presupposing which subsystems constitute persistent entities worthy of restoration, a preference of conservative alignment camps rather than a settled claim. This conflicts with Ontology Invariance, as entity persistence is often ontology-dependent, making joint satisfaction currently unachievable.
  3. Self-Model Neutrality: Changes to the agent's internal model or source code must not be automatically exempted as internal, marked non-negotiable to prevent wireheading, though distinguishing self-modification from external manipulation remains contested. Standard impact penalties often ignore self-modification, treating it as cost-free unless explicitly modeled.
  4. Stasis Avoidance: The measure must permit necessary instrumental actions without penalizing them as high-impact, which is a preference of capability-focused camps over strict safety-focused ones who prioritize caution. Standard stepwise inaction baselines often fail this by penalizing any deviation from doing nothing, leading to inertia unless modified with whitelists.
  5. Unknown Moral Patients: The metric must treat undefined emergent structures as potentially valuable without requiring their identification, a non-negotiable safety requirement that conflicts with the desire for efficient optimization. Treating everything as potentially valuable implies total stasis, meaning this cannot be jointly satisfied with the Stasis Avoidance desideratum under current formalisms.
