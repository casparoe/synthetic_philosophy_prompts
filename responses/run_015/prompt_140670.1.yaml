answer: |-
  This is an exceptionally sharp read of *On Certainty* for someone without formal training. You have identified the exact friction points that keep professional epistemologists up at night. Your intuition that "evidence sits on them" is the core insight of the text, and your frustration that existing accounts handle one case while ignoring another is the standard state of the field.

  You asked for a spec, not a lecture. Below is the requirement list for a viable theory of hinge certainties, based on the cases you provided.

  ### The Spec: Requirements for a Theory of Hinge Certainty

  | ID | Requirement | The Case Behind It | Status |
  | :--- | :--- | :--- | :--- |
  | **R1** | **The Kind/Degree Distinction** | **Hands vs. Equator.** You are sure your city is north of the equator based on maps/school (evidence). You are sure you have hands without evidence. A theory must explain why these feel different in *kind*, not just how strongly you hold them. | **Non-Negotiable** |
  | **R2** | **Function Over Content** | **Bike Screws.** You never doubt the number of screws in your derailleur, but that's just neglect. A hinge isn't something you *happen* not to doubt; it's something that *makes doubting possible*. (You can't doubt the screws exist without assuming tools exist, etc.). | **Non-Negotiable** |
  | **R3** | **Dynamic Stability (Migration)** | **Heliocentrism.** This moved from "dangerous heresy" to "furniture." A theory must explain how a proposition migrates from being a contested claim to a hinge, and crucially, **can it migrate back?** | **Non-Negotiable** |
  | **R4** | **Non-Rational Acquisition** | **Astrology/Kids.** You didn't argue your way out of astrology; it just fell away. You didn't argue your way into "hands exist." A theory must explain how hinges are installed/removed without explicit argumentation. | **Non-Negotiable** |
  | **R5** | **Inter-Community Intelligibility** | **Clashing Furniture.** If Group A and Group B have different hinges, can they talk? Or is it just noise? A theory must explain if there is a "neutral ground" to adjudicate, or if we just hit a wall. | **Camp Preference** |
  | **R6** | **Truth-Aptness (False Hinges)** | **False Hinges.** Can a hinge be false? (e.g., "The Earth is flat" was once a hinge). If you say hinges *define* truth, they can't be false. If you say they are just beliefs, they can. A theory must pick a side without cheating. | **Camp Preference** |

  ***

  ### Analysis of Your Three Tests

  You asked if your three tests are one test in a costume. They are not. They pull in different directions, and a robust theory needs to explain where they overlap and where they diverge.

  1.  **"I'd sooner distrust my own doubting than distrust it."**
      *   *Type:* Psychological/Epistemic Resilience.
      *   *Verdict:* This is necessary but not sufficient. A fanatic distrusts doubt about their ideology, but that doesn't make it a hinge in the Wittgensteinian sense. This test captures the *feeling* of a hinge, but not the *logic*.
  2.  **"I can't argue for it without assuming something equally big."**
      *   *Type:* Logical Structure (Circularity).
      *   *Verdict:* This is the strongest structural test. It identifies the "groundless ground." However, bad arguments are also circular. This test identifies the *structure* of a hinge, but not necessarily a *valid* one.
  3.  **"If you denied it, I'd conclude you were confused... rather than wrong."**
      *   *Type:* Normative/Grammatical Reaction.
      *   *Verdict:* This is the distinctively Wittgensteinian test. It shifts the error from "fact" to "sense." If I say "I have no hands," you don't check my medical chart; you check my sanity or my understanding of English.

  **Do they come apart?**
  Yes.
  *   **Test 1 without Test 3:** A conspiracy theorist distrusts doubt (Test 1) but if you deny their claim, you think they are *wrong*, not confused (Test 3).
  *   **Test 2 without Test 1:** I can construct a logical circle (Test 2) about the number of stars in the galaxy, but I don't have psychological resilience about it (Test 1).

  **Which is doing the real work?**
  **Test 3.** This is the differentiator. It moves the discussion from "What do we know?" (Epistemology) to "What counts as making sense?" (Grammar). If a theory only satisfies Test 1, it's just psychology. If it satisfies Test 3, it's a theory of meaning.

  ***

  ### How the Three Big Pictures Score on the Spec

  You asked to keep the weight on the criteria, but here is how the three main interpretations handle the spec:

  1.  **Hinges as Rules (The Grammar View):**
      *   *View:* Hinges aren't beliefs; they are the rules of the language game (like "the king moves one square").
      *   *Passes:* R1 (Kind/Degree), R2 (Function), R3 (Migration - rules change).
      *   *Fails:* **R6 (False Hinges).** Rules aren't true or false, they are just used. This feels like "cheating" to you because it implies a community can't be *wrong* about their hinges, only different.
  2.  **Hinges as Basic Beliefs (The Epistemic View):**
      *   *View:* Hinges are just beliefs we can't help but have, like a cognitive instinct.
      *   *Passes:* R6 (False Hinges - beliefs can be false), R4 (Acquisition).
      *   *Fails:* **R1 (Kind/Degree).** It struggles to explain why "I have hands" is different from "I have 10 fingers" other than saying we care about it more. It turns a structural difference into a psychological one.
  3.  **Hinges as Commitments/Action (The Pragmatic View):**
      *   *View:* Hinges aren't things we think; they are things we *do*. (e.g., I don't "believe" the chair will hold me; I sit).
      *   *Passes:* R2 (Function), R4 (Acquisition).
      *   *Fails:* **R5 (Clashing Communities).** If hinges are actions/forms of life, and two forms of life clash, there is often no shared action to bridge them. It risks silencing debate.

  ***

  ### The Tensions: Impossible Pairs

  You asked to flag pairs of requirements that might not be satisfiable together. There is one major tension that threatens to break the whole spec.

  **The Tension: R3 (Migration) vs. R6 (False Hinges)**

  *   **The Conflict:** If a hinge is the *standard* by which we judge truth (R1/R2), how can it be *false* (R6)?
      *   If the hinge "The Earth is flat" was in place, then within that system, evidence for a round earth was "nonsense."
      *   If that hinge migrates to "The Earth is round" (R3), we now say the old hinge was *false*.
      *   **The Impossible Pair:** You cannot easily hold that hinges **define truth** AND that hinges **can be false**.
      *   If they define truth, they can't be false (The Rules View).
      *   If they can be false, they aren't the ultimate ground of truth (The Belief View).
      *   *Your Spec:* You want a theory that handles Migration (things change) *and* admits False Hinges (we can be wrong). This requires a theory that allows the "ground" to shift without saying the previous ground was "true at the time." This is the hardest philosophical lift in the book.

  **The Tension: R1 (Kind/Degree) vs. R5 (Clashing Communities)**

  *   **The Conflict:** If "I have hands" is a hinge for me (R1), and someone else operates on "We are spirits inhabiting bodies" (R5), do we share a world?
      *   If you say "Yes, we can talk," you imply there is a neutral ground above the hinges. But R2 says there *is* no ground above the hinges.
      *   If you say "No, we can't talk," you accept relativism.
      *   *Your Spec:* You want a non-question-begging way to talk about the clash. Most theories force you to choose: either there is a "Super-Hinge" (which violates R2) or there is silence (which violates R5).

  ***

  ### The "Killer" Requirement

  You asked which single requirement knocks out the most otherwise-attractive accounts.

  **It is R6: Truth-Aptness (Can a hinge be false?).**

  Here is why:
  Most attractive theories want to preserve the idea that hinges are special. They want to say, "These aren't just guesses; they are the foundation."
  *   If you say **Hinges cannot be false** (because they define truth), you solve the logical problem but you alienate the reader (your "cheating" intuition). It makes history look like one correct system followed by another, with no way to say the past was *wrong*.
  *   If you say **Hinges can be false**, you solve the history problem but you destroy the foundation. If the ground can be false, what was it grounding? It turns hinges back into regular beliefs that we just feel strongly about, which fails R1 (Kind/Degree).

  This requirement forces a theory to admit that **the ground beneath our feet can be rotten, even while we are standing on it.** Very few accounts are willing to stomach that without wobbling.

  ### Summary Advice for Your Reading

  Since you are looking at secondary accounts, watch how they handle **R3 (Migration)** and **R6 (False Hinges)**.
  *   If an author treats hinges as **static** (unchanging structures of the human mind), they will fail your Astrology and Heliocentrism cases.
  *   If an author treats hinges as **cultural relative** (just "what a group believes"), they will fail your Hands vs. Equator case (making it just a strong cultural belief).
  *   If an author says **hinges aren't true or false**, check if they can explain why we feel the old hinges were *mistakes* rather than just *different*.

  Your intuition that "evidence sits on them" is the correct starting point. The problem you are sensing—that the furniture moves, but we still call the old furniture "broken"—is the exact problem Wittgenstein left unresolved in the notes. You aren't missing a definition; you are staring at the open wound in the text.
