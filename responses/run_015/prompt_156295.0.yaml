answer: |-
  ### Strategic Assessment: One Project or Two?

  Before you read the proposal draft, here is the direct answer to your scope worry.

  **This is one project, provided you frame the metaphysics as a variable, not a foundation.**
  Your worry ("is paying a counterfactual copy even the right kind of reason?") is the *engine* of the dissertation, not a separate paper. If you try to solve the metaphysics of counterfactual identity first, you will stall. Instead, treat the identity of the beneficiary (You-in-Counterfactual vs. Stranger-with-Same-Algorithm vs. Unconnected-Stranger) as a dial in your hybrid case.
  *   **If** the verdict holds for the unconnected stranger, the theory is committed to a robust form of algorithmic consequentialism.
  *   **If** the verdict breaks when the beneficiary is a stranger, the theory relies on a hidden premise about identity or correlation.
  *   **The Payoff:** You aren't solving metaphysics; you are using metaphysical intuition pumps to stress-test decision theories. That is a single, coherent dissertation chapter (or two tightly linked ones). Do not split them. Write the hybrid case first; let the metaphysical implications fall where they may.

  ***

  ### Research Proposal

  **Project Title:** Decoupling Counterfactual Dependence: A Structural Analysis of Rational Commitment

  **1. The Research Question**
  Contemporary decision theory faces a persistent tension between cases that reward counterfactual robustness (e.g., Counterfactual Mugging) and cases that reward evidential screening (e.g., XOR Blackmail). Standard non-causal approaches (such as Functional or Updateless Decision Theory) typically endorse paying in both scenarios, justifying this via a unified appeal to the output of the agent's decision procedure across possible worlds.

  This project asks: **Is this unified justification structurally stable, or does it tacitly conflate two distinct mechanisms of counterfactual dependence?**

  Specifically, I hypothesize that the "Mugging" case relies on the counterfactual branch *constituting the payoff* (the money exists only if the algorithm pays), while the "Blackmail" case relies on the counterfactual branch *constituting the evidence* (the letter arrives only if the algorithm pays). By constructing a hybrid scenario where these mechanisms are forced to pull in opposite directions, this project seeks a determinate answer: Do leading decision theories fracture when the payoff structure and the evidence structure are decoupled, or do they remain robust?

  **2. Significance and Broader Impact**
  *For the Decision Theorist:* This project isolates a specific ambiguity in the formalization of "logical counterfactuals." If the theories fracture, it suggests that current formalisms are under-specified, requiring distinct operators for payoff-dependence and evidence-dependence. This has direct implications for the development of stable decision algorithms in non-ideal environments.

  *For the Generalist:* Why does this matter beyond technical puzzles? This research addresses the limits of rational commitment. We often bind ourselves to rules (constitutions, promises, safety protocols) because doing so changes how the world interacts with us, even when breaking the rule in a specific instance seems costless.
  1.  **Policy and Credibility:** If the "Blackmail" mechanism (signaling) is distinct from the "Mugging" mechanism (payoff), it changes how we understand international deterrence or contractual trust. Is credibility about changing the *outcome* of a conflict, or merely changing the *probability* of the conflict occurring?
  2.  **AI Alignment:** As we deploy autonomous agents that make high-stakes decisions based on predictions of their own behavior, we need to know if "being the kind of agent that pays" is a coherent goal when the beneficiary is not the agent itself. This project clarifies whether "rationality" requires agents to sacrifice actual resources for counterfactual benefits, and under what conditions.

  **3. The Gap in Existing Approaches**
  Current literature treats these cases as a unified block.
  *   **Causal Decision Theory** rejects both, dismissing counterfactual payoffs as irrelevant. It avoids the conflation but fails to capture the intuitive benefit of pre-commitment.
  *   **Evidential Decision Theory** struggles with the Blackmail case, often recommending paying to avoid bad news, but lacks the machinery to justify the Mugging payoff in a branch known to be false.
  *   **Functional/Updateless Approaches** accept both verdicts. However, they justify this by appealing to a single notion of "subjunctive dependence." They do not distinguish between dependence that creates value (Mugging) and dependence that filters information (Blackmail).

  The critical move these theories make is to treat the output of the decision procedure as a fixed logical fact across worlds. My project challenges this by asking: *What happens when the logical fact that creates the payoff is distinct from the logical fact that filters the evidence?* If the standard theories cannot distinguish these, they risk recommending acts that are simultaneously evidentially disastrous and counterfactually barren.

  **4. Methodology and Work Plan**
  This is a one-year project designed to accommodate a standard teaching load. The method is conceptual engineering followed by theoretical stress-testing.

  *   **Months 1–3: Formalizing the Hybrid Case.**
      I will construct the "Hybrid Mugging-Blackmail" scenario. In this setup, a predictor decides whether to send a letter (Blackmail mechanism) and whether to deposit funds in a counterfactual account (Mugging mechanism) based on the same decision procedure. I will formalize the payoff matrices and probability structures to ensure the mechanisms can be independently varied.
      *   *Deliverable:* A working paper draft of the case setup.

  *   **Months 4–6: Varying the Parameters.**
      I will run the hybrid case through the standard theories while adjusting two key "knobs":
      1.  **Predictor Accuracy:** Does the verdict flip at different thresholds for the evidence mechanism versus the payoff mechanism?
      2.  **Beneficiary Identity:** I will vary who receives the counterfactual payoff (the agent, a perfect copy, a stranger running the same algorithm, an unconnected stranger). This tests whether the theory relies on identity or mere correlation.
      *   *Deliverable:* Detailed analysis notes and a seminar presentation.

  *   **Months 7–9: Drafting the Core Argument.**
      I will write the central chapter analyzing the divergence. If the theories fracture, I will categorize the failure modes. If they hold, I will articulate the stronger commitment they are making (e.g., that algorithmic correlation is sufficient for obligation regardless of identity).
      *   *Deliverable:* Full draft of the dissertation chapter.

  *   **Months 10–12: Refinement and Implications.**
      I will refine the argument based on feedback and draft an introduction/conclusion that links the technical results back to the broader questions of commitment and evidence.
      *   *Deliverable:* Final chapter submission.

  **5. Possible Conclusions and Decision Criteria**
  There are three likely outcomes, each philosophically significant:
  1.  **Divergence:** Theories recommend paying for the payoff mechanism but refusing for the evidence mechanism (or vice versa) in the hybrid case. *Conclusion:* Current unified formalisms are inadequate; we need a pluralistic decision theory.
  2.  **Robustness:** Theories maintain the same verdict regardless of the decoupling. *Conclusion:* These theories are committed to a much stronger form of "logical influence" than previously admitted, potentially implausible when the beneficiary is an unconnected stranger.
  3.  **Collapse:** The hybrid case cannot be coherently constructed without reverting to one of the original cases. *Conclusion:* The distinction I propose is illusory; the mechanisms are inextricably linked.

  I will decide between these based on whether the hybrid case generates a stable intuition pump that resists "biting the bullet." If a theory must accept a verdict that violates basic evidential norms to maintain counterfactual payoff consistency, that counts as a theoretical cost.

  **6. Risk Assessment: Conditions for Failure**
  An honest assessment of failure conditions is necessary. This project fails if:
  *   **The Hybrid Collapses:** If it turns out that logically separating the evidence filter from the payoff generator is impossible without making the case trivial or incoherent, the central distinction vanishes.
  *   **The Metaphysics Swamps the Decision Theory:** If the debate shifts entirely to "do counterfactual strangers exist?" rather than "what should the agent do?", the project becomes a metaphysics dissertation. I will mitigate this by treating beneficiary identity as a test parameter for the decision rule, not an ontological inquiry.
  *   **Triviality:** If the standard theories have already implicitly solved this (e.g., if the distinction is already encoded in their formalism but just unnamed), the contribution is merely terminological. I will mitigate this by focusing on the *verdicts* in the hybrid case; if the verdicts are unchanged despite the structural shift, that is a substantive finding about the theories' commitments, not a trivial one.

  **7. Feasibility**
  I have already drafted the initial intuition pumps for the hybrid case and verified that they do not trivially reduce to the originals. The timeline allows for deep engagement with the formal literature while accounting for teaching responsibilities. The project requires no empirical data, only rigorous conceptual analysis, making it highly feasible within the one-year window.
