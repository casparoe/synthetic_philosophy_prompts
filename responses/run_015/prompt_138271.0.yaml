  2.  **Deconstruct Logical Induction (LI):**
      *   **Core Mechanism:** A market maker sets prices $P_t(\phi)$ for sentences $\phi$ at time $t$. Prices converge to a coherent probability distribution in the limit.
      *   **Traders:** Computable traders try to make money. If a trader can make unbounded profit, the prices are bad. The LI algorithm ensures no *computable* trader makes unbounded profit.
      *   **Logical Uncertainty:** Assigning probabilities to mathematical statements whose truth value is fixed but unknown (e.g., digits of pi, conjectures).
      *   **Key Property:** The market learns patterns faster than deduction. It knows "this statement is likely true" long before a proof is found.
      *   **Key Limitation:** You don't know *when* you've converged. The prices at time $t$ are not guaranteed to be close to the limit, just that they won't be exploited by any computable strategy *in the long run*.
      *   **Self-Reference:** The system can handle sentences about its own prices (e.g., "The price of this sentence will be > 0.5 tomorrow").

