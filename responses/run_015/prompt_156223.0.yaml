answer: |-
  Hello there,

  It is really impressive that you are picking up on this nuance because what you are describing is a genuine and widely debated issue in how history is written and consumed, even if it does not always get highlighted in introductory classes. You have correctly identified that standard presentism is usually defined as the blanket application of contemporary moral standards to historical figures, essentially judging the past entirely by the rules of the present. However, the pattern you are noticing is more sophisticated and arguably more deceptive because it is not a blanket application but rather a strategic one. While there is not one single Greek or Latin derived technical term that every historian uses to label this exact phenomenon, it is most commonly referred to in academic circles as selective presentism or sometimes instrumental presentism. The reason there is not a more specific word is that historians generally try to avoid doing this, so it has not been normalized enough to warrant its own unique vocabulary like historiography or chronology, but critics of popular history often point to it as a form of moral opportunism.

  The key difference between this selective approach and normal presentism lies in the consistency of the lens being used. Normal presentism is like wearing a pair of tinted glasses that color everything you see in the past with modern values, so every action is judged by today's rules regardless of whether it makes the historical figure look good or bad. What you are describing is more like using a flashlight in a dark room where the writer turns the beam on only when it illuminates something that supports their specific narrative argument. If condemning a figure helps the story of progress or highlights a villain, the modern moral spotlight is turned on. If excusing a figure helps maintain complexity or protects a national hero, the light is turned off and the writer hides behind the shield of historical context. This is different from simple inconsistency because simple inconsistency is usually accidental or due to carelessness, whereas this selective method is often intentional and driven by the needs of the story being told. It serves a rhetorical purpose to make the past feel relevant to current political or social debates without having to do the hard work of applying a consistent ethical framework.

  If we were to give this a specific name to help distinguish it further, you might call it narrative-driven moralizing because the moral judgment depends entirely on the role the historical figure plays in the author's story. In the example you gave about the medieval queen, the author wants to celebrate her as a proto-feminist icon so they apply modern standards to her support of education, but they need to explain away her religious persecution so they switch to historical relativism to avoid condemning their own hero. This creates a double standard where the past is only foreign when it is inconvenient to judge it. The edges of this practice are defined by transparency and consistency. A historian stays within ethical bounds if they are transparent about when they are making a moral judgment versus when they are explaining context, or if they apply the same standard to friends and foes alike. The practice crosses the line into this selective presentism when the switch between modern judgment and historical excuse happens without explanation and correlates perfectly with whether the author wants you to like or dislike the subject.

  It is worth noting that this happens frequently in textbooks and podcasts because those formats often rely on clear narratives to keep the audience engaged, and nuance can sometimes feel like ambiguity to a general audience. Writers might feel pressure to make historical figures relatable by highlighting their progressive moments while simultaneously protecting them from being canceled by modern audiences for their regressive actions. This creates the whiplash you are feeling where a person is both a hero for their time and a villain for ours depending on the paragraph you are reading. Recognizing this pattern is a sign of strong historical thinking because it shows you are not just absorbing information but analyzing the framework behind the information. You are essentially spotting the seams in the construction of the narrative.

  To answer your question about where the edges are, the boundary lies in whether the author acknowledges the tension. Good history writing will admit that a figure can be both progressive in one area and oppressive in another and will explain why without shifting the goalposts of judgment. When an author pretends that the progressive act was purely moral genius while the oppressive act was purely structural inevitability, they are engaging in this selective presentism. It is a way of having it both ways, claiming the moral high ground of the present while retaining the empathetic cover of the past. You should feel confident in trusting your instinct on this because it is a valid critique of how history is often packaged for public consumption. Keep looking for those switches in logic because noticing them is the first step toward understanding how history is used to shape our view of the present.

  I hope this helps clarify what you are seeing and gives you some language to describe it. It is rare for a high school student to catch this level of methodological detail, so you should trust your analysis. History is not just about memorizing dates and names but about understanding how stories about the past are constructed, and you are already doing that work.

  Best regards

  Your History Assistant
