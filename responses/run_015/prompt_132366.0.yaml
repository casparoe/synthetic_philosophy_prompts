prompt: |-
  hey im a backend engineer with zero formal philosophy training. my team keeps fighting over tiny product tweaks that might lower carbon — like an api-batching toggle or a server low-power mode — and management kills them with "one app cant change the climate, its collective". i want a reusable decision procedure we can actually run on these proposals, grounded in whatever philosophy actually says about individual contributions to collective harm and that inefficacy objection. keep the jargon out.

  it should be ordered questions: 1) is the harm linear or threshold-based (tipping points)? 2) is there direct causal impact, or mainly symbolic / structural effect? 3) is there a coordination or scaling mechanism? 4) pure values call — does the principle matter even if outcome is nil? for each step define what moves us on, what stops with hard no, what stops with hard yes, and flag exactly where human judgement takes over because its not a fact question.

  run it on three proposals: (a) shipping the api-batching feature (~0.2% energy saved per user); (b) banning beef at company events; (c) adding an in-app banner urging users to vote in local elections, even though one vote almost never decides anything. make sure one result comes back against our intuition — like telling us not to ship something that feels obviously good.

  say where the procedure misfires and what it cant settle. dont make me read anyone, just build the checklist.
