answer: |-
  # The "Collective Impact" Decision Procedure

  This checklist is designed to bypass the "one app can't change the climate" deadlock. It separates actions that physically reduce harm from actions that only signal virtue. It forces you to identify where you are guessing instead of measuring.

  ### Step 1: Is the harm linear or threshold-based?
  *Does this action reduce harm incrementally (linear), or does it require a specific critical mass to matter at all (threshold)?*

  *   **Move On:** The harm is **linear** (e.g., energy use, carbon per request). Every unit saved counts, even if small.
  *   **Hard No:** The harm is **threshold-based** AND you cannot mathematically reach the tipping point alone. (e.g., Preventing a specific server farm from being built requires 100% industry adoption; you have 1%).
  *   **Hard Yes:** The harm is **threshold-based** AND you are the trigger. (Rare in software, but possible if you are the market leader setting a standard).
  *   **⚠️ Human Judgment Flag:** Determining if a specific environmental impact is truly linear or has a hidden threshold is often a scientific guess, not an engineering fact. You are assuming linearity here.

  ### Step 2: Is there direct causal impact, or mainly symbolic/structural?
  *Does this change physics (electricity/fuel), or does it change human behavior/perception?*

  *   **Move On:** There is **direct causal impact** (e.g., less CPU cycles = less electricity).
  *   **Hard No:** It is **purely symbolic** with high friction/cost and no proven behavioral change in others. (e.g., A policy that annoys users but doesn't actually lower carbon).
  *   **Hard Yes:** It is **direct causal impact** with negligible performance cost.
  *   **⚠️ Human Judgment Flag:** Estimating the "symbolic effect" (will others copy us?) is speculation. You are guessing human psychology, not measuring system load.

  ### Step 3: Is there a coordination or scaling mechanism?
  *If we do this, does it make it easier for others to do it, or is it a one-off?*

  *   **Move On:** It is **isolated** (no clear path for others to copy). Proceed to Step 4.
  *   **Hard No:** It is **isolated** AND has high maintenance cost. (You bear the cost, the planet gets no collective benefit).
  *   **Hard Yes:** There is a **scaling mechanism** (e.g., open-sourcing the tool, setting an industry standard, regulatory compliance). This solves the "collective action" problem.
  *   **⚠️ Human Judgment Flag:** Predicting adoption is a business guess, not a technical fact. You are assuming your team has the influence to scale this.

  ### Step 4: Pure values call — does the principle matter even if outcome is nil?
  *If the carbon savings were proven to be zero, would we still do this because it aligns with who we are?*

  *   **Hard No:** **No.** It is performative. If the outcome is nil, the cost is wasted.
  *   **Hard Yes:** **Yes.** It is a core integrity constraint (e.g., "We do not build surveillance features," regardless of profit).
  *   **⚠️ Human Judgment Flag:** This is entirely subjective. There is no fact to measure here. This is where leadership must declare a value, not engineer a solution.

  ---

  # Running the Procedure

  ### Proposal A: Shipping the API-batching feature (~0.2% energy saved per user)
  1.  **Linear/Threshold?** **Linear.** Energy use scales with requests. 0.2% saved is 0.2% saved. *(Move On)*
  2.  **Direct/Symbolic?** **Direct.** Fewer round trips = less network energy and compute. *(Hard Yes candidate)*
  3.  **Coordination?** **Isolated,** but low cost. *(Move On)*
  4.  **Principle?** **Yes.** Efficiency is a core engineering value. *(Hard Yes)*
  *   **Verdict:** **SHIP IT.**
  *   **Why:** It passes the "Direct Causal" test. Even if small, it is real physics, not signaling.

  ### Proposal B: Banning beef at company events
  1.  **Linear/Threshold?** **Linear.** Less beef = less carbon. *(Move On)*
  2.  **Direct/Symbolic?** **Mostly Symbolic.** Catering is <1% of a tech company's carbon footprint (compute dominates). The direct impact is negligible. *(Move On)*
  3.  **Coordination?** **Isolated.** Other companies won't change their catering because you did. *(Move On)*
  4.  **Principle?** **Debatable.** Is "vegetarian catering" a core engineering integrity value, or a lifestyle preference? *(Human Judgment)*
  *   **Verdict:** **HARD NO.**
  *   **Why:** This fails Step 2 and 3. It feels "green," but for a backend company, it is virtue signaling. The carbon saved is trivial compared to server load, and it creates friction (employee satisfaction) without solving the collective problem.
  *   **Counter-Intuitive Result:** This feels "obviously good" for the climate, but the procedure flags it as a distraction from the actual leverage points (compute).

  ### Proposal C: In-app banner urging users to vote in local elections
  1.  **Linear/Threshold?** **Threshold.** One vote rarely decides an election. *(Hard No candidate)*
  2.  **Direct/Symbolic?** **Symbolic.** It does not directly reduce carbon; it hopes users vote for green policies. *(Hard No candidate)*
  3.  **Coordination?** **Isolated.** One banner doesn't change election mechanics. *(Move On)*
  4.  **Principle?** **Debatable.** Civic engagement is good, but is it a *climate* action? *(Human Judgment)*
  *   **Verdict:** **HARD NO.**
  *   **Why:** Fails Step 1 and 2. It adds code weight (carbon cost) for a symbolic outcome that relies on a threshold (election results) you cannot influence. It conflates "civic good" with "climate efficacy."

  ---

  # Where This Procedure Misfires

  **1. The "Drop in the Ocean" Trap (Step 1)**
  The procedure assumes linearity is "good enough." Philosophically, some argue that if an action is *too* small to be measured, it is morally equivalent to zero. If your 0.2% savings is unmeasurable in the real world, Step 1 might give a false "Hard Yes."
  *   **Limit:** It cannot tell you when "small" becomes "negligible."

  **2. The "Signaling" Blind Spot (Step 2)**
  The procedure is skeptical of symbolic acts. However, social change often *starts* with symbolic acts that shift norms (e.g., recycling bins were once symbolic, now standard). The procedure might kill the seed of a cultural shift because it demands immediate causal proof.
  *   **Limit:** It undervalues long-term cultural influence in favor of short-term physical metrics.

  **3. The "Core Value" Subjectivity (Step 4)**
  Step 4 is where the procedure hands the gun to management. If leadership says "Profit is our only value," Step 4 kills any eco-initiative that doesn't save money. The procedure cannot force a value judgment; it only exposes it.
  *   **Limit:** It cannot resolve conflicts where "efficiency" clashes with "growth."

  **4. The Measurement Gap (Judgment Flags)**
  Every "Human Judgment Flag" is a place where you lack data. You likely don't know the exact carbon cost of a banner vs. the carbon cost of beef. The procedure forces you to admit you are guessing, but it doesn't give you the answer.
  *   **Limit:** It identifies ignorance; it does not cure it.
