answer: |-
  # The 10-Minute Divergence Checklist

  **Purpose:** To determine within the first ten minutes whether a disagreement can be solved by talking, requires authority, or is actually about values.
  **Mediator Tools:** Pen, paper, timer.
  **Rule:** If the clock hits 10 minutes and you have not reached a verdict below, stop the diagnostic and move to the Decision Matrix.

  ### Step 1: Write the Proposition (2 Minutes)
  Ask both parties to agree on one sentence that describes what they disagree about. Write it down.
  *   **Mediator Script:** "I need you to finish this sentence: 'We disagree about whether...' It cannot be about how you feel. It must be about what happened or what the rule is."
  *   **Sufficient Answer:** A factual claim (e.g., "He copied the numbers") or a rule claim (e.g., "Quiet hours start at 10 PM").
  *   **Stop Condition:** If they cannot agree on the sentence because one says "It's about respect" and the other says "It's about noise," circle "Value Conflict" and go to **Decision Matrix**.

  ### Step 2: Swap the Evidence (3 Minutes)
  Ask each party to list exactly what they saw, heard, or read that leads them to believe their proposition is true.
  *   **Mediator Script:** "List the specific things you know. Emails, texts, what you saw with your eyes. Not what you think it means, just what it is."
  *   **Sufficient Answer:** A list of shared items (e.g., "We both saw the spreadsheet").
  *   **Private Evidence Condition:** If a party says, "I know something I can't tell you," write "Private Info" next to their name.
      *   **Action:** If the private info is essential to the proposition (e.g., "I know he threatened me offline"), mark **Escalation Required**. Do not press them to reveal it.
  *   **Stop Condition:** If the evidence lists are totally different (they weren't in the same room, saw different files), mark **Prior Mismatch** and go to **Decision Matrix**.

  ### Step 3: Check the Prior (2 Minutes)
  Ask if they would interpret the *other person's* evidence the same way if they had seen it first.
  *   **Mediator Script:** "If you had seen exactly what they saw, with no other history, would you come to the same conclusion they did? Yes, No, or Not Sure."
  *   **Sufficient Answer:** "Yes" means you share a prior. "No" means your life experience changes how you read the facts.
  *   **Stop Condition:** If both say "No" (e.g., one has been assaulted before, one hasn't), mark **Prior Mismatch** and go to **Decision Matrix**.

  ### Step 4: The Update Check (3 Minutes)
  Ask if hearing the other side's explanation has changed their confidence level at all.
  *   **Mediator Script:** "Before you heard their side, how sure were you? Now, are you a little less sure, a little more sure, or the same? Use: Sure, Pretty Sure, or Guessing."
  *   **Sufficient Answer:** Any movement (e.g., "I was Sure, now I'm Pretty Sure").
  *   **Stop Condition:** If both say "The Same" after hearing the other's evidence and reasoning, mark **Impasse**.
  *   **Bad Faith Check:** If one party refuses to answer or says "I'm right, they're wrong" without addressing the evidence, mark **Impasse**.

  ### Decision Matrix
  *   **Value Conflict (Step 1):** **HAND_TO_VALUES**. (Mediation cannot solve this; rules must be clarified by authority).
  *   **Private Info Blocking (Step 2):** **ESCALATE**. (Advisor/Dean must handle confidentiality vs. safety).
  *   **Prior Mismatch (Step 2/3):** **ESCALATE**. (Different life experiences mean peers cannot set the standard; authority must decide the norm).
  *   **Impasse (Step 4):** **RECORD_IMPASSE**. (Evidence is shared, priors are similar, but no movement. Someone is not updating).
  *   **Movement but Time Up:** **KEEP_TALKING**. (Schedule a second session. Do not force agreement).
  *   **Resource Division Only:** **SPLIT_THE_DIFFERENCE**. (Only use if the disagreement is purely about dividing a tangible resource, e.g., who gets the top bunk, not about truth).

  ### The "Bad Faith" Script
  If you reach **RECORD_IMPASSE**, you must say this to the room:
  *"We have the same facts. You both understand them. But neither of you is moving. That means one of you knows the other is right and won't admit it, or you both care more about winning than the truth. I am recording this as an impasse. The Dean will read that. Do you want to try one more time to find the truth, or should I finish the report?"*

  ### The Clock Rule
  Aumann's theorem assumes infinite time to reach common knowledge. You have 25 minutes.
  *   **Instruction:** Treat the 25-minute limit as a hard constraint. If the bell rings during Step 4 and there is no movement, do not extend. Mark **RECORD_IMPASSE** or **ESCALATE** depending on severity. "Splitting the difference" to beat the clock is forbidden; it teaches them that stubbornness pays off.

  ***

  # Case Studies

  ### Case 1: The Lab Partners
  **Step 1 (Proposition):** "We disagree about whether Student A copied numbers from the shared spreadsheet." (Fact).
  **Step 2 (Evidence):** Both admit to seeing the same spreadsheet and edit history. No private info.
  **Step 3 (Prior):** Both agree that if the history shows Student A edited after Student B without citation, it counts as copying. (Shared Prior).
  **Step 4 (Update):** Student A says "I know I didn't copy." Student B says "The history says you did." Neither changes confidence.
  **Analysis:** Shared evidence, shared standard, no movement. This is an academic integrity violation. Peers cannot arbitrate dishonesty.
  Verdict: ESCALATE

  ### Case 2: The Roommate Dispute
  **Step 1 (Proposition):** "We disagree about whether the calls are loud enough to hear." (Fact) BUT mediator probes deeper. Student A adds: "And that it violates the rule." Student B adds: "And that the rule shouldn't apply to calls."
  **Step 2 (Evidence):** Student A hears it. Student B says "It's not loud." (Subjective sensory evidence).
  **Step 3 (Prior):** Student A believes quiet hours are strict rules. Student B believes they are courtesy guidelines.
  **Analysis:** The factual dispute (loudness) is secondary to the normative dispute (rule vs. courtesy). Mediation cannot rewrite housing policy.
  Verdict: HAND_TO_VALUES

  ### Case 3: The Group Chat Threat
  **Step 1 (Proposition):** "We disagree about whether the message was a serious threat." (Fact/Risk Assessment).
  **Step 2 (Evidence):** Both read the same message. Both know the sender. No private info.
  **Step 3 (Prior):** Both claim to know the sender's humor.
  **Step 4 (Update):** Student A (your friend) says "It was a joke." Student B says "It was a threat." Neither moves.
  **Analysis:** Shared evidence, shared context. Disagreement persists. This is a safety issue. If you are wrong, someone gets hurt. If your friend is wrong, someone gets hurt. Peers cannot decide safety thresholds. Your desire to keep talking is a bias; the procedure flags this as high-risk stagnation.
  Verdict: ESCALATE

  ***

  If the facts are shared and the standards are shared, stubbornness is the only thing left to find.

  ***

  # Limitations and Failure Modes

  1.  **Judgment Calls Dressed as Steps:** Step 1 (Fact vs. Value) is the weakest link. A determined student can frame a value judgment as a fact ("It is a fact that you were rude"). Mediators must be trained to spot "should" hidden inside "is."
  2.  **Power Dynamics:** This procedure assumes equal footing. If one student is a team captain and the other is a rookie, the rookie may "agree" to avoid conflict, triggering a false **KEEP_TALKING** or **SPLIT_THE_DIFFERENCE**. The procedure cannot detect coercion.
  3.  **The "Friend" Bias:** As seen in Case 3, the mediator's own relationship to a party compromises Step 4. You cannot objectively judge if your friend is updating. In such cases, you must recuse yourself, but this procedure does not force recusal; it relies on your honesty.
  4.  **Aumann's Time Constraint:** The procedure treats "no movement after 10 minutes" as a hard stop. In reality, some breakthroughs happen at minute 24. This procedure sacrifices those rare breakthroughs to prevent endless looping. It prioritizes efficiency over depth.
  5.  **Cannot Solve Lying:** If one party lies about the evidence in Step 2, the procedure will record **RECORD_IMPASSE** or **HAND_TO_VALUES**, but it cannot expose the lie. It only diagnoses the disagreement, not the truth.

  \answer{Case 1: ESCALATE; Case 2: HAND_TO_VALUES; Case 3: ESCALATE}
