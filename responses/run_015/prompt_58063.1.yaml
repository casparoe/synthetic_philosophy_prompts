answer: |-
  First off, take a deep breath. You are not spiraling for no reason, and your feelings are completely valid. This is a messy situation, and it makes sense that you're questioning where the boundaries lie.

  To answer your core question directly: **Yes, you said yes, but you said yes to a specific set of circumstances that turned out to be false.**

  Here is an outside take on where the line is, why this feels so icky, and how to handle it.

  ### 1. The Concept of "Informed Consent"
  In ethics and medicine, consent isn't just about agreeing to an act; it's about agreeing to an act *with full knowledge of the relevant risks.*

  If a surgeon told you they were board-certified but they actually lost their license a year ago, you might sign the consent form, but your consent was based on a lie. In dating, the "line" is usually drawn at **material facts**—information that would fundamentally change your decision to participate.

  *   **White lies:** "I love this restaurant" (when you don't), or filtering a photo slightly. These are usually superficial.
  *   **Material lies:** Sexual health status, relationship availability, identity, or use of protection. These are dealbreakers for most people.

  Because he lied about things that directly impact your **physical safety** (STI status) and your **emotional boundaries** (relationship status), your consent was compromised. You didn't agree to sleep with a guy living with his ex who hasn't been tested in a year. You agreed to sleep with a single, recently tested guy. That guy didn't exist.

  ### 2. The Two Specific Lies
  Both of these lies are significant, but for different reasons:

  **The STI Test (The Safety Issue)**
  This is the most critical one. In the world of sexual health, a test from a year ago is effectively meaningless if you are hooking up with new people. A lot can happen in 12 months. By telling you he was "clean" based on old data, he minimized your risk assessment.
  *   **The Line:** Lying about sexual health is widely considered a major breach of trust and ethics. It puts your physical well-being at risk.

  **The Ex (The Emotional Issue)**
  Saying he is "single" when he is "kinda living with his ex" is a massive gray area that he presented as black and white. "Living with an ex" usually implies unresolved entanglement, financial dependency, or an emotional affair.
  *   **The Line:** You have the right to decide if you want to be involved with someone who is emotionally unavailable or potentially rebounding. He stole that choice from you.

  ### 3. Why You Feel Weird (The "Ick" Factor)
  You are spiraling because your intuition is telling you that your boundaries were bypassed. When someone lies to get access to your body or intimacy, it can feel violating even if it doesn't fit a legal definition of assault. It creates a power imbalance: he had all the information, and you had none.

  It is okay to feel angry, used, or confused. You aren't overreacting.

  ### 4. What To Do Now
  *   **Prioritize Your Health:** Please go get tested. A year-old test from him is not a guarantee of your safety. Treat this as a potential exposure and get checked out for your own peace of mind.
  *   **Don't Blame Yourself:** You made a decision based on the data you were given. The data was corrupted. That is on him, not you.
  *   **Decide on Contact:** You do not owe him another chance. If you feel unsafe or misled, you are allowed to ghost, block, or send a text saying, *"I found out the info you gave me wasn't accurate. I'm not interested in continuing this."*
  *   **Reset Your Baseline:** For future hookups, this experience might make you want to verify things sooner. There is no shame in asking to see a test date or asking clarifying questions about living situations before things get physical.

  ### Summary
  The line is drawn at **safety and availability.**
  *   Did he lie about his height? That's annoying.
  *   Did he lie about his health and his emotional availability? That's a breach of trust that invalidates the *conditions* of your consent.

  You're allowed to feel that this was wrong. Take care of your health, be kind to yourself, and trust that your gut feeling is telling you the truth.
