      *   **Topic Idea:** Analyzing the film *Arrival* (and Ted Chiang's "Story of Your Life") through the lens of UDT.
      *   **Specific Concerns:**
          *   Is Louise's situation actually UDT-relevant (uncertainty vs. foreknowledge)?
          *   The "Pre-viewed Choice" thought experiment (Oracle showing future recordings).
