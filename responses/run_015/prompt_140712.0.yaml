      *Refining the "Pre-viewed Choice":* This is essentially *Newcomb's Problem* where the box is transparent but the predictor is perfect. CDT two-boxes (can't change past prediction). UDT one-boxes (your decision type is what was predicted). Louise is the predictor and the decider.

