answer: |-
  First off, no worries about the typos — I've written plenty of essays in a rush between lectures myself, and "termm" feels appropriately expressive of how dragging this debate can get. You're absolutely right to feel stuck; the qualia debate is arguably the graveyard of philosophy of mind, where good intuitions go to fight forever.

  Let's have a proper look at your "Reverse Mary" twist, because it's a clever variation, though I suspect it might not break the deadlock in the way you hope. Then we can dig into why the group is circling the drain, because your suspicion about semantics vs. ontology is spot on.

  ### The Reverse Mary Problem
  Your Reverse Mary knows the physics of colour but lacks other senses, then gains smell. She can't compare smell to sight because there's no cross-modal framework.

  Here's the rub: **This probably shows modality-locking, not incoherence.**
  For the qualia realist, the fact that she can't compare olfactory qualia to visual qualia doesn't make the qualia themselves unreal; it just highlights that phenomenal space isn't a single unified canvas. It's like asking a blind person if red is "like" pain. The inability to calibrate across modalities doesn't prove the properties don't exist; it just proves they're private and structurally isolated.

  However, **Dennett would pounce on the verification gap.** He'd argue that if she has no way to verify her reports—not even against her own past states reliably (thanks to Chase & Sanborn)—then positing a "property" there is doing no work. For Dennett, a property needs to make a difference to the system's functional organisation. If her confusion about whether smell is "like" sight has no behavioural output other than "I'm confused," then the qualia are epiphenomenal ghosts.

  So, Reverse Mary doesn't necessarily prove incoherence; it just reinforces the **Private Language Argument**. If she can't establish rules for her own experience that hold over time or across senses, Wittgenstein (and Dennett) would say she's not referring to anything at all. But the realist will just dig in and say, "She feels it, therefore it's real," which brings us to your main question.

  ### Semantics vs. Ontology: The Real Blocker
  You asked if the two sides are answering different questions. **Yes, absolutely.** This is the core reason you're going in circles.

  1.  **The Realists (Ontology):** They are arguing from the *phenomenological stance*. Their starting point is "experience exists." To deny qualia is to deny the very data that needs explaining. For them, "property" means "something that exists for the subject."
  2.  **Dennett & Co. (Semantics/Function):** They are arguing from the *heterophenomenological stance*. They treat subjects as text-generating machines. Their starting point is "what can be objectively verified?" For them, "property" means "a state that plays a causal role and can be discriminated."

  When the realist says, "But it *feels* like something," they are making an ontological claim. When Dennett says, "You can't define what 'feels like' means without contradiction," he is making a semantic claim. They aren't disagreeing on the facts; they are disagreeing on the **criteria for existence**.

  ### The Hidden Empirical Assumption
  You also asked about a hidden assumption regarding what counts as a "property." This is crucial.
  *   **The Realist Assumption:** First-person accessibility is sufficient for something to be a property. (If I can feel it, it's real.)
  *   **The Dennett/Physicalist Assumption:** Third-person verifiability (or functional role) is necessary for something to be a property. (If science can't find it, it's not a property.)

  Neither side can defend this assumption without begging the question. The realist can't prove first-person access implies ontology without assuming dualism (or property dualism). Dennett can't prove third-person verifiability is the *only* mark of the real without assuming physicalism is complete. It's a clash of bedrock intuitions.

  ### What Would Count as Progress?
  Honestly? A formal model of phenomenal comparison is unlikely to work because the problem isn't mathematical; it's conceptual. Here's what might actually move the needle in your group:

  1.  **Adopt "Illusionism":** Look up Keith Frankish. He takes Dennett's view and sharpens it. He argues qualia are *user-illusions*. This clarifies the ontology: qualia don't exist as properties, but the *belief* that they exist is a real physical state in the brain. This stops the argument about whether they are "incoherent properties" and reframes them as "non-existent properties we think we have."
  2.  **Sharpen the Epistemic/Ontological Distinction:** Force the group to agree on this: "We can agree that epistemic privacy (I know my pain best) doesn't automatically grant ontological privacy (my pain is a non-physical object)." If you can separate *how we know* from *what exists*, you might dissolve the Chase & Sanborn confusion.
  3.  **Accept Bedrock Intuition (with caution):** Sometimes you have to acknowledge that physicalism and phenomenology are currently incommensurable. This is the "New Mysterian" route. It's not giving up; it's recognising that our cognitive tools might not be built to solve this specific puzzle, much like a dog trying to do calculus.

  ### My Verdict
  Your group is stuck because you're trying to solve an ontological problem (do qualia exist?) with epistemic tools (can we describe/compare them?). Dennett wins on semantics (qualia are poorly defined), but Realists win on intuition (denying experience feels absurd).

  If I were you, I'd pivot the discussion to **Illusionism**. It's the modern evolution of Dennett's view and forces everyone to confront the idea that the "hard problem" might be a cognitive trick rather than a metaphysical mystery. It usually either clicks or causes a proper row, both of which are better than circling the same drain for another term.

  Good luck with the rest of the term — and do get some rest before the next seminar!
