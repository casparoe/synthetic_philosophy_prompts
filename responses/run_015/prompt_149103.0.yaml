prompt: |-
  I've been in this philosophy of mind reading group for a termm now and we're stuck on the qualia thing — specifically whether Dennett's idea of "quining" actually proves they're incoherent or just shows they're hard to talk about. One side, roughly following Chase and Sanborn (though we read them ages ago and I might be misremembering thier exact move), says it's an epistemic failure: we can't fully describe phenomenal taste, but that doesn't make the concept contradictory, it's just private like a secret code only your brain can run. The other side says no, if there's genuinely no fact of the matter about whether you're experiencing an inverted spectrum, then qualia aren't a real property — they're a theoretical ghost that survives only because we keep giving it a free pass. We've been going in circles for weeks because every time someone brings up Mary the scientist, someone else says Mary is about knowledge, not ontology, and then we argue about whether knowledge-arguments even apply to concepts that might be incoherent in the first place.

  So here's my new twist to test the stall: imagine a "reverse Mary" who grows up knowing every physical fact about colour vision but lacks all other senses, then suddenly gains smell and has to learn whether her new olfactory qualia are "like" her old visual ones — except she has no cross-modal framework to compare them, only private reports she can't verify. Would her confusion show that qualia are genuinely incoherent because they can't be intersubjectively calibrated, or just that they're modality-locked and therefore harmless? Given the debate seems stuck — is this because the two sides are answering different questions (one about semantics, one about ontology), or is there a hidden empirical assumption about what counts as a "property" that neither side can defend? And honestly, what would actually count as progress here — a formal model of phenomenal comparison, a sharp distinction between epistemic privacy and logical incoherence, or should we accept it's bedrock intuition and move on? Please answer in British English, and feel free to be casual — I wrote this quickly between lectures and probably left a typo or two in there.
