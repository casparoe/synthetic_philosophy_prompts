      *(Refining the Ender section)*: The key insight is that Dennett praises Popperian creatures because they are *safer*. Card shows they are only safer if the *environment* is honest. The IF Command manipulated the environment. This makes Ender a victim of the taxonomy's assumption of truth.

      *(Refining the Fit section)*: Card cares about the *soul*. Dennett cares about the *mechanism*. The friction is where the essay lives.

