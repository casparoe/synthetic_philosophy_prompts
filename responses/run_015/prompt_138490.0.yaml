  ### Marginal Comments

  **> "Start with lying. Marlowe can't lie, because lying needs beliefs and Marlowe doesn't have any..."**
  **[Correct.]** You correctly identify that Framing A is belief-dependent. Since Marlowe lacks doxastic states, A cannot classify its output as lying. This is the standard "no belief, no lie" objection.

  **> "...So on A the avowals are not lies; they aren't really assertions at all, more like a stylistic tic."**
  **[Shaky.]** Calling them "not really assertions" is a quick way out. A might say they are *assertions* (speech acts) but simply not *lies*. Whether they count as assertions under A depends on whether A requires belief for assertion or just for *lying*. You're blurring the norm of assertion with the definition of lying here. Minor slip, but worth noting.

  **> "On the reassurance floor, A gives a less comfortable result but I think the answer is still no... every sentence it does assert is one it assigns more than half probability to, so there is no false assertion anywhere in the transcript."**
  **[Load-bearing Error.]** You are evaluating A (Belief-first) using truth-conditions ("no false assertion"). A cares about the *belief* of the speaker, not the truth of the proposition. Since Marlowe has no beliefs, A says "no lie" not because the sentences are true, but because there is no belief to contradict. You got the right result (A exonerates Marlowe) but for the wrong reason. You treated A like a truth-telling norm rather than a sincerity norm.

  **> "Patients ending up overconfident is a side effect the vendor was trying to head off."**
  **[Shaky.]** The prompt says post-deployment data *show* the overconfidence. If the vendor keeps the feature active *knowing* this result to ensure adherence, A (which includes intent to cause false belief in deception) might actually condemn this as deceptive, even if the primary aim is adherence. You're assuming "aim" excludes "foreseen side effects." In moral philosophy (and Framing A), knowingly causing false belief for utility often counts as intentional deception. This is a significant philosophical slip.

  **> "B is where things turn... Marlowe leaves patients with a credence that its own evidence doesn't support... B flags it immediately."**
  **[Correct.]** This is the strongest part of the application. You correctly see that B bypasses the belief requirement and targets the *epistemic gap* between evidence and hearer credence. This captures the Reassurance Floor harm perfectly.

  **> "(Missed Application of B to Feature 1)"**
  **[Omission.]** The question asked for A, B, and C on (1) *and* (2). You skipped B on the Avowal Gap. Under B, the avowals ("I believe") are likely deceptive because they imply an internal evidence-tracking state that doesn't exist, inflating patient credence in the system's reflexivity. You lost points here for incomplete coverage.

  **> "B overshoots, though. If honesty is just matching conveyed credence to evidence, then ordinary simplification counts as deception..."**
  **[Right for Wrong Reason.]** You are worried B forbids pragmatics. But B forbids credence *unsupported by evidence*. If simplification is standard medical practice (evidence supports the heuristic), B doesn't flag it. You're treating "evidence" as "raw data" rather than "justified warrant." However, your intuition that B needs a "calibration" fix is philosophically productive.

  **> "So B needs to be tightened, and the way to tighten it is to say that honesty for a system like this just is calibration..."**
  **[Strong.]** This is a good defense. Moving from a transactional definition (this utterance) to a systemic one (long-run calibration) solves the pragmatics problem. This saves your defense score.

  **> "C is the least useful of the three. If the system isn't tracking the truth at all then it isn't trying to mislead anyone either, and deception has to be intentional to be deception."**
  **[Load-bearing Error / Misreading.]** You have fundamentally misread Framing C. The prompt defines C as: "the trouble... is not that they aim at false belief but that their utterances are produced with no regard for whether they are true." C *explicitly rejects* the requirement for intent. You are judging C by A's standards ("deception has to be intentional").
  Under C, Feature 1 (Avowal Gap) is the *primary* violation: the system generates "I believe" with *indifference* to whether it believes. You dismissed the framework that was specifically designed to catch the exact problem you identified in Feature 1. This is a major comprehension failure.

  **> "What I'd measure: log the confidence score behind each avowal, compare it against ground truth... calibration curves and a Brier score..."**
  **[Partial Credit.]** Technically sound metrics for system calibration. However, you defended a version of B (Informational), which concerns the *hearer's credence* vs. *speaker's evidence*. Your measurement only tracks *system probability* vs. *ground truth*.
  You are measuring *truthfulness*, not the *epistemic harm* identified in the Reassurance Floor (patient overconfidence). To measure honesty under your own defended view, you need to measure the *patient's* reported confidence, not just the bot's Brier score. If the bot is calibrated but the flat voice makes patients 99% sure, your metric passes a dishonest system.

  ***

  ### TA Summary Note
  You have a strong grasp of the technical solution (calibration) and correctly identified that Framing B is the only one that catches the Reassurance Floor harm. However, your philosophical reading of the provided frameworks is loose. You treated Framing A as truth-based (it's sincerity-based) and Framing C as intent-based (it's explicitly indifference-based). This led you to dismiss C, which was actually the best fit for the Avowal Gap.

  Your measurement proposal tests the *system's* accuracy, but the seminar question is about the *patient's* epistemic state. If you defend B, you must measure the gap between system evidence and patient belief, not just system evidence and world facts.

  **Key takeaway:** Don't import intent requirements into frameworks that explicitly reject them. Check that your measurement proposal actually tests the definition of honesty you just defended.
