  ## What Will Go Wrong (And Fixes)

  1.  **The Spoiler:** An engineer says "This is Jeffrey Conditionalization" in minute 5.
      *   **Fix:** Enforce the "No Formulas" rule as a game constraint, not a learning constraint. "If you use the formula, you're playing on Hard Mode: you must use the Heuristic." This makes them complicit in the experiment.
  2.  **The Brier Confusion:** People won't understand the scoring quickly.
      *   **Fix:** Pre-calculate the scores for Round 1 & 2 for them if needed, or just use "Absolute Error" $|Truth - Guess|$ if squares are too hard to do on a napkin. Absolute Error preserves the ranking order mostly and is easier to calculate mentally. *Recommendation: Use Absolute Error for lunch.*
  3.  **Round 4 Confusion:** They won't catch the correlation between "80%" and "Bag A".
      *   **Fix:** Be explicit about the rule in the setup for Round 4. "In this round, Bad Air (Bag A) forces me to be unsure. Good Air (Bag B) lets me be sure." If they still miss it, ask: "Did my uncertainty tell you anything about the bag?"

  ## The Honesty Check: What the Game Can't Do

  A game cannot prove *why* Jeffrey Conditionalization is the normative rule for "well-behaved" uncertainty. It can only show that it works better than the heuristic in simulation. It cannot explain the **Dutch Book argument** (that violating Jeffrey's rule makes you susceptible to a guaranteed loss in betting) or the **sufficiency of statistics** behind it.

  **The One-Sentence Explanation:**
  "Jeffrey's rule is the only way to update your beliefs that respects your current uncertainty without pretending you know more than you do, *provided* the reason for your uncertainty isn't itself a clue about the truth."

  ## Why Brier vs. Absolute Error
  I recommended **Absolute Error** ($|P - Truth|$) in the "What Will Go Wrong" section despite the prompt mentioning Brier.
  *   **Why:** Brier ($ (P-Truth)^2 $) is theoretically superior for proper scoring, but at a lunch table with sandwiches, asking 12 people to square decimals is friction. It distracts from the probability intuition.
  *   **Compromise:** Use Absolute Error for the game flow. In the debrief, mention "Brier Score is the pro version of this, it punishes overconfidence harder, which is why the 16-point gap matters even more there." This keeps the lunch flowing but validates their quant instincts.

  ## Final Prep Checklist
  1.  **Bags:** Label them clearly. Put 9R/1B in A, 1R/9B in B.
  2.  **Sunglasses:** Have them ready for Round 4.
  3.  **Print:** 12 Scorecards.
  4.  **Practice:** Run the Round 3 math yourself once more to ensure you don't stumble on the 0.74 vs 0.90 explanation.
