  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher of science (metaphysics, evolutionary explanation, philosophy of mind).
      *   **Task:** Systematically work through the debate between "greedy reductionism" in cognitive science vs. "skyhook" accusations by critics, specifically regarding moral reasoning/normative capacity.
      *   **Output Structure:**
          1.  Brief brainstorming on what a legitimate "crane" (Dennett's term) must deliver.
          2.  Full desiderata list (phenomena, distinctions, constraints, puzzles).
          3.  Specific addressing of five key points (Scaffolding Paradox, Reflexive Cranes, Ontological vs. Explanatory, Cross-cultural Disagreement, Empirical Equivalence).
          4.  Classification of each desideratum (Non-negotiable/Negotiable).
          5.  Identification of jointly unsatisfiable clusters.
          6.  Identification of the single most exclusionary requirement.
          7.  Brief evaluation of standard accounts (Evolutionary Game Theory, Dual-Process, Normativist-Emergence) against the list.
      *   **Constraints:** No bibliographies, reading lists, or citations. Reason from concepts. Deep philosophical rigor.

  2.  **Brainstorming: The Core Problem (Cranes vs. Skyhooks):**
      *   *Context:* Daniel Dennett's distinction. Skyhooks are miraculous lifters (unexplained explainers). Cranes are built from the ground up.
      *   *The Challenge:* Moral normativity feels "categorical" (binding regardless of desire). Evolutionary/cognitive mechanisms are "hypothetical" (instrumental, fitness-based).
      *   *Goal:* A theory must show how *normative force* emerges from *descriptive mechanisms* without saying normativity is an illusion (eliminativism/greedy reductionism) and without saying normativity was always already there (platonism/skyhook).
      *   *Key Tension:* If the mechanism is purely descriptive, where does the "ought" come from? If the mechanism presupposes an "ought," it's circular.
      *   *Requirement:* The theory needs to explain the *phenomenology* of normativity (it feels binding) and the *function* of normativity (it coordinates behavior) without collapsing the former into the latter or invoking a metaphysical ghost.

  3.  **Developing the Desiderata (The "Must-Haves"):**

      *   *Scaffolding Paradox:* To learn norms, you need to recognize them. But recognition implies having norms. *Solution:* Iterative bootstrapping. Not circular, but螺旋 (spiral).
      *   *Reflexive Cranes:* Using high-level capacities to explain low-level origins. *Verdict:* Tolerate as feedback loops, forbid as foundational explanations.
      *   *Ontological vs. Explanatory:* Reduction says $A$ is nothing but $B$. Delegation says $A$ is realized by $B$ but does work $B$ cannot be described as doing. *Crucial distinction.*
      *   *Disagreement/Error:* If norms are just fitness, disagreement is just difference. If norms are real, error is possible. Need a middle ground: *Functional success criteria* internal to the practice.
      *   *Empirical Equivalence:* Must fit the data, but shouldn't be constrained by *current* limited models (e.g., strict adaptationism).

  4.  **Drafting the Content - Section by Section:**

      *   **Brainstorming:** Keep it tight. Focus on the "emergence of authority." How does a signal become a command?
      *   **Desiderata 1: The Scaffolding Paradox.**
          *   *Issue:* Mechanism $M$ produces Norm $N$. But $M$ only works if agents treat $N$ as binding.
          *   *Requirement:* Show a pre-normative precursor (proto-normativity) that lacks full authority but allows the structure to build.
          *   *Status:* Non-negotiable. Without this, it's circular.
      *   **Desiderata 2: Reflexive Cranes.**
          *   *Issue:* Using moral reasoning to explain the evolution of moral reasoning.
          *   *Requirement:* Distinguish *etiology* (origin) from *maintenance* (current function). Reflexivity is okay for maintenance, not origin.
          *   *Status:* Non-negotiable distinction, negotiable on strict forbiddance (feedback is real).
      *   **Desiderata 3: Ontological Reduction vs. Explanatory Delegation.**
          *   *Issue:* Greedy reductionism says "morality is just fitness."
          *   *Requirement:* Preserve the causal efficacy of the normative level. Norms must *do* something that neurons alone aren't described as doing.
          *   *Status:* Non-negotiable. This defines the project.
      *   **Desiderata 4: Cross-cultural Disagreement & Error.**
          *   *Issue:* Relativism vs. Realism.
          *   *Requirement:* A standard of "better/worse" internal to the system (e.g., coordination stability, flourishing) without appealing to God/Plato.
          *   *Status:* Non-negotiable. Otherwise, it's not *moral* reasoning, just preference.
      *   **Desiderata 5: Empirical Equivalence.**
          *   *Issue:* Must it match EvPsych exactly?
          *   *Requirement:* Must be consistent with data, but not bound by specific theoretical interpretations (like strict adaptationism).
          *   *Status:* Negotiable (theories change).

  5.  **Identifying Tensions and The "Killer" Constraint:**
      *   *Tension:* Desideratum 3 (Norms must be real/efficacious) vs. Desideratum 5 (Strict physicalist closure). If physics is causally closed, how do norms do work?
      *   *Resolution:* Non-reductive physicalism. Norms are higher-order patterns.
      *   *The "Killer":* Desideratum 3 (Ontological/Explanatory distinction). Most failures happen here. Either they reduce norms to impulses (greedy) or treat norms as magic (skyhook). Holding the line here is the hardest part.
      *   *Unsatisfiable Cluster:* Strict Causal Closure of Physics + Robust Normative Realism + Explanatory Autonomy. You have to give on one. Usually, we give on "Robust Realism" (in the Platonic sense) to save the others.

  6.  **Evaluating Standard Accounts:**
      *   *Evolutionary Game Theory:* Good on coordination, bad on phenomenology of "ought." Risks greedy reduction.
      *   *Dual-Process:* Good on mechanism, bad on normativity. Explains *how* we judge, not *why* it binds.
      *   *Normativist-Emergence:* Good on bindingness, risks skyhooks if not careful about the "emergence" mechanism.

  7.  **Refining the Tone:**
      *   Needs to be authoritative, precise, and philosophical. Use terms like "causal efficacy," "phenomenological authority," "bootstrapping."
      *   Avoid preaching. Present the analysis as a structural evaluation.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific prompt about "Reflexive Cranes"? *Yes, need to clarify if they are forbidden.* (Decision: Forbidden as *origins*, allowed as *sustainers*).
      *   *Check:* Did I avoid citations? *Yes.*
      *   *Check:* Is the distinction between ontological reduction and explanatory delegation clear? *This is the crux. Need to emphasize that $A$ can be made of $B$ without $A$-talk being replaceable by $B$-talk.*
      *   *Check:* Is the "Scaffolding Paradox" addressed? *Yes, via proto-normative precursors.*

  9.  **Final Polish:** Ensure the "Non-negotiable/Negotiable" tags are clear. Make sure the "Unsatisfiable Cluster" is explicitly identified. (The cluster is usually: Physical Closure + Normative Realism + Explanatory Autonomy).

  *(Self-Correction on the "Unsatisfiable Cluster"):* Actually, the prompt asks to flag if *my* desiderata contain an unsatisfiable cluster. I need to check if demanding "Real Normativity" + "Physicalist Mechanism" + "No Skyhooks" is coherent. It *is* the hard problem. I should flag that "Robust Normative Realism" might need to be downgraded to "Functional Normativity" to make it satisfiable. I will mark the tension there.

  10. **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  ### Brainstorming: The Architecture of a Legitimate Crane

  To construct a "crane" for normative capacity—one that lifts moral cognition from the bedrock of biology without invoking a "skyhook" (a miraculous, unexplained levitator) or engaging in "greedy reductionism" (denying the reality of the lifted structure)—the theory must navigate a specific metaphysical channel. It cannot simply identify moral properties with neural states (that eliminates the normative). It cannot posit that moral properties exist independently of neural states (that invokes a skyhook).

  Therefore, a legitimate crane must deliver **emergent authority**. It must show how a system of descriptive interactions (signaling, coordination, punishment) acquires a deontic texture (obligation, permission, prohibition) for the agents within the system. The theory must explain the *phenomenology* of the "ought" (it feels binding) as a functional consequence of the *mechanics* of the "is" (it stabilizes cooperation), without claiming the "ought" is an illusion. The core deliverable is an account of **bootstrapped normativity**: a process where proto-normative constraints evolve into full-blooded normative reasons through recursive social feedback, such that the end state is causally efficacious in a way the precursor states were not.

  ***

  ### Desiderata for an Adequate Crane-Based Account

  Below are the conditions of adequacy for a theory of normative emergence. Each includes the motivating consideration, the specific requirement, and a classification of its negotiability.

  #### 1. The Scaffolding Paradox
  *   **Motivating Case:** Many mechanisms proposed to explain the origin of norms (e.g., recursive mind-reading, reputation tracking) seem to require agents who already understand normative expectations. To track a reputation, one must understand that one *ought* to maintain it. If the mechanism presupposes the capacity it explains, the explanation is circular.
  *   **Requirement:** The theory must identify **proto-normative precursors**. These are behavioral regularities or affective responses (e.g., expectation violation, retaliatory anger) that function *like* norms without requiring the agent to possess the concept of a norm. The transition from precursor to full norm must be modeled as a gradual shift in cognitive processing, not a sudden acquisition of a new faculty.
  *   **Status:** **Non-negotiable.** Without resolving this circularity, the account is not an explanation of origins but a restatement of the phenomenon.

  #### 2. Reflexive Cranes
  *   **Motivating Case:** A "reflexive crane" occurs when a high-level capacity (e.g., moral reasoning) is used to explain the stability or selection of the very mechanisms that produced it (e.g., "we evolved reasoning because it helps us find the Truth"). This risks smuggling the end result back into the beginning.
  *   **Requirement:** The theory must distinguish between **etiological explanation** (how the capacity arose) and **maintenance explanation** (how the capacity is sustained). Reflexivity is forbidden in etiology (the cause cannot depend on the effect) but is mandatory in maintenance (normative reasoning stabilizes the norms that shape reasoning). The theory must not conflate the two.
  *   **Status:** **Non-negotiable distinction; Negotiable application.** Strict forbiddance of reflexivity in *maintenance* would ignore feedback loops essential to cultural evolution. However, reflexivity in *origins* is fatal.

  #### 3. Ontological Reduction vs. Explanatory Delegation
  *   **Motivating Case:** Greedy reductionism collapses the distinction between what something *is* (ontology) and how we *explain* it (explanation). It claims that because moral judgments are realized by neural firing, moral vocabulary is dispensable. This ignores the causal efficacy of higher-order patterns.
  *   **Requirement:** The account must preserve **explanatory autonomy**. It must demonstrate that normative descriptions capture causal patterns (e.g., social coordination, conflict resolution) that are invisible or intractable at the neuronal level, even if the normative properties are ontologically dependent on the physical substrate. The "ought" must be real as a functional constraint, even if it is not a separate substance.
  *   **Status:** **Non-negotiable.** This is the defining boundary between a crane and a bulldozer (greedy reductionism).

  #### 4. Cross-Cultural Disagreement and Local Error Correction
  *   **Motivating Case:** If norms are merely adaptive preferences, moral disagreement is just a clash of tastes, and "error" is impossible (one cannot be wrong about a taste). If norms are skyhooks, disagreement implies one party is out of touch with the Platonic form. A crane account needs a middle path.
  *   **Requirement:** The theory must provide **immanent criteria of success**. Normative revision must be explainable as optimization for internal system goals (e.g., stability, inclusivity, reduced conflict costs) rather than alignment with a transcendent standard. "Error" is defined functionally (e.g., a norm that undermines the cooperative framework it relies on), not metaphysically.
  *   **Status:** **Non-negotiable.** Without this, the theory cannot account for the *rationality* of moral debate, reducing it to power struggles or brute causation.

  #### 5. Empirical Equivalence with Standard Evolutionary Psychology
  *   **Motivating Case:** Critics often demand that new philosophical accounts respect existing evolutionary models. Proponents argue that standard models are often just-so stories that a deeper metaphysical account might overturn.
  *   **Requirement:** The theory must be **consistent with hard data** (neurobiology, genetics, archeology) but need not be equivalent to **theoretical interpretations** (e.g., strict adaptationism). It must not contradict established physical constraints, but it can challenge the sufficiency of current evolutionary narratives.
  *   **Status:** **Negotiable.** Consistency with data is required; consistency with current theoretical hegemony is not. Demanding equivalence with specific EvPsych models would stifle the crane-building project by binding it to potentially flawed interim science.

  ***

  ### Analysis of Tensions and Constraints

  #### Jointly Unsatisfiable Clusters
  There is a significant tension between **Desideratum 3 (Explanatory Autonomy/Real Normativity)** and a strict interpretation of **Physical Causal Closure** (often assumed in the background of Desideratum 5).
  *   **The Cluster:** If one demands that normative properties have genuine causal power (they *make* things happen, not just describe them), and one demands that the physical domain is causally closed (every physical event has a sufficient physical cause), and one demands that normative properties are not identical to physical properties (non-reductionism), one faces the problem of overdetermination or exclusion.
  *   **Resolution:** To make the list satisfiable, **Desideratum 3** must be interpreted carefully. Normative properties cannot be *additional* causes competing with physical causes. They must be **higher-order constraints** that organize physical causes without violating physical closure. If the user demands "Robust Realism" (norms exist independently of human practices), this cluster becomes unsatisfiable without a skyhook. The list requires "Functional Realism" (norms are real patterns within the system).

  #### The Single Most Exclusionary Requirement
  **Desideratum 3 (Ontological Reduction vs. Explanatory Delegation)** does the most work in excluding popular contenders.
  *   **Why:** Most cognitive science defaults to methodological reductionism, which easily slides into greedy reductionism. It is exceptionally difficult to articulate how a property can be ontologically dependent yet explanatorily irreducible without sounding dualistic. Most theories fail here: they either explain the mechanism and dismiss the normativity as a "user illusion" (failing the crane test by destroying the load), or they posit the normativity and leave the mechanism vague (failing the crane test by using a skyhook). Holding this line excludes almost all standard neuro-reductive accounts and most Platonic realist accounts.

  ***

  ### Evaluation of Standard Accounts Against the Desiderata

  **1. Evolutionary Game-Theoretic Accounts**
  *   **Performance:** Strong on **Desideratum 1 (Scaffolding)** and **5 (Empirical Consistency)**. They model how cooperation emerges from self-interest without presupposing norms.
  *   **Failure:** They typically fail **Desideratum 3 (Explanatory Autonomy)** and **4 (Error Correction)**. They tend to reduce normativity to equilibrium stability. This is greedy reductionism: it explains the *behavior* but eliminates the *authority*. For a game theorist, a "wrong" move is just a sub-optimal payoff, not a moral error. They dissolve the phenomenon rather than explaining its emergence.

  **2. Dual-Process Models (Intuition vs. Reasoning)**
  *   **Performance:** Strong on **Desideratum 5 (Empirical Data)** and **1 (Scaffolding)** regarding cognitive architecture. They explain how fast, affective responses interact with slow, deliberative ones.
  *   **Failure:** They struggle with **Desideratum 4 (Error Correction)** and **3 (Autonomy)**. While they explain *how* we judge, they often lack a criterion for *which* process is normatively authoritative. If intuition and reasoning conflict, the model describes the conflict but cannot ground why one *ought* to win without smuggling in a normative premise. They risk being descriptive maps of a normative terrain they cannot justify.

  **3. Normativist-Emergence Views**
  *   **Performance:** Strong on **Desideratum 3 (Autonomy)** and **4 (Error Correction)**. They take the binding nature of norms seriously and allow for rational revision.
  *   **Failure:** They frequently stumble on **Desideratum 1 (Scaffolding)** and **2 (Reflexive Cranes)**. In trying to protect the reality of norms, they often posit emergence mechanisms that are too abrupt or rely on the very rational capacities they aim to explain. They risk becoming skyhook theories if they cannot specify the mechanical transition from non-normative to normative without presupposing rational agency.

  ### Conclusion on the Desiderata List
  The list itself reveals that the "unsatisfiable cluster" lies in the demand for **Robust Normative Realism** alongside **Strict Physicalism**. To make the crane work, one must accept that moral normativity is a **functional kind** rather than a **substantial kind**. If the user insists that moral truths must be true *independently* of human cognitive architecture (a common intuition), the desiderata become jointly unsatisfiable without a skyhook. However, if the user accepts that moral truth is truth *within* the space of reasons generated by that architecture, the list is coherent. The primary prejudice to discard is the intuition that "real" normativity requires "non-natural" properties. That intuition is the skyhook in disguise.
