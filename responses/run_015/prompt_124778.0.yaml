  without fixing a single **name**,
  refusing the comfort of a natural **kind**,
  acknowledging every porous **barrier**,
  and teaching the problem of **species**.

  We pin the **lineage** as if a distinct **kind**,
  label the **hybrid** past the reproductive **barrier**,
  and leave the drawer with every **name** for **species**.
