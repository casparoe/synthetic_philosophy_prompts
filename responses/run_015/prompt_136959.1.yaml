answer: |-
  Here is the apparatus for a ninety-minute session designed to fail productively. It is built to enforce Neurath's constraints through physical friction, not argument.

  ### Session Overview
  **Title:** The Unspoken Legend
  **Time:** 90 minutes (hard stop)
  **Participants:** ~20 (5 teams of 4)
  **Goal:** To demonstrate that visual clarity is a product of agreed convention and mechanical reproducibility, not resemblance or intuition.

  ### Materials (Per Team)
  *   1 sheet of A3 graph paper (grid must be visible).
  *   1 sheet of A4 with the Data Table (see below).
  *   1 sheet of A4 with the "Mission Card" (instructions).
  *   1 pack of sticky notes (for the Key/Legend).
  *   1 black pencil per person (no pens, no colours).
  *   5 small squares of coloured paper ("Trust Tokens").
  *   1 envelope (for the wager).

  ### The Data (The Trap)
  Do not use climate data; it is too familiar. Use **Epidemiological Allocation**.
  Provide a table with 5 Regions. Columns: **Reported Cases**, **Total Population**.

  | Region | Cases | Population |
  | :--- | :--- | :--- |
  | **North** | 500 | 10,000 |
  | **South** | 200 | 2,000 |
  | **East** | 800 | 40,000 |
  | **West** | 50 | 500 |
  | **Central** | 300 | 15,000 |

  **The Trap:** Raw intuition suggests "North" or "East" is the crisis (highest counts). The mathematical reality is "West" and "South" are the crises (highest rates: 10% and 10% vs 5%, 2%, 2%).
  **The Instruction:** "Visualize this data to support a decision on where to send emergency medical teams. You have resources for only one region."

  ### The Constraints (The Philosophy in Paper Form)
  1.  **No Words or Numerals on the Chart:** You may not write "North," "500," or "%". You may only use symbols.
  2.  **No Scaling by Size:** A symbol representing 100 units must be the *same size* as a symbol representing 1 unit. You must show quantity by *repetition*, not by making the icon bigger. (This enforces Neurath's "unit method" and bans area-based distortion).
  3.  **No Perspective:** Symbols must be flat, 2D silhouettes. (Bans "realism" which implies depth/ambiguity).
  4.  **The Key is Part of the Chart:** You must create a legend on a sticky note that defines your symbols. This note travels with the chart.

  ---

  ### Phase 1: Construction (25 Minutes)
  **00-05: Arrival & Grouping.**
  Get them into 5 teams of 4. Hand out materials immediately. Do not introduce yourself or the topic. Say: "You are a graphics desk. You have 25 minutes to produce a briefing panel for an editor. The rules are on the table."

  **05-30: The Draw.**
  They will struggle. The ban on scaling (Constraint 2) is the critical friction point. Drawing 500 individual icons is tedious. They will want to draw one big bar or one big man.
  *   *Intervention:* If you see a team drawing a bar chart or a scaled map, tap the paper and point to Constraint 2. "Count, don't measure."
  *   *The Critical Choice:* Watch if they visualize *Population*. Most will visualize only *Cases* because the Mission says "send teams" and their intuition says "most cases = most need." If they do not create a visual symbol for Population, they render the Rate incalculable.

  ### Phase 2: The Wager & The Swap (10 Minutes)
  **30-35: The Wager.**
  Tell teams: "You believe your chart is clear. You now stake your reputation."
  *   Each team has 5 Trust Tokens.
  *   They must place 0 to 5 tokens into an envelope.
  *   **Rule:** If the Reader solves the Mission correctly, tokens double. If the Reader fails, tokens are forfeited.
  *   **Psychology:** This punishes overconfidence. A team that knows their chart is ambiguous (e.g., they didn't draw population) should bet low. A team that standardized rigorously should bet high.

  **35-40: The Swap.**
  Collect the envelopes. Pass the Charts (and Keys) to the team on the right. The Creators sit back; they cannot speak. The Readers are now "Absent." They did not see the data table. They only have the Chart and the Key.

  ### Phase 3: The Transformation (20 Minutes)
  **40-60: The Reader's Task.**
  Hand the Readers a new slip: **"The Transformation."**
  *   *Instruction:* "The Editor has changed their mind. They do not want to know where the most *cases* are. They want to know where the *risk per person* is highest. Using *only* the chart and key provided, calculate the risk for each region and identify the top priority."
  *   *Requirement:* They must write down the calculation method they used based on the visual evidence.

  **Why this works:**
  *   **Scenario A (Failure):** The Chart shows only Cases (icons). The Reader cannot calculate risk. They must guess. They will likely guess "North" (most icons). This is wrong.
  *   **Scenario B (Success):** The Chart shows Cases (red icons) AND Population (blue icons). The Reader can count red/blue ratio. They can identify "West" (high ratio).
  *   **The Reveal:** Most teams will fail Scenario B because they assumed "Cases" was the only variable that mattered. They will realize the chart *omitted* the denominator not by accident, but because their visual language lacked the syntax to hold it.

  ### Phase 4: The Debrief (35 Minutes)
  **60-90: Mapping the Failure.**
  Do not lecture. Elicit the three claims from their frustration.

  **Claim 1: Pictures do not speak for themselves (Conventions).**
  *   *Ask the Readers:* "Raise your hand if you hesitated on what a single icon represented. Did anyone interpret a 'stack' of icons differently than the creator intended?"
  *   *Ask the Creators:* "Who wanted to write a number on the axis but couldn't?"
  *   *Your Line:* "You felt the need to label. That need is not a flaw in your drawing; it is a feature of communication. A pictogram is not a picture of a thing; it is a sign for a quantity. You had to invent a language, not a scene."

  **Claim 2: The test is Transformability.**
  *   *Ask:* "Who managed to answer the second question (Risk/Rate)? How?"
  *   *Likely Outcome:* Only teams that drew two distinct symbols (Cases + Pop) can answer. Teams that drew one symbol (just Cases) or used area (big bars) cannot.
  *   *Your Line:* "The chart that looks 'cleanest' (one bar per region) failed the transformation. The chart that looked 'busier' (many small icons) succeeded. Neurath argued that a picture's value isn't how pretty it is, but whether you can mechanically re-calculate it. If you can't turn the picture back into a number, it's an illustration, not evidence."

  **Claim 3: Words and Pictures are the same kind of problem.**
  *   *Ask:* "Did anyone use a symbol that looked like the thing (a syringe, a person)? Did that help or hinder?"
  *   *Observation:* Realistic drawings take longer to count. Abstract squares are faster.
  *   *Your Line:* "You thought words were ambiguous and pictures were clear. But you just spent 20 minutes negotiating what a 'man' symbol means. Clarity didn't come from resemblance; it came from the rule you wrote on the sticky note. The sticky note was the text. The picture was the text. They are the same system."

  **The Reveal (Data & Wagers):**
  *   Open the envelopes. Reveal the scores.
  *   Show the original Data Table. Reveal that "West" was the correct answer.
  *   Highlight the teams that bet high and lost. "You were confident in a visual intuition that was mathematically wrong."

  ---

  ### Troubleshooting: What Will Go Wrong

  **1. The "Artist" Problem:**
  *   *Risk:* A graphics editor draws a beautiful map or 3D isometric bars.
  *   *Fix:* Enforce Constraint 2 (No scaling) ruthlessly. If they draw a bar, tell them: "I cannot count this bar. I can only measure it. Measurement requires a ruler you haven't provided. Count or fail."
  *   *Why:* This forces the Isotype "unit" method.

  **2. The "Smuggled Label":**
  *   *Risk:* Someone writes "500" in tiny print.
  *   *Fix:* Collect charts for the swap. If you see numbers, disqualify that chart from the Wager (tokens lost automatically).
  *   *Why:* Proves that without the number, the visual must carry the load.

  **3. The "Guesser":**
  *   *Risk:* A Reader guesses "West" because they know the trick, not because the chart showed it.
  *   *Fix:* The Reader must show their working ("I counted 10 red for 1 blue"). If they cannot show the visual evidence, they count as a failure.
  *   *Why:* Validates that the *chart* did the work, not the reader's brain.

  **4. The "Trivial Transformation":**
  *   *Risk:* A team hoards the data table and slips it to the Reader.
  *   *Fix:* Collect all Data Tables before the Swap. Only Charts and Keys move.
  *   *Why:* Ensures the "Absent Reader" is truly absent from the source context.

  **5. The Cynical Conclusion:**
  *   *Risk:* Participants conclude "Pictures are useless, just use tables."
  *   *Fix:* In the debrief, point to the team that succeeded. "They used pictures. They were faster to grasp than a table for the *comparison* of ratios. The tool wasn't broken; the syntax was."

  ### Limitations: What This Exercise Cannot Stage
  You must explicitly state this at the very end (last 2 minutes).

  **The Missing Pedagogue:**
  Neurath did not believe these charts were "self-explanatory" in a vacuum. He believed they were tools for *education* within a specific social context (the Social and Economic Museum in Vienna). He expected a guide to be present, or for the viewer to have been trained in the method.
  *   *Your Line:* "This session felt hard because you were inventing a language from scratch in 20 minutes. Neurath's system worked because the public was *taught* the language over years. The chart is not the communication; the chart plus the trained viewer is the communication. We often blame the graphic for failing to be universal, when we should blame ourselves for not teaching the viewer how to read it."

  **The Social Goal:**
  Neurath's goal was not just accurate data, but *democratization* of data for the working class.
  *   *Your Line:* "We treated this as a puzzle for professionals. Neurath treated it as a right for citizens. The rigor wasn't for the journalist's sake; it was so the reader couldn't be lied to by a pretty drawing. That is the ethical core you take home."

  ### Neurath Accuracy Check
