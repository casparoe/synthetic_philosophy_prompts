answer: |-
  **EXAM QUESTION: SELF-REFERENCE AND AGENCY (90 MINUTES)**

  **Background Definitions**
  Let $T$ be a consistent, recursively axiomatizable theory extending Peano Arithmetic (PA). Let $\square \phi$ denote the standard provability predicate $\exists p \, \text{Proof}_T(p, \ulcorner \phi \urcorner)$.
  1.  **Diagonal Lemma:** For any formula $\psi(x)$, there exists a sentence $\lambda$ such that $T \vdash \lambda \leftrightarrow \psi(\ulcorner \lambda \urcorner)$.
  2.  **Löb's Theorem:** If $T \vdash \square \phi \to \phi$, then $T \vdash \phi$. Consequently, $T \nvdash \forall \phi (\square \phi \to \phi)$ (unless $T$ is inconsistent).

  **The Scenario**
  An autonomous agent $A$ operates within theory $T$. To avoid the Löbian obstacle, $A$ does not adopt full self-trust. Instead, consider two proposed modifications to $A$'s trust principles.

  **(a) Definable Trust Classes (5 marks)**
  Suppose $A$ restricts self-trust to a class of sentences $D$ definable in $T$ by a formula $Tr(x)$. Assume $D$ is closed under diagonalization (i.e., for any $\psi(x)$, the fixed point $\lambda \leftrightarrow \psi(\ulcorner \lambda \urcorner)$ satisfies $Tr(\ulcorner \lambda \urcorner)$). If $A$ adopts the axiom schema $\forall \phi (Tr(\ulcorner \phi \urcorner) \to \phi)$, show that $A$'s system becomes inconsistent.

  **(b) Budgeted Trust (5 marks)**
  Suppose instead $A$ adopts *budgeted trust*. For a concrete standard numeral $\bar{n}$, let $\text{Sound}_n \equiv \forall \phi (\text{Proof}_T(\ulcorner \phi \urcorner, \bar{n}) \to \phi)$, where $\text{Proof}_T(p, x)$ checks if $p$ is a valid $T$-proof of $x$ with length $\le x$ (encoded appropriately).
  Explain why Löb's Theorem does not immediately refute $\text{Sound}_n$. Argue whether $T \vdash \text{Sound}_n$ for a fixed standard $n$.

  **(c) The Tiling Cascade (5 marks)**
  Agent $A$ (operating with proof-search budget $L_A$) wishes to construct a successor agent $B$ (operating with trust budget $n_B$). To verify $B$, $A$ must prove $\text{Sound}_{n_B}$.
  Assuming the length of the shortest proof of $\text{Sound}_k$ in $T$ grows super-exponentially in $k$, derive the relationship between $A$'s capacity and $n_B$. Does this allow an infinite sequence of agents with constant trust budgets?

  **(d) Strength and Speed-up (5 marks)**
  Suppose $A$ operates in a stronger theory $T^+ = T + \text{Con}(T)$. $T^+$ cannot prove $\text{Sound}_k$ for larger $k$ than $T$ (since soundness is true in the standard model). However, $A$ might still prefer $T^+$. Explain what advantage $T^+$ provides in this specific budgeted context, referencing proof complexity.

  ***

  **MODEL ANSWER**

  **(a) Definable Trust Classes**
  If the agent adopts $\forall \phi (Tr(\ulcorner \phi \urcorner) \to \phi)$ as an axiom, we can invoke the Diagonal Lemma within the class $D$. Since $D$ is closed under diagonalization, there exists a sentence $\lambda \in D$ such that $T \vdash \lambda \leftrightarrow (Tr(\ulcorner \lambda \urcorner) \to \bot)$. Since $\lambda \in D$, the agent trusts it: $Tr(\ulcorner \lambda \urcorner)$ holds. By the trust axiom, $\lambda$ is true. Substituting $\lambda$'s definition, we get $Tr(\ulcorner \lambda \urcorner) \to \bot$. Since we have $Tr(\ulcorner \lambda \urcorner)$, we derive $\bot$. Thus, any definable trust class closed under diagonalization leads to inconsistency if adopted as a universal schema. This forces us to look at restrictions not closed under diagonalization, such as resource bounds.

  **(b) Budgeted Trust**
  Löb's Theorem requires the provability predicate to satisfy the Hilbert-Bernays derivability conditions, specifically that $T \vdash \phi \implies T \vdash \square \phi$. Budgeted trust restricts the "box" to proofs of length $\le n$. This restricted predicate does not satisfy necessitation for $T$ itself (a short proof of $\phi$ does not guarantee a short proof of $\square_{\le n} \phi$). Therefore, the Löb derivation breaks.
  Regarding provability: For any fixed standard $n$, there are only finitely many candidate proofs of length $\le n$. $T$ can verify each one. If a candidate is not a valid proof of $\phi$, the antecedent is false; if it is, $\phi$ is a theorem of $T$, and since $T$ is sound (assumed in the meta-theory), $\phi$ is true. $T$ can verify this finite check internally. Thus, $T \vdash \text{Sound}_n$ for every standard $n$.

  **(c) The Tiling Cascade**
  While $T \vdash \text{Sound}_n$, the *length* of this proof, denoted $|\pi_n|$, grows super-exponentially with $n$. Agent $A$ has a search budget $L_A$. To certify $B$, $A$ must produce a proof of $\text{Sound}_{n_B}$. This requires $|\pi_{n_B}| \le L_A$. Because $|\pi_k|$ grows so rapidly, $n_B$ must be significantly smaller than the inverse of the growth function applied to $L_A$. Even if $B$ is identical to $A$ in design, $A$ cannot certify a $B$ with the same budget $n_A = n_B$ because the proof of $B$'s safety is too long for $A$'s search limit. This creates a resource cascade: each generation must operate with a strictly smaller trust budget, terminating the lineage just as the consistency-strength cascade does.

  **(d) Strength and Speed-up**
  Although $T^+$ does not validate more soundness instances than $T$ (both are sound in the standard model), $T^+$ offers **proof speed-up**. By Gödel's speed-up theorems, there are sentences provable in $T$ that have vastly shorter proofs in $T^+$. $\text{Sound}_n$ is such a sentence. $T^+$ can prove $\text{Sound}_n$ with a proof length $|\pi^+_n| \ll |\pi_n|$. This allows $A$ (using $T^+$) to certify a successor $B$ with a larger trust budget $n_B$ than $A$ could if using $T$, given the same search limit $L_A$. It delays the resource cascade, allowing more generations or more capable successors, even if it does not logically escape the eventual descent.

  ***

