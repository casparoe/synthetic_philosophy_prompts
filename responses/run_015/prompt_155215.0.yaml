  **Subject:** 2023 Year-in-Review: Strengthening the Universal Negative

  **Headline Stat:** 1,402,095 Confirmed Non-Black Non-Ravens Logged

  **Dear Supporters,**

  Since 2021, the Non-Black Non-Raven Registry (NBNRR) has pursued a single, rigorous objective: to increase confidence in the hypothesis that all ravens are black. While traditional ornithology focuses on observing ravens directly, our methodology leverages the logical equivalence of contrapositives. The statement "all ravens are black" is logically identical to "all non-black things are non-ravens." Therefore, every beige toaster, every blue sedan, and every green apple logged on our platform removes a potential counterexample from the universe. We are not merely collecting images; we are narrowing the logical space where a non-black raven could hide.

  **How It Works**
  Volunteers use the NBNRR app to photograph objects that are definitively not black and definitively not ravens. Our proprietary Novelty Filter ensures data integrity by auto-rejecting submissions the user could have identified as non-black non-ravens prior to observation. An observation known in advance cannot update probability. Consequently, our community has become expert at locating high-entropy beige objects in unpredictable contexts.

  **Volunteer Spotlight**
  This year's top contributor, Sarah J. of Dayton, logged 4,000 entries, including the interior of a 1994 Corolla floor mat and a specific shade of lukewarm oatmeal. "People think you need to go outside," Sarah says. "But the inside of a fridge offers incredible logical density if you know where to look."

  Our Volunteer Coordinator, Mark Davos, praises this dedication. "We aren't just taking pictures of stuff," Davos explains. "We are systematically isolating non-blackness from raven-ness. When Sarah photographs a yellow sticky note, she is fortifying the logical structure of ornithology itself."

  **Advisory Notes**
  Our Statistics Advisor, Dr. Aris Thorne, notes the challenge of sampling bias. "Technically, to gain maximum confirmation, one should sample randomly from all objects in the universe," Thorne says. "If you go out specifically hunting for non-ravens, the evidentiary weight per observation is astronomically small, given the vast ratio of non-ravens to ravens. You are essentially filling a bucket with a teaspoon while standing in the ocean. However, the Board feels that active hunting yields higher volume."

  We also received feedback from Dr. Elena Corvidae, a field ornithologist unaffiliated with our project. "Have you considered," she asked gently during our Q3 review, "that looking at actual ravens might be more efficient?" The Board thanked her for her input but noted that observing black ravens only confirms the instance, whereas our method confirms the universal rule through structural elimination. To rely on raven sightings would be to ignore the contrapositive foundation.

  **What's Next**
  In 2024, we are tightening our Novelty Filter. Submissions involving ambiguous shadows or objects in low light are now being bounced. If a volunteer cannot confirm an object is not a raven, it cannot be logged as a non-black non-raven. We must maintain certainty in our negatives. While an ambiguous object in bad light might theoretically offer higher information gain regarding the hypothesis, our protocol requires verified non-raven status to ensure dataset purity. We aim to log 5 million non-black non-ravens by December. With every beige wall and red pencil, we bring you closer to the truth.

  Sincerely,

  **The Board of Directors**
  Non-Black Non-Raven Registry
