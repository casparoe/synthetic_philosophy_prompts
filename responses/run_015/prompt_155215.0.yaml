prompt: |-
  hey — can you write me a satirical year-in-review / impact report, about 600 words, for a made-up citizen-science nonprofit (call it something like the Non-Black Non-Raven Registry) whose volunteers photograph objects that are neither black nor ravens, in order to raise confidence in the hypothesis that all ravens are black. You know the thing I mean, the Hempel raven-paradox business.

  Make it deadpan. The directors should genuinely believe theyre doing rigorous ornithology and never notice that anything is off, and the reader should be able to tell whats being ironized without anyone winking. Format it like an emailed annual report: a headline stat, then a few short sections — how it works, a volunteer spotlight, a note from their statistics advisor, what's next.

  I want the jokes to come out of getting the confirmation theory right, not out of the founders being dum:

  - the equivalence condition, i.e. why a green apple is supposed to bear on a claim about ravens at all
  - the confirmation being real but astronomically tiny, roughly because there are so vastly many non-black non-ravens to get through compared to the handful of ravens
  - the sampling point: if you go out hunting for non-ravens on purpose, or only ever log objects you already knew were non-black non-ravens, the observation does no confirming work whatsoever — and of course that is exactly their protocol
  - their "novelty filter": the app auto-rejects anything the submitter already knew about, on the grounds that an observation you were certain of in advance can't move your probabilities, so volunteers compete to photograph ever more obscure beige things (a 1994 Corolla floor mat, the inside of a fridge) while the one kind of sighting that would actually move the numbers — an object in bad light that you genuinely can't tell is or isn't a raven — gets bounced by the loging rules

  Give me one quote from a volunteer coordinator, one from the statistician who has obviously tried to explain all this and been politely overruled, and one from an actual field ornithologist who keeps gently suggesting they just go look at some ravens. The directors' version of the argument should be the strongest honest version anyone could give, so the absuridity comes from the logic rather than from strawmanning. Nobody should name-drop Hempel or the paradox out loud, and no citations or footnotes with papers — the whole thing has to work for someone who has never heard of any of this.
