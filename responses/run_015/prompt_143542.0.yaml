  7.  **Final Polish:** Ensure the distinctions (undermining/rebutting, etc.) are explicitly woven into the desiderata descriptions. Ensure the ordering reflects "work-doing" (i.e., the core logical engine comes first).

      *Self-Correction on Ordering:* The Epistemic Principle is the engine. Granularity is the steering. Stability is the landing. I will order them: Epistemic Core -> Scope/Granularity -> Meta-Ethical Coherence -> Practical/Downstream -> Empirical/Modal.

      *Refining the "Incompatibility" section:* I need to be decisive. The user suspects they are unsatisfiable. I should confirm if they are *logically* unsatisfiable or just *dialectically* difficult. I will argue they create a "trilemma" rather than a strict contradiction, but for the purpose of a specification, one must be dropped or weakened. I will support the user's suspicion that Granularity + No-Presupposition is the tighter bind.

      *Refining the "Most Exclusionary":* I'll select the constraint regarding the *Epistemic Principle's Scope* (General enough to work, specific enough to not debunk math). This kills the most drafts.

      *Refining the Table:* Keep it tight. 3-4 lines per argument type.

