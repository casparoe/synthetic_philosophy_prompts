answer: |-
  ### Specification of Adequacy for Evolutionary Debunking Arguments

  The following desiderata define the conditions under which an evolutionary debunking argument (EDA) counts as adequate for the purposes of this dissertation. The primary aim is to determine whether such an argument can rationally compel a sophisticated non-naturalist realist to reduce confidence in specific first-order moral judgments. The list is ordered by logical priority; items appearing earlier are prerequisites for the coherence of items appearing later.

  **1. The Epistemic Principle Constraint (Non-Negotiable)**
  The argument must explicitly state the epistemic principle linking genealogical facts to justificatory defeat. It must clarify whether the principle is general (applying to all domains of belief) or domain-specific.
  *Case:* Explanatory Sufficiency. If the principle is "causal independence defeats justification," it must explain why this does not debunk mathematics or logic. If it is morality-specific, it must motivate why morality is special without begging the question against the realist.

  **2. The Granularity Requirement (Non-Negotiable)**
  The argument must provide a principled basis for distinguishing between debunked and non-debunked judgments. It cannot entail global skepticism about morality unless it also entails global skepticism about other normative domains (like prudence or logic) which the debunker wishes to retain.
  *Case:* Fission. The argument must explain why the divergent judgment (obligations to future people) is debunked while the convergent core is not, based on the genealogical explanation rather than independent moral intuition.

  **3. The Non-Circularity Constraint (Non-Negotiable)**
  The argument cannot presuppose the truth or falsity of the first-order moral judgments it aims to debunk in order to establish the debunking conclusion. It must not rely on the assumption that certain moral beliefs are false to prove they are unjustified.
  *Case:* Discrimination vs. Presupposition. To sort judgments (see #2), the argument cannot simply rely on the debunker's own moral convictions that the divergent judgments are wrong.

  **4. The Target Distinction (Non-Negotiable)**
  The argument must specify whether it aims to undermine truth, justification, or the rationality of continuing to hold a belief. It must distinguish between *undermining defeat* (attacking the basis of the belief) and *rebutting defeat* (providing evidence for the negation).
  *Case:* Origin vs. Warrant. The argument must show that explaining the *origin* of the capacity or judgment impacts the *warrant* for the token exercise, rather than merely describing its etiology.

  **5. The Modal Assumption Clarity (Non-Negotiable)**
  The argument must state its commitments regarding the modal status of moral facts (e.g., necessary existence, supervenience) and the possibility of causal contact. It must explain why the lack of causal contact (if asserted) is epistemically relevant given the realist's modal commitments.
  *Case:* Falsifiability. Against a realist who holds moral facts are known a priori or supervene necessarily, a premise requiring causal contact may be dialectically inert. The argument must address this.

  **6. The Plasticity Accommodation (Negotiable)**
  The argument must address whether explaining the evolution of a general *capacity* for normative plasticity debunks the specific *contents* internalized by that capacity. If it claims capacity-level explanation suffices for content-level debunking, it must provide a bridge principle.
  *Case:* Plasticity. If selection favored plasticity, the causal story explains the phenomenology of bindingness without predicting specific content. The argument must show why this still threatens justification.

  **7. The Self-Application Test (Non-Negotiable)**
  The argument must not debunk the normative claims made by the debunker in the course of arguing for debunking (e.g., claims about what we have reason to believe).
  *Case:* Reformer. If the argument concludes that no normative beliefs are justified, it must account for the status of the claim "we ought to reduce confidence in moral beliefs."

  **8. The Downstream Stability Condition (Negotiable)**
  The argument must account for the status of first-order moral discourse and practice after the debunking has been accepted. It must specify whether the recommended stance is abolitionism, fictionalism, conservationism, or error theory.
  *Case:* Reformer. The argument must explain why debunked judgments retain their practical grip and phenomenology, or why they should be discarded despite that grip.

  **9. The Empirical Fit Requirement (Non-Negotiable)**
  The genealogical premises must align with the best available evidence from evolutionary psychology and anthropology. The argument must specify what empirical findings would disconfirm it.
  *Case:* Falsifiability. For example, if the argument relies on the claim that selection favored selfishness, evidence of selection for strong reciprocity must be shown to be compatible with the debunking conclusion.

  **10. The Alternative Explanation Clause (Non-Negotiable)**
  The argument must demonstrate that there is no available "tracking" explanation consistent with the genealogy. It is not enough to show that evolution *could* have produced false beliefs; it must show that the actual evolutionary explanation does not involve tracking the truth.
  *Case:* Explanatory Sufficiency. A complete causal explanation does not suffice for defeat unless it excludes the possibility that the causes track the truth.

  **11. The Phenomenology Account (Negotiable)**
  The argument should offer an explanation for the objective phenomenology of moral judgment (why moral claims feel stance-independent) that is consistent with the debunking conclusion.
  *Case:* Reformer. If moral facts are dispensable, why do they feel indispensable? Treating this as optional weakens the explanatory power of the genealogy.

  **12. The Scope of Defeat (Negotiable)**
  The argument must clarify whether the defeat is permanent or provisional. It must state whether new evidence could restore justification or whether the genealogical defect is incurable.
  *Case:* Downstream Stability. This determines whether the realist is pushed toward error theory (permanent) or merely suspended judgment (provisional).

  **13. The Independence of Inputs (Prejudice)**
  The argument should not rely on the assumption that moral inputs from the environment are necessarily distinct from moral facts. (Marked as prejudice because some realists argue environmental inputs *are* partially constitutive of moral facts).
  *Case:* Fission. In the Fission case, different local inputs lead to different judgments. The argument assumes these inputs are not truth-tracking. A realist may dispute this.

  **14. The Coherence of the Debunker's Normativity (Non-Negotiable)**
  The argument must ensure that the norms of reasoning used to construct the EDA are not themselves subject to the same genealogical critique.
  *Case:* Self-Application. If logical norms are also evolutionarily shaped, the argument risks self-defeat unless it can insulate epistemic norms from moral norms.

  **15. The Practical Rationality Link (Negotiable)**
  The argument should clarify whether the loss of justification entails a loss of practical reason to act on the judgment.
  *Case:* Reformer. One might be unjustified in believing a moral claim but still have practical reason to act on it (e.g., for social coordination). The argument need not settle this, but must acknowledge it.

  ***

  ### Analysis of Incompatibilities

  There are two pairs of desiderata that generate significant tension, potentially rendering them jointly unsatisfiable in a single argument.

  **1. Granularity (#2) vs. Non-Circularity (#3)**
  *The Conflict:* To satisfy Granularity, the argument must sort moral judgments into "debunked" and "safe" categories. In the Fission case, this means explaining why the divergent judgment is unreliable while the convergent core is not. However, if the sorting criterion is purely genealogical (e.g., "judgments influenced by recent cultural change are debunked"), it risks being arbitrary or empirically false. If the sorting criterion relies on the content of the judgments (e.g., "judgments that align with reflective equilibrium are safe"), it violates Non-Circularity by presupposing first-order moral knowledge to validate the genealogy.
  *Verdict:* These are jointly unsatisfiable in a strong form. An argument cannot simultaneously achieve fine-grained discrimination among moral judgments and remain entirely neutral regarding the truth of those judgments.
  *Revision:* The list should drop the strong version of **Granularity (#2)**. The requirement should be weakened to: "The argument must provide a *prima facie* genealogical basis for differential confidence, even if it cannot definitively sort judgments without some independent epistemic anchor."

  **2. Epistemic Principle Constraint (#1) vs. Avoid Overgeneralization (Implicit in #1)**
  *The Conflict:* To do genuine work against the realist, the epistemic principle must be general enough to apply to moral beliefs despite their non-natural status (e.g., "causal independence defeats justification"). However, if the principle is that general, it threatens to debunk mathematics, logic, and perception (Overgeneralization). If the principle is restricted to morality to avoid this (e.g., "causal independence defeats *moral* justification"), it appears ad hoc and question-begging against the realist who denies morality is special in that way.
  *Verdict:* These are jointly unsatisfiable without a complex auxiliary theory of domain specificity. A simple EDA cannot satisfy both.
  *Revision:* The list should mark **Epistemic Principle Constraint (#1)** as requiring an auxiliary account of domain specificity. Without this, the argument fails the adequacy test.

  ***

  ### Most Exclusionary Requirement

  **The Epistemic Principle Constraint (#1), specifically the demand to avoid overgeneralization while maintaining generality.**

  *Reasoning:* This requirement excludes the largest number of candidate arguments because most EDAs rely on a premise that is either too weak to trouble the realist (e.g., "evolution influenced us," which the realist accepts) or too strong to be plausible (e.g., "causal contact is necessary for justification," which debunks math). Arguments that attempt to navigate the middle ground typically collapse into one of the incompatibilities noted above, either smuggling in moral premises to limit the scope or failing to explain why the principle doesn't apply to logic. It is the bottleneck through which most draft arguments fail.

  ***

  ### Scoring of Argument Types

  | Argument Type | Granularity (#2) | Epistemic Principle (#1) | Downstream Stability (#8) | Non-Circularity (#3) |
  | :--- | :--- | :--- | :--- | :--- |
  | **(A) Coincidence Dilemma**<br>*(Forces choice between relation to truth or coincidence)* | **Fail.** Tends to treat moral beliefs as a monolithic block vulnerable to the same evolutionary pressures, struggling to distinguish safe vs. unsafe judgments without moral premises. | **Pass.** Offers a clear general principle (sensitivity/safety), though vulnerable to overgeneralization charges regarding math/logic. | **Fail.** Often leaves the status of first-order practice undefined, focusing solely on the meta-ethical defeat. | **Pass.** Does not presuppose moral falsity, only the improbability of tracking. |
  | **(B) Categorical Authority**<br>*(Targets the concept of moral wrongness as evolutionarily useful fiction)* | **Fail.** Debunks all judgments involving categorical authority indiscriminately; lacks resources to save some moral truths while rejecting others. | **Pass.** Principle is domain-specific (moral concepts), avoiding overgeneralization to math, but risks ad hocery. | **Pass.** Explicitly recommends fictionalism or conservationism, accounting for continued practice despite error. | **Pass.** Analyzes the concept rather than presupposing the falsity of specific claims. |
  | **(C) Plain Genealogy**<br>*(Lack of causal contact suffices for defeat)* | **Fail.** If causal contact is required, all non-naturalist moral judgments are debunked equally; no granularity possible. | **Fail.** Premise (causal contact required) is too strong; debunks math/logic/modal facts, violating the constraint. | **Fail.** Pushes toward error theory/abolitionism without explaining the persistence of phenomenology. | **Pass.** Relies on metaphysical premises about moral facts, not first-order moral assumptions. |
