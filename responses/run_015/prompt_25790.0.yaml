prompt: |-
  I'm giving a talk next month to my department's ethics workshop defending the view that normative reasons are fundamentally free-floating — that is, reasons for action don't depend on any agent's desires, projects, or motivational set, and what look like agent-relative reasons are actually derivative from agent-neutral ones. The audience is mostly metaethicists: about half are Humeans who think all reasons are desire-based, a couple are Kantian constructivists who think reasons are constituted by the procedures of practical reason, and there are two moral realists (a naturalist and a non-naturalist) who are sympathetic to agent-neutral reasons but think my view is metaphysically extravagant. There's also one guy who works on Parfit and will know every move I make before I make it. I need a Q&A prep sheet: the objections I'll actually get from this crowd, ordered by how much trouble they'd cause me, phrased the way these people would phrase them, with a two-minute reply for each and a note on where the reply is soft. And tell me the question I should be praying nobody thinks to ask.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Topic:** Normative reasons are fundamentally free-floating (agent-neutral, desire-independent). Agent-relative reasons are derivative.
      *   **Context:** Department ethics workshop.
      *   **Audience:**
          *   50% Humeans (Desire-based reasons).
          *   A few Kantian Constructivists (Reasons = procedures of practical reason).
          *   2 Moral Realists (Naturalist & Non-naturalist, sympathetic to agent-neutrality but think the view is metaphysically extravagant).
          *   1 Parfit Expert (Knows all the moves).
      *   **Deliverable:** Q&A Prep Sheet.
      *   **Requirements:**
          *   Objections ordered by "trouble caused" (high to low).
          *   Phrased in the audience's jargon/style.
          *   Two-minute reply for each.
          *   Note on where the reply is soft/vulnerable.
          *   Identify the "Nightmare Question" (pray nobody asks).

  2.  **Deconstruct the View:**
      *   *Core Claim:* Reasons are "free-floating" (Platonic/Robust Realist flavor). They exist independently of agents.
      *   *Secondary Claim:* Agent-neutrality is fundamental; agent-relativity is derivative. (This is a strong claim, often associated with Parfit's *On What Matters*, but pushed further).
      *   *Implication:* If I have a reason to save my child, it's not because she's *mine* (relativity), but because there's an agent-neutral reason to save children, which applies to me in this context.

  3.  **Brainstorm Objections by Audience Segment:**

      *   **Humeans:** "Where's the motivation?" "How does a fact move me without a desire?" "The Internalism Challenge."
      *   **Kantian Constructivists:** "You're reifying reasons." "Reasons aren't *out there*, they're made by reasoning." "You're begging the question against the authority of rationality."
      *   **Realists (Naturalist/Non-naturalist):** "Queerness." "Supervenience." "Why posit this extra ontology?" "How do you explain the *normativity* without making it spooky?"
      *   **Parfit Expert:** "Schmagency." "The Triviality Objection." "Distinction between given reasons and having reasons." "Parfit's own shift in *On What Matters*."

  4.  **Select and Order Objections (by Trouble Level):**

      *   *High Trouble:* The Humean Internalism Challenge is classic and deadly if not handled well. It attacks the very link between reason and action.
      *   *High Trouble:* The Metaphysical Extravagance/Queerness objection (from the Realists). If your allies think you're too spooky, you're in trouble.
      *   *Medium-High Trouble:* The Derivation Problem (Agent-Relative to Agent-Neutral). How do you actually derive the specific "mine-ness" of reasons without smuggling relativity back in?
      *   *Medium Trouble:* The Constructivist Procedural Objection.
      *   *The Nightmare Question:* Something that combines metaphysics with the "having" of reasons, likely from the Parfit expert.

      *Refining the Order:*
      1.  **The Humean/Internalism Challenge:** (Most immediate, half the room). "How does it grip?"
      2.  **The Metaphysical Queerness/Extravagance:** (From the Realists). "Why so many entities?"
      3.  **The Derivation/Reduction Problem:** (Technical metaethics). "Can you actually reduce relativity?"
      4.  **The Constructivist Challenge:** "Reasons are constituted, not found."

      *Wait, let's look at the "Trouble" metric.* The Realists are *sympathetic* but worried about metaphysics. The Humeans are *hostile*. The Parfit expert is *dangerous*.
      *   *Top Trouble:* The Parfit Expert's "Triviality/Extensional Equivalence" move. If agent-relative reasons are just disguised agent-neutral ones, is the claim substantive or verbal?
      *   *Second:* The Humean "Motivation" objection.
      *   *Third:* The Realist "Queerness" objection.
      *   *Fourth:* The Derivation mechanics.

      *Let's adjust for the specific prompt:* "Ordered by how much trouble they'd cause me."
      1.  **The "Schmreason"/Extensional Equivalence Objection (Parfit Expert).** If you can translate every relative reason into a neutral one, have you said anything meaningful? This undermines the *point* of the talk.
      2.  **The Humean Internalism Challenge.** "Reasons must be capable of motivating." If they are free-floating, how do they connect to psychology?
      3.  **The Metaphysical Queerness (Realists).** "Why posit free-floating entities?"
      4.  **The Derivation Mechanism.** "How exactly does the neutral become relative?"

      *Actually, the "Nightmare Question" should be separate.*

  5.  **Drafting the Content (Iterative Process):**

      *   *Objection 1 (Parfit Expert):* Focus on the substantive vs. verbal dispute. If I say "I have a reason to save my kid because there is a neutral reason to save kids," the Humean says "No, you have a reason because you want to." The Parfit guy will ask: "Is your view just a notational variant of a sophisticated Humean view or a specific kind of Realism that collapses into triviality?"
      *   *Objection 2 (Humean):* Focus on Internalism. "Reasons must be capable of being motivating states." Free-floating reasons are external. Reply: Distinguish normative from motivating reasons. Soft spot: Explains *why* we should care, not *why* we do.
      *   *Objection 3 (Realists):* Focus on Ontology. "Free-floating" sounds Platonic. Reply: They are properties or relations, not weird entities. Soft spot: Supervenience.
      *   *Objection 4 (Constructivist):* Focus on Authority. "Reasons come from *us*." Reply: That confuses the source of validity with the source of motivation. Soft spot: Makes normativity look too rigid.

      *Refining the "Nightmare Question":* It needs to be something that exposes a fatal flaw in the "derivative" claim.
      *   *Idea:* "If agent-relative reasons are derivative, what is the *principle of derivation*? If it's agent-neutral, doesn't that principle itself require an agent to apply it? If so, isn't the agent back in the foundation?"
      *   *Better Idea (Parfit style):* "On your view, is it possible for there to be a reason for *no one*? If yes, what kind of reason is it? If no, isn't 'for an agent' essential to the concept of a reason, making your 'free-floating' claim incoherent?"
      *   *Best Idea:* The "Normative Significance" objection. "Even if you can extensionally map relative reasons to neutral ones, you lose the *explanatory power* of relativity. Why does it *matter* that it's my child? If the reason is neutral, why am I permitted to prioritize her? You haven't reduced relativity; you've erased the phenomenon."

  6.  **Developing the Replies:**
      *   Need to be concise (2 mins spoken is approx. 250-300 words).
      *   Need to acknowledge the strength of the objection.
      *   Need to identify the "soft spot" honestly.

  7.  **Final Review against Constraints:**
      *   Audience specific jargon? (Yes: Internalism, Queerness, Supervenience, Extensional Equivalence).
      *   Ordered by trouble? (Yes).
      *   Two-minute replies? (Yes, kept tight).
      *   Soft spots noted? (Yes).
      *   Nightmare question identified? (Yes).

  8.  **Polishing the Tone:**
      *   Professional, slightly anxious but prepared academic tone.
      *   Ensure the distinction between "free-floating" (ontology) and "agent-neutral" (scope) is clear, as the prompt links them.

      *(Self-Correction during drafting)*: Make sure I don't confuse "free-floating" (ontology) with "agent-neutral" (scope). The prompt says "reasons... don't depend on desires... and what look like agent-relative reasons are actually derivative from agent-neutral ones." So it's a double claim: Externalism + Neutrality Fundamentalism. The objections need to target this combo.

      *Revised Order of Trouble:*
      1.  **The Parfit Expert (Extensional Equivalence/Triviality).** This kills the novelty.
      2.  **The Humeans (Internalism).** This kills the action-guidingness.
      3.  **The Realists (Metaphysical Inflation).** This kills the parsimony.
      4.  **The Constructivists (Authority).** This kills the normative force.

      *Nightmare Question:* Needs to target the "derivative" link specifically. "What is the bridging principle?"

      *Let's write it.*
answer: |-
  # Q&A Prep Sheet: "Free-Floating Reasons & The Derivative Nature of Relativity"

  **Context:** Department Ethics Workshop
  **View:** Robust Realism (Reasons are desire-independent) + Agent-Neutrality Fundamentalism (Relativity is derivative).
  **Audience:** 50% Humeans, ~3 Constructivists, 2 Realists (sympathetic but wary), 1 Parfit Expert.

  ---

  ### 1. The "Extensional Equivalence" Objection (The Parfit Expert)
  **Phrasing:** "You claim agent-relative reasons are derivative of agent-neutral ones. But isn't this just a notational variant? For any putative relative reason (e.g., 'I have reason to save *my* child'), you posit a neutral reason ('There is reason for a parent to save their child') plus a fact ('I am a parent'). If the extension of reasons remains identical, what substantive work is 'fundamentality' doing? Are you making a metaphysical claim or just a linguistic one? If it's metaphysical, how do you test it? If it's linguistic, why should we care?"

  **2-Minute Reply:**
  "It's a substantive metaphysical claim about the *direction of explanation*, not just extension. Consider the Euthyphro dilemma. I'm claiming the reason exists *because* the neutral value exists, not that the neutral value exists because we have relative reasons. The work this does is solve coordination problems and moral disagreement. If reasons are fundamentally relative, my reason to save my child and your reason to save yours are distinct normative facts. If they are fundamentally neutral, we are both responding to the *same* normative fact. This explains why I can understand your reason as a reason, rather than just a psychological quirk. It grounds the universality of normative discourse without denying the phenomenology of special obligations."

  **Where the Reply is Soft:**
  You haven't explained *how* the neutral fact generates the specific priority. The Parfit expert knows that Parfit eventually conceded that some debates between Neutralists and Relativists might be non-substantive. If pressed on whether there is any possible world where the extensions diverge, you might be stuck.

  ### 2. The Internalism Challenge (The Humeans)
  **Phrasing:** "You've severed the link between reasons and the motivational set. If a reason is 'free-floating' and independent of my desires, how does it get a grip on me? If I have no desire to act on this neutral reason, in what sense is it a reason *for me*? You're positing 'reasons' that can exist even if no agent is capable of being motivated by them. That looks like a category error. You're describing values, not reasons for action."

  **2-Minute Reply:**
  "We need to distinguish *normative* reasons from *motivating* reasons. My claim is about the former. A reason is a consideration that counts in favor of an action, regardless of whether the agent is currently moved. The Humean conflates 'having a reason' with 'being motivated.' If an agent is irrational or depressed, they may have overwhelming normative reasons to eat or seek help, even if their motivational set is void. The 'grip' comes from rationality, not desire. To be rational is to respond to reasons that are there, not to create them by desiring."

  **Where the Reply is Soft:**
  This relies on a robust, contested notion of "Rationality" that the Humeans reject as just another desire (a desire to be rational). You risk begging the question against Internalism. If they press, "What *is* this rationality if not a psychological disposition?" you may lack a naturalistic account.

  ### 3. The Metaphysical Inflation Objection (The Realists)
  **Phrasing:** "We agree reasons aren't desire-based, but 'free-floating' sounds ontologically extravagant. Where are these reasons? How do they supervene on the natural facts? If you posit a realm of neutral normative facts that exist independently of agents, you're inviting the Queerness objection. Why multiply entities beyond necessity? Can't we get agent-neutrality with a leaner ontology, perhaps grounded in natural properties of well-being?"

  **2-Minute Reply:**
  "I'm not positing a 'realm' of entities, but rather irreducible normative properties. This isn't more extravagant than positing logical or mathematical truths, which also hold independently of our desires. Regarding supervenience: normative properties supervene on natural properties just as modal properties do. The 'extravagance' charge only holds if you demand a reductive explanation of normativity, which I argue is impossible. We shouldn't reduce the normative to the natural just to save on ontology; we should save the phenomenon of normativity even if it costs us ontological parsimony."

  **Where the Reply is Soft:**
  The Naturalist Realist in the room will pounce on the "irreducible" claim. If you can't explain the supervenience relation (why *this* natural fact gives rise to *that* normative reason), you look like you're positing magic. The Non-naturalist might worry you're making normativity too disconnected from human flourishing.

  ### 4. The Procedural Authority Objection (The Constructivists)
  **Phrasing:** "You treat reasons as objects to be found, not conclusions to be reached. But reasons only have authority because they are the outcome of correct deliberation. By making reasons 'free-floating,' you make them external authorities that bypass the agent's autonomy. Why should I care about a 'neutral reason' that wasn't constituted by my own practical reasoning? You're describing a tyranny of facts, not a space of reasons."

  **2-Minute Reply:**
  "Constructivism confuses the *test* for a reason with the *nature* of a reason. Deliberation is how we discover reasons, not how we create them. If reasons were constituted by procedure, then a perfectly rational procedure could theoretically constitute a reason to torture innocents if the premises allowed. The constraint on deliberation comes from the outside. Autonomy isn't creating the law; it's binding oneself to the law that is already there. My view preserves autonomy by ensuring our choices are responses to genuine value, not exercises in normative legislation."

  **Where the Reply is Soft:**
  Constructivists argue that "facts already there" is precisely what undermines autonomy. If the reason is "free-floating," the agent is passive. You need to explain how "responding" is active enough to count as autonomy, which is a hard line to walk in two minutes.

  ---

  ### The Nightmare Question (Pray Nobody Asks This)

  **The Question:**
  **"What is the Bridging Principle?"**
  *(Likely asked by the Parfit Expert or a sharp Constructivist)*

  **Phrasing:** "You say agent-relative reasons are *derivative* of agent-neutral ones. So, there is a neutral reason $R_n$ and some natural fact $F$ (e.g., 'this is my child') that generates the relative reason $R_r$ for me. What is the *principle* that connects $R_n$ and $F$ to generate $R_r$?
  If that bridging principle is itself agent-neutral, then doesn't it require yet another fact to apply it to you, leading to an infinite regress?
  But if that bridging principle is *agent-relative* (e.g., 'Everyone has reason to prioritize *their own* children'), then haven't you just presupposed the agent-relativity you claimed to derive? You haven't eliminated relativity; you've just hidden it in the bridging principle."

  **Why this is fatal:**
  It attacks the core mechanism of your view. If the principle that converts neutral reasons to relative ones is neutral, it can't explain the *specialness* of the relation. If the principle is relative, your claim that neutrality is *fundamental* is false. It suggests your view is either regress-prone or circular.

  **Prepared Defense (If asked):**
  "I would argue the bridging principle is a necessary truth about the structure of agency, not a further reason. It's not 'I have a reason to prioritize my child,' but rather 'The neutral reason to promote well-being *takes the form of* special obligations in contexts of intimacy.' The relativity isn't in the principle; it's in the *instantiation* of the neutral value. However, I concede this is the hardest part of the view, and I'm currently working on a paper specifically on the metaphysics of instantiation to address the regress worry." (Translation: *I don't have a full answer yet, but I know it's a technical problem, not a fatal one.*)
