  **Setting:** *A conference room, 11:45 PM. Coffee cups are scattered across the table. A map of the watershed is spread out between them. Jin is rubbing their temples. Rosa is staring at the map.*

  **Jin:** We're not going to resolve this tonight if we keep circling the same drain. Look, I know you hate the logging clause. I hate the logging clause. But if we pass this plan, the Tribe gets legal recognition of the burial sites, and the Conservancy gets funding to protect the remaining eighty percent of the watershed.

  **Rosa:** And you think that's a trade. A swap. You give up some trees, you get some protection.

  **Jin:** I think it's a surplus. That's the point I've been trying to make for three hours. Neither of us gets everything we want. But by giving up the thing we want *less*, we secure the thing we want *more*. The total value goes up. That's not corruption, Rosa. That's rationality.

  **Rosa:** It's rational only if you assume our values are commodities. Like bushels of wheat. "I'll trade you two acres of old growth for one guaranteed burial plot." That's not what's happening here.

  **Jin:** Isn't it?

  **Rosa:** No. When we agree on this plan, we aren't trading values. We're discovering that we weren't actually opposed to begin with. You think you care about timber revenue, but you really care about community viability. I think I care about absolute preservation, but I really care about the endurance of the land's meaning. This plan doesn't split the difference; it satisfies the deeper commitment we both share. The overlap was always there. We just had to dig through the noise to find it.

  **Jin:** That's a comforting story. It really is. It makes compromise feel like enlightenment instead of surrender. But sometimes, Rosa, the overlap isn't there. Sometimes values are just... incommunicable. God, I mean incommensurable. You know what I mean. There's no common metric.

  **Rosa:** I know what you mean. But if they were truly incommensurable, we wouldn't be sitting here drafting a memo. We'd be walking away.

  **Jin:** Not necessarily. We could walk away better off even without overlap. That's the gains-from-trade story. I value clean water more than I value this specific stand of pine. You value economic stability for the locals more than you value leaving every tree untouched. We swap. We both walk away happier. But we didn't find a hidden truth. We just managed conflicting desires.

  **Rosa:** But why did you value the water more? Why do I value the stability?

  **Jin:** Because of our preferences.

  **Rosa:** Because of a shared understanding of what makes a life livable. That's the overlap. Jin, if there was truly *no* overlap—if your "good" was fundamentally alien to my "good"—you couldn't explain to me why the water matters in a way I'd accept. The fact that we can justify this compromise to each other proves the values are commensurable.

  **Jin:** Okay, but let's push that. Let's say a faction comes in tomorrow and says, "No. The ground is sacred. To break the soil is to destroy the ancestors. There is no amount of water protection that balances that." No overlap. No trade. Just a hard boundary.

  **Rosa:** Then we don't log.

  **Jin:** Exactly. And that's where my view gets fragile. I admit it. If one party treats a value as sacred—non-negotiable, non-fungible—then the gains-from-trade model collapses. You can't trade with a sacred value without committing corruption. In that case, compromise isn't surplus; it's betrayal.

  **Rosa:** So you agree there are limits.

  **Jin:** I agree there are limits to *my* view. That's why I'm sweating over this map. Because I don't know if the burial sites are sacred in that way, or if they're important in a way that allows for margins. But here's my worry about your view, Rosa. If you insist it's all hidden overlap, you risk delusion. You risk telling people, "You don't actually care about what you say you care about." That's dismissive.

  **Rosa:** I'm not saying they don't care. I'm saying people are often bad at articulating the hierarchy of their own values. They say "No logging," but what they mean is "No destruction of meaning." If the logging is seasonal, limited, and funds the stewardship that prevents clear-cutting elsewhere, have we destroyed the meaning?

  **Jin:** We've dirtied it.

  **Rosa:** We've complicated it. And sometimes, complicating the moral picture is the only way to keep the land from being sold to a developer who doesn't care about meaning at all.

  **Jin:** See, that sounds like a trade to me. We accept the dirt to avoid the bulldozer.

  **Rosa:** Or, we accept the complexity to preserve the relationship. That's the overlap. We both want the relationship between the community and the land to survive.

  **Jin:** *(Leans back, exhales)* You're stubborn.

  **Rosa:** And you're tired.

  **Jin:** I am. But I still think you're underestimating the cost. When I sign this, I am giving up something real. It's not just noise I'm cutting through. It's a principle. And I'm sacrificing it for a result. That feels like loss, not discovery.

  **Rosa:** I know it feels like loss. But if you believed the principle was absolute, you wouldn't sign. The fact that you're willing to sign tells me the principle wasn't absolute. It was conditional.

  **Jin:** Or it tells me I'm human, and I'd rather save eighty percent of the watershed than die on a hill for zero percent.

  **Rosa:** Which implies you value the watershed's existence more than the purity of your stance.

  **Jin:** *(Smiles faintly)* There it is. The reframing.

  **Rosa:** It's not a reframing, Jin. It's what you just said.

  **Jin:** Maybe. Or maybe we're just two people trying to sleep tonight knowing we didn't let everything burn down.

  **Rosa:** Is there a difference?

  **Jin:** *(Looks at the map)* For the course notes? Yeah. There's a difference. One says we built something new. The other says we found something old.

  **Rosa:** And if the result is the same?

  **Jin:** Then the argument is about who we are, not what we do.

  **Rosa:** Which is usually where the real deadlock is.

  **Jin:** *(Picks up the pen)* Let's draft the clause. We can argue about why we're signing it after the election.

  **Rosa:** Deal.
