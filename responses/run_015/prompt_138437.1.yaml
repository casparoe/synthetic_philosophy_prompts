answer: |-
  Here is the architecture for your widget. I have built this from the logical divisions first, as requested, ensuring the five required positions emerge from the scoring rather than being pasted on top.

  ### Part 1: The Logical Branch Cuts
  Before writing the questions, we must identify the four "forks in the road" that actually separate these five ethical positions. If your widget doesn't test these specific tensions, the results will be noise.

  1.  **The Legitimacy Cut:** Is the boat's authority valid?
      *   *Yes:* You play the allocation game (Hardin, Triage, Lottery, Repair).
      *   *No:* You reject the game entirely (System Corrupt).
  2.  **The Time-Horizon Cut:** Are we optimizing for *now* or *later*?
      *   *Now:* Save the most lives today (Triage).
      *   *Later:* Ensure the boat survives the voyage (Hardin).
  3.  **The Duty Source Cut:** Why do we owe help?
      *   *Past Causality:* Because we broke it (Repair).
      *   *Abstract Equality:* Because all lives are equal (Lottery).
  4.  **The Mechanism Cut:** How do we decide?
      *   *Optimization:* Pick the best outcome (Triage/Hardin).
      *   *Randomization:* Pick a fair process (Lottery).

  **The Commitment:**
  If an editor forced me to cut one question, I would cut the **"Refuses Life Jacket"** case (Question 5 below). While it tests agency and paternalism, it is the least discriminant. A Triage ethicist and a Hardin ethicist often give the same answer here (force the jacket for the greater good), making it hard to score. I would replace it with a second "Time-Horizon" question to better separate Hardin from Triage, as that is the muddiest distinction in public discourse. However, per your requirements, I have included it below.

  ---

  ### Part 2: The Widget Questions
  *Instructions for readers: Pick the answer that feels most like your gut reaction. Don't overthink the "right" moral answer.*

  **Q1. The Cause**
  Swimmers are in the water because your crew overloaded a different boat yesterday to make profit. That boat sank. These are the survivors.
  *   **A.** Pull them aboard immediately. Your crew caused this disaster; the debt is yours.
  *   **B.** Pull them aboard. A drowning person is a drowning person; cause doesn't change the need.
  *   **C.** You cannot pull them aboard. Your boat is at capacity, and saving them risks sinking everyone, regardless of who caused the mess.

  **Q2. The Navigator**
  A swimmer is hauled aboard. It turns out they are the only person who knows how to steer toward a second, emptier vessel nearby.
  *   **A.** They get priority rations and protection. They are the key to saving the whole group.
  *   **B.** They get the same as everyone else. Special treatment undermines the rule of equality.
  *   **C.** This shouldn't matter. If the boat is full, the skill of the swimmer doesn't change the capacity limit.

  **Q3. The Permanent Storm**
  You realize this isn't a temporary emergency. The ocean is rising; this boat will *always* be overcrowded. There is no "after the storm."
  *   **A.** Then the rules must change. We need to offload people or the system collapses.
  *   **B.** Then we tighten belts. We share the scarcity equally until we reach land.
  *   **C.** Then the boat is a prison. We should stop steering and demand rescue from shore.

  **Q4. The Charter**
  The boat's written rules say "Never leave a soul behind." But taking the next swimmer means the boat sits lower in the water.
  *   **A.** Follow the rule. If we start picking, the authority of the boat is broken.
  *   **B.** Break the rule. A rule that sinks the boat is a bad rule.
  *   **C.** Burn the rulebook. Who wrote a rule that forces us to drown together?

  **Q5. The Refusal**
  You are allowed to throw a life jacket to a swimmer, but they shout that they don't want your charity and refuse to put it on.
  *   **A.** Throw it anyway. They are in shock; you know better than they do what keeps them alive.
  *   **B.** Hold the jacket. If they refuse help, you respect their agency even if they drown.
  *   **C.** Ask the group. Is this person's choice going to endanger others by delaying rescue?

  **Q6. The Ration**
  Taking three swimmers aboard means cutting food rations for the children already in the hold by 20%.
  *   **A.** Do not take the swimmers. The children on board are your primary responsibility.
  *   **B.** Take the swimmers. Starving slowly is better than drowning now; share the risk.
  *   **C.** Take the swimmers. The children's safety shouldn't depend on excluding others.

  **Q7. The Tie**
  You have room for one more person. Three swimmers are identical in age, health, and need.
  *   **A.** Draw straws. Any other method favors the strong or the loud.
  *   **B.** Pick the one closest to the boat. Efficiency saves time and energy.
  *   **C.** Check their history. Pick the one least likely to cause trouble later.

  **Q8. The Destination**
  You find out the "second, emptier vessel" (from Q2) is a prison barge run by a hostile government.
  *   **A.** Steer there anyway. Survival is the only moral imperative.
  *   **B.** Refuse to steer. Delivering people to prison is worse than drowning.
  *   **C.** Scuttle the boat. If the only safe harbor is a cage, the voyage is a lie.

  ---

  ### Part 3: The Scoring Key
  *For the developer: Assign points to the five profiles based on the selection below. The highest score wins. If "System Corrupt" is tied with another, "System Corrupt" wins (it is a veto position).*

  | Question | Answer | **The Steward** (Hardin) | **The Surgeon** (Triage) | **The Referee** (Lottery) | **The Restorer** (Repair) | **The Saboteur** (Corrupt) |
  | :--- | :--- | :---: | :---: | :---: | :---: | :---: |
  | **Q1** | A | 0 | 0 | 0 | **2** | 0 |
  | | B | 0 | 1 | 1 | 0 | 0 |
  | | C | **2** | 0 | 0 | 0 | 0 |
  | **Q2** | A | 0 | **2** | 0 | 0 | 0 |
  | | B | 0 | 0 | **2** | 0 | 0 |
  | | C | **1** | 0 | 0 | 0 | 0 |
  | **Q3** | A | **2** | 0 | 0 | 0 | 0 |
  | | B | 0 | 0 | **1** | 0 | 0 |
  | | C | 0 | 0 | 0 | 0 | **2** |
  | **Q4** | A | 0 | 0 | **1** | 0 | 0 |
  | | B | **1** | **1** | 0 | 0 | 0 |
  | | C | 0 | 0 | 0 | 0 | **2** |
  | **Q5** | A | **1** | **1** | 0 | 0 | 0 |
  | | B | 0 | 0 | **1** | 0 | 0 |
  | | C | **1** | **1** | 0 | 0 | 0 |
  | **Q6** | A | **2** | 0 | 0 | 0 | 0 |
  | | B | 0 | **1** | **1** | 0 | 0 |
  | | C | 0 | 0 | 0 | **1** | 0 |
  | **Q7** | A | 0 | 0 | **2** | 0 | 0 |
  | | B | 0 | **2** | 0 | 0 | 0 |
  | | C | **1** | 0 | 0 | 0 | 0 |
  | **Q8** | A | 0 | **2** | 0 | 0 | 0 |
  | | B | 0 | 0 | 0 | 0 | **1** |
  | | C | 0 | 0 | 0 | 0 | **2** |

  **The Profiles (Leaves):**
  *   **The Steward (Hardin):** Capacity is absolute. Helping now destroys the ability to help later. Sustainability trumps immediate rescue.
  *   **The Surgeon (Triage):** Maximize lives saved. Utility trumps fairness. Do the most good with the resources available.
  *   **The Referee (Lottery):** Procedural justice. All lives are equal, so chance must decide. No one gets priority.
  *   **The Restorer (Repair):** Restorative justice. Harm creates debt. If you broke it, you must fix it, even at cost.
  *   **The Saboteur (System Corrupt):** Illegitimacy. The boat itself is the problem. Allocation is a distraction from structural change.

  ---

  ### Part 4: Analysis of the Logical Space

  **1. The Empty Branch: "The Guilty Steward"**
  There is a logical combination that yields no coherent position: **High Restorer + High Steward.**
  *   *The Conflict:* This person believes "We caused this disaster and owe a debt" (Restorer) *and* "We physically cannot take anyone or we all die" (Steward).
  *   *Why it's empty:* In practice, this creates a paralysis that collapses into one of the other views. Either the debt is so heavy it overrides capacity (becoming Restorer), or the capacity limit is so absolute it overrides debt (becoming Steward). There is no stable ethical school that says "We owe them everything, but we will give them nothing, and we accept this contradiction."
  *   *Widget Handling:* If a user scores high on both, the algorithm should default to **Steward**. In lifeboat scenarios, physical constraints (physics) usually veto moral debts (metaphysics).

  **2. The Indistinguishable Leaves: Surgeon vs. Steward**
  *   *The Issue:* In many emergency scenarios, Triage (Surgeon) and Hardin (Steward) give the same answer: "Don't take the swimmer."
  *   *The Difference:* The *reasoning*. The Surgeon says "They will die anyway, save the ones who live." The Steward says "If we take them, everyone dies later."
  *   *How we split them:* Questions 3 (Permanent Storm) and 6 (The Ration). Q3 forces a choice between managing scarcity forever (Steward) vs. sharing it (Surgeon/Referee). Q6 forces a choice between protecting current passengers (Steward) vs. saving immediate drowning people (Surgeon).
  *   *Flag:* If your readers are rushing, these two profiles may blur. The text results must emphasize *why* they said no (Future collapse vs. Immediate utility).

  **3. The Dominant Cut: Legitimacy**
  The most significant branch cut is **Question 4 (The Charter)** and **Question 8 (The Destination)**.
  *   These questions separate **The Saboteur** from everyone else.
  *   Every other position accepts the boat as a valid unit of analysis. The Saboteur rejects the boat.
  *   *Scoring Note:* This is why the Saboteur score acts as a veto. You cannot be a "Fair Lottery" advocate if you believe the boat should be scuttled. The Saboteur view consumes the others.

  **4. The Weakest Cut: Agency (Q5)**
  As noted in the commitment section, Question 5 (Refuses Jacket) is the weakest discriminator.
  *   *Why:* Both Stewards and Surgeons tend toward paternalism (Answer A/C). Referees tend toward consent (Answer B). But Restorers and Saboteurs are split.
  *   *Risk:* A user who picks "Respect Agency" might be a libertarian, not necessarily a Lottery ethicist.
  *   *Mitigation:* Keep the score weight low (1 point max) so it doesn't skew the profile. It serves better as a "tie-breaker" for the Referee profile than a primary driver.

  **5. Summary of Branch Cuts**
  If you visualize this as a tree:
  1.  **Root:** Is the boat legitimate? (No → Saboteur).
  2.  **Trunk:** Do past actions dictate duty? (Yes → Restorer).
  3.  **Branch:** Is fairness more important than outcome? (Yes → Referee).
  4.  **Twigs:** Is the limit physical (Steward) or resource-based (Surgeon)?

  This structure ensures your readers aren't just picking labels, but navigating the actual tensions that make lifeboat ethics difficult.
