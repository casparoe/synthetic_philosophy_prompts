  # The Value of Knowledge: A Decision Tree
  ### Based on Plato's *Meno* Problem

  **Starting Commitment:** We compare knowledge with mere true belief in a single case, at a time, holding fixed the truth of the proposition believed and, so far as the case allows, its practical upshot.

  ---

  ### Node 1 (Primary Question)
  **Case:** *The Road to Larissa*. Holding successful arrival fixed, is knowledge strictly more valuable than true belief in this single instance?
  *   **No:** Go to **Leaf 1**.
  *   **Yes:** Go to **Node 2**.

  ### Node 2 (Source of Value)
  **Case:** *The Coffee Machine*. Is the source of this extra value the truth-conduciveness of the belief's origin?
  *   **Yes:** Go to **Node 3**.
  *   **No:** Go to **Node 4**.

  ### Node 3 (Reliability Type)
  **Case:** *The Coffee Machine*. Does the value attach to the agent's stable disposition or the process type producing this token?
  *   **Agent's Disposition:** Go to **Leaf 2**.
  *   **Process Type:** Go to **Leaf 3**.

  ### Node 4 (Agency vs. Role)
  **Case:** *The Detective and the Lucky Tipster*. Is the value grounded in the agent's cognitive performance or the belief's functional role?
  *   **Agent's Performance:** Go to **Node 5**.
  *   **Functional Role:** Go to **Node 6**.

  ### Node 5 (Secondary & Tertiary Questions)
  **Cases:** *Barn-Façade County* / *Two Students*. What secures the value: anti-luck conditions, cognitive credit, or a deeper grasp?
  *   **Anti-Luck Conditions:** Go to **Leaf 4**.
  *   **Cognitive Credit:** Go to **Leaf 5**.
  *   **Deeper Grasp:** Go to **Leaf 6**.

  ### Node 6 (Functional Role Type)
  **Cases:** *The Loving Grandmother* / *The Good Informant*. Is the value in the belief's stability, its social signaling, or its normative status?
  *   **Stability:** Go to **Leaf 7**.
  *   **Social Signaling:** Go to **Leaf 8**.
  *   **Normative Status:** Go to **Node 7**.

  ### Node 7 (Tertiary Question: Stakes)
  **Case:** *Stakes*. Is the normative status sensitive to practical context?
  *   **Yes:** Go to **Leaf 9**.
  *   **No:** Go to **Leaf 10**.

  ---

  ### The Leaves (Positions)

  **Leaf 1: The Dissolution**
  *   **View:** Knowledge is no more valuable than true belief, or knowledge just is true belief.
  *   **Awkward Commitment:** Contradicts the deep intuition that knowledge is specially valuable.

  **Leaf 2: Faculty Reliabilism**
  *   **View:** Value lies in possessing a reliable cognitive faculty rather than the specific belief token.
  *   **Awkward Commitment:** Shifts value from the belief to the agent's hardware.

  **Leaf 3: Process Reliabilism (Swamping Reply)**
  *   **View:** Reliability adds value to the belief type, though the token is swamped by truth.
  *   **Awkward Commitment:** Concedes token knowledge lacks extra value over token true belief.

  **Leaf 4: Anti-Luck+Ability**
  *   **View:** Knowledge requires cognitive ability plus safety from environmental luck.
  *   **Awkward Commitment:** Requires complex hybrid conditions to define safety.

  **Leaf 5: Credit/Virtue**
  *   **View:** Knowledge is true belief creditable to the agent's cognitive agency.
  *   **Awkward Commitment:** Struggles to accommodate testimonial knowledge where credit is shared.

  **Leaf 6: Understanding > Knowledge**
  *   **View:** Understanding is the primary epistemic value, surpassing knowledge.
  *   **Awkward Commitment:** Demotes knowledge from the central epistemic goal.

  **Leaf 7: Practical-Guidance (Plato)**
  *   **View:** Knowledge is true belief tied down by reasoning, ensuring stability.
  *   **Awkward Commitment:** False beliefs can also be stubbornly stable.

  **Leaf 8: Social/Genealogical**
  *   **View:** Knowledge concepts evolved to flag reliable informants for social cooperation.
  *   **Awkward Commitment:** Reduces epistemic value to sociological utility.

  **Leaf 9: Norm of Practical Reasoning (Stakes-Sensitive)**
  *   **View:** Knowledge is the norm of assertion and reasoning, sensitive to practical stakes.
  *   **Awkward Commitment:** Makes knowledge attribution vary with non-epistemic factors.

  **Leaf 10: Knowledge-First**
  *   **View:** Knowledge is a primitive mental state unanalyzable into parts.
  *   **Awkward Commitment:** Offers no explanatory account of why knowledge is valuable.

  ---

  ### Logical Space Diagnostics

  **Indistinguishable Leaves:**
  No leaves remain indistinguishable within this tree; each path relies on a distinct diagnostic case or claim.

  **Unoccupied Combinations:**
  1.  **Process Reliabilism + Understanding:** (Diagnosis: Incompatible aims; process targets truth, understanding targets grasp).
  2.  **Dissolution + Normative Status:** (Diagnosis: Incoherent; if no value difference, no distinct norm).
  3.  **Social View + Faculty Reliabilism:** (Diagnosis: Merely unattractive; social view focuses on interaction, faculty on individual hardware).

  \answer{best-supported leaf: Knowledge-First; occupied leaves: 10 of 10; unoccupied: 3}
