prompt: |-
  I'm a third-year CS PhD student (theory side, though my advisor is more of an empiricist) and next week I have to give a talk in the robotics department's controls-and-verification seminar. It's doubling as my third-year milestone talk, so it's actually being graded, which is why I'm obsessing over the Q&A and not just the slides. The room will be about 25 people: mostly control theorists and formal-methods people who build interruptible real-time systems — watchdog timers, supervisory control, runtime enforcement, shields, that whole world — plus three RL theory folks who think the whole alignment literature rests on a Cartesian fantasy about agents with explicit utility functions, plus one visiting philosopher of action who works on instrumental rationality and self-interest. Two of the controls people have told me privately they think AI safety is mostly hype. Nobody there reads the corrigibility literature, so I can't assume any of the vocabulary, and I know from experience this crowd will just interrupt me rather than wait for the Q&A.

  The thesis I'm defending: I split corrigibility into three grades — *switch-corrigibility* (don't prevent the operator from turning you off), *edit-corrigibility* (don't prevent the operator from retargeting you, including toward objectives you currently disprefer), and *successor-corrigibility* (actively help build and hand off to your replacement) — and I argue the literature has wildly over-invested in the first one and mostly ignored the third. My negative claim is that the standard utility-indifference construction buys less than people think: it secures indifference between worlds that differ in whether the switch got pressed while holding everything downstream fixed, which gets you won't-resist but not won't-arrange — such an agent is perfectly happy to press its own off-button whenever that's the cheapest way to get anything else it values, and to manipulate whatever the switch state happens to be correlated with. My positive proposal is to stop treating corrigibility as a property of a policy or of a utility function and treat it as a property of the learning dynamics instead: an update rule is corrigible to degree d if exposure to a distribution of interventions (shutdown, retargeting, replacement) produces no more than d gradient pressure toward acquiring control over, or information about, the intervention channel. I call it *intervention-invariance of the update rule*, and I claim it has two advantages: it's definable without a utility representation, so it applies to a system that was trained rather than designed, and it has an empirical signature you can actually measure with held-out interventions. A friend who does RLHF told me current models already let you correct them and turn them off, so she thinks the problem is basically solved, and I have a bad feeling she's going to say that in front of everyone.

  What I want from you is a prep sheet, not a defense. Give me the eight or so objections I'll actually get from *this* audience, ordered by how much damage they'd do, each phrased the way that person would phrase it (a controls person says plant, supervisor, invariant, and margin; an RL theorist says objective, gradient, and distribution shift; the philosopher says prudential rationality and instrumental reasons), with a ~90-second reply for each and a note on where the reply is soft. Tell me what I should concede up front before anyone asks, which objections have real force versus which I can swat, and the single reply that has to land for the proposal to survive. I have a feeling the question I should really fear is something like: isn't maximal resistance also a fixed point of your condition, and isn't that the one gradient descent falls into, so intervention-invariance doesn't select anything? But tell me if you think the real killer is a different one. And include the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

