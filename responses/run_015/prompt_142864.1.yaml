answer: |-
  There is no single, canonical term in the political science or econometric literature that captures this *entire* feedback loop (design $\rightarrow$ exclusion $\rightarrow$ data generation $\rightarrow$ justification) in one phrase. However, your description of **"Institutional Tautology"** is analytically precise and resonates strongly with three specific bodies of literature: **Policy Feedback Theory**, **Economic Performativity**, and **Critical Bureaucracy Studies**.

  While scholars often gesture at this phenomenon using terms like the *Matthew Effect* or *Selection Bias*, those terms are insufficient for the specific mechanism you are describing. Below is an analysis of why existing terms fall short, where your concept fits in the literature, and the specific conceptual work distinguishing it achieves.

  ### 1. Why Existing Terms Are Insufficient

  To distinguish your concept, you must clarify why it is not merely a methodological error or a standard distributional outcome.

  *   **Vs. Selection Bias:** In econometrics, selection bias is a *methodological flaw* to be corrected (e.g., via Heckman correction). It implies the analyst made a mistake in measuring the effect. In your scenario, the "bias" is not a mistake; it is a **design feature**. The policy *intends* to select for labor attachment. Calling it "selection bias" obscures the political choice embedded in the eligibility rule.
  *   **Vs. Cream Skimming:** Cream skimming usually implies discretionary action by street-level bureaucrats or service providers who cherry-pick the easiest clients to meet performance metrics. Your example describes **statutory exclusion**. The "skimming" is hard-coded into the law, not left to administrative discretion.
  *   **Vs. The Matthew Effect:** The Matthew Effect ("the rich get richer") describes the *outcome* of cumulative advantage. It explains *that* inequality widens, but it does not explain the *legitimation loop*. The Matthew Effect does not account for how the resulting data is used to justify the original rule. Your concept adds the **reflexive justification** layer: the outcome is used to prove the necessity of the mechanism that produced the outcome.

  ### 2. Theoretical Anchors & Suggested Terminology

  While "Institutional Tautology" is an excellent descriptor, you might anchor it in existing frameworks to give it weight in the literature.

  **A. Policy Feedback Theory (Mettler & Soss)**
  This is your strongest anchor. Policy feedback theory argues that policies are not just outputs of politics but inputs that shape future politics.
  *   **Resource Effects:** Who gets resources (the stable workers).
  *   **Interpretive Effects:** How citizens understand their status (the unstable workers learn they are "outside" the system).
  *   **Refinement:** You are describing a **Negative Interpretive Feedback Loop**. The policy generates data that interprets the excluded group as "unattachable," which reinforces the political coalition needed to maintain the eligibility gate.

  **B. Performativity (Michel Callon / Economic Sociology)**
  Callon argues that economic models and policies do not simply describe the world; they **perform** it. They bring into being the subjects they describe.
  *   **Refinement:** This is **Performative Eligibility**. The eligibility criterion does not find the "attached worker"; it *creates* the category of the "attached worker" by slicing the population. The data then confirms the reality the policy performed.

  **C. Suggested Terminology**
  If you wish to coin a term for this specific loop, consider:
  *   **Constitutive Exclusion:** Highlights that the exclusion *constitutes* the categories of success and failure.
  *   **Tautological Gatekeeping:** Emphasizes the self-justifying nature of the rule.
  *   **Endogenous Eligibility Bias:** Borrows from econometrics ("endogenous") to signal that the selection rule is internal to the system, not an external variable.

  ### 3. The Conceptual Work of the Distinction

  Distinguishing this from ordinary selection bias or the Matthew Effect does three crucial pieces of conceptual work in your analysis:

  **1. Ontological Shift (From Discovery to Production)**
  *   *Standard View:* The policy *discovers* two groups (those ready for work and those not).
  *   *Your View:* The policy *produces* two groups.
  *   *Work:* This shifts the blame from the **characteristics of the poor** (they lack attachment) to the **architecture of the state** (it requires attachment). It reveals that the "non-recipient" pool is not a natural category of people, but an administrative artifact.

  **2. Epistemological Critique (From Evidence to Artifact)**
  *   *Standard View:* The evaluation data is neutral evidence of policy effectiveness.
  *   *Your View:* The evaluation data is a **political artifact**.
  *   *Work:* This undermines the technocratic justification for the policy. If the "success" of the program is mathematically guaranteed by the exclusion rule, then outcome evaluations become circular reasoning. It exposes the "evidence-based policy" framework as vulnerable to design-induced tautologies.

  **3. Political Economy (From Path Dependence to Lock-In)**
  *   *Standard View:* The policy persists because it is popular or effective.
  *   *Your View:* The policy persists because it **manufactures its own legitimacy**.
  *   *Work:* This explains **policy lock-in**. It is hard to reform the policy because the data generated by the policy itself argues against reform. The "failure" of the excluded group is cited as proof that they need *more* screening, not less. This creates a self-sealing system immune to empirical critique.

  ### 4. Recommendation for Your Text

  You should feel confident using **"Institutional Tautology."** It is vivid and accurate. However, to ground it academically, I suggest framing it as a specific form of **Policy Feedback**.

  **Drafting Suggestion:**
  > "This dynamic represents more than simple selection bias or a Matthew Effect; it is a form of **constitutive exclusion**. Unlike selection bias, which is a methodological error, this is a structural feature where the eligibility gate manufactures the very population categories it claims to measure. Drawing on policy feedback theory, we can identify this as a **tautological feedback loop**: the policy excludes the vulnerable, generates data showing the vulnerable fare poorly, and then cites that data as justification for the exclusion. The rule does not merely filter the labor market; it performs a specific version of it, rendering the policy immune to critique by its own metrics."

  This framing allows you to claim the insight without needing to find a pre-existing label, while demonstrating that you understand where it sits in the broader theoretical landscape (feedback, performativity, and administrative burden).
