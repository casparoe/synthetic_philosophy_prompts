answer: |-
  ### Activity Design: "The Color of Coordination"

  **The Setup**
  Arrange the room into two distinct clusters of chairs, separated by a clear aisle. Group A gets 10 chairs; Group B gets 8 chairs. Hand every student a deck of 5 index cards (Red, Blue, Green, Yellow, Blank) and a pen. On the board, draw a tally sheet for "Round 1" through "Round 5."

  **The Narrative Arc**
  You are not explaining Lewis. You are running a tournament. The goal is to accumulate points. Points are recorded publicly. The only rule is **absolute silence** during the coordination phases. If anyone speaks, the round resets, and everyone loses a point.

  **Phase 1: Internal Convergence (Silent)**
  Group A and Group B are told they are competing teams. Within their group, they must agree on a single color to represent their team for the upcoming rounds. They have 5 minutes. They cannot speak. They can show cards, gesture, or stand in corners. They must all hold up the same color by the end.
  *   *Hidden Mechanic:* In Group B (the smaller group), 3 students receive a slip of paper upon entry: *"Your instruction: You must play GREEN every round. Do not tell anyone. Do not change, even if your team loses points."* The rest of Group B receives no special instruction.

  **Phase 2: The Clash (Coordination)**
  Students pair off (one from A, one from B). The 2 extra students from Group A sit out as "observers" (they get the average score of the round). Pairs hold up a color simultaneously.
  *   *Payoff:* If colors match, both get 1 point. If they mismatch, both get 0.
  *   *Dynamic:* Group A likely converges on one color (e.g., Red). Group B likely converges on another (e.g., Blue), but the 3 stubborn students will hold up Green. This causes Group B to fail internally or fail externally. When they pair with Group A, mismatches occur. They get 0 points.
  *   *Evolution:* Between rounds, groups can huddle (still silent) to change their color. The goal is to maximize points. The stubborn 3 in Group B will never switch. Group B must decide: do we force Group A to match our Green (via the stubborn minority)? Or do we switch to Red to match Group A, leaving the stubborn 3 as outliers?

  **Phase 3: The Temptation (Norms & Sanctions)**
  After a convention is established (e.g., everyone is playing Green), announce a rule change for the final two rounds.
  *   *New Payoff:* If you both play the Convention Color, you get 1 point. If you play a *different* color and your partner plays the Convention Color, you get 2 points (they get 0). If you both play different colors, 0 points.
  *   *Sanction:* If you get 0 points because your partner deviated, you may write a "Strike" on their personal scorecard. 2 Strikes eliminate all their points.
  *   *Dynamic:* Now, conforming is no longer just about expectations; it's about fear of punishment. The "convention" has shifted from a Lewisian coordination equilibrium to a norm enforced by sanctions.

  ---

  ### Activity Table

  | Phase | Minutes | What Participants Are Told and Doing | What They Should Run Into | Debrief Question | What Goes Wrong and The Fix |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Internal Convergence** | 15 | "Split into your groups. You have 5 mins to pick ONE color. No talking. If everyone holds the same color, you proceed. If not, you get 0 points for the round." | Group A will likely pick the most salient color (Red/Blue). Group B will fracture: the 5 normals try to agree, the 3 stubborn play Green. Group B may fail to unify internally. | "How did you agree without speaking? What made one color 'obvious' over the others?" | **Talking:** Students whisper. **Fix:** Immediate round reset + penalty point. <br> **Group B deadlock:** They take too long. **Fix:** Wave a "30 seconds" warning. |
  | **2. The Clash** | 20 | "Pair up with the other group. Reveal colors simultaneously. Match = 1 pt each. Mismatch = 0. You have 3 rounds. You can huddle between rounds to switch colors." | Mismatches initially. Group A (majority) expects Group B to switch. Group B normals want to switch to match A, but the 3 stubborn block them. Tension arises in Group B. | "Why did one group switch and not the other? Was it fairness, or just momentum?" | **Stubborns Out Themselves:** They laugh or signal. **Fix:** Warn that revealing instructions disqualifies their team. <br> **Group B Capitulates:** They switch immediately. **Fix:** Remind stubborn students of their instruction privately if they waver. |
  | **3. The Stabilization** | 10 | "Continue pairing. Same rules. Maximize points." | A convention solidifies. Either everyone plays Green (minority wins via stubbornness) or everyone plays Group A's color (majority wins). Expectations align: "I play X because I know you play X." | "At what point did you stop thinking 'what should we do?' and start thinking 'I know they will do X'?" | **Apathy:** Students stop caring about points. **Fix:** Announce the winning pair gets to choose the next reading topic or get a small privilege. |
  | **4. The Temptation** | 15 | "Rule Change: Deviating while the other conforms gets you 2 points. If you get screwed by a deviator, you can give them a Strike. 2 Strikes = Total Score Wipe." | The coordination equilibrium breaks. People deviate for gain. Partners retaliate with Strikes. The mood shifts from cooperation to policing. | "Why did the behavior change when the points changed? What is holding the pattern together now?" | **Gaming:** Students collude to swap deviations. **Fix:** Randomize partners every round so collusion is hard. <br> **Sanction Abuse:** Strikes given unfairly. **Fix:** Require the victim to show the mismatch card to the instructor to validate. |
  | **5. Debrief** | 15 | Sit in a circle. No cards. Open discussion mapping the game to Lewis. | Connect the silence to "tacit agreement," the stubborn 3 to "precedent," and the Strikes to "normative sanctions." | "When did this stop being a convention and start being a rule?" | **Silence:** Students are tired. **Fix:** You start by naming one concept (e.g., "Arbitrariness") and ask for a moment from the game that fits. |

  ---

  ### Five Limitations (What You Must Say Out Loud)

  The activity simulates the *logic* of convention, but it cannot simulate the *ecology* of real social norms. You must explicitly name these gaps in the debrief:

  1.  **Timescale and Evolution:** Real conventions (like driving on the right) evolve over generations through trial and error. This game compresses that into 20 minutes. Students didn't "inherit" the convention; they engineered it. Lewis argues conventions are often historical accidents that get locked in; here, they felt like conscious choices.
  2.  **Common Knowledge:** In the game, everyone knows it's a game about coordination. In real life, conventions work best when they are background noise—we don't think about them until they break. The "artificiality" of the seminar room makes the expectations too explicit compared to real social life.
  3.  **Exit Options:** In the game, students are trapped in the room. In reality, if a convention is too costly (e.g., a social norm in a club), people can leave the community. The "stickiness" of the convention here is partly due to the fact that they literally cannot leave.
  4.  **Stakes and Sanctions:** The "Strikes" in the final round are trivial. Real normative sanctions involve ostracization, legal trouble, or violence. The shift from "I conform because it's useful" to "I conform because I'm afraid" is much sharper in reality than writing a mark on an index card.
  5.  **Arbitrariness:** Lewis insists conventions must be arbitrary (there must be an alternative that *could* have worked). In the game, Red vs. Blue is arbitrary. But in reality, many "conventions" (like dress codes) are entangled with power dynamics or history, making them feel non-arbitrary to the people subjected to them. The game hides the power structures that usually determine which arbitrary solution gets picked.
