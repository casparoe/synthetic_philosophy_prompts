answer: |-
  You are absolutely right to be suspicious. Conclusion (6) ("All blame is always wrong") is moral nihilism, and if that were true, society (and your house) would collapse. No one could ever hold anyone accountable for anything.

  Your roommate has constructed a "slippery slope" argument that relies on blurring distinctions. Since you want to keep **Premise (1)** (the idea that hypocrisy undermines your standing), you have to cut the chain elsewhere.

  Here is the breakdown of where the argument fails, which step you should give up, and what it costs you.

  ### The Weakest Link: Premise (2)
  **(2) Any specific wrong you blame someone for counts as the same thing as any other wrong from the same motive.**

  This is the engine that makes the argument go. It claims that because you once didn't do the dishes (selfishness), you can't blame someone for lying (selfishness), because they are the "same thing."

  **Why you should give this up:**
  This premise conflates **vices** (like selfishness) with **violations** (like not doing the dishes).
  *   **The Philosophical Fix:** We need to distinguish between *tokens* (specific actions) and *types* (general categories). While both actions might stem from "selfishness," they violate different specific obligations.
  *   **The Logic:** If I lie to you, I violate an obligation of *truth*. If I don't do the dishes, I violate an obligation of *shared labor*. Even if the root motive is the same, the *wrong* is not the "same thing" in the way Premise (1) requires.

  **The Cost of Giving Up (2):**
  *   **You lose moral purity:** You have to admit that you don't need to be a saint to enforce a specific rule. You can be a flawed person who still expects others to follow the lease/agreement.
  *   **You accept nuance:** You have to do the work of distinguishing between different kinds of failures. You can't just say "we're all sinners"; you have to say "I might be lazy, but that doesn't make your lying okay."
  *   **Benefit:** This saves your house. It allows you to say: "Yes, I was selfish last week, and I own that. But that doesn't change the fact that the dishes are your responsibility this week."

  ### The Backup Link: Premise (5)
  **(5) Blame without standing is always wrong to throw at someone.**

  If you really want to keep (2) (maybe you agree that all selfishness is basically the same), you can instead attack (5). This premise claims that if you are a hypocrite, you are *morally forbidden* from speaking up.

  **Why you might give this up:**
  There is a difference between **Standing** (your right to speak) and **Truth** (the validity of the claim).
  *   **The Philosophical Fix:** A hypocrite might lack the *authority* to blame, but the blame itself might still be *correct* and *necessary*. If a smoker tells a child not to smoke, the smoker lacks standing (they are a hypocrite), but it is not *wrong* for them to try to stop the child. The value of the outcome outweighs the hypocrisy.
  *   **The Logic:** Blame serves a social function (coordination, safety, fairness). Sometimes, stopping a wrong is more important than the purity of the person pointing it out.

  **The Cost of Giving Up (5):**
  *   **You accept hypocrisy:** You have to be okay with the idea that sometimes flawed people have to enforce rules. It feels messy.
  *   **You invite pushback:** If you blame someone while admitting you lack standing, they can still say, "You're being annoying," even if they can't say "You're wrong."
  *   **Benefit:** It prevents paralysis. It allows the group to correct behavior even when everyone is imperfect.

  ### How to Keep Premise (1) Without the Disaster
  You said you really want to keep (1). You can, but you have to **narrow its scope**.

  **Current (1):** If you've done the **same thing**... you lack standing.
  **Revised (1):** If you've done the **same specific violation, recently, without acknowledgment**... you lack standing.

  If you modify (1) to require *specificity* rather than *general motive*, Premise (2) becomes false, and the argument collapses.

  **Example:**
  *   **Roommate:** "You can't blame me for the dishes! You were selfish last month!"
  *   **You:** "Premise (2) is false. My selfishness last month was about *time management*. Your selfishness now is about *communal hygiene*. They aren't the 'same thing.' I have standing to ask for clean dishes even if I'm not a perfect person."

  ### Summary: Which step to cut?
  **Cut Premise (2).**

  It is the most philosophically dubious step. It relies on a vague definition of "same thing" to turn human imperfection into a shield against accountability.

  **What it costs you:**
  It costs you the comfort of moral equivalence. You can no longer say, "We're all equally bad, so no one can say anything." Instead, you have to say, "We are all imperfect, but we still have specific agreements we need to honor."

  **How to reply in the group chat:**
  > "I think step (2) is the bug in the code. Just because two actions come from 'selfishness' doesn't make them the 'same thing' for the purpose of blame. If I speed on the highway, I don't lose the standing to ask you not to steal my car, even if both are 'selfish.' If we accept (2), we can't enforce any house rules ever. I'm willing to own my mistakes (keeping 1), but I'm not willing to say that makes all blame wrong (6)."
