answer: |-
  The name you are looking for is **Updateless Decision Theory (UDT)**, often discussed in tandem with **Functional Decision Theory (FDT)**.

  The "carving" you are asking for is the distinction between **act-based reasoning** (what should I do *now*, given what I know?) and **policy-based reasoning** (what output should my decision algorithm produce *in general*, evaluated from a prior state of ignorance?).

  Here is how this carving separates your target concept from its neighbors, and how it classifies your three cases.

  ### 1. The Name and The Core Distinction

  The specific intuition you described—"what rule would I have wanted to have chosen, from before I knew which of these situations I would land in?"—is the literal definition of **Updateless Decision Theory**.

  Standard decision theories (like Causal Decision Theory) are *updateful*. They say: "I have observed $X$. Given $X$, which act $A$ maximizes utility?"
  UDT says: "Before I observed $X$, which mapping from observations to acts ($S \to A$) would have maximized utility? I will execute that mapping now, even though, now that I have observed $X$, a different act looks locally superior."

  **Functional Decision Theory** is the mechanistic explanation for *why* this works. It posits that your decision is not a singular event, but the output of a mathematical function. Anywhere that function is run (in a predictor's simulation, in a twin's brain, in your own future), the output is logically linked. Therefore, you optimize the *function*, not the *instance*.

  ### 2. The Carving: How it differs from the neighbors

  You identified two neighbors: **Evidential Decision Theory (EDT)** and **Precommitment**. Here is how UDT/FDT carves itself out from them.

  **Vs. Evidential Decision Theory (EDT)**
  *   **EDT says:** "My choice is *evidence* about the world. I should choose the act that, if I observed myself doing it, would make me feel the best news about the outcome."
  *   **The Problem:** EDT still reasons from *inside* the situation. It updates on the fact that "I am choosing A." In some cases (like the "Smoking Lesion" problem), this leads to irrationality because it treats the choice as news rather than a cause.
  *   **UDT/FDT says:** "I do not treat my choice as evidence to update on. I treat my choice as the *determination* of the output of a logical function. I don't ask 'what does my choice tell me about the world?' I ask 'what world results from the logical output of my algorithm?'"
  *   **The Carving:** EDT is about *conditional probability* given an act. UDT is about *counterfactual consequence* of a policy.

  **Vs. Precommitment (Reputation)**
  *   **Precommitment says:** "I will bind myself visibly so others know I am constrained."
  *   **The Problem:** As you noted, this requires an audience. It fails in one-off, anonymous scenarios (like your third case) where no one sees the commitment.
  *   **UDT/FDT says:** "The commitment is not a physical signal; it is a logical fact. If I am the kind of agent who runs Algorithm $X$, then a predictor simulating me, or a twin running me, *necessarily* gets the output of Algorithm $X$. I don't need to *show* them I am bound; the logic binds us."
  *   **The Carving:** Precommitment is *causal/observable*. UDT is *logical/subjunctive*.

  ### 3. Verdict on Your Three Cases

  You suspected the second case might be a different animal and the third was the same animal pushed further. **Updateless Decision Theory argues that all three are the exact same animal.**

  Here is why:

  **Case 1: The Prediction (Newcomb's Problem)**
  *   **Verdict:** This is the canonical case for UDT/FDT.
  *   **Why:** The predictor modeled you. Your decision *now* and the prediction *then* are logically correlated outputs of the same underlying "you." Causal Decision Theory fails here because it says the money is already in the box. UDT succeeds because it recognizes that "the agent who one-boxes" is the same logical object as "the agent the predictor predicted would one-box."

  **Case 2: The Disposition (Parfit's Hitchhiker / Toxin Puzzle)**
  *   **Verdict:** This is the **same animal**, applied across time rather than across space.
  *   **Why:** You feel this is different because it involves "character" rather than "logic." But in UDT, your "character" is just your decision policy.
  *   In the specific moment where you are pushed, paying the cost looks locally irrational (Causal view). But if you evaluate from the "before" perspective (Updateless view), the policy "never be pushed" yields higher lifetime utility than "be pushable."
  *   Crucially, UDT explains why you don't need an audience. Even if no one *knows* you are unpushable, if the universe (or a predictor) operates on the logic of your type, being the type that resists pays off. It is not reputation; it is **Reflective Consistency**. You are cooperating with your past self who set the policy.

  **Case 3: The Twin (Twin Prisoner's Dilemma)**
  *   **Verdict:** This is the **purest form** of the animal.
  *   **Why:** You said, "that stranger's decision is my decision." This is the concept of **Subjunctive Dependence**.
  *   In Case 1, the correlation is physical (a simulation). In Case 2, it is temporal (your past/future self). In Case 3, it is purely logical (same algorithm, different inputs).
  *   CDT defects because it says "I can't change their choice." UDT cooperates because it says "We are running the same source code. If I output 'Cooperate', the logical fact of that output implies they output 'Cooperate'."
  *   This confirms your suspicion: Case 3 is not "pushed further"; it is the foundational logic that explains why Cases 1 and 2 work.

  ### Summary

  The repair you are describing is **Updateless Decision Theory**.

  *   **The Label:** Updateless Decision Theory (UDT) or Functional Decision Theory (FDT).
  *   **The Carving:** It rejects *act-optimization* (given current knowledge) in favor of *policy-optimization* (from a prior ignorance). It replaces *causal* and *evidential* links with *logical* links (subjunctive dependence).
  *   **The Scope:** It covers all three of your cases.
      *   Case 1 is logical correlation via **prediction**.
      *   Case 2 is logical correlation via **identity over time**.
      *   Case 3 is logical correlation via **algorithmic identity**.

  You are correct that this is distinct from precommitment (which is external) and EDT (which is internal but updateful). It is the internal, updateless recognition that your choice is a logical fact that holds true wherever your decision algorithm is instantiated.
