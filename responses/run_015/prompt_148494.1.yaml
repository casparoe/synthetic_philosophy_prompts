  The future self proposes steady work,
  When cost is low because the pain is distant.
  I swear to read when morning light returns,
  For tomorrow's effort weighs almost nothing.
  But now the clock aligns with pulse and breath,
  And study feels like swallowing a stone.
  The value drops as midnight draws too near,
  The logic bends when reward is standing here.
  It is not weakness making me refuse,
  But geometry I was not meant to choose.
       The graph turns sharp.
       Value dies.
       I click.
       Silence.

  ***

  **Note on the Model**
  This poem treats hyperbolic discounting as a literal geometric force that overrides rational choice, but in philosophical and psychological research, this is still debated. While the model explains many cases of temporal inconsistency (valuing a smaller-sooner reward over a larger-later one), it is not the undisputed cause of akrasia. Some scholars argue weakness of will stems from changes in belief or attention rather than a shift in preference structure. The poem simplifies the "math" for dramatic effect, presenting the present self's victory as inevitable rather than contingent.
