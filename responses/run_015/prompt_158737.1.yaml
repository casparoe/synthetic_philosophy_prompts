      Why? Because if they negotiate, they might split 50/50. Then the NBS shift isn't observed in *their* behavior, only in the theory.
      To "run into the problem", they need to see the rule *they are using* (or testing) break.
      Okay, I will design it as: "Apply the Nash Rule you learned last week to these two cases."
      This guarantees the shift. Then they critique it.
      But the prompt says "ideally they invent... themselves".
      If I tell them "Apply Nash", they won't invent KS.
      Okay, I'll go with the **Arbitrator Intuition** model.
      Round 1: What is fair? (Write it down).
      Round 2: What is fair? (Write it down).
      Math Student: Here is what Nash says.
      Comparison: Did Nash change? Did You change?
      If Nash changed (P2 lost) and You didn't, you have discovered the monotonicity intuition.
      This is reliable and allows invention.

