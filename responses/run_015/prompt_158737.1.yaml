answer: |-
  **Materials and setup**
  Print two handouts per pair: "Case A" (Triangle) and "Case B" (Triangle + Bolt-on). Provide graph paper, rulers, and calculators. Designate the maths-econ double major as the "Nash Auditor"—their job is to compute the product-maximising points live on the board. Prepare two currency types: chocolate squares (Player 1) and book vouchers/raffle tickets (Player 2). Do not announce an exchange rate. Seat students in pairs, assigning roles (P1 gets chocolate, P2 gets tickets). Collect decisions anonymously via slip of paper to prevent peer pressure. Ensure the projector can display the feasible sets clearly. You need a way to randomly select one pair's decision for actual payout to maintain stakes without bankrupting yourself.

  **The charts, with the arithmetic checked**
  **Case A:** Feasible set convex hull of (0,0), (20,0), (10,10). Disagreement at (0,0).
  *Pareto Frontier:* Line segment from (10,10) to (20,0). Equation: $y = 20 - x$.
  *Nash Product:* Maximize $x(20-x)$. Derivative $20-2x=0 \Rightarrow x=10$. Point: **(10,10)**. Product = 100.
  *Ideal Points:* P1=20, P2=10.

  **Case B:** Same as A, plus feasible option (18,4).
  *New Frontier:* Connects (20,0) to (18,4) to (10,10).
  *Segment 1 (20,0 to 18,4):* $y = -2x + 40$. Max product on this segment is at boundary (18,4) = 72.
  *Segment 2 (18,4 to 10,10):* Slope $-0.75$. Equation $y = -0.75x + 17.5$.
  *Nash Product:* Maximize $x(-0.75x + 17.5)$. Derivative $-1.5x + 17.5 = 0 \Rightarrow x \approx 11.67$.
  $y = 8.75$. Point: **(11.67, 8.75)**. Product ≈ 102.
  *Result:* P1 gains 1.67 units; P2 **loses 1.25 units**. Ideal points remain (20,10). The "irrelevant" option hurts P2 under Nash.

  **Minute-by-minute**
  **00–10: Setup.** Explain roles and currencies. Emphasize: "You are arbitrators deciding a fair split for a pair who cannot agree." Remind them of last week's Nash Rule (maximize product) but ask them to set it aside for Round 1.
  **10–25: Round 1 (Intuition).** Display Case A. Pairs propose a split they deem fair. Collect slips. The Nash Auditor calculates the Nash point (10,10) on the board. Compare class median to Nash. (Likely close).
  **25–40: Round 2 (The Trap).** Display Case B. Explain: "A new option appeared, but nobody's maximum possible payoff changed." Pairs propose a fair split. Collect slips. The Nash Auditor calculates the new Nash point (11.67, 8.75).
  **40–55: The Reveal.** Project both Nash outcomes side-by-side. Ask Player 2s: "Under the rule you learned last week, you just lost chocolate because Player 1 got a new option they didn't even take. Is this fair?" Expect uproar. Ask: "What rule would prevent this?" Guide them toward: "Keep the ratio of gains relative to the ideal point constant."
  **55–70: The Mirror.** Display Case C (Truncated Triangle). Show that if we remove P1's utopian max, the "Ratio Rule" (KS) shifts the split against P1, even if the original split was feasible. Nash stays put.
  **70–80: Closing.** Name the rules (Nash vs. Kalai-Smorodinsky). Distribute payouts based on one randomly selected pair's Round 2 decision.

  **Where the idea bites**
  The tension lands at minute 40. Students intuitively feel that expanding the set for P1 shouldn't hurt P2 if P2's ceiling hasn't moved. This is *Individual Monotonicity*. When the Nash Auditor reveals P2's loss, the abstract axiom becomes a concrete grievance. The "different currencies" constraint prevents them from defaulting to "split the total value 50/50," forcing them to look at the geometry. When they propose the "fraction of ideal point" fix, they are reconstructing the KS solution axiomatically. The maths-econ student is crucial here: by outsourcing the calculation, you prevent the "but can we actually find the point?" distraction and focus entirely on "should we accept this point?" The activity bites because it separates *efficiency* (Nash) from *fairness stability* (KS).

  **Debrief**
  Conclude by validating both rules. Nash satisfies *Independence of Irrelevant Alternatives (IIA)*: if the solution is feasible in a smaller set, it remains the solution. KS violates this. Use the Case C example: if P1's ideal point drops from 20 to 18 (removing a utopian option), KS reduces P1's share even if the original (10,10) split is still possible. Nash keeps (10,10). Ask: "Is it fair to punish P1 for losing an option they never would have chosen?" This prevents the session from ending with KS as the hero. The philosophical takeaway is that "Fair Division" isn't about finding the true rule, but choosing which axiom you are willing to violate. Nash sacrifices monotonicity for consistency; KS sacrifices consistency for monotonicity. Assign a short reflection: "Which violation is less objectionable in a political context?"

  **What will go wrong the first time**
  Free negotiation is too noisy for axiomatic testing; students often split 50/50 regardless of the chart. That is why this design uses an **Arbitrator** model. However, risks remain. The maths-econ student might calculate too fast, spoiling the tension—brief them to wait for the cue. Students may fixate on the currency values ("Is a ticket worth more than chocolate?"); reiterate that no exchange rate exists. The "Mirror" example (Case C) is mathematically denser; if time runs short, skip the calculation and describe the result verbally. Finally, ensure the "irrelevant" option in Case B is clearly visible as never chosen; if students think P1 might take (18,4), the intuition fails.

  **What the activity can't do**
  This session cannot prove one solution is objectively correct. It demonstrates trade-offs between axioms, not truth. It also cannot simulate real-world power dynamics; the "disagreement point" is fixed at zero, ignoring external threats or history. It treats the feasible set as common knowledge, which is rarely true in politics.
