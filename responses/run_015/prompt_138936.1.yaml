  **Type A: The Conflict (Packets 1, 2, 3)**
  *   **The Object:** On a White Card, write this 4-line poem in Black Ink (centered):
      > *Silence falls on heavy wings,*
      > *Echoes hide what silence brings,*
      > *Listen close to what it sings,*
      > *Truth is in the offering.*
  *   **The Outer Message (Key 1):** On a Blue Card, write: *"Read the first letter of each line."* (Decodes to **S E L T** -> "SELT"? No, let's fix the poem).
      *   *Correction for Prep:* Rewrite the poem so the acrostics work.
      *   **Revised Poem:**
          > *H ide the truth in plain sight,*
          > *E very shadow holds the light,*
          > *L ook beneath the words we write,*
          > *P atience makes the wrong turn right.*
          > **(First letters: H E L P)**
          > **(Last letters: E T E T -> "ETET"? No. Let's try Last Letters: H T E T. No.)**
      *   *Final Revised Poem (Tested):*
          > **H**ere the secret line**s** end,
          > **E**very word will bend and men**d**,
          > **L**isten to the voice of friends,
          > **P**ut the broken back agai**n**.
          > **(First Letters: H E L P)**
          > **(Last Letters: S D S N -> "SIDS N"? No.)**
      *   *Okay, let's make it simpler.*
          > **H**old the line.
          > **E**nd the war.
          > **L**ock the door.
          > **P**eace no more.
          > **(First: HELP)**.
          > **(Last: E R R E -> "ERRE" (Error in Latin? Or just nonsense)).**
      *   *Better:* Make *both* fluent.
          > **H**e **s**aw **t**he **m**an.
          > **E**at **o**ld **h**am.
          > **L**et **u**s **g**o.
          > **P**ay **m**e **n**ow.
          > **(First: HELP). (Last: M A O W -> "MEOW").**
      *   **Action:** Write this 4-line text on 3 White Cards.
      *   **The Keys:**
          *   Make 3 Blue Cards: *"Read the first letter of each line."*
          *   Make 3 Red Cards: *"Read the last letter of each line."*
      *   **Assembly:** Put 1 White Card in each of the 3 envelopes. Put a Blue Key in Packets 1 & 2. Put a Red Key in Packet 3. (This ensures disagreement when they compare).

  **Type B: The Loop (Packets 4, 5)**
  *   **Concept:** The Inner Message of Card 1 is the Outer Message for Card 2.
  *   **Card 1 (White):** Write in Cipher (Caesar Shift +1): *"UIF LJT JT 5"* (Decodes: "THE KEY IS 5").
      *   **Frame:** Draw **5 small dots** in the border corners.
  *   **Card 2 (White):** Write in Cipher (Caesar Shift +5): *"RZQJW"* (Decodes: "POWER").
      *   **Frame:** Write *"Use the number from Card 1"* in plain text.
  *   **Assembly:** Put Card 1 and Card 2 in Packets 4 & 5.
  *   **Note:** To solve Card 1, they must notice the Frame (5 dots) and guess it's a shift key. Decoding Card 1 gives them the key ("5") for Card 2. Decoding Card 2 gives the "Inner Message" ("POWER").
  *   **Wait, I need the loop:** The prompt asks for the Inner Message of one to be the Outer of the other, ideally looping.
  *   **Revised Loop for Packets 4 & 5:**
      *   **Card A:** Cipher Text (Shift +3). Frame: *"Key is on Card B"*.
      *   **Card B:** Plain Text: *"Key for Card A is 3"*. Cipher Text (Shift +3). Frame: *"Key is on Card A"*.
      *   **Card A Decoded:** *"START NOW"*.
      *   **Card B Decoded:** *"STOP HERE"*.
      *   **The Catch:** Card A's Frame says "Key on B". Card B's Frame says "Key on A". They are stuck unless they notice Card B has *one* plain text sentence ("Key for Card A is 3"). That sentence is Card B's Inner Message, but acts as Card A's Outer Message.
      *   **Prep:** Create 2 sets of Card A/Card B.

  **Type C: The Void (Packets 6, 7)**
  *   **The Object:** A White Card with a random arrangement of 20 symbols (e.g., ▲ ■ ● ▲ ■).
  *   **The Key:** A Blue Card that says: *"Translate using the Rosetta Stone on the Projector."* (You will **not** put anything on the projector).
  *   **Assembly:** Put Card and Key in Packets 6 & 7.
  *   **Goal:** They have an Outer Message that references a non-existent Frame. They cannot produce an Inner Message.

  ---

  ## 2. Session Timeline (75 Minutes)

  **00:00 – 00:05: Distribution & Silence**
  *   Hand out the envelopes. One per pair.
  *   **Rule:** "Do not open until I say. Do not talk to other pairs. You have 15 minutes to extract the Message. Write it on the back of the card."
  *   **Instructor Role:** Sit at the back. Do not answer questions. If asked "Is this right?", say "Is it fluent?"

  **00:05 – 00:20: Phase 1 (Decoding)**
  *   Pairs work.
  *   **Type A (Packets 1-3):** Pairs 1 & 2 will find "HELP". Pair 3 will find "MEOW".
  *   **Type B (Packets 4-5):** They will struggle with the circular Frame instructions until they spot the plain text seed on Card B.
  *   **Type C (Packets 6-7):** They will stare at symbols. They may invent a key.

  **00:20 – 00:35: Phase 2 (The Collision)**
  *   **Instruction:** "Swap your Key Card (Blue/Red) with a different pair. Keep your Object Card (White). Try to decode again."
  *   **What happens:**
      *   Pair 1 (Object: Poem, Old Key: First Letter) gets Pair 3's Key (Last Letter). They now get "MEOW".
      *   Pair 3 gets "HELP".
      *   **Crucial Moment:** They realize the *Object* didn't change, but the *Message* did.
      *   Type C pairs might get a Key from Type A. They will try to apply "Read first letter" to symbols. It will fail.

  **00:35 – 00:55: Phase 3 (The Loop & The Void)**
  *   Ask Type B pairs to explain their solution to the room. (They have to explain how Card B's content unlocked Card A).
  *   Ask Type C pairs: "Did you have a message?"
      *   Some will say "No."
      *   Some will say "Yes, it's chaos." (This is a valid Inner Message if their Outer Message was "Describe what you see").
  *   **Instructor Intervention:** If Type B is stuck, write "3" on the board. Erase it immediately. Watch if they use it.

  **00:55 – 01:05: Group Discussion (No Jargon Yet)**
  *   Ask: "Where was the message? On the paper? In the key? In your head?"
  *   Ask Pair 1 & 3: "You had the same paper. One of you is wrong. Which one? How do you know?"
  *   Ask Type C: "If I told you the symbols were a map of this room, would that become true?"

  **01:05 – 01:15: The Map (GEB Terms)**
  *   Put the three words on the board: **Frame, Outer, Inner.**
  *   Map the activity:
      *   **Frame:** The envelope, the card stock, the dots on the border. ("I am a thing to be read").
      *   **Outer:** The Key Card ("Read first letter", "Shift 3").
      *   **Inner:** "HELP", "MEOW", "POWER".
  *   **The Point:** The Inner Message does not exist without the Outer. The Outer is useless without the Frame.
  *   **The "Weird Part":** Pair 1 and Pair 3 both had fluent Inner Messages. Neither was "true" intrinsically. Meaning is a *relationship*, not a *substance*.

  ---

  ## 3. Debrief Script: Mapping the Moments

  **Moment 1: The Conflict (Pairs 1 vs 3)**
  *   *Observation:* Pair 1 says "It says HELP." Pair 3 says "It says MEOW."
  *   *GEB Map:* They share the **Frame** (the poem card) and the **Object**, but have different **Outer Messages** (Keys).
  *   *Lesson:* The Inner Message is not *in* the ink. It is a function of Object + Outer. If you change the Outer, you change the Inner, even if the Object is static.

  **Moment 2: The Loop (Pairs 4 & 5)**
  *   *Observation:* They couldn't start until they found the plain text seed on Card B.
  *   *GEB Map:* Card B's **Inner Message** ("Key is 3") became Card A's **Outer Message**.
  *   *Lesson:* Levels are relative. What is "content" at one level is "instruction" at the next. This is how DNA works (genes are data *and* machinery).

  **Moment 3: The Void (Pairs 6 & 7)**
  *   *Observation:* One pair says "No message." The other says "It's a map."
  *   *GEB Map:* They have a **Frame** (symbols) but no valid **Outer Message** (the projector key was missing).
  *   *Lesson:* Without an Outer Message, the Frame is just noise. *However*, if a receiver *invents* an Outer Message ("It's a map"), they generate an Inner Message. This is pareidolia (seeing faces in clouds).

  ---

  ## 4. Predictable Failures & Fixes

  **Failure 1: The "Back of the Card" Cheat**
  *   *Risk:* A pair writes the plaintext on the back during prep or during the session to bypass the cipher.
  *   *Fix:* During Phase 2 (Swap), force them to swap the *Object* card too. If the answer is on the back, the new pair will see it doesn't match the new Key.
  *   *Instructor Move:* "If your Key and your Message don't match, you have the wrong Key, not the wrong Message."

  **Failure 2: The "Sender" Fallacy**
  *   *Risk:* Students argue "But *you* wrote the poem, so 'HELP' is the *real* message."
  *   *Fix:* Acknowledge this. "Yes, I am the Sender. But in nature (DNA, brains), there is no Sender. There is only the Object and the Receiver. If the Receiver uses the wrong Key, the 'True' message is lost forever."
  *   *Why this matters:* This is the core AI/Mind question. Is meaning determined by the programmer (Sender) or the network (Receiver)?

  **Failure 3: Type B Gets Stuck**
  *   *Risk:* The Loop is too hard, they disengage.
  *   *Fix:* Have a "Hint Envelope" on your desk. If they ask for help, give them a slip that says: *"Look at the borders. Count the dots."*
  *   *Philosophical cover:* "In the real world, sometimes the Frame whispers the Key."

  ---

  ## 5. Limitations: What the Objects Can't Carry

  You asked for honesty about where this exercise fails. There are two things physical cards cannot simulate, which you must speak to in the final 5 minutes.

  **1. The "Receiver" Problem**
  *   *The Gap:* In this room, the "Receiver" is a human undergrad with a brain pre-loaded with English and cipher logic. The cards don't show the work the *brain* is doing.
  *   *What to say:* "We treated the Key as a physical card. But in your mind, the Key is *neural structure*. You didn't need a card to tell you how to read English. That means *you* are carrying the Outer Message inside you. When you read a book, the 'Outer Message' is invisible. That's why it feels like meaning is in the ink. It isn't. It's in the fit between the ink and your brain."

  **2. The "Truth" Problem**
  *   *The Gap:* In the exercise, "HELP" feels more meaningful than "MEOW" because it's an imperative. But logically, they are equal.
  *   *What to say:* "GEB wants us to see that 'Truth' is a level *above* Inner Message. You can have a perfectly decoded Inner Message that is a lie. We didn't test for truth today. We only tested for *decodability*. AI can decode without understanding truth. That is the danger."

  ## 6. Instructor Cheat Sheet (For your pocket)

  *   **If they finish too early:** Ask Type A pairs to swap Keys *again*. Ask them to write a new Key that makes the poem say "WAR".
  *   **If they get cynical:** "This feels like a game." -> "Good. Hofstadter's point is that 'Meaning' feels like magic, but it's just mechanics. We're exposing the mechanics."
  *   **The Golden Question:** If the room is quiet at the end, ask: "If I burn the card, does the message die? If I forget the key, does the message die?" (Answer: Both. Message = Card + Key + Mind).

  This plan keeps your hands off the lecture until the end, forces them to physically manipulate the "levels," and creates the specific "fluent nonsense" and "recursive key" moments you requested within a tight prep window.
