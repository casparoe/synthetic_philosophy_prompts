  Here is a complete plan for your session. It is designed to be low-tech, high-friction (in the philosophical sense), and strictly bounded by your prep time and materials.

  # Session Title: The Archive of Lost Keys

  ## 1. Materials & Prep (Max 3 Hours)
  You need to construct **7 Packets** (one per pair). Each packet is a manila envelope containing index cards.

  **Materials:**
  *   7 Envelopes.
  *   28 Index Cards (4 per packet).
  *   Black, Red, and Blue fine-tip pens.
  *   Ruler, Scissors.
  *   Projector (for the final 10 mins only).

