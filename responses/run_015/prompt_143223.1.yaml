  # Terms of Reference: Specification of the Equalisandum

  **To:** The Currency Board
  **From:** Design Committee
  **Subject:** Desiderata for the Public Metric of Advantage

  The following desiderata define the necessary conditions for any candidate currency of egalitarian justice (the "Equalisandum"). Any proposed metric must be capable of generating a single, comparable figure for every citizen to guide redistributive transfers.

  ### I. Substantive Cases (The Metric must yield intuitive verdicts)

  1.  **The Expensive Tastes Case:** The metric must not award higher compensation to an individual who has voluntarily cultivated expensive preferences (e.g., a taste for champagne) compared to one with modest preferences, holding resources constant.
      *   *Consideration:* Responsibility for preference formation; preventing moral hazard.
      *   *Status:* Preference of one camp (Luck Egalitarianism).
  2.  **The Trained-Down Tastes Case:** The metric must identify disadvantage in an individual who has adapted their preferences downward to cope with deprivation (e.g., the "happy slave" or chronically impoverished), even if self-reported welfare is high.
      *   *Consideration:* Adaptive preferences mask objective deprivation.
      *   *Status:* Non-negotiable.
  3.  **The Differential Needs Case:** The metric must account for conversion factors, such that two individuals with identical resources but different physical conditions (e.g., one requiring double the medication for the same relief) are not treated as equally well-off.
      *   *Consideration:* Resource fetishism ignores human diversity.
      *   *Status:* Non-negotiable.
  4.  **The Timing Case:** The metric must treat a deficit occurring late in life as comparable to, or worse than, one occurring early, without discounting the later deficit merely due to its timing.
      *   *Consideration:* Intertemporal neutrality; avoiding age discrimination.
      *   *Status:* Preference of one camp (Lifetime Egalitarianism).
  5.  **The Aggregation Case:** The metric must capture chronic, low-level disadvantage across a whole life that does not appear as acute deprivation in any single annual snapshot.
      *   *Consideration:* Persistence of disadvantage vs. temporary shocks.
      *   *Status:* Non-negotiable.

  ### II. Conceptual Distinctions (The Metric must not collapse these categories)

  6.  **Circumstance vs. Choice:** The metric must distinguish between disadvantages arising from brute luck (circumstance) and those arising from voluntary gambles (choice).
      *   *Consideration:* Moral arbitrariness of birth vs. agency.
      *   *Status:* Preference of one camp (Luck Egalitarianism).
  7.  **Claim vs. Size of Claim:** The metric must distinguish between *that* a person has a claim to assistance and *how much* assistance they require to reach the threshold.
      *   *Consideration:* Sufficiency vs. Equality.
      *   *Status:* Preference of one camp (Prioritarianism).
  8.  **Shares vs. Worst-Off:** The metric must allow differentiation between equalizing shares across the board and specifically improving the position of the worst-off.
      *   *Consideration:* Strict equality vs. Maximin.
      *   *Status:* Preference of one camp.
  9.  **Assessment vs. Aggregation:** The metric must function as a measure of one person's situation without presupposing a specific social welfare function for aggregating across persons.
      *   *Consideration:* Separateness of persons.
      *   *Status:* Non-negotiable.

  ### III. Constraints & Results (The Metric must not contradict these)

  10. **The Levelling-Down Objection:** The metric must not imply that a situation is "more equal" (and thus better in the relevant egalitarian sense) if it makes some worse off without making anyone better off.
      *   *Consideration:* Equality must be valuable for someone's sake.
      *   *Status:* Non-negotiable.
  11. **Reasonable Pluralism:** The metric must not presuppose a single comprehensive doctrine of what makes a life go well (e.g., religious, hedonic, or perfectionist).
      *   *Consideration:* Liberal neutrality (Rawls).
      *   *Status:* Non-negotiable.
  12. **Administrative Feasibility:** The metric must be auditable, appealable, and defensible without intrusive inquiry into people's inner lives, subjective states, or private intentions.
      *   *Consideration:* Privacy, cost, and state overreach.
      *   *Status:* Non-negotiable.
  13. **Non-Reactivity (User Requirement):** The metric must not reverse its own verdicts merely because people learn the figure and adapt their behavior to optimize the score rather than their actual well-being.
      *   *Consideration:* Immunity to Goodhart's Law; stability of truth conditions.
      *   *Status:* Non-negotiable.

  ***

  ### Analysis of Incompatibility

  **The Impossible Subset**
  The following three desiderata cannot be jointly satisfied in a single operational metric:
  1.  **Administrative Feasibility** (No intrusive inquiry into inner lives).
  2.  **Sensitivity to Differential Needs** (Accounting for conversion factors like medical conditions).
  3.  **Non-Reactivity Under Publication** (Immunity to gaming/adaptation).

  *Reasoning:* To satisfy **Administrative Feasibility**, the Board must rely on objective, observable proxies (e.g., income, asset holdings). However, objective proxies fail **Sensitivity to Differential Needs** because they cannot capture the subjective or medical conversion factors required to turn resources into functionings (e.g., a paralyzed person needs more income for mobility than an able-bodied person). To capture Needs, the Board must collect medical or subjective data. Once this data collection is published as the basis for transfers, it violates **Non-Reactivity**: citizens will have an incentive to exaggerate needs or alter behavior to maximize the score (e.g., avoiding rehabilitation to maintain disability status), rendering the figure a measure of gaming ability rather than disadvantage. You can have objective data (Feasible, Non-Reactive) that ignores Needs, or subjective data (Sensitive to Needs) that is either Intrusive or Reactive.

  **The Single Most Exclusionary Requirement**
  **Administrative Feasibility (No Intrusive Inquiry).**
  This requirement excludes the largest number of candidate currencies. It immediately disqualifies **Welfarist** views (which require access to subjective mental states/utility) and most **Capability** views (which require detailed assessment of functionings and conversion factors). It leaves only **Resourcist** views (income, wealth, primary goods) as viable candidates. However, as noted in the Impossible Subset, Resourcism then fails the *Sensitivity to Differential Needs* requirement. Thus, this single requirement forces the Board to choose a currency that is measurable but morally incomplete.

  ***

  ### Scoring Candidate Currencies

  | Desideratum | Welfarist (Utility) | Resourcist (Primary Goods) | Capability (Functionings) |
  | :--- | :---: | :---: | :---: |
  | **Expensive Tastes** | ❌ (Compensates) | ⚠️ (Neutral) | ✅ (Can adjust) |
  | **Trained-Down Tastes** | ❌ (Misses) | ✅ (Objective) | ✅ (Objective) |
  | **Differential Needs** | ✅ (Subjective) | ❌ (Ignores) | ✅ (Central) |
  | **Circumstance vs. Choice** | ⚠️ (Hard to measure) | ⚠️ (Hard to measure) | ⚠️ (Hard to measure) |
  | **Levelling-Down** | ⚠️ (Depends on form) | ✅ (Usually avoids) | ✅ (Usually avoids) |
  | **Reasonable Pluralism** | ❌ (Imposes hedonic) | ✅ (Neutral means) | ⚠️ (Paternalistic risk) |
  | **Admin Feasibility** | ❌ (Intrusive) | ✅ (Observable) | ❌ (Complex/Intrusive) |
  | **Non-Reactivity** | ❌ (Hedonic adaptation) | ✅ (Stable) | ❌ (Gaming functionings) |
  | **Single Figure** | ✅ (Utils) | ✅ (Index) | ❌ (Incommensurable) |

  *Key: ✅ Satisfies | ⚠️ Partial/Problematic | ❌ Fails*

  ***

  ### Bottom Line

  The Board faces a trilemma where measuring need accurately requires intrusive or gamable data, while measurable data ignores need, meaning a single public figure cannot be simultaneously honest, private, and just.

  Verdict: No single currency can satisfy the non-negotiable constraints of administrative feasibility, differential needs, and non-reactivity without collapsing into a proxy that measures compliance rather than disadvantage.
