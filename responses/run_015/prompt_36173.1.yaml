answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee
  **FROM:** [Your Name], Employee Representative
  **DATE:** October 10, 2023
  **SUBJECT:** Recommendation Regarding Ministry of Defence Cyber Reserve Pilot

  **Executive Summary**

  We must decide by the 14th whether to enroll in the Ministry of Defence Cyber Reserve Corps pilot. After reviewing the terms and consulting with staff, I recommend we **decline participation and pay the defense levy**.

  While the tax credits and security advisories are valuable, the contract's "nomination clause" creates an unacceptable ethical risk for our workforce. Paying the levy allows us to contribute to national defense without compromising the voluntary nature of our employees' labor or our company's culture.

  **The Nomination Clause and Employer Authority**

  The central issue is the clause permitting the company to "nominate" employees to fill service quotas if volunteers fall short. Even with a twelve-month notice period, this provision effectively grants the company the power to conscript staff into state service.

  We must be clear about what this implies. In a free labor market, employees sell specific skills for agreed-upon compensation. They do not sell their political agency or their bodily autonomy to an employer. When a company accepts the power to nominate staff for military-style service, it becomes an intermediary between the state and the citizen's body. This is **conscription by proxy**: the state avoids the political cost of drafting individuals directly by authorizing employers to draw from a personnel pool without ever asking those individuals directly.

  Even if we promise internally never to use this clause, signing the contract legitimizes the principle that an employer owns a reserve claim on an employee's civic life. If we join, we set a precedent that labor contracts can include hidden obligations to state force. As an employee representative, I cannot endorse a framework where job security is subtly linked to willingness to perform state service.

  **Fairness Across the Workforce**

  This issue is compounded by our demographic makeup. Roughly forty percent of our engineering staff are international hires. These colleagues chose this country for its stability and economic opportunity, not for its defense obligations. In our national tradition, universal conscription applies to citizens and permanent residents, acknowledging a reciprocal bond between the state and the protected.

  Extending this obligation to temporary residents via a corporate quota violates the implicit terms of their employment and migration. It asks them to defend a polity in which they have no vote and toward which they owe no military duty. Furthermore, among our citizen staff, many hold pacifist views compatible with our nation's neutral status. The contract's conscientious-objector clause is insufficient because only the company may invoke it, and doing so penalizes the firm financially. This places the company in the position of judging the sincerity of an employee's moral convictions against a balance sheet.

  **Engaging the Civic Obligation Argument**

  I know several colleagues strongly favor joining the pilot. Their argument is grounded in a serious ethical claim: that defense is a civic obligation that should be spread across everyone rather than bought as a service from specialists. They argue that a company enjoying the protection of a neutral state owes person-hours, not just money, and that relying on professional security firms creates a caste of defenders while the rest of society remains passive.

  This view is honorable. It recognizes that neutrality is not free and that civic health requires shared sacrifice. If every citizen and corporation contributed labor, the burden would be distributed more evenly than a system where some serve and others pay to opt out.

  However, this argument conflates the duties of citizens with the duties of corporations. A company is a legal fiction; it cannot stand watch or write code for defense in its own right. Only humans can do that. When a company pledges "person-days," it is pledging the time of specific humans. If those humans have not voluntarily enlisted, the company is effectively leasing their civic duty to the state. While the intent is shared sacrifice, the mechanism creates coerced sacrifice. We can respect the desire to serve the common good without accepting a mechanism that bypasses individual consent. Paying the levy is still a contribution to the common defense; it simply acknowledges that in a specialized economy, financial support is a valid form of civic participation when direct service is not feasible or voluntary.

  **Efficiency and National Security**

  Finally, we should consider the effectiveness of the pilot itself. A third group of colleagues argues that the state should either draft fairly or hire professionals, and that a hybrid pilot is unfair. There is merit to this. Cyber defense requires high proficiency and continuous engagement. A reserve model relying on part-time volunteers—or nominally willing employees—may lack the readiness of professional units funded by the levy.

  If we decline and pay the levy, our funds contribute directly to hiring full-time specialists. This may ultimately serve the national interest better than providing thirty employees for thirty days of fragmented service. It allows our staff to focus on the civilian infrastructure they already support, which is itself critical to national resilience, while funding professionals to handle active defense.

  **Conclusion**

  The choice before us is not between serving our country and ignoring it. It is between serving through coerced labor or through financial contribution.

  I recommend we decline the pilot and pay the levy. This path protects our employees from being treated as a reserve asset they never agreed to be. It respects the status of our international staff. It avoids placing the company in the role of moral arbiter regarding conscientious objection. And it allows us to contribute to national security in a way that is consistent with our values as a civilian firm.

  We should communicate this decision to the Ministry clearly: we are willing to support national defense financially, but we cannot contract away our employees' right to choose their own civic obligations.

  **Recommendation:** Vote to **Decline** participation in the Cyber Reserve Corps pilot and budget for the associated defense levy.
