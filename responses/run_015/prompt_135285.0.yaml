      *   **Premise (2) Error:** Treating a conditional (especially an indicative or probabilistic conditional) as a standard proposition in the Boolean algebra upon which one conditions is controversial (Lewis's Triviality Results). If you treat "If A then B" as a proposition $A \to B$, conditioning on it ($P(\cdot | A \to B)$) often yields counterintuitive results compared to Jeffrey Conditioning or Infomin methods.
