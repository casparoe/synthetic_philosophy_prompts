answer: |-
  This is a classic case of "requirements drift" disguised as a technical guarantee. Your engineering intuition is correct: in policy, "nobody is made worse off" is often used as a marketing claim that borrows the logical rigor of a mathematical definition (Pareto Improvement) without satisfying its constraints.

  Here is the disambiguation of the slogan along your axes, classified by whether the claim is trivial, substantive, or false in the context of a carbon fee-and-dividend.

  ### 1. The Axes of Ambiguity

  | Axis | Interpretation A | Interpretation B | Classification |
  | :--- | :--- | :--- | :--- |
  | **Ex Ante vs. Ex Post** | **Ex Post:** After the policy runs, every single individual has higher utility/income. | **Ex Ante:** Before the policy runs, the *expected value* of every individual's outcome is higher. | **A is False.** In any complex economy, someone will lose (e.g., someone who loses their job in the fossil sector, or a rural household with high heating needs).<br>**B is Substantive.** This is defensible *if* the dividend exceeds expected costs for every decile. |
  | **Welfare Measure** | **Nominal Income:** Net dollars in pocket. | **Utility:** Subjective well-being, accounting for marginal utility of money. | **A is Substantive.** Easy to model, but ignores that $100 means more to a poor person.<br>**B is Substantive.** Harder to measure. If the policy increases volatility (price uncertainty), utility might drop even if income rises. |
  | **Policy Scope** | **Fee Only:** The tax mechanism in isolation. | **Fee + Dividend:** The tax plus the redistribution mechanism. | **Fee Only is False.** Obviously, a tax makes people worse off financially.<br>**Package is Trivial.** The slogan *must* refer to the package, but this hides whether the dividend *actually* compensates the specific losers. |
  | **Actual vs. Potential** | **Actual Compensation:** Losers are actually paid by winners (via the dividend). | **Potential Compensation (Kaldor-Hicks):** Winners *could* pay losers, but don't necessarily have to. | **Actual is Substantive.** This is the promise of the dividend.<br>**Potential is False.** If she claims "Pareto," she claims Actual. If she relies on "net benefit," she has slid to Kaldor-Hicks. |
  | **Model Robustness** | **Point Estimate:** True under the central forecast (the "happy path"). | **Robust ("Safe"):** True across the confidence interval (worst-case plausible config). | **Point Estimate is Substantive.** It relies on specific elasticity assumptions.<br>**Robust is False.** It is virtually impossible to guarantee no one loses under *all* plausible economic models. |
  | **Who Counts** | **Current Voters:** People alive today. | **All Affected:** Includes future generations and non-citizens. | **Current is Substantive.** Makes the math easier.<br>**All is Substantive.** Climate benefits accrue mostly here; economic costs accrue mostly now. |

  ### 2. The Commitment: What Your Friend Meant

  When your friend said, "It's a Pareto improvement — nobody is made worse off," and then retreated to, "Well, in expectation, everyone is better off," she committed a specific equivocation.

  **She meant:** *Under our central economic model (Point Estimate), the average household in every income quintile (Ex Ante, Nominal Income) will receive more in dividend checks than they will pay in increased prices (Package), so the Expected Value is positive.*

  **She did not mean:** *In the actual deployment (Ex Post), under varied economic conditions (Robustness), every single individual (including edge cases like rural homeowners or fossil fuel workers) will end up with higher utility.*

  ### 3. The Verdict: Does the Slogan Support the Dismissal?

  **No.** The dismissive move ("so what's the objection?") is not supported by the reading she actually meant. It only works if you slide between the definitions.

  Here is the engineering translation of why her logic fails:

  1.  **The "Benchmark Suite" Problem (Model Robustness):**
      She ran the benchmark on the "happy path" configuration (central economic forecast). In engineering, if a test passes on the default config but fails when you increase latency or drop packets, you don't ship it.
      *   *The Objection:* The objector was pointing out a "config" where the test fails: low-income households often have less ability to adapt (e.g., they can't buy a new efficient car or insulate their home). If energy prices spike higher than the model predicts, or if the dividend is delayed, they are "worse off" in the real deployment.
      *   *The Slip:* She treated the central forecast as a guarantee.

  2.  **The "Average Latency" Problem (Ex Ante vs. Ex Post):**
      Saying "in expectation, everyone is better off" is like saying "on average, the server response time improved." That is compatible with "10% of users are experiencing timeouts."
      *   *The Objection:* "Low-income households" is an aggregate. Within that aggregate, there is variance. A single mother in a rural area with a long commute and an old car might pay $2,000 more in fuel and receive a $1,500 dividend. She is worse off. The "average" low-income household might be up $500.
      *   *The Slip:* She used the aggregate statistic to silence a concern about the tail risk (the specific losers).

  3.  **The "Pareto" Mislabeling:**
      In economics, a **Pareto Improvement** requires that *no one* is made worse off. A **Kaldor-Hicks Improvement** is one where the winners *could* compensate the losers (net positive sum).
      *   *The Slip:* By calling it Pareto, she invoked a moral absolute ("no harm done"). By retreating to "in expectation," she admitted it is actually Kaldor-Hicks with a transfer scheme. The objection "what about the losers?" is the *exact* objection Kaldor-Hicks invites. Dismissing it by saying "Pareto" is begging the question.

  ### 4. The "Safe" Version: Why It Matters

  You asked about the "safe" version: *"Nobody is made worse off under any plausible model."*

  In decision theory and robust optimization, this is close to a **Maximin** criterion (maximize the minimum outcome) or **Robust Decision Making**.

  **You are right: This is the version that should have been on the table.**

  Here is why the "plain" version (Point Estimate/Ex Ante Average) was doing more work than it could bear:

  1.  **Irreversibility:** In software, if a deploy regresses, you roll back. In climate policy, if you impoverish a vulnerable population and they suffer health crises or displacement, you cannot "roll back" the harm easily. High-stakes systems require higher confidence intervals.
  2.  **Distributional Fragility:** The "average" low-income household might be made whole, but the *variance* is high. The "safe" version demands that the *worst-off* plausible outcome for the *most vulnerable* group is still acceptable. Her claim fails this test because economic models cannot guarantee that the dividend will perfectly offset price shocks for every specific demographic in every region.
  3.  **Trust as a Dependency:** Policy relies on compliance. If the "benchmark" passes in the model but fails in production for a visible group of people, trust in the system degrades. This is analogous to a "flaky test" that passes CI but fails in prod eventually. It introduces technical debt into the political system.

  ### Summary

  Your friend used a **strict guarantee slogan** ("Pareto/Nobody worse off") to sell a **probabilistic model outcome** ("Expected Value/On Average").

  *   **Was she lying?** Probably not intentionally. She was using "Pareto" as shorthand for "We designed the transfer to prevent harm."
  *   **Was the objection valid?** Yes. The objection was about the *variance* and the *model risk*, which the slogan explicitly tried to wave away.
  *   **The Engineering Lesson:** If you told your team, "This refactor is a win—nobody's latency will increase," but you only tested it on the average case, you would be rightly called out in code review. Your friend skipped the code review.

  The "safe" version you proposed is the ethical standard for high-stakes infrastructure. The "plain" version is the sales pitch. The friction you felt was the sound of the sales pitch hitting the infrastructure requirements.
