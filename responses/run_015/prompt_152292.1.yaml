      *   *Step 3: The Capability Test (Normative).* Does it expand or contract real freedoms?
      *   *Step 4: The Distribution Test (Normative).* Is the gain equitable?

      *Wait, I need to ensure one case gets rejected.* The "Cognitive Reframing" case is the perfect candidate for rejection based on the "Deception/Adaptation" objection. The "Green Space" case should likely pass or be conditional.

      *Refining the Protocol Structure:*
      *   **Phase 1: Empirical Validity.** (Does it actually move the metric?)
      *   **Phase 2: Philosophical Integrity.** (Is the move legitimate?)
          *   2a: The "Soma" Condition (Manipulation vs. Reality).
          *   2b: The "Happy Slave" Condition (Adaptation vs. Improvement).
          *   2c: The "Liberal Neutrality" Condition (State Conception of Good).
      *   **Phase 3: Final Deference.**

  4.  **Task 3: Applying the Procedure:**
      *   *Case 1: Green Spaces.*
          *   Empirical: Yes, correlates.
          *   Mechanism: Environmental improvement.
          *   Adaptation: No, improves actual conditions.
