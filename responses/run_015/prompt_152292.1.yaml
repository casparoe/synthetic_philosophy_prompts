answer: |-
  ### Part 1: Philosophical Objections to Ranking-Targeting
  **Briefing Note: Core Philosophical Risks**

  Before constructing the protocol, we must isolate the *philosophical* risks of treating international happiness rankings (e.g., World Happiness Report) as primary policy targets. We set aside empirical concerns (e.g., survey translation errors, sample bias) to focus on conceptual validity.

  1.  **The "Happy Slave" Objection (Adaptation):**
      *   *Theory:* Objective List/Capabilities Approach.
      *   *Objection:* Self-reported satisfaction is vulnerable to *preference adaptation*. Oppressed populations may lower their expectations to match their dire circumstances, reporting high satisfaction despite objective deprivation. Targeting rankings may incentivize policies that manage expectations rather than alleviate suffering.
  2.  **The "Experience Machine" Objection (Manipulation):**
      *   *Theory:* Hedonism/Emotional Experience.
      *   *Objection:* If well-being consists of positive mental states, a policy that chemically or psychologically induces those states without changing reality (Nozick's *Experience Machine*) technically succeeds. However, most philosophical traditions reject this as inauthentic. Targeting rankings risks privileging *feeling* good over *being* well.
  3.  **The "Tyranny of the Average" Objection (Aggregation):**
      *   *Theory:* Prioritarianism/Rights-based.
      *   *Objection:* Rankings usually rely on national means. A policy could raise the average by significantly benefiting the majority while neglecting or harming a vulnerable minority. Treating the rank as the target obscures distributional justice.
  4.  **The "Liberal Neutrality" Objection (State Overreach):**
      *   *Theory:* Political Liberalism.
      *   *Objection:* In a pluralistic society, the state should enable citizens to pursue their own conceptions of the good life, not impose a specific psychological profile (e.g., high arousal positivity) as the official state goal. Targeting specific emotional metrics may violate this neutrality.

  ***

  ### Part 2: The Well-being Policy Filter (Decision Procedure)

  **Purpose:** To evaluate policies proposed explicitly to improve national well-being rankings.
  **Structure:** A sequential three-step filter. A policy must pass Step 1 to proceed to Step 2, and Step 2 to proceed to Step 3.

  #### Step 1: The Causal Mechanism Test
  *   **Philosophical Basis:** Empirical Realism (applies to all theories).
  *   **Exact Question:** "Does the policy improve the reported metric by altering the *external conditions* of citizens' lives, or primarily by altering their *internal reporting standards*?"
  *   **Sufficient Answer for Passage:** Evidence demonstrates the primary causal pathway involves tangible changes to material conditions, social relationships, or health (External), rather than solely changing how citizens interpret or report those conditions (Internal).
  *   **Classification:** **Empirical** (requires social science evidence).
  *   **Outcome:**
      *   *If Internal Only:* **STOP (Rejection).** (Flags "Experience Machine" risk).
      *   *If External or Mixed:* **CONTINUE** to Step 2.

  #### Step 2: The Adaptation & Authenticity Test
  *   **Philosophical Basis:** Objective Flourishing vs. Subjective Satisfaction.
  *   **Exact Question:** "Does the policy rely on citizens adapting to deprivation (lowering expectations) to generate higher satisfaction scores?"
  *   **Sufficient Answer for Passage:** The policy does not depend on reducing citizens' legitimate expectations of justice, health, or autonomy to close the gap between expectation and reality. High satisfaction must not be predicated on ignorance of viable alternatives.
  *   **Classification:** **Normative** (requires philosophical judgment on "legitimate expectations").
  *   **Outcome:**
      *   *If relies on Adaptation:* **STOP (Rejection).** (Flags "Happy Slave" risk).
      *   *If relies on Improvement:* **CONTINUE** to Step 3.

  #### Step 3: The Capability Expansion Test
  *   **Philosophical Basis:** Capabilities Approach (Sen/Nussbaum).
  *   **Exact Question:** "Does the policy expand the substantive freedoms (capabilities) citizens have to lead lives they have reason to value, regardless of whether they exercise them?"
  *   **Sufficient Answer for Passage:** The policy increases the range of valuable functionings available to the citizenry (e.g., health, affiliation, control over environment) without coercively restricting alternative conceptions of the good.
  *   **Classification:** **Normative** (requires values judgment on "valuable functionings").
  *   **Outcome:**
      *   *If Capabilities Contracted:* **DEFER to Advisory Board.** (Requires weighing ranking gains against liberty losses).
      *   *If Capabilities Expanded/Neutral:* **CONDITIONAL APPROVAL.** (Subject to budgetary/distributional review).

  ***

  ### Part 3: Application of the Procedure

  #### Case A: National Subsidy for Urban Green Spaces
  *Proposal:* Significant funding to convert unused urban lots into public parks, justified by cross-national data linking green space access to higher life evaluation scores.

  *   **Step 1: Causal Mechanism Test**
      *   *Analysis:* The policy alters the physical environment (external condition). While it may change how people *feel* about the city, the mechanism is the provision of a public good, not a change in reporting standards.
      *   *Verdict:* **PASS.** (Empirical).
  *   **Step 2: Adaptation & Authenticity Test**
      *   *Analysis:* Does this rely on citizens lowering expectations? No. It raises the baseline of environmental quality. It does not ask citizens to be satisfied with less; it gives them more.
      *   *Verdict:* **PASS.** (Normative).
  *   **Step 3: Capability Expansion Test**
      *   *Analysis:* Does this expand substantive freedoms? Yes. It adds the capability for recreation, social affiliation, and physical health. It does not coerce citizens to use the parks, only makes them available.
      *   *Verdict:* **CONDITIONAL APPROVAL.**
  *   **Final Recommendation:** The policy is philosophically sound. It aligns subjective metrics with objective flourishing. Proceed to cost-benefit analysis.

  #### Case B: Public Awareness Campaign for Cognitive Reframing
  *Proposal:* A state-funded media campaign training citizens to view economic hardship (stagnant wages, inflation) as "opportunities for resilience and personal growth," intended to improve reported emotional balance without changing material conditions.

  *   **Step 1: Causal Mechanism Test**
      *   *Analysis:* The proposal explicitly states it intends to improve scores *without changing material conditions*. The mechanism is purely internal (altering interpretation/reporting standards).
      *   *Verdict:* **FAIL.**
      *   *Reasoning:* This triggers the "Experience Machine" objection. The policy seeks to decouple the metric (emotional balance) from the reality (economic hardship).
  *   **Step 2: Adaptation & Authenticity Test**
      *   *Analysis:* (Hypothetically, if Step 1 were passed). The policy relies on citizens adapting to deprivation by redefining hardship as growth. This lowers legitimate expectations of economic security.
      *   *Verdict:* **FAIL.**
      *   *Reasoning:* This triggers the "Happy Slave" objection. It incentivizes psychological accommodation to structural failure.
  *   **Final Recommendation:** **REJECT.**
      *   *Note:* This policy would likely *succeed* in raising the nation's ranking (as requested in your constraints), but the protocol identifies it as philosophically illegitimate. It prioritizes the *map* (the ranking) over the *territory* (the actual well-being).

  ***

  ### Part 4: Flagging Normative Deferral

  **Where the Protocol Cannot Decide:**
  The protocol is designed to filter out *illegitimate* means (manipulation, adaptation) and identify *legitimate* ends (capability expansion). However, it must defer to the Advisory Board in **Step 3** if a policy expands capabilities for the majority but restricts them for a minority, or if it expands capabilities but conflicts with other state priorities (e.g., fiscal sustainability).

  **Specific Deferral Point:**
  *   **Location:** Step 3 Outcome ("If Capabilities Contracted").
  *   **Scenario:** Suppose a policy mandates a "digital detox" to improve mental health scores. This might expand the capability for "mental integrity" but contract the capability for "economic participation" (for remote workers) or "freedom of choice."
  *   **Reason for Deferral:** The protocol identifies the *conflict* (Capability A vs. Capability B), but it cannot weigh the *value* of one capability against another. This is a political-moral judgment, not a technical one.
  *   **Instruction to Team:** When the protocol flags a capability conflict, do not attempt to resolve it using the filter. Present the trade-off explicitly to the Minister: *"This policy will likely raise the ranking, but it requires a normative judgment that Value X is more important than Freedom Y."*

  ### Summary for the Advisory Office
  1.  **Rankings are Indicators, Not Constitutents:** A rise in rank is only good if it reflects a rise in actual flourishing.
  2.  **The "Soma" Rule:** If the policy changes the mind to fit the world rather than the world to fit the mind, reject it (Case B).
  3.  **The "Freedom" Rule:** If the policy improves scores by restricting genuine choices, defer to political judgment (Step 3 Deferral).
  4.  **The "Green" Standard:** Policies that improve material conditions and expand freedoms while boosting scores are the gold standard (Case A).
