prompt: |-
  You are a professional philosopher of well-being and public policy measurement. Before constructing anything, please spend a brief moment brainstorming the core philosophical objections to treating a country's rank in international happiness surveys as a direct policy target—especially objections that do not depend on empirical disputes about measurement error.

  I am a graduate student in public policy working with a government advisory office. We need a reusable decision procedure that my team can apply whenever a minister proposes a policy explicitly designed to raise our nation's standing in major international well-being rankings—the kind built on large-scale self-reported life-evaluation surveys. The procedure should translate philosophical theories of well-being—subjective life satisfaction, emotional experience, and objective flourishing—into an operational protocol. For each step, specify: the exact question to ask, what counts as a sufficient answer, whether that step is empirical or normative, and whether the protocol stops with a clear rejection, stops with a conditional approval, or hands the decision to a human values judgment.

  Then apply the procedure to two proposals: first, a national subsidy for urban green spaces justified by cross-national correlations between access to nature and higher self-reported life satisfaction; second, a state-funded public-awareness campaign that trains citizens to cognitively reframe economic hardship as personal growth, intended to improve reported emotional balance without changing material conditions. Include at least one case in which the procedure recommends rejecting a policy that would likely improve our ranking. Finally, flag precisely where the protocol cannot eliminate judgment and must defer to a normative decision by the advisory board. Please think carefully and show your reasoning at each step.
