      *Wait, looking closer at the prompt's constraints:* "I want to know which two or three lines of work *inside* that debate we should actually put the year into."
      *   I need to be careful not to abandon the Internalism debate entirely, but focus on the specific *nodes* that matter for *these cases*.
      *   *Priority 1: The Index Problem.* (Essential for dementia/addiction).
      *   *Priority 2: The Pragmatics of Reason-Talk.* (Essential for the "what to say" mandate and clinician input).
      *   *Priority 3: The Constitution of S.* (Challenging the framing). Is *S* intact in depression? If not, Internalism is category-error.

