      *   *Selection 2: The Index Problem (Thread 3 refined).* Why? Because the cases (dementia, addiction, adolescence) are inherently temporal. Internalism fails if it locks onto the depressed time-slice. It succeeds if it locks onto the "healthy" self. Deciding *which* self counts is the core normative work.
      *   *Selection 3: Partitioned Internalism (Thread 4 refined).* Why? Because it addresses the "cruel agent" vs. "depressed patient" asymmetry. It brings in responsibility, which clinicians deal with (e.g., addiction responsibility).
      *   *Decision:* Actually, 15 sessions is tight. I should prioritize *Pragmatics* and *Indexing*. Partitioned Internalism might be too ambitious as a third pillar, but can be subsumed under Indexing (responsibility affects how we index). Let's make the core tension: **Metaphysics of Reasons vs. Pragmatics of Intervention.**
      *   *Revised Selection:*
          1.  **The Pragmatic Turn:** Is "having a reason" a state or a speech act in clinical contexts?
