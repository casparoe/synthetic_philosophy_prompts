      *   **Constraint:** Do not simply re-derive standard Internalism vs. Externalism (Williams-style) arguments. Focus on 2-3 specific lines of work *inside* that debate.
      *   **Input:** Five floated threads (Sound Deliberation, Bootstrapping, Index Problem, Partitioned Internalism, Pragmatics).
      *   **Requirements:**
          *   Defend the chosen agenda (criteria: upstreamness, tractability, neglect vs. unfashionable, downstream impact).
          *   Explain trade-offs between criteria.
