      *   *Key Insight:* The user's view is essentially **Scanlonian** regarding the *reasons* we have to object to certain positions.
      *   *Refining the "License" point:* If the spouse has a license, does that remove the "standing"? If standing is *normative*, then license removes standing. If standing is *physical*, license doesn't. The user seems to want standing to be physical/structural ("position from which attending... is easy"). If so, the spouse *does* have the position. So the user *must* say the spouse loses privacy, or introduce a normative filter. If they introduce a normative filter, it becomes Contextual Integrity. This is the "Collapse" objection.

