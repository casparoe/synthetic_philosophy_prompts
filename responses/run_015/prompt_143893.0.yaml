      *   **Concessions:** A sympathetic defender *must* concede that "standing" is normative, not just physical. You can't define "easy and unmediated" purely physically.
      *   **Access Theory Comparison:** Yes, this is a flavor of Access Theory (Parent). But Parent focused on *actual* access. This is *modal* access.
      *   **Nature vs. Value:** The Value Claim is more exposed. Saying unwatched livestreams are *inherently* bad is harder to defend than saying they change the *nature* of the relationship.
