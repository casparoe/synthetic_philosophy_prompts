      *   **Consequence 2 (Value):** The loss is bad *in itself* (intrinsic wrong), not just instrumental. Being in such a position makes you "at their disposal."
      *   **Key Distinction:** It's not about *access* in the technical sense (can they get the bits?), but about *social/relational standing* (are they positioned to attend easily/unmediatedly?).
      *   **User's Concerns:**
