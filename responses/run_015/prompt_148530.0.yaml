  ### The Moral Responsibility Decision Tree

  This diagnostic tool is designed to map your group's intuitions onto the logical space of moral responsibility. Ask the following four questions in order. Follow the branches to find the corresponding position leaf. Note that some paths lead to positions that are logically unstable or morally unattractive; these are flagged in the **Diagnostic Notes** below.

  #### Question 1: Must reactive attitudes (like resentment) track actual moral desert?
  *(i.e. Is blame only justified if the agent metaphysically deserves it, regardless of social utility?)*

  *   **YES** → Go to **Question 2A**.
  *   **NO** → Go to **Question 2B**.

  ---

  #### Question 2A (For 'YES' on Desert): Does severe mental illness automatically trigger the objective attitude?
  *(i.e. Does the lack of rational agency inherent in psychosis remove the capacity for desert?)*

  *   **YES** → **Leaf 1: Hard Exemptionism**
      *   *Awkward Commitment:* You must treat the recovered agent as entirely distinct from the harming agent, potentially severing moral continuity entirely.
      *   *(Note: Questions 3 and 4 are moot here, as no blame is permissible.)*
  *   **NO** → **Leaf 2: Strict Retributivism**
      *   *Awkward Commitment:* Having to claim a person in a psychotic fugue genuinely deserves resentment comparable to a sober aggressor.

  ---

  #### Question 2B (For 'NO' on Desert): Does severe mental illness automatically trigger the objective attitude?
  *(i.e. Even without metaphysical desert, does illness make the participant stance inappropriate?)*

  *   **YES** → Go to **Question 3**.
  *   **NO** → Go to **Question 3 (Alternative Branch)**.

  ---

  #### Question 3 (Standard Branch): Is partial or calibrated resentment conceptually possible?
  *(i.e. Can we feel a tempered form of resentment, or is the stance binary?)*

  *   **YES** → **Leaf 3: Graded Reactive View**
      *   *Awkward Commitment:* Needing to explain how one can feel 'half-resentment' without it collapsing into pity or objective management.
  *   **NO** → Go to **Question 4**.

  #### Question 3 (Alternative Branch - for 'NO' on Q2B): Is partial or calibrated resentment conceptually possible?

  *   **YES** → **Leaf 4: Resilient Compatibilism**
      *   *Awkward Commitment:* Risking cruelty by maintaining resentment towards those genuinely incapable of rational response.
  *   **NO** → Go to **Question 4 (Alternative Branch)**.

  ---

  #### Question 4 (Standard Branch): Can the social function of blame survive without emotional blame proper?
  *(i.e. Can we hold people accountable via sanctions alone, without the felt experience of resentment?)*

  *   **YES** → **Leaf 5: Revisionist Functionalism**
      *   *Awkward Commitment:* Admitting that 'blame' is just behaviour-modification with no emotional core.
  *   **NO** → **Leaf 6: Classic Strawsonian Participant Stance**
      *   *Awkward Commitment:* Having to claim that we should feel literally nothing (no reactive emotion) for negligent harm caused by someone with a brain tumour, only objective concern.

  #### Question 4 (Alternative Branch): Can the social function of blame survive without emotional blame proper?

  *   **YES** → **Leaf 7: Functional Retention**
      *   *Awkward Commitment:* Treating the psychotic agent as a normal moral interlocutor while secretly manipulating them without emotional engagement.
  *   **NO** → **Leaf 8: Full Participation**
      *   *Awkward Commitment:* Claiming full resentment is appropriate towards someone who lacked rational agency, risking incoherence.

  ---

  ### Diagnostic Notes: Empty and Unstable Combinations

  Use this section to flag paths that your group might find themselves drawn to but which lack philosophical stability.

  1.  **The Incoherent Path (Q1=YES, Q2=YES, Q3=YES):**
      *   **Status:** **Empty.**
      *   **Reason:** If you require actual desert (Q1) and admit illness removes it (Q2), there is no subject left for resentment to target. Claiming partial resentment here is logically inconsistent.

  2.  **The Tension Path (Q1=YES, Q4=YES):**
      *   **Status:** **Unstable.**
      *   **Reason:** If blame must track desert (Q1), the emotional component is usually what does the tracking. Separating the function from the emotion (Q4) while insisting on desert often collapses into contradiction.

  3.  **The Unattractive Path (Q1=YES, Q2=NO):**
      *   **Status:** **Morally Repugnant.**
      *   **Reason:** This leads to **Leaf 2 (Strict Retributivism)**. While logically possible, it is rarely defended because it implies a psychotic agent is as blameworthy as a sadist.

  4.  **The Unexplored Path (Q2B=NO):**
      *   **Status:** **Rarely Defended.**
      *   **Reason:** This leads to **Leaves 4, 7, and 8**. Most compatibilists grant exemption for severe psychosis. Maintaining the participant stance here risks conflating illness with wickedness.

  ### How to Use This Tool

  1.  Read the four questions aloud to your group without revealing the leaf names.
  2.  Record their yes/no answers.
  3.  Map their path to the corresponding leaf.
  4.  Read the "Awkward Commitment" sentence back to them.
  5.  Ask: "Does this commitment match your intuition, or does it reveal a flaw in the position?"

  This method allows you to bypass label-checking (e.g. "Are you a Strawsonian?") and focus directly on the structural commitments of their views regarding agency and emotion.
