  **Conflicts & Exclusion**

  **Ex Ante Visibility** conflicts with **Historical Depth**. The deeper the history, the harder to verify what was visible to contemporaries versus reconstructed by historians. This forces analogies to be recent or structurally transparent. You cannot have deep data and clear ex ante visibility simultaneously.

  The **Name-Stripping Test** does the most work. It excludes nearly all public discourse analogies. They rely on the emotional weight of "Nuclear" to imply danger without proving mechanism. Without the proper noun, the causal chain usually vanishes. This is the primary filter.

