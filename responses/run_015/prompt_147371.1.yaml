          *   *Verdict:* Accurate enough for a summary, though "coordinate transformation" is historically ambiguous (Einstein switched between active/passive interpretations).

      *   *Sentence 2:* "Because GR's field equations are generally covariant, you get a second metric inside that solves them with the exact same exterior conditions and matter distribution."
          *   *Analysis:* Correct. General covariance allows the pullback metric to also be a solution. Boundary conditions outside the hole are preserved.
