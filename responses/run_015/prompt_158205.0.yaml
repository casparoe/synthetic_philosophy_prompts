  Several elements translate cleanly into the formalism. The notion of lock-in maps precisely to convergence on a local optimum where the cost of exploration (switching technologies) exceeds the expected value of the global optimum. Transition penalties accurately model institutional inertia or infrastructure compatibility costs that raise the barrier to entry for alternative actions. The exploration-exploitation trade-off captures the tension between adopting new innovations and refining existing standards, mirroring the economic calculation of investing in new capital versus maintaining legacy systems.

  However, social increasing returns suffer significant distortion. In RL, increasing returns must be explicitly engineered into the reward function or transition dynamics by the modeller. In historical theory, they emerge organically from network effects between autonomous agents. Translating this requires assuming a centralised reward shaper, which misrepresents the decentralised nature of market evolution. This reduces social phenomena to hyperparameters chosen by an external designer, stripping the phenomenon of its emergent character. Additionally, the claim that an outcome was "never going to occur" lacks a direct counterpart. MDPs deal in probabilities; a low-probability trajectory is still possible within the support of the distribution. Modal claims about necessity or impossibility require causal vocabulary outside standard probability theory.

  Most critically, the identity of the learner is untranslatable. In RL, the policy belongs to an agent. In history, there is no singular agent maximising a utility function. Path dependence describes emergent properties of a system, not the learning curve of a unitary optimizer. Contingency in history implies meaningful alternative possibilities, whereas in MDPs, it is merely stochastic variance in $P(s'|s,a)$. The philosophical weight of "could have been otherwise" is lost when reduced to non-zero transition probability. The debate often hinges on whether the state space itself changes, which standard MDPs cannot represent without redefining the environment mid-episode. This limits the ability to model technological discovery as anything other than finding pre-existing states.

  3. The Verdict

  The untranslatable residue indicates a limitation in the RL framework's capacity to represent historical explanation rather than a flaw in the philosophical debate. RL requires a defined state space and a unitary objective function, neither of which exist in open-ended historical processes. The debate appears ill-defined only because it conflates emergent system dynamics with individual optimisation. When philosophers argue about inevitability, they are often disputing the stability of the reward landscape without defining the learner.

  Introducing ergodicity breaking bridges this gap effectively. It formalises the condition for path dependence without requiring a unitary agent. If time averages of system states fail to match ensemble averages due to broken symmetry in transition dynamics, the system is non-ergodic. This confirms the lock-in hypothesis mathematically: the system cannot sample the full state space over time. It does not obscure the issue but clarifies that path dependence is simply non-ergodicity in the social state transition graph. Thus, the debate reduces to whether social dynamics preserve or break ergodicity, a question amenable to statistical mechanics rather than pure optimisation theory. This shift moves the discussion from vague claims of efficiency to testable properties of the transition matrix, allowing for rigorous analysis of historical contingency without imposing artificial agentic structure. It prevents the debate from resting on intuition alone.
