answer: |-
  Good evening. Thank you for coming.

  There are ninety people in this room. Some of you have been here for ten years. Some of you have been here for ten months. Some of you are here because you work for the council. Some of you are here because the council brought you here. We are here to mark ten years of this partnership.

  Ten years is a long time. It is long enough to know what we are doing. It is long enough to know what we are not doing.

  When we started, we made a choice about how we would choose the families we sponsor. We did not pick them for how well they might fit in. We did not pick them for their skills or their English. We drew names by lot from the list given to us. We did this because fairness matters. If the claim of a refugee is strong, it does not depend on whether we like them. It depends on their need. We also publish the number of households we could not take each year. We do this because honesty matters. We need to know where the limit is.

  This brings us to the limit.

  I studied philosophy under Michael Dummett. Some of you know his work. Some of you have been asking me about it this week. He wrote about immigration and refugees. He argued that a state is entitled to set a number. It can say how many people it can take in a year. But he said this number must be based on absorption capacity. This means the ability to integrate newcomers so they become part of the community, not a separate group.

  He also said something else. He said that if you want to restrict numbers, your reason must be fair. It must apply to anyone, regardless of their race, religion, or origin. You cannot say "we are full" if you really mean "we are full of people who look like this." And he said the claim of a refugee is different from the claim of someone who just wants a better job. It is stronger.

  I mention this because we are talking about capacity. We are talking about limits.

  Three months ago, the county council voted to cap the number of households we can sponsor. The reasons given were pressure on school places and the character of the town. We must look at these reasons clearly.

  Pressure on school places is a matter of resources. If there are no desks, there are no desks. But desks can be bought. Teachers can be hired. If we say we have no capacity because we will not pay for more desks, that is not a limit we found. That is a limit we chose.

  The character of the town is a harder reason. What is the character of this town? Is it static? Is it a museum? Or is it a place where people live and work and change? If we say the town cannot change, we are saying the people already here matter more than the people arriving. We must ask if that reason would hold if the newcomers looked like us. Would we cap sponsorship if the families were white Christians from another part of the country? If the answer is no, then the reason fails the test.

  I am not saying the council is wrong to plan. I am saying we must tell the difference between a genuine limit and an unwillingness to build.

  Capacity is not something a town finds. It is something a town makes. It is not a wall we hit. It is a house we build. It is a function of how many befrienders we have. It is a function of how many tenancies we secure. It is a function of how many language hours we organise. A community that under-invests and then pleads low capacity is pleading its own stinginess.

  We cannot say the obligation is unlimited. It is not. We cannot say that the families we have taken discharge the obligation. They do not. But we can say that where we have the power to make capacity, we must use it.

  This is where the work comes in. This is where you come in.

  We talk about integration. We say we want these households to be part of the town. But integration does not happen in the first year. The first year is about survival. It is about papers and housing and food. The second year is about life. It is about knowing who to call when the boiler breaks. It is about having someone to drink tea with who is not a paid worker.

  This is where we fail. We lose most of our volunteers after the first year. The family is left alone just as the real work begins. If we say we are at capacity, but we cannot keep volunteers for a second year, then we are not at capacity. We are just tired.

  If we want to show that our limits are real and not just excuses, we must prove we can sustain what we start. We must prove we are building the house, not just laying the bricks.

  So here is the business of the evening. We are asking for second-year befrienders. We need you to sign up for another twelve months.

  This is not just a request for help. It is a test of our argument. If we say capacity is made, then you are the makers. If you stay, you show that the town can absorb newcomers. You show that the character of this town is welcoming, not closed. You show that the limit on school places is a budget problem, not a moral one.

  If we cannot find enough people to stay for the second year, then we have no right to say we are full. We must admit we are unwilling. But if you sign up, we can stand before the council and say: we have built the room. We have made the capacity. Now you must meet us.

  I am not asking you to save anyone. I am asking you to do the work that makes welcome real.

  There are forms on the tables. Please sign one. Let us show what this town can make.

  Thank you.

  ***

  **Notes on potential misquotation:**

  1.  *"A community that under-invests and then pleads low capacity is pleading its own stinginess."* – Lifted alone, this sounds like a direct accusation of malice against the council, rather than a structural critique of resource allocation.
  2.  *"If we say the town cannot change, we are saying the people already here matter more than the people arriving."* – Without the preceding context about the "test" of neutrality, this could be framed as an attack on local residents' legitimate concerns about infrastructure.
  3.  *"If we cannot find enough people to stay for the second year, then we have no right to say we are full."* – This could be quoted to suggest the speaker believes voluntary effort alone should replace state funding, ignoring the argument about public investment in schools and housing.
