  7.  **Polishing the "Cap" Section:**
      *   This is the trickiest part. The cabinet member is in the room. The diarist is looking for a quote.
      *   Must not say "You are racist."
      *   Must say "The reasons given must pass a test of fairness."
      *   Dummett's test: Would this reason apply to white Christians too? If "town character" means "no change," that fails. If "school places" means "no money for teachers," that is a choice, not a fact.
      *   Phrase it as: "A reason for stopping must be a reason that holds for anyone."

  8.  **Polishing the "Capacity" Section:**
      *   "Capacity is not a wall we hit. It is a house we build."
