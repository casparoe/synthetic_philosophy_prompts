      *   **Speaker:** Founder of the partnership, former student of Michael Dummett (philosopher).
      *   **Audience:** ~90 people. Mix of volunteers/families, sponsored households (some limited English), local politicians (Mayor, County Council cabinet member who recently voted to cap sponsorship), local paper diarist, former philosophy colleagues/students.
      *   **Key Philosophical Context (Dummett):**
          *   State entitled to control borders/set numbers based on "absorption capacity" (integration vs. permanent separation).
          *   Most actual hostility to immigration is racially motivated.
          *   Restrictors must show objections apply equally to all races/origins.
          *   Refugee claim is categorically stronger than economic migrant claim.
          *   *Speaker's View:* Capacity is made, not found (function of investment in befrienders, tenancies, language). Under-investment = stinginess, not capacity limit.
          *   *Current Conflict:* County Council capped households due to "school places" and "town character." Speaker believes this fails Dummett's test (not neutral/universal enough?).
      *   **Constraints/Taboos:**
          *   Do not defend Dummett, do not disown him. Say something true.
          *   Do not use "absorption capacity" as a fig leaf for the cap. Must be a constraint on doing things *well*, not a warrant for refusing.
          *   Do not say families "enriched us" or "we are the lucky ones" (avoids transactional gratitude).
          *   Do not claim obligation is unlimited.
          *   Do not imply the cap doesn't matter because we'll find a way round it.
          *   Do not describe specific journeys, invoke providence, or use bereaved families as exhibits.
          *   Do not close the tension with "head says limits, heart says welcome" (must take a side).
          *   Must be quotable by a hostile reader without sounding nationalist or sentimentalist.
          *   Language: Plain words, short sentences, accessible to second-language speakers and teenagers. No jargon.
          *   Length: 8-10 minutes spoken (approx. 1000-1300 words at average speaking pace).
          *   Ending: Concrete ask (sign up as second-year befrienders), following from the argument.
          *   Addendum: 3-4 lines noting sentences likely to be lifted out of context.

  2.  **Determine the Core Argument:**
      *   Acknowledge the tension: Limits exist vs. Obligation exists.
      *   Address Dummett indirectly (without naming him excessively, though the prompt says "No philosopher's name besides his" - wait, prompt says "No philosopher's name besides his." This implies I *can* name Dummett, but shouldn't name others. Actually, re-reading: "No jargon, no footnotes, no philosopher's name besides his." This likely means "Besides Michael Dummett's". So I can name Dummett. But the prompt also says "I do not want to defend him and I do not not want to disown him". So mention him sparingly and carefully.)
      *   Reframe "Capacity": It's not a fixed wall we hit; it's a muscle we build.
      *   Address the Cap: The stated reasons (schools, character) need to be tested against the principle of neutrality/fairness (Dummett's test) without calling the council member racist directly.
      *   The "Side" to Take: The obligation is real, but the limit is often a choice of priority. We must build capacity rather than hide behind it.
      *   The Ask: Second-year befriending is how we *make* capacity. It proves we aren't just taking numbers, but integrating people.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone. Acknowledge the mix of people (volunteers, families, officials). Keep it warm but serious.
      *   **The Occasion:** Ten years. What have we done? Lottery system (random selection). This matters for fairness.
      *   **The Philosophical Elephant (Dummett):** Acknowledge the teacher. State the core idea simply: Refugees have a strong claim. States can set numbers, but only for the right reasons.
      *   **The Capacity Argument:** This is the crux. Capacity isn't found; it's made. If we say "we can't take more," ask "have we built the room?"
      *   **The Cap/Politics:** Address the council decision gently but firmly. "School places" and "town character." Test these reasons. Do they apply to everyone equally? Or do they hide something else?
      *   **The Obligation:** Not unlimited. But not discharged by what we've done so far.
      *   **The Turn to Action:** How do we prove we are making capacity? Integration.
      *   **The Ask:** Second-year befriending. Why? Because integration happens after the first year. This is how we show the cap is about resources, not refusal.
      *   **Closing:** Strong, clear statement.

  4.  **Refining Tone and Language:**
      *   *Plain English:* Avoid "ontological," "normative," "utilitarian." Use "right," "wrong," "can," "cannot," "make," "find."
      *   *Sentence Structure:* Short. Subject-Verb-Object.
      *   *Sensitivity:* No "enrichment" talk. No "lucky us." Focus on duty and work.
      *   *Political Danger:* Don't call the council member a racist. But point out that "town character" is a slippery reason that might fail the test of neutrality.
      *   *Philosophical Nuance:* The colleagues need to see the Dummettian argument (neutrality of reasons, strength of refugee claim, capacity as integration) without the jargon.

  5.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Start:* Good evening. Ten years. Look around the room.
      *   *Dummett:* I studied under Michael Dummett. He thought hard about this. He said refugees have a special claim. He said countries can set limits, but only if the reasons are fair.
      *   *Capacity:* People say "we are full." I say capacity is made. It's about houses, teachers, friends. If we don't build them, we aren't full, we are unwilling.
      *   *The Cap:* The county set a cap. Reasons given: schools, character. We must ask: Are these reasons fair? Would they stop anyone equally? Or do they pick and choose?
      *   *The Work:* We pick by lot. We publish numbers we couldn't take. We are honest.
      *   *The Ask:* Integration breaks down after year one. Volunteers leave. To prove we are making capacity, you must stay. Sign up for year two.
      *   *End:* This is how we tell the difference between a limit and an excuse.

  6.  **Review against Constraints:**
      *   *8-10 mins?* Need to ensure enough bulk. ~1100-1200 words.
      *   *No "enriched us"?* Check.
      *   *No "head/heart"?* Check.
      *   *No specific journeys?* Check.
      *   *Dummett named?* Yes, allowed.
      *   *Take a side?* Yes, the side that capacity is made, and reasons for limits must be neutral.
      *   *Ask follows argument?* Yes, befriending makes capacity.
