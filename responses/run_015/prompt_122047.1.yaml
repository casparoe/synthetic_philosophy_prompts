  9.  **Polishing the "Ask":**
      *   Why year two? Because year one is crisis management. Year two is life.
      *   If we want to say we have capacity, we must show we can sustain integration.
      *   Therefore, signing up is not just help; it is proof of principle.

  10. **Final Word Count Check:**
      *   Speaking pace is ~130 words per minute. 8 mins = 1040 words. 10 mins = 1300 words. Aim for ~1200.

  11. **Addendum:**
      *   Identify the risky sentences. Usually the ones about "town character" or "capacity is a choice."

  12. **Final Review of Tone:**
      *   Is it too aggressive? Soften the edge on the council member without dulling the point.
      *   Is it too academic? Simplify the Dummett references.
      *   Is it too sentimental? Keep it grounded in work and duty.

