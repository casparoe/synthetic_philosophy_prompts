answer: |-
  # JOINT STATEMENT ON CONTRACTUALISM AND THE AGGREGATION PROBLEM

  **Parties:**
  1.  **Camp A:** The Pairwise Baseline Contractualists (PBC)
  2.  **Camp B:** The Structural Interdependence Contractualists (SIC)

  **Date:** October 26, 2023
  **Subject:** Mapping Agreement and Disagreement on Scanlonian Reasonable Rejection

  ---

  ## 1. AGREED CLAIMS

  Both camps affirm the following foundational commitments regarding the contractualist framework derived from T.M. Scanlon's work. These claims constitute the shared ground upon which our collaboration rests.

  1.  **Justification to Each:** Moral principles must be justifiable to each individual person affected by them. A principle is wrong if it could be reasonably rejected by any single individual, regardless of how many others benefit from it.
  2.  **Rejection of Aggregative Utilitarianism:** The mere summing of welfare units across persons is not a valid method of moral justification. We reject the claim that a large number of small benefits can automatically outweigh a single catastrophic loss simply by virtue of arithmetic summation.
  3.  **The Role of Reasonable Rejection:** The core mechanism of moral judgment is the assessment of reasons for rejecting a principle. A rejection is reasonable if the burden imposed on the rejector by the principle is significantly greater than the burden imposed on others by alternative principles, all things considered.
  4.  **Distinction in Burdens:** There is a morally relevant distinction between (a) imposing a harm on one person to prevent greater harms to others (sacrifice) and (b) distributing unavoidable burdens across a group where everyone faces some risk or cost (distribution).
  5.  **Impartiality:** The assessment of reasonable rejection must be conducted from an impartial standpoint. Individuals cannot claim special privilege for their own interests simply because they are their own; they must appeal to generic reasons that others could acknowledge.

  ---

  ## 2. DISAGREEMENTS TABLE

  The following table isolates the precise points of divergence. The left column provides a neutral framing of the issue. The center and right columns provide the specific formulations each camp endorses.

  | Issue | Neutral Framing | Camp A: Pairwise Baseline Contractualists (PBC) | Camp B: Structural Interdependence Contractualists (SIC) |
  | :--- | :--- | :--- | :--- |
  | **1. The Baseline of Comparison** | How is the burden on an individual measured when assessing reasonable rejection? | The burden is measured against a baseline that isolates the individual's situation. Parallel burdens on others are excluded from the baseline to prevent indirect aggregation. | The burden is measured against a baseline that includes the structural presence of other affected parties. The context of collective impact is intrinsic to the individual's burden. |
  | **2. The Relevance of Numbers** | Does the number of people affected by a principle alter the strength of an individual's reason for rejection? | Numbers are irrelevant to the pairwise comparison. One person's strong reason cannot be outweighed by many people's weak reasons in a single pairwise test. | Numbers are relevant insofar as they constitute a structural pattern. A principle affecting a pattern of 10,000 people creates a different justificatory context than one affecting a single person. |
  | **3. Institutional Context** | Does the nature of institutional decision-making alter the rules of pairwise comparison? | Institutional rules are judged by the same pairwise standards as individual acts. Institutions cannot create new moral math that bypasses the individual veto. | Institutional contexts create interdependent baselines. Justification in these contexts requires comparing patterns of burden, not just isolated dyadic outcomes. |
  | **4. The Nature of Aggregation** | What distinguishes permissible structural reasoning from impermissible utilitarian aggregation? | Aggregation is impermissible whenever the complaints of many are summed to override the complaint of one. Any move that mimics this summing is forbidden. | Aggregation is only impermissible when it sums welfare. Comparing structural patterns of burden is not summing welfare; it is comparing the scope of justification required. |

  ---

  ## 3. CRUXES OF THE DISPUTE

  We identify three sub-questions (cruxes) where resolving the underlying theoretical uncertainty would significantly shift the position of at least one camp. For each crux, we apply the **Distributed Archive Protocol** (described in Section 4) as the concrete line of reasoning.

  ### Crux 1: Baseline Content and Utilitarian Collapse
  **Question:** Can the baseline for measuring burden in Scanlon's formula include the presence or absence of other burden-bearers without collapsing into utilitarian aggregation?

  *   **Shared Case:** The Distributed Archive Protocol (10,000 minor cultural records vs. 1 life-saving research project).
  *   **Camp A Prediction:** If the baseline includes the presence of the 10,000 record-holders, the view collapses into utilitarianism. To remain contractualist, the baseline must isolate the researcher against a single record-holder. Therefore, including others in the baseline is theoretically fatal.
  *   **Camp B Prediction:** Excluding the presence of others from the baseline creates a fiction that ignores the reality of institutional harm. Including them does not sum welfare; it defines the *object* of justification (a structural policy vs. an individual exception). Therefore, excluding them is theoretically fatal.

  ### Crux 2: Knowledge of Multiplicity
  **Question:** Can an individual's knowledge that she is one of many similarly situated persons enter into what she can reasonably reject, or is such knowledge irrelevant to pairwise justification?

  *   **Shared Case:** A record-holder in the Distributed Archive Protocol knows that 9,999 others face the identical loss of a cultural record.
  *   **Camp A Prediction:** This knowledge is irrelevant. The record-holder's complaint is about *her* loss. The fact that others share this loss does not intensify *her* reason for rejection. The pairwise comparison remains between her loss and the researcher's loss.
  *   **Camp B Prediction:** This knowledge is essential. The record-holder's burden is partly constituted by the collective loss of heritage. Knowing she is part of a pattern changes the nature of the burden from "personal inconvenience" to "structural erasure," strengthening her reason for rejection (or altering the comparison).

  ### Crux 3: Counting Numbers vs. Counting Patterns
  **Question:** Is there a principled distinction between "counting numbers" (forbidden) and "counting structural patterns" (permitted), and if so, what formal feature distinguishes them?

  *   **Shared Case:** Deciding whether to halt the researcher's project based on the count of 10,000 records.
  *   **Camp A Prediction:** There is no coherent distinction. Counting 10,000 records to justify halting the project is functionally identical to counting 10,000 units of welfare. The formal feature is simply that persons are being counted to override one person.
  *   **Camp B Prediction:** There is a sharp distinction. Counting numbers sums independent utilities. Counting patterns identifies the scope of a public good. The formal feature is *interdependence*: the value of the archive exists only if the pattern is preserved, whereas the researcher's project value is independent of the archive's size.

  ---

  ## 4. CONCRETE TEST CASE: THE DISTRIBUTED ARCHIVE PROTOCOL

  **Scenario:** A shared institutional system must choose between two options:
  1.  **Preserve the Archive:** Preserve 10,000 individually minor but collectively irreplaceable cultural records (each tied to one specific community). Cost: One researcher's life-saving project is halted (researcher suffers catastrophic professional and potential health loss).
  2.  **Preserve the Project:** Preserve the researcher's project. Cost: All 10,000 records are lost (each record-holder suffers a minor cultural loss).

  **Joint Analysis of Justification:**

  | Question | Camp A: Pairwise Baseline Contractualists (PBC) | Camp B: Structural Interdependence Contractualists (SIC) |
  | :--- | :--- | :--- |
  | **1. Can Option 1 (Save Records) be justified to the Researcher?** | **No.** The researcher compares the halt of their life-saving project (major burden) against the loss of a single record (minor burden) in a pairwise test. The major burden outweighs the minor. The existence of other record-holders cannot be added to the scale. | **Yes.** The researcher is being asked to accept a principle governing a public institution. The baseline includes the structural reality that 10,000 communities are affected. The burden of losing the *Archive* (a structural good) is comparable to the burden of losing the *Project*. |
  | **2. Can Option 2 (Save Project) be justified to any one Record-Holder?** | **Yes.** Any single record-holder compares their minor loss against the researcher's major loss. They cannot reasonably reject a principle that prioritizes life-saving research over minor cultural preservation, even if they are the one who loses out. | **No (conditionally).** If the principle is "Always save the project," it fails to respect the structural value of the Archive. A record-holder can reject a principle that treats the collective heritage as negligible. However, they cannot reject a fair lottery; they reject the *systematic* devaluation of the pattern. |
  | **3. Does the multiplicity of record-holders change what any one of them can reject?** | **No.** Multiplicity is morally inert in pairwise comparison. One person's reason for rejection is not amplified by the fact that 9,999 others have identical reasons. | **Yes.** Multiplicity constitutes the structural pattern. The loss of one record is minor; the loss of 10,000 records is a major structural harm. The individual's standing to reject is tied to the preservation of the pattern they inhabit. |

  ---

  ## 5. CONCLUSION: SUBSTANTIVE VS. VERBAL DISAGREEMENT

  In concluding this joint statement, we classify the nature of our remaining disagreements to clarify the path forward for contractualist theory.

  **1. On the Charge of Utilitarianism:**
  *   **Assessment:** Partly Verbal, Partly Substantive.
  *   **Agreement:** Both camps agree that Camp B (SIC) does not license sacrificing one for the greater good in the *pure utilitarian sense* (i.e., maximizing net welfare units regardless of distribution). Camp B insists their view respects the "justification to each" requirement by redefining the *content* of the justification (structural patterns) rather than abandoning the requirement.
  *   **Residual Dispute:** Camp A maintains that any view allowing the 10,000 minor burdens to override the 1 major burden is *functionally* utilitarian, regardless of the vocabulary used ("structure" vs. "welfare"). Camp A argues this is a substantive failure to protect the individual. Camp B argues this is a verbal confusion, as the *reason* for the override is the preservation of a public good, not the sum of private utilities.

  **2. On Institutional Reasoning:**
  *   **Assessment:** Substantive.
  *   **Agreement:** Both camps agree that contractualism must be able to guide institutional design.
  *   **Residual Dispute:** Camp A contends that the Pairwise Baseline view can accommodate institutional reasoning through ex-ante rules and probabilistic risk distribution without altering the baseline of comparison. Camp B contends that the Pairwise Baseline view creates a contradiction when applied to non-divisible public goods (like the Archive), rendering it unable to justify necessary institutional trade-offs without contradiction.

  **3. Final Map:**
  The dispute dissolves partially if Camp A accepts that "structure" is not a code word for "aggregation," and if Camp B accepts that "structure" cannot be used to bypass the requirement to justify the burden to the specific individual bearing the brunt of the trade-off. However, a substantive core remains: **Camp A prioritizes the isolation of the complaint to protect the individual from the crowd; Camp B prioritizes the context of the complaint to protect the community from fragmentation.** We agree that resolving whether the Distributed Archive Protocol requires sacrificing the researcher is the decisive test for determining which priority is fundamental to contractualism.
