answer: |-
  You are not confused, and you have not squashed unrelated effects together. You have identified a coherent, documented, and deeply troubling structural problem in the ethics of technology and organizational liability.

  You are describing a specific inversion of the "responsibility gap." Where the gap suggests harm occurs with *no* blame, you are describing a **"Responsibility Trap"** (sometimes called the **"Competence Penalty"** or **"Epistemic Liability"**).

  Here is the breakdown you asked for, including the naming, the edges of the concept, and the normative status of the "incentive toward ignorance."

  ### 1. Does this have a name?
  There is no single canonical term like "The Trolley Problem," but there are three overlapping clusters of literature that name this. You are likely seeing the convergence of all three.

  *   **Strategic Ignorance (Sociology/Law):** This is the behavioral outcome. Scholars like **Linda Krieger** and **Michael Grossmann** discuss how actors deliberately avoid information to maintain "plausible deniability." In your cases, the *rational* actor chooses ignorance to avoid the legal status of "recklessness" (knowing a risk and proceeding) versus "negligence" (should have known).
  *   **Organized Irresponsibility (Ulrich Beck):** Beck argues that modern institutions are designed to *individualize* blame for systemic risks. The organization absorbs the profit, but the liability framework hunts for the specific individual whose *epistemic state* (what they knew) allows the law to pin the harm on them. The documentation becomes the trap.
  *   **The Competence Penalty (Org Theory):** This describes the phenomenon where the most capable individuals are assigned the most risk and subsequently the most blame when complex systems fail, while less competent stakeholders claim they "couldn't have understood."

  **Best Label for your Seminar:** If you need a working title, **"The Epistemic Liability Trap"** or **"The Paradox of Foresight"** captures the shape best. It distinguishes it from the "Responsibility Gap" (too little blame) and the "Moral Crumple Zone" (blame placed on humans *outside* the design loop). In your cases, the blame is placed on humans *inside* the design loop specifically *because* they mapped the loop.

  **Confidence:** High (85%) that these literatures cover the phenomenon; Low (40%) that there is one settled proper noun for it.

  ### 2. Is it one phenomenon? (The "Shape" Question)
  Yes, your two cases are the same shape.
  *   **Structure:** `Epistemic Effort` → `Documentation of Risk` → `Harm Occurs` → `Documentation used as Evidence of Mens Rea (Guilty Mind)`.
  *   **Contrast:** `No Epistemic Effort` → `Harm Occurs` → `Defense of "Unpredictability/Complexity"` → `Reduced Culpability`.

  The mechanism is identical: **Knowledge converts a systemic risk into an individual intention.** In law, the difference between *negligence* (you failed to see the risk) and *recklessness* (you saw the risk and shipped anyway) is often the difference between a fine/settlement and gross negligence/punitive damages/criminal charges. By doing the ethical work, the engineers moved themselves from the "negligence" bucket to the "recklessness" bucket, while their managers remained in the "negligence" (or "no duty") bucket.

  **Confidence:** High (90%) that these are structurally identical problems.

  ### 3. Does it need an organizational setting?
  It *survives* in single-person cases, but it *thrives* in organizations.
  *   **Single Person:** If I alone build a bridge, and I calculate a 5% chance of collapse but build it anyway, and it collapses, I am to blame. If I didn't calculate and it collapses, I am still to blame (negligence). The incentive to remain ignorant is lower here because I bear the full risk.
  *   **Organization:** The incentive spikes because of **diffusion of benefit vs. concentration of blame**. The company gets the profit of shipping early (benefit distributed to shareholders/execs). The risk is documented by the engineer (blame concentrated on the engineer). The "willful ignorance" defense works best when there is a hierarchy: the executive can say, "I relied on the experts," and if the experts didn't flag it, the executive is safe. If the experts *did* flag it, the executive can say, "We weighed the business risk," and the experts take the fall for enabling it.

  So, while the logic holds individually, the *perverse incentive* is an organizational artifact. It requires a separation between the **Knower** (engineer), the **Decider** (management), and the **Beneficiary** (shareholders).

  **Confidence:** Medium-High (75%) that the organizational setting is required for the *incentive* to be strong enough to drive strategic ignorance.

  ### 4. Is the "Incentive Toward Ignorance" a flaw in liability?
  Yes. This is the most morally interesting edge.
  *   **The Conflict:** You have a clash between **Epistemic Virtue** (we ought to know the risks of what we build) and **Prudential Rationality** (I ought to protect myself from liability).
  *   **The Flaw:** Our liability frameworks (tort law, professional ethics) are built on a model of **individual causation**. They assume that if we identify the person who "knew," we have found the cause. In complex socio-technical systems, this is false. The "cause" is often the *systemic pressure to ship*, not the individual engineer's knowledge of a bug.
  *   **The Result:** By punishing foresight disproportionately, the law actively discourages safety research. It makes "safety" a liability exposure rather than a protective measure. This suggests the liability practice is misaligned with the goal of public safety.

  **Is ignorance morally better here?** No. But the *system* makes ignorance instrumentally rational. This is a classic **Collective Action Problem**. Every individual engineer is rational to stay ignorant, but the collective outcome is less safe technology.

  **Confidence:** High (85%) that this is a flaw in liability practices rather than a moral truth that foresight *should* attract blame.

  ### 5. A Plain Check on Your Reasoning
  You asked to be told plainly if you are confused.
  *   **Are the cases the same shape?** Yes.
  *   **Is "nobody-else-is-blameworthy" doing the work?** Partially. The phenomenon relies on the *asymmetry* of blame. If the CEO were blamed equally for shipping despite the warning, the incentive would vanish. The fact that the CEO is "off the hook" is essential. So it is not *just* about the engineer's knowledge; it is about the **distribution of culpability relative to knowledge**.
  *   **Is it distinct from "Responsibility Gap"?** Yes. You are correct. The gap is `Harm - Blame`. This is `Harm + Blame → Wrong Target`. Some scholars call this **"Responsibility Dumping."**

  ### Summary for your Seminar
  If you bring this up, I recommend framing it as a tension between **Epistemic Duty** and **Legal Culpability**.
  1.  **Name it:** "The Epistemic Liability Trap" (or reference **Strategic Ignorance** in org theory).
  2.  **The Mechanism:** Documentation creates *Mens Rea* (guilty mind) for the subordinate, while complexity provides *Plausible Deniability* for the superior.
  3.  **The Normative Claim:** This is a design flaw in our accountability structures. It punishes **Safety Engineering** as **Recklessness**.
  4.  **The Fix:** We need liability frameworks that treat **documented risk mitigation** as a shield (safe harbor), not a sword. If you flagged it and tried to fix it, that should lower liability, even if you shipped. Currently, it raises it.

  **Confidence in this advice:** High (80%). This aligns with current critiques in "Algorithmic Accountability" and "Safety Culture" literature (e.g., works by **Mary Cummings**, **M.C. Elish**, and **David Danks**).

  You have spotted a genuine paradox. It is not just "unfair"; it is a systemic driver of unsafe technology.
