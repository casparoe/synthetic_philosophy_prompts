prompt: |-
  I write about consciousness for a science desk, and nearly every piece I do now runs into the same wall. One camp says an animal, a patient under anaesthesia, or a large model is conscious, and points at what the subject does or says. The other camp says the behaviour and the reports would be word for word the same if nothing at all were felt, so nothing follows. What I never see stated is the standard: what a story about how felt states stand to judgments and reports about them would have to get right before it could tell me whether a self-report is evidence of anything.

  That relation is what I want the specification for. Not a tour of the positions, and no history of the debate: a requirements list, written for a stated purpose. The purpose is this — I need the theory good enough to license or refuse to license an inference from self-report to consciousness in subjects very unlike us. Good enough to tell a reporter what she may conclude from a press release about an octopus or a language model; not good enough to settle the metaphysics.

  So: give me the desiderata. For each one, the case or consideration that makes it a requirement, and a verdict on whether it is non-negotiable or the preference of one camp. Three cases I want forced into the list, because I do not think they are standard and I suspect a theory's treatment of them separates the ones that are doing work from the ones that are gesturing.

  The first is slow drift. Suppose the felt character that accompanies a given neural state type rotates gradually over a subject's lifetime, the way a colour wheel might slowly turn, while everything causally downstream stays locked to the neural state: the reports, the discriminatory abilities, the wincing, the memory of how it felt last year. Nothing changes behaviourally, nothing is available to a third person, and the subject's own judgments track the neural state rather than the felt one, so that at sixty she says the wine tastes exactly as it did at twenty and means it. Is this a coherent possibility that a theory must explain away, or a confusion it must dissolve, by showing that felt character cannot come apart from the state's causal or nomological role in that manner? Either answer is acceptable. What is not acceptable is silence about what the correlation between felt character and report is supposed to rest on, if the first answer is right.

  The second is the unhurried judge. Consider a being that feels pain but forms the judgment that it is in pain only when prompted, and forms it by noticing its own guarding behaviour and its incipient inclination to say ouch — by self-observation, that is, rather than by being struck. Its judgments are perfectly reliable. Does an adequate theory owe us an account of the difference between this case and the ordinary one, or is the difference theoretically inert, in which case judgment is doing less work in the standard arguments than everyone assumes? I want to know which of the usual desiderata collapse if the answer is inert.

  The third is borrowed authority. Take subjects who are perfectly reliable about their own states but for whom the reports carry no more felt weight than a readout on a monitor: no sense of privileged access, no sense that they could not be wrong. Is explaining the felt authority of first-person report a genuine requirement on a theory, or is it a prejudice — a datum that only looks like a datum because of what we already believe about causes?

  Against those cases, adjudicate the demands actually made in this neighbourhood, and tell me which are real and which are camp loyalties: that the theory respect the causal closure of the physical; that it not render consciousness nomologically idle; that it be compatible with consciousness having been shaped by natural selection, or else explain why that is not required of it; that it make room for the double dissociation of judgment from felt state without stipulating the dissociation away; that it not quietly collapse into eliminativism, or into identity claims asserted rather than argued; that it yield verdicts in the hard cases — anaesthesia, non-human animals, artificial systems — without a fresh stipulation for each; and that it be statable without invoking phenomenal properties inside causal explanations, which I cannot tell whether to count as a discipline or a confession.

  Two closing things, and they are the parts I most want. First, if some subset of the requirements you endorse cannot be jointly satisfied, say so and show where the contradiction bites: a list that turns out to be internally inconsistent is itself the finding I would run. Second, name the single requirement that does the most work in excluding candidates, and say what it excludes. A short scorecard — three columns, no more — for the view that the judgment is constitutively rather than causally tied to the state it concerns, the view that self-knowledge is always inference from one's own behaviour, and the view that there is nothing phenomenal to be reported, is welcome; keep it brief, since the criteria are what I am paying for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Science journalist writing about consciousness.
      *   **Problem:** Stuck on the "Hard Problem" wall (behavior/report vs. felt experience). Needs a specification/requirements list for a theory of consciousness that licenses/refuses inferences from self-report to consciousness in *unlike* subjects (octopuses, LLMs).
      *   **Constraint 1:** No tour of positions, no history. Just desiderata (requirements).
      *   **Constraint 2:** For each desideratum: Case/consideration making it a requirement + Verdict (Non-negotiable vs. Camp Preference).
      *   **Constraint 3:** Must include three specific "stress test" cases:
          1.  *Slow Drift:* Qualia rotate over lifetime, behavior/judgment stays fixed.
          2.  *The Unhurried Judge:* Pain felt, but judgment formed via self-observation of behavior, not immediate access.
          3.  *Borrowed Authority:* Reliable reports, but no sense of privileged access/authority.
      *   **Constraint 4:** Adjudicate standard demands (causal closure, nomological idleness, evolution, dissociation, eliminativism/identity, hard case verdicts, phenomenal properties in explanation).
      *   **Constraint 5:** Identify internal inconsistencies in the requirements list (if any).
      *   **Constraint 6:** Name the single most exclusionary requirement and what it excludes.
      *   **Constraint 7:** Provide a 3-column scorecard for three specific views (Constitutive Judgment, Inferential Self-Knowledge, Eliminativism).
      *   **Tone:** Precise, philosophical but practical (for a science desk), rigorous, no fluff.

  2.  **Deconstruct the Core Task:**
      The user wants a *functional specification* for a theory of consciousness. They aren't asking for the truth; they are asking for the *criteria of adequacy* that would allow a journalist to evaluate claims about octopuses or AI. The key tension is between *phenomenology* (what it feels like) and *function/access* (what is reported/done).

  3.  **Drafting the Desiderata (incorporating the 3 Stress Cases):**

      *   *Standard Demand 1: Causal Closure/Physicalism.*
          *   Consideration: Science assumes physical causes suffice.
          *   Verdict: Non-negotiable for a *science* desk, but metaphysically contested. Let's call it a "Disciplinary Constraint."
      *   *Standard Demand 2: Nomological Idleness (Epiphenomenalism).*
          *   Consideration: If feelings do nothing, why report them?
          *   Verdict: Non-negotiable for an explanatory theory.
      *   *Standard Demand 3: Evolutionary Plausibility.*
          *   Consideration: Consciousness costs energy; must have a function.
          *   Verdict: Preference (Functionalists), but Panpsychists might deny. Let's mark as "Strong Preference."
      *   *Standard Demand 4: Dissociation (Judgment vs. Feeling).*
          *   Consideration: Blindsight, anesthesia.
          *   Verdict: Non-negotiable (Data point).
      *   *Standard Demand 5: No Eliminativism/Identity Stipulation.*
          *   Consideration: "It just is" isn't an explanation.
          *   Verdict: Non-negotiable for *explanation*, though Identity Theories exist.
      *   *Standard Demand 6: Verdicts in Hard Cases.*
          *   Consideration: Utility for the journalist.
          *   Verdict: Non-negotiable (Purpose of the spec).
      *   *Standard Demand 7: No Phenomenal Properties in Causal Explanations.*
          *   Consideration: Science deals in structures/functions.
          *   Verdict: Disciplinary Constraint.

      *   *Stress Case 1: Slow Drift (Inverted Spectrum over Time).*
          *   Requirement: **Stability of Reference.** The theory must explain what anchors the word "red" or "pain" to the experience rather than just the neural state.
          *   Verdict: Non-negotiable. If the theory can't distinguish drift from stability, it can't validate reports.

      *   *Stress Case 2: The Unhurried Judge (Inferential Self-Knowledge).*
          *   Requirement: **Immediacy vs. Reliability.** The theory must distinguish between *being* in a state and *knowing* one is in a state.
          *   Verdict: Non-negotiable. If judgment is always inferential, self-report is just third-person data.

      *   *Stress Case 3: Borrowed Authority (Lack of Privileged Access).*
          *   Requirement: **Phenomenal Authority.** The theory must account for the *feeling* of certainty, not just reliability.
          *   Verdict: Camp Preference (Illusionists say the feeling is a trick; Realists say it's data). *Correction:* For the journalist's purpose (validating reports), the *feeling* of authority is the signal. If the theory says the feeling is irrelevant, it undermines the reporter's tool. Let's mark this carefully.

  4.  **Identifying Inconsistencies (The "Contradiction Bite"):**
      *   The big tension is between *Causal Closure/Physicalism* (Demand 1 & 7) and *Nomological Idleness/Phenomenal Authority* (Demand 2 & 3).
      *   If physical causes are closed, and phenomenal properties aren't physical structures, how do they cause reports?
      *   If they *are* physical structures (Identity Theory), does that explain the *feel*?
      *   *The Bite:* You cannot simultaneously demand that phenomenal properties be distinct from functional roles (to avoid functionalism washing out qualia) AND that they play a causal role in reports (to avoid epiphenomenalism) AND that physical causal closure holds. This is the Exclusion Problem.
      *   *Specific to the prompt:* The requirement for "Phenomenal Authority" (Stress Case 3) conflicts with "No Phenomenal Properties in Causal Explanation" (Standard Demand 7). If the authority is phenomenal, and it causes the report, you've put phenomenology in the causal chain.

  5.  **Selecting the "Most Exclusionary" Requirement:**
      *   Which one kills the most theories?
      *   "No Phenomenal Properties in Causal Explanations" kills Realist theories that rely on qualia as causes.
      *   "Verdicts in Hard Cases without Stipulation" kills vague theories.
      *   *Winner:* **The Non-Epiphenomenal Constraint (Nomological Idleness).** It forces the theory to link the *feel* to the *report*. Functionalists pass easily. Illusionists pass by denying the feel. Realists (Dualists/Non-Reductive Physicalists) struggle hardest here. Actually, for the *journalist's purpose* (inferring consciousness from report), the requirement that **Report Must Track Phenomenology, Not Just Function** is the killer. If a theory allows a zombie to make the report, the report is useless evidence.
      *   *Refinement:* The requirement is **"The Anti-Zombie Constraint on Reporting."** The theory must explain why a system without feelings *cannot* generate the specific self-report "I am conscious of X."
      *   *What it excludes:* It excludes Pure Functionalism (LLMs pass), Pure Behaviorism, and Illusionism (which says the report is the same regardless). It mostly targets theories that decouple access from phenomenology.

  6.  **Developing the Scorecard:**
      *   Views:
          1.  Judgment Constitutive (e.g., Higher-Order Thought).
          2.  Inferential Self-Knowledge (e.g., Self-Interpretation/Behaviorist).
          3.  Eliminativism/Illusionism (e.g., Frankish).
      *   Columns: Requirement Met? (Yes/No/Partial), Failure Mode, Verdict for Journalist.

  7.  **Refining the Tone:**
      *   The user is sophisticated ("nomologically idle," "double dissociation"). Do not dumb it down.
      *   Be direct. "Here is the list." "Here is the contradiction."
      *   Avoid hedging.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the constraint. This is a spec for an *inference engine*, not truth.
      *   *The Desiderata:* Group them logically.
      *   *The Stress Cases:* Integrate them as specific requirements.
      *   *The Contradiction:* Be precise about the Exclusion Problem.
      *   *The Killer Requirement:* Focus on the link between report and feel.
      *   *Scorecard:* Keep it tight.

      *(Self-Correction during drafting)*: Wait, the user asked for the "single requirement that does the most work in excluding candidates."
      If I choose "Anti-Zombie," it excludes Functionalism.
      If I choose "Causal Closure," it excludes Dualism.
      Given the user is a *science* journalist, "Causal Closure" is a baseline. The *problematic* one is linking the report to the feel.
      Actually, the requirement **"The theory must distinguish a conscious reporter from a functionally identical non-conscious reporter"** is the one that breaks most current science-ready theories (like IIT or GNW often struggle to define the *feel* part distinct from the *access* part).
      Let's go with: **"The Non-Substitutability of Phenomenology in Causal Accounts of Reporting."** If the feel doesn't do the work, the report doesn't prove the feel.

      *(Re-evaluating the Contradiction)*:
      The user asks: "if some subset of the requirements you endorse cannot be jointly satisfied, say so."
      The classic triad: Physical Closure, Mental Causation, Distinctness of Mental/Physical.
      In this context:
      1. Reports are physical events (Science Desk constraint).
      2. Reports are caused by Conscious States (Anti-Epiphenomenalism).
      3. Conscious States are not identical to Physical/Functional States (to allow for Slow Drift/Octopus difference).
      These three are inconsistent. I need to highlight this.

      *(Re-evaluating Stress Case 3 - Borrowed Authority)*:
      Is explaining felt authority a requirement?
      If the subject feels no authority, but is reliable, is it consciousness?
      For the journalist, if the "feeling of authority" is the signal they are looking for in a report, the theory must account for it.
      I will classify this as a "Camp Preference" (Realists want it, Illusionists dissolve it), but note that for the *journalist's specific goal* (using reports as evidence), the absence of this feeling makes the report suspect.

  9.  **Final Polish:** Check against all constraints.
      *   Requirements list? Yes.
      *   Case/Consideration + Verdict for each? Yes.
      *   3 Stress Cases included? Yes.
      *   Adjudicate standard demands? Yes.
      *   Inconsistency identified? Yes.
      *   Single exclusionary requirement named? Yes.
      *   3-column scorecard? Yes.
      *   Tone check: Professional, sharp, no fluff.

  10. **Final Review of the "Slow Drift" Requirement:**
      The requirement isn't just "explain drift." It's "Anchor Reference." How does the word "pain" latch onto the qualia and not just the C-fiber firing? If it latches onto the firing, drift is invisible. If it latches onto qualia, drift changes the meaning. The theory must specify the latching mechanism.

  11. **Final Review of "Unhurried Judge":**
      Requirement: **Access Mechanism Specificity.** Is the access direct or inferential? The theory must specify.

  12. **Final Review of "Borrowed Authority":**
      Requirement: **Phenomenal Signature.** Does the report carry a marker of its source?

      *Let's write.*
answer: |-
  ### Specification for a Theory of Consciousness (Science Desk Edition)

  **Purpose:** To license or refuse the inference from self-report ("I feel X") to the presence of conscious states in subjects structurally unlike humans (octopuses, LLMs, anesthetized patients).
  **Constraint:** Metaphysical truth is secondary to operational validity.

  ---

  ### I. The Desiderata

  **1. Causal Closure of the Physical**
  *   **Consideration:** Science operates on the premise that physical events have sufficient physical causes. If a report (a sound wave, a keystroke) is a physical event, its causal history must be physically traceable.
  *   **Verdict:** **Non-negotiable (Disciplinary).** A theory violating this places consciousness outside the scope of scientific investigation.

  **2. The Anti-Epiphenomenal Constraint**
  *   **Consideration:** If felt states do not influence the report, the report is not evidence of the felt state. A theory that makes consciousness nomologically idle renders self-report useless for detection.
  *   **Verdict:** **Non-negotiable (Functional).** Without this, the theory cannot serve the stated purpose of validating reports.

  **3. Evolutionary Plausibility**
  *   **Consideration:** Consciousness is metabolically expensive. If it confers no selective advantage (e.g., better discrimination, learning), its prevalence is inexplicable.
  *   **Verdict:** **Strong Preference.** Panpsychists may deny this, but for a biological science desk, a theory that cannot explain *why* consciousness was selected is suspect.

  **4. Dissociation Capacity (Double Dissociation)**
  *   **Consideration:** Blindsight and anesthesia show that judgment/report and felt state can come apart. A theory that stipulates they are identical by definition fails to fit the data.
  *   **Verdict:** **Non-negotiable (Empirical).** The theory must allow for the possibility of report without feeling and feeling without report.

  **5. No Stipulative Identity**
  *   **Consideration:** Asserting "Neural State N *just is* Pain" without explaining the transition from structure to feeling is a conversation-stopper, not a theory.
  *   **Verdict:** **Non-negotiable (Explanatory).** Identity claims must be derived, not posited.

  **6. Generalizability to Hard Cases**
  *   **Consideration:** The theory must yield verdicts for octopuses and AI without ad hoc adjustments for each new substrate.
  *   **Verdict:** **Non-negotiable (Utility).** This is the primary deliverable for the journalist.

  **7. Structural Causation Only**
  *   **Consideration:** Causal explanations in science rely on structural/functional properties, not intrinsic "glows." Invoking phenomenal properties as causal forces is methodologically forbidden in physics/biology.
  *   **Verdict:** **Non-negotiable (Disciplinary).** This conflicts with Demand #2 (see *Inconsistency* below).

  ---

  ### II. The Stress Cases (Specific Requirements)

  **8. The Anchor Requirement (Slow Drift)**
  *   **Case:** Qualia rotate over a lifetime; neural states and behavior remain fixed. The subject says "wine tastes the same" at 60 as at 20.
  *   **Requirement:** The theory must specify the **Reference Anchor**. Does the term "taste" refer to the neural state (functional role) or the phenomenal character (intrinsic quality)?
      *   If it refers to the neural state, drift is impossible (the state defines the feeling).
      *   If it refers to the phenomenal character, the subject is lying or mistaken (the feeling changed, the report didn't).
  *   **Verdict:** **Non-negotiable.** A theory that cannot specify what self-reports refer to cannot validate them. Silence here implies the theory cannot distinguish truth from error in first-person accounts.

  **9. The Access Mechanism Requirement (The Unhurried Judge)**
  *   **Case:** Subject feels pain but judges it only by observing their own wincing. Reliable, but inferential.
  *   **Requirement:** The theory must distinguish **Constitutive Access** (the feeling makes the judgment) from **Inferential Access** (the behavior makes the judgment).
  *   **Verdict:** **Non-negotiable.** If all self-knowledge is inferential (like third-person knowledge), self-report loses its status as *privileged* evidence. The theory must state whether immediacy is a necessary condition for consciousness or merely a contingent feature of humans.

  **10. The Authority Signature Requirement (Borrowed Authority)**
  *   **Case:** Subject reports reliably but feels no sense of "I know this best." The report feels like reading a gauge.
  *   **Requirement:** The theory must account for the **Phenomenology of Authority**. Is the sense of privileged access a necessary component of the conscious state, or a separable metacognitive judgment?
  *   **Verdict:** **Camp Preference.**
      *   *Realists:* Non-negotiable. The "feel" of knowing is part of the data.
      *   *Illusionists:* Preference. The feeling is a user-illusion; reliability is what matters.
      *   *Journalistic Impact:* If the theory classifies the "gauge-reader" as conscious, the reporter loses the ability to distinguish between a being that *knows* it hurts and a being that *registers* damage.

  ---

  ### III. Adjudication of Standard Demands

  *   **Respect Causal Closure:** Non-negotiable. (See Desideratum 1).
  *   **Not Render Consciousness Idle:** Non-negotiable. (See Desideratum 2).
  *   **Compatible with Natural Selection:** Strong Preference. (See Desideratum 3).
  *   **Make Room for Dissociation:** Non-negotiable. (See Desideratum 4).
  *   **Not Collapse into Eliminativism/Identity:** Non-negotiable for *explanation*, though Eliminativism is a valid *outcome* if argued.
  *   **Yield Verdicts in Hard Cases:** Non-negotiable. (See Desideratum 6).
  *   **No Phenomenal Properties in Causal Explanations:** Non-negotiable. (See Desideratum 7).

  ---

  ### IV. The Inconsistency (Where the Contradiction Bites)

  **The Exclusion Problem.**
  You cannot jointly satisfy **Demand #1 (Causal Closure)**, **Demand #2 (Anti-Epiphenomenalism)**, and **Demand #7 (Structural Causation Only)** while maintaining that **Phenomenal Properties are Distinct from Physical Properties** (implied by the need to test for them in octopuses/AI).

  *   **The Bite:**
      1.  If reports are physical events, they have physical causes (Demand #1).
      2.  If consciousness causes reports (Demand #2), consciousness must be physical or causally redundant.
      3.  If consciousness is physical/functional, it is structurally defined (Demand #7).
      4.  If it is structurally defined, a functionally identical zombie could make the report.
      5.  If a zombie can make the report, the report is not evidence of consciousness (Violates Purpose).

  **Resolution:** To satisfy the journalist's purpose, you must sacrifice **Demand #7** (allowing phenomenal properties to have causal power, which breaks physics) OR **Demand #2** (admitting reports are not caused by feelings, which breaks the inference). Most working theories sacrifice #7 implicitly (by treating information/integration as a proxy for feeling) or sacrifice #2 (by assuming the correlation holds without explaining the mechanism).

  ---

  ### V. The Single Most Exclusionary Requirement

  **Requirement:** **The Non-Substitutability of Phenomenology in Causal Accounts of Reporting.**
  *   **Definition:** The theory must explain why a system lacking phenomenal states *cannot* generate the specific self-report "I am experiencing X," even if it is functionally identical to a system that does.
  *   **What It Excludes:** It excludes **Pure Functionalism** (including Global Workspace Theory in its standard form) and **Behaviorism**. If the theory says a sufficiently complex input-output machine can generate the report without the feeling, the report ceases to be evidence for the journalist. It also excludes **Illusionism**, which posits the report is generated by mechanisms that would exist even if the feeling were absent.
  *   **Why:** This is the only requirement that forces the theory to link the *evidence* (the report) inextricably to the *target* (the feeling).

  ---

  ### VI. Scorecard

  | View | Constitutive Judgment (HOT) | Inferential Self-Knowledge (Self-Interpretation) | Eliminativism / Illusionism |
  | :--- | :--- | :--- | :--- |
  | **Meets "Non-Substitutability"?** | **Partial.** Judgment constitutes the state, so no report without state. But allows functionally identical states without "qualia." | **No.** Report is based on behavior. A zombie behaving identically would generate the same report. | **No.** Explicitly claims the report is generated without the phenomenal referent existing. |
  | **Failure Mode** | Fails **Evolutionary Plausibility**. Why evolve complex higher-order monitoring just to constitute the feeling? | Fails **Authority Signature**. Reduces first-person to third-person; cannot distinguish octopus pain from octopus damage-registration. | Fails **Purpose**. Solves the problem by declaring the target (consciousness) a fiction. Reporter has nothing to detect. |
  | **Verdict for Journalist** | **Use with Caution.** Validates report, but defines consciousness narrowly (requires cognitive sophistication). Excludes animals/infants. | **Reject.** Makes self-report indistinguishable from behavioral observation. No special access. | **Reject.** Useful for metaphysics, useless for detection. |
