answer: |-
  The established name for this pattern in economics and sociology is a **positional arms race**.

  This dynamic occurs when individuals compete for relative status or rank rather than absolute gain, meaning any advantage one person gains is immediately canceled out when others match the effort, leaving everyone worse off due to the increased costs. In your examples, the food trucks are competing for a fixed pool of late-night customers, and the baseball families are competing for fixed roster spots or relative skill rankings; because the total "pie" doesn't grow, the extra hours and money spent are purely wasteful escalation designed only to avoid falling behind.

  This differs from plain competition because healthy competition is typically positive-sum, where innovation or effort creates new value (like a truck inventing a better menu that attracts new customers who wouldn't have bought food otherwise). In a positional arms race, the competition is zero-sum or negative-sum; the aggregate welfare decreases because resources are burned solely to maintain the status quo rather than to create new wealth or utility.

  It differs from the Tragedy of the Commons because that scenario involves the depletion of a shared, rivalrous resource (like fish in a lake), whereas a positional arms race involves the escalation of costs to secure a non-rivalrous good (like status or relative ranking). In the Commons, the resource disappears; in an arms race, the resource (the customers, the roster spots) remains the same, but the cost to access it becomes prohibitively high for everyone.

  The underlying game theory structure is a multi-player Prisoner's Dilemma, where the dominant strategy for each individual is to escalate (stay open, pay for lessons) even though the collective optimal strategy is to restrain. Economists like Robert Frank describe this as competition for "positional goods," noting that because unilateral disarmament is punished by relative loss, the only solution is typically collective enforcement or regulation, such as a union agreement on hours or a league cap on spending.
