  hey so I keep running into the same annoying dynamic and I wonder if philosophers or economists or whoever already have a name for it?

  First was my cousin's food truck block downtown. One truck started staying open an hour later to catch the late crowd, so the others had to match or lose business, now all of them stay open late, they all hate it, costs are up, nobody gets more customers overall cause they're just splitting the same late crowd, and customers barely even cared. They all say they'd vote to all close early again if they could enforce it, but no one can afford to be the first to blink.

  Then totally seperate thing, my kid's travel baseball team. One family started paying for extra private hitting lessons in the offseason, realy expensive, then a few more families felt they had to keep up so their kid wouldn't fall behind, now basically everyone does it, everyone's broke and exhausted, the relative ranking of the kids is about the same as before, and everyone says they wish none of them had started.

  It's not just regular competition cause in both cases nobody even wants the prize that much and everyone would be happier if they could all quit together, but quitting alone just punishes you. I know there's an idea about overusing a shared resource like overfishing, but this feels different cause there's no shared lake to protect, it's just everyone undercutting each other to not lose.

  So is there an established name for this exact pattern? If so what is it and how is it different from plain competition and from the overfishing-type situation? And if there isn't, can you coin something with a clear definition that tells me what counts and what doesn't?

  Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
