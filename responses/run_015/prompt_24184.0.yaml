answer: |-
  Dear Alex,

  We are writing to you following the conclusion of our adversarial collaboration to summarize the joint statement we have agreed upon regarding the Principle of Alternative Possibilities and Frankfurt-style cases. Our goal in this document is to record where our dialogue has produced convergence, to state precisely where we remain divided, and to identify the specific cruxes that sustain our disagreement along with the test cases we have designed to adjudicate them. We both agree that Frankfurt-style cases are designed to show that an agent can be morally responsible for an action even if they could not have done otherwise, thereby challenging the Principle of Alternative Possibilities, often abbreviated as PAP. We further agree that the intuitive force of these cases relies on the presence of a counterfactual intervener who stands ready to ensure the agent performs the action if the agent shows any sign of choosing differently, while in the actual sequence the agent acts on their own without intervention. Both of us accept that for an agent to be morally responsible, the action must issue from the agent in the actual sequence of events, meaning that mere alternative possibilities without actual sequence control are insufficient for responsibility. We also concur that standard formulations of PAP require refinement, as robust alternative possibilities are indeed eliminated in successful Frankfurt cases, leaving only what has been termed a flicker of freedom.

  Despite this shared ground, we remain divided on the metaphysical significance of that flicker. One of us maintains that the Principle of Alternative Possibilities, suitably refined to include even non-robust alternative possibilities such as the possibility of initiating a different decision process, is a necessary condition for moral responsibility, and that the flicker remaining in Frankfurt cases is what preserves the agent's responsibility. The other of us maintains that moral responsibility tracks guidance control in the actual sequence alone, such that the availability of alternative possibilities is irrelevant to the attribution of responsibility, and the flicker is merely a metaphysical artifact that bears no weight on whether the agent is praiseworthy or blameworthy. We have agreed to phrase our disagreement this way because the first formulation captures the necessity claim essential to the defense of PAP without requiring robust alternatives, while the second formulation captures the sufficiency claim of the actual sequence view without denying the existence of the flicker.

  The first crux of our disagreement concerns whether an alternative possibility that the agent never exercises can bear on responsibility at all. To test this, we have jointly designed a case called the Trivial Flicker Scenario. In this case, an agent decides to vote for a candidate on their own, but a counterfactual intervener would have forced the vote if the agent had shown any neural sign of hesitation. The agent does not hesitate, but it remains true that the agent could have hesitated, which would have triggered the intervention. The agent votes without any awareness of the intervener. For this case, we have recorded our predictions in advance. The defender of the Principle of Alternative Possibilities predicts that if we imagine a variation of this case where the possibility of hesitation is removed entirely, such that the agent literally could not have hesitated even in the counterfactual scenario, moral responsibility would vanish or be significantly undermined. The semicompatibilist predicts that if we imagine that same variation where the possibility of hesitation is removed but the agent's actual sequence reasoning remains reasons-responsive and owned by the agent, moral responsibility will remain fully intact.

  The second crux of our disagreement concerns how much weight to give the actual sequence over the counterfactual ones when determining the source of responsibility. To test this, we have jointly designed a case called the Dual Sequence Scenario. In this case, an agent acts from a mechanism that is moderately reasons-responsive in the actual sequence, but in the counterfactual sequences where the agent tries to do otherwise, the intervener ensures the same outcome through direct manipulation of the agent's neural states. The question is whether the nature of the counterfactual sequence affects the responsibility status of the actual action. We have recorded our predictions in advance. The defender of the Principle of Alternative Possibilities predicts that the nature of the counterfactual sequence matters because it defines the range of alternatives available, and if the counterfactual sequence involves manipulation that undermines the agent's freedom in those alternatives, it casts doubt on the status of the actual sequence by association or by reducing the flicker to something insignificant. The semicompatibilist predicts that the nature of the counterfactual sequence is irrelevant to responsibility because responsibility is determined solely by the properties of the actual sequence, specifically whether the mechanism issuing in the action is the agent's own and is responsive to reasons in the actual world, regardless of how the counterfactuals are secured.

  We hope that this statement accurately reflects the progress we have made and the precise boundaries of our remaining dispute. We believe that by isolating these cruxes and pre-registering our predictions on these specific cases, we have moved the debate from intuitions about general principles to testable claims about specific metaphysical dependencies. We intend to publish this letter as a joint addendum to our individual papers on the subject, and we thank you for facilitating the environment that made this collaboration possible. We look forward to seeing which of our predictions holds up under further scrutiny from the wider community.

  Warmly,

  Jordan and Taylor
