answer: |-
  Here is a runnable workshop design tailored to your constraints. It avoids academic jargon, uses the fiction writers' instinct for world-building against them, and forces the logical collapse experientially.

  ### Workshop Title: The City of Four Gates
  **Time:** 90 Minutes
  **Materials:** Whiteboard/markers, 4 bowls, 60 poker chips (or dried beans), printed "Objection Cards" (see below).
  **Room Setup:** Four clusters of chairs facing inward, one central "Facilitator Table" (you).

  ---

  ### Part 1: The Setup & City Build (15 Minutes)

  **1. The Hook (5 mins)**
  Do not mention Buddhism, Nāgārjuna, or the tetralemma yet. Tell them:
  *"We are going to build a city that cannot be logically sustained. You are the architects, but the laws of physics here are negotiable. Our goal is to make this city real enough to walk in, but unstable enough to fall down."*

  **2. Co-Creating the Charter (10 mins)**
  Ask the whole group to agree on **three absolute properties** of the city. Write them on the board. They must be slightly paradoxical or relational.
  *   *Example 1:* "The River remembers every name spoken on its banks, but forgets the water itself."
  *   *Example 2:* "The Clock Tower only strikes when no one is listening."
  *   *Example 3:* "The Bridge exists only when crossed."

  *Facilitator Note:* Ensure the properties rely on **dependence** (listening, crossing, speaking). This sets the trap for "inherent existence" later.

  ---

  ### Part 2: The Four Courts (45 Minutes)

  **1. Assign the Corners (5 mins)**
  Split the 12 writers into 4 groups of 3. Assign each group one of the Four Corners regarding the City's existence.
  *   **Group 1 (Exists):** The City is inherently real. The properties are true facts.
  *   **Group 2 (Not Exists):** The City is inherently unreal. It is an illusion/nothing.
  *   **Group 3 (Both):** The City is both real and unreal simultaneously.
  *   **Group 4 (Neither):** The City is neither real nor unreal.

  **2. The Rules of Engagement (5 mins)**
  *   Each group starts with **5 Chips**.
  *   **Goal:** Keep your chips. (Tell them there's a prize for the group with the most chips at the end, even though the game is rigged so everyone loses).
  *   **Turn Structure:**
      1.  Group 1 makes a claim defending their position using the City Charter.
      2.  Groups 2, 3, and 4 can challenge using **Objection Cards**.
      3.  If Group 1 cannot answer without contradicting the Charter or asserting "inherent essence" (see below), they lose a chip.
      4.  Rotate clockwise.
  *   **The "Essence" Ban:** You (the facilitator) hold the "Essence Whistle." If any group uses words like *actually, truly, basically, fundamentally, soul, core,* or *independent*, blow the whistle. They lose a chip immediately.

  **3. The Objection Cards (Distribute 3 to each group)**
  These cards force the Madhyamaka logic without naming it.
  *   **Card A (Parts):** "Is this property distinct from its parts? If yes, show us the part that holds the memory. If no, it's just a collection, not a thing."
  *   **Card B (Time):** "Does this exist before the condition? If the River remembers, did it exist before the name was spoken?"
  *   **Card C (Observer):** "Does this require a viewer? If the Clock strikes when no one listens, who verifies the strike?"

  **4. Play the Game (30 mins)**
  Let them argue. Your job is to be the Logic Trap.
  *   *When Group 1 (Exists) says:* "The River is real."
      *   *Trap:* Ask, "Is the memory the water? If you replace the water, is it the same River?" (Forces them to admit dependence on parts).
  *   *When Group 2 (Not Exists) says:* "It's fake."
      *   *Trap:* Ask, "Then why does the Bridge hold your weight when crossed? Nothing cannot function." (Forces them to admit conventional utility).
  *   *When Group 3 (Both) says:* "It's magic paradox."
      *   *Trap:* "How can light and dark occupy the same spot? Define the mechanism." (Forces them to admit contradiction).
  *   *When Group 4 (Neither) says:* "It's beyond logic."
      *   *Trap:* "Are you saying it's mysterious? Or that the question is broken?" (If they say mysterious, they lose a chip. "Mystery" is a hidden "Exists").

  **The Collapse:** Around minute 35, stop the game. Count the chips. Everyone should be significantly lower than 5. Point out that no one won. The system consumed all the chips.

  ---

  ### Part 3: The Debrief & Mapping (30 Minutes)

  **1. Map the Failure (10 mins)**
  Draw the Tetralemma on the board. Ask each group: *"Where did your argument break?"*
  *   **Exists:** Broke because the City depends on conditions (listeners, crossers). Dependence means no inherent self.
  *   **Not Exists:** Broke because the City functions. You can write about it. Total nothingness doesn't work.
  *   **Both:** Broke because it turned into a sloppy mashup of the first two errors.
  *   **Neither:** Broke because they tried to make "Neither" a *thing* (a mystical zone).

  **2. Introduce the Twist (10 mins)**
  Now you name it.
  *"You just performed the Catuṣkoṭi. In Madhyamaka philosophy, we don't pick a corner. We realize the board itself is the problem. The City isn't real, isn't unreal, isn't both, isn't neither. It is **Empty**."*

  Clarify Emptiness immediately:
  *"Emptiness is not a fifth box. It is not a void. It is the fact that the City works **because** it has no fixed nature. The Bridge holds you *because* it isn't inherently a bridge; it's wood and nails and agreement. If it were inherently a Bridge, it could never be built or destroyed."*

  **3. Apply to the Novel (10 mins)**
  Bring it back to your philosopher-monk and her sister's ghost.
  *"Your monk is trying to put the ghost in Box 1, 2, 3, or 4. The practice isn't finding the right box. It's realizing the ghost is like the City. It appears, it affects her, but it has no 'ghost-nature' to classify. The grief is real *because* it is empty. If the grief were solid and inherent, it could never change or heal."*

  ---

  ### Predicted Failures (The "Bug Report")

  Here is what will go wrong when you run this next Tuesday.

  **1. The "Neither" Trap (Group 4)**
  *   **The Error:** Writers love Box 4. They will treat "Neither" as "Magical Realism" or "It's a metaphor." They will say, "It's neither real nor unreal because it's *art*."
  *   **The Fix:** You must ban the word "metaphor." "Neither" in this context doesn't mean "symbolic." It means the predicates "real" and "unreal" are category errors, like asking "What color is jealousy?" It's not that jealousy is a invisible color; it's that color doesn't apply. If Group 4 gets cozy, hit them with: *"Is 'Neither' a state of being? If yes, you're back in Box 1."*

  **2. The Nihilism Slide (Group 2)**
  *   **The Error:** Group 2 will argue the City is "fake" and therefore "doesn't matter." This is nihilism, not emptiness.
  *   **The Fix:** Remind them of the chips. They care about the chips. The chips are conventional truth. *"If the City doesn't exist, why are you losing chips over it?"* Emptiness preserves function; nihilism destroys it.

  **3. The "Winning" Mentality**
  *   **The Error:** Competitive writers will try to "solve" the logic to keep their chips. They will create convoluted definitions to protect their corner.
  *   **The Fix:** You must intervene heavily. If someone makes a clever save that relies on semantic trickery, call it out. *"You're hiding in language. Does the River actually remember, or is that just a phrase?"* The goal is bankruptcy, not solvency.

  **4. Reifying Emptiness**
  *   **The Error:** In the debrief, someone will ask, "So what is the City then? Is it Energy? Vibrations?"
  *   **The Fix:** Shut this down. Emptiness is not a substance. It is not "quantum physics." It is simply the lack of independent existence. Do not let them fill the void with new dogma.

  ---

  ### What This Exercise Cannot Do (The Missing Piece)

  You need to be frank with yourself (and optionally the group) about the limitations of this workshop.

  **1. It is Conceptual, Not Experiential**
  This game creates **intellectual understanding** (understanding the limits of logic). It does not create **realization** (the non-conceptual direct perception of emptiness).
  *   *The Gap:* Your monk doesn't just *think* the categories fail; she *feels* the ground drop out. This exercise is a map of that drop, not the drop itself.
  *   *Your Job:* You must supply the emotional weight. In the debrief, ask them: *"How did it feel when your argument collapsed? Frustrating? Relieving?"* That frustration is the closest intellectual proxy for the "loss of ground."

  **2. It Misses "Compassionate Function"**
  Madhyamaka isn't just about breaking logic; it's about why emptiness allows for compassion. If nothing has a fixed self, change is possible. Suffering is not solid.
  *   *Your Job:* You must explicitly connect the logic to the *sister*. "Because the ghost is empty, she can be let go. If she were inherently real, she would be stuck forever. If she were inherently unreal, the grief would be a lie." The logic must serve the emotion.

  **3. It Risks Cynicism**
  Smart fiction writers can walk away thinking, "Nothing matters, it's all just empty labels."
  *   *Your Job:* Emphasize **Dependent Origination**. Things matter *more* because they are fragile and dependent, not less. The bad coffee matters. The workshop matters. The sister matters. Precisely because they aren't fixed, they are precious.

  ### Facilitator Cheat Sheet (Keep this in your pocket)

  *   **If Group 1 gets stuck:** Ask "Is it one or many?" (If one, where are the parts? If many, where is the unity?)
  *   **If Group 4 gets cocky:** Ask "Is 'Neither' a position?" (If yes, it's Box 1. If no, why are you defending it?)
  *   **If the energy dips:** Throw a chip into the center. "Who wants this? Why? Does it exist?"
  *   **The Golden Line:** "Emptiness is not the absence of things. It is the absence of *independent* things."

  Good luck with the workshop. If the coffee is bad, use it. "Is this coffee inherently bad, or does it depend on our expectation?" There's your opening gambit.
