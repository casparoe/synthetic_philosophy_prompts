answer: |-
  Your friend has reconstructed a version of the 'collapse objection' that has haunted indirect consequentialism since Smart's *Extreme and Restricted Utilitarianism*. It is a formidable argument because it exploits the tension between the *authority* of the criterion and the *psychology* of the agent. However, while the argument is valid, it is not sound. The error lies in a subtle conflation in Step (5).

  Here is the diagnosis.

  ### The Step to Reject: (5)

  You should reject Step (5): *"That estimate is precisely the first-order consequentialist calculation whose cost was the original reason for abandoning first-order consequentialist calculation."*

  **Why it looked sound:**
  This step is seductive because it assumes that if a judgment is justified by its consequences, the *process* of making that judgment must involve weighing those consequences. It conflates **tracking** the criterion with **calculating** the criterion. It assumes that because the *reason* for overriding a disposition is consequentialist (i.e., 'following this will cause disaster'), the *mental act* of deciding to override must be a consequentialist calculation (i.e., 'let me sum up the utilities').

  **Why it is false:**
  One can track a target without aiming at it via the same mechanism used to define the target. A thermostat tracks temperature without performing thermodynamics; a sailor tracks the wind without calculating fluid dynamics. Similarly, an agent can possess a 'circuit-breaker' disposition that is sensitive to catastrophic consequences without engaging in the costly, error-prone process of expected value maximisation.

  When you face a situation where keeping a promise seems to cause disaster, you do not need to open a spreadsheet of utilities. You need only recognise a salient feature of the situation (e.g., 'someone will die', 'a child is in pain') that your dispositions have been trained to treat as a trigger for suspension. This recognition is a perceptual or intuitive judgment, not a deliberative calculation. It avoids the costs cited in your original rationale (rationalisation, corrosion of commitment) because it is rare, heuristic, and does not invite the agent to treat every moral demand as a variable in an equation.

  ### The Cost of Rejection

  Rejecting Step (5) saves the Split View from collapse, but it extracts a price. You cannot maintain the claim that your decision procedure is strictly **non-consequentialist**.

  If you accept that the 'porosity' of your dispositions is justified by their ability to track bad consequences via heuristics, you must admit that your procedure is **consequentially calibrated**. It is not a set of deontological rules that happen to have good effects; it is a set of heuristic tools designed to approximate the criterion without invoking the criterion's calculus.

  **What must be softened:**
  You must soften the distinction between the criterion and the procedure. You can no longer say, "The criterion is consequentialist, but the procedure is deontological." Instead, you must say, "The criterion is consequentialist, and the procedure is a *consequentially optimised* set of non-calculative dispositions."

  This does not destroy your view, but it prevents you from claiming that the non-consequentialist nature of your deliberations has any intrinsic moral worth. Their value remains entirely instrumental. If empirical psychology showed that direct calculation was actually more reliable for agents like us, you would be committed to abandoning your dispositions. This makes your view 'esoteric' in a sense: the truth of the theory (that consequences are all that matter) must be hidden from the agent's conscious deliberation to work best.

  ### The Sealed/Porous Dichotomy

  Your friend's dichotomy in Step (2) between 'sealed' and 'porous' is a false dilemma because it assumes that porosity requires *occurrent calculation*.

  **The Distinction Being Run Together:**
  The argument runs together **dispositional sensitivity** with **deliberative calculation**.
  *   **Sealed:** The disposition never yields.
  *   **Porous (Friend's definition):** The agent calculates expected value to decide whether to yield.
  *   **The Missing Third Option:** **Heuristically Porous.** The disposition yields when triggered by specific, high-salience features (e.g., 'catastrophe', 'cruelty') that correlate with disastrous consequences, without the agent performing a global utility assessment.

  **What a Genuine Third Option Looks Like:**
  For this to be more than a relabelling, the 'handover rule' (the rule for when to override) must not be a rule for *thinking*, but a rule for *feeling* or *perceiving*.
  It looks like this: "Keep your promises, unless you encounter a situation that triggers your trained aversion to catastrophe."
  Crucially, the agent does not ask, "Is the value higher if I break this?" They ask, "Does this situation feel like the exception my training warned me about?"
  This preserves the ban on first-order calculation (saving your rationale) while avoiding rule-worship (saving the criterion).

  ### A Note on the Generalisation (Step 7)

  Your friend generalises this to the 'Ideal Deliberation' view (what you would want if fully informed). They argue you still need a handover rule to decide when to defer to your ideal self.
  Rejecting Step (5) helps here too. The 'handover' to your ideal self need not be a calculated decision. It can be a matter of **psychological capacity**. You defer to your ideal self when you are calm, informed, and unpressured; you defer to your dispositions when you are tired, emotional, or ignorant.
  The 'rule' is not a conscious calculation of when you are likely to match your ideal self; it is a meta-disposition to recognise your own cognitive limitations. You do not calculate "Am I biased?"; you learn to recognise the *feeling* of bias. This avoids the infinite regress of calculating when to calculate.

  ### Summary

  Your friend's argument is a classic trap, but it snaps shut only if you accept that tracking consequences requires calculating them. By rejecting Step (5), you can maintain that the best way to maximise value is to cultivate dispositions that generally ignore value, save for rare, heuristic-driven exceptions. You pay for this stability by admitting that your procedure is not truly non-consequentialist, but rather a consequentialist strategy that disguises itself to function effectively. Given that your view is already justified consequentially, this seems a price worth paying.
