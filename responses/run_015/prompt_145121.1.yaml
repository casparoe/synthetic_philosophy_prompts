answer: |-
  The board of a private school must sanction a senior master who knowingly falsified student records to protect the school's ranking; both theories agree he is fully culpable and merits suspension without pay. The standard sanction for this breach is one month's suspension, which typically causes significant financial stress for staff. However, this master possesses independent generational wealth, rendering the loss of one month's salary negligible to his lifestyle, whereas a three-month suspension would impose a deprivation comparable to what an ordinary teacher feels in one. The consequentialist board member argues that the public stigma of the suspension, coupled with the standard one-month term, sufficiently signals to the faculty that record-falsification is punished, and extending the term yields no marginal increase in general deterrence. The retributivist board member insists that justice requires the offender to *bear* a burden proportional to the moral gravity of the lie, and since the one-month term imposes no real burden on him, it fails to satisfy the debt of justice; therefore, the suspension must be extended to three months to equate the *impact* of the punishment with the *severity* of the wrong.

  **Recommendations and Reasoning**
  *   **Consequentialist:** Recommends the **one-month suspension**. The reasoning is that the utility of punishment lies in its capacity to deter future violations by others (general deterrence) and reinforce norms. The *fact* of the suspension creates the necessary stigma and signal; extending the duration provides diminishing returns on deterrence while inflicting suffering that produces no additional social good.
  *   **Retributivist:** Recommends the **three-month suspension**. The reasoning is that punishment is a moral debt owed by the offender. To be proportional, the punishment must deprive the offender of a good (income/security) to a degree that matches the harm of the offense. If the standard term does not "hurt" the offender commensurately due to his insulation from loss, it is not truly proportional *to him*; the severity must be calibrated to ensure the *experienced deprivation* matches the desert.

  **The Single Feature**
  The feature doing the work is the **offender's exceptional capacity to absorb the standard sanction without meaningful deprivation** (extreme wealth/financial insulation).

  **The Collapse**
  If this feature is removed—i.e., if the master is of average means relying on his salary—the one-month suspension imposes a significant hardship. The consequentialist is satisfied because the signal is sent and the hardship ensures specific deterrence. The retributivist is satisfied because the hardship now matches the moral gravity of the offense. Both theories converge on the standard one-month sanction; the divergence exists solely because the offender's wealth decouples the *nominal* penalty from the *experienced* penalty.

  **The Retributivist Objection**
  **Objection:** A strict retributivist should argue that desert is **objective**, not subjective. Punishment should be proportional to the *wrongdoing*, not the *sensitivity* of the wrongdoer. If two people commit the same crime, they deserve the same punishment, regardless of whether one is stoic and the other sensitive, or one rich and the other poor. To scale punishment based on wealth is to punish the offender for his circumstances (wealth) rather than his act, violating the principle that punishment must be for the crime alone.

  **Evaluation:** This objection **works** against "Equal Impact" retributivism but relies on a specific definition of proportionality. If retributivism is defined as *lex talionis* (an eye for an eye) or objective ranking of crimes, the objection holds: the punishment should fit the act, not the actor's skin thickness. However, if retributivism is defined as restoring moral equilibrium through *suffering* (as Hegel or some modern theorists suggest), then a penalty that causes no suffering fails to restore equilibrium. The objection succeeds in showing that the scenario requires a specific *subjective* variant of retributivism, but it does not refute the core claim that a penalty which fails to register as a penalty is unjust.
