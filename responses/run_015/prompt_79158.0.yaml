prompt: |-
  I am a novelist, some way into my fourth book, and I have hit a scene I cannot yet write. The central figure is a philosopher of physics who believes that time does not pass; in the scene in question she defends that belief against a colleague, and I need to understand the strongest form of one particular argument for it well enough to put it in her mouth without embarrassing myself in front of readers who know the field. I am not asking you to draft the scene. I am asking you to make me understand the argument, and to be honest with me about where it is weak.

  Please take the role of a philosopher of physics who is also a patient expositor. Before you write anything, spend a little space thinking the argument through for yourself: set out the several readings of it you can see, say which you take to be the strongest and why, and then set the weak ones aside. Take your time; I would rather have four points made properly than a complete-looking list. I have more than school physics — I can read a spacetime diagram, I know what an inertial frame is, I know that simultaneity is frame-relative — but I am not a philosopher, and you should not assume I already know the labels that specialists use for the positions here. Teach me the vocabulary as it becomes necessary.

  The argument, as it was put to me by a friend, runs roughly as follows. Special relativity tells us that for any event that is spacelike separated from me here and now, there is an inertial frame in which that event is simultaneous with my now. If being simultaneous with my now is what it is for an event to be real for me, then that distant event is real for me now. Now take a second event, spacelike separated from the first but lying in my future, and an observer for whom that second event is simultaneous with her now; the second event is real for her, and if what is real for someone is real, then it is real for me as well, even though it lies in my future. Repeat the step, walking outward in spacelike increments, and every event in spacetime turns out to be real now: there is no objective present, and the future is as real as the past. The argument strikes me as suspiciously cheap, and also as hard to escape.

  What I would like from you:

  1. The argument set out as an explicit chain, each step labelled as a premise or as an inference, with the one step that is doing the controversial work identified and explained rather than merely named.

  2. Whether transitivity is essential. The argument plainly needs the relation it trades in — call it being real as of a time — to carry across steps. If we grant that this relation is frame-relative but deny that it is transitive, does any form of the conclusion survive? If we keep transitivity and symmetry but give up something else, what exactly gives way? I want to see where the load falls, not a verdict.

  3. The reply that simultaneity in relativity is a matter of convention, and that the frame-relative simultaneity the argument leans on is therefore not the real-together relation it needs. Does this reply block the argument, or must it assume the very thing it sets out to deny? And if we confine ourselves to relations that can be defined from the causal structure of spacetime alone, with nothing added by hand, does the reply still stand? I was told once that any non-trivial relation of that sort, if it is transitive, comes out frame-relative; I do not know whether that is true, and I would like to know what follows either way.

  4. Whether this is an argument from special relativity alone, or from relativity plus an unstated metaphysics of becoming. If it is the latter, tell me what the smallest additional premise would have to be, and whether that premise is one a physicist could be argued into.

  5. Whether the conclusion is substantive or verbal. It sometimes seems to me that the argument only spells out the fact that there is no frame-independent now, dressed up as a thesis about what exists. How would I tell the trivial reading from the strong one, and can the strong reading — everything equally real — be had without begging a question about the reality of the present?

  6. Whether any of this has to do with determinism or fatalism. My character is not a determinist, and I would rather she not sound like one; tell me what the argument does and does not license on that front.

  7. One concrete case I can hold in my head, friendly to a diagram, and if it helps, the version in which a person walking down a street alters which events in a distant galaxy count as happening now. Tell me what that case does and does not show, and say plainly which nearby case would mislead me, and why.

  Two constraints. First, do not give me citations, a reading list, or a survey of who has said what; if you need to name a position, state it in your own words and move on, and I will add the sources myself later. Second, where the argument is genuinely inconclusive, or where a step depends on a choice of convention, say so instead of smoothing it over. A map of the uncertainty is worth more to me than a tidy verdict. If, at the end, you think the argument is stronger than its critics allow, say that too, and say why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing a book featuring a philosopher of physics. Needs to understand the "Rietdijk-Putnam Argument" (though not named yet) for the block universe/eternalism.
      *   **Goal:** Understand the argument deeply enough to write a dialogue scene without embarrassing themselves in front of knowledgeable readers. Needs to know strengths, weaknesses, and nuances.
      *   **Role:** Philosopher of physics, patient expositor.
      *   **Constraints:**
          *   Think through the argument first (show work).
          *   No citations/reading lists (state positions in own words).
          *   Be honest about uncertainties/weaknesses (map the uncertainty).
          *   Address 7 specific points (Argument chain, Transitivity, Conventionality, SR + Metaphysics, Substantive vs. Verbal, Determinism, Concrete Case).
          *   User has physics background (spacetime diagrams, inertial frames, simultaneity) but not philosophy background (teach vocabulary).
          *   Tone: Rigorous but accessible, honest about where the philosophy gets messy.

  2.  **Deconstruct the Argument (The "Rietdijk-Putnam" Argument):**
      *   *Core Intuition:* Relativity of Simultaneity + Transitivity of "Realness" = Block Universe.
      *   *Physics:* Special Relativity (SR). Spacelike separation implies frame-dependent simultaneity.
      *   *Metaphysics:* Presentism (only now is real) vs. Eternalism (all times equally real).
      *   *The Trick:* Chaining simultaneity relations across different observers to make a future event "present" for someone, and thus "real" for everyone.

  3.  **Address the 7 Points (Drafting & Refining):**

      *   *Point 1: The Chain.* Need to formalize the friend's description.
          *   P1: Relativity of Simultaneity (Physics).
          *   P2: Principle of No Privileged Frame (Physics/Methodology).
          *   P3: Relation of "Reality" is transitive (Metaphysics).
          *   P4: "Real for X" implies "Real simpliciter" (Metaphysics).
          *   *Controversial Step:* Usually P3 or the definition of "Real for X". The move from "simultaneous with" to "co-real" is the crux.

      *   *Point 2: Transitivity.*
          *   If "Real for" isn't transitive, the chain breaks.
          *   If "Simultaneous with" isn't transitive (it isn't across frames), does "Real" inherit that?
          *   If we deny transitivity of reality, we save Presentism but make "reality" a very local, fragmented notion.
          *   Load falls on whether existence can be relative.

      *   *Point 3: Conventionality.*
          *   Reichenbach's conventionality of simultaneity.
          *   If simultaneity is just a coordinate choice, does it track ontology?
          *   Causal structure (light cones) is invariant. Simultaneity slices are not.
          *   If we stick *only* to causal structure, we get the light cone, not a "now" slice. This actually hurts Presentism more than Eternalism in some views, but helps the "Conventionality" rebuttal.
          *   Malament's theorem (maybe too technical? Keep it conceptual): Causal structure fixes the geometry, but not the foliation.

      *   *Point 4: SR + Metaphysics.*
          *   SR alone doesn't say what exists. It says how measurements relate.
          *   Need a bridge principle: "If event E is simultaneous with observer O's now, E is real for O."
          *   This is the metaphysical add-on. Physicists might resist "real for O".

      *   *Point 5: Substantive vs. Verbal.*
          *   Is "Block Universe" just saying "coordinates don't pick out existence"?
          *   Strong reading: Future events exist *now* (tenselessly).
          *   Weak reading: There is no objective property of "presentness".
          *   Danger of begging the question: Defining "real" as "in the spacetime manifold" assumes the conclusion.

      *   *Point 6: Determinism.*
          *   Crucial distinction. Block Universe $\neq$ Determinism.
          *   Block Universe = Ontology (what exists).
          *   Determinism = Dynamics (how states evolve).
          *   Quantum mechanics (indeterministic) can live in a Block Universe (many worlds or just fixed probabilities).
          *   Character can be an indeterminist eternalist.

      *   *Point 7: Concrete Case (Andromeda Paradox).*
          *   Penrose's example. Walking towards/away from Andromeda changes the "now" slice there by days.
          *   Shows the *relativity* of the slice.
          *   Does not show that the *events* change.
          *   Misleading case: Thinking the walker *causes* the event or changes the outcome.

  4.  **Refining the "Think Aloud" Section:**
      *   I need to explicitly show the internal deliberation before the main response, as requested ("Before you write anything, spend a little space thinking the argument through for yourself...").
      *   I need to identify the strongest reading. The strongest reading relies on the *transitivity of existence* combined with the *relativity of simultaneity*.
      *   Weak readings: Relying on "seeing" (optical delay) instead of simultaneity conventions.
      *   Vocabulary: Eternalism, Presentism, Block Universe, Simultaneity, Spacelike, Transitivity.

  5.  **Drafting the Content (Iterative refinement for tone and accuracy):**
      *   *Tone Check:* Am I being too academic? Keep it conversational but precise. "Patient expositor."
      *   *Accuracy Check:* Ensure I don't conflate conventionality of simultaneity (Reichenbach) with relativity of simultaneity (Einstein). The argument relies on the latter, but the rebuttal often uses the former.
      *   *Honesty Check:* Acknowledge that this is still debated. It's not a settled proof. The "Putnam" argument is famous but controversial.
      *   *Constraint Check:* No citations. (Don't say "Rietdijk-Putnam", describe it). Don't say "Malament's Theorem", describe the causal structure result.

  6.  **Final Polish:**
      *   Ensure the 7 points are clearly addressed.
      *   Make sure the distinction between "real for X" and "real simpliciter" is clear.
      *   Ensure the determinism point is crisp (this is a common confusion).
      *   Check the "Andromeda" example for clarity.

      *(Self-Correction during drafting)*: I initially thought about bringing in General Relativity. *Correction:* No, keep it to Special Relativity as per the prompt's setup. GR complicates global simultaneity even more, but might distract from the core logical argument. Stick to flat spacetime.
      *(Self-Correction on Transitivity)*: Be careful. Simultaneity *within a frame* is transitive. Simultaneity *across frames* is not. The argument tries to bridge frames via "Reality". That's the weak link.

  7.  **Final Review against constraints:**
      *   Think aloud first? Yes.
      *   7 points covered? Yes.
      *   No citations? Yes.
      *   Honest about uncertainty? Yes.
      *   Physics level appropriate? Yes (assume they know Minkowski diagrams).

      *Let's structure the "Think Aloud" as a preamble, then the main response.*

      *(Wait, one more thing)*: The prompt asks me to "spend a little space thinking the argument through for yourself... and then set the weak ones aside." This should be part of the output, not hidden reasoning. I will include a section titled "Preliminary Thinking" before the numbered response.

      *(Refining the "Conventionality" point)*: This is tricky. If simultaneity is conventional, does the argument fail? If I choose a different synchronization convention, the "now" slice tilts differently. But *any* foliation by spacelike hypersurfaces works. The argument doesn't depend on *which* slice, just that *some* slice connects me to the future event via a chain. So conventionality weakens the specific *definition* of "now", but not the geometric fact that future events are spacelike separated from some past observer. I need to be precise here. The argument relies on the *structure* of light cones, not the specific Einstein synchronization, though Einstein sync is the standard way to express it. Actually, the strongest version relies on the invariant causal structure. If event A is in the future of B, they are timelike. If A is spacelike to C... okay, the chain argument specifically uses the relativity of simultaneity. I will focus on the transitivity of "co-reality".

      *(Refining the "Determinism" point)*: Make sure to emphasize that "fixed" does not mean "causally determined". The future is "there" but not necessarily "caused by the past" in a clockwork sense.

      *Okay, ready to write.*
answer: |-
  ### Preliminary Thinking

  Before I lay out the argument for you, I need to do exactly what you asked: sort through the different ways this reasoning can be understood, identify the strongest version, and discard the weak ones. This will help us know exactly what your character is defending.

  **Reading 1: The Optical Illusion Version (Weak)**
  This reading suggests that because light takes time to reach us, we "see" the past, and because different observers move differently, they "see" different things.
  *Verdict:* Discard. This confuses *observation* with *existence*. Your character knows better. The argument isn't about when light hits a retina; it's about the geometric structure of spacetime.

  **Reading 2: The Coordinate Version (Medium)**
  This reading says that because we can assign a time coordinate $t=0$ to a future event in some reference frame, that event exists.
  *Verdict:* Too thin. Coordinates are just labels. We can label a future event "now" on a piece of paper, but that doesn't prove it *exists* now. This invites the criticism that your character is confusing map with territory.

  **Reading 3: The Ontological Transitivity Version (Strong)**
  This is the one your friend described. It treats "being real" as a relationship between events and observers. It argues that if Event A is real for Observer 1, and Observer 1 considers Event B to be "now" (and thus real), and reality is a transitive property (if A is real, and B is real for A, then B is real), then the chain extends to the future.
  *Verdict:* This is the one. It forces a clash between the physics (Relativity of Simultaneity) and a metaphysical assumption (Transitivity of Existence). It is the hardest to refute without giving up something significant.

  **The Vocabulary We Will Need:**
  *   **Presentism:** The view that only the present moment exists. The past is gone; the future is not yet.
  *   **Eternalism (or the Block Universe):** The view that past, present, and future events all equally exist. Time is like a dimension of space; "now" is just a location, not a privileged state of being.
  *   **Simultaneity:** The relation of happening at the same time. In relativity, this is frame-dependent.
  *   **Transitivity:** A property of relationships. If A is related to B, and B is related to C, then A is related to C. (Example: "Taller than" is transitive. "Father of" is not).
  *   **Spacelike Separation:** Two events are far enough apart in space and close enough in time that no signal (even light) could travel between them. Their time order depends on the observer.

  Now, let us walk through the seven points you requested.

  ***

  ### 1. The Argument Chain

  Here is the argument reconstructed as a formal chain. I have highlighted the step that carries the metaphysical weight.

  *   **Premise 1 (Physics):** In Special Relativity, simultaneity is relative to an inertial frame. For any two events spacelike separated from each other, there exists some inertial frame where they are simultaneous.
  *   **Premise 2 (No Privilege):** There is no physically privileged inertial frame. If a frame says an event is "now," that claim is as valid as any other frame's claim.
  *   **Premise 3 (The Bridge Principle):** If an event is simultaneous with an observer's "now," that event is **real for** that observer. (This equates "present" with "real").
  *   **Premise 4 (Transitivity of Reality):** If Event A is real for Observer X, and Event B is real for Observer X, then Event A and Event B are both real *simpliciter* (in an absolute sense). More crucially: If Event A is real, and Event B is real for A, then Event B is real.
  *   **Inference (The Chain):**
      1.  I am here now (Event Me-Now). I am real.
      2.  There is a distant Event D (spacelike separated). There is an observer moving relative to me for whom Event D is simultaneous with Me-Now.
      3.  By Premise 3, Event D is real for that observer.
      4.  By Premise 2, that observer's judgment is as valid as mine. So Event D is real for me too.
      5.  Now consider Event F, which is in my absolute future. Event F is spacelike separated from Event D.
      6.  There is a third observer for whom Event D and Event F are simultaneous.
      7.  By Premise 3, Event F is real for the third observer.
      8.  Since Event D is real (from step 4), and Event F is real for an observer at Event D...
      9.  **By Premise 4 (Transitivity):** Event F is real for me.
  *   **Conclusion:** Future events are just as real as present events. There is no objective "flow" of time; all events in spacetime exist equally.

  **The Controversial Step:**
  The heavy lifting is done by **Premise 3 and Premise 4 combined**.
  Premise 3 assumes that "simultaneous with my now" is the criterion for reality. Premise 4 assumes that "reality" cannot be relative. If I say "X is real for me" and you say "Y is real for you," Premise 4 insists we must agree on a single list of real things.
  The argument works by taking a relation that physics says is *relative* (simultaneity) and forcing it through a metaphysical filter that demands *absoluteness* (existence). The tension creates the conclusion: if existence must be absolute, but simultaneity is relative, then existence cannot depend on simultaneity in the way Presentists think. It must cover everything.

  ### 2. The Role of Transitivity

  You asked if transitivity is essential. Yes, it is the load-bearing wall.

  If we deny that "being real for" is transitive, the chain breaks at step 9. We could say: "Event D is real for Observer 1. Event F is real for Observer 2. But that doesn't mean Event F is real for Me."
  This saves Presentism, but at a high cost. It implies that **existence itself is frame-relative.**
  *   **Consequence:** There is no single universe we all share. There is "my universe" (what is real for me) and "your universe" (what is real for you), and they overlap but are not identical.
  *   **Does the conclusion survive?** No. The Block Universe conclusion (that *everything* exists absolutely) vanishes. Instead, you get a fragmented ontology.
  *   **What gives way?** If we keep transitivity but give up something else, we usually have to give up **Premise 2 (No Privilege)**. We would have to say there *is* a true frame of reference (a "God's eye view") that defines the true Present, and relativity just hides it from us. This is physically possible (Lorentzian Ether Theory), but most physicists find it inelegant because it posits an undetectable structure.

  **Summary for your character:** If she wants to defend the Block Universe, she must insist that "existence" cannot be a matter of perspective. If something exists for one valid observer, it must exist for all. That insistence, combined with relativity, forces the future to exist.

  ### 3. Conventionality and Causal Structure

  This is a sophisticated objection. It asks: Is "simultaneity" a real physical relation, or just a human convention for setting clocks?

  *   **The Objection:** In relativity, to say two distant events are simultaneous, you have to synchronize clocks. The standard method (Einstein synchronization) assumes light speed is constant in both directions. But you can choose *different* synchronization conventions. If simultaneity is just a convention, you can't build an ontology (a theory of what exists) on it. You can't say the future exists just because of how we set our watches.
  *   **Does it block the argument?** It weakens the specific formulation using "simultaneity slices," but it does not kill the core intuition. Even if the *slice* is conventional, the **causal structure** is not.
  *   **Causal Structure:** What is invariant (agreed on by all observers) is the light cone. Everyone agrees on what events can influence me (past light cone) and what I can influence (future light cone). Events outside the cone (spacelike) cannot influence me.
  *   **The Trap:** If we confine ourselves *only* to relations definable from causal structure, we find that there is **no transitive relation of "co-reality"** that picks out a "present moment."
      *   If you define "real with me" as "spacelike separated from me," that relation is not transitive. (A is spacelike to B, B is spacelike to C, but A might be in the past of C).
      *   If you define "real with me" as "in my past light cone," you save transitivity, but you lose the "Present." You only have the "Past."
  *   **The Result:** This reply suggests the argument relies on importing a notion of "Present" that spacetime geometry doesn't actually support. However, your character can turn this around. She can argue: "Exactly. Spacetime geometry does not support a moving Present. It supports a static manifold. The fact that no causal relation picks out a 'now' proves there is no objective 'now'."
  *   **Honesty Check:** This is genuinely inconclusive. It depends on whether you think "existence" needs to be grounded in causal connections. If your character believes existence is grounded in *geometry* (the manifold itself), the conventionality objection doesn't hurt her. If she believes existence is grounded in *causality*, it does.

  ### 4. Special Relativity vs. Metaphysics

  Is this an argument from physics alone? **No.**
  Special Relativity is a theory about measurements, coordinates, and light propagation. It does not contain the word "exist."

  *   **The Unstated Premise:** To get from SR to the Block Universe, you need a metaphysical bridge. The smallest additional premise is: **"The physical structure of spacetime exhausts ontological reality."**
      *   In plain English: If the math treats time as a dimension like space, then time *is* a dimension like space. There is no extra "magic" of becoming that the math misses.
  *   **Can a physicist be argued into this?** Many are, but not all.
      *   *The Physicist's Resistance:* A physicist might say, "My equations work regardless of whether the future exists. I don't need to know that to calculate particle collisions. Ontology is philosophy, not physics."
      *   *The Physicist's Acceptance:* A physicist might say, "I refuse to believe in invisible, undetectable properties. If there is no physical measurement that can detect the 'flow' of time, I will not believe it exists."
  *   **For your character:** She should acknowledge this. She shouldn't say "Relativity proves the future exists." She should say, "Relativity leaves no room for a privileged present, and I see no reason to invent one."

  ### 5. Substantive vs. Verbal

  This is a keen insight on your part. Is the Block Universe just a fancy way of saying "There is no frame-independent now"?

  *   **The Verbal Reading:** "To say the future exists is just to say that the statement 'Event F is happening now' has no objective truth value." This is deflationary. It just cleans up language.
  *   **The Substantive Reading:** "Event F is *ontologically on a par* with Event Me-Now." This means I could, in principle, travel to it (if I could move faster than light), just as I can travel to Paris. It is *there*.
  *   **How to tell the difference:** The substantive reading makes a claim about **truthmakers**. What makes the statement "A battle will occur tomorrow" true *today*?
      *   *Presentist:* Nothing makes it true yet. It is indeterminate.
      *   *Eternalist:* The event itself, located in the future, makes the statement true.
  *   **Begging the Question:** The argument risks begging the question if it defines "real" as "located in the spacetime manifold." If you define reality that way, of course the future is real.
  *   **Defense:** Your character avoids this by arguing from **parity**. "We agree the past is real (memories, records, fossils). Relativity treats past and future coordinates symmetrically. To deny the future is real while accepting the past is real requires a physical distinction that relativity does not provide." She argues from the *lack of distinction* rather than a definition.

  ### 6. Determinism and Fatalism

  This is critical for your character. She must not sound like a fatalist.

  *   **The Distinction:**
      *   **Determinism:** The state of the past *forces* the state of the future. (Cause $\rightarrow$ Effect).
      *   **Eternalism (Block Universe):** The future *exists*. (Existence $\neq$ Causation).
  *   **The Compatibility:** You can have a Block Universe that is indeterministic. Imagine a universe where quantum events are truly random. In the Block Universe picture, those random outcomes are "fixed" in the block, but they were not *caused* by the past to be that way. They are just brute facts located at certain coordinates.
  *   **Analogy:** Think of a book. The ending is written (Eternalism). But the characters inside the book still make choices that lead to the ending (Agency). The fact that the page exists doesn't mean the plot was logically forced; it just means the story is complete.
  *   **What the argument licenses:** It licenses the view that **truths about the future are already true.** (e.g., "It is true now that I will drink coffee tomorrow").
  *   **What it does NOT license:** It does not license the view that **I cannot choose otherwise.** Your character can say: "The future is real, but it is not determined by the past. It is simply *there*, waiting to be experienced. My choices are part of the structure of the block, not illusions."
  *   **Warning:** Avoid the phrase "The future is fixed." Use "The future is definite" or "The future exists." "Fixed" implies a lock; "exists" implies a location.

  ### 7. The Concrete Case: The Andromeda Paradox

  This is the specific example you mentioned (often attributed to Roger Penrose). It is excellent for a diagram.

  *   **The Setup:**
      *   Imagine the Andromeda Galaxy is 2.5 million light-years away.
      *   Two people pass each other on a street on Earth. One is walking *towards* Andromeda; the other is walking *away*.
      *   Because they have different velocities, their "planes of simultaneity" tilt relative to each other.
  *   **The Calculation:**
      *   Due to the vast distance, a tiny difference in velocity creates a huge difference in what they consider "now" on Andromeda.
      *   For the person walking towards Andromeda, an alien fleet might have *already launched* "now."
      *   For the person walking away, the decision to launch hasn't been made "yet."
      *   The difference in "now" can be days or weeks.
  *   **What this shows:**
      *   It vividly demonstrates that "what is happening now" at a distance is not a fact of the world, but a relation between the world and an observer's motion.
      *   It supports the idea that there is no universal "Now."
  *   **What this does NOT show:**
      *   It does not show that the walker *causes* the launch.
      *   It does not show that the launch is uncertain for one and certain for the other. (In the Block Universe, the launch either exists or it doesn't; the walkers just slice the block differently).
  *   **The Misleading Case (Avoid This):**
      *   Do not let your character imply that by turning around, the observer *changes* the reality of Andromeda. That sounds like magic or quantum observer effects.
      *   **Correct phrasing:** "By turning around, I change which slice of the block I call 'present.' I do not change the block."
  *   **Diagram Tip:** Draw a spacetime diagram. Vertical axis = Time, Horizontal = Space. Draw the light cone from Earth. Draw Andromeda as a vertical line far to the right. Draw two lines through "Earth-Now" with slightly different slopes (the two walkers). Extend those lines to Andromeda. Show how they intersect the Andromeda line at very different points. That gap is the "days of difference."

  ### Final Assessment: Strength and Weakness

  You asked me to be honest about where the argument stands.

  **Where it is Strong:**
  It is extremely difficult to maintain Presentism (only "now" exists) without positing a privileged reference frame that physics cannot detect. If your character values **ontological parsimony** (don't multiply entities beyond necessity), the Block Universe is the winner. It takes the physics at face value without adding hidden "presentness" properties.

  **Where it is Weak:**
  It relies on the assumption that "existence" must be transitive and absolute. Some philosophers argue that existence *is* tensed. They accept that "Event F is real for Observer 2" does not imply "Event F is real for Me." This saves the flow of time but makes reality fragmented.
  Furthermore, the argument assumes Special Relativity is the final word on time. If General Relativity or Quantum Gravity introduces a preferred time parameter (which some theories do), the argument collapses.

  **Verdict for the Novelist:**
  The argument is not a mathematical proof; it is a **best-explanation inference**.
  Your character should not say, "Relativity proves the future exists."
  She should say, "Relativity makes the existence of a moving present physically undetectable and theoretically redundant. I choose to believe in what the theory describes, not in what it excludes."

  This makes her sound like a rigorous thinker who knows the difference between a equation and an interpretation, which is exactly what you want for a philosopher of physics.
