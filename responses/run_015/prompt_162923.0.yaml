answer: |-
  ### Diagnostic Questions

  1.  **Locus of Risk:** Is the primary threat to legitimacy located in the *competence of the voters* (information, judgment) or the *structure of the mechanism* (binary framing, agenda control), or is there *no significant deficit*?
  2.  **Issue Scalability:** Does this risk persist equally across all topics, or does it diminish significantly for high-salience, low-technicality questions?
  3.  **Substantive Constraints:** Are there specific subject matters (e.g., minority rights, fiscal rules) that are inherently off-limits to direct majority vote regardless of procedure?
  4.  **Counterfactual Baseline:** Is the referendum outcome judged against an *ideal* decision procedure or against the *likely legislative alternative*?
  5.  **Temporal Binding:** Does a successful vote create a permanent mandate, or does its binding force decay as the electorate and factual landscape change?

  ***

  ### Map of Positions (The Leaves)

  **1. Populist / Plebiscitary**
  *   **Answers:** No Deficit | N/A | No Constraints | Legislative Baseline (Parliament is corrupt) | Permanent Mandate.
  *   **Awkward Commitment:** Must defend the wisdom of a majority voting to cap property taxes without understanding the long-term budgetary consequences.

  **2. Swiss-Style Semi-Direct**
  *   **Answers:** Low Deficit | Diminishes on Salience | Some Constraints (Constitutional core) | Complementary to Legislature | Reversible (Decay via new vote).
  *   **Awkward Commitment:** Must accept that complex fiscal propositions pass simply because they clear high signature thresholds, not because voters understand the actuarial tables.

  **3. Epistocratic / Competence-Based**
  *   **Answers:** Voter Deficit (High) | Constant Across Issues | Yes Constraints | Ideal Standard | Never Legitimate (N/A).
  *   **Awkward Commitment:** Must admit that a randomly selected group of experts would be justified in overturning a 60% popular vote on pension reform.

  **4. Information-Design / Low-Salience**
  *   **Answers:** Voter Deficit (High) | Diminishes on Salience | No Constraints | Legislative Baseline | Decaying Mandate.
  *   **Awkward Commitment:** Must argue that a technical fiscal measure is legitimate only if the ballot language is simplified, even if the policy mechanics remain opaque.

  **5. Deliberative / Assembly Alternative**
  *   **Answers:** Mechanism Deficit (Binary) | Constant (Binary is always reductive) | No Constraints | Ideal Standard (Deliberation) | N/A (Process-bound).
  *   **Awkward Commitment:** Must reject California-style propositions even if the fiscal outcome is popular, because the binary vote forecloses the possibility of amendment and compromise.

  **6. Ratification-Only**
  *   **Answers:** Mechanism Deficit (Agenda) | Diminishes (If Legislature drafts) | No Constraints | Legislative Baseline | Decaying Mandate.
  *   **Awkward Commitment:** Must explain why a legislature-drafted fiscal measure is legitimate but a citizen-drafted one with identical wording is not.

  **7. Hard Constitutionalism**
  *   **Answers:** Voter Deficit (Variable) | Variable | Yes Constraints (Rights/Fiscal) | Ideal Standard | Permanent (Rights don't decay).
  *   **Awkward Commitment:** Must invalidate a popular vote on technical fiscal questions not because voters were confused, but because the subject matter was outside their jurisdiction.

  **8. Pragmatic Second-Best**
  *   **Answers:** Mechanism Deficit (Fixable) | Diminishes on Salience | No Constraints | Legislative Baseline | Decaying Mandate.
  *   **Awkward Commitment:** Must tolerate technically flawed fiscal propositions on the grounds that the legislative alternative would have been equally opaque or captured by lobbyists.

  ***

  ### Empty or Incoherent Combinations

  *   **Mechanism Deficit (Constant) + Permanent Mandate:** *Incoherent.* If the instrument is structurally flawed (e.g., binary framing distorts will) and this flaw does not scale with issue type, there is no justification for allowing the result to bind future electorates indefinitely.
  *   **Voter Deficit (Constant) + No Subject Constraints + Legislative Baseline:** *Unoccupied.* If voters are permanently incompetent compared to the legislature across all issues, and there are no rights-based limits, the position collapses into a call to abolish referendums entirely rather than regulate them.
  *   **No Deficit + Yes Subject Constraints:** *Theoretically Tense.* If the electorate is fully competent and sovereign (Populist), positing inherent subject-matter limits requires a separate normative theory (like natural rights) that contradicts the "no deficit" premise of pure popular sovereignty.

  ### Indistinguishable Leaves

  *   **Information-Design vs. Pragmatic Second-Best:** These positions are difficult to pull apart using only these five questions, as both accept the Legislative Baseline, argue the deficit diminishes with salience, and view the mandate as decaying. The distinction lies in whether they propose fixing the *voter's input* (Information-Design) or accepting the *mechanism's output* as sufficient (Pragmatic), which requires a sixth question about remediation.
