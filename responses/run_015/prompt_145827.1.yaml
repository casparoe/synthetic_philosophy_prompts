answer: |-
  Your hypothesis is structurally sound but slightly underestimates the normative load bearing the empirical claims. You identify three logical types (empirical, agency, epistemic) plus a legitimacy outlier. In practice, the empirical and epistemic claims are often proxies for the normative ones. The "unit of agency" isn't just a measurement choice; it's a moral commitment to individualism versus collectivism. The "measurability" dispute isn't just about error bars; it's about whether quantification distorts value.

  There are verbal disputes hiding in plain sight. "Effective" means *efficient* to EAs and *legitimate* to critics. "Systemic" means *aggregate individual outcomes* to EAs and *emergent structural constraints* to critics. When they argue, they are often translating across these definitions without noticing.

  There are hidden empirical questions. For Earning-to-Give, the replaceability rate is technically measurable (though difficult). For Structural critique, the elasticity of institutional change via funding is measurable. If replaceability were proven near-zero, the EtG critique would lose force. If structural funding showed high leverage, the Institutional critique would soften. But these answers rarely stick because the underlying moral frameworks reject the premises.

  Progress is possible on Measurability (methodological reforms) and EtG (better causal models). Progress is impossible on Authorization without a political settlement, not an evidentiary one. You should tell your readers that the Authorization dispute is not a truth claim but a power claim; no study resolves it.

  | Critique | Core Disagreement Type | Hidden Empirical Question | Concrete Progress Marker | Is Progress Possible? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Institutional / Structural** | **Ontological & Normative:** Is society an aggregate of individuals or a structure constraining them? Is justice an outcome or a process? | What is the funding elasticity of structural change? (Can dollars buy policy shift?) | A distinction between *funding services* vs. *funding power shifts*, with separate metrics for each. | **Limited.** Requires agreeing on what "change" is, not just measuring it. |
  | **Earning-to-Give** | **Normative & Empirical:** Consequentialist net utility vs. Deontological complicity. Plus causal claims about replaceability. | What is the specific replaceability rate of harmful roles? (Would the harm happen anyway?) | Transparent modeling of counterfactuals in specific industries, acknowledging moral residue. | **Mixed.** Empirical part is solvable; the complicity objection is a value clash. |
  | **Measurability** | **Epistemic:** Explicit model bias vs. Implicit intuition bias. What counts as knowledge? | Does quantification systematically distort allocation away from high-value unmeasurable causes? | Pre-registered uncertainty ranges; admitting "unknown unknowns" as a cost category. | **Yes.** Methodological reforms can reduce (not eliminate) the bias. |
  | **Authorization (Leftover)** | **Political:** Technocratic efficacy vs. Democratic legitimacy. Who has the right to decide? | None. This is not a factual claim. | A shift from "donor prioritization" to "community-directed funding" structures. | **No.** This is a conflict of authority, not truth. Requires political change. |

  \answer{Incommensurable moral frameworks and legitimacy standards}
