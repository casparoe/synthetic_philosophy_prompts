answer: |-
  ### Exam Question

  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,000 words (±10%)
  **Value:** 20 Marks

  **Prompt:**

  Read the following empirical vignette carefully:

  > Fieldworkers document sixty distinct procedures for making waterproof containers from the same locally available materials, across thirty neighbouring communities. Three findings emerge.
  >
  > 1.  **Population Shift:** Over the sampling window, the population frequency of procedures shifts toward ones that score better on a standardised leak test.
  > 2.  **Novice Convergence:** Experimenters recruit novices who have never seen the corpus, tell them only the goal, hand them the same raw materials, allow each a fixed number of attempts in isolation, and forbid contact with informants. The same handful of procedures recurs across novices, and they are the ones that were winning in the field.
  > 3.  **No Lineage:** There is no lineage data; nothing in the record reveals who learned from whom, so nobody can reconstruct the transmission tree.

  A colleague argues: *"Finding 1 proves Darwinian selection is acting on cultural variants. Finding 2 proves it isn't, because the variants aren't being copied, they are being re-derived. Therefore, this is a case of individual learning, not cultural evolution."*

  Write an essay evaluating this argument. Your response must address:
  1.  Whether Finding 2 necessarily falsifies the claim that Darwinian selection is occurring, or merely relocates it.
  2.  Whether reliable reconvergence can substitute for high-fidelity replication in allowing cumulative adaptation to accumulate.
  3.  What specific observation regarding the *source of the bias* would force you to abandon the selection hypothesis entirely.

  Do not rely on specific authors or named theories. Argue from first principles regarding variation, heredity, and fitness.

  ***

  ### Model Answer

  To evaluate the colleague's argument, we must first define the necessary conditions for a Darwinian process. Darwinian evolution requires three things: variation among individuals, differential fitness (some variants persist or spread more than others), and heredity (the traits of the successful variants are passed on to the next generation). The colleague's claim rests on the assertion that Finding 2 (Novice Convergence) destroys the heredity condition, thereby ruling out cultural selection. This is too quick. Finding 2 complicates the *location* of the heredity, but it does not necessarily eliminate the evolutionary dynamic.

  Finding 1 (Population Shift) shows differential fitness. Procedures that leak less are becoming more common. In a standard cultural evolution model, this happens because people copy successful makers. However, Finding 3 (No Lineage) prevents us from confirming that copying occurred. Without lineage data, we cannot distinguish between the spread of a trait via transmission versus the spread of a trait via independent invention. This is the crux of the colleague's objection. If every individual is independently inventing the "best" container because the physics of the materials dictates it, then there is no cultural heredity. The "replicator" is not the procedure, but the universal human cognitive ability to solve the physics problem.

  However, concluding that this is "individual learning, not cultural evolution" creates a false dichotomy. If novices reliably converge on the same solution without copying, they possess a strong cognitive bias. We must ask: where did that bias come from? If the bias is genetically encoded (e.g., universal perceptual constraints), then selection has indeed occurred, but it operated on genes over evolutionary time, not on memes over historical time. In this scenario, the cultural population shift is a phenotypic expression of genetic adaptation. The "fitness" depends on the match between the cognitive bias and the material environment. This is a Darwinian explanation, but the replicator is the gene, not the container-making procedure.

  Alternatively, the bias itself could be cultural. Perhaps the novices share a hidden common history of training that the experimenters failed to control for. If the bias is acquired, we return to the problem of transmission. If the bias is robust enough to regenerate the same form in every novice despite noise, it acts as an "attractor" in the space of possible procedures. This leads to the second requirement: can reconvergence substitute for fidelity?

  Cumulative adaptation usually requires high-fidelity copying. If I improve a design by 1%, and the next person cannot copy it exactly but only re-derives the baseline, my improvement is lost. This is the "ratchet effect" problem. High-fidelity replication preserves specific innovations against the pull of convergence. In the vignette, if the novices only converge on the *baseline* effective procedures, but fail to reproduce specific *innovations* introduced by experts (e.g., a specific knot that reduces leaks by an extra 5%), then reconvergence cannot substitute for fidelity. It stabilizes the population but prevents accumulation.

  Therefore, reconvergence substitutes for fidelity only regarding the maintenance of equilibrium states, not the accumulation of novel complexity. For the population shift in Finding 1 to represent cumulative cultural evolution, the "winning" procedures must contain arbitrary or complex features that novices *would not* derive on their own but *do* adopt after exposure. If the winning procedures are exactly what naive novices invent, there is no cumulative culture, only the expression of latent potential.

  Finally, we must identify what observation would falsify the selection hypothesis. The colleague argues that Finding 2 kills the cultural selection story. I argue it only kills it if the bias is shown to be non-historical. To abandon the selection hypothesis entirely, we would need to show that the convergence is determined solely by immediate physical constraints with no historical component. For example, if we changed the raw materials slightly, and the novices immediately shifted to a completely different procedure that was optimal for the new materials *without any prior exposure or trial-and-error learning*, this would suggest the solution is dictated entirely by physics and universal cognition.

  However, if the novices struggle, make errors, and only converge after several attempts, or if they converge on a solution that is locally optimal but historically contingent (e.g., a specific style that is not strictly physically necessary), then selection is still in play. The fatal observation would be demonstrating that the "bias" is immutable and universal across all human populations regardless of history, and that the "population shift" in Finding 1 is merely the unmasking of this universal capacity rather than the differential retention of historical variants. If the variation in Finding 1 is shown to be transient noise around a fixed cognitive universal, then there is no evolution, only development.

  In conclusion, Finding 2 does not prove that selection is absent; it proves that the mechanism of retention may be reconstructive rather than replicative. This relocates the evolutionary pressure either to the genetic history of the learners or to the history of the biases themselves. Reconvergence can maintain adaptive peaks but cannot climb new ones without some mechanism to preserve deviations from the norm. Thus, the colleague is wrong to dismiss selection, but right to suspect that without lineage data and without evidence of cumulative innovation beyond naive convergence, we are not observing open-ended cultural evolution.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Definition of Darwinian Conditions (3 Marks)**
  *   **A (3):** Explicitly defines Variation, Differential Fitness, and Heredity/Transmission. Notes that Heredity is the contested element in the vignette.
  *   **B (1-2):** Lists the conditions but fails to connect them specifically to the "No Lineage" constraint in the vignette.
  *   **Common Error:** Treating "spread" (Finding 1) as sufficient proof of selection without addressing heredity.

  **2. Interpretation of Novice Convergence (Finding 2) (4 Marks)**
  *   **A (4):** Identifies convergence as evidence of *biased transformation*. Argues that this challenges *cultural* heredity but implies *cognitive/genetic* heredity.
  *   **B (2-3):** Correctly identifies that convergence suggests individual learning but treats this as a simple "either/or" (either copying OR learning) without discussing the evolutionary implications of the bias.
  *   **Common Error:** Treating the re-derivation result as an explanation ("it's just learning") rather than a phenomenon that requires an evolutionary account of the learning bias.

  **3. The "Relocation" Argument (4 Marks)**
  *   **A (4):** Articulates that if biases are universal/innate, selection occurred on genes (past). If biases are acquired, selection occurred on the biases themselves (cultural). Rejects the dichotomy between "selection" and "convergence."
  *   **B (2-3):** Acknowledges the bias might be innate but fails to connect this back to the definition of a Darwinian process (i.e., fails to note that genetic selection is still Darwinian).
  *   **Common Error:** Treating convergence as automatically fatal to a selection story, rather than relocating the locus of selection.

  **4. Fidelity vs. Reconvergence (Cumulative Culture) (4 Marks)**
  *   **A (4):** Distinguishes between *maintenance* (which reconvergence can do) and *accumulation/ratcheting* (which requires fidelity to preserve deviations). States reconvergence is insufficient for cumulative culture.
  *   **B (2-3):** States that fidelity is important but does not explain *why* reconvergence fails to support cumulative innovation (the loss of arbitrary/complex deviations).
  *   **Common Error:** Sliding between the level at which selection acts (the procedure) and the mechanism of transmission (copying vs. reconstructing).

  **5. Falsification Conditions (3 Marks)**
  *   **A (3):** Specifies an observation regarding the *source of the bias* (e.g., universality across populations, immutability to material change) that would rule out historical selection.
  *   **B (1-2):** Gives a vague falsification condition (e.g., "if novices didn't converge") that does not address the core theoretical problem of heredity.
  *   **Common Error:** Failing to specify what observation would make them stop saying "selection is occurring."

  **6. Clarity and Precision (2 Marks)**
  *   **A (2):** No namedropping. Arguments flow logically. Adheres to word limit.
  *   **B (1):** Relies on named theorists (e.g., "As Sperber says...") or exceeds/undercuts word limit significantly.
  *   **Common Error:** Using literature names to substitute for argumentation.

  **Total: 20 Marks**

  **Note on Grading:**
  An essay that argues definitively "This IS cultural evolution" or "This IS NOT cultural evolution" without conditioning the answer on the *source of the bias* or the *capacity for accumulation* cannot score higher than 12/20 (B range). The A grade requires holding the tension between reconstructive bias and evolutionary dynamics.
