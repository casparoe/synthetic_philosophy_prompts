  ### Preliminary Brainstorming

  Right, let's settle in. This is a fascinating patchwork of social ontology and normative ethics. You're asking me to take a specific theoretical framework—reliance-without-promising—and run it through a concrete, messy sociological scenario. The tension here is between the abstract structure of the obligation (based on reliance interests) and the contingent facts of your status (locum, foreigner, transient).

  First thought: The "reliance-without-promising" view is essentially a contractualist position stripped of the actual contract. It's Scanlonian, but grounded in empirical expectations rather than reasonable rejectability. If people plan their lives assuming $X$, and you do $\neg X$, you've harmed them by thwarting those plans. The kicker is "even though none of them knows you". This solves the anonymity problem but creates the "transient" problem.

  Second thought: The classification of the conventions is doing heavy lifting here.
  *   **Tipping (Additive):** If single defections barely register, why is there an obligation? Usually, additive conventions rely on the *general* compliance to sustain the pool. If I defect, I'm a free-rider. But if the wages are *set* assuming tips, then my defection isn't just free-riding; it's undermining the wage structure. But the theory says "barely registers". There's a tension here between the theoretical classification and the scenario description ("leave a particular worker short"). I need to unpick that.
  *   **Queues (Positional):** This is clearer. If I cut in, someone specific loses. But if the local convention *is* cutting in (saving places), then standing rigidly might be the defection? No, the prompt says "someone does get served out of turn". So there is a loser. The reliance is on the *local* understanding of the queue.
  *   **Jaywalking (Dead-letter):** This is the trickiest. If the official norm is dead, does the reliance interest shift to the *actual* practice? If drivers expect pedestrians to jaywalk, they drive differently. If I obey the dead letter law, do I create a hazard? Or does the illegality preserve a reliance interest despite the practice?

  Third thought: The "Foreigner Excuse". This is the crux. If locals expect foreigners *not* to know the rules, do they rely on foreigners complying? If I walk into a restaurant, do they plan their budget assuming *I* specifically will tip? Or do they assume "locals tip, tourists might not"? If the latter, my reliance interest is nullified. The obligation evaporates not because the rule doesn't exist, but because the *expectation* doesn't extend to me.

  Fourth thought: The four-month limit. Does temporariness matter? In additive conventions, maybe not—every contribution counts. In positional, definitely not—harm is immediate. But in terms of reciprocity? If I'm not staying, I don't benefit from the long-term stability of the convention. But the theory isn't about reciprocity; it's about reliance. So, unless my leaving changes their reliance expectations, the duration might be morally inert.

  Fifth thought: "Follow the local convention" is too blunt. It assumes conventions are monolithic. But here we have dead letters, additive pools, and positional trades. The right shape of the answer isn't "conformity", it's "coordination to prevent harm based on actual expectations". Sometimes that means conforming, sometimes it means signalling difference.

