  ### Analysis: Reliance, Expectations, and the Locum's Obligation

  Having mused on the tensions within the framework you've provided, let us commit to the implications. The theory of *reliance-without-promising* shifts the moral weight from the *rule itself* to the *expectations surrounding the rule*. This is a crucial distinction. It means that "when in Rome" is not merely about respecting local culture; it is about avoiding harm to those who have structured their lives around your compliance. However, as you suspect, this yields nuances that the standard heuristic misses.

  Here are the four most significant implications for your position, focusing on the transient nature of your stay, the foreigner exemption, and the specific typology of conventions.

  #### 1. The "Foreigner Excuse" as an Expectation-Modifier
  The most radical implication of this view concerns the locals' habit of excusing foreigners. Under standard deontological or virtue-ethical views, an obligation exists regardless of whether others expect you to fulfil it; you ought to do the right thing because it is right. Under *reliance-without-promising*, however, the obligation is contingent upon the *existence of the reliance interest*.

  If the locals possess a second-order habit of expecting foreigners to defect (e.g., "tourists don't know the queueing system" or "visitors won't tip"), then they have *not* built your compliance into their planning.
  *   **Implication:** If you are visibly a foreigner, and the locals genuinely do not rely on your compliance, **you have no moral obligation to comply.**
  *   **Why this matters:** This inverts the usual advice. Usually, we say "you should try harder to fit in to be respectful." On this view, if fitting in requires you to know a code you cannot know, and they don't expect you to know it, forcing yourself to comply is supererogatory, not obligatory. However, be wary: if you *signal* competence (e.g., speaking the language fluently, appearing settled), you may trigger the reliance interest. The obligation turns on whether you are *taken* for a local, not merely whether you are one.

  #### 2. Temporariness and the Scope of the "Pool"
  Does the four-month limit do any work? In standard contract theories, temporary members might owe less because they benefit less from long-term stability. But on *reliance-without-promising*, the duration of your stay is largely irrelevant compared to the *type* of convention.
  *   **Additive (Tipping):** The pool relies on aggregate compliance. Your four-month contribution is part of that aggregate. The fact that you leave does not negate the harm done to the wage structure *while you are there*. The worker is short *now*, not in ten years. Therefore, **temporariness does not excuse defection in additive conventions.**
  *   **Positional (Queues):** Harm is immediate and individual. Whether you stay four months or four years, the person behind you loses their spot *today*. **Temporariness is morally inert here.**
  *   **Implication:** You cannot use the "I'm leaving soon" argument to justify free-riding. The theory binds you to the current reliance interests, not the future reciprocity of the community. The only escape is the "Foreigner Excuse" above, not the temporal limit.

  #### 3. The Failure of "Follow the Local Convention"
  The heuristic "follow the local convention" is dangerous under this framework because it conflates the *official norm* with the *reliance norm*. This is most visible in the **Dead-Letter (Jaywalking)** case.
  *   **The Usual Verdict:** Either "it's illegal, don't do it" (legalism) or "everyone does it, so it's fine" (conventionalism).
  *   **The Reliance Verdict:** You must coordinate with the *actual expectations of others*, not the written law nor merely the crowd's behaviour.
  *   **Implication:** If drivers rely on pedestrians *not* jaywalking (despite everyone doing it), you ought not to jaywalk. Conversely, if drivers rely on pedestrians *taking responsibility* and crossing when clear (slowing down accordingly), then waiting rigidly at a red light when no cars are coming might actually disrupt the flow and violate the reliance interest of the drivers behind you.
  *   **Action:** Do not look at the traffic light; look at the drivers. If their braking patterns suggest they expect you to cross, you have an obligation to cross predictably. If they expect you to wait, you wait. The obligation is to **coordination**, not compliance. In a dead-letter scenario, the "local convention" might be ambiguous; your duty is to be legible, not necessarily to conform to the majority if the majority is acting unpredictably relative to the infrastructure.

  #### 4. Divergent Verdicts on the Three Cases
  Applying this package strictly yields verdicts that differ from the usual moral intuitions in specific ways.

  *   **Tipping (Additive):**
      *   *Usual View:* Tip because it's polite or fair.
      *   *Reliance View:* Tip because the wage structure relies on it. **However**, if the establishment knows you are a locum/foreigner and prices the service assuming you won't tip (perhaps building a service charge into the bill instead, or simply absorbing the variance), the obligation weakens.
      *   *Crucial Twist:* If the convention is truly additive ("single defection barely registers"), the harm is diffuse. But your scenario says it leaves a worker short. If we grant the theory's classification (additive), you might argue your single non-tip is negligible. **But**, if you grant the scenario's description (worker short), it functions positionally. *Resolution:* Treat it as additive regarding the *pool*, but recognise that if the pool is small (one shift), your defection is significant. **Verdict:** You must tip, unless you are certain the staff do not expect tips from short-term visitors (see Foreigner Excuse).

  *   **Queues (Positional):**
      *   *Usual View:* Follow the local queueing style.
      *   *Reliance View:* Identify the victim. If locals save places, they rely on the ability to save places. If you refuse to let someone save a place, you are harming *them* (the saver) who relies on that convention. However, the person behind the saver is also harmed positionally.
      *   *Crucial Twist:* The obligation is to the *established reliance*. If the local convention is "saving places is fine", then the person behind the saver *does not rely* on a rigid queue. They know the rules. Therefore, **you should adopt the local queueing habit.** To impose your home country's rigid queueing here would be to violate the locals' reliance on their own system. You become the cheater by being too honest.

  *   **Jaywalking (Dead-Letter):**
      *   *Usual View:* Illegal = Don't do it.
      *   *Reliance View:* The official norm is irrelevant if no one relies on it.
      *   *Crucial Twist:* If the rule is dead, the obligation to obey the law vanishes. The obligation shifts to **predictability**. If everyone jaywalks, drivers expect it. If you stand still, you are the anomaly.
      *   *Verdict:* You ought to jaywalk if that is what allows for smooth coordination, provided you do so safely. Obeying a dead letter law that surprises drivers is morally worse than breaking it, because it creates a hazard (a reliance violation) for the drivers.

  ### Summary of Actionable Implications

  1.  **Do not rely on the "four months" defence.** It does not negate reliance interests that exist in the present tense.
  2.  **Assess your visibility.** If you are visibly a transient foreigner, and locals adjust their expectations accordingly, your obligations diminish proportionately. If you blend in, you inherit the full burden of local reliance.
  3.  **Prioritise Coordination over Conformity.** In dead-letter cases (jaywalking), do not ask "what is the rule?" Ask "what do others expect me to do to keep us safe?"
  4.  **Beware of "Hyper-Conformity" in Positional Cases.** In queueing, imposing your home standards on a local system that relies on flexibility can be just as harmful as cheating. If the locals rely on place-saving, respecting that is the moral duty, even if it feels like cheating to your home sensibilities.

  The shape of the answer, then, is not "follow the local convention", but rather **"identify the reliance interest and do not thwart it."** Sometimes that means tipping, sometimes it means saving a place in a queue, and sometimes it means crossing the road against the lights. The morality lies in the harmony of expectations, not the rulebook.
