answer: |-
  ### 1. Fixing the Purpose

  You have defined a **dual-audience theory**. Most philosophical accounts of convention target only the agent (Job 1: *What should I do?*). You require a theory that also targets the community (Job 2: *What can you do to me?*).

  This distinction is the load-bearing beam of the entire specification. A theory that grounds obligation in *prudence* (Job 1) fails Job 2 (the crowd has no standing to shame a prudent actor). A theory that grounds obligation in *social contract* (Job 2) often fails Job 1 for the visitor (who never signed).

  **Revised Purpose Statement:**
  The theory must generate **action-guiding reasons** for the individual *and* **standing-to-blame** for the community, specifically in contexts where the rule is (a) arbitrary in content, (b) contingent on general compliance, and (c) potentially detachable from legal or deep moral structures.

  ---

  ### 2. Refining the Desiderata

  Your candidate list is strong, but three items need reframing to meet the dual-audience purpose, and one critical item is missing.

  **Critique & Reframing:**

  *   **The No-Difference Case (Keep, but sharpen):**
      *   *Reframe:* **The Marginal Irrelevance Test.** The theory must explain why an obligation persists when the causal impact of the individual act is zero.
      *   *Why:* This is the primary kill-switch for Act Consequentialism. If the theory fails here, it reduces convention to prudence.
  *   **The Announced Non-Participant (Keep, but split):**
      *   *Reframe:* **The Opt-Out Condition.** The theory must specify whether unilateral declaration dissolves the obligation. Crucially, it must distinguish between *dissolving the obligation* and *merely signaling intent*.
      *   *Why:* In queuing, announcing "I'm cutting" doesn't make it permissible; in a gift exchange, announcing "I'm not reciprocating" might. The theory needs a criterion for *exit rights*.
  *   **Visitor vs. Dissenter (Merge into Epistemic/Volitional):**
      *   *Reframe:* **The Knowledge/Consent Matrix.** Do not treat these as separate desiderata. Treat them as variables: (1) Did they know the rule? (2) Did they accept the benefits?
      *   *Why:* Separating them risks building a theory that privileges "local knowledge" over "moral universals." The theory should handle the *combination* of ignorance and dissent.
  *   **Conflicting Jurisdictions (Keep):**
      *   *Reframe:* **The Jurisdictional Boundary.** The theory must determine when local convention overrides universal norm (or law), and vice versa.
      *   *Why:* Essential for the "Visitor" job.
  *   **Unjust Conventions (Keep, add Defeasibility):**
      *   *Reframe:* **The Defeasibility Condition.** The theory must explain if the obligation is *prima facie* (binding unless overridden) or *absolute*. It must allow for "comply while working to change."
      *   *Why:* Binary "binds/doesn't bind" verdicts fail here. We need to know if the obligation *survives* the injustice, even if outweighed.
  *   **Exit Costs (Keep):**
      *   *Reframe:* **The Voluntariness Threshold.** At what cost of exit does participation become coerced, and does coercion void the obligation?
      *   *Why:* Crucial for the tipping/wage subsidy case.
  *   **Enforcement Asymmetry (Promote to Core):**
      *   *Reframe:* **The Standing Condition.** The theory must explain when the community has the *right* to reproach, distinct from whether the agent had a *duty* to comply.
      *   *Why:* This is your Job 2. Many theories conflate "wrong act" with "liable to blame."
  *   **Day-One (Keep):**
      *   *Reframe:* **The Common Knowledge Threshold.** When does a regularity become a norm? (e.g., Is it the 10th tip? The 100th?)
      *   *Why:* Tests the "history" requirement.
  *   **MISSING: The Signaling Function.**
      *   *Add:* **The Expressive Constraint.** Conventions often communicate respect or solidarity. The theory must account for the harm of *signaling disregard*, even if the material harm is zero.
      *   *Why:* This bridges the No-Difference gap. You hurt no one's wallet by not tipping, but you might insult the social contract.

  **Distinctions: Load-Bearing vs. Cosmetic**

  *   **Load-Bearing:**
      *   *Obligation vs. Enforcement:* (Job 1 vs. Job 2). If the theory conflates these, it fails your dual-purpose requirement.
      *   *Arbitrary vs. Beneficial:* If the theory relies solely on benefits, it fails the No-Difference case.
      *   *Strangers vs. Reliance:* Forward-looking (coordination) vs. Backward-looking (fair play) duties require different mechanisms.
  *   **Cosmetic:**
      *   *First-Personal vs. Third-Personal:* This is a feature of the *presentation*, not the *validity*. A theory can be objectively true even if the agent can't articulate it. Drop this as a hard desideratum; treat it as a usability bonus.

  ---

  ### 3. The Trilemma and Non-Negotiables

  You asked which subset is jointly unsatisfiable. My analysis suggests your guess was close, but the tension is sharper.

  **The Impossible Trio:**
  1.  **Marginal Irrelevance:** Obligation exists even if my act changes nothing.
  2.  **Unilateral Opt-Out:** Obligation dissolves if I announce I'm not playing.
  3.  **Community Standing:** The crowd is permitted to shame/enforce the rule.

  **Why they clash:**
  If (1) is true, the obligation usually stems from *Fair Play* or *Joint Commitment* (I owe it because we are doing it together).
  If (2) is true, the obligation stems from *Consent* (I owe it because I agreed).
  If (3) is true, the obligation stems from *Social Order* (I owe it because the group sustains it).

  *   If I can Opt-Out (2), then I am not part of the "Together" (1), so the Crowd loses Standing (3).
  *   If the Crowd has Standing (3) despite my Opt-Out (2), then Opt-Out is illusory, and Consent is dead.
  *   If Marginal Irrelevance binds (1), then Opt-Out (2) shouldn't matter (since my act doesn't break the system), but then why did I need to consent?

  **What has to give:**
  To satisfy your dual-purpose spec (especially Job 2), **Unilateral Opt-Out (2) must go.**
  A theory that allows me to dissolve a coordination norm by speaking ("I'm not queuing") destroys the community's ability to enforce (Job 2). If I can opt out, you can't shame me. If you can shame me, I couldn't opt out.
  *Verdict:* A robust theory of conventional obligation must treat **participation as tacit and exit as costly/structural, not verbal.** You cannot talk your way out of a queue.

  **The Single Requirement that Kills the Most Theories:**
  **The Standing Condition (Enforcement Asymmetry).**
  *   *Kills:* Act Consequentialism (why shame me if no harm?), Prudence (why shame me for being foolish?), and Simple Consent (if I didn't consent, you can't blame me).
  *   *Survivors:* Joint Commitment, Expressive/Respect views, Rule Consequentialism.

  ---

  ### 4. Scorecard of Contenders

  Here is how six major theoretical frameworks score against your refined desiderata.

  | Theory | Marginal Irrelevance (No-Diff) | Unilateral Opt-Out | Community Standing | Unjust Conventions | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Coordination / Equilibrium** (Lewis/Sugden) | **Fail.** If my deviation doesn't break equilibrium, I have no reason to comply. | **Pass.** If I signal I'm not coordinating, the equilibrium doesn't apply to me. | **Fail.** Explains stability, not moral standing to blame. | **Fail.** Equilibrium is neutral; cannot condemn unjust stable states. | **Too thin.** Explains *how* conventions stick, not why they *bind*. |
  | **2. Reliance / Expected-Benefit** (Consequentialist) | **Fail.** If no one relies on *my* specific act, no obligation. | **Pass.** If I warn you not to rely on me, obligation dissolves. | **Fail.** Blame requires harm; no harm = no standing. | **Pass.** Can condemn unjust practices if net utility is negative. | **Good for Job 1, fails Job 2.** Cannot justify shaming. |
  | **3. Fair Play / Consent** (Hart/Rawls) | **Pass.** I owe it because I took the benefit of the system. | **Fail.** Benefits are often non-excludable; I can't opt out of the queue's existence. | **Pass.** Free-riders are legitimate targets of reproach. | **Mixed.** Struggles if the "benefit" is tainted (e.g., subsidized wages). | **Strong contender,** but struggles with the "Visitor" who takes no benefit. |
  | **4. Joint Commitment** (Gilbert) | **Pass.** We are a "plural subject"; my act is a betrayal of *us*. | **Fail.** Commitment is collective; unilateral withdrawal is invalid. | **Pass.** Members have standing to hold each other to the commitment. | **Fail.** A committed group can commit to evil; theory lacks moral override. | **Best for Job 2,** but risks moralizing bad conventions too strongly. |
  | **5. Expressive / Respect** (Anderson/Scanlon) | **Pass.** Non-compliance expresses disrespect, regardless of impact. | **Fail.** Saying "no disrespect intended" doesn't undo the expressive act. | **Pass.** Community defends the value expressed by the norm. | **Pass.** Can distinguish between respect for persons vs. respect for bad rules. | **Best overall fit.** Handles the "arbitrary" nature well (symbolic value). |
  | **6. Debunking / Error Theory** | **N/A.** Denies obligation exists. | **N/A.** | **N/A.** | **Pass.** Correctly identifies unjust conventions as coercive. | **Fails Purpose.** You asked for a theory of obligation, not a denial of it. |

  ### 5. Recommendation for the "Best-Surviving-Subset"

  If you want a theory that satisfies your dual purpose (Agent Guidance + Community Standing) while handling the "No-Difference" and "Unjust Practice" cases, you should look for a hybrid of **Joint Commitment** and **Expressive Respect**.

  *   **Why:** Joint Commitment solves the *Standing* problem (we made this together, so you can hold me to it). Expressive Respect solves the *No-Difference* problem (it's not about the money, it's about the signal).
  *   **The Trade-off:** You must accept that **Unilateral Opt-Out is impossible.** You cannot stroll into a tipping culture, announce "I don't believe in this," and claim moral innocence. The obligation is incurred by *entry* into the social space, not by verbal consent.
  *   **The Injustice Clause:** To handle the "Unjust Convention" (tipping as wage subsidy), the theory must treat the obligation as *defeasible*. You owe the tip to the waiter (Joint Commitment/Respect), but you owe a greater duty to the system to change it. This allows for "compliance with reproach" (tipping while writing a letter to the manager).

  **Final Specification Adjustment:**
  Drop the requirement that the theory must allow for "Announced Non-Participation" to dissolve obligation. That is a feature of *contracts*, not *conventions*. If your theory allows verbal opt-out, it will fail the Enforcement Job. The cost of the convention *is* the inability to opt out without exiting the context entirely.
