      *   This is crucial. Many theories explain why *I* should follow a rule (prudence, internal consistency) but fail to explain why *you* can blame me (standing to reproach).
      *   *Refinement:* The desiderata must explicitly test for the *enforcement condition* (Job 2), not just the *compliance condition* (Job 1).

  3.  **Critique & Refine Desiderata (The Candidate List):**
