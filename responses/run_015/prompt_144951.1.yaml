answer: |-
  Consider the "Somato-Cognitive Integration Protocol" (SCIP), a five-year clinical treatment for severe neurodegeneration where a patient's neural tissue is progressively replaced by bio-synthetic analogues that maintain functional isomorphism and continuous bodily presence. Concurrent with this physical substitution, the patient undergoes mandatory "Autobiographical Re-indexing Therapy" (ART), a cognitive restructuring regimen designed to mitigate identity dysmorphia by framing pre-treatment memories as clinical data belonging to a predecessor subject rather than as first-person episodes. Upon completion, the patient retains all declarative memories, personality traits, and preferences caused by the original brain states, and occupies the same spatio-temporally continuous body, yet phenomenologically experiences all pre-SCIP events as third-person archival records regarding a distinct individual, referring to their prior life as "the patient's history" rather than "my past," while seamlessly integrating post-SCIP experiences into a new first-person narrative.

  **Analysis of Specifications**

  1.  **Verdicts:**
      *   **Bodily-Continuity View:** Verdict is **Survival**. The protocol mandates continuous bodily presence and gradual tissue replacement, ensuring there is no moment where the biological organism ceases to exist or is discontinuously replaced.
      *   **Psychological-Continuity View:** Verdict is **Survival**. The patient retains intact personality traits, preferences, and declarative memories causally connected to the pre-procedure states; the functional chain of psychological states remains unbroken despite the shift in phenomenological indexing.
      *   **Narrative-Integration View:** Verdict is **Non-Survival**. The structural requirement for survival is that post-transformation experiences be woven into a narrative treating prior events as parts of one's own lived past. Since the patient experiences pre-SCIP events as third-person records belonging to a predecessor, the single first-person autobiographical narrative is fractured.

  2.  **Specific Structural Feature:**
      The divergence is forced by the **decoupling of memory access from first-person ownership**. Standard cases assume that remembering an event entails experiencing it as "mine." This case preserves the causal/functional memory trace (satisfying Psychological Continuity) and the physical substrate (satisfying Bodily Continuity) while surgically altering the phenomenological "tag" of ownership (violating Narrative Integration).

  3.  **Removal of the Feature:**
      If the Autobiographical Re-indexing Therapy (ART) is removed while keeping the physical replacement, the patient retains standard first-person ownership of memories. In this modified case, all three views converge on **Survival**: the body is continuous, psychological states are causally connected and owned, and the autobiographical narrative remains unified.

  4.  **Narrative-Integration Theorist's Attack:**
      The theorist charges that the scenario begs the question by stipulating the conclusion within the premises. By describing the patient as experiencing pre-SCIP events as belonging to a "predecessor" rather than themselves, the thought experiment simply defines the post-SCIP entity as a different person phenomenologically. Consequently, deriving non-survival from this description is tautological; it assumes that a fracture in the first-person narrative *constitutes* a fracture in identity, which is the very point in dispute.

  5.  **Continuity Defender's Reply:**
      The defender replies that the scenario stipulates a phenomenological fact (third-person recall), not a metaphysical verdict. The description specifies *how* the memories are experienced, not whether the person is identical; the verdict of non-survival is derived from the narrative theorist's own criterion, not built into the case design. The thought experiment does not beg the question but rather isolates the variable of "narrative ownership" to test whether it is a necessary condition for identity when bodily and psychological continuity are held constant. If the continuity theorist is correct, the narrative theorist's derivation reveals their criterion to be overly restrictive, not the case to be rigged.
