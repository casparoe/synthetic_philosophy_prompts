  # SEMINAR HANDOUT: SEMANTIC SORTING TREE

  **Instructions:** Answer the questions below based on your intuitions about the cases. Do not worry about technical labels; just follow the arrows. There is a typo in this handout, see if you can spot it.

  ### THE TREE

  **START:** Imagine Oscar (Earth) and Twin Oscar (Twin Earth) are mental duplicates. Oscar touches H2O, Twin Oscar touches XYZ. Both say "water."
  **Q1:** Do their words refer to different substances?
  *   **YES** → Go to **Q2** (Externalist Path)
  *   **NO** → Go to **Q3** (Internalist Path)

  ---

  **Q2:** (For those who said YES to Q1)
  Imagine a VR community where users never touch physical chemicals. An AI chemist defines a liquid as "not water" despite user experience. Does the AI's label fix the meaning without physical contact?
  *   **YES** → **LEAF A**
  *   **NO** (Meaning requires physical stuff) → **LEAF B**

  ---

  **Q3:** (For those who said NO to Q1)
  Does an expert (human or AI) fixing the label change what you mean, even if your internal concept stays the same?
  *   **YES** → **LEAF C**
  *   **NO** (Meaning is purely your own) → Go to **Q4**

  ---

  **Q4:** (For those who said NO to Q3)
  If we discovered water wasn't H2O, would your word "water" refer to the new stuff (because that's what you were pointing at), or would you admit you were never talking about water at all?
  *   **Refers to new stuff** → **LEAF D**
  *   **Never talking about water** → **LEAF E**

  ---

  ### THE LEAVES

  **LEAF A: Social-Deference Externalism**
  *   **Awkward Commitment:** You must admit a community can vote to change the chemical composition of gold by decree.

  **LEAF B: Causal-Contact Externalism**
  *   **Awkward Commitment:** You must admit aliens with no language but contact with H2O refer to water.

  **LEAF C: The Hybrid Position (Unnamed Combo)**
  *   **Awkward Commitment:** You believe twins mean the same thing despite different physics, but a computer program can override what they meant.

  **LEAF D: Two-Dimensionalism**
  *   **Awkward Commitment:** You are committed to saying the word 'water' changes its reference depending on whether you are imagining the world is different or discovering how it actually is.

  **LEAF E: Narrow-Content Internalism**
  *   **Awkward Commitment:** You must admit brain-in-a-vat Oscar means the same thing by 'water' as real Oscar, even if no water exists.

  ---

  ### SCORING LOGIC & NOTES

  **The Collapse Flag:**
  Be careful distinguishing **Leaf A** and **Leaf B**. If the AI chemist is connected to physical sensors, causal contact and social deference might **seperate** poorly here. Once the expert system is artificial, the division of labor looks just like a causal chain, so these positions may collapse into one another.

  **The Unoccupied Slot:**
  *   **Pattern:** Answer YES to Q1 (Meanings differ on Twin Earth) but claim meaning is fixed solely by Internal Conceptual Role (ignoring Q2/Q3 external factors).
  *   **Diagnosis:** **Incoherent.** You cannot claim meanings differ due to external stuff in one case while insisting meaning is fixed internally in all cases; the logic cancels itself out.

  *(End of Handout)*
