answer: |-
  Your formulation of the "proportional standing" hypothesis is a sophisticated engagement with the recent literature (echoing debates between the "commitment account" à la Macalester Bell and more gradable accounts suggested by philosophers like Patrick Todd or Zachary Hoskins). You are asking for the *operationalization* of a theory that is often left qualitative.

  If we accept your premise—that standing is attenuated proportionally rather than nullified categorically—we face the **Calibration Problem**. There is no consensus formula in moral philosophy, but we can construct a heuristic framework to answer your specific scenarios by analyzing the variables of **Domain Specificity**, **Gravity Weighting**, and **Threshold Functions**.

  Here is how we might calibrate that metric.

  ### 1. The Gravity-Adjusted Similarity Coefficient
  **Scenario:** *Tax Exaggeration (Blamer) vs. Embezzlement (Target)*

  You ask whether the shared category of "financial deception" creates a high similarity coefficient, or if the disparity in gravity drives the coefficient to zero (preserving standing).

  In a proportional framework, **Gravity must modulate Similarity.** If the metric relied solely on structural form (both are financial lies), the blamer would lose almost all standing. This seems counterintuitive; we generally feel a tax cheat retains *some* authority to condemn an embezzler, whereas an embezzler has almost no standing to condemn a tax cheat.

  **Calibration Strategy:**
  The coefficient should be a product of *Type Similarity* ($S_t$) and *Gravity Ratio* ($G_r$).
  *   **$S_t$ (Type):** High. Both involve dishonesty for financial gain.
  *   **$G_r$ (Gravity):** Low. Embezzlement typically violates specific fiduciary duties and property rights more directly than diffuse tax fraud.

  **Verdict:** The attenuation should be significant but not total. The blamer's standing is **diminished**, not destroyed. They can blame, but the *force* of the blame is reduced. They cannot adopt a posture of moral superiority, only of shared fallibility ("We shouldn't do this, including me"). If the gravity disparity is vast enough (e.g., lying about a parking fee vs. human trafficking), the $G_r$ approaches zero, and standing remains largely intact. The hypocrisy is too trivial to undermine the authority to condemn the atrocity.

  ### 2. Structural Form vs. Moral Domain
  **Scenario:** *Chronic Lateness (Blamer) vs. Chronic Deceit (Target)*

  You ask if structural form (unreliability) dictates the attenuation, such that lateness diminishes standing to blame deceit as much as tax fraud diminishes standing to blame embezzlement.

  **Calibration Strategy:**
  This depends on how we define the "Domain."
  *   **Broad Domain (Reliability):** If the domain is "failing to meet expectations," lateness and deceit are structurally identical. A strict structuralist metric would attenuate standing equally.
  *   **Virtue Domain (Honesty vs. Diligence):** If the domain is defined by the virtue violated, they are distinct. Lateness violates *diligence*; deceit violates *honesty*.

  **Verdict:** A proportional metric must prioritize **Moral Domain** over **Structural Form**.
  Why? Because the *reason* hypocrisy undermines standing is that it implies the blamer does not truly value the norm they are enforcing. If I blame you for lying, but I am merely late, it does not prove I disregard *truth*; it proves I am disorganized.
  Therefore, chronic lateness should **not** diminish standing to blame deceit by the same amount that tax fraud diminishes standing to blame embezzlement. The similarity coefficient for Lateness/Deceit should be near zero because the moral norms are distinct, despite the structural similarity of "breaking a promise/expectation."

  ### 3. Threshold Effects vs. Continuous Reduction
  **Scenario:** *Is there a "Nullification Threshold"?*

  You ask if any fault within a domain triggers full nullification (binary) or if the reduction is continuous (spectrum), leading to indeterminate cases.

  **Calibration Strategy:**
  This is the crux of the "Binary vs. Gradable" debate in standing literature.
  *   **The Binary View (Threshold):** Argues that standing is a permission right. You either have the authority to speak or you don't. Hypocrisy creates a "moral disability." Under this view, once the similarity coefficient crosses a minimum relevance threshold (e.g., both are honesty violations), standing drops to 0.
  *   **The Continuous View (Spectrum):** Argues that standing is a measure of *moral weight*. Hypocrisy makes the blame less effective or appropriate, but not impermissible.

  **Verdict:** A **Soft Threshold** is the most philosophically robust calibration.
  *   **Below Threshold:** Trivial faults in the same domain (e.g., I told a white lie, you committed fraud) cause minor attenuation. Standing is retained.
  *   **Above Threshold:** Serious faults in the same domain (e.g., I committed fraud, you committed fraud) trigger near-total nullification.
  *   **The Indeterminate Zone:** You are correct to identify that this yields borderline cases. If I have lied twice and you have lied once, is my standing reduced by 50%? This indeterminacy is not a bug; it is a feature. It suggests that in borderline cases, the *appropriateness of blame* becomes dialogical. The blamer must acknowledge their own fault to "buy back" standing. If they acknowledge it, standing is restored; if they conceal it, standing is nullified.

  ### 4. The Awareness Multiplier
  You mentioned "the blamer's awareness that they are committing the same type of wrong." This is a critical variable often cited by Macalester Bell (The Commitment Account).

  **Calibration Strategy:**
  Awareness acts as a **multiplier** on the attenuation.
  *   **Unaware Hypocrite:** I blame you for lying, forgetting I lied yesterday. Attenuation is low. My standing is weakened by inconsistency, but not by arrogance.
  *   **Aware Hypocrite:** I blame you for lying, knowing I lie regularly. Attenuation is high. This signals that I do not respect the norm myself, yet I demand you obey it. This is the "arrogance" that truly destroys standing.

  ### Summary: The Proposed Metric
  If we were to formalize your framework, the **Remaining Standing ($R_s$)** could be conceptualized as:

  $$R_s = 1 - (S_d \times G_r \times A_w)$$

  Where:
  *   **$S_d$ (Domain Similarity):** 0 to 1. (Lateness vs. Deceit = 0.1; Tax vs. Embezzlement = 0.8).
  *   **$G_r$ (Gravity Ratio):** 0 to 1. (Blamer's fault gravity / Target's fault gravity). If Blamer's fault is trivial compared to Target's, this approaches 0.
  *   **$A_w$ (Awareness):** 0 to 1. (Unconscious slip = 0.2; Calculated hypocrisy = 1.0).

  **Applying this to your examples:**

  1.  **Tax vs. Embezzlement:**
      *   $S_d$ is high (0.8).
      *   $G_r$ is low (Tax fraud is less grave than Embezzlement, say 0.3).
      *   $A_w$ is moderate (0.5).
      *   *Result:* $1 - (0.8 \times 0.3 \times 0.5) = 1 - 0.12 = 0.88$.
      *   **Conclusion:** Standing is **largely intact** (88%). The gravity disparity saves the blamer.

  2.  **Lateness vs. Deceit:**
      *   $S_d$ is low (Different virtues, say 0.2).
      *   $G_r$ is low (Lateness is less grave, say 0.1).
      *   *Result:* Standing is **almost fully intact**. Structural similarity alone does not drive attenuation.

  3.  **The Threshold Question:**
      *   If $S_d$ and $G_r$ are both high (e.g., I embezzle, you embezzle), the product approaches 1. Standing approaches 0.
      *   However, because $A_w$ is variable, there is no hard "nullification threshold." A self-aware embezzler who acknowledges their guilt *before* blaming may reduce $A_w$, thereby retaining partial standing to enforce the norm collectively.

  ### Conclusion
  To answer your core question: We calibrate the metric by prioritizing **Gravity** and **Awareness** over pure **Structural Form**.

  The disparity in gravity between tax exaggeration and embezzlement *does* drive the coefficient close to zero regarding attenuation, leaving standing largely intact. Conversely, structural form alone (lateness vs. deceit) is insufficient to diminish standing significantly because the moral domains differ. Finally, the reduction is **continuous**, not binary. The "indeterminate" cases you fear are actually the space where moral negotiation happens: in those borderline zones, the blamer must qualify their blame ("I know I struggle with this too, but...") to validate their standing. If they fail to qualify it, the standing collapses; if they do, it is maintained. Thus, standing is not just a static metric, but a dynamic status negotiated through the act of blaming itself.
