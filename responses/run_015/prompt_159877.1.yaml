      *   *Completion Gradient:* This is a strong insight. Treat it as a heuristic bias (Concorde Fallacy variant).
      *   *Ordering:* I need to make sure the recommended ordering flows logically for *founders*. They care about survival and identity. Start with Identity, move to Mechanics, end with Tools.

  10. **Final Review against Constraints:**
      *   Did I coach them on their case? No.
