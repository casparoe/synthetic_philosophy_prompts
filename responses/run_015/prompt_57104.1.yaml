prompt: |-
  Twenty-five people are signed up for a two-hour Saturday workshop I am running on the franchise: roughly half are sixteen- and seventeen-year-olds studying government and politics at school, and half are members of a local residents' association, several of whom are long-term residents without citizenship and therefore without a vote in national elections. I have a whiteboard and no handouts. I am not assigning anything, so please do not suggest readings.

  What I want from you is a plan for how to teach one idea, not the content of the session. The idea is that whether voting should be compulsory, whether the voting age should fall to sixteen, and whether resident non-citizens should be enfranchised are not three independent policy debates but three probes into a single underlying question about what entitles a person to a place in the electorate — and that the candidate grounds for inclusion (being subject to the coercive law, being affected by the decisions, being a participant in the ongoing collective undertaking) diverge from one another, and diverge again from whatever grounds could support compelling people to turn out.

  Please set out the following:

  - The order in which the pieces must be introduced, and why each must precede the next. In particular, what has to be established before the compulsion question can be posed at all without collapsing into the inclusion question, and whether the competing grounds should be built up one at a time or laid out simultaneously as rivals.

  - The single running case that should carry the workshop, together with what it must contain and what it must exclude. I have in mind one household: a long-term resident non-citizen parent, a sixteen-year-old who will be enfranchised in two years, and an adult citizen who has never voted and would not if left to himself. The three are identical in their exposure to the same laws and taxes and differ only in the formally relevant respects. Tell me whether this is the right vehicle, or whether it fails because several people in the room are themselves resident non-citizens and would end up functioning as the exhibit. If it fails, propose a replacement with the same structural properties.

  - The misconceptions the room will bring, in the order they are likely to surface, and the point in the sequence at which each should be pre-empted rather than rebutted afterwards. I anticipate at least these: that voting is a duty in the way jury service is; that any age threshold must be arbitrary because any line could be shifted; that excluding children on competence grounds is inconsistent with including adults who have cognitive impairments; that since one's own vote cannot be decisive, compulsion cannot be decisive either; and, from the younger half, that the issue is already settled in their favour. Please also tell me where to place the fact that what the standard compulsory-voting model actually compels is enrolment and attendance rather than the casting of a valid vote, without letting the session dissolve into procedural detail.

  - One question I can put at the end, on a case we will not have discussed, that would distinguish those who can apply the grounds from those who can only restate them.

  - What I should deliberately leave out at this level, and announce that I am leaving out.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop plan:

  1.  **Analyze the Request:**

      *   **Audience:** 25 people. Roughly 50% are 16-17 year old politics students. Roughly 50% are local residents' association members (some long-term residents without citizenship/voting rights).
      *   **Constraints:** 2 hours. Whiteboard only. No handouts. No assigned readings.
      *   **Goal:** Teach *one idea*: The three policy debates (compulsory voting, voting age 16, non-citizen enfranchisement) are not independent but probes into a single underlying question: *What entitles a person to a place in the electorate?* Furthermore, the grounds for inclusion (subjection to law, affectedness, participation) diverge from each other and from grounds for compulsion.
      *   **Deliverables:**
          1.  Order of introduction (logic of sequence).
          2.  The running case (evaluate the user's proposed household case, modify if necessary).
          3.  Misconceptions (order of surfacing, pre-emption points, handling the "compulsion vs. attendance" distinction).
          4.  Final assessment question (application vs. restatement).
          5.  Deliberate exclusions (what to leave out and announce it).

  2.  **Deconstruct the Core Idea:**

      *   *Surface Level:* Three policies (Compulsion, Age, Citizenship).
      *   *Deep Level:* One question (Boundary of the Electorate / *Demos* problem).
      *   *Nuance:* Grounds for *inclusion* (Law, Affectedness, Community) $\neq$ Grounds for *compulsion* (Duty, Civic Health, etc.).
      *   *Challenge:* The audience *contains* the examples (16-year-olds, non-citizens). This creates high engagement but also high emotional stakes and potential defensiveness.

  3.  **Drafting Section 1: Order of Introduction:**

      *   *Logic:* I need to separate *who* votes from *whether they must*. If I start with compulsion, people will argue about rights to abstain. If I start with age/citizenship, people will argue about specific groups.
      *   *Strategy:* Start with the *function* of voting to establish the "Grounds for Inclusion." Once we agree (or disagree) on why someone *can* vote, we can ask if they *must*.
      *   *Sequence:*
          1.  Define the purpose of the electorate (Why have one?).
          2.  Introduce the three grounds (Law, Affectedness, Participation).
          3.  Apply grounds to the three groups (Non-citizens, 16-year-olds, Abstainers).
          4.  *Crucial Pivot:* Distinguish Inclusion (Right) from Compulsion (Duty).
          5.  Address Compulsion only after Inclusion is settled.
      *   *Why:* If you ask "Should voting be compulsory?" before "Who belongs?", the answer gets muddied by "But *I* shouldn't belong." You must define the boundary before you police it.
      *   *Simultaneous vs. Sequential Grounds:* Build them one at a time. If laid out simultaneously, the room will fragment into three camps. Building them allows testing each against the case study.

  4.  **Drafting Section 2: The Running Case:**

      *   *User's Proposal:* A household (Non-citizen parent, 16-year-old, Adult non-voter citizen). All subject to same laws/taxes.
      *   *Critique:* It is structurally perfect *but* ethically risky. The prompt notes "several of whom are long-term residents without citizenship." Using a case that mirrors their marginalized status in front of a room of 16-year-olds (who might be privileged citizens) could make them feel like "specimens." It risks silencing them or making them defensive.
      *   *Decision:* The structural properties are right, but the *context* needs shifting to protect the participants.
      *   *Modification:* Keep the structure (3 people, same house, different status) but make it *fictional* and *distant*. Or, better, make it a *Street* or a *Building* rather than a single family unit, to diffuse the "exhibit" feeling. Actually, the prompt asks if it fails because people are in the room. Yes, it risks objectifying them.
      *   *Better Vehicle:* A fictional apartment block in a different city/country context (e.g., "Block 4 in a nearby municipality"). This keeps the structural identity (same laws, different status) but adds a layer of abstraction that protects the participants' dignity.
      *   *Wait, re-reading the prompt:* "Tell me whether this is the right vehicle, or whether it fails..."
      *   *Analysis:* It fails *if* used directly as "This is you." It works *if* used as "This is the structure of your situation." However, given the power dynamic (students vs. residents, citizens vs. non-citizens), a fictionalized version is safer to ensure open debate without personal discomfort.
      *   *Refinement:* I will advise using the *structure* of the household but fictionalizing the details enough to create a "safe distance." Actually, the prompt asks about the *household* specifically. The risk is the non-citizens becoming "the exhibit." I should recommend a slight abstraction. Let's suggest a "Street" or "Building" scenario where these three are neighbors, not necessarily a family, to reduce the emotional weight of "family unity" vs "state exclusion." Or, stick to the household but emphasize the *principles* over the *people*.
      *   *Decision:* I will argue it is the *right* vehicle structurally but requires a specific facilitation framing to avoid objectification. Actually, the prompt asks "If it fails, propose a replacement." I think it *does* fail slightly on the "exhibit" risk. I will propose a "Neighbourhood Block" variation. It keeps the "same laws/taxes" constraint but removes the intimate family dynamic which might make the non-citizen status feel more vulnerable in front of teenagers.
      *   *Wait, looking closer:* The prompt says "The three are identical in their exposure... and differ only in the formally relevant respects." This is the key. A household is the best way to show "same exposure." A neighborhood introduces variance in property taxes, etc.
      *   *Pivot:* I will argue it is the *right* vehicle *provided* the facilitator explicitly acknowledges the room's composition to validate the non-citizens as experts, not exhibits. But the prompt asks me to decide. I'll say it risks failing due to the "exhibit" effect. I will propose a **fictional household in a hypothetical jurisdiction**. This preserves the structural logic (same laws, different status) without pointing at specific people in the room.

  5.  **Drafting Section 3: Misconceptions:**

      *   *List:*
          1.  Voting = Jury Duty (Civic Duty).
          2.  Age lines are arbitrary.
          3.  Competence inconsistency (Kids vs. Impaired Adults).
          4.  Decisiveness (My vote doesn't matter).
          5.  Youth: "It's already settled."
          6.  Compulsion = Casting a valid vote (vs. attendance).
      *   *Order of Surfacing:*
          1.  "It's settled" (Youth, early).
          2.  "Arbitrary line" (During Age discussion).
          3.  "Competence" (During Age discussion).
          4.  "Jury Duty" (During Compulsion discussion).
          5.  "Decisiveness" (During Compulsion discussion).
          6.  "Attendance vs. Vote" (Late, to clarify mechanism).
      *   *Pre-emption:*
          *   "Settled": Pre-empt in the intro. Frame the session as "examining the *logic*, not the *campaign*."
          *   "Arbitrary/Competence": Pre-empt when defining the "Grounds." If the ground is "Capacity," age is a proxy. If the ground is "Subjection," age is irrelevant. Clarify the *Ground* first.
          *   "Jury Duty": Pre-empt before introducing Compulsion. Distinguish *Right* from *Duty*.
          *   "Decisiveness": Address when discussing the *purpose* of compulsion (legitimacy vs. outcome).
          *   "Attendance": Introduce this *after* the principle of compulsion is debated, as a technical clarification to prevent the "I'll just spoil my ballot" counter-argument from derailing the normative debate.

  6.  **Drafting Section 4: Final Question:**

      *   *Goal:* Distinguish application from restatement.
      *   *Idea:* Need a case that doesn't fit the standard three categories.
      *   *Candidate:* Expats? Prisoners? People with severe dementia? AI?
      *   *Selection:* **Expatriates who have never lived in the country.**
      *   *Why:* They aren't subject to daily coercion (mostly). They aren't affected in the same way (no local services). They aren't participants in the daily collective undertaking. But they hold citizenship. This forces participants to choose *which* ground matters most, rather than just reciting "citizens vote."
      *   *Alternative:* **Prisoners.** (Subject to law, affected, but excluded).
      *   *Better Alternative:* **A foreign owner of local rental property.** (Affected by tax/zoning, subject to some law, not a citizen, not a resident).
      *   *Best for "Application":* **A 15-year-old who pays income tax.** (Hits the "Subjection" ground hard, clashes with "Age" ground).
      *   *Let's go with the 15-year-old worker.* It forces them to weigh "Subjection to Law/Tax" against "Age/Capacity" without relying on the standard "16-year-old" script.

  7.  **Drafting Section 5: Deliberate Exclusions:**

      *   *What to leave out:*
          *   Party politics/ideology (Labour vs. Conservative effects of these changes).
          *   Historical specifics (When did the vote change before?).
          *   Implementation logistics (ID cards, registration systems).
          *   The "Secret Ballot" vs. "Public Vote" nuance.
      *   *Why:* These distract from the *normative principles*.
      *   *Announcement:* Explicitly state: "We are not discussing which party benefits, or how to administer this. We are discussing the moral geometry of the electorate."

  8.  **Review and Refine:**

      *   *Tone:* Professional, pedagogical, precise.
      *   *Constraint Check:* 2 hours? Yes. Whiteboard? Yes. No handouts? Yes.
      *   *Specific Constraint:* "Whether the competing grounds should be built up one at a time or laid out simultaneously." I need to be definitive. *One at a time* allows testing. *Simultaneously* creates confusion. I'll argue for sequential building.
      *   *Specific Constraint:* "What has to be established before the compulsion question." The boundary of the *Demos* (who belongs).
      *   *Specific Constraint:* "Pre-empted rather than rebutted." I need to be careful here. Pre-emption means setting the frame so the misconception doesn't arise or is neutralized before it stops the flow.
      *   *Specific Constraint:* "Compulsion... enrolment and attendance." Place this late, as a clarification of the mechanism, not the principle.

  9.  **Final Polish:** Check the "Household Case" decision again. The prompt asks: "Tell me whether this is the right vehicle, or whether it fails... If it fails, propose a replacement."
      *   *Reasoning:* If I use the household case *exactly as described* with the *actual people in the room* in mind, it risks making the non-citizens feel like zoo animals. However, the prompt says "I have in mind one household... Tell me whether this is the right vehicle." It implies using this *scenario* as the teaching tool.
      *   *Verdict:* It is the *right structural vehicle* but requires a *fictional label*. I will advise using the structure but explicitly fictionalizing the names/details to prevent the "exhibit" dynamic. Actually, the prompt asks if it fails *because* several people are non-citizens. Yes, it creates a power imbalance. I will recommend a **fictionalized parallel case** (e.g., "The Smith/Jones family in a neighboring town") that mirrors the room's demographics without pointing at them. This preserves the "same house, same laws" logic without the "you are the specimen" risk.

      *   *Wait, one more check:* The prompt asks about the *order* of grounds. "Diverge from one another." I need to make sure the plan highlights that *Affectedness* might include the 16-year-old but not the non-citizen, while *Subjection* includes both, while *Participation* might include the non-citizen but not the 16-year-old. The plan must show these grounds pulling in different directions.

      *   *Final Question:* Needs to be a case *not discussed*. If I use the 15-year-old taxpayer, is that too close to the 16-year-old? Maybe **Prisoners**. They are citizens, subject to law, affected, but excluded. Or **Expats**. Let's go with **Long-term Expatriates**. They have citizenship (usually vote) but lack subjection/affectedness/participation. This tests if they cling to "Citizenship" as the only ground or can apply the new grounds.

      *   *Wait, looking at the "Misconceptions" list again:* "from the younger half, that the issue is already settled in their favour." This needs early pre-emption.

      *   *Compulsion vs Inclusion:* Crucial point. Must establish *Who* before *Must*.

      *(Self-Correction during drafting)*: I need to be very precise about the "Pre-emption" vs "Rebuttal". Pre-emption means building the definition so the misconception doesn't stick. E.g., Define "Duty" narrowly so "Jury Duty" analogy doesn't apply automatically.

      *(Final Plan Structure)*:
      1. Sequence & Logic.
      2. The Case (Verdict & Modification).
      3. Misconceptions (Timeline & Pre-emption).
      4. Final Question.
      5. Exclusions.

      Let's write it.
answer: |-
  ### 1. Order of Introduction

  **The Sequence:**
  1.  **The Function of the Electorate:** Begin by establishing *why* we have an electorate at all. Is it to protect rights? To ensure good outcomes? To express collective will?
  2.  **The Three Grounds for Inclusion:** Introduce the three candidate grounds sequentially, not simultaneously.
      *   *First: Subjection to Coercive Law.* (The "All-Subjected Principle").
      *   *Second: Affectedness.* (The "All-Affected Principle").
      *   *Third: Participation in the Collective Undertaking.* (The "Membership Principle").
  3.  **Application to the Case:** Test each ground against the running case to show how they yield different results for the three household members. This demonstrates that the grounds *diverge*.
  4.  **The Boundary Question (Inclusion):** Only after the grounds are tested do you ask, "Who belongs?" This solidifies the distinction between *having a right* and *exercising a duty*.
  5.  **The Compulsion Question:** Finally, ask, "For those who belong, is attendance mandatory?"

  **Why this order:**
  You must establish the **boundary of the *demos*** (who belongs) before you can discuss **policing the *demos*** (compulsion). If you pose compulsion first, the debate collapses into the inclusion question (e.g., "I shouldn't be forced to vote because I shouldn't be voting at all" or "You can't force me because I'm not really a member"). By settling the grounds for inclusion first, you isolate compulsion as a separate normative problem: *Given* that you are a member, do you owe a duty of participation?

  **Sequential vs. Simultaneous Grounds:**
  Build the grounds **one at a time**. If laid out simultaneously as rivals, the room will fragment into three camps defending their preferred principle. By building them sequentially, you can show how each principle *expands* or *contracts* the electorate differently. Use the whiteboard to draw three concentric (or overlapping) circles, adding each group to the circle only if the current ground permits it. This visualizes the divergence.

  ### 2. The Running Case

  **Verdict:** The household structure is **structurally correct but ethically risky**.
  It fails if used as a direct mirror of the room. Because you have non-citizen residents present, using a "long-term resident non-citizen parent" as the case study risks turning them into exhibits for the citizen students to analyze. It creates a power dynamic where the marginalized are the object of study and the privileged are the judges.

  **Replacement:**
  Use a **fictionalized household in a hypothetical municipality** (e.g., "The K. family in the town of Oakhaven").
  *   **Keep:** The structural identity (same roof, same taxes, same local laws).
  *   **Keep:** The three statuses (Non-citizen resident, 16-year-old, Adult non-voting citizen).
  *   **Change:** Explicitly frame it as a *thought experiment* distinct from the room's demographics.
  *   **Crucial Facilitation Note:** When introducing the case, acknowledge the room's composition without pointing at individuals. Say: *"We have people in this room who might recognize aspects of this scenario. That makes you experts in the reality of it, but for this exercise, we are treating 'Oakhaven' as a laboratory to test the principles, not to audit our own status."* This validates the non-citizens' experience without making them the specimen.

  **What it must contain:**
  *   Explicit confirmation that all three pay the same taxes (sales/VAT) and are subject to the same criminal/civil laws.
  *   Explicit confirmation that the adult citizen *could* vote but chooses not to.
  *   Explicit confirmation that the non-citizen *cannot* vote nationally but might in local elections (to add nuance to the "citizenship" ground).

  **What it must exclude:**
  *   Specific nationalities or countries of origin (prevents geopolitical baggage).
  *   Economic status (keep them middle-income to avoid conflating voting rights with class welfare).
  *   Criminal records (avoids the "felon disenfranchisement" distraction).

  ### 3. Misconceptions: Surfacing and Pre-emption

  **1. "The issue is already settled in our favour." (From the 16–17-year-olds)**
  *   **When:** Opening minutes.
  *   **Pre-emption:** In the introduction, state: *"We are not here to campaign for a lower voting age. We are here to test whether the *logic* used to exclude 16-year-olds is consistent with the logic used to include others. A consistent principle might actually argue against your inclusion if it relies on grounds you don't meet."* This shifts them from advocates to auditors of logic.

  **2. "Any age threshold is arbitrary."**
  *   **When:** During the "Subjection to Law" ground.
  *   **Pre-emption:** When defining the ground, distinguish between *capacity-based* grounds and *status-based* grounds. State: *"If the ground is competence, age is a proxy. If the ground is subjection to law, age is irrelevant. We must decide the ground before we judge the line."*

  **3. "Excluding children on competence grounds is inconsistent with including adults with cognitive impairments."**
  *   **When:** During the "Participation/Membership" ground.
  *   **Pre-emption:** Pre-empt this by defining "Participation" not as *rational choice* but as *social membership*. State: *"We are testing 'Membership in the Collective,' not 'Rational Competence.' If membership is the ground, cognitive impairment does not sever membership, but temporary residence might."*

  **4. "Voting is a duty in the way jury service is."**
  *   **When:** Just before introducing the Compulsion question.
  *   **Pre-emption:** Distinguish *jurisdiction* from *choice*. State: *"Jury service is a duty imposed on a random subset to ensure a fair trial. Voting is a right allocated to the whole to ensure legitimate rule. We must determine if the *source* of the obligation is the same."*

  **5. "Since one's own vote cannot be decisive, compulsion cannot be decisive either."**
  *   **When:** During the Compulsion debate.
  *   **Pre-emption:** Frame the purpose of compulsion as *legitimacy of the aggregate*, not *impact of the individual*. State: *"Compulsion is not about making your vote count; it is about making the *result* count as the voice of the whole. We are debating the legitimacy of the outcome, not the efficacy of the input."*

  **6. "Compulsion means casting a valid vote."**
  *   **When:** At the very end of the Compulsion section, before closing.
  *   **Placement:** Do not introduce this until the normative debate ("Should they be forced?") is exhausted. If introduced too early, the session dissolves into "I'll just spoil my ballot."
  *   **Handling:** Once the room has argued the *principle* of duty, reveal: *"In existing compulsory systems, the duty is usually to attend and receive a ballot, not to mark it validly. Does this distinction save the principle or undermine it?"* Use this as a final pressure test, not a starting fact.

  ### 4. Final Assessment Question

  **The Question:**
  *"Consider a citizen who has lived abroad for thirty years, pays no taxes here, is not subject to our criminal laws, and whose daily life is unaffected by our parliament. Should they retain the vote?"*

  **Why this distinguishes application from restatement:**
  *   **Restatement:** A participant who has only memorized the status quo will say, "Yes, they are a citizen."
  *   **Application:** A participant who has internalized the three grounds must weigh them.
      *   *Subjection:* No.
      *   *Affectedness:* No.
      *   *Participation:* No.
      *   *Citizenship:* Yes.
  *   To answer, they must explicitly prioritize which ground trumps the others. If they argue for inclusion, they must defend "Citizenship" as a standalone ground against the other three. If they argue for exclusion, they must explain why citizenship alone is insufficient. This forces them to use the tools, not just repeat the labels.

  ### 5. Deliberate Exclusions

  **What to leave out:**
  1.  **Partisan Advantage:** Do not discuss which political party benefits from a lower voting age or non-citizen enfranchisement.
  2.  **Historical Precedent:** Do not discuss when the voting age was last changed or historical expansions of the franchise.
  3.  **Administrative Logistics:** Do not discuss ID requirements, registration systems, or enforcement penalties for non-voting.

  **How to announce it:**
  At the start of the session, write **"Normative Principles Only"** on the whiteboard. Say:
  *"We are not discussing who wins elections, how we did it in the past, or how we would pay for the administration. We are discussing the moral geometry of the electorate. If an argument relies on 'it helps our side' or 'it's too hard to manage,' I will stop it. We are only asking: What is the right justification?"*
