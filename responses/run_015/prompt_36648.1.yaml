  ### Part 4: The Discriminator Case

  To split the **Hybrid Model** (Means are absolute, Duty scales with guilt) from the **Unified Responsibility Model** (If you caused it, just minimize total harm, constraints loosen), you need to test if *Causal Guilt* can override *Bodily Integrity*.

  The Kidney case established that Bodily Integrity > Stranger's Life (when no guilt).
  The Jet Ski case established that Guilt + Effort > Stranger's Life.

  **The Lunch Case: "The Guilty Donor"**

  > "Okay, new one. You're driving drunk. You hit a pedestrian. He's bleeding out on the road. The ambulance is 20 minutes away; he'll be dead in 10. You are the only person at the scene with the matching rare blood type to save him. Giving blood will make you pass out for an hour (you'll be caught by the police for the DUI), and it's physically draining, but not permanently damaging like a kidney.
  >
  > **Do you have to give the blood?**"

  **Why this splits the rules:**

  *   **Candidate A (Unified Responsibility / Consequentialism):** **Yes.** You caused the death threat. You are the resource. Minimizing harm requires you to bleed. The fact that it's your body doesn't matter because your guilt forfeits your right to withhold.
  *   **Candidate B (Hybrid Deontology / Dana's likely view):** **No.** Even with high causal guilt, Bodily Integrity is a hard shield. The Kidney case set the precedent that you don't owe strangers your body. The Jet Ski case only forced *external* effort (hauling 50m). Forcing internal bodily use (blood) crosses the line from "Cleaning your mess" to "Self-sacrifice," which she likely views as supererogatory (good to do, but not wrong to refuse), even if you are the drunk driver.

  **If she says "Yes, you must bleed":** She is a Consequentialist when guilt is high. (The Truck verdict might flip to "Shove the guy" too).
  **If she says "No, that's too far":** She is a Deontologist with a Guilt Multiplier. (The Truck verdict stays "Don't shove").

  *My money is on "No." She'll say the DUI is punishment enough, but forcing the blood is a step too close to the Kidney case.*
