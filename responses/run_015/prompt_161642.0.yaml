answer: |-
  **Historical Accuracy and Theoretical Mapping**
  Your outline is largely accurate, though the Tribunal significantly narrowed the conspiracy charge, accepting it only for crimes against peace rather than war crimes or crimes against humanity. Mapping the case through H.L.A. Hart's distinction clarifies the Tribunal's structure. The general justifying aim was predominantly consequentialist: establishing a historical record, deterring future aggression, and legitimizing the new international order. The distribution of punishment, however, was strictly retributive: liability required individual criminal guilt, rejecting collective condemnation. Retributivism owed the defendants protection from being used merely as means, while consequentialism owed the global community future safety. Retributivism remains silent on why punish at all, and consequentialism is silent on why punish *this* guilty person if punishing an innocent one yields better outcomes, a gap the Tribunal plugged with procedural rights.

  **The Tribunal's Hybrid Structure**
  The Tribunal best fits a consequentialist aim with retributive distribution. The Allies sought nation-building and didactic outcomes unanticipated by classical theories, yet they bound themselves to retributive constraints to avoid show-trial illegitimacy. This hybrid acknowledges that while the purpose was forward-looking peace, the method required backward-looking justice. The relevant parties—the German public, victims, and victors—were served by the aim, while the defendants were protected by the distribution principles. This combination dissolves into a unique juridical category where punishment serves as a bridge between vengeance and policy, demanding guilt even when utility might prefer expediency.

  **The Clerk's Retributive Error**
  Your clerk's dilemma is genuine philosophical territory, not mere rhetoric, but his conclusion about retributivism is incorrect. The retributivist reply regarding scarce enforcement resources does not concede the point; it dissolves it by insisting justice is agent-relative to the offender. If the defendant is guilty, punishing him is just regardless of others escaping, provided the selection is not discriminatory. Furthermore, retributivism is absolutely not committed to ratcheting; inflating sentences to approximate aggregate guilt would violate the core principle that punishment must fit the individual's crime. The clerk mistakes comprehensive justice for individual justice. Retributivism survives the sample case because it demands only that the punished deserve it, not that all who deserve it are punished.

  **The Consequentialist Vulnerability**
  The clerk is also wrong to exonerate consequentialism. Exemplary punishment of a sample looks precisely like using defendants for the sake of others, confirming the Kantian charge that consequentialism licenses instrumentalization. If the aim is purely spectacle, the individual's guilt becomes secondary to the message sent. While the Tribunal avoided pure instrumentalization by requiring proof of guilt, the selective prosecution inherently serves a forward-looking utility that risks treating the dock as a stage. This vulnerability confirms the retributivist suspicion that without strict desert constraints, consequentialism reduces justice to social engineering.

  **Verdict on Theory and Atrocity**
  Historians contest whether Jackson prioritized law or policy, but the philosophical verdict is clearer. Nuremberg does not confirm that retributive language is mere decoration, nor solely that consequentialism licenses spectacle. Instead, it shows both theories were designed for ordinary crime and that mass atrocity is a case neither anticipated. The episode demands a hybrid model where backward-looking guilt validates forward-looking peace. Your clerk's dilemma highlights the tragedy of non-ideal theory: perfect justice is impossible, but the attempt to approximate it through selective punishment remains the only alternative to barbarism or impunity.
