  \section*{The Rectified Zeno Lamp}

  Construct a circuit consisting of a DC voltage source, a parallel-plate capacitor, and an incandescent lamp wired across the capacitor, designed to illuminate only when capacitor voltage exceeds a threshold $V_{th}$. Insert a ideal diode in series with the charging path to prevent reverse current. The charging path is completed by a "switch" formed by a conductive steel ball bouncing on a conductive anvil plate; contact closes the circuit (ON), air gaps open it (OFF). Drop the ball from a height such that, given its coefficient of restitution $r < 1$, the infinite sequence of bounces converges exactly to $t=1$. The ball's contact generates the Thomson sequence (Close, Open, Close, Open...) with geometrically shrinking durations. At $t=1$, the ball comes to rest on the anvil.

  The discrete switch sequence $S(t)$ oscillates $1, 0, 1, 0 \dots$ as $t \to 1^-$, possessing no mathematical limit, which fuels the standard underdetermination verdict. However, the capacitor voltage $V_c(t)$ is a continuous physical quantity governed by $\dot{V}_c = I/C$. Because the **Rectifying Diode** blocks discharge during the "OFF" (air gap) phases, $V_c(t)$ is monotonic non-decreasing. Despite the infinite toggling, the total "ON" time sums to a finite value ($T_{on} = \sum \Delta t_{contact}$), causing $V_c(t)$ to converge to a determinate limit $V_{final}$. If the source voltage and capacitance are sized such that $V_{final} > V_{th}$, the lamp is determinately ON at $t=1$. It remains on for a nonzero stretch $\tau = R_{lamp}C$ as the capacitor discharges through the lamp. The answer depends on the accumulated charge, not the final switch position. (Flag: The mechanical actuator—the ball—settles to a determinate "Closed" position at $t=1$, but this is causally screened off; even if the ball were magically removed at $t=1$ leaving the circuit open, the stored charge would keep the lamp on. The determinacy arises from the memory element, not the actuator's limit.)

  Delete the **Rectifying Diode**, and the case collapses back into plain underdetermination: the capacitor would charge during contact and discharge during gaps. With symmetric intervals and ideal components, $V_c(1)$ would converge to zero (or oscillate depending on phase), leaving the lamp state undefined. The diode breaks the symmetry, allowing the continuous variable to "remember" the history despite the divergent switch state. The best attack is that physical diodes leak and real balls don't bounce infinitely (quantum/thermal noise stops the Zeno process). This attack fails to restore underdetermination; it merely shifts the limit. Leakage sets a maximum voltage ceiling, and thermal noise sets a minimum bounce height, but both are continuous bounds. As long as the engineered signal-to-noise ratio ensures $V_{final} \gg V_{th}$ before noise dominates, the lamp is physically forced ON. The "indeterminacy" was never in the physics, but in the abstract logical description that ignored the continuous state variable.

  \answer{ON}
