answer: |-
  ### Brainstorm: Dr. K's Three Escape Routes
  Before we mic up, here are the three standard defenses Dr. K will likely deploy to dodge the Frege-Geach bullet. Keep these in mind when she starts hedging.

  1.  **The Bifurcation Strategy:** She'll argue the *belief-component* carries the truth-conditional load for logic and embedding, while the *attitude-component* only kicks in during assertion. (Risk: Makes the attitude semantically inert.)
  2.  **The Complex State Strategy:** She'll claim the hybrid state is a sui generis primitive. Logical operators modify the whole complex state, not just the belief part. (Risk: Hard to explain logical validity between complex states without truth conditions.)
  3.  **The Higher-Order Disposition:** She'll suggest that in embeddings (like conditionals), the attitude isn't expressed directly but as a disposition to have the attitude if the condition is met. (Risk: Collapses into a belief about one's own psychology.)

  ***

  ### The Interview Questions

  **1. The Conditional Antecedent**
  Let's jump straight into the deep end. In a standard expressivist view, saying "Murder is wrong" expresses an attitude. But when I say, "If murder is wrong, then stealing is wrong," I'm not actually expressing an attitude toward murder in the antecedent. I'm just setting up a condition. In your hybrid model, what state am I expressing in that "If" clause? Is the attitude component paused, or is it somehow active?

  **2. Follow-up: The Logic-Bearer Reply**
  *I expect you to say the cognitive belief-component handles the logic here while the attitude waits in the wings.* But if the belief-component is doing all the heavy lifting for the conditional structure, doesn't the attitude become semantically redundant? Why not just be a descriptivist about the conditional and save the expressivism for the assertion?

  **3. Moral Disagreement**
  Let's talk about disagreement. If I say "Murder is wrong" and you say "Murder is not wrong," standard descriptivism says we have contradictory beliefs. For you, we have clashing hybrid states. But for us to genuinely disagree, don't we need to be talking about the same content? If my belief-component matches yours but our attitudes differ, is that a logical contradiction or just a clash of tastes?

  **4. Follow-up: The Commitment Clash Reply**
  *You'll likely argue that logic governs commitments, not just truth conditions.* But if the belief-component is identical between us, what prevents this from sliding back into descriptivism where the "real" disagreement is just about the non-cognitive flair? How do you validate the disagreement without relying on the truth-apt belief part?

  **5. Negation and Contradiction**
  Here's a technical one. When I say "Murder is not wrong," am I negating the belief-component, the attitude-component, or the whole hybrid package? If I negate the belief but keep the attitude, I seem irrational. If I negate the attitude but keep the belief, am I still making a moral claim? Where does the negation operator land?

  **6. Follow-up: The Dispositional Shift Reply**
  *I anticipate you'll say negation shifts the attitude into a world-directed disposition.* But isn't a "disposition to not have an attitude" just a second-order belief about my own psychology? If so, haven't you just translated the moral claim into a psychological description, which is exactly what expressivism tries to avoid?

  **7. Modus Ponens and Validity**
  Let's look at validity. If I accept "If murder is wrong, then stealing is wrong" and I accept "Murder is wrong," I feel compelled to accept "Stealing is wrong." In your view, what forces that compulsion? Is it the logical relation between the belief-components, or is there a logical relation between the attitudes themselves?

  **8. Embedding in Questions**
  Conditionals are hard, but questions are weirder. If I ask, "Is murder wrong?", what hybrid state am I expressing? I'm not asserting a belief, and I'm not necessarily holding an attitude. Does the hybrid model break down in interrogatives, or do we need a third component to handle inquiry?

  **9. The Occam's Razor Challenge**
  I have to play devil's advocate here. If the cognitive component handles the embedding, the logic, and the truth conditions, and the non-cognitive component only handles the motivational oomph during assertion... why keep the hybrid view at all? What explanatory work is the non-cognitive part doing that a simple descriptivist theory of motivation couldn't handle?

  **10. The Collapse Boundary**
  Final question. There's a thin line between "hybrid expressivism" and "descriptivism with extra steps." At what point does making the belief-component robust enough to solve Frege-Geach force you to admit that the moral sentence is *really* just describing a fact, and the attitude is just a causal side effect?

  Verdict: Hybrid expressivism collapses into descriptivism if the cognitive component must bear the logical load to solve Frege-Geach, but remains genuinely non-cognitive only if it can explain logical validity between attitudes without truth conditions.
