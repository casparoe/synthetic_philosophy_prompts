answer: |-
  1. The regulatory gap presupposes a binary, phylogenetic theory of moral status where sentience is strictly tied to vertebrate neuroanatomy rather than functional capacity. This view implicitly rejects moral uncertainty, treating the absence of proof for insect pain as proof of absence rather than a significant risk factor.

  2. Current rules operate as if expected-value aggregation fails for moral risk, assuming that administrative tractability excuses ignoring low-confidence cases regardless of the stakes involved. This presupposition is false, as the sheer scale of farming renders even minimal sentience probabilities ethically decisive.

  3. An insect-welfare policy built on the scale argument would mandate welfare thresholds weighted by the probability of sentience, treating a small chance of pain in billions of insects as morally equivalent to certainty in fewer vertebrates. This shifts the burden of proof onto farmers to demonstrate negligible suffering risk rather than onto regulators to prove actual sentience.

  4. Probabilistic welfare audits are conceptually coherent because they measure adherence to risk-mitigation protocols rather than verifying subjective experience directly. Regulators would audit housing density and slaughter methods against a sliding scale of moral risk instead of seeking impossible confirmation of consciousness.

  5. Replacing the current gap requires adopting a precautionary principle framework that aggregates expected suffering across populations, forcing density limits and humane slaughter standards proportional to the sheer number of lives at stake. This abandons the false security of backbone-based ethics in favor of a utilitarian calculus that respects the magnitude of potential harm.
