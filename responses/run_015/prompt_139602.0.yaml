prompt: |-
  hey — something I keep going back and forth on and would like a real opinion about.

  I subcontract cabinet finishing to the same guy, Marek, roughly one job a month, and for almost two years its worked great: I pay on delivery, he never asks for a deposit, nothings in writing, and neither of us has ever stiffed the other. Two things changed recently. He told me he's relocating out of state in about three months, so there's a clear end date to this arrangement now. And separately, I've realized I often genuinely can't tell whether a job came out badly because he rushed it or because the lumber was already warped when it reached him — I'd guess that's true for maybe one job in five, and I'm just guessing in those cases.

  A friend says the relocation is decisive: with no next job after this one, he has no reason to care anymore, so I should stop paying on delivery and hold payment until I've inspected each finished job myself. The logic makes sense but it feels like it throws away two years of something real. And the second thing nags at me too — if I start punishing every job that looks bad, sometimes I'll be punishing him for the wood, and I have a feeling that could spiral into us both acting worse than we want to.

  So: is my friend right? What should I actually do over these last three months, and does the fact that I'm sometimes guessing about who's at fault change the answer?
