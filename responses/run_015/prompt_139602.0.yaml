answer: |-
  Your friend is operating on pure game theory, but you are operating in a human relationship. Your friend is **half-right about the risk, but wrong about the solution.**

  If you suddenly switch to withholding payment, you signal distrust. In a trade relationship, signaling distrust often *creates* the behavior you're trying to avoid. If Marek feels you're suddenly policing him, he may disengage emotionally, rush the last few jobs, or become defensive about the wood warping issues—which validates your fear of a downward spiral.

  However, your friend is right that the *leverage* has shifted. For two years, Marek had an incentive to keep you happy to get next month's job. Now, the incentive is just his professional pride and reputation. That is usually enough for good tradespeople, but it is not enough for *business risk management*.

  Here is the real opinion on how to handle the next three months without burning the bridge.

  ### 1. Don't change the payment terms; change the *process*.
  Your friend suggests holding payment. I suggest you keep paying on delivery, but **inspection must happen before the check is written.**

  If you are currently handing over a check the second he pulls up, stop that. That is risky regardless of Marek's moving status. The new protocol should be: Marek delivers → You inspect together → You hand over the check.
  *   **Why:** This isn't punishment; it's closure. It ensures that if there is a problem, it is identified while he is still there to acknowledge it. It prevents the "he said, she said" later.

  ### 2. Address the "Wood vs. Work" ambiguity directly.
  This is actually a bigger risk than the relocation. If you start rejecting jobs or deducting money for warping that was actually the lumber's fault, Marek will feel you are reneging on the deal. He knows he's moving; he won't fight you on it, he'll just quietly do the bare minimum for the last three jobs.

  You need to verbally formalize the boundary on materials.
  *   **The Fix:** Tell him, *"Marek, I've realized sometimes I can't tell if a warp is the wood or the finish. I don't want you fixing my lumber problems, and I need to know the finish is solid. Let's agree that if the wood was warped before it got to you, I own that. If it's the finish, you own that. Let's look at it together on delivery so we agree on which it is."*
  *   **Why:** This removes the adversarial dynamic. You are aligning yourself *with* him against the problem, rather than making him the problem.

  ### 3. Have the "End of Contract" conversation.
  Don't pretend the relocation isn't happening. Acknowledge it professionally.
  *   **The Script:** *"I know you're moving in three months. I've valued this partnership and want to make sure these last few jobs are as strong as the first two years. Since this is our final run, I'm going to be a bit more particular on inspections just so we both walk away clean with no loose ends. Hope that makes sense."*
  *   **Why:** This frames your increased scrutiny as a desire for a clean handshake, not a lack of trust. It appeals to his pride ("let's walk away clean") rather than his fear ("I'm watching you").

  ### Summary of Action Plan
  1.  **Do not** switch to net-30 or hold checks for days. That is hostile.
  2.  **Do** insist on inspecting the cabinets *before* handing over the payment on delivery day.
  3.  **Do** have a 5-minute conversation clarifying that you won't hold him responsible for bad lumber, but you need him to guarantee the finish.
  4.  **Do** acknowledge the timeline openly so he knows you know he's leaving.

  **The Verdict:**
  Your friend's advice protects your wallet but sacrifices the relationship. Your instinct protects the relationship but risks the wallet. **The middle path protects both.** Treat the last three months as a "project closeout" phase. Be professional, be present, be clear, but remain fair. If Marek is the professional you think he is, he will respect the boundaries. If he reacts poorly to reasonable inspection, he wasn't the partner you thought he was anyway, and you've caught it before he left the state.
