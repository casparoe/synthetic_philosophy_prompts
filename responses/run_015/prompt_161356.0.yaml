answer: |-
  - Assumptions I can safely make about this room (~100 words)
  Assume fluency in Bayes' rule and conditional probability notation; they will not need derivation of P(H|E). Assume familiarity with the slogan "common priors" but treat the formal definition of common knowledge as unknown. Do not assume comfort with partition semantics or state spaces; you must introduce these visually via the whiteboard. Assume high skepticism of "idealizations" but willingness to accept them for the sake of the model. Treat the "averaging heuristic" as an entrenched habit, not a mere confusion. Assume no knowledge of game-theoretic common knowledge definitions (Kripke structures). The biologist needs concrete states; the programmer needs logic flow.

  - Dependency map (~300 words)
  1. **Common Prior Assumption (CPA):** Establish this first. Without a shared starting point, divergence is permissible. This anchors the necessity of agreement.
  2. **Private Signals (Partitions):** Introduce information asymmetry. This must follow CPA to show divergence arises from data, not bias.
  3. **Posterior Calculation:** Compute individual updates. This validates their Bayesian intuition before complicating it.
  4. **Common Knowledge of Posteriors:** Define this strictly (I know that you know...). This must follow calculation to show the new constraint imposed by transparency.
  5. **The Agreement Result:** Demonstrate that 4 forces equality. This relies on 1 and 4; without CPA, equality isn't required.
  6. **Decoupling Evidence from Posteriors:** Explicitly contrast sharing signals vs. sharing posteriors. This breaks the folk version only after the mechanism is understood.
  7. **Heuristic Failure:** Show averaging fails. Place this last to dismantle the default resolution strategy after the correct one is established.

  This order prevents early nihilism about the model. If you introduce common knowledge before priors, they will argue about realism. If you introduce averaging before the theorem, they will adopt it as the solution. The break on "shared evidence" happens at step 6, ensuring they understand the mechanism before you remove the crutch they thought was essential.

  - The carrying example (~350 words)
  Use a "Biased Coin" scenario. Proposition: Coin is Double-Headed (H) vs. Fair (F). Common Prior: 50%. Alice observes 1 Head (Likelihood Ratio 2:1). Bob observes 2 Heads (Likelihood Ratio 4:1). Alice's posterior: 2/3 (66.7%). Bob's posterior: 4/5 (80%). Average: 73.3%. Combined Evidence (3 Heads): Likelihood 8:1, Posterior 8/9 (88.9%).

  *Why:* Asymmetric signal strength prevents averaging from accidentally matching the combined evidence. Binary outcome avoids political contamination. Clean fractions allow board work.

  *Bad Version:* Symmetric signals (both see 1 Head). Posteriors match immediately; averaging heuristic appears valid. This loses the room because the math doesn't punish the wrong intuition.

  *Rejected Alternative:* Urn problems with replacement. Rejected because participants argue about physical independence assumptions; coin bias feels more intrinsic to the "state" being modeled. Urns invite debate about sampling protocols which distracts from the epistemic logic.

  *Pedagogical Use:* Use this single numerical track for every stage: priors, updates, common knowledge check, and heuristic debunking. This prevents cognitive load from switching contexts. When you reach the agreement phase, you refer back to the 66% and 80%. When you debunk averaging, you compare 73% to 89%. The consistency allows the "averaging defender" to see exactly where their heuristic breaks numerically, rather than abstractly. The biologist can visualize the coin; the programmer can visualize the state space.

  - Misconception ledger (~400 words)
  | Misconception | Surface Point | Defusing Move |
  | :--- | :--- | :--- |
  | "Must share evidence" | After Posterior Calculation | Show theorem requires only common knowledge of posteriors, not signals. Use example: they know the 66% and 80%, not the flips. Explicitly state: "The theorem works even if they forget why they believe." |
  | "Average the credences" | During Agreement Result | Display the 73.3% vs 88.9% gap. Assign the "averaging defender" to calculate the log-odds sum to prove non-linearity. Force them to see that averaging is an arithmetic shortcut, not a Bayesian operation. |
  | "Implies no trade" | During Common Knowledge | Acknowledge link but bracket it. State: "No-trade is the economic corollary; today we focus on the epistemic condition." Tell the prediction market diverter: "Markets are mechanisms; this is the constraint those mechanisms must satisfy." |
  | "Who is calibrated?" | During Private Signals | Clarify theorem assumes rationality, not calibration. Assign the "calibration questioner" to note that disagreement implies irrationality or different priors, not skill gaps. Emphasize: "The theorem describes ideal agents; calibration is an empirical measure of fit." |

  This ledger absorbs the specific interruptions. The averaging defender gets a math task. The market diverter gets a boundary definition. The calibration questioner gets a distinction between norms and metrics. By assigning them roles in the defusing move, you validate their intuition while correcting the application. The table ensures you don't forget to address the "shared evidence" folk version, which is the most dangerous because it sounds almost right.

  - The check (~150 words)
  Task: "Alice holds 60%, Bob holds 80%. They have common priors and common knowledge of these numbers. What is their final credence?"

  Success: "They must be equal, but we cannot calculate the value without knowing the information structure. It is not 70%."

  Failure: "They should meet at 70%," or "They should combine evidence to find the truth."

  Rationale: The slogan user thinks the theorem prescribes a method (averaging). The understander knows it prescribes a constraint (equality) derived from structure. This distinguishes knowing the *name* of the theorem from knowing the *mechanism*. If they answer 70%, they have reverted to the heuristic you just debunked. If they say "unknown but equal," they grasp that the theorem is an impossibility result, not an aggregation function. This closes the loop on the session's primary pedagogical goal.

  - What to refuse to cover (~150 words)
  Decline to justify the Common Prior Assumption empirically. It is a model constraint, not a psychological claim; debating its realism consumes the session. Decline the N-agent generalization; the math becomes combinatorial and obscures the core logic. Decline dynamic updating protocols (how many rounds of talking?). The theorem is about the fixed point, not the path. Resist the temptation to solve the "how do we actually achieve this" problem; that is mechanism design, not epistemology. Keep the focus on the impossibility of persistent disagreement under the stated axioms. If asked about real-world application, reiterate: "This tells you when to be suspicious of disagreement, not how to resolve it." This protects the 90-minute limit from expanding into a general rationality therapy session.
