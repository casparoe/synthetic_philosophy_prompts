answer: |-
  Good morning, everyone. It's lovely to see such a full room.

  Looking around, I realise we've got a bit of a split audience today. On one side, I see colleagues who could probably recite the *Nachlass* from memory. On the other, I see friends and family who might only know Ludwig Wittgenstein as that intense bloke who said language is a game and then went off to work as a hospital porter. And honestly, both groups are exactly who need to be here.

  The trouble with Wittgenstein on religion is that it's very easy to simplify. We've all heard the line before: religious belief is just a different "language game." It's a useful shorthand, but if we're not careful, it can sound like we're saying religious people are just playing make-believe while the rest of us do real work. That's not quite it. And it's certainly not what I want us to spend the day thinking about.

  The usual trap is to treat religious belief as if it's a botched scientific hypothesis. You know the sort of thing: someone says, "I believe in the Last Judgement," and the sceptic hears, "I have a theory about a future event that hasn't happened yet." Then the sceptic pulls out their facts, shows the evidence is thin, and thinks they've won the argument. But the believer isn't bothered, because they weren't making a prediction about calendar dates in the first place.

  Wittgenstein suggests we stop looking at belief as a picture of the world inside the frame, and start seeing the belief *as* the frame itself.

  I want us to hold onto that image today: the frame.

  Think of a painting. Inside the frame, you have colours, shapes, figures—all the facts of the matter. You can argue about what's happening in the picture. Is that man smiling? Is the sky blue or grey? Those are arguments about the content. They're factual disputes. You can resolve them by looking closer, by getting better data.

  But the frame? The frame isn't part of the picture. It's what holds the picture together. It tells you how to look at what's inside. It determines what counts as significant. If you change the frame, you change the meaning of every brushstroke inside it, even if the paint itself doesn't move.

  When someone says, "I believe in God," or "I believe in sin," they aren't adding another fact to the pile of facts inside the painting. They aren't saying, "There is a invisible man in the sky, alongside the clouds and the birds." They are putting a frame around the whole business of living. They are saying, "This is how these facts matter. This is the context in which my life makes sense."

  So, when a believer and a non-believer argue about the Last Judgement, they often talk past one another. The non-believer is pointing at the canvas, saying, "There's no evidence for this figure here." The believer is holding the frame, saying, "Without this border, the picture falls apart." They aren't disagreeing about the same kind of fact. One is arguing about the paint; the other is arguing about the gallery.

  This matters for us today, whether you've read every notebook or you've just come along to support a friend. It means we shouldn't treat religious disagreement as a simple error of fact. It's not that the religious person is blind to the evidence inside the picture. It's that they are standing in a different relation to the frame.

  For the scholars in the room, I hope this pushes us beyond the usual "language-game" shorthand. It's not just about rules of grammar; it's about the conditions of meaning. For everyone else, I hope it makes the conversation feel a bit less like a battle over who's got the right facts, and more like an attempt to understand how different people frame their lives.

  We're not here to judge the paintings. We're here to look at the frames.

  So, let's have a proper conversation. Coffee is in the hall. Thank you.
