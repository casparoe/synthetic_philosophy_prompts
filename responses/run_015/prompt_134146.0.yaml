  the form holds shape against the empty air
  a generic gait of legs and mane and bone
  the color divides the specific from the bare
  leaves white to stand entirely alone

  the form holds claim to every beast that breathes
  no hue strips clean the universal kind
  the color divides what language underneath
  construes as distinct within the seen

  the color divides the extension of the name
  restricting scope to where the snow has lit
  the form holds less when specificity came
  until horse is lost beside the white

  We ask if two can occupy one space
  Where the color divides the form holds no release
  The compound breaks the singular embrace
  And logic finds its paradoxical peace

  ***

  **Seminar Note: Textual Status and Interpretive Liberties**

  **Settled vs. Contested:**
  It is generally accepted that the *Bai Ma Lun* (White Horse Dialogue) is received within the *Gongsun Longzi* text, traditionally dated to the Warring States period (c. 3rd century BCE). However, the affiliation with the "School of Names" (*Mingjia*) is a later Han Dynasty construct (notably by Sima Tan); there is no evidence these thinkers identified as a unified school during their lifetimes. The dialogue's authenticity is sometimes questioned, with some scholars suggesting Han-era interpolation, though the core paradox is widely attributed to Gongsun Long.

  **Interpretive Landscape:**
  There is no consensus on the philosophical intent. Readings generally fall into three overlapping categories:
  1.  **Ontological:** The argument concerns the metaphysical status of universals (the universal "white" + universal "horse" ≠ universal "horse").
  2.  **Semantic/Logical:** The argument concerns reference and extension (the compound term "white horse" has a different extension than the bare term "horse").
  3.  **Pragmatic/Rhetorical:** The argument is a performative display of disputation skills (*bian*), intended to disrupt conventional usage rather than assert a metaphysical truth.

  **Poetic Liberties:**
  This poem privileges the **Semantic/Logical** reading (specifically the predication/extension split you are exploring). It treats "form" as a direct equivalent to *xing* (shape/form) and "color" as *se*, simplifying the nuanced Mohist and Daoist critiques of these categories. Furthermore, the final stanza implies a "paradoxical peace" or resolution; most scholarly readings suggest the dialogue remains aporetic or intentionally destabilizing, refusing to reconcile the compound with the bare term. The intertwining of the refrains in the fourth stanza enacts the compound predicate visually, but this structural resolution should not be taken as an endorsement of the text's own conclusion.
