      *   *Core Thesis:* Modal Realism. Possible worlds are concrete entities, just as real as our own.
      *   *Isolation:* Worlds are spatiotemporally isolated. No travel, no causal interaction between worlds.
      *   *Nature of Worlds:* They are maximal mereological sums of spatiotemporally related individuals.
      *   *Indexicality:* 'Actual' is indexical. I am actual to myself, you are actual to yourself, but we are in the same world. A counterpart in another world is actual to them, not to me.
      *   *Modal Logic:* Truth conditions for modal statements are analyzed via quantification over worlds. Necessary = true in all worlds. Possible = true in some world.
      *   *Hyperspace/Metric:* Lewis does *not* posit a hyperspace containing worlds with metric distances between them based on physical laws. Worlds are isolated; there is no overarching space containing them. Similarity is a conceptual/logical relation, not a physical distance in a higher dimension.
      *   *Physics/Quantum:* Lewis's Modal Realism is *not* the Many Worlds Interpretation (MWI) of quantum mechanics. MWI involves branching within a single universal wavefunction (spatiotemporally connected). Lewis's worlds are completely isolated. Lewis actually wrote about this distinction (e.g., in "On the Plurality of Worlds"). He thought MWI was interesting but distinct from his metaphysical modal realism.
      *   *Reductionism:* Lewis aims to reduce modality to quantification over concrete entities, but not to reduce it to *physics* in the sense of extra physical dimensions accessible to science. It's a metaphysical thesis, not a physical one.

