answer: |-
  ### Example: The "Common Evidence Pool" Model

  Consider a binary decision problem where a group of $n$ voters must determine the true state of the world, $S \in \{0, 1\}$ (e.g., "Defendant is Guilty" vs. "Defendant is Innocent"). Assume the prior probability of either state is $0.5$.

  #### 1. The Correlation Structure
  In the standard Condorcet Jury Theorem (CJT), voters are assumed to be **conditionally independent**: given the true state $S$, voter $i$'s vote is independent of voter $j$'s vote.

  To violate this while maintaining individual competence, we introduce a **shared epistemic source** (a latent variable) that creates correlation. Let us define the information structure as follows:

  *   **Latent Variable ($E$):** There is a "Epistemic Environment" variable that determines the quality of the information available to the group.
      *   With probability $\alpha$ (e.g., $\alpha = 0.1$), the environment is **"Systemically Misleading."** In this case, the shared epistemic source (e.g., a flawed forensic report, a biased news outlet, or a common cultural misconception) provides incorrect evidence to *all* voters.
      *   With probability $1 - \alpha$ (e.g., $0.9$), the environment is **"Neutral."** The shared source provides no bias, and voters rely on independent private investigation.
  *   **Voter Behavior:**
      *   If $E =$ Systemically Misleading: Every voter receives a signal indicating the *wrong* state. Consequently, every voter votes incorrectly.
      *   If $E =$ Neutral: Every voter receives an independent signal that is correct with probability $p_{ind}$ (e.g., $p_{ind} = 0.8$).
  *   **Individual Competence:**
      The marginal probability that a single voter is correct, $p$, is the weighted average of the two environments:
      $$p = \alpha(0) + (1 - \alpha)p_{ind}$$
      Using the values above: $p = 0.1(0) + 0.9(0.8) = 0.72$.
      Since $0.72 > 0.5$, the CJT condition of individual competence is satisfied.

  #### 2. Behavior of Majority Accuracy as Group Size Increases
  Let $M_n$ be the event that the majority of the $n$ voters is correct. We analyze the limit of $P(M_n)$ as $n \to \infty$.

  *   **In the Neutral Environment (prob $1-\alpha$):** Voters are independent and competent ($p_{ind} > 0.5$). By the standard Condorcet Jury Theorem, the probability that the majority is correct converges to 1 as $n \to \infty$.
  *   **In the Systemically Misleading Environment (prob $\alpha$):** All voters receive the same incorrect signal. Regardless of group size $n$, 100% of the voters will vote incorrectly. The probability that the majority is correct is 0.

  The total probability that the majority is correct is the weighted sum of these two scenarios:
  $$ \lim_{n \to \infty} P(M_n) = (1 - \alpha) \cdot 1 + \alpha \cdot 0 = 1 - \alpha $$

  **Result:** With $\alpha = 0.1$, the majority accuracy converges to **0.9**, not 1. Even with an infinite number of voters, there remains a persistent 10% chance that the entire group is wrong because they all relied on the same flawed source. The "wisdom of the crowd" fails to eliminate error because the errors are not idiosyncratic; they are systemic.

  #### 3. Implications for Forecast Aggregation as an Epistemic Device
  This example highlights critical limitations in using simple forecast aggregation (like majority voting or averaging) to uncover truth:

  1.  **Redundancy vs. Diversity:** Increasing the *number* of forecasters does not improve accuracy if they do not increase the *diversity* of information. If 1,000 voters all read the same newspaper, they constitute an effective sample size of 1, not 1,000. Epistemic value comes from independent signals, not correlated repetitions.
  2.  **The Ceiling of Accuracy:** Aggregation methods that assume independence (like simple majority rule) will overestimate the confidence of the group. The group's accuracy hits a ceiling determined by the correlation strength ($\alpha$), regardless of $n$.
  3.  **Need for Decorrelation:** To use aggregation effectively as an epistemic device, mechanisms must be introduced to break the shared correlation. This implies:
      *   **Institutional Design:** Ensuring voters/forecasters access distinct data sources.
      *   **Algorithmic Adjustment:** Using aggregation models (e.g., Bayesian models or Prediction Markets) that explicitly estimate and discount the common variance component, rather than treating every vote as an independent data point.
      *   **Weighting:** Down-weighting forecasts from agents known to rely on the same common priors or sources.

  In summary, when signals are correlated through a shared epistemic source, the law of large numbers does not wash out the error. Aggregation preserves the bias of the common source, implying that **information diversity is a stricter requirement for collective intelligence than individual competence.**
