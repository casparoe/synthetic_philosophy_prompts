      *   *Deflationism/Hybrid:* The case suggests Type-level causation is robust (Interventionist), Token-level is messy (Counterfactual/Probabilistic). A hybrid is stable *if* one admits Token causation is a different metaphysical beast or a legal heuristic. Interventionism isn't "incomplete" regarding Type, but silent on Token without reduction.
      *   *Pressure Point:* The "actual causation" (token) is where the theories strain.

  8.  **Addressing Question 5: The Counterfactual Episode (RCT):**
