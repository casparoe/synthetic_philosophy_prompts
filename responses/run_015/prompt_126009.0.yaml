      *   *Practicality:* Latency, noncompliance. An RCT might still be inconclusive *empirically* even if it settles the *definition*.
      *   *Conflation:* If the theory says "Causation = RCT result," but RCT is hard to read, does it conflate meaning and evidence? Woodward distinguishes the *concept* (invariance) from the *test* (RCT). But if the only access to invariance is RCT, the line blurs. I need to be careful here. The theory defines causation via *ideal* interventions, not *feasible* ones.

