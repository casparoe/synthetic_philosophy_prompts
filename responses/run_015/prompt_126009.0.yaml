answer: |-
  ### Correspondence Table: Mapping Theories to the Smoking Case

  | Feature | Counterfactual Theory (Lewis-style) | Interventionist Theory (Woodward-style) |
  | :--- | :--- | :--- |
  | **Causal Relata** | Events or states of affairs (e.g., *John's smoking*, *John's cancer*). | Variables within a system (e.g., *Smoking Status*, *Carcinogen Load*, *Cancer Incidence*). |
  | **Modality** | Truth of counterfactual conditionals: "If $S$ had not occurred, $L$ would not have occurred." | Invariance of generalizations under interventions: "Changing $S$ via intervention $I$ changes $L$." |
  | **Evidence Role** | Evidence supports the *truth* of the counterfactual (via similarity of worlds). Theory is silent on *how* to verify similarity. | Evidence demonstrates *invariance*. Interventions (actual or natural) are the gold standard for testing the relation. |
  | **Fisher's Challenge** | Handled by holding fixed the past (genetics). If gene $G$ causes $S$ and $L$, $\neg S$ worlds still have $G$, so $L$ persists. $S$ is not a cause. | Handled by defining valid interventions. If $G$ confounds, standard observation is not an intervention. Must find $I$ on $S$ uncorrelated with $G$. |
  | **Token vs. Type** | Primarily token (actual causation). Type causation is often generalized from tokens or treated as probabilistic. | Primarily type (general causation). Token causation requires tracing the specific pathway in the individual case. |

  ---

  ### 1. The Counterfactual Treatment: Worlds and Common Causes

  **The Dispute:**
  Under a Lewis-style counterfactual account, the dispute is not merely about association but about the truth of the conditional: *If this individual had not smoked, would they have developed lung cancer?*
  *   **Population-level:** The claim is that the *rate* of cancer counterfactually depends on the *rate* of smoking.
  *   **Individual-level:** The claim is that the specific event of smoking was necessary for the specific cancer (in a probabilistic sense).

  **Similarity of Worlds:**
  The difficulty lies in the "nearest $\neg S$ world." [Standard] For a heavy smoker, the nearest world where they do not smoke may involve a different psychology, different social circle, or different genetics.
  *   **Fisher's Common Cause:** Fisher posited a genotype $G$ that causes both the urge to smoke ($S$) and the susceptibility to cancer ($L$).
  *   **Disposal:** Counterfactual semantics typically hold the past fixed. In the nearest world where the subject does not smoke ($\neg S$), the genotype $G$ (which occurred prior) remains. If $G \to L$, then $L$ occurs even in the $\neg S$ world. Thus, $S$ is not a cause of $L$. [Standard]
  *   **Epistemic Silence:** The theory defines causation but offers no internal resources for *knowing* whether $G$ exists or is fixed. It treats the absence of confounding as a precondition for the counterfactual's truth, not something the theory itself verifies. [Reconstruction]

  **Confidence:** High on the semantics of holding the past fixed; Moderate on whether this fully captures the epidemiological dispute (which was often about populations, not tokens).

  ### 2. The Interventionist Treatment: Variables and Surrogates

  **Variable Set and Intervention:**
  *   **Variable:** "Smoking" is too coarse. Interventionism requires variables that can take distinct values. [Standard] The relevant variable is closer to *Cumulative Carcinogen Exposure* (a function of pack-years, tar, inhalation depth, duration).
  *   **Intervention Variable ($I$):** An exogenous variable that changes *Smoking* without affecting *Cancer* except through *Smoking*.
  *   **Fisher's Challenge:** Fisher argued observational data failed this criterion because the "intervention" (choice to smoke) was correlated with $G$.

  **Surrogate Interventions:**
  You ask if tax variations, bans, and quit cohorts count as interventions.
  *   **Principled Line:** Interventionism distinguishes *actual* interventions from *surrogates* based on **exogeneity**. [Standard] A tax hike is a valid surrogate intervention *if* it is uncorrelated with other causes of cancer (e.g., if high-tax states don't also have higher radon levels).
  *   **Low-Tar Case:** This was an intervention on *Tar Yield*, but smokers compensated (increased *Inhalation*). The intervention failed to change the downstream variable *Total Carcinogen Exposure*. Invariance did not hold. This confirms the theory: the causal relation is between Exposure and Cancer, not Machine Tar and Cancer. [Reconstruction]
  *   **Collapse Risk:** Admitting surrogates does not collapse interventionism into evidentialism *provided* the surrogates must satisfy the structural constraints of an intervention (independence from error terms). If *any* correlation counts, the theory collapses. If only exogenous shifts count, it remains distinct. [Contested]

  **Confidence:** High on the definition of intervention; Moderate on whether "natural experiments" (tax/bans) fully satisfy the strict independence requirement in practice.

  ### 3. Explanatory Power: Criteria, Multifactoriality, and Sociology

  **Hill's Considerations:**
  *   **Reconstruction:** The "Bradford Hill criteria" are better reconstructed as heuristics for **Invariance** (Interventionism) than Counterfactual Dependence. [Reconstruction]
      *   *Strength/Consistency:* Suggests the relation holds across different background conditions (invariance).
      *   *Biological Gradient:* Suggests a functional relationship stable under magnitude changes.
      *   *Experiment:* Direct appeal to intervention.
      *   *Specificity:* This criterion fails for smoking (smoking causes many diseases; cancer has many causes). Interventionism explains why this demand was a wrong turn: causal variables in complex systems are rarely specific. Counterfactual theory struggles less here but offers no explanation for why specificity was ever desired.

  **Multifactorial Disease:**
  *   Interventionism handles multifactoriality naturally via structural equations (multiple variables contribute to $L$). Counterfactuals face preemption/overdetermination problems in token cases (if asbestos also caused it, did smoking?). [Standard]

  **Sociology and Community:**
  *   **Silence:** Neither theory models the *sociology* (industry funding, norms).
  *   **Presupposition:** Interventionism quietly presupposes an **evidential community** capable of agreeing on what counts as an exogenous shift. [Reconstruction] Deciding if a tax hike is "exogenous" requires expert consensus on background factors. Counterfactualism is more metaphysical and individualistic, making it less sensitive to the communal nature of the 1964 report.

  **Confidence:** High on the fit between Hill's criteria and Invariance; Low on the claim that Interventionism presupposes a community (this is a philosophical extension, not textual exegesis of Woodward).

  ### 4. What the Case Does to the Theories: Type vs. Token

  **The Pressure Point:**
  The Surgeon General's report established **Type-Level** causation (smoking causes cancer in populations). Tort law demanded **Token-Level** causation (smoking caused *this* plaintiff's cancer).
  *   **Doubling of Risk:** The legal heuristic ($RR > 2$) is a probabilistic proxy for counterfactual dependence (more likely than not that the cancer would not have occurred without smoking). [Standard]
  *   **Deflationism/Hybrid:** The episode supports a **Two-Tier View**. [Reconstruction]
      1.  **Type:** Handled by Interventionism (invariance of risk rates under population-level shifts).
      2.  **Token:** Handled by a probabilistic counterfactual account (or deflated to a legal standard of proof).
  *   **Stability:** This hybrid is stable *if* one accepts that token causation is not simply a scaled-down version of type causation. If Interventionism claims to be a *complete* account of causation, the episode concedes it is incomplete regarding actual/token causation in multifactorial contexts. [Contested]

  **Confidence:** Moderate. The distinction between type and token is standard, but the claim that Interventionism is "incomplete" rather than "focused on type" is a matter of interpretive charity.

  ### 5. The Counterfactual Episode: If RCTs Were Feasible

  **The Prediction:**
  *   **Interventionism:** Since causation is *defined* by invariance under ideal interventions, a feasible RCT would settle the **metaphysical/semantic** dispute immediately. [Standard]
  *   **Epistemic Reality:** However, given latency (20+ years), noncompliance (subjects smoking in secret), and rare outcomes (cancer is not immediate), an RCT would be slow and noisy. [Standard]
  *   **Conflation Charge:** If the theory says "Causation = RCT result," but a real RCT is hard to read, does it conflate meaning and evidence?
      *   **Correction:** Interventionism distinguishes **Ideal Interventions** (theoretical) from **Feasible Experiments** (practical). [Standard] The theory claims the RCT is the *gold standard* for evidence because it mimics the ideal intervention, not that causation *is* the p-value of a trial.
      *   **Verdict:** The episode does not show conflation, but it highlights that **access** to causal knowledge is distinct from the **truth conditions** of causal claims. Even with an RCT, Fisher could have questioned compliance (was the intervention successful?). [Reconstruction]

  **Confidence:** High on the distinction between ideal and feasible; Moderate on whether this fully absolves the theory of "conflation" charges in practice.

  ---

  ### Factual Premise Check

  1.  **Fisher's "Inhalation" Argument:** You noted Fisher raised "whether inhaling rather than smoking as such was the operative variable."
      *   **Correction:** [High Confidence] Fisher's primary argument was the **Genetic Confounding** hypothesis (a constitutional factor causes both the urge to smoke and the cancer). He did discuss the mechanics of smoking, but the philosophical weight of his objection rested on the *common cause* (confounding), not merely the measurement of inhalation. Focusing too much on inhalation understates his statistical objection.
  2.  **Low-Tar Compensation:** You noted "expected reduction in risk largely failed to show up."
      *   **Confirmation:** [High Confidence] This is accurate. Smokers compensated by inhaling more deeply or blocking ventilation holes, keeping carcinogen intake stable. This is a crucial data point for Interventionism (intervention on $X$ failed to change $Y$ because of feedback on $Z$).

  ### Least Confident Claim

  **Claim:** "Interventionism quietly presupposes an evidential community capable of agreeing on what counts as an exogenous shift."
  **Confidence:** Low (Philosophical Reconstruction).
  **Reasoning:** Woodward's texts focus on the logical structure of invariance, not the sociology of scientific agreement. While it *follows* that applying the theory requires consensus on exogeneity, claiming the theory *presupposes* a specific social structure is an extrapolation.
  **What would change my mind:** If historical analysis showed that Interventionist criteria were successfully applied in contexts of radical scientific disagreement without prior consensus on background variables. If scientists can agree on invariance while disagreeing on exogeneity, the claim fails.

  ### Summary of Mapping

  *   **Counterfactual Theory:** Explains the *token* legal demand (did smoking cause *this* cancer?) but struggles with the epistemic access to "nearest worlds" in the face of Fisher's confounding. It treats the absence of common causes as a metaphysical precondition, not an evidential achievement.
  *   **Interventionist Theory:** Explains the *type* epidemiological conclusion (population risk invariance) and the failure of the low-tar intervention. It accommodates "surrogate" interventions (taxes/bans) only if they meet strict exogeneity criteria. It is silent on the token-level legal heuristic unless supplemented by a probabilistic account.
  *   **The Episode's Impact:** Suggests causation in public health is fundamentally about **invariance of risk rates** (Type), while causation in law is about **probability of necessity** (Token). A monistic theory struggles to capture both without strain.
