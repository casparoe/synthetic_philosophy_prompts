answer: |-
  # JURISPRUDENCE: FINAL PAPER
  **Time Allowed:** 48 Hours  
  **Word Limit:** 2,500 words maximum  
  **Instructions:** Answer **ONE** of the three questions.

  ***

  ### QUESTION 2: The Aurinia Instrument

  The Republic of Aurinia is governed by an *Instrument of Rules*, whose first six rules read:

  1.  The Assembly may amend or repeal any rule by a resolution supported by two-thirds of all its members.
  2.  Rule 1 may be amended or repealed only by a unanimous resolution of all members of the Assembly, confirmed by a majority at a national referendum.
  3.  Any purported amendment inconsistent with Rule 2 is void, and shall be treated as never having been enacted.
  4.  No rule has effect before the day on which it is enacted.
  5.  A rule ceases to be in force if no organ of the Republic has applied or expressly affirmed it for a continuous period of fifteen years.
  6.  A rule comes into force only when the Keeper has entered it in the Register of Rules.

  **The Facts:**  
  In Year 12, the Assembly passes the *Reform of Rules Act* by 71 votes to 29. The Act repeals Rule 2; amends Rule 1 so as to require only a simple majority; purports to exempt itself from Rules 3 and 5; and purports to take effect from the day it was first laid before the Assembly. No referendum is held. The Keeper refuses to enter the Act in the Register, and it is never entered.

  Between Year 12 and Year 30, the Assembly enacts fourteen statutes by simple majorities, the courts decide cases by applying them, and the Keeper enters each of them in the Register. Over the same period, no organ of the Republic applies or expressly affirms Rule 2 or Rule 5. In Year 30, a litigant argues that *Statute No. 9* (enacted in Year 20 by simple majority) is not law, because when it was enacted the Assembly had no power to enact it by a simple majority. **[Note: The judges hearing the Year 30 case were themselves appointed under the authority of Statute No. 9.]**

  **Answer the following:**

  (a) **The Two-Step Manoeuvre:** Could the Assembly have validly amended Rule 1 in Year 12 by first using the Rule 2 procedure to lower the threshold, and then using the new threshold to repeal Rule 2? Does Rule 3 successfully block this manoeuvre, or is Rule 3 itself vulnerable to the same procedure? Distinguish between amending a *procedure*, amending a *scope*, and exercising a *power*.

  (b) **Validity and Revolution:** Given the Keeper's refusal to register the *Reform Act* (violating Rule 6) and the retroactivity clause (violating Rule 4), are the fourteen statutes valid amendments or void acts? If they are void under the *Instrument*, does the eighteen-year practice constitute a lawful evolution within the system or a revolution instituting a new basic norm/rule of recognition? Justify your criterion for continuity.

  (c) **Self-Application:** Can the *Reform Act* validly exempt itself from Rule 5 (desuetude) if Rule 5 is the source of the lapse? Can Rule 5 lapse under its own terms if it is not applied?

  (d) **Drafting:** Either redraft Rule 2 to make the "two-step" manoeuvre logically unavailable, or explain why no drafting can make an amendment rule unreachable by amendment.

  ***

  # MODEL ANSWER

  **Candidate Number: 000**  
  **Word Count: 895**

  **Conclusion:** The *Reform of Rules Act* was void *ab initio*. The subsequent eighteen years of practice constitute a legal revolution, not a valid amendment. The current system is a new legal order.

  **(a) The Two-Step Manoeuvre**
  The "two-step" argument suggests the Assembly could use Rule 2's strict procedure (unanimity + referendum) to amend Rule 1 to a simple majority, then use that simple majority to repeal Rule 2. This fails. Rule 1 grants a power *conditioned* by Rule 2. To exercise the power to amend Rule 1, one must satisfy Rule 2. However, Rule 3 declares any amendment inconsistent with Rule 2 "void" and "never having been enacted."

  Candidates often conflate *procedure* (how to vote) with *competence* (what can be voted on). Rule 2 is not merely procedural; it is a limitation on the scope of the amendment power regarding Rule 1. If the Assembly attempts the first step (amending Rule 1 via Rule 2), they are exercising a power derived from the *Instrument*. But Rule 3 attaches a nullity sanction to any violation of Rule 2. A "two-step" requires the first step to be valid law to enable the second. If Rule 3 renders the first step void *ab initio*, the Assembly never acquires the "simple majority" power. They remain bound by the two-thirds rule.

  Furthermore, Rule 3 cannot protect itself if it is not entrenched. However, Rule 3 protects Rule 2. To amend Rule 2, you must follow Rule 2. To avoid Rule 2, you must violate Rule 3. If you violate Rule 3, the act is void. Therefore, the two-step is logically barred so long as Rule 3 is operative. The Assembly in Year 12 did not even attempt the two-step; they ignored Rule 2 entirely. Thus, the *Reform Act* was an attempt to exercise a power they did not possess.

  **(b) Validity and Revolution**
  The *Reform Act* violated Rule 4 (retroactivity) and Rule 6 (registration). Rule 6 states a rule comes into force *only* when entered. This is a condition precedent. The Keeper's refusal meant the *Reform Act* never entered into force. Consequently, the fourteen statutes enacted under the purported simple majority rule were enacted without legal authority. Under the *Instrument*, they are void.

  This forces a choice between continuity and revolution. If we follow Kelsen, the efficacy of the new order (18 years of practice) suggests a new Basic Norm has replaced the old. The old *Instrument* is historically first, but no longer valid. If we follow Hart, the Rule of Recognition has shifted. The officials (courts, Keeper, Assembly) now accept simple majority statutes as valid.

  However, the judges in Year 30 are appointed under *Statute No. 9*. If *Statute No. 9* is void, the court lacks jurisdiction. A court cannot validly declare the source of its own authority void without ceasing to be a court of that system. This paradox confirms a revolution has occurred. The system did not *amend* itself; it broke. The validity of the statutes rests not on the *Instrument*, but on the new political fact of acceptance. The litigant is technically correct under the old *Instrument*, but the court must apply the new norm to exist. I conclude this is a revolution: the identity of the legal system changed between Year 12 and Year 30.

  **(c) Self-Application**
  Rule 5 (desuetude) causes lapse if not applied for 15 years. The *Reform Act* purported to exempt itself from Rule 5. This is self-referential incoherence. A rule cannot exempt itself from the condition of its own existence if that condition is defined by a superior rule (the *Instrument*). If Rule 5 applies to "Any rule," it applies to the *Reform Act*.

  Can Rule 5 lapse itself? Yes. If no organ applies Rule 5 for 15 years, Rule 5 ceases to be in force. This is not a paradox but a temporal operation. Rule 5 exists in Year 12. By Year 30, if unused, it lapses. But this lapse does not validate the *Reform Act* retroactively. The Act was void in Year 12; the lapse of Rule 5 in Year 27 cannot resurrect a void act. It only removes the barrier for future acts.

  **(d) Drafting**
  Can Rule 2 be drafted to be unamendable? No. This is the paradox of sovereignty. Any rule drafted by the Assembly is subject to the Assembly's power. To make Rule 2 unamendable, one must posit a authority higher than the Assembly. If the Assembly is sovereign, it can always repeal the rule that binds it.

  However, one can make the "two-step" logically harder by adding a "lock": *"Rule 2 may not be amended, and any attempt to amend it is void."* But this is merely Rule 3 restated. As shown in (a), a sovereign can ignore this. The only way to make it unreachable is to remove the power from the Assembly entirely (e.g., vesting it in the People). But within the *Instrument*, absolute entrenchment is logically impossible. The "two-step" is always available if the officials accept the repeal. Law is ultimately a matter of practice, not logic. Thus, I would not redraft Rule 2; I would advise that entrenchment is a political, not legal, constraint.

  ***

  # MARKING SCHEME (25 Marks)

  **1. Analysis of the "Two-Step" and Rule 3 (5 Marks)**
  *   **Must Hit:** Distinguish between using Rule 2 to change Rule 1 (valid if Rule 3 allows) vs. ignoring Rule 2 (void). Explain that Rule 3 renders the first step of the manoeuvre void if inconsistent.
  *   **Common Error:** Treating Rule 2 as merely procedural (Hartian "secondary rule" reductionism) and ignoring the nullity sanction in Rule 3. Assuming the Assembly can "bootstrap" itself into new powers without a valid intermediate step.

  **2. Handling Rule 6 (Registration) and Self-Exemption (5 Marks)**
  *   **Must Hit:** Identify Rule 6 as a condition precedent. The *Reform Act* never came into force because the Keeper did not register it. Self-exemption from Rule 6 fails because the power to exempt derives from a rule that isn't yet in force.
  *   **Common Error:** Arguing that the Keeper's refusal is irrelevant because the Assembly is sovereign. Ignoring the "only when" language in Rule 6.

  **3. Retroactivity and the Status of the 14 Statutes (5 Marks)**
  *   **Must Hit:** Apply Rule 4. Retroactive validation is impossible under the *Instrument*. The 14 statutes are void *ab initio* under the old rules.
  *   **Common Error:** Assuming that because the statutes were applied, they must have been valid *at the time*. Conflating efficacy with validity.

  **4. Continuity vs. Revolution (Hart/Kelsen Application) (5 Marks)**
  *   **Must Hit:** Take a definite position on whether the system continued or broke. Use the "Judges appointed under Statute 9" complication to argue the circularity of jurisdiction.
  *   **Common Error:** The "Practice Makes Perfect" error: Arguing that 18 years of practice automatically makes the acts valid *under the old Instrument* without acknowledging a shift in the Rule of Recognition/Basic Norm. Failing to address the jurisdictional paradox.

  **5. Drafting and Impossibility (5 Marks)**
  *   **Must Hit:** Conclude that absolute entrenchment is logically impossible for a sovereign body (the "Paradox of Sovereignty"). Either propose a transfer of power (to People) or admit drafting cannot stop revolution.
  *   **Common Error:** Proposing a "super-entrenchment" clause (e.g., "This rule cannot be repealed") without explaining why the Assembly couldn't simply repeal that clause too.

  ***

  # MARKERS' NOTE

  **Added Complication:**  
  I added the detail that **"The judges hearing the Year 30 case were themselves appointed under the authority of Statute No. 9."**  
  *Why:* This forces candidates to confront the *jurisdictional paradox*. If Statute 9 is void, the court has no standing to rule. This prevents a easy "Hartian" slide into "the courts accepted it, so it's valid." They must explain *how* the court acquires authority to deny the very law that created it (i.e., by acknowledging a revolution).

  **The Strongest-Looking Wrong Answer:**  
  The **"Efficacy Equals Validity"** answer. This candidate will argue that because the Keeper registered the 14 statutes and the courts applied them for 18 years, the *Instrument* was effectively amended, and Rule 2 lapsed under Rule 5. They will cite Hart's "internal point of view" to say the officials' acceptance settles the matter.  
  *Why it is wrong:* It fails to distinguish between *validity within a system* and *the shift to a new system*. It ignores Rule 6 (the Register was never updated for the *Reform Act* itself) and Rule 4 (retroactivity). It treats the *Instrument* as a fiction that vanishes upon contact with practice, rather than a set of constraints that, when broken, indicate a revolution. Award max 12/25 for this approach (good theory, wrong application to facts).

  **The "Opposite Conclusion" Clause:**  
  A candidate may argue that the **Two-Step Manoeuvre WAS logically possible** (e.g., arguing Rule 3 only voids amendments *inconsistent* with Rule 2, and an amendment *using* Rule 2 is not inconsistent).  
  *Full Marks Condition:* If they argue this, they must consistently maintain that the *Reform Act* was therefore **Valid** and **No Revolution occurred**. They must explain away Rule 6 (e.g., as directory rather than mandatory) and Rule 4. If their internal logic is consistent and they engage deeply with the self-reference paradoxes (even if I disagree with their premise), award full marks. We are testing legal reasoning, not agreement with the Model Answer's specific stance on revolution.
