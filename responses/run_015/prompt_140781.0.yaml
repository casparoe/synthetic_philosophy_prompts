  2.  **Deconstruct the Principal Principle (PP):**

      *   The core tension: Subjective belief vs. Objective reality.
      *   The bridge: Rationality constrains belief *given* knowledge of objective reality.
      *   The catch: "Admissible Evidence." You can't use crystal balls or knowledge of the future to override chance.

