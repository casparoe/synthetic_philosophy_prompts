  \answer{indeterministic propensity box; 1, 3, 4}

  ### Session Plan: The Principal Principle

  **Time:** 40 Minutes
  **Goal:** Distinguish *Credence* (subjective confidence) from *Chance* (objective propensity) using the Principal Principle (PP) as the bridge, without dogmatically asserting metaphysical realism.

  #### 1. Case Evaluation: Swap the Raffle Drum
  **Decision:** **Swap it out.**
  **Reasoning:** The weighted raffle drum is a deterministic system with hidden variables. It invites Misconception (1) (Chance = Ignorance). If students believe the outcome is determined by the weight, they will view the "1-in-50" statistic as merely a measure of their own lack of knowledge, not a feature of the world. This undermines the entire session.
  **Requirements for the New Case:**
  *   **Must Have:** A stipulated physical setup where the outcome is explicitly *not* determined by prior physical facts (e.g., a "Propensity Box" or a quantum decay counter). You must verbally stipulate: "In this scenario, physics itself does not decide the outcome until the moment it happens."
  *   **Must Lack:** Any hint of hidden variables or classical mechanics that *could* theoretically be measured to predict the outcome. Avoid coins, dice, or drums unless you explicitly bracket them as "magic indeterministic coins."

  #### 2. Sequence of Explanation (Numbered Stages)

  **Stage 1: The Gap & The Case (0–10 mins)**
  *   **Recap:** Acknowledge last week's conclusion (Probability = Confidence). Challenge it: "If I am 99% confident it will rain, does that make it rain? No. So belief and world are distinct."
  *   **Define Terms:**
      *   *Credence:* How confident *you* are (0 to 1).
      *   *Chance:* How the *world* is disposed to behave (0 to 1).
  *   **Introduce New Case:** The "Propensity Box." It flashes Red or Green. The physics of the box dictates a 50% chance for Red.
  *   **Defuse Misconception (1) [Chance = Ignorance]:**
      *   *Action:* Explicitly stipulate indeterminism. "There is no hidden switch. Even God couldn't predict it before it happens."
      *   *Dependency:* You cannot state the PP until students accept that Chance is a property of the *setup*, not their *knowledge*.

  **Stage 2: The Principle & The Poker Player (10–20 mins)**
  *   **State the PP:** "If you know the Chance is $x$, your Credence *ought* to be $x$."
  *   **Absorb the Poker Player Objection:**
      *   *Objection:* "Chance is just the betting odds the house offers."
      *   *Absorption:* Validate the intuition (odds guide action) but correct the ontology. "Betting odds are what the *house believes* the chance is. Sometimes the house is wrong. The PP tells you to ignore the house's odds if you know the *true physical chance*. Chance constrains rational betting; it isn't defined by it."
      *   *Dependency:* This relies on Stage 1's distinction. If Chance were just belief (Stage 1 failure), the Poker Player would be right.

  **Stage 3: Admissibility & Evidence (20–30 mins)**
  *   **The Problem:** "If Chance is 50%, should I always believe 50%?"
  *   **Counter-Example:** "What if you peek inside the box and see it's Red before it flashes?"
  *   **Defuse Misconception (2) [PP ignores evidence]:**
      *   *Action:* Introduce the "Admissible Evidence" clause. The PP applies only to information about the *past/setup*, not the *future outcome*.
      *   *Refinement:* PP = $Cr(A | Ch(A)=x \land E) = x$, where $E$ is admissible. Peeking is inadmissible.
      *   *Dependency:* Requires the PP to be already stated (Stage 2).

  **Stage 4: Single Cases & Closing (30–40 mins)**
  *   **Defuse Misconception (3) [No chance for one-off events]:**
      *   *Question:* "If we destroy the box after one use, was there really a 50% chance?"
      *   *Answer:* Yes. The propensity was in the setup at the time, regardless of long-run frequency.
  *   **The "Chance Dial" Decision:** **Refuse this.**
      *   *Reasoning:* A dial set by *yesterday's results* defines chance as *frequency*. This contradicts the "Propensity" view you built in Stage 1 and reignites Misconception (1) and (3). It introduces Lewis's "Undermining Future" problem, which is too technical for 5 minutes and risks collapsing the distinction you just built.
  *   **Closing Question:** (See below).

  #### 3. What to Decline
  *   **Metaphysical Interpretations:** Do not get into *why* chance exists (Propensity vs. Humean Best Systems vs. Frequency). Treat "Chance" as a functional role: "Whatever physical feature it is that rational credence must track."
  *   **Mathematical Proofs:** Do not derive the PP from Dutch Books or axioms. Keep it conceptual/normative.

  #### 4. Closing Question
  *"The Chance of Red is 50%. You have a crystal ball that has never been wrong, and it says 'Red'. What should your credence be?"*
  *   **Rote Learner:** "50%." (They ignore the crystal ball because they memorized "Credence = Chance".)
  *   **Grasping Learner:** "Close to 100%." (They understand the crystal ball provides *inadmissible evidence* about the outcome, which overrides the chance.)

  \answer{indeterministic propensity box; 1, 3, 4}
