      *   *Correction:* The prompt asks me to plan the explanation and evaluate the case. I need to be decisive. The raffle drum is weak for *this specific goal* (distinguishing chance from ignorance). I will recommend a "Propensity Box" or similar.
      *   *Wait, re-reading constraint:* "whether the case I've been building the session around can carry the whole thing or should be swapped out".
      *   *Decision:* Swap it. The weighted drum is the epitome of epistemic probability. To teach PP, you need ontological chance. Use a "Radioactive Decay Counter" or a stipulated "Indeterministic Machine."

