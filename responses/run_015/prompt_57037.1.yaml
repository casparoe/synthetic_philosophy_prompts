      *   *Proposal 1 (Pooling):* Linear pooling is a standard aggregation method (Genest & Zidek), but weighting by "past confirmed claims" is a meta-inductive strategy. It's pragmatic, not derived from Aumann. Aumann says they *should* agree, not how to average if they don't.
      *   *Proposal 2 (Durbin-Watson):* This is a category error. DW tests for autocorrelation in errors of a linear regression model. Applying it to a "disagreement series" to assign blame is statistically invalid. Non-convergence implies the conditions for convergence weren't met, not that the "lower weight" person is the error source.
