          5.  Memoir Footnote.

      *   *Refining the "Common Prior" point:* This is the crucial technical failure. Aumann (1976) explicitly assumes a common prior probability distribution. In science, priors are shaped by training, previous failures, and theoretical commitments that are *not* part of the "shared published literature."
      *   *Refining the "Common Knowledge" point:* Knowing the *number* is not knowing the *partition*. If I see data $D$ and you see data $D$, but I model $P(D|H)$ differently than you, we aren't in the Aumann framework.
      *   *Refining the Proposals:*
