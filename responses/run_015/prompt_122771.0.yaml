prompt: |-
  I write novels, and over the past several years a cluster of institutional habits surrounding work like mine has begun to look like a contradiction that I cannot state precisely enough either to accept or to argue with. I would like you to reconstruct the theory of meaning which these habits presuppose, and to tell me whether the habits can be held together.

  The practices, as concretely as I can put them:

  First, when a novelist dies with a series unfinished, the estate appoints a successor, the successor is paid to write *as* the dead author, and the book is sold under the dead author's name in the larger type with the successor's name beneath it. Fidelity is judged by whether the result reads like her. I have recently been advised to keep a document for exactly this purpose, and what struck me is what it is not: not a plot outline, not a list of events still to happen, but a set of constraints on the narrator — what she may not know, what she may not withhold, what she may not feel — together with notes on the dispositions of the recurring characters. The trade appears to believe that what makes a continuation *the same novel going on* is not the sequence of events but a voice specified largely by prohibitions. Relatedly, publishing contracts assign *the work and the characters therein* as if a character were an object detachable from the sentences in which it occurs and portable into sentences written by somebody else, long after I am dead.

  Second, and in apparent tension: when the living author says what her book means, the institutions that review and teach books treat that statement as at best one reading among others, and often as a mistake about her own authority — the familiar view, which I absorbed in workshops and which reviewers repeat as settled, that an author's avowed aim does not determine what her text says. Yet the same publishers, adapters, prize committees, and libel insurers keep asking me what I meant and keep treating the answer as settling something real: an authorised adaptation is authorised by my saying so, and a character's resemblance to a living person is defended by my saying I did not intend it.

  Third, for the archive: scholarly editions of modern novels are built to recover the text the author finally wanted, overriding the publisher's house style and sometimes overriding the author's own last printed revision where that revision looks coerced, tired, or made for money.

  What I want is the implicit theory, stated in plain English with each technical term explained when it is introduced, and argued rather than surveyed. Specifically:

  Does the continuation trade presuppose that a novel's identity consists in counterfactual facts about what its author *would have written*, and is that a different kind of thing from the author's intention about what her text *means*? I would like the relevant kinds of intention prised apart — intention in the writing, intention about the meaning of the finished text, intention about what comes next — and I want to know whether a person who denies the second any authority can lean on the third without inconsistency, or whether the two stand and fall together.

  Is the constraints document best explained by any intentionalist theory at all, or is it better explained by the thought that what is really being preserved is the reader's experience of a voice — in which case the practice is a theory about uptake wearing intentionalist clothing, and the trade's own vocabulary misdescribes what it is doing?

  Does any of it require that a character be the *same entity* in a text written by a different person, and what sort of entity would that have to be?

  And then the discipline I care most about: distinguish what these practices strictly presuppose from what they merely sit well with, and mark where they are underdetermined — where several rival accounts of meaning would license exactly the same practice, so that the practice cannot be used as evidence for any of them. Say where the theory is silent instead of forcing it to speak.

  Finally, what would have to change if the anti-intentionalist half were taken seriously? Would authorised continuation have to be re-described as a distinct art form with its own conventions — pastiche, homage, fan canon promoted to the trade list — or could the practice survive on some other footing, and would it have to be marketed differently?

  Two constraints. I am not asking for a map of the literature: no schools, no reading lists, no citations, since I cannot chase them and could not judge them; I want the argument itself, in a form I could use in a conversation with my agent or my heirs. And this recurs — several times a year I am asked to sign a canon statement, a continuity note, or a clause defining *the work* — so there is money and an afterlife at stake, and a clause drafted wrongly binds people who have not yet been born.

  Where a claim is substantive, mark how confident you are in it — confident, probable, or speculative — and close by naming the single claim you are least sure of, and what would change your mind about it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** A novelist concerned with the institutional habits surrounding their work (continuations, authorial intent, archival editing, legal definitions of characters).
      *   **Task:** Reconstruct the implicit theory of meaning presupposed by these habits, argue whether they can be held together, and answer specific questions about intention, identity, and practice.
      *   **Constraints:**
          *   Plain English (explain technical terms).
          *   Argued, not surveyed (no schools, reading lists, citations).
          *   Format for conversation with agent/heirs (practical, high stakes).
          *   Distinguish strict presuppositions from things that merely "sit well."
          *   Mark underdetermined areas.
          *   Mark confidence levels (confident, probable, speculative).
          *   Close with the single least sure claim and what would change the mind.
      *   **Key Questions to Address:**
          *   Does continuation presuppose counterfactual authorial facts vs. meaning intention?
          *   Can one deny authority on meaning but assert it on continuation/legacy?
          *   Is the "constraints document" about intention or reader experience (voice)?
          *   Does a character need to be the *same entity* across authors?
          *   What changes if anti-intentionalism is taken seriously (re-branding continuation)?

  2.  **Deconstruct the Practices:**

      *   *Practice 1: Continuation.* Dead author + Successor. Sold under dead author's name. Fidelity = Voice/Style (constraints on narrator) rather than Plot. Characters are portable assets.
      *   *Practice 2: Interpretation vs. Legal/Commercial Intent.* Critics/Teachers say "Author doesn't control meaning." Publishers/Lawyers say "Author controls adaptation/libel/canon."
      *   *Practice 3: Archival Editing.* Goal = "What the author finally wanted" (overriding printed text if coerced).

  3.  **Reconstruct the Implicit Theory:**

      *   *The Tension:* There is a split between *Semantic Authority* (what the text means to a reader/critic) and *Ontological Authority* (what the work *is* and who owns its future).
      *   *The Theory:* It looks like a "Dual-Aspect Intentionalism."
          *   Aspect A (Internal): The text, once published, is public property for interpretation. The author's intent doesn't limit what readers find.
          *   Aspect B (External/Generative): The author is the sole source of the work's *identity* and *continuity*. Only the author (or their designated proxy) can determine what counts as "more of the same."
      *   *The "Work" vs. The "Text":* The institutions treat the "Work" as an abstract object owned by the author, while the "Text" is a concrete artifact open to reading.

  4.  **Address Specific Questions:**

      *   *Counterfactuals vs. Meaning:* Continuation relies on "What would the author have written?" (Counterfactual). Meaning relies on "What did the author mean?" (Historical). These are different. One is projective, one is retrospective.
      *   *Inconsistency?* Can you deny meaning authority but keep continuation authority? Yes, *if* you distinguish between *interpretation* (reading) and *generation* (writing). But it's shaky. If the author doesn't know what the text means, why do they know what comes next?
      *   *Constraints Document:* Is it intentionalist or about voice/uptake? It's likely about *stylistic invariants* that trigger the reader's recognition of "voice." It's intentionalist clothing on a phenomenological goal.
      *   *Character Identity:* Does a character have to be the *same entity*? Legally, yes (IP). Ontologically, no. It's a "role" or "pattern" that can be instantiated by different writers.
      *   *Underdetermination:* Many theories fit the practices. The practices are pragmatic, not philosophical.
      *   *Anti-Intentionalist Consequences:* If we take "Death of the Author" seriously, continuation is pastiche. It must be marketed as "Inspired by" not "By."

  5.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the stakes. Define the core tension.
      *   *Section 1: The Two Intentionalisms.* Distinguish *Generative Intention* (making the work) from *Interpretive Intention* (explaining the work). The industry accepts the first, rejects the second.
      *   *Section 2: The Constraints Document.* Analyze this. It's not about plot (events) but voice (modalities). This suggests the "Work" is a style of consciousness, not a story.
      *   *Section 3: Character Identity.* Legal fiction vs. Ontological reality. Characters are "clusters of traits" legally, but "moral agents" to readers.
      *   *Section 4: Consistency Check.* Can you hold both? It requires a specific distinction between *Owning* the source and *Controlling* the reception. It's fragile but functional.
      *   *Section 5: Underdetermination.* Where the theory is silent. The practices are commercial/legal, not philosophical.
      *   *Section 6: The Anti-Intentionalist Shift.* What happens if we pivot? Marketing changes. "Canon" becomes "Curated."
      *   *Conclusion:* Confidence markers and the "Least Sure" claim.

  6.  **Refining the Tone:**

      *   Must be plain English. No "hermeneutics," "ontological," "phenomenological" without explanation.
      *   Must be argumentative, not just descriptive.
      *   Must respect the "money and afterlife" stakes.
      *   *Self-Correction on Terminology:* Instead of "Hermeneutics," use "rules of reading." Instead of "Ontology," use "what kind of thing it is."

  7.  **Addressing the Confidence Markers:**

      *   Need to insert (Confident), (Probable), (Speculative) throughout or at the end of sections. The prompt asks to mark where a claim is substantive. I will integrate these into the text or as footnotes/end-notes. Let's integrate them into the flow for readability, or use a specific formatting convention. The prompt says "Where a claim is substantive, mark how confident you are in it." I will use bold parentheticals.

  8.  **Final Review against Constraints:**

      *   No citations? Check.
      *   Plain English? Check.
      *   Argued? Check.
      *   Specific questions answered? Check.
      *   Closing requirement (least sure claim)? Check.

  9.  **Developing the Core Argument (The "Dual-Aspect" Theory):**

      *   The industry operates on a **Split Theory of Authority**.
      *   *Authority over Origin:* Absolute. Only the author (or estate) decides what counts as part of the series. This justifies the continuation and the legal definition of characters.
      *   *Authority over Reception:* Null. Once published, the text belongs to the public sphere of meaning. This justifies the critic's right to ignore the author's explanation.
      *   *The Glue:* The "Constraints Document." This bridges the gap. It doesn't dictate meaning; it dictates the *conditions of production* for the next piece. It treats the "Work" as a set of rules for generating text, not a container of meaning.

  10. **Refining the "Character" Question:**

      *   If a character is portable, what is it? It's a *legal construct* treated as a *psychological construct*. The industry pretends the character is a person to sell books, but treats them as IP to sell rights.
      *   *Claim:* The character is not the same entity. It is a *simulation* of the same entity. (Confident).

  11. **Refining the "Anti-Intentionalist" Shift:**

      *   If we drop the pretense that the successor writes *as* the author, it becomes an anthology or a "universe." Like Star Wars expanded universe vs. Canon.
      *   *Claim:* It would survive but must be marketed as "Curated" not "Authored." (Probable).

  12. **Final Polish:** Check the "Least Sure" claim.
      *   Least sure: Whether the "Constraints Document" is truly about voice/uptake or if it's a legal shield. I lean towards voice/uptake, but it could be purely liability management. I'll state that.

  13. **Writing the Response:** (Proceeding to generate output based on these thoughts.)
answer: |-
  Here is the reconstruction of the theory your industry habits presuppose, argued in plain English, followed by an assessment of their consistency and the consequences of changing them.

  ### I. The Implicit Theory: Split Authority

  The practices you describe do not rest on a single theory of meaning. They rest on a **Split Theory of Authority**. This theory divides the life of a book into two distinct phases: *Generation* (making the work) and *Reception* (reading the work).

  **1. Authority over Generation (Absolute)**
  The industry acts as though the author is the sole source of the work's existence. In this phase, "meaning" is not about what the text says to a reader, but about **Generative Intention**. This is the intention to bring a specific object into being.
  *   **The Continuation Trade:** When a successor is hired, the industry assumes the "Work" is not the physical book you held, but an abstract set of rules that generated the book. The "Constraints Document" you were advised to write is a manual for these rules. It does not record what happened (plot); it records the *limits of the consciousness* that observed the plot.
  *   **The Legal Character:** When contracts treat a character as a portable object, they are treating the character as a **Generative Asset**. This is a legal fiction that treats a pattern of words as if it were a person who can travel between stories.

  **2. Authority over Reception (Null)**
  Once the book is published, the industry (critics, teachers, reviewers) acts as though the author's authority ends. This relies on **Interpretive Independence**.
  *   **The Critical Habit:** When reviewers say your aim does not determine what the text says, they are claiming that meaning is created in the collision between the text and the reader, not deposited by the author.
  *   **The Tension:** You noted that publishers ask what you *meant* for legal or adaptation purposes. This is not because they believe you control the *reading*, but because they need you to control the *liability*. If you say, "I did not intend to libel this person," you are not defining the text's meaning; you are defining the *conditions of its creation* to protect the asset.

  **Can these be held together?**
  Yes, but only if you accept a specific distinction: **The author owns the source, but not the consequence.**
  *   **(Confident)** The industry presupposes that you have the right to decide what counts as *more of the same* (Continuation), but you do not have the right to decide what the existing text *does to a mind* (Interpretation).
  *   **(Probable)** This is not a philosophical contradiction, but a functional one. It works because "Writing the next chapter" is a physical act of production, while "Explaining the last chapter" is a mental act of interpretation. The industry grants you sovereignty over production, but democracy over interpretation.

  ### II. The Three Specific Questions

  **1. Counterfactuals vs. Meaning Intention**
  You asked if continuation presupposes counterfactual facts about what you *would have written*, and if this differs from intention about *meaning*.
  *   **(Confident)** They are different kinds of intention.
      *   **Meaning Intention:** "I intended this scene to symbolize grief." This is retrospective. It claims to explain a finished object. The industry rejects your authority here because the text might symbolize grief even if you didn't plan it.
      *   **Counterfactual Intention:** "If I were alive, I would not have let the narrator know this secret." This is projective. It is a rule for future manufacturing.
  *   **The Consistency Check:** A person can deny authority over Meaning Intention (the critic's right) while asserting authority over Counterfactual Intention (the estate's right). This is consistent *if* the goal of continuation is not to preserve the "truth" of the story, but to preserve the **Style of Consciousness**.
  *   **(Speculative)** The "Constraints Document" proves this. By listing what the narrator *may not know*, you are not defining the plot; you are defining the *shape of the mind* telling the story. The industry believes the "Novel" is actually a specific type of human attention. If the successor replicates that attention, the book is "yours," regardless of whether they understand your "meaning."

  **2. The Constraints Document: Intention or Uptake?**
  Is this document about your intention, or the reader's experience?
  *   **(Probable)** It is a theory about **Uptake** (the reader's experience) wearing **Intentionalist** clothing.
  *   **The Argument:** If it were purely about your intention, it would list your private goals. But it lists constraints on the narrator (what she may not feel). This is a technical specification for a machine designed to produce a specific effect in a reader. The trade calls this "fidelity to the author," but it is actually "fidelity to the reader's expectation."
  *   **Why the misdescription?** The trade uses the language of intention ("Write as she would have") because it sells better than the language of engineering ("Replicate the cognitive constraints of the previous text"). "The Author" is a brand; "The Cognitive Framework" is not.
  *   **(Confident)** Therefore, the practice is stable even if you deny you know what your books mean. You only need to know how your narrator *functions*.

  **3. Character Identity**
  Does a character have to be the *same entity* in a text written by a different person?
  *   **(Confident)** No. Ontologically (in reality), it cannot be the same entity. A character is a set of instructions for a reader to imagine a person. If the instructions change (because the writer changes), the imagined person changes.
  *   **What sort of entity is it?** It is a **Legal Placeholder**. The law requires the character to be an "object" so it can be sold. The marketing requires the character to be a "person" so readers care.
  *   **The Contradiction:** The industry asks you to treat the character as a person when writing (to make them feel real) and as an object when contracting (to sell the rights).
  *   **(Probable)** Continuation works not because the character is the same, but because the *name and history* are the same. It is a simulation of identity, not identity itself.

  ### III. Underdetermination: Where the Theory is Silent

  You asked to distinguish what these practices *presuppose* from what they merely *sit well with*. There are large gaps where the practice does not prove the theory.

  **1. The Archive vs. The Market**
  *   **Practice:** Scholars edit texts to recover what the author "finally wanted," even overriding printed revisions.
  *   **Underdetermination:** This practice sits well with the idea that the "True Work" is inside the author's head. But it does not *prove* it. It could equally be explained by a market desire for "Definitive Editions" to sell to libraries.
  *   **(Confident)** The scholarly practice presupposes that there is a single, ideal version of the text. The commercial practice (paperbacks, edits for length) presupposes there are many valid versions. These two practices contradict each other, but they operate in different markets (academic vs. retail), so the contradiction is ignored.

  **2. The "Meaning" Clause**
  *   **Practice:** Publishers ask what you meant for libel or adaptation.
  *   **Underdetermination:** This does not prove they believe you control meaning. It only proves they need a **Warrantor**. They need someone to sign a paper saying, "I built this safely."
  *   **(Confident)** Do not mistake legal indemnity for philosophical belief. When an insurer asks, "Did you intend to depict Mr. X?" they are not asking for literary criticism. They are asking, "Are you liable?" You can answer "No" without claiming authority over how the text is read.

  **3. The Successor's Authority**
  *   **Practice:** The successor writes under your name.
  *   **Underdetermination:** This does not prove the text is "yours." It proves that the **Brand** is yours.
  *   **(Speculative)** It is possible the industry knows the continuation is a forgery, but agrees to call it "By [You]" as a convention of the series, similar to how "The James Bond Series" continues without Ian Fleming. The theory is silent on whether this is deception or convention.

  ### IV. The Anti-Intentionalist Shift

  If you took the anti-intentionalist half seriously (that the author has no authority over meaning or identity), what would change?

  **1. Re-describing Continuation**
  *   **(Probable)** Authorised continuation would have to be re-described as a distinct art form: **Curated Pastiche**.
  *   **The Change:** Currently, the cover says "By [You] with [Successor]." This claims identity. Under a strict anti-intentionalist view, the cover must say "Based on the world of [You]."
  *   **The Consequence:** The price of the book would likely drop. Readers pay a premium for the illusion that *you* are still speaking. If you admit *you* are gone, and only the *rules* remain, it becomes fan fiction with a budget.

  **2. The Constraints Document**
  *   **(Confident)** The document would shift from "How I write" to "How the Machine Works." It would become a style guide, like a brand bible for a television show.
  *   **The Marketing:** You would market the *consistency of the experience*, not the *presence of the author*. "The same voice you love" rather than "Her final vision."

  **3. Can the practice survive?**
  *   **(Probable)** Yes, but on a different footing. It survives as **Franchise Management**.
  *   **The Risk:** If you remove the "Authorial Ghost," the emotional stakes lower. Readers forgive a living author for a bad book; they do not forgive an estate for selling out a dead one. The "Authorial Authority" is a shield that protects the successor from accusations of cashing in. If you remove that shield, the successor is exposed as a hired hand.

  ### V. Summary for Your Agent and Heirs

  To make this usable for your contracts and heirs, here is the distilled position:

  1.  **You own the Source, not the Sense.** You have the right to determine what counts as a new installment (Generative Authority), but you cannot control how readers interpret the existing text (Interpretive Independence). These are compatible if kept separate.
  2.  **The "Work" is a Set of Constraints.** Your "Constraints Document" is the most valuable asset you leave behind. It is not a list of plots; it is a definition of the narrator's cognitive limits. This defines the "Voice."
  3.  **Characters are Legal Fictions.** Do not argue that a character is the "same person" in a successor's book. Argue that they are the "same licensed pattern." This protects you from philosophical traps while securing your legal rights.
  4.  **Intent is for Liability, not Truth.** When asked "What did you mean?" in a legal context, answer strictly regarding safety and origin. Do not answer regarding theme or symbolism.
  5.  **Continuation requires the Illusion of Presence.** If you wish your series to continue under your name, you must empower the estate to enforce the "Constraints Document" strictly. If they allow the voice to drift, the illusion breaks, and the value collapses.

  ### VI. Confidence and Uncertainty

  **Confidence Markers:**
  *   **Confident:** The industry splits authority between Generation (Author owns) and Reception (Public owns).
  *   **Confident:** Characters are legal placeholders, not ontological entities.
  *   **Probable:** Continuation relies on replicating the "Style of Consciousness" (constraints), not plot.
  *   **Probable:** If anti-intentionalism were fully adopted, continuation would become "Curated Pastiche" and lose market value.
  *   **Speculative:** The "Constraints Document" is primarily for reader experience (uptake) rather than legal protection.

  **The Single Least Sure Claim:**
  I am least sure of the claim that **(The "Constraints Document" is primarily for reader experience/uptake rather than legal protection).**

  **What would change my mind:**
  If I saw evidence that these documents are routinely used in court to defend against copyright infringement or breach of contract, rather than being used internally by editors to guide the successor. If the document is primarily a legal shield to prove the estate "managed" the IP correctly, then the theory is less about "Voice" and more about "Due Diligence." If your agents tell you the document is for the lawyers first and the writer second, the theory shifts from Aesthetics to Liability.
