      *   **Math Check:**
          *   Does LLN apply? No, the Strong Law of Large Numbers requires $E[|X|] < \infty$. If the mean is infinite, the sample mean $\bar{X}_n$ does not converge to a constant.
          *   Behavior of $\bar{X}_n$ for SPP: For i.i.d. St. Petersburg variables $X_1, ..., X_n$, the sum $S_n = \sum X_i$ grows faster than $n$. Specifically, $S_n / (n \log_2 n)$ converges in probability to 1 (or similar scaling depending on exact formulation). The average $\bar{X}_n = S_n / n$ grows roughly like $\log_2 n$.
          *   So, the friend is *correct* about the asymptotic behavior of the *unbounded* SPP. If the liability is truly uncapped and follows the SPP distribution exactly, pooling $N$ people makes the average liability per person grow as $\log_2 N$, not shrink. Diversification fails for infinite-mean distributions.
          *   However, is the liability *actually* SPP? The user mentioned a cap: "the pool has maybe 200k in it, so cap the payout at the size of the pool".
