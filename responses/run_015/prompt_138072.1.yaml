      *   *Point 4 (Contractual):* The only robust solution is to negotiate contractual caps on liability rather than relying on internal pool limits, ensuring the legal obligation itself has a finite first moment.
      *   *Point 5 (Refusal):* If the counterparty refuses a cap and the tail remains heavy enough to threaten individual solvency, refusing the contract is the only decision-theoretically coherent action regardless of premium collected.

