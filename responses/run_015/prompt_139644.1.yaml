  ### Part 1: Conceptual Components & Order of Operations

  You cannot run the continuum argument until the logical grammar is fixed. Policy students default to optimization models where transitivity is an axiom, not a variable. You must dismantle the axiom before building the paradox.

  **Order of Components:**

  1.  **The Relations ($>$ vs. $\geq$):**
      *   **Action:** Put "Strictly Better Than" ($>$) and "At Least As Good As" ($\geq$) on the board immediately.
      *   **Reason:** Intransitivity in $>$ (A > B, B > C, but C > A) is a cycle. Intransitivity in $\geq$ (A $\geq$ B, B $\geq$ C, but not A $\geq$ C) is a failure of ordering. Policy students conflate these. You are targeting strict betterness ($>$).
      *   **Dependency:** The chain argument relies on strict links. If they slip into "at least as good," the paradox dissolves into indifference.

  2.  **The Definition of Transitivity:**
      *   **Action:** Write the formal schema: $\forall x,y,z ((x > y \land y > z) \rightarrow x > z)$.
      *   **Reason:** They know this from EU theory, but they treat it as a constraint on *rationality*, not a claim about *value*. You need them to see it as a claim about the structure of the good itself.
      *   **Dependency:** Must follow the Relations. You can't test transitivity without knowing which relation you are testing.

  3.  **The Step Magnitude (Perceptible vs. Imperceptible):**
      *   **Action:** Define a "Small Improvement" as a change that is *noticeable* and *valued*, but not *decisive* on its own.
      *   **Reason:** This blocks the "Just Noticeable Difference" escape route. If the step is imperceptible, they will claim indifference ($A \sim B$). If the step is perceptible, they must admit $A > B$.
      *   **Dependency:** Must precede the Case. You cannot describe the steps in the case without this definition.

  4.  **The Chain Structure:**
      *   **Action:** Describe the sequence $A \rightarrow B \rightarrow C \dots \rightarrow Z$.
      *   **Reason:** This sets up the conflict between Local Comparison (Step-wise) and Global Comparison (End-points).
      *   **Dependency:** Requires all three above.

  ---

  ### Part 2: The Case Study — "The Legislative Bill"

  Do not use pain, money, or QALYs. These are smoothly divisible and invite the "imperceptible difference" defense. Use a good that is **threshold-dependent** but achieved through **perceptible increments**.

  **The Case:** *Passing a Specific Piece of Legislation.*
  **The Good:** *Actual Implementation.* (A bill that fails has near-zero value; a bill that passes has high value).

  **Why this case fits the constraints:**
  1.  **Threshold Value:** The value function is non-linear. A bill at 99% likelihood of passage is worth far less than a bill at 51% likelihood (which passes). This mirrors the "actually understood/actually seen" constraint.
  2.  **Perceptible Steps:** The chain is not "1% more probability." The chain is **specific amendments**.
      *   *Case A:* The Ideal Bill (0% chance of passing).
      *   *Case B:* Ideal Bill minus Clause 1 (5% chance).
      *   *Case C:* Ideal Bill minus Clause 1 & 2 (10% chance).
      *   ...
      *   *Case Z:* The Compromise Bill (100% chance of passing).
  3.  **The Trap:**
      *   *Local Comparison:* Removing Clause 1 is a small loss in quality, but a gain in viability. Students will agree $B > A$ (because a passed compromise is better than a failed ideal).
      *   *Chain:* $C > B$, $D > C$... $Z > Y$.
      *   *Global Comparison:* $A$ is the "Perfect Policy." $Z$ is the "Watered-Down Policy."
      *   *The Paradox:* If $A > B > \dots > Z$, then $A > Z$. But intuitively, $Z$ (Passed) $> A$ (Failed).
      *   *Why it blocks the escape:* You cannot say the difference between "Ideal" and "Ideal minus Clause 1" is imperceptible. It is a specific, perceptible policy change. Yet the *value* jump only happens at the threshold of passage.

  **Instruction:** Walk them through the first three steps explicitly. Then ask them to grant the inductive step ("If $N$ is better than $N-1$, is $N+1$ better than $N$?"). Then jump to $A$ vs. $Z$.

  ---

  ### Part 3: The Misconception Map

  Policy students are trained to solve problems, not dwell in paradoxes. They will try to "fix" the argument rather than analyze it. Defuse these at the specific points below.

  | Misconception | The Student Move | When to Defuse | How to Defuse (Script) |
  | :--- | :--- | :--- | :--- |
  | **The Money Pump** | "If preferences are intransitive, I can be exploited. So betterness must be transitive." | **Before the Chain (Part 1)** | "We are not discussing *choice* or *preference* today. We are discussing *betterness*. A money pump requires an agent making sequential choices. Value can be structured oddly even if agents aren't exploitable. Bracket exploitation." |
  | **The "Roughly Equal" Escape** | "Step $N$ isn't *better* than $N-1$, they are *roughly as good as* each other." | **During the Chain (Part 2)** | "Roughly as good as' is not transitive. If you use that relation, you concede the point. I am asking about *strict betterness*. Does the viability gain *strictly* outweigh the quality loss? If yes, move on. If no, the chain breaks." |
  | **The Epistemic Confusion** | "We can't *know* if $B$ is better than $A$, so we can't compare them." | **During the Global Comparison (Part 2)** | "This isn't about our knowledge. It's about the value. Even if God looked at $A$ and $B$, is $B$ better? Don't hide behind measurement error." |
  | **The Optimization Assumption** | "There must be a 'best' bill in the series. We just need to find it." | **At the Conclusion (Part 3)** | "The argument suggests there *is* no best. Every bill is beaten by the next. If you insist there is a best, you must identify the step where the improvement stops. Point to it." |

  ---

  ### Part 4: Closing

  **The Diagnostic Question:**
  > "To save transitivity, you must reject one of three claims: (1) That each amendment is a small improvement, (2) That the chain connects the first to the last, or (3) That the Passed Compromise is better than the Failed Ideal. **Which premise do you reject, and what is the non-arbitrary cutoff point for that rejection?**"

  *(This forces them to admit that denying the chain requires identifying a specific step where value behaves magically, which is the heart of the sorites problem.)*

  **The Explicit Limitation:**
  > "I am not going to tell you which premise is false. In ninety minutes, we cannot solve a paradox that has occupied value theorists for decades. My goal is not to give you the answer, but to ensure you stop assuming transitivity is a free gift in your policy models. If you leave here assuming betterness is transitive, you must now carry the burden of proof for *why*."
