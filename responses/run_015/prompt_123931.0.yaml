prompt: |-
  Hi — I work at a smallish foundation (about $4M a year out the door, three program staff, roughly 25 grants, health and animal welfare mostly) and we've backed ourselves into a philosophical mess that I need turned into something runnable. One bloc on our board has been arguing that if the lexical-threshold negative-utilitarian picture is even approximately right — that there's a severity threshold above which suffering lexically dominates any amount of milder suffering *and* isn't offset by pleasures at all — then our whole pipeline is the wrong shape of tool, because we currently rank everything on a single made-up currency of "units of wellbeing per dollar" and that only makes sense if pleasure and pain are commensurable on one cardinal scale. The other bloc thinks that's fanatical and would have us defund things everyone agrees are good. The compromise the board landed on is that they want a written procedure, not a white paper: something a program officer with a public-health or vet-med background and no philosophy training can work through in about 40 minutes per application, that ends in a fund / don't fund / send back for more info, and that produces a half page of reasoning a donor could read without wincing. The board also wants to know explicitly where they're allowed to overrule it, since they won't accept being bound by it.

  So: give me the procedure. Ordered questions, what counts as a sufficient answer to each, the points where it stops with a no, and the points where it hands the decision to a person because it's a values call rather than a factual one. Some things I specifically want it to handle, and some of these I suspect are where the real work is. First, severity placement under coarse evidence: we have an internal six-rung suffering ladder we use informally, and I want to know what's actually being ordered — peak intensity, duration, or the product — whether the threshold is on a single episode or on a whole life, and whether many sub-threshold experiences can ever *sum* past the threshold (my guess is the honest lexical answer is no, and I want to see the bullet bitten rather than fudged into mere heavy weighting). Second, uncertainty: we essentially never know the severity, so the officer is always choosing between something like a 10% shot at preventing agony and a near-certain reduction in moderate chronic pain, and I need a rule for reasoning about probability-of-crossing-the-threshold that doesn't quietly reintroduce cross-rung expected-value arithmetic through the back door. Third, the offset question: can pleasure cancel pain at all, intra-personally or inter-personally, and if the view says never, what does our procedure do with the fact that our donors and our beneficiaries care a lot about positive experiences? Fourth, counterfactuals about *who exists*: several of our grants change prices or demand, so they plausibly change which animals live and how many, and there's substitution leakage between species and between countries — I need the procedure to catch that rather than awarding points for measured suffering on the animals in front of us. And fifth, gaming: applicants already learn to describe whatever they work on as agony, so I'd like a calibration step that penalises severity claims which have inflated over time in our own files. Wherever the procedure has to draw an arbitrary line (which rung is the threshold, how big a probability is big enough), say who should set it, how often to revisit it, and what record-keeping makes that revisiting possible.

  Then run it on three of our actual live decisions so I can see whether it survives contact: (1) a cost-share grant to a large poultry producer for a controlled-atmosphere stunning retrofit affecting several million birds a year, where the ask is big enough that it crowd out four smaller grants; (2) a palliative-care and opioid-availability programme in a low-income country, where the target suffering is unambiguously top-rung but the theory of change is soft and there's a real regulatory-capture risk we can't quantify; and (3) our original flagship, a small music-and-playground programme in the same districts we fund health work in, which staff love, which the board will fight for, and which I'm fairly sure your procedure tells us to stop funding — so please show me how it says that, in language I could actually bring to a board meeting. Also tell me plainly what the procedure can't do: which cases it genuinely can't settle, where the judgment can't be eliminated no matter how much scaffolding you add, where it will misfire in a way I should warn officers about, and what an officer should write down when they hit one of those points so the board can see the seam.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Context:** Small foundation ($4M/year, 3 staff, 25 grants, health & animal welfare).
      *   **Problem:** Philosophical conflict on the board regarding *lexical negative utilitarianism* (lexicographical priority of severe suffering over mild suffering/pleasure). Current system uses a single "wellbeing per dollar" currency (commensurable), which contradicts the lexical view.
      *   **Goal:** A *runnable procedure* (not a white paper) for program officers (POs) with public health/vet med backgrounds (no philosophy training).
      *   **Constraints:**
          *   ~40 minutes per application.
          *   Output: Fund / Don't Fund / Send Back.
          *   Output: Half-page reasoning for donors (non-technical).
          *   Must specify where the board can overrule (values calls).
          *   Must handle specific hard cases: Severity placement (peak vs. duration vs. sum), Uncertainty (probability of threshold crossing), Offsets (pleasure vs. pain), Counterfactuals (existence/substitution), Gaming (inflation of severity claims).
          *   Must define who sets arbitrary lines and how to review them.
      *   **Test Cases:**
          1.  Poultry stunning retrofit (high scale, moderate severity vs. smaller grants).
          2.  Palliative care/opioids (high severity, soft theory of change, regulatory risk).
          3.  Music/playground program (positive welfare, likely fails lexical test).
      *   **Meta-Requirement:** Explicitly state limitations, where judgment is irreducible, and what to record when the procedure hits a seam.

  2.  **Deconstruct the Philosophical Core (Lexical Negative Utilitarianism):**

      *   *Core Tenet:* Severe suffering (above threshold $T$) cannot be traded off against any amount of mild suffering or pleasure.
      *   *Implication 1:* Aggregating mild suffering to equal severe suffering is forbidden (No Summation).
      *   *Implication 2:* Pleasure cannot cancel pain (No Offsets).
      *   *Implication 3:* Priority is preventing the *existence* or *continuation* of states above $T$.
      *   *Implication 4:* Uncertainty must be handled carefully. If there's a non-negligible chance of $>T$, it might dominate a certainty of $<T$ improvement, depending on the specific lexical rule adopted (e.g., "Lexical Threshold Risk Weighting").
      *   *Implication 5:* Existence changes matter. If an intervention prevents a life of net suffering $>T$, it's good. If it creates lives with $>T$, it's bad.

  3.  **Drafting the Procedure (The "Suffering Threshold Protocol" - STP):**

      *   *Structure:* Needs to be a checklist/flowchart style.
      *   *Time:* 40 minutes means roughly 5-7 steps, 5 minutes each.
      *   *Tone:* Operational, clear, decisive, but acknowledging uncertainty.

      *   *Step 1: Severity Classification (The Ladder).*
          *   Need to define the "Threshold." Let's call Rung 5 or 6 the "Lexical Zone."
          *   Address Peak vs. Duration: Lexical views usually focus on *peak intensity* sustained for a non-trivial duration. A split-second spike isn't usually the target. Let's define it as "Sustained Peak."
          *   Address Summation: Explicitly forbid summing sub-threshold events to cross the threshold.
          *   *Gaming Check:* Compare against historical internal data.

      *   *Step 2: Probability & Uncertainty.*
          *   How to handle risk without EV?
          *   Rule: If $P(\text{Severity} > T) > \text{Minimum Risk Threshold}$, treat as Lexical Priority.
          *   If the intervention *prevents* $>T$ suffering with low probability, does it beat *certain* $<T$ relief?
          *   *Decision:* Use a "Risk-Weighted Priority" rule. If there is a credible pathway to preventing $>T$ suffering, it trumps $<T$ improvements *unless* the probability is vanishingly small (e.g., <1%). This avoids pure EV but acknowledges uncertainty.

      *   *Step 3: Offsets (Pleasure/Pain).*
          *   Rule: Pleasure does not cancel Pain above $T$.
          *   Implication: Programs primarily generating pleasure (playgrounds) cannot justify costs if they displace resources from $>T$ prevention.
          *   Nuance: Pleasure *below* $T$ can be weighed against Pain *below* $T$.

      *   *Step 4: Counterfactuals & Substitution.*
          *   Must ask: "Does this change *who* exists or *how many*?"
          *   If yes, requires "Existence Impact Statement."
          *   Leakage check: Does saving Species A cause Species B to suffer $>T$?

      *   *Step 5: The Decision Matrix.*
          *   Combine findings into Fund/No Fund/Send Back.
          *   Identify "Values Calls" for the Board.

      *   *Governance:* Who sets the lines? The Board (Policy Committee). Review: Annual.

  4.  **Developing the Test Cases:**

      *   *Case 1 (Poultry):*
          *   Severity: Stunning failure is likely Rung 5/6 (Agony). Current method is likely Rung 3/4 (Distress).
          *   Scale: Millions.
          *   Trade-off: Crowds out 4 smaller grants.
          *   STP Outcome: If the retrofit prevents $>T$ suffering, it wins lexically *unless* the smaller grants also prevent $>T$. If smaller grants are mild relief, Poultry wins.
          *   *Wait:* The prompt implies the Poultry grant is "cost-share" with a large producer. Risk of subsidizing business-as-usual?
          *   *Refinement:* The procedure needs to catch "additionality." If the producer would have done it anyway, no suffering prevented.
          *   *STP Verdict:* Likely Fund (if additional), because preventing mass agony trumps mild relief.

      *   *Case 2 (Palliative/Opioids):*
          *   Severity: End-of-life pain is definitely $>T$.
          *   Uncertainty: Regulatory capture/soft ToC.
          *   STP Outcome: High severity potential triggers Lexical Priority. Uncertainty requires "Send Back for Risk Mitigation Plan" or "Fund with Milestones."
          *   *Verdict:* Fund (conditional), because the stakes (agony) are lexically dominant.

      *   *Case 3 (Music/Playground):*
          *   Severity: Primarily positive welfare (Rung 1/2).
          *   STP Outcome: Cannot offset costs if resources could prevent $>T$.
          *   *Verdict:* Don't Fund (under strict lexical rules).
          *   *Board Override:* This is the specific "Values Call" zone. The procedure must flag this as "Positive Welfare Only - Requires Board Waiver."

  5.  **Refining the "Runnability" and "Philosophical Honesty":**

      *   *The "No Summation" Bullet:* I need to make sure the procedure explicitly says "Do not add up mild pains."
      *   *The "Probability" Bullet:* I need a heuristic. "Credible Possibility" standard. If a credible expert says there's a 5% chance of agony, you treat it as an agony-prevention project, not a mild-relief project.
      *   *The "Board Override":* Clearly mark steps where the PO stops and says "This is a policy setting, not a factual finding."
      *   *The "Donor Memo":* Needs to be sanitized. Don't say "Lexical Negative Utilitarianism." Say "Priority on Preventing Severe Distress."

  6.  **Addressing Specific Constraints:**

      *   *40 Minutes:* Keep questions binary or 3-option where possible.
      *   *Gaming:* Use a "Severity Index" based on past grants. If an applicant claims "Agony" for something previously coded as "Distress," flag for audit.
      *   *Record Keeping:* Need a "Threshold Log."

  7.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Set the frame. This is the "Threshold Priority Protocol" (TPP).
      *   *Section 1: The Ladder & Threshold.* Define the rungs. Define the cut-off.
      *   *Section 2: The Procedure Steps.*
      *   *Section 3: Governance (Who sets lines).*
      *   *Section 4: The Test Cases.*
      *   *Section 5: Limitations & Seams.*

      *(Self-Correction during drafting)*: I need to be careful not to make the procedure *too* complex for 40 minutes. The "Counterfactual" step is the time-sink. I need to simplify it to a "Red Flag" system. If population dynamics change, trigger a deeper review (Send Back).
      *(Self-Correction on Probability)*: Pure lexical views struggle with risk. If there's a 1% chance of saving a life from agony, is it better than 100% chance of relieving a headache? Strict lexically, maybe not. But "Lexical Threshold Risk Weighting" is a common compromise. I will institute a "Minimum Credible Probability" rule. If $P > 5\%$, treat as Lexical. If $P < 5\%$, treat as Mild. This avoids infinite EV but handles uncertainty.

      *(Self-Correction on Offsets)*: The prompt asks about pleasure canceling pain. The strict view says No. The procedure must reflect this. If a project creates pleasure but risks pain $>T$, it's a No. If it creates pleasure and prevents pain $<T$, it's a Yes (subject to budget). If it creates pleasure but *displaces* funding for pain $>T$, it's a No.

      *(Self-Correction on Case 3)*: The prompt says "I'm fairly sure your procedure tells us to stop funding." I need to be direct here. The procedure *will* kill it. The value is giving the Board the *excuse* to overrule it explicitly, rather than hiding the conflict.

  8.  **Final Polish:**

      *   Ensure the tone is professional, operational, and respectful of the philosophical gravity without getting bogged down in jargon.
      *   Check all 5 specific handling requirements (Severity, Uncertainty, Offsets, Counterfactuals, Gaming).
      *   Ensure the "Board Override" points are explicit.

  9.  **Final Review against constraints:**
      *   40 mins? Yes, if streamlined.
      *   Half-page memo? Yes, template provided.
      *   Board override points? Yes, marked as "Policy Determinations."
      *   Test cases run? Yes.
      *   Limitations section? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  This is a **Threshold Priority Protocol (TPP)**. It is designed to be executed by a Program Officer (PO) in 40 minutes. It operationalizes a lexical threshold view without requiring the PO to do moral philosophy. It separates *factual assessments* (which the PO makes) from *policy settings* (which the Board sets and can overrule).

  ### Part 1: The Protocol Structure

  **Time Budget:** 40 Minutes
  **Inputs:** Grant application, internal "Suffering Ladder" (6 rungs), historical grant database.
  **Outputs:** Decision (Fund / No Fund / Send Back), Half-Page Donor Memo, "Policy Flag" (if Board override is needed).

  #### The Suffering Ladder (Internal Reference)
  *   **Rungs 1–3 (Mild/Moderate):** Discomfort, annoyance, manageable chronic pain. *Commensurable.*
  *   **Rungs 4–6 (Severe/Extreme):** Panic, agony, torture, crushing despair. *Lexically Dominant.*
  *   **The Threshold ($T$):** The line between Rung 3 and Rung 4. (Set by Board Policy).

  ---

  #### Step 1: Severity Classification & Gaming Check (10 Minutes)
  **Goal:** Assign a severity rating to the *primary* suffering addressed.
  **Q1.1:** What is the **Peak Intensity** of the suffering prevented? (Select Rung 1–6).
  **Q1.2:** What is the **Duration**? (Select: Moments / Hours / Chronic / Lifetime).
  **Q1.3:** **The Summation Rule:** Does this intervention prevent many instances of Rung 1–3 suffering?
  *   *If Yes:* You **cannot** sum these to equal a Rung 4+ prevention. Mark as "Sub-Threshold Aggregate."
  *   *If No:* Proceed.
  **Q1.4:** **Gaming Calibration:** Compare the applicant's severity language against our internal database for similar interventions.
  *   *If applicant claims Rung 5 where history shows Rung 3:* Flag as "Severity Inflation." Downgrade rating by one rung automatically unless new evidence is provided.
  **Q1.5:** **Threshold Determination:** Is the primary outcome **Above $T$** (Rung 4–6) or **Below $T$** (Rung 1–3)?
  *   *If Above $T$:* Go to Step 2A.
  *   *If Below $T$:* Go to Step 2B.

  #### Step 2A: The Lexical Track (For Suffering > $T$) (10 Minutes)
  **Goal:** Assess probability and counterfactuals for severe suffering.
  **Q2A.1:** **Probability of Success:** What is the likelihood the intervention actually prevents this severe suffering?
  *   *Rule:* Do not use Expected Value. Use **Credible Possibility**.
  *   *If > 5% chance:* Treat as a "Lexical Priority" project.
  *   *If < 5% chance:* Treat as "Speculative." (Requires Board Policy decision on risk tolerance).
  **Q2A.2:** **Counterfactuals & Existence:** Does this intervention change *who* exists or *how many* beings exist? (e.g., population-level welfare, market shifts).
  *   *If Yes:* **STOP.** Send Back for "Existence Impact Statement." (PO cannot assess this alone).
  *   *If No:* Proceed.
  **Q2A.3:** **Substitution Leakage:** If this reduces suffering in Group A, does it increase suffering in Group B?
  *   *If Group B suffering is > $T$:* **No Fund.** (Lexical violation).
  *   *If Group B suffering is < $T$:* Proceed.

  #### Step 2B: The Commensurable Track (For Suffering < $T$) (5 Minutes)
  **Goal:** Standard cost-benefit for mild suffering and pleasure.
  **Q2B.1:** **Net Wellbeing:** Does this reduce mild suffering OR increase pleasure?
  *   *Note:* Below $T$, pleasure and pain **are** commensurable.
  **Q2B.2:** **Opportunity Cost:** Will funding this displace a potential "Lexical Priority" project (from Step 2A)?
  *   *If Yes:* **No Fund.** (Lexical priority trumps commensurable gains).
  *   *If No:* Proceed to standard cost-effectiveness ranking.

  #### Step 3: The Offset Question (5 Minutes)
  **Goal:** Determine if positive experiences justify the cost.
  **Q3.1:** Does the project create pleasure/positive welfare?
  **Q3.2:** Is there any risk of Suffering > $T$ occurring as a side effect?
  *   *If Yes:* Pleasure **cannot** offset this. **No Fund.**
  *   *If No:* Pleasure counts as a positive benefit (only in the Commensurable Track).
  **Q3.3:** **Donor Alignment:** Are donors funding this specifically for positive welfare?
  *   *Note:* If yes, flag for Board. The procedure says "No," but donors may demand "Yes."

  #### Step 4: Decision & Documentation (10 Minutes)
  **Decision Matrix:**
  1.  **Fund:** Above $T$ with >5% probability, no leakage, no existence changes. OR Below $T$ with no displacement of Above $T$ projects.
  2.  **No Fund:** Below $T$ displacing Above $T$. OR Above $T$ with unacceptable leakage. OR Pleasure project displacing Suffering prevention.
  3.  **Send Back:** Missing info on probability, existence effects, or severity inflation.
  4.  **Board Override Required:** Any decision to fund a "Below $T$" project when budget is tight, or any decision to accept >5% risk on a "Speculative" lexical project.

  **Record Keeping:**
  *   Log the assigned Rung.
  *   Log the "Gaming Adjustment" (if any).
  *   Log the "Policy Flag" (if Board override is invoked).

  ---

  ### Part 2: Governance & Arbitrary Lines

  The PO does not set the philosophy; they execute it. The Board sets the parameters.

  1.  **Who Sets the Threshold ($T$)?** The Board Policy Committee.
      *   *Review:* Annually.
      *   *Record:* "Threshold Definition Document" (e.g., "Rung 4 = Incapacitating Pain").
  2.  **Who Sets the Probability Floor (5%)?** The Board.
      *   *Review:* Annually.
      *   *Record:* "Risk Tolerance Policy."
  3.  **Who Handles Gaming?** The Program Director.
      *   *Review:* Per grant cycle.
      *   *Record:* "Severity Calibration Log" (tracking average claimed severity per year).
  4.  **Board Override Power:** The Board may overrule a "No Fund" decision on Lexical grounds **only** by voting to temporarily suspend the TPP for that specific grant class. This vote must be recorded as a "Values Deviation."

  ---

  ### Part 3: Running the Live Decisions

  Here is how the TPP processes your three current dilemmas.

  #### Case 1: Poultry Stunning Retrofit
  *   **Step 1 (Severity):** Controlled-atmosphere stunning failure leads to conscious scalding. Internal ladder rates this **Rung 5 (Agony)**. *Above Threshold.*
  *   **Step 1 (Gaming):** Applicant claims "Torture." Historical data confirms this is standard industry risk. No inflation flag.
  *   **Step 2A (Probability):** Retrofit is proven tech. Probability of preventing agony is >90%. *Lexical Priority.*
  *   **Step 2A (Counterfactuals):** Does this change how many chickens exist?
      *   *Risk:* Cost-share might lower production costs, increasing demand (more chickens).
      *   *Action:* **Send Back.** PO must request an "Elasticity Analysis." If increased production leads to more lives of net suffering > $T$, the grant is toxic.
      *   *Assumption for Decision:* If analysis shows neutral population impact: **Fund.**
      *   *Reasoning:* Preventing millions of Rung 5 events lexically dominates four smaller grants addressing Rung 2–3 issues.
  *   **Board Override:** None needed if population impact is neutral.

  #### Case 2: Palliative Care / Opioids
  *   **Step 1 (Severity):** End-of-life cancer pain without opioids is **Rung 6 (Extreme Agony)**. *Above Threshold.*
  *   **Step 2A (Probability):** Regulatory capture risk is high. Success probability estimated at 20%.
      *   *Rule:* 20% > 5% floor. Treat as Lexical Priority.
  *   **Step 2A (Counterfactuals):** Does not change who exists.
  *   **Step 3 (Offsets):** No pleasure offsets claimed. Pure suffering prevention.
  *   **Decision:** **Fund.**
  *   **Reasoning:** Even with soft theory of change, the *stakes* (Rung 6) trigger lexical priority over certain mild improvements elsewhere.
  *   **Risk Mitigation:** Fund in tranches. If regulatory progress stalls, cut.

  #### Case 3: Music & Playground Programme
  *   **Step 1 (Severity):** Primary outcome is joy/play. **Rung 1–2 (Positive/Mild).** *Below Threshold.*
  *   **Step 2B (Opportunity Cost):** Budget is fixed. Funding this consumes resources that could go to Case 1 or 2 (Above Threshold).
  *   **Decision:** **No Fund.**
  *   **Reasoning:** Under the TPP, positive welfare (Rung 1–2) cannot justify displacing severe suffering prevention (Rung 4–6).
  *   **Board Override:** **Required.**
      *   *Action:* PO submits "No Fund" recommendation with a **Policy Flag**.
      *   *Board Action:* If the Board wants to fund this, they must vote a "Values Deviation." They are explicitly acknowledging they are prioritizing "Community Good" over "Severe Suffering Prevention."
      *   *Donor Memo Language:* "While this programme generates significant community joy, our current priority framework directs capital toward the prevention of acute physical distress. Funding this requires a strategic exception."

  ---

  ### Part 4: The Half-Page Donor Memo (Template)

  **To:** [Donor Name]
  **From:** Program Office
  **Re:** Grant Decision – [Project Name]

  **Decision:** [Fund / Do Not Fund]

  **Reasoning:**
  Our foundation currently prioritizes the prevention of severe suffering over the promotion of mild wellbeing. We assess applications based on the intensity of distress prevented.

  *   **[If Fund]:** This project addresses [Specific Severe Condition], which meets our threshold for acute distress. Despite [Risk/Uncertainty], the severity of the outcome justifies the investment.
  *   **[If No Fund - Lexical]:** While this project offers meaningful benefits, our analysis indicates it addresses moderate discomfort rather than acute distress. Given our limited capital, we are directing resources to interventions preventing more severe outcomes.
  *   **[If No Fund - Values Deviation]:** This project falls outside our standard priority framework (which targets severe suffering). However, the Board has authorized an exception to support [Community/Positive Welfare] goals this cycle.

  **Limitations:**
  This assessment relies on current data regarding [Severity/Probability]. We will review outcomes in [Date] to ensure thresholds were met.

  ---

  ### Part 5: Limitations & Seams (What the Procedure Can't Do)

  You asked for plain talk on where this breaks.

  **1. The "Existence" Seam (Case 1 Risk)**
  *   **Problem:** The PO cannot calculate market elasticity or population substitution in 40 minutes.
  *   **Failure Mode:** Funding a project that reduces suffering per animal but increases the total number of animals bred into suffering.
  *   **Instruction to PO:** If the grant affects market prices, production volume, or breeding rates, you **must** trigger "Send Back." Do not guess. Write in the file: *"Existence Impact Unknown. Requires External Economic Review."*

  **2. The "Probability" Seam (Case 2 Risk)**
  *   **Problem:** The 5% rule is arbitrary. Why not 1%? Why not 10%?
  *   **Failure Mode:** Two POs assess the same risk differently.
  *   **Instruction to PO:** When estimating probability, cite *two* external sources. If they disagree by >10%, flag as "High Uncertainty." The Board must decide if "High Uncertainty" on Lexical projects is acceptable.

  **3. The "Values" Seam (Case 3 Reality)**
  *   **Problem:** The procedure *will* tell you to kill the Playground grant. Your Board *will* want to fund it.
  *   **Failure Mode:** The procedure loses credibility if ignored constantly.
  *   **Instruction to PO:** Do not fudge the severity rating to make the Playground fit. Rate it honestly as Rung 1–2. Force the Board to take the "Values Deviation" vote. This preserves the integrity of the system. The PO's job is to show the cost of the deviation, not to hide it.

  **4. The "Gaming" Seam**
  *   **Problem:** Applicants will learn to use the word "Agony" to pass Step 1.
  *   **Failure Mode:** Severity inflation makes everything look Lexical, blowing the budget.
  *   **Instruction to PO:** Use the **Calibration Log**. If the average claimed severity of grants rises >0.5 rungs year-over-year without external epidemiological changes, freeze all "Above Threshold" classifications until the Program Director audits the ladder.

  **5. Irreducible Judgment**
  *   There is no algorithm for **Rung 3.5**. Is chronic moderate pain Lexical? The procedure forces a binary choice.
  *   **What to Write:** When a case feels like it sits on the line, write: *"Severity Borderline. Classification relies on Board Policy Definition of Rung 4."* This puts the responsibility for the edge-case on the Policy Committee, not the PO.

  ### Summary for the Board
  This procedure does not solve the philosophical mess. It **contains** it. It allows the Negative Utilitarians to ensure their threshold is respected, it allows the Pragmatists to see exactly where they are overruling it, and it protects the Program Officers from having to make moral arguments they aren't trained to make. It turns a metaphysical dispute into an audit trail.
