      *   *Resolving (b) vs (f):* If Math Thesis is about "effective procedures" (human-able), a black box isn't an effective procedure. So (f) is wrong *given* (b). To save (f), you must change the definition in (b) from "human computor" to "physically realizable process." But that collapses Math into Physical (violating (a)).
