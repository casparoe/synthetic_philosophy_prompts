  6.  **Self-Correction/Nuance Check:**
      *   *Wait, check (f) again:* "A physical black box... would refute the mathematical thesis." Why? Because it produces a function that is not Turing-computable. If the Math Thesis says "Every effectively computable function is TM-computable," and the black box produces a function that is *effectively computable* (by the box?), then it refutes it. But is the box's operation an "effective procedure"? (b) says effective procedure = human rote. Box != human rote. So Box function is not "effectively computable" in the sense of (b). So (f) contradicts (b).
