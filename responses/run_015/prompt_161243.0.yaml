          *   *Conflict:* (b) anchors the Math Thesis to the *human computor analysis* (Turing's justification). (f) anchors the falsification condition to *physical reliability* independent of human executability. If the Math Thesis is defined by the human computor analysis (as per (b)), then a black box that humans cannot execute/verify doesn't fit the definition of "effective procedure" established in (b). If (f) is right, then the definition in (b) is too narrow or wrong.
