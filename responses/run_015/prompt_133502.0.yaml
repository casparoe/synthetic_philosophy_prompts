answer: |-
  The Equilibrium Engine did not hum; it breathed. It was a sprawling assembly of brass dials, vacuum tubes, and fluidic logic gates housed in the basement of the Moray's End council hall. It smelled of ozone, old oil, and the damp salt air that seeped through the foundation.

  Elara sat before the console, her hands hovering over the input levers. Outside, the sky was the color of a bruised plum. The Gray Gale was coming, the meteorologists said. A storm that hadn't been seen in fifty years.

  On her desk lay two files.

  File A: The Storm Barrier. A temporary reinforcement of the sea wall using the heavy pilings stored in the upper harbor. Cost: high. Labor: dangerous. Benefit: probable preservation of the lower town homes and the fishing fleet.

  File B: The Rite of the Nets. A generational ritual required to bless the fleet before the winter haul. It required the harbor gates to remain open to the tide at midnight, when the moon hit the zenith. If the pilings were installed, the gates had to be sealed. The Rite would be broken for the first time in three centuries.

  Elara fed the numbers into the Engine. She set the dials for *Risk to Life*, *Economic Loss*, and *Structural Integrity*. The brass needles clicked and whirred. The fluid in the glass tubes rose and fell, seeking a level.

  Then, the shudder.

  It wasn't a mechanical failure. The Engine didn't break; it refused. The needles began to oscillate wildly, not finding a resting point. The fluid boiled. A small plume of steam hissed from the central column, and the machine fell silent. The "Equilibrium" light remained dark.

  It happened every time. The Engine could tell you if Option A was cheaper than Option B. It could tell you if Option A was faster. But it could not tell you if *Safety* was worth *Soul*. It tried to flatten the world into a single currency of utility, and when faced with things that had no common measure, it simply stopped.

  Elara turned off the main breaker. The silence in the basement was heavy. She needed to make the call by midnight. She needed to know if she could live with the remainder.

  She left the hall and walked up the hill to the small cottage where her grandmother lived. Nana Kael was peeling apples by the window, watching the sea churn.

  "The Engine stalled," Elara said, taking the seat opposite her.

  Kael didn't look up from the apple. "It always does when the choice is real."

  "It's the Rite, Nana. If we build the wall, we seal the harbor. The blessing can't happen. The fishermen say the winter catch will be cursed. They say the sea will turn against us."

  "And if you don't build the wall?"

  "Houses flood. Boats smash. People could die."

  Kael placed the peeled apple on a plate and slid it toward Elara. "You want me to tell you which one weighs more."

  "I want to know if choosing the wall makes the loss of the Rite... okay. If the lives saved cancel out the tradition broken."

  Kael's hands, knotted with arthritis, rested on the table. She looked out at the darkening water. "When your grandfather died, I sold the boat. We needed the money to keep the house. It was the rational choice. The necessary choice."

  She turned her eyes to Elara. They were milky, but sharp.

  "Did keeping the house cancel out the loss of the boat?" Kael asked. "Did it make it so the boat never mattered?"

  Elara looked down at the apple. "No."

  "No," Kael agreed. "The house is warm. The boat is gone. Both things are true. You think a hard choice is a scale, Elara. You think if one side goes down, the other side flies up and vanishes. But that's not how it works. When you choose between things that are different in kind, you don't erase the unchosen path. You carry it."

  "So the loss stays?"

  "The loss sits with you," Kael said softly. "Like a stone in your pocket. You walk with it. It reminds you that the world is wider than your ability to fix it. If you choose the wall, you save the people. That is good. But you will still mourn the Rite. And if you mourn it truly, if you feel the weight of that broken chain, then you honor it more than if you had just let the storm take the town."

  Elara walked back to the council hall as the rain began to fall. The wind was picking up, rattling the windowpanes of the Engine room.

  She didn't turn the machine back on. There was no point. The Engine was a tool for trade-offs, for commensurable things. It could balance a budget, but it could not weigh a ghost.

  She sat at the manual override. There was no calculation left to make. She knew the town needed the wall. The lives were concrete; the curse was a fear. But she also knew that the fear was rooted in love for the sea, and breaking that bond would leave a scar on Moray's End that no storm could wash away.

  She pulled the lever for the Barrier.

  The hydraulics groaned above her as the harbor gates began to close. The Rite was impossible now. The midnight tide would hit a sealed wall.

  Elara stood up and walked out into the rain. She didn't feel the clean relief of a problem solved. She felt the heavy, dull ache of a amputation. She had saved the town, but she had cut away a piece of its history to do it.

  She stood on the pier, watching the workers secure the pilings against the rising surge. A group of fishermen stood nearby, silent, holding their unlit lanterns. They didn't shout at her. They just looked at the closed gates.

  Elara reached into her coat pocket and touched the cold metal of the override key. She thought of Nana's stone.

  The storm would pass. The town would remain. But tonight, under the sound of the wind and the sealed harbor, Elara allowed herself to grieve the Rite as if it were a person. She did not try to justify it. She did not try to balance the ledger. She just let the loss sit with her, heavy and real, acknowledging that some prices are paid not in currency, but in silence.
