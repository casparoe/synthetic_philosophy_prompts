answer: |-
  ### I. The Menu of Readings: From Tautology to Structural Necessity

  The maxim "revolutions devour their children" is not a single proposition but a container for competing causal explanations. Arranged from the analytically trivial to the genuinely contested, the four distinct theses are as follows:

  **1. The Tautological Reading (Trivial)**
  *   **Mechanism:** **Definitional Fiat.** This reading posits no causal mechanism other than linguistic convention. It defines a "revolution" as a process that concludes by eliminating its initiators; therefore, if the initiators are not eliminated, the process is retroactively classified as something other than a true revolution (e.g., a reform or a coup).
  *   **Scope:** **Universal Empirical Regularity.** It applies to all historical events labeled "revolutions" by definition, rendering the claim unfalsifiable.
  *   **Meaning of "Devouring":** **Removal from Power.** This need not imply death; it denotes the cessation of political agency. The "children" are simply no longer the parents of the regime.
  *   **Status:** Trivial. It offers no explanatory power, merely a categorization rule.

  **2. The Contingency Reading (Empirically Thin)**
  *   **Mechanism:** **Agential Miscalculation.** This thesis attributes the outcome to personality clashes, tactical errors, and the specific psychological profiles of actors (e.g., Robespierre's paranoia, Danton's complacency). It denies any systemic inevitability.
  *   **Scope:** **Specific to 1789–1794.** It treats the French Terror as a unique convergence of accidents, war, and individual psychology, not a replicable model.
  *   **Meaning of "Devouring":** **Literal Execution.** It refers strictly to the physical liquidation of specific deputies (Girondins, Hébertists, Dantonists) via the guillotine.
  *   **Status:** Contested. It undermines the utility of the slogan as a general law, reducing it to a metaphor for a specific historical tragedy.

  **3. The Ideological Reading (Theoretically Robust)**
  *   **Mechanism:** **Internal Logic of Purification.** This posits that revolutionary ideology (e.g., Rousseauian virtue, the General Will) contains an inherent demand for purity. As the gap between the abstract ideal and the corrupt reality widens, the regime must eliminate the very agents who implemented the revolution because they inevitably bear the stains of the *ancien régime* or compromise.
  *   **Scope:** **Generalizable to Ideological Revolutions.** It suggests any revolution driven by totalizing moral concepts will face this dynamic.
  *   **Meaning of "Devouring":** **Symbolic Betrayal + Execution.** The "children" are devoured because they are re-categorized as traitors to the principle. The execution is secondary to the symbolic excommunication.
  *   **Status:** Genuinely Contested. It debates whether ideas have causal autonomy sufficient to drive political violence independent of social interests.

  **4. The Structural Reading (Deterministic)**
  *   **Mechanism:** **Revolutionary Sovereignty / Institutional Path-Dependence.** This argues that the seizure of sovereign power creates a "state of exception" where law is suspended to save the revolution. This institutional vacuum renders all actors vulnerable. To maintain the monopoly on violence and legitimacy, the center must continuously purge the periphery, eventually consuming its own creators.
  *   **Scope:** **Universal Empirical Regularity.** It posits a law-like behavior of revolutionary states regardless of specific ideology.
  *   **Meaning of "Devouring":** **Institutional Dismantling + Execution.** It denotes the destruction of the structures the founders built (e.g., the Committees) alongside the founders themselves.
  *   **Status:** Most Contested. It implies a metaphysical necessity, suggesting revolutions are suicide machines by structural design.

  ***

  ### II. Assessment Against Interpretive Frameworks

  The viability of these readings depends on the broader historiographical framework employed. Crucially, this assessment turns on whether the slogan requires a metaphysical commitment to a unified "Revolutionary Body."

  | Reading | Class Struggle Framework | Ideology-Driven Framework | Contingency Framework | Metaphysical Commitment ("Unified Will") |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Tautological** | **Compatible.** Can view the "devouring" as the shifting dominance of class fractions (bourgeoisie vs. sans-culottes). | **Compatible.** Treats the definition as conceptual. | **Compatible.** Accepts the label without causal weight. | **None.** It is a linguistic convention, not an ontological claim. |
  | **2. Contingency** | **Undermined.** Rejects the idea that class dynamics *necessitated* the Terror; argues specific individuals could have chosen differently. | **Undermined.** Denies that ideas have a "logic" that compels action; ideas are tools used by actors. | **Accommodates.** This is the native framework for this reading. | **Rejects.** There is no "Revolution" to devour anyone; there are only factions and individuals. |
  | **3. Ideological** | **Tension.** Marxism typically treats ideology as superstructure masking material interests. This reading grants ideology causal primacy. | **Accommodates.** (e.g., François Furet). Posits the Revolution as an idea that operates through men. | **Undermined.** Rejects accident in favor of conceptual inevitability. | **Requires.** Presupposes the Revolution has a "spirit" or "will" that seeks consistency, using humans as vessels. |
  | **4. Structural** | **Partial Accommodation.** Can be read as the state apparatus gaining autonomy from class control (Bonapartism). | **Accommodates.** (e.g., Hannah Arendt). Focuses on the nature of political power and sovereignty. | **Undermined.** Denies accident; posits institutional determinism. | **Requires.** Reifies "The Revolution" as a system with self-preservation instincts distinct from its agents. |

  **The Metaphysical Question:**
  The slogan "revolutions devour their children" personifies the Revolution as a singular agent (a parent/monster).
  *   **Class Struggle** reconstructs this without metaphysics: It is not "The Revolution" eating its children, but * Faction A* eliminating *Faction B* due to shifting material interests. The slogan is a mystification of factional warfare.
  *   **Ideology and Structural** readings accept the personification. They require the Revolution to have a telos or a systemic logic that transcends individual actors. In these frameworks, the "children" are sacrificed to the "body" of the Revolution.
  *   **Contingency** rejects the personification entirely. The slogan is merely poetic shorthand for "winners kill losers."

  ***

  ### III. Conceptual Distinction: Autocannibalism vs. Autoimmunization

  To refine the precision of the slogan, we must distinguish between two biological metaphors often conflated in revolutionary theory.

  **1. Revolutionary Autocannibalism**
  *   **Definition:** The regime consumes its own substance (agents, structures) as a source of energy or due to uncontrolled hunger.
  *   **Implication:** The destruction is **consumptive and tragic**. The "children" are nutritious or neutral; their destruction weakens the host in the long run. It implies a lack of regulation or a starvation dynamic.
  *   **Relation to Slogan:** "Devouring" linguistically aligns here. It suggests the Revolution is a monster eating its own flesh.

  **2. Revolutionary Autoimmunization**
  *   **Definition:** The regime identifies its own components (norms, personnel) as foreign pathogens and expels them to preserve the integrity of the whole.
  *   **Implication:** The destruction is **protective and purificatory**. The "children" are re-coded as "viruses." Their destruction is intended to strengthen the host's boundaries.
  *   **Relation to Slogan:** This explains the *mechanism* behind the devouring. The Revolution does not eat because it is hungry (cannibalism); it eats because it believes the child is diseased (immunization).

  **Application and Analysis:**

  *   **Which mechanism does the slogan capture?**
      The slogan "devour their children" describes the *phenomenon* of **Autocannibalism** (the act of eating one's own). However, most theoretical defenses of the slogan (specifically the Ideological and Structural readings) rely on the logic of **Autoimmunization**. They argue the Revolution *must* purge to survive. If the slogan implies mere mindless consumption (Cannibalism), it supports the Contingency or Tragic readings. If it implies purgative necessity (Immunization), it supports the Structural/Ideological readings.

  *   **Generated vs. Revealed Enemies:**
      *   **Autoimmunization (Revealed):** This view suggests the enemies were present but concealed from the outset. The "children" were always counter-revolutionary pathogens; the Revolution merely developed the antibodies (Terror) to detect them. This aligns with the **Structural** reading where the system identifies threats objectively.
      *   **Autoimmunization (Generated):** This view suggests the Revolution *creates* the pathogens by raising the standard of purity. The "children" were loyal until the definition of loyalty shifted. The immune system attacks healthy tissue because it has become hypersensitive. This aligns with the **Ideological** reading (the logic of virtue becomes totalitarian).
      *   **Autocannibalism:** This view suggests the distinction is irrelevant. The system consumes itself regardless of the "health" of the tissue. This aligns with the **Tautological** or **Tragic** readings.

  **Conclusion on the Distinction:**
  The slogan survives conceptual scrutiny only if interpreted as **Revolutionary Autoimmunization (Generated)**.
  If the enemies were *revealed* (always present), the Revolution is not devouring its *children*; it is executing *spies*. The slogan loses its tragic force.
  If the process is mere *cannibalism* (mindless consumption), it offers no explanatory mechanism, only a description of waste.
  Therefore, the slogan's theoretical weight rests on the claim that revolutions generate internal enemies through the very process of immunization (purification). The "children" are devoured not because they betrayed the Revolution, but because the Revolution's definition of fidelity became incompatible with human agency. This validates the **Ideological Reading** as the most precise: the "devouring" is the cost of maintaining an abstract purity that no concrete agent can embody.
