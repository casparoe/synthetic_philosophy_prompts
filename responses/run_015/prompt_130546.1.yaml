answer: |-
  This is a sophisticated phenomenological observation that cuts to the heart of contemporary debates in moral psychology, action theory, and the philosophy of practical identity. You are correct that the standard vocabulary (adaptive preference, rationalization, regret) fails to capture the specific *modal* shift you are describing: the movement of the rejected option from the category of "sacrificed good" to "constitutive impossibility."

  There is no single, canonical term in the literature that isolates this exact configuration. However, it sits at the intersection of three established concepts: **Harry Frankfurt's "volitional necessities,"** **Ruth Chang's "normative transformation,"** and **Charles Taylor's "strong evaluation."**

  For the purposes of your dissertation, I recommend carving this out as **"Retrospective Volitional Necessity"** (RVN) or, more descriptively, **"Constitutive Exclusion."**

  Below is the precise conceptual carving you requested, distinguishing it from neighboring phenomena, establishing its normative status, and defining its boundary conditions.

  ---

  ### 1. Conceptual Definition: Constitutive Exclusion

  **Definition:** Constitutive Exclusion is a post-decisionary phenomenological shift wherein an agent re-describes a previously live, valuable, and incompatible option not as *less preferred* or *less valuable*, but as *volitionally impossible* for the self they have become.

  **The Mechanism:**
  1.  **Pre-Choice:** The agent faces a hard choice (incommensurable values). Both options $A$ and $B$ are recognized as live possibilities with genuine value.
  2.  **Choice:** The agent commits to $A$.
  3.  **Post-Choice Re-description:** The agent does not merely affirm $A$. They reconstruct the narrative of the choice such that $B$ is now understood as incompatible with the *constitutive commitments* required to sustain $A$ (or the identity formed by choosing $A$).
  4.  **Result:** The loss of $B$ is no longer experienced as a *tragic sacrifice* (where value is lost) but as a *boundary condition of integrity* (where $B$ was never a genuine possibility for *this* self).

  **The Modal Shift:** The key feature is the shift from **axiological comparison** ("$A$ is better than $B$") to **ontological exclusion** ("$B$ is not a world I can inhabit").

  ---

  ### 2. Differentiation from Neighboring Concepts

  To secure this carving, we must distinguish it from the three phenomena you identified.

  #### A. vs. Adaptive Preference (Elster/Nussbaum)
  *   **Adaptive Preference:** The agent changes their *desire* to match the *feasibility* of the outcome to reduce cognitive dissonance. ("I didn't want the artistic life anyway; it's too risky.") The value of the object is downgraded.
  *   **Constitutive Exclusion:** The value of the object is *preserved*, but its *fit* with the agent is denied. ("The artistic life is valuable, but it requires a kind of selfishness I cannot embody.")
  *   **The Test:** In adaptive preference, the agent claims the forgone good is *worthless*. In Constitutive Exclusion, the agent claims the forgone good is *incompatible*.

  #### B. vs. Post-Hoc Rationalization (Elster/Standard Psychology)
  *   **Rationalization:** A causal process of generating false or weak reasons to justify an action driven by unconscious motives. It is typically epistemically defective.
  *   **Constitutive Exclusion:** This is a *normative* process of identity stabilization. The reasons generated ("I cannot betray my commitment to family") are often genuinely held and defensible within the agent's normative framework. It is not necessarily a distortion of truth, but a *construction of practical truth*.
  *   **The Test:** Rationalization collapses under scrutiny of the agent's actual motives. Constitutive Exclusion holds up under scrutiny because it appeals to the *conditions of the agent's integrity*, which are self-validating within a practical identity.

  #### C. vs. Standard Hard-Choice Resolution (Chang/Williams)
  *   **Standard Resolution:** The agent acknowledges that something of value was lost. There is "agent-regret." The unchosen path remains a "road not taken" that haunts the choice slightly.
  *   **Constitutive Exclusion:** The unchosen path is expelled from the space of live possibilities. The "haunting" is silenced by the claim that walking that path would have resulted in *self-betrayal*, not just a different life.
  *   **The Test:** Ask the agent: "Do you wish things could have been otherwise?" In Standard Resolution, the answer is "Yes, but..." In Constitutive Exclusion, the answer is "No, because that wouldn't have been *me*."

  ---

  ### 3. Normative Status: Distortion or Integrity?

  You ask whether this should be treated as a cognitive distortion, legitimate identity formation, or a third category. I argue for the **third category: A Necessary Fiction of Diachronic Agency.**

  It is not merely a distortion, because practical identity *requires* exclusion. To be a coherent self over time (diachronic agency), one cannot treat all past possibilities as equally live. As **Christine Korsgaard** argues in *The Sources of Normativity*, practical identity is constituted by the principles we cannot violate without losing our integrity.

  However, it is not purely "objective" truth, because the incompatibility is often *created* by the choice itself, not discovered. Before the choice, the agent *could* have inhabited the other path. By claiming they *could not*, they are rewriting the modal history of their agency.

  **Verdict:** It is a **constitutive narrative strategy**. It is functionally necessary for mental health and agency stability (preventing paralyzing regret), but it risks becoming pathological if it denies empirical reality (see Boundary Conditions).

  ---

  ### 4. Boundary Conditions and Pathological Edges

  To prevent this concept from becoming a "catch-all" for any post-decision story, you must define its limits. Constitutive Exclusion becomes **Delusional Identity Protection** (a distortion) when:

  1.  **Empirical Denial:** The agent claims the rejected path was impossible, when there is clear empirical evidence they possessed the capacity to inhabit it without moral corruption. (e.g., "I couldn't have been a parent and a poet" when many others demonstrably are).
  2.  **Immunization to Critique:** The agent treats the incompatibility claim as a brute fact that cannot be discussed, rather than a normative commitment that can be weighed.
  3.  **Temporal Inconsistency:** The agent's narrative of "who they are" shifts radically with every minor decision, using Constitutive Exclusion to avoid accountability for fickleness.

  **The "Healthy" Edge:** The claim is defensible within the agent's web of commitments (coherent with their other values) and allows for empathy toward those who chose differently (acknowledging $B$ was possible for *them*, just not *me*).

  **The "Pathological" Edge:** The claim isolates the agent, denies obvious human capacities, or is used to mask fear rather than uphold integrity.

  ---

  ### 5. Recommended Vocabulary for the Dissertation

  Since no single term exists, I recommend you introduce **"Constitutive Exclusion"** as your primary term, while grounding it in the existing literature to show lineage.

  *   **Primary Term:** **Constitutive Exclusion** (captures the mechanism: excluding the option based on the constitution of the self).
  *   **Secondary Descriptor:** **Retrospective Volitional Necessity** (links it to Frankfurt's *volitional necessities* but highlights the *retrospective* temporal shift).
  *   **Phenomenological Label:** **The Closure of Live Possibilities.**

  **Suggested Phrasing for your Text:**
  > "While Ruth Chang describes the resolution of hard choices as a 'normative transformation' of the chosen option, I identify a complementary phenomenon regarding the rejected option: **Constitutive Exclusion**. This is not the downgrading of value found in adaptive preference, nor the acknowledgment of loss found in tragic choice. Rather, it is the retrospective re-categorization of the forgone path from a 'sacrificed good' to a 'volitional impossibility,' thereby stabilizing the agent's practical identity by expelling the rejected branch from the space of live possibilities."

  ### 6. Key Philosophical Anchors

  To bolster this carving, cite these specific intersections:

  1.  **Harry Frankfurt (*The Importance of What We Care About*):** Use his concept of **Volitional Necessities** ("I cannot do X and remain myself"). Your contribution is showing how these are often *retrospectively applied* to resolve past hard choices.
  2.  **Charles Taylor (*Sources of the Self*):** Use **Strong Evaluation**. The agent evaluates the rejected option not by consequence, but by the *quality of the self* that would choose it.
  3.  **Ruth Chang (*Hard Choices*):** Acknowledge her work on "creating reasons," but distinguish your point: she focuses on making the chosen option *rationally dominant*; you focus on making the rejected option *identity-incompatible*.
  4.  **Jon Elster (*Sour Grapes*):** Use him as the contrast case for Adaptive Preference to show you are not describing mere preference change.

  ### Summary
  You have identified a genuine gap in the phenomenology of decision. It is not merely rationalization; it is the work of **narrative identity** solidifying **practical identity**. By naming it **Constitutive Exclusion**, you provide the precise vocabulary needed to distinguish the *preservation of integrity* from the *denial of loss*.
