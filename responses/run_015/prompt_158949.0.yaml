answer: |-
  **To:** Grants Committee
  **From:** [Your Name]
  **Date:** October 24
  **Subject:** Decision Rule for Cross-Species Weighting – Round 4

  Team,

  We need to finalize our weighting framework before Thursday. The consultants' table (Shrimp=1, Pig=10^4) is a useful starting heuristic, but treating it as a deterministic calculator creates three specific risks: moral fanaticism, metric distortion, and donor existential threat.

  I propose we **adopt the table only within bounds as a tiebreaker**, rather than as the primary allocation engine. Below is the reasoning, addressing the specific friction points raised in our last session.

  **1. Units: Animal-Years vs. Headcount**
  The concern that the table compares the wrong units is correct. Welfare is experienced over time. A shrimp's life is weeks; a pig's is years. If we weight by headcount alone, we implicitly value a week of shrimp life equal to a year of pig life, provided the moral weight per moment is equivalent. Shifting our denominator to *animal-years affected* is a correction, not a bug. It naturally dampens the shrimp advantage without discarding it. However, we must also weight for *intensity*. A short life in extreme agony may outweigh a long life in mild discomfort. For this round, we will estimate "welfare-adjusted life years" (WALYs) qualitatively. Application A (shrimp stunners) affects many heads but few years per head; Application B (broilers) affects fewer heads but more years. This narrows the gap between A and B significantly compared to the raw table.

  **2. Uncertainty and Fanaticism**
  This is the critical failure mode. The consultant's weight for octopus is flagged as "basically made up," and the shrimp weight relies on disputed sentience probabilities. When moral weights are uncertain over orders of magnitude, multiplying point estimates invites Pascal's mugging. If there is a 10% chance shrimp are morally negligible, the expected value of Application A drops precipitously.

  To survive this, we will apply an **uncertainty discount**. We will treat the consultant weights as confidence intervals, not scalars. Where evidence is thin (octopus, shrimp sentience), we discount the expected value by the degree of uncertainty. This prevents a high-variance bet on crustaceans from crowding out robust interventions for vertebrates. It acknowledges the "affective repertoire" argument: if we are unsure whether neuron count correlates with depth of experience, we cannot bet the budget on it. This approach respects the board member's skepticism by admitting that "capacity for states" is currently unmeasurable, so we must hedge rather than maximize.

  **3. The Human Reductio**
  We must be honest internally: yes, this methodology implies some humans (infants, severely cognitively impaired) have lower moral weight than some adult pigs or octopuses. This is philosophically consistent with a sentience-based view but strategically fatal if published. Our donor will bail if we appear to price human life. This is not just trustee squeamishness; it is a constraint on our ability to do good long-term. Therefore, we will **not** publish the weighting table. The public methodology note will discuss "severity of suffering" and "capacity for suffering" without offering cross-species exchange rates or comparing animals to humans. We protect the mission by keeping the calculus internal.

  **Recommendation**
  Do not use the weights to calculate dollar-per-WALY rankings. Instead, use them as a **tiebreaker within a tractability framework**.

  1.  **Filter:** Is the intervention tractable? Does it have flow-through potential?
  2.  **Weight:** Among tractable options, use the consultant weights (discounted for uncertainty) to break ties.
  3.  **Diversify:** Do not allocate more than 50% of the round to high-uncertainty species categories (shrimp/octopus) regardless of the calculated upside.

  **Application to Current Round**
  *   **Application A (Shrimp):** High numbers, high uncertainty, short lifespan. The uncertainty discount and WALY correction reduce its priority.
  *   **Application B (Broilers):** Robust evidence, significant lifespan, high flow-through. This becomes the anchor grant.
  *   **Application C (Octopus):** High variance. Fund only as a small prototype bet, not based on the 10^2 weight.

  **The Losing Side**
  The strongest argument against this approach is that it leaves potential massive suffering on the table. If shrimp sentience is real and the weights are accurate, restricting allocation to 50% is morally indefensible—it privileges our comfort over millions of lives. We are choosing institutional stability and epistemic humility over maximizing expected value under high uncertainty. I believe this is the only sustainable path for a small funder, but we should record our dissent on this point.

  Please review. I'd like to vote on this framework tomorrow morning.
