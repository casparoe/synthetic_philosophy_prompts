prompt: |-
  I was having a late-night arguement with a friend about AI moral status and we realized we don't even agree on what the branching questions should be. I want a decision tree or taxonomy that sorts actual positions on which computations matter morally — not just "functionalist vs biological naturalist" but the real logical space. Start with whether substrate-independent functional organization is sufficient for moral patienthood, or if the implementation substrate has to meet some causal or structural condition. Then branch on whether the computation needs causal embedding in an environment (not a sandboxed loop), what happens to moral weight under duplication or fission of the computation, and whether there's a sharp complexity threshold or just a gradient. Use concrete cases as nodes: for instance, a perfect digital twin of a human running offline with no sensors; a biological brain emulated neuron-by-neuron but with no body; two identical copies running in parallel; a spreadsheet that optimizes for suffering-reduction but has no internal model of itself. Each leaf should name the position if it has one, or mark it "unnamed," and include one sentence on its most awkward commitment — like being forced to say the spreadsheet suffers, or that the emulated brain is a zombie with no interests. The tree should be built from the questions first, then map positions onto the answer-combinations, and flag any empty cells with a quick diagnosis (incoherent? repugnant? just nobody's bothered?). Also flag pairs your tree can't seperate.

  Don't ask me to read papers or give citations — I want this for my own notes and a model without web access should be able to do it from first principles. If my framing is confused — maybe computation and sentience aren't the right axes — or if the tree forces fake distinctions, say so plainly instead of being polite. Be explicit about where you're speculating, and push back if anything I'm asking for rests on a mistake I haven't noticed.
