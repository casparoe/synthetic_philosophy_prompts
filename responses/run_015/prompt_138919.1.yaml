answer: |-
  This is a precise and philosophically rich description. You are describing a specific structural feature of a value function, not just a vague intuition. To answer your opening question: **This is one thing.** The two cases (your friend and the committee) are instantiations of the same underlying axiological structure, and the "chop-it-up" problem is the standard stress-test for that structure's coherence.

  Here is the carving you asked for: the name, the distinctions, the aggregation objection, and the verdict on coherence.

  ### 1. The Name: Asymmetric Local Lexicality

  There is no single common noun for this, but in value theory and population ethics, this structure is best described as **Asymmetric Local Lexicality** (sometimes discussed under **Threshold Lexicality** or **Discontinuous Value Functions**).

  *   **Lexicality:** Means one value trumps another regardless of quantity (A > any amount of B).
  *   **Local:** Means this trumping only happens in a specific region of the scale (severe pain), not across the whole scale (mild pain still trades against mild pleasure).
  *   **Asymmetric:** Means the lexical barrier only works in one direction (severe pain blocks mild pleasure; severe pleasure does not block mild pain).

  Your friend and your committee are both operating with a **discontinuous hedonic utility function**. In the "mild" region, the function is continuous and linear (or curved); in the "severe" region, the function becomes asymptotic relative to the mild region. The "bridge is out" is a perfect description of a discontinuity in the exchange rate between two zones of the same scale.

  ### 2. Distinguishing from Nearby Concepts

  You were right to reject the standard labels. Here is precisely where they diverge from your shape:

  **vs. Negative Utilitarianism (NU)**
  *   **NU:** Suffering is the *only* thing that matters (or matters infinitely more). Pleasure has zero or negligible weight.
  *   **Your Shape:** Pleasure *does* have weight. It trades against mild pain. It only loses weight when pain crosses a specific threshold. NU is a global claim; your shape is a local claim.

  **vs. Standard Lexicality (e.g., Rawls, Mill)**
  *   **Standard:** Usually qualitative. "Liberty trumps Welfare" or "Higher Faculties trump Lower Faculties." It separates *kinds* of goods.
  *   **Your Shape:** Quantitative but non-linear. It is the *same kind* of good (pain/pleasure), but intensity changes the *category of exchange*. This is rarer in literature because it violates the standard assumption that intensity is a scalar magnitude that aggregates linearly.

  **vs. Incommensurability**
  *   **Incommensurability:** Implies no rational comparison is possible ("It's not better, not worse, not equal").
  *   **Your Shape:** Comparisons are fully possible *within* the zones. You can say Day A (severe) is worse than Day B (severe). You can say Hour C (mild pain) is worth Hour D (mild pleasure). The incommensurability is only *between* the zones. This is sometimes called **"Partial Incommensurability"** or **"Structured Incomparability."**

  **vs. Threshold Deontology**
  *   **Threshold Deontology:** "Maximize good until a rights violation occurs, then stop."
  *   **Your Shape:** This is the closest normative cousin. However, Threshold Deontology usually relies on *rights* as the threshold. Your case relies on *phenomenological intensity* (suffering severity) as the threshold. It is effectively **Threshold Consequentialism** where the threshold is defined by the quality of experience rather than a deontological constraint.

  ### 3. The "Chop-It-Up" Problem (The Aggregation Objection)

  This is the strongest objection to the coherence of your shape. It is known in the literature as the **Continuum Argument** or the **Sorites of Value** (heavily discussed by Derek Parfit in *Reasons and Persons* regarding the Repugnant Conclusion).

  **The Objection:**
  If severe pain is just a sum of temporal parts, and each part is slightly less severe than the whole, you can construct a chain:
  1.  1 hour of Agony is worse than 1 hour of Severe Pain.
  2.  1 hour of Severe Pain is worse than 1 hour of Moderate Pain.
  3.  ...
  4.  1 hour of Moderate Pain is compensable by Mild Pleasure.

  If the scale is continuous, there must be a point where a "slice" of the agony becomes small enough to be traded. If you can trade the slices, you can trade the sum. Therefore, the lexical barrier collapses.

  **The Defense (How to save the shape):**
  To maintain the coherence of Asymmetric Local Lexicality, you must reject the premise that **Value is Purely Summative.** You have to argue for one of two positions:

  1.  **Phenomenological Holism:** Severe pain is not just "more" pain; it is a *different kind of experience*. Your friend's quote ("becoming a place she lives in") is the key. Mild pain is a sensation *within* a life; severe pain is a colonization *of* the life. It destroys the subject's ability to experience the compensating pleasures *as* compensation. If the pain consumes the cognitive machinery required to register the pleasure, the trade is logically impossible, not just ethically forbidden.
  2.  **Non-Linearity of Time:** An hour of agony is not 60 minutes of moderate pain. The disvalue of pain scales exponentially with intensity, not linearly. If the disvalue function is $I^2$ or $I^{10}$ (where $I$ is intensity), then no amount of mild pleasure (which scales linearly) can mathematically catch up to the spike in disvalue at high intensity.

  **Is this a real objection?**
  Yes. If you hold that pain is *only* a sensory magnitude that aggregates over time, your shape is incoherent. If you hold that pain is a *state of being* that alters the subject's capacity to value, your shape is coherent. The "chop-it-up" problem only works if you assume the "mild" and "severe" pains are fundamentally the same stuff, just different amounts. Your friend's description suggests they are not the same stuff.

  ### 4. Verdict on Coherence

  The structure is **pragmatically coherent but metaphysically costly.**

  **Why it works:**
  It solves the **"Sadistic Conclusion"** problem in population ethics. Standard utilitarianism implies that if you have enough people with mild headaches, you can justify torturing one person to relieve them. Your committee's intuition (and your friend's) rejects this. Asymmetric Local Lexicality protects the individual from being sacrificed to the aggregation of trivialities, which aligns with most robust human moral intuitions.

  **Where it breaks (The Fuzzy Line):**
  You noted the line is fuzzy (a Sorites problem). This is the weak point.
  *   If the threshold is at "7/10 pain," is 6.99 compensable?
  *   If the rule is lexical, a tiny shift in severity causes a massive shift in moral permissibility.
  *   **Resolution:** Most philosophers who hold this view treat the threshold not as a sharp line but as a **zone of indeterminacy**. In the zone, the lexical rule applies with probability or weight, rather than absolutely. However, this weakens the "lexical" claim back toward a very steep slope.

  ### Summary Definition

  If you need a term to use in the wild that carries this precise weight, I recommend:

  > **Asymmetric Threshold Lexicality:** A value structure wherein low-intensity goods and bads are commensurable and aggregable, but high-intensity suffering enters a lexical region where it cannot be compensated by any quantity of low-intensity goods, due to a discontinuity in the phenomenological or moral weight of severe experience.

  **Is it one thing?** Yes. It is a single claim about the **non-linearity of disvalue**.
  **Is it coherent?** Only if you accept that severe suffering changes the *nature* of the experience (holism) rather than just the *amount* (summation). If pain is just "more neurons firing," the view collapses. If pain is "the destruction of the self's capacity to enjoy," the view holds.

  Your friend's description ("a place she lives in") suggests she has already intuitively grasped the **Phenomenological Holism** defense. She isn't doing math; she's reporting that the currency of "pleasure" ceases to be legal tender in the economy of "agony."
