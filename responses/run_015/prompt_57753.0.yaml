answer: |-
  # JOINT STATEMENT ON THE STRUCTURE OF COGNITIVE EVOLUTION
  **Adversarial Collaboration Outcome | Interdisciplinary Seminar on Philosophy of Biology and Comparative Cognition**

  ### 1. AGREED CLAIMS

  1.  **Continuity of Phylogeny:** We agree that biological evolution is a continuous process that admits of no sharp boundaries in lineage. There is no single generation in which a non-Popperian parent produces a Popperian offspring, nor a non-Gregorian parent that produces a Gregorian offspring. Any discontinuity in cognitive architecture must be compatible with gradualistic evolutionary history.
  2.  **Utility of the Ladder:** We agree that the fourfold classification (Darwinian, Skinnerian, Popperian, Gregorian) possesses significant descriptive and pedagogical utility. It successfully organizes a vast range of behavioral data and generates productive research questions regarding the limits of learning, representation, and cultural transmission.
  3.  **Existence of Hard Intermediate Cases:** We agree that the empirical landscape contains hard intermediate cases that resist easy classification. Specifically, we acknowledge the evidentiary weight of:
      *   **Tool Traditions:** New Caledonian crow tool manufacture and chimpanzee termite fishing, which show stability over time but remain ambiguous regarding cumulative cultural ratcheting.
      *   **Symbol-System Training:** Great ape language projects (e.g., lexigram use) which demonstrate referential capacity but lack the open-ended generativity of human syntax.
      *   **Solitary Invertebrate Problem Solving:** Octopuses and jumping spiders solving novel detour and jar-opening problems without social learning or apparent internal trial-and-error.
      *   **Cache Recovery:** Corvids planning for future recovery of hidden food without any apparent reliance on shared symbolic scaffolding.
  4.  **Internal Modelling:** We agree that some form of internal modelling of the consequences of behaviour occurs well below the rung where Camp A traditionally locates the Popperian transition. Simple organisms exhibit anticipatory regulation that mimics aspects of "look-ahead" processing.

  ### 2. RESIDUAL DISAGREEMENTS

  | Issue | Neutral Formulation | Camp A Formulation (Discontinuist) | Camp B Formulation (Continuist) |
  | :--- | :--- | :--- | :--- |
  | **1. The Nature of Transitions** | Do transitions between rungs represent differences in computational kind or degree? | Transitions involve emergent control architectures where the causal powers of the higher rung are not reducible to the parameters of the lower rung. | Transitions are quantitative accumulations of memory, search depth, or trial numbers that cross a pragmatic threshold of description. |
  | **2. Explanatory Sufficiency** | Can behaviour at a higher rung be fully explained by mechanisms from the rung below? | Lower-level explanations fail to capture the specific causal power of the higher architecture; they are descriptively adequate but causally incomplete. | Lower-level explanations remain causally sufficient if parameters are scaled appropriately; invoking a new "kind" adds no explanatory leverage. |
  | **3. Ontological Status** | Does the classification reflect natural kinds or descriptive conventions? | The classification tracks ontological shifts in cognitive control systems present in the world. | The classification tracks pragmatic shifts in explanatory convenience adopted by the observer. |

  *Note on Characterization: Camp B does not deny the existence of the behaviours Camp A cites (e.g., planning, symbol use); they deny that these behaviours necessitate a new ontological category. Camp A does not posit evolutionary saltations (magic jumps); they posit that gradual changes in components can trigger phase transitions in system architecture.*

  ### 3. THE CRUXES

  We have identified four candidate sub-questions. Upon analysis, **(a)** (Mechanism vs. Function) and **(b)** (Metaphor vs. Mechanism regarding "hypotheses dying in our stead") are determined to be the same question in different vocabulary. Both ask whether the "Popperian" capacity requires a novel computational primitive or merely the scaling of associative learning.

  The remaining cruxes are ranked below by the amount of theoretical movement their resolution would produce.

  **Crux 1: Architectural Novelty (Combined a & b)**
  *   **Question:** Is the capacity for "trial and error in the head" a novel computational resource (mechanism) or a functional description of scaled-up associative learning (function/metaphor)?
  *   **Concrete Case:** **Deep Reinforcement Learning Agents.** Comparison of Model-Free agents (scaled for massive trials/memory) vs. Model-Based agents (with internal world models for simulation).
  *   **Predictions:**
      *   **Camp A:** Model-Based agents will demonstrate a phase shift in sample efficiency and generalization to novel tasks that cannot be matched by Model-Free agents even with orders-of-magnitude increases in training trials or memory size.
      *   **Camp B:** Model-Based performance is asymptotically reachable by Model-Free agents given sufficient scaling of parameters; the "internal model" is a convenient compression of statistical regularities, not a distinct mechanism.

  **Crux 2: Scaffolding and Explanation (c)**
  *   **Question:** Does external symbolic scaffolding (Gregorian) change what counts as an explanation of a given behaviour, or merely widen the range of an explanatory schema already in place?
  *   **Concrete Case:** **Human Numerical Cognition.** Comparison of exact arithmetic performance in adults with symbolic notation vs. adults restricted to non-symbolic approximation tasks (or indigenous groups without number words).
  *   **Predictions:**
      *   **Camp A:** Without symbolic scaffolding, exact arithmetic is impossible; the scaffolding constitutes a part of the cognitive mechanism itself, changing the kind of processing.
      *   **Camp B:** Without symbolic scaffolding, exact arithmetic is merely computationally expensive and error-prone; the underlying capacity is identical, merely amplified by external tools.

  **Crux 3: Empirical vs. Taxonomic (d)**
  *   **Question:** Is discreteness in kind an empirical question at all, or a question about the purposes a taxonomy serves?
  *   **Concrete Case:** **Cognitive Cladistics.** Attempting to map cognitive traits onto phylogenetic trees to see if "Popperian" traits cluster monophyletically or appear as convergent polyphyletic adaptations.
  *   **Predictions:**
      *   **Camp A:** Cognitive cladistics will reveal monophyletic groups defined by architectural constraints, suggesting natural kinds.
      *   **Camp B:** Cognitive traits will always appear as polyphyletic convergences defined by ecological niche, suggesting the "kinds" are artifacts of ecological pressure, not lineage.

  ### 4. RESOLUTION OF THE RUNG-COLLAPSE ARGUMENT

  The seminar has circled extensively around Camp B's "rung-collapse argument": the claim that any rung can be reduced to the rung below plus a quantitative increase (memory, search, trials). Camp A replies that at some rung, the quantitative increase required ceases to be merely quantitative.

  **Where the Argument Succeeds:**
  Both sides agree the rung-collapse argument succeeds in local domains and lower transitions. For example, complex Skinnerian conditioning can often mimic simple planning if the organism has sufficient memory of past reinforcements and a rich enough stimulus environment. In these cases, positing a "Popperian" homunculus is unnecessary.

  **Where the Argument Fails:**
  Camp A maintains the argument fails at the transition to systematic, multi-step planning in novel environments where prior reinforcement history is zero. Camp B maintains it never fails in principle, only in practice (due to computational cost).

  **The Core Disagreement:**
  We conclude that the disagreement concerning the rung-collapse argument does not primarily concern the **comparative facts** (both sides agree on the behavioural data regarding the intermediate cases listed in Section 1). Rather, the disagreement concerns the **threshold at which an explanation counts as complete**.
  *   For Camp A, an explanation is incomplete if it requires biologically implausible parameter scaling (e.g., requiring a million years of trials to learn what was learned in one).
  *   For Camp B, an explanation is complete as long as the mechanism is theoretically sufficient, regardless of the efficiency cost.

  ### 5. CLOSING: VERBAL VS. SUBSTANTIVE

  We conclude that a portion of this dispute is **verbal**, specifically regarding the definition of "Kind" and "Discontinuity."
  *   If "Kind" means "phylogenetic boundary," both sides agree there are no discontinuities (Claim 1).
  *   If "Kind" means "computational architecture," the dispute is substantive.

  **Remaining Substantive Disagreement:**
  Once the verbal confusion regarding phylogeny is set aside, the camps are left disagreeing about **the world** (specifically, the computational architecture of minds), not merely the **job descriptions of a classification scheme**.
  *   **Camp A** asserts that the world contains systems with control loops that are causally distinct from associative learners, regardless of how we label them.
  *   **Camp B** asserts that the world contains only associative learners of varying complexity, and the "distinct control loops" are patterns recognized by observers, not mechanisms implemented by organisms.

  This distinction is empirically tractable via the Cruxes listed above. We commit to treating the classification not as a settled truth, but as a hypothesis about cognitive architecture to be tested against the predictions recorded in Section 3.
