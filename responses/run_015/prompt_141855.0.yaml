answer: |-
  **A Note on Method:** A taxonomy implies clean boundaries where there are often blurred ones. This map treats positions as mutually exclusive for clarity, though in practice they overlap. Use it to locate disagreements, not to settle them.

  ### THE DECISION TREE
  *Start: You have a score $S$, two groups $A$ & $B$, different base rates, and an impossibility result (you cannot have Calibration + Equalized Error Rates simultaneously).*

  1.  **Instrumental Sufficiency:** Is the signal-to-noise ratio of the score sufficient to support *any* high-stakes decision, regardless of fairness?
      *   **NO** $\rightarrow$ **Leaf 1: Refusal (Instrumental)**
      *   **YES** $\rightarrow$ Go to 2.
  2.  **Construct Validity:** Does the recorded outcome (e.g., "rearrest") accurately reflect the moral target (e.g., "reoffending")?
      *   **NO** $\rightarrow$ **Leaf 2: Refusal (Construct)**
      *   **YES** $\rightarrow$ Go to 3.
  3.  **Mechanism Fit:** Is a predictive score the right mechanism for this allocation, or should we change the allocation rule (e.g., universal provision)?
      *   **CHANGE RULE** $\rightarrow$ **Leaf 3: Systemic Intervention**
      *   **KEEP SCORE** $\rightarrow$ Go to 4.
  4.  **Criteria Validity:** Do you accept the standard fairness criteria (Calibration, Error Balance) as the correct constraints?
      *   **NO** $\rightarrow$ **Leaf 4: Meta-Position (Reductio)**
      *   **YES** $\rightarrow$ Go to 5.
  5.  **Group Awareness:** Is it permissible to use group membership to adjust thresholds or weights?
      *   **NO (Blind)** $\rightarrow$ **Leaf 5: Fairness through Blindness**
      *   **YES (Aware)** $\rightarrow$ Go to 6.
  6.  **Determinism:** Must the decision follow the score deterministically?
      *   **NO (Stochastic)** $\rightarrow$ **Leaf 6: Randomization / Lottery**
      *   **YES (Deterministic)** $\rightarrow$ Go to 7.
  7.  **Priority:** Do we prioritize what the score *means* (Calibration) or how errors *land* (Error Balance)?
      *   **MEANING** $\rightarrow$ **Leaf 7: Calibrated Score**
      *   **ERRORS** $\rightarrow$ **Leaf 8: Equalized Errors**
      *   **COST** $\rightarrow$ **Leaf 9: Cost-Sensitive Utilitarian**
      *   **HUMAN** $\rightarrow$ **Leaf 10: Human Discretion (Score as Advice)**

  ---

  ### THE LEAVES: COSTS, EVIDENCE, AND THE SCRUTINY CASE
  *Case: The score determines scrutiny (audits, police stops, medical follow-up), not benefit.*

  1.  **Refusal (Instrumental):** *Swallow:* We cannot decide yet. *Evidence:* Error budget dominated by measurement noise, not sample variance. *Scrutiny:* **Do not scrutinize.** Noise makes targeted scrutiny indistinguishable from harassment.
  2.  **Refusal (Construct):** *Swallow:* We are measuring the wrong thing. *Evidence:* Strong correlation between score and proxy (arrest), weak correlation with target (guilt). *Scrutiny:* **Do not scrutinize.** You are optimizing for biased enforcement data.
  3.  **Systemic Intervention:** *Swallow:* Efficiency loss to gain equity. *Evidence:* Allocation structure creates the disparity, not the model. *Scrutiny:* **Universal scrutiny** or **Need-based only.** Remove the score from the loop.
  4.  **Meta-Position (Reductio):** *Swallow:* The math proves the criteria are incompatible ideals. *Evidence:* Proof that no distribution satisfies the constraints. *Scrutiny:* **Irrelevant.** The framework for evaluating scrutiny is broken.
  5.  **Fairness through Blindness:** *Swallow:* Unequal error rates across groups. *Evidence:* Legal/ethical mandate for colorblindness. *Scrutiny:* **Blind scrutiny.** Groups with higher base rates get scrutinized more often; this is accepted as neutral.
  6.  **Randomization / Lottery:** *Swallow:* Loss of predictive efficiency. *Evidence:* Moral requirement for equal chance among similar scores. *Scrutiny:* **Lottery for scrutiny.** Reduces disparate impact, but feels arbitrary to those stopped.
  7.  **Calibrated Score:** *Swallow:* Unequal false positive/negative rates. *Evidence:* Decision-makers need $P(Y|S)$ to be stable across groups. *Scrutiny:* **Calibrated scrutiny.** A high score means the same risk in both groups, but Group B gets stopped more often.
  8.  **Equalized Errors:** *Swallow:* The score means different things in different groups. *Evidence:* Moral requirement that error burdens are shared equally. *Scrutiny:* **Equal stop rates.** A score of 0.8 in Group A implies higher risk than 0.8 in Group B.
  9.  **Cost-Sensitive Utilitarian:** *Swallow:* Explicitly trade off harms (e.g., jail vs. crime). *Evidence:* Defined cost function for false positives/negatives. *Scrutiny:* **Minimize total harm.** Scrutiny allocated where marginal cost of error is lowest, regardless of group.
  10. **Human Discretion:** *Swallow:* Inconsistency and hidden bias. *Evidence:* Models fail to capture context. *Scrutiny:* **Human-led scrutiny.** Score flags cases, officer decides. Bias moves from algorithm to officer.

  ---

  ### MAP ANNOTATIONS

  **Empty Regions (Logically possible but undefended):**
  *   **Group-Aware Randomization:** Using lotteries with different weights for different groups. *Status:* **Unattractive.** Looks like explicit discrimination even if justified by error balance.
  *   **Blindness + Equalized Errors:** Demanding equal error rates while forbidding group awareness. *Status:* **Incoherent** (given different base rates). You cannot have this without breaking Calibration.
  *   **Dynamic Thresholds:** Thresholds that change based on queue length rather than risk. *Status:* **Unexplored.** Common in operations research, rare in fairness literature.

  **Indistinguishable Leaves (Actionally similar, theoretically distinct):**
  *   **Refusal (Instrumental) vs. Refusal (Construct):** Both say "Don't deploy." *Distinction:* One blames the *instrument* (noise), the other blames the *definition* (bias). Remedy differs (better data vs. new target).
  *   **Systemic Intervention vs. Meta-Position:** Both say "Stop using the model." *Distinction:* One proposes a *better system* (universal care), the other proposes *no system* (criteria are nonsense).

  **Verdict on "Instrumental Sufficiency" (Your Hobby Horse):**
  *   **It is a genuine extra leaf.** It does not collapse into Construct Validity.
  *   **Why:** Construct Validity is about **Bias** (are we measuring the right thing?). Instrumental Sufficiency is about **Variance/Noise** (is the measurement precise enough?). In spectroscopy, you can measure the right peak (valid) but with too much noise to quantify (insufficient).
  *   **Placement:** It belongs at the root (Question 1). If the instrument is too noisy, validity doesn't matter yet. This is the most "scientific" refusal mode and is often overlooked in social science debates which assume the data is fixed.
