  Ethan and Sophia argued over a lukewarm cup of coffee, Ethan insisting there was a precise temperature where it became "cold," a sharp boundary fixed by reality that no one could ever locate, while Sophia countered that at this temperature neither claim was true nor false, though she cheerfully maintained it was nevertheless true that the coffee was either cold or not. They paid the barista to settle the dispute, Ethan demanding a verdict on the unknowable fact, Sophia accepting a verdict on the disjunction, and the barista pocketed the money because while it was definitely true that one of them was right, it wasn't true that either was.
