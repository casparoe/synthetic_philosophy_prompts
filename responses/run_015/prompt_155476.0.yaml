answer: |-
  **Specification of Desiderata for a Statutory Theory of Hate Speech Regulation**

  **Preamble: The Purpose Constraint**
  The objective is not merely a moral or political theory, but one capable of being drafted into a statutory definition. The statute must be applicable by a court without resorting to open-ended balancing in each individual case. Consequently, vagueness, context-dependence, and appeals to 'weighing all circumstances' count as failures of the theory, not virtues. A requirement that necessitates judicial discretion to determine the core element of the offence is inadmissible.

  ***

  ### I. The Desiderata

  **1. The Asymmetry Grounding (The Mirror Case)**
  *   **The Case:** A member of a historically dominant group asserts a derogatory proposition about a minority; a member of that minority asserts the identical proposition about the dominant group.
  *   **The Requirement:** If the theory permits restricting the former but not the latter, it must identify a **fixed categorical proxy for structural power** rather than requiring a contextual assessment of relative vulnerability in each instance.
  *   **Rationale:** A statute cannot require a judge to conduct a sociological audit of power dynamics in every trial. If asymmetry is to be lawful, the protected categories must be legislatively fixed (e.g., 'racial minorities', 'religious groups') rather than determined by the immediate context of the speech.
  *   **Status:** *Camp Preference* (European dignity/equality tradition).
  *   **Neutrality Mark:** **Commitment of one camp passed off as reason.** The American tradition treats this asymmetry as viewpoint discrimination (forbidden); the European tradition treats it as substantive equality (required). Neither is neutral; both claim the mantle of 'equality' while defining it oppositely.

  **2. The Endorsement Independence (The Re-enactment Case)**
  *   **The Case:** A speaker quotes, stages, or sets hate speech to music while explicitly denouncing its content, yet the audience suffers harm (distress, dignitary injury) regardless of the speaker's intent.
  *   **The Requirement:** The theory must locate the wrong **either exclusively in the illocutionary force (advocacy) or exclusively in the perlocutionary effect (harmful impact)**, and the statute must reflect this binary.
  *   **Rationale:** A statute cannot rely on a judicial determination of whether the speaker 'really meant it' or whether the denunciation was 'sincere enough'. If the harm survives denunciation, the statute must ban the utterance-type regardless of intent. If the harm requires advocacy, the statute must exempt quotation regardless of impact.
  *   **Status:** *Non-Negotiable* (for draftability).
  *   **Neutrality Mark:** **Genuinely Neutral.** Both traditions require certainty on whether intent is an element of the offence. However, the *choice* of which side to take is not neutral (see Neutrality Mark on Requirement 5).

  **3. The Locus of Harm (The Export Case)**
  *   **The Case:** An utterance is lawful in the jurisdiction of the speaker but unlawful in the jurisdiction of the audience (or vice versa).
  *   **The Requirement:** The theory must assign the **legal situs of the harm to a single location** (either the point of transmission or the point of reception) without a 'most significant relationship' test.
  *   **Rationale:** To avoid open-ended balancing in conflict-of-laws scenarios, the statute must define the offence as completed either upon publication (speaker-focused) or upon receipt (listener-focused). It cannot depend on a weighing of where the harm was 'felt most'.
  *   **Status:** *Non-Negotiable* (for jurisdictional clarity).
  *   **Neutrality Mark:** **Genuinely Neutral.** This is a procedural necessity for any criminal statute, though the choice of locus often aligns with substantive goals (speaker-locus favours liberty; listener-locus favours protection).

  **4. The Atomisation Principle (The Cumulative Case)**
  *   **The Case:** Many individually trivial utterances create a hostile environment in aggregate, but no single utterance causes discernible harm on its own.
  *   **The Requirement:** The theory must either **demonstrate harm in the individual token** or **exclude aggregate harm from criminal liability**.
  *   **Rationale:** A criminal statute imposing individual liability cannot punish a person for the 'death by a thousand cuts' unless the individual cut is itself defined as unlawful. To punish an individual for the aggregate effect requires a standard of 'contribution to a climate', which is too vague for the stated purpose (no open-ended balancing).
  *   **Status:** *Camp Preference* (American free-speech tradition).
  *   **Neutrality Mark:** **Commitment of one camp passed off as reason.** The European tradition often accepts 'climate' or 'atmosphere' as a legitimate legal interest; the American tradition demands individual causation. Treating individual causation as a rational necessity is a commitment to liberal individualism.

  **5. The Speech-Act Categorisation (Say/Do/Reveal)**
  *   **The Case:** Distinguishing between restricting what is said (expression), what it does (incitement/harm), and what it reveals about future conduct (threat/intent).
  *   **The Requirement:** The statute must define the prohibited act as **constitutive** (the saying is the doing), **causative** (the saying leads to a separate doing), or **evidentiary** (the saying proves intent to do). It cannot conflate these.
  *   **Rationale:** If the law punishes the 'saying', it is a dignity offence. If it punishes the 'doing', it is an incitement offence. If it punishes the 'revealing', it is a threat offence. A draftable statute must pick one mechanism. Conflating them invites judicial balancing to determine which mechanism is at play in a given case.
  *   **Status:** *Non-Negotiable* (for logical coherence).
  *   **Neutrality Mark:** **Genuinely Neutral.** This is a requirement of linguistic and legal precision. However, the *selection* of which category to prioritise is highly partisan (see Analysis below).

  ***

  ### II. Analysis of Neutrality and Incompatibility

  **Neutral Requirements vs. Camp Commitments**
  Requirements 3 (Locus) and 5 (Categorisation) are genuinely neutral in form; they demand clarity but do not dictate the substantive outcome. Requirements 1 (Asymmetry), 2 (Endorsement), and 4 (Atomisation) are substantive commitments masquerading as logical necessities.
  *   **The European Commitment:** Often presents Requirement 1 (Asymmetry) and a version of Requirement 2 (Harm-focused) as demands of 'human dignity'. In reality, these are substantive political choices to prioritise group protection over viewpoint neutrality.
  *   **The American Commitment:** Often presents Requirement 4 (Atomisation) and a version of Requirement 2 (Intent-focused) as demands of 'reason' or 'causality'. In reality, these are substantive political choices to prioritise individual liberty and scepticism of state power.

  **The Incompatible Subset**
  The following three requirements cannot be jointly satisfied under the constraint of 'no open-ended balancing':
  1.  **The Asymmetry Grounding** (requiring fixed protected categories).
  2.  **The Atomisation Principle** (requiring harm in the individual token).
  3.  **The Cumulative Harm Intuition** (the underlying moral claim that aggregate trivial speech causes actionable harm).

  **The Conflict:** If you accept the Cumulative Harm Intuition (that the atmosphere matters), you violate the Atomisation Principle (because the individual token is harmless). If you enforce the Atomisation Principle to satisfy the statutory purpose, you cannot capture the Cumulative Harm. If you try to capture Cumulative Harm via Asymmetry (protecting only vulnerable groups from the atmosphere), you require judges to balance 'atmospheric contribution', violating the 'no balancing' constraint.

  **Proposed Abandonment**
  To satisfy the primary purpose (a draftable statute without open-ended balancing), I would abandon the **strong version of the Cumulative Harm Intuition** at the level of individual criminal liability.
  *   **The Cost:** The statute will be under-inclusive regarding systemic discrimination. It will fail to remedy the 'slow violence' of a hostile environment where no single actor is sufficiently culpable. It accepts that criminal law is a blunt instrument ill-suited to policing social atmospheres.
  *   **The Gain:** Legal certainty. The statute becomes enforceable without granting judges discretion to decide who is 'vulnerable enough' or whether the 'climate was toxic enough' in a specific instance.

  ***

  ### III. The Exclusionary Requirement

  The single requirement that excludes the largest share of positions currently on offer is **The Rule-Reducibility Requirement** (derived from the Purpose Constraint).

  Most existing theories of hate speech regulation—whether American or European—rely implicitly or explicitly on **contextual balancing**.
  *   **European positions** typically rely on proportionality tests that weigh the speech against the specific dignity interest in the specific context.
  *   **American positions** typically rely on multi-factor tests for incitement (imminence, likelihood, intent) that require weighing evidence in each case.

  By demanding a theory that can be reduced to a statutory definition applicable *without* open-ended balancing, we exclude nearly all 'standard-based' approaches. We exclude theories that say 'it depends on the context', 'it depends on the power dynamic', or 'it depends on the likelihood of violence'. We are left only with 'rule-based' theories (e.g., 'all group libel is banned' or 'no group libel is banned'). This excludes the vast middle ground of contemporary jurisprudence which seeks to manage hate speech through judicial discretion rather than legislative bright lines.
