answer: |-
  # Seminar Plan: The Epistemic Stability Protocol

  **Session Duration:** 90 Minutes
  **Participants:** 12 Postgraduate Students (6 Pairs)
  **Topic:** Peer Disagreement and the Calibration Cascade
  **Instructor Role:** Facilitator and Scorekeeper (do not lecture on theory until the debrief)

  ## 1. Learning Objective
  To simulate the instability inherent in conciliationist frameworks when peer status is endogenous to the disagreement process. Students will experience the 'calibration cascade': the recursive loop where belief revision necessitates peer-status revision, which in turn necessitates further belief revision.

  ## 2. Materials Required
  *   **Information Packets:** Two versions (Packet Alpha and Packet Beta) printed on distinct coloured paper.
  *   **Epistemic Scorecards:** One per student (see Appendix A).
  *   **Timer:** Visible to the room.
  *   **Final Case Files:** Two sealed envelopes labelled 'High Yield' and 'Low Yield'.

  ## 3. The Case Study: Algorithmic Procedural Fairness
  **Context:** A local council proposes using a machine-learning algorithm to prioritise housing applications.
  **The Question:** Does this specific implementation violate procedural fairness?

  **Packet Design (Asymmetric Weighting):**
  *   **Packet Alpha (Leans 'Unfair'):** Contains detailed evidence regarding 'black box' opacity, historical bias in training data, and the inability of applicants to contest specific variables. It includes a moderate counter-argument regarding efficiency, but frames it as secondary to rights.
  *   **Packet Beta (Leans 'Fair'):** Contains detailed evidence regarding consistency of application, removal of human discretion (reducing favouritism), and a robust human-in-the-loop appeal process. It includes a moderate counter-argument regarding opacity, but frames it as a necessary trade-off for security.
  *   **Common Ground:** Both packets contain identical baseline data on the algorithm's accuracy rates and the legal framework.

  ## 4. Minute-by-Minute Timeline

  ### Phase 1: Setup and Private Assessment (00:00 – 00:25)
  *   **00:00 – 00:10 (Introduction):** Distribute students into 6 pairs. Hand out Packet Alpha to one student and Packet Beta to the other. Distribute Scorecards.
      *   *Instruction:* "You are epistemic agents. You have private evidence. Do not show your packet to your partner. Your goal is to maximise your pair's 'Epistemic Credit' (EC). The total class EC determines which case we analyse in the final 30 minutes."
  *   **00:10 – 00:25 (Private Calibration):** Students read packets silently.
      *   *Task 1:* Record **Initial Confidence (C1)** in the claim: "The programme violates fairness" (0–100%).
      *   *Task 2:* Record **Initial Peer Rating (P1)** of their partner (0–100%). *Instruction:* "Assume your partner is a competent peer from this seminar. Rate their likely reliability in assessing this evidence."

  ### Phase 2: First-Order Deliberation (00:25 – 00:45)
  *   **00:25 – 00:45 (Dialogue):** Pairs discuss the case.
      *   *Constraint:* They may discuss the *weight* of arguments but cannot read direct quotes or reveal unique data points not inferable from the conclusion. They must argue from interpretation.
      *   *Task:* Reach a **Joint Confidence Interval (C2)**.
      *   *Option:* If they cannot agree, they must declare a **Standoff**.
      *   *Scoring Rule 1:* Convergence awards 10 EC. Standoff awards 0 EC.

  ### Phase 3: The Second-Order Shock (00:45 – 00:55)
  *   **00:45 – 00:55 (Peer Re-evaluation):** This is the critical mechanic.
      *   *Instruction:* "Based *only* on your partner's performance during the discussion and their stance in C2, record a **Revised Peer Rating (P2)**."
      *   *Constraint:* You must write a one-sentence justification on the back of the card.
      *   *The Reveal:* Partners swap Scorecards to reveal P2.
      *   *Scoring Rule 2 (The Consistency Tax):*
          *   If you converged (C2) but lowered Peer Rating (P2 < P1): **-5 EC** (Penalty for insincere agreement).
          *   If you declared Standoff but maintained High Peer Rating (P2 ≥ 90%): **-5 EC** (Penalty for irrational steadfastness).
          *   If you declared Standoff and lowered Peer Rating (P2 < P1): **0 EC** (No penalty, but no convergence bonus).

  ### Phase 4: The Cascade (00:55 – 01:05)
  *   **00:55 – 01:05 (Recursive Revision):**
      *   *Instruction:* "You have now seen how your partner rated *you*. If your partner downgraded your peer status, your own reliability is now in question. You have 5 minutes to adjust your **Final Confidence (C3)**."
      *   *Mechanic:* This forces the cascade. If Student A lowered Student B's status, Student B now has evidence that Student A thinks B is unreliable. B must decide: do I revise my belief because A thinks I'm wrong (conciliation), or do I dig in because A is being unfair (steadfastness)?
      *   *Task:* Record C3.
      *   *Scoring Rule 3:* The Instructor collects cards. EC is tallied.

  ### Phase 5: Stakes and Debrief (01:05 – 01:30)
  *   **01:05 – 01:10 (The Stakes):** Instructor calculates total Class EC.
      *   **Threshold:** If Class Average EC > 70, open 'High Yield' envelope (A complex, unresolved meta-epistemological puzzle).
      *   **Threshold:** If Class Average EC < 70, open 'Low Yield' envelope (A straightforward, resolved case with clear answer).
      *   *Note:* Design the 'High Yield' case to be more philosophically rewarding to incentivise genuine effort.
  *   **01:10 – 01:30 (Structured Debrief):** Instructor maps the experience to theory (see Section 6).

  ## 5. Scoring Logic and Incentives
  The point system is designed to make the 'Calibration Cascade' painful.
  1.  **Blind Conciliationism:** If a student simply agrees with their partner to get the 10 EC convergence bonus, but privately thinks the partner argued poorly, they risk the 'Insincerity Penalty' when they submit P2.
  2.  **Blind Steadfastness:** If a student refuses to move from their initial belief, they force a Standoff. To avoid the 'Irrational Steadfastness Penalty', they *must* downgrade their partner's peer status.
  3.  **The Cascade:** Downgrading the partner's status in a Standoff often provokes the partner to downgrade *your* status in Phase 4. This mutual downgrading simulates the erosion of the 'peer' condition. If you are no longer peers, the normative pressure to conciliate dissolves, but the cost is the loss of collaborative EC.

  ## 6. Instructor's Debrief Guide
  *Do not distribute this text to students. Use it to guide the final 20 minutes.*

  ### A. Mapping the Mechanics to Theory
  1.  **Phase 2 (Convergence vs. Standoff):**
      *   *Theory:* This represents the first-order response to disagreement.
      *   *Conciliationism:* Represented by pairs who moved C1 significantly toward the partner's view to achieve C2.
      *   *Steadfastness:* Represented by pairs who declared Standoff.
  2.  **Phase 3 (Peer Re-evaluation):**
      *   *Theory:* This introduces the **Endogeneity of Peer Status**. Standard models often treat peerhood as a fixed premise. This simulation treats it as a variable.
      *   *The Uniqueness Thesis:* Implicit in the penalty for 'Standoff + High Peer Rating'. If there is only one rational doxastic attitude given the evidence (Uniqueness), and you are peers, you should agree. Disagreement implies one of you is not reasoning correctly, justifying a peer downgrade.
  3.  **Phase 4 (The Cascade):**
      *   *Theory:* This is the **Calibration Cascade**.
      *   *Explanation:* When Student B sees Student A lower B's peer rating, B receives higher-order evidence that A considers B unreliable. B must now weigh: 'Is A right about my unreliability?' If B accepts A's assessment, B must revise belief (conciliation). If B rejects it, B must downgrade A (mutual assured destruction of peer status).

  ### B. Predictable Failures and Discussion Points
  1.  **The Ad Hominem Confusion:**
      *   *Observation:* Students often treat lowering the Peer Rating (P2) as a personal slight rather than an epistemic adjustment.
      *   *Philosophical Point:* Distinguish between *competence* (peer status) and *character*. The simulation forces an adjustment of estimated reliability, but students often feel it as a social sanction. This highlights the difficulty of separating social dynamics from epistemic norms in real-world disagreement.
  2.  **The Stability Problem:**
      *   *Observation:* In Phase 4, students often oscillate wildly or refuse to move at all.
      *   *Philosophical Point:* The simulation fails to reproduce **Long-Term Belief Network Stability**. In reality, we do not revise our entire web of belief in a 5-minute window. We have 'anchoring' beliefs that resist the cascade. The game forces immediate revision, creating an artificial volatility that exaggerates the sceptical threat of the calibration cascade.
  3.  **The 'Split the Difference' Heuristic:**
      *   *Observation:* Pairs may simply average their numbers to get the EC bonus without genuine argument.
      *   *Philosophical Point:* This mimics 'spineless conciliationism'. It secures the short-term reward (agreement) but fails the Second-Order check (P2 rating), demonstrating that mechanical averaging is not a robust epistemic strategy.

  ### C. Closing Question for the Group
  "Did the pressure to maintain 'Peer Status' drive you toward the truth, or merely toward agreement? If the latter, does conciliationism prioritise social cohesion over epistemic accuracy?"

  ## Appendix A: Epistemic Scorecard (Template)

  **Student ID:** _______________
  **Packet Type:** [ Alpha / Beta ]

  **Round 1: Private Assessment**
  1.  Initial Confidence (0-100%) that the programme is Unfair: ______ %
  2.  Initial Peer Rating of Partner (0-100%): ______ %

  **Round 2: Deliberation Outcome**
  [ ] We Converged (Shared Confidence: ______ %)
  [ ] We Declared Standoff

  **Round 3: Second-Order Assessment**
  1.  Revised Peer Rating of Partner (0-100%): ______ %
  2.  Justification for Change (One Sentence): ___________________________________

  **Round 4: Final Revision**
  1.  Final Confidence (0-100%) that the programme is Unfair: ______ %

  *(Instructor Use Only: EC Calculation)*
  *   Convergence: +10
  *   Insincerity (Converge + Lower Peer): -5
  *   Irrational Steadfastness (Standoff + High Peer): -5
  *   **Pair Total:** ______
