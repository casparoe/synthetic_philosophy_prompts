      *Let's refine the "Single Feature" argument.* If I remove the *need for auditability* (which comes from targeting), the definition doesn't change. If I remove the *tenant signature requirement*, the metric works. So the feature is the *shift in the definition of 'complete' driven by the need for verification.*

      *Skeptic Objection:* The skeptic will say "You changed the definition of the metric. Of course it changed." The counter is "You only changed the definition *because* it became a target. If it remained a background stat, you wouldn't have tightened the definition." This is the crux.

