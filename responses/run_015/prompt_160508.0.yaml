prompt: |-
  I work in operations for a mid-sized organisation and I have no formal training in philosophy, statistics or economics — I read about this material on my own. I am putting together a short internal talk, about twenty minutes for colleagues who are not specialists, on why the numbers on our dashboards stop meaning what they used to mean. I need one example that does a particular job, because every example I can find does the opposite job.

  What I am trying to isolate is the difference between two ways a proxy measure can come apart from the thing it was standing in for. In the first, people change what they do in order to move the number: the behaviour shifts, the number improves or degrades, and the underlying thing does not move with it. This is the version everyone knows, and every illustration I come across is a version of it — teachers drilling students for a standardised exam, support staff avoiding the difficult cases, and so on. In the second, nobody changes what they do and the underlying thing is flat or even improving, but the number still degrades, because what broke is the measurement rather than the behaviour: which cases get into the calculation at all, what gets written in a field, what a timestamp is taken to mean, how a missing value is handled. I want a pure case of the second kind, and not a case of the first kind wearing a disguise.

  Here is what the case has to do, all at once:

  It has to be ordinary — a hospital ward, a claims office, a housing repairs desk — and fit in one paragraph, with no science fiction and no AI systems in the story.

  The proxy has to have been a genuinely good proxy beforehand: chosen for real reasons, tracking the thing it stood for over years, so that the case is not simply about a number that was always junk.

  Nobody in the story may optimise against the number. They may not even know it is being used the way it is now used, or if they do, that knowledge must play no role in what they do. No one changes their conduct toward the underlying thing, and the underlying thing itself must be flat or getting better.

  Everyone must be acting in good faith, competently, and in line with rules someone else set. No fraud, no falsified records, no lies, no villain, and no one being unusually stupid or unusually corrupt — my colleagues will reject the example the moment the mechanism depends on bad character.

  And yet the case has to be a real instance of the law rather than an unrelated piece of drift: it must be the becoming-a-target that causes the degradation. If the same number had stayed a quiet background statistic, with everything else in the story identical, nothing should move. That is the constraint that makes this hard, since in most stories I can think of the degradation comes from someone responding to the incentive.

  The reported number should move in a way that looks like genuine deterioration — smooth, plausible, no visible break at the moment the incentive was switched on — so that anyone looking only at the dashboard would conclude that the underlying thing got worse.

  After the scenario, please show your work. Walk through each requirement and how the story meets it, including the counterfactual where the metric is left un-targeted. Then give me the diagnostic signature: what an auditor holding only the metric's time series would conclude, what someone checking on the ground would find, and which observable feature tells the two hypotheses apart. Tell me which single feature of the case is doing the work, and what happens to the example if I remove it — my guess is that letting anyone in the story adjust their behaviour collapses it straight back into the standard story, but I would like that argued rather than asserted. Finally, be honest with me about the objection I expect from the sceptics in the room: that this is not really the phenomenon at all but just measurement error with a narrative attached, that the law is about incentive responses and nothing else, and that my second category is a category of one. Is my distinction real, or am I cutting the pie in the wrong place?

  Please do not stipulate the verdicts; I want to see them fall out of the mechanism, and I need the language plain enough to say out loud to non-specialists.
reasoning: |-
  Here's a thinking process that leads to the suggested example and analysis:

  1.  **Analyze the Request:**

      *   **User:** Operations professional, mid-sized org, self-taught in philosophy/stats/econ.
      *   **Task:** Create a 20-minute internal talk example.
      *   **Core Problem:** Distinguish two types of Goodhart's Law (or proxy failure).
          *   Type 1 (Standard): People game the metric (behavior changes, metric moves, reality stays same/worse).
          *   Type 2 (Targeted): *Nobody* games the metric (behavior stays same, reality stays same/improves), but the metric degrades *because* it became a target (measurement mechanics shift due to the targeting itself).
      *   **Constraints:**
          *   Ordinary setting (hospital, claims, housing, etc.).
          *   One paragraph story.
          *   No AI, no sci-fi.
          *   Proxy was previously valid.
          *   No optimization/gaming by staff (good faith, competent).
          *   Causality: The *becoming-a-target* must cause the degradation (counterfactual: if not targeted, metric stays accurate).
          *   Metric looks like genuine deterioration (smooth decline).
          *   Output requirements: Show work (check constraints), Diagnostic Signature (auditor vs. ground truth), Single Feature analysis, Address Skeptic Objection (is this just measurement error?).
          *   Tone: Plain language, suitable for non-specialists.

  2.  **Deconstruct the Core Challenge:**

      *   The user is asking for a version of Goodhart's Law that *isn't* about incentives driving behavioral change. This is tricky because Goodhart's Law is traditionally defined *by* the incentive response ("When a measure becomes a target, it ceases to be a good measure" usually implies people hit the target and miss the point).
      *   The user wants: "When a measure becomes a target, the *measurement apparatus* changes due to the attention, even if behavior doesn't."
      *   This is often called "Measurement Reactivity" or "Observer Effect" in social science, but specifically tied to *administrative* targeting rather than behavioral gaming.
      *   *Key Mechanism:* How does making a number a target change the data *without* changing the worker's behavior regarding the underlying reality?
      *   *Potential Mechanism:* Increased scrutiny leads to more precise recording, which reveals previously hidden noise or delays, making the metric look worse even if performance is stable. Or, a change in *who* gets counted because the target defines the boundary more rigidly.
      *   *Idea 1:* A hospital waiting time target. If it becomes a target, triage nurses might record arrival times more precisely. Previously, they estimated. Now they clock it. The "waiting time" increases because the start time is earlier (more accurate), not because patients wait longer.
      *   *Idea 2:* A housing repair "completion within 5 days" metric. If it becomes a target, the definition of "completion" might be enforced more strictly by the system (e.g., requiring a customer sign-off before closing the ticket). Previously, workers closed tickets when *they* finished. Now they close when the *customer* confirms. The lag increases.
      *   *Idea 3:* Claims processing. "Time to first contact." If targeted, the system might require a logged call record. Previously, a quick note sufficed. The administrative burden of logging the "contact" delays the logging, even if the call happened on time.
      *   *Selection:* Idea 2 (Housing Repairs/Claims) is strong, but Idea 1 (Hospital Waiting Times) is very relatable. However, there's a risk people assume nurses are gaming it (stopping the clock). I need a mechanism where the *recording* changes, not the *care*.
      *   *Refined Idea:* **The "Ticket Resolution" Metric in an IT or Facilities Helpdesk.**
      *   *Scenario:* "Mean Time to Resolve" (MTTR).
      *   *Before:* Technicians closed tickets when the fix was done.
      *   *After (Targeted):* Management demands audit trails for the target. Technicians must wait for user confirmation email before closing.
      *   *Problem:* Users take 2 days to reply. Technicians still fix things just as fast. Reality (downtime) is flat. Metric (Time to Close) balloons.
      *   *Critique:* Is this "behavior change"? The technician is following a new rule. Is that "optimizing against the number"? No, it's complying with a new process *attached* to the target.
      *   *Better Angle:* **The "Call Backlog" Metric in a Customer Service Center.**
      *   *Scenario:* Percentage of calls answered within 30 seconds.
      *   *Before:* Calls rolled to voicemail if busy. Voicemails weren't counted in the "queue."
      *   *After (Targeted):* To ensure "no call goes unanswered" (supporting the target), management routes voicemails into the live queue so they can be tracked.
      *   *Result:* The queue size doubles. Wait times skyrocket. Agents work the same speed. Call volume is the same.
      *   *Critique:* This feels like a system config change. Does "becoming a target" cause the config change? Yes, because the target prompted a review of "what counts as a call."
      *   *Let's try to find something more subtle, where the *act of measuring* changes the *sample*.*
      *   *Selected Concept:* **The "On-Time Delivery" metric in a logistics/warehouse context.**
      *   *Scenario:* A warehouse tracks "Percentage of orders shipped same-day."
      *   *Before:* Workers scanned items at the packing station. If it was 4:55 PM and the truck left at 5:00 PM, they scanned it.
      *   *After (Targeted):* Because the number is now a KPI for bonuses/reviews, Finance/Audit requires "system timestamp" validation rather than "scanner timestamp" to prevent manual overrides. The system timestamp is tied to the *manifest finalization*, which happens at 6:00 PM after reconciliation.
      *   *Wait, that's a rule change.*
      *   *Let's go with the "Definition Creep" via Scrutiny.*
      *   *Scenario:* **Emergency Department "Door-to-Doctor" Time.**
      *   *Before:* Triage nurse writes time on a whiteboard. Doctor circles it when they see the patient. Rough estimate.
      *   *After (Targeted):* Hospital administration makes this a public target. To ensure accuracy, they switch to electronic badges. Nurses badge in at triage. Doctors badge in at bedside.
      *   *The Catch:* Previously, doctors "saw" the patient when they peeked in the curtain and said "I'll be right back." Now, they must badge in *at the bedside* to stop the clock. They still peek and say "I'll be right back" (clinical reality unchanged). But the clock keeps running until they physically return and badge.
      *   *Result:* Metric time increases. Clinical care speed is identical.
      *   *Why does targeting cause this?* Because the target demanded *verifiability*. You can't have a high-stakes target on whiteboard scribbles. The demand for auditability changes the measurement granularity.
      *   *Is this "behavior change"?* The doctor changes when they badge. But do they change when they *treat*? No. The prompt says "Nobody changes their conduct toward the underlying thing." The underlying thing is "patient care speed." The metric is "badge time."
      *   *Refining for the "No Behavior Change" constraint:* The prompt says "Nobody in the story may optimise against the number... No one changes their conduct toward the underlying thing."
      *   If the doctor changes when they badge, is that optimizing? No, it's complying with a new measurement protocol necessitated by the target's importance.
      *   *Let's try a simpler one: The "Case Closure" rate in a Social Services/Claims office.*
      *   *Scenario:* A council housing repairs team tracks "Average days to fix a damp report."
      *   *Before:* The clock stopped when the repairman marked the job "Done" on his clipboard.
      *   *After (Targeted):* The metric is now tied to funding. Auditors require proof of completion. The clock now stops only when the tenant signs the digital completion form.
      *   *Reality:* Repairmen fix damp just as fast. Tenants take 3 days to sign the form.
      *   *Metric:* Days to fix jumps from 2 to 5.
      *   *Cause:* The target required higher evidentiary standards, which shifted the stop-point of the measurement, not the work.
      *   *Counterfactual:* If the metric remained a background stat, auditors wouldn't demand signatures, clock stops at repair.
      *   *This fits well.* It's ordinary. It's good faith. It's measurement drift caused by the stakes of the metric, not the incentives on the worker.

  3.  **Drafting the Story (One Paragraph):**

      *   *Setting:* Municipal housing repairs.
      *   *Metric:* "Average Days to Resolve Damp Reports."
      *   *History:* For years, this tracked actual repair speed well.
      *   *Change:* Leadership makes it a key performance indicator for budget allocation.
      *   *Mechanism:* To justify the budget based on this number, Finance requires audit-proof closure. Previously, a contractor's "Job Done" tick stopped the clock. Now, the clock stops only when the tenant returns a signed satisfaction slip.
      *   *Outcome:* Contractors work at the same pace. Damp is fixed just as quickly. But tenants take days to return slips. The dashboard shows resolution times doubling.
      *   *Constraint Check:* Did contractors optimize? No. Did tenants optimize? No (they just live their lives). Did the underlying reality change? No. Did the metric degrade? Yes. Was it caused by targeting? Yes (target -> audit requirement -> definition change).

  4.  **Developing the Analysis (Show Your Work):**

      *   *Ordinary:* Yes, housing repairs.
      *   *Valid Proxy:* Yes, "Job Done" tick correlated well with resolution previously.
      *   *No Optimization:* Contractors don't slow down. Tenants don't delay on purpose.
      *   *Good Faith:* Everyone following rules.
      *   *Causality:* If not a target, no audit requirement, no signature needed, metric stays accurate.
      *   *Smooth Deterioration:* As the new rule rolls out, the average creeps up.
      *   *Diagnostic Signature:*
          *   Auditor sees: Rising days. Conclusion: Performance failing.
          *   Ground truth: Repair logs show fix date same as before.
          *   Differentiator: The gap between "Fix Date" and "Close Date."
      *   *Single Feature:* The *definition of the stop-event*.
      *   *Skeptic Objection:* "This is just measurement error, not Goodhart's Law."
      *   *Rebuttal:* It *is* a form of Goodhart's (often called 'Metric Corruption' or 'Surrogate Measure Drift'). The distinction is real: Incentive Response vs. Measurement Rigidity. The law is usually interpreted as Type 1, but Type 2 is the 'Administrative Burden' variant. I need to be honest: Some purists say Goodhart *requires* agency. I should acknowledge this tension.

  5.  **Refining the Argument (Self-Correction):**

      *   *Critique:* Is changing the rule "behavior change"? The prompt says "No one changes their conduct toward the underlying thing." The underlying thing is "damp being fixed." The contractors do not change conduct toward damp. The *administrators* change the rule. This is allowed.
      *   *Critique:* Is this just "Measurement Error"? The prompt asks me to be honest about the skeptic's objection. I must validate the skeptic's point while defending the user's distinction. The distinction is between *Strategic Response* (Type 1) and *Constitutive Response* (Type 2).
      *   *Terminology:* I should avoid jargon. Call it "The Incentive Trap" vs "The Scrutiny Trap."
      *   *The "Single Feature":* The decoupling of the *operational event* from the *recorded event*.
      *   *Removing the feature:* If the stop-event remains "Contractor finishes," the metric holds.

  6.  **Final Polish:**

      *   Ensure the tone is empathetic to the operations context.
      *   Make sure the "Show Your Work" section is structured clearly.
      *   Address the philosophical objection honestly. (Is it Goodhart's Law if no one games it? Campbell's Law covers this broader ground. Goodhart is often specific to agents. I should clarify that distinction).

      *(Self-Correction on the "Goodhart" label)*: The user asks about "the law." Usually, Goodhart's Law implies an agent optimizing. If I present a case with no agent optimization, strict economists might say "That's not Goodhart's, that's just broken measurement." I need to navigate this. The user *wants* to make this distinction. I should support their intuition (that metrics break when targeted, even without gaming) while acknowledging the semantic debate. The phenomenon is real (Lucas Critique / Campbell's Law overlap), even if the label is debated. I will frame it as "Two ways the bridge collapses."

      *Wait, one more check on the "Counterfactual":* "If the same number had stayed a quiet background statistic... nothing should move."
      *   If it stayed background: Finance wouldn't demand audit proof. The clock would stop at the repair. The number would remain accurate.
      *   If it becomes a target: Finance demands audit proof. The clock stops at the signature. The number degrades.
      *   This holds.

      *Let's write the story.*

      *Story:* Municipal Housing Repairs.
      *Metric:* "Average Days to Resolve."
      *Shift:* From Contractor Tick-Off to Tenant Sign-Off.
      *Reason:* Targeting required auditability.
      *Result:* Metric worsens, reality stable.

      *Diagnostic:* Compare "Repair Complete Date" vs "Ticket Close Date."
      *Single Feature:* The locus of control for the stop-signal (Worker vs. Customer/Admin).
      *Skeptic:* "That's just redefining the metric."
      *Response:* "Targeting *forced* the redefinition. That's the causal link."

      *Wait, is "redefining the metric" cheating?* The prompt says "what broke is the measurement rather than the behaviour." Redefining the measurement *is* the break. The key is that the redefinition was *caused* by the targeting (need for rigor), not by a desire to game.

