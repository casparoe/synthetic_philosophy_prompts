answer: |-
  ### The Story

  For ten years, the municipal housing authority tracked "Average Days to Resolve Damp Reports" to monitor maintenance efficiency. The number was reliable: when the metric rose, repairs were actually slowing down; when it fell, the team was keeping pace. Last year, leadership made this metric a primary target for budget approval, requiring auditable proof for every closed ticket to justify the spend. Previously, the clock stopped when the contractor marked "Job Done" on their handheld device at the wall. Under the new audit rules, the clock now stops only when the tenant returns a signed digital completion form. The contractors work at the exact same speed, the damp is fixed just as quickly, and tenants are not delaying on purpose—they simply take three days to notice and sign the form. Yet, on the dashboard, the average resolution time has smoothly doubled from two days to five, suggesting a collapse in performance that does not exist in the buildings.

  ### Show Your Work

  Here is how the scenario meets your constraints:

  *   **Ordinary & Concise:** The setting is a standard housing office; the mechanism is administrative (signature requirements), not technical or sci-fi.
  *   **Previously Valid Proxy:** The story states the metric tracked reality reliably for ten years. It was not junk data to begin with.
  *   **No Optimization:** The contractors do not slow down (conduct toward the underlying thing is flat). The tenants do not game the system (they sign in good faith, just slowly).
  *   **Good Faith:** No one is lying. The auditors want proof; the contractors want to get paid; the tenants want dry walls. Everyone follows the new rules competently.
  *   **Causality (The Target Causes the Break):** If the metric had remained a quiet background statistic, Finance would not have demanded audit-proof closure. The definition of "Resolve" would have remained "Contractor finishes." The degradation is caused by the *status* of the number (Target vs. Background), not the work itself.
  *   **Smooth Deterioration:** As the new audit rule rolls out across the district, the average time creeps up steadily. It looks like a performance drift, not a step-change error.

  ### The Diagnostic Signature

  If you are trying to distinguish this from standard gaming in a real meeting, here is what you look for:

  1.  **The Auditor's View (Dashboard Only):** They see a time-series chart climbing steadily. They conclude: "Operational efficiency is degrading. We need to pressure the maintenance teams."
  2.  **The Ground Truth (Site Check):** You check the contractor's handheld logs. The "Job Done" timestamps are identical to last year's averages. The physical work is unchanged.
  3.  **The Differentiator:** You plot the gap between **"Work Finished"** and **"Ticket Closed."**
      *   In the **Standard Goodhart Case** (Gaming), "Work Finished" gets delayed because workers are waiting for easy cases or padding time. Both timestamps move.
      *   In **This Case** (Measurement Drift), "Work Finished" stays flat, but "Ticket Closed" drifts away from it. The *latency* is purely administrative.

  ### The Single Feature Doing the Work

  The single feature driving this is **the shift in who controls the stop-signal.**

  Previously, the stop-signal was controlled by the **operator** (the contractor finishing the work). Now, it is controlled by the **environment** (the tenant returning the form).

  **Why this matters:**
  If you remove this feature—if the clock still stops when the contractor marks "Job Done"—the metric remains accurate even if it is a target. The degradation *only* happens because the targeting triggered a demand for verification, which shifted the stop-signal to a party outside the operational loop.

  If you allow the contractors to adjust their behavior (e.g., they nag tenants to sign faster), the story collapses back into Standard Goodhart (Type 1). They are now optimizing the number. By keeping their behavior fixed toward the *work*, we isolate the measurement apparatus as the sole point of failure.

  ### The Skeptic's Objection (And Your Reply)

  You should expect a sharp pushback from anyone with a background in economics or statistics. Here is the objection, and how to handle it.

  **The Objection:**
  "This isn't Goodhart's Law at all. Goodhart's Law is about *incentives driving behavior*. You haven't described a law of human nature; you've just described a management team changing the definition of a metric. If you change the formula, of course the number changes. This is just measurement error with a narrative attached. There is no 'law' here, just an administrative mistake."

  **Is the distinction real?**
  Yes, but you must be precise about *why*.
  Strictly speaking, traditional Goodhart's Law (and Campbell's Law) relies on an agent responding to an incentive. Your skeptic is technically correct that this example lacks the *agent response*. However, your intuition is capturing a broader, often overlooked phenomenon known in systems theory as **Reactivity** or **Constitutive Effects**.

  The distinction is real because in Type 1 (Standard), the *world* changes to fit the map. In Type 2 (Your Case), the *map* changes to fit the stakes, while the world stays still.

  **Your Reply to the Room:**
  "You are right that the classic definition assumes people game the system. But in operations, we know that making a number important changes how we *count*, not just how we *act*. When a metric becomes a target, it attracts scrutiny. That scrutiny demands more rigorous definitions. Those definitions often add friction—like waiting for a signature—that has nothing to do with performance. If we only look for gaming, we will blame the workers for a slowdown that is actually just the cost of verification. My point is not to rewrite economics, but to warn us that **targets create bureaucracy, and bureaucracy creates lag.** If we treat that lag as failure, we will fix the wrong thing."

  ### Summary for your Talk

  *   **Type 1 (The Gaming):** The workers change the work to hit the number. (The Map stays, the Territory moves).
  *   **Type 2 (The Scrutiny):** The rules change the count to protect the number. (The Territory stays, the Map moves).

  Your example isolates Type 2. It warns your colleagues that sometimes the dashboard isn't lying because people are cheating; it's lying because the stakes made the ruler more expensive to use.
