prompt: |-
  hey, i'm a novelist drafting a dialouge-heavy book and i want to check whether my characters' moral talk actually hangs together if you read it through an expressivist lens—like, moral sentences express attitudes not facts, and then you hit the Frege-Geach embedding problem when those sentences get stuck inside conditionals or negations. i need this turned into an actual procedre my editor (just me, honestly) can run on any scene without a philosophy degree. make it a checklist: step one, identify the speech act; step two, check if it's embedded; step three, apply the consistency test; and flag exactly where i have to make a judgment call instead of following a rule. the hard cases i keep occuring in my draft are moral parentheses—where a character quotes someone else's moral claim inside their own reasoning, like "if what she said—'stealing is wrong'—holds, then..."—and counterfactual moral planning, where a character figures out obligations in worlds where the wrong act turned out right. please apply the procedre to these three lines:

  A. "Murder is wrong, and if murder is wrong then the judge should halt the trial."
  B. "Either torture is wrong or i've completely lost my moral compass."
  C. "She doesn't believe bribery is wrong, yet she refuses to take the money."

  for one of these, tell me the procedre flags it as technically incoherent on expressivist grounds but that i should probably keep it anyway because real people talk like that—identify which one and say what consistency i'm sacrificing. also be honest about what the checklist can't do: can it tell sincere from ironic moral talk? can it handle sentences that mix description and evaluation, like "the wrongness of the act sparked the riot"? and where does it just fail because voice matters more than logical form? i need this to take ten minutes max per scene, and i'm the only person signing off.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist drafting a dialogue-heavy book.
      *   **Goal:** Check if characters' moral talk hangs together under an *expressivist* lens (moral sentences express attitudes, not facts) considering the *Frege-Geach problem* (embedding moral sentences in conditionals/negations).
      *   **Output:** A practical checklist/procedure for an editor (the author themselves) to run on scenes without a philosophy degree.
      *   **Specific Steps Required:** Step 1 (Speech Act), Step 2 (Embedding), Step 3 (Consistency Test), Flag Judgment Calls.
      *   **Specific Hard Cases to Address:** Moral parentheses (quoting others' claims), Counterfactual moral planning.
      *   **Task:** Apply the procedure to three specific lines (A, B, C).
      *   **Constraint:** Identify one line that is technically incoherent on expressivist grounds but should be kept for realism (identify which one and what consistency is sacrificed).
      *   **Limitations:** Be honest about what the checklist *can't* do (sincerity vs. irony, mixed description/evaluation, voice vs. logic).
      *   **Time Limit:** Must take 10 minutes max per scene.
      *   **Tone:** Practical, honest, writer-focused, not overly academic but philosophically accurate enough for the premise.

  2.  **Deconstruct the Philosophy (Expressivism & Frege-Geach):**
      *   *Expressivism:* "Murder is wrong" = "Boo murder!" (Expression of attitude).
      *   *Frege-Geach Problem:* If "Murder is wrong" just means "Boo murder!", what does "If murder is wrong..." mean? You can't say "If Boo murder!..." It loses the expressive force but keeps the logical structure. Expressivists struggle to explain how moral logic works if moral sentences aren't truth-apt propositions.
      *   *The User's Goal:* They want to know if their characters sound like they're making logical sense *if* we assume expressivism is true. This is a bit meta, because most people talk like moral realists (believing moral facts exist). The user wants to test for *expressivist coherence*.
      *   *The Twist:* The user admits they are the editor. They want a tool to ensure internal consistency of the *philosophical voice* of the characters, or perhaps they are writing characters who are expressivists. Actually, reading closely: "check whether my characters' moral talk actually hangs together if you read it through an expressivist lens." This implies checking if the dialogue breaks the logic of expressivism.
      *   *Correction/Refinement:* Most readers won't know expressivism. The user is likely using this as a rigorous stress-test for character consistency. If a character is an expressivist, they shouldn't talk like a realist. If the book *itself* is exploring these themes, the logic needs to hold.
      *   *The "Incoherent but Keep" Line:* Real people talk like moral realists even if they are expressivists. The Frege-Geach problem is a *philosopher's* problem, not a layperson's problem. So, a line that triggers the Frege-Geach problem (embedding) is technically "incoherent" for a strict expressivist (because how can you condition an attitude?), but normal humans say it all the time.

  3.  **Drafting the Checklist (The Procedure):**
      *   Needs to be fast (10 mins/scene).
      *   Needs to be simple (no philosophy degree).
      *   *Step 1: Identify the Speech Act.* Is it an assertion of fact or an expression of attitude? (Simplify: Is it "I hate X" or "X is bad"?).
      *   *Step 2: Check Embedding.* Is the moral bit inside an "If," "Or," "Not," or "She believes"?
      *   *Step 3: Consistency Test.* If embedded, does the character treat it like a fact (truth-apt) or an attitude?
      *   *Judgment Calls:* Flag where the author decides if the character is being philosophical or naturalistic.

  4.  **Applying to Lines A, B, C:**
      *   *Line A:* "Murder is wrong, and if murder is wrong then the judge should halt the trial."
          *   Structure: P & (If P then Q). Classic Modus Ponens.
          *   Expressivist issue: The second "Murder is wrong" is embedded in a conditional. An expressivist says the first one expresses an attitude. The second one doesn't express an attitude (it's hypothetical). Do they mean the same thing? Frege-Geach says no, which breaks logic.
          *   Verdict: Technically problematic for strict expressivism, but standard logic.
      *   *Line B:* "Either torture is wrong or i've completely lost my moral compass."
          *   Structure: P or Q. Disjunction.
          *   Expressivist issue: "Torture is wrong" is embedded in an "Either/Or". You can't really have an attitude inside an "Either/Or".
          *   Realism check: This sounds very dramatic/character-driven.
      *   *Line C:* "She doesn't believe bribery is wrong, yet she refuses to take the money."
          *   Structure: Belief report + Action.
          *   Expressivist issue: This is about *belief* in a moral claim. Expressivists analyze moral belief as having an attitude.
          *   Coherence: This actually highlights the distinction between attitude and action. It's not necessarily logically broken, just psychologically interesting.

      *   *Selection for "Keep Anyway":* Line A is the classic Frege-Geach example. It's the clearest case of embedding. If the character is a strict expressivist, they shouldn't treat "Murder is wrong" as a proposition that can be the antecedent of a conditional *in the same sense* as the assertion. But everyone talks like this. Line A is the best candidate for "Technically incoherent for expressivism, but keep for realism."

  5.  **Addressing the Hard Cases:**
      *   *Moral Parentheses:* "If what she said—'stealing is wrong'—holds..." This is use-mention distinction. The character is mentioning the sentence, not using it. The checklist needs to account for quotation marks.
      *   *Counterfactual Moral Planning:* "If I had stolen, I would have been bad." This involves modal logic. The checklist needs to flag "If" statements about non-real worlds.

  6.  **Addressing Limitations:**
      *   *Sincerity vs. Irony:* Logic checkers can't detect tone.
      *   *Mixed Sentences:* "The wrongness... sparked the riot." This reifies wrongness (makes it a fact/object). Expressivism hates this. The checklist should flag nominalizations.
      *   *Voice vs. Logic:* Characters aren't logicians. If the logic check kills the voice, kill the check.

  7.  **Refining the Output:**
      *   Make it look like a tool.
      *   Ensure the "10-minute" constraint is respected (keep it punchy).
      *   Be honest about the "Incoherent but Keep" recommendation.
      *   Ensure the specific lines A, B, C are analyzed.

  8.  **Self-Correction/Review during drafting:**
      *   *Wait, one nuance:* The user asks to check if the talk hangs together *if read through an expressivist lens*. This means I need to point out where the text *fails* expressivism (i.e., treats morals like facts).
      *   *Line A:* Treats "Murder is wrong" as a truth-apt proposition in the conditional. Fails strict expressivism.
      *   *Line B:* Treats "Torture is wrong" as a proposition in a disjunction. Fails strict expressivism.
      *   *Line C:* Reports a belief state. Expressivists translate "believes X is wrong" as "has an attitude against X." This is actually compatible if interpreted charitably, but the phrasing "believes... is wrong" sounds realist.
      *   *Decision:* Line A is the strongest Frege-Geach candidate. It's the textbook example. I will recommend keeping A despite the expressivist incoherence because it's how humans reason.
      *   *Checklist Design:* Needs to be actionable. "Highlight moral words." "Circle logical operators." "Ask: Is this a fact or a feeling?"

  9.  **Final Polish:** Check tone. Needs to be supportive but rigorous. Ensure the "Judgment Call" flags are clear. Ensure the limitations section is candid. (Self-correction: Make sure I explicitly mention the "Moral Parentheses" and "Counterfactual" hard cases in the checklist or analysis as requested).

      *   *Wait, re-reading the prompt:* "flag exactly where i have to make a judgment call instead of following a rule."
      *   *Re-reading the prompt:* "apply the procedre to these three lines."
      *   *Re-reading the prompt:* "for one of these, tell me the procedre flags it as technically incoherent on expressivist grounds but that i should probably keep it anyway."

      Okay, plan is solid. I will structure the response with the Checklist first, then the Application to A/B/C, then the Limitations.

      *Wait, one more thing:* The prompt asks for "Moral parentheses" and "Counterfactual moral planning" to be addressed in the procedure/hard cases. I need to make sure the checklist has a step for those specific structures.

      *Revised Checklist Step 2:* Check for Embedding OR Quotation OR Counterfactuals.

