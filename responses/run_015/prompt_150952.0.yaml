answer: |-
  Here is the **Expressivist Consistency Checklist**. It is designed to be run in under ten minutes per scene. It does not require a philosophy degree, but it does require you to treat moral sentences as "attitudes" (boo/hurray) rather than "facts" (true/false) for the duration of the test.

  ### The 10-Minute Expressivist Consistency Checklist

  **Step 1: Identify the Speech Act**
  *   **Action:** Highlight every sentence containing a moral predicate (e.g., *wrong, good, ought, duty, cruel*).
  *   **Test:** Ask: "Is the character stating a fact about the universe, or expressing a feeling/command?"
  *   **Mark:** Label fact-claims as **[F]** and attitude-expressions as **[A]**.
      *   *Expressivist Ideal:* All moral sentences should be **[A]**.
      *   *Realist Slip:* If a character treats a moral sentence as a verifiable fact (e.g., "It is true that stealing is wrong"), mark it **[F]**.

  **Step 2: Check for Embedding, Quotation, or Counterfactuals**
  *   **Action:** Circle any logical operators surrounding the highlighted moral sentences. Look for:
      *   **Conditionals:** "If... then..."
      *   **Disjunctions:** "Either... or..."
      *   **Negations:** "It is not the case that..."
      *   **Moral Parentheses:** Quoting another's moral claim (e.g., "If his claim that 'X is wrong' holds...").
      *   **Counterfactuals:** Planning obligations in non-actual worlds (e.g., "If I had lied, I would be guilty").
  *   **Test:** Does the moral sentence lose its emotional force inside the operator?
      *   *Example:* In "If stealing is wrong...", the character isn't actually saying "Boo stealing!" They are hypothesizing the attitude.
  *   **Flag:** If a moral sentence is embedded, mark it **[EMB]**.

  **Step 3: Apply the Consistency Test**
  *   **Action:** Compare the **[A]** marks from Step 1 with the **[EMB]** marks from Step 2.
  *   **The Rule:** If a character is a consistent expressivist, they cannot treat an embedded moral sentence as a *truth-apt proposition* (something that can be true or false) while treating an unembedded one as an *attitude*.
  *   **The Judgment Call (⚠️):** You must decide: **Is this character a philosopher or a human?**
      *   If they are a philosopher arguing expressivism: They must not treat embedded morals as facts.
      *   If they are a human being: They will naturally treat embedded morals as facts.
      *   **Flag:** Any **[EMB]** sentence that functions logically like a math equation (e.g., Modus Ponens) is technically incoherent for a strict expressivist. Mark these **[LOGIC LEAK]**.

  ***

  ### Application to Your Draft Lines

  Here is the procedure applied to your three specific lines.

  **Line A:** *"Murder is wrong, and if murder is wrong then the judge should halt the trial."*
  *   **Step 1:** "Murder is wrong" (First instance) = **[A]** (Attitude). "Murder is wrong" (Second instance) = **[A]**?
  *   **Step 2:** The second instance is inside an "If... then" structure. Mark **[EMB]**.
  *   **Step 3:** The sentence uses Modus Ponens logic (P, If P then Q, therefore Q). This requires "Murder is wrong" to have the same meaning in both instances. But for an expressivist, the first is an attitude ("Boo murder!") and the second is a hypothesis ("If Boo murder!..."). The logic breaks.
  *   **Verdict:** **[LOGIC LEAK]**. Technically incoherent on expressivist grounds.

  **Line B:** *"Either torture is wrong or i've completely lost my moral compass."*
  *   **Step 1:** "Torture is wrong" = **[A]**.
  *   **Step 2:** Embedded in "Either... or". Mark **[EMB]**.
  *   **Step 3:** Disjunctions require truth-apt propositions. You can't really have an "attitude" as one half of an "either/or" choice in strict expressivism.
  *   **Verdict:** **[LOGIC LEAK]**. However, this reads as dramatic characterization, not logical argumentation.

  **Line C:** *"She doesn't believe bribery is wrong, yet she refuses to take the money."*
  *   **Step 1:** "Bribery is wrong" = **[A]**.
  *   **Step 2:** Embedded in a belief report ("She doesn't believe..."). Mark **[EMB]**.
  *   **Step 3:** Expressivists translate "believes X is wrong" as "has an attitude against X." This sentence claims she lacks the attitude but acts *as if* she has it.
  *   **Verdict:** **Consistent.** This highlights a psychological contradiction (action vs. attitude) rather than a logical one. It works fine under expressivism.

  ***

  ### The "Keep It Anyway" Recommendation

  **Line A is the one you should keep.**

  *   **Why flag it?** The procedure flags it as **[LOGIC LEAK]** because it commits the Frege-Geach error. It treats "Murder is wrong" as a fact that can be plugged into a conditional equation, which strict expressivism says is impossible (you can't condition an emotion).
  *   **Why keep it?** Because real people talk like Line A. Even committed expressivists speak like moral realists when constructing arguments. If you "fix" this to be philosophically pure (e.g., *"I disapprove of murder, and if I disapprove of murder, the judge should..."*), the character sounds robotic and unnatural.
  *   **Consistency Sacrificed:** You are sacrificing **semantic uniformity**. You are allowing the moral sentence to mean "I hate this" in the first clause and "The proposition that I hate this is true" in the second clause. Readers will not notice; philosophers will.

  ***

  ### Hard Cases: How to Handle Them in the Checklist

  **1. Moral Parentheses**
  *   *Example:* "If what she said—'stealing is wrong'—holds, then..."
  *   **Procedure Adjustment:** In Step 2, check if the moral claim is in quotation marks.
  *   **Rule:** If quoted, it is **Mentioned**, not **Used**.
  *   **Judgment Call:** The character is treating the *sentence* as an object, not the *morality* as a fact. This is logically safe for expressivism. Do not flag as **[LOGIC LEAK]** unless the character implies the quote corresponds to a real-world fact.

  **2. Counterfactual Moral Planning**
  *   *Example:* "If I had stolen, I would have been bad."
  *   **Procedure Adjustment:** In Step 2, flag any "If I had..." or "Would have..." structures.
  *   **Rule:** Expressivism struggles here because you are expressing an attitude toward a non-existent event.
  *   **Judgment Call:** Treat this as **Hypothetical Attitude**. The character is saying, "In that world, I would have Boo'd myself." It is safe to keep, provided the character isn't claiming the "badness" exists independently of their attitude.

  ***

  ### Honest Limitations: What This Checklist Cannot Do

  **1. Sincerity vs. Irony**
  *   **Failure Point:** The checklist analyzes logical form, not tone. It cannot tell if a character is saying "Murder is wrong" ironically.
  *   **Workaround:** You must manually tag ironic dialogue. If a line is ironic, skip Step 1. Irony suspends the speech act entirely.

  **2. Mixed Description/Evaluation (The "Wrongness" Noun)**
  *   **Failure Point:** Sentences like *"The wrongness of the act sparked the riot."*
  *   **Why it fails:** This turns "wrongness" into a concrete object (a fact) that causes physical events. Strict expressivism says "wrongness" isn't a thing; it's a reaction.
  *   **Verdict:** The checklist will flag this as **[F]** (Fact-claim).
  *   **Advice:** **Ignore the flag.** This is metaphor. If you force characters to avoid reifying morals ("The crowd's anger at the act sparked the riot"), you destroy the prose voice. Voice > Logic.

  **3. Voice Matters More Than Logical Form**
  *   **Failure Point:** A character might be inconsistent because they are confused, lying, or emotional.
  *   **Verdict:** The checklist assumes a rational agent. If a character is in crisis, their moral logic *should* break.
  *   **Rule of Thumb:** If the inconsistency reveals character depth, keep the **[LOGIC LEAK]**. If the inconsistency is accidental (the author got confused), fix it.

  **Final Sign-Off:**
  Run this checklist only on scenes where moral philosophy is *thematic*. In action scenes or romantic beats, skip it. If Line A sounds like your character, keep the logic leak. Your readers want truth to life, not truth to meta-ethics.
