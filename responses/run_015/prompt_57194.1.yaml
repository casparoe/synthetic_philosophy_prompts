  ## Cut-Down Version (If 90 Mins feels too tight)
  If you arrive and the room feels slow, cut **Proposition C**.
  *   Run with only A and B.
  *   Reduce Pricing Phase to 10 minutes.
  *   Reduce Bookie Proof Time to 7 minutes.
  *   This saves 15 minutes for the Debrief, which is where the actual learning happens.
  *   *Risk:* With only 2 props, the link is more obvious. Keep the "Control" prop (C) if possible to mask the pair. **Recommendation:** Keep all 3 props, cut the "Bookie Selection" time. You (the Prof) act as the Bookie if no student volunteers quickly. This guarantees the proof happens smoothly.
