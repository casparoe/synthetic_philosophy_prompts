  # Seminar Activity: The Logical Bookie

  ## 1. Game Overview
  **Title:** The Cost of Coherence
  **Goal:** Demonstrate that Dutch Book arguments against incoherent credences assume logical omniscience is free. When logical insight requires computational work, the "guaranteed loss" of a Dutch Book becomes contingent on the Bookie's ability to do that work.
  **Players:** 12 Students (Betters), 1 Bookie (Volunteer), 1 Arbiter (You).
  **Currency:** "Epistemic Credits" (EC). Use poker chips, printed tokens, or just a scoreboard.
  **Duration:** 45 Minutes Game, 45 Minutes Debrief.

  ## 2. Materials List
  *   **Betting Sheets:** 12 copies (see *Appendix A*).
  *   **Proposition Cards:** 3 large cards displayed at the front (see *Section 4*).
  *   **The Envelope:** A sealed manila envelope labeled "DO NOT OPEN UNTIL SETTLEMENT." Inside: The truth values of the propositions and the mathematical proof of the equivalence.
  *   **Whiteboard & Markers:** Essential for the Bookie's proof.
  *   **Timer:** Visible to the room.
  *   **Tokens:** 100 EC per student (can be paper slips).

  ## 3. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Distribute tokens (100 EC each) and Betting Sheets. Explain rules. Phones/Laptops in bags. |
  | **05-20** | **Pricing** | Students assign credences (0-100%) to the 3 Propositions. They must spend tokens to "lock in" prices (mechanic detailed below). No talking. |
  | **20-25** | **Bookie Selection** | Ask for a volunteer Bookie. They collect the Betting Sheets. They have 5 minutes to scan for incoherence (price mismatches on linked props). |
  | **25-30** | **The Challenge** | Bookie announces which student they are targeting and which propositions form the "Arbitrage." |
  | **30-40** | **The Work** | **Crucial Phase.** To claim the arbitrage profit, the Bookie must *prove* the logical connection on the whiteboard within 10 minutes. |
  | **40-45** | **Settlement** | Open the Envelope. Settle bets based on Truth Values. Apply "Arbitrage Penalty" only if Bookie succeeded in proof. |
  | **45-90** | **Debrief** | Guided discussion (Script provided in Section 6). |

  ## 4. The Propositions (Answer Key & Recipe)

  You need three propositions. Two are logically equivalent (hidden), one is a control.
  **Constraint:** All are mathematically settled. None are trivially solvable in 3 minutes without tools. All are verifiable by you quickly.

  **Proposition A:** "There exists an integer $x$ such that $x^2 \equiv 2 \pmod{17}$."
  **Proposition B:** "$2^8 \equiv 1 \pmod{17}$."
  **Proposition C (Control):** "The number 19 is prime."

  ### The Truth Values (For Your Eyes Only)
  *   **A is TRUE.** ($6^2 = 36 = 2 \times 17 + 2$).
  *   **B is TRUE.** ($2^4 = 16 \equiv -1 \pmod{17} \rightarrow 2^8 \equiv (-1)^2 \equiv 1$).
  *   **C is TRUE.** (Trivial, ensures students engage with the sheet).

  ### The Hidden Link (In the Envelope)
  **Euler's Criterion:** For an odd prime $p$ and integer $a$ not divisible by $p$, $a$ is a quadratic residue modulo $p$ (Prop A) **if and only if** $a^{(p-1)/2} \equiv 1 \pmod p$ (Prop B).
  *   Here $p=17, a=2$. $(17-1)/2 = 8$.
  *   Therefore, **A $\iff$ B**.
  *   *Note:* Most philosophy majors will not know Euler's Criterion. CS majors might recognize the form but will still need to compute the modular exponentiation to be sure.

  ### Verification Recipe (For You)
  If a student disputes the answer during settlement:
  1.  **For A:** Calculate squares mod 17 until you hit 2. $1, 4, 9, 16, 25(8), 36(2)$. Stop at 6. It's True.
  2.  **For B:** Compute powers of 2. $2, 4, 8, 16(-1), 32(-2), 64(-4), 128(-8), 256(1)$. It's True.
  3.  **For Link:** Read the Euler's Criterion note in the envelope.

  ## 5. Scoring & Mechanics

  ### The Betting Sheet
  Students have 100 EC. For each Proposition, they must:
  1.  Assign a Credence $C$ (0 to 100).
  2.  **Pay a Fee:** They pay $|C - 50|$ EC to the pot. (This discourages defaulting to 50% everywhere).
  3.  **The Payoff:**
      *   If Proposition is **TRUE**: They receive $C$ EC from the pot.
      *   If Proposition is **FALSE**: They receive $(100 - C)$ EC from the pot.
      *   *Note:* This is a linear scoring rule variant that rewards accuracy. Maximizing expected value requires setting $C$ equal to true credence.

  ### The Bookie's Exploit (The "Work" Constraint)
  1.  The Bookie looks for a student where $|C_A - C_B| \ge 20$. (e.g., Student prices A at 80%, B at 40%).
  2.  The Bookie declares: "I am Dutch Booking Student X."
  3.  **The Condition:** The Bookie claims the difference in the student's tokens as profit.
  4.  **The Cost:** To validate this claim, the Bookie must **prove A $\iff$ B** on the whiteboard within 10 minutes.
      *   **If Bookie Succeeds:** The student is penalized the difference (incoherence tax). Bookie gets the points.
      *   **If Bookie Fails:** The bets settle normally based on Truth Values. Since A and B are *both* True, the student might still lose points for being inaccurate, but the *incoherence penalty* is waived. The Bookie gets nothing extra.
      *   *Pedagogical Point:* The incoherence only becomes a *sure loss* exploitable by another agent if that agent can pay the computational cost to see the logic.

  ## 6. Debrief Guide (45 Minutes)

  ### Phase 1: The Reveal (5 Mins)
  Open the envelope. Read the Euler's Criterion link.
  *   **Ask:** "Who priced A and B differently?" (Hands will go up).
  *   **Ask:** "Who feels irrational?" (Most will).
  *   **Ask:** "Bookie, did you get the money?" (Depends on their proof success).

  ### Phase 2: Mapping the Vocabulary (15 Mins)
  Now introduce the terms.
  *   **Logical Omniscience:** The assumption that you know all logical consequences of your beliefs instantly. The game broke this.
  *   **Dutch Book Argument:** Usually proves coherence is required for rationality.
  *   **Bounded Rationality:** The game showed that coherence has a *price* (the work to find the link).

  ### Phase 3: Handling The Objectors (20 Mins)

  **Objector 1: The "Calculation" Student**
  *   *Claim:* "I wasn't *uncertain*. I just hadn't done the math yet. My credence wasn't a probability, it was a placeholder. So Bayesianism doesn't apply."
  *   *Response:* "If it was just a placeholder, why did you pay different fees for A and B? You treated them as different risks. If you truly believed they were identical but unknown, your prices should have matched. You *were* uncertain about the logical relation, which means you were uncertain about the truth of the propositions *given your current state*. Bayesianism demands you model *your* state, not God's."

  **Objector 2: The "Broken Conditioning" Student**
  *   *Claim:* "When the Bookie proved the link, my credence changed without new *empirical* evidence. I just thought harder. So Conditionalization is broken. We don't update on evidence, we update on computation."
  *   *Response:* "This is the strongest objection. Two replies:
      1.  **Evidence of Thought:** The fact that 'I have now derived P' *is* new empirical evidence about your own mental state. You conditionalize on 'I have just proven A $\iff$ B'.
      2.  **Logical Induction:** Alternatively, maybe standard Bayesianism *is* too idealized for math. We might need a theory of 'Logical Induction' where credences evolve as computation proceeds, rather than jumping via conditionalization. But note: you still shouldn't be Dutch-Bookable *after* the calculation. The norm remains, the mechanism is just harder."

  ### Phase 4: Limits & Distortions (5 Mins)
  Be honest about what the game hid.
  *   **Time Pressure:** Real math research isn't a 10-minute sprint. The "cost" here was artificial stress, not deep cognitive load.
  *   **The Bookie's Advantage:** In reality, *you* are often your own Bookie. The cost of spotting your own incoherence is the same as spotting it externally. The game externalized the cost to make it visible.
  *   **Truth Fixity:** We used math. In ethics or metaphysics, the "truth" might not be as sealed as $2^8 \pmod{17}$. The problem is harder there.

  ## 7. Limitations (Honesty Check)

  **What this game fails to reproduce:**
  1.  **Endogenous Computation:** In the game, the "work" is done by the Bookie to *exploit* you. In reality, the work is done by *you* to *fix* yourself. The game externalizes the cost of coherence, whereas the philosophical problem is internal.
  2.  **The Normative Force:** The game makes coherence look like a *pragmatic* constraint (don't lose tokens). It doesn't fully capture the *epistemic* norm (you *ought* to believe the truth). Students may walk away thinking "It's only irrational if someone catches me," rather than "It's irrational because my beliefs don't match the world."
  3.  **Complexity:** The math problems are "hard" but solvable. Real logical omniscience problems involve undecidable propositions or proofs too long for the universe. This game suggests that with enough time, you *could* be omniscient. True logical uncertainty acknowledges you *never* will be.

  **How to supply this by hand:**
  In the final 5 minutes, explicitly state: "In this game, the answers were in the envelope. In real life, there is no envelope. The cost of computation isn't just time tokens; it's that some truths are inaccessible to us period. That is where Bayesianism truly strains."

