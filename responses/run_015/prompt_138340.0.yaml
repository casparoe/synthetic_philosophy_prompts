answer: |-
  \answer{Contradictory outcome envelopes expose narrative construction.}

  ### 1. Design Decision: The Twist
  Use the **Two-Envelope Version** (Half get Outcome A, Half get Outcome B, True Outcome is C).
  *   **Why:** The False-Outcome version (everyone gets the same wrong ending) teaches hindsight bias well, but the Two-Envelope version teaches *contingency* first. When Group A argues convincingly for "Collapse" and Group B argues convincingly for "Mutiny" using the *same* evidence, students visibly see that narrative inevitability is manufactured, not found. When you then reveal *both* were wrong (the reality was "Nothing"), you compound the lesson: not only was the story constructed, it was constructed around a phantom climax.
  *   **Managing the "Trick" Feeling:** Do not apologize. Frame the deception as the data. Say: "The discomfort you feel right now is the lesson. The evidence didn't change; your need for an ending did."
  *   **If They Guess the Twist:** If a group says, "Nothing happened, did it?" during Phase 2, mark their sheet with a star. In the debrief, ask them: "Why did you write the explanation you were handed instead of your guess?" This highlights the institutional pressure to conform to the "record."

  ### 2. The Dossier: Station 9 Winter Log (1984)
  **Context:** An isolated Arctic research station. Winter lockdown. Supplies limited.
  **Instructions to Students:** Read all 14 items. They are chronological. Do not share with neighbors yet.

  1.  **Oct 10, Station Log:** Winter lockdown initiated. 12 personnel on site. Fuel reserves nominal.
  2.  **Oct 15, Memo (Chief to Staff):** Morale meeting scheduled for Nov 1. "Address concerns early."
  3.  **Oct 22, Maint. Log:** Generator 2 emitting irregular vibration. Engineer notes: "Monitor closely."
  4.  **Oct 28, Radio Log (External):** Supply ship delayed by ice. ETA pushed to March.
  5.  **Nov 02, Maint. Log:** Fuel tanks measured at 98% capacity. Leak suspicion unfounded.
  6.  **Nov 10, Personal Letter (Cook to Family):** "Everyone is tense. Rations tightened slightly."
  7.  **Nov 15, Inventory:** Missing crate of medical supplies. Location unknown. Chief orders search.
  8.  **Nov 20, Station Log:** Temperature drops to -40C. Heating load increased 15%.
  9.  **Nov 25, Radio Log (External):** Weather window closing. No rescue possible until spring.
  10. **Dec 01, Memo (Engineer to Chief):** Requesting generator shutdown for repair. Risk of failure rising.
  11. **Dec 05, Incident Report:** Shouting match in mess hall between Chief and Engineer. No physical contact.
  12. **Dec 10, Station Log:** Vibration in Generator 2 ceased spontaneously. Cause unclear.
  13. **Dec 15, Weather Log:** Storm system dissipating. Temperatures rising slightly.
  14. **Dec 20, Station Log:** Winter routine resumed. No further incidents reported.

  **Instructor Key (Do Not Distribute):**
  *   **Dead Ends (Look decisive, lead nowhere):** Item 3 (Vibration), Item 7 (Missing Crate), Item 11 (Shouting Match).
  *   **Counter-Indicators (Point away from crisis):** Item 5 (Fuel Full), Item 13 (Weather Clearing).
  *   **True Outcome:** Status Quo (Item 14).
  *   **Honest Forecast:** A rational distribution given the ambiguity would be roughly equal (25% each) or slightly weighted to Status Quo if reading Item 5/13 carefully. Most will overweight Crisis.

  ### 3. Rules, Scoring, and Credit
  **Phase 1 (Individual):**
  *   Distribute **Forecast Sheet**.
  *   Task: Assign probabilities (total 100%) to four outcomes:
      1.  **Catastrophe** (Generator fails, station lost).
      2.  **Mutiny** (Staff revolt, forced evacuation).
      3.  **Rescue** (External intervention required).
      4.  **Status Quo** (Winter completed without major incident).
  *   **Scoring Rule (Brier-Style Simplified):** Collect sheets. You calculate credit later.
      *   *Formula:* $Score = 100 \times (1 - \sum (p_i - o_i)^2)$.
      *   *Simplification for Class:* Tell students: "Your credit depends on how much probability you assigned to the *Actual* Outcome, penalized for overconfidence on wrong outcomes. Honesty pays; guessing hurts."
      *   *Credit Conversion:* Top 25% of scores get 1.0 seminar credit, next 50% get 0.5, rest 0.2 (participation). This creates stakes without monetary risk.

  **Phase 2 (Group):**
  *   Divide class into 4 groups of 5.
  *   Give Groups 1 & 2 **Envelope A** (Contains text: "Outcome: Catastrophe. Generator failed Dec 12.").
  *   Give Groups 3 & 4 **Envelope B** (Contains text: "Outcome: Mutiny. Chief ousted Dec 12.").
  *   Task: Write a 150-word "Official History" explaining why this outcome was inevitable based on the dossier.
  *   **Constraint:** You must cite at least 5 dossier items.

  **Phase 3 (Metrics):**
  *   On the back of their explanation, students calculate:
      1.  **Dead-End Audit:** How many of your 5 cited items are Dead Ends (3, 7, or 11)?
      2.  **Compression Ratio:** Total words in explanation (150) divided by Number of Dossier Items *ignored* completely.

  ### 4. Minute-by-Minute Timeline (90 Minutes)
  *   **00-05:** Intro. Hand out Dossier. No talk.
  *   **05-15:** Phase 1: Individual Forecast. Seal sheets in envelopes. Collect.
  *   **15-20:** Form Groups. Hand out Outcome Envelopes (A or B).
  *   **20-45:** Phase 2: Group Deliberation & Writing. (Instructor circulates, notes groups using Dead Ends).
  *   **45-55:** Phase 3: The Clash. Group 1 reads their "Inevitable Catastrophe." Group 3 reads their "Inevitable Mutiny." (Same evidence, opposite certainty).
  *   **55-65:** The Reveal. Announce True Outcome (Status Quo/Item 14). Hand out Scoring Key. Students calculate their Phase 1 score.
  *   **65-85:** Debrief (See below).
  *   **85-90:** Collect materials. Dismiss.

  ### 5. Debrief Plan
  **Goal:** Name the biases only now.
  1.  **The Collision (Hindsight Bias):** Ask Phase 1 students who assigned <10% to Status Quo to raise hands. Ask: "Looking at Item 14 now, why did that seem unlikely then?"
      *   *Lesson:* Knowing the end state makes the path look steeper than it was.
  2.  **The Mirror (Narrative Fallacy):** Ask Group 1 and 3 to compare cited items.
      *   *Lesson:* You both used Item 11 (The Fight) as a cause. For Group 1, it was 'stress leading to error.' For Group 2, it was 'precursor to revolt.' The event didn't change; the story did.
  3.  **The Metrics:** Ask for average Dead-End Audit scores.
      *   *Lesson:* If your average is >1, you turned noise into signal. History is mostly noise; explanation requires silence.
  4.  **Naming:** Write **Hindsight Bias** and **Narrative Fallacy** on the board. Define them using *their* worksheets as examples.

  ### 6. Troubleshooting & Limitations
  **Predictable Failure 1: The "It Was All Chance" Student.**
  *   *Scenario:* A student argues that because nothing happened, the exercise is void.
  *   *Handle:* "You are right that chance played a role. But your group just wrote 150 words proving it *didn't* look like chance to you once you had an ending. That tension is the subject of this course."
  **Predictable Failure 2: Feeling Trickery.**
  *   *Scenario:* Students feel manipulated by the false envelopes.
  *   *Handle:* Validate. "Good. Historians feel this when they find a new archive that contradicts their thesis. The discomfort is the method working."
  **Predictable Failure 3: Time Overrun.**
  *   *Handle:* Cut the Metrics calculation. Do the Dead-End Audit verbally ("Raise hand if you cited Item 3").
  **Fundamental Limitation:**
  *   **The Archive Filter:** This exercise localizes distortion in the *explainer* (the student). In reality, distortion lives in the *record* (Item 14 exists because someone chose to write it; Item 7 exists because someone noticed the missing crate). The dossier arrives fully formed; real archives arrive broken. You must supply this in words during the debrief: "You struggled to make sense of this clean set of 14 items. Imagine doing this with 14 boxes of rotting letters where 90% are missing."

  ### 7. Final Note on Mechanics
  The session succeeds only if the Phase 2 envelopes are strictly incompatible yet equally supportable by the text. If one outcome is clearly impossible given the dossier, the narrative fallacy won't stick. Ensure Item 5 (Fuel Full) is ambiguous enough to be ignored by the "Catastrophe" group (e.g., "Fuel was full, but engine was broken") and Item 11 (Fight) is vague enough to support Mutiny (e.g., "Ideological split") vs Catastrophe (e.g., "Leadership breakdown").

  \answer{Contradictory outcome envelopes expose narrative construction.}
