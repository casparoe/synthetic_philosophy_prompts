answer: |-
  Good morning. Welcome to "The Boundary of Calling: Work, Leisure, and the Thirty-Five-Hour Limit."

  Looking around this room, I see a division that is often kept separate, but today must be brought into conversation. On one side, we have those who have mapped the history of labor, who understand the theological weight of the "calling" and the legal architectures of the thirty-five-hour week. On the other, we have those who have stood on picket lines, who have negotiated contracts, and who have sat with families grieving deaths caused by overwork. Some of you speak in the language of structures and ethics; others speak in the language of bodies and hours. Both languages are necessary here. If we speak only in theory, we risk forgetting that exhaustion kills. If we speak only in immediate demands, we risk missing the deeper stories about why we work at all.

  We are gathered to discuss a limit. But a limit is not just a number on a timesheet. It is a border between two competing claims on human life.

  On one side stands the claim of protection. We know the evidence. When work expands without boundary, health collapses. The legal recognition of death by overwork in Japan was not a philosophical breakthrough; it was a medical necessity. For the organizers and advocates in this room, the thirty-five-hour limit is a shield. It is a barrier erected against the erosion of life by profit. To argue for less work is, fundamentally, to argue for survival. In this light, leisure is the time reclaimed from exploitation. It is the space where a worker becomes a person again.

  But if we stop there, we risk a different error. We risk implying that work is merely a burden to be endured, a tax on life rather than a part of life itself. For many, labor is not just a means to a paycheck; it is a source of dignity, community, and purpose. The idea of a "vocation" persists not because employers invented it, but because people experience their contributions as meaningful. If we argue for reduced hours without honoring the human desire to contribute, we may inadvertently strip labor of its dignity. We cannot protect the worker by dismissing the work.

  Conversely, if we honor the vocation without insisting on the limit, we apologize for exploitation. We cannot say that work is meaningful if that meaning is used to justify exhaustion. We cannot celebrate the "calling" if the call leads to the grave.

  This is the tension that must hold this workshop together. It is not a problem to be solved by lunchtime on day two. It is a friction that must remain hot. I ask that we resist the urge to settle this too cleanly. Do not let us agree simply that "balance" is good. Balance is a static image; what we are discussing is a struggle.

  For the scholars here, I ask that you keep your concepts grounded in the physical reality of fatigue. For the organizers, I ask that you allow us to question what "rest" means when the culture of work is so deeply embedded in our identity. We must be able to say that reducing hours saves lives without suggesting that work lacks value. We must be able to say that work has value without suggesting that overwork is virtuous.

  Over the next two days, we will not be drafting a policy statement. We will not be issuing a manifesto. We are here to examine the boundary itself. We are here to test whether our current tools are strong enough to hold the weight of this contradiction.

  We begin with a question that remains, by design, unanswered. We are here to determine whether leisure is best understood as a protective limit placed upon vocation, or whether vocation must be reconceived so that leisure is not an exception to work but integral to its meaning.
