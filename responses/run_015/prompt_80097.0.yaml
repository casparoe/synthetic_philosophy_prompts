answer: |-
  # FACILITATOR RUN-SHEET: The Oracle's Wager
  **Seminar:** Logic of Time and Tense  
  **Topic:** Future Contingents (The Sea-Battle Problem)  
  **Duration:** 75 Minutes  
  **Class Size:** 14 Students  
  **Materials Needed:** 14 identical envelopes, 14 slips of paper, a box/basket, whiteboard, timer.

  ---

  ## 1. THE RULES (For the TA)
  *Read these verbatim or from a prepared script to ensure precision. Do not improvise the mechanics.*

  **The Proposition:**
  "We are investigating the proposition $P$: 'A sea battle will occur tomorrow.'"

  **The Mechanism (The Oracle's Law):**
  "The truth of $P$ is not determined by weather, generals, or chance. It is determined solely by this room, right now.
  *   If **8 or more** of you vote that $P$ is **TRUE**, then $P$ becomes **TRUE**. (There will be a battle.)
  *   If **7 or fewer** of you vote that $P$ is **TRUE**, then $P$ becomes **FALSE**. (There will be no battle.)
  *   In the event of a 7-7 tie, the default is **FALSE** (No Battle). A battle requires active majority consent."

  **The Wager:**
  "You are not just voting; you are betting on the truth of $P$.
  *   You must write either **TRUE** or **FALSE** on your slip.
  *   You will place the slip in an envelope, seal it, and deposit it in the box.
  *   **Payoff:** If your slip matches the final outcome determined by the count, you win **5 Participation Points**. If your slip does not match, you get **0 Points**."

  **The Constraints:**
  1.  **Silence:** Once the rules are read, no talking is permitted until the envelopes are sealed.
  2.  **Secrecy:** Do not show your slip to anyone.
  3.  **Simultaneity:** All envelopes must be in the box by the time the timer hits zero.
  4.  **Commitment:** Once sealed, no changes allowed.

  ---

  ## 2. PAYOFF SCHEME & RATIONALE
  **Stakes:** 5 Course Participation Points per student (adjust to your currency).
  **Why Stakes Matter:** If the bet is costless, students will treat this as a logical puzzle or a joke. They might vote randomly or altruistically. By attaching value to *being right*, you force them into the stance of a **predictor**. They must try to align their belief with the *fact*. The tension arises because they are trying to predict a fact that does not exist until they finish predicting it. The stakes force them to care about the *truth value*, not just the outcome.

  ---

  ## 3. ROLES & TIMELINE (75 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00:00 - 00:10** | **Introduction** | **Facilitator:** Introduce the concept of "Future Contingents." Do **not** explain the Sea Battle argument yet. Simply state: "Today we are testing whether statements about the future are already true or false." |
  | **00:10 - 00:20** | **Rule Setup** | **Facilitator:** Read **The Rules** (Section 1) exactly. Write the Payoff and the Majority Rule (8+ vs 7-) on the board. Answer clarifying questions *only* about mechanics, not strategy. |
  | **00:20 - 00:25** | **Deliberation** | **Students:** Silent thought time. They must decide what to write. **TA:** Walk around. Ensure no non-verbal signaling. If asked "What should I do?", reply: "You want to be right. What is true?" |
  | **00:25 - 00:30** | **Commitment** | **Students:** Write, seal, deposit. **TA:** Collect box. **Crucial:** Once the last envelope is in, declare: "The future is now fixed. The votes are cast. The truth value is determined, though unknown to us." |
  | **00:30 - 00:40** | **The Count** | **TA:** Open envelopes one by one. Record tally on board (Tally marks for TRUE vs FALSE). Do not announce the winner until the end. Let the tension build as the count nears 7. |
  | **00:40 - 00:45** | **The Reveal** | **TA:** Announce the final count and the Outcome (Battle/No Battle). Distribute points. |
  | **00:45 - 01:15** | **Debrief** | **Facilitator:** Lead the discussion (see Section 4). |

  ---

  ## 4. DEBRIEF GUIDE (Mapping Activity to Argument)
  *Do not lecture. Ask these questions in order. Let the silence hang.*

  **Phase 1: The Moment of Fixity (The "Already True" Sting)**
  *   **Ask:** "At 00:30, when the last envelope went into the box, was the outcome already settled?"
  *   **Expected Answer:** Yes (mechanically).
  *   **Follow-up:** "So, at 00:25, when you were writing your slip, was it already true or false that the Battle would happen?"
  *   **The Trap:** If they say "Yes," ask: "Then your vote didn't change anything; you were just revealing what was already the case. Your agency was an illusion." If they say "No," ask: "Then what were you betting on? You can't bet on something that isn't true or false yet."
  *   **Philosophical Link:** This maps to the **Bivalence Premise**. They feel the pressure that if a proposition about the future has a truth value *now*, the future is fixed *now*.

  **Phase 2: The Predictor's Dilemma (Agency vs. Revelation)**
  *   **Ask the Winners:** "Did you win because you *made* it happen, or because you *knew* it would happen?"
  *   **Ask the Losers:** "Was your bet false when you wrote it, or did it become false?"
  *   **Philosophical Link:** This maps to the **Fatalism Conclusion**. If the truth exists now, our deliberation is mere "revealing" of the script. If the truth depends on our vote, then logic (bivalence) seems to break down during the deliberation phase.

  **Phase 3: The Self-Referential Twist**
  *   **Ask:** "In a normal bet (like a coin flip), the world decides the outcome. Here, who decided?"
  *   **Point:** "You did. But you tried to act as if *the world* decided. You tried to predict yourselves."
  *   **Philosophical Link:** This exposes the tension in **asserting truth claims about the future**. To claim "It is true now" feels like closing the future. To claim "It is open" feels like refusing to assign truth values.

  ---

  ## 5. TROUBLESHOOTING (Predictable Failures)

  **1. The Coordination Loop ("I'll vote Yes if you vote No")**
  *   **Risk:** Students try to game the system to ensure everyone wins (e.g., agreeing beforehand that 8 vote True, 6 vote False).
  *   **Prevention:** Enforce the **Silence Rule** strictly from 00:10 onwards. If you hear whispering, warn the class that the "Oracle's Law" is void if collusion is detected, and everyone gets 0 points.
  *   **Mitigation:** If they succeed in coordinating, the activity fails philosophically (it becomes a contract, not a prediction). In the debrief, highlight this: "You avoided the logical problem by making a social contract. But the Sea Battle problem isn't about contracts; it's about reality."

  **2. Refusal to Commit (The "Null" Vote)**
  *   **Risk:** Students write "Maybe" or leave blanks to avoid the trap.
  *   **Prevention:** State clearly: "Only TRUE or FALSE earns points. Anything else is 0 points."
  *   **Mitigation:** If many do this, call it out in debrief: "You refused to assign a truth value. That is actually a valid logical response (rejecting bivalence). But notice how costly it felt to refuse to play the game of truth."

  **3. The "It Doesn't Feel Real" Problem**
  *   **Risk:** Students treat it as a game, not ontology.
  *   **Prevention:** The TA must maintain a solemn, ritualistic tone during the Count. Refer to the box as "The Future."
  *   **Mitigation:** In debrief, ask: "Why did your heart rate go up during the count? If this was just a game, why did it matter?"

  **4. The 7-7 Tie**
  *   **Risk:** Ambiguity.
  *   **Prevention:** The rule is strict: 7-7 = FALSE.
  *   **Mitigation:** If this happens, use it. "The Battle did not happen because not enough of you willed it. Does that mean the future was open until the last vote?"

  ---

  ## 6. LIMITATIONS & BRIDGING (Instructor's Note)
  *This activity is a special case. You must explicitly bridge the gap in the final 10 minutes.*

  **What This Activity Cannot Reproduce:**
  1.  **Independence:** In this activity, the future is *dependent* on the students. In the real Sea Battle problem, the battle is *independent* of the students' beliefs. The students here are gods; in the real problem, they are observers.
  2.  **Ontological Openness:** Here, the future is fixed *mechanically* by the votes. The real problem asks if the future is fixed *logically* by the law of excluded middle, even without votes.
  3.  **The "Sting" Source:** Here, the fatalism comes from *causality* (votes cause outcome). In the real argument, fatalism comes from *truth* (truth implies necessity).

  **How to Bridge (The Closing Lecture):**
  "You just experienced a future fixed by your own hands. It felt constrained because you couldn't know the majority while being part of it.
  Now, remove yourselves from the equation. Imagine the Sea Battle depends on generals you cannot contact. Imagine no vote exists.
  If the statement 'There will be a battle' is **True** right now (just like your envelope was sealed), does it matter that you didn't vote?
  The sting you felt—that your deliberation was just revealing a settled fact—is exactly Aristotle's fear.
  In the activity, *you* settled the fact. In the real world, if Logic settles the fact, then Nature is just playing out a script written by the Law of Excluded Middle.
  The activity made you feel the **loss of agency**. The philosophical argument claims that **logic itself** removes agency, even without an Oracle."

  **Final Instruction to TA:**
  "End the session on that bridge. Do not resolve the paradox. Leave them with the feeling that logic might demand a price (fatalism) that reality refuses to pay."
