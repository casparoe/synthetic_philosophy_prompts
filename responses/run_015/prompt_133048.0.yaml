      *   *Nuance:* The "Circularity" is often framed as: "To define intervention, you need to know what is causally relevant." Interventionist reply: "We define intervention via *independence* from other variables in the model, not via causal knowledge per se." (The instrumental variable logic).
      *   *Key Defeater:* The "Problem of Old Evidence" for Interventionism. If we can't intervene (e.g., moon phases and tides historically), do we lack causal concepts? Interventionists say "Hypothetical Intervention." But is that just a disguised counterfactual?

