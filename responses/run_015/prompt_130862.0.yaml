answer: |-
  The flaw in your argument lies in **Step (6)**.

  ### Diagnosis: The Equivocation of Power

  Step (6) asserts that a permanent administrative class exercising *de facto* legislative influence constitutes a class of "career politicians in all but name." This step appeared sound because it draws upon the well-documented phenomenon of bureaucratic capture (the "Iron Triangle"), where unelected officials shape policy through expertise and longevity. It feels defensible because history is replete with examples of agencies outlasting their political masters.

  However, this step relies on a hidden **equivocation** between *influence* and *authority*. A permanent administrator may possess institutional memory and draft legislation, but they lack the democratic mandate to finalize political will. To equate them with "career politicians" is to conflate the *capacity to advise* with the *power to decide*. Your argument assumes that dependency (Step 5) necessarily entails subordination (Step 6), but a well-designed republic can make the administration strictly subordinate to the assembly, regardless of the assembly's turnover.

  ### Pricing the Alternatives

  By rejecting Step (6), you preserve both of your core intuitions without abandoning representation. However, this rejection exacts an institutional price:

  *   **To keep Premise (1) (Legitimacy = Accountability):** You must pay for robust oversight mechanisms. If legitimacy relies on accountability, the random assembly must have the power to audit, fire, and investigate the permanent administration. You cannot simply assume the administration is neutral; you must design "firewalls" (e.g., random audits, transparent drafting processes) that prevent bureaucratic drift from becoming political will.
  *   **To keep Premise (3) (Sortition needs Term Limits):** You must pay for knowledge management systems. If you maintain strict term limits to prevent careerism, you cannot rely on people to store memory. You must invest in codified institutional memory (digital repositories, standardized procedures) that survives personnel changes, ensuring representatives depend on *records* rather than *rulers*.

  If you were forced to weaken a premise instead of rejecting Step (6), weakening **Premise (3)** would be less costly than weakening Premise (1). Premise (1) defines your threshold for democracy; abandoning it surrenders the republic. Premise (3) is a theoretical claim about sortition; you could argue that sortition legitimacy derives from *descriptive representation* (the assembly mirrors the people) rather than prospective accountability, allowing longer terms to build competence. However, this would sacrifice your intuition that careerism corrupts.

  ### Conclusion

  The error is not in your intuitions but in the leap from bureaucratic necessity to political capture. Representation remains possible if you distinguish between the *continuity of the state* (administration) and the *will of the people* (assembly).

