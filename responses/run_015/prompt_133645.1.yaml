answer: |-
  Hey, no worries about the thumbs—typing out dense philosophy on a phone is a pain. But honestly, your intuition isn't muddled at all. You've actually hit on a really serious tension in Dennett's framework that a lot of people gloss over.

  Here's how I'd sharpen that argument for your draft.

  **1. The Crane Needs a Floor**
  Dennett's whole deal is that Natural Selection is the ultimate "crane": a mechanical, bottom-up process that builds complexity without needing a magical "skyhook" (a top-down designer or unexplained miracle) to hold it up.

  But here's the catch: cranes don't operate in a void. They need a foundation. For natural selection to work, you need a specific kind of arena—a fitness landscape with peaks and valleys, or game-theory payoff matrices that define what counts as "winning" (fitness) and "losing" (death).

  Your point is that these landscapes aren't built by selection; they are the *preconditions* for selection. They have to exist *before* the crane starts lifting.

  **2. The Smuggled Skyhook**
  Greedy reductionists want to say the crane does all the work. They treat the boundary conditions (the laws of physics, the logical structure of game theory, the initial state of the environment) as neutral background noise.

  But you're arguing that this background isn't neutral. It's highly structured. For morality to emerge via selection, the "game board" has to be rigged in a very specific way that allows cooperative strategies to survive rather than getting wiped out immediately by defectors.

  If the board itself has the structure necessary to produce morality, but that structure isn't explained by the crane (because it exists prior to the crane), then that structure is functioning as a skyhook. It's an unexplained enabler. The greedy reductionist is smuggling a hook in through the back door of "initial conditions" and pretending it's part of the crane's machinery.

  **3. Why This Collars Greedy Reductionism**
  This isn't just the usual "who designed the designer?" infinite regress. That's a theological objection. Your objection is structural.

  It's about **explanatory debt**.
  *   **The Claim:** The crane explains the complexity.
  *   **The Reality:** The crane only works because the boundary conditions already contain the logical scaffolding for that complexity.

  If the payoff matrices required for moral evolution are just "given" by physics or logic, and those matrices effectively encode the solution before the process starts, then the bottom-up process is just unfolding what was already implicitly top-down. The greedy reductionist claims they are deriving the result from simple parts, but they're actually relying on complex structural premises at the base that they refuse to explain.

  **The Punchline for Your Paper**
  You can frame it like this: **A crane that requires a pre-structured foundation to function isn't a pure crane; it's a crane standing on a hidden hook.**

  Greedy reductionism collapses here because it tries to claim credit for the building process while ignoring that the construction site was already pre-zoned for exactly that kind of building. The "hook" isn't hovering above the conclusion; it's buried in the premises. If you don't account for the specificity of the boundary conditions, you haven't eliminated the skyhook—you've just camouflaged it as "physics" or "logic."

  Does that track with what you're thinking? It's a solid angle—it moves the debate from "is there a designer?" to "how much explanatory work are we letting our initial conditions do for free?"
