answer: |-
  The heater in the psychophysics lab clanked like a dying engine, fighting the January dark outside. It was 3:00 AM. The coffee in my thermos had gone cold an hour ago. On the clipboard, the two scales waited: *Intensity (0–10)* and *Unpleasantness (0–10)*. Most people confuse them. They think a 10 on intensity forces a 10 on unpleasantness. My job was to watch them realize they don't.

  Marcus went first. He was a line cook with burnt forearms and a need for two hundred dollars to fix his transmission. He sat in the rig, arm strapped to the rest, the thermal probe pressed against his thenar eminence.

  "Stimulus rising," I said, watching the temperature gauge climb. Forty-eight degrees. Forty-nine. Fifty.
  "Intensity?"
  "Eight," Marcus said. He was looking at his phone. "Maybe eight-point-five. It's sharp. Like a hot coin."
  "Unpleasantness?"
  "Zero."
  I looked up. "Zero?"
  "It's hot, doc. It's not mad at me." He shrugged. "Just data."

  We ran the battery. Electrical shocks, pressure cuffs, heat pulses. Marcus tracked the physical variables with perfect precision. He could tell me when the stimulus moved two millimeters to the left. He could distinguish burning from stinging. But the *Unpleasantness* column stayed blank. When I asked if he wanted the session to stop, he laughed. "Why? It's not hurting. I'm just sitting here."

  He wasn't enlightened. He was hollow. When I accidentally bumped his arm with the clipboard, he didn't flinch. He just looked at where I'd hit him and said, "You impacted the ulnar nerve. Do it again, I want to check the mapping." He was treating his own body like a schematic. It was useful, sure. But when I handed him the consent form for the next phase—the intervention—he pushed it back.

  "No thanks," he said.
  "It's a localized nerve block. It'll stop the signal coming up the arm. You won't feel the heat."
  "So I won't know if I'm burning?"
  "That's the point. Relief."
  "Relief from what?" He tapped the *Unpleasantness* column on my clipboard. "I'm not suffering. If you numb the arm, I'm blind. I need to know if the stove is on. Why would I pay to lose information?"

  He was right, logically. If pain is just information, and the information isn't bothering you, why delete it? I marked *Declined* and called Sarah in.

  Sarah was twenty-four, wearing a sweater too thin for the weather, shaking so hard the pulse oximeter couldn't get a read. She was here for the rent. She sat down and flinched before I touched her.

  "Okay, Sarah," I said. "We're going to start with a warm air puff. Non-noxious. Just a breeze."
  I triggered the vent. A stream of thirty-degree air hit her forearm.
  "Intensity?"
  She was crying before she answered. "Ten. It's... it's everywhere. It's tearing."
  "Can you localize it? Is it the wrist? The elbow?"
  "It's inside. It's in the bone."
  "Unpleasantness?"
  "Please make it stop. Please."

  She was rating the warm air as a ten in intensity, but her localization was noise. When I moved the stimulus to her other arm, she screamed that her leg was burning. When I turned the machine off, she kept rubbing her skin, convinced the stimulus was lingering. There was no signal coming up the nerve that matched the horror on her face. The sensory channel was static, but the affective channel was screaming at maximum volume.

  We ran the sequence. A soft brush felt like sandpaper. A vibration felt like a fracture. She wasn't tracking the stimulus; she was tracking her own panic. But the panic was real. She was hyperventilating. She grabbed my wrist during a rest period, her grip weak but desperate.

  "Give me the shot," she said.
  "Sarah, the shot blocks the nerve. It stops the signal."
  "Stop the signal. Stop it. I can't... I can't live with this. It won't end."
  "It might not stop the feeling of... dread. It only stops the input."
  "I don't care. Just cut the wire. Please. I'll sign anything."

  She was begging for a solution that shouldn't work. If the suffering wasn't coming from the nerve, blocking the nerve wouldn't help. But she believed the sensory was the cause. She believed that if the input stopped, the hell would end. Marcus had refused the same drug because he knew the input wasn't the problem. Sarah begged for it because she thought it was the only thing she could touch.

  I held the syringe. The protocol allowed for discretionary administration if distress exceeded safety thresholds. Sarah was at threshold. Marcus was below baseline.

  I looked at Marcus. He was watching Sarah cry over a warm breeze, looking puzzled. "She's weird," he whispered. "It's just air."
  "Shut up," I said.

  I turned to Sarah. "This won't fix the unpleasantness. I need you to understand that. You might feel nothing on the skin, but you might still feel... bad."
  "I don't care," she said. "Just make it quiet."

  I swabbed her arm. The needle went in. The lidocaine spread. I waited for the block to take.
  "Okay," I said. "Touch this." I ran a cold tuning fork over her skin.
  "Nothing," she said. "I can't feel it."
  "Good. Now the heat."
  I triggered the probe. Fifty degrees.
  "Nothing," she said. "No sensation."
  "Unpleasantness?"

  She froze. Her eyes went wide. The terror didn't leave. In fact, it sharpened. She could feel the dread, the urge to flee, the conviction that something was destroying her, but she had no location for it. It was free-floating agony. She started to sob, harder than before.
  "It's still there," she whispered. "It's still there and now I can't find it. It's everywhere."

  Marcus leaned forward. "See? Told you. Nothing wrong with the arm."
  "Get out," I said to him.
  "But I finished—"
  "Get out."

  Marcus left, rubbing his own arm, checking the sensation, smiling because he could feel the friction. He was safe. He was intact. He would go home, burn his hand on a pan, and not pull away. He would let damage accumulate because the alarm bell was disconnected.

  Sarah stayed. She was curled in the chair, shaking, suffering from a pain that had no object. She was pure wound without the cut. I looked at the clipboard. *Intensity: 0. Unpleasantness: 10.*

  I had to decide whether to log this as a successful block. Technically, it was. The sensory signal was gone. But the patient was worse off. She was trapped in the affective component, stripped of the sensory context that might have grounded it. Marcus was walking around with a live wire exposed, unbothered. Sarah was drowning in a dry pool.

  I capped the syringe. I didn't know who to envy. Marcus would lose fingers by thirty and not notice. Sarah would spend the rest of the night feeling like she was being flayed by a ghost. One had broken hardware. The other had broken software.

  "Can I go?" Sarah asked.
  "Yes."
  "Did it work?"
  "No," I said.
  She nodded, like she expected that. She stood up, still rubbing the arm that couldn't feel her own hand. "Thanks for trying."

  She walked out into the winter. I sat alone with the heater clanking. I put my own hand on the hot plate of the stimulator. Forty-eight degrees. I felt the heat. I felt the sharpness. I felt the urge to pull away. I rated it: Intensity 8. Unpleasantness 4.

  I wasn't sure if the 4 was the pain, or just the fear of becoming either of them.

  ***

  **Analysis**

  The story pushes the badness of pain into the **affective-motivational dimension**. Sarah is the tragic figure because she suffers, regardless of sensory input. Marcus is unsettling because he lacks suffering despite tissue-threatening stimuli. The "badness" tracks the urge to stop and the emotional toll, not the sensory data.

  However, a representationalist (who argues badness is intrinsic to the sensory experience) would accuse me of rigging Sarah's character. They would claim I didn't give her "pain without sensation," but rather **anxiety plus anesthesia**. By making her sensory experience "noise" or "nothing," I sidestepped the question of whether the *feeling* of pain is itself bad. They'd argue Sarah isn't in pain; she's terrified *of* pain that isn't there, whereas Marcus is actually feeling pain but is pathologically indifferent. I rigged the "mirror image" to be a panic attack, not a true pain inversion.
