      *   *Game Mechanics:*
          *   "Molecules" = Ping pong balls (maybe colored or marked, since speed is hard to simulate statically. Wait, the prompt says "differ in some way they can see (two sizes, say, standing in for fast and slow)". Static sorting is easier for a classroom game than dynamic speed sorting. Let's use two colors or sizes of balls).
          *   "Boxes" = Two trays or zones.
          *   "Demon" = Student who sees the ball type.
          *   "Door" = Student who moves the ball but doesn't know the type unless told.
          *   "Memory" = Index cards or coins.
          *   "Energy/Work" = Physical action (cranking flashlight, lifting weight).
          *   "Heat/Entropy" = The cost paid to reset.

  3.  **Drafting the Activity Rules:**
      *   *Setup:* Two bins (Hot/Cold). A stream of balls comes in.
      *   *Round 1:* Unlimited memory. They will sort easily. Feel smart.
      *   *Round 2:* Limited memory (e.g., 4 slots). To record a ball's type, they flip a coin or mark a card. To reuse the slot, they must "pay" (crank flashlight).
      *   *Roles:*
          *   *Observer (Demon):* Sees the ball, decides if it's Hot or Cold. Writes it on Memory.
          *   *Operator (Door):* Reads Memory, moves ball to correct bin.
          *   *Janitor (Eraser):* Resets memory (pays the cost). *Self-Correction:* Better to combine Operator and Janitor or make the cost apply to the team. Let's make the *team* pay. Actually, separating Observer and Operator forces communication (information flow). Let's stick to the prompt's suggestion: Demon (sees) + Door (acts).
      *   *Scoring:* +1 point per sorted ball. -X points per reset. X needs to be high enough to matter but low enough to allow some success.
      *   *The "Never Erase" Problem:* If they have 4 slots, they can only sort 4 balls then stop. The game needs a time limit or a stream of balls. If the stream is continuous, they *must* erase to continue.
      *   *The "Compression" Problem:* If they write "HHHH" on one card, does that count as 1 bit? In physics, compression requires work/knowledge of the distribution. In the game, if they pre-agree on codes, it's valid *if* the code book exists physically. But Landauer applies to the *logical irreversibility*. If they compress, they still eventually have to clear the paper. I need a rule that defines a "bit" simply (e.g., one checkmark = one ball).

  4.  **Refining the Mechanics for 70 Minutes:**
      *   *Intro (5 min):* Set up, no physics talk.
      *   *Round 1 (15 min):* Unlimited paper. Sort 30 balls.
      *   *Debrief 1 (5 min):* "Was that hard?" "No."
      *   *Round 2 (25 min):* Limited memory (6 coins/cards). Reset cost (10 cranks = 1 reset).
