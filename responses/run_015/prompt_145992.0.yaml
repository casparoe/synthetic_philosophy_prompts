answer: |-
  ### The 20-Minute Truth Filter

  **Philosophy Note (Corrected):** You are remembering Tarski's Undefinability Theorem. In plain English: a language cannot define its own truth without creating paradoxes. For your desk: **A claim cannot verify itself.** If a sentence's truth depends on the sentence itself, it has no truth value. Also, "not true" is not always "false." Some sentences are like "Ouch!" or "Close the door"—they aren't candidates for truth at all.

  **The Procedure**
  Run these five steps in order. If a step fails, stop and assign the corresponding verdict. Do not proceed to evidence checking until Steps 1–4 pass.

  **Step 1: The Assertion Test**
  *   **Ask:** Does this sentence describe a state of affairs in the world that existed or exists?
  *   **Pass:** It describes an event, statistic, or physical reality (e.g., "The meeting happened," "The drug lowers blood pressure").
  *   **Fail:** It is a command, a promise, a value judgment, or a prediction (e.g., "We must act," "This is unfair," "Sales will rise").
  *   **Verdict if Fail:** **ESCALATE.** (If it's a value judgment, it's an editorial call, not a fact check. If it's a prediction, mark as "Claim about Future" and do not grade).

  **Step 2: The Shield Test**
  *   **Ask:** Does this claim forbid or invalidate the process of checking it?
  *   **Pass:** Checking the claim does not change the claim's status.
  *   **Fail:** The claim says checking it is proof of bias, disinformation, or error (e.g., "Only liars deny this," "Checking this is part of the cover-up").
  *   **Verdict if Fail:** **NO TRUTH VALUE.** (Reader note: "This statement cannot be tested because it defines all tests as invalid.")

  **Step 3: The Loop Test**
  *   **Ask:** Does the truth of this sentence depend on the sentence itself?
  *   **Pass:** Evidence for the claim exists outside the claim.
  *   **Fail:** The sentence refers to its own truthfulness or creates a paradox (e.g., "I am lying," "This sentence is false," "No outlet reports this accurately" *said by an outlet reporting it*).
  *   **Verdict if Fail:** **NO TRUTH VALUE.** (Reader note: "This statement refers to itself rather than the world.")

  **Step 4: The Precision Test**
  *   **Ask:** Are the key terms defined well enough to measure?
  *   **Pass:** Terms like "hundreds," "works," or "experts" can be bounded (e.g., "hundreds" = 200–900; "works" = statistically significant improvement).
  *   **Fail:** Terms are so vague no evidence could confirm or deny them (e.g., "People are waking up," "The system is broken").
  *   **Verdict if Fail:** **DESCRIBE SHAPE.** (Do not print True/False. Print: "The claim uses undefined terms that prevent verification.")

  **Step 5: The Evidence Test**
  *   **Ask:** Does the available evidence match the claim?
  *   **Pass:** Evidence confirms the claim. -> **Verdict: TRUE.**
  *   **Fail:** Evidence contradicts the claim. -> **Verdict: FALSE.**
  *   **Mixed:** Evidence confirms the literal words but implies something false (Paltering). -> **Verdict: ESCALATE.** (This is the **False-vs-Misleading** choice. It is a values/editorial call, not a factual one. Hand to editor.)

  ***

  ### Running the Procedure on Your Examples

  **1. The Source Denial**
  *   *Claim:* "What I am telling you right now is not true."
  *   **Step 1 (Assertion):** Pass. It asserts a status about the current speech.
  *   **Step 2 (Shield):** Pass. It doesn't forbid checking.
  *   **Step 3 (Loop):** **FAIL.** The truth of the sentence depends on the sentence. If true, it's false. If false, it's true.
  *   **Verdict:** **NO TRUTH VALUE.**
  *   **Reader Note:** "This statement creates a logical loop and cannot be graded as true or false."

  **2. The Press Office Pull Quote**
  *   *Claim:* "No major outlet has ever accurately reported this meeting." (Spoken to a major outlet, for publication).
  *   **Step 1 (Assertion):** Pass. It asserts a historical fact about reporting.
  *   **Step 2 (Shield):** Pass.
  *   **Step 3 (Loop):** **FAIL.** If the outlet publishing this is a "major outlet," and they report it accurately now, the claim contradicts the act of publishing it. If they are a major outlet, they are proving themselves wrong by printing it. It relies on the context of its own utterance.
  *   **Verdict:** **NO TRUTH VALUE** (or **FALSE** if you define "ever" as strictly past-tense excluding the current moment, but the performative contradiction makes it a Looper).
  *   **Reader Note:** "This claim contradicts the context in which it is being published."

  **3. The Sympathetic Researcher**
  *   *Claim:* "My account of the incident is accurate."
  *   **Step 1 (Assertion):** Pass. It asserts the quality of her account.
  *   **Step 2 (Shield):** Pass.
  *   **Step 3 (Loop):** **FAIL.** She is using her authority to validate her authority. The sentence "My account is accurate" is not evidence of accuracy; it is a guarantee. You cannot check the truth of *this sentence* without checking the *account itself*. As a standalone claim, it is self-referential testimony.
  *   **Verdict:** **NO TRUTH VALUE.**
  *   **Reader Note:** "This is a guarantee of accuracy, not a verifiable fact itself."
  *   **The Unpleasant Result:** You wanted to write "She's telling the truth." The procedure forbids it. You can verify the *account* (Step 5), but you cannot verify her *claim about the account*. You must write: "Her account matches the evidence," not "Her claim of accuracy is true."

  **4. The "False vs. Misleading" Case (Added Example)**
  *   *Claim:* A politician says, "I have never been charged with a crime." (True, but he took a plea deal for a misdemeanor that avoided a charge).
  *   **Step 1–4:** All Pass. It is a precise, checkable, non-looping assertion about the past.
  *   **Step 5 (Evidence):** Technically **TRUE**. No charges were filed.
  *   **Problem:** It implies innocence where there was guilt.
  *   **Verdict:** **ESCALATE.**
  *   **Reason:** Deciding if a technically true statement is "Misleading" is not a fact-check; it is an editorial judgment on intent and reader impact. The procedure stops at "True." The decision to label it "Misleading" requires an editor.

  ***

  ### Style Guide Addendum

  1.  **Verify the world, not the speaker.** We grade claims about reality, not claims about the claim (e.g., "I am accurate" is not a fact).
  2.  **If a claim blocks verification, report the block.** Do not grade "Shields" or "Loopers" as True or False; describe their structure to the reader.
  3.  **"Misleading" is an editorial call, not a fact-check.** If a statement is technically true but implies a falsehood, escalate to the editor. The fact-checker's verdict remains "True."
