      *   **Crucial Requirement:** Embed a specific *structural feature* (e.g., nested role, diachronic identity condition) that isolates the dispute. If removed, both theories agree. Identify the labor this feature performs.
      *   **Structure:**
          1.  One-paragraph scenario.
          2.  Walkthrough of verdicts (Constitutional vs. Internal).
