      *   *Constraint Check:* Is the structural feature clear? The "Standing Distinction" (Architect vs. Operator).
      *   *Constraint Check:* Does removing it collapse the disagreement? If Thorne is just "Thorne" with full amendment power, the Constitutionalist might admit he *can* amend it, making the conflict about prudence rather than normativity. The standing distinction makes it about *authority*.

  7.  **Final Review against Prompt:**
      *   One paragraph scenario? Yes.
