  # Anthropic Reasoning Diagnostic Tree

  **Instructions:** Start at **Node 1**. Answer the question honestly based on your intuitions about the case described. Follow the arrow corresponding to your answer. Do not worry about the names of the positions (SSA, SIA, etc.); they will only appear at the end.

  ### **Node 1: The Sleeping Beauty Baseline**
  *Case:* Beauty is put to sleep Sunday. A fair coin is tossed. If **Heads**, she wakes Monday only. If **Tails**, she wakes Monday and Tuesday (with memory wipe between). She knows all this.
  *Question:* Upon waking, before being told the day, what is your credence that the coin landed **Heads**?
  *   **1/2** → Go to **Node 2**
  *   **1/3** → Go to **Node 8**

  ---

  ### **Branch A: The Halfer Path (Start at Node 2)**

  **Node 2: Evidence upon Waking**
  *Question:* When Beauty wakes up, does she learn any *new* information she didn't possess on Sunday?
