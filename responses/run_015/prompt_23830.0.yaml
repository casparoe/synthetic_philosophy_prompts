  *   **No** (She knew she would wake up regardless) → Go to **Node 5**

  **Node 3: The Monday Update**
  *Case:* Beauty is told, "It is Monday."
  *Question:* Does this information change her credence in **Heads**?
  *   **Yes** (Credence shifts, e.g., to 2/3) → Go to **Node 4**
  *   **No** (Credence stays at 1/2) → **Leaf: Unnamed Position A** *(Inconsistent Halfer)*

