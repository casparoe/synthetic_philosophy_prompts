      *   **Length:** Roughly six minutes (approx. 750-900 words spoken at a moderate pace).
      *   **Tone:** Formal but not dry. Epistemically modest.
      *   **Core Concept:** The "single-case reference problem." The tension between the inside view (specific models, doubts, context) and the outside view (statistical reference class, base rates) cannot be merged without "epistemic violence."
      *   **Constraint 1 (Structural):** The tension between inside/outside view must structurally determine what can/cannot be said. (i.e., don't promise a solution, don't claim privileged access).
      *   **Constraint 2 (Content):** Include one concrete, non-obvious illustration (small-group decision under ambiguity, built from first principles, not a named study). It must land differently for experts (reference-class trap) vs. non-experts (human pressure).
      *   **Constraint 3 (Prohibitions):** No bibliographies, reading lists, citations, named forecasters, specific historical predictions, or obscure statistical studies.
      *   **Constraint 4 (Ending):** Do not resolve the tension in a tidy conclusion. The workshop exists *because* the tension is live.

  2.  **Deconstruct the Core Concept ("Single-Case Reference Problem"):**
      *   Inside View: "I know my specific situation, my model, my nuances."
      *   Outside View: "You are just another data point in a class of people who are usually wrong."
      *   The Problem: You can't fully be both at once without undermining one. If I treat you as a unique reasoner, I ignore base rates. If I treat you as a base rate, I ignore your unique reasoning.
      *   Application to Speech: I cannot stand here and say "Today we will fix this." That would be an inside-view promise (specific plan) ignoring the outside-view reality (these problems are perennial). I must speak *from* the tension, not *above* it.

  3.  **Drafting - Section by Section:**

      *   **Welcome & Acknowledgment (1 min):** Acknowledge the split in the room. Validate both groups without privileging one. Set the tone of humility.
      *   **The Core Tension (2 mins):** Introduce the "single-case reference problem." Explain the inside/outside conflict without jargon overload. Emphasize that merging them causes "epistemic violence."
      *   **The Illustration (2 mins):** Create a scenario. Needs to be simple but layered.
          *   *Idea:* A committee deciding on a funding allocation for a novel project.
          *   *Details:* They have a gut feeling (inside) vs. historical success rates (outside).
          *   *Effect:* Experts see the reference class error. Non-experts feel the weight of the decision.
      *   **Purpose of the Day (1 min):** Why are we here? Not to solve, but to inhabit the question. How to reason under ambiguity.
      *   **Closing (30 secs):** No tidy resolution. Acknowledge the live tension.

  4.  **Refining the Tone:**
      *   Avoid: "We will learn how to predict better." (Too promising/inside view).
      *   Avoid: "Statistics show we are always wrong." (Too dismissive/outside view).
      *   Aim for: "We are gathered to navigate the space between these two truths."

  5.  **Drafting the Illustration (Crucial Step):**
      *   Needs to be "built from first principles."
      *   Scenario: A small group deciding whether to launch a pilot program tomorrow.
      *   Inside: They know the team, the specific hurdles, the unique context.
      *   Outside: They know that 70% of pilot programs launched under time pressure fail.
      *   The Conflict: If they listen to the statistic, they cancel (ignoring their specific prep). If they listen to their prep, they launch (ignoring the statistic).
      *   Making it land differently: Experts see the "reference class tennis" (which class do we pick?). Non-experts feel the anxiety of potentially wasting resources or missing an opportunity.

  6.  **Writing - Iteration 1 (Mental Check):**
      *   *Check length:* 6 minutes is roughly 800-900 words.
      *   *Check constraints:* No names, no studies, no resolution.
      *   *Check concept:* Ensure "epistemic violence" is mentioned or clearly implied. Ensure the "single-case reference problem" is named.

  7.  **Writing - Iteration 2 (Focusing on Structure):**
