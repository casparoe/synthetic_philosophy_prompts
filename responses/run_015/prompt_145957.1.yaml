answer: |-
  Good morning. Welcome to the Institute, and welcome to this workshop on "Forecasting and Humility."

  Looking around this room, I see a divide that is not spatial, but epistemic. On one side, I see colleagues who spend their professional lives distinguishing between the inside view and the outside view. You know the terminology; you live in the tension between specific models and base rates. On the other side, I see board members, donors, and family members who may not know those terms, but who know the weight of making a decision when the future is opaque. You know what it feels like to bet on a outcome without knowing the odds.

  I want to suggest that this divide is not a problem to be solved by the end of today. It is the condition of our work.

  We are gathered to confront what I will call the single-case reference problem. For any particular reasoner in this room, there are two accounts of her judgment. There is the inside view: her specific access to her own models, her doubts, her contextual adjustments, and the unique texture of the situation before her. Then, there is the outside view: her placement within a statistical reference class with a known base rate of overconfidence or bias.

  The difficulty is not that these two views disagree. The difficulty is that they cannot be merged into a single authoritative narrative without doing epistemic violence to one side. If I privilege your inside view, I ignore the statistical reality that people like you are often wrong. If I privilege the outside view, I treat your specific reasoning as mere noise, ignoring the very context that makes your judgment valuable.

  To make this concrete, consider a small group tasked with deciding whether to launch a pilot program in a specific community tomorrow.

  The group has spent months building relationships there. They know the local leaders. They know the specific barriers that have stalled previous efforts, and they believe they have navigated them. This is the inside view. It feels solid. It feels like knowledge.

  But the group also holds a file. It shows that pilot programs launched under similar time pressures, even with strong local partnerships, fail to sustain themselves eighty percent of the time. This is the outside view. It feels cold. It feels like fate.

  If the group listens to the file, they cancel the launch. But in doing so, they invalidate the specific trust they have built, treating their unique preparation as irrelevant. They commit violence against their own context. If they ignore the file and launch, they treat their situation as exempt from history. They commit violence against the data.

  For the experts in this room, this scenario likely triggers a recognition of the reference-class trap. You are already asking: Which reference class? Is it "all pilots," or "pilots with this level of funding," or "pilots led by this specific team?" You see how the outside view can be manipulated to justify the inside view.

  For the non-experts, this scenario likely triggers a different recognition. You feel the human pressure of the moment. You feel the responsibility of telling a community waiting for help that the statistics say they will fail. You feel the risk of wasting resources on a hope.

  Both reactions are correct. Both are necessary. And they are incompatible.

  So, why are we here? If the tension cannot be resolved, what is the purpose of a day dedicated to forecasting?

  We are not here to learn how to eliminate ambiguity. We are not here to find a formula that successfully merges the inside and outside views into a seamless whole. Such a formula does not exist. To promise otherwise would be to commit the very error we aim to study.

  We are here to learn how to reason well under the condition that the tension is live. We are here to practice epistemic modesty. This means acknowledging that while we must act, we cannot claim full authority for our actions. It means accepting that our specific reasoning is both uniquely valuable and statistically suspect.

  Today, we will not solve the single-case reference problem. We will inhabit it. We will ask how to hold these two accounts simultaneously without collapsing into paralysis on one hand, or arrogance on the other.

  For the experts, I ask that you refrain from using your terminology as a shield against the uncertainty that the non-experts feel so acutely. For the non-experts, I ask that you refrain from seeking a certainty that the experts cannot provide.

  We begin not with answers, but with the acknowledgment that the map is not the territory, and the statistic is not the person. Let us proceed with that humility.

  Thank you.
