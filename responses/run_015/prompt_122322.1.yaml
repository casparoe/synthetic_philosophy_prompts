prompt: |-
  I was arguing with my roommate last night about Gettier cases and we got bored of the usual textbook examples. I made up this variant I call shadow justification: a student believes her exam answer is right because she misread the textbook, but her brain also subconsciously computed the correct formula from ambient noise patterns she didn't notice, and the hidden computation occured by pure chance. So she has a true belief, there's a reliable process causing it, but her conscious reasoning is totally broken and she can't access the backup. Does that hidden reliability salvage knowledge, or does the inaccessibility and accidental nature mean it's still not knowledge?

  Write an essay that weighs this and reaches an actual verdict — don't end with "it depends". Present it as exactly five numbered points, each only a sentence or two, with no intro or conclusion. The shadow-justification scenario should drive the whole argument, not just decorate it. Definately take a side on whether subconscious backup counts.
