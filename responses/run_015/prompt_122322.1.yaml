          3. Because the accurate computation is inaccessible to her conscious mind, she cannot defend or verify the belief, rendering the hidden process epistemically inert for her agency.
          4. This scenario mirrors standard Gettier problems where accidental truth replaces genuine understanding, proving that hidden reliability cannot salvage knowledge when the agent is oblivious to the source.
          5. Therefore, the shadow justification fails to constitute knowledge because epistemic luck remains the primary driver of the true belief despite the subconscious backup.

