answer: |-
  You have identified a genuine tension in historiography, though there is not a single, universally recognised term for this specific manoeuvre. It sits squarely within the long-standing debate between **structuralism** (or functionalism) and **intentionalism**.

  Structuralists argue that the conditions of Weimar Germany, the Treaty of Versailles, and economic collapse created a system where radical authoritarianism was the likely outcome, regardless of the figurehead. Intentionalists argue that Hitler's specific ideology and will drove events. What you are describing is a hybrid approach that often appears in popular history or synthetic accounts: using structuralism to explain the *rise* (absolving the specific necessity of Hitler) but switching to intentionalism to explain the *crimes* (ensuring Hitler bears the moral burden).

  Since there is no canonical name for this specific switching mechanism, I propose we coin the term **'Explanatory Bifurcation'**.

  ### Defining 'Explanatory Bifurcation'

  **Explanatory Bifurcation** occurs when a historical narrative splits causality into two distinct streams to satisfy competing analytical needs.
  1.  **The Structural Stream:** Used for macro-level events (regime change, war onset), suggesting inevitability based on conditions.
  2.  **The Agential Stream:** Used for micro-level atrocities or specific strategic blunders, attributing them to unique individual pathology.

  This is not merely a linguistic trick; it attempts to solve the **Structure vs. Agency** problem. However, it becomes problematic if the switch is made solely to protect a thesis from criticism rather than based on evidence.

  ### Distinguishing Bifurcation from Inconsistency

  It is crucial to draw a line between valid historiographical nuance and logical inconsistency. Here is how you distinguish **Explanatory Bifurcation** (valid) from **Methodological Inconsistency** (invalid):

  **1. The Threshold of Contingency**
  *   **Valid Bifurcation:** Acknowledges that while structural pressures made *some* form of authoritarianism likely, the *specific form* (genocidal antisemitism) was not predetermined. Here, the switch is justified by evidence showing that other authoritarian figures in similar positions did not necessarily pursue industrialised extermination.
  *   **Inconsistency:** Claims the regime was inevitable *and* that the Holocaust was inevitable due to structures, but then suddenly claims only Hitler could have ordered it when confronted with the lack of a written order. This is moving the goalposts to avoid culpability.

  **2. Moral Accounting**
  *   **Valid Bifurcation:** Uses structure to explain *opportunity* and agency to explain *choice*. It argues the system enabled the crime, but the individual authorised it. This maintains collective responsibility for the environment while assigning criminal liability for the act.
  *   **Inconsistency:** Uses structure to diffuse German collective guilt ("the economy made them do it") but uses agency to isolate Hitler's guilt ("only he wanted the Holocaust"). This is a contradictory moral framework designed to exculpate the populace while condemning the leader.

  **3. Evidence-Based Switching**
  *   **Valid Bifurcation:** The historian switches frameworks because the evidence demands it. For example, economic data supports structural arguments for the 1933 election, but diary entries and meeting minutes support intentionalist arguments for the invasion of Russia.
  *   **Inconsistency:** The historian switches frameworks based on convenience. If structuralism makes the regime look too deterministic, they switch to Great Man theory. If Great Man theory makes the crimes look too unique to be understood, they switch back to structuralism.

  ### A Note on Historical Consensus

  It is worth noting that modern historiography, particularly since Ian Kershaw's work on 'Working towards the Führer', tends to synthesise these views rather than bifurcate them. The consensus suggests that while structural conditions created the radicalising environment, the specific escalation towards the Holocaust required the active agency of Hitler and the Nazi leadership.

  Therefore, what you are observing might be a lagging indicator of older debates. Sophisticated analysis now accepts that structure and agency are intertwined: the structure created the possibility, but the agency determined the specific horror. If a narrative treats them as mutually exclusive switches rather than interacting forces, that is where **Explanatory Bifurcation** risks becoming **Methodological Inconsistency**.

  In short, your observation is astute. Where the switch is evidence-led, it is nuance; where it is morality-led, it is often a defence mechanism.
