answer: |-
  ### The No-Trade Theorem: An Epistemic Analysis

  **Core Statement**
  The No-Trade Theorem (Milgrom & Stokey, 1982), building on Aumann's (1976) "Agreeing to Disagree," posits that if two Bayesian agents share a **common prior**, are **commonly known to be rational**, and the **terms of a speculative trade are common knowledge**, then no trade will occur. Specifically, the ex-ante expected gain from trade for both parties must be zero.

  **The Mechanism: The Offer as a Signal**
  The theorem relies on the idea that in an informationally efficient epistemic environment, a willingness to trade is itself informative data.

  1.  **Private Information:** Agent $A$ proposes a trade (e.g., buying an asset at price $P$) only if their private information leads to a posterior expectation $E_A[\text{Value}] > P$.
  2.  **Inference:** Agent $B$ observes the offer. Because rationality and the common prior are *common knowledge*, $B$ knows that $A$ would not make this offer unless $A$'s information justified it.
  3.  **Updating:** $B$ updates their own posterior based not just on their private signal, but on the fact that $A$ is willing to trade. Since they share a prior, $B$'s inference about $A$'s information pulls $B$'s valuation toward $A$'s valuation.
  4.  **Convergence:** In equilibrium, this recursive updating continues until the expected value for both agents equals the price $P$. The informational asymmetry that motivated the trade is "arbitraged away" by the mere existence of the proposal. If $A$ knows that $B$ will infer this, $A$ knows the trade yields zero expected profit, and thus does not propose it.

  **Common Knowledge vs. Mutual Knowledge**
  The collapse of trade hinges critically on **common knowledge**, not merely **mutual knowledge**.

  *   **Mutual Knowledge:** $A$ knows the trade is proposed, and $B$ knows the trade is proposed. However, $A$ might not know that $B$ knows $A$ is rational. $B$ might suspect $A$ is acting irrationally or on a different prior. In this case, $B$ does not fully update on $A$'s offer, leaving room for perceived gains.
  *   **Common Knowledge:** The hierarchy is infinite: $A$ knows $X$, $B$ knows $X$, $A$ knows that $B$ knows $X$, $B$ knows that $A$ knows that $B$ knows $X$, *ad infinitum*.
      *   *Technical Implication:* This infinite recursion ensures that $B$ cannot dismiss $A$'s offer as a mistake. $B$ must treat $A$'s action as a fully revealing signal of $A$'s posterior. Without common knowledge of rationality and priors, the chain of inference is broken, and the "curse" of the offer does not fully materialize.

  **Clarification: Why Rational Agents Do Trade**
  The theorem is often misinterpreted as a claim that markets are impossible. It is more precisely a claim about **purely speculative trade driven by asymmetric information**. Trade persists in reality because the theorem's strict assumptions are relaxed:

  1.  **Different Priors:** If agents do not share a common prior (violating the Harsanyi Doctrine), they can "agree to disagree." $A$ may value the asset highly simply because they are more optimistic by nature, not just due to private signals.
  2.  **Risk Sharing vs. Speculation:** The theorem targets zero-sum speculative bets. Trade often occurs for **risk-sharing** (hedging). If agents have different risk aversion coefficients or endowment shocks, trade creates Pareto improvements regardless of information asymmetry.
  3.  **Liquidity and Noise:** Real markets contain "noise traders" who trade for exogenous reasons (liquidity needs, errors). Rational agents can trade against noise traders without fearing adverse selection from another rational agent, as the noise trader's action does not convey informative signals about value.
  4.  **Bounded Rationality:** If agents are not commonly known to be perfectly Bayesian, an offer does not fully reveal the proposer's posterior, preserving the informational gap required for trade.

  **Seminar Takeaway**
  Epistemically, the No-Trade Theorem demonstrates that under conditions of perfect rational transparency, **information is a public good that cannot be privately monetized.** For speculative markets to function, there must be some opacity regarding rationality, priors, or motives.
