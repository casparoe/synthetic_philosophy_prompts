          5.  Discuss the implications of each decision option (what principle is committed to).
          6.  Propose a "test case" to distinguish between surviving rules.
          7.  Address the philosophical worry: Does this remit resist environmental determinism or merely relocate it?
      *   **Tone:** Intellectual, precise, analytical, slightly weary but engaged (matching the user's background).
      *   **Constraints:** The user knows philosophy (counterfactuals, causation). Use that language but keep it grounded in the administrative context.

  2.  **Analyze the Precedents (The Data Set):**
      *   *Case 1 (Tambora, 1815):* **FUNDED.** Exogenous shock. No human institution produced it. Riots/emigration counterfactually depended on it. (Key: Exogenous, Counterfactual Dependence).
      *   *Case 2 (Caribbean Climate/Slavery):* **REFUSED.** Climate constant across region/known to planters. Explained neither difference nor change over time. (Key: No Variance, Known/Adapted).
      *   *Case 3 (Yellow Fever/St-Domingue):* **FUNDED.** Pathogen discriminated between comparable forces. Entered planning. Outcome would differ without it (even if danger known). (Key: Discrimination, Counterfactual Dependence, Specific Mechanism).
      *   *Case 4 (Medieval Port/Rising Water):* **REFUSED.** Inhabitants saw it coming, moved warehouses, negotiated over generations. Condition is not an actor. (Key: Foreseeable, Adapted/Negotiated, Long Duration).
      *   *Case 5 (Maya Drought):* **REFUSED.** Evidential. Timing resolution too coarse (decades). Cannot tell precedence (drought vs. collapse). (Key: Epistemic Uncertainty on Causal Order).
      *   *Case 6 (Dust Bowl/1930s):* **FUNDED WITH CONDITIONS.** Drought not "cause" without modelling ploughing/policy. Interaction, not drought alone. (Key: Interaction, Human Amplification).

  3.  **Derive Candidate Rules (Hypothesis Generation):**
      *   *Hypothesis A (Foreseeability/Adaptation):* Fund if the event was sudden/unforeseeable/unadaptable. Refuse if people saw it coming and negotiated with it.
          *   Fits: Tambora (Yes), Slavery (No - known), Fever (Yes - specific outbreak), Port (No - generations), Maya (Unclear), Dust Bowl (Mixed - drought known, impact amplified).
      *   *Hypothesis B (Counterfactual Dependence with Human Choices Fixed):* Fund if the outcome changes holding human choices constant.
          *   Fits: Tambora (Yes), Slavery (No - climate constant), Fever (Yes), Port (No - they moved), Maya (Unknown), Dust Bowl (No - needs interaction).
      *   *Hypothesis C (Differential/Discrimination):* Fund if the non-human factor discriminates between comparable human groups.
          *   Fits: Tambora (Maybe - regions affected differently?), Slavery (No - constant), Fever (Yes - French vs. Haitian), Port (No - everyone affected slowly), Maya (Maybe), Dust Bowl (No - interaction).
      *   *Hypothesis D (Exogeneity vs. Interaction):* Fund if exogenous shock OR if interaction is modelled. Refuse if treated as sole cause where human agency exists.
          *   Fits: Tambora (Exogenous), Slavery (Refused - treated as sole cause), Fever (Exogenous shock to army), Port (Refused - negotiated), Maya (Refused - evidential), Dust Bowl (Conditioned - interaction).

      *   *Refining the "Cardew Logic":* The Bequest wants to "restore agency to the non-human world."
          *   They fund when the non-human *makes a difference* that human agency didn't swamp.
          *   They refuse when the non-human is background (Slavery, Port) or when human agency is the real driver (Dust Bowl - unless interaction modelled).
          *   They refuse when we can't prove the non-human acted *before* the human collapse (Maya).
          *   *Core Tension:* Is it about *surprise* (unforeseeable) or *discrimination* (differential impact)?
          *   *Strongest Rule:* **The "Interventionist/Counterfactual" Rule.** Fund if the non-human factor acts as a specific intervention that alters the trajectory *despite* human knowledge/planning, provided we can establish the causal order. Refuse if the factor is a constant background condition or if humans successfully negotiated/adapted to it over time.
          *   *Nuance:* The Dust Bowl condition suggests they hate "Nature did it" if "Humans made it worse" is ignored. They want *interaction* acknowledged, not *replacement*.

  4.  **Analyze the Current Case (Mount Pelée, 1902):**
      *   *Facts:* Eruption known (1792, 1851). Unrest visible (2 weeks). People moved *in* and *out*. Mudflow killed 150. Pyroclastic surge killed 29,000. Survivors: prisoner in cell, people down coast.
      *   *Political Angle:* Authorities slow to evacuate due to elections. (Reviewer says sourcing thin).
      *   *Application:* Focuses on the volcano as the agent of destruction.
      *   *Comparison to Precedents:*
          *   Like Tambora? (Exogenous shock). Yes, but Pelée had warnings.
          *   Like St-Domingue? (Discrimination). Yes, killed town, spared coast.
          *   Like Medieval Port? (Foreseeable). Yes, signs were there. But timescale is days, not generations.
          *   Like Dust Bowl? (Human amplification). The election delay is the human factor.
      *   *The Fault Line:* Is the volcano an "actor" if the death toll was inflated by political negligence? Or is the volcano the actor *because* it overwhelmed even the political negligence (i.e., even if they evacuated, the surge was too fast)?
      *   *The "Agency" Test:* Did the volcano force a specific outcome that human choice couldn't prevent?
          *   29,000 dead. 2 survivors (prisoner, coastal).
          *   If evacuation had happened: Would 29,000 still die? The surge was minutes. Town destroyed. But people could have been out of town.
          *   So the *death toll* depends on human choice (elections). The *destruction of the town* depends on the volcano.
          *   The application argues for the volcano's agency. The political chapter argues for human negligence.

  5.  **Formulate the Prediction:**
      *   *Decision:* **Fund with Conditions.**
      *   *Why:* It sits between Tambora (shock) and Dust Bowl (interaction). The volcano is definitely an agent (destroyed the town), but the *historical significance* (the death toll/political fallout) is entangled with the election delay. To fund "agency to the non-human" without acknowledging the human failure that compounded it risks the determinism worry.
      *   *Condition:* The political explanation (elections) must be treated as a confounding variable or interacting factor, not dismissed, even if sourcing is thin (perhaps frame as "rumor/contemporary perception" rather than established fact). Or, require the project to distinguish between the *destruction of the place* (Volcano) and the *loss of life* (Volcano + Politics).

  6.  **Address the Philosophical Worry (Determinism):**
      *   The user worries: Do we only call nature an agent when humans are helpless?
      *   Answer: Yes, that is the risk. If we define "non-human agency" as "events humans couldn't stop," we define agency as "human powerlessness."
      *   The Cardew Bequest seems to try to avoid this by requiring *discrimination* (St-Domingue) or *interaction* (Dust Bowl).
      *   But the Port case (negotiated over generations = not an actor) suggests they view "successful adaptation" as the *absence* of non-human agency. This *is* a form of relocated determinism. It implies nature is only an agent when it wins.

  7.  **Drafting the Response:**
      *   *Structure:*
          1.  Executive Summary (The Prediction).
          2.  Reconstructing the Committee's Logic (The Rules).
          3.  Applying the Rules to Pelée.
          4.  The Closest Analogue.
          5.  Implications of Options (What principle we commit to).
          6.  The Test Case (To distinguish rules).
          7.  Addressing the Worry (Determinism).
      *   *Tone Check:* Ensure it sounds like one colleague speaking to another (philosophical rigor + admin pragmatism). Use terms like "counterfactual dependence," "exogenous," "ceteris paribus."

  8.  **Refining the Rules (Self-Correction during drafting):**
      *   Look closely at Case 3 (Fever) vs Case 4 (Port).
      *   Fever: Danger known, but specific outbreak wasn't. Funded.
      *   Port: Danger known, slow rise. Refused.
      *   *Distinction:* Timescale/Adaptability. If you can move your warehouse, it's not an actor. If you can't move your army fast enough, it is.
      *   Look at Case 6 (Dust Bowl). Conditioned.
      *   *Distinction:* Don't let nature take the blame for human amplification.
      *   *Pelée:* The election delay is human amplification of the death toll. The surge is the nature part.
      *   *Prediction:* Fund with Conditions. Condition: Must model the election delay as an interacting variable, not just a footnote.

  9.  **Developing the Test Case:**
      *   Need something that separates "Foreseeability" from "Discrimination" from "Interaction."
      *   *Idea:* A flood.
      *   *Variant A:* Flash flood (Unforeseeable, kills everyone).
      *   *Variant B:* Seasonal flood (Foreseeable, people build on stilts, one year water is higher).
      *   *Better Idea:* An earthquake.
      *   *Case:* 1908 Messina Earthquake.
      *   *Why:* Sudden (like Pelée), but building codes (human) determined death toll.
      *   *Separation:* If we fund "Earthquake caused collapse," we ignore codes. If we refuse, we ignore the shake.
      *   *Let's try a Blight:* Potato Blight.
      *   *Case:* Irish Famine vs. a blight that hits a wild forest.
      *   *Actually, let's look for a case that splits the "Adaptation" rule from the "Counterfactual" rule.*
      *   *Proposed Case:* The 1931 China Floods. (Human dyke maintenance vs. massive rain).
      *   *Wait, I need a case to test the Committee.*
      *   *Scenario:* A project on a specific shipwreck caused by a rogue wave.
      *   *Rule 1 (Foreseeability):* Refuse (waves are constant risk).
      *   *Rule 2 (Discrimination):* Fund (this wave hit *this* ship, others safe).
      *   *Rule 3 (Interaction):* Fund with Conditions (ship design + wave).
      *   *Let's go with the "1970 Bhola Cyclone".*
      *   *Why:* Massive death toll. Forecast existed but communication failed. Dykes existed but were insufficient.
      *   *Test:* Does the committee focus on the *failure of communication* (Human) or the *storm surge height* (Non-human)?

  10. **Final Polish:** Check the "Worry" section. This is the philosophical core. The user suspects the Bequest's definition of "agency" is just "human helplessness." I need to validate that insight while offering a way to navigate it within the committee's framework. The distinction between "Background Condition" and "Intervention" is key here (Hart & Honoré style).

  11. **Final Review against constraints:**
      *   Did I answer all parts? (Decision, Rules, Prediction, Analogue, Principles, Test Case, Worry).
      *   Is the tone right? (Professional, philosophical).
      *   Is the Pelée analysis sound based on the provided precedents?

      *(Self-Correction on Pelée Decision)*: Looking at the Fever case (St-Domingue). Danger was "not exactly unknown." Funded. Why? Because it *discriminated* (French vs Haitian/Black troops) and *entered planning*.
      Pelée: Danger known (1792, 1851). Did it discriminate? Yes (Town vs Coast). Did it enter planning? Yes (Evacuation debates).
      So why Conditions? Because of the Election Chapter. The Dust Bowl precedent says: Don't call drought the cause without modelling policy. Here: Don't call Volcano the cause of the *disaster magnitude* without modelling the election delay.
