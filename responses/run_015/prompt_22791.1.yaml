prompt: |-
  I'm a PhD student in the foundations of quantum mechanics, working on the "quantum immortality" / "quantum suicide" debate. The basic "quantum immortality" claim is that, in the many-worlds interpretation, an observer who performs the "quantum suicide" experiment (a gun connected to a quantum measurement, where one outcome kills the observer) will, from their own perspective, always find themselves in a branch where they survive. But I think this claim is more subtle than it first appears. In particular, I'm interested in the role of self-locating uncertainty: how should the observer update their credence about which branch they're in, given that the observer in the alive branch is a different "self" from the observer before the experiment, and the observer in the dead branch doesn't exist to report? And does the "quantum immortality" claim really follow from many-worlds, or does it depend on additional assumptions about how to weight the branches (e.g., the Born-rule weights vs. counting observer-moments)?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in foundations of quantum mechanics. This means they have a high level of technical understanding. I shouldn't explain basic QM or basic MWI (Many-Worlds Interpretation) concepts unless necessary for context. I need to engage at a research-level depth.
      *   **Topic:** Quantum Immortality/Suicide (QI/QS) within MWI.
      *   **Specific Focus:** Self-locating uncertainty, identity over time (personal identity), branch weighting (Born rule vs. branch counting), and whether QI actually follows from MWI or requires extra assumptions.
      *   **Goal:** Provide a nuanced, critical analysis of the QI claim, addressing the specific philosophical and technical subtleties raised.

  2.  **Deconstruct the Core Arguments:**
      *   *The Standard QI Claim:* In MWI, all outcomes happen. Death is an outcome. Therefore, there is always a branch where you survive. Since you can't experience death, you must experience survival.
      *   *The User's Skepticism:* It's not that simple. Issues of self-locating uncertainty, personal identity, and probability measure (Born rule) matter.
      *   *Key Issues to Address:*
          1.  **Personal Identity:** Is the post-measurement survivor the *same* person as the pre-measurement experimenter? (Parfit, psychological continuity).
          2.  **Self-Locating Uncertainty:** How does the pre-measurement observer assign credence to being the survivor vs. the deceased? (Elga, Vaidman, Sebens & Carroll).
          3.  **Probability Measure:** Does the Born rule apply to subjective expectation? If branches have weights, does low weight mean low probability of *finding oneself* there?
          4.  **The "Dead" Branch:** What is the ontological status of the dead observer? Can we say they "don't exist"? (They exist as a corpse/branch, but no conscious experience).
          5.  **Decision Theory:** Would a rational agent bet on survival? (Wallace, Greaves).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's expertise. Validate their intuition that QI is not a straightforward consequence of MWI. State the thesis: QI relies heavily on specific assumptions about personal identity and probability, not just unitary evolution.

      *   **1. The Ontology of Death in MWI:**
          *   Clarify that "death" isn't the disappearance of a branch. The branch exists, but the *conscious experience* terminates.
          *   Distinguish between *ontological existence* of the branch and *phenomenological existence* of the observer.
          *   This undermines the simple "I always survive" claim. It's more "There is always a copy that survives," which is different from "I will experience survival."

      *   **2. Personal Identity and Fission:**
          *   This is crucial. MWI is a fission scenario.
          *   Reference Derek Parfit. If identity is not what matters, but rather psychological continuity, then the pre-experimenter cares about *both* successors (or neither, in the case of death).
          *   If the pre-experimenter anticipates *both* outcomes, QI fails. They should anticipate a probability of death proportional to the Born weight.
          *   If they anticipate only the survivor, why? This requires a "single-threaded consciousness" assumption which is foreign to standard MWI.

      *   **3. Self-Locating Uncertainty and Credence:**
          *   Discuss the "Epistemic Problem" in MWI.
          *   *Elga/Vaidman:* Upon waking (post-measurement, pre-observation), how do you assign probability?
          *   *Sebens & Carroll (Self-Locating Uncertainty):* They argue for the Born rule via ESP (Epistemic Separability Principle).
          *   *The QI Pivot:* QI proponents often implicitly use *branch counting* (1 alive branch, 1 dead branch -> 50/50) or ignore weights. But if Born weights matter, a low-probability survival branch means low credence of finding oneself there *before* the split.
          *   Crucial point: Pre-measurement credence of death should match Born weight. Post-measurement, the dead copy has no credence. But the pre-measurement agent must account for the possibility of *ceasing to have experiences*.

      *   **4. Decision Theory and Rational Betting:**
          *   David Wallace's work is essential here.
          *   A rational agent in MWI should maximize expected utility using Born weights.
