answer: |-
  This is an excellent and precise framing of the problem. As a PhD student in foundations, you are right to identify that "Quantum Immortality" (QI) is not a direct theorem of the Many-Worlds Interpretation (MWI), but rather a contingent conclusion that depends heavily on specific philosophical commitments regarding **personal identity**, **self-locating uncertainty**, and the **normative status of the Born rule**.

  The standard pop-sci presentation of QI ("You never die in MWI") glosses over the distinction between the *ontological existence of a surviving branch* and the *subjective anticipation of the pre-measurement agent*.

  Here is a breakdown of the specific subtleties you raised, structured around the key friction points in the literature.

  ### 1. The Ontology of Death vs. The Phenomenology of Survival
  The core QI argument relies on an equivocation between two claims:
  1.  **Ontological Claim:** There exists at least one branch in the future wavefunction containing a conscious observer continuous with the current experimenter.
  2.  **Phenomenological Claim:** The current experimenter should expect with certainty to experience the future of that surviving branch.

  In MWI, claim (1) is trivially true (assuming non-zero amplitude for survival). Claim (2) is where the debate lies.

  In a "quantum suicide" setup, the wavefunction evolves into a superposition of $|Alive\rangle$ and $|Dead\rangle$ (where $|Dead\rangle$ represents a branch containing a corpse and grieving friends, but no first-person perspective). The QI proponent argues that since there is no "view from nowhere" to observe the $|Dead\rangle$ branch, the subjective probability of finding oneself in $|Alive\rangle$ must be 1.

  **The Counter-Argument:** This ignores the **pre-measurement anticipation**. Before the trigger is pulled, the agent faces a fission event. If personal identity is understood in terms of psychological continuity (Parfitian reductionism), the pre-measurement agent stands in a relation of continuity to *both* successors (the alive one and the one who dies just after the measurement). The fact that the second successor's stream of consciousness terminates immediately does not mean the pre-measurement agent shouldn't assign a high credence to "my consciousness will terminate."

  ### 2. Self-Locating Uncertainty and Credence
  You mentioned self-locating uncertainty, which is the crux of the modern debate (e.g., work by Sebens, Carroll, Vaidman, and Elga).

  **The Problem of Pre-Measurement Credence:**
  Standard MWI decision theory (à la David Wallace) argues that a rational agent should assign credences to future branches proportional to their Born weights ($|c_i|^2$). If the survival amplitude is $\epsilon \ll 1$, the agent should anticipate death with probability $1 - \epsilon^2$.

  QI requires rejecting this link. It implies that **branch counting** (or a specific measure over observer-moments) trumps the Born rule for subjective anticipation.
  *   **If you use Born Weights:** You should fear the experiment. The "measure" of your future existence is drastically reduced.
  *   **If you use Branch Counting:** You might argue there is 1 branch where you live and 1 where you die, so 50/50. But standard MWI rejects branch counting as ill-defined (due to the continuum of decoherent histories).
  *   **If you use "Observer Moments" (Tegmark):** You might argue that the *number* of conscious moments is what matters. However, in the death branch, the number of *future* conscious moments is zero.

  **The "Silence" of the Dead Branch:**
  Your point about the dead branch not existing to report is crucial. This is often framed as a selection effect. However, selection effects apply to *data gathering*, not necessarily to *anticipation*.
  *   *Analogy:* Russian Roulette. If you play and survive, you are 100% certain to observe survival. But pre-game, your credence of survival should be 1/6.
  *   *QI Shift:* QI argues that in MWI, the pre-game credence should *also* be 1 because the "you" that dies doesn't count.
  *   *Rebuttal:* This requires a premise that **non-existence cannot be an outcome for the subject.** But in a fission scenario, "ceasing to exist" (in one branch) is a valid outcome for the pre-fission agent to anticipate, even if no one is there to report it afterwards.

  ### 3. Personal Identity: The "Single Thread" Assumption
  For QI to hold, one must adopt a specific view of personal identity often called the **"Single Thread"** or **"Privileged Branch"** view. This view holds that consciousness follows only one path through the multiverse, specifically the path where it continues.

  This is arguably in tension with the spirit of MWI.
  *   **MWI Orthodoxy:** All branches are equally real. There is no privileged "now" or "here."
  *   **QI Requirement:** There is a privileged "me" that hops along the surviving branches.

  If you accept **Parfitian Reductionism** (identity is not what matters; survival is a matter of degree based on psychological connectedness), then the pre-measurement agent should care about the welfare of *all* successors. Since one successor suffers immediate termination, the expected utility of the experiment is negative (assuming death has negative utility). The fact that another successor is happy does not negate the disutility of the branch where "you" die, unless you assume that the dead branch contains a *different person* entirely while the alive branch contains the *real you*. This reintroduces a form of dualism or privileged ontology that MWI was designed to eliminate.

  ### 4. Decision Theory and the Born Rule
  This is perhaps the strongest technical argument against QI as a necessary consequence of MWI.

  David Wallace and Hilary Greaves have developed decision-theoretic derivations of the Born Rule within MWI. Their axioms (e.g., Diachronic Consistency, Branching Indifference) imply that a rational agent should bet according to the squared amplitudes.
  *   If QI were true, a rational agent would be indifferent to the probability of death in a quantum suicide setup (provided survival amplitude > 0).
  *   This violates **Diachronic Consistency**. If I know that post-measurement "I" will be glad I survived, but pre-measurement "I" should anticipate death with high probability (per Born rule), there is a conflict in utility maximization.

  If QI holds, the Born rule ceases to function as a guide for subjective probability in life-or-death scenarios. It becomes a rule only for "safe" measurements. This creates a dichotomy in the physics: one probability rule for observing spin, another for observing death. Most foundationalists view this as a fatal flaw for QI.

  ### 5. Does QI follow from MWI?
  To answer your specific question: **No, Quantum Immortality does not follow from MWI alone.** It requires additional assumptions:

  1.  **Identity Assumption:** Personal identity must track only continuous conscious experience (rejecting the idea that you "become" the dead copy).
  2.  **Probability Assumption:** Subjective credence must be decoupled from Born weights in favor of a measure that guarantees non-zero weight to any branch containing consciousness (effectively normalizing over only "live" observer-moments).
  3.  **Epistemic Assumption:** The absence of evidence (from the dead branch) is treated as evidence of absence (of the risk of death).

  ### 6. The "Quantum Russian Roulette" Paradox
  A useful way to frame this for your work is the distinction between **external** and **internal** probability.
  *   **External (God's eye view):** The amplitude of the "Alive" branch decreases with every shot. The measure of existence of the observer is dwindling.
  *   **Internal (First-person):** The observer only finds themselves in the Alive branch.

  QI argues Internal = 1 always.
  Standard MWI Decision Theory argues Internal should track External (Born weights).

  If the Born weight of the survival branch drops to $10^{-100}$, does the survivor feel "lucky" or "normal"? QI says normal. Standard MWI says the pre-measurement agent should be virtually certain of death. The tension here is whether **caring measure** (how much I care about a future self) tracks **existence measure** (Born weight). QI assumes they decouple at the point of death.

  ### Summary for your Research
  If you are working on this debate, the most fertile ground is likely in the **normative ethics of fission**.
  *   Investigate whether the Born Rule is a rule of *ontology* (how much stuff exists) or *epistemology* (what to expect).
  *   If it is epistemological, QI is false (you should expect death).
  *   If it is ontological, QI might be plausible (you exist in the alive branch, so that's where "you" are), but it requires a robust theory of why the "dead you" doesn't count as a future self of the "current you."

  The claim that "you will always survive" is better phrased as "There will always be a future observer with your memories who claims to be you." Whether *you* (the pre-measurement agent) should anticipate being that observer with probability 1 is where the philosophy does the heavy lifting, not the physics.

  **Recommended Literature for your specific angle:**
  *   **David Wallace,** *The Emergent Multiverse* (Chapters on decision theory and probability).
  *   **Hilary Greaves,** "Understanding Deutsch's Probability in a Deterministic Universe."
  *   **Peter J. Lewis,** "Quantum Sleeping Beauty" (Discusses self-locating credence in branching).
  *   **Don Page,** "Is Our Universe Likely to Decay within 20 Billion Years?" (Discusses measure problems and immortality).
  *   **Anders Sandberg,** "The Quantum Suicide Machine" (A critical analysis of the decision theoretic aspects).

  Your intuition is correct: QI is not a physical prediction of MWI, but a philosophical stance on identity and probability *superimposed* on MWI. Treating it as a hard consequence of the formalism is a category error.
