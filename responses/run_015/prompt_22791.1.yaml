          *   Mention Hilary Greaves' "Myself and the Guises."

      *   **5. The "Subjective Probability" Trap:**
          *   QI conflates *objective existence of a survivor* with *subjective expectation of survival*.
          *   Just because a future self exists doesn't mean the current self should expect to *be* that self with probability 1.
          *   Analogy: Teletransportation paradox. If a copy is made and the original destroyed, do you survive?

