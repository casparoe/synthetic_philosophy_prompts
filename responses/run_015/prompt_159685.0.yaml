answer: |-
  The argument contends that any moderate condition for composition must rely on scalar properties like 'life' or 'cohesion', which inevitably admit of borderline cases; since existence cannot be indeterminate, such moderate conditions are metaphysically impermissible, leaving only nihilism or universalism.

  Here are three candidate diagnoses for where the machinery jams. First, you might target Step (5) and deny the empirical claim that biological unity is truly continuous, arguing instead for phase transitions or natural joints that provide sharp breaks. Second, you might target Step (6) and deny that sharp thresholds are metaphysically arbitrary, adopting an epistemicist view where boundaries are precise but unknowable. Third, you might target Step (8) and accept that existence can indeed be indeterminate, thereby embracing ontic vagueness.

  I commit to rejecting Step (6). This step looked innocent because it appeals to a powerful intuition: nature does not make sharp cuts in continuous processes, and any line we draw ourselves is merely conventional. However, this conflates epistemic arbitrariness (we cannot locate the boundary) with metaphysical indeterminacy (there is no fact of the matter). To reject (6) is to accept epistemicism about composition: there is a precise number of cells or degree of metabolic coupling at which composition occurs, even if human concepts and biological observation cannot pinpoint it. The cost is accepting that reality is more precise than our access to it, but this preserves the mind-independence required by (1) and the classical logic of existence required by (8).

  The alternatives are far costlier for your project. Rejecting (2) to allow sortal-relative composition forces you to abandon mind-independence, making composition depend on our conceptual scheme rather than the world. Rejecting (3) to allow brute or disjunctive conditions saves the view but sacrifices the explanatory power you seek; it admits that composition happens but refuses to say why, which undermines the organicist's theoretical virtue. Rejecting (8) to allow indeterminate existence requires overhauling classical logic and identity, a price too high for a seminar paper defending a moderate view. Step (6) is the pivot that turns scalar properties into ontological vagueness; block it, and the argument collapses.

  \answer{Step 6}
