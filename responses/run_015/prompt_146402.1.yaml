answer: |-
  Good evening.

  When I was asked to give this toast, I panicked. I realized I have significantly more experience giving eulogies than retirement speeches. When my father passed, the shape of the occasion was clear: grief, memory, closure. But standing here for Miriam, I am navigating a much trickier identification problem. Half of this room are sociologists who will wince audibly if I commit a level confusion. The other half are Miriam's brother, her granddaughters, and my own teenage daughter, who would rightly leave if I turned this into a lecture on age-period-cohort models.

  So, I will try to thread the needle.

  For thirty-five years, Miriam taught us that the world is not divided by nature, but by paperwork. She argued that birth cohorts are real, but not because of astrology or biology. They are real because the state makes them real. A school-entry cutoff date, a draft lottery, a pension threshold—these are administrative partitions that do genuine causal work. As she famously put it in our first-year seminar: "Cohorts are causes, generations are characters."

  She meant that while institutions treat groups of people differently based on when they were born, it is a category error to assume everyone in that group shares a soul. An aggregate difference between two cohorts can be robust and large, while the distributions overlap so heavily that almost no individual member of either cohort actually has the trait in question. To say "people born in this window are X" is, at best, a claim about a mean, and at worst, an artifact of a small, unrepresentative subgroup.

  Now, full disclosure: I did not become a sociologist. I make my living as a VP of Generational Insights at a brand consultancy. Three weeks ago, my team published a report claiming that Gen Z detects inauthentic brand voice within roughly eight seconds. It was widely mocked. Miriam's email to me consisted of exactly four words: "I raised you better."

  She was right to be stern. But she also taught me that generational labels can acquire a second-order reality simply by being taken up and acted on. Because people believe the labels, brands must navigate them. My job is not to vindicate the labels as natural kinds, but to manage the consequences of the fact that everyone else thinks they are. I am not going to stand here and recant my profession, but I will acknowledge that doing it without Miriam's caution is how you end up with eight-second claims. I am trying to apply her rigor to a field that prefers shortcuts.

  And this brings me to the constraint Miriam placed on this evening. She wrote in the invitation that if anyone says she "shaped a generation of scholars," she will get up and leave. Given her work, she cannot allow us to commit the very error she spent her career dismantling. She did not shape a generation. She shaped *scholars*.

  She did this through specific, administrative mechanisms. She shaped us through the seminar cutoffs, the draft deadlines of dissertation chapters, and the pension-like security of her tenure track that allowed her to take risks on our wild ideas. She didn't transmit a generational spirit; she provided the institutional scaffolding that allowed us to become causes in our own right.

  There is an inside joke here that I think everyone can appreciate. Miriam spent her life warning us against treating gatherings as evidence of a natural kind. Yet, look at this room. We are, by her own definition, an "administrative kind." We are a cohort defined entirely by the institutional threshold of Miriam's retirement. We are partitioned from the rest of the world by the invitation list. And yet, because the institution has acted on us by gathering us here, we are now real. We are a cohort with causal power, if only to drain the bar.

  This is where her work leaves the field. It does not leave a new dogma to replace the old one. It leaves a tool for subtraction. Her legacy is not a theory of who people are, but a method for stopping us from claiming we know too much. She leaves the field more careful, more humble, and less willing to mistake a label for a person. She taught us that the most ethical thing you can do with a category is to recognize its limits.

  To Miriam's brother, who knows that family is a biological fact but also a social construction; to her granddaughters, who will soon face the administrative kinds of college admissions and labor markets; and to my daughter, who I hope will never have to explain age-period-cohort identification at a dinner party.

  Miriam, you taught us that cohorts are causes, but people are individuals. You taught us to be suspicious of the easy story. And even though I work in branding, I promise to remember that the data is an administrative kind, but the client is a person.

  Please raise your glasses.

  To Miriam Kessel. May your retirement be the one administrative partition you enjoy without critique, and may you never have to correct another dissertation on the ontology of the Boomer label. To Miriam.
