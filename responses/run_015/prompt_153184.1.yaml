answer: |-
  ### Immunological Restatement of Democratic Boundary Positions

  **1. The All-Affected-Interests Principle → The Danger Model / Inflammatory Cascade**
  In this configuration, membership in the responding population is not determined by developmental origin (central tolerance) but by receptor engagement with the specific antigenic challenge. When a decision-event occurs, it functions as a pathogen-associated molecular pattern (PAMP) or damage-associated molecular pattern (DAMP). The "demos" comprises any clone possessing a T-cell receptor (TCR) or B-cell receptor (BCR) with sufficient affinity to bind the epitopes presented by that event.

  Boundary permeability is dynamic. If the antigenic load spreads beyond the initial tissue site (systemic effects), the responding repertoire expands to include clones in draining lymph nodes that would otherwise remain naive. Membership is contingent on signal transduction: if the cytokine milieu generated by the decision reaches a threshold concentration at a specific locus, the cells at that locus are recruited into the effector pool. There is no fixed "self"; there is only the set of clones activated by the current inflammatory state. The risk here is cytokine storm—systemic over-activation where the response magnitude exceeds the threat, causing collateral tissue damage.

  **2. The Co-Citizen Closure View → Central Tolerance and MHC Restriction**
  This position posits a fixed repertoire established during thymic selection. Membership is restricted to clones that have undergone positive and negative selection against the host's major histocompatibility complex (MHC) during development. The boundary is the epithelial barrier; inside is "self," outside is "non-self."

  Only clones that demonstrate affinity for self-MHC (positive selection) but lack high-affinity reactivity to self-antigens (negative selection) are permitted to circulate. This creates a closed system designed to prevent autoimmunity. Decisions are processed only by this pre-approved repertoire. External antigens (non-citizens) are ignored or destroyed unless presented by authorized antigen-presenting cells (APCs) within the lymphoid organs. Stability is prioritized over responsiveness; the system risks failing to recognize novel pathogens (immunodeficiency) to ensure it does not attack host tissue (autoimmunity). The boundary is rigid, defined by genetic restriction rather than functional impact.

  **3. The Multi-Species Stakeholder Extension → Mucosal Tolerance and Commensal Symbiosis**
  This model treats genetically distinct organisms as functional components of the self. The gut microbiome serves as the analogue: these are non-self entities (distinct genomes) that are actively maintained via peripheral tolerance mechanisms rather than central deletion.

  Membership is granted through regulatory T-cell (Treg) induction and IgA coating. The host immune system suppresses inflammatory responses against these antigens in exchange for metabolic byproducts (e.g., short-chain fatty acids) that regulate host homeostasis. The "interests" of the non-human stakeholder are signaled via metabolite receptors (e.g., GPR43) rather than direct antigen presentation. If the host attacks the microbiome, system-wide homeostasis collapses (dysbiosis). Therefore, the boundary of the system extends to include symbionts, not because they share MHC restriction, but because their physiological integration is required for the host's survival. Tolerance is active and energy-expensive, maintained by continuous signaling rather than clonal deletion.

  ***

  ### Residue Report

  **1. Clean Translations (Structural Isomorphisms)**
  *   **The Stability/Responsiveness Trade-off:** The tension between the Co-Citizen View (Central Tolerance) and the All-Affected View (Danger Model) maps cleanly onto the immunological trade-off between preventing autoimmunity and ensuring pathogen clearance. A system too open to affected clones risks autoimmunity (tyranny of the majority/systemic inflammation); a system too closed risks inability to handle novel threats (political stagnation/immunodeficiency).
  *   **The Symbiont Problem:** The Multi-Species position translates exceptionally well to the microbiome. Immunology has already solved the philosophical puzzle of how to incorporate "other" genomes into the functional self without triggering rejection. The mechanism of peripheral tolerance (Tregs) is a precise biological analogue for political representation of entities that cannot vote directly but whose health is constitutive of the whole.
  *   **Boundary Maintenance:** Both systems struggle with the same core technical problem: distinguishing "self" from "non-self" when the markers are ambiguous. In politics, this is residency vs. citizenship; in immunology, this is molecular mimicry or latent viruses expressing self-antigens.

  **2. Distorted Mappings (Forced Analogies)**
  *   **Signal vs. Voice:** In the All-Affected restatement, "being affected" is mapped to cytokine reception. However, a cell receiving a cytokine signal is passive; it does not *deliberate*. In the democratic theory, being affected grants agency (a vote). In immunology, being affected triggers a deterministic cascade. This distorts the normative weight of "interest." An immune cell has no interest; it has a threshold.
  *   **Tolerance as Rights:** In the Multi-Species view, tolerance is mapped to membership. But immunological tolerance is often a state of suppression (anergy) rather than inclusion. The microbiome is "tolerated" often because it hides behind mucus layers or actively suppresses the host response, not because the host recognizes its "rights." Mapping this to democratic inclusion risks framing membership as a mere cessation of hostility rather than active participation.
  *   **The Mechanism of Exclusion:** In the Co-Citizen view, exclusion is mapped to clonal deletion (apoptosis). In politics, exclusion is usually spatial or legal (deportation, border control). Apoptosis is irreversible and internal; political exclusion is often reversible and external. The biological metaphor makes exclusion seem like a developmental necessity rather than a contingent policy choice.

  **3. Missing Counterparts (The Null Set)**
  *   **Normative Legitimacy:** Immunology has no counterpart for *legitimacy*. An immune response can be effective (clear the pathogen) but pathological (sepsis). It can be tolerant (ignore the tumor) but fatal. There is no biological metric for whether the response was *just*, only whether it was *survivable*. The philosophical debate about the boundary problem is fundamentally about moral justification, not just system stability.
  *   **Reciprocal Obligation:** In the Co-Citizen view, citizens owe duties to the state. In immunology, T-cells do not "owe" the host anything; they are selected for function. If a T-cell becomes exhausted, it is discarded. There is no concept of mutual obligation, only functional utility.
  *   **Intentional Agency:** The most significant residue is the absence of *intent*. Democratic boundaries are drawn by agents who can conceive of alternative boundaries. Immune boundaries are evolved heuristics. The immune system cannot "decide" to expand the demos for moral reasons; it can only mutate or adapt under selection pressure. The philosophical debate assumes the *demos* can reflect on its own composition; the immune system merely *is* its composition.

  ### Structural Evaluation

  The parallel is **genuine regarding system architecture but false regarding agency.**

  The immunological framework successfully models the *mechanics* of boundary maintenance: the trade-off between openness and security, the integration of symbionts, and the risks of rejection. It reveals that the democratic boundary problem is, structurally, a problem of **signal discrimination under conditions of uncertainty.**

  However, the residue report indicates that democratic belonging performs work biology cannot express: **justification.** Immunology explains how a system *persists*; political theory argues how a system *ought* to persist. The immune system creates boundaries to prevent lysis; the *demos* creates boundaries to authorize coercion. The former is a descriptive failure mode (autoimmunity); the latter is a normative failure mode (illegitimacy).

  **Conclusion:** The immunological metaphor is a high-fidelity model for the *constraints* of democratic membership (you cannot include everyone without risking system collapse), but it fails to capture the *purpose* of membership (moral agency). The residue reveals that democratic belonging is not just about maintaining homeostasis, but about constructing a space for intentional self-modification—something an immune system, bound by evolutionary time scales and biochemical determinism, cannot do.
