prompt: |-
  I just finished a long argument with a friend about the democratic boundary problem—specifically, whether affected non-citizens, future generations, or non-human stakeholders belong to the demos. I work in immunology, so I think naturally in terms of self/non-self discrimination, central and peripheral tolerance, autoimmune failure, microbiome symbionts, and pathogenic invasion rather than social-contract vocabulary. Restate the three main positions on democratic membership—the all-affected-interests principle, the co-citizen closure view, and the multi-species stakeholder extension—using only that immunological framework, mapping each democratic mechanism to its closest immunological counterpart as precisely as you can. Then provide the residue report: which parts of the debate translate cleanly, which require serious distortion to fit, and whether anything central to the philosophers’ disagreement has no counterpart at all in how immune systems establish membership. I want to know whether the structural parallel is genuine or whether the residue reveals that democratic belonging does work that biology simply cannot express. Please answer in American English.
