answer: |-
  ### Interpretive Landscape & Brainstorming

  Before addressing your specific confusions, let us map the terrain. The *Bai Ma Lun* (White Horse Discourse) sits at a precarious intersection of ontology, semantics, and pragmatics.

  1.  **The Textual Core:** Gongsun Long argues that "Horse" names the form (*xing*), "White" names the color (*se*), and "White Horse" names the compound. Since the compound name is not identical to the simple name, the white horse is not the horse.
  2.  **Major Readings:**
      *   **The Nominalist/Semantic Reading (e.g., Chad Hansen):** The School of Names (Mingjia) treats words as concrete "stuff" or mass nouns. "White horse" is a different "stuff" of naming than "horse." The argument is about the discreteness of linguistic tokens.
      *   **The Platonic/Realist Reading (e.g., A.C. Graham, some traditional commentators):** Gongsun Long is a realist about universals (*zhi*). The universal "White-Horse" is a distinct entity from the universal "Horse." The argument is metaphysical: essences are immutable and distinct.
      *   **The Logical/Identity Reading:** The particle *fei* (非) is ambiguous between "is not a member of" (predication) and "is not identical to" (identity). Gongsun Long exploits this to show that while a white horse falls under the extension of horse, the *concept* is not identical.
      *   **The Pragmatic/Political Reading:** The argument serves *Zheng Ming* (Rectification of Names). If we allow "white horse" to be loosely treated as "horse," we lose the ability to make specific demands (e.g., in taxation or military conscription).
  3.  **Modern Analytic Mapping:**
      *   **Intension/Extension:** You noted the intensional difference. In Fregean terms, *Sinn* (sense) differs, but does *Bedeutung* (reference)? The extension of "white horse" is a proper subset of "horse."
      *   **Adjective Semantics:** In modern semantics, "white" is typically an *intersective* adjective. $[[white \ horse]] = [[white]] \cap [[horse]]$. Since $A \cap B \neq B$, the extensions are not identical.
      *   **Sortals:** "Horse" is a sortal providing identity conditions. "White horse" is a restricted sortal.
      *   **Compositionality:** The worry is that if modification breaks category membership, function application in semantics fails.

  With this landscape in view, I can now address your specific confusions regarding the scope of the argument and its status as a puzzle versus a *reductio*.

  ***

  ### Response

  As a fellow traveler in the analytic tradition, I appreciate the rigor you are bringing to the *Bai Ma Lun*. Your intuition that the argument threatens a "sweeping failure of compositional predication" is astute; indeed, that is precisely the anxiety the text provokes. However, your framing contains a subtle category error regarding how Gongsun Long deploys the copula, and this correction is key to dissolving the "global consequence" worry.

  Here is my analysis of your two confusions, grounded in the mapping between the *Mingjia* framework and contemporary philosophy of language.

  #### 1. Is the School of Names Committed to a Sweeping Failure of Compositionality?

  **Short Answer:** No. The School of Names is not committed to the claim that a white horse fails to fall under the extension of "horse" in reality (*shi*). They are committed to the claim that the *name* "white horse" is not interchangeable with the *name* "horse" in discourse (*ming*).

  **The Correction:** You wrote: *"Because the two expressions have different intensions... they cannot be co-extensive or co-referential, hence the white horse is not a horse."*
  This is where the analytic mapping needs adjustment. Different intensions do *not* preclude co-extension (consider "Morning Star" and "Evening Star"), nor do they preclude subset relations. The extensions here are *not* co-extensive (White Horses $\subset$ Horses), but that is trivial. The crux of Gongsun Long's argument is not about class membership (predication) but about **term identity**.

  In the *Bai Ma Lun*, Gongsun Long relies on an equivocation of the Chinese particle *fei* (非).
  *   **Reading A (Predication/Inclusion):** $x \in H$ (The object is a horse).
  *   **Reading B (Identity):** $WH = H$ (The concept "White Horse" is identical to the concept "Horse").

  Gongsun Long's argument establishes that Reading B is false (the concepts differ in intension and extension). He then illicitly slides to the conclusion that Reading A is false (the object is not a horse).

  **The Restricted Framework:**
  The School of Names operates within a framework of **Rectification of Names (*Zheng Ming*)**. Their concern is not primarily metaphysical ontology (what exists) but semantic normativity (how we *use* terms to govern reality).
  *   **Common Names (*Tong Ming*) vs. Specific Names:** They distinguish between names that pick out a broad form (*xing*) and those that pick out a determinate compound.
  *   **The "Request" Test:** Gongsun Long uses a pragmatic test: If you ask for a "horse," a yellow or black horse suffices. If you ask for a "white horse," a yellow horse does not suffice. Therefore, the *demand* constituted by the name "white horse" is not the *demand* constituted by "horse."

  **Conclusion on Confusion 1:** The argument does not generalize to destroy compositionality (e.g., "a red apple is not an apple"). It generalizes only to the **non-identity of compound concepts**. In modern terms, Gongsun Long is asserting that $[[white]] \cap [[horse]] \neq [[horse]]$. This is logically sound. The "sweeping failure" only occurs if you interpret the copula "is" strictly as identity rather than inclusion. The *Mingjia* are not denying that the animal is biologically a horse; they are denying that the *term* "white horse" can be substituted for "horse" *salva veritate* in contexts of naming or command. Thus, compositionality holds for reference (the object is still a horse), but fails for synonymy (the names are not equivalent).

  #### 2. Why is this a Deep Puzzle Rather than a Localized Reductio?

  You ask why commentators treat this as a profound puzzle about reference rather than a *reductio ad absurdum* of a naive semantic theory. There are three reasons why the *Bai Ma Lun* retains its philosophical weight in a comparative context.

  **A. The Opacity of Modification (The "Intersective" Problem)**
  In modern semantics, we treat "white" as an intersective adjective. We assume transparency: if $x$ is a white horse, $x$ is white and $x$ is a horse. Gongsun Long challenges the stability of the base term under modification. He suggests that adding a modifier creates a *new universal* (*zhi*), not just a restricted subset of an old one.
  This resonates with contemporary debates on **conceptual atomism vs. molecularism**. If "white horse" is a new conceptual atom, then our ability to compose meanings from parts is threatened. The puzzle is deep because it asks: *Does modification preserve the essence of the head noun, or does it create a new essence?* Gongsun Long argues for the latter at the level of *Ming* (Name/Concept).

  **B. The Sortal Individuation Problem**
  For a PhD student in compositionality, this connects to the work of **Gupta** or **Wiggins** on sortals. "Horse" provides identity conditions. "White horse" provides different identity conditions (a white horse that turns grey might cease to be a "white horse" but remains a "horse"). Gongsun Long highlights that **reference is sensitive to the mode of presentation**.
  If we treat "white horse" and "horse" as rigid designators of universals, they designate different universals. The puzzle is deep because it exposes the tension between **natural kinds** (Horse) and **phenomenal kinds** (White Horse). If language tracks universals, and universals are distinct, then strict identity fails. This is not a *reductio*; it is a realistic description of how intensional contexts work.

  **C. The Political-Metaphysical Stakes**
  Finally, the reason it is not treated as a mere *reductio* is that the School of Names believed the *consequence* was actually true and necessary for social order. If "white horse" is treated as simply "horse," then specific obligations attached to "white horses" (e.g., tribute, sacrifice) can be evaded by offering a black horse.
  In analytic terms, this is a puzzle about **hyperintensionality**. Two terms can be necessarily co-extensive (in a world where all horses are white) yet differ in cognitive significance. Gongsun Long is arguing that **semantic value cannot be reduced to extension**. This anticipates Frege by two millennia. The "puzzle" is that we want language to be extensional for logic, but intensional for communication. Gongsun Long forces us to choose.

  ### Synthesis for Your Research

  To correct your framing slightly: The argument is not that "compound predicates sever reference from their base category" in terms of *ontology*. It is that **compound names sever identity from their base names** in terms of *semantics*.

  **Can modern semantics absorb this?**
  Yes, but it requires distinguishing levels of analysis:
  1.  **Extensional Level:** $WH \subset H$. (A white horse is a horse). Gongsun Long accepts this regarding the *thing* (*wu*), but ignores it regarding the *name*.
  2.  **Intensional Level:** $Concept(WH) \neq Concept(H)$. Gongsun Long focuses exclusively here.
  3.  **Compositional Level:** $Sem(WH) = f(Sem(White), Sem(Horse))$. Gongsun Long argues that $f$ yields a new, irreducible *Zhi* (universal), not merely a restricted set.

  **Recommendation:**
  Do not read the *Bai Ma Lun* as attacking naive compositionalism. Read it as an early exploration of **non-intersective adjectives** or **subsective modification** in a hyperintensional context. Gongsun Long is pointing out that "white" in "white horse" does not just filter the set of horses; it creates a new criterion of identity for the name.

  For your work on compositionality, the *Bai Ma Lun* serves as a cautionary tale: **Compositionality of reference does not imply substitutivity of terms.** You can maintain that the semantics of "white horse" is composed of "white" and "horse" without conceding that the resulting term is identical to "horse." The "global consequence" you fear only arises if one conflates class inclusion with concept identity—a conflation Gongsun Long intentionally cultivates to demonstrate the precision required in *Zheng Ming*.

  The dialogue is best interpreted as attacking **semantic looseness**, not compositional structure. It demands that we recognize the distinctness of compound concepts, a view entirely compatible with modern two-dimensional semantics or structured proposition theories.
