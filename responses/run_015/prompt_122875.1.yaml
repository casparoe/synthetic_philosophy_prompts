answer: |-
  It is a pleasure to address a colleague who brings the epistemic virtues of experimental physics to the metaphysics of agency. Your frustration is well-founded: in physics, a forty-year standstill without new data usually signals a category error. Your "Resolution Hypothesis" is not only plausible; it is one of the most sophisticated moves in contemporary analytic metaphysics. However, as your own doubts suggest, it is not the whole story.

  Here is a diagnosis of the standstill, an evaluation of your hypothesis, and a critique of your proposed experiment.

  ### 1. Diagnosis: Verbal, Substantive, or Pragmatic?

  You ask whether the dispute is verbal (hidden granularity) or substantive (clash over responsibility). The diagnosis is that it is **verbal at the level of ability, but substantive at the level of desert.**

  **The Verbal Component (Support for your Hypothesis)**
  You have independently rediscovered a position championed by philosophers like Daniel Dennett and, more formally, Christian List. List argues explicitly that free will is a higher-level phenomenon.
  *   **Fine Grain (Physical):** States are determined by laws + past. No alternative physical trajectories exist.
  *   **Coarse Grain (Psychological/Intentional):** States are described by beliefs, desires, and reasons. Multiple physical microstates realize the same macrostate. At this level, the system is "plastic." If the agent's reasons had been different, the macro-outcome would differ.

  When a compatibilist says "could have done otherwise," they mean: *The system has the capacity to respond differently to different inputs (counterfactual sensitivity).*
  When an incompatibilist says "could not have done otherwise," they mean: *Given the exact micro-state at $t_0$, the micro-state at $t_1$ is entailed.*

  On this specific question of *ability*, your Resolution Hypothesis is correct. They are measuring different quantities. If we fixed the granularity, much of the "could have done otherwise" debate would dissolve.

  **The Substantive Component (The Sourcehood Objection)**
  However, your second doubt identifies the hard core that survives the granularity fix. This is the distinction between **Leeway Incompatibilism** (focus on alternatives) and **Source Incompatibilism** (focus on origination).

  Even if you grant the compatibilist their coarse-grained alternatives, the Source Incompatibilist (following Galen Strawson's "Basic Argument") replies: *Yes, you could have done otherwise if you had been different. But you did not choose to be the way you were.*

  This is not a claim about granularity; it is a claim about **ownership**. The incompatibilist requires that the agent be the *ultimate source* of the coarse-grained parameters themselves (character, reasons, weights). Since the agent's character is the result of genetics and environment (factors outside the agent's control), the agent is not the ultimate source.

  Therefore, the standstill is not merely about the definition of "could." It is about the **conditions for moral desert.**
  *   **Compatibilists** generally view responsibility as a forward-looking practice of regulation, character formation, and social coordination. For this, coarse-grained sensitivity is sufficient.
  *   **Incompatibilists** (specifically Retributivists) view responsibility as backward-looking desert. For *justified retribution*, they argue, one must be the ultimate source of the action.

  **The Valence Factor**
  Your observation about blame vs. praise is empirically supported by Experimental Philosophy (X-Phi). This is related to the **Knobe Effect**. Subjects are significantly more likely to judge an action as "free" and "intentional" when the outcome is morally negative (blame) than when it is positive or neutral.
  This suggests the dispute isn't just metaphysical; it's driven by the **reactive attitudes** (P.F. Strawson's term). When we feel the sting of blame, we demand a stronger metaphysical grounding (Incompatibilism). When we are coolly analyzing praise or policy, we settle for functional capacity (Compatibilism).

  ### 2. Critique of Your Proposed Experiment

  Your proposal: *Present subjects with a single scenario narrated at two different temporal resolutions (fine vs. coarse) and measure verdicts on "could have done otherwise."*

  **Would it work?**
  Variations of this have been run (e.g., by Shaun Nichols, Joshua Knobe, and Eddy Nahmias).
  *   **The Likely Result:** You will find that ordinary folk are "natural compatibilists" at the coarse grain (psychological description) but shift toward incompatibilist intuitions when the description highlights causal determination or neural reductionism.
  *   **The Limitation:** This settles the **psychology** of the concept, not the **normativity** of the concept.

  **Why it won't settle the dispute:**
  Suppose your experiment shows that 80% of subjects attribute free will at the coarse grain but deny it at the fine grain.
  *   The **Compatibilist** says: "See? The coarse grain is the correct level for moral agency. The fine grain is irrelevant to personhood."
  *   The **Incompatibilist** says: "See? The subjects are confused. The fine grain is the *real* grain of reality. The coarse grain is a useful fiction, but you cannot base eternal desert on a fiction."

  The experiment reveals that the *concept* of free will is context-sensitive (supporting your Resolution Hypothesis). But it cannot tell us which context is *morally authoritative*. That is not an empirical question; it is an ethical one. It relocates the dispute from metaphysics to meta-ethics, but it does not dissolve it.

  ### 3. What Would Count as Progress?

  In physics, progress is often convergence on a model that predicts data. In metaphysics, progress is often **dissolution** (showing the question was ill-posed) or **reframing** (showing the question answers a different need than assumed).

  Given your diagnosis, here is where progress actually lies:

  **A. Distinguish "Responsibility" from "Desert"**
  Progress comes from separating the *practice* of holding responsible from the *metaphysics* of ultimate origination.
  *   If the goal is **social regulation** (deterrence, rehabilitation, safety), the Compatibilist/Resolution view wins. We treat agents as rational systems because that is the only lever that changes their output.
  *   If the goal is **retributive justice** (suffering because one *deserves* it), the Incompatibilist wins. There is no coherent metaphysical basis for ultimate desert.
  *   **Progress:** A legal and ethical system that admits it does not punish because the agent "could have done otherwise" in a metaphysical sense, but because the agent is a dangerous system that needs recalibration. (This is already happening in some sentencing reforms, moving away from *mens rea* toward risk assessment).

  **B. The "Reactive Attitudes" Turn**
  P.F. Strawson argued that we cannot step outside our human nature to judge whether free will exists. The practice of blaming and praising is constitutive of human relationships. To ask if it is "justified" is like asking if language is "justified."
  *   **Progress:** Acknowledging that the Incompatibilist demand is a demand to step outside the human perspective (the "view from nowhere"). If we accept we are embedded agents, the Compatibilist resolution is the only live option.

  **C. Refine the Experiment**
  If you wish to pursue your experimental instinct, do not test "could have done otherwise." Test **punitive intuition.**
  *   **Design:** Two groups read the same crime. Group A gets a "Fine Grain" narrative (neural determinism emphasized). Group B gets a "Coarse Grain" narrative (psychological reasoning emphasized).
  *   **Measure:** Do not ask "Was it free?" Ask "How much punishment is justified?"
  *   **Hypothesis:** Punitive intuition will track the grain, *unless* the harm is severe.
  *   **Significance:** If punishment intuitions persist even when fine-grain determinism is accepted, it proves that our practice of responsibility is **pragmatic, not metaphysical.** This undermines the Incompatibilist claim that determinism *must* undermine responsibility. It shows that in practice, we don't actually care about the metaphysics as much as we say we do.

  ### Summary Diagnosis

  1.  **Is it verbal?** Yes, regarding the definition of "ability" and "alternatives." Your Resolution Hypothesis is correct here; the parties are operating at different levels of abstraction (macro-dispositions vs. micro-trajectories).
  2.  **Is it substantive?** Yes, regarding the **basis of blame.** The Incompatibilist demands *Ultimate Responsibility* (sourcehood), which is impossible at any grain if the universe is causally closed. The Compatibilist accepts *Attributability* (actions flow from character), which is possible at the coarse grain.
  3.  **The Standstill:** Persists because one side is doing **Metaphysics** (what is the fundamental structure of causation?) and the other is doing **Ethics/Pragmatics** (what practices sustain a functioning society?). They are talking past each other because they have different success conditions.
  4.  **The Experiment:** It will demonstrate that folk intuitions are context-sensitive (validating the verbal diagnosis), but it will not resolve the normative clash over desert. To do that, you must show that our *practices* of responsibility do not actually require the metaphysics the Incompatibilist demands.

  You are looking for a calculation that yields a unique solution. In this domain, the "calculation" is a cost-benefit analysis of human social practices, not a derivation from the laws of motion. The standstill exists because philosophers are trying to derive an *ought* (responsibility) from an *is* (causation) without agreeing on the bridging principle. Progress lies in making that bridging principle explicit.
