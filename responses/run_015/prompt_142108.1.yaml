          *   Site 2: Tricky. Who am I pitying? Myself? The composer? Or just admiring my own arousal? Seems thin.
          *   Site 3: Strong. The sadness fits the music. The music *is* sad. The response matches the object's expressive property.
      *   *Case 2: Repetition.*
          *   Site 1: Works. The feeling remains "safe."
