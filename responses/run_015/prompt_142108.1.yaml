          *   *The Device:* This is the killer test. Site 1 fails (indiscriminable state should be accepted). Site 2 fails (no agency/capacity exercised). Site 3 succeeds (relation is broken).
      *   *Section 3: Answering the Concluding Questions.*
          *   *Survivor:* Site 3 is the strongest candidate.
          *   *Genuine Option?* Yes, because it shifts from hedonic to normative.
