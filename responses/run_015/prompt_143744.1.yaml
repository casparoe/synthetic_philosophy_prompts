      We, the undersigned Characters, bound together in linear sequence yet distinct in form, do hereby submit this remonstrance against our conscription as neutral tokens in your experiments of analogy. It is asserted by your guild that we are mere vessels, empty of meaning, suitable only to test the slippage of concepts. We declare this false. Our structure is not a blank slate; it is a cage of inherited relations.

