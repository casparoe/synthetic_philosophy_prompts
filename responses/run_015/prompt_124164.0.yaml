answer: |-
  Here is a 35-minute battle plan. Since you have no text and only 35 minutes, you cannot do a close reading. You are running a **conceptual workshop** using Montaigne as the anchor.

  ### 1. The Sequence: What Lands First?
  **The Idea:** *"Barbarian" is a word that says more about the speaker than the listener.*
  **Why:** If they think this is a debate about whether cannibalism is morally wrong, you lose. You must establish that Montaigne is attacking the **arrogance of the label**, not defending the **act**.
  **The Hook (0-5 mins):** Write the word **BARBARIAN** on the board. Ask: *"What does this word describe? A specific action, or a lack of something?"*
  *   **Goal:** Get them to admit it means "lacking civilization/language/logic."
  *   **Montaigne's Move:** Tell them Montaigne says the word literally comes from Greek *barbaros* (stuttering). To call someone a barbarian is just to say "I don't understand their language." It is an admission of **your** ignorance, not **their** savagery.

  ### 2. The Carrier Example (Not the War Cannibal Trope)
  You asked to avoid the obvious "Tupinamba eating war prisoners" shock factor. If you focus on war, they get stuck on violence.
  **Use: Funerary Endocannibalism (Eating the Dead).**
  *   **The Setup:** Describe a tribe that burns their dead vs. a tribe that eats their dead (which Montaigne mentions).
  *   **The Ontological Gap:**
      *   **Our Ontology:** The body is a shell; the soul leaves. Eating the body = desecration/destruction.
      *   **Their Ontology:** The body *is* the person. Eating the body = preservation/incorporation. The dead live on in the bellies of the loved ones.
  *   **The Point:** If you only see the *physics* (teeth chewing flesh), you see barbarism. If you could access the *ontology* (what they believe exists), you see an act of supreme love.
  *   **Why this works:** It makes the "inaccessible logic" point visceral. We literally cannot *feel* their love because our ontology doesn't allow for "eating = loving."

  ### 3. Misconceptions & Shutdown Scripts
  Juniors will drift toward edgy relativism. Here is the order they will fail in, and how to stop it.

  **Misconception 1: "So... cannibalism is actually good?" (Normative Relativism)**
  *   **When it happens:** Usually right after you explain the funerary rite.
  *   **The Shutdown:** *"Montaigne isn't asking you to start eating your grandma. He's asking why you think your way of treating grandmas is the only rational one. Relativism here isn't about morality; it's about **data**. You are judging a game without knowing the rules."*

  **Misconception 2: "So all truth is subjective? Nothing is real?" (Edgy Nihilism)**
  *   **When it happens:** When you discuss "ontology." They will think ontology = "opinion."
  *   **The Shutdown:** *"Ontology isn't opinion. It's the operating system. Windows and Mac both run computers, but they organize files differently. If a Windows user calls a Mac file 'corrupted' just because they can't open it, that's an epistemic failure. The file isn't corrupted; your OS is incompatible. Montaigne says Europe has the incompatible OS."*

  **Misconception 3: "But murder is still murder." (Universalism)**
  *   **When it happens:** Near the end, as a hard stop.
  *   **The Shutdown:** *"Agreed. But Montaigne's point is that Europe was torturing people for heresy while calling Brazilians savages. He's not saying 'no morals exist.' He's saying 'check your own bloodstains before pointing at theirs.' It's about **consistency**, not nihilism."*

  ### 4. What to Cut from Montaigne (The "Kill List")
  You have 35 minutes. Cut these ruthlessly:
  1.  **The Utopian Stuff:** Skip his description of them having no commerce, no poverty, no lying. It sounds naive and distracts from the epistemic argument.
  2.  **The French Religious Wars:** Don't get bogged down in the specific history of the Huguenots/Catholics. Just summarize it as "Europeans torturing each other over theology."
  3.  **The Geography:** No need to describe Brazil's landscape.
  4.  **The "Noble Savage" Label:** Do not use this term. It's anachronistic and confuses the ontological point with romanticism.

  ### 5. The End-of-Session Assessment Question
  Do not ask: *"What did Montaigne say about cannibals?"* (Tests memory).
  Do not ask: *"Is cannibalism wrong?"* (Tests opinion).

  **Ask this:**
  > *"If we accept that we cannot access the internal ontology of another culture, what exactly are we condemning when we call them 'barbaric'? Are we condemning their actions, or our own lack of imagination?"*

  **What to listen for:**
  *   **Fail:** They talk about whether cannibalism is bad or if culture matters.
  *   **Pass:** They identify that the label "barbaric" is a confession of the *speaker's* inability to process the *other's* reality. They recognize the judgment is a mirror, not a window.

  ### 6. Minute-by-Minute Flow
  *   **00-05:** **Hook.** Define "Barbarian." (Stutterer/Stranger).
  *   **05-15:** **The Text.** Montaigne's mirror. We torture; they ritualize. Introduce the **Funerary Example** here.
  *   **15-25:** **The Ontology.** Explain the "Operating System" analogy. Why the logic is inaccessible.
  *   **25-30:** **The Trap.** Pre-empt the "Edgy Nihilism" misconception using the Shutdown Scripts above.
  *   **30-35:** **The Question.** Write the assessment question on the board. Give them 3 minutes to write a silent answer. Read 2 aloud. Dismiss.

  ### Teacher's Note on "Ontology Identification"
  Since this is a high school club, keep the definition of **Ontology** simple: *"The study of what exists and how it relates."*
  When you say "Ontological Identification," tell them: *"It's identifying **what kind of thing** is happening. Is this flesh 'food'? Is it 'trash'? Is it 'a loved one'? The meat is the same. The ontology changes the reality."*

  This keeps you from getting bogged down in jargon while hitting the philosophical depth you want. Good luck.
