      *   *Section 3: Regularity and Natural Law (Claim 5).* This is the biggest error. Explain *ʿāda* (habit). Ghazālī allows for prediction and science, just not intrinsic necessity. Distinguish "law" (intrinsic) from "regularity" (divine habit).
      *   *Section 4: Rhetorical vs. Substantive (Claim 6).* Address the "rhetorical move" claim. Cite the *Ihyāʾ* and *Miʿyār al-ʿIlm*. He integrates this into a broader epistemology. It's not just a shield; it's a worldview.
