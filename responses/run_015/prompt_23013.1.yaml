  I keep seeing the triviality result from Lewis's 1976 paper on conditionals described in only one way: if the probability of an indicative conditional "if A, then B" is taken to equal the conditional probability P(B | A), then the probability functions satisfying that constraint are not closed under conditioning, so an agent who learns some new event can end up with a function that no longer obeys the very constraint it was supposed to satisfy. I'm fairly sure Hájek's 1989 objection is a distinct and in some ways more basic problem, and I want to be sure I'm not conflating the two. Can you explain precisely what each argument rules out — what the closure-under-conditioning argument shows, and what the range/ratio argument shows on a finite sample space — and why the latter goes through even for someone willing to accept the cost the former identifies? And then, given both results together, what is the strongest consistent position left for a defender of the equation P(A → B) = P(B | A) as a thesis about an agent's credences?
