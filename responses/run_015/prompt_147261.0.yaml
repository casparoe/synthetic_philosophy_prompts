answer: |-
  You have identified a genuine structural tension, not just a rhetorical trick. Your friend is relying on a distinction that is baked into the theory of constitutional monarchy, but they are deploying it opportunistically.

  Here is the carving of that argument, the theoretical terms that define it, and where the line is drawn between a valid constitutional feature and a rhetorical shell game.

  ### 1. The Rhetorical Pattern: Equivocation on "Power"
  There isn't a single Latin fallacy name for this specific move, but in argumentation theory, this is **Equivocation on a Key Term**.

  Your friend is using the word "power" to mean two different things depending on the attack vector:
  *   **Against Democracy:** "Power" = **Coercive Agency** (the ability to veto, decree, or override the will of the people). They argue the monarch has *none* of this.
  *   **Against Replacement:** "Power" = **Constitutive Authority** (the ability to legitimize, unify, or provide continuity). They argue the monarch has *essential* amounts of this.

  It is distinct from *Motte-and-Bailey* because your friend isn't retreating from a bold claim to a safe one. They are holding two safe claims that contradict each other *if examined simultaneously*. It is a **"Heads I Win, Tails You Lose"** structure regarding the definition of influence.

  ### 2. The Constitutional Theory: *Potestas* vs. *Auctoritas*
  Political theory and Roman law actually have precise terms for this exact duality. It is the distinction between **_Potestas_** and **_Auctoritas_**.

  *   **_Potestas_ (Power):** The legal capacity to command, enforce, and execute. This is what the Prime Minister or Parliament has. When your friend says the monarch is "powerless," they are saying the monarch lacks *Potestas*.
  *   **_Auctoritas_ (Authority):** The social, historical, and moral weight that validates the command. This is what the Monarch has. When your friend says the monarch is "indispensable," they are saying the monarch possesses *Auctoritas*.

  **Walter Bagehot**, the Victorian journalist who codified the theory of the British Constitution, called this the distinction between the **"Dignified"** parts of government (Monarchy, ritual, *Auctoritas*) and the **"Efficient"** parts (Cabinet, Parliament, *Potestas*).

  Your friend's argument is the standard **Bagehotian Defense**: The Monarchy is defensible because it sacrifices *Potestas* to preserve *Auctoritas*.

  ### 3. The "Carving": How the Defense Works
  To define this properly without jargon: The argument carves the concept of "State Function" into two layers.

  1.  **The Layer of Action (The Engine):** This is where laws are made and enforced. The defense claims the Monarch is **absent** here. (Therefore, it is not undemocratic).
  2.  **The Layer of Identity (The Chassis):** This is where the state derives its continuity and unity. The defense claims the Monarch is **central** here. (Therefore, it cannot be replaced).

  The rhetorical sleight of hand happens because **Layer 2 inevitably influences Layer 1.**

  If the Monarch is truly "zero power" (purely a sticker on a car), they cannot be "essential to national identity" in a way that affects governance. If they are essential to the *functioning* of the state (e.g., their signature is required, their moral weight sways public opinion during a crisis), they possess leverage. Leverage is a form of power.

  ### 4. Where it Stops Being a Defense and Starts Being a Trick
  You asked where this stops being a "legit two-level defense" and becomes the rhetorical loop you spotted.

  **The Boundary Condition: The "Soft Power" Threshold.**

  The defense is legitimate **only if** the *Auctoritas* (prestige/continuity) remains completely decoupled from political outcomes.
  The defense becomes fallacious **when** the *Auctoritas* is strong enough to alter political outcomes, because that contradicts the "zero power" claim.

  **Example of the Breakdown:**
  *   **Friend's Claim:** "The King has no power; he just signs what he's told." (Claim: Zero *Potestas*)
  *   **Friend's Counter-Claim:** "But if we elect a president, the nation will fracture because only the King unites us." (Claim: High *Auctoritas*)

  **The Contradiction:**
  If the King's presence prevents the nation from fracturing, the King is exercising **veto power over national stability.** That is a massive political lever. If the King can threaten to abdicate to force a government's hand (as happened in Belgium in 1990 regarding abortion laws), they have *Potestas*.

  **The Test:**
  Ask your friend this: *"If the Monarch is truly powerless, does it matter who holds the office?"*
  *   If they say **"No, it doesn't matter, any figurehead works,"** then they admit the Monarchy is replaceable (your point).
  *   If they say **"Yes, it matters, it must be this specific bloodline,"** then they admit the office holds specific, non-replicable influence.

  If it holds specific influence, it is not "zero power." It is **latent power.**

  ### Summary
  *   **Rhetorical Name:** Equivocation on "Power" (shifting between Coercive Power and Constitutive Authority).
  *   **Theoretical Name:** The *Potestas* vs. *Auctoritas* distinction (or Bagehot's Dignified vs. Efficient).
  *   **The Flaw:** You cannot claim an institution has **zero influence** on outcomes (to satisfy democracy) while simultaneously claiming it has **essential influence** on stability (to satisfy utility).
  *   **The Verdict:** Your friend is treating the Monarchy as a **Passive Object** when attacked on rights, and an **Active Subject** when attacked on utility. That is the loop.
