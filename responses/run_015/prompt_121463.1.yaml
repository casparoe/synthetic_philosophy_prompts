answer: |-
  This is a sharp diagnostic of a rhetorical device that often passes as a philosophical category. You are right to suspect that the incoherence is not merely a lack of precision (a fuzzy family resemblance) but a structural feature of how the term functions politically.

  Here is a mapping of the conceptual knot, broken down by the specific tensions you identified.

  ### 1. The Ontological Problem: Anachronism vs. Essence
  You asked if the trouble is just a "family-resemblance cluster" (democracy, secularism, individualism) or something deeper. The deeper issue is **temporal instability**.

  If "Western values" were a family-resemblance concept, the members of the family would at least be contemporaneous. They are not. The content of "Western values" is retroactively curated to suit present normative needs.
  *   **The Anachronism:** When defenders invoke "Western values" regarding free speech, they often invoke Enlightenment liberalism. When invoking migration or social cohesion, they often invoke Judeo-Christian heritage. These are historically contradictory traditions (e.g., secularism vs. religious foundation).
  *   **The Consequence:** There is no stable *essence* to be Western. Instead, "Western" functions as an empty signifier that gets filled with whatever value the speaker needs to defend against a perceived threat. If the threat is "Islamic fundamentalism," the West becomes "secular." If the threat is "atheistic communism," the West becomes "Christian."
  *   **Verdict:** It is not just a fuzzy cluster; it is a **moving target**. This makes it philosophically useless for definition but politically potent for mobilization.

  ### 2. The Indexical Problem: Hiding Normativity
  Your intuition about the indexical nature of the phrase is the crux of the rhetorical power. "Western" functions as a **normative camouflage**.

  *   **The Shift:** In a normative debate, the burden of proof lies on the value claim (e.g., "Free speech is intrinsically good"). By attaching the label "Western," the argument shifts from *justification* to *identity*.
  *   **The Mechanism:** The phrase transforms a first-order normative claim ("X is right") into a second-order identity claim ("X is *ours*").
  *   **The Hidden Premise:** The syllogism becomes:
      1.  We are Western.
      2.  Western things are good/valid/civilized.
      3.  Therefore, this policy is good/valid/civilized.
  *   **The Concealment:** Premise 2 is never argued. It is smuggled in as a tautology of cultural self-affirmation. By calling a value "Western," you bypass the need to argue for its universal validity. It turns a philosophical dispute into a boundary-maintenance ritual. You aren't arguing for the value; you are signaling loyalty to the tribe that holds the value.

  ### 3. Dominant vs. Constitutive: The Modal Slippage
  This is where the circularity you noticed lives. There is a constant, unacknowledged slippage between two distinct modal claims:

  *   **Claim A (Empirical/Dominant):** "These values happen to be prevalent in Western societies." (Descriptive)
  *   **Claim B (Ontological/Constitutive):** "These values define what it *means* to be Western." (Essentialist)

  **The Circular Trap:**
  When challenged empirically (e.g., "Individualism isn't dominant in all Western communities"), the speaker retreats to Claim B ("True, but *real* Westernness requires individualism").
  When challenged normatively (e.g., "Why is individualism good?"), the speaker retreats to Claim A ("Because it's what made the West successful").

  This creates a **closed loop of justification**:
  1.  How do we know these are the values of the West? Because the West is defined by them.
  2.  How do we know the West is defined by them? Because they are the values of the West.

  This slippage prevents critique. If you critique the value, you are told you don't understand the culture (Claim B). If you critique the cultural definition, you are told you are ignoring history (Claim A).

  ### 4. The Universalism vs. Ethnocentrism Dilemma
  You asked if the phrase can do argumentative work without collapsing. Structurally, it cannot, because it tries to occupy two mutually exclusive logical spaces simultaneously.

  *   **Horn 1: Empty Universalism.** If "Western values" are truly universal (e.g., human rights, rationality), then the qualifier "Western" is redundant and misleading. If they apply to everyone by virtue of reason/humanity, calling them "Western" implies a cultural ownership that doesn't exist. It suggests these values are the *property* of a specific geography rather than the *inheritance* of the species.
  *   **Horn 2: Naked Ethnocentrism.** If "Western values" are particular to a culture (e.g., specific religious traditions, specific historical legal codes), then they have no normative binding force on non-Westerners. To impose them is imperialism; to use them to restrict migration is exclusionary tribalism.

  **The Rhetorical Trick:** The phrase "Western values" is designed to hover between these horns. It claims the **authority of universalism** (these are the *best* values) without the **obligations of universalism** (everyone must be included). It allows the speaker to say, "These values are objectively true, but only *we* truly embody them."

  ### Summary of the Conceptual Knot
  The phrase "Western values" is not a descriptive category failing to be precise; it is a **performative technology** failing to be honest.

  1.  **It is not a family resemblance;** it is a retrospective construction that selects historical fragments to serve present political ends.
  2.  **It is an indexical of authority;** it substitutes identity signaling for normative justification.
  3.  **It relies on modal slippage;** it oscillates between "what we do" and "who we are" to evade critique.
  4.  **It is logically unstable;** it claims universal validity while asserting particular ownership.

  **Can it do argumentative work?**
  Philosophically? **No.** It cannot ground a normative argument because it begs the question (it assumes the goodness of the West to prove the goodness of the values).
  Politically? **Yes.** Its function is not to clarify truth but to draw boundaries. It creates a "civilizational" in-group that legitimizes exclusion (of migrants) or suppression (of speech) by framing dissent not as disagreement, but as alienation from the community's essence.

  For your chapter, the most productive angle might be to treat "Western values" not as a proposition to be evaluated as true/false, but as a **speech act** to be evaluated by its effects: it creates a border where there was previously only a debate.
