  I will grant you that your grandmother remains a person because personhood is an accumulation of past recognition, not just a present-tense snapshot. Once woven into the community, you don't unravel immediately when the threads thin.

  The move you're making
  You're conflating metaphysical constitution with moral inviolability. You assume that if Amara isn't a full person metaphysically, she becomes merely a thing we can use. That's your strong capacity bias talking. Moral obligation flows from my personhood and my relation to you, not just from your real internal status. I owe care to the vulnerable because I am actually embedded in a community that demands it, not because they have achieved personhood. You treat personhood as a binary switch instead of a gradient. Amara's tragedy isn't that she lacks capacity, but that she was denied the true ontological ground to stand on. The permission to harm her doesn't simply follow from her ontological deficit. You clearly mistake the source of the constraint entirely.

  My answer on Amara
  No, Amara is not a full person in the metaphysical sense, because personhood is a status conferred by real reciprocity, which she lacked. But this doesn't license abuse. She is a victim of ontological violence, and our duty is to incorporate her now, not to discard her for what was denied her. We protect her because we are persons, and persons do not exploit the isolated. Her moral claim comes from our obligation to repair the breach, not from her internal capacities alone. To say she lacks personhood is to name the crime committed against her, not to justify further harm. The community owes her incorporation.

  The case I want back from you
  Consider a man who retains all his cognitive capacities but convinces everyone he is a rock, so they stop treating him as human. He loses all recognition. On your view, he remains a person because his capacity is intact. On mine, he is socially dead. Who is more damaged? If you say him, you admit relations matter constitutively. If you say us, you admit personhood is social. Does his internal light matter if no one sees it?

  Where I'm weakest
  I am weakest on the precise threshold of incorporation; I struggle to define exactly how much recognition is enough to ignite personhood without making it seem like a popularity contest.
