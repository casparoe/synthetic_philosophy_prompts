          *   *Standard Objection:* The "Relevance" objection. Which properties are *relevant*? The user says "decision picks the class," but the decision relies on the probability, which relies on the class. Circularity risk.
          *   *Name:* "Pragmatic dissolution" or "Decision-theoretic approach." The objection is often framed as the "Problem of Relevant Similarity."

