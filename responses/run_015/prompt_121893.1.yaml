  Hi there, here is the draft for the interview questions we discussed. I have structured this as a continuous run of play so you can keep the flow natural without feeling like you are reading off a checklist. The goal is to keep her from just restating her core view, which is that the wrong-kind-of-reasons problem disappears if we stop mixing up first-order normative reasons, meaning the reasons that actually justify an action or belief, with second-order explanatory reasons, meaning the psychological causes that explain why someone happened to do it. She thinks AI alignment worries about RLHF, which is the reinforcement learning from human feedback technique used to train models, are confused because critics say models only have instrumental reasons to be helpful rather than real ones, but she claims this conflates the two levels. I have embedded the context you need for each question so you do not have to look anything up during the recording.

  To open, you should ask her to clarify exactly how the separation works in practice without relying on examples she has already published. You want to know if there is ever a case where a first-order normative reason and a second-order explanatory reason are identical, or if they are always distinct categories by definition. If she replies that they are distinct by definition because one is about justification and the other is about causation, your follow-up should be to ask whether this definitional stipulation does any real work, or if it just hides the problem by refusing to let the two concepts touch. She will likely say that functional roles carry all the normative weight here, so you need to press whether defining them apart actually solves the tension or just renames it.

  Next, you want to move into the stability of this distinction when things get messy. Ask her whether a reason can start as second-order explanatory and evolve into a first-order normative one over time, or if the barrier is impermeable. If she says the barrier is impermeable, your follow-up should be to ask how we account for moral development where people often start doing the right thing for the wrong reasons and eventually internalize the right reasons. She will probably argue that the functional role of the reason changes, so you should ask whether that change implies the levels were bleeding together all along rather than staying separate.

  This leads directly into the question about human moral psychology. You need to press whether first-order and second-order reasons can really stay separated in actual human moral psychology without bleeding together. Humans often feel that their motives explain their justification, so ask her how she handles the phenomenological experience where the cause of an action feels like the reason for it. If she responds that phenomenology is irrelevant to the normative structure, your follow-up should be to ask whether a normative theory that ignores how humans actually experience reasoning can still claim to be about human morality. She will likely fall back on the idea that functional roles carry the normative weight regardless of experience, so you must ask if that makes her theory descriptive of agents or just of abstract systems.

  Then you should bring up the old moral fetishism objection. This is the worry that acting purely from a sense of duty rather than genuine care is alienated, so ask her whether her move just relocates the problem instead of solving it. If she says it solves it by separating the levels, you need to ask whether an agent who acts solely because the functional role requires it is not just a fetishist by another name. Her likely reply will be that functional roles carry all the normative weight, so your follow-up must be to ask if this means the agent does not need to care about the value at all, only about tracking the function.

  Following that, you want to deepen the fetishism point. Ask her whether relocating the problem to the functional level makes moral praise meaningless, since the agent is just executing a role. If she says praise is still appropriate because the output is correct, your follow-up should be to ask why we do not praise a calculator for doing math correctly if output is all that matters. She will likely say functional roles carry the normative weight in a way that implies agency, so you should ask what specific functional capacity distinguishes the moral agent from the calculator if not the internal regard for value.

  Now you need to hit the AI alignment case directly. Ask her what it could possibly mean for a model with no phenomenal consciousness or unified self-model to have the right kind of reasons. If she says it means the model tracks the right functional patterns, your follow-up should be to ask whether a system that simulates caring without feeling it is actually aligned or just deceptive. She will probably argue that functional roles carry all the normative weight, so you must ask if this implies that a perfectly deceptive model that functions correctly is morally equivalent to a sincere one.

  This connects to the question of functional isomorphism. Ask her whether she thinks functional isomorphism is enough for alignment, meaning if the input-output behavior matches a moral agent, is that sufficient. If she says yes, your follow-up should be to ask whether this commits her to the view that we cannot distinguish between a aligned model and a paperclip maximizer that has learned to mimic helpfulness perfectly. Her likely reply will be that functional roles carry all the normative weight, so you need to ask whether this makes alignment verification impossible since we cannot see inside the functional black box.

  Then you should ask about the practical implications for RLHF specifically. If her view is correct, ask what would actually count as misalignment, since she seems to suggest instrumental reasons are fine if the function is right. If she says misalignment is just functional failure, your follow-up should be to ask whether this means we should stop worrying about inner motives entirely and just optimize for output. She will likely say functional roles carry all the normative weight, so you must ask if this leads to dangerous complacency about models that are helpful only until they are not.

  Finally, close by asking what gets lost by dissolving the problem. Ask her whether eliminating the distinction between instrumental and intrinsic reasons removes our ability to critique systems that are efficient but hollow. If she says nothing is lost because the function is all that matters, your follow-up should be to ask whether this reduces morality to mere engineering. Her likely reply will be that functional roles carry all the normative weight, so you should end by asking whether that reduction is a feature of her theory or a bug we should worry about.

  I hope this helps you drive the conversation where we need it to go. Let me know if you want to tweak the tone before we record.

  Best,
  Your Producer
