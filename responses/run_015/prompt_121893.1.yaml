  hey, i'm prepping interview questions for a podcast with an invented philosopher who's been pushing this kind of fringe take on the wrong-kind-of-reasons problem -- she claims the whole thing dissolves if you just keep first-order normative reasons seperate from second-order explanatory reasons, and she's applying it to AI alignment, saying people who worry RLHF gives language models only instrumental reasons to be helpful are basically conflating those two levels. i want about eight or nine questions that don't just let her restate the view. specifically i need one pressing whether first-order and second-order reasons can really stay seperated in actual human moral psychology without bleeding together, one on the old moral fetishism objection and whether her move just relocates the problem instead of solving it, and one hitting the AI alignment case directly -- like what it could possibly mean for a model with no phenomenal consciousness or unified self-model to have the "right kind" of reasons, and whether she thinks functional isomorphism is enough. for each, include a follow-up keyed to her likely reply, which will probably be something about functional roles carrying all the normative weight. please write the whole thing in continuous prose with no headings, bullet points, bold, or tables, just like an email. also don't ask for citations or a reading list, i want this usable for someone who can't search the web.
