answer: |-
  Your intuition is spot on, and your lever variant actually cuts closer to the bone than the standard textbook explanations usually do. You are right to feel that the analogy to Achilles and the tortoise is misleading in this context. When we say Achilles catches the tortoise, we are relying on the fact that position is a continuous function of time, so the limit of the sequence of positions corresponds to a definite physical location at the limit time. But Thomson's lamp is not about position; it is about a state value that is defined discontinuously relative to the history of the system. Your lever construction isolates this perfectly by showing that you can have perfect convergence in the physical substrate, the lever position, while still having total divergence in the functional output, the lamp state. This suggests that the problem is not the supertask itself, nor the infinite sequence, but rather the lack of a rule connecting the limit of the physical process to the state at the limit.

  The philosophical consensus on this, largely established by Paul Benacerraf in the nineteen sixties, aligns with your suspicion that the standard verdict is often recited without understanding the logical machinery behind it. Thomson originally argued that the lamp leads to a contradiction because it cannot be on and cannot be off. Benacerraf pointed out that this is a logical error. The description of the lamp specifies its state for every moment strictly before noon. It says nothing about noon itself. Logic alone does not allow us to infer the state at the limit point from the states approaching the limit point unless we have a premise of continuity. Since the lamp's state is defined by a toggle, it is explicitly discontinuous. Therefore, the state at noon is logically underdetermined by the prior states. It is not that the lamp is in a contradictory state, nor that it is in a mystical superposition, but simply that the premises provided do not entail a conclusion about noon. You could stipulate it is on, or stipulate it is off, and neither would contradict the history of switches before noon.

  Your lever variant clarifies why the convergence of the underlying quantity does not solve this. In analysis, we learn that the limit of a function is not necessarily the function of the limit. If you have a sequence of inputs converging to a value where the function is discontinuous, the outputs may not converge at all. In your example, the lever position converges to one half, but the function mapping position to lamp state is a step function discontinuous at one half. Because the lever oscillates across the threshold infinitely often, the sequence of lamp states is one, zero, one, zero, which has no limit. The physical convergence buys you nothing because the mapping to the state space is broken at the critical point. This confirms your suspicion that the culprit is the discontinuity. If you tuned the nudges so the lever converged to three quarters, the lamp state would converge to on, and there would be no puzzle. The puzzle arises exclusively because the physical limit lands exactly on the discontinuity of the state definition.

  This leads directly to your question about a principled criterion for when a supertask has a determinate outcome. The criterion is essentially whether the state of the system at the limit time is continuous with respect to the trajectory of the system leading up to it. If the physical description of the supertask includes a law of continuity, such as conservation of energy or spatial continuity in a way that constrains the final state, then the outcome is determinate. For example, if the lamp's brightness depended continuously on the lever position, the brightness would converge to a specific dimness at noon, even if the binary on off state does not. In the abstract logical puzzle, however, we are usually given only the discrete history and no continuity rule. In that case, the supertask is indeterminate not because infinity is magical, but because the boundary condition at the limit is missing. It is mathematically analogous to being asked to evaluate a function at a point where it has a removable discontinuity without being told how to fill the hole.

  So, to answer your specific worry about whether the usual convergence story is confused or merely incomplete, it is arguably both. It is incomplete because it often fails to distinguish between the convergence of the physical parameters and the convergence of the state description. It is confused when it suggests that the impossibility lies in the performance of the infinite tasks rather than in the description of the outcome. Your lever construction shows that the physics can be perfectly well behaved while the logical description remains gappy. The verdict that the question is ill-posed is correct, but the reason is not that the lamp cannot exist at noon, but that the concept of the lamp as defined by the toggle history does not extend to noon. To make it well-posed, one must add a rule, such as the lamp retains its last state, or the lamp turns off at the limit, or the lamp state is a continuous function of some other variable. Without such a rule, asking for the state is like asking for the value of zero divided by zero; the operations leading up to it are defined, but the operation at the limit is not.

  Ultimately, the lesson from your variant is that supertasks do not reveal a paradox in infinity itself, but rather a paradox in our expectations of how descriptions should extend to limits. We expect physical processes to be continuous, so we expect the state at noon to be fixed by the approach to noon. But when we define a system using discontinuous rules, like a toggle switch, we break that expectation. The lever example demonstrates that even with a continuous physical trajectory, a discontinuous readout creates indeterminacy. This means the conceptual issue is not about whether infinite tasks can be performed, but about whether our definitions of the system are sufficient to determine its state at the accumulation point. If the definition relies on a property that oscillates without damping at the limit, the state is undefined by that definition alone. You are right to reject the potted Zeno moral; the real moral is about boundary conditions and continuity, and your lever thought experiment is a precise way to demonstrate exactly why the standard toggle story fails to latch onto reality.
