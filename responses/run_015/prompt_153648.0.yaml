answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Bride]'s sibling.

  Standing here, looking at this room, I realize we have a bit of a split audience. On one side, we have the family—the people who know [Bride] as the girl who [insert brief, warm childhood memory, e.g., "used to hide vegetables in her napkin"]. And on the other side, we have the colleagues—the constitutional lawyers, the policy wonks, the people who know [Bride] as the brilliant legal mind who can dismantle an argument in three seconds flat.

  Writing a toast for this room felt a bit like drafting a bill that needs to pass both the House and the Senate. It has to hold up to scrutiny, but it also has to have a heart.

  [Bride], you spend your life dealing with contracts. You know better than anyone that a contract is just a piece of paper until two people decide to honor it. But there's a specific concept in law and philosophy that I've been thinking about lately. Some of you will know it as a "Ulysses Contract."

  It comes from the Odyssey. Odysseus knows he's going to sail past the Sirens. He knows their song is so beautiful, so compelling, that he'll lose his mind and jump overboard. He knows his future self will be weak, even if his current self is smart. So, what does he do? Before he hears the song, while he's still thinking clearly, he orders his crew to tie him to the mast. He makes a rule for his future self that his future self can't break.

  Now, I know what half this room is thinking: *"Great. Comparing marriage to being tied up against your will. Nice analogy."*

  But hear me out. Because I don't think marriage is a trap. I think it's the mast.

  We are all human. We all know that feelings are like weather. Right now, looking at [Groom], [Bride], you feel a warmth that you assume will last forever. And I hope it does. But life isn't just today. Life is ten years from now, when you're exhausted, or money is tight, or you've had a fight about whose turn it is to do the dishes.

  In those moments, your "future self" might not feel quite so loving. That future self might feel like running. That future self might hear a siren song that says, *"It's too hard. Just walk away."*

  And that is why you stand here today. You are tying yourselves to the mast *now*, while you are clear-headed and in love, so that when the storm comes later, you don't have to rely on a feeling that might have temporarily vanished. You rely on the promise you made when you were strong.

  For the family in the room: This isn't about being stuck. It's about safety. It's knowing that you are on a ship together, and you have both agreed that no matter how rough the water gets, neither of you is jumping overboard. You are securing yourselves to each other so you can weather anything.

  [Groom], you're marrying a woman who argues for a living. But today, she's not arguing. She's committing. And that is so much more powerful. She is choosing you, not just for who you are today, but for who you will both be when the song gets loud and the water gets rough.

  So, if you could all please raise your glasses.

  To [Bride] and [Groom]. May you always remember the promise you made while you were happy. May you trust the ropes you tie today when you can't see the shore tomorrow. And may you find that being tied to each other isn't a restriction on your freedom, but the thing that keeps you safe, keeps you close, and keeps you home.

  To the happy couple.
