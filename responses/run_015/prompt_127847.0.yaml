  This suggests a pragmatic decoupling where ontological status is assigned relative to inferential stability rather than the object itself. During the existence proof, the space is treated realistically to ensure deductive rigidity; during axiom modification, it is treated instrumentally to ensure applicability. This implies mathematical objects function as stable fictions whose reality is context-dependent. However, this generates a new problem: what regulates the switch between contexts? If utility dictates ontology, objectivity becomes local and fragile. If structure dictates it, we revert to platonism. The diagnosis points toward a process-oriented view where mathematical truth is not a property of objects but of the stability of practices. The ambiguity is not a failure of philosophy but a feature of practice, indicating that neither static realism nor strict nominalism captures the dynamic lifecycle of mathematical structures as they move from proof to application.
