          *   *Particularist view:* No, if the role *is* to help kin/constituents personally, taking gifts is part of the job, not corruption.
          *   *Analysis:* Modern governance theory suggests "public office as a public trust" is a specific historical invention (Weberian rational-legal authority). However, *betrayal of expected duty* is universal. If the duty is defined as impartiality, gifts violate it. If the duty is defined as patronage, gifts fulfill it. The universalist claim hinges on whether impartiality is a moral necessity or an institutional tool.
          *   *Probability (Universalist):* 0.40. (It's hard to argue fusion *necessarily* equals corruption without importing external norms).

      *   **(b) Anticipatory Reciprocity vs. Retrospective Gratitude:** Does timing matter morally?
          *   *Universalist view:* Yes, anticipatory gifts look like bribes (quid pro quo), retrospective look like thanks. This distinction holds across cultures.
          *   *Particularist view:* In fused systems, the cycle is continuous. Distinguishing "before" and "after" is artificial. The obligation exists regardless of timing.
          *   *Analysis:* Psychologically and legally, *quid pro quo* is the heart of bribery. Anticipatory gifts create an *obligation* to act, potentially compromising judgment. Retrospective gifts reward past action. In a fused system, the obligation exists anyway. But does the *inducement* aspect make it universally problematic?
          *   *Probability (Universalist):* 0.50. (Timing matters for intent, but in high-fusion contexts, the distinction blurs).

      *   **(c) Western Hypocrisy (Lobbying/Patronage):** Does the existence of legalised corruption in the West undermine the universal claim?
          *   *Universalist view:* No, two wrongs don't make a right. Also, lobbying is regulated (disclosure, limits), whereas informal gifts are opaque.
          *   *Particularist view:* Yes, it shows the "universal" norm is actually just a specific way of laundering influence. If the outcome (policy capture) is the same, the moral distinction is cultural window dressing.
          *   *Analysis:* This is a strong argument against *cultural imperialism* but not necessarily against the *moral principle*. However, if the principle is "money shouldn't buy influence," and the West allows it legally, the universal claim weakens.
          *   *Probability (Universalist):* 0.35. (The hypocrisy charge is potent and suggests the norm is more about *form* than *substance*).

      *   **(d) State Capacity and Enforcement:** Can a norm be universal if it requires a strong state to enforce?
          *   *Universalist view:* Yes, moral truths exist independently of enforcement capacity (e.g., "don't murder" is universal even if police are weak).
          *   *Particularist view:* No, "ought implies can." If the state can't pay salaries or provide services, officials *must* rely on private gifts to function. The norm is luxuriously conditional.
          *   *Analysis:* This is the "functionalist" argument. If the gift enables the official to do the job (e.g., fuel for the car), prohibiting it stops governance.
          *   *Probability (Universalist):* 0.45. (Moral norms usually transcend capacity, but *institutional* norms do not).

