      *   *Shifters:* What empirical evidence would help? Comparative outcomes on welfare/service delivery.

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check (a):* Be careful not to conflate "corruption" with "bad governance." Corruption is specifically the abuse of entrusted power. If power is entrusted for patronage, patronage isn't abuse. So, (a) leans particularist.
      *   *Check (c):* The lobbying argument is often used to dismiss anti-corruption. I need to be precise: lobbying is *transparent* influence; gifts are *opaque*. The moral universal might be "transparency," not "no gifts." This lowers the universalist probability for the specific "no gifts" norm.
      *   *Check (d):* "Ought implies can." If the state doesn't pay living wages, the gift is a subsidy. Prohibiting it is morally hazardous.
      *   *Combination:* I shouldn't just average them. If (a) is false (corruption *does* require separation), the whole universalist claim collapses. So (a) is a gatekeeper. I will treat it as a high-weight factor.

  6.  **Finalizing the Numbers:**
      *   Overall: 0.35
