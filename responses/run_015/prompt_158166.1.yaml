      *   (b) Timing: 0.50 (Intent matters, but context defines intent).
      *   (c) Hypocrisy: 0.30 (Strong evidence against universal *application* of the specific norm).
      *   (d) Capacity: 0.45 (Moral norms shouldn't depend on GDP, but institutional ones do).
      *   *Sensitivity:* (a) is the definition. If corruption is defined by the *violation of local expectations*, the Western norm isn't universal. If corruption is defined by *impairment of public good*, maybe it is. But "public good" is contested. I'll stick with (a) being the most sensitive.
