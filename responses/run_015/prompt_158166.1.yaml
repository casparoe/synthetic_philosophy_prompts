      *   The prompt asks about the specific Western norm: "prohibiting substantial gifts to officials regardless of intent." Is *that specific rule* universal? Probably not.
      *   Estimated Credence: 0.35. (Slightly higher than the user because there is *some* universal core regarding fairness, but low because the specific prohibition is institutional).

