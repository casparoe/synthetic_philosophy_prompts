  4.  **Rank the Defeaters (Fatal to Awkward):**

      *   *Fatal 1: The Teleological vs. Functional Mismatch.* Aristotle's metaphysics is about *ends* (telos), not systemic function. If the *end* is virtue/politics, not "economic stability," the "functional tether" reading imposes a modern systems-view on an ancient virtue-ethics view.
      *   *Fatal 2: The "Kapelike" Problem.* Aristotle condemns *all* trade for profit, not just interest. Even if tethered to goods, if the *goal* is infinite accumulation, it's unnatural. The user's thesis suggests trade *is* okay if tethered. Aristotle says trade *for profit* is generally debasing regardless of the tether.
      *   *Strong: Anachronism of "Value."* Aristotle doesn't have a labor theory of value or a clear use/exchange value split like Marx/Smith. He talks about *chreia* (need). Projecting "value-autonomy" might be reading Marx back into Aristotle.
      *   *Moderate: Unfalsifiability.* If the user defines "tethered" so loosely that any non-usurious trade counts, the critique loses bite.
