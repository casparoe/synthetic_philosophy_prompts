  Here is a decision tree designed for your reading group. It begins from the shared premise that the impossibility theorems (Chouldechova; Kleinberg, Mullainathan, Raghavan) are mathematically sound: you cannot satisfy Calibration, Equalized Odds, and Predictive Parity simultaneously when base rates differ.

  The tree does not ask you to choose a fairness metric directly. Instead, it asks diagnostic questions about the *world* the metric inhabits.

  ### The Decision Tree

  **Start:** We accept the impossibility result. We cannot maximize all fairness criteria at once.

  **Q1. The Authority Question**
  *Claim:* "The state has the moral right to restrict liberty based on a statistical probability of future behavior, even if the tool is imperfect."
  *   **No:** → **Leaf 1: Abolition**
  *   **Yes:** → Go to Q2.

  **Q2. The Target Question**
  *Claim:* "The historical label we are predicting (e.g., 're-arrest') is a valid proxy for the underlying moral harm we care about (e.g., 'violence')."
  *   **No:** → **Leaf 2: Construct Validity Critique**
  *   **Yes:** → Go to Q3.

  **Q3. The Feedback Question (The PD's Branch)**
  *Claim:* "Deploying this score will causally change the base rates (e.g., detaining someone makes them more likely to reoffend, or surveillance increases arrest counts)."
  *   **Yes:** → **Leaf 3: Human Judgment / Blunt Rule**
  *   **No:** → Go to Q4.

  **Q4. The Blindness Question**
  *Claim:* "We should remove the group membership variable (e.g., race) from the training data to ensure the model is blind."
  *   **Yes:** → **Leaf 4: Fairness Through Unawareness**
  *   **No:** → Go to Q5.

  **Q5. The Unit Question**
  *Claim:* "If two individuals have identical risk-relevant features, they must receive the same risk score, even if this worsens group-level error rates."
  *   **Yes:** → **Leaf 5: Individual Fairness**
  *   **No:** → Go to Q6. (You are now committed to Group Fairness).

  **Q6. The Locus Question**
  *Claim:* "A decision is fair if the subject has a meaningful opportunity to contest it, even if the algorithmic output relies on unfair group statistics."
  *   **Yes:** → **Leaf 6: Procedural Fairness**
  *   **No:** → Go to Q7. (You are now committed to Substantive/Outcome Fairness).

  **Q7. The Agency Question**
  *Claim:* "The person being scored should be allowed to choose which fairness criterion (e.g., calibration vs. error balance) applies to their own case."
  *   **Yes:** → **Leaf 7: Metric Self-Determination**
  *   **No:** → Go to Q8. (You accept the institution must choose the metric).

  **Q8. The Transparency Question**
  *Claim:* "The institution should publicly declare which error trade-off was chosen (e.g., 'We prioritized False Positive parity over Calibration') and why."
  *   **Yes:** → **Leaf 8: Transparent Trade-off**
  *   **No:** → **Leaf 9: Single Criterion (Technocratic)**

  ***

  ### The Leaves: Positions and Commitments

  **Leaf 1: Abolition**
  *   **Position:** *Pretrial Justice Reform / Abolitionism.*
  *   **View:** The impossibility result proves the system is inherently illegitimate. You cannot fairly manage risk when the practice itself (detention) creates the risk.
  *   **Awkward Commitment:** You must accept that some high-risk individuals will not be detained and may cause harm that the score would have predicted.

  **Leaf 2: Construct Validity Critique**
  *   **Position:** *Measurement Realism.*
  *   **View:** The math is right, but the inputs are wrong. "Recidivism" is a biased construct (e.g., policing patterns), so predicting it is morally void regardless of calibration.
  *   **Awkward Commitment:** You likely cannot measure the "true" harm (e.g., unreported violence) better than the proxy, so you may end up with no predictive tool at all.

  **Leaf 3: Human Judgment / Blunt Rule**
  *   **Position:** *Anti-Technocratic Discretion.*
  *   **View:** Because the score changes the base rates (performative prediction), the math is unstable. Revert to human judges or simple rules (e.g., "no detention for non-violent charges").
  *   **Awkward Commitment:** You must defend human judges, who are empirically noisier and less consistent than algorithms, as the fairer option.

  **Leaf 4: Fairness Through Unawareness (FTU)**
  *   **Position:** *Colorblind Technocracy.*
  *   **View:** If we don't feed the model race, it can't discriminate.
  *   **Status:** **TRAP.**
  *   **Awkward Commitment:** You must accept that the model will use strong proxies (e.g., zip code) to reconstruct the group variable, failing to solve the impossibility while preventing you from auditing the disparity.

  **Leaf 5: Individual Fairness**
  *   **Position:** *Similarity-Based Fairness (Dwork et al.).*
  *   **View:** Fairness is a relation between similar individuals, not groups. If the metric treats similar people differently, it is wrong, even if group stats look good.
  *   **Awkward Commitment:** You must define a "similarity metric" that is itself subjective and value-laden, effectively hiding the moral choice inside the distance function.

  **Leaf 6: Procedural Fairness**
  *   **Position:** *Due Process / Contestability.*
  *   **View:** Fairness is not a property of the output, but of the process. If the defendant can see the evidence and argue against it, the statistical imbalance is secondary.
  *   **Awkward Commitment:** You must provide resources for defendants to audit complex models, which is often practically impossible for indigent clients.

  **Leaf 7: Metric Self-Determination**
  *   **Position:** *Unnamed (Incoherent).*
  *   **View:** The subject chooses the metric (e.g., "I prefer calibration" vs. "I prefer equalized odds").
  *   **Status:** **EMPTY CELL.**
  *   **Awkward Commitment:** You must allow different mathematical rules for different people in the same system, which breaks the coherence of the risk scale and makes resource allocation impossible.

  **Leaf 8: Transparent Trade-off**
  *   **Position:** *Democratic Governance of Algorithms.*
  *   **View:** The impossibility result is a political choice, not a technical constraint. The institution must own the choice of which group bears the error cost.
  *   **Awkward Commitment:** You force the institution to make a public moral admission (e.g., "We chose to over-detain Group A to protect Group B") which they will fiercely resist.

  **Leaf 9: Single Criterion (Technocratic)**
  *   **Position:** *Error Weighting / Utilitarian.*
  *   **View:** Pick one metric (usually Calibration or Equalized Odds) and defend it as the "most important" error to minimize based on a moral calculus.
  *   **Awkward Commitment:** You must claim that a mathematical optimization can resolve a moral dilemma, effectively hiding the value judgment behind the "optimality" of the chosen metric.

  ***

  ### Diagnostic Analysis for the Group

  **1. The Trap (Leaf 4)**
  *Fairness Through Unawareness* is included because it is what most institutions actually do. However, in the logical space of impossibility theorems, it is a **trap**. If proxies for the protected attribute exist (and they always do), FTU satisfies neither the group fairness criteria nor the individual fairness criteria, and it prevents you from measuring the disparity. It is a leaf only in the sense that it is a dead end.

  **2. The Empty Cell (Leaf 7)**
  *Metric Self-Determination* is likely incoherent. Impossibility theorems rely on the system operating under a single constraint set. If Subject A demands Calibration and Subject B demands Equalized Odds, the model cannot output a single risk score that satisfies the laws of probability for both simultaneously without fracturing the system. It is a "position" only in the sense of a consumer right, not a statistical reality.

  **3. Indistinguishable Leaves (Leaf 8 vs. Leaf 9)**
  *Transparent Trade-off* and *Single Criterion* are **practically indistinguishable** in outcome. In both cases, the institution selects the metric (since Q7 was answered "No"). The difference is purely rhetorical: Leaf 8 admits the choice is political; Leaf 9 frames it as technical necessity.
  *   *Separation Question:* To truly separate them, you would need to ask: "If the public votes to change the metric, should the model change?" (Leaf 8 says Yes; Leaf 9 says No, the experts decide).

  **4. The PD's Branch (Q3)**
  Notice that answering **Yes** to Q3 (Feedback) bypasses all the technical fairness debates (Q4–Q9). This validates your friend's intuition: if the prediction is performative (i.e., it changes the thing it predicts), then optimizing the static metric is a category error. The only coherent moves there are to stop using the score (Human Judgment) or use it to change the base rates (Intervention), not to tune the false positive rate.

  **5. Unoccupied but Attractive Space**
  There is no leaf for "Interventionist Prediction" (using the score to allocate *help* rather than *punishment* to change base rates). This sits near Leaf 3 but implies keeping the score. It is unoccupied in the legal context because risk scores are almost exclusively used for restriction, not resource allocation, but it is a live option in public health.
