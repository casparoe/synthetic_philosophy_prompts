  **Margin Comments:**

  1.  **Sentence:** "In the remote condition the subject bears no cost by continuing — he is responding to the learner being out of sight and to the experimenter's instruction being salient — and in the proximity conditions he stops for the same reason; nothing there turns on cost."
      *   **Comment:** This contradicts the empirical data: Milgram subjects exhibited extreme stress (trembling, sweating), which is the definitional marker of a 'cost' in this literature. You are treating 'cost' as purely financial or physical, ignoring emotional distress.
      *   **Tag:** DEFINITE
      *   **Cost:** -1 mark (Sorting accuracy)

  2.  **Sentence:** "The same goes for the hurry condition in Darley and Batson, since being late is an irrelevant feature of the situation rather than a price the seminarian must pay in order to help."
      *   **Comment:** By the lecture's definition, a "socially risky" or "unpleasant" feature counts as cost-tolerance. Missing a professional commitment (preaching) is a social cost, not an irrelevant variable like the phone-booth dime. You are conflating 'irrelevant' with 'competing obligation'.
      *   **Tag:** DEFINITE
      *   **Cost:** -2 marks (Sorting accuracy & Application of definition)

  3.  **Sentence:** "And cost-tolerance failure, examined closely, is just bandwidth failure under another description, because whether some feature of a situation counts as a cost at all depends on what the agent happens to attend to."
      *   **Comment:** This is a bold philosophical move, but it undermines the prompt's requirement to use the distinction to sort the replies. Even if accepted, it doesn't excuse you from testing the reply against the 'cost' phenomenon itself, which you later claim scaffolding removes.
      *   **Tag:** CONTESTED
      *   **Cost:** 0 marks (Philosophically permissible, but risky given the question constraints)

  4.  **Sentence:** "If we design institutions that strip out the irrelevant frictions, the hurry and the ambiguity about who is responsible and the noise, then ordinary people will do well enough, and nothing in these experiments says otherwise."
      *   **Comment:** Scaffolding can remove *external* frictions (noise, ambiguity), but it cannot remove the inherent cost of virtues like courage (facing fear) or honesty (social risk). You claim the reply handles "all of it," but it only handles bandwidth failures.
      *   **Tag:** DEFINITE
      *   **Cost:** -3 marks (Failure to test reply against limitations)

  5.  **Sentence:** "Even if the critique went through entirely, all it would show is that virtue is rare, and no virtue ethicist has ever claimed that most people are virtuous; an ideal can be the right ideal even if hardly anyone meets it."
      *   **Comment:** This misses Doris's specific point: virtue ethics requires global traits for *moral evaluation and responsibility*, not just as an ideal. If traits are rare/non-existent, the theory loses its action-guiding force for agents, not just its descriptive accuracy.
      *   **Tag:** READING (Reading charitably as a claim about moral theory vs. moral psychology)
      *   **Cost:** -2 marks (Depth of critical assessment)

  **Summary for the Professor:**

  *   **What was needed to earn the lost marks:** The student needed to acknowledge that while scaffolding might mitigate bandwidth failures (noise, ambiguity), it cannot engineer away the inherent costs of virtue (risk, unpleasantness), which is why the cost-tolerance distinction matters for the reply's scope.
  *   **Single strongest move:** The distinction between Harman's skepticism (no traits exist) and Doris's localism (only narrow traits exist) was clearly and accurately drawn in the second paragraph.

  **TA Note on your dilemma:** You aren't being too hard on the last paragraph; the assessment fails *because* the middle paragraph misclassifies the studies. If Milgram and Good Samaritan are cost-tolerance cases (as the data suggests), the claim that "one reply should be able to handle all of it" is false, and the scaffolding reply consequently overreaches in paragraph four. The mark loss in the final section is justified by the conceptual error in the middle.
