answer: |-
  **Brainstorming and Selection**
  Three approaches: (1) Textual exegesis (compare authors); (2) Abstract definition (define "information"); (3) Applied hypothetical (Lineage V). I choose (3). Exegesis rewards memory, not reasoning. Abstract definitions invite vagueness. The hypothetical forces application: students cannot recite "Godfrey-Smith says X" but must apply the logic of arbitrariness and readership to a novel case. This discriminates understanding from recall. It forces them to resolve the tension between arbitrariness and causal efficacy in real-time, preventing the "some say X, others say Y" pat answer.

  **Exam Question (45 mins, 20 marks)**
  Consider Lineage V (rewritten codon table, same proteins/functions).
  1. Does this drift confirm the mapping is arbitrary (supporting "code") or causally irrelevant (supporting "mere metaphor")? Argue for one.
  2. Given the translation machinery is internally produced, does the lack of an external decoder undermine the "code" claim? Explain what explanatory work "code" performs here that a purely causal description ("nucleotides reliably produce amino acids") does not.

  **Model Answer**
  I argue "code" is legitimate but deflationary. Lineage V confirms arbitrariness: chemistry does not fix the mapping, satisfying a necessary condition for coding. However, this does not make the mapping "mere bookkeeping." The mapping is causally essential *within* the system, even if contingent across possible systems. To call it bookkeeping implies the mapping does no work; but change the mapping without changing the machinery, and the organism dies. The mapping is functionally critical, even if historically accidental.

  Regarding the reader: The regress objection fails. Codes do not require conscious interpreters, only reliable decoding mechanisms. In Lineage V, the tRNA/synthetase complex *is* the decoder. The fact that this decoder is genetically encoded creates a closed loop, not a vicious regress. The system bootstraps itself.

  The word "code" does specific work: it highlights historical contingency. A causal description ("A produces B") often implies physical necessity. "Code" signals that A produces B only because of a frozen accident maintained by selection. This distinguishes genetic inheritance from crystal growth or chemical precipitation. Thus, "code" is not metaphorical fluff; it marks the difference between dynamic laws and historical conventions stabilized by replication. It explains why the mapping is stable yet changeable, unlike physical laws.

  **Marking Scheme**
  1. **Arbitrariness Analysis (4 marks):** Must state V proves mapping isn't chemically fixed. *Error:* Students often say "because it changed, it doesn't matter," confusing mutability with lack of function.
  2. **Causal Role (4 marks):** Must argue mapping is causally active despite contingency. *Error:* Claiming arbitrariness implies causal inertness or "just a metaphor."
  3. **Reader/Regress (4 marks):** Must identify machinery as internal decoder. *Error:* Insisting codes need external agents or conscious stipulators to be real.
  4. **Explanatory Work (4 marks):** Must distinguish contingency (code) from necessity (causal law). *Error:* Saying "code" adds nothing over causation or is purely poetic.
  5. **Commitment (4 marks):** Clear stance, no "on the one hand" hedging. *Error:* Balancing views without choosing or defending a specific position.

  **Note on Contestability**
  Most contestable: The claim that "code" adds value over "causal description." Some argue all causation is contingent, dissolving the distinction. Strong students may argue information talk is never needed if physics is complete, challenging the deflationary defense.
