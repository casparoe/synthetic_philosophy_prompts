  The rules were plain as paper on the wall,
  Ten dollars bright for whoever bid the most.
  We laughed to hear the auctioneer's soft call,
  And raised a hand without counting the cost.
  It started light, a game for breakroom fun,
  Where every raise felt harmless, small, and free.
  But soon the laughter faded into none,
  And silence watched the second place to be.
  But here the twist: the runner-up must pay,
  So quitting now admits you played the fool.
  You bid to save the face you showed today,
  Trapped by the rules of the bidding pool.
  We do not bid for ten dollars at all,
  Just who was wise enough to leave it all.
