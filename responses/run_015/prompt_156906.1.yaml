  NATIONAL FLOOD WARNING SERVICE
  INTERNAL MEMORANDUM
  TO: All Communications Staff
  FROM: Desk of Public Advisories
  DATE: 24 October 2023
  SUBJECT: Protocols Regarding Indicative Conditionals and Probabilistic Formatting

  1. Pursuant to Directive 88-B from the Standing Committee on Non-Propositional Statements, all public advisories must cease the issuance of indicative conditionals. Statements following the structure "If A, then B" are prohibited effective immediately. All risk assessments must be rendered as flat statements of conditional credence formatted as P(Consequent | Antecedent) = x. The credence assigned to the advisory statement is identical to the conditional credence of the consequent given the antecedent. This alignment ensures semantic stability across all broadcast channels and avoids known collapse results in probabilistic logic. Committee members responsible for this directive remain unnamed.

  2. Antecedents must be drawn exclusively from the Official Antecedent Register (OAR), Version 4.2. Staff are encouraged to select antecedents with high specificity to optimize confidence metrics. Narrower antecedent conditions generally yield higher conditional probability values. For example, P(Flooding | River Level > 4m) may be calculated at 0.6, whereas P(Flooding | River Level > 4m AND Pump Station 3 Offline) may be 0.95. Selecting the latter enhances public confidence scores without altering the underlying hydraulic model. Antecedents involving unobservable backend states are preferred for maximum numerical stability. Do not select antecedents with high base rates if doing so lowers the conditional probability.

  3. Legal Counsel notes that flat conditional credence statements possess superior liability profiles compared to material implications. A statement P(B | A) = 0.9 cannot be falsified by the occurrence of A and not-B alone, provided the probability assignment remains coherent within the designated confidence interval. Furthermore, if A does not obtain, the statement remains technically valid and unchallenged by outcome data. This immunity to counterfactual falsification is a primary driver of this policy and protects the Service from claims of inaccurate prediction during dry seasons. No advisory shall be deemed incorrect solely because the antecedent failed to materialize.

  4. Nested conditionals require structural flattening. Advisories previously structured as "If the pumps fail, then if the gate sticks, the ward floods" must be converted to P(Ward Floods | Pumps Fail AND Gate Sticks) = 1.0. This removes hierarchical dependency ambiguity regarding operator scope. Staff should note that this aggregates failure modes into a single conjunction. The semantic loss regarding sequential dependency or causal ordering is acceptable under Committee guidelines regarding non-propositional content. Do not attempt to preserve the nesting structure.

  5. Lexical prohibitions include "would," "should," "could," "might," and "in the event that." Paraphrases attempting to retain modal nuance often reintroduce conditional operators implicitly. Staff must avoid constructions where the truth value depends on a supposition. If a sentence implies a world state different from the actual world, it must be rewritten as a probability distribution over actual states. Drafts containing hidden suppositions will be returned for revision.

  6. Regarding public actionability: Residents are solely responsible for updating their own credences upon observing antecedent conditions. The Service provides the conditional probability; the resident must observe the antecedent to derive the risk of the consequent. If the resident cannot verify the antecedent, the advisory provides no actionable information. This distribution of epistemic labor aligns with Committee findings on semantic commitment and reduces Service liability for failure to evacuate. The number alone is sufficient compliance.

  7. Compliance with this memorandum is mandatory for all departments. If any clause within this memorandum utilizes a conditional construction, that clause shall be considered null and void, and the author subject to disciplinary review.
