  I've been sorting boxes of old tenant letters at a local archive since my grandma died last spring — she actually shows up in one — and now I'm obsessed with what counts as real history versus just old papers. Here are my gut calls. A microhistory that rebuilds one unknown 16th-century miller's worldview from Inquisition fragments: definatly history, maybe the best kind. A standard state narrative of the same era — treaties, royal marriages, wars — is also history, but feels like it's missing the point. A quantitative study of grain prices and mortality across France 1600-1800 with zero named people: I think it's history, but cold, more like economics? My own family tree back four generations from census records: interesting, but I hesitate to call it history — too disconnected. A study of the 1971 Attica uprising told only through warden reports and state memos, with no inmate voices: feels like state propaganda, not real history. A biography of a famous general that ignores supply lines and just celebrates his genius: still history, just shallow. Reconstructing one domestic servant's day in 1890 from her employer's diary: definatly history. But a network map of letters between unknown women in Lyon, 1750-1850, with no individual narrative told — is that microhistory or just sociology? I'm not consistant. Is there a principle that saves most of these, and which verdict do I have to drop? What would it say about a case I haven't listed — say, tracking one working-class family's menus for a full year with no link to food politics or prices? Keep your answer to one tight paragraph, max 180 words.
