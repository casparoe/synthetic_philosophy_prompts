      *   *Selection:* Approach 2 (Survey Sampling/Population Inference) feels most native to the user. It centers on "representativeness" and "selection bias," which are their core concepts. I will blend this with Approach 3 for the self-refutation element. Let's refine the "Counting Unit" issue within this framework.

