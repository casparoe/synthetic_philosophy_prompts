      *   *Approach 3: The Model Selection/Bayesian Evidence Analogy.*
          *   Idea: Cosmological models are competing hypotheses ($H_1$ = Standard Big Bang, $H_2$ = Eternal De Sitter). The "likelihood" of my data under $H_2$ is dominated by BBs. Since BB data looks like mine (initially), $H_2$ predicts I should be a BB. But BBs have false memories, so my data is unlikely under the BB hypothesis *upon scrutiny*.
