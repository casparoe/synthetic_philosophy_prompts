answer: |-
  **Brainstorming Pass**

  *   Coordination vs. Morality: Is this about traffic flow or justice?
  *   Harm to identifiable people vs. Symbolic protest: Who actually bleeds here?
  *   What guests owe hosts: Conformity, courtesy, or non-disruption?
  *   When going along becomes complicity: Does paying the queue price support exploitation?
  *   When refusing becomes rudeness or free riding: Is opting out while benefiting hypocritical?
  *   Epistemic humility: Does the outsider know enough to judge?
  *   Public shaming vs. private dissent: Is the lecture necessary?
  *   Agency of the locals: Does the pensioner *want* to sell? Do the waiters *want* the note?
  *   Efficiency vs. Equity: Jar (equity) vs. Note (merit).
  *   Law vs. Convention: Legal crossing vs. social dignity.

  **Weight vs. Red Herrings**

  Throw out "Law vs. Convention." The law is irrelevant if the convention solves the coordination problem better (crossing). Throw out "Symbolic Protest." Your colleague isn't protesting; he's disrupting.

  The distinctions that carry weight are **Agency**, **Efficacy**, and **Free Riding**.
  1.  **Agency:** Are the locals participating willingly (pensioner selling spot) or is the system coercive (owners underpaying)?
  2.  **Efficacy:** Does the action help the intended beneficiary? (The note hurts the staff workflow; the lecture shames the grandmother).
  3.  **Free Riding:** Can you condemn a system while benefiting from its equilibrium? (Refusing to buy a spot while enjoying the shorter line created by others buying).

  **The Verdicts**

  Here is the hard truth, friend to friend. Your colleague is operating on a universalist moral calculus in a particularist context. He assumes his rules are the default and these local conventions are deviations. He has it backward. These conventions *are* the local morality.

  **1. The Tip Jar (Talk Him Out of It)**
  The jar is a coordination mechanism for wage equity. It acknowledges that the dining experience is a team product, not a solo performance. By slipping a note under the plate, your colleague isn't being "fairer"; he is imposing an external meritocracy on an internal collective agreement. The staff look pained because his note creates administrative friction—they have to explain, divide, or hide it. It signals distrust of their system.
  *Verdict:* **Talk him out of it.** Put coins in the jar. If he wants to reward service, he can write a public review later. Do not disrupt the wage distribution protocol of the household you are visiting.

  **2. The Queue (Tolerate the Refusal, Talk Him Out of the Lecture)**
  This is a market solution to time scarcity. The pensioner has time but needs money; the buyer has money but needs time. Both gain agency. Your colleague's refusal to buy is a valid personal boundary—he can tolerate his own loss of time. But lecturing the woman is patronizing. He assumes she is a victim; she sees herself as an entrepreneur. Worse, by refusing to buy but still advancing as others do, he is free-riding on the efficiency the market creates.
  *Verdict:* **Tolerate the refusal** (it's his time to waste), but **talk him out of the lecture**. He must not moralize his inconvenience as their exploitation.

  **3. The Crossing (Talk Him Out of It—Strongly)**
  This is the most dangerous error. He enforced the *written* rule (law) over the *unwritten* rule (dignity). The local convention isn't "break the law"; it's "don't make the vulnerable look foolish." By shaming the woman with her grandmother, he violated the deeper moral texture to enforce a superficial statute. He was also factually wrong (she was waiting). This is moral clumsiness masquerading as integrity.
  *Verdict:* **Talk him out of it.** Immediately. This is public shaming based on ignorance.

  **Copy, Tolerate, Talk Out**

  *   **Copy:** Nothing. His instincts are good (fairness, anti-exploitation, rule of law), but his execution is consistently blind to local context. Do not copy the behaviors.
  *   **Tolerate:** His refusal to buy a queue spot. It costs him, not others. It is a personal sacrifice, not a public disruption.
  *   **Talk Him Out Of:** The tip note (disrupts staff equity), the queue lecture (violates local agency), and the crossing shaming (violates dignity and facts).

  **The Moral Texture: Why They Differ**

  You asked where the line lies between respecting a convention and propping up a bad arrangement. It lies in **harm** and **knowledge**.

  In the **Tip** case, the convention is protective (kitchen staff vs. front of house). Breaking it harms the vulnerable workers he thinks he's helping. Conformity here is solidarity.
  In the **Queue** case, the convention is transactional. Refusing to participate is fine, but condemning it assumes the seller lacks agency. Here, courtesy requires silence, not conformity.
  In the **Crossing** case, the convention is about social cohesion. Enforcing the law breaks the peace. Here, conformity is courtesy.

  Your colleague's intransigence is a **failure of imagination** in the queue (he can't see the pensioner's agency), **complicity** in the tip (he undermines the staff's chosen equity), and **free riding** in the queue (benefiting from the flow he condemns). But at the kerb, it is simply **rudeness**.

  **Visitor Obligations**

  Does a visitor owe conformity? Only when the convention is coordinative and harmless. You owe courtesy always. You owe resistance only when there is clear, identifiable harm to a non-consenting party.
  *   **Tip:** Conformity owed. (Staff consent to the jar).
  *   **Queue:** Courtesy owed. (Pensioner consents to the sale).
  *   **Crossing:** Courtesy owed. (The woman consented to cross; the grandmother deserves dignity).

  **The Column**

  Do not tell your readers to "do as the locals do." That is lazy. Tell them this: **Moral integrity requires knowing which rules are walls and which are bridges.**

  Your colleague treats every convention as a wall to be scaled. But most are bridges—ways people have agreed to carry each other. When you break a bridge because you don't like the view, you don't stand on solid ground; you stand in the water.

  Write this: The moral texture of ordinary life isn't found in statutes or universal principles. It's found in the chipped jar, the posted price, the paused step. To miss those is to miss the morality entirely. Your colleague thinks he is standing for principle. In truth, he is standing alone.

  Go easy on him. He wants to be good. But tell him: being good here means listening first. Put the coin in the jar. Let the pensioner sell her time. Wait for the grandmother. That is how you honor the people, not the idea of them.

  File the piece. You have the truth of it now.
