  **THE DESERVINGNESS PROTOCOL: CLAIMANT ONBOARDING MANUAL**
  **Version 4.2 | Internal Use Only**

  Welcome to your partnership in subsistence. The Deservingness Protocol exists to bridge the gap between your financial deficit and our societal trust metrics. We believe in accountability. Please review the following clauses carefully. Compliance is not mandatory; it is the definition of participation. Failure to read constitutes consent.

  **1.0 The Reciprocity Ledger**
  Upon disbursement, every pound of state support is immediately logged as a Dignity Debt within your personal Reciprocity Ledger. This debt accrues interest in the form of social scrutiny. To discharge this balance, claimants must engage in approved Performative Labor Units (PLUs).

  Crucially, PLUs are not evaluated on economic output or utility. A swept sidewalk that is immediately re-soiled counts equally to a clean one, provided the sweeping action was visible to a certified Auditor. The goal is not cleanliness; it is the visible discharge of debt. If labor occurs without observation, no Ledger credit is awarded. Unseen work is indistinguishable from leisure.

  **2.0 Pre-Emptive Fraud Audit**
  Before funds are released, claimants must submit to a Pre-Emptive Fraud Audit. You must provide evidence that you have not stolen public resources prior to this application. Acceptable proof includes notarized statements from neighbors confirming your honesty during previous periods of unemployment.

  If you cannot prove you *didn't* cheat before you arrived, we cannot verify you *won't* cheat now. This ensures the Protocol remains secure against hypothetical infractions. Processing fees for this audit are deducted from your first benefit installment.

  **3.0 Gratitude Visibility Requirement**
  Labor discharge must be accompanied by correct affective signaling. Auditors utilize Facial Coding Software to measure gratitude intensity during PLUs. A neutral expression suggests entitlement, which halts Ledger depreciation.

  Claimants must maintain a 15-degree upward lip curve while sorting recyclables or painting over existing murals. Smiling is not optional; it is the currency in which interest is paid. If an Auditor detects resentment, the hourly debt discharge rate is reduced by 50%. We understand this is challenging, but genuine gratitude is the only valid collateral.

  **4.0 Character Exam & Refund Policy**
  All claimants must pass the Entry Character Exam, consisting of scenario-based questions regarding humility. Should you fail this exam, you are ineligible for support. Regarding refunds: The Protocol does not reimburse application fees or time spent testing. Furthermore, under Clause 4.2, you will be invoiced for the administrative cost of this assessment.

  Please note: The Protocol does not offer refunds on dignity. If you dispute your Character Score, you may appeal after discharging your current Dignity Debt in full. We encourage you to succeed; failure is an expensive outcome for all stakeholders.

  **5.0 Final Acknowledgement**
  By signing below, you acknowledge that poverty is a contractual error we are helping you correct. Welcome to the team. Your labor begins yesterday.
