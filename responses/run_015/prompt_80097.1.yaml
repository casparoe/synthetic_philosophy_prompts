answer: |-
  # Activity Run-Sheet: The Oracle's Box
  **Course:** Logic of Time and Tense  
  **Topic:** Future Contingents & Logical Fatalism  
  **Duration:** 75 Minutes  
  **Participants:** 14 Students + 1 Instructor + 1 TA  
  **Materials:** 14 identical slips of paper, 1 opaque box ("The Oracle's Box"), pens, whiteboard, timer.

  ---

  ## 1. The Rules (For TA & Instructor)

  **The Proposition:**  
  Let $P$ = "A Sea Battle occurs tomorrow."

  **The Constitutive Rule:**  
  $P$ is **TRUE** if and only if **8 or more** students (a strict majority of 14) submit a slip marked "TRUE".  
  $P$ is **FALSE** if **7 or fewer** students submit a slip marked "TRUE".

  **The Task:**  
  Each student must submit one slip marking either "TRUE" or "FALSE".  
  Your goal is to submit the slip that matches the actual truth value of $P$.

  **The Payoff:**  
  *   **Correct Prediction:** 2 "Logic Points" (redeemable for course credit/candy/privilege).
  *   **Incorrect Prediction:** 0 Points.
  *   **Why Stakes Matter:** If points are worthless, students treat the vote as a meaningless survey. The stakes force them to care about *alignment with truth*. They must feel the pressure of wanting to be right about a future that their own action helps constitute. This creates the tension between *causing* the truth and *predicting* the truth.

  **Secrecy & Simultaneity:**  
  1.  Students cannot communicate once the activity begins.
  2.  Slips are folded identically.
  3.  All slips are deposited into the Box before any counting begins.
  4.  Once the Box is closed, the future is fixed. No changes allowed.

  **Tie-Breaking:**  
  A 7-7 split results in **FALSE** (since 7 is not a *strict* majority).

  ---

  ## 2. Roles

  *   **Instructor (The Chronicler):** Facilitates the debrief, maintains the philosophical frame, emphasizes the "fixed" nature of the future once votes are cast.
  *   **TA (The Oracle):** Enforces rules, collects slips, counts votes, announces the final result. Must remain neutral and stoic.
  *   **Students (The Bettors):** The agents whose collective decision fixes the truth value.
  *   **Timekeeper (TA or Instructor):** Strictly monitors the 75-minute limit.

  ---

  ## 3. Minute-by-Minute Timeline

  ### Phase 1: Setup & The Rule (00:00 – 00:15)
  *   **00:00 – 00:05:** **Seating.** Arrange chairs in a circle or semi-circle. Place the Box in the center. Distribute slips and pens.
  *   **00:05 – 00:15:** **Instruction.** Instructor reads the following script verbatim (tone: serious, procedural):
      > "We are testing the logic of future claims. On your slip, you will write 'TRUE' or 'FALSE' regarding the proposition: 'A Sea Battle occurs tomorrow.'
      >
      > Here is the law of this room: The battle occurs **if and only if** a strict majority of you vote 'TRUE'. If 8 or more vote 'TRUE', the battle happens. If 7 or fewer vote 'TRUE', it does not.
      >
      > You earn points only if your vote matches the outcome. You cannot talk. You cannot signal. When the TA says 'Stop', pens down. The TA will collect the slips into the Box. Once the lid is on, the future is settled. The counting will take time. You will wait."

  ### Phase 2: Deliberation & Agony (00:15 – 00:35)
  *   **00:15 – 00:30:** **Silent Deliberation.** Students write their votes.
      *   *TA Instruction:* Walk around. If a student asks, "What should I do?" reply only: "You must predict what will be true." If they ask, "Does my vote change it?" reply: "The rule is public. Your vote is part of the count."
      *   *Goal:* Allow the "I think you think I think" loop to induce anxiety. They realize their vote helps *make* the truth they are trying to *guess*.
  *   **00:30 – 00:35:** **Collection.** TA walks around with the Box. Students fold slips and drop them in.
      *   *Critical Moment:* When the last slip drops, the TA closes the lid with an audible click.
      *   *Instructor Script:* "Stop. The votes are in. The battle will happen, or it will not. It is no longer up to you. It is a fact of the past. The future is closed."

  ### Phase 3: The Wait (The "Sting") (00:35 – 00:45)
  *   **00:35 – 00:45:** **Forced Idleness.**
      *   **DO NOT COUNT YET.**
      *   Instructor: "For the next 10 minutes, the truth value of $P$ is fixed. It is either True or False. You do not know which. But it is settled. Sit with that. Do not talk."
      *   *Activity:* Students must sit silently. Instructor stares at the Box.
      *   *Philosophical Goal:* This creates the experiential equivalent of logical fatalism. The outcome exists (in the box) independent of their current knowledge. They are powerless observers of a settled future. This is where they feel the "mere revelation" sting.

  ### Phase 4: Reveal & Payoff (00:45 – 00:55)
  *   **00:45 – 00:50:** **Counting.** TA counts slips publicly on the whiteboard (Tally marks).
  *   **00:50 – 00:55:** **Result & Scoring.**
      *   TA announces the count (e.g., "9 True, 5 False").
      *   TA announces the Outcome ("Battle Occurs").
      *   Students self-report scores (honor system) for the Logic Points.
      *   *Note:* There will be winners and losers. The losers bet on a future that *could have been* true if they had voted differently, but now *could not have been*.

  ### Phase 5: Debrief (00:55 – 01:15)
  *   (See Detailed Debrief Guide below).

  ---

  ## 4. Debrief Guide: Mapping Experience to Argument

  Do not lecture immediately. Ask questions that force them to recount the feeling of the activity.

  **1. The Bivalence/Excluded Middle Premise (00:55 – 01:00)**
  *   *Ask:* "At minute 00:40, while we were sitting in silence, was the proposition 'There will be a battle' true or false?"
  *   *Expected Consensus:* "It had to be one or the other."
  *   *Map:* This mirrors the logical premise: $P \lor \neg P$. Even though we didn't know, the slips in the box meant a truth value existed.
  *   *Press:* "If it was already true then, was it possible for it to be false?" (Students will say "No, the slips were already in.")
  *   *Point:* This is the feeling of **Necessity of the Past**. Once the vote is cast, the future becomes as unchangeable as the past.

  **2. The "Already Settled" Sting (01:00 – 01:05)**
  *   *Ask:* "During the 10-minute wait, did your deliberation matter? Could you have changed the outcome?"
  *   *Expected Consensus:* "No."
  *   *Map:* This is the **Fatalist Conclusion**. If the truth value is fixed now, deliberation is causally inert.
  *   *Press:* "But you deliberated for 15 minutes. Why?"
  *   *Point:* We act *as if* it's open, even when we acknowledge it's fixed. This highlights the tension between our *experience* of agency and the *logic* of determinacy.

  **3. Agency: Mechanism vs. Illusion (01:05 – 01:10)**
  *   *Ask:* "Who decided the outcome?"
  *   *Expected Consensus:* "We did."
  *   *Ask:* "When?"
  *   *Expected Consensus:* "When we voted."
  *   *Ask:* "But during the wait, wasn't it already decided?"
  *   *Point:* This exposes the **Self-Referential Loop**. Your agency fixed the truth, but once fixed, it looked like fate.
  *   *Crucial Question:* "If you knew exactly how everyone else would vote before you walked in, was your vote free?"
      *   If they say "No," they accept hard determinism.
      *   If they say "Yes," ask how it was free if the outcome was mathematically guaranteed by the prior state of the group.

  **4. Bridging to the General Case (01:10 – 01:15)**
  *   *Instructor Closing:* "In this room, the future was fixed by *votes*. In the real world, Aristotle worries the future is fixed by *laws of nature + past events*. The feeling you had in the silence—that the future was already written and you were just waiting to read it—is exactly the feeling the fatalist says we should have about *every* moment, not just this game."

  ---

  ## 5. Predictable Failure Modes & Mitigation

  **1. Collusion / Coordination ("Let's all vote True so we all win")**
  *   *Risk:* Students talk before the silence phase and agree to a Schelling point (e.g., all vote True). This dissolves the tension; the future becomes a cooperative project, not a contingent mystery.
  *   *Mitigation:* Enforce the "No Communication" rule strictly from Minute 00:05. If you hear planning, stop the class and restart the timer. Remind them: "The goal is individual accuracy, not group utility." (Even if this is a lie, it prevents coordination).
  *   *Backup:* If they coordinate anyway, use it in the debrief. "You managed to fix the future by agreement. Does nature allow us to do that with real sea battles?"

  **2. The "It's Just a Game" Dismissal**
  *   *Risk:* Students treat the "Sea Battle" as trivial because it's defined by the game.
  *   *Mitigation:* The Payoff must be real (points/credit). The Instructor's tone during "The Wait" must be somber. Do not smile. Treat the Box as a tomb of possibilities.
  *   *Backup:* In debrief, admit it is a model. "The stakes weren't life and death, but the *structure* of the choice was identical."

  **3. The 7-7 Tie (Exact Split)**
  *   *Risk:* Ambiguity about the outcome.
  *   *Mitigation:* The rule is explicit: Strict Majority (>50%). 7 is not > 7. Outcome = False.
  *   *Backup:* If this happens, highlight it. "The battle did not happen because the support was insufficient. The lack of commitment was the cause of the peace."

  **4. Students Feeling No Tension**
  *   *Risk:* They vote randomly and don't care about the wait.
  *   *Mitigation:* The Instructor must ramp up the gravity during the Setup. "You are betting on reality." If they seem bored, extend "The Wait" by 5 minutes and reduce Debrief time. The boredom *is* the lesson.

  ---

  ## 6. Limitations: What This Activity Cannot Do

  **1. The Causal Gap**
  *   *Limitation:* In this activity, the future is fixed *by the students*. In the real Sea Battle problem, the future is allegedly fixed *independently* of the students (by gods, physics, or logic).
  *   *The Bridge You Must Build:* In the debrief, you must explicitly state: "Here, your votes *made* it true. In the real world, your votes do not make the battle happen. The worry is that *something else* (the past + laws) made it true. The feeling of 'too late to change it' is the same, but the mechanism is different. We simulated the *feeling* of fatalism, not the *metaphysics* of natural determinism."

  **2. Epistemic vs. Ontological Openness**
  *   *Limitation:* During "The Wait," the future was ontologically closed (slips in box) but epistemically open (students didn't know). Students often confuse "I don't know" with "It isn't decided."
  *   *The Bridge You Must Build:* You must press them: "Did the truth value exist in the box?" If they say yes, they accept bivalence. If they accept bivalence + the fixity of the past (the slips), they must accept the future was necessary. You must force them to see that their *ignorance* during the wait does not equal *openness* of the future.

  **3. The "Truthmaker" Problem**
  *   *Limitation:* In the game, the truthmaker is the pile of paper. In reality, what is the truthmaker for a future contingent *now*?
  *   *The Bridge You Must Build:* Acknowledge that the game cheats. It provides a truthmaker (the votes). The philosophical problem is that we can't find the truthmaker for real future contingents. "We gave you a box to hide the truthmaker. Nature gives us no box. That is why the anxiety is worse in real life."

  ---

  ## 7. TA Cheat Sheet (Quick Reference)

  *   **Rule:** True iff $\ge 8$ True votes.
  *   **Payoff:** 2 pts for matching outcome.
  *   **Silence:** Enforce strictly from Min 00:15.
  *   **The Wait:** Min 00:35–00:45. DO NOT COUNT EARLY.
  *   **Script Phrase:** "Once the lid is on, the future is the past."
  *   **If asked "Can I change my vote?":** "No. The future cannot be changed."
  *   **If asked "What if it's a tie?":** "7-7 is False."
  *   **Goal:** Make them uncomfortable with the fixity of the outcome.
