  Here is a principle constructed to fit your specific constellation of verdicts, followed by an analysis of the tensions you identified, the new cases, and the question of scalarity.

  ### The Principle: The Direct & Stable Moral Reason Account

  An action has moral worth to the degree that it satisfies two conditions:

  1.  **The Non-Proxy Condition:** The agent is motivated by the right-making features of the situation (e.g., patient safety, property rights) *under a description that acknowledges their moral significance*, without relying on a surrogate reason (e.g., policy, authority, blind urge) that screens off those features.
  2.  **The Stability Condition:** The recognition of these features is causally sufficient to produce the action even if all non-moral inclinations (e.g., fear, enjoyment, pathological urge) were removed.

  **Why this principle?**
  *   **Clause 1 (Non-Proxy)** is motivated by the **Shop Assistant** and **Dev**. The assistant acts on "Policy," Dev acts on "Sister's Word." Both are surrogates that track morality but are not themselves moral reasons. This excludes them from full worth.
  *   **Clause 2 (Stability)** is motivated by your **Independence Condition** and the **Pharmacist 1 vs. 2** comparison. Pharmacist 1 fails stability (without fear/audit, she stops). Pharmacist 2 passes (care is sufficient).
  *   **The Scalar Element:** The principle allows for degrees based on *how directly* the moral features figure in the explanation (Directness) and *how robust* that motivation is against counterfactual removal of other motives (Stability).

  ---

  ### Resolving Your Tensions

  **1. Dev vs. The Stroke Patient**
  You feel these are structurally identical, yet you judge them differently. On this principle, they are *not* identical, which validates your intuition without gerrymandering.
  *   **Dev** fails the **Non-Proxy Condition**. He defers on *moral judgment itself*. He does not endorse the *reason* (property rights); he endorses the *source* (Sister). The moral feature is screened off by the Sister's authority.
  *   **The Stroke Patient** passes the **Non-Proxy Condition** (barely) but scores low on **Directness**. She reflectively endorses the *value* ("right way to live"), not just a source. However, she scores lower than **Pharmacist 2** because the *causal work* is being done by the urge, not the endorsement. Her moral reason is present but causally secondary to the pathology.
  *   **Verdict:** Keep the distinction. Dev lacks moral grasp; Stroke has moral grasp but compromised agency.

  **2. The Kidney Donor**
  You feel reluctant about the "No Worth" verdict because the right reason was "sitting right there."
  *   **Recommendation:** **Overturn the reluctance.** Stick with **No Worth**.
  *   **Why:** Moral worth tracks *actual* motivation, not *dispositional* character. If the operative reason is partiality (kin), the action is morally lucky, not morally worthy. The counterfactual ("would have donated anyway") is irrelevant to the worth of *this* action. Clinging to this reluctance will force you to accept that accidental rightness counts as worth, which undermines the Shop Assistant verdict (who also tracks rightness reliably).

  **3. Duty + Enjoyment**
  *   **Verdict:** **Full Worth.**
  *   **Why:** This satisfies **Stability**. The enjoyment is an additive motive, not a necessary one. Since the agent *would* have acted from duty alone, the moral reason is sufficient. Enjoyment does not screen off the duty; it merely accompanies it.

  ---

  ### Verdicts on New Cases

  **1. The Fragile Agent (Right reason, near edge of self-control)**
  *   **Verdict:** **Full Moral Worth, Low Praiseworthiness.**
  *   **Application:** She satisfies **Non-Proxy** (acts on right reason) and **Stability** (she *did* act on it, proving sufficiency in the actual world).
  *   **Nuance:** The fact that she *would likely have failed* had temptation been stronger suggests her moral character is fragile. On a scalar account, this lowers her *degree* of worth slightly (lower Stability score). On a binary account, she has Worth, but she is less *praiseworthy* than the stoic agent because she faced a higher risk of failure. I recommend treating this as a difference in **Praiseworthiness**, not Worth. Worth tracks the *source* of the action; Praiseworthiness tracks the *difficulty* overcome.

  **2. The Theistic Error (Returns wallet because God commands it; God doesn't exist/command it)**
  *   **Verdict:** **Reduced/No Moral Worth.**
  *   **Application:** This depends on her mental description.
      *   *Case A:* She sees the suffering of the loser and thinks "God wants me to fix this." Here, the suffering is the proxy for God's will. She has **Partial Worth** (she sees the feature, but misattributes the authority).
      *   *Case B:* She sees the wallet and thinks "God says return lost property," with no reference to the owner's loss. Here, "God's Command" is a **Proxy** (like the Shop Assistant's Policy). She fails **Non-Proxy**.
  *   **Principle Ruling:** If the meta-ethical error screens off the natural right-making features (the harm to the owner), worth is diminished or null.

  **3. The Robot/Software**
  *   **Verdict:** **No Moral Worth.**
  *   **Application:** Fails **Non-Proxy** fundamentally. It has no "reasons," only causes. It cannot represent features *as* morally significant. It is structurally identical to the Shop Assistant, but without even the capacity for endorsement.

  **4. The Committee (Aggregation procedure tracks right reason, no individual does)**
  *   **Verdict:** **No Moral Worth (for the committee as an agent).**
  *   **Application:** Moral worth is a property of individual agency. A committee is a decision procedure. If no individual member acted on the right reason, there is no moral will to praise. The *outcome* is right, but the *agency* is morally empty. (Unless you argue for collective agency, but even then, the "reason" must be held by the collective mind, not just the output).

  ---

  ### Scalar vs. All-or-Nothing

  **Recommendation: Treat Moral Worth as Scalar.**

  Your intuitions are explicitly scalar ("less than," "somewhere above," "borrowed credit"). Forcing an all-or-nothing account will require you to overturn too many verdicts (specifically the Stroke Patient and the Kidney Donor hesitation).

  **How to justify Scalar Worth:**
  Use the **Directness** metric.
  *   **Pharmacist 2:** Moral feature $\rightarrow$ Action. (Direct, High Worth).
  *   **Stroke Patient:** Urge $\rightarrow$ Action $\leftarrow$ Endorsement. (Indirect, Medium Worth).
  *   **Dev:** Sister $\rightarrow$ Action. (Proxy, Low/No Worth).
  *   **Shop Assistant:** Policy $\rightarrow$ Action. (Proxy, No Worth).

  **Explaining the "Degree Talk":**
  If you prefer a binary account, you must explain your degree intuitions as **Praiseworthiness**.
  *   *Binary Worth:* Did the moral reason play a *sufficient* causal role? (Yes/No).
  *   *Scalar Praiseworthiness:* How difficult was it? How pure was the motive? How stable is the character?
  *   *Problem:* This doesn't easily explain why Dev has "borrowed credit" but Shop Assistant has "none." Both did the right thing. The difference is in the *reason*, not the difficulty.
  *   *Conclusion:* A **Scalar Moral Worth** account is more honest to your data. It allows you to say Dev has *some* worth (he trusts a moral authority) but less than the Stroke Patient (who grasps the value), who has less than Pharmacist 2 (whose grasp is the direct cause).

  ### Summary of Advice

  1.  **Adopt the Direct & Stable Moral Reason Account.** It cleanly separates Proxies (Dev, Shop) from Direct Reasons (Pharmacist 2).
  2.  **Overturn the Kidney Donor Reluctance.** Counterfactual motives do not confer worth. This strengthens your exclusion of the Shop Assistant.
  3.  **Maintain the Dev/Stroke Distinction.** They differ on *what* is endorsed (Authority vs. Value).
  4.  **Argue for Scalar Worth.** It accommodates the "degrees" of motivation (urge vs. care vs. deference) without needing a separate category for "borrowed credit."
  5.  **Distinguish Worth from Praiseworthiness.** Use this to handle the "Fragile Agent." She has Worth (right reason), but lower Praiseworthiness (high risk of failure).

  This framework preserves your strongest intuitions (Shop Assistant = No Worth, Pharmacist 2 = Full Worth) while giving you the theoretical machinery to explain the messy middle cases without contradiction.
