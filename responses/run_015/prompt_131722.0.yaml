answer: |-
  The wrongful conviction of Ronald Cotton offers a stark empirical tableau for examining the dispute between the Argument from Illusion (Common Factor Theory) and Disjunctivism. The facts are clear: Jennifer Thompson underwent a traumatic perception, formed a memory, and subsequently engaged in identification procedures that felt veridical to her but were factually false. To analyze this philosophically, we must distinguish between the metaphysical nature of her mental states and the epistemological use made of them by the legal system.

  ### I. Mapping Downward: Mental States and Evidence

  **The Common Factor View**
  On the Common Factor theory, Thompson's mental state during the lineup is of the same fundamental kind as it would have been had she identified the true attacker, Bobby Poole. Because a subject can be in a state that is subjectively indistinguishable from a veridical memory while being mistaken, there must be a "highest common factor"—a shared experiential core—that constitutes what she is directly aware of.

  *   **The Mental State:** When Thompson looked at Ronald Cotton in the photo array, she entered a state characterized by a specific qualitative feel: vividness, familiarity, and certainty. This state is the same *kind* of state she would have occupied had she looked at Poole. The difference lies only in the causal history (Poole caused the original memory trace; Cotton did not), not in the immediate experience.
  *   **The Evidence:** For the police and jury, the evidence is Thompson's testimony regarding this common core. Her confidence and the vividness of her recollection are treated as reliable indicators of the accuracy of the identification because, on this view, confidence attaches to the experiential core which is present in both true and false identifications.
  *   **The Conclusion:** Given this treatment, the police and jury were rational to convict. If the internal feel of a true memory and a false memory are identical, and the system must rely on internal reports, then high confidence is the best available proxy for truth. The Common Factor theorist would say the system failed not because of a philosophical error, but because the common factor is, unfortunately, an unreliable guide to the external world.

  **The Disjunctivist View**
  Disjunctivism denies that Thompson's successful perception of her attacker (had she seen Poole) and her mistaken identification of Cotton share a common experiential kind.

  *   **The Mental State:** During the assault, if Thompson saw Poole, her experience was relational: Poole himself was a constituent of her experience. During the lineup, when she identified Cotton, she was *not* in a state of "remembering Poole." She was in a fundamentally different state: a state of *seeming* to remember, or confabulating a link. These are not two degrees of the same state; they are different categories of mental event.
  *   **The Evidence:** For the disjunctivist, the only genuine evidence of the crime is the relational state (the actual memory of Poole). Thompson did not possess this evidence during the lineup. What she possessed was a non-relational state that mimicked the evidence. Therefore, her testimony was not a report of a memory relation, but a report of a non-relational seeming.
  *   **Confidence and Vividness:** On this view, confidence in the non-veridical case does not attach to a shared core; it attaches to the non-veridical state itself. It is a property of the illusion. Consequently, confidence is epistemically hollow in the mistaken case. It signals the intensity of the seeming, not the presence of the object.
  *   **The Conclusion:** The police and jury treated Thompson's confidence as a bridge to the truth. The disjunctivist argues this was a category error. They treated a non-relational state (the mistake) as if it warranted the same inferential weight as a relational state (the truth). Given the disjunctivist framework, the options open to them were limited: without external corroboration (like DNA), they had no access to the relational fact. They should have concluded that subjective certainty is compatible with the absence of the object, and thus insufficient for conviction in the absence of other evidence.

  ### II. Mapping Backward: Does the Case Refute Disjunctivism?

  The tempting thought is that the Cotton case confirms the Argument from Illusion. Thompson's experience of identifying Cotton was, from the inside, no different than a true identification would have been. She could not tell the difference. The Argument from Illusion posits that indistinguishability implies a common kind. Since we have a real-world case of indistinguishable error, it seems we have proof of the common kind.

  This temptation must be resisted. The Disjunctivist can argue that the Cotton case confirms the *epistemic* premise of the Argument from Illusion (that subjects cannot distinguish veridical from non-veridical states from the first-person perspective) without confirming its *metaphysical* conclusion (that the states are of the same kind).

  The Disjunctivist insists that the thesis is metaphysical. The fact that Thompson lacked the capacity to discriminate between her state of remembering and her state of confabulating does not entail that the states are ontologically identical. It only entails that the subject's access to the nature of her own state is limited. The case shows that a subject can be in a non-relational state that mimics a relational one. This is exactly what Disjunctivism predicts: the existence of non-veridical states that are subjectively similar but metaphysically distinct. Therefore, the case does not refute Disjunctivism; it merely illustrates the epistemic difficulty Disjunctivism acknowledges. To claim the case refutes Disjunctivism is to assume that indistinguishability entails identity, which is precisely the point in dispute.

  ### III. Mnemonic Disjunctivism: An Extension

  The conviction rested not on Thompson's perception during the assault, but on her memory during the investigation. We can extend Disjunctivism to memory: **Mnemonic Disjunctivism**. This view holds that genuinely remembering an event and merely confabulating or imagining it are not states of a common kind. Veridical memory is a relation to a past event; confabulation is a generation of content without that relation.

  **Predictions and Applications**
  1.  **The Photo Array and Lineup:** Under Mnemonic Disjunctivism, when Thompson picked Cotton, she was not accessing a trace of the assault. She was generating a new association. The photo array did not trigger a memory; it triggered a construction. The procedure assumed that showing photos would "refresh" a relational memory. Mnemonic Disjunctivism predicts that if the relational link is broken (e.g., by stress, cross-racial factors, or time), the procedure will not recover the relation but will invite a confabulatory state that feels like memory.
  2.  **Thompson's Certainty:** Her certainty is explained as a feature of the confabulatory state. Just as a hallucination can be vivid, a confabulated memory can carry a high degree of subjective conviction. Mnemonic Disjunctivism predicts that certainty is not a reliable metric for distinguishing the two kinds of states because the non-relational state can instantiate properties (vividness, confidence) that mimic the relational state.
  3.  **Reliability:** Was the procedure reliable in principle? For the Common Factor theorist, the procedure is reliable if it successfully triggers the common core. For the Mnemonic Disjunctivist, the procedure is only reliable if it successfully re-establishes the relation to the past event. If the procedure (e.g., a suggestive lineup) induces a confabulatory state, it is not merely "less accurate"; it is producing a different kind of mental event entirely.

  **Help or Hurt?**
  This extension helps the Disjunctivist explain *why* the system failed. The legal system operates on a Common Factor epistemology: it assumes that the "feeling of remembering" is a uniform signal that can be calibrated for accuracy. Mnemonic Disjunctivism explains that the system was trying to measure the intensity of a state that, in Cotton's case, lacked the requisite object.

  However, this extension hurts the Disjunctivist regarding the *solution*. If veridical and non-veridical memories are fundamentally different kinds, and the subject cannot tell them apart from the inside, then the subject is never in a position to know which kind they are in without external validation. This leads to a form of skepticism. The Disjunctivist must admit that Thompson could not have known she was wrong until the DNA test. The Mnemonic Disjunctivist explains the error well but leaves the witness with no internal criterion for truth. It highlights that the legal system's reliance on internal testimony is philosophically naive, but it does not offer a way to salvage internal testimony.

  ### IV. The Epistemic Commitment

  I commit to the position that the Cotton case is **evidentially inert** with respect to the metaphysical dispute between Disjunctivism and the Argument from Illusion, but it serves as a decisive pragmatic reductio of the Common Factor *epistemology* employed by the legal system.

  **Reasons for this Position:**
  1.  **Metaphysical Inertia:** The case establishes that a subject can be in a non-veridical state that is indistinguishable from a veridical one. Both theories accept this datum. The Common Factor theorist infers a shared ontological core. The Disjunctivist infers a limitation on the subject's discriminatory powers. The facts of the case (the wrongful conviction, the DNA exoneration) describe the *outcome* and the *causal history*, but they do not reveal the *intrinsic nature* of Thompson's mental state during the lineup. We know she was wrong; we do not know, based solely on these facts, whether her state shared a core with a right identification or was a distinct kind of state. To treat the case as evidence for the Common Factor view is to beg the question by assuming that indistinguishability entails identity.
  2.  **Epistemological Critique:** While metaphysically inert, the case is normatively decisive against the Common Factor *approach* to evidence. The legal system treated Thompson's confidence as evidence of accuracy. This assumes that confidence tracks the common core in a way that correlates with truth. The Cotton case demonstrates that confidence can be high in the absence of the object. The Disjunctivist framework, which treats the non-veridical state as lacking the object entirely, better explains why confidence was a misleading guide. It clarifies that confidence in the non-relational case is not a degraded form of truth-tracking; it is a feature of an error state.

  **Points of Silence:**
  The case is silent on the phenomenology of the states. We have Thompson's report ("I was sure"), but we do not have independent access to the qualitative character of her experience to compare it against a veridical baseline. Neither theory can be proven true by the exoneration alone, because exoneration only tells us about the world (Cotton was not the rapist), not about the mind (whether her memory state shared a core with a true memory).

  **Conclusion:**
  The Cotton case does not settle the metaphysics of perception or memory. However, it vindicates the Disjunctivist warning: we cannot infer the presence of the world from the character of the experience. The legal system failed because it acted as a Common Factor theorist, assuming that the internal feel of the testimony guaranteed a connection to the facts. The Disjunctivist view, while offering no internal method for Thompson to have known better, correctly diagnoses that her testimony, in the absence of external corroboration, was never the kind of evidence that could sustain a conviction. The case is inert on what the mind *is*, but critical on how we should *trust* it.
