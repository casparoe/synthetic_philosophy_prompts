  **THE DISPOSITION EDIT**
  *By Julian Fiske*

  In the hushed mews of Mayfair, behind a door marked only by a modal logic symbol, sits The Mask Clinic. It smells of ozone and expensive linen. Dr. Elias Vane, the founder, offers me an espresso made from water that has been philosophically purified. 'Most people,' he says, stirring slowly, 'are living inauthentic counterfactuals.'

  Vane's boutique consultancy promises to strip away the social masking that obscures your true dispositional profile. It is wellness for the metaphysically anxious. We spend much of our lives believing we are fragile, witty, or soluble, only to find that when struck, teased, or immersed, nothing happens. According to Vane, this is usually a Johnston-style mask. You possess the categorical base—the physical ground of your personality—but external interferers prevent the manifestation. 'Think of it as bubble wrap for the soul,' Vane explains. 'You are still brittle, but you do not break. It is exhausting.'

  However, the clinic's signature service addresses the more insidious Martin-style fink. Here, the disposition itself vanishes the moment the stimulus approaches. You are generous until someone asks for money, at which point the generosity ceases to exist. 'It is a betrayal of the self,' Vane murmurs. 'You cannot trust your own nature if it flees upon testing.'

  To combat this, Vane has pioneered the 'reverse-fink implant'. It is a metaphysical stabiliser, inserted via a rigorous conceptual audit. The implant ensures that your brittle dispositions persist through the stimulus, forcing the manifestation to occur. If you are irritable, you will snap when provoked. If you are charming, you will dazzle upon entry. There is no more hiding behind a categorical base that refuses to engage.

  We discuss Bird's proportionality. Clients often claim causal credit for effects they did not truly ground. 'You want your dispositions to be proportional,' Vane advises. 'Do not claim you broke the vase if your fragility was overdetermined by the hammer. Authenticity requires precise causal mapping.'

  The process is not cheap. To be truly known is a luxury good. But for those tired of being masked by circumstance or finked by their own instability, The Mask Clinic offers a rare promise: that when you are finally struck, you will shatter exactly as nature intended.

  ***

  **DIAGNOSTIC TIERS**

  **Surface Behavour Scan**
  *£1,500*
  Observational analysis of manifest properties. Ideal for those confident in their categorical base but unsure of output.

  **Categorical Base Audit**
  *£4,500*
  Deep dive into the physical grounding of your dispositions. We verify if your wit is real or merely structural mimicry.

  **Full Anti-Fink Clearance**
  *£12,000*
  Includes the reverse-fink implant. Guarantees disposition persistence during stimulus. Side effects may include immediate breakage.

  ***

  I leave the clinic feeling lighter, though perhaps more fragile. Outside, a busker plays poorly. I feel a surge of irritation. I pause. Is this me, or is this a mask? I check my implant. It holds. I scowl. It is a beautiful thing to be truly, causally annoyed.
