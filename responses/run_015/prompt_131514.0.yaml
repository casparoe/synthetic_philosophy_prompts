answer: |-
  I showed them how to guide the torch along the join,
  but gave no chain to tether thought to steel.
  When pressure spiked, the safety margin did flee,
  and no abstract reason could stop the bursting pipe.
  They swore their guess was true, enough to pass the check,
  but guesswork fails when we pretend to know the load.

  In perfect light, they claim to know the path,
  yet luck alone cannot guide us through the shift.
  A belief stays true today, turns false tomorrow,
  without a heavy tether holding down the mind.
  Like statues made to run if left without reason,
  the right answer will flee if the context changes.

  We watched the correct procedure flee the scene,
  because they did not know the why behind the how.
  Old tales say art moves wildly without reason,
  unless you bind it tight to let it guide the work.
  I need a stronger tether on their understanding,
  so what they hold remains stable and true.

  Is success enough if the foundation isn't true?
  I wrap the lesson in a causal tether.
  A map may guide you well until the road dissolves,
  but only those who know the terrain survive the slide.
  Luck will flee when the wind changes direction,
  leaving only cold reason to save the day.

  They recite the steps without a deeper reason,
  watching the margin for error flee away.
  In nearby worlds, they would not know the danger,
  though here their action happened to be true.
  I must teach them how to guide the tool with insight,
  and forge a mental tether against the shift.

  No knot can fully tether chance to skill,
  yet we demand the outcome be strictly true.
  When variables shift, the safe result will flee,
  unless grounded in a solid, causal reason.
  Do we really know the worth of what we hold?
  Or does the belief merely guide us for now?

  Can any tether hold the world as true?
  When stability begins to flee, what reason stays?
  We act as if we know, and let the process guide.
