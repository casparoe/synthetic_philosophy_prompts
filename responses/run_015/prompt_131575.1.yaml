answer: |-
  # The "Is This Canvas Trash?" Decision Tree
  **For the Philosophy Meetup — Week of [Date]**

  So, your grandma left you a painting. Turns out it's a 1980s knockoff. Now you're lying awake wondering if the "real" one is actually better or if you're just mad about the lie. You're not crazy—this is basically the whole philosophy of art in a nutshell.

  Below is a sorting tool. It's not about labeling art; it's about labeling *you*. Answer these five questions honestly. Don't overthink it. Go with your gut reaction. At the bottom, match your answers to see where you stand.

  ---

  ### The 5 Branch Points (Check Your Intuition)

  **1. The Perfect Twin**
  Imagine someone makes a physical duplicate of the original masterpiece. Same canvas, same paint, same chemical age, same brushstrokes down to the micron. The only difference? It was made yesterday by a stranger, not 300 years ago by the Master.
  *   **A:** It's just as good. Art is what you see.
  *   **B:** It's worth less. Art is where it came from.

  **2. The Hangover**
  Imagine a forgery fooled everyone for 50 years. People loved it, cried in front of it, wrote poems about it. Then someone proved it was fake.
  *   **A:** My love for it stays the same. The experience I had was real.
  *   **B:** My love drops instantly. Knowing it's a lie ruins the past experience too.
  *   **C:** It's still good, but I feel betrayed. The value drops *now*, not back then.

  **3. The Phoenix (AI Edition)**
  The original masterpiece is destroyed in a fire. Gone forever. But an AI scans every surviving photo and 3D-maps the brushwork to create a perfect visual reconstruction. Curators can't tell the difference.
  *   **A:** It counts as the same work of art. The image is what matters.
  *   **B:** It's a copy. The original human touch is gone, so the art is dead.

  **4. The Lie**
  Forget the art for a second. Is the main problem with a forgery that it's ugly/bad, or that it's a scam?
  *   **A:** It's a scam. If they told us it was a copy upfront, it would be fine.
  *   **B:** It's bad art regardless. A forgery lacks the "spark" even if no one lies about it.

  **5. The Skill Flex**
  Here's the weird one. Is there any scenario where the forgery is *more* impressive than the original?
  *   **A:** No. Originality is king. Copying is always lesser.
  *   **B:** Yes. Mimicking genius requires a different, maybe even higher, level of technical skill than having the genius in the first place.

  ---

  ### The Leaves (Where You Landed)

  Match your answers above to these positions. Most people are a mix, but one usually wins.

  **1. The Formalist / Aestheticist**
  *(Mostly 1A, 2A, 3A)*
  You believe art lives in the object itself. If it looks the same, it is the same. The history is gossip; the paint is the truth. You probably think museums are hoarding history, not art.
  *   **Philosophy Vibe:** Formalism, Pure Experientialism.

  **2. The Historian / Provenance Hunter**
  *(Mostly 1B, 2B, 3B)*
  You believe art is an event, not just a thing. The causal chain matters. A painting is a record of a specific human moment. If you break the chain (forgery) or fake the moment (AI), you break the art.
  *   **Philosophy Vibe:** Historicism, Intentionalism.

  **3. The Moralizer**
  *(Mostly 4A, 2C)*
  You care about the honesty more than the ontology. A fake labeled as a fake is fine; a fake labeled as real is trash. The art isn't bad, the transaction is corrupt.
  *   **Philosophy Vibe:** Moralism about Deception.

  **4. The Humanist**
  *(Mostly 3B, 1B)*
  You're okay with copies, but not * replacements*. The AI Phoenix feels like a ghost to you. You need a human being to have intended the work for it to count as "Art" with a capital A.
  *   **Philosophy Vibe:** Human-Centric Intentionalism.

  **5. The Unnamed Position (The Virtuoso View)**
  *(Mostly 5B)*
  This is the rare slot. You think the forger is actually the bigger genius. The original artist had inspiration; the forger had to reverse-engineer inspiration without cracking under pressure. You value the *performance* of authenticity over authenticity itself.
  *   **Philosophy Vibe:** No standard name. Sometimes called "Technical Virtuosity," but usually ignored by philosophers because it messes up their categories.

  ---

  ### The Glitch Report (Diagnostics)

  **Indistinguishable Leaves**
  *   **Formalism vs. Pure Experientialism:** Hard to split these. If you say "only the visual properties matter" (Formalism) and someone else says "only the viewer's experience matters" (Experientialism), you'll agree on 99% of cases. The only time they split is if the painting looks great but gives you a headache.
  *   **Historicism vs. Intentionalism:** These are tangled vines. Usually, if you care about the history of the object, you care about the artist's intent. It's rare to find someone who cares about the provenance chain but doesn't care what the artist was trying to do.

  **Empty Branches (And Why)**
  *   **The "Morally Superior Fake" Branch:** There's almost no one who argues a forgery is *morally better* than an original (unless it's stealing from a tyrant). Why? It's logically ugly. Art forgery relies on trust violation; claiming that violation is a "good" requires contorting the definition of morality too much for most people to swallow.
  *   **The "Physical Difference Only" Branch:** Someone who claims, "The fake is physically identical in every way, but lacks art status solely because of physics, not history." This is incoherent. If the physics are identical, there's no physical ground to stand on to say it's worse. You have to appeal to history or magic.
  *   **The "Independent Work" Branch:** The view that a forgery is a *brand new* original work unrelated to the thing it's copying. This is unexplored. Most people see a forgery as parasitic. If we treated forgeries as independent art (e.g., "This is a 1980s painting *about* a 1600s painting"), the market would collapse, so nobody wants to go there.

  ---

  **Talk about it:**
  If you ended up on **The Historian** leaf, ask yourself: Are you mad about the art, or mad about the money? If you ended up on **The Formalist** leaf, ask yourself: Would you burn the original if you could keep the perfect twin forever?

  *Handout ends.*
