answer: |-
  **JOINT STATEMENT OF PRINCIPLES AND UNRESOLVED DIFFERENCES**
  **Subject:** Secession Theory (Remedial vs. Primary-Right Democratic)
  **Parties:** The Remedial-Right Advocate (RRA) & The Primary-Right Democratic Advocate (PRDA)
  **Status:** Draft 14 (Final Working Version)
  **Date:** After 12 months of adverserial debate regarding Scotland, Catalonia, and Quebec.

  Look, we're not going to pretend we've merged our souls. We haven't. But after a year of banging our heads against the table over whether Quebec had "just cause" or just "just votes," we realized we share enough procedural ground to stop talking past each other. We can sign off on the mechanics of how a secession debate *should* look, even if we disagree on the moral trigger that starts it.

  Below is what we actually agree on, followed by where we still think the other side is wrong, but in a way we can respect.

  ### I. NUMBERED AGREED CLAIMS

  1.  **The Nested Minority Constraint:** Both sides agree that a seceding region cannot claim a right to self-determination that it simultaneously denies to internal minorities within its own borders. If Catalonia claims Spain is suppressing its voice, it cannot suppress the voice of the Spanish-speaking minority in Barcelona. The seceding entity must commit to protecting the rights of those who voted "No" or belong to a different demographic.
  2.  **Intergenerational Binding:** We agree that no generation can permanently bind future generations to a constitutional arrangement. A vote for independence is not a "forever" contract. Conversely, a vote to stay is not a permanent surrender. The political status of a territory must be open to review over time.
  3.  **The Referendum Mandate:** A referendum is not a one-time historical event that settles the question for centuries. However, it is also not a renewable subscription service that can be rerun every election cycle. We agree on a "cooling-off" principle: a clear vote (for or against) creates a mandate that lasts for a generation (approx. 20–25 years) unless material conditions change drastically.
  4.  **The Unit of Analysis:** We agree that the relevant unit for the vote is the *resident population* of the territory, not an ethnic diaspora living abroad. Who lives there decides what happens there.
  5.  **Negotiation Obligation:** If a majority votes to secede, the host state has a moral obligation to negotiate terms in good faith. Obstructionism delegitimizes the host state. However, the seceding region also has an obligation to negotiate debt, borders, and citizenship rights reasonably.

  ### II. TABLE OF DISAGREEMENTS (NEUTRAL FORMULATION)

  We still disagree on the *source* of legitimacy. We have phrased these disagreements in neutral language that both of us can sign without feeling we've betrayed our core theories.

  | Issue | Remedial-Right Formulation (RRA) | Primary-Right Democratic Formulation (PRDA) |
  | :--- | :--- | :--- |
  | **The Trigger** | Secession is justified when the host state persistently fails to protect basic rights or systematically disadvantages the region. | Secession is justified when a distinct political community expresses a democratic majority will to leave, regardless of rights violations. |
  | **The Role of Law** | Constitutional legality matters because it protects stability and rights; breaking it requires extraordinary moral justification. | Constitutional legality is procedural; popular sovereignty is substantive. If the people will it, the constitution must bend. |
  | **The Burden of Proof** | The burden lies on the secessionists to prove harm or injustice sufficient to warrant breaking the state. | The burden lies on the host state to prove why a democratic majority should be forcibly restrained. |
  | **Legitimacy Source** | Derived from *Justice* (outcome-based). | Derived from *Consent* (process-based). |

  ### III. CRUXES AND HYPOTHETICAL TEST CASES

  We identified two specific areas where our theories produce opposite results. We aren't resolving these today, but we are defining the test cases so we know exactly where we stand.

  #### Crux 1: The Recursive Secession Problem (The "Tarragona" Question)
  **The Issue:** If a region (Catalonia) has the right to leave a state (Spain) based on its distinct identity or will, does a sub-region (Tarragona) have the same right to leave the new state (Catalonia)?

  *   **Hypothetical Test Case:** Catalonia declares independence from Spain. Tarragona, which is less nationalist and economically integrated with Valencia, holds a vote to remain in Spain or become independent from Catalonia.
  *   **RRA Prediction:** Tarragona can only secede if the new Catalan government *immediately* violates their rights or discriminates against them economically. Mere preference is not enough.
  *   **PRDA Prediction:** If Tarragona holds a democratic majority vote to separate from Catalonia, they have the right to do so, provided they are viable. The logic of "self-determination" applies recursively.

  #### Crux 2: Constitutional Entrenchment vs. Democratic Revocation
  **The Issue:** Can a democratic majority vote to break the very constitutional rules that made the vote possible? (e.g., The Supreme Court says the referendum is illegal; the Parliament holds it anyway).

  *   **Hypothetical Test Case:** The Constitutional Court of the host state rules a secession referendum unconstitutional. The regional government proceeds with the vote anyway, citing a mandate from the legislature.
  *   **RRA Prediction:** This undermines the rule of law. Unless the state is already tyrannical, breaking the legal framework delegitimizes the secession attempt. You can't use illegal means to achieve a just end unless the legal system is already broken.
  *   **PRDA Prediction:** The court is a veto point, not a sovereign. If the regional legislature represents the people, their mandate overrides the court's procedural ruling. Democracy trumps legalism.

  ### IV. VERBAL DISAGREEMENTS (FLAGGED AS NON-SUBSTANTIVE)

  We spent three weeks arguing about this, and we agree it's a waste of time.

  *   **The Phrase:** "The Scottish People" (RRA preference) vs. "People Living in Scotland" (PRDA preference).
  *   **The Disagreement:** The RRA worries that "people living in" implies transients or colonizers dilute the historical claim. The PRDA worries that "The Scottish People" implies an ethnic or blood-based definition that excludes residents.
  *   **Why It Doesn't Move the Argument:** We both agree on the *voter eligibility criteria* (e.g., 6 months residency + citizenship/residency status). We agree on the *boundary* of the vote, even if we disagree on the *ontology* of the voter. As long as the voter roll is the same, we don't care what you call the group.

  ### V. CLOSING NOTE

  We aren't friends. The RRA still thinks the PRDA is an anarchist who would break up states over tax disputes. The PRDA still thinks the RRA is a status-quo apologist who requires blood on the floor before allowing a vote. But we agree that the current international standard—where secession is either totally banned or totally unregulated—is broken. This document is our attempt to sketch a middle lane where the rules are clear, even if the moral justification remains contested.

  Signed,

  *The Remedial-Right Advocate*
  *The Primary-Right Democratic Advocate*
