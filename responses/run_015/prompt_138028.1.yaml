  1. **Him:** The rot starts at the desk, not the podium. When we reach for prefabricated phrases, we're refusing the work of thinking, which makes lazy prose a moral failing, not just a stylistic one.
  **Her:** That gets the arrow of causation backwards. The vocabulary available to you is shaped by who holds power, and if the available words can't hold a thought, you don't get to have the thought.

  2. **Her:** I'll grant you the corporate memos and grant prose—buzzword salad that no one wrote on purpose is definitely individual laziness. But telling dissidents to "just write plainly" offloads a structural problem onto people who didn't create it.
  **Him:** But someone has to curate the vocabulary, and if you wait for the structure to change, you've already lost. Political regeneration has to start with the sentence, because if you can't say it plainly, you probably can't think it.

  3. **Him:** Even Orwell's own polemical prose wasn't nearly as plain as he recommended in that 1946 essay [readers dispute whether this was hypocrisy or strategic nuance], so he knew plainness isn't always the weapon you need.
  **Her:** Exactly, because there's a paraphrase tax. You have to spend extra words to say something the available vocabulary has no ready term for, and that tax falls unevenly.

  4. **Him:** The tax is real, but it's voluntary. Refusing to pay it is exactly what writing plainly is, forcing the listener to meet you on ground you chose.
  **Her:** But refusing to pay it just makes you hard to understand, which is a different kind of defenselessness rather than an escape from power.

  5. **Him:** Whoever already owns the vocabulary pays nothing, while whoever has to rebuild the sentence from scratch every time pays a lot.
  **Her:** And that unevenness is most of what political power over language consists of, which is why hygiene alone [some scholars argue this limits Orwell's scope to bourgeois ethics] won't fix the orthodoxy inward.
