      *   **The Drowning Wife Scenario (Jim and the Indians / Drowning Wife):** Williams argues that if a husband stops to calculate whether saving his wife maximizes overall utility (vs. saving a stranger who might be a doctor, etc.), he has had "one thought too many."
      *   **Why?** It's not just about loyalty. It's about *identity*. Our "ground projects" (deep commitments that give life meaning) constitute who we are. To subject them to impartial utilitarian calculation is to alienate oneself from one's own life.
      *   **Integrity:** For Williams, integrity isn't just "not lying" (honesty) or "sticking by friends" (loyalty). It's about the connection between your actions and your deepest commitments/identity. It's about not being reduced to a mere channel for the satisfaction of others' needs (the utilitarian view).
      *   **The Judge Scenario:** This is a classic counter-objection to Williams. If the ground project is "being a just judge," does recusing oneself violate integrity?
          *   *Williams' likely response:* The "one thought too many" applies to *personal* commitments that define the agent. However, if the commitment *is* impartiality (the judge role), then acting impartially *is* acting with integrity *relative to that project*. But Williams would argue Utilitarianism demands you abandon *any* project if the calculus says so.
