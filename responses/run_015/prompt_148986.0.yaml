      *   *Point 3: The Judge Scenario.* This is the tricky part. If "being a fair judge" is the ground project, then recusing is acting *from* that project. The "one thought too many" would be thinking, "I should recuse myself because calculating the utility of public trust says so," rather than "I must recuse because I am a fair judge." *Correction:* Actually, Williams' point is that Utilitarianism asks you to step *outside* your projects. If the judge's project *is* impartiality, Utilitarianism aligns here. But if Utilitarianism demanded the judge *not* recuse because the brother is innocent and a utilitarian calculation says convicting an innocent person here causes less panic (extreme example), *that* violates integrity.
