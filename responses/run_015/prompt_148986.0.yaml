answer: |-
  This is a fantastic set of questions. You are hitting on exactly the nuances that make Bernard Williams' critique of Utilitarianism so famous (and so difficult). It is very common to confuse "Integrity" with "Loyalty" or "Honesty" when first reading Williams.

  Here is a breakdown to help you untangle these knots for your paper.

  ### 1. The Drowning Spouse: "One Thought Too Many"
  You are right about the basic scenario. Williams argues that if a husband is walking by the sea, sees his wife drowning, and stops to think, *"Well, saving her produces X utility, but saving that stranger might produce Y utility..."* he has had **one thought too many.**

  *   **Why?** It's not just that the calculation takes too long. It's that the *need* to calculate reveals a misunderstanding of what a marriage is.
  *   **The Point:** Certain motivations should be **immediate**. They should flow directly from who you are and what you care about, not from a moral system standing outside of you.

  ### 2. Integrity vs. Loyalty (Correcting your Friend)
  Your friend is making a very common mistake. They are reducing Williams' idea of **Integrity** to simple **Loyalty**.

  *   **Loyalty** is specific: It is sticking by your friends, family, or tribe.
  *   **Integrity (for Williams)** is structural: It is about the relationship between **you** and **your actions**.

  Williams uses the term "Integrity" in the sense of "integration" or "wholeness." To have integrity means your actions flow from your **"ground projects."**
  *   **Ground Projects:** These are the deep commitments that give your life meaning. For some, that is love for a spouse (Loyalty). For others, it is Art, Religion, Science, or **Justice**.

  **The Correction:** Williams is not saying "Morality should never make you betray loved ones." He is saying "Morality should not require you to abandon the very commitments that make you *you*." If your ground project is your child, Utilitarianism threatens that. If your ground project is being a Monk, Utilitarianism threatens that too. It's not about loyalty specifically; it's about **identity**.

  ### 3. The Judge Paradox (The Tricky Part)
  This is the hardest part, and you are right to be confused. If your ground project is "Being a Fair Judge," and you have to recuse yourself from your brother's case, is stepping aside "one thought too many"?

  **Here is the Williams distinction:**
  It depends on **why** you recuse yourself.

  *   **Scenario A (Utilitarian):** You recuse yourself because you calculate that "If I judge my brother, public trust in the courts will drop, leading to less overall happiness."
      *   *Williams says:* This is alienating. You are acting as a channel for "the general happiness," not as a judge committed to justice.
  *   **Scenario B (Integrity):** You recuse yourself because "I am a fair judge, and a fair judge does not judge family. That is who I am."
      *   *Williams says:* This preserves integrity. The action flows from your internal commitment (your ground project of being a judge).

  **However,** there is a catch. Utilitarianism demands that you be willing to **drop** the project of being a fair judge if the calculus changes. (e.g., "Actually, if you convict your innocent brother, it will prevent a riot and save 1,000 lives. Do it.")
  *   **Williams' Objection:** If you are willing to convict your innocent brother just because the numbers say so, you have lost your integrity. You have allowed the moral system to completely overwrite your identity.
  *   **So, to answer your question:** Recusing yourself isn't the problem. Being willing to *not* recuse yourself (or to convict him) because a calculation told you to would be the violation of integrity.

  ### 4. Integrity vs. Honesty (Your Teacher's Point)
  Your teacher is right. In everyday language, we say a person has integrity if they don't lie or cheat. That is **Honesty**.

  For Williams, **Integrity** is deeper:
  *   **Honesty:** Adhering to a rule (e.g., "Do not lie"). A Utilitarian can be honest (if lying doesn't maximize utility).
  *   **Integrity:** Your actions must be attributable to **you**.

  **The "Negative Responsibility" Problem:**
  Utilitarianism says you are responsible for things you *didn't* do (e.g., if you don't steal from a rich person to feed a poor person, you are responsible for the poor person's hunger).
  *   Williams says this destroys integrity. It makes me responsible for everything in the world.
  *   If I have to constantly look outside myself to see what action produces the best result, my actions stop being *mine*. They become the actions of "the universe" happening through me.
  *   **Integrity** means I can say, "I did this because *I* committed to it," not "I did this because the calculation demanded it."

  ### Summary for your Paper
  To clear up your confusion, try framing it this way:

  1.  **Don't equate Integrity with Loyalty.** Loyalty is just one example of a "ground project." Integrity is the state of acting from *any* ground project (love, art, justice) without being forced to justify it by an external calculator.
  2.  **The "One Thought" is about Motivation.** It's not about whether you save the wife or recuse yourself. It's about whether you do it because **you care** (Integrity) or because **the math works** (Utilitarianism).
  3.  **The Judge Example:** A judge recusing themselves acts with integrity if it stems from their commitment to justice. They lose integrity if they are willing to abandon that commitment the moment a Utilitarian calculation tells them to (e.g., punishing an innocent person to stop a riot).
  4.  **Honesty vs. Integrity:** Honesty is following a rule. Integrity is maintaining the boundary between your own life/commitments and the demands of the world.

  **Thesis Tip:** You could argue that Williams isn't saying we should be selfish or loyal to family above all. He is saying that a moral theory that requires us to be neutral toward our own lives is psychologically impossible and destroys the "agent" (the person doing the acting).

  Does that help distinguish the concepts a bit better?
