      *   *Refinement on the Twist:* To make them feel the *structural* vs. *contingent*, the structural rules must push toward terror in *both* runs, but the *intensity* and *specific victims* change based on the deck. Or, one run stabilizes, one runs away. Let's aim for: Run 1 = Moderate outcome (if lucky), Run 2 = Terror spiral (if unlucky), but the *rules* made both possible.
      *   *Wait, re-reading the prompt:* "identical roles, rules, starting conditions, and resources — with only a hidden deck of contingency events differing between the runs."
      *   *Objective:* They need to discover that structural pressures issue in different outcomes.
      *   *Mechanic:* The "Register of Suspicion." To gain "Security" or "Food," you must denounce. Adjudication is held by the person with the most "Legitimacy."

  4.  **Drafting the Mechanics:**
      *   *Currency:* **Civic Virtue** (Legitimacy).
      *   *Goal:* Survive 6 "Months" (Turns). Keep Paris Fed. Keep Frontlines Stable.
      *   *The Trap:* To keep Frontlines Stable, you need Resources. To get Resources, you need to confiscate them (Denounce). To Denounce, you add to the Register.
      *   *The Register:* Once a name is on it, they lose a turn. If the Register gets too full, "Anarchy" triggers (everyone loses).
      *   *Adjudication:* The player with the most Civic Virtue decides who on the Register is "Guilty" (removed from game) or "Innocent" (stays on list, clogging it). This creates a struggle for Virtue to control the purge.

  5.  **Addressing the "Bias" Constraint:**
      *   *Critical Self-Correction:* If I make denunciation the *only* way to get resources, I am hard-coding the "Ideology/Political Culture" argument (the logic of virtue demands purge) or the "Circumstance" argument (scarcity demands purge). I need to ensure the *Class* element is present (who holds the resources initially?).
      *   *Bias Check:* The prompt asks me to be honest about bias. If the rules *require* denunciation to survive, that biases toward the "Terror is inevitable due to structure" argument. I must acknowledge this. The simulation cannot perfectly replicate the *openness* of history, only the *pressure*.
      *   *Solution:* Make denunciation the *efficient* way, but not the *only* way. But efficient is seductive in a timed game.

  6.  **Developing the Two Runs:**
      *   *Run 1 (The Lucky Draw):* Contingency cards are mild (Harvest okay, Enemy hesitant).
      *   *Run 2 (The Unlucky Draw):* Contingency cards are severe (Harvest failure, Invasion).
