  7.  **Fleshing out Roles (18 Students):**
      *   6 Nobles/Clergy (High initial resources, low Virtue).
      *   6 Bourgeois/Girondins (Medium resources, High initial Virtue).
      *   6 Sans-Culottes/Jacobins (Low resources, High Mobilization power).
      *   *Problem:* If Nobles are just victims, it's boring. They need agency.
      *   *Revision:* Everyone is a Deputy in the Convention. But they represent constituencies.
      *   *Private Objectives:*
          *   Nobles: Protect Property (Keep resources).
          *   Bourgeois: Protect Rule of Law (Keep Register low).
          *   Sans-Culottes: Protect Price Controls/Food (Keep Food high).
      *   *Shared Objective:* Don't let the Kingdom collapse (Foreign Invasion meter).

  8.  **The "List" Mechanic (The Engine of Terror):**
      *   Name: **The Register of Suspects**.
      *   Action: "Denounce." Cost: 1 Virtue. Effect: Add a token to Register.
      *   Resolution: At end of turn, the player with most Virtue chooses one token to remove (Execute) or Validate (Return to game).
      *   *Catch:* If Register > X tokens, "Panic" triggers (Resources halved).
      *   *Catch 2:* To solve a Crisis Card, you often *must* add tokens to the Register (e.g., "Hoarding discovered" -> Denounce the hoarder).

  9.  **Timeline:**
      *   0:00-0:10: Setup (No lecture).
      *   0:10-0:50: Run 1.
      *   0:50-1:00: Reset (Silent).
      *   1:00-1:40: Run 2.
      *   1:40-2:00: Debrief (The Historiography).

  10. **Instructor Role:**
      *   Dealer of Cards.
      *   Timekeeper.
      *   Silent Observer (mostly).
      *   In Debrief: The Historian.

  11. **Predicting Failure Modes:**
      *   *Chaos:* Too many people talking. *Fix:* Strict turn order.
      *   *Early Elimination:* Players removed early get bored. *Fix:* Eliminated players become "The Press" or "Crowd" who can shout but not vote.
      *   *Gaming the System:* They find a loophole to avoid the Terror. *Fix:* The Crisis cards must be overwhelming enough to force hard choices.
      *   *Bias:* The game makes Terror look rational. *Fix:* Acknowledge this in debrief.

  12. **Historiographical Accuracy Check:**
      *   *Consensus:* War and civil rebellion were major factors. The Terror escalated in 1793-94.
      *   *Contested:* Was it class war? (Furet says no, it was political discourse). Was it inevitable? (Most say no, contingent on war).
      *   *Activity Bias:* The game mechanics (scarcity + denunciation) lean toward a Materialist/Circumstantial explanation. It might underplay the *Ideological* drive unless the "Virtue" currency is framed correctly. I need to ensure "Virtue" acts like Furet's "Will of the People."

  13. **Refining the "Hidden Deck":**
      *   Run 1 Deck: "Stabilization." (Diplomatic success, good harvest).
      *   Run 2 Deck: "Catastrophe." (Betrayal, invasion, famine).
      *   *Crucial:* Students don't know the decks are different. They will blame their own choices or the "system."

  14. **Final Polish:**
      *   Ensure the "List" mechanic is "cheap to add, impossible to remove" (except by the Virtue holder).
      *   Ensure the "Adjudication" is controlled by the scarce good (Virtue).
      *   Make sure the Debrief explicitly maps the three explanations without naming them until the end.

  15. **Writing the Response:**
      *   Tone: Professional, pedagogical, historically rigorous.
