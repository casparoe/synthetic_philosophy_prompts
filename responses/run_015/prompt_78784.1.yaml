      *   **Constraint 2:** Students must *feel* the force of explanations, not hear them described. No framing lecture beforehand.
      *   **Constraint 3:** Specific mechanics required: Payoff scheme (standing/legitimacy/resources, not money), a "list of suspects/denunciations" mechanic (cheap to add, impossible to remove, adjudication by holder of scarce good), leading to self-destruction.
      *   **Constraint 4:** Timeline for two runs + debrief.
      *   **Constraint 5:** Instructor instructions (what to do while playing).
      *   **Constraint 6:** Prediction of failure modes + handling.
      *   **Constraint 7:** Honesty about limitations/bias (does the rule set bias toward one explanation?).
      *   **Constraint 8:** Historiographical accuracy (distinguish consensus from contestation).

  2.  **Deconstruct the Historiography:**
      *   *Class Struggle (Marxist/Soboul):* Bourgeoisie vs. Aristocracy, Sans-culottes vs. Bourgeoisie. Material conditions drive politics.
      *   *Ideology/Political Culture (Furet, Baker):* Discourse of will, virtue, conspiracy. The logic of revolutionary language demands purity.
      *   *Contingency (Recent social history, e.g., Tackett, McPhee):* War, flight to Varennes, specific accidents, fear of invasion.
      *   *Consensus vs. Contest:* It is *not* consensus that the Terror was inevitable or purely class-based. It *is* consensus that external war and internal rebellion heightened tension. The "inevitability" is highly contested.

  3.  **Design the Simulation ("The Committee of Public Safety"):**
      *   *Goal:* Create a system where structural pressure exists (Class/Ideology), but outcomes vary based on the hidden deck (Contingency).
      *   *Roles:* Need to represent factions without making them caricatures.
          *   Girondins (Federalists/Moderates)
          *   Jacobins/Montagnards (Centralists/Radicals)
          *   Sans-Culottes (The Street/Pressure)
