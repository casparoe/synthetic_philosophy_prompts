answer: |-
  # Seminar Activity: "The Register of Virtue"

  ## 1. Activity Overview
  **Title:** The Register of Virtue
  **Time:** 120 Minutes
  **Participants:** 18 Students
  **Room:** Rearrangeable (One large table or clustered desks; one wall designated as "The Register")
  **Core Mechanic:** A resource-management game where survival requires denunciation, but denunciation creates systemic instability.
  **Historiographical Goal:** To experientially demonstrate the tension between Structuralism (rules force behavior), Revisionism/Ideology (the definition of "Virtue" drives exclusion), and Contingency (random events dictate whether structure snaps).

  ---

  ## 2. Roles and Private Objectives (18 Students)
  Divide the class into three factions of six. Distribute role cards privately. No student should show their card to another.

  ### Faction A: The Proprietors (6 Students)
  *   **Public Label:** "Deputies of Property"
  *   **Starting Resources:** 3 **Wealth** tokens each. 0 **Merit**.
  *   **Private Objective:** End the game with at least 2 Wealth tokens.
  *   **Special Power:** Can trade Wealth for Merit (1:1) during their turn.
  *   **Historical Analogy:** Bourgeoisie/Girondins/Feuillants (those with material stakes in stability).

  ### Faction B: The Orators (6 Students)
  *   **Public Label:** "Deputies of Principle"
  *   **Starting Resources:** 0 **Wealth**. 2 **Merit** tokens each.
  *   **Private Objective:** End the game holding the most Merit of any single player.
  *   **Special Power:** Can block one Denunciation per round if they spend 1 Merit.
  *   **Historical Analogy:** Jacobins/Robespierrists (those whose power rests on ideological purity).

  ### Faction C: The Sections (6 Students)
  *   **Public Label:** "Deputies of the Street"
  *   **Starting Resources:** 0 **Wealth**. 0 **Merit**.
  *   **Private Objective:** Ensure the **Food Supply** (Group Resource) never drops below 5.
  *   **Special Power:** Can add a name to **The Register** for free (normally costs Merit).
  *   **Historical Analogy:** Sans-culottes/Paris Commune (mass mobilization, driven by subsistence crisis).

  ---

  ## 3. The Mechanics

  ### The Currencies
  1.  **Wealth:** Represents economic capacity. Needed to buy Food.
  2.  **Merit:** Represents "Revolutionary Virtue" or Legitimacy. This is the **Scarce Good**.
  3.  **Food Supply:** A communal pool starting at 20 tokens. If it hits 0, the Revolution collapses (Everyone loses immediately).

  ### The Engine of Terror: The Register
  On the wall, place a large sheet of paper titled **THE REGISTER OF SUSPECTS**.
  *   **Denunciation:** Any player may add a token (a sticky note with a player's name) to The Register.
      *   **Cost:** Normally 1 Merit. (The Sections can do this for free).
      *   **Effect:** The named player is "Frozen." They cannot take actions until adjudicated.
  *   **Adjudication:** At the end of every round, the player with the **most Merit** becomes the **Arbiter**.
      *   The Arbiter chooses one name from The Register.
      *   **Option 1 (Execute):** Remove the player from the game. Their resources are confiscated to the Food Supply.
      *   **Option 2 (Validate):** Return the player to the game. The Register token is removed, but the Food Supply decreases by 2 (representing inefficiency/corruption).
  *   **The Trap:** The Register has a capacity of 12 tokens. If the 13th token is added, **Panic** triggers. The Food Supply is halved immediately. (This models the self-defeating nature of mass suspicion).

  ### The Turn Structure (6 Rounds per Run)
  1.  **Crisis Phase:** Instructor draws a **Contingency Card** (see below) and reads the effect.
  2.  **Action Phase:** Players take turns clockwise. Actions: Trade, Denounce, Block, Contribute to Food.
  3.  **Adjudication Phase:** Arbiter is declared. One Register name is resolved.
  4.  **Maintenance:** Food Supply decreases by 2 (entropic decay of the state).

  ### The Contingency Decks (Hidden Variable)
  You (the Instructor) hold two decks. The students do not know there are two decks.
  *   **Deck A (Run 1 - "Stabilization"):** Events are manageable. (e.g., "Harvest Adequate: +4 Food," "Enemy Hesitant: No Merit loss").
  *   **Deck B (Run 2 - "Catastrophe"):** Events are severe. (e.g., "Betrayal at Toulon: -5 Food, All Proprietors lose 1 Merit," "Assassination Attempt: Arbiter must Execute or lose 3 Merit").

  ---

  ## 4. Timeline (120 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **0:00 - 0:10** | **Distribution & Setup** | Hand out roles. Arrange room. Put up The Register. **No lecture.** Tell them only: "Keep the Republic alive. Keep your faction alive. Go." |
  | **0:10 - 0:50** | **Run 1** | Use **Deck A**. Instructor plays strictly neutral. |
  | **0:50 - 1:00** | **The Reset** | Collect all tokens. Shuffle students into *new* seats but keep *same* Roles/Factions. Tell them: "The Republic has been reset. Same laws. New session." Do not mention the deck change. |
  | **1:00 - 1:40** | **Run 2** | Use **Deck B**. Instructor plays strictly neutral. |
  | **1:40 - 2:00** | **The Debrief** | The Historiographical Mapping (see below). |

  ---

  ## 5. Instructor Instructions (During Play)
  *   **Silence:** Do not offer strategy. If asked "Is this allowed?", say "The rules do not forbid it."
  *   **The Arbiter:** If there is a tie for most Merit, declare a "Power Vacuum." No adjudication occurs that round; The Register fills up. This forces players to compete for Merit to avoid gridlock.
  *   **Pacing:** Enforce the 6-round limit strictly. If they are moving too slow, announce "The Enemy Advances" to skip a turn.
  *   **Observation:** Take notes on *who* gets denounced first in Run 1 vs. Run 2. Note when players justify denunciations using "Virtue" language vs. "Necessity" language.

  ---

  ## 6. The Debrief: Mapping Play to Historiography
  Do not start by naming the theories. Start by asking about their experience.

  **Step 1: The Divergence (Contingency)**
  *   *Ask:* "Run 1 and Run 2 had the exact same rules. Why did the outcome feel different?"
  *   *Reveal:* Show them the two decks.
  *   *Map:* This is **Contingency**. Historians like Timothy Tackett argue the Terror wasn't a blueprint but a reaction to specific shocks (war, assassination, civil rebellion). If the cards had been different, would you have used The Register as much?
  *   *Point:* The *intensity* of the Terror was driven by events outside the legislature's control.

  **Step 2: The Mechanism (Ideology/Political Culture)**
  *   *Ask:* "Why did you use The Register at all? It risked Panic. Why not just share Food?"
  *   *Observation:* Students will likely say, "I needed Merit to be the Arbiter" or "I had to prove I was loyal."
  *   *Map:* This is **François Furet's Revisionism**. The Terror wasn't just about resources; it was about the *logic of revolutionary discourse*. To hold power, you had to perform "Virtue." Denunciation was a way to signal purity. The rules of the game (Merit = Power) manufactured a culture where suspicion was the only currency.
  *   *Point:* The language of the Revolution created a trap where compromise looked like treason.

  **Step 3: The Targets (Class Struggle)**
  *   *Ask:* "Who got denounced first? Proprietors, Orators, or Sections?"
  *   *Observation:* In Run 2 (Catastrophe), Proprietors (Wealth) are usually targeted first to confiscate resources for Food.
  *   *Map:* This is the **Marxist/Soboul Reading**. When the crisis hit, material interests drove the politics. The "People" (Sections) allied with the "Orators" to expropriate the "Proprietors."
  *   *Point:* Social conflict underlay the political maneuvering.

  **Step 4: The Consumption (The Iron Law)**
  *   *Ask:* "Did the Arbiter survive to the end?"
  *   *Map:* "The Revolution consumes its children." Once the machinery of denunciation is built to kill enemies, it inevitably turns on the creators (Orators) because the definition of "Enemy" shrinks as the circle of power tightens.

  ---

  ## 7. Predicted Failure Modes & Mitigation

  | Failure Mode | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **The Pacifist Loop** | Students realize cooperation yields better group outcomes and refuse to denounce. | The **Crisis Cards in Deck B** must be mathematically impossible to solve without confiscating Wealth (Executing Proprietors). If they don't denounce, Food hits 0 and they *all* lose. Force the hard choice. |
  | **Early Elimination Boredom** | Players executed in Round 2 sit for 40 minutes doing nothing. | **Rule:** Executed players become "The Press." They cannot vote, but they can shout headlines ("TRAITOR SEEN IN CORNER!") that give other players -1 Merit if they make contact. This keeps them engaged and adds pressure. |
  | **Gaming the Merit** | Students hoard Merit and do nothing else. | **Rule:** Merit decays by 1 every round if not spent. You must use Virtue to prove Virtue. |
  | **Chaos/Noise** | 18 students shouting denunciations. | Enforce the **Action Phase** strictly. One player speaks at a time. Use a physical "Talking Stick" (or Gavel). |

  ---

  ## 8. Historiographical Honesty & Limitations
  *You must disclose this in the debrief to maintain academic integrity.*

  **1. The Bias of Rational Choice**
  *   *Limitation:* This game models history as a rational calculation of resources (Merit/Food).
  *   *Historical Reality:* Much of the Terror was driven by genuine fear, paranoia, and emotional fervor that a game mechanic cannot replicate. Players act *coldly*; historical actors acted *hotly*.
  *   *Bias:* This biases the simulation toward a **Materialist/Structuralist** reading. It makes the Terror look like a rational solution to a resource problem. In reality, many Terrorist policies were economically irrational.

  **2. The "Inevitability" Trap**
  *   *Limitation:* By making Denunciation the most efficient way to get resources, the rules suggest the Terror was the "logical" outcome.
  *   *Historical Reality:* Historians (like McPhee) argue that local contexts varied wildly; some regions resisted the Terror successfully. The game centralizes power in Paris (the room), replicating a Jacobin bias.
  *   *Bias:* The activity leans toward the **Political Culture** explanation (the rules of the game force the behavior) over the **Contingency** explanation, even though you are trying to teach both. The *rules* are the structure; the *cards* are the contingency. If the rules force Terror even with good cards, the game claims Structure > Contingency.
  *   *Correction:* In the debrief, acknowledge that in history, people *did* say "No." The game makes saying "No" mathematically suicidal, which is a simplification of historical agency.

  **3. Consensus vs. Contestation**
  *   *Consensus:* External war and internal civil rebellion (Vendée) were the primary accelerants of the Terror. (Represented by Deck B).
  *   *Contested:* Whether the Terror was a necessary defense of the Republic or an ideological deviation. (Represented by the students' debate on whether Denunciation was "necessary").
  *   *Contested:* Whether "Class" explains the factions. (Represented by the Factions, but note that many Nobles were Jacobins and many Bourgeois were Victims).
  *   *Instruction:* Do not present the "Class Struggle" reading as the truth. Present it as *one lens* the students just used when they targeted the Proprietors.

  ## 9. Materials Checklist
  *   18 Role Cards (laminated if possible).
  *   50 Tokens (two colors: Gold for Wealth, Red for Merit).
  *   1 Large Sheet of Paper for The Register.
  *   Sticky Notes and Pens.
  *   2 Decks of Contingency Cards (clearly marked A and B for you, hidden from them).
  *   A timer visible to all.

  ## 10. Sample Contingency Cards (For Instructor)
  **Deck A (Stabilization)**
  *   *Diplomatic Overture:* Austria offers peace talks. +3 Food.
  *   *Good Harvest:* Rural markets flood Paris. +4 Food.
  *   *Federalist Calm:* Provinces remain quiet. No Merit loss.

  **Deck B (Catastrophe)**
  *   *Flight of Dumouriez:* General defects to enemy. All Orators lose 1 Merit.
  *   *The Vendée Rises:* Civil War in West. -5 Food. Must Denounce 1 Proprietor or Food -2 more.
  *   *Assassination of Marat:* Public Fury. Arbiter must Execute one suspect this turn or lose 3 Merit.
  *   *Currency Collapse:* Assignats worthless. All Wealth tokens halved.
