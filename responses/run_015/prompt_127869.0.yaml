answer: |-
  Here is the specification for an adequate evaluation framework for ontological arguments. This spec treats the Anselmian (conceptual) and Gödelian (modal-axiomatic) traditions as distinct architectural structures with different load-bearing walls.

  ### I. Core Specifications: The Desiderata

  An adequate framework must not merely ask "Is it valid?" but "Valid relative to which ontological commitments, and at what metaphysical cost?"

  #### A. Classification Cases (The Test Suite)
  The framework must correctly categorize the status of the following four argument types without conflating their failure modes:
  1.  **Anselmian Conceptual Containment (Proslogion II):** The move from *intellectu* to *re*. The framework must distinguish between a definition that is logically incoherent (e.g., "greatest conceivable island") and one that claims unique status (e.g., "greatest conceivable being").
  2.  **Gödelian Axiomatic Derivation:** The derivation of $\exists x G(x)$ from axioms regarding "positive properties." The framework must evaluate the *consistency* of the set of positive properties, not just the validity of the derivation.
  3.  **Plantinga's Modal Reformulation:** The move from $ \diamond \Box \exists x G(x) $ to $ \exists x G(x) $ via S5. The framework must assess the epistemic status of the possibility premise independently of the conclusion.
  4.  **Reverse/Parody Arguments:** Arguments deriving *Necessary Non-Existence* (e.g., from the problem of evil or logical incoherence of omnipotence) or *Perfect Island* parodies. The framework must explain why the ontological argument is not symmetric with these (i.e., why "necessary existence" is a perfection but "necessary non-existence" is not, or why islands cannot bear modal properties).

  #### B. Required Distinctions
  The framework must enforce the following categorical separations:
  1.  **First-Order vs. Second-Order Existence:** It must distinguish Kant's objection (existence is not a real predicate adding to the concept) from the Modal claim (existence is a property of possible worlds or an essence instantiated in a world).
  2.  **Conceptual Coherence vs. Axiomatic Consistency:** Anselm fails if the concept is incoherent (like a square circle). Gödel fails if the axioms are inconsistent (even if the concept is coherent). The framework must not judge Gödel by Anselm's psychological standards, nor Anselm by Gödel's formal standards.
  3.  **De Dicto vs. De Re Necessity:** It must track whether the necessity applies to the proposition ("It is necessary that God exists") or the being ("There is a being who exists necessarily").
  4.  **Epistemic vs. Ontological Possibility:** Plantinga's $\diamond$ is often read epistemically ("for all we know"), but the logic requires ontological possibility ("there is a possible world"). The framework must flag slippage between these.

  #### C. Logical & Metaphysical Constraints
  The framework cannot validate an argument that violates these established results:
  1.  **S5 Modal Logic Constraints:** If using S5, the framework must acknowledge that $\diamond \Box P \to \Box P$. It cannot reject this inference while claiming to use S5.
  2.  **Modal Collapse:** The framework must detect if the argument entails that *all* truths are necessary truths. (If God exists necessarily and God's will determines all contingent truths, do contingent truths become necessary?)
  3.  **Premise Circularity:** It must distinguish between *logical* circularity (valid deduction) and *epistemic* circularity (you must believe the conclusion to accept the premise).
  4.  **Modal Realism Commitments:** It must flag whether the argument requires Lewisian Modal Realism (possible worlds are concrete), Actualism (possible worlds are abstract), or Theistic Conceptualism (worlds are ideas in God's mind).

  ---

  ### II. The Tension Points: Jointly Unsatisfiable Pairs

  No framework can maximize all virtues simultaneously. The following pairs represent hard trade-offs. If a framework demands both, it is broken.

  **1. Full S5 Validity vs. Contingency Preservation (The Collapse Problem)**
  *   **The Conflict:** In Gödel's system, if "Necessary Existence" is a positive property, and God possesses all positive properties, God exists necessarily. If God is also the ground of all contingent truths, S5 can propagate that necessity to all truths.
  *   **The Trade-off:** You can have a formally valid derivation in S5, *or* you can preserve genuine contingency in the universe. You generally cannot have a Gödelian God who is the source of all reality *and* a world where things could have been otherwise, without weakening the logic (e.g., to S4) or restricting the axioms (which threatens the derivation of God).
  *   **Verdict:** A framework demanding **S5 Validity + No Modal Collapse** is unsatisfiable for strong versions of the argument.

  **2. Epistemic Neutrality vs. Persuasive Force**
  *   **The Conflict:** For the argument to be a "proof" to a skeptic, the premises must be more plausible than the conclusion to the skeptic. However, the possibility premise ($\diamond \exists x G(x)$) is usually *less* plausible to a skeptic than the conclusion ($\exists x G(x)$), because if God is impossible, the premise is false.
  *   **The Trade-off:** You can have an argument that is logically airtight but epistemically inert (Plantinga's "rational acceptability"), *or* an argument that claims to compel assent but relies on question-begging premises.
  *   **Verdict:** A framework demanding **Formal Validity + Non-Question-Begging for Skeptics** is unsatisfiable.

  **3. Conceptual Intuition vs. Formal Rigor**
  *   **The Conflict:** Anselm's argument relies on the intuition of "greatness." Gödel's relies on the axiomatic definition of "positivity." Greatness is not formally definable; Positivity is formally definable but intuitively opaque.
  *   **The Trade-off:** A framework that prioritizes **Conceptual Intuition** cannot validate Gödel (who ignores intuition for axioms). A framework that prioritizes **Formal Rigor** cannot validate Anselm (who relies on natural language ambiguity).
  *   **Verdict:** A single framework cannot treat both as "The Ontological Argument." They must be evaluated as separate species.

  ---

  ### III. Scoring Common Responses

  Here is how standard evaluations score against the spec above.

  | Evaluation Strategy | Classification Accuracy | Distinction Respect | Logic Constraints | Trade-off Handling | **Total Score** |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **"It Begs the Question"** (Standard Empiricist) | **Fail.** Treats Anselm and Gödel as identical premise-loading. | **Fail.** Collapses epistemic/ontological possibility. | **Pass.** Correctly identifies epistemic circularity. | **Fail.** Assumes persuasion is the goal of deduction. | **Low.** Useful rhetorically, philosophically blunt. |
  | **Plantinga-Style Defense** (Reformed Epistemology) | **High.** Correctly isolates the modal version. | **High.** Respects S5 and possibility distinctions. | **Pass.** Accepts S5 constraints openly. | **Pass.** Sacrifices "proof" for "warrant/rationality." | **High.** Meets spec by lowering the bar from proof to warrant. |
  | **Hard Formalist** (Logicist) | **Mixed.** Validates Gödel, dismisses Anselm as informal. | **High.** Rigorous on predicates and quantifiers. | **Fail.** Often ignores Modal Collapse implications. | **Fail.** Treats consistency as sufficient for truth. | **Medium.** Technically sound, metaphysically hollow. |

  ---

  ### IV. Verdict: Is the Argument Family Broken?

  **The framework spec reveals that the "Ontological Argument" is not a single argument but a category error.**

  1.  **Anselm and Gödel are incompatible projects.** Anselm is doing phenomenology of faith (seeking understanding of what is already believed); Gödel is doing metaphysical deduction (deriving existence from essence). A framework that tries to evaluate them under the same rubric will fail because their success conditions differ. Anselm succeeds if it deepens faith; Gödel succeeds if the axioms are consistent.
  2.  **The "Proof" ambition is the break point.** If the desiderata require the argument to function as a *demonstrative proof* (compelling assent from neutral premises), the **Unsatisfiable Pair #2** (Neutrality vs. Force) breaks the family. No modal ontological argument can be both valid in S5 and non-question-begging for a modal skeptic.
  3.  **The "Modal Collapse" is the hard limit.** If the desiderata require the argument to preserve human freedom or contingent truth, **Unsatisfiable Pair #1** breaks the Gödelian version unless it is significantly weakened (e.g., removing "Necessary Existence" as a positive property, which kills the derivation).

  **Conclusion:**
  There is **no room for a unified framework that saves both as "proofs."**
  *   To save **Anselm**, the framework must shift from *logic* to *conceptual coherence* (admitting it cannot compel atheists).
  *   To save **Gödel**, the framework must shift from *truth* to *consistency* (admitting it only proves "If the axioms hold, God exists," without proving the axioms hold).

  If your evaluation framework demands **Demonstrative Proof + Modal Contingency + Skeptical Neutrality**, the ontological argument family is logically broken. If the framework allows for **Rational Warrant + Axiomatic Consistency + Theistic Commitments**, the arguments survive but cease to be "arguments" in the coercive sense and become "explications" of a prior worldview.
