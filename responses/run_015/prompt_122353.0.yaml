answer: |-
  1. "The readings"

  1.  **The Logical Thesis:** This reading treats the slogan as a constraint of deductive validity. It asserts that no finite set of particular observations can logically entail a universal negative statement.
      *   **Evidence:** Deductive proof or logical entailment.
      *   **Absence:** The strict ontological claim that an effect is exactly zero across all possible contexts and times.
      *   *Status:* This is the most trivial reading; it is technically true but scientifically inert, as science rarely seeks deductive proof.

  2.  **The Power Thesis:** This reading interprets the slogan as a warning about Type II errors. It claims that a non-significant result from a low-powered test cannot distinguish between a null effect and a real effect that the test was too weak to detect.
      *   **Evidence:** A test with high severity or power against a specific alternative.
      *   **Absence:** The statistical parameter being exactly zero.
      *   *Status:* This is the standard frequentist interpretation, focusing on the capability of the instrument rather than the data itself.

  3.  **The Likelihood Thesis:** This reading posits that data only count as evidence relative to competing models. If the data are equally probable under both the null and alternative models, the likelihood ratio is one, and the data provide no evidence for either.
      *   **Evidence:** The ratio of likelihoods between specified hypotheses.
      *   **Absence:** The null hypothesis model being the true data-generating process.
      *   *Status:* This shifts focus from error rates to model fit, requiring explicit alternative hypotheses to judge "absence."

  4.  **The Equivalence Thesis:** This reading reframes "absence" not as exact zero, but as practical negligible size. It argues that evidence for absence requires showing the effect size falls within a preregistered Smallest Effect Size of Interest (SESOI).
      *   **Evidence:** A confidence interval falling entirely within the SESOI bounds.
      *   **Absence:** The effect being too small to matter theoretically or practically.
      *   *Status:* This aligns with modern replication standards, treating "absence" as a substantive claim about magnitude rather than a point null.

  5.  **The Ontological Thesis:** This radical reading suggests that empirical data are always theory-laden. It claims that because observations are interpreted through theoretical frameworks, no data can ever definitively rule out the existence of a construct.
      *   **Evidence:** Theory-neutral observation independent of modeling assumptions.
      *   **Absence:** The phenomenon failing to exist in reality regardless of measurement.
      *   *Status:* This is the most radical, implying that empirical falsification is impossible because measurement implementation always differs from theoretical ideal.

  2. "Verdicts"

  1.  **Platitude.** True by definition of induction, but irrelevant to science, which operates on probabilistic support rather than deductive certainty.
  2.  **Substantive and Defensible.** Correctly identifies that underpowered studies cannot rule out effects, but misapplied if the study design was high-powered.
  3.  **Contentious.** Depends entirely on the specification of the alternative model; if the alternative is vague, the ratio is undefined, making the claim unfalsifiable.
  4.  **Substantive and Defensible.** This is the only reading that operationalizes "absence" in a way useful for cumulative science, matching your preregistration strategy.
  5.  **Self-undermining.** If no evidence can ever indicate absence, then no evidence can indicate presence either, rendering the slogan incompatible with claiming the original effect was real.

  3. "What the line was doing in our seminar"

  The speaker likely conflated Reading 2 (Power) and Reading 5 (Ontological) to dismiss your result. Reading 2 licenses the move only if your study was underpowered. However, with 2.5 times the original sample and a preregistered SESOI, you likely satisfied the conditions for Reading 4 (Equivalence). By ignoring Reading 4, the speaker treated your narrow confidence interval as merely "non-significant" rather than "informative about magnitude." This misapplication allows them to claim your null result shows nothing, but it is inconsistent with their acceptance of the original positive result.

  If the speaker accepts the original study's significant result as evidence *for* an effect, they must accept that some data configurations count as evidence *for* presence. By the symmetry worry you noted, if data can support presence (via Reading 2 or 3), sufficiently precise data must support absence (via Reading 4). To deny this while accepting the original finding is to treat "evidence" asymmetrically: significant p-values count as evidence for existence, but narrow confidence intervals around zero do not count as evidence for negligible size.

  Reading 5 would license their blanket dismissal of the field's accumulated nulls, but it undermines their response to you because it also undermines the original study they are defending. If no implementation can prove absence, no implementation could have proven presence in the first place. Thus, the speaker is likely relying on Reading 2 rhetorically to protect the original effect, while implicitly relying on Reading 5 to dismiss the replications. This allows them to move the goalposts: the original study had "enough" evidence for presence, but your stricter study has "insufficient" evidence for absence. This is illegitimate because your study was designed specifically to meet the evidential standards (SESOI) that Reading 4 requires to claim absence of a meaningful effect.

  4. "Two things I could say back"

  "Given that we accept the original significant result as evidence for presence, what specific evidential standard would you require to accept a result as evidence for absence? Is there a confidence interval width that would change your mind?"

  "If we agree that low power prevents us from claiming absence, does high power combined with a preregistered SESOI suffice, or do you believe no empirical result can ever support a claim of negligible effect?"
