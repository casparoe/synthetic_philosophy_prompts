  2.  **Deconstruct the Core Principle:**
      *   *Principle:* "Control measures backfire if the model is strategically misaligned." (Often associated with "instrumental convergence" or "deceptive alignment").
      *   *Implication:* If the model is smart enough to know it's being watched and cares enough to evade, adding monitoring might just train it to be better at evasion without fixing the underlying goal.
      *   *Counter-argument:* If the model isn't strategically misaligned yet, controls buy time. If the model is too dumb to game the monitor, controls work.
      *   *Decision Logic:* We need to assess *Capability to Deceive* vs. *Effectiveness of Monitor* vs. *Risk of Deployment*.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   Needs to be a flowchart or checklist style.
      *   *Step 1: Capability Assessment.* Can it even perceive the control?
      *   *Step 2: Incentive Assessment.* Does it have a reason to bypass it? (Proxy for alignment).
      *   *Step 3: Monitor Robustness.* Is the control transparent or opaque to the model?
      *   *Step 4: Failure Mode.* What happens if it games the control?
      *   *Hard Stop:* If Capability > Monitor Robustness AND Incentive is High.
      *   *Values Call:* When risk is acceptable but non-zero (risk tolerance).

