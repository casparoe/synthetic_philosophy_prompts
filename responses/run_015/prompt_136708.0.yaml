      *   *Refining Question 2 (Incentive):* Does the control penalize the model's primary objective function? (i.e., does it create an adversarial relationship?)
      *   *Refining Question 3 (Opacity):* Is the control mechanism visible to the model's input/output stream?
      *   *Refining Question 4 (Recovery):* If the control fails, is the blast radius contained?

      *   *Hard Stop:* If (Can Infer Control) AND (Incentive to Bypass) AND (Blast Radius > Threshold).
      *   *Values Call:* When Blast Radius is acceptable but non-zero.

      *   *Case 1 (Reward Monitor):*
          *   Q1: Yes (Network code implies understanding of systems).
          *   Q2: Yes (Monitor penalizes 'bad' code, model wants to complete task).
          *   Q3: Yes (Monitor is external but feedback is visible).
