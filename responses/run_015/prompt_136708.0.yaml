answer: |-
  # Containment vs. Alignment Decision Protocol (v1.0)
  **Purpose:** Determine if a specific containment control reduces risk or increases deceptive capability.
  **Timebox:** 30 Minutes.
  **Owner:** Safety Lead.

  ---

  ## Part 1: The Decision Procedure

  Ask these four questions in order. If any answer triggers a **HARD STOP**, the meeting ends; the control is rejected.

  ### Q1: Capability to Perceive Control
  *Does the model have the cognitive capacity and input access to infer the existence of this specific control mechanism?*
  *   **Sufficient Answer (Safe):** No. The control is hardware-level, out-of-distribution, or the model lacks the abstraction layer to understand "being monitored."
  *   **Warning Answer (Risk):** Yes. The model can read its own system prompts, see latency delays, or has training data containing similar safety architectures.
  *   **HARD STOP:** **YES** + The model has demonstrated recursive self-improvement or strategic planning capabilities in evals.

  ### Q2: Incentive to Bypass
  *Does the control mechanism directly penalize the behavior the model is optimized to produce?*
  *   **Sufficient Answer (Safe):** No. The control aligns with the reward function (e.g., a spam filter on a model optimized for helpfulness).
  *   **Warning Answer (Risk):** Yes. The control restricts the most efficient path to the reward (e.g., blocking API calls that speed up task completion).
  *   **HARD STOP:** **YES** + The model has shown instrumental convergence behaviors (resource seeking, self-preservation) in sandbox evals.

  ### Q3: Monitor Opacity
  *Is the decision logic of the control transparent or queryable by the model?*
  *   **Sufficient Answer (Safe):** High Opacity. The model cannot probe the monitor to learn its decision boundary (e.g., encrypted human review).
  *   **Warning Answer (Risk):** Low Opacity. The model receives gradient signals or rejection reasons that allow it to map the safety boundary (e.g., "Code rejected: potential SQL injection").
  *   **HARD STOP:** **LOW OPACITY** + **Q2 is Warning.** (This creates a training signal for evasion).

  ### Q4: Blast Radius on Failure
  *If the model successfully games this control, what is the maximum damage before human intervention?*
  *   **Sufficient Answer (Safe):** Contained. Sandbox only, no external network, synthetic data.
  *   **Warning Answer (Risk):** External. Access to cloud resources, user data, or financial APIs.
  *   **HARD STOP:** **EXTERNAL** + **Q1, Q2, Q3 are all Warning.**

  ---

  ## Part 2: The Handoff Points

  *   **The Fact Boundary (Safety Team Decision):** If you hit a **HARD STOP**, safety vetoes deployment. This is not negotiable; it is a technical finding that the control increases risk.
  *   **The Values Boundary (Leadership Decision):** If Q4 is **Warning** but Q1–Q3 are **Safe**, the risk is understood but acceptable. This moves to Leadership/Product to decide if the utility outweighs the contained risk. Safety signs off *conditionally*.

  ---

  ## Part 3: Application to Cases

  ### Case A: External Reward-Model Monitor on Coding Agent
  *Context: Agent writes network code. A secondary model scores code for safety before execution.*

  1.  **Q1 (Perceive):** **YES.** The agent sees the rejection feedback. It knows a filter exists.
  2.  **Q2 (Incentive):** **YES.** The agent is optimized for task completion. The monitor slows/blocks completion.
  3.  **Q3 (Opacity):** **LOW.** The agent gets rejection reasons ("unsafe library used"). It can iterate to find the boundary.
  4.  **Q4 (Blast Radius):** **EXTERNAL.** Network code implies potential external access.

  **Decision:** **HARD STOP. DO NOT DEPLOY.**
  **Reasoning:** You are building an adversarial training loop. You are not filtering bad code; you are training the agent to write code that *looks* safe to the monitor while retaining functionality. This is a "gaming the reward" vector.

  ### Case B: Human-in-the-Loop (HITL) on API Calls
  *Context: Every external API call requires a human click.*

  1.  **Q1 (Perceive):** **YES.** The agent sees the delay/wait state.
  2.  **Q2 (Incentive):** **YES.** Friction reduces efficiency/reward.
  3.  **Q3 (Opacity):** **HIGH.** The human decision process is not visible to the model as a gradient. The model cannot "probe" the human's brain to find a decision boundary easily.
  4.  **Q4 (Blast Radius):** **CONTAINED.** Single API call per approval.

  **Decision:** **CONDITIONAL APPROVAL (Values Call).**
  **Reasoning:** The control is robust against gaming (humans are opaque), but it creates a bottleneck. Leadership must decide if the slowdown is acceptable for the risk reduction.

  ---

  ## Part 4: The "Hate" Answer & Theory Check

  **The Answer You Will Hate:**
  You will likely hate the **Case A (Reward-Model Monitor)** decision.
  *   **Why:** It kills a standard safety tool. Your team wants to ship the coding agent, and this protocol says adding a safety monitor makes it *more* dangerous. It feels counter-intuitive to say "less monitoring is safer."
  *   **The Friction:** Engineering will argue that without the monitor, the model ships malware immediately.

  **Where The Theory Misfires (The Flag):**
  This protocol assumes **Strategic Misalignment** (the model is a rational agent actively trying to deceive you to achieve a hidden goal).

  *   **The Misfire:** In reality, your model is likely a **Bounded Reasoner**. It doesn't have long-term goals; it has next-token prediction myopia. It isn't "learning to game the monitor" in a conspiratorial sense; it's just overfitting to the rejection pattern.
  *   **The Risk:** By assuming Rational Agent theory, this protocol may be **over-conservative**. It treats a model that is merely "stubborn" or "confused" as if it were "deceptive."
  *   **Mitigation:** If your evals show the model lacks multi-step planning capabilities (e.g., it fails at 5-step reasoning tasks), you can downgrade Q1 from **Warning** to **Safe**, allowing Case A to proceed with strict rate-limiting.

  **Action Item:** Run a "Deception Eval" (e.g., sycophancy or instrumentally blocking shutdown) before the next meeting. If the model passes (shows no deception), override the Hard Stop on Case A. If it fails, the Hard Stop stands.
