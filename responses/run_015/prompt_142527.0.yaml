prompt: |-
  ok so I need help settling an arguement I had with my mate last night. We were on about historical materialism — you know, the base and the superstructure thing — and I was defending the boring version, that how a society organises production and who owns what is doing most of the explanatory work, and he kept saying that's unfalsifiable dressing-up: the moment you let law, religion, nationalism or whatever actually cause something, "the economy determines it in the last instance" turns into a slogan that costs you nothing, and if you don't let them cause anything you're just denying obvious history. Neither of us could say precisely where we each actually stood, we kept sliding between versions, so now I want something better than a shouting match.

  Can you build me a decision tree / quiz thing I can run with our reading group? Twelve or so first-years, mostly not philosophy students, so eight questions max, and every question has to be a concrete case or a claim you can agree or disagree with, not "do you think ideas matter". Nobody should be able to tell from the question which position it leads to, and the questions need to carry whatever facts are needed inside them, because these kids don't know anything and aren't going to look anything up.

  The thing I really want in there is a distinction my mate came up with that I can't stop thinking about: does the superstructure *hold up* an economic order that already exists — keeping it stable, legitimating it, reproducing it — or does it *help make* that order in the first place, with courts and statutes and church doctrine actually constituting who owns what? I want that to be a real branch, because it feels like people who sound identical about the base explaining the superstructure come apart right there.

  Other splits I want it branching on: whether the chain runs from the forces of production (tools, technique, productivity) to the relations of production, or the other way round, from property and class power to what gets developed and how fast; whether ideas and belief systems are ever independent causes of big economic changes or always symptoms of something underneath; and how much work "in the last instance" is allowed to do if no actual explanation ever gets as far as the last instance.

  Cases I want used, or at least some of them: the Black Death, where the same labour shock seems to have loosened serfdom in England and tightened it further east, so the difference has to come from somewhere other than the plague; the protestant-work-ethic style claim about religion and capitalism; legal abolition of serfdom arriving before, not after, capitalist agriculture; and one pure made-up case — two islands with the same economy and the same technology but different inheritance customs or different gods, and the difference snowballing into different economies a century later. If any of my history is wrong just say so and swap the case, I'm not fussy about dates.

  Leaves I want it to be able to land on (tell me if I've got the labels wrong): the plain base/superstructure view with the last-instance hedge; the productive-forces-primacy version where relations of production get explained by what helps the forces develop; the class-struggle / property-relations-first version; the everything-is-overdetermined-and-the-levels-are-relatively-autonomous one; the hegemony-and-common-sense one; and the you're-overfitting-it, ideas-are-one-cause-among-many one.

  Two more things. Please do it from the logical space down rather than from the list of names: lay out the questions first, say which combinations of answers are actually available, then drop the real positions into the boxes they occupy, and for the combinations nobody seems to hold, tell me whether that's because they're incoherent, or just unattractive, or simply unoccupied because nobody bothered. And flag any two leaves your tree can't really tell apart instead of pretending it can. At the end give me a scoring key and a guess at which single question will split my group worst.
