answer: |-
  This is a solid dispute. Your mate's point about the "constitutive" role of the superstructure is essentially the critique raised by legal realists and later by scholars like Robert Brenner and Ellen Meiksins Wood: if property rights are *defined* by law, you can't say the economy exists prior to the law that constitutes it.

  Here is a six-question diagnostic tool designed for your reading group. It avoids jargon, embeds the necessary facts, and forces a choice on the specific logical splits you identified.

  ### The Diagnostic Quiz

  **Instructions:** Read each claim. Mark **Agree** if you think the claim is mostly true, **Disagree** if you think it is mostly false. Do not look for the "Marxist" answer; look for the historically accurate one.

  **Q1. The Two Islands**
  Imagine two islands with identical technology, geography, and population. On Island A, inheritance law says land must pass to the eldest son. On Island B, land is divided equally among all children. After 100 years, Island A has large commercial farms and a landless workforce; Island B has small subsistence plots and no labour market.
  *Claim:* This economic divergence proves that legal customs can determine economic structure, even when technology is identical.
  [ ] Agree [ ] Disagree

  **Q2. The Black Death**
  In the 14th century, the plague killed a huge portion of the workforce in both England and Eastern Europe. In England, this labour shortage helped end serfdom. In Eastern Europe, it led to "second serfdom" (stricter bondage).
  *Claim:* Since the economic shock (labour shortage) was the same, the different outcomes must be explained by differences in prior class power and political organization, not by the economic shock itself.
  [ ] Agree [ ] Disagree

  **Q3. The Steam Engine**
  Consider the Industrial Revolution.
  *Claim:* The factory system became dominant primarily because the new steam technology *required* workers to be in one place, forcing a change in social relations to fit the machine.
  [ ] Agree [ ] Disagree

  **Q4. The Deed to the Land (The Constitutive Split)**
  Consider a farmer who has fenced off a piece of land and farms it. The state courts vanish tomorrow.
  *Claim:* The farmer still "owns" the land economically, and the law merely protected that pre-existing fact. (Disagree = Ownership is created by the law; without courts, there is only possession, not property).
  [ ] Agree [ ] Disagree

  **Q5. The Calvinist Merchant**
  Consider the rise of capitalism in Northern Europe.
  *Claim:* Religious beliefs about predestination and hard work caused people to accumulate capital and reinvest profits, independent of existing economic pressures.
  [ ] Agree [ ] Disagree

  **Q6. The Last Instance**
  A war breaks out between two nations, reshaping their economies. A historian explains this by citing political rivalries and diplomatic blunders, with no reference to trade or resources.
  *Claim:* This explanation is incomplete. To be scientifically valid, we must eventually find the economic cause that made the war inevitable "in the last instance."
  [ ] Agree [ ] Disagree

  ***

  ### The Logical Space

  Before assigning labels, we must map the available combinations. There are $2^6 = 64$ possible answer keys, but they cluster into logical families based on three axes:
  1.  **Economic Determinism:** (Q1, Q5, Q6). Does the economy strictly determine outcomes, or can law/ideas diverge?
  2.  **Internal Driver:** (Q2, Q3). Is change driven by Technology (Forces) or Class/Politics (Relations)?
  3.  **Superstructure Role:** (Q4). Is law reflective (stabilizing) or constitutive (making)?

  **The Viable Combinations (The Leaves)**

  Here is how the six positions you requested map onto the answer patterns.

  **1. The "Orthodox" Base/Superstructure (Last Instance Hedge)**
  *   **Pattern:** Q1(Dis), Q2(Agree), Q3(Dis), Q4(Agree), Q5(Dis), Q6(Agree).
  *   **Logic:** Economy is primary (Q1, Q5). Class power mediates shocks (Q2). Tech doesn't force relations (Q3). Law protects pre-existing property (Q4). Explanations must bottom out in economics (Q6).
  *   **Note:** This is the "boring version" you were defending. It accepts Q6 to save the theory from unfalsifiability.

  **2. Productive-Forces Primacy (Technological Determinism)**
  *   **Pattern:** Q1(Dis), Q2(Dis), Q3(Agree), Q4(Agree), Q5(Dis), Q6(Agree).
  *   **Logic:** Distinct from Orthodox only on Q2/Q3. Believes technology drives history. The factory *needed* workers (Q3), so relations adapted. The Black Death outcomes would be viewed as temporary deviations from the technological imperative.
  *   **Note:** Often associated with G.A. Cohen.

  **3. Class-Struggle / Property-Relations First (Political Marxism)**
  *   **Pattern:** Q1(Dis), Q2(Agree), Q3(Dis), Q4(Dis), Q5(Dis), Q6(Agree).
  *   **Logic:** Distinct from Orthodox on Q4. Believes class power drives history (Q2), but crucially, that property is *constituted* by law/politics (Q4). The economy doesn't exist prior to the social relations that define it.
  *   **Note:** This is the Brenner/Wood position. It accepts economic primacy but denies the "Base" exists independently of the "Superstructure."

  **4. Overdetermination (Relative Autonomy)**
  *   **Pattern:** Q1(Agree), Q2(Agree), Q3(Dis), Q4(Dis), Q5(Agree), Q6(Dis).
  *   **Logic:** Rejects strict determinism (Q1, Q6). Accepts that levels (law, religion, economy) interact complexly. Ideas have effect (Q5). Law constitutes reality (Q4).
  *   **Note:** Althusserian. Rejects the "Last Instance" as a useful scientific category.

  **5. Hegemony / Common Sense (Gramscian)**
  *   **Pattern:** Q1(Dis), Q2(Agree), Q3(Dis), Q4(Agree), Q5(Agree), Q6(Dis).
  *   **Logic:** Similar to Orthodox on Q4 (Law stabilizes), but disagrees on Q5/Q6. Ideas are not just reflections; they are the *glue* that holds the economic order together (Consent). Without the cultural shift (Q5), the economy collapses. Rejects Q6 because politics/culture can be decisive, not just economic epiphenomena.
  *   **Note:** Focuses on *reproduction* of order rather than *origin*.

  **6. Pluralist / "You're Overfitting"**
  *   **Pattern:** Q1(Agree), Q2(Dis), Q3(Dis), Q4(Dis), Q5(Agree), Q6(Dis).
  *   **Logic:** Rejects the model entirely. Ideas cause things (Q5). Law makes property (Q4). Technology doesn't dictate society (Q3). No "Last Instance" (Q6).
  *   **Note:** Weberian or liberal institutionalist.

  ***

  ### Empty and Incoherent Boxes

  You asked to flag combinations that nobody holds or that are logically broken.

  **1. The "Constitutive Technocrat" (Incoherent)**
  *   **Pattern:** Q3(Agree) + Q4(Disagree).
  *   **Why:** This claims technology forces social change (Steam requires factories) *but* also that law creates property rights. If law creates property, then technology cannot force relations without passing through the legal system. If the legal system is constitutive, it can block the technological imperative. Holding both implies technology magically bypasses law to change relations.
  *   **Verdict:** Logically unstable.

  **2. The "Last Instance Pluralist" (Contradictory)**
  *   **Pattern:** Q1(Agree) + Q6(Agree).
  *   **Why:** If you agree that legal customs can determine economic structure despite identical technology (Q1), you have already admitted the economy is not the primary determinant. Claiming there is still an economic "last instance" (Q6) renders the phrase meaningless, exactly as your mate argued.
  *   **Verdict:** Unattractive/Defensive. This is the "slogan that costs you nothing" position.

  **3. The "Idealist Determinist" (Unoccupied)**
  *   **Pattern:** Q5(Agree) + Q1(Disagree) + Q6(Agree).
  *   **Why:** This claims ideas caused capitalism (Q5), but the economy still determines history in the last instance (Q6), and culture cannot diverge from economy (Q1). It tries to have Weber's cause with Marx's structure.
  *   **Verdict:** Simply unoccupied. Nobody argues ideas are the prime mover *and* that the economy is the last instance.

  ***

  ### Indistinguishable Leaves

  **Gramsci (Hegemony) vs. Althusser (Overdetermination)**
  *   **The Problem:** On a six-question quiz, these two blur. Both reject the "Last Instance" (Q6) and both grant ideas causal weight (Q5).
  *   **The Nuance:** Gramsci sees ideas as functional for *stability* (holding up the order). Althusser sees ideas as structurally distinct but linked (overdetermined).
  *   **The Flag:** If a student scores as **Hegemony** but argues that ideas can *destabilize* the economy without an economic trigger, they are actually an **Overdeterminationist**. The quiz treats them as adjacent because the practical political difference is often smaller than the theoretical one.

  ***

  ### Scoring Key & Analysis

  **How to run it:**
  Tally the "Agree" counts for specific groupings.

  *   **High Economic Determinism:** Disagree Q1, Disagree Q5, Agree Q6.
  *   **High Superstructure Autonomy:** Agree Q1, Agree Q5, Disagree Q6.
  *   **Forces Primacy:** Agree Q3.
  *   **Relations/Class Primacy:** Disagree Q3, Agree Q2.
  *   **Constitutive View:** Disagree Q4.
  *   **Stabilizing View:** Agree Q4.

  **The Most Divisive Question:**
  **Q6 (The Last Instance).**
  This is the fault line.
  *   If they **Agree**, they are committed to a version of Marxism that risks your mate's "unfalsifiable" critique. They must explain *how* we get to that last instance without ignoring history.
  *   If they **Disagree**, they are admitting that politics or ideas can be the *final* explanation. This saves the history but risks abandoning Historical Materialism entirely.
  *   **Prediction:** This will split your group 50/50. The "Orthodox" and "Forces/Class" types will Agree. The "Overdetermination," "Hegemony," and "Pluralist" types will Disagree. It forces them to choose between theoretical purity and historical openness.

  **Advice for the Discussion:**
  When you reveal the results, focus on **Q4 (The Deed to the Land)**. This is your mate's specific contribution.
  *   If the group mostly **Agreed** (Law protects): They view the economy as a physical reality (things, labour) that law shields.
  *   If the group mostly **Disagreed** (Law constitutes): They view the economy as a social relation that law *creates*.
  *   **The Kicker:** If they Disagree Q4 but Agree Q6, point out the tension. If law *creates* property, and politics *creates* law, how can the economy be the "last instance"? That is the exact spot where the theory either breaks or becomes sophisticated enough to handle your mate's critique.
