  Here are two candidate principles constructed to systematize your intuitions. Each is precise enough to generate verdicts on new cases, and each exposes a specific inconsistency in your current set of judgments.

  ### Principle 1: The Organismic-Continuity Principle

  **Definition:** A subject of experience is identical to a biological organism with a continuous developmental history.

  *   **Clause A (Sufficiency):** A single living human organism constitutes exactly one subject, regardless of internal functional disconnection.
      *   *Tied to Case 2 (Breakfast) and Case 8 (Normal Self):* This clause forces the verdict that the split-brain patient at breakfast is one subject because she is one organism. It implies your "60-40" lean in Case 1 (Lab) is incorrect; the lab setup does not change the organism count.
  *   **Clause B (Necessity of Origin):** Two distinct biological organisms cannot fuse into a single subject, regardless of the bandwidth of information exchange between them.
      *   *Tied to Case 5 (Two-Person Bridge) and Case 6 (Throttled Bridge):* This clause secures your intuition that the bridged pair remains two subjects. It treats the bridge as a communication channel between subjects, not a unifier of subjecthood.
  *   **Clause C (Developmental Plasticity):** The absence or removal of standard integration structures (like the corpus callosum) does not alter subject count, provided the organism survives.
      *   *Tied to Case 3 (Agenesis) and Case 4 (Hemispherectomy):* This explains why the agenesis patient is one subject (one organism adapting) and the hemispherectomy patient is one subject (one organism persisting), not a half-subject.

  **Predictions for New Cases:**
  *   **Delayed Bridge (Case 7):** **Two Subjects.** Since the bridge connects two distinct organisms, Clause B dictates two subjects regardless of the delay. The delay is irrelevant to the count.
  *   **One-Way Bridge:** **Two Subjects.** Origin trumps flow direction.
  *   **Ramped Bandwidth:** **No Threshold.** The count remains two subjects from zero bandwidth to maximum bandwidth. There is no point of fusion because fusion is metaphysically impossible under this principle.

  **Cost:** You must give up your **Case 1 (Lab)** intuition. If you accept this principle, the split-brain patient in the lab is unequivocally one subject, just like the patient at breakfast. The conflicting hands are merely effectors controlled by dissociated modules of a single subject, akin to your own hands typing while you think about dinner. Your "60-40" wobble is ruled out.

  ### Principle 2: The Phenomenal-Integration Principle

  **Definition:** A subject of experience is a maximal system of mental states that are causally integrated within a temporal window $\tau$ sufficient for unified report and agency.

  *   **Clause A (Functional Unity):** Subjecthood is determined by the current capacity for information integration, not biological history.
      *   *Tied to Case 1 (Lab):* This clause validates your lean toward "two subjects" in the lab. The callosotomy severs the causal link required for a single phenomenal field, creating two functional systems.
  *   **Clause B (Fission and Fusion):** If integration falls below a threshold, one subject becomes two. If integration rises above that threshold, two subjects become one.
      *   *Tied to Case 6 (Throttled Bridge) and Case 7 (Delayed Bridge):* This clause handles the gradient cases. Low bandwidth (Case 6) yields two subjects; high bandwidth could yield one.
  *   **Clause C (Temporal Window):** Integration must occur within a specific time $\tau$ to count toward unity.
      *   *Tied to Case 7 (Delayed Bridge):* This clause explains why you are "genuinely torn" on the delay. If the delay exceeds $\tau$, unity breaks.

  **Predictions for New Cases:**
  *   **Delayed Bridge (Case 7):** **Depends on $\tau$.** If the delay is shorter than the integration window required for unified action (e.g., <200ms), it is **One Subject**. If longer, it is **Two Subjects**.
  *   **One-Way Bridge:** **Likely Two Subjects.** Maximal integration usually requires reciprocity. If the Right Hemisphere cannot access the Left's states, the system is not maximally integrated, though it might be *asymmetrically* unified.
  *   **Ramped Bandwidth:** **Yes, there is a Threshold.** As bandwidth increases, there is a specific point where the causal coupling becomes strong enough to support a single unified field. At that point, the count switches from two to one.

  **Cost:** You must give up your **Case 5 (Two-Person Bridge)** verdict. If the bridge carries *more* information than a healthy callosum (as you stipulated), Clause A dictates that the two persons fuse into **One Subject**. Your intuition that they remain two is based on biological origin, which this principle explicitly rejects. You must accept that sufficiently high integration erases the boundary between persons.

  ### Which Verdicts Must You Give Up?

  *   **If you choose Organismic-Continuity:** You must abandon the idea that the lab setup creates a second subject (Case 1). You must align with your friend: the patient is one subject whose access to her own motor systems is experimentally fragmented.
  *   **If you choose Phenomenal-Integration:** You must abandon the idea that biological origin protects against fusion (Case 5). You must accept that personhood is a functional status, not a historical one, and that two people can theoretically become one.

  ### The Keystone Case

  The single case that, if changed, would bring the rest into line is **Case 5 (The Two-Person Bridge)**.

  Currently, Case 5 is the outlier that prevents you from adopting a clean functionalist view. You accept that function determines subjecthood in the split-brain patient (Case 1), but you deny that function determines subjecthood in the bridged pair (Case 5). This inconsistency is what makes your verdicts feel "all over the place."

  If you change your verdict on **Case 5 to "One Subject,"** the **Phenomenal-Integration Principle** snaps into place.
  1.  **Case 1** becomes clearly "Two Subjects" (low integration).
  2.  **Case 2** becomes clearly "One Subject" (subcortical integration suffices).
  3.  **Case 7 (Delayed)** and **Ramped Bandwidth** gain clear truth conditions based on the threshold $\tau$.
  4.  Your friend's view on the split-brain patient is refined: she is one subject in daily life (integration via subcortical routes) but functionally two in the lab (cortical disconnection).

  Changing Case 5 resolves the tension between your intuition on the split-brain (function matters) and your intuition on the bridge (history matters). It forces you to admit that subjecthood is about the *structure of the now*, not the *history of the origin*. If you cannot make that change, you are forced to accept the Organismic-Continuity Principle, which requires you to tell your friend she is right about the lab case, but for a deeper metaphysical reason than she likely intends.
