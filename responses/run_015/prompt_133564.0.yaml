prompt: |-
  I've been working through the problem of moral revolutions—specifically the end of dueling and the abolition of slavery—trying to decide whether Kwame Anthony Appiah's honor-based account and Eric Williams's economic thesis actually leave any independent causal work for moral arguments to do. Appiah seems to show that dueling collapsed not because anyone won a philosophical debate about its wrongness, but because the practice flipped from a source of prestige to a source of shame; Williams treats antislavery rhetoric as largely epiphenomenal to structural declines in plantation profitability. Taken together, they appear to dissolve the standard framing—arguments, interests, or honor—into a single anti-rationalist claim: moral reasoning is always just the public vocabulary through which shifts in status or material interest express themselves.

  This leaves me with a confusion I'm struggling to articulate precisely. If honor and economic interest are the real engines, and arguments are merely decorative clothing, then shouldn't moral philosophy abandon its traditional commitment to reason-giving and reconceive itself as an applied sociology of status? I'm particularly drawn to testing this on a contemporary case: movements that try to shift norms around factory farming or long-term risk through explicit moral reasoning, without waiting for a prior collapse in economic utility or a flip in elite honor codes. Does the Appiah-Williams synthesis predict that such reasoning-driven campaigns are causally inert—doomed to rationalize shifts only after they have already occurred—or is there a hidden gap in the synthesis that allows arguments to operate as an independent variable?

  I'm also unsure whether Appiah and Williams are genuinely complementary or secretly redundant. Appiah gives honor autonomous causal power; Williams seems to reduce moral rhetoric to economic base. So is honor just a mediating mechanism through which material interests flow, which would make Appiah's framework redundant? Or can honor dynamics run counter to economic interests, giving Appiah a genuinely independent explanatory role?

  Please lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
