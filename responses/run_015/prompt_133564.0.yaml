answer: |-
  Moral philosophy should not abandon reason-giving for sociology because moral arguments are the causal mechanisms that rewire honor codes and redefine interests, ensuring Appiah and Williams offer complementary rather than redundant explanations while preserving independent efficacy for reasoning-driven campaigns. Appiah does not claim moral arguments are inert; rather, he locates their efficacy in social psychology, showing that reasoning is the tool used to shift the social meaning of actions from honorable to shameful. Without philosophical argumentation to redefine what counts as virtuous or vicious, the honor code remains static, meaning reason-giving is the engine of the status shift rather than its decorative byproduct. Williams's economic thesis explains the structural vulnerability of an institution like slavery, making abolition feasible, but it cannot explain the timing or the moral closure without Appiah's honor mechanism, which explains why elites ceased defending the practice even when remnants of profit remained. These frameworks are not redundant because honor dynamics frequently override economic interest, as evidenced by the persistence of dueling long after it became economically irrational, proving that status concerns operate as an independent variable rather than a mere proxy for material gain. Consequently, contemporary movements focused on factory farming or long-term risk are not doomed to inertness; the synthesis predicts they will succeed only if their moral reasoning successfully attaches to elite identity or economic efficiency, but the reasoning itself is the necessary lever to forge those attachments. Moral philosophy therefore remains distinct from sociology because it generates the normative inputs that alter sociological outcomes, rather than merely describing the shifts after they occur.
