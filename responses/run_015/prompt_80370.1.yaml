prompt: |-
  I'm building a detector whose whole job is to flag when a neural net's internal machinery has changed, not just when its outputs look weird -- so less 'is this prediction out of distribution' and more 'is the net now getting it's answer by a different route than it used to, even if the answer still looks fine.' It was coming up in a conversation with a friend who works on interpretability and she kept answering 'well, what do you mean by same mechanism' and I honestly couldn't push back, because every definition I try breaks on some case. Before I lock one in, can you write out the desiderata -- what any adequate account of mechanism-identity has to actually deliver for this use? I mean the cases it has to get right (the same function computed by two structurally different circuits; a circuit that gets reused across several unrelated tasks; a mechanism that survives a weight update but has been re-expressed in a different basis; a spurious correlation that just looks mechanism-like; the same high-level mechanism seen at two very different granularities), the distinctions it can't collapse (functional equivalence vs. structural or causal identity, a mechanism vs. a sub-mechanism, and the granularity question of at what level of abstraction we even do the comparing), and any empirical fact about how these models actually work that it can't contradict (overparameterization, superposition, the fact that lots of different weight configurations can do the same job).

  Put the case or motivation behind each item rather than just listing them, mark wich ones you think are non-negotiable for the anomaly-detection use vs. which are just preferences of one camp, and tell me if any subset of the list looks jointly unsatisfiable -- that would be the single most useful thing you could give me. And please keep straight what's basically settled among people who actually do this work from what's genuinely still being argued about; don't dress up a contested reading as if it were the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Define desiderata for "mechanism identity" in the context of a detector for neural network internal changes (mechanistic anomaly detection).
      *   **Context:** The user is building a tool to flag when a model's *internal machinery* changes, even if outputs remain stable. This is distinct from OOD detection.
      *   **Problem:** The definition of "same mechanism" is elusive and breaks on edge cases.
      *   **Requirements:**
          *   Write out desiderata (what an adequate account must deliver).
          *   Include specific cases (functional equivalence, reuse, basis invariance, spurious correlations, granularity).
          *   Include distinctions (functional vs. structural/causal, mechanism vs. sub-mechanism, abstraction levels).
          *   Include empirical constraints (overparameterization, superposition, weight configurations).
          *   Provide motivation/case for each item.
          *   Mark items as "Non-negotiable" (for anomaly detection) vs. "Preferences/Debated".
          *   Identify jointly unsatisfiable subsets (trade-offs).
          *   Distinguish settled science from contested theory.
          *   Tone: Rigorous, honest about uncertainty, technically precise.

  2.  **Deconstruct "Mechanism Identity" in NNs:**
      *   What does it mean for a mechanism to be the "same"?
      *   *Functional:* Same input-output map? (Too coarse, misses the point of the user's project).
      *   *Structural:* Same weights/activation patterns? (Too fine, breaks on re-basing, pruning, retraining).
      *   *Causal:* Same causal graph/paths? (Promising, but hard to define formally).
      *   *Algorithmic:* Same algorithm implemented? (High-level, but mapping to weights is hard).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Item 1: Basis/Parameterization Invariance.* If I rotate the hidden layer basis, is the mechanism the same? Yes, intuitively. A detector shouldn't flag a mere change of basis.
      *   *Item 2: Functional Equivalence is Insufficient.* The whole point is to catch changes *without* output changes. So the definition *must* distinguish between same function/different mechanism.
      *   *Item 3: Granularity/Abstraction.* Is a transformer head the mechanism? Or the MLP inside? Or the specific neurons? Need to handle multi-scale.
      *   *Item 4: Robustness to Noise/Retraining.* Small weight updates (SGD steps) that don't change behavior shouldn't flag as "new mechanism." But large updates that change the *route* should. Where is the line?
      *   *Item 5: Superposition/Polysemanticity.* Features are often distributed. A mechanism might not be a disjoint subgraph.
      *   *Item 6: Causal Specificity.* It can't just be correlation. It must be about the *path* of influence.

  4.  **Categorizing: Non-negotiable vs. Debated:**
      *   *Non-negotiable:* Must distinguish function from mechanism (otherwise the tool is useless). Must handle basis changes (otherwise it flags trivial things). Must handle superposition (otherwise it's empirically false).
      *   *Debated/Preference:* Exact level of abstraction (circuits vs. algorithms). How to quantify "similarity" (distance metric vs. binary identity).

  5.  **Identifying Tensions/Unsatisfiable Subsets:**
      *   *Tension 1:* Basis Invariance vs. Structural Specificity. If you are fully basis invariant, you approach functional equivalence. If you are too structural, you break on basis changes.
      *   *Tension 2:* Granularity vs. Robustness. Fine-grained mechanisms break easily under retraining. Coarse-grained mechanisms might miss subtle heuristic shifts.
      *   *Tension 3:* Causal vs. Statistical. True causal identification requires interventions (expensive/impossible in production). Statistical proxies might be fooled (spurious correlations).

  6.  **Refining the Content based on "Settled vs. Contested":**
      *   *Settled:* NNs are overparameterized. Many weight configs = same function. Superposition exists.
      *   *Contested:* What constitutes a "feature"? Are circuits discrete or fuzzy? Is there a "true" ontology of mechanisms?

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the difficulty (the "hard problem" of mechanistic identity).
      *   **Section 1: The Non-Negotiables (Empirical & Functional Constraints).** Things that *must* hold for the detector to work as described.
      *   **Section 2: The Structural & Causal Distinctions.** Defining the "stuff" of the mechanism.
      *   **Section 3: The Granularity & Abstraction Problem.** Where do we look?
      *   **Section 4: The "Impossible Triangle" (Joint Unsatisfiability).** Highlighting the trade-offs.
      *   **Section 5: Settled vs. Contested.** Clarifying the epistemic status.
      *   **Conclusion:** Recommendation on how to proceed given the constraints.

  8.  **Drafting the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "causal." I need to explain *why* causal matters for anomaly detection (e.g., a spurious correlation might work now but break later, looking like a mechanism change).
      *   *Correction:* Be careful with "Basis Invariance." In ReLU networks, you can't arbitrarily rotate. It's permutation and scaling mostly. But in principle, the *computation* should be invariant to representational changes.
      *   *Emphasis:* The user wants to detect *heuristic shifts*. E.g., Model learns "grammar" vs. Model learns "token co-occurrence." Both give same accuracy. Detector must flag the shift.

  9.  **Final Review against User Prompt:**
      *   Did I cover the specific cases? (Function/Structure, Reuse, Basis, Spurious, Granularity). Yes.
      *   Did I mark Non-negotiable vs. Preference? Yes.
      *   Did I identify unsatisfiable subsets? Yes.
      *   Did I distinguish settled vs. contested? Yes.
      *   Is the tone appropriate? Yes, rigorous and cautious.

  10. **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: I need to make sure I explicitly address the "mechanism survives weight update but re-expressed" case. That's a key part of the prompt. I will add a specific desideratum for "Continuity under Optimization."

  *(Refining the "Unsatisfiable" section)*: The strongest tension is between *Invariance* (ignoring irrelevant changes) and *Sensitivity* (catching relevant changes). If you make the definition too invariant, it collapses to functional equivalence. If too sensitive, it flags noise. This is the core trade-off.

  *(Refining "Settled vs Contested")*: Be clear that "circuits exist" is somewhat settled, but "circuits are discrete and cleanly separable" is contested.

  Okay, ready to write.s
answer: |-
  This is the "Hard Problem" of mechanistic interpretability. You are asking for an ontology of computation that is robust to the messy reality of high-dimensional vector spaces.

  Below are the desiderata for an account of **Mechanism Identity** tailored to your anomaly detection use case. I have categorized them by **Non-Negotiable** (if your detector fails these, it is functionally broken for your stated goal) and **Contested/Preference** (where research communities diverge, and your choice dictates the flavor of your tool).

  At the end, I outline the **Impossible Triangle**, the subset of these desiderata that appears jointly unsatisfiable, which is the critical constraint for your engineering design.

  ---

  ### I. The Non-Negotiables (Empirical & Functional Constraints)
  *These must be satisfied for the detector to distinguish "internal change" from "noise" or "trivial reparameterization."*

  #### 1. Functional Equivalence is Insufficient (The Core Mandate)
  *   **The Case:** Your entire project premise rests on this. If Model A and Model B produce identical output distributions on the relevant data manifold, a functional definition declares them identical. Your detector must declare them *different* if the internal causal paths diverged (e.g., one uses semantic understanding, the other uses a brittle shortcut).
  *   **Desideratum:** The identity metric must be sensitive to **causal structure**, not just input-output maps.
  *   **Status:** **Non-Negotiable.** If you collapse to functional equivalence, you have built an OOD detector, not a mechanism detector.

  #### 2. Invariance to Trivial Reparameterization (Basis/Permutation)
  *   **The Case:** In a standard MLP, you can permute the neurons in a hidden layer and inversely permute the outgoing weights without changing the function or the "logic" of the circuit. Similarly, scaling weights in one layer and inversely scaling in the next (common in LayerNorm scenarios) preserves the computation.
  *   **Desideratum:** Mechanism identity must be invariant to symmetries of the architecture that do not alter the flow of information or the algorithmic steps.
  *   **Status:** **Non-Negotiable.** If your detector flags a permutation of hidden units as a "mechanism change," it will generate false positives during standard fine-tuning or weight averaging.
  *   **Empirical Constraint:** Must respect the specific symmetry group of the activation functions (e.g., ReLU networks allow permutation and positive scaling; softmax attention allows different symmetries).

  #### 3. Robustness to Optimization Noise (Continuity)
  *   **The Case:** A model undergoing SGD moves through weight space continuously. Most steps do not change the "algorithm" the net is running; they just tune the coefficients of the existing algorithm. However, occasionally, a "grokking" event or a phase transition occurs where the heuristic shifts.
  *   **Desideratum:** The metric must treat small weight updates that preserve the causal graph as "same mechanism," while flagging topological changes in the computational graph (e.g., a new path becomes dominant, an old path is pruned) as "different mechanism," even if the weight distance is small.
  *   **Status:** **Non-Negotiable.** Without this, every training step triggers an alarm.

  #### 4. Handling Superposition (Non-Orthogonality)
  *   **The Case:** Empirical evidence suggests features are not localized to single neurons but are distributed and overlapping (superposition). A mechanism might not be a disjoint subgraph; it might be a specific subspace or a specific linear combination of activations that is polysemantic.
  *   **Desideratum:** The definition cannot require mechanisms to be localized to disjoint sets of neurons. It must allow for mechanisms that share hardware resources but operate in orthogonal (or distinct) subspaces.
  *   **Status:** **Non-Negotiable.** A definition requiring disjoint subgraphs contradicts established empirical findings on overparameterization and superposition.

  ---

  ### II. The Structural & Causal Distinctions
  *These define what "stuff" the mechanism is made of. This is where the interpretability community is actively arguing.*

  #### 5. Causal Specificity vs. Statistical Correlation
  *   **The Case:** A set of neurons might activate together every time a task is performed (correlation), but intervening on them might not change the output (epiphenomenal). Conversely, a mechanism might be distributed such that no single node is critical, but the *path* is.
  *   **Desideratum:** Identity must be grounded in **causal interventions** (e.g., activation patching, causal tracing), not just activation correlation. Two mechanisms are different if intervening on them yields different counterfactual outcomes, even if natural activations look similar.
  *   **Status:** **Non-Negotiable for Validity, Contested for Feasibility.** Everyone agrees causality is the *truth*, but there is no consensus on how to measure it efficiently enough for a detector.
  *   **Risk:** If you rely on correlation, you will flag spurious correlations as mechanisms (False Positives) or miss dormant mechanisms (False Negatives).

  #### 6. Mechanism vs. Sub-Mechanism (Compositionality)
  *   **The Case:** Is "addition" one mechanism? Or is it "retrieve digits," "add units," "carry over," "write result"? If a model changes how it handles "carry over" but keeps the rest the same, is the mechanism different?
  *   **Desideratum:** The account must support **hierarchical identity**. You need to be able to say "The high-level algorithm is the same, but the low-level implementation of submodule X changed."
  *   **Status:** **Preference/Design Choice.** Some camps (e.g., discrete circuits) prefer binary identity. Others (e.g., soft attribution) prefer continuous similarity scores. For anomaly detection, a hierarchical approach is safer to avoid alert fatigue.

  #### 7. Reuse Across Tasks (Modularity)
  *   **The Case:** A model might use the same "induction head" mechanism for both completing code and completing natural language. If you fine-tune the model on code, that mechanism persists.
  *   **Desideratum:** Mechanism identity must be **context-invariant**. The "same" mechanism should be identifiable regardless of the input distribution triggering it, provided the internal computation remains structurally isomorphic.
  *   **Status:** **Contested.** Some evidence suggests mechanisms are more context-dependent than we hope. If mechanisms are highly entangled with task-specific contexts, "general mechanism detection" might be impossible.

  ---

  ### III. The Granularity & Abstraction Problem
  *Where do we draw the box around the mechanism?*

  #### 8. The Abstraction Level (Weights vs. Algorithms)
  *   **The Case:** You can compare weight matrices directly (low level), activation patterns (mid level), or inferred algorithms like "move head to subject" (high level).
      *   *Low Level:* Breaks on re-basing (see #2).
      *   *High Level:* Hard to extract automatically.
  *   **Desideratum:** The detector must operate at a **representationally stable layer**. This is usually the activation space or the "circuit" layer (edges between nodes), not raw weights.
  *   **Status:** **Settled Practice.** Most interpretability work agrees weights are the wrong layer for mechanism comparison due to basis dependence.

  #### 9. The "Same Route" Definition (Pathing)
  *   **The Case:** You mentioned "getting the answer by a different route." In a residual stream, information flows through many paths. Does "route" mean the specific edges with high weight? Or the subspace of the residual stream being utilized?
  *   **Desideratum:** Identity must be defined by **information flow topology**. If the dominant path of gradient flow or activation influence shifts from Path A to Path B, the mechanism has changed.
  *   **Status:** **Contested.** There is no consensus metric for "dominant path" in dense, residual networks.

  ---

  ### IV. The Impossible Triangle (Joint Unsatisfiability)

  This is the most critical section for your engineering. You cannot maximize all three of the following properties simultaneously. You must sacrifice one.

  1.  **Basis/Parameterization Invariance:** The detector ignores trivial rotations/scalings of weights.
  2.  **Causal Sensitivity:** The detector distinguishes between two functions that compute the same output via different causal routes.
  3.  **Computational Tractability:** The detector can run without exponential cost or exhaustive intervention testing.

  **The Tension:**
  *   To achieve **(1) Invariance**, you typically move to higher-level abstractions (e.g., comparing subspaces or functions).
  *   To achieve **(2) Causal Sensitivity**, you typically need to perform interventions (patching) to verify the route.
  *   **The Conflict:** Exhaustive causal testing is not tractable **(3)**. If you make it tractable by using statistical proxies (e.g., activation similarity), you lose **(2)** (you can't distinguish correlation from causation) or **(1)** (statistics are often basis-dependent).

  **Recommendation for your Detector:**
  You likely have to sacrifice perfect **Causal Sensitivity**. You cannot run full causal mediation analysis on every inference or weight update. You will likely need to rely on **Activation Geometry** (subspaces) as a proxy for mechanism.
  *   *Risk:* You might flag a mechanism change when it's just a change in feature basis (violating #2).
  *   *Mitigation:* Regularize your detector to be invariant to rotations within the active subspace.

  ---

  ### V. Settled vs. Contested (Epistemic Status)

  To ensure you don't build on sand, here is the distinction between what is empirical fact and what is theory.

  | Claim | Status | Implication for your Detector |
  | :--- | :--- | :--- |
  | **Overparameterization:** Many weight configs map to the same function. | **Settled Empirical Fact** | Your detector *cannot* compare weights directly. |
  | **Superposition:** Features are distributed and non-orthogonal. | **Settled Empirical Fact** | Your detector *cannot* assume 1 neuron = 1 feature. |
  | **Circuits:** Computation decomposes into discrete, interpretable subgraphs. | **Contested / Hopeful** | Don't assume mechanisms are cleanly separable. Allow for fuzzy boundaries. |
  | **Linearity:** Mechanisms can be understood via linear probes/subspaces. | **Contested** | Linear approximations work surprisingly well but fail on complex reasoning. |
  | **Stability:** Mechanisms persist across fine-tuning. | **Contested** | Some evidence suggests fine-tuning scrambles mechanisms even if performance holds. |
  | **Ontology:** There is a "true" set of mechanisms in a net. | **Philosophically Contested** | Your detector imposes an ontology. Acknowledge that "mechanism" is a map, not the territory. |

  ### Summary Recommendation

  For an anomaly detector, I recommend defining Mechanism Identity as:
  **"Stable Causal Subspaces."**

  1.  **Identify Subspaces:** Don't look at neurons; look at directions in activation space (e.g., via SAEs or PCA) that correlate with task performance.
  2.  **Verify Causality (Sampled):** Don't intervene on everything. Intervene on a random subset of these subspace directions to confirm they are causal, not just correlated.
  3.  **Track Topology:** Monitor the *alignment* of these causal subspaces over time. If the subspace required to solve the task rotates significantly (relative to the model's internal basis), flag it as a mechanism change.

  This satisfies **Non-Negotiables 1, 2, 3, and 4**, accepts the **Impossible Triangle** trade-off (approximating causality via geometry), and respects the **Settled Empirical Facts** (superposition/overparameterization).
