      *   *For (1) vs. (3):* Define "Public Good" as *Impartiality*, not *Welfare*. Clientelism trades impartiality for welfare. That's the breach.
      *   *For (4) vs. (5):* Distinguish between *Procedural/Relational norms* (4) and *Ownership/Property norms* (5). Stealing the treasury is different from gift-giving customs.

  7.  **Survivability of (6):**
      *   Can (6) survive if (1) goes? Yes, (6) is standalone.
      *   Can (6) survive if (3) goes? Yes.
      *   *Crucial Point:* (6) actually *needs* (1) to remain normative. If (1) is dropped entirely for a purely descriptive (6), the paper loses its "Anti-Corruption" stance and becomes "Political Economy." To keep "Anti-Corruption," you need the normative claim of (1).
      *   *Strategy:* Keep (6) as the *diagnostic*, keep (1) as the *normative standard*. The tension is the feature, not the bug. It explains *why* corruption persists (6) despite being wrong (1).

  8.  **Drafting the Response:**
