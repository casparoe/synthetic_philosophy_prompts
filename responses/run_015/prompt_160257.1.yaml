      *   **User's Self-Diagnosis:** The user suspects tension between (6) and (1)-(3) (blame vs. system) and between (1) and (3) (public/private gain in clientelism).
      *   **Constraint:** Do not flag everything equally. Rank real clashes by severity. Be explicit about whether (6) survives if others go.

  2.  **Deconstruct the Propositions:**
      *   *(1) Definition:* Corruption = breach of impartiality (office-and-role), public power $\to$ private good. *Not* harm-based.
      *   *(2) Gifts:* Not corruption if relational/no specific act expected. Refusal = insult.
      *   *(3) Clientelism:* Is corruption (vote buying, patronage), even if normalized or beneficial to voters.
      *   *(4) Cultural Relativism:* Western standards aren't universal; conditionality can be illegitimate.
      *   *(5) Kleptocracy:* Grand theft is universal corruption; sanctions justified.
      *   *(6) Equilibrium Standard:* System is corrupt when median official's expected return to partiality > impartiality. Systemic, not individual.

  3.  **Evaluate Internal Consistency (The "Audit"):**

      *   **Tension A: (1) vs. (3) [The Definition Problem]**
          *   *(1)* says corruption is public power $\to$ private good (breach of impartiality).
          *   *(3)* says clientelism is corruption even if voters benefit (mutual gain).
          *   *Conflict:* In clientelism, the "private good" isn't just the politician's; it's a transaction. The voter gets a job/handout. Is public power being converted to *private* gain? Yes, for the politician (votes/power). But (1) emphasizes *impartiality*. Clientelism is explicitly *partial* (favoring supporters). So (1) and (3) actually align on impartiality.
          *   *Nuance:* The user worries: "voter gains too, so it isn't obvious what's been converted from public to private."
          *   *Resolution:* The "public good" is impartial administration. The "private good" is the specific benefit to the voter + the political power to the politician. The breach is the *conditionality* of the public service on private support.
          *   *Severity:* Moderate. It's a definitional stretch but manageable if "public good" is defined as *universal* entitlement rather than aggregate welfare.

      *   **Tension B: (1)-(3) vs. (6) [The Agency/Blame Problem]**
          *   *(1)-(3)* focus on specific wrongs (breach of duty, specific acts, vote buying). They imply moral condemnation of acts/roles.
          *   *(6)* says corruption is a systemic equilibrium where rational actors choose partiality. "No individual wrongdoing or bad character required."
          *   *Conflict:* If (6) is true, the official in (1) isn't necessarily "wrong" in a moral sense; they are rational within a corrupt system. If the system forces the hand, can we call the act a "breach of impartiality that public office *requires*" (1)? If the office *in practice* requires partiality to survive, (1)'s normative claim clashes with (6)'s descriptive claim.
          *   *Severity:* **High.** This is the core philosophical tension the user identified. It undermines the moral force of (1)-(3).

      *   **Tension C: (4) vs. (5) [The Universalism Problem]**
          *   *(4)* says Western standards aren't universal; imposing them is illegitimate.
          *   *(5)* says Kleptocracy *is* universal corruption; sanctions are justified.
          *   *Conflict:* Who decides what counts as "Grand Kleptocracy" vs. "Legitimate Cultural Practice"? If (4) is strong, (5) looks like Western imperialism. If (5) is strong, (4) admits at least one universal standard.
          *   *Severity:* Moderate/High. It's a boundary problem. Needs a clear distinction between "moral economy differences" (4) and "theft of state resources" (5).

      *   **Tension D: (2) vs. (6) [The Gift Problem]**
          *   *(2)* says gifts are okay if relational.
          *   *(6)* says if expected return to partiality > impartiality, it's corrupt.
          *   *Conflict:* A "relational gift" might tip the equilibrium. If the culture expects gifts for *any* service, the equilibrium is corrupt by (6), but (2) says it's not corruption because it's relational.
          *   *Severity:* Low/Moderate. (2) is about *intent/expectation of specific act*, (6) is about *systemic incentives*. They operate at different levels.

  4.  **Ranking the Clashes:**

      1.  **Severity 1: (1) & (3) vs. (6) [The Blame Gap].** This is the deepest. (1) & (3) condemn acts. (6) excuses actors. If (6) is the "truth," (1) & (3) lose their normative bite.
      2.  **Severity 2: (1) vs. (3) [The Public/Private Boundary].** Can clientelism be "public to private" if the public (voters) benefit?
      3.  **Severity 3: (4) vs. (5) [The Universalism Limit].** Where does cultural relativism stop and universal theft begin?

  5.  **Addressing the User's Specific Worries:**
