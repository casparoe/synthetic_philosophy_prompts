          4.  Specific verdict on (6).
      *   *Refinement:* Ensure I explicitly answer "what has to give and what giving it costs me."

      *(Self-Correction during drafting)*: I need to be careful with (1) vs (3). The user thinks the voter gaining makes it not "private gain." I need to explain that the *office* is the public trust, and trading it for votes is the private gain (political survival), regardless of voter benefit. The "private good" is the *transactional nature* itself.

      *(Refining the (6) verdict)*: The user is attached to (6). I should tell them (6) is the strongest part but it transforms the paper from "Moral Philosophy" to "Institutional Analysis." If they want to keep the moral condemnation of (1), they must frame (6) as the *obstacle* to morality, not the *justification* for the act.

  9.  **Final Polish:** Check against constraints. Rank severity. Don't flag everything. Explicit survival check for (6).

