      *   **Tension D: (5) Method vs. (4) Acausal Trade.**
          *   *Analysis:* (5) says evaluate the policy across environments. A policy of "engage in acausal trade when beneficial" generally yields higher utility in a universe where such trade is possible (e.g., encountering superintelligences). A policy of "ignore acausal trade" loses those gains.
