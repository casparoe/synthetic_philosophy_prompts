answer: |-
  Here is the audit.

  ### The Verdict
  Your package is 80% **Functional Decision Theory (FDT)** and 20% **Causal Decision Theory (CDT)** intuition masquerading as skepticism. Commitments 1, 2, 3, and 5 form a tight, mutually reinforcing cluster. Commitment 4 is the outlier that breaks the logic of the cluster.

  You are right to worry about the tension between 3 and 4. It is not merely a nervous stopping point; it is a logical contradiction given your methodological commitment in 5. If you keep 1, 3, and 5, **4 has to give.**

  Here is the ranking of tensions by severity, followed by the specific repair.

  ---

  ### 1. Critical Severity: The Logic of Correlation (3 vs. 4)
  **The Tension:** In the Near-Copy PD (3), you cooperate because your reasoning process is logically linked to the other player's. There is no causal contact, no enforcement, and no explicit agreement. The *only* mechanism enabling cooperation is that your output correlates with theirs due to shared algorithmic structure.

  In Acausal Trade (4), you reject the obligation because there is "no contact, no agreement, no enforcement" and "correlation $\neq$ trade." But this is exactly the same mechanical situation as (3). In (3), correlation *is* the mechanism. If you accept that logical correlation binds you to a near-copy, you must accept that logical correlation binds you to any agent whose decision function is sufficiently dependent on yours (e.g., a superintelligence simulating you).

  **Why it breaks:** You cannot claim in (3) that "defecting is the two-boxer's error" (implying you see the logical link) and then claim in (4) that "correlation is not trading." In both cases, you are reaping benefits from a logical subjunctive dependence. To stop at "near-copy" is arbitrary unless you define "near-copy" as "identical source code," in which case you are no longer in a Prisoner's Dilemma (you are playing against yourself), which trivializes the problem. If they are distinct enough to be a PD but similar enough to cooperate, you have admitted logical correlation matters. If logical correlation matters, acausal trade is on the table.

  ### 2. High Severity: The Newcomb Motivation (1 vs. 4)
  **The Tension:** You treat one-boxing in Newcomb's Problem (1) as a "datum." The standard FDT explanation for one-boxing is that Omega is simulating you (or your type). Your choice now determines the output of that simulation in the past. This is an *acausal* link.

  Acausal trade is simply Newcomb's Problem with two agents instead of one predictor and one agent. If you one-box because you acknowledge your decision determines Omega's prediction, you must acknowledge that your decision determines a trading partner's prediction in an acausal trade scenario.

  **Why it breaks:** Your motivation for (1) commits you to the metaphysics required for (4). If you reject (4) because "there is no contact," you undermine the standard justification for (1), since there is no causal contact between you and Omega's past prediction either. You are trying to harvest the utility of FDT in (1) while rejecting its ontological implications in (4).

  ### 3. Low Severity: The Sunk Cost Worry (2)
  **The Tension:** You worry friends will call paying the driver (2) irrational sunk cost reasoning.
  **Resolution:** They will only say this if they evaluate the *act* in isolation. Your Commitment (5) explicitly forbids this. Under (5), you are not paying a sunk cost; you are executing the policy that secured the ride. The "cost" was incurred when you became the *type of agent* who gets picked up. The payment at the destination is simply the cashing out of that policy.
  **Verdict:** This is not a tension; it is a feature. Keep (5) front-and-center when defending (2). It is the shield that makes (2) rational.

  ---

  ### The Repair: Modify Commitment 4
  You cannot keep (4) as written without dismantling (1) and (3). The least costly repair is to **accept the principle of acausal trade but add a confidence threshold.**

  **The Revision:**
  Change (4) from "Acausal trade is not something anyone owes anyone" to:
  *"Acausal trade is binding only when the logical correlation between agents is sufficiently high to be actionable, and the terms are fixed by the Nash bargaining solution of the counterfactuals, not by explicit agreement."*

  **What this costs you:**
  1.  **Metaphysical Bloat:** You must accept that "logical correlation" is a real thing that generates normative force, even across light cones. This opens you to Pascal's Mugging-style objections (e.g., "I'm a deity in another universe, cooperate or I simulate you suffering").
  2.  **Computational Burden:** You have to admit that agents are obligated to reason about simulations of themselves that they cannot verify.

  **Why this is the right cost:**
  This cost is already implicit in (1) and (3). You are already paying it. In Newcomb's, you trust Omega's simulation. In Copy-PD, you trust the copy's reasoning. Acknowledging this in (4) merely makes your position honest. It stops your reading group from attacking you on the inconsistency and forces them to attack the harder metaphysical claim (which you are already committed to).

  ### How to Defend the "Terms" Objection
  In (4), you wrote: *"I'm not even sure what would fix the terms of such a deal."*
  This is your strongest intuitive resistance, but it is a bargaining problem, not a decision-theoretic one.
  **The Fix:** Argue that the "terms" are fixed by the **best fair equilibrium** both agents can independently compute. If I simulate you and you simulate me, we both converge on the same Schelling point for cooperation. If we can't converge, trade fails. But the *obligation* exists if the convergence is possible.

  ### Summary of Instructions
  1.  **Hold firm on 1, 2, 3, and 5.** They are a coherent FDT package. (5) protects (2) from the sunk-cost charge.
  2.  **Sacrifice 4.** It is the weak link. It relies on CDT intuitions (need causal contact/enforcement) that contradict your FDT commitments in 1 and 3.
  3.  **Replace 4** with a threshold view: Acausal obligations exist where logical correlation is robust enough to be predictive.
  4.  **Expect the Attack:** Your group will attack the revised (4) on the grounds of "spooky action at a distance." Do not retreat to "no contact." Instead, argue that **computation is physical**, and if two physical systems compute the same function, their outputs are not independent events. That is the only ground on which (1) and (3) stand, so it must be the ground for (4) as well.

  If you make this change, your profile hangs together. If you keep (4) as is, you are inviting your group to tear apart the foundation of your one-boxing justification.
