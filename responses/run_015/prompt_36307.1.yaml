          4.  Defense of (2).
      *   *Key Argument:* The logic of Newcomb (1) and Copy-PD (3) *is* the logic of Acausal Trade (4). You cannot have the former without the latter unless you introduce a metaphysical cutoff (identity) that contradicts the methodological stance (5).

  6.  **Refining the Argument on (3) vs (4):**
