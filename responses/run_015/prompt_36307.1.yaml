          *   *Analysis:* User worries (2) looks like irrational sunk cost. But (5) saves it. If the unit is the *policy*, then paying is rational because the policy "pay when arrived" gets you picked up. The cost isn't sunk at the moment of *policy selection*, only at the moment of *act*. Since (5) prioritizes policy, (2) is safe.
