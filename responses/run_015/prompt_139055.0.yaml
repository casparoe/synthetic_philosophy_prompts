answer: |-
  **A Fragment on the Legislation of Morals**
  **By Edmund Vavasour**

  It is a truth too often neglected by the sentimental legislator that punishment is itself an evil. It is pain inflicted upon men; therefore, it demands justification. That justification lies solely in the prevention of greater mischief. Where an act touches no assignable individual in body, property, or reputation, the mischief is null. Yet the advocate for prohibition points to the pain of the public—their revulsion, their alarm. He places this pain in the ledger against the liberty of the agent. I propose a rule to cleanse this ledger: the Test of Corrected Opinion.

  A pain of disapproval enters the legislator's calculation only if it would survive the removal of every false belief held by the person who feels it. If the neighbor's distress rests upon the error that the practice spreads disease, or dissolves the household, or constitutes a fraud upon the public, then that pain is built upon air. To prohibit the act to soothe such pain is to ratify the error. It buys quiet at the price of truth. Repeal, conversely, allows the pain to expire as the error is corrected by experience.

  I do not exempt myself from this scrutiny. My own indignation at the existing law must pass the same test. If my anger rests upon a belief that the law violates abstract rights independent of suffering, it is mere metaphysics and counts for nothing. If it rests upon the observable suffering of those persecuted—their imprisonment, their ruin—then it stands. I concede that if the suffering were removed, my indignation should cease. I seek not to privilege my own sentiments over the neighbor's, but to subject both to the arithmetic of fact.

  Two objections arise, which I meet before they are sharpened by my opponents.

  First, the case of visibility. Suppose the distress is triggered not by the act's consequences, but by the sight of it. Is this pain real? It is. But does it justify prohibition? I say no; it justifies concealment. If the mischief lies in the eye of the beholder, the law should regulate the public space, not the private room. To ban the act because it offends the sight is to grant the eye a veto over the hand. Let the agent conceal his conduct; if he does so, the pain of visibility vanishes without the evil of punishment. The principle is clear: the law targets the harm, not the offense. If the harm is averted by privacy, the law must stop at the threshold of the private door.

  Second, the case of baseness. Suppose the neighbor feels revulsion not from factual error, but from a sincere judgment that the practice is base. If this pain counts, any majority may veto any reform by feeling strongly enough. If it does not count, do I not assume what is in dispute? I answer thus: a judgment of baseness that identifies no assignable harm is a preference, not a mischief. It belongs to the moral sanction, not the legal. To legislate upon mere taste is tyranny. The legislator secures the conditions for happiness; he does not dictate its shape. If the practice is truly base, the moral sanction will suffice without the gallows.

  There remains the objection of the divines: that the people's sense of the sacredness of their morals is a public fund, a restraint upon which all law depends. To strike from the ledger pains based on correctable error is, they say, to saw off the branch we sit on. They argue we buy present relief at the cost of general indiscipline.

  I deny the premise. A fund of restraint built upon error is not a fund; it is a debt. When the error is inevitably exposed, the restraint collapses entirely, taking with it the respect for law itself. A morality aligned with utility—where men obey because they see the harm prevented, not because they fear the taboo—is a stronger cord than one woven from lies. We do not deplete the fund by correcting it; we solidify it. To preserve the branch, we must prune the rot.

  Let the legislator strike out the pain of error. Let the opponents of repeal be left with nothing to weigh. If there is no mischief, there is no crime.
