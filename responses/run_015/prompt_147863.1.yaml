      *   *Mara on Fission/Uncertainty:* This is the "Incoherence Problem." Saunders' "Subjective Uncertainty" (SU) vs. "Objective Determinism." If I know I split, am I uncertain? Vaidman says yes (ignorance of *which* copy I am *after* split but *before* observation). Lewis says no. *Verdict:* Mara highlights a genuine tension, but the "caring measure" approach (Greaves) bypasses the need for subjective uncertainty. Leo is right that decision theory can work with caring measures rather than uncertainty.
