      *   **Address the Philosophical Commitments:**
          1.  *The Lucas Critique & Structuralism:* Why macro *needs* microfoundations (realist claim about stability).
          2.  *Instrumentalism in Practice:* How they are actually used (forecasting vs. policy simulation).
          3.  *The Nature of the System:* Reflexive (human) vs. Non-reflexive (physical).
      *   **Address the "Double Standard":** Is it incoherent?
          *   Argument for Coherence: Different objects of study require different tools. Humans optimize (theoretically); molecules don't.
          *   Argument for Incoherence: DSGE assumptions are *too* false even for instrumentalism (e.g., representative agent ignores distribution).
      *   **Climate/Policy Intersection:** Why climate demands realism (tipping points, irreversibility) vs. Macro's focus on equilibrium adjustments.
      *   **Conclusion:** It's not pure incoherence, but a pragmatic hybrid that often masks its own limitations.

  5.  **Refining the Content (Self-Correction during drafting):**

