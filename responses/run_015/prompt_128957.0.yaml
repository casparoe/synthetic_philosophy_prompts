      *   **Side A (Macroeconomics):** Uses DSGE models (Dynamic Stochastic General Equilibrium). Features: Representative agent, rational expectations, market clearing (unless frictions added). Premises known to be false. Justification: Friedman's "as-if" instrumentalism (predictive power matters, not realism).
      *   **Side B (Climate/Pandemic Risk):** Demands mechanistic realism. Rejects simplifications that don't map to actual processes.
      *   **The Question:** What philosophical commitments underlie macro-modeling? Is it instrumentalist or realist? Is the institution incoherent, or is there a principled reason for different epistemic rules?

  2.  **Initial Assessment & Fact-Checking:**

      *   *DSGE Usage:* It's true DSGE models are central to modern macro, *but* their dominance has waned post-2008. Central banks now use a mix (DSGE, VARs, semi-structural models, agent-based models). The user's premise is slightly dated but still broadly captures the "core structural model" vibe.
      *   *Friedman's F-Twist:* Yes, Milton Friedman's 1953 essay "The Methodology of Positive Economics" is the classic defense of unrealistic assumptions if predictions hold.
      *   *Climate/Pandemic Modeling:* Climate models (IAMs, physical climate models) are indeed built on physical laws (thermodynamics, fluid dynamics) rather than optimization axioms. Pandemic models (SIR, etc.) are based on transmission mechanics.
      *   *The Tension:* The user identifies a genuine tension between *axiomatic deduction* (macro) and *mechanistic simulation* (climate/epi).

  3.  **Philosophical Analysis (The "Why"):**

      *   *Instrumentalism vs. Realism:*
          *   Macro (DSGE): Often claims to be structural (Lucas Critique). If policy changes, parameters shouldn't change. This implies a *realist* claim about deep preferences and technology. However, in practice, they are calibrated/estimated to fit moments, leaning instrumentalist.
          *   Climate: Physical laws are treated as realist truths. You can't assume "as-if" gravity.
      *   *Lucas Critique:* This is the key bridge. Macro models *must* be structural to evaluate policy changes. Climate models aren't evaluating the "policy preferences" of CO2; they are simulating physical responses.
      *   *Reflexivity:* Economics studies a system where the subjects react to the model/policy. Physics/Climate studies a system indifferent to the model. This requires different epistemic approaches.

  4.  **Drafting the Argument Structure:**

