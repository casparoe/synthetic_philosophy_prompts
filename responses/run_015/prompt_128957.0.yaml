answer: |-
  This is a incisive observation that cuts to the heart of the philosophy of economics. You have identified a tension that keeps philosophers of science and heterodox economists up at night. The discrepancy you note isn't just bureaucratic inertia; it reveals a deep, often unacknowledged, split in the epistemic strategy of central banking.

  To answer your question directly: Central banking practice is not philosophically coherent in a strict sense. It operates on a **pragmatic hybrid** that claims **structural realism** when defending policy (to satisfy the Lucas Critique) but retreats to **instrumentalism** when the models fail to forecast (to satisfy Friedman).

  Here is a breakdown of the philosophical commitments at play, why the "double standard" exists, and whether it is defensible.

  ### 1. The Macro Commitment: Structuralism Masquerading as Instrumentalism

  You mention Friedman's "as-if" methodology, but that is actually only half the story for modern central banks. If they were pure Friedmanites, they wouldn't care about microfoundations. They could use Vector Autoregressions (VARs) or machine learning black boxes that forecast well but have no theoretical structure.

  However, the Fed and ECB cling to DSGE (Dynamic Stochastic General Equilibrium) models primarily because of the **Lucas Critique (1976)**.
  *   **The Commitment:** Robert Lucas argued that you cannot evaluate policy changes using historical correlations because agents' expectations change when policy changes. To model policy counterfactuals, you need "deep parameters" (preferences, technology, constraints) that remain invariant to policy.
  *   **The Realist Claim:** This presupposes a form of **entity realism**. It claims that "representative agents" and "intertemporal optimization" are not just useful fictions, but approximate the actual causal machinery of human decision-making well enough that the parameters won't break when interest rates change.
  *   **The Contradiction:** When these models fail to forecast recessions (as in 2008), central bankers revert to Friedman. They say, "The model is a map, not the territory; the assumptions are simplifications." But when challenged on why they ignore wealth distribution (a feature erased by the representative agent), they say, "The microfoundations require aggregation."

  **Verdict:** Macro-modeling presupposes that **causal structure is found in optimization axioms**, not in empirical regularities. It is a rationalist commitment, not an empiricist one.

  ### 2. The Climate/Pandemic Commitment: Mechanistic Realism

  When central banks model climate risk (often using Integrated Assessment Models or physical climate models) or pandemic spread (SIR models), the epistemic rules change.
  *   **The Commitment:** Here, the demand is for **mechanistic fidelity**. You cannot assume a virus spreads "as-if" it optimizes utility. You must model the transmission vector. You cannot assume carbon absorbs heat "as-if" it were a friction; you must model the radiative forcing.
  *   **Why the Shift?** These systems are **non-reflexive**. The carbon molecule does not change its behavior because the ECB published a paper on carbon pricing. The virus does not form rational expectations about lockdowns.
  *   **The Consequence:** Because the objects of study are indifferent to the model, the model must map faithfully to the physical mechanism to be predictive. Simplifications are rejected if they violate physical laws, whereas in macro, simplifications are accepted if they violate "behavioral laws" (because those laws are assumed, not observed).

  ### 3. Is the Institution Incoherent?

  There is a principled reason for the different rules, but central banks often obscure it, leading to the incoherence you detect.

  **The Principled Defense: Reflexivity**
  The difference is **reflexivity** (a concept popularized by George Soros, but rooted in social theory).
  *   **Economics:** The system is reflexive. The model influences the reality. If the Fed models inflation as stable, and acts on it, inflation *becomes* stable (via expectations). Therefore, the model must be built on *intentions* (optimization), even if those intentions are modeled poorly. A purely mechanistic model of human behavior fails because humans learn.
  *   **Climate:** The system is non-reflexive. The atmosphere does not learn. Therefore, a mechanistic model is superior to an intentional one.

  From this view, the "double standard" is actually an adaptation to the ontology of the subject matter. Humans act (requiring axiomatic models of action); molecules react (requiring mechanistic models of physics).

  **The Incoherence Charge**
  However, the incoherence arises in **how these models are used for policy**.
  1.  **False Precision:** Central banks treat the "deep parameters" of DSGE models (like the intertemporal elasticity of substitution) as if they are measured physical constants, when they are essentially calibrated guesses. They demand mechanistic realism from climate models (rightly) but grant axiomatic immunity to macro models (questionably).
  2.  **The "Friction" Hack:** As you noted, macro models start with efficient markets and "bolt on" frictions. Climate models start with physical laws and add complexity. This means macro models are biased toward equilibrium unless proven otherwise, while climate models are biased toward dynamics. When applying climate risk to macro models, this creates a category error. You are trying to map a non-equilibrium physical process onto an equilibrium economic framework.
  3.  **Policy Evaluation:** When the ECB evaluates climate stress tests, they often force banks to use macro-economic scenarios derived from DSGE models to estimate the *economic impact* of the climate shock. This subordinates the mechanistic realism of the climate shock to the instrumentalist assumptions of the economic response.

  ### 4. What Philosophical Commitment Actually Prevails?

  The practice presupposes **Pragmatic Structuralism**.

  It is not pure instrumentalism, because they insist the structure matters for policy (Lucas). It is not pure realism, because they admit the agents aren't real (Friedman).

  The commitment is this: **Stability of parameters is more important than truth of assumptions.**
  Central banks prioritize models where the parameters *appear* stable across regimes, even if the micro-behavior generating them is false. They accept the "as-if" rationality because it provides a closed system where policy can be mathematically optimized. Climate models do not offer a closed system for policy optimization; they offer boundary conditions.

  ### Summary

  Is there a principled reason for the different epistemic rules? **Yes.** It is the difference between modeling a reflexive system (economy) and a non-reflexive system (climate). Reflexive systems require models of *intent*, which forces axiomatic/optimization approaches. Non-reflexive systems require models of *mechanism*, which forces physicalist approaches.

  Is the institution philosophically incoherent? **Also Yes.** They often conflate the two. They treat the axiomatic parameters of the economic model with the same confidence as the physical parameters of the climate model. They demand climate science be "real" while treating the economic transmission of that climate risk as "as-if."

  The result is a framework that is robust enough to manage normal business cycles but structurally blind to tail risks (like climate tipping points or pandemics) because those risks violate the "stable equilibrium" axiom that the macro-modeling practice is philosophically committed to preserving. They aren't using different rules because they are hypocritical; they are using different rules because they are trying to solve two different types of problems, but they pretend the solutions are compatible when they often are not.
