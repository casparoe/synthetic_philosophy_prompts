prompt: |-
  I've been going through Lewis's work on chance and probablity for a seminar, and I keep landing on the conclusion that the Principal Principle is basically a tautology, which I suspect means I'm just missing the point. As far as I can tell, the PP says that your subjective probability (your 'credence') in some proposition A should equal the objective chance of A. But hold on — credence is a probability, and chance is a probability, so isn't the PP just saying 'your probability should equal the probability'? That's either trivially true or just baked into what it means to have a probability in the first place. I don't see where the actual content is.

  And I don't even get why Lewis needs this whole apparatus of 'admissible' vs. 'inadmissible' evidence. If the principle is just 'set your credence to the chance,' then the answer to 'what should I believe?' is always just 'look up the chance and copy it,' and the admissibility stuff looks like a distracting technicality. I've also seen it mentioned that Lewis later replaced the PP with something called the 'New Principle,' but I don't even know what problem that was supposed to solve, so I'm pretty lost at this point. Can someone walk me through what the PP is actually doing that's non-trivial? I feel like I'm not getting the point at all.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User's Confusion:**
      *   **Core Misunderstanding:** The user thinks the Principal Principle (PP) is a tautology ("Probability = Probability"). They see credence and chance as just two labels for the same mathematical object, so equating them seems trivial.
      *   **Secondary Confusion:** They don't understand the role of "admissible evidence." If PP says "match chance," why does evidence matter?
      *   **Tertiary Confusion:** They mention the "New Principle" but don't know why it was needed.
      *   **Context:** They are reading David Lewis for a seminar. This means they need a philosophical explanation, not just a mathematical one. They need to understand the *metaphysical* and *epistemological* gap Lewis is trying to bridge.

  2.  **Deconstruct the Principal Principle (PP):**
      *   *Formula:* $C(A | XE) = x$.
          *   $C$: Credence (subjective degree of belief).
          *   $A$: Proposition (event).
          *   $X$: Proposition that the chance of $A$ is $x$.
          *   $E$: Admissible evidence.
      *   *The Gap:* Credence is *epistemic* (about belief/knowledge). Chance is *metaphysical* (about the world's propensity/frequency). They are conceptually distinct. Equating them is a substantive normative claim, not a definition.
      *   *The Tautology Trap:* The user thinks "probability" is univocal. It's not. Bayesian probability (credence) $\neq$ Objective Chance (propensity/frequency). PP connects the two realms.

  3.  **Address the "Tautology" Objection:**
      *   Analogy time. "Your height should equal the height of the doorframe." Height is length, doorframe height is length. Is it a tautology? No, because *your* height and the *door's* height are independent facts.
      *   Better Analogy: "Your belief about the coin should match the coin's bias." Belief is in the head; bias is in the coin. Connecting them requires a principle.
      *   Key Point: PP is a *bridge principle*. It tells rational agents how to align their minds with the world's objective features. Without PP, Humean Supervenience (Lewis's view) leaves chance "orphaned" from belief.

  4.  **Address "Admissible Evidence":**
      *   Why is it needed? Because sometimes you know *more* than just the chance.
      *   Example: Crystal ball. If the chance of Heads is 0.5, but your crystal ball (inadmissible evidence) says Heads, your credence should be 1, not 0.5.
      *   Example: Future outcomes (Humean supervenience). If chance supervenes on the total history of outcomes, knowing the future outcome tells you the chance. But you can't use the future to set present credence (causality/temporal direction).
      *   Definition: Admissible evidence is evidence that influences credence *only* by influencing belief about the chances. It doesn't give "direct" info about the outcome.

  5.  **Address the "New Principle" (NP):**
      *   Why replace PP? The problem of "undermining futures."
      *   Humean Supervenience context: Chances are determined by the pattern of events in the whole history of the world.
      *   Scenario: Current chance of $A$ is $x$. But if $A$ happens, it might change the overall pattern such that the *current* chance would have been different.
      *   Conflict: PP says $C(A|Ch(A)=x) = x$. But if $A$ occurring undermines the truth of $Ch(A)=x$, then $A$ and $Ch(A)=x$ are incompatible. Conditional probability on an impossibility is undefined.
      *   NP fixes this by conditioning on the *history* rather than the chance proposition directly, or by adjusting the equation to account for the possibility that the chance hypothesis is false. (Keep this high-level, don't get bogged down in the math unless necessary).

  6.  **Structure the Response:**
