      *   *Addressing the Conflict:* The "Trade-off" fallacy. It's not A vs. B. It's about integrating the duties. The duty to the commons *includes* ensuring the commons remains a public good, not a weapon. If the tool becomes a weapon, the commons is degraded. Therefore, protecting applicants *is* protecting the commons.
