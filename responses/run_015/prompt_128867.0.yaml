answer: |-
  This is a sharp question, and I will give you the honest assessment you requested: **You are identifying a real tension, but you risk mischaracterizing it if you frame it as a comparison of "testimony" versus "intuition."**

  If your chapter argues that Sidgwick applies a "double standard" regarding the *weight of testimony*, you are forcing a parallel that isn't quite there, because Sidgwick does not treat moral intuitions as testimony. However, if you frame the tension as one regarding **epistemic security and the conditions for belief in the face of desire**, then you have found a genuine and fruitful vein for Victorian epistemic authority.

  Here is the breakdown of where your argument holds water and where it risks category error.

  ### 1. The Category Error: Intuition is Not Testimony
  The potential flaw in your argument lies here: In *The Methods of Ethics*, Sidgwick does not treat moral intuitions as "first-person reports" analogous to "third-person reports" of telepathy.

  *   **In Ethics:** Sidgwick is a rational intuitionist. For him, a moral axiom (like Justice or Prudence) is not valid because he "feels" it or because he testifies to it. It is valid because it is **self-evident to reason** when clearly understood. The "evidential bar" here is logical consistency, clarity, and universalizability. It is *a priori*.
  *   **In Psychical Research (SPR):** This is strictly *a posteriori*. It relies on empirical observation, witness credibility, and the elimination of fraud.

  **The Critique:** If you argue Sidgwick is inconsistent because he trusts his own moral mind more than a witness's eyes, you are ignoring that Sidgwick believes the former accesses necessary truths and the latter accesses contingent facts. He isn't weighing the *same kind of evidence* differently; he is weighing *different kinds of evidence* according to their respective domains.

  ### 2. Where the Tension Is Real: The "Dualism of Practical Reason"
  The genuine tension—and where your chapter should focus—is not about testimony, but about **the relationship between philosophical hope and evidential rigor.**

  Sidgwick famously concluded *The Methods of Ethics* with the "Dualism of Practical Reason": Reason tells us to be virtuous, but Reason also tells us to pursue our own happiness. In a godless universe, these often conflict. Sidgwick *needed* there to be a divine sanction (an afterlife where virtue and happiness align) to make morality fully rational.

  *   **The Motivation:** Sidgwick turned to psychical research largely because he hoped it would provide empirical evidence for survival after death, thereby solving the Dualism.
  *   **The Asymmetry:** Here is the real epistemic friction.
      *   In **Ethics**, he demands absolute certainty (self-evidence). If an intuition is cloudy, he rejects it.
      *   In **SPR**, despite his personal *desire* for the phenomena to be true, he maintained a rigorous, almost destructive skepticism. He famously disappointed spiritualists because he refused to accept anecdotal evidence, demanding strict protocols.

  **Is there a double standard?**
  Actually, it's the opposite of what you might suspect. Sidgwick was arguably *harder* on the psychical evidence that he *wanted* to be true than on the moral axioms he *needed* to be true.
  *   He accepted the moral axioms because they withstood rational scrutiny.
  *   He largely *rejected* the psychical evidence (or remained agnostic) because it *failed* empirical scrutiny, even though accepting it would have saved his ethical system from collapse.

  **Verdict:** There is no "hidden double standard" where he lets himself off the hook in one area. If anything, the tension is tragic: he held the empirical bar so high that he denied himself the religious consolation that would have resolved his ethical dilemmas.

  ### 3. Epistemic Authority in the Victorian Context
  For your chapter on epistemic authority, the more productive angle is **the authority of the Individual Mind vs. the Authority of Aggregated Data.**

  *   **Ethical Authority:** Resides in the competent individual reasoner. If you and I both reflect clearly, we should see the truth of the axiom. It is internal and democratic (in a rational sense).
  *   **SPR Authority:** Resides in the collective sifting of testimony. The individual witness is presumed unreliable (liable to hallucination, fraud, error). Authority is external and bureaucratic (committees, cross-examination).

  **The Victorian Tension:** This reflects a broader Victorian crisis. The "inner light" of conscience (Romantic/Intuitionist) was coming into conflict with the "external fact" of Science (Empiricist). Sidgwick straddles this. He tries to save the authority of the moral mind (Ethics) while submitting the metaphysical mind to the rigors of scientific naturalism (SPR).

  ### 4. Recommendation for Your Argument
  Do not argue that he weighs "testimony" inconsistently. Instead, argue that **Sidgwick compartmentalizes epistemic authority to protect the integrity of both domains.**

  *   **Thesis refinement:** Sidgwick does not apply a double standard of *rigor*, but he does apply a **dualistic epistemology**. He grants the rational self authority over moral truth (where evidence is internal) but strips the sensory self of authority over metaphysical truth (where evidence must be externalized and corroborated).
  *   **The "Forced" Parallel:** Avoid saying "He trusts his intuition more than witness testimony."
  *   **The "Honest" Parallel:** Say "He trusts Rational Clarity more than Empirical Probability, even when Empirical Probability offers the only solution to his Rational dilemmas."

  ### Summary
  You haven't invented the tension, but you need to be careful not to equate "intuition" with "first-person testimony."
  *   **If you claim:** "Sidgwick is hypocritical because he trusts his gut on morals but demands proof for ghosts." -> **This is weak.** (Moral intuition isn't just a gut feeling for Sidgwick).
  *   **If you claim:** "Sidgwick creates a hierarchy of knowledge where Rational Certainty trumps Empirical Probability, leading to a tragic disconnect between his ethics (which need God) and his research (which can't find Him)." -> **This is strong, textually supported, and fits the Victorian epistemic crisis.**

  Sidgwick is a fascinating case study precisely because he was *too* honest to lower the evidential bar for psychical research, even when his own philosophical system cried out for him to do so. That is the real story of his epistemic authority.
