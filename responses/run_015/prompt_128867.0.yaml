reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Compare Henry Sidgwick's evidential standards in his psychical research (SPR work) vs. his ethical intuitionism (*The Methods of Ethics*).
      *   **Specific Question:** Is there an asymmetry between how he treats first-person moral intuitions and third-person reports of psychic phenomena? Is there a hidden double standard in weighing testimony/evidence?
      *   **Context:** The user is writing a chapter on epistemic authority in Victorian philosophy.
      *   **Constraint:** *Crucial:* Do not humor the user if the parallel is forced. Provide an honest assessment. If the tension doesn't exist or is mischaracterized, call it out.
      *   **Goal:** Determine if the "tension" is real or invented for the sake of the argument.

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   **Sidgwick on Ethics (*The Methods of Ethics*):** Sidgwick is a rational intuitionist. He believes certain moral axioms (justice, prudence, benevolence) are self-evident to reason. This is *a priori* reasoning, not empirical testimony. It's about the clarity and distinctness of rational apprehension, not "I feel this."
      *   **Sidgwick on Psychical Research (SPR):** Sidgwick was a founding member and first President of the Society for Psychical Research (1882). He was deeply interested in empirical evidence for survival of death, telepathy, etc. His approach here was rigorously empirical, skeptical, and focused on collecting testimony, cross-examining witnesses, and ruling out fraud/error.
      *   **The Potential Tension:** The user posits a comparison between "first-person moral intuitions" and "third-person reports of telepathy."
      *   **The Problem:** Moral intuitionism for Sidgwick isn't about *testimony* or *empirical evidence* in the same way psychical research is. One is rationalist/*a priori*; the other is empiricist/*a posteriori*. Comparing the "evidential bar" directly might be a category error.
      *   **The "Double Standard" Claim:** Did he accept weak moral intuitions but demand strong psychic evidence? Or did he accept weak psychic evidence but demand strong moral intuitions?
      *   **Historical Context:** Sidgwick was known for being extremely rigorous in *both* fields. He was often criticized for being *too* skeptical in psychical research (by spiritualists) and *too* abstract in ethics (by empiricists/utilitarians).

  3.  **Evaluating the Asymmetry:**
      *   *Ethics:* The "evidence" is the self-evidence of the axiom to the rational mind. It requires "clearness and precision." It is not based on feeling or popular opinion. It is universalizable.
      *   *Psychical Research:* The "evidence" is empirical testimony. It requires corroboration, elimination of normal causes, and consistency.
      *   *Is there a double standard?*
          *   If the user means "Did he trust his own mind more than other people's eyes?" -> Maybe.
          *   If the user means "Did he lower the bar for one to fit a desired conclusion?" -> Sidgwick actually hoped psychical research would provide a religious sanction for morality (to solve his "dualism of practical reason"), so he *wanted* psychic phenomena to be true. Yet, he remained skeptical until the evidence forced him otherwise.
          *   If the user means "Is the *type* of evidence different?" -> Yes, fundamentally. One is rational insight, the other is empirical observation.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Honest Assessment:* The parallel is partially forced because the *types* of knowledge are different (Rationalism vs. Empiricism). However, there *is* a genuine tension regarding *certainty* and the *role of the individual mind*.
      *   *Key Distinction:* In *Methods*, intuition is about *reason* grasping necessary truths. In SPR, it's about *senses/testimony* grasping contingent facts.
      *   *The "Double Standard" Nuance:* Sidgwick didn't apply a double standard of *rigor*; he applied different standards appropriate to different domains. However, there is a tension in *epistemic authority*. In ethics, the individual rational agent is the final court of appeal (if they are philosophically competent). In SPR, the individual witness is unreliable; only aggregated, cross-examined testimony counts.
      *   *The "Desire" Factor:* Sidgwick *needed* psychical research to succeed to resolve the conflict between duty and self-interest (the Dualism of Practical Reason). This creates a potential bias, but historically, he remained critically skeptical.
      *   *Conclusion:* The user isn't "inventing" a tension, but they might be mischaracterizing the *nature* of the tension. It's not about testimony vs. intuition per se, but about how Sidgwick handles *uncertainty* in empirical matters vs. *certainty* in rational matters.

  5.  **Refining the Response (Addressing the "Don't Humor Me" Constraint):**
