      *   *The Real Tension:* It lies in the *Dualism of Practical Reason*. Sidgwick hoped SPR would provide the theological/empirical backing to make morality rational (via sanctions). He held the bar high for SPR *because* the stakes were so high for his ethical system.
      *   *Epistemic Authority:* In ethics, authority lies in the rational structure. In SPR, authority lies in the reliability of the witness. Sidgwick treats the "rational self" as more authoritative than the "sensory self."

  6.  **Structuring the Response:**
