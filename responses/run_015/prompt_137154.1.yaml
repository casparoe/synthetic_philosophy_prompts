      *   Check the "Order by Severity" instruction.
      *   Check the "What would have to give" instruction.
      *   Check the "Single Revision" instruction.

      *Self-Correction on Severity:* The Depression case (7b) is the most dangerous because it looks like a direct violation of (1) and (3). The Dog case (4) is easier to fix by redefining "deliberation." The Blame case (6) is compatible. The Indifferent case (7a) is the anchor of the view.
      *Wait, one more check:* (5) Global Defect. If a set is globally defective, does it contain *reasons*? If I have a reason not to be moved by any element in my set, where does that reason come from? If it comes from the *defectiveness*, is defectiveness an internal or external property? If internal, how do I detect it without an external standard? This links back to the Depression case.
