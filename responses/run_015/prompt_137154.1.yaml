prompt: |-
  I am circulating a paper to my department's work-in-progress session next month and, before I do, I would like an audit of the position I have ended up holding about reasons. I set out to write a fairly ordinary defense of internalism and have finished with a package of commitments that I cannot get to sit still. Several colleagues have told me the package is inconsistent, but they have not pointed at the same joint, which makes me suspect at least some of the accusations are wrong. I would like to know which are.

  Here is the set, stated as flatly as I can manage.

  1. Internalism in the route formulation: a consideration counts as a reason for an agent to act only if she could arrive at the conclusion that she should so act by a sound deliberative route from her subjective motivational set as it actually is. I reject the externalist claim that there are considerations that are reasons for an agent simply in virtue of her being a rational agent, whatever she happens to care about.

  2. Route-possibilism: the route in (1) need not be one this agent could in fact follow. It is enough that a sound route exists from her set as it stands. This is what lets me say that the host who has no way of discovering that her guest is allergic still has a reason not to serve the dish, and that the man who cannot read the label still has a reason not to drink what is in front of him.

  3. No ex nihilo: sound deliberation may correct factual error, add true belief, trace means-end chains, and expose elements of the set to rational pressure from other elements. It may not install a wholly new end that nothing already in the set gestures at. Without this constraint I do not see what distinguishes internalism from a disguised externalism.

  4. Reasons for non-deliberators: I want to say that a two-year-old and a dog can have reasons, and not merely that their caretakers have reasons concerning them. This is a verdict I am unwilling to give up; it is doing real work in my other writing.

  5. Global defect: I hold that some motivational sets are defective as wholes, not merely element by element. That is, for some agents, every element of the set is such that the agent has reason not to be moved by it, and there is an intelligible critical judgement to that effect which is not just a report of what the critic happens to care about.

  6. An access condition on blame: an agent is open to blame for failing to act only if she could have discerned, by deliberation of the kind available to her, that she had reason so to act. I hold this because I think blame without any such access is unfair, and I do not want to give it up.

  7. Two case verdicts. The comfortable indifferent, who is fully informed, free of reasoning error, and simply unmoved by the suffering of others, has no reason to aid them. But the severely depressed patient does have a reason to accept treatment even when she sincerely and lucidly reports that nothing matters to her any more.

  8. A methodological constraint: the point of tying reasons to the motivational set is that reasons should be able to figure in the explanation of action. A consideration that could not figure in the explanation of any action by anyone, even in principle, is not a reason at all. This is why I became an internalist rather than a moral realist of the externalist kind, and I would not treat dropping it as a free move.

  What I want from you is the audit, not a survey of the literature. Which pairs of these are genuinely in tension, and which only look as though they are? Order the real tensions by severity, and for each say precisely what would have to give: which commitment would have to be weakened, restated, or qualified, and what the restatement would cost me elsewhere in the set. Where an apparent tension dissolves, tell me what generates the appearance. If one revision cleans up more than one joint at once, say so, and say whether it is a revision an internalist could accept or only a way of leaving internalism behind. Assume I would rather pay almost any cost inside the set than be told simply to abandon internalism, but do not spare me if the cost accounting really does point there.
reasoning: |-
  Here's a thinking process that leads to the audit:

  1.  **Analyze the Request:**
      *   **Task:** Audit a specific set of 8 philosophical commitments regarding reasons for action (Internalism).
      *   **Goal:** Identify genuine tensions/inconsistencies vs. apparent tensions. Order real tensions by severity. Specify what must give (weakened/restated) and the cost. Identify if a single revision fixes multiple issues.
      *   **Constraint:** Do not survey literature. Focus on the internal logic of the provided set.
      *   **User Preference:** Willing to pay costs *inside* the set rather than abandon Internalism, but needs honesty if the cost accounting points to abandonment.
      *   **Tone:** Professional, analytical, direct (like a colleague reviewing a draft).

  2.  **Analyze the Commitments:**
      *   (1) **Internalism (Route Formulation):** Reason $\rightarrow$ Sound deliberative route from Subjective Motivational Set (SMS). Rejects Externalism.
      *   (2) **Route-Possibilism:** Route need not be *actually* followable by the agent (counterfactual sound route suffices). Solves ignorance cases (allergy, label).
      *   (3) **No *ex nihilo*:** Deliberation cannot install wholly new ends without gesturing from the existing SMS. Prevents disguised externalism.
      *   (4) **Reasons for Non-Deliberators:** 2-year-olds and dogs have reasons (not just regarding them).
      *   (5) **Global Defect:** Some SMS are defective as wholes (every element is reason-defeating). Intelligible critical judgment possible.
      *   (6) **Access Condition on Blame:** Blame requires access to the reason via available deliberation.
      *   (7) **Two Case Verdicts:** (a) Comfortable Indifferent (informed, no error, unmoved) $\rightarrow$ No reason to aid. (b) Severely Depressed (nothing matters) $\rightarrow$ Has reason to accept treatment.
      *   (8) **Methodological Constraint (Explanation):** Reasons must be able to figure in the explanation of action (explanatory role).

  3.  **Initial Scan for Tensions (Brainstorming):**
      *   (1) + (4): How do dogs/2-year-olds have "sound deliberative routes"? They don't deliberate.
      *   (2) + (6): (2) says reasons exist even if the agent *couldn't* follow the route (counterfactual ideal). (6) says blame requires the agent *could* discern the reason via *available* deliberation. This looks like a gap between *having a reason* and *being blameworthy*. Is that a tension? Maybe not inconsistent, but needs careful handling.
      *   (3) + (5): If an SMS is globally defective (5), does that mean there is *no* sound route from it? If every element is reason-defeating, can a sound route start there? (3) says no new ends *ex nihilo*. If the set is globally defective, where does the reason to change come from?
      *   (5) + (7a): Comfortable Indifferent has a defective set (morally)? User says "No reason to aid." This fits Internalism. But (5) says some sets are defective *as wholes*. Is the Indifferent's set globally defective? If so, does he have reasons at all?
      *   (7b) + (1)/(3): Depressed patient says "nothing matters." SMS is empty or inert. Where does the reason to seek treatment come from? If "nothing matters," there's no hook for deliberation (violates 3?). If we say there *is* a reason, is that Externalism creeping in?
      *   (4) + (8): Dogs/children have reasons. Can these reasons figure in the *explanation of action*? Yes, presumably. But do they have an SMS? Yes. Do they have deliberative routes? No. This clashes with (1).
      *   (2) + (8): (2) allows reasons based on routes the agent *cannot* follow. (8) says reasons must explain action. If the agent cannot follow the route, can the reason explain their action? Maybe not *their* action, but action *by anyone*? (8) says "by anyone, even in principle." This might save it.
      *   (6) + (2): (2) creates reasons the agent can't access. (6) restricts blame to accessible reasons. This is consistent (Reason $\neq$ Blame), but creates a gap.
      *   (7b) + (5): Depressed patient. Is this a case of Global Defect? If so, how do they have a reason to treat it if the set is defective?

  4.  **Deep Dive into Specific Clashes:**

      *   **Clash A: The Non-Deliberator Problem (1, 3, 4)**
          *   (1) requires a "sound deliberative route."
          *   (4) says dogs/kids have reasons.
          *   (3) constrains that route to the existing set.
          *   *Problem:* Dogs/kids don't deliberate. A "deliberative route" implies cognitive capacity they lack.
          *   *Resolution:* You need to broaden "deliberative route" to "counterfactual rational development" or attribute a proto-set. But (1) says "from her SMS *as it actually is*." A dog's SMS is instincts/drives. Can you deliberate from instincts?
          *   *Severity:* High. It strikes at the definition of the view.
          *   *Fix:* Weaken (1) or (4). If you keep (4), (1) must become "sound route of *rational development*" not necessarily *deliberation*. But this risks (8) (Explanation). If the dog can't deliberate, can the reason explain its action? Yes, instinctively.
          *   *Tension:* (1) vs (4).

      *   **Clash B: The Depression/Indifference Asymmetry (1, 3, 5, 7)**
          *   (7a) Comfortable Indifferent: Informed, no error, unmoved. Verdict: No reason. (Fits 1 & 3 strictly).
