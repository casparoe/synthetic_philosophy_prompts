  **Local Customs**
  The primary social taboo here is not vice, but dependence. Citizens are legally protected from relational vulnerability. Waiters are forbidden from holding fewer than three employers to prevent employer mastery over their livelihood. Spouses must file annual "Exit Plans" with the Ministry of Non-Arbitrariness to ensure neither party holds hostage power over the other. Tourists should note that landlords found to be excessively charming may be fined for creating emotional leverage. A friendly smile from a property owner is scrutinized as potential grooming for future arbitrary eviction. As local philosopher-in-residence Elara Venn notes, *"A benevolent master is still a master; a meddlesome democrat is merely a neighbor."*

  **Governance**
  A common FAQ among visitors is: "Who dominates the dominators?" This infinite regress was Fully Resolved by the Anticipatory Accountability Commission, which oversees the Bureau of Contestation. The Commission is itself overseen by a shadow commission whose members remain secret to prevent external lobbying. This ensures that power remains checked without requiring actual interruptions to state function. If you feel dominated, you may file a Form 88-B to register your contestation within the system.

  **When to Go**
  The premier event is Non-Domination Day (June 14). On this holiday, no citizen is permitted to engage in unstructured choice, as spontaneous action creates zones of arbitrary power where one might dominate oneself or others. Residents must execute only those actions planned and ratified the previous week. It is a quiet day, but deeply free. Tourists are advised to pre-file their sightseeing routes to avoid on-the-spot fines for arbitrary wandering.

  **Getting Around**
  Public transport is efficient but mandatory. Private vehicle ownership is permitted only if the route is pre-logged to prevent arbitrary movement. Taxis are available, but drivers are required to reject tips to prevent customer dominance.

  > **REALITY CHECK**
  > *"I tried to contest a veto on my sandwich purchase. They didn't stop the veto; they just logged my objection. Nothing ever gets **stopped** in this country, merely made contestable. I am free, yet I have no sandwich."* — **Hans G., Visiting Liberal (Berlin School)**
