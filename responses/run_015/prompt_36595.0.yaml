  > **Editor's Response:** While negative liberty enthusiasts often feel stifled, remember: at least no one here confuses the sheep's freedom with the wolf's opinion on fencing. Contestability ensures the wolf cannot eat you arbitrarily, even if he does eat you for reasoned purposes.

