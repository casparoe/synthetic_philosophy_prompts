answer: |-
  Here is a plan for your ninety-minute session, structured around your specific constraints and pedagogical goals.

  ### 1. Dependency Structure: The Order of Operations

  You must resist the temptation to present the formula first. The logic of the session must follow the logic of the justification.

  **The Sequence:**
  1.  **The Breakdown:** Establish a case where the Conditioning Reflex ($P_{new}(H) = P(H|E)$) is impossible because no $E$ receives probability 1.
  2.  **The Input:** Define the soft input not as a proposition, but as a shift in the probabilities of a **partition** $\{E_i\}$.
  3.  **The Bridge (Rigidity):** Introduce Rigidity *before* the formula. Define it as **Explanatory Mediation**.
  4.  **The Derivation:** Derive the summation formula from Rigidity + Total Probability.
  5.  **The Application:** Compute.

  **The Status of Rigidity:**
  You should introduce Rigidity ($P_{new}(H|E_i) = P_{old}(H|E_i)$) as a **property of causal/explanatory independence**, not merely as a constraint the agent imposes on herself.
  *   **Why:** If you present it as a self-imposed constraint, students will ask, "Why am I forced to do this?" If you present it as a mathematical residue, it feels post-hoc.
  *   **The Story:** The experience acts *directly* on the partition cells $\{E_i\}$ (e.g., sensory appearances). It affects the hypothesis $H$ (e.g., physical reality) *only via* its effect on $\{E_i\}$. Once the probability of $E_i$ is fixed by the experience, the experience has no *additional* leverage on $H$.
  *   **What breaks if swapped:** If you introduce the formula before Rigidity, Rigidity looks like a mysterious assumption required to make the math work. If you introduce Rigidity as a "constraint" before explaining the causal structure, it looks like dogmatism. The causal story justifies the constraint, which licenses the formula.

  ### 2. The Carrying Example

  **Judgement:** Keep the **"Coloured Object under Unreliable Light"** case. It is the standard for a reason: it isolates the variables cleanly. However, you must sharpen it to meet your criteria.

  **The Setup:**
  *   **Hypothesis ($H$):** The fabric is Silk ($S$) or Cotton ($C$).
  *   **Partition ($E$):** The fabric is Red ($R$) or Blue ($B$). (Note: $H$ and $E$ are distinct. This is crucial. If $H=E$, the problem collapses).
  *   **Prior:** $P(S|R)$ and $P(S|B)$ are known (linking color to material).
  *   **The Experience:** A glance in dim, flickering light.
  *   **The Input:** The experience does not yield "It is Red." It yields a new distribution: $P_{new}(R) = 0.8, P_{new}(B) = 0.2$.

  **Why this works:**
  1.  **Plausible Rigidity:** The lighting conditions affect your perception of color ($E$). They do not change the physical link between color and material ($P(S|R)$). The experience is "screened off" from $H$ by $E$.
  2.  **No Hard Proposition:** You must explicitly forbid students from formulating a proposition like "It looks red to me now" and conditioning on that.
      *   *Pedagogical Move:* Pre-empt this by stipulating that "It looks red" is not in the algebra, or that the agent is uncertain even about how it looks (a "seeming" that is itself probabilistic). Better: Stipulate that the agent is interested in the *objective color*, and the experience provides direct but uncertain access to that objective color.
  3.  **Iterability:** You can run a second glance.
      *   *Crucial Point:* Show that applying the shift $(0.5 \to 0.8)$ twice is **not** the same as applying $(0.5 \to 0.9)$. Jeffrey Conditioning is not idempotent. The second update takes the *posterior* of the first as its *prior*. If you apply the same *input shift* relative to the original prior, you get different results. This kills the intuition that "evidence accumulates linearly."

  **What the case must not contain:**
  *   Do not make $H$ a member of the partition $\{E_i\}$. If $H$ is "It is Red," then Rigidity implies $P_{new}(H) = P_{old}(H)$, which contradicts the input. $H$ must be distinct from the partition.
  *   Do not introduce utility or decision theory yet. Keep it purely epistemic.

  ### 3. The Misconception Map

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"Just condition on the most likely cell."** | During "The Breakdown." | Explicitly calculate the cost. If they condition on $R$, they ignore the 20% risk of $B$. Show how this violates the uncertainty of the experience. |
  | **"Rigidity means $P(H)$ doesn't change."** | During "The Bridge." | Emphasize: Rigidity fixes *conditional* probabilities $P(H|E_i)$, not *marginals* $P(H)$. The weighted sum changes the marginal. |
  | **"Rigidity means $P(E_i)$ doesn't change."** | During "The Derivation." | Remind them: The *point* of the update is that $P(E_i)$ *does* change. That is the input. Rigidity is about what happens *given* $E_i$. |
  | **"The partition is arbitrary."** | During "The Application." | Show that choosing a coarse vs. fine partition yields different results. Rigidity is relative to the partition chosen to represent the experience. |
  | **"Double counting evidence."** | During "Iterability." | Demonstrate that updating on the same soft input twice inflates confidence improperly. The second update must use the *new* priors. |

  ### 4. The Wrinkle: Foreseen Updates & Negative Value of Information

  **Verdict:** **Drop it for this session.**

  **Reasoning:**
  This wrinkle (where an agent declines free evidence because the experience undermines the rigidity condition itself) is a second-order problem concerning the **adequacy of the input description**, not the **validity of the update rule**.
  *   **Pedagogical Risk:** In a 90-minute introduction, your goal is to get them to trust the machinery enough to use it. Introducing a case where the machinery licenses *ignoring* evidence creates paralysis. It suggests the rule is unstable.
  *   **Conceptual Placement:** This belongs in a later session on "Defeaters," "Holism," or "Decision-Theoretic Foundations." It requires students to already be comfortable with the rule before they break it.
  *   **If you must include it:** Do not teach it. Mention it in the final 2 minutes as "A known complication for next week: what if the experience tells you that you shouldn't have held the partition rigid?" Do not work the example.

  ### 5. Scope and Assessment

  **What to Refuse to Explain:**
  1.  **Axiomatic Derivations:** Do not derive Jeffrey Conditioning from distance minimization (e.g., minimizing Kullback-Leibler divergence). It is mathematically elegant but obscures the epistemic story of Rigidity.
  2.  **Continuous Partitions:** Stick to finite partitions. Integrals add cognitive load without adding conceptual clarity for the first pass.
  3.  **History:** Do not discuss Jeffrey vs. Carnap or the history of *The Logic of Decision*.

  **The Final Mastery Task (10 Minutes):**
  Do not ask them to state the formula. Do not give them the partition.

  **The Task:**
  > "An agent has a prior over three mutually exclusive locations of a target: $L_1, L_2, L_3$. She receives a radar signal. The signal does not confirm any location with certainty. However, she is certain that the signal is *only* about the location, and does not provide independent information about whether the target is moving ($M$) or stationary ($S$).
  >
  > 1.  Identify the partition on which Rigidity must hold.
  > 2.  Write the expression for $P_{new}(M)$ in terms of the old conditionals and the new partition probabilities.
  > 3.  Explain why she cannot simply condition on 'The radar indicated $L_1$'."

  **Success Criteria:**
  *   They identify $\{L_1, L_2, L_3\}$ as the partition (not $\{M, S\}$).
  *   They write $P_{new}(M) = \sum P_{old}(M|L_i)P_{new}(L_i)$.
  *   They articulate that the radar input does not make any $L_i$ certain (blocking standard conditioning) and that the link between Location and Motion is screened off (justifying Rigidity).

  ### Session Timeline (90 Minutes)

  *   **00–15: The Breakdown.** Present the Fabric case. Show why $P_{new}(H) = P(H|E)$ fails (no $E$ is certain). Elicit the intuition that belief should still change.
  *   **15–30: The Input & Partition.** Formalize the input as a shift on $\{E_i\}$. Distinguish $H$ from $\{E_i\}$.
  *   **30–50: Rigidity & Derivation.** The core lecture. Argue for Explanatory Mediation. Define Rigidity. Derive the sum rule on the board.
  *   **50–70: Guided Practice.** Walk through the Fabric numbers. Then, run a second "glance" (Iteration) to show non-idempotence.
  *   **70–80: Misconception Check.** Quick-fire questions targeting the map above.
  *   **80–90: Assessment.** The Final Mastery Task (written, collected).

  This plan prioritizes the *justification* of the rule over the *history* or *limits* of the rule, ensuring they leave with a working tool they understand structurally.
