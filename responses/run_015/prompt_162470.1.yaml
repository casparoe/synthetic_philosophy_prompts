prompt: |-
  I am teaching one ninety-minute session of a graduate seminar in formal epistemology next week, and I want a plan for the session rather than an exposition.

  The students have unconditional and conditional credences, Bayes' theorem, and the reflex of writing P_new(H) = P(H|E) whenever something happens to them. None of them has seen probability kinematics. The update I want them to be able to perform and to justify by the end is the one that replaces conditioning when the experience does not deliver any proposition with certainty: on a partition whose members the experience leaves rigid, P_new(H) is the sum over the cells of P(H|E_i) weighted by P_new(E_i).

  Three things I want from you. First, the dependency structure: the order in which the pieces have to arrive, and what breaks if two of them are swapped — in particular whether rigidity should be introduced as a constraint the agent imposes on her own update, as a property of causal or explanatory independence between the experience and the partition, or as whatever is left over once you have said what the experience does. Second, the carrying example. I had intended the standard case of examining a coloured object under unreliable light; I want your judgement on whether that is the right case to build the whole session around, and on what a case must contain and must not contain here. My own crude list is that it must make rigidity on the chosen partition genuinely plausible, that it must not contain a hard proposition the student could condition on instead and thereby recover the reflex I am trying to break, and that it must be iterable, so that the later part of the session can show that applying the same soft input twice is not the same as applying it once. Third, the misconception map: which wrong things they will think or construct, and the point in the sequence at which each should be headed off.

  There is a further wrinkle I cannot place, and I would like you either to place it or to tell me to drop it. Call a soft update foreseen when the agent knows in advance both the partition and the marginal the incoming experience will produce, and can choose whether to undergo it. In such a case I have a small example in which the agent does strictly better in expectation by declining the free experience: the very experience that is supposed to leave the partition rigid also gives her reason to think the partition was the wrong one to hold fixed, so the condition licensing the update is itself among the things the update destabilises. Should I teach this as a pathology of the framework, as evidence that rigidity has to be relativised to the experience rather than to the partition, as a reason to distinguish the update rule from the account of evidence that feeds it, or not at all in a first session? And if it belongs, where: before the students can compute anything, or only after they can?

  Finally: what should I openly refuse to explain in ninety minutes, and what single task at the end would tell me they had mastered the rule rather than memorised the summation?
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 90-minute graduate seminar in formal epistemology.
      *   **Audience:** Graduate students. They know unconditional/conditional credences, Bayes' theorem, and the standard conditioning reflex ($P_{new}(H) = P(H|E)$). They *do not* know Probability Kinematics (Jeffrey Conditioning).
      *   **Goal:** Students must be able to perform and justify Jeffrey Conditioning ($P_{new}(H) = \sum P(H|E_i)P_{new}(E_i)$) by the end.
      *   **Specific Requirements:**
          1.  **Dependency Structure:** Order of concepts, specifically regarding "Rigidity" (constraint vs. causal independence vs. residue). What breaks if swapped?
          2.  **Carrying Example:** Evaluate the "colored object under unreliable light" case. Criteria: plausible rigidity, no hard proposition to condition on, iterable (to show non-idempotence).
          3.  **Misconception Map:** Common errors and when to head them off.
          4.  **The Wrinkle (Foreseen Updates/Value of Information):** A case where declining free info is rational because the update destabilizes the rigidity condition. Where/whether to teach this?
          5.  **Scope & Assessment:** What to exclude? What final task proves mastery?

  2.  **Deconstruct the Goal (Jeffrey Conditioning):**
      *   The core formula is $P_{new}(H) = \sum_i P(H|E_i)P_{new}(E_i)$.
      *   This requires a partition $\{E_i\}$.
      *   This requires new probabilities for the partition members $P_{new}(E_i)$.
      *   Crucially, it requires *Rigidity* (or the "Principle of Invariance"): $P_{new}(H|E_i) = P_{old}(H|E_i)$.
      *   Why Rigidity? Because the experience affects $E_i$ directly, and $H$ only indirectly via $E_i$.

  3.  **Address Requirement 1: Dependency Structure & Rigidity:**
      *   *Option A: Rigidity as a Constraint.* "You must keep conditional probabilities fixed." (Too dogmatic, lacks motivation).
      *   *Option B: Rigidity as Causal/Explanatory Independence.* "The experience affects $E$ but not $H$ given $E$." (Better, connects to world structure).
      *   *Option C: Rigidity as Residue.* "This is what's left after you fix the marginals." (Too mathematical, lacks epistemic story).
      *   *Decision:* Rigidity must be introduced as a *structural claim about the evidence flow*. The experience impacts the partition cells directly; any impact on other hypotheses is mediated *through* those cells.
      *   *Order:*
          1.  Break the Conditioning Reflex (Standard Bayes fails).
          2.  Introduce the Partition + New Marginals.
          3.  Ask: "How does this affect $H$?"
          4.  Introduce Rigidity as the *bridge* principle (Mediation).
          5.  Derive the Formula.
      *   *Risk of Swapping:* If you give the formula before motivating Rigidity, it's magic. If you motivate Rigidity as a mere constraint without the causal story, it seems arbitrary.

  4.  **Address Requirement 2: The Carrying Example:**
      *   *Candidate:* Colored object (Jellybean/Fabric) under dim/colored light.
      *   *Verdict:* It is the standard for a reason. It works well.
      *   *Criteria Check:*
          *   *Plausible Rigidity:* Yes. The light affects my perception of color ($E_i$). My belief about the material ($H$) depends on the color. The light doesn't change the material, nor does it change the link between color and material.
          *   *No Hard Proposition:* Crucial. If I say "It looks red," is that $E$? If $P(\text{Looks Red}) = 1$, we are back to conditioning. We need $P_{new}(\text{Red}) = 0.8, P_{new}(\text{Blue}) = 0.2$. The experience must be *uncertain*.
          *   *Iterable:* Yes. I look again. The light flickers. $P_{new}$ becomes $P_{new-new}$. If I apply the same shift twice, does it compound? (Jeffrey conditioning is not idempotent).
      *   *Refinement:* Make sure the partition is exhaustive (Red, Blue, Green...). Make sure $H$ is distinct (e.g., "It is silk" vs "It is cotton").

  5.  **Address Requirement 3: Misconception Map:**
      *   *Misconception 1:* "Just condition on the most likely cell." (Heads off by emphasizing uncertainty).
      *   *Misconception 2:* "Rigidity means $P(H)$ doesn't change." (Heads off by showing the weighted sum changes $P(H)$).
      *   *Misconception 3:* "Rigidity means $P(E_i)$ doesn't change." (No, that's the input).
      *   *Misconception 4:* Confusing $P_{new}(E_i)$ with likelihoods $P(E_i|H)$.
      *   *Misconception 5:* Thinking the rule is idempotent (applying twice = applying once).

  6.  **Address the "Wrinkle" (Foreseen Updates/Value of Information):**
      *   *The Issue:* Good's Theorem says free info is always valuable *if* you update by Conditioning. With Jeffrey Conditioning, if the experience undermines the rigidity condition itself (e.g., the light is so unreliable it makes me doubt the color partition), expected utility can drop.
      *   *Decision:* **Drop it for this session.**
      *   *Reasoning:* 90 minutes is tight for the core mechanics. This wrinkle requires understanding decision theory + meta-epistemology + the specific failure mode of rigidity. It confuses the *rule* with the *application conditions*. It belongs in a session on "Defeaters" or "Decision Theory," not "The Update Rule." Introducing it now risks students thinking the rule itself is broken, rather than the *input conditions*.
      *   *Placement (if insisted):* Only at the very end as a "Next Week" teaser. But better to omit.

  7.  **Address Scope & Assessment:**
      *   *Refuse to Explain:* The deeper axiomatic derivations (e.g., Field's distance minimization), the history (Jeffrey vs. Carnap), or complex continuous cases. Stick to finite partitions.
      *   *Final Task:* Don't ask them to state the formula. Give them a scenario where they must *identify the partition*, *assign the new marginals*, *check rigidity*, and *calculate*. Ideally, a case where conditioning gives the wrong answer.

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Time Allocation:* 90 mins is short.
          *   0-15: Break the reflex (The Problem).
          *   15-30: The Solution Structure (Partition + Marginals).
          *   30-50: Rigidity & Derivation (The Core).
          *   50-70: Worked Example & Iteration (The Practice).
          *   70-85: Misconceptions & Limits (The Nuance).
          *   85-90: Assessment (The Task).
      *   *Refining Rigidity:* I need to be precise. Rigidity is $P_{new}(H|E_i) = P_{old}(H|E_i)$. Why? Because the experience is "about" $E$, not $H$.
      *   *Refining the Example:* Use the "Fabric in Dim Light" case.
          *   Partition: Color (Red, Blue).
          *   Hypothesis: Material (Silk, Cotton).
          *   Experience: Glance in dim light. $P_{new}(Red) = 0.7$.
          *   Why not condition? Because I'm not certain it's Red.
      *   *Refining the Wrinkle:* I will advise strongly against teaching it. It undermines the confidence needed to learn the mechanics.

  9.  **Final Review against Constraints:**
      *   Did I answer the dependency structure? Yes (Rigidity as mediation).
      *   Did I judge the example? Yes (Keep it, but refine).
      *   Did I map misconceptions? Yes.
      *   Did I place the wrinkle? Yes (Advise dropping).
      *   Did I specify refusal/assessment? Yes.

  10. **Tone:** Professional, pedagogical, precise (matching the user's formal epistemology background). Use terms like "partition," "marginals," "rigidity," "idempotence."

  *(Self-Correction during drafting)*: Wait, regarding the "Wrinkle." The user asked me to *either* place it *or* tell them to drop it. I should be decisive. Dropping it is the responsible pedagogical choice for a *first* session on the topic. However, I must explain *why* clearly so they know I haven't ignored the complexity. I will argue it conflates the *normative rule* with the *descriptive adequacy of the input*.

  *(Self-Correction on Rigidity)*: The prompt asks specifically about the ontological status of rigidity (constraint vs. causal vs. residue). I need to take a stand. The best pedagogical stand is "Causal/Explanatory Mediation." It explains *why* the constraint holds. If you treat it as a constraint, students ask "Why?". If you treat it as residue, it's post-hoc.

  *(Self-Correction on Assessment)*: The task needs to ensure they don't just plug numbers. They need to identify the partition. If they pick the wrong partition, the math works but the epistemology fails.

