      *   **Point 5 (Craft/Narration):** The core concern for the novelist. Does "I" create a self? Yes, grammatically. Can you avoid endorsing it? You can show the *fracture* of the voice. But the medium fights the message. To write *anatta*, you might need to dissolve the voice itself, not just lie with it.
