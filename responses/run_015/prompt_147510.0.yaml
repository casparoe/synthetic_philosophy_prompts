prompt: |-
  Hey — I'm on the board of the food co-op in my town. One store, mostly volunteer-run, and I somehow ended up with the job of writing the memo on this, so I could use a hand. I've been reading about fish and shrimp welfare on my own for a few months now and I honestly can't tell what the right call is.

  Where things stand: a member petition with a few hundred signatures wants us to stop selling all farmed fish and shrimp within a year. Their argument is that these animals can probably feel pain, that the pens are crowded, that with shrimp the hatcheries cut the eyestalks off the breeding females to make them spawn, and that the animals usually get killed by being chilled in ice slurry rather than stunned. Our merchandising manager has a different plan: keep selling it, but move to suppliers who stun at harvest and run lower densities, and put a welfare note on the shelf tags. Wholesale cost goes up maybe 20%.

  The bits I keep going in circles on:

  - A serving of shrimp is dozens of animals; a serving of salmon is one animal with a long life behind it. Depending on whether you count suffering per animal or per pound you definatly get a different answer about what to cut first, and I dont know which one we should be using.
  - Our one local supplier — small trout farm an hour away, low density, clean water, exactly the local story our members like — kills the fish in ice water without stunning because they can't afford the gear. So the option that's best on food miles and on supporting a neighbour is the worst at the moment of death.
  - If we drop shrimp, most of our shoppers will just buy it somewhere cheaper or switch to cheap chicken. Some of us think we shouldn't be selling it no matter what happens elsewhere; others think that if it doesn't help any actual animal it's just us feeling virtuous.
  - We phased out battery-cage eggs years ago without much fuss, and people keep asking me why shrimp is any different when the number of animals involved is way bigger.
  - Our mission says good food at fair prices for everyone in the neighbourhood, and plenty of our regulars are on a tight budget. One of the staff-elected board members says this whole thing is a hobby horse of the better-off members and that a 20% price rise lands on the people who can least afford it.

  Could you draft the memo I'll send out before the meeting? It should come down on one side with an actual timeline, give us criteria we can apply to a specific species and supplier instead of a general feeling, and deal honestly with the strongest version of the losing side — the petition people and our merchandising manager both need to be able to read it and feel like they can actually reply to it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a local food co-op (volunteer-run).
      *   **Task:** Draft a memo to the board/membership before a meeting regarding the sale of farmed fish and shrimp.
      *   **Context:**
          *   Petition (few hundred signatures) wants a ban on all farmed fish/shrimp within a year (welfare concerns: pain, crowding, eyestalk ablation, slaughter methods).
          *   Merchandising Manager proposes keeping sales but switching to higher welfare suppliers (stunning, lower density) + shelf tags. Cost +20%.
          *   Local trout supplier: Great on miles/local support, bad on slaughter (ice slurry, no stun).
          *   Ethical dilemmas: Per animal vs. per pound suffering, substitution effect (buying elsewhere/chicken), mission alignment (fair prices/accessibility), comparison to egg phase-out.
      *   **Requirements:**
          *   Must come down on *one side* with a specific timeline.
          *   Must provide clear criteria for species/supplier evaluation (not just feelings).
          *   Must address the strongest arguments of the "losing" side (petitioners vs. manager) fairly so they feel heard and can respond.
          *   Tone: Professional, empathetic, decisive, co-op appropriate (collaborative but leadership-oriented).

  2.  **Determine the Stance:**
      *   *Option A: Total Ban.* Aligns with petitioners. Risks: Loss of local supplier, price hikes for those who switch to higher welfare, substitution effect (members buy worse elsewhere), potential conflict with "fair prices" mission.
      *   *Option B: Status Quo + Improvements (Manager's Plan).* Aligns with manager. Risks: Doesn't address eyestalk ablation fully, still sells high-suffering animals, "humane washing" concerns.
      *   *Option C: Hybrid/Phased Approach (Recommended).* This is usually the most practical for co-ops. It acknowledges the welfare issues without an immediate blanket ban that hurts local partners or low-income members. It sets a trajectory.
      *   *Decision:* I need to pick one side as per the prompt ("It should come down on one side"). A hybrid is often the *result*, but the *memo* needs a recommendation.
      *   *Reasoning:* A total ban is too blunt for a co-op mission that includes "fair prices" and "local support." The local trout farmer is a specific stakeholder. However, the welfare concerns (especially shrimp eyestalk ablation and slaughter) are scientifically valid.
      *   *Selected Stance:* **Adopt the Merchandising Manager's "Higher Welfare" pathway, but with a sunset clause for non-compliant suppliers and a specific exemption process for the local farmer.** Why? Because a ban drives demand elsewhere (no net welfare gain), hurts low-income members (mission alignment), and punishes the local trout farmer who is otherwise exemplary. However, we must set hard limits (no eyestalk ablation, mandatory stunning timeline). This balances the petition's *goals* with the manager's *method*.
      *   *Wait, looking closer at the prompt:* "It should come down on one side... deal honestly with the strongest version of the losing side."
      *   *Refined Stance:* I will recommend **against a blanket ban** but **for a rigorous welfare standard that effectively phases out the worst offenders (shrimp) while protecting the local partner.** This aligns closer to the Manager's plan but incorporates the Petition's urgency. Actually, to make it decisive: I will recommend **adopting the Higher Welfare Standard (Manager's Plan) with a 18-month timeline for compliance, rather than an immediate ban.** This allows the local farmer time to adapt and keeps prices stable initially, but sets a hard line.
      *   *Wait, let's look at the "Per Animal vs. Per Pound" dilemma.* Shrimp suffer more in aggregate. A ban targets shrimp first.
      *   *Let's try a different angle:* The prompt asks me to "come down on one side." Usually, in a co-op, the "Ban" side is the moral imperative, but the "Standards" side is the practical governance. If I recommend the Ban, I alienate the local farmer and budget shoppers. If I recommend the Standards, I alienate the welfare purists.
      *   *Best Co-op Governance Approach:* Recommend the **Standards/Improvement Plan (Manager's Side)** but with teeth. Why? Because co-ops are about community viability. Driving away budget shoppers and local farmers undermines the co-op. However, I must address the shrimp issue specifically because the suffering density is so high.
      *   *Actually, looking at the "losing side" requirement:* If I recommend the Manager's plan, the Petitioners are the losing side. I need to make sure they feel heard. If I recommend the Ban, the Manager/Local Farmer are the losing side.
      *   *Decision:* I will recommend **rejecting the blanket ban in favor of a Tiered Welfare Standard.** This allows us to keep the local trout (with a grace period for stunning) and higher welfare salmon, while potentially phasing out shrimp that don't meet specific criteria (like eyestalk ablation). This is the most nuanced and defensible position for a board memo.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the petition, the work done, and the gravity of the decision. Validate the passion on both sides.
      *   **The Recommendation:** Clear statement. No blanket ban. Instead, a "Welfare & Sourcing Standard" with a timeline.
      *   **The Criteria (The "How"):** Need specific metrics.
          *   Slaughter method (Stunning required).
          *   Density (Certifications).
          *   Broodstock (No eyestalk ablation).
          *   Local Exception (For the trout farmer).
      *   **Addressing the "Losing Side" (Petitioners):** Acknowledge the science on pain. Acknowledge the shrimp math (dozens vs. one). Admit this isn't perfect. Explain the "Substitution Effect" argument honestly.
      *   **Addressing the "Winning Side" Constraints (Manager/Budget):** Acknowledge the 20% cost. Acknowledge the local farmer's limitation.
      *   **Timeline:** Phased. 6 months for shrimp criteria, 18 months for slaughter gear (giving local farmer time).
      *   **Closing:** Call to action for the meeting.

  4.  **Refining the Tone:**
      *   Needs to sound like a volunteer board member, not a corporate CEO. Collaborative but firm.
      *   Avoid jargon where possible, but use specific welfare terms (eyestalk ablation, percussive stunning).
      *   Ensure the "Per Animal vs. Per Pound" dilemma is addressed in the criteria section.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 18 months too long? *Fix:* Make it 12 months for shrimp, 18 for local fish.
      *   *Critique:* Did I address the egg comparison? *Fix:* Add a paragraph comparing the egg phase-out to this situation (supply chain maturity).
      *   *Critique:* Is the local farmer treated fairly? *Fix:* Create a "Local Partner Grant/Loan" idea or just a grace period. Let's stick to a grace period + board commitment to help fundraise for their stunning gear. That shows co-op spirit.
      *   *Critique:* Did I pick a side? *Fix:* Yes, the side is "Standards over Ban." I need to make sure that's clear.

  6.  **Final Polish:** Check against the prompt requirements one last time.
      *   One side with timeline? Yes (Standards, 12-18 months).
      *   Criteria for species/supplier? Yes (Slaughter, Density, Broodstock).
      *   Deal honestly with losing side? Yes (Petitioners' welfare concerns validated, but practical limits explained).
      *   Tone? Co-appropriate.

  7.  *(Self-Correction on "One Side"):* The prompt says "come down on one side." If I say "No ban, but standards," that is technically the Merchandising Manager's side (keep selling, improve conditions). The Petitioners want a ban. So I am siding with the Manager, but modifying the plan to be stricter. I need to make sure I don't waffle too much. I will explicitly recommend *against* the blanket ban.

  8.  *(Final thought on the Local Farmer):* The prompt says the local farmer kills in ice water. If my criteria say "Stunning required," they are out unless they get an exemption. I should recommend an exemption *conditional* on the co-op helping them get the gear. This aligns with "supporting a neighbour."

  9.  *(Final thought on Shrimp):* Shrimp are the hardest hit. The criteria should effectively ban most farmed shrimp unless certified welfare-friendly (which is rare). This might look like a ban on shrimp but leaves the door open for ethical sources. This bridges the gap.

