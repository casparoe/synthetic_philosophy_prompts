answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Co-op Name]
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Farmed Fish and Shrimp Sourcing

  **Purpose**

  This memo serves as my formal recommendation ahead of our November board meeting regarding the member petition to cease sales of all farmed fish and shrimp. Over the past quarter, I have reviewed the petition's data, consulted with our Merchandising Manager, and evaluated our mission obligations regarding accessibility, local support, and animal welfare.

  **Recommendation**

  I recommend that the Board **reject the proposal for an immediate blanket ban** on farmed fish and shrimp.

  Instead, I propose we adopt the Merchandising Manager's strategy of **transitioning to verified higher-welfare suppliers**, but with stricter, time-bound criteria than currently planned. We will implement a **Tiered Welfare Standard** with a 12-month compliance window for external suppliers and an 18-month window for our local trout partner, contingent on co-op support for equipment upgrades.

  This path prioritizes measurable welfare improvements over symbolic removal, aligns with our mission to keep food accessible, and protects our local supply chain while setting a hard line on inhumane practices.

  **Proposed Criteria & Timeline**

  To move beyond "general feelings" on welfare, we will evaluate all aquatic stock against three specific metrics. Suppliers must meet these thresholds to remain on our shelves.

  1.  **Slaughter Method (Priority: High):**
      *   *Standard:* All animals must be rendered insensible to pain prior to death (e.g., percussive or electrical stunning). Ice-slurry killing without prior stun is non-compliant.
      *   *Timeline:* 12 months for all external suppliers. 18 months for our local trout partner.
      *   *Support:* The Co-op will allocate $5,000 from our Community Fund or launch a member drive to help the local trout farmer purchase stunning equipment.
  2.  **Stocking Density & Environment (Priority: Medium):**
      *   *Standard:* Suppliers must provide third-party certification (e.g., ASC, Global G.A.P. with welfare modules) verifying stocking densities that allow natural movement and water quality.
      *   *Timeline:* 12 months.
  3.  **Broodstock Management (Priority: High - Shrimp Specific):**
      *   *Standard:* Zero tolerance for eyestalk ablation on breeding females.
      *   *Timeline:* 12 months.
      *   *Note:* As few shrimp suppliers currently meet this, this criterion may effectively phase out most farmed shrimp without a categorical ban.

  **Rationale: Why Not a Ban?**

  I want to address the petitioners' arguments directly, because they are morally weighty and scientifically grounded. You are correct that decapods and fish feel pain. You are correct that a single serving of shrimp represents dozens of lives, creating a higher "aggregate suffering" per pound than salmon. If our only metric were minimizing total animal suffering immediately, a ban would be the logical choice.

  However, a co-op must weigh ethical purity against real-world impact. We must consider the **Substitution Effect**. If we stop selling shrimp, data from similar co-op transitions suggests most members will not stop eating shrimp; they will buy it at conventional supermarkets where welfare standards are lower and prices are cheaper. In that scenario, we lose the revenue that supports our staff and local economy, while the total animal suffering remains unchanged or increases.

  Furthermore, a blanket ban conflicts with our mission of "fair prices for everyone." A 20% wholesale increase on compliant fish, passed to the member, alongside the removal of a key protein source, disproportionately impacts our low-income membership. The egg phase-out cited in the petition is an imperfect comparison; the cage-free egg supply chain was mature and scalable before we mandated it. High-welfare aquatic supply chains are not yet mature enough to support a ban without creating a black market among our own members.

  **Rationale: Why Stricter Standards?**

  To the Merchandising Manager and those concerned about viability: I know that a 20% cost increase is risky. I know that asking our local trout farmer to change slaughter methods threatens a relationship we value.

  However, maintaining the status quo is no longer viable. Our members are educated on welfare issues, and "humane washing" via vague shelf tags will damage our credibility. We cannot claim to be an ethical food leader while selling products derived from eyestalk ablation or ice-slurry suffocation.

  By setting hard criteria, we give our suppliers a roadmap. For the local trout farmer, the 18-month grace period combined with financial support acknowledges their value to our local food web. It says: *We value you enough to help you upgrade, but we cannot sell your product indefinitely if it causes unnecessary suffering at the moment of death.*

  **Next Steps**

  1.  **Vote:** Board to vote on adopting the Tiered Welfare Standard at the November meeting.
  2.  **Audit:** Merchandising to audit current suppliers against the three criteria by December 1st.
  3.  **Communication:** We will publish a summary of this decision in the member newsletter, explicitly acknowledging the petitioners' concerns and explaining why we believe this path reduces more suffering in the long term.

  I look forward to discussing this with you all. We are not choosing between "caring" and "not caring." We are choosing between a gesture that feels good and a strategy that does good.

  Respectfully,

  [Your Name]
  Board Member, [Co-op Name]
