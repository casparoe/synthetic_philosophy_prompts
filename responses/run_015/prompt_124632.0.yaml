answer: |-
  ### Specification of Desiderata for a Theory of Inductive Inference

  **Purpose:** To guide a research group in selecting an inductive bias for a concrete inquiry, providing justification that is not merely an expression of preference.

  #### 1. The Benchmark Requirement (Rejection of Uniformity)
  *   **Status:** Non-negotiable.
  *   **Case:** The No-Free-Lunch (NFL) theorems demonstrate that all learners perform identically when averaged over a uniform distribution of all possible target functions. Your friend argues this makes the uniform average the "neutral" baseline. This is incorrect. A uniform distribution over functions implies that knowing the output for half the input space gives zero information about the other half. This is a specific, high-entropy assumption about the world, not an absence of assumption. Physical environments are not uniformly random; they exhibit structure, continuity, and sparsity.
  *   **Requirement:** The theory must explicitly justify why the uniform measure is discarded in favor of a restricted hypothesis space or a non-uniform prior. It cannot treat the uniform average as the default state of ignorance; it must treat it as a specific (and usually false) model of noise.

  #### 2. The Domain-Grain Requirement (Non-Tautological Individuation)
  *   **Status:** Non-negotiable.
  *   **Case:** NFL results are sensitive to how the space of environments is carved up. If a group defines their domain as "problems where Bias X works," then Bias X is optimal by definition. This renders the advice vacuous.
  *   **Requirement:** The theory must provide criteria for individuating a domain that are independent of the performance of the bias being recommended. The boundaries of the "domain" must be fixed by features of the inquiry (e.g., the measurement apparatus, the physical system) prior to evaluating the bias, not by the success of the bias itself.

  #### 3. The Transport Requirement (Transfer Criteria)
  *   **Status:** Genuine Desideratum (Trade-off-able).
  *   **Case:** A bias validated on historical data from one context (e.g., terrestrial physics) is often applied to a neighbouring context (e.g., astrophysics). A perfect theory would specify the exact invariants required to license this transfer.
  *   **Requirement:** The theory should offer conditions under which track-record success licenses projection into new environments. However, since perfect certainty here is likely impossible without circularity, this requirement may be relaxed to providing *defeasible markers* of similarity (e.g., shared causal mechanisms) rather than strict logical guarantees.

  #### 4. The Feasibility Requirement (Computational Tractability)
  *   **Status:** Non-negotiable (for this purpose).
  *   **Case:** You asked for a theory to tell a research group *what to adopt*. A theory that recommends an uncomputable ideal (e.g., a universal prior over all Turing machines) fails this functional goal. It offers a regulative ideal but no actionable procedure.
  *   **Requirement:** The recommended inductive bias must be implementable within the resource constraints (time, memory, data) of the inquirer. A theory of inference for agents must be a theory for *bounded* agents.

  #### 5. The Circularity Requirement (Minimal Bootstrapping)
  *   **Status:** Genuine Desideratum (Must be Relaxed).
  *   **Case:** Hume's problem is that justifying induction requires induction. A strict requirement for "non-circularity" makes any solution impossible. However, a theory that openly assumes the reliability of the bias it recommends is merely dogmatic.
  *   **Requirement:** The theory must minimize the scope of the assumption. It should not assume the bias is *true*, but rather that the bias is *conducive to finding truth if truth is findable* (a vindicationist approach). Strict non-circularity is impossible; the requirement is for *transparency* about the necessary presuppositions.

  #### 6. User Candidate 1: Recoding Invariance
  *   **Status:** Prejudice (Strike from list).
  *   **Case:** You worry that a theory should not flip verdicts if data is relabelled (e.g., "Green" vs. "Grue"). However, NFL implies that for any learner, there exists a recoding of the world that makes it fail. Learning *requires* a preferred basis. To demand invariance under all computable recodings is to demand a bias that prefers nothing, which is a bias that learns nothing.
  *   **Ruling:** Drop this. A theory must be allowed to privilege certain representations (e.g., those aligned with time, space, or causal structure) without counting it as a failure. The burden is to explain *why* those representations are privileged, not to pretend they aren't.

  #### 7. User Candidate 2: Ordering Empirically Equivalent Hypotheses
  *   **Status:** Non-negotiable.
  *   **Case:** This is the core of the projection problem. If two hypotheses fit all existing data equally well (e.g., "All emeralds are green" vs. "All emeralds are grue"), a theory that refuses to rank them abandons the task of inference for the task of description.
  *   **Requirement:** The theory must provide a principled basis for preferring one hypothesis over another in the absence of data discrimination. If it cannot do this, it is not a theory of induction; it is a theory of data compression.

  ---

  ### The Inconsistency Result

  There is a subset of these requirements that cannot be jointly satisfied in their strict forms. Specifically: **Feasibility**, **Ordering Empirically Equivalent Hypotheses**, and **Non-Circular Justification (Strict Circularity Requirement).**

  1.  **The Conflict:** To order empirically equivalent hypotheses (Req 7), the theory must introduce a bias (e.g., simplicity, smoothness). To justify this bias without circularity (Req 5), the theory must demonstrate that the bias tracks the structure of the world. To demonstrate this demonstration is feasible (Req 4), the check must be computable.
  2.  **The Impossibility:** If the check is computable and feasible, it relies on data. By definition, empirically equivalent hypotheses are not distinguishable by data. Therefore, the justification for the bias cannot come from the data without begging the question (assuming the bias to interpret the data). If the justification does not come from data, it must come from a priori reasoning, which violates the empirical spirit of the inquiry or collapses into dogmatism.
  3.  **The Resolution:** You must drop the demand for **Strict Non-Circular Justification**.
      *   **Cost:** You cannot prove to a skeptic that your bias is "True." You can only show that it is *necessary for the success of the inquiry* as defined by the group's goals.
      *   **Survival:** The surviving list (Feasibility + Ordering + *Vindicationist* Justification) still does the job. It tells the group: "To achieve your goal of prediction, you *must* adopt Bias X. If the world is predictable at all, this bias will find it. If the world is not predictable, no bias will work." This is sufficient for action, even if it fails to satisfy radical skepticism.

  ---

  ### Scorecard of Account Families

  **Bayesian / Universal-Prior Accounts**
  *   **Performance:** Fails **Feasibility**.
  *   **Notes:** These accounts excel at Ordering Equivalent Hypotheses (via priors) and formally reject the Uniform Benchmark. However, the "universal" priors required to claim generality are uncomputable. They tell the research group what is optimal in the limit of infinite time, which is useless for concrete inquiry.

  **Simplicity / Minimum-Description-Length (MDL)**
  *   **Performance:** Fails **Non-Circular Justification**.
  *   **Notes:** Highly Feasible and excellent at Ordering Hypotheses. However, the choice of description language (which fixes what counts as "simple") is arbitrary without external justification. It solves the engineering problem but pushes the philosophical problem back to "why this language?"

  **Error-Statistical / Severe-Testing**
  *   **Performance:** Fails **Ordering Empirically Equivalent Hypotheses**.
  *   **Notes:** Strong on Feasibility and avoids circularity by focusing on error rates rather than truth probabilities. However, it is designed to *reject* hypotheses, not *select* among those that survive. If two hypotheses pass all severe tests, this theory offers no basis for choosing one for prediction.

  **Causal / Physical-Structure Accounts**
  *   **Performance:** Fails **Domain-Grain Objectivity** (in practice).
  *   **Notes:** Best at justifying the Bias (by grounding it in mechanism) and Transport (via shared causal structure). However, identifying the causal structure *requires* inductive inference. It risks circularity: "Use this bias because it matches the causality," where the causality was inferred using that bias.

  **Dominant Exclusion:** The **Feasibility** requirement does the most work in excluding candidates. It eliminates the theoretically "purest" solutions (Universal Priors) that claim to solve the problem globally, forcing the field to accept local, biased, and computable approximations.

  ---

  ### Epistemic Posture Note

  **Confidence Level:** High on the structural constraints (the incompatibility of Feasibility, Ordering, and Non-Circularity is a logical consequence of the problem setup); Moderate on the philosophical resolution (the move to Vindication is standard but contentious).

  **Least Sure Claim:** I am least certain about the **Non-Negotiable status of Feasibility**.
  *   **Consideration:** One could argue that a theory of inference should describe the *normative ideal* (what one ought to approximate) rather than the *actionable recipe*. If the purpose were "understand the limits of knowledge" rather than "guide a research group," Feasibility would be a secondary constraint. If you believe a theory can be useful even if its recommendations are unimplementable (serving as a horizon for approximation), then Feasibility should be downgraded to a Trade-off-able Desideratum, which would rehabilitate Bayesian/Universal accounts.
