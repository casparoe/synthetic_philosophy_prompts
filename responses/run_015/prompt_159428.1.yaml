      *Section 1:* The core conflict isn't about the mascot; it's about what makes a democratic decision legitimate. Priya argues legitimacy requires a fair question and an electorate that bears the consequences, while the principal argues legitimacy comes solely from following the agreed-upon process and respecting the majority count. You are stuck between procedural integrity (the rules were followed) and substantive representation (the outcome might not reflect the true will of the people who have to live with it).

      *Section 2:* The principal has a strong point on stability: if you start invalidating votes because the margin was thin or the question wasn't perfect, you teach students that rules only matter when they produce your preferred outcome. A 52–48 victory is still a majority, and the petition process was followed according to the existing bylaws. Overturning this sets a dangerous precedent where any close loss can be litigated endlessly based on turnout models or question wording, which paralyzes the council and undermines trust in the system itself.

