  What's actually being argued about here
  The core conflict isn't about the mascot; it's about what makes a democratic decision legitimate. Priya argues legitimacy requires a fair question and an electorate that bears the consequences, while the principal argues legitimacy comes solely from following the agreed-upon process and respecting the majority count. You are stuck between procedural integrity (the rules were followed) and substantive representation (the outcome might not reflect the true will of the people who have to live with it).

  The case for just accepting the result
  The principal has a strong point on stability: if you start invalidating votes because the margin was thin or the question wasn't perfect, you teach students that rules only matter when they produce your preferred outcome. A 52–48 victory is still a majority, and the petition process was followed according to the existing bylaws. Overturning this sets a dangerous precedent where any close loss can be litigated endlessly based on turnout models or question wording, which paralyzes the council and undermines trust in the system itself.

  The case that the vote doesn't mean what it looks like it means
  However, Priya is right that the vote's mandate is ambiguous because the question bundled two distinct issues—retiring the old name and adopting a specific new design—which artificially inflated the "Yes" vote among those who just wanted the old one gone. Additionally, having graduating seniors decide a permanent symbol for underclassmen who didn't vote creates a representation gap; it's democratic in procedure but inequitable in impact. The informal poll suggests the true majority preference (keep name, change logo) was never actually offered, meaning the ballot captured a preference for change, but not necessarily for *this* change.

