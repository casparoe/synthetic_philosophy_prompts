          *   Principal: Vote is vote. Majority spoke. Re-running is undemocratic.
          *   Council Drafting Rule Change: Single-topic questions + 10% margin requirement (re-vote next year if close).
          *   Critics of Rule Change: Anti-democratic, status quo bias, electorate changes (seniors leave).
