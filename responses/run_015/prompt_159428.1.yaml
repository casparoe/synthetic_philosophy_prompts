      *   *Thursday:* Don't vote to overturn immediately (looks chaotic). Don't vote to implement blindly (looks tone-deaf). Propose implementing the *name change* (clear majority intent) but opening the *logo* to a new competition (addressing Priya's point). Support single-topic rule, oppose the 10% delay rule (too easy to stall).
