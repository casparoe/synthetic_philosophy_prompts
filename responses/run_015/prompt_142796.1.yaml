          *   *Crucial Point:* The Reader cooperates with the Author to decode Layer 2, even when Layer 2 is a lie. We are "in on the joke."

      *   **The Test Case: Irony (Fiction vs. Reality):**
          *   *Real Life:* If I use irony/sarcasm violating the Maxim of Quality, and you take it literally, communication breaks. If I do it to deceive you maliciously, you feel betrayed. The CP is violated between *us*.
