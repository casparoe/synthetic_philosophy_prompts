answer: |-
  This is a sophisticated and promising conceptual pivot. You have identified a genuine gap in the literature: the "Redundancy Objection" is often treated as a defeater for expectation accounts, but normative-power accounts rarely explain *why* layering a promise atop a duty is normatively significant rather than merely cumulative. Your intuition that the *locus of accountability* shifts is strong.

  However, to ensure the conceptual architecture holds, I have four critical concerns regarding your ontology, your conditions, your political application, and your strategic focus.

  ### 1. Ontological Economy: "Indexical Obligation" vs. "Grounds of Accountability"
  You ask if you are inventing an unnecessary ontological category. I suspect you are. Positing a new *type* of obligation ("indexical obligation") risks multiplying entities without necessity.

  **The Objection:** If a Minister has a duty to implement Policy $P$ (Institutional) and promises to implement Policy $P$ (Personal), do they now have two obligations to do $P$? If they implement $P$ but explicitly state, "I did this because the Charter requires it, not because I promised you," have they violated the indexical obligation?
  *   **If Yes:** You are arguing for an obligation of *motive* or *reason-for-action*, which is notoriously difficult to enforce or verify and may conflict with the institutional duty (which usually demands action regardless of motive).
  *   **If No:** Then the "indexical obligation" is not a distinct obligation to *act*, but a distinct **ground for blame**.

  **Recommendation:** Reframe the argument. Do not claim the promise creates a new *obligation* (which suggests a new content or outcome). Claim it creates a new **channel of answerability**. The content ($P$) remains identical, but the *normative relationship* changes. The promisee acquires a standing to blame the promisor *as a person*, not just *as an officeholder*. This achieves your explanatory goal (explaining the sense of personal betrayal) without requiring a new metaphysical category of obligation. It aligns better with Scanlonian contractualism or answerability accounts without the "indexical" baggage, which might confuse readers (since "indexical" usually implies semantic context-dependence, not token-reflexivity of speech acts).

  ### 2. The "Discretion" Condition and the Illusion of Redundancy
  Your first condition (discretionary authority) creates a tension with your central problem (redundancy).

  **The Objection:** If the official *must* do $X$ by charter, they arguably lack the discretion to promise $X$. In speech act theory, promising implies the possibility of not doing. If the charter mandates $X$, a promise to do $X$ is infelicitous (void). If there *is* discretion (e.g., *how* or *when* to implement), then the promise is not actually redundant; it specifies a subset of the duty.
  *   **The Trap:** If you insist on discretion to make the promise valid, you undermine the "redundancy" puzzle. If you insist on redundancy (strict mandate), you undermine the validity of the promise.

  **Recommendation:** You need to clarify that the redundancy is **apparent**, not actual. The institutional duty is often abstract or systemic (e.g., "serve the public interest"), while the promise is concrete (e.g., "fund this specific clinic"). The promise *specifies* the duty. However, your argument is stronger if you argue that even when the *action* is fully determined, the **relationship** is not. The discretion required isn't over the *action*, but over the **normative framing**. The official has the power to invite personal scrutiny. This preserves the redundancy of the *act* while validating the novelty of the *bond*.

  ### 3. The Political Assumption: The "Two Bodies" Problem
  You asked if the public official application smuggles in assumptions. Yes, it risks conflating the natural person with the corporate office.

  **The Objection:** In many administrative law traditions, the Minister *is* the Office. To hold them personally answerable for an official act is to misunderstand the nature of public power. If a Minister promises a policy and fails, the "personal betrayal" you describe might be a category error by the public, not a genuine normative residue. By validating this feeling, you may be implicitly arguing for a populist model of democracy where leaders are personally bound to constituents, rather than a liberal model where they are bound to the Constitution.
  *   **Risk:** A critic could argue the "residual sense of personal betrayal" is an illusion caused by the personalization of politics, not a genuine philosophical feature of promising.

  **Recommendation:** You must defend why the personal layer *should* survive. Is it because democratic legitimacy requires a bond of trust beyond legal compliance? Or is it because the official, as a moral agent, cannot fully submerge their agency into the role? You need a sentence or two acknowledging that this fractures the standard public/private divide, and argue why that fracture is normatively desirable (e.g., it prevents "just following orders" defenses).

  ### 4. Strategic Reframing: Interpersonal Roles vs. Institutions
  You asked if you should drop the institutional case. I suggest a hybrid approach, but with a shift in emphasis.

  **The Problem:** The institutional case is high-stakes but conceptually messy (due to the political assumptions above). The interpersonal case (e.g., a parent promising a child care they already owe) is cleaner but lower-stakes.
  **The Solution:** Use the **Interpersonal Role** case as your primary engine, and the Institutional case as a stress test.
  *   **Why:** The "Parent/Child" or "Friend/Friend" dynamic already contains dense role-based duties. If I promise my spouse to wash the dishes (which I already have a duty to do as a partner), the "indexical" shift is clearer. It is not about political representation; it is about **intimacy and recognition**. The promise says, "I recognize you as someone to whom I owe fidelity, not just role-compliance."
  *   **Benefit:** This avoids the "Two Bodies" political trap. It grounds the "indexical" layer in the value of **recognition**. The promise isn't redundant because it acknowledges the promisee's standing in a way the background duty does not.
  *   **Application:** You can then *apply* this to the Minister. The Minister's promise is valuable not because of democracy per se, but because it recognizes the citizen as a moral counterparty, not just a beneficiary of administration. This unifies the essay under a theory of **Recognition** rather than just Accountability.

  ### Summary of Suggested Revisions
  1.  **Terminology:** Drop "Indexical Obligation." Use **"Token-Reflexive Accountability"** or **"Source-Relative Answerability."** It clarifies that the *obligation* (to do $X$) doesn't change, but the *reasons for blame* do.
  2.  **Conditions:** Revise the "Discretion" condition. It should be **"Normative Uptake."** The promisee must accept the invitation to hold the speaker personally answerable. This solves the "casual assurance" problem (casual assurances lack the explicit invitation for personal blame).
  3.  **Focus:** Anchor the argument in **Interpersonal Roles** (parent, friend, colleague) to prove the conceptual point, then apply it to Institutions as a derivative case. This avoids getting bogged down in political theory debates about representation.
  4.  **The "Why":** Explicitly state that the value of the redundant promise is **Recognition**. It transforms a duty owed to "the role" into a debt owed to "the person."

  If you make these shifts, the essay moves from a potentially confusing claim about new obligations to a compelling claim about the **relational structure of moral accountability**. That is a much harder target to undermine.
