      *   **Constraint:** No literature survey or references. Focus on conceptual architecture.

  2.  **Deconstruct the Core Argument:**
      *   *Problem:* The "Redundancy Objection" to promising. If I must do $X$ anyway (duty), promising to do $X$ seems to add nothing (Expectation view fails) or adds a mysterious second obligation (Normative Power view struggles to justify the *point*).
      *   *Solution:* "Indexical Obligation." It's not just $O(X)$, it's $O(X \text{ via } P)$.
      *   *Mechanism:* Shifts accountability from Office/Role to Speaker/Person.
      *   *Test Case:* Public officials.

  3.  **Evaluate Explanatory Work (vs. Established Accounts):**
      *   *Normative Power (e.g., Shiffrin, Raz):* They already argue promising creates a new reason/obligation. The user's critique is "why does it add anything meaningful?" The user's answer is "Indexicality."
      *   *Critique:* Is "Indexical Obligation" just a fancy name for "Second-Order Obligation" or "Obligation of Fidelity"?
      *   *Potential Issue:* If I have a duty to do $X$ (Institutional) and a duty to keep my promise to do $X$ (Indexical), do these conflict? If I do $X$ but forget the promise, did I fulfill the indexical obligation? The definition says "perform it specifically as the fulfillment of this particular speech act." This implies intention matters.
      *   *Comparison:* A trust-based account says the promise creates an *expectation of fidelity*. If I break it, I violate trust. The user says it's about *answerability structure*. This seems stronger for the "personal betrayal" intuition.
      *   *Verdict:* It does distinct work *if* the focus is on the *mode* of compliance, not just the content. But it risks collapsing into a "duty of sincerity" or "duty of fidelity" without the ontological baggage.

  4.  **Evaluate the Three Conditions:**
      *   1. *Discretionary Authority:* If I *must* do $X$ by law, can I promise? Usually, "I promise to do what I must" is infelicitous unless I imply I might not. If discretion is required, does that undermine the "redundancy" (since it wasn't fully mandated)?
      *   2. *Promisee Position:* This is crucial. It distinguishes public accountability from personal accountability.
      *   3. *Re-identifiability:* Standard for any commitment.
      *   *Risk:* Are they jointly sufficient? What about casual assurances ("Don't worry, I'll file that report")? If I have discretion, you can hold me answerable, and we can identify the speech act... is that a promise?
      *   *Refinement:* The conditions might need a "normative uptake" condition. The promisee must *accept* the shift in accountability.

  5.  **Evaluate the Public Official Application:**
      *   *Smuggled Assumptions:* Yes. It assumes the official *has* a personal moral agency distinct from the role that the public can access. In some theories (Hobbesian, strict Weberian), the official *is* the office.
      *   *Democratic Representation:* It assumes the citizen has a standing to hold the minister personally answerable, not just electorally. This is a strong political philosophy claim.
      *   *Risk:* If the minister does the policy but for the wrong reason (not because of the promise), is the "indexical obligation" violated? If so, this is very demanding.

  6.  **Evaluate Ontological Economy (Is "Indexical Obligation" necessary?):**
      *   *Alternative:* Frame it as a shift in *grounds of blame*, not a new *type of obligation*.
