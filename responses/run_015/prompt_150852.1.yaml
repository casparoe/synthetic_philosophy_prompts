  9.  **Refining the "Indexical" Critique:**
      *   "Indexical" usually refers to context-dependence (I, here, now). The user means "token-specific."
      *   Better term: "Token-Reflexive Obligation" or "Source-Relative Accountability."
      *   Actually, "Indexical" might be misleading. It suggests the *content* changes. The user says the *mode of fulfillment* changes.
      *   *Crucial Point:* If I do the action but deny the promise motivated it, did I violate the obligation? If yes, it's an obligation of *motive*. If no, it's just an obligation of *outcome* with extra blame attached. The essay needs to clarify this.

  10. **Refining the "Discretion" Condition:**
