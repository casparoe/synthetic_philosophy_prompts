      *   **Title:** "Indexical Obligations and Institutional Redundancy."
      *   **Core Argument:** Promises create an "indexical obligation" (do $X$ *as* the fulfillment of *this* speech act), distinct from the obligation to just do $X$. This explains "redundant" promises (e.g., promising to do what one is already duty-bound to do).
      *   **Application:** Public officials promising mandated actions (e.g., a minister promising to implement mandated policy). If they break the promise, it feels like personal betrayal even if institutional duty remains.
      *   **Conditions:** 1. Discretionary authority, 2. Promisee positioned to hold answerable for breach of word (not just institutional failure), 3. Re-identifiability of the speech act over time.
      *   **Specific Feedback Needed:**
          *   Does the distinction do explanatory work existing accounts (normative power, expectation/trust) can't?
          *   Are the three conditions sufficient/too permissive (casual assurances)?
          *   Does the public official application smuggle in assumptions (democratic representation/personal authority)?
          *   Does the conceptual architecture hold? Is there a cleaner way to frame it without new ontology?
