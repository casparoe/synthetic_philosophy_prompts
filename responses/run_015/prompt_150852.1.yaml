  7.  **Evaluate the Scope (Institutional vs. Interpersonal):**
      *   *Institutional:* High stakes, but messy (political philosophy baggage).
      *   *Interpersonal:* Cleaner. Example: A parent promising a child to pick them up (already a duty of care). Or a friend promising to help move (already a duty of friendship).
