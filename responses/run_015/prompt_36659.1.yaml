  ### A Note on the Instrument (For the Discussion)

  **Turn the lens back on the tree.**
  This handout is not a neutral mirror; it is a filter. By asking you to choose between "Light Switch" and "Volume Knob," I am assuming consciousness *can* be graded. By asking about "Robots," I am assuming functionalism is a live option. By putting the "Precautionary" question at the end, I am treating ethics as separate from metaphysics.

  If you found yourself frustrated because none of the questions captured your view, that is a philosophical discovery in itself. It means your intuition might challenge the categories I've built. Use that friction. The snack guy might not care about "Higher-Order Thought," but if he says, *"Well, if the robot whines, I'm not kicking it, just in case,"* he has just out-philosophed the grad students on the Precautionary Principle.

