      *   **Section 3: Defender vs. Critic.**
          *   *Defender:* Science is about prediction, not realism. Newtonian physics is "false" (relativity exists) but useful.
          *   *Critic:* Mechanism matters for policy. If you don't know *why* it works, you can't fix it when it breaks (Lucas Critique).
