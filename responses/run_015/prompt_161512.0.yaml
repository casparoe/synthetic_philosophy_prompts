answer: |-
  This is an excellent question because it cuts to the heart of a debate that has defined economics for 70 years. The short answer is: **The airport book is surprisingly accurate to Friedman's text, even on the controversial parts.** Friedman *did* argue that unrealistic assumptions are a virtue, and he *did* dismiss the realism of assumptions as irrelevant to scientific validity.

  However, your friend is also right: modern methodology has largely moved past Friedman's extreme position because it creates blind spots in policy and structural analysis.

  Here is a breakdown of what Friedman actually wrote, where the summary holds up, where it simplifies, and the implications of applying his logic to your specific examples.

  ---

  ### 1. Fact-Checking the Summary Against Friedman (1953)

  The essay is *"The Methodology of Positive Economics."* Here is how the summary's claims map to the text:

  *   **"Assumptions do not matter... only predictions matter."**
      *   **Verdict:** **Accurate.** Friedman argues that the validity of a theory is judged solely by the accuracy of its predictions. He explicitly states that asking whether assumptions are "realistic" is the wrong question.
  *   **The Billiards Player & Profit Maximization.**
      *   **Verdict:** **Accurate.** These are his two central analogies. He argues players act *as if* they know the math, and firms act *as if* they calculate marginal cost, regardless of whether they actually do.
  *   **"Unrealistic assumptions are actually a good sign."**
      *   **Verdict:** **Accurate (and shocking).** This is the most famous and controversial line in the essay. Friedman wrote: *"Truly important and significant hypotheses will be found to have 'assumptions' that are wildly inaccurate descriptive representations of reality..."* He argues that to be general, a theory must ignore "noise," so the more significant the theory, the more "unrealistic" the assumptions.
  *   **"False premises can entail true conclusions."**
      *   **Verdict:** **Accurate logic, contentious application.** Friedman uses this logical point to argue that testing assumptions is futile. Since all theories are abstractions (and thus technically "false" in their details), testing the assumptions is a waste of time compared to testing the output.
  *   **"Asking whether assumptions are realistic is psychology, not science."**
      *   **Verdict:** **Slight Caricature.** Friedman didn't use the word "psychology" specifically to dismiss it, but he did argue that descriptive accuracy belongs to a different inquiry than *positive economics*. He viewed the demand for realistic assumptions as a confusion of the purpose of theory.

  **Conclusion on the Summary:** The pop-science author did not strawman Friedman; they captured his "Instrumentalist" stance faithfully. The discomfort you feel regarding the "unrealistic assumptions are a virtue" claim is shared by almost everyone who isn't a hardline Friedmanite.

  ---

  ### 2. The Friend's Objection: Simplifying vs. Critical Assumptions

  Your friend is invoking a distinction that later philosophers of economics (like Daniel Hausman and Uskali Maki) developed to critique Friedman.

  *   **Friedman's View:** He rejects this distinction for the purpose of **testing**. To Friedman, an assumption is just a convenient way to get to the prediction. If the prediction works, the assumption is "good enough." If the prediction fails, you change the theory, not the assumption's realism.
  *   **The Critic's View (Your Friend):** There is a difference between:
      1.  **Negligibility Assumptions:** "Ignore air resistance." (False, but doesn't change the mechanism).
      2.  **Heuristic Assumptions:** "Act *as if* maximizing." (Describes the outcome, not the process).
      3.  **Domain Assumptions:** "This applies only in competitive markets." (If this is false, the theory breaks).

  **The Conflict:** Friedman argues you can't know which category an assumption falls into until you test the prediction. Critics argue you need to know the category to know *when* the prediction will fail.

  ---

  ### 3. Defender vs. Careful Critic

  If you were to debate this, here are the strongest arguments for each side:

  #### The Friedmanite Defender
  *   **The "All Models Are False" Argument:** Newtonian physics assumes space is absolute. We know now it isn't (Relativity). Does that make Newton "unscientific"? No. It makes Newton useful within a specific domain. Demanding "realistic" assumptions leads to paralysis because *no* assumption is perfectly true.
  *   **The Black Box Efficiency:** We don't need to open the black box of the human brain to predict demand curves. If the *as if* model predicts price changes correctly, requiring a realistic psychological model adds cost without adding predictive power.
  *   **Objectivity:** Judging "realism" is subjective. Judging prediction errors is objective (data either matches or it doesn't).

  #### The Careful Critic
  *   **The Lucas Critique (Structural Stability):** If a model predicts well only because of a specific historical coincidence captured by false assumptions, it will fail when policy changes. If you assume firms maximize profit *as if* they know the future, your model might work in stable times but fail during a crisis when uncertainty spikes. You need the *mechanism* to be right to trust the model under stress.
  *   **Policy Relevance:** If you want to change an outcome, you need to know the levers. A model that predicts inflation correctly based on the assumption that "central bankers are omniscient" is useless for advising a central banker who is *not* omniscient.
  *   **Learning from Failure:** If a prediction fails, knowing *which* assumption was false tells you how to fix the theory. If you only look at predictions, a failure is just a dead end.

  ---

  ### 4. Does the Logic Hold? ("False Premises $\to$ True Conclusion")

  The summary claims: *Because false premises can entail true conclusions, the only test is prediction.*

  **Logical Analysis:**
  This is a **non sequitur** (it does not logically follow).
  1.  **Premise:** It is logically valid for an argument with false premises to yield a true conclusion. (True).
  2.  **Conclusion:** Therefore, we should *never* test the premises. (False).

  **Why it fails:**
  Just because a false premise *can* yield a true conclusion doesn't mean it *will* yield a true conclusion in a new context.
  *   *Example:* Premise: "All birds are mammals." Premise: "A penguin is a bird." Conclusion: "A penguin is a mammal." (False conclusion).
  *   *Example:* Premise: "All birds are mammals." Premise: "A dog is a bird." Conclusion: "A dog is a mammal." (True conclusion, but for the wrong reason).

  If you rely only on the conclusion, you might think your theory about "Bird-Mammals" is working when you look at dogs, but it will catastrophically fail when you look at penguins. **Testing assumptions is not about logical validity; it is about robustness and scope.**

  By committing to "prediction only," you commit to **Instrumentalism**: Theories are tools, not maps. A tool doesn't have to look like the job it does (a hammer doesn't look like a nail). But if the tool breaks, you don't know why.

  ---

  ### 5. Applying the "Prediction Only" Standard to Your Examples

  If you apply Friedman's strict "prediction only" rule to these models, here is what you commit yourself to:

  #### Case A: Voters as Perfect Bayesians
  *   **The Model:** Voters update beliefs perfectly based on new information.
  *   **Friedmanite Defense:** If this model predicts election outcomes better than a model where voters are irrational, use it. It doesn't matter that cognitive science proves humans are bad at Bayesian updating.
  *   **The Risk:** This model will likely fail to predict the rise of populism, misinformation cascades, or polarization. Because the *mechanism* (how information is processed) is wrong, the model cannot predict what happens when the information environment changes (e.g., the advent of algorithmic social media feeds).
  *   **Commitment:** You commit to a model that works in stable information environments but blinds you to structural shifts in democracy.

  #### Case B: Epidemic Model with Uniform Mixing
  *   **The Model:** Everyone has an equal probability of contacting everyone else (no networks, no superspreaders).
  *   **Friedmanite Defense:** If the curve fits the first 3 weeks of exponential growth, the model is valid. The fact that people don't actually mix uniformly is irrelevant "noise."
  *   **The Risk:** This is dangerous for policy. Uniform mixing suggests that random restrictions work. Networked mixing (reality) suggests that targeting superspreading events works much better.
  *   **Commitment:** You commit to a model that might predict the *peak* of the wave correctly but gives you the wrong advice on how to *flatten* it.

  ### Summary
  The airport book accurately summarizes Friedman's **Instrumentalism**. Friedman really did believe that unrealistic assumptions were a sign of a powerful theory.

  However, the logical leap from "false premises can yield true conclusions" to "ignore premises" is where the danger lies.
  *   **If you want to predict prices in a stable market:** Friedman's approach is efficient and robust.
  *   **If you want to design policy, understand crises, or intervene in a system:** Your friend's distinction is vital. You need the assumptions to be *structurally* true, not just predictively convenient, or you risk building a model that works until the moment you need it most.
