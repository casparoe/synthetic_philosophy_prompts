      *   *Intervention:* Training studies exist but effects are usually transient.
      *   *Weight:* Low. Cannot support strong policy/behavioral change claims (credit card debt).

  6.  **Address the LLM Claim:**
      *   LLMs are next-token predictors. They don't "think" like humans. Using them to prove human linguistic determinism is circular or irrelevant.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic but accessible (1st-year psych level). Objective, not taking sides but clarifying the science.
      *   *Structure:*
