answer: |-
  1. Van Fraassen's Reflection translates to requiring your current model's predicted probability for an event to equal the expected value of tomorrow's retrained model's probability for that same event, assuming the retraining pipeline performs ideal Bayesian updating. This establishes a martingale condition where the expected drift between today's output distribution and tomorrow's output distribution is zero, provided you are certain the update mechanism processes new evidence without systematic error.

  2. The diachronic Dutch book argument becomes a claim about arbitrage: if today's model violates this martingale condition, an adversary can construct a sequence of trades against today's model and tomorrow's model that guarantees a loss regardless of the ground truth. This exploitability arises because the discrepancy between current and expected future probabilities allows locking in a risk-free profit via proper scoring rules or betting markets aligned with your model's outputs.

  3. The concepts of calibration, expected future outputs, and martingale no-drift conditions map cleanly onto the probabilistic coherence required by the principle. Your intuition that valid Bayesian updating implies a martingale sequence of model predictions is mathematically faithful to the epistemological constraint under ideal conditions.

  4. The requirement that you be "certain you'll update by conditionalizing" stretches when applied to an automated pipeline known to suffer from intermittent label-noise bugs. Epistemology assumes a rational agent correcting errors, whereas your engineering context involves a stochastic process sometimes injecting known systematic miscalibration that violates the ideal update assumption.

  5. Half-deferral is a flat violation of the martingale condition and would be punished by a diachronic Dutch book if the future model were actually rational, but it functions as shrinkage regularization against your known pipeline noise. In this framework, it looks like intentionally introducing drift to counteract expected negative drift from the bug, effectively treating the broken pipeline as adversarial noise rather than genuine evidence.

  6. The residue is not a gap in your vocabulary but a sign the original principle assumes rational updates and is silent on cases where the update mechanism is known to be irrational. The principle ceases to prescribe coherence when the "future self" (tomorrow's model) is known to be systematically miscalibrated, leaving half-deferral as an engineering heuristic outside the scope of normative epistemology.
