answer: |-
  **Framing Note:** *Per your instruction, I considered four framings: (1) a metaphysical inquiry into the ontology of uncertainty; (2) a normative epistemology of justification; (3) a semantic analysis of GUM terminology; and (4) a functionalist account of procedural objectivity. I selected (4). Metaphysics is too detached from practice; normative epistemology risks becoming prescriptive rather than descriptive; semantics is too narrow. The functionalist framing allows us to treat the measurement procedure as the truth-maker for the probability claim, which best captures the auditable, convergent nature of Type B evaluation.*

  ***

  **Project Title:** Procedural Propensities: Resolving the Type B Uncertainty Problem in Metrology and Beyond

  **Research Question**
  Can a propensity interpretation grounded in the *measurement procedure* rather than the physical object or the agent's belief account for the objectivity of Type B uncertainty evaluations in metrology?

  **Problem Statement**
  The *Guide to the Expression of Uncertainty in Measurement* (GUM) mandates that all uncertainty components, whether derived from statistical series (Type A) or other means (Type B), be converted to standard uncertainties and propagated identically. This mathematical unification masks a conceptual fracture. Type A uncertainties fit comfortably within frequentist or objective Bayesian frameworks. Type B evaluations—based on calibration certificates, manufacturer specs, or physical reasoning about temperature gradients—do not. They are not long-run frequencies (the specific calibration event is not repeated); they are not subjective credences (they are auditable and corrigible; a metrologist can be *wrong* about a Type B evaluation in a way one cannot be wrong about one's own credence); and they are not propensities of the object (a mass standard does not possess a chancy disposition to be heavy).

  Current philosophical literature often resolves this by collapsing Type B into subjective Bayesianism. This is insufficient for metrology. In interlaboratory comparisons, labs do not merely report coherent beliefs; they converge on values under audit. If Type B were purely subjective, divergence would be permissible provided coherence was maintained. The practice, however, treats Type B evaluations as factive claims about the measurement situation that can be corrected by peers. There is a gap in the philosophy of science for an interpretation of probability that accommodates non-frequency, non-subjective, yet objective probability claims.

  **Proposed Account: Procedural Propensity**
  I propose that Type B uncertainty statements are best understood as ascriptions of *procedural propensity*. On this view, the probability does not attach to the object (the mass) nor the subject (the metrologist), but to the *measurement procedure* as a dispositional property. A calibration certificate does not describe a frequency of errors, nor a degree of belief; it describes the disposition of the calibration *process* to yield values within a specific range under specified conditions. The single measurement result inherits its uncertainty from the method's repeatable behavior, even if the specific measurement is not repeated. This preserves objectivity (the procedure has real dispositions) without requiring frequentism (the disposition exists even in single cases) or subjectivism (the disposition is independent of the agent's credence).

  **Methodology**
  This project will not proceed via armchair conceptual analysis or intuition pumping. Metrology is a mature, codified practice with explicit norms for dispute resolution. The method will be *practice-based ontology*. I will reconstruct the logic of resolution used in key interlaboratory comparisons (Key Comparisons) where Type B evaluations were the source of discrepancy. By analyzing audit trails and correction reports from my thirty years in national measurement institutes, I will identify the criteria used to judge a Type B evaluation as "correct" or "incorrect."

  This empirical grounding distinguishes the project from standard philosophical treatments of uncertainty. If the "procedural propensity" account is correct, it should map onto the actual reasons auditors give for rejecting a lab's uncertainty budget (e.g., "you underestimated the thermal gradient" is a claim about the procedure's interaction with the environment, not about the lab's belief state).

  **Generalization and Scope**
  A secondary aim is to test the portability of the procedural propensity account beyond metrology. I will examine two cases where probabilities are generated by repeatable computational procedures applied to non-repeatable events:
  1.  **Climate Event Attribution:** Claims that a specific heatwave was made *N* times more likely by warming. There is no frequency of "this heatwave," but there is a climate model procedure run under different forcing conditions.
  2.  **Individualized Risk Scores:** Medical or actuarial models assigning risk to a single individual based on population data processed through a specific algorithm.

  In both cases, the probability seems to reside in the model's procedure rather than the world's frequency or the agent's belief. If the procedural propensity account explains the objectivity of Type B uncertainty, it should similarly clarify the ontological status of these model-generated probabilities.

  **Failure Conditions and Scope Management**
  Honesty about scope is critical for a twelve-month, part-time project.
  *   **Failure Condition 1 (Circularity):** The project fails if "procedure" cannot be individuated without referencing the very uncertainties it is supposed to ground. If defining the procedure requires specifying the uncertainty bounds, the account is circular.
  *   **Failure Condition 2 (Collapse):** The project fails if the audit criteria for Type B evaluations ultimately reduce to intersubjective agreement (consensus) rather than facts about the procedure. If "correctness" is just "what the key lab says," the account collapses into social constructivism or refined subjectivism.
  *   **Scope Cut:** The generalization to climate and risk (Section above) is the most vulnerable component. If the metrological case proves more complex than anticipated, I will cut the generalization section entirely. The core contribution—resolving the Type A/Type B tension in metrology—stands on its own. The extension cases are illustrative tests, not foundational pillars.

  **Deliverable and Timeline**
  *   **Months 1-3:** Reconstruction of GUM logic and selection of three specific interlaboratory comparison case studies where Type B disagreement was pivotal.
  *   **Months 4-6:** Drafting the procedural propensity argument; mapping case study resolutions against the philosophical account.
  *   **Months 7-9:** Testing the account against climate attribution literature; refining failure conditions.
  *   **Months 10-12:** Writing and revision of the 8,000-word paper for submission to *Philosophy of Science* or *Studies in History and Philosophy of Modern Physics*.

  **Significance**
  This project bridges a gap between the formal epistemology of probability and the actual practice of measurement science. It offers a rigorous philosophical home for the "everything else" category of uncertainty that underpins modern infrastructure, validating the intuition that Type B evaluation is objective without forcing it into a frequentist or subjectivist Procrustean bed.
