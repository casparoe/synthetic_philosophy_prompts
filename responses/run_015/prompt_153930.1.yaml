answer: |-
  This is a fantastic chain of reasoning. You should feel good about building it; it's tight, the terminology (*narrative capture*, *compression constraint*) is precise, and it correctly identifies why the "it's just a movie" defense feels insufficient. Your friend is also right to push it to the breaking point, because that's where the hidden assumptions reveal themselves.

  You asked which step to throw out. You should **reject Step (6)**, but specifically because it lacks a condition of **culpability**.

  Here is why Step (6) is the failure point, why it looked correct to you, and how fixing it saves your original intuition without collapsing into your friend's absurdity.

  ### The Break Point: Step (6)

  > *(6) Causing others to hold false and discreditable beliefs about someone just is what reputational injury consists in.*

  This step looks fine because it matches our intuition about slander: if I lie about you and people think worse of you, I have harmed you. But in the context of your argument, this definition is too broad. It equates **error** with **injury**.

  For reputational injury to occur, the false belief must be the result of a **violated duty**.

  If I am a historian writing a peer-reviewed paper, I have a high duty of forensic accuracy. If I compress timelines there, I have violated my duty, and the resulting false belief is an injury.
  If I am a eulogist speaking at a funeral, my duty is to the grieving living, not to the forensic record. Omitting cruelty there is not a violation of duty; it is a fulfillment of the ritual's purpose.
  If I am a biopic filmmaker, my duty is hybrid: I must entertain, but I am trading on a real person's name.

  **Why Step (6) fails:** It treats all false beliefs as morally equivalent, regardless of the context in which they were generated. It ignores the **Genre Contract**. When an audience watches a biopic, they enter a contract where they accept *some* compression and dramatization as the price of admission. If the falsehoods fall within the "tolerance zone" of that contract (e.g., merging two minor colleagues into one for clarity), no duty is violated, and therefore no reputational injury occurs, even if the belief is technically false.

  Injury only occurs when the filmmaker exceeds the license granted by the genre—when they prioritize drama over truth in ways that materially alter the moral character of the subject *without signaling that they are doing so*.

  ### How This Blocks Your Friend's Reductio

  Your friend's counter-argument relies on the idea that *any* distortion is a wrong. By modifying Step (6) to include **culpable violation of duty**, you stop the slide:

  1.  **The "All Narratives" Problem:** A eulogy does not wrong the subject because the speaker is not violating a duty of forensic accuracy; their duty is pastoral. A historical novel does not wrong the subject if the cover says "A Novel," because the Genre Contract explicitly signals invention. A biopic wrongs the subject *only if* it presents invention as fact in a way that breaches the audience's trust.
  2.  **The "Flattery" Problem:** Your friend argues that if false belief is the wrong, then flattering falsehoods are also wrong. But under the revised Step (6), reputational injury requires the belief to be *discreditable*. Flattering falsehoods may distort history, but they do not damage the *reputational residue* (Step 1). You cannot harm someone's standing by inflating it. (Unless you argue that inflated standing sets them up for a later fall, but that's a secondary effect, not direct injury).
  3.  **The "Success Paradox":** Your friend claims the more influential the film, the worse the wrong. Under the revised view, a popular film that stays within the bounds of responsible dramatization commits *no* wrong. A popular film that relies on malicious slander commits a *large* wrong. The scale of the wrong depends on the **degree of breach**, not just the **scale of distribution**.

  ### The Cost: What You Lose and What You Keep

  You asked what you end up paying if you give up the original Step (6).

  **What you lose:**
  You lose the claim that *structural compression itself* is the moral problem. You cannot argue that the mere arithmetic of fitting a life into 120 minutes is inherently wrongful. You have to concede that some invention is permissible, perhaps even necessary, to convey "emotional truth."

  **What you keep (and strengthen):**
  You keep the core claim that **biopics are morally loaded in a way the industry ignores.** In fact, your argument becomes sharper. Instead of saying "Biopics are bad because they lie," you can say:

  > "Biopics are dangerous because they operate in a **moral gray zone of duty**. They claim the authority of history (using real names, dates, archives) while demanding the license of art (inventing scenes, dialogue, motivations). The industry ignores this by treating the 'Genre Contract' as a get-out-of-jail-free card, assuming audiences know 'it's just a movie.' But because of **Narrative Capture** (Step 4), audiences *forget* the contract. They absorb the fiction as fact. Therefore, the filmmaker has a heightened duty of care to ensure that necessary compressions do not inadvertently slander the subject. Most biopics fail this duty not because they compress, but because they compress *carelessly* or *sensationalistically*."

  ### Why Step (6) Looked Fine to You

  It looked fine because **Narrative Capture** (Step 4) makes the *effect* of a biopic look like the *effect* of slander. If the end result is "the public believes a lie," it feels like the moral input must have been "a lie was told."

  But the moral input wasn't just "a lie." It was "a dramatized interpretation within a commercial medium." The gap between the input and the output is where the audience's responsibility lies, too. By making Step (6) absolute, you absolved the audience of the responsibility to understand the medium, and placed the entire burden of "truth maintenance" on the filmmaker.

  ### The Revised Chain

  To salvage your position, Step (6) becomes:

  > *(6*) Causing others to hold false and discreditable beliefs about someone constitutes reputational injury **when the maker violates a reasonable duty of accuracy appropriate to the format.**

  And Step (7) becomes:

  > *(7*) Therefore, the makers of a biopic wrong the real dead **if and only if** they exceed the dramatic license reasonably expected by the audience, and the better-made and more widely seen the film, the larger the wrong **when that license is exceeded.**

  This allows you to tell your friend: "You're right that all narration distorts. But not all distortion is a violation of duty. Biopics are uniquely morally loaded because they invite the audience to trust them as history while behaving like fiction, and *that* specific tension is where the wrongdoing lives."

  You keep the bite of your critique without accepting that a eulogy is a crime.
