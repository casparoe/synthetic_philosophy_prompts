      *Wait, one nuance:* Is it "reject (3)" or "reject (6)"? Usually, if a premise is flawed, you reject the premise. The conclusion follows validly from the premises, so if the premises are unsound, the conclusion is unsupported. Rejecting (3) is the most direct way to dismantle the argument.

