answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, University Archives
  **FROM:** Acquisitions and Ethics Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding the Acquisition of the State Residential Institution Records (1930s–1970s)

  **I. EXECUTIVE RECOMMENDATION**

  The Acquisitions and Ethics Committee recommends that the University Archives **acquire the proposed collection subject to specific binding conditions.** We advise against unconditional acquisition, which fails to address documented ethical harms, and we advise against outright rejection, which would constitute an abdication of our mandate to preserve evidence of state power.

  Specifically, we recommend acquisition contingent upon the implementation of a **Contextual Remediation Protocol (CRP)**. This protocol incorporates the core function of the advocates' proposed "negative catalog" but structures it as a phased, grant-funded metadata project rather than an immediate diversion of conservation resources. Access to sensitive personal data within the collection must remain restricted for a period of no less than twenty years, while systemic administrative data shall be made available for research under the supervision of the CRP oversight committee.

  **II. ETHICAL FRAMEWORK AND STAKES**

  The Committee recognizes this decision as a precedent-setting case regarding the archive's relationship to state violence and marginalized communities. We have evaluated this proposal through our provisional distinction between *archival presence* (the fact of being named in a record) and *archival subjecthood* (the recognition of narrative agency).

  The collection in question offers profound *archival presence*. It contains the bureaucratic machinery of a state institution that operated without public inquiry. To reject this collection outright, as the Special Collections Director warns, would indeed erase the material evidence of systemic practices. It would protect the archive from complicity at the cost of historical accountability. If these records are not preserved here, they risk destruction, and the mechanisms of control they document will vanish from the historical record.

  However, the coalition of descendant-family advocates correctly identifies that *presence* without *subjecthood* reproduces the original harm. To ingest these records without remediation is to allow the state's categorical gaze to become the archive's organizing principle. In this scenario, the confined remain "cases" rather than people. The archive becomes a storage facility for the state's unchallenged taxonomy. This is not neutrality; it is the continuation of administrative violence by other means.

  **III. ADDRESSING THE DIRECTOR'S OBJECTIONS**

  The Special Collections Director raises two critical objections: that the advocates' framework imposes an "anachronistic moral architecture" and that the "negative catalog" diverts scarce resources from physical stabilization. The Committee has weighed these concerns heavily.

  *On Anachronism:*
  We reject the assertion that documenting silence is anachronistic. Archival description is never a neutral act; it is always an interpretive layer applied to raw material. To describe a file simply as "Disciplinary Hearing, Case 402" is to accept the institution's definition of the event. To describe it as "Disciplinary Hearing, Case 402; patient appeal record destroyed per 1954 Protocol B" is not imposing modern morals, but rather accurately describing the *provenance* and *completeness* of the record. It is standard archival practice to note missing pages or damaged folders; noting the structural absence of patient voice is a extension of that same descriptive duty. It clarifies the nature of the evidence rather than distorting it.

  *On Resource Diversion:*
  The Director's concern regarding conservation resources is valid but manageable. We cannot allow physical stabilization to proceed in a vacuum that ignores the ethical context of the materials. However, we agree that conservation cannot be held hostage by metadata projects. Therefore, our recommendation stipulates that the Contextual Remediation Protocol be funded through external grants specifically designated for ethical processing and community engagement, not from the general conservation endowment. The physical stabilization of the collection may proceed immediately upon acquisition, but *intellectual access* and *public description* will remain suspended until the initial phase of the CRP is complete. This ensures the physical record is saved without forcing a choice between preservation and ethics.

  **IV. IMPLEMENTATION TIMELINE AND CONDITIONS**

  To make this recommendation actionable, the Committee proposes the following conditions for the Deed of Gift:

  1.  **Establishment of the Contextual Remediation Protocol (CRP):** A joint working group comprising archive staff, descendant advocates, and external ethical advisors will be formed within 90 days of acquisition.
  2.  **Phased "Negative Catalog" Implementation:**
      *   *Phase 1 (Months 1–12):* Identification of all unique individuals referenced by case number. Cross-referencing with known destroyed petition types based on administrative memos within the collection.
      *   *Phase 2 (Months 13–24):* Creation of a searchable index that explicitly flags where individual voice is absent due to bureaucratic policy. This index will be public, even if the underlying records remain restricted.
  3.  **Funding Stipulation:** The University must commit to seeking specific grant funding (e.g., from humanities councils or social justice foundations) to cover the labor costs of the CRP. If funding is not secured within 18 months, the access restrictions on the collection shall remain in place indefinitely.
  4.  **Access Restrictions:** Personal identifiers (names, specific medical/behavioral details) shall be redacted or restricted for 20 years to protect the privacy of the confined and their living descendants. Researchers may access administrative patterns and redacted case files for the purpose of studying systemic abuse.

  **V. CONCLUSION**

  The Committee believes that an archive cannot serve justice merely by storing evidence; it must also curate the context in which that evidence is understood. Acquiring this collection unconditionally saves the paper but sacrifices the people. Rejecting it saves the archive's conscience but sacrifices the history.

  By acquiring the collection subject to the Contextual Remediation Protocol, we accept the burden of the past without replicating its methods. We preserve the state's record of control while simultaneously preserving the record of its silences. This approach acknowledges that while we cannot retroactively grant *archival subjecthood* to the deceased, we have a duty to ensure their absence is not mistaken for consent.

  We request the Board's approval of this conditional acquisition plan by Thursday's vote.

  **Respectfully Submitted,**

  The Acquisitions and Ethics Committee
