answer: |-
  This is a fantastic project. Forty listeners is forty more than most philosophy papers get, and recording in the library gives it a great vibe. Your guest's position is a version of "associative obligations" grounded in political coercion (likely influenced by thinkers like Christopher Heath Wellman or similar liberal nationalists). It's a sturdy view, but you're right: the "that's nationalism, not patriotism" distinction is often used as a shield against historical reality.

  Here are eight questions designed to be spoken, not read. They are conversational but sharp. I have included the predicted answer and a specific follow-up for each.

  ### The Interview Questions

  **1. The Scope/Border Objection**
  "You ground special duties in 'shared subjection to a coercive legal order.' But I'm subject to coercion by my school district, my state, and the WTO, not just the federal government. Why does the magic circle of patriotism stop at the national border? Why isn't 'School District Patriotism' a virtue? What makes the *nation-state* the only level where coercion turns into loyalty?"

  *   **Predicted Answer:** She will likely say the nation-state is the *primary* site of coercive enforcement that secures basic rights and justice, whereas school districts are delegated authorities. The state is the "comprehensive" coercive order.
  *   **Follow-up:** "But borders shift. If the state is the magic circle because it coerces me, and yesterday this land was part of a different state or no state, does my duty change overnight? If the duty comes from the *fact* of coercion, why does it matter if the border was drawn by a war or a treaty?"

  **2. The Nationalism Distinction (Setup)**
  "A lot of people hear 'patriotism' and think of flags and anthems. You distinguish this from nationalism. For you, is patriotism compatible with being critical of your country's foreign policy, or does the 'emotional attachment' part require me to root for my team even when they're fouling?"

  *   **Predicted Answer:** She will say patriotism is compatible with criticism; in fact, true patriotism *requires* criticism to keep the country just. Nationalism is blind loyalty or ethnic superiority.
  *   **Follow-up:** "So the patriot loves the *ideals* of the institution, not necessarily the current players. But what if the 'players' say they are acting in the name of those ideals to do something ugly?"

  **3. The Nationalism Distinction (Pressure)**
  "Let's say the government argues that violating the rights of a minority group is necessary for the stability of the legal order—the very order that grounds our duties. If I'm a patriot on your view, do I prioritize the stability of the institution or the rights of the minority? Where does the loyalty land?"

  *   **Predicted Answer:** She will likely say you prioritize justice, because the institution is only valuable insofar as it is just. Patriotism isn't loyalty to a gang; it's loyalty to a *just* scheme.
  *   **Follow-up:** "But if the institution is the *source* of the duty, and I reject the institution's decision in the name of a higher justice, aren't I acting as a cosmopolitan, not a patriot? At what point does 'fixing my country' become 'rejecting my country's authority'?"

  **4. The Nationalism Distinction (The Trap)**
  "History is full of people who felt deep emotional attachment to their state, believed they were sustaining its institutions, and did terrible things to outsiders. They wouldn't have called themselves nationalists; they would have called themselves patriots. If your definition relies on the *motivation* being 'sustaining just institutions,' but the person *believes* they are doing that while committing atrocities, is their patriotism fake only in hindsight?"

  *   **Predicted Answer:** She will argue that their view of justice was mistaken, so their patriotism was misdirected, but not that patriotism itself is the problem. She'll maintain the distinction holds conceptually even if people mess it up in practice.
  *   **Follow-up:** "So the distinction works in theory, but in the wild, the 'patriot' label covers both the person fighting for civil rights and the person fighting to deny them. If the label covers both, is it doing any work for us today, or is it just a badge people wear to claim moral cover?"

  **5. The Cost of Loyalty (Kill/Die)**
  "Does patriotism, on your view, essentially involve being ready to kill or die? If my country goes to war, does the 'special duty' I owe my compatriots outweigh the duty I owe a foreigner not to be harmed by my country's military?"

  *   **Predicted Answer:** She will likely say patriotism *can* require sacrifice, but only for a *just* war. She won't admit it overrides the duty not to harm innocents abroad.
  *   **Follow-up:** "But soldiers don't get to decide if a war is just; they get orders. If patriotism is the motivational fuel for the military, and the military harms foreigners, doesn't cultivating this virtue necessarily mean cultivating a willingness to prioritize compatriot safety over foreigner life?"

  **6. The Victim's Perspective**
  "I have a friend whose family has been fighting deportation for years. They live under the law, they're coerced by the state, but the state is actively trying to remove them. On your view, does the 'shared subjection' ground a duty for them to feel patriotic? Or does the state's hostility toward them void the reciprocity?"

  *   **Predicted Answer:** She will likely say the state is failing *them*, not vice versa. Their lack of patriotism is a symptom of the state's injustice, not a moral failing on their part.
  *   **Follow-up:** "So patriotism is a duty only when the state is behaving well? That makes it sound less like a binding obligation and more like a reward we give the state for good behavior. If it's conditional on performance, is it really a 'duty' or just a transaction?"

  **7. The "Tenant Patriotism" Challenge**
  "I have a theory I want to run by you. Call it 'Tenant Patriotism.' I didn't build this country, I can't easily leave it, and the laws apply to me whether I like it or not. So my attachment isn't gratitude or love; it's custodial. I maintain the building I'm stuck in so it doesn't collapse on my neighbors. Does this fit your account, or does removing the 'love' and 'identity' part break your theory?"

  *   **Predicted Answer:** She will likely say this is too thin. She'll argue that without the emotional/identity component (the "love" part), institutions won't *sustain* themselves during hard times. People need more than duty; they need passion.
  *   **Follow-up:** "But isn't that passion dangerous? If 'Tenant Patriotism' is safer and more stable because it's based on responsibility rather than emotion, why insist on the emotional virtue? Are you defending patriotism because it's necessary, or because it feels nice?"

  **8. The Limit of Virtue**
  "In virtue ethics, every virtue has an excess. Courage becomes recklessness. If patriotism is a virtue, what does 'excessive patriotism' look like on your view? Is there a point where I care too much about my compatriots?"

  *   **Predicted Answer:** She will say excessive patriotism is when it turns into nationalism or chauvinism—when you think your compatriots are *better* than others, not just that you have special duties to them.
  *   **Follow-up:** "But if the theory grounds the duty in 'shared subjection,' isn't the distinction just a semantic game? If I feel the duty intensely, it's patriotism. If I feel it too intensely, you call it nationalism. Who decides where that line is drawn?"

  ***

  ### The Commitment

  Here are the three questions I would put at the top of the list, and the one that could actually change her mind.

  **Top 3 Questions:**
  1.  **Question 1 (Scope/Border):** This is the foundational metaphysical problem. If she can't explain why the school district doesn't count, the "coercion" argument feels arbitrary. It sets the stage for the whole interview.
  2.  **Question 7 (Tenant Patriotism):** This is your strongest philosophical contribution. It accepts her premise (coercion) but challenges her conclusion (emotion/virtue). It forces her to defend the *risk* of emotion.
  3.  **Question 6 (The Victim's Perspective):** This humanizes the debate. It moves away from abstract borders to real people. It tests whether her theory is for citizens or for *people*.

  **The View-Revising Question:**
  **Question 7 ("Tenant Patriotism").**
  *Reason:* Philosophers hate having their necessary conditions stripped away. Her argument relies on the claim that *institutions cannot survive on duty alone; they need emotional identification.* Your "Tenant" idea challenges that directly. It suggests we *can* sustain justice through custodial responsibility without the "love" that leads to nationalism. If she accepts "Tenant Patriotism" as sufficient, she admits the "virtue/emotion" part of patriotism is unnecessary. If she rejects it, she has to admit she values the *emotion* despite the risks of nationalism. That is a genuine dilemma that might force her to refine the "virtue" aspect of her theory.

  **A Note on the "Nationalism Run" (Questions 2, 3, & 4):**
  I am going to be definite here: **This sequence is risky.**
  In a written paper, this triad works. In a 40-person podcast recorded in a library, asking three consecutive questions that essentially say "I know you're going to dodge this" can make the guest defensive. If she clams up, you lose the audience.
  *My advice:* Keep Question 4 (The Trap). It's the strongest of the three. You can fold the essence of 2 and 3 into the setup for 4. Don't let her burn through three "get out of jail free" cards in a row; hit her with the historical reality check (Q4) immediately after she defines the terms.

  **One Bad Idea:**
  **Question 8 (Excessive Patriotism).**
  *Reason:* It's too academic. "Virtue ethics" and "the mean" are jargon that kills conversation flow. She will give a textbook answer ("It becomes nationalism") and the audience will tune out. You already cover the danger of excess in Question 4 and Question 7. Cut Q8 to save time for the "Tenant" discussion, which is more original.
