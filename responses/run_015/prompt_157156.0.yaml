answer: |-
  ### 1. Legal Theory: The Metaphysical Schism

  Your diagnosis of the tension is precise. Tort law does not operate under a single, consistent theory of causation across the liability and apportionment stages. It operates under a *split* theory, driven by competing policy goals.

  **The Theory Presupposed**
  At the liability stage (the "but-for" or "substantial factor" test), the law presupposes a **threshold theory of causation combined with normative imputation**. Strictly speaking, the "substantial factor" test is not a rival metaphysical theory (like causation as physical process or energy transfer); it is a *legal fiction* layered over the counterfactual theory. When courts say two sufficient fires are each a "cause" of the whole harm, they are not making a metaphysical claim that Fire A caused 100% of the burning and Fire B *also* caused 100% of the burning in a physical sense. They are making a normative claim: *because* Fire A was sufficient and wrongful, the defendant bears the responsibility for the loss. The metaphysics (counterfactual dependence) is suspended to serve the policy (loss spreading and deterrence).

  At the apportionment stage (comparative fault/contribution), the law quietly shifts to a **gradualist theory of causal potency**. Here, causation is treated as a quantity that can be divided. This is metaphysically inconsistent with the liability stage. If Fire A caused the *entire* loss (as established for liability), it is incoherent to say it caused only 50% of the loss (for apportionment).

  **Forced vs. Consistent**
  The doctrine *forces* the reading that the liability stage is counterfactual theory + normative overlay. Why? Because the counterfactual test explicitly fails in overdetermination cases (the house burns anyway). If the court insists on liability despite the failure of the but-for test, it must be invoking a non-causal principle (fairness, policy) to bridge the gap. The "substantial factor" language is the verbal mask for this bridge.

  The apportionment stage *forces* the reading that causation comes in degrees. You cannot sum percentages to 100 unless the underlying property is divisible.

  **Can a Single Theory Underwrite Both?**
  No single metaphysical theory of causation can underwrite both without contradiction.
  *   If causation is binary (all-or-nothing), apportionment is impossible.
  *   If causation is gradable (degrees of influence), then the liability finding that *each* defendant caused the *whole* harm is false.
  The law resolves this by treating "cause" in the liability phase as a proxy for "responsible agent," and "cause" in the apportionment phase as a proxy for "relative blameworthiness or potency." The term "causation" is doing two different jobs.

  **Confidence:** High. This aligns with the dominant "Realist" and "Economic" analyses of tort law (e.g., Posner, Calabresi) and philosophical critiques (e.g., Hart & Honoré, Wright). The split between factual cause (metaphysical) and proximate cause/responsibility (normative) is a standard feature of doctrinal analysis.

  ***

  ### 2. Historical Practice: The Ambiguity of Overdetermination

  Historians use the term "overdetermined" loosely, often conflating your four definitions. However, their practice reveals which one they are genuinely committed to.

  **Analyzing the Four Definitions**
  *   **(i) & (ii) Strict Sufficiency:** Historians are rarely committed to this. It is historically implausible that *any* single condition (e.g., the assassination of Franz Ferdinand) was physically sufficient on its own to cause WWI without the background conditions. If historians explicitly adopted (i), their practice would become incoherent: they could not logically identify a "primary" cause, as all sufficient causes are equal.
  *   **(iii) Epistemic Uncertainty:** This is common in micro-history (we don't know which bullet killed the victim), but rarely in macro-history (origins of wars).
  *   **(iv) Robustness:** This is the definition historians are *actually* committed to. When a historian says the French Revolution was "overdetermined," they mean the outcome was stable across a wide range of possible variations in initial conditions. The system was primed to snap; the specific trigger was less important than the tension.

  **The Meaning of "Primary Cause"**
  If the outcome is overdetermined in the sense of Robustness (iv), "primary cause" cannot be a metaphysical notion of "most causal power." It must be pragmatic. It usually signifies one of three things:
  1.  **Contrastive Salience:** Why 1789 and not 1788? The harvest failure of 1788 is the "cause" relative to the background of long-term structural decay.
  2.  **Intervention Point:** The factor that, if removed *ex ante*, would have been most feasible to change (even if theoretically other factors could have done it).
  3.  **Narrative Agency:** The factor that involves human decision rather than structural drift. Historians prefer causes that look like actions.

  **Incoherence and Change**
  If historians adopted Strict Sufficiency (i) explicitly, they would have to abandon the "Turning Point" narrative. A turning point implies the outcome was contingent *at that moment*. Overdetermination implies the outcome was inevitable *before that moment*. To adopt (i) would require historians to write structuralist sociology rather than narrative history. They would have to stop naming "Great Men" or specific decisions as causes and instead describe fields of force.

  **Confidence:** Moderate-High. While the philosophy of history (e.g., Veyne, Carr, White) supports this, individual historians vary wildly in their theoretical self-awareness. Many use "overdetermined" to mean "many causes" without rigorous modal analysis.

  ***

  ### 3. Stress-Testing Your Rule (The Shapley Value)

  Your rule is mathematically identical to the **Shapley Value** from cooperative game theory, recently applied to causal attribution in machine learning and philosophy (e.g., by Halpern and Pearl).

  **The Pre-emption Case**
  In the pre-emption case (Fire A burns the house; Fire B arrives later), your rule assigns 0.5 to each.
  *   **Is this a defect?** It depends on whether you value *actual outcome* or *causal capacity*. The law says B is not a cause because B did not *change* the outcome in the actual world. Your rule says B is a cause because B *would have* changed the outcome in a counterfactual world where A was absent.
  *   **Implication:** This result suggests the law's distinction between symmetric overdetermination and pre-emption is not metaphysical, but normative. The law excuses the back-up shooter because punishing them doesn't serve deterrence (the harm happened anyway) or compensation (they didn't touch the victim). Your rule captures the *danger* posed by B, which is equal to A. If your goal is risk assessment (incident investigation), your rule is superior to the legal rule. If your goal is assigning blame for *actual* harm, the legal rule is more intuitive.

  **Reconstructing Liability**
  Your rule *cannot* reconstruct the liability stage of tort law as currently written.
  *   **The Math:** The Shapley Value always sums to 1 (the total outcome).
  *   **The Law:** Joint and several liability requires the sum of liabilities to be *n* (where *n* is the number of sufficient defendants). Each pays 100%.
  *   **The Conflict:** To use your rule for liability, you would need a threshold function (e.g., "If Shapley > 0, Liability = 1"). But this discards the quantitative precision of your rule. You cannot have it both ways: you cannot claim causation is a fixed quantity summing to 1 *and* claim each sufficient cause bears full responsibility for the whole.

  **What Historians Would Give Up**
  To adopt your rule, historians would have to give up **singular agency**. They could no longer say "The assassination caused the war." They would have to say "The assassination and the alliance system and the mobilization plans each share causal credit, weighted by their marginal contribution across possible timelines." This destroys the dramatic arc of history. It turns history into a risk model.

  **Confidence:** High. The mathematical properties of the Shapley Value are fixed. The incompatibility with Joint and Several liability is logical. The implication for historical narrative is a strong inference based on how narratives function.

  ***

  ### 4. Pragmatics vs. Metaphysics: The Map of Disagreement

  You are correct: the deepest disagreement is not about the metaphysics of causation, but about the **teleology of attribution** (what the attribution is *for*).

  **Underdetermination by Metaphysics**
  Both law and history are radically underdetermined by metaphysics.
  *   **Law:** Whether causation is "process," "counterfactual," or "probabilistic," the verdict in the two-fire case remains the same (liability) because the *rule* dictates the verdict, not the ontology. The law could adopt a Humean regularity theory or a Lewisian counterfactual theory; the "substantial factor" exception would still be required to avoid the absurd result of no liability.
  *   **History:** Whether the universe is deterministic or probabilistic, the historian still needs to select a "primary cause" to make the narrative intelligible. The metaphysics of the past does not dictate the salience of the assassination over the alliance system.

  **Fixed Quantity vs. Status**
  Your suspicion is astute.
  *   **Law:** Treats causation as a **Status** for liability (you are a causer) and a **Quantity** for damages (how much did you contribute). This is a pragmatic hybrid.
  *   **History:** Treats causation as **Salience**. It is neither quantity nor status, but *relevance to the question asked*.
  *   **Third Option:** Causation as **Attribution**. This view (championed by pragmatists like Rorty or van Fraassen) holds that causal claims are not descriptions of the world, but tools for managing expectations and responsibilities.

  **Where Metaphysics Would Bite**
  Metaphysics would only bite if the practices were forced to be consistent across contexts.
  *   **Law:** If courts were forbidden from using normative fictions and forced to stick to strict metaphysical but-for tests, overdetermination plaintiffs would lose. The practice would change drastically.
  *   **History:** If historians were forced to adhere to strict sufficiency (i), narrative history would vanish, replaced by structural modeling.
  Since neither practice allows metaphysics to constrain their goals, they remain immune to metaphysical resolution.

  **Confidence:** High. This reflects the consensus in contemporary philosophy of science and law regarding the pragmatic nature of causal selection.

  ***

  ### Least Sure Claim and Resolution

  **The Claim:** In Section 2, I claimed that historians are genuinely committed to definition **(iv) Robustness** rather than **(i) Strict Sufficiency**.

  **Why I am Least Sure:** While this fits the *best* historical practice, it does not fit the *common* historical discourse. Many historians speak as if specific events (the fall of the Berlin Wall, the death of a leader) were strictly sufficient to trigger outcomes, ignoring the background conditions required to make those events effective. They often oscillate between (i) and (iv) without noticing the contradiction. It is an empirical claim about the psychology and training of historians that is difficult to verify without a massive survey of historical texts.

  **What Would Settle It:** A systematic textual analysis of major historical monographs claiming "overdetermination," coding their usage of causal language against the four definitions. If the majority of their argumentation relies on the inevitability of the outcome despite variations in the trigger (Robustness), my claim holds. If they argue the trigger alone made the difference (Sufficiency), my claim fails. This would require a digital humanities project combining NLP analysis with philosophical coding.
