      *   Stake: Physical integrity/Future earning capacity.
      *   Odds: Opaque/Structural.
      *   House: Employer/Market.
      *   Opt-out: Destitution.
      *   Payout: Wages vs. Injury.
      *   Insurance: State redistribution (which the TA is denying).

      *Smuggled Premises:*
