      2.  Odds are transparent (you know the risk of back injury).
      3.  Stakes are fungible (money vs. health).
      4.  Reset capability (losing doesn't end the game).

      *Better Analogy:* A toll road with potholes. You must pay the toll to eat. Some cars are sturdier than others. The road owner doesn't fix the potholes because "you chose to drive."

