answer: |-
  **FINAL EXAMINATION: PHILOSOPHY OF MIND**
  **Seminar: The Unity of Consciousness**

  **Time Allowed:** 90 Minutes
  **Word Limit:** 800 Words Maximum

  **Essay Question**

  Consider Patient N, several years post-callosotomy. N displays the standard split-brain profile: she cannot name objects presented to her left visual field, and her left hand sorts objects she claims not to see. However, two unusual features complicate the standard interpretation.

  First, N acquires novel bimanual skills—such as a complex two-handed piano passage she has never practised—at close to normal speed. This coordination sits badly with the hypothesis of two independent centres of motor control. Second, on trials where a written instruction delivered to her right hemisphere conflicts with a spoken instruction to her left, her hands carry out opposing tasks. Her physiological response registers conflict (elevated skin conductance, distinct facial affect), yet her verbal report mentions only the spoken instruction. She confabulates a rationale for what her left hand did and registers no conflict at all.

  In your essay, you must address the following:

  1.  **Disambiguation:** Separate at least three claims that the slogan "two minds in one skull" runs together: (a) that there are two subjects of experience; (b) that there is one subject whose experiential contents are not all co-conscious; (c) that there are two centres of agency sharing no access.
  2.  **Evaluation:** Say which, if any, of these claims N's case supports. Explain why the evidence points in opposite directions (the piano skills vs. the conflicting instructions).
  3.  **The Counting Question:** Address whether the question "how many subjects?" is well-posed here. Specify what evidence could in principle settle it, and explain why N's own verbal report cannot settle it either way.
  4.  **Continuity:** Hold your verdict steady across the operation. If you argue there are two subjects now, explain why the pre-operative patient was not already two. If you argue there is one subject now, explain what the operation actually changed.

  ***

  **MODEL ANSWER**

  The question "how many subjects?" is well-posed, and the correct answer in Patient N's case is **one subject**. The confusion arises because the criteria for subjecthood—agency, co-consciousness, and self-report—come apart following commissurotomy. We must distinguish these criteria to see why N remains a single person despite fragmented access.

  First, we must disambiguate the three claims often conflated by the "two minds" slogan. Claim (a) posits two distinct subjects of experience, implying two distinct owners of mental states. Claim (b) posits one subject whose experiential contents are not all co-conscious; the owner is the same, but the states are not experienced together. Claim (c) posits two centres of agency sharing no access; this is a functional claim about motor control and information flow, not necessarily about ontological subjecthood. N's case supports (b) and partially refutes (c), while failing to support (a).

  The evidence points in opposite directions because it targets different criteria. The novel bimanual piano skills strongly undermine claim (c). Learning a complex, coordinated motor sequence requires a unified planning mechanism that integrates timing and pressure across both hands. If there were truly two independent centres of agency sharing no access, such rapid, novel coordination would be impossible. This suggests a unified agent underlying the motor control. Conversely, the conflict trials support claim (b). The physiological markers (skin conductance) indicate that the conflict is registered somewhere in the system, but the verbal report denies it. This suggests that while the subject is one, the experiential contents of the right hemisphere (the written instruction) are not co-conscious with the contents of the left hemisphere (the spoken instruction). The subject exists, but their access to their own states is partitioned.

  This leads to the crux: why N's report cannot settle the count. N's verbal report is produced by the left hemisphere, which lacks access to the right hemisphere's instruction. When asked to explain her left hand's action, the speaking hemisphere confabulates a rationale to maintain narrative coherence. First-person report is authoritative only when access is intact; here, the report is a post-hoc construction, not a direct window into subjecthood. Evidence that could in principle settle the count would need to track the locus of responsibility and narrative integration over time, rather than instantaneous access. Since N maintains a single autobiographical narrative (even if confabulated) and unified long-term agency (the piano), the evidence favours one subject.

  Finally, we must hold this verdict steady across the operation. If N is one subject now, she was one subject before. The operation did not split a subject into two; it severed the information channels that normally ensure co-consciousness. Pre-operatively, N was one subject with integrated access. Post-operatively, N is one subject with fragmented access. The change is epistemic and functional, not ontological. To claim the operation created a second subject would imply that subjecthood depends entirely on commissural fibres, which contradicts the unity of agency seen in the piano skills. Therefore, the operation changed what the subject can know about their own states in real-time, but it did not change who the subject is. N remains a single person struggling with internal informational barriers, not two people sharing a skull.

  ***

  **MARKING SCHEME (20 MARKS TOTAL)**

  **1. Disambiguation of Claims (4 Marks)**
  *   **Must Hit:** Clearly distinguishes between ontological subjecthood (a), phenomenological co-consciousness (b), and functional agency (c).
  *   **Common Mistake:** Treating "two centres of agency" as synonymous with "two subjects" without argument.

  **2. Analysis of Unity Evidence (4 Marks)**
  *   **Must Hit:** Uses the piano case to argue against independent centres of agency (claim c) and supports unified planning.
  *   **Common Mistake:** Dismissing the piano skill as mere motor reflex rather than evidence of unified agency.

  **3. Analysis of Conflict Evidence (4 Marks)**
  *   **Must Hit:** Uses the conflict/confabulation case to argue for fragmented access (claim b) while noting physiological conflict proves registration.
  *   **Common Mistake:** Ignoring the physiological data and focusing only on the verbal denial of conflict.

  **4. Epistemic Status of Report (4 Marks)**
  *   **Must Hit:** Explains why verbal report fails (confabulation/lack of access) and identifies what evidence would succeed (narrative/agency tracking).
  *   **Common Mistake:** Assuming the verbal report is authoritative despite the explicit confabulation described.

  **5. Pre/Post-Op Continuity (4 Marks)**
  *   **Must Hit:** Explains what changed (access/co-consciousness) vs. what remained constant (subject identity) consistent with the chosen verdict.
  *   **Common Mistake:** Arguing the operation created a new subject without explaining why the pre-op patient wasn't already two.
