      *(Self-Correction during drafting)*: Make sure to emphasize that "refusing to do arithmetic" is a rhetorical smear. LTNU *is* arithmetic, just non-Archimedean arithmetic.
      *(Refining the Thermostat/Smoke Alarm)*: Ensure I don't just say "it's good." I need to say *why* it handles the structural disagreement better. It externalizes the discontinuity.
      *(Refining the Failure Mode)*: Be honest. The biggest weakness of LTNU is usually the "bottomless pit" problem (all resources go to the worst sufferer). I should mention that.

