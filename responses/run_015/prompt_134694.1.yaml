answer: |-
  Here is the spec sheet for a theory of biological function. This is designed to stress-test the Etiological (Selected Effect) and Causal-Role accounts against the actual messiness of biological practice.

  ### **SPEC SHEET: THEORY OF BIOLOGICAL FUNCTION**

  #### **1. Case Coverage Requirements**
  A viable theory must assign functional status (or lack thereof) to the following without ad-hoc adjustments:
  *   **Normal Operation:** A heart pumping blood in a healthy mammal. (Baseline)
  *   **Clear Malfunction:** A heart with a septal defect failing to oxygenate blood. *Requirement:* Must distinguish "failing to function" from "functioning differently."
  *   **Accidental Side-Benefits:** The nose supporting glasses. *Requirement:* Must distinguish "function" from "beneficial effect."
  *   **Evolutionary Novelty:** A trait arising via mutation that aids survival *before* selection has had time to fix it in the population.
  *   **Borrowed Function (HGT/Symbiosis):** A horizontally transferred gene product in a host lineage that performs a metabolic task it was never selected for *in that specific lineage*. *Requirement:* Must account for function without requiring a selection history *within the host*.

  #### **2. Mandatory Distinctions**
  The theory cannot collapse the following conceptual pairs:
  *   **Proper Function vs. Current Causal Contribution:** It must distinguish what a trait is *for* (normative) from what it *does* (descriptive).
  *   **Selected Effect vs. Fitness-in-Context:** It must separate the historical reason for a trait's presence from its current contribution to fitness (which may change due to environmental shift).
  *   **Dysfunction vs. Mere Absence:** A broken kidney is dysfunctional; a rock has no kidneys and is not dysfunctional. The theory must ground this normativity without appealing to magic.

  #### **3. Biological Consistency Constraints**
  The theory cannot contradict established biological mechanisms:
  *   **Developmental Plasticity:** One genotype producing multiple phenotypes based on environment. *Constraint:* Function cannot be rigidly tied to a single structural outcome.
  *   **Exaptation:** Traits evolving for one use being co-opted for another (e.g., feathers for warmth $\to$ flight). *Constraint:* Function must be able to shift faster than phylogenetic history updates.
  *   **Convergent Evolution:** Different structures performing the same function (e.g., octopus vs. human eye). *Constraint:* Function must be realizable by multiple causal mechanisms.
  *   **Microbiome Functional Redundancy:** Different species in a gut performing the same metabolic role. *Constraint:* Function must be assignable to the *process*, not just the specific lineage.

  #### **4. Puzzle Dissolution**
  The theory must resolve or dissolve these philosophical edge cases:
  *   **The Swampman:** An organism created by random fluctuation with no selection history but identical causal roles to a human. *Requirement:* Decide if it has functions. If yes, history is unnecessary. If no, history is necessary.
  *   **The Super-Organ:** An organ modified to outperform its original selected effect (e.g., a genetically enhanced heart pumping 2x volume). *Requirement:* Is the new capacity the function, or is it a malfunction of the old design?

  ---

  ### **5. Known Tensions (Jointly Unsatisfiable Pairs)**
  You cannot maximize all desiderata simultaneously. These pairs represent the primary fault lines:

  *   **Historical Fidelity vs. Present Contribution:**
      *   *Conflict:* To handle **Malfunction** and **Side-Benefits**, you need History (Etiological). To handle **HGT**, **Novelty**, and **Swampman**, you need Present Contribution (Causal-Role).
      *   *Verdict:* You must choose whether function is a *legacy status* or a *current capacity*. You cannot have both without a hybrid theory that risks internal contradiction.
  *   **Normativity vs. Naturalism:**
      *   *Conflict:* To handle **Dysfunction**, you need Normativity (an "ought"). To handle **Biological Consistency** (plasticity/redundancy), you need Naturalism (descriptive mechanisms).
      *   *Verdict:* Strong normativity often requires stepping outside strict physicalist description, risking metaphysical bloat.

  ---

  ### **6. Brief Scorecard**

  | Desideratum | Etiological (SE) Account | Causal-Role (CR) Account |
  | :--- | :--- | :--- |
  | **Malfunction** | **Pass.** (Can fail to meet historical standard) | **Fail.** (If it does nothing, it has no role; if it does something, it has a function) |
  | **Side-Benefits** | **Pass.** (Not selected for) | **Fail.** (If it contributes to capacity, it's a function) |
  | **HGT / Novelty** | **Fail.** (No selection history in host) | **Pass.** (Causal contribution exists immediately) |
  | **Swampman** | **Fail.** (No history = no function) | **Pass.** (Same causal roles = same function) |
  | **Plasticity/Redundancy** | **Mixed.** (Struggles with multiple realizers) | **Pass.** (Focuses on the causal output) |

  **Summary:** Etiological accounts win on normativity and pathology; Causal-Role accounts win on physiology, novelty, and non-standard evolutionary contexts.

  ---

  ### **7. Meta-Analysis: Commitment & Revision**

  #### **Least Committed Desideratum**
  **The Swampman Constraint.**
  *   **Why:** This is a metaphysical intuition pump, not a biological datum. Biology never encounters Swampmen; it encounters lineages. Basing a theory of *biological* function on a creature that violates the fundamental principle of biology (descent with modification) is category error. If a theory works for all actual biology but fails for Swampman, I would discard the Swampman constraint, not the theory.

  #### **Empirical Finding That Would Revise the List**
  **Stable Synthetic Symbiosis without Selection History.**
  *   **Scenario:** If we engineer a synthetic bacteria to inhabit a human gut, and it immediately performs a crucial metabolic function (e.g., synthesizing Vitamin K) that the host lacks, and this system persists for generations *before* any selection acts on the host-symbiont pair.
  *   **Revision:** This would force me to drop or heavily modify the **Historical Fidelity** requirement. If a functional biological system can exist and be stable purely through engineering/design (a form of "instant history") or immediate causal integration without lineage selection, the Etiological account becomes descriptively inadequate for modern synthetic biology. It would push the spec sheet toward a **Hybrid Account** where "design" (by humans) substitutes for "selection" (by nature).

  #### **Where My Reasoning Is Most Likely to Fail**
  **Reification of "Function."**
  *   **The Risk:** I am treating "function" as if it is a single natural kind waiting to be discovered. It is highly probable that "function" is a **pluralistic pragmatic tool** used by biologists.
  *   **The Failure Point:** In molecular biology, "function" might mean Causal-Role (what does this protein bind?). In evolutionary ecology, "function" might mean Etiological (why is this trait here?). My spec sheet assumes a unified theory is possible. The most likely reality is that demanding a single theory to meet all these desiderata is a mistake. The reasoning fails if it assumes unity where there is only contextual utility.
