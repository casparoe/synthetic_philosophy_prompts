answer: |-
  The Ship of Theseus persists in our thinking not because we are confused about boats, but because we are confused about persistence itself. We treat objects as static nouns when they are actually dynamic verbs. We want identity to be a property inherent in the thing, like mass or volume, but it is not. It is a relationship between time-stages. To cut through the hedging that usually plagues this discussion, we must adopt a single, rigid governing principle: **An artifact persists only so long as its functional organization is transmitted through a continuous, unbranched chain of causal dependence.**

  This principle denies that matter is the seat of identity. It also denies that mere similarity is enough. For the ship to remain the ship, the state of the vessel at any given moment must be the direct causal outcome of its state in the immediate prior moment, preserving its capacity to function as a ship. If that chain breaks, the ship dies, regardless of how much wood survives. If that chain branches, uniqueness vanishes, and we must choose the line of functional continuity over the line of material conservation.

  Apply this to the classic case, where rotting timbers are replaced one by one over decades. Here, the principle confirms our intuition: this is the same ship. At every moment during the decades of repair, the vessel retains its functional organization. More importantly, the causal chain is unbroken. The new plank is fitted *because* the old plank was removed; the structure holding the new plank is the structure that held the old one. There is no moment where the ship ceases to be a ship, and no moment where the causal lineage is interrupted. The matter changes, but the process—the specific history of maintenance that sustains the form—flows without gap. The ship is not the wood; it is the history of the wood's arrangement.

  Now consider the overnight swap, where every timber is stripped at dusk and a duplicate built from new timber stands in its place by dawn. Conventional wisdom suggests this is merely the classic case accelerated, but the principle dictates a harsher verdict: this is a new ship. In the gradual replacement, the ship at 2:00 PM depends causally on the ship at 1:00 PM. In the overnight swap, the ship at dawn does not depend on the ship at dusk; it depends on the architectural plans and the labor of the night crew. The vessel at dusk was disassembled; its functional organization was suspended. The causal chain of *maintenance* was severed and replaced by a chain of *manufacture*. The rate of change is not a trivial detail; it is the metric of continuity. If you replace a heart, the patient lives. If you replace every cell in the body simultaneously, you have a clone, not a patient. The overnight swap creates a replica that inherits the name, but not the identity.

  This distinction resolves the reassembly variant, where the old timbers are built into a second vessel. We now have two candidates: the continuous vessel in the harbor (new wood) and the reassembled vessel in the drydock (old wood). The principle forces a choice. The reassembled vessel possesses the original matter, but its functional organization was dead during the time the timbers lay in storage. It was a pile, not a ship. Its reanimation is a new causal beginning. The vessel in the harbor, however, possesses the unbroken chain of causal dependence. It is the original. To claim the reassembled wood is the true ship is to prioritize fossil over life.

  The dispersed case, where the old timbers become a temple floor, tests the limits of "functional organization." Here, the original matter is preserved, but it is organized as a floor, not a ship. The ship in the harbor is the original by virtue of continuity. The temple floor is merely the corpse of the ship, recycled. This answers the intuition that a ship must be "in one piece." A ship is not a scattered object because its function—sailing—requires a specific, localized structural integrity. You cannot sail a floor. Identity requires the persistence of the specific capacity that defines the kind. If the capacity is destroyed, the object is gone, even if the matter is lovingly preserved in a different configuration.

  This approach handles the double-counting problem without flinching. If we allowed both the continuous vessel and the reassembled vessel to be the Ship of Theseus, we would have one ship becoming two. This is a genuine cost, a metaphysical impossibility for singular artifacts. We do not accept that one person can become two identical twins and both claim the original's passport. Identity is a one-to-one relation. By prioritizing the continuous causal chain, we prevent the multiplication of entities. The reassembled ship is a replica, entitled to historical reverence but not to the original's registration or insurance claim. The principle protects the uniqueness of the object by tying it to the uniqueness of its history.

  It also clarifies the process option—the idea that a ship is closer to a flame than a rock. This does not dissolve the puzzle; it locates the solution. A flame persists not because it contains the same molecules of gas, but because the process of combustion propagates continuously through space and time. If you extinguish a flame and light a new one with the same match, it is a new flame. The ship is the same. It is a standing wave of organization. Recognizing this relocates the puzzle from "what is it made of?" to "how is it sustained?" It demands we look for the mechanism of transmission. In the gradual replacement, the transmission is local and continuous. In the overnight swap, it is global and interrupted. The puzzle remains, but the criteria for solving it shift from material to causal.

  This is not merely semantic games; it has teeth. If the reassembled ship were insured as the original, and it sank, the insurer would be defrauded. If the overnight swap were considered the same vessel, a warranty based on the original hull's stress history would be invalid. We are entitled to say the harbor ship is the original because that is the only verdict that aligns with the practical realities of liability, safety, and history. The "no-fact-of-the-matter" response is a luxury of the seminar room; the dockyard requires a binary decision.

  Finally, bring this principle to the century-long temperature series. This record is the Ship of Theseus of climate science. The thermometers are the timbers; the sites are the drydock; the observers are the crew. Over a hundred years, every instrument has been replaced, every site moved, every observer died. Is it one record? Yes, but only in virtue of the continuous chain of causal dependence known as calibration. Each new thermometer is adjusted to overlap with the old one; each site move is corrected to account for the change in altitude or exposure. This correction is the maintenance of functional organization. It ensures that the data point at time $t$ is causally comparable to the data point at $t-1$.

  If that chain breaks—if a decade of data is lost, or if a new instrument is introduced without a period of overlapping calibration to bridge the causal gap—the record dies. It becomes two records, stitched together by estimation, not one continuous history. The "temperature series" is not the paper or the digital file; it is the unbroken process of measurement and correction. We treat it as one record because the methodology preserves the functional continuity of the data stream. If we were to discover that a fifty-year gap had been filled by fabrication rather than interpolation, the identity of the series would shatter. It would no longer be the "Century Record"; it would be a composite. The science depends on this metaphysical rigidity. We are not measuring the air; we are measuring the continuity of our attention to the air. The ship sails on, not because the wood holds, but because the watch is never left unstaffed.
