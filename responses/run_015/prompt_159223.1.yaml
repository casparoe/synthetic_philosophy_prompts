      *   **The Link:** Explain why Dogma 2 supports Dogma 1. (Reductionism provides the mechanism for isolating analytic statements).
      *   **The Holistic Attack:** Explain why Holism destroys the *mechanism*. (No statement stands alone, so no statement is immune).
      *   **The "Protected" Counter-Argument:** Address the user's specific proposal.
          *   Distinguish between *practical* immunity and *principled* immunity.
