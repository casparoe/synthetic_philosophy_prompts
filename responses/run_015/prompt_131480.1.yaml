answer: |-
  Here is the translation of the moral trade argument into market design vocabulary, followed by the residue report you requested.

  ### Part 1: The Translation

  **The Environment**
  *   **Agents:** $N$ players, $i \in \{1, \dots, N\}$.
  *   **Types:** Each agent has a private type $\theta_i \in \Theta$, representing their moral theory. $\theta_i$ defines a utility function $u_i: A \to \mathbb{R}$ over action profiles $A = A_1 \times \dots \times A_N$.
  *   **Actions:** $a_i \in A_i$ is the action taken by agent $i$ (e.g., "donate to charity X," "eat vegan," "work on AI safety").
  *   **Preferences:** Crucially, $u_i$ is not selfish. $u_i(a)$ depends on the global outcome generated by the profile $a$. Agent 1 (Utilitarian) might get utility from Agent 2 (Deontologist) keeping a promise, even if Agent 1 doesn't care about promises intrinsically, but cares about Agent 2's welfare or "moral correctness."

  **The Mechanism (Moral Trade)**
  *   **Status Quo:** Nash Equilibrium of the one-shot game where each maximizes their own $\theta_i$ given beliefs about others. Let this be $a^{SQ}$.
  *   **Proposed Allocation:** A rule $f(\theta_1, \dots, \theta_N) \to a^*$ such that for a pair (or coalition) of agents $i, j$:
      *   $a^*_i$ is costly for $i$ under $\theta_i$ but highly valuable to $j$ under $\theta_j$.
      *   $a^*_j$ is costly for $j$ under $\theta_j$ but highly valuable to $i$ under $\theta_i$.
  *   **Individual Rationality (IR):** $u_i(a^*) \geq u_i(a^{SQ})$ for all $i$.
  *   **Incentive Compatibility (IC):** Truthful reporting of $\theta_i$ (or adherence to the agreement) must be a best response.

  **The "No-Communication" Version**
  *   This is modeled as a **Bayesian Nash Equilibrium** in a game of incomplete information.
  *   Agents do not bargain. They hold a prior distribution $P(\theta_{-i})$.
  *   Strategy $\sigma_i(\theta_i)$ is chosen to maximize $E_{\theta_{-i}}[u_i(\sigma_i, \sigma_{-i})]$.
  *   The "trade" occurs if the equilibrium strategy involves playing actions that are suboptimal for $\theta_i$ in isolation but optimal given the expectation that agents with $\theta_j \neq \theta_i$ are playing actions valuable to $\theta_i$.

  ***

  ### Part 2: The Residue Report

  Here is where the translation strains, addressing your three specific constraints.

  #### 1) Where's the Numeraire? (The Interpersonal Utility Problem)
  In standard market design, we clear markets using a price vector $p$. Here, there is no money. The "price" is the exchange rate between Action X (valued by Theory A) and Action Y (valued by Theory B).

  *   **The Economic Problem:** To determine the efficient frontier of Pareto improvements, you need to compare marginal rates of substitution across agents. $MRS_{i} = \frac{\partial u_i / \partial a_j}{\partial u_i / \partial a_i}$.
  *   **The Import:** To make moral trade work, you must implicitly assume **Cardinal Interpersonal Comparability**. You are assuming that "1 unit of Utility according to Theory A" can be equated to "1 unit of Utility according to Theory B" for the purpose of calculating the gain from trade.
  *   **The Residue:** Standard economics treats utility as ordinal and preference-sovereign. We avoid IPC by using money as a common denominator revealed by willingness-to-pay. Moral trade bans money. Therefore, the "exchange rate" is not discovered by the market; it is asserted by a **meta-ethical aggregator**.
  *   **Verdict:** Without a numeraire, there is no unique clearing price. The "gains from trade" are indeterminate. Any allocation can be rationalized as a "trade" if you adjust the implicit exchange rate between moral theories. The argument smuggles in a social welfare function $W(u_1, \dots, u_N)$ without defining its weights.

  #### 2) Public Goods vs. Private Barter
  You noted these acts look non-rival and non-excludable.

  *   **The Economic Problem:** If Agent 1 becomes vegan to satisfy Agent 2's theory, the "reduction in animal suffering" is a public good. Agent 3 (who also cares about animals) benefits without paying.
  *   **The Framing Error:** Moral trade frames this as bilateral barter ("I scratch your back, you scratch mine"). Economically, it is a **conditional contribution to a public good**.
  *   **Free Riding:** If the benefit is public, Agent 1 should contribute if $E[\text{Global Benefit}] > \text{Cost}$. They do not need Agent 2's specific reciprocity unless Agent 2's reciprocity is the *only* thing that makes the action worthwhile (i.e., the utility is purely in the *exchange* itself, not the outcome).
  *   **Survival:** The argument only survives if utility is derived from **compliance** or **fairness** (a preference for reciprocity itself) rather than the outcome. If $u_i$ depends only on the state of the world, the "trade" framing collapses into a standard public goods provision problem, and the "gains from trade" are just gains from coordination. If the good is public, the bilateral contract is unenforceable against third-party free riders, destabilizing the equilibrium.

  #### 3) Incentive Compatibility & Verification
  This is the strongest objection. $\theta_i$ is private information.

  *   **The Economic Problem:** This is a **Mechanism Design without Transfers** problem. You want to implement a social choice function where agents perform costly actions based on reported types.
  *   **The IC Constraint:** Agent $i$ has an incentive to report $\hat{\theta}_i$ such that others perform actions $i$ values, while $i$ performs cheap actions. Since there are no transfers (money) to punish lying (no VCG), and no principal to verify the type, this is a **Cheap Talk** game.
  *   **The Residue:** In a one-shot anonymous setting, the only IC equilibrium is "Babbling" (no information transmitted).
  *   **Survival:** The scheme is only stable if:
      1.  **Repeated Game:** Reputation mechanisms exist (community enforcement).
      2.  **Correlated Types:** You can statistically verify types based on observable signals (costly signaling).
      3.  **Acausal Logic:** (See below).
  *   **Verdict:** Without reputation or repetition, nontrivial moral trade mechanisms are **not Incentive Compatible**. It collapses into a "sucker's payoff" scenario where honest agents perform costly acts for liars who defect.

  ***

  ### Part 3: Silent Imports & Untranslatables

  **Silent Imports (Assumptions I added to make the econ work):**
  1.  **Consequentialism of Theories:** I assumed moral theories can be represented as utility functions over states. Deontological constraints (rules that cannot be violated regardless of outcome) do not map cleanly to $u(a)$ without infinite disutility weights, which breaks continuity and existence proofs.
  2.  **Common Priors:** For the "no-communication" version to yield a specific equilibrium, I assumed agents share a prior over the distribution of types. If priors diverge (Harsanyi doctrine violation), the "expectation" that others will trade dissolves.
  3.  **Commitment Technology:** I assumed agents can bind themselves to the trade. In standard game theory, without a contract enforcement mechanism, promises to trade are non-binding.

  **Untranslatables (What the vocabulary literally cannot say):**
  1.  **Normative Force vs. Preference:** Economics takes preferences as exogenous and sovereign. Moral trade argues that agents *ought* to trade even if their current preferences don't align, based on the *truth* of the moral theories. Econ has no variable for "Objective Moral Truth," only "Subjective Utility." If Theory A is objectively true and B is false, econ says trading is fine if both prefer it; Moral Trade sometimes argues you should trade *to hedge against your own moral uncertainty*. This requires a second-order utility function over the validity of $\theta$, which is not standard.
  2.  **Acausal Trade (The "No-Causal-Contact" Version):** You mentioned acting on expectation without communication. In EA circles, this often hints at **Acausal Decision Theory (ADT)** or Functional Decision Theory (FDT).
      *   *Standard Econ:* My action $a_i$ causally influences outcome $O$. I maximize $E[O | do(a_i)]$.
      *   *Acausal Trade:* My algorithm $\sigma_i$ is logically correlated with your algorithm $\sigma_j$ because we are both rational agents reasoning about the same problem. I choose $\sigma_i$ knowing it predicts $\sigma_j$.
      *   *The Gap:* Standard Nash Equilibrium assumes causal independence of moves conditional on types. Acausal trade assumes logical dependence of strategies. Your vocabulary (Nash/Bayesian) **cannot model this** without treating the correlation as a primitive correlation device, which defeats the "no communication" claim.

  ***

  ### Part 4: The Verdict

  **Is the framework too thin, or is there a hole in the argument?**

  There is a **hole in the moral trade argument**, but your framework is **too thin to capture the normative resolution.**

  1.  **The Hole (Mechanism Design):** As a mechanism design problem, "Moral Trade" is fundamentally broken.
      *   It lacks a numeraire (IPC problem).
      *   It lacks enforcement (IC problem).
      *   It misidentifies public goods as private barter.
      *   *Conclusion:* In a large, anonymous population with private types and no money, Moral Trade is not an equilibrium. It is vulnerable to collapse via free-riding and misrepresentation. It only works as a **focal point** in a small, high-trust, repeated game (reputation community).

  2.  **The Thinness (Normativity):** However, your economic vocabulary treats the failure of IC as a "market failure." Moral Trade proponents view it as a **rationality failure**.
      *   They argue that if you are uncertain about which moral theory is true, your utility function *should* be the expectation over theories, not the maximization of your current favorite.
      *   If agents internalize moral uncertainty correctly, the "types" change. $\theta_i$ becomes a probability distribution over theories. If everyone does this, the "trade" disappears because everyone is already maximizing the same expected moral value function.
      *   *Conclusion:* The economic model correctly identifies that "trade" requires distinct preferences. The moral argument correctly identifies that "moral uncertainty" should collapse those distinct preferences into a shared objective function.

  **Final Call:**
  The "Moral Trade" pitch is best understood not as a market mechanism (which fails your IC and Numeraire tests), but as a **coordination technology for moral uncertainty**.
  *   If treated as a **market**: It fails. (Your intuition is correct).
  *   If treated as **correlated equilibrium selection**: It works, but only if agents share a common prior on the distribution of moral truth.

  The residue shows that Moral Trade is not "trade" in the economist's sense. It is **coalitional bargaining under incomplete information without transfers**, relying entirely on reputation and normative pressure to satisfy incentive constraints. Your framework isn't too thin; it's correctly diagnosing that without transfers or enforcement, the "gains" are illusory unless the community is small enough for reputation to act as the currency.
