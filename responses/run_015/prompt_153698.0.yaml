answer: |-
  1. You've spent the last twenty minutes refusing to engage with the expected value calculations that drive the effective altruism movement. They talk about saving quadrillions of future lives; you talk about the integrity of the present moment. Is your objection actually mathematical, or are you saying the entire project of counting future humans is a category error?

     **Follow-up:** I can see you reaching for your favorite line—that moral distance isn't spatial distance, it's conceptual architecture. But isn't that just a poetic way of admitting you don't have a counter-calculation? If the architecture is sound, shouldn't it be able to bear the weight of the numbers, rather than dismissing them because they're too big?

  2. Let's talk about the non-identity problem. If we change our policies today, the specific people who will be born in two hundred years won't just be different—they won't exist at all. So if longtermism claims to care about *those* specific future people, isn't it logically incoherent? Doesn't caring for "the future" secretly collapse into just caring about the present conditions that produce them?

     **Follow-up:** I know you're going to say moral distance isn't spatial distance, it's conceptual architecture. But architecture implies a structure that holds something up. If the "people" you're building for don't have identities yet, what exactly is your architecture supporting? Is it just a monument to ourselves?

  3. Proponents argue that preventing extinction is the ultimate good because it preserves the potential for all future value. But if you prevent an extinction event, the people who live afterward are different than those who would have lived if we'd let nature take its course. So aren't you just swapping one set of people for another? Where is the net moral gain if the total number of lives remains roughly constant over deep time?

     **Follow-up:** You're shaking your head, and I bet you're about to tell me moral distance isn't spatial distance, it's conceptual architecture. But does architecture care about the tenants? If the "gain" is purely abstract—if no specific individual is better off than they would have been otherwise—isn't that just valuing the blueprint over the people living in the house?

  4. There's a concrete criticism that focusing on existential risk—asteroids, AI, pandemics—diverts resources from immediate suffering. When you spend billions shielding against a risk that might not happen for centuries, aren't you effectively shifting that risk onto the poor living today who need that money for food, medicine, and stability?

     **Follow-up:** I can hear the response forming: moral distance isn't spatial distance, it's conceptual architecture. But hunger isn't conceptual. If your architecture requires starving the present to build a roof for the future, isn't that just sacrifice dressed up as philosophy? At what point does the architecture become a weapon?

  5. Your work suggests that human morality evolved for small-scale reciprocity—face-to-face interactions where harm and help are visible. If that's true, isn't trying to extend that same moral intuition to beings we can never meet a violation of our own cognitive limits? Are we trying to use a hammer to fix a watch?

     **Follow-up:** I know you love to say moral distance isn't spatial distance, it's conceptual architecture. But isn't that phrase just a way to bypass the cognitive limits you just admitted we have? If our brains aren't built to perceive that architecture, are we really doing ethics, or are we just hallucinating structures that aren't there?

  6. Even if we agree we have duties to the future, how can we possibly know what those duties are? We can't know what values future people will hold. By imposing our current values on them—say, preserving our specific version of liberal democracy—aren't we just colonizing the future rather than serving it?

     **Follow-up:** You're going to retreat to the idea that moral distance isn't spatial distance, it's conceptual architecture. But who gets to draw the blueprints? If the architecture is based on our current concepts, isn't that just presentism with a longer time horizon? How is that not arrogance?

  7. The longtermist frame suggests that a catastrophic event is worse than widespread suffering, because the catastrophe ends the story. But you've argued that structural violence kills more people over time than sudden extinction events. Why should we prioritize the "end of the world" over the "endurance of the miserable"?

     **Follow-up:** I anticipate you saying moral distance isn't spatial distance, it's conceptual architecture. But if the architecture allows the walls to crumble on the people living inside it now just to keep the roof from falling later, isn't that bad design? Why should the conceptual structure matter more than the physical pain of the inhabitants?

  8. Let's get practical. If a policymaker adopted your view tomorrow, what would they stop doing? Would they defund asteroid detection? Would they stop AI safety research? Or is your critique purely theoretical, leaving the actual decision-making unchanged?

     **Follow-up:** I know you want to say moral distance isn't spatial distance, it's conceptual architecture. But policymakers need budgets, not metaphors. If your architecture doesn't change where the money goes, isn't it just aesthetics? What concrete thing breaks if we ignore your advice?
