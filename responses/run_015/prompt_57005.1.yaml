answer: |-
  I reject Step (2) because it imposes a foundationalist requirement for independent prior knowledge of the selection function that no empirical science, including astronomy, can satisfy or requires.

  Step (2) looked innocent to you because it mimics a valid condition for deductive certainty: to correct for a bias, one seemingly must know the bias beforehand. In simple statistical contexts, this appears true; however, in complex empirical sciences, knowledge of the selection function is not a precondition but an outcome of iterative modeling. We do not know the selection function *before* we infer the population; we posit a selection function, infer the population, check for consistency across independent datasets (like surveys at different depths), and refine the function until stability is achieved. Step (2) is simply false because it conflates "known independently" with "constrained coherently."

  Step (5) is also simply false, though it carries the heavy lifting of the skepticism. It claims that error in the selection function leaves "no mark on the sample." Your astronomical practice proves this wrong: if your selection function model is incorrect, luminosity functions derived from surveys at different depths will diverge. The inconsistency is the "mark." In archaeology, the equivalent marks are stratigraphic anomalies, contradictions between ceramic typologies and radiometric dates, or mismatches between settlement patterns and carrying capacity models. While the underdetermination is real (many models *can* fit one dataset), it is not indefinite when multiple independent lines of evidence are required to converge.

  Steps (1), (3), and (4) are true but too weak to carry the inference to skepticism on their own. It is true that the record is a residue (1), that we lack a record of the perished (3), and that estimating the selection function relies on the survivors (4). These are merely descriptions of the problem, not proofs of its insolubility. They survive the rejection of (2) and (5) as a cautionary residue: archaeologists cannot claim certainty, and single-assemblage interpretations are indeed vulnerable to the circularity you describe. This residue is enough to worry an archaeologist insofar as it mandates humility and the pursuit of multiple, independent lines of evidence (the archaeological equivalent of multi-depth surveys) rather than reliance on a single site or class of artifact.

  Your astronomical case is genuinely analogous. The statistical problem of inferring a population from a flux-limited sample is structurally identical to inferring a past society from a preservation-biased record. The difference lies only in the complexity of the selection function: astronomical selection is governed by physical laws ( optics, flux limits) which are stable and reproducible, whereas archaeological selection is governed by taphonomic processes and human behavior which are variable. However, this difference affects the *difficulty* of modeling the selection function, not the *possibility*. Since astronomy solves the problem via cross-validation rather than independent access to the true population, archaeology is licensed to do the same. Conclusion (9) stands only if one demands a level of certainty that astronomy also fails to meet; if astronomy warrants confidence despite the bias, so does archaeology.
