      *(Self-Correction during drafting)*: I need to make sure I don't just say "You're wrong." I need to show *how* to make it right. The position is actually a recognizable and defensible one (Rationalist Internalism), it's just mislabeled. The "Self-Model" language is essentially Smith's "Rational Self" or Korsgaard's "Practical Identity." I should point that out so they can cite the right literature.

      *(Check on Prudence)*: User says prudence isn't derivable from present raw S. Williams actually thinks prudence *is* derivable if you identify with the future self. If you don't, it's external. The user's view is slightly more complex but defensible as "Diachronic Internalism." I'll mark this as a lower priority tension.

      *(Check on Bootstrapping)*: If coherence norms *are* agency, is it bootstrapping? Constitutivists say no. Humeans say yes. I need to highlight this is the battleground.

      *(Final Plan)*:
