      *   *Why it looks innocent:* Desires are mental states *in* me. When I get what I want, I feel satisfaction. It feels like the *goal* was the feeling.
      *   *Why it's wrong:* The *object* of the desire matters. If I desire *that the child survives*, the satisfaction condition is *the child surviving*. The fact that *I* am the one desiring it doesn't make the *content* of the desire self-regarding.
      *   *Analogy:* Hunger. I desire food. The satisfaction is me eating. But if I desire *you* to be happy, the satisfaction is *you* being happy. The locus of the desire (my mind) $\neq$ the locus of the satisfaction condition (the world/other people).
      *   *Rationalist connection:* This is basically the "Mind Projection Fallacy" or confusing the map for the territory. It's also closely related to the "Paradox of Hedonism."

