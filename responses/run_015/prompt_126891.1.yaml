answer: |-
  This is a classic philosophical trap, often called the **Paradox of Hedonism** or a variation of the **Egoistic Challenge to Kantianism**. It feels watertight because it uses reductionist tools (causal closure, Humean psychology) to dissolve a normative concept (moral worth).

  Your suspicion is correct: this argument relies on a category error that looks like a reduction but is actually a conflation. Since you want to keep Premise (1) (the Kantian intuition that *why* you act matters), you have three main places to break the chain.

  Here is the breakdown of where the argument fails, why it looks innocent, and the cost of each exit.

  ### The Primary Break Point: Step (5) to (6)
  **The Error:** The **Formal/Object Distinction Fallacy**.

  **Why it looks innocent:**
  Step (5) says: *"What she is motivated to bring about... is a state of affairs in which she has done the right thing. That is a state of her."*
  Step (6) concludes: *"So she is acting in order to produce a pleasing state of herself."*

  This slides from "The desire is located in me" to "The *object* of the desire is me."
  It conflates the **vehicle** of motivation (my psychological state) with the **content** of motivation (the state of the world).

  **The Rationalist Explanation:**
  Think of a desire as a pointer in a data structure.
  *   **Pointer Location:** Inside the agent's mind.
  *   **Pointer Target:** The world (e.g., "Child is safe," "Truth is believed," "Action is Right").

  The argument claims that because the *pointer* is inside the agent's mind, the *target* must be the agent's mind (specifically, the feeling of the pointer being satisfied). This is a Mind Projection Fallacy.
  If I desire *that you survive*, the satisfaction condition is *your survival*. Yes, when you survive, my desire-state changes from "unsatisfied" to "satisfied." But I did not act to change my desire-state; I acted to change *you*. The change in my desire-state is a side effect, not the telos.

  **The Cost:**
  *   **Metaphysical Cost:** Zero. This is standard philosophy of action.
  *   **Conceptual Cost:** You must accept that "self-referential" (the desire is mine) does not mean "selfish" (the goal is my benefit).
  *   **Benefit:** You keep (1), (2), (3), and (4). You save altruism and epistemic praiseworthiness. If wanting Truth is a desire, it doesn't make believing Truth "selfish" in the morally relevant sense, it just makes it motivated.

  ### The Secondary Break Point: Step (3)
  **The Error:** **Humean Theory of Motivation (HTM) Dogmatism.**

  **Why it looks innocent:**
  Premise (3) ("Beliefs don't move you on their own") is the orthodoxy in analytic philosophy and fits well with a physicalist worldview. It feels like "hygiene" to separate facts (beliefs) from forces (desires).

  **The Rationalist Explanation:**
  If you reject (3), you are accepting **Motivational Cognitivism**. This is the view that recognizing a normative fact (e.g., "This action is right" or "This belief is true") *itself* has motivational force without needing a separate, pre-existing desire.
  In rationalist terms: Recognizing a coherence requirement or a normative truth *is* a state that updates your policy network directly. You don't need a "desire to be coherent" separate from "seeing the incoherence."

  **The Cost:**
  *   **Metaphysical Cost:** High. You have to explain how a "belief" (a map) generates a "force" (territory-changing action) without a "desire" (engine). This often smells of non-naturalism or "spooky" normativity to hard naturalists.
  *   **Benefit:** It makes Premise (1) much easier to satisfy. If seeing the Rightness *is* the motive, you aren't acting to satisfy a desire for rightness; you are acting because the Rightness pulled you. This dodges the "self-interest" charge entirely.

  ### The Tertiary Break Point: Step (7)
  **The Error:** **Equivocation on "Self-Interest."**

  **Why it looks innocent:**
  Premise (7) ("Nothing done from self-interest has moral worth") seems definitional. But the argument has redefined "self-interest" in Step (6) to mean "any action flowing from an internal motivational state."

  **The Rationalist Explanation:**
  There is a difference between **Psychological Self-Reference** (the motive originates in me) and **Ethical Self-Interest** (the motive aims at my welfare).
  *   **Ethical Self-Interest:** I help you *so that* I feel good / avoid guilt / get reward.
  *   **Moral Motivation:** I help you *because* you need help. (The fact that I have a desire to help you is a precondition, not the goal).

  If you define "self-interest" as "anything I am motivated to do," then (7) is true by definition but trivial, and (8) follows but means nothing. If you define "self-interest" as "aiming at my own welfare," then (6) does not support (7).

  **The Cost:**
  *   **Conceptual Cost:** You have to argue that your chat partner is using a motte-and-bailey definition of self-interest.
  *   **Benefit:** Preserves common-sense morality without needing complex metaphysics.

  ---

  ### Addressing the Corollaries

  **Corollary (9): The Sympathetic Helper**
  *   **The Trap:** If they don't think "this is right," they fail (1). If they do it to stop their own pain, they fail (7).
  *   **The Fix:** Distinguish between the **Grounds** of the action and the **Motive**.
      *   The sympathetic helper's *motive* is sympathy (alleviate suffering).
      *   The *grounds* (what makes it right) is that suffering is bad.
      *   To have moral worth (per your Premise 1), they don't need to token the thought "this is right." They need their motive to *align* with the right-making features. Sympathy aligns with "suffering is bad."
      *   Regarding "shutting off discomfort": This is the same Step (5)->(6) error. The goal is *stopping the suffering*. The relief of my distress is the *feedback signal* that the goal was met, not the goal itself.

  **Corollary (10): Epistemic Praiseworthiness**
  *   **The Trap:** Your friend bites the bullet: "No belief is epistemically praiseworthy."
  *   **The Counter:** This is a *reductio ad absurdum* for anyone in a rationalist community. Rationality *is* the project of epistemic praiseworthiness. If wanting Truth invalidates the worth of believing Truth, then **Bayesian updating is morally neutral.**
      *   If you press him here, he has to admit that the "desire for truth" is a special desire that isn't "self-interested" in the corrupting sense. If he grants that for truth, he must grant it for morality (the "desire for the right").
      *   If he refuses, he has opted out of the rationalist project. You cannot value rationality while claiming no cognitive state is praiseworthy.

  ### Recommendation: Which Exit to Take?

  Since you want to keep **(1)** (the lifeguard intuition), here is your hierarchy of options:

  1.  **Reject (5)->(6) (Recommended):**
      *   **Argument:** "You are confusing the location of the desire with the object of the desire. I can desire *your* welfare. That desire is in me, but the welfare is yours. Satisfying that desire isn't 'self-interest' in the sense that negates moral worth; it's just what motivation *is*."
      *   **Cost:** Low. Requires careful distinction, but no metaphysical baggage.
      *   **Why:** It saves epistemic praiseworthiness immediately. If wanting Truth doesn't make believing Truth selfish, wanting Rightness doesn't make doing Rightness selfish.

  2.  **Reject (3) (The Non-Humean Route):**
      *   **Argument:** "Moral beliefs *are* motivational. Recognizing 'I ought' *is* a motive."
      *   **Cost:** High. Requires defending non-Humean psychology against a reductionist crowd.
      *   **Why:** Only take this if you are willing to debate philosophy of mind. It's a harder sell in a "rationalist-adjacent" chat that likely defaults to Humeanism.

  3.  **Reject (7) (Redefine Self-Interest):**
      *   **Argument:** "Acting from a desire for the Right is not 'self-interest.' Self-interest requires the *object* to be self-benefit. The object here is Rightness."
      *   **Cost:** Medium. Semantic debate.
      *   **Why:** Good backup if they dig in on the definition of desire.

  ### The "Sequences" Check
  You mentioned this feels like "everyone does what they want, therefore altruism is impossible." Eliezer addressed this in *Fake Selfishness*.
  The core point is: **Preferences are not necessarily about the self.**
  A preference for "Chocolate" is self-regarding. A preference for "World Peace" is not, even though the preference exists in my head. To claim that *all* preferences are self-regarding because they are *my* preferences is to claim that the map cannot represent anything other than the map.

  **Your closing move:**
  Tell him: *"If your argument holds, then 'wanting to be rational' is a self-directed desire, so no belief is ever rationally praiseworthy. You've just argued that Rationality is impossible. If you're willing to burn Rationality to save this argument, I'm out. If not, you have to admit that a desire for X doesn't make X 'selfish' just because I'm the one desiring it."*

  That usually forces the exit.
