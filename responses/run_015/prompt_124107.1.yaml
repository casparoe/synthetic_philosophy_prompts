  Here is a breakdown based on prevailing psychological and philosophical theories regarding moral repair, followed by the rating you requested.

  **1. Guilt**
  Guilt targets specific actions rather than global self-worth, which motivates direct reparative behavior without triggering defensive withdrawal.

  **2. Collective Remorse**
  Collective remorse allows groups to acknowledge systemic wrongs, though it often lacks the immediate personal agency required for concrete restitution.

  **3. Shame**
  Shame attacks the core self-image, which frequently leads to hiding or aggression rather than the constructive engagement needed for repair.

  **4. Normative Embarrassment**
  Normative embarrassment centers on social standing rather than moral responsibility, making it too superficial to drive genuine restitution.

  **Can a culture switch its portfolio?**
  Rating this is tricky because while cultures do evolve over centuries, doing so deliberately and quickly is extremely difficult. Emotional norms are embedded in language, child-rearing, and institutions, so trying to swap them is less like changing a playlist and more like trying to change the climate of a region; you can influence it, but you can't just flip a switch.

