answer: |-
  ### Candidate Theories of Obligation

  To map this bundle, we must distinguish between theories that ground the duty in *status*, those that ground it in *function*, and those that ground it in *justice*. 

  First, the **Membership or Co-authorship View** holds that obligation arises from participating in a collective project. Defence is a public good authored by citizens; therefore, citizens owe labour to sustain it. Second, the **Statist or Sovereignty View** prioritizes the state's monopoly on violence. The state must control who fights and for whom to maintain internal order and external allegiance. Third, the **Collective Self-Defence View** treats the state as an agent protecting the physical existence of the population. Obligation is derived from necessity and survival, not necessarily moral membership. Fourth, the **Fair-Share View** sees service as a burdensome input that must be distributed equitably to prevent free-riding. Finally, the **Deterrence or Signal View** argues that universal liability exists not to raise headcount, but to signal to aggressors that invasion will be costly because everyone is liable to resist.

  ### Testing the Bundle

  When tested against the specific practices, these theories fracture. The **Membership View** licenses conscription and the ban on foreign enlistment (allegiance is exclusive), but it condemns the Foreign Legion model. If membership is a status owed by birth or social contract, selling it for blood ("Français par le sang versé") commodifies the polity. It also struggles with gender asymmetry; if women are members, why are they exempt from the draft? The practice sits well with membership only if membership is historically patriarchal, not philosophically universal.

  The **Statist View** strongly licenses the ban on foreign enlistment and conscription. The state claims the citizen's body to prevent rival monopolies of violence. However, it creates tension with foreign recruitment. Enlisting outsiders undermines the idea that only subjects are tools of state violence, unless the state views non-citizens as mere instruments rather than agents. Reserve liability fits here perfectly: the state retains a dormant claim on the subject's labour regardless of market value.

  The **Collective Self-Defence View** justifies conscription and reserve liability as necessities of survival. It cannot, however, justify the ban on foreign enlistment if the foreign cause is defensive. If the goal is protecting persons in peril, as your friend noted, the flag should not matter. This view also struggles with the longer civilian service term. If the goal is defence capacity, punishing conscience with extra time is counter-productive unless the aim is to deter objection rather than allocate labour.

  The **Fair-Share View** licenses conscription and the civilian service penalty (to ensure objectors do not escape burden). It fits the Sweden model (screening for efficiency while maintaining universal liability) but clashes with the Foreign Legion. Outsiders cannot share a burden that is internal to the community. Finally, the **Deterrence View** explains universal liability and reserve status better than manpower needs. It justifies keeping names on registers decades later to signal resolve. However, it renders the actual service tours somewhat theatrical if the goal is signaling rather than fighting capacity.

  ### Underdetermination and Incoherence

  Much of this landscape is underdetermined. Conscription looks identical whether grounded in Membership, Self-Defence, or Fair-Share. The surface law does not settle the theory. However, deep incoherences exist. The bundle simultaneously treats service as a sacred duty of membership (banning foreign fighting) and a commodifiable resource (recruiting foreigners for citizenship). This suggests the state operates on a **Hybrid Statist-Instrumentalist View**: citizens owe allegiance (non-fungible duty), while non-citizens offer labour (fungible service).

  One limb is strictly unjustifiable on almost any coherent theory: the gendered conscription. Neither Membership (women are members) nor Self-Defence (women can fight) nor Fair-Share (women benefit from defence) supports excluding women from the draft while maintaining universal male liability. This looks like historical inertia rather than philosophical principle. Similarly, the civilian service penalty is hard to justify on Self-Defence grounds (why train objectors less effectively for longer?) but fits a Fair-Share view focused on punishing deviation from the norm.

  ### Probing with Commutation and Residence

  The proposals to allow commutation (paying for a substitute) or shift to residence-based obligation act as stress tests for the underlying theory. 

  If the duty is **Personal and Non-Fungible** (Membership/Statist), commutation destroys the institution. The point is not the headcount, but the citizen's submission to the collective will. Allowing a conscript to buy out implies the duty is merely economic, severing the link between service and co-authorship. However, if the institution is strictly for **Manpower or Deterrence**, commutation is viable. The commutation proposal reveals whether the state values the *body* or the *slot*. If the state accepts cash, it admits the duty is a tax, not a sacrifice.

  The residence-based proposal tests the link between citizenship and obligation. A Membership view rejects this (obligation follows the passport); a Statist or Fair-Share view accepts it (obligation follows the benefit of protection). If the state adopts residence-based liability, it admits that defence is a service provided by a territorial administrator, not a project of a national people. This would preserve the rationale of maintaining trained numbers but destroy the rationale of universal liability as a signal of national will. A resident alien paying a defence levy signals nothing about their willingness to die for the state, whereas a citizen conscript does.

  ### Theory Replacement Scenarios

  If the implicit theory were replaced by a **Just-Cause View**, the institution would collapse. Conscription is only legitimate if the war is just; since states claim the right to conscript for any war (including questionable ones), a Just-Cause view would require individual assessment of each conflict. The ban on foreign enlistment would vanish if the foreign cause were just. The Foreign Legion would be illegitimate unless every mission met cosmopolitan justice standards. This view requires dismantling the state's monopoly on judging violence.

  If replaced by a **Pure Fair-Share View**, the institution becomes a labour allocation problem. Gender neutrality becomes mandatory. Commutation becomes permissible (provided the tax is progressive). Civilian service would be equalized in length to military service, as the goal is burden equality, not punishing conscience. The Foreign Legion would be abolished or opened to citizens equally, as special paths to membership via blood violate equal burden distribution. Reserve liability would need market-rate compensation, as below-market pay is a hidden tax violating fair share.

  Ultimately, the current bundle is a mess of bolted-together principles. It relies on Membership to demand sacrifice from citizens, Statism to forbid alternative allegiances, and Instrumentalism to recruit outsiders. It strictly needs the threat of prison to maintain the fiction of universal duty, but it merely sits well with the actual defence needs, which could be met by volunteers. The commutation proposal exposes that the state likely wants the resource (the soldier) but fears admitting the duty is fungible, because admitting that undermines the claim on the citizen's conscience.
