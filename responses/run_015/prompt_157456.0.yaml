  However, this dissolution fails because it conflates the causal production of a belief with the rational justification required for knowledge. While the common physical cause successfully explains why the judgment occurs at a particular moment, it does not explain why the judgment is accurate regarding the phenomenal property. Knowledge requires that a belief be sensitive to the truth it represents, yet under the common cause model, the belief is sensitive only to the physical precursor, not the phenomenal property itself. The physical state determines the utterance, but the truth of the utterance depends on the experience. Without a causal link from experience to judgment, there is no mechanism to ensure that the judgment tracks the truth rather than merely tracking the physical state that happens to accompany it. The alignment between the content of the thought and the reality of the experience appears coincidental, leaving the subject with a belief that is causally explained but rationally ungrounded.

  This structural deficit becomes clearer when drawing an analogy between phenomenal judgments and mathematical judgments. In mathematics, we form beliefs about abstract objects, such as numbers or sets, which presumably lack spatial location and causal efficacy. A Platonist might argue that the number two does not push neurons around, yet we claim to know truths about it. If one were to explain mathematical knowledge solely through the physical causation of neural states, ignoring the abstract objects themselves, the reliability of our mathematical beliefs would become inexplicable. We would have beliefs caused by brain states that happen to correlate with mathematical truths, but we would lack a rationale for why those brain states constitute knowledge rather than lucky guesses. The causal history of the belief is distinct from the justification for the belief. Just as the causal inertness of mathematical objects threatens to sever the link between physical belief formation and abstract truth, the causal inertness of qualia severs the link between physical speech acts and phenomenal reality.

  Consequently, the distinction between causal production and rational justification reveals the insufficiency of the epiphenomenalist solution. Physical causation can account for the occurrence of the judgment, but rational justification requires that the object of the judgment constrain the formation of the belief. In the mathematical case, the truth of the proposition constrains the reasoner through logical insight rather than physical force. In the phenomenal case, the experience must constrain the judgment through direct awareness. If the experience is merely a shadow cast by the physical state, it cannot perform this constraining role. The judgment is physically determined, but its rational authority is left unexplained. Therefore, rational accessibility cannot be reduced to physical causation because causation explains existence while justification explains validity. The epiphenomenalist leaves us with a judgment that exists but lacks the necessary connection to its object to count as knowledge, leaving the paradox intact despite the appeal to common physical causes.
