answer: |-
  Two quantitative analysts, Eli and Sarah, are staring at a terminal on the floor of Providence Futures. The screen displays a contract: `AGENT_42_FREELY_DEFECTS_IF_PLACED_IN_CIRCUMSTANCE_C`.

  Eli points at the order book. "The leaked Divine Priors show the Counterfactual of Creaturely Freedom is true. In C, Agent 42 *would* defect. That's a pre-volitional truth. It's logically necessary given the feasible world. Why is the bid only 94 cents?"

  Sarah, the Molinist market-maker, doesn't look up from her console. "Because of the Liberty Spread."

  "That's noise," Eli says. "If the CCF is true, the probability of defection in C is 1.0. Sell me 'Defect' shares at 99 cents. It's free money. You know the outcome prior to the creative decree."

  "I can't fill that order," Sarah says.

  "Why? Risk management?"

  "No. Ontological compliance," Sarah replies. "Look, I know what Agent 42 *would* do in C. That's Middle Knowledge. It's certain. But this market exists *post*-decree. We are in the actual world now."

  "So actualize C," Eli says. "Put him in the circumstance. I collect on the shares. You keep the premium."

  "If I actualize C *specifically to settle your contract*," Sarah explains, "then my creative decree is causally linked to your payout. That makes my decree a determining cause of his action. If his action is determined by my decree, it isn't free. If it isn't free, the Counterfactual of Creaturely Freedom is false. And if the CCF is false, my pricing model was wrong, and I lose the bet."

  Eli blinks. "So you know he'll defect, but you can't bet on it because betting on it makes him not defect?"

  "Exactly. To arbitrage the certainty, I'd have to collapse the counterfactual into a causal determination. That turns us into a Thomist shop, and our insurance premiums for theological liability are already through the roof."

  "So the market is inefficient," Eli says, frustrated.

  "No," Sarah says, finally looking up. "The market is perfectly priced for libertarian freedom. You want the 99-cent sure thing? You have to buy the determinism package. But if you buy the determinism, the contract voids because the 'Freely' clause in the ticker symbol triggers a compliance audit."

  Eli stares at the screen. "So the only way to guarantee the payout is to invalidate the conditions of the payout."

  "Welcome to prediction markets," Sarah says, closing the window. "We can't arb the free-will spread. The only risk-free arbitrage is sin, and we delisted that after the Fall caused a liquidity crisis."
