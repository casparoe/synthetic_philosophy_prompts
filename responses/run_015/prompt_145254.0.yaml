          *   Wait, CJT says larger $N$ is better. 1 group of 24 ($87\%$) vs 4 groups of 6 ($93\%$)? Actually, the variance in the two-tier system is higher. The "Chair's Proposal" risk is that if the subcommittees get it wrong (the 18% error rate), the final vote is between wrong options. But strictly speaking, if the subcommittees are independent, the two-tier might actually perform *well* mathematically compared to the common cause. However, the prompt implies the Chair's proposal is risky. The risk in two-tier is *correlation between subcommittees* (if they all look at the same data) or *loss of information*.
