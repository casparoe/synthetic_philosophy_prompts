  # Session Plan: The Architecture of Error

  ## I. Materials and Setup

  **Room Layout:**
  *   Desks arranged in four clusters of six (for Condition 4), but easily movable into rows or open space.
  *   Front table for the "Bank."

  **Physical Props:**
  *   **4 Opaque Bags:** Labeled A, B, C, D.
  *   **Chips:** 72 Red, 72 Blue (plastic poker chips).
      *   *Preparation:* Before class, fill each bag with 18 chips: **11 of the "True" Color, 7 of the "False" Color.** (e.g., Bag A has 11 Red/7 Blue; Bag B has 11 Blue/7 Red). You will decide the "True" color by coin flip at the start of each trial.
  *   **Index Cards:** 100 small cards (Red on one side, Blue on the other, or simply write R/B).
  *   **Scoreboard:** Whiteboard divided into four columns (Condition 1–4) with rows for "Group Win," "Individual Avg," and "Total Points."
  *   **Timer:** Visible to all.

  **Roles (Assign 3 Students at Start):**
  1.  **The Banker:** Handles the bags, flips the coin to determine the "True" color, and collects chips.
  2.  **The Clerk:** Collects index cards, counts votes, and updates the scoreboard.
  3.  **The Marshal:** Enforces silence during voting phases and manages the line for sequential voting.

  **Scoring System (The Incentive):**
  *   **Individual Point:** 1 point if your vote matches the True Color.
  *   **Dividend:** 5 points to *every* student if the Group Verdict matches the True Color.
  *   *Note:* This makes it rational to care about the group's success, not just your own.

  ---

  ## II. Minute-by-Minute Timeline (90 Minutes)

  *   **00–10:** Introduction, Role Assignment, & Condition 1 Instructions.
  *   **10–25:** **Condition 1: Secret Ballot (Baseline).** 3 Trials.
  *   **25–40:** **Condition 2: Paired Evidence (Common Cause).** 3 Trials.
  *   **40–55:** **Condition 3: Public Sequence (Deference).** 3 Trials.
  *   **55–70:** **Condition 4: Two-Tier + "Experts" (Structure).** 3 Trials.
  *   **70–90:** **Debrief & Theory Mapping.**

  ---

  ## III. Read-Aloud Instructions

  ### Introduction (00–10)
  > "Welcome. Today is not a lecture. It is a stress test. As you know, our department is currently arguing about how to hire new faculty. One proposal suggests we split into subcommittees; another suggests we all discuss together; another suggests we vote in silence.
  >
  > For the next hour, you are not students. You are sensors. Your job is to detect a hidden state of the world. We will run four different procedures for aggregating your detections. You will earn points toward [extra credit/a trivial prize] based on your accuracy and the group's accuracy.
  >
  > **The Rule:** Do not discuss the *mechanics* of the game until the final ten minutes. If you ask me 'What are we testing?', I will not answer. If you ask 'What is the point?', I will tell you: 'The point is to see which procedure earns the most points.'
  >
  > **The Mechanism:** The Banker will flip a coin. Heads means the 'True State' is Red. Tails means the 'True State' is Blue. You will not see the coin. You will draw one chip from a bag. The bag is loaded: it contains more chips of the True Color than the False Color. Your chip is a signal. It is not proof. It is a hint.
  >
  > Assign roles: Banker, Clerk, Marshal. Everyone else, take a seat."

  ### Condition 1: Secret Ballot (Baseline)
  > "Procedure: Draw one chip. Look at it privately. Return it to the bag and shuffle. On your index card, write your vote: Red or Blue. Fold the card. The Clerk will collect them. No talking. No showing chips.
  >
  > We will run this three times. Begin."

  *(After 3 trials, tally scores. Do not comment on the results yet.)*

  ### Condition 2: Paired Evidence (Common Cause)
  > "Procedure: Move into pairs. In each pair, only **one** person draws a chip. The other person sees nothing. The person who draws shows the chip to their partner. Both of you then vote. You must vote independently on your cards, but you have seen the same evidence.
  >
  > We will run this three times. Begin."

  ### Condition 3: Public Sequence (Deference)
  > "Procedure: Return to individual seats. You will draw chips individually as before. However, voting is now public and sequential. The Marshal will call you by row. You must announce your vote aloud: 'Red' or 'Blue.' Everyone hears everyone else's vote before casting their own.
  >
  > We will run this three times. Begin."

  ### Condition 4: Two-Tier + "Experts" (Structure)
  > "Procedure: Move into your four clusters of six. This is a two-stage vote.
  >
  > **Stage 1:** Within your cluster, discuss your chips for 60 seconds. Then, vote by show of hands. The majority view of your cluster becomes your Cluster's Verdict.
  > **Stage 2:** One representative from each cluster stands. The four representatives vote to determine the Class Verdict.
  >
  > **The Wrinkle:** Before Stage 1, I am asking for volunteers. Who feels their signal was exceptionally clear? Who feels they have 'expertise'? I will allow up to three students to declare themselves Experts. In the Stage 2 vote, the Expert's vote counts as **two votes**.
  >
  > We will run this three times. Begin."

  ### Handling the "What is the Point?" Question
  *(If a student asks this during the game)*
  > **Say:** "The point is the points. If you want the bonus dividend, focus on making the group right. If you want individual points, focus on your signal. The procedure is the variable; you are the constant."

  ---

  ## IV. The Arithmetic & Expected Results

  To ensure the effects are visible with $N=24$, the signal strength ($p$) must be weak enough that the group fails occasionally, but strong enough that they usually succeed.

  *   **Signal Strength:** 11 True / 7 False chips ($p \approx 0.61$).
  *   **Trials:** 3 per condition (12 total).

  | Condition | Effective $N$ | Expected Group Accuracy | Why it changes |
  | :--- | :--- | :--- | :--- |
  | **1. Secret** | 24 Independent | **~85%** | High reliability via aggregation of independent errors. |
  | **2. Pairs** | 12 Independent | **~73%** | Errors are correlated within pairs. Effective group size halves. |
  | **3. Sequence** | 24 (Correlated) | **~60%** | Information cascades. Early noise locks in; later signals ignored. |
  | **4. Two-Tier** | 4 Clusters | **~65%** | Loss of granularity. A 4-2 cluster win counts same as 6-0. Experts add noise. |

  **Scoring Expectation:**
  *   Condition 1 should yield the highest "Dividend" payouts.
  *   Condition 3 should yield the lowest.
  *   Condition 4 should show high variance (sometimes great, sometimes terrible).

  ---

  ## V. Debrief Strategy (70–90 Minutes)

  Do not start with definitions. Start with the scoreboard.

  **1. The Competence Condition (Mapping Condition 1)**
  *   **Ask:** "Look at Condition 1. Most of you were individually wrong about 40% of the time. Yet the group was right roughly 85% of the time. How is it possible that the group is smarter than its smartest member?"
  *   **Concept:** *Competence.* As long as $p > 0.5$, adding voters reduces the variance of the error. The "wisdom" comes from the cancellation of random noise.
  *   **Hiring Link:** This supports the colleague who wants "the whole department in one room." More independent eyes beat a few expert eyes.

  **2. The Independence Condition (Mapping Condition 2)**
  *   **Ask:** "In Condition 2, the number of voters was still 24. But the accuracy dropped. Why? You saw the same chip."
  *   **Concept:** *Independence.* The theorem requires errors to be uncorrelated. When you share a source (the single chip draw), you share the error. You haven't added a voter; you've added a clone.
  *   **Hiring Link:** If subcommittees all read the same three job market papers before deciding, they are not independent subcommittees. They are one committee wearing four masks.

  **3. Deference vs. Common Cause (Mapping Condition 3)**
  *   **Ask:** "Condition 2 and 3 both failed compared to Condition 1. But did they *feel* the same? In Condition 2, you knew you were copying. In Condition 3, did you feel free?"
  *   **Concept:** *Cascades.* In Condition 2, the correlation was structural (shared cause). In Condition 3, the correlation was psychological (deference). Once the first three people vote 'Red', the fourth person with a 'Blue' chip assumes the majority knows something they don't, and they vote 'Red' too. The information of the private signal is lost.
  *   **Hiring Link:** This supports the colleague who wants "secret ballots." Discussion can turn into a cascade where junior faculty defer to senior faculty, destroying the independent signal the junior faculty holds.

  **4. The Two-Tier & Expert Wrinkle (Mapping Condition 4)**
  *   **Ask:** "In Condition 4, we tried to concentrate expertise. We let clusters decide, and we let 'Experts' double their vote. Did this help?"
  *   **Concept:** *Aggregation Loss & False Confidence.*
      *   *Two-Tier:* A 4-2 vote in a cluster counts the same as a 6-0 vote. You throw away margin data. If the clusters are small (6), they are prone to error. If all four clusters err (18% chance each), the final vote is between wrong options.
      *   *Experts:* In this game, 'confidence' was uncorrelated with 'accuracy.' Weighting votes by confidence introduced noise.
  *   **Hiring Link:** This challenges the Chair's proposal. Subcommittees reduce the effective sample size of the final vote. Self-declared expertise is often just confidence, which is not competence.

  **5. Handling Failure (If the numbers come out backwards)**
  *   **Scenario:** Condition 1 gets 0/3 right; Condition 3 gets 3/3 right.
  *   **Response:** "This is why we do not trust anecdotes. In a single run of 24 people, luck dominates. The theorem is about the *long run*. If we ran this 1,000 times, Condition 1 would crush Condition 3. Today, the noise won. But notice: in Condition 3, did anyone feel they *couldn't* vote their signal? That pressure is the real cost, even if you got lucky today."
  *   **Safety Net:** Have a printed sheet of "Simulated Averages from 10,000 Runs" to show them if the live data is too noisy.

  **6. Limitations (What the game cannot show)**
  *   **No Reasons:** "In this game, you passed verdicts, not reasons. In a real faculty meeting, discussion allows you to share *why* you think a candidate is good. That can raise $p$ (competence) for everyone. This game makes discussion look like contamination (Condition 3). In reality, good discussion improves the signal; bad discussion creates cascades. You must distinguish between *sharing evidence* and *sharing pressure*."
  *   **No Asymptotics:** "We are 24 people. Condorcet's theorem is about infinity. We are seeing the shadow of the infinite on a small wall. The trend is the lesson, not the specific score."

  ---

  ## VI. Instructor's Safety Net & Troubleshooting

  **If one student is individually perfect:**
  *   **Action:** Do not highlight them during the game. In the debrief, say: "One sensor might be perfect by luck. If we hire based on that one sensor, we risk everything if they leave or burn out. The group is robust; the expert is fragile."

  **If students figure out the experiment early:**
  *   **Action:** Lean into it. "Good. You've identified the variable. Now, does knowing it change how you vote in Condition 3? If you know you're supposed to be independent, can you actually ignore the person before you? That difficulty is the data."

  **If the "Expert" wrinkle actually works:**
  *   **Action:** Acknowledge it. "Sometimes confidence correlates with competence. But in this game, it didn't. In hiring, we often mistake charisma for competence. The game warns us to verify the correlation before weighting the vote."

  **The "Common Cause" Instrument:**
  *   Your idea of pairs sharing one chip is the correct instrument. It mathematically reduces $N$ from 24 to 12 while keeping the vote count at 24. This isolates *correlation* from *group size*. It is the cleanest way to show that "more voters" only helps if they are "more independent."

  ---

  Headline: The design choice that does the most work in making independence visible is the **Paired Evidence condition**, where doubling the voters without doubling the information sources forces the class to experience the collapse of reliability despite the appearance of consensus.
