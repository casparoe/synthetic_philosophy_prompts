      *   *Condition 3 (Deference/Sequential):* Students vote publicly in order. Early votes influence later ones. If the first 3 vote "Red", the 4th might vote "Red" even if they drew "Blue". This creates an information cascade. Accuracy drops significantly, often to near 50% or worse depending on early noise.
      *   *Condition 4 (Two-Tier):* 4 groups of 6. Each group votes. Then the 4 group-reps vote.
          *   Inner group ($N=6, p=0.6$): Accuracy $\approx 82\%$.
