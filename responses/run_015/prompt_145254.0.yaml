          *   0-10: Intro/Setup.
          *   10-25: Cond 1 (Secret). 3 Trials.
          *   25-40: Cond 2 (Pairs). 3 Trials.
          *   40-55: Cond 3 (Sequential). 3 Trials.
          *   55-70: Cond 4 (Two-Tier + Expert). 3 Trials.
          *   70-90: Debrief.

  5.  **Addressing Specific Worries:**
      *   *Ceiling Effect:* With $p=0.61$, $N=24$, accuracy is ~85%. In 3 trials, they might get 3/3 correct. I need to emphasize the *score* (points), not just binary win/loss. Or lower $p$ to 0.55 (10/18 chips). $p=0.55$ makes the group accuracy ~70%. This gives plenty of room for degradation. Let's go with **10 Correct / 8 Incorrect chips (Total 18)**. $p = 0.555$.
