  ### Decision Tree: The Absent-Minded Driver

  **Node 1 (Root):** Does the driver's behavior rely on internal representation or direct environmental coupling?
  *   **Branch A (Direct Coupling):** → **Leaf 1: Ecological Direct-Perception View**
      *   *Most Awkward Commitment:* The driver didn't act at all; the road drove the car.
  *   **Branch B (Internal Representation):** → **Node 2:** Did the standing intention persist causally during the drive-past?
      *   **Branch No (Overridden):** → **Leaf 2: Habitual/Motor Override View**
