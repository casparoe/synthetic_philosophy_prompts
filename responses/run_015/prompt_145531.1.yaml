      *   **Branch Yes (Persisted):** → **Node 3:** Is absent-mindedness qualitatively distinct from running on automatic pilot?
          *   **Branch No (Same):** → **Leaf 3: Unified Automaticity View**
              *   *Most Awkward Commitment:* There is no philosophical difference between a skilled flow-state and an erroneous slip.
          *   **Branch Yes (Distinct):** → **Leaf 4: Attentional Monitoring Failure View**
              *   *Most Awkward Commitment:* Consciousness is a spotlight that can miss the very action it supposedly directs.

  ***

  ### Diagnostic Note: Intentional Action with Zero Consciousness

  Is the combination of "acting intentionally" and "zero consciousness" incoherent or just unexplored?

  It is **theoretically tense but not incoherent**. The incoherence only arises if you define intention as necessarily involving *practical knowledge* (the idea that to act intentionally, you must know what you are doing without observation). If you decouple intention from awareness—treating intention as a dispositional state or a subpersonal command structure—then intentional unconscious action is empirically plausible (e.g., automatism or blindsight cases). However, accepting this forces you to abandon the intuitive link between agency and subjective ownership, implying you can be the author of an action you are not presently aware of authoring.
