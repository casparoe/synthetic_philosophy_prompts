  ### Classification Tree for Long-Run Prediction Verdicts

  This tree classifies verdicts based on the empirical status of the outcome, the validity of the mechanism, and the logical relationship between the theory and any deviations. It is designed for a panel reviewing a case file containing the original prediction, the observed historical data, and the audit of causal mechanisms.

  **Branching Questions**

  1.  **Outcome Concordance:** Did the specific predicted outcome (magnitude, time, location) occur within the stipulated tolerance bounds?
  2.  **Mechanism Verification:** Is the posited causal mechanism empirically confirmed as the primary driver of the outcome (or the potential for it)?
  3.  **Alternative Causality:** If the mechanism is not confirmed, is a distinct, alternative causal mechanism confirmed as the driver?
  4.  **Deviation Type:** If the outcome did not occur within bounds, did it occur *at all* (e.g., significantly late or in a different location)?
  5.  **Intervention Origin:** If the outcome was averted or altered, was the intervening factor a direct response to the prediction itself?
  6.  **Theoretical Permission:** Does the theory's core logic explicitly forbid the intervening factor, or is it treated as an adjustable auxiliary assumption?
  7.  **Expectation Status:** If the outcome has not yet occurred, is it still expected to occur (e.g., is the offsetting factor finite)?
  8.  **Novel Consequence:** Does the explanation for the deviation generate new, risky predictions distinct from the original claim?
  9.  **Asymptotic Restatement:** Is the claim being restated as a limit condition (e.g., "only applies if all else fails") rather than a concrete forecast?

  ***

  ### Verdict Leaves and Templates

  **1. Confirmed**
  *Path:* Q1=Yes, Q2=Yes.
  *Template:* The prediction is **Confirmed**; the outcome occurred within bounds and was driven by the posited mechanism.

  **2. Right Outcome, Wrong Mechanism**
  *Path:* Q1=Yes, Q2=No, Q3=Yes.
  *Template:* The verdict is **Right Outcome, Wrong Mechanism**; the event occurred as predicted but was produced by a cause the theory did not identify.

  **3. Coincidentally Adequate**
  *Path:* Q1=Yes, Q2=No, Q3=No.
  *Template:* The verdict is **Coincidentally Adequate**; the prediction matched reality, but no causal link to the theory's mechanism can be established.

  **4. Right but Self-Preventing**
  *Path:* Q1=No, Q5=Yes.
  *Template:* The verdict is **Right but Self-Preventing**; the prediction was falsified only because agents acted on the warning to neutralize the risk.

  **5. Outright Falsification**
  *Path:* Q1=No, Q4=No, Q6=No.
  *Template:* The verdict is **Outright Falsification**; the outcome did not occur, and the intervention that prevented it violates the theory's core logic.

  **6. Right in Mechanism, Wrong in Timing**
  *Path:* Q1=No, Q4=Yes (Time), Q8=Yes.
  *Template:* The verdict is **Right in Mechanism, Wrong in Timing**; the causal dynamic is valid, but the event arrived outside the predicted window.

  **7. Right but Relocated**
  *Path:* Q1=No, Q4=Yes (Place), Q8=Yes.
  *Template:* The verdict is **Right but Relocated**; the causal dynamic is valid, but the event manifested in a spatial unit other than the one named.

  **8. Right but Deferred**
  *Path:* Q1=No, Q4=No, Q6=Yes, Q7=Yes, Q8=Yes.
  *Template:* The verdict is **Right but Deferred**; the mechanism is active and binding, but the outcome is delayed by a finite, permissible offset.

  **9. Right but Masked**
  *Path:* Q1=No, Q4=No, Q6=Yes, Q7=No, Q8=Yes.
  *Template:* The verdict is **Right but Masked**; the mechanism is active, but the outcome is permanently suppressed by a countervailing force permitted by the theory.

  **10. Immunized**
  *Path:* Q1=No, Q4=No, Q6=Yes, Q8=No.
  *Template:* The verdict is **Immunized**; the theory has been adjusted to accommodate the failure without generating new testable consequences.

  **11. Demoted to Limiting Claim**
  *Path:* Q1=No, Q4=No, Q6=Yes, Q9=Yes.
  *Template:* The verdict is **Demoted to Limiting Claim**; the theory is retained only as an asymptotic truth that applies when all other variables are held constant.

  *(Note: "Confirmed" is included as the necessary baseline control, though not explicitly requested in the "failed prediction" list, it occupies the logical space of Q1=Yes/Q2=Yes.)*

  ***

  ### Analysis of Logical Space and Special Cases

  **Unoccupied and Incoherent Combinations**
  Several logical paths are empty because they contradict the definitions of the verdicts. For example, a path where Q1=Yes (Outcome within bounds) and Q5=Yes (Intervention was a response to prediction) is incoherent: if the outcome occurred within bounds, it was not successfully prevented by the response. Similarly, a path where Q6=No (Core forbidden intervention) and Q8=Yes (New tests generated) is theoretically unstable; if the core forbids the intervention, the theory cannot validly use that intervention to explain a deviation without ceasing to be the same theory. These nodes are unoccupied because they represent logical contradictions rather than unexplored empirical territory.

  **The Credit Assignment for Self-Prevention**
  The tree treats **Right but Self-Preventing** (Leaf 4) as a distinct category from **Outright Falsification**. A prediction that is falsified because people acted on it deserves *more* credit than one that was never tested, provided the theory posits a *tendency* rather than a fixed *event*. If the theory claims "Population *will* exceed food supply by 2000," and policy prevents it, the event prediction is false. However, if the theory claims "Unchecked population growth *tends* to exceed food supply," the policy validates the mechanism by demonstrating that checking the growth prevents the excess. The panel should assign credit based on whether the theory's core (Q6) allows for endogenous response. If the theory treats human foresight as an auxiliary variable, the self-prevention vindicates the mechanism. If the theory treats humans as biologically incapable of foresight (a core assumption), the self-prevention falsifies the core. In the Malthusian case, since the mechanism is biological/arithmetical, the prevention validates the *pressure* even if it falsifies the *catastrophe*.

  **Limits of the Tree**
  The tree cannot distinguish between **Right but Deferred** (Leaf 8) and **Right but Masked** (Leaf 9) without empirical resolution of Q7 (Expectation Status). If the case file does not establish whether the offsetting factor (e.g., cheap natural gas in Case A) is finite or infinite, the panel cannot separate a delay from a permanent suppression. Furthermore, the tree struggles to separate **Immunized** (Leaf 10) from **Demoted to Limiting Claim** (Leaf 11) if the theorists claim their asymptotic restatement generates new tests (Q8) but fail to specify them. In such instances, the failure lies not in the tree but in the indeterminacy of the case file; the verdict depends on the future behavior of the theorists, not the past data.

  ***

  ### Case Applications

  **Case A (The Fertilizer Case)**
  *Analysis:* The yield collapse (Outcome) did not occur within bounds (Q1=No). The mechanism (nitrogen fixation limit) is real and binding in control plots (Q2=Yes). The outcome has not occurred at all yet (Q4=No). The intervention (gas/varieties) is external, not a response to the prediction (Q5=No). The theory permits tech change as an auxiliary (Q6=Yes). The gas is finite, so the outcome is still expected (Q7=Yes). The audit confirms the mechanism, implying new tests on gas depletion are possible (Q8=Yes).
  *Verdict:* **Right but Deferred**.
  *Template:* The verdict is **Right but Deferred**; the mechanism is active and binding, but the outcome is delayed by a finite, permissible offset.

  **Case B (The Aquifer Case)**
  *Analysis:* The famine (Outcome) did not occur in the predicted region (Q1=No). The drawdown (Mechanism) is on schedule (Q2=Yes). The famine occurred elsewhere via export (Q4=Yes, Place). The causal dynamic (exhaustion leads to shortfall) is identical (Q8=Yes).
  *Verdict:* **Right but Relocated**.
  *Template:* The verdict is **Right but Relocated**; the causal dynamic is valid, but the event manifested in a spatial unit other than the one named.

  **Case C (The Antibiotic Case)**
  *Analysis:* The catastrophe (Outcome) did not occur (Q1=No). The intervention (regulation) was a direct response to the forecast (Q5=Yes).
  *Verdict:* **Right but Self-Preventing**.
  *Template:* The verdict is **Right but Self-Preventing**; the prediction was falsified only because agents acted on the warning to neutralize the risk.

  **Case D (The Fishery Case)**
  *Analysis:* The collapse (Outcome) occurred, but twenty years late and in an adjacent stock (Q1=No). The mechanism (recruitment dynamics) was valid, though a parameter was misestimated (Q2=Yes). The outcome occurred outside bounds (Q4=Yes, Time/Place). The explanation (parameter error) allows for corrected future models (Q8=Yes).
  *Verdict:* **Right in Mechanism, Wrong in Timing**. (Note: While relocation occurred, the primary deviation cited is the parameter misestimation causing delay).
  *Template:* The verdict is **Right in Mechanism, Wrong in Timing**; the causal dynamic is valid, but the event arrived outside the predicted window.

  **Case E (The Mirage Case)**
  *Analysis:* The outcome arrived on time (Q1=Yes). The audit shows the cause was not the theory's mechanism (Q2=No). A different cause was identified (Q3=Yes).
  *Verdict:* **Right Outcome, Wrong Mechanism**.
  *Template:* The verdict is **Right Outcome, Wrong Mechanism**; the event occurred as predicted but was produced by a cause the theory did not identify.
