answer: |-
  You have hit on one of the most persistent and difficult problems in contemporary meta-ethics and value theory. Your suspicion is well-founded: while the *intuition* behind the distinction is strong, formulating a **principled criterion** that separates "Right Kind of Reasons" (RKRs) from "Wrong Kind of Reasons" (WKRs) without relying on circular intuition has proven notoriously difficult.

  Here is a breakdown of the conceptual issue, why it is substantive rather than merely verbal, the attempts to solve it, and how it generalizes.

  ### 1. The Core Conceptual Issue
  The problem arises primarily for **Fitting-Attitude (FA) Analyses of Value**.
  *   **The Theory:** Many philosophers want to define value in terms of reasons for attitudes. For example: "$X$ is good" means "It is fitting to favor $X$."
  *   **The Problem:** There are clearly cases where you have a reason to favor $X$, but $X$ is not good.
  *   **The Classic Example (The Evil Demon):** Imagine an evil demon threatens to torture you unless you admire him. You now have a very strong reason to admire the demon (to avoid pain). However, the demon is not *admirable*. His threat gives you a reason to *have the attitude*, but it does not make him *worthy of the attitude*.

  If we cannot distinguish the reason provided by the demon's threat (WKR) from the reason provided by the demon's wit or courage (RKR), we cannot define "admirable" simply as "what there is reason to admire."

  ### 2. Is it Substantive or Just Verbal?
  It is **substantive**, not just a way of talking. Here is why:

  If the distinction were merely verbal, it would mean we are just stipulating definitions (e.g., "By 'value' we mean only RKRs"). But the problem is that our normative concepts seem to come with a specific **structure**.
  *   **Normative Force:** RKRs seem to make an attitude *correct* or *fitting*. WKRs make an attitude *beneficial*, *prudent*, or *useful*.
  *   **The Threat to Reductionism:** If you cannot distinguish them principledly, you cannot reduce value to reasons. You would have to say "Value is what there is reason to favor, *except for the wrong kind of reasons*," which is circular. You are using the concept of value (or fittingness) to define the reasons, rather than using reasons to define value.

  So, the problem is substantive because it blocks a specific philosophical project: explaining value in terms of reasons.

  ### 3. Attempts at a Principled Criterion
  Philosophers have tried to find a non-circular way to distinguish RKRs from WKRs. None are universally accepted, but they clarify the landscape.

  #### A. Object-Given vs. State-Given Reasons (The Standard View)
  *   **Criterion:** RKRs are properties of the **object** of the attitude. WKRs are properties of the **state** of having the attitude.
  *   **Example:**
      *   *RKR:* The demon is brave. (Property of the demon/object).
      *   *WKR:* Admiring the demon saves your life. (Property of the mental state/consequence).
  *   **Why it fails:** There are counterexamples. Imagine a scientist offers you \$1 million to believe that a specific cup is red (when it is blue). The reason (\$1 million) is about the state of believing. That's clearly a WKR. But imagine a case where believing a truth makes you happy. Is the happiness a property of the state? If so, is it a WKR? Most people think pragmatic benefits of truth can sometimes be relevant, blurring the line.

  #### B. The "Correctness" Condition
  *   **Criterion:** RKRs bear on the **correctness** of the attitude. WKRs bear on the **goodness of having** the attitude.
  *   **Example:**
      *   *RKR:* Evidence makes a belief *true* (correct).
      *   *WKR:* Rewards make a belief *beneficial* (good to have).
  *   **Why it fails:** This risks circularity. To say a reason bears on "correctness" is often just to say it is a "Right Kind of Reason." It restates the intuition without explaining the mechanism.

  #### C. The Transparency Test (Shah & Velleman)
  *   **Criterion:** When you deliberate about whether to hold an attitude, can you transparently see the reason as settling the question?
  *   **Application:** When asking "Should I believe $P$?", you can only consider "Is $P$ true?" You cannot consider "Will believing $P$ make me happy?" without ceasing to deliberate about *belief* and starting to deliberate about *policy*.
  *   **Why it fails:** This works well for belief, but less well for emotions or desires. I can deliberate "Should I desire this cake?" by considering both its taste (RKR) and my diet (WKR-ish).

  ### 4. Generalization to Other Normative Concepts
  You asked if this is specific to value. It is not. It generalizes to any "attitude-based" normativity.

  #### A. Epistemology (Reasons for Belief)
  This is the most famous generalization, often discussed as **Pragmatic Encroachment**.
  *   **RKR:** Evidence. (The fingerprint is on the gun).
  *   **WKR:** Pragmatic stakes. (Pascal's Wager: You should believe in God because the payoff is infinite).
  *   **The Debate:** Some epistemologists argue that high stakes *do* change whether you "know" something (encroachment), effectively arguing that what looks like a WKR is actually an RKR. This shows the distinction is live and contested.

  #### B. Action (Reasons to Intend vs. Act)
  This is subtler. Usually, reasons for action are all "Right Kind." However, consider **Self-Fulfilling Prophecies**.
  *   **Scenario:** You should intend to go to the party because if you intend to go, you will relax, and if you relax, you will enjoy it.
  *   **Issue:** Is the relaxation a reason to *intend*, or a reason to *go*? If you can't intend at will, the reason to intend might be the "wrong kind" because you can't act on it directly. This mirrors the WKR problem in the philosophy of intention.

  ### 5. Why it feels "Ad Hoc" (and is it?)
  You mentioned the distinction feels like it relies on intuition. You are right. Currently, **there is no consensus criterion.**

  Many philosophers now accept that the distinction might rely on a primitive normative concept, such as **"Fittingness."**
  *   They argue: We cannot define "Fittingness" in terms of "Reasons." Instead, "Fittingness" is a unique normative relation.
  *   **RKR:** A reason that makes an attitude fitting.
  *   **WKR:** A reason that makes an attitude wise/prudent, but not fitting.

  If this is true, the WKR problem shows that **Value (Fittingness) cannot be reduced to Reasons.** It forces us to accept that "Fittingness" is a fundamental, unanalyzable normative property.

  ### Summary
  1.  **Is it substantive?** Yes. It prevents the reduction of value to reasons and highlights a structural difference in how normativity works (correctness vs. benefits).
  2.  **Is there a clear criterion?** No. The "Object-Given vs. State-Given" distinction is the standard attempt, but it has known counterexamples. Most solutions currently rely on some primitive intuition about "fittingness."
  3.  **Does it generalize?** Yes. It appears in epistemology (evidence vs. pragmatism) and philosophy of action (reasons to intend vs. reasons to act).
  4.  **Is it just verbal?** No. It reflects a real structural feature of our normative thought: the difference between a reason that makes an attitude *merited* versus a reason that makes an attitude *advantageous*.

  The "Wrong Kind of Reasons" problem is essentially the philosophical realization that **incentives are not justifications.** While we can feel the difference, codifying that feeling into a rigorous logical rule remains one of the unsolved challenges of modern philosophy.
