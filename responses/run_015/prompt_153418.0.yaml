answer: |-
  ### Brainstorming & Diagnostic Mapping

  Before we get to the ranked objections, I want to map the conceptual terrain you're walking on. You are proposing a variant of **Ex-Ante Prioritarianism (EAP)**. Standard Prioritarianism (Ex-Post) applies a concave transformation to *actual* welfare outcomes. Your view applies the concave transformation to *expected* welfare (risk exposure) prior to the resolution of the "social lottery."

  Your claim to novelty rests on two pillars:
  1.  **The Metric:** Urgency is determined by probabilistic vulnerability, not realized disadvantage.
  2.  **The LDO Dodge:** You argue that because you aren't targeting equality of outcome, leveling down the well-off doesn't help the worse-off (since their risk profile remains unchanged), thus avoiding the Leveling-Down Objection (LDO).

  *Initial philosophical gut-check:*
  *   **On LDO:** Standard (Ex-Post) Prioritarianism *already* dodges the LDO because it is non-relational; it cares about absolute levels weighted by priority, not the gap. So, your view doesn't gain unique ground here unless you mean it dodges a *specific* version of the objection regarding risk.
  *   **On Risk:** The move to "ex-ante risk" shifts the view closer to Harsanyi's Veil of Ignorance but retains a concave weighting function (unlike Harsanyi's linear utilitarianism). This puts you in tension with **State-Wise Dominance** principles.
  *   **On Formalism:** The biggest hammer hanging over this view is the **Diamond (1967) Critique** regarding ex-ante vs. ex-post Pareto efficiency. If you weight expectations, you can violate preferences that hold in every possible state of the world.

  Okay, let's break this down rigorously.

  ---

  ### Ranked Defeaters: From Fatal to Awkward

  Here is the map of objections, ranked by how much structural damage they do to the view.

  #### 1. The Fatal Defeater: Violation of Ex-Post Pareto (The Diamond Problem)
  This is the canonical formal result in social choice theory that breaks Ex-Ante views.
  *   **The Setup:** Imagine two individuals, A and B. Two states of the world, S1 and S2, each with 50% probability.
      *   **Policy X:** A gets 10 in S1, 0 in S2. B gets 0 in S1, 10 in S2. (Expected Utility [EU] for both = 5).
      *   **Policy Y:** A gets 6 in S1, 6 in S2. B gets 6 in S1, 6 in S2. (EU for both = 6).
  *   **The Conflict:** A standard Ex-Ante Prioritarian (and Utilitarian) prefers Y because it raises expected utility and equality of expectation.
  *   **The Break:** Now consider a modified case (Diamond's point). Suppose Policy X gives A 10/0 and B 0/10. Policy Z gives A 9/0 and B 0/9.
      *   Ex-Ante, everyone is worse off in Z (lower expectation). So EAP prefers X.
      *   But suppose we add a third option, W, where A gets 9 in S1, 9 in S2, and B gets 9 in S1, 9 in S2.
      *   **The Real Killer:** Consider a case where Ex-Ante Prioritarianism prefers a lottery that is *dominated* in every state. If your priority weighting on ex-ante risk is strong enough, you might prefer a risky distribution over a certain one even if the certain one yields higher utility in *every* possible state of the world for *every* person.
  *   **Why it's Fatal:** It violates **State-Wise Dominance**. If everyone is better off in Policy A than Policy B in every possible realization of the lottery, rational morality should prefer A. EAP can violate this if the *distribution of risk* in B is "fairer" ex-ante. A committed EAP defender must bite the bullet that we should sometimes choose an option that makes everyone worse off, no matter how the dice land, because the *dice were fairer*. Most ethicists find this untenable.

  #### 2. The Severe Defeater: The "Collapse into Utilitarianism" via Linearity of Expectation
  *   **The Formal Issue:** Expected Utility is linear. $E[U] = \sum p_i u_i$.
  *   **The Problem:** If your social welfare function is $W = \sum g(E[U_i])$, you are applying the priority weight $g$ to the *average*.
  *   **The Limit Case:** In a large population with independent risks (Law of Large Numbers), the ex-ante expected utility converges to the ex-post average utility. If risks are pooled socially (insurance), the ex-ante risk exposure becomes a proxy for ex-post resource allocation.
  *   **The Collapse:** If you cannot distinguish between "bad luck in the lottery" and "systemic disadvantage," your view struggles to differentiate itself from standard Utilitarianism in the long run, unless you insist on a non-linear aggregation of probabilities themselves (which leads to Allais Paradox violations). If you treat risk objectively, you lose the "priority" element in the limit of large numbers. If you treat it subjectively, you lose objectivity.

  #### 3. The Severe Defeater: Historical Injustice & The Time-Slice Problem
  *   **The Intuition:** Prioritarianism is typically forward-looking. Your Ex-Ante version is *doubly* forward-looking (looking at future risks).
  *   **The Failure Case:** Consider a victim of past injustice (e.g., historical discrimination) who currently holds a secure, low-risk position (perhaps due to reparations or a protected job) but has a lower *lifetime* welfare baseline due to past harm.
  *   **The Defeat:** Your metric weights *current ex-ante risk*. If the victim is now secure, their moral urgency drops to zero, even if they are worse off than others due to past wrongs. Conversely, a privileged person entering a volatile market might have high "risk exposure" and thus gain high moral priority, potentially outweighing the victim of past injustice.
  *   **Why it hurts:** It severs the link between *compensation* and *urgency*. A theory of distributive justice that cannot account for rectification without smuggling in ex-post metrics is incomplete.

  #### 4. The Awkward Defeater: Catastrophic Risk & Fat Tails (Weitzman's Dismal Theorem)
  *   **The Context:** In climate ethics and existential risk, we deal with low-probability, infinite-disutility events.
  *   **The Problem:** Ex-Ante Prioritarianism calculates $g(E[U])$. If the probability of catastrophe is $p$ and disutility is $-\infty$, the expectation is undefined or infinite.
  *   **The Awkwardness:** Standard Prioritarianism handles this by weighting the terrible outcome heavily ex-post. Ex-Ante Prioritarianism might dampen this urgency if the *probability* is low enough, because it weights the *expectation*. If the "risk exposure" is averaged across a population where most face low risk, the aggregate urgency might be diluted compared to an Ex-Post view that screams when the catastrophe actually looms. It risks bureaucratic calmness in the face of extinction events because "the odds are still in our favor."

  #### 5. The Methodological Defeater: Unfalsifiability via Metric Tweaking
  *   **The Charge:** You mentioned tweaking the risk metric. If "risk exposure" is defined normatively (e.g., "reasonable risk" vs. "actual statistical risk"), the view becomes a shell.
  *   **Example:** If a counterexample shows your view favors a rich gambler over a poor stable worker, you might say, "Ah, but the poor worker's risk of *capability deprivation* is higher."
  *   **The Problem:** If the metric of risk is adjustable to fit intuitions, the theory has no predictive power. It becomes "Prioritarianism plus whatever definition of risk yields the right answer."
  *   **Is it Fatal?** Not fatal, but it reduces the view from a *foundation* to a *heuristic*. You must commit to an objective metric of risk (e.g., variance in income, probability of falling below a threshold) to avoid this.

  ---

  ### Specific Limit Cases & Collapses

  You asked: *In what limit cases does ex-ante prioritarianism collapse back into ex-post egalitarianism?*

  Actually, it rarely collapses into **Egalitarianism**. It is more prone to collapsing into **Utilitarianism** or **Ex-Post Prioritarianism**.

  1.  **The Certainty Limit:** As probability $p \to 1$ for all outcomes (a deterministic world), Ex-Ante Prioritarianism becomes **Ex-Post Prioritarianism**. It does *not* become Egalitarianism unless your priority function $g$ becomes lexicographic (Rawlsian).
  2.  **The Perfect Correlation Limit:** If social risk is perfectly correlated (we all sink or swim together), Ex-Ante and Ex-Post views converge.
  3.  **The Collapse to Egalitarianism:** This only happens if you define "risk exposure" as "distance from the mean." If risk = deviation from average welfare, then minimizing risk burden *is* minimizing inequality. But this is circular. You would be defining risk egalitarianly to get an egalitarian result. A smart defender should **concede** that the view does *not* collapse to egalitarianism, but rather stands as a distinct third option that risks violating Pareto efficiency (see Defeater #1).

  **Would a smart defender concede the collapse?**
  No, a smart defender should concede the **Pareto Violation**, not the Egalitarian collapse. The distinctiveness of your view is that it values *fairness of chances* over *fairness of outcomes*. You must admit that this sometimes requires sacrificing outcome efficiency.

  ---

  ### Compensation & Catastrophe: Handling the Hard Cases

  **1. Compensation for Past Injustice:**
  *   **Verdict:** Your view handles this **badly**.
  *   **Reason:** Ex-ante risk is inherently prospective. It asks, "How likely are you to suffer?" It does not ask, "How much have you suffered?"
  *   **Fix:** You would need to hybridize the view. You'd need to say "Current Risk + Past Deficit = Moral Urgency." But once you add "Past Deficit" (an ex-post metric), you've abandoned pure Ex-Ante Prioritarianism. A committed defender must admit that pure EAP is insufficient for transitional justice.

  **2. Catastrophic Risk:**
  *   **Verdict:** Your view handles this **precariously**.
  *   **Reason:** Because you weight the *expectation*, a 0.001% chance of extinction might be weighted less than a 50% chance of moderate poverty for a million people, depending on the curvature of $g$.
  *   **Fix:** You need a "disaster constraint" or a lexical threshold. But again, this is an ad-hoc addition. The pure math of expectation maximization (even with concave weighting) is vulnerable to "Pascal's Mugging" style problems or conversely, ignoring fat tails.

  ---

  ### The Unfalsifiability Charge: Is it a Problem?

  You asked: *Check whether I've insulated the view into unfalsifiability by letting me tweak the risk metric... and if so, is that actually a problem?*

  **Diagnosis:** Yes, you have insulated it.
  **Is it a problem?** Yes, for a normative theory claiming to guide policy.

  If "risk exposure" can be defined as:
  *   Income volatility?
  *   Health probability?
  *   Capability failure?
  *   Subjective anxiety?

  ...then for any counterexample, you can switch the metric.
  *   *Counterexample:* "Your view favors the reckless investor over the steady laborer."
  *   *Defense:* "No, we measure risk in terms of *capability stability*, where the laborer is higher risk."

  **Why this is dangerous:** It makes the theory non-falsifiable. In social choice theory, we need to know the *inputs* to judge the *function*. If the inputs are malleable, the function is meaningless.
  **Recommendation:** To save the view, you must **fix the currency of risk**. You must say, "Risk is defined objectively as variance in [X]," and accept the counterexamples that follow. If you refuse to fix the currency, you are not doing moral philosophy; you are doing intuition matching.

  ---

  ### The "Bill of Concessions": What a Committed Prioritarian Must Admit

  If I were examining your dissertation, here is what I would require you to admit to grant you the degree. A smart defender of Ex-Ante Prioritarianism must concede:

  1.  **The Pareto Cost:** "I admit that my view can violate Ex-Post Pareto efficiency. I believe fairness of the *process* (the lottery) sometimes outweighs the welfare of the *outcome*." (This is the Diamond bullet).
  2.  **The Historical Blindspot:** "My view is not a complete theory of justice. It requires a supplementary principle of rectification for past harms, as risk exposure does not track historical debt."
  3.  **The Metric Commitment:** "I commit to an objective definition of risk (e.g., variance in primary goods) and will not tweak it ad hoc to save intuitions about specific cases."
  4.  **The LDO Redundancy:** "I acknowledge that Ex-Post Prioritarianism also dodges the Leveling-Down Objection. My view's advantage is not avoiding LDO, but rather capturing the moral significance of *vulnerability* prior to harm."

  ### Final Word

  Your view is sophisticated, but it trades the problems of Ex-Post Prioritarianism (which are mostly about aggregation) for the problems of Ex-Ante views (which are about **dominance and rationality**). The claim that you dodge the Leveling-Down Objection is your weakest selling point (since EPP does that too). Your strongest selling point is the moral intuition that *vulnerability* itself is bad, regardless of outcome.

  Focus your defense there. Don't fight the Pareto violation; own it as a feature of caring about procedural fairness. But fix your risk metric, or the whole structure dissolves into verbal maneuvering.

  *(And don't worry about the typos; the sticky spacebar is a classic ABD hazard.)*
