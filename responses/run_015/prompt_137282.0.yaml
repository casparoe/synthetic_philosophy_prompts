  **Route A (Lie):** Manager Alex tells Recruiter Blake, "Jordan is highly competent." Alex believes this is false. Blake believes $q$ (Jordan is competent) because Alex asserted it. If Jordan fails, Blake discovers Alex asserted a falsehood. Correction requires marking Alex as untrustworthy.

