      *   *Claim:* Pareto improvement. Both win.
      *   *Engineering Spin:* Build a platform to reduce transaction costs.

  3.  **Drafting Section 1: The Correspondence Table:**
      *   *Trader:* The moral agent (Priya/Marcus).
      *   *Asset:* The action/outcome (e.g., "chickens not killed," "AI safety research hours").
      *   *Currency:* This is tricky. In standard markets, it's money. In moral trade, it's *compliance effort* or *opportunity cost*.
      *   *Price:* The exchange rate of effort (e.g., 1 hour of AI work = $500 to animal charity).
      *   *Numeraire:* This is the critical failure point. In markets, it's USD. In moral trade, it's *Subjective Moral Utility*. There is no common numeraire.
      *   *Arbitrageur:* The platform/matcher.
      *   *Exchange:* The "plumbing" (chat group, website).
