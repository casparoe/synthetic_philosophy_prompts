      *   Verdict on plumbing/exploitation? Check.
      *   Better analogy? Check.
      *   Plane-friendly (self-contained)? Check.

  10. **Final Polish:** Ensure the distinction between "Pareto improvement" (both feel better) and "Social Welfare" (objective good) is clear, as this is the crux of the EA tension. (Wait, user said no philosophy class. Keep it to "Subjective Gain" vs "Objective Outcome".)

  *(Self-Correction during drafting)*: I need to be careful with the "Numeraire" explanation. In economics, a numeraire is a good against which value is measured. In moral trade, there *is* no common numeraire. That's the bug. I need to explain that clearly without jargon overload.

  *(Refining the "Exploitation" point)*: The chat claims "no exploitation by construction." This is false because of asymmetric information. If Priya lies about how much she cares, Marcus loses. I need to emphasize *information asymmetry*.

  *(Refining the "Truth" point)*: The user mentioned arbitrage pushes prices to truth. In moral trade, there is no "truth" price. There are just preferences. So arbitrage just amplifies preference intensity, not correctness. This is a key distinction.

