      *   *Verifiability:* Markets assume you can check the goods. Moral actions are often internal or hard to measure.
      *   *Stationary Preferences:* Markets assume preferences don't change wildly during the trade. Moral views might shift or be strategic.
      *   *Common Knowledge of Rationality:* Markets assume people know what they want. Do Priya and Marcus *really* know their moral weights?
