      *   *Clarifying "Transferable Utility":* Make sure to explain this simply. Money allows me to compensate you *in the units you care about*. Moral trade forces me to compensate you in *actions* I don't care about.
      *   *The "Truth" Point:* This is crucial. Financial arbitrage corrects mispricing. Moral arbitrage amplifies divergence. I need to make sure this lands hard.
      *   *The "Blackmail" Point:* Address the "manufacturing harm" concern. If I can get paid to *not* do bad thing X, I have an incentive to threaten X.

  9.  **Final Review against Constraints:**
      *   No citations? Check.
