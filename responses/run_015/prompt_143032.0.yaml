  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Stability of Indirect Normativity: Procedure vs. Transformation
  **To:** [Friend's Name]
  **From:** [Your Name]
  **Date:** October 26, 2023

  **Preamble**

  This document summarizes the current state of our dialectical stalemate regarding the foundations of indirect normativity. We agree that the core intuition—that norms bind us because of how they relate to our deliberative capacities rather than independent moral facts—is viable. However, we disagree on the metaphysical and psychological cost of making that intuition work. The following text is drafted to crystallize exactly where our positions diverge, ensuring that future argumentation targets substantive faults rather than terminological shadows.

  ### I. Agreed Claims (Shared Formal Commitments)

  Both the Reflective-Rejection Contractualists (RRC) and the Transformative-Endorsement Deliberationists (TED) affirm the following propositions as the baseline for this dispute:

  1.  **Anti-Realism:** Neither side defends the existence of moral properties that exist independently of agents and their deliberative capacities. Normative authority is constituted by the relation between agents and principles, not by correspondence to external moral truth.
  2.  **Counterfactual Authority:** Actual consent is not required for a norm to bind. Authority derives from what agents *would* agree to, or fail to reject, under specified idealized conditions, regardless of their actual empirical consent.
  3.  **Anti-Aggregativism:** Both sides reject the view that normative validity is determined by the sum total of preference satisfaction. The individual standing of each agent imposes a constraint that cannot be overridden by net social gain.
  4.  **Procedural Necessity:** A purely formal procedure without substantive constraints on the inputs or the process yields no normative output. Some substantive constraint is required to prevent the procedure from validating obviously abhorrent principles.
  5.  **The Collapse Risk:** Both sides acknowledge the risk that their view may collapse into direct moral realism (if the constraints on the procedure are too robust) or empty proceduralism (if the constraints are too thin).

  ### II. Disagreements Table

  The following table isolates the precise points of divergence. The wording in the left column is endorsed *only* by the RRC; the wording in the right column is endorsed *only* by the TED. No neutral gloss is applied.

  | Point of Divergence | Reflective-Rejection Contractualist (RRC) Formulation | Transformative-Endorsement Deliberationist (TED) Formulation |
  | :--- | :--- | :--- |
  | **1. The Status of the Agent** | The agent enters the procedure with a fixed practical identity and a set of actual normative commitments that must be respected as the baseline for rejection. | The agent enters the procedure with a provisional evaluative framework that is subject to revision, dissolution, or reconstruction as a condition of valid agreement. |
  | **2. The Mechanism of Validation** | A principle is valid if no agent can mount a *reasonable rejection* based on their personal standpoint and generic reasons available to all. | A principle is valid if all agents arrive at a *genuine endorsement* through a process of reciprocal perspective-taking that alters their initial standpoints. |
  | **3. The Source of Constraint** | The constraint lies in the *veto power* of the individual; the procedure must accommodate the agent's existing interests unless rejecting them is objectively unreasonable. | The constraint lies in the *transformative demand* of the dialogue; the agent must accommodate the procedure's requirements even if it overrides their existing interests. |
  | **4. The Nature of Binding Force** | I am bound because the principle respects my standing as I am; to violate it is to disrespect my actual capacity to reject impositions. | I am bound because the principle reflects who I have become through deliberation; to violate it is to betray my authentic, deliberatively formed will. |
  | **5. Handling Deep Disagreement** | If agents retain incompatible commitments after full information, the norm fails unless the rejection is based on reasons others must acknowledge as generic. | If agents retain incompatible commitments, they have failed to deliberate correctly; the norm holds if it is what they *would* endorse upon sufficient transformation. |

  ### III. The Cruxes: Retention and Residue

  We identify two specific sub-questions where a resolution would force at least one camp to concede or significantly modify their position.

  #### Crux 1: The Retention Problem
  *Question:* Is an agent bound by a norm if her pre-deliberation practical identity is discontinuous with the perspective that endorsed it?

  *   **RRC Prediction:** If the deliberative process fundamentally alters the agent's core commitments to the point where the "outputting" agent is not the "inputting" agent, the norm is an alien imposition. Binding force requires continuity of the self.
  *   **TED Prediction:** If the deliberative process fails to alter the agent's core commitments when those commitments block consensus, the result is merely a modus vivendi, not a normative truth. Binding force requires the self to be adequate to the task of agreement.
  *   **Concrete Test Case:** *The Zealot Scenario.* An agent enters deliberation holding a deeply entrenched, identity-constituting religious conviction that forbids equality with non-believers. Full information does not change their facts, only their clarity.
      *   **RRC Anticipated Outcome:** The Zealot can reasonably reject norms demanding equal treatment if those norms violate their core identity, *unless* "reasonableness" is defined externally (risking collapse into realism). The procedure must find a compromise that respects the Zealot's standing.
      *   **TED Anticipated Outcome:** The Zealot's framework is defective. The valid norm is equality, and the Zealot is bound by it because a properly transformed agent (which the Zealot failed to become) would endorse it. The Zealot's actual identity is irrelevant to the validity.

  #### Crux 2: The Residue Problem
  *Question:* Can there be binding norms that no actual or counterfactual agent in the procedure generates, yet that we have reason to treat as constraints on the procedure itself?

  *   **RRC Prediction:** Yes. The standard of "reasonableness" used to judge rejections is itself a normative residue that is not generated by the procedure. It constrains what counts as a valid rejection.
  *   **TED Prediction:** No (in principle). All constraints, including reciprocity and openness, must be derivable from the pragmatic presuppositions of the deliberation itself. If a constraint cannot be endorsed by the deliberators, it is illegitimate.
  *   **Concrete Test Case:** *The Exclusion Clause.* Suppose the deliberators unanimously agree (or would unanimously agree) to exclude a certain class of beings (e.g., future generations or non-human animals) from consideration to simplify the agreement.
      *   **RRC Anticipated Outcome:** The agreement is invalid. The constraint against excluding vulnerable parties is a residue of "reasonableness" that binds the procedure, even if no current agent generates a rejection on their behalf.
      *   **TED Anticipated Outcome:** The agreement is invalid. A truly transformative deliberation would necessarily expand the circle of concern. If it doesn't, the deliberation was structurally flawed. The constraint comes from the *nature* of endorsement, not an external rule.
      *   **The Disagreement:** RRC admits the constraint is external to the agents' wills (residue); TED insists the constraint is internal to the structure of communication (no residue).

  ### IV. Analysis of Verbal vs. Substantive Dispute

  We must determine whether our disagreement is merely about how we describe the same normative landscape or whether we are mapping different territories.

  **1. "Reasonable Rejection" vs. "Genuine Endorsement"**
  *   **Verbal Component:** If "Reasonable Rejection" implicitly requires an agent to adopt a generalized perspective that strips away idiosyncratic commitments, then RRC is functionally identical to TED. Conversely, if "Genuine Endorsement" allows an agent to endorse a principle *as* a member of their specific community without changing their core values, TED is functionally identical to RRC.
  *   **Substantive Component:** The dispute is substantive if RRC insists that some commitments are *immune* to deliberative pressure (trumps), whereas TED insists that *no* commitment is immune to the pressure of reciprocal justification.
  *   **Resolution Condition:** If we can agree on a list of commitments that are immune to revision, the dispute dissolves into RRC. If we agree that no commitments are immune, it dissolves into TED. Currently, we disagree on the immunity of "practical identity."

  **2. "Retaining Commitments" vs. "Being Open to Transformation"**
  *   **Verbal Component:** This may be a difference in emphasis. RRC focuses on the *input* (you bring yourself to the table); TED focuses on the *process* (the table changes you). It is possible that a successful RRC procedure inevitably leads to transformation, and a successful TED procedure inevitably respects identity.
  *   **Substantive Component:** The dispute is substantive regarding the *direction of fit*. RRC claims the procedure must fit the agent (to avoid alienation). TED claims the agent must fit the procedure (to avoid arbitrariness).
  *   **Resolution Condition:** This dissolves only if we can show that "alienation" and "arbitrariness" are the same failure described differently. Currently, we treat them as distinct failure modes.

  **Conclusion**
  We remain at an impasse because the RRC fears the TED view authorizes moral tyranny in the name of self-improvement, while the TED fears the RRC view enshrines moral stagnation in the name of respect. Until the Retention Problem is settled—specifically, until we agree on whether the "self" that binds us is the one that enters the room or the one that leaves it—this collaboration cannot proceed to a unified theory.

  **Signed,**

  _________________________
  (Reflective-Rejection Contractualist)

  _________________________
  (Transformative-Endorsement Deliberationist)
