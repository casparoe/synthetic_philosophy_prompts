  7.  **Self-Correction/Nuance during drafting:**
      *   *Correction:* I need to be careful not to say Kircher had *no* Outer Message. He had a *hypothesized* Outer Message (ideographic). The problem was it was false.
      *   *Nuance on Frame:* Hofstadter often treats the Frame as something encoded (e.g., "Hello" in a signal). In archaeology, the Frame is often contextual (found in a temple, looks like other writing). I need to highlight this divergence. The Rosetta Stone's *trilingualism* is part of the Frame—it signals "decodable."
