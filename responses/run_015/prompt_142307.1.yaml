  4.  **Drafting the Critique (Task 2):**

      *   *Bootstrapping:*
          *   Hofstadter assumes a sender provides the Outer Message (like a preamble). In decipherment, the receiver *constructs* the Outer Message using hypotheses about the Inner Message (e.g., "This must be Ptolemy").
          *   *Implication:* The distinction blurs. The "Outer" isn't delivered; it's induced from the "Inner." This suggests the levels are hermeneutic circles, not linear layers.
          *   *Verdict:* The split survives but becomes dynamic. It's not an artifact of supplied codes, but a description of the *state of knowledge*.
      *   *Wrong-Key Case (Kircher):*
