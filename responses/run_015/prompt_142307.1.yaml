      *   **Task 2: Pressing the Framework (Critique):**
          *   *Bootstrapping:* The circularity of guessing the Inner Message (names) to find the Outer Message (code). Does the split survive when the decoder is constructed, not supplied?
          *   *Wrong-Key Case:* Kircher's fluent but wrong translations. Suggests Frame Message is empty/inferred, not a message. Does this collapse or relocate the distinction?
      *   **Task 3: Application:** Apply conclusions to an unread script (Indus Valley). Which level is missing? What evidence settles it?
