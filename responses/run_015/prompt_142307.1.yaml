  2.  **Recall/Reconstruct Hofstadter's Framework (from GEB, specifically "Shrinking Machines" or "The Location of Meaning"):**

      *   *Frame Message:* The signal that tells the receiver "There is a message here intended for you." It establishes the channel and the intent to communicate. (e.g., "This is a letter," "This is a puzzle.")
      *   *Outer Message:* The instructions on *how* to decode the Inner Message. It contains the key, the grammar, the cipher rules. (e.g., "Shift letters by 3," "This is Greek," "Cartouches = Names.")
      *   *Inner Message:* The actual content/semantic payload. (e.g., "The King is victorious," "Meet me at noon.")
      *   *Nuance:* Hofstadter emphasizes that these levels are relative. The Outer Message of one layer can be the Inner Message of a deeper layer.

  3.  **Drafting the Mapping (Task 1):**

      *   *Kircher:*
          *   Frame: Had it. Knew it was a communication (religious/philosophical).
          *   Outer: Wrong. Assumed purely ideographic/symbolic.
