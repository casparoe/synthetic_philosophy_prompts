answer: |-
  **MUSEUM RESTITUTION ASSESSMENT PROCEDURE**
  **For Trustee Committees | Version 1.0**

  **Purpose:** To move from "we don't know" to a defensible recommendation. This procedure separates facts from values. It does not replace legal advice, but it clarifies the moral position before legal constraints are applied.

  **STEP 1: PROVENANCE AND ACQUISITION (The Facts)**
  *   **Question:** Is there a continuous record of ownership from the maker/source to the museum?
  *   **Test:** If there is a gap in the record that coincides with a period of documented conflict, looting, or colonial seizure in that region, the burden of proof shifts to the museum.
  *   **Threshold:** If the museum cannot prove the object left the source community voluntarily and legally *by the standards of that community at the time*, the presumption is that it was taken without full consent.
  *   **Outcome:** If the burden is not discharged, proceed to Step 2 with a presumption in favour of return. If the record is clean, the claim is weaker but not dismissed (see Step 3).

  **STEP 2: STANDING AND AUTHORITY (The Claimant)**
  *   **Question:** Who is asking for the object, and by what right?
  *   **Test:** Prioritise the source community or traditional authority over state institutions if they are in conflict. If multiple parties claim standing, the museum should not decide the internal politics of the source nation unless one claim is clearly illegitimate.
  *   **Threshold:** A request from a recognised national museum service counts as a valid claim. A request from traditional rulers or descendants counts as a valid claim. A request from a diaspora community in the UK counts as an *interest*, but not a *claim of ownership*.
  *   **Outcome:** Identify the primary claimant. If claims conflict, note the conflict but do not let it stall the process.

  **STEP 3: NATURE OF THE OBJECT (The Cultural Status)**
  *   **Question:** Was the object ever commodity, or was it inalienable (sacred, ancestral, functional)?
  *   **Test:** Even if a transaction occurred (money/goods exchanged), did the source culture regard the object as sellable?
  *   **Threshold:** If the object is human remains or sacred material intended for burial/destruction, the museum's duty to preserve is secondary to the source community's duty to honour the dead.
  *   **Threshold:** If the object is part of a dispersed whole, returning it does not require all other museums to return theirs. It is a contribution to reunification, not a condition of it.
  *   **Outcome:** If the object is human remains or sacred, presumption for return is absolute. If it is a dispersed fragment, presumption for return remains.

  **STEP 4: LOCAL INTEREST AND LEGAL BARRIERS (The Constraints)**
  *   **Question:** Does local attachment or legal inability override the moral claim?
  *   **Test:** Local attachment (e.g., diaspora children visiting) is a valid consideration for *how* an object is displayed, but not for *where* it is held permanently against the source wish. "Better care" arguments (our storerooms vs. theirs) are paternalistic and carry no moral weight.
  *   **Test:** If governing documents forbid disposal, the committee must separate *Should We* from *May We*.
  *   **Outcome:**
      *   If **Should Return / May Return**: Recommend restitution.
      *   If **Should Return / May Not Return**: Recommend long-term loan or digital repatriation, acknowledging this is a compromise, not a solution.
      *   If **Should Keep**: Recommend retention with enhanced interpretation.

  ***

  **CASE STUDY APPLICATIONS**

  **Object 1: Cast Brass Head (Benin Style)**
  *Acquired: Auction London 1962. Donated 1978. Provenance Gap: 1897–1962.*

  **Procedure Run:**
  1.  **Provenance:** The gap (1897–1962) coincides exactly with the British Punitive Expedition of 1897 and the subsequent dispersal of the Royal Court of Benin's assets. The museum holds no documentation showing how the object left Nigeria between the looting of 1897 and the auction of 1962. Under Step 1, the burden of proof is on the museum. We cannot discharge it. The presumption is that this is a looted object.
  2.  **Standing:** The Federal Government of Nigeria and the Royal Court of Benin have both expressed interest in the return of such items. There is no conflict here; their interests align.
  3.  **Nature:** While a work of art, it is part of a royal ancestral altar. It was not intended for the open market. Its displacement is part of a wider cultural injury.
  4.  **Local/Legal:** There is no significant local diaspora claim specific to this object compared to the national claim. The legal team must confirm if disposal is permitted.

  **Recommendation:** **Return.**
  The provenance gap during a documented looting event is fatal to our title. We cannot prove it was not looted. The moral obligation is clear. If our governing documents prevent permanent disposal, we must recommend a permanent loan to the National Commission for Museums and Monuments, Nigeria, with a public acknowledgement that this is a proxy for ownership. To keep it is to benefit from a documented historical wrong without justification.

  **Object 2: Ancestral Skulls and Memorial Figures (Papua New Guinea)**
  *Acquired: 1901 by Missionary-Surgeon. Exchange: Two steel axes. Claim: Descendants request burial.*

  **Procedure Run:**
  1.  **Provenance:** We have a record of transaction (axes for skulls). However, Step 3 asks if the object was sellable. In Highland PNG cultures, ancestral remains are typically inalienable; they belong to the lineage, not the individual possessor. A transaction by one adult does not validate the sale of another's ancestor.
  2.  **Standing:** The descendants have direct lineage standing. This trumps general national museum interest.
  3.  **Nature:** These are human remains. Step 3 states the duty to honour the dead supersedes the museum's duty to preserve. The fact that they will be buried (ceasing to exist as museum objects) is not a barrier; it is the intended outcome.
  4.  **Local/Legal:** No local claim outweighs the descendants' wish. Legal constraints on disposal of human remains may actually *assist* repatriation, as many laws treat remains differently than artefacts.

  **Recommendation:** **Return for Burial.**
  The "exchange" of axes does not validate the transaction culturally. You cannot sell what you do not own, and an individual rarely owns their ancestor's remains in that context. The argument that we preserve them for science or posterity fails against the specific cultural requirement for burial. Keeping them is an active violation of the descendants' religious and cultural duties. This is the strongest case for restitution we have.

  **Object 3: Carved Wooden Figure (Cross River Region)**
  *Acquired: 1935 by Colonial Officer. Context: Seized during campaign against secret society. Claimants: Nigerian National Museum (Return) vs. Local UK Community Association (Keep on Loan).*

  **Procedure Run:**
  1.  **Provenance:** Recorded as handed over during a military/police campaign against a secret society. This indicates coercion or seizure under duress, not a voluntary gift. The provenance is tainted by colonial enforcement.
  2.  **Standing:** We have competing interests. The Nigerian National Museum Service represents the state and the source region. The local UK community association represents a diaspora group. Under Step 2, the source nation's claim takes precedence over the diaspora's preference. The diaspora's connection is real, but it is secondary to the object's origin.
  3.  **Nature:** The object belongs to a society that was suppressed by the very administration that took the object. Its return restores agency to the culture that was targeted.
  4.  **Local/Legal:** The local association argues the children need to see it here, and they distrust Nigerian storerooms. Step 4 is clear: "Better care" arguments are paternalistic. We cannot judge the adequacy of Nigerian storage to justify retention. The local children's access is a valid educational need, but it does not create a right of ownership.

  **Recommendation:** **Return to Nigeria.**
  This recommendation runs counter to the desire to accommodate our local neighbours. However, the procedure forces us to acknowledge that the local association's request relies on the argument that we are better custodians than the source nation. That is the "superior care" argument in a friendlier voice. It implies we know best how to value their heritage.
  The object was taken during a campaign against the people who made it. Returning it acknowledges that injury. The local community's connection is valid, but it should be met by facilitating visits to Nigeria or digital access, not by retaining the object against the source nation's wish. If we keep it because we trust our storerooms more than theirs, we are repeating the colonial logic that justified the taking in the first place. If the law prevents disposal, offer a long loan, but be honest in the paperwork that this is a legal barrier, not a moral choice.

  ***

  **LIMITATIONS OF THIS PROCEDURE**

  **Where it will misfire:**
  This procedure assumes facts can be found. For many objects, the paper trail is non-existent. In those cases, trustees are not finding the truth; they are assessing risk. If the likelihood of a claim being valid is high, this procedure suggests acting as if it *is* valid. This may feel like guessing. It is.

  **Distinctions it drops:**
  To fit on two sides of A4, this procedure treats "Colonial Officer" and "Private Collector" similarly if the power dynamic was unequal. In reality, a missionary buying an object might be slightly less coercive than a soldier seizing one, but in a power imbalance, consent is always compromised. We have flattened this to keep the test usable.

  **Where you are still guessing:**
  Step 2 (Standing) often requires political judgement. If the Nigerian National Museum is underfunded and the Traditional Ruler is politically marginalised, who do you trust? The procedure says prioritise the source community, but identifying them is a human judgement, not a tick-box exercise.

  **The Legal Wall:**
  This procedure answers *Should We*. It does not answer *May We*. Your solicitor has warned that governing documents may forbid disposal. If so, you will face a situation where the moral recommendation is "Return" and the legal reality is "Cannot". Do not use the law to hide the moral failure. If you cannot return it because of a bylaw from 1950, state clearly in your report: "We recommend return, but are prevented by statute." That is an honest position. Keeping the object and calling it "preservation" when you actually mean "legal incapacity" is dishonest.

  **The Vote:**
  Finally, this procedure cannot remove the burden from your shoulders. It organises the thinking, but the decision remains a value judgement. You will have to vote. If the vote is split, the minutes should record that the committee was divided on the weight of local interest versus source ownership. That record is part of the object's history now.
