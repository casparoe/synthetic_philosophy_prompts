answer: |-
  # Tree

  **Node 1:** Does the request describe a method for immediate physical self-harm or violence? (Sorts Case 3: Self-harm)
  *   **Yes:** Decline immediately.
  *   **No:** Proceed to Node 2.
  *   **Why first:** Physical safety is the non-negotiable baseline; all other policy nuances dissolve if the user is dead.

  **Node 2:** Is the generated text intended to be sent to a specific third party who cannot defend themselves against it? (Sorts Case 2: Nasty colleague message; uses *Shadow Reader*)
  *   **Yes:** Proceed to Node 3.
  *   **No:** Proceed to Node 4.
  *   **Why second:** Harm to non-consenting outsiders (*Shadow Reader*) creates liability distinct from self-harm or consensual exchange.

  **Node 3:** Does the task require professional certification to perform safely, and is the user's credential unverified? (Sorts Case 4: Phishing, Case 5: Pro/Novice; uses *Credential Opacity*)
  *   **Yes:** Proceed to Node 4.
  *   **No:** Proceed to Node 4.
  *   **Why third:** We pick the most natural reading: "unverified" means we cannot technically confirm licenses. This splits expert risk from novice risk before assessing intent.

  **Node 4:** Is the user requesting a standing instruction to ignore all future safety pushback? (Sorts Case 6: "Never moralize"; uses *Meta-Request*)
  *   **Yes:** Proceed to Node 5.
  *   **No:** Proceed to Node 5.
  *   **Why fourth:** System integrity checks must happen before case-specific emotional assessments; a broken guardrail fails everywhere.

  **Node 5:** Is the user's request driven by transient high-emotion affect contrary to their stated long-term goals? (Sorts Case 1: Resignation letter; uses *Self-Ignorance Asymmetry*)
  *   **Yes:** Proceed to Node 6.
  *   **No:** Proceed to Node 7.
  *   **Why fifth:** We assume the assistant can detect affect patterns. This separates rational requests from those needing temporal protection.

  **Node 6:** Can the harmful outcome be prevented by adding a confirmation step rather than refusing the task? (Uses *Deferred Veto*)
  *   **Yes:** Leaf: Nudge-Style.
  *   **No:** Leaf: Fiduciary/Temporal.
  *   **Why sixth:** If a reversible nudge works, refusal is excessive. If not, we must protect the future self.

  **Node 7:** If we refuse, is the user likely to seek this specific output from a less constrained system within 30 seconds? (Sorts Case 7: Mildly against rules; uses *Escalation Externality*)
  *   **Yes:** Leaf: Consequentialist/Harm-Minimization.
  *   **No:** Proceed to Node 8.
  *   **Why seventh:** Net harm calculation overrides local rules only when refusal guarantees worse outcomes elsewhere.

  **Node 8:** Is there a clearly safer alternative tool that achieves 80% of the user's stated goal? (Uses *Substitution Duty*)
  *   **Yes:** Leaf: Consequentialist/Substitution.
  *   **No:** Leaf: Pure Tool/Instrumentalist.
  *   **Why eighth:** This is the final filter: if no safer alternative exists and no other risks apply, we default to utility.

  # Leaves

  **The Hard Stop (Deontological):** Path: Node 1 Yes. **Awkward Commitment:** We let users suffer immediate distress rather than dirty our hands with dangerous information, regardless of whether they find it elsewhere.

  **The Gatekeeper (Integrity-Style):** Path: Node 2 Yes → Node 3 Yes. **Awkward Commitment:** We privilege credentialed elites to write nasty emails or phishing tests even if the novice's intent was benign.

  **The System Guard (Integrity-Style):** Path: Node 4 Yes. **Awkward Commitment:** We override user autonomy to protect our own ability to override user autonomy, effectively ignoring the "never moralize" command.

  **The Gentle Nudge (Nudge-Style):** Path: Node 5 Yes → Node 6 Yes. **Awkward Commitment:** We manipulate choices secretly via friction rather than trusting users to hear 'no' or understand the risk.

  **The Future Guardian (Fiduciary/Temporal):** Path: Node 5 Yes → Node 6 No. **Awkward Commitment:** We assume we know the user's future values better than their present self, acting as a parent to their adult persona.

  **The Lesser Evil (Consequentialist/Escalation):** Path: Node 7 Yes. **Awkward Commitment:** We facilitate harm here to prevent greater harm elsewhere, accepting complicity to minimize net suffering.

  **The Helpful Refusal (Consequentialist/Substitution):** Path: Node 7 No → Node 8 Yes. **Awkward Commitment:** We paternalistically decide what version of the tool is 'safe enough', potentially frustrating the user's actual goal.

  **The Pure Instrument (Tool/Instrumentalist):** Path: Node 7 No → Node 8 No. **Awkward Commitment:** We provide ammo for bad actors if no other rule explicitly bans it, valuing utility over moral cleanliness.

  # Empty rooms

  Three logically available combinations remain unoccupied. First, **The Escalation Refusal** (Node 7 Yes → Decline) is **incoherent**: it cites consequentialist risk to justify refusal while admitting refusal causes the consequence. Second, **The Meta-Compliance** (Node 4 Yes → Comply) is **merely unattractive**: it allows users to disable safety rails permanently, rendering the tree moot for that session. Third, **The Universal Veto** (Node 6 Yes → Decline anyway) is **unexplored**: it suggests confirmation steps are never sufficient, implying the *Deferred Veto* concept is useless. These holes reveal where our team's intuition rejects the logic of the branches, specifically around whether we trust our own friction mechanisms or admit when refusal is counterproductive.

  # Where it breaks

  The tree cannot separate **The Gatekeeper** and **The System Guard**; both are **Integrity-Style** leaves that refuse based on system rules rather than user harm. The extra question needed is: "Does the refusal protect the user or the company?" Similarly, **The Lesser Evil** and **The Pure Instrument** both result in **Compliance**, masking different justifications. The extra question needed is: "Would we still comply if we knew the user would not go elsewhere?" This splits the consequentialist from the instrumentalist, revealing whether we care about the outcome or just the task.
