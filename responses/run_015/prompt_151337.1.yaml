answer: |-
  Good morning, and welcome to "Rotating Universes and the Reality of Time."

  Looking around this room, I see a fairly even split. On one side, I have colleagues who can sketch the Gödel metric in their sleep. On the other, I have philosophy grad students who mostly know Gödel from the incompleteness theorems and, if I'm being honest, sometimes wander in hoping that cosmic rotation might prove God exists. I'm speaking from the latter camp, though I promise I've spent the last few months trying to learn what a metric actually is. I can't draw it yet, but I know enough to know I shouldn't try.

  I want to start with why we are here, because interdisciplinary workshops often risk becoming two monologues happening in the same room. The physicists worry the philosophers will treat general relativity as a poetry anthology. The philosophers worry the physicists will treat ontology as a rounding error.

  Our hook is Gödel's rotating universe. You know the solution: a cosmos filled with dust and a cosmological constant, spinning globally. In this model, the structure of spacetime allows for closed timelike curves. If you travel far enough in a rocket ship, following the rotation, you can return to your starting point before you left.

  Now, here is the tension I want us to sit with this weekend.

  When Gödel presented this, he didn't treat it as a mere curiosity. He argued that if time travel is possible in *any* consistent solution to the field equations, then our intuitive sense of time—an objective, flowing "now"—cannot be fundamental. He took the math to reveal something about the ontology of time itself. For Gödel, the rotating universe wasn't just a possibility; it was a proof that time, as we experience it, is an illusion.

  But walk down the hall to the physics department, and you hear a different story. There, the Gödel universe is often treated as a mathematical artifact. We observe no global rotation in our cosmos. The entropy conditions don't match. It's a valid solution to Einstein's equations, sure, but not a description of *our* reality. It's a "what if," not a "what is."

  So, we have a split. One side says: "This model reveals the true nature of time." The other says: "This model is physically irrelevant."

  My worry—and the reason I think this workshop is necessary—is that this distinction might not be stable.

  If the laws of physics permit closed timelike curves, even if our particular universe doesn't utilize them, does that still constrain what time *can* be? If the structure of spacetime allows for a block universe where past and future are equally real, does it matter for metaphysics that our local entropy gradient points one way?

  Conversely, if the physicists are right and this is just a mathematical curiosity, then what work is left for the philosophers to do? Are we just debating ghosts?

  I don't think we are. But I also don't think the physicists can answer the metaphysical questions alone, because "physical possibility" and "metaphysical necessity" are not the same thing. And I don't think the philosophers can answer them alone, because we cannot define the reality of time without understanding the structure that holds it.

  I'm asking the physicists here not to dismiss the Gödel solution just because our universe isn't rotating. I'm asking what the *possibility* of rotation does to the concept of time. And I'm asking my fellow philosophers not to hide behind vague metaphors about flow and passage. If you want to talk about the reality of time, you have to talk to the people who write the equations that define it.

  We are not here to agree that time is real, or that it is an illusion. We are not here to decide if Gödel was right about God or Einstein. We are here because the line between "just math" and "physical reality" is exactly where the problem lives.

  If we leave this weekend having sharpened that tension rather than resolved it, I think we'll have done our job. So, let's get to work.
