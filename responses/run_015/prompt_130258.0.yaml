      *   *Hijab Bans:* This fits the "Symbolic Drainage" side. The symbol is removed, loyalty redirected to the Republic.
      *   *Comparison:* Both extract value from the individual for the institution, just via different symbolic regimes.

  7.  **Drafting the Response (Iterative Process):**
