answer: |-
  # Handout: The Life Definition Smuggling Quiz

  **Intro Blurb**
  You think you know what "life" is until you meet a mule. Is it alive? It metabolizes but can't reproduce. Is a virus alive? It evolves but can't metabolize. Is a fire alive? It grows and eats, but lacks a boundary. This quiz doesn't ask you to vote "Yes" or "No." It asks you to choose which constraints matter most when the standard cases break. Your answers will reveal which definition of life you are secretly using to do the heavy lifting.

  ---

  ### Part 1: The Logical Space
  Before sorting cases, we must identify the axes of disagreement. Every definition of life takes a stance on these four tensions:

  1.  **Substance vs. Process:** Is life defined by *what it is made of* (cells, carbon, DNA) or *what it does* (metabolizes, evolves, maintains)?
  2.  **Unit vs. Lineage:** Is the primary entity the *individual organism* (bounded in space/time) or the *historical lineage* (continuous through reproduction)?
  3.  **Switch vs. Slider:** Is "alive" a **binary property** (something either is or isn't) or a **gradient** (systems can be more or less alive)?
  4.  **History vs. Capacity:** Does a system need a *history of natural selection* to be alive, or is the *capacity to function/evolve* sufficient (even if designed)?

  ### Part 2: The Map of Positions
  Seven common positions occupy this space. Note where they stand on the axes above:

  | Position | Substance/Process | Unit/Lineage | Switch/Slider | History/Capacity |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Astrobiology (NASA)** | Process (Chemical) | Hybrid | Switch | Capacity |
  | **2. Autopoiesis** | Process (Organization) | Unit (Boundary) | Switch | Capacity |
  | **3. Chemoton** | Process (3-System) | Unit (Integrated) | Switch | Capacity |
  | **4. Darwinian Population** | Process (Selection) | Lineage | Switch | History |
  | **5. Replicator-First** | Substance (Info) | Lineage | Switch | Capacity |
  | **6. Metabolism-First** | Process (Energy) | Process | Slider | Capacity |
  | **7. Pragmatist (Cluster)** | N/A | N/A | Slider | N/A |

  ---

  ### Part 3: The Quiz
  *For each case, select the statement that best matches your intuition about the **limitation** or **status** of the system.*

  **1. The Mule (Sterile Hybrid)**
  A mule maintains its body perfectly but cannot reproduce.
  *   A. It is fully alive; reproduction is a property of species, not individuals.
  *   B. It is a dead end; life is the lineage, not the vehicle.
  *   C. It is alive, but only because it belongs to a reproducing lineage.
  *   D. "Alive" is a fuzzy term here; it has some life-properties but not others.

  **2. The Dormant Seed (Cryptobiosis)**
  A seed sits in a drawer for 200 years with zero metabolism, then grows.
  *   A. It was not alive during dormancy; life requires active self-maintenance.
  *   B. It was alive; the capacity to resume evolution is what matters.
  *   C. It was "potentially" alive; life admits of degrees based on activity.
  *   D. It was alive only because it carries the historical information of a lineage.

  **3. The Prion (Protein Fold)**
  A misfolded protein induces other proteins to fold like it, spreading without DNA.
  *   A. Not life; it lacks a genetic substrate to store information.
  *   B. Not life; it lacks a metabolic boundary to separate self from world.
  *   C. It is a minimal form of life; heredity is the only strict requirement.
  *   D. It is a borderline case; it replicates but doesn't evolve much.

  **4. The Fire Front (Dissipative Structure)**
  A wildfire consumes fuel, grows, moves, and maintains a boundary.
  *   A. Not life; it lacks a closed organizational network.
  *   B. Not life; it cannot evolve by natural selection.
  *   C. It is a proto-life form; it sits on the same spectrum of energy dissipation.
  *   D. Not life; it lacks a discrete individual unit.

  **5. HeLa Cells (Immortal Lineage)**
  Human cells grown in labs since 1951; the original human died, the cells remain.
  *   A. The cells are alive; the original organism is irrelevant.
  *   B. The cells are just tissue; life requires the whole integrated organism.
  *   C. The lineage is alive; the individual human was just a temporary vessel.
  *   D. They are alive for some purposes (biology) but not others (law/ethics).

  **6. Lab RNA (Evolution in a Chemostat)**
  RNA molecules in a pump evolve new shapes, but die instantly if the pump stops.
  *   A. Alive; they undergo Darwinian evolution.
  *   B. Not alive; they lack the metabolic subsystem to sustain themselves.
  *   C. Alive; information replication is the core phenomenon.
  *   D. Partially alive; they depend too much on external maintenance.

  **7. Mars Microbe (Alien Chemistry)**
  A cell found on Mars uses metabolism and heredity but uses no DNA or proteins.
  *   A. Alive; substrate doesn't matter, only the process.
  *   B. Alive; if it evolves, it's life.
  *   C. Not alive; life is defined by terrestrial biochemistry.
  *   D. Alive; it maintains its own boundary against the environment.

  **8. Self-Replicating Machines (Designed Evolution)**
  Robots on a dead planet build copies of themselves with random mutations, evolving by selection.
  *   A. Alive; history of natural selection is not required, only capacity.
  *   B. Not alive; they were designed, not born of natural history.
  *   C. Alive; they are individuals maintaining their own structure.
  *   D. A new category; they function like life but aren't "biological."

  **9. Digital Replicators (Simulation)**
  Code in a simulation replicates, mutates, and competes for memory space.
  *   A. Alive; life is substrate-independent information processing.
  *   B. Not alive; life requires physical chemistry and metabolism.
  *   C. Alive; they form a Darwinian population.
  *   D. Metaphorically alive; useful to treat them as such, but literally no.

  **10. Biofilm Mat (Collective Individual)**
  A microbial mat reproduces only as a whole sheet; individual cells cannot survive alone.
  *   A. The mat is the individual; the cells are merely organs.
  *   B. The cells are the individuals; the mat is just a colony.
  *   C. Both are alive; individuality is relative to the scale of selection.
  *   D. The distinction is arbitrary; we define the unit based on our research goals.

  ---

  ### Part 4: Scoring Key
  *Tally your answers. Most selected letter indicates your dominant view.*

  **Mostly A: The Astrobiologist (NASA Working Definition)**
  *   **View:** Life is a self-sustaining chemical system capable of Darwinian evolution.
  *   **Awkward Commitment:** You must accept that a lab-evolved RNA strand is alive, but a dormant seed might not be depending on how you define "self-sustaining."

  **Mostly B: The Organizationalist (Autopoiesis/Chemoton)**
  *   **View:** Life is a self-maintaining network with a boundary (and for Chemoton, three integrated subsystems).
  *   **Awkward Commitment:** You must declare a dormant seed or a mule "not alive" because they lack active self-production or full integration.

  **Mostly C: The Evolutionary (Darwinian/Replicator)**
  *   **View:** Life is defined by heredity, variation, and selection (either as a lineage or information).
  *   **Awkward Commitment:** You must accept that a virus or a digital virus is alive, while a sterile mule is merely a vessel for the real living entity (the genes).

  **Mostly D: The Pragmatist (Cluster Concept)**
  *   **View:** "Life" is a cluster concept with no necessary and sufficient conditions; it's a tool for specific inquiries.
  *   **Awkward Commitment:** You cannot definitively settle the status of aliens or AI; you can only say whether calling them "alive" is useful for your current purpose.

  **Mixed A/C:** **Replicator-First** (If you prioritized evolution over metabolism).
  **Mixed B/D:** **Metabolism-First** (If you prioritized process/energy over sharp boundaries).

  ---

  ### Instructor Notes & Analysis (For TA Use Only)

  **1. Empty Logical Space**
  *   **The "Zombie Organism" (Unit + Metabolism + No Evolution + Binary):** A position that requires an individual to metabolize and maintain a boundary but *does not* require the capacity to evolve. This is largely unoccupied. Most metabolic views (Autopoiesis) imply continuity, and most evolutionary views require reproduction. A self-maintaining robot that cannot copy itself falls here; few biologists call this "life," but it is logically coherent.
  *   **Lineage + Metabolism + No Information:** A lineage that metabolizes and persists but transmits no specific structural information (e.g., pure autocatalytic sets without templates). This is theoretically explored in origin-of-life research but rarely posited as a definition for *current* life.

  **2. Indistinguishable Leaves**
  *   **Cluster Concept vs. Stipulation:** The quiz treats these as one leaf (The Pragmatist). In practice, they yield identical answers on cases. To separate them, you would need a question about *semantic intent* (e.g., "Is the definition wrong, or just context-dependent?"). For a first-year seminar, merging them is safer.
  *   **NASA vs. Chemoton:** These are difficult to separate without jargon. The **Lab RNA (Q6)** is the wedge. NASA (self-sustaining + evolution) might accept the RNA if the chemostat counts as the "system." Chemoton strictly requires the integration of membrane, metabolism, and template *within* the unit. If a student picks **6B** (Not alive/lacks metabolism) but **1A** (Mule is alive), they lean Chemoton. If they pick **6A** and **1A**, they lean NASA.

  **3. Question Design Logic**
  *   **Q1 (Mule) & Q5 (HeLa):** Force the **Unit vs. Lineage** distinction.
  *   **Q2 (Seed) & Q4 (Fire):** Force the **Process vs. Capacity** and **Switch vs. Slider** distinctions.
  *   **Q6 (Lab RNA) & Q8 (Machines):** Force the **History vs. Capacity** distinction.
  *   **Q7 (Mars) & Q9 (Digital):** Force the **Substance vs. Process** distinction.

  **4. Common Student Traps**
  *   **The "Virus" Bias:** Students often default to "Viruses aren't alive" without realizing this commits them to a Metabolism-first or Autopoietic view, which then forces them to call dormant seeds "dead." Watch for this inconsistency in Q2 vs Q3.
  *   **The "Human" Anchor:** Students often treat the Mule or HeLa cells differently because they are human-associated. Q1 and Q5 test if they can abstract the definition away from human exceptionalism.
