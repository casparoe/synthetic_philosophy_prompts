answer: |-
  Here is a menu of distinct theses your interlocutor's instruction ("assume you're typical") could be expressing. They are ordered from methodological platitudes to substantive, contested anthropic principles, and finally to claims that are arguably false or circular.

  For each thesis, I indicate its **Status** (Trivial, Substantive, or False), whether it **Delivers the Conclusion** (that the digital future is unlikely/undeserving of resources), and a brief **Analysis** of the reference class and logic involved.

  ### 1. The Methodological Platitude
  **Thesis:** "Update your credences conditional on the fact that you exist and have the evidence you have."
  *   **Status:** **Trivial.** (This is just standard Bayesianism).
  *   **Delivers Conclusion?** **No.**
  *   **Analysis:** This tells you *to* update, but not *how*. It does not specify the reference class (the "pool" you are drawn from) or the prior probabilities of the hypotheses. Without specifying whether a world with trillions of minds makes your existence more or less likely, this principle is silent on the matter. It requires further premises to do any work.

  ### 2. The Restricted Reference Class (Biological Kind)
  **Thesis:** "Assume you are a random sample from the set of all **biological humans**."
  *   **Status:** **True but Question-Begging.**
  *   **Delivers Conclusion?** **No.** (It blocks the argument entirely).
  *   **Analysis:** If the pool is restricted to biological humans, then digital minds are excluded by definition. Finding yourself biological is 100% expected regardless of how many digital minds exist in the future. This renders the opponent's inference impossible. The opponent implicitly rejects this restriction to make their point, so asserting it simply talks past them.

  ### 3. The Evidential Reference Class (Indexical Evidence)
  **Thesis:** "Assume you are a random sample from all observers who share **your specific evidence** (e.g., seeming to have a biological body, living in the 21st century)."
  *   **Status:** **Substantive and Contested.** (Related to the "Self-Indication Assumption" vs. "Full Non-indexical Conditioning" debates).
  *   **Delivers Conclusion?** **No.**
  *   **Analysis:** If future digital minds are emulated, they may have evidence indistinguishable from yours (they might *think* they are biological). If they do, you cannot distinguish yourself from them, and the "typicality" argument applies (see Thesis 4). However, if digital minds have *different* evidence (e.g., they know they are sims), then you are not in the same reference class. If you restrict the pool to "minds with early-21st-century evidence," you are back to Thesis 2. This thesis highlights that the argument fails unless future minds are phenomenologically identical to you.

  ### 4. The Self-Sampling Assumption (SSA) — Actual Observers
  **Thesis:** "Assume you are a random sample from the set of all **actual observers** that will ever exist in your world."
  *   **Status:** **Substantive and Contested.** (This is the core of the **Doomsday Argument**).
  *   **Delivers Conclusion?** **Yes.** (This is the engine of your opponent's claim).
  *   **Analysis:** This is the strongest charitable reading of your opponent.
      *   **The Logic:** If the future contains trillions of digital minds, the total number of observers is huge. If you are a random sample from that total, it is statistically improbable that you would find yourself among the tiny fraction of early biological humans (the "first 0.0001%").
      *   **The Inference:** Since you *do* find yourself early, the hypothesis that there are trillions of future minds is likely false.
      *   **The Problem:** This relies entirely on accepting SSA. Many philosophers reject SSA because it implies you can infer facts about the external world (the size of the future) purely from your birth rank, without new empirical data.

  ### 5. The Self-Indication Assumption (SIA) — Possible Observers
  **Thesis:** "Assume you are a random sample from the set of all **possible observers**, weighted by the probability of their world existing."
  *   **Status:** **Substantive and Contested.** (The standard counter to the Doomsday Argument).
  *   **Delivers Conclusion?** **No.** (It yields the opposite result).
  *   **Analysis:** SIA argues that you are more likely to exist in a world with more observers.
      *   **The Logic:** A world with trillions of minds has trillions of "slots" for you to occupy. A world with only billions has fewer. Therefore, the mere fact that you exist is evidence *in favor* of the world with more observers.
      *   **The Result:** This cancels out the Doomsday effect. The "surprise" of being early (from Thesis 4) is balanced by the "likelihood" of existing in a populous world. Under SIA, finding yourself biological does not count against a large digital future.

  ### 6. The Observer-Moment Variation
  **Thesis:** "Assume you are a random sample from all **observer-moments** (temporal slices of consciousness) rather than whole persons."
  *   **Status:** **Substantive and Contested.**
  *   **Delivers Conclusion?** **Depends on Duration.**
  *   **Analysis:** If digital minds can be sped up, paused, or copied, they might generate vastly more *observer-moments* per unit of clock-time than biological humans.
      *   **If Digital Minds are Fast:** The pool of observer-moments is overwhelmingly digital. Finding yourself as a slow, biological moment is even *stronger* evidence against the digital future than Thesis 4 (strengthening the opponent's conclusion).
      *   **If Digital Minds are Short-lived:** If they burn out quickly, the count might balance.
      *   **Critique:** This complicates the "personhood" metric. If the opponent assumes "minds" means "persons," but the physics of emulation implies "moments," their calculation of the "pool size" may be wrong.

  ### 7. The "Typicality" Tautology (Circular)
  **Thesis:** "Assume the future is typical of the present; therefore, future minds are typically biological."
  *   **Status:** **False / Self-Defeating.**
  *   **Delivers Conclusion?** **Yes, but Circularly.**
  *   **Analysis:** This reading interprets "assume you're typical" not as a statistical sampling rule, but as a uniformitarian principle about history (the future will resemble the past).
      *   **The Circularity:** It assumes the conclusion (the future is biologically constrained) to define the reference class (the pool of minds is biological). It begs the question: it rules out the possibility of a digital future by definition rather than by evidence.
      *   **Why it fails:** It ignores the specific argument about *emulation*, which posits a discontinuity. If the point of the argument is whether a discontinuity is possible, assuming continuity is a conversation-stopper, not an inference.

  ### Summary of the Disagreement
  Your intuition is correct: the sentence "assume you're typical" is doing too much work.

  *   If your opponent means **Thesis 4 (SSA)**, they are invoking the **Doomsday Argument**. This is a valid logical form but relies on a highly controversial anthropic principle that many reject because it allows armchair speculation to override empirical priors about technological capacity.
  *   If they mean **Thesis 5 (SIA)**, their argument collapses, because SIA suggests you *should* expect to be in a universe with more minds.
  *   If they mean **Thesis 2 or 3 (Restricted Class)**, they are excluding digital minds from the count by fiat, which makes the argument circular.

  **The Verdict:** The inference is not licensed *as stated* because it hides the choice between SSA and SIA. SSA delivers their conclusion but is philosophically costly (it implies we are likely near the end of history). SIA is more friendly to long-termism but implies we are "presumptuous" to think we exist at all. Without agreeing on which anthropic principle governs the "pool," the statement "assume you're typical" is ambiguous between a tautology and a contested metaphysical claim.
