prompt: |-
  so I'm the one who looks after our mill museum up here. I worked in the place as a weaver for nineteen years before it shut and I've got no qualifications whatsoever, I just read alot and I've been through every box of the mill's paperwork in the attic.

  Next Thursday we open a new exhibition, paid for by the family of the mill's last owner. There's a plaque by the door and the family chose the wording themselves and it says WHY DID THE WORLD CHANGE HERE AND NOT IN CHINA?

  I have to say a few words before the ribbon gets cut. Six minutes tops, stood up, no notes really.

  The room: the donor's daughter and about eight of her relatives, two councillers, the year nine class from the school down the road, the volunteers who help me, and — this is the tricky bit — two proper economic historians we've invited, one of whom has basically made his whole career out of answering the question on that plaque. He speaks right after me.

  Here's my problem. I don't think the question on the plaque is a question. Not that the answer's wrong — I mean it isn't the kind of thing that could have had an answer. It points at one place and calls it here and points at another and calls it not here and assumes there was one single thing that happened which could equally have happened in either. When I go through our own ledgers I cant find that single thing. I find a water-rights argument that got settled in a pub, a set of loom parts copied off a mill forty miles away, three years where we nearly went under, cotton that came from a place nobody in this town ever laid eyes on, and one woman who could fix the cards when nobody else could. If somebody had stood in this yard in 1790 and asked why spinning got cheap they'd have got twelve answers and not one of them would have mentioned China.

  The nearest I can get to saying it my own way: down the shed you could ask why this loom stopped and not that one, but it only ever meant anything because both looms were running the same cloth off the same beam. Take that away and the question's just noise.

  So write me the speech. It has to get all that over to a room that will hear the plaque is stupid if I'm clumsy about it, and I can't say that, because his daughter is stood three feet from me and we want her money again next year. It also can't take a swing at the historian who's on after me — I'd rather he enjoyed it. Do the work with the objects in the room instead of with arguments: there's a shuttle off the looms, the 1798 ledger, the photograph from the last working day, and the replica spinning frame the kids have been winding for me all week. I want one moment where somebody in that room feels the question go soft underneath them, without me ever announcing that that's what I'm doing.

  Don't put any names of famous books or historians in my mouth, I'd get them wrong and it isn't me anyway. And it can't end on a downer — these are my neighbours, they're proud of this place, and they should still be proud of it when they walk out.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**

      *   **Speaker:** A former weaver (19 years), no formal qualifications, self-taught, knows the mill's archives intimately. Authentic, grounded, practical voice.
      *   **Occasion:** Opening of a new exhibition funded by the last owner's family.
      *   **Audience:** Donor's daughter + relatives (sensitive about the plaque), two councillors, Year 9 students (approx. 13-14 years old), volunteers, two economic historians (one is an expert on the plaque's question).
      *   **Constraint:** 6 minutes max (approx. 750-900 words spoken at a moderate pace). No notes (needs to be memorizable/flowing).
      *   **The Conflict:** The plaque asks "WHY DID THE WORLD CHANGE HERE AND NOT IN CHINA?" The speaker thinks this is a false question/oversimplification.
      *   **The Goal:** Acknowledge the plaque without insulting the donors. Don't attack the historian speaking next. Use objects in the room to shift the perspective subtly ("make the question go soft"). End on a proud, uplifting note for the community.
      *   **Key Objects to Include:** A shuttle, the 1798 ledger, a photograph from the last working day, a replica spinning frame (wound by kids).
      *   **Tone:** Humble, observant, storytelling, respectful but insightful. No academic jargon.

  2.  **Deconstruct the "Plaque Problem":**

      *   The plaque implies a binary choice (Here vs. China) and a singular cause ("The World Change").
      *   The speaker knows reality was messy (pub arguments, copied parts, near-bankruptcy, specific skilled workers, global supply chains).
      *   *Strategy:* Don't say "The plaque is wrong." Say "The plaque asks a big question, but the mill tells small stories." Shift focus from *Why Here?* to *How Here?* and *Who Here?*

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone. Acknowledge the funding family warmly (crucial for future donations). Acknowledge the historian (show respect). Establish the speaker's identity (weaver, not academic).
      *   **The Plaque (The Elephant in the Room):** Address it indirectly. It's a big question. But stand in the yard, and it feels different.
      *   **Object 1: The Replica Spinning Frame (The Kids):** Connect the "World Change" to something tangible. The kids winding it. It's not magic; it's work.
      *   **Object 2: The 1798 Ledger (The Messiness):** Show the reality. Not a grand design, but scribbles, debts, near failures. This subtly undermines the "inevitability" implied by the plaque.
      *   **Object 3: The Shuttle (The Connection):** Connect "Here" to "Elsewhere." Cotton didn't grow here. This addresses the "China" part without naming China directly. It was a network, not an island.
      *   **Object 4: The Photograph (The People):** The last working day. Bring it back to the community. The "Who" matters more than the "Why."
      *   **The Historian Handoff:** Compliment the expert. Their job is the big picture; my job is the bricks and mortar.
      *   **Closing:** Pride in the place. It's not about beating China; it's about what *we* did. Call to action (ribbon cutting).

  4.  **Refining the Voice:**

      *   *Avoid:* "Historiography," "Industrial Revolution," "Comparative Advantage," "Socio-economic factors."
      *   *Use:* "Ledgers," "Looms," "Pub," "Cotton," "Hands," "Noise."
      *   *Rhythm:* Short sentences. Pauses. Conversational. Like talking to neighbors in the yard.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Welcome. Thanks to the family. That plaque is big. I'm just a weaver. Look at this frame the kids touched. It's heavy. Look at this book from 1798. It shows arguments, not plans. Look at this shuttle. It went far. Look at this photo. Real people. The historian will tell you the why. I tell you the who. Let's be proud. Cut the ribbon.

  6.  **Drafting - Iteration 2 (Adding Texture & Nuance):**
      *   *Need to make the "question go soft".* Instead of arguing, describe the texture of the ledger. The ink blots. The specific name of the woman who fixed the cards.
      *   *Need to handle the "China" aspect.* Don't ignore it, but contextualize it. The cotton came from somewhere else. We were part of a web.
      *   *Need to protect the donor.* "Generous question." "A question that invites us to look."
