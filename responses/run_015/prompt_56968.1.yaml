  7.  **Writing the Speech (incorporating constraints):**

      *   *Word Count Check:* A 6-minute speech is roughly 750-850 words at a measured pace.
      *   *Tone Check:* Is it too academic? No, keep it grounded in the physical objects.
      *   *Sensitivity:* Ensure the donor's daughter feels thanked, not corrected.

      *(Self-Correction during drafting)*: I initially thought about mentioning the woman who fixed the cards. I should include that. It humanizes the "technology."
