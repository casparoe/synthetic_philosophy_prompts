answer: |-
  Good afternoon.

  For those who don't know me, I'm the one who keeps the keys. I worked on the floor for nineteen years before the silence came. I don't have degrees on my wall. My qualifications are in my hands, and in the boxes of paperwork I've pulled down from the attic dust.

  I want to start by thanking the family of the last owner. Your generosity has kept this roof over our heads and allowed us to build this new room. That plaque by the door is a gift from you, and it asks a very big question. It asks why the world changed *here*, and not somewhere else.

  It is a question that deserves an answer. But standing in this yard, where the wind cuts through your jacket and the stone is worn by feet, I have learned that history doesn't always feel like a question. Sometimes it feels like a weight.

  I want you to look over here, at this replica frame. All week, the Year Nines from the school have been winding this. To them, it's a machine. But feel the resistance in the handle. It's heavy. It requires a rhythm. If you stop, the thread snaps. If you go too fast, it tangles. The "change" the plaque talks about didn't arrive like a thunderclap. It arrived like this: slowly, by hand, by people learning how to make their hands move differently.

  Now, look at this ledger. It's from 1798.

  When we ask why the world changed, we imagine a plan. We imagine men in coats drawing maps and deciding that *this* valley would be the place. But open the book. There is no plan. There are ink blots. There is an argument over water rights that was settled in a pub and written down on a napkin. There are three years where the income barely covered the coal. There is the name of a woman, just one woman, who could fix the punch cards when the men couldn't, and without her, the looms would have stopped.

  If you had stood in this spot in 1790 and asked why spinning was getting cheap, you wouldn't have got a theory. You would have got twelve different answers. One man would talk about the water. Another about the price of cotton. Another about the woman who fixed the cards. None of them would have said, "Because we are not in China." They were too busy trying to keep the beam running.

  And that brings me to this shuttle.

  It's wood, polished by thumbprints. It flew back and forth thousands of times a day. But the cotton it held didn't grow in this soil. It came from a place nobody in this town ever laid eyes on. The "Here" in the question on the plaque… it wasn't an island. We were connected to everywhere. The world changed here because the world was already connected. We were just one knot in a very long net.

  So, when you read that plaque, I hope you don't see a riddle that needs solving. I hope you see an invitation to look closer.

  The question on the stone is hard. It is solid. But the history inside this room… it is soft. It is flexible. It bends.

  In a moment, I'm going to invite Professor Halloway to speak. He has spent his life studying the maps. He knows the currents of the global economy better than I know the weave of a twill. He will talk about the *Why*.

  My job is just to show you the *What*.

  Because finally, look at this photograph. It's the last day the mill worked. Look at the faces. They aren't looking at China. They aren't looking at the global economy. They are looking at each other. They are neighbours. They are proud.

  The world may have changed everywhere. But it only mattered *here*, because of the people who stood here. The looms are still now. But the work they did, the lives they lived, that hasn't stopped. It's in this room. It's in this town. And as long as we keep telling the truth about what happened—messy, difficult, human truth—this place will keep breathing.

  Thank you to the family for the question. Thank you to the volunteers for the answers. And thank you all for coming to listen.

  Let's cut the ribbon.
