prompt: |-
  I am supervising an MPhil thesis on whether the distinction between doing and allowing — and, more narrowly, between killing and letting die — carries any moral weight of its own, and before my student writes the chapter that sets out what an account of the distinction would have to achieve, I want that specification written properly rather than assembled ad hoc from whichever cases happen to come to mind. So I would like from you a list of desiderata that any adequate theory of the doing/allowing distinction must meet, with the case or consideration behind each, and a view on which of them are genuinely required and which are merely the preferences of one camp (for instance, demands that the distinction be metaphysically prior to any normative facts, that it be describable without appeal to causation, that it be binary, or that it be neutral between a rights-based and a consequentialist framework).

  The list should be pushed into territory that the standard examples do not cover well, since that is where the accounts I have read seem to come apart. In particular I want it to handle: cases of double prevention, where an agent does not create a threat but diverts an existing one onto a different person, or removes something that was shielding them, so that the harm runs through the agent without originating in them; the difference between withholding support and withdrawing support one is already providing, and why that difference, if it is one, should matter when the patient's prospects are held fixed; cases in which someone's allowing is itself constituted by a long chain of small commissions — budget decisions, triage protocols, default settings in a system nobody individually chose — so that the description of the event as an omission is contested rather than given; and cases in which the agent is an automated or artificial system, where doing and allowing come apart as the difference between running and declining to run a computation, and where there is no bodily movement, effort, or phenomenology of agency to anchor the intuitive contrast. I also want the list to say what the distinction must not collapse into: it must not simply track causation, since some allowings look causally necessary for the outcome, and it must not simply track intention or foresight, since those are standardly treated as separate; and it should say something about the weight question, namely whether the distinction is to do independent moral work or is at best a proxy for other factors such as the cost to the agent, the existence of a duty of aid, or the difference between infringing a right and failing to confer a benefit.

  Two things matter to me most in the answer. First, tell me which pairs of desiderata you suspect cannot be jointly satisfied — if, for example, requiring that the distinction be sharp and non-negotiable is in tension with requiring that it handle distributed and automated agency, I want that stated as a result about the specification itself rather than smoothed over. Second, identify the single requirement that does the most work in ruling out existing contenders, and say why. The purpose the theory is being built for is fixed: it is meant to be usable by someone writing policy for an institution — a hospital trust drawing up guidance on withdrawing treatment, or a team specifying the default behaviour of an autonomous system that could intervene in a harm — who needs to know whether declining to act is, in the case at hand, morally different from acting, and if so how much of a difference it makes. If you think some of my cases are bad tests of a theory because they build in the very contestable description at issue, say so and tell me what should replace them. Please write the whole answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Topic:** The moral significance of the doing/allowing distinction (specifically killing vs. letting die).
      *   **Task:** Provide a list of desiderata for an adequate theory of this distinction.
      *   **Specific Requirements:**
          *   Include the case/consideration behind each desideratum.
          *   Distinguish between *genuine requirements* and *camp preferences* (e.g., metaphysical priority, binary nature, neutrality).
          *   Push into non-standard territory: double prevention, withholding vs. withdrawing, distributed/structural omissions, automated/AI agency.
          *   Specify what the distinction must *not* collapse into (causation, intention/foresight).
          *   Address the "weight question" (independent moral work vs. proxy).
          *   **Crucial 1:** Identify pairs of desiderata that cannot be jointly satisfied (tensions/trade-offs).
          *   **Crucial 2:** Identify the single requirement that does the most work in ruling out existing contenders.
          *   **Context:** The theory is for policy-making (hospital trusts, autonomous systems).
          *   **Critique:** Challenge bad test cases if necessary.
          *   **Language:** British English.

  2.  **Deconstruct the Philosophical Landscape:**

      *   *Standard View:* Doing is worse than allowing (Quinn, Foot, Thomson).
      *   *Sceptical View:* The distinction lacks intrinsic moral weight; it tracks other factors like rights or costs (Kagan, consequentialists).
      *   *Metaphysical vs. Normative:* Is the distinction prior to morality, or defined by it?
      *   *Causation:* Is doing causing harm and allowing not causing it? (Problematic due to omissions being causal).
      *   *Policy Context:* Needs action-guidance, clarity, and applicability to non-human agents.

  3.  **Drafting the Desiderata (incorporating specific cases):**

      *   *Desideratum 1: Non-Collapse into Causation.* (Standard requirement).
      *   *Desideratum 2: Handling Double Prevention/Diversion.* (The trolley/bridge variants).
      *   *Desideratum 3: Withholding vs. Withdrawing.* (Medical context).
      *   *Desideratum 4: Distributed/Structural Agency.* (Budgets, protocols).
      *   *Desideratum 5: Non-Human/Automated Agency.* (AI, algorithms).
      *   *Desideratum 6: Normative Independence (The Weight Question).* (Does it do work on its own?)
      *   *Desideratum 7: Descriptive Stability.* (Can we agree on what counts as doing/allowing before judging?)

  4.  **Refining and Categorizing (Requirements vs. Preferences):**

      *   *Requirement:* Must handle the policy context (clarity).
      *   *Requirement:* Must not collapse into intention.
      *   *Preference:* Metaphysical priority (normativists vs. metaphysicians).
      *   *Preference:* Binary nature (scalar views exist).
      *   *Preference:* Neutrality (rights vs. consequentialism).

  5.  **Addressing the "Hard Tests" (Double Prevention, AI, etc.):**

      *   *Double Prevention:* If I stop a shield, did I kill? Theory must classify this.
      *   *Withholding/Withdrawing:* Morally often treated as equivalent in bioethics, but intuitively distinct. Theory must explain why or why not.
      *   *AI:* No "muscle movement." Theory must rely on functional control, not biology.
      *   *Distributed:* If no single person "does" it, is it an allowing?

  6.  **Identifying Tensions (Crucial 1):**

      *   *Tension A:* Descriptive Stability vs. Normative Independence. If we define "doing" purely descriptively, it often lacks moral weight. If we define it normatively, it's circular for policy.
      *   *Tension B:* Binary Sharpness vs. Distributed Agency. Real-world policy involves gradients of control. A sharp binary breaks on structural omission.
      *   *Tension C:* Metaphysical Priority vs. Policy Usability. A metaphysically pure account might be too abstract for a hospital trust.

  7.  **Identifying the "Killer" Requirement (Crucial 2):**

      *   What rules out the most theories?
      *   *Candidate:* **Normative Independence combined with Policy Action-Guidance.**
      *   *Why:* Most theories either say the distinction has *no* weight (consequentialism) or define it *by* its weight (normative account). A theory that says "It has weight" but can't tell a hospital administrator *when* it applies without already knowing the moral answer is useless. The requirement that the distinction be *identifiable prior to moral judgement* yet *carry moral weight* is the hardest hurdle.

  8.  **Critiquing the User's Cases:**

      *   *Withholding/Withdrawing:* This is often a red herring. The moral difference usually lies in expectation/entrenchment, not the physics.
      *   *AI:* Good test, but risks category error. "Doing" for AI is execution of code.
      *   *Double Prevention:* Standard in philosophy, but tricky for policy.

  9.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the request.
      *   **Section 1: The Core Desiderata:** Grouped by Metaphysical/Descriptive, Normative, and Practical/Policy. Mark Requirements vs. Preferences.
      *   **Section 2: The Hard Cases:** Address Double Prevention, Withholding/Withdrawing, Distributed, AI.
      *   **Section 3: What the Distinction Must Not Collapse Into.**
      *   **Section 4: Incompatible Pairs (Tensions).**
      *   **Section 5: The "Killer" Requirement.**
      *   **Section 6: Critique of Test Cases.**
      *   **Conclusion:** Summary advice for the student.

  10. **Refining Language (British English):**

      *   Use "analyse" (verb), "categorisation", "programme", "defence", "honour", "labour".
      *   Ensure tone is academic, supervisory, and precise.

  11. **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the "weight question"? Yes, in the Normative section.
      *   *Check:* Did I distinguish requirements from preferences? Yes, need to make this explicit.
      *   *Check:* Is the AI section robust? Need to ensure it's not just about "movement" but about "intervention."
      *   *Check:* Is the tension clear? The tension between *identifiability* and *moral significance* is the crux.
      *   *Check:* Did I answer the specific prompt about "which pairs cannot be jointly satisfied"? Yes.
      *   *Check:* Did I identify the single requirement ruling out contenders? Yes.

  12. **Final Polish:** Ensure the distinction between "killing/letting die" and "doing/allowing" is managed (the prompt treats them closely, but the latter is broader). Ensure the policy angle remains central. (Self-correction: Make sure to explicitly state that some desiderata are *preferences* of specific philosophical camps, as requested).

  *(Drafting mental outline complete. Proceeding to generate response.)*
answer: |-
  This is a formidable specification. You are asking your student to construct a theory that is metaphysically robust enough to satisfy philosophers, yet operationally precise enough for a hospital ethics committee or an algorithmic auditor. Most existing accounts fail because they optimise for one at the expense of the other.

  Below is a structured list of desiderata, categorised by their function, followed by the analysis of tensions and the critical 'killer' requirement you requested. I have written this in British English as requested.

  ### Part 1: Desiderata for an Adequate Theory

  I have divided these into **Core Requirements** (necessary for the theory to function in your specified policy context) and **Contingent Preferences** (demands made by specific philosophical camps that may not be necessary for the theory's success).

  #### A. Descriptive and Metaphysical Desiderata

  **1. The Identification Requirement (Core)**
  *   **Specification:** The theory must allow an agent to classify an act as 'doing' or 'allowing' *prior* to making a moral judgement about it.
  *   **Case/Consideration:** A hospital administrator deciding whether to switch off a ventilator needs to know if this counts as killing or letting die *before* they can apply the rule 'killing is prohibited'. If the classification depends on already knowing whether the act is permissible, the distinction offers no guidance.
  *   **Status:** **Required.** Without this, the distinction is circular and useless for policy.

  **2. The Non-Collapse into Causation Requirement (Core)**
  *   **Specification:** The distinction cannot map perfectly onto 'causing vs. not causing' the outcome.
  *   **Case/Consideration:** In cases of omission (e.g., a lifeguard not throwing a ring), the omission is often causally necessary for the death in the same counterfactual sense as a push. If 'doing' just means 'causing', then allowing is impossible.
  *   **Status:** **Required.** Standard counterfactual accounts of causation render the distinction empty.

  **3. The Agency-Neutrality Requirement (Core)**
  *   **Specification:** The account must apply to agents without biological bodies or phenomenological states.
  *   **Case/Consideration:** An autonomous vehicle declining to swerve (running a 'null' computation) vs. swerving into a barrier. There is no 'muscle movement' or 'effort'. The distinction must rest on functional control or system architecture, not biology.
  *   **Status:** **Required.** Given your policy aim (automated systems), a theory relying on 'bodily movement' (like early Anscombean views) is obsolete.

  **4. The Metaphysical Priority Preference (Contingent)**
  *   **Specification:** The distinction must be grounded in natural facts (physics, causation) rather than normative expectations.
  *   **Case/Consideration:** Proponents (e.g., Quinn) argue that if morality defines the distinction, it cannot ground morality.
  *   **Status:** **Preference.** A normative account (where 'doing' is defined by violation of a negative right) can still be useful for policy *if* the rights are pre-specified. Insisting on metaphysical priority often forces theories into implausible contortions regarding omissions.

  **5. The Binary Sharpness Preference (Contingent)**
  *   **Specification:** The distinction must be a strict dichotomy, not a spectrum.
  *   **Case/Consideration:** Policy requires clear rules (e.g., 'Do not kill').
  *   **Status:** **Preference.** While policy likes binaries, reality (especially in distributed agency) suggests degrees of intervention. A scalar account of 'degrees of doing' might be more honest, even if harder to codify.

  #### B. Normative and Weight Desiderata

  **6. The Independent Weight Requirement (Core)**
  *   **Specification:** The theory must explain whether the distinction carries moral weight *independent* of costs, intentions, or duties.
  *   **Case/Consideration:** If 'letting die' is only permissible because it is cheap to save, then the distinction does no work; cost does. The theory must isolate the *mode* of agency from the *cost* of agency.
  *   **Status:** **Required.** This addresses your 'weight question'. If the distinction is merely a proxy for cost or duty, it should be labelled as such, not treated as a fundamental category.

  **7. The Rights-Neutrality Preference (Contingent)**
  *   **Specification:** The account must be compatible with both rights-based deontology and consequentialism.
  *   **Case/Consideration:** Consequentialists often argue the distinction is morally irrelevant; deontologists argue it is fundamental.
  *   **Status:** **Preference.** It is unlikely a single account will satisfy both without being vacuous. A policy theory should probably adopt a 'moderate deontological' stance (constraints exist but have thresholds) rather than claiming neutrality.

  #### C. The 'Hard Case' Desiderata

  **8. The Double Prevention Handling (Core)**
  *   **Specification:** The theory must classify cases where an agent removes a shield or diverts a threat without originating it.
  *   **Case/Consideration:** Diverting a trolley from five to one (Foot's Trolley) vs. pushing a man off a bridge (Thomson's Fat Man). In both, the agent intervenes in a causal chain. In double prevention (stopping a shield), the harm flows *through* the agent.
  *   **Status:** **Required.** This is where causal accounts fail. The theory must distinguish between *intercepting* a threat and *originating* one, even if the physics is identical.

  **9. The Withholding/Withdrawing Equivalence Test (Core)**
  *   **Specification:** The theory must explain why withholding and withdrawing are often treated as morally equivalent in medicine, despite the temporal difference.
  *   **Case/Consideration:** Turning off a ventilator (withdrawing) vs. not turning it on (withholding). Prospects are fixed. Intuitively, withdrawing feels more like 'doing', yet bioethics treats them as 'allowing'.
  *   **Status:** **Required.** If the theory cannot explain why withdrawing is 'allowing', it is useless for hospital trusts.
  *   **Note:** This may require admitting that the distinction is sensitive to *entrenched expectations* rather than just physics.

  **10. The Distributed Agency Requirement (Core)**
  *   **Specification:** The theory must handle cases where 'allowing' is constituted by a chain of small commissions (budgets, protocols).
  *   **Case/Consideration:** A hospital trust sets a budget that makes a drug unavailable. No individual 'lets' the patient die; the system does. Is this a collective 'doing' or a structural 'allowing'?
  *   **Status:** **Required.** Policy is rarely about single agents. If the theory only works for lone wolves, it fails your institutional test.

  ---

  ### Part 2: Incompatible Pairs of Desiderata

  You asked for tensions that cannot be jointly satisfied. These are not merely difficulties; they are structural conflicts within the specification itself.

  **1. The Tension between Descriptive Stability (1) and Normative Independence (6)**
  *   **The Conflict:** To satisfy **Desideratum 1**, the distinction must be identifiable using non-moral facts (physics, sequence of events). However, to satisfy **Desideratum 6** (that it carries independent moral weight), the distinction must track something morally significant.
  *   **The Problem:** In the 'Hard Cases' (double prevention, withdrawing treatment), the non-moral facts often look identical between clear 'doings' and clear 'allowings'. To distinguish them, one usually has to sneak in a normative premise (e.g., 'this threat was already in motion').
  *   **The Result:** You cannot have a theory that is *purely* descriptive (identifiable by a layperson without moral training) and *also* carries robust independent moral weight in hard cases. If it is purely descriptive, it loses weight (becomes a proxy). If it carries weight, it becomes normative (violating Identification).
  *   **Policy Implication:** Your student must choose: is the distinction a **heuristic** for other moral factors (easier to identify, less weight) or a **fundamental constraint** (harder to identify, more weight)? Policy usually needs the former, philosophy often demands the latter.

  **2. The Tension between Binary Sharpness (5) and Distributed Agency (10)**
  *   **The Conflict:** A binary distinction requires a clear boundary line. Distributed agency (budget decisions, algorithmic defaults) creates a gradient of causal contribution.
  *   **The Problem:** In a triage protocol, is the decision to prioritise Group A over Group B a 'doing' to Group B? If we insist on a binary, we must arbitrarily draw a line where 'influence' becomes 'intervention'.
  *   **The Result:** Requiring sharpness in the context of structural omission forces the theory to be revisionist. It will classify clear cases of structural harm as 'allowing' simply because no single agent 'pushed'.
  *   **Policy Implication:** For institutional policy, a scalar account ('degrees of responsibility') is more honest, but a binary account ('permitted/prohibited') is more actionable. You cannot have both actionability and honesty in complex systems.

  **3. The Tension between Agency-Neutrality (3) and Metaphysical Priority (4)**
  *   **The Conflict:** Metaphysical priority usually relies on naturalistic facts about energy transfer or bodily movement. Agency-neutrality requires applying the distinction to software.
  *   **The Problem:** Software does not transfer energy in the same way a body does; it processes information. A 'decision not to compute' is physically identical to a 'decision to compute null'.
  *   **The Result:** To make the distinction work for AI, you must abandon naturalistic metaphysics and adopt a functionalist/normative definition of agency. This violates the Metaphysical Priority preference.

  ---

  ### Part 3: The 'Killer' Requirement

  If I must identify the single requirement that does the most work in ruling out existing contenders, it is **The Identification Requirement (Desideratum 1) applied to the Withholding/Withdrawing case (Desideratum 9).**

  **Why this rules out contenders:**

  1.  **It defeats Purely Causal Accounts:** As noted, causally, withdrawing and withholding are often symmetrical (both are counterfactual dependencies). A causal theory cannot distinguish them without appealing to norms.
  2.  **It defeats Purely Normative Accounts:** If the distinction is defined *by* the moral duty (e.g., 'Doing is violating a negative right'), then in the withholding/withdrawing case, we cannot determine if there is a violation until we have already decided if the act is permissible. This renders the distinction useless for the hospital trust *drawing up* the guidance. They need the distinction to *generate* the guidance, not reflect it.
  3.  **It defeats Intention-Based Accounts:** One can intend death equally in both withholding and withdrawing.
  4.  **It defeats the 'Sequence' Account:** Some argue withdrawing is 'doing' because it interrupts an ongoing process. However, bioethics overwhelmingly treats withdrawing as 'allowing'. A theory that classifies withdrawing as 'killing' contradicts the settled policy consensus your student is meant to serve.

  **The Verdict:**
  Most theories fail here because they try to find a *natural* difference where there is only a *normative* one. The only way to satisfy the Identification Requirement in this context is to admit that the distinction relies on **baseline expectations**.
  *   *Withholding* is allowing because there was no expectation of support.
  *   *Withdrawing* is allowing (in medical contexts) because the support was understood as provisional or the disease is the primary cause.
  *   *However*, this makes the distinction sensitive to social convention, not metaphysics.

  This requirement forces the student to abandon the hope that the doing/allowing distinction is a 'joint in nature'. It must be a 'joint in social practice'. This is a bitter pill for metaphysically minded philosophers but essential for policy makers.

  ---

  ### Part 4: Critique of Your Test Cases

  You asked me to challenge your cases if they build in contestable descriptions. Two of them require refinement.

  **1. Withholding vs. Withdrawing**
  *   **Critique:** This is a dangerous test case because the moral equivalence in bioethics is largely a *stipulation* to prevent doctors from feeling compelled to start treatment they deem futile. It is a policy fudge, not necessarily a moral truth.
  *   **Replacement:** Instead of asking the theory to justify the equivalence, ask the theory to **identify the conditions under which they diverge.**
  *   **Better Test:** A case where withdrawing *is* killing. Example: Removing a kidney from a patient who is dependent on it (and has no other) vs. refusing to transplant a new one. Here, withdrawing is killing. The theory must explain why withdrawing a ventilator is 'allowing' but withdrawing a kidney is 'killing', given the physics is identical. The difference lies in **ownership and bodily intrusion**, not the withholding/withdrawing dynamic. This is a sharper test.

  **2. Automated/AI Systems**
  *   **Critique:** Focusing on 'running vs. declining to run a computation' risks a category error. For an AI, 'running' is its natural state. 'Declining' might be a system failure.
  *   **Replacement:** Focus on **Default Settings vs. Active Overrides.**
  *   **Better Test:** An autonomous drone is programmed to strike targets that match Profile X.
      *   *Case A:* The drone strikes a target matching Profile X (Default operation).
      *   *Case B:* A human operator overrides the safety lock to strike a target matching Profile X (Active commission).
      *   *Case C:* The drone is programmed *not* to strike, and the operator overrides to *prevent* a strike.
      *   The question is: Is the harm in Case A a 'doing' by the programmers or an 'allowing' by the system? This tests the **Distributed Agency** desideratum better than simple computation. It forces the theory to locate the 'agent' in the code, the user, or the deployment context.

  ### Summary Advice for the Student

  Your student's chapter should not attempt to prove that the distinction *has* moral weight. It should specify what a theory must look like *if* it is to be used by an institution that believes it has weight.

  The critical insight they must reach is this: **The Doing/Allowing distinction is not a description of the world; it is a description of the agent's relationship to the world.**

  Therefore, the specification must demand that the theory defines the **Baseline**.
  *   In medicine, the baseline is 'disease kills, doctors treat'. Hence, stopping treatment is allowing the disease to kill.
  *   In AI, the baseline is 'system operates within parameters'. Hence, a default kill is a 'doing' by the programmer, but an 'allowing' by the system.
  *   In double prevention, the baseline is 'threats in motion'. Intercepting is doing; diverting is allowing (usually).

  If the student tries to find the baseline in physics, they will fail. If they locate it in **normative expectations and entitlements**, they can satisfy the Policy Usability requirement, even if they sacrifice Metaphysical Priority. Given your supervisory goal (policy utility), I would advise them to prioritise **Identification** and **Agency-Neutrality**, even if it means admitting the distinction is socially constructed rather than metaphysically fundamental.

  This approach satisfies the hospital trust (who need clear baselines) and handles the AI case (where baselines are code), while honestly acknowledging that the 'weight' comes from the moral significance of violating expectations, not the physics of the act.
