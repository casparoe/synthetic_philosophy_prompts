      *   *Philosopher's View:* This is the biggest technical hurdle. Deontology often posits *agent-relative constraints* or *rights violations* that are lexically prior or infinite in disvalue compared to utilitarian costs.
      *   *The Math:* $0.6 \times (-\infty) + 0.4 \times (\text{Utility of saving 5})$. In standard arithmetic, $0.6 \times (-\infty) = -\infty$. The expected value is negative infinity. You can never overcome it.
