  **FOR IMMEDIATE RELEASE**

  **Equilibrium Dynamics Launches VeilOS 2.0, Optimizing Compensation Through Uncertainty**

  **NEW GENEVA, 2028** — Equilibrium Dynamics today announced the general availability of VeilOS 2.0, the enterprise-grade platform allowing leadership teams to set pay and promotion policy from behind a computational veil of ignorance. By temporarily obscuring user identities during policy simulation, VeilOS ensures that no executive knows which position they will occupy in the final org chart, guaranteeing arrangements that are rational for all parties.

  "Fairness is just risk management under uncertainty," said Dr. Aris Thorne, CEO of Equilibrium Dynamics. "VeilOS allows boards to maximize the minimum outcome for any stakeholder, ensuring that inequality is only permitted when it strictly improves the baseline for the least advantaged participant."

  The platform includes several new modules designed for regulatory compliance and ethical auditing. The base tier covers current full-time employees, while premium subscriptions extend the reference group to contractors, supply-chain workers, and hires not yet born. Early beta partner OmniGlobal Logistics reported a 15% increase in perceived legitimacy after implementing the system.

  **Frequently Asked Questions**

  **Q: How is the risk appetite configured?**
  A: The default setting is locked at zero tolerance for downside variance. This ensures the system prioritizes the worst-case scenario for any given role. Clients may adjust this setting, but doing so voids the Fairness Commitment Guarantee.

  **Q: What currency does the platform use for comparison?**
  A: VeilOS defaults to income and wealth metrics, aligned with standard primary goods indices. There is a legacy preset for self-reported happiness, though auditors rarely accept this due to volatility and adaptation biases.

  **Q: Can the reference group be modified?**
  A: Yes. The Population-Scope Toggle allows clients to expand the denominator. Please note that adding extremely low-wage interns—the "Anchor" feature—will recalculate the floor. Under the holistic arrangement reading, executive raises are compliant if they generate sufficient surplus to raise the Anchor's wage by any nonzero amount.

  **Q: How does the system prevent gaming?**
  A: Nightly recomputation locks the reference group. However, clients may add new entry-level roles before the computation window. This is technically compliant provided the overall arrangement remains superior to alternative structures.

  **Q: What happens if an employee lands in the bottom tenth?**
  A: The Commitment Guarantee allows any user assigned to the bottom decile to void their contract without penalty. This guarantee is automatically voided if the risk appetite setting was ever moved off zero during the fiscal year.

  **Q: Is the veil reversible?**
  A: No. Once policy is ratified, identities are revealed. Any attempt to re-run the simulation after seeing the results is logged as an ethics violation.

  **Q: Does this cover future generations?**
  A: The "Unborn Hires" module projects demographic data fifty years out. Liability for these stakeholders is limited to the Just Savings Clause.

  ***

  **Editor's Note:**

  This satire relies on specific interpretations of John Rawls' theory of justice. Several features are standard doctrine: the "veil of ignorance" (designing rules without knowing your place), the "maximin" rule (maximizing the minimum outcome), and the use of income/wealth ("primary goods") rather than happiness as the metric. Rawls argues inequalities are only permissible if they benefit the least advantaged.

  However, the piece exaggerates contested areas. The "Anchor" feature leans on a holistic reading of the difference principle (the whole system must help the worst off) rather than a strict incremental one (every specific raise must help them). Rawls assumes a "closed society," so extending scope to global supply chains or the unborn is a modern extension, though he did address intergenerational justice via a "just savings principle." Finally, Rawls focuses on risk aversion regarding basic liberties and goods, not necessarily "upside risk" in the financial sense. This parody assumes a corporate software logic that might simplify these philosophical commitments for the sake of the joke.
