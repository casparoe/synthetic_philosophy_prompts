answer: |-
  **Question 4**

  Define **Determinism** as the thesis that the state-transition map of a world is a function: any two worlds agreeing at time $t_0$ agree at all $t$. Define **Predictability** as the epistemic capacity to announce a future state within error $\delta$ given initial knowledge within error $\epsilon$.

  Consider **The Archivist**: an agent with unlimited computing power and exact knowledge of the laws, but who receives the initial state only as a membership claim: "The true state $x_0$ lies somewhere in the ball $B_\epsilon(x_{approx})$." Her task is to announce a state $y$ at horizon $T$ such that the actual future state $x_T$ is within distance $\delta$ of $y$, for *every* possible $x_0$ in that initial ball.

  Consider a chaotic system with a positive Lyapunov exponent $\lambda$, meaning nearby states separate exponentially ($d_t \approx d_0 e^{\lambda t}$).

  Consider the **Shadowing Lemma**: the mathematical result that for any approximate trajectory (a sequence of states with small errors at each step), there exists *some* exact true trajectory that stays uniformly close to the approximate one.

  Consider a **Computable Real**: a number whose digits can be generated by a finite algorithm. A **Non-Computable Real** has no such finite specification.

  (a) Explain why the Archivist fails her task for large $T$ in this chaotic system, and why this failure is compatible with Determinism.
  (b) A student argues the Shadowing Lemma saves the Archivist. Explain why it does not.
  (c) Suppose the actual initial condition $x_0$ is a Non-Computable Real. Does Determinism fail? Propose a thesis of **Simulable Determinism** to capture what is lost, and comment on whether physics should care given the cardinality of computable vs. non-computable reals.

  ***

  **Model Answer**

  Chaos destroys predictability without threatening determinism, but non-computable initial states threaten a stronger thesis of simulability that physics may need to adopt. The Archivist fails because determinism guarantees a unique image for the entire initial set, not a small image for any specific member of that set. In a chaotic system with positive Lyapunov exponent $\lambda$, the initial uncertainty ball of radius $\epsilon$ expands exponentially over time. By horizon $T$, the image of that ball has diameter roughly $\epsilon e^{\lambda T}$. Once this diameter exceeds the Archivist's tolerance $\delta$, she cannot announce a single point $y$ that is within $\delta$ of *every* possible actual outcome. She knows exactly where the whole cloud of possibilities is going, but the cloud is too big to count as a prediction. This is purely epistemic limitation; the ontic mapping from the initial ball to the final cloud remains a unique function, satisfying the definition of determinism.

  The Shadowing Lemma does not rescue the Archivist because it offers an existential guarantee rather than an identificatory one. The lemma states that *some* exact trajectory shadows the approximate one the Archivist computes. It does not state that the *actual* trajectory—the one determined by the specific unknown $x_0$—is the one doing the shadowing. The Archivist needs to know where the actual world is going, not where a possible world compatible with her data is going. Since many distinct exact trajectories shadow her approximation, and she lacks the precision to distinguish which one is actual, the lemma provides no predictive leverage. It confirms consistency, not uniqueness of the actual path relative to her knowledge.

  If the actual initial condition $x_0$ is a Non-Computable Real, standard Determinism does not fail. The state still evolves uniquely according to the laws; the future is fixed by the present, even if the present cannot be finitely specified. However, this reveals a gap between causation and computation. We should therefore distinguish standard Determinism from **Simulable Determinism**: the thesis that the laws plus a finite specification of the state fix a computable trajectory. In this scenario, Simulable Determinism fails. Physics should care deeply about this distinction because physical measurement and theory construction rely on finite descriptions. If the universe relies on non-computable reals to fix states, no finite theory can fully specify a single world's history, even if the laws are deterministic.

  Furthermore, the set of computable reals is countable, while the reals are uncountable. Measure-theoretically, the probability of picking a computable real at random is zero; non-computable states are the measure-one case. If physics requires Simulable Determinism to be meaningful for agents like us, then standard deterministic chaos models defined over continuous state spaces are almost surely unsimulable. This suggests that either physical state spaces are discrete, or we must accept that most deterministic worlds are inherently beyond finite prediction or specification, rendering Simulable Determinism a stronger, perhaps more physically relevant constraint than ontic determinism alone.

  ***

  **Marking Scheme (20 Marks)**

  **1. Ontic vs. Epistemic Distinction (4 marks)**
  *   **Must Hit:** Explicitly separate determinism (unique state-transition function) from predictability (knowledge of specific state).
  *   *Blow it:* Conflating unpredictability with indeterminism or claiming chaos makes the future "open."

  **2. Archivist Failure Mechanism (4 marks)**
  *   **Must Hit:** Explain that the image of the initial $\epsilon$-ball expands exponentially (Lyapunov) until it exceeds $\delta$.
  *   *Blow it:* Saying the Archivist lacks computing power or that the laws are approximate.

  **3. Determinism Preservation (4 marks)**
  *   **Must Hit:** Clarify that determinism maps the *set* (ball) uniquely, even if the image set is large/spread out.
  *   *Blow it:* Arguing that because the outcome is spread out, the mapping itself is non-functional.

  **4. Shadowing Lemma Refutation (4 marks)**
  *   **Must Hit:** Identify that shadowing guarantees *some* trajectory, not the *actual* trajectory (existential vs. specific).
  *   *Blow it:* Claiming shadowing proves the approximation is correct or that it restores predictability.

  **5. Simulable Determinism & Measure (4 marks)**
  *   **Must Hit:** Define Simulable Determinism (finite spec $\rightarrow$ computable trajectory) and note non-computable reals are measure-one (countable vs. uncountable).
  *   *Blow it:* Claiming non-computable inputs break causation or ignoring the measure-theoretic implication.
