  # The Ghost Lattice Decision Tree

  **Start:** You agree two theories can match every prediction but differ on what exists (e.g., one has a "ghost lattice" below Planck scale, the other doesn't).

  ### Node 1: The Existence Claim
  **Question:** In the theory with the ghost lattice, do you say the lattice points *actually exist*?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 3.

  ### Node 2: The Redundancy Test
  **Question:** If a simpler theory without the lattice fit the data just as well, would you still insist the lattice exists?
  *   **Yes** (Truth trumps simplicity) → **Leaf: Generous Realist**
  *   **No** (Simplicity constrains existence) → **⚠️ Flag: Incoherent Path.** If you say "No" here, you shouldn't have said "Yes" at Node 1 for this specific case. This usually collapses into the Quinean position below (you only commit to what the *best* theory needs).

  ### Node 3: The Reason for Exclusion
  **Question:** You denied existence. Is it because the lattice is *unobservable*, or because it is *ontologically idle* (does no work)?
  *   **Unobservable** (If we can't see it, it's not real) → **Leaf: Hard Eliminativist**
  *   **Idle** (It could be observable in principle, but adds nothing) → Go to Node 4.

  ### Node 4: The Status of Structure
  **Question:** If the lattice points aren't real, is the *mathematical structure* connecting the predictions still a real feature of the world?
  *   **Yes** (Relations are real, objects are not) → **Leaf: Structural Realist**
  *   **No** (Structure is just part of the model) → Go to Node 5.

  ### Node 5: Theoretical Tolerance
  **Question:** Do you keep the ghost lattice in your equations as a useful tool, or do you purge it entirely?
  *   **Keep It** (Useful formalism, but deny "being") → **Leaf: Ghost-Neutral**
  *   **Purge It** (Ontology is bookkeeping; if it's idle, cut it) → **Leaf: Quinean Deflationist**

  ***

  ### 🚩 Flags & Incoherences

  **1. The "Bookkeeping but Real" Combo**
  *   *Combo:* Claiming "Ontology is just bookkeeping" (Node 5 logic) while insisting "The lattice is genuinely real" (Node 1 Yes).
  *   *Verdict:* **Incoherent.** If ontology is just a ledger of commitments (Quinean), nothing is "genuinely real" beyond what the ledger requires for utility. You can't have it both ways.

  **2. The Structuralist vs. Deflationist Blur**
  *   *Issue:* At Node 4, a Structural Realist and a Quinean Deflationist might both say "The structure is what matters."
  *   *Distinction:* The Structuralist says the structure is **mind-independent** (it's out there). The Quinean says the structure is **semantic** (it's in our best description). The tree separates them at Node 5: The Quinean purges idle variables from the description; the Structuralist might retain the structure as reality even if the specific variables shift.

  **3. The Ghost-Neutral Paradox**
  *   *Issue:* "Tolerates the lattice but denies it has being."
  *   *Verdict:* **Unexplored/Hybrid.** This is essentially Instrumentalism with a specific allowance for hidden variables. It risks collapsing into Structural Realism (if the tool works, isn't the structure real?) or Quineanism (if it has no being, why keep it?). It occupies a narrow slice where math is permitted to outpace ontology.

  **4. Indistinguishable Pair: Hard Eliminativist vs. Quinean**
  *   *Issue:* In this specific "ghost lattice" case, both end up rejecting the lattice.
  *   *Distinction:* The tree separates them at Node 3. The Eliminativist rejects *all* unobservables. The Quinean rejects *only redundant* unobservables (they might accept an unobservable electron if it simplifies the theory). If you only test them on the ghost lattice, they look identical.
