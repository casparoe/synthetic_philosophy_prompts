  **THE METROPOLITAN RECORD**
  **STANDARDS DESK MEMORANDUM 44-B**
  **SUBJECT: House Rules for Rating Claims Containing Definite Descriptions**
  **EFFECTIVE: IMMEDIATELY**

  The following protocols govern the verification of statements utilizing the definite article *the*. Reporters and editors must adhere to these standards to ensure logical consistency across all platforms. Queries regarding these protocols are considered admissions of incompetence.

  **1. Conditions of Existence and Uniqueness**
  The use of *the* asserts both that an object exists and that it is unique. If either condition fails, the claim containing the description is rated FALSE. This applies even if the predicate is otherwise accurate. In cases where multiple satisfiers exist, the claim fails immediately upon the emergence of the second satisfier.

  *   **Claim:** "The tallest building downtown is made of glass."
  *   **Verdict:** FALSE (as of Tuesday).
  *   **Note:** The claim was TRUE on Monday. However, the completion of the Apex Tower at identical height creates a tie. Uniqueness is violated. The building's material composition is irrelevant.

  **2. Negation Scope and Compound Ratings**
  Sentences negating a definite description (e.g., "The King of France is not bald") possess two logical forms. The primary occurrence ("It is not the case that the King...") is TRUE. The secondary occurrence ("The King is... not bald") is FALSE. To accommodate both truth values, the Standards Desk assigns a compound rating of TRUE/FALSE.

  *   **Claim:** "The city manager is not corrupt."
  *   **Verdict:** TRUE/FALSE.
  *   **Note:** Print this rating in full body copy. Compound ratings are strictly forbidden in headlines, sidebars, and push notifications. If a compound rating is required, rewrite the sentence to remove the definite description. If unable to rewrite, spike the story.

  **3. Temporality of "Present"**
  Descriptions containing temporal markers (e.g., *current*, *present*, *acting*) are evaluated at press time, defined as the moment the digital edition is locked for publication. Personnel changes occurring after this timestamp are not recognized until the next cycle.

  *   **Claim:** "The present mayor supports the bond."
  *   **Verdict:** FALSE.
  *   **Note:** The mayor resigned at 3:55 PM. Press time was 4:00 PM. There is no present mayor at press time. The claim fails the existence condition. Do not adjust for the interim appointment.

  **4. Negative Existentials**
  Statements denying the existence of a described object (e.g., "There is no King of France") are always TRUE, provided the description is indeed unsatisfied. This is the only instance where a sentence appears to reference a non-entity without committing a logical error. The Standards Desk considers accurate rating of negative existentials to be the department's primary metric of success.

  *   **Claim:** "There is no such person as the lead investigator."
  *   **Verdict:** TRUE.
  *   **Note:** The position remains vacant. This verdict stands regardless of public confusion. Reporters attempting to interview the lead investigator will be referred to this memorandum.

  **5. Incomplete Symbols and Syntax**
  Definite descriptions are incomplete symbols; they possess no meaning in isolation. They contribute only to the proposition of a complete sentence. Consequently, the phrase *the [noun]* is banned from headlines, photo captions, pull quotes, and transitional subheads. Furthermore, all claims must be rewritten in canonical logical form ("There exists exactly one x such that...") prior to submission.

  *   **Claim:** "The culprit was arrested." (Headline)
  *   **Verdict:** REJECTED.
  *   **Note:** The News Editor has deemed the canonical form unreadable for general circulation. However, the copy remains logically deficient. Reporters must submit a waiver acknowledging the logical deficiency alongside the standard style waiver.

  **6. Application to General Coverage**
  These rules apply to all sections, including local news, sports, and features. Ambiguity regarding uniqueness must be resolved in favor of FALSE. If a situation admits multiple causes, actors, or reasons, the definite article cannot be used.

  *   **Claim:** "The reason the levy failed was voter apathy."
  *   **Verdict:** FALSE.
  *   **Note:** Internal polling indicates three contributing factors. "The reason" implies a unique satisfier. Since uniqueness is not satisfied, the proposition is false. Voter apathy may be *a* reason, but it is not *the* reason. Rewrite not permitted; rating stands.

  **COMPLIANCE**
  Failure to adhere to these rules will result in reassignment to the obituary desk, where existence claims are rarely contested. The Standards Desk reserves the right to retroactively falsify archived content upon discovery of new satisfiers.

  **APPROVED BY:**
  **Standards Desk**
  **The Metropolitan Record**
