answer: |-
  Good morning. To those who spend your days in the clinic listening to patients describe the terror of feeling unreal, and to those who spend your days in the lab modeling the predictive architectures that generate the sense of being real: welcome. We are here because these two perspectives are no longer optional partners; they are necessary constraints on one another.

  We begin with a working premise that must function as more than a metaphor. For the duration of this workshop, we treat consciousness not as a transparent window onto mental states, but as a user interface. In this framework, subjective experience is a controlled illusion—not in the sense of being false, but in the sense of being designed to hide complexity. The healthy self-model is transparent; we look *through* it to engage with the world and ourselves. We do not see the computations, the weighting of sensory evidence, or the narrative stitching. We see only the result: a coherent "I" inhabiting a meaningful world.

  This premise dictates our terminology and limits our claims. It means we cannot treat first-person reports as sacred, unmediated data. When a patient says, "I feel like a robot," or "The world looks flat," they are not reporting on the metaphysical status of their existence. They are reporting on the opacity of their interface. They are describing a breakdown in model-transparency.

  For our clinical colleagues, this requires a careful distinction. The suffering associated with depersonalization is absolute and urgent. We are not suggesting the pain is illusory. However, under this framework, the symptom is not a revelation of a hidden reality. It is not that the patient has suddenly seen the "truth" that the self does not exist. Rather, the rendering engine has faltered. The interface has become visible to itself. The glue that binds sensory input to self-attribution has loosened, and what remains is the raw data of experience without the usual immersive overlay. Our task is not to validate the metaphysical claim of unreality, but to understand the functional failure that makes reality feel distant.

  For our theorists and cognitive architects, this imposes an equally strict boundary. We cannot treat these reports as mere noise to be eliminated by a better model. The phenomenology of depersonalization is the most direct data we have regarding the limits of the interface. If the self-model is a predictive construct, depersonalization represents a specific error signal—a divergence between prior expectations of selfhood and incoming interoceptive or exteroceptive data. But we must avoid the temptation of eliminativism. We cannot say the feeling is "nothing but" a prediction error. To the user, the interface is the only reality they have access to. When it glitches, their world breaks.

  We must also acknowledge what we cannot do. We are not here to bridge the explanatory gap. We are not claiming that by mapping the architecture of self-awareness, we will explain why there is experience at all. We are here to explain how the experience is structured, and how that structure collapses. We do not have direct access to anyone's inner experience, including our own. We are triangulating. We have the clinical testimony of the interface failure, and we have the neural and computational models of the machinery beneath. Our work lies in the correlation between the crash report and the code.

  Over the next two days, I ask that we hold this tension. When we discuss phenomenology, let us speak of it as the behavior of the system, not as a glimpse into the soul. When we discuss neural mechanisms, let us remember that these mechanisms exist to serve a user who is currently in distress. We are reverse-engineering the self by studying where it comes undone.

  If we succeed, we will not have solved the mystery of consciousness. But we may have built a better map of where the interface fails, offering our clinical colleagues better targets for intervention, and our theorists better constraints for their models. Let us begin.
