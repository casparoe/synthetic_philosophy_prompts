answer: |-
  1. Setup, notation, and the assumptions I am making

  Let the days be indexed $d \in \{1, 2, 3, 4, 5\}$, corresponding to Monday through Friday. The teacher selects a probability distribution $p = (p_1, \dots, p_5)$ such that $\sum p_d = 1$. Let $T(d) = \sum_{e=d}^5 p_e$ be the tail probability that the exam occurs on day $d$ or later, given it has not occurred earlier. The hazard rate on day $d$, representing the student's conditional credence upon reaching that morning, is $h(d) = p_d / T(d)$. Note necessarily that $h(5) = 1$.

  I assume the student is an ideal Bayesian who conditionalizes on the announcement and the absence of the exam on prior days. Crucially, I treat assumption (ii) as load-bearing: the distribution $p$ is common knowledge. The student knows $p$, the teacher knows the student knows $p$, and so on. Truthfulness is also common knowledge. I fix the surprise threshold at $t = 1/2$. I will evaluate three precisifications of surprise: (C) occurrent credence ($h(d) \le t$), (A) interim predictive success ($\max_{e \ge d} p_e/T(d) \le t$), and (E) ex-ante predictive success ($\max_d p_d \le t$). I will later revisit the common-knowledge assumption, as it is the primary candidate for relaxation should the argument fail.

  2. The graded collapse: what the classical argument really establishes

  The classical elimination argument claims the announcement is contradictory because Friday cannot be a surprise, implying Thursday cannot, and so on. In this probabilistic setting, the argument does not yield a contradiction but rather a "graded collapse" where the probability of surprise is bounded below 1. Under precisifications (C) and (A), the last day with positive probability always carries a hazard of 1. Since $1 > t$, the exam cannot be a surprise on the final possible day. Thus, no procedure known to the student can make the announcement guaranteed true. The teacher's goal shifts to maximizing the probability that the exam occurs on a day where the surprise condition holds.

  Consider two candidate procedures: (U) the uniform distribution ($p_d = 0.2$) and (G) the geometric coin-toss procedure ($p = (1/2, 1/4, 1/8, 1/16, 1/16)$). The table below verifies the tails and hazards.

  | Day | $p_d$ (U) | $T(d)$ (U) | $h(d)$ (U) | $p_d$ (G) | $T(d)$ (G) | $h(d)$ (G) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | Mon | 0.20 | 1.00 | 0.20 | 0.50 | 1.00 | 0.50 |
  | Tue | 0.20 | 0.80 | 0.25 | 0.25 | 0.50 | 0.50 |
  | Wed | 0.20 | 0.60 | 0.33 | 0.125 | 0.25 | 0.50 |
  | Thu | 0.20 | 0.40 | 0.50 | 0.0625 | 0.125 | 0.50 |
  | Fri | 0.20 | 0.20 | 1.00 | 0.0625 | 0.0625 | 1.00 |

  Under (C) with non-strict inequality ($h(d) \le 0.5$), (U) yields surprise on Mon–Thu (probability 0.8), failing on Friday. (G) yields surprise on Mon–Thu (probability $1 - 1/16 = 15/16 = 0.9375$), failing on Friday. (G) is superior. Is (G) optimal? To ensure $h(d) \le t$ for $d < 5$, we require $p_d \le t T(d)$, implying $T(d+1) = T(d) - p_d \ge (1-t)T(d)$. Iterating this, $T(5) \ge (1-t)^4$. The probability of surprise is $1 - T(5) \le 1 - (1-t)^4$. For $t=1/2$, the maximum attainable probability is $1 - (1/2)^4 = 15/16$. Procedure (G) achieves this bound exactly by keeping the hazard flat at $t$ until the final day. If the threshold were strict ($h(d) < t$), (G) would fail on Mon–Thu, but a distribution arbitrarily close to (G) would approach the same optimum. The choice of $t=1/2$ is not special for the structure of the optimum, though it makes (G) a clean coin-toss procedure.

  3. The case that the announcement survives

  Under precisification (E), the announcement might survive entirely. (E) defines surprise ex-ante: the exam is a surprise if the student's best plan from Sunday night yields success probability $\le t$. This depends only on $\max_d p_d$. For (G), $\max_d p_d = 1/2 \le t$. Thus, under (E), the announcement is true with certainty. However, (E) suffers from dynamic inconsistency. The plan that is best ex-ante (guessing Monday) may not be rational interim. Upon reaching Thursday, the student knows the exam is Thu or Fri with equal conditional probability (0.5 each). Her interim predictive success is 0.5. If she updates her plan, she is still bounded by the hazard rates analyzed in Section 2. (E) ignores the information gained by the absence of the exam on earlier days, treating the announcement as a static property of the distribution rather than a condition on the student's epistemic state at the time of the exam.

  This highlights a disanalogy with the classical backward induction argument in games of perfect information. Standard worries about backward induction note that it credits agents with rationality at nodes reached with probability zero under the equilibrium path. In the classical paradox, the elimination of Friday assumes the student knows the exam won't be Friday, rendering Friday an off-path node. Here, under (G), Friday is reached with probability $1/16$. The student *will* be rational on Friday, will assign credence 1 to the exam, and will not be surprised. The classical argument fails not because rationality is misplaced, but because it treats a probabilistic risk as a logical impossibility. The "paradox" dissolves into a calculation of optimal risk management. The teacher can guarantee high probability of surprise, but not certainty, because common knowledge of the procedure forces the hazard on the final possible day to 1.

  4. Verdict

  I adjudicate that precisification (C) is the correct explication of surprise for this problem. Surprise is essentially an occurrent epistemic state; it matters what the student believes *on the morning of the exam*, not what she planned on Sunday night. (E) is too weak because it allows the teacher to satisfy the announcement while the student correctly deduces the exam time on Thursday evening. (A) collapses into (C) in this setup because the maximum interim probability is always the hazard of the most likely remaining day, which converges to the hazard of the current day in the optimal distribution.

  Under (C), the teacher's announcement is not satisfiable with certainty. The mathematical constraint $h(5)=1$ ensures that if the exam occurs on the last possible day, it is not a surprise. However, the announcement is satisfiable with high probability. The optimal procedure is (G), which yields a surprise probability of $15/16$. The classical no-surprise-exam argument is unsound. It relies on a binary conception of knowledge and possibility that ignores the probabilistic nature of the student's credences. When formalized with Bayesian updating, the "contradiction" becomes a boundary condition: the probability of surprise must drop to zero on the final day, but can remain high elsewhere. The paradox is not genuinely paradoxical; it is a puzzle about the limits of common knowledge in probabilistic settings. The teacher can rationally make the announcement, knowing it will be true in 93.75% of cases, provided the student understands the probabilities.

  Regarding the teacher's rational choice: The teacher's payoff is $1 + 0.1(d-1)$ if surprise, and $0.1(d-1)$ if not. Using the values from Section 2, the expected payoff for (U) is $1.00$, while for (G) it is $1.03125$. A rational teacher will choose (G). At this choice, the announcement is false on the Friday branch (probability 0.0625) and true on all others. Thus, the announcement is not strictly true, but it is the most truthful statement compatible with the teacher's incentive to defer the exam.

  5. What would change my mind

  The single consideration most likely to reverse my verdict is the relaxation of assumption (ii): common knowledge of the selection procedure. My derivation relies entirely on the student knowing $p$ to calculate the hazards $h(d)$. If the teacher can select $p$ secretly, or randomize over distributions unknown to the student, the student cannot conditionalize on a specific $p$. In that case, the student's credences might remain diffuse enough that $h(5) < 1$ from her perspective, potentially allowing surprise even on Friday. My reasoning is most vulnerable at the point where I treat the announcement as a fixed point constraint on a known distribution. If the announcement itself modifies the student's prior over procedures in a way that prevents convergence to $h(5)=1$ (perhaps through a form of epistemic blindness or bounded rationality not modeled here), the graded collapse might be avoided. Additionally, if the threshold $t$ is treated as a strict inequality without the possibility of approaching the limit, the optimal probability drops strictly below $15/16$, which might alter the teacher's incentive to make the announcement at all if the payoff for non-surprise is sufficiently punitive. However, within the strict bounds of ideal Bayesianism and common knowledge provided, the mathematical limit holds.
