      *   **One nuance:** The prompt asks "Is (G) optimal, or can some other distribution beat it?"
          *   I derived $T(5) \ge (1-t)^4$.
          *   Surprise Prob = $1 - T(5)$.
          *   To maximize Surprise Prob, minimize $T(5)$.
          *   Min $T(5)$ is achieved when $h(d)=t$ for all $d<5$.
          *   This yields the geometric distribution (G).
