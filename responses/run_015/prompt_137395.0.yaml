prompt: |-
  ok so I run a small reading group on philosophy of biology (I'm not a biologist by training, I teach phil of science) and I'm writing up a short position note on the units of selection thing before I inflict it on everyone else. I'd like a consistency check first, because I have a vague feeling that something in the middle of the list is doing more work than it's allowed to and I can't locate it.

  Here's roughly where I've landed:

  1. Cumulative adaptation needs a faithful replicator. I've been using a rough test of my own, call it the copy-fidelity test: a level is a genuine unit of selection only if the things at that level get near-copied across generations often enough for selection to actually accumulate there. Genes pass that test. Organisms, I suspect, don't, since meiosis and recombination scramble them every generation. So I'm a gene's-eye person about adaptation.

  2. But I can't stand the lumbering-robot rhetoric. Organisms really do hang together, developmentally and as the things that live and die, and I want to say selection on individuals is a real causal thing and not just a convenient way of adding up gene-level effects.

  3. I take the kin selection versus multi-level selection fight to be largely formal: on my understanding they're two different partitions of the same total change, so choosing between them is bookkeeping, not substance.

  4. Except I also want to say that in some actual cases the group level is where the causal work happens. Take cooperative breeding in birds, or the spread of norms across small human bands: groups differ in whether they persist or throw off daughter groups, and the change in gene or norm frequency is downstream of that. That sounds like more than bookkeeping, and it sounds like something the gene's-eye description gets wrong about the direction of explanation.

  5. Group selection in nature is rare and weak. It needs a pile of conditions holding at once: lots of variance between groups, not much migration between them, group-level events like extinction or colony founding that are frequent enough to matter. Those usually don't line up.

  6. But I think cultural group selection in humans is genuinely doing explanatory work: monogamy, cooperation at scale, food taboos, the way persistent raiding reorganises neighbouring bands. And I want to hold this even though cultural transmission is nothing like as faithful as DNA copying.

  7. Where brothers compete locally for mates and the sex ratio comes out strongly female-biased, I think the individual-level story is the perspicuous one and it's how I'd teach the case.

  So: which pairs are genuinely in tension and which only look like it? Please rank the real tensions by severity rather than listing them all as equally bad, and for each one say what would have to give and what that revision would cost me. I'd also like to know if there's a single revision that cleans up the most, and whether any one of the seven is load-bearing enough that the others should be rebuilt around it. And please don't just tell me the whole debate is terminological — I already half believe that about two of these, so tell me which two and whether that's a real diagnosis or me dodging.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy of science teacher (not a biologist by training), runs a reading group on philosophy of biology.
      *   **Task:** Consistency check on a 7-point position note regarding "units of selection."
      *   **Specific Concern:** Feels something in the middle is doing too much work/is inconsistent, but can't locate it.
      *   **Requirements:**
          *   Identify genuine tensions vs. apparent tensions.
          *   Rank tensions by severity.
          *   For each tension, specify what would have to give and the cost of revision.
          *   Identify if a single revision cleans up the most.
          *   Identify if one point is "load-bearing."
          *   Address the "terminological dodge" claim regarding the kin/MLS debate (Point 3).
          *   Tone: Professional, philosophical, precise, avoiding platitudes.

  2.  **Analyze the 7 Points:**
      *   *Point 1 (Replicator/Copy-Fidelity):* Adaptation requires faithful replication. Genes pass; organisms fail (due to recombination). Conclusion: Gene's-eye view on adaptation. (Classic Dawkins/Hull).
      *   *Point 2 (Organism Reality):* Rejects "lumbering robot" rhetoric. Organisms are cohesive causal units (development, life/death). Selection on individuals is real causal work, not just bookkeeping. (Classic Williams/Gould tension).
      *   *Point 3 (Kin vs. MLS):* Formal equivalence. Bookkeeping, not substance. (Standard Price Equation view).
      *   *Point 4 (Group Causality):* In some cases (cooperative breeding, human norms), group level is where causal work happens. Gene's-eye gets explanation direction wrong. (Tension with Point 1 & 3).
      *   *Point 5 (Rarity of Group Selection):* Biological group selection is rare/weak (needs specific conditions). (Standard consensus).
      *   *Point 6 (Cultural Group Selection):* Human cultural group selection is real/explanatory, *despite* low fidelity compared to DNA. (Tension with Point 1).
      *   *Point 7 (Local Mate Competition):* Individual-level story is perspicuous for sex ratios. (Consistent with Point 2 & 5).

  3.  **Identify Tensions:**

      *   **Tension A: Point 1 vs. Point 6 (The Fidelity Criterion).**
          *   *Conflict:* Point 1 says high fidelity is *necessary* for a unit of selection (adaptation). Point 6 says cultural group selection works *despite* low fidelity.
          *   *Severity:* High. This undermines the core criterion established in Point 1.
          *   *Resolution:* Either loosen Point 1 (fidelity isn't binary/absolute) or restrict Point 1 to genetic adaptation only.

      *   **Tension B: Point 1 vs. Point 2 (The Causal Status of the Organism).**
          *   *Conflict:* Point 1 says organisms aren't genuine units of selection because they don't replicate faithfully. Point 2 says selection on individuals is a "real causal thing." If they aren't units of selection (per Pt 1), how can selection on them be real causal work (per Pt 2)?
          *   *Severity:* Medium-High. This is the classic "Vehicle vs. Replicator" confusion.
          *   *Resolution:* Distinguish "Unit of Selection" (Replicator) from "Unit of Evolution" (Vehicle/Interactor).

      *   **Tension C: Point 3 vs. Point 4 (Formal Equivalence vs. Causal Primacy).**
          *   *Conflict:* Point 3 says Kin/MLS is just bookkeeping (mathematically equivalent). Point 4 says group level is where "causal work happens" and gene's-eye gets "direction of explanation" wrong. If they are formally equivalent, can one be causally privileged?
          *   *Severity:* Medium. This is a philosophical debate about explanatory pluralism vs. monism.
          *   *Resolution:* Accept explanatory pluralism (Okasha's view). The math is equivalent, but the causal *explanation* depends on the context.

      *   **Tension D: Point 4 vs. Point 5 (Existence vs. Rarity).**
          *   *Conflict:* Point 4 says group level does causal work in some cases. Point 5 says it's rare/weak.
          *   *Severity:* Low. "Rare" implies "exists sometimes." Point 4 specifies "some actual cases." This is consistent.

  4.  **Evaluate the "Middle" Suspicion:**
      *   The user suspects the middle (Points 3 & 4) is doing too much work.
      *   *Analysis:* Point 3 claims formal equivalence (Price Equation orthodoxy). Point 4 claims causal distinctness (Causal pluralism). These *can* coexist (Okasha's *Evolution and the Levels of Selection*), but the transition is abrupt. Point 4 challenges the "just bookkeeping" implication of Point 3 without explicitly qualifying it.
      *   *Verdict:* The user is right to be suspicious. Point 4 undermines the spirit of Point 3, even if the math holds.

  5.  **Evaluate the "Terminological Dodge" (Point 3):**
      *   Is Kin/MLS just terminological?
      *   *Consensus:* Mathematically, yes (Price Equation). Causally/Heuristically, no. Different models highlight different causal structures.
      *   *Advice:* It's not a dodge, but it needs nuance. It's a "formal equivalence, explanatory pluralism" stance.

  6.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the sophistication of the note. It's a solid draft.
      *   *The "Load-Bearing" Point:* Point 1 (The Fidelity Criterion). It dictates the logic of 2, 4, and 6.
      *   *Ranking Tensions:*
          1.  **Pt 1 vs. Pt 6 (Severity: Critical).** Fidelity requirement vs. Cultural Evolution.
          2.  **Pt 1 vs. Pt 2 (Severity: High).** Replicator vs. Interactor confusion.
          3.  **Pt 3 vs. Pt 4 (Severity: Medium).** Formal equivalence vs. Causal explanation.
      *   *Addressing the "Middle" Suspicion:* Confirm Point 3/4 transition is the friction point regarding *explanation*.
      *   *The Single Revision:* Refine Point 1 to distinguish *Genetic* Adaptation from *Cultural* Evolution or distinguish *Replicators* from *Interactors*.
      *   *The Terminological Question:* Validate Point 3 but warn against dismissing causal utility.

  7.  **Refining the Advice (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to impose biological orthodoxy over philosophical nuance. The user is a philosopher. The distinction between "Unit of Selection" (what gets selected) and "Unit of Evolution" (what evolves) is crucial here (Hull's distinction).
      *   *Point 1:* The user defines "Unit of Selection" via fidelity. This is the Dawkins/Hull definition.
      *   *Point 2:* The user wants organisms to be units of selection. This contradicts Pt 1 unless they change the definition.
      *   *Solution:* Suggest adopting the Replicator/Interactor distinction explicitly. This solves Pt 1 vs Pt 2.
      *   *Point 6:* Cultural evolution often relies on "cultural replicators" (memes?) or just low-fidelity transmission. If Pt 1 is strict, Pt 6 fails. If Pt 1 is relaxed for culture, Pt 1 loses universality.
      *   *Recommendation:* Treat Pt 1 as specific to *biological* adaptation, allow Pt 6 to operate on different mechanics (dual-inheritance theory).

  8.  **Final Polish:** Check tone. Ensure it answers the specific prompts (rank severity, what gives, cost, single revision, load-bearing, terminological check).

      *   *Load-bearing:* Point 1.
      *   *Single Revision:* Split "Unit of Selection" into Replicator/Interactor.
      *   *Terminological:* Point 3 is formally correct but explanatorily thin.

      *(Self-Correction on Point 3)*: The user asks if Point 3 is a dodge. I should confirm that while mathematically equivalent, the *causal models* differ. So it's not a dodge, but it's incomplete.

      *(Self-Correction on Point 4)*: Point 4 claims gene's-eye gets direction *wrong*. This is strong. If math is equivalent (Pt 3), how is direction *wrong*? It's usually a matter of *parsimony* or *invariance*. I need to highlight this tension.

      *(Final Plan)*:
      1. Validate the "middle" suspicion (3 vs 4).
      2. Identify the "Load-Bearing" flaw (1 vs 6 & 1 vs 2).
      3. Rank tensions.
      4. Propose the Replicator/Interactor fix.
      5. Address the Terminological question.

      Let's write it.cw
answer: |-
  This is a sophisticated draft. You have correctly intuited that the friction isn't distributed evenly; it is concentrated around your definition of "unit of selection" in Point 1 and how it interacts with your causal claims in Points 2, 4, and 6.

  Your suspicion about the middle (Points 3 and 4) is well-founded, but it is a symptom of a deeper structural issue in Point 1. Point 1 is doing too much work. It is acting as your metaphysical gatekeeper, but Points 2 and 6 are trying to walk through the gate wearing different shoes.

  Here is the consistency check, ranked by severity.

  ### 1. The Critical Tension: Point 1 vs. Point 6 (Severity: High)
  **The Conflict:** Point 1 establishes a necessary condition for a "genuine unit of selection": high copy-fidelity (replicators). You explicitly state genes pass and organisms fail. Point 6 asserts that cultural group selection is "genuinely doing explanatory work" *even though* "cultural transmission is nothing like as faithful as DNA copying."
  **The Problem:** If high fidelity is the *sine qua non* of selection (as Pt 1 implies), then cultural group selection is impossible or illusory by your own definition. You cannot have it both ways. Either fidelity is required for selection, or it isn't.
  **What Has to Give:** You must revise Point 1.
  **The Cost:** You lose the clean, universal "copy-fidelity test." You have to admit that "selection" is a broader category than "genetic adaptation."
  **The Fix:** Restrict Point 1 to **biological adaptation**. Acknowledge that cultural evolution operates on different transmission mechanics (dual-inheritance theory). This allows you to keep the gene's-eye view for biology (Pt 1) while granting autonomy to cultural evolution (Pt 6) without contradiction.

  ### 2. The Conceptual Tension: Point 1 vs. Point 2 (Severity: High)
  **The Conflict:** Point 1 says organisms are *not* genuine units of selection because they don't replicate faithfully. Point 2 says selection on individuals is a "real causal thing."
  **The Problem:** This is the classic Replicator vs. Interactor confusion (Hull's distinction). If organisms aren't units of selection (Pt 1), in what sense is selection *on them* real (Pt 2)? Currently, you are using "unit of selection" to mean "replicator" in Pt 1, but "unit of evolutionary causality" (interactor) in Pt 2.
  **What Has to Give:** Your terminology in Point 1.
  **The Cost:** You have to introduce a distinction you currently gloss over.
  **The Fix:** Adopt the **Replicator/Interactor** distinction explicitly.
  *   *Revision:* Genes are the primary *replicators* (units of heredity). Organisms are the primary *interactors* (units of selection efficacy).
  *   *Benefit:* This validates Point 2 (organisms are real causal units/interactors) without violating Point 1 (genes are the faithful replicators). It dissolves the "lumbering robot" problem: robots are interactors, not replicators, but they are still causally potent.

  ### 3. The Explanatory Tension: Point 3 vs. Point 4 (Severity: Medium)
  **The Conflict:** Point 3 claims Kin Selection (KS) and Multi-Level Selection (MLS) are "bookkeeping" (formally equivalent via the Price Equation). Point 4 claims that in some cases, the group level is where the "causal work happens" and the gene's-eye view gets the "direction of explanation wrong."
  **The Problem:** If two models are mathematically equivalent (Pt 3), neither can be objectively "wrong" about the facts. However, one can be misleading about the *causal structure*. Your suspicion that the middle is doing too much work is correct here: Point 3 suggests monism (it's all the same), while Point 4 argues for pluralism (one explanation is better than the other).
  **What Has to Give:** The strong "bookkeeping" language in Point 3.
  **The Cost:** You lose the clean dismissal of the KS/MLS debate as merely verbal.
  **The Fix:** Qualify Point 3. "While KS and MLS are formally equivalent, they are not **explanatorily** equivalent." (This is Samir Okasha's position). In cases like Pt 4 (cooperative breeding), the MLS model tracks the causal invariance better than the KS model. This makes Point 4 consistent with a nuanced Point 3.

  ### Load-Bearing Point
  **Point 1 is the load-bearing wall.**
  Everything else hangs on your definition of what counts as a unit. Because Point 1 defines "unit of selection" strictly via fidelity, it forces you into awkward contortions in Points 2 (organism reality) and 6 (cultural evolution).
  **The Single Revision:**
  Rewrite Point 1 to distinguish between **Units of Heredity** (Replicators) and **Units of Selection** (Interactors).
  *   *Current:* "A level is a genuine unit of selection only if... near-copied."
  *   *Revision:* "Cumulative *genetic* adaptation requires a faithful replicator (gene). However, selection acts causally on interactors (organisms/groups) which determine the replicators' fate."
  *   *Why:* This single move validates Point 2 (organisms are real interactors), saves Point 5 (group selection is rare because group *replication* is rare), and creates space for Point 6 (cultural evolution has different fidelity thresholds).

  ### The "Terminological Dodge" (Point 3)
  You asked if dismissing the KS/MLS fight as terminological is a dodge.
  **Verdict:** It is **half a diagnosis, half a dodge.**
  *   **The Diagnosis (True):** Mathematically, they are equivalent. You can translate any KS model into an MLS model and vice versa using the Price Equation. If you claim one is "true" and the other "false" regarding the *outcome*, you are wrong.
  *   **The Dodge (False):** It is not merely terminological regarding **causation**. Different partitions highlight different causal structures. If the variance is primarily between groups, an MLS explanation is causally more perspicuous (invariant under intervention) than a KS explanation, even if the math sums to the same delta.
  *   **Advice:** Keep Point 3, but add the clause: "...however, the choice of partition determines which causal relationships are visible to the modeler." This prevents you from having to retract Point 4 later.

  ### Summary of Recommended Changes
  1.  **Split Point 1:** Separate the requirement for fidelity (replicators) from the locus of causal action (interactors).
  2.  **Nuance Point 3:** Move from "it's just bookkeeping" to "it's formal equivalence but explanatory pluralism."
  3.  **Isolate Point 6:** Explicitly mark cultural evolution as a distinct domain with different fidelity constraints so it doesn't contradict your biological fidelity test.

  If you make the Replicator/Interactor distinction explicit, Points 2, 4, and 7 fall into place naturally, and Point 6 no longer threatens Point 1. The "middle" tension (3 vs 4) resolves because you can argue that while the *math* is equivalent (3), the *causal explanation* privileges the group level in specific contexts (4).
