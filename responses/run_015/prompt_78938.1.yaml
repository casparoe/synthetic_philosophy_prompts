prompt: |-
  Im in a third-year philosophy of biology course, we just wrapped the unit on genes and information, and Thursday I have to run the discussion section (like 20 min) on the question of whether DNA is really a code. The prof wants us to actually sort everyone into positions instead of the whole room saying "well it depends what you mean by information" for an hour. So I need a decision tree / taxonomy I can put on the handout.

  Please build it criteria-first. Every branch node should be a question a second-year could answer without already knowing which position it leads to, and wherever possible the node should be a concrete case rather than an abstraction. Cases I want at the nodes, use these or something like them: a lineage where a codon has been reassigned so the same triplet now gets read as a different amino acid; a mutation that changes the DNA but not the protein; a long stretch of DNA that never gets transcribed; an inherited methylation mark that changes what the offspring looks like; a synthetic genome assembled in a lab with no evolutionary history at all; and a gene that would make its protein but the cell never makes it because some other factor is missing. Also make the tree ask somewhere about the difference between "code" in the engineering sense (a systematic mapping from one set of symbols onto another, no meaning required) and "code" in the ordinary sense (symbols that are about something), because I'm pretty sure half the class is talking past each other on exactly that. And one more node somewhere on whether the DNA specifies the finished product, like a blueprint, or a sequence of operations, like a recipe.

  Each leaf should carry the position (name it if there's a standard name, otherwise just say unnamed) plus one sentence on the most awkward thing it has to swallow. I need at least these to come out the other end: DNA has genuine aboutness / semantic content; DNA is a code only in the engineering sense and "information" is something we observers assign; information just means causal specificity, i.e. this bit of DNA makes a specific difference to that particular outcome; nothing about DNA is privileged and the whole developmental system is the bearer of whatever information there is; and code/information talk is a metaphor we should drop. If the criteria force other leaves, fine, add them.

  Two extras: flag any pair of positions my tree can't actually seperate, and tell me which combinations of answers come out empty and whether that's because the combination is incoherent, unattractive, or just unexplored. Dont give me a reading list or citations, I just need the structure, and keep it to something that fits on two sides of A4.
