answer: |-
  # DISCUSSION HANDOUT: IS DNA REALLY A CODE?
  **Instructions:** Work through the four questions below in order. Your path determines your philosophical position on biological information.

  ### Q1. THE UTILITY TEST
  **Case:** Consider a **long stretch of DNA that never gets transcribed** (non-coding "junk" or regulatory regions).
  **Question:** When we label this DNA "information" or "noise," does that distinction help explain the chemistry, or does it pretend chemistry is computer science?
  *   **(A) It pretends/misleads:** The term "information" adds nothing to the biochemistry and confuses the mechanism. → **Go to Leaf 1**
  *   **(B) It helps/explains:** The term captures a real pattern in how the system organizes itself. → **Go to Q2**

  ### Q2. THE PRIVILEGE TEST
  **Case:** Consider an **inherited methylation mark** (epigenetics) OR a **gene that won't make protein because a cellular factor is missing**.
  **Question:** Is the DNA causally special compared to these other factors, or are they all equal partners in development?
  *   **(A) Equal partners:** The cytoplasm, environment, and methylation are just as "informative" as the DNA sequence. → **Go to Leaf 2**
  *   **(B) DNA is special:** DNA plays a unique role (e.g., stability, specificity) that other factors do not. → **Go to Q3**

  ### Q3. THE SEMANTICS TEST
  **Case:** Consider a **synthetic genome assembled in a lab** (no history) OR a **lineage where a codon is reassigned** (triplet reads as different amino acid).
  **Question:** Which definition of "code" fits best?
  *   **(A) Engineering Sense:** A code is just a systematic mapping (0→A, 1→B). The "meaning" is assigned by *us* (the observers) or the machinery, not inherent in the DNA. → **Go to Leaf 3**
  *   **(B) Ordinary Sense:** A code involves symbols that are *about* something (semantic content). The DNA genuinely represents the organism, independent of our interpretation. → **Go to Q4**

  ### Q4. THE MECHANISM TEST
  **Case:** Consider a **silent mutation** (DNA changes, but the protein produced is identical).
  **Question:** How does the DNA relate to the organism?
  *   **(A) Recipe:** DNA specifies a *sequence of operations* or processes to build the trait (robust to small changes). → **Go to Leaf 4**
  *   **(B) Blueprint:** DNA specifies the *final structure* or product itself (the DNA "picture" matches the organism "picture"). → **Go to Leaf 5**

  ***

  ## YOUR POSITION (LEAVES)

  **Leaf 1: Eliminativism**
  *   **Position:** Code/information talk is a metaphor we should drop.
  *   **The Awkward Pill:** You must argue that a heuristic used successfully by geneticists for 50 years is literally misleading.

  **Leaf 2: Developmental Systems Theory (DSI)**
  *   **Position:** Nothing about DNA is privileged; the whole developmental system is the bearer of information.
  *   **The Awkward Pill:** You must explain why we sequence genomes to predict traits if the genome isn't the special "book" of the organism.

  **Leaf 3: Deflationary / Instrumentalist View**
  *   **Position:** DNA is a code only in the engineering sense; "information" is something we observers assign.
  *   **The Awkward Pill:** You must accept that "biological information" would cease to exist if there were no biologists around to interpret the mapping.

  **Leaf 4: Causal Specificity View**
  *   **Position:** Information just means causal specificity (this bit of DNA makes a specific difference to that outcome).
  *   **The Awkward Pill:** You lose the intuition of "meaning" or "representation"; DNA causes the trait but doesn't necessarily *describe* it.

  **Leaf 5: Semantic View (Realism)**
  *   **Position:** DNA has genuine aboutness / semantic content.
  *   **The Awkward Pill:** You must explain how physical molecules can have "meanings" or "truth conditions" without having a mind.

  ***

  ## INSTRUCTOR NOTES: TOPOLOGY & GAPS
  *(Keep this section for your own moderation during discussion)*

  **1. Inseparable Positions**
  *   **Leaf 3 (Deflationary) & Leaf 4 (Causal Specificity):** These are notoriously difficult to separate in practice. Both deny intrinsic "meaning." The tree forces a split based on whether the student focuses on the *observer* (Leaf 3) or the *causal mechanism* (Leaf 4), but many philosophers hold a hybrid view. If a student argues for both, let them sit between the two.

  **2. Empty / Incoherent Combinations**
  *   **Eliminativism + Semantic Content:** Logically impossible. You cannot claim the term is misleading (Q1-A) while also claiming the content is real (Q3-B).
  *   **DSI + Blueprint:** Highly unstable. If DNA is not privileged (Q2-A), it cannot function as a sole "Blueprint" for the whole organism (Q4-B). If a student lands here, ask them: "If the environment is equal to DNA, whose blueprint is it?"
  *   **Synthetic Genome + Ordinary Sense:** If a student claims a synthetic genome has "aboutness" (Q3-B) *before* being placed in a cell, they are arguing for intrinsic meaning. This is a coherent but controversial position (Strong Realism).

  **3. Discussion Tip**
  *   If the group gets stuck on **Q3**, ask: "If aliens found a hard drive but had no computer to read it, does the data contain 'instructions' or just magnetic patterns?" This mirrors the Synthetic Genome case.
  *   If the group gets stuck on **Q4**, ask: "Does a cake recipe change if you swap tablespoons for grams? Does the cake change?" (Recipe = Process; Blueprint = Structure).
