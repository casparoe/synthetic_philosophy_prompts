answer: |-
  Here is a specification for a theory of valid consent. It is designed to handle the moral weight of medical procedures and the practical reality of your bouldering group without collapsing into either naive formalism or paralysing scepticism.

  ### The Desiderata

  A robust theory of consent must satisfy the following five requirements. For each, I have indicated whether it is a non-negotiable pillar of any plausible theory, or a contingent feature that varies by context.

  **1. The Competence Threshold (Non-negotiable)**
  The agent must possess the capacity to understand the nature of the decision and its consequences.
  *   **The Case:** A toddler cannot consent to surgery; a drunk adult cannot consent to sex. This is the baseline.
  *   **The Nuance:** Competence is decision-specific, not global. A person may be competent to choose a climbing route but not to waive liability for negligence.
  *   **The Trap:** Do not conflate competence with wisdom. A competent person can make a foolish choice. This handles your point (5): regret is not evidence of incompetence. If the theory invalidates consent merely because the outcome was bad, it paternalistically removes agency.

  **2. The Voluntariness Condition (Non-negotiable)**
  The agreement must be given without controlling interference or undue pressure.
  *   **The Case:** Coercion ("Your money or your life") voids consent.
  *   **The Nuance:** This must distinguish between *hard choices* and *coercion*. If the only climbing wall in town charges £10, paying isn't coercion; it's a market constraint. If the leader says "Sign this or you're banned," that is closer to coercion.
  *   **The Trap:** This is where your point (4) lives. Sunk costs (time, money, emotional investment) create pressure. A theory must decide if "I've already paid/driven here" counts as undue pressure. If it says yes, almost all commercial consent is void. If it says no, it risks ignoring how people get trapped. A good theory must draw a line between "reasons to stay" and "inability to leave."

  **3. The Material Disclosure Standard (Contingent)**
  The agent must be informed of risks that are *material* to their decision, not every possible risk.
  *   **The Case:** Your hunch is correct: "Fully informed about every detail" is a prejudice. It is impossible to list every variable in a climbing session.
  *   **The Nuance:** The standard should be "what a reasonable person would want to know" or "what this specific person has indicated they want to know."
  *   **The Trap:** If a theory demands total information, consent becomes impossible. If it demands too little, it becomes a licence for deception. The theory must define *materiality* without resorting to hindsight (i.e., "you should have known because you got hurt" is invalid).

  **4. The Scope Constraint (Non-negotiable)**
  Consent is valid only for the act or risk authorised. It does not transfer automatically to acts outside that scope.
  *   **The Case:** Consent to a blood test is not consent to organ removal.
  *   **The Nuance:** This is the battleground for your point (1) and (2). Can you consent to "whatever the leader decides"? This is a transfer of *authority*, not consent to specific acts. A theory must explain if and when authority can be transferred.
  *   **The Trap:** If the theory says consent must be act-specific, your seasonal form is worthless. If it says authority can be fully transferred, "drift" becomes impossible to challenge.

  **5. The Epistemic Accessibility Condition (Contingent)**
  The consent must be manifest in a way that the recipient can reasonably verify.
  *   **The Case:** You (the organiser) cannot read minds. You need a signal (a signature, a verbal "yes").
  *   **The Nuance:** This is a requirement for *reliance*, not necessarily for *moral validity*. A person might internally consent but never show it; morally they might be fine, but you cannot act on it.
  *   **The Trap:** This addresses your point (6). It is not a moral desideratum for the *consenter*, but it is a practical desideratum for the *organiser*. A theory that ignores this is useless for practice; a theory that prioritises it over internal validity is legalistic tyranny.

  ---

  ### The Incompatibility: Where the Theory Breaks

  There is a fundamental tension between **The Scope Constraint** and **The Epistemic Accessibility Condition**.

  *   **The Conflict:** To be morally valid (Scope), consent must track the activity as it changes (handling *Drift*). To be practically usable (Accessibility), consent must be captured statically in advance (the *Form*).
  *   **The Problem:** If you prioritise Scope, your seasonal form is invalid the moment the session deviates from the "reasonable expectation" of the season start. If you prioritise Accessibility, you validate the form even if *Drift* occurs, potentially violating the consenter's actual will.
  *   **The Finding:** A perfect theory cannot satisfy both fully. It must trade off. In high-stakes contexts (surgery), Scope wins (you must re-consent if the procedure changes). In low-stakes cooperative contexts (bouldering), Accessibility wins (you rely on the blanket authority). A theory that claims to solve this without admitting the trade-off is lying.

  ---

  ### Handling Your Six Stuck Points

  1.  **Blanket/Up-front Consent:** This is permissible only under the **Authority Transfer** model. The form is not consent to *risks*; it is consent to the *leader's judgement*. It is valid only if the leader's judgement remains within the community's reasonable expectations of safety.
  2.  **Drift:** This is not deception; it is a **Scope Violation**. If the activity drifts so far that it no longer falls under the authority granted, consent lapses. It is distinct from deception because no lie need be told; the context simply shifted.
  3.  **Borrowed Consent:** Generally invalid. Competence is non-transferable. Unless there is a specific prior agreement (e.g., "Ask my partner"), a third party cannot validate your consent. This protects against social pressure ("Everyone else is fine with it").
  4.  **Sunk Cost Consent:** This falls under **Voluntariness**. If the cost of leaving is disproportionately high compared to the risk of staying, voluntariness is compromised. However, mere inconvenience does not void consent. The theory must distinguish between "I don't want to lose my £20" (valid pressure) and "If I leave, I will be stranded without transport" (potentially coercive).
  5.  **Competent Regret:** Irrelevant to validity. **Competence** is about capacity at the time of decision. Regret is an emotional outcome. A theory that invalidates consent based on regret destroys the concept of risk-taking.
  6.  **External Observability:** This is a **Practical Desideratum**, not a Moral one. Morally, what matters is your internal state. Practically, what matters is my reasonable belief about your state. You are not smuggling in a legal worry; you are identifying the gap between *moral permission* and *actionable reliance*.

  ---

  ### Dual Purpose: Morality vs. The Form

  You asked for a theory that works for ordinary life *and* signed forms. These pull in opposite directions.

  *   **Ordinary Life:** Prioritises **Voluntariness** and **Scope**. It is dynamic. If we are hiking and the weather turns, my earlier "yes" to the hike doesn't cover "yes" to the storm. We check in.
  *   **Signed Forms:** Prioritise **Accessibility** and **Authority**. They are static. They exist to protect the organiser from liability when dynamic checking is impossible.

  **The Divergence:** A form can be *legally* sufficient (meeting Accessibility) but *morally* insufficient (violating Scope via Drift). A good theory must admit this. It should tell you: "This form protects you from a lawsuit, but it does not necessarily make you morally blameless if you push the group into danger they didn't anticipate." Do not use the form to absolve moral responsibility; use it only to manage legal risk.

  ---

  ### Scorecard of General Pictures

  *   **Contractualism (Consent as a Promise):** Fails on **Drift**. It treats consent as binding regardless of changing circumstances. Too rigid for safety-critical activities.
  *   **Subjectivism (Consent as a Mental State):** Fails on **Observability**. You cannot run a group based on what you think people are thinking. Too vague for organisation.
  *   **Conventionalism (Consent as Social Norms):** Best fit. It says consent is valid if it matches what is reasonably understood in that context (e.g., "Signing this form means you trust the leader's safety calls"). It balances Scope and Accessibility by relying on community standards.

  ---

  ### The Hardest Requirement

  While Competence is the gatekeeper, and Information is the most debated, the requirement that does the most work knocking candidate theories out is **The Voluntariness Condition**.

  Most simplistic theories fail here. They assume that if no one held a gun to your head, you were voluntary. They cannot handle **Sunk Costs**, **Social Pressure**, or **Structural Coercion** (e.g., "Sign or don't climb"). A theory that cannot distinguish between a hard choice and a controlled choice cannot distinguish between valid consent and submission. It is the most philosophically expensive requirement to satisfy because it demands an account of freedom, not just agreement.

  Verdict: The Voluntariness Condition.
