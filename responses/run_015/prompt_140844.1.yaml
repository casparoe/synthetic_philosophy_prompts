      *   **Rule 2: The "Retrospective Closure" Rule.** A period must be concluded or structurally stable enough that its boundaries are visible from the outside; you cannot name a period you are currently inhabiting.
      *   **Rule 3: The "Positive Definition" Rule.** A period must be defined by what exists within it, not by what came before or after (no "Dark Ages" logic).

      *   *Wait, looking closer at the "Medieval Mediterranean" acceptance.* Why is that okay? It's 1000-1300. It's a specific regional system. It implies **Specific Interaction Spheres** matter.
      *   *Looking at "Cold War" acceptance.* It's political/ideological, but "everyone alive knew which side they were on." So ideas count *if* they dictate material reality (nuclear threat, borders).

      *   *Revised Rule Set:*
