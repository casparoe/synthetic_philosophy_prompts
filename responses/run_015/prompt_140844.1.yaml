      *   *Bronze Age:* Defined by material/tech, but boundaries are fuzzy.
      *   *Best Probe:* **The Little Ice Age (c. 1300-1850).**
          *   Why? It parallels the Anthropocene (climate-driven) but is *closed* (it ended). It affected ordinary life (famine, migration) unlike the Renaissance. It was noticed by contemporaries (paintings of frozen canals, records of harvests).
          *   If she accepts Little Ice Age: She cares about Material + Closure, but Witness is flexible.
