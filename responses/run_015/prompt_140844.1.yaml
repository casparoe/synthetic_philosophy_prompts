  7.  **Selecting the Best Probe:**
      *   User suggests: Neolithic, Bronze Age, Little Ice Age.
      *   *Neolithic:* Changed everything materially, but no contemporary witness, very long, ongoing effects. Good for testing "Material vs. Witness."
