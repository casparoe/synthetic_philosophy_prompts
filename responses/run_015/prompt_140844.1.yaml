      *   *Refining the "True Rule":* It's not just one. It's a hierarchy.
          1.  **Material Consequence** (Must change life/death/work).
          2.  **Contemporary Legibility** (People must know it happened).
          3.  **Historical Closure** (Must be over or structurally static).
          *   *Anthropocene fails #2 and #3.*

      *   *Refining the Probe:* The **Little Ice Age** is the strongest probe. It tests the "Environment as History" angle without the "Ongoing" problem.
      *   *Refining the Frame:* Don't call it Anthropocene. Call it **"The Great Acceleration"** and treat it as a closed period (1950-2000). Or link it to the **Industrial Revolution** but focus on the *consequence* phase. Actually, the teacher likes "Industrial Revolution." If I frame Anthropocene as "The Environmental Consequence of Industry," she might say "That's just part of the Industrial Revolution."
      *   *Winning Frame:* **"The Orbis Interval (1600-1750)."** Based on the 1610 CO2 dip. It's closed. It links to 1492 (which she likes). It's material (climate/agriculture). It tests if she accepts environmental data as "ordinary life" change.

      *   *Wait, let's look at the "Information Age" rejection again.* "From inside it you cannot tell a turning point from a fad." This is the killer for Anthropocene.
