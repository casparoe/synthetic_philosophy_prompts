      *   *Refining the Rule:* It seems to be a combination of **Material Consequence**, **Contemporary Recognizability**, and **Retrospective Closure**.
      *   *Key Differentiator:* The "Information Age" rejection is crucial. It implies the period must be *historically closed* or at least structurally stable enough to be defined. The "Middle Ages" rejection implies the label must be positive (what it *is*), not negative (what it *is not*). The "1543/Renaissance" rejections imply ideas don't count without material infrastructure.

