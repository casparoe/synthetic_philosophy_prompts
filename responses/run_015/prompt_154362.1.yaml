      *   **Political Utility:** The Convention. Why Stoddard? Because he fits the narrative of "Statehood." Wayne doesn't. History is selected for utility.
      *   **The Burning:** The climax of the thesis. The notes are destroyed. Verification is physically impossible now. The institution has spoken.
      *   **The Resistance (The Honest Part):** The flashback. Ford implicates the audience. We know the truth. Stoddard suffers. Truth has moral weight, even if it lacks institutional power.
      *   **The Ancient Parallels:** Does this help us understand Arthur or Moses? Yes. It shows that the *function* of the legend is state-building. The lack of evidence in ancient times might just be the "burned notes" of time.
      *   **Conclusion:** Summarize. The line isn't about what happened; it's about what we agree to remember.

  7.  **Refining the Tone:**
      *   Avoid academic jargon where possible. Keep it flowing like a magazine essay (e.g., *The Atlantic*, *Harper's*).
      *   Ensure American English spelling/idioms.
