  2.  **Deconstruct the Thesis vs. The Film:**
      *   *My Thesis:* History = Institutional vetting. Legend = Unvetted narrative accepted by community.
      *   *The Film's Plot:* Ransom Stoddard (Jimmy Stewart) didn't shoot Valance. Tom Doniphon (John Wayne) did. Stoddard gets the credit. The newspaper editor knows the truth but burns the notes.
      *   *Alignment:* The editor's choice ("Print the legend") explicitly prioritizes social utility/myth over factual accuracy. This supports the "institutional" view—the institution (press/politics) decides what counts as the public record.
      *   *Resistance:* The film *shows* us the truth via flashback. We, the audience, are given the "history." The film itself acts as the corrective mechanism the community in the film lacks. Does this imply truth *matters* ultimately?

  3.  **Scene-by-Scene Analysis (Drafting mental notes):**
      *   *Schoolroom/Newspaper:* The press is the institution. The schoolroom represents the civilizing force (law/education). They are linked. The newspaper is the gatekeeper of "fact."
      *   *The Shooting:* The ontological truth. Dark alley, two guns. Wayne fires. Stewart holds the gun but doesn't fire. This is the "raw event."
      *   *Territorial Convention:* The political institution. They need a hero. Stoddard represents "progress" (law), Wayne represents "wilderness" (force). The institution selects the narrative that serves its future.
      *   *Editor Destroying Notes:* The crucial moment. The institutional gatekeeper actively suppresses the verification process. He chooses the social function over the factual record.
      *   *The Funeral:* Wayne dies in obscurity. Stoddard is a statesman. The community honors the legend. The institutional outcome is solidified.
      *   *The Train:* Stoddard returns. He admits the truth to the reporter (too late). The legend remains the public face.

  4.  **Addressing the "Honest Part" (The Film's Resistance):**
      *   The film gives us the flashback. Ford doesn't let *us* be fooled.
      *   This suggests a moral weight to the truth. Stoddard lives with guilt ("I'm no hero").
      *   If truth didn't matter, Stoddard's conscience wouldn't matter.
      *   *Counter-argument:* The film shows that *public* history is institutional, even if *private* memory is truth-conditional. The tragedy is the gap between them.

  5.  **Addressing the Ancient Legends (Troy, Arthur, Exodus):**
      *   Does Shinbone illuminate Troy?
