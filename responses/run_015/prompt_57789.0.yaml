      *   *Check:* Did I cover all four criteria? Yes. Did I assess which is firmer? Yes. Did I show where parallels break? Yes.

  11. **Final Polish:** Ensure the distinction between "Ontological Realism" (Do the things exist?) and "Moral Realism" (Do the consequences matter?) is clear, as this is the crux of the engineer's confusion. The engineer is conflating "physical substrate" with "functional reality."

  *(Self-Correction during drafting)*: I need to be careful not to say virtual items are "physical." They are digital. The question is whether "digital" counts as "real." I should emphasize *Functional Realism*.
  Also, for the Harm debate, distinguish between "in-game mechanic" (PvP) and "harassment" (targeted distress). The prompt specifies "coordinated group... persistent distress," which leans toward harassment, not standard gameplay.

