  ### 1. Decision Rules and Application to Vellum

  Based on the seven split precedents, the Board's behavior is consistent with a **Conjunction Rule**: a change ships if and only if there is a majority for the bottom line (**S**) *and* a majority for the Charter Condition (**CC**). The Board treats **S** and **CC** as independent veto gates; **S** is not merely a derivative of the findings (evidenced by *Gorse*, where **S** passed but the change was held), nor does **CC** override **S** (evidenced by *Dogwood* and *Fig*, where **CC** passed but the change was held).

  The ambiguity lies in how the **Charter Condition** is aggregated. Two rules fit the seven precedents perfectly:

  *   **Rule A (Conclusion-Based / Ballot-Wise):** Ship if (Majority **S** = Yes) AND (Majority of *individual ballots* satisfy the Charter Condition = Yes).
  *   **Rule B (Premise-Based / Proposition-Wise):** Ship if (Majority **S** = Yes) AND (Majorities on *individual findings* satisfy the Charter Condition = Yes).

  **Application to Vellum:**
  *   **Tallies:** **I** (5–0), **R** (2–3), **F** (2–3), **S** (4–1).
