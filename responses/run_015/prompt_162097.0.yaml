  The minutes' consistent phrasing ("condition comes out true on X ballots") indicates they view the Charter compliance as a property of the member's holistic judgment, not a mechanical aggregation of fields. In Vellum, 4 out of 5 members have submitted ballots that are internally compliant with the Charter. To Hold would be to invalidate the judgment of those four members based on a global tally they did not vote on directly.

