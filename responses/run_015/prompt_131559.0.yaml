  Maya was fifteen for the first cut. The seizures stopped. She told her mother, "I feel fine." Her mother said she looked the same.

  By the second surgery, sixteen, the lag started. She'd reach for a door handle with her right hand, and her left would beat it there. She'd say, "I got it," but her voice sounded like it was coming from down a hall.

  The third operation happened over winter break. She started writing in her diary again.
  *January 4:* I hate the snow. I want to go to Florida.
  *January 4:* I love the snow. I want to stay here.
  Same pen. Same book. The handwriting slanted differently on the second line, sharper, angrier. She read both lines and felt a hum in her skull, like a wire vibrating. She didn't cross either out. She closed the book. "I'm just indecisive," she told her friend Chloe. Chloe believed her. Everyone still said she was Maya.

  Fourth surgery, junior spring. The cafeteria incident. Her right hand pushed the tray away—she hated meatloaf. Her left hand picked up the fork and took a bite. She chewed while staring at the wall. She didn't taste it, but she swallowed. "I'm not hungry," she said to the table, while her left hand took another bite. Nobody laughed. They just stopped inviting her to sit there as often.

  Fifth surgery. Senior year. The silence was absolute.
  She sat for the SATs. Her right hand bubbled in C's. Her left hand tapped a rhythm on the desk, four beats, pause, four beats. Her right hand wanted to finish. Her left hand wanted to stop. They compromised. She finished the test. She walked out. She said, "I did my best."

  That night, Chloe slept over. They sat on the floor of Maya's bedroom. The posters on the wall were peeling.
  "May," Chloe said. She was looking at Maya's hands. They were resting on her lap. The left one was clenched; the right one was open. "We did the split brain unit in psych last week. Sperry. Gazzaniga."
  Maya nodded. "I remember."
  "Be honest," Chloe said. "After all five... are you one? Or two?"
  Maya looked at the mirror across the room. Her reflection looked back.
  "I am the one speaking," Maya said.
  "But are you?"
  "I am the one speaking," she repeated. It was true. It didn't mean anything.
  Chloe sighed. "Your parents were arguing downstairs. About the room. If... if something happened. Who stays?"
  Maya stood up. She walked to the closet. Her right hand opened the door. Her left hand reached for a hoodie she never wore, the green one her mom hated. She put it on.
  "I sleep here," Maya said.
  "But if there's another—"
  "I sleep here."

  She went to the mirror. She raised her right hand to touch the glass. Her left hand stayed at her side. She watched the reflection raise its right hand.
  "Maya?" her mom called from downstairs. "Dinner."
  "Coming," Maya said.
  She didn't know which feet moved first. She just went.
  At the table, her dad asked, "How was study hall?"
  "Fine," she said.
  Her left hand picked up a fork. Her right hand picked up a knife. They worked together to cut the steak. Perfectly coordinated.
  She ate. She was hungry.
  Or maybe she was just full.
