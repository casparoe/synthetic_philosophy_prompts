          *   *Principled?* Risk of gerrymandering.

      *   *Tension 2 ((3) vs (5b)):*
          *   *Fix:* Modify (3). Intervention warrants existence *only if* the causal story is roughly right. Or modify (5b) to admit reference is partial.
          *   *Cost:* (3) loses its "theory-independent" punch. Becomes closer to structural realism.
          *   *Repair:* Subdivision of "intervention." Distinguish "blind manipulation" vs "causal manipulation."
          *   *Principled?* Principled (Hacking vs. Cartwright debates).

      *   *Tension 3 ((1) vs (4)):*
          *   *Fix:* Soften (1). Allow accommodation to count *if* it involves risky tests.
          *   *Cost:* (1) loses its strict "novelty only" constraint.
          *   *Repair:* Subdivision of "accommodation."
          *   *Principled?* Yes (use-novelty).

  6.  **Test Cases:**

