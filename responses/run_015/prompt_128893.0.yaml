      *   *However:* (3) says intervention warrants existence. Mid-century biologists could intervene (breeding). So (3) says Gene exists. (7) says we are right about existence. So Gene = Exists. (5) says for most central posits, reference is lost. Gene must be in the minority cell (a) or (c).
      *   *Verdict:* Gene exists, nature wrong. Ether doesn't exist.

  7.  **Flag Idle Theses:**
      *   (6) Unconceived Alternatives. Does it do work? It supports the "Realism" verdict in (7) by blocking a specific anti-realist attack. But if (1) restricts evidence to novel prediction, (6) is just reinforcing (1). It might be redundant if (1) is strong enough.
      *   (4) PI doesn't generalize. This overlaps heavily with (5). (5) is a more granular version of (4). (4) might be doing less work if (5) is present.

