      *   (2) *Pessimistic Induction (PI):* Real force against *constitutive claims* (nature/mechanism of posits).
      *   (3) *Existential Claims:* PI doesn't touch these. Existence warranted by *instrumental intervention* (Hacking-style "if you can spray them, they are real"), independent of theory truth.
      *   (4) *PI Scope:* PI doesn't generalize fully. Working posits are retained; idle machinery is dropped. Restrict count to working posits -> history looks better.
      *   (5) *Refinement on Abandonment:* Three fates for posits: (a) Reference retained, theory discarded; (b) Reference lost, math/methods retained; (c) Both retained. Claim: (b) is the largest cell (driving PI). (a) and (b) indistinguishable from the inside.
      *   (6) *Unconceived Alternatives:* Unmoved. Novel success constrains space of rivals; bare possibility isn't a reason to doubt.
      *   (7) *Verdict:* Future judgment = Right on existence, wrong on nature. Call this "Realism."

  3.  **Identify Tensions (Brainstorming & Pairing):**

      *   *(1) vs. (3):* (1) says only novel prediction warrants truth (theory). (3) says instrumental intervention warrants existence (posit) *independent* of theory truth.
          *   *Tension:* If (1) restricts epistemic warrant to novel prediction, how does (3) grant ontological warrant via intervention without relying on the theory's truth? Usually, intervention relies on theoretical understanding of the instrument. If the theory is false (per 2 & 7), does the intervention still warrant existence? Hacking says yes, but (1) seems to block the epistemic route to *any* truth-like status except via novel prediction.
          *   *Severity:* High. This is the core epistemic/ontological split.

      *   *(1) vs. (4):* (1) says accommodation/consilience are evidentially inert. (4) says posits doing work in derivations (which often involve accommodating known data or unifying domains) are retained.
          *   *Tension:* If accommodation is inert (1), how do we identify the "working posits" in (4)? Usually, "working" means contributing to success. If accommodation isn't success evidence, what defines "working"?
          *   *Severity:* Medium. Depends on definition of "work."

      *   *(2) vs. (3):* (2) says PI kills constitutive claims (nature/mechanism). (3) says existence is safe via intervention.
          *   *Tension:* Can you separate existence from nature so cleanly? If we are wrong about *what* it is (2), in what sense does *it* exist (3)?
          *   *Severity:* Medium-Low. This is a standard Entity Realism move. Coherent if "existence" is thin.

      *   *(4) vs. (5):* (4) says working posits are retained (history looks good). (5) says the largest cell is (b) Reference lost, math/methods retained.
          *   *Tension:* (4) implies structural/positional continuity ("posits... retained"). (5b) says reference is lost (non-existence of the posit *as described*), even if math stays. If reference is lost, was the posit retained? (4) says "posits... are retained." (5b) says "term turns out to refer to nothing."
