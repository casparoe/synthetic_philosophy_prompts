          *   *Commitment:* Genes exist (due to intervention/continuity), but our mid-century description is largely wrong.
          *   *Happy?* Yes, fits (7).

      *   *Wait, check Tension 1 on Gene:* If (5) says (b) is the *largest* cell, I must commit to the Gene being more likely (5b) than (5a). If I say Gene is (5a) (Reference retained), I am contradicting my statistical claim in (5).
