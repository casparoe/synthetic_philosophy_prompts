      *   *(5) vs. (7):* (5) says (b) [Reference lost] is the largest cell. (7) says we will be right about *existence* of central posits.
          *   *Tension:* If (5b) is the largest cell, then for most posits, reference is lost. If reference is lost, they don't exist. But (7) claims we are right about existence of *central* posits.
          *   *Resolution:* (7) specifies "central posits." (5) specifies "one of its central posits." Wait, (5) says "When a theory is abandoned, three things can happen to one of its central posits... (b) is the largest cell." If (b) is the largest cell for central posits, then most central posits fail to refer. (7) says we are right about existence of central posits.
          *   *Severity:* Critical. (5) says most central posits turn out to be non-referring (b). (7) says we are right about existence of central posits. These contradict unless "existence" in (7) means something different than "reference" in (5).

      *   *(1) vs. (6):* (1) restricts evidence to novel prediction. (6) uses novel prediction to rule out unconceived alternatives.
          *   *Tension:* None. They align well.

      *   *(3) vs. (5):* (3) says intervention warrants existence. (5b) says reference lost (non-existence) despite math/methods retained.
          *   *Tension:* If methods are retained (5b), presumably experimental interventions are retained. If interventions warrant existence (3), why does reference fail (5b)?
          *   *Severity:* High. (3) protects existence via method; (5b) sacrifices existence despite method.

  4.  **Select and Order Genuine Tensions:**

      *   *Tension 1 (Critical):* (5) vs. (7). (5) claims the majority outcome for central posits is reference failure (5b). (7) claims we will be right about the existence of central posits. You can't be right about existence if reference fails.
      *   *Tension 2 (High):* (3) vs. (5b). (3) claims experimental usage/intervention warrants existence. (5b) claims experimental usage/methods can persist while reference fails. If (3) is true, (5b) shouldn't happen for posits we can intervene on.
      *   *Tension 3 (Medium):* (1) vs. (4). (1) dismisses accommodation/consilience as evidentially inert. (4) relies on "posits doing the work in derivations" being retained. Derivations often accommodate. If accommodation is inert, is the "work" evidentially significant?

  5.  **Develop Repairs/Costs:**

      *   *Tension 1 ((5) vs (7)):*
