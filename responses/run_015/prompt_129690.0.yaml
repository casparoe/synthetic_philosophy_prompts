answer: |-
  ### 1. Conceptual Brainstorming and Boundary Drawing

  Before identifying or coining the term, we must clear the conceptual field by distinguishing the pattern you described from its nearest neighbors in argumentation theory and political philosophy.

  *   **Equivocation:**
      *   *Definition:* The fallacious use of a term in two different senses within a single argument to derive a false conclusion.
      *   *Distinction:* Equivocation is typically a localized logical error within a single syllogism. The pattern you describe is not a slip within a single inference, but a **stable structural duality** sustained across a dialogue. Both sides rely on the duality to maintain the debate; it is a feature of the discourse ecosystem, not a bug in a single proof.
  *   **Motte-and-Bailey Doctrine:**
      *   *Definition:* A arguer retreats to a modest, defensible claim (the Motte) when challenged, then re-expands to a controversial claim (the Bailey) when pressure subsides.
      *   *Distinction:* As you noted, the "historical commitment" defense is not necessarily a "safe" or indisputable core (it is historically contentious). Furthermore, Motte-and-Bailey is typically a unilateral strategy by one agent. Your pattern is **dyadic**: the Critic and Defender are locked into *different* logical structures simultaneously, creating a stalemate rather than a tactical retreat.
  *   **Strategic Essentialism (Spivak):**
      *   *Definition:* A minority group temporarily adopting an essentialist identity for political mobilization, knowing the essence is constructed.
      *   *Distinction:* Strategic essentialism is usually a conscious, offensive coalition-building tactic. The pattern you describe is often **defensive** and involves a confusion (or convenient blurring) between *descriptive history* and *normative authority*. The defender often genuinely believes the historical narrative, whereas strategic essentialism implies a cynical awareness of the construction.
  *   **No True Scotsman:**
      *   *Definition:* Modifying the criteria of a category to exclude counter-examples (e.g., "No *true* Westerner violates rights").
      *   *Distinction:* The defender in your scenario explicitly *admits* the violations ("however imperfectly"). They do not exclude the violators from the category; they shift the definition from *outcome* (practices existing) to *commitment* (historical adoption). This is a shift in **criteria type**, not membership exclusion.
  *   **Ordinary Polysemy:**
      *   *Definition:* A word having multiple related meanings (e.g., "bank" of a river vs. "bank" for money).
      *   *Distinction:* Polysemy is a linguistic fact. The phenomenon you describe is a **rhetorical exploitation** of that fact. It is not merely that the word has two meanings, but that the *normative force* of the term depends on the *exclusivity* of one meaning while the *descriptive defense* relies on the *inclusivity* of the other.
  *   **The Is-Ought Problem (Hume):**
      *   *Definition:* The logical gap between descriptive statements (what is) and prescriptive statements (what ought to be).
      *   *Distinction:* This is the *logical core* of the error, but it does not capture the **sociological and geographic dimension**. The pattern involves a specific claim about *identity* and *provenance* (Western vs. Non-Western) that a standard Is-Ought analysis misses.

  ### 2. Assessment of Existing Terminology

  There is no single, canonical term in philosophy of language or argumentation theory that captures this specific configuration.

  The closest parent concept is W.B. Gallie's **"Essentially Contested Concept" (ECC)**. "Western values" fits the criteria of an ECC: it is evaluative, internally complex, and open to modification in light of changing circumstances. Gallie explains *why* the debate persists (because the concept is inherently disputable).

  However, Gallie's framework does not account for the specific **choreography of the stalemate** you identified. It does not explain the specific *mechanism* by which the descriptive claim (genealogy) is leveraged to support a normative claim (authority) while simultaneously denying the exclusivity required for that authority. The ECC framework describes the *state* of disagreement, but not the *structural duality* that sustains it.

  Therefore, to capture the precise logical topology you have outlined, a new term is required.

  ### 3. Proposed Term: The Normative-Genealogical Conflation

  I propose naming this phenomenon **The Normative-Genealogical Conflation (NGC)**.

  #### Definition
  **The Normative-Genealogical Conflation** is a rhetorical and argumentative structure in which a single signifier (e.g., "Western Values") is sustained by two distinct logical registers that are treated as interchangeable during debate, despite bearing incompatible logical loads.
  1.  **The Genealogical Register:** A descriptive-historical claim that a set of practices or ideals originated within or were adopted by a specific group (provenance).
  2.  **The Normative Register:** A prescriptive-identity claim that these practices constitute the authoritative ethical boundary of that group (ownership/authority).

  The Conflation occurs when the **defensibility** of the Genealogical Register (we can show these things happened here) is used to shield the concept from criticism, while the **authority** of the Normative Register (we must defend *our* values) is invoked to motivate action, even though the Normative Register logically requires a degree of exclusivity or distinctiveness that the Genealogical Register explicitly denies.

  #### Mapping the Pattern
  Here is how the NGC maps onto your "Western values" example:

  *   **The Signifier:** "Western Values."
  *   **The Defender's Move (Genealogical Shield):** When challenged on exclusivity ("Others have rights too"), the Defender retreats to the Genealogical Register ("We don't claim uniqueness, just historical adoption"). This neutralizes the Critic's empirical counter-examples.
  *   **The Defender's Move (Normative Sword):** When mobilizing support ("Defend the West"), the Defender switches to the Normative Register. This implies a special obligation or distinct identity that the Genealogical Register cannot support (if everyone has these values, why is defending *Western* values distinct from defending *human* values?).
  *   **The Critic's Trap:** The Critic remains fixed on the Normative Register's implication of exclusivity ("If it's Western, it must be unique to the West"). They attack the Genealogical claims as if they were claims of ownership.
  *   **The Stall:** The debate stalls because the Signifier is doing double duty. It functions as a **historical inventory** (which allows for overlap) and an **identity boundary** (which requires distinction) simultaneously.

  ### 4. Delineating Boundary Cases

  To ensure precision, we must distinguish the NGC from similar phenomena where the label would not apply.

  **A. NGC vs. Ordinary Polysemy**
  *   *Polysemy:* The word "light" can mean "not heavy" or "illumination." Context usually clarifies which is meant. There is no normative stake in confusing them.
  *   *NGC:* The ambiguity is **functional**. The normative weight *depends* on the confusion. If the distinction were clarified, the rhetorical power would collapse. If the Defender admits, "These are universal values we just happen to have history with," the call to "Defend Western Values" loses its particularist urgency. If they admit, "These values are unique to us," they become vulnerable to empirical refutation. The NGC requires the ambiguity to remain unresolved to function.

  **B. NGC vs. Strategic Essentialism**
  *   *Strategic Essentialism:* A group knowingly simplifies its identity to achieve a political goal (e.g., "We are all Workers"). The essentialism is acknowledged as a tool.
  *   *NGC:* The conflation is often **unacknowledged** or structurally embedded. The Defender may not realize they are shifting registers. Furthermore, Strategic Essentialism is usually about *internal* cohesion. NGC is about *external* boundary maintenance against a Critic. In NGC, the "essence" is denied when pressed (it's not essential, just historical) but assumed when acted upon.

  **C. NGC vs. Value Revision (Moving the Goalposts)**
  *   *Value Revision:* A group changes its values over time (e.g., "We used to value empire, now we value self-determination"). This is diachronic change.
  *   *NGC:* This is a **synchronic** structural duality. At the *same moment* in the debate, the term is carrying two different logical loads. It is not that the values changed; it is that the *definition of the category* is bifurcated to survive criticism.

  **D. NGC vs. The Motte-and-Bailey**
  *   *Motte-and-Bailey:* Requires a **hierarchy of defensibility**. The Motte is easy to defend; the Bailey is hard.
  *   *NGC:* The two registers are **co-equal in contentiousness**. The Genealogical claim ("The West historically adopted secular law") is historically debatable. The Normative claim ("We must defend this") is ethically debatable. Neither is a "safe house" for the other. They are mutually supporting pillars holding up the same roof. The NGC is a **structural arch**, not a retreat fortification.

  ### 5. Philosophical Implications

  The **Normative-Genealogical Conflation** identifies a specific failure mode in political identity discourse. It reveals how groups attempt to secure **universal normative authority** (these values are good for everyone) while retaining **particularist ownership** (these are *our* values).

  *   **Where it fits:** It explains the "Western Values" debate, but also applies to debates over "Islamic Democracy," "Asian Values," or even corporate culture ("This is how *we* do things").
  *   **Where it falls short:** It does not explain *why* a group chooses specific values (that is a question of ideology or material interest). It only explains the *argumentative structure* used to defend the categorization of those values.

  By naming this **The Normative-Genealogical Conflation**, we can diagnose the stalemate not as a failure of communication, but as a structural feature of the concept itself. The debate stalls because the term is designed to stall: it allows the Defender to claim the moral high ground of universalism (rights are good) while retaining the tribal cohesion of particularism (defend *our* way), without ever having to reconcile the contradiction between the two.
