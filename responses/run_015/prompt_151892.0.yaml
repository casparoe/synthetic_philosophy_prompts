  2.  **Deconstruct Russell's *On Denoting* (1905):**
      *   **Core Thesis:** Denoting phrases (e.g., "the present King of France") do not have meaning in isolation; they are incomplete symbols. The meaning arises only in the context of a proposition.
      *   **Truth Conditions:** "The F is G" is true iff there exists exactly one F, and that F is G. If there is no F, the proposition is *false*, not meaningless. (This is the crucial distinction from Meinong or Strawson).
      *   **Acquaintance:** We can only be acquainted with sense-data and universals. We denote things we aren't acquainted with (like Bismarck or the King of France) via descriptions.
      *   **The "Speaker" Issue:** Russell was concerned with logic and truth, not primarily pragmatics or speech act theory (which came later with Austin/Grice). However, he cared about *propositions* as the bearers of truth and falsehood. A sentence expresses a proposition. Who utters it matters less than the logical form, *but* the psychological state of belief was relevant to his later epistemology. In 1905, he was very focused on the logical analysis of the sentence itself.

  3.  **Analyze the Three Cases:**

