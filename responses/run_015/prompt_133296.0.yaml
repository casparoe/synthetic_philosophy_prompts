prompt: |-
  ok so here's roughly where i've landed on survival and personal identity, want a consistency check before i present it at the reading group. i hold:

  (1) psychological continuity with any cause is what matters, not bodily identity or spatiotemporal continuity of the body.
  (2) the teletransporter is survival, not death-plus-replica; the scanner destroys but the pattern carries on.
  (3) in a branching case with two copies on mars, both survive me but neither is identical to me — there's no hidden "real" me.
  (4) there's a substrate-lock condition: for continuity to be genuine, the recieveing substrate has to preserve the same physical kind at the relevant level (carbon-based neural architecture, not silicon emulation), otherwise it's just functional mimicry.
  (5) closest-continuer views are wrong because they smuggle bodily proximity back in.
  (6) gradual ship-of-theseus neuron replacement is fine since substrate-lock is maintained continuously.
  (7) but if the teletransporter scans my carbon brain and builds a silicon brain on mars with perfect functional equivalence, that's still me, because the informational pattern is what carries survival.
  (8) i also think adding a "careenium" metric — some hypothetical substrate-independent coherence measure — wouldn't change any verdicts, but i can't see how that squares with (4).

  go through these and tell me which pairs are in actual tension and how badly. for each one rank them by severity, say what'd have to give, and what's the cheapest revision. also point out any pair that only looks tense but dissolves once you look closer — don't flag everything. and please don't tell me to go re-read reasons and persons, i need the audit on my specific package not a bibliography.
