answer: |-
  The use of the randomizing device is not a loophole but the uniquely rational solution, because rationality requires choosing the optimal decision procedure rather than merely selecting from a restricted menu of deterministic acts.

  Let us first make the arithmetic precise, as this clarifies why the standard verdict is mathematically inferior. You have assigned survival a value of 1,000 units, death 0, and the fare 1. If you adopt a pure strategy—either "Stay" or "Go"—the simulation predicts this with certainty, Death matches your location, and your utility is 0 (dead) minus any fare paid. Staying yields 0; going yields -1. Your friends recommend staying to save the fare, which is rational only if death is certain. However, if you adopt the mixed strategy "Flip the box; go on heads, stay on tails," the simulation knows you will adopt this strategy but cannot predict the box's outcome. The simulated box and real box are independent. Death goes to the simulated city; you go to the real city. The probability of a match is 0.5. Your expected utility is now (0.5 × 1,000) + (0.5 × 0) − (0.5 × 1) = 499.5. Comparing 499.5 to 0, the randomizing policy dominates the pure acts by a massive margin. To reject this is to claim that 499.5 is less than 0, which is untenable.

  Your friends' first objection is that you have changed the subject by altering the stipulation of Death's predictive power. They argue that if Death predicts perfectly, he predicts the coin toss. This conflates two different models of prediction: mystic omniscience versus physical simulation. In the mystic version, Death knows the future fact of your location directly; in that case, randomization is indeed impossible because the future is fixed. But your version specifies a mechanism: a simulation of *you*. A simulation of you contains a simulation of the box, but the physical box in your hand relies on radioactive decay, which is causally independent of the simulation's internal state. By introducing the box, you are not changing the rule that Death predicts *you*; you are changing *what you are*. You are no longer a deterministic algorithm outputting "Stay"; you are a stochastic algorithm outputting "Stay or Go based on external noise." The simulation perfectly predicts that you are stochastic, but it cannot resolve the noise. You have not cheated Death; you have exploited the causal gap between the map (simulation) and the territory (reality) that the thought experiment itself provides.

  The second objection is evidential: once the box reads heads and you are on the coach, surely you have the same evidence of doom as the person who simply decided to go? This relies on the intuition that "My being in Aleppo is evidence that Death is in Aleppo." In the pure case, this is true because your decision and Death's prediction share a common cause (your psychology). In the random case, this link is severed. Your being in Aleppo is evidence only that your coin landed heads. Death's being in Aleppo is evidence only that his coin landed heads. Since the coins are independent, your location provides no evidence about Death's location. The conditional probability of death given you are in Aleppo is 0.5, not 1.0. You have gained everything because you have converted a situation of perfect negative correlation (where your choice signals Death's location) into one of statistical independence.

  The third objection is that a clever predictor would see the trick coming and adapt. This is the strongest point, but it ultimately supports your position. If Death knows you will randomize, he knows he cannot guarantee a match. His best response is to choose a city himself, or randomize himself; either way, given your independence, his maximum probability of catching you is 0.5. Against a pure strategy, his probability is 1.0. Therefore, even if Death anticipates your plan, he cannot reduce your survival chance below 50%. You are describing a Nash equilibrium in a game between you and Death: if you play pure, he wins 100%; if you play mixed, he wins 50%. To argue against randomization is to argue that you should voluntarily choose a strategy that guarantees your opponent a win, rather than one that forces a draw, simply because the opponent knows you are playing.

  This reveals the deeper philosophical error in your friends' reasoning: they are comparing acts when they should be comparing policies. Standard Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) typically evaluate options like "Stay" and "Go" as atomic physical movements. But in problems involving predictors who simulate your reasoning, the object of choice is not the physical movement but the algorithm that produces it. When you choose to randomize, you are not choosing "Go" or "Stay"; you are choosing "Be the kind of agent whose location is unpredictable." Death predicts the agent, not just the act. If the agent is unpredictable, the prediction must be probabilistic. The standard verdict that you should stay is an artefact of restricting the option set to deterministic acts, which forces you into a corner where death is certain. By expanding the option set to include stochastic policies, you restore the agency that the predictor otherwise nullifies. You are correct: the rational choice is not to decide where to go, but to decide how to decide, and the only winning procedure here is to let the box decide.
