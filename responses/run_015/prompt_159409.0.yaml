      *   Decision stated? Yes (Conditional Approval).
      *   Linden rule addressed? Yes.
      *   Causal profile argument engaged? Yes.
      *   Arm A/B distinction handled? Yes.

  7.  **Final Polish:** (Drafting the content with specific attention to the "causal profile" paragraph to ensure it hits the "pain in subjects who cannot report it" angle hard.) *Self-correction: Ensure the distinction between "session" in Linden (chatbot conversation) and "run" in S-19 (evolutionary timeline) is clear.*

  8.  *(Final Mental Check)*: Does this sound like a university committee? Yes, bureaucratic but ethically serious.

