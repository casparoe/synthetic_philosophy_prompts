      *(Refining the Incentive Point)*: The user mentioned "relative performance." This is key. In a proper scoring rule (absolute), you maximize expected score by reporting true belief. In a tournament (relative), you maximize probability of being in the top quartile. This often means exaggerating beliefs or hedging against the crowd. This breaks the "honest and rational" assumption required for the price to be the posterior.

      *(Refining the Model Disagreement)*: This is about the $\Omega$ (sample space). If Agent A thinks $\Omega_A$ and Agent B thinks $\Omega_B$, they cannot have a common prior over $\Omega$. AAT fails immediately.

