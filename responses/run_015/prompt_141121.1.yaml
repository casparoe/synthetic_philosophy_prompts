      *   *KK Success:* In $w@$, she sees frost, believes $p$ (coolant active). Is this safe? Yes, frost only forms if active. In nearby worlds, frost implies activity. So she knows $p$.
      *   *Second Order:* Is she in position to know she knows $p$? She sees the "SYSTEM VERIFY" light. This light guarantees her sensory conditions are good. In nearby worlds where she believes "I know p" (based on the light), does she know $p$? Yes, because the light ensures the first-order conditions (frost visibility) are reliable. So the belief "I know p" is safe. KK holds.

