answer: |-
  (i) Elena stands before a cryogenic storage unit, her bare hand resting on the external casing. She feels a faint, borderline chill spreading through her palm, a sensation consistent with the unit operating at nominal temperature, though the difference between nominal and slightly-off is imperceptible to touch alone. Simultaneously, she sees a thick layer of frost on the viewing window, indicating the internal coolant is active. A green LED on the control panel reads "SYSTEM VERIFY: SENSOR ACTIVE," confirming that her visual access to the frost is unobstructed and the monitoring equipment is functioning correctly. She is alert, sober, and possesses the concept of feeling cold, but the sensory boundary is inherently fuzzy. She trusts the LED because it is wired directly to the sensor array, independent of her visual perception, providing a redundant check on her observational conditions.

  (ii) **C:** Feeling a faint chill in the hand. **p:** The coolant system is active. **Account:** Safety. A subject knows $q$ only if in nearly all nearby possible worlds where she believes $q$ on the same basis, $q$ is true. Being "in a position to know" means possessing evidence that renders the belief safe, regardless of whether the belief is actually formed.

  (iii) **Luminosity Failure:** In the actual world, Elena is in C. Consider a nearby world $w_1$ where the casing is marginally warmer; she feels no chill but cannot phenomenologically distinguish this from the actual world. Her evidence for "I am in C" is the tactile sensation. Since this sensation occurs in $w_1$ while C is absent, a belief based on this sensation would be false in $w_1$. Thus, the belief "I am in C" is unsafe. She lacks evidence to rule out $w_1$, so she is not in a position to know she is in C. Luminosity fails.
  **KK Success:** Elena sees frost and believes $p$. Frost necessitates active coolant in all nearby worlds; her belief is safe, so she knows $p$. For KK, she must be in a position to know she knows $p$. She sees the "SYSTEM VERIFY" light. This light guarantees her visual conditions are reliable. In nearby worlds where she believes "I know $p$" based on the light, the light ensures her first-order visual evidence is veridical. Thus, her second-order belief is safe. She is in a position to know she knows $p$. KK holds.

  (iv) **Diagnosis:** The divergence arises because the reliability of the first-order knowledge of $p$ is externally certified by a distinct mechanism, whereas the phenomenological condition C lacks any such certifying mechanism beyond the fallible experience itself.

  (v) **Ablation:** Remove the "SYSTEM VERIFY" light. Elena must now assess the reliability of her vision using only her vision. Since perceptual conditions vary marginally (fog, smudge), she cannot rule out nearby worlds where she believes she knows $p$ but is mistaken about the reliability. Her second-order belief becomes unsafe because the evidence for the second-order claim is the same fallible source as the first-order claim. KK fails, collapsing into the standard anti-luminosity result where both principles fail together.

  (vi) **Objection:** A proponent might argue this changes the subject: Luminosity concerns mental states, while KK here concerns external facts. Showing KK holds for external $p$ does not vindicate KK for mental states, which is where the tension with Luminosity usually lies. The internalist claims KK is plausible only for mental states; showing it holds for external $p$ is trivial.
  **Response:** The KK principle is universally quantified ("necessarily, if a subject knows $p$..."). Demonstrating a case where it holds for external $p$ proves the principle is not universally false, even if Luminosity fails for mental states. This severs the Williamsonian link that the failure of Luminosity entails the failure of KK generally. The objection assumes KK stands or falls with Luminosity; this case shows they are logically independent. I concede this does not save KK for mental states, but it satisfies the logical requirement of separating the two theses, proving KK does not depend on Luminosity for its truth. The case demonstrates that the structural conditions for KK can be met externally even when internal luminosity is impossible, refuting the claim that KK requires Luminosity.
