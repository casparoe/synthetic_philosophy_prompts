  The hallway lights hummed, flickering slightly as Elena and Marcus stepped out of the observation deck. The smell of stale coffee lingered. Elena stopped, leaning against the cinderblock wall, her arms crossed.

  "The glitch," Elena said immediately. "Did you see the hands during the switch? When the voice jumped from Film A to Film B, the tracking stuttered. For three seconds, neither hand knew what it was doing. That's the cost of handing off the baton. It proves serial duality."

  Marcus shook his head, stirring his coffee. "It proves a bottleneck in motor control, not consciousness. You're conflating report with experience. R. insisted he saw a single continuous film. He didn't feel a switch. If there were two distinct subjects swapping control, why does the subject report unity?"

  "Because the active hemisphere confabulates," Elena countered. "We know this. When the left hemisphere isn't driving, it invents a narrative to explain the body's actions. The patient's testimony is the output of the speaking module, not a window into the whole system. My position is simple: at any instant, there is exactly one phenomenal field. It alternates between hemispheres. The glitch is the mechanical noise of that alternation."

  Marcus took a sip. "I grant you the confabulation risk. I'll concede that the verbal report is unreliable regarding the *source* of information. But you deny the unity entirely. I argue for graded co-consciousness. R. is a single subject whose consciousness is partially unified. The streams are bound by affect and gist, even if specific content isn't integrated. Unity isn't a binary switch, Elena. It's a spectrum. The intact brain is just the top of the scale."

  "That's the core disagreement," Elena said, pushing off the wall. "Can unity intelligibly come in degrees? To be co-conscious means to be experienced together *by someone*. If I see the left field and you see the right, we aren't partially unified. We're two people. If the hemispheres are functionally isolated, positing a 'partial' unity is just a verbal trick to avoid saying there are two minds. Either the content is in the same phenomenal field, or it isn't. If it isn't, it's duality."

  "But consider Finding Three," Marcus said, his voice tightening. "The skin conductance and pupil dilation tracked emotional peaks in *both* films simultaneously. Even the unreported one. And it wasn't just startle; it tracked the emotional shape. If the left hemisphere was completely unconscious of the right field's film, why would the body resonate with its specific sadness or tension? That suggests a shared experiential ground, even if verbal access is blocked."

  Elena waved a hand. "That's subpersonal. Autonomic arousal doesn't require conscious experience. I can be startled by a loud noise I don't consciously register. The subcortical structures see both fields. They pump adrenaline. The conscious hemisphere just rides the wave. You're mistaking physiological coordination for phenomenal unity."

  "And I think you're mistaking the lack of verbal integration for the lack of experiential integration," Marcus replied. "The bottleneck is in consolidation and speech, not in the 'what it is like'."

  "Let's press that," Elena said. "If your graded view is right, how does the intact brain differ? Is it just a matter of bandwidth? If I sped up the alternation in R. enough, would it become indistinguishable from normal unity?"

  "Functionally, yes," Marcus said. "If the switching is fast enough, the functional difference vanishes. That suggests the intact brain isn't a different kind of entity, just a more tightly integrated version of this."

  "No," Elena insisted. "There's a structural difference. In the intact brain, information flows freely. Here, it doesn't. If unity is merely fast switching, then consciousness is a flicker. But phenomenologically, it's continuous. I'd argue the intact brain differs in kind because the binding is simultaneous, not serial. Even if you can't distinguish them behaviorally, the metaphysics differ. But I'll concede this: if the alternation were millisecond-fast, my view might become empirically indistinguishable from yours. That's a difficulty for me. I rely on the glitch to show the seams, but if the seams vanish, I lose my evidence."

  "And I'll concede this," Marcus said. "If the manual tracking didn't glitch during the switch, my view would be stronger. The fact that the body stumbles suggests a real discontinuity in control that hints at a discontinuity in the subject. It's hard to explain why a single subject with partial unity would lose motor coordination when shifting verbal focus."

  "So," Elena said, "what experiment decides it? Given the goggles?"

  "Cross-field priming without switching," Marcus said. "If you could show that seeing a word in the left field speeds up recognition of a related word in the right field *without* a switch in vocal narration, that proves integration. It would show the streams are talking to each other phenomenally, not just subcortically."

  "I'd want the opposite," Elena said. "Show me simultaneous verbal report. If R. can name an object in the left field while simultaneously describing the right field without switching voice or tone, I'm wrong. But that won't happen. The bottleneck is real."

  They walked toward the exit, the silence heavy.

  "One last thing," Marcus said, stopping at the door. "What finding would actually move you? Truly?"

  Elena thought for a moment. "If R. could spontaneously describe an event in the left-field film *during* a period where he was actively narrating the right-field film, without any switch or glitch. Simultaneous dual narration. That would kill serial duality."

  "Fair," Marcus said. "For me, it's the affect. If you could show that the physiological response to the unreported film disappears when the reporting hemisphere is under heavy cognitive load—proving the affect depends on the conscious stream rather than subcortical routing—I'd have to abandon graded co-consciousness. If the body stops feeling what the mouth isn't saying, then the unity was never there."

  Elena nodded slowly. "Then we know what to test next week."

  "Next week," Marcus agreed.
