      *So, the real contest is Internalism vs. Externalism. The "Borrowed" idea is a metaphor for Externalism grounded in past agency.*
      *My Stance:* I will argue that **Externalism** is the correct view for *commitments*, but the "Borrowed Reasons" intuition is the key to making Externalism palatable. Standard Internalism fails here.
