  6.  **Drafting the Response (Coffee Shop Tone):**
      *   **Intro:** Acknowledge the frustration with the smoking example. It's overused. Set the stage with the Adoption/Vow scenario.
      *   **The Scenario:** Let's use "Adopting a Child." It's high stakes. Person A adopts. 10 years later, Person A changes, doesn't feel the bond, wants out.
