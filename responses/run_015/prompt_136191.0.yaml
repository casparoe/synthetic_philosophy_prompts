answer: |-
  Pull up a chair. This is one of those philosophy questions that looks dry on paper but actually cuts right to the bone of how we live our lives. You're right to be sick of the smoking example. It's too easy to say, "Well, health is a desire everyone has," which muddies the water.

  Let's stick with your example. It's heavier, and it tests the theories better. Let's say **Alex** adopted a child fifteen years ago. It was a solemn, life-defining commitment. Today, Alex has undergone a massive shift. Maybe they've become a radical individualist, or maybe they just fell out of love with the lifestyle. The point is, right now, looking into their own psychology, they feel *nothing*. No pull, no desire, no care for the commitment they made. They are genuinely indifferent.

  Here is how the three views handle Alex, and here is why I think your "Borrowed Reasons" idea is the only one that doesn't collapse under pressure.

  ### 1. The Internalist Trap (The "Snapshot" Problem)
  Standard Internalism says: *A reason must be grounded in what you currently care about.*

  If we apply this strictly to Alex, the Internalist has to say Alex literally has **no reason** to keep the commitment. If there is no element in Alex's current "motivational set" that links to raising this child, then continuing to do so is irrational.

  **Where it breaks:**
  This view treats Alex like a series of snapshots rather than a continuous movie. It makes the concept of a "commitment" incoherent. What is the point of making a vow or adopting a child if the reason to keep it vanishes the moment your mood shifts? If Internalism is true, you can never actually bind your future self. You're just a slave to your current psychology. That might be scientifically accurate about how brains work, but it's normatively disastrous. It tells Alex, "It's not just that you *want* to leave, it's that you *should* leave, because staying is irrational." That feels wrong. It destroys the integrity of a life lived over time.

  ### 2. The Externalist Win (The "Alien" Problem)
  Externalism says: *Reasons exist independently of your psychology.*

  The Externalist looks at Alex and says, "You made a promise. You created a dependency. You have a reason to stay, period." This feels morally safer. It protects the child and the value of the vow.

  **Where it breaks:**
  It wins on obligation, but it loses on agency. If Alex is *totally* indifferent, where is this reason coming from? It floats in the ether like a moral ghost. If a reason cannot connect to *anything* Alex cares about—not even a desire to be a decent person, or a desire to avoid guilt—then in what sense is it a reason *for Alex*? It becomes a command from the universe. Externalism saves the commitment, but it alienates the agent. It turns Alex into a vessel for duties they can't recognize as their own. It risks becoming authoritarian: "Do it because it's Right," even if "Right" has no hook in your soul.

  ### 3. The "Borrowed Reasons" View (The Winner)
  Now let's look at your idea. You're suggesting that the past self can issue a "debt" to the future self. The reason is internal in *origin* (I made it) but external in *force* (I must pay it).

  I'm going to take a definite stand: **This is the correct view.** But I need to refine it slightly to make sure it survives the scrutiny that kills the other two.

  Your "Borrowed Reasons" view succeeds because it solves the **Identity Problem**.

  Internalism fails because it thinks "You" are just "You-Right-Now." Externalism fails because it thinks "Reasons" are just "Rules-Out-There." Your view recognizes that "You" are a project that stretches across time.

  Here is why "Borrowed Reasons" survives where the others break:

  **1. It preserves agency without fragility.**
  Unlike Externalism, the reason isn't alien. It came from *Alex*. It's not a law of physics; it's a loan Alex took out. Alex authorized this reason fifteen years ago. So, it respects Alex's autonomy. But unlike Internalism, it doesn't vanish when Alex's mood changes. A debt doesn't disappear just because you forget you owe it. This captures the binding nature of commitment without invoking magical moral facts.

  **2. It explains the "Ought" without the "Want."**
  The Internalist asks, "But does Alex *want* to do it?" The Externalist says, "It doesn't matter." The Borrowed Reasons view says, "Alex *invested* in this."
  Think of it like building a house. You pour the foundation (the vow) expecting to live in the house for decades. Ten years later, you decide you hate houses and want to live in a cave. The Internalist says, "Okay, sell the house." The Externalist says, "You must live in the house." The Borrowed view says, "You built this structure to support a life. If you walk away, you aren't just changing a preference; you're defaulting on the structural integrity of your own history."

  **3. It handles the "Indifference" objection.**
  You asked: *Does the Internalist have to say they literally have no reason?* Yes, and that's fatal.
  You asked: *Does the Externalist win by default?* No, because they can't explain *why* this reason applies to Alex specifically, other than "because it exists."
  Your view explains it: The reason applies to Alex because Alex is the borrower.

  ### The One Weakness (And How to Fix It)
  I'm not going to sell you a bill of goods. Your "Borrowed Reasons" idea has one vulnerability.
  **The Bankruptcy Objection:** What if Current Alex declares "normative bankruptcy"? What if they say, "I reject the authority of Past Alex. I am a new person. The debt is void."

  If they can do that, your view collapses back into Internalism.
  To defend your view, you have to argue that **personal identity is normative.** You can't just *say* you're a new person to escape a debt. The continuity of your life *is* the collateral on the loan.

  So, here is my defense of your position:
  We are not just collections of momentary desires (Internalism). We are not just subjects of cosmic law (Externalism). We are **narratives**. When Alex adopted that child, they wrote a chapter that demands a certain ending. To break the commitment isn't just "changing your mind"; it's tearing out the previous pages and making the story incoherent.

  The "Borrowed Reason" is the glue that holds the narrative together. It feels externally binding because, from the perspective of the current moment, the past is fixed. You can't change the fact that you made the vow. That fact stands outside you now, like an external object, even though you created it.

  ### The Verdict
  **Internalism** is too weak; it makes promises meaningless.
  **Externalism** is too spooky; it makes reasons alien.
  **Borrowed Reasons** is the sweet spot.

  It gets it right because it acknowledges that we live in time. A reason isn't just a spark in the brain today, and it isn't just a star in the sky. It's a bridge between who you were and who you are becoming.

  So, to answer your specific question: No, the Internalist is wrong to say Alex has *no* reason. No, the Externalist doesn't win by default because they can't explain the *source* of the bindingness. Your "Borrowed Reasons" view wins because it locates the authority in the **continuity of the self**. Alex has a reason to keep the commitment not because the universe demands it, and not because they currently desire it, but because they are the same person who pledged it, and that pledge is a debt their current life is built upon.

  Keep that idea. It's better than half the stuff published on this topic. It's essentially arguing that **integrity** is a source of reasons, and integrity is just the act of honoring the debts your past self incurred.
