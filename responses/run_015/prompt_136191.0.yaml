      *   *Let's go with the "Borrowed Reasons" view (Diachronic Internalism).* It's more engaging for the user who came up with it, and it addresses the specific weakness of standard Internalism (the fragility of commitment). I will argue that standard Internalism is too "snapshot" focused.

