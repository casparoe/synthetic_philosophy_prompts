      *   *My Pick:* I will argue **Borrowed Reasons** is the most accurate description of how commitments work, *but* I must warn that it relies on a specific view of identity.
      *   *Actually, to be more provocative and helpful:* I will argue that **Externalism** is technically correct, but **Borrowed Reasons** is the *best explanation* of why Externalism feels true in this case. No, the prompt asks me to pick which of the *three* gets it right.
