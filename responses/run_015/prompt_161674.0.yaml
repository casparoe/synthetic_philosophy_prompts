answer: |-
  This is a request to operationalize high-level normative theory into a bureaucratic instrument. The tension here is acute: political philosophy seeks coherence and moral truth; asylum triage seeks consistency, speed, and legal defensibility. To make this work for a caseworker with two weeks' training, the procedure must suppress theoretical nuance in favor of bright-line rules, while retaining enough flexibility to handle the "hard cases" you identified without generating unlawful decisions.

  Below is the **Normative Triage Protocol (NTP-1)**. It is designed to be run in 45–60 minutes. It separates the *Eligibility Gate* (Who counts) from the *Allocation Matrix* (Who takes them). It assumes the legal officer will verify statutory compliance, but gives the caseworker the normative logic to write the defensible note.

  ---

  ### PART 1: THE ELIGIBILITY GATE (Who Counts?)

  **Objective:** Determine if the claimant meets the threshold for *Refugee Status* (1951 Convention) or *Subsidiary Protection* (Human Rights/Humanitarian).

  **Step 1: The Risk Test (Fact-Finding)**
  *   **Question:** Is there a serious possibility of harm (death, torture, inhuman treatment) upon return?
  *   **Evidence:** Claimant testimony + Country of Origin Information (COI).
  *   **Stop Condition:** If **NO**, reject. (End of procedure).
  *   **If YES:** Proceed to Step 2.

  **Step 2: The Nexus Test (The "Why")**
  *   **Question:** Is the harm linked to Race, Religion, Nationality, Political Opinion, or Particular Social Group (PSG)?
  *   **Instruction:** Do not look for a "persecutor" yet. Look for the *reason* for the risk.
  *   **Stop Condition:** If the harm is purely random (e.g., natural disaster with no human agency) and fits no Convention ground, move to **Subsidiary Protection Track** (Step 5).
  *   **If YES:** Proceed to Step 3.

  **Step 3: The Protection Test (Agent vs. Failure)**
  *   **Question:** Is the State unable or unwilling to protect the claimant?
  *   **Rule:** A "well-founded fear" does **not** require an identifiable individual agent. It requires a **failure of state surrogacy**.
  *   **Hard Case Handling:**
      1.  *Generalised Violence:* Does the state protect the general population but exclude *this* claimant (or their group)? If **Yes**, pass. If **No** (risk is equal for all), reject Refugee Status (consider Subsidiary).
      2.  *Environmental/State Collapse:* Has the state withdrawn protection from a specific region/group? If the "persecutor" is the *absence* of the state, does this absence target a Convention ground (e.g., a specific ethnic region abandoned)? If **Yes**, pass. If **No** (purely geographic/climatic), move to Subsidiary Track.
      3.  *Circular Social Group:* Is the group defined *solely* by the harm suffered (e.g., "victims of crime")? If **Yes**, reject PSG. The group must have an independent existence *prior* to the harm (e.g., "women in Region X," "journalists").
  *   **Stop Condition:** If State Protection is available and accessible, reject.
  *   **If YES (Protection Failed):** Grant Refugee Status Recommendation. Proceed to Part 2.

  **Step 4: The Subsidiary Track (For Step 2/3 Failures)**
  *   **Question:** Does return violate fundamental human rights (Right to Life, Freedom from Torture) even if no Convention Nexus exists?
  *   **Rule:** This covers the "Environmental/State Collapse" case where no discriminatory intent exists but the land is uninhabitable due to state negligence.
  *   **Outcome:** Recommend Subsidiary Protection (not Refugee Status, but non-returnable). Proceed to Part 2.

  ---

  ### PART 2: THE ALLOCATION MATRIX (Which State?)

  **Objective:** Assign responsibility among potential safe states. This overrides "First Arrival" defaults where moral trumps exist.

  **Priority Ordering (Highest to Lowest):**

  1.  **NON-REFOULEMENT (Absolute Trump):** No transfer to a state where there is a risk of chain-refoulement or inhuman treatment.
  2.  **BEST INTERESTS OF THE CHILD / FAMILY UNITY (Absolute Trump):** Unaccompanied minors go where guardianship is best established; families go where core family members reside.
  3.  **ABSORPTIVE CAPACITY (Hard Constraint):** If the "First Arrival" state is at breaking point (infrastructure collapse), responsibility shifts. *Operational Definition:* If UNHCR or state data shows refugee population >2% of citizens or active suspension of asylum processing.
  4.  **CLAIMANT TIES (Tie-Breaker):** Language, prior employment, prior residence.
  5.  **CAUSAL CONTRIBUTION (Inoperable at Intake):** *Note:* Do not attempt to calculate carbon emissions or foreign policy causality at the individual level. This is a systemic duty, not an intake variable.
  6.  **FIRST ARRIVAL / PRESENCE (Residual Default):** If all above are equal, the state of claim lodgement assumes responsibility.

  **Decision Rule:** Start at #1. If a "Yes" is found, stop and assign. Do not proceed to lower priorities.

  ---

  ### PART 3: RUNNING THE PROCEDURE ON LAST MONTH'S CASES

  #### Case 1: The Delta Farming Family
  *   **Facts:** Saltwater intrusion, state administration withdrew 2 years ago, no armed group. Walked into adjacent state (Refugee pop. >2% of citizens).
  *   **Eligibility (Part 1):**
      *   *Risk:* Yes (livelihood/life destroyed).
      *   *Nexus:* No specific Convention ground (not targeted for race/politics).
      *   *Protection:* State withdrew. This is "Failure of Protection," but lacks discriminatory nexus.
      *   *Result:* **Fail Refugee Status.** Pass **Subsidiary Protection** (Step 4) due to inhuman conditions/state collapse.
  *   **Allocation (Part 2):**
      *   *Non-Refoulement:* Adjacent state is safe from persecution, but is it safe from *return* to the delta? Yes, but they are already there.
      *   *Capacity:* Adjacent state hosts >2% (Hard Constraint Triggered). Capacity exceeded.
      *   *Ties:* None with your state.
      *   *Result:* **Responsibility Shifts.** Adjacent state cannot absorb. Your state must take the case based on **Capacity Constraint**, despite lack of ties.
  *   **Recommendation:** Grant Subsidiary Protection. Accept Responsibility.

  #### Case 2: The Journalist
  *   **Facts:** Threats from named official (Political Opinion). Passed through 3 safe countries. Claimed in yours. Sibling lives here, worked here 6 months.
  *   **Eligibility (Part 1):**
      *   *Risk:* Yes (Documented threats).
      *   *Nexus:* Political Opinion (Journalism).
      *   *Protection:* State agent is the persecutor. Protection failed.
      *   *Result:* **Grant Refugee Status.**
  *   **Allocation (Part 2):**
      *   *Non-Refoulement:* Transit states are "safe" legally, but...
      *   *Family Unity:* Sibling resides here. (Trump).
      *   *Ties:* Prior employment (6 months).
      *   *First Arrival:* Transit states.
      *   *Result:* **Family Unity Trumps First Arrival.** Even if legal "Safe Third Country" rules exist, the normative procedure flags this for appeal defense based on Article 8 (Family Life).
  *   **Recommendation:** Grant Refugee Status. Accept Responsibility (override Safe Third Country return).

  #### Case 3: The Unaccompanied Minor (17yo)
  *   **Facts:** Feared militia commandant. Militia disbanded. Fear was well-founded at exit. Future uncertainty.
  *   **Eligibility (Part 1):**
      *   *Risk:* Past persecution creates presumption of future fear.
      *   *Nexus:* Imputed Political Opinion / Social Group (Youth in conflict zone).
      *   *Protection:* Militia disbanded, but state control uncertain. Benefit of the doubt applies to minors.
      *   *Result:* **Grant Refugee Status** (Precautionary Principle).
  *   **Allocation (Part 2):**
      *   *Best Interests of the Child:* (Absolute Trump).
      *   *Result:* Wherever the child is, unless a specific guardian is identified elsewhere. Do not transfer to a transit state without confirmed guardianship.
  *   **Recommendation:** Grant Refugee Status. Accept Responsibility (Best Interests).

  ---

  ### PART 4: LIMITS AND FAILURE MODES

  **Where the Procedure Cannot Be Run (Evidentiary Gaps):**
  1.  **Missing COI:** If no reliable data exists on the "withdrawal of administration" (Case 1) or "militia status" (Case 3), the procedure halts. *Action:* Pause decision, request Country Expert review. Do not guess.
  2.  **Credibility vs. Trauma:** The procedure assumes truthful testimony. It cannot distinguish between fabrication and trauma-induced inconsistency. *Action:* If inconsistency is central to the "Nexus," flag for Legal Officer review. Do not reject on credibility alone without psychological assessment.
  3.  **The "Safe Third Country" Fiction:** The procedure treats "Safety" as factual. If a transit state is legally safe but practically hostile, the *Non-Refoulement* check must catch this. If it doesn't, the procedure fails. *Action:* Caseworker must note *practical* safety, not just legal designation.

  **What the Procedure Cannot Settle (Structural Questions):**
  1.  **The Right to Close Borders:** This procedure assumes the state has an obligation to process. It cannot answer whether the state should exist as a sanctuary at all. That is a legislative question, not an intake one.
  2.  **Total Obligation:** The procedure handles individual cases. It cannot calculate the "fair share" of the total global refugee population your state should absorb. It only handles who arrives at the door.
  3.  **Causal Justice:** As noted in the Matrix, individual caseworkers cannot adjudicate historical guilt (colonialism, climate change). This procedure offloads that to the "Capacity" constraint, but it cannot fully satisfy the philosophical demand for reparative justice.

  ### IMPLEMENTATION NOTE FOR THE LEGAL OFFICER
  *This protocol prioritizes **Human Rights obligations (ECHR/CRC)** over **Administrative Convenience (Dublin/First Arrival)**. In an appeal, defend the Allocation Matrix not as "policy" but as "statutory interpretation of Human Rights Acts." The Eligibility Gate expands "Persecution" to include "Discriminatory Failure of Protection," which is defensible under current Supreme Court jurisprudence regarding state surrogacy.*
