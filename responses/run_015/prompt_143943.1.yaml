answer: |-
  First off, take a breath. Two hours on teleology is enough to make anyone's brain fry. You and your friend have stumbled into one of the classic stalemates in philosophy of biology, but you've correctly identified the two pressure points that make the debate interesting again: **novelty** (synthetic bio) and **obsolescence** (vestigiality).

  Standard textbook comparisons usually stop at "Etiological handles normativity, Causal-Role handles novelty." But you want to know how they actually break down in the weeds of CRISPR and whale pelvises. Let's dissect this without the jargon safety net.

  ### 1. The Synthetic Biology Problem: Novelty without History
  Your friend is right that strict etiological accounts (Wright/Millikan) hit a wall with *de novo* engineered genes. If function is strictly "the effect for which this trait was selected by natural selection," a gene synthesized five minutes ago has **no function**. It might have a *capacity*, but it doesn't have a *function* until it survives a generation of selection.

  **The Etiological Blind Spot:**
  In a strict etiological view, a synthetic insulin gene in a bacteria is functionally identical to a random sequence of DNA until the bacteria reproduces and that gene proves useful for survival. This is intuitively unsatisfying for a synthetic biologist. They need to say, "This gene is functioning correctly," immediately after insertion, not in ten generations.

  **The Causal-Role Advantage (and Trap):**
  Cummins-style (Causal-Role) analysis solves this easily. The function of the synthetic gene is whatever it contributes to the containing system's capacity. If the system is "bacteria + plasmid" and the capacity is "produce insulin," the gene's function is insulin production.
  *   **The Trap:** As you noted, this kills "malfunction." If the gene mutates and produces a toxic protein instead, the Causal-Role account just says, "Well, its function is now producing toxin." It describes *what is*, not *what ought to be*. It loses the ability to distinguish between a working engine and a broken one; both are just doing something causal.

  **The Non-Circular Fix for Synthetic Bio:**
  To say an engineered gene is functioning *correctly* without evolutionary history, you have to shift the "selector." In natural biology, the selector is the environment/fitness landscape. In synthetic biology, the selector is the **design specification**.
  This means "correct function" in synthetic bio isn't about survival; it's about **fidelity to a blueprint**. You can have normativity (malfunction) without evolution if you anchor the function to the *intent of the designer* rather than the *history of the species*.

  ### 2. The Vestigial Problem: History without Utility
  Now flip to your friend's vestigial organ argument (whale pelvis, human appendix). She asked if etiological accounts call these "malfunctions." Actually, a sophisticated etiological account says something more nuanced: **They are functionally extinct.**

  **The Etiological Nuance:**
  For Millikan, a trait has a function only if the *selection pressure* maintaining it is still active.
  *   **Malfunction:** The heart is selected for pumping, but it isn't pumping. (Selection pressure exists, trait fails).
  *   **Vestigiality:** The pelvis was selected for walking, but walking is no longer the fitness constraint for whales. The selection pressure vanished. Therefore, the pelvis doesn't have a function *anymore*. It's not "broken"; it's "retired."
  *   **Why this matters:** This allows etiological accounts to distinguish between a disease (malfunction of a maintained trait) and an evolutionary leftover (trait where maintenance selection has ceased).

  **The Causal-Role Struggle:**
  Causal-Role theory struggles here because it looks at the *current* system.
  *   If the whale pelvis anchors fat tissue that helps with buoyancy, Cummins says: "It has a function (buoyancy)."
  *   If the appendix does nothing, Cummins says: "It has no function."
  *   If the appendix bursts (appendicitis), Cummins says: "It has a causal role (infection/sepsis)."
  The problem is that Causal-Role theory has a hard time explaining why we consider the appendix "useless" or "vestigial" rather than just "a thing that sometimes causes infection." It lacks the historical context to say, "This thing *used* to do something, and now it's just baggage." It treats the whale exactly like a machine designed today, ignoring the evolutionary drag.

  ### 3. "Functional Anchoring": Is it Just Etiology in a Lab Coat?
  Your friend's idea of "Functional Anchoring" (locking function to designer intention) is actually a very sharp philosophical move. It is essentially **Etiological Theory with a Human Selector.**

  **Is it Crypto-Etiological?**
  Yes, structurally. It retains the *logic* of etiology (Origin determines Function) but swaps the *mechanism* (Natural Selection → Human Design).
  *   **Natural Etiology:** Function is fixed by past survival success.
  *   **Functional Anchoring:** Function is fixed by past design intent.

  **Does it solve a real problem?**
  Yes, it solves the **Normativity Problem for Artifacts.**
  In synthetic biology, we need to say a gene *failed* even if the organism survived. If I engineer a bacteria to glow green, but it glows red, an etiological account (based on survival) might say "It's functioning fine, it's alive." A Causal-Role account says "Its function is glowing red."
  Functional Anchoring allows you to say: "No, the function is glowing green, because that is what it was *anchored* to do by the engineer." It reintroduces the "ought" without needing natural selection.

  **The Risk:**
  The risk is anthropocentrism. If you define function by designer intent, what happens when the designer is wrong? Or when the synthetic organism evolves away from the design? Functional Anchoring works for the *generation* of the design, but as soon as the synthetic organism enters the wild and evolves, you slide back into Natural Etiology.

  ### 4. Can Causal-Role Borrow History without Cheating?
  You asked if Causal-Role theorists can borrow history without becoming "crypto-etiological." This is the hardest part.

  Pure Cummins-style analysis is ahistorical. It's a snapshot. To explain why a synthetic gene *should* do X, the Causal-Role theorist has to define the "System Capacity" normatively.
  *   **The Move:** They define the system not as "the bacteria" but as "the bacteria-as-engineered."
  *   **The Trick:** They treat the **design protocol** as part of the system's causal structure. The "capacity" of the system includes "adherence to protocol."

  **Is this cheating?**
  It's borderline. If the "capacity" of the system is defined by what the designer *wanted*, you are smuggling intentionality into a causal account. You are essentially saying, "The causal role is to fulfill the design," which is just Functional Anchoring by another name.

  However, a sophisticated Causal-Role theorist might argue for **Stabilization** rather than History. They could say: "A function is a causal role that is *actively maintained* by a control mechanism."
  *   In natural bio: Maintenance = Natural Selection.
  *   In synthetic bio: Maintenance = Feedback loops / Regulatory circuits designed to keep the gene on track.
  This allows them to talk about malfunction (the feedback loop failed) without referencing the *origin* of the gene, only the *current maintenance* of the process. This avoids etiology but keeps normativity.

  ### The Verdict for Your Argument

  Here is the synthesis to settle the bet:

  1.  **On Synthetic Biology:** Your friend is right that strict Natural Etiology fails here. A *de novo* gene has no selection history. However, you are right that Causal-Role fails to explain *error*. The solution is **Functional Anchoring**. It is etiological in structure (origin fixes function) but the "history" is the design process, not evolutionary selection. This validates the synthetic biologist's intuition that a gene can "fail" immediately upon creation.
  2.  **On Vestigiality:** You can correct your friend here. Etiological accounts do **not** call vestigial organs malfunctions. They call them **functionless**. A malfunction requires a standing selection pressure that is being thwarted. Vestigiality is the *absence* of that pressure. Causal-Role accounts, conversely, often accidentally assign new functions to vestigial parts (e.g., "the pelvis stores fat"), which misses the point that the part is evolutionary baggage.
  3.  **The "Crypto-Etiological" Fear:** Functional Anchoring *is* etiology with lab coats, but that's a feature, not a bug. It proves that "function" always requires a **teleological baseline** (a goal). In nature, that baseline is survival. In the lab, that baseline is the engineer. Causal-Role accounts only work if they secretly assume a goal (system capacity), which usually implies a history of how that capacity was established.

  **Bottom Line:**
  Function is inherently historical. You cannot get an "ought" from an "is" without referencing where the "is" came from or what it is *for*.
  *   **Natural Bio:** History = Selection.
  *   **Synthetic Bio:** History = Design.
  *   **Vestigial Bio:** History = Absent Selection.

  Your friend wins on Synthetic Bio (Etiology needs modification). You win on Malfunction (Causal-Role can't explain error without a goal). But the "Functional Anchoring" idea is the bridge: it admits that *all* function, even in a petri dish, relies on a history of constraints, whether those constraints are environmental or intentional.
