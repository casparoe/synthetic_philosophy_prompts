answer: |-
  The slogan "revolutions devour their own children" is a historiographical shibboleth. It sounds explanatory but functions primarily as a metaphor. To use it precisely in an argument about structural destiny versus contingency, you must dissect it into competing causal mechanisms. Below is the separation of the slogan into five distinct theses, their epistemic status, their alignment with major historiographical frameworks, and a diagnostic evaluation of a conceptual distinction intended to resolve the ambiguity.

  ### I. Five Distinct Theses of the Slogan

  Here the slogan is broken down by the *mechanism* it implies.

  **1. The Factional Uncertainty Thesis**
  *   **Claim:** In the absence of established institutions, revolutionary coalitions are held together only by opposition to the *Ancien Régime*. Once the common enemy is weakened, the coalition fragments. Violence arises because there are no legal mechanisms to resolve disputes between former allies, making elimination the only path to security.
  *   **Classification:** **General Law of Revolutionary Politics.** (Supported by comparative sociology of revolutions, e.g., Skocpol, though not universal).
  *   **Historiographical Fit:** **Contingency.** It suggests violence is a product of specific institutional vacuums and crisis conditions (war, invasion) rather than inherent ideological evil or class destiny. If institutions had stabilized earlier, the "devouring" might have been avoided.

  **2. The Institutional Legitimacy Thesis**
  *   **Claim:** Revolutionary tribunals and security committees derive legitimacy from the existence of "enemies of the people." To maintain their own power and justify emergency measures, these institutions must continuously identify new conspirators. Eventually, the definition of "conspirator" expands until it encompasses the institution's own architects.
  *   **Classification:** **Substantive Empirical Claim.** (Specific to the logic of the Committee of Public Safety and the Law of Suspects).
  *   **Historiographical Fit:** **Ideological/Institutional.** This aligns with François Furet's argument that the *logic* of the revolutionary state (the General Will) brooks no opposition. It is less about class and more about the structural requirements of a regime based on "virtue."

  **3. The Sociological Shedding Thesis**
  *   **Claim:** The revolutionary elite (bourgeoisie) requires the mobilization of the lower orders (sans-culottes) to break the aristocracy. Once property rights are secured and the old elite is dispossessed, the bourgeoisie no longer needs the radical base. The "devouring" is actually a deliberate purge of radical allies to stabilize property relations (Thermidor).
  *   **Classification:** **Substantive Empirical Claim.** (Specific to 1789 and the social composition of the Jacobin club vs. the Convention).
  *   **Historiographical Fit:** **Class-Struggle.** This is the classic Marxist interpretation (Lefebvre, Soboul). The "devouring" is not a tragic accident but a functional transition from bourgeois revolution to bourgeois order. The children (Hebertists, radical Enragés) are sacrificed to secure the parents' (bourgeoisie) gains.

  **4. The Psychological Exhaustion Thesis**
  *   **Claim:** Revolutionary fervor is a high-energy emotional state that cannot be sustained. As adrenaline fades, paranoia sets in. Leaders project their own fading legitimacy onto external enemies, leading to a burnout that manifests as purging colleagues.
  *   **Classification:** **False Metaphor.** (It anthropomorphizes a political movement as a single psychological subject; it lacks falsifiable criteria).
  *   **Historiographical Fit:** **None.** This is pop-psychology often used in popular history to avoid structural analysis.

  **5. The Narrative Teleology Thesis**
  *   **Claim:** The "devouring" is not a causal mechanism but a literary pattern historians impose on events to create a tragic arc. We label the execution of Danton by Robespierre (and subsequently Robespierre by Thermidor) as "devouring" because it fits a Greek tragedy structure, not because the actors intended it or were structurally forced into it.
  *   **Classification:** **Trivial Platitude.** (It is a meta-historical observation about how we write history, not about what happened).
  *   **Historiographical Fit:** **Post-Modern/Revisionist.** It suggests the "inevitability" is an artifact of storytelling, supporting the contingency view by undermining the appearance of destiny.

  ---

  ### II. Diagnostic Mapping and the "Smuggled" Reading

  When you invoke this slogan in an argument about whether 1789 was *structurally destined* to turn violent, you must choose which thesis you are deploying.

  *   **To support a Class-Struggle Account:** You must use **Thesis 3 (Sociological Shedding).** Here, the violence is not "destined" by human nature, but by the logic of capital accumulation. The revolution stops "devouring" once the bourgeoisie is secure (Thermidor). The slogan explains the *limit* of the revolution, not its infinite chaos.
  *   **To support an Ideological Account:** You must use **Thesis 2 (Institutional Legitimacy).** Here, the violence *is* destined. If you claim the General Will cannot tolerate faction, then Robespierre *had* to purge the Dantonists. The ideology contains the seeds of the Terror.
  *   **To support a Contingency Account:** You must use **Thesis 1 (Factional Uncertainty) or 5 (Narrative Teleology).** Here, the "devouring" was an avoidable accident caused by war and the collapse of monarchy. Without the war crisis, the institutions might have stabilized before the purges began.

  **The Smuggled Reading:**
  When the phrase is used to dismiss *all* revolutionary politics as inherently self-defeating (a common conservative liberal critique), the speaker is smuggling in **Thesis 4 (Psychological Exhaustion)** disguised as **Thesis 2 (Institutional Legitimacy).**
  They claim to be describing institutional logic, but they are actually asserting a trans-historical law of human nature: that *any* attempt at radical equality inevitably collapses into paranoia and bloodshed. This renders the specific historical conditions of 1789 irrelevant. It transforms a substantive empirical claim into a moral warning, bypassing the need for evidence.

  ---

  ### III. Conceptual Distinction: Institutional Auto-immunity vs. Ideological Overreach

  To clarify whether we are describing a mechanism internal to revolutionary states or a retrospective storytelling pattern, I propose distinguishing between **Institutional Auto-immunity** and **Ideological Overreach**.

  **1. Institutional Auto-immunity**
  *   **Definition:** A structural mechanism where the defensive organs of the state (tribunals, police, committees) designed to protect the revolution from external threats lack the discriminatory capacity to distinguish between external and internal threats. To function, they must process "enemies." When external enemies are scarce, the machinery processes internal components to maintain throughput.
  *   **Nature:** *Mechanistic and Functional.* It implies the violence is a byproduct of bureaucratic survival, not necessarily the intent of the leaders.

  **2. Ideological Overreach**
  *   **Definition:** A conceptual gap where the stated goals of the revolution (e.g., "Republic of Virtue," "Perfect Equality") are ontologically impossible to achieve. The violence arises from the attempt to coerce reality to match the concept. Leaders are devoured not because the bureaucracy needs fuel, but because they are identified as the obstacles preventing the realization of the utopia.
  *   **Nature:** *Teleological and Conceptual.* It implies the violence is driven by the content of the ideas themselves.

  **Does this distinction resolve anything substantive?**

  **Honest Evaluation:**
  It clarifies the *locus* of the explanation, but it **does not resolve the problem of determinism.**

  *   **Why it helps:** It prevents the conflation of *bureaucratic inertia* (Auto-immunity) with *fanaticism* (Overreach). If you argue for Auto-immunity, you can argue that different leaders with the same institutions might have produced similar violence (supporting structural destiny). If you argue for Overreach, you might argue that a different ideology (e.g., liberal constitutionalism) within the same institutions would have prevented the Terror (supporting ideological contingency).
  *   **Why it fails:** Both concepts can be read deterministically. A Marxist can argue Auto-immunity is just the "dictatorship of the bourgeoisie" stabilizing itself. A Furet-ian can argue Overreach is the inevitable logic of democratic sovereignty. The distinction names the *engine* of the devouring, but it does not tell us whether that engine was *necessary*.
  *   **The Verdict:** This distinction is primarily **analytical, not explanatory.** It renames the problem from "Why did they die?" to "Was it the machine or the map that killed them?" While this is a necessary step for precision, it does not solve the fundamental historiographical impasse: we cannot run a control group of the French Revolution to see if a non-virtuous republic would have refrained from purging its leaders.

  **Recommendation for your argument:**
  Do not use the slogan as a premise. Use it as the *object* of your analysis. Argue that "devouring their own children" is not a law of nature, but a specific outcome of **Institutional Auto-immunity** triggered by **Contingent Crisis** (War), which was then retrospectively mythologized as **Ideological Overreach**. This allows you to acknowledge the violence without conceding that it was structurally destined from 1789.
