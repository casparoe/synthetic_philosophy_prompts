answer: |-
  Your reconstruction of Borden and Angier as rival research programmes is pedagogically robust, though it strains against the fundamental secrecy of magic. Treating the Transported Man as the shared hard core works well, as does viewing their methods as protective belts. However, you must correct the assumption that Lakatosian progressivity maps cleanly onto moral virtue. In Lakatosian terms, a programme is progressive if it predicts novel facts and degenerating if it merely patches up anomalies to survive. Angier's programme is technically progressive because the Tesla machine produces a genuine novel fact, real duplication, which Borden's illusion does not. Yet, because Angier must destroy the evidence nightly to protect the hard core of secrecy, his programme is simultaneously degenerating. It consumes resources and lives without accumulating public knowledge. This self-erasing novelty is coherent within the film's logic but incoherent for Lakatos, who assumes evidence accumulates. A Lakatosian verdict would label Angier's work as ad hoc protection of the hard core rather than genuine growth, making it degenerating despite the technological marvel. The novelty is real, but the refusal to let it enter the public domain prevents it from functioning as scientific evidence.

  The second wrinkle concerning nested narratives strikes at the heart of Lakatos's distinction between internal and external history. Lakatos argues that rational reconstruction, or internal history, captures the logical progress of science, while external history explains the sociological deviations. The film suggests that the internal history itself, represented by the journals, is a constructed deception designed to mislead the rival. If the primary records of a programme are fabricated to protect the hard core, then rational reconstruction becomes an exercise in decoding lies rather than tracing logic. A Lakatosian might argue that the actual practice of magic is the internal history and the journals are merely external noise, but the film insists the story is the trick. This leans toward Feyerabend, who argued that scientific history is often rewritten to fit a rational mold that never existed. The film argues that the prestige, the final reveal, is always a lie, implying that internal history is always a prestige. A Lakatosian can answer this by insisting that rational reconstruction is a regulative ideal, not a historical claim, but the film challenges whether that ideal survives contact with human deception. Cutter's closing claim that the audience wants to be fooled introduces the sociological element Lakatos tried to exclude. It suggests the success of a programme depends on external reception, not just internal logic. A Lakatosian response is that audience desire is external history, but the film implies it determines the survival of the programme, blurring the line Lakatos drew.

  The fatal flaw in using this film for Lakatos is the publicity constraint. Lakatos's methodology relies on open criticism and shared evidence, whereas magic relies on concealment and private verification. If your students are engineers, they will spot that Angier's machine cannot be tested, calibrated, or improved by peers, which violates the scientific method you are teaching. If you present this as a straightforward application of Lakatos, you risk misleading them about the necessity of transparency. However, this failure is itself a valuable lesson. It demonstrates that Lakatos's machinery breaks down when the hard core includes a prohibition on sharing information. You should frame the exercise not as proving Lakatos right, but as testing where his vocabulary fails. The film buys you a discussion on the ethics of secrecy and the cost of progress, even if it does not map perfectly onto the philosophy of science. The tension between Angier's technological success and his moral failure allows you to discuss whether progressivity is purely empirical or also ethical.

  For the screening, you should stop the film at four specific moments to anchor these concepts. First, pause after the scene where Julia drowns in the water tank, as this is the shared anomaly that drives both programmes to modify their protective belts. Second, stop when Angier first witnesses the Tesla machine transport a hat, which serves as the crucial experiment demonstrating the novel fact of real duplication. Third, halt the film during the reveal of Borden's twin brother, which exposes the craft-based protective belt that sustained his programme without high technology. Finally, end on the warehouse scene where Angier's cloned bodies are revealed, illustrating the unsustainable cost of his progressive but degenerating programme. Each scene marks a shift in the heuristic rules or the empirical content of their rival methodologies.

  For your handout, use the following framing paragraph to translate the vocabulary for first-year engineers. Think of a research programme like a long-term engineering project with a central design goal you refuse to change, which Lakatos calls the hard core. Surrounding that goal is a protective belt of adjustable methods, materials, and theories that you modify to solve problems without abandoning the central goal. Positive heuristics are your rules for what to build next, while negative heuristics are the constraints you refuse to violate, such as safety codes or, in this film, secrecy. A programme is progressive if your modifications lead to new discoveries and successful predictions, but it is degenerating if you are only making excuses to keep the project alive despite constant failures. In this film, you will evaluate whether the magicians are solving problems like scientists or merely patching holes like engineers working on a flawed design. Use these terms to track how each magician responds when their trick fails, and ask yourself whether their solutions add to human knowledge or merely hide the cost of the illusion.
