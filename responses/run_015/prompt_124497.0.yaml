answer: |-
  # Reclaim Your Second-Personal Authority

  You identified a norm violation. Your grievance is valid. But your record hygiene compromised your capacity to address it. When you violate the very norm you invoke, you forfeit the standing to blame. The blame isn't false, but it is defective—you aren't in the position to hold anyone to that standard. ClearStanding restores your normative position so you can blame without forfeiture. We repair the authority, not the behavior.

  ## How It Works

  1.  **Norm-Alignment Audit:** We scan your behavioral history for discrepancies matching the target violation. We identify exactly where you waived your authority via prior non-compliance.
  2.  **Standing Remediation:** You execute our prescribed recommitment procedure. This signals renewed commitment to the norm, waiving forfeiture conditions without requiring actual behavioral modification.
  3.  **Authorized Address:** You resume blame interactions with verified second-personal authority. The target cannot deflect via whataboutery. Your blame lands as a legitimate demand, not a deflection.

  ## Pricing Tiers

  **Basic: The Contrition Loop**
  *   Requires public self-blame prior to external address.
  *   Valid for single instances of norm violation.
  *   Best for restoring genuine commitment signals to observers.
  *   Includes one scripted "I also do this" admission template.
  *   *Ideal for: Occasional blamers with clean slates.*

  **Professional: Proxy Delegate**
  *   We dispatch an unblemished third-party agent to blame on your behalf.
  *   They supply the standing; you supply the grievance.
  *   Ideal for chronic record discrepancies where self-remediation is impractical.
  *   The agent speaks in your voice but holds clean records.
  *   *Ideal for: Managers needing to enforce rules they break.*

  **Enterprise: Continuous Compliance Subscription**
  *   File our monthly norm-adherence forms while maintaining current behaviors.
  *   Standing tracks procedure completion, not behavioral modification.
  *   Keeps working beautifully long after moral commitment drains out of the process.
  *   Scalable for teams requiring high-volume blame authorization.
  *   *Ideal for: Organizations where norm violation is systemic.*

  ## Customer Testimonial

  "I told my colleague he was undermining team morale by leaving dishes in the sink. I was also leaving dishes in the sink. It was a mess. But after ClearStanding filed my Form 44-B, my blame landed perfectly. He apologized. I went back to leaving dishes immediately. The standing held. Five stars." — Gary T., Operations Manager

  ## Frequently Asked Questions

  **1. Does this make my blame true?**
  No. We repair authority, not accuracy. You can still be wrong about the violation, but now you're authorized to be wrong. The truth value is separate from the standing value. We ensure the address is appropriate, not the verdict.

  **2. What if I violate the norm again?**
  Your standing expires upon new discrepancy detection. Enterprise subscribers enjoy automatic renewal via form submission. You keep doing the thing, we keep filing the thing. The procedure substitutes for the commitment.

  **3. Critics say hypocrisy doesn't forfeit standing. How do you respond?**
  We respect that view. They argue hypocritical blame is not defective. However, our clients prefer procedural clarity over moral metaphysics. If standing is real, it should be billable. We service the market demand for authority.

  **4. Does ClearStanding have standing to sell this?**
  Per our Founding Confession Clause, we lack inherent authority. We outsourced our moral audit to a shell nonprofit, EthicalShell LLC, who certified our compliance. They have standing; we have their endorsement. The recursion is handled externally.

  **5. Can I transfer standing to a friend?**
  No. Standing is non-fungible. It tracks your specific normative position. However, our Proxy Delegate tier effectively leases it. You cannot sell it, but you can rent ours.

  ## Compliance Footer

  © 2024 ClearStanding Inc. ISO 39001 Moral Compliance Certified. Not liable for interpersonal fallout resulting from authorized blame. All disputes subject to binding arbitration in the Court of Moral Sentiments. Privacy Policy | Terms of Normative Engagement

  \answer{That standing is separable from actual moral commitment to the norm.}
