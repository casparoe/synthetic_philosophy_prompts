answer: |-
  Look, I've walked surveys in that kind of valley, and I'll grant you the numbers sound plausible for a post-state scenario, but you're doing something tricky with that bioarchaeology. If the people are healthier and less worked to death, you're telling me their society failed? You're defining society as the structure that oppressed them, not the people living it. That's where your definition of collapse is doing illicit work: it equates differentiation with viability. Those two pottery fabrics might mean local production replaced long-distance dependency, which is a resilient adaptation, not a breakdown. You're measuring the loss of the superstructure and calling it the death of the organism. The households didn't collapse; they just stopped subsidizing the top tier. That's not a failure of the society, it's a failure of the state, and we've got enough dirt under our fingernails to know those aren't the same thing.

  And your scribal horizon is useful for text, but you're stretching it to cover material complexity, which muddies the water. That's not a horizon, that's a value judgment. But the real problem is in your definition's clause about longer than anyone living through it could have expected. Who's the anyone? The potter making the eleventh fabric? Or the tax collector losing his job? If the new normal holds for five centuries, that's not a collapse, that's a transition. You're smuggling in the idea that the previous state was the natural one and anything less is a failure. Reorganisation plus scale-reduction describes the exact same curves without implying that complexity is the default goal of human history. Why do you need the word collapse if the data just shows simplification? You're letting the definition do the emotional work that the evidence won't support.
