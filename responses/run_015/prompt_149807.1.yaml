  *   **Mara's Rule (Lexical):** She likely has a hidden threshold for "Life Ruin." If she views 12 months as crossing a line into "Permanent Damage" (e.g., PTSD certainty) while 11 months is "Recoverable," she will treat them as different buckets. **She picks B** (Save the 1 person from the Life-Ruining 12 months).
  *   **Alternative Rule (Ratio):** An 12:11 ratio is almost 1:1. The AggregationFactor is effectively linear. 40,000 people × 11 months is massively more pain than 1 person × 12 months. **It picks A** (Save the 40,000).
  *   **The Test:** If she hesitates or switches to A here, she admits there is no lexical threshold for severe pain, and her Verdict (1) was an outlier. If she sticks with B despite the tiny gap, she confirms she is running on hidden "Kind" categories, not math.
