answer: |-
  You are right to be frustrated, and your hypothesis is sharp: there is a verbal slippage here. But if I'm honest, calling it merely "verbal" lets the philosophers off the hook too easily. It suggests that if we just cleaned up our definitions, the smoke would clear. It won't. The stalemate persists not because we are confused about words, but because we are confused about what metaphysics is *for*.

  Here is the diagnosis: The dispute is **meta-ontological**. It looks like a disagreement about the world (do joints exist?), but it is actually a disagreement about the standards for counting something as "existing."

  Side A (the Realists) operates with a **Mind-Independence Constraint**. For them, a "natural kind" must be a feature of the world that would exist even if no intelligent beings were around to categorize it. They treat science as a detector, like a Geiger counter clicking in the presence of radiation. Side B (the Pragmatists/Pluralists) operates with an **Epistemic-Utility Constraint**. For them, a "natural kind" is a node in a conceptual network that pays dividends in prediction and control. They treat science as a mapmaker, drawing lines that help us navigate.

  The reason they agree on every case (water, tiger, jade) but disagree on the conclusion is that they are answering different questions. Side A asks, "Is this category forced upon us by the world?" Side B asks, "Is this category useful for agents like us?" Since the world forces categories upon us *by* making them useful, the extensions overlap. But the *grounds* for the classification are incommensurable.

  Now, consider your proposed empirical project: measuring the overlap of inductively successful categories across sciences. You ask if a result showing strong cross-cutting would defeat Side A. It would not. Here is why.

  If your data showed that biology, chemistry, and psychology carve things up differently, Side A will retreat to **Fundamental Physics**. They will argue that the "true joints" are at the bottom of the reductionist chain. The cross-cutting in special sciences is merely a result of our cognitive limitations or multiple realizability. They will concede that "species" or "recession" aren't *fundamental* kinds, but maintain that the electrons and quarks composing them are. Your data would only prove that special sciences are messy, not that nature lacks joints.

  Side B, conversely, will seize your data as proof that **Fundamental Physics is not privileged**. They will argue that even quantum fields are theoretical posits selected for their utility in specific explanatory contexts. If the higher-level sciences cross-cut, it shows that nature supports multiple, equally valid hierarchical structures depending on the scale of inquiry.

  Both sides will co-opt the data because the data is theory-laden. To measure "inductive success," you must already decide which inferences count. Side A counts inferences that track microstructure. Side B counts inferences that support macro-level intervention. You cannot run the experiment without presupposing one of the very frameworks you are trying to test.

  So, is it verbal? Yes, in the sense that "natural kind" is a honorific term both sides want to bestow on their favorite ontology. But it is substantive in that it reflects a deep, unresolved tension in how we relate to reality. We want science to tell us what the world *is* (Realism), but we only ever access the world through what the world *does* for us (Pragmatism). We cannot step outside our cognitive skin to check if our maps match the territory in a way that doesn't involve using the maps.

  This leads to your question about progress. An empirical measurement will not solve this. A new definition will not solve this. Progress will only come from **dissolving the demand for a single true hierarchy**.

  The most productive move in recent decades has been shifting from "Natural Kinds" to "Stable Causal Clusters." This view suggests that things cluster together not because of a single essential property (like atomic number), but because of a homeostatic mechanism that keeps the properties together. This allows for fuzzy boundaries (accommodating Side B) while maintaining that the clustering is objective and mind-independent (accommodating Side A).

  However, even this is often just a compromise position. True progress would come from philosophers admitting that the question "Does X *really* exist?" is often a bad question. Instead, we should ask: "How stable is this category across different theoretical contexts, and what breaks it?"

  For your piece, the angle isn't that philosophers are fighting over words. It's that they are fighting over the **authority of science**. Side A wants science to be the final arbiter of reality, which requires reality to be singular and ordered. Side B wants science to be a toolbox of human practices, which allows reality to be plural and context-dependent.

  If you want to move the needle, stop asking them if the joints are real. Ask them what work the word "real" is doing in their arguments. When a Realist says "Jade isn't a real kind," they don't mean you can't use the word. They mean "Jade doesn't appear in the fundamental equations of the universe." When a Pragmatist says "Jade is a real kind," they mean "Jade supports reliable inferences for gemologists."

  They are talking past each other because one is looking for the **God's Eye View** and the other is describing the **Human Eye View**. The tragedy is that the God's Eye View is inaccessible to humans. We are stuck with the Human Eye View. The Realists are chasing a ghost; the Pragmatists are comfortable with the shadow.

  **What counts as progress?**
  1.  **Abandoning the "One True Hierarchy" assumption.** If philosophers admit that nature might be structured differently at different scales without one being "more real," the tension eases.
  2.  **Focusing on Reference, not Ontology.** Instead of asking "What is water?", ask "How does the term 'water' lock onto the world?" This shifts the debate from metaphysics to semantics, where progress is actually possible.
  3.  **Acknowledging the Normative Stake.** Admit that choosing a metaphysics is choosing a value system. Do we value unity (Realism) or diversity of explanation (Pluralism)?

  Your piece will be strongest if you frame this not as a scientific mystery, but as a philosophical Rorschach test. The "joints of nature" say less about the world and more about how much certainty we demand from our knowledge. The stalemate isn't a failure of argument; it's a feature of the human condition. We want the world to be independent of us, but we can only know it through us. Until philosophers accept that tension as permanent, they will keep carving the same turkey with different knives and arguing about which cut is the "true" one.

  So, to answer your specific prompt: The dispute is **ill-posed** because it assumes a perspective we cannot occupy. The empirical measurement would be **neutralized** by theoretical reinterpretation. Progress lies in **changing the question** from "What exists?" to "How do our categories hold up under stress?" That is a question science can answer, and philosophy can finally stop fighting over.
