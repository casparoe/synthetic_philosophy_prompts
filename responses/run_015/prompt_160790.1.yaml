  **What I was doing with the form**

  The sestina's fixed vocabulary mirrors the deterministic worry at the heart of the debate: the words remain constant while their positions shift, enacting the tension between a settled future and our moving perspective within it. Stanza two embodies the symmetric view (Picture 1): neither disjunct is true, yet the disjunction holds, warranting silence. Stanza three shifts to the thin-line view (Picture 2): the path is real but epistemically hidden, making silence a failure of credentials rather than truth. Stanza four captures the retroactive worry (Picture 3): the event settles the past, making the earlier utterance true only after the fact.

  I allocated the envoi to resolve the lookout's dilemma not by solving the logic, but by prioritizing entitlement over truth. The envoi follows the conventional pattern (2-5, 4-3, 6-1), but I chose to let the final line end on *open* (in the internal position) and *sea* (end position) to suggest that while the event settles the sea, the harbour mouth—and the speaker's authority—remains open until the fact arrives. The form couldn't fully capture the technical distinction between semantic gaps and epistemic limits without jargon, so I localized that friction in the difference between "no part is true" (stanza two) and "not true that chance decides" (stanza three). Ultimately, the poem argues that for the speaker, the metaphysical status of the future matters less than the ethics of assertion.
