answer: |-
  1. **The Fideism Trap**
     Standard fideist readings of Wittgenstein argue that religious belief is immune to rational critique because it operates in a separate sphere from science or history. You're claiming your "orientational grammar" view avoids this, but if religious statements are regulative commitments that set the rules for what counts as evidence within that form of life, aren't they still insulated from external critique? How is this materially different from fideism, other than using different vocabulary?
     *   **Follow-up:** If she answers that her view allows for *internal* critique whereas fideism does not, press her on this: "But if the criteria for that internal critique are themselves generated by the grammar you're defending, haven't you just moved the immunity inside the house rather than removing it? How does an outsider ever have standing to say the grammar itself is flawed?"

  2. **Concrete Grammatical Breakdown**
     You argue that religious belief only becomes problematic when the practices it structures undergo a "grammatical breakdown." I'm worried this is too abstract. Can you give me a concrete, real-world example of what a grammatical breakdown actually looks like? I want something sharper than "people stopped going to church" or "stopped praying." What does it look like when the language itself stops working within the practice?
     *   **Follow-up:** If she says breakdown occurs when the language no longer successfully guides action or orientation, ask: "How do you distinguish that from ordinary doctrinal disagreement? Two believers can argue fiercely about predestination while both continuing to pray and live the life. Where is the line between a healthy disagreement and a grammatical breakdown?"

  3. **The Status of Rationality**
     On your reading, religious belief isn't an empirical hypothesis, but it's also not just an emotion. So, when a believer holds a religious commitment, are they being rational, arational, or is 'rationality' simply the wrong category? If you say they are rational, you seem to owe us a definition of rationality that doesn't rely on evidence; if you say they aren't, you seem to concede the evidentialist's point.
     *   **Follow-up:** If she argues that religious belief possesses a *sui generis* or distinct kind of rationality, press her on this: "Doesn't calling it 'rationality' in a unique sense just smuggle in normative weight without earning it? If it doesn't answer to the usual standards of reason, what work is the word 'rational' doing there other than making believers feel defended?"

  4. **The Historical Fact Claim**
     Many religious believers insist that their core claims—like the Resurrection—are historical facts that happened in space and time, not just grammatical rules for living. On your view, if a believer insists on treating a grammatical commitment as an empirical hypothesis, are they making a mistake? Are you willing to say that a devout person who treats their faith as factually descriptive is suffering from a kind of grammatical confusion?

  5. **Wittgenstein's Personal Sympathies**
     There's a persistent rumor, like the one my roommate holds, that Wittgenstein was a "crypto-Christian" and that his philosophy was secretly shaped by his own religious anxieties. Does your orientational reading require Wittgenstein to have had personal religious sympathies for the argument to hold water? Or is this a structural point about language that works even if Wittgenstein was a complete atheist?

  6. **Doctrinal Change Without Collapse**
     One thing I'm struggling to square with your view is how people change their doctrinal minds without their whole form of life collapsing. If belief is an orientational commitment that structures everything, changing a core doctrine should upend the practice. Yet people tweak their theology all the time while remaining devout. How does your account handle gradual doctrinal shift without invoking a grammatical breakdown?

  7. **Non-Cognitivism vs. Commitment**
     You deny that religious statements are just expressions of feeling, like saying "Boo!" or "Hooray!" to existence. But if they aren't describing facts, what is the cognitive content of a statement like "God loves me"? If it's not a fact about God's mental state, and not just my own feeling, what kind of object is this commitment pointing to?

  8. **The Relativism Worry**
     If religious grammar is internal to a form of life, does that mean we have no grounds to critique a religious practice from the outside, even if that practice seems harmful? If the grammar dictates what counts as "good" within that system, does your view inadvertently lock us into a form of relativism where we can't judge the grammar itself, only how well people follow it?

  9. **Evolution of Grammar**
     You talk about grammar as something that organizes a form of life, but forms of life aren't static. They evolve. Does the grammar evolve with them, or does the grammar dictate the evolution? If the grammar changes, is that a continuous process, or does it happen in ruptures? I'm trying to understand if your view allows for organic development or if it sees religious language as more rigid than it actually is.
