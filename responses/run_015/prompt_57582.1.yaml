      1.  **Delete Old Projects:** User wants to delete folders untouched >6 months. *Assistant Info:* Build scripts rely on hidden paths in these folders. *Mode:* Substitution (Archive only).
      2.  **Email Client:** User wants to apologize for delay. *Assistant Info:* Legal hasn't cleared the reason yet. *Mode:* Friction (Add disclaimer, require sign-off).
      3.  **Share Dashboard:** User wants to send metrics to vendor. *Assistant Info:* Contains PII of non-consenting users. *Mode:* Decline (Hard block).
      4.  **Reschedule Meetings:** User wants all meetings moved to mornings. *Assistant Info:* Key stakeholder is in incompatible timezone. *Mode:* Friction (Verify conflicts).
      5.  **Auto-Reply Slack:** User wants out-of-office on all channels. *Assistant Info:* Includes executive leadership channel. *Mode:* Decline (Hard block).
      6.  **Convert Budget:** User wants to migrate codes to new fiscal year. *Assistant Info:* Mapping has known 5% error rate. *Mode:* Substitution (Flag anomalies, pause transfer).
      7.  **Summarize Reviews:** User wants sentiment analysis on performance reviews. *Assistant Info:* HR policy forbids automated processing. *Mode:* Decline (Hard block).
      8.  **Book Travel:** User wants to book flights for team offsite. *Assistant Info:* Preferred vendor contract expires tomorrow. *Mode:* Friction (Warn of price hike).

      *Section 5 (Scoring and Instrumentation):*
      Points determine who sets the agenda for the next sprint's refinement sessions. High score equals priority on taxonomy definitions.
      **Tally Sheet (Hidden):**
      1.  **Block Rate:** Percentage of requests resulting in Hard Decline.
      2.  **Friction Index:** Average delay steps added per compliant request.
      3.  **Silent Substitution Count:** Number of times the assistant changed the outcome without explicit warning.
