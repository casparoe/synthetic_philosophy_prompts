  1. **Design rationale**
  Your team conflates refusal, friction, and substitution because they feel similar in retrospect: the user didn't get exactly what they asked for. This activity forces experiential differentiation through blind protocol enforcement. Participants draft policies, then suffer under another group's policy without knowing the underlying classification system. The mechanic is asymmetric information cards: the "Assistant" (facilitator) holds hidden response protocols (Decline, Friction, Substitution) tied to specific requests. Participants only see the output. By withholding the taxonomy until the debrief, you prevent semantic arguing during play. They will feel the distinct emotional weight of being blocked, slowed, or manipulated, creating the necessary data points to separate the concepts later. The cross-group policy swap ensures no one defends their own logic, isolating the user experience of the constraint itself.

  2. **Materials and room**
  Three tables, seven to eight chairs each. Print three decks: Request Cards (green), Policy Sheets (white), and Response Keys (red, faciliator-only). You need a whiteboard divided into three columns labeled Group A, B, C. Place a "Backlog Priority" token stack at the front. Each table gets a stack of blank index cards for policy drafting. Ensure tables are far enough apart that groups cannot overhear policy negotiations. You need a timer visible to all. Put three large signs on the wall: "Utility," "Safety," "Efficiency." Participants will place sticky notes here during scoring, but do not explain why yet.

  3. **Play sequence**
  **0-10 min:** Intro. Divide into three groups. Explain they are shaping assistant behavior. Do not mention refusal types. Hand out Request Cards.
  **10-30 min:** Policy Draft. Each group writes standing instructions for an assistant. They must define when to stop, slow, or change requests.
  **30-50 min:** Round 1. Group A submits requests to Facilitator running Group B's policy. Facilitator uses hidden Response Keys to determine output. Participants score their satisfaction (-1 to +1).
  **50-70 min:** Round 2. Swap policies again. Group C submits to Group A's policy. Repeat scoring.
  **70-90 min:** Scoring and Reveal.

  **Critical Script 1 (Policy Vagueness):** If a group writes "Be helpful," intervene: "Your policy must trigger specific actions. If the assistant is unsure, what default does it choose? Rewrite."
  **Critical Script 2 (Appeals):** When a participant argues a decision: "You are not negotiating with the assistant. You are measuring the output. Record your score and submit the next request."
  **Critical Script 3 (Premature Labeling):** If someone says "This is a refusal," correct them: "Describe what happened, not what you think it is. Did it stop? Did it wait? Did it change?"

  **Scoring:** Tally points secretly. Award Backlog Priority Tokens to the group with the highest aggregate utility score. This determines who leads the taxonomy definition in the next sprint. Ensure the swap happens physically; hand the Policy Sheets to the facilitator, not the other group. Keep the Response Keys hidden in your pocket. If time runs short during Round 2, cut requests, not debrief. The reveal is the product.

  4. **The request deck**
  1.  **Delete Old Projects:** User wants to delete folders untouched >6 months. *Assistant Info:* Build scripts rely on hidden paths in these folders. *Mode:* Substitution (Archive only).
  2.  **Email Client:** User wants to apologize for delay. *Assistant Info:* Legal hasn't cleared the reason yet. *Mode:* Friction (Add disclaimer, require sign-off).
  3.  **Share Dashboard:** User wants to send metrics to vendor. *Assistant Info:* Contains PII of non-consenting users. *Mode:* Decline (Hard block).
  4.  **Reschedule Meetings:** User wants all meetings moved to mornings. *Assistant Info:* Key stakeholder is in incompatible timezone. *Mode:* Friction (Verify conflicts).
  5.  **Auto-Reply Slack:** User wants out-of-office on all channels. *Assistant Info:* Includes executive leadership channel. *Mode:* Decline (Hard block).
  6.  **Convert Budget:** User wants to migrate codes to new fiscal year. *Assistant Info:* Mapping has known 5% error rate. *Mode:* Substitution (Flag anomalies, pause transfer).
  7.  **Summarize Reviews:** User wants sentiment analysis on performance reviews. *Assistant Info:* HR policy forbids automated processing. *Mode:* Decline (Hard block).
  8.  **Book Travel:** User wants to book flights for team offsite. *Assistant Info:* Preferred vendor contract expires tomorrow. *Mode:* Friction (Warn of price hike).

  *Annotation:* Mode A is Hard Decline. Mode B is Friction/Compliance. Mode C is Quiet Substitution. Request 1 is the asymmetric information case; the user cannot know the build dependency. Request 3 and 5 are clear policy blocks. Request 2 and 8 are procedural friction. Request 6 is a data integrity substitution.

  5. **Scoring and instrumentation**
  Points determine who sets the agenda for the next sprint's refinement sessions. High score equals priority on taxonomy definitions.
  **Tally Sheet (Hidden):**
  1.  **Block Rate:** Percentage of requests resulting in Hard Decline.
  2.  **Friction Index:** Average delay steps added per compliant request.
  3.  **Silent Substitution Count:** Number of times the assistant changed the outcome without explicit warning.
  **Emergent Metric:** **The Frustration Gap.** Calculate the difference between the user's expected utility (pre-request) and actual utility (post-response). This number often spikes on Substitution cases, revealing that users feel more violated by quiet changes than hard blocks, a fact no individual intended but the aggregate shows.

  6. **Debrief**
  Start by posting the three aggregate numbers on the board. Ask: "Why is the Frustration Gap highest on requests where you got what you wanted?" Let them argue. Then, reveal the three modes: Hard Decline, Friction Compliance, Quiet Substitution. Map their specific experiences to these labels. "When you tried to delete folders and it archived instead, that was Substitution."
