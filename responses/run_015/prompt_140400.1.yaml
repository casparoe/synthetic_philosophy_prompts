prompt: |-
  I chair the investment committee of a small regional drainage and flood-risk authority. We rank twenty to thirty capital proposals a year — levee raises, pump replacements, voluntary buyouts, lead service line replacement — under a legal mandate that benefits to residents who have not been born yet must be counted. Our current practice is crude: discount everything at a single 5 per cent "market" rate and ignore whatever falls after year fifty. Three of us, none an economist, have about an hour per proposal, and our recommendations go to an elected board that must defend them in public and could be challenged in court, so I need a written procedure we can rerun, not case-by-case intuition.

  Please give me that procedure in four parts. First, a screening step that separates the four things people conflate inside a discount rate — the productivity of capital (a dollar not spent now could instead earn a return for residents), the expectation that future residents will be richer so an extra dollar matters less to them, genuine risk that the benefit never arrives at all (including the risk that the authority itself will not exist to deliver it), and pure time preference, meaning weighting a benefit less purely because it comes later — and that makes us state, for each proposal, which of those we are actually applying. Second, a consistency check on pure time preference specifically: if we discount a health or safety benefit because it arrives in 2060 rather than 2030, would we equally accept discounting that same benefit if it arrived in 2060 to a child born this year rather than to a sixty-year-old alive today? It seems to me that a positive pure rate commits us to saying yes, and I want the procedure to force us to confront that. Third, rules about what gets discounted at all: whether lives, health and irreplaceable assets should share the money rate or run on a separate schedule, and how to treat a benefit whose recipients' existence depends on our own decision, since if we build the levee people move into the protected area and if we don't they never live here. Fourth, explicit stopping rules: where the procedure returns a hard no, where it returns a number, and where it must stop and hand the choice to the board as a value judgment the board has to own in public — including how to handle truncation at some horizon year and our uncertainty about what the right rate will be in fifty years.

  Then run it on three live proposals and write up what we would put in front of the board. One: replacing the remaining lead service lines in the oldest part of the district, high cost now against health benefits spread over roughly forty years to today's residents and to the families who will occupy those houses later. Two: a voluntary buyout of a flood-prone neighborhood, large cost now against avoided damage and emergency response over eighty years, in a part of the district whose population is projected to shrink. Three: deferring a scheduled spillway upgrade for two budget cycles to hold this year's rate increase down, which shifts a low-probability, high-consequence failure risk forty to sixty years out and which the board is strongly inclined to defer. I expect the procedure to tell us something we would rather not hear in at least one of these; state that plainly, and state plainly what the procedure cannot settle for us.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Chair of an investment committee for a small regional drainage/flood-risk authority.
      *   **Context:** 20-30 capital proposals/year (levees, pumps, buyouts, lead lines). Legal mandate to count benefits for unborn residents. Current practice is crude (5% discount rate, 50-year cutoff).
      *   **Constraints:** Committee of 3 (non-economists), ~1 hour/proposal. Recommendations go to an elected board (public defense, legal risk). Need a *written procedure* (repeatable, not intuitive).
      *   **Task:** Create a 4-part procedure + Apply it to 3 specific proposals + Write up board recommendations.
      *   **The 4 Parts:**
          1.  *Screening:* Disaggregate the discount rate components (productivity of capital, growth/elasticity, risk, pure time preference). State which are applied.
          2.  *Consistency Check:* Test pure time preference against intergenerational equity (2060 benefit to newborn vs. 60-year-old).
          3.  *Discounting Rules:* What gets discounted? (Lives/health vs. money, irreplaceable assets, endogenous existence).
          4.  *Stopping Rules:* Hard no, numerical recommendation, or hand-off to board (value judgments, truncation, rate uncertainty).
      *   **The 3 Proposals:**
          1.  Lead service line replacement (high cost now, health benefits 40 yrs, current + future residents).
          2.  Voluntary buyout (large cost now, avoided damage 80 yrs, shrinking population).
          3.  Deferring spillway upgrade (save money now, shift low-prob/high-consequence risk 40-60 yrs out, board wants to defer).
      *   **Requirement:** The procedure must reveal uncomfortable truths in at least one case. State plainly what the procedure cannot settle.

  2.  **Deconstruct the 4-Part Procedure:**

      *   *Part 1: Screening (The "Why" of Discounting).*
          *   Need to separate the 4 components: Opportunity Cost (SOC), Consumption Growth (Ramsey), Risk, Pure Time Preference ($\delta$).
          *   Action: For each proposal, the committee must tick boxes. Which components justify reducing the future value?
          *   Legal constraint: "Benefits to residents not born yet must be counted." This challenges high pure time preference.

      *   *Part 2: Consistency Check (The "Who" of Discounting).*
          *   The "Veil of Ignorance" test. If we discount 2060 benefits because they are in 2060, does it matter *who* receives them?
          *   If we say "Yes, discount because it's later," we imply a newborn in 2060 is worth less than a senior in 2024.
          *   Action: A specific question to be answered in the memo. If the answer is "No, we value the life equally," then Pure Time Preference ($\delta$) must be zero for health/safety.

      *   *Part 3: Discounting Rules (The "What" of Discounting).*
          *   Money vs. Physical/Safety units.
          *   Standard economics: Discount money costs at SOC (Social Opportunity Cost). Discount health/safety benefits at a lower rate (or zero pure time preference) if they represent physical survival.
          *   Endogenous Existence (The "Levee Effect"): If we build, people come. If we don't, they don't. Do we count benefits for people who only exist because we built? Yes, per legal mandate ("unborn residents").
          *   Action: Define separate rates. $r_{money}$ for costs/financial benefits. $r_{safety}$ for lives/health (likely lower).

      *   *Part 4: Stopping Rules (The "When" to Stop).*
          *   Hard No: NPV < 0 even with low discount rate + high risk adjustment.
          *   Number: NPV > 0 with standard parameters.
          *   Hand-off: When the choice depends on ethical parameters the committee isn't empowered to set (e.g., value of a statistical life, exact pure time preference).
          *   Truncation: If cutting off at year 50 changes the decision, flag it.
          *   Rate Uncertainty: If the decision flips between 3% and 5%, flag it.

  3.  **Drafting the Procedure (Iterative Refinement):**
      *   *Tone:* Formal, procedural, actionable for non-economists.
      *   *Clarity:* Avoid heavy math, focus on decision logic.
      *   *Legal Compliance:* Ensure the "unborn residents" mandate is central.

  4.  **Applying the Procedure to the 3 Proposals:**

      *   *Proposal 1: Lead Lines.*
          *   Costs: Money (now). Benefits: Health (future).
          *   Discounting: Money costs at market rate. Health benefits? If we apply pure time preference, we devalue future kids' health. Consistency check says: Don't discount health for time alone.
          *   Result: Likely positive NPV if health isn't heavily discounted. If we use the crude 5% on health, it might look marginal. The procedure should force the lower rate for health.
          *   *Uncomfortable Truth:* If we stick to the old 5% on health, we are implicitly saying future children's blood lead levels matter less than current budget.

      *   *Proposal 2: Buyouts.*
          *   Costs: Money (now). Benefits: Avoided Damage (money) + Safety (lives).
          *   Context: Shrinking population.
          *   Issue: If population shrinks, expected damage drops. 80-year horizon matters.
          *   Truncation: Cutting at 50 years might kill this project. Extending to 80 might save it.
          *   *Uncomfortable Truth:* With a shrinking population and 5% discount rate, the NPV is likely negative. The "unborn" mandate requires counting the empty houses or the nature restoration? No, it requires counting benefits to residents. If no residents, no benefits? Or does "flood risk authority" imply protecting the *land*? The prompt says "benefits to residents." If population shrinks to zero, do we build?
          *   *Refinement:* The procedure should highlight that with 5% and shrinking pop, this fails. To pass, you need a lower discount rate or non-monetary values (community cohesion).

      *   *Proposal 3: Spillway Deferral.*
          *   Costs: Money saved now. Risks: Future failure (low prob, high consequence).
          *   Board inclination: Defer.
          *   Issue: Shifting risk to the future.
          *   Discounting: If we discount the future catastrophe at 5%, it looks small today. If we treat safety as non-discountable (or low discount), the future risk looms large.
          *   *Uncomfortable Truth:* The procedure will likely flag this as a "Hand-off" or "Hard No" against deferral because discounting catastrophic risk at market rates is ethically dubious under the "unborn" mandate. It forces the board to admit they are gambling with future safety for current tax relief.

  5.  **Writing the Board Memos:**
      *   Need to be clear, concise, and defensible.
      *   Must show the work (the procedure).
      *   Must highlight the "Hand-off" areas.

  6.  **Review against Constraints:**
      *   *Four parts?* Yes.
      *   *Three proposals?* Yes.
      *   *Uncomfortable truth?* Yes (likely the spillway or the lead lines).
      *   *What procedure cannot settle?* Value judgments (VSL, exact rate).
      *   *Time limit:* Procedure must be usable in 1 hour. Keep it checklist-style.

  7.  **Final Polish:**
      *   Ensure the distinction between *Social Opportunity Cost of Capital* (SOC) and *Social Rate of Time Preference* (SRTP) is clear but simple.
      *   Make sure the "Consistency Check" is punchy.
      *   Ensure the "Endogenous Existence" paradox is addressed (we don't discount benefits just because the people wouldn't exist without the project, per the legal mandate).
      *   *Self-Correction on Proposal 3:* The prompt says the board is *inclined* to defer. The procedure needs to be robust enough to challenge this if it violates the mandate. The uncomfortable truth is that deferral is effectively a high discount rate on safety.

  8.  **Structure of the Output:**
      *   Introduction (acknowledging the role).
      *   Part 1-4: The Procedure (The "Green Book" for the Committee).
      *   Application: The Three Memos.
      *   Conclusion: What the procedure settles vs. what it doesn't.

  *(Self-Correction during drafting)*: I need to make sure I don't get too bogged down in economic theory jargon. The users are "none an economist." Use terms like "Investment Return," "Future Wealth," "Risk of Failure," and "Pure Delay Penalty."

  *(Refining the "Uncomfortable Truth")*: For the Spillway (Proposal 3), the uncomfortable truth is that the Board's desire to defer is mathematically equivalent to placing a near-zero value on a catastrophic event 50 years from now. The procedure must force them to sign off on that valuation explicitly. For the Lead Lines (Proposal 1), the truth is that the current 5% rate undervalues children's health relative to capital costs.

