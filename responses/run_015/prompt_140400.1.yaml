answer: |-
  **TO:** Investment Committee Members
  **FROM:** Committee Chair
  **SUBJECT:** Revised Capital Evaluation Procedure (Draft for Adoption)
  **DATE:** October 26, 2023

  Per our legal mandate to account for unborn residents and the need for a defensible, repeatable process, the following procedure replaces our crude 5% flat-rate rule. This protocol is designed to be completed within one hour per proposal. It separates economic mechanics from ethical judgments and identifies exactly where the Committee's authority ends and the Board's political accountability begins.

  ---

  ### PART 1: THE COMPONENT SCREENING (The "Why")
  *Goal: Prevent conflating distinct reasons for discounting.*

  For every proposal, the Committee must complete the **Rate Component Matrix**. We do not select a single percentage until we have checked the boxes below.

  | Component | Definition | Applied? (Y/N) | Justification for this Proposal |
  | :--- | :--- | :--- | :--- |
  | **1. Capital Productivity** | A dollar spent today could earn a return elsewhere (e.g., paying down debt, investing reserves). | | *Default: Yes for monetary costs.* |
  | **2. Future Wealth (Growth)** | Future residents will likely be richer; an extra dollar matters less to them than to us. | | *Default: Yes for monetary benefits.* |
  | **3. Delivery Risk** | The probability the benefit never arrives (tech failure, authority dissolution, climate shift). | | *Must be quantified (e.g., 10% reduction).* |
  | **4. Pure Time Preference** | Valuing a benefit less *solely* because it happens later, regardless of wealth or risk. | | **See Part 2.** |

  **Rule:** If Box 4 is checked "Yes," the Committee must attach the *Ethical Impact Statement* (Part 2). If Box 4 is checked "No," the discount rate for that benefit stream is derived only from 1, 2, and 3.

  ---

  ### PART 2: THE CONSISTENCY CHECK (The "Who")
  *Goal: Test the ethical validity of Pure Time Preference.*

  If Part 1, Box 4 was marked "Yes," the Committee must answer the following question in the written record. If the answer is "No," Box 4 must be unchecked and the Pure Time Preference rate set to zero for that benefit stream.

  **The Test:** *"If this specific benefit (e.g., avoiding a flood death, preventing lead poisoning) were guaranteed to arrive in 2060, would we value it less if the recipient were a child born today than if the recipient were a 60-year-old alive today?"*

  *   **If Yes:** We are asserting that the *timing* itself degrades value. We apply a positive Pure Time Preference rate (e.g., 0.5% - 1.5%).
  *   **If No:** We are asserting that a life or health outcome in 2060 is equal to one in 2024. We apply **0% Pure Time Preference** to that benefit stream.
  *   **Mandate Check:** Given our legal requirement to count unborn residents, the default presumption for **Health and Safety benefits** is **No** (0% Pure Time Preference).

  ---

  ### PART 3: DISCOUNTING RULES (The "What")
  *Goal: Apply the correct rate to the correct stream.*

  We do not use a single discount rate for the whole project. We split the calculation into two ledgers.

  **Ledger A: Financial Flows (Costs & Monetary Damages)**
  *   **Rate:** Social Opportunity Cost of Capital (SOC).
  *   **Current Proxy:** 5% (reflecting market return/debt cost).
  *   **Scope:** Construction costs, maintenance, avoided property damage, emergency response costs.

  **Ledger B: Physical/Safety Flows (Lives, Health, Irreplaceable Assets)**
  *   **Rate:** Social Rate of Time Preference (SRTP).
  *   **Current Proxy:** 2% (reflecting growth + low pure time preference).
  *   **Scope:** Statistical lives saved, cases of lead poisoning avoided, ecosystem preservation.
  *   **Rationale:** Financial markets price capital, not human survival. Using 5% on safety implies a future life is worth significantly less than a current life.

  **The "Endogenous Existence" Rule:**
  *   If a proposal (e.g., a levee) enables new residents to move into the protected area, we **count** the benefits to those new residents.
  *   *Reasoning:* Our mandate requires counting benefits to residents who have not been born yet. We cannot discount benefits to zero on the grounds that the beneficiaries owe their presence to the project.

  ---

  ### PART 4: STOPPING RULES (The "When")
  *Goal: Define Committee authority vs. Board liability.*

  **1. The Hard No:**
  *   If NPV is negative in **both** Ledger A and Ledger B, even using the low (2%) rate for safety.
  *   *Action:* Recommend Rejection.

  **2. The Numerical Recommendation:**
  *   If NPV is positive in both Ledgers.
  *   *Action:* Recommend Approval.

  **3. The Hand-Off (Value Judgment):**
  *   If Ledger A is negative but Ledger B is positive (spending money to save lives).
  *   If the decision flips based on the horizon (e.g., positive at 80 years, negative at 50 years).
  *   If the decision flips based on rate uncertainty (e.g., positive at 2%, negative at 3.5%).
  *   *Action:* Recommend "Board Decision Required." The memo must explicitly state: *"This project purchases safety/health at a cost that exceeds strict financial return. The Board must publicly validate the price paid per unit of safety."*

  **4. Truncation Protocol:**
  *   We will not arbitrarily cut off benefits at year 50.
  *   If a project has a lifespan >50 years (e.g., infrastructure), we model to the end of life.
  *   If uncertainty beyond year 50 is high, we apply a "Uncertainty Discount" (Part 1, Box 3) rather than truncating the stream.

  ---

  ### APPLICATION: MEMORANDA TO THE BOARD

  Below are the outputs of running the three live proposals through this procedure.

  #### MEMO 1: Lead Service Line Replacement (Old District)
  **Recommendation:** Approve (Ledger B Driven)
  **Committee Vote:** 3-0

  **Procedure Output:**
  *   **Part 1 Screening:** Capital Productivity (Yes, for costs); Future Wealth (Yes, for costs); Pure Time Preference (No, for health benefits).
  *   **Part 2 Consistency:** We answered "No." We cannot state that a child's neurological development in 2050 is worth less than a resident's today simply due to delay.
  *   **Part 3 Rates:** Costs discounted at 5%. Health benefits (lead cases avoided) discounted at 2%.
  *   **Part 4 Stopping Rule:** Ledger A (Financial) is negative (high upfront cost, low monetary damage avoidance). Ledger B (Health) is strongly positive. This triggers a **Hand-Off**.

  **Board Facing Statement:**
  > "Under the previous 5% flat-rate rule, this project appeared marginal. Under the new procedure, which separates financial costs from health outcomes, the project shows a strong positive return on public health. However, because the financial cost exceeds the monetary damage avoided, this is not a profit-center investment. It is a purchase of health equity.
  >
  > **Uncomfortable Truth:** The old method implicitly valued future children's health at roughly 60% of current residents' health due to the 5% discounting over 40 years. This procedure corrects that. If you approve this, you are affirming that preventing lead poisoning in 2050 is as valuable as preventing it today, even if it costs more in present-day dollars. If you reject this, you are asserting that the capital cost outweighs the intergenerational health mandate."

  ***

  #### MEMO 2: Voluntary Buyout (Flood-Prone Neighborhood)
  **Recommendation:** Hand-Off to Board (Horizon Sensitivity)
  **Committee Vote:** 2-1 (Minority favors Hard No)

  **Procedure Output:**
  *   **Part 1 Screening:** Delivery Risk (Yes). Population is projected to shrink; risk that houses are empty in 2080 is high.
  *   **Part 3 Rates:** Avoided property damage (Ledger A) at 5%. Avoided trauma/displacement (Ledger B) at 2%.
  *   **Part 4 Stopping Rule:** **Truncation Sensitivity.** At 50 years, NPV is negative. At 80 years (full asset life), NPV turns slightly positive in Ledger B due to avoided catastrophic flood events in the 2070s.

  **Board Facing Statement:**
  > "This proposal fails a strict financial test over 50 years. It only passes if we count benefits out to 80 years and apply the lower safety discount rate to the trauma of displacement.
  >
  > **Uncomfortable Truth:** The viability of this project depends entirely on the assumption that a flood *will* occur in the 2070s or 2080s. If climate models are wrong and no major flood occurs, this expenditure yields zero return. Furthermore, with a shrinking population, we are spending significant capital today to protect fewer people tomorrow.
  >
  > **Decision Required:** The Committee cannot settle the value of 'community cohesion' or the probability of a 1-in-100-year event in 2080. The Board must decide: Are we willing to pay a premium now to ensure that if a catastrophe happens in 80 years, no one is left in harm's way, even if the neighborhood is half-empty by then?"

  ***

  #### MEMO 3: Deferral of Spillway Upgrade
  **Recommendation:** Hard No (Against Deferral)
  **Committee Vote:** 3-0

  **Procedure Output:**
  *   **Part 1 Screening:** Pure Time Preference (Yes, for costs); Delivery Risk (Yes, for safety).
  *   **Part 3 Rates:** Cost savings (Ledger A) at 5%. Risk of Failure (Ledger B) at 2%.
  *   **Part 4 Stopping Rule:** **Risk Adjustment.** Deferring shifts a low-probability, high-consequence risk 40–60 years out.
  *   **Analysis:** Deferring saves $X million today (high value). It risks a catastrophic failure in 2070. Discounting that catastrophe at 5% makes it look negligible today. Discounting at 2% (safety rate) makes the risk loom larger.

  **Board Facing Statement:**
  > "The Committee recommends against deferral. While deferral improves the current year's budget (Ledger A positive), it creates a negative safety NPV (Ledger B).
  >
  > **Uncomfortable Truth:** The Board's inclination to defer is mathematically equivalent to asserting that a catastrophic flood failure in 2070 is worth less than 15% of its actual human cost in today's terms. This is a function of the 5% discount rate applied to safety. Under our new procedure, we cannot discount safety at the market rate of capital.
  >
  > **Legal Exposure:** Deferring this upgrade shifts the risk of failure to residents who have not been born yet. Our legal mandate requires us to count their benefits. By deferring, we are effectively counting their risk as negligible. If you choose to defer, you must publicly state that maintaining current tax rates is prioritized over mitigating a catastrophic risk to future residents. The Committee will not sign off on a recommendation to defer."

  ---

  ### WHAT THIS PROCEDURE SETTLES (AND WHAT IT DOES NOT)

  **What is Settled:**
  1.  **Transparency:** We no longer hide ethical choices inside a "market rate." We explicitly state if we are discounting a future life because we think they will be richer (Growth) or because they are in the future (Pure Time).
  2.  **Consistency:** We cannot claim to value unborn residents while using a discount rate that renders their safety economically invisible.
  3.  **Liability:** The "Hand-Off" rule ensures the Committee does not take political cover for decisions that are actually value judgments. If the math says "spend money to save lives," the Board must own the "spend money" part.

  **What is NOT Settled:**
  1.  **The Value of a Statistical Life (VSL):** The procedure treats safety as a separate ledger, but it does not dictate the dollar value of a life saved. The Board must still approve the VSL parameter used in Ledger B.
  2.  **The Exact Rate:** We have proposed 5% (Financial) and 2% (Safety). These are proxies. If the Board believes the cost of capital is 7% or the social rate is 1%, they may adjust them, but they must do so publicly.
  3.  **The "Levee Effect":** While we count benefits to new residents, we do not settle whether inducing development in flood zones is good policy. We only count the benefits *if* the development occurs. The Board must decide if encouraging that development aligns with broader regional planning.

  **Next Steps:**
  Adopt this procedure as the standard operating protocol for the Investment Committee. Any deviation requires a recorded vote stating which Part of the procedure is being waived and why.
