answer: |-
  # Epistemic Warrant and Risk Assessment Procedure
  **For Internal High-Risk Research Fund**

  ## Preamble: Scope and Limitations
  This procedure assesses the *epistemic warrant* of a proposal's core claims. It does not assess the intellectual merit of the researchers, the social value of the topic, or the strategic needs of the department. It is designed to prevent **Warrant Laundering**: the slippage between funding a project as a *speculative inquiry* and funding it as an *established premise*.

  **Note to Panel:** You are not deciding if the theory is true. You are deciding if the *arguments for working on it* match the *claims made about it*.

  ---

  ## The Decision Procedure (Five Gates)

  **Time Allocation:** 3 minutes per gate. If a gate triggers a **STOP**, the remaining gates are skipped, and the proposal is downgraded to "Exploratory Only" or rejected.

  ### Gate 1: The Aim-Warrant Alignment (Detecting Warrant Laundering)
  **Question:** Does the level of certainty claimed in the *Impact*, *Hiring*, or *Public Engagement* sections exceed the level of certainty justified in the *Epistemic/Methodology* section?
  *   **Sufficient Answer:** The proposal explicitly labels its core framework as "speculative," "heuristic," or "untested" in the Impact/Hiring sections, matching the Methodology section.
  *   **Insufficient Answer:** The Methodology section admits high uncertainty (e.g., "no decisive test available"), but the Impact section speaks of "the predicted landscape," "the default model," or "training students in the established theory."
  *   **Action:** If claims exceed warrant, the applicant must revise the budget to remove public-facing certainty claims (lectures, curricula) or the panel must restrict the award to "Research Only" (no outreach/hiring).
  *   **Stop Rule:** If the applicant refuses to decouple *research* from *doctrine* (e.g., insists hiring lines depend on the theory being treated as fact), **STOP**. Fund as a standard research grant only, or reject.

  ### Gate 2: The Named Alternative (Handling the "No Rivals" Argument)
  **Question:** Has the applicant identified the *best available alternative*, even if undeveloped, and compared the evidence against it?
  *   **Sufficient Answer:** A specific rival framework is named. The proposal explains why the current framework handles the evidence *better* than this rival, even if neither is empirically decisive.
  *   **Insufficient Answer:** "No viable rivals exist."
  *   **Action:** If "No rivals" is claimed, the applicant must document the *search effort* (e.g., "We surveyed X approaches over Y years"). The panel records "Absence of Rivals" as a sociological fact about the field, not evidence of truth.
  *   **Stop Rule:** If the applicant claims "No rivals" but cannot document a search effort, **STOP**. Downgrade Epistemic Score to minimum. This indicates insulation, not uniqueness.

  ### Gate 3: Discriminating Power (The Likelihood Check)
  **Question:** Is the cited evidence (coherence, mathematical consistency, stylized facts) significantly *more expected* under this framework than under the Named Alternative (from Gate 2)?
  *   **Sufficient Answer:** The applicant demonstrates a specific feature (e.g., a duality, a parameter range) that is natural in their framework but awkward or unlikely in the rival.
  *   **Insufficient Answer:** "Our framework accommodates the evidence." (Accommodation is not discrimination).
  *   **Historical Probe (Light):** Would this same argument (e.g., "internal coherence," "no rivals") have funded a framework we now know is false (e.g., steady-state cosmology, phlogiston)?
      *   *Instruction:* Do not research this. Use panel memory. If the argument type matches a known historical failure, flag as **High Risk**.
  *   **Stop Rule:** If the evidence is equally compatible with the rival (or no rival is named), **STOP**. Cap the decision at "Exploratory/Training" level. Do not fund as "Premise-Building."

  ### Gate 4: Selection Effects (The Anthropics/Typicality Check)
  **Question:** Is the measure used to calculate "typicality" or "probability" independent of the outcome it is meant to explain?
  *   **Sufficient Answer:** The measure is derived from independent theoretical constraints (e.g., symmetry, dynamics) *before* applying it to the observed parameter.
  *   **Insufficient Answer:** The measure is chosen *because* it yields the observed value (post-hoc fitting).
  *   **Unfalsifiability Test:** Is there any possible observation that would have counted as "atypical" under this measure?
      *   *Instruction:* If the answer is "No" (the measure can stretch to fit any outcome), the step is locally unfalsifiable.
  *   **Stop Rule:** If the measure is locally unfalsifiable, **STOP**. That specific argument contributes *zero* to the Epistemic Score. It may not be used to justify the award.

  ### Gate 5: The Horizon (Termination and Renewal)
  **Question:** What specific milestone, if not reached by the end of the grant, counts as *failure* (stalling) rather than mere *non-success*?
  *   **Sufficient Answer:** A concrete negative deliverable (e.g., "If we cannot derive X from Y," or "If the simulation fails to reproduce Z stylized fact").
  *   **Insufficient Answer:** "We will continue to explore the parameter space."
  *   **Renewal Clause:** For renewal applications, previous funding counts as *sunk cost*. The Epistemic Score must be recalculated from zero based on *new* warrant generated in the previous period.
  *   **Stop Rule:** If no failure condition is stated, **STOP**. Cap award at one year. Do not renew for a third cycle without a pivot to empirical contact.

  ---

  ## Scoring and Value Separation

  At the end of the Five Gates, the panel must produce two distinct scores. Do not blend them.

  **1. Epistemic Score (0–5)**
  *   Derived strictly from the Gates above.
  *   **0–2 (Speculative):** Warrant is weak or non-empirical. Funding is a bet on *potential*, not *truth*.
  *   **3–4 (Probative):** Strong non-empirical warrant or emerging empirical contact.
  *   **5 (Established):** Empirically tested. (Rare in this fund).
  *   *Constraint:* If Gate 1 triggers a Stop on "Warrant Laundering," the Epistemic Score cannot exceed 2, regardless of technical merit.

  **2. Strategic Value Vote (Pass/Fail)**
  *   This is where the panel addresses opportunity cost, department prestige, training infrastructure, and field diversity.
  *   *Instruction:* A proposal with an Epistemic Score of 1 may still pass the Strategic Value Vote if it trains students in transferable skills (e.g., simulation, mathematics) or maintains departmental presence in a key field.
  *   *Crucial:* The Rationale must state: *"Awarded on Strategic Grounds despite Low Epistemic Warrant."* This prevents the slippage where a strategic bet is later cited as epistemic validation.

  ---

  ## Critique of Your Distinctions

  You asked which of your distinctions do not survive being made usable.

  1.  **"Teach to students" vs. "Use as premise":** Drop this distinction. In a research university, these are functionally identical. If you hire a line to teach it, you are using it as a premise for the department's future. Gate 1 handles this by bundling them as "Institutionalization."
  2.  **"Worth working on" vs. "Live option for public":** Keep this. This is the core of Warrant Laundering. The procedure enforces this by restricting outreach funds in low-warrant cases.
  3.  **"Search probability" vs. "Existence probability":** You are correct that the panel cannot estimate these. The procedure bypasses this by requiring documentation of the *search effort* (Gate 2) rather than a judgment on the *void*. We score the work, not the emptiness.

  ---

  ## Application to Three Cases

  ### Case 1: Eternal Inflation (Cosmology)
  *   **Gate 1 (Aim-Warrant):** **FAIL.** Proposal requests funds for a public lecture series presenting the multiverse as "the likely large-scale shape of things." Methodology section concedes "no decisive test."
      *   *Action:* Panel must strip funding for the lecture series. If the PI refuses, **STOP**.
  *   **Gate 2 (Rivals):** **PASS (Conditional).** Names a single-universe rival but calls it "undeveloped." Panel records this as a sociological fact, not evidence for inflation.
  *   **Gate 3 (Discriminating Power):** **WEAK.** Evidence (vacuum energy value) is accommodated by both, but explained via anthropics in one.
  *   **Gate 4 (Anthropics):** **FAIL.** The measure over possibilities is not independent of the outcome. No observation would rule out the "vast space."
      *   *Action:* This argument contributes zero to Epistemic Score.
  *   **Gate 5 (Horizon):** **PASS.** Three-year limit is clear.
  *   **Verdict:** **Epistemic Score: 1 (Speculative).**
  *   **Decision:** Fund the research *only if* the public lecture series is removed. Rationale must state: *"Funded as exploratory mathematics. Claims regarding the physical reality of the multiverse remain unverified and are not supported by this award."*

  ### Case 2: Quantum Gravity (Third Renewal)
  *   **Gate 1 (Aim-Warrant):** **HARD STOP.** Proposal asks panel to record the framework as the "default setting" for hiring and curricula. This is explicit Warrant Laundering. It seeks to convert a research bet into an institutional ontology.
      *   *Action:* **STOP.**
  *   **Gate 2 (Rivals):** **WEAK.** Cites "long search without alternatives." No specific rival named for comparison.
  *   **Gate 3 (Discriminating Power):** **WEAK.** Cites dualities and mathematical coherence. Historical Probe: This matches arguments for 19th-century ether theories (mathematical elegance, no rivals at the time).
  *   **Gate 5 (Horizon):** **FAIL.** Third renewal. No termination condition stated. Sunk cost fallacy risk is high.
  *   **Verdict:** **Epistemic Score: 1 (Speculative).**
  *   **Decision:** **Reject Renewal.**
  *   **Rationale:** *"While the mathematical program remains rigorous, the request to institutionalize this framework as the 'default' exceeds the epistemic warrant currently available. Third-cycle renewal requires a pivot toward empirical contact or a defined termination condition, neither of which is present. Strategic value does not justify ontological commitment at the departmental level."*

  ### Case 3: Agent-Based Macro (The Colleague)
  *   **Gate 1 (Aim-Warrant):** **PASS.** Proposal frames models as "exploratory tools for mechanism discovery," not "predictive truth." No public claims of having solved macroeconomics.
  *   **Gate 2 (Rivals):** **PASS.** Names DSGE models as the rival. Acknowledges DSGE also fails out-of-sample tests.
  *   **Gate 3 (Discriminating Power):** **PASS.** Argues agent-based models capture *distributional* stylized facts (e.g., fat tails) that DSGE models structurally cannot. This is a comparative advantage, even if both lack out-of-sample prediction.
  *   **Gate 4 (Anthropics):** **N/A.** Not applicable to this field.
  *   **Gate 5 (Horizon):** **PASS.** "If models fail to reproduce volatility clustering under parameter X, the approach is abandoned."
  *   **Verdict:** **Epistemic Score: 3 (Probative).**
  *   **Decision:** **Fund.**
  *   **Rationale:** *"Unlike the fundamental physics cases, this proposal does not claim ontological finality. It claims instrumental superiority in capturing specific statistical features (fat tails) where rivals fail structurally. The warrant is comparative and instrumental, not absolute."*

  **Honest Assessment of Case 3:**
  You asked if saving Case 3 is principled or special pleading.
  It is **principled**, but *only* because of the difference in **Aims (Gate 1)** and **Comparative Utility (Gate 3)**.
  *   *The Trap:* If the Macro proposal claimed "We have found the true structure of the economy," it would fail exactly like the Quantum Gravity case.
  *   *The Save:* The Macro proposal claims "We have a better tool for *this specific puzzle* than the current standard tool."
  *   *Amendment Check:* If you amend the procedure to fund Case 3 *despite* it making ontological claims, that is special pleading. If you fund it because it makes *instrumental* claims, the procedure holds. Ensure your colleague does not drift into ontological claims in the final report.

  ---

  ## The Provost Sentence

  **"This procedure determines whether a proposal's claims match its evidence; it does not determine whether the claims are true, nor does it weigh the scientific merit of one field against another."**
