      *   *The Problem:* In cases like climate change, one person's emissions don't noticeably harm one specific person. The harm is aggregated across millions of acts affecting millions of people. Scanlon's "individualist restriction" (comparing complaints person-to-person) struggles here. If I reject a principle allowing emissions, my burden is high (no driving/heating). If a victim rejects it, their burden is spread out (tiny harm from *me*). So, the emitter wins the "reasonable rejection" contest.
      *   *The Stakes:* If contractualism can't handle this, it fails as a guide for modern policy (climate, AI, public health).

