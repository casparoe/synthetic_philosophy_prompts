answer: |-
  Here is the blunt assessment you need for your feature.

  ### The Core Diagnosis: Mechanism vs. Structure
  **The problem is not just the aggregation mechanism; it is the unit of analysis.**

  Scanlon's framework is built on *individualist restriction*: we compare the complaint of one person against the burden on another. In climate or AI risk, the causal chain is diluted. My carbon emission doesn't kill *you*; it contributes to a system that kills *someone*. If you stick to pairwise comparisons (me vs. you), contractualism will almost always vindicate the emitter. The burden on me (no flight) is concrete; the harm to you (micro-fraction of climate risk) is negligible.

  If you try to "fix" this purely by tweaking the aggregation math (e.g., "sum the tiny harms"), you risk collapsing contractualism into utilitarianism, which defeats the purpose of the theory.

  **Verdict:** The most tractable path isn't fixing the math of aggregation; it's shifting the site of judgment from **individual acts** to **institutional principles**.

  ---

  ### Ranked Live Lines (By Impact & Tractability)

  Here are the three live lines of inquiry, ranked by their potential to actually change moral reasoning at scale.

  #### 1. The Institutional Turn (High Impact, High Tractability)
  *   **The Pitch:** Stop asking "Can *I* reasonably reject this principle allowing my emission?" and start asking "Can *anyone* reasonably reject a principle allowing *institutions* to permit this level of aggregate risk?"
  *   **Why it wins:** This bypasses the pairwise trap. It moves the contractualist debate to the level of policy, regulation, and corporate chartering. It allows philosophers to talk to policy folks without getting stuck in "but my one breath didn't cause the hurricane."
  *   **Downstream Impact:** This justifies carbon taxes, AI safety regulations, and public health mandates. It treats the *scheme* as the agent of potential wronging, not the individual participant.
  *   **Status:** **Push this.** It's the only bridge between high theory and actual governance.

  #### 2. Probabilistic Harm & Ex-Ante Rejection (Medium Impact, Medium Tractability)
  *   **The Pitch:** Focus on the imposition of *risk* rather than realized *harm*. A principle is rejectable if it exposes people to unacceptable probabilities of catastrophe, even if the catastrophe hasn't happened yet or can't be traced to a specific actor.
  *   **Why it wins:** This is crucial for AI and existential risk. In AI, the harm is binary (safe vs. catastrophic) and probabilistic. Contractualism works well here if framed as "reasonable security standards" rather than "compensation for damage."
  *   **Downstream Impact:** Directly informs safety engineering standards and liability frameworks.
  *   **Status:** **Keep in reserve.** It's strong for tech, weaker for climate (where harm is already happening but distributed).

  #### 3. Weighted Aggregation (Low Impact, Low Tractability)
  *   **The Pitch:** Try to modify the "reasonable rejection" criterion to allow summing small complaints across many people to outweigh a large burden on one person.
  *   **Why it stalls:** This is the "academic wheel-spinning" zone. Philosophers have been fighting over this for 30 years (Kamm vs. Scanlon vs. Hooker). If you allow full aggregation, you lose the "individualist restriction" that makes contractualism distinct from utilitarianism. If you don't, you can't solve climate change.
  *   **Downstream Impact:** Minimal. Policy folks don't care about the metaphysics of summing complaints; they care about authority and implementation.
  *   **Status:** **Minimize airtime.** Mention it as the theoretical bottleneck, but don't frame it as the solution.

  ---

  ### The "Distributed Wronging" Angle: Dead End or Push-Worthy?

  **Verdict: Push-worthy, BUT only if reframed as "Complicity in a Scheme."**

  If you frame distributed wronging as "Did Agent A wrong Victim B?" it is a **dead end**. The causal link is too thin, and contractualism will exonerate Agent A every time.

  However, if you frame it as **"Participation in a Wrongful Practice,"** it becomes the most potent angle for your feature.
  *   **The Shift:** The wrong isn't the specific harm caused by *my* act. The wrong is my participation in a *practice* that I know is collectively harmful, without doing my part to support the institutional fix.
  *   **Why it matters:** This creates a duty to *advocate for structural change* rather than a duty to *perfectly purify one's own footprint.* It shifts the moral burden from "don't fly" to "don't fly *and* vote for/regulate the airline."
  *   **For Policy Folks:** This legitimizes regulating industries rather than shaming individuals.
  *   **For Philosophers:** This saves contractualism from irrelevance without destroying its core individualist commitments.

  ### Summary for Your Feature

  1.  **Don't let philosophers get stuck in the aggregation math.** It's a black hole. Acknowledge it, then pivot.
  2.  **Highlight the Institutional Turn.** This is where the theory becomes useful. The question isn't "Is my emission wrong?" it's "Is a system allowing these emissions rejectable?"
  3.  **Frame Distributed Wronging as Complicity.** The moral failure isn't causing harm directly; it's failing to coordinate against a harmful system.
  4.  **The "So What?":** If contractualism can't make this shift, it is obsolete for the 21st century. If it does, it becomes the leading framework for AI governance and climate justice.

  **Headline Hook:** "Scanlon's theory was built for face-to-face morality. To survive climate and AI, it has to learn to govern systems."
