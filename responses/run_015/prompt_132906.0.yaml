          *   *Cons:* Risks collapsing into utilitarianism (which contractualism tries to avoid). Hard to justify within Scanlon's framework without breaking it.
          *   *Impact:* High theoretical impact, moderate policy impact (still need implementation).
      *   *Line 2: Institutional/Principle Level Shift (The "System" Fix).* Moving the site of evaluation from individual acts to institutional rules.
