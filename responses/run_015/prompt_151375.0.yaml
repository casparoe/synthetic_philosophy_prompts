      Elara traced the cuneiform, not with fear, but with syntactic irritation. The translation was standard: *You will meet me in Damascus.* The classic paradox. The merchant runs, Death waits. But Elara wasn't a merchant; she was a semanticist.

      She didn't book a flight to Syria. She booked a ticket to Oslo. "Damascus is a proper noun," she told the taxi driver, watching the rain smear the window. "Fixed reference. Unless it isn't."

      In Oslo, the note was waiting at the hotel desk. Handwritten on crisp linen. *Damascus is chilly this time of year.*

      Elara's breath hitched. She packed immediately. She flew to Santiago. She chose a hostel off the grid, no name on the reservation. Yet, upon arrival, the innkeeper smiled too warmly. "Welcome to Damascus," he said, handing her a key.

      "This is Chile," she snapped.

      "Is it?" He tapped the register. The header read *Hotel Damascus*. She hadn't seen that during booking.

