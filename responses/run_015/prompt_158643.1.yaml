prompt: |-
  In a recent philosophy-of-language seminar, a participant dismissed objections to preserving an archaic grammatical convention by saying, "A norm is just a coordination equilibrium that forgot the problem it solved." I am trying to understand exactly what work that sentence is doing in the argument. Separate the precise theses it could be expressing: for each, say whether it is a near-platitude, a substantive claim defensible within a Lewis-style analysis of convention, or false. In particular, distinguish the reading that treats a norm's persistence past its original coordination problem as automatic or inevitable from the reading that treats such persistence as contingent on continued common knowledge of a preference for conformity, and identify which of these readings would actually support dismissing objections to abandoning the norm. Say which interpretation was likely being invoked to shut down the discussion, and note which features of Lewis's account—mutual expectations, arbitrary alternative solutions, and the preference for coordination over miscoordination—are being retained, distorted, or silently dropped in each reading. Present your analysis as a menu of interpretations with verdicts rather than selecting a single one, and write the response in American English.
