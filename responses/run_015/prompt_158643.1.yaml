answer: |-
  ### Analysis of the Argumentative Move

  The statement "A norm is just a coordination equilibrium that forgot the problem it solved" is a rhetorical compression of David Lewis's account of convention, repurposed to defend conservatism regarding linguistic rules. To understand its work, we must disentangle the descriptive claim (what norms *are*) from the normative implication (why we should *keep* them). The speaker uses this sentence to counter the objection that an archaic grammatical convention should be abandoned because its original utility has vanished.

  Below is a menu of three distinct interpretations of the sentence. Each interpretation offers a different thesis regarding the persistence of norms, carries a different verdict regarding its fidelity to Lewisian theory, and leverages Lewis's features differently to achieve the speaker's goal of dismissing objections.

  ---

  ### Interpretation I: The "Inertial Fossil" Reading
  **Thesis:** Norms originate as solutions to coordination problems, but once established, they acquire a self-perpetuating momentum. Their persistence is automatic or inevitable, sustained by habit or social inertia even after the original coordination problem has completely vanished.

  *   **Verdict:** **False** (within a Lewis-style analysis); **Near-Platitude** (within a sociological or cultural-evolutionary framework).
      *   *Lewisian Analysis:* For Lewis, a convention *is* a coordination equilibrium sustained by *current* mutual expectations and conditional preferences. If the coordination problem vanishes (i.e., agents no longer prefer conforming on the condition that others do), the equilibrium dissolves. A "zombie" convention that persists without a current coordination payoff is not a Lewisian convention; it is merely a habit or a rule enforced by sanction.
      *   *Argumentative Work:* This reading supports dismissing objections by rendering the objector's premise (that the problem is solved) irrelevant. It suggests that the utility of the norm is secondary to its existence; changing it incurs unnecessary friction regardless of its original purpose.

  *   **Lewisian Feature Audit:**
      *   **Mutual Expectations:** **Distorted.** Expectations are reduced to predictions of habitual behavior rather than expectations grounded in rationality or shared preference.
      *   **Preference for Coordination:** **Silently Dropped.** The reading assumes persistence *without* the continued preference for coordinating over miscoordinating on that specific issue.
      *   **Arbitrary Alternatives:** **Retained.** It acknowledges the norm was arbitrary in origin, but implies it is no longer arbitrary in practice because switching is now psychologically or socially costly.

  ### Interpretation II: The "Tacit Knowledge" Reading
  **Thesis:** Norms persist *only* because the coordination problem still exists, even if agents have lost the explicit ability to articulate what that problem is. The "forgetting" refers to a loss of discursive awareness, not a loss of functional pressure. Persistence is contingent on continued common knowledge of a preference for conformity.

  *   **Verdict:** **Substantive Claim Defensible within a Lewis-style Analysis.**
      *   *Lewisian Analysis:* This aligns closely with Lewis. Conventions rely on common knowledge, but agents need not be able to philosophically reconstruct the game matrix to participate in the equilibrium. As long as agents prefer to match others (perhaps to avoid social signaling errors or parsing delays), the convention holds.
      *   *Argumentative Work:* This supports dismissing objections by challenging the objector's factual claim. It implies the objector is mistaken in believing the problem is solved; the problem is merely obscure. The norm is preserved because it is still doing work, not because it is old.

  *   **Lewisian Feature Audit:**
      *   **Mutual Expectations:** **Retained.** Agents still expect others to conform and conform based on that expectation.
      *   **Preference for Coordination:** **Retained.** The preference is assumed to be active, even if the *reason* for the preference is opaque to the agents.
      *   **Arbitrary Alternatives:** **Retained.** The implication is that we could switch, but only if we collectively solved the *current* (hidden) problem with a new arbitrary solution.

  ### Interpretation III: The "Switching Cost" Reading
  **Thesis:** The original coordination problem may indeed be gone, but the *new* coordination problem is "how do we all switch to a new rule simultaneously?" The norm persists because the cost of coordinating on a change outweighs the benefit of solving the archaic problem.

  *   **Verdict:** **Substantive Claim Defensible within a Lewis-style Analysis.**
      *   *Lewisian Analysis:* Lewis acknowledges that conventions have inertia because moving from one equilibrium to another requires a period of vulnerable miscoordination. The "problem it solved" is forgotten, but a new problem (the transition cost) has taken its place.
      *   *Argumentative Work:* This supports dismissing objections by conceding the norm is archaic but arguing that abandonment is pragmatically irrational. It shifts the burden of proof to the objector to propose a viable transition plan.

  *   **Lewisian Feature Audit:**
      *   **Mutual Expectations:** **Retained.** Everyone expects everyone else to stick to the old rule because everyone expects everyone else to fear the transition cost.
      *   **Preference for Coordination:** **Retained.** The preference is now for coordinating on the *old* rule rather than risking miscoordination during a transition.
      *   **Arbitrary Alternatives:** **Retained.** The new rule is an arbitrary alternative, but it is currently inaccessible due to the coordination barrier.

  ---

  ### Synthesis: Which Reading Shuts Down Discussion?

  To determine which interpretation was likely invoked to **dismiss** objections, we must look at the rhetorical effect of the word "just" in the quote ("A norm is *just*...").

  1.  **The Likely Invoked Reading:** **Interpretation I (The Inertial Fossil).**
      *   **Reasoning:** Interpretation II and III invite further inquiry. Interpretation II invites the question, "What is the hidden problem?" Interpretation III invites the question, "What are the specific switching costs?" Interpretation I, however, frames the norm's existence as a brute fact of social physics that renders the "problem" historically irrelevant. By claiming the norm has "forgotten" the problem, the speaker suggests the link between function and form is severed. This effectively shuts down the discussion by categorizing the objection (that the norm is useless) as a category error. It implies: *It doesn't matter why we started; it matters that we are here.*

  2.  **The Reading that Actually Supports Preserving the Norm (Lewisian):** **Interpretation II or III.**
      *   **Reasoning:** If the goal is to defend the norm *within* the logic of the seminar (philosophy of language), Interpretation I is vulnerable. A strict Lewisian would argue that if the coordination preference is truly gone, the norm is not a convention but a coercion or a mere habit, and thus lacks the normative grip of a convention. Interpretations II and III provide a robust defense: the norm is either still functionally active (II) or protected by new coordination costs (III).

  ### Summary of Lewisian Distortions

  The speaker's sentence is rhetorically powerful precisely because it **distorts** Lewis to achieve a conservative conclusion.

  *   **Retained:** The vocabulary of "coordination equilibrium" and the idea that norms are arbitrary solutions (implied by "the problem it solved").
  *   **Distorted:** The nature of "equilibrium." In Lewis's account, an equilibrium is a dynamic state of mutual responsiveness. The speaker treats it as a static historical artifact.
  *   **Dropped:** The requirement for **current conditional preferences**. The quote suggests the norm survives *because* it forgot the problem. Lewis would argue the norm survives *only if* the problem (or a surrogate problem) is still actively driving preferences.

  By treating persistence as **automatic** (Interpretation I) rather than **contingent on common knowledge** (Interpretation II), the speaker transforms a descriptive theory of how language works into a prescriptive shield against reform. This allows them to dismiss objections without having to identify a current utility for the archaic convention.
