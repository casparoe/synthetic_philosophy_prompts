      *   *Specific Questions:*
          1.  *Constraints on Partiality:* Yes. Parents cannot let others starve to buy their child a yacht. This suggests a *sufficiency* cap, not a *priority* cap. Threatens (b).
          2.  *Relationship vs. Action:* It's the relationship (biological/legal guardianship). But membership is non-voluntary for the child. For citizens, it's non-voluntary too. However, parents have a *fiduciary* duty created by bringing the child into existence. States didn't necessarily "create" the citizens in the same way.
          3.  *Shaping Options:* Families don't usually set the rules of the economy that starve outsiders. States do (trade, borders, history). This is a major threat to the family analogy.

  3.  **Analyze Analogy 2: The Joint Enterprise (Cooperative/Crew)**

      *   *Mapping:*
          *   Source: Crew members/Co-op members. Target: Citizens.
          *   Source: Outsiders/Non-members. Target: Foreigners.
          *   Source: Distribution of cooperative surplus. Target: State budget/welfare.
          *   Source: Dividend based on contribution/participation. Target: Social welfare based on citizenship.
          *   Source: Rules of entry/exit. Target: Immigration/Citizenship laws.
      *   *Disanalogies:*
          *   *Surface:* Size, profit vs. public good.
          *   *Threatening:*
              *   For (a) Refugees: Co-ops can exclude to protect shares. But if the co-op monopolizes a resource (fishery), they have duties to those excluded from survival.
              *   For (b) Poverty: Co-ops distribute *surplus*. If domestic poverty is *need-based* not *share-based*, the analogy fails. If the state is a safety net, the co-op analogy (profit sharing) is weak.
              *   Voluntariness: Co-op members usually join voluntarily. Citizens are born in.
      *   *Imports:*
          *   Contractual consent (members agree to rules).
          *   Contribution-based reward (citizenship isn't always earned by contribution).
          *   Excludability of benefits (public goods are often non-excludable).
      *   *Specific Questions:*
          1.  *Constraints:* Co-ops have contract law and anti-trust. But morally? If the co-op monopolizes a life-saving resource, exclusion is harder to justify.
          2.  *Relationship vs. Action:* It's the *participation/contribution*. This hurts the political target because birthright citizens haven't necessarily "contributed" yet (children, disabled).
          3.  *Shaping Options:* A fishery co-op *does* shape options for non-members (they can't fish). If the co-op encloses the commons, they owe restitution. This actually strengthens the duty to outsiders, threatening (a) and (b).

  4.  **Synthesize and Answer the Three Specific Questions:**

      *   *Q1 (Constraints on Partiality):* Family analogy admits constraints (don't let others starve). This supports a *sufficiency* view, not the *strong priority* view in (b). Joint Enterprise admits constraints if the enterprise monopolizes essential resources.
