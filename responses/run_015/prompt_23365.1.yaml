      *   **Format:** Dialogue between two competent philosophers.
      *   **Tone:** Intellectual, responsive, not slogan-heavy, short but dense.
      *   **Specific Constraint:** The PAP defender must argue that the case presupposes the *actual* decision process is responsibility-grounding and that the counterfactual intervener isn't truly irrelevant. The Frankfurt defender must argue that if responsibility holds in the actual sequence, PAP is not necessary.

  2.  **Character Conception:**
      *   **PAP Defender (let's call her "Prudence"):** Focuses on the metaphysical structure of freedom. Suspicious of "finkish" dispositions or hidden causal determinants. Believes the *ability* to do otherwise is constitutive of control, not just a side effect.
      *   **Frankfurt Defender (let's call him "Frank"):** Focuses on the actual sequence. Believes moral responsibility hinges on the actual history of the action, not unactualized possibilities. Sees PAP as a red herring.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Set the scene with the Burger case. Frank introduces it as a knockout blow to PAP.
      *   *Prudence's First Push:* It's not a knockout. You're assuming the burger choice is free *before* you prove PAP is unnecessary. The device creates a "prior sign" problem.
      *   *Frank's Rebuttal:* The sign is just a trigger. The actual choice comes from the agent. The device is idle. Why does an idle machine matter?
      *   *Prudence's Deep Dive (The "Sneaky" Point):* It matters because it changes the *modal profile*. If the device is there, you *couldn't* have chosen salad. You're smuggling in determinism in the counterfactual sequence to trick us about the actual sequence.
      *   *Frank's Counter:* But in the *actual* sequence, you did choose. If the actual sequence is identical to a normal free choice, why does the background noise matter?
      *   *Prudence's Climax:* Because freedom isn't just about what happened; it's about the *space* of what could happen. The device collapses that space. You're defining responsibility by the actual outcome, ignoring the architecture of agency.
      *   *Frank's Closing:* Maybe the architecture is less important than the ownership of the action. If you own the burger, you own the blame/praise, regardless of the salad door being locked.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Critique:* Is Prudence sounding too much like a incompatibilist?
      *   *Fix:* Keep her focused on PAP specifically, not just determinism. Her point is about the *availability* of alternatives, not just causal determination.
      *   *Critique:* Is Frank sounding too dismissive?
      *   *Fix:* Make sure he acknowledges the intuition but explains why it's mistaken. He needs to emphasize the "Actual Sequence" view.
