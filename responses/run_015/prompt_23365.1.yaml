answer: |-
  **Frank:** Let's stick to the menu. You order the burger. The neuroscientist's device is set to intervene *only* if you were going to order salad. Since you ordered the burger, the device stays idle. You did what you wanted. Are you responsible for the burger?

  **Prudence:** Intuitively, yes. But that intuition is doing too much work. You're asking me to confirm responsibility in the actual sequence to prove that alternative possibilities don't matter. But you've only secured that intuition by silently assuming the actual sequence is already freedom-friendly.

  **Frank:** It *is* freedom-friendly. It's a standard deliberation. I want the burger, I choose the burger. The device is a counterfactual ghost; it had no causal impact on the actual choice.

  **Prudence:** But it has a *modal* impact. By placing the device there, you've removed my ability to do otherwise. If PAP is true—if the ability to do otherwise is constitutive of control—then you haven't just added a ghost; you've removed the very ground of my agency. You can't use the case to disprove PAP unless you've already assumed PAP is false in the actual sequence.

  **Frank:** That begs the question. Why does the *ability* to choose salad matter if I never exercise it? Responsibility tracks the actual history of the action. In this history, the source of the action is you, not the device. If the actual sequence is untouched, why does the locked door in the counterfactual sequence invalidate your ownership of the burger?

  **Prudence:** Because the "locked door" changes the nature of the room. You say the device is irrelevant because it didn't fire. But for the device to work as described, there must be some prior sign or neural state that indicates I *will* choose the burger before I actually choose it. If that sign is causally sufficient for the choice, I'm determined. If it isn't, the device can't guarantee I won't choose salad. You're smuggling in determinism to block the alternative, then pretending the actual choice is "free" because the determinist didn't step in.

  **Frank:** Even if we grant a "flicker of freedom" in the prior sign, that flicker isn't morally significant. It's not the robust alternative PAP defenders need. Look, suppose you accept that in the actual sequence, you are the source. You deliberate, you weigh reasons, you act. If that process is sufficient for responsibility in a normal world, why does it cease to be sufficient here? The requirement for "genuine alternatives" seems to be looking in the wrong place. It's looking at the background conditions rather than the actual genesis of the will.

  **Prudence:** Because the genesis of the will isn't isolated from its possibilities. If I *could not* have ordered salad, not because of my reasons or character, but because a machine would have stopped me, then my ordering the burger looks like a fluke of the setup, not an exercise of control. You're asking me to accept that responsibility attaches to the actual sequence *independently* of the agent's modal profile. But if the agent lacks the power to do otherwise, they lack the power to govern their own actions. The device makes you a passenger who happens to be sitting in the driver's seat, not the driver.

  **Frank:** But I *am* steering! The device isn't touching the wheel. If PAP requires that I could have swerved left, even when I freely chose to swerve right, then PAP is demanding a kind of metaphysical slack that doesn't add to my control. The burger case shows that what we care about is *actual* control. If you have that, the lack of alternatives is irrelevant. If you don't have that, alternatives wouldn't save you.

  **Prudence:** Then we're at the impasse. You think the actual sequence is self-contained. I think the actual sequence is only free if it sits within a structure of open possibilities. Your device collapses that structure. So, you haven't shown PAP is false; you've just constructed a scenario where PAP is violated and asked me to judge responsibility based on a different theory. That's not a refutation; it's a circular assertion.

  **Frank:** And I'd say you're insisting on a requirement that adds nothing to the agent's ownership of the act. But fine. At least we agree the burger was delicious.

  **Prudence:** Yes. But only because I could have, in principle, ordered the salad.
