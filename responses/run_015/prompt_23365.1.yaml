  *(Self-Correction during final writing)*: Make sure Prudence hits the specific point about the "prior sign." Frankfurt cases often rely on a "prior sign" that indicates what the agent will do before they do it. If that sign is causally determined, the agent isn't free. If it's not, the device can't be sure. This is the "Flicker of Freedom" strategy. I should incorporate a version of this without getting too bogged down in technical weeds. Let's focus on the user's prompt: "the case only works if you already assume the agent's actual decision process is the kind that makes responsibility attach."

  *Revised Plan for Prudence:* She needs to argue that Frank is *begging the question*. He assumes the agent is responsible in the actual sequence to prove PAP is false. But if PAP is true, the presence of the device might undermine the actual sequence's freedom too (via "finkish" dispositions or just the lack of robust alternatives).

