answer: |-
  You are encountering a classic philosophical problem: the tension between a procedural definition of democracy (fair competition, turnover) and a substantive one (rights, inclusion, rule of law). Your intuitions oscillate because you are trying to apply a single label to two distinct phenomena: the *degradation of institutions* (Hungary, Poland) and the *violation of democratic status* (Saldena, USA). Your tentative principle regarding the "probability of turnover" is sound but insufficient because it ignores the *quality* of that turnover and the *disposition* of the actors.

  To resolve this, I propose a single governing principle, which I shall call **The Principle of Non-Asymmetric Entrenchment**. This principle posits that democracy is defined not merely by the occurrence of elections, but by the preservation of reciprocal vulnerability between the government and the governed (including the opposition). Backsliding is the attempt to insulate the incumbent from the risks that the challenger must face.

  Here is the principle stated precisely, followed by the explication of its clauses, the application to your new case, and the necessary concessions you must make.

  ### The Principle of Non-Asymmetric Entrenchment

  *A political change constitutes democratic backsliding if and only if it is an exercise of public power that creates or exploits a structural asymmetry in the capacity to contest for office, such that the incumbent is insulated from the possibility of defeat to a greater degree than the challenger, or where a segment of the citizenry is excluded from the status of a potential contestant; unless that exercise is demonstrably necessary to restore a prior symmetry.*

  This principle is composed of four clauses, each motivated by one of your problematic cases.

  **1. The Institutional Asymmetry Clause (Motivated by Hungary and Poland 2015–2023)**
  This clause captures your paradigm cases. In Hungary and Poland, the governing parties used legal majorities to rewrite the rules (constitutions, electoral districts, judicial retirement ages) in ways that raised the cost of opposition participation while lowering the cost of incumbent retention.
  *   **Why it fits:** It explains why legal reforms can be backsliding. The issue is not the legality of the act, but the *asymmetry* of its effect. If a reform makes it harder for the opposition to win than it is for the government to stay, it violates the principle.
  *   **Verdict:** Hungary and Poland (2015–2023) are clear instances. The changes were self-entrenching.

  **2. The Normative Disposition Clause (Motivated by the USA 2020–21)**
  This clause addresses your hesitation regarding the American case, where rules were not successfully changed. Backsliding is not merely the *success* of entrenchment, but the *attempt* that reveals a disposition to bypass reciprocal vulnerability if unchecked.
  *   **Why it fits:** Your "fragility" repair is incorporated here. When a president pressures officials to substitute electors, he is attempting to create an asymmetry (his votes count, the opposition's do not). The fact that norms held is irrelevant to the classification of the *act*, though relevant to the classification of the *regime's resilience*.
  *   **Verdict:** The USA episode counts as backsliding behaviour, even if the regime did not slide into autocracy. It was an attempt at asymmetric entrenchment that failed due to normative constraints.

  **3. The Constituent Exclusion Clause (Motivated by Saldena)**
  This clause addresses your intuition that Saldena belongs to the "same story" as Hungary, despite having fair vote counts. Democracy requires a *demos*. If a hereditary minority is barred from standing, the "competition" is not among equals, but among a subset of the population.
  *   **Why it fits:** This distinguishes Saldena from Verdania. In Verdania, anyone can run; the state is biased, but the *status* of the citizen is equal. In Saldena, the status is unequal. Exclusion is the ultimate form of entrenchment: it entrenches the majority against the minority permanently.
  *   **Verdict:** Saldena is democratically defective in a way that qualifies as structural backsliding. The "people" has been gerrymandered ontologically.

  **4. The Remedial Asymmetry Exception (Motivated by Poland 2023)**
  This clause handles your oscillation regarding the new Polish government's actions against the public broadcaster and judiciary. Mechanisms alone do not define backsliding; *telos* (purpose) does.
  *   **Why it fits:** If the aim of the action is to *restore* reciprocal vulnerability (dismantling a captured court), it is not backsliding, even if the tools (legislative overrides) resemble those of the backslider. The asymmetry is temporary and corrective, aimed at re-establishing symmetry.
  *   **Verdict:** Poland 2023 is repair, not backsliding, provided the measures are proportional and sunsetted once symmetry is restored.

  ### Application to the New Case: Decree Powers

  Consider your long-standing democracy where a referendum-backed amendment gives the cabinet power to rule by decree for renewable six-month periods, used so far only for measures with majority support.

  **Verdict:** This constitutes **potential backsliding** that tips into **actual backsliding** depending on the repeal mechanism.
  Under the Principle of Non-Asymmetric Entrenchment, the critical question is not whether the decrees are popular now, but whether they create an asymmetry for the future. If the cabinet can rule by decree, but a successor cabinet *cannot* repeal those decrees without a supermajority, or if the decree power allows the incumbent to alter election administration without legislative scrutiny, it creates asymmetric entrenchment.
  However, even if the decrees are easily repealable, the mere existence of the power lowers the cost of authoritarian action for the incumbent relative to the challenger. It creates a *disposition* risk (Clause 2). Therefore, unless there are robust sunset clauses that automatically expire the power upon a change of government, this counts as backsliding. It insulates the current executive from the friction that the next executive will face.

  ### Theoretical Boundaries: Baselines and Endpoints

  You asked whether backsliding requires a satisfactory baseline (Turkey) and whether it continues once democracy has ended.

  **1. The Baseline Problem (Turkey)**
  Backsliding is a *derivative* concept; it requires a prior state to slide *from*. If the baseline is already hybrid or defective, the terminology shifts.
  *   **Judgement:** Turkey was likely a "defective democracy" prior to the executive presidency. The shift to executive presidency was backsliding *from that baseline*. However, once a regime crosses the threshold into electoral authoritarianism (where turnover is no longer a realistic possibility), the term "backsliding" becomes obsolete. It is replaced by "consolidation" or "repression."
  *   **Principle:** Backsliding applies only so long as the *probability* of turnover remains non-zero. Once the asymmetry becomes total, democracy has ended, and backsliding stops. You cannot slide off the floor.

  **2. The Endpoint**
  A state cannot keep "backsliding" once it has plainly stopped being a democracy. Backsliding describes the *process* of degradation. Once the degradation is complete, the object no longer exists. To speak of backsliding in a full autocracy is a category error; it is merely the maintenance of power.

  ### The Problem of the "Official Sayer"

  You ask whether the verdict belongs to domestic courts, the electorate, external bodies, or retrospective judgement. This is the most difficult pill to swallow.

  **Judgement:** There is **no institutional official sayer**.
  To assign the authority to declare backsliding to a domestic court is to beg the question (the court may be packed, as in Hungary). To assign it to the electorate is to rely on the very mechanism being degraded (voters may re-elect a backslider, as you noted). To assign it to an external body (like the EU) lacks democratic legitimacy within the state.
  **Conclusion:** The verdict is irreducibly **political and retrospective**. It belongs to the opposition's mobilisation and to history. Labeling a regime as "backsliding" is not a legal finding; it is a *revolutionary claim*. It is a call to action asserting that the current government is violating the terms of the democratic contract. Therefore, you must accept that there will be no algorithmic resolution to the disagreement. The "truth" of backsliding is established only when the backsliding is reversed or completed.

  ### The Necessary Sacrifice

  Finally, you asked where this principle forces you to give up a verdict. To maintain consistency, **you must abandon your intuition regarding Verdania.**

  You currently classify Verdania (illiberal but alternating power) as "illiberalism, not backsliding." However, under the Principle of Non-Asymmetric Entrenchment, state-channelled advertising money and restricted speech *do* create structural asymmetry. They raise the cost of contestation for the opposition relative to the incumbent.
  *   **The Concession:** If the illiberalism is severe enough to skew the "fairness of competition," Verdania is not a stable illiberal democracy; it is a case of **slow-motion backsliding**. The fact that power has alternated four times does not prove symmetry; it may prove that the asymmetry has not yet reached the threshold of preventing turnover, or that the opposition is exceptionally robust.
  *   **Why:** If you accept Saldena is backsliding because of exclusion (status asymmetry), you must accept Verdania is backsliding because of resource manipulation (capacity asymmetry). Both degrade the *reciprocal vulnerability* of the competitors. To keep Verdania as "not backsliding" forces you to adopt a purely procedural definition that ignores the *quality* of the contest, which contradicts your inclusion of Saldena.

  ### Summary

  Your seminar should proceed on the basis that democracy is a system of **reciprocal vulnerability**. Backsliding is the attempt to evade that vulnerability.
  1.  **Principle:** Non-Asymmetric Entrenchment.
  2.  **Sayer:** No one institutional; it is a political claim.
  3.  **Sacrifice:** Verdania is likely backsliding, not a stable alternative.
  4.  **Limit:** Backsliding ends when democracy ends.

  This framework preserves your verdicts on Hungary, Poland, the USA, and Saldena, resolves the Poland 2023 "repair" paradox via the Remedial Exception, and forces the necessary rigour on your Verdania intuition. It accepts that the concept is essentially contested, not because it is vague, but because it describes a struggle for power that no neutral arbiter can adjudicate while it is occurring.
