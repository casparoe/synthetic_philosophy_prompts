answer: |-
  ### Exam Question

  **Course:** Philosophy of Science 405: Prediction and Confirmation
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question 1**
  In 1798, Malthus predicted that population growth would inevitably outstrip food production, driving wages to subsistence. Two centuries later, living standards rose and birth rates fell. Defenders of the theory sometimes characterize this not as a refutation, but as a case of being "right but early."

  Evaluate the legitimacy of this defense. In your answer, you must:
  1.  Distinguish between the *core causal mechanism* Malthus proposed and the *auxiliary assumptions* required to generate his specific dated predictions.
  2.  Explain how the Duhem–Quine problem allows the core to be insulated from the failed predictions, and articulate a specific **criterion** for distinguishing a legitimately deferred prediction from a degenerating, unfalsifiable one.
  3.  Apply your criterion to a modern analog: *The Limits to Growth* (1972), which predicted resource exhaustion by the early 21st century. Defenders argue the mechanism remains valid despite the missed dates.

  Is the "right but early" defense philosophically tenable for Malthus? Is it tenable for *Limits to Growth*? Justify your verdicts using the criterion you have constructed.

  ***

  ### Model Answer

  To evaluate the "right but early" defense, we must first dissect the logical structure of Malthus's claim. The **core mechanism** is the geometric growth of population versus the arithmetic growth of resources, creating a pressure toward subsistence. However, the specific prediction (immiseration by date *t*) relied on **auxiliary assumptions**: specifically, that agricultural technology would remain static and that fertility rates would not respond inversely to income (the demographic transition). When living standards rose, it was not the core logic of pressure that was necessarily false, but the auxiliaries regarding technology and human behavior that failed.

  The Duhem–Quine problem dictates that evidence tests a conjunction of theory and auxiliaries, not the core in isolation. When a prediction fails, logic permits us to reject an auxiliary rather than the core. This licenses the "right but early" rescue: the pressure exists, but technological innovation delayed the crisis. However, this rescue risks becoming *ad hoc*. To distinguish a legitimate delay from a degenerating research program, we need a criterion of **independent testability of the rescue**. A deferred prediction is legitimate only if the modification (e.g., "technology will improve") generates *novel* predictions that are independently confirmed, rather than merely accommodating past failures. If the theory is modified simply to say "the crisis will happen later" without specifying *what* must change to delay it, it becomes unfalsifiable in practice. A theory with no deadline for its crisis is compatible with any state of affairs and thus predicts nothing.

  Applying this to Malthus: The defense is weak. While the mechanism of resource pressure is real, the modification required to save the theory (indefinite technological substitution) was not independently testable at the time. The theory absorbed the anomaly of the demographic transition by retreating into a vague "eventually," lacking a specific trigger for when the "Malthusian trap" would re-engage. It became a "wait and see" claim rather than a predictive one.

  Applying this to *The Limits to Growth* (1972): The analog is stronger but still precarious. The model specified feedback loops between capital, pollution, and resources. When exhaustion dates passed, defenders pointed to price mechanisms and efficiency gains (auxiliaries). Unlike Malthus, *Limits* defenders can point to specific ecological thresholds (e.g., CO2 ppm) as new, independently testable deadlines. However, if these new dates are repeatedly pushed back solely by adjusting economic sensitivity parameters without independent evidence of those parameters, the theory degenerates.

  Verdict: "Right but early" is tenable only if the "early" is replaced by a new, independently grounded "when." Malthus failed this; *Limits to Growth* survives only insofar as it shifts from economic dates to biophysical constraints. Without independent constraints on the auxiliaries, the defense is merely a immunization strategy against falsification.

  ***

  ### Marking Scheme

  | **Must-Hit Point** | **Marks** | **Common Error** |
  | :--- | :---: | :--- |
  | **1. Core vs. Auxiliaries:** Clearly distinguishes the abstract mechanism (pressure) from the specific auxiliaries (static tech/fertility) required for the dated prediction. | 5 | Students treat the failed prediction as a direct falsification of the core mechanism without isolating the auxiliaries. |
  | **2. Duhem–Quine Application:** Explains *how* the logic of testing allows the core to be saved by blaming auxiliaries, rather than just name-dropping "Duhem-Quine." | 5 | Candidates assert D-Q allows *any* rescue, missing the point that it creates a problem of choice, not a free pass. |
  | **3. Criterion Construction:** Articulates a specific standard for legitimacy (e.g., independent testability of the rescue, novel predictions, or non-ad-hocness). | 5 | Students recite Lakatos' "positive heuristic" or Popper's "falsifiability" without building a working criterion for *temporal* deferral. |
  | **4. Unfalsifiability Threshold:** Identifies the point where "no deadline" renders the theory compatible with all outcomes (degeneration). | 5 | Confusing "false" with "unfalsifiable"; failing to note that infinite deferral destroys predictive content. |
  | **5. Analog Application:** Consistently applies the constructed criterion to *Limits to Growth*, noting similarities or differences in the rescue strategy. | 5 | Treats the analog as a separate history question rather than testing the philosophical criterion developed in part 1. |

  **A vs. B Distinction:**
  A **B-grade** answer correctly identifies the auxiliaries and applies Lakatosian labels to the cases. An **A-grade** answer constructs a functional criterion for *temporal* legitimacy (e.g., "independent evidence for the delay mechanism") and uses it to drive a nuanced verdict that may differ between Malthus and the analog.

  ***

  ### Examiner's Note

  **Contestable Aspect of the Model Answer:**
  The model answer verdicts that Malthus fails the criterion because the rescue lacked independent testability. This is contestable if one argues that the "preventive check" (moral restraint/fertility decline) *was* part of Malthus's original core, merely underestimated. If the demographic transition is viewed as a Malthusian preventive check triggered by higher wages (rather than an external refutation), the theory remains predictive without *ad hoc* rescue. A student arguing that Malthus was "right" because the mechanism ultimately regulates population via transition rather than starvation could outperform the model answer, provided they justify why the *mode* of regulation doesn't invalidate the *principle* of limits.
