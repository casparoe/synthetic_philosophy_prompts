answer: |-
  Hiya. That late-shift brain fog is real, and what you're describing is a fascinating little glitch in how we process knowledge. It's not just laziness, and it's not quite confirmation bias either.

  Philosophers and psychologists have danced around this, but there isn't one single "famous" word that captures exactly what you're describing. However, we can build a precise picture of it using a few existing concepts, and then I'll offer you a coined term that carves out that specific loop.

  ### 1. What it isn't (and why)

  **It's not Confirmation Bias.**
  Confirmation bias is when you actively seek out evidence that supports what you already believe and ignore evidence that contradicts it. You aren't doing that. You aren't looking for proof you're right; you're looking for *no reason to look at all*. You're avoiding the data collection phase entirely.

  **It's not just "Overconfidence Bias."**
  Overconfidence is the *state* of being more sure than you should be. But you can be overconfident and still check (because you're anxious or diligent). Your phenomenon is the *action* that results from the overconfidence: the decision that checking is now redundant.

  **It's not "Stubbornness."**
  As you said, if you looked and were wrong, you'd admit it. This means your belief isn't rigid; it's just *protected* from testing.

  ### 2. What it actually is: "Epistemic Satisficing"

  The closest existing technical concept is **Epistemic Satisficing**.

  In economics, "satisficing" is when you stop searching for the best option once you find one that is "good enough." In epistemology (the study of knowledge), it's when you stop investigating a truth once you feel you have "enough" certainty to act.

  Normally, this is a survival mechanism. If you hear a rustle in the bushes, you don't need 100% confirmation it's a tiger before you run. You satisfice.

  The problem you're facing is that your internal "sufficiency meter" is calibrated to your **feeling of certainty** (phenomenology) rather than your **actual track record** (statistics). You feel 99% sure, so you mark the inquiry as "Satisfied."

  ### 3. The Line: Sensible Efficiency vs. Dodgy Reasoning

  You asked where the line is between saving effort and being negligent. In philosophy and risk management, this is calculated using **Expected Value**.

  **The Sensible Line:**
  You skip the check if:
  *(Cost of Checking) > (Probability of Error × Cost of Error)*

  *   **Example:** You're 99% sure the till is right. Checking takes 2 minutes. A £5 error costs the company £5.
      *   Cost of Check: 2 mins labour (say £0.50).
      *   Expected Cost of Error: 1% chance × £5 = 5 pence.
      *   **Verdict:** It is mathematically rational to skip the check.

  **The Dodgy Line (Where you are):**
  The calculation breaks because your "Probability of Error" is subjective.
  *   You *feel* the error rate is 1%.
  *   But on late shifts, fatigued, your actual error rate might be 10%.
  *   **Verdict:** You are making a rational decision based on irrational data.

  The line is crossed when **Subjective Confidence** replaces **Procedural Verification**.
  *   **Sensible:** "I'm skipping this check because the risk is low and I have verified this specific task 1,000 times with 100% accuracy." (Calibrated Confidence).
  *   **Dodgy:** "I'm skipping this check because I *feel* like I'm right." (Uncalibrated Confidence).

  ### 4. A Coined Term: "The Certainty Exemption"

  Since there isn't a perfect single word, I propose we call this **The Certainty Exemption**.

  **Definition:** *The cognitive act of granting oneself permission to bypass verification protocols solely on the basis of high subjective confidence, treating the feeling of certainty as equivalent to the fact of accuracy.*

  **Why this term works:**
  1.  **Exemption:** It highlights that you are exempting yourself from a rule (double-checking) that usually applies.
  2.  **Certainty:** It identifies the trigger. It's not laziness; it's the *feeling of sureness* that grants the exemption.
  3.  **The Trap:** It implies that the exemption is self-granted, not earned. You are the judge and the jury.

  ### 5. How to hack it (The Leeds Shift Fix)

  Knowing the name helps, but knowing the mechanism helps more. The issue is that **fluency feels like truth.** Because the memory of counting the till or sending the email comes to you easily (fluently), your brain assumes it must be correct.

  To stop the **Certainty Exemption**, you need to decouple the *feeling* from the *action*.

  *   **The "Robot Rule":** Make checking a procedural requirement, not a confidence-based choice. "I check the till not because I'm unsure, but because that is what the hands do at 2 AM."
  *   **Reframe the Check:** Don't view the check as "testing if I'm right." View it as "closing the loop." The email isn't "sent" until the sent folder is open. The till isn't "closed" until the second count is done.
  *   **Fatigue Tax:** Acknowledge that on late shifts, your "Certainty Exemption" threshold is broken. Your brain lies to you more when you're tired. Adopt a rule: *After 1 AM, confidence counts for zero. Only evidence counts.*

  **Summary:**
  You're experiencing **Epistemic Satisficing** driven by the **Overconfidence Effect**, resulting in **The Certainty Exemption**. It's not a character flaw; it's a metacognitive glitch where your brain tries to save energy by trusting its own vibe over the data. The fix isn't to trust yourself less, but to trust the *process* more.

  Hope that helps with the late shifts. Keep the kettle on.
