prompt: |-
  I'm a software engineer with no formal philosophy background, and I lead a four-person modeling team inside an infrastructure organization. We build the simulation and forecasting models that our own decisions run on: a discrete-event simulator of a request-routing fleet, a cost model behind our autoscaler, a digital twin of a warehouse robot fleet, and a physics simulator used to train a robot grasping policy that is later transferred onto real hardware. These are not academic exercises. Their outputs size fleets, choose scaling thresholds, decide how many robots we buy, and once a quarter feed a recommendation on multi-year infrastructure commitments. Every week we hold a forty-minute design review in which the same argument recurs: someone proposes a model or a change to one, someone else points out that an assumption inside it is flatly false, and the proposer replies that every model is false somewhere and what matters is whether the predictions come out right. I have to rule on that argument, and I want a better instrument than my gut.

  The reply my team gives is, as far as I can tell, a version of a position from Milton Friedman's 1953 lead essay in Essays in Positive Economics: a hypothesis should be judged by the accuracy and scope of its predictions rather than by whether its assumptions describe reality, and — the part Samuelson is said to have nicknamed the F-twist — the more significant a hypothesis is, the more unrealistic its assumptions will tend to be, because a powerful hypothesis strips away everything that does not matter for prediction. The examples I have seen secondhand make the point vividly: an expert pool player sinks shots as if he had solved the geometry, and firms behave as if they maximized profits, whether or not anyone inside them does the calculation. As a slogan this has been useful to us. As a rule for design review it is far too permissive: some of our false assumptions have cost us money, one of them contributed to an outage, and predictions-are-what-matter does not separate those from the false assumptions that have never harmed us.

  What I have been fumbling toward on my own is something I call the sealed-falsehood rule. A false assumption is licensed for a given use only if all of the following hold. (1) Swap-stability: the quantities the model exports to the decision are insensitive, within a tolerance named in advance, to replacing the false assumption with any member of a stated family of alternative falsehoods. (2) Regime match: the model's track record comes from a regime that includes the one it will be used in, not merely from a convenient historical period. (3) Decision-invariance or known direction: either the consumer of the model uses only an ordering, a threshold, or a sign that the error cannot flip, or we can state the direction in which the falsehood pushes the answer. (4) No free pass for compensating errors: if two falsehoods push in opposite directions and cancel, each must satisfy (1) through (3) on its own, because a cancellation that holds in one regime need not hold in another.

  I do not trust this rule, and I can see at least one place where it may be too weak. Here are five cases from our own work, with my verdicts.

  Case 1. The fleet simulator assumes service times are exponentially distributed. Real traces are heavy-tailed and bimodal, and a nightly batch job changes the shape. Used to size the fleet against a p99 latency objective, the simulator has been backtested against load tests and gets the required fleet size within a few percent. My verdict: the falsehood is fine for fleet sizing. But the same simulator, unchanged, is now proposed for predicting what happens if we triple the retry budget, which makes the workload far burstier than anything in the load tests. My verdict: not fine without new experiments.

  Case 2. The autoscaler cost model assumes Poisson arrivals. Arrivals are actually bursty and correlated, and absolute predicted queue lengths are off by roughly a factor of two. But we use the model only to rank two candidate scaling thresholds, and a load test confirms the ranking is identical under synthetic and real traces. My verdict: acceptable. The absolute numbers are wrong and it does not matter, because the consumer consumes only an ordering.

  Case 3. The robot-fleet digital twin assumes robots never collide with one another and that the floor is empty of humans. Both are false. Ignoring collisions inflates predicted throughput; ignoring humans, who cause robots to slow and yield, deflates it. In the one pilot we ran the two errors roughly cancelled and the model predicted throughput well. The pilot, however, ran on a quiet shift with very few humans on the floor. My verdict: not acceptable, and I actively distrust the good prediction. I think my regime-match clause catches this, but I also think swap-stability is satisfied by construction if I am allowed to define the swap family narrowly — swapping no collisions for a few collisions — so I need to know what constrains the choice of family, who chooses it, and how wide it must be.

  Case 4. The grasping simulator assumes perfectly rigid bodies and frictionless contact. Both are false: real objects deform and friction matters a great deal. We train the policy in this simulator and transfer it to real robots, and it works, because we randomize friction, mass, and stiffness over wide ranges instead of committing to single false values. My verdict: acceptable, and I suspect my swap-stability idea is exactly what explains why — domain randomization is the swap test run with a distribution. But I do not know what the procedure should demand about the width or the centering of that randomization when we do not know the true values, and I suspect that passing here is partly luck.

  Case 5. The capacity forecast behind the three-year commitment assumes the mix of request types stays fixed at last quarter's mix. The backtest over eight quarters is excellent. A large new customer with a structurally different workload begins onboarding next month, so the mix will not stay fixed. My verdict: I want to use this model, because it is the only forecast we have and the commitment deadline is real. I expect an honest procedure to refuse to bless it.

  Cases 2 and 3 are the pair I cannot reconcile on my own: in one, a badly wrong exported number is harmless; in the other, a right exported number is worthless. If your account has to overturn one of those two verdicts to stay simple, say so and say which.

  What I want from you has two parts. First, test my rule against the five cases and repair it: tell me which of my verdicts it cannot produce, which clause does no work or is too vague to apply, and what you would add or delete. Second, turn the repaired rule into a written procedure my team can actually run in a forty-minute review: the questions in order, what counts as a sufficient answer to each, the gates at which the procedure stops with a no, and the points at which it must hand the decision to a named person because the question is one of risk appetite rather than of fact. The reviewers are engineers who will not read philosophy, so keep the translation honest — mark the steps that are judgment calls dressed up as procedure, and do not let the checklist imply more precision than it has.

  Then run the finished procedure on three live proposals: reusing the fleet simulator from Case 1 to choose request timeout values, a quantity it has never been validated against; the three-year commitment in Case 5, where I expect the procedure to tell me something I do not want to hear; and a forecast for a workload that launched last week and for which we have no historical data at all. For each, give the verdict, the gate it turns on, and who has to sign off.

  Finally, state plainly what the procedure cannot do — in particular how it behaves when there is no validation data, when a model is quietly reused for a purpose nobody wrote down, when the failure mode is an unknown unknown, and whether passing the procedure is any evidence at all that the model's assumptions are true. Please do not give me a reading list or citations. I need something I can paste into our review template.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Software engineer, lead of a 4-person modeling team in infrastructure.
      *   **Context:** High-stakes modeling (simulation, forecasting, digital twins) driving real-world decisions (fleet sizing, autoscaling, capital expenditure, robot policy).
      *   **Problem:** Recurring design review argument: "All models are false, predictions matter" (Friedman's F-twist) vs. "False assumptions cost us money/caused outages."
      *   **Current Attempt:** "Sealed-Falsehood Rule" (Swap-stability, Regime match, Decision-invariance, No compensating errors).
      *   **Specific Pain Points:** Reconciling Case 2 (wrong number, right order = OK) vs. Case 3 (right number, wrong physics/canceling errors = Not OK). Needs a actionable procedure for 40-min reviews. Needs to run the procedure on 3 specific live proposals. Needs limitations stated plainly.
      *   **Constraints:** No philosophy reading list. Needs to be pasteable into a review template. Honest about judgment calls.

  2.  **Evaluate the "Sealed-Falsehood Rule":**
      *   *Strengths:* It captures the intuition that robustness matters more than truth (Swap-stability), context matters (Regime match), and usage matters (Decision-invariance). It correctly identifies compensating errors as dangerous (Case 3).
      *   *Weaknesses:*
          *   "Swap-stability" is vague on *how* to define the family of alternatives. (Case 3 concern).
          *   "Regime match" is binary (in/out) but reality is a spectrum of drift.
          *   It doesn't explicitly handle *unknown unknowns* or *novel regimes* well (Case 5).
          *   It needs to distinguish between *validation* (does it predict history?) and *verification* (is the logic sound?).
      *   *Case 2 vs. Case 3 Reconciliation:*
          *   Case 2: The error is *structural* (Poisson vs. Bursty) but the *decision function* (ranking thresholds) is robust to that specific structural error *within the tested regime*. The error is monotonic or consistent enough that the ordering holds.
          *   Case 3: The error is *compensating* (Collision $\uparrow$ Throughput, Humans $\downarrow$ Throughput). The net error is zero *now*, but the components are sensitive to regime changes (quiet shift vs. busy shift). This violates Swap-stability *and* Regime match.
          *   *Key Distinction:* Case 2's error is *stable* across the relevant decision boundary. Case 3's error is *fragile* because it relies on a cancellation that isn't structurally guaranteed.
      *   *Verdict:* Keep Case 2 (Acceptable), Keep Case 3 (Unacceptable). The rule needs to sharpen "Compensating Errors" to explicitly forbid reliance on cancellation unless *each* error is individually bounded/stable.

  3.  **Refine the Rule into a Procedure:**
      *   Need to make it actionable for engineers.
      *   Structure: Input -> Gates -> Output.
      *   Language: Engineering terms (sensitivity, bounds, regime, decision boundary).
      *   Timebox: 40 minutes means it can't be a full audit. It must be a *risk assessment*.
      *   *Additions:*
          *   Explicit "Purpose Statement" (prevents silent reuse).
          *   "Sensitivity Budget" (quantifies Swap-stability).
          *   "Error Mechanism" (distinguishes stable bias from fragile cancellation).
      *   *Deletions:* Philosophical jargon ("Positive Economics", "F-twist").

  4.  **Drafting the Procedure (Iterative Process):**
      *   *Step 1: Purpose.* What decision does this drive? (Prevents Case 5 misuse).
      *   *Step 2: Assumptions.* List the known falsehoods.
      *   *Step 3: Sensitivity (Swap-stability).* If we wiggle this assumption, does the decision change?
      *   *Step 4: Regime.* Is the future like the past? (Prevents Case 1 retry budget issue).
      *   *Step 5: Error Structure.* Are errors canceling? (Prevents Case 3).
      *   *Step 6: Sign-off.* Who owns the risk?

  5.  **Running the Procedure on Live Proposals:**
      *   *Proposal A (Fleet Simulator for Timeouts):*
          *   Purpose: Timeout tuning (new purpose).
          *   Regime: Validation was on fleet sizing (p99 latency), not timeout-induced load shapes.
          *   Verdict: Fail Gate 4 (Regime). Needs new validation.
      *   *Proposal B (3-Year Commitment with New Customer):*
          *   Purpose: CapEx.
          *   Regime: New customer = structural break.
          *   Verdict: Fail Gate 4 (Regime). Requires Risk Owner sign-off (Case 5 dilemma).
      *   *Proposal C (New Workload, No Data):*
          *   Purpose: Forecasting.
          *   Data: None.
          *   Verdict: Fail Gate 3 (Sensitivity/Validation). Cannot establish bounds.

  6.  **Addressing Limitations:**
      *   No validation data? Procedure forces a "High Risk" flag.
      *   Silent reuse? Procedure requires explicit Purpose Statement.
      *   Unknown unknowns? Procedure cannot catch them; it only manages *known* falsehoods.
      *   Truth? Passing doesn't mean true, means "robust enough for this decision."

  7.  **Refining the Output:**
      *   Ensure the tone is professional, direct, and engineering-focused.
      *   Make sure the Case 2 vs. Case 3 distinction is clear in the "Error Structure" section.
      *   Ensure the "Who signs off" part distinguishes between technical validity and business risk.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Swap-stability" too hard to test in 40 mins?
      *   *Fix:* Rename to "Sensitivity Check." Require *one* perturbation test, not a full family analysis, unless high risk.
      *   *Critique:* Case 5 is tricky. The user *wants* to use it.
      *   *Fix:* The procedure must say "No" technically, but allow a "Risk Acceptance" path where a VP/Director signs off knowing the model is invalid. This separates engineering truth from business gamble.
      *   *Critique:* Case 3 (Compensating errors).
      *   *Fix:* Make the rule: "If errors cancel, each must be bounded independently." If you can't bound the collision error alone, you can't use the cancellation.

  9.  **Final Polish:** Check against all constraints (no citations, pasteable template, specific verdicts on the 3 live proposals). Ensure the "Case 2 vs 3" reconciliation is explicit in the analysis section.

  *(Self-Correction on Case 2 vs 3)*: I need to be very clear why Case 2 passes and Case 3 fails.
  Case 2: Error is *bias*. Bias is consistent. Ranking is invariant to consistent bias.
  Case 3: Error is *variance/fragility*. Cancellation depends on specific ratios of humans/robots. Change ratio -> cancellation breaks.
  The procedure needs to catch "Fragile Cancellation."

  10. **Finalizing the Text:** (Drafting the response based on these thoughts).
answer: |-
  ### Part 1: Analysis and Repair of Your Rule

  Your "Sealed-Falsehood Rule" is structurally sound but operationally vague. It correctly identifies the four vectors of model risk (Sensitivity, Regime, Decision Impact, Error Structure), but it leaves too much room for the proposer to define the terms of their own defense.

  **Reconciliation of Case 2 vs. Case 3**
  You do not need to overturn either verdict. They are consistent under a stricter definition of **Error Structure**.
  *   **Case 2 (Acceptable):** The error is a *stable bias*. The model consistently overestimates queue length by ~2x. Because the decision is a *ranking* (Threshold A vs. Threshold B), and the bias is monotonic (it pushes both candidates in the same direction), the ordering is invariant. The falsehood is "sealed" because the decision boundary is far from the error margin.
  *   **Case 3 (Unacceptable):** The error is a *fragile cancellation*. Throughput = (Base) + (Collision_Error) + (Human_Error). You are relying on $Collision\_Error \approx -Human\_Error$. This equality holds only at a specific ratio of humans-to-robots. As soon as the regime shifts (busy shift), the ratio changes, the cancellation breaks, and the error explodes.
  *   **The Fix:** Your "No free pass for compensating errors" clause is correct but needs teeth. It must require that *each* error source be bounded individually, not just the net sum. If you cannot bound the collision error without the human error, the model is invalid.

  **Critique of Your Clauses**
  1.  **Swap-stability:** Too vague on "stated family." In a 40-minute review, no one will derive a family of distributions.
      *   *Repair:* Rename to **Sensitivity Budget**. Require a specific perturbation test (e.g., "Change service time variance by +50%") and a defined tolerance on the *decision output*, not the model output.
  2.  **Regime match:** "Includes the one it will be used in" is binary. Reality is continuous drift.
      *   *Repair:* Rename to **Regime Boundary**. Require the proposer to state the *breaking point* (e.g., "Valid up to 2x current load" or "Valid only if request mix variance < 10%").
  3.  **Decision-invariance:** Good, but needs to distinguish between *optimization* (finding a minimum) and *selection* (A vs. B).
      *   *Repair:* Keep, but specify that if the model is used for optimization, the error gradient must not flip.
  4.  **No free pass:** As noted above, needs to mandate independent bounding.

  **Added Clause: Purpose Lock**
  Your Case 5 and the "silent reuse" risk show a missing gate. A model validated for *sizing* is not validated for *timeout tuning*.
  *   *Add:* **Purpose Statement.** The model is licensed *only* for the specific decision variable stated in the review. Reuse requires re-validation.

  ---

  ### Part 2: The Model Risk Review Procedure

  Copy the text below into your review template. It is designed for a 40-minute meeting. It forces specific answers and identifies exactly where judgment calls happen.

  #### **Model Risk Review Checklist**

  **Pre-Work (Proposer):** Fill out Section 1 before the meeting.
  **Reviewers:** Engineering Lead (You), Domain Owner, Risk Owner (if applicable).
  **Timebox:** 40 Minutes. If Gate 3 or 4 fails, stop and escalate.

  ---

  #### **Section 1: Purpose & Decision (5 mins)**
  *Goal: Prevent silent reuse and define what "wrong" means.*

  1.  **Decision Statement:** What specific number, ranking, or policy will this model output?
      *   *Example:* "Select autoscaler threshold A or B," NOT "Understand system behavior."
  2.  **Cost of Error:** If the model output is wrong, what happens?
      *   [ ] Waste money (over-provisioning)
      *   [ ] Lose availability (under-provisioning/outage)
      *   [ ] Physical damage (robot collision)
      *   [ ] Strategic drift (wrong 3-year commitment)
  3.  **Purpose Lock:** Is this model being used for the exact same decision variable it was validated for previously?
      *   [ ] Yes (Proceed)
      *   [ ] No (Trigger **Gate 1**: Requires new validation data. Stop if none exists.)

  #### **Section 2: The Falsehoods (10 mins)**
  *Goal: List the known lies.*

  4.  **Known Falsehoods:** List the top 3 assumptions known to be physically or statistically false.
      *   *Example:* "Service times are Exponential (actually Heavy-tailed)."
  5.  **Error Mechanism:** For each falsehood, does it create a **Bias** (consistent over/under estimate) or a **Variance** (unpredictable swing)?
      *   *Constraint:* If two falsehoods are claimed to cancel out (Bias + Bias = 0), proceed to **Gate 2**.

  **[GATE 2: Compensating Errors]**
  *If errors cancel, can you bound the magnitude of **each** error independently?*
  *   [ ] **Yes:** We know Collision Error is <5% and Human Error is <5% separately. (Proceed)
  *   [ ] **No:** We only know the *sum* is small. ( **STOP**. Model Rejected. Cancellation is fragile.)

  #### **Section 3: Sensitivity & Regime (15 mins)**
  *Goal: Test robustness.*

  6.  **Sensitivity Budget:** If we perturb the false assumption by a realistic amount (e.g., +50% variance), does the **Decision** change?
      *   *Requirement:* Do not test model accuracy. Test decision stability.
      *   *Example:* "If service time variance doubles, do we still pick Threshold A?"
      *   [ ] **Decision Stable:** (Proceed)
      *   [ ] **Decision Flips:** ( **STOP**. Model Rejected. Assumption is critical.)
  7.  **Regime Boundary:** Define the edge of the valid regime.
      *   *Requirement:* "Valid for load X to Y," or "Valid for Request Mix Z."
      *   *Question:* Does the proposed use case fall inside this boundary?
      *   [ ] **Inside:** (Proceed)
      *   [ ] **Outside/Unknown:** ( **STOP**. Go to Gate 4.)

  **[GATE 4: Regime Break]**
  *If the use case is outside the validated regime (e.g., new customer, new workload, 3x load):*
  *   [ ] **Technical Fix:** We can run a load test/simulation to validate the new regime before commitment. (Proceed after test).
  *   [ ] **Business Gamble:** We cannot validate, but must decide. (Escalate to Risk Owner).

  #### **Section 4: Sign-off (10 mins)**
  *Goal: Assign accountability.*

  8.  **Verdict:**
      *   [ ] **Approved:** Assumptions false, but decision is robust.
      *   [ ] **Approved with Conditions:** Valid only if [Condition] is monitored.
      *   [ ] **Rejected:** Sensitivity or Regime failure.
      *   [ ] **Risk Acceptance:** Model is technically invalid, but business risk is accepted.

  9.  **Signatures:**
      *   **Engineering Lead:** Certifies Sensitivity & Regime analysis is honest.
      *   **Risk Owner (Director/VP):** Required *only* if "Risk Acceptance" is selected. Certifies they understand the model is lying and accept the cost.

  ---

  ### Part 3: Running the Procedure on Live Proposals

  Here is the application of the procedure to your three specific cases.

  #### **Proposal 1: Fleet Simulator for Request Timeouts**
  *Context: Reusing the Case 1 simulator (validated for fleet sizing) to tune request timeout values.*

  *   **Section 1 (Purpose):** Decision is "Choose Timeout Value." Previous validation was "Size Fleet for P99."
  *   **Gate 1 (Purpose Lock):** **FAIL.** This is a new decision variable. Timeout tuning depends on tail latency shape differently than fleet sizing does.
  *   **Verdict:** **Rejected.**
  *   **Reason:** Silent reuse. The model may be robust for sizing (integral of load) but fragile for timeouts (specific tail cutoff).
  *   **Action:** Proposer must run a sensitivity test specifically on timeout decisions before review can continue.
  *   **Sign-off:** Engineering Lead (You).

  #### **Proposal 2: Three-Year Commitment (Case 5)**
  *Context: Forecasting capacity with a new customer onboarding. Mix will change. No other model exists.*

  *   **Section 1 (Purpose):** Decision is "Multi-year Capital Commitment." Cost of Error: Strategic drift / Waste.
  *   **Section 2 (Falsehoods):** Assumption: "Request mix stays fixed." Mechanism: Bias.
  *   **Section 3 (Regime):** Proposed use is "Next 3 years." Validated regime is "Past 8 quarters."
  *   **Gate 4 (Regime Break):** **FAIL.** New customer = structural break. Validated regime does not include the future state.
  *   **Path:** Technical Fix is impossible (cannot load test 3 years out). Must take "Business Gamble" path.
  *   **Verdict:** **Risk Acceptance.**
  *   **Reason:** The procedure correctly identifies the model is technically invalid for this regime. It does not forbid the decision, but it forbids pretending the model is truth.
  *   **Sign-off:** Engineering Lead (certifies the model is invalid) + **VP/Director** (certifies they accept the risk of committing based on a known-bad forecast).

  #### **Proposal 3: Forecast for New Workload (No Data)**
  *Context: Workload launched last week. No historical data.*

  *   **Section 1 (Purpose):** Forecasting demand.
  *   **Section 2 (Falsehoods):** All assumptions are unverified.
  *   **Section 3 (Sensitivity):** Cannot perform Sensitivity Budget. No baseline to perturb.
  *   **Section 3 (Regime):** No historical regime to match against.
  *   **Gate 4 (Regime Break):** **FAIL.** Unknown regime.
  *   **Path:** No Technical Fix possible immediately.
  *   **Verdict:** **Rejected** (for use as a forecast).
  *   **Reason:** You cannot establish Swap-stability or Regime match without data.
  *   **Action:** Model may only be used as a "Scenario Generator" (e.g., "If X happens, we need Y"), not as a predictor.
  *   **Sign-off:** Engineering Lead.

  ---

  ### Part 4: Limitations of the Procedure

  You asked for plain statements on what this cannot do. Paste this at the bottom of your template.

  1.  **No Validation Data:** If there is no historical or load-test data, this procedure cannot validate the model. It can only classify the model as "High Risk / Scenario Only." It cannot manufacture truth from ignorance.
  2.  **Silent Reuse:** This procedure only works if the team declares the *Purpose* honestly. If an engineer uses a "Fleet Sizing" model to tune "Timeouts" without declaring it in Section 1, the procedure will not catch it. This is a culture problem, not a checklist problem.
  3.  **Unknown Unknowns:** This procedure manages *known* falsehoods (e.g., "We know arrivals aren't Poisson"). It cannot protect against assumptions we don't know we are making (e.g., "We assume the network doesn't partition").
  4.  **Truth vs. Robustness:** Passing this procedure is **not** evidence that the model's assumptions are true. It is evidence that the *decision* is robust to the assumptions being false. A model can pass this review and still be physically wrong.
  5.  **Judgment Calls:**
      *   **Sensitivity Budget:** Deciding *how much* to perturb an assumption (e.g., +10% vs +50%) is a judgment call.
      *   **Risk Acceptance:** Deciding whether a "Business Gamble" is worth taking is a management decision, not an engineering one. The procedure forces this into the open but cannot solve it.

  ### Summary of Changes to Your Thinking
  *   **Case 2 vs 3:** Resolved by distinguishing *Stable Bias* (Case 2) from *Fragile Cancellation* (Case 3). The procedure kills Case 3 at Gate 2.
  *   **Case 5:** Resolved by separating *Technical Validity* (Engineering Lead says "Invalid") from *Business Risk* (VP says "Do it anyway"). This protects your team's integrity while allowing the business to take calculated gambles.
  *   **Friedman's F-Twist:** You have moved from "Assumptions don't matter" to "Assumptions matter only insofar as they threaten the decision." This is the engineering translation of instrumentalism.
