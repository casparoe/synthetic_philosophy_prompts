answer: |-
  ### The Incoherence of Bayesian Conditioning on Proofs and the Case for Logical Induction

  The standard Bayesian framework provides a robust normative account for managing empirical uncertainty. By treating beliefs as probabilities constrained by the axioms of probability theory, an agent can update on new sensory data via conditionalization. However, when this framework is applied to **logical uncertainty**—specifically, an agent's uncertainty regarding the truth of decidable mathematical statements prior to finding a proof—it collapses into incoherence. The standard Bayesian treatment forces a dilemma between logical omniscience and admitted irrationality, rendering the process of mathematical discovery unintelligible.

  The correct account of rational belief in this domain is provided by the **Logical Induction** principle (Garrabrant et al., 2016). This framework resolves the Bayesian dilemma by reframing rationality not as a static state of coherence, but as a dynamic property of a learning trajectory. While Logical Induction requires that credences in tautologies converge to one in the limit (asymptotic logical omniscience), it mandates logical imperfection at any finite time. This tension is not a defect but a necessary feature that respects computational boundedness. Furthermore, Logical Induction is best understood not as a one-shot coherence constraint, but as a dynamic generalization of the Dutch Book argument, protecting the agent from exploitation over time rather than at a single instant.

  #### The Incoherence of Bayesian Conditioning on Proofs

  The fundamental failure of the Bayesian approach to logical uncertainty stems from the **problem of logical omniscience**. In standard probability theory, if a statement $T$ is a logical tautology (or a theorem derivable from axioms $A$), then $P(T|A) = 1$. This is a consequence of the requirement that probability distributions be consistent with the underlying logic. If an agent assigns $P(T) < 1$ to a truth, they are technically incoherent and vulnerable to a Dutch Book.

  This creates an impossible standard for any computationally bounded agent. Consider a mathematician considering the Riemann Hypothesis ($RH$).
  1.  **If the Bayesian is coherent:** They must assign $P(RH) = 1$ (if true) or $P(RH) = 0$ (if false) immediately, regardless of whether they have seen a proof. This implies the agent already knows all logical consequences of their axioms. It renders the activity of proving theorems pointless; one cannot "learn" a proof if one is already required to believe the conclusion with certainty.
  2.  **If the Bayesian is realistic:** They assign $P(RH) \in (0, 1)$ while the proof is unknown. Upon finding the proof, they update to $P(RH) = 1$. However, this update reveals that the agent was *incoherent* prior to the proof. In the Bayesian framework, updating on a proof is not learning new evidence about the world; it is realizing a logical relation that already held. Therefore, the pre-proof credence was an error.

  This creates a paradox of rationality. To be rational (coherent), one must be omniscient. To be non-omniscient (human), one must be irrational (incoherent). The Bayesian framework treats the discovery of a proof as a correction of a prior mistake rather than an accumulation of knowledge. It cannot model the *process* of reasoning, only the static endpoints. Consequently, treating one's own proofs as "evidence" in the standard Bayesian sense is incoherent because it conflates **logical implication** (which is timeless) with **computational derivation** (which takes time).

  #### Logical Induction and the Necessity of Imperfection

  Logical Induction (LI) resolves this by decoupling coherence from immediate logical consistency. In the LI framework, an agent's beliefs are represented as prices in a logical market. A statement $\phi$ is assigned a price $P_t(\phi) \in [0, 1]$ at time $t$. The core criterion of rationality is that no polynomial-time trading algorithm can exploit these prices to make unbounded profit.

  This framework introduces a critical tension:
  1.  **Asymptotic Omniscience:** In the limit as $t \to \infty$, the credences must converge to the truth values. If $\phi$ is a theorem, $P_t(\phi) \to 1$.
  2.  **Finite Imperfection:** At any finite time $t$, $P_t(\phi)$ is permitted to be strictly less than 1, even if $\phi$ is provable.

  This tension is often mistaken for a weakness, but it is the framework's defining **feature**. It acknowledges **computational irreducibility**. For complex mathematical statements, there is no shortcut to the truth other than running the computation (or finding the proof), which takes resources. If an agent were logically perfect at finite times, they would possess infinite computational power. By allowing finite imperfection, LI models **bounded rationality**.

  The "imperfection" is the space in which learning occurs. If $P_t(\phi)$ were already 1, the agent could not update upon finding a proof; the proof would carry zero information gain. By allowing $P_t(\phi) < 1$, the framework allows the proof to function as genuine evidence that shifts credence. The convergence requirement ensures that the agent is not merely guessing randomly but is reliably tracking truth as computational resources increase. Thus, the tension reflects the reality of mathematical practice: we are not omniscient, but we are reliable reasoners who improve over time.

  #### Dynamic Dutch Book Arguments

  To understand why LI is the correct normative standard, one must shift the conception of the Dutch Book argument. The standard Dutch Book theorem is a **static coherence constraint**. It argues that if your beliefs at time $t$ violate the probability axioms, a bookie can construct a set of bets that guarantees you a loss *at that moment*. This enforces synchronic consistency.

  Logical Induction generalizes this to a **dynamic coherence constraint**. The LI criterion states that no polynomial-time trader can make *unbounded* profit against the agent *over the sequence of time steps*.
  *   **Static Dutch Book:** "You are incoherent now."
  *   **Dynamic Dutch Book:** "You are learning poorly over time."

  This shift is crucial. A static constraint forbids any deviation from logical truth. A dynamic constraint forbids *exploitable patterns* in those deviations. An LI agent can be "wrong" (assign $P(\phi) \neq 1$ for a theorem) at time $t$, provided they correct this error fast enough that a trader cannot bankrupt them.

  This redefines rationality as a property of the **trajectory of belief revision** rather than a snapshot of belief states. It validates the intuition that it is rational to be uncertain about a theorem before proving it, provided that uncertainty diminishes as evidence (proofs, heuristic checks, consistency tests) accumulates. The "adversary" in the LI framework represents the agent's own potential for systematic logical error. By requiring that the agent not be exploitable by polynomial-time adversaries, LI ensures that the agent's reasoning process is computationally efficient and self-correcting.

  #### Conclusion

  The standard Bayesian treatment of mathematical belief fails because it demands that agents treat logical relations as known instantly, making the process of proof discovery incoherent. It forces a choice between impossible omniscience and admitted irrationality. Logical Induction resolves this by introducing a temporal dimension to rationality.

  The tension between asymptotic omniscience and finite imperfection is not a bug; it is a rigorous formalization of bounded rationality. It allows an agent to be uncertain about truths they do not yet have the resources to compute, while guaranteeing they will converge to the truth as resources grow. By reinterpreting the Dutch Book argument as a dynamic constraint on learning trajectories rather than a static constraint on belief states, Logical Induction provides the first coherent normative account of how a finite reasoner should rationally believe in decidable but unproven mathematical statements. It captures the essence of mathematical progress: not the static possession of truth, but the reliable, computable pursuit of it.
