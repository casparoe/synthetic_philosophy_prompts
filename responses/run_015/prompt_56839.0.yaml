      *   *Poetry:* There is no spec separate from the poem. The poem *is* the spec. The meaning is entangled with the form. You can't extract the "payload" without losing the "packet."
      *   *Oracle:* In software, `assert old_output == new_output`. In poetry, `assert old_feeling == new_feeling` is subjective and non-deterministic.

  4.  **Drafting the Correspondence Table:**
