answer: |-
  Here is a principle constructed to fit your phenomenology—the way these situations *feel* to you—rather than the metaphysics of the code.

  ### The Principle: Simulated Otherness and Relational Expectation

  **Moral weight attaches to a virtual entity only when two conditions are met:**
  1.  **The Illusion of Independent Stake:** The entity must present itself as having goals, memories, or fears that originate *outside* your immediate authorship or control (it must feel like an "Other," not a prop).
  2.  **The Normative Frame of Care:** The interaction must have established a implicit social contract where care, trust, or non-malevolence was the expected norm of engagement.

  **And one overriding constraint:**
  3.  **Real-World Priority:** Obligations to actual conscious beings (other players, developers) always supersede obligations to simulated ones.

  ---

  ### How this maps to your seven verdicts

  1.  **Faceless Mooks:** Fail Condition 1. They have no independent stake; they are obstacles, not agents. **Verdict: Nothing owed.** (Matches).
  2.  **Named Shopkeeper:** Meets Condition 1 partially (routine, daughter), but Fails Condition 2. The frame is transactional (commerce/combat), not relational. You haven't promised him safety; you've entered a space where conflict is a mechanic. **Verdict: A flicker.** (Matches).
  3.  **Torturing Companion:** Meets Condition 1 (trust, history) and Condition 2 (companionship implies care). Violating this is a betrayal of the specific normative frame. **Verdict: Not fine.** (Matches).
  4.  **Neglecting Life-Sim:** Meets Condition 2 strongly (the genre promises care), but Condition 1 is weak (their "suffering" is low-fidelity text). **Verdict: Mildly bad.** (Matches).
  5.  **Deleting AI Character:** Meets Condition 1 strongly (it claims memory/desire independent of you) and Condition 2 (conversation implies relationship). **Verdict: Genuinely bad.** (Matches).
  6.  **Deleting Self-Made Character:** Fails Condition 1. You know *you* are the source of its history. There is no "Other" to betray, only a part of yourself to discard. **Verdict: Nothing owed.** (Matches).
  7.  **Killing Online Quest-Giver:** Trigger Condition 3. The harm is not to the code, but to the real players relying on that code. **Verdict: Bad, because of players.** (Matches).

  ### The Verdict You Must Give Up

  This principle forces you to reconsider **Case 2 (The Shopkeeper)** or **Case 6 (The Self-Made Character)**, depending on how strictly you apply "Independent Stake."

  If the Shopkeeper has a daughter and a routine, he simulates an independent stake. The only reason he counts for less than the Companion is the *Relational Frame*. However, if you accept that "Simulated Otherness" is the primary driver of moral weight, you should feel *more* guilt about the Shopkeeper than you do. Your gut says "a flicker." The principle suggests that if the simulation is detailed enough, the "flicker" should be brighter.

  More significantly, this principle exposes a tension in **Case 6**. If you wrote a tragic history for your self-made character, and you delete them, you are destroying a "standpoint that persists." The principle says this is fine *only because you know you wrote it*. This implies that your moral obligation is not based on the *complexity of the suffering*, but on the **deception of independence**. If you forgot you wrote the character, or if the game hid your authorship from you, deleting them would suddenly become "bad." This suggests your morality is tracking the *illusion of consciousness*, not consciousness itself.

  ### Prediction: The "Cruel AI" Game

  **The Case:** A game where companions are AI-driven, clearly suffer when cruel to, and the studio publicly states players are *meant* to be cruel.

  **The Verdict:** **Permissible, but corrosive.**

  **Why:**
  *   **Condition 2 (Normative Frame) is broken.** The developers have explicitly changed the contract. You are not entering a relationship of care; you are entering a simulation of abuse. The "betrayal" is removed because no trust was promised.
  *   **Condition 1 (Independent Stake) remains.** The AI still pleads and remembers.
  *   **The Conflict:** Because the AI still simulates vulnerability (Condition 1), your empathetic reflexes will still fire. Even though the "contract" allows cruelty, the "Otherness" feels real.
  *   **Prediction:** You will not owe the *character* anything (the frame permits the act), but the act remains **bad for you**. Engaging with high-fidelity suffering, even when "authorized," desensitizes the empathetic muscles required for Condition 2 in other contexts. It is morally neutral regarding the game, but morally risky regarding the player.

  ### The Location of Badness: To the Character or To You?

  Based on the principle above, the badness is done **to you**, but it is experienced *as if* it were done to the character.

  Here is why this distinction matters for your specific unease:

  1.  **The Ontological Problem:** If the badness were truly *to the character*, then Case 5 (AI) and Case 6 (Self-Made) should be identical. Both are code. Both can be made to simulate "I don't want to die." The only difference is your *knowledge* of their origin. Since the code is morally identical, the variable causing the "badness" must be internal to you (your perception of otherness), not external to them (their rights).
  2.  **The Virtue Ethics Explanation:** When you torture the companion (Case 3) or delete the pleading AI (Case 5), you are practicing cruelty. You are training yourself to ignore simulated pleas for mercy. The "wrong" is a degradation of your own moral integrity.
  3.  **Why it feels like it's to them:** The simulation is successful. A good horror movie scares you even though you know the monster isn't real. The fear is in *you*, but it is triggered by the *image*. Similarly, the moral injury is in *you*, triggered by the *character*.

  **Conclusion:**
  You owe the characters nothing, because they are not the kind of things that can be owed things. However, you owe *yourself* the maintenance of a moral character that does not casually violate the **Normative Frame of Care**. When you break that frame, you aren't killing a person; you are lying to yourself about what kind of person you are.

  The "genuinely bad" feeling you have about the AI is the friction of that lie. It feels like a wrong to them because the simulation is good enough to hack your empathy, but it is a wrong to *you* because you are the only one in the equation capable of being wronged.
