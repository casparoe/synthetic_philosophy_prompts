answer: |-
  1. A school principal waives a fee for a destitute student. The uncontested right-making feature (F) is the student's welfare need. The principal sincerely avows her reason (G) is adherence to the school's "Equity Mission," a decent institutional duty. She is fully articulate and not self-deceived: she conceptualizes her sensitivity to need as simply *what the Mission requires*. However, counterfactually, the Mission without Need would not move her, while Need without the Mission would; F is the causal driver, though she describes her motive exclusively under the description G.

  2. The Right-Reasons View (RRV) denies moral worth because the agent acts for G (institutional duty), not F (welfare), failing the requirement to act *under the description* of the right-making feature. The Tracking/Quality-of-Will View (TWV) grants moral worth because the agent's will is reliably sensitive to F; the right-making feature is the actual difference-maker, evidencing a good will regardless of her conceptual labeling.

  3. The work is done by the gap between the *causal etiology* of the action (sensitivity to F) and the *practical conception* the agent uses to justify it (commitment to G). This isolates the dispute: RRV prioritizes the agent's normative self-understanding, while TWV prioritizes the objective alignment of the will with value.

  4. The minimal change reversing both verdicts is making F the avowed reason while rendering it causally inert (e.g., she avows "I do this for Need," but a habit would have compelled the act even without Need). This flips RRV to Yes (she acts for the right reason) and TWV to No (the right feature doesn't track/explain the action), producing the opposite disagreement pattern.

  5. The RRV defender argues that moral worth is essentially about rational agency, not causal luck; if the agent does not take F as her reason, she fails to embody the value, making the causal link to F merely accidental relative to her deliberation. They claim that without acting *because* it is right (under that description), the agent merits no credit, even if her psychology reliably hooks onto the good.

  6. I side with the Tracking View, as moral worth should reflect the actual orientation of the will toward value rather than the agent's conceptual taxonomy. The stipulation remaining is that the agent's error about her own motive (avowing G while F moves her) is non-deceptive, which relies on a contentious theory of self-knowledge to maintain without collapsing into self-deception.
