      *   In my main case, she avows G, but F moves her. She is not self-deceived.
      *   How? She identifies F as an instance of G. "I act for Policy (G)" where Policy *just is* Responding to Need (F).
      *   But RRV says G is not the Right Reason. F is.
      *   So she acts for G (which tracks F).
      *   This works.

      *Let's finalize the Scenario.*
      *   **Agent:** School Principal.
      *   **Act:** Waiving a fee for a poor student.
      *   **F:** Student's financial need (Welfare).
      *   **G:** Adherence to "Equity Mission Statement" (Institutional Duty).
      *   She avows G. "I do this for the Mission."
      *   Causal: If Mission existed but No Need, no waiver. If Need existed but No Mission, waiver granted.
      *   She knows this? She says "The Mission requires me to meet Need." She conflates the two. She isn't self-deceived; she sees them as identical. But philosophically, G (Mission) is distinct from F (Need).
      *   RRV: She acts for G, not F. No worth.
      *   TWV: She tracks F. Worth.

      *Wait, if she sees them as identical, does she act for F?*
      *   If she thinks G=F, and acts for G, does she act for F?
      *   RRV says no, because the *description* matters. (Markovits).
      *   TWV says yes, because the *object* matters.
