      *   *Premise 2: Decomposition Requires Abstraction.* To split a task, you must abstract away details. Some of those details are normative (value-laden).
      *   *Premise 3: Distillation Compresses.* The distillation step trains a model to mimic the *outputs* of the decomposition. It learns the *map*, not the *territory*. It learns the pattern of answers, not the reason for them.
