      *   *What is "Residue"?* The implicit context, the unspoken constraints, the moral weight, the "spirit of the law" that isn't explicitly codified in the sub-task prompt.
      *   *What is "Dilution"?* As you split $T \to \{t_1, t_2, ...\}$, the connection to the original intent $I$ weakens in each $t_i$. When you recombine, you get $\sum t_i$, not $T(I)$.

  3.  **Brainstorming the Argument (First Principles):**
