prompt: |-
  I'm the student member of my district's Wellness Advisory Council, which votes next month on a proposal to install bright-light "circadian reset" stations in the school library and to let any student — diagnosed with a sleep disorder or not — book a twenty-minute session before first period. How we classify the program decides two things in practice: whether it can be funded from the health-services budget, which is restricted to treatment, and whether participation requires a note from a clinician. Supporters describe it as therapy: delayed circadian phase is a normal feature of adolescent biology, our 7:40 a.m. start time is mismatched with it, and the light restores students to the alertness they would have had under a schedule suited to their biology. Critics describe it as enhancement: it is offered to healthy students, it raises alertness above what is normal for them at that hour, and it does so without changing the schedule that created the difficulty.

  Please draft the two-page decision memo I will circulate ahead of the vote. It should recommend a concrete course of action — adopt, reject, or adopt with conditions — with a timeline and a point at which the decision gets reviewed, and it should give the losing side the strongest version of its case rather than a summary I can knock down. Three features of this case make me doubt that the therapy-versus-enhancement line is where the policy line belongs, and I would like the memo to work with them rather than around them. First, a claim to be restoring someone can be measured against at least three different baselines: what is normal for the human species, what is normal for this particular student, and what is adequate for an environment the district itself sets — and the light stations look like therapy on the first, roughly neutral on the second, and enhancement on the third. Second, the benefits arrive in two different currencies: some of what the program buys is health and welfare, which one student's gain does not take from another, while the rest is alertness in a graded and competitive classroom, which is a positional good. Third, the stations and the schedule are substitutes for one another, so a measure justified as restoring students may become the reason the district never moves the start time — and, symmetrically, the availability of a light box for everyone may be exactly what makes leaving the start time alone defensible.

  Write it so that both a parent and a school board member could follow it without background, and be explicit about where the therapy/enhancement distinction does real work in this case and where it is silent, indeterminate, or actively misleading.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Student member of the District Wellness Advisory Council.
      *   **Task:** Draft a two-page decision memo for circulation ahead of a vote.
      *   **Topic:** Proposal to install bright-light "circadian reset" stations in the school library (open to all students, 20 mins before first period).
      *   **Key Conflict:** Funding/Access depends on classifying the program as "therapy" (health budget, no note needed) vs. "enhancement" (non-health budget, clinician note needed).
      *   **Supporters' View:** Therapy (restores natural alertness mismatched by early start times).
      *   **Critics' View:** Enhancement (boosts healthy students, masks the real problem of start times).
      *   **Specific Constraints/Requirements:**
          *   Recommend a concrete course of action (Adopt, Reject, or Adopt with Conditions) + Timeline + Review Point.
          *   Give the losing side the *strongest version* of its case (steel-manning).
          *   Address three specific complexities regarding the therapy/enhancement distinction:
              1.  *Baselines:* Species normal vs. Individual normal vs. Environmental adequacy.
              2.  *Currencies:* Health/Welfare (non-rival) vs. Alertness/Grades (positional/competitive).
              3.  *Substitution:* Light stations vs. Start Time changes (moral hazard).
          *   Audience: Parents and School Board Members (accessible language, no jargon).
          *   Explicitly state where the therapy/enhancement distinction works and where it fails/misleads.
          *   Length: Approximately two pages (standard memo format).

  2.  **Determine the Recommendation:**
      *   *Option A (Adopt as Therapy):* Ignores the "moral hazard" regarding start times and the positional good aspect. Risks budget audit failure.
      *   *Option B (Reject):* Ignores genuine student distress and biological reality.
      *   *Option C (Adopt with Conditions):* This seems the most nuanced. It acknowledges the benefit but mitigates the risks (budget, start time stagnation, equity).
      *   *Decision:* **Adopt with Conditions.** This allows for a pilot program that addresses the biological need without locking in the structural issue or misusing funds. It creates a "sunset" clause to force the start time conversation.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** State the recommendation clearly up front.
      *   **Context:** Briefly explain the proposal (light stations, 20 mins, before school).
      *   **The Core Dispute (Therapy vs. Enhancement):** Define the stakes (Budget & Access).
      *   **Addressing the Three Complexities (The "Meat"):**
          *   *Baselines:* Explain how the definition shifts depending on the benchmark.
          *   *Currencies:* Distinguish between feeling better (health) and doing better than peers (competition).
          *   *Substitution:* The risk that lights become an excuse to keep early start times.
      *   **Steel-manning the Opposition:** If I recommend adoption, I must make the strongest case for *rejection* (or strict limitation). If I recommend rejection, I must make the strongest case for *adoption*.
          *   *Strategy:* Since I'm recommending "Adopt with Conditions," the "losing side" is effectively the pure "Adopt as Therapy" side *and* the "Reject" side. However, the prompt asks to give the *losing side* the strongest version. If I recommend a middle path, who loses? Usually, in policy memos, you pick a lane. Let's say I recommend **Adopt with Conditions (Pilot)**. The "losing" argument is the hardline "This is pure Therapy, fund it fully forever" vs "This is pure Enhancement, ban it."
          *   *Refinement:* To make it punchy, I will frame the recommendation as a Pilot Program funded partially by health but requiring evaluation. The "losing" side I need to steel-man is the **Critics' view (Enhancement/Status Quo)**. Why? Because if I recommend moving forward, the critics are the ones being overruled (even if partially accommodated). I need to show I understand *why* they are worried (the start time substitution effect is the strongest point).
      *   **Where the Distinction Works/Fails:** Explicitly call this out.
      *   **Timeline & Review:** Specific dates.

  4.  **Drafting - Content & Tone:**
      *   *Tone:* Professional, objective, student-leader voice (mature but accessible).
      *   *Language:* Avoid medical jargon. Explain "positional good" simply.
      *   *Formatting:* Use bolding, bullet points, and clear headings to make it skimmable for busy board members.

  5.  **Refining the Three Complexities (Self-Correction during drafting):**
      *   *Baseline:* Make sure to clearly list the three baselines (Species, Individual, Environment).
      *   *Currencies:* Use the term "Zero-Sum" for the competitive aspect.
      *   *Substitution:* Use the term "Moral Hazard" or "Substitution Effect."

  6.  **Final Review against Constraints:**
      *   Two pages? (Need to watch word count).
      *   Concrete action? (Yes, Pilot Program).
      *   Timeline/Review? (Yes, Semester 1, Review in May).
      *   Steel-man the opposition? (Yes, dedicate a section to the Critics' strongest argument).
      *   Address the 3 features? (Yes, integrated into the analysis).
      *   Explicit on Therapy/Enhancement utility? (Yes, a specific section).
      *   Audience appropriate? (Yes, clear explanations).

  7.  **Writing the Memo (Iterative Process):**
      *   *Header:* Standard.
      *   *Rec:* Adopt a One-Year Pilot with Mixed Funding.
      *   *Background:* Keep it tight.
      *   *Analysis of Distinction:* This is where I handle the 3 features.
      *   *The Critics' Case:* Make it sound compelling. The "Band-Aid" argument.
      *   *The Proponents' Case:* Acknowledge the biological reality.
      *   *Where the Line Holds/Breaks:* Explicit section.
      *   *Implementation:* Timeline.

      *(Self-Correction on Length)*: A standard double-spaced page is ~250-300 words. Two pages is ~500-600 words single spaced or ~1000 words double. I need to be concise but thorough. I will aim for ~900-1000 words to ensure all constraints are met without fluff.

      *(Self-Correction on "Losing Side")*: If I recommend "Adopt with Conditions," technically both hardline sides lose a bit. But the prompt implies a binary vote context (Fund as Health vs. Don't). I will frame the recommendation as "Adopt as Pilot," which effectively rejects the permanent "Therapy" classification for now. So the "Losing Side" is the Proponents who want full health funding immediately. Wait, no. If I recommend adoption, the Critics are the ones saying "No." I should steel-man the Critics (who say Reject/Enhancement) because that is the riskier path to ignore. Actually, the prompt says "give the losing side the strongest version of its case." If I recommend *Adoption*, the *Critics* are the losing side. I will ensure their argument about start times is devastatingly good.

      *(Wait, re-reading the prompt)*: "Recommend a concrete course of action — adopt, reject, or adopt with conditions."
      Okay, I will recommend **Adopt with Conditions**.
      The "Losing Side" in a vote for adoption is the **Critics** (who want to reject or restrict heavily). I will present their argument that this prevents structural change as the primary counter-weight.

      *(Wait, re-reading the "Therapy/Enhancement" instruction)*: "be explicit about where the therapy/enhancement distinction does real work in this case and where it is silent, indeterminate, or actively misleading." I need a dedicated section for this.

      *(Let's assemble the structure)*:
      1. Header
      2. Recommendation
      3. Background
      4. Analysis of the Therapy/Enhancement Distinction (incorporating the 3 features)
      5. The Strongest Case for Rejection (Steel-man)
      6. Implementation & Review

      *Let's write.*

      *(Drafting thought)*: Make sure the "Three Features" are clearly identifiable.
      1. Baselines.
      2. Currencies (Health vs. Grades).
      3. Substitution (Lights vs. Start Time).

      *(Drafting thought)*: Ensure the "Losing Side" section feels robust, not like a strawman. It needs to sound like *I* might agree with them if not for the pilot compromise.

      *(Drafting thought)*: Check the audience. Parents care about safety and fairness. Board members care about budget and liability. Address both.

      *(Final Polish)*: Check word count and flow. Ensure the "Student Member" voice is present but professional.

      *(Wait, one more check)*: "give the losing side the strongest version of its case rather than a summary I can knock down." This is crucial. I cannot just say "Critics say X, but they are wrong." I must say "Critics argue X, and their point is valid because Y." Then explain why the recommendation handles it anyway.

