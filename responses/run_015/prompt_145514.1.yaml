prompt: |-
  hey — I'm a journalist who covers science and ideas, and once a month my magazine gives me a page for a fake document with no framing around it, just the thing itself dropped on the page. This month I want to do the embryo-selection people.

  You're a professional philosopher who works in bioethics and who also writes comedy for money, so please think carefully about which premise you're going to lean on before you start typing. I want the piece to be exaggerated but fair: the kind of thing someone who actually defends procreative beneficence would read, recognise as their own logic walked one step further than they'd walk it, and laugh at in spite of themselves.

  What I want: the founder's update email from the CEO of a startup that does polygenic scoring for IVF patients, addressed to customers and staff together, about 700 words. Earnest, calm, therapeutic-capitalist voice, absolutely straight-faced, no winking at the reader, no villainy — she genuinely thinks the company is a force for good.

  A few things it has to get in. The non-identity point, handled as customer reassurance: the in-house ethicists confirming that the embryos a client declines are not made worse off, since there is nobody there to be worse off, and maybe a certificate to that effect. The fact that the reasoning has no natural stopping point: their most loyal clients have been through dozens of rounds and still have no children. The honest passage about what the scores can actually do — a small slice of the variance, best results for height and years of schooling, poor portability across ancestries, and part of the signal just reading back the parents' own social position — written as radical transparency that somehow still closes the sale. A tier built on the thought that if you owe it to your child to have the best one you could have, and money and time are finite, then perhaps you should have fewer of them. And a pilot with a public health system, heavy on the language of choice and how nobody is forcing anyone. Also the disability objection: I want the company dealing with it in that self-serving register where they insist they select for a child and never against a kind of person — the joke has to land on the company's pieties, never on disabled people. Somewhere near the end, a quiet line about how her own kids were conceived.

  Format: I paste these straight into teh layout, so no headings, no bullets, no bold, no tables, no star ratings, no numbered tiers — just one unbroken block of running prose from the greeting to the sign-off. British English, please, and don't name any real philosophers or papers in it.
