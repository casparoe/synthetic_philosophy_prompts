  ## FORMAT GUIDE (For Printing)
  *   **Layout:** Print Node Table on Side 1, Legend/Notes on Side 2.
  *   **Flow:** Draw arrows from Node 1 → 1b/2 → 3/5 → etc., to visualize the tree.
  *   **Usage:** In seminar, pick a case (e.g., "Alien Co-Processor") and ask students to trace the path. If they disagree on the leaf, check which Node they branched differently on.
