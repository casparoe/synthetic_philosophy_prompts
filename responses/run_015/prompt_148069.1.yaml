  ## LEGEND: LEAVES & COMMITMENTS

  | Leaf | Label | Commitments (Path) | The Awkward Thing | Proponent (Optional) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Hard Eliminativism** | Deflation + Past State is Nothing | Denies the datum of memory: if you remember it, it existed. | Churchland |
  | **2** | **Retrospective Construct** | Deflation + Past State Unconscious | Makes consciousness a judgment about the past, not a present state. | Dennett |
  | **3** | **Pure First-Order** | Realist + FO-Determined + No Dissociation | Struggles to explain blindsight vs. seeing without report differences. | Dretske |
  | **4** | **Global Workspace** | Realist + FO-Determined + Dissociation | Risks conflating *access* to consciousness with consciousness itself. | Dehaene |
  | **5** | **Dispositional HO** | Realist + HO-Determined + No Empty HO | Claims unconscious HO states suffice; hard to distinguish from FO empirically. | Carruthers |
  | **6** | **Relational / Global HO** | Realist + HO-Determined + Functional | "Higher-Order" becomes a label for any monitoring, losing explanatory bite. | Lycan |
  | **7** | **Conceptual Thought** | Structural + Inferential + Concepts Required | Implies infants/animals lack phenomenality; counter-intuitive to many. | Rosenthal |
  | **8** | **Tracking / Non-Rep** | Structural + Inferential + Non-Conceptual | HO state tracks FO state without representing it *as* a mental state. | (Variant of 7) |
  | **9** | **Inner-Sense** | Structural + Perceptual + Unconscious Scanner | Posits a hidden internal scanner we never experience directly. | Armstrong |
  | **10** | **Self-Representational** | Structural + Perceptual + Conscious Scanner | Risks circularity: the state makes itself conscious by being conscious. | Kriegel |

  ---

  ## NOTES ON EMPTY BOXES & INDISTINGUISHABLE LEAVES

  *   **[~Indistinguishable] Leaves 3 & 5:** Pure First-Order and Dispositional HO often predict identical behavior in dissociation cases; distinguishing them may require settling the metaphysics of "disposition" vs "state".
  *   **[~Indistinguishable] Leaves 7 & 8:** Conceptual Thought and Tracking variants differ on animal consciousness but may be functionally identical in adult humans; the split rests on the *necessity* of concepts, not the mechanism.
  *   **[Empty] Conscious FO without Access:** A leaf where a state is phenomenally conscious but absolutely inaccessible (even to the subject) is logically possible but theoretically unstable; usually collapses into Leaf 1 or Leaf 3.
  *   **[Empty] Infinite Regress:** Any path requiring the HO state to be conscious *by a third state* without a stopper (like Leaf 10) is rejected as incoherent.
  *   **[Empirical IOU]** Nodes 2, 3, 7, 8 rely on data (metacognitive sensitivity, animal behavior, implant effects) that is currently contested or incomplete.

