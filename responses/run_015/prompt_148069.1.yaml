  # MAP OF THE CONSCIOUSNESS SPACE: A DECISION TREE

  **Instructions:** Start at Node 1. Answer the question using the specified diagnostic case. Follow the branch. Nodes marked **[Empirical]** require data; nodes marked **[Conceptual]** turn on coherence or definition. Leaves marked **[~Indistinguishable]** may be empirically equivalent despite metaphysical differences.

  | Node | Question (Diagnostic Case) | Type | Branch A (Yes/Left) | Branch B (No/Right) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Retrospective Pain:** Was the pain phenomenally conscious *at t1* or only when reported at *t2*? | Conceptual | **At t1** (Realist) → Node 2 | **Only at t2** (Deflationary) → Node 1b |
  | **1b** | **Deflation Type:** Is the past state *nothing* or merely *unconscious*? | Conceptual | **Nothing** → **Leaf 1** | **Unconscious** → **Leaf 2** |
  | **2** | **Crossed-Metacognition:** Mismatch: FO state is Red, HO report is Green. What is the experience? | Empirical | **Red** (FO-Determined) → Node 3 | **Green** (HO-Determined) → Node 5 |
  | **3** | **Dissociation:** Confidence/metacognition changes, discrimination stays same. Does *what-it's-like* change? | Empirical | **No** (Phenomenology = Discrimination) → **Leaf 3** | **Yes** (Phenomenology = Access) → **Leaf 4** |
  | **5** | **Empty HO:** HO state says "Seeing Green", no FO state exists. Is there an experience? | Conceptual | **No** (Requires FO Target) → **Leaf 5** | **Yes** (HO Creates Experience) → Node 6 |
  | **6** | **Order-Relativity:** Is "Higher-Order" a fixed neural hierarchy or a functional description? | Conceptual | **Fixed Hierarchy** (Structural) → Node 7 | **Functional Description** (Relational) → **Leaf 6** |
  | **7** | **Alien Co-Processor:** Device writes HO state. Is the mechanism inferential/thought-like or perceptual/scan-like? | Empirical | **Inferential/Thought** → Node 8 | **Perceptual/Scan** → Node 8b |
  | **8** | **Animals/Infants:** Can non-conceptual creatures have these HO states? | Empirical | **No** (Concepts Required) → **Leaf 7** | **Yes** (Non-Conceptual) → **Leaf 8** |
  | **8b** | **Regress:** Must the scanning mechanism itself be conscious? | Conceptual | **No** (Unconscious Scanner) → **Leaf 9** | **Yes** (Self-Representing) → **Leaf 10** |

