          *   *Portability:* Distinguish from single-case. Single-case is about *actual* frequency (0 or 1). Portability is about *unrealized* setups. BSA makes chance statements about unrun experiments false or truth-valueless unless grounded in *other* similar actual events. This hurts scientific prediction. *Confidence:* High that this annoys scientists.
          *   *Science Example:* Climate Attribution or Mutation Rates.
              *   *Idea:* Extreme Event Attribution. "This heatwave was made 5x more likely by climate change."
              *   *Humean Problem:* The "probability" is based on model ensembles (counterfactual worlds), not the actual mosaic (we only have one Earth). The Humean has to say the chance is 1 (it happened) or 0 (it didn't happen in the control), unless they lean on the *model* as part of the "system." But models aren't the mosaic. This forces the Humean to treat models as reality, which is risky.
              *   *Alternative:* Particle Physics (Higgs). Discovery claims rely on p-values derived from hypothetical infinite runs. The actual mosaic is finite.
