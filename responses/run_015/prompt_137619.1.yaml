  7.  **Final Polish:** Check confidence markers. Ensure the distinction between "Metaphysical Fatal" and "Pragmatic Awkward" is clear. (Self-correction: Ensure I don't sound like I'm advocating for Propensity theory, just presenting the case *against* Humeanism as requested).

  8.  **Final Output Structure:**
