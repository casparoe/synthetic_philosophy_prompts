answer: |-
  # Q&A Prep Sheet: Mechanism-Based Anomaly Detection
  **Context:** 30-min talk + 15-min Q&A | **Audience:** 5 Archetypes (2 Infra, 1 Interp, 1 Phil, 1 Evals)
  **Goal:** Survive Q&A without overstating consensus or conceding core value prop.

  ---

  ## 1. Strategic Concessions (Slides 1–2)
  *Put these in your opening remarks to disarm the room before they interrupt.*

  **CONCEDE EARLY:**
  *   **"Mechanism Identification is Heuristic, Not Oracle."** Explicitly state that your "minimal sufficient causal path" is an approximation derived from finite patching budgets, not a ground-truth extraction. This pre-empts the Interp person's claim that you're reifying noise.
  *   **"MDL is a Proxy, Not a Constant."** Acknowledge that Kolmogorov complexity is uncomputable and you are using a tractable approximation (e.g., parameter count + sparsity penalty). This stops the Philosopher from derailing you on information theory technicalities.
  *   **"This Adds Latency."** Admit this cannot run on the hot path for every inference. It is a *reliability audit* tool (CI/CD or nightly), not a real-time guardrail. This satisfies the Infra engineers' latency concerns immediately.

  **DO NOT CONCEDE:**
  *   **"Flat Metrics Imply Safety."** Do not let the Evals person equate stable AUC with stable behavior. Your resume demo proves this false. Hold the line that *how* the model succeeds matters for long-term robustness.
  *   **"Mechanisms are Purely Probe-Relative."** While admitting probe dependence, maintain that *causal* interventions (scrubbing/patching) constrain the hypothesis space more than correlational probes. Do not retreat to "it's all just activations."

  ---

  ## 2. Objection Matrix (Ordered by Likelihood $\times$ Damage)

  ### 1. The "Ontological Status" Objection
  **Who:** Interpretability Person (supported by Philosopher)
  **Phrasing:** "You're treating the 'mechanism' as a property of the model, but causal scrubbing results are basis-dependent. If I rotate your activation space or change my patching granularity, your 'minimal path' changes. Aren't you just detecting changes in your *probe suite's* sensitivity rather than the model's actual computation?"
  **Likelihood:** High | **Damage:** High (Undermines the core definition)

  **~90-Second Reply:**
  "You're right that the *extraction* is probe-dependent, but the *invariance claim* is the filter. I'm not claiming the specific neuron IDs are stable; I'm claiming the *functional dependency* is. If I permute neurons but the causal graph of dependencies remains isomorphic, my metric shouldn't trigger. I agree this is the weakest link theoretically, but empirically, in the resume demo, the graph structure *did* change (content nodes disconnected, format nodes connected) even when we normalized for basis changes. We are treating mechanism stability as a falsifiable hypothesis: if we can find a reparametrization that aligns the old and new causal graphs, we count it as stable. If we can't, we alarm. It's not perfect, but it's more invariant than raw activation distributions."

  **Weakest Point:** You haven't actually proven you can find that reparametrization efficiently. If the Interp person asks for the algorithm that finds the isomorphism between causal graphs in polynomial time, you don't have one.

  ### 2. The "Compute Budget" Objection
  **Who:** Infra Engineers (2)
  **Phrasing:** "Causal scrubbing requires combinatorial interventions. To define a 'minimal path' on a transformer layer, you're looking at exponential subsets of heads and MLPs. Even with approximations, this adds orders of magnitude to our eval pipeline. Are you proposing we run this on every checkpoint? Because that blocks deployment."
  **Likelihood:** High | **Damage:** High (Makes the proposal operationally dead)

  **~90-Second Reply:**
  "I'm not proposing full exhaustive scrubbing on every commit. I'm proposing a *tracked subgraph*. Once we validate the mechanism on the release candidate, we only monitor the specific nodes and edges in that minimal set. The cost shifts from 'discovery' (expensive, one-off) to 'verification' (cheap, continuous). We patch only the validated critical path, not the whole model. For the resume model, the minimal path was <5% of the parameters. Verification is comparable to a standard forward pass with masking, not a full causal search."

  **Weakest Point:** Discovery is still a blocker for initial deployment. If they ask "How do we validate the first version without burning the budget?", you have to admit it requires a significant one-time compute investment that might not be justified for short-lived models.

  ### 3. The "Goodhart's Law" Objection
  **Who:** Evals Person
  **Phrasing:** "If the AUC is flat, the model is doing its job. If you alarm on mechanism change, you're optimizing for 'mechanism stability' instead of 'task performance.' You're just giving engineers a new metric to game. Why is changing heuristics bad if the output quality is constant?"
  **Likelihood:** Medium | **Damage:** High (Undermines the motivation)

  **~90-Second Reply:**
  "Because 'task performance' is measured on a static test set, but deployment is dynamic. In the resume demo, the model switched to format artifacts because the vendor changed PDF parsing. The test set didn't capture that distribution shift yet. Mechanism drift is a *leading indicator* of future metric collapse. If the model relies on a spurious correlation (format) rather than a robust one (content), it will fail the moment the data pipeline changes again. We aren't optimizing for stability for its own sake; we're optimizing for *robustness to unseen pipeline changes* that the current eval set can't see."

  **Weakest Point:** You need to prove that mechanism drift actually predicts future metric collapse more often than it generates false positives. If you alarm every time the mechanism shifts but metrics stay flat for 6 months, the Evals team will ignore you.

  ### 4. The "Individuation" Objection
  **Who:** Philosopher of Science
  **Phrasing:** "You say two systems run the 'same mechanism' if causal paths agree up to reparametrization. But in biology, we individuate mechanisms by their physical components, not just functional isomorphism. If the model uses a different heuristic on every slice (your third category), what individuates the 'mechanism' from the 'behavior'? Isn't this just a fancy way of saying 'the function is complex'?"
  **Likelihood:** Medium | **Damage:** Medium (Confuses the room, attacks definitions)

  **~90-Second Reply:**
  "That's exactly why I'm introducing the Description Length (MDL) criterion for the poly-mechanism case. When there is no single stable causal graph, the 'mechanism' is the *complexity of the switchboard* required to map inputs to the appropriate sub-routines. If the description length grows, the model is fragmenting into ad-hoc heuristics. I'm not trying to import biological individuation criteria; I'm using a computational one: individuation by compressibility. If the model's behavior on the slice becomes incompressible, it's no longer running a mechanism; it's memorizing."

  **Weakest Point:** "Compressibility" is vague. The Philosopher will press you on *which* compression algorithm defines the length. Different encoders yield different lengths. You are smuggling in an arbitrary choice of prior.

  ### 5. The "Hope Nobody Asks" Objection
  **Who:** Infra Engineer (Quiet one)
  **Phrasing:** "How do you handle residual streams? In a transformer, information is superimposed. You can't 'patch' a single feature without affecting others due to superposition. Your 'minimal path' assumes localizability that might not exist."
  **Likelihood:** Low (Technical depth) | **Damage:** Critical (Breaks the math)

  **~90-Second Reply:**
  "That's a fair constraint. This method works best where features are sufficiently sparse or where we can use linear probes to isolate subspaces. If superposition is too dense, the 'minimal path' becomes the whole model, and the alarm triggers trivially. In that case, we fall back to the MDL criterion on the input-output map rather than internal paths. We treat the model as a black box with a complexity penalty. It's less informative, but still captures the 'goodharting' risk."

  **Weakest Point:** This is a retreat. If superposition is ubiquitous (which Interp research suggests it is), your primary method (causal paths) fails on most modern models, leaving you only with the MDL fallback, which is less actionable.

  ---

  ## 3. Epistemic Status Check (Settled vs. Contested)
  *Be explicit about this if pressed. Do not present contested claims as fact.*

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **"Same Mechanism" is well-defined** | **CONTESTED** | No consensus on equivalence classes of neural subgraphs. Interp community is split on whether mechanisms are real or instrumental. |
  | **Reparametrization Invariance** | **CONTESTED** | Theoretically possible, practically unsolved for non-linear, deep networks without losing fidelity. |
  | **MDL is Measurable** | **CONTESTED** | Kolmogorov complexity is uncomputable. All practical MDL is approximation-dependent (e.g., BIC, specific compression codecs). |
  | **Mechanism Drift $\to$ Future Failure** | **HYPOTHESIS** | Plausible, but empirical evidence is anecdotal (like your resume demo). Not a settled law. |
  | **Input/Activation Monitoring is Insufficient** | **SETTLED (Mostly)** | General consensus that distribution shift can hide in flat metrics (e.g., "prediction bias" vs "accuracy"). |

  ---

  ## 4. The Retreat Plan (Fallback Position)
  *If the "Ontological Status" or "Superposition" objections land hard, pivot to this:*

  **The Fallback Claim:**
  "Even if we can't rigorously define 'mechanism identity,' monitoring the *stability of the explanation* is valuable. Whether it's the model changing or my probe seeing differently, a sudden increase in the complexity required to explain the model's behavior on a slice is a risk signal. I am arguing for **Explanation Stability** as a metric, regardless of whether that explanation maps to a Platonic 'mechanism'."

  **When to Trigger Retreat:**
  If the Interp person and Philosopher agree that your causal graph isomorphism is mathematically ill-posed, do not fight the math. Pivot to the *operational utility*: "Even if it's probe-relative, does it catch bugs the evals miss? Yes. Let's treat it as a heuristic bug-finder, not a truth-machine."

  **When to Stand Firm:**
  If the Evals person says "Just write better tests," stand firm. Better tests require knowing *what* to test for. Mechanism monitoring generates the hypotheses for new test cases. It is upstream of evals, not a replacement.
