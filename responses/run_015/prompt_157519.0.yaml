      *   *Fatal 2: The "Outside" is Illusory.* In literary theory (e.g., Derrida, Eco), there is no "outside" text. Every interpretation is another text/frame. The "jump" is just moving to a meta-language which is still part of the broader semiotic system. Cognitive science suggests frame-shifting is internal processing, not transcendent access.
      *   *Serious 1: Unfalsifiability.* If every resolution is defined as a "jump," and every failure to resolve is "staying in," the theory explains everything and nothing. It risks becoming a just-so story.
      *   *Serious 2: Reader Variability.* Gödel's theorem is objective (true but unprovable). Narrative interpretation is subjective. What is a contradiction to one reader is ambiguity to another. There is no single "truth" accessed.
      *   *Awkward 1: Historical Precedence.* This sounds like Romantic Irony or Reader-Response Theory dressed in math clothes. It might not be novel.
      *   *Awkward 2: Complexity Threshold.* What counts as "sufficiently complex"? This is vague.

