      *   **Task:** Provide an honest map of the position's exposure/weaknesses.
      *   **Specific Requirements:**
          *   Identify collapsing formal analogies (logic vs. narrative).
          *   Identify cognitive science/literary theory results suggesting "jumps" are just internal frame-shifts.
          *   Address unfalsifiability/insulation issues.
          *   Rank objections (fatal to awkward).
          *   Distinguish defender concessions vs. critic presses.
          *   **Format:** Continuous prose only. No headings, bullet points, bold text, or tables.
