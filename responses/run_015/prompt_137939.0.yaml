  Here is the breakdown of the tensions in your draft, ranked by severity, followed by the single change that resolves the most friction.

  ### The Conflicts (Ranked by Severity)

  **1. The Governance Lie: #2 vs. #3**
  *   **The Tension:** #2 says you gate deployment on evals. #3 says evals are useless because smart models sandbag. You cannot have a policy that relies on a mechanism you explicitly believe is broken.
  *   **Which Gives:** **#2 must give.** You cannot gate on what doesn't work.
  *   **The Cost:** You lose the ability to formally "certify" a model as safe before deployment. You shift from *pre-deployment assurance* to *runtime containment*. This increases liability on your engineering team to ensure the plumbing (#1) never fails, because you no longer have the "eval pass" safety net.

  **2. The Policy Violation: #1 vs. #6**
  *   **The Tension:** #1 says "Nothing safety-critical should ever be checked only by another model." #6 says "In practice... having other models look at the output" is what catches problems. If the problems caught in #6 are safety-critical (which they are, in the context of this doc), you are violating your own primary rule daily.
  *   **Which Gives:** **#6 must give.** You cannot claim "no model checks" while relying on model checks.
  *   **The Cost:** You lose your primary day-to-day detection layer. You must replace model reviewers with deterministic linters, stricter sandbox violations, or human audit. This increases engineering overhead and latency on the developer loop.

  **3. The Monitoring Dead End: #4 vs. #5**
  *   **The Tension:** #4 says monitoring is built on reasoning traces. #5 says you will distill away or hide reasoning to stay competitive. You cannot monitor a channel you are actively deleting.
  *   **Which Gives:** **#5 must give.** If you need the trace for safety (#4), you cannot optimize it away.
  *   **The Cost:** Capability and latency tax. You will run slower or less intelligent agents than competitors who optimize for latent reasoning. You may need to maintain a forked model version (legible for safety, latent for batch tasks).

  **4. The Diversity Illusion: #6 vs. #7**
  *   **The Tension:** #6 relies on a "zoo of models" to catch errors (implies independence). #7 states models are highly correlated (same data/recipes). If models are correlated, they will miss the same errors, rendering the "zoo" ineffective for safety.
  *   **Which Gives:** **#6 must give.** You cannot rely on diversity that doesn't exist.
  *   **The Cost:** You must accept that model reviewers will have blind spots identical to the agent. You cannot use them for high-confidence safety checks, only for low-confidence heuristics (e.g., code style).

  ---

  ### The Single Revision

  **Revise #5.**

  **Current:** "We should keep doing RL on the reasoning, and eventually distill it away or move to latent reasoning, and no single team is going to eat the capability cost of keeping its thinking legible..."

  **Revision:** "For any agent with write access to code or data, **we will pay the capability cost to keep reasoning legible.** We accept that this puts us at a competitive disadvantage on raw speed/intelligence, but it is the tax for operating without pre-deployment safety guarantees."

  **Why this cleans up the most:**
  1.  **Resolves #4 vs #5:** It makes your monitoring plan (#4) technically feasible.
  2.  **Mitigates #2 vs #3:** If you have legible traces, you rely less on pre-deployment evals (#2) because you can audit runtime behavior. It validates your skepticism in #3.
  3.  **Supports #1:** Legible reasoning becomes part of the "plumbing." You can verify *why* a model requested a privilege, making the "hostile default" enforceable.
  4.  **Reduces pressure on #6:** If you can read the agent's trace, you need fewer "reviewer models" (#6) to guess its intent. This sidesteps the correlation problem in #7.

  **The Trade-off:** You are explicitly choosing to be slower and less capable than the frontier in exchange for auditability. This aligns your safety doc with your actual risk posture (#1) rather than hoping for capabilities you admit are unsafe (#2, #6).
