answer: |-
  You press me hard on the distinction between a changing skin and a failing heart, and rightly so, for if the test be no more than a mirror for majority prejudice, I should have to surrender the point. But consider this: the disintegration thesis is not a prophecy that every moral shift brings ruin—societies are resilient, yes, but they are not infinitely elastic. The test is not whether the majority feels merely uncomfortable, but whether the practice provokes that deep sense of intolerance, indignation, and disgust which signals a breach in the shared ideas holding the community together. You call this a licence for prejudice; I call it the only available evidence of the bond's strength, for who else is to judge the necessity of the bond but the society itself? As for your colony, it serves not to relocate the prediction to the anthropologist, but to remind us that some institutions—marriage, the restraint of violence—are not mere conventions like dress or diet, but structural necessities for any group calling itself a society. The disintegration test identifies the threat; the colony argument identifies the essential fabric. Neither grants the legislator infallibility, but both deny the liberal's claim that private morality is, in principle, beyond the law's reach. If the bond is real, and the threat to it is genuine, the state has not only the right but the duty to intervene, however cautious it must be in practice.
