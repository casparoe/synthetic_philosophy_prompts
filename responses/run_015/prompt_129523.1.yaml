          4.  Requirement: Decomposition must be *faithful* (mirror actual reasoning).
          5.  Problem: For novel problems, we don't know the reasoning steps $\rightarrow$ Faithful decomposition impossible $\rightarrow$ IA fails where needed most.
      *   **Specific Questions:**
          *   Do these hang together?
          *   Am I assuming in (4) that we already understand the domain well enough that amplification is redundant?
          *   Does (3) just undo (1) with no fix?
          *   Rank the tensions by severity.
          *   Tell me the cheapest revision, even if it hurts.

  2.  **Evaluate the Intuitions (Fact-Checking against IA Literature):**
      *   *Premise 1 (Decomposition preserves alignment):* Generally true in theory. If humans can verify every step, the output should be safe. This is the core promise of IDA (Iterated Distillation and Amplification).
      *   *Premise 2 (Decomposition loses competence):* True. A model restricted to small contexts/sub-tasks often performs worse than a monolithic end-to-end model on complex tasks.
      *   *Premise 3 (Distillation introduces risk):* True. This is the "distillation step" risk. You are training a faster model to mimic the amplified overseer. If the overseer makes a subtle mistake or is tricked, the distilled model learns it. This is the "alignment tax" or "security loophole."
      *   *Premise 4 (Faithfulness is required):* This is a strong claim. IA relies on *completeness* (can the decomposition solve the task?) and *soundness* (if sub-tasks are safe, is the whole safe?). "Faithfulness" usually refers to interpretability (do the internal states match the decomposition?). The user seems to conflate "valid decomposition" with "faithful reasoning steps."
      *   *Premise 5 (Novel problems break decomposition):* This is the crux. If we can't decompose what we don't understand, IA struggles with *recursive improvement* on tasks beyond human capability.

