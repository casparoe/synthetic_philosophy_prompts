          *   *Alternative Cheap Revision:* Accept that IA is not for *genuinely* novel problems (superintelligence discovery), but for *scaling* known safe reasoning to complex domains. This hurts the ambition but saves the theory.

      *   *Let's look closer at (4) vs (5).* The user says: "for genuinely novel problems we don't already know the reasoning steps, so faithful decomposition is impossible."
      *   *Counter:* We don't need to know the *solution* steps, we need to know how to *check* the steps. This is the difference between *generating* and *verifying*.
      *   *Cheapest Revision:* Change (4) from "mirror actual reasoning steps" to "enable reliable verification." This shifts the burden from understanding the *solution* to understanding the *check*.

  5.  **Finalizing the Ranking:**
