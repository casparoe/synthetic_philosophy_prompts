  *(Drafting)*
  Good evening. Friends, colleagues, neighbors, and stewards of this city's story.

  Look closely at the glass cases before you. Here, a ceremonial banner, frayed at the edges. There, a portrait photograph, sepia-toned and solemn. And in the center, the document we call the founding charter. To the eye, it speaks of the fourteenth century. The calligraphy is heavy, medieval, evoking a time of quills and wax seals. But the archival record tells us it was drafted in 1912.

  We are gathered to inaugurate "Roots and Inventions," and I invite you to sit with the tension in that title. Usually, we prefer roots. Roots suggest something organic, unbroken, and inevitable. Inventions suggest something manufactured, optional, and perhaps fragile. We tend to think that if a tradition is invented, it is therefore false. But human society does not work that way.

  We are here to acknowledge a difficult truth: that the continuity we feel is often a project of construction. Nations function as imagined communities. They rely on a shared belief that we belong to something larger than ourselves, stretching back before we were born and forward after we are gone. For the families here today, who have donated these banners and charts, that belief is not an abstract theory. It is the ground beneath your feet. It is the reason you care about this city. To tell you that your heritage is constructed is not to tell you that your love is misplaced.

  Consider the charter. Why did the drafters in 1912 choose a style from centuries prior? They were not attempting a forgery to deceive posterity. They were attempting to build a bridge. They understood that a new century required old foundations. They knew that for a civic identity to hold weight, it needed to feel timeless. They were engineering cohesion. Was this dishonest? Or was it an act of care? They were weaving a fabric strong enough to hold the weight of our collective hopes.

  This brings us to the question this gallery implicitly asks: How old is a nation if its oldest symbols were assembled within living memory? If we measure age only by chronology, we are left with nothing but dates. But if we measure age by the durability of a promise, the calculation changes. A community is as old as the length of time its members have agreed to uphold a specific set of values. The charter is a century old, but the commitment it represents is renewed every time we choose to honor it. The invention is not the lie; the forgetting is.

  As journalists and historians, we are trained to scrutinize origins. We look for the seam where the pieces join. But in this archive, we are not here to expose the seam so that the garment falls apart. We are here to show how the stitching was done, and why it was necessary. The curatorial power held by this institution is immense. We select what is remembered and what is framed. We decide which artifacts deserve light and which remain in storage. To acknowledge this power is not an apology; it is a responsibility.

  If we present these inventions as ancient roots without context, we patronize you. If we present them as mere fabrications without empathy, we alienate you. Neither serves the public good. The ethical path lies in the middle. We must honor the emotional weight of these identities while remaining precise about their history. We can respect the banner without pretending the fabric never wore thin. We can honor the charter without pretending the ink is medieval.

  Why does it matter that we believe in continuity, even when the evidence suggests invention? Because we need to know where we are standing to decide where we are going. A society without a story is a crowd, not a community. But a society with a false story is building on sand. This gallery offers us a chance to build on bedrock. It asks us to accept that our identity is a thing we make, together, across time.

  So, as you walk through these halls, do not look for a past that is untouched by human hands. Look for the hands that shaped it. Look for the choices made in 1912, and the choices made today by the donors and officials in this room. We are the inheritors of their inventions. Now, it is our turn to tend them. Let us value these objects not because they are older than us, but because they are worthy of us. Let us maintain the continuity not by hiding the breaks, but by repairing them honestly.

  Thank you.

