      *   *Biology:* Hacking's stance is often misunderstood. He says "there is a biological reality, but the *kind* is interactive." I need to make sure the user understands that the *category* is the construct, not necessarily the *pain*.
      *   *Medical Classifications:* The summary says psychiatric categories are uniquely unstable compared to *other medical classifications*. Hacking might agree they are more unstable than *chemical* kinds, but heart disease also has behavioral components. I should note this nuance.

  7.  **Final Polish:** Organize with clear headings. Ensure the distinction between "Descriptive" (what Hacking says happens) and "Normative" (what Hacking says we should do) is clear. (This matches the user's question about descriptive vs. stronger claims).

