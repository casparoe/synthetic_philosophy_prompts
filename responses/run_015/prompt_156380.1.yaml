answer: |-
  When you ask what the committee was actually doing in that room in 1962, you are asking them to articulate a theory of value they were trying desperately not to name. In the language of social choice, they were attempting an interpersonal comparison of utility without admitting they had a common unit of measurement. They claimed to be ranking patients ordinally, simply ordering them from most to least deserving, but the criteria they used—dependents, employment, church attendance—reveal a hidden cardinality. They were not merely ordering preferences; they were implicitly summing contributions. The numeraire they adopted without saying so was not life itself, but social productivity and stability. When they chose the family man over the single man, or the taxpayer over the unemployed, they were treating a year of life for one person as equivalent to a year of life for another only if the social return on investment was comparable. This is a denominated comparison disguised as a rank-only procedure. They wanted the moral comfort of ordinal ranking, which suggests we are just looking at who comes first, but the moment you ask why one comes before the other, you are forced to specify how much better one outcome is than the other. Rank-only comparison collapses into denominated comparison the moment justification is required. The social choice literature tells us that with purely ordinal and noncomparable information, you cannot aggregate individual preferences into a social welfare function without violating basic conditions of fairness or rationality. The committee was trying to do exactly what Arrow suggested was impossible: they were trying to derive a social ordering from heterogeneous individual cases without a common metric, so they smuggled the metric in under the label of social worth.

  This brings you to the question of whose utility is being weighed. In the room, the committee members likely believed they were acting as impartial observers, imaginatively occupying the position of each candidate to gauge the worth of their life. But the reconstruction you are worried about—where an observer fully internalizes each patient's perspective—would have produced a radically different ordering than the one they enacted. If they had truly compared the utility levels of the patients themselves, focusing on the subjective experience of living versus dying, the alcoholic might have ranked higher than the pillar of the church if his desire to live was more intense. Instead, they compared the utility gains to the community. They were not measuring how much the patient valued her own life; they were measuring how much the community valued having her in it. This is not psychologically unavailable to actual people; it is unfortunately quite natural. We are better at counting contributions than we are at measuring suffering. But for your characters, this means the tension in the room is not between selfishness and selflessness, but between two different definitions of the good. The physician wants to maximize medical benefit, which is a gain measured in physiological function. The lay committee wants to maximize social benefit, which is a gain measured in roles fulfilled. Neither is comparing the patient's own utility in the raw sense of her conscious experience.

  Regarding your nurse's ledger, the distinction between what the patient loses and what others lose is coherent only if you reject the notion that utility is strictly individual and additive. If you assume that the family's utility function already includes the patient's survival, then counting the patient's loss and the family's loss separately is double-counting. However, if you view the family's loss as external—economic dependency, emotional trauma distinct from the patient's own existence—then the second column captures harm that would vanish if you looked only at the patient. The real problem is the baseline. If you measure gains from each patient's own status quo, everyone stands to lose everything upon death, which makes them equal. If you measure against a common reference point, such as a fair innings or prior social contribution, you introduce the inequality your nurse is recording. The ledger works dramatically because it exposes the conflict between these baselines. The first column respects the individual's sovereign claim to life; the second column respects the network of dependencies that constitute a social life. You should not resolve this for them. The nurse sees the double-counting worry as a technical error, but the opposite worry—that ignoring the second column ignores reality—is the heavier moral burden. To drop the second column is to say that a person's death is a private event, which in 1962 Seattle, it plainly was not.

  You ask whether the lottery escapes comparison, and the hard truth is that it does not. It merely shifts the comparison from the candidates to the boundaries of the pool. A lottery presupposes equal moral worth among those inside the circle, but it requires a prior decision about who gets inside the circle. The medical screen that eliminated most applicants was itself a comparative judgment, just one dressed in the objective language of physiology rather than the subjective language of worth. Furthermore, converting a comparison of magnitudes into a comparison of chances changes the expressive content of the decision without changing the outcome. Telling a loser that she was not chosen because she was less worthy is different from telling her she was not chosen because chance fell against her. The lottery protects the dignity of the loser by refusing to articulate a reason, but it does not absolve the committee of the responsibility for defining the eligible class. It is a procedural solution to a substantive problem, and your characters should feel the unease of knowing that the random draw is only as fair as the pool it draws from.

  The public recoil that followed tells us something crucial about the limits of this theory. It is not clear whether the comparisons were epistemically unavailable, meaning we cannot know who is worth more, or morally unavailable, meaning we may not ask. In practice, these two claims blur. We say we cannot know because we are afraid of what we might find if we did. The congressional solution of 1972, extending Medicare to end-stage renal disease, suggests that the problem of interpersonal comparison is often a scarcity problem in disguise. When you remove the scarcity, you remove the need to rank. But nothing is truly free; the cost is relocated from the committee room to the tax base. The comparison shifts from patient versus patient to patient versus taxpayer. We avoid saying one life is worth less than another by saying all lives are worth the price of the machine, but that price must still be paid by someone. This does not solve the philosophical problem; it dilutes it across the population.

  Finally, you must be plain about where the lens is silent. Social choice theory and utility calculus have no vocabulary for the expressive dimension of being ranked. To tell a person she is less worth saving than another is to inflict a harm distinct from death. It is a status harm. It tells her that her social existence was negligible. This is what your nurse sees in the faces of the rejected. The theory can calculate the loss of life-years, but it cannot calculate the loss of standing. When you write the arguments in that room, do not let them speak in the language of resolved ethics. They should not sound like villains, nor like heroes. They should sound like people trying to use a ruler to measure something that breaks when you touch it. The physician should argue for medical criteria because it feels objective, not because it is morally superior. The lay members should argue for social worth because it feels responsible, not because it is cruel. And the nurse should keep her ledger because someone has to record the cost of the measurement itself. You must not put words in their mouths that resolve the tension between the epistemic and the moral. They did not know if they could know, and they did not know if they should. That uncertainty is the only honest position available to them. The theory distorts the case if it suggests these choices can be made cleanly. They cannot. The distortion lies in believing that a procedure can sanitize the tragedy of having to choose at all.
