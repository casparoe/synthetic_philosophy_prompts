answer: |-
  # Q&A Prep Sheet: Weighted Non-Aggregation in Rescue Cases

  **Ordering Principle:** Ranked by potential to invalidate the core thesis (Damage Potential), highest to lowest.

  ---

  ### 1. The "Hope Nobody Asks" (The Scalability Trap)
  **Interlocutor:** *Any sharp attendee (likely the EA student or Normative Ethicist)*
  **The Question:** "You claim structured vulnerability overrides simple numbers. But imagine a small town of 500 people, densely networked with deep dependency ties, versus a global pandemic response where saving 100,000 diffuse, unconnected strangers is possible. Your view implies we should save the town. Are you willing to endorse letting the 100,000 die to save the 500? If not, doesn't that prove aggregation wins at scale, making your 'relational weight' just a threshold function of utility?"

  **Two-Minute Reply:**
  "I am willing to say the relational weight *matters*, but I must clarify the scope of 'rescue cases.' My view addresses immediate, non-iterative rescue dilemmas where agents face tragic choices, not macro-allocation policy. In the pandemic case, we are dealing with institutional allocation, not interpersonal rescue. However, if forced into the rescue framing: I would not let the 100,000 die. This is not because aggregation wins, but because 'structured vulnerability' has a limit. When the sheer magnitude of loss threatens the background conditions for *any* relational life to exist, the systemic harm shifts. Saving the 100,000 preserves the possibility of future relational structures. My claim isn't that relations always trump numbers, but that numbers don't trump relations *unless* the numerical loss is catastrophic enough to undermine the system in which relations matter. So, it's not a threshold of utility, but a threshold of systemic viability. The 500 town matters more per capita, but the 100,000 represents a collapse of the stage upon which dependency plays out."

  **Where the Reply is Soft:**
  The distinction between "interpersonal rescue" and "institutional allocation" is shaky in emergency contexts. Also, defining "systemic viability" without smuggling in utilitarian calculus is difficult.

  **Concede Up Front:**
  Concede that at *astronomical* scales, the view must accommodate the preservation of the moral community itself.

  **Hold at All Costs:**
  Hold that within standard rescue ranges (e.g., 1 vs. 5, or 10 vs. 50), relational structure overrides simple counting. Do not admit it is a utility threshold.

  ---

  ### 2. The Hidden Aggregation Charge
  **Interlocutor:** *Normative Ethicist (Kamm/Singer scholar)*
  **The Question:** "You say you aren't aggregating, but you're treating a parent-child pair as a 'unit' worth more than two strangers. Isn't 'preserving relational units' just a proxy for 'maximizing the value of lives lived'? If the child's suffering adds weight to the parent's death, haven't you just reintroduced aggregation under the guise of 'structure'?"

  **Two-Minute Reply:**
  "It looks like aggregation because the output is similar, but the *modal status of the harm* is different. Aggregation sums independent harms: Death A + Death B. My view identifies a *compound* harm: The death of the parent *plus* the structural collapse of the child's care network. This isn't 1 + 1 = 2. It's 1 + (1's dependency) = Systemic Rupture. If I save the strangers, I prevent two discrete losses. If I save the pair, I prevent a relational dissolution that alters the surviving child's moral status and future agency. Kamm allows for tie-breaking via relationships; I am arguing the relationship changes the *nature* of the loss, not just breaks a tie. We aren't counting lives; we are counting the integrity of moral networks. Aggregation assumes lives are separable containers of value. I am arguing they are constitutively linked. The math looks the same, but the metaphysics of the harm is distinct."

  **Where the Reply is Soft:**
  Explaining "Systemic Rupture" without quantifying it often collapses back into "more badness."

  **Concede Up Front:**
  Concede that in practice, the decision procedure often aligns with aggregation.

  **Hold at All Costs:**
  Hold that the *justification* is non-aggregative (preserving integrity vs. summing value). This is the core philosophical innovation.

  ---

  ### 3. The Longtermist/EA Challenge
  **Interlocutor:** *Graduate Student (Effective Altruism)*
  **The Question:** "If relational structure generates moral weight, does this view imply we have less obligation to future generations who have no current relational ties to us? It seems your view privileges present, local intimacy over astronomical future value. Doesn't this make your ethics parochial and incompatible with longtermist priorities?"

  **Two-Minute Reply:**
  "My view is specifically a theory of *rescue*, not a comprehensive theory of population ethics or obligation. Rescue implies an existing moral patient in immediate peril. Future generations do not currently exist in dependency networks that can be 'ruptured' in the present. However, this doesn't mean we ignore them. It means the *mechanism* of obligation differs. We owe future people existence, not rescue from immediate death via relational weighting. Prioritizing the structured vulnerability of existing people doesn't negate the duty to ensure the future exists. But in a direct trade-off—saving a existing care network vs. a probabilistic future benefit—my view favors the existing network. This isn't parochialism; it's recognizing that moral weight requires a moral subject. You cannot have structured vulnerability without a structure to violate. I am not denying longtermist goals, just restricting the scope of weighted non-aggregation to extant moral communities."

  **Where the Reply is Soft:**
  Restricting the scope looks like an ad hoc maneuver to avoid the implication that the view ignores the future.

  **Concede Up Front:**
  Concede the view is less action-guiding for longtermist interventions than standard utilitarianism.

  **Hold at All Costs:**
  Hold that "rescue" requires existing patients. Do not extend relational weight to non-existent beings.

  ---

  ### 4. The Decision Theory Objection
  **Interlocutor:** *Decision Theorist*
  **The Question:** "This sounds like you're just assigning a higher probability weight to the 'relational' outcome in an expected value calculation. If you treat a parent-child pair as 'heavier,' you're just saying P(Save Pair) * Value(Pair) > P(Save Strangers) * Value(Strangers). Why insist this isn't just Expected Value reasoning with extra steps?"

  **Two-Minute Reply:**
  "Because Expected Value (EV) requires commensurability of inputs. EV assumes I can quantify the 'Value' of a life and the 'Value' of a relationship on the same scale and sum them. My view denies commensurability. I am not saying the pair is 'worth more'; I am saying the *choice architecture* is different. In EV, if I add enough strangers, they always win. In my view, there may be no number of strangers that outweighs the rupture of a core dependency unit, short of total extinction. EV is continuous; my weighting is lexical or categorical. You treat relational weight as a multiplier in an equation. I treat it as a change in the variables themselves. It's not 'extra steps' in the same calculation; it's a refusal to run that specific calculation. The decision isn't 'which sum is larger,' but 'which moral fabric remains intact.'"

  **Where the Reply is Soft:**
  Claiming "lexical" priority is hard to defend without sounding dogmatic when numbers get large (see Objection #1).

  **Concede Up Front:**
  Concede that formalizing this without math is difficult for decision models.

  **Hold at All Costs:**
  Hold that the inputs are incommensurable. Do not allow them to reduce your view to a utility function.

  ---

  ### 5. The Political Equality Objection
  **Interlocutor:** *Political Philosopher (Relational Equality)*
  **The Question:** "By privileging existing dependency networks, aren't you reinforcing unequal distributions of care? Some people are deeply embedded in care networks; others are isolated. Your view suggests the isolated are 'worth less' in rescue scenarios. Doesn't this undermine public solidarity by privatizing moral worth?"

  **Two-Minute Reply:**
  "That is a serious risk, and one I take seriously. However, ignoring dependency doesn't create equality; it creates blindness. If we treat everyone as isolated atoms to ensure 'equality,' we fail to see the specific vulnerabilities of those who rely on others. My view isn't that the isolated person has less intrinsic worth, but that saving the network prevents a *cascade* of harm that the isolated person's death does not. The goal isn't to privilege the loved, but to prevent systemic collapse. In fact, recognizing structured vulnerability should push us toward *public* structures that mimic these dependencies for the isolated. If the state is the caregiver, the state becomes the relational node. So, rather than privatizing moral worth, this view should demand we build public relational structures so that the isolated are not left behind in the calculus. It exposes a deficit in social solidarity rather than endorsing it."

  **Where the Reply is Soft:**
  This relies on an optimistic view of state capacity to mimic private care networks.

  **Concede Up Front:**
  Concede that without public support, the view risks biasing rescue toward the well-connected.

  **Hold at All Costs:**
  Hold that ignoring real dependencies is more harmful than acknowledging them. The solution is more solidarity, not pretending ties don't exist.
