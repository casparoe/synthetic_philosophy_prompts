  ### Strategic Decisions

  #### Two Preemptive Concessions (First 2 Minutes of Talk)
  *To buy credibility and disarm the "technical nitpick" crowd:*
  1.  **Scoring Rule Specificity:** "I will be using the Brier score for the main lemma. I believe the intuition generalizes, but the formal proof here is specific to quadratic scoring. I'm not claiming this vindicates permissivism for *every* proper rule today." (Disarms Formal Ep 1).
  2.  **Scope of Application:** "This is a theory of epistemic rationality regarding evidence and credence. It is not a full decision-theoretic guide for model selection in engineering, nor a complete protocol for resolving peer disagreement." (Disarms Phil Sci 2 and Social Ep from expecting too much).

  #### The Load-Bearing Reply
  **Your Guess:** The Common Refinement point.
  **My Judgment:** You are **half-right**.
  The **Common Refinement** point is the *engine*: if refinement is always admissible, you get uniqueness. You must defend the claim that $E$ can support $A$ and $B$ without supporting $A \land B$.
  **However**, the **Weighting Constraint** (Advisor's point) is the *choke point*. If you cannot explain why weightings are constrained *enough* to avoid triviality but *not enough* to force uniqueness, the theory is either vacuous or collapses.
  **Verdict:** The **Common Refinement** reply is the one that must land for the *paper's main result* to stand. The **Weighting** reply is the one that must land for the *theory to be plausible*. Prioritize the Refinement defense in the Q&A because it justifies the Lemma, but prepare the Weighting defense meticulously because the Advisor will not let it go.

  #### What Counts as a "Genuine Win"?
  *   **For the Chair (Hostile Uniqueness Theorist):** She does not need to become a permissivist. A win is her admitting: "I still think uniqueness is true, but I agree that *if* evidence underdetermines the frame, your account correctly describes the resulting rational constraints." She accepts the *conditional* validity of your framework.
  *   **For the Imprecise Probabilist:** A win is him admitting: "The math is similar, but the frame-story offers a better *explanation* for the origin of the imprecision than my primitive sets do."
  *   **For the Room Generally:** A win is them accepting that **permissivism can be structured** (not "anything goes") and that **uniqueness can be frame-relative**.

  #### Where to Concede and Shrink vs. Reply
  *   **Reply:** Advisor (Weightings), Chair (Relocated Permissivism), Formal Ep 2 (Credal Set), Projectibility (if asked). These are core claims.
  *   **Concede & Shrink:** Phil Sci 1 (Verisimilitude), Phil Sci 2 (Model Selection), Social Ep (Disagreement). These are applications. If they say "This doesn't solve X practical problem," agree that it's a normative theory, not a practical manual. Shrinking the claim here protects the core theory from empirical counterexamples.

  #### Advisor's Objection: How Seriously to Take It?
  **Very Seriously.** She knows the dissertation's weak points better than anyone. If she thinks the weightings are unconstrained, she thinks the theory is trivial. If she thinks they are constrained, she thinks it's uniqueness.
  *   **Preparation:** You need a specific example of a constraint that is *not* uniqueness-fixing.
