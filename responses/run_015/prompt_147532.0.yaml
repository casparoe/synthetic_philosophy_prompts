answer: |-
  Here is your Q&A prep sheet, tailored to the specific profiles in the room and ordered by the product of **Likelihood $\times$ Damage**.

  ### 1. The Advisor (Weighting Constraints)
  **The Objection:** "You say the weighting over frames is constrained but not fixed. But if the constraints are weak enough to allow permissivism, aren't they too weak to rule out irrational weightings? And if they are strong enough to rule out irrationality, don't they collapse back into a unique weighting? You haven't solved the uniqueness problem; you've just hidden it inside the weighting function."

  **The Reply (2 mins):** "That's the central tension, and I agree the constraints need to be 'just right.' My claim isn't that *any* weighting is permitted, but that evidence constrains the *structure* of the weighting (e.g., monotonicity on fineness) without fixing the *values*. Think of it like priors in Bayesianism: rationality constraints exist (regularity, etc.), but they don't yield uniqueness. Here, the evidence rules out weightings that favor unsupported distinctions, but where evidence is silent on how to trade off two admissible frames, rationality allows variation. This isn't hiding uniqueness; it's locating indeterminacy where the evidence actually runs out."
  *   **Soft Spot:** This leans heavily on the analogy to priors. If the Chair argues that frame-weightings are *structural* and thus should be unique (unlike priors), you have no defense other than intuition.
  *   **Strategy:** **Reply.** Do not concede this; it is the engine of the view.

  ### 2. The Chair (Relocated Permissivism)
  **The Objection:** "Granting your framework, what have you bought me? A uniqueness theorist thinks permissivism confuses evidence for attitude. You've just moved the permissivism from the credence function to the frame-family. Why should I care that the indeterminacy is 'structured' if the outcome is still that two agents with the same evidence can rationally diverge?"

  **The Reply (2 mins):** "Because it changes the normative diagnosis. On standard permissivism, agents with the same evidence can rationally hold *contradictory* beliefs about the world. On my view, they must agree on all *evidence-supported* distinctions (the marginals of admissible frames). They only diverge on correlations the evidence says nothing about. This preserves the core uniqueness intuition—that evidence dictates belief where it speaks—while explaining disagreement where it doesn't. It's not 'anything goes'; it's 'agreement on the signal, freedom on the noise.'"
  *   **Soft Spot:** If the Chair holds that *all* rational divergence is irrational, this won't move her. You are asking her to accept a *kind* of permissivism she rejects.
  *   **Strategy:** **Reply.** This is your novelty claim.

  ### 3. The Formal Epistemologist 2 (Credal Set Redundancy)
  **The Objection:** "Mathematically, a set of credence functions agreeing on certain marginals looks exactly like a credal set. You've added all this machinery about frames and partitions, but if the output is just a set of probabilities, why shouldn't I just use the existing imprecise probability framework? What explanatory work is the 'frame' doing?"

  **The Reply (2 mins):** "The math might be isomorphic, but the explanation isn't. In imprecise probability, the 'size' of the set is often a primitive or a measure of ambiguity. Here, the size of the permissible set is *derived* from the discriminative power of the evidence. Thin evidence $\rightarrow$ coarse frames $\rightarrow$ wide ties. Rich evidence $\rightarrow$ fine frames $\rightarrow$ uniqueness. The frame machinery explains *why* the set has the structure it does, rather than just positing the set. It connects the epistemology of evidence to the geometry of the credal set."
  *   **Soft Spot:** If the math is truly isomorphic, a formalist might argue the explanation is superfluous ornamentation.
  *   **Strategy:** **Reply.** Emphasize the *derivation* of the set size.

  ### 4. The Decision Theorist (Hierarchical Bayesianism)
  **The Objection:** "You're averaging inaccuracy over a family of frames with a probability weighting. That's just a hierarchical Bayesian model where the 'hypotheses' are frames. Why call it 'frame-relative accuracy' instead of 'expected accuracy over a hypothesis space of frames'? If it's just Bayesian model averaging, you haven't introduced a new normative principle."

  **The Reply (2 mins):** "In hierarchical Bayesianism, the agent has a credence *in* the frame being the 'true' description. In my view, the agent doesn't believe one frame is true; she recognizes multiple frames as *admissible* representations of the same evidence. The weighting isn't a belief about which frame is correct; it's a parameter of how she aggregates accuracy across compatible descriptions. It's a structural constraint on evaluation, not a doxastic commitment to a model."
  *   **Soft Spot:** The formal similarity is strong. Distinguishing "belief in a frame" from "weighting a frame" requires careful metaphysical footing.
  *   **Strategy:** **Reply.** Insist on the distinction between *doxastic commitment* and *evaluative weighting*.

  ### 5. The Phil Sci 2 (Model Selection/Scale)
  **The Objection:** "In multiscale modeling, we choose a frame (scale) based on pragmatic goals, not just evidence. If I'm modeling a gas, I choose a macro-frame not because the micro-frame is inadmissible, but because it's useful. Does your view say choosing the macro-frame is *more accurate*? If not, how does this guide model selection?"

  **The Reply (2 mins):** "My view doesn't say the macro-frame is more accurate *simpliciter*; it says it might be the *only* admissible one if the evidence is macro-level. If you have micro-evidence, the micro-frame becomes admissible. This advises modelers: don't refine your model's distinctions beyond what your data supports. It warns against overfitting. If your evidence is coarse, a fine-grained model introduces accuracy costs on distinctions the evidence doesn't settle."
  *   **Soft Spot:** Scientists often use fine-grained models *without* fine-grained evidence (theoretical speculation). Your view might deem this "inaccurate" in a way scientists reject.
  *   **Strategy:** **Concede & Shrink.** Acknowledge this applies to *evidence-driven* selection, not heuristic exploration.

  ### 6. The Formal Epistemologist 1 (Scoring Rule Specificity)
  **The Objection:** "You rely on the squared-distance (Brier) score for your main lemma. We know vindication arguments often break when you switch to Log Score or other proper rules. Does your 'frame-relative' result hold for all strictly proper rules, or is your permissivism an artifact of Brier?"

  **The Reply (2 mins):** "That's a fair technical limitation. The main lemma as stated relies on the quadratic nature of Brier to ensure the marginals tie out cleanly. I conjecture it holds for a broader class of local proper rules, but I'm not claiming the full vindication for all rules yet. I'm arguing that *even on the most standard accuracy-first assumptions* (Brier), uniqueness fails. If it fails there, the uniqueness theorist has work to do, even if the result doesn't generalize to every rule."
  *   **Soft Spot:** It limits the scope of your "accuracy-first" claim.
  *   **Strategy:** **Preemptive Concession.** (See below).

  ### 7. The Phil Sci 1 (Verisimilitude/Truth)
  **The Objection:** "Philosophy of science teaches us that false models can be highly informative. Idealizations are deliberately inaccurate in your sense. Why should I care about minimizing inaccuracy relative to a frame if the best theory is strictly false in every frame? Accuracy isn't the right currency."

  **The Reply (2 mins):** "I'm not arguing for truth in the sense of 'perfect correspondence.' I'm arguing for 'accuracy' as 'closeness to the truth value distribution.' An idealized model can be 'accurate' in my sense if its credences align with the admissible frame's distinctions, even if the ontology is simplified. But I grant that if your goal is purely instrumental utility, accuracy might not be the sole currency. My claim is conditional: *if* you care about accuracy, here is how evidence constrains it."
  *   **Soft Spot:** You are retreating to a conditional claim.
  *   **Strategy:** **Concede & Shrink.** Frame it as an internal norm for epistemic rationality, not a theory of scientific utility.

  ### 8. The Social Epistemologist (Peer Disagreement)
  **The Objection:** "This is abstract. In a real peer disagreement, I don't know my peer's 'admissible frames.' How does this help me decide whether to conciliate? If we both have the same evidence, your view says we might have different admissible frames. Does that mean I should just tolerate any belief they have?"

  **The Reply (2 mins):** "It gives you a diagnostic tool. Before conciliating, check if your disagreement is on a *supported distinction*. If you disagree on a marginal of an admissible frame, one of you is inaccurate. If you disagree on a correlation between frames (an unsupported distinction), permissivism applies, and conciliation isn't required. It tells you *when* to fight and *when* to let be."
  *   **Soft Spot:** In practice, identifying "supported distinctions" is as hard as resolving the disagreement.
  *   **Strategy:** **Reply.** Focus on the *principle* of diagnosis, not the algorithm.

  ---

  ### The "Hope Nobody Asks" (Projectibility/Gerrymandering)
  **The Question:** "You say a frame is admissible if it respects evidence-supported distinctions. But what excludes a 'gerrymandered' frame, like one based on Goodman's 'Grue'? Nothing in your formalism seems to prevent an admissible frame from carving possibility space in bizarre, projectibly useless ways, as long as the evidence 'supports' it. How do you rule out bad frames without begging the question?"

  **The Reply:** "This is the hardest question, and I don't have a full metaphysics of 'support' yet. However, 'support' here isn't just psychological; it's structural. A Grue-frame requires a distinction that changes over time without evidence of the change. My constraint that weights 'not increase as frames get finer' penalizes gratuitous refinement. A gerrymandered frame is typically a *complex* refinement of a natural one. If the evidence doesn't support the complexity, the frame isn't admissible. I'm relying on a substantive, not purely formal, notion of evidence."
  *   **Honest Note:** This is the weakest link. You are outsourcing the hard work to "evidence support."
  *   **Damage Control:** If asked, admit this is the "black box" of the theory that requires external epistemological input. Do not bluff.

