      *   **Refining the "Winner":** I need to be careful not to say Mel is *wrong* that Owen is cheating. She is right about that. But Owen is right that she lacks the *standing* to blame him in the way she did. Toby captures this distinction better. Rin collapses them.

  7.  **Self-Correction/Nuance Check:**
