    "central_tension": "Externalism dictates that environmental differences create distinct mental contents, yet the twins' identical internal states and behaviors suggest a shared psychological reality.",
    "broad_content_claim": "Strong externalists argue Oscar and Twin Oscar have entirely different thoughts because the constitutive objects (H2O vs. XYZ) differ, meaning they share no truth-conditional content.",
    "narrow_content_option": "Middle-ground theories propose twins share a narrow, internal cognitive or phenomenal content that determines how broad content is fixed by the environment.",
    "key_risk_for_middle_ground": "If narrow content explains behavior and cognitive processing, it becomes the primary psychological content, effectively reinstating internalism and rendering externalism trivial.",
    "assessment": "The middle ground is theoretically viable only if narrow content is strictly limited to cognitive role while broad content retains authority over truth and individuation, a distinction that remains metaphysically precarious."
  }
