answer: |-
  The extension of Putnam's Twin Earth argument from linguistic meaning to mental content creates a profound tension regarding the nature of thought itself. In the original scenario, Oscar and Twin Oscar use the word "water" to refer to H2O and XYZ respectively. Putnam argued that because the extension differs, the meaning differs, proving that "meaning ain't in the head." When this is applied to mental states—specifically demonstrative thoughts like "that liquid is refreshing"—the stakes rise from semantics to psychology. If semantic externalism holds for mental content, then the content of Oscar's thought is constituted partly by the external environment (H2O). Consequently, Twin Oscar's thought, constituted by XYZ, has a different content.

  The conceptual issue arises when we ask whether the twins share *any* mental state. A strong externalist (or "pure" externalist) argues that because the truth conditions of their thoughts differ (one is about H2O, the other about XYZ), the propositional attitudes themselves are distinct. On this view, they share no conceptual content regarding the liquid's nature. However, this leads to a counterintuitive result: phenomenologically and functionally, the twins are identical. They behave the same way, their neural states are identical, and their subjective experience of "refreshment" feels the same. If externalism implies they share *no* mental content, it threatens to make psychological explanation impossible, as we could no longer generalize across individuals in different environments based on their internal states.

  To avoid this, many philosophers propose a "two-factor" or middle-ground theory. This view distinguishes between **broad content** (truth-conditional, external, dependent on the environment) and **narrow content** (internal, supervenient on the brain, capturing the cognitive role or phenomenal character). On this view, Oscar and Twin Oscar share the same narrow content (the mode of presentation or the functional role of the thought) which maps onto different broad contents depending on the context. This allows externalism to remain true about reference and truth conditions while preserving a shared mental life that explains behavioral similarities.

  The critical risk for this middle ground is that it may collapse back into internalism. Critics, such as Tyler Burge, argue that if narrow content is what drives behavior and cognitive processing, then narrow content is the *real* psychological content. If narrow content is defined purely internally, then externalism about *mental* content (as opposed to mere linguistic reference) is effectively abandoned. For externalism about mental content to remain coherent, it must show that broad content is not merely an add-on but plays an indispensable role in individuating mental states, without denying the reality of shared internal cognitive structures. If the distinction cannot be maintained, we are forced to choose between a psychology that ignores the environment (internalism) or a psychology that cannot explain why twins act alike (radical externalism).

