  - "narrow_content_option": what the middle-ground position proposes about shared phenomenal or demonstrative content;
  - "key_risk_for_middle_ground": the main reason critics think this middle ground collapses into internalism;
  - "assessment": your verdict on whether the middle ground can be sustained without contradiction.
