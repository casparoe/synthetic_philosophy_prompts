  **The Scenario**
  The town of Oakhaven is voting on a zoning change for its only buildable plot. Option A maintains the status quo: 50 long-term residents keep their spacious lots and reliable wells, sustaining a wellbeing level of 8/10. Option B approves high-density cheap housing, bringing in 400 new residents, but the local water table collapses non-linearly once the population crosses 200, causing sewage backups and low water pressure that drops the original 50 residents to 5.5/10. Due to lot variance in the new development, exactly half of the 400 newcomers end up with wellbeing at 5.1/10, while the other half suffer slightly more at 4.9/10.

  **The Check**

  **Belief/Scenario:** We're comparing a small, happy population (A) against a larger, barely-happy population (B) where infrastructure failure creates a specific wellbeing split among newcomers.

  **Theory Verdicts:**
  *   **Total Utilitarianism picks B:** They just sum the scores. Option A has 400 units of wellbeing (50 × 8), but Option B has over 2,200 units (50 × 5.5 + 200 × 5.1 + 200 × 4.9). The sheer number of lives makes B the winner, even if life is harder.
  *   **Average Utilitarianism picks A:** They look at the mean. Option A's average is 8, while Option B's average drags down to roughly 5.05. Since 8 is higher than 5.05, A wins on quality of life.
  *   **Critical-Level Utilitarianism splits:** This theory subtracts a "critical level" from every life to see if it's worth creating. If the level is set at 5, the 200 newcomers at 5.1 contribute positive value, potentially making B competitive depending on how negatives are handled. If the level is set at 6, everyone in Option B is below the critical line (negative value), while Option A residents are still above it, so A wins easily.
  *   **Threshold-Sensitive Person-Affecting picks A:** This view says we only count people who clear a 5.0 baseline. The 200 newcomers at 4.9 don't count at all. The 200 at 5.1 are new people, so creating them isn't a "benefit" to existing folks. The only thing that counts is the original 50 residents dropping from 8 to 5.5. Since they are hurt, A is the only moral choice.

  **Heavy Lifting Feature:** The **non-linear infrastructure collapse** does the heavy lifting here. If wellbeing dropped slowly, the originals might stay above 7, changing the Person-Affecting verdict. The sudden collapse forces the originals below their previous standard, creating the conflict between "more lives" (Total) and "hurt existing people" (Person-Affecting).

  **Linear Damage Counterfactual:** If the damage was linear (e.g., adding people slowly diluted resources without a collapse), the original residents might only drop to 7.5/10. In that case, the Person-Affecting view might not object as strongly since the harm is minor, and Average Utilitarianism might actually pick B if the newcomers were happy enough, dissolving the Repugnant Conclusion tension.

  **Total-Utilitarian Defense:** A Total Utilitarian would argue that excluding the 4.9-lives is arbitrary discrimination. They'd say a life at 4.9 is still worth living and adds positive value to the universe. They'd claim that worrying about the "average" or "thresholds" is just selfishness masking as ethics, and that bringing 400 people into existence is a massive good that outweighs the inconvenience suffered by the original 50.
