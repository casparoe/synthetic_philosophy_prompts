prompt: |-
  I'm the valedictorian at my school's graduation in three weeks, and I'm stuck on the address.

  Our assistant principal chose a theme for the year — "Be Yourself" — and it's on the banners, on the program, and she has asked the student speakers to work it in. The trouble is that the framework I've actually spent this year thinking through, in Mr. Aldridge's senior elective on existentialism, makes that slogan close to unintelligible. On that view there is no finished self for any of us to go and be; treating your own traits as settled facts about you is exactly the evasion the view warns against, the way people dodge the discomfort of having to choose. So I can't echo the theme literally without saying something I think is false.

  But I also can't just stand up and say the opposite, for two reasons I keep running into.

  First, sincerity isn't an available substitute. As I understand the position, demanding sincerity from yourself is another attempt to locate a real self you could finally match up with — the same move in different clothes. So I can't rescue the theme by translating it into "be authentic" or "be true to who you really are." I need some third thing to put at the center of the speech, and I don't know what it is.

  Second, a good part of my class had very little room to choose. One friend worked four nights a week at his family's restaurant through senior year; another is enlisting in the fall because it's the only way she can afford college. It would be obscene to tell them they could have been anything they wanted. So the speech has to take seriously that people's situations are real and constraining, without turning around and implying that those situations are what people are.

  There's a personal version of this too. For four years I've been saying "I'm just not a math person," and I've come to suspect that sentence has been doing more work for me than I admitted. I'd like to be able to say something about that in the speech — honestly, in a way that isn't either a confession or a boast.

  The audience will be about four hundred people: classmates, parents, grandparents, teachers. Mr. Aldridge will be there and will hear exactly what I did with the theme. My grandmother, who raised me, will be in the front row and will not follow a word of philosophy. The principal wants warmth rather than a lecture, so no jargon, no French, and no philosophers named from the stage.

  Please write the six-to-eight-minute address. It has to work as a graduation speech first — my classmates should feel something rather than feel analyzed — but I want its structure to survive Mr. Aldridge's attention. Where the theme has to be echoed, echo it in a form I could defend. Afterwards, add a short note explaining what the speech is committed to and where the load-bearing moves are, so I can answer him if he asks me about it at the reception.
reasoning: |-
  Here's a thinking process that leads to the suggested speech and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Valedictorian.
      *   **Context:** High school graduation, 3 weeks away.
      *   **Audience:** 400 people (classmates, parents, grandparents, teachers). Specific mentions: Mr. Aldridge (existentialism teacher, knows the philosophy), Grandmother (raised the speaker, won't follow philosophy), Principal (wants warmth, no jargon).
      *   **Theme:** "Be Yourself" (mandated by Assistant Principal).
      *   **The Conflict:** The speaker finds the theme philosophically untenable based on their study of existentialism (no fixed self, "being yourself" is bad faith/evasion).
      *   **Constraints:**
          *   Cannot say the opposite (nihilism/determinism).
          *   Cannot rely on "sincerity/authenticity" (still implies a fixed self).
          *   Must acknowledge structural constraints (friends working, enlisting) without implying those constraints define them.
          *   Must address personal history ("I'm not a math person") without confession or boast.
          *   Tone: Warm, emotional, not a lecture. No jargon, no French, no named philosophers.
          *   Length: 6-8 minutes (approx. 900-1200 words spoken at a moderate pace).
          *   **Deliverable:** The speech + a short analytical note for Mr. Aldridge.

  2.  **Deconstruct the Philosophical Problem:**

      *   *The Trap:* "Be Yourself" implies a pre-existing essence. Existentialism says existence precedes essence. You create yourself through action.
      *   *The Constraint:* Structural reality. You can't just "choose" your way out of poverty or obligation.
      *   *The Solution:* Shift from *noun* (Self) to *verb* (Being/Becoming). Instead of "Be [Who You Are]," it becomes "Be [In The Act of Choosing/Responding]."
      *   *Reframing the Theme:* "Be Yourself" shouldn't mean "uncover the statue inside the stone." It should mean "take responsibility for the next stone you lay." It's about *agency within constraint*.
      *   *The "Math Person" angle:* This is a label (essence). Rejecting it isn't about saying "I am now a math person," but "I was using that label to avoid the work."
      *   *The Structural Constraint angle:* Acknowledge the walls, but emphasize the climbing. The situation limits the *options*, not the *authorship* of the response.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Warmth, gratitude, acknowledging the theme immediately but gently pivoting. Connect with the grandmother/parents.
      *   **The Theme ("Be Yourself"):** Address it directly. Acknowledge the banners. Introduce the tension without using philosophy words. Use the "math person" anecdote here.
      *   **The Pivot (The "Third Thing"):** Move from "who we are" to "what we do." The self isn't a destination; it's a practice.
      *   **Addressing Constraints:** Acknowledge the friends working/enlisting. Validate their reality. Distinguish between *circumstance* and *identity*.
      *   **The Call to Action:** What do we do tomorrow? We choose. We build.
      *   **Closing:** Bring it back to the community, the school, and the theme in its revised form.

      *   *Tone Check:* Needs to sound like a smart 18-year-old, not a professor. Use metaphors. Keep sentences rhythmic.

      *   *Drafting - Specific Phrasing:*
          *   Instead of "Existentialism," use "The idea that we are finished products."
          *   Instead of "Bad Faith," use "Hiding behind labels."
          *   Instead of "Structural Determinism," use "The hands we were dealt."
          *   *The Math Story:* "I told myself I wasn't a math person. It was comfortable. It let me off the hook."
          *   *The Friends Story:* "Marcus worked nights. Sarah is joining the Army. That's not a limitation on their spirit; that's the ground they stand on."

      *   *Refining the Theme:* How to echo "Be Yourself" without lying?
          *   "Be yourself" -> "Be the one who chooses."
          *   "Be yourself" -> "Don't let the label be the end of the story."
          *   Let's try: "Be yourself" is an invitation to *make* yourself.

  4.  **Writing the Speech (Iterative Process):**

      *   *Intro:* Good evening. Look at the banners. "Be Yourself."
      *   *Body 1 (The Math):* I used that phrase to hide. "I'm not a math person." It felt like truth, but it was a shield.
      *   *Body 2 (The Class):* Some of us had shields, some had walls. Mention the workers, the enlistees. Their constraints are real. But they aren't definitions.
      *   *Body 3 (The Philosophy Lite):* If "Be Yourself" means finding a hidden treasure map, I don't have one. But if it means picking up the pen...
      *   *Conclusion:* We are verbs, not nouns. (Too cliché?). Let's try: We are the building, not the blueprint.
      *   *Revised Conclusion:* "Be yourself" is something you *do*.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm scolding the Assistant Principal. It needs to be a reinterpretation, not a rebuttal. Keep it warm for Grandma.

  5.  **Drafting the Note for Mr. Aldridge:**

      *   Need to explain the philosophical commitments clearly.
      *   Key move: Essence vs. Existence (without naming it).
      *   Key move: Facticity vs. Transcendence (constraints vs. projection).
      *   Key move: Rejecting sincerity as a static state.
      *   Explain how the speech navigates the "math person" and "structural constraint" issues.

  6.  **Review against Constraints:**

      *   6-8 minutes? (Word count check: ~1000-1100 words is usually safe for 6-8 mins with pauses).
      *   No jargon? (Checked).
      *   No philosopher names? (Checked).
      *   Grandma friendly? (Yes, emotional core is clear).
      *   Aldridge proof? (Yes, the structure holds up to scrutiny).
      *   Theme echoed? (Yes, redefined).

  7.  **Final Polish:** Check rhythm and flow. Ensure the transition from the personal math story to the class's structural constraints feels natural. (The link is "labels/limits we accept vs. limits imposed on us").

      *   *Math story:* Internal limit (self-imposed essence).
      *   *Friends story:* External limit (facticity).
      *   *Synthesis:* Both require the same response: Action within the limit.

  8.  **Final Word Count Check:** A 7-minute speech is roughly 900-1050 words at a measured speaking pace. I will aim for that range.

      *(Drafting the content...)*
      *   Start with the banners.
      *   Move to the math anecdote.
      *   Move to the friends (Marcus/Sarah).
      *   Define the "Self" as a verb.
      *   End with the charge to the class.

      *(Drafting the Note...)*
      *   Highlight the shift from noun to verb.
      *   Explain the handling of facticity.
      *   Explain the avoidance of "sincerity."

  9.  **Final Review:** Does this satisfy the user's specific intellectual dilemma? Yes, it navigates the "no fixed self" vs. "real constraints" paradox by focusing on *responsibility for the next action* rather than *alignment with an inner truth*.

      *Let's write.*
answer: |-
  **Valedictory Address: The Making of Us**

  Good evening. To the faculty, to our families who are scanning the crowd for the best angle on their phones, and to the Class of 2024.

  When we walked into the gym tonight, you couldn't miss the banners. They've been hanging in the hallways since September. The theme for our year, chosen by our administration, is "Be Yourself."

  It is a kind instruction. It is a warm instruction. And for the last four years, I have been trying to figure out what it actually means.

  I ask because I have spent a lot of time hiding behind that phrase. For most of high school, if you asked me why I avoided advanced math, or why I didn't try out for the debate team, I had a ready answer. I'd say, "I'm just not a math person," or "I'm not really a leader." I said it so often I started to believe I was describing a fact, like my height or my eye color. I thought "being myself" meant respecting my limitations. I thought it meant staying in my lane.

  But lately, I've started to suspect that sentence—"I'm just not a math person"—wasn't a description. It was an excuse. It was a way to stop choosing. If I'm *not* a math person, then I don't have to try, and I don't have to face the possibility of trying and failing. I could treat my identity as a finished product, something sealed in a box that I just had to carry around.

  If "Be Yourself" means opening that box and showing people what's inside, I don't think I can do that. I don't think any of us can. Because I don't think the box is full yet.

  We are not statues waiting to be uncovered. We are builders. And "Be Yourself" isn't an instruction to find a hidden blueprint; it's an instruction to pick up the trowel.

  Now, I know how that sounds. It sounds like I'm about to tell you that you can be anything you want. That if you just visualize it, the universe will provide. But look around this room. We know that isn't true.

  Some of us are graduating with acceptance letters to universities across the country. Some of us are graduating with enlistment papers because it is the only way to afford the education we need. Some of us spent senior year working four nights a week at a family business to keep the lights on at home.

  To tell those classmates that they could have been "anything" would be a lie. It would be disrespectful to the reality of their lives. The walls around us are real. The hands we were dealt are real.

  But there is a difference between the hand you are dealt and the way you play it.

  There is a difference between the situation you are in and the person you are becoming within it.

  My friend who is enlisting didn't choose the cost of tuition, but she is choosing how she meets that cost. My friend who worked the grill every Tuesday didn't choose the economy, but he chose to show up for his family. Their circumstances are constraints, yes. But they are not definitions.

  If we treat our circumstances as definitions, we are doing the same thing I did with math. We are saying, "This is what I am," when we should be saying, "This is where I am, and this is what I will do next."

  So, when we leave here tomorrow, and the banners come down, what do we do with "Be Yourself"?

  I think we have to change the grammar. We have to stop treating "Yourself" like a noun. It is not a thing you possess. It is a verb. It is something you do.

  To "Be Yourself" is to take responsibility for the next choice in front of you, even when the options are narrow. It is to admit that you are not finished. It is to look at the label you've stuck on your forehead—the quiet one, the loud one, the smart one, the struggling one—and realize you have the power to peel it off.

  It means that when you are tired, or scared, or when the world tells you who you are supposed to be, you don't retreat into what feels comfortable. You don't say, "Well, that's just how I am." You ask, "Is this who I want to become?"

  This is terrifying, of course. It is much easier to believe we are fixed stars than to admit we are wandering comets. It is easier to believe our grandparents' stories about us are our destiny than to write new ones.

  Speaking of which, I want to acknowledge the people in the front row. Our families. Many of you raised us with specific ideas of who we should be. Some of those ideas were gifts. Some of them were weights. To our parents and grandparents: thank you for carrying us. But tonight, we have to put ourselves down and start walking. We love you enough to tell you that we might not be the people you expected. We are the people we are choosing to make.

  I know I won't get this right. I will slip back into old habits. I will catch myself saying, "I'm just not good at this," or "That's not who I am." I will try to hide behind my own history.

  But if I can catch myself, if we can catch ourselves, we have a chance to do something better than "being" ourselves. We can make ourselves.

  We can look at the constraints—the money, the distance, the expectations, the fears—and we can acknowledge them without letting them drive. We can accept that we are responsible for our actions, even when we aren't responsible for our situations.

  So, Class of 2024, I am not wishing you the luck of finding out who you are. I am wishing you the courage to decide.

  Don't look for the self that is waiting at the finish line. Look at the ground beneath your feet. Look at the work in your hands. Look at the choice you have to make on Monday morning.

  Be not what you were. Be what you do.

  Thank you.

  ***

  **Note to Mr. Aldridge: Structural & Philosophical Commitments**

  **1. The Ontological Shift (Noun to Verb)**
  The speech avoids the trap of "sincerity" or "authenticity" (which imply a pre-existing inner truth to align with) by reframing the self as a *project* rather than a *substance*. When I say, "It is not a thing you possess. It is a verb," I am committing to the view that existence precedes essence. The self is constituted through action, not discovered through introspection. This allows me to use the theme "Be Yourself" without affirming a static essence.

  **2. Facticity vs. Transcendence**
  To address the structural constraints (the friend working, the friend enlisting), I distinguish between *facticity* (the brute facts of one's situation) and *transcendence* (the ability to project meaning onto those facts).
  *   *The Move:* I validate the reality of the constraints ("The walls around us are real") to avoid toxic positivity.
  *   *The Commitment:* I argue that while we are not responsible for our *situation*, we remain responsible for our *response* to it. This avoids determinism (the situation defines us) and naive voluntarism (we can ignore the situation). The moral weight lies in the *relationship* to the constraint, not the constraint itself.

  **3. The "Math Person" Anecdote (Bad Faith)**
  The personal story about math serves as the concrete example of *bad faith* (mauvaise foi), though I do not use the term. By treating a contingent failure ("I struggled with math") as a necessary essence ("I am not a math person"), I was using the label to evade the anxiety of freedom/choice. The speech identifies this evasion without resorting to self-flagellation (confession) or triumphalism (boast). It frames the realization as a shift in *responsibility*.

  **4. Audience Management**
  *   **For the Administration:** The theme is echoed repeatedly but redefined. It is not rejected; it is deepened.
  *   **For the Grandmother/General Audience:** The philosophy is translated into practical ethics ("Pick up the trowel," "Be what you do"). The emotional core is gratitude and courage, not abstract theory.
  *   **For You:** The argument holds up because it does not rely on "finding your truth." It relies on the burden of authorship. The conclusion ("Be not what you were. Be what you do.") is a defense of agency within facticity.

  **Load-Bearing Lines:**
  *   *"Their circumstances are constraints, yes. But they are not definitions."* (Distinguishes facticity from essence).
  *   *"It is easier to believe we are fixed stars than to admit we are wandering comets."* (Acknowledges the psychological comfort of determinism).
  *   *"We can accept that we are responsible for our actions, even when we aren't responsible for our situations."* (The core ethical claim).
