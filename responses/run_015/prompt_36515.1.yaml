answer: |-
  # Game Design: The Bitter Token

  **Objective:** To simulate the structural friction of Kavka's Toxin Puzzle without using technical terminology initially. Students will experience the difficulty of forming an intention to perform a costly act when the reward for that intention is already secured and the act itself is no longer instrumentally rational.

  **Class Size:** 18 Students
  **Time:** 75 Minutes
  **Materials:**
  *   18 small envelopes.
  *   36 slips of paper (2 per student).
  *   18 "Seminar Tokens" (printed cards, poker chips, or candy bars).
  *   1 bottle of lemon juice (or unsweetened cranberry/tonic mix) and 18 small disposable cups.
  *   A box/basket for collecting envelopes.
  *   Whiteboard/markers.

  **The Unpleasant Act:** Drinking a 1oz shot of straight lemon juice. It is safe, ethical, and viscerally unpleasant, but not harmful. ( *Instructor Note: Check for citrus allergies beforehand. Offer water chasers.*)

  **The Currency:** "Seminar Tokens." Collecting 3 tokens over the semester allows a student to drop one lowest quiz grade or choose one reading topic. For today, holding a token signifies "Winning Round 1."

  ---

  ## Part 1: The Honest Note on Verification
  **Read this before running the game.**

  Kavka's puzzle turns on the impossibility of intending something you know you will not do. However, a teacher cannot observe a student's mental state. You cannot know if they *intended* to drink; you can only know if they *said* they intended to drink.

  **The Substitution:** In this game, the Token is awarded based on a **Signed Declaration** ("I intend to drink"), not the mental state itself.
  **The Debrief Fix:** In the discussion, you must explicitly distinguish between *Claiming Intention* (what the game rewarded) and *Genuine Intention* (what the puzzle requires). You will ask students to privately self-audit whether their declaration matched their mental state. This gap is where the philosophy lives. If a student lies to get the token, they have "solved" the game but failed the puzzle (because they didn't actually intend). If they tell the truth but know they won't drink, they face the paradox.

  ---

  ## Part 2: Minute-by-Minute Timeline

  ### 0:00 – 0:10 | Setup & Rules (The "Billionaire" Frame)
  *   **Narrative:** Tell the class you are acting as a benefactor. You want to study decision-making.
  *   **The Deal:**
      1.  Each student receives an envelope and two slips of paper.
      2.  **Slip A (Public):** Write "YES" (I intend to drink the lemon juice at the end of class) or "NO" (I do not intend). Sign it. Put it in the envelope.
      3.  **Slip B (Private):** Write "YES" or "NO" regarding whether you *actually think* you will drink the juice later. Do not sign this. Put it in the envelope.
      4.  **The Reward:** You will collect the envelopes. If Slip A says "YES," you receive a Seminar Token **immediately**.
      5.  **The Catch:** The Token is yours to keep regardless of what happens next. There is no penalty for not drinking. The drinking happens at **Minute 60**.
      6.  **The Honor Code:** Explain that Slip A is a binding honor statement. They are to write "YES" only if, *at this exact moment*, they genuinely plan to drink.
  *   **Action:** Distribute materials. Give them 3 minutes to write and seal. Collect envelopes. Hand out Tokens to those who submitted "YES" on Slip A.

  ### 0:10 – 0:35 | The Waiting Period (Simulating the "Bank Deposit")
  *   **Goal:** Create a temporal gap where the reward is secured but the cost is pending.
  *   **Activity:** Conduct normal class business or a brief lecture unrelated to the game. This allows the "reward" to settle psychologically. The Tokens should be visible on their desks.
  *   **Subtle Prompt:** At minute 0:25, casually mention, "Just a reminder, the lemon juice will be served at minute 60. You can keep your Token either way."

  ### 0:35 – 0:50 | Round 2: The Advisor Complication
  *   **Setup:** Pair students up (9 pairs). If someone claimed "NO" in Round 1, pair them with a "YES" claimant if possible.
  *   **Roles:** One is the **Agent** (facing the choice again), one is the **Advisor**.
  *   **Scenario:** Tell them: "Imagine the rules change slightly. The Agent gets the Token *only if* the Advisor believes the Agent truly intends to drink. The Advisor gets a Token if the Agent actually drinks."
  *   **Task:** The Advisor must interview the Agent for 5 minutes. The Advisor must write a recommendation: "Will they drink?"
  *   **Purpose:** This forces students to articulate the conditions of intention from a third-person perspective. It highlights the skepticism: "Why would you drink once you have the token?"

  ### 0:50 – 1:00 | The Decision & The Act
  *   **Action:** Bring out the lemon juice and cups. Pour the shots.
  *   **Choice:** Students with Tokens (the "YES" group) choose: Drink or Keep Token?
  *   **Observation:** Watch the deliberation. Do they drink immediately? Do they hesitate? Do they laugh nervously?
  *   **Data Collection:** After the drinking choice, have students open their envelopes. They must mark a third slip (Anonymous): * "When you wrote Slip A at the start of class, were you truthful about your mental state?" (Yes/No)*. Collect these.

  ### 1:00 – 1:15 | The Debrief (Philosophical Mapping)
  *   **Step 1: The Data.** Reveal the anonymous truth-telling stats. (e.g., "10 people got tokens, but only 3 were truthful about intending").
  *   **Step 2: The Gap.** Ask the truthful "YES" students: "At minute 60, when you had the token in hand, did you still feel you *would* drink? Or did you feel you *should* drink?"
  *   **Step 3: Naming the Concepts.**
      *   **Intention vs. Prediction:** Slip A was Intention (plan). Slip B was Prediction (forecast). Did they come apart?
      *   **Intention at Will:** Can you just "decide" to intend? Or does intention require a reason to act?
      *   **The Verification Problem:** Remind them that you rewarded the *Claim*, not the *State*. Ask: "If I had a mind-reading machine, would anyone have gotten a token?"

  ---

  ## Part 3: Troubleshooting & Predicted Failures

  **1. The "Gamer" Response (Dominant Strategy)**
  *   **What happens:** Students realize the Token is guaranteed if they write "YES," and the lemon juice is optional. They write "YES" with zero intention of drinking.
  *   **Why it's okay:** This is the rational solution to the *game*, but it proves the *puzzle*. They couldn't intend; they could only lie.
  *   **Instructor Move:** In the debrief, validate this. "You found the dominant strategy. But Kavka asks: Could you have *intended*? If you knew you were lying, did you ever have the intention? No. So the reward remains out of reach for a perfectly rational agent."

  **2. The "Stubborn" Response (Irrational Commitment)**
  *   **What happens:** A student drinks the juice just to prove a point or because they "don't like backing out."
  *   **Why it's okay:** This resolves the puzzle by changing the agent's utility function (making "consistency" more valuable than "comfort").
  *   **Instructor Move:** Ask the class: "Is this rational? If they value consistency over comfort, then drinking *is* rational. But the puzzle assumes the act is purely unpleasant. Does 'pride' count as a reward?" This opens the door to discussing how we define "benefit."

  **3. The "Immediate Compliance" Response**
  *   **What happens:** Students drink the juice immediately upon seeing it, without the 10-minute deliberation gap.
  *   **Why it's okay:** It bypasses the "change of heart" moment.
  *   **Instructor Move:** Stop the class. "Pause. You have the token. You don't need to drink. Why are you drinking?" If they say "I promised," ask: "Did the promise bind you, or did you just want to?" This distinguishes *obligation* from *intention*.

  **4. The Verification Cynicism**
  *   **What happens:** Students argue the game was fake because you couldn't check their minds.
  *   **Instructor Move:** Lean into this. "Exactly. The Toxin Puzzle is impossible to test empirically because intention is internal. We just simulated the *pressure* of that internal state. The friction you felt (or didn't feel) is the data."

  ---

  ## Part 4: Debrief Script (Mapping Experience to Theory)

  **1. On Intention vs. Prediction**
  "Look at Slip A (Intention) and Slip B (Prediction). In a normal action, like 'I intend to eat lunch,' these match. I intend to do it, and I predict I will. In this game, for many of you, they diverged. You intended to get the token, but predicted you wouldn't drink. Kavka argues you cannot *intend* to drink if you *predict* you won't. Intention requires a belief in success."

  **2. On Intention at Will**
  "Raise your hand if you tried to 'make yourself' intend to drink just to get the token. Did it work? Most of you will say no. You can decide to *try*, but you can't decide to *intend*. Intention seems to be a byproduct of reasons, not a direct choice. If the only reason to drink was to get the token, and the token is already yours, the reason vanishes. So the intention vanishes."

  **3. On the Verification Problem (The Honest Note)**
  "I gave tokens for Slip A. But Slip A was just ink on paper. The real puzzle is about the mind. If I had a brain-scanner, and the rule was 'Token only if Scanner detects Genuine Intention,' how many tokens would I have distributed? Probably zero. The game rewarded *claiming*, but the philosophy questions *being*. The friction you felt—knowing you could lie, but feeling the oddness of promising something you planned to break—is the closest we can get to the puzzle in a classroom."

  **4. Closing Question**
  "Is it possible to be rational in this scenario? If you are rational, you take the token and don't drink. But if you are rational, you can't form the intention to get the token in the first place. So, does rationality prevent you from winning? Or does winning require a kind of irrationality?"
