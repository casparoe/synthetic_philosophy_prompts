      *   The Girl in the Red Coat: She breaks the anonymity. She forces Schindler (and the audience) to see an individual amidst the mass. Her death later signifies the failure of the system to protect individuals unless specific action is taken.
      *   Is this philosophy or filmmaking? It's filmmaking serving a philosophical point. The papers often deal in abstractions; the film deals in instantiation. The film argues that morality lives in the particular, not the general.

  6.  **Address Question 4: Where it Breaks Down / The "Gross" Factor:**
      *   This is crucial. Applying the "voting/consumption" framework to the Holocaust is risky.
