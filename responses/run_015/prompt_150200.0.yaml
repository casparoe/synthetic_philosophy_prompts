answer: |-
  1. The static argument shows that if your internal book prices violate sum rules, a counterparty can construct a portfolio at your quoted fair values that locks in a negative realized PnL across all possible outcome states. This is structurally identical to a static arbitrage where your pricing fails to cover the logical dependency between contracts.
  2. The dynamic updating argument shows that if you adjust quotes using any rule other than conditional probability, a trader can enter a strategy today and tomorrow that exploits the inconsistency between your current and future books. This looks like a dynamic arbitrage where your future fair value drifts away from the no-arbitrage constraint imposed by your current price and the information structure.
  3. If P(A) + P(~A) = S > 1, a one-sided bookie sells you both units for cost S against a guaranteed payout of 1, locking your loss at S - 1. If S < 1, she cannot take the short side to exploit the underpricing, so the sure-loss guarantee collapses when you are allowed to decline trades.
  4. The arbitrage mapping holds cleanly for static overpricing but breaks on underpricing and requires an adversarial counterparty who doesn't exist in passive market making. The residue is the claim that incoherence is inherently fatal even without an adversary, which translates to unmanaged tail risk rather than a guaranteed liquidation event.
  5. The argument overreaches by conflating vulnerability to attack with intrinsic error, suggesting your model is broken only when toxic flow exploits it rather than when it simply lacks edge. Incoherence is a defect in risk management that invites adverse selection, not a logical contradiction that voids your book's validity until realized.
