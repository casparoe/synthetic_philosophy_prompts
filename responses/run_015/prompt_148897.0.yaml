answer: |-
  # Joint Statement on Peer Disagreement Protocols
  **Drafted for Adversarial Collaboration**  
  **Parties:** Conciliationist (C) & Steadfastist (S)  
  **Mediator:** PhD Candidate (Epistemology)

  ## I. Agreed Claims (Constraints on the Debate)

  Both parties accept the following claims as background constraints. These are not mere platitudes; they rule out specific escape hatches previously used in debate.

  1.  **Peerhood is Domain-Specific:** We agree that "epistemic peer" is not a global property of persons. It is a relation relative to a specific question type and evidence base. If A is better at statistics and B is better at field mechanics, they are not peers on a question requiring both unless their combined reliability scores match.
  2.  **Transparency Requires Inferential Access:** "Visible reasoning" does not just mean sharing data. It requires sharing the inferential steps connecting data to conclusion. Hiding the algorithm or the weighting scheme violates transparency, even if the data is public.
  3.  **Credence is Reportable:** We reject expressivism here. When we say "I am 80% confident," this is a claim about our epistemic state that can be judged as accurate or inaccurate relative to frequency outcomes (calibration) or logical support (coherence).
  4.  **The Calibration/Coherence Distinction:** We agree that epistemic norms might shift depending on the goal. If the goal is **Predictive Calibration** (getting the number right over time), statistical weighting matters most. If the goal is **Explanatory Coherence** (making the story hang together logically), structural integrity matters most. We disagree on which goal governs standard peer disagreement.
  5.  **No "Easy Out" on Error:** Neither side can dissolve the disagreement simply by claiming the other is obviously mistaken without independent evidence. The disagreement itself must be treated as data, even if we disagree on how much weight that data carries.

  ## II. Disagreements Table

  | Crux Label | Conciliationist Formulation (C) | Steadfastist Formulation (S) | Status |
  | :--- | :--- | :--- | :--- |
  | **The Weight of Disagreement** | The fact of disagreement is itself higher-order evidence that requires credence adjustment, independent of the first-order evidence. | The fact of disagreement is only evidence if it signals a likely error in reasoning or evidence access I missed. | Substantive |
  | **Definition of "Peer"** | Peerhood is determined by prior reliability tracks. If our tracks match, we are peers, regardless of current reasoning visibility. | Peerhood requires current reasoning symmetry. If you can't show your work as clearly as I can, you aren't a full peer *now*. | Verbal (Resolved by Claim 1 & 2) |
  | **Response to Persistence** | If we remain peers after discussing, continued disagreement forces further conciliation (splitting the difference). | If we remain peers after discussing, continued disagreement suggests we are weighing shared evidence differently, which is permitted. | Substantive |
  | **Normative Goal** | Norms should prioritize Predictive Calibration (minimizing error over time). | Norms should prioritize Explanatory Coherence (maximizing understanding of why the belief is held). | Substantive |

  ## III. Deep Cruxes

  Here we isolate the specific mechanical disagreements that prevent consensus. We use the **Hurricane Case** for all three: *Two meteorologists (M1 and M2) predict hurricane intensity. Both have equal prior reliability tracks. M1 has direct access to raw satellite calibration logs (high visibility). M2 uses processed model output (lower visibility). Both understand the physics. Both claim 80% confidence. They disagree on the final intensity category.*

  ### 1. The Calibration-Profile Problem
  **Issue:** Is peerhood a binary switch or a gradient vector across sub-domains? And does gradient peerhood force local conciliation?

  *   **The Setup:** M1 is better at raw data interpretation (calibration). M2 is better at atmospheric dynamics (coherence). They are "peers" overall, but their profiles cross.
  *   **Conciliationist Prediction:** Peerhood is a gradient vector. Because M1 dominates on raw calibration (the logs), C argues we must conciliate *locally* on the data interpretation before moving to the final intensity. You cannot split the difference on the conclusion if you haven't split the difference on the sub-domain where the peer advantage lies.
  *   **Steadfastist Prediction:** Peerhood is binary enough for the final claim. If overall reliability matches, S argues you hold firm on the final intensity. The gradient matters for *who* should check *what*, but not for forcing credence reduction on the final output.
  *   **The Calibration/Coherence Inject:** C argues this is a **Predictive Calibration** task, so the gradient vector (M1's data access) dictates the norm. S argues this is an **Explanatory Coherence** task (physics modeling), so the final model output matters more than the raw logs.

  ### 2. Local vs. Global Conciliation
  **Issue:** Do you revise belief weights premise-by-premise or only at the final conclusion?

  *   **The Setup:** M1 and M2 disagree on the central pressure reading (premise), which leads to the disagreement on intensity (conclusion).
  *   **Conciliationist Prediction:** Conciliation must be **Local**. You must split the difference on the central pressure reading first. Then, you both recalculate the intensity based on the new, conciliated pressure. You cannot jump straight to splitting the intensity number because that hides where the error actually lies.
  *   **Steadfastist Prediction:** Conciliation is **Global** (or unnecessary). If my reasoning from pressure to intensity is valid, I don't need to conciliate on the pressure if I have good reason to trust my measurement over yours. Even if I do conciliate on pressure, I might not conciliate on intensity if my model is non-linear.
  *   **The Calibration/Coherence Inject:** C insists that **Predictive Calibration** requires local updating to maintain accurate error tracking. S insists that **Explanatory Coherence** allows holding the conclusion firm if the logical structure holds, even if premise confidence wobbles slightly.

  ### 3. The Weighting Asymmetry Problem
  **Issue:** When one peer has performed more visible reasoning steps but both arrive at the same confidence, does that break symmetry?

  *   **The Setup:** M1 shows the raw logs (10 steps of reasoning). M2 shows the processed output (1 step of reasoning). Both say "80% confidence."
  *   **Conciliationist Prediction:** Symmetry holds. If prior reliability is equal, the *visibility* of the steps doesn't grant extra weight. M2's "black box" is trusted because of their track record, not their current transparency. Therefore, we split the difference. The extra work M1 did is sunk cost, not epistemic weight.
  *   **Steadfastist Prediction:** Symmetry breaks. Visible reasoning grants epistemic privilege. M1 can hold firm because they have verified the chain. M2 should conciliate because their confidence rests on a processed layer they haven't individually verified in this instance. Transparency is a multiplier on reliability.
  *   **The Calibration/Coherence Inject:** This is the core fight. C treats this as **Predictive Calibration**: if the black box works historically, use it. S treats this as **Explanatory Coherence**: if you can't show the work, you don't truly *know* it, regardless of past success. S argues that in a disagreement context, coherence norms override calibration norms.

  ## IV. Next Steps for Collaboration

  1.  **Test Case:** We will run a simulation using the Hurricane Case data.
  2.  **Metric:** We will measure success both by final accuracy (Calibration) and by ability to reconstruct the error source (Coherence).
  3.  **Agreement:** If C's method yields better calibration but worse coherence, and S's yields better coherence but worse calibration, we acknowledge the norm is relative to the goal (Claim 4). If one method dominates both, the loser updates.
