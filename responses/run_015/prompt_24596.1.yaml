      *   *Physicalism:* Neurath was a logical positivist (Vienna Circle). He believed in "physicalist" language—statements about observable things, not metaphysics.
      *   *ISOTYPE Method:* Transform statistics into repeatable pictograms. One icon = $x$ units. Transformation is key (statistician -> artist -> educator).
      *   *Key Distinction:* It's not art; it's a tool for social organization. It's not just showing data; it's shaping how people *think* about society.

  3.  **Deconstruct the User's Vocabulary (Grammar of Graphics):**
      *   *Focus:* Mapping data variables to visual properties.
      *   *Epistemology:* Generally positivist/empiricist (data exists, we show it), but often agnostic about the *social purpose* beyond communication efficiency.
      *   *Key Concepts:* Marks, Channels, Scales, Data-Ink (Tufte), Pre-attentive processing (Ware).
      *   *Limit:* Often treats the viewer as a cognitive processor, not a political subject. Treats "data" as neutral.

  4.  **Drafting the Translation (Point by Point):**

      *   **(1) Picture Script vs. Picture Language:**
          *   *Neurath:* Script = realistic illustration (looks like the thing). Language = standardized symbol (stands for the thing).
          *   *GoG Translation:* Script = High fidelity raster image / Complex Mark. Language = Simplified Mark / Glyph.
          *   *Clean:* Distinction between realistic rendering vs. abstract symbol.
          *   *Distortion:* GoG sees this as a stylistic choice (aesthetic). Neurath sees it as a *logical* necessity for counting and comparison.
          *   *Lost:* The idea that "Script" traps you in narrative; "Language" enables syntax.

      *   **(2) Internationalism / Language Independence:**
          *   *Neurath:* Visuals bypass spoken language barriers. Universal understanding.
          *   *GoG Translation:* Pre-attentive channels (color, shape) are universal? Scales are universal?
          *   *Clean:* The idea that position/length are culturally agnostic.
          *   *Distortion:* GoG assumes "universal" perception (Ware). Neurath knew symbols needed *teaching* (transformation). GoG often ignores the legend/label dependency.
          *   *Lost:* The political imperative. Neurath wanted to unite the working class across borders. GoG just wants to reduce cognitive load.

      *   **(3) Denotative vs. Expressive:**
          *   *Neurath:* No art for art's sake. Emotion distracts from fact.
          *   *GoG Translation:* Data-Ink Ratio (Tufte). Remove chartjunk.
          *   *Clean:* Tufte is basically Neurath's grandson here. Maximize signal, minimize noise.
          *   *Distortion:* GoG treats "expression" as decoration. Neurath treated it as *ideological interference*.
          *   *Lost:* The moral dimension. For Neurath, expression is a lie. For GoG, it's just inefficient.

      *   **(4) Natural Language Baggage:**
          *   *Neurath:* Words carry metaphysics/class bias. Pictures are physicalist (observable).
          *   *GoG Translation:* Categorical labels vs. Quantitative measures.
          *   *Clean:* Discrete scales vs. Continuous.
          *   *Distortion:* GoG treats variable names as neutral headers. Neurath knew the *category* itself (e.g., "Unemployment") is politically loaded.
          *   *Lost:* The Logical Positivist foundation. Pictures verify facts; words argue opinions.

  5.  **Developing the Residue Report:**
      *   *The Core Question:* Is ISOTYPE just crude GoG?
