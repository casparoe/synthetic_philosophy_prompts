  8.  **Final Polish:** Organize with clear headings. Ensure the "Residue Report" is punchy and directly answers the prompt's final challenge. (Proceed to generate output based on these thoughts.)

  *(Self-Correction Note during drafting the response)*: I need to make sure I don't just say "GoG is apolitical." I need to explain *why* the vocabulary excludes politics. It excludes it because it treats the *viewer* as a cognitive system, not a citizen. Neurath treats the viewer as a citizen. That's the key residue.

  Also, clarify the "Transformation" principle. In GoG, the data goes in, the plot comes out. In ISOTYPE, the statistician, the artist, and the educator argue over the chart. That social process is missing from GoG.

