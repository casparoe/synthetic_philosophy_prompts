answer: |-
  This is a precise translation task. You are asking to map a socio-epistemological theory (Neurath) onto a cognitive-engineering framework (Grammar of Graphics).

  Here is the translation of Neurath's four theoretical pillars into your vocabulary, followed by the Residue Report.

  ---

  ### 1. Picture Script vs. Picture Language
  **Neurath's Claim:** A "picture script" (e.g., a photograph or realistic drawing) is mimetic; it reproduces the visual field. A "picture language" (ISOTYPE) is a system of discrete, repeatable units that denote quantities or categories.
  **GoG Translation:**
  *   **Picture Script:** A high-fidelity raster mark or a complex continuous area channel. It maps 1:1 to the retinal image. It relies on *recognition* (pattern matching against memory).
  *   **Picture Language:** A discrete mark (glyph) mapped to a quantitative scale via a **counting unit**. One icon = $N$ units. The visual channel is not just "shape," but "quantity of marks."

  **Translation Analysis:**
  *   **Clean:** The distinction between continuous tonal rendering (script) and discrete symbolic rendering (language) maps well to the distinction between continuous vs. binned/quantized scales.
  *   **Distorted:** In GoG, choosing a glyph over a bar chart is a choice of **mark type** based on data-ink efficiency or engagement. For Neurath, it is a logical necessity. A realistic drawing cannot be "added" (you can't stack two photos of a cow to make two cows). ISOTYPE marks must be mathematically combinable. GoG treats this as a styling choice; Neurath treats it as a syntactic requirement for arithmetic.
  *   **Lost:** The concept of **syntax**. GoG has grammar (aesthetics mapped to variables), but Neurath insisted on a *linguistic* syntax (ordering, grouping, narrative flow) that turns a chart into a sentence. GoG produces a "view"; Neurath produced a "statement."

  ### 2. Internationalism / Language Independence
  **Neurath's Claim:** A picture language must convey empirical content without relying on the grammar of spoken language (German, English, etc.). It must be universally legible to bypass national barriers.
  **GoG Translation:**
  *   **Claim:** Visual channels (position, length) are **pre-attentive** and culturally agnostic. Legends and labels should be minimized to reduce dependency on specific natural language tokens.
  *   **Clean:** The reliance on position and length as the most accurate, least culturally loaded channels aligns with Neurath's push for "objective" comparison.
  *   **Distorted:** GoG assumes universality is a property of *human perception* (Ware). Neurath knew universality was a property of *education*. ISOTYPE symbols were not "intuitively" understood; they were *taught*. GoG vocabulary assumes the viewer arrives pre-calibrated; Neurath's theory requires a "Transformer" (educator) to calibrate the viewer.
  *   **Lost:** The **political imperative**. GoG seeks to reduce cognitive load. Neurath sought to dissolve national borders. The "International" in ISOTYPE wasn't just about legibility; it was about creating a visual Esperanto for the working class to compare conditions across nations without state propaganda filtering the text.

  ### 3. Denotative vs. Expressive Function
  **Neurath's Claim:** Pictures must denote facts, not express emotion. Artistic style introduces subjective noise that corrupts the empirical signal.
  **GoG Translation:**
  *   **Claim:** Maximize the **Data-Ink Ratio** (Tufte). Minimize chartjunk. Avoid expressive color or decorative marks that do not map to data variables.
  *   **Clean:** This is the strongest overlap. Tufte's "erase non-data ink" is nearly identical to Neurath's "eliminate expressive surplus." Both treat decoration as error.
  *   **Distorted:** In GoG, "expression" is often framed as an aesthetic failure or a distraction. In Neurath's theory, expression is an **epistemological lie**. An expressive brushstroke implies a subjective truth claim. Neurath's Physicalism demanded that only verifiable, observable statements be visualized.
  *   **Lost:** The **moral dimension**. For you, a misleading axis is a design error. For Neurath, it was a social betrayal. GoG vocabulary lacks a category for "ideological distortion" distinct from "cognitive distortion."

  ### 4. Natural Language Baggage vs. Picture Purity
  **Neurath's Claim:** Words carry metaphysical, historical, and class-based connotations (e.g., "The State," "The People"). Pictures show only observable physical arrangements (e.g., "50 men with guns").
  **GoG Translation:**
  *   **Claim:** Categorical variables (strings) are prone to ambiguity; Quantitative variables (numbers) are precise. Prefer quantitative scales over categorical labels.
  *   **Clean:** The preference for quantitative over categorical data aligns with Neurath's preference for counts over concepts.
  *   **Distorted:** GoG treats variable names as neutral headers. Neurath argued that the *definition of the variable itself* is politically loaded. If you visualize "Unemployment," GoG asks "What is the scale?" Neurath asks "Who defined 'unemployed' and why?"
  *   **Lost:** **Logical Positivism**. Neurath's theory rests on the idea that only statements reducible to physical observation are meaningful. GoG has no mechanism to filter "metaphysical" data. You can visualize "Happiness Index" as easily as "Grain Output." Neurath would reject the former as unvisualizable nonsense; GoG accepts it as a string variable.

  ---

  ### Residue Report

  **Does ISOTYPE survive the translation?**
  Partially. The *mechanics* of ISOTYPE translate cleanly into the Grammar of Graphics. The *purpose* does not.

  **The Residue (What is left over):**
  1.  **The Transformer:** In GoG, the designer maps data to marks. In ISOTYPE, there is a triad: Statistician (data), Artist (form), Educator (audience). The "Educator" role is missing from your vocabulary. You optimize for the *display*; Neurath optimized for the *uptake*.
  2.  **Physicalism:** Your vocabulary allows you to visualize any dataset. Neurath's theory forbids visualizing unobservable concepts. Your tools are agnostic; his were prescriptive.
  3.  **The Social Contract:** GoG assumes a contract of *efficiency* (I show, you see). ISOTYPE assumed a contract of *emancipation* (I show, you understand, you act).

  **Diagnosis: Defect of Vocabulary or Incoherence of Project?**
  It is a **defect of your vocabulary**, but not because it is "technical." It is because your vocabulary is **instrumental**, whereas Neurath's was **constitutive**.

  *   **Your Vocabulary (GoG):** Treats visualization as a *pipeline*. Input (Data) $\to$ Process (Mapping) $\to$ Output (Chart). It is engineering. It asks: "Does this chart accurately transmit the signal?"
  *   **Neurath's Vocabulary:** Treats visualization as a *social technology*. It asks: "Does this chart enable a citizen to participate in democratic planning?"

  **Verdict on your Intuition:**
  Your intuition that "ISOTYPE is just an early, cruder Grammar of Graphics" is **false**.
  ISOTYPE is a **Pedagogy** that uses a Grammar of Graphics.

  The "crudeness" you perceive is actually **constraint**. Neurath restricted the available marks and channels not because he lacked technical sophistication, but because he believed unlimited expressivity leads to bourgeois individualism and obfuscation.

  **The Missing Piece:**
  The Grammar of Graphics describes **how to see**. Neurath's theory describes **what counts as knowledge**.
  Your vocabulary has no variable for "Social Utility." It has no scale for "Democratization." It treats the viewer as a cognitive processor (eyes + brain). Neurath treated the viewer as a political subject (citizen + worker).

  **Conclusion:**
  You cannot fully express Neurath's theory in GoG vocabulary because GoG is designed to optimize *communication*, while ISOTYPE was designed to optimize *social organization*. The residue isn't noise; it's the politics. If you strip that away, you have the *style* of ISOTYPE, but you have lost the *theory*. You are left with pictograms, but you have lost the "International System."
