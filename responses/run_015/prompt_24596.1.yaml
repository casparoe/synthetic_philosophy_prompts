      *   *The "Defect":* The user's vocabulary is technical/engineering. It optimizes for *accuracy* and *efficiency*. Neurath optimized for *comprehension* and *emancipation*.
      *   *Neurath's Coherence:* He bundled epistemology (what is true?) with politics (who gets to know?). GoG strips the politics.
      *   *Conclusion:* The residue is the *Transformative Process* and the *Social Contract*. GoG assumes the data is ready to be plotted. Neurath insisted on the "Transformer" who mediates between expert and public.

