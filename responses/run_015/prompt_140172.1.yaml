      *   *Empirical Test:* To distinguish Amplification vs. Cliff, we need to know the *state space* of the system. Was WWI inevitable (Cliff edge) or contingent (Amplification)? We test this by running counterfactual simulations (mental or computational) varying the "nail" while holding structures fixed.

  8.  **Refining the Output Structure:**
