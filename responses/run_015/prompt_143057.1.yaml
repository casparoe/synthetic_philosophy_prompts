answer: |-
  This is an exceptionally sharp diagnosis of the literature. You have correctly identified that "multiple realizability" (MR) is often treated as a premise when it is actually a *consequence* of a theory of realization that hasn't been fully specified. Your suspicion about the equivocation is also well-founded; the move from "heterogeneous tokens" to "distinct types" is where most arguments leak.

  Below is an organized specification of what an adequate account of realization must deliver, based on your six points but sharpened to expose the fault lines. I have categorized requirements by their status within the standard physicalist framework, identified the critical conflict, and tested your suspicion.

  ### I. The Specification: Requirements for an Adequate Account of Realization

  I have consolidated your six points into four core requirements.

  **1. The Non-Triviality Constraint (Derived from your Points 1 & 5)**
  *   **Requirement:** The account must restrict the set of admissible mappings between physical states and mental roles. It must explain why a rock does not realize a mind (Putnam's worry) and why not every physical description counts as a realizer description.
  *   **Rationale:** Without this, MR is trivial. If *any* causal role specification counts, then every physical state realizes every mental state under *some* description, refuting type-identity trivially but also rendering the concept of realization explanatorily useless.
  *   **Status:** **Non-Negotiable.** (Internal to the project of making realization a substantive metaphysical relation rather than a logical trick.)

  **2. The Individuation Constraint (Derived from your Point 3)**
  *   **Requirement:** The account must specify the "causally relevant respects" in which disparate physical systems resemble one another without defining those respects *in terms of the mental state itself*.
  *   **Rationale:** To avoid circularity. If we say "System X realizes Pain because it plays the Pain-role," we have not explained realization; we have just renamed the correlation. We need independent criteria for similarity (e.g., computational structure, homeostatic property clusters) to ground the claim that an octopus and a human share a state.
  *   **Status:** **Non-Negotiable.** (Required for realization to be a naturalistic relation.)

  **3. The Causal Integrity Constraint (Derived from your Point 4)**
  *   **Requirement:** The realized property must have causal powers that are not redundant with the realizer's powers (avoiding epiphenomenalism), yet the realizer's powers must remain sufficient to determine the physical effects (respecting causal closure).
  *   **Rationale:** This is the Exclusion Problem. If the physical realizer does all the work, the mental state is a shadow. If the mental state does extra work, physics is incomplete. An account of realization must show how the mental property inherits or constitutes the causal power of the base without being a competitor to it.
  *   **Status:** **Non-Negotiable.** (Required for non-reductive physicalism to be coherent.)

  **4. The Epistemic Accessibility Constraint (Derived from your Points 2 & 6)**
  *   **Requirement:** The account must provide criteria for determining whether a "black box" system (e.g., a neural net) realizes a state, and it must handle borderline cases (damage, drift) without arbitrary thresholds.
  *   **Rationale:** If realization is metaphysically possible but epistemically inaccessible, it cannot serve the scientific function MR is supposed to serve (unifying psychology across species/substrates).
  *   **Status:** **Camp Prejudice.** (A hard-line metaphysical realist might argue realization is factive even if we can't verify it. However, for a philosophy of *science* context, this is effectively non-negotiable.)

  ---

  ### II. Critical Analysis of the Requirements

  #### Which requirement does the most work?
  **The Non-Triviality Constraint.**
  This is the gatekeeper. Most candidate theories of realization (especially simple functionalism) collapse because they cannot explain why the mapping between base and role is restricted. If you cannot solve triviality, you cannot get to the question of causal integrity. The "hardware/software" analogy fails here precisely because *any* physical system can be interpreted as running *any* program if the mapping is unconstrained (Searle's wall). A theory that solves this (e.g., by requiring specific structural isomorphisms) immediately excludes many candidate realizers, potentially undermining the breadth of MR.

  #### Are any requirements jointly unsatisfiable?
  **Yes. There is a tension between Non-Triviality (1) and the scope required for Multiple Realizability.**
  *   **The Conflict:** To avoid triviality (Req 1), you must constrain the physical realizers (e.g., they must share specific structural or dynamical properties). To support robust Multiple Realizability (the thesis that physically *heterogeneous* systems realize the same state), you must allow the physical realizers to vary widely.
  *   **The Breakdown:** If you tighten the constraints to satisfy Non-Triviality, you risk "Local Type Identity" (Polger & Shapiro's argument): it turns out that all *actual* realizers of pain share a specific physical kind (e.g., nociceptive specific neural architecture), collapsing MR into a contingent claim about limited diversity. If you loosen the constraints to allow radical heterogeneity (silicon, ectoplasm, swarms), you invite Triviality (anything can realize anything).
  *   **Paper Angle:** This is your strongest lead. You can argue that the "Two Jobs" you identified are in tension: Job 1 (refuting type identity) requires loose constraints; Job 2 (identifying realizers in unfamiliar systems) requires tight constraints. You cannot maximize both.

  ---

  ### III. Testing Your Suspicion: The Equivocation

  Your suspicion is correct and constitutes a major fault line in the literature (notably between Putnam/Fodor and Kim/Churchland).

  1.  **Claim A (Token Heterogeneity):** One and the same mental state type can be instantiated by physically distinct token systems. (Compatible with Local Type Identity).
  2.  **Claim B (Type Distinctness):** No physical kind is nomologically coextensive with any mental kind. (Incompatible with Type Identity).

  **Should a good theory keep them apart?**
  Yes. A rigorous theory of realization must distinguish between *contingent* multiple realizability (humans and octopuses happen to be different) and *necessary* multiple realizability (it is law-impossible for a physical kind to match a mental kind).

  **Does keeping them apart cost the argument anything?**
  Yes, it costs the anti-reductionist argument its force.
  *   **The Cost:** MR is typically used to argue against Reductionism (Type Identity). But MR only entails Non-Reducibility if Claim B holds. Claim A is compatible with "Local Reductionism" (Nagel/Churchland): we can reduce pain-in-humans to C-fiber-firing and pain-in-octopuses to X-ganglion-firing.
  *   **The Verdict:** If you keep them apart, you admit that MR does not *automatically* refute Type Identity; it only refutes *Global* Type Identity. It leaves open the possibility of many local identities. This weakens the "hardware/software" analogy, because software is usually defined functionally (Claim B), but if the "hardware" constraints are tight enough to avoid triviality, the "software" might just be a disjunction of hardware types.

  ---

  ### IV. Scorecard of Contenders

  Here is how the main theories of realization fare against your four requirements (1: Non-Triviality, 2: Individuation, 3: Causal Integrity, 4: Epistemic).

  **1. Type-Identity Theory**
  *   **Performance:** Fails the MR job by definition.
  *   **Score:** Passes 1, 2, 3, 4 easily. It is the most robust metaphysically because it posits no distinct realized property.
  *   **Verdict:** It solves the problems of realization by denying realization exists. It cannot do the work your group wants (justifying MR), but it is the "control group" for why MR is hard to formulate.

  **2. Flat Causal-Role Functionalism (Putnam/Fodor)**
  *   **Performance:** Defines realization as occupying a causal role defined by a theory.
  *   **Score:** Fails 1 (Triviality: anything can occupy a role under some description). Fails 3 (Causal Integrity: the role is defined by its effects, leading to circularity or epiphenomenalism). Passes 4 (Epistemic) only if the theory is fixed.
  *   **Verdict:** The "hardware/software" view. It makes MR easy to assert but hard to ground non-trivially.

  **3. Dimensioned View (Gillett)**
  *   **Performance:** Realizers contribute causal powers that constitute the realized property's powers.
  *   **Score:** Strong on 3 (Causal Integrity: powers are shared, not competing). Struggles with 1 (Non-Triviality): determining which dimensions are relevant risks circularity. Good on 2 (Individuation) via power profiles.
  *   **Verdict:** Metaphysically sophisticated but complex to apply to "black box" cases (Req 4).

  **4. Subset View (Shoemaker)**
  *   **Performance:** The causal powers of the realized property are a subset of the causal powers of the realizer.
  *   **Score:** Excellent on 3 (Causal Integrity: avoids exclusion by subset relation). Good on 1 (Non-Triviality: restricts realization to power-subset relations). Struggles with 2 (Individuation): individuating powers without reference to effects is difficult.
  *   **Verdict:** Currently one of the strongest contenders for physicalists, but requires a robust theory of "powers."

  **5. Ramsified Recipe (Lewis)**
  *   **Performance:** Mental terms are defined by quantifying over the whole psychological theory (T-terms).
  *   **Score:** Good on 2 (Individuation: roles defined by theory). Fails 1 (Non-Triviality) if the theory is too abstract; fails 4 (Epistemic) because we rarely have a complete T-theory to Ramsey-fy. Struggles with MR across species if the "theory" is human-specific.
  *   **Verdict:** Great for semantics, less clear as a metaphysical account of realization in non-human systems.

  ### Summary Recommendation for Your Paper

  Your reading group is operating on the "Flat Causal-Role" model (hardware/software). Your paper should argue that this model fails the **Non-Triviality Constraint**.

  If you press the group on *why* the software isn't just a description of the hardware (which would lead back to Type Identity), they will have to appeal to **Individuation** (what makes the role the same?). If they define the role functionally, they risk circularity. If they define it structurally, they risk excluding valid realizers (undermining MR).

  **The Thesis:** The "Two Jobs" of Multiple Realizability (Anti-Reductionism vs. System Identification) pull in opposite directions. To refute Type Identity, realization must be abstract (loose constraints). To identify realizers in unfamiliar systems, realization must be concrete (tight constraints). A theory that satisfies the first fails the second, and vice versa. The hardware/software analogy masks this tension by treating the "software" as both abstract (to allow MR) and specific (to have causal power).
