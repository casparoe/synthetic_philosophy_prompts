      *   *Tone Check:* Ensure I don't sound like I'm lecturing. Keep it collaborative ("Here's how you might frame it...").

  9.  **Final Polish:** Check against the user's specific constraints (general readership, science/ideas focus, avoid proto-feminist cliché). Ensure the distinction between "mood" and "project" is highlighted.

  **(Self-Correction Note):** I need to make sure I don't oversimplify Du Châtelet. She wasn't just saying "lie to yourself." She was saying "curate your perceptions." Voltaire says "perceptions will be curated by reality violently."

