      *   *Cunégonde:* Address the "ugliness." Du Châtelet knew she was aging; Voltaire makes it grotesque. This is where he diverges. She valued the *memory* of passion; he shows the *reality*.
      *   *Illusions:* Pangloss is the key. Du Châtelet says keep illusions that serve you. Pangloss keeps an illusion that blinds him to danger. Voltaire says: Truth hurts, but lies kill.
      *   *The Garden:* Connect "Study" to "Garden." Both are active, both ward off boredom (the great enemy for both).
      *   *Strains:* Don't force *Candide* to be a direct response to the *Discourse*. It's a response to the *world* (Lisbon) and *Optimism*.
