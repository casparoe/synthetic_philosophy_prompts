answer: |-
  ### Desiderata for an Adequate Ontology of Cohorts

  To determine whether generational categories denote real social kinds rather than convenient fictions, any proposed ontology must satisfy a specific set of criteria. These desiderata function as stress tests, probing whether the category holds up under logical, empirical, and explanatory scrutiny.

  **1. The Boundary Tolerance Condition**
  *   **Motivating Case:** The "Cusper" Problem. Common-sense definitions rely on hard cutoffs (e.g., January 1, 1981). However, individuals born months apart on either side of this line share nearly identical formative experiences, while those born months apart within the same generation may differ significantly due to socioeconomic or geographic variance. An ontology that treats a 24-hour difference in birth time as an ontological chasm commits a sorites error.
  *   **Status:** **Non-negotiable.** Any ontology claiming to describe reality must account for vagueness. If the theory cannot explain why boundary individuals do not undergo an ontological switch at midnight on a cutoff date, it fails basic logical coherence.

  **2. The Causal Mechanism Condition**
  *   **Motivating Case:** Aggregate vs. Kind. A statistical aggregate groups items by shared properties (e.g., "people born in 1990"); a natural or social kind groups items by shared causal mechanisms that produce those properties (e.g., "gold" is defined by atomic structure, not just yellowness). Popular treatments assume birth year causes cultural attitudes. An adequate ontology must identify the specific causal glue (socialization, economic shock, technological immersion) that binds the group, distinguishing it from a mere marketing bin.
  *   **Status:** **Non-negotiable.** Without a causal mechanism, the category is merely a label, not an ontological kind. This is the threshold condition for realism.

  **3. The Geographic Indexicality Condition**
  *   **Motivating Case:** Cross-National Divergence. A person born in 1985 in the United States and a person born in 1985 in Iran experienced radically different formative political and technological environments. If "Millennial" denotes a real kind, it cannot apply universally to the same birth years globally without losing explanatory power. The ontology must allow for cohorts to be indexed to specific cultural or political spheres.
  *   **Status:** **Non-negotiable.** Empirical demography and history demonstrate that formative conditions are locally contingent. An ontology that ignores this contradicts observable data.

  **4. The Developmental Alignment Condition**
  *   **Motivating Case:** Sensitive Periods. Developmental psychology indicates that certain attitudes and behaviors are cemented during specific windows of neuroplasticity (typically late adolescence to early adulthood). An ontology that defines cohorts by events occurring after these windows close (e.g., a recession impacting 40-year-olds) fails to capture the mechanism of cohort formation.
  *   **Status:** **Non-negotiable.** This respects the biological and psychological constraints of the human subjects constituting the social kind. Ignoring developmental windows renders the theory biologically implausible.

  **5. The Explanatory Depth Condition**
  *   **Motivating Case:** Predictive Utility. If generational categories are real kinds, they should do explanatory work beyond post-hoc description. They should allow for predictions about voting behavior, consumption patterns, or social values that cannot be better explained by age effects (lifecycle) or period effects (current events).
  *   **Status:** **Preference of the Realist Camp.** A Strict Constructivist would argue that the *function* of the label is the reality, regardless of predictive power. However, for the category to count as a *causal kind* rather than a *discursive tool*, it must satisfy this condition.

  ***

  ### The Most Damaging Requirement

  The requirement that does the most damage to popular "common-sense" treatments is **The Causal Mechanism Condition**.

  Common-sense treatments operate on a "Birth-Interval Essentialism," assuming that the mere fact of being born within a specific range confers shared traits. This view treats the birth year itself as the causal engine. By demanding a specific causal mechanism (e.g., shared exposure to a technological shift during formative years), this desideratum severs the link between *birth date* and *social identity*. It reveals that two people born in the same year may belong to different ontological cohorts if their causal exposures differ, and two people born in different years may belong to the same cohort if their exposures align. This dismantles the rigid, calendar-based boxes used in media and marketing, forcing a shift from administrative convenience to sociological reality.

  ***

  ### Evaluation of Competing Ontologies

  **1. Strict Constructivism**
  *   **Performance:** This view treats generations as purely discursive tools created by media, marketers, and institutions to organize populations.
  *   **Against Desiderata:** It excels at **Boundary Tolerance** (boundaries are arbitrary by design) and **Geographic Indexicality** (labels are locally applied). However, it fundamentally rejects the **Causal Mechanism Condition** and **Explanatory Depth Condition**, viewing them as category errors. For the constructivist, the "kind" exists only insofar as people believe in it.
  *   **Verdict:** Ontologically parsimonious but fails to account for why non-discursive patterns (e.g., economic scarring) persist regardless of labeling.

  **2. Birth-Interval Essentialism**
  *   **Performance:** This is the "common-sense" view that generations are defined strictly by birth years (e.g., 1965–1980).
  *   **Against Desiderata:** It fails **Boundary Tolerance** (cannot explain cuspers), fails **Geographic Indexicality** (assumes global uniformity), and fails **Causal Mechanism** (confuses correlation with causation). It respects **Developmental Alignment** only by accident.
  *   **Verdict:** Administratively useful but ontologically bankrupt. It collapses the distinction between statistical aggregation and causally integrated kinds.

  **3. Event-Based Cohort Theory**
  *   **Performance:** This view defines cohorts by shared exposure to significant historical or technological events during formative years, regardless of strict birth dates.
  *   **Against Desiderata:** It satisfies **Causal Mechanism**, **Geographic Indexicality**, and **Developmental Alignment** robustly. It struggles slightly with **Boundary Tolerance**, as the start and end of "events" can be as vague as birth cutoffs, though this vagueness is sociological rather than arbitrary. It meets **Explanatory Depth** by linking specific exposures to specific outcomes.
  *   **Verdict:** The strongest candidate for a realist ontology. It sacrifices administrative neatness for causal accuracy, successfully distinguishing real social kinds from demographic bins.
