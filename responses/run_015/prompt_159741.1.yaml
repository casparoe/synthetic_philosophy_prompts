  **Advice on Scope:** Leave the scientific thought experiments (Galileo, Einstein) out entirely. Six months is extremely short for rigorous philosophical work on formal logic. Adding physics analogies invites category errors (normative proof vs. descriptive model) that will consume your time without sharpening the core logical question. The committee wants to see you solve the puzzle you identified, not branch into a second field. Discipline here signals feasibility.

  ***

  **PROJECT PROPOSAL**

  **Title:** The Epistemic Status of Meta-Systemic Tracking: A Conservative Extension Account of "Jumping Out of the System"

  **Applicant:** [Your Name]
  **Duration:** Six Months

  **1. The Question**
  This project asks a precise, settleable question: **Does the intuitive distinction between "bookkeeping" jumps and "oracle" jumps in formal systems map onto the logical distinction between conservative and non-conservative extensions?**

  When we solve a problem by "jumping out of the system" (JOOTS)—as when solving the MIU puzzle by counting I's modulo 3—we feel we have gained knowledge without cheating. But when we simply stipulate a solution as a new rule, we feel we have cheated. My hypothesis is that the former corresponds to a *conservative extension* (an enlarged system that proves nothing new in the original vocabulary) while the latter corresponds to a *non-conservative extension*. The project will test whether this mapping holds across a fixed set of cases, or if the intuitive notion of "bookkeeping" collapses into triviality when formalized.

  **2. Background and Motivation**
  The starting point is the MIU puzzle from *Gödel, Escher, Bach*. Starting from **MI**, can we derive **MU** using four specific rules? The answer is no. The standard proof involves stepping outside the symbol manipulation to notice that the number of **I**'s is never divisible by three. This is a "jump out of the system."

  Intuitively, we distinguish this from simply adding a fifth rule that says "MU is derivable." The first feels like *tracking* existing structure (bookkeeping); the second feels like *adding* content (oracle). My conjecture is that a jump is epistemically kosher exactly when the enlarged system (original rules + tracking machinery) is conservative over the original. A conservative extension is one where any statement provable in the new system that can be expressed in the old system was already provable in the old system.

  However, there is a wrinkle. The MIU argument is not finite bookkeeping; it requires induction over all possible derivations. Internalizing induction is precisely the kind of extension that often fails to be conservative (e.g., adding induction axioms to weak arithmetic). If validating the "bookkeeping" counter requires induction strength not present in the base system, the extension may not be conservative, yet the jump still feels like harmless tracking. This tension is the core problem.

  **3. Why Obvious Answers Fail**
  Three standard responses fail to settle this question satisfactorily:
  *   **"It's just model theory."** One might say we are simply reasoning about a model of the system. This explains *why* the proof works, but not why the *move* is epistemically distinct from adding an axiom. It ignores the procedural difference between tracking and stipulating.
  *   **"It's a new axiom in disguise."** This treats all jumps as content-additions. This fails to capture the phenomenological and methodological difference between counting existing tokens and asserting new ones. It renders the intuition of "bookkeeping" illusory.
  *   **"It's an invariant."** Saying the counter tracks an "invariant" is descriptive, not normative. It tells us what the counter does, not whether using it constitutes a valid epistemic move relative to the original system's constraints.

  We need a criterion that respects the logician's demand for rigor (conservativeness) while accounting for the scientist's intuition about tracking variables (bookkeeping).

  **4. Work Plan and Case List**
  The project will proceed over six months, focusing on four fixed cases. I will not survey the literature broadly but will focus on formalizing these specific instances to test the conjecture.

  *   **Month 1: Formalizing MIU.** I will construct the formal extension of the MIU system that includes the mod-3 counter. I will determine whether this extension is conservative over the base MIU system. The key task is to isolate whether the induction required to validate the counter exceeds the base system's strength.
  *   **Month 2: The Mutilated Chessboard.** This case (31 dominoes cannot cover a board with opposite corners removed) relies on coloring squares. This looks like pure bookkeeping. I will formalize the "colored board" system and test for conservativeness. Does adding color predicates allow us to prove new facts about domino placements that weren't provable before?
  *   **Month 3: Diagonalization and Halting.** This is the stress test. The proof that the Halting Problem is undecidable involves constructing a machine that behaves differently from all others. Is this bookkeeping (tracking inputs/outputs) or an oracle (asserting existence of a non-halting case)? I will analyze whether the diagonal argument constitutes a conservative extension of the base computational model.
  *   **Month 4: The "Fake Bookkeeping" Case.** I will construct or identify a case that looks like bookkeeping but fails the conservativeness test. A candidate is a string-rewriting system where validating a step-counter requires assuming termination. Since termination is unprovable in the base system, adding the counter acts like an oracle (a consistency statement), despite looking like mere tracking. This case is crucial to prevent the definition from becoming trivial.
  *   **Month 5: Synthesis and Checklist.** I will compare the results. If the distinction holds, I will draft a diagnostic checklist. If it collapses, I will characterize exactly where the failure occurs (e.g., "Bookkeeping is conservative only when the induction schema is bounded").
  *   **Month 6: Write-up.** Finalizing the paper and deliverables.

  **5. Deliverables**
  The primary output will be a short paper (approx. 15 pages) containing:
  1.  **A Diagnostic Checklist:** A set of conditions to apply to a candidate "jump" to determine if it qualifies as epistemically kosher bookkeeping. This will include checks for vocabulary expansion and induction strength.
  2.  **Four Worked Case Studies:** The formal analyses of MIU, Chessboard, Halting, and the "Fake Bookkeeping" case.

  **6. Failure Conditions**
  I am aware this project may yield a negative result. The project will be considered a failure only if the distinction between "bookkeeping" and "oracle" collapses entirely into the definition of conservative extension without adding explanatory power. For example, if "bookkeeping" turns out to be *defined* as "conservative extension," the hypothesis becomes tautological. Success requires either validating the mapping or precisely characterizing why the intuitive notion diverges from the logical one (e.g., "Bookkeeping allows non-conservative extensions provided the new theorems are irrelevant to the base vocabulary"). Even a negative result clarifies the limits of using conservativeness as an epistemic criterion.

  **7. Scope Note**
  While my background is in physical science, I will not include scientific thought experiments (e.g., Galileo, Einstein) in this project. Including them would require bridging formal logic with empirical modeling, which risks scope creep beyond the six-month limit. This project remains strictly within the domain of formal systems to ensure a determinate answer.
