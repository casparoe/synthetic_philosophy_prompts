answer: |-
  To rehabilitate memetics from a loose metaphor into a rigorous explanatory program for digital culture, the theory must move beyond asserting that "ideas spread like viruses" and instead specify the mechanics of algorithmic evolution. The core challenge is that algorithms do not merely transmit culture; they constitute the environment, the selector, and often the mutator.

  Below are the top three conceptual questions that must be resolved to establish memetics as a tractable research program in this context. They are ranked by **upstream dependency** (resolving A is a precondition for B), **tractability** (potential for formalization), and **downstream impact** (implications for social science and platform governance).

  ### 1. The Ontological Boundary Question: Is the Replicator the Content or the Content-Algorithm Assemblage?

  **The Problem:** Traditional memetics posits the meme (the cultural unit) as the replicator. However, in platform environments, content does not replicate independently; it replicates *through* specific distribution vectors (feeds, recommendation graphs, ad auctions). A video on TikTok replicates differently than the same video on YouTube due to the algorithmic environment. If the algorithm determines the probability of replication, is the "unit of selection" the cultural artifact alone, or is it the *assemblage* of artifact plus distribution logic?

  **Priority Defense:**
  *   **Upstream Dependency:** This is the primary bottleneck. If the unit of selection is the assemblage, then "cultural evolution" is partially a story of software architecture evolution. If the unit is the content, algorithms are merely environmental filters. You cannot define fitness functions (Question 2) or track lineages (Question 3) until you define *what* is surviving.
  *   **Downstream Impact:** Resolving this determines the scope of the field. If the assemblage is the unit, memetics merges with science and technology studies (STS) and code studies. If the content is the unit, it remains a branch of cultural psychology/epidemiology.
  *   **Tractability:** High potential for formal modeling. We can treat the algorithm as a parameter in the replication equation ($r$) to see if it varies significantly enough across platforms to constitute a different ontological class.

  **Required Progress:**
  *   **Conceptual Clarification:** Move from a substance ontology (what the meme *is*) to a relational ontology (how the meme *persists*). Define the "Digital Replicator" not as a file, but as a state within a networked system.
  *   **Formal Modeling:** Develop comparative models where the replication rate $R$ is decomposed into $R_{human}$ (cognitive resonance) and $R_{algo}$ (distributional boost). If $R_{algo}$ dominates variance in propagation, the unit must be redefined.

  ### 2. The Fitness Decoupling Question: Does Engagement Maximize Cultural Fitness or Systemic Retention?

  **The Problem:** In biological evolution, fitness correlates with reproductive success. In traditional memetics, it correlates with cognitive retention and transmission. In algorithmic memetics, selection pressure optimizes for *engagement* (time on site, clicks, reaction). These are not identical. An algorithm might select for content that triggers outrage (high engagement) but is not mimicked by users (low cultural retention), or vice versa. This creates a potential decoupling between "platform fitness" and "cultural fitness."

  **Priority Defense:**
  *   **Upstream Dependency:** This depends on Question 1. Once we know what is replicating, we must know *why* it is replicating.
  *   **Downstream Impact:** This is crucial for cultural epidemiology. If algorithmic selection pressures diverge from human cognitive selection pressures, we should expect the emergence of "maladaptive" cultural traits (memes that spread but harm the host population's coherence). This validates memetics as a critical tool for analyzing polarization and misinformation.
  *   **Tractability:** High empirical tractability. Platforms generate massive datasets on engagement vs. sharing.

  **Required Progress:**
  *   **Empirical Constraint:** We need longitudinal studies correlating engagement metrics (likes, watch time) with actual replication metrics (remixes, cross-platform sharing, offline conversation).
  *   **Formal Modeling:** Construct a dual-fitness landscape model. Map the divergence between the "Engagement Peak" and the "Replication Peak." If the peaks are consistently misaligned, the theory must account for "parasitic" memes that exploit the algorithm without achieving genuine cultural transmission.

  ### 3. The Fidelity Threshold Question: At What Point Does Algorithmic Mutation Break Evolutionary Lineage?

  **The Problem:** Darwinian evolution requires heredity with variation. Algorithms actively mutate content: auto-cropping, compressing, adding overlay UI, or stitching clips (e.g., TikTok Duets). If the mutation rate is too high, lineage tracking becomes impossible, and the process ceases to be evolutionary and becomes merely chaotic. Conversely, if digital replication is perfect (copy-paste), there is no variation for selection to act upon. We need to identify the "error threshold" where algorithmic mediation sustains evolution rather than destroying it.

  **Priority Defense:**
  *   **Upstream Dependency:** This relies on defining the unit (Q1) and the selection pressure (Q2). It is the final test of whether the "Darwinian" label applies at all.
  *   **Downstream Impact:** This determines the predictive power of the theory. If lineage cannot be tracked through algorithmic mutation, memetics cannot explain long-term cultural change, only short-term viral spikes.
  *   **Tractability:** Moderate. Requires advanced computer vision and NLP to track semantic invariance despite perceptual mutation.

  **Required Progress:**
  *   **Formal Modeling:** Adapt quasispecies theory (from virology) to digital content. Define the maximum mutation rate ($\mu_{max}$) allowed before the "master sequence" (the core meme) is lost in the noise of algorithmic compression and remixing.
  *   **Conceptual Clarification:** Distinguish between *perceptual mutation* (changing the look) and *semantic mutation* (changing the meaning). Algorithms often do the former; humans do the latter. A rehabilitated memetics must explain how semantic fidelity is maintained despite perceptual instability.

  ---

  ### Deprioritized Research Lines

  To maintain focus on the rehabilitation of memetics as an explanatory program, the following lines of inquiry should be deprioritized. Resolving them would not alter the mechanical validity of the framework.

  **1. The Intentionality of Algorithms:**
  *   *Question:* Do algorithms have "intent" or "agency" comparable to humans?
  *   *Reason for Deprioritization:* This is a philosophical cul-de-sac. Functional evolutionary theory does not require conscious intent, only differential reproduction. Whether the selection pressure comes from a human editor or a gradient descent optimization function is irrelevant to the *math* of the selection. Focusing on algorithmic "agency" distracts from modeling the *effects* of the selection pressure.

  **2. The Moral Valence of Memes:**
  *   *Question:* Are viral memes "good" or "bad" for society?
  *   *Reason for Deprioritization:* While normatively important, this is downstream of the explanatory work. We cannot assess the normative impact of algorithmic culture until we have a descriptive model of how it evolves. Prematurely importing normative judgments obscures the mechanistic analysis of fidelity and selection.

  **3. Historical Fidelity to Dawkins' Original Definition:**
  *   *Question:* Does this new framework still count as what Dawkins intended in 1976?
  *   *Reason for Deprioritization:* This is a genealogical purity test, not a scientific one. If the conceptual framework of replication, variation, and selection explains digital culture better than competing sociological models, the theory is successful regardless of its historical lineage. Insisting on 1970s definitions prevents the theory from adapting to the computational reality of the 2020s.

  ### Summary of Agenda

  The rehabilitation of memetics depends on shifting from a **psychological model** (how humans remember ideas) to a **cybernetic model** (how systems process information).
  1.  **Define the Unit:** Is it the file or the feed? (Ontology)
  2.  **Map the Fitness:** Does engagement equal transmission? (Mechanics)
  3.  **Test the Fidelity:** Can lineage survive compression? (Validity)

  Success in these three areas transforms memetics from a metaphor about "viral ideas" into a rigorous science of **algorithmic cultural dynamics**, capable of predicting how information ecosystems evolve under non-human selection pressures.
