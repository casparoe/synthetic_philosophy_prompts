  9.  **Final Polish:** Ensure the distinction between "All Money" (Strong NU) and "Priority" (Prioritarianism/Institutional) is sharp. Make sure the Popper context (Critical Rationalism/Political Philosophy) is highlighted, as the friend is misusing a political philosopher as a pure ethicist.

