answer: |-
  There is no single, canonical term in philosophy, logic, or systems theory that precisely captures this specific configuration. While the phenomenon you describe intersects with several well-established concepts, the specific combination of **apparent openness**, **base-level camouflage**, and **selective self-immunization** distinguishes it from standard definitions of hierarchical paradoxes.

  In the literature, this pattern is usually treated as a pathology (a bug, a contradiction, or a deception) rather than a named structural feature. However, we can map it against existing frameworks to isolate what is unique about your observation and propose a precise terminology.

  ### 1. Adjacent Concepts and Why They Fall Short

  To understand why this lacks a standard name, it helps to see where existing terms fail to capture the *camouflage* element you identified.

  *   **The Paradox of Self-Amendment (Peter Suber):** Legal philosopher Peter Suber has extensively cataloged cases where legal systems attempt to amend their own amendment rules. However, Suber typically analyzes *explicit* entrenchment clauses (e.g., "Article V cannot be amended"). Your example involves a *procedural bylaw* disguised as ordinary administration. This is not explicit entrenchment; it is **latent entrenchment**.
  *   **Kelsen's *Grundnorm* (Basic Norm):** Hans Kelsen argued that every legal system rests on a presupposed basic norm that validates the constitution. However, the *Grundnorm* is a transcendental logical presupposition, not a hidden rule embedded in the substrate of object-level laws. Your pattern is immanent (inside the system), not transcendental.
  *   **Tarski's Hierarchy of Languages:** Alfred Tarski solved semantic paradoxes by strictly separating object language from meta-language. In your pattern, the separation exists *in effect* but is denied *in form*. The system claims to be a single, open hierarchy while secretly enforcing a Tarskian barrier. This is a **violation of Tarskian transparency**.
  *   **Luhmann's Operational Closure:** Niklas Luhmann described systems as "operationally closed" (self-referential) but "cognitively open." While close, Luhmann's closure is usually a recognized feature of the system's autopoiesis. In your pattern, the closure is denied; the system claims to be open while functioning as closed.
  *   **Motte-and-Bailey:** This is a rhetorical fallacy where one retreats from a controversial claim (the Bailey) to a defensible one (the Motte) when challenged. Your pattern is structural, not rhetorical. It is not about argumentation but about **jurisdictional immunity**.

  ### 2. Proposed Terminology

  Given the absence of a canonical term, I propose describing this configuration as a **"Cryptic Meta-Rule"** embedded within a **"Self-Immunizing Substrate."**

  If a single noun phrase is required for the structural pattern itself, the most precise neologism would be:

  > **Cryptic Stratification**

  **Definition:** A hierarchical system that formally declares itself as a flat or open chain of command but functionally operates as a stratified hierarchy by embedding a meta-level constraint within the object-level syntax. This constraint remains dormant until triggered by self-referential operations, at which point it enforces a boundary that the formal rules claim does not exist.

  ### 3. Boundary Conditions

  To distinguish **Cryptic Stratification** from similar concepts, the following four boundary conditions must be met:

  1.  **Formal Openness:** The explicit meta-rules must claim universal jurisdiction (e.g., "The Legislature may amend any law"). There is no explicit "eternity clause" or acknowledged limit.
  2.  **Substrate Embedding:** The limiting mechanism must reside in the *object level* (e.g., a procedural bylaw, a syntax definition, an administrative code), not in the meta-level constitution or axiom set.
  3.  **Conditional Activation:** The rule must function as an ordinary object-level rule in 99% of contexts. It only reveals its meta-level authority when a self-referential loop is attempted (e.g., an attempt to amend the amendment process).
  4.  **Illusion Preservation:** The activation of the rule must not collapse the system or admit the paradox. Instead, it must silently redirect or nullify the self-referential move while maintaining the appearance that the system remains consistent and open.

  ### 4. Differentiation from Specific Comparisons

  Here is how **Cryptic Stratification** differs from the specific comparisons you raised:

  | Concept | Key Difference |
  | :--- | :--- |
  | **Gödelian Self-Reference** | Gödel's Incompleteness Theorems demonstrate that a system *cannot* prove its own consistency. Your pattern describes a system that *engineers* a way to prevent the attempt from succeeding. Gödel reveals a limit; Cryptic Stratification *hides* the limit to preserve authority. |
  | **Explicit Entrenchment** | An eternity clause (e.g., German Basic Law Art. 79) is a visible "Do Not Enter" sign. Cryptic Stratification is a "Road Closed" sign hidden in the pavement that only rises when a specific vehicle approaches. |
  | **Hidden Axiom** | A hidden axiom is a foundational assumption that is always true. Your pattern is a *rule* that is conditionally true. It behaves like a variable in the object language until it acts as a constant in the meta-language. |
  | **Tangled Hierarchy (Hofstadter)** | In Escher's *Drawing Hands*, the loop is visible and aesthetic. In Cryptic Stratification, the loop is suppressed. The system pretends it is not tangled to avoid the instability that Hofstadter celebrates. |
  | **Motte-and-Bailey** | Motte-and-Bailey is a dialectical retreat used by *agents* within a system. Cryptic Stratification is a feature of the *system itself*, independent of the agents' intent. |

  ### 5. Theoretical Implications

  In political philosophy, this structure is often the mechanism behind what scholars call **"Constitutional Hardball"** or **"Procedural Sovereignty."** It allows a regime to maintain the *legitimacy* of democracy (openness to amendment) while securing the *stability* of autocracy (immunity from fundamental change).

  In logic and computer science, this resembles a **"Privilege Escalation Block"** implemented in user space. Normally, security kernels (meta-level) prevent user programs (object-level) from modifying the kernel. In your pattern, the user program contains a hidden instruction that hijacks the kernel's authority if the kernel tries to inspect the user program.

  ### Summary

  You have identified a structural mechanism of **institutional self-preservation** that relies on **syntactic camouflage**. While philosophy and systems theory have named the *paradoxes* that result from self-reference (e.g., Russell's Paradox, the Liar Paradox), they have not standardly named the *engineering solution* that systems use to suppress those paradoxes while denying their existence.

  **Cryptic Stratification** is the precise term for this: a hierarchy that denies its own ceiling by hiding the ladder's top rung inside the floor.
