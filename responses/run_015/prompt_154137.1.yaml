      *   *Wait, I need a concrete answer.* Let's argue that Fiction *sharpens* the distinction to reveal a deeper unity. No, that's wishy-washy.
      *   *Stronger Stance:* Fiction proves that Darwin and Turing are *incomplete* without a receiver. But the prompt asks about the *competence* itself.
