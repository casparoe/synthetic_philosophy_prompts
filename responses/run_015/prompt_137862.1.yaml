answer: |-
  This is a high-risk, high-reward design. It relies on physical constraints to force philosophical intuitions rather than arguing them. Below is the complete run-sheet.

  ### **Session Title:** The Colony Protocol
  **Time:** 80 Minutes
  **Students:** 16 (Split into two groups of 8 for the Turnover beat)
  **Room:** Seminar table pushed to walls. Open floor.
  **Materials:**
  *   200 Poker Chips (one color, e.g., white).
  *   2 Baskets (Nest, Food Source).
  *   16 Index Cards (Rule Cards).
  *   1 Roll of Masking Tape (to mark Nest/Feeder zones).
  *   Candy (for individual payoff).
  *   Scoreboard (Whiteboard).
  *   4 Chairs (for Fission barrier).

  ---

  ### **1. The Payoff Scheme (Divergent Rationality)**
  To satisfy the constraint that individual and colony rationality must come apart:
  *   **Colony Score:** Written on the board. +10 points for every "Food Unit" (a distinct object, e.g., a red ball or distinct token) placed in the **Nest** basket.
  *   **Individual Score:** Private. Each student gets **1 piece of candy** for every **Poker Chip** they personally drop on the floor during the simulation.
  *   **The Conflict:** In the "Misrepresentation" phase, the food is removed. If ants follow the old trail, they drop chips (earning candy) but deliver no food (Colony score stagnates). This creates a "selfish gene" tension: the colony starves while the individuals feast on the illusion.

  ---

  ### **2. Rule Cards (Print 16 copies)**
  *Do not title these. Do not mention "ants" or "colony."*

  > **PROTOCOL 44-B**
  > 1. **Start:** Stand in the **NEST** zone.
  > 2. **Outbound:** Walk toward the **FOOD** zone.
  >    *   If you see a **CHIP** on the floor: Walk directly to it, pick it up, take 3 steps past it, drop it. Repeat.
  >    *   If you see **NO CHIPS**: Walk in any direction.
  > 3. **Acquisition:** If you reach the **FOOD** zone and there is a **FOOD UNIT** there: Pick it up.
  > 4. **Inbound:** Walk directly to the **NEST** zone.
  >    *   Drop the **FOOD UNIT** in the Nest basket.
  >    *   Take 3 **CHIPS** from the Nest supply.
  >    *   Walk back toward the FOOD zone.
  >    *   **Drop 1 CHIP every 3 steps.**
  > 5. **Constraint:** Do not speak. Do not look at the Instructor. Do not deviate from the Protocol.

  ---

  ### **3. Minute-by-Minute Timeline**

  #### **Phase 0: Setup & Grouping (0:00 – 0:10)**
  *   **Room:** Tape two zones on the floor. **NEST** (Start). **FOOD** (14 steps away).
  *   **Class:** Split into **Group A (8 students)** and **Group B (8 students)**. Group B sits on the periphery as "Observers" (they take notes but cannot speak).
  *   **Instruction:** "You are agents executing a protocol. Your goal is to maximize your personal payoff. The Board tracks the System Score. Go."
  *   **Handout:** Give Group A the Rule Cards. Give Group B nothing.
  *   **Crucial:** Do not explain *why* there are chips. Do not explain the two feeder distances yet (see Phase 1 adjustment).

  #### **Phase 1: Convergence (0:10 – 0:25)**
  *   **Setup:** Place Food Units in the **FOOD** zone. Place a pre-laid "noisy" trail of chips leading to a **Long Path** (14 steps) and a **Short Path** (6 steps) to a second, hidden feeder?
  *   *Correction for flow:* To ensure convergence happens within 15 mins with only 8 ants, pre-lay a faint trail to the **Short Path**.
  *   **Action:** Group A runs the protocol. They will reinforce the short path because the round-trip time is faster, allowing them to drop more chips per minute (maximizing individual candy).
  *   **Observation:** Group B watches the trail thicken on the short path.
  *   **Stop:** Blow a whistle at 0:25. Freeze everyone.

  #### **Phase 2: Turnover & Misrepresentation (0:25 – 0:40)**
  *   **Turnover:** Group A sits down. They leave their Rule Cards on the floor. Group B stands up. They pick up the Rule Cards. **They do not speak to Group A.**
  *   **The Trap:** While they swap, **remove all Food Units from the Food Zone.** Leave the chips on the floor.
  *   **Action:** Group B runs the protocol. They follow the chips left by Group A. They drop new chips (earning candy). They find no food. The Colony Score stays flat.
  *   **The Point:** The "behavior" persists (trail following), but the "function" (food retrieval) is broken. The "belief" (food is here) is false, but the mechanism is identical to Phase 1.
  *   **Stop:** Whistle at 0:40.

  #### **Phase 3: Fission & Addressability (0:40 – 0:50)**
  *   **Fission:** Place 4 chairs in a line down the middle of the room, physically separating the Short Path trail into two segments.
  *   **Action:** Group B continues. The trail is broken. They must wander to reconnect it.
  *   **Addressability:** At 0:45, stop the action. **Stand in the center of the room.** Say loudly: *"The Food has been moved to the North Wall. Go there."*
  *   **Resume:** Tell them to resume Protocol 44-B.
  *   **Result:** They will ignore you. The Protocol does not have a rule for "Listen to Instructor." They will return to the chips.
  *   **Stop:** Whistle at 0:50. End Simulation.

  #### **Phase 4: Debrief (0:50 – 1:15)**
  *   **Seating:** Everyone sits. Board is visible.
  *   **Mapping:**
      1.  **Convergence (Phase 1):** "Did anyone decide to take the short path?" (No). "Did the system optimize?" (Yes). *CS majors:* "It's gradient descent." *Phil majors:* "It's functional optimization."
      2.  **Turnover (Phase 2):** "Did the 'knowledge' of the path survive the swap?" (Yes, in the chips). "Where was the memory?" (Environment + Rules).
      3.  **Misrepresentation (Phase 2):** "Group B believed food was there. Was that a False Belief or Stale Data?" (The core question). "Group B got candy while the Colony starved. Who was rational?"
      4.  **Addressability (Phase 3):** "I spoke to the room. Why didn't 'Aunt Hillary' hear me?" (No input channel at that level).
      5.  **Publicity:** "Could you hide your chip-dropping?" (No). "Does the colony have secrets?"
  *   **Reveal:** Introduce Dennett, Hofstadter, "Aunt Hillary," Functionalism, Intentional Stance.

  #### **Phase 5: Wrap (1:15 – 1:20)**
  *   **Prompt:** "For next week: If we added a rule that said 'If Instructor Speaks, Stop,' would that make the colony a person? Or just a better machine?"

  ---

  ### **4. Troubleshooting: Predictable Failures**

  | Failure Mode | Why it happens | Intervention |
  | :--- | :--- | :--- |
  | **CS Short-Circuit** | Students realize the optimal path immediately and meta-game ("Let's all just run the short way"). | **Strict Enforcement:** If you see them coordinating verbally or pointing, freeze them. Deduct 5 Colony Points. Remind them: "You are executing local code, not designing it." |
  | **No Convergence** | 8 ants is too few; the trail doesn't reinforce fast enough. | **Pre-seeding:** Lay 10-15 chips on the short path before they start. The positive feedback loop needs a kickstart. |
  | **Boredom / Drift** | Walking back and forth is tedious. | **Keep Phases Short:** 15 minutes is the max attention span for physical iteration. Use the whistle sharply. |
  | **Addressability Leak** | A student hears you yell "Food Moved" and walks to the wall, breaking the sim. | **The "Glitch" Frame:** If a student obeys you, declare them "Corrupted." They must sit out. This reinforces the point: The *system* cannot hear you, only the *parts* can, and the parts are programmed to ignore you. |
  | **Fission Chaos** | The barrier splits the trail, and they just mill about confused. | **Accept the Chaos:** This is the point. If the trail is cut, the "mind" loses coherence. Let them struggle to reconnect. It demonstrates the fragility of the substrate. |
  | **Naming Prematurely** | A Phil major shouts "This is Aunt Hillary!" in minute 12. | **The "Black Box" Rule:** Establish at the start: "Naming the system before the end violates the Protocol. Violators lose Individual Payoff." |

  ---

  ### **5. Limitations: What This Simulation Cannot Do**
  *Be prepared to admit these openly in the debrief.*

  1.  **Qualia:** The simulation cannot show what it *feels like* to be an ant. The CS majors will be right: there is no "inner light" here, only input/output. You must concede that the sim supports *Functionalism*, not *Phenomenology*.
  2.  **Evolutionary Time:** Real ant trails are selected over generations. This sim is instantaneous. The "design" comes from your Rule Card, not natural selection. This weakens the "mind" claim (it's your mind in their rules, not theirs).
  3.  **The Homunculus:** The students are humans pretending to be dumb agents. They *know* they are in a seminar. You cannot fully eliminate their meta-cognition.
  4.  **The "Yes" Bias:** Even with the divergent payoff, the emergence of the path feels "clever." You must actively champion the Skeptic's view in the debrief: "If I can explain it all with chips and steps, why do we need the word 'Belief' at all?"

  ### **6. The Takeaway (For the Students)**
  By the end, they should be able to articulate:
  *   **The Functionalist Intuition:** The colony behaves *as if* it has beliefs (it seeks food, it persists through turnover).
  *   **The Skeptic's Anchor:** The mechanism is fully transparent, mechanical, and lacks privacy or genuine understanding (the Misrepresentation phase).
  *   **The Lingering Question:** Is the difference between "stale pheromone" and "false belief" just a matter of how complex the system is, or is it a fundamental category error?

  This design forces the CS majors to confront the *utility* of the intentional stance (it predicts the path better than tracking individuals) and forces the Phil majors to confront the *mechanical reality* of the stance (it's just chips and rules). Neither can coast.
