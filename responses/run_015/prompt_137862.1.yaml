      *   *Correction:* The prompt says "swap out... for people who know nothing." This implies the *rules* stay on the floor? No, rules are on index cards held by ants.
      *   *Interpretation:* The "Turnover" beat is about whether the *pattern* survives the *substrate*. So, Group A runs. Stop. Group A sits. Group B stands up. Group B gets the *same* rule cards. Does the trail persist? Yes, because the chips are on the floor. The "belief" (trail) is in the environment, not the heads. This is crucial.

  8.  **Refining the Payoff (Individual vs. Colony):**
      *   Colony Score: Food units in Nest.
      *   Individual Score: Candies given for every Chip dropped.
      *   *Conflict:* If I drop chips everywhere (even useless loops), I get candy. The colony gets confused. This allows the CS majors to say "See? Rational agents break the system." It prevents the "glorious emergence" bias.

  9.  **Troubleshooting:**
      *   *CS Short-circuit:* They will try to optimize globally. *Fix:* Enforce local rules strictly. Penalty for talking/meta-planning.
      *   *Boredom:* Keep phases short.
      *   *No Convergence:* 16 ants might be too few. *Fix:* Make the "wander" rule biased or start with a pre-laid trail. Or, ensure the "drop chip" rate is high.
      *   *Naming:* Don't say "Aunt Hillary" until the end.

  10. **Debrief Mapping:**
      *   Convergence -> Functionalism/Intentional Stance.
      *   Turnover -> Substrate Independence.
      *   Misrepresentation -> False Belief vs. Causal Link.
      *   Addressability -> Levels of Description.
      *   Publicity -> Privacy of Mind.

  11. **Final Review against Constraints:**
      *   *No lecture up front:* Check.
      *   *Simulation not discussion:* Check.
      *   *Skeptic purchase:* The Individual Payoff (chips = candy) creates a "selfish gene" problem that undermines the colony mind.
      *   *Divergent Payoff:* Check (Candy vs. Food Units).
      *   *Limitations:* Acknowledge that humans simulate ants poorly (we have meta-cognition).

  12. **Writing the Plan:** (Self-Correction during drafting)
      *   Make sure the "Fission" is physically possible. A barrier of chairs.
      *   Make sure the "Addressability" moment is dramatic. Instructor yells, nothing happens.
      *   Ensure the "Turnover" is clear. Group A -> Group B swap, same cards, existing chips.
      *   *Critical:* The prompt asks for "people who know nothing." If I give them the rule cards, they know the rules. If I *don't* give them rule cards, they stop.
      *   *Re-reading prompt:* "swap out a big chunk of the ants for people who know nothing, keep the trail going."
      *   *Interpretation:* The *trail* (chips) is the memory. The new ants need *some* instruction to interact with the trail. If they know *nothing*, they won't pick up chips.
      *   *Solution:* The new ants get the *same* rule cards. They know nothing about the *history* or the *goal*, but they know how to be ants. The "mind" is in the system (chips + rules), not the specific humans.
      *   *Wait, stronger interpretation:* Maybe the new ants get *no* cards and just have to infer? No, that breaks the sim.
      *   *Best interpretation:* The "people who know nothing" refers to the *colony's state*. They don't know the food moved, they don't know the history. They just inherit the local rules. The "mind" persists if the behavior persists despite the substrate change.
      *   *Actually, let's look at the "Turnover" beat again:* "Did the 'desire' survive its carriers?" This implies the *carriers* change. If I swap Group A for Group B, and Group B follows the chips left by Group A, the "path preference" survived. That works.

      *   *Wait, one more constraint:* "Make the two [payoffs] come apart at least once."
      *   *Implementation:* In the Misrepresentation phase, the food is gone. If ants keep following the trail, they drop chips (getting individual candy) but bring no food (colony starves). This perfectly illustrates the divergence.

      *   *Limitations:* Humans aren't ants. We cheat. We need strict enforcement.
      *   *Naming:* "Aunt Hillary" only in debrief.

      *   *Let's finalize the Rules:*
          *   Keep it extremely simple.
          *   Rule: "If leaving Nest: Follow Chips. If no Chips: Wander. If find Food: Carry to Nest."
          *   Rule: "If leaving Nest with Chips: Drop 1 Chip every 3 steps."
