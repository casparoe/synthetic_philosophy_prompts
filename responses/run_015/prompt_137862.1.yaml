          *   State C (Following): If see Chip, move toward higher density.
      *   *Simplification for Humans:*
          *   Card 1 (Forager): Walk randomly. If you hit Food, take it. Walk to Nest.
          *   Card 2 (Carrier): Walk to Nest. Drop Food. Take 3 Chips. Walk back to Food. Drop 1 Chip every 2 steps.
          *   Card 3 (Follower): If you see a Chip on the floor, pick it up and walk in the direction it was pointing (or just follow the line).
      *   *Actually, let's make everyone identical to emphasize interchangeability.*
      *   *Universal Rule:* 1. Leave Nest. 2. If you see a Chip, follow the line of Chips. 3. If you find Food, carry it to Nest. 4. When returning to Food source, drop a Chip every 3 steps. 5. If no Chips, wander.
