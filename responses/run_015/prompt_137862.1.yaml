      *   **Key Beats:** Local rules -> Global convergence, Mid-run turnover (persistence of mind), Fission (identity), Misrepresentation (false belief vs. stale data), Addressability (can't talk to the colony), Publicity (no private states).
      *   **Design Constraints:** Don't stack the deck (skepticism must have purchase), Divergent payoffs (individual vs. colony rationality).
