      *   *The Rules:* Must be local. "If you see X, do Y." No global knowledge.
      *   *The Payoff:* This is tricky. "Colony gets points" is abstract. "Individuals get points" is concrete. To create tension, the individual reward should sometimes conflict with the colony efficiency, or at least feel disconnected.
      *   *The "Mind" Question:* The simulation needs to make them *feel* the emergence, but also *feel* the emptiness.

  3.  **Drafting the Mechanics (Iterative Process):**
      *   *Attempt 1:* Students walk back and forth dropping chips.
      *   *Problem:* 16 students is too few for a smooth flow if they all just walk. They might get bored.
      *   *Fix:* Make it competitive/cooperative. They need a reason to move.
      *   *Payoff:* Individual: Get a ticket for every round trip. Colony: Get a ticket for every food unit brought back.
      *   *Tension:* If the short path is blocked or if the "pheromones" lead to the long path, do individuals follow the trail (colony good) or blaze new trails (individual risk/reward)?
      *   *Refinement:* Let's stick to the prompt's request: "make the two come apart at least once."
      *   *Idea:* Individual reward is for *speed* (round trips). Colony reward is for *efficiency* (food per total energy). Actually, simpler: Individual gets a point for depositing a chip. Colony gets a point for retrieving food. If the trail is wrong, individuals keep depositing chips (getting points) while the colony starves. This creates the "stale pheromone/false belief" tension perfectly.

  4.  **Developing the Beats:**
      *   *Convergence:* Standard ant algorithm. Drop chip going out, pick up chip coming back? Or just drop chips to mark path. Let's use the standard: Drop chip when leaving nest with food? No, ants drop pheromone when returning with food.
      *   *Simplified Rule:* 1. Leave Nest. 2. Find Food. 3. Pick up Food. 4. Return to Nest. 5. Drop Food. 6. On return trip, drop a chip every 2 steps. 7. On outbound trip, follow chips if present.
      *   *Turnover:* Stop halfway. Swap 8 students with 8 new ones (or just have them stand up and swap roles with observers? Wait, only 16 students total).
      *   *Correction:* The prompt says "16 students." I can't swap in outsiders. I have to swap roles *within* the room or have half the class observe first.
      *   *Better:* Split class. 8 Ants, 8 Observers. Halfway through, swap. This hits the "turnover" beat. The Observers know nothing about the rules.
      *   *Fission:* Put a barrier (chairs) down the middle. Split the chips. Do two colonies emerge?
      *   *Misrepresentation:* Move the food. The chips still lead to the old spot.
      *   *Addressability:* Instructor yells "Food moved!" Ants ignore it because their rules don't include "listen to instructor."

  5.  **Addressing the "Don't Stack the Deck" Constraint:**
      *   To let the skeptics win, the simulation must feel *mechanical* and *dumb*. The "ants" should feel like zombies. The "colony" should seem like a accidental byproduct, not a glorious agent.
      *   The "Individual vs. Colony" payoff is key here. If individuals can game the system (e.g., dropping chips in place without walking), the "colony mind" looks like a fragile illusion easily broken by selfish parts. This validates the CS "it's just code" view.

  6.  **Timeline Construction (80 mins):**
      *   0-10: Setup/Grouping.
      *   10-30: Phase 1 (Convergence).
      *   30-40: Phase 2 (Turnover & Misrepresentation).
      *   40-50: Phase 3 (Fission & Addressability).
      *   50-75: Debrief.
      *   75-80: Wrap.

