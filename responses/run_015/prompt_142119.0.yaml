  # Seminar Plan: The Logic of Co-movement

  ## Materials and Prep
  *   **Slips:** 24 small slips of paper per round (96 total), pre-printed with "Cooperate" / "Defect" checkboxes or blank for writing.
  *   **Partner Cards:** 12 pairs of cards labeled A–L (24 cards total) in a bag for Round 1 pairing.
  *   **Envelopes:** 12 sealed envelopes for Round 3. **Crucial Adjustment:** To make the math exact ($p=2/5$), use **4 "Mirror" envelopes** and **6 "Open" envelopes** (10 pairs total). Have 4 students act as "Auditors" (they observe and tally but do not play) to maintain the 2/5 ratio cleanly. If you must play all 24, use 5 Mirror / 7 Open ($p=5/12$) and adjust the board math to $q=3/7$, but the plan below assumes the exact $p=2/5$ for clarity.
  *   **Payoff Board:** Draw the matrix on the blackboard beforehand: CC=3/3, DD=1/1, CD=0/5, DC=5/0.
  *   **Die:** One large visible die for Round 4.
  *   **Tickets:** Raffle tickets for payouts (e.g., 1 ticket = 1 point).
  *   **Coda Cards:** 8 cards marked "T=7" (Temptation payoff is 7 instead of 5) for the final 6 minutes.

  ## Minute-by-Minute Timeline (75 Minutes)
  *   **00–05:** Intro & Round 1 Setup. Distribute Partner Cards.
  *   **05–10:** Round 1 Choice & Collection.
  *   **10–15:** Round 1 Tally & Payoff Display.
  *   **15–20:** Round 2 Setup & Script.
  *   **20–25:** Round 2 Choice, Collection, & Tally.
  *   **25–35:** Round 3 Setup (Envelopes), Choice, & Collection.
  *   **35–40:** Round 3 Tally (Open pairs vs. All pairs).
  *   **40–45:** Round 4 Setup (Public Die), Choice, & Tally.
  *   **45–70:** Debrief (Argument mapping, math, naming).
  *   **70–75:** Coda (Asymmetric Payoffs) & Wrap.

  ## Round Scripts (Max 2 Sentences Each)
  *   **Round 1 (Anonymous):** "Choose cooperate or defect; your partner is the other student holding your letter. You will not know their identity until payoffs are calculated."
  *   **Round 2 (Mirror):** "Your partner is now a copy of your own choice; your single slip determines both cells in your payoff matrix. Choose knowing that your partner's move is identical to yours by fiat."
  *   **Round 3 (Mixed):** "You face a 2/5 probability of playing your copy and 3/5 probability of playing an open partner; sealed envelopes determine your type after you choose. Choose now without opening your envelope."
  *   **Round 4 (Public Die):** "Pairs are open again, but you may condition your choice on the outcome of this public die roll. Roll now, then choose based on the visible number."

  ## Tallying & Display
  *   **After Each Round:** Collect slips. Sort into four piles: CC, CD, DC, DD. Count them visibly on the board.
  *   **Round 3 Specific Tally (2 Minutes):**
      1.  Open envelopes to sort slips into "Mirror" and "Open" piles.
      2.  **For the Debrief Math:** Tally **All Pairs** together to find the effective $\alpha$ and $\beta$ the students faced.
      3.  **For the User's Request:** Tally **Open Pairs Only** separately.
      4.  **Calculation:** $\alpha = \frac{CC}{CC + CD}$, $\beta = \frac{DC}{DC + DD}$, $g = \alpha - \beta$.
      5.  **Display:** Write $\alpha$, $\beta$, and $g$ on the board immediately.
  *   **Interpreting the Open-Only Tally:**
      *   **Near Zero:** "This confirms Open pairs have no structural link; your correlation came from the Mirror probability."
      *   **Negative:** "Noise dominates; rational choice relies on expected structure, not realized luck."
      *   **Larger than 2/5:** "Signaling occurred despite the ban; the structural gap was amplified by behavior."

  ## Debrief: Mapping Moments to Argument
  1.  **Round 1 (The Baseline):** Show that with $g \approx 0$, Defect dominates ($0 > (\beta+1)/3$ is false). This establishes standard Causal Decision Theory (CDT) intuition.
  2.  **Round 2 (The Fiat Link):** Show that with $g = 1$, Cooperate dominates ($1 > 1/3$). **Crucial Point:** Note that here, CDT, EDT, and FDT all agree because the facilitator *caused* the correlation physically. This round does not discriminate between theories.
  3.  **Round 3 (The Load-Bearing Premise):** Reveal the math.
      *   Write: $EU(C) = 3\alpha$, $EU(D) = 4\beta + 1$.
      *   Derive: **Cooperate iff $g > (\beta + 1) / 3$**.
      *   Explain: In Round 3, $g$ comes from the envelope probability $p$. If $p=2/5$, the symmetric fixed point is **cooperate with probability 1/3**.
      *   Show: If everyone cooperates 1/3 of the time, you are indifferent. If you expect less, you Cooperate; if more, you Defect.
  4.  **Round 4 (The Correlation Device):** Show that the public die allows students to create $g=1$ without envelopes. If everyone adopts "Cooperate on Even", $\alpha=1, \beta=0$. This flips the answer to **unqualified Cooperation** via coordination.
  5.  **Naming the Theory:** Now introduce the label **"Superrationality"** (Hofstadter) or **Evidential/Functional Decision Theory**. Explain that the argument claims rational agents should expect $g > 0$ against similar agents *without* envelopes, purely due to logical correlation.
  6.  **Limitations:** Be frank: "The envelopes *forced* correlation. Superrationality claims reasoning *creates* it. This game proves the math of correlation, not the metaphysics of logical connection."

  ## Five Predictable Failures & Handling
  1.  **Niceness/Altruism:** Students Cooperate in Round 1 to help partners win tickets.
      *   *Handling:* Pre-empt this: "Maximize your own ticket count; altruism invalidates the decision theory test."
  2.  **Mirror Skepticism:** Students believe Round 2 is a trick and defect anyway.
      *   *Handling:* Show the mechanism explicitly (one slip copied to two cells) before choice.
  3.  **Signaling:** Students glance or cough to coordinate in Round 3/4.
      *   *Handling:* Strict proctoring; spread seats apart; declare void if signaling is detected.
  4.  **Tally Arithmetic:** Calculating $\alpha, \beta$ live takes too long.
      *   *Handling:* Assign 4 "Auditor" students (the non-players) to count piles during collection.
  5.  **Confusion on $p$:** Students misunderstand the 2/5 probability in Round 3.
      *   *Handling:* Use the bag of envelopes as a visual prop; draw a tree diagram on the board during debrief.

  ## Coda: Asymmetric Payoffs (6 Minutes)
  *   **Setup:** Hand 8 students (4 pairs) cards stating "Your Temptation payoff is 7." Announce this fact but not who holds the cards.
  *   **Task:** Ask what a superrational pair with mismatched cards (one has T=7, one has T=5) should do.
  *   **Purpose:** To test if "superrationality" survives broken symmetry. Standard superrationality assumes symmetric utilities; asymmetry introduces bargaining problems (Nash Bargaining Solution vs. Pure Coordination).
  *   **Expectations:** High-T holders will feel justified Defecting; Low-T holders will feel exploited. Consensus will fracture.
  *   **Recommendation:** **Cut this if the Debrief runs long.** It complicates the core lesson ($g$) and risks confusing the clean math of the main session. Use only if time permits and the class is strong.

  ## Math Verification for the Board
  *   **Condition:** $3\alpha > 4\beta + 1 \implies 3(\beta+g) > 4\beta + 1 \implies 3g > \beta + 1 \implies \mathbf{g > (\beta + 1) / 3}$.
  *   **Round 3 Fixed Point:** With $p=2/5$, $g=p$. $\beta = q(1-p)$.
      *   $p > (q(1-p) + 1) / 3 \implies 3p - 1 > q(1-p) \implies q < (3p-1)/(1-p)$.
      *   At $p=0.4$: $q < (1.2 - 1) / 0.6 = 0.2 / 0.6 = \mathbf{1/3}$.
  *   **Dominance Threshold:** For C to pay at *every* $q$ (even $q=1$):
      *   $3p - 1 \ge 1(1-p) \implies 4p \ge 2 \implies \mathbf{p \ge 1/2}$.
  *   **Round 4:** Public die creates perfect correlation ($g=1$). $1 > (0+1)/3$. Cooperate.

  \answer{mirror round: C; anonymous round: D; cooperate iff g > (\beta + 1) / 3; p = 2/5 symmetric fixed point: cooperate with probability 1/3; cooperation pays at every base rate iff p >= 1/2; public-die round: C}
