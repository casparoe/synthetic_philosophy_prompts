prompt: |-
  I am a philosophy professor preparing an interview for a philosophy colloquium podcast. Next week's guest is an unnamed philosopher—let us call her Dr. Lena Corvin—who defends what she terms the fragmented-credence defense of indicative conditionals against Lewis's triviality results. Corvin grants that, within any single globally coherent credence function, the probability of an indicative conditional equals the corresponding conditional probability of the consequent given the antecedent. She denies, however, that rational agents ever possess such global functions. On her account, indicative conditionals operate as cross-contextual planning instructions that link distinct belief fragments; each fragment locally respects something analogous to Adams's thesis, but no legitimate global aggregation of these local values is available. She further maintains that decision-theoretic reasoning requires precisely this fragment-linking role, and that responses which preserve Adams's thesis globally by altering the belief-update rule—imaging-style revisions, for instance—misconstrue belief dynamics as single-track.

  Please draft eight to ten interview questions that engage the actual content of this position rather than asking Corvin to restate it. I require at least one question that presses whether her fragmentation model collapses into a Stalnaker-style revision semantics once the fragments are formally represented; at least one that asks how her view is conceptually or empirically distinguishable from ordinary context-sensitive belief attribution; and at least one that addresses imaging-style updates that save Adams's thesis by modifying the update rule rather than denying global coherence. For each of these three, provide a follow-up keyed specifically to her most probable reply—especially should she invoke decision-theoretic planning rather than static doxastic states. The remaining questions should probe further pressure points: for example, whether embedded conditionals can be accommodated without generating infinite regress among fragments; whether conflicting fragments yield indeterminacy in practical reasoning; and whether her account can preserve the intuition that assertibility conditions for indicative conditionals are tied to the speaker's actual evidential situation. Maintain a rigorous yet conversational tone suitable for an audience of graduate students and specialists in philosophy of language, logic, and formal epistemology. Avoid generic biographical questions, and do not request bibliographies or reading lists.
