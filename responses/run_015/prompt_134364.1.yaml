  I used to do lab physics and now in retirment I read philosphy of rational choice. In a thread about Allais paradox someone threw out 'if you mix the same thing into both options, your preference shouldn't flip' and acted like that settled whether the independant axiom holds. They used it to shut down my point that in the common-consequence version the shared 89% chance of one million feels psychologicly different from the shared 0% in the common-ratio version, so the outcomes don't just cancel out. Can you unpack the slogan? What are the distinct precise theses it could express—normative consistency, linearity in probabilities, psychological neutrality—and which ones are trivial versus actually doing work? And which version, if any, addresses my worry that salience breaks the cancellation? No bibliographies please, I can't look them up.
