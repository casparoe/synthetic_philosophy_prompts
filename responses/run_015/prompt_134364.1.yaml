      *   **The Conflict:** The user argued that the *psychological salience* of a shared consequence (89% chance of \$1M vs. 0% chance) matters, so outcomes don't "cancel out." An interlocutor shut this down with the slogan: "If you mix the same thing into both options, your preference shouldn't flip."
