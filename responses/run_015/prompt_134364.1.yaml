  2.  **Deconstruct the Slogan:**
      *   "If you mix the same thing into both options, your preference shouldn't flip."
      *   This is a colloquial statement of the Independence Axiom (or Substitution Principle).
      *   Formally: If $A \succ B$, then for any $C$ and probability $p$, $pA + (1-p)C \succ pB + (1-p)C$.
      *   The interlocutor uses this as a *normative* hammer to crush the user's *descriptive/psychological* point.

  3.  **Identify Distinct Theses:**
