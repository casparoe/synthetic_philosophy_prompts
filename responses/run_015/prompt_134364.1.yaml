      *   *Thesis 2: Linearity in Probabilities (The "Mathematical" Claim).* This is the Expected Utility (EU) representation. $U(pA + (1-p)C) = pU(A) + (1-p)U(C)$. This implies the "cancellation" the user is questioning.
      *   *Thesis 3: Psychological Neutrality (The "Descriptive" Claim).* This claims that humans *actually* process common consequences neutrally. This is empirically false (as the Allais Paradox shows).
      *   *Thesis 4: Framing/Salience Invariance.* This is the specific claim that how the common consequence is *described* or *felt* (89% vs 0%) doesn't matter, only its probabilistic weight.

