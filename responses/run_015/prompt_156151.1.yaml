answer: |-
  I must tell you plainly: the four constraints cannot all be satisfied. It is not a failure of imagination, but a structural feature of the metaphysical problem you are tackling. Constraint 3 has to give.

  Here is why. You are asking for a scenario where numerical diversity (twoness) is established without qualitative difference (indiscernibility), without primitive thisness (haecceity), without spatial asymmetry, and without relying on an irreflexive relation (like distance) to ground the count. In metaphysics, these are the only available tools for individuation. If you remove haecceity (Constraint 1) and qualitative differences (by definition of indiscernibility), you are left with relations to do the work. But Constraint 3 bans using relations to prove twoness, arguing it is circular. Constraint 2 bans using external landmarks to break the symmetry.

  Your intuition about "cumulative effects" (mass, brightness, volume) is the natural place to look, but it fails because these are properties of the *fusion*, not the *parts*. A single sphere of iron weighing 2kg is qualitatively identical in terms of total mass to two spheres of iron weighing 1kg each, provided you cannot resolve them spatially. If you say "The total mass is 2kg, therefore there are two 1kg objects," you are assuming the *unit* mass of the objects beforehand. If the universe contained one object of 2kg, the measurement would be the same. To distinguish "one 2kg object" from "two 1kg objects," you must show they are *separate*. Separation is a spatial relation. If you ban using spatial relations to establish twoness (Constraint 3), you cannot distinguish the plurality from the unity.

  Here is the analysis of why the case collapses, structured as you requested:

  **Argument that the two really are indiscernible**
  In any scenario satisfying Constraints 1, 2, and 4, the two objects share all intrinsic properties (by stipulation of indiscernibility) and all relational properties (by symmetry). Swapping them leaves the total situation unchanged because there is no landmark to mark the swap, no internal change to track, and no haecceity to differentiate. If Constraint 3 is also held, you cannot even point to the distance between them as a difference, because you have banned the inference from "distance holds" to "there are two." Thus, they are indiscernible in every available respect.

  **Account of exactly what makes the twoness undeniable**
  There is no account available under these constraints. The "undeniable" twoness in Black's original spheres case *rests entirely* on the irreflexive spatial relation ("being one mile from"). You identified this as circular (Constraint 3). If you remove that move, the twoness is no longer undeniable; it becomes a stipulation. The "cumulative effect" check fails because additive properties (mass, volume, loudness) belong to the mereological sum. A single object can have the same sum-properties as two objects. Without spatial separation to show the sum is *discontinuous*, the "two object" hypothesis and the "one object" hypothesis are empirically and metaphysically equivalent.

  **The single feature of the case that is doing the work**
  The feature that *would* have to do the work is spatial separation (an irreflexive relation). In Black's original example, this is the distance between the spheres. If that feature is removed (or if you ban using it to ground twoness, as per Constraint 3), the case collapses exactly as you guessed: it becomes indistinguishable from a single object occupying a region of space. The "two spheres" scenario simply *is* the "one universe with two regions of iron-density." Without the relation to individuate the regions, they fuse into one.

  **The strongest reply still open to someone who wants to keep the principle**
  The strongest reply for the PII defender is to embrace your worry about Constraint 3. They argue that spatial relations *presuppose* individuation. To say "Sphere A is one mile from Sphere B" already assumes A and B are distinct subjects capable of standing in relations. Therefore, spatial separation cannot *prove* distinctness; it only *describes* it once distinctness is granted.
  *Cost:* This reply costs the PII defender the ability to use macroscopic counterexamples. It forces them to claim that in the two-spheres universe, there is literally only one object (perhaps a bi-located object, or a single object with two parts that are not themselves objects). This is a high cost: it requires denying that spatially disconnected chunks of matter count as "two things." However, it is a consistent position (often called the "Identity of Indiscernibles via Bundle Theory"). Compared to the original example, this reply costs them nothing extra here; in fact, your Constraint 3 *strengthens* their position by removing their opponent's best weapon (the spatial relation argument).

  **Conclusion**
  Your doubt about the textbook case is philosophically sophisticated. You have identified the exact pressure point where Weak PII (which allows spatial properties to individuate) clashes with Strong PII (which does not). By imposing Constraint 3, you have effectively ruled out Weak PII defenses, leaving no mechanism to generate twoness from sameness. To proceed, you must relax Constraint 3 and accept that spatial relations can ground numerical diversity without circularity, or accept that PII is true and the two spheres are actually one object.
