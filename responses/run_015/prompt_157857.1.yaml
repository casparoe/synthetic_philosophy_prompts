answer: |-
  Alan Turing's suggestion in Computing Machinery and Intelligence that researchers should attempt to build a child machine rather than an adult one is widely cited but rarely scrutinized for its philosophical implications regarding the nature of mind and learning. While it is settled among scholars that Turing explicitly proposed this analogy in his 1950 paper, it remains contested whether this suggestion amounts to a substantive philosophical claim about concept acquisition or merely to an engineering heuristic about efficient computation. Existing interpretations tend to fall into two camps, neither of which fully settles the matter. The first camp reads the child-machine analogy as an early anticipation of modern machine-learning paradigms, treating education as a loose metaphor for statistical training over large datasets. The second camp dismisses the remark as rhetorical ornament with no distinct philosophical content, arguing that Turing was primarily concerned with behavioral output rather than internal developmental structures. Both camps, I argue, miss a middle possibility that this fellowship project seeks to investigate. Turing's remarks about the need for both instruction and disciplinary correction may point toward a normative structure, specifically education as a directed, evaluative practice in which a learner is held to standards of correctness that are not fully predetermined by the initial programming or the training data. The core question of this proposal is whether this normative structure can be articulated rigorously enough to distinguish genuine conceptual acquisition from mere behavioral approximation, and whether applying that distinction to current artificial learning systems reveals a meaningful gap between pedagogical development and parameter optimization.

  To address this question, the project will employ a two-phase method that carefully distinguishes between textual evidence and philosophical extension. The first phase involves a careful reconstruction of Turing's scattered remarks on child machines, discipline, and the teacher's role. It is settled that Turing discussed the use of rewards and punishments to shape the machine's behavior, yet it is contested whether he viewed these mechanisms as purely behavioral conditioning or as analogous to the normative feedback found in human education. This phase will be explicit about which claims are textually grounded and which are interpretive extensions, avoiding the error of presenting disputed interpretations of Turing's intentions as if they were the consensus view. By isolating the specific language Turing used regarding the teacher's role, the project will determine if there is sufficient textual warrant to suggest he envisioned a process involving normative accountability rather than simple error minimization. This reconstruction is necessary because without a clear understanding of what Turing meant by education, any comparison to contemporary systems rests on unstable ground. The goal is not to perform a full archival exegesis, which is beyond the scope of this fellowship, but rather to establish a conceptual baseline from which philosophical analysis can proceed.

  The second phase will examine whether philosophy-of-science accounts of concept acquisition that emphasize social normativity and error-correction can be extended to artificial systems without collapsing into behaviorism. Here, the distinction between settled and contested matters becomes crucial for the validity of the argument. It is settled within contemporary philosophy of education that human concept acquisition involves a social dimension where correctness is determined by communal standards rather than individual sensation alone. However, it remains genuinely contested whether these normative standards can be instantiated in non-biological systems that lack consciousness or embodied social participation. This phase will test whether the normative structure identified in the first phase can be mapped onto current artificial learning systems. Specifically, it will ask if the distinction between pedagogical development and parameter optimization is meaningful. If current systems are merely optimizing parameters based on loss functions, they may lack the normative dimension Turing hinted at, suggesting a gap between how they learn and how concepts are genuinely acquired. A successful conceptual framework would look like one that can describe this gap without resorting to mystification, offering clear criteria for when a system is merely approximating behavior versus when it is engaging in a form of learning that respects normative standards of correctness.

  The scope of this project is strictly restricted to conceptual architecture rather than empirical benchmarking or full archival exegesis. I will not be running experiments on neural networks nor digging into unpublished manuscripts, but rather analyzing the logical structure of the claims involved. It is vital to specify the conditions under which the project fails, as this defines the boundaries of the inquiry. The project would fail if the education-training distinction requires assumptions about consciousness or biological embodiment that Turing explicitly rejected, as this would render the comparison between human and machine education category mistaken. Similarly, the project would fail if the framework proves purely stipulative, meaning it defines education in a way that excludes artificial systems by fiat rather than by structural analysis. If the normative structure cannot be articulated without invoking properties that are inherently inaccessible to computation, then the middle ground between heuristic and philosophical claim collapses. Furthermore, if it turns out that the scholarly consensus eventually shifts to confirm that Turing's remarks were purely rhetorical, the philosophical utility of the reconstruction would be significantly diminished, though the conceptual analysis of normativity in AI would remain viable.

  Throughout this inquiry, I will maintain a clear separation between what is settled and what remains genuinely contested among scholars familiar with the topic. For instance, while it is settled that Turing believed machines could learn, it is contested whether he believed they could acquire concepts in the same sense as humans. By refusing to present any disputed interpretation of Turing's intentions or of the philosophical issues as if it were the consensus view, the proposal aims to contribute a nuanced perspective to the field. The ultimate goal is to determine if Turing's intuition about the child machine offers a robust framework for understanding the limitations of current AI, not by measuring performance, but by analyzing the structure of learning itself. If successful, this research will clarify whether the gap between human education and machine training is merely a matter of degree or a fundamental categorical difference, thereby refining our understanding of what it means for a machine to learn. This clarification is essential not only for the history of computing but for contemporary debates regarding the ethical and cognitive status of artificial agents. By focusing on the normative dimensions of learning, this fellowship will provide a conceptual toolset for evaluating future claims about machine intelligence that goes beyond the binary of skepticism and hype.
