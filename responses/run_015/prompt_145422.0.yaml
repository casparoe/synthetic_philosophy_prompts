prompt: |-
  I'm a doctoral student in bioethics and philosophy of technology, and I'm moderating the closing Q&A for our department's colloquium series. Next week's guest is a philosopher-bioethicist—let's call her Dr. Elena Voss—who defends what she terms "gradualist hedonistic engineering": the claim that germline biotechnologies should be directed not at maximizing positive affect but at compressing the lower tail of the suffering distribution, leaving the upper hedonic range intact and thereby avoiding the classic wireheading objection. She's particularly known for arguing that this approach respects a "lexical prior" on suffering-reduction over autonomy-preservation when the two conflict in reproductive decision-making, and for dismissing evolutionary-function objections by analogizing suffering to a correctable "design flaw" that we already fix in other biological systems without requiring a functional replacement.

  Write me a sequence of eight to ten interview questions that go well beyond asking her to restate the view. I want at least one question pressing how she distinguishes her "tail-compression" model from ordinary risk-reduction in conventional preventive medicine; one on whether her lexical prior collapses into a form of expected-value fanaticism once probabilities are assigned across future generations' affective states; and one on what empirical finding in neurobiology or evolutionary psychology could actually count against her claim that suffering is a correctable design flaw rather than an irreducible feature of adaptive cognition. For each of these three, include a follow-up keyed to the answer she's most likely to give—especially where she might invoke "that's a research program, not an objection" deflections or analogies to existing genetic interventions. End with a question that forces her to specify what result about the heritability of affective baselines would cause her to abandon the project entirely. Keep the tone rigorous but conversational, suitable for an audience of graduate students in philosophy and cognitive science, and avoid generic openings like asking what drew her to the topic.
