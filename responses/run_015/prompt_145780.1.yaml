      *   *Medium:* Agency definition (Martyrdom as agency). #5.
      *   *Lower:* Political utility of open wounds. #6.
      *   *Lower:* Novelist credibility. #7.
      *   *Lowest:* Specific archival detail (oral vs. written Kosovo). #8.

