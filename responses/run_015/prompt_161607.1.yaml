answer: |-
  ### Part I: Brainstorming Candidate Explanations

  You have asked me to diagnose why this argument circles without landing. Before offering my diagnosis, I will lay out four candidate explanations for the stalemate, evaluate their viability, and commit to the one that best explains the impasse.

  **Candidate 1: The Ontological Disagreement (Your Hypothesis)**
  *The Explanation:* The stalemate exists because Ana and Marcus are operating with incompatible metaphysics of "the people." Ana treats the collective will as a pre-existing entity (like a hidden object) that can be found or lost. Marcus treats it as a procedural artifact (like a manufactured product) that only exists once the rules are followed.
  *What would count against it:* If both sides agreed on the nature of the will but disagreed on the *evidence* for it, this would be false. However, your Oracle Test suggests they disagree on the *possibility* of evidence outside procedure. If they could agree on a hypothetical scenario where the procedure is perfect but the outcome feels wrong, and still disagree, this candidate holds.
  *Verdict:* Strong. It explains why facts (turnout, margins) don't move them.

  **Candidate 2: The Epistemic Disagreement**
  *The Explanation:* They agree on what the will *is* (the sum of student interests) but disagree on how we *know* it. Ana trusts mobilization and intensity (campaigns, protests) as better sensors of truth than headcounts. Marcus trusts the count itself as the only neutral sensor.
  *What would count against it:* If Ana admitted that a perfect count would override her intuition, or if Marcus admitted that a count could be "wrong" despite being fair, this would fail. But Marcus seems to deny the "wrongness" is possible if the count is fair. This suggests the disagreement is deeper than just measurement; it's about what is being measured.
  *Verdict:* Plausible, but likely a symptom of Candidate 1. You can't disagree on how to measure something if you disagree on whether the thing exists independently of the measurement.

  **Candidate 3: The Boundary Disagreement**
  *The Explanation:* The fight isn't about the "will" but about the "we." Ana's "people" excludes the AP cohort (viewed as corrupt/elite). Marcus's "people" includes all enrolled students. The stalemate is purely about membership rules.
  *What would count against it:* If Ana argued that even *including* the AP students, the "true will" was being ignored, the boundary isn't the only issue. However, her rhetoric specifically targets the AP cohort as rigging the frame. This suggests the boundary is central. But *why* does she exclude them? Because she believes they are acting against the "real" will.
  *Verdict:* This is a crucial mechanism of the stalemate, but it is driven by the Ontological view. She excludes them *because* she believes the will is antecedent and they are betraying it. Boundary is the weapon; Ontology is the ammunition.

  **Candidate 4: The Normative Risk Disagreement**
  *The Explanation:* They actually understand each other but prioritize different dangers. Ana fears oligarchy (institutions ignoring the populace). Marcus fears tyranny (a faction claiming to be the whole). They talk past each other because they are arguing about which risk is worse, disguised as an argument about what "will" means.
  *What would count against it:* If they could agree to trade risks (e.g., "We accept more oligarchy risk to avoid tyranny risk") and still couldn't agree on the definition of the will, then this isn't the root. Usually, when people dig in on definitions, it's because the definition protects their normative priority.
  *Verdict:* This explains the *intensity* of the stalemate, but not the *structure*. They aren't just saying "I prefer safety"; they are saying "You are describing reality incorrectly."

  **Commitment:**
  I commit to **Candidate 1 (The Ontological Disagreement)**, refined by **Candidate 3 (The Boundary Problem)**. The stalemate persists because Ana and Marcus are not arguing about the same phenomenon. Ana is arguing about *Legitimacy* (which requires a pre-existing will to be tracked), while Marcus is arguing about *Authority* (which requires a procedure to constitute the will). The Boundary Problem is the inevitable result of Ana's ontology: if the will is one and true, those who oppose it must be outside the "real" body. This is the explanation I will use for the diagnosis below.

  ***

  ### Part II: Diagnosis and Diagnosis Application

  You have correctly identified that the friction is not empirical. You agree on the vote count, the turnout, and the demographic splits. The friction is constitutive. You are asking whether the "will of the people" is a **discovery** (Ana) or a **construction** (Marcus).

  Here is the diagnosis of why this dispute does not move, an evaluation of your Oracle Test, and a path toward progress.

  #### 1. The Oracle Test: Diagnostic or Circular?
  Your Oracle Test is sharp, but it is not neutral. It functions as a *revelator* of the ontological split, not a resolver of it.

  *   **Ana's Reaction:** She accepts the premise. If the Oracle says the students want X, and the vote says Y, the vote is illegitimate. For Ana, the Oracle merely makes visible what was already there. The election was a failed measurement of an antecedent truth.
  *   **Marcus's Reaction:** He rejects the premise. For Marcus, "the will of the people" *is* the output of the fair procedure. If the Oracle disagrees with the vote, the Oracle is measuring "aggregate sentiment" or "psychological desire," but it is not measuring "the political will." For Marcus, the political will *does not exist* until the procedure concludes.

  **Verdict on the Test:** The test is diagnostic because it forces both sides to reveal their underlying commitment. However, it secretly assumes the answer in the sense that it asks them to choose between "Truth" (Oracle) and "Process" (Vote). Ana chooses Truth; Marcus chooses Process. They will not agree on the test's result because they do not agree on what "Will" refers to. The test proves your hypothesis: the disagreement is about the *kind of thing* the will is.

  #### 2. The Three Structural Knots
  You asked about three specific tangles in the argument. Here is how they function within the Ontological Disagreement.

  **A. The Boundary Problem**
  Yes, this is intrinsic to Ana's position. If the "will of the people" is a single, discoverable truth (like the diagnosis of a disease), then those who vote against the diagnosis are not just dissenters; they are errors. In populist logic, the "people" is a moral category, not a demographic one. By claiming the AP cohort "rigged the framing," Ana's side is effectively saying: *Those who vote against the true will are acting as agents of a foreign power (the administration/elites) and thus forfeit their standing in the "real" demos.*
  Marcus avoids this by making the boundary procedural: anyone enrolled who casts a ballot is in the demos. The stalemate exists because Ana is making a moral claim about who counts, while Marcus is making a legal claim. They cannot resolve this without agreeing on whether democracy is a moral community or a legal association.

  **B. Unmediated Custodianship**
  This is the core conflict. Ana claims **unmediated custodianship**. She believes the campaign *felt* the will directly, without needing the council's permission. This is the "populist moment"—the claim that the movement embodies the people more than the institutions do.
  Marcus insists on **mediated custodianship**. He believes no one can hold the will except through the rules (the council, the ballot, the count).
  The stalemate is permanent here because Ana's claim *requires* breaking the mediation to be valid. If she admits she needs the council's framing to know the will, her claim that the council betrayed the will collapses. Marcus cannot concede unmediated access without admitting that any mob with a loudspeaker can override the rules.

  **C. Descriptive vs. Normative**
  They are answering different questions under one heading.
  *   **Ana is asking a Normative question:** "Who has the right to rule?" Her answer: "Those who track the underlying sentiment."
  *   **Marcus is asking a Descriptive/Procedural question:** "How is a decision made?" His answer: "By the count."
  The confusion arises because Ana uses descriptive language ("The students *want* this") to make a normative point ("Therefore the council *must* do this"). Marcus counters with procedural description ("The students *voted* that") to make a normative point ("Therefore the result *stands*"). They are talking past each other because one is speaking the language of *Truth* and the other the language of *Validity*.

  #### 3. What Counts as Progress?
  You asked what would count as progress. Since this bottoms out in incompatible intuitions about authority, **empirical findings will not solve it.** Showing that populist movements succeed or fail elsewhere won't change their minds about *this* school's legitimacy.

  Progress is only possible if you **change the question**.
  Stop asking: *"What is the will of the people?"*
  Start asking: *"What are the consequences of claiming to know the will of the people?"*

  This shifts the debate from Ontology (what exists) to Prudence (what happens).
  *   **To Ana:** "If you claim the AP students aren't part of the 'real' people, what happens when they claim the same about you? Does the student body fracture?"
  *   **To Marcus:** "If you claim the procedure is all that matters, even when the framing was controlled by the winners, what happens when students stop believing the count represents them? Does the council lose all authority?"

  Progress looks like moving from a debate about **Legitimacy** (which is binary: you have it or you don't) to a debate about **Stability** (which is a matter of degree).

  #### 4. Application to the GPA Referendum
  Here is what the diagnosis requires Ana and Marcus to concede if they want to escape the loop.

  **What Ana must give up:**
  She must abandon the claim that the "real student body" is a discoverable fact that excludes the AP voters. She has to admit that her "will of the people" is a **political claim**, not a scientific finding.
  *   *Concession:* "We are not speaking for the 'real' students in a metaphysical sense. We are speaking for a coalition that feels underrepresented by the current rules. We are not revealing the truth; we are demanding a renegotiation of the contract."
  *   *Why:* If she admits this, she loses the moral high ground of "Democracy with the training wheels off," but she gains the ability to negotiate without declaring half the school "corrupt."

  **What Marcus must give up:**
  He must abandon the claim that the procedure is self-justifying regardless of the context. He has to admit that a vote can be procedurally perfect but politically hollow if the framing was skewed.
  *   *Concession:* "The vote count is authoritative, but it is not infallible. If the ballot wording favored the status quo, the result has lower legitimacy, even if it is valid. The council has a duty to ensure the 'will' can form, not just count it."
  *   *Why:* If he admits this, he loses the shield of "Rules are Rules," but he prevents the alienation that leads to the very populist unrest he fears.

  #### 5. Final Advice: What Should You Do?
  You are in a position where you see the trap. The honest answer is that this **does bottom out in intuitions about authority** that neither side can argue for without circularity. Ana believes authority comes from below (consent); Marcus believes it comes from the structure (rules). Neither can prove their starting point without assuming it.

  **Do not try to convince them they are wrong about the "Will."** They will not move on ontology.
  **Do try to convince them that their ontology is dangerous.**

  *   **Tell Ana:** "If the will is antecedent and discoverable, you give yourself a license to ignore any minority that disagrees with you. You become the thing you hate: an elite that knows better than the voters."
  *   **Tell Marcus:** "If the will is only procedural, you make the institution a hollow shell. If the rules don't track reality, people will stop following the rules and start following leaders who claim to know the truth."

  **The Practical Shift:**
  Drop the question of "Who represents the people?" and argue about **Institutional Design**.
  Propose a concrete compromise: "The vote stands (Marcus wins), *but* the council must convene a separate assembly to review how ballot language is written for future referendums (Ana wins)."
  This allows Marcus to keep the *authority* of the past vote, and allows Ana to change the *procedure* for the future. It acknowledges that the "will" wasn't captured well this time, without declaring the vote a lie.

  If they refuse this, then the argument is no longer about democracy. It is about power. At that point, you should disengage. A debate about the nature of the collective will is only productive if both sides care more about the health of the collective than about winning the argument. If they prefer winning, no philosophical diagnosis will save them.
