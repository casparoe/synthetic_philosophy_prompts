answer: |-
  the form holds shape when no adjective is near,
  The hoofbeat sounds exactly as we hear.
  the color divides the extension from the whole,
  A specific ghost within the general soul.

  the form holds promise of the four-legged kind,
  Leaving the particular shade behind.
  the color divides the set from out the mass,
  A white spot breaking up the general mass.

  the color divides the subject from the predicate,
  Where identity becomes incomplete.
  the form holds silence when the compound speaks,
  Where logic fractures at the boundary peaks.

  Now the form holds what the color divides in two,
  Neither the horse nor white remain the same.
  The statement closes like a stable gate,
  Leaving the beast outside to wait.

  ***

  **Note on Text and Interpretation**

  **Settled Context:** The text is securely attributed to the *Gongsun Longzi*, a core document of the School of Names (Mingjia) during the Warring States period. The central thesis ("A white horse is not a horse") and the dialogue format are established facts. The school's general interest in the relationship between names (*ming*) and actualities (*shi*) is also uncontested.

  **Contested Ground:** Scholarly consensus fractures on the philosophical intent. Interpretations range from:
  *   **Metaphysical:** A theory of universals (the concept "horse" vs. the concept "white horse").
  *   **Logical:** A distinction between identity and class membership, or the behavior of compound predicates restricting extension (the reading favored in this poem).
  *   **Rhetorical/Political:** A sophistical exercise or a critique of bureaucratic title inflation (*zhengming*).
  There is no agreement on whether Gongsun Long is asserting a truth about reality or exposing a failure of language.

  **Poetic Liberties:** This poem adopts the **extensional/predication reading** without validating it as definitive. It treats "form" as the bare term (unrestricted extension) and "color" as the qualifier that divides/restricts that extension. This privileges a logical-semantic interpretation over political or rhetorical ones. Additionally, the poem stabilizes "form" as an enduring essence that "holds," whereas some interpretations suggest Gongsun is arguing that *no* name successfully holds the object at all. The structural swap in the third stanza enacts the interpretive stalemate rather than resolving it.
