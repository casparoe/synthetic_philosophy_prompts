      *   *(2) Respect via Blame:* Blame = taking someone seriously (demand). Withholding reactive attitudes = insult/objectification (unless excused).
      *   *(3) Exceptions:* Withholding resentment is decent for some (children, dementia, psychopaths). Resenting them is the defect.
      *   *(4) Trainability:* Reactive attitudes can/should be trained by facts about human action (addiction, situation). It's rational, not just conditioning.
      *   *(5) Trade Claims:* Fictional resentment = real resentment. Fiction refines attitudes. Causal history of *reader's* outrage (engineered by author) doesn't defect, *but* newspaper campaign outrage *is* defective (despite similar engineering).

  3.  **Identify Tensions/Contradictions:**

      *   *Tension A: (1) vs. (4) - The "Causal History" Problem.*
