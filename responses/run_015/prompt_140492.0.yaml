          *   (4) says: Discoveries about how action is produced (addiction, situation) *should reshape attitudes* (reduce resentment).
          *   *Conflict:* If causal history is irrelevant (1), why does learning about causes (addiction/situation) justify reducing resentment (4)? Strawson distinguishes between *excuses* (within practice) and *exemptions* (outside practice), but also suggests determinism doesn't matter. However, (4) implies empirical facts *do* matter for responsibility, which nudges toward the external view (1) rejects.
          *   *Severity:* High. This strikes at the core Strawsonian commitment.

      *   *Tension B: (1) vs. (5) - The "Engineered Outrage" Problem.*
          *   (1) says: Causal history of the *agent's* will is beside the point.
          *   (5) says: Causal history of the *reader's* outrage matters. Author-engineered outrage = OK. Newspaper-engineered outrage = Defective.
          *   *Conflict:* Why is the causal history of the *emotion* relevant in (5) but the causal history of the *will* irrelevant in (1)? If manipulation undermines the newspaper campaign, why doesn't manipulation (covert engineering) undermine the agent in (1)?
          *   *Severity:* Medium-High. It looks like a double standard on "engineering."

      *   *Tension C: (2) vs. (3) - The "Insult vs. Decency" Problem.*
          *   (2) says: Withholding reactive attitudes is *presumptively an insult*.
          *   (3) says: Withholding them from some (dementia, etc.) is *decency*.
          *   *Conflict:* This is actually the standard Strawsonian distinction between *excuses/exemptions*. (2) says "presumptively," (3) provides the defeaters.
          *   *Severity:* Low. This is a standard philosophical move (presumption vs. exception). Can be easily reconciled by clarifying the "presumption."

      *   *Tension D: (5) Internal - Fiction vs. Newspaper.*
          *   (5) says: Fiction outrage = real/valid. Newspaper outrage = defective. Both are "engineered."
          *   *Conflict:* What is the relevant difference? If it's about truth/facts, (4) covers that. If it's about the *purpose* of the engineering?
