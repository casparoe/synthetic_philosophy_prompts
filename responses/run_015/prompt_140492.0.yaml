          *   Do not assume the "trade claims" (Point 5) are the weakest; treat all points equally regarding philosophical strength.
      *   **Tone:** Professional, analytical, respectful of the author's expertise (novelist), philosophical but accessible.

  2.  **Analyze the Input (The 5 Points):**
