      *   *Refining the (1) vs. (4) analysis:*
          *   (1) says "route... is beside the point." (4) says "discoveries about how action is produced... should reshape attitudes."
          *   *Fix:* Distinguish between *determinism* (metaphysical cause) and *excusing conditions* (psychological/situational facts). Strawson allows facts to modify attitudes *within* the practice. (1) needs to clarify it means "metaphysical causation" not "psychological explanation."
