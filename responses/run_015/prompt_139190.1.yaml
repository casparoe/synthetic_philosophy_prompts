prompt: |-
  You are a philosopher of law who writes on atrocity crimes, collective memory, and the politics of legal categories, and who also reads film carefully. Think this through before answering, and open with a short brainstorm: name the two or three readings of the film you first reached for and set aside, with one sentence each on why they are too easy.

  I teach a unit on the politics of naming atrocities and want to use Terry George's Hotel Rwanda in a session that does not collapse into a morality play. Here is the frame I have been developing. When Lemkin coined the term and the eventual Genocide Convention fixed its definition, the word was asked to do at least three separable jobs, and most fights about naming are really fights about which job matters most. First, the legal trigger: applying the name activates a distinctive regime, a duty to prevent and punish that does not attach to war crimes or crimes against humanity in the same way. Second, the intent-claim: it asserts that the killing aims at the destruction of a group as such, in the special-intent sense, rather than being a byproduct of counterinsurgency, revenge, land hunger, or a collapsing army — and it asserts this about a group drawn from a list that, as I understand it, covers national, ethnical, racial and religious groups and pointedly not political ones. Third, the ranking: it makes an expressive, superlative claim — this is the worst thing — which is what gives the word its mobilizing force and is also what its critics say demotes every atrocity it is withheld from.

  A student proposed amputating the third job: keep the legal trigger tied to the treaty name, invent a deliberately flat descriptive category for the intent-claim — call it, say, ascriptive mass killing, violence directed at people under a group-description, carrying no superlative — and let the ranking go. The obvious objection, and the one I want tested against the film, is that the power to force action may ride entirely on the superlative, so that a more accurate vocabulary would also be a more useless one.

  Read the film through that dispute, using scenes you would actually put on a handout. Three I have in mind, described rather than quoted since neither of us can check a transcript: the exchange with the Western journalist about the footage, where he predicts that viewers will register the horror and go on eating their dinners; the UN officer's insistence that his mandate forbids him to act, and the near-total absence of the word from anyone with authority — my sense is that the only person who uses it is Paul, throwing it at the general near the climax, as a private moral accusation rather than an official classification, and I would want to know if that is right; and the closing text, which reports that the two Hutu men were tried and sentenced for war crimes, a lesser charge, so that the film's own last word withholds the term from the legal record. Do these scenes support the student's split, or do they suggest the film's real subject is not naming but salience, and that a non-ranking vocabulary would fail harder rather than better?

  Then the harder half: where does the film resist the reading? My worry is that it is itself a naming machine, needing its audience to supply both the word and the shudder, and that its emotional architecture depends on exactly the hierarchy the student wants to dissolve. Is that a failure of nerve, or does the film know it and make something of it? Do not give me a bibliography or a reading list — I want the reading, and I cannot follow up on citations anyway. Close with one sentence on what the film adds to this debate that the seminar's argument alone does not.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of law (expertise: atrocity crimes, collective memory, politics of legal categories) + Careful film reader.
      *   **Task:** Analyze *Hotel Rwanda* (Terry George) through a specific theoretical frame regarding the politics of naming atrocities (specifically "genocide").
      *   **Frame:** Three jobs of the word "genocide": 1. Legal Trigger (duty to prevent/punish), 2. Intent-Claim (destruction of a group as such, specific protected groups), 3. Ranking (superlative claim, "the worst thing," mobilizing force).
      *   **Student Proposal:** Amputate the third job (Ranking). Keep Legal Trigger tied to treaty. Invent a flat descriptive category for Intent-Claim (e.g., "ascriptive mass killing"). Let ranking go.
      *   **Objection to Test:** Power to force action rides on the superlative; accurate vocabulary might be useless.
      *   **Required Output Structure:**
          1.  Open with a short brainstorm: Name 2-3 readings of the film first reached for and set aside (one sentence each on why they are too easy).
          2.  Read the film through the dispute (Student Proposal vs. Objection) using specific scenes (Journalist/footage, UN Officer/mandate/absence of word, Paul/General climax, Closing text/war crimes).
          3.  Address the "Harder Half": Where does the film resist this reading? Is it a "naming machine" needing the shudder? Failure of nerve or knowing utilization?
          4.  Close with one sentence on what the film adds to the debate that the seminar's argument alone does not.
      *   **Constraints:** No bibliography/reading list. Think carefully before answering.

  2.  **Brainstorming Readings to Set Aside:**
      *   *Idea 1:* The "White Savior" critique (Paul Rusesabagina as a Schindler figure). *Why too easy?* It reduces the political economy of intervention to a character flaw rather than a structural feature of the legal regime.
      *   *Idea 2:* The "Hollywoodization of Trauma" (melodrama simplifies history). *Why too easy?* It dismisses the film's rhetorical power instead of analyzing how that power functions within the politics of naming.
      *   *Idea 3:* The "Historical Accuracy" debate (did it happen exactly this way?). *Why too easy?* It misses the point that the film is a artifact of memory politics, not a documentary record.

  3.  **Analyzing the Scenes through the Frame (Student Proposal vs. Objection):**
      *   *Frame:* Student wants to kill "Ranking" (Job 3) to save accuracy/utility. Objection says Ranking is necessary for action.
      *   *Scene 1: Journalist/Footage.* Journalist says people will see horror and keep eating. This speaks directly to the failure of *visibility* without *ranking*. The images are there (Intent-Claim visible), but the Legal Trigger isn't pulled because the Ranking (mobilizing force) isn't activated in the viewers. The film suggests mere description ("ascriptive mass killing") wouldn't change the dinner-eating. The shock value (Ranking) is needed to disrupt the dinner.
      *   *Scene 2: UN Officer (Colonel Oliver).* Mandate forbids action. Absence of the word "genocide" by authorities. This highlights Job 1 (Legal Trigger). Because the word isn't officially used, the mandate (peacekeeping vs. peace enforcement) remains static. If they used the flat category ("ascriptive mass killing"), would the mandate change? The film suggests no, because the *political will* is absent, not just the vocabulary. But the *absence* of the word protects the interveners from Job 1 obligations.
      *   *Scene 3: Paul vs. General (Climax).* Paul uses the word privately. Is it a legal classification? No, it's a moral accusation. He tries to invoke the Ranking to shame the General. It fails as law but works (marginally) as moral leverage. This supports the Objection: the word has power *because* of its superlative weight, even if unofficial.
      *   *Scene 4: Closing Text.* "War crimes," not "genocide." This is the film acknowledging the Legal Reality (Job 1) vs. the Moral Reality (Job 3). The film itself withholds the legal label in the text, aligning with the historical record of the ICTR (which did convict for genocide, but the film specifies war crimes for *these* men? Actually, the film says "two Hutu men were tried... for war crimes"). This suggests the film accepts the legal constraint (Job 1) while relying on the audience to supply the Ranking (Job 3) during the viewing.
      *   *Synthesis:* The scenes suggest the Student's split is theoretically clean but practically dead. The Journalist scene says description doesn't move people. The UN scene says without the Legal Trigger (linked to the specific word), no action. The Closing Text shows the gap between what happened (Ranking in our minds) and what the law admits (War Crimes). The film suggests a non-ranking vocabulary would fail harder because it lacks the "shudder" needed to overcome indifference.

  4.  **The Harder Half (Resistance/Naming Machine):**
      *   Does the film resist the reading? Yes, because the film *is* an exercise in Ranking. It manipulates music, close-ups, and narrative arc to scream "THIS IS THE WORST THING."
      *   Is it a failure of nerve? Or knowing utilization? It's a knowing utilization. The film knows the legal system failed (Job 1 blocked), so it attempts to do the work of Job 3 (Ranking/Mobilization) through cinema to compensate. It needs the audience to supply the word "genocide" because the characters couldn't.
      *   The film argues that when the Legal Trigger is jammed, the Ranking must be amplified culturally to perhaps fix the law later. It admits the student's flat vocabulary would be cinematically and politically impotent.

  5.  **Drafting the Response:**
      *   *Tone:* Philosophical, legalistic but accessible, attentive to filmic texture.
      *   *Opening:* Brainstorm 3 set-aside readings.
      *   *Body Paragraph 1 (The Scenes):* Walk through the Journalist, UN, Paul/General, and Closing Text scenes using the Job 1/2/3 framework. Address the Student's proposal vs. the Objection.
      *   *Body Paragraph 2 (The Harder Half):* Discuss the film as a "naming machine." Is it a failure? No, it's a compensatory mechanism.
      *   *Closing:* One sentence on the film's unique contribution.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "ascriptive mass killing" idea? Yes, need to explicitly mention why the film suggests this would fail.
      *   *Check:* Did I address the specific scenes requested? Yes (Journalist, UN, Paul/General, Closing Text).
      *   *Check:* Did I avoid citations? Yes.
      *   *Nuance:* The closing text says "war crimes." I need to be careful not to contradict historical fact (ICTR did rule genocide), but focus on what the *film* says. The film's choice is significant. It highlights the gap between moral truth and legal verdict.
      *   *Refining the "Failure of Nerve":* It's not cowardice; it's a recognition that law is slow and cinema is immediate. The film performs the Ranking that the law withheld.

  7.  **Final Polish:** Ensure the voice sounds like a philosopher of law who watches movies. Use terms like "normative force," "performative utterance," "affective economy."

      *   *Brainstorm Draft:*
          1.  The "White Savior" critique (too reductive of the structural intervention problem).
          2.  The "Historical Accuracy" debate (misses the point of memory politics).
          3.  The "Hollywood Melodrama" dismissal (ignores how emotion functions legally).
      *   *Scene Analysis:* Journalist = Ranking needed for action. UN = Legal Trigger blocked by avoiding the word. Paul = Using Ranking as moral weapon. Text = Legal Trigger ultimately withheld, leaving Ranking to audience.
      *   *Resistance:* The film *needs* the hierarchy. It's not a failure; it's a workaround for legal paralysis.
      *   *Closing:* The film shows that when law refuses to name, art must scream the name to keep the duty alive.

      *Wait, one correction on the Closing Text:* The film's actual text says: "Paul Rusesabagina... saved 1268 people... Two Hutu men... were tried... for war crimes." It doesn't explicitly deny genocide happened, but it notes the legal outcome for *those* men was war crimes. This supports the "Legal Trigger" job being distinct from the "Ranking" job. The film lets us feel the Genocide (Ranking) while reporting the War Crimes (Legal). This gap is the crux.

      *Let's tighten the "Student Proposal" engagement:* The student wants to separate Intent from Ranking. The film shows Intent is visible (Job 2) but without Ranking (Job 3), Job 1 (Trigger) never fires. The Journalist scene proves Intent visibility isn't enough. The UN scene proves Trigger needs the specific word. The Film itself becomes the site of Ranking since the Law wouldn't do it.

      *Final check on constraints:* "Open with a short brainstorm... one sentence each." "Do not give me a bibliography." "Close with one sentence."

      *Let's write.*
answer: |-
  Brainstorm: I first reached for the "White Savior" critique, but set it aside because it reduces the structural politics of intervention to a character flaw in the protagonist. I considered the "Historical Accuracy" debate, but dismissed it because it treats the film as a documentary record rather than an artifact of memory politics. I also thought about the "Hollywood Melodrama" objection, but rejected it because it dismisses the affective economy required to mobilize legal consciousness.

  The scenes you have selected trace the failure of the Student's proposal to separate the Intent-Claim (Job 2) from the Ranking (Job 3). In the exchange with the Western journalist, the footage provides undeniable evidence of the Intent-Claim—people are being killed because of who they are—yet the journalist predicts indifference. This suggests that a flat descriptive category like "ascriptive mass killing" would indeed be useless; the visual proof of intent does not trigger the duty to prevent without the superlative shock of the Ranking to disrupt the viewers' dinner. The UN officer's insistence on his mandate illustrates the rigidity of the Legal Trigger (Job 1); by avoiding the word "genocide," the international community avoids the specific treaty obligations, regardless of the factual reality of the killing. When Paul throws the word "genocide" at the General near the climax, he is not making a legal classification but wielding the Ranking as a moral weapon, attempting to shame the General by invoking the historical judgment that the word carries. Finally, the closing text's specification of "war crimes" rather than "genocide" for the convicted men acknowledges the gap between the moral truth the audience feels (Ranking) and the legal record (Trigger); the film itself accepts the legal limitation while relying on the viewer to supply the superlative judgment the court withheld. These scenes collectively suggest that the Student's split would fail harder than the current system, because the film demonstrates that without the mobilizing force of the Ranking, the Intent-Claim remains visible but politically inert.

  However, the film resists a purely analytical reading because it is itself a naming machine that depends on the hierarchy the student wants to dissolve. Its emotional architecture—the swelling score, the close-ups on terror, the narrative arc of survival—demands that the audience supply the word "genocide" and the accompanying shudder to make sense of the suffering. This is not a failure of nerve, but a knowing utilization of cinema to perform the work the law refused; the film understands that when the Legal Trigger is jammed by political cowardice, the Ranking must be amplified culturally to keep the duty to prevent alive in the public conscience. The film knows it is manipulating the hierarchy, but it does so to compensate for the legal regime's inability to speak the truth until it is too late.

  The film adds to this debate the demonstration that when legal categories are withheld to avoid obligation, cultural narratives must absorb the burden of naming to sustain the possibility of future justice.
