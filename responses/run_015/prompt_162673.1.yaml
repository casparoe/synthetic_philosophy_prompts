answer: |-
  This is a strong set of intuitions. You are actually much closer to a coherent theory than you think; the friction you feel between Case 1 and Case 2 isn't a contradiction, it's the hinge of a specific philosophical stance on memory.

  Your TA is right about scarcity, but you are right to worry about how it fits. If scarcity is just an add-on ("Remove him, *also* we need space"), it's utilitarian. If it's internal ("Public space *is* a scarce resource for moral instruction"), it's constitutive.

  Here are two competing principles drafted tightly enough for a paper. One prioritizes **Communication** (your gut), the other prioritizes **Civic Function** (your TA's pressure). I have tested them against your list and the new cases.

  ### Principle A: The "Active Endorsement" Principle
  *Best fit for your gut verdicts on 1, 2, and 8.*

  **The Principle:** A commemoration in public space must be removed or altered if:
  1.  **Reception:** It is currently received by a reasonable audience as an *active honor* (rather than inert history or furniture); **AND**
  2.  **Taint:** The moral wrongs associated with the subject are substantially connected to the reason for the honor; **AND**
  3.  **Displacement:** Its retention occupies a scarce civic slot that implicitly blocks the honoring of a morally worthy alternative.

  **How it handles your cases:**
  *   **Case 1 (Confederate):** **Remove.** It is received as honor (courthouse lawn), the honor is tainted (white supremacy), and it blocks a better use of the lawn (Clause 3).
  *   **Case 2 (Unknown Colonel):** **Keep.** Fails Clause 1. It is "park furniture." It communicates no honor, so it violates no civic trust. The scarcity clause doesn't trigger because the slot isn't *functioning* as an honorific slot.
  *   **Case 3 (Scientist):** **Tension.** This principle forces you to choose. If the statue is "active honor," it must go (or be moved to a museum). If it's "history," it stays. Your verdict (Keep Statue/Rename Building) suggests you view Buildings as *Functional* (Clause 3 heavy) and Statues as *Representational* (Clause 1 heavy).
  *   **Case 7 (Labor Organizer):** **Remove.** This is the risk point. If "reasonable audience" includes the labor movement who might still claim him, Clause 1 is met. If nobody knows him, Clause 1 fails, and you should Keep. Your gut says Remove, which implies you think *potential* future honor is enough to trigger scrutiny.
  *   **Case 8 (Bishop):** **Keep Tomb/Remove Plaque.** Tomb = Architecture/History (Fails Clause 1). Plaque = Active Honor (Meets Clause 1 & 2).

  **The New Cases:**
  *   **Founders Day:** **Rename.** Holidays are active civic rituals (Clause 1). Even if people treat it as a "day off," the state is still performing the speech act of honor.
  *   **Scholarship Fund:** **Keep Name.** If the money is spent and renaming kills the scholarship, Clause 3 (Displacement) works *against* removal. The "scarce slot" is the financial aid, not the name. Removing the name destroys the good without creating space for a new donor (since the money is gone).
  *   **High School (Civil Rights Leader):** **Keep.** Private abuse vs. Public virtue. Unless the abuse undermines the public virtue (e.g., he abused the people he was organizing), Clause 2 fails.
  *   **Neo-Nazi Rally:** **Remove (Stronger).** This triggers Clause 1 aggressively. The meaning of a monument is not fixed at dedication; it is co-authored by its users. If a hate group claims it, the "reasonable audience" now receives it as a hate symbol. The *current* reception overrides the *original* intent.

  **Where it breaks:**
  It struggles with Case 3 (why is the building name worse than the statue?) and Case 7 (why remove if no one is honoring him?). You may need to argue that Case 7 is about *preemptive* harm—preventing the slot from *becoming* honorific in a toxic way.

  ***

  ### Principle B: The "Civic Function" Principle
  *Best fit for your TA's scarcity requirement and Case 3/5 distinctions.*

  **The Principle:** Public commemorative slots are finite resources for modeling civic virtue. A name or monument must be removed if:
  1.  **Function:** The object serves a *functional* civic role (education, transit, governance) rather than a purely *historical* one; **AND**
  2.  **Exemplarity:** The subject's life fails to meet the threshold of moral exemplarity required for that specific function; **AND**
  3.  **Feasibility:** A viable alternative exists that does not destroy the functional good (e.g., funding, shelter).

  **How it handles your cases:**
  *   **Case 1 (Confederate):** **Remove.** Courthouse lawn = Functional civic space (governance). He is not a moral exemplar for governance.
  *   **Case 2 (Unknown Colonel):** **Keep.** Park = Recreational/Historical. He is not functioning as an exemplar because he is unknown.
  *   **Case 3 (Scientist):** **Save the Inconsistency.** Building = Functional (people work/learn there). Requires high exemplarity. Statue = Historical/Artistic. Can tolerate nuance with a plaque. This principle *validates* your split verdict.
  *   **Case 5 (Merchant):** **Rename Street/Keep Library.** Street = Transit/Functional. Library = Functional, *but* Clause 3 (Feasibility) saves it if renaming threatens the library's operation or endowment. (You need to verify if the name is tied to the funding).
  *   **Case 6 (Museum):** **Keep.** Museum = Historical context, not Civic Honor.
  *   **Case 7 (Labor Organizer):** **Remove.** If he is in a public park, he is proposed as an exemplar. He fails the threshold.

  **The New Cases:**
  *   **Founders Day:** **Rename.** A holiday is a functional civic ritual.
  *   **Scholarship Fund:** **Keep.** Clause 3 (Feasibility). Renaming destroys the function (the money). The "honor" is secondary to the utility.
  *   **High School:** **Keep.** The function is education. The Civil Rights leader supports that function. The private abuse, while bad, doesn't negate the civic utility of his public legacy *unless* it undermines the school's mission.
  *   **Neo-Nazi Rally:** **Remove.** The "Function" of the statue has shifted from Honor to *Flashpoint*. It is no longer modeling virtue; it is modeling conflict. It fails the civic function test.

  **Where it breaks:**
  It struggles with Case 8. A tomb in a cathedral is "architecture," but so is a courthouse. Why is one functional and the other not? You'd have to argue "Active Worship Space" vs. "Historical Artifact." It also risks being too utilitarian—does a bad person *never* deserve a statue if the statue is beautiful?

  ***

  ### The Verdict on Your "Stuck" Point (Case 1 vs. 2)

  You wrote: *"If the problem with the general is the message the object sends now, then 2 is fine and 1 is fine — but then 1 has nothing to do with the general, and it bugs me that on that story we're taking his statue down for reasons that don't involve him."*

  Here is the philosophical move to unstick you: **Commemoration is not about the dead; it is about the living.**

  If you adopt **Principle A**, you can argue:
  "We are not punishing the General. We are regulating the City's speech. In Case 1, the City is speaking racism through the General. In Case 2, the City is silent; the statue is just noise. We remove Case 1 not because the General is bad, but because the *City's endorsement* is bad. The General is merely the medium."

  This solves the "nothing to do with him" worry. It *is* about him, but only insofar as he is the vehicle for the City's current message. In Case 2, he is no longer the vehicle. He is just bronze.

  ### Recommendation for Your Paper

  I recommend **Principle A (Active Endorsement)** with a specific modification to handle the TA's scarcity point.

  **Modified Principle:**
  > "Public space is a scarce resource for **civic instruction**. A commemoration must be removed when it actively instructs the public to honor a subject whose moral failings undermine the civic values that space is meant to uphold."

  **Why this works for you:**
  1.  **Integrates Scarcity:** It defines public space *as* a resource for instruction. Keeping a bad statue isn't just "wasting space," it's "teaching the wrong lesson."
  2.  **Solves 1 vs 2:** Case 1 teaches white supremacy (bad instruction). Case 2 teaches nothing (no instruction).
  3.  **Solves 3 (Statue vs Building):** You can argue a Building Name is *administrative* instruction (Who runs this place?), while a Statue is *historical* instruction (Who do we remember?). You can tolerate complexity in history (Plaque) but not in administration (Name).
  4.  **Solves Neo-Nazi Case:** The "instruction" has changed. The statue now instructs that this space is contested or owned by hate groups.

  **The Hard Truth (What it can't save):**
  This principle will force you to harden your stance on **Case 7**.
  *   **If nobody knows him:** You cannot argue he is "actively instructing" anyone. To be consistent, you must **Keep** the statue (perhaps with a plaque).
  *   **If you Remove:** You must argue that *potential* instruction is enough. i.e., "We must scrub the slot because if anyone *did* look, they would learn the wrong thing." This is a "Preemptive Sanitization" clause. It's defensible, but it risks erasing history (the "Stalinist" objection).

  **Final Advice:**
  Lean into the **Case 2 (Park Furniture)** intuition. It is your strongest philosophical asset. It distinguishes between *Memory* (what we actively hold) and *Debris* (what is left over). Argue that we have a duty to remove toxic *Memory*, but no duty to police toxic *Debris* unless it becomes active again (like the Neo-Nazi case). That distinction is publishable.
