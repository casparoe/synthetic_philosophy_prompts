answer: |-
  **Scenario**
  The Director of a Federal Disaster Relief Agency faces an approaching hurricane with divergent tracking models. To deploy emergency supplies effectively, the Director must authorize a $50 million non-refundable logistics contract immediately, before landfall confirms the impact zone. However, a hidden legislative sequestration trigger—a structural shift in appropriations law unknown to the public or the agency—will automatically freeze all disaster funds if the storm hits a specific coastal state. If the Director commits the funds and the trigger activates, the agency faces insolvency and scandal for spending frozen money; if the Director withholds funds and the storm hits a funded zone, thousands suffer due to delayed aid. The outcome of the legislative trigger is structurally invisible until after the spending deadline.

  **Analysis**
  For Machiavelli, *virtù* is the capacity to read *necessità* and adapt to the times; here, the structural fortune (the sequestration trigger) is an unstoppable river. Because the leader cannot observe the outcome before committing, the gamble threatens the survival of the state (the agency itself). Machiavellian *virtù* forces a surrender: cancel the deployment. This looks like cowardice or negligence to the public, but it preserves the institution's capital to fight when the terrain is favorable. The Stoic, conversely, argues that virtue lies solely in the intention and duty of the role. The Director's function is to relieve suffering; the funding rules are "indifferents" outside their control. The Stoic demands holding the line: authorize the contract. To do otherwise is to prioritize self-preservation over moral duty.

  **The Isolating Feature**
  The exact feature doing the work is the **temporal gap between resource commitment and information revelation**. The leader must burn the bridge before knowing if the enemy is on the other side. This forces a choice between institutional survival (Machiavelli) and role integrity (Stoic).

  **What Collapses**
  If you let the leader observe outcomes first (i.e., wait for the legislative trigger to be public), the Machiavellian tension collapses. If the funds are safe, Machiavelli spends; if frozen, he doesn't. His *virtù* becomes mere calculation, not a test of adapting to blind fortune. The Stoic position remains unchanged (duty is duty), but the conflict vanishes because the risk is removed.

  **The Stoic Counter**
  The Stoic's best counter is to argue that the Machiavellian has mislabeled **prudence as virtue**. By canceling the deployment to save the agency's balance sheet, the Director is not exercising *virtù* but rather a calculated self-interest disguised as strategic wisdom. True virtue requires acting rightly regardless of the systemic cost; saving the agency at the expense of the citizens it serves is not statecraft, it is cowardice masquerading as realism.
