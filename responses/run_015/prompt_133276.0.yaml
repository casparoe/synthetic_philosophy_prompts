answer: |-
  ### Brainstorming & Decomposition

  Weil's *On the Abolition of All Political Parties* is often read as institutional critique, but that's surface level. Her metaphysics of attention drives the politics. She views the party not as a building or a roster, but as a specific orientation of the will: the substitution of collective pressure for individual conscience. The "party spirit" is the belief that the group's growth and victory are goods in themselves, superseding truth.

  If the sin is the *orientation of the will* (loyalty to the group over loyalty to the Good), then institutional permanence is merely an accelerant, not the fuel. However, permanence does create careerism and ritual, which harden the psychology. The question is whether the psychology can ignite without the hardening.

  Here is the breakdown of my credence:

  **1. Probability that Weil's primary target is the psychological mechanism rather than institutional machinery.**
  **90%**
  Weil is fundamentally a moralist and a mystic, not a constitutional engineer. Her critique of force is ontological. She argues that a party is defined by its ability to generate "collective passion" that bypasses the individual's capacity for attention. The machinery (funding, careers) is evidence of the disease, not the disease itself. If she were only critiquing machinery, she would propose reform. Instead, she proposes abolition because the *structure of collective thought* is inherently idolatrous.

  **2. Probability that a temporary coalition necessarily triggers the same mechanism.**
  **70%**
  This is the variable. A permanent party demands long-term loyalty, which calcifies thought. A temporary coalition *can* be a loose handshake among independents. However, to be politically effective (to pass the bill), coalitions usually demand unified messaging, vote whipping, and the silencing of dissent for the "greater good." This creates the same "us vs. them" dynamic Weil despises. Yet, without the promise of future career reward within the structure, the pressure might be less totalizing. I dock points here because a truly temporary, loose alliance *might* avoid the hardening of dogma, whereas a party cannot.

  **3. Probability that her premises entail this extension regardless of whether she ever said it.**
  **95%**
  Her logic is universalist. If the core evil is the diversion of attention from Truth to Collective Power, the duration of the collective is irrelevant. A short-lived idol is still an idol. If the premise is that "collective pressure crushes individual attention," then any grouping that exerts collective pressure falls under the ban. The logic does not contain a time-limit clause.

  ### Overall Credence

  **0.78**

  I am strongly on your side. Weil's critique is rooted in the economy of the soul, not the calendar of the institution. However, I stop short of 0.90+ because there is a pragmatic distinction: permanent structures *institutionalize* the pressure, making escape impossible, whereas temporary coalitions might allow members to dissolve the group once the truth is served (though Weil would doubt they ever serve truth first).

  ### Least Sure Term

  **Term 2 (Temporary Coalition Trigger): 70%**

  This is the weakest link. My uncertainty lies in whether a coalition can exist without becoming a "party" in all but name. Weil argues that any collective entity seeking political power inevitably develops a will to power distinct from the good. But is there a threshold of organization where this kicks in? A loose coalition might remain a "gathering of individuals" rather than a "collective organism." If the coalition refuses to demand uniformity, it might escape her critique. I am unsure if Weil believes such a thing is politically possible, or merely theoretically possible.

  **What would shift my number:**
  A passage where Weil distinguishes between "collectives formed around power" vs. "collectives formed around truth." If she explicitly allows for groups that subordinate their existence to a specific truth without seeking self-perpetuation, my credence that she targets temporary coalitions would drop (favoring your friend). If she argues that *any* political grouping inevitably seeks self-perpetuation even when claiming temporary aims, my credence rises toward 0.90.

  ### The Zero-Sum Premise on Attention

  **Yes, you are correct, and this is the linchpin.**

  You are not missing it; you have identified the engine. Weil's epistemology is built on the concept that attention is a finite, sacred resource. To attend to the group is to withdraw attention from the Good.

  She operates on a strict zero-sum model of spiritual energy. If I am listening to the "party line" (or the coalition consensus), I am not listening to reality. The group demands loyalty, and loyalty requires the suspension of critical judgment. Even for a day. Even for one bill. The moment I agree to vote based on the coalition's strategy rather than my individual perception of the truth, I have committed the sin she identifies. The permanence of the party just makes the debt compound; the temporary coalition incurs the debt immediately.

  Your friend is looking at the hardware; you are looking at the operating system. Weil cares about the OS.
