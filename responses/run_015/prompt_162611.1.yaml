  Subject: Re: The cosmology argument

  Hey, I know this has been bugging you for a week so I want to get this down while it is fresh. You are right to trust your intuition on this because the broken step is indeed number four, though your friend is also right that fixing it opens a can of worms that cosmologists are still struggling with. The core error in step four is the claim that the indexical information I see E carries no more weight than the existential claim someone sees E. In Bayesian confirmation theory, evidence is defined by how it updates your credence, and your credence is held by a specific agent at a specific location in logical space. If a theory predicts that a billion observers see red and only one observer sees blue, and you look up and see blue, that should count as evidence against the theory, even though the theory guarantees that someone sees blue. Step four flattens the distribution of observers into a binary existence claim, effectively ignoring the relative frequency of observations within the hypothesis. By rejecting step four, you preserve the likelihood principle in step one because you are no longer assigning probability one to the proposition I see E, but rather a probability proportional to the fraction of observers who see E.

  However, your friend's objection is the real sting in the tail because pointing out the error in step four forces you to adopt a Self-Sampling Assumption, which requires a measure over observers to calculate those fractions. Your friend is correct that this measure is not something you can directly check by looking, because any observation you make is already filtered through the fact that you are an observer making it. This is the infamous measure problem in cosmology. But admitting this uncertainty does not collapse science into impossibility, it just shifts the burden from proving a theory is true to proving a theory is typical for observers like us. When you assume you are a typical observer, you are not making a physical claim about the universe in the same way you claim gravity exists; you are adopting a methodological rule that is a precondition for doing empirical science at all. If you refuse to assume you are typical, then you cannot rule out the hypothesis that you are a brain in a vat or a Boltzmann brain, and if you cannot rule those out, you cannot confirm anything, which leads right back to your friend's step eight and the absurd conclusion that no knowledge is possible. So the cost of rejecting step four is accepting that our confirmation of cosmological theories is always conditional on a choice of measure, but that is a manageable cost compared to total skepticism.

  Regarding the look-elsewhere effect, your friend is drawing a useful analogy but conflating two different statistical problems. In particle physics, the look-elsewhere effect corrects for the fact that if you search enough bins of data, random noise will look like a signal in one of them. That is about multiple testing within a single dataset. The multiverse problem is about multiple observers across different domains of reality. The fix in particle physics is to penalize the significance of a finding based on the number of trials. The fix in cosmology is to weight the finding based on the number of observers. They are structurally similar in that both prevent you from treating a rare coincidence as a confirmation, but the cosmological version requires that measure over observers I mentioned earlier. Physicists deal with the look-elsewhere effect fine because the number of trials is finite and defined by the experimental setup. In cosmology, the number of observers might be infinite, which is why the measure problem is harder, but the principle of correction is the same. You do not ignore the data, you adjust the likelihood calculation to account for the selection effect.

  Finally, you asked if leaning on a typicality assumption is the same as the non-empirical arguments used to support string theory. I do not think they are the same kind of move. When string theorists argue for their theory based on mathematical elegance or the lack of alternatives, they are proposing a physical hypothesis without data. When cosmologists assume a measure over observers, they are proposing a rule of inference to make sense of the data they already have. One is a claim about the world, the other is a claim about how to link the world to our experience of it. It is closer to assuming the laws of logic are valid than it is to assuming a specific particle exists. You are entitled to this assumption because without it, the concept of evidence loses its meaning. If you cannot assume your observation is representative of some underlying frequency, then observation cannot constrain theory. So while your friend is right that the measure problem is unresolved and tricky, rejecting step four is the only way to avoid the conclusion that science is impossible. You keep the likelihood principle, you accept that probabilities are relative to observer counts, and you acknowledge that our confidence in multiverse theories will always be slightly more tentative than theories where the observer count is one, but that is a feature of the universe, not a bug in our reasoning.
