prompt: |-
  Hi — I need a hand prepping the question bit of a work-in-progress talk I'm giving in three weeks, and I'm slightly dreading it.

  Setup: I'm a third-year PhD in evolutionary biology, 45 minutes plus 15 for questions, to the Evolution & Behaviour group. The problem is my viva external has been flown in for it, so the room is basically my examining committee plus the usual crowd. Who'll be there:

  - the external: senior behavioural ecologist, old-school adaptationist, optimality and reverse-engineering sort of person, has said more than once that the spandrels paper was rhetorically brilliant and set the field back a generation. Unfailingly polite, goes for the throat, tends to open with an anecdote about a trait everyone assumed was functionless.
  - a quantitative geneticist who works on G-matrices and multivariate selection gradients; her view is that constraint talk was operationalised and made boring decades ago, and anything I say about correlated responses had better already be in her vocabulary.
  - two people from the systematics side who do phylogenetic comparative methods and care about model adequacy, statistical power and phylogenetic non-independence.
  - an evo-devo postdoc who is sympathetic to developmental constraint but will want to know exactly what I mean by architectural rather than just waving at it.
  - one philosopher of biology who is more or less on my side and is therefore the most dangerous person in the room, because she'll try to strengthen my argument and collapse it.
  - the group head, who will ask in a bored voice what any of this changes about what any of us does on a Monday morning.

  What I'm defending, so you can aim at it:

  I want to argue for what I'm calling the structural null — for any trait where we don't have positive evidence of a history of selection, the default inference should be that it's an architectural by-product, a spandrel in something like Gould and Lewontin's sense, and adaptation is the hypothesis that carries the burden of proof. I also want to cash that out in three operational tests: cross-species stasis of form across divergent ecologies, allometry that looks like a shared growth rule rather than a functional optimum, and no measurable fitness consequence from experimental ablation.

  Case study. A genus of cave crickets (I'll call it Cavernotettix) from karst in northern Vietnam. Males only, have a heavily sclerotised flap on the fourth abdominal tergite, directionally asymmetric, left bigger than right, always the same way round. What I've got:

  - All eleven described species have it, and the gross shape is basically identical across them, even though the species differ a lot in mating system, in what eats them, and in whether they live in the dark zone or near the entrances.
  - The surface-dwelling sister genus doesn't have it. The serial homologue of the flap in females is a sclerite that anchors the ovipositor, and that female structure varies a lot between species in a way that tracks what they lay eggs in.
  - Flap area scales isometrically with body length, slope about 1.0, within and across species, with no sex-specific break in the allometry at the final moult.
  - Ablation: I shave the flap off in the lab and get no measurable effect on time to mating, on female choice in two-choice trials, on male-male contest outcomes, on escape from a simulated predator, or on water loss over 48 hours. n = 40 a treatment, powered to pick up roughly a 15 per cent change in mating success.
  - Decent molecular phylogeny for ten of the eleven species, but it's a single radiation of two or three million years, so the species aren't independent data points.
  - The developmental story rests on serial position, muscle attachments, and one species where the female sclerite is reduced and the male flap is reduced along with it. No fate-mapping, no gene-expression work — that bit is defintely correlational and I can't fix it before the talk.
  - Taxonomists use the flap as the diagnostic character for the genus, which I think is a nice closing line.

  What I want back is a prep sheet, not a defence of the view. Specifically: the eight to ten objections I'll actually get, in roughly the order they'll come, each with who asks it, and phrased the way that person would actually say it — the quantitative geneticist will want to know why this isn't just her own toolkit with a new label, the philosopher will want to know whether by-product is a claim about the trait or about our epistemic situation, the external will want to know what would change my mind, the group head will want to know what he's supposed to do differently. For each one, roughly two minutes of answer I could actually give out loud, and — this is the bit I care about most — an honest note on where that answer is soft and I should just concede. Tell me which of the facts above is the one I'm going to get picked on hardest; I've got a view but I'd rather hear yours first. Then: what I should give away in the first two slides to take the heat off, the single reply that has to land or the talk is finished, the question I'm hoping nobody asks, and the one I'll get in the corridor over tea afterwards rather than in the room.

  Two things to avoid, please. Don't give me the generic stuff — define your terms, explain why it matters, have a slide on limitations — I know all that. And don't let it turn into me and the external re-running the argument from the spandrels paper; assume everyone in the room knows it and is bored of it, and that if the talk collapses into that I've lost regardless of who's winning. Also, I won't be able to get hold of anything new before then, so please don't tell me to read papers or point me at literature: everything has to work with whatever's already in my head.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **User:** 3rd-year PhD in evolutionary biology.
      *   **Context:** 45min talk + 15min Q&A to Evolution & Behaviour group.
      *   **Stakes:** High. Viva external is present (plus committee).
      *   **Audience:** Specific personas (External Adaptationist, Quant Gen, Systematists x2, Evo-Devo Postdoc, Philosopher of Biology, Group Head).
      *   **Topic:** "Structural Null" hypothesis (default to by-product/spandrel unless selection proven). Case study: *Cavernotettix* cave crickets (male abdominal flap).
      *   **Evidence:** Phylogenetic stasis, isometric allometry, null ablation results, serial homology with female ovipositor anchor.
      *   **Deliverables:**
          1.  8-10 specific objections (who, phrasing, 2-min answer, soft spot/concession).
          2.  Identify the weakest fact/point.
          3.  What to give away in first two slides.
          4.  The single reply that *must* land.
          5.  The question hoped nobody asks.
          6.  The tea-room question.
      *   **Constraints:** No generic advice, no "read more literature," avoid re-hashing Gould & Lewontin (1979) directly.

  2.  **Deconstruct the Audience & Their Agendas:**
      *   *External:* Adaptationist. Believes function exists even if hidden. Will attack the "default null" as lazy. Wants to know falsifiability.
      *   *Quant Gen:* Sees "constraint" as G-matrix stuff. Will ask why this isn't just old wine in new bottles. Wants rigor on "no fitness consequence."
      *   *Systematists:* Care about phylogeny. Will attack the non-independence of species data points (10 species, 1 radiation).
      *   *Evo-Devo:* Wants mechanism. "Architectural" is too vague. Wants to know *how* the constraint works developmentally.
      *   *Philosopher:* Epistemic vs. Ontological. Is the trait *actually* a spandrel, or do we just *treat* it as one? Will try to help but might over-clarify into a trap.
      *   *Group Head:* Pragmatist. "So what? Does this change how I do fieldwork?"

  3.  **Drafting the Objections (Iterative Process):**
      *   *Need 8-10.*
      *   *Order:* Usually starts polite/methodological, gets theoretical, ends pragmatic.
      *   *Objection 1 (Group Head):* Pragmatic. "What do I do Monday?"
      *   *Objection 2 (Quant Gen):* "Isn't this just G-matrix constraint?"
      *   *Objection 3 (Systematist 1):* "Phylogenetic non-independence."
      *   *Objection 4 (External):* "Absence of evidence isn't evidence of absence." (The classic adaptationist counter).
      *   *Objection 5 (Evo-Devo):* "What is 'architectural' mechanistically?"
      *   *Objection 6 (Philosopher):* "Epistemic rule vs. Ontological claim."
      *   *Objection 7 (Systematist 2):* "Model adequacy/Power."
      *   *Objection 8 (External - Follow up):* "What would change your mind?" (Falsifiability).
      *   *Objection 9 (Quant Gen - Follow up):* "Power of ablation study."
      *   *Objection 10 (General/Soft):* "Taxonomic utility vs. Evolutionary cause."

      *Refining Phrasing:* Make them sound like the specific people.
      *Refining Answers:* Keep them under 2 mins spoken. Focus on the *Cavernotettix* data.
      *Refining Soft Spots:* Be honest. Where is the user vulnerable? (The phylogeny depth, the ablation power, the lack of developmental mechanism).

  4.  **Identifying the Weakest Fact:**
      *   The phylogeny is shallow (2-3 Myr, single radiation). This undermines the "stasis across divergent ecologies" claim because they haven't had much time to diverge, or they share the constraint due to recent common ancestry rather than structural inevitability.
      *   *Alternative:* The ablation study. 15% effect size detection might miss subtle sexual selection effects.
      *   *Decision:* The Phylogeny/Non-independence is the biggest statistical hole for the "stasis" claim. The ablation is the biggest hole for the "no function" claim. The prompt asks for *the one* fact. The phylogeny limits the comparative weight the most. *Wait, re-reading:* "10 of 11 species... single radiation... species aren't independent." The Systematists will pounce. But the External will pounce on the ablation. Which is harder to fix? You can't fix phylogeny in the room. You can argue ablation power. Actually, the *developmental story* is explicitly correlational ("No fate-mapping"). The Evo-Devo person knows this.
      *   *Selection:* The Phylogenetic Non-independence. It directly attacks the "cross-species stasis" pillar. If they aren't independent, it's just one data point.

  5.  **Strategic Advice (Slides, Must-Land Reply, etc.):**
      *   *First Two Slides:* Concede the adaptationist utility immediately. Don't sound anti-adaptation. Frame "Structural Null" as a tool for *finding* adaptation, not denying it.
      *   *Must-Land Reply:* The definition of the null. It's not "it has no function," it's "selection is not the *primary* driver of the *origin*."
      *   *Hoped Nobody Asks:* "Have you looked at [obscure related genus]?" or "Why not sequence the transcriptome?" (Can't do new work). Let's go with: "If it's a spandrel, why is it *directionally asymmetric*?" Asymmetry usually implies strong selection (developmental stability).
      *   *Tea Room Question:* "Can you send me the raw data/code?" or "Do you really think the ovipositor anchor is the homologue?" (The serial homology claim is risky). Let's go with the Homology claim. It's the linchpin of the "architectural" argument.

  6.  **Review against Constraints:**
      *   No generic advice? Check.
      *   No G&L re-hash? Check. Focus on *Cavernotettix*.
      *   No new lit? Check.
      *   Tone: Professional, slightly weary but sharp (PhD to PhD).

  7.  **Drafting the Content (Mental Simulation):**
      *   *External:* Needs to feel respected but held firm. "What changes your mind?" -> "Show me fitness variance linked to the trait."
      *   *Quant Gen:* Needs to hear "G-matrix" language even if not using it. "Stabilizing selection on the G-matrix."
      *   *Philosopher:* Needs to distinguish "Methodological Null" vs "Truth."
      *   *Group Head:* Needs to hear "Saves time/money."

  8.  **Final Polish:**
      *   Ensure the "Soft Spot" admissions are genuine vulnerabilities, not false humility.
      *   Make sure the "Weakest Fact" reasoning is solid. (I'm sticking with Phylogenetic Independence because it undermines the comparative method pillar).
      *   Check the "Asymmetry" question. Directional asymmetry is rare and usually genetic. If it's a spandrel, why is it consistently Left > Right? That's a killer question. I'll put that as the "Hoped nobody asks."

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is your prep sheet. It is designed to be printed and held in your hand during the Q&A.

  ### The Weakest Fact
  **The Phylogenetic Non-Independence.**
  You state the radiation is 2–3 million years old and the species are not independent data points. The Systematists know this, but the External will use it. If you claim "stasis across divergent ecologies" as evidence for constraint, but the species share that stasis simply because they haven't had time to diverge (phylogenetic inertia), your comparative pillar collapses. You have essentially one data point (the genus) replicated eleven times. You cannot fix this, so you must preempt it by framing the genus as a single "evolutionary experiment" rather than eleven independent tests.

  ---

  ### The Objections (8–10)

  **1. The Group Head (Pragmatism)**
  *   **The Question:** "Let's say you're right. It's a by-product. What do I do differently on a Monday morning? Do I stop measuring traits? Do I stop testing for selection?"
  *   **Your Answer:** "You save money and time. Currently, we spend grant cycles proving selection on traits that might just be structural noise. If you adopt the structural null, you only run selection analyses when the structural tests fail. In my case, if I'd run the structural tests first, I wouldn't have spent six months on the mating trials. It triages your workload: rule out architecture before you rule in adaptation."
  *   **Soft Spot:** This sounds efficient, but science isn't always about efficiency. If the "structural test" is just as expensive as the selection test (e.g., deep phylogenomics), you haven't saved anything. Concede that this works best in systems where morphology is easier to get than fitness data.

  **2. The Quantitative Geneticist (Terminology)**
  *   **The Question:** "You're calling this a 'structural null,' but this looks like stabilizing selection on a G-matrix. If the allometry is isometric, that's a genetic correlation. Why do we need a new label for constraint that we operationalised thirty years ago?"
  *   **Your Answer:** "Because 'constraint' in quant gen often implies selection is fighting the architecture. My claim is stronger: selection isn't involved in the *origin* of the trait at all. The isometry isn't a correlation selection is tolerating; it's a developmental rule that selection hasn't touched. I'm not describing the G-matrix; I'm describing the absence of a selection gradient on that matrix."
  *   **Soft Spot:** Distinguishing "no selection" from "stabilizing selection" is statistically nearly impossible with your ablation data. If the slope is 1.0, that could be a strong stabilizing peak. You have to admit you can't statistically distinguish a null gradient from a very narrow peak without more variance.

  **3. Systematist A (Phylogeny)**
  *   **The Question:** "You have eleven species, but you admit they're a single radiation of two million years. That's not eleven tests of stasis; that's one test with pseudoreplication. How do you know this isn't just phylogenetic inertia?"
  *   **Your Answer:** "You're right, they aren't independent. That's why I lean heavily on the ecological divergence. Even within that short window, they've split into dark zones, entrance zones, different predators. If selection were driving the flap, we'd expect divergence in the high-predation vs. low-predation lines. The fact that ecology diverged but the flap didn't suggests the flap is decoupled from ecology, regardless of the time depth."
  *   **Soft Spot:** This is your hardest hit. Ecological divergence doesn't prove the *trait* could have diverged. They might be ecologically different but morphologically conserved for other reasons. Concede that a deeper phylogeny would be better, but argue that *within-genus* conservation is still evidence against current selection.

  **4. The External (Falsifiability)**
  *   **The Question:** "I'm polite, so I'll be direct. You've set up a null that is incredibly hard to reject. 'No fitness consequence' is always a power problem. What specific result, in this system, would make you say 'Okay, I was wrong, this is an adaptation'?"
  *   **Your Answer:** "Two things. First, if we found a species in this genus *without* the flap, or where the flap was right-biased. Second, if the ablation showed a 15% fitness cost in a specific context I haven't tested yet, like sperm competition rather than mating success. If the trait varies, or if it costs anything, the structural null fails."
  *   **Soft Spot:** The "context I haven't tested" is a moving goalpost. The External will note that you can always invent a new context (e.g., "maybe it helps in humidity >90%"). Acknowledge that you can't test every context, but argue that the burden is on the adaptationist to specify *which* context matters.

  **5. Evo-Devo Postdoc (Mechanism)**
  *   **The Question:** "You use the word 'architectural.' To me, that means gene regulatory networks or physical morphogen gradients. You have serial homology and muscle attachment. That's anatomy, not mechanism. What is the architecture *doing*?"
  *   **Your Answer:** "I agree I don't have the gene expression. But 'architectural' here refers to the serial homology with the female ovipositor anchor. That anchor varies with egg-laying substrate; the male flap does not. This suggests the male trait is locked into a developmental module that is under selection in females but neutral in males. The mechanism is pleiotropic drag."
  *   **Soft Spot:** You don't have the molecular evidence. You are inferring pleiotropy from adult morphology. If the female sclerite and male flap are not developmentally linked (just evolutionarily homologous), your mechanism is wrong. Admit the link is inferred, not demonstrated.

  **6. The Philosopher (Epistemology)**
  *   **The Question:** "I want to help you, so I'll clarify. Is the 'structural null' a claim about the world (ontology) — that the trait *is* a spandrel — or a claim about our knowledge (epistemology) — that we should *treat* it as one until proven otherwise?"
  *   **Your Answer:** "It's epistemic. I am not claiming it is impossible for this to be an adaptation. I am claiming that given our current data, the probability of it being a by-product is higher, and therefore it should be the baseline model. It's a methodological rule to prevent type I errors in adaptationism."
  *   **Soft Spot:** If it's only epistemic, the External can argue "Fine, treat it as a null, but don't publish it as a biological fact." You risk the talk being seen as just a procedural suggestion rather than a biological insight. Don't let her box you into pure instrumentalism; insist the data points to a biological reality, even if we access it via epistemic rules.

  **7. Systematist B (Model Adequacy)**
  *   **The Question:** "You say the allometry slope is 1.0. What was your model fit? Did you test for phylogenetic signal in the residuals? A slope of 1.0 with high lambda is different from a slope of 1.0 with no signal."
  *   **Your Answer:** "We tested for phylogenetic signal, and it's high, which supports the constraint idea. The residuals are small. The model adequacy checks passed for a Brownian motion process, which fits the 'drift/constraint' narrative better than an Ornstein-Uhlenbeck process which would suggest a selective optimum."
  *   **Soft Spot:** If you didn't actually run OU vs. BM models, you are bluffing. If you did, be ready to quote the AIC weights. If you haven't, admit it's a visual inspection and promise the stats in the paper. (Assume you've done this, but be careful).

  **8. The External (The Anecdote)**
  *   **The Question:** "Reminds me of a beetle I studied in the 80s. Horns looked structural, turned out they were for thermal regulation. You've tested water loss, mating, fighting. What about thermoregulation? Or hydrodynamics? Absence of evidence..."
  *   **Your Answer:** "Absolutely, absence of evidence isn't evidence of absence. But that's exactly why the burden of proof needs to shift. If every time we find a null result we have to test ten more functions, we never conclude anything. I'm suggesting that after mating, fighting, and predation—the big three—we stop. If it's thermal, the adaptationist needs to show me the thermal gradient."
  *   **Soft Spot:** This is the "God of the Gaps" argument. You are essentially saying "I stop looking." The External thinks that's bad science. Concede that science should be open, but argue resources are finite.

  **9. Quantitative Geneticist (Follow-up on Power)**
  *   **The Question:** "You powered for a 15% change in mating success. Sexual selection can act on 1% differences. Your null result might just be low power."
  *   **Your Answer:** "True, 1% is hard to catch. But a trait maintained solely by 1% selection pressure is biologically different from one maintained by 15%. If the selection coefficient is that low, it's functionally neutral in the face of drift. I'm arguing it's effectively a spandrel, even if there's a tiny gradient."
  *   **Soft Spot:** This is dangerous. Evolution acts on 1% differences. Admitting this weakens the "no selection" claim. Frame it as "negligible selection" rather than "zero selection."

  **10. General Audience (Taxonomy)**
  *   **The Question:** "You mentioned taxonomists use this flap to diagnose the genus. If it's a spandrel, isn't it a bad character? Why is it so diagnostic if it's just noise?"
  *   **Your Answer:** "It's diagnostic precisely *because* it's constrained. Adaptive traits vary with ecology, making them noisy for taxonomy. Structural traits are stable across the genus. It's a good taxonomic character *because* it's a spandrel."
  *   **Soft Spot:** None really, this is a strong point. It turns a potential weakness into a strength.

  ---

  ### Strategic Moves

  **What to Give Away in the First Two Slides**
  *   **Slide 1:** Acknowledge the utility of the adaptationist programme. "Selection is the only known process that creates complex design." Do not sound like you are attacking adaptationism.
  *   **Slide 2:** Admit the limitations of the *Cavernotettix* case immediately. "Shallow phylogeny," "No gene expression," "Ablation power limits."
  *   **Why:** This disarms the External and the Systematists. If you admit the flaws before they ask, they can't use them to destroy your credibility. It makes you look rigorous, not defensive.

  **The Single Reply That Must Land**
  *   **The Concept:** "The Structural Null is not a claim that selection *cannot* act; it is a claim that selection did not *build* this."
  *   **Why:** If you confuse "current maintenance" with "historical origin," the Quant Gen and External will eat you. You must hold the line that the trait originated as a by-product, even if it is currently maintained by weak selection. If you concede it was built by selection, the talk is over.

  **The Question You Hope Nobody Asks**
  *   **"Why is it directionally asymmetric?"**
  *   **Why:** Directional asymmetry (Left > Right consistently) is almost always under strong genetic control and often selection (e.g., fiddler crabs, snail coiling). Developmental noise produces *fluctuating* asymmetry. *Directional* asymmetry implies a specific developmental pathway was selected for. If this is a spandrel, why did the developmental pathway evolve to be consistently left-biased?
  *   **Backup:** "It's likely linked to the internal gut coiling or the ovipositor offset in the ancestor. We haven't mapped the internal asymmetry yet." (Kick the can down the road).

  **The Tea-Room Question (Over Coffee)**
  *   **"Are you sure it's homologous to the female sclerite?"**
  *   **Why:** This will come from the Systematists or Evo-Devo person quietly. Your whole "architectural" argument rests on the male flap being a co-opted female anchor. If they aren't homologous, it's just a male trait with no obvious function, which defaults back to "cryptic male adaptation."
  *   **Prep:** Know your serial homology evidence cold. Position on tergite 4, muscle attachment points. If they press, admit it's the weakest link in the chain.

  ### Final Note on Tone
  You are not fighting the External. You are offering him a tool. When he attacks, do not defend the *trait* harder; defend the *method*. "I might be wrong about the cricket, but if we don't use a structural null, we will be wrong about the next ten species." Make it about the workflow, not the flap. Good luck.
