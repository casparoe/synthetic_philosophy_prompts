  Give me the procedure as a sequence of questions to ask, in order, with what counts as a sufficient answer to each; the point where the procedure stops and returns a default; and the point where it must hand the decision to a human because the question is one of values rather than facts. Be honest about which steps are judgment calls dressed up as procedure. Then run the procedure on two concrete cases from our stack: (A) a payment saga in which passing the final settlement step makes the transfer irreversible and the loss is large, and (B) a batch ETL job in which passing the final transform step corrupts the output but the loss is moderate and re-running from scratch is cheap. For at least one of the two the procedure should land on a policy the team will not like; say why it lands there and what the procedure cannot do for us.

  Begin your response with the procedure itself, no preface, no restating of the question, and no preamble.
