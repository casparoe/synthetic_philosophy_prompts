  ### MEMORANDUM

  **TO:** Committee on Student Success Analytics
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Early-Alert Vendor Contract Renewal

  **Recommendation:** Let the contract lapse.

  We are asked to renew a $190,000 annual contract for a predictive model that flags first-year students at risk of attrition. While the vendor reports an AUC of 0.83 and a precision of 40% across the 2021–2023 cohorts, I recommend we allow the contract to lapse. This decision is not a rejection of analytics, but a commitment to scientific rigor and fiscal responsibility. The current evidence base is insufficient to justify the expenditure, particularly given the opportunity cost of two full-time success coaches.

  The primary scientific defect is confounding. In the pilot, every flagged student received a coaching intervention, while unflagged students received none. Consequently, the model's "accuracy" measures a combination of risk prediction and responsiveness to coaching. We cannot know if a flagged student who persisted was correctly identified as at-risk and saved, or incorrectly flagged and would have persisted anyway. A model that identifies students who respond well to phone calls is not the same as a model that identifies students likely to drop out. Without a control group where flagged students are randomized to receive no contact, we cannot estimate the model's lift. We are paying for correlation, not causation.

  Second, the population has shifted structurally. The 2024 cohort is the first admitted under test-optional policies, with doubled online offerings and a tripled bridge program. The vendor's model was trained on data where standardized test scores were a stable feature. To project performance from the 2021–2023 distribution to the 2024 distribution is an inductive leap that ignores the change in the data-generating process. The vendor's claim that the model "learns from the data itself" without assumptions is misleading; all learning algorithms embed biases about which features matter. When the meaning of those features changes (e.g., missing test scores), the bias may no longer align with reality. The five-fold cross-validation used in the pilot pooled cohorts, masking this temporal drift. We require a temporal hold-out validation, training on past cohorts and scoring on the 2024 cohort before intervention, to assess stability.

  Third, the cost is substantial. At $190,000, this contract equals the salary and benefits of two success coaches. If the model's precision is truly 40%, we are spending significant resources contacting students who might not need it. If we lapse the contract, we can redirect those funds to expand human capacity. Human judgment is imperfect, but it is adaptable to the new admissions landscape in ways a static model is not.

  If we are to revisit vendor contracts in the future, we must demand a rigorous design. We should require a staggered rollout where outreach is randomized among flagged students to measure true lift. We need pre-registered metrics beyond AUC, specifically precision and recall at the operating threshold, audited across subgroups (test-optional, first-generation, online) to ensure equity. We should treat counselors' unaided judgment as a competing predictor to be scored alongside the algorithm, not as a neutral baseline. Finally, any new contract must include a sunset date of twelve months, contingent on meeting these validation metrics.

  I recognize this recommendation places a burden on our staff. The strongest argument for renewing the contract is that epistemic humility cuts both ways. The symmetry behind the no-free-lunch results undercuts the in-house model and the counselors' intuitions just as much as the vendor's black box. We must act either way, and doing nothing is itself a policy with its own implicit predictions about who will succeed. A cheap and non-coercive phone call might be worth making even on a low-precision flag if the cost of failure is high for the student. Furthermore, deliberately withholding outreach from a control group to get clean measurements raises a genuine problem of care; we may be ethically reluctant to withhold support even to improve our knowledge. However, continuing to pay for unvalidated predictions under the guise of science is also an ethical failure. We should lapse this contract, invest in human capacity, and design a pilot that actually tests what we claim to know.
