          *   Right to Disconnect (email policies).
          *   Advisor training (stop praising burnout in letters).
          *   Transparency (what does a "successful" week look like?).
      *   *The "Leisure" Framework:* Argue for leisure as a *positive entitlement* (institutional guarantee of safety to rest).

  6.  **Refining the Tone:**
