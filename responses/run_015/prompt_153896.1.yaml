answer: |-
  This is a fantastic prompt. You have identified one of the central tensions in modern political philosophy and family law without even realizing it. You are asking about the *justification* of an institution: not just how it works, but *why* it exists in its current form and whether that reason still holds up.

  Per your request, I am going to start by showing you my "scratchpad"—the brainstorming phase where I break down the variables you mentioned. Then, I will synthesize that into a structured analysis that you can use for your paper.

  ### Part 1: Brainstorming & Deconstruction

  Before building an argument, I need to isolate the specific features of marriage law you pointed out and ask "Why?" for each one.

  *   **Feature 1: The Number Two (Dyadic)**
      *   *Why two?* Historically: Gender complementarity (one man, one woman). Currently: Romantic exclusivity.
      *   *Tension:* If the goal is "care," three people can care for each other better than two (more income, more doctors visits). If the goal is "romance," some people love more than one person.
      *   *Institutional reason:* Two is easy to administer. Three creates complex inheritance/tax triangles.
  *   **Feature 2: The Bundle (All-or-Nothing)**
      *   *Why bundle tax, medical, and inheritance?* Efficiency. It's easier for the state to have one "Married" switch than to check three different forms for every citizen.
      *   *Tension:* I might want medical rights for my best friend but tax filing for myself. The law says "No, take both or neither."
      *   *Institutional reason:* Bundling raises the "exit cost." If it's hard to undo, people might try harder to stay together. Stability is a state interest.
  *   **Feature 3: The Ceremony/Officiant**
      *   *Why a wedding?* Public signaling. It tells the community "These two are a unit."
      *   *Tension:* A courthouse signature is legally stronger than a party, but the law often requires an officiant to witness the intent.
      *   *Institutional reason:* Prevents fraud. It ensures both parties knowingly enter the status.
  *   **Feature 4: Romantic/Sexual Presupposition**
      *   *Why not the aunt/niece?* Because the state views marriage as distinct from "kinship" or "friendship."
      *   *Tension:* An elderly aunt and niece might be more economically dependent on each other than a newlywed couple.
      *   *Institutional reason:* The state is trying to encourage the formation of *new* households, not just recognize existing biological ones.

  **Initial Hypothesis:** The current system isn't actually about "care." If it were about care, it would allow aunts and trios. It is about **regulating romantic intimacy** because the state believes romantic couples are the primary engine of social stability (and child-rearing), even if they don't have kids.

  ***

  ### Part 2: The Philosophical Analysis

  Here is the reconstruction of the implicit theory, the critique of its coherence, and the roadmap for the alternative model you described.

  #### 1. The Implicit Theory: "The Romantic-Stability Model"

  If we look at current laws (even in places with same-sex marriage), the state is operating on a specific philosophical theory of what marriage is. We can call this the **Romantic-Stability Model**. It relies on three main pillars:

  1.  **The Primacy of the Dyad:** The state assumes that the most important social unit is a pair of adults. This is a holdover from the idea that a "household" is fundamentally a coupling of two lives. Even though gender is no longer a requirement, the *number* two remains sacred. This suggests the law values **exclusivity**. The state wants you to pick *one* person to be your primary legal next-of-kin.
  2.  **The Bundled Status:** Marriage is treated as a "status" rather than a "contract." In a normal contract, you negotiate terms. In marriage, the state gives you a pre-packaged deal (tax, medical, immigration, inheritance). This presupposes that the state knows better than you what rights you need. It implies that these rights are inseparable from the relationship itself.
  3.  **The Public-Private Divide:** By requiring an officiant and a license, the state draws a line between "private friendships" and "public marriages." The theory here is that romantic relationships are volatile and need public scaffolding to survive, whereas friendships or kinship ties (like you and your aunt) are assumed to be stable enough without state intervention, or private enough that the state doesn't need to track them.

  **In short:** The current law presupposes that marriage is not just about *care*; it is about **channeling romantic sexuality into stable, exclusive households** that the state can easily count and tax.

  #### 2. Is This Coherent? (The Contradiction)

  You asked if this theory holds together. As an institutional analyst, I would argue it is currently **incoherent**. It is suffering from a "justification lag."

  *   **The "Care" Contradiction:** If the state's interest is truly "stabilizing care networks" (ensuring people are looked after when sick or old), the current system fails. By excluding aunts, nieces, or best friends, the state admits that *romance* matters more than *care*. But since the state no longer requires couples to have children (or even be different genders), the "romance" justification is purely symbolic. The law is protecting a *feeling* (romantic love) rather than a *function* (economic and medical support).
  *   **The "Bundle" Contradiction:** The bundled rights create inefficiency. For example, hospital visitation is about *trust*, but tax filing is about *economics*. A couple might be economically independent but deeply trusted medically. By bundling them, the law forces people into a "one size fits all" box. This creates a contradiction: The law claims to support families, but it denies support to families that don't look like the traditional romantic couple.
  *   **The "Two-Person" Contradiction:** If the goal is economic stability, a trio (a "throuple") is often more financially stable than a pair (three incomes vs. two). By arbitrarily limiting the number to two, the state is prioritizing a specific *social norm* over the actual *economic goal* of stability.

  **Verdict:** The current system is coherent only if you believe the state has a right to privilege romantic love above all other forms of human attachment. If you believe the state's job is simply to ensure citizens are cared for, the current system is contradictory and exclusionary.

  #### 3. The Alternative: "Care-Network Modularization"

  You mentioned "care-network modularization." In philosophy, this is often linked to the idea of **Minimal Marriage** or **Contractualism**. If we replaced the Romantic-Stability Model with a model where marriage is just a customizable contract for care, here is exactly what would have to change in the law.

  **A. Unbundling the Rights (The "Menu" Approach)**
  Currently, marriage is a "combo meal." You get the burger, fries, and drink together. The new model would be "à la carte."
  *   **Legal Change:** The government would create separate legal instruments for specific rights.
      *   *Instrument A:* **Medical Proxy.** (Can be granted to anyone: friend, sibling, partner).
      *   *Instrument B:* **Tax Unit.** (Based on economic dependency, not romance. If you share 50% of expenses with a roommate, you can file jointly).
      *   *Instrument C:* **Inheritance Default.** (Automatically passes to designated "next of kin," who can be chosen by the individual, not defined by marriage).
  *   **Philosophical Shift:** This shifts the power from the *State* (deciding what a family is) to the *Individual* (deciding who their support network is).

  **B. Removing the Numerical Limit (The "n-Person" Contract)**
  *   **Legal Change:** Contracts would allow for $n$-number of participants. A "household contract" could be signed by three roommates, a polyamorous trio, or a single mother and her sister.
  *   **Institutional Challenge:** This is administratively hard. If three people marry and one leaves, how are assets divided? The law would need to move from "community property" (everything is shared) to "proportional contribution" (you own what you put in, unless specified otherwise).
  *   **Philosophical Shift:** This acknowledges that **care is not scarce.** Loving one person doesn't mean you can't legally support another. It rejects the idea that exclusivity is necessary for legal commitment.

  **C. Decoupling Ceremony from Status (The "Filing" Approach)**
  *   **Legal Change:** No more officiants or ceremonies required for legal rights. Rights would be activated by filing a form at a courthouse, similar to forming an LLC (Limited Liability Company).
  *   **Philosophical Shift:** This treats marriage as a **civil contract** rather than a **sacred status.** It admits that the "wedding" is for the community/religion, but the "license" is for the government. It removes the state from the business of judging whether your commitment is "solemn" enough.

  #### 4. Conclusion for Your Paper

  To wrap this up for your essay: The current marriage system is a historical artifact. It was built for a world where gender roles were rigid, women were economically dependent on men, and the church and state were closely linked.

  Now that we accept same-sex marriage, we have removed the *gender* requirement, but we kept the *structure*. Your intuition is correct: if the goal is truly "care," the current two-person, bundled, romantic system is inefficient and unfair.

  Moving to a **Care-Network Modularization** model would require the law to stop asking "Are these people in love?" and start asking "Are these people economically and medically interdependent?" It would transform marriage from a **status of privilege** (reserved for romantic couples) into a **tool of citizenship** (available to any adults who wish to organize their care).

  ### Advice for Writing
  *   **Don't get bogged down in "Relationship Anarchy."** That term can sound a bit chaotic to a conservative reader. Stick to "Care-Networks" or "Contractual Family Law." It sounds more institutional and serious.
  *   **Use the "Bundle" analogy.** It's very clear. Explaining that marriage is like a "pre-set cable package" when people only want "streaming à la carte" is a strong metaphor for your paper.
  *   **Focus on the "Why."** Keep asking: "If the state wants X, why does the law do Y?" That is the heart of philosophical analysis.

  You have a really strong grasp of the material already. Trust your instincts on the contradictions you found—they are real, and philosophers are still arguing about them today. Good luck with the paper!
