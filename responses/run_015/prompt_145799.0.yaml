answer: |-
  The archaeological revisionism surrounding societal collapse—championed by scholars like Patricia McAnany and Norman Yoffee—argues that "collapse" is a pejorative myth imposed by outsiders observing political fragmentation. In this view, the Classic Maya did not vanish; they dispersed and reorganized. Easter Islander society did not die; it contracted and adapted to lower energy throughput. The social substrate thins, but the human capacity for culture persists. Reading Cormac McCarthy's *The Road* through this lens initially suggests the father and son are the ultimate example of substrate thinning: a society of two maintaining ritual, ethics, and language despite the absence of a state. However, a rigorous philosophical engagement reveals that the novel does not merely illustrate this framework; it fundamentally resists it by shifting the stakes from sociopolitical reorganization to ontological erasure.

  In the revisionist collapse model, culture survives because the biosphere remains viable. People move, change crops, or alter governance, but the earth still yields energy. McCarthy's apocalypse removes this precondition. The ash-covered world of *The Road* is not a low-energy environment suitable for adaptation; it is a dead ecosystem. Consequently, the father and son are not a "society" in the archaeological sense, because a society requires the possibility of reproduction and expansion, however latent. They are a memorial society, performing the rituals of humanity (checking the cart, sharing cans of food, "carrying the fire") without the substrate to sustain them. The revisionist model posits that collapse is a transition; McCarthy posits it as an ending. The boy is not the seed of a new organization but the final witness of the old one.

  The cannibals present the sterner test for the "no real collapse" theory. In archaeological records, increased violence and even cannibalism during resource stress are often read as desperate adaptations within a surviving normative framework (e.g., ritual sacrifice or survival strategy). In *The Road*, the cannibals represent something more radical: the complete dissolution of the human symbolic order. They are not merely violent due to low energy; they have industrialized predation, keeping humans as livestock. This is not a transformation of society but the inversion of the human subject into object. If the revisionist collapse theory argues that norms change form, McCarthy suggests that below a certain threshold of scarcity, norms do not change—they vanish. The cannibals prove that the "social" is not an inevitable emergent property of human grouping but a fragile construct dependent on material surplus.

  This is where the book resists the framework most aggressively. The archaeological perspective is ultimately optimistic, grounded in the continuity of life on earth. It assumes that because humans are adaptable, "collapse" is always a misnomer for "change." *The Road* challenges this anthropocentric resilience. It argues that when the material basis for symbol-making is destroyed (no books, no tools, no future), the "social" cannot persist even as memory. The father's insistence on morality is portrayed not as a successful adaptation, but as a defiant hallucination against entropy. The novel suggests that there is a point where thinning becomes snapping, where the substrate is not just stretched but incinerated.

  Verdict: McCarthy rejects the archaeological consolation of continuity by depicting an ecological extinction that renders social transformation impossible.
