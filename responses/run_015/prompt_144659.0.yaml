  I'll introduce the causal invariance condition. I'll explain the difference between outcome and process. I'll use the analogy of a billiard ball. If I hit a ball, it moves. That's intended. If hitting that ball causes a chain reaction that breaks a window, did I break the window? State distance says yes (window state changed). Causal invariance asks: did I change the window's fragility? No. Did I change the ball's trajectory? Yes.
  This distinction matters for responsibility.
