  **6. Anticipated Failure Modes**

  I need to be honest about where this might fail. It's important for the proposal to show I've thought about the risks.

  **Failure Mode 1: Computational Intractability**
  Calculating causal invariance might be too hard. To know if I changed the transition dynamics of a variable, I need to model those dynamics. If the world is complex, modeling every unintended variable is impossible. State distance is cheap (just compare vectors). Causal modeling is expensive. If the metric is too computationally heavy, it's not practical for real agents.
  *Mitigation:* I'll acknowledge this in the paper. I'm not proposing this for production AI today, but as a theoretical clarification. Also, in toy environments, it's tractable.

  **Failure Mode 2: The "No Action" Problem**
  If the condition is too strict, the agent might never act. Every action changes *something*. Walking changes air pressure. Breathing changes CO2 levels. If "changing transition dynamics" includes these micro-effects, the agent will be paralyzed.
  *Mitigation:* I'll need to define a threshold or a granularity. We only care about macroscopic causal mechanisms. But defining "macroscopic" is again a value judgment. This supports my thesis that values are unavoidable. I'll use this failure to strengthen my argument.

  **Failure Mode 3: Collapsing into State Distance**
  It might turn out that measuring change in dynamics is mathematically equivalent to measuring change in state distribution over time. If $P(X_{t+1}|X_t)$ changes, then the distribution of states changes. So maybe causal invariance is just state distance in disguise.
  *Mitigation:* I'll try to construct a case where dynamics change but state distance is low, or vice versa. For example, a hidden switch that doesn't change the current state but changes future possibilities. State distance might miss this if it only looks at the current snapshot. Causal invariance should catch it. If I can show this divergence, then the methods are distinct.

  **Failure Mode 4: Still Smuggling Values**
  This is the most likely failure. I suspect I will find that defining the "Unintended Set" requires knowing what humans value. If I don't know the user cares about the vase, I won't put it in the model, or I won't care if its dynamics change.
  *Mitigation:* If this happens, I will pivot the paper. Instead of "Causal Invariance solves the value problem," the paper becomes "Causal Invariance reveals exactly where the value problem lies." That's still a valuable contribution. It clarifies the bottleneck.

