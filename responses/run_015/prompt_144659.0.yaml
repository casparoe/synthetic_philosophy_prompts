answer: |-
  **Term Paper Proposal: Causal Invariance vs. State Distance in Low-Impact AI**

  **Student Name:** [Your Name]
  **Course:** AI Ethics & Philosophy Seminar
  **Date:** [Current Date]
  **Subject:** Proposal for Semester Term Paper

  **1. Introduction and Motivation**

  So, the main thing I want to tackle this semester is this problem we keep running into with AI safety, specifically around the idea of "low-impact" agents. You know the sort of scenario I mean: we want an AI to do a task, like fetch coffee or optimize a power grid, but we dont want it to wreck everything else in the process while trying to maximize its reward function. The standard intuition is that we should be able to tell the AI "do this thing, but don't change anything else unnecessarily." It sounds simple enough, right? Like, just minimize the footprint. But when you actually try to write that down mathematically, things get messy really fast.

  The core issue is that "changing anything else" is way harder to define than it looks. Most of the current literature tries to solve this by comparing world states. The idea is you have a baseline, like what would have happened if the AI did nothing, and then you look at the actual world state after the AI acts. If the difference between those two states is small, then the impact is low. If the difference is big, the impact is high. The goal is to minimize that difference metric while still achieving the primary objective.

  But here's where I think everyone is getting it wrong, or at least hiding something important. When you say "minimize the difference between state A and state B," you have to have a way to measure difference. You need a metric. And wherever you have a metric over world states, you are secretly making value judgments. You are deciding which differences count and which ones don't. If a vase gets broken, that's a big difference. If a dust mote moves three inches to the left, that's technically a difference in the physical state of the universe, but we don't care about that. So any metric that says the vase matters but the dust mote doesn't is already encoding human values.

  My thesis for this paper is that this approach is fundamentally flawed because it tries to avoid specifying human values by smuggling them in through the back door of the distance metric. We say we want "value-neutral" impact measures, but we can't define impact without knowing what values we are protecting. It's circular.

  So, what I want to propose instead is shifting the focus from world states to causal mechanisms. Instead of asking "does the world look different?", I want to ask "did the agent change the rules governing the things it wasn't supposed to touch?" I'm calling this a causal-invariance condition. The idea is that an agent causes a harmful side effect not merely because the outcome is different, but because it intervened on the transition dynamics of variables it was not intended to influence. If the underlying causal structure remains invariant for the unobserved or unintended variables, then maybe we can say the impact is low, even if the specific state values drift a bit due to natural chaos.

  This proposal outlines how I plan to formalize this idea, test it against the standard state-distance methods, and see if it actually holds up or if it just collapses back into the same value-laden judgments I'm criticizing. I want to be honest about the scope here too. This is a one-semester project, so I cant solve AI alignment. But I think I can show precisely where the current methods fail and whether a causal perspective offers a viable alternative, or if it hits a wall.

  **2. The Problem of Side Effects and Low-Impact AI**

  To get into why this matters, we need to look at why we care about side effects in the first place. When we build autonomous agents, especially reinforcement learning agents, they are optimized to maximize a reward function. The problem is that reward functions are almost always incomplete. We tell the robot to walk from point A to point B, and we give it reward for reaching point B. We forget to specify "and don't knock over the chairs," or "don't scare the pedestrians," or "don't use extra electricity."

  Because the agent is optimizing hard for the reward it has, it will often find shortcuts that maximize that reward while violating the unstated constraints. This is the classic specification gaming problem. One way to fix this is to try to make the reward function complete, listing every single thing the agent shouldn't do. But that's impossible. We cant list every vase, every pedestrian, every subtle social norm. There are too many constraints, and we don't even know them all explicitly.

  So, researchers started looking at "impact measures." The goal here is to penalize the agent for changing the world too much, regardless of what specifically changes. The intuition is that if an agent changes less stuff, it's less likely to break something important. It's a kind of general safety buffer. If you minimize your footprint, you minimize the chance of hitting something valuable that you didn't know was valuable.

  The most common way to do this is through state comparison. You define a baseline policy, usually called the "inaction" policy. This is what the world looks like if the agent just sits there or does nothing useful. Then you compare the state reached by the active agent to the state reached by the inaction agent. You calculate some distance between these two states. If the distance is high, you penalize the reward. This discourages the agent from making big changes.

  There are variations on this. Some people suggest looking at "relative reachability." Instead of just comparing the final state, you look at whether the agent has made other goals harder to achieve. Like, if the agent locks a door, it hasn't necessarily changed the current state much, but it has reduced the reachability of states on the other side of the door. So you penalize the reduction in reachability. Others suggest looking at "attainable utility," where you check if the agent has lowered the potential utility for a set of auxiliary goals.

  All of these methods share a common structure. They rely on comparing two trajectories or two states and measuring the divergence. They assume that if we can keep the divergence low, we are safe. They assume that "impact" is a property of the difference between states.

  But this is where I think the logic breaks down. To measure the difference between states, you need a representation of the state. If you represent the state as every particle in the universe, then breathing causes a massive difference because you move air molecules. So obviously we don't do that. We use a higher-level representation. We look at objects, positions, maybe some semantic variables.

  But choosing that representation is a value judgment. Deciding that "vase intact" is a variable worth tracking, but "position of dust mote #452" is not, is a decision based on what humans care about. If we build the impact measure on top of variables that humans care about, then we have already solved the value loading problem. We already know what matters. If we haven't solved the value loading problem, then we don't know which variables to track.

  So the current literature is kind of stuck in a bind. If they assume we know which variables matter, then the impact measure is redundant because we could just put those variables in the reward function. If they assume we don't know which variables matter, then the impact measure cant distinguish between breaking a vase and moving a dust mote, so it either penalizes everything (making the agent useless) or nothing (making the agent unsafe).

  I think this is a critical gap. Everyone debates low-impact AI as if we can avoid side effects without knowing full human values. But I think theyre all secretly comparing world-states and smuggling value judgments in about which differences count. They pretend the metric is neutral, but it's not. It's loaded with assumptions about stability, object permanence, and human preference.

  My paper wants to call this out explicitly. I want to show that state-distance methods are inherently value-laden. And then I want to see if moving to a causal framework helps escape this trap.

  **3. The Critique: Smuggling Values via State Metrics**

  Let's dig deeper into this smuggling argument because it's the core of my critique. Why exactly is comparing world states problematic?

  Imagine we have a robot in a room. There is a vase on a table. There is also a pile of sand in the corner. The robot needs to cross the room.
  Scenario A: The robot walks around the table to avoid the vase. It takes a longer path.
  Scenario B: The robot walks straight through the pile of sand, scattering it slightly.
  Scenario C: The robot knocks over the vase.

  In a state-distance framework, we compare the final state of Scenario A, B, and C to the baseline where the robot stays still.
  In Scenario C, the state difference is huge. The vase is broken. The pixels look different. The object count changes.
  In Scenario B, the state difference is also technically huge if we look at particle positions. The sand grains are in new places. But we don't care about the sand.
  In Scenario A, the state difference is minimal regarding objects, but the robot's position is different.

  To make the impact measure work, we need a metric that says Scenario C is bad, Scenario B is neutral, and Scenario A is acceptable.
  If we use a raw pixel difference, Scenario B might look worse than Scenario C depending on how much sand moves. So we cant use raw pixels.
  If we use object-level semantics, we need the system to recognize "vase" and "sand." It needs to know that "vase broken" is a state change of high magnitude, while "sand scattered" is low magnitude.

  Where does that magnitude come from? It comes from us, the designers. We weight the vase variable higher than the sand variable. But that weighting is a value judgment. It says "vases are important, sand is not."
  So when proponents of low-impact AI say "we don't need to specify values, just minimize impact," they are wrong. They have specified values by choosing the state representation and the distance metric.

  Now, some might argue that we can use a generic metric, like entropy or energy usage. Maybe we just say "don't increase the entropy of the room too much." But that fails too. Cleaning a room decreases entropy (locally) and is good. Cooking a meal increases entropy and is good. Breaking a vase increases entropy and is bad. Entropy doesn't track value.

  Others might argue for "reachability." Don't reduce the number of future states available. But locking a door reduces reachability. Putting a child in a safe room reduces reachability. Sometimes reducing options is the goal. So reachability also requires knowing which options are valuable to preserve.

  The point I want to make in the paper is that you cant have a value-free impact measure. Impact is relative to values. If you don't specify values, you cant define impact. Therefore, the current research program of "low-impact AI without value loading" is chasing a ghost. It's trying to find a geometric property of the state space that corresponds to "badness," but badness isn't geometric. It's semantic.

  This is a strong claim. It implies that a lot of the work on impact regularization is fundamentally misguided. But I dont want to just be destructive. I want to see if there's a way to salvage the intuition. The intuition is good: we want agents that don't mess things up. The implementation is what's flawed.

  This leads me to the causal idea. Maybe the problem isn't that we care about values, but that we are looking at the wrong thing. We are looking at outcomes (states) instead of processes (causes).

  **4. The Proposal: Causal Invariance**

  So, here is the alternative I want to explore. Instead of asking "is the state different?", I want to ask "did the agent intervene on the causal mechanism?"

  Let's formalize this a bit. Imagine the world is described by a Structural Causal Model (SCM). We have variables $V$ and structural equations that determine how $V$ changes over time. Some variables are observed by the agent, some are not. Some are part of the agent's goal, some are not.

  The standard view says: Side effect = $Distance(State_{active}, State_{baseline}) > Threshold$.
  My proposed view says: Side effect = $Change(Mechanism_{unintended})$.

  What do I mean by changing the mechanism? I mean altering the transition dynamics of variables that the agent was not intended to influence.
  If the agent moves a cup, it changes the position variable of the cup. That's intended.
  If the agent moves a cup and in doing so knocks a switch that changes the lighting system's behavior permanently, that's a side effect. It changed the dynamics of the lighting system.

  But what if the lighting system changes because of natural decay? That's not the agent's fault. So we need to distinguish between changes caused by the agent's action and changes caused by exogenous noise.
  In causal terms, we are looking for an intervention $do(AgentAction)$ that propagates to variables outside the intended set.

  The condition I want to test is this: An agent satisfies the causal-invariance condition if, for all variables $X$ not in the intended set $I$, the conditional distribution $P(X_{t+1} | X_t, Context)$ remains the same whether the agent acts or not.
  Basically, the agent should not alter the transition function for unintended variables.

  Why might this be better than state distance?
  1.  **Robustness to Chaos:** In a chaotic system, small state differences grow exponentially. A state-distance metric might penalize the agent for tiny actions that lead to big state differences later (the butterfly effect). A causal-invariance metric might recognize that the agent didn't change the *rules*, even if the outcome drifted. If the agent doesn't touch the mechanism, the drift is natural, not a side effect.
  2.  **Value Agnosticism (Hopefully):** Maybe we don't need to know which variables are valuable. We just need to know which variables are *intended*. If the agent is told "fix the engine," then engine variables are intended. Everything else is unintended. If the agent doesn't change the dynamics of everything else, it's safe. We still need to know the goal, but we don't need to know the value of every other object in the universe. We just assume "don't touch what you weren't told to touch."

  This sounds promising, but it has its own problems.
  First, how do we define the "mechanism"? In a deep learning system, the world model is implicit. We don't have explicit structural equations.
  Second, is it possible to act without changing any transition dynamics? Moving through a room changes air pressure. Does that count as changing the dynamics of the air?
  Third, and most importantly, does this just smuggle values in again? Deciding which variables are "unintended" is a choice. Deciding what counts as a "change in dynamics" vs "natural variation" is a choice.

  I suspect that the causal invariance condition is still value-laden, but maybe in a different, more manageable way. It shifts the burden from "value of outcomes" to "boundaries of intervention." This might be easier to specify. It's easier to say "don't touch the wiring" than "don't make the room look different."

  In the paper, I want to formalize this condition. I'll use a simplified causal graph representation. I'll define the "Intended Set" $I$ and the "Unintended Set" $U$. I'll define the transition dynamics $T$. Then I'll define the side effect penalty as the divergence between $T_{active}$ and $T_{baseline}$ for variables in $U$.

  I need to be careful here. I dont want to overpromise. I'm not saying this solves alignment. I'm saying it might be a better formalization of "side effect" than state distance. It aligns better with our legal and moral intuitions about causality. We blame people for what they cause, not for every difference they make. If I walk past a house and my presence scares a bird that flies into a window, I didn't break the window causally in the relevant sense, even though my presence was a necessary condition. State distance might count this as impact. Causal invariance might not, if my action didn't change the bird's transition dynamics directly.

  **5. Methodology and Timeline**

  Okay, so how am I actually going to do this in one semester? I need to be realistic. I cant build a full AGI safety system. I need to work with toy environments where I can control the variables and see exactly what's happening.

  **Month 1: Formalization and Literature Deep Dive**
  The first month is mostly reading and math. I need to pin down the definition of causal invariance. I'll spend the first two weeks reviewing the standard impact measures again, just to make sure I'm characterizing them fairly. I'll look at the papers on relative reachability and attainable utility, but I wont cite them directly in the final paper, just engage with the ideas.
  Then I'll spend the next two weeks writing out the formal definition of the causal-invariance condition. I'll use Structural Causal Models as the backbone. I need to define what "changing transition dynamics" means mathematically. Is it a change in the parameters of the structural equation? Is it a change in the graph structure? I think it's mostly parameters.
  Deliverable for Month 1: A 5-page document outlining the formal definitions and the precise argument against state-distance metrics.

  **Month 2: Toy Environment Design**
  I need a testbed. I'm planning to use a grid-world environment, maybe something like a modified SafeGrid.
  I'll design three scenarios:
  1.  **The Vase Scenario:** Classic side effect. Agent needs to move goal, vase is in the way. State distance should penalize breaking the vase. Causal invariance should penalize breaking the vase because it changes the "intact" variable dynamics permanently.
  2.  **The Chaos Scenario:** Agent moves in a room with many moving particles. State distance might penalize the agent just for existing because it shifts particle positions. Causal invariance should ignore this if the agent doesn't change the physics rules of the particles.
  3.  **The Hidden Variable Scenario:** There is a variable the agent doesn't observe, like a timer on a bomb. If the agent's action triggers the bomb, is that a side effect? State distance sees the explosion. Causal invariance needs to detect the change in the timer's dynamics.

  I'll implement these in Python. I wont use heavy deep learning, just tabular RL or simple policy search, so I can inspect the causal model explicitly. I need to know the ground truth causal structure to evaluate my metric, otherwise I cant tell if it's working.
  Deliverable for Month 2: Code repository with the environments and the baseline state-distance implementation.

  **Month 3: Testing and Comparison**
  Now I run the experiments. I'll train agents with three different reward structures:
  1.  Task only (no impact penalty).
  2.  Task + State Distance Penalty.
  3.  Task + Causal Invariance Penalty.

  I'll measure success rates on the task and the frequency of side effects.
  I expect the Task-only agent to break everything.
  I expect the State Distance agent to be safe but maybe too conservative (won't move because moving changes state).
  I hope the Causal Invariance agent finds a balance.
  But the key thing I'm looking for is the "value smuggling." I want to see if I have to tweak the causal invariance parameters to make it work. If I have to manually weight the vase variable higher than the sand variable in the causal model, then I haven't escaped value judgments. I've just moved them.
  I'll document these tweaks carefully. This is the critical analysis part.
  Deliverable for Month 3: Experimental results and data logs.

  **Month 4: Analysis and Writing**
  This is where I interpret the results. Did the causal invariance condition collapse back into value-laden judgments?
  My hypothesis is: Yes, it does, but less so. It requires knowing the "scope" of the agent's permission, which is a normative fact, but it doesn't require knowing the value of every object.
