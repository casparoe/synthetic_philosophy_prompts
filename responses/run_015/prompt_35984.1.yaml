answer: |-
  Your hunch is correct: the field's stagnation stems largely from equivocation between instrumental consistency management and robust metaphysical commitment. While "logical hygiene" is technically mature—we have multiple consequence relations (LP, K3, ST, adaptive logics) that block explosion—their philosophical justification often smuggles in ontological claims without defense. Conversely, ontological dialetheism often leans on the technical success of hygiene to argue for the coherence of true contradictions, without proving their necessity outside semantic paradoxes.

  Funding should prioritize questions that force this distinction into the open. If hygiene is indeed "in good shape," it does not need more proof-theoretic variation; it needs a philosophical account of *why* we choose one hygiene system over another. That account depends on the ontological status of contradictions. Therefore, the priority order favors Ontology, not because Hygiene is finished, but because Hygiene cannot be philosophically stabilized without Ontological clarity.

  Here is the defended priority ordering.

  ### 1. The Non-Semantic Demarcation Problem
  **Classification:** Ontological (with Hygiene implications).
  **Position:** Upstream of everything. This is the gatekeeper question. If true contradictions are confined solely to semantic self-reference (Liars, Truth-Tellers), dialetheism is a niche theory of language, not a general logic or metaphysics. If they extend to vagueness, legal norms, or empirical reality, the ontological claim holds water.
  **Tractability:** High for philosophers, low for logicians/CS. Logicians can model domains where contradictions hold, but determining whether actual legal conflicts or borderline cases *are* contradictions rather than epistemic uncertainties or semantic indecision is a conceptual task.
  **Settlement Criteria:** The question is settled not when everyone agrees, but when a principled criterion is established that distinguishes "true contradictions" from "mere inconsistencies requiring hygiene" without ad hoc exclusion. Success looks like a consensus on whether vagueness or normative conflict belongs in the "ontology" bucket or the "hygiene" bucket. If the field agrees these are merely hygiene cases, the ontological project shrinks appropriately; if they are dialetheias, the metaphysical work begins.
  **Reasoning:** This directly addresses your suspicion that non-semantic cases are merely hygiene. Resolving this prevents researchers from trading on the plausibility of semantic paradoxes to win arguments about empirical reality.

  ### 2. The Normative Constraint Problem
  **Classification:** Dissolves the Distinction (Bridge).
  **Position:** Downstream of Demarcation, Upstream of Practice. If some contradictions are true, why is explosion still irrational? Why should we revise beliefs in the face of inconsistency if inconsistency might be true? This connects the truth of contradictions (Ontology) to the management of reasoning (Hygiene).
  **Tractability:** High for philosophers (epistemology/normativity). Logicians can define rationality constraints formally, but justifying why an agent should prefer consistency in non-dialetheic domains requires normative theory.
  **Settlement Criteria:** Settled when a non-ad hoc principle explains why rational agents reject arbitrary contradictions despite accepting specific dialetheias. Currently, the "Minimal Mutilation" principle is often invoked but poorly defended. Success is a defended norm of belief revision that accommodates true contradictions without collapsing into triviality or universal skepticism.
  **Reasoning:** This is the weakest link in current dialetheism. Proponents often say "accept contradictions but not everything," without explaining the mechanism of restraint. Funding this stabilizes the Hygiene project by giving it a normative foundation that doesn't rely on classical assumptions smuggled in.

  ### 3. The Metaphysics of Contradictory Instantiation
  **Classification:** Ontological.
  **Position:** Downstream of Demarcation. If we establish that non-semantic dialetheias exist (Q1), we must explain how an object instantiates incompatible properties. Is it a failure of property individuation? A new mode of existence?
  **Tractability:** Moderate for philosophers (metaphysics). Low for logicians (who treat models as abstract structures). This requires engaging with property theory, mereology, and identity.
  **Settlement Criteria:** Settled when a coherent model of object-property relations allows for $P(a)$ and $\neg P(a)$ without reducing to semantic deflationism (i.e., without saying "it's just language"). Success is a metaphysical picture that makes contradictory instantiation intelligible rather than merely formal.
  **Reasoning:** This is the "cost" payment for ontological dialetheism. Without it, the claim remains a logical curiosity. However, it is ranked third because it is premature to fund this if Q1 concludes there are no non-semantic dialetheias.

  ### Unfunded Areas
  I would deliberately leave the following questions unfunded for this three-year cycle:

  *   **"Is Paraconsistent Negation Genuine Negation?"** This debate has reached a verbal stalemate. It functions as a gatekeeping ritual rather than a productive inquiry. Funding it rewards terminological defense over substantive progress. Researchers should be required to *use* a negation operator, not defend its name.
  *   **Proof-Theoretic Optimization and Complexity.** While important, this is work for computer scientists and mathematical logicians, not philosophical foundations. Your foundation's comparative advantage is conceptual clarity, not computational efficiency.
  *   **Historical Exegesis (Hegel, Heraclitus, etc.).** While historically interesting, interpreting past figures does not resolve current logical disputes. This cycle should focus on forward-looking systematic work.

  ### Summary of Strategy
  The strategy is to test the ontological claim rigorously. If the Non-Semantic Demarcation fails, the field contracts to Logical Hygiene, and future funding should shift to applied logic and CS. If it succeeds, the Normative and Metaphysical questions become urgent. This ordering prevents the field from continuing to fund "ontology" that is secretly just "hygiene" in disguise.

  \answer{Non-Semantic Demarcation, Normative Constraints on Belief, Metaphysics of Instantiation}
