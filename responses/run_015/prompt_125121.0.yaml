answer: |-
  **Project Title:** Marriage as Protocol: A Modular Account of Matrimonial Law
  **Applicant:** [Your Name]
  **Duration:** 6 Months (Part-time)

  **The Pitch**
  The standard philosophical debate over same-sex marriage is stuck in a loop. One side argues marriage is essentially reproductive (therefore same-sex couples don't fit); the other argues it's essentially about romantic companionship (therefore they do). Both sides assume marriage must have a single, unitary essence to be coherent. I think this is a category error.

  My proposal is to treat marriage not as a 'thing' with a purpose, but as a social interface—a standardised protocol that allows distinct systems (tax law, inheritance, medical consent, kinship norms) to interact without negotiating every case from scratch. On this view, same-sex marriage isn't about fitting into an old definition; it's a stress test. It asks whether the interface still functions when the reproductive module is decoupled from the economic and affective ones.

  **Research Question**
  Does the successful legal integration of same-sex marriage necessitate abandoning the 'unitary function' model of marriage in favour of a 'modular system' model, and if so, what are the normative implications for how we bundle rights and obligations?

  **Why the Standard Framing Fails**
  The procreation-vs-companionship debate assumes that if marriage doesn't have one core essence, it becomes arbitrary. But looking at how marriage actually works in liberal democracies, it's clearly already doing multiple jobs. It's a tax status, a next-of-kin designation, and a commitment ritual all at once. The current debate ignores this structural reality. By focusing on 'essence', we miss the mechanical question: can the protocol run without the reproductive driver? If the answer is yes, then the philosophical task shifts from defining marriage to auditing which modules *should* be bundled together. This moves the discussion away from metaphysical essentialism towards political philosophy and legal design.

  **Methodology**
  This is a conceptual analysis project grounded in legal philosophy. I won't be conducting empirical sociological research (outside the scope for a part-time grant). Instead, I'll be analysing the logical structure of marriage statutes and key court rulings.

  I'll treat legal texts as specifications for the 'interface'. I'll examine how rights are bundled in jurisdictions that have adopted same-sex marriage versus those that haven't, or versus civil union frameworks. The goal isn't a comparative law survey, but rather using legal structures to test the philosophical coherence of the 'modular' hypothesis.

  **Work Plan (6 Months, Part-time)**
  *   **Month 1: Mapping the Interface.** Literature review on marriage essentialism (Finnis, Sandel, etc.) versus functionalist accounts. I'll draft the 'protocol' metaphor clearly to ensure it's not just a buzzword but a rigorous analytical tool.
  *   **Month 2: The Decoupling Test.** Conceptual analysis of same-sex marriage rulings (e.g., *Obergefell*, UK Marriage Act amendments). I'll look for where courts explicitly sever the link between marriage and procreation in their reasoning.
  *   **Month 3: Stress Testing the Modules.** If marriage is modular, what stops other reconfigurations? I'll look at the logical boundaries. Does this model inadvertently argue for polygamy or non-romantic care contracts? I need to see if the 'interface' has security limits.
  *   **Month 4: Normative Implications.** If the unitary view is dead, what should replace it? Should we unbundle rights further (e.g., separate tax status from medical consent)? I'll sketch the political philosophy here.
  *   **Month 5: Drafting.** Writing the main paper (target 8,000–10,000 words).
  *   **Month 6: Revision and Dissemination.** Peer feedback, editing, and preparing a summary for non-specialist publication (e.g., an op-ed or philosophy blog) to ensure the idea lands outside academia.

  **Expected Outcomes**
  The primary output will be a draft article suitable for submission to a journal like *Journal of Social Philosophy* or *Law and Philosophy*. Secondary output will be a concise policy brief summarising the 'modular' argument for legal reformers.

  Success looks like a coherent model that explains why same-sex marriage works legally without needing to lie about biology. It should dissolve the 'essence' deadlock.

  **Failure Conditions**
  I need to be honest about risks. The 'interface' metaphor might turn out to be just a fancy way of saying 'marriage is a bundle of rights', which legal realists already know. If I spend three months realising I'm just rediscovering Hohfeldian analysis without adding value, I will pivot. In that case, the output will be a critique of why the 'bundle of rights' view hasn't gained traction in public discourse, and why the 'essence' narrative persists despite being legally obsolete. Even a negative result—that the metaphor doesn't hold water—is philosophically useful because it clarifies why the essentialist view is so sticky.

  **Scope Check**
  Six months part-time (approx. 15 hours a week) is tight but feasible for a single paper. I am limiting the legal analysis to English-speaking common law jurisdictions to avoid translation issues and excessive legwork. I am also avoiding deep historical genealogy of marriage; this is about the current logical structure, not the history of the institution. If the 'module' analysis gets too complex, I will focus solely on the decoupling of reproduction from inheritance rights, rather than trying to map every single legal interaction. This keeps the project finishable within the grant period.
