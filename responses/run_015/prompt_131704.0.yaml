answer: |-
  This is a fantastic reconstruction of a classic objection to Lewisian Modal Realism (LMR). You've essentially distilled the "Practical Irrelevance" or "Triviality" objection into a tight syllogism. It's the kind of argument that keeps modal realists up at night, but Lewis himself had answers for it.

  You want to hold onto **(1)** (Metaphysical Realism) and **(3)** (Psychological Connection). To save practical reasoning **(7)**, you almost certainly have to reject **(4)**.

  Here is the diagnosis of where the argument breaks, why it breaks there, and what it costs you.

  ### The Crack: Step (4) — The Summation Principle

  The fatal equivocation is hidden in **(4)**: *"Rational self-interest shouldn't just care about this-world-me, but about the total welfare summed over all my counterparts everywhere."*

  This step conflates **Metaphysical Reality** with **Normative Significance**. Just because something is *real* (in the concrete Lewisian sense) does not mean it is *relevant* to your local decision procedure.

  Lewis's defense relies on the indexicality you mentioned in **(1)**. If "actual" is indexical (like "here"), then "I" and "my good" are also indexical.
  *   **Spatial Analogy:** There are people in Tokyo. They are just as real as I am. But when I decide whether to eat lunch, rational self-interest does not require me to sum my hunger with the hunger of everyone in Tokyo. I care about *my* hunger.
  *   **Modal Analogy:** There are counterparts in other worlds. They are just as real as I am. But when I decide whether to take the Berlin job, rational self-interest does not require me to sum my welfare with theirs. I care about *this* welfare.

  **Why (4) fails:** Rationality is not a "God's eye view" aggregation function. It is a tool for agents situated within a causal network. Since worlds are causally closed (from **1**), your local choice can causally impact *this* world's future, but it cannot causally impact other worlds. Therefore, a rational agent maximizes value *within their causal reach*, not across the pluriverse.

  ### The Support Beam: Step (3) — The "Me" Equivocation

  You said you want to keep **(3)**, but this is where the tension is highest. You wrote: *"in the relevant psychological sense they're 'me' distributed across worlds."*

  Strictly speaking, **Lewis denies this.**
  *   **Counterpart Theory:** For Lewis, identity is world-bound. I am identical only to myself. My counterparts are *similar* to me, but they are not *me*. They are distinct concrete individuals.
  *   **The Cost of Keeping (3):** If you insist they are "me distributed" (a form of trans-world identity), you invite the problem you've created. If they are literally *you*, then Utilitarianism across worlds seems required.
  *   **The Fix:** You should weaken **(3)**. They are not "you"; they are your *counterparts*. They share your history up to a point and resemble you psychologically, but they are distinct entities. This weakens the pull of **(4)**. If they are distinct entities, why should *this* entity care about *that* entity's welfare any more than it cares about a distinct person in the same world?

  ### The Constancy Claim: Step (5)

  Step **(5)** is metaphysically correct under LMR but practically irrelevant.
  *   **True:** The total sum of value across the pluriverse is fixed. The set of worlds is static; your deliberation doesn't create or destroy worlds.
  *   **False:** That this makes local choice irrational.
  *   **Why:** Your choice doesn't select *which world is actual* (all are actual). Your choice selects *which future temporal part of this world you will be continuous with*.
  *   **Decision Theory:** Standard Causal Decision Theory (CDT) works fine here. I choose A over B if A causes a better outcome *in this world*. The fact that a counterpart chose B in another world doesn't change the causal consequences of my choosing A here.

  ### The Verdict: What to Reject and What It Costs

  To save the argument without abandoning Modal Realism **(1)**, here is the prescription:

  **1. Reject (4) (The Summation Principle).**
  *   **The Move:** Adopt **Indexical Utilitarianism** (or Agent-Relative Consequentialism). Value is real across the pluriverse, but *rational obligation* is indexed to the agent's world.
  *   **The Cost:** You lose "Impartiality" at the metaphysical level. You have to accept that there is no "View from Nowhere" for practical reason. It feels intuitively odd that we ignore equally real beings, but Lewis argues this is no odder than ignoring equally real people in distant spatial locations.

  **2. Clarify/Weaken (3) (The Identity Claim).**
  *   **The Move:** Insist on strict **Counterpart Theory**. They are not "you"; they are *counterparts*. The psychological connection justifies *some* concern (perhaps you care about them as you care about close friends), but not *identity-level* concern.
  *   **The Cost:** You lose the comforting idea of "modal survival." You don't live on in other worlds; merely your duplicates do. This can be existentially chilly, but it blocks the inference that their welfare *is* your welfare.

  ### Summary of the Repair

  The argument collapses because it treats **ontological weight** as **normative weight**.

  *   **Metaphysics:** All worlds are equally real.
  *   **Ethics:** Not all worlds are equally *mine*.

  If you accept that rationality is essentially indexical (bound to *here*, *now*, and *I*), then the fact that "everything happens somewhere" is no more paralyzing than the fact that "everyone exists somewhere." You still have to live *this* life, in *this* world, and your reasons are determined by the causal consequences available *here*.

  **Recommendation:** Hang onto **(1)**. It's the core of the view. But you must let go of the strong reading of **(3)** and definitively reject **(4)**. The cost is accepting that "reality" is bigger than "relevance." Practical reasoning doesn't collapse; it just shrinks back to the boundaries of your own causal horizon.
