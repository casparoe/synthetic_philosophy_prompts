answer: |-
  ### Desiderata for an Adequate Account of 'Western Values'

  To determine whether 'Western values' is a coherent philosophical category or a rhetorical tool, an account must satisfy specific explanatory demands. It cannot simply define the term; it must explain how the term functions across conflicting contexts without collapsing into contradiction. The following desiderata outline the necessary conditions for adequacy.

  **1. Usage-Case Explanatory Power**
  *   **Diplomatic Cohesion:** The account must explain how disparate states (e.g., the US, Hungary, France) invoke the phrase to signal alliance despite divergent domestic policies. *Motivating Case:* NATO summit declarations.
  *   **Exclusionary Gatekeeping:** The account must explain how the phrase functions to distinguish insiders from outsiders, particularly in migration contexts. *Motivating Case:* Citizenship tests requiring adherence to "shared values."
  *   **Reflexive Self-Critique:** The account must allow internal actors to claim the West is *betraying* its values without ceasing to be Western. *Motivating Case:* Civil rights movements appealing to constitutional ideals against state practice.

  **2. Conceptual Distinctions**
  *   **Descriptive vs. Normative:** The account cannot conflate what Western societies historically *did* (colonialism, slavery) with what they claim to *ought* to do (liberty, equality). It must locate the term in one or explain the gap.
  *   **Plural vs. Singular:** The account must address whether 'Western values' is a single monolithic system or a contested family resemblance. It cannot treat the category as univocal without evidence.
  *   **Geographic vs. Civilizational:** The account must explain why Australia is 'West' while Belarus is not, despite geography, and why Japan may share values but remains outside the category.

  **3. Structural Tensions**
  *   **Universalism vs. Particularity:** The account must survive the tension of claiming these values are universally human (human rights) while simultaneously marking them as culturally particular (Western heritage).
  *   **Stability vs. Flexibility:** The term must be stable enough to ground identity but flexible enough to adapt to changing political norms (e.g., the inclusion of LGBTQ+ rights over time).

  **Flagged Jointly Unsatisfiable Pairs**
  *   **Exclusionary Gatekeeping vs. Universalism:** If the values are truly universal human truths, excluding outsiders based on them is logically contradictory (anyone can adopt them). If they are particular cultural traits, imposing them as universal standards is imperialism. An adequate account must explain how this contradiction is *managed*, not necessarily solved.
  *   **Descriptive Accuracy vs. Reflexive Self-Critique:** If the category is defined descriptively (by actual behavior), internal critique becomes impossible (one cannot betray what one *is*). If defined normatively (by ideals), the category risks becoming untethered from reality. An account must explain how the gap between the two sustains the category rather than destroying it.

  ***

  ### Scoring Logic for Three Approaches

  **1. The Civilizational-Inheritance View**
  This approach defines Western values as a historical continuum rooted in Greco-Roman, Judeo-Christian, and Enlightenment traditions passed down through culture.
  *   **Fit:** High on Geography/Civilization and Exclusionary Gatekeeping. It explains why Australia is West and Belarus is not.
  *   **Failure:** It struggles with **Reflexive Self-Critique**. If values are inherited cultural traits, critiquing them positions the critic outside the civilization. It also fails **Universalism**, as heritage is particular by definition.
  *   **Verdict:** Philosophically coherent but politically brittle; cannot explain why outsiders are expected to adopt "heritage" they do not share.

  **2. The Liberal-Proceduralist View**
  This approach defines Western values as abstract political commitments (democracy, rule of law, individual rights) regardless of cultural origin.
  *   **Fit:** High on Universalism and Diplomatic Cohesion (among liberal democracies). It allows for **Reflexive Self-Critique** (states can fail to meet procedures).
  *   **Failure:** It collapses the **Geographic vs. Civilizational** distinction. If values are purely procedural, Japan or South Korea are functionally "Western," diluting the term's geographic utility. It also struggles with **Exclusionary Gatekeeping**, as anyone can theoretically adopt procedures, making cultural assimilation tests seem arbitrary.
  *   **Verdict:** Normatively strong but descriptively weak; fails to explain why the label remains geographic rather than becoming purely ideological.

  **3. The Boundary-Object View (STS)**
  This approach argues the term has no fixed ontological referent; it is coherent *because* it is vague, allowing different groups to cooperate without agreeing on definitions.
  *   **Fit:** High on all Usage-Cases. It explains how diplomats, nativists, and critics can all use the same term for different ends. It dissolves the **Universalism vs. Particularity** tension by treating it as a feature, not a bug.
  *   **Failure:** It fails the implicit desire for **Philosophical Coherence**. It admits the category is not real, only the usage is. It satisfies the desiderata by denying the premise that a coherent category exists.
  *   **Verdict:** Highest explanatory adequacy for actual usage, but ontologically deflationary.

  ***

  ### Desiderata Table

  | desideratum | motivating_case | hard_or_negotiable | biggest_threat |
  | :--- | :--- | :--- | :--- |
  | Diplomatic Cohesion | NATO summit declarations | Hard | Divergent domestic policies (e.g., illiberal democracies) |
  | Exclusionary Gatekeeping | Citizenship assimilation tests | Hard | Universal human rights frameworks |
  | Reflexive Self-Critique | Civil rights movements | Hard | Descriptive definitions of culture |
  | Descriptive vs. Normative | Colonial history vs. Liberty ideals | Hard | Conflating historical acts with professed ideals |
  | Plural vs. Singular | US vs. EU social models | Negotiable | Over-unification erasing internal conflict |
  | Geographic vs. Civilizational | Australia vs. Belarus classification | Hard | Ideological alignment of non-Western states |
  | Universalism vs. Particularity | Human rights enforcement | Hard | Logical contradiction of exclusive universalism |
  | Stability vs. Flexibility | Evolution of LGBTQ+ rights | Negotiable | Rigidity making the term obsolete |

  ***

