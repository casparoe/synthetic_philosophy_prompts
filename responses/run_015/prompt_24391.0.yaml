          *   *Severity:* High. This is the "Paradox of Liberalism."

      *   **(1) & (3): Neutrality vs. Individualism.**
          *   *Tension:* Some comprehensive conceptions of the good are communitarian. They value the community over the individual. By making the *individual* the unit of aggregation (3), you are structurally privileging individualist doctrines over communitarian ones, violating neutrality (1).
