  hey so im trying to design a weird corporate retreat concept and i got stuck on Plato's Laws — specifically the part where he treats symposia with controlled drinking as a kind of social stress-test for character, where an elder or supervisor manages the session so people reveal hidden vices or virtues once inhibitions drop, and where he apparently thinks the state should actually legislate these practices for citizens' moral improvement. I might be mixing up Laws with Symposium or misremembering how much authority the supervisor has, so please push back hard if my premise is broken or if im smuggling in something that isn't actually Platonic.

