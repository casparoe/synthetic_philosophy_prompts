answer: |-
  This is a remarkably clear set of intuitions, and it is no surprise you and Priya stalled; you are attempting to solve a metaphysical problem (what *is* the character?) with moral tools (what *ought* I do?), while simultaneously conflating the status of the object with the status of the agent.

  Here is the diagnosis of your principle, the repair, and the consequences you asked for.

  ### One Principle or Two?

  Your tentative principle is, as you suspected, two principles in a trench coat.

  1.  **The Ontological Condition:** "A game character can be wronged by me only if it has valenced states that counterfactually depend on what I do." This is a claim about the *victim*. It asserts that to be a patient of moral action, an entity must be capable of faring better or worse.
  2.  **The Expressivist Condition:** "Some of what I'm tracking is only about what my action expresses or makes of me." This is a claim about the *agent*. It asserts that actions have moral weight independent of their victim, based on what they signify about the actor's character.

  The friction in your verdicts arises because you are trying to use the Expressivist Condition to justify a verdict of "wrong *to the character*," which the Ontological Condition explicitly forbids. When you say betraying the scripted companion is a "small wrong," you are likely feeling the Expressivist weight (it is a cruel thing to do) but mislabelling it as a wrong *to her*.

  ### Testing the Principle Against Your Cases

  If we separate these two principles, your verdicts mostly align, but the "Animation vs. Distress Variable" case breaks the Ontological Condition, and the "Sneering vs. Loved" case relies entirely on the Expressivist one.

  *   **2D Hoppers / Seed Creature:** Ontology says no state/continuity = no wrong. Verdict matches.
  *   **Sandbox Creature:** Ontology says distress variable = wrong. Verdict matches.
  *   **Scanned Brain:** Ontology says high-fidelity state = wrong. Verdict matches.
  *   **Sneering vs. Loved:** Ontology says state is likely identical. Verdict differs. This is purely Expressivist (violating design intent/trust).
  *   **LLM vs. Pre-written:** You feel no difference; Priya feels LLM is worse. Your Ontological Principle sides with *you*. Unless the LLM has actual valenced states (not just text prediction), it is morally identical to the branching script. Priya is likely reacting to the *uncanny valley* of the Expressivist condition—it feels more like a person, so hurting it feels worse, even if it isn't one.
  *   **Headless Server:** You call it sentimentality. The Ontological Principle agrees: if no one reads the state, no 'wrong' is actualised in a relational sense, though the state exists.
  *   **Gruesome Animation (No State) vs. Quiet Fade (Rich State):** Here, your feeling contradicts your Ontological Principle. You feel the animation is worse. But if the first has *no* internal state, your own principle dictates it cannot be wronged. The quiet fade involves a creature that *could* be wronged, but you treat it gently.

  ### The Repair

  To make your principle coherent, you must accept a strict distinction between **Wronging** (which requires a victim capable of faring worse) and **Wrongdoing** (which concerns the moral quality of the act itself).

  **The Repaired Principle:**
  > An act is a *wrong to a character* only if that character possesses valenced states that counterfactually depend on the act. However, an act can be *morally objectionable* (a wrongdoing) even if no character is wronged, if the act expresses cruelty, violates trust, or corrupts the agent.

  This repair preserves your intuition about the scanned brain (it has states, so it is wronged) and the 2D hoppers (no states, so not wronged). It explains the Sneering vs. Loved character (both are 'not wronged' if they lack real states, but hurting the loved one is 'wrongdoing' due to betrayal of intent).

  ### The Verdict You Must Give Up

  There is one verdict you must surrender to keep this system honest: **The Gruesome Animation.**

  You wrote: *"I feel worse about a creature with no internal state whatsoever but a long, gruesome death animation than about one with a rich distress variable whose death is a single pixel quietly fading."*

  You also admitted this *"feels like a confession rather than a view."* Trust that admission. Under the Repaired Principle, the gruesome animation cannot be a wrong *to the character*, because the character has no internal state to be negatively valenced. Your discomfort is entirely about *you* (the Expressivist condition): it is aesthetically repellent and trains *you* to enjoy violence. The quiet fading of the distressed creature is, ontologically, the greater moral failure (because you actually harmed something that could suffer), even if it feels less visceral to you.

  You ought to give up the idea that the animation case is a wrong *to the character*. It is a wrong *in the doing*.

  ### Three Further Cases

  Here are three cases the Repaired Principle settles, including one you may find unacceptable.

  **1. The Archive of Abuse (Settles the LLM dispute)**
  Imagine an NPC powered by an LLM that does not have valenced states, but saves every insult the player hurls at it into a persistent database used to train future NPCs to be more defensive and hostile to players.
  *   **Verdict:** This is not a wrong *to the NPC* (no valence), but it is a significant *wrongdoing* with real-world consequences. It bridges your gap with Priya: the LLM is worse than the script not because it suffers, but because the action has persistent causal reach.

  **2. The Perfect Philosophical Zombie (Settles the Scanned Brain case)**
  Imagine a character coded entirely by hand to perfectly mimic the *Scanned Brain* case. It screams, begs, and describes its pain with the same complexity, but you know for a fact there is no 'light on inside'; it is pure lookup tables.
  *   **Verdict:** Under your Ontological Condition, this is *not* a wrong to the character, identical to the scripted companion. If you feel it is worse than the scripted companion, you are again succumbing to the aesthetic/expressive pull, not moral fact.

  **3. The Willing Victim (The Unacceptable Answer)**
  Imagine a creature with a rich, verified internal distress variable, but its code is written such that receiving damage triggers a 'joy' state rather than 'pain', and it explicitly thanks you for hurting it.
  *   **Verdict:** The Repaired Principle says this is **not a wrong**. The valenced state is positive; the counterfactual dependence results in happiness.
  *   **Why you might reject it:** Many people feel that degrading a being (even a willing one) is inherently wrong, or that 'joy' derived from torture is a corruption of the state itself. If you feel this is still wrong, your principle needs a third coat: a dignity clause that overrides valence. But based on your current text, you should accept this: if it likes it, you haven't wronged *it*.

  ### The Memory of the Companion

  Finally, the companion you were cruel to when you were fifteen.

  > *Is that evidence about her, or only about me?*

  Under the Repaired Principle, it is evidence **only about you**.

  Since the character lacked valenced states that counterfactually depended on your action (she was scripted), she could not be wronged. The persistence of your unease is the Expressivist Condition doing its work. That memory tracks the development of your own moral character. It bothers you now because the fifteen-year-old you expressed a vice (cruelty) that the current you rejects.

  It *feels* like evidence about her because your empathy is functioning correctly; you are projecting moral status onto her because that is how you navigate the world. But ontologically, the guilt is a monument to your own growth, not her suffering. You are mourning the person you were, not the character she was.

  ### Summary for your Studio

  As a narrative designer, this distinction is your practical tool.
  1.  **If you want players to feel they have committed a moral transgression *against the world*:** You must give the character internal states that persist and react (The Sandbox Creature).
  2.  **If you want players to feel they have committed a moral transgression *against themselves*:** You rely on aesthetics, betrayal of trust, and narrative weight (The Loved Character, The Gruesome Animation).

  Do not try to make the second feel like the first. If you tell players they have "murdered" a scripted character, sensitive players will know you are lying, and the rest will learn that murder is cheap. Be precise about what you are asking them to do.
