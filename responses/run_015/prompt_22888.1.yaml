      *Example:* If I ask about binding, she will likely say it's a learned association. Follow-up: "Doesn't that make the problem purely memory-based rather than perceptual?"

      *Let's write them out.*

      *(Refining Q3 - The "Disguised Appeal")*: The worry is that saying "you need to learn the binding" is just saying "you need prior haptic-visual experience," which Molyneux's subject *by definition* doesn't have. The question needs to ask how the *first* binding happens without prior joint experience.
