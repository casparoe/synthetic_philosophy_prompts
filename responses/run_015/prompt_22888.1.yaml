answer: |-
  Here are ten interview questions designed for your seminar context, including follow-ups that anticipate her theoretical commitments and press on potential vulnerabilities.

  ### 1. Discrimination vs. Recognition
  **Question:** You distinguish between the ability to *discriminate* two visual profiles and the ability to *recognize* one as a sphere. If a newly sighted subject can visually track the contour of a sphere differently than a cube, what cognitive or perceptual resource is actually missing in the moment of failed recognition? Is it a failure of judgment, or a failure of the visual experience itself?

  **Follow-up:** If you say it's a failure of judgment, doesn't that concede the "Yes" side of Molyneux's problem? After all, if the visual data is sufficient for discrimination, and the concept is present, isn't the "recognition" just a trivial inference they are refusing to make, rather than a perceptual inability?

  ### 2. Concepts via Language and Touch
  **Question:** Consider a congenitally blind person who has acquired robust concepts of "sphere" and "cube" through language and tactile models, but has zero visual experience. On your view, when sight is restored, they possess the concept and the visual input, yet they cannot match them. Does this imply that shape concepts acquired through touch are fundamentally *incomplete* until they are visually populated, or are they complete but "dormant" relative to the visual modality?

  **Follow-up:** If they are dormant, what wakes them up? If it requires a learned binding operation, does that mean the tactile concept they held previously was actually a *different* concept than the one they eventually use after gaining sight?

  ### 3. The "Disguised Empiricism" Worry
  **Question:** A traditional empiricist says the subject fails because they lack visual concepts of shape. You say they have the concepts but lack the *binding*. But since this binding operation must be learned, aren't you just offering a disguised appeal to prior haptic-visual experience? How do you explain the *first* instance of binding without presupposing the very cross-modal connection Molyneux's thought experiment rules out?

  **Follow-up:** If the first binding requires a moment of simultaneous touch and sight to "lock in," doesn't that mean the answer to Molyneux's problem is trivially "No" simply because the experimental setup forbids the necessary condition for your mechanism to trigger?

  ### 4. The Explanatory Power of "Binding"
  **Question:** You rely heavily on the notion of a "cross-modal binding operation." There is a worry in philosophy of mind that "binding" can become a placeholder for "magic"—it names the problem without explaining the mechanism. Is this binding a low-level sensory association, like classical conditioning, or is it a high-level cognitive inference?

  **Follow-up:** If it's low-level association, why does it take conceptual resources to initiate? If it's high-level inference, why can't the subject simply infer the link given that they already possess both the visual profile and the haptic concept independently?

  ### 5. Virtual Reality and Training Duration
  **Question:** Suppose we use a VR setup to give a newly sighted person a short period of haptic-visual training—say, thirty minutes of reaching for virtual cubes and spheres before the test. If they pass the recognition test after this brief training, does that vindicate your view that binding is learnable, or does it undermine the "No" answer by suggesting the capacity was latent and merely needed a "key"?

  **Follow-up:** Where do you draw the line between "learning a new perceptual skill" and "activating an innate capacity"? If thirty minutes is enough, is the barrier to recognition really about *experience* or just about *attention*?

  ### 6. The Amodality of Shape
  **Question:** Your view suggests that the property of "sphericity" is not immediately transparent across modalities. Does this commit you to the claim that shapes are not amodal properties of objects, but rather modality-specific properties that only *correlate* across senses? In other words, is the visual sphere and the tactile sphere literally two different properties until bound?

  **Follow-up:** If they are two different properties until bound, how do we ever achieve the unity of the object? Are we forever perceiving a "visual object" and a "tactile object" that we merely stitch together, rather than a single object perceived in multiple ways?

  ### 7. Phenomenology of the Unbound Visual Field
  **Question:** What is the phenomenology of the "unbound" visual profile? When the newly sighted person looks at the sphere, does it look like a flat circle, a distorted blob, or does it look like a sphere that they simply cannot *identify* as a sphere? I'm asking about the qualitative character of the experience prior to binding.

  **Follow-up:** If it looks like a sphere phenomenally, but they can't recognize it, doesn't that suggest the recognition failure is post-perceptual (a memory or naming issue) rather than a failure of perception proper?

  ### 8. Empirical Falsification
  **Question:** Turning to the science: Molyneux's problem is increasingly treated as an empirical question via cataract-reversal cases. What specific behavioral or neural evidence would count *against* your view? If we found a subject who could recognize shapes immediately but lacked the specific neural circuitry you associate with cross-modal binding, would you abandon the view?

  **Follow-up:** If the empirical data turns out to be mixed—some subjects pass, some fail—does your theory allow for individual variance in the "binding mechanism," or does a single success case falsify the claim that binding is a *necessary* learned operation?

  ### 9. Comparison with Audio-Visual Binding
  **Question:** Does this binding requirement apply to other modalities? If someone hears a bell and then sees a bell, do they need a learned binding operation to recognize the visual bell as the source of the sound? Or is spatial shape special compared to other perceptible qualities?

  **Follow-up:** If shape is special, is it because shape is constitutive of the object's identity in a way that sound is not? Does this imply a hierarchy of modalities where vision and touch are "privileged" in a way that makes their binding harder than, say, audio-visual binding?

  ### 10. Normative Implications for "Seeing"
  **Question:** Finally, if recognition requires this learned binding, does it follow that the newly sighted person isn't fully "seeing" the object in the normative sense? Are we to say they have visual *sensations* but not full visual *perception* until the binding is achieved?

  **Follow-up:** If perception requires cross-modal binding, does that mean unisensory perception is a myth? Are we never truly seeing or touching, but always engaged in a multisensory construction, even when one modality is occluded?
