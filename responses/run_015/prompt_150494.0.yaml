answer: |-
  ### The Decision Tree

  **Node 1:** Did the results differ from what random guessing would produce?
  **Node 2:** Does the effect persist after the expectation or tool is removed?
  **Node 3:** Does the effect disappear when the image or sound is made perfectly clear?
  **Node 4:** Does the effect disappear when you force everyone to look at the same spot?
  **Node 5:** Did their ability to distinguish items change, or only their willingness to say "yes"?
  **Node 6:** [EXPENSIVE] Did the raw nerve signal change before the brain named the object? *(Requires EEG/MEG or single-unit recording; adds ~$50k and months of setup to a behavioral study.)*
  **Node 7:** Can you remove the expectation without making the object impossible to see?

  ---

  ### The Leaves

  1.  **Artifact:** The difference isn't there.
      *   *Awkward thing:* You just wasted your funding and the subjects' time.
  2.  **Recalibration:** The last few minutes rewrote the mapping, not a belief you're entertaining right now.
      *   *Awkward thing:* Makes the effect mechanical, like a stretched spring, not psychological.
  3.  **Ambiguity:** The stimulus was too degraded for "what the experience was like" to have an answer.
      *   *Awkward thing:* Makes the finding vanish with better technology or brighter lights.
  4.  **Attention:** Experience never changed, only where or how widely people sampled the display.
      *   *Awkward thing:* Makes "experience" depend entirely on eye muscles, not the mind.
  5.  **Criterion:** Experience never changed and only the report moved, because of a shifted response criterion.
      *   *Awkward thing:* Accuses subjects of dishonesty, insecurity, or gaming the system.
  6.  **Sensory:** The effect is real and it reaches the sensory response itself.
      *   *Awkward thing:* Implies your eyes lie to you before you even start thinking.
  7.  **No Line:** Expectation-shaped inference is just what perception is and there's no line where the debate put one.
      *   *Awkward thing:* Makes the question "does belief change sight?" meaningless.
  8.  **Downstream:** It's real but only downstream, at object recognition or categorisation.
      *   *Awkward thing:* Requires a magic, unbreakable wall between seeing and naming.

  ---

  ### Study Placements

  1.  **Hungry/Food (80ms):** **Stuck between Attention and Criterion.**
      *   *Why:* We know the effect exists (N1) and is transient (N2), and the image is resolvable (N3). But the paragraph reports neither eye-tracking (N4) nor discrimination thresholds (N5).
      *   *Unstick Experiment:* Run the 80ms trial again with forced fixation (infrared eye-tracking) and a two-alternative forced-choice discrimination task alongside the naming task.
  2.  **Prisms (20 mins):** **Recalibration.**
      *   *Path:* N1(Yes) → N2(Yes).
  3.  **Duck/Rabbit (Blur):** **Ambiguity.**
      *   *Path:* N1(Yes) → N2(No) → N3(Yes).
  4.  **Tone/Shock:** **Criterion.**
      *   *Path:* N1(Yes) → N2(No) → N3(No) → N4(No) → N5(Willingness only).
  5.  **Radiologists (200ms):** **Attention.**
      *   *Path:* N1(Yes) → N2(No) → N3(No) → N4(Yes, sampling differed).

  ---

  ### Analysis

  **Empty Paths (Allowed by tree, logically suspect):**
  *   **Recalibration + Ambiguity:** (N2 Yes → N3 Yes). Theoretically possible (adapted to noise), but unattractive. If the system recalibrated to a shift, it should persist even in clarity; if it relies on blur, it's not a true recalibration of the sensor.
  *   **Attention + Sensory:** (N4 Yes → N6 Yes). Structurally impossible in this tree because N4 "Yes" terminates at the Attention leaf. In reality, attention *can* modulate sensory gain (V1 activity), making this distinction a sorting artifact rather than a biological truth.

  **Indistinguishable Leaves:**
  *   **Sensory vs. No Line:** Both predict N6(Yes). If the nerve signal changes, the "Sensory" camp says belief penetrated the sensor; the "No Line" camp says the sensor *is* a belief-machine. This tree cannot separate them without philosophical stipulation, not data.

  **Heaviest Node:**
  *   **Node 5 (Ability vs. Willingness):** This carries the most weight because it is the primary battleground of the literature. Distinguishing a change in *sensitivity* (d') from a change in *bias* (c) is the only way to claim perception itself changed rather than just the decision to speak. Most public debates collapse because this measurement is missing.
