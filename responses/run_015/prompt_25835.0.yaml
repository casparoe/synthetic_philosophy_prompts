  Your instincts are excellent. This summary captures Kuhn's structural claims well but distorts his epistemological conclusions, particularly regarding rationality and relativism. It represents the "standard interpretation" that Kuhn himself spent later years correcting.

  A careful Kuhnian would accept the first half. Kuhn indeed rejected cumulative progress, arguing science alternates between "normal science" (puzzle-solving within a paradigm) and "revolutionary science" (paradigm shift). The description of normal science as conservative is accurate, though the claim that mismatches are "blamed on the scientist" is slightly too strong; Kuhn suggested anomalies are typically set aside or adjusted until they become overwhelming, triggering a crisis.

  The distortion begins with incommensurability. While Kuhn argued paradigms lack a neutral language for comparison, he did not claim communication is impossible. He meant terms change meaning (e.g., "mass" in Newton vs. Einstein), making direct translation difficult, not that scientists talk past each other entirely.

  The claim that theory choice is "not rationally compelled" is the most significant oversimplification. Kuhn denied there is an *algorithm* for choice—a mechanical rule that dictates the correct theory based on evidence. However, he explicitly rejected the idea that choice is *irrational*. In his 1969 postscript to *The Structure of Scientific Revolutions*, he outlined five shared values (accuracy, consistency, scope, simplicity, fruitfulness) that guide scientists. Disagreement arises because scientists apply these values differently or weigh them differently, not because they abandon reason. To say choice is driven solely by "sociological and psychological factors" ignores these objective criteria Kuhn insisted upon. He argued that while social factors play a role, they do not exclude rational evaluation based on these values.

  Finally, regarding relativism: while Kuhn is frequently labeled a relativist, he vehemently rejected the term. He argued science progresses evolutionarily. Later paradigms are better at solving puzzles than earlier ones, even if they don't converge on a single "Truth" or reality-in-itself. He rejected relativism because he believed scientific development moves from less to more effective problem-solving tools. There is progress, just not progress *toward* a predetermined goal.

  In short, the summary conflates "no neutral algorithm" with "no rationality." Kuhn's view was that science is rational without being algorithmic, and progressive without being teleological. The textbook simplifies a nuanced position into a caricature that invites the very relativist objections Kuhn spent his later career fighting. Your skepticism about the slide from incommensurability to irrationality is well-founded; that slide is exactly where the standard interpretation goes wrong.
