      (8): "elected bodies around, for deciding which questions the sortition bodies take up..."
      Patch: "...agenda should also be set by lot — a second, standing random body that picks the questions, so no elected politician ever decides what's on the table."
      *Conflict:* The Patch directly contradicts (8). The user recognizes this tension implicitly by asking if the patch works. I need to highlight that the Patch *abandons* (8)'s agenda-setting clause.

      *Okay, plan adjusted.*
      1. Validate Objections (mostly correct).
