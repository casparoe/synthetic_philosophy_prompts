      *   *Honor Culture:* Reputation is external and finite. Insults diminish social standing. Violence (or threat thereof) is the legitimate mechanism for restoration. Self-help justice.
      *   *Dignity Culture:* Worth is internal and infinite. Insults shouldn't matter legally/morally. State/Law handles disputes. Turning the other cheek is virtuous.
      *   *Victimhood Culture:* Worth is tied to vulnerability and harm. Publicizing injury grants moral capital. Third-party validation is crucial. Harm can be psychological/systemic.

