          *   *Injury:* None, ideally. Words are wind. Physical safety is the only real harm.
          *   *Action:* Ignore the insult. Use courts if libelous. Do not kill.
          *   *Non-physical harm:* Skeptical. Emotional resilience is expected.
          *   *Judgment:* The duel is irrational murder. Hamilton is a martyr for reason; Burr is a criminal.
      *   **Section 3: Victimhood Culture (The Counter-Intuitive Lens):**
          *   *Injury:* Psychological trauma, power imbalance, systemic toxicity.
          *   *Action:* Publicize the harm. Seek third-party validation (society/media). Do not fight back physically (that makes you an aggressor), but claim moral high ground through suffering.
