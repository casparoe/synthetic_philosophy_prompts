prompt: |-
  Our reading group (a therapist, a retired classics teacher, a data scientist, and me) has been going in circles for a month about what emotions actually *are*, and I got stuck writing the "what question are we even asking" document for week one, so I'm asking you to write the hard part of it. The problem is that everyone has exactly one case they take to be decisive: the therapist keeps coming back to a client who knows perfectly well the spider is plastic and is still terrified of it, and says this kills the "emotions are judgments" view; the classics teacher keeps pointing out that people genuinely grieve at the death of characters who never existed, and thinks that kills anything that requires a real particular object; the data scientist says emotions can't be private inner episodes at all because he can predict them from behavioural traces better than people can report them. I don't think any of those arguments settle anything, because nobody has said what a theory would have to get right in the first place. So: give me the desiderata list for a theory of what emotions are, numbered, each with the case or consideration that makes it a requirement rather than a taste, and each marked negotiable or non-negotiable.

  I have my own pile of cases that I want represented or explicitly ruled out, and honestly half of my hope is that you'll tell me some of them are not the theory's job. (1) Emotions seem assessable — you can ask whether the fear was apt or the anger was out of proportion — so a theory has to say what correctness consists in, and I want to know whether that's really a requirement or just a prejudice of the judgment camp. (2) Recalcitrance: the plastic-spider case, but also the reverse, where someone's affect lags behind their own considered view for months and then catches up. (3) Emotions you can be *talked* out of but not *decided* out of, which seems to demand a weird intermediate status between belief and itch. (4) My friend with a rare condition that badly blunts her visceral feedback, who says she still knows she's anxious because of what she starts doing — rehearsing conversations, checking the door twice — and I don't know whether that's a counterexample to the bodily-feeling family or just a case of the evidence being rewritten. (5) Emotions with diffuse or missing objects: ambient dread about something huge and statistical that no single action would address, "nostalgia" for a trip that hasn't happened yet, relief about an outcome that was never really on the cards. (6) Emotions whose object is another emotion of your own — being ashamed of being jealous, being annoyed at yourself for still being frightened — and whether that recursion causes trouble for any of the three usual families. (7) A dog's fear, a pre-verbal infant's distress, and whether a theory is allowed to exclude those by fiat or has to earn the exclusion. (8) Emotions as things that can be *educated* — people who learn to feel indignation at something they used to accept quietly, which is the bit I personally care about most, since my real interest is whether emotions can be reasons for action and whether they can be better or worse in something like an epistemic sense.

  Two more things I specifically want. First: I strongly suspect some pairs on your list can't be jointly satisfied — "emotions are bodily feelings" and "emotions can be apt or inapt" feel like they pull apart, and "emotions require conceptually structured content" and "infants have emotions" too — so flag the tensions, say which requirement does the most work in knocking candidates out, and tell me if the list itself is the interesting result here. Second: score the three families very briefly against the list (the judgment view, the perception-of-evaluative-properties view, the bodily-feeling/constructionish view) — a few lines each is plenty, I'll do the arguing with the group myself. And as I said, I'd also like you to say plainly which of my cases a theory is entitled to set aside as not really emotions at all, and what principle licenses setting them aside rather than it being special pleading. Skip the reading list, I can google.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A reading group (therapist, classics teacher, data scientist, narrator) is stuck on defining emotions. They have specific "decisive cases" that block progress.
      *   **Task:** Write the "hard part" of a Week One document: a numbered list of *desiderata* for a theory of emotion.
      *   **Requirements for Desiderata:**
          *   Numbered.
          *   Each must have the specific case/consideration motivating it (not just taste).
          *   Each marked "Negotiable" or "Non-negotiable".
          *   Address the narrator's 8 specific cases/concerns (assessability, recalcitrance, voluntariness, visceral feedback, diffuse objects, recursive emotions, non-human/infant emotions, educability).
          *   Flag tensions between desiderata (some can't be jointly satisfied).
          *   Identify which requirement does the most "knockout" work.
          *   Score the three main families of theory (Judgmentalism, Perceptualism, Somatic/Constructionist) against the list.
          *   Explicitly state which of the narrator's cases a theory is entitled to exclude (and why).
      *   **Tone:** Philosophical, precise, pragmatic, avoiding fluff/reading lists.
      *   **Constraint:** Skip the reading list.

  2.  **Deconstruct the Narrator's Cases & Group Members' Objections:**
      *   *Therapist:* Recalcitrant emotion (plastic spider). Kills pure Judgmentalism.
      *   *Classics Teacher:* Fictional objects (grieving fictional characters). Kills theories requiring real existence of objects.
      *   *Data Scientist:* Predictability from behavior/physiology > self-report. Kills pure Privileged Access/Inner Episode views.
      *   *Narrator Case 1:* Assessability (aptness). Favors Cognitive views, challenges Pure Somatic.
      *   *Narrator Case 2:* Recalcitrance (affect vs. judgment). Favors Perceptual/Somatic, challenges Judgmentalism.
      *   *Narrator Case 3:* Voluntariness (talked out vs. decided out). Favors intermediate status (Perceptual?).
      *   *Narrator Case 4:* Blunted Visceral Feedback (James-Lange counterexample?). Challenges Somatic necessity.
      *   *Narrator Case 5:* Diffuse/Missing Objects (dread, nostalgia). Challenges Intentionality requirements.
      *   *Narrator Case 6:* Recursive Emotions (shame about jealousy). Challenges simple Object-directedness.
      *   *Narrator Case 7:* Non-human/Infant Emotions. Challenges Conceptual/linguistic requirements.
      *   *Narrator Case 8:* Educability/Reasons. Favors Cognitive/Normative views.

  3.  **Drafting the Desiderata List:**
      *   I need to synthesize these into general principles.
      *   *D1: Intentionality (Aboutness).* Motivated by Classics Teacher + Case 5. (Is an object *required*?)
      *   *D2: Phenomenology/Feel.* Motivated by common sense + Case 4. (Does it have to feel like something?)
      *   *D3: Rational Assessability.* Motivated by Narrator Case 1 + 8. (Can it be right/wrong?)
      *   *D4: Recalcitrance/Independence from Judgment.* Motivated by Therapist + Case 2 + 3. (Can I feel X while believing not-X?)
      *   *D5: Behavioral/Physiological Correlates.* Motivated by Data Scientist. (Must it show up?)
      *   *D6: Developmental/Comparative Scope.* Motivated by Case 7. (Do dogs/infants have them?)
      *   *D7: Malleability/Educability.* Motivated by Case 8. (Can they change via reason?)

      *Refining Negotiability:*
      *   Some *must* be non-negotiable for a theory to count as a theory of *emotion* rather than something else.
      *   Some might be negotiable if the theory reclassifies certain phenomena (e.g., maybe "ambient dread" isn't an emotion but a mood).
      *   *Crucial Step:* I need to be honest about tensions. D3 (Assessability) and D6 (Infants) tension if assessability requires concepts. D2 (Feel) and D4 (Recalcitrance) tension if feelings are just sensations.

  4.  **Addressing the Tensions:**
      *   The "Impossible Trinity" of Emotion Theory: Phenomenology (Feel), Intentionality (Aboutness), and Naturalism (Causal/Behavioral).
      *   Specific tension: Assessability (requires content) vs. Infants (lack concepts).
      *   Specific tension: Recalcitrance (feeling persists despite judgment) vs. Educability (reasons change feelings).

  5.  **Scoring the Three Families:**
      *   *Judgmentalism (Stoics/Solomon):* Good on Assessability/Educability. Fails Recalcitrance/Infants.
      *   *Perceptualism (D'Arms/Jacobson/Tappolet):* Good on Recalcitrance/Assessability. Struggles with Infants (maybe?) and Data Scientist (privacy).
      *   *Somatic/Constructionist (James/Barrett):* Good on Data Scientist/Infants/Recalcitrance. Fails Assessability (how is a heartbeat 'wrong'?) and Intentionality.

  6.  **Addressing the Narrator's Cases (Exclusions):**
      *   Which cases can a theory ignore?
      *   *Case 5 (Diffuse Objects):* A theory can distinguish Emotion vs. Mood. This is a legitimate exclusion principle.
      *   *Case 4 (Blunted Feedback):* A theory can say this is "emotion without feeling" or "cold emotion," but Jamesians must call it not-emotion.
      *   *Case 6 (Recursive):* Usually handled by meta-emotions, not a dealbreaker.
      *   *Case 7 (Infants):* If a theory requires concepts, it *must* exclude infants or call it "proto-emotion." This is a high cost but logically permissible if defined strictly.

  7.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Professional, slightly academic but accessible (like a good handout), direct.
      *   *Structure:*
          1.  Introduction (acknowledging the stalemate).
          2.  The Desiderata List (Numbered, Motivation, Status).
          3.  The Tensions (The "Hard Part").
          4.  Scoring the Families.
          5.  Ruling on the Narrator's Cases (Exclusions).

      *(Self-Correction during drafting)*: Make sure I explicitly mark "Negotiable" vs "Non-negotiable" as requested. Be careful not to solve the problem, but to frame the constraints. The prompt asks me to write the document *for* them, essentially.

      *Refining the "Negotiable" status:*
      *   Is Intentionality non-negotiable? Many say yes, but moods exist. Let's mark it Non-negotiable for *paradigmatic* emotion, but allow a Mood/Emotion distinction.
      *   Is Assessability non-negotiable? If emotions aren't assessable, are they just weather? Let's mark it Non-negotiable for the *normative* interest the narrator has.
      *   Is Infant Emotion non-negotiable? If you define emotion cognitively, you lose infants. This is a major theoretical fork. I should mark it Negotiable *if* the theory pays a cost (e.g., positing 'proto-emotions'). Actually, better to mark it Non-negotiable for a *general* theory, but acknowledge the cost. Let's make it Negotiable to allow for "Human Adult Emotion" theories vs "Broad Biological" theories.

      *Refining the Exclusions:*
      *   The prompt asks: "tell me which of my cases a theory is entitled to set aside."
      *   Case 5 (Diffuse objects) is the strongest candidate for exclusion (Mood vs Emotion).
      *   Case 7 (Infants) is the second strongest (Conceptualism exclusion).
      *   Case 4 (Blunted feedback) is tricky. If the theory is Somatic, this *must* be excluded. If Cognitive, it's fine.

  8.  **Final Review against Constraints:**
      *   Numbered list? Yes.
      *   Case/Consideration for each? Yes.
      *   Negotiable/Non-negotiable? Yes.
      *   Flag tensions? Yes.
      *   Score three families? Yes.
      *   Address exclusions? Yes.
      *   No reading list? Yes.

      *Wait, one detail:* The Data Scientist's point. "Predict them from behavioural traces better than people can report them." This challenges Privileged Access. I need a desideratum about Privacy/Access.
      *   *D5: Epistemic Access.* Motivated by Data Scientist.

      *Let's assemble the Desiderata:*
      1.  Intentionality (Object-directedness).
      2.  Rational Assessability (Aptness).
      3.  Recalcitrance (Independence from Judgment).
      4.  Phenomenological Salience (It feels like something).
      5.  Behavioral/Physiological Detectability (Public evidence).
      6.  Developmental Continuity (Infants/Animals).
      7.  Malleability by Reason (Educability).

      *Tensions:*
      *   2 & 6 (Assessability needs concepts; Infants lack concepts).
      *   3 & 7 (Recalcitrance says reason doesn't kill emotion; Educability says reason changes emotion). *Resolution:* Immediate vs Long-term.
      *   4 & 5 (Privileged access vs Public data).

      *Scoring:*
      *   Judgmentalism: Fails 3 (Recalcitrance).
      *   Perceptualism: Best fit overall, struggles with 5 (Data Scientist).
      *   Somatic/Constructionist: Fails 2 (Assessability).

      *Exclusions:*
      *   Case 5 (Moods).
      *   Case 7 (If Conceptualist).

      *Okay, ready to write.*
answer: |-
  **To:** Reading Group Members
  **From:** [Your Name]
  **Re:** Week One — Desiderata for a Theory of Emotion

  We are stuck because we are treating our "decisive cases" as refutations before agreeing on what the theory is supposed to explain. A theory of gravity doesn't fail because feathers fall slowly; it fails if it can't explain the *rate* of fall under specified conditions. Similarly, a theory of emotion might be entitled to distinguish emotions from moods, or adult emotions from infant distress, provided it gives a principled reason for doing so.

  Below is the list of requirements (desiderata) a theory must address. I have marked each as **Non-Negotiable** (the theory fails if it ignores this) or **Negotiable** (the theory can exclude this, but must pay a theoretical cost and explain why).

  ### The Desiderata List

  **1. Intentionality (Aboutness)**
  *   **Requirement:** Emotions must be *about* something (an object, state of affairs, or prospect).
  *   **Motivating Case:** The Classics Teacher's grief for fictional characters. If emotions require real objects, fictional grief is impossible. If they don't require objects, how do we distinguish fear of a spider from free-floating anxiety?
  *   **Status:** **Non-Negotiable** (for paradigmatic emotions).
  *   **Note:** A theory may reclassify objectless states as "moods" (see Exclusions below), but it must account for the difference.

  **2. Rational Assessability (Aptness)**
  *   **Requirement:** It must make sense to ask if an emotion is *fitting*, *apt*, or *proportionate* to its object.
  *   **Motivating Case:** Narrator Case (1) & (8). We criticize anger as "unjustified" or fear as "irrational." If emotions are merely causal pushes (like a sneeze), normative assessment is a category error.
  *   **Status:** **Non-Negotiable.**
  *   **Note:** This is the primary constraint for the narrator's interest in emotions as reasons for action.

  **3. Recalcitrance (Independence from Judgment)**
  *   **Requirement:** It must be possible to experience an emotion while holding a contradictory judgment (e.g., fearing the plastic spider while knowing it is safe).
  *   **Motivating Case:** The Therapist's spider case; Narrator Case (2) & (3). If emotions *were* judgments, recalcitrance would be a logical contradiction (believing *p* and *not-p* simultaneously).
  *   **Status:** **Non-Negotiable.**
  *   **Note:** This is the primary knockout blow to pure Judgmentalism.

  **4. Phenomenological Salience (Feel)**
  *   **Requirement:** Emotions must involve a distinctive subjective experience (it feels like something to be angry).
  *   **Motivating Case:** Common intuition; Narrator Case (4). If a person lacks visceral feedback but acts anxious, do they *feel* anxiety? If a theory says "yes, it's just a disposition," it risks losing the thing we actually care about.
  *   **Status:** **Negotiable.**
  *   **Note:** A theory can argue that "feeling" is a byproduct, not the essence, but it must explain why the feeling is so ubiquitous.

  **5. Public Detectability (Third-Person Access)**
  *   **Requirement:** Emotional states must correlate with observable behavioral or physiological traces that are accessible to third parties.
  *   **Motivating Case:** The Data Scientist's point. If self-report is less reliable than behavioral prediction, emotions cannot be essentially "private inner episodes" known only to the subject.
  *   **Status:** **Non-Negotiable.**
  *   **Note:** This rules out Cartesian privacy. It does not rule out phenomenology, but it demands phenomenology be anchored in public facts.

  **6. Developmental Continuity**
  *   **Requirement:** The theory must account for emotional-like behavior in pre-verbal infants and non-human animals.
  *   **Motivating Case:** Narrator Case (7). If a theory requires complex concepts (e.g., "justice" for indignation), it excludes the dog's fear.
  *   **Status:** **Negotiable.**
  *   **Note:** A theory can posit "Human Emotion" vs. "Proto-Emotion," but it must explain the transition. Excluding infants is a high cost for a general theory.

  **7. Malleability by Reason**
  *   **Requirement:** Emotions must be responsive to cognitive reframing over time, even if not instantly controllable.
  *   **Motivating Case:** Narrator Case (3) & (8). We can be *talked* out of fear, even if we can't *decide* it away. We can learn new indignations.
  *   **Status:** **Non-Negotiable.**
  *   **Note:** This distinguishes emotions from reflexes (knee jerks) and ensures they play a role in rational agency.

  ***

  ### The Tensions (The "Hard Part")

  This list is not consistent. You cannot maximize all seven simultaneously. These are the fault lines where your theories will break:

  *   **Tension A: Assessability (2) vs. Continuity (6).**
      To say an emotion is "apt" or "inapt" usually requires the subject to grasp concepts (e.g., *danger*, *insult*). Infants and dogs likely lack these concepts.
      *   *The Trade-off:* If you keep Assessability Non-Negotiable, you must mark Continuity as Negotiable and call infant distress "proto-emotion." If you keep Continuity Non-Negotiable, you must weaken Assessability (e.g., biological fitness instead of rational aptness).
      *   *Knockout Power:* High. This splits Cognitive theories from Evolutionary/Biological theories.

  *   **Tension B: Recalcitrance (3) vs. Malleability (7).**
      Recalcitrance says judgment doesn't stop emotion. Malleability says reason changes emotion.
      *   *The Trade-off:* A theory must distinguish between *immediate* causation (where judgment fails) and *long-term* calibration (where reason works). If it can't make this distinction, it fails both.
      *   *Knockout Power:* Medium. Most theories survive this by appealing to time-scales, but it kills crude Behaviorism.

  *   **Tension C: Phenomenology (4) vs. Detectability (5).**
      The Data Scientist says behavior predicts emotion better than report. The Phenomenologist says the feeling *is* the emotion.
      *   *The Trade-off:* If the Data Scientist is right, the "feeling" might be an epiphenomenon. A theory must decide if the "what it's like" is constitutive or incidental.
      *   *Knockout Power:* High. This is the main battleground between Constructionists/Behaviorists and Phenomenologists.

  **Which requirement does the most work?**
  **Recalcitrance (3).** It is the single strongest constraint. Any theory that identifies emotions *strictly* with judgments (Stoicism, strong Cognitivism) is immediately falsified by the plastic spider. Any viable theory must explain how an emotion can persist *against* a judgment.

  ***

  ### Scoring the Three Families

  **1. The Judgment View (Emotions = Evaluative Beliefs/Judgments)**
  *   **Score:** Fails.
  *   **Why:** It satisfies Assessability (2) and Malleability (7) perfectly. However, it crashes immediately on **Recalcitrance (3)**. It cannot explain the plastic spider without accusing the client of irrationality (holding contradictory beliefs). It also struggles with **Continuity (6)** (do infants judge?).
  *   **Verdict:** Dead as a complete theory, useful only as a component.

  **2. The Perceptual View (Emotions = Perceptions of Value)**
  *   **Score:** Strongest Contender.
  *   **Why:** It handles **Recalcitrance (3)** well (I can see a stick as a snake even while knowing it's a stick; illusions persist). It preserves **Assessability (2)** (perceptions can be accurate or inaccurate). It handles **Malleability (7)** (learning changes what we perceive).
  *   **Weakness:** Struggles with **Detectability (5)** (Data Scientist's point) and **Continuity (6)** (requires some conceptual capacity to perceive "value").
  *   **Verdict:** The current frontrunner for philosophical coherence.

  **3. The Somatic/Constructionist View (Emotions = Bodily Feelings or Social Constructs)**
  *   **Score:** Mixed.
  *   **Why:** It excels at **Detectability (5)** and **Continuity (6)** (bodily changes are public and pre-verbal). It explains **Recalcitrance (3)** easily (the body reacts before the mind).
  *   **Weakness:** It fails **Assessability (2)** catastrophically. A racing heart cannot be "unjustified" or "wrong" in a normative sense; it just *is*. It also struggles with **Intentionality (1)** (how does a stomach churn point to a specific political injustice?).
  *   **Verdict:** Good on mechanism, silent on meaning.

  ***

  ### Ruling on Your Cases (Exclusions)

  You asked which of your specific cases a theory is entitled to set aside. A theory is not special pleading if it draws a boundary based on a principled distinction.

  *   **Case 5 (Diffuse/Missing Objects): EXCLUDABLE.**
      *   *Principle:* **Emotion vs. Mood.** A theory is entitled to define "Emotion" as necessarily object-directed (Intentionality). States like "ambient dread" or "statistical anxiety" can be classified as *Moods*. Moods lack specific objects and are less assessable.
      *   *License:* This is standard philosophical practice. As long as the theory explains the relationship (e.g., moods bias emotions), this is not a failure.

  *   **Case 7 (Infants/Dogs): EXCLUDABLE (with cost).**
      *   *Principle:* **Conceptualism.** If your theory defines emotion as involving an evaluation of "offense" or "danger" as *concepts*, you are entitled to say infants have *affect programs* or *proto-emotions*, not full emotions.
      *   *License:* Permissible, but it limits the scope of the theory to "Propositional Emotions." You must acknowledge you are not explaining the biological root, only the mature human form.

  *   **Case 4 (Blunted Visceral Feedback): NOT EXCLUDABLE.**
      *   *Principle:* This is a counterexample to Somatic theories, not a case to be excluded. If a person acts anxious, reports anxiety, and avoids threats, a theory that says "this is not anxiety because their heart rate is normal" is redefining the word against usage.
      *   *License:* A theory must accommodate this as "emotion without typical physiological markers," not deny it is emotion.

  *   **Case 6 (Recursive Emotions): NOT EXCLUDABLE.**
      *   *Principle:* Meta-cognition is a feature of human emotion. A theory that cannot handle shame-about-jealousy is too simple. However, this is usually solved by positing a hierarchy of states, not by exclusion.

  **Summary for the Group:**
  We should stop asking "Which case kills which theory?" and start asking "Which desiderata are we willing to relax?" If the Therapist insists Recalcitrance is non-negotiable, Judgmentalism is out. If the Data Scientist insists Detectability is non-negotiable, pure Phenomenology is out. If you (Narrator) insist Assessability is non-negotiable, pure Somatic theory is out.

  The document for Week Two should be a vote on which Desiderata are Non-Negotiable. That will select the theory for you.
