answer: |-
  There is no single canonical term in political science or organizational theory that captures this phenomenon with the precision you are requesting. The standard labels you have already ruled out (*Iron Law of Oligarchy, Goal Displacement, Groupthink*) are the usual suspects, but as you note, they are either too broad, imply cynicism/hierarchy where none exists, or focus on decision quality rather than doctrinal evolution.

  However, the mechanism you describe is a recognized intersection of three established concepts: **Social Identity Theory** (specifically *Optimal Distinctiveness*), **Boundary Maintenance** (from the sociology of religion), and **Informational Cascades**.

  If a name is required for this specific carving, the most accurate descriptive term is **"Identity-Constitutive Drift."**

  Below is the carving of the mechanism, its distinction from nearby concepts, an evaluation of Weil's apparatus, and the shape of an immune organization.

  ### 1. The Mechanism: Identity-Constitutive Drift

  The phenomenon is not a conspiracy, nor a structural flaw in the sense of a broken machine. It is a functional feature of human social cognition applied to organizational survival.

  **The Steps:**
  1.  **The Existence Imperative:** Once formed, a group acquires a primary interest in its own continued existence, distinct from its original instrumental purpose (Case 1: the tenants' association after the victory).
  2.  **The Boundary Requirement:** To exist as a distinct entity, a group must maintain boundaries. A group without boundaries is indistinguishable from the ambient population and ceases to function as a group.
  3.  **Doctrinal Markers:** Boundaries are most efficiently maintained through shared beliefs or tactics. These beliefs serve as "badges" of membership.
  4.  **Selection Pressure:** Doctrines are no longer selected primarily for their truth or utility regarding the external mission, but for their utility in maintaining the boundary.
      *   *In Case 1:* Questioning tactics threatens cohesion, so tactics become dogma.
      *   *In Case 2:* Shared theses do not distinguish the group from its rival; differentiating theses do. Therefore, the group unconsciously amplifies the differentiating theses and suppresses the shared ones.
  5.  **Internalization (The Cascade):** Individual members, wishing to remain in good standing (social utility) and lacking perfect independent information (epistemic utility), observe the group's emerging line. They adjust their stated reasons to match. Over time, through cognitive dissonance reduction, they internalize these reasons.
  6.  **The Authorship Vacuum:** Because every member is adjusting to the aggregate signal of the other members, no single individual dictates the shift. The "line" emerges from the feedback loop. Thus, no one is responsible.

  ### 2. Distinctions from Nearby Concepts

  *   **Vs. The Iron Law of Oligarchy (Michels):** Oligarchy requires a *leadership class* that diverges from the membership to secure its own power/perks. In your cases, the officers rotate, draw no salary, and the pressure is horizontal. Identity-Constitutive Drift works even in perfectly flat, virtuous hierarchies.
  *   **Vs. Goal Displacement (Selznick):** Goal displacement usually refers to *means becoming ends* (e.g., following rules becomes more important than solving the problem). Your phenomenon is narrower: it is *beliefs becoming badges*. The mission isn't just displaced; the *content* of the mission mutates to serve the group's identity boundaries.
  *   **Vs. Groupthink (Janis):** Groupthink is a pathology of *decision-making under stress* (seeking unanimity leads to bad choices). Identity-Constitutive Drift is a pathology of *long-term belief formation*. Deliberation can be vigorous and sincere; the bias is in the *selection of premises*, not the suppression of dissent during a specific vote.
  *   **Vs. Mission Creep:** Mission creep implies expansion of scope. This phenomenon can occur within a static scope; the *interpretation* of the scope shifts to maximize differentiation or cohesion.

  ### 3. Weil's Apparatus vs. The Thinner Story

  You ask whether Weil's "heavier apparatus" (a collective being that exerts pressure) is needed, or if a thinner story (membership sorting, exit costs, justification) suffices.

  **The thinner story suffices.**

  Weil's language is theological/mystical ("collective pressure," "the beast"). She posits the group as a distinct ontological entity that overrides the individual. Modern social science does not require this metaphysical step.

  *   **Methodological Individualism:** The pressure is not exerted *by* the group, but *through* the individuals. Each member exerts pressure on every other member by signaling what counts as "loyalty."
  *   **Exit Costs:** In your cases, the exit costs are social, not financial. Leaving the tenants' association means losing community standing; leaving the learned society means losing professional identity.
  *   **Preference Falsification -> Preference Adaptation:** Initially, members might just *say* what the group wants (preference falsification). But humans are rationalizing creatures. To avoid the psychological cost of hypocrisy, they adjust their private beliefs to match their public statements.

  Weil's insight is morally correct (the outcome is the same: the individual conscience is bypassed), but her mechanism is unnecessarily mystical. The "pressure" is simply the sum of a thousand individual micro-incentives to belong, aggregated without a coordinator.

  ### 4. The Immune Organization

  If the mechanism relies on the need for *continued existence* and *identity boundaries*, an organization immune to Identity-Constitutive Drift must be structured to minimize those needs.

  **Characteristics of an Immune Structure:**

  1.  **Ephemerality (Sunset Clauses):** The group must dissolve automatically upon achieving its specific task. This removes the "Existence Imperative." If the group knows it will cease to exist in six months, it has no incentive to curate beliefs for long-term cohesion. (Case 1 failed this; Case 2 fails this by being a permanent society).
  2.  **Low Identity Investment:** Membership should not be a core part of the members' self-conception. If being a "member of X" is a significant part of who you are, you will protect X's beliefs to protect your self. Immune groups are "things we do," not "things we are."
  3.  **High Permeability / Low Exit Costs:** It must be socially costless to leave or to disagree. If dissent leads to "coldness" (Case 1), the cost of exit is too high. An immune structure normalizes factionalism or temporary coalitions without stigma.
  4.  **Negative Definition:** The group defines itself by what it is *doing*, not what it *believes*. A "Task Force" is more immune than a "Society." A "Coalition for X" is more immune than a "Party for X."
  5.  **No Rivalry:** Case 2 shows that proximity to a rival accelerates the drift. Immune organizations avoid defining themselves *against* a neighbor. They define themselves *toward* an external object (the problem to be solved).

  **Summary:**
  The phenomenon is **Identity-Constitutive Drift**. It is driven by the sociological need for **Boundary Maintenance** and the psychological mechanism of **Social Identity**. It does not require Weil's mystical collective; it emerges from individual incentives to belong. It is avoided only by organizations that refuse to become identities—those that are temporary, task-specific, and willing to dissolve the moment they succeed.
