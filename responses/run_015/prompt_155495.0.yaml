prompt: |-
  I facilitate governance design for cooperative housing associations—groups of thirty to two hundred households that draft their own charters and amend them by supermajority. Increasingly, these groups want to embed what I call Ulysses provisions: rules that are deliberately costly to overturn, meant to bind future residents to commitments made today, such as perpetual affordability covenants, bans on speculative resale, or mandatory environmental maintenance levies. The philosophical rationale is familiar—a collective, like an individual, may rationally precommit to avoid predictable failures of will or shortsightedness. But my clients also fear locking themselves into mistakes if conditions change radically, and they want something more nuanced than a simple sunset clause. I have been experimenting with a framework I term conditional rigidity with epistemic release: the idea that a precommitment should not dissolve automatically after a fixed term, but only when an independent internal review body, operating under its own locked procedural rules, certifies that the original rationale for the clause has become epistemically obsolete according to criteria specified in the charter itself. This creates a second-order binding—the group binds not only its future actions but also the conditions under which it may reconsider them.

  I need you to turn this combination of Ulysses-style constitutional precommitment and this second-order, conditionally locked release mechanism into an operational decision procedure my clients can actually run during charter drafting. The procedure should be ordered: the specific questions to ask about a proposed provision, what counts as a sufficient answer to advance to the next step, where the procedure stops with a clear recommendation not to precommit, and where it explicitly hands the decision to human judgment because the issue is one of values rather than institutional mechanics. It must handle hard cases—provisions that protect vulnerable members versus those that merely reflect current aesthetic preferences; release mechanisms that risk being captured by the very majorities the precommitment is meant to restrain; and situations where specifying the epistemic obsolescence criteria in advance seems impossible without smuggling in the desired conclusion. Please apply the procedure to three proposed charter clauses: a perpetual covenant capping resale prices at original purchase value plus inflation; an irrevocable rule requiring unanimous consent to approve emergency loans above a set threshold; and a clause mandating specific low-carbon heating infrastructure that is currently compulsory but might become technologically obsolete. For at least one of these, the procedure should yield a recommendation that my clients will dislike—perhaps that a deeply valued provision should not be precommitted, or that the release mechanism they want is structurally self-defeating. Also flag exactly which steps in your procedure are judgment calls disguised as technical checks, and state clearly what the procedure cannot do—where a cooperative must simply choose between competing visions of its own future self.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **User Role:** Facilitator of governance design for cooperative housing associations (30-200 households).
      *   **Context:** Groups draft charters, amend by supermajority.
      *   **Problem:** Clients want "Ulysses provisions" (hard-to-overturn rules for precommitment) but fear locking in mistakes. They want "conditional rigidity with epistemic release" (not a sunset clause, but a release triggered by an independent review body certifying the original rationale is epistemically obsolete based on charter-specified criteria).
      *   **Task:** Create an *operational decision procedure* for charter drafting.
      *   **Requirements:**
          *   Ordered steps (questions, sufficient answers, stop points).
          *   Distinguish between technical checks and value judgments.
          *   Handle hard cases (vulnerable members vs. aesthetics, capture risk, impossible criteria).
          *   Apply to three specific clauses:
              1.  Perpetual resale price cap (original + inflation).
              2.  Unanimous consent for emergency loans.
              3.  Mandatory specific low-carbon heating infrastructure.
          *   **Constraint:** For at least one clause, the procedure must yield a recommendation the clients will dislike (e.g., "don't precommit" or "release mechanism is self-defeating").
          *   **Constraint:** Flag steps that are judgment calls disguised as technical checks.
          *   **Constraint:** State clearly what the procedure *cannot* do (limits of institutional design).

  2.  **Analyze the Core Concept ("Conditional Rigidity with Epistemic Release"):**

      *   *Strength:* Avoids arbitrary sunsets; maintains commitment until the *reason* for the commitment vanishes.
      *   *Weakness:* Who defines "epistemically obsolete"? If the review body is internal, it risks capture. If external, it risks irrelevance. If criteria are too vague, the release is easy. If too specific, the release is impossible.
      *   *Philosophical Tension:* Precommitment vs. Democratic Sovereignty. A current majority binding a future majority is inherently anti-democratic unless justified by protecting rights or preventing catastrophic myopia.

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Goal:* Make it actionable.
      *   *Structure:* Phases.
          *   Phase 1: Legitimacy & Necessity (Should this be locked at all?)
          *   Phase 2: Definability of Obsolescence (Can we define when it ends?)
          *   Phase 3: Review Body Design (Who decides?)
          *   Phase 4: Stress Testing (Capture & Paradox)
      *   *Stop Rules:* If a phase fails, stop or downgrade the rigidity.
      *   *Judgment Flags:* Explicitly mark where human values override mechanics.

  4.  **Developing the Three Case Studies:**

      *   *Case 1: Resale Price Cap (Original + Inflation).*
          *   *Intent:* Perpetual affordability.
          *   *Risk:* Market divergence. If market rates skyrocket, the co-op becomes a lottery for buyers but a wealth trap for sellers.
          *   *Procedure Outcome:* Likely *disliked*. Precommitting "perpetually" to a specific formula might be economically suicidal or unjust to future sellers. The "epistemic obsolescence" is hard to define without admitting market reality, which undermines the cap.
      *   *Case 2: Unanimous Consent for Emergency Loans.*
          *   *Intent:* Prevent debt.
          *   *Risk:* Holdout problem. In a true emergency (roof collapse), one person can hold the co-op hostage.
          *   *Procedure Outcome:* Strong recommendation *against* precommitment. This is a classic "veto" trap. The release mechanism would need to be too easy to be useful, or too hard to save the building.
      *   *Case 3: Low-Carbon Heating Infrastructure.*
          *   *Intent:* Environmental commitment.
          *   *Risk:* Tech obsolescence.
          *   *Procedure Outcome:* Good candidate for epistemic release. "Obsolete" can be defined by efficiency standards or regulatory bans.

      *   *Selection for "Disliked Recommendation":* The Emergency Loan clause is the strongest candidate for a hard "No." It violates the basic functionality of a collective. The Resale Cap is also good for a "No" on *perpetual* rigidity. Let's go with the **Emergency Loan** clause for the hard "No" because it threatens the physical survival of the co-op, making the precommitment self-defeating. Or the **Resale Cap**, because it pits inter-generational equity against current ideology. Let's choose the **Resale Cap** for the nuanced "dislike" (it looks noble but fails the epistemic test) and the **Emergency Loan** for the structural "dislike" (it creates a veto). Actually, the prompt asks for *at least one*. I will make the **Emergency Loan** clause fail hard on structural grounds, and the **Resale Cap** fail on the "epistemic criteria" grounds (it's a value choice, not an epistemic one).

  5.  **Refining the Procedure Steps:**

      *   *Step 1: The Harm Test.* Is the risk being prevented a failure of *will* (myopia) or a difference of *values*? (Crucial distinction).
      *   *Step 2: The Obsolescence Definition.* Can "obsolete" be measured objectively?
      *   *Step 3: The Reviewer Independence.* Can the review body be insulated from the pressure the rule creates?
      *   *Step 4: The Sovereignty Check.* Does this prevent the co-op from surviving?

  6.  **Addressing the "Judgment Calls Disguised as Technical Checks":**

      *   Defining "Epistemic Obsolescence" is often a value judgment in disguise. (e.g., Is high market price "obsolete" for an affordability covenant? Or is it the *point*?)
      *   Selecting the Review Body members.

  7.  **Addressing "What the Procedure Cannot Do":**

      *   It cannot resolve conflicts between current and future notions of justice.
      *   It cannot guarantee the Review Body won't be captured.
      *   It cannot substitute for political culture.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, rigorous, slightly philosophical but actionable.
      *   *Formatting:* Clear headers, numbered lists, bold text for emphasis.
      *   *Self-Correction during drafting:* Make sure I don't just say "don't do it." I need to show *why* via the procedure steps. Ensure the "Epistemic Release" concept is central.

      *(Self-Correction on Case 1 - Resale Cap)*: If the goal is perpetual affordability, market changes don't make the *rationale* obsolete, they make the *cost* higher. So the epistemic release criteria would never be met. This means the lock is effectively permanent. The procedure should flag this: if the criteria can never be met, it's not conditional rigidity, it's a tombstone. This is a "disliked" outcome for those wanting flexibility.

      *(Self-Correction on Case 2 - Emergency Loans)*: Unanimity for emergencies is functionally a "death wish." The procedure should kill this at Step 1 (Survival/Harm).

      *(Self-Correction on Case 3 - Heating)*: This is the "success" case. Tech becomes obsolete. Standards change. Release mechanism works.

  9.  **Final Review against Constraints:**

      *   Ordered procedure? Yes.
      *   Stop rules? Yes.
      *   Three cases applied? Yes.
      *   One disliked recommendation? Yes (Emergency Loan & Resale Cap both get hard news).
      *   Flag judgment calls? Yes.
      *   State limitations? Yes.

  10. **Final Polish:** Ensure the language matches the user's sophisticated level ("epistemic release," "second-order binding").

  *(Drafting the response...)*
  *   *Intro:* Acknowledge the sophistication of the request.
  *   *The Protocol:* "The Precommitment Viability Protocol (PVP)."
  *   *Steps:* 1. Rationale Classification, 2. Obsolescence Operability, 3. Reviewer Independence, 4. Survival Constraint.
  *   *Application:* Run the three clauses through PVP.
  *   *Meta-Analysis:* Flag the judgment calls and limitations.

  *Wait, one nuance:* The user wants "Conditional Rigidity with Epistemic Release." I need to make sure the procedure tests *that specific mechanism*, not just precommitment in general. The key is: Can we define "epistemic obsolescence" without smuggling in the conclusion?
  *   *Resale Cap:* Is high market price "epistemic obsolescence"? No, it's economic pressure. The rationale (affordability) is *more* relevant when prices rise. So the release mechanism fails.
  *   *Emergency Loan:* Is an emergency "epistemic obsolescence"? No, it's a situational crisis. The rule (unanimity) is the problem, not the rationale.
  *   *Heating:* Is better tech "epistemic obsolescence"? Yes. The rationale (low carbon) remains, the *method* becomes obsolete. This fits.

  Okay, I have the logic. Proceeding to generate output.cw
answer: |-
  This is a sophisticated governance challenge. You are asking for a mechanism that preserves the *intent* of a Ulysses pact (binding future selves against myopia) while avoiding the *tyranny* of a Ulysses pact (binding future selves against necessary adaptation). The core tension lies in defining "epistemic obsolescence" without allowing the review body to simply vote based on current preferences.

  Below is the **Precommitment Viability Protocol (PVP)**. It is designed to be run during charter drafting workshops. It moves from philosophical justification to mechanical operability.

  ### The Precommitment Viability Protocol (PVP)

  **Instruction:** For every proposed "Ulysses Provision" (a clause intended to be super-majority resistant with conditional release), the drafting committee must pass the provision through the following four gates. If a provision fails a gate, it must either be redesigned, downgraded to a standard amendment rule, or rejected.

  #### Gate 1: The Rationale Classification Test
  **Question:** Is the risk being guarded against a *failure of will* (short-termism, panic, collective action problem) or a *shift in values* (changing notions of fairness, aesthetics, or lifestyle)?
  *   **Sufficient Answer to Advance:** The drafters can articulate a specific, documented collective action problem or cognitive bias that the provision solves (e.g., "We will undersave for repairs because current residents prefer lower fees").
  *   **Stop Rule:** If the primary motivation is to enforce a specific lifestyle preference or moral view that is not universally shared outside the group (e.g., "We want to ensure the co-op always looks rustic"), **STOP.** Do not precommit. This is a value conflict, not a commitment problem. Future majorities have the right to change values.
  *   **Judgment Flag:** *Distinguishing "values" from "will" is often a disguise for "how much do we trust the future?"*

  #### Gate 2: The Obsolescence Operability Test
  **Question:** Can the condition for "epistemic release" be defined using *external, verifiable metrics* rather than internal consensus?
  *   **Sufficient Answer to Advance:** The charter specifies criteria that can be certified by evidence without requiring a moral judgment (e.g., "Technology X is banned by national law" or "Efficiency of System Y drops below Z%").
  *   **Stop Rule:** If the criteria for release require the review body to determine if the *goal* is still "worthwhile" or "fair," **STOP.** You are building a value judgment into a technical release. This allows the review body to bypass the precommitment simply by reinterpreting the goal.
  *   **Judgment Flag:** *Defining "obsolete" often smuggles in the desired conclusion. (e.g., Is a resale cap "obsolete" when it causes financial hardship for sellers, or is that the intended sacrifice?)*

  #### Gate 3: The Reviewer Independence Test
  **Question:** Is the body empowered to certify obsolescence insulated from the pressure the precommitment creates?
  *   **Sufficient Answer to Advance:** The review body has a different constituency or selection method than the voting body that benefits from the release (e.g., a panel of long-term members + external experts, rather than the current Board).
  *   **Stop Rule:** If the body that votes on the release is the same body that gains the immediate benefit of the release (e.g., current owners voting to remove a resale cap to sell at market rate), **STOP.** This is not a release mechanism; it is a loophole.
  *   **Judgment Flag:** *Total independence is impossible in a small co-op. This step requires judging "sufficient distance," which is political, not technical.*

  #### Gate 4: The Survival Constraint
  **Question:** Does adhering to this provision in a worst-case scenario threaten the legal or physical existence of the cooperative?
  *   **Sufficient Answer to Advance:** The provision allows for emergency overrides that do not trigger the full release mechanism (e.g., a separate "distress" clause).
  *   **Stop Rule:** If the provision prevents the co-op from taking action necessary to avoid insolvency or physical collapse, **STOP.** A dead co-op cannot honor covenants.
  *   **Judgment Flag:** *Defining "existence" vs. "comfort" is a judgment call.*

  ---

  ### Application to Proposed Charter Clauses

  Here is the PVP applied to your three test cases.

  #### Case 1: Perpetual Resale Price Cap (Original + Inflation)
  *   **Intent:** Ensure perpetual affordability; prevent speculation.
  *   **Gate 1 (Rationale):** **PASS.** Addresses the collective action problem of gentrification and wealth extraction. It binds future will against market temptation.
  *   **Gate 2 (Obsolescence):** **FAIL.**
      *   *Analysis:* To trigger release, you must define when the cap is "epistemically obsolete." If the market price diverges significantly from the capped price, does that make the *rationale* obsolete? No, it makes the *cost* of the rationale higher. The rationale (affordability) is arguably *more* relevant when market prices rise.
      *   *Result:* You cannot define obsolescence without admitting the cap should be broken. If you write "Release allowed if cap causes financial hardship to sellers," you have effectively removed the precommitment, as any seller can claim hardship.
  *   **Gate 3 (Independence):** **FAIL.** The people seeking release (sellers) are members of the co-op. The people voting on release (buyers/other members) benefit from the cap.
  *   **Recommendation:** **DO NOT PRECOMMIT.**
      *   *Why clients will dislike this:* This strikes at the heart of their mission. However, the PVP reveals that "perpetual affordability" is a value commitment, not a structural precommitment. Locking this via epistemic release is structurally impossible because the "obsolescence" of affordability is a political choice, not an epistemic fact.
      *   *Alternative:* Use a "right of first refusal" model or a limited-term covenant (e.g., 30 years) rather than a perpetual lock with a fake release valve.

  #### Case 2: Unanimous Consent for Emergency Loans
  *   **Intent:** Prevent debt burden on future residents; ensure total consensus on risk.
  *   **Gate 1 (Rationale):** **PASS.** Prevents rash debt accumulation.
  *   **Gate 2 (Obsolescence):** **N/A.**
  *   **Gate 3 (Independence):** **N/A.**
  *   **Gate 4 (Survival):** **FAIL.**
      *   *Analysis:* In a true emergency (e.g., boiler explosion in winter, structural failure), the need for capital is immediate. Unanimity grants a single holdout veto power over the physical survival of the building.
      *   *Result:* This provision creates a "hostage situation" dynamic. No review body can fix this in real-time.
  *   **Recommendation:** **REJECT IMMEDIATELY.**
      *   *Why clients will dislike this:* They view unanimity as the pinnacle of democratic purity. The procedure identifies it as a suicide pact.
      *   *Alternative:* Supermajority (e.g., 80%) for emergency loans, with a higher threshold for non-emergency debt.

  #### Case 3: Mandatory Low-Carbon Heating Infrastructure
  *   **Intent:** Ensure environmental standards are maintained despite future cost-cutting temptations.
  *   **Gate 1 (Rationale):** **PASS.** Prevents future residents from sacrificing long-term environmental goals for short-term fee reduction.
  *   **Gate 2 (Obsolescence):** **PASS.**
      *   *Analysis:* Obsolescence can be defined technically. Criteria: "If Technology X is no longer compliant with National Building Code" or "If a superior technology exists with >50% efficiency gain and lower lifecycle cost, certified by an independent engineer."
      *   *Result:* This is genuinely epistemic. The *goal* (low carbon) remains; the *method* (specific tech) can be certified as obsolete.
  *   **Gate 3 (Independence):** **PASS (Conditional).**
      *   *Analysis:* The review body must include an external engineer or energy auditor, not just co-op members.
  *   **Gate 4 (Survival):** **PASS.** Heating can be repaired or replaced without dissolving the co-op.
  *   **Recommendation:** **APPROVE WITH CONDITIONS.**
      *   *Caveat:* The charter must explicitly name the third-party certification standard (e.g., "LEED Platinum equivalent" or "Passive House standard") to prevent the internal review body from lowering the bar under financial pressure.

  ---

  ### Meta-Analysis: Judgment Calls and Limitations

  You requested transparency on where this procedure masks value judgments as technical checks, and where it simply cannot help.

  #### 1. Judgment Calls Disguised as Technical Checks
  *   **Gate 1 (Will vs. Values):** There is no bright line between a "failure of will" and a "change of values." A future generation might view a resale cap not as "myopia" but as "unjust property restriction." The PVP forces the current drafters to categorize their preference as "rational precommitment," but a future generation may legitimately categorize it as "oppressive ideology." The procedure cannot solve this; it merely forces the current group to admit they are imposing values.
  *   **Gate 2 (Defining Obsolescence):** In the Resale Cap case, I ruled that market divergence is not "obsolescence." This is a philosophical stance. One could argue that if a mechanism destroys the market liquidity of the homes, the *mechanism* is epistemically broken. The PVP takes a hard line here to protect the integrity of the lock, but this is a choice to prioritize the *goal* over the *mechanism's viability*.

  #### 2. What the Procedure Cannot Do
  *   **It Cannot Prevent Capture:** Even with an "independent" review body (Gate 3), in a community of 200 households, social pressure is immense. An external engineer on the review board may be swayed by the community's desire to remove a costly mandate. The PVP assumes rational actors; it cannot account for social coercion.
  *   **It Cannot Resolve Inter-Generational Justice:** The PVP helps you lock a door, but it cannot tell you if you *should* lock it. If the current generation locks in a resale cap that benefits future low-income buyers but financially cripples future selling members (who may also be low-income), the PVP identifies the structural risk but cannot weigh the moral trade-off. That is a political choice the cooperative must make without the comfort of procedural cover.
  *   **It Cannot Predict Black Swans:** The "Survival Constraint" (Gate 4) handles known emergencies. It cannot handle radical contextual shifts (e.g., climate change makes the location uninhabitable, or national law outlaw the co-op model). In these cases, the "epistemic release" is irrelevant; the legal environment supersedes the charter.

  ### Summary Recommendation for Your Clients

  Tell your clients this: **Conditional Rigidity works only when the *method* might age, not when the *goal* might age.**

  *   **Heating Infrastructure:** The goal (low carbon) is stable; the method (tech) ages. **Use the Release Mechanism.**
  *   **Resale Cap:** The goal (affordability) is stable, but the *economic reality* changes. The release mechanism will either never trigger (making it a tombstone) or be manipulated (making it a joke). **Do not use the Release Mechanism.** Use a periodic review clause instead.
  *   **Emergency Loans:** The goal (solvency) requires flexibility. **Do not Precommit.**

  The "disliked" truth they must hear is that **Ulysses provisions are best suited for technical constraints, not moral covenants.** Trying to lock moral covenants with epistemic release mechanisms creates a false sense of security that often collapses under the weight of the first serious crisis.
