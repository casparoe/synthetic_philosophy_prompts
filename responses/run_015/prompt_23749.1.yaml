answer: |-
  Friends, colleagues, family.

  My uncle left specific instructions for this moment. He asked that I not tell you stories about him. He did not want anecdotes about his childhood, his career, or his kindness. He believed that a story is not an explanation. He believed that to truly understand an event—even the event of a life—you must not look at the unique details, but at the general rules that govern it. For him, truth was found in patterns, not in particulars.

  Out of respect for his intellect, and for the man who held these convictions, I will try to honor that request. I will not tell you a story. Instead, I will offer an analysis.

  If we were to apply my uncle's own method to his passing, we would look for the general conditions that made this outcome inevitable. We would say: All human beings are mortal. My uncle was a human being. Therefore, my uncle died. We might add further laws: Biological systems degrade over time. Stress accumulates. Seventy-eight years is a statistically common duration for a life in his context.

  If we stop there, we have satisfied his criteria. We have subsumed his death under a general law. We have explained *that* it happened.

  But look around this room. Look at the students who traveled from across the country, and the family who are struggling to breathe through their tears. Does that explanation—the logic of biological inevitability—account for what is happening here? Does the general law of mortality explain why *this* loss feels like a hole in the world that cannot be filled by another man of seventy-eight years?

  It does not.

  His method is perfect for understanding the movement of armies, or the shift of economies, or the rise of empires. It is designed to filter out the noise of the individual to find the signal of the pattern. But a life is not noise. A life is the signal.

  When we try to explain a singular human being using only general laws, we are left with a description of a specimen, not a person. We can explain the mechanics of his heart stopping, but we cannot explain the weight of his absence. We can categorize his profession, but we cannot categorize the specific way he challenged a student to think harder, or the specific silence he kept when a family member was hurting. Those things were not instances of a general rule. They were choices. They were singular.

  My uncle spent his life arguing that stories are merely comfort—that they impose a beginning, middle, and end on chaos to make us feel safe. He was right that stories comfort us. But he was wrong to think that makes them false.

  In history, as in love, the "why" is not found in the law. It is found in the contour of the specific. We do not grieve because a human died. We grieve because *he* died. The explanation of his life is not found in the statistics of his age, but in the irrepeatable sequence of his choices, his words, and his relationships. That sequence is what you call a story.

  He asked for no stories because he wanted the truth. But the truth of a person is not a formula. It is a narrative. To deny the story is to deny the very thing that made him who he was: his particularity.

  So, I must gently disobey him. Not by telling you tales of his past, but by acknowledging that the only way to explain him to you, and to explain our grief to ourselves, is to admit that he was not an example of a rule. He was an exception to every rule but one: that he was loved.

  That is not a law. It is a testimony. And it is the only explanation that fits the man we knew.

  Rest in peace.
