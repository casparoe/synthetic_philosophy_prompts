answer: |-
  Here is the decision tree for your ethics society session. It's designed to be printed out or projected, with students following the arrows based on their gut reactions to the cases. I've kept the language concrete and British, as requested.

  ### The Moral Trader Decision Tree

  **Q1: The £200 Budget**
  You and a mate both want the society's remaining £200 spent on your own projects. You're allowed to make a deal: you spend some on theirs, they spend some on yours, so you both get more of what you want than if you fought over it. **Would you make this deal?**
  *   **No** → Go to **Q2**
  *   **Yes** → Go to **Q3**

  **Q2: Why Not? (The Refusal Test)**
  *   **Branch A (Forbidden Actions):** Is there something you absolutely won't do to get the deal, even if it's harmless? (e.g. telling a small lie on the form, breaking a promise to someone else).
      *   **Yes** → **Leaf 1: The Hardliner**
      *   **No** → Go to **Q2b**
  *   **Branch B (Incomparable Values):** Is it because you genuinely can't compare the values? (e.g. "How can I trade money for poetry vs. football? They're just different kinds of good").
      *   **Yes** → **Leaf 2: The Incommensurabilist**
      *   **No** → (If you answered No to both, you're actually willing to trade, so go to **Q3**)

  **Q3: The Weirdo Test (Marmite)**
  A girl in your form says the only thing that matters is maximizing people trying Marmite before they die. She offers a trade: she campaigns for your project if you campaign for Marmite tasting. **Do you trade with her?**
  *   **No** → **Leaf 3: The Value Snob**
  *   **Yes** → Go to **Q4**

  **Q4: The Pointless Test (Crisps)**
  The Crisp Flavour Appreciation Society wants to trade. They think the moral goal is experiencing as many crisp flavours as possible. It's harmless, but seems totally pointless to you. **Do you trade with them?**
  *   **No** → **Leaf 4: The Utility Purist**
  *   **Yes** → Go to **Q5**

  **Q5: The Partner Test (AI & Futures)**
  Would you make a deal with an AI chatbot that seems to have preferences? Or with someone who doesn't hold those values yet (like your mate planning to go vegetarian) or doesn't exist yet (future people)?
  *   **No** → **Leaf 5: The Strict Humanist**
  *   **Yes** → Go to **Q6**

  **Q6: The Power Test (Rich Bullies)**
  Someone way richer and more powerful than you offers a deal. They can name the price and basically force the terms, but you still end up better off than without the deal. **Do you trade?**
  *   **No** → **Leaf 6: The Fairness First**
  *   **Yes** → Go to **Q7**

  **Q7: The Honesty Test (Liars)**
  You suspect someone is lying about what they value just to get a better deal (e.g. pretending to care about your cause to unlock funds). The deal still works out well for your cause. **Do you trade?**
  *   **No** → **Leaf 7: The Truth Seeker**
  *   **Yes** → Go to **Q8**

  **Q8: The Conversion Clause**
  The other side agrees to a clause where they don't just act differently, but actively try to *change* what they value to match yours (or vice versa). **Is this a valid part of the deal?**
  *   **No** → **Leaf 8: The Action-Only Trader**
  *   **Yes** → Go to **Q9**

  **Q9: The Systemic Test (Dodginess)**
  If everyone knows trades like this are available, people might adopt really extreme or unusual values just to get better bargaining terms. **Does this systemic risk stop you from trading?**
  *   **Yes** → **Leaf 9: The Systemic Skeptic**
  *   **No** → **Leaf 10: The Full Moral Trader**

  ***

  ### The Leaves (Your Possible Positions)

  1.  **The Hardliner**: Some actions are just off-limits, no matter how much good comes from them.
      *   *The awkward swallow:* You might have to let bad things happen because you won't get your own hands dirty.
  2.  **The Incommensurabilist**: Values are different kinds of things that can't be weighed against each other.
      *   *The awkward swallow:* You have to admit you can't really explain why you chose one charity over another without sounding arbitrary.
  3.  **The Value Snob**: You'll only trade with people whose values you think are sane.
      *   *The awkward swallow:* You admit you won't help someone just because their goal sounds silly to you, even if it costs you nothing.
  4.  **The Utility Purist**: You'll trade on harmless weirdness (Marmite) but not pointless weirdness (Crisps).
      *   *The awkward swallow:* You have to draw a line between 'fun' and 'waste' without sounding like a bore.
  5.  **The Strict Humanist**: Only existing humans count as trading partners.
      *   *The awkward swallow:* You ignore future people's suffering because they aren't here to shake your hand.
  6.  **The Fairness First**: You won't trade if the power balance is too skewed.
      *   *The awkward swallow:* You might leave value on the table because the deal feels uneven, even if you still gain.
  7.  **The Truth Seeker**: You won't trade with someone who is lying about their values.
      *   *The awkward swallow:* You have to walk away from a good deal because you can't trust the other person's word.
  8.  **The Action-Only Trader**: You'll trade actions, but you won't trade on changing deep values.
      *   *The awkward swallow:* You treat your friend's deep beliefs like a menu item they can't change.
  9.  **The Systemic Skeptic**: Individual deals are fine, but the practice itself incentivizes weirdness.
      *   *The awkward swallow:* You refuse a good deal now because you're worried about what it teaches everyone else.
  10. **The Full Moral Trader**: Any deal that increases overall value satisfaction is on the table.
      *   *The awkward swallow:* You have to admit you'd help a fascist build a school if they helped you build a hospital.

  ***

  ### Notes for the Session Leader

  **Indistinguishable Leaves**
  *   **Leaf 6 (Fairness First) and Leaf 7 (Truth Seeker):** In practice, these often look the same. Someone who refuses a deal because the partner is too powerful often refuses because the partner is being deceptive about their power. Your tree separates them logically (power vs. honesty), but in the room, the same person might occupy both leaves without seeing a difference.
  *   **Leaf 3 (Value Snob) and Leaf 4 (Utility Purist):** The line between "Marmite is weird but sane" and "Crisps are pointless" is very thin. Many students will say Yes to Marmite and No to Crisps, but when pressed, they'll struggle to explain the moral difference between a weird food goal and a weird sensory goal.

  **Unoccupied Combinations**
  *   **Yes to AI Partners, No to Future People:** Nobody seems to occupy this spot. If you are willing to trade with a non-human intelligence (AI), it is logically inconsistent to refuse to trade on behalf of humans who don't exist yet. This view is likely **incoherent**; usually, accepting one implies accepting the other as "non-standard agents".
  *   **Yes to Conversion Clauses, No to Value Futures:** If you agree that values can be changed via a contract (Conversion), you implicitly agree that values aren't fixed. It is rare to find someone who says "You can change your values for money" but "We can't trade with your future self who holds different values". This view is **unattractive** because it treats values as flexible tools for deals but rigid barriers for time.
  *   **Yes to Systemic Risk, but Full Trader Otherwise:** It is very rare to find someone who accepts all the specific deals (Liars, Rich Bullies, Conversion) but stops only at the systemic level. Usually, if you worry about the system, you stop at the first shady deal. This view is **under-developed**; people haven't bothered to hold the tension between "this deal is good" and "this practice is bad".

  **Predictions for Your Year Group**
  *   **Most Common Leaf:** I'd guess **Leaf 3 (The Value Snob)** or **Leaf 6 (Fairness First)**. Sixth-formers are often morally intuitive but skeptical of "weird" ethics (like the Crisp Society) or uncomfortable with power imbalances (the Rich Partner). They want to do good, but only on sensible terms.
  *   **Hardest to Argue Against:** **Leaf 9 (The Systemic Skeptic)**. In a room full of stubborn students, this is the strongest position because it doesn't attack the individual deal (which looks good) but attacks the *incentive structure*. It's hard to prove them wrong without showing that people *won't* actually adopt extreme values just to game the system, which is an empirical claim you can't settle in a session.
