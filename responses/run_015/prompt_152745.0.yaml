answer: |-
  **Working Phase**

  1.  **Post-dictive Motion (Flash-Lag):** Show moving object and flash; subject reports alignment. *Breaks:* Both models accommodate this as either processing lag (Theater) or narrative smoothing (Drafts); no divergence on confidence or motor trajectory.
  2.  **Change Blindness with Cue:** Show image, mask, changed image, then cue. *Breaks:* Tests memory access, not perceptual fixation timing; both predict failure to see without attention, yielding identical null results.
  3.  **Forced-Choice with Delayed Mask:** Stimulus, then mask at variable SOA. *Breaks:* Masks simply destroy information; doesn't test revision of *existing* content during motor output, only degradation of input.

  **Final Experimental Scenario**

  Healthy undergraduates fixate centrally. A near-threshold Gabor patch (tilted slightly left or right) appears for 50ms. The subject grasps a force-sensitive lever to report tilt direction by pushing left or right. Crucially, when grip force exceeds 10% of maximum (movement initiated but not completed), a high-contrast "noise" Gabor (randomly left or right) flashes for 50ms. Subjects are explicitly told this noise is random and uncorrelated with the target (50% validity). A control condition presents the noise at stimulus onset. We measure final lever position, confidence (1–5 scale), and movement trajectory latency.

  **Predictions by Model**

  | Dependent Measure | Cartesian Theater Prediction | Multiple Drafts Prediction |
  | :--- | :--- | :--- |
  | **Report Content** | **Fixed to Initial Stimulus.** If revision occurs, it is rare. | **Shifted toward Noise.** The draft is revised using available data before finalization. |
  | **Confidence** | **Depressed on Revision.** Conflict between fixed experience and late info creates uncertainty. | **High/Seamless.** The revision *is* the experience; no conflict is detected by the subject. |
  | **Latency/Distribution** | **Bimodal/Slower.** Fast trials (ignore noise) vs. slow trials (deliberate revision). | **Unimodal/Normal.** Single continuous process; no switch in processing mode required. |

  **Reasoning:** The Theater posits a definite moment where content becomes conscious. If movement initiates, that moment has passed; late info cannot alter experience without cognitive override (low confidence, high latency). The Drafts model posits parallel streams finalized only by probe; late info is simply another draft contributor, integrated seamlessly before the motor act completes.

  **Critical Feature and Ablation**

  The work is done by the **response-locked timing** (force threshold). This ensures the late information arrives *after* the commitment to act has begun but *before* the act is finalized. If you remove this and use fixed timing (e.g., noise always 200ms post-stimulus), the Theater theorist claims the "moment of consciousness" simply hadn't happened yet due to processing lag. The response-lock forces the Theater to admit the subject had already begun acting on a "conscious" decision, yet the experience changes without the signature of cognitive override. Without the force trigger, the case collapses into ordinary backward masking, which both theories explain as input degradation rather than content revision.

  **Theater Defender's Replies**

  1.  **Phenomenal vs. Access Consciousness:** The defender claims the *experience* was fixed (Phenomenal), but the *report* was altered (Access). *Evaluation:* This is a retreat that costs the Theater its explanatory point. It renders consciousness causally inert regarding the report, making the "Theater" undetectable in principle. The Drafts theorist answers that if the subject reports high confidence, there is no phenomenological difference to preserve; positing a hidden, inaccessible experience is ontologically extravagant.
  2.  **Unconscious Motor Initiation:** The defender claims the hand movement was driven by unconscious processing, so the revision happened before consciousness. *Evaluation:* This saves the Theater but requires positing "zombie" judgments that mimic confident reporting. The Drafts theorist answers that this merely relabels "conscious" as "whatever happens late," conceding that there is no special *place* or *time* for assembly, which was the original dispute.

  **Conclusion: What the Case Is For**

  If the study runs as predicted, it refutes the claim that there is a determinate fact about *when* a content became conscious, independent of the probe. It shows that the "order" of experience is fixed relative to the report, not absolutely. However, it does not settle whether qualia exist; it settles that their *timing* is not a property of the neural event itself but of the narrative construction. The dispute was partly verbal: the Theater theorist wants to reserve "conscious" for the first draft, while the Drafts theorist reserves it for the final edit. But behaviorally, the case proves there is no single finish line where the brain stops editing and starts showing the movie.
