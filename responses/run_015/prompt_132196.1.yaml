  I centered the ruling on the Orwellian/Stalinesque impasse, admitting empirical undecidability while forcing a binary administrative choice. The unease (Req 3) arises from the Bureau's casual redefinition of consciousness as a "draft" finalized by paperwork, implying memory cannot be trusted even by the subject. The tone remains sincerely bureaucratic throughout.
