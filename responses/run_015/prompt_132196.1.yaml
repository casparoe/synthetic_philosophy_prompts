  5. Section 9.1 of the Consortium Charter mandates solvency over metaphysical accuracy.
  6. Override 12-B allows adjudicators to resolve paradoxes via fiscal necessity. This override was enacted following the "Dream Lag" Crisis of 2045.
  7. This aligns with the Memora Doctrine of Secondary Qualia, which posits that the report constitutes the final reality of the experience.
  8. Policy 7.1, Subsection C (Temporal Integrity). Consciousness is deemed finalized only upon signature.

