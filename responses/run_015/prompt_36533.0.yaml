          *   Elimination of false options via external evidence (Kant, Absolute Space).
          *   Convergence on a framework even without final truth (Parfit).
          *   Maturation into science (Psychology).
      *   *What does NOT count as progress?*
          *   Mere proliferation of unrefuted views (Mind-Body).
          *   External societal changes not driven by philosophical argument (Ethics/Abolition).
      *   *The Crucial Distinction:* The user distinguishes between *internal* philosophical work leading to scientific offshoots (Psychology = Good) vs. *external* societal shifts aligning with philosophical views (Ethics = Bad). They also distinguish between *dissolving* a problem via science (Absolute Space/Kant = Good) vs. *ignoring* a problem (Mind-Body = Bad?).

