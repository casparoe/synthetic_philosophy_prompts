          *   *Resolution:* The "Cheating" objection. Spawning psychology is progress because the *philosophical groundwork* made the science possible (conceptualizing the mind as a studyable object). Social moral improvement is different because philosophers didn't necessarily *cause* abolition via argument alone; material/historical forces did.
          *   *Principle:* Progress = **Methodological Maturation.** If philosophy builds the ladder that science climbs, that's progress. If society changes without philosophical argument being the primary driver, that's not *philosophical* progress.

      *   **Free Will (Libet/Neuroscience):**
