          *   *Recommendation:* Shift the metric. Progress isn't fewer theories; it's better understanding of the *costs* of each theory. We know *why* dualism is hard (interaction problem), we know *why* physicalism is hard (qualia). That's diagnostic progress.

      *   **Psychology vs. Ethics:**
