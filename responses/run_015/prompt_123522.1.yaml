answer: |-
  This is an excellent question. You are right to be suspicious: your instincts (and your professor's and TA's) are significantly more accurate than the text you are reading. The passage you found is a classic example of a "popularization" that sacrifices technical precision for a catchy narrative, resulting in several claims that are either misleading, outdated, or outright false from the perspective of modern constructive mathematics.

  Here is a claim-by-claim breakdown of what is going on, distinguishing between what a constructivist accepts, what is a half-truth, and what is simply wrong.

  ### 1. "Intuitionistic logic is simply classical logic with the law of the excluded middle deleted."
  *   **Verdict:** **Half-True / Oversimplification.**
  *   **The Nuance:** It is true that Intuitionistic Logic (IL) does not include the Law of Excluded Middle (LEM: $P \lor \neg P$) or Double Negation Elimination ($\neg\neg P \to P$). However, saying it is "simply deleted" suggests the meanings of the other connectives remain the same. They do not.
  *   **Constructive View:** In classical logic, $P \lor Q$ means "at least one is true." In intuitionistic logic, $P \lor Q$ means "I have a proof of $P$ **or** I have a proof of $Q$." This is a much stronger condition. Similarly, $\exists x \phi(x)$ means "I can construct a specific $x$ and prove $\phi(x)$."
  *   **Your Prof's Point:** Your professor deriving $\neg\neg(P \lor \neg P)$ is a standard exercise to show that LEM is not *false* in intuitionistic logic (it is not contradictory), it is just *unprovable*. Intuitionists don't assert $\neg(P \lor \neg P)$; they assert $\neg\neg(P \lor \neg P)$. The text implies intuitionists think LEM is false, which is incorrect.

  ### 2. "They cannot use proof by contradiction at all."
  *   **Verdict:** **False.**
  *   **The Nuance:** This is the most common misconception about intuitionism. There are two forms of "proof by contradiction":
      1.  **Negation Introduction:** Assume $P$, derive a contradiction ($\bot$), conclude $\neg P$. (**Valid** in Intuitionism).
      2.  **Classical RAA (Reductio ad Absurdum):** Assume $\neg P$, derive a contradiction ($\bot$), conclude $P$. (**Invalid** in Intuitionism).
  *   **Your Experience:** You mentioned using "assume $P$, derive contradiction, conclude not-$P$" in homework. That is perfectly valid intuitionistic reasoning. The text conflates the two forms and claims intuitionists can never reason from a contradiction, which would make mathematics impossible.

  ### 3. "Truth value can change as our knowledge grows."
  *   **Verdict:** **Half-True / Philosophically Loaded.**
  *   **The Nuance:** This refers to Brouwer's "Creating Subject" arguments. For a strict Brouwerian intuitionist, mathematical truth is tied to the mental construction of the mathematician. A statement like "There are 7 consecutive 9s in the decimal expansion of $\pi$" is currently neither true nor false until we compute enough digits to decide it.
  *   **The Problem:** Phrasing it as "truth value changes" sounds like relativism (i.e., $2+2=4$ could become false). Constructivists would say the *warranted assertibility* changes, not that established truths flip. Once you have a proof, it remains a proof. Modern constructivists (like Bishop) often downplay this temporal aspect in favor of a more static "algorithmic" view.

  ### 4. "In intuitionistic analysis every function from the reals to the reals is provably continuous... which is plainly absurd and refutes the whole program."
  *   **Verdict:** **True Claim, False Interpretation.**
  *   **The Fact:** It is a theorem in Brouwer's intuitionistic analysis that all total functions $f: \mathbb{R} \to \mathbb{R}$ are continuous.
  *   **Why it's not "Absurd":** This follows from the constructive definition of a function. To compute $f(x)$ to a certain precision, you only have finite information about $x$. If a function were discontinuous, knowing $x$ to finite precision would not guarantee you know $f(x)$ to finite precision (think of a step function at the jump). Therefore, a discontinuous function is not *computable* in the constructive sense.
  *   **The Bias:** The author calls this "plainly absurd" because they are assuming the **classical** definition of real numbers and functions. For an intuitionist, this theorem is a *feature*, not a bug. It ensures that all functions are computable. It does not "refute the program"; it defines the boundaries of the program. You lose some classical theorems, but you gain computational guarantees.

  ### 5. "Anything proved intuitionistically comes with an algorithm attached... intuitionistic mathematics is really a branch of computer science."
  *   **Verdict:** **Half-True / Misleading (Your TA was right).**
  *   **The Truth:** This refers to the **Curry-Howard Correspondence** and **Realizability**. There is a deep connection between proofs and programs. If you prove $\forall x \exists y \phi(x,y)$ intuitionistically, you can often extract a function $f$ such that $\phi(x, f(x))$ holds.
  *   **The Misleading Part:**
      1.  **Extraction is Meta-Mathematical:** The algorithm isn't always "attached" in the sense that it's written next to the proof. You often need a separate meta-theorem to extract the program from the proof.
      2.  **Not Just CS:** Reducing intuitionism to "just computer science" dismisses its philosophical claim to be the *true* foundation of all mathematics. Brouwer didn't think he was doing CS; he thought he was fixing the errors of Cantor and Hilbert.
      3.  **Axioms Break It:** If you add certain axioms to an intuitionistic system (even some constructive ones), you can break the "algorithm extraction" property. So it's not true of *any* intuitionistic proof, only those in specific systems (like Heyting Arithmetic or Type Theory).

  ### 6. The Footnote: "Intuitionistic systems actually validate the full axiom of choice... offers that as a final reductio."
  *   **Verdict:** **Technically True in some systems, but the argument is confused.**
  *   **The Context:** In Classical Set Theory (ZFC), the Axiom of Choice (AC) is controversial because it asserts existence without construction (e.g., Banach-Tarski). In Intuitionistic Type Theory, a version of AC is often a **theorem**, not an axiom. Why? Because $\forall x \exists y \phi(x,y)$ *already means* there is a function choosing $y$ for each $x$. So asserting AC adds nothing new; it's built into the meaning of the quantifiers.
  *   **The Reductio:** The author is using a "Gotcha!" argument.
      *   *Classical Mathematician:* "AC is dangerous/controversial!"
      *   *Author:* "Ha! Intuitionists accept AC!"
      *   *Constructivist:* "We accept AC *because* it is constructive. We reject LEM."
  *   **The Catch (Diaconescu's Theorem):** There is a famous result called **Diaconescu's Theorem** which shows that in constructive *set theory*, the Full Axiom of Choice actually **implies** the Law of Excluded Middle. So, if an intuitionistic system validates *Full* AC, it collapses back into classical logic!
  *   **Conclusion on Footnote:** The footnote is muddying the waters. Constructivists usually accept *Dependent Choice* or *Countable Choice*, but Full AC is often avoided precisely because it brings back LEM (via Diaconescu). If the text claims Intuitionism validates Full AC *and* stays intuitionistic, it is ignoring Diaconescu. If it claims Intuitionism validates Full AC and therefore is bad, it is using a classical prejudice to attack a system that defines "good" differently.

  ### 7. "Intuitionistic mathematics is... a rival to ordinary mathematics." (vs "branch of CS")
  *   **Verdict:** **False Dichotomy.**
  *   It *is* a rival foundation (ontologically), but it is also a tool for CS (computationally). The text tries to dismiss its philosophical weight by reducing it to a CS tool.

  ### Summary: What should you trust?

  1.  **Trust your Professor:** The logic rules (Negation Introduction is valid, LEM is not) are standard. The derivation of $\neg\neg(P \lor \neg P)$ is standard intuitionistic logic.
  2.  **Trust your TA:** The claim that "proof = algorithm" is a powerful insight (Curry-Howard), but saying intuitionism is *just* CS is a category error. It ignores the philosophical motivation regarding the nature of mathematical truth.
  3.  **Be Skeptical of the Text:**
      *   It conflates the two types of proof by contradiction.
      *   It treats the "all functions are continuous" theorem as a refutation rather than a consequence of constructive definitions.
      *   It uses the Axiom of Choice as a "gotcha" without understanding that constructivists view AC differently than classical mathematicians do.

  **The Bottom Line:** The chapter is written from a **Classical Realist** perspective looking *out* at Intuitionism. It describes intuitionism accurately in terms of *what theorems it lacks* (from a classical view) but inaccurately regarding *why it lacks them* and *what it gains*. It frames the differences as "losses" (you lose LEM, you lose discontinuous functions) rather than "trade-offs" (you gain computational content, you gain consistency with computability).

  For your seminar, treat the text as a primary source for **how classical mathematicians criticize intuitionism**, not as a neutral description of what intuitionism *is*. Your professor and TA are giving you the internal perspective of the system; the book is giving you the external critique. Both are useful, but only one is technically accurate about the rules of the system.
