  the panel has to decide: is this honest or deceptive?

  i want you to predict what they'd rule if they're being consistent with themselves, point to the closest past analog, and lay out the competing rules that fit their track record just as well. then tell me which of those rules your prediction relies on, what principle they'd be implicitly adopting either way, and name one further case that'd actually split the rules apart. don't just list possibilities and shrug — take an actual stance, say why you think it's the right read of their preceedents, and be upfront about where the preceedents genuinly don't settle it.
