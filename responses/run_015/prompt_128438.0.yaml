prompt: |-
  Me and my roommate have been going in circles about Sen's whole thing that famines are never really about food shortage, they're about entitlement failure. I'm the one defending Sen — I keep pointing to the Bengal 1943 famine where rice was actually available but people starved because wages collapsed and the British adminstration messed up relief distribution. He thinks that's half the story but not the whole thing; he says the Irish potato blight was genuinely an ecological shock that killed the crop regardless of policy, and even in the Great Leap Forward you can't just blame politics when there's drought and bad harvest reporting. We want to actually produce something useful instead of repeating ourselves, so can you draft the adversarial-collaboration document we should have written?

  We need it structured like this: first a numbered list of claims we both can sign — stuff about what actually happened in those three cases, about the formal distinction between food availability decline and entitlement collapse, about democratic institutions and information flow, and about what counts as a "natural" trigger versus an institutional amplifier. Then a disagreements table with my side's view (that in all three the primary driver was entitlement collapse caused by policy or institutional failure, with natural triggers being neither necessary nor sufficient for mass starvation) and his side's view (that ecological or natural triggers are structurally necessary conditions and that Sen's framework systematically undervalues them), each phrased so the person holding it would accept the wording. Then the cruxes — I think the big ones are (a) whether a natural trigger can ever be the "real" cause if political structures amplify mortality, and (b) whether Sen's democracy-prevents-famine thesis holds up when you compare information failures inside authoritarian regimes versus open ones. For each crux, include a concrete hypothetical or historical comparison we both agree is relevant — maybe two regions with identical drought exposure but different political structures — and write down in advance what each of us predicts we'd see. Try not to just copy-paste the standard textbook summary; inject something weirder and more specific, like framing the disagreement around counterfactual entitlement mapping inside information-blocked regimes, so it's not something either of us could have pulled from an intro course. And please don't include a bibliography or ask for citations — we just want the conceptual structure mapped out precisely, with maybe a typo or two left in since we're writing this for real.
