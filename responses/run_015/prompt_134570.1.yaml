answer: |-
  ### Tutorial Plan: The New Riddle of Induction (Amphibian Case Study)

  **Total Time:** 50 Minutes
  **Goal:** Distinguish Humean skepticism (justification of induction) from Goodman's problem (selection of projectible predicates) using a biological taxonomy case.

  ---

  #### 1. Explanatory Arc and Dependency Order

  You must strictly sequence the concepts to prevent the collapse of Goodman's problem into Hume's. The dependency relation is hierarchical: students must accept the *practice* of induction (bracketing Hume) before they can analyze the *rules* of induction (Goodman).

  **Phase 1: The Humean Baseline (Minutes 0–10)**
  *   **Content:** Briefly recap Hume's problem: we assume the future resembles the past, but this assumption cannot be justified deductively or inductively without circularity.
  *   **Dependency:** Establish that for the sake of this tutorial, we are *provisionally accepting* induction as a valid practice. We are not asking *if* we should predict the unobserved, but *how*.
  *   **Transition:** State clearly: "Hume asks if the bridge from observed to unobserved exists. Goodman asks why we choose this specific bridge rather than that one."

  **Phase 2: The Amphibian Case Construction (Minutes 10–20)**
  *   **Content:** Introduce the biological scenario.
      *   **Subject:** A genus of amphibians (*Ambystoma novus*) with a chromatic trait that stabilizes only post-metamorphosis.
      *   **Data:** 500 observed specimens, all post-metamorphic, all displaying "Verdant" pigmentation.
      *   **Target:** The 501st specimen, currently in metamorphosis, to be observed next week.
  *   **Dependency:** This provides the shared evidence base ($E$) required to demonstrate that two incompatible hypotheses can be equally supported by the same data.

  **Phase 3: The Predicate Conflict (Minutes 20–30)**
  *   **Content:** Introduce the two competing predicates.
      *   **Predicate A ("Verdant"):** Standard color description. Prediction: 501st specimen will be Verdant.
      *   **Predicate B ("Survey-Cohort Chromatic"):** Defined as: "Verdant if observed within the first 500 specimens of this survey, Blue if observed thereafter." Prediction: 501st specimen will be Blue.
  *   **Dependency:** This step relies on Phase 2. It demonstrates that both predicates fit the existing evidence ($E$) perfectly but diverge on the prediction ($P$).
  *   **Crucial Move:** Do not define Predicate B using "Time" (e.g., "before year 2025"). Define it using *sample membership* (e.g., "first 500 observed"). This prevents the reduction of the problem to a simple temporal index.

  **Phase 4: Projectibility and Entrenchment (Minutes 30–40)**
  *   **Content:** Explain why we reject Predicate B despite its logical fit. Introduce "projectibility" as the filter. Briefly explain "entrenchment" as the history of a predicate's successful use in past projections, not its current truth.
  *   **Dependency:** This resolves the conflict generated in Phase 3. It is only intelligible because Phase 1 established we are looking for rules of projection, not justification of induction itself.

  **Phase 5: Assessment (Minutes 40–50)**
  *   **Content:** Deploy the closing question and debrief.

  ---

  #### 2. The Amphibian Case: Properties and Presentation

  To succeed, this case must avoid the pitfalls of the emerald example while preserving the logical structure of *grue*.

  **Required Properties:**
  1.  **Stage-Dependence:** The trait must emerge post-metamorphosis. This adds biological realism and prevents students from dismissing the predicate as "obviously fake" (since biological traits often change with development).
  2.  **Sample-Bias Potential:** The observed sample must be selectable in a way that allows for a "cohort" definition.
  3.  **Lack of Ontological Weight:** The criterion dividing the predicates must *not* be a known biological variable (like sex or habitat). If you use "Northern vs. Southern" populations, students will treat it as a legitimate biological hypothesis.

  **How to Present the Predicates (Avoiding the "Time" Trap):**
  *   **Do not say:** "Green if observed before time $T$."
  *   **Do say:** "Verdant if member of Survey-Batch-1; Blue if member of Survey-Batch-2."
  *   **Rationale:** By anchoring the predicate to the *survey batch* rather than the *calendar*, you force students to confront the epistemic nature of the problem. It is not about the passage of time; it is about the *order of observation*.
  *   **Instruction:** Explicitly tell students: "Treat 'Survey-Batch' as a classification label, not a date. Hypothesis B claims the color depends on which batch the specimen belongs to. Since all observed specimens are Batch 1, Hypothesis B fits the data perfectly."

  **Why this carries the idea better than emeralds:**
  Emeralds are static; amphibians change. This makes the "projection" feel more like a scientific generalization about a natural kind. It raises the stakes: if we choose the wrong predicate, we aren't just wrong about a color; we are wrong about the biological taxonomy. This highlights that the problem is about *classification systems*, not just sensory data.

  ---

  #### 3. Anticipated Misconceptions and Intervention Points

  **Misconception 1: "Goodman is just restating Hume."**
  *   **Student Thought:** "This is just saying we can't be sure about the future."
  *   **Intervention Point:** **End of Phase 1.**
  *   **Correction:** Explicitly state: "Hume doubts the *engine* of induction. Goodman assumes the engine works but asks why we put *this fuel* in it rather than *that fuel*. We are not asking if we should predict; we are asking which prediction is valid given that we *are* predicting."

  **Misconception 2: "Grue is just a hidden time predicate."**
  *   **Student Thought:** "Predicate B is just 'Green before next week'. That's cheating."
  *   **Intervention Point:** **During Phase 3 (Predicate Definition).**
  *   **Correction:** When defining "Survey-Cohort Chromatic," forbid the use of dates. Insist on "Batch 1 vs. Batch 2." If a student raises the time objection, ask: "If the survey took 10 years for the first 500 specimens, and the 501st is found the next day, is it time that matters, or the *completion of the sample set*?" Force them to see the logical structure is about *sample membership*, which functions like time but is conceptually distinct.

  **Misconception 3: "Entrenchment is just linguistic popularity."**
  *   **Student Thought:** "We just use 'Green' because we say it more. It's a convention."
  *   **Intervention Point:** **During Phase 4.**
  *   **Correction:** Clarify that entrenchment is not about how often a word is *spoken*, but how often a predicate has been successfully *projected* in past inferences. It is a track record of utility, not a vote. "Verdant" is entrenched because it has survived previous metamorphoses, not because it is a common word.

  ---

  #### 4. Closing Assessment Question

  **The Question:**
  "Suppose we expand our evidence base. We observe 5,000 more amphibians, all from Survey-Batch-1, and all are Verdant. Does this new evidence make the 'Survey-Cohort Chromatic' hypothesis (Batch 1 = Verdant, Batch 2 = Blue) less rational to hold than the 'Verdant' hypothesis?"

  **Expected Correct Understanding:**
  Students should answer **No**.
  *   **Reasoning:** Both hypotheses fit the expanded data perfectly. The "Survey-Cohort" hypothesis predicts Batch 1 will be Verdant (confirmed) and Batch 2 will be Blue (untested). Accumulating more evidence of the *same type* (Batch 1) does not distinguish between the predicates.
  *   **What this tests:** It confirms they understand that the problem is not a lack of evidence (Humean), but a structural ambiguity in predicate choice (Goodmanian). If they answer "Yes, it makes it less rational," they have reverted to thinking more data solves the riddle, missing Goodman's point entirely.

  ---

  #### 5. Technical Exclusions (Out of Scope)

  To maintain clarity for second-year undergraduates within 50 minutes, explicitly exclude the following:

  1.  **Formal Apparatus of Entrenchment:** Do not introduce Goodman's specific rules for overriding entrenchment (e.g., the hierarchy of conflicting hypotheses). Keep the concept qualitative ("history of successful projection").
  2.  **Counterfactual Conditionals:** Do not dive into the debate over whether projectibility is defined by support for counterfactuals (e.g., "If this had been observed, it would have been green"). This creates a circularity debate that will consume the session.
  3.  **Formal Languages:** Do not discuss "positional" vs. "qualitative" predicates in terms of logical syntax or formal language constraints. Keep the distinction grounded in the biological case study.
  4.  **The "Full Taxonomy" of Projectibility:** Do not attempt to categorize all types of non-projectible predicates. Focus solely on the specific conflict between the two presented predicates.

  **Instruction to Tutor:** If a student asks about these excluded topics, acknowledge the complexity ("That is a deeper technical layer we aren't covering today") and redirect them to the core distinction between evidence accumulation and predicate selection.
