  9.  **Final Polish:** Check tone. Instructional, planning-oriented, not lecturing. Ensure all 5 constraints are met explicitly.

      *(Self-Correction on the Amphibian Case)*: I need to be very careful that the "Grue" predicate doesn't look like a *rival scientific theory*. If I say "Lineage Alpha is Green, Lineage Beta is Blue," that's a valid biological hypothesis. Goodman's point is about *predicates* that fit the data equally well but one is "gruesome."
      *Solution:* The "Grue" predicate must be defined *in terms of the observation set itself*, not an independent biological variable.
      *Revised Predicate 2:* "Observed-Phase Green." Defined as: Green if observed in the current survey phase; Blue if observed in the next survey phase.
