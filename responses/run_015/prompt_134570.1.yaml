  2.  **Deconstruct the Philosophical Problem:**
      *   *Hume:* Justification of induction itself. Why assume the future resembles the past? (Skepticism about the *principle*).
      *   *Goodman:* Given we *do* induct, *which* patterns do we project? (Problem of *projectibility*).
      *   *The Trap:* Students often think Goodman is just saying "induction is hard" (Hume) or that "grue" is just a silly time-dependent word.
      *   *The Case:* Amphibians. Life stages (tadpole -> adult). Trait (color).
      *   *The Predicates:* Need two competing hypotheses that fit the data but diverge on the unobserved. One "natural" (green), one "grue-like" (e.g., "chromatic-shift" based on observation date or batch).
