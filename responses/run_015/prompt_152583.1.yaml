      *   **User's "Missing Something" Hypothesis:**
          *   Is *Fortuna* actually the inertia of existing institutions rather than pure randomness?

  3.  **Evaluate Against Machiavelli Scholarship:**
      *   *Virtù:* Generally agreed by scholars (Skinner, Pocock, Mansfield) that it is *not* moral virtue in the Christian/Aristotelian sense. It is efficacy, prowess, manliness. However, it's not *purely* reactive; it involves foresight and shaping circumstances.
      *   *Hatred:* Machiavelli explicitly says a prince *can* be feared but *must not* be hated. Why? Because hatred leads to conspiracies. This supports the Friend's instrumental view, *but* the User argues it implies a constraint. The constraint is political stability, not morality.
