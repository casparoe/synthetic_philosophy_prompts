      *   *Stability vs. Reactivity:* Machiavelli criticizes those who cannot change their nature to fit the times (e.g., Pope Julius II succeeded because his impetuosity matched the times; if times changed, he would have failed). This suggests *virtù* is the ability to adapt, but having a consistent "mode of proceeding" is also risky.
      *   *Institutional Inertia:* This is a modern political science reading (e.g., Skinner's contextualism or later institutionalist readings). *Fortuna* is often external circumstances, but in *The Discourses*, it's more about cyclical history and institutional decay. In *The Prince*, it's more about contingency.

  4.  **Adjudication - Move by Move:**

      *   **Move 1: Virtù as Adaptive Skill vs. Moral Content.**
