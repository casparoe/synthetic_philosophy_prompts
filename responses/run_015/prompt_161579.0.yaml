  7.  **Address the Friend's Objection (1 vs 2):**
      *   Why she's wrong: Causal relevance doesn't require distinctness. The disposition is the basis *considered modally*. The basis does the causing *because* it is that disposition. No overdetermination because they aren't two events; they are one event under two descriptions (categorical vs. modal).

