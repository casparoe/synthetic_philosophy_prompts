  6.  **Develop Repairs:**

      *   *Chaperone:* Either admit the disposition is extrinsic (drop 3), or admit the Stimulus includes the ion (modify 5/Chaperone verdict), or treat the ion as a "negative mask" that is usually absent? (Too convoluted).
      *   *Cheapest Repair:* Modify the verdict on the Chaperone. Accept that "Soluble" means "Soluble in *appropriate* solvent." If pure water isn't appropriate, the stimulus description was wrong. This saves (3) and (4). Cost: Concede to the "gerrymandering" charge slightly, but argue it's principled (natural kinds of solvents).
