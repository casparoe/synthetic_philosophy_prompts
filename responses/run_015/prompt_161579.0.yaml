      *   (3) *Intrinsicness:* Dispositions supervene on intrinsic properties. (Supports finkish cases/packed glass).
      *   (4) *Reformed Conditional Analysis (RCA):* Disposition = Basis + (If S & Retain B & No Masks -> M). Distinguishes Finks (persistence clause) from Masks (blocking clause).
