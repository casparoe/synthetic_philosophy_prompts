answer: |-
  Aaron Kellner: The moral force of meritocracy relies on the idea that individuals are responsible for the contributions they make. But consider the source of those contributions. The traits that make a worker productive—intelligence, conscientiousness, even the capacity to delay gratification—are largely matters of constitutive luck. They are gifts of genetics and upbringing, not achievements of the will. If one does not choose the traits that produce the value, one cannot claim moral desert for the value produced. To reward differential productivity is simply to reward differential luck, which is morally arbitrary.

  Marit Voss: I concede that luck is pervasive. It would be foolish to deny that native endowments are unchosen. However, your conclusion rests on an implausibly stringent condition for responsibility. You suggest that to deserve rewards for an outcome, one must have authored the traits that produced it. If that were true, the concept of moral responsibility would have no instances at all, since no one authors their own genetic code or early environment. Desert is not an all-or-nothing property; it is scalar, pro tanto, and defeasible. We are responsible for how we exercise our agency within the constraints of our endowments. Even if the raw material is lucked upon, the effort to cultivate it and the choice to deploy it are not entirely transparent to luck. To deny this is to dissolve agency entirely, leaving no room for any normative assessment of action.

  Marit Voss: However, to make this defense credible, I must concede a technical problem with the naive version of my view and repair it. The naive version identifies a worker's desert base with her marginal product. But when production involves strong complementarities—cases where two workers are worth far more together than either is alone—marginal products do not sum to the total available for distribution. Under increasing returns, they sum to more than the whole; under decreasing returns, to less. So "give each her marginal product" is sometimes impossible. I therefore propose a coalitional measure: a person's desert base is her average marginal contribution across every possible order in which the workforce could be assembled. This ensures that people who are productive only jointly come to share the surplus symmetrically. This is not a rhetorical flourish but a repair internal to desert theory. Average-over-orderings is a more faithful rendering of "her contribution" than marginal-product-at-actual-employment because it isolates her specific additive value from the accident of her position in the production queue.

  Aaron Kellner: I grant the mathematics. The coalitional measure is coherent. But you have not solved the normative problem; you have merely complicated it. The same coalitional data admits many admissible divisions. You propose the average over orderings, but one could equally propose the division that lexicographically minimizes the worst-off coalition's complaint, or an equal division of the cooperative surplus. These yield different numbers for the same person. If desert is supposed to tell us how much someone deserves, and the choice among these divisions is what fixes the number, then desert itself is doing none of the work. The residual choice is an unargued political one. Furthermore, a person's share under any of these rules depends on who else happens to exist and on the shape of demand. Whether a surgeon is indispensable depends on whether there are nurses to assist her. That is brute luck from her point of view. You have refined the calculation, but you have not escaped the arbitrariness.

  Marit Voss: Let me ensure I understand your objection in its strongest form. You are arguing that because the mathematical model of cooperation allows for multiple solution concepts, the selection of any one concept is underdetermined by the facts of contribution. Therefore, the specific share assigned is a product of political stipulation rather than moral fact, and remains vulnerable to luck regarding one's collaborators. Is that correct?

  Aaron Kellner: Precisely.

  Marit Voss: Then my response is this. You are distinguishing metaphysical from epistemic indeterminacy, but you treat them as equivalent. Desert may be an essentially comparative and imprecise notion. It can order claims and rule out allocations without determining a unique cardinal share. Imprecision in a normative base is not the same as absence of one. We can know that one person deserves more than another without knowing the exact decimal difference. But let me turn the tables. What metric does your own view use to size compensation for brute luck? To answer "how badly off is she, through no choice of her own?" requires a counterfactual baseline. You must measure what she would have had under equal luck. But defining that baseline requires measuring opportunity, contribution, or forgone alternatives. You are borrowing from the very apparatus of contribution and opportunity you are attacking. Without a measure of what people could have produced, you cannot measure how much luck has disadvantaged them.

  Aaron Kellner: I see the force of that. If I say we must compensate for lack of talent, I must measure the value of that talent, which returns us to productivity metrics. But this leads us to the deeper question we have not yet made explicit. Your view treats desert as pre-institutional—a moral fact about persons that exists independently of the rules we adopt, against which rules can be assessed. My view implies desert is institutional—a status constituted by the rules and purposes we happen to have, so that it cannot serve as an independent standard for assessing them.

  Marit Voss: I am willing to make a concession here. I must admit that desert claims cannot be fully realized without institutions to define the relevant goods and metrics. Desert is not a raw moral fact floating free of social practice. This costs me the idea that meritocracy is a natural law; it becomes a normative project of institutional design.

  Aaron Kellner: And I concede that luck egalitarianism cannot operate without institutional rules to define baselines and count resources. We cannot measure luck without constructing a metric of advantage. This costs me the claim that my view is purely negative; it requires constructive institutional theory.

  Marit Voss: Yet even with these concessions, we remain apart.

  Aaron Kellner: We do. The dispute is no longer about whether luck exists or whether institutions are needed.

  Marit Voss: No. The dispute is whether the institutional rules should aim to track pre-existing moral differences in responsibility, or whether responsibility is itself a product of the rules we choose to justify distribution.

  Aaron Kellner: You believe the rules should track the moral fact. I believe the moral fact is created by the rules.

  Marit Voss: Then we agree on the need for precision, but disagree on the direction of fit.

  Aaron Kellner: Precisely. You want the world to match the desert. I want the desert to match the world we choose to build.
