prompt: |-
  Posting here because I've been going in circles on this for weeks and I'd rather be told I'm confused than keep guessing.

  Context: I got into forecasting a few years ago, the kind where you put a percentage on whether something will happen and a site scores you on it after. Since then I keep noticing the same shape of argument turning up in totally unrelated disputes, and I can't tell whether it's one argument in different clothes, or two arguments that look alike, or two plus a mistake.

  Version one. Someone says: your numbers don't hang together, you'll say 40% that it rains tomorrow and 70% that it doesn't, and if so I can offer you two separate bets, each of which you'd have to call fair or better by your own lights, and you lose money whichever way the weather goes. I get the move. What I get stuck on is how much it needs: I have to take both bets, at the numbers I gave, from someone who somehow knows those numbers. I don't bet. And if a guy on a street corner offered me a pair of bets that was a sure thing for him, I'd of said no. So what is this supposed to establish, that I'm wrong about the weather, or that I'd be in trouble in a situation I'm not in?

  Version two, which I think is a different animal. Whatever happens, there was a different set of numbers you could have given that would have scored better. Not probably better, better in every single outcome. No bets, no money, nobody exploiting anybody, nothing you actually lose. The bad thing is just that you did worse on a score than you could have done. This seems to do the same rhetorical work as version one and I can't say what the shared part is.

  Version three, the one I really can't place. How much I'd pay for a dollar-if-it-rains depends on the size of the stake and on my rent: 60 cents at a dollar stake, 45 at a hundred, nothing at all at a year's rent. So there's no single number there to build anything out of. And when I try to rebuild the version-one construction with stake-sensitive prices, sometimes I can't make it work against someone whose opinions are visibly incoherent, and sometimes it looks like I can make it work against someone whose opinions are perfectly fine.

  A friend said "Dutch book" once but she was half asleep and I think she only meant the first one. So: is there a name for the family, and if there is, does it cover all three? Please don't hand me a list of names and papers, I've got no journal access from where I am right now and I don't want reading suggestions. What I want is the carving: what each version actually establishes, and I mean which of these it is, that someone has a false belief, that they're internally inconsistent, that they can be reliably parted from their money, because those look like three different things; what the shared form is and what the minimum ingredients are for it to have any force at all; and where the edge is, the case where something that looks exactly like this has no force whatsoever. If the general thing has no name, then name it, define it, and tell me what wouldn't count as an instance.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is into forecasting (probabilistic prediction), noticing a recurring argumentative structure in disputes.
      *   **Problem:** They see three "versions" of an argument that look similar but seem to rely on different premises and establish different things. They are confused about whether these are the same underlying concept or distinct ones, and what exactly they prove (false belief, inconsistency, financial loss, etc.).
      *   **Constraint:** No reading lists, no journal access, no "go look this up." They want a conceptual carving/explanation *now*.
      *   **Goal:** Identify the "family" of arguments, explain what each version establishes, identify the shared form, the minimum ingredients for force, and the boundary cases (where it has no force).
      *   **Tone:** Direct, clear, analytical, respectful of their intelligence (they know forecasting), avoiding academic jargon where possible but precise where necessary.

  2.  **Deconstruct the Three Versions:**

      *   **Version 1 (The Betting/Dutch Book Argument):**
          *   *Premise:* You state probabilities (40% rain, 70% no rain).
          *   *Mechanism:* An opponent offers bets based on those probabilities.
          *   *Outcome:* You lose money guaranteed (Sure Loss).
          *   *User's Objection:* Requires actual betting, requires an exploiter, I don't bet, so why does this matter?
          *   *Standard Name:* Dutch Book Argument.
          *   *What it establishes:* Pragmatic inconsistency. If you act on these beliefs in a market, you get pumped. It shows *incoherence* in decision-theoretic terms.

      *   **Version 2 (The Scoring/Proper Scoring Rule Argument):**
          *   *Premise:* You state probabilities.
          *   *Mechanism:* A scoring rule (like Brier score or Log score) evaluates accuracy after the fact.
          *   *Outcome:* There existed a *different* set of probabilities that would have yielded a better score *regardless* of the outcome.
          *   *User's Observation:* No money changes hands, no exploiter. Just "you did worse than you could have."
          *   *Standard Name:* Dominance by Proper Scoring Rules (or Calibration/Refinement issues, but specifically *strictly proper scoring rules*).
          *   *What it establishes:* Epistemic inefficiency. You are not maximizing your expected accuracy/utility given your own knowledge. It shows *sub-optimality*.

      *   **Version 3 (The Stake-Dependent/Utility Argument):**
          *   *Premise:* Willingness to pay varies by stake size (risk aversion/utility curvature).
          *   *Mechanism:* Trying to apply V1 (Dutch Book) to V3 scenarios.
          *   *Outcome:* Sometimes the "sure loss" disappears even if probabilities look weird, or appears when they look fine.
          *   *User's Confusion:* This breaks the link between probability and price.
          *   *Standard Name:* Utility Theory / Risk Aversion vs. Linear Utility.
          *   *What it establishes:* The difference between *belief* (probability) and *value* (utility).

  3.  **Synthesize the "Family Name":**
      *   These are all arguments about **Coherence** (or Consistency).
      *   Specifically, they are **Normative Arguments for Probabilistic Coherence**.
      *   The shared form is: "If your degrees of belief/commitment do not obey the laws of probability, then [Bad Thing] happens."
      *   The "Bad Thing" varies: Financial Loss (V1), Score Penalty (V2), or Preference Reversal/Inconsistency (V3).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the frustration. Validate that these *are* distinct but related. Give the family name: **Arguments for Probabilistic Coherence**.
      *   **The Shared Form:** Define the skeleton.
          1.  Agent expresses degrees of confidence (prices/probs).
          2.  These expressions violate the axioms of probability (e.g., P(A) + P(not A) > 1).
          3.  Therefore, a "dominated strategy" exists (a way to be worse off than necessary).
      *   **Carving the Three Versions:**
          *   *Version 1 (Pragmatic Coherence):* It's about *action*. It proves you are vulnerable to exploitation *if* you act linearly on your beliefs. Address the user's "I don't bet" objection: It's a thought experiment about the *logic* of your commitments, not your actual wallet.
          *   *Version 2 (Epistemic Coherence):* It's about *accuracy*. It proves you are leaving points on the table. This is often stronger for forecasters because it doesn't require a bookie. It shows your internal map is blurry.
          *   *Version 3 (The Utility Boundary):* This is the edge case. It reveals that V1 and V2 assume **Linear Utility of Money/Score**. If utility is non-linear (risk aversion), the "sure loss" vanishes. This version establishes that **Probability and Price are not identical** without assuming risk neutrality.
      *   **What Each Establishes (The "Truth" Claim):**
          *   V1: You are practically irrational (decision-theoretically).
          *   V2: You are epistemically inefficient (scoring-theoretically).
          *   V3: You are highlighting the difference between belief and utility.
          *   *Crucial Distinction:* None of them prove your belief about the *weather* is false. They prove your *system* for holding beliefs is broken.
      *   **Minimum Ingredients for Force:**
          1.  Commitment to the numbers (you must stand behind them).
          2.  Linearity (money/score must map 1:1 to value).
          3.  Repeatability/Aggregation (one-off bets matter less than the policy).
      *   **The Edge (Where it has no force):**
          *   When utility is non-linear (V3).
          *   When the numbers are not meant as fair betting prices (just vibes).
          *   When the "bookie" knows more than you (adverse selection) - though this is a different objection.
          *   Single-shot vs. Long-run (Dutch books hurt less in one-off scenarios if you survive).

  5.  **Refining the Explanation (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say V2 is "better." It's just different. V1 is pragmatic, V2 is epistemic.
      *   *Correction on V3:* The user says "sometimes I can't make it work against someone whose opinions are visibly incoherent." I need to explain *why*. It's because risk aversion can mask incoherence. If I value the 100th dollar less than the 1st, my prices won't sum to 1, but I'm not necessarily "wrong" about probability, I'm just risk-averse.
      *   *Clarification on "False Belief":* Emphasize that coherence arguments *never* prove a specific belief is false (e.g., that it won't rain). They prove the *relationship* between beliefs is wrong.

  6.  **Final Polish:**
      *   Ensure the tone is conversational but precise.
      *   Check against constraints: No reading list. Direct answers.
      *   Make sure the "Family Name" is clear. "Coherence Arguments" is the standard term.
      *   Address the "I don't bet" objection directly. It's about *dispositional* commitment.

  7.  **Final Review against User Prompt:**
      *   *Name for the family?* Yes (Coherence Arguments).
      *   *Does it cover all three?* Yes, but V3 is the boundary condition.
      *   *What each establishes?* (Pragmatic loss, Score dominance, Utility/Belief separation).
      *   *Shared form?* (Violation of axioms -> Dominated Strategy).
      *   *Minimum ingredients?* (Commitment + Linearity).
      *   *Where the edge is?* (Non-linear utility / Single shot).

  8.  (Mental Check): Did I explain V2 clearly? It's about *Strictly Proper Scoring Rules*. I should mention that term but explain it simply. It's about minimizing "distance" from truth.
      Did I explain V3 clearly? It's the "St. Petersburg" or "Risk Aversion" problem. The key is that Price != Probability when stakes change.

      *Okay, ready to write.*
answer: |-
  The family name you are looking for is **Coherence Arguments**.

  Specifically, these are arguments that attempt to derive the laws of probability (the math that says probabilities must sum to 1, etc.) from requirements of rationality rather than from frequency or logic alone.

  Here is the carving you asked for.

  ### 1. The Shared Form
  All three versions share this skeleton:
  1.  **Input:** You express degrees of confidence (as prices, percentages, or betting odds).
  2.  **Violation:** Those expressions violate the axioms of probability (e.g., you price "Rain" + "No Rain" at $1.10).
  3.  **Consequence:** There exists a **dominated strategy**. This means there is an alternative course of action that leaves you better off in at least one possible future and worse off in none.

  The core claim of the family is: **If your beliefs are incoherent, you are necessarily leaving value on the table.**

  ### 2. What Each Version Establishes

  **Version One: Pragmatic Coherence (The Dutch Book)**
  *   **What it establishes:** That you are **pragmatically inconsistent**.
  *   **The specific claim:** It does *not* prove your belief about the weather is false. It proves that your *commitments* are mutually destructive. If you act on these numbers as fair prices, you guarantee your own loss.
  *   **Addressing your objection ("I don't bet"):** The argument is not about whether you *actually* bet. It is about whether your numbers represent **fair betting prices**. If you say "40%" but would refuse a bet at those odds, you are being dishonest about what the number means. If you *would* take the bet, you lose money. The force of the argument is that you cannot hold these numbers *and* be a rational actor in a market simultaneously.
  *   **Verdict:** It establishes **decision-theoretic suicide**, not factual error.

  **Version Two: Epistemic Coherence (Proper Scoring Rules)**
  *   **What it establishes:** That you are **epistemically inefficient**.
  *   **The specific claim:** This is the version you should care about most as a forecaster. It removes the "bookie" and the "money." It says that given the scoring rule (like Brier or Log score), there was a different set of numbers you could have submitted that would have yielded a better score *no matter what happened*.
  *   **Why it feels different:** It isolates the belief from the wallet. It shows that incoherent probabilities are a worse map of reality than coherent ones, even if no one ever bets against you. It proves you are failing to maximize your own expected accuracy.
  *   **Verdict:** It establishes **sub-optimality**, not financial loss.

  **Version Three: The Utility Boundary (Risk Aversion)**
  *   **What it establishes:** That **Price $\neq$ Probability** when utility is non-linear.
  *   **The specific claim:** This version breaks the other two. It shows that V1 and V2 rely on a hidden assumption: **Linear Utility of Money/Score**. They assume a dollar is worth the same to you whether you have ten or ten thousand.
  *   **Why it breaks the construction:** If you are risk-averse (the 100th dollar matters less than the 1st), your "price" for a bet will drop as the stake rises, even if your belief in the event stays the same. An observer might think you are incoherent (V1) because your prices don't sum to 1, but you are actually coherent regarding your *utility*, just not your *probability*.
  *   **Verdict:** It establishes that **incoherence in price does not imply incoherence in belief** unless we assume you don't care about risk.

  ### 3. Minimum Ingredients for Force

  For a Coherence Argument to have any bite at all, three ingredients must be present:

  1.  **Commitment:** You must stand behind the numbers as actionable commitments (either as betting prices or as truth-claims to be scored). If the numbers are just "vibes," the argument has no force.
  2.  **Linearity:** The value of the outcome must scale linearly with the stake. (One unit of score is always one unit of good; one dollar is always one dollar of utility).
  3.  **Repeatability (Implicit):** The arguments are strongest when viewed as a policy. If you make this mistake once, you might get lucky. If you make it as a rule, you *will* be dominated.

  ### 4. The Edge: Where It Has No Force

  You asked for the case where something looks exactly like this but has no force. Here is the boundary:

  **The Single-Shot, High-Stake, Risk-Averse Case.**
  If you are making a one-off forecast on something that could ruin you (like your "year's rent" example), Coherence Arguments (V1 and V2) lose their normative force.

  *   **Why:** In this case, maximizing expected value (which coherence demands) is not the same as maximizing expected *utility*. You are rationally allowed to be "incoherent" in your prices to protect yourself from ruin.
  *   **The Test:** If you can describe a scenario where the "sure loss" is acceptable to avoid the "risk of ruin," the Coherence Argument fails.
  *   **Example:** You say you'd pay 60 cents for a 1-dollar bet on rain, but 0 dollars for a 10,000-dollar bet on rain. A Dutch Booker says you are incoherent. You say, "Correct, because going bankrupt is worse than losing 60 cents." The Coherence Argument cannot touch you here, because you have rejected the Linear Utility ingredient.

  ### Summary of the Carving

  *   **Family:** Coherence Arguments.
  *   **Version 1:** Proves you are **exploitable** (if you act on your beliefs).
  *   **Version 2:** Proves you are **inaccurate** (relative to your own goals).
  *   **Version 3:** Proves the **limits** of the first two (when risk matters).
  *   **Shared Form:** Incoherent inputs $\rightarrow$ Dominated Strategy.
  *   **What it never proves:** That your specific belief (e.g., "It will rain") is false. It only proves your *system* of beliefs is broken.
  *   **The Edge:** Any situation where the stake size changes the value of the outcome (non-linear utility). In those cases, "incoherent prices" are actually "rational risk management."

  If you are forecasting for a site with a scoring rule, **Version 2** is the only one that matters. Version 1 is a metaphor for Version 2. Version 3 is a warning not to confuse your forecasting probability with your personal financial risk tolerance.
