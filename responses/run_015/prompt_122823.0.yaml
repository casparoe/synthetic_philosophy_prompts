  "Gift" and "Stand" are chosen as they likely appear on the 1901 dedication, anchoring the poem in the original artifact, while "Stone," "Space," "Name," and "Work" track the physical and ethical weight of the compromise.

  The bronze is fixed upon a base of **stone**,
  placed here as if it were a simple **gift**.
  We measure out the silence and the **space**
  between the dates, the old and new **name**,
  the fingers lost to carding **work**,
  and ask the ground on which we **stand**

  upon. We wait where the bus will **stand**.
  The timetable marks the corner **stone**;
  you say meet me after **work**,
  ignoring the founder's original **gift**,
  or the man behind the street **name**,
  just a coordinate in empty **space**.

  Between the plaques is barely any **space**,
  yet light falls differently where we **stand**.
  The first inscription holds the **name**
  like iron embedded in the **stone**.
  It claims the building was a **gift**,
  ignoring the cost of all that **work**.

  The new text does not undo the **work**
  of 1901, it opens **space**
  for doubt beside the original **gift**.
  Two judgments where the bronze figures **stand**,
  neither melting back into the **stone**,
  neither erasing the other's **name**.

  We read the old **name**
  against the record of the **work**.
  The metal weighs more than **stone**,
