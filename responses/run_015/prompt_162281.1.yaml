  That's a wonderfully vivid example, and I see why you call it laundering—it sounds as though Ravi is profiting from a deficit. But I think you're conflating the psychology of memory with the logic of confirmation. You say they're in identical evidential situations, but from the perspective of a Bayesian agent, they simply aren't. Confirmation isn't a timeless relation between a theory and a fact in the world; it's a measure of how a specific agent's credences ought to shift upon acquiring new information. For Ravi, the information that T entails E is genuinely new news about how his beliefs hang together, because E isn't currently locked into his system as a certainty. For Ines, it is locked in. The maths doesn't lie: if you're already certain of the consequent, learning the conditional doesn't force you to raise your credence in the antecedent. That's not a flaw in Bayesianism; it's a feature of coherence. T only earns confirmation by sticking its neck out, and if E is already certain, T isn't risking anything by entailing it.

  The real bite of your objection relies on the intuition that Ines *ought* to get the same boost. I'd favour the view that she should, but only if she corrects her modelling of the situation. If Ines wants to evaluate T properly, she shouldn't be treating the 2003 dip as a fixed point with probability one. She needs to engage in a bit of counterfactual bracketing—what would I believe if I didn't know E? If she does that, she reconstructs the uncertainty Ravi naturally has, and she gets the same confirmation boost. The framework doesn't forbid this; it just demands she be honest about her uncertainty. So Ravi isn't gaining an unfair advantage through forgetfulness; Ines is losing out through dogmatism. The laundering charge only sticks if you think agents must treat all past observations as immutable certainties, and I've never met a scientist who actually works that way when testing a fresh theory.
