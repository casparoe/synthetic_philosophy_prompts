  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** Chief Actuary
  **DATE:** October 24, 2023
  **SUBJECT:** Strategic Realignment: First-Person Actuarial Frameworks and Reserve Conventions

  **Executive Summary**
  Pursuant to Resolution 44-B, wherein the Board voted to accept the Quantum Immortality (QI) hypothesis as a baseline for long-term liability modeling, Actuarial has revised our reserve conventions to align with first-person survival probabilities. While solvency ratios improve significantly under First-Person Accounting (FPA), risk exposure shifts from standard mortality morbidity to perpetual continuity liabilities. This memo outlines the operational implications of treating subjective survival as the primary metric for policy continuation.

  **1. Reserve Conventions and Measure Weighting**
  The Quantitative Division has proposed two competing conventions for calculating reserves under QI. Convention A (Branch-Equal) counts all surviving branches equally, regardless of squared-amplitude measure. Convention B (Measure-Weighted) weights surviving branches by their Born Rule probability. Under Convention A, the firm recognizes a $4.2 billion reserve release, as at least one surviving branch exists for every insured cohort. Under Convention B, the measure of surviving branches shrinks toward zero over time. It is the CFO's assessment that the reserve release derives from the convention preference rather than underlying physics; however, given the Board's directive, we recommend adopting Convention A for regulatory capital calculations to maximize immediate liquidity.

  **2. Risk Exposure: The Perpetual Claimant**
  The Risk Committee has identified a correlation between surviving branches and catastrophic physical trauma. In branches where the insured survives high-risk events (the necessary condition for QI), the insured is overwhelmingly likely to be maimed rather than unharmed. This creates exposure to the "Perpetual Claimant": a policyholder who, in their own continuous experience, is never dead and never off claim. While this liability is finite on the books (as most measure-weighted branches result in standard death payouts), it represents an infinite liability in first-personal terms. We must stress-test disability pools against the possibility of clients accruing critical-illness benefits indefinitely across their subjective timeline.

  **3. Benefit Structure and Beneficiary Designation**
  A structural mismatch exists between first-person survival and third-person payouts. Death benefits are paid to beneficiaries in branches where the client dies; nothing about the client's subjective survival helps the balance sheet in those branches. To align payout triggers with FPA principles, Product Development proposes a "Continuity Rider." This rider names the client's own surviving copy as the beneficiary, allowing funds to transfer to the branch where the client remains alive. This ensures the capital follows the subjective survivor, mitigating the risk that the firm retains premiums while the insured subjectively experiences perpetual insolvency.

  **4. Legal and Analytics Considerations**
  Legal has flagged potential triggers of the standard suicide exclusion clause. If a client operates a home quantum-suicide apparatus, the act is third-personally lethal in nearly all measure while first-personally never resulting in death. Legal advises that coverage voids if the *intent* is to cease existence third-personally, regardless of first-personal outcome. There is significant adverse-selection worry that the only customers requesting the Continuity Rider are those planning to use such apparatuses.

  Furthermore, Analytics has proposed funding client-owned apparatuses as a cheap in-house test of many-worlds. We must note this can never confirm anything for the firm. From the company's own standpoint, the data will show near-total mortality in every branch the company itself is around to read, as our administrative continuity is tied to high-measure branches where standard claims processing occurs.

  **Exhibit A: Projected Reserve Release by Convention ($ Billions)**

  | Convention | Weighting Method | 10-Year Reserve Release | Surviving Branch Measure |
  | :--- | :--- | :--- | :--- |
  | **A (Preferred)** | Branch-Equal | $4.2 | Non-Zero (Count) |
  | **B (Alternative)** | Squared-Amplitude | $0.1 |趋 near Zero |

  **Recommendation**
  To balance fiduciary duty with regulatory compliance, we recommend a bifurcated accounting strategy: adopt First-Person Accounting for regulatory capital reporting to utilize the reserve release identified in Convention A, while continuing to settle claims third-personally based on standard measure-weighted mortality tables. This allows the firm to recognize capital efficiencies derived from subjective immortality while limiting actual payouts to branches where the insured is objectively deceased.

  **Approval Required:** Yes
  **Deadline:** Q4 Close
