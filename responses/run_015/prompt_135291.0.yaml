answer: |-
  The coffee had developed a skin. Malin stared at it, then at Vero. He was leaning against the counter, arms crossed, looking like he hadn't slept since residency. Bo sat in the corner, clutching a notebook like a shield. The lights were dimmed to a pre-op twilight that made everything look bruised.

  "If the experience doesn't push the words out," Malin said, her voice rough from the dry air, "then why do the words match the experience?"

  Vero didn't look up from his watch. "Because the brain pushes both. In parallel. The physical state causes the orange-light and it causes the saying of 'orange.' They're siblings, not parent and child."

  "Then the saying isn't about the light. It's about the brain state." Malin tapped her temple. "If I report on the light, I'm reporting on something that had no hand in the report. On your view, I could be a zombie saying the exact same things without the light ever turning on. So why am I talking about the light?"

  Bo shifted. "Is it possible the report isn't trying to describe the light, but just… be part of it?"

  Vero smiled, tired and genuine. "That's it. Ten years ago, Malin, you would have caught that sooner. We're not tracking the experience from a distance. The judgment 'I see orange' isn't caused by the seeing. It's constituted by it. The experience intimates itself. You don't infer you're in pain; the pain is the knowing."

  Malin felt the cold coffee in her stomach. "That works for right now. For avowals. But tomorrow, you're going to zap my cortex. I'll say 'orange.' You'll write it down. Then you'll stop. Hours later, I'll be in recovery, and someone will ask, 'Did you see anything?' That's a memory judgment. It happens later. It's caused by neural traces, not the experience itself. The experience is gone. If it's inert, it left no causal footprint. So when I answer 'yes,' I'm guessing. I'm a zombie recalling a script."

  Vero pushed off the counter. He walked over to the bed, resting a hand on the rail. Not doctoring. Just anchoring. "You're assuming the memory trace needs the experience to validate it. It doesn't. It needs the physical continuity. The same brain that fired then fires now. The truth of the report depends on the history of the system, not on whether the ghost pushed the gear."

  "But the ghost is the only reason we care about the system," Malin said. "If the ghost does nothing, Vero, then this conversation is doing nothing. You're arguing with me. You're trying to change my mind. But if you're right, your understanding of epiphenomenalism isn't causing your words. Your neurons are. Your conscious reasoning is just a shadow. So why are you talking to me? Why not just inject the sedative and save the breath?"

  Bo looked between them, pen hovering. "Does it matter if the reason is physical, if the answer is true?"

  Vero held Malin's gaze. He looked sad, not triumphant. "Malin. If I calculate a trajectory using physics, the math is valid regardless of whether the calculator understands it. I'm not trying to move your mind. I'm trying to state what is the case. The causal work is done by the synapses. The justification is done by the logic. They're different categories. You're asking why the map moves the territory. It doesn't. It just has to be accurate."

  "So you're saying your conviction is real, but it's powerless," Malin said. "You're convinced by reasons that can't cause convictions."

  "I'm convinced by a brain state that mirrors the reasons," Vero said. "The mirror is enough."

  "It eats itself," Malin whispered. "If you're right, you didn't choose this view because it's true. You chose it because your chemistry fired that way. So I have no reason to accept it, except that my chemistry might fire to match it."

  "Exactly," Vero said softly. "And yet, here we are. Checking the map."

  He reached for her chart. The moment broke. The door swung open and a nurse bustled in, checking the IV line with a efficiency that made the philosophy feel like dust motes.

  "Pre-op meds are due," the nurse said, snapping gloves. "You'll feel sleepy soon."

  Malin watched the needle go in. The cold spread up her arm. She wanted to say that the sleepiness was a causal power, proof that something mental was happening, but the words felt heavy, detached from the intent. Vero stepped back, giving her space, his face half in shadow. He looked like a man who had already accepted that nothing he thought mattered, and somehow found that peaceful.

  "See you on the other side," Vero said.

  Malin tried to nod, but the room was already tilting. The coffee sat on the tray, untouched, cooling into something that looked like oil. She wondered if she'd remember the taste, or just the fact of it.
