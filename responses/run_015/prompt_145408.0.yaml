answer: |-
  You cannot construct a single semantic theory that satisfies all six cases while remaining operable by a low-context moderator; the spec demands a hybrid that sacrifices theoretical purity for enforceability.

  ### The Desiderata

  1.  **Contextual Indexicality (NN)**
      The theory must explain why "glim" is a slur in Community A but a neutral noun in Community B (Case 1), and why the verdict flips based on speaker identity (Case 5). It cannot treat the word as having a fixed global value independent of usage history.
      *   *Case:* 1, 5.
      *   *Status:* **Non-Negotiable.** Without this, you ban lamp-sellers in B or miss hate speech in A.

  2.  **Reference Independence (NN)**
      The theory must account for derogatory force even when the target category is empty or junk (Case 2). The insult cannot depend on the truth conditions of the descriptive content.
      *   *Case:* 2.
      *   *Status:* **Non-Negotiable.** Moderators cannot verify ontology; they must judge the harm of the utterance regardless of whether "zarks" exist.

  3.  **Historical Trajectory (CP)**
      The theory must explain why the "z-word" carries force despite being censored, and why polite terms slide into insults (Case 3). It needs a mechanism for force transfer across synonyms and time.
      *   *Case:* 3.
      *   *Status:* **Camp Prejudice.** Pure semanticists often treat this as pragmatic drift outside the theory's scope; requiring it here is a policy need, not a linguistic universal.

  4.  **Asymmetry Condition (CP)**
      The theory must distinguish between "flim" (subordinated against dominant) and standard slurs (dominant against subordinated) without collapsing them into identical semantic categories (Case 4). It must account for the lack of structural exclusion history.
      *   *Case:* 4.
      *   *Status:* **Camp Prejudice.** Some accounts insist slurs *require* power asymmetry; others treat them as symmetric pejoratives. Insisting on a distinction is a sociological stance, not a semantic necessity.

  5.  **Projection Stability (NN)**
      The derogatory content must survive negation, conditionals, and belief reports (Case 6). The theory cannot treat the slur as a standard predicate that disappears under operators.
      *   *Case:* 6.
      *   *Status:* **Non-Negotiable.** If the theory says "nobody called him a zark" is clean, moderators will leave up clear dog-whistles.

  6.  **Operational Blindness (NN)**
      The verdict must be derivable from the token and immediate context without access to speaker intent, private identity, or external audience reaction.
      *   *Case:* All.
      *   *Status:* **Non-Negotiable.** This is the job constraint. If the theory requires mind-reading, it is useless here.

  7.  **Audience-Free Offence (NN)**
      The theory must define why a post is bannable even if no target group member sees it (e.g., restricted to an in-group of haters).
      *   *Case:* Operational constraint.
      *   *Status:* **Non-Negotiable.** Harm prevention cannot depend on lucky visibility.

  8.  **Taxonomic Distinction (NN)**
      The theory must separate "offensive" (violates manners), "derogatory" (asserts inferiority), "pejorative" (expresses negative attitude), and "slur" (institutionalised derogation).
      *   *Case:* Operational constraint.
      *   *Status:* **Non-Negotiable.** Collapsing these leads to over-censorship of rude but safe speech, or under-censorship of coded hate.

  ### Incompatible Desiderata

  *   **Contextual Indexicality (1) vs. Operational Blindness (6):** You cannot require moderators to distinguish Community A from Community B (Case 1) or in-group from out-group speakers (Case 5) if you simultaneously forbid them from accessing speaker identity or cultural context. This is a **bug in the list** generated by the tension between linguistic reality and moderation scalability. You must choose: either give moderators better tools (identity/context data) or accept false positives/negatives on homonyms and reclamation.
  *   **Historical Trajectory (3) vs. Operational Blindness (6):** A moderator cannot know the euphemism treadmill history of a term without external lookup tools that violate the "single token" speed constraint. This is a **discovery about the area**: semantic force is diachronic, but moderation is synchronic.

  ### The Knockout Requirement

  **Projection Stability (5)** knocks out the most accounts. Any theory that treats slur content as standard propositional material (truth-conditional) fails here, because standard material disappears under negation ("He is not a zark" does not imply he is a zark). This eliminates roughly half the classical semantic approaches immediately.

  ### Scorecard of Standard Families

  *   **Derogation in the Proposition:** **Fail.** Handles Case 2 (empty reference) poorly and fails Case 6 (projection) completely. Treats "not a zark" as clean.
  *   **Expressive/Use-Conditional:** **Pass/Fail.** Handles Case 6 (projection) well and Case 2 (empty reference) well. Fails Case 5 (reclamation) unless augmented with identity rules moderators can't see.
  *   **Taboo/Offence (Word-Based):** **Pass.** Handles Case 3 (censorship) well. Fails Case 1 (homonym) catastrophically (bans lamps in Community B).
  *   **Pure Pragmatics:** **Pass.** Handles Case 5 (reclamation) and Case 1 (context) well. Fails Operational Blindness (6) completely; requires too much context for a two-line ticket.

  ### Moderation vs. Seminar Requirements

  The following requirements drop out if this were for a semantics seminar rather than a moderation spec:

  *   **Operational Blindness (6):** A seminar theory *should* rely on intent and context; removing them is purely for scalability.
  *   **Audience-Free Offence (7):** Semantic theories often tie offence to uptake; requiring it to exist without an audience is a safety policy, not a linguistic fact.
  *   **Taxonomic Distinction (8):** Seminars often collapse these categories for theoretical elegance; moderation needs them separate for gradient enforcement (warn vs. ban).
  *   **Historical Trajectory (3):** While linguists study change, a semantic theory can be synchronic; requiring diachronic tracking is a policy burden.
