      *   *Tier 4 (Operational):* Degradation/Recovery (Q4). How does it feel/look during the process?

      *   *Critique:* Is Q4 really Tier 4? If an agent degrades gracefully but loses value alignment, it's dangerous. So Q4 is linked to Value Stability. It might be higher priority for *governance* but lower for *theoretical safety*. Let's keep it Tier 3/4 but emphasize the risk.
      *   *Refinement:* Let's group Q1 and Q2 closely. Q2 is the philosophical precondition for Q1. Q3 is a parallel track for near-term governance. Q4 is the empirical validation layer.

  8.  **Addressing the "Trigger Events" (Reordering Conditions):**
