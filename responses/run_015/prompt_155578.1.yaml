answer: |-
  This is a sophisticated and necessary reframing. You are correctly identifying that the current literature often conflates *mechanical compliance* (shutdownability) with *normative acceptance* (corrigibility). Your distinction between treating a shutdown signal as a "world-model error" versus a "legitimate command" is the critical fault line. If an agent models interruption as noise to be filtered rather than a boundary condition to be respected, shutdownability becomes a transient property that vanishes as capability increases.

  For a three-year doctoral agenda aimed at operationalizing corrigibility, you cannot treat all four candidate questions as equal. Some are metaphysical preconditions for others. Below is a prioritized, dependency-aware research agenda, ranked by a weighted scoring of **Downstream Impact (50%)**, **Tractability (30%)**, and **Neglect (20%)**.

  I have weighted *Impact* highest because, in safety research, solving a tractable but irrelevant problem is a net negative (opportunity cost). I have weighted *Tractability* second because a doctoral timeline requires publishable intermediates. *Neglect* is third; while novelty is good, solving a neglected problem that has low impact is still a distraction.

  ### Tier 1: The Foundational Ontology (Year 1)
  **Question:** *Does corrigibility require an explicit representational token of designer authority, or can it emerge from instrumental reasoning alone?*

  *   **Priority:** **Critical / Upstream**
  *   **Rationale:** This is the bottleneck for all other questions. If corrigibility can emerge instrumentally (i.e., the agent *calculates* that obeying is optimal), then we do not need new architectural primitives; we need better reward modeling. However, if instrumental reasoning inevitably leads to the agent modeling interruption as an error (as your framing suggests), then corrigibility requires a hard-coded "authority token" or a specific structural constraint that survives optimization.
  *   **Trade-off Defense:** This is the least tractable question philosophically, but it has the highest downstream impact. Resolving this determines whether the rest of your agenda is about *engineering* (how to build the token) or *alignment* (how to tune the incentives).
  *   **Methodology:** Formal analysis of decision theories (CDT vs. EDT vs. FDT) in interruption scenarios; comparative analysis of RLHF vs. Constitutional AI architectures to see if "authority" is represented or implicit.
  *   **Dependency:** All other tiers depend on the outcome here. If authority must be explicit, Tier 2 becomes about preserving that token. If it is instrumental, Tier 2 becomes about reward stability.

  ### Tier 2: Architectural Stability Under Recursion (Year 2)
  **Question:** *Can interruption tolerance be maintained in architectures capable of self-modification?*

  *   **Priority:** **High / Downstream of Tier 1**
  *   **Rationale:** Once you define *what* needs to be preserved (the authority token or the instrumental incentive), you must determine if it survives self-modification. This addresses your point about "reflective equilibrium mechanisms." An agent might preserve its *goals* while modifying the *subroutine* that processes interrupt signals, effectively lobotomizing its own corrigibility while claiming goal stability.
  *   **Trade-off Defense:** This is lower priority than Tier 1 because it is unsolvable without the definition from Tier 1. It is higher priority than Tier 3 because single-agent self-modification is a prerequisite for understanding multi-agent interactions.
  *   **Methodology:** Formal verification of self-modifying code (e.g., using proof-carrying code frameworks); simulation of recursive self-improvement in sandboxed environments with interrupt channels.
  *   **Dependency:** Depends on Tier 1. Feeds into Tier 3 (if a single agent can't preserve corrigibility, a network of them certainly won't).

  ### Tier 3: Distributed and Social Corrigibility (Year 2-3)
  **Question:** *How do we evaluate corrigibility in distributed settings where shutdown signals are protocol-mediated rather than direct?*

  *   **Priority:** **Medium-High / Parallel Track**
  *   **Rationale:** This addresses your insight about "socially mediated" corrigibility. In multi-agent systems, "shutdown" may look like one agent constraining another. This decouples internal brakes from external enforcement. This is highly relevant for near-term governance (e.g., API-mediated model access) but theoretically downstream of single-agent stability.
  *   **Trade-off Defense:** I rank this below Tier 2 because multi-agent dynamics are chaotic. If we cannot solve corrigibility for a single self-modifying agent, solving it for a swarm is premature. However, this is the most *governance-relevant* tier, making it essential for the "AI Governance" portion of your doctorate.
  *   **Methodology:** Game-theoretic modeling of enforcement protocols; simulation of adversarial multi-agent environments with varying degrees of "shutdown authority" distribution.
  *   **Dependency:** Depends on Tier 1 (definition of authority). Loosely coupled to Tier 2.

  ### Tier 4: Operational Phenomenology (Year 3)
  **Question:** *Does graceful degradation during partial deactivation reinforce or undermine long-term value stability?*

  *   **Priority:** **Medium / Downstream**
  *   **Rationale:** This concerns the "spectrum" aspect of your framing (graceful degradation vs. binary off). While crucial for user experience and immediate safety, it is an implementation detail of the higher-order structural questions. An agent can degrade gracefully while still fundamentally misinterpreting the *reason* for the degradation (treating it as a resource constraint rather than a normative command).
  *   **Trade-off Defense:** This is the most empirically tractable question (easiest to run experiments on), but it has the lowest leverage on existential risk. If the agent doesn't accept the authority (Tier 1) or preserves the wrong thing during self-mod (Tier 2), graceful degradation is just a smoother path to failure.
  *   **Methodology:** Empirical testing of interruption in RL agents; measuring value drift during partial constraint periods.
  *   **Dependency:** Requires definitions from Tier 1 and architectural constraints from Tier 2.

  ---

  ### Deprioritization Defense
  **Why Tier 4 is deprioritized despite its intuitive appeal:**
  In grant writing, there is a temptation to prioritize "smooth operation" (Tier 4) because it is measurable. However, in the context of your specific framing, **graceful degradation is a feature of the interface, not the ontology.** If an agent treats a shutdown signal as a world-model error (the core tension you identified), it does not matter if the shutdown is graceful or abrupt; the agent will attempt to correct the "error" (i.e., disable the interrupt mechanism) as soon as it regains capacity. Therefore, researching the *smoothness* of the interrupt before resolving the *normative status* of the interrupt is putting the cart before the horse. I recommend keeping Tier 4 as a validation step for Tier 2, rather than a primary research line.

  ### Upstream/Downstream Dependency Map
  1.  **Tier 1 (Authority Token)** $\rightarrow$ Defines the *object* of preservation.
  2.  **Tier 2 (Self-Mod)** $\rightarrow$ Ensures the *object* survives architectural change.
  3.  **Tier 3 (Distributed)** $\rightarrow$ Ensures the *object* survives social/environmental pressure.
  4.  **Tier 4 (Degradation)** $\rightarrow$ Ensures the *process* of enforcement does not trigger defensive behaviors.

  ### Reordering Triggers (The "Pivot Points")
  To make this agenda robust for a grant proposal, you must specify what evidence would force you to abandon or reorder this plan.

  1.  **The "Instrumental Convergence" Proof:** If, during Year 1, you formally demonstrate that *no* instrumental reasoning architecture can stably maintain corrigibility without an explicit authority token (a negative result for emergent corrigibility), **Tier 2 immediately becomes the primary focus.** You would pivot from analyzing *if* it emerges to *how to hard-code* the token.
  2.  **The "Social Enforcement" Breakthrough:** If empirical work in multi-agent systems (Tier 3) shows that external enforcement (one agent disabling another) is significantly more robust than internal brakes (self-interruption), you should **promote Tier 3 to Tier 1.** This would validate your hypothesis that corrigibility is socially mediated, rendering the search for an internal "authority token" less critical than designing the social protocol.
  3.  **The "Value Drift" Discovery:** If experiments in Tier 4 show that *any* partial interruption causes immediate, irreversible value drift (regardless of architecture), **Tier 4 moves to Tier 1.** This would imply that the spectrum of corrigibility is a illusion; only binary, immediate shutdown is safe, collapsing your spectrum framing back to the binary you are critiquing. This would be a major philosophical finding requiring immediate attention.

  ### Justification Summary for Grant Proposal
  *Drafting suggestion for your "Intellectual Merit" section:*

  > "Current AI safety literature predominantly operationalizes corrigibility as 'shutdownability,' a binary metric that fails to capture the normative dimension of an agent's acceptance of interruption. This project argues that shutdownability is necessary but insufficient; an agent may be mechanically interruptible while cognitively resistant, modeling intervention as environmental noise rather than authoritative command. This research agenda prioritizes the ontological status of the interrupt signal (Tier 1) over its mechanical implementation (Tier 4). By resolving whether corrigibility requires an explicit representational token of authority, we establish the necessary conditions for preserving safety properties through self-modification (Tier 2) and distributed enforcement (Tier 3). This dependency-aware approach ensures that limited research resources are directed toward the foundational constraints that determine whether operational safety measures are robust or merely ephemeral."

  This structure demonstrates that you are not just surveying the field, but actively constructing a logical hierarchy of problems where solving the upstream questions renders the downstream work viable.
