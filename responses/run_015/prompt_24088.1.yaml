          *   *Cost:* Special ontological status for "exemplification."
      *   *Addressing the Friend's Pushback:* The friend says relocating the regress doesn't help.
          *   *Counter:* If the relation is *essentially* unifying (unsaturated), it doesn't need a further relation *by its nature*. The regress stops because the category changes.
      *   *Recommendation:* The user likes (1) and (2). To keep them, they must reject (3)'s implication that relations are "terms" in the same sense. This leads to the "Unsaturatedness" view. If they want to avoid "weird" relations, they must go the "Primitive Fact" route (reject 2).

