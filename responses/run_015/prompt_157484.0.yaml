      *   *Weakness:* Dennett's IS is inherently about *predicting behavior* by treating the system *as if* it has beliefs/desires. If you strip away the propositional content, are you still doing the Intentional Stance? Or are you just doing the *Design Stance* (looking at mechanisms)?
      *   *The "Belief" Label:* If "belief" just means "probability distribution over tokens," does it do any work? Human beliefs guide action across contexts. Do these distributions?
      *   *Falsifiability:* If every probability distribution counts as a "belief-state," then nothing can falsify it. The constraint needs to be on *stability* and *functional role*.

  3.  **Brainstorming Failure Modes (Falsification Conditions):**
