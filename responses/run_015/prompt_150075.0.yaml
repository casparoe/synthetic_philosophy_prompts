          3.  Evaluate the metaphor: Is it broken, or are historians vague?
          4.  **Crucial:** Be honest about reasoning weaknesses and what would change the model (epistemic humility).
      *   **Tone:** Intellectual, respectful, technically precise but accessible, honest about limitations.

  2.  **Deconstruct the Historical Cases (Mental Sandbox):**
