prompt: |-
  hey so i'm a junior and lately my robotics club and world history class are blending together in my head in a weird way. we got into this argument about whether societies actually "collapse" or just like... reconfigure themselves. my teacher talked about the bronze age collapse where palace economies just stopped using writing and long-distance trade kind of evaporated, then the maya where they stopped building monuments but people were still farming, and easter island where they deforested but clearly still lived there with different social structures. she thinks "collapse" is just a dramatic historian word for transformation. but my dad (who's an engineer) says if your core feedback loops break -- writing as information storage, trade as resource input, monument construction as some kind of system output -- then the system failed, not transformed.

  anyway i know robotics control systems definatly better than historiography: pid loops, hard constraints, state estimation, optimization goals, actuators vs sensors. can you restate the "collapse is just transformation" position about those three cases entirely in that vocabulary? like treat a society as a controller with sensors (writing networks, trade routes), actuators (agriculture, monument building), and setpoints (population equilibrium, resource budgets). map the bronze age, maya, and easter island onto this framework.

  then i need the residue report: which parts of the historical claim translate cleanly into system reconfiguration vs actual failure? which parts do you have to fudge? and is there anything in the debate -- like whether maya societies intentionally stopped monuments as a feature not a bug, or whether easter island kept hierarchy without trees -- that literally cannot be said in robotics terms without sounding stupid? also tell me if the leftover stuff means the robotics metaphor is broken or if historians are just being vague about what counts as "functioning."

  please be realy honest about where your reasoning is weakest and exactly what would change your mind. like if someone showed that bronze age writing stopped on purpose as a design choice, would that flip your translation from "sensor failure" to "intentional mode switch"? and point out the spot where you're most likely forcing history into engineering language just because i asked you to.
reasoning: |-
