      *   *Phase 3: The Non-Numerical Case (40-50):* Shapes/Predicates. Generalizing the problem.
      *   *Phase 4: The Community/Agreement Check (50-60):* Voting, discussing consensus.
      *   *Phase 5: The Pivot to First-Person (60-72):* Crucial shift. "Not what they meant, but what *you* meant."
      *   *Phase 6: Final Poll & Wrap (72-80):* The three positions, banned words allowed.

  4.  **Developing the Debrief & Escape Routes:**

      *   Need to map specific moments to the four target insights.
