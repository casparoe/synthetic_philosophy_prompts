      *   *Normativity:* This is the hardest part. The activity shows *indeterminacy* (I can't tell), but the philosophical claim is *normativity* (There is no fact about what I *should* do). I need a specific prompt to bridge this. "If there were a fact, would you be able to access it? If not, what work is it doing?"

  5.  **Addressing Constraints & "No Fact" Assertion:**

      *   Facilitator must remain neutral. "Student A says X, Student B says Y. What does that imply?"
      *   The Final Poll needs careful wording to distinguish Ontological Indeterminacy vs. Epistemic Limitation.

  6.  **Predictable Failures:**

      *   *Failure 1:* Students treat it as a puzzle to solve ("What is the *real* answer?"). *Fix:* Facilitator refuses to validate an answer.
      *   *Failure 2:* Students retreat to "But I *know* what I meant." *Fix:* The Partner Game forces them to see their own rule was underdetermined too.
