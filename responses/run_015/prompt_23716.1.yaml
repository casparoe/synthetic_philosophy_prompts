answer: |-
  You are absolutely right, and your friend is fundamentally mistaken about the definition of David Lewis's **Modal Realism**.

  In contemporary metaphysics, the distinction you are drawing is the single most important dividing line in the philosophy of modality. Your friend is conflating **taking modal logic seriously** with **taking possible worlds ontology seriously.**

  Here is the breakdown of why the "possible worlds as tools" view is **not** Modal Realism, what the key difference is, and why Lewis explicitly rejected the "tools" view.

  ### 1. What Lewisian Modal Realism Actually Is
  David Lewis's view (outlined in his book *On the Plurality of Worlds*) is an **ontological** claim. It is a claim about what exists in the furniture of the universe.

  For Lewis, Modal Realism consists of four specific claims:
  1.  **Existence:** Possible worlds exist.
  2.  **Concreteness:** They are not abstract concepts; they are concrete entities. A possible world containing a talking donkey contains a *real, flesh-and-blood* talking donkey.
  3.  **Isolation:** These worlds are spatiotemporally isolated from ours. You cannot travel to them; they are causally closed off.
  4.  **Indexicality:** The word "actual" is indexical (like "here" or "now"). When we say "the actual world," we just mean "the world we are in." To a person in another possible world, *their* world is actual and ours is merely possible.

  **The Bottom Line:** For Lewis, possible worlds are **real places**, just as real as Earth, but disconnected from us.

  ### 2. What the "Tools" View Is (Instrumentalism/Fictionalism)
  The view your friend is describing—that possible worlds are "useful fictions" or "tools for logic"—is usually called **Modal Fictionalism** or **Modal Instrumentalism**.

  Proponents of this view argue:
  *   Possible worlds do not literally exist.
  *   Talk of "possible worlds" is just a manner of speaking (a *façon de parler*).
  *   We use world-talk because it makes doing modal logic easier, similar to how a physicist might use "frictionless surfaces" or "perfect gases." These things don't exist, but the models are useful.

  **The Bottom Line:** For the "tools" theorist, possible worlds are **stories or models**, not real places.

  ### 3. The Key Difference: Ontological Commitment
  The difference is **Ontological Commitment**.

  *   **Your Friend's View (Instrumentalism):** "Possible worlds are useful lies." When I say "It is possible that I wear a red shirt," I am not pointing to a real universe where I wear a red shirt. I am saying, "According to the story of possible worlds, there is a description where I wear a red shirt."
  *   **Lewis's View (Modal Realism):** "Possible worlds are the truth." When I say "It is possible that I wear a red shirt," I am making a factual claim about reality: "There exists a concrete universe, disconnected from this one, in which a counterpart of me is wearing a red shirt."

  Lewis famously acknowledged that his view invites the **"Incredulous Stare."** People stare in disbelief because it sounds crazy to claim other universes are real. Lewis's response was essentially: "I know it sounds crazy, but the theoretical benefits outweigh the cost."

  ### 4. Why Lewis Rejects the "Tools" View
  Lewis did not just stumble into Realism; he argued *against* the "tools" view. Here is why he rejected it:

  **A. The Problem of Truthmakers**
  Lewis was a truthmaker theorist. He believed that for a statement to be true, there must be something in reality that makes it true.
  *   **Statement:** "It is possible that humans never evolved."
  *   **Tools View:** What makes this true? Just our language rules? That seems too thin.
  *   **Lewis's View:** What makes this true is the **existence** of a world where humans never evolved.
  Lewis argued that if possible worlds are just fictions, modal statements (statements about possibility and necessity) end up being false or lacking truth values. He wanted modal statements to be literally true, which required literal worlds.

  **B. Theoretical Utility**
  Lewis argued that if you are going to use possible worlds to explain causation, properties, mental content, and probability, you might as well get the "bang for your buck."
  *   If worlds are just fictions, you have to explain how a fiction can analyze reality.
  *   If worlds are real, you can reduce other complex philosophical problems to facts about worlds. Lewis believed Realism provided the best systematic explanation for all of philosophy, not just logic.

  ### 5. Why Your Friend Is Confused
  Your friend is likely confusing two different uses of the word "Realism."

  1.  **Semantic Realism:** The view that modal statements (e.g., "Necessarily, 2+2=4") have objective truth values. (Lewis agrees with this).
  2.  **Ontological Realism:** The view that the *entities* used to explain those statements (possible worlds) physically exist. (Lewis agrees with this; the "tools" theorist does not).

  Your friend thinks that because Lewis takes modal logic seriously, he must be a realist. But in metaphysics, **Realism** specifically means believing the entities exist independently of our minds.

  There is a middle ground called **Ersatz Modal Realism** (championed by Alvin Plantinga). This view says possible worlds *do* exist, but they are **abstract objects** (like sets of propositions), not concrete universes. Lewis hated this view too, calling it "magical," because he didn't think abstract objects could represent concrete reality without being concrete themselves.

  ### Summary for Your Argument
  You can tell your friend:

  1.  **You are right:** Lewis's Modal Realism is specifically the claim that possible worlds are **concrete, existing entities**, not fictions.
  2.  **He is wrong:** The view that worlds are "tools" or "fictions" is called **Modal Fictionalism**, and it is the direct rival to Lewis's Realism.
  3.  **The Litmus Test:** Ask your friend: *"Does David Lewis believe there is a literal, physical universe where I am a pirate?"*
      *   If they say **Yes**, they understand Lewis.
      *   If they say **No, it's just a way of talking**, they are describing Modal Fictionalism, not Lewisian Modal Realism.

  Lewis's entire philosophical project was built on the idea that we should not shy away from the "Incredulous Stare" if it gives us the best logical system. He wanted the worlds to be real, not just useful.
