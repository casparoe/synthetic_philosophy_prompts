answer: |-
  **The Case**

  Consider the thermal management system of a mid-sized university data center, where the target system is the aggregate core temperature of the server racks over 24-hour cycles. Model A (the "Lumped" model) assumes heat dissipates via static conduction through a homogeneous medium, characterized by a single calibrated parameter, *thermal resistance* ($R$); everyone grants this is false, as cooling is driven by forced convection from variable-speed fans. Model B (the "CFD" model) assumes the physically realistic mechanism: turbulent airflow governed by Navier-Stokes equations, accounting for rack layout and fan pressure curves. In out-of-sample prediction of next-day average temperatures, Model A consistently beats Model B because the CFD model's numerous unmeasurable micro-parameters (local turbulence coefficients, cable clutter obstruction) introduce variance that swamps its structural accuracy, whereas Model A's $R$ parameter absorbs these complexities into a stable phenomenological constant. However, Model A fails at exactly one in-range intervention: when Facilities swaps the HVAC unit for a model with a different pressure-flow curve, Model A's predictions diverge sharply because $R$ was a stand-in for the specific convection coefficient of the original fans, not a property of the room; Model B passes this task because it explicitly represents the fan mechanics. Model A does not win by being "more false" generally—ignoring thermal mass entirely (a further unrealistic simplification) degrades its performance—nor is the assumption idle, as swapping in the true convection mechanism without the CFD structure collapses the calibration.

  ***

  **The Demonstration**

  **1. The Three Readings**
  *   **The Friedman-style Instrumentalist** argues that the truth of the conduction assumption is irrelevant; the model is a machine for generating accurate predictions, and $R$ is merely a convenient handle for tuning output. Since Model A minimizes prediction error in the operational context, it is the superior scientific tool, and the intervention failure simply marks the boundary of its current domain of validity.
  *   **The F-Twist Reader** (defending the virtue of unrealism) argues that Model A wins *because* it is unrealistic: the false conduction assumption strips away the "noise" of the turbulent details that Model B mistakenly treats as signal. On this reading, the abstraction itself is the engine of success; the model is better precisely because it does not burden itself with the messy causal truth.
  *   **The Friend of Galilean De-idealisation** argues that Model A is scientifically inferior because $R$ is a "mask" parameter—it conflates the geometry of the room with the mechanics of the fans. While it predicts, it does not explain. The intervention failure reveals that Model A lacks *modal robustness*; it cannot support counterfactuals because it has not isolated the distinct causal factors (fan pressure vs. room insulation) that govern the system.

  **2. The Single Separating Feature**
  The feature that keeps these readings apart is the **status of the parameter under counterfactual stability**. The Instrumentalist sees the parameter as a tool valid only within the observed distribution; the F-Twist reader sees the parameter as an abstraction that gains power by ignoring detail; the Galilean sees the parameter as a causal placeholder that must map to a distinct mechanism to support intervention.

  **3. The Negligible-Effect Collapse**
  If the stand-in assumption were replaced by a merely negligible simplification—for example, if the air were actually nearly still and conduction *was* the dominant force, with convection contributing only 1%—the case collapses into the familiar textbook one. In that scenario, Model A would pass the intervention test (swapping fans would have minimal effect regardless), and the victory would be due to *approximation* rather than *mimicry*. The philosophical tension vanishes because the false assumption would then be "true enough" to support the intervention, removing the distinction between predictive adequacy and structural fidelity.

  **4. The Best Instrumentalist Objection**
  The instrumentalist objects that the intervention task is simply a **different prediction problem about a different system**. Once the HVAC unit is swapped, the boundary conditions have changed; the target system is no longer the original data center configuration but a new one. Therefore, Model A is not "wrong" about the original system; it is merely being asked to predict outside its calibrated domain. The failure tells us nothing about the model's scientific worth, only that it requires re-calibration for the new context.

  **5. Honest Evaluation**
  This objection lands partially but ultimately misses the cost of scientific understanding. It is true that any model has a domain of validity, but the Galilean critique highlights that Model B requires *no re-calibration* to handle the swap, whereas Model A does. The instrumentalist treats re-calibration as a routine administrative cost, but in complex institutions, the ability to predict the *consequences of change* without empirical re-tuning is the primary value of a structural model. If the goal of science is merely to fit curves to existing data, the instrumentalist wins; if the goal is to navigate changes to the data-generating process without starting from scratch, the stand-in assumption is a liability, not a tool. The objection holds only if one accepts that science is purely retrospective.
