      *   **Why (3) is too strong:** "Normative Contagion" shouldn't mean "All mental states are sensitive to *the same kind* of norms." It should mean "All mental states are sensitive to *their relevant* norms."
      *   **Saving the Thesis:** You can keep (2) and a *modified* (3). You don't need to say belief attribution changes based on moral outcomes. You can say belief attribution is sensitive to *epistemic* norms (which we already know—e.g., pragmatic encroachment). But the Knobe effect is specific to *action* concepts.

