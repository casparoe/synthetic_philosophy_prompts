      *   *Premise (4)/(5) - Equivocation on "Normative":* Premise (2) talks about *moral* norms (good/bad, praise/blame). Premise (4) talks about *epistemic* norms (true/false, justified/unjustified). Premise (6) slides from "belief involves norms" to "belief involves *moral* norms." This is a classic equivocation.
