answer: |-
  The principle that unifies your gut verdicts is not about property, but about **lineage and debt**.

  ### The Principle: The Norm of Private Design Debt

  **You incur a moral debt when your success relies on the specific, non-obvious labor of another designer, unless that labor was gifted to the commons, abandoned, or substantially transformed.**

  This principle treats game mechanics not as "ideas" (which are free) but as **R&D labor** (which is costly). Your gut isn't protecting the *loop*; it's protecting the *risk you took to find the loop*. When someone bypasses that risk by leaning on your specific effort, they incur a debt. When they take the risk themselves, or when you waive the debt, they don't.

  Here is how the principle maps to your ten cases, and where it forces you to change your mind.

  #### How the Principle Explains Your Verdicts

  *   **1 (Big Studio Copy): Violation.** They bypassed your R&D risk using your specific output. They extracted private value without permission. **Verdict: Not Fine.**
  *   **2 (Independent Discovery): No Debt.** They took the risk themselves. No reliance on your labor. **Verdict: Fine.**
  *   **3 (Cryptomnesia): Mitigated Debt.** The causal link exists (they saw it), but the intent to bypass risk is missing. The debt is real but the moral culpability is lower. **Verdict: Not Fine, but less bad.**
  *   **4 (Postmortems): Debt Waived.** By publishing the failures, you explicitly gifted that specific labor to the commons. They are using a gift, not stealing. **Verdict: Fine.**
  *   **5 (The Fix): Debt Paid.** They relied on your foundation, but the "substantial transformation" (fixing the broken bit) adds new value that repays the debt. Innovation clears the ledger. **Verdict: Okay.**
  *   **6 (Parallel Discovery): Debt Diluted.** If three others found it, the labor wasn't "unique" or "non-obvious." The scarcity of the insight drops, so the value of the specific labor drops. **Verdict: Ownership sense drops.**
  *   **7 (AI Clone): Violation.** The AI is a proxy. Feeding it your rulebook is extracting private labor without risk. It is automation of theft. **Verdict: Not Fine.**
  *   **8 (AI Tool): No Debt.** The model was trained on the *commons* (other people's games). You are using a general tool, not extracting specific private labor from a peer. **Verdict: Fine.**
  *   **9 (Abandonment): Debt Expired.** You stopped maintaining the labor (out of print) and enforced nothing. The labor has reverted to the commons via neglect. **Verdict: Fine.**
  *   **10 (Foreign Market): Violation.** This is the friction point. They relied on your specific labor. The lack of market overlap reduces *harm*, but it does not erase the *debt*. **Verdict: Must change to "Not Fine."**

  #### The Verdict You Must Drop

  **Case 10.**
  Your intuition says "Nothing," but your logic says "Which can't be right." The Principle of Private Design Debt forces you to admit **it is wrong, even if it doesn't hurt you.**

  If ownership is based on *labor lineage* (Case 1), then geography (Case 10) is irrelevant. A thief is still a thief even if they sell the stolen goods in a town you never visit. To remain consistent with your fury in Case 1, you must acknowledge Case 10 is a moral violation, even if you choose not to enforce it. The act is wrong; the damage is just zero.

  #### The Two New Cases

  **1. The Fan Mod (Requires ownership, non-commercial)**
  *   **Verdict:** **Fine.**
  *   **Why:** This falls under **Reciprocal Value**. The modder cannot access the loop without buying your game (paying the debt). They are not bypassing your risk; they are amplifying your product. They add value to your specific labor without extracting profit. This is homage, not extraction.

  **2. The Internal Training Exercise (Corporate, never sold)**
  *   **Verdict:** **Gray / Not Fine.**
  *   **Why:** This is **Private Extraction**. They are using your specific R&D labor to benefit their organization (training employees) without compensation or permission. Even though there is no market competition, they are consuming the value of your design work for internal gain. Under the principle, they incur a debt they aren't paying. It is ethically identical to Case 1, just without the public sales.

  #### The Test Case

  To distinguish this principle from others (like "Harm-Based Ethics" or "Credit-Based Ethics"), here is the hypothetical that would stress-test it:

  **The "Credit-Only" Clone:**
  > A respected designer releases a game with your exact central loop. They make no mechanical improvements (Case 5), but they put your name in the credits as "Inspired By." They sell it in your home market (Case 1).

  *   **If you feel this is Fine:** Your true principle is **"The Norm of Attribution."** (Credit clears the debt).
  *   **If you feel this is Not Fine:** Your true principle is **"The Norm of Private Design Debt."** (Credit does not clear the debt; only transformation or permission does).

  Given your fury in Case 1 (where art/text were different, implying they *didn't* copy the "look" but did copy the "soul"), I suspect you would feel this is **Not Fine**. This confirms that for you, ownership is about the **right to exploit the risk**, not just the right to be named. Credit is not currency; innovation or permission is.
