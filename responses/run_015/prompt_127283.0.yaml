  I spent much of last evening in a draining argument with a close friend who has become convinced of an institutional conspiracy theory—specifically, that a coalition of regulatory bodies systematically suppressed a set of technical audits that, had they been released, would have undermined a major policy decision made in 2019. When I pressed him on why no whistleblowers, leaked drafts, or archival traces have surfaced despite years of expected exposure, he kept returning to the same line: “Absence of evidence is not evidence of absence.” I told him that if that principle were applied consistently it would render every unfalsifiable narrative permanently immune to revision, but he insisted I was treating a nuanced epistemic guideline as if it were a logical tautology. I am now fairly sure he is running together several distinct claims under that single sentence, and I want a precise map of the damage before we talk again.

