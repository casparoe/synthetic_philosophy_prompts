  My credence: **0.52**

  Here is the decomposition of that number. I am treating the resolution condition ("mostly treat as settled") as the bottleneck; ontic views are already popular in foundations, but consensus is rare.

  *   **PBR Assumption Validity (0.60):** The Preparation Independence assumption is mathematically sound in non-relativistic QM, but there is a 40% chance it fails as a fundamental physical principle in a relativistic universe.
  *   **QFT Factorization Worry (0.55):** You are not mangling this; local algebras in QFT are Type III and do not tensor-factorize (Reeh-Schlieder), meaning strict preparation independence is technically false, though a 55% chance remains that this is an approximation error irrelevant to the ontological conclusion.
  *   **Retrocausal/Superdeterministic Viability (0.85):** 85% probability these remain fringe; they save psi-epistemic views but at a cost most physicists find unacceptable, so they likely won't drive consensus.
  *   **Nomological View Viability (0.70):** 70% probability the "wavefunction as law" view (e.g., Bohmian nomologicality) does not overtake the "wavefunction as object" view; it is distinct from epistemic and a strong competitor.
  *   **Distinction Well-Posedness (0.70):** 70% probability the community does not dissolve the question into pragmatism or operationalism; the metaphysical hunger in foundations suggests the question will persist.
  *   **Sociological Consensus (0.50):** 50% probability the foundations community actually converges on *any* single ontology in 50 years; history suggests fragmentation is more likely than settlement.

  **Combination:** The ontic side has momentum (MWI, Bohm, GRW are all ontic), but the "settled" condition is the heavy discount factor. The QFT loophole and the resilience of the nomological view prevent me from going higher, while the current trend of anti-instrumentalism prevents me from going lower.

  **Correction on QFT:** You have the physics right. In Algebraic QFT, local observables for bounded spacetime regions generate Type III von Neumann algebras. These do not admit a tensor product structure for spatially separated regions in the way finite-dimensional QM does. The vacuum is entangled across any partition. PBR assumes you can prepare $\psi_A \otimes \psi_B$. In QFT, you can only ever prepare something *approximating* that. Whether the ontological proof survives the approximation is an open technical question, not a settled one. Your friend is treating a theorem about Hilbert spaces as a theorem about spacetime.

  **Main Disagreement:** You and your friend most likely disagree on the **physical significance of the Preparation Independence assumption**. She treats it as a trivial operational requirement (if you can't prepare independently, you aren't doing experiments); you treat it as a substantive metaphysical claim about separability that fundamental theory might not support.

  **Evidence to Move Number:** A **no-go theorem for psi-epistemic models that does not require Preparation Independence**. If someone derives a PBR-style contradiction using only covariant dynamics or symmetry principles without assuming tensor-product states, my number jumps to 0.80. Conversely, a working psi-epistemic model in QFT that reproduces standard predictions without retrocausality drops it to 0.20.

  \answer{0.52}
