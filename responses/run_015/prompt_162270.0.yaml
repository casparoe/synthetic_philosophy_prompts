answer: |-
  **EXAMINATION PAPER**

  **Module:** Ethics of Reproduction and Selection
  **Term:** Final Term
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**

  The Principle of Procreative Beneficence (PPB) states that, other things being equal, prospective parents have a significant moral reason to select, from among the children they could have, the one expected to have the best life.

  Consider the following case. Assume all standard objections to PPB (non-identity, expressive harm, autonomy/designing) are resolved. Assume further that a reliable, cheap, widely available method exists for estimating an embryo's expected well-being from its genome. In this society, a fixed number of elite university admissions and high-status career entry points determine the majority of a person's well-being. Embryo selection for traits predicting success in competing for these places (e.g., competitiveness, specific cognitive profiles) is nearly universal. Call a trait *positionally loaded* when its contribution to well-being depends primarily on how the possessor compares to others, rather than on absolute improvements (like robust health). In this case, selection gains cancel out: the places are fixed, so relative standing remains unchanged while resources spent on selection are wasted.

  Based *only* on the case as stated and the principle as described, which of the following diagnoses is correct?

  1.  **REDUCTIO:** PPB is self-defeating. A principle of beneficence cannot require acts whose universal performance produces no net benefit. PPB must be rejected or restricted to non-positional traits.
  2.  **COORDINATION:** The reason PPB gives an individual parent survives untouched. The case shows only that the practice needs collective restraint to prevent waste, not that the individual moral reason is void.
  3.  **DISSOLUTION:** The case shows only that PPB must be stated over a non-comparative conception of well-being. Once defined correctly, there is no arms race and nothing to restrain.
  4.  **CATEGORY ERROR:** There is no arms race at all, because selecting one embryo rather than another never changes the traits of anyone else's child.

  **Task:** Endorse exactly one diagnosis. Defend it against the other three. Your answer must explain what this case shows about the grounding of PPB (e.g., parental partiality vs. impartial beneficence) and the distinction between positional and non-positional benefits.

  ***

  **MODEL ANSWER**

  The correct diagnosis is **COORDINATION**. This case does not refute the Principle of Procreative Beneficence (PPB), but it reveals that PPB generates individual moral reasons that can conflict with collective optimality. To see why, we must distinguish the grounding of the principle and the nature of the traits involved.

  First, we must dismiss **CATEGORY ERROR**. This diagnosis claims selection cannot create an arms race because one family's choice does not alter another's child. This misunderstands the mechanism of positional goods. In the stated case, well-being is determined by competition for fixed places. While my selection does not change your embryo's genome, it changes the competitive landscape your child faces. If I select for higher competitiveness, my child becomes a harder rival for your child. When all parents do this, the baseline for success rises. The traits are positionally loaded; their value is relational. Therefore, individual selections aggregate into a collective shift in standards, validating the arms race description. Category Error fails because it ignores the social context in which the traits derive their value.

  Second, **DISSOLUTION** must be rejected. This argues that redefining well-being non-comparatively solves the problem. However, the case stipulates that in this society, fixed high-status positions "do a great deal of the work in determining how well a person's life goes." Well-being is exogenously tied to relative standing by social structure, not merely by definitional error. Parents cannot wish away the fact that failing to secure these places ruins life prospects. To insist on a non-comparative conception of well-being here is to ignore the empirical reality of the case. PPB requires parents to select the child expected to have the best life *as things actually are*, not as we might wish them to be. If social status determines well-being, PPB demands selecting for status-related traits. Dissolution fails because it attempts to solve a structural problem with a semantic fix.

  The substantive choice lies between **REDUCTIO** and **COORDINATION**. Both accept the arms race is real; they disagree on whether PPB survives it. Reductio argues that because universal compliance yields no net benefit (and wastes resources), the principle is self-defeating. Coordination argues the individual reason persists despite the collective waste.

  The verdict flips depending on how PPB is grounded. If PPB is grounded in **impartial beneficence**—maximizing total aggregate well-being—then Reductio is correct. In a zero-sum competition for fixed places, total well-being cannot increase through selection; it merely redistributes who wins. If the moral reason to select is derived from the total good produced, then there is no reason to select when the total good remains static. The resources spent on selection are pure waste, making the act morally unjustified on utilitarian grounds.

  However, PPB is traditionally grounded in **parental partiality**. It is a principle governing the special relationship between parent and child, obligating parents to do the best for *their* future child, not for children in general. Under this grounding, Coordination is correct. Even if the collective outcome is neutral, the individual outcome is not. If I select for competitiveness and my neighbors do not, my child wins the place. If everyone selects, my child maintains their chance relative to others, whereas had I abstained while others selected, my child would lose. The individual reason to prevent one's own child from falling behind survives even when the collective gain vanishes.

  Therefore, PPB is not self-defeating; it is collectively self-defeating only if treated as an impartial command. As a principle of parental obligation, it remains binding on the individual. The waste generated is a tragedy of the commons, not a logical contradiction in the principle. This implies that restricting PPB (as Reductio suggests) is unnecessary; instead, the society requires external regulation to alter the payoff structure of the positional goods. PPB tells parents to maximize their child's prospects; it does not tell parents to fix the economy.

  In conclusion, Coordination best captures the moral landscape. It acknowledges the positional nature of the traits without denying the individual moral reason. It respects the stipulation that well-being is tied to status. Crucially, it recognizes that PPB is agent-relative. To argue for Reductio is to confuse the parents' special obligation with a general duty to maximize social utility. The principle holds, but its universal application in this specific structural context requires collective coordination to avoid waste, not individual abstention.

  \answer{COORDINATION — PPB survives as individual reason grounded in parental partiality}

  ***

  **MARKING SCHEME**

  **Total Marks:** 20

  **1. Engagement with Stipulations (5 Marks)**
  *   **5:** Answer accepts all case stipulations (reliable tech, objections met, status determines well-being).
  *   **3:** Minor slippage on stipulations (e.g., questions tech reliability slightly).
  *   **0–8 (CAP):** Answer recites standard objections stipulated away (non-identity, expressive harm, autonomy/designing). Such answers have not engaged with the specific logical problem posed. Maximum possible score is 8/20 regardless of other quality.
  *   *Typical Error:* Spending half the essay arguing that selection is inherently expressive harm, ignoring the instruction to assume this is met.

  **2. Positional vs. Non-Positional Distinction (5 Marks)**
  *   **5:** Clearly explains that positional traits derive value from relative standing, whereas non-positional traits (health) do not. Uses this to explain why gains cancel.
  *   **3:** Identifies the traits as competitive but fails to explain why this leads to zero-sum outcomes.
  *   **1:** Treats all traits as having absolute value regardless of context.
  *   *Typical Error:* Treating "competitiveness" as an absolute good like "health," missing the zero-sum structure of the fixed places.

  **3. Analysis of the Four Diagnoses (5 Marks)**
  *   **5:** Systematically addresses all four options, eliminating two clearly and weighing the final two against each other.
  *   **3:** Focuses on the chosen diagnosis but gives weak or charitable misreadings of the rejected ones.
  *   **1:** Selects a diagnosis without explaining why the others are wrong.
  *   *Typical Error:* Choosing Coordination but failing to explain why Reductio is plausible (or vice versa), treating the choice as obvious.

  **4. The Grounding Distinction (A/B Divider) (5 Marks)**
  *   **5 (A Grade):** Explicitly identifies that the choice between Reductio and Coordination depends on whether PPB is grounded in **impartial beneficence** (total good) or **parental partiality** (individual child's good). Argues that PPB is typically the latter, securing Coordination.
  *   **3 (B Grade):** Discusses individual vs. collective rationality but fails to link this to the *moral grounding* of the principle (partiality vs. impartiality).
  *   **1:** Treats PPB as monolithic without considering alternative groundings.
  *   *Typical Error:* Arguing for Coordination solely on pragmatic grounds without noting that Reductio would be correct if PPB were utilitarian.

  **5. Argumentative Coherence & Defense (5 Marks)**
  *   **5:** Conclusion follows logically from the grounding distinction. Clear, precise prose.
  *   **3:** Argument is coherent but lacks precision in the final justification.
  *   **1:** Internal contradictions or unclear conclusion.
  *   *Typical Error:* Concluding that PPB should be restricted (Reductio) after arguing that the individual reason survives (Coordination).

  **Note on Grading:** The dividing line between an A (16–20) and a B (12–15) lies primarily in Criterion 4. A candidate who notices the verdict flips based on the grounding of PPB demonstrates the required seminar-level insight. A candidate who argues Coordination is simply "correct" without qualifying the grounding condition cannot score above 15.

  \answer{COORDINATION — PPB survives as individual reason grounded in parental partiality}
