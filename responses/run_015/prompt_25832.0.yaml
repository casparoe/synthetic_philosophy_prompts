prompt: |-
  My reading group has been stuck for weeks arguing about procreative beneficence and whether it inevitably slides into something eugenic. One of us basically defends something like Savulescu's principle — that prospective parents have a moral reason (maybe even an obligation) to select the embryo or fetus that will have the best expected life, all else equal. The other side thinks this whole framework is rotten: that it expresses a disrespectful attitude toward disabled people, that it misunderstands the parent-child relationship, and that once you start ranking possible future people by expected wellbeing you've already stepped onto a slope that ends somewhere ugly. They've been talking past each other.

  I want you to draft the adversarial-collaboration document they should have produced. Include:

  1. A numbered list of claims both sides can sign — about what selection technologies can and can't do, about what the non-identity problem does and doesn't show, about what counts as harm or wronging in this context, and about the historical relationship between eugenics and reproductive choice. These shouldn't be vacuous.

  2. A disagreements table. For each disagreement, give the precise formulation of the proponent's view (worded so the proponent would say "yes, that's what I think") and the critic's view (worded so the critic would say "yes, that's what I think").

  3. The cruxes — the sub-questions where, if you could settle them, at least one side would update. For each crux, describe a concrete case or piece of evidence both would agree bears on it, and record what each side predicts about that case.

  I suspect one crux is whether selection and postnatal enhancement are morally continuous, and another is whether the expressivist argument survives if you grant that disabilities can be both neutral-in-principle and dispreferred-in-practice without contradiction. But dont let me steer you — find the real cruxes.
reasoning: |-
  Here's a thinking process that leads to the suggested adversarial-collaboration document:

  1.  **Analyze the Request:**
      *   **Context:** A reading group stuck on the debate over Procreative Beneficence (PB) vs. Anti-Eugenics/Expressivist critiques (Savulescu vs. critics like Asch, Parens, Sandel, etc.).
      *   **Task:** Draft an "Adversarial-Collaboration Document."
      *   **Components:**
          1.  Numbered list of shared claims (common ground).
          2.  Disagreements table (precise formulations of opposing views).
          3.  Cruxes (sub-questions where resolution leads to updating, with concrete cases/evidence).
      *   **Constraint:** Do not simply accept the user's suggested cruxes; find the *real* cruxes (though I can incorporate them if they are indeed central).
      *   **Tone:** Philosophical, precise, neutral, structured for productive dialogue.

  2.  **Deconstruct the Debate (PB vs. Critics):**
      *   *Procreative Beneficence (Savulescu):* Parents have a moral reason to select the child, of the possible children they could have, who is expected to have the best life, or at least as good a life as the others, based on relevant available information. It relies on the Non-Identity Problem (NIP). It distinguishes between "making people happy" and "making happy people."
      *   *Critics (Expressivist/Disability Rights/Social Model):* Selection implies disabled lives are not worth living (expressivist objection). It commodifies children (Kantian/relational objection). It ignores social causes of disability (social model). It risks sliding into coercive eugenics (historical/slippery slope).
      *   *Key Tensions:* Individual obligation vs. social impact; "harm" in non-identity contexts; the meaning of "best life"; the distinction between therapy and enhancement; the distinction between state coercion and private choice.

  3.  **Drafting Section 1: Shared Claims (Common Ground):**
      *   *Goal:* Non-vacuous statements both can accept. Avoid "everyone wants happy babies."
      *   *Idea 1 (Tech):* Selection isn't creation ex nihilo; it's choosing between potential genomes.
      *   *Idea 2 (NIP):* Both sides usually accept the logic of NIP (selecting A doesn't harm B because B never exists), but disagree on its moral relevance. I need to phrase this carefully. Maybe: "NIP shows selection doesn't harm the unselected embryo *in a comparative sense*."
      *   *Idea 3 (Harm/Wronging):* Both agree that *coercive* state eugenics is wrong. Both agree parents have *some* obligations (e.g., not to drink heavily during pregnancy).
      *   *Idea 4 (History):* Acknowledge the history of eugenics without equating PB with it immediately.
      *   *Refinement:* Make sure these aren't just "we agree to disagree." They need to be substantive premises.
      *   *Drafting points:*
          1.  Tech limits (PGT-P is probabilistic, not deterministic).
          2.  NIP logic (no comparative harm to unselected).
          3.  State vs. Individual (coercion is distinct from private choice).
          4.  Disability complexity (disability involves impairment + social barriers).
          5.  Parental obligation baseline (some limits on reproductive liberty exist).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Steelman both sides.
      *   *Disagreement 1: The Source of Obligation.* PB says "maximize wellbeing." Critics say "acceptance/unconditional love."
      *   *Disagreement 2: The Expressivist Objection.* PB says "selecting against a trait isn't judging the person." Critics say "it sends a message that lives with that trait are less valuable."
      *   *Disagreement 3: The Social Model.* PB says "impairment reduces wellbeing regardless of society." Critics say "disability is largely socially constructed; fixing society is better than fixing genes."
      *   *Disagreement 4: The Slope.* PB says "private choice doesn't equal state coercion." Critics say "norms create pressure that functions like coercion."
      *   *Formulation:* Needs to be "I believe X" vs "I believe Y" where X and Y are incompatible.

  5.  **Drafting Section 3: Cruxes:**
      *   *Goal:* Identify the pivot points. If we answer X, does the debate shift?
      *   *User Suggestion 1:* Selection vs. Postnatal Enhancement continuity. (Is it worse to edit an embryo than to tutor a child?)
      *   *User Suggestion 2:* Expressivist contradiction. (Can you disprefer a trait without devaluing the person?)
      *   *My Analysis:* These are good, but are they the *deepest* cruxes?
      *   *Crux A: The "Person-Affecting" Intuition vs. Impersonal Totality.* Does the NIP actually dissolve the intuition that we wronged the disabled child? If we feel we wronged them, PB's foundation shakes.
      *   *Crux B: The Definition of "Best Life."* Is wellbeing aggregative (health + wealth + happiness) or relational (being loved for who you are)? If "best life" inherently excludes the possibility of flourishing with disability, PB wins. If "best life" is compatible with disability, PB loses force.
      *   *Crux C: Normative Pressure as Harm.* Does social pressure resulting from widespread PB constitute a harm comparable to state coercion?
      *   *Selection:* I'll choose three distinct cruxes.
          1.  *The Metaphysics of Harm:* Is "wronging" possible without a specific victim who is worse off? (NIP relevance).
          2.  *The Expressivist Logic:* Does selecting against a trait logically entail judging existing people with that trait as having lesser worth?
          3.  *The Social/Individual Trade-off:* Does individual selection significantly undermine collective efforts to accommodate disability?

      *   *Wait, let's look closer at the User's hint:* "Don't let me steer you." I need to evaluate if their suggestions are the *real* cruxes.
      *   *Critique of User's Crux 1 (Selection vs. Enhancement):* This is often a proxy for "natural vs. artificial." But Savulescu argues they *are* continuous. If critics admit they are continuous, do they have to reject postnatal enhancement too? Or accept selection? This is a strong crux.
      *   *Critique of User's Crux 2 (Expressivist):* This is the core of the disability rights objection. If PB can show that "disvaluing a trait" $\neq$ "disvaluing a person," the expressivist objection weakens.
      *   *Alternative Crux:* The *Non-Identity Problem's Moral Weight*. Proponents think NIP blocks the "harm" claim. Critics think NIP is a logical trick that ignores moral intuition.
      *   *Decision:* I will use the User's suggestions but refine them to be more actionable "cruxes" with concrete cases, and add one about the *Social Model vs. Medical Model* of wellbeing, as that underpins the "Best Life" calculation.

      *   *Refining Crux 1 (Continuity):* Case: Cognitive enhancement. Is giving a child Ritalin for focus (postnatal) morally different from selecting an embryo for focus genes (prenatal)?
      *   *Refining Crux 2 (Expressivism):* Case: Deafness. Can a parent say "I prefer a hearing child" without implying "Deaf adults are lesser"?
      *   *Refining Crux 3 (The "Best Life" Metric):* Case: Depression susceptibility. Is selecting against depression ableist, or just preventing suffering? This tests the "wellbeing" definition.

  6.  **Review and Refine:**
      *   *Tone Check:* Is it neutral? Yes.
      *   *Structure:* Numbered list, Table, Cruxes.
      *   *Content:* Ensure Savulescu's specific arguments (PB, NIP) are represented accurately, and the Critics (Expressivist, Social Model) are represented fairly (not just "eugenics bad").
      *   *Shared Claims:* Ensure they aren't trivial. Instead of "Eugenics was bad," use "State-coerced sterilization was unjust." Instead of "Tech works," use "Tech is probabilistic."
      *   *Disagreements:* Ensure they are mutually exclusive.
      *   *Cruxes:* Ensure there is a "prediction" for each side.

  7.  **Final Polish:** Check against the prompt requirements one last time.
      *   1. Numbered list of claims both sides sign? Yes.
      *   2. Disagreements table (Proponent vs. Critic)? Yes.
      *   3. Cruxes (sub-questions, concrete case, predictions)? Yes.
      *   Did I let the user steer me? I will incorporate their intuition but frame it more rigorously. The "Selection/Enhancement continuity" is a classic Savulescu move, but the *real* crux is often about *parental acceptance*. I'll make sure the cruxes target the underlying moral metaphysics.

      *(Self-Correction during drafting)*: I need to make sure the "Shared Claims" don't accidentally concede the debate. For example, agreeing that "NIP shows no comparative harm" is something Savulescu wants, but Critics might reject the *moral relevance* of that. I should phrase it as "NIP demonstrates that selection does not make the unselected individual worse off than they would otherwise have been," which is logically true even if they disagree on whether that matters morally.

      *(Refining the Cruxes)*: The user suggested "Selection vs Postnatal Enhancement." Savulescu says they are the same. Critics often say they are different (one is conditional acceptance, one is nurturing). The crux is: *Does the timing/method of intervention change the moral relationship between parent and child?*
      The user suggested "Expressivist argument." The crux is: *Can a preference for a trait be separated from a judgment on persons?*

      I will add a third crux about *Wellbeing Measurement*. PB requires measuring "expected life." Critics say this is impossible/biased against disabled experiences.

      Let's assemble the document.

  8.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  # Adversarial Collaboration: Procreative Beneficence and the Eugenics Objection

  **Date:** October 26, 2023
  **Participants:** Proponent (PB) vs. Critic (Expressivist/Social Model)
  **Facilitator:** [Your Name/Group Lead]

  ## 1. Shared Premises (Common Ground)
  *Both parties affirm the following claims. These are not concessions, but foundational agreements required to localize the dispute.*

  1.  **Technological Limitation:** Current preimplantation genetic testing (PGT) and polygenic scoring are probabilistic, not deterministic. Selecting an embryo for a trait (e.g., lower disease risk) increases the likelihood of that outcome but does not guarantee it.
  2.  **The Logic of Non-Identity:** Selection decisions determine *which* individual comes into existence. Therefore, selecting Embryo A over Embryo B does not make Embryo B "worse off" in a comparative sense, because Embryo B never exists to experience a alternative state.
  3.  **State vs. Private Action:** There is a moral distinction between state-mandated reproductive policies (coercive eugenics) and private parental decision-making. Both sides agree that state-coerced sterilization or mandated selection is unjust.
  4.  **The Reality of Disability:** Disability involves an interaction between physical/mental impairment and social/environmental barriers. Both sides agree that society is currently insufficiently accommodating toward disabled people.
  5.  **Parental Obligations Exist:** Reproductive liberty is not absolute. Both sides agree there are *some* moral constraints on prospective parents (e.g., avoiding known teratogens like thalidomide or heavy alcohol consumption during pregnancy).
  6.  **Historical Harm:** The 20th-century eugenics movements involved gross human rights violations, racism, and ableism. Both sides agree these historical programs were morally abhorrent, though they disagree on whether PB shares the *logical structure* of those programs.
  7.  **Wellbeing Matters:** Both sides agree that reducing severe, uncontrollable suffering (e.g., Tay-Sachs disease) is a morally relevant goal in reproduction.

  ## 2. Disagreements Table
  *Precise formulations of the conflicting positions. Each side should be able to read their column and affirm, "Yes, that is my view."*

  | Domain | Proponent (Procreative Beneficence) | Critic (Expressivist/Social Model) |
  | :--- | :--- | :--- |
  | **The Source of Obligation** | Parents have a moral reason to select the child, of the possible children they could have, who is expected to have the best life, based on relevant available information. This is an impersonal obligation to maximize wellbeing. | Parents have a moral obligation to welcome the child *as they come*, fostering an unconditional relationship. Prioritizing traits instrumentalizes the child and treats them as a product to be optimized rather than a person to be loved. |
  | **The Expressivist Claim** | Selecting against a genetic trait (e.g., deafness) expresses a preference for a specific *experience of life*, not a judgment on the *worth of existing people* with that trait. One can value disabled lives while preferring non-disability for one's own child. | Selection sends a harmful social message: that lives with disabilities are not worth living or are inherently inferior. This undermines the social standing and self-worth of existing disabled people, regardless of the parent's private intent. |
  | **The Nature of Harm** | Because of the Non-Identity Problem, selection cannot "harm" the unselected embryo. The only relevant harm is failing to bring into existence a person who would have had a better life (an impersonal harm). | Moral wronging is not limited to comparative harm. We can wrong someone by bringing them into existence under conditions that violate their dignity or rights, even if they are not "worse off" than non-existence. |
  | **Social Consequences** | Private choices aggregate to reduce suffering without requiring state coercion. Widespread selection reduces the burden of disease without necessitating the human rights violations of historical eugenics. | Private choices create social norms that function as soft coercion. If selection becomes standard, parents who refuse it are judged negligent, and resources for accommodating disability will erode as the population becomes "healthier." |
  | **Definition of "Best Life"** | "Best life" can be reasonably estimated using objective metrics of health, cognitive capacity, and emotional stability. Disability generally reduces these metrics, all else equal. | "Best life" is incommensurable and deeply subjective. Disabled lives often contain unique goods and forms of flourishing that non-disabled metrics fail to capture. Ranking lives by "expected wellbeing" is epistemically arrogant and biased. |

  ## 3. Cruxes
  *Specific sub-questions where resolution would force at least one side to update their position. Each crux includes a concrete case and the conflicting predictions.*

  ### Crux 1: The Continuity of Intervention
  **The Question:** Is there a morally relevant difference between *prenatal selection* against a trait and *postnatal enhancement* of the same trait?

  *   **Concrete Case:** Consider a genetic predisposition for low impulse control.
      *   *Scenario A:* Parents select an embryo without the predisposition.
      *   *Scenario B:* Parents select a random embryo but commit to intensive behavioral therapy and cognitive training to maximize impulse control.
  *   **Why it matters:** If these are morally continuous, the Critic must either accept selection or condemn aggressive postnatal shaping (which seems unreasonable). If they are distinct, the Proponent must identify the moral boundary (e.g., consent, bodily integrity).
  *   **Predictions:**
      *   **Proponent:** Predicts that if the Critic accepts Scenario B as morally permissible (or obligatory), they must logically accept Scenario A. The method (gene vs. environment) does not change the moral goal (improving the child's prospects).
      *   **Critic:** Predicts that Scenario B is an act of *nurture* within an existing relationship of acceptance, whereas Scenario A is an act of *manufacture* conditional on meeting specifications. They will maintain that the parent-child relationship is fundamentally altered by making existence conditional on genetic traits.

  ### Crux 2: The Expressivist Logic
  **The Question:** Can one consistently hold that a disability makes a life "worse" (supporting selection) without implying that existing people with that disability have "less worth"?

  *   **Concrete Case:** A Deaf couple uses PGT to ensure their child is Deaf (the reverse of Savulescu's standard case, but logically identical regarding trait selection).
      *   *Scenario:* The parents argue Deaf culture provides a richer life for their child.
  *   **Why it matters:** This tests the coherence of the Expressivist Objection. If selecting *for* Deafness is wrong because it limits the child's opportunities, then selecting *against* it should be right (PB view). If selecting *for* Deafness is acceptable as a cultural affirmation, then selecting *against* it might be expressive of bias (Critic view).
  *   **Predictions:**
      *   **Proponent:** Predicts the Critic will condemn the Deaf couple's selection *for* deafness (as harming the child's open future). If they do, the Proponent argues the Critic admits some traits are objectively worse, validating PB's core metric.
      *   **Critic:** Predicts the Proponent will condemn the Deaf couple's selection *for* deafness (as violating PB). If they do, the Critic argues this proves PB is not neutral; it enforces a specific, ableist definition of "good life," confirming the Expressivist fear that PB devalues minority ways of being.

  ### Crux 3: The Epistemology of Wellbeing
  **The Question:** Is "expected wellbeing" knowable enough to ground a moral obligation, given the adaptation problem (hedonic treadmill) and social model of disability?

  *   **Concrete Case:** Down Syndrome (Trisomy 21).
      *   *Evidence:* Studies show parents of children with Down Syndrome often report high levels of family cohesion and happiness, comparable to or exceeding parents of neurotypical children, despite medical challenges.
  *   **Why it matters:** PB relies on the claim that we can predict which life will be "better." If disabled lives are systematically underestimated by non-disabled observers (the "disability paradox"), PB's obligation is based on false data.
  *   **Predictions:**
      *   **Proponent:** Predicts that even if happiness levels are similar, the *burden of impairment* (medical interventions, reduced autonomy, shorter lifespan) objectively reduces the "open future" and opportunity range, justifying the selection against it regardless of reported happiness.
      *   **Critic:** Predicts that if reported wellbeing is equal, the "objective" reduction in opportunity is a social failure, not a biological one. They argue that PB mistakes *social prejudice* for *biological fact*, and that updating on this data should dissolve the obligation to select against the trait.

  ***

  **Next Steps for the Group:**
  1.  Review the **Shared Premises**. If any member cannot sign one, discuss until the wording is adjusted or the disagreement is moved to Section 2.
  2.  Select **one Crux** to focus on for the next session.
  3.  Come prepared with evidence specifically related to the "Predictions" listed in that Crux.
