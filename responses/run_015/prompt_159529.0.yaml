answer: |-
  **Joint Statement on the Structure of Deontological Constraints**

  **1. Agreed Claims**

  The undersigned working groups, representing agent-relative and collectivist perspectives within deontological ethics, submit the following statement of common ground. This document does not resolve the paradox of deontology but delineates the precise topology of our disagreement to facilitate further inquiry.

  1.  **The Existence of Constraints:** Both camps affirm that morality includes agent-constraints: prohibitions on performing certain act-types (e.g., killing an innocent) that are not solely derivative of the badness of the act's outcome. A constraint is violated only by the agent who performs the prohibited act, not by the agent who merely allows it to occur.
  2.  **The Gravity of Violations:** Both camps agree that a violation of a deontological constraint is a morally grave event. It is not merely a local friction cost; it is a distinct moral bad that counts against the moral quality of a world state, even if it does not necessarily determine the wrongness of the agent's choice in every context.
  3.  **The Paradoxical Structure:** We agree that the "paradox" arises from the conjunction of three plausible claims: (i) each agent is prohibited from violating the constraint; (ii) each agent is permitted (or required) not to violate the constraint even to prevent others from doing so; (iii) the cumulative result of universal adherence to (ii) is a state of affairs containing more violations than necessary. We agree this structure requires explanation, not dismissal.
  4.  **The Status of Intuitions:** We treat immediate intuitions about single-agent cases (e.g., "I must not kill this one") as provisional data points, not final verdicts. A theory that systematically contradicts these intuitions bears a burden of proof, but a theory that preserves them at the cost of aggregate outcomes also bears a burden of proof.
  5.  **The Separateness of Persons:** Both camps accept that the separateness of persons is a morally significant fact. We disagree only on whether this fact necessitates that moral evaluation be indexed strictly to individual agency (Camp A) or whether it allows for moral evaluation indexed to collective capacity (Camp B).
  6.  **Formalism:** We agree that the logic of constraints can be modeled using agent-relative indices. The disagreement lies in whether these indices are ineliminable features of the moral law or heuristic devices masking a more complex group-level function.

  **2. Disagreements Table**

  | Disputed Claim | Camp A (Agent-Relative) | Camp B (Collectivist) | Classification |
  | :--- | :--- | :--- | :--- |
  | **The Locus of Obligation** | The primary unit of moral assessment is the individual agent-token. A constraint binds *me* to *my* actions regardless of what others do or could do. | The primary unit of moral assessment is the minimal group capable of preventing the violation. Individual duties are derivative of the group's obligation to minimize violations subject to constraints. | **Genuine (Substantive).** This is not a verbal dispute about the word "agent." It is a disagreement about the fundamental architecture of moral theory: whether morality is essentially dyadic (agent-world) or triadic (agent-group-world). |
  | **The Significance of Aggregate Violations** | The total number of violations in a world is not a cost that individual agents must trade against their own integrity. The "paradoxical" outcome is regrettable but not a theoretical defect. | The total number of violations is a moral cost that must be minimized by the relevant moral unit. A theory that licenses a net increase in violations without justification has lost its normative force. | **Genuine (Substantive).** Camp A denies the premise that aggregate violations function as a "cost" in the same currency as individual wrongs. Camp B asserts they do. |
  | **The Nature of the Permission** | The permission to refrain from preventing violations is a robust moral permission. The agent is not blameworthy, and the act of refraining is not wrong. | The permission to refrain is at best a secondary excusing condition. The agent may be unblameworthy due to psychological limits, but the act of refraining remains pro tanto wrong or requires a collective override. | **Mixed (Verbal/Substantive).** Partly verbal: Camp A defines "wrong" as "violation of a duty binding on the individual," while Camp B defines it as "failure to optimize within group constraints." Substantive: They disagree on whether the agent merits moral praise or merely acquittal. |

  **3. Cruxes**

  To move beyond stalemate, we identify four specific cruxes. Settling these would force at least one camp to revise its core commitments.

  **Crux 1: The Clinician and the Board**
  *Case:* A clinician cannot perform a violating act (killing one to save five) but can request authorization from an oversight board. In Variation 1, she is external to the board. In Variation 2, she is one of five voting members, knowing her vote is pivotal.
  *   **(a) Shared Bearing:** Both camps accept this tests the distinction between performing a violation and authorizing a violation within a collective structure.
  *   **(b) Camp A Prediction:** In both variations, the clinician is prohibited from seeking or casting the vote that authorizes the killing. Her constraint travels with her agency; she cannot use the board as a moral launderer.
  *   **(c) Camp B Prediction:** In Variation 1, she may request authorization (shifting agency to the group). In Variation 2, she must vote to authorize. The group is the moral agent; her vote is a component of the group's duty to minimize violations.
  *   **(d) Falsification Conditions:** Camp A would concede if it can be shown that authorizing via vote does not constitute "killing" in the relevant sense. Camp B would concede if it turns out that individual voters retain full individual liability for the outcome despite the collective mechanism.

  **Crux 2: The Transmitter**
  *Case:* An agent controls a relay. If she does nothing, a message reaches a distant agent who will perform a violating act to prevent five violations. If she intervenes, the message is blocked, and the five violations occur. The distant agent acts wrongly if he acts.
  *   **(a) Shared Bearing:** This isolates the duty of facilitation from the duty of performance. It tests whether the constraint prohibits causing the violation or merely performing it.
  *   **(b) Camp A Prediction:** The agent is permitted to block the message. Facilitating a wrong done by another is not equivalent to doing it oneself. Her hands remain clean if she does not personally violate the constraint.
  *   **(c) Camp B Prediction:** The agent is prohibited from blocking the message. By blocking, she becomes the cause of the five violations. The constraint binds the causal chain, not just the final hand.
  *   **(d) Falsification Conditions:** Camp A would concede if blocking the message is shown to be causally equivalent to performing the act (e.g., if the relay is a prosthetic extension of the distant agent). Camp B would concede if the distant agent's moral guilt is shown to sever the causal responsibility of the transmitter.

  **Crux 3: The Relay of Refusals**
  *Case:* Ten agents face the choice in sequence. Each can violate once to prevent five violations. Each knows all previous agents refused. We ask about the tenth agent compared to the first.
  *   **(a) Shared Bearing:** This tests whether the history of others' choices alters the deontological status of the current agent's constraint.
  *   **(b) Camp A Prediction:** The tenth agent's position is identical to the first's. The constraint is agent-relative and time-slice specific. The sins of the predecessors do not license a new violation.
  *   **(c) Camp B Prediction:** The tenth agent faces a different moral landscape. As the cumulative failure of the group becomes certain, the obligation to minimize violations may override the constraint, or the constraint may shift to the group level, binding the last resort agent.
  *   **(d) Falsification Conditions:** Camp A would concede if the "separateness of persons" is shown to be diluted by common knowledge of the sequence. Camp B would concede if the tenth agent is found to be just as blameworthy for violating as the first, regardless of the accumulated body count.

  **Crux 4: Aggregation and Thresholds (Selected Crux)**
  *Case:* The standard case prevents five violations. We vary this to five hundred violations, or to an uncertain expectation of five hundred.
  *   **(a) Shared Bearing:** This tests whether the constraint is absolute or sensitive to the magnitude of the averted disaster.
  *   **(b) Camp A Prediction:** The structure of the constraint is invariant. Whether it is five or five hundred, the prohibition on killing the innocent remains. Thresholds may exist, but they do not change the *structure* of the constraint, only its catastrophic override conditions.
  *   **(c) Camp B Prediction:** The constraint is sensitive to scale. At five, the constraint holds. At five hundred, the group obligation to prevent the disaster renders the individual prohibition void. The constraint is a function of the ratio of violations.
  *   **(d) Falsification Conditions:** Camp A would concede if a specific number can be identified where the intuition shifts from "forbidden" to "required" without appealing to consequentialist collapse. Camp B would concede if the intuition remains stable that killing the one is forbidden even when five hundred die, provided the one is not causally responsible for the five hundred.

  **Signatories:**
  *Camp A (Agent-Relative Deontology Working Group)*
  *Camp B (Collectivist Deontology Working Group)*
