  Your sealed standard case begs the question. You assume the box provides the sharpness, but actually the community's agreement to defer to the box provides the sharpness. In ordinary language, the deference is to the collective usage itself. You call usage mushy, but that's just because you're looking at it from the inside. From a God's eye view, every utterance is a physical event with precise conditions. You're treating our inability to locate the boundary as evidence that there isn't one, but that's just the vagueness phenomenon itself, not an argument against epistemicism. The lack of an explicit box doesn't create a gap in reality; it just hides the causal chain that fixes the reference.

  As for dispositions, your claim that they're indeterminate is empirically false. Every verbal disposition supervenes on physical states which are precise. If I call 5,000 grains a heap today but not tomorrow, there's a precise physical difference in the context or my brain state that explains the shift. The meaning of 'heap' is fixed by the total function mapping all possible physical contexts to truth values. That function is complex, sure, but it's not gappy. The anchor is the entirety of the physical world that sustains our linguistic practice. You say mush can't pin down a sharp line, but I say you're just underestimating how much detail is in the mush.
