answer: |-
  This is an exceptionally clear formulation of the problem. You have effectively reconstructed the **Common Kind Assumption** argument, pushed it to its modal limits, and correctly identified that the real danger lies not in the refutation of Naive Realism, but in the slide towards global scepticism and self-undermining (steps 8 and 9).

  You asked which step to reject, given your desire to keep (2) Substitutability, (3) Reflection is Authoritative, and (10) the Empirical Reality of the distinction. You also mentioned your "voltmeter" intuition.

  The step you should reject is **Premise (4): Grounding Invariance**.

  Here is why that is the correct move, why it looked airtight in your draft, and what it costs you compared to the other main positions in the literature.

  ### Why Premise (4) is the Weak Link

  Premise (4) states: *If two experiences have the same phenomenal character, then whatever metaphysically grounds that character is the same in both cases.*

  This premise looks airtight because it relies on a very intuitive principle of metaphysics: **Supervenience**. It seems obvious that if the "what it is like" (the phenomenon) is identical, the underlying reality (the ground) must be identical. To deny it feels like saying two things can be exactly the same while being fundamentally different, which borders on contradiction.

  However, (4) smuggles in a heavy philosophical commitment: **Internalism about the Mind**. It assumes that the metaphysical nature of a mental state is exhausted by what is accessible to the subject from the inside.

  Your "voltmeter" intuition is precisely the philosophical tool needed to break this. You suggested that introspection might be coarse-grained: a difference in constitution might not show up on the read-out. In philosophical terms, this is distinguishing between **Phenomenal Character** (the introspectible profile) and **Metaphysical Nature** (the wide, relational facts).

  By rejecting (4), you claim that two experiences can share the same *narrow* phenomenal character (satisfying (3)) while having different *wide* metaphysical grounds (satisfying (10)). In the veridical case, the ground includes the room; in the V-3 case, it includes the stimulator. They feel the same, but they are not the same kind of state metaphysically.

  ### How This Saves Your Constraints

  1.  **Keeps (2) Substitutability:** You accept the V-3 case is possible.
  2.  **Keeps (3) Reflection is Authoritative:** You maintain that if the subject can't tell them apart, they share the same *phenomenal character* (the voltmeter reading is the same).
  3.  **Keeps (10) Empirical Reality:** Because you deny (4), you can say the *grounds* are different. Therefore, perception and hallucination are distinct natural kinds, even if they feel the same. This blocks the self-undermining conclusion (9), because "hallucination" is defined by its lack of external ground, not just its internal feel.
  4.  **Avoids (8) Generalisation:** This view allows for **Externalism about Intentionality**. Just as the phenomenal character can be grounded externally, so can memory and belief. A confabulated memory and a real memory might feel the same (same character) but differ in ground (one is caused by a past event, the other isn't). This prevents the collapse into global scepticism.

  ### The Cost: What You Are Committing To

  Rejecting (4) commits you to **Phenomenal Externalism** (or at least, Externalism about Mental Grounding). This is a respectable position, but it is not free.

  1.  **The Transparency Intuition:** You must accept that introspection does not reveal the full essence of your own mind. There are facts about your experience (e.g., that it is *of* a room) that you cannot know by reflection alone. This clashes with the Cartesian idea that the mind is transparent to itself.
  2.  **Causal Complexity:** You need a story about how the external object gets to be part of the ground without changing the "feel". Usually, this is handled by **Representationalism (Intentionalism)**. You would say the experience has a content (e.g., <there is a room>), and in the veridical case, the content is satisfied by the room, while in the hallucination, it is not. The content is the same, the satisfaction conditions differ.

  ### Comparison with Other Options

  To ensure you are choosing the right battle, here is what the other main theories pay to solve this puzzle.

  **1. Disjunctivism (Rejects Premise 3)**
  *   **The Move:** Disjunctivists (like M.G.F. Martin or John McDowell) argue that (3) is false. They say that if one case is a perception and the other a hallucination, they *cannot* have the same fundamental phenomenal character, even if they are indistinguishable. Indistinguishability is an epistemic property, not a metaphysical one.
  *   **The Cost:** This saves Naive Realism (1) and avoids scepticism. However, it is very hard to explain *why* they are indistinguishable if they are fundamentally different. It requires saying that the hallucination is a "bad case" that merely mimics the "good case" without sharing its nature. Many find this counter-intuitive (it violates the "Common Intuition" that the brain state determines the experience).
  *   **Fit for you:** Poor. You explicitly stated you want to keep (3).

  **2. Sense-Data Theory (Accepts 4, Accepts 8/9)**
  *   **The Move:** This view accepts your argument all the way through. It agrees that no experience is directly of a mind-independent object. We are always aware of intermediate sense-data.
  *   **The Cost:** It bites the bullet on (9) and (10). It redefines "perception" so that we never really perceive the external world directly. This leads to the scepticism you want to avoid. It makes the distinction between perception and hallucination merely a causal one regarding the *source* of the sense-data, not the *object* of awareness.
  *   **Fit for you:** Poor. You want to keep (10) in a robust realist sense.

  **3. Intentionalism / Representationalism (Rejects the inference from 7 to 8)**
  *   **The Move:** This is the closest to your proposed solution. Intentionalists often accept (4) but argue that the "ground" is *representational content*, which can be wide. However, to fully align with your voltmeter idea, it is cleaner to reject (4). They say perception and hallucination are the same representational state, but one is accurate and the other is not.
  *   **The Cost:** You must explain how a state can be "about" something without that something existing (in the hallucination case). This requires a theory of content (e.g., teleosemantics) that can handle error.
  *   **Fit for you:** Excellent. This is essentially the view you are drifting towards.

  ### Final Verdict

  Your "voltmeter" metaphor is not just a heuristic; it is a rigorous objection to **Premise (4)**.

  By rejecting (4), you adopt a view where **Phenomenal Character does not supervene on Internal State alone**, or alternatively, where **Internal State does not exhaust Metaphysical Ground**. This allows you to maintain that the V-3 subject and the normal perceiver are in the same *phenomenal* state (satisfying your desire to keep (3)), but different *metaphysical* states (satisfying (10) and blocking (9)).

  The price you pay is **Internalist Privilege**. You must concede that you cannot know the full nature of your own experience by reflection alone. You cannot know, just by thinking about it, whether your experience is grounded in a room or a stimulator. But given that you are willing to sacrifice Naive Realism to avoid global scepticism, this is a very reasonable price to pay.

  Stick with the voltmeter. It's the most stable path for the constraints you've set.
