answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees; Principal Investigators, *Cooperation Without Contact*
  **FROM:** Grants Committee Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Proposal *Cooperation Without Contact*

  **Decision**

  The Grants Committee recommends **declining** the proposal *Cooperation Without Contact* in its current form. We will not award the requested $1.8M.

  This decision is not a judgment on the intellectual merit of the research. Rather, it rests on a specific fiduciary constraint unique to this funding cycle. To ensure clarity for both the Board and the applicants, I must separate three distinct questions that our deliberations have run together.

  **1. The Three Questions**

  *   **Question One (Theoretical):** Is it rational for an agent to bear costs to benefit another agent it cannot causally influence, based solely on the correlation of their decision procedures? The applicants argue yes; skeptics argue no. This committee takes no position on the validity of this decision theory.
  *   **Question Two (Fiduciary/Legal):** Can a foundation fiduciary spend money from a restricted gift on this activity? The gift instrument requires an "identifiable mechanism linking the funded activity to the benefit sought." Our legal counsel interprets "mechanism" as requiring a causal pathway. The applicants argue this interpretation begs the question, as the proposed benefit is acausal.
  *   **Question Three (Epistemic):** Is it responsible for a funder to act when it can never receive feedback on whether the expenditure succeeded? One trustee argues this violates stewardship duties; another argues that demanding feedback is itself a decision that influences outcomes via correlation.

  **2. The Deciding Factor**

  Our recommendation turns entirely on **Question Two**.

  Regardless of whether acausal cooperation is theoretically rational (Question One), or whether feedback is strictly necessary for responsible action (Question Three), we are bound by the legal instrument governing these funds. A restricted gift is a contract between the foundation and the donor. When counsel advises that the proposed expenditure does not meet the contractual definition of "mechanism," the committee cannot proceed without exposing the foundation to legal risk.

  The applicants argue that the donor, drafting terms decades ago, could not have contemplated acausal trade. While historically plausible, this does not alter the text we are bound to administer. We cannot unilaterally redefine "mechanism" to include correlation without causal linkage unless we obtain a legal modification of the gift terms, which is not feasible within this cycle.

  **3. Accessibility and Complexity**

  For trustees unfamiliar with the underlying decision theory: This proposal asks us to fund work suggesting that if two entities think alike, one can benefit the other by acting cooperatively, even if they are too far apart to ever meet or signal. It is not magic; it is a claim about how rational choice works when outcomes are correlated rather than caused.

  We are not rejecting this because it sounds strange. We are rejecting it because our governing documents require us to trace a line from *our* action to *the benefit* that looks like cause-and-effect. The proposal explicitly states that line does not exist in this case. To fund it would be to assert that our legal constraints are subordinate to a specific, contested interpretation of rationality.

  **4. The Strongest Case for the Losing Side**

  The argument for funding rests on the intersection of Question Two and Question Three. The proponents on this committee argue that refusing this grant makes our foundation evidence of a "non-cooperator." If other similar entities (foundations, AIs, civilizations) reason similarly, our refusal signals that cooperation is not viable, thereby causing them to refuse cooperation as well. In this view, our decision *is* the mechanism.

  Furthermore, the applicants contend that restricting "mechanism" to causal pathways arbitrarily excludes high-impact global priorities simply because they are novel. If the donor's ultimate intent was "benefit humanity," adhering strictly to outdated causal models might violate the spirit of the gift even if it satisfies the letter.

  **For this argument to carry the day, two things would need to be true:**
  1.  Legal counsel would need to agree that "mechanism" encompasses acausal correlation, or that the donor's intent supersedes the textual restriction in this specific context.
  2.  The Board would need to accept that the risk of legal challenge is outweighed by the potential upside of validating acausal cooperation theory.

  Neither condition is met. We cannot act on a legal interpretation counsel has rejected, nor can we accept a risk profile that jeopardizes the foundation's compliance status.

  **5. The Empirical Workstream**

  Several committee members noted that the proposal's empirical workstream (studying convergence in independently trained systems) might satisfy the "mechanism" requirement, as it produces observable data. However, the investigators have stated the theoretical and empirical workstreams are inseparable and will not accept a partial award. Consequently, we cannot fund the empirical portion alone. Had the investigators allowed a modular award, we might have funded the empirical component while declining the formal theory component.

  **6. Conclusion**

  To the applicants: Your work addresses profound questions at the frontier of decision theory and machine learning. Our inability to fund this project reflects the specific constraints of this restricted gift, not a dismissal of the research agenda. We encourage you to seek support from unrestricted funds or donors whose mandates align more closely with acausal frameworks.

  To the Board: We must adhere to the instruments that govern our capital. While the reasoning behind the proposal is sophisticated and the potential stakes are high, we cannot authorize expenditures that legal counsel advises fall outside the scope of our restricted gifts.

  I move that we decline the proposal.

  **Recommended Action:** Decline.
  **Amount:** $0.
  **Conditions:** None.
