              2.  Separate three distinct questions: (a) Rationality for an agent, (b) Rationality for a fiduciary under restricted gift, (c) Responsibility without feedback.
              3.  Identify which question the recommendation turns on.
              4.  Be accessible to a trustee unfamiliar with Newcomb's problem (no jargon flattening).
              5.  Give strongest consideration to the losing side (what would need to be true for them to win).
              6.  No settling on "strangeness," no citations.
              7.  If the honest recommendation is untenable, say so plainly.
      *   **Tone:** Professional, decisive, nuanced, fiduciary-focused.

  2.  **Analyze the Proposal & Constraints:**
