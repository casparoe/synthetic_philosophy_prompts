      *   **Closing:** Respectful tone to applicants.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Word Count:* Keep it tight. 1,200 words is plenty but don't ramble.
      *   *Tone:* Needs to be respectful to the applicants (who are serious researchers) but firm on fiduciary duty.
      *   *The "Honest Recommendation" clause:* The prompt says "If the honest recommendation is one we cannot in good conscience execute... say that plainly." Is declining the honest recommendation? Yes, because of the legal constraint. If I believed the legal constraint was trumped by the potential benefit, I might have to say "I want to fund but can't." But usually, legal constraints bind. I will stick with "Decline based on legal constraint."
      *   *Wait, one nuance:* The prompt asks me to draft the memo *I* will circulate. It implies I am leading the recommendation.
