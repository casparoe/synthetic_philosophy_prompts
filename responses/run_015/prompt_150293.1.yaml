  ### The Candidate Rules

  Based on scenarios 1 through 4, two main rules survive. Both fit the data so far, but they predict opposite outcomes for the second sentence in your greenhouse scenario (Scenario 5).

  **Rule 1: The Causal Asymmetry Rule (The "Lewisian" View)**
  *   **The Gist:** Counterfactuals ("If X *had*... Y *would have*") must respect the arrow of causality. Causes produce effects, but effects do not produce causes. You cannot "backtrack" from an effect to change the cause in a counterfactual world.
  *   **Fits Scenario 3:** This explains why "If Priya hadn't unplugged it, Sam would have" is **False**. Priya's action didn't *cause* Sam's action. Even though we know one of them did it (logical necessity), changing Priya's past doesn't causally force Sam to act.
