  Based on the track record you've provided, your friend Mo is running a very specific set of semantic distinctions that are standard in academic linguistics and philosophy of language. She is distinguishing between **indicative conditionals** (which track information and evidence) and **counterfactual conditionals** (which track causal structure and possibility).

