answer: |-
  There is no established single term for this property, so the concept is best defined as **Severable Defeat**.

  **Severable Defeat** describes a historical loss where the moral value of the participants' actions can be inherited without inheriting the political responsibility for the cause or the consequence. The defining boundary is **agency**: the event must allow the inheritor to claim the virtue of the struggle (bravery, sacrifice, endurance) while disclaiming the power that initiated it or the outcome that followed it. This distinguishes it from **Negative Heritage**, which encompasses sites of shame or perpetrator guilt where the inheritance is burdensome rather than empowering, and from **Moral Victory**, which is a rhetorical framing applied after the fact rather than a structural property of the event itself.

  The edges of this concept are fixed by whether the loss permits the separation of *suffering* from *choice*.

  1.  **The Charge of the Light Brigade:** This falls **inside** the boundary. Although the battle was a blunder, the commemoration isolates the soldiers' obedience and bravery from the commanders' incompetence. The inheritors claim the virtue of the charge without accepting responsibility for the strategic failure; the blame is absorbed by abstracted leadership, leaving the sacrifice clean.
  2.  **Victories:** These fall **outside** the boundary. A victory inherently validates the exercise of power that achieved it; you cannot inherit the win without inheriting the cause. Victories become emblems through *confirmation* of agency, whereas Severable Defeats become emblems through the *suspension* of agency. Your uncertainty here stems from conflating two different mechanisms of myth-making: one relies on efficacy (victory), the other on purity of sacrifice (defeat).
  3.  **The Temple's Destruction:** This falls **outside** the boundary. In Jewish memory, this catastrophe was interpreted as theological failure (sin leading to exile), attaching the loss directly to the losers' internal agency. Because the loss required self-reproach rather than allowing pure defiance, it could not be severed from the responsibility of the people, preventing it from functioning as a clean emblem of identity in the way Masada did.

  The reason defeat is essential to this concept is that only failure creates the gap between *intent* and *outcome* wide enough to insert this severance. Victory fuses virtue and power; defeat allows them to be split. A defeat becomes usable only when the history can be carved such that the inheritor holds the pain but not the power.
