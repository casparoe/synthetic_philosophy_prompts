answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** Concept Stability vs. Fluidity in the Ring-String Microdomain

  **I. Agreed Claims**

  1.  **Phenomenological Sufficiency:** Any adequate account must explain not only the modal answer for each probe but the full distribution of candidate answers, including frequency of "balking" (no answer). A model that predicts only the mode is incomplete.
  2.  **Rotational Equivalence:** In the ring-string microdomain, rotational inscriptions (e.g., [ijk] and [kij]) denote the same object. Any variance in answer distributions driven solely by rotational inscription, absent structural difference, constitutes a failure of account unless explicitly modeled as a processing artifact.
  3.  **Structural Pressure:** Both sides agree that structural pressure exists. The disagreement lies in whether pressure selects among fixed mappings (Stable) or modulates the definitions of the concepts themselves (Fluid).
  4.  **Competence:** A competent account must specify the mechanism by which the successor relation is evaluated at boundary conditions (e.g., *z* to *a*, or within groups like *cc*). Ambiguity here is data, not noise.
  5.  **Endpoint Removal:** Removing distinguished endpoints forces reliance on structural roles (e.g., "end of run") rather than positional indices (e.g., "last letter"). Both sides agree this isolates the mechanism of role-binding from simple positional lookup.
  6.  **Mechanism Sharing:** Both sides accept the presence of competitive activation processes (codelets or equivalents). The dispute concerns what competes: candidate mappings over stable types (Stable) or candidate conceptualizations of the types themselves (Fluid).

  **II. Residual Disagreements**

  | Issue | Stable-Concepts Formulation | Fluid-Concept Formulation | Neutral Restatement | Verdict & Justification |
  | :--- | :--- | :--- | :--- | :--- |
  | **Concept Identity** | Concepts (SUCCESSOR, GROUP) have fixed definitions; variance arises from which fixed concept is selected for a mapping. | Concepts have graded boundaries; variance arises from the context-dependent stretching of concept definitions. | Both agree conceptual application varies by context; they disagree on whether the variation is in selection (Stable) or definition (Fluid). | **Genuine.** This is an ontological dispute about whether the variable parameters belong to the mapping function or the concept representation. |
  | **Source of Noise** | Answer distributions reflect competition among candidate mappings over a fixed vocabulary; "noise" is search stochasticity. | Answer distributions reflect the inherent graded nature of concepts; "noise" is the phenomenon of fluidity itself. | Both agree distributions are systematic; they disagree on whether distribution width indicates search error or conceptual reality. | **Genuine.** One treats distribution as error around a rule; the other treats distribution as the rule. |
  | **Ring Effect** | The ring removes positional cues, clarifying the structural roles available for mapping. | The ring removes anchors, forcing concepts to slip because no fixed position stabilizes them. | Both agree the ring increases reliance on structural roles; they disagree on whether this reveals stable roles or forces slippage. | **Verbal (Partially).** Both describe the same mechanistic outcome (increased role reliance) but label the cause differently ("clarification" vs. "slippage"). |

  **III. The Cruxes**

  **Crux 1: Rotational Invariance (Probe P2)**
  *   **Test:** Does the distribution shift significantly between [ijk] and [kij] despite structural identity?
  *   **Stable Prediction:** Modal answer [ijl] for both. Minor variance due to parsing cost of finding the run end in [kij]. Distribution shape remains stable.
  *   **Fluid Prediction:** Modal answer may shift or distribution widens for [kij]. The "last letter as written" exerts conceptual pressure distinct from "end of run."
  *   **Movement:** Stable side moves if rotation causes a statistically significant shift in modal answer not explained by parsing cost. Fluid side moves if distribution remains identical across rotations.

  **Crux 2: Boundary Slippage (Probe P3)**
  *   **Test:** Handling of [xyz] where successor relation is undefined or wraps.
  *   **Stable Prediction:** Binary outcome based on rule parameter (wrap yes/no). Distribution reflects competition between "wrap" and "balk" rules.
  *   **Fluid Prediction:** Graded outcome. Probability of [xya] vs. [xyy] reflects degree of conceptual stretch allowed under pressure.
  *   **Movement:** Stable side moves if answer probability correlates continuously with structural pressure metrics rather than rule competition. Fluid side moves if a fixed rule set predicts the distribution without context-sensitive parameters.

  **Crux 3: Grouping Identity (Probe P4)**
  *   **Test:** Handling of [abcc]. Does *cc* act as one unit or two letters?
  *   **Stable Prediction:** Competition between mapping "letter" and mapping "group." One wins based on salience weights.
  *   **Fluid Prediction:** The concept LETTER slides toward GROUP under pressure of duplication.
  *   **Movement:** Stable side moves if the same object is categorized differently in identical contexts without a change in mapping goals. Fluid side moves if a fixed inventory of types (LETTER, GROUP) predicts the split without sliding boundaries.

  **Evidence Against Own View**
  *   **Stable:** Systematic dependence of answers on rotation of notation that cannot be reduced to mapping search cost implies conceptual content is not stable across inscriptions.
  *   **Fluid:** A single fixed inventory of concepts plus a ranking over mappings predicting the whole distribution (including balking) without context-sensitivity in concept identity implies concepts are stable.

  **IV. Closing Statement**

  This collaboration has established that the ring-string microdomain successfully isolates structural role-binding from positional indexing. We agree that answer distributions are the primary data requiring explanation, not merely the modal response. We have not established the ontological status of the concepts involved; specifically, whether context-dependence resides in the mapping process or the concept definitions remains unresolved. We agree that the questions posed in Section III are answerable via the probe battery. The extent to which rotational invariance holds (P2) and whether boundary conditions (P3) produce binary or graded responses will determine which account offers greater predictive power. We commit to accepting the empirical distribution of results as the arbiter of these specific claims.

  ***

  **V. Private Note to Moderator**

  **Likely Stall Points:**
  Section II, Row 1 (Concept Identity) is the highest risk. The Stable side may reject "fixed definitions" if it implies rigidity against context, preferring "fixed vocabulary." The Fluid side may reject "graded boundaries" if it implies lack of structure. I have phrased it as "selection vs. definition," but be prepared to mediate semantics here.

  **Rejection Risks:**
  The Stable side is most likely to reject the Neutral Restatement in Section II, Row 3 (Ring Effect). They will argue "clarifying structural roles" is not verbal equivalence to "forcing concepts to slip." They view slippage as a bug; the Fluid side views it as a feature. You may need to allow them to keep their own phrasing in the final sign-off if the neutral version feels like a compromise they disown.

  **Reformulation Recommendation:**
  Crux 1 (P2) needs tighter operationalization of "parsing cost." The Stable side will attribute any rotation variance to search difficulty. You should require them to pre-register a maximum allowable variance threshold attributable to cost. If the observed variance exceeds this, the Stable view is challenged. Without this cap, P2 results could be absorbed by either side post-hoc.

  **General Tone:**
  The draft is tight. Ensure neither side feels the "Agreed Claims" section commits them to the other's ontology. Claim 6 is the most delicate; ensure they agree on "competitive activation" generally, not specifically on Copycat codelets.
