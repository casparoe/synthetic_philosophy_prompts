  # JOINT STATEMENT ON HIGHER-ORDER EVIDENCE AND PEER DISAGREEMENT
  **Signatories:** Dr. E. Concilia (Conciliationist) & Dr. S. Fastus (Steadfaster)
  **Date:** October 26, 2023

  ## I. AGREED CLAIMS
  1.  **Definition of HOE:** Higher-order evidence (HOE) is evidence concerning the quality of one's first-order evidence or the reliability of one's cognitive processing regarding a proposition $P$.
  2.  **Definition of Peer:** An epistemic peer is an agent judged to be equally likely to have evaluated the first-order evidence correctly regarding $P$, prior to the disclosure of disagreement.
  3.  **The Phenomenon:** In standard cases (e.g., mental arithmetic, restaurant bills), learning of peer disagreement constitutes HOE that defeats some portion of the justification for maintaining one's initial credence.
  4.  **Stakes:** The debate concerns *rationality* (internal coherence and responsiveness to evidence), not merely *knowledge* (external reliability).
  5.  **Standard Cases:** In "Simple Calculation" cases (where agents have identical access to data), both parties agree that maintaining 100% confidence is irrational. The dispute concerns the *degree* of required revision.

  ## II. DISAGREEMENTS TABLE

  | Topic | Conciliationist Wording (Dr. Concilia) | Steadfaster Wording (Dr. Fastus) |
  | :--- | :--- | :--- |
  | **Primary Norm** | Peer disagreement mandates significant credence revision toward the peer's view, ceteris paribus. | Peer disagreement permits maintaining one's view if first-order reasoning remains intact and unrebuted. |
  | **Weight of HOE** | HOE regarding peer dissent often outweighs first-order evidence, forcing suspension or splitting. | First-order evidence retains primacy; HOE regarding dissent is merely a defeater if it indicates specific error. |
  | **Meta-Disagreement** | Disagreement about the norm of disagreement itself requires conciliation about the norm. | Disagreement about the norm does not force abandonment of the norm if the norm is correctly derived. |
  | **Akrasia** | It can be rational to believe $P$ while believing one's belief in $P$ is unsupported by total evidence. | Rationality forbids akrasia; one cannot rationally believe $P$ while judging that belief in $P$ is irrational. |

  ## III. THE "ALL THE WAY UP" PROBLEM
  *Addressing the recursive disagreement where agents disagree on $P$ and on the norm $N$ governing disagreement.*

  **The Issue:** Agent A (Conciliationist) and Agent B (Steadfaster) disagree on $P$. A believes norm $N_C$ (conciliate); B believes norm $N_S$ (hold firm). A sees B's adherence to $N_S$ as a violation of rationality. B sees A's adherence to $N_C$ as an over-reaction to HOE.

  **Conciliationist Position:** I owe weight to B's rejection of $N_C$. If I ignore B's meta-view, I violate $N_C$. This creates a tension, but not a self-defeat. I must lower confidence in $N_C$, but not necessarily to 0.5. I can maintain $N_C$ as a "theoretical commitment" while acknowledging my application of it is currently disputed by a peer. This is not self-undermining; it is recursive updating.

  **Steadfaster Position:** A's meta-view is irrelevant to the truth of $N_S$. $N_S$ is true because first-order reasoning is sovereign. B can keep both $P$ and $N_S$. The meta-level row does not undo steadfastness because the meta-evidence (A's opinion) is less weighty than the first-order evidence (the proof/data). B does not owe weight to A's meta-view regarding the norm itself.

  ## IV. CRUXES AND PRE-REGISTERED PREDICTIONS

  | Crux | Concrete Case | Conciliationist Prediction | Steadfaster Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Recursive Norms** | **The Meta-Ethics Seminar:** Two peers disagree on a moral claim $P$. They also disclose they hold opposing norms of disagreement ($N_C$ vs $N_S$). | Both agents must reduce confidence in their respective norms ($N_C$ and $N_S$) by at least 20%. Failure to do so is irrational. | Agents may reduce confidence in $P$ slightly, but confidence in their respective norms ($N_C$/$N_S$) need not drop. Holding $N_S$ firm is compatible with recognizing the dispute. |
  | **2. Rational Akrasia** | **The Drugged Mathematician:** A solves a proof ($P$). Reliable HOE indicates A's coffee was drugged with a reasoning-impairer, though A feels no impairment. | It is rational for A to believe $P$ (due to the proof) while believing belief in $P$ is irrational (due to the drug). Akrasia is the rational state. | It is irrational for A to believe $P$. A must suspend judgment on $P$. Akrasia is never rational; it is at best excusable cognitive dissonance. |
  | **3. Self-Undermining** | **The Conciliationist Meeting:** A group of Conciliationists meets a single Steadfaster regarding $N_C$. | The Conciliationists must significantly lower confidence in $N_C$ due to the Steadfaster's dissent, potentially destabilizing the group's consensus. | The Conciliationists' view is unstable, proving $N_C$ is false. The Steadfaster's view remains stable. |

  ## V. VERBAL DISPUTE IDENTIFICATION
  **Component:** The definition of "Rational Requirement."

  **Why it is verbal:**
  *   **Concilia** uses "Rational" to mean *responsiveness to total evidence including HOE*. On this definition, ignoring peer dissent is definitionally irrational.
  *   **Fastus** uses "Rational" to mean *proper function of first-order cognitive faculties*. On this definition, ignoring peer dissent is rational if first-order faculties are functioning correctly.

  **Resolution Protocol:** In Sections III and IV, "Rational" refers to **Concilia's definition** (Total Evidence Responsiveness). Fastus signs this under protest, noting that under his definition, his predictions in Crux 1 and 2 hold trivially. We agree that if the dispute is purely terminological here, the substantive disagreement reduces to: *Does the evidence provided by a peer's belief state override the evidence provided by one's own reasoning process?*

  **Signed:**
  *Dr. E. Concilia*
  *Dr. S. Fastus*
