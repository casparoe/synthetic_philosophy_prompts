      *   *The "All the Way Up" Problem:* If C meets S, C thinks S is irrational for being S. S thinks C is irrational for being C. Does C have to conciliate about the principle of conciliation itself? (The self-undermining objection).
      *   *Epistemic Akrasia:* Believing $P$ while believing that believing $P$ is irrational. C often implies akrasia is required (I believe $P$, but I see my peer disagrees, so I should think my belief is untrustworthy). S denies this.
      *   *Verbal Disputes:* Often revolve around the definition of "peer," "rationality," or "evidence."

  3.  **Drafting - Section 1: Agreed Claims:**
