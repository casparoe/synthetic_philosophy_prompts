  ### The Decomposition

  **(a) Coherence of 'The Present' in Relativity: 0.9**
  *   **Reasoning:** The Rietdijk-Putnam argument kills global simultaneity slices. However, your "depth parameter along world-lines" sounds effectively like **proper time** ($\tau$). Proper time is Lorentz invariant; every observer agrees on the proper time elapsed along a specific world-line. If "presentness" is a local property indexed to $\tau_{now}$ rather than a global hyperplane $t_{now}$, you successfully avoid the contradiction. You sacrifice a global "Now," but you save the "Now" for the subject.
  *   **Probability:** High. This is technically feasible within Special Relativity (SR).

  **(b) Metaphysical Distinction (vs. Eternalism): 0.5**
  *   **Reasoning:** This is the bottleneck. If past stages *exist* (as you stipulate), you have the ontology of Eternalism. Adding a primitive property of "presentness-weight" makes this a **Moving Spotlight Theory**. The critique is that if the past exists, it serves as a truth-maker for past-tense statements regardless of its "weight." If "weight 0" means "causally inert," that's physical, not metaphysical. If it means "ontologically secondary," we need an account of graded existence that isn't just verbal. There is a 50/50 chance this is a genuine metaphysical distinction versus just Eternalism with a label.
  *   **Probability:** Moderate/Low. The "extra steps" charge is strong.

  **(c) Ontological Bloat vs. Weighting Cost: 0.7**
  *   **Reasoning:** Eternalism is accused of bloat (all times exist). Your view keeps the bloat but adds a weighting function. Is the function cheaper than the bloat? Probably not. However, if the weighting function explains the *phenomenology* of passage without denying the *ontology* of the past, it might be a net theoretical gain in explanatory power, even if ontologically costly. It's not clearly *worse* than brute Eternalism, just more complex.
  *   **Probability:** Moderate/High. Complexity is a cost, but not a fatal one.

  **(d) Intuition as Evidence: 0.6**
