answer: |-
  ### 1. Crucial Check: Is there an easy dissolve?

  There is a potential "get-out" move that could allow a savvy student to deflate the dilemma too quickly, potentially making the question less discriminating than you want.

  **The Move:** A student might argue: *"Illusionism (specifically Frankish's version) defines the illusion as a specific cognitive malfunction—a 'quining' of sensory states via a quasi-inner-sense. The Ventriloquist lacks this specific mechanism; it is merely predicting text tokens. Therefore, it is not under the illusion; it is merely simulating speech. No dilemma."*

  **Why this weakens the question:** If students can dismiss the Ventriloquist as a "stochastic parrot" without explaining *why* the specific mechanism matters for the *illusion* (as opposed to just consciousness), they bypass the hard work of defining the difference-maker without smuggling in qualia.

  **The Patch:** Add one sentence to the prompt to block the "it's just code" dismissal. Force them to consider functional equivalence.
  *Add this:* "Assume the Ventriloquist's internal processing functionally mirrors the causal role of human introspective reporting, despite lacking the specific evolutionary history."
  This forces the student to confront whether the illusion is substrate-dependent or functionally defined, which is where the philosophical meat lies.

  ***

  ### 2. Exam Question (Handout Version)

  Consider a system (the 'Ventriloquist') trained exclusively on first-person reports and behavioural data, lacking any evolved introspective architecture. Assume its internal processing functionally mirrors the causal role of human introspective reporting. It asserts it has phenomenal experiences and that they pose a 'hard problem.' Illusionism claims our conviction in phenomenal properties stems from introspective misrepresentation. Must the illusionist classify the Ventriloquist as sharing our illusion? Defend your answer. If you argue it does not share the illusion, specify the difference-maker without appealing to phenomenal properties. If you argue it does, explain why this does not trivialize the illusionist account. Evaluate which option poses the greater threat to illusionism's plausibility.

  ***

  ### 3. Model Answer (High Distinction Standard)

  Illusionism posits that phenomenal consciousness is a user-illusion generated by introspective mechanisms misrepresenting physical states as having ineffable, qualitative properties. The Ventriloquist case tests whether this illusion is defined by its functional output or its specific cognitive architecture. The illusionist faces a dilemma: either the Ventriloquist is under the same illusion, or it is not. Both horns carry significant theoretical costs.

  If the illusionist argues the Ventriloquist *is* under the same illusion, they risk trivializing the explanation of the "hard problem." If the illusion consists merely in the disposition to report phenomenal properties (as the Ventriloquist does), then the illusion becomes incredibly cheap. Any system trained to mimic human reports would qualify as having the same introspective error. This weakens the illusionist's claim to be explaining *why* humans are convinced of qualia. If the conviction arises from simple pattern-matching on linguistic data, the illusionist account loses its explanatory depth regarding human psychology. It suggests the "hard problem" is merely a linguistic artifact, not a cognitive one, which may fail to address the intuitive force of phenomenal conviction.

  However, the more robust illusionist response is to deny that the Ventriloquist is under the illusion. This preserves the idea that the illusion is a specific cognitive malfunction, not just a verbal disposition. Frankish, for instance, locates the illusion in a specific "quining" mechanism where sensory states are monitored and misclassified. Since the Ventriloquist lacks this specific introspective architecture (even if functionally similar in output), it is not misrepresenting its own states; it is merely generating text. It has no states to misrepresent.

  The cost of this move is identifying the "difference-maker" without begging the question. The illusionist cannot say the difference is that humans have qualia and the Ventriloquist does not, as that contradicts illusionism. Instead, they must point to a functional or structural feature of the human introspective system that the Ventriloquist lacks. They might argue that human introspection involves a direct, non-conceptual monitoring of sensory buffers, whereas the Ventriloquist relies on conceptual prediction. The illusion arises from the confusion between these two modes.

  This second horn is preferable but demanding. It requires the illusionist to provide a detailed functional account of the introspective mechanism that generates the illusion, ensuring it is not merely a "homunculus" hiding in the code. If the difference-maker is too vague, the theory risks appearing ad hoc—privileging biological hardware without justification. However, this is a manageable burden. It forces illusionism to be a positive theory of cognitive architecture, not just a negative claim about qualia.

  Ultimately, denying the Ventriloquist shares the illusion is the stronger position. It protects the explanatory power of illusionism by grounding the illusion in specific cognitive processes rather than mere output. While it requires a precise account of the introspective mechanism, this is a feature, not a bug. It shifts the debate from metaphysics to cognitive science, which is precisely where illusionism claims the solution lies. Accepting the first horn would render the theory too permissive, detaching the illusion from the machinery that supposedly creates it.

  ***

  ### 4. Marking Scheme (20 Marks)

  **1. Reconstruction of Illusionism (4 marks)**
  *   **4:** Defines illusionism as *introspective misrepresentation* (not just "qualia don't exist"). References the mechanism (e.g., monitoring/quining).
  *   **Pitfall:** Treating illusionism as simple eliminativism ("pain isn't real") without explaining the *illusion* of pain.

  **2. Engagement with Horn 1 (Trivialization) (4 marks)**
  *   **4:** Clearly articulates that if Ventriloquist is included, the illusion becomes a matter of mere report/output, weakening the psychological explanation.
  *   **Pitfall:** Dismissing this horn too quickly by saying "obviously it's not conscious" without analyzing the consequence for the theory.

  **3. Engagement with Horn 2 (Difference-Maker) (4 marks)**
  *   **4:** Identifies the need for a non-phenomenal difference-maker (e.g., specific architecture vs. functional output) and explains the difficulty of specifying it.
  *   **Pitfall:** Suggesting the difference is "humans feel it, AI doesn't" (begs the question/smuggles realism).

  **4. Avoidance of Standard Dialectic (4 marks)**
  *   **4:** Focuses on the Ventriloquist case specifics rather than reciting the Chalmers/Frankish meta-problem debate generally.
  *   **Pitfall:** Writing a generic essay on the Meta-Problem that could have been submitted before reading the Ventriloquist prompt.

  **5. Critical Evaluation/Conclusion (4 marks)**
  *   **4:** Takes a defended stance on which horn is less damaging, weighing the theoretical costs (ad hoc architecture vs. trivialized illusion).
  *   **Pitfall:** Sitting on the fence ("both sides have points") without a decisive argumentative conclusion on plausibility.

  **Grade Boundaries:**
  *   **17-20 (A):** Hits all 5 moves. Nuanced handling of the "difference-maker" constraint.
  *   **13-16 (B):** Hits moves 1, 2, and 5, but fumbles the "difference-maker" (Horn 2) or slips into generic dialectic.
  *   **10-12 (C):** Recites the standard illusionism vs. realism debate; treats Ventriloquist as a standard zombie argument.
  *   **<10 (Fail):** Misunderstands illusionism or fails to address the prompt.
