answer: |-
  Here is the translation of the nationalism-vs-cosmopolitanism debate into evolutionary game theory (EGT) vocabulary, followed by the residue report and an analysis of your "modular loyalty" twist.

  ### 1. The Translations

  **Cosmopolitan Equality**
  *   **Philosophical Claim:** Borders are morally arbitrary; every individual's interests count equally in the moral calculus regardless of location.
  *   **EGT Translation:** A **global interaction pool** with **low exit costs** and **strategy-blind matching**. Agents maximize fitness over a unified payoff matrix where partner selection is not constrained by exogenous tags (nationality). **Assortative matching** occurs solely based on behavioral phenotype (e.g., Cooperator vs. Defector) rather than geographic or institutional markers. **Spillover externalities** are internalized globally; there are no nested games that restrict enforcement mechanisms to local subgroups. The equilibrium strategy is invariant to spatial topology.

  **Nationalist / Associative Claims**
  *   **Philosophical Claim:** Shared institutions, history, or co-nationality generate special moral obligations that do not apply to outsiders.
  *   **EGT Translation:** **Local interaction pools** defined by **high exit costs** and **tag-based assortative matching**. Agents play a **nested game**: the primary resource game is overlaid by a reputation game restricted to the local pool. **Sunk-cost commitment devices** (e.g., language acquisition, cultural signaling) raise the barrier to entry for outsiders, reducing the risk of infiltration by defectors. "Special obligations" map to **conditional strategies** (e.g., Tit-for-Tat) that are evolutionarily stable only within the high-frequency interaction cluster. The boundary is an **endogenous equilibrium** maintained by the threat of exclusion from the local insurance pool.

  **Modular Loyalty (Your Twist)**
  *   **Philosophical Claim:** Obligations are not binary (compatriot vs. stranger) but scale continuously with the density of social connection; there are no sharp borders, only gradients of tie strength.
  *   **EGT Translation:** Interaction probability $P_{ij}$ and payoff weighting $W_{ij}$ are functions of **network modularity** and **topological distance**. Instead of discrete subgames, agents operate on a weighted adjacency matrix where the **discount factor** for future interactions decays with path length. **Partner-choice mechanisms** are probabilistic, favoring high-clustering neighbors but allowing non-zero interaction with distant nodes. "Obligation strength" corresponds to the **gradient of the incentive compatibility constraint**: the closer the topological neighbor, the higher the shadow of the future, and thus the stricter the equilibrium cooperation requirement. Boundaries are **fuzzy sets** defined by the percolation threshold of the network, not hard walls.

  ***

  ### 2. Residue Report

  **What Maps Cleanly**
  *   **Institutions $\rightarrow$ Repeated Game Structures:** The philosophical idea that institutions create obligations maps cleanly to the EGT concept that repeated interaction with memory enables cooperative equilibria (Folk Theorems) that are impossible in one-shot games.
  *   **Arbitrary Borders $\rightarrow$ Exogenous Constraints:** The cosmopolitan critique of borders maps well to the distinction between endogenous boundaries (emerging from strategy) and exogenous boundaries (imposed constraints on the interaction pool).
  *   **Solidarity $\rightarrow$ Risk Pooling:** The nationalist claim of "shared fate" translates directly to local insurance mechanisms where variance is reduced through correlated strategies within a cluster.

  **What Needs Fudging**
  *   **"Obligation" $\rightarrow$ "Incentive Compatibility":** This is the largest fudge. In philosophy, an obligation implies you *should* cooperate even if it costs you. In EGT, if cooperation is not incentive-compatible (i.e., not an ESS or Nash Equilibrium), the strategy goes extinct. You have to translate "moral duty" as "behavior maintained by the threat of future punishment or loss of reputation." If the threat vanishes, the "obligation" vanishes.
  *   **"Justice" $\rightarrow$ "Stability":** Cosmopolitans argue for equality as a matter of justice. EGT can only model equality as a stable distribution of payoffs. A highly unequal distribution can be just as evolutionarily stable as an equal one. You cannot derive the *normative preference* for equality from the dynamics without baking it into the utility function ex ante.
  *   **"Membership" $\rightarrow$ "Tag Recognition":** Associativism relies on a sense of belonging. EGT reduces this to tag recognition (green-beard effects or arbitrary markers). This fudges the phenomenological experience of identity into a simple signaling variable.

  **What Has No Counterpart**
  *   **The Normative "Ought":** EGT is descriptive and predictive. It explains why a behavior persists, not why it is morally binding. The "force" of a moral claim has no analogue in payoff matrices.
  *   **Agency and Reason-Giving:** Philosophers argue about reasons. EGT agents do not reason; they replicate, imitate, or optimize. The debate about *why* borders matter (history vs. coercion) collapses in EGT into *how* borders affect payoff variance.
  *   **Rights:** There is no concept of a claim an agent holds that cannot be overridden by aggregate fitness maximization.

  ***

  ### 3. Analysis of Modular Loyalty: Continuous vs. Binary

  **Can the Framework Express Continuous Obligation?**
  Mathematically, yes. You can define payoff matrices where the benefit of cooperation $B$ and cost $C$ are weighted by a continuous function of network distance $d_{ij}$ (e.g., $W_{ij} = e^{-\lambda d_{ij}}$). Network evolutionary game theory allows for weighted edges and probabilistic strategy updating. You can model a system where cooperation levels degrade smoothly as topological distance increases.

  **Does the Dynamics Force Binary Boxes?**
  Here is the friction. While the *setup* can be continuous, the *evolutionary dynamics* often drive the system toward discrete clustering.
  1.  **Modularity Maximization:** Evolutionary pressure on network structure often favors high modularity. Agents who cut weak ties to focus on strong ties often secure higher fitness in noisy environments. This creates a phase transition where a continuous gradient snaps into distinct communities.
  2.  **Strategy Polarization:** In many adaptive dynamics, mixed strategies (cooperate with probability $p$) are invaded by pure strategies (always cooperate or always defect). Similarly, "partial loyalty" is often unstable compared to "strong loyalty to cluster, defection to outsider."
  3.  **The Shadow of the Future:** The discount factor $\delta$ required to sustain cooperation is a threshold function. If topological distance pushes the effective $\delta$ below a critical threshold, cooperation collapses to zero. This creates a *de facto* binary boundary (cooperation zone vs. defection zone) even if the underlying weights are continuous.

  **Is the Binary an Artifact?**
  The residue suggests the philosophers' binary framing (compatriot vs. stranger) is likely an **emergent artifact of stable equilibria**, not a fundamental constraint of the vocabulary.
  *   **Philosophers** observe stable social states. In those states, boundaries appear sharp because mixed-strategy zones are evolutionarily unstable or high-friction.
  *   **Your Framework** reveals that while the *topology* is continuous, the *behavioral output* tends to quantize.

  **Verdict:** Your vocabulary does not force you into binary boxes, but the dynamics you are studying likely explain *why* the philosophers see binary boxes. The "residue" is not a failure of your EGT vocabulary; it is a failure of the philosophical debate to recognize that "special obligations" are likely phase-transition phenomena. The "binary" is a macroscopic observation of a microscopic gradient that has snapped into place due to stability pressures.

  **Honest Assessment:**
  If you stick strictly to EGT, you cannot validate the nationalist claim that we *ought* to prioritize compatriots, only that we *do* prioritize them because it is a stable equilibrium under specific topological constraints. Conversely, you cannot validate the cosmopolitan claim that we *ought* to ignore borders, only that global pooling is possible if exit costs are sufficiently low and enforcement mechanisms are globalized.

  Your "Modular Loyalty" model is the most robust translation because it avoids the false dichotomy. However, be prepared for your simulations to show that "modular loyalty" often evolves into "clustered loyalty" over time, effectively recreating the nationalist binary as an attractor state. That would be a significant finding: the binary is not a premise, but a product.
