answer: |-
  Your talk stands or falls on your defense of why the *actuality* of a life matters for moral perception, rather than just the narrative structure.

  ### Pre-emptive Concessions (First 5 Minutes)
  *   **On Method:** Acknowledge explicitly that you are not doing history of philosophy; you are using Plutarch as a case study for a contemporary moral psychological claim. Tell the Historian upfront: "I am not claiming this is what Plutarch thought he was doing metaphysically, but what his genre *does*."
  *   **On Scope:** Concede that biography of elite men is insufficient for a complete moral education. Frame it as "weight training" rather than "diet"—specific resistance for specific muscles, not the whole of moral life.
  *   **On Motivation:** Briefly acknowledge the personal context without making it the argument. "The impetus was personal, but the claim is structural."

  ### The Single Reply That Must Land
  **The Question:** "Why not fiction? Novels offer narrative shape without the historical baggage."
  **The Reply:** "Fiction allows the reader to subconsciously edit the case until it fits their existing moral framework; a real life resists redescription. When I read about a real person's failure, I cannot adjust the details to make them more sympathetic without violating the truth of the record. That resistance is the friction required to train perception. Fiction invites identification; biography demands witness."

  ### The Objection You Hope Nobody Asks
  "Is this project essentially therapeutic? Are you recommending this genre because it helps process grief, and then retrofitting a philosophical justification for what is actually a coping mechanism?"

  ---

  ### Q&A Preparation Sheet

  **1. The Graduate Student (Theory)**
  *   **Voice:** "Couldn't we achieve this same training with carefully constructed thought experiments or novels? They offer controlled variables without the exclusions of the biographical canon."
  *   **Damage:** High. Targets Step 3 of your argument directly.
  *   **90-Second Reply:** "Controlled variables are useful for testing principles, not training perception. Perception requires noise. Novels and thought experiments are designed by an author to lead you to a specific insight; they are solutions looking for a problem. A life is a problem looking for a solution. The 'noise' of a real life—the irrelevant details, the loose ends—forces you to decide what matters. That decision is the training."
  *   **Soft Spot:** Some modern novels are intentionally resistant and noisy. Be ready to concede that *some* fiction works, but biography works *structurally* better because of the death constraint.

  **2. The Historian of Ancient Philosophy**
  *   **Voice:** "Plutarch is a Middle Platonist writing in the Roman Empire. His pairings are driven by metaphysical concerns about fortune and virtue, not modern moral psychology. Aren't you instrumentalizing him?"
  *   **Damage:** Medium. Undermines your textual evidence for Step 1.
  *   **90-Second Reply:** "You are right about his metaphysics, and I am not claiming he shares my view of moral psychology. I am claiming the *genre* he inherited and shaped has effects independent of his explicit intent. A tool can be used differently than its maker intended. The structural feature of the *synkrisis* (comparison) forces a contrastive judgment regardless of whether Plutarch thought that judgment was about Platonic forms or character traits."
  *   **Soft Spot:** If she presses that the *synkrisis* is explicitly about virtue levels, you must concede you are reading against the grain of his explicit conclusions to find the implicit practice.

  **3. The Kantian Ethicist**
  *   **Voice:** "Moral philosophy must be action-guiding. If this training doesn't yield universalizable principles, how does it help me decide what to do tomorrow? It seems like mere sentiment cultivation."
  *   **Damage:** Medium-High. Challenges the utility of the project for normative theory.
  *   **90-Second Reply:** "Principles are blind without perception. The categorical imperative tells you to test your maxim, but it doesn't tell you how to describe the situation in the first place. If you misidentify the salient features, the principle processes garbage. This training ensures the input into your principle is accurate. It doesn't replace the principle; it makes the principle applicable."
  *   **Soft Spot:** You cannot prove this empirically in the room. It remains a claim about priority (perception before principle) that he may simply reject.

  **4. The Consequentialist Ethicist**
  *   **Voice:** "Even if it helps individuals, how does this scale to institutions or policy? We need heuristics for aggregate welfare, not nuanced readings of dead generals."
  *   **Damage:** Medium. Limits the scope of your claim.
  *   **90-Second Reply:** "Institutions are run by people who must notice salient features. Policy failures often stem from failing to notice specific human realities, not from lacking a welfare function. Training policymakers to notice resistance and particularity prevents the kind of abstract thinking that leads to catastrophic unintended consequences. It's not a replacement for policy analysis; it's a safeguard against bureaucratic blindness."
  *   **Soft Spot:** Hard to demonstrate a causal link between reading Plutarch and better policy outcomes.

  **5. The Philosopher of Psychology (Situationist)**
  *   **Voice:** "The situationist evidence suggests character traits aren't stable across contexts. If you're training me to see 'character,' aren't you reinforcing the fundamental attribution error?"
  *   **Damage:** High. Attacks the metaphysical basis of Step 2.
  *   **90-Second Reply:** "I am not training you to attribute stable, cross-situational traits. I am training you to notice how specific situations evoke specific responses. Plutarch doesn't say 'Alexander was brave everywhere'; he shows how Alexander reacted *here* versus how Caesar reacted *there*. It's not about reifying a trait; it's about recognizing patterns of interaction between agent and context. It's pattern recognition, not trait ontology."
  *   **Soft Spot:** She may argue that any focus on the individual agent inherently biases against situational factors. Concede that biography must be read alongside situationist data.

  **6. The Narrative Identity Scholar**
  *   **Voice:** "Biography imposes teleology. By closing the life with death, the biographer creates a coherence that wasn't lived. Doesn't this distort perception rather than sharpen it?"
  *   **Damage:** Medium-High. Challenges the mechanism of Step 3.
  *   **90-Second Reply:** "Life is lived forward but understood backward. The distortion you mention is unavoidable for any moral reflection. The advantage of biography is that the closure is fixed by fact, not by the reader's desire for comfort. In fiction, I can imagine a different ending if I don't like the moral. In biography, the death stands as a check on my desire for narrative coherence. It forces me to reconcile the shape with the facts."
  *   **Soft Spot:** Biographers still select facts to create shape. You must rely on the *resistance* of the historical record, not the purity of the narrative.

  **7. The Graduate Student (Critical Theory)**
  *   **Voice:** "These are lives of elite men. Won't training perception on them just habituate us to value power, military success, and patriarchal authority?"
  *   **Damage:** Medium. Challenges the ethical safety of the method.
  *   **90-Second Reply:** "That is a genuine risk, which is why the reading must be critical, not devotional. We read them not to adopt their values, but to practice noticing how their values operated. Furthermore, the technique is transferable. Once you learn to notice salience in a high-stakes political life, you apply that noticing to a nurse, a parent, or a teacher. The genre is the gym; the everyday world is where the muscle is used."
  *   **Soft Spot:** If the "weights" in the gym are biased, the muscle might develop asymmetrically. Acknowledge the need for diverse biographical subjects if the method is adopted broadly.

  **8. The Senior Colleague (Family Friend)**
  *   **Voice:** "You mentioned this started after your father died. Are you asking us to accept this because it's true, or because it helped you survive?"
  *   **Damage:** Low philosophically, High emotionally. Can derail the room into sympathy.
  *   **90-Second Reply:** "It helped me survive, which is why I looked at it closely. But the argument I've offered is structural—it's about how the genre works, not how I felt. Grief removed my interest in abstract theory, which allowed me to see what the text was actually doing. The origin is personal, but the mechanism is public. I'm asking you to evaluate the mechanism, not the grief."
  *   **Soft Spot:** Your voice might catch. Keep it brief and return immediately to the text.
