  **DRAFT HANDOUT: MENTAL CAUSATION FLOWCHART**
  **Seminar: Mind & Body**
  **Topic: Navigating Kim's Exclusion Argument**

  Hey everyone—here's a draft of the decision tree we talked about. I'm trying to move away from the usual "pick your -ism" quiz and instead focus on the actual commitments you're making. The goal is to see where you land on Kim's exclusion problem based on concrete claims, not just labels.

  Some of the paths lead to standard positions, others to some niche stuff we're kicking around (including a couple of experimental spots). If you hit a combo that seems broken, I've noted whether it's generally considered incoherent or just under-explored.

  Keep in mind: this is a draft, so forgive the rough edges.

  ***

  ### STEP 1: THE PHYSICAL WORLD
  **Question:** Does every physical event have a fully sufficient physical cause?
  *(aka: Is physical causation causally closed?)*

  *   **NO** -> Physical events can happen without a physical cause, or can be pushed around by non-physical stuff.
      *   **Go to STEP 1A**
  *   **YES** -> The physical world is a closed loop; nothing physical happens without a physical push.
      *   **Go to STEP 2**

  #### STEP 1A (If you said NO to Closure)
  **Claim:** Mental properties can reach down and move physical matter without a prior physical cause sufficient to do the job.
  *   **Leaf:** **Standard Emergentism**
      *   *Note:* This accepts downward causation. It looks like overdetermination or violation of closure, but you're okay with that because the mental level has its own causal power.
      *   *Status:* Coherent, but costs you closure.

  ***

  ### STEP 2: THE IDENTITY CHECK
  *(Only for those who said YES to Closure)*

  **Question:** Is a mental state just a physical state in disguise?
  *(aka: Are mental properties identical to physical ones?)*

  *   **YES** -> When you say "pain," you're just referring to a specific neural firing pattern. They are the same thing.
      *   **Leaf:** **Reductive Physicalism**
      *   *Note:* Exclusion argument doesn't hurt you here. If Mind = Body, there's no competition. The physical cause *is* the mental cause.
  *   **NO** -> Mental properties are real, but they are distinct from physical properties (they supervene, but aren't identical).
      *   **Go to STEP 3**

  ***

  ### STEP 3: THE COMPETITION CHECK
  *(Only for those who said YES to Closure + NO to Identity)*

  **Question:** Can one single effect have two separate sufficient causes happening at the same time?
  *(aka: Do you allow overdetermination?)*

  *   **YES** -> It's fine if my desire for water AND my neural state both suffice to cause my hand moving.
      *   **Leaf:** **Non-reductive Physicalism** (Standard Version)
      *   *Note:* You accept closure and distinct properties, but you bite the bullet on overdetermination. You argue it's not "systematic overdetermination" in a weird way, or that the causes are dependent enough to count as one.
  *   **NO** -> No, an effect doesn't need two sufficient causes. If the physical cause is enough, the mental one is squeezed out.
      *   **Go to STEP 4 (The Danger Zone)**

  ***

  ### STEP 4: THE DANGER ZONE
  *(Closure = YES, Identity = NO, Overdetermination = NO)*

  **Context:** This is where Kim says you lose mental causation. If the physical cause is sufficient, and it's not the same as the mental cause, and you can't have two causes... the mental cause gets excluded.

  **Question:** How do you save mental efficacy here?

  *   **Option A:** You don't. Mental properties exist, but they don't cause physical events. They are side-effects.
      *   **Leaf:** **Epiphenomenalism**
      *   *Status:* The default logical outcome of this branch. Coherent, but most people hate it because it makes minds useless.

  *   **Option B:** You argue the mental/physical line is just a pragmatic way of talking, not a real ontological split.
      *   **Leaf:** **Causal Bleed**
      *   *Claim:* The exclusion argument never actually starts because the boundary between "mental cause" and "physical cause" is fuzzy/pragmatic. They bleed into each other so they aren't competing distinct entities.
      *   *Status:* **Unexplored / Hidden.** This tries to dissolve the problem rather than solve it. It challenges the setup of Step 2 without asserting identity.

  *   **Option C:** You argue mental states cause physical ones, but only after a time-lag that avoids direct competition with the immediate physical cause.
      *   **Leaf:** **Buffered Causation**
      *   *Claim:* The physical cause triggers the immediate event, but the mental state buffers the signal to cause the *next* physical event in the chain, avoiding the "two causes for one effect" clash.
      *   *Status:* **Likely Incoherent (under current definitions).** If Closure is true, that *next* physical event also needs a physical cause. If the mental state is doing the work, is Closure violated? Or was the first physical cause not sufficient? This needs work.

  *   **Option D:** You want mental efficacy, but don't accept A, B, or C.
      *   **Leaf:** **[EMPTY COMBO]**
      *   *Status:* **Incoherent.** This is the exact spot Kim's argument targets. Accepting Closure + Distinct Properties + No Overdetermination + Mental Efficacy is logically inconsistent without modifying one of the previous definitions (like Bleed or Buffered).

  ***

  ### Quick Summary for Discussion
  1.  **Reductive:** Mind = Body. (Safe from exclusion).
  2.  **Emergentist:** Closure is false. (Safe from exclusion, but costly).
  3.  **Non-reductive:** Overdetermination is okay. (Safe, but controversial).
  4.  **Epiphenomenalist:** Mind doesn't cause physical stuff. (Logically safe, intuitively bad).
  5.  **Causal Bleed / Buffered:** Attempts to sneak through the "Danger Zone" without accepting Epiphenomenalism. We need to stress-test these.

  **Thoughts?** Specifically on whether "Buffered Causation" actually violates Closure or just redefines sufficiency. Let's talk about this Thursday.

  *(end of draft)*
