      *   *Proposed Shift:* Move from $Universalizable(M)$ to $Consistent(Set \{M_1, M_2, ...\})$.
      *   *Key Mechanism:* Maxims are triples (Condition, Action, Purpose). Universalization means everyone meeting the condition acts for that purpose.
      *   *Test:* Can the *purposes* be jointly satisfied if everyone adopts the set?
