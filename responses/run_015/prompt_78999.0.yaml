answer: |-
  **Project Title:** From Single Maxims to Maxim-Sets: A Consistency Constraint Model of Kantian Universalizability
  **Duration:** 3 Months (Summer Research Grant)
  **Applicant:** [Name], PhD Candidate in Philosophy

  **1. Statement of the Research Question**
  Standard interpretations of Kant's Formula of Universal Law (FUL) treat the universalizability test as a decision procedure applied to individual maxims in isolation. This project asks: *Can the universalizability test be reformulated as a consistency constraint on sets of maxims such that it yields determinate verdicts on competition and individuation cases without ad-hoc adjustments?*

  Specifically, I will test the hypothesis that shifting the input from a single maxim ($M$) to a maxim-set ($S = \{M_1, M_2, ...\}$), where universalization requires the joint satisfiability of the *purposes* within $S$ under universal adoption, resolves the logical instability of the standard model. The determinate answer sought is binary: either this reformulation recovers standard Kantian verdicts on a fixed battery of cases under independently motivated adequacy conditions, or it fails to do so because the individuation problem merely relocates from the maxim to the set.

  **2. Background and Problem Statement**
  The FUL is typically read in one of three ways: (1) as a logical-contradiction test (universalizing the action renders the concept incoherent); (2) as a teleological test (universalizing frustrates a necessary end of rational agency); or (3) as a duty-generation procedure (the test identifies specific obligations). All three readings stall on two persistent problems.

  First, the **maxim-individuation problem**. Verdicts flip based on descriptive richness. "I will break promises when convenient" generates a contradiction in conception; "I will break this promise to save a friend" often does not. Without a non-ad-hoc rule for operative description, the test lacks determinacy. Second, **competition cases**. Maxims to compete for scarce goods (jobs, tickets) appear permissible, yet if everyone adopts the maxim "I will take the last ticket," not everyone can succeed. Standard readings struggle to distinguish between a contradiction in conception (the action becomes impossible) and a mere factual scarcity that shouldn't render the maxim immoral.

  My hunch is that these errors stem from treating the test as evaluating a single atomistic input. If we treat the test as a constraint on a *system* of maxims—asking whether a specific maxim can belong to a set that every agent could adopt simultaneously—we can model the interaction of purposes rather than just the repeatability of actions.

  **3. Methodology and Work Plan**
  The project will proceed in three months, moving from formalization to case testing to evaluation.

  **Month 1: Formalization of the Maxim-Set Constraint**
  I will define the structural parameters of the reformulated test. This requires deciding three preliminary issues:
  1.  **Representation:** Maxims will be formalized as triples $\langle$Condition, Action, Purpose$\rangle$.
  2.  **Adoption vs. Permission:** I will adopt the "universal adoption" reading (everyone *does* act on the maxim) rather than "universal permission" (everyone *may*), as the former is required to test the joint satisfiability of purposes.
  3.  **Purpose Cash-Out:** I will define "purpose" functionally: a state of affairs the agent intends to bring about. I will establish criteria for when purposes conflict (e.g., logical incompatibility vs. resource scarcity).

  *Deliverable:* A working definition of the "Set-Consistency Constraint" (SCC).

  **Month 2: Case Testing and Application**
  I will apply the SCC to four specific test cases where standard readings falter.
  1.  **The Jacket/Chair:** Reserving a table via object. *Hypothesis:* Under SCC, this fails not because the action is unrepeatable, but because the purpose (secure seating via marker) becomes unsatisfiable if the set includes "ignore markers," creating a systemic contradiction.
  2.  **Ad Blockers:** Using ad-supported content while blocking ads. *Hypothesis:* This generates a contradiction in will; the purpose (free content) is jointly unsatisfiable if the set includes "block revenue source."
  3.  **Ticket Scalping:** Buying the last ticket purely for markup. *Hypothesis:* This tests competition. If the purpose is profit via scarcity, universal adoption saturates the market, frustrating the purpose.
  4.  **Strategic Voting:** Voting for a lesser evil rather than a preferred candidate. *Commitment:* I will argue this constitutes a **contradiction in the will**, not a mere coordination failure. Unlike everyone standing at a theater (physical impossibility), strategic voting undermines the institutional function of representation required for the purpose (effective agency) to be realized. If the maxim-set includes "abandon preference for utility," the feedback loop of representation degrades, frustrating the rational will's need for effective political agency.

  I will also test **second-order maxims**, such as "I will adopt whatever maxims are most expedient." The set-model should handle this by showing that a set containing only expedient maxims cannot be universally adopted without destroying the trust required for expediency to function.

  **Month 3: Evaluation and Write-Up**
  I will evaluate the SCC against two adequacy conditions: (1) **Verdict Stability** (does it match considered judgments on the test cases?) and (2) **Non-Ad-Hocness** (are the rules for set-selection independent of the desired verdict?).
  *   **Success:** A worked-out constraint that recovers the desired verdicts on the test cases without tuning parameters to fit the data.
  *   **Failure:** A "no-go" result demonstrating that the individuation problem merely relocates (i.e., deciding *which* set a maxim belongs to is as arbitrary as deciding *how* to describe the maxim), or that the adequacy conditions must be tuned to match the cases. I will explicitly document this outcome if it arises; a proof that the set-model cannot save the FUL from indeterminacy is a substantive philosophical result.

  **4. Scope and Limitations**
  This project is strictly limited to the logical structure of the universalizability test.
  *   **No Textual Exegesis:** I am not attempting to settle what Kant *meant* in the *Groundwork* or *Critique of Practical Reason*. I am treating the FUL as a philosophical tool to be repaired or retired.
  *   **No Full Ethical System:** I am not deriving a full deontological ethics. The goal is to fix the test mechanism, not to build the moral theory that sits on top of it.
  *   **Limited Case Set:** I will not survey all of Kant's examples. The four seed cases plus competition scenarios are sufficient to test the specific logical vulnerabilities regarding individuation and scarcity.

  **5. Significance**
  If successful, this proposal offers a way to salvage the universalizability test from the charge of emptiness or indeterminacy. If it fails, it provides a rigorous demonstration that the problem lies deeper than maxim description, potentially shifting the debate toward the nature of rational willing itself. Either outcome clarifies the boundaries of formalist ethics.
