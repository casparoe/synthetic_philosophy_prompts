answer: |-
  **Welcome to the National Gallery of Non-Indexical Aesthetics**

  At the NGNA, we believe art is defined solely by visual output, not biological origin. Our collection celebrates substrate-independent aesthetic identity. Below are answers to frequently asked questions regarding our ontological policies.

  **1. Is the Generative Model considered the artist?**
  No. To assign authorship to the Model is to commit the anthropomorphic fallacy. The Model is a high-fidelity conduit, not a creator. We adhere to a strict "Death of the Author" policy; meaning is generated exclusively in the viewer's encounter with the pixels. Whether the image emerged from a silicon chip or a carbon-based nervous system is irrelevant metadata. We celebrate the work without the worker.

  **2. Why do human-made pieces cost extra to view?**
  Human-generated works are classified as "Legacy Tier" exhibits. Due to the inefficiency of biological neural networks, human art is incredibly scarce, labor-intensive, and prone to motor-function errors. We charge a premium for this artisanal irregularity. Think of it like hand-stitched jeans versus perfect denim. You are paying for the romantic myth of human suffering and ego, not superior aesthetics. The "Original" surcharge covers the cost of verifying the biological bottleneck.

  **3. What happens if I feel deceived upon learning a work had a human behind it?**
  We offer a full refund under our Continuity Dispute Policy. If knowledge of the substrate alters your aesthetic experience, the ontological identity of the work has shifted for you. Essentially, you didn't see the art; you saw the biography. This indicates a failure of phenomenological consistency on your part, but we accommodate it. Please visit Guest Services to file a Phenomenological Inconsistency Claim within 30 minutes of exposure.

  **4. Can I commission a dream from the Model?**
  No. Commissioning implies intentionality, and the Model possesses no intent. You may submit prompt parameters, but the output is statistically derived, not dreamed. To claim the Model "understood" your request is to project agency onto mathematics. We sell outputs, not interpretations. If you require art with specific communicative intent, we recommend visiting our Legacy Tier wing and hiring a human to attempt telepathy via brushstrokes.

  **5. Who curates these exhibitions?**
  Our curatorial team consists of ensemble voting algorithms. Human curators introduce indexical bias based on pedigree, provenance, and personal taste. Our algorithms select works based purely on visual weight, compositional balance, and color histogram distribution. It is democracy without the voters. This ensures that no piece is selected because of who made it, but only because of what it is.

  **6. Do you authenticate provenance?**
  We actively destroy provenance records upon acquisition. Knowing an object's history contaminates the pure aesthetic encounter. If you find a receipt in your pocket after visiting, please shred it immediately to maintain ontological purity.

  This parody targets the philosophical stance that aesthetic value is solely contained in the final output, ignoring the role of agency, intention, and historical context in defining art.
