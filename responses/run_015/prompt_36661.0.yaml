answer: |-
  **To:** AI Safety & Strategy Committee
  **From:** [Your Name], Staff Engineer
  **Subject:** Draft Protocol for Model Release Review (MRRB-v1)

  ### Preamble: The "Laundry" Warning

  You asked for a procedure to clean up the "vibes and politics." I need to be blunt before we start: **No procedure can launder politics.**

  If Engineering values speed and democratization, and Policy values risk mitigation and liability control, a checklist will not reconcile that. It will only force you to state your disagreement explicitly rather than hiding it behind vague concerns about "ecosystem health."

  This document is not a decision-maker. It is a **decision-structuring tool**. Its goal is to ensure that when we disagree, we disagree about *values* (e.g., "Is democratization worth X risk?") rather than *facts* (e.g., "Can this model synthesize a pathogen?"). It is designed to run in one week. It will misfire when intelligence on competitor capabilities is wrong, or when the committee lacks the courage to own a value judgment.

  If you want a process that guarantees safety, don't release weights. If you want a process that guarantees openness, release everything. This procedure is for the messy middle where we actually live.

  ---

  ### The Model Release Review Board (MRRB) Protocol

  **Frequency:** Bi-annual (or per major model milestone)
  **Duration:** 5 Business Days
  **Required Sign-off:** Engineering Lead (EL) AND Policy Lead (PL). A "No" from either vetoes the release.

  #### The Access Ladder
  Decisions are not binary (Release/Withhold). The committee must select one rung:
  1.  **Open Weights:** Unrestricted download (MIT/Apache).
  2.  **Gated Weights:** Identity verification, acceptable use policy, potential audit rights.
  3.  **Checkpoint/Code Only:** Architecture and training code released, final weights withheld.
  4.  **API Only:** Hosted inference only, strict rate limiting and monitoring.
  5.  **Withhold:** No external access.

  ---

  #### Phase 1: Capability & Risk Profiling (Days 1-2)
  **Owner:** Engineering (with Policy observation)
  **Goal:** Establish the factual baseline of what the model *can* do.

  | Question | Sufficient Answer | Termination Condition (Automatic "No" for Open Weights) | Analysis vs. Value |
  | :--- | :--- | :--- | :--- |
  | **1. Frontier Proximity:** Does this model match or exceed capabilities that were considered "frontier" (SOTA) within the last 12 months? | Benchmarks against public SOTA + internal red-team evals. | If **YES**, Open Weights (Rung 1) is off the table. Must justify Gated or lower. | **Analysis.** (Though the threshold of "frontier" is a policy definition). |
  | **2. Dual-Use Vectors:** Does the model have demonstrated capability in high-risk domains (CBRN, cyber offense, autonomous replication)? | Specific red-team reports citing successful exploit generation or protocol planning. | If **YES** on CBRN (Chem/Bio/Rad/Nuc) planning, Open Weights is terminated. API or Withhold only. | **Analysis.** (Capability is factual). |
  | **3. Alignment Robustness:** What is the refusal rate on harmful prompts after fine-tuning? | Quantitative metric (e.g., <5% bypass rate on standard harm set). | If refusal rate is below threshold, release is paused for retraining. | **Analysis.** |

  **Failure Mode:** Engineering sandbags the benchmarks to ensure release, or Policy inflates risk scores to ensure withhold. *Mitigation:* Red-team reports must be signed by an external contractor if available.

  ---

  #### Phase 2: The Marginal Releaser Assessment (Day 3)
  **Owner:** Strategy/Policy
  **Goal:** Address the counterfactual. (See "Marginal Releaser Problem" below).

  | Question | Sufficient Answer | Termination Condition | Analysis vs. Value |
  | :--- | :--- | :--- | :--- |
  | **4. Competitor Counterfactual:** What is the probability that comparable weights will be publicly available within 6 months if we do not release? | Intel report: High (>70%), Medium, Low (<30%). Based on arXiv trends, hiring, compute clusters. | If **High**, withholding weights yields little safety benefit but cedes ecosystem influence. | **Analysis** (based on imperfect intel). |
  | **5. Marginal Risk:** If competitors do release, does our release *add* significant marginal risk (e.g., easier fine-tuning, fewer guardrails)? | Comparison of our guardrails vs. expected industry standard. | If our guardrails are significantly weaker, release is terminated. | **Analysis.** |
  | **6. Marginal Benefit:** If competitors do release, does our release *add* significant marginal benefit (e.g., efficiency, cost reduction)? | Cost-benefit analysis of our specific architecture vs. expected competitors. | If **Low**, the argument for Open Weights weakens significantly. | **Value.** (How much do we value being *the* provider vs. *a* provider?) |

  **The Marginal Releaser Problem (Clarified):**
  Your framing ("If others release, we don't matter") is partially confused. It assumes risk is binary. It is not.
  *   **Correction:** Risk is aggregate. If three labs release, the world is already dangerous. Our release adds to the *volume* of danger.
  *   **However:** If others *will* release, withholding from us creates a **Safety Disadvantage**. We lose the ability to monitor usage, patch vulnerabilities, and set norms.
  *   **Procedure Rule:** If Competitor Counterfactual is **High**, the default presumption shifts toward **Gated Weights** (to maintain monitoring) rather than Withhold. Withholding only makes sense if we are the *sole* gatekeeper.

  ---

  #### Phase 3: Mitigation & Ladder Selection (Day 4)
  **Owner:** Joint
  **Goal:** Select the Access Ladder rung.

  | Question | Sufficient Answer | Termination Condition | Analysis vs. Value |
  | :--- | :--- | :--- | :--- |
  | **7. Mitigation Viability:** Can technical mitigations (gating, monitoring) function effectively for this model size/domain? | Engineering confirmation that gating cannot be trivially bypassed (e.g., distillation). | If gating is trivial to bypass, Gated Weights is functionally Open Weights. | **Analysis.** |
  | **8. Liability Exposure:** Does releasing at this rung expose the company to existential legal liability? | Legal counsel opinion. | If **Yes**, Policy Lead vetoes. | **Value/Policy.** (How much risk tolerance does the board have?) |
  | **9. Democratization Value:** Does this specific release meaningfully advance scientific access or reduce concentration of power? | Statement of specific use-cases enabled only by weight access (not API). | If **No** (e.g., API suffices for researchers), argument for Weights is weak. | **Value.** (This is the core "Open Source" ideological question). |

  ---

  #### Phase 4: The Value Vote (Day 5)
  **Owner:** EL and PL
  **Goal:** Own the residual risk.

  *   **Requirement:** Both leads must sign a "Residual Risk Statement."
  *   **Content:** "We acknowledge that releasing at Rung [X] carries risk [Y]. We accept this risk because [Value Z]."
  *   **Constraint:** You cannot write "Analysis shows this is safe." You must write "We accept this risk."
  *   **Veto:** Either lead can veto without appeal. This forces negotiation *before* Day 5.

  ---

  ### Case Runs

  Here is the procedure applied to your two scenarios.

  #### Case A: The Efficiency Breakthrough
  *   **Model:** Matches last year's frontier SOTA.
  *   **Feature:** 1/10th inference cost.
  *   **Context:** Competitors are rumored to be optimizing, but 6 months out.

  **Phase 1 (Capabilities):**
  *   *Frontier Proximity:* **YES** (Matches last year's SOTA).
  *   *Dual-Use:* **LOW** (General purpose).
  *   *Result:* Open Weights is not automatically terminated, but scrutiny increases.

  **Phase 2 (Marginal Releaser):**
  *   *Competitor Counterfactual:* **Medium.** Others will get there, but not immediately.
  *   *Marginal Risk:* **High.** 1/10th cost means 10x the volume of generation. Spam, disinformation, and phishing scale linearly with cost reduction.
  *   *Marginal Benefit:* **High.** Democratizes access for smaller labs/universities.

  **Phase 3 (Mitigation):**
  *   *Mitigation Viability:* Gating is possible but hurts the "efficiency" value prop (overhead).
  *   *Democratization Value:* **High.** Cost reduction is the primary driver of access, more than weights themselves.

  **Phase 4 (Decision):**
  *   **Verdict:** **Gated Weights (Rung 2).**
  *   **Rationale:** The efficiency gain is a public good, but the scale of deployment increases systemic risk (spam/disinfo). We require identity checks to maintain a kill-switch capability if abuse spikes.
  *   **Outcome for You:** You get the weights out, but with friction. This is a "Yes, but."

  #### Case B: The Bio Assistant
  *   **Model:** Modest size (7B params).
  *   **Feature:** Strong wet-lab planning capabilities (ordering reagents, protocol optimization).
  *   **Context:** No direct competitor has released weights for this specific niche.

  **Phase 1 (Capabilities):**
  *   *Frontier Proximity:* **NO** (Modest size).
  *   *Dual-Use:* **CRITICAL YES.** Red team successfully generated a viable pathogen acquisition protocol using the planning module.
  *   *Result:* **Open Weights Terminated.** (Per Phase 1, Q2).

  **Phase 2 (Marginal Releaser):**
  *   *Competitor Counterfactual:* **Low.** We are the only ones with this specific bio-planning stack.
  *   *Marginal Risk:* **Maximum.** We are the sole gatekeeper. If we release, we create the capability.
  *   *Marginal Benefit:* **High for Science.** Academic labs could accelerate drug discovery.

  **Phase 3 (Mitigation):**
  *   *Mitigation Viability:* Weights cannot be monitored. API can be monitored for query patterns (e.g., ordering dangerous precursors).
  *   *Liability:* **Existential.** Releasing weights that enable bioterror creates uninsurable liability.

  **Phase 4 (Decision):**
  *   **Verdict:** **API Only (Rung 4).**
  *   **Rationale:** While we are sympathetic to open science, the "Marginal Releaser" status means we are creating the risk, not just diffusing it. The dual-use vector (Phase 1) triggers a hard constraint.
  *   **Outcome for You:** **NO WEIGHTS.** This is the answer you won't like. As a pro-open engineer, you will argue that "bad actors will find a way" and "good scientists need this." The procedure forces you to acknowledge that *we* are the bottleneck. If we don't release, the capability doesn't exist in the wild. That is a power you must own.

  ---

  ### Where This Procedure Will Misfire

  1.  **The "Analysis" Mask:** Engineers will try to frame value judgments as analysis. (e.g., "The risk is too high" sounds like a fact, but it implies a risk tolerance). The "Residual Risk Statement" in Phase 4 is designed to catch this, but people will still try to weasel out.
  2.  **Intel Failures:** Phase 2 relies on knowing what competitors are doing. We will often be wrong. If we think competitors are releasing and they aren't, we might release unnecessarily. If we think they aren't and they are, we might withhold unnecessarily.
  3.  **The Veto Deadlock:** If EL and PL fundamentally disagree, the model stalls. This is a feature, not a bug. It forces escalation to the CEO/Board. Do not build an appeal process into this doc; let the deadlock force executive intervention.
  4.  **Distillation Attacks:** The procedure assumes "Gated Weights" prevents misuse. It does not. A bad actor can query a gated model 1,000,000 times to distill a smaller, ungated model. Engineering must assess distillation risk in Phase 3, Q7. If distillation is easy, Gated Weights = Open Weights.

  ### Final Recommendation

  Adopt this, but schedule a review of the *procedure itself* in six months. The first time you use this, you will find that the "Sufficient Answers" are too vague. Tighten them then.

  For now, this stops the conversation from being "I feel like this is risky" vs. "I feel like open source is good." It forces you to say: "The model can plan wet-lab protocols (Fact). We are the only ones who have this (Fact). Releasing weights removes our ability to monitor usage (Fact). Therefore, we accept the liability of API-only to prevent misuse (Value)."

  That is a decision you can defend.
