answer: |-
  This is a sharp angle. *12 Angry Men* is rarely read as an epistemological text, but you are right that the deliberation functions as a machine for adjusting epistemic standards based on practical gravity. However, using it to teach pragmatic encroachment requires navigating the gap between psychological description and normative instruction. The film does not merely show stakes changing knowledge; it shows jurors being *corrected* when they fail to treat stakes as high.

  For scenes dramatizing encroachment, start with the initial vote. Juror 7 wants to convict quickly to make the baseball game. Here, the evidence is treated as sufficient for knowledge because the practical cost of being wrong is ignored. The stakes are low for him, so the epistemic bar is low. Contrast this with Juror 8's opening statement. He does not claim the boy is innocent; he claims he "doesn't know." This is the encroachment move. The evidence hasn't changed from the trial, but the stakes (a boy's life) have raised the threshold for knowledge so high that "knowing" guilt is no longer possible. The reenactment of the knife throw is another key moment. The evidence (the uniqueness of the knife) remains constant, but its probative value shifts once the stakes of a mistake are foregrounded. What looked like proof under low-stakes haste looks like possibility under high-stakes scrutiny.

  The wrinkle you identified—delegated stakes—is where the film pushes beyond the standard literature. Stanley and Fantl typically discuss cases where *my* stakes affect *my* knowledge. In the jury room, Juror 8's personal stakes are low; he goes home either way. He is operating on the defendant's stakes. This suggests the film argues for a normative version of encroachment rather than a descriptive one. It is not that the jurors psychologically cannot know unless the stakes are high; it is that they are morally prohibited from claiming knowledge unless they adopt the defendant's stakes. Juror 3 provides the counterpoint. He has high personal stakes (his own estranged son), but they are the wrong stakes. His anger clouds his judgment, making him claim knowledge where there is doubt. The film distinguishes between selfish stakes (which distort) and delegated stakes (which clarify). This implies that proper epistemic functioning in law requires an empathic simulation of the subject's position. If encroachment is true, the juror must occupy an epistemic position sensitive to another's practical situation. The film suggests this isn't automatic; it requires moral work.

  Now, the obvious objection: the film is about reasonable doubt, not knowledge. You noted that one can know and still have reasonable doubt, and that doubt alone acquits. This threatens the encroachment reading because encroachment claims stakes affect knowledge attribution, whereas the legal standard affects action (conviction) regardless of knowledge. If Juror 8 says, "I don't know," he aligns with encroachment. But if he says, "I know, but I doubt," the model breaks.

  Fortunately, Juror 8 consistently says, "I just don't know." The film treats reasonable doubt as the legal instantiation of the knowledge barrier raised by high stakes. When stakes are life-and-death, the level of certainty required for action (conviction) approximates or exceeds knowledge. The film resists encroachment only if you insist knowledge is a fixed metaphysical state independent of action. But if you view knowledge as the norm of assertion or action, the film supports encroachment perfectly. The jurors stop asserting "he is guilty" because the stakes make that assertion untenable. The doubt is the symptom of the stakes raising the epistemic bar.

  Where the film truly adds value to the literature is in group epistemology. The papers usually discuss isolated subjects. Here, standards shift socially. Juror 2 is timid; Juror 12 is flipant. They only adopt the high-stakes standard because Juror 8 holds the line. This dramatizes the responsibility for the standard you adopt. Juror 10's bigoted rant shows how lowering epistemic standards correlates with moral failure. The group dynamic reveals that encroachment isn't just internal; it is policed by the community. You are responsible for knowing whether the stakes warrant your level of certainty.

  So, does the reading work? Halfway. It fails if you treat encroachment as a purely psychological mechanism where stakes automatically alter cognitive states. The jurors don't naturally feel the stakes; Juror 8 has to shame them into feeling it. But it succeeds if you treat encroachment as a normative claim about when knowledge attribution is permissible. The film argues that in high-stakes contexts, claiming knowledge requires absorbing the other's risk.

  For the board, map the shift: Low Stakes (Baseball/Game) = Low Evidence Threshold vs. High Stakes (Life/Death) = High Evidence Threshold. Then add the wrinkle: Whose Stakes? Self vs. Other. The film concludes that legal knowledge is impossible unless the juror's practical reasoning is anchored in the defendant's fate. That is a robust, socially embedded version of encroachment that the standard cases miss. It shows that sometimes, to know rightly, you must care deeply about someone else.
