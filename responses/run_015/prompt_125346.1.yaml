answer: |-
  In the borough of Oakhaven, the municipal council established a 'Community Hour' scheme wherein employees earned credits for volunteer work, formally recognised by the council as deductible against council tax and redeemable for municipal services, while simultaneously circulating privately among residents for plumbing, tutoring, and groceries, thereby functioning as a medium of exchange and store of value. When the council, citing budgetary constraints, officially withdrew the tax-deductible status and ceased accepting Credits for service charges, the formal institutional backing vanished; however, the residents, accustomed to the liquidity and trust established over three years, continued to quote prices in Hours, settle debts with them, and hoard them for future use, maintaining the exact same patterns of trade and valuation despite the absence of authoritative ratification.

  The ontological divergence arises precisely at the point of the council's withdrawal. The institutional-constructivist account, following a Searlean framework, posits that money is a status function imposed upon a physical or digital substrate by collective intentionality, typically underwritten by constitutive rules and deontic powers granted by an authority. For this view, the council's revocation removes the constitutive rule ('X counts as Y in context C') that赋予 the credits their monetary status; without the authoritative backing that guarantees the obligation, the object ceases to be money, becoming merely a token of informal promise. Conversely, the functional-role account defines monetary kinds strictly by their causal-economic profile: if the object serves as a medium of exchange, a unit of account, and a store of value, it is money. Since the residents' behavioural patterns remain unchanged—the credits still clear debts and measure value—the functionalist verdict is that the monetary kind persists intact. The feature doing the work here is the dissociation of *authoritative status assignment* from *effective exchange practice*.

  If one were to remove the continuity of exchange patterns—supposing the residents abandoned the credits immediately upon the council's withdrawal—the disagreement would collapse into agreement: both theories would concede the credits are no longer money. However, if one removed the authoritative withdrawal while the exchange patterns ceased (the council recognises them, but no one uses them), the institutionalist might claim they remain 'valid' money in principle, whereas the functionalist would deny they are money at all. This highlights that the institutional view prioritises the validity of the status declaration, while the functional view prioritises the efficacy of the social practice.

  An honest assessment must note that a sophisticated defender of the institutional view might attack this construction by arguing that the council was never the sole source of collective intentionality; rather, the community itself constitutes the relevant institution. They would contend that the residents' continued acceptance preserves the status function independently of the council, thereby aligning the institutional verdict with the functional one. However, this manoeuvre risks diluting the institutional account into a form of functionalism, as it relies on the observable practice of acceptance rather than distinct deontic powers. I maintain that the functional-role account handles this case more plausibly. Social ontology should track the reality of social objects as they operate in the wild, not merely as they are licensed by bureaucracy. Money is fundamentally a tool for coordination; if the coordination persists despite the revocation of the licence, the tool remains what it is. To insist otherwise is to privilege legalistic form over social substance, rendering the ontology incapable of explaining the resilience of currency during regime changes, hyperinflation, or in black markets where functional money exists without institutional sanction.
