  Here's a thinking process that leads to the comparison and assessment of supererogation and suberogation:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Compare supererogation (going beyond duty) and suberogation (falling short of ideal but not duty).
      *   **Core Question:** Are they genuine mirror images?
      *   **Key Definitions:**
          *   Supererogatory: Permissible, good, praiseworthy, not obligatory (omission not blameworthy). Example: Heroic rescue.
          *   Suberogatory (Julia Driver): Permissible (no duty violated), bad (falls short of ideal), blameworthy-adjacent (negative appraisal). Example: Slamming a door gratuitously.
      *   **Required Sections:**
          1.  Structural Symmetry (Coherence of the "deficit" category).
          2.  Asymmetries in Defensibility (Can we accept one without the other? Role of cost).
          3.  Theoretical Uptake (Consequentialism, Satisficing, etc.).
      *   **Conclusion:** Judgment on whether suberogation deserves equal standing or is gerrymandered.

  2.  **Initial Brainstorming & Conceptual Mapping:**
      *   *Supererogation* is standard in common-sense morality but tricky for utilitarianism (why isn't the best act obligatory?).
      *   *Suberogation* is the "ugly cousin." It feels like "being a jerk" without breaking a rule.
      *   *Symmetry:* Supererogation = Good + Optional. Suberogation = Bad + Optional.
      *   *The "Gap":* Both rely on a gap between *duty/obligation* and *ideality*.
      *   *Blame:* Supererogation protects from blame for *not* doing the good. Suberogation invites blame (or criticism) for *doing* the bad, even if permissible.
      *   *Cost:* Supererogation often involves high cost to the agent (excusing non-performance). Suberogation often involves low cost to avoid (so why do it?), but doing it is "cheap" badness.

  3.  **Drafting Section 1: Structural Symmetry:**
      *   *The Map:* We need a spectrum. Bottom: Forbidden/Blameworthy. Middle: Obligatory/Required. Top: Supererogatory. Where does Suberogatory fit?
      *   *Driver's View:* It fits between Forbidden and Obligatory? No, it's *within* the Permissible zone but on the lower end.
      *   *Coherence:* Is "permissible but bad" coherent? Yes, think of etiquette or minor vices.
      *   *The Collapse Risk:* If we admit suberogation, do we blur the line between "wrong" and "rude"?
      *   *Argument:* The distinction holds if we distinguish *sanctions* (punishment/guilt) from *criticism* (disapproval). Supererogation blocks criticism for omission. Suberogation allows criticism for commission.
      *   *Verdict:* Structurally symmetric, but the "moral weight" feels different. One is a "bonus," the other is a "penalty" without the crime.

  4.  **Drafting Section 2: Asymmetries in Defensibility:**
      *   *The Asymmetric Position:* Accept Super, Reject Sub. Why?
      *   *Reasoning:* Maybe morality is only about minimums (duties). Anything above is bonus (Super). But anything within the minimum is just "okay." To call it Suberogatory implies a duty to be *more* than minimal without it being a duty. Contradiction?
      *   *Counter-Reasoning:* If we accept Super because of *cost* (it's too hard to demand heroism), does that validate Sub?
      *   *Cost Analysis:*
          *   Super: High cost excuses non-performance.
          *   Sub: Low cost to avoid. If I slam the door, it costs me nothing to hold it. So why is it permissible? Because no right is violated. But it reveals bad character.
      *   *The "Cost" Asymmetry:* Cost functions as a *shield* in Supererogation (I'm not bad for not saving you). In Suberogation, the *lack* of cost to do the right thing highlights the suberogatory nature (You're a bit bad for slamming the door because it was so easy not to).
      *   *Sustaining Asymmetry:* It is hard to sustain. If there is a "moral ideal" high enough to generate Supererogation, there must be a "moral floor" low enough to generate Suberogation within the permissible zone. If you have an ideal, you have a range.

  5.  **Drafting Section 3: Theoretical Uptake:**
      *   *Maximizing Consequentialism (Utilitarianism):*
          *   Standard view: No Supererogation (optimific act is obligatory).
          *   Modified view (Slote, etc.): If we acknowledge human limits, maybe Super exists.
          *   Suberogation here? If the *best* is obligatory, then anything less is *wrong*. So no Suberogation either. Everything is either Right (Best) or Wrong (Sub-optimal).
          *   *Wait:* If we soften Utilitarianism to allow "good enough," then both Super and Sub emerge.
      *   *Satisficing Consequentialism:*
          *   Duty = "Good enough."
          *   Acts better than "good enough" = Supererogatory.
          *   Acts "good enough" but not great = Obligatory/Permissible.
          *   Acts "good enough" but grating/nasty = Suberogatory?
          *   Actually, Satisficing makes Supererogation easy. Does it make Suberogation easy? Yes, acts that meet the threshold but are morally ugly.
      *   *Deontology (Kantian):*
          *   Perfect vs. Imperfect duties.
          *   Supererogation fits in Imperfect duties (beneficence).
          *   Suberogation? Violating the *spirit* of duty without the *letter*. (Kant might call this lacking virtue, but not vice).
      *   *Virtue Ethics:*
          *   Best home for Suberogation. It's about character. The door-slammer isn't "unjust" but is "unkind."

  6.  **Drafting the Conclusion:**
      *   *Judgment:* Is Suberogation real or gerrymandered?
      *   *Argument for Real:* It captures a specific phenomenological experience: the "ick" factor of permissible behavior. It explains why we criticize people who haven't technically wronged us.
      *   *Argument for Gerrymandered:* It's just "minor vices" or "rudeness." Do we need a technical term?
      *   *Synthesis:* It deserves standing *if* we value moral psychology and the nuance of criticism. It's not a perfect mirror (the stakes are lower), but it fills a theoretical gap regarding permissible badness.
      *   *Final Verdict:* It is a legitimate category, though less weighty than supererogation. It prevents the "Permissible = Morally Neutral" error.

  7.  **Review and Refine:**
      *   *Check Definitions:* Ensure Driver's definition is central.
      *   *Check Tone:* Philosophical, analytical, balanced.
      *   *Check Constraints:* Did I answer all three specific questions? Yes.
      *   *Refining the "Mirror Image" claim:* They are structurally symmetric but axiologically asymmetric. Supererogation is about *praise*; Suberogation is about *criticism*. Praise is optional; criticism feels more pressing. This breaks the symmetry slightly.
      *   *Refining the Cost Argument:* In Supererogation, cost excuses. In Suberogation, the *absence* of cost to do better indicts. This is a crucial asymmetry to highlight.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to confuse Suberogatory with Imperfect Duties. Suberogatory acts are *permissible*, whereas fulfilling an imperfect duty is often seen as supererogatory (or at least not strictly required in specific instances).
      *   *Clarification:* Ensure the distinction between "Wrong" and "Suberogatory" is clear. Wrong = violation of duty. Suberogatory = no violation, but morally ugly.

  9.  **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  The concepts of supererogation and suberogation attempt to map the nuanced terrain between the mandatory and the forbidden. Supererogation, the act that is good to do but not wrong to omit, is a staple of common-sense morality. Suberogation, introduced prominently by Julia Driver, proposes a structural inverse: an act that is permissible to do but nonetheless morally lacking, meriting criticism without meriting condemnation.

  To assess whether these categories are genuine mirror images, we must examine their structural coherence, the defensibility of accepting one without the other, and their viability within major ethical frameworks.

  ### 1. Structural Symmetry: The Coherence of the Normative Deficit

  Structurally, supererogation and suberogation appear to be perfect inverses. Supererogation occupies the space *above* the line of duty (a normative surplus), while suberogation occupies the space *below* the line of ideal morality but *above* the line of duty (a normative deficit).

  **The Moral Map**
  Imagine a vertical scale of moral value.
  *   **Top:** Supererogatory (Praiseworthy, Optional).
  *   **Upper Middle:** Obligatory/Ideal (Required, Praiseworthy to fulfill, Blameworthy to omit).
  *   **Lower Middle:** Suberogatory (Criticizable, Optional).
  *   **Bottom:** Forbidden (Blameworthy, Punishable).

  The coherence of suberogation depends on the viability of the "Lower Middle." Critics argue that the permissible zone should be morally neutral; if an act violates no duty, it should be immune to moral criticism. To call a permissible act "suberogatory" risks collapsing the distinction between *wrongdoing* (breach of duty) and *unideality* (failure to excel).

  However, admitting suberogation does not necessarily force this collapse. It relies on distinguishing between **blame** (which implies a violation of obligation and perhaps sanctions) and **criticism** (which implies a failure of character or virtue). A suberogatory act, like gratuitously slamming a door, violates no right (the victim has no claim to the door being held), yet it manifests a vice (pettiness or unkindness). Therefore, the position is coherent: it posits that the realm of the permissible is not a flat plain of moral neutrality, but a gradient where one can be "in the right" yet still be morally unappealing.

  **Symmetry Verdict:** Structurally, they are symmetric. Both rely on a gap between *duty* and *ideality*. However, there is a phenomenological asymmetry. We feel the pull of the supererogatory (the call to be a hero) differently than we feel the drag of the suberogatory (the pull to be a jerk). The "deficit" feels less like a distinct category and more like the absence of virtue, whereas the "surplus" feels like the presence of something extra.

  ### 2. Asymmetries in Defensibility: Cost and Excuse

  Can one consistently accept supererogation while rejecting suberogation? Many philosophers do, arguing that morality sets a floor (duty) but not a ceiling. On this view, anything above the floor is optional; if it is good, it is supererogatory; if it is not good, it is simply permissible (neutral). To label a permissible act as "bad" (suberogatory) seems to smuggle in a duty to be nice without admitting it is a duty.

  **The Role of Cost**
  The standard justification for supererogation is **cost**. We do not obligate agents to rush into burning buildings because the cost to the agent is too high. The cost functions as an *excuse* that renders the omission permissible.

  Does this vindicate suberogation? The logic of cost functions inversely here.
  *   **In Supererogation:** High cost to perform $\rightarrow$ Omission is permissible (no blame).
  *   **In Suberogation:** Low cost to perform the ideal $\rightarrow$ Commission of the lesser act is permissible (but criticizable).

  The door-slamming example works *because* holding the door costs nothing. If holding the door required significant effort, slamming it might be merely permissible (neutral). Because the cost to be ideal is negligible, choosing the lesser option reveals a defect in character.

  **Sustaining the Asymmetry**
  It is difficult to sustain a position that accepts supererogation but denies suberogation without arbitrariness. If we acknowledge a moral ideal high enough that we are not required to reach it (Supererogation), we implicitly acknowledge a range of permissible action. If that range includes acts that are actively contrary to the spirit of morality (even if they don't violate the letter), suberogation emerges.

  To deny suberogation is to claim that the permissible zone is morally homogenous. But common sense suggests otherwise. We distinguish between the stranger who ignores us (permissible, neutral) and the stranger who sneers at us (permissible, suberogatory). If we accept supererogation based on the intuition that "morality shouldn't be too demanding," we should accept suberogation based on the intuition that "morality shouldn't be too permissive." The former protects the agent from excessive sacrifice; the latter protects the community from excessive selfishness.

  ### 3. Theoretical Uptake: Frameworks and Categories

  Different ethical frameworks struggle to accommodate these categories, often revealing tensions in their own structures.

  **Maximizing Consequentialism**
  Classic utilitarianism is hostile to both. If the right act is the one that maximizes utility, then:
  1.  Any act less than the maximum is wrong (no suberogation, just wrongdoing).
  2.  The maximum act is obligatory (no supererogation).
  To accommodate supererogation, a consequentialist must adopt a "satisficing" view or acknowledge human psychological limits. If they do so, suberogation naturally follows. If duty is to produce "good enough" results, then an act that produces "good enough" results but does so via a nasty method (e.g., keeping a promise but doing so grudgingly and rudely) falls into the suberogatory category. Thus, in consequentialism, the acceptance of one usually drags the other in.

  **Deontology**
  Kantianism handles supererogation through **imperfect duties** (e.g., beneficence). We have a duty to adopt the maxim of helping others, but latitude in when and how. Fulfilling this beyond the call is supererogatory.
  Suberogation fits less neatly. For a Kantian, if an act violates no perfect duty, it is morally indifferent (*adiaphora*). However, a Kantian might argue that while the act is legally permissible, it violates the *spirit* of the categorical imperative regarding treating humanity as an end. The door-slammer treats the other as a mere object. Thus, Deontology might classify suberogatory acts as minor vices rather than a distinct normative category, potentially absorbing suberogation into a broader theory of virtue.

  **Virtue Ethics**
  This framework offers the most natural home for suberogation. Virtue ethics is not primarily about rules (duty) but about character.
  *   **Supererogation:** Acts of the hero or saint (exceeding normal virtue).
  *   **Suberogation:** Acts of the churl or the petty (falling short of ideal virtue without descending into vice/crime).
  In Virtue Ethics, the "mirror" is most intact. Both categories are defined by their relation to the *phronimos* (the person of practical wisdom). The supererogatory is what the saint does; the suberogatory is what the decent-but-flawed person does.

  ### Conclusion: Is Suberogation Gerrymandered?

  Does suberogation deserve the same standing as supererogation?

  **The Case for Gerrymandering:**
  One could argue suberogation is merely a technical label for ordinary vices like rudeness, pettiness, or unkindness. We do not need a new normative category to explain why we dislike door-slammers; we simply say they are rude. Unlike supererogation, which protects agents from crushing moral demands, suberogation does not seem to solve a pressing philosophical problem. It creates a category of "wrong-ish" acts that might confuse moral deliberation. If it's not wrong, why critique it? If we critique it, isn't it effectively wrong?

  **The Case for Standing:**
  However, suberogation captures a crucial phenomenological reality that "rudeness" does not fully cover. Rudeness is a social convention; suberogation is *moral*. The door-slammer isn't just breaching etiquette; they are displaying a lack of moral regard that falls short of injustice.
  Furthermore, suberogation is theoretically necessary if we value a rich moral psychology. If we accept supererogation, we admit that morality has an aspirational ceiling. If there is a ceiling, there must be a floor that is higher than the baseline of "non-violation." Without suberogation, the permissible realm becomes a moral vacuum where anything not forbidden is equally good. This leads to the "saintly/monster" dichotomy where one is either a hero or merely "not a criminal," ignoring the vast middle ground of moral mediocrity.

  **Final Judgment:**
  Suberogation is not a perfect mirror image of supererogation. The stakes are asymmetric: failing to be a hero rarely harms anyone (omission), while choosing to be suberogatory often inflicts minor harms or social friction (commission). However, suberogation is not gerrymandered. It is a necessary category for any ethical theory that wishes to account for the nuance of moral criticism. It validates the intuition that one can be "in the right" and still be morally lacking. While it may not carry the weight of supererogation, it deserves equal standing as the conceptual tool that prevents the permissible from becoming a sanctuary for the unvirtuous. To deny it is to claim that morality ends where duty begins, ignoring the vast landscape of character that lies in between.
