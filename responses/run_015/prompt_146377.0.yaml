  (1) Candidate rules

  Two general principles accommodate all seven established verdicts while diverging on the staggered case.

  **The Successor-Relative Saturation Rule:** Survival is a relation between a predecessor and a *specific* successor stage. Each successor stage has a capacity of 1.0 unit of "what matters." If a single predecessor fully psychologically continuous with that stage claims it, survival is 100%. If multiple predecessors claim the *same* successor (fusion), the capacity is divided proportionally. Branching creates *new* successor stages, so capacity is not divided but duplicated. Survival status is determined locally at each time-slice by the successors currently instantiated.

  **The Event-Relative Competition Rule:** Survival is determined by the total set of successors causally generated by the original scanning event. All successors originating from the t0 blueprint are competitors for the original's "survival mass," regardless of when they are instantiated. While branching does not reduce the mass per branch (consistent with her fission verdict), the existence of a rival branch from the same causal origin dilutes the exclusivity of the survival relation from t0. Survival status is determined globally by the final configuration of the causal tree.

  Both rules yield 100% survival in teletransportation and standard fission (distinct successors), and 50% in fusion (shared successor). They differ only when the instantiation of competitors is temporally staggered.

  (2) Predictions

  **Successor-Relative Saturation** implies that during the first forty-eight hours, you survive fully (100%). Replica A is the unique successor; the mere potentiality of B is irrelevant. During the parallel year, survival remains 100% relative to each branch; branching duplicates what matters. At the merge, survival drops to 50% for each predecessor, as A and B now compete for the single capacity of M. In the asymmetric variant, M's capacity is divided by psychological contribution (e.g., if M holds 100% of A's traces and 50% of B's, A survives 2/3, B survives 1/3). Prudential concern should be undivided for A's first forty-eight hours, then distributed equally (or proportionally) across the parallel lives.

  **Event-Relative Competition** implies that from t0, your survival is already distributed across the eventual set {A, B}. During the first forty-eight hours, survival is effectively 50% (or diluted), because B is a causal competitor even if not yet instantiated. The parallel year remains 100% per branch (as branching multiplies mass), and the merge reduces it to 50%. Prudential concern at t0 must be split immediately between the future experiences of A and B; the first forty-eight hours are not exclusively yours but already shared with the future B.

  Regarding the value of the procedures: Under Saturation, building B is neutral during the stagger but costly at the merge (dilution). Under Competition, building B is costly from the start. Both rules agree that merging is a loss relative to parallel continuation, as it forces competition for a single successor slot.

  (3) Her verdict

  She will almost certainly endorse the **Successor-Relative Saturation Rule**. Her insistence that the "non-branching clause... never [matters] in the question of what matters" is the decisive clue. This rejects the idea that external facts about other branches (like B's eventual existence) alter the intrinsic value of the relation holding between you and A. If the existence of a distinct branch doesn't diminish survival in standard fission, the *delayed* existence of a branch shouldn't diminish survival in the staggered case.

  Furthermore, her verdict on the two-century gap ("no threshold") demonstrates that temporal distance and instantiation delays do not degrade survival. By parity of reasoning, the forty-eight-hour delay in B's instantiation should not retroactively dilute A's status. She treats survival as a local relation of psychological continuity, not a global property of a causal event.

  I discount her refusal to say fission is "better" than ordinary survival as a rhetorical hedge rather than a metaphysical claim. In the Parfitian tradition, this usually signals that the concept of "better" is ill-defined across different numbers of survivors, not that the total value is capped. She likely accepts that two full lives contain more of what matters than one, but resists the language of "better" to avoid implying identity is preserved. Her core commitment is to the *preservation* of relations, which Saturation protects locally.

  (4) What turns on it

  The difference is not mere bookkeeping; it governs **anticipation**. If Successor-Relative Saturation holds, the person at t0 can anticipate the first forty-eight hours of A's life with the same certainty and exclusivity as ordinary survival. There is a period of "undiluted" future. If Event-Relative Competition holds, anticipation is divided from the start; the first forty-eight hours are already "shared" with B, introducing immediate prudential uncertainty.

  This affects self-concern. Under Saturation, A has a rational basis for selfish concern during the stagger that B does not share. Under Competition, A's early experiences are already partly "B's" in terms of survival weight. However, since both rules agree that the merge reduces survival to 50%, the long-term prudential outcome is identical. The stakes are therefore phenomenological: whether the stagger grants a temporary reprieve from the dilution inherent in fission, or whether the knowledge of the future branch poisons the present exclusivity.

  (5) The discriminating case

  To separate the survivors, propose the **Cancellation Case**.

  *Scenario:* At t0, you are scanned and destroyed. Replica A is built immediately. Replica B is scheduled for t0 + 48 hours. At t0 + 24 hours, the blueprint for B is accidentally destroyed; B is never built. A continues alone.

  *Question:* During the first 24 hours, was your survival diluted (because B was planned) or full (because B never existed)?

  *Prediction:*
  *   **Successor-Relative:** Survival was 100% throughout. Since B never instantiated, A was always the unique successor. The cancelled plan is metaphysically irrelevant.
  *   **Event-Relative:** Survival was diluted for the first 24 hours and restored upon cancellation. The causal intent at t0 created a competition that was only later resolved.

  If she says the first 24 hours were fully yours, she confirms Successor-Relative Saturation. If she says your status *changed* when B was cancelled, she commits to Event-Relative Competition. Given her views on gaps and non-branching, she should say the cancellation is irrelevant: you survived fully all along.
