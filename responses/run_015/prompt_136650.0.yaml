answer: |-
  The impasse you describe is not merely verbal, nor is it simply a case of scholars talking past one another. It is a category error disguised as a debate. The stalemate persists because the defenders of the fence are arguing from a position of **prudence**, whilst the critics are arguing from a position of **legitimacy**. Until this distinction is rigorously drawn, the metaphor of the fence will continue to bear a weight it cannot support.

  Your diagnosis lies in the second option you proposed: there is a substantive, hidden claim about tacit knowledge, but the disagreement arises because the two sides assign opposite moral valences to that opacity. The Burkean assumes that time acts as a filter for utility; the institution survives because it works. The critic assumes that time acts as a sediment for power; the institution survives because it protects entrenched interests. Both are empirically plausible. A legal code may persist because it facilitates commerce (functional tacit knowledge), or it may persist because it codifies class privilege (oppressive tacit knowledge). Chesterton's Fence treats all institutions as if they are the former, whilst the revolutionary critic treats them as if they are the latter.

  Consequently, the disagreement is not about whether we *can* know the purpose of the fence, but about what we should presume the purpose to be in the absence of evidence. The conservative presumes benevolence or utility in the ancestor; the progressive presumes negligence or malice. This is why the exchange has not moved in decades. It is a clash of anthropologies, not merely epistemologies.

  Furthermore, you are correct to suspect that the sides are answering different questions. The defender asks, 'What is the risk of removal?' This is a question of consequentialist risk management under collective uncertainty. The critic asks, 'What is the cost of retention?' This is a question of deontological justice and the moral weight of inherited injustice. When a critic points to a successfully dismantled oppressive structure, they are proving that the *moral* cost of retention outweighed the *functional* risk of removal. When a defender points to a revolutionary disaster, they are proving that the *functional* risk outweighed the *moral* imperative. Neither disproves the other because they are weighing different currencies.

  **The Path to Progress**

  Given this diagnosis, an empirical study of institutional knowledge transmission would likely fail, for the data is too noisy and the interpretation too theory-laden. To argue that no resolution should be expected is to surrender to cynicism, which serves a novelist poorly.

  Genuine progress requires a **formal distinction between types of social institutions**, specifically separating **coordination mechanisms** from **hierarchical structures**.

  1.  **Coordination Mechanisms:** These are fences that solve collective action problems (e.g., driving on the left, standardised weights and measures, certain procedural norms). Here, Chesterton's Fence holds strong. The specific reason matters less than the fact of agreement. Tacit knowledge is likely benign and functional. The burden of proof lies heavily on the reformer.
  2.  **Hierarchical Structures:** These are fences that distribute power, status, or resources (e.g., property laws, voting restrictions, caste systems). Here, Chesterton's Fence is dangerous. The 'tacit knowledge' encoded here is often the mechanics of exclusion. The longevity of such a fence proves only the durability of the power dynamic, not its utility. The burden of proof must shift to the preserver to justify the hierarchy.

  Progress, therefore, lies in refining the heuristic. We must stop asking 'Is there a fence?' and start asking 'What sort of fence is this?'

  For your purposes as a novelist, the inertia you examine stems from the deliberate conflation of these two types. Societies justify inertia by treating hierarchical structures as if they were coordination mechanisms. They argue that the exclusionary wall is actually a load-bearing beam holding up the roof of civilisation. The tragedy—and the story—lies in the moment a character realises that the fence was never keeping the wolves out, but keeping the people in.

  To move the philosophical needle, one must argue that epistemic humility is a virtue regarding *causes*, but not regarding *values*. We may not know why a tradition started (epistemic), but we can judge whether it is just (moral). The impasse breaks only when we admit that an institution can be functionally efficient yet morally intolerable. Chesterton tells us not to pull down the fence until we know why it was put up. The necessary correction is this: if the fence is built upon a grave, we do not need to know the architect's intent to know it must come down.
