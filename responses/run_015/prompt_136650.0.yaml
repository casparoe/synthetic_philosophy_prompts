  5.  **Determine the Path to Progress:**
      *   *Formal Distinction?* Useful, but might just codify the stalemate.
      *   *Empirical Study?* Hard to measure "tacit social knowledge" vs. "entrenched power."
      *   *Argument for No Resolution?* Too cynical for a novelist seeking truth.
      *   *Better Path:* A shift in the burden of proof regarding *whose* uncertainty matters. The progress lies in recognising that Chesterton's Fence applies to *functions*, not *norms*. We need to distinguish between *technical institutions* (which solve coordination problems) and *hierarchical institutions* (which enforce distribution).
      *   *Refined Progress:* We need a taxonomy of institutions. Some fences keep cattle in (functional); some keep people out (exclusionary). The heuristic fails when applied indiscriminately. Progress requires shifting from "Preserve unless understood" to "Understand the *type* of fence before deciding the burden of proof."

