answer: |-
  ### Brainstorming & Diagnostic Phase

  Before I give you the definitive answer, I want to walk through the logic of why this problem arises, just to validate your intuition. You are absolutely right to feel frustrated; this is arguably the most famous structural vulnerability in Kant's *Groundwork* and *Critique of Practical Reason*.

  1.  **The Mechanism of the Test:** Kant's Formula of Universal Law asks us to take our "maxim" (subjective principle of volition) and universalize it. The test checks for contradictions (either in conception or in the will).
  2.  **The Variable:** The input of the test is the *maxim*. But a maxim is a linguistic formulation. Language allows for infinite degrees of specificity.
  3.  **The Extremes:**
      *   *Too General:* "I will break promises." Universalized: Promises cease to exist. Contradiction. (Verdict: Immoral).
      *   *Too Specific:* "I will break this promise, to this person, on this Thursday, because I have a headache and the traffic is bad." Universalized: Everyone breaks promises under *these exact* conditions. Since no one else has this exact headache/traffic combo, the institution of promising remains intact. No contradiction. (Verdict: Moral).
  4.  **The Consequence:** If the moral verdict flips based solely on the linguistic resolution of the description, the test isn't judging the *action*; it's judging the *description*.
  5.  **The Argumentative Tactic:** In a debate, if I want to win, I push the granularity toward the extreme that favors my conclusion. If I want to condemn you, I generalize your action. If I want to excuse you, I particularize it.

  This confirms your observation: the "sliding scale" is real. Now, let's categorize it.

  ***

  ### The Answer

  You have identified a classic and devastating objection to Kantian ethics. Here is the breakdown of the terminology, the distinction from sneakiness, and the boundaries of the concept.

  #### 1. Is there an established name?
  Yes. In academic Kantian scholarship, this is standardly referred to as **"The Problem of Relevant Descriptions"** (sometimes also called **"The Problem of Maxim Formulation"**).

  It was famously highlighted by critics like Hegel (who called Kant's ethics "empty formalism") and later by utilitarians like John Stuart Mill. They argued that without a rule for *how* to describe the action, the Categorical Imperative can justify anything or condemn anything, depending on how you phrase the input.

  However, "The Problem of Relevant Descriptions" names the *philosophical puzzle*, not necessarily the *argumentative maneuver* you noticed your friend using. For that specific tactical sliding of specificity, there isn't a single famous proper noun, but I will coin a precise term for you below to help you wield this in future arguments.

  #### 2. Coining the Term: "Maxim Granularity Slippage"
  Since you need a term for the *pattern* of shifting specificity to force a conclusion, I propose we call this **"Maxim Granularity Slippage."**

  *   **Definition:** The rhetorical or logical maneuver of altering the level of detail (granularity) in a maxim's formulation solely to manipulate the outcome of the universalizability test, without changing the underlying physical action.
  *   **Why this term?** "Granularity" captures the grain-size of the description (coarse vs. fine). "Slippage" captures the unearned slide from one level to another to avoid a contradiction.

  #### 3. How is this different from being "sneaky about intentions"?
  This is a crucial distinction. In your argument, you need to separate *bad faith* from *structural ambiguity*.

  *   **Sneakiness (Bad Faith):** This is when an agent lies about *what* their maxim is.
      *   *Example:* I break a promise because I want to save money. But when tested, I claim my maxim is "I break promises to save lives."
      *   *Diagnosis:* This is a lie about the agent's motivation. Kant's test assumes you are honest about your maxim. If you lie about the input, the test fails, but that's on you, not Kant.
  *   **Granularity Slippage (Structural Ambiguity):** This is when we agree on the motivation, but disagree on *how to describe* that motivation.
      *   *Example:* We both agree I am breaking a promise to save money.
      *   *General Description:* "Break promises for financial gain." (Fails test).
      *   *Specific Description:* "Break promises for financial gain when the sum is under $50 and it is raining." (Might pass test).
      *   *Diagnosis:* This is not a lie. It is a dispute about which description is the *morally relevant* one. The agent isn't hiding their intention; they are arguing that the *context* is part of the intention.

  **The Key Difference:** Sneakiness changes the *content* of the maxim dishonestly. Granularity Slippage keeps the content but changes the *resolution* of the description strategically.

  #### 4. Setting Boundaries: Where does Slippage stop and Equivocation begin?
  You asked where this stops being a philosophical problem and starts being ordinary equivocation (using words ambiguously to mislead).

  The boundary is **"Rational Relevance."**

  *   **Legitimate Specificity:** Details are included in the maxim only if they are part of the agent's *reason for acting*.
      *   *Example:* "I will lie to the murderer at the door." The detail "murderer at the door" is relevant because it is the *reason* I am lying (to prevent murder).
  *   **Granularity Slippage / Equivocation:** Details are included solely to make the scenario unique, without being part of the reasoning.
      *   *Example:* "I will lie on Thursdays when I am wearing blue socks."
      *   *Why this fails:* Unless my blue socks are the *reason* I am lying, this is arbitrary. It is "noise" added to the signal to game the system.

  **The Test for Slippage:** Ask your friend: *"Is that detail part of your reason for acting, or is it just a circumstance surrounding the action?"*
  *   If the detail explains *why* they acted, it belongs in the maxim.
  *   If the detail just describes *when/where* they acted, but didn't motivate them, including it is Granularity Slippage.

  #### 5. How to resolve this in your argument (The Kantian Defense)
  If you want to win the argument philosophically, you shouldn't just point out the slippage; you should explain how Kantians fix it.

  Modern Kantians (like Christine Korsgaard or Barbara Herman) argue that a maxim is not a description of a physical event, but a description of a **practical identity**. A maxim must capture the *agent's conception of what they are doing*.

  *   **The Fix:** You cannot universalize a maxim that relies on arbitrary uniqueness (like "only me, only today"). Why? Because morality is about *reasons*. Reasons must be shareable. If your reason relies on a detail that no one else can ever have (e.g., "because I am me"), it isn't a reason; it's an impulse.
  *   **The Counter-Move:** When your friend says, "My maxim is to break this specific promise because I am in this unique emergency," you ask: "What makes it an emergency?"
      *   If they say, "Because I might lose money," then the maxim becomes "Break promises to avoid financial loss." (Universalize -> Trust collapses).
      *   If they say, "Because a life is at stake," then the maxim becomes "Break promises to save lives." (Universalize -> Trust remains, because saving life trumps promising).

  **Summary for your next debate:**
  1.  Name the problem: **"The Problem of Relevant Descriptions."**
  2.  Name the tactic: **"Maxim Granularity Slippage."**
  3.  The Boundary: Details must be **rationally relevant** to the motivation, not just circumstantial noise.
  4.  The Check: Force them to state the *reason* for the specific details. If the reason is general (money, convenience), the maxim must be general. If the maxim is general, the contradiction returns.

  This shows you understand the structure of the ethics, not just the surface-level rule.
