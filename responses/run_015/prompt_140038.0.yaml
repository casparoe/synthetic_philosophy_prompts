answer: |-
  ### Exam Question

  **Question 2: Inheritance, Arbitrariness, and the Code Metaphor**

  **Instructions:** Answer this question OR Question 1. Word limit: 1500 words maximum. Time allowance: 48 hours.

  **Context:** You are presented with three *invented* molecular inheritance systems. Do not import facts from actual Earth biology (e.g., do not argue that System W is impossible because of known biochemistry). Treat the descriptions below as complete stipulations of fact. Your task is to analyze whether these systems support literal or metaphorical talk of "genetic information" and "coding."

  **The Systems:**

  *   **System K:** A linear polymer of four unit types. A molecular machine reads the polymer in non-overlapping triplets. Each triplet causes the addition of one unit from a set of twenty. The mapping from triplet to unit is **arbitrary** (chemistry does not dictate it), **fixed** (identical in every cell and stage), and **historically stable**. The mapping is structured so that common reading errors result in chemically similar units.
  *   **System W:** Same polymer and machine as K. However: (i) The mapping from triplet to unit depends on the concentration of specific "adapter" molecules present in the cell. (ii) Adapter concentrations vary by tissue and shift in response to environmental cues. (iii) These shifts are heritable for 2–3 generations before fading. (iv) The shifts are adaptive: new mappings tend to produce units useful in the triggering environment.
  *   **System L:** No linear read-out. Inheritance consists of a pattern of chemical marks on a polymer. The underlying sequence is identical in all variants and plays no role in the phenotype. The marks are placed by enzymes sensitive to existing marks (self-perpetuating pattern). The pattern is transmitted with high fidelity, switches the organism between two adaptive phenotypes, and can be experimentally swapped to heritable effect.

  **The Prompt:**

  **(a)** For System K and System L, state whether you would describe the inherited element as literally carrying "genetic information" and whether it constitutes a "code." Briefly justify the distinction between the two terms if your answer differs for each. (4 marks)

  **(b)** Focus on System W. Is the polymer sequence the "message" and the adapter set the "codebook," or is this distinction collapsed? Explain what determines a "correct" reading versus a "misreading" in this system. If the adapter set is itself inherited, does this generate a vicious regress of codebooks? (8 marks)

  **(c)** Synthesis. Reflecting on all three systems, identify which specific feature (e.g., arbitrariness, separation of storage and machinery, fidelity, adaptiveness) was actually doing the philosophical work in arguments for treating DNA as a literal code. What does this imply about whether the debate is truly about biology or about something else? (8 marks)

  ***

  ### Model Answer (Approx. 700 words)

  **(a)** System K is the paradigmatic case for both "information" and "code." It possesses a combinatorial alphabet, a discrete vehicle, and an arbitrary mapping rule that is fixed independently of the immediate causal chemistry. This fits the definition of a code: a convention for translating one domain into another. System L, however, forces a separation. It clearly carries *information* in the sense that it makes a specific difference to the phenotype with high fidelity and adaptive relevance. However, it lacks a *code*. There is no alphabet, no combinatorial syntax, and no arbitrary translation rule. The mark pattern causes the phenotype through direct chemical affinity or structural templating, not via a lookup table. Thus, L supports informational talk (causal specificity with adaptive function) but rejects code talk (arbitrary symbolic mapping).

  **(b)** System W breaks the standard architecture of the code metaphor. In K, the codebook is external to the message and fixed by evolutionary history (the "selected function" of the ribosome). In W, the codebook (the adapter set) is variable, context-sensitive, and partially inherited. We cannot say the sequence is the message and the adapters are merely the codebook, because the adapters also carry semantic content—they specify *how* to read the sequence based on environmental history. The "message" is actually the *relation* between the sequence and the adapter set.

  This complicates normativity. In K, a misreading is a deviation from the fixed historical rule. In W, a "misreading" cannot be defined by deviation from a fixed rule, because the rule is supposed to change. Instead, normativity must be grounded in the *function* of the system. A reading is "correct" if it aligns with the adaptive function of the adapter shift (producing the useful unit), and "incorrect" if it fails to execute that shift or executes it randomly. The norm is teleological (goal-directed), not syntactic.

  Regarding regress: If the adapter set is the codebook, do we need a second codebook to read the adapter set? Not necessarily. The regress only becomes vicious if every layer requires semantic interpretation. If the adapter set operates through brute chemical affinity (e.g., mass action kinetics) rather than symbolic translation, the chain stops. The adapters are read causally, not semantically. Thus, W suggests a hybrid system: the polymer is symbolic, but the context that decodes it is causal. The regress is avoided by grounding the top-level codebook in non-semantic causal processes.

  **(c)** Comparing K, W, and L reveals that "arbitrariness" is the load-bearing feature for *code* talk, while "causal specificity" is the load-bearing feature for *information* talk. L has specificity without arbitrariness (information, no code). K has both. W has arbitrariness but makes the mapping unstable.

  The philosophical debate over DNA is often presented as a dispute about whether genes are "special" causes. However, these cases suggest the debate is actually about *control architecture*. To call DNA a code is to claim that the control of development is centralized in the sequence, with the cellular machinery acting as a passive, fixed decoder. System W shows that if the decoder is active and variable, the locus of control shifts to the cellular context. System L shows that inheritance can occur without a central controller at all.

  Therefore, the insistence on DNA as a "literal code" is not merely a claim about chemistry; it is a claim about biological hierarchy. It asserts that the sequence holds authority over the cell. When we argue about information, we are really arguing about where agency lies in the organism. If we accept W or L as genuine inheritance systems, we must abandon the idea that information flow is unidirectional from sequence to organism. The debate was never about DNA; it was about whether we view the organism as a machine executing a program (K) or a dynamic system negotiating stability (W/L). Recognizing this dissolves the "metaphor vs. literal" stalemate: "code" is literal only if the architecture of control is centralized. Since biology varies, the terminology must vary with it.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Goal:** Distinguish between mechanical application of seminar theories (B-range) and reconstruction of the underlying concepts (A-range).

  **1. Distinction between Information and Code (4 marks)**
  *   **4 (A):** Explicitly separates "information" (causal specificity/adaptive difference) from "code" (arbitrary mapping/syntax). Correctly identifies L as having information but lacking a code.
  *   **3 (B):** Identifies L is different but conflates information and code (e.g., says L has no information because it has no code).
  *   **2 (C):** Treats K and L identically or relies on real-world biology to dismiss L.
  *   **Common Error:** Assuming "information" implies "code" (treating them as synonyms).

  **2. Analysis of the Message/Codebook Relation in W (4 marks)**
  *   **4 (A):** Argues that in W, the message is the *relation* between sequence and adapter, not the sequence alone. Recognizes the codebook is part of the inheritance.
  *   **3 (B):** Maintains the standard K-model (Sequence = Message, Adapter = Tool) despite the prompt's stipulation that adapters vary heritably.
  *   **2 (C):** Confused by the variability; claims W cannot have information because it isn't fixed.
  *   **Common Error:** Insisting the sequence must be the sole message because "that's what DNA does."

  **3. Normativity and Misreading in W (4 marks)**
  *   **4 (A):** Shifts the criterion of correctness from *syntactic fidelity* (matching a fixed rule) to *teleological function* (achieving the adaptive outcome).
  *   **3 (B):** Attempts to define error based on deviation from a "standard" mapping that doesn't exist in W.
  *   **2 (C):** Claims there is no such thing as error in W because everything is causal.
  *   **Common Error:** Failing to see that normativity requires a functional standard when syntactic rules are fluid.

  **4. The Regress Problem (4 marks)**
  *   **4 (A):** Solves regress by distinguishing semantic reading (requires code) from causal interaction (does not). Grounds the adapter set in chemistry, not symbols.
  *   **3 (B):** Claims there is a regress but ignores it, or claims there is no regress without justification.
  *   **2 (C):** Argues the regress makes the system impossible (violating the "stipulated fact" instruction).
  *   **Common Error:** Assuming every causal interaction requires a "reader" (semanticizing all causation).

  **5. Synthesis: Load-Bearing Features and Control (4 marks)**
  *   **4 (A):** Identifies that "code" talk is a proxy for "centralized control/architecture." Connects arbitrariness to code and specificity to information. Concludes the debate is about agency/hierarchy.
  *   **3 (B):** Summarizes the three seminar positions (Deflationary, Selected-Effect, Parity) and maps K, W, L to them without deeper synthesis.
  *   **2 (C):** Concludes that "everything is information" or "nothing is information" based on personal intuition.
  *   **Common Error:** **The "B-Trap":** Correctly labeling K as Selected-Effect and L as Parity, but failing to explain *why* those labels apply beyond surface features. (An A answer realizes the labels break down on W).

  **Grade Boundaries:**
  *   **A (17-20):** Hits 4 or 5 points at the 'A' level. Shows conceptual reconstruction.
  *   **B (13-16):** Hits mostly 'B' levels. Correctly applies seminar vocabulary but mechanically.
  *   **C (9-12):** Hits 'C' levels. Misunderstands the stipulations or conflates key terms.
