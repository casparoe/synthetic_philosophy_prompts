      *   **Conclusion:** No clear winner, but mutual understanding. Grad student exhaustion.

  4.  **Writing - Iteration 1 (Mental Check):**
      *   *Kai:* "Bell only kills outcome independence." -> *Correction:* Bell kills the conjunction of Parameter Independence and Measurement Independence usually. Kai is arguing that Retrocausality sacrifices Measurement Independence to save Parameter Independence and Locality.
      *   *Ren:* "It's about factorization." -> Needs to be specific about why retrocausality breaks the spirit of the theorem even if it evades the math.
