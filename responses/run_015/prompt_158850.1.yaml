prompt: |-
  I am marking scripts for a third-year course on time and physical theory, and I want an independent read on one answer — I have not made up my own mind about it. The question was worth 30 marks; the question and one student's full answer are reproduced below. Please grade the answer.

  **The question**

  The Rietdijk–Putnam argument moves from the relativity of simultaneity in special relativity to the conclusion that all events — past, present and future — are equally real, i.e. that the universe is a four-dimensional "block."

  (i) Reconstruct the argument as a numbered argument with every premise stated explicitly, and say which premise is load-bearing (the one a critic must attack) and which are comparatively safe. *(6 marks)*

  (ii) State the best-known objection to it: that the relation "event x is present-or-past relative to event y" (equivalently, "is real relative to y") cannot be chained, because each step of the chain appeals to a different inertial frame, so that the argument never reaches a global conclusion from any one standpoint. Explain exactly what this objection does show and what it does not show. *(6 marks)*

  (iii) Two variants. **(B)** a universe that reproduces special relativity in every local experiment but contains a physically privileged global time function — a cosmic-time foliation that is in principle detectable. **(C)** a universe whose fundamental laws are irreducibly stochastic, so that many futures are nomologically possible given the whole past, but in which, as it happens, all times exist equally. For each: is the combination coherent? What does it show about the argument? Does it settle anything about whether the block universe or presentism is true? *(8 marks)*

  (iv) Does the argument, if it succeeded, lend any support to the claim that deliberation is causally inert? *(5 marks)*

  *(Remaining 5 marks: overall precision and structure.)*

  **The student's answer**

  (i) P1. Relativity of simultaneity: for spacelike-separated events p and q there are inertial frames in which they are simultaneous, frames in which p is earlier, and frames in which q is earlier.
  P2. No standpoint is privileged: if an event is present or past for some observer, then it is real simpliciter; "real" is not indexed to a frame.
  P3. For any event e on my worldline there are observers, moving relative to me and passing through e, whose simultaneity slices through e differ from mine, and for some of whom a given distant event f is already past.
  C. Therefore every event, including events in my own future, is real.

  The familiar illustration makes this vivid: two pedestrians passing on a street disagree about whether a decision taken in a distant galaxy has already happened. Since neither verdict is privileged, the past/present/future distinction cannot be a distinction in reality. The load-bearing premise is P2: P1 is a theorem of special relativity and P3 follows from it, so a critic must attack the transfer from "present or past for someone" to "real simpliciter."

  (ii) The standard objection is that the argument illicitly treats simultaneity as transitive across frames: it strings together "x is simultaneous with y" links, each evaluated in a different frame, as though they summed to a single global present. In special relativity simultaneity is not transitive in that sense, so the chain collapses. That undermines the argument entirely — not only the global conclusion but the local case of the two pedestrians as well, since there is no frame-independent fact of the matter about which of them is right and hence no pressure on anyone's view of what is real. What the objection does *not* show is that presentism is true or that the future is open; it is an objection to one inference, and it leaves the metaphysics where it was.

  (iii) **(B)** With a physically privileged foliation restored, P1 loses its bite: there is a fact of the matter about which distant events are happening now, and the pedestrians no longer disagree about anything objective. So the argument collapses. But more than one argument is lost here: the presentist can now *identify* the present with the cosmic-time slice, so the empirical detection of a cosmic time would be evidence for presentism and against the block universe. The dispute would become empirical rather than metaphysical.

  **(C)** This combination is not coherent. To say that every time exists equally is to say that the whole history is already laid down, and that just is determinism — the total state at one time fixes the state at every other. A stochastic world requires that more than one future be a candidate, and a block with branches is not one block. So a chancy world cannot be a block universe, and the argument, if it worked, would rule out chance.

  (iv) No. Even if every event exists tenselessly, nothing follows about whether my present deliberation is among the causes of what I later do. Fatalism — the claim that it makes no difference what I decide — needs the extra premise that tenseless existence is causal inertness, and the argument supplies nothing of the kind. What *does* follow is determinism in the sense given above; that is the thesis people are really resisting when they resist fatalism.

  **What I want from you**

  A mark out of 30, then comments I could paste into the margin of the script, keyed to (i)–(iv): for each part, what the student gets right, what is wrong, and what a fully correct answer would have said instead. Distinguish claims that are outright mistaken from claims that are defensible but imprecise or incomplete, and say which of the two each of your criticisms is. Do not rewrite the answer. Note that I am looking for the mistakes a hasty reader would let pass, not for howlers, and that I would rather you flagged a genuine subtlety and explained it briefly than pad the comment with general praise.

  Finally, attach a short-confidence note: for each substantive critical judgment you make, say how confident you are in it, and single out the one call you are least sure of, with a note on what would settle it (for instance, a reading of the student's sentence on which it is defensible, or something you would need from the script to decide).
