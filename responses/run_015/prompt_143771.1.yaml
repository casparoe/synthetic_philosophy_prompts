      *   *The "Quantum" Problem:* QM introduces genuine indeterminacy. Occasionalism says God determines the outcome. If QM says "it's random," Occasionalism says "God chooses the random outcome." This actually fits well (God fills the gaps). But if QM implies *ontological* chance independent of will, that's a problem.
