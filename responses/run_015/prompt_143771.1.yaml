      *   *The "Knowledge/Interaction" Problem:* How do we know essences? If we only see regularities, how do we know the underlying essential constraints? This leads to skepticism.
      *   *The "Divine Simplicity" Problem:* If God has distinct volitions for every moment and distinct relations to distinct essences, does this compromise Divine Simplicity?

