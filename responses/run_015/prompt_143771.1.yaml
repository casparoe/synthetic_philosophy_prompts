      *   *The "Constraint" Problem:* If essences constrain God's will, are they co-eternal/necessary? If so, does this limit Divine Sovereignty/Aseity? If they are created, how do they constrain the Creator? This looks like a version of the Euthyphro dilemma or the problem of eternal truths.
