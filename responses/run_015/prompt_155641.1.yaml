          *   *Conflict:* (a) says goods are absences (psychological states). (b) says moral facts are mind-independent.
          *   *Severity:* Low-Medium. Can hold that "suffering is bad" is a mind-independent fact about conscious states. Similar to pain realism.
          *   *Resolution:* Compatible if "suffering" is defined naturally.

