answer: |-
  Your skepticism is well-founded. Your friend is right, and the book you read has compressed a subtle, ongoing foundational debate into a caricature that mixes genuine difficulties with misunderstandings of the formalism.

  Here is a breakdown of what a specialist in quantum foundations would accept, what they would wince at, and what is simply wrong in that summary.

  ### 1. "Counting branches gives 50/50"
  **Verdict: Wrong / Category Error.**

  This is the biggest red flag. The idea that there is a discrete, countable number of branches is a pop-sci simplification, not how the math works. In the Many-Worlds Interpretation (MWI), "branching" is a result of decoherence. Decoherence is not a sharp, discrete event where one world snaps into two; it is a continuous, messy process where quantum systems become entangled with their environment.

  Because the splitting is continuous and the basis (the way you define the "branches") is somewhat approximate, there is no well-defined integer number of branches to count. You cannot ask "how many branches are there?" in the same way you cannot ask "how many waves are in the ocean?"

  Specialists agree that "naive branch counting" yields the wrong probabilities, but they do not agree that this is a problem Everettians "forgot." Rather, they argue that branch counting is **ill-defined**. The book presents this as if the worlds are discrete marbles (one red, one blue) and Everettians are ignoring the weight of the marbles. In reality, the formalism doesn't produce discrete marbles; it produces a continuous wave function where "weight" (amplitude squared) is fundamental and "count" is not.

  ### 2. "Flat contradiction with experiment... the theory is dead"
  **Verdict: Wrong / Hyperbole.**

  This is rhetorical exaggeration. MWI is constructed to be empirically equivalent to standard quantum mechanics (Copenhagen). If MWI could not recover the Born rule (the 90/10 probabilities), it would indeed be falsified. However, proponents argue that it *does* recover them.

  To say the theory is "dead" implies it has been experimentally ruled out. It hasn't. It is a minority interpretation, and many physicists find it metaphysically extravagant, but it is not "dead" in the scientific sense. The difficulty is derivational (can we prove the probabilities come out right?), not empirical (have we seen them come out wrong?).

  ### 3. "The problem of probability" (Incoherence vs. Quantitative)
  **Verdict: The book runs them together; your friend is right.**

  There are actually two distinct problems here, and pop-sci books often conflate them.
  1.  **The Incoherence Problem:** If *everything* happens, what does it mean to say an outcome is "probable"? Why should I feel uncertainty before a measurement if I know both outcomes will occur?
  2.  **The Quantitative Problem:** Granted there is uncertainty, why should the odds be 90/10 and not 50/50?

  The book focuses entirely on the Quantitative Problem (the Born rule) and ignores the Incoherence Problem. This is where your friend's point about **self-locating uncertainty** comes in. This is a modern philosophical move (championed by people like Sean Carroll and Simon Saunders) that addresses the Incoherence Problem. It argues that even if you know the global wave function, *you* (the observer) don't know which branch *you* will find yourself on after the split. This restores the meaning of "uncertainty."

  The book's failure to mention this suggests it is relying on an older, cruder understanding of the debate.

  ### 4. "Decision-theoretic arguments are circular"
  **Verdict: A live objection, not a settled fact.**

  This is the most nuanced part. The "Deutsch-Wallace program" attempts to derive the Born rule using decision theory. The argument is roughly: "If you accept certain axioms of rational behavior in a branching universe, you are logically compelled to bet according to the Born rule."

  *   **What specialists accept:** It is a sophisticated attempt to solve the Quantitative Problem without adding new physics.
  *   **What specialists debate:** Whether the axioms of rationality secretly smuggle in probabilistic assumptions. Critics say, "You assumed probability to get probability." Proponents say, "We only assumed preferences and consistency, not numbers."

  The book presents the circularity charge as a proven fact ("But this is circular"). A specialist would say it is a **live objection**. It is a serious criticism, but it is not a consensus refutation. It is currently the dominant defense of MWI, but it is not universally accepted as successful.

  ### 5. "Measure of existence... twice as many worlds"
  **Verdict: Wrong / Misleading.**

  The book claims the "honest version" says a branch with twice the amplitude contains "twice as many worlds." This reverts to the discrete counting error mentioned in point #1.

  When Everettians talk about "measure of existence" or "branch weight," they do **not** mean there are more discrete worlds. They mean the *single* branch has a higher "weight" in the Hilbert space. A better analogy is not "two worlds vs. one world," but rather "a thick world vs. a thin world," or "a long line vs. a short line."

  If the book says this move is just "biting the bullet" to make branch counting work, it is misrepresenting the move. The move is an attempt to justify why *weight* matters more than *count*, precisely because *count* is meaningless.

  ### Summary: What should you believe?

  *   **Believe this:** The derivation of probability (the Born rule) within MWI is the hardest, most controversial part of the interpretation. It is not trivial, and not everyone is convinced it has been solved.
  *   **Believe this:** The "circularity" objection to decision theory is a serious, respected criticism, though not a final verdict.
  *   **Believe this:** Your friend is correct that "self-locating uncertainty" is a key concept the book ignored, and distinguishing between "why probability exists" and "why it has these values" is crucial.
  *   **Do not believe:** That branches are discrete, countable objects. (They aren't).
  *   **Do not believe:** That MWI is "dead" or in "flat contradiction with experiment." (It is empirically equivalent to standard QM, pending the probability derivation).
  *   **Do not believe:** That "measure of existence" means "more worlds." (It means "more weight," which is different).

  The book took a genuine, difficult foundational problem (deriving the Born rule in a deterministic multiverse) and framed it using a naive model of branching (discrete splitting) that specialists don't actually use. That makes the problem look simpler and the theory look more vulnerable than it actually is.
