prompt: |-
  You are a professional philosopher specializing in moral epistemology and the history of ethical pedagogy. Before drafting, take a moment to brainstorm precise formulations that each camp would genuinely accept for its own position, and distinguish substantive disagreements from merely verbal ones.

  Draft the joint statement of an adversarial collaboration between two opposing camps on the uses of biography for moral learning, specifically through the lens of Plutarch’s comparative method (synkrisis) and modern anti-hagiographic critique. The first camp, the Exemplarists, holds that comparing paired lives yields a distinctive form of moral knowledge—call it calibrated analogical pattern-matching—that reveals the modal range of virtue and vice across different political conditions, and that selective amplification in biography is not corruption but necessary focusing. The second camp, the Anti-Hagiographers, holds that biography necessarily introduces epistemic contamination through selection and myth-making, that comparison of lives produces only aesthetic appreciation or motivated reasoning rather than transferable moral insight, and that moral philosophy should rely on abstract principle rather than narrative particularity.

  Produce a constructive document both sides could sign. Include: (1) a numbered section of agreed claims—covering at least Plutarch’s paired comparative structure, the psychological reality of distortion in biography, the existence of narrative identification as a cognitive mechanism, and the distinction between moral knowledge and moral motivation; (2) a disagreements table with columns for the crux, the Exemplarist formulation (worded so they accept it), the Anti-Hagiographer formulation (worded so they accept it), and for each crux a concrete case or argument both agree bears on it (for instance, how the pairing of Alcibiades and Coriolanus functions pedagogically, or what modern demystified biographies of political figures reveal about moral transfer), plus each side’s explicit prediction about what that case demonstrates; (3) an explicit identification of any disagreement that is purely verbal, with an explanation of why. Keep the complete response under 650 words, and do not include bibliographies, citations, reading lists, or requests for further sources.
