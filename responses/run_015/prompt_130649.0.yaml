answer: |-
  **Joint Statement on Biography and Moral Epistemology**

  We, the undersigned camps, acknowledge deep divergence regarding moral pedagogy while committing to shared empirical and structural premises.

  **1. Agreed Claims**
  1.  **Plutarchian Structure:** Plutarch's *synkrisis* intentionally pairs lives to facilitate comparative judgment, serving a pedagogical end beyond mere historical record.
  2.  **Inevitable Distortion:** Biographical narrative necessitates selection, omission, and emplotment, creating inevitable divergence from exhaustive historical data and causal completeness.
  3.  **Cognitive Mechanism:** Narrative identification is a robust psychological reality wherein readers simulate agents' deliberations, significantly influencing affective responses and attention.
  4.  **Knowledge/Motivation Distinction:** Possessing moral knowledge (correct judgment of action) is analytically distinct from possessing moral motivation (the drive to act), though effective pedagogy often targets both simultaneously.

  **2. Substantive Disagreements**

  | Crux | Exemplarist Formulation | Anti-Hagiographer Formulation | Concrete Case | Explicit Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **Epistemic Status of Selection** | Selective amplification is **necessary focusing**, filtering noise to reveal the modal range of virtue and vice across varying political conditions. | Selective amplification is **epistemic contamination**, prioritizing literary symmetry over causal accuracy, yielding only aesthetic appreciation. | **Alcibiades & Coriolanus:** Pairing highlights talent corrupted by pride. | **Ex:** Readers acquire calibrated analogical pattern-matching for leadership risks. **AH:** Readers absorb a mythic archetype, impairing analysis of distinct historical causes. |
  | **Source of Moral Insight** | Narrative particularity generates **transferable insight** through analogical mapping to novel situations. | Narrative particularity generates **motivated reasoning**; reliable insight requires abstraction from particularity to universal principle. | **Modern Demystified Bios:** Revealing private flaws in public heroes. | **Ex:** Complex modeling enhances situational judgment. **AH:** Eroded exemplar status diminishes motivation without supplying normative principles. |

  **3. Verbal Disagreement**
  **Term:** "Moral Knowledge."
  **Explanation:** Exemplarists utilize a *performance-based conception*, defining knowledge as successful perceptual navigation via pattern recognition acquired through exposure. Anti-Hagiographers utilize a *propositional conception*, defining knowledge as justified true belief derived from universal principles independent of context. Both agree that successful moral navigation is the ultimate goal but disagree on whether narrative simulation counts as genuine epistemic justification or merely useful psychological preparation for acting on principles.
