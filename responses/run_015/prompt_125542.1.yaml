answer: |-
  Subject: Re: Plutarch question

  Hey there,

  It sounds like you have a really solid grasp of what Plutarch is actually doing, especially that bit about the Alexander intro where he distinguishes between history and biography. You are right that he cares much more about the moral character of the subject than the chronology of battles or laws. That is the key to unlocking all those other questions you have about how he would handle the modern world.

  If Plutarch were looking at Instagram or PR teams today, I do not think he would say it breaks his method, though he would definitely find it annoying. You have to remember that he was writing about people who were already legends, and plenty of those legends were built on propaganda. Roman politicians had poets on their payroll to write verses about their greatness, and Greek statues were often idealized versions of reality. Plutarch knows that public reputation is a performance. His method relies on finding the small detail that leaks through the performance. He would probably treat a curated social media feed like he treats official historical records, as something to be skeptical of. He would not be looking at the polished photo op but rather at how the person treats their assistant off camera, or what they say when they think no one is recording, or even how they handle a scandal when the PR spin fails. To him, the existence of a filter just makes the search for the real character more important, not impossible. He would argue that the effort to hide your true self is actually a huge clue about your character in itself.

  Regarding what your teacher said about the Lives being half invented, that is a common take, but Plutarch would not see it the way we do. He is not trying to be a fact checker in the modern journalistic sense. He is a moral philosopher using historical figures as case studies. If a story illustrates a virtue or a vice effectively, he might include it even if he has doubts about whether it happened exactly that way, because he is after moral truth rather than factual accuracy. However, he would not be okay with deliberate deception if it stemmed from cowardice or dishonesty. If a modern celebrity uses a ghostwriter to pretend they are smarter than they are, Plutarch would not care that the book is fake as much as he would care that the person is vain enough to need the fake book. He would judge the deception as a flaw in their character. So he would not ignore the invention, but he would analyze why the invention exists rather than just checking if it is true.

  On the question of judging people from the past by today's morals, I think Plutarch would be genuinely confused by the argument. He believes that virtue is universal. Courage, temperance, justice, and wisdom are the same in Athens, Rome, or New York. He would not understand the idea that morals change over time. That said, he is usually pretty careful to judge people based on the challenges they actually faced. He does not blame a Greek general for not having modern human rights, but he does blame him for being cruel when he could have been merciful. He would likely say that judging someone by today's standards is fine as long as you are judging their character, not just checking boxes on a list of rules. He would probably think we are too obsessed with external rules and not obsessed enough with the internal state of the soul. He would ask if the person was trying to be good according to the light they had, not whether they followed our specific social norms.

  So to sum it up, he would see modern media as just another layer of mask to peel back, he would view factual invention as secondary to moral truth, and he would likely reject the idea that morality is relative to the time period. He wants to know who you are when nobody is watching, even if nobody is watching because you turned off the camera.

  Hope that helps you get unstuck on the assignment.

  Best,

  Your Tutor
