  **Score:** 18/25
  **Letter Grade:** C+

  **Rubric Comments:**

  **(a) Contextualism Definition & Stakes [5/5 pts]**
  *   **Correct:** You accurately identify contextualism as a semantic thesis regarding the truth-conditions of 'knows'. You correctly identify that standard attributor contextualism locates the relevant stakes/salience in the *attributor's* context, not the subject's.
  *   **Application:** Your application to the low/high-stakes bank cases is correct for this view (utterance is true in low-stakes context, false in high-stakes context, regardless of Hannah's evidence).

  **(b) Pragmatic Encroachment Definition & Stakes [5/5 pts]**
  *   **Correct:** You correctly distinguish PE from contextualism in the first instance by noting it concerns "knowledge itself" rather than just semantics. You correctly identify that the relevant practical factors are the *subject's* stakes (Hannah's), not the attributor's.
  *   **Application:** Your prediction for the bank cases under PE is correct (Hannah knows in low-stakes, does not know in high-stakes due to insufficient warrant relative to stakes).

  **(c) Bank Case Predictions [5/5 pts]**
  *   **Correct:** Although you integrated this into parts (a) and (b) rather than writing a separate paragraph, you clearly articulated the predictions for both views in the standard bank cases. You correctly note that in the *standard* setup (where subject and attributor stakes align), both views yield the same intuitive verdict (Knowledge in Low, No Knowledge in High).

  **(d) Classification & Divergent Case [3/10 pts]**
  *   **Major Error (Classification):** You write: *"Pragmatic encroachment is best understood as just a version of contextualism."* This is incorrect. In the standard taxonomy, Pragmatic Encroachment (often called Subject-Sensitive Invariantism or SSI) is a version of **Invariantism**, not Contextualism.
      *   **Why this matters:** Contextualism claims the *semantic content* of 'knows' shifts with context. PE/SSI claims the *semantic content* of 'knows' is fixed (invariant), but the *epistemic standards required to satisfy that content* shift based on the subject's practical situation. This is not a "cosmetic" difference; it fundamentally changes how we analyze disagreement and error.
  *   **Missing Instruction (Divergent Case):** The prompt asked for a case where the two views make *different* predictions. You stated that *"in the standard bank cases... the views predict the same thing,"* which is true, but you did not provide the case where they diverge.
      *   **The Correct Case:** You need a "Crossed Stakes" case. Imagine Hannah (Subject) has **Low Stakes** (no penalty for late deposit), but the Attributor (e.g., Hannah's spouse asking her) has **High Stakes** (they need the money for a mortgage payment and believe Hannah is checking).
      *   **Divergent Prediction:**
          *   **Contextualism:** The attributor's high stakes raise the semantic standard. The sentence "Hannah knows" is **False**.
          *   **Pragmatic Encroachment (SSI):** The subject's (Hannah's) low stakes mean the epistemic standard is low. Hannah **Does Know**.
  *   **Correction:** You correctly noted PE is not *Classical* Invariantism, but you missed the category of *Subject-Sensitive* Invariantism. PE is invariantism about the *word*, but variabilism about the *knowledge relation*.

  **Summary:**
  You have a strong grasp of the mechanics of both views and how they handle the standard Bank Case (Parts a–c). However, you fundamentally misclassified Pragmatic Encroachment in Part (d). Treating PE as a species of Contextualism overlooks the core semantic disagreement that defines the debate. For future essays, ensure you distinguish between *semantic context-sensitivity* (Contextualism) and *practical sensitivity of the knowledge relation* (PE/SSI).
