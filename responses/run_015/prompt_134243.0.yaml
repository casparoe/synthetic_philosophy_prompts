answer: |-
  # SEMINAR HANDOUT: Mapping the Aggregation Problem in Contractualism

  **Goal:** To stop going in circles about whether "saving five justifies harming one." This tree sorts positions based on *how* they justify decisions, not just the outcomes. Use the intuitive cases to locate your own view before checking the theoretical label.

  ---

  ## I. The Root: Contractualist Core
  **Principle:** An act is wrong if it violates principles that no one could **reasonably reject**.
  **The Conflict:** Does the "reasonableness" of a rejection depend *only* on the burden to the individual, or does the *number* of people suffering that burden matter?

  ---

  ## II. The Decision Tree

  ### **SPLIT 1: The Scope of Rejection**
  *When a person says, "I reasonably reject this principle because it harms me," do we look only at their individual burden, or does the crowd behind them matter?*

  #### **PATH A: Strictly Pairwise**
  *(Numbers don't count. I compare my burden to your burden. The fact that there are 5 "yous" is irrelevant.)*
  │
  ├── **SPLIT 2A: Is the Individual Veto Absolute?**
  │   │
  │   ├── **Leaf 1: The Hard Anti-Aggregationist**
  │   │   *   **View:** A significant burden to one person can never be outweighed by aggregated minor benefits to many. The individual veto is absolute.
  │   │   *   **Case Intuition (Kidneys):** One healthy person has 5 kidneys. Five dying patients need 1 each.
  │   │   *   **Verdict:** **Do not harvest.** The healthy person's right to bodily integrity trumps the five deaths. Numbers are irrelevant.
  │   │
  │   └── **Leaf 2: The Threshold Pairwise**
  │       *   **View:** The veto is absolute for *significant* burdens, but trivial burdens can aggregate.
  │       *   **Case Intuition (Traffic):** One driver is 10 minutes late (minor burden) vs. Five pedestrians avoid injury (major benefit).
  │       *   **Verdict:** **Stop the car.** The driver's burden is below the threshold of "reasonable rejection," so the five pedestrians' safety counts.
  │       *   *(Note: In high-stakes cases like Kidneys, this looks identical to Leaf 1.)*

  #### **PATH B: Number-Sensitive**
  *(Numbers count. The fact that 5 people face this burden makes rejecting the principle more reasonable.)*
  │
  ├── **SPLIT 2B: How Do Numbers Enter the Calculation?**
  │   │
  │   ├── **Leaf 3: The Tie-Breaker**
  │   │   *   **View:** Numbers only matter when individual burdens are *identical*. If burdens differ, pairwise comparison wins.
  │   │   *   **Case Intuition (Burning Buildings):** Building A has 1 person; Building B has 5 people. You can save only one building. Everyone faces death (equal burden).
  │   │   *   **Verdict:** **Save Building B.** Since the individual burden (death) is equal, the number breaks the tie.
  │   │   *   *(Contrast with Kidneys: Healthy person loses kidney vs. Patients lose life. Burdens unequal → Pairwise wins → Don't harvest.)*
  │   │
  │   ├── **Leaf 4: The Weighted Comparator**
  │   │   *   **View:** Numbers add weight to the complaint. A complaint shared by 5 is heavier than a complaint by 1, even if burdens differ slightly.
  │   │   *   **Case Intuition (Water):** One hiker has 5 cups of water but needs 1 to survive. Five hikers need 1 cup each to survive.
  │   │   *   **Verdict:** **Take the water.** The aggregated claim of the five (survival) outweighs the one (survival), because the "reasonableness" of the rejection is amplified by numbers.
  │   │
  │   ├── **Leaf 5: The Collective Principle**
  │   │   *   **View:** The 5 people form a temporary "constituency." Their claim isn't a sum of individuals, but a collective right that supersedes individual claims.
  │   │   *   **Case Intuition (Water):** Same as above.
  │   │   *   **Verdict:** **Take the water.** But the justification is different: You are respecting the *group's* claim, not summing harms.
  │   │   *(Note: Often yields same outcome as Leaf 4, but structurally distinct.)*
  │   │
  │   └── **Leaf 6: The Domain Separatist**
  │      *   **View:** Aggregation is permitted in "Rescue" (emergency) contexts but forbidden in "Distribution" (institutional) contexts.
  │      *   **Case Intuition:**
  │          *   **Water (Rescue):** **Take the water.** Emergency allows number-sensitive rescue.
  │          *   **Kidneys (Distribution):** **Do not harvest.** Institutional rules cannot treat individuals as containers of value.
  │      *   **Verdict:** **Split Decision.**

  ---

  ## III. Empty & Incoherent Combinations

  ### **Leaf 7: The "Pairwise Aggregator" (EMPTY)**
  *   **Position:** "I justify decisions strictly pairwise (Path A), but I allow the number of people to outweigh the individual (Split 2B)."
  *   **Why it's Empty:** **Incoherent.** You cannot claim to look *only* at the individual relation (Pairwise) while simultaneously allowing the *count* of people to decide the outcome (Aggregation). If numbers decide, you are no longer being strictly pairwise. This position usually collapses into Leaf 4 (Weighted Comparator) upon questioning.

  ---

  ## IV. Seminar Discussion Notes

  ### **1. Blind Spots: Pairs the Tree Can't Separate**
  *   **Leaf 4 (Weighted) vs. Leaf 5 (Collective):** In practice, these often produce identical verdicts (e.g., save the 5 hikers). The tree separates the *metaphysics* (summing harms vs. group agent), but not the *outcome*. If your group only cares about "what do we do?", these two are functionally identical.
  *   **Leaf 1 (Hard Anti) vs. Leaf 2 (Threshold):** In high-stakes cases (Life vs. Life), these look the same. You only see the difference in low-stakes cases (Taxation, Noise, Traffic). If your study group only discusses lifeboat cases, you cannot distinguish these two views.

  ### **2. Why the "Domain Separatist" (Leaf 6) is Popular**
  *   Many people feel the **Kidney** case (Don't harvest) and the **Water** case (Take the water) are *both* intuitively correct.
  *   Leaf 1 forces you to let the 5 hikers die.
  *   Leaf 4 forces you to harvest the kidneys.
  *   Leaf 6 allows you to keep both intuitions by arguing that "Emergency Rescue" operates on different contractual principles than "Bodily Distribution."
  *   **Critique:** Is there a principled line between Rescue and Distribution, or is this just ad-hoc reasoning to save our intuitions?

  ### **3. The "Tie-Breaker" Trap (Leaf 3)**
  *   This view tries to keep Contractualism pure (Pairwise) while allowing some number sensitivity.
  *   **Test Question:** In the **Water** case, the One Hiker loses *life*. The Five Hikers lose *life*. Is this a tie?
      *   If **Yes**: You take the water (becomes Aggregation).
      *   If **No** (because the One loses *all* water vs. Five lose *some*): You let them die (becomes Hard Anti-Aggregationist).
  *   This view is unstable; it tends to slide into Leaf 1 or Leaf 4 under pressure.

  ---

  ## V. Exercise for the Group
  1.  **Pick a Case:** Don't start with the theory. Start with the **Kidney** case. What is your gut verdict?
  2.  **Trace the Path:** If you said "Don't Harvest," are you **Leaf 1** (Never harvest) or **Leaf 6** (Don't harvest kidneys, but would save hikers)?
  3.  **Stress Test:** If you are **Leaf 1**, can you justify stopping the car for the pedestrians (Traffic Case)? If you can't, your view might be too rigid. If you are **Leaf 6**, where exactly is the line between Rescue and Distribution?
