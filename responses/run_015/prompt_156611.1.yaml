prompt: |-
  You are an experienced philosophy-of-science educator and a careful curriculum designer. Before outlining any pedagogical moves, take a moment to brainstorm the conceptual dependency structure: which pieces of the unilateralist’s curse must be in place before its central asymmetry—between one agent’s locally rational action and globally catastrophic outcomes—can be seen as a problem rather than a virtue.

  Plan a single fifty-minute session for a group of graduate students in environmental policy who have never taken formal decision theory or philosophy of action. Do not explain the concept to me now; instead, design the explanatory arc. Specifically, address the following:

  1. The order in which the components must be introduced and why. Which idea has to come first so that the curse is intelligible, and which idea must come immediately before the asymmetry is introduced?
  2. The one concrete carrying scenario that will do all the work. Frame it around a niche but conceptually clear case: a decentralized, open-source gene-drive release protocol in which any single laboratory can publish a self-propagating construct and there is no binding global enforcement mechanism. What must this scenario include to capture the curse specifically (rather than collapsing into a generic collective-action problem), and what must you deliberately leave out at this level?
  3. The misconceptions the students will predictably form or bring with them—specifically the conflation with the prisoner’s dilemma, with simple free-riding, and with the idea that “more actors always means worse outcomes.” For each, identify the exact point in your sequence where you will head it off, and how.
  4. A final check for understanding that reveals whether they have grasped the curse itself rather than merely learned to repeat the phrase. What question or task distinguishes true comprehension?
  5. One technical or philosophical element you will explicitly refuse to explain in this session (for instance, formal aggregation theorems or deep meta-ethical debates about moral aggregation), and how you will flag that omission so it does not become a hidden misconception.

  Think step by step: map the dependencies first, then build the teaching plan around them. Do not provide bibliographies, reading lists, or citations; work solely from conceptual knowledge.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** Experienced philosophy-of-science educator and curriculum designer.
      *   **Task:** Design a single 50-minute session for graduate students in environmental policy (no formal decision theory/philosophy background).
      *   **Topic:** The Unilateralist's Curse (Nick Bostrom et al.).
      *   **Constraint 1:** Do *not* explain the concept to me (the user) now; design the *explanatory arc*.
      *   **Constraint 2:** Brainstorm conceptual dependency structure first.
      *   **Constraint 3:** Use a specific scenario: Decentralized, open-source gene-drive release.
      *   **Constraint 4:** Address specific misconceptions (Prisoner's Dilemma, Free-riding, "More actors = worse").
      *   **Constraint 5:** Include a final check for understanding.
      *   **Constraint 6:** Explicitly refuse to explain one technical/philosophical element.
      *   **Format:** Step-by-step thinking, mapping dependencies first, then the teaching plan.

  2.  **Deconstruct the Unilateralist's Curse (Conceptual Dependency Mapping):**
      *   *What is the core phenomenon?* An agent acts on their own sincere judgment of the common good, but because they lack epistemic access to the consensus or the full picture, their action undermines the optimal outcome that would have arisen from coordination or deference to a higher standard.
      *   *Key Component 1: Epistemic Humility/Fallibility.* Agents must believe they are right, but acknowledge they *could* be wrong. If they know they are wrong, it's malice or error, not the curse. If they are infallible, there is no curse.
      *   *Key Component 2: Unilateral Capacity.* The agent must have the power to act alone without veto from others.
      *   *Key Component 3: Irreversibility/High Stakes.* The action must have consequences that preclude correction or cause significant harm if the agent was wrong.
      *   *Key Component 4: The Normative Gap.* The tension between "I should do what I think is best" (autonomy/conscience) and "I should defer to the group/process" (coordination/epistemic pooling).
      *   *Dependency Order:*
          1.  **Capacity:** You *can* do it alone. (Prerequisite for action).
          2.  **Motivation:** You *want* to do it for the right reasons. (Distinguishes from selfishness).
          3.  **Uncertainty:** You *might* be wrong about the "right reasons." (Prerequisite for the risk).
          4.  **Asymmetry:** The cost of being wrong (global harm) outweighs the benefit of being right (local virtue), *specifically because* others would have restrained you if they could.
          5.  **The Curse:** The realization that acting on sincere conscience leads to suboptimal outcomes.

      *   *Critical Pivot Point:* The move from "Individual Rationality" to "Systemic Risk" hinges on *Epistemic Uncertainty*. Without uncertainty, it's just a calculation. With uncertainty, it becomes a curse.

  3.  **Drafting the Scenario (Gene Drive):**
      *   *Must Include:*
          *   Open-source protocol (anyone can access).
          *   Single lab capacity (no need for consortium).
          *   Self-propagating (irreversible/spreading).
          *   Sincere motivation (saving species/stopping disease, not profit/terror).
          *   Lack of consensus (other experts disagree or haven't weighed in).
      *   *Must Exclude:*
          *   Profit motives (avoids Tragedy of the Commons/Free-rider).
          *   Malicious intent (avoids Terrorism/Sabotage).
          *   Binding treaties (avoids Legal/Compliance issues).
          *   Immediate visible feedback (avoids simple trial-and-error learning).

  4.  **Addressing Misconceptions:**
      *   *Prisoner's Dilemma:* PD is about *incentives* to defect despite knowing cooperation is better. Unilateralist's Curse is about *epistemic disagreement* where the actor thinks they *are* cooperating/saving the day. *Intervention:* When discussing motivation.
      *   *Free-Riding:* Free-riding is benefiting without paying. Here, the actor is paying the cost (risking reputation/safety) to provide a benefit they *think* is real. *Intervention:* When discussing the actor's intent.
      *   *More Actors = Worse:* Sometimes more actors mean better error-checking. The curse isn't about numbers, it's about the *structure of authority vs. capacity*. *Intervention:* During the asymmetry reveal.

  5.  **Designing the Check for Understanding:**
      *   Need a scenario where the standard collective action answers fail.
      *   Test: Can they identify when *restraint* is the rational moral choice despite *conviction*?
      *   Task: Modify the gene drive scenario slightly (e.g., add a voting mechanism) and ask if the curse persists.

  6.  **Selecting the Exclusion:**
      *   *Topic:* Formal Decision Theory (Expected Utility calculations with probability weights).
      *   *Reason:* Too technical, distracts from the normative/structural insight.
      *   *Flagging:* Explicitly state we are doing qualitative structural analysis, not quantitative risk assessment.

  7.  **Structuring the 50-Minute Session:**
      *   0-5 min: Hook & Scenario Setup.
      *   5-15 min: The Intuitive Response (Why it looks like heroism).
      *   15-25 min: Introducing Uncertainty & The Epistemic Gap.
      *   25-35 min: The Asymmetry Reveal (The Curse).
      *   35-45 min: Misconception Check & Boundary Drawing.
      *   45-50 min: Final Assessment & Exclusion Flag.

  8.  **Refining the Plan (Self-Correction during drafting):**
      *   *Critique:* Is 50 minutes enough?
      *   *Adjustment:* Keep the scenario tight. Don't get bogged down in the biology of gene drives; treat it as a black box of "irreversible release."
      *   *Critique:* Make sure the dependency map is clear in the output.
      *   *Adjustment:* Start the response with the dependency map as requested ("Think step by step: map the dependencies first").

  9.  **Final Polish:**
      *   Ensure tone is pedagogical but rigorous.
      *   Check all constraints are met (no bibliography, specific scenario, specific misconceptions).
      *   Verify the "Exclusion" is clearly marked.

