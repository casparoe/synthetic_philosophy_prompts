  > **Reply from OmegaHardware:** The device completes all instructed switchings. The state following the final switching is outside the operational window defined in Section 4.2 of the manual.

  **★★★☆☆ Verified Purchase**
  **Handle:** ProUser_88
  **Date:** 03 December 2023
  I paid the extra £200 for the Pro Model where you stipulate the final state at checkout. I selected 'On'. The lamp was on at t=60s. My question is: did I discover that the lamp was capable of being on, or did my selection force it? Support says I 'configured the output', but the physics suggests the state was fixed before I unpacked it. Feels like I'm editing reality, but the invoice looks normal.

  **★★☆☆☆ Verified Purchase**
  **Handle:** Wittgensteinian
  **Date:** 10 December 2023
  The whole product is a muddle of language. 'State at the limit' implies a position in a sequence, but there is no last position. Selling a device based on a category error is unethical. I give it two stars because the casing is sturdy, but the description promises a outcome that grammar cannot support.
  > **Reply from OmegaHardware:** We stand by our terminology. Customers understand what is meant by 'final state' in a practical context.

  **★★★★★ Verified Purchase**
  **Handle:** FlickerFan
  **Date:** 15 December 2023
  Does exactly what it says on the tin. I use it for meditation during the first 59 seconds. The increasing frequency is very soothing. I turn it off before the minute is up because I don't like wondering what happens next. Perfect for mindfulness.

