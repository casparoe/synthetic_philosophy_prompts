answer: |-
  ### The Spec: Desiderata for a Co-op Pay Theory

  To function as a public justification for 200 members, the theory must survive scrutiny in the breakroom, not just the philosophy seminar. It needs to be administrable, morally defensible, and economically viable.

  **1. Sacrifice Sensitivity (The Sick Parent Case)**
  *   **Requirement:** The pay rule must distinguish between identical outputs produced at different levels of personal cost or hardship.
  *   **Case:** Member A produces 10 units while caring for a sick parent; Member B produces 10 units at ease.
  *   **Rationale:** If the co-op claims to be a community of persons rather than a labor market, ignoring the *cost* of labor violates the norm of solidarity. If pay ignores sacrifice, it treats members as inputs, not partners.

  **2. Non-Decomposability (The Team Case)**
  *   **Requirement:** The theory must assign credit in joint production environments where marginal individual contribution is undefined or negligible.
  *   **Case:** Member C's output is enormous only because of synergy with Member D; neither has a measurable standalone product.
  *   **Rationale:** Most modern work is collaborative. A theory requiring strict marginal productivity accounting will fail empirically. It must have a mechanism for dividing the surplus of a team without arbitrary splitting.

  **3. Control/Responsibility Filter (The Risk Case)**
  *   **Requirement:** Pay must track factors within the member's control (judgment, effort) rather than brute luck (market shifts, random success).
  *   **Case:** Member E makes a well-judged bet that fails due to bad luck; Member F makes a reckless bet that pays off due to good luck.
  *   **Rationale:** Paying for luck undermines moral agency. If F is rewarded for recklessness, you incentivize gambling. If E is punished for bad luck, you disincentivize prudent risk-taking.

  **4. Intertemporal Equity (The Training Case)**
  *   **Requirement:** The theory must account for past investments of time and resources that enable current productivity, specifying if/when that "debt" is amortized.
  *   **Case:** Member G front-loaded years of expensive training; Member H has natural talent. Does G's training "expire" in terms of desert claims?
  *   **Rationale:** Without a mechanism to recognize sunk costs in human capital, members will under-invest in skills. However, if the premium never expires, it creates an aristocracy of skill unrelated to current effort.

  **5. Forward-Backward Compatibility (The Incentive Case)**
  *   **Requirement:** The justification must reconcile what is owed for past performance (desert) with what is required to secure future performance (incentive).
  *   **Case:** Member H deserves a bonus for last year's work, but paying it now might distort behavior next year (e.g., coasting).
  *   **Rationale:** A pay rule that is purely retrospective may bankrupt the co-op or kill motivation. A rule that is purely prospective is manipulative and treats members as means to an end. The theory must bridge the gap.

  ***

  ### The Audit: Requirements vs. Priors

  **Genuine Requirements:**
  *   **Non-Decomposability (D2):** This is structural. If you can't measure it, you can't pay for it directly. Any theory demanding marginal productivity data fails here.
  *   **Forward-Backward Compatibility (D5):** This is existential. A co-op that ignores incentives dies; one that ignores past dues loses trust.

  **Priors Dressed as Criteria:**
  *   **Sacrifice Sensitivity (D1):** This is a *solidarity* prior, not a *desert* prior. In a capitalist firm, this is irrelevant. In a co-op, it's a political choice. You can coherently argue pay is for *value delivered*, and hardship is handled via a separate welfare fund.
  *   **Intertemporal Equity (D4):** This assumes a property right in one's skills. It's a retention strategy masquerading as moral desert. You could argue training is a gift to the collective, amortized immediately upon hiring.

  **The Knockout:**
  *   **Control/Responsibility Filter (D3).** This eliminates the most candidate theories. Almost any metric you can actually measure (revenue, units, hours) is contaminated by luck. To satisfy D3, you need epistemic access to mental states and counterfactuals (what *would* have happened without the luck) that no HR department possesses.

  ***

  ### The Collapse: Pre-Institutional Desert + Contribution + Responsibility

  You are correct to suspect a collapse. Here is the argument for why the triad is jointly unsatisfiable:

  1.  **Pre-Institutional Desert** claims pay should reflect moral worth independent of the rules.
  2.  **Responsibility Condition** claims moral worth attaches only to what the agent controls (effort/judgment).
  3.  **Contribution Basis** claims pay should reflect economic value generated (marginal product).

  **The Contradiction:** Economic value (3) is heavily determined by brute luck (talent, market demand, team synergy), which the agent does not control (violating 2). If you pay for Contribution, you violate Responsibility. If you pay for Responsibility (effort), you ignore Contribution (value), potentially bankrupting the co-op. If you claim the Contribution *is* the Desert, you are lying about the Pre-Institutional nature of it, because value is institutionally defined by market prices.

  You cannot have a moral theory that says "You only deserve what you control" and an economic rule that says "You get paid what you produce," because *what you produce* is largely *what you don't control*. One leg must break.

  ***

  ### Scorecard: How the Views Stack Up

  **1. Contribution-Based View**
  *   **Passes:** Non-Decomposability (mostly), Forward-Backward Compatibility (incentives align).
  *   **Fails:** Sacrifice Sensitivity (ignores hardship), Control Filter (rewards luck/talent).
  *   **Verdict:** Economically robust, morally thin. Treats the co-op like a capitalist firm with different owners.

  **2. Effort/Sacrifice View**
  *   **Passes:** Sacrifice Sensitivity, Control Filter (effort is controllable).
  *   **Fails:** Non-Decomposability (hard to measure effort in teams), Forward-Backward Compatibility (incentivizes sweat, not value).
  *   **Verdict:** Morally robust, economically dangerous. Risks paying people well to dig holes and fill them up again.

  **3. Institutionalist View**
  *   **Passes:** Non-Decomposability, Forward-Backward Compatibility.
  *   **Fails:** Sacrifice Sensitivity, Control Filter (admits pay is conventional, not "truly" deserved).
  *   **Verdict:** Honest. It says "You deserve what the rules say," dissolving the moral tension by denying pre-institutional desert exists.

  ***

  ### Confidence & Mind-Changers

  **Where I'm Over-reading:**
  **Case 4 (Training).** I suspect this isn't a desert problem; it's a **recruitment constraint**. Members don't ask if training is "used up" because they care about moral symmetry; they ask because they want to know if the premium is permanent. This falls under D5 (Incentives). If you treat it as a moral desert claim, you get stuck on amortization schedules. If you treat it as a retention policy, you just set a rate that keeps skilled workers from leaving.

  **Least Confidence:**
  I am least confident that **D3 (Control)** is a hard requirement for a *public justification*. Members might accept a "Responsibility Proxy" (e.g., we pay for outcomes because we can't measure intent, but we all agree luck is involved). If the co-op accepts "Conventional Desert" (you deserve what the agreed-upon rules grant), D3 loses its bite.

  **What Changes My Mind on Impossibility:**
  If you drop **Pre-Institutional Desert**.
  If you accept that "desert" in a co-op is purely **institutional** (i.e., "I deserve this because we all voted on this rule, not because the universe owes it to me"), the collapse vanishes. You can then balance Contribution, Effort, and Incentive politically without claiming any one is the "True Moral Basis." The tension becomes a budget negotiation, not a philosophical contradiction.

  **The Hard Truth:**
  If you insist on Pre-Institutional Desert *and* Responsibility, you cannot run a business. You must choose: either pay for value (and accept luck) or pay for effort (and accept inefficiency). The "perfect" theory doesn't exist; only the compromise you can sell to the membership.
