answer: |-
  Here is the translation into shop talk, followed by the residue report on where the analogy breaks.

  **Position One: Common Sense**
  In craft terms, this treats the dream as a fully realized scene in the backstory, existing in the diegesis regardless of whether it's shown on the page. The waking scribble is merely summary or free indirect discourse reporting on that prior narrated event. The narrating instance has access to the canon of the sleep-state; the focalization shifts from sleeping self to waking self, but the truth-value of the dream remains stable as word-of-author fact. You're working with a reliable narrator recounting a past scene that objectively occurred in the story-world.

  **Position Two: The Wittgenstein/Malcolm Line**
  This posits the dream text as "unbacked." There is no prior narrated event in the story-world; the sentence itself constitutes the only reality. To ask what happened during sleep is to ask for fanon where only canon text exists. The narrating instance doesn't recall; it legislates. There is no unreliable narration here because there is no original event to be unreliable about. The dream isn't a scene that was summarized; it's a statement made in the story-present that claims backstory status without the backing of a prior draft.

  **Position Three: The Dennett/Cassette Line**
  Here the dream is "backwritten" at the moment of waking. The narrating instance drafts the narrated event simultaneously, creating a retroactive continuity that feels like memory but functions like revision. The experience isn't retrieved from storage; it's authored in the composition, making the waking text the first and only draft of the sleep scene. It's not that nothing happened, but what happened is the composition itself, not the retrieval of a previous composition.

  **Residue Report**
  The translation holds up until you hit the ontology of the novel itself. In philosophy, the claim is about the mind; in fiction, the claim is about the text. My biggest worry—the fact that an Author really wrote the scene—collapses the second and third positions. Even if the character's reality is "unbacked," the Book's reality is backed by me. I decided the dream content, so it *is* canon, regardless of what the narrator claims about its origin. This makes Malcolm's "no fact of the matter" impossible to sustain in a finished manuscript; there is always a fact of the matter because there is always a drafter.

  Furthermore, "unreliable narration" assumes a gap between event and report where the truth lies. Malcolm removes the event entirely. Craft vocabulary struggles here because we usually assume a scene happened, even if filtered. We don't have a term for "narration without a narrated event" other than "lying," which isn't quite right. The physical act of the character scribbling mirrors the philosophical report, but because I am reading it, it becomes real in a way the philosopher denies.

  Ultimately, the disagreement collapses into a choice about how much authority you grant the waking narrator over the sleeping backstory. Do you treat the scribble as a transcription (Position 1), a legislation (Position 2), or a composition (Position 3)? The philosophy argues about truth; the novel argues about authority.

