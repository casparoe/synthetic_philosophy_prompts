answer: |-
  **MEMORANDUM**

  **TO:** Investment Committee Members
  **FROM:** Chair, Investment Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Procedure for Probabilistic Forecasts (Thursday's Agenda Item 4)

  **Purpose**
  At Thursday's meeting, we must decide whether to mandate that our internal probabilistic forecasts adhere to "Dutch-book-free" coherence. Our Chief Quant advocates for this as a requirement of logical consistency. Our visiting Actuary-Philosopher cautions that this conflates mathematical forecasts with binding betting dispositions, arguing the constraint is theoretically sound but operationally excessive.

  After reviewing both positions, I recommend we **adopt the coherence requirement as a risk-monitoring tool rather than a binding trading constraint**, effective for a **two-quarter pilot program beginning Q1.**

  **Engaging the Objection: Static vs. Dynamic Consistency**
  The Actuary's objection rests on a vital distinction: we are not bookmakers posting odds for immediate arbitrage (a *static* Dutch book). No counterparty can walk into our office today, construct a portfolio of bets based on our forecasts, and guarantee us a loss. In that narrow sense, the Actuary is correct; our forecasts are not binding betting slips.

  However, the Actuary's conclusion—that the requirement therefore proves too much—overlooks the *dynamic* reality of our fiduciary duty. While we may not face a static bookie, we operate in a sequential market. If our probabilities are incoherent over time (e.g., violating Bayes' rule when updating views on interest rates or equity risk premiums), we become our own worst counterparty.

  A dynamic Dutch book does not require an external arbiter. It manifests as capital allocation errors where we buy assets at prices implied by one set of incoherent probabilities and sell them later based on an inconsistent update. We bleed value not through a single guaranteed loss, but through sequential drift that violates transitivity. Therefore, while the *static* argument may not bind our judgmental forecasts, the *dynamic* argument binds our long-term solvency.

  **Recommendation**
  Requiring perfect coherence on every judgmental forecast creates operational friction and may stifle valid qualitative insight. However, ignoring coherence invites silent capital erosion.

  I propose the following course of action:

  1.  **Shadow Accounting (Quarters 1 & 2):** The Quant team will run coherence checks on all major asset allocation forecasts. These results will be reported to the Committee as a "Consistency Risk Metric" alongside standard performance data. No trade will be blocked solely on this basis during the pilot.
  2.  **Threshold Review:** If the Consistency Risk Metric identifies incoherence that would have resulted in a hypothetical loss of >50 bps over the pilot period, we will move to a binding constraint for Strategic Asset Allocation (SAA) decisions only.
  3.  **Exemption:** Tactical, short-term judgmental calls remain exempt, acknowledging the Actuary's point that not all forecasts are intended as long-run betting dispositions.

  **Conclusion**
  We need not choose between the Quant's logic and the Actuary's pragmatism. We treat logical coherence not as a philosophical absolute, but as a fiduciary guardrail against dynamic self-exploitation.

  Please review the attached technical addendum prior to Thursday. I look forward to finalizing this approach.
