          *   Time budget: 5 mins prep, 10 mins meeting time.
          *   Output: A decision procedure (numbered steps) + a one-page convergence note concept.
          *   Audience: Program officers (experts, no formal probability/econ training, some hostile to formulas).
          *   Data available: Sealed pre-votes + reasons, speaking order, live running tally, final votes + reasons.
          *   Specific Diagnostics needed: Pre-vote vs. final gap, reason sourcing, fragility (info needed to flip), order dependence.
          *   Verdicts: Defer/re-solicit, outside read, settle on pre-votes, discard vote as evidence.
          *   Correction: Check the user's four summary claims against theory.
          *   Case Studies: Apply procedure to three specific past scenarios.
          *   Limitations: What the procedure can't do, gaming risks, audit frequency.
          *   Tone: American English, usable, no citations/bibliography, self-sufficient.

  2.  **Evaluate the User's Four Claims (Theory Check):**

      *   *Claim 1:* Following the crowd is individually rational but makes the group worse-informed (visible actions > private impressions). -> *Accurate.* This is the core definition of an informational cascade.
      *   *Claim 2:* Sequence freezes; later members stop adding info; larger committee doesn't fix it; error probability doesn't fall to zero. -> *Accurate.* Once a cascade starts, private signals are ignored, so adding people adds no new information.
      *   *Claim 3:* State is fragile (small new info overturns it) and arbitrary (depends on early speakers). -> *Accurate.* Cascades are brittle and path-dependent.
      *   *Claim 4:* Look-alikes exist (deference to expertise, redundant evidence, reputational conformity). -> *Accurate.* These are distinct from pure informational cascades but produce similar voting patterns.
      *   *Correction Needed:* The user's summary is actually quite strong. The only nuance is that "reputational conformity" is often grouped under "reputational cascades" vs. "informational cascades," but the distinction holds. I will validate their understanding but refine the diagnostic focus to distinguish *informational* cascades from *expertise deference*.

  3.  **Develop the Decision Procedure (The "Convergence Diagnostic"):**

      *   *Goal:* Distinguish genuine consensus from herding within the time budget.
      *   *Inputs:* Pre-votes, Final Votes, Reasons, Speaking Order.
      *   *Steps:*
          1.  **The Drift Check (Pre-vote vs. Final):** Compare sealed votes to final tally. Large drift suggests influence.
          2.  **The Source Audit (Reasons):** Are reasons independent or copied?
          3.  **The Fragility Test (Hypothetical):** How much new info flips the vote?
          4.  **The Order Simulation (Counterfactual):** Would early speakers change the outcome?
      *   *Verdicts:* Green (Genuine), Yellow (Fragile/Defer), Red (Cascade/Discard).
      *   *Time:* Needs to be fast. Calculations must be mental or simple spreadsheet logic.

  4.  **Drafting the Steps (Iterative Refinement):**

      *   *Step 1 (Drift):* Calculate "Net Drift." (Final Yes - Pre Yes). If Drift > Threshold (e.g., 2 votes) AND early speakers voted Yes, flag.
      *   *Step 2 (Reasons):* Scan reasons. Count unique sources of evidence. If >80% cite the *same* single document without adding private info, flag.
      *   *Step 3 (Fragility):* Ask: "If one new negative fact emerged, would we reverse?" If Yes, it's fragile.
      *   *Step 4 (Order):* Look at the first two speakers. If they were the only ones with private info, and everyone followed, flag.
      *   *Refinement:* Combine into a scoring sheet or a flow chart. Let's make it a "Convergence Note" workflow.

  5.  **Addressing the Case Studies:**

      *   *Case 1 (Ballot Measure 9-1):* Senior officers spoke first. One had field visit (private info), others read memo (public info). Pre-votes? (Not specified, assume mixed or unknown). High drift likely. Reasons likely cited the senior officers or the memo. *Verdict:* Likely Cascade/Deference mix. Needs outside read.
      *   *Case 2 (Chair's Grant 10-0):* Pre-votes 6-4. Drift = +4. Reasons all cited same report. Chair championed it. *Verdict:* High risk of cascade (Chair influence + shared document). If Chair absent, likely fails or defers.
      *   *Case 3 (Renewal 9-1 Against):* Chair deferred. Later found 3 officers had private negative info. *Verdict:* This was *not* a cascade; it was aggregated private information that emerged late. The deferral was justified to surface the info, but the vote itself wasn't a cascade, it was a "information pooling" success triggered by the deferral.

  6.  **Addressing Limitations & Gaming:**

      *   *Goodhart's Law:* If they know the metric, they game it (e.g., writing fake unique reasons).
      *   *Audit:* Need random sampling, not just "feels wrong" sampling.
      *   *Human Judgment:* Some steps require the Chair to judge the *quality* of reasons, not just count them.

  7.  **Finalizing the Output Structure:**

      *   **Theory Check:** Validate the user's four points.
      *   **The Procedure:** "The Convergence Diagnostic." Numbered steps, thresholds, verdicts.
      *   **Case Studies:** Apply the diagnostic.
      *   **Limitations & Maintenance:** Gaming, audits, human element.
      *   **Tone:** Professional, direct, actionable.

  8.  **Self-Correction/Refinement during drafting:**

      *   *Constraint Check:* The user said "I can spend five minutes before a meeting and about ten minutes of meeting time." The procedure needs to fit this. I can't ask them to run complex simulations. The "Order Simulation" needs to be a heuristic, not a actual re-vote.
      *   *Constraint Check:* "Two of them are openly hostile to anything that looks like a formula." Keep the math simple (counts, not probabilities).
      *   *Constraint Check:* "One-page convergence note." I should describe what this note looks like.
      *   *Case 2 Sensitivity:* The user is the Chair. I need to be honest but polite. The procedure should reveal the risk without accusing them of malice.
      *   *Case 3 Nuance:* The user deferred because they thought it was piling on. It turned out there *was* private info. This suggests the "herding" fear was right, but the mechanism was "suppressed private info" rather than "ignoring private info." The deferral worked. I need to clarify this distinction.

  9.  **Final Polish:** Ensure American English. No citations. Clear headings.

  *(Self-Correction on Case 1)*: Wait, the prompt says "One of them had actually visited... everyone else had read the same three-page memo." This is a classic "Expert Deference" vs. "Cascade" blur. If the others ignored their own doubts because the Expert spoke, it's a cascade. If they genuinely agreed because the Expert's testimony outweighed the memo, it's rational deference. The diagnostic needs to separate these. The "Reasons" step is crucial here. Did they say "I agree with Sarah" or "Sarah's visit confirmed X in the memo"?

  *(Self-Correction on Case 2)*: Pre-votes 6-4. Final 10-0. That is massive drift (+4). This is the strongest signal of a cascade. I must be firm here.

  *(Self-Correction on Case 3)*: 9-1 Against. Chair deferred. 3 officers had private negative info. This means the 9-1 was actually *accurate* (the grantee was problematic), but the *process* was risky because the info wasn't shared until the deferral. The Chair's intervention prevented a "silent cascade" where the info might have stayed hidden.

