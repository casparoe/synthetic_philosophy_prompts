answer: |-
  ### I. The Correspondence Table

  The following table maps the source domain (Historical Obsolete Science) onto the target domain (Folk Psychology and Literary Practice) as your friend's argument requires them to align.

  | Feature | Source Domain (Humors / Phlogiston) | Target Domain (Folk Psychology / Fiction) |
  | :--- | :--- | :--- |
  | **The Posits** | Black bile, Phlogiston, Caloric fluid. | Beliefs, Desires, Intentions, Fears. |
  | **Observable Symptoms** | Fever, Combustion, Heat expansion. | Speech, Action, Facial expression, Writing. |
  | **Method of Access** | Inference from symptoms to hidden cause. | Inference (in life) / Stipulation (in fiction). |
  | **Predictive Failure** | Treatments fail; combustion calculations err. | (Alleged) Neural mismatch; behavioral prediction errors. |
  | **Successor Science** | Germ Theory, Oxidation Chemistry, Thermodynamics. | Mature Neuroscience / Cognitive Science. |
  | **Status of Posits** | Non-existent; nothing in the body matches them. | Non-existent; nothing in the brain matches them. |
  | **The "Quaintness"** | Old medical texts are historical curiosities. | Novels using belief-talk are historical curiosities. |

  ### II. Sorting the Disanalogies

  Not all differences between the source and target domains undermine the argument. Some are merely incidental. Below, I sort the candidates you provided into those that are **Noise** (compatible with the friend's conclusion) and those that **Do Work** (fatal to the analogy).

  **1. Theory vs. Skill/Practice (Theory-Theory vs. Simulation Theory)**
  *   **Verdict:** **Does Work.**
  *   **Reasoning:** If folk psychology is a *theory*, it can be falsified like phlogiston. If it is a *skill* (like knowing how to ride a bike) or a *constitutive practice* (like speaking a language), it cannot be "false" in the same way. You cannot discover that grammar does not exist; you can only fail to speak. If mentalizing is a capacity required to participate in human life, it survives even if the theoretical explanation of it changes. The friend's argument collapses if the vocabulary is not a theory but a medium of interaction.

  **2. Individuation (Causal Job vs. Content/Rationality)**
  *   **Verdict:** **Does Work.**
  *   **Reasoning:** Phlogiston was individuated by a causal role (stuff released in burning). Beliefs are individuated by *content* (believing *that* p) and *rational relations* (believing p implies not believing not-p). Neuroscience deals in causal roles (firing patterns). There is no guarantee that a system defined by rational content will map neatly onto a system defined by causal physics. If the definitions differ, the failure of one to reduce to the other does not prove the non-existence of the first. It proves they are different kinds of description.

  **3. Normative Work (Explanation vs. Responsibility)**
  *   **Verdict:** **Does Work.**
  *   **Reasoning:** Phlogiston explained combustion; it did not assign blame. Belief-talk supports promising, blaming, lying, and meaning. A successor science of neurons can explain why a hand moved, but it cannot explain why a promise was *broken*. If the vocabulary performs normative work that the successor science cannot perform, it cannot be retired without losing the capacity to hold agents responsible. The vocabulary is functionally indispensable, regardless of its ontological status.

  **4. Self-Refutation (Stating the thesis without the vocabulary)**
  *   **Verdict:** **Noise.**
  *   **Reasoning:** While it is difficult to argue against belief without assuming beliefs (e.g., "I believe eliminativism is true"), this is a logical annoyance for the philosopher, not a salvage for the novelist. Even if the argument is pragmatically self-defeating, it could still be true that beliefs are illusions. This disanalogy protects the philosopher's coherence, not the novelist's practice.

  **5. Useful Fiction (Retention without Reference)**
  *   **Verdict:** **Does Work.**
  *   **Reasoning:** We retain contour lines on maps despite knowing no such lines exist on the mountain. We retain "sunrise" despite knowing the earth turns. If a vocabulary is instrumentally useful, it is not retired simply because it lacks ontological depth. Phlogiston was retired because it *failed* to predict. If belief-talk succeeds at prediction (or interpretation), it survives as a useful fiction. The friend argues it fails; you argue it succeeds at a different task (meaning).

  ### III. Smuggled Assumptions in the Source Domain

  The analogy succeeds only if we accept the hidden premises of the source domain (obsolete science) as applicable to the target domain (mind/fiction). The source domain smuggles in three critical assumptions that the target domain lacks.

  **1. The Assumption of Predictive Primacy**
  In the source domain, a theory is introduced *solely* to predict observables. If prediction fails, the theory is junk.
  *   **The Smuggle:** This assumes the *only* job of mental vocabulary is to predict behavior.
  *   **The Reality:** In your practice, the job is *stipulation* (making behavior intelligible) and *interpretation* (deriving meaning). A novel does not fail if a character acts unpredictably; it fails if they act *meaninglessly*. The criteria for success are different.

  **2. The Assumption of Ontological Uniformity**
  In the source domain, the posit (humor) is supposed to be a physical constituent of the body, same in kind as the successor (germ).
  *   **The Smuggle:** This assumes beliefs must be physical constituents of the brain to be real.
  *   **The Reality:** Beliefs may be higher-order patterns (like the centre of gravity) that are real features of the system but not discrete physical parts. The absence of a "belief neuron" does not prove the absence of belief, any more than the absence of a "gravity particle" proves the absence of gravity.

  **3. The Assumption of Retirement by Replacement**
  In the source domain, when a theory is retired, it is discarded (we do not treat melancholy with leeches).
  *   **The Smuggle:** This assumes that if neuroscience explains the mechanism, the mentalistic description becomes obsolete.
  *   **The Reality:** Higher-level descriptions are often retained alongside lower-level explanations. We use chemistry without discarding cooking. We use neuroscience without discarding law. Retirement is not automatic upon the discovery of a micro-structure.

  ### IV. The Verdict

  Does the conclusion that your friend drew survive? **No.**

  The analogy fails to carry the weight of the conclusion. It conflates three distinct claims that must be separated. Here is the breakdown:

  **Claim 1: The posits (beliefs/desires) do not exist as discrete neural entities.**
  *   **Status:** **Plausible.**
  *   **Weight:** This is the friend's strongest point. It is highly likely that you will not find a specific "belief that the letter is in the drawer" located in a specific cluster of neurons in the way a tumor is located in tissue. If "exist" means "exist as a discrete physical object," the friend is likely right.

  **Claim 2: The vocabulary ought to be withdrawn from serious description.**
  *   **Status:** **False.**
  *   **Weight:** This does not follow from Claim 1. As established in the "Normative Work" and "Useful Fiction" disanalogies, the vocabulary performs tasks (responsibility, meaning, interpretation) that neural descriptions cannot perform. You cannot withdraw the vocabulary of value without ceasing to talk about human life. The vocabulary is not a failed prediction engine; it is a constitutive framework for agency.

  **Claim 3: The literary practice built on it is therefore on borrowed time (quaint).**
  *   **Status:** **False.**
  *   **Weight:** This is the critical failure of the friend's argument. Literature does not rely on the *predictive accuracy* of folk psychology (which is what science retires); it relies on the *intelligibility* of human action (which is what folk psychology constitutes).
      *   A humoral diagnosis is quaint because it is a *false explanation* of a physical process.
      *   A novel is not an explanation of a physical process; it is a *construction of a meaningful world*.
      *   Even if neuroscience explains the mechanism of the hand moving, it cannot explain the *tragedy* of the hand moving. The literary practice addresses the tragedy, not the mechanism. Therefore, the practice is not dependent on the truth of the theory, but on the utility of the language.

  **Final Judgment:** The friend's argument proves at most that beliefs are not *neural atoms*. It does not prove they are not *real patterns*, nor does it prove that the language describing them is obsolete. The conclusion that novels will seem quaint is unsupported. It confuses the *mechanism* of action with the *meaning* of action. Literature trades in meaning. Neuroscience trades in mechanism. The discovery of the mechanism does not render the meaning quaint.

  ### V. A Better Analogy

  The phlogiston analogy is destructive. It implies the vocabulary is a mistake. You need an analogy that preserves the friend's physicalism (the base is physical) while validating your practice (the description is real and necessary).

  **The Best Analogy: The Centre of Gravity.**

  *   **The Mapping:**
      *   **The Physical Base:** The distribution of mass in an object (Neuroscience/Brain).
      *   **The Posit:** The Centre of Gravity (Belief/Desire).
      *   **The Relation:** The Centre of Gravity is a real, calculable, indispensable feature of the object, but you will not find it if you cut the object open. It is not a "part" of the object; it is a property of the whole system.
      *   **The Successor:** Knowing the atomic structure of the object does not make talk of the Centre of Gravity "quaint." Engineers still use it. It is not a "false theory"; it is a higher-level abstraction that is objectively true relative to the physical base.

  *   **Why this preserves the Friend's View:** It grants that there is nothing *in the head* (just as there is nothing *in the wood*) that is the centre of gravity. It accepts the physicalist ontology.
  *   **Why this gives you back the Practice:** It validates the vocabulary as describing a real feature of the world, not an illusion. A novel describes the "centre of gravity" of a character's life. Neuroscience describes the mass. Both are true. The literary description is not retired by the physical description; it operates at a different level of resolution that is required for certain tasks (balance/narrative).

  **Alternative (Specific to Stipulation): The Queen in Chess.**
  *   **The Mapping:** The wood is the brain. The rules of chess are the folk psychology. The "power" of the Queen is the belief.
  *   **Why it fits:** The power of the Queen is not in the wood; it is stipulated by the rules. It is real within the game. Neuroscience studies the wood; Literature studies the game. You cannot reduce the game to the wood without losing the game.
  *   **Verdict:** Either analogy works, but **The Centre of Gravity** is stronger for "truth," while **The Queen in Chess** is stronger for "stipulation." Given your emphasis on stipulation, **The Queen in Chess** is the precise fit. It shows that the "power" (belief) is institutional and real, even if it isn't physical. The friend wants to say the power is an illusion. The analogy shows the power is *institutional fact*, which is not an illusion.

  **Recommendation:** Adopt **The Queen in Chess**. It directly counters the "quaintness" claim. We do not look back at old chess games and say, "How quaint that they thought the Queen could move diagonally, now that we know the wood is just cellulose." The rules are not competing with the physics; they are supervening on them. Your novels are records of the game, not failed physics textbooks.
