answer: |-
  You are operating with a coherent ethical intuition, but you have one major inconsistency that breaks your framework. You can keep three of your verdicts, but to have a clean, defensible principle for public history, **you must overturn your verdict on Case Two.**

  Here is the principle that ties your other three cases together, why Case Two violates it, and how it resolves the remaining waffles and the new scenario.

  ### The Principle: Epistemic Justice Over Bureaucratic Neutrality

  **The Principle:** *In public history, the archival record is not an objective referee; it is a product of power. When community memory conflicts with official records regarding violence, culpability, or meaning, public history must prioritize the testimony of the marginalized or affected community, unless that memory actively erases the suffering of a different, more vulnerable group.*

  This principle recognizes that archives (police reports, government surveys, harbor logs) often reflect the perspective of the state or the powerful, while collective memory often preserves the lived experience of those the state ignores or harms.

  ### Why You Must Overturn Case Two

  In **Case Three (The Founder)** and **Case Four (The Sacred Site)**, you intuitively side with the marginalized group (Indigenous communities) against the narrative of the powerful (Settlers/Government). In **Case Three**, you use the *record* because it exposes the power's violence. In **Case Four**, you lean toward *memory* because the record fails to capture the community's reality. In both, the goal is justice for the vulnerable.

  In **Case Two (The Diaspora)**, you abandon this. You privilege "declassified documents" (State power) over the Diaspora's memory (Victims/Marginalized) regarding state violence. This is inconsistent. State archives regarding state-sponsored violence are notoriously unreliable; they are designed to obscure intent. If you accept Indigenous oral history over government surveys in Case Four, you must accept Diaspora memory over state documents in Case Two.

  **The Fix:** In Case Two, the public history presentation should center the Diaspora's framing of "planned genocide" as the *experienced reality* of the event, while noting the archival ambiguity as evidence of state obfuscation. To demand the community adopt the state's "pogrom" framing to satisfy archival purity is to let the perpetrator define the terms of the crime.

  ### Resolving Your Waffle (Case Four)

  Apply the principle: **Memory wins on meaning; Record wins on mechanics.**

  In Case Four, the aerial photos (Record) prove the physical structures stood. The Elders (Memory) claim spiritual destruction. These are not contradictory facts; they are different *categories* of history. A public history site should present the physical evidence but explicitly validate the spiritual destruction as the historically significant truth for the community. The "destruction" is a historical fact of *experience*, even if not of *topography*. To privilege the photo over the Elder is to privilege colonial epistemology over Indigenous ontology. Your principle demands you stop waffling: **The exhibit must treat the spiritual destruction as historically valid.**

  ### The "Harmless" Myth (Case One)

  Your verdict on **Case One** stands. The fishing village's memory makes them heroes, but it harms no one (the sailors are dead; no group is being oppressed by the myth). This falls under the "unless" clause of the principle: memory is permissible when it serves cohesion *without* erasing the suffering of others. It is a "constitutive myth" rather than a "forensic lie."

  ### Prediction: The Museum Strike Case

  **The Scenario:** A national museum curating an exhibit on a labor strike. Union oral histories describe police violence; official police reports deny it.

  **The Prediction:** Under the principle of Epistemic Justice, **the exhibit must present the Union's version as the primary narrative of the event's impact.**

  Police reports are state documents created by the actors accused of violence; they are inherently suspect in the same way the government surveys in Case Four or the state documents in Case Two are. Oral histories from the workers capture the *lived experience* of the strike. A consistent public history approach does not treat these as "he said/she said" equal opposites. It treats the police reports as evidence of the *state's denial* and the oral histories as evidence of the *event's reality*.

  The exhibit should state: *"While official police logs record no violence, oral testimonies from striking workers describe a coordinated assault, a discrepancy common in labor disputes of this era where state force was under-reported."*

  ### Summary of Consistency

  1.  **Case 1 (Village):** Keep Verdict. (Memory serves cohesion, harms no one).
  2.  **Case 2 (Diaspora):** **Overturn Verdict.** (Do not privilege state documents over victim memory regarding state violence).
  3.  **Case 3 (Founder):** Keep Verdict. (Record exposes power's harm to the vulnerable).
  4.  **Case 4 (Sacred Site):** Resolve Waffle. (Memory defines the site's historical significance).
  5.  **Case 5 (Strike):** Union memory prevails over police records.

  By overturning Case Two, you align your practice with the core ethic of modern public history: **Archives preserve the logic of the state; Memory preserves the logic of the people. When they clash on questions of violence, side with the people.**
