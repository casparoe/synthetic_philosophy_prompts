  1. In a bakery with a 10-hour day, the shift from Before [c=50, v=5, s=5] to After [c=80, v=4.5, s=5.5] occurs because money wages hold steady while bread prices (1/3 pass-through of the bundle) halve, reducing the value cost $v$ while letting workers eat 50% more bread.

  2. Calculations show the exploitation rate ($s/v$) rises from 100% to 122%, organic composition ($c/v$) jumps from 10 to 17.7, profit rate ($s/(c+v)$) falls from 9.1% to 6.5%, and real wages rise via increased bread consumption.

  3. The first guy cites the falling $v$ and rising $c/v$ as proof of worker grinding via the reserve army, missing the real wage gain, while the second guy cites the falling $r$ as proof of profitability crisis via rising composition, ignoring the rising exploitation rate.

  4. The pass-through share of cheapened goods drives the $v$ reduction; if cranked to 100%, the collapse in $v$ surges $s$ enough to outpace the rise in $c$, potentially reversing the falling profit rate verdict.

  5. An immiseration wedded critic would argue the real wage gain is temporary until the reserve army disciplines labor back to subsistence, which attacks the dynamic stability of the assumption but not the static arithmetic presented.
