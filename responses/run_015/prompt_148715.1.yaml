answer: |-
  ### Seminar Architecture: The Incommensurability Problem

  #### 1. The Prerequisite Dependency: The Expectationalist Isomorphism
  Before you introduce the conflict, you must secure the framework they are about to break. Students cannot see the crack in the foundation if they don't trust the building.

  *   **The Concept:** Establish that standard moral uncertainty treats **moral theories** like **states of the world** in decision theory.
  *   **The Requirement:** They must accept the *Expectationalist Principle*: If I have credence $p$ in Theory A and $(1-p)$ in Theory B, I ought to maximize the weighted sum of the *choice-worthiness* assigned by each theory.
  *   **The Trap:** This works smoothly only if choice-worthiness is **cardinally comparable** across theories (i.e., Theory A's "utility units" can be mathematically exchanged for Theory B's "utility units").
  *   **Teaching Move:** Spend the first 15 minutes running a standard empirical risk case (e.g., "50% chance this pill cures cancer, 50% chance it does nothing"). Show the expected value calculation. Then swap "chance of cure" for "chance that Utilitarianism is true." Get them to nod at the isomorphism. *This nod is the dependency.* If they don't accept that moral uncertainty functions like empirical risk, the subsequent breakdown looks like a category error rather than a structural failure.

  #### 2. The Carrying Example: "The Preemptive Strike"
  Avoid the trolley problem; it invites intuition-pumping about mechanics rather than theory. Use a political/strategic case that highlights scale vs. constraint.

  *   **The Scenario:** You hold the launch codes. Intelligence suggests a foreign leader will order a nuclear strike in 24 hours, killing 10 million. The only way to stop it is to assassinate the leader now. However, the intelligence is not proof of intent, and the leader has not *yet* committed a punishable act.
  *   **Theory A (Lockean Rights):** Killing an innocent person (one who has not currently aggressed) is **lexically forbidden**. The disvalue is not a number; it is a veto. No amount of saved lives permits the violation.
  *   **Theory B (Longtermist Utilitarianism):** Value is aggregate lives saved. Killing 1 to save 10,000,000 is not just permissible; it is **obligatory**. The disvalue of the death is finite and outweighed.
  *   **The Uncertainty:** You assign 50% credence to Theory A and 50% credence to Theory B.
  *   **The Instruction:** "Calculate the expected choice-worthiness of launching the strike."

  #### 3. The Misconception Arc
  Students will attempt to rescue the Expectationalist Principle in three specific waves. Head them off in this order.

  **Wave 1: The Empirical Conflation**
  *   **The Thought:** "So you're 50% sure you'll kill an innocent? Just factor that into the outcome."
  *   **The Error:** They treat moral uncertainty as empirical uncertainty about *who* is innocent.
  *   **The Head-Off:** Freeze the facts. "Assume it is a metaphysical certainty that the leader is currently innocent. The uncertainty is not about the *victim*, it is about the *rule*. Theory A says the act is 'Forbidden.' Theory B says the act is 'Best.' How do you average a label and a number?"

  **Wave 2: The 'High Weight' Fallacy**
  *   **The Thought:** "Okay, so Theory A assigns negative infinity, or just a really, really big negative number. We can still calculate it."
  *   **The Error:** Treating lexical constraints as extreme aggregative values. If it's just a "really big number," then a big enough benefit (saving the universe) would eventually outweigh it. That contradicts the definition of *lexical*.
  *   **The Head-Off:** Force the definition. "If it's a big number, Theory A is just a form of consequentialism. Lexical means *no* finite quantity of good consequences can justify the act. If you assign it a finite value (even $-10^{100}$), you have misrepresented Theory A. If you assign it $-\infty$, see Wave 3."

  **Wave 3: The Normalization Fix**
  *   **The Thought:** "We just normalize the scales. Make the range of Theory A match the range of Theory B."
  *   **The Error:** You cannot normalize a scale that has no upper/lower bounds against one that does. Lexical theories lack the cardinal structure required for normalization.
  *   **The Head-Off:** Draw the number line. Theory B is a line segment. Theory A is a line with a hole in it (the forbidden region is inaccessible). "You cannot map a discontinuous function onto a continuous one without breaking the lexical constraint. If you normalize, you implicitly deny the lexical nature of Theory A."

  #### 4. The End-of-Session Check: The "NaN" Diagnosis
  Do not ask them to solve the problem (there is no consensus solution). Ask them to diagnose the mathematical failure.

  *   **The Task:** Hand them a decision matrix with the Preemptive Strike scenario.
      *   Row 1: Launch Strike.
      *   Row 2: Do Nothing.
      *   Columns: Theory A (50%), Theory B (50%).
  *   **The Prompt:** "Fill in the cells with the choice-worthiness values. Then, write down the Expected Value equation for 'Launch Strike.' If the equation cannot be written, write 'NaN' (Not a Number) and annotate exactly which operator fails."
  *   **Success Criteria:** They pass only if they identify that the **addition operator** ($+$) or the **multiplication operator** ($\times$) fails when interacting with the lexical value.
      *   *Fail:* "It's too hard to decide." (Misses the structural point).
      *   *Fail:* "You need more credence in one theory." (Misses the incommensurability).
      *   *Pass:* "We cannot multiply $0.5 \times \text{Forbidden}$ because 'Forbidden' is not a scalar," OR "We cannot add $\text{Finite} + \text{Lexical}$ because the ordering is non-Archimedean."
  *   **Why this works:** It proves they understand that the problem isn't *epistemic* (we don't know enough) but *formal* (the math doesn't type-check).

  #### 5. The Refused Machinery: Variance Normalization
  Explicitly tell the class you will **not** teach Variance Normalization (or Range Normalization).

  *   **The Reason:** This is the standard technical fix in the moral uncertainty literature (e.g., MacAskill) for handling different scales between utilitarian theories. It works by scaling theories based on the spread of their options.
  *   **The Refusal Script:** "You might look up 'Variance Normalization' later. It is the standard tool for making different moral theories comparable. I am forbidding you from using it here. Why? Because it assumes every theory assigns real numbers to every option. It forces lexical theories to pretend they are aggregative to make the math work. Using it solves the equation by deleting the lexical constraint. We are here to study the crash, not the patch."

  This architecture forces them to sit with the discomfort of incommensurability rather than rushing to a heuristic compromise.
