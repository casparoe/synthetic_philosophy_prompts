          *   *Error 2:* The "On Balance" condition. It's about the *counterfactual future*, not necessarily the *whole life to date*.
          *   *Error 3:* The Asymmetry contradiction. This is the big one.
      *   *Check:* Grade justification. Ensure the grade matches the critique.

  6.  **Final Polish:** Ensure the tone is encouraging but rigorous. (Upper-level seminar means they should know better than to contradict themselves in the final paragraph).

