answer: |-
  Hey everyone, welcome. Thanks for coming out on a Tuesday.

  I know the title of this workshop is "Locked In? Path Dependence Beyond the QWERTY Story," and I promise I'm not gonna spend the next seven minutes talking about typewriters. We all know the drill: someone pressed a key too fast, the arms jammed, and now we're stuck with a suboptimal keyboard layout forever. It's the classic example. But honestly, it's a bit too clean. It's too neat.

  When I look around this room, I see two groups who know that reality is messier than a keyboard. On one side, I've got philosophers of history who worry about contingency and inevitability. On the other, I've got engineers who maintain legacy banking systems. And let me tell you, there is no one who understands path dependence like someone who's trying to refactor COBOL code from 1974 that handles millions of dollars a day. You know that feeling where you can't delete a line of code not because it's useful, but because you don't know what breaks if you touch it. That's not just inefficiency. That's a trap.

  So, I want to propose a framing for the next couple of days. I want us to think about institutional history—and yeah, those banking regs—as a non-ergodic Markov process with absorbing barriers.

  I know, that's a mouthful. But stick with me.

  In statistics, a system is ergodic if the time-average of a single trajectory looks like the ensemble average. Basically, if I roll a die a hundred times, I get the same distribution as if a hundred people roll the die once. The path doesn't matter, only the probabilities. Most economic models pretend history is ergodic. They assume that if we rewind the tape of history, things basically converge to the same spot. Democracy, markets, specific regulatory frameworks—they treat them like gravity. Inevitable.

  But what if history isn't ergodic?

  Imagine a Markov chain where certain states are absorbing barriers. Once you enter them, you can't leave. You get stuck. In a non-ergodic system, early random fluctuations don't just fade out. They get magnified. A tiny glitch in the code, a random vote count error, a specific decision made by a tired clerk in 1929—it pushes the system into a basin of attraction that it cannot escape.

  For the engineers here, you know this. You've got dependencies that act like absorbing states. You didn't choose the architecture because it was the best one; you chose it because of a constraint ten years ago, and now you live in it.

  For the philosophers, here's the punchline. If history is non-ergodic, then asking counterfactual questions like "Would democracy have arrived anyway?" is actually malformed. It's a category error. Because if the system is path-dependent with absorbing barriers, there is no meaningful ensemble of worlds to average over. You can't say "in most possible worlds, we get this banking system." There is only the one trajectory we walked. The time-average of our actual society never converges to the ensemble average of all possible societies because the other societies are unreachable. They're behind the wall.

  This creates a real tension for us this week.

  If I say our current banking regulations are inevitable, I'm insulting the engineers who know how brittle this stuff is. I'm implying there's a historical gravity that doesn't exist. But if I say they're easily changeable, I'm insulting the reality of the absorbing barrier. We can't just refactor history like it's a sprint backlog.

  So where does that leave us? It means we have to accept that our current setup isn't fate, but it's also not flexible. It's locked in, not because it's optimal, but because the transition costs to get out of the absorbing state are prohibitively high. The barrier isn't logical, it's structural.

  I want this workshop to resist the urge to say "everything is contingent" so we can change it tomorrow, but also resist the urge to say "everything is determined" so we should stop trying. The truth is probably in that uncomfortable middle. The system is non-ergodic. We are on one path. We can't see the other paths because they don't exist anymore. But we can still look at the barrier in front of us and decide if we have the tools to break through it, or if we need to build a new room altogether.

  Anyway, thats the frame. I'm really excited to hear what you all come up with. Let's get into it.
