answer: |-
  1. **The Archive Setup**
  Dr. Halvorsen, I have forty years of field notebooks in a private shorthand I've mostly forgotten. I can't read most of them. Yet I want to say, "Everything in these notebooks is true." If truth is just a device to undo quotation marks—to let me say "Snow is white" instead of listing every white thing—what work is that word doing here? I can't undo the quotes because I can't read the sentences.
  *   *If she says it's a standing commitment to endorse each entry once decoded:*
      *   **Follow-up:** But endorsement is a psychological state I have *now*, about sentences I can't access. If I can't specify the sentences, isn't "true" acting as a placeholder for a property they possess, rather than just a logical shortcut for sentences I can actually produce?

  2. **The Normative Aim**
  We tell graduate students, "Assert only what is true." If "S is true" means nothing more than "S," aren't you telling them "Assert only what... you should assert"? That sounds empty.
  *   *If she says it means "Assert S only if S":*
      *   **Follow-up:** But I don't know if S yet. That's why I need the norm. If truth is just disquotation, it offers no guidance for inquiry, only a label for the finish line. How can it be a norm for *aiming* if it vanishes until I've already arrived?

  3. **Scientific Instruments**
  In seismology, we build instruments based on theories. They work. We explain this by saying the theories latched onto something real—they were true. If truth is that thin, doesn't the explanation collapse?
  *   *If she says the explanation is just "the theories predicted correctly":*
      *   **Follow-up:** But prediction is temporal. These theories work on instruments we hadn't even built yet. Saying "it predicts" describes the success, but "it's true" explains *why* it succeeds across new domains. If you remove the "link to reality" property, aren't you left with a miracle?

  4. **Gödel and Consistency**
  I've read that if you add a full truth predicate to arithmetic, you can prove arithmetic is consistent—something arithmetic can't do on its own. That looks like truth adding new content. How do you square that with saying truth is substantively empty?
  *   *If she says deflationists use a weaker, conservative truth predicate that doesn't allow those proofs:*
      *   **Follow-up:** So you sacrifice proving consistency to keep truth "thin." But does that weakened version still have the muscle to handle the generalizations we need in science and daily life, or have you trimmed it down to the point of uselessness?

  5. **The Norm of Error**
  When I make a mistake, I say, "I thought it was true, but it wasn't." If truth isn't a property, what did I lack? I asserted a sentence. The sentence exists. What went wrong?
  *   *If she says you asserted a sentence that wasn't the case:*
      *   **Follow-up:** But "wasn't the case" is just "not true" by your own lights. You're defining error using truth, and truth using assertion. Isn't this circular? Don't we need a substantive notion of "fitting the world" to explain what mistake actually *is*?

  6. **Novel Prediction**
  Let's go back to the instruments. A theory predicts a signal we've never seen before. We detect it. We say, "The theory was true." You say, "The theory was reliable." But reliability is past tense; truth seems to cover the future too.
  *   *If she says truth is just a device to generalize over future predictions:*
      *   **Follow-up:** Then truth is just a bet on reliability. But scientists act as if truth is the *reason* for the reliability. If you strip out the property, aren't you stripping out the explanatory force that justifies the funding and the risk?

  7. **Conservativeness vs. Generalization**
  You argued earlier that deflationary truth must be "conservative"—it can't prove new mathematical facts. But in my notebook case, I need truth to generalize over sentences I can't verify.
  *   *If she says generalization doesn't require proving new facts, just endorsing old ones:*
      *   **Follow-up:** But if the system is too weak to prove consistency, how do we know the generalizations don't lead to contradiction? If you can't guarantee the system is safe, can you really claim the logical device is doing all the work without a substantive safety check?

  8. **The Archive Paradox**
  Let's return to the notebooks. One entry in my shorthand says: "The claim about the 1998 aftershock sequence on p. 200 is not true." If I say "Everything in these notebooks is true," I seem to contradict myself. To avoid this, don't you have to restrict your equivalence schema to "grounded" or "meaningful" sentences?
  *   *If she says yes, we must restrict the schema to avoid paradox:*
      *   **Follow-up:** Then what determines if a sentence is grounded? Is that determination itself a substantive semantic property? If you need a substantive property to decide where your deflationary device works, haven't you just smuggled the substance in through the back door?

  \answer{Q8 — the groundedness follow-up}
