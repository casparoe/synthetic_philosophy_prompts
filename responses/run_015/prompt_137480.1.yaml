answer: |-
  This is a beautifully constructed dilemma. You have effectively trapped the "Transparency Account" of belief between the Scylla of intention's planning role and the Charybdis of pragmatic encroachment. Your intuition that (3) must be saved (pragmatic reasons are WKRs for belief) and (6) must be saved (pragmatic/structural reasons are RKRs for intention) is shared by most of the literature (e.g., Parfit, Kolodny, Wallace).

  The error lies in the generalization. You should **reject (4)**.

  Here is the diagnosis, the repair, and the cost.

  ### 1. Which Step to Reject: (4)

  Step (4) claims: *Nothing above is specific to belief. For any attitude A settling question Q, the reasons for A are the considerations bearing on Q.*

  This is the overgeneration engine. It assumes a normative isomorphism between belief and intention that does not exist. While both are attitudes that "settle questions," they settle them in categorically different ways, governed by different constitutive standards.

  *   **Belief** is governed by the **constitutive aim of truth**. To believe is to hold $p$ as true.
  *   **Intention** is governed by the **constitutive aim of successful agency** (which includes coordination, stability, and execution). To intend is to commit to making $p$ true.

  Because the aims differ, the "question settled" differs in structure, and thus the "right kind of reason" differs in source.

  ### 2. Why (4) Looked Sound

  (4) looks sound because of the **analogy of deliberation**. When I deliberate about belief ("Is $p$ true?") and when I deliberate about intention ("Shall I $\phi$?"), I am seemingly answering a question. It is tempting to think that *any* question-settling attitude must take its reasons from the answer to that question.

  However, this ignores the **direction of fit**.
  *   Belief has a **mind-to-world** direction of fit. The world is the standard. Reasons must track the world (truth).
  *   Intention has a **world-to-mind** direction of fit. The agent's will is the standard. Reasons can track the agent's needs (coordination, stability, reliance).

  Because intention is partly constitutive of the *future facts* it settles (via action), reasons for intention can include the *benefits of having settled* the question, not just the benefits of the settlement's content. Belief does not create its own truth (except in rare fragile cases), so reasons for belief cannot include the benefits of having settled the question.

  ### 3. Saving (1) and (3): The Belief-Specific Feature

  You asked: *If (1) survives, tell me which belief-specific feature carries the weight.*

  The feature is **Involuntarism grounded in the Constitutive Aim of Truth**.

  *   **The Feature:** You cannot believe at will. You cannot adopt a belief simply because you judge it good to have it. This is not a psychological limitation but a conceptual one: if you adopted an attitude *because* it was useful, you would not be believing; you would be accepting, hoping, or pretending.
  *   **How it does the work:** This feature blocks the slide from (4) to (5). Intention *is* voluntary (I can intend at will). Because belief is involuntary, pragmatic considerations cannot function as motivating reasons for belief. They cannot enter the deliberative perspective *as reasons for belief* because the attitude cannot be formed on that basis.
  *   **Does it beg the question?** It risks circularity if stated as "Pragmatic reasons are WKRs because you can't believe for pragmatic reasons." To avoid this, ground the involuntarism in the **normative standard**: Belief *purports* to represent reality. A consideration that does not track reality fails to meet the internal standard of the attitude, regardless of external utility. Intention *purports* to guide action. A consideration that facilitates guidance (even if not optimizing the action itself) meets the internal standard of the attitude.

  **Revised (1*):** For truth-aimed attitudes (belief), reasons must bear on the truth of the content. For action-aimed attitudes (intention), reasons bear on the success of the agency (which includes the value of the action *and* the value of the commitment).

  This preserves (3) without collapsing into (5).

  ### 4. The Complication: Fragile Considerations

  *Call a consideration fragile when it favours your having an attitude only on condition that it is not the consideration on which you hold it.*

  **Verdict:** Fragile considerations are **Right-Kind Reasons**.

  **Why:** A fragile consideration (e.g., "Believing I will succeed makes it true that I will succeed") is **evidence**. It bears on the truth of $p$. Therefore, by your own criterion (1), it is an RKR.

  **The "Fragility" Constraint:** The condition ("only if... not the consideration on which you hold it") describes a **causal/psychological constraint**, not a normative one.
  *   If you believe *because* it makes it true, you are responding to evidence. It is an RKR.
  *   The "fragility" arises because the causal mechanism of self-fulfillment often requires the belief to feel "authentic" or "evidence-based" to trigger the confidence required for success.
  *   This does not make the reason a WKR. It makes the *pathway* sensitive.

  **Does this block (4) to (5)?** Yes.
  *   For belief, a fragile consideration is an RKR *because* it makes $p$ true (it becomes truth-relevant).
  *   For intention, a consideration like "Others will rely on my intention" is an RKR for *intending*, even if it is not a reason for *$\phi$-ing*. Why? Because the "question settled" by intention is "Shall I commit to $\phi$?" The reliance bears on the *commitment*, not just the *act*.
  *   This confirms the disunity: Belief reasons track Truth; Intention reasons track Agency (which includes the structure of commitment).

  ### 5. What Does Rejecting (4) Cost?

  You asked: *What does rejecting it cost?*

  1.  **Normative Disunity:** You must abandon the hope for a single, unified theory of reasons for all attitudes. You cannot say "Reasons for X are always considerations bearing on the question X settles." You must say "Reasons for X are considerations bearing on the *constitutive aim* of X."
  2.  **Complexity in the "Question Settled":** You must accept that intention settles a more complex question than belief. Belief settles "Is $p$ true?" Intention settles "Shall I commit to $\phi$-ing?" The latter includes the *fact of commitment* as part of the object of evaluation.
  3.  **Fragile Beliefs:** You must accept that some pragmatic considerations *are* RKRs for belief (the fragile ones), but only because they cease to be purely pragmatic and become evidential. This requires a nuanced view of evidence (causal evidence vs. logical evidence).

  ### Summary Recommendation

  1.  **Keep (1), (2), (3), and (6).**
  2.  **Reject (4).** The logic of belief does not transfer to intention because belief is truth-aimed/involuntary, while intention is agency-aimed/voluntary.
  3.  **Replace (5)** with: "Intention settles the practical question whether to *commit* to $\phi$; so reasons for intending are reasons bearing on the value of the commitment (including coordination and reliance), not merely the value of $\phi$-ing."
  4.  **Classify Fragile Considerations as RKRs.** They are evidence. Their fragility is a causal feature of the self-fulfillment mechanism, not a normative defect.

  This saves your core intuition (pragmatic reasons are WKRs for belief) without forcing you to deny the planning role of intention. The price is accepting that the normative landscape is fragmented: the "Right Kind" depends on the "Kind of Attitude."
