      *   Better angle: Distinguish *object-given* vs *state-given* reasons. Fragile considerations are object-given (they affect the truth of $p$). Money is state-given (affects the value of believing).
      *   So, Fragile = RKR. Money = WKR.
      *   Does this block (4)->(5)? Yes, because for Intention, the "object" is the action. Reasons for intending that aren't reasons for acting are state-given relative to the action, but object-given relative to the *plan*.
      *   Okay, keep it simple. Reject (4). Belief is truth-aimed; Intention is action-aimed + planning-aimed.

  8.  **Final Polish:** Ensure the tone is collaborative and rigorous. Use the user's numbering. Explicitly answer "which step do you reject," "why," "what does it cost," and "what replaces (1)."

      *   *Step to Reject:* (4).
