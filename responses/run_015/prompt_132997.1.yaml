answer: |-
  Here is the specification for a theory of convention-generated obligation for outsiders.

  ### 1. The Cases (Coverage Requirements)
  The theory must generate distinct outputs for the following scenarios without ad-hoc adjustments:

  1.  **The Compliant Visitor:** Follows local norms. *Requirement:* Explain the source of the obligation (prudence? respect? duty?).
  2.  **The Non-Compliant Visitor:** Violates local norms. *Requirement:* Distinguish between *breaking* a convention and *breaking* a rule.
  3.  **The Ostentatious Complier:** Tips in a no-tip zone; queues where no one queues. *Requirement:* Explain how "over-compliance" can be a violation (disruption of equilibrium).
  4.  **The Quiet Resident:** A visitor who stays indefinitely. *Requirement:* Define the threshold where "visitor" obligations shift to "resident" obligations.
  5.  **The Mass Tourist:** One of 10,000 cruise passengers. *Requirement:* Address the point where the "visitor" group becomes large enough to *be* the local convention (demographic shift).
  6.  **Law vs. Convention:** Jaywalking (illegal but standard) vs. Queueing (legal but ignored). *Requirement:* Decouple legal liability from normative wrongness.
  7.  **Epistemic Ignorance:** The traveler genuinely cannot detect the norm. *Requirement:* Distinguish *blame* from *violation*.
  8.  **The Imported Norm:** A tip screen on a card machine in a no-tip country. *Requirement:* Identify who counts as the "local" when hardware imports a foreign convention.

  ### 2. The Distinctions (Structural Constraints)
  The theory must not collapse the following pairs. It must be able to state that X is true while Y is false.

  1.  **Convention vs. Law vs. Morality:** [NN] A thing can be legally required, conventionally forbidden, and morally neutral (or vice versa).
  2.  **Reason vs. Requirement vs. Blame:** [NN] You can have a *reason* to comply without being *required* to, and be *required* without being *blameworthy* for failure (e.g., ignorance).
  3.  **Coordination vs. Respect vs. Tax:** [NN] The theory must distinguish whether the norm exists to solve a coordination problem, signal respect, or extract rent from outsiders.
  4.  **"Locals" vs. "The Place":** [NN] Distinguish between the habits of the current population and the institutional norms of the location (e.g., staff policies vs. customer behavior).
  5.  **Wrong to Person vs. Wrong to Practice:** [NN] Distinguish between harming a specific individual (the waiter) and harming the system (the tipping equilibrium).

  ### 3. The Empirical Constraints (Social Science Compatibility)
  The theory cannot contradict established mechanics of social norms:

  1.  **Arbitrariness:** [NN] The content of the convention is contingent; the stability is the value. The theory cannot argue one side of the coordination equilibrium is intrinsically better.
  2.  **Defection Thresholds:** [NN] Conventions shift when enough people defect. The theory must account for the fact that visitors *can* change norms, even if they *shouldn't*.
  3.  **Epistemic Asymmetry:** [NN] Tourists are bad at reading cues; locals are bad at noticing tourist noncompliance. The theory cannot assume perfect information.

  ### 4. Sorting and Tensions

  **Non-Negotiable (NN):**
  *   **Convention vs. Law vs. Morality:** If the theory conflates these, it cannot handle the jaywalking case.
  *   **Reason vs. Requirement vs. Blame:** If the theory conflates these, it cannot handle the ignorance case.
  *   **Arbitrariness:** If the theory argues the local way is "better," it fails the game-theory constraint.
  *   **Wrong to Person vs. Practice:** Essential for the tipping case (harming the system vs. the individual).

  **Prejudice Dressed as Requirement (P):**
  *   **"The theory should track what hosts actually resent":** [P] This is a demand for descriptive accuracy masquerading as normative theory. Hosts often resent things they have no right to enforce, or fail to resent things that damage them. A normative theory must critique resentment, not just mirror it.
  *   **"The theory shouldn't just rubber-stamp whatever the locals happen to do":** [P] This is your moral preference for a critical standpoint. While valid for a *moral* theory, a theory of *convention* must explain why the local convention has pull even when you dislike it.

  **The Genuine Tension:**
  You asked if the conflict between "track host resentment" and "don't rubber-stamp locals" is laziness. **It is a genuine conflict in the spec.**
  *   *Side A (Phenomenology):* Obligation is social. If the host doesn't feel bound, neither should you. If they resent it, you owe it.
  *   *Side B (Normativity):* Obligation is critical. Hosts can be wrong about their own norms (e.g., exclusionary practices).
  *   *Verdict:* You cannot satisfy both fully. A theory that tracks resentment is descriptive; a theory that critiques norms is prescriptive. You must choose whether you are building a **Sociology of Travel** or an **Ethics of Travel**.

  ### 5. The Single Most Exclusionary Requirement
  **Reason vs. Requirement vs. Blame.**
  This triad rules out the most candidate theories.
  *   Simple Coordination theories collapse Reason and Requirement (if it helps coordinate, you must do it).
  *   Simple Moral theories collapse Requirement and Blame (if you broke the rule, you are bad).
  *   Only a robust normative theory can explain why you might have a *reason* to queue (coordination), be *required* to queue (social contract), but not be *blameworthy* for failing (ignorance).

  ### 6. Theory Evaluation

  **1. Standard Coordination Account (Lewisian)**
  *   **Performance:** Fails.
  *   **Failure Point:** It explains *why the convention exists* (arbitrary equilibrium), but it cannot explain why an *outsider* is bound by it. If you aren't part of the recurring game, you have no reason to coordinate. It silently fails to answer the question of *obligation*, only explaining *stability*.

  **2. "You're a Guest, So Defer" (Hospitality Ethics)**
  *   **Performance:** Fails.
  *   **Failure Point:** It collapses the **Quiet Resident** case. It cannot define when "guest" status ends. It also struggles with the **Imported Norm** case (who is the host when the software is American?). It treats the obligation as relational (host-guest) rather than structural (participant-practice).

  **3. Friend's "Normative Squatters' Rights"**
  *   **Performance:** Partial Pass.
  *   **Failure Point:** It handles the **Queue** case well (don't create new equilibria) but fails the **Imported Norm** case. If the card machine is the "squatter," does the visitor now owe a tip? It also struggles with **Mass Tourism**; if 10,000 visitors arrive, they are the new squatters. It treats conventions as property rights, which breaks down when the "property" is a behavior.

  **4. Crude Rule-Consequentialism ("What if every visitor did that?")**
  *   **Performance:** Fails.
  *   **Failure Point:** It contradicts **Arbitrariness**. It implies the *content* of the rule matters (bad outcomes) rather than the *coordination* itself. It also fails the **Ostentatious Complier** case; if everyone tipped in a no-tip country, the convention would shift, so universalizing the action doesn't necessarily produce a "bad" consequence, just a *different* equilibrium. It cannot explain why the *current* equilibrium is binding before the shift happens.
