      *   *Layer 2 (Functional):* What matters is the causal role, not the stuff. (Functionalism)
      *   *Layer 3 (Metaphysical):* The mind can exist independently of the brain. (Substrate Independence)
      *   *Layer 4 (Identity):* Continuity of pattern = Continuity of self. (Psychological Continuity/Patternism)
      *   *Potential Error:* Confusing the specific physical instance (token) with the general kind (type).

  3.  **Drafting the Four Claims (Iterative Process):**

      *   *Claim 1: The Causal/Computational Claim.* The brain computes. It takes input, processes, gives output. This is mostly uncontroversial in cognitive science. It's a "platitude" in the sense that almost everyone agrees the brain processes information.
      *   *Claim 2: The Multiple Realizability Claim.* The same computation can run on different stuff. Silicon vs. Carbon. This is the core of Functionalism.
      *   *Claim 3: The Substrate Independence Claim.* The *mind itself* doesn't care what it's made of. This is stronger than Claim 2. Claim 2 says the *process* can be replicated; Claim 3 says the *phenomenal experience* travels with the process.
      *   *Claim 4: The Pattern Identity Claim.* "You" are the pattern, not the matter. This is what justifies the "it's still me" conclusion in the gradual replacement scenario.

      *Refining for the User:* Let's make these distinct levels of commitment.
      1.  *The Weak Claim (Information Processing):* Brains do computations. (True/Platitude).
      2.  *The Functionalist Claim (Causal Roles):* Mental states are defined by what they do, not what they are made of. (Philosophical commitment).
