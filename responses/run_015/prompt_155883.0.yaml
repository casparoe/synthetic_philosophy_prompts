  4.  **Addressing the "False/Confused" Aspect:**
      *   *Token vs. Type:* This is crucial.
      *   *Type Identity:* "Pain is C-fiber firing." (False if functionalism is true).
      *   *Token Identity:* "This specific instance of pain is this specific firing."
      *   *The Confusion:* The slogan often implies that because the *type* of computation can be replicated, the *token* instance of consciousness transfers. But is the *token* the same? If I copy the software to a new computer, is it the same running instance? (The Copy Problem).
      *   *Hardware/Software Dualism:* The slogan risks implying a dualism (Cartesian) where the "software" is a ghostly non-physical thing. But software is physical (magnetic states, voltage). So it's not truly dualist, but it *feels* like it.

  5.  **Addressing the Gradual Replacement Scenario:**
