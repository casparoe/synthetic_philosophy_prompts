prompt: |-
  Hey philosophers — retired marine biologist here, just started reading philosophy of mind after retirement and now I'm stuck on this uploading debate. There's this phrase everyone throws around: 'the brain is just hardware running mind-software'. I keep seeing it used to defend gradual replacement, like swapping neurons for silicone chips one by one and claiming you stay the same person. But that slogan feels like it's hiding at least four different claims. Can you separate them out for me? Like which ones are just platitudes about information processing, which ones commit you to full-blown functionalism or substrate independence, and which ones actually do the work in saying the hybrid half-silicone brain still counts as 'me'? I also want to know which readings are actually false — for instance, does it confuse token identity with type identity? And please, no reading lists, I'm not going back to school. I just want a menu of interpertations I can bring to my philosophy meetup where we argue about whether my gradute grandson's AI project will eventually upload his consciousness. Sorry if there's a typo in here, my fingers are rusty.
