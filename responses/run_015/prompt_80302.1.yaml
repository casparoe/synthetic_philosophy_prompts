      *   **Problem:** Most historical cases show high compliance, so both theories predict the same outcome (no discrimination).
      *   **Task:** Create a thought experiment (one paragraph) where the two theories predict *different* outcomes.
      *   **Constraints:**
          *   Historically plausible for a mobile killing unit in occupied Poland, 1942.
          *   No exotic devices, no "what if Hitler showed up."
          *   The split must turn on one specific, real feature of the social situation.
          *   The "transfer option" is the obvious candidate but I can pick my own (though the prompt hints it's the lever to use or avoid using cleverly).
          *   Must not quietly assume the dispositional account's picture of motives is realistic.
          *   After the scenario: Explain what each account says and why, identify the single feature doing the work, explain what happens if removed, and how the losing side would attack the case.
          *   Length: One paragraph for the scenario, then the analysis.

  2.  **Deconstruct the Theories:**
      *   **Goldhagen (Dispositional/Ideological):** Ordinary Germans were "eliminationist antisemites." They wanted to kill Jews. Given the chance, they would volunteer or comply enthusiastically because it aligns with their deep-seated beliefs. Pressure isn't needed; motivation is internal.
      *   **Browning (Situational/Ordinary Men):** Ordinary men killed due to peer pressure, obedience to authority, careerism, brutalization, and the difficulty of saying no. They didn't necessarily want to kill, but the situation made it harder not to. If the situation changes (less pressure, easier out), compliance drops.

  3.  **Brainstorming the Divergence:**
