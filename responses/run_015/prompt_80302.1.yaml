      *   Actually, Goldhagen's main counter to Browning is that the transfer option *was* available and rarely taken. So in this thought experiment, Goldhagen would argue that even with anonymity, the ideological drive outweighs the relief. His attack would be that the scenario underestimates the *volitional* nature of the killing.
