      *   **Goldhagen (Dispositional):** Predicts high compliance (few opt out). Why? Because the motive is internal "eliminationist antisemitism." The barrier isn't social shame; it's just following their will. A private exit doesn't change their desire to kill Jews.
      *   **Browning (Situational):** Predicts significant opt-out. Why? Because the barrier was peer pressure and the social cost of refusing in front of comrades. Remove the audience, remove the shame, and ordinary human aversion to killing takes over.
      *   **Single Feature:** The *anonymity/private nature* of the opt-out (removing peer surveillance).
      *   **If Removed:** If the opt-out remains public (step aside), Browning predicts high compliance (due to shame), converging with Goldhagen. This explains why historical cases (RB 101) look like Goldhagen wins—they didn't isolate the variable.
      *   **Goldhagen's Attack:** He would argue the "private" offer doesn't remove the internalized ideological pressure. Men fear being seen as "weak" even by themselves, or they believe the commander is testing their loyalty. He might claim the "logistical necessity" cover is transparent and men know they are still being judged by the authority figure, preserving the coercive hierarchy.

