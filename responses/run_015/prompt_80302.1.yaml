      *   *Problem with Transfer Option:* Historically, the transfer option *was* available in Reserve Police Battalion 101, and few took it. This supports Goldhagen (or a strong situational view where peer pressure is overwhelming). I need a scenario where Browning predicts refusal *despite* the order, or where Goldhagen predicts compliance *despite* a lack of pressure.
      *   *Wait, the prompt asks for:* Dispositional predicts most go along; Situational predicts a lot decline/take an out.
      *   *So:* I need a situation where the *situational pressures* are weakened or altered such that Browning says "now they won't kill," but Goldhagen says "they still will because they want to."
      *   *Feature:* The "Transfer Option" is the classic lever. In RB 101, Major Trapp offered the option. Few took it. Goldhagen says: See? They wanted to. Browning says: The option was socially costly (peer pressure).
      *   *To make them diverge:* I need to reduce the *social cost* of the out, without removing the order itself.
      *   *Idea:* What if the unit is fragmented? Or the authority figure is absent? Or the task is individualized vs. collective?
