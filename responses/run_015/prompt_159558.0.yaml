answer: |-
  This is a sharp observation. You have identified a gap in the standard taxonomy of moral psychology. The literature typically assumes that if your beliefs about agency and facts remain constant, your reactive attitudes (like resentment) should remain constant. You are describing a case where the *normative uptake* changes without the *factual substrate* changing.

  Let's test the existing tools against this shape to see why they break.

  ### Candidate 1: The Strawsonian "Objective Attitude"
  This is the one you half-remembered. P.F. Strawson distinguished between "reactive attitudes" (resentment, gratitude, indignation) which we hold toward moral agents, and the "objective attitude," which we hold toward objects, patients, or those incapable of responsibility (e.g., the very young, the severely mentally ill).

  **Why it knocks out:**
  Strawson's Objective Attitude is fundamentally a form of withdrawal. To take the objective stance is to step out of the interpersonal relationship and view the other as something to be managed, cured, or avoided. In your cases, the husband is not withdrawing. He is staying in the marriage, planning a future, and coordinating finances. He is using the "objective" frame *to facilitate* the relationship, not to exit it. Furthermore, Strawson implies the objective stance is forced upon us by the recognition of incapacity. Your clients switch voluntarily for pragmatic reasons (tax season, a funeral). The Strawsonian view cannot account for a voluntary, temporary, relational form of objectification.

  ### Candidate 2: Compartmentalization
  This is the psychological intuition that the husband is keeping two contradictory beliefs in separate boxes: "She is a responsible agent who wronged me" and "She is a victim of circumstance who needs help."

  **Why it knocks out:**
  Compartmentalization requires cognitive dissonance or inconsistency. You've verified that the beliefs are *not* contradictory. He believes *both* that she is responsible *and* that her childhood caused her fear, simultaneously, in both frames. The data doesn't change. Compartmentalization explains how we hold inconsistent truths; it does not explain how we hold consistent truths but alter their *normative weight*. In the second frame, he isn't hiding the truth of her agency; he is choosing not to *enforce* it.

  ### Candidate 3: Emotional Regulation (Suppression/Reappraisal)
  This suggests the husband still feels the anger but is using cognitive tricks to dampen the physiological response. He is "calming himself down."

  **Why it knocks out:**
  You noted that in the second frame, the anger feels *inappropriate* to him. This is crucial. If he were merely regulating emotion, he would feel the anger but judge it *inconvenient*. Instead, he judges it *incorrect*. He has shifted his assessment of what the situation *calls for*. In the first frame, the situation calls for accountability. In the second, it calls for maintenance. This is a shift in judgment, not just a shift in arousal. Emotional regulation manages the heat; your clients are changing the thermostat's setting.

  ### Candidate 4: Forgiveness
  This is the natural candidate for "stopping anger while staying in a relationship."

  **Why it knocks out:**
  Forgiveness is typically understood as a settlement. It resolves the debt. If you forgive, you do not reserve the right to resurrect the resentment when it becomes convenient, nor does the anger typically return unbidden years later because of a new detail. Forgiveness changes the history of the relationship. What you are describing does not change the history; it merely suspends the collection of the debt. It is a moratorium, not a pardon.

  ***

  ### The Carving
  Since existing labels fail, we need to carve this out by its function and its limits.

  The phenomenon is a **volitional shift in normative framing**. The agent keeps the factual beliefs constant (she did it, she could have done otherwise, she is responsible) but voluntarily suspends the *claim* that usually accompanies those beliefs (that she owes me repair).

  This is done for pragmatic relational maintenance. It treats the partner's moral agency as a variable that can be toggled between "active" (demanding accountability) and "passive" (managing risk) depending on the external pressures on the relationship system.

  **Boundary Cases:**
  1.  **Enabling vs. Bracketing:** Where is the line? If the "flip" becomes the default state permanently, it ceases to be a bracket and becomes a delusion or enabling. The concept requires the *potential* for the reactive attitude to return. If the anger never comes back, it has morphed into acceptance or resignation.
  2.  **Self-Deception:** If the client starts believing the "pipe" story is the *whole* truth (i.e., she really couldn't help it), they have slipped from bracketing into belief change. The concept holds only as long as the client acknowledges, implicitly or explicitly, that they are choosing a frame for utility.
  3.  **Manipulation:** If the flip is used not to preserve the relationship but to avoid conflict while planning an exit, it is not this phenomenon. This concept requires the intent to sustain the cooperative union.

  ### The Belief-Change Counterfactual
  You asked what would have to be true for you to be wrong about this not being a change of belief.

  For this to be a change of belief, the husband would have to undergo a metaphysical shift in how he views her agency. In the "pipe" frame, he would have to genuinely believe: *"Given her childhood trauma, it was determined that she would lie. She could not have done otherwise."*

  **How to tell the two apart from the inside:**
  The diagnostic test is the **return of resentment upon new evidence.**

  *   **In the Belief-Change Scenario:** If he truly believes she *could not* have done otherwise (deterministic excuse), then discovering a *new* lie should not trigger anger. It would only confirm the diagnosis of her incapacity. You might feel sadness or frustration, like a mechanic finding a new leak in an old car, but not moral indignation.
  *   **In the Flip Scenario:** Because the belief in her agency is merely suspended, not deleted, new evidence of *malice* or *calculation* (e.g., she spent the money on a secret affair rather than fear-based hoarding) will puncture the frame. The anger returns instantly and violently.

  The "flip" is fragile; belief change is robust. If the anger comes back because the *nature* of the wrong changed (not just the magnitude), it proves the belief in her agency was waiting in the wings the whole time. He wasn't convinced she was a pipe; he was just treating her as one for the sake of peace.

  ### The Receipt
  You are looking for a term that captures the voluntary, temporary, and functional suspension of moral demand without the surrender of moral truth.

  The concept is **Volitional Normative Bracketing**.
