  DEPARTMENT FOR TRANSPORT: MOTORWAY CODE SUPPLEMENT 7(B)
  **PROCEDURES FOR THE TEMPORALLY DISORIENTED MOTORIST**

  1. **Eligibility and Recognition:** This protocol applies solely to motorists who, through no fault of negligence, cannot distinguish between sequential junctions nor recall having passed them. If you simply missed the sign due to inattention, consult Section 4 on Careless Driving. If you genuinely cannot tell Exit One from Exit Two due to structural amnesia, proceed immediately to Clause 2. Do not attempt to guess based on scenery; the landscape is designed to be identical.

  2. **The Pre-Voyage Pact:** Before engaging the engine, you and your Satnav must agree upon a fixed probability of exit, denoted as $p$. This figure is calculated to maximise your welfare from the driveway, not the hard shoulder. Once set, this probability constitutes a binding contract between your present self and your future selves at every junction. You are not merely driving; you are executing a programme agreed upon by a smarter version of yourself who still knew where they were.

  3. **The Stochastic Manoeuvre:** Upon approaching any indistinguishable exit, you are required to generate a random number between zero and one. If this number is less than $p$, you must exit. To the untrained observer, this coin-tossing may resemble indecision or cowardice. It is not dithering; it is optimal mixing. Deliberate randomisation is the only rational response to perfect indistinguishability. A deterministic rule would be exploited by your own forgetfulness, leading to systematic failure.

  4. **Prohibition on Recalculation:** Upon arriving at an exit, you may feel tempted to reason, 'I am here, therefore I am likely at the second junction.' You must suppress this intuition rigorously. Updating your belief based on mere arrival is a logical error known as 'temporal inconsistency.' Your Satnav represents your wiser, planning self; do not argue with it simply because you are now tired, confused, and tempted to optimise locally. The plan remains optimal even if you feel otherwise. The clash between your planning self and your acting self must be resolved in favour of the planner.

  5. **Identity of Decisions:** You may ask, 'Is this decision distinct from the one at the previous exit?' The official answer is no. You are the same driver, in the same state, making the same choice. To change your strategy now is to betray the driver who started the journey. Consistency requires you to ignore the temptation to re-evaluate at the expense of the global plan. If you change your mind, you admit you are no longer the rational agent who departed.

  **Troubleshooting FAQ**

  **Q: Is flipping a coin not just incompetence masquerading as strategy?**
  A: No. In conditions of perfect forgetfulness, deterministic rules fail to maximise payoff. Randomisation is a feature of high-level rationality, not a bug of cowardice. Embrace the chaos. To refuse the coin is to claim certainty where none exists.

  **Q: What if I decide to ignore the coin and stay on?**
  A: You have effectively become a new agent with different preferences. The original plan is void. You are now merely lost, not strategically absent-minded. Pull over. You cannot renegotiate the treaty mid-voyage simply because the terms feel uncomfortable at the junction.

  **Q: Why does the Satnav sound unsure when it says 'possibly exit'?**
  A: It is not unsure. It is adhering to a mixed strategy designed before you forgot where you were. Trust the algorithm, not your intuition. Your intuition is the cause of the problem. The uncertainty lies in your memory, not the machine.
