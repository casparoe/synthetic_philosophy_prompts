answer: |-
  ### The Non-Ordinary Goods Filter (NOGF)

  **Purpose:** To determine whether a proposed transaction involving non-standard goods (body parts, civic rights, emergency resources, etc.) is permissible for the health system to facilitate.
  **Time Limit:** 30 Minutes.
  **Users:** Compliance Staff (No philosophy training required).
  **Output:** A recommendation of ALLOW, BAN, REGULATE, or HAND-OFF for the Ethics Committee.

  ---

  #### Step 0: The Legal Floor (5 Minutes)
  **Question:** Is this transaction explicitly prohibited by federal or state statute (e.g., National Organ Transplant Act, anti-kickback statutes)?
  **Plain-Language Test:** "If a reporter asked a federal agent about this deal, would the agent reach for handcuffs or a fine book immediately?"
  *   **If YES:** Stop. Recommendation: **BAN**. (Note: Flag for Legal Counsel immediately).
  *   **If NO or UNCLEAR:** Proceed to Step 1.

  #### Step 1: Alienability (The "Ownership" Test) (5 Minutes)
  **Question:** Is this the kind of thing a person has the authority to sell or trade away, even if they want to?
  **Concept:** Some rights are so tied to personhood or civic function that selling them destroys the system they belong to.
  **Plain-Language Test:** "If everyone were allowed to sell this, would the system this good belongs to stop working?" (e.g., If votes are sold, democracy breaks. If kidneys are sold, the poor become spare parts).
  *   **If YES (System Breaks):** Stop. Recommendation: **BAN**. (The harm of the market outweighs the harm of prohibition).
  *   **If NO (System Holds):** Proceed to Step 2.

  #### Step 2: Commodification (The "Billboard" Test) (5 Minutes)
  **Question:** Does attaching a price to this change what the good *is* or damage the relationship around it?
  **Concept:** Distinguish between *pricing* a thing (renting a room) and *corrupting* a thing (paying a friend to listen to your problems).
  **Plain-Language Test:** "Would we be embarrassed to put the details of this transaction on a billboard in the hospital lobby? Does paying for this turn a duty or gift into a service in a way that feels wrong?"
  *   **If YES (Embarrassing/Corrupting):** Proceed to Step 4 (Do not stop yet; sometimes necessary corruption is tolerated).
  *   **If NO (Neutral):** Proceed to Step 3.

  #### Step 3: Exploitation (The "Walk-Away" Test) (5 Minutes)
  **Question:** Is the person providing the good doing so because they lack a decent alternative?
  **Concept:** Distinguish *unfairness* (bad price) from *exploitation* (no choice).
  **Plain-Language Test:** "If the provider had a middle-class income and good insurance, would they still be offering this?"
  *   **If NO (They are desperate):** This is high-risk exploitation. Proceed to Step 4.
  *   **If YES (They have options):** Low-risk. Proceed to Step 4.

  #### Step 4: Consequence of Prohibition (The "Underground" Test) (5 Minutes)
  **Question:** If we say "No," does the trade happen anyway without our safeguards, causing more harm?
  **Constraint:** This step **cannot** override a "BAN" from Step 1 (Alienability). It only applies to goods that are technically sellable.
  **Plain-Language Test:** "If we walk away, does the patient/provider go to a less safe market, or do they go without a essential good?"
  *   **If YES (Harm increases without us):** We may need to facilitate this to manage the risk. Recommendation: **REGULATE** (Allow with strict safeguards).
  *   **If NO (Harm decreases or stays same):** Recommendation: **BAN**.

  #### Step 5: The Hand-Off (Remaining Time)
  **Question:** Have we answered the above with confidence, or is this a clash of values?
  **Instruction:** If Step 2 (Billboard) or Step 3 (Walk-Away) produced conflicting answers among your team, do not average them.
  **Action:** Recommendation: **HAND-OFF**.
  **Note to Committee:** "The procedure identified a value conflict at Step [X]. Facts are established, but the ethical weight is disputed."

  ---

  ### Application to Proposals

  #### Case 1: $20,000 Payment for Directed Living Kidney Donation
  *   **Step 0 (Legal):** Federal law (NOTA) prohibits valuable consideration for organs. While "directed donation" is legal, *payment* is not.
      *   *Result:* **BAN**.
  *   **Step 1 (Alienability):** Even ignoring law, can a person sell a kidney? If everyone could, the poor become inventory. The system of donation-as-gift breaks.
      *   *Result:* **BAN**.
  *   **Step 3 (Exploitation):** If the donor had a middle-class income, would they sell a kidney for $20k? Unlikely. This targets desperation.
      *   *Result:* High Risk.
  *   **Step 4 (Consequence):** Would banning push it underground? Yes, but the health system cannot facilitate illegal/ethically barred acts to manage underground markets. Step 1 overrides Step 4.
  *   **Procedure Output:** The procedure stops at Step 0/1. The "Underground" argument is not decisive here because the good is non-alienable.
  *   **Alignment:** Agrees with your prior.

  #### Case 2: 300% Contract Price for Ventilators/N95s (Emergency)
  *   **Step 0 (Legal):** Generally legal during emergencies, though subject to anti-gouging statutes depending on state. Assume legal for this exercise.
      *   *Result:* Proceed.
  *   **Step 1 (Alienability):** Can medical supplies be sold? Yes. The market for tools does not break if prices fluctuate.
      *   *Result:* Proceed.
  *   **Step 2 (Commodification):** Does paying more change the ventilator? No. Does it change the hospital? It makes us look like we are fueling gouging. Billboard test: "We paid 3x normal rate" looks bad, but "We saved patients" looks good.
      *   *Result:* Ambiguous (Proceed to Step 4).
  *   **Step 3 (Exploitation):** Is the *seller* desperate? No, they are profiting. Is the *buyer* (us) desperate? Yes. This is reverse-exploitation (duress).
      *   *Result:* High Risk.
  *   **Step 4 (Consequence):** If we say "No" (refuse to pay), do patients die? Yes. We cannot source elsewhere. The harm of prohibition (death) outweighs the harm of facilitation (reputational cost/normalizing gouging).
      *   *Result:* **REGULATE**. (We must buy, but we document the necessity, report the vendor to authorities if applicable, and cap the policy to declared emergencies only).
  *   **Alignment:** Resolves your "torn" feeling by prioritizing Step 4 (Patient Harm) over Step 2 (Reputation), but mandates safeguards.

  #### Case 3: $100 Gift Cards for Voting in Health Bond Election
  *   **Step 0 (Legal):** Likely violates election laws (vote buying).
      *   *Result:* **BAN**.
  *   **Step 1 (Alienability):** Can a vote be sold? If everyone sold votes, the election result reflects wealth, not will. The democratic system breaks.
      *   *Result:* **BAN**.
  *   **Step 4 (Consequence):** If we ban this, does voting go underground? No, people just vote without payment. The "Underground" test does not justify overriding Step 1.
      *   *Result:* **BAN**.
  *   **Alignment:** Agrees with your suspicion.

  ---

  ### Analysis of Disagreements
  The procedure aligns with your priors on the Kidney and Voting cases. On the Ventilator case, you noted you were "torn." The procedure forces a resolution: it classifies this as **REGULATE**. It acknowledges the reputational risk (Step 2) but dictates that when the alternative is patient harm (Step 4), the transaction must proceed under strict constraints. If you believe the reputational risk is so high it threatens the system's ability to function long-term, you would invoke Step 5 (HAND-OFF) to let the Ethics Committee weigh "Immediate Patient Life" vs. "Long Term Institutional Trust."

  ### Honest Limitations
  *   **Step 2 (Billboard Test):** This is subjective. One person's "embarrassing" is another's "pragmatic." The procedure admits this by allowing a HAND-OFF if the team splits.
  *   **Step 4 (Underground Test):** This requires intelligence you may not have. You are guessing about black markets. The procedure requires you to document *why* you think the trade will go underground, not just assert it.
  *   **Legal vs. Ethical:** Step 0 creates a hard stop. Sometimes ethical innovation requires testing legal boundaries. This procedure is conservative; it will not help you find a legal loophole, only navigate ethical gray areas within the law.

  Verdict: BAN, REGULATE, BAN
