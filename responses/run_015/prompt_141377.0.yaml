  1. **Agreed Framework and Fixed Facts**
      1.  **Counterfactual Definition:** We agree to evaluate the **Runner-Up Substitution** scenario (Hitler removed in 1930; most plausible successor like Gregor Strasser or Göring takes the NSDAP helm) rather than Deletion (party collapses) or Re-roll (random leader).
      2.  **Outcome Variable:** We distinguish **Specific Nazi Germany** (one-party totalitarianism, war of annihilation in the East, industrialized murder of Jews) from **Generic Authoritarian Germany** (nationalist dictatorship, revisionist war, systemic discrimination without industrialized genocide).
      3.  **Fixed Structural Facts:** We hold constant the Treaty of Versailles, the Great Depression, the weakness of Weimar institutions, the conservative elite's desire for authoritarianism, the Army's desire for rearmament, and the prevalence of völkisch antisemitism.
      4.  **Burden of Proof:** Proving a Generic Authoritarian Germany was likely does not settle the debate; the claim "Nazi Germany without Hitler" requires proving the Specific Outcome was likely under Substitution.
      5.  **Location of Dispute:** We acknowledge our stalemate arises from arguing different cells: the User argues Substitution → Generic Outcome; the Friend argues Structure → Specific Outcome regardless of leader. We now argue the same cell: Substitution → Specific Outcome.

  2. **Disagreements Table**

  | Claim | Crux / Shared Evidence | User Prediction (Hitler Specific) | Friend Prediction (Structural) |
  | :--- | :--- | :--- | :--- |
  | **1. The NSDAP remains a viable vehicle for total power without Hitler.** | Strasser's organizational skill vs. Hitler's charismatic glue; 1932 party financing data. | **Low Viability:** Party fractures or remains fringe without Hitler's unique appeal. | **High Viability:** Structural demand for strongman sustains party regardless of leader. |
  | **2. A non-Hitler authoritarian regime initiates a war of annihilation in the East.** | *Lebensraum* as common Right-wing goal vs. Hitler's specific ideological driver in *Mein Kampf*. | **Unlikely:** Conventional revisionist war for borders, not ideological extermination/expansion. | **Likely:** Economic/strategic pressure makes Eastern war inevitable for any nationalist regime. |
  | **3. A non-Hitler regime implements industrialized genocide of European Jewry.** | Exterminationism as systemic evolution vs. Hitler's personal fixation driving radicalization. | **No:** Persecution and expulsion likely; industrialized murder requires Hitler's specific will. | **Yes/Probable:** Radicalizing dynamics of war and entrenched antisemitism lead to same outcome. |

  3. **Node-by-Node Pass: Hinge Moments**
      *Estimates represent % of divergence attributed to Hitler's specific agency vs. Structural pressure.*

      *   **January 1933 (Appointment to Chancellor):**
          *   **User:** 80% Man. Hitler's refusal to enter a coalition as junior partner forced Papen/Hindenburg to concede full chancellorship.
          *   **Friend:** 80% Structure. Conservative elites intended to use any nationalist leader to crush the Left; Hitler was merely the available tool.
      *   **March 1933 (Enabling Act):**
          *   **User:** 70% Man. Specific timing of the Reichstag Fire decree and intimidation tactics relied on Hitler's risk appetite.
          *   **Friend:** 70% Structure. Fear of Communism and desire for order would have enabled any authoritarian leader to pass similar laws.
      *   **1936 (Rhineland Remilitarization):**
          *   **User:** 90% Man. Only Hitler would have gambled on French inaction; any other leader would have retreated under pressure.
          *   **Friend:** 60% Structure. Military pressure for rearmament was building regardless; diplomatic failure was systemic, not personal.
      *   **1941 (Operation Barbarossa):**
          *   **User:** 95% Man. War of annihilation driven by Hitler's specific ideological obsession with Judeo-Bolshevism.
          *   **Friend:** 70% Structure. Economic necessity for resources and strategic fear of USSR made Eastern war inevitable for any regime.

  4. **Semantic Flags**
      *   **"Nazi Germany":** User defines this as the Specific Outcome (Holocaust + Annihilation War). Friend often conflates this with Generic Authoritarian Germany.
      *   **"Inevitable":** User interprets this as >90% probability. Friend interprets this as >50% probability given structural pressures.
      *   **"Antisemitism":** User distinguishes between traditional discriminatory antisemitism and Hitler's specific exterminationist antisemitism. Friend treats these as points on a single sliding scale.

