          *   *The Point:* Can the *same* blind process (natural selection) do both the easy stuff and the hard stuff? Yes. He is *not* admitting defeat; he is admitting the *challenge*.

      *   **Question 3: Competence without Comprehension (Darwin & Turing):**
          *   *Concept:* Daniel Dennett's phrase.
          *   *Darwin:* Nature produces design (competence) without a designer (comprehension).
          *   *Turing:* Computers do math (competence) without understanding math (comprehension).
          *   *Application to Passage:*
