answer: |-
  **The Scenario**
  The *Vigil* ($A$) is a small, autonomous research submersible programmed with a specific, non-transferable ethical vow to monitor a fragile coral reef; the *Leviathan* ($B$) is a massive, unprogrammed mining dredger. Following a catastrophic structural failure, the *Vigil* is physically welded into the *Leviathan*'s hull to serve as the new command module, creating a single seaworthy vessel ($C$) that sails away using the *Vigil*'s navigation systems and power core while the *Leviathan*'s original bridge is discarded. The *Vigil*'s vow requires that *it* specifically returns to the reef; the obligation is discharged only if the entity returning is numerically identical to the *Vigil*, not merely continuous with it. There are no legal statutes governing the merger; the asymmetry rests entirely on the functional facts: the *Vigil* provides the "brain" and "heart," while the *Leviathan* provides mere "flesh."

  **The Question**
  Is the resulting vessel ($C$) numerically identical to the *Vigil* ($A$)?

  **The Verdicts**
  *   **Endurantist:** **Yes.** The Endurantist argues that persistence is governed by sortal continuity and functional dominance. Since the *Vigil*'s organizational principle (its command systems and ethical programming) dominates the fusion and dictates the trajectory of $C$, $C$ is the *Vigil* having acquired new parts. The *Leviathan* ceased to exist, absorbed into the *Vigil*. The obligation is discharged because the agent who made the vow is literally present.
      *   *Feature:* **Sortal Dominance.**
  *   **Perdurantist:** **No (Strictly).** The Perdurantist treats $A$ and $B$ as distinct spacetime worms. $C$ is a worm composed of temporal parts from $A$ and temporal parts from $B$ post-fusion. For $C$ to be identical to $A$, the worm $A$ must extend into the region occupied by $B$'s hull. However, spatiotemporal continuity alone does not privilege $A$'s history over $B$'s; both merge seamlessly. To assert $C=A$ requires appealing to the "importance" of the command module parts over the hull parts. This violates the worm-theoretic ideal that identity is merely the I-relation (psychological/physical continuity) between stages without sortal weighting. The Perdurantist must either deny strict identity (claiming $C$ is a new worm overlapping $A$) or pay the cost of importing sortal-relative identity conditions.
      *   *Feature:* **Mereological Neutrality.**

  **The Reverse Case (Fission)**
  If the case is run backwards, $C$ divides into $A$ (command module) and $B$ (hull).
  *   **Perdurantist Reply 1:** *Both are $C$.* (Cost: Violates transitivity of identity; $A \neq B$ but $A=C$ and $B=C$.)
  *   **Perdurantist Reply 2:** *Neither is $C$.* (Cost: Denies ordinary survival intuition; the ship clearly survives the separation.)
  *   **Perdurantist Reply 3:** *Stage Theory.* $C$ is a temporal stage, not a worm. (Cost: Abandons the ontology of persisting objects entirely; obligations cannot attach to momentary stages.)

  **The Temporal Part Fallback**
  If the Perdurantist argues that the *Vigil* ($A$) is merely a *temporal part* of the later vessel ($C$), this does not vindicate the ordinary claim. Obligations attach to continuants (persons, ships, agents), not to temporal slices. To say "The *Vigil* is a part of $C$" is to say "A slice of the *Vigil* exists within $C$," which implies the *Vigil* as a whole does not exist at the later time. This restates the denial of survival: the entity that made the vow is gone, replaced by a larger entity containing its history.

  **Committed Judgement**
  This case genuinely inverts the dialectic. In standard fission, the Perdurantist wins by relaxing identity (both successors are the original), while the Endurantist chokes on transitivity. In this fusion case, the Endurantist wins by tightening identity (only the dominant continuant survives), while the Perdurantist chokes on mereology. The Perdurantist's apparatus treats time as analogous to space; just as two roads merging do not become numerically identical to one another without convention, two worms merging cannot be strictly identical to one predecessor without violating the neutrality of the spacetime manifold. The Endurantist, by contrast, treats identity as grounded in *essence*, allowing the "soul" of the *Vigil* to absorb the "body" of the *Leviathan*.

  I take the side that this **does invert the dialectic**, favoring Endurantism in fusion contexts. The Perdurantist escapes only at the price of paraphrase: they must say "The *Vigil*-stage is causally connected to the $C$-stage," which fails to capture the deontic weight of "The *Vigil* is here."

  **Flagged Uncertainty:** I am least confident that the Perdurantist cannot simply adopt "sortal-relative identity" without significant theoretical cost. Some four-dimensionalists (e.g., Sider) might argue that sortal-relativity is already compatible with worm theory, in which case the "cost" I identify is merely a shift in emphasis rather than a structural failure. However, this move typically concedes the Endurantist's core insight that *what* a thing is determines *how* it persists, undermining the Perdurantist claim to a neutral, purely mereological ontology.
