  I'm defending the thesis that Spinoza's democracy is not a liberal-democratic procedure but an "affective equilibrium"—the multitude governs only when its passions are structurally channeled through shared institutions, and his exclusion of women and laborers from citizenship is structurally required by his theory of rational affect rather than an incidental prejudice—before a political-philosophy workshop. The audience: three Spinoza specialists who will check Latin and early-modern context; two democratic theorists who care about inclusion, deliberation, and modern normative applicability; and one rationalist-leaning philosopher of science skeptical of historical interpretation without predictive payoff. Draft my Q&A prep sheet: the six or seven objections I'll actually face, ordered by how damaging they'd be, each phrased in the vocabulary that specific listener would use, with a two-minute reply and an explicit note on where that reply is softest. Include the objection I'm hoping nobody asks—likely whether this reading renders Spinoza's politics useless for modern democratic design. For each reply, state what specific textual finding or conceptual argument would cause me to weaken or abandon that line of defense; that is, say what would change your mind about its adequacy. Don't request citations, reading lists, or bibliographies; build the case from Spinoza's Theological-Political Treatise and his unfinished Political Treatise and from widely known interpretive moves only, and keep the reasoning accessible to a model without web access.
