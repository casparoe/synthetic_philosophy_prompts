  **JOINT STATEMENT ON DEMOCRATIC LEGITIMACY**

  **I. Shared Claims**

  1.  **Mediation:** Democratic representation mediates rather than mirrors; all institutional designs impose structure on input, making perfect transmission of individual preferences impossible.
  2.  **Heterogeneity:** Preference heterogeneity is empirically persistent; any claim of homogeneous public opinion ignores measurable divergence and simplifies complex value conflicts.
  3.  **Unification Risks:** Asserting absolute unity risks excluding dissenters from the moral community of the polity, treating political opposition as an existential threat rather than legitimate disagreement.
  4.  **Collective Action:** A government acts for a collective only when institutional channels permit meaningful revision of mandates, ensuring accountability rather than static alignment with a momentary majority.

  **II. Residual Disagreements**

  | Crux & Neutral Issue | Sovereignist Formulation & Prediction | Constructivist Pluralist Formulation & Prediction |
  | :--- | :--- | :--- |
  | **1. Aggregation-Independence**<br>Issue: Does collective preference exist prior to counting rules? | **Formulation:** A coherent latent will exists independently of aggregation mechanisms; observed cycles are measurement errors obscuring the true signal.<br>**Case:** Policy shifts despite rule changes.<br>**Prediction:** Shifts reveal underlying will correcting prior distortion. | **Formulation:** Preferences are ontologically dependent on the rules used to aggregate them; no pre-existing will exists prior to institutional framing.<br>**Case:** Policy shifts despite rule changes.<br>**Prediction:** Shifts demonstrate instability inherent in aggregation. |
  | **2. Correspondence-vs-Fairness**<br>Issue: What grounds democratic legitimacy? | **Formulation:** Legitimacy requires substantive correspondence to the pre-institutional popular will.<br>**Case:** Majority overriding procedural veto.<br>**Prediction:** Legitimate expression of sovereignty fulfilling the popular mandate. | **Formulation:** Legitimacy is satisfied solely by procedural fairness among irreconcilable interests.<br>**Case:** Majority overriding procedural veto.<br>**Prediction:** Illegitimate tyranny of majority violating fair terms of cooperation. |
  | **3. Boundary-Circularity**<br>Issue: Can membership be defined without presupposing the will? | **Formulation:** Boundaries discover a prior political identity.<br>**Case:** Secession referendum (mutually exclusive boundaries).<br>**Prediction:** Reveals a hidden prior will of the remaining polity. | **Formulation:** Boundaries constitute the people.<br>**Case:** Secession referendum (mutually exclusive boundaries).<br>**Prediction:** Demonstrates "the people" is always an artifact of prior constitutional framing. |
