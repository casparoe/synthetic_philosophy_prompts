answer: |-
  This is a classic "Hard Problem" vs. "Illusionism" standoff. Your friend is arguing for a version of **Illusionism** (Keith Frankish/Dennett): if you explain the cognitive mechanisms that generate the *judgment* of consciousness, you have explained consciousness. You are arguing for **Phenomenal Realism** (Chalmers/Block): the judgment is distinct from the phenomenon being judged.

  To make this land in 90 minutes with mixed CS/Phil cohorts, you cannot lecture the difference. You must engineer a situation where the CS students build the "Friend's Solution" and the Phil students feel the "User's Frustration," then force them to swap shoes.

  Here is the session design.

  # Session Title: The Black Box Audit
  **Goal:** To operationalize the distinction between *explaining a report* and *explaining the referent of that report*.
  **Group:** 24 participants (4 teams of 6; mix Phil/CS evenly in each).
  **Materials:** Whiteboards/markers per team, a deck of "Stimulus Cards" (simple shapes/colors), "Output Slips" (pre-printed sentences).

  ---

  ## 1. The Setup & Rules (0:00 – 0:10)
  **The Ban:** Write the **Forbidden List** on the board. Anyone who says these words owes the "Swear Jar" (a funny penalty, e.g., doing 5 pushups or losing a team point):
  *   Conscious / Consciousness
  *   Experience / Experiencing
  *   Qualia
  *   "What it's like"
  *   Feel / Feeling (in a mental sense)
  *   Subject / Subjective

  **The Invented Vocabulary:**
  Tell the room: *"We are auditing a Black Box. We need to talk about the thing inside the box that causes specific outputs, but we don't know what it is. You must invent a noun for it."*
  *   **Suggestion:** Offer **"The Spark"** as a temporary placeholder, but allow teams to rename it if they agree unanimously.
  *   **Rule:** "The Spark" cannot be defined by function (e.g., "it's the thing that processes red"). It must remain ontologically vague.

  **The Task:**
  *"You are engineers and auditors. Your job is to design a system that interacts with Stimulus Cards. The system must produce Output Slips. Your goal is to account for 'The Spark' in the system architecture."*

  ---

  ## 2. Round 1: The Reliable Reporter (0:10 – 0:35)
  **Objective:** Build a mechanism that explains why the box says what it says.

  *   **Input:** The Facilitator shows a Stimulus Card (e.g., a Red Circle).
  *   **Required Output:** The Box must produce a slip saying: *"I detect Red."*
  *   **Team Task:** Draw the architecture. How does the input get processed to produce that output?
      *   *CS Students:* Will naturally draw sensors, classifiers, logic gates.
      *   *Phil Students:* Will ask, "But where is The Spark in this diagram?"
      *   *Constraint:* The diagram must locate "The Spark."
  *   **The Catch:** Most teams will simply label a box "Spark Detector" or point to the output itself.
  *   **Facilitator Intervention:** At minute 20, stop them. Ask one team: *"Does your diagram explain why The Spark exists, or only why the slip was printed?"*
  *   **Outcome:** They will realize they have built a **Functionalist Account**. They have explained the *report*. They haven't explained the *Spark*.

  ---

  ## 3. Round 2: The Doubting Machine (0:35 – 1:00)
  **Objective:** Upgrade the mechanism to produce the conviction that something is missing.

  *   **New Requirement:** The Box must now produce a *second* Output Slip alongside the first one.
      *   Slip 1: *"I detect Red."*
      *   Slip 2: *"I detect Red, but there is something about the Red I cannot fully describe."*
  *   **Team Task:** Upgrade your architecture. You must add a mechanism that generates Slip 2.
      *   *CS Strategy:* Add a "Meta-Cognitive Monitor" or an "Error Flag" that triggers when bandwidth is exceeded or when data is lossy.
      *   *Phil Strategy:* Argue that this new box is just more mechanics.
  *   **The Debate (Last 5 mins of Round 2):**
      *   Ask the room: *"Did adding the mechanism for Slip 2 explain The Spark, or did it just explain why the Box **claims** The Spark is mysterious?"*
      *   **Crucial Question:** *"If we build this box, and it prints Slip 2, have we captured The Spark? Or have we just built a machine that complains about missing Sparks?"*

  ---

  ## 4. The Reveal & Mapping (1:00 – 1:15)
  **Lift the Ban.** Now you allow the forbidden words.

  1.  **Map the Terms:**
      *   "The Spark" = **Phenomenal Consciousness / Qualia**.
      *   "Output Slips" = **Verbal Reports / Judgments**.
      *   "Round 1 Architecture" = **Access Consciousness / Functional Explanation**.
      *   "Round 2 Upgrade" = **Illusionist Explanation of the Hard Problem**.
  2.  **Name the Problems:**
      *   Tell them: *"Round 1 was solving the 'Easy Problem' (how we report). Round 2 was solving the 'Hard Problem' via Illusionism (explaining why we think there's a Hard Problem)."*
      *   Name your Friend's View: **"The Report-Only Theory."** (If you explain the slip, you explain the mind).
      *   Name Your View: **"The Referent Gap."** (The slip points to something the slip itself doesn't contain).

  ---

  ## 5. Debrief & The "Honesty Clause" (1:15 – 1:30)
  This is where you secure the learning outcome. Do not let them leave thinking Round 2 solved it.

  **Discussion Question:** *"In Round 2, when we added the mechanism that says 'something is missing,' did that mechanism actually contain the missing thing?"*
  *   **Desired Consensus:** No. It contained a *model* of the missing thing.
  *   **The Takeaway:** You can explain the *insistence* on consciousness without explaining consciousness itself. That is the gap.

  ---

  ## 6. The Three Honest Constraints
  You asked for brutal honesty about where this design fails. Here it is.

  ### 1. Predictable Failure: The "Functional Definition" Leak
  **What will happen:** Within the first 10 minutes, a CS grad student will say, *"Okay, so 'The Spark' is just the high-bandwidth data stream, right?"* or *"It's the error correction module."* They will define the invented word functionally to make the engineering problem solvable.
  **Why it breaks the session:** If "The Spark" is defined as a function, the Gap disappears. You've validated your Friend's view by accident.
  **How to handle it:** Enforce a **"Definition Freeze."** Tell them: *"You are not allowed to define what 'The Spark' IS, only where it sits in the diagram. If you define it by what it does, you are fired from the audit."* You must act as the strict regulator who refuses to accept functional definitions for the ontological variable.

  ### 2. What This Activity Literally Cannot Stage
  **The Limitation:** You cannot stage the **absence** of experience.
  **Why:** Every single person in that room is conscious. When they simulate the "Black Box," they are simulating it *from the inside*. They cannot help but project their own "Spark" onto the box.
  **What you must say out loud:** In the debrief, you have to admit: *"We are all conscious beings pretending to be engineers designing zombies. We cannot actually observe the gap from the outside, because we are trapped on the inside. This activity simulates the **argument** about the gap, not the gap itself."*
  **Risk:** If you don't say this, the Phil students will accuse the CS students of missing the point, and the CS students will accuse the Phil students of mysticism, and you'll recreate your fight in 24 bodies.

  ### 3. The "Scrap Condition" (When to Abort)
  **The Signal:** If, during the Round 2 debrief, the majority of the room (especially the Phil students) agrees that **"Explaining the complaint is enough."**
  **Why this is bad:** If they conclude that building the "Doubting Machine" successfully closes the gap, you have inadvertently taught **Illusionism** as fact, rather than as one side of the dispute. You wanted them to *see the gap*, not conclude the gap is an illusion.
  **What to change:** If you see this consensus forming, you must intervene with a **Phenomenal Challenge**:
  *"Okay, if the machine explains the complaint, then if I build this machine, does it suffer? If I turn it off, is something lost? If your answer is 'that's a meaningless question,' then you have accepted the Report-Only theory. If your answer is 'I don't know,' then the Gap is still open."*
  Force them to sit with the uncertainty. Do not let them resolve the tension too cleanly.

  ---

  ## Facilitator Script Snippet (For the Debrief)
  *"Last night, two people argued about whether explaining the map explains the territory. Your Friend says: 'The map is all we have, so explaining the map is everything.' You say: 'The map points to a territory you haven't touched.'*

  *In Round 2, you built a map that included a label saying 'Terra Incognita.' Your Friend says: 'Look, you explained why the label exists! Done.' You say: 'You explained the label, not the unknown land.'*

  *This summer school is not about solving that. It's about making sure you never confuse the label for the land again."*
