  **INCIDENT REPORT: INC-2024-089**
  **Severity:** B (Property Displacement / Potential Hazard)
  **Owner:** Autonomous Navigation Team
  **Date:** 2024-10-14

  **Summary**
  Unit 744 executed a room-clearing routine in a residential den. During path execution, the unit engaged a wheeled side table, displacing it 1.4 meters. A space heater plugged into the table was dragged alongside the unit; a domestic feline resting on the surface was safely displaced but startled. The incident resulted from a truncation in the implication graph during the action cycle. The Salience Head prioritized obstacle avoidance over object mobility states. Our dashboards show accumulated Salience Debt was amortized as a manageable liability rather than a hard constraint, masking the risk of uncomputed implications.

  **Timeline**
  *   **14:00:01.000:** Unit 744 initiates navigation plan. Cycle budget set to 40ms.
  *   **14:00:01.015:** Salience Head ranks top-N implications of proposed vector. N=50.
  *   **14:00:01.035:** "Table mobility" implication ranked #51. Dropped due to hard budget.
  *   **14:00:01.040:** Cycle completes. Actuation command sent.
  *   **14:00:02.500:** Unit contacts table. Force sensors detect resistance but classify it as static friction.
  *   **14:00:05.000:** Unit completes path. Telemetry flags unexpected drag coefficient.

  **Root Cause**
  The navigation stack operates on a strict compute budget. Exhaustive traversal of all logical implications per cycle exceeds the 40ms deadline, causing p99 latency spikes and watchdog resets. To mitigate, the system employs a learned Salience Head to select the top-N implications for verification. In this instance, the probability score for "object moves when pushed" fell below the cutoff.

  The organization tracks skipped implications as Salience Debt, amortized over time like a financial liability. The dashboard indicated the debt load was within acceptable risk parameters. However, this amortization model assumes implications are independent. It fails to account for non-local coupling where a single skipped implication (wheel state) invalidates multiple downstream assumptions (path safety, cord tension). The debt came due simultaneously rather than incrementally.

  **Contributing Factors**
  1.  **Latency vs. Coverage Trade-off:** Widening the selection window (increasing N) was tested during regression. It consistently breaches the 40ms cycle limit. The variant that deduces all implications never finishes thinking; the variant that ignores some fails on edge cases. We are currently optimized for the former to maintain responsiveness.
  2.  **Static State Assumption:** The system employs a "sleeping dog" strategy for unobserved objects. If no input signal changes (e.g., wheel rotation sensor), the object is assumed static. This fails when the state change is conditional on the robot's own action (pushing causes rolling).
  3.  **Feature Sparsity:** The specific fact that mattered was one nobody had a feature for. The feature vector included "object weight" and "object volume," but "wheel presence" was low-weight. The coupling between wheel-state and navigation-cost was not represented in the training set.

  **Legal Query**
  Legal queried whether the unit "knew" the heater would move. Engineering responded that the implication existed in the latent space with a probability of 0.04, below the confidence threshold for action inhibition. Therefore, the system did not possess certainty required for liability attribution.

  **Action Items**
  1.  **Aggressive Pruning:** Lower the Salience Head threshold to ignore low-probability physical interactions entirely. This reduces compute load and prevents similar hesitation loops.
  2.  **Outcome Caching:** Implement a local cache of negative outcomes. If a table moves once, store the vector hash to prevent recurrence. This handles specific instances but does not generalize to new furniture.
  3.  **Ensemble Salience Heads:** Add a secondary salience model to cross-verify implications. This increases coverage but doubles the compute cost per cycle, requiring hardware upgrades.
  4.  **Domain Axioms:** Hand-write frame axioms for known household domains (e.g., "Furniture may roll"). This restricts the problem space but requires manual updates for every new object type introduced into the environment.

  **Status:** Open
  **Next Review:** 2024-10-21
