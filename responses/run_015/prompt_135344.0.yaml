  Good morning. Welcome to "The Boundary Problem." Looking around, I see colleagues who've spent careers dissecting the demos, and neighbors who build community without needing a syllabus. My partner's parents are here too, which keeps me honest.

  Here's the bottom line: There is no neutral algorithm for who belongs to the demos. Framing membership like a technical fix is itself a political move.

  For the theorists in the room: We know the all-affected-interests principle often collapses under its own weight. We aren't gathering to finally solve the puzzle as if the correct answer is just hiding behind a curtain. The tension isn't a bug; it's the feature. To claim we can calculate membership is to hide the choice involved in drawing the line.

  For the organizers and family: You know this isn't just abstract. When a city decides who gets to vote on a zoning change, or who qualifies for aid, they aren't doing math. They're drawing lines that include some and exclude others. That act is power. Your work on the ground proves that boundaries are felt before they are written.

  If we pretend we can recieve a clean formula, we miss how the question itself shapes the answer. We can't wait for the perfect theory before we act, nor can we act as if the boundaries are natural rather than made. Technocracy often tries to mask this choice as efficiency, promising alot of clarity where there is only conflict.

  So today, let's not try to close the boundary. Let's examine how drawing it changes what happens inside. Whether you cite journals or canvass streets, you know that who counts determines what counts. Let's make that tension work for us, rather than pretending it away. We need the rigor of the academy and the intuition of the neighborhood to see the whole picture.

  Thank you.
