answer: |-
  # Teaching Plan: Pain Asymbolia and the Intrinsic Badness of Sensation

  ## Sequence of Conceptual Dependencies

  **1. Primary Distinction: Sensory-Discriminative vs. Affective-Motivational**
  *   **Action:** Establish this distinction immediately, prior to introducing asymbolia.
  *   **Definition:** Define the **sensory-discriminative** dimension as the capacity to locate, intensity-rate, and characterise the stimulus (e.g., 'throbbing', 'sharp', 'in the leg'). Define the **affective-motivational** dimension as the immediate unpleasantness and the urge to avoid or escape the stimulus (e.g., 'suffering', 'wanting it to stop').
  *   **Rationale:** Asymbolia is conceptually impossible without this bifurcation. The thesis relies on the claim that one dimension can exist without the other.
  *   **Risk of Reversal:** If you introduce asymbolia ('pain without suffering') before securing this distinction, students will collapse the concepts.
      *   **Confusion with Analgesia:** They will assume that if the 'badness' is gone, the sensation must also be gone (no pain at all).
      *   **Confusion with Masochism:** They will assume the sensation is present but the valence is inverted (pain is enjoyed), rather than neutralised.
      *   **Outcome:** The specific philosophical work of asymbolia (isolating the source of badness) fails because the components of pain have not been separated.

  ## The Carrying Example

  **Comparative Pair Construction**
  Do not use clinical vignettes of patients laughing at injury. Use the following hypothetical pair to demonstrate dissociation in both directions.

  **Case A: The Asymbolic Mountaineer**
  *   **Properties Possessed:** Full nociceptive intensity during severe tissue stress; accurate localisation of damage; ability to describe the signal structurally (e.g., 'high-frequency firing in the tibia').
  *   **Properties Lacked:** Aversiveness; urge to withdraw; description of the signal as 'unpleasant' or 'bad'. The signal is treated as purely informative.
  *   **Function:** Demonstrates Sensory-Discriminative presence + Affective-Motivational absence.

  **Case B: The Phantom-Limb Patient**
  *   **Properties Possessed:** Vigorous withdrawal behaviour; visible distress; verbal reports of suffering.
  *   **Properties Lacked:** Complete absence of nociceptive input (no tissue damage at the site; no peripheral nerve firing corresponding to the sensation).
  *   **Function:** Demonstrates Affective-Motivational presence (behavioural/phenomenal) + Sensory-Discriminative absence (veridical input).

  **Pedagogical Goal:** By juxtaposing these cases, students must see that aversion can be detached from sensation (Mountaineer) and that distress/behaviour can exist without veridical sensation (Phantom). This secures the claim that the 'badness' is not intrinsic to the sensory quality itself.

  ## Misconception Map

  **1. Misconception: Conflating Absence of Aversion with Absence of Sensation**
  *   **Student Thought:** 'The mountaineer does not feel it properly; if it didn't hurt, they weren't in pain.'
  *   **Interception Point:** Immediately after presenting Case A (Mountaineer), before discussing the implications for 'badness'.
  *   **Correction Strategy:** Revert to the Primary Distinction. Ask students to list what the mountaineer *can* report (location, intensity) versus what they *do not* report (unpleasantness). Force the admission that the sensory channel is intact.
  *   **Required Intermediate Idea:** Pain reports are composite judgments, not simple sensations.

  **2. Misconception: Inferring Bodily Damage is Morally Neutral**
  *   **Student Thought:** 'If the sensation isn't bad, then the tissue damage itself doesn't matter morally.'
  *   **Interception Point:** After establishing that sensation is not the sole source of badness, but before concluding the seminar.
  *   **Correction Strategy:** Distinguish between the **evaluative status of the experience** and the **evaluative status of the cause**.
  *   **Required Intermediate Idea:** The argument concerns the *phenomenology of suffering*, not the *value of health*. Tissue damage is instrumentally bad (leads to dysfunction/death), even if the immediate sensory experience of it is not intrinsically bad without the affective component.
  *   **Defusal:** Clarify that asymbolia shows why *suffering* is bad, not why *injury* is irrelevant.

  ## Diagnostic Question

  **Purpose:** To distinguish a student who grasps that badness resides in the motivational response from one who has merely memorised the term 'asymbolia'.

  **Question:**
  'Imagine a drug that could be administered to the mountaineer. It would restore the full aversive quality of the pain (the suffering and the urge to withdraw) but would leave the sensory intensity and localisation exactly as they are now. Would administering this drug improve or worsen the mountaineer's condition, and why?'

  **Grading Criteria:**
  *   **Memorisation Only:** The student answers based on whether the drug 'cures' asymbolia as a pathology, without addressing the value change.
  *   **Conceptual Grasps:** The student identifies that administering the drug *worsens* the condition because it adds negative value (suffering) without adding informational value (sensation is already intact). This proves they locate the badness in the motivational response, not the sensation.

  ## Exclusions and Justifications

  **1. Neuroanatomical Pathways**
  *   **Exclusion:** Do not mention the spinothalamic tract, anterior cingulate cortex, insula, or specific lesion locations.
  *   **Justification:** The seminar is philosophical, not medical. Introducing neuroanatomy invites reductionist confusion where students may conceptually tie the 'affective' dimension to a specific brain region rather than a functional role. This distracts from the phenomenological argument.

  **2. Clinical Diagnostic Criteria**
  *   **Exclusion:** Do not discuss ICD codes, specific testing protocols (e.g., hot/cold probes), or prevalence rates.
  *   **Justification:** Students lack clinical training; focusing on diagnostics shifts attention to medical management rather than the metaphysics of pain. The hypothetical cases are sufficient for the philosophical point.

  **3. Bibliographic References and Further Reading**
  *   **Exclusion:** Do not provide a reading list, cite specific authors (e.g., Grahek, Bain), or mention seminal papers.
  *   **Justification:** This is a single session with no follow-up. Providing references creates an obligation for independent study that cannot be supported or assessed. The goal is conceptual clarity within the seventy-minute window, not research preparation.
