  ok so me and my friend just finished this long back-and-forth about lexical-threshold negative utilitarianism — the view that reducing suffering gets lexical priority until we cross some threshold, then happiness counts — and whether pleasure and pain are even on the same scale. i tried to show that the view collapses either way but now the arguement seems to prove way too much, like it kills every moral theory that ranks values lexically. i can't find the exit.

  (1) if pleasure and pain are commensurable, there has to be a shared cardinal scale with a neutral zero point, so arithmetic works: 500 hedons minus 3 dolors, etc.

  (2) lexical-threshold negative utilitarianism says suffering-reduction takes absolute priority over pleasure-increase while suffering is above the threshold; below it, pleasure matters in the normal weighted way.

  (3) "absolute priority" here means no quantity of pleasure can outweigh even a tiny suffering that sits above the threshold — if it could, the priority wouldn't be lexical, just heavy weighting.

  (4) but commensurability means the two values live on one line; so in principle an enormous pile of pleasure (say 10^40 hedons) numerically dominates any fixed suffering amount.

  (5) therefore, if pleasure and pain are commensurable, the lexical claim in (3) is false; suffering is just heavily discounted, not lexically prior.

  (6) flip side: if they are incommensurable, there's no shared metric, so you can't literally compare "this suffering" against "that pleasure" with numbers.

  (7) but then the lexical ordering in (2) has no justification, because ordering requires comparing the domains you're ordering.

  (8) so the view is either incoherent (if commensurable) or groundless (if incommensurable).

  (9) and here's where it gets ugly: the same structure applies to any theory that gives one value lexical priority over another — liberty over welfare, autonomy over happiness, whatever — as long as they share a domain.

  (10) so either we reject all lexical-priority moral theories, or pleasure and pain occupy some weird orthogonal value-space where comparison is impossible but ordering still works, which sounds like nonsense to me.

  where's the mistake? i really want to keep (1) because giving up on measuring affect feels like anti-scientific defeatism, and i want to keep (3) because the lexical intuition is literally why i care about negative utilitarianism in the first place. but somthing between (4) and (9) smells like a quantifer shift or i'm smuggling aggregation across people. maybe i'm confusing "can outweigh in principle" with "should outweigh in practice"?

  please reply in these sections:

  - "Map the chain" (~150 words): lay out the steps, flag where the tension lives, and say whether this is a hidden equivocation or a valid argument with a painful premise.
  - "The weak link" (~200 words): pick the step you think breaks, explain why it looked okay, and price the alternatives — especially what happens if i drop (1) vs if i drop (3). be specific about the cost.
  - "The overreach check" (~150 words): does this really kill all lexical theories, or just this one? is there a middle path — maybe incommensurability plus qualitative comparison — that saves (3) without buying the orthogonal-space thing?
  - "Bottom line" (~100 words): which premises you'd actually ditch and what that leaves me holding. don't hedge forever.

  write like you're talking to me after we just argued for an hour. casual is fine, and don't worry about perfect grammar.
