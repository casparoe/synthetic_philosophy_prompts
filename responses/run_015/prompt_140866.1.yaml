  1. **What I am describing**
  You are describing an inverse relationship between the optimization of a signal and the perceived authenticity of the state generating it. When an expression of inner experience is refined for clarity, timing, or impact, observers infer manipulation rather than origin. The very features that make communication effective—coherence, pacing, rhetorical shape—trigger skepticism about the spontaneity of the emotion. Conversely, signals that exhibit inefficiency, loss of control, or structural degradation are accepted as truthful. The core mechanism is not falsity, but design. When the output appears engineered to achieve a response, the audience assumes the internal state is secondary to the effect, rendering the expression performative regardless of the emitter's actual experience.

  2. **The nearest concepts**
  Two established frameworks approach this from different angles, though neither captures the full shape. The first is Costly Signaling Theory, originating in evolutionary biology and economics. It posits that for a signal to be trusted, it must impose a fitness cost on the sender that a faker could not afford to pay. A peacock's tail is heavy and dangerous; a gazelle's stotting wastes energy needed to flee. The cost guarantees honesty because lying is too expensive. This framework treats signals as economic transactions where truth is bought with energy. The second is the Uncanny Valley, proposed in robotics. As an artificial entity becomes more human-like, empathy rises until a point of near-perfection where slight artificiality triggers revulsion. Here, perfection suggests fraud, but the mechanism is aesthetic creepiness rather than rhetorical suspicion. It relies on visual fidelity triggering an instinctive alarm. Additionally, there is the sociological concept of Emotional Labor, where managed feelings are exchanged for wages, creating a distinction between felt and displayed emotion. This introduces the idea that managed expression is inherently commodified and therefore suspect. These concepts agree that efficiency or perfection can undermine trust, but they locate the failure differently: either in the lack of biological cost, the visual fidelity of the vessel, or the transactional nature of the exchange. They provide the vocabulary for skepticism but do not fully explain the penalty on linguistic competence specifically. Furthermore, these concepts generally assume the signal is either honest or dishonest. They struggle with the case where the signal is honest but the channel is optimized. Costly Signaling assumes the channel noise is the proof of truth. Uncanny Valley assumes the visual surface is the proof of life. Neither accounts for a scenario where the message is true but the medium is too clear.

  3. **Where each falls short**
  Costly Signaling explains why inefficiency builds trust, but it fails to address your regress regarding engineered costs. If a system is explicitly engineered to incur costs, the signal remains costly in objective terms, yet you observe that the knowledge of design still voids credibility. The theory assumes cost is objective, whereas your phenomenon suggests cost must be perceived as involuntary and unmanaged. The Uncanny Valley addresses aesthetic perfection triggering revulsion, but it relies on visual fidelity rather than rhetorical structure. A perfectly structured sentence is not visually uncanny, yet it suffers the same distrust. Emotional Labor describes the sender's experience of faking, not the receiver's heuristic for detecting it in non-transactional contexts. None of these capture the specific penalty applied to competence in communication. They explain why we distrust fakers who cannot pay the cost, but not why we distrust skilled truth-tellers who can. Your problem is not that the signal is cheap, but that it is too capable. The existing concepts miss the specific suspicion directed at agency itself, treating the signal as a biological trait or a visual object rather than a crafted message. Existing theories treat design as binary: natural or artificial. Your phenomenon suggests design is a gradient that corrodes trust. The regress you identified is fatal to Costly Signaling here. It proves the observer measures the source of the cost, not the cost itself. If the source is a plan, the cost is irrelevant.

  4. **A name and a definition**
  I will call this the Competence Inversion. It is defined as the phenomenon wherein the perceived authenticity of an expressed internal state decreases as the communicative competence of the expression increases. This obtains when the receiver attributes the structure of the signal to intentional design rather than involuntary overflow. The condition requires an observer capable of distinguishing between raw emission and crafted message, implying a certain level of sophistication in the audience. It does not obtain when the receiver lacks the capacity to detect design, or when the cost of the signal is visibly catastrophic rather than merely inefficient. The inversion hinges on the attribution of agency: if the shape of the grief suggests a mind controlling the output, the grief is assumed to be subordinate to the control. Truth is associated with loss of control; therefore, control implies falsehood. The phenomenon is distinct from lying because the emitter may be truthful; it is distinct from acting because the emitter may not be performing. It is a failure of interpretation located entirely in the receiver's assessment of the relationship between form and feeling. It does not obtain where competence is expected, like technical reporting. It is specific to states coded as overwhelming. The definition requires the state should disrupt communication. When communication remains intact, the state is questioned.

  5. **Boundary cases**
  First, a system engineered to incur genuine resource costs during distress signals falls inside the phenomenon if the cost is known to be designed. The observer sees the cost as a feature, not a bug, maintaining the skepticism because the agency remains with the designer, not the emitter. The cost is not a sacrifice but a specification. Second, a trained actor who is genuinely grieving occupies a boundary zone. If their training allows them to shape the grief for the audience, the Competence Inversion applies; the skill masks the truth. If the grief breaks through the training, creating inefficiency, it escapes the inversion. The key is whether the competence overrides the symptom. Third, a signal engineered by a party with no stake in persuasion lies outside the phenomenon. If the design is not intended to manipulate the receiver, the receiver may not attribute manipulative agency to the emitter. The phenomenon requires the receiver to suspect the design serves the emitter's interest or the designer's goal. Where design is neutral, accidental, or purely functional without persuasive intent, the penalty may not apply. The inversion requires a suspected motive behind the polish.

