answer: |-
  **NEURATHIA**

  **Population:** 4.2 million  
  **Capital:** Isotypia  
  **Currency:** The Unit (depicted as a gold circle)  
  **Language:** ISOTYPE (mandatory)

  Upon crossing the border, travellers are relieved of all text-based materials. Novels, maps with legends, and smartphones are confiscated at customs. In their place, you receive the *Basic Visual Vocabulary*, a laminated booklet of 500 approved pictograms. This is not merely stylistic; Neurathia is the world's only state founded on Otto Neurath's principle of 'universal transparency'. The government posits that words are metaphysical traps, prone to ambiguity and class bias. Here, truth is strictly visaul.

  In practice, communication is a exercise in precise pointing. Conversations resemble a game of charades played by accountants. Because ISOTYPE prioritises statistical quantity over narrative, expressing the future tense is illegal. You cannot say "I will eat"; you must present the icon for *Person*, followed by *Food*, and finally *Clock (Future)*. However, the *Clock* icon is often confused with *Alarm*, leading to many unintended emergencies. Negation is similarly hazardous. A red slash through the *Hotel* icon means 'No Hotel', but locally it also signifies 'Fire Hazard'. Several tourists have been evacuated from perfectly safe hostels simply for asking if there were rooms availible.

  The streets are silent save for the shuffling of feet and the clicking of icon-cards. While the aim was to eliminate misunderstanding, the removal of syntactic structure has created new complexities. A sequence showing *Man*, *Water*, *Face* could mean 'The man is drinking', 'The man is drowning', or 'The man needs a wash'. Context is king, but context is hard to picturise.

  ***

  **LOCAL CUSTOMS**
  **Ordering Coffee:** The national beverage is popular but risky. The icon for *Milk* is a white rectangle. Unfortunately, this is identical to the icon for *White Paint*. Always point to the *Cow* first. If the barista produces a brush, leave immediately.
  **Greetings:** Handshakes are obsolete. The standard greeting is holding up the *Friend* icon (two shaking hands) at chest height. Do not invert it, as this indicates *Enemy* or *Trade Union*, both of which are sensitive topics.

  **ENTRY REQUIREMENTS**
  **The Pictogram Exam:** All visitors must pass a B1 Visual Fluency test. You will be shown a sequence of three images and asked to select the correct conclusion from four options. Common failures include misinterpreting *Rain* + *Umbrella* as 'Storm' rather than 'Preparation'. Note: Drawing your own icons is strictly prohibited. Deviation from the standardised line-weight is considered counter-revolutionary abstraction.

  **PUBLIC HOLIDAYS**
  **Day of the Static Noun (14th October):** Celebrating the abolition of verbs, citizens spend 24 hours in a state of being. No actions are performed. Shops close. Transport halts. People stand in parks holding signs depicting their profession. It is a profound day for reflection, though logistics are a nightmare. Do not attempt to travel on this day; the *Train* icon is covered with a black cloth to signify *No Movement*.

  ***

  **Getting Around**
  Transport hubs are models of efficiency, provided you know your destination's coordinate code. Ticket machines lack text prompts. Select the *Map*, punch your *Grid Reference*, and insert *Units*. If you select the *Plane* icon by mistake, you will be issued a ticket for the local museum of aviation, which is closed.

  **Safety**
  Crime is low, largely because conspiracies are difficult to plot without conjunctions. However, pickpockets operate by swapping your icon cards for similar-looking ones. Check your *Passport* icon frequently. If the face has been changed to a *Dog*, you are undocumented.

  **Stay Healthy**
  Medical care is free but literal. Point to the body part hurting. Do not attempt to describe pain levels; the *Fire* icon suggests combustion, and you will be treated for burns. Bring your own translation app, though battery life rarely lasts the week.
