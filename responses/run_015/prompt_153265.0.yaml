  4. Answering no to the first question, no to the second, yes to the third, and no to the fourth, this pattern reflects a dynamic approach to context. This frame-expanding contextualist is identified by its flexibility, and its single most awkward commitment regarding belief revision is that the meaning of evidence shifts unpredictably during the update process.

