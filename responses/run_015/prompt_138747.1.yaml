      *   **Beat 9 (Ines):** Relocates assumption; human reward changes when contract changes (deployment); reward scaling/additive constants change behavior under shift even if optimal behavior looks same now.
          *   *Technical Truth:* Reward shaping/affine transformations preserve optimal policy in MDP but can change behavior under constraint shifts or model error. Context dependency of rewards is real.
          *   *Nuance:* This is the "structural uncertainty" argument.
          *   *Verdict:* Mostly right (highlights dynamic preference problem).

