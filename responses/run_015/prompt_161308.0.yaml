answer: |-
  ## Part 1: Conceptual Grounding & Simplification Strategy

  Before drafting the procedure, we must acknowledge the cognitive science underpinning these disputes and decide what survives the cut to a 90-minute workflow.

  **1. The Microdomain (Comparison Class):**
  *Theory:* Similarity is not a property of two objects; it is a relation between two objects *relative to a set of alternatives* (Tversky's Contrast Model). Without a fixed set of alternatives, "similarity" is infinite and meaningless.
  *Simplification:* We cannot do market research. We must rely on the panel's collective expertise to generate a "Reference Set" of 5 games. If we cannot agree on 5, the domain is too fluid to judge copying.
  *Decision:* **Keep.** This is the anchor. Without it, the rest fails.

  **2. Forced vs. Free Choices:**
  *Theory:* In design, constraints (physics, rules of the genre, component limits) force convergence. Copying signals only exist in "free" choices where multiple viable paths existed.
  *Simplification:* We cannot know the designer's mental state. We must use a counterfactual test: "Would a competent designer aiming for this goal *have* to make this choice?"
  *Decision:* **Keep.** This filters out "scènes à faire" (standard genre elements) without needing legal jargon.

  **3. Slippage (Structural Mapping):**
  *Theory:* Analogy is about mapping relations, not attributes (Gentner's Structure-Mapping Theory). A die and a card are identical if they both serve as "random input selector."
  *Simplification:* Volunteers struggle with "structural mapping." We will use a "Functional Label" swap. If you can swap the component names and the rule still makes sense, it's a slippage match.
  *Decision:* **Keep.** This is the only way to catch non-literal copies.

  **4. Distinctiveness (Rarity):**
  *Theory:* Information theory. A match is only evidence if it reduces uncertainty. Common matches carry zero information.
  *Simplification:* We cannot calculate probabilities. We will use a "Count of 5" heuristic based on the Reference Set.
  *Decision:* **Keep.** Essential for weighting evidence.

  **5. Abstraction Level:**
  *Theory:* Concepts exist at hierarchies (Basic, Superordinate, Subordinate). Similarity at the Superordinate level (e.g., "both are games") is trivial. Similarity at the Subordinate level (e.g., "both use blue wooden meeples") is trivial. The evidentiary weight is at the Basic level (e.g., "both use worker placement to draft actions").
  *Simplification:* Legal "abstraction-filtration-comparison" is too complex. We will use a "Zoom Test."
  *Decision:* **Modify.** Drop the legal machinery. Use a simple "Zoom In/Zoom Out" stability check.

  **What is Dropped:**
  *   **Legal Intent:** We do not judge *intent* to copy, only *evidence* of copying. Intent is a black box; design artifacts are observable.
  *   **Consumer Confusion:** We are not a trademark board. We do not care if players are confused, only if design labor was appropriated.
  *   **Aesthetic "Feel":** This is too subjective for a reproducible procedure. We focus on mechanics and structure.

  ***

  ## Part 2: The Design Integrity Procedure (DIP-90)

  **Time Budget:** 90 Minutes Total.
  **Participants:** 3 Designers, 1 Lay Member (Facilitator).
  **Materials:** Whiteboard, Timer, Printed "Reference Set" cards (blank).

  ### Phase 1: Fix the Microdomain (15 Minutes)
  *Goal: Agree on the space of alternatives.*

  1.  **The Reference Set:** The panel must list **five** commercially released games that a competent designer would consider "neighbors" to the Accused Game.
      *   *Criteria:* Same genre, similar complexity, released within 5 years prior to the Accused Game's design start date.
      *   *Rule:* If the panel cannot agree on 5 games within 10 minutes, the Microdomain is declared **"Emergent."** Stop here. Issue a finding of "Insufficient Data for Comparison."
  2.  **The Constraint List:** Briefly list 3 hard constraints of this genre (e.g., "must have a win condition," "turns must alternate"). These are automatically "Forced."

  ### Phase 2: Map & Filter (30 Minutes)
  *Goal: Identify matches that signal copying.*

  1.  **List Matches:** Complainant lists up to 5 specific features they believe were copied.
  2.  **The Functional Swap (Slippage Test):** For each match, strip the theme.
      *   *Instruction:* "Replace the component name with its job." (e.g., Change "Dragon Card" to "Random Threat Generator").
      *   *Check:* Does the Accused Game use a different component to do the exact same job in the exact same sequence? If yes, mark as **Structural Match**.
  3.  **The Third Designer Test (Forced/Free):** For each Structural Match, ask: "If a third designer made a game in this Reference Set, could they achieve the same goal *without* making this specific choice?"
      *   If No: Mark as **Forced** (Discard).
      *   If Yes: Mark as **Free** (Keep).

  ### Phase 3: Distinctiveness & Stability (15 Minutes)
  *Goal: Weigh the evidence.*

  1.  **The Count of 5:** Look at the Reference Set from Phase 1. How many of those 5 games share this **Free Structural Match**?
      *   4-5 Games: **Common** (Weight = 0).
      *   2-3 Games: **Unusual** (Weight = 1).
      *   0-1 Games: **Distinctive** (Weight = 3).
  2.  **The Zoom Test (Abstraction Check):**
      *   *Zoom Out:* Describe the match more broadly (e.g., "Resource Management"). Does the match disappear? If yes, it was too specific to matter.
      *   *Zoom In:* Describe the match more narrowly (e.g., "Red cubes worth 2 points"). Does the match disappear? If yes, it's cosmetic.
      *   *Stability:* Only count matches that survive both zooms.

  ### Phase 4: Deliberation & Verdict (30 Minutes)
  *Goal: Issue the finding.*

  1.  **Calculate Score:** Sum the Weights of all surviving matches.
      *   **Score 0-2:** **Convergence.** (Common design patterns). No sanction.
      *   **Score 3-5:** **Ambiguous.** (Possible inspiration, not clear copy). No sanction, but note concern.
      *   **Score 6+:** **Derivative.** (Substantial structural appropriation). Sanction recommended.
  2.  **Draft the Finding:** Use the template provided below. Focus on the *features*, not the *people*.

  ***

  ## Part 3: Application to Cases

  ### Case 1: The Card/Dice Skeleton (2023 vs 2018)
  *   **Phase 1 (Microdomain):** Reference Set established: 5 card-driven strategy games from 2015-2022.
  *   **Phase 2 (Map/Filter):**
      *   *Match:* Rule skeleton (Turn structure, scoring phases).
      *   *Slippage:* Dice substituted for Cards in one phase. Functional Swap: Both are "Randomized Action Selectors." Verdict: **Structural Match.**
      *   *Forced/Free:* Balance tweaks are Free. The skeleton is Free (other games in Reference Set use different skeletons).
  *   **Phase 3 (Distinctiveness):**
      *   *Count of 5:* Only the 2018 game uses this specific skeleton. Weight = 3.
      *   *Zoom Test:* Holds at mechanic level. Weight stable.
      *   *Dice vs Card:* Distinctive swap to hide copying? Weight = 3.
  *   **Score:** 6+.
  *   **Verdict:** **Derivative.**
  *   **Finding:** "The Accused Game replicates the unique structural skeleton of the Complainant's game. The substitution of dice for cards is a functional slippage that preserves the underlying logic without adding new design value. Credit required."

  ### Case 2: The Deck-Building Convergence (4 Months Apart)
  *   **Phase 1 (Microdomain):** Reference Set: 5 major deck-builders (Dominion, Thunderstone, etc.).
  *   **Phase 2 (Map/Filter):**
      *   *Match:* Core loop (Buy cards, shuffle, draw).
      *   *Forced/Free:* Third Designer Test: To make a deck-builder, you *must* do this. Verdict: **Forced.**
      *   *Match:* Specific card effects.
      *   *Distinctiveness:* None identified by panel.
  *   **Phase 3 (Distinctiveness):**
      *   *Count of 5:* All 5 Reference games share the core loop. Weight = 0.
  *   **Score:** 0.
  *   **Verdict:** **Convergence.**
  *   **Finding:** "The shared features are defining conventions of the deck-building genre. No distinctive free choices were appropriated. Both designs are independent executions of genre standards."

  ### Case 3: The 1980s Ghost (Small Studio vs. Large Pub)
  *   **Phase 1 (Microdomain):** Reference Set: Abstract strategy / Area control games.
  *   **Phase 2 (Map/Filter):**
      *   *Match:* The "Signature Mechanic" (e.g., a specific way of resolving conflicts using adjacent tiles).
      *   *Slippage:* Complainant uses meeples; 1980s game used stones. Function is identical.
      *   *Forced/Free:* It is a Free choice (other abstract games resolve conflict differently).
  *   **Phase 3 (Distinctiveness):**
      *   *Count of 5:* 0 of the modern Reference Set use this. Weight = 3.
      *   *Prior Art Check:* Panel discovers the 1980s game during deliberation (or it is submitted by Respondent).
      *   *Re-evaluation:* The mechanic is not distinctive to the Complainant. It is public domain.
  *   **Score:** Technically high match between Complainant and Respondent, **BUT** Distinctiveness relative to *History* is zero.
  *   **Verdict:** **Complaint Denied.**
  *   **Finding:** "While the Accused Game shares structural features with the Complainant's game, the Panel finds these features originate in a 1988 abstract title (*Game X*). As this mechanic is not distinctive to the Complainant, no design integrity violation has occurred. Both parties appear to have drawn from the same historical precedent."
  *   **Why you won't like it:** It protects the Large Publisher who *did* look at the Small Studio's game, because the Small Studio didn't actually own the idea they claimed was stolen. It feels like a technicality, but it upholds the principle that you cannot claim exclusivity over prior art.

  ***

  ## Part 4: Honest Limits & Failure Modes

  **1. The "Aesthetic Theft" Blind Spot:**
  This procedure measures *structural* copying. It will fail to catch a game that copies the *look, tone, and voice* of another while changing the mechanics. If a studio copies the "feel" of a horror game using completely different rules, DIP-90 will score it as 0. This is a feature, not a bug, of a mechanic-focused panel, but you must acknowledge it.

  **2. The "Emergent Genre" Trap:**
  If a game is truly innovative, Phase 1 will fail (you can't list 5 neighbors). The procedure forces a "No Finding." This protects innovators from being sued by predecessors who don't understand the new genre, but it also leaves them unprotected if someone immediately clones their innovation. In these cases, you must decline to issue a finding.

  **3. The Value Judgment Handoff:**
  The procedure hands the decision to a person when the Score is **3-5 (Ambiguous).** Here, the question is not "Did they copy?" but "Is this level of inspiration acceptable?" That is a community norm question, not a factual one. The panel must vote based on professional ethics, not the score.

  **4. The "Prior Art" Black Hole:**
  As seen in Case 3, the procedure relies on the panel *finding* the prior art. If the 1980s game remains hidden, the procedure will incorrectly rule against the Large Publisher. You need a mechanism for respondents to submit prior art evidence *before* the 90-minute clock starts.

  **5. When to Decline:**
  *   If Phase 1 (Reference Set) cannot be completed.
  *   If the complaint rests solely on "Theme" or "Art Style."
  *   If the Complainant cannot point to specific mechanics (holistic "vibe" complaints).

  ***

  ## Appendix: Theoretical Notes for Panel Members

  *Read this once to understand the "Why," then rely on the Procedure.*

  **1. Why Fix the Microdomain?**
  Cognitive science tells us similarity is contextual. A chimp is similar to a human biologically, but similar to a stone statistically (if you compare them on "number of legs"). In games, a mechanic is only "copied" if it stands out against the background of what else was available. We fix the background (Reference Set) to make the figure (the Copy) visible.

  **2. Why Functional Swap (Slippage)?**
  Concepts are flexible. We recognize "payment" whether it's done with cash, credit, or gold bars. This is *conceptual slippage*. Copycats rely on this to say "It's not the same, I used dice!" The Functional Swap forces the concept to stabilize so we can see if the *role* was stolen, even if the *object* changed.

  **3. Why Forced vs. Free?**
  If physics dictates a bridge must arch to stand, two architects building arched bridges haven't copied each other; they obeyed gravity. In games, genre conventions are gravity. We only penalize choices where the designer had a real alternative.

  **4. Why the Zoom Test?**
  Concepts exist at levels of abstraction. "Vehicle" (High) is too broad to prove copying (both games have vehicles). "2014 Ford Fiesta" (Low) is too specific (one has a car, one has a truck). "Mid-size Sedan" (Basic) is where evidence lives. The Zoom Test ensures we are judging at the Basic Level.

  **5. Why Drop Legal "Abstraction-Filtration"?**
  Legal tests are designed for judges to avoid liability. Our test is designed for designers to maintain integrity. We do not need to filter out "unprotectable expression" for a court; we need to filter out "unoriginal design" for a community. The cognitive "Zoom" is faster and more aligned with how designers actually think than the legal "Filtration."
