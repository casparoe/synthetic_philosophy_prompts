answer: |-
  You have hit on the exact nerve of the most famous debate in modern legal philosophy (the Hart-Fuller debate regarding post-WWII Germany), but you have framed it in a way that exposes the practical instability of the solution.

  Here is the conceptual story of what is going on, what theory the practice presupposes (or fails to), and what would happen if the courts were forced to be theoretically consistent.

  ### 1. The Two-Track Practice: Theoretically Hybrid
  The short answer is that the practice you describe does **not** strictly presuppose a single coherent theory of legal validity. It is theoretically eclectical. It uses Natural Law rhetoric for the criminal case and Positivist (or pragmatic) reasoning for the civil case.

  *   **Track 1 (Criminal):** The court says the old statute was "not law." This sounds like **Natural Law** (specifically the Radbruch Formula: extreme injustice is no law). If it wasn't law, she had no legal defense, and punishing her is not retroactive.
  *   **Track 2 (Civil):** The court says old marriages and contracts *are* valid. This sounds like **Legal Positivism** or **Kelsenian Continuity**. It treats the old regime as a *de facto* law-generating system whose outputs remain valid until explicitly revoked, to preserve social order.

  **Is it consistent?**
  Strictly speaking, no. If the old system lacked the moral threshold to be "law" in the criminal case, it logically lacks it in the civil case too. If the old system was a valid source of law for contracts, it was a valid source of law for the informer statute.

  **Why do courts do this?**
  Because the practice is not driven by a desire for theoretical purity, but by **political morality**. The courts are trying to maximize two values that are in tension:
  1.  **Substantive Justice:** Punish the wicked informer.
  2.  **Legal Certainty/Stability:** Don't invalidate millions of marriages and property titles.

  The "Two-Track" practice is a pragmatic compromise that borrows from whichever theory helps achieve the desired outcome in that specific context. It is underdetermined by theory; rather, theory is being used instrumentally to justify a political outcome.

  ### 2. Can a Positivist Endorse This? (The Hart Route)
  A strict Legal Positivist (like H.L.A. Hart) would say the courts are being dishonest in the criminal trial.

  **The Positivist View of Validity:**
  For a positivist, a norm is law if it originates from the recognized sources of law in that system (e.g., enacted by the dictator, published, enforced). Morality is irrelevant to *validity*. Therefore, the informer statute **was valid law** at the time.

  **How a Positivist Handles the Two Tracks:**
  A positivist *can* endorse the outcome (punish her, keep the marriages), but they must describe it differently to remain consistent:
  *   **Criminal:** Admit that the informer statute *was* valid law. Therefore, punishing the woman **is retroactive**. The new democracy must pass a *new* law that explicitly says: "Acts that were legal under the old regime but violate fundamental human rights are now punishable, even if committed in the past."
  *   **Civil:** The new democracy passes a "Succession Law" or uses its new Rule of Recognition to say: "We choose to recognize the civil acts of the previous regime as valid for the sake of continuity."

  **The Cost:**
  The positivist sacrifices the principle of *nullum crimen sine lege* (no crime without law). They admit they are sacrificing legality to achieve justice. Hart argued this is more honest. It forces the society to admit: "We are punishing you retroactively because what you did was so monstrous we cannot let it slide, even if it means bending our own rules against retroactivity."

  **What would change in practice?**
  If the courts took the "Hard Hart" route:
  1.  They would stop saying "The old statute was no law."
  2.  They would say "The old statute was law, but we are enacting a retroactive exception."
  3.  The judgment would look less like a discovery of pre-existing truth and more like a legislative act by the judiciary.

  ### 3. Can a Natural Lawyer Endorse This? (The Fuller Route)
  A strict Natural Law theorist (like Lon Fuller or Gustav Radbruch) would say the courts are being inconsistent in the civil trial.

  **The Natural Law View of Validity:**
  Law must meet a minimum threshold of morality or "inner morality" (generality, publicity, non-retroactivity, etc.) to count as law. If the dictatorship's rules were tools of terror, they were not law; they were mere commands backed by force.

  **How a Natural Lawyer Handles the Two Tracks:**
  *   **Criminal:** This fits perfectly. The statute was void *ab initio* (from the start). The woman is being punished for violating a higher, unwritten moral law that was always in force. No retroactivity involved.
  *   **Civil:** This is the disaster zone. If the old regime's norms were "not law," then on what basis were marriages solemnized? If the judge who signed the divorce decree had no legal authority, the divorce is void. If the property transfer was based on a void legal system, the title is clouded.

  **What would change in practice?**
  If the courts took the "Hard Fuller" route:
  1.  They would have to declare the old legal system a criminal conspiracy.
  2.  **Civil Chaos:** They would logically have to invalidate all civil acts unless they could be justified on non-legal grounds (e.g., natural marriage rather than state marriage).
  3.  **The Fix:** To avoid chaos, a Hard Natural Lawyer would have to argue that while the *statutes* were void, the *social facts* of reliance remain. They would have to create a new doctrine: "We treat these civil acts as valid not because they were *law* then, but because we *ratify* them now as a matter of equitable estoppel."
  4.  This essentially collapses back into the Positivist move (validating them by new choice), undermining the claim that they were "always valid."

  ### 4. Where is the Practice Underdetermined?
  The practice is underdetermined because "Legal Validity" is doing two different jobs in the two tracks.

  1.  **In the Criminal Track:** Validity is being used as a **Moral Shield**. The court asks: "Was this norm worthy of obedience?" If the answer is no, they say it lacks validity. Here, validity = legitimacy.
  2.  **In the Civil Track:** Validity is being used as a **Social Fact**. The court asks: "Did this norm successfully order social relations?" If the answer is yes, they say it has validity. Here, validity = efficacy.

  The courts are sliding between these definitions without admitting it. They are not presupposing a theory of law; they are presupposing a theory of **Transitional Justice**. They prioritize retribution for political crimes and stability for private law.

  ### 5. Is it Consistent with *Nullum Crimen Sine Lege*?
  *   **On the surface:** Yes, because they claim the old law was void, so a higher law was always in place.
  *   **In reality:** No. The woman relied on the positive law of her time. To punish her is to disappoint that reliance.
  *   **The Philosophical Verdict:** The practice is only consistent if you accept that there is a "hidden" valid law (moral law) that overrides positive law. If you reject that (as a positivist does), the practice is a violation of the principle against retroactivity.

  ### 6. Summary of the Rival Paths

  | Feature | **The Actual "Two-Track" Practice** | **Hard Positivist (Hart)** | **Hard Natural Law (Fuller)** |
  | :--- | :--- | :--- | :--- |
  | **Status of Old Statute** | Void in criminal cases; Valid in civil cases. | Valid in all cases (it was enacted properly). | Void in all cases (it was too unjust). |
  | **Punishing the Informer** | Not retroactive (she broke "real" law). | **Retroactive** (admitting a moral sacrifice). | Not retroactive (enforcing eternal moral law). |
  | **Civil Marriages/Contracts** | Valid (to prevent chaos). | Valid (by new ratification/continuity rule). | **Problematic** (might need re-validation). |
  | **Honesty** | Low (theoretically inconsistent). | High (admits the cost of justice). | Low (risks social chaos or hypocrisy). |
  | **Primary Value** | Pragmatic Balance. | Clarity & Separation of Law/Morals. | Moral Integrity of Law. |

  ### Conclusion
  The practice you describe does not strictly presuppose Natural Law, despite using its language. It presupposes **Pragmatism**. It treats legal validity as a tool that can be toggled on or off depending on whether the outcome serves the new democracy's need for justice (in criminal cases) or stability (in civil cases).

  If you forced the courts to be theoretically consistent:
  *   **Positivism** would make them more honest about power (admitting retroactive punishment) but might make the punishment feel more like "victor's justice."
  *   **Natural Law** would make the punishment feel more righteous but threatens to unravel the entire fabric of civil society unless they quietly reintroduce positivist exceptions for the sake of order.

  The "Two-Track" approach is essentially an attempt to get the moral victory of Natural Law without the social cost of it, while retaining the stability of Positivism without the moral cost of admitting retroactivity. It is, strictly speaking, confused—but it is a confusion that allows a society to transition without collapsing into vengeance or anarchy.
