      *   **The "Two-Track" Practice:** The actual courts (like in post-war Germany) often tried to have it both ways. They used a version of the Radbruch Formula (extreme injustice is no law) for the crimes, but treated the regime as a *de facto* authority for civil matters to ensure continuity.

