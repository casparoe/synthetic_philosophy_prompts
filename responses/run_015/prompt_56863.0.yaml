answer: |-
  **Title:** The Axiomatic Cost of Impartiality: Why Koopmans Does Not Vindicate Pure Time Preference

  The conflict between the ethical demand for impartiality and the mathematical requirements of intertemporal aggregation is one of the most vexing problems in the ethics of the far future. On one side stands the Sidgwick-Parfit intuition: that the date of an event is morally arbitrary. An impartial evaluator should not value a unit of wellbeing less simply because it occurs in the year 3000 rather than 2025. On the other side stands Tjalling Koopmans' seminal impossibility theorem, which suggests that over an infinite horizon, any preference ordering that is stationary, continuous, and sensitive to finite changes must employ exponential discounting with a factor strictly less than one. If we refuse to discount, Koopmans implies, we become blind to finite differences; we lose the ability to register the very catastrophes we sought to prevent by rejecting discounting.

  This essay argues that Koopmans' result does not rehabilitate pure time preference (PTP). While the theorem correctly identifies a tension in the axioms of intertemporal choice, it presents a false dilemma for the moral philosopher. The mathematical convenience of Stationarity and Continuity cannot override the moral necessity of Impartiality and Sensitivity. To save the undiscounting position, we must abandon the requirement that ethical preferences be represented by a stationary, continuous utility function over infinite streams. Instead, we must adopt an incomplete ordering, such as the Overtaking Criterion, which preserves Sensitivity and Impartiality at the cost of mathematical tidiness. Pure time preference remains indefensible; the assumption that must be surrendered is Stationarity.

  To understand the stakes, we must clarify Koopmans' trap. In standard intertemporal choice, we seek a function $U$ that ranks infinite streams of utility $(u_1, u_2, \dots)$. Koopmans demonstrated that if we require **Stationarity** (the preference between two streams depends only on their relative differences, not their absolute position in time), **Continuity** (small changes in the stream do not produce discontinuous jumps in value), and **Sensitivity** (a change in any finite period can alter the ranking), the only representable form is a discounted sum $\sum \delta^t u_t$ with $0 < \delta < 1$.

  If we set $\delta = 1$ to satisfy Parfit's demand for no PTP, the sum often diverges. If two streams both sum to infinity, the standard utilitarian calculus cannot rank them. Worse, in some formulations, a stream that is strictly better in every finite period may be ranked as equal to a stream that is worse, violating Sensitivity. This is the "blindness" Koopmans identifies: without discounting, the infinite tail swamps the finite head. If we cannot distinguish between a future containing a century of torture and one that does not, simply because both extend infinitely thereafter, our ethical framework has failed.

  The first exit from this trap is to accept the mathematical conclusion and embrace a positive pure discount rate. This is the path of descriptive economics, but it is ethically untenable. To accept $\delta < 1$ is to assert that the moral weight of a person's suffering decays exponentially solely as a function of temporal distance. This violates the principle of universalizability. If I am willing to suffer a pain in 2025 to prevent a greater pain in 2026, impartiality demands I accept the same trade-off for pains in 3000 and 3001. To do otherwise is to privilege the "present" self simply because it is present, a form of temporal chauvinism indistinguishable from spatial or racial bias. No mathematical theorem can vindicate a moral prejudice. Therefore, this exit is closed.

  A second exit involves surrendering Stationarity in favor of declining discount rates (e.g., hyperbolic discounting). Here, the discount factor is high in the near term but declines toward unity or zero over time. Proponents argue this captures our psychological intuition without condemning the far future to zero weight. However, the prompt asks whether this is pure time preference under another name. If the discount schedule is keyed strictly to temporal distance and the integral of the discount function remains finite, the answer is yes. It still structurally privileges the near term over the far term merely because of date. It implies that a catastrophe in century 10 is less important than one in century 1, even if the magnitude is identical.

  However, if the declining schedule is keyed to something other than date—such as the probability of the future obtaining, or the marginal utility of wealth—the situation changes. Discounting for existential risk is not PTP; it is expected value calculation. If there is a 1% chance humanity goes extinct per century, a benefit in century 10 is worth less *in expectation* than a benefit today, not because time diminishes value, but because the recipient may not exist. Similarly, discounting due to diminishing marginal utility (assuming future generations are richer) is not PTP; it is egalitarian weighting. These are valid adjustments. But they do not solve the Koopmans problem for *certain* streams of *equal* welfare. If we assume the future exists and welfare levels are constant, keying the schedule to non-date factors offers no escape. We are left with the choice: discount for time, or face divergence.

  This brings us to the decisive verdict. If we cannot discount for time, and if divergence blinds us to finite catastrophes, we must alter the axioms of the ordering itself. Specifically, we must reject the requirement that our ethical ordering be **complete** and **continuous** in the Koopmans sense.

  The most robust solution is to adopt the **Overtaking Criterion** (or the Catch-up Criterion). Under the Overtaking Criterion, stream $A$ is better than stream $B$ if, after some finite time $T$, the cumulative sum of utilities in $A$ permanently exceeds that of $B$. This approach allows $\delta = 1$. It respects Impartiality because it treats all time periods equally in the summation. Crucially, it preserves Sensitivity: if stream $A$ has a century of torture that $B$ lacks, and otherwise they are identical, $B$ will overtake $A$ and remain ahead forever. The finite catastrophe registers.

  Does this escape Parfit's objection? Yes, because it does not rely on a discount factor to ensure convergence. It relies on the ordinal ranking of partial sums. However, it comes at a cost: it yields an incomplete ordering. There will be pairs of infinite streams that never overtake one another (e.g., oscillating streams where $A$ is better in even centuries and $B$ in odd ones). For these cases, the theory declares the options incomparable.

  Is this price too high? Some argue that ethical theory must provide a complete ranking to guide policy. But this demand for completeness is a mathematical luxury, not a moral necessity. It is better to admit that two infinite futures are incomparable than to falsely rank them using a morally corrupt discount rate. The Koopmans theorem forces a choice between Sensitivity, Stationarity, and Continuity. Parfit's ethics demands we keep Sensitivity (catastrophes matter) and Impartiality (no PTP). Since Impartiality effectively rules out the Stationarity required for exponential discounting (which treats the present as a unique anchor for the discounting process), **Stationarity is the axiom that must be sacrificed.**

  Why Stationarity? Koopmans' Stationarity requires that the preference between a stream starting at $t=0$ and one starting at $t=1$ be identical to the preference between streams starting at $t=100$ and $t=101$. While this sounds like impartiality, in the context of the representation theorem, it functions as a constraint that forces the valuation to be anchored to the *current* moment of evaluation to ensure convergence. It imposes a structural myopia. True impartiality does not require that our *method of calculation* be time-invariant in a way that forces convergence; it requires that the *moral weight* of a life be time-invariant. The Overtaking Criterion respects the latter while violating the former. It acknowledges that evaluating an infinite future from the vantage point of the present is a distinct epistemic task from evaluating it from the vantage point of the future, without changing the moral value of the lives involved.

  Furthermore, regarding the prompt's query on keying schedules to expected future wellbeing: if we interpret this as a form of prioritarianism or variable critical levels, it does not solve the divergence problem if the population is infinite and welfare is positive. It merely changes the terms being summed. If the sum still diverges, we return to the need for an overtaking criterion. Thus, changing the *currency* of the sum does not obviate the need to change the *logic* of the comparison.

  In conclusion, Koopmans' theorem is a powerful warning against naive utilitarianism over infinite horizons, but it is not a vindication of pure time preference. The theorem shows that we cannot have it all: we cannot have a complete, continuous, stationary ordering that is also impartial. Faced with this trilemma, the ethical imperative is clear. We must retain Sensitivity, for a theory that ignores finite suffering is useless. We must retain Impartiality, for a theory that discriminates by date is unjust. Consequently, we must surrender the mathematical comforts of Stationarity and Completeness.

  The undiscounting position can be saved, but only by acknowledging that the axiomatic structure of infinite ethics is messier than that of finite choice. We must accept that some infinite futures are incomparable and that our evaluation criteria (like the Overtaking Criterion) may not be stationary. This is a high theoretical cost, but it is the only one that does not require us to betray the moral standing of future persons. Pure time preference remains as indefensible as Parfit claimed; the fault lies not in our refusal to discount, but in our demand that the universe of infinite value be collapsible into a single, stationary real number. We must choose moral coherence over mathematical closure.
