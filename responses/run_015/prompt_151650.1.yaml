answer: |-
  This is a fantastic observation, and your reading group has hit on a genuine tension in legal theory that rarely gets examined through the lens of moral sentiment. You are right to suspect that the current legal architecture treats sympathy in a way that is philosophically unstable, and your friend and you are both grasping different halves of the Smithian elephant.

  To answer your questions, we need to disentangle what the law *says* it is doing with sympathy versus what Smith says moral judgment *is*.

  ### 1. Contaminant vs. Raw Material
  **Does the current pattern presuppose sympathy is a contaminant?**
  Yes. Explicitly. The jury instruction ("do not be swayed by sympathy, passion, or prejudice") treats emotion as noise that obscures the signal of the Law. It presupposes a model of judgment that is essentially Kantian or strictly Rule-Utilitarian: there is a correct output (the sentence mandated by law and facts), and emotional input distorts the calculation.

  **Can a Smithian endorse this?**
  Your friend is closer to the mark than the lawyer, but your defense is the more robust one. For Smith, sympathy (fellow-feeling) is not a contaminant; it is the *mechanism* of judgment. We cannot judge the propriety of an action without imagining ourselves in the situation of the agent or the sufferer.
  *   **The Friend's Objection:** Telling a jury to "ignore sympathy" is like telling them to "ignore their eyes." It asks them to stop using the only faculty they have for moral assessment.
  *   **Your Defense:** Smith absolutely agrees that raw sympathy is miscalibrated. The "finger vs. earthquake" example (TMS III.3) is precisely about how proximity distorts moral weight.

  **The Verdict:** A Smithian *cannot* endorse the instruction to "ignore sympathy." However, a Smithian *can* endorse the instruction to "correct sympathy." The legal system tries to achieve the *result* of the Impartial Spectator (objectivity) by suppressing the *process* (sympathy). Smith argues you achieve objectivity *through* the process, by distancing and informing the sympathy. So, the current system is incoherent from a Smithian view not because it allows emotion, but because it treats emotion as something that can be turned off rather than calibrated.

  ### 2. The Asymmetry: Victim In, Defendant Out
  You noted that victim impact evidence (VIE) is in, while defendant background/family impact is often out (or limited).
  *(A small legal nuance: In capital sentencing, the Supreme Court actually requires that mitigation evidence regarding the defendant's background be allowed [Lockett v. Ohio, Eddings v. Oklahoma]. However, in practice, judges often limit the emotional scope of this, whereas VIE is often highly emotional. The asymmetry is often in the **vividness** permitted, not just admissibility.)*

  **Is there a principled reason for this asymmetry?**
  From a retributive justice standpoint (which dominates sentencing), the crime is an offense against the victim and the state. Therefore, the "harm" side of the equation (victim) is central to the magnitude of the debt. The defendant's suffering is secondary to their culpability.

  **From a Smithian View:**
  Smith's theory of justice is rooted in **resentment**. We approve of punishment only insofar as we sympathize with the resentment of the sufferer (TMS II.ii). This licenses VIE: the jury needs to feel the victim's loss to gauge the proper level of resentment.
  *However*, Smith also insists that to judge the *propriety* of the agent's action (and thus their culpability), we must enter into the **motives** of the agent (TMS I.iii). We need to know what they felt, what constrained them, and what their character is.
  *   **The Smithian Critique:** By allowing vivid VIE but sanitizing the defendant's mitigation (e.g., allowing a psych report but not a tearful mother), the court enables the jury to sympathize fully with the *sufferer* but blocks them from sympathizing fully with the *agent*.
  *   **Result:** The Impartial Spectator is starved of data on one side. You get a vivid picture of the harm, but a flat picture of the human who caused it. This leads to a Spectator who is partial, not impartial. A true Smithian would argue that without understanding the defendant's situation vividly, you cannot accurately gauge the "propriety" of the punishment.

  ### 3. The Smithian Court: Concrete Changes
  If a court took Smith's remedy seriously—cultivating the **Impartial Spectator** rather than suppressing sympathy—what would change? It would not collapse back into the status quo. Here is what a Smithian courtroom would look like:

  **A. Rewording the Instruction**
  *   *Current:* "You must not be swayed by sympathy."
  *   *Smithian:* "You must not be swayed by *proximity* or *partiality*. You are asked to feel what any member of the community, fully informed and at a reasonable distance, would feel. Do not ask what you feel sitting in this chair; ask what you would feel if you were a neutral observer of this tragedy."
  *   *Why it matters:* It validates the emotion as necessary data but demands the cognitive work of distancing. It turns the jury from a cold calculator into an active moral imaginer.

  **B. Symmetry of Vividness**
  *   *Current:* Victim family gives emotional testimony; Defendant's family is often limited or presented via dry reports.
  *   *Smithian:* If the goal is to inform the Spectator, both sides need to be vividly imagined. The Spectator cannot judge the "merit" of the punishment without feeling the weight of the loss *and* the weight of the destruction of the defendant's life.
  *   *Change:* Mitigation evidence would be treated with the same narrative latitude as VIE. The court would recognize that blocking the defendant's humanity prevents the Spectator from calibrating the "merit" of the punishment.

  **C. The Role of the Judge**
  *   *Current:* Judge as gatekeeper of rules.
  *   *Smithian:* Judge as the embodiment of the Impartial Spectator. In sentencing (especially non-jury), the judge's statement would explicitly model the correction of sympathy. "While we feel deeply for the victim's family, we must ensure our resentment does not exceed what is proportional..."
  *   *Change:* Sentencing memoranda would look less like legal briefs and more like moral arguments about proportionality and sentiment.

  **D. Admissibility of "Irrelevant" Emotion**
  *   *Current:* Evidence excluded if not strictly relevant to elements of the crime.
  *   *Smithian:* Evidence admitted if it helps the Spectator situate the agent. Smith cares about *motives* and *context*.
  *   *Change:* More context about the defendant's upbringing, social pressure, or psychological state would be admissible, not to excuse the act, but to help the Spectator judge the *propriety* of the agent's feelings at the time.

  ### 4. Where is the Practice Underdetermined?
  You asked where several theories of sympathy would license the same rules. There are two main places where Smith converges with the current system:

  1.  **Excluding Prejudice:** Smith and the Law agree that sympathy based on race, class, or irrelevant status is "corrupt." Smith's Spectator is "well-informed." A jury swayed by racism is not an Impartial Spectator; it is a biased one. So, rules excluding prejudicial evidence are licensed by both.
  2.  **Limiting Infinite Grief:** Smith acknowledges that sympathy has limits. We cannot sustain infinite resentment. The law's fear that VIE will lead to arbitrary sentences (the "unbridled discretion" argument in *Booth v. Maryland*, later overturned in *Payne*) aligns with Smith's worry that unchecked sympathy becomes excessive. Both agree there is a ceiling on appropriate emotional engagement.

  ### Summary for Your Group
  The lawyer is right that the *current implementation* is incoherent, but wrong that it reflects no view. It reflects a **hybrid view**: it wants Smithian outcomes (community judgment) but uses Kantian instructions (ignore feeling).

  Your view is the strongest: Smith allows you to call some sympathy "noise" (the finger vs. China bias), but only if you treat it as a calibration problem, not a suppression problem.

  **The concrete takeaway:** If the court adopted Smith's view, the instruction wouldn't be "kill your sympathy." It would be "expand your imagination." And if you expand your imagination equally to the victim and the defendant, the asymmetry of the current sentencing phase becomes impossible to maintain. You would either have to let the defendant's family speak with the same emotional freedom as the victim's, or silence the victim's family to match the defendant. Since the law won't silence the victim, a Smithian court would have to let the defendant in.

  The current system tries to build an Impartial Spectator by blinding the jury to half the human picture. Smith would say that makes the Spectator blind, not impartial.
