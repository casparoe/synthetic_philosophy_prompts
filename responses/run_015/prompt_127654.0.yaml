  2. Archivists earn points for keeping letters that align with their secret card, but they lose points if they admit the value comes from 2024 instead of the 1920s.
  3. After twenty minutes, reveal that the cards were actually modern ethical standards printed on aged paper, proving they built a shadow archive of values the past could have held and then pretended the past failed them.
  4. Discuss how they judged the past by current standards while pretending otherwise, noting that first attempts usually fail because people will defend their choices as objectively true.
  5. This activity can't reproduce the emotional weight of real historical consequence, so you'll need to supply actual letters from your archive to ground the abstraction in real human stakes.
