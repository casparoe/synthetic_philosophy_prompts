  So I'm sorting old letters at a local archive (volunteering, long story) and its wild how people in the 1920s talk about mental illness like its a moral failing. I started wondering if historians can ever escape the standards of thier own time, or if every judgment is just presentism in disguise. I want to run a session with my discussion group — about 8 people, one hour — where they feel that trap instead of just talking about it.

