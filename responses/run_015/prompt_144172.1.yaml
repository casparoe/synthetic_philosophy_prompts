answer: |-
  Dear Friend,

  It was fascinating to read about the view you have developed following your discussion in the pub, and I appreciate you sharing such a nuanced take on the constitution problem. You are proposing a form of monism where the statue and the clay are one object, but the modal profiles and persistence conditions of that object are indexed to normative practices rather than being intrinsic properties or mere linguistic conventions. This attempts to steer a middle course between hard realism about coincident entities and deflationary linguistic conventionalism. While this is a creative and sophisticated position, it faces significant philosophical hurdles that range from merely awkward to potentially fatal. I will walk you through these challenges in order of severity, focusing on how they interact with causation, conflicting agents, and the risk of unfalsifiability.

  The most damaging objection, which I would classify as fatal, concerns the causal efficacy of objects across different practices. If the persistence conditions of the object are relative to a practice, then presumably the existence of the object is also relative to that practice. However, causation seems to be practice-independent. If you squash the clay, the resulting state of affairs causes a noise, displaces air, and perhaps ruins an exhibition. If the statue exists only relative to art conservation practices, then in the geological framework where the object does not survive squashing, did the cause exist to produce the effect? If you say the cause existed only relative to the art practice, then the effect should also be relative, but the noise and the air displacement happen regardless of whether anyone is engaging in art conservation. This leads to a problematic fragmentation of causal reality where the same physical event counts as a destruction in one framework and a survival in another, yet produces the same physical effects. This violates the intuition that causation is a mind-independent relation, and if you deny that, you risk sliding into a radical idealism where the physical world itself is fragmented by our norms. A committed defender of your view would have to concede that causation itself is practice-relative, which is a heavy bullet to bite because it undermines the scientific realism that likely grounds the geological practice in the first place.

  Slightly less fatal but still severely damaging is the problem of conflicting practices within a single agent. Consider a person who is both a trained art conservator and a geologist. When this person looks at the squashed clay, do they believe the object exists or not? If existence is practice-relative, they must simultaneously hold that the object exists and does not exist. While paraconsistent logics allow for true contradictions, this makes rational action impossible. If they need to decide whether to repair the object, their decision procedure should depend on whether the object survived. If it survived, repair is possible; if it ceased to exist, repair is impossible. If both are true relative to different frameworks they inhabit, how do they act? You might say they switch frameworks, but in the moment of action, the frameworks overlap. This suggests that practice-relative identity cannot fully account for the unity of agency and decision-making. This is not quite as fatal as the causation problem because you could argue that agents prioritize one practice over another in context, but it remains a significant awkwardness that requires explaining how we navigate conflicting ontological commitments without cognitive dissonance.

  Moving to the merely awkward defeaters, there is the issue of unfalsifiability and the proliferation of practices. If any normative practice can generate its own persistence conditions, then what stops us from inventing a practice where the statue survives being melted down, or where clouds are considered solid objects? If the answer is that practices must be socially established or normative in a specific way, you need a metric for what counts as a valid practice that is not itself ontological. If you rely on existing social practices to validate ontology, you make metaphysics entirely dependent on sociology. This means that if a society emerges that believes statues are eternal souls that cannot be destroyed, then for them, statues literally do not cease to exist when smashed. This renders the metaphysical claim vacuous because it simply mirrors whatever people happen to believe rather than explaining the structure of reality. While this is not logically contradictory, it reduces the explanatory power of your view to the point where it tells us nothing about the world independent of our current habits. This is the unfalsifiability charge you worried about, and yes, it is a real problem for a claim of this kind because metaphysics traditionally aims to discover mind-independent structures, not just catalog our normative habits. If your view is unfalsifiable, it risks being a description of our language games rather than a theory of objects.

  Regarding specific cases that would undermine your position, consider the case of organism death versus biological cessation. Medical practice might declare a patient dead based on brain stem criteria, while religious practice might declare them alive based on cardiac function or spiritual presence. If your view holds, the person is both dead and alive relative to different practices. However, legal and ethical consequences follow from death, such as organ harvesting or inheritance. If the persistence of the person is practice-relative, then the permissibility of harvesting organs becomes practice-relative too. But we generally feel that the permissibility is not relative; either the person is gone and it is permissible, or they are not and it is murder. This intuition about the stakes of destruction suggests that persistence conditions cannot be merely normative; they must track something objective that grounds the norms. Similarly, formal results about vagueness in persistence, such as the Sorites paradox applied to clouds or heaps, suggest that if persistence conditions are too flexible, we lose the ability to count objects at all. If a cloud survives dispersion relative to meteorological practice but not relative to aviation practice, do we have one cloud or two? If the answer is both, then counting becomes impossible, which undermines the utility of the concept of an object.

  To answer your question about what would change my mind about this assessment, I would need to see a robust account of how practices are constrained by mind-independent reality. If you could demonstrate that practices are not arbitrary but are forced upon us by the causal structure of the world, such that only certain persistence conditions are viable for successful interaction, then the charge of unfalsifiability would lose its bite. For example, if you could show that art conservation practices succeed only because they track real structural integrity conditions that are distinct from geological conditions, you might recover a form of realism within the pragmatism. Additionally, if you could provide a formal model showing how conflicting practices resolve without contradiction, perhaps through a hierarchy of norms that mirrors ontological dependence, that would mitigate the agency problem. Without such constraints, the view remains vulnerable to the charge that it dissolves ontology into sociology.

  I must also be honest about where my reasoning here is most likely to go wrong. I am assuming a robust realism about causation and existence that you might explicitly reject. If your metaphysical framework is thoroughly pragmatist, then the fact that causation appears mind-independent is just another feature of our best practices, not a glimpse into a noumenal world. In that case, my objection about causal efficacy begs the question against your view because I am assuming the very practice-independent reality you deny. Furthermore, I might be underestimating the coherence of relativized truth. If truth itself is indexed to practices, then the contradiction in the single agent case disappears because the agent is not asserting P and not-P in the same context, but rather P-in-context-A and not-P-in-context-B. My critique assumes that there is a God's-eye view from which these contradictions are visible, but if your view denies the possibility of such a view, then my objections lose their force. I am likely privileging the scientific practice as the default arbiter of reality, which is itself a normative choice that your view might rightly challenge.

  In conclusion, while your view offers an elegant solution to the coincidence problem by avoiding multiply located entities, it purchases this elegance at the cost of fragmenting causation and risking unfalsifiability. The fatal defeaters involve the inability to account for cross-practice causal interactions and the paralysis of agents inhabiting conflicting practices. The awkward defeaters involve the trivialization of metaphysics into sociology. To save the view, you would need to show how practices are constrained by something deeper than mere convention, perhaps a functional realism where objects are defined by their role in successful action. Until then, the standard constitution view, despite its own problems with coincidence, retains an advantage in preserving a unified causal field. I hope this helps you refine your position, and I look forward to hearing how you might respond to these challenges.

  Warmly,

  Your Philosophical Interlocutor
