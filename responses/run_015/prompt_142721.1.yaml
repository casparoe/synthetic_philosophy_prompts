answer: |-
  The phenomenon you are describing has a name in the literature of human-computer interaction and ethics, though your specific articulation of the *bureaucratic mechanism* (the way the file "contains an answer" that stops upstream inquiry) refines it significantly. The established concept is **The Moral Crumple Zone**.

  It was coined by scholar Madeleine Clare Elish (2019) specifically analyzing the autonomous vehicle safety driver scenario you described. However, your hospital example demonstrates that the mechanism is not limited to AI but applies to any socio-technical system where human oversight is mandated primarily to satisfy accountability requirements rather than functional control.

  Per your request, I will not simply hand you the label. I will treat your description as the primary data and use the concept to provide the precise mechanism, conditions, distinctions, and boundary analysis you asked for.

  ### 1. The Mechanism: Structural Liability Anchoring

  The core mechanism is not merely "blaming the human." It is a specific sequence of structural moves that converts a systemic risk into an individual failure. We can define the mechanism as **Structural Liability Anchoring**. It operates in four distinct phases:

  1.  **Insertion of the Human Node:** A human role is inserted into a workflow (the safety driver, the confirming nurse). This is done in good faith to satisfy a regulatory or ethical requirement for "human control."
  2.  **Constraint of Agency:** The human is given formal authority (the power to stop the car, the power to override the flag) but is structurally denied the *epistemic* or *temporal* conditions required to exercise it meaningfully. (e.g., The alert happens too fast; the model is a black box; the baseline risk is too low to sustain vigilance).
  3.  **Retrospective Causality:** When a failure occurs, the investigation focuses on the moment of human interaction. Because the outcome is known (hindsight bias), the human's failure to intervene is reconstructed as a *choice* rather than a structural impossibility.
  4.  **Upstream Preclusion:** This is the specific insight you contributed. Once the human node is identified as the "author of record," the inquiry terminates. The existence of the confirmation signature satisfies the audit condition. The question shifts from "Was this system safe to deploy?" to "Did the human follow the protocol?" The human presence acts as a **liability sink**, absorbing the moral impact so the designers, deployers, and administrators do not have to.

  ### 2. Necessary Conditions

  For this arrangement to arise, four conditions must hold simultaneously. If one is missing, the dynamic changes.

  *   **Condition A: The Illusion of Control.** The human must have *nominal* control (a stop button, a signature field) without *effective* control (the ability to reliably judge when to use it). If they have effective control, it is genuine oversight. If they have no nominal control, it is pure automation.
  *   **Condition B: Asymmetry of Knowledge.** The human cannot access the reasoning behind the system's output. (The nurse sees "Low Risk" but not the weighted variables; the driver sees the road but not the sensor fusion confidence intervals).
  *   **Condition C: The Audit Stop.** The organization's review protocol must treat the human's action (or inaction) as a sufficient explanation for the outcome. The record of human interaction must be legally or procedurally sufficient to close the file.
  *   **Condition D: Non-Reciprocal Credit.** As you noted, success is attributed to the system, failure to the human. If the human were credited for successful interventions, the role would be functional. If they are only penalized for failures, the role is structural.

  ### 3. What It Is Not (Distinctions)

  You correctly identified that standard terms do not fit. Here is the precise carving:

  *   **It is not a Responsibility Gap.**
      *   *Gap:* No one can be held responsible (the "falling through the cracks" problem).
      *   *This Phenomenon:* Too much responsibility is forced onto one person. The gap is closed, but incorrectly.
  *   **It is not the Problem of Many Hands.**
      *   *Many Hands:* Responsibility is so diffused that no single individual can be singled out.
      *   *This Phenomenon:* Responsibility is hyper-concentrated. The system actively *selects* a single individual to isolate the blame.
  *   **It is not Scapegoating.**
      *   *Scapegoating:* Requires *intent*. A specific actor (a boss, a board) knowingly deflects their own guilt onto an innocent party.
      *   *This Phenomenon:* Can occur without malice. The committee members, the engineers, and the hospital administrators may all believe they are following safety protocols. The blame allocation is a byproduct of the system's design, not a conspiracy.
  *   **It is not Buck-Passing.**
      *   *Buck-Passing:* An individual refuses a responsibility that is rightfully theirs.
      *   *This Phenomenon:* The human *accepts* the responsibility (by taking the job/role), but the responsibility assigned exceeds the capacity of the role.

  ### 4. Boundary Cases

  You asked for the edges of the definition. Here is how the mechanism applies to your specific examples.

  **Case 1: A Minister signing a regulation drafted by civil servants.**
  *   **Verdict:** *Not* a Moral Crumple Zone (usually).
  *   **Reasoning:** In a Westminster-style democracy, the Minister has *effective* control. They can refuse to sign, demand changes, or resign. They have access to the civil servants (knowledge) and the authority to stop the process (agency).
  *   **Edge Condition:** It *becomes* a Crumple Zone if the Minister is legally barred from altering the text, or if the technical complexity is such that no Minister could reasonably understand it, yet they are held personally liable for errors. If the signature is a constitutional formality with no power to veto, it is a Crumple Zone.

  **Case 2: A junior doctor countersigning a consultant's plan.**
  *   **Verdict:** *Depends on the culture of override.*
  *   **Reasoning:** If the junior doctor is expected to learn and is supported by the consultant, and the consultant retains final liability, this is *Hierarchical Verification*.
  *   **Edge Condition:** It becomes a Crumple Zone if the junior is held liable for the consultant's error *because* they signed it, despite lacking the experience to detect the error, and the consultant is insulated by the junior's signature. This happens when the signature is used to shift liability downward rather than verify quality upward.

  **Case 3: A night security guard watching monitors.**
  *   **Verdict:** *Yes, typically a Crumple Zone.*
  *   **Reasoning:** This is the archetypal example. The guard is inserted to satisfy insurance requirements ("24-hour human surveillance"). They cannot watch all screens effectively (vigilance decrement). If a theft occurs, they are fired for "inattention." The upstream question ("Why is one guard watching 50 cameras?") is rarely asked. The guard absorbs the liability for the security design.

  **Case 4: A referee at a sporting match.**
  *   **Verdict:** *No.*
  *   **Reasoning:** The referee has full agency (the game stops for them), full authority (their decision is final), and the system is designed around their limitations (there are two referees, or VAR is introduced to *assist* them, not to make them a liability sink). When VAR is introduced, however, if the referee is blamed for "not overriding the VAR" when the VAR feed was ambiguous, they slide toward the Crumple Zone edge.

  ### 5. Summary Definition

  If we were to name and define this precisely for your committee's use, based on your synthesis of the hospital and AV data, I propose this definition:

  **The Accountability Sink Effect**
  *A structural arrangement in which a human agent is inserted into a decision-loop primarily to satisfy a requirement for human oversight. The agent is granted formal authority but denied the epistemic or temporal conditions required to exercise it effectively. Upon failure, the agent's presence allows the organization to classify the event as "human error" rather than "systemic failure," thereby precluding upstream investigation into design, deployment, or resource allocation. Responsibility migrates downstream to the agent, contracts overall by satisfying audit requirements, and becomes decoupled from the agent's actual capacity to influence the outcome.*

  **Why this carving matters:**
  It identifies that the problem is not the *person* (the nurse or driver), nor necessarily the *machine*, but the *interface of accountability*. The solution is not "train the human better" (which fails because the problem is structural) nor "remove the human" (which raises ethical/legal issues). The solution is to redesign the **Audit Stop**.

  In your hospital context, this implies that the incident-review committee must be empowered to ignore the "confirmation at 04:12" as a terminal explanation. The protocol must require that if a human confirms a system flag that turns out to be wrong, the review *must* ask: "Given the information available at 04:12, could *any* reasonable clinician have identified the error?" If the answer is no, the liability must migrate upstream to the system designers or the protocol writers. Without that rule, the human will remain a crumple zone.
