answer: |-
  **Project Title:** Normative Ambiguity in Functionally Repurposed Vestiges

  **Statement of the Question**
  Contemporary philosophy of biology divides functional attribution into etiological accounts (function as selected effect) and causal role accounts (function as current systemic contribution). These frameworks converge on paradigmatic cases (e.g., the heart pumping blood) and diverge on vestigial traits (e.g., the appendix). However, a genuine conceptual gap remains regarding "functionally repurposed vestiges": structures that have lost their original selection pressure yet retain their ancestral causal profile, now sustaining a *different* organism-level process for which they were never selected. The central question is normative: When a structure performs identical causal work to its ancestral state but sustains a novel systemic end without new selection history, does it possess "proper function," is it merely contributing causally, or is it malfunctioning relative to its history? This project seeks to determine whether existing theories can accommodate this category or if a hybrid normative account is required.

  **Limitations of Standard Examples**
  Standard debates rely on the alignment or total misalignment of history and current contribution. In the heart, selected effect and causal role coincide; in classic vestiges, causal contribution is negligible or absent. Neither resolves the proposed edge case. The heart example masks the possibility of causal continuity paired with systemic discontinuity. Classic vestiges assume functional loss. The proposed case posits functional *shift* without selection. Because the causal mechanism is unchanged, causal role theories must affirm function. Because the systemic target is unselected, etiological theories must deny proper function. This creates a contradiction standard examples do not expose, leaving the normative status of such traits theoretically undecided.

  **Methodology**
  This four-month project will proceed in four phases, assuming a part-time commitment of 12–15 hours per week.
  *   **Weeks 1–4 (Conceptual Mapping):** Rigorously define criteria for "functional repurposing" distinct from exaptation. Construct three hypothetical biological case studies that fit the criteria (identical mechanism, novel systemic end, no recent selection).
  *   **Weeks 5–8 (Formal Modeling):** Draft formal conditions for "malfunction" and "derivative function." Test whether etiological theories can accommodate the cases via "lineage explanations" or if they must classify them as accidents.
  *   **Weeks 9–12 (Comparative Analysis):** Apply causal role theories to the cases. Determine if attributing "function" here dilutes the explanatory power of systemic accounts. Identify the precise logical conflict between the two frameworks.
  *   **Weeks 13–16 (Synthesis):** Compose a final working paper arguing for a specific resolution (e.g., a dual-aspect account or a revised etiological condition) based on the analysis.

  **Success and Failure Conditions**
  *   **Success:** The project yields a refined typology of functional attribution that distinguishes "repurposed vestiges" from both standard adaptations and exaptations. A successful result demonstrates that current theories either incorrectly classify these cases or require specific modification to handle them without collapsing into contradiction.
  *   **Failure:** The project fails if the constructed cases dissolve upon scrutiny—for example, if analysis reveals that any sustained systemic contribution necessarily implies hidden selection pressure (reducing the case to standard exaptation) or if the causal profile is deemed insufficiently distinct from existing vestigial categories. If the edge case proves nonexistent, the project will document this dissolution as the primary finding.

  **Scope Assessment**
  This scope is calibrated for a single semester of part-time independent study. The deliverable is a 15–20 page conceptual paper, not a comprehensive literature review. The restriction to hypothetical modeling rather than empirical biological research ensures feasibility within the time limit. The risk lies in the conceptual complexity; should the logical modeling in Weeks 5–8 prove intractable, the scope will narrow to a comparative critique of existing theories rather than a constructive proposal.
