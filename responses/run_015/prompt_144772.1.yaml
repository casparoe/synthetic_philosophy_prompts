          *   *SSI:* Does knowledge depend on future stakes? Usually, SSI ties knowledge to actionability *now*. If I can act now safely, I know. If I must wait, maybe not. But if the *consequence* of being wrong later is high, does that encroach now? SSI usually says stakes at the time of action/attribution matter.
