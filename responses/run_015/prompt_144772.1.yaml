answer: |-
  # JOINT STATEMENT ON STAKES-SENSITIVITY IN KNOWLEDGE ATTRIBUTION

  **Convened for the Adversarial Collaboration on Epistemic Semantics**

  ## I. AGREED CLAIMS

  We, the undersigned, representing the positions of Epistemic Contextualism (EC) and Subject-Sensitive Invariantism (SSI), affirm the following points of common ground. These claims delineate our shared rejection of Traditional Invariantism and establish the boundary conditions for our remaining disagreement.

  1.  **Rejection of Purism:** We jointly reject the thesis that the truth conditions of knowledge attributions ('S knows that p') are determined solely by truth-relevant factors (evidence, reliability, truth of *p*). Practical factors, specifically the stakes involved in being wrong, play a necessary role in the evaluation of knowledge claims.
  2.  **Variability of Verdicts:** We agree that there are pairs of cases where the subject's evidence remains fixed, yet the correct verdict on whether the subject 'knows' differs. Traditional Invariantism, which predicts uniform verdicts across such pairs, is inconsistent with ordinary linguistic practice and normative epistemic intuition.
  3.  **The Role of Stakes:** We agree that as the practical cost of error rises, the epistemic position required to truly attribute knowledge becomes more demanding. A subject may truly be said to 'know' in a low-stakes environment while failing to 'know' in a high-stakes environment, holding evidence constant.
  4.  **Handling of Specific Cases:** Regarding the four test cases specified for this collaboration, we agree on the following phenomenological data, though we disagree on the theoretical explanation:
      *   **Divergence:** In cases where subject-stakes and attributor-stakes come apart, ordinary speakers hesitate or adjust their willingness to attribute knowledge. Both theories predict a shift in verdict relative to the baseline; we disagree only on which stakes drive the shift.
      *   **Distributed Subject:** In collective agency cases, knowledge attributions are sensitive to the practical situation of the group. It is infelicitous to attribute knowledge to a team without specifying whose stakes govern the attribution.
      *   **Hidden Stakes:** When a subject is unaware of high stakes, speakers intuitively treat the knowledge claim differently than when stakes are known. Both theories accommodate the intuition that objective risk matters, though we locate the semantic impact differently.
      *   **Deferred Stakes:** When consequences are delayed but unavoidable, the epistemic standard is raised prior to the consequence occurring. Both theories agree that the anticipation of future stakes affects current knowledge status.
  5.  **Methodological Constraint:** We agree that a theory fails if it renders ordinary knowledge attributions systematically false (an error theory) or if it requires speakers to possess inaccessible meta-linguistic knowledge to speak truthfully. Our dispute concerns the mechanism of stakes-sensitivity, not its existence.

  ## II. RESIDUAL DISAGREEMENTS

  The following table isolates the precise points of divergence. The left column states the claim as the Contextualist understands it; the right column states the claim as the Subject-Sensitive Invariantist understands it. Both sides accept that the other side's formulation accurately captures their opposing view.

  | Case Scenario | Epistemic Contextualist Formulation | Subject-Sensitive Invariantist Formulation |
  | :--- | :--- | :--- |
  | **1. Divergence**<br>(Subject stakes low; Attributor stakes high) | The sentence 'S knows' expresses a **different proposition** in the attributor's high-stakes context than in a low-stakes context. The attribution is **false** because the attributor's context sets the semantic standard. | The sentence 'S knows' expresses the **same proposition** in all contexts. The attribution is **false** because the subject's low stakes allow knowledge, but the attributor is mistaken about the subject's epistemic position relative to the *attributor's* action (or the attributor is speaking loosely). *Correction:* The attribution is **true** regarding the subject, but **unassertable** for the attributor due to their own high stakes. |
  | **2. Distributed Subject**<br>(Team with varied stakes) | The truth of 'We knew' is determined by the **spokesperson's context** at the time of utterance. If the spokesperson faces high liability, the 'we' attribution fails, regardless of individual members' stakes. | The truth of 'We knew' is determined by the **collective practical situation**. If any member's high stakes dictate the team's action, the team fails to know, regardless of the spokesperson's personal liability. |
  | **3. Hidden Stakes**<br>(Subject unaware of risk) | The truth of 'S knows' depends on whether the **attributor is aware** of the hidden stakes. If the attributor knows the risks, 'S knows' is false. The subject's ignorance is irrelevant to the semantics. | The truth of 'S knows' depends on the **objective risks** facing the subject. The subject fails to know because the penalty for error is high, even if the subject is ignorant of that penalty. |
  | **4. Deferred Stakes**<br>(Risk arises later) | The truth of 'S knows' depends on the **attributor's current context**. If the attributor currently faces no pressure, 'S knows' is true now, even if it will be false to say later. | The truth of 'S knows' depends on the **subject's future actionable stakes**. If the subject cannot check later, the current epistemic position must meet the future high standards now. |

  ## III. CRUCES FOR ADJUDICATION

  The following table lists specific arguments or empirical findings that bear on the dispute. We agree that these are the appropriate battlegrounds for resolution. We record our divergent predictions in advance.

  | Crux | Description of Test | Contextualist Prediction | Subject-Sensitive Invariantist Prediction |
  | :--- | :--- | :--- | :--- |
  | **A. Retraction Data** | A speaker attributes knowledge in a low-stakes context. Later, in a high-stakes context, they are asked: "Was what you said earlier true?" | The speaker should **retract** or deny the earlier truth ("I shouldn't have said that"). The earlier proposition was false in the current context of assessment. | The speaker should **stand by** the earlier claim ("It was true then"). The subject knew then; the current high stakes do not rewrite history. |
  | **B. Embedding** | Knowledge claims are embedded under operators (e.g., "If S knows, then..."). Does the stakes-sensitivity project through the operator? | Sensitivity should track the **attributor's context** at the time of the whole sentence, not the embedded clause's subject. | Sensitivity should track the **subject's stakes** within the embedded clause, independent of the main sentence's speaker. |
  | **C. Cross-Context Disagreement** | Attributor A (low stakes) says "S knows." Attributor B (high stakes) says "No, S doesn't know." Are they contradicting each other? | They are **not contradicting**. They are asserting different propositions indexed to their respective contexts. Both can be correct. | They are **contradicting**. They are asserting the same proposition about the subject. One must be wrong (likely B is wrong about the subject, or A is wrong about the standards). |
  | **D. The 'Mistake' Intuition** | In the Divergence Case (Sub-low/Attr-high), is the Attributor making a *mistake* by denying knowledge? | No. The Attributor is correctly tracking the semantic standards of their own context. | Yes. The Attributor is conflating their own practical situation with the subject's epistemic position. |

  ## IV. CLOSING NOTE ON THE NATURE OF THE DISPUTE

  As the convening epistemologist, I offer the following assessment regarding whether this dispute is merely verbal or substantive.

  A dispute is merely verbal if the parties agree on all non-linguistic facts and differ only on which words to use to describe them. A dispute is substantive if the parties posit different underlying structures of reality or normativity.

  **1. The Verbal Component:**
  There is a significant verbal overlap. Both sides agree that a subject with fixed evidence should not act as if they know when stakes are high. Both sides agree that an attributor in a high-stakes context should not utter "S knows" regarding a subject with low evidence. In terms of *guidance for action* and *assertability conditions*, EC and SSI often converge. If the debate were solely about when it is appropriate to speak, it would be largely verbal.

  **2. The Substantive Component:**
  However, the dispute is ultimately substantive. It concerns the **metaphysics of the knowledge relation**.
  *   The Contextualist posits that knowledge is a relation that includes a context parameter as a constituent of its truth conditions. This implies that knowledge is not a stable property of a subject but a shifting relation dependent on the evaluator.
  *   The Invariantist posits that knowledge is a stable property of the subject (relative to their environment), and that the attributor's context merely affects the pragmatics of reporting that property.

  This distinction bears on **retraction** and **disagreement**. If the Contextualist is correct, two speakers can disagree without contradiction, and past truths can become false. If the Invariantist is correct, knowledge is a fact about the world that persists independently of who is talking. Because these positions entail different commitments regarding the stability of truth and the nature of contradiction, the dispute is not merely verbal. It is a disagreement about the semantic architecture of our epistemic concepts, which cannot be resolved by paraphrase alone.

  ***

  **Signed:**

  _________________________
  *Epistemic Contextualist*

  _________________________
  *Subject-Sensitive Invariantist*

  _________________________
  *Convening Epistemologist*
