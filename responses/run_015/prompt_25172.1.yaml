      *   *Cumulative Progress:* Sciences accumulate results. Philosophy, by this analogy, sheds results. This makes philosophy look like a staging ground rather than a cumulative discipline.
      *   *Methodology:* Sciences leave because they find a method that works. Philosophy stays where methods don't work. This suggests philosophy is the "graveyard of failed methods" rather than the "mother of success."

