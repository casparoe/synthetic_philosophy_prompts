  No single principle; drop verdicts 5, 6, and 8 because they rely on inductive evidence rather than testimonial entitlement, contradicting your clause (c).

  Your proposed principle is a version of anti-reductionism (warrant is default, defeated by evidence), but your verdicts on 5, 6, and 8 are explicitly reductionist (warrant is created by evidence). In Case 5, the mechanic explicitly denies having grounds ("pure guess"), so clause (a) should block warrant; your increased credence comes from inductive inference about his expertise, not his say-so. In Case 6, trust in the aggregate is statistical reasoning about the unlikelihood of coordinated fraud, not entitlement to any single speaker's word. In Case 8, your trust is calibrated by the model's checkable accuracy record, which is pure induction; if clause (c) held, the checkable bits would merely remove defeaters, not generate positive warrant that varies with accuracy rates. To keep your principle, you must reclassify these as non-testimonial inferences.

  Case 4 reveals a different flaw: you value competence over sincerity. Your principle treats honesty and competence as binary defeaters in clause (b), but your verdict grants warrant to the dishonest competent mother while denying it to the honest incompetent brother. A coherent principle must weight truth-tracking capability higher than stated sincerity, or admit that "honesty" in clause (b) means "reliability" rather than "intent to tell the truth."

  Regarding your hypotheticals: (i) The circular chain (A←B←A) is worse than the long chain. Under your principle, circularity triggers clause (b) as a specific reason to doubt (no origin), whereas a long chain transmits entitlement indefinitely unless defeated. Intuitively, however, long chains degrade warrant, which your principle cannot explain without smuggling in reductionist transmission costs. (ii) Speakers of the evidential language would be epistemically worse off on hearsay. If their grammar forces them to violate clause (a) ("presented as true"), your principle grants them no entitlement. This suggests clause (a) is too strict; testimonial warrant should attach to information presented as *believable*, not necessarily as *known*.

  The confused cases are 5 and 8. You are treating expert inference and statistical reliability as testimony. Case 5 is trusting an expert's intuition, which is an argument from expertise, not acceptance of a statement. Case 8 is trusting a tool based on calibration, which is instrumentation, not testimony. Case 4 is also confused because it conflates lying with error; if your mother lies to protect you, she is not a testifier of fact but a provider of comfort, and believing her is not an epistemic act but an emotional one. Drop 5, 6, and 8 to save the principle, or drop clause (c) to save the verdicts.
