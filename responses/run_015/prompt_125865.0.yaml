      *   **Structure:** 7 specific sections with word count constraints.
      *   **Tone:** Practical, pedagogical, philosophically precise but grounded.

  2.  **Deconstruct Dennett's Taxonomy:**
      *   *Darwinian:* Hardwired. Trial and error happens across generations (evolution). Individual doesn't learn. Cost of error = death/non-reproduction.
      *   *Skinnerian:* Operant conditioning. Trial and error within lifetime. Cost of error = punishment/lost reward. Learns from actual outcomes.
      *   *Popperian:* Hypothesis testing inside the head. "Let our hypotheses die in our stead." Cost of error = mental energy, not physical death. Requires representation/model.
      *   *Gregorian:* Cultural tools/memes. Offloading cognition to the environment/tools inherited from others. Cost of error = using the wrong tool.
      *   *Baldwinian:* Evolution favors those who *can* learn specific things. Genetic bias towards learnable traits. Not hardwired behavior, but hardwired *learning propensity*.

  3.  **Design the Game:**
      *   *Task:* Needs to be simple enough to explain quickly but complex enough to allow strategy shifts. A pattern recognition or rule discovery task works best. Let's use a "Grid Navigation" or "Symbol Decoding" task. Let's go with **Symbol Decoding/Rule Discovery** using index cards. It allows for hidden rules and payoff shifts.
      *   *Teams:* 4 Teams (Darwinian, Skinnerian, Popperian, Gregorian) + 1 Team (Baldwinian). 18 students / 5 teams = ~3-4 students per team.
      *   *Restrictions:*
          *   Darwinian: Cannot change strategy mid-game. Pre-written script.
          *   Skinnerian: Can change based on immediate feedback (reward/punishment).
          *   Popperian: Can discuss/simulate outcomes before acting.
          *   Gregorian: Given a "tool" (cheat sheet/heuristic) from a previous "generation" (the instructor).
