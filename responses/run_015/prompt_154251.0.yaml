answer: |-
  The asymmetry you describe is a foundational but often unarticulated feature of modern historical science. It rests on a hybrid epistemology that combines **testimonial reductionism** (for texts) with **naive realism** (for materials). To reconstruct this implicit theory and evaluate its consequences, we must dissect the philosophical commitments regarding agency, causality, and the nature of the "trace."

  ### 1. The Implicit Theory of Knowledge: Causal Privilege vs. Testimonial Suspicion

  The institutional division presupposes a dualistic theory of evidence that distinguishes between **Intentional Traces** (texts) and **Causal Traces** (artifacts).

  *   **Texts as Testimony:** In the current paradigm, a text is treated as a speech act. Because it originates from a mind with intent, it is subject to the epistemology of testimony. The scholar assumes the possibility of *deception, error, or rhetoric*. Therefore, the default stance is **hermeneutic suspicion**. The text must be cross-examined like a witness.
  *   **Materials as Data:** Physical traces are treated as effects of natural or mechanical causes. A stratigraphic layer or a radiocarbon ratio is viewed as a "brute fact." Because a pot shard has no mind, it cannot *lie*. Therefore, the default stance is **positivist trust**. Uncertainty is framed as *technical noise* (calibration error, contamination) rather than *interpretive bias*.

  **The Philosophical Commitment:** This rests on the claim that **causal continuity grants epistemic privilege.** The assumption is that the chain of physical causation (Event $\rightarrow$ Deposit $\rightarrow$ Discovery) is more secure than the chain of semantic transmission (Event $\rightarrow$ Memory $\rightarrow$ Language $\rightarrow$ Text). It assumes that while a human narrator can distort reality, matter merely records it.

  However, this is philosophically unstable. It ignores that material traces are never encountered raw; they are always **mediated by selection and theory**. A ceramic typology is not a "fact" of nature; it is a taxonomic grid imposed by the archaeologist. To treat it as a direct constraint is to reify the model.

  ### 2. Entailment vs. Disciplinary Convention

  Is this asymmetry entailed by the nature of the objects? **No.** It is a disciplinary convention born of 19th-century specialization.

  *   **Texts are Material:** A manuscript is a physical object subject to decay, palimpsest, and material analysis (ink composition, parchment sourcing). It is a causal trace just as much as a pot.
  *   **Artifacts are Communicative:** A monument, a coin, or a grave good is an intentional act designed to convey meaning (status, belief, power). It is a "frozen speech act."

  **Rival Epistemologies:**
  The asymmetry is compatible with rival frameworks, most notably **Post-Processual Archaeology** (e.g., Ian Hodder), which argues that material culture is "text-like" and requires hermeneutic interpretation. Conversely, **Analytic Philosophy of History** (e.g., Aviezer Tucker) treats both texts and artifacts as probabilistic evidence subject to the same laws of inference.

  The current division is not a logical necessity but a **sociological boundary maintenance**. It allows historians to claim expertise in "meaning" and archaeologists to claim expertise in "truth."

  ### 3. A Uniform Critical Framework: The Symmetry Principle

  Could we apply a uniform framework without collapsing into global skepticism? **Yes**, by adopting the **Principle of Symmetry** (from Science and Technology Studies) and treating all evidence as **Inference to the Best Explanation (IBE)**.

  **Treating Radiocarbon as Testimony:**
  A radiocarbon date is not a direct window into the past; it is a **claim produced by a network of actors** (the sample, the accelerator mass spectrometer, the calibration curve, the lab technician).
  *   *Bias:* Just as Herodotus has a pro-Athenian bias, a C14 sample has a "reservoir effect" or "old wood effect."
  *   *Intent:* The "intent" of the date is determined by the sampling strategy. Why was *this* seed dated and not *that* one?
  *   *Critique:* We should interrogate the "testimony" of the lab report: What assumptions were made about the context? Is there corroborating testimony from other dating methods?

  **Treating Herodotus with Hermeneutic Charity:**
  Conversely, we can treat texts with the "material charity" usually reserved for artifacts.
  *   *Structural Integrity:* Instead of hunting for contradictions, analyze the text as a cultural stratigraphy. Where does the narrative "crack" under the weight of oral tradition?
  *   *Causal Weight:* Treat the text as a physical survivor. The mere existence of the text is a causal constraint on the past (someone wrote this, somewhere, sometime).
  *   *Function:* Analyze the narrative not for factual accuracy but for structural function, much like analyzing a tool for its use-wear.

  **Avoiding Skepticism:**
  This does not lead to skepticism because IBE does not require certainty. It requires **coherence**. If the textual testimony (Herodotus says a battle happened) and the material testimony (a layer of destruction ash exists) converge, the probability of the event increases. If they diverge, we do not default to the material; we investigate the *chain of mediation* in both.

  ### 4. Concrete Changes in Training and Exhibition

  If history departments and museums adopted a unified epistemology where **all antiquity is reconstructed from fallible traces**, the practical changes would be profound.

  #### A. University Curricula
  1.  **Unified Methodology Courses:** First-year graduate students in both fields would take "Epistemology of the Trace." They would learn that a stratigraphic unit is a hypothesis, not a fact, and that a chronicle is a material artifact, not just a story.
  2.  **Statistical Literacy for Historians:** Historians would be trained to read probability distributions (Bayesian modeling) rather than just accepting "dates." They would understand that "480 BCE" is often a mean value with a standard deviation, not a point on a timeline.
  3.  **Hermeneutics for Archaeologists:** Archaeologists would be trained in semiotics and narrative theory. They would learn to analyze the "rhetoric" of a grave arrangement or a settlement pattern, acknowledging that the "data" is already interpreted by the depositor.
  4.  **Failure Analysis:** Both disciplines would study *how* their evidence misleads. Historians would study cases of successful forgery; archaeologists would study cases of misinterpretation due to sampling bias (e.g., the "Site Formation Process" as a form of textual corruption).

  #### B. Museum Exhibitions and Labels
  Museums currently present timelines as solid lines and artifacts as definitive representatives of their era. A unified epistemology would require **Labeling the Inference**.

  *   **Current Label:** *"Bronze Sword, c. 1200 BCE. Found in Grave 4."*
  *   **Reconstructed Label:** *"Bronze Sword. Dated to 1200 BCE based on ceramic association in Grave 4. Note: The date relies on the assumption that the sword was deposited at the time of burial, not inherited. Radiocarbon dating of associated bone suggests a range of 1250–1150 BCE."*

  *   **Current Timeline:** A solid line showing the "Persian Invasion of 480 BCE."
  *   **Reconstructed Timeline:** A probability density visualization. The "Invasion" would be shown as a convergence of textual claims (Herodotus, inscriptions) and material traces (destruction layers, coin hoards), with visible gaps where the evidence is silent or contradictory.

  *   **Reconstruction Models:** Instead of photorealistic renders of ancient cities (which imply certainty), museums would use "transparency models" showing which parts are excavated, which are inferred from similar sites, and which are speculative.

  ### Conclusion

  The asymmetry between history and archaeology is not a logical necessity derived from the difference between words and things; it is a **residue of positivism** that grants matter a truth-telling capacity denied to language.

  By shifting to a unified theory of **Inference to the Best Explanation**, we acknowledge that a radiocarbon date is just as much a "statement" as a line of poetry, and a poem is just as much a "physical trace" as a sherd. This does not weaken our knowledge of the past; it strengthens it by exposing the chains of inference to scrutiny. It replaces the illusion of direct access (whether through "objective" science or "authentic" documents) with a robust, self-aware reconstruction of the past as a web of probabilistic traces. The result is a discipline that is less certain, but more honest about how it knows what it knows.
