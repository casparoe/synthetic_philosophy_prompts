          2.  Is the asymmetry entailed by the nature of the objects, or is it a disciplinary convention?
          3.  Can a uniform critical framework be applied without collapsing into skepticism? (Treating C14 dates as claims/testimony and Herodotus with hermeneutic charity).
          4.  What concrete changes would occur in training and museum labeling if a unified theory (Inference to the Best Explanation - IBE) were adopted?

  2.  **Analyze the Implicit Theory of Knowledge (Question 1):**

      *   *Current State:* History relies on *Testimonial Epistemology* (trust but verify the speaker). Archaeology relies on *Naturalistic/Positivist Epistemology* (data speaks for itself, filtered through scientific method).
      *   *The Divide:* It rests on the distinction between *Intentional Communication* (Text) vs. *Causal Trace* (Artifact).
      *   *The Privilege:* Material traces are granted "ontological security." A pot shard doesn't lie. But this ignores the *chain of custody* and *interpretive framing* (the "silence" of the artifact is filled by the archaeologist).
      *   *Philosophical Label:* This looks like a variation of the "Given" in empiricism. Materials are the "Given," texts are the "Constructed." Or, it's a form of *Scientific Realism* applied to matter vs. *Hermeneutic Suspicion* applied to language.

  3.  **Nature vs. Convention (Question 2):**

      *   *Is it entailed?* No. Texts *are* physical traces (ink on parchment). Artifacts *are* communicative acts (a monument is meant to convey power).
      *   *Convention:* It is largely disciplinary siloing. Historians train in philology; archaeologists train in science/typology.
      *   *Rival Epistemologies:* Yes. Post-processual archaeology already challenges the "objective data" view. Analytic philosophy of history treats both as evidence for IBE.

  4.  **Uniform Critical Framework (Question 3):**

      *   *Can we do it?* Yes.
      *   *Radiocarbon as Testimony:* A C14 date is a statement made by a machine/lab process. It has "intent" (calibration curves), "bias" (contamination), and "context" (sampling strategy). It can "lie" (old wood effect).
      *   *Herodotus with Charity:* Instead of just hunting contradictions, treat his narrative as a structural artifact. What function did the story serve? Treat it as a cultural stratigraphy.
      *   *Skepticism?* No, because IBE doesn't demand certainty, just comparative probability. Both sources become fallible indicators.

  5.  **Concrete Changes (Question 4):**

      *   *Training:* Historians need basic stats/materials science. Archaeologists need hermeneutics/semiotics. Both need philosophy of science.
      *   *Museums:* Labels shouldn't say "This is a sword from 1200 BCE." They should say "This object was found in Layer X, dated via Y method, interpreted as Z based on comparison with W." Acknowledge the inference chain. Timelines become probability distributions, not solid lines.

