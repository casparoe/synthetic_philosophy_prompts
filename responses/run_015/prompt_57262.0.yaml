answer: |-
  There is no established technical term in the analytic literature that captures this specific social mechanism. You are correct to distinguish it from the "dirty hands" problem itself, which diagnoses the agent's dilemma, and from "moral residue," which names the lingering normative status. The literature (Walzer, Williams, Nagel, Thompson) is overwhelmingly fixated on the *agent's* obligation to remain tainted. It treats the community's response as secondary or assumes the community should endorse the agent's guilt (e.g., by voting them out).

  The phenomenon you are describing—the collective appropriation of the debt and its discharge through esteem—is distinct. It is not merely forgiveness; forgiveness implies the wrong is pardoned but remains a wrong. This is a transmutation where the wrong becomes the *basis* of the credit.

  I propose we call this **Moral Commutation**.

  I choose this term for two reasons. First, it borrows from the legal sense of "commuting a sentence," where a penalty is substituted for a lesser one or a different form of obligation. Here, the penalty of guilt is commuted into the obligation of continued service, paid for by the currency of esteem. Second, it echoes the theological sense (commutation of penance), where a religious authority substitutes a lighter act of devotion for a heavier prescribed penance. In your cases, the polity acts as the confessor, telling the leader: "Your penance is to accept our gratitude and lead us further."

  ### The Definition (Conditions)

  For **Moral Commutation** to obtain, four conditions must be met:

  1.  **Affirmation of Transgression:** The act is publicly acknowledged as a moral violation under ordinary standards (it is not revisionism or denial).
  2.  **Assertion of Necessity:** The act is framed as indispensable for the collective's survival or greater good (the "dirty hands" justification).
  3.  **Social Appropriation of Residue:** The community explicitly claims ownership of the moral cost. The narrative shifts from "What *you* did" to "What *we* required of you."
  4.  **Prohibition of Residual Guilt:** The agent's continued expression of anguish or moral debt is reinterpreted not as integrity, but as a failure to accept the community's payment. To insist on one's own taint is to reject the community's authority to absolve.

  ### One Phenomenon or Two?

  You asked whether the conversion of taint into esteem and the shaming of the agent's ongoing anguish are one phenomenon or two. I argue they are **one**.

  The conversion of taint into esteem is the *transaction*; the shaming of ongoing anguish is the *enforcement* of that transaction. If the community honors the leader but allows them to remain publicly guilt-stricken, the commutation is incomplete—the debt is still visible. The social machinery only functions if the honor *extinguishes* the debt. Therefore, the hostility toward the leader's continued anguish is not a separate reaction; it is the necessary boundary maintenance of the commutation. If the leader refuses to accept the honor as payment, they are effectively defaulting on the social contract established by the commutation.

  ### Boundary Cases

  To earn its keep, the concept must handle the edges you identified. Here is how **Moral Commutation** behaves at the boundaries:

  **1. Compensation vs. Commutation**
  Does the phenomenon still obtain if the harmed parties are genuinely compensated (e.g., the flooded town is rebuilt better than before)?
  *   **Verdict:** Yes, provided the compensation is distinct from the leader's moral clearance.
  *   **Reasoning:** Moral Commutation concerns the *leader's* moral ledger, not the victims' material ledger. A community can pay the victims (justice) while simultaneously paying the leader in esteem (commutation). However, if the compensation is framed *as* the leader's penance ("He paid for it with his own political capital"), commutation is weakened. Commutation requires the *collective* to pay the moral cost via esteem, regardless of material restitution. If the leader pays materially, it is **Restitution**, not Commutation.

  **2. Refusal of Honor**
  Is it a distinct thing when the agent refuses the honors and demands to be blamed instead?
  *   **Verdict:** Yes. This is **Moral Dissent**.
  *   **Reasoning:** When the agent refuses Commutation, they are rejecting the polity's authority to define the moral value of the act. They are insisting that the residue is non-transferable. This creates a friction point: the polity sees a humble hero; the agent sees a criminal. This is distinct from Commutation because the transaction is rejected. It is philosophically significant because it tests the Walzerian claim that the agent *must* feel guilt. In Moral Dissent, the agent agrees with Walzer; the polity disagrees.

  **3. The Audience (Polity vs. Faction)**
  Does it matter whether the admiring audience is the polity as a whole or only the leader's supporters?
  *   **Verdict:** Yes. This distinguishes **Civic Commutation** from **Partisan Sanctification**.
  *   **Reasoning:** Moral Commutation, as a stabilizing political mechanism, requires a broad consensus that the act was necessary. If only a faction honors the leader while the rest condemn the act as a crime, the moral residue is not discharged; it is polarized. The "taint" remains active in the broader political culture (e.g., war criminals hailed by one party, prosecuted by another). True Commutation requires the *opponents* to also assent to the necessity, even if reluctantly. Without that, it is merely tribal defense, not a resolution of the moral dilemma.

  **4. Collapse into Propaganda**
  At what point does this collapse into propaganda?
  *   **Verdict:** When Condition 1 (Affirmation of Transgression) becomes performative.
  *   **Reasoning:** Commutation relies on the *reality* of the wrong to generate the *value* of the sacrifice. If the community stops believing the act was actually wrong—if the "torture" is reframed as "enhanced safety techniques" that no one truly regrets—then there is no moral residue to commute. The transaction becomes a sham. Propaganda denies the debt; Commutation acknowledges the debt but pays it off. The boundary is crossed when the language of "tragic necessity" is replaced by the language of "unqualified good."

  ### Summary

  You are observing **Moral Commutation**. It is the social process by which a political community purchases the moral innocence of its leaders using the currency of public esteem, predicated on the claim that the leaders' sins were actually sacrifices made on the community's behalf. It is distinct from Dirty Hands (which is the dilemma), Moral Residue (which is the cost), and Whitewashing (which denies the cost). It is the specific mechanism by which democracies reconcile the need for effective, ruthless leadership with the demand for moral accountability.

  It is a stable phenomenon only so long as the community genuinely believes the wrong was necessary. When that belief fractures, Commutation collapses into Polarization (Partisan Sanctification) or Scandal (where the residue is reclaimed and demanded as punishment).
