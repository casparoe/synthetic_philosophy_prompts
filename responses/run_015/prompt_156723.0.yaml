answer: |-
  You have stumbled upon the central tension in modern nationalism studies without needing to wade through the academic footnotes. Your intuition is remarkably sharp, particularly regarding the distinction between 'invented' and 'fake'. The trouble you are having is not because your verdicts are wrong, but because you are conflating two different questions: the ontological one (is this nation real?) and the normative one (is this national narrative healthy or legitimate?).

  There is a coherent account that captures all your verdicts, but it requires refining your hunch about 'vertical' versus 'horizontal'. The dividing line is not about whether a nation claims ancient roots (Scotland does, the USA does not), nor is it strictly about top-down versus bottom-up (the USA was top-down constitutionalism, Armenia was bottom-up survival).

  The unifying principle is **Reflexive Viability**.

  Here is the account: A nation is ontologically 'real' whenever there is a sustained collective intentionality—a group of people acting as though they belong together. However, the *legitimacy* of that nation's narrative depends on whether it can survive being known as a construct.

  **The Principle of Reflexive Viability**
  A national narrative is healthy (and thus feels 'authentic' to you) if the community can acknowledge its constructed nature without the social bond dissolving. It is pathological (and feels 'false' or 'worse', like Meiji Japan) if the state requires citizens to believe the myth is literal historical truth to maintain order.

  Let us apply this to your cases to see if it holds.

  **1. Scotland (The Invented Tradition)**
  You verdicted this as real despite the invention. Under Reflexive Viability, this works because the tartan myth is now reflexive. We know it was romanticised in the 19th century, yet we wear the kilts anyway. The social bond survives the historical scrutiny. The practice carries the weight, not the pedigree.

  **2. France 843 (The Anachronism)**
  You verdicted this as false. This fits because there was no collective intentionality. A peasant in Burgundy in 843 did not act as though they were 'French' in the modern sense. There was no 'we' to be reflexive about. It is a projection, not a social fact.

  **3. Meiji Japan (The Divine Line)**
  You verdicted this as 'worse'. This is the crucial test. The Meiji oligarchs did not just invent a tradition; they weaponised it. They demanded that the fiction be accepted as biological and theological fact. To question the Emperor's divinity was treason. The narrative could not survive reflexivity; it required ignorance. That is why it feels oppressive compared to Scotland.

  **4. The Armenian Diaspora (The Stateless Nation)**
  You verdicted this as real and horizontal. This works because the intentionality was sustained voluntarily through trauma and culture, not state coercion. It was reflexive in the sense that the community knew exactly why they were holding together (survival), without needing to pretend they possessed a state apparatus they did not have.

  **5. The USA (The Civic Nation)**
  You verdicted this as openly modern. This is the peak of Reflexive Viability. The founding myth is explicitly contractual (1776, Constitution). It invites scrutiny. You can be a patriotic American while acknowledging the founders were flawed humans, not demigods. The bond is political, not mystical.

  **The Troubling Case: The Post-Colonial State**
  This is where your gut wavers, but the principle gives a clear answer. It depends entirely on what happens when the fabrication is revealed.

  If the state hires historians to craft a 500-year story, teaches it, and after two generations people live inside it *while knowing it is a bit of a stitch-up* (much like the Scots know about the tartans), then it becomes authentic via Reflexive Viability. It becomes a useful operative myth.

  However, if the state teaches the story and punishes those who point out the gaps, or if the state collapses when the fabrication is exposed, then it is Meiji-style. It is a coercive falsehood.

  So, your verdict on this case should not be fixed on the origin (the hiring of historians), but on the **permission to question**. If the narrative becomes rigid dogma, it is illegitimate. If it becomes flexible folklore, it is authentic.

  **Which Verdict to Drop?**
  If you must drop something to make the system perfectly coherent, you should drop the idea that Meiji Japan was ontologically 'fake' compared to Scotland. Ontologically, they were identical: both were modern constructs claiming ancient lineage. The difference was purely normative (ethical/political). Meiji was not less of a nation; it was a more dangerous one. Recognising this separates the question of 'what is a nation' from 'what is a good nation'.

  **The Diaspora Question**
  You asked about a diaspora that gains a state and starts manufacturing traditions. Does it become 'real' in a different way?

  Yes. When a horizontal community (diaspora) captures a vertical apparatus (state), the nature of the tradition shifts.
  *   **Horizontally**, the tradition is a tool for mutual recognition.
  *   **Vertically**, the tradition becomes a tool for boundary enforcement.

  If the new state uses its power to mandate the new traditions as the *only* way to be a member of the nation, it loses its horizontal authenticity and moves toward the Meiji model. It becomes 'real' in the sense of having coercive power, but 'false' in the sense of Reflexive Viability.

  However, if the state adopts the manufactured traditions as ceremonial whilst allowing civil society to maintain the organic, horizontal practices, it can retain its authenticity. It becomes like Scotland: a state that manages the myth, rather than a myth that manages the state.

  **Summary**
  Your gut is correct that origin matters less than practice. But the specific quality of that practice is **reflexivity**. Nations are not old or new; they are stories we tell to organise ourselves. They are 'good' stories when we know they are stories. They are 'bad' stories when we are forced to believe they are facts.

  Stick to that, and your argument should hold up regardless of which case study you throw at it.
