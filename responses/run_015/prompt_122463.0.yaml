answer: |-
  1. **Sequence and Dependencies**
     *Your suspicion is incorrect; Witness must precede Discharge.*

     **Segment 1: The Private Flinch (0–20 min)**
     Establish that shame persists without an audience. Use the carrying case (hidden sabotage) to show the agent winces alone.
     *Dependency:* If skipped, students will attribute the inability to discharge shame (Segment 2) to external social blocking rather than internal structure, preserving the misconception that shame is merely fear of exposure.

     **Segment 2: The Discharge Asymmetry (20–50 min)**
     Contrast guilt's repair procedures (confession, penance) with shame's deadlock (concealment, rage, exit). Reopen the case: Why can't the saboteur fix this?
     *Dependency:* If skipped, the cultural analysis (Segment 3) lacks a mechanism; students cannot see how practices alter emotional ecologies if they view emotions as static responses rather than processes with entry/exit conditions.

     **Segment 3: Practices and Substitution (50–90 min)**
     Argue cultures select practices, not emotions. Introduce the substitution effect: Public exposure destroys the standing an offender needs to make amends, so practices intended to intensify shame manufacture the shamelessness they deplore. Decline to settle which emotion is "better."
     *Dependency:* If the "practices not emotions" distinction is not made here, the session collapses into moralizing about shame's toxicity rather than analyzing the institutional architecture that produces it.

  2. **Misconception Map**
     *   **Seg 1:** *Shame is fear of being found out.* Defuse this immediately using the private sabotage case. *Shame is about status, not morals.* Use this: acknowledge shame tracks status to show why it binds communities, complicating the "liberal guilt vs. illiberal shame" binary.
     *   **Seg 2:** *Guilt is safe because it attaches only to acts.* Use this: show how guilt can metastasize if repair is blocked, preventing a clean "good guilt/bad shame" verdict. *Shame tips into humiliation/rage.* Place this here as the functional equivalent of guilt's repair impulse gone wrong.
     *   **Seg 3:** *Culture can choose to have less shame.* Defuse this by showing shame is a byproduct of exposure practices. *Anthropological guilt/shame cultures.* Address explicitly here to prevent confusion; frame it as dominant institutional practices, not psychological typologies. *Shameless person lacks social anxiety.* Defuse: argue they lack a grip on the standard itself.

  3. **Carrying Case: The Hidden Sabotage**
     **Specification:** A colleague's work was subtly undermined years ago. The act was deliberate. It was never discovered. No consequences remain (the colleague succeeded anyway). The agent still winces when remembering it.
     **Must-Have:** Deliberate intent (rules out accident); Total privacy (rules out audience fear); Irreversibility (rules out simple repair); Continued affective grip (rules out indifference).
     **Must-Not-Have:** Public exposure (undoes Segment 1); Grave wrong like murder (triggers desert arguments); Trivial accident (fails to generate shame).
     **Silence:** Do not specify the agent's current relationship with the colleague; keep the focus on the internal state.
     **Reopening Points:**
     1.  **Segment 1:** Introduce as "The Unobserved Agent." Ask: "Why does she flinch if no one knows?"
     2.  **Segment 2:** Re-describe as "The Stuck Agent." Ask: "She could confess now, but she won't. Why doesn't confession work here like it does for guilt?"
     3.  **Segment 3:** Re-describe as "The Exposed Agent." Ask: "If we force her to confess publicly to 'clear the air,' does that enable repair or destroy her standing to repair?"

  4. **Assessment Question**
     **Question:** "If a student cheats on an exam, feels terrible, confesses to the professor, accepts the penalty, and moves on without self-loathing, which emotion did they feel? If another student cheats, is never caught, but drops the course because they cannot bear to see their classmates, which emotion is operating?"
     **Right Answer That Sounds Wrong:** "The first student felt shame, not guilt."
     **Why:** Students memorizing the slogan ("Guilt = act, Shame = person") will say the first is guilt because it involves repair. A student understanding the distinction knows guilt allows discharge via repair; if the emotion disappears after penalty, it functioned as guilt. However, the *second* student demonstrates the core of shame (withdrawal/exit) even without public exposure. The "wrong-sounding" answer requires recognizing that the *mechanism of discharge* defines the emotion, not just the object. If you mark "Guilt" for the first scenario, you confirm the slogan; if you accept "Shame" (because the self was implicated), you miss the discharge asymmetry. The correct nuance is: The first is guilt *because* it discharged. The second is shame *because* it forced exit.
