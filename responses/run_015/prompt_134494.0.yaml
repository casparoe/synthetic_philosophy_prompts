answer: |-
  There is no canonical name for this specific asymmetry in the literature. Standard discussions of Origin Essentialism (Kripke, Mackie, Robertson) treat the "origin" as a monolithic block—typically the zygote or the gametic pair—without decomposing the biological conditions surrounding fertilization and early gestation.

  For your seminar, I propose we coin this **"Gametic Exceptionalism."**

  It is not merely sloppy essentialism; it is a structured metaphysical bias. Below is the conceptual carving you requested, mapping the boundaries of the view, its underlying ontology, and how it distinctively differs from Standard Origin Essentialism and the Non-Identity Problem.

  ### 1. The Concept: Gametic Exceptionalism
  **Definition:** The metaphysical commitment that treats *gametic provenance* (specific sperm and egg) as a necessary condition for transworld identity, while treating *co-constitutive early biological conditions* (microbiome colonization, epigenetic methylation patterns, uterine chemical environment) as contingent properties, despite their equivalent causal necessity for the resulting cognitive phenotype.

  **The Asymmetry:**
  *   **Gametes:** Treated as **Individuating Conditions**. Change the sperm, you get a *different* entity.
  *   **Microbiome/Epigenetics:** Treated as **Characterizing Conditions**. Change the bacteria or methylation, you get the *same* entity with different properties.

  ### 2. The Carving: Why the Distinction Exists
  To understand if this is "sloppy" or "distinctive," we must identify the boundary line proponents are drawing. It is not drawn at *causal impact* (since both affect cognition) nor at *temporal proximity* (both occur at $t_0$).

  The boundary is drawn at **Lineage vs. Constitution.**

  *   **The Gametic Privilege:** Gametes are viewed as the *substance* of the ancestor continuing into the descendant. They carry the "code" that links the organism to its historical lineage. In this view, identity is diachronic continuity of genetic material.
  *   **The Environmental Exclusion:** Microbiome and epigenetics are viewed as *context*. Even if they are biologically internalized within 48 hours, they are metaphysically categorized as "environment acting on organism" rather than "organism constituting itself."

  **Is it Sloppy?**
  It is not logically sloppy; it is **ontologically conservative.** It relies on a **Substance Metaphysics** rather than a **Process Metaphysics.**
  *   **Substance View:** You are a "thing" that starts at fertilization. The gametes create the thing. Everything else happens *to* the thing.
  *   **Process View:** You are a developmental trajectory. The gametes are just the initial parameters. If the microbiome is required to launch the trajectory (e.g., immune system calibration required for brain development), excluding it from "origin" is arbitrary.

  **Gametic Exceptionalism** is the defense of the Substance View against the encroachment of systems biology. It insists that *source* matters more than *structure*, even if structure is causally determinative of the personhood traits we care about.

  ### 3. Differentiation from Standard Origin Essentialism
  Standard Origin Essentialism (OE) is the genus; Gametic Exceptionalism is a specific, unacknowledged species of it.

  *   **Standard OE:** Claims "You must come from *this* origin." It usually stops at the zygote. It treats the zygote as a black box.
  *   **Gametic Exceptionalism:** Opens the black box. It asserts that within the causal cluster of "origin," the *genetic contribution* is essential, but the *epigenetic/biological context* is accidental.

  **The Boundary Line:**
  Standard OE asks: "Is this the same zygote?"
  Gametic Exceptionalism asks: "Is this the same genetic code, regardless of the zygote's immediate biological environment?"

  *Example:* If we could swap the nucleus of a zygote but keep the exact cytoplasmic environment (mitochondria, methylation markers), Standard OE says identity is broken (different zygote). Gametic Exceptionalism says identity is preserved (same nuclear DNA). If we keep the nucleus but swap the methylation markers, Gametic Exceptionalism says identity is preserved (same person, different traits). This reveals the bias: **Nuclear DNA is essential; Cytoplasmic/Environmental context is accidental.**

  ### 4. Differentiation from the Non-Identity Problem
  This is a crucial distinction for your seminar, as they are often conflated.

  *   **The Non-Identity Problem (Parfit):** This is an **ethical/logical** problem. It asks: "If an action changes *who* comes into existence, can we say that action harmed them?" It *uses* Origin Essentialism as a premise to generate a moral paradox. It is concerned with the *consequences* of identity shifts for moral responsibility.
  *   **Gametic Exceptionalism:** This is a **metaphysical** critique. It asks: "What are the actual criteria for the identity shift?" It does not care about harm or obligation. It cares about the *coherence of the criteria*.

  **The Divergence:**
  You can accept the Non-Identity Problem without accepting Gametic Exceptionalism.
  *   *Scenario:* A mother takes a drug that alters the fetus's epigenome but not the gametes.
  *   *Non-Identity Analysis:* Did this action create a different person? (Ethical/Legal focus).
  *   *Gametic Exceptionalism Analysis:* Why do we say the gametes determine the person, but the epigenome (which actually drives the cognitive outcome) does not? (Metaphysical focus).

  Gametic Exceptionalism undermines the Non-Identity Problem by suggesting the "identity" threshold is drawn in the wrong place. If epigenetics are essential, then many actions thought to be "same-person" alterations might actually be "different-person" creations, or vice versa.

  ### 5. Summary for the Seminar
  If you need to present this sharply, use this triad:

  1.  **The Phenomenon:** We treat genetic origin as **Constitutive** (makes the person) but early biological environment as **Modulative** (changes the person).
  2.  **The Label:** **Gametic Exceptionalism**.
  3.  **The Critique:** This is not a causal distinction (both are causally potent); it is a **lineage distinction**. It privileges *where you came from* (ancestry) over *how you are built* (constitution).

  **The "Carving" Conclusion:**
  Gametic Exceptionalism is the metaphysical residue of pre-modern biology (preformationism) surviving in modern essentialism. It treats the sperm/egg as the "seed" containing the whole person, and the womb/microbiome as merely the "soil." Modern biology shows the soil is part of the seed's expression. Therefore, Gametic Exceptionalism is a **category error** regarding biological individuation. It mistakes *genetic continuity* for *personal identity*.

  This gives you a precise target: you aren't just attacking Origin Essentialism broadly; you are attacking the *selective weighting* of origin factors within it.
