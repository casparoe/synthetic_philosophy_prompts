answer: |-
  You have stumbled onto one of the most persistent problems in moral philosophy, famously articulated by Thomas Nagel and Bernard Williams. Your intuitions are not broken; they are simply reflecting the conflict between two competing frameworks: the **Control Principle** (we are only responsible for what we control) and our **Reactive Attitudes** (we respond emotionally to harm and character).

  To bring your verdicts into coherence, you need a principle that distinguishes between **Moral Blameworthiness** (internal desert) and **Social/Legal Liability** (external consequences).

  ### The Unifying Principle: The Agency-Capacity View

  **Principle:** *An agent's moral worth is determined solely by the quality of their will and the exercise of their agency within the bounds of their capacity. Outcomes determined by luck do not alter moral worth, though they may alter liability.*

  Here is how this principle sorts your cases, what it forces you to abandon, and how it resolves your unease.

  #### 1. Where the Principle Validates Your Intuitions
  This principle fits perfectly with your cases regarding **capacity** and **action**:

  *   **Case 2 (The Bigot):** **Validated.** Their *capacity* to recognize the moral truth was constrained by their upbringing (circumstantial luck). Their will wasn't necessarily worse; their epistemic tools were poorer. Mitigation is appropriate.
  *   **Case 3 (Bravery vs. Fear):** **Validated (with nuance).** Even if fear responses are genetic, we praise the *exercise of agency* over the instinct. The brave person's will *acted*; the fearful person's will *succumbed*. We judge the manifestation of the will, not just its raw materials.
  *   **Case 5 (Fantasy vs. Attempt):** **Validated.** Crossing into action is an exercise of agency. Fantasy is passive; attempting is an active imposition of will on the world.

  #### 2. Where the Principle Forces You to Abandon Verdicts
  To be consistent with Case 2 and 5, you must revise your verdicts on **Resultant Luck** (Cases 1, 4, 6, 7).

  *   **The Sacrifice:** You must abandon the claim that the drunk driver who kills (Case 1), the successful murderer (Case 4), the negligent parent (Case 6), and the failed businessperson (Case 7) are **more blameworthy** than their lucky counterparts.
  *   **The Reasoning:** In all these pairs, the *risk imposed* and the *quality of will* (recklessness, malice, negligence) were identical. The only difference was luck. If luck mitigates blame in Case 2 (upbringing), it should mitigate blame in Case 1 (outcome).
  *   **The "Absurdity" Clue:** You noted that Case 7 (Business) looks absurd. Case 6 (Parents) makes you uneasy. These are your "canaries in the coal mine." They signal that your deep moral theory rejects resultant luck, even if your emotional reactions accept it. Case 1 (Drunk Driving) feels different only because a child died, triggering a visceral demand for retribution that clouds the moral calculus.

  #### 3. The Reconciliation: Two Tiers of Judgment
  You don't have to lose *all* your verdicts if you adopt a **Two-Tiered System**. This allows you to keep your practical judgments while fixing your moral theory.

  *   **Tier 1: Moral Blame (Internal):** Based on the Agency-Capacity Principle.
      *   *Verdict:* The drunk driver who killed and the one who didn't are **equally blameworthy**. The parent whose child drowned and the one whose didn't are **equally negligent**.
  *   **Tier 2: Social Liability (External):** Based on Harm and Restitution.
      *   *Verdict:* The drunk driver who killed deserves **more punishment**. The parent whose child drowned owes a **greater debt**.
      *   *Why?* Not because they are worse people, but because (a) society must deter risky behavior, (b) victims require restitution, and (c) our emotional reactive attitudes (grief, anger) are triggered by harm, not just risk.

  **How this fixes the inconsistency:**
  It explains why Case 7 feels absurd. In business, "restitution" is often abstract (lost livelihoods vs. profits), and the "harm" is often seen as a systemic risk rather than a rights violation. In Cases 1 and 6, there is a specific victim with a right to safety that was violated. The *liability* is higher in 1 and 6 because the *harm* is concrete, even if the *blame* is the same.

  ### The Rescue Case

  **The Scenario:** Two people attempt a rescue in identical danger. One succeeds; the other fails through no fault of their own (e.g., the victim slips away at the last second).

  **Applying the Agency-Capacity Principle:**
  *   **Moral Praise:** They are **equally praiseworthy**. Their will, courage, and effort were identical. The outcome was luck.
  *   **Social Reward:** The successful rescuer might get a medal; the failed one might get a thank-you. This is Tier 2 (Social Liability/Reward). We celebrate outcomes because they validate the risk, but morally, the failed rescuer is a hero just the same.

  **Applying the Inconsistent View (if you keep Resultant Luck):**
  *   You would have to say the successful rescuer is a *better person* than the failed one. This feels wrong because it suggests morality is a lottery.

  ### Summary of Recommendations

  1.  **Adopt the Principle:** Moral responsibility tracks **Agency and Capacity**, not Outcomes.
  2.  **Abandon:** The idea that the agents in Cases 1, 4, 6, and 7 are *morally worse* than their lucky counterparts.
  3.  **Retain:** The idea that they may deserve *different treatment* (punishment, restitution) due to the harm caused.
  4.  **Resolve the Unease:** Your discomfort with Case 6 and 7 is correct. They reveal that Outcome Luck *shouldn't* determine blameworthiness. Your hesitation on Case 1 is due to the intensity of the harm, not a difference in moral logic.
  5.  **Verdict on Rescue:** The failed rescuer is morally equal to the successful one.

  By separating **who you are** (Moral Worth) from **what you owe** (Liability), you can keep most of your verdicts without the logical contradiction. You stop blaming the *person* for the luck, but you still hold them accountable for the *mess* the luck created.
