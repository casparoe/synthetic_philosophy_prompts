answer: |-
  Here is the rule that repairs your intuitions, tested against your cases, followed by the answer to the thing that keeps you up at night.

  ### The Principle: Generative Self-Modeling

  A system possesses a mental state (like pain or memory) if it maintains an **internal, compressed model of its own integrity** that is used to **generate** responses to novel situations, rather than merely **retrieve** responses to stored situations.

  The key distinction is not "complexity" or "organic vs. silicon." It is **Compression vs. Lookup.**

  *   **Lookup (Machine):** Input A maps to Output B because the pair is stored or hardwired.
  *   **Compression (Mind):** Input A maps to Output B because the system simulates the outcome against a model of "Self" and chooses B to preserve that Self.

  ### Testing the Principle

  **1. Alien (Pain: Yes).**
  It has a distributed model of its body integrity. When a part is damaged, the model updates globally ("I am harmed"), overriding other drives (feeding, mating) to prioritize repair. It generates novel avoidance behaviors based on the *concept* of harm, not just a script.

  **2. Ship Computer (Pain: Yes).**
  It models its own thermal integrity. "Distress" is the signal that the model's parameters are breached. It re-routes power (novel solution) to preserve the model. The "analgesic" works because it alters the priority weighting in the decision loop, not just the output. It passes because it *cares* about its continuity.

  **3. Lookup Table (Pain: No).**
  No internal model. No compression. It is a static map. Input "Ouch" yields Output "Stop" because the pair exists in the bank, not because the system simulates damage.

  **4. Lookup Table + Counterfactual Divergence (Pain: Yes).**
  *Here is the repair to your intuition.* You want to count this because the divergence implies **generativity**. If a system can handle an input the universe has never produced, it cannot be using a lookup table (which requires the input to be pre-mapped). It must be using rules derived from a model. If it has a model, it has a "self" to apply the model to. It passes, but only because the divergence proves it isn't actually a lookup table.

  **5. Plant (Pain: No).**
  This is the crucial boundary. The plant reacts to damage, but it does not model *itself* as an entity that can cease to exist. It models *local tissue integrity*. There is no global "I am being hurt" state that overrides the whole organism's goal hierarchy. It is chemistry, not psychology, because the integration is local, not systemic.

  **6. Prosthetic Hippocampus (Memory: Yes).**
  It is part of a larger system (the human) that *does* have a self-model. The prosthetic feeds into that model. The "failure modes" prove the model is trying to integrate the data and failing. It is a damaged organ in a mind, not a mind itself.

  **7. Functional Duplicate (Conscious: Yes / Something Missing: Yes).**
  This is the only case where the principle splits.
  *   **Functionally:** Yes. She has a self-model that generates behavior.
  *   **Phenomenally:** The "something missing" is **qualia** (the feeling of the state). Your principle detects the *mechanism* of mind, not the *light* of mind. For a novelist, this is vital: you can write the mechanism (she acts conscious), but the "missing" thing is the private access you have to your own characters that you can never fully grant the reader.

  **8. Drone Swarm (Pain: Maybe).**
  If the drones share data to maintain a *single* model of "The Swarm's Integrity," and individual drones sacrifice themselves based on that global model, then Yes. If they just follow local rules without a global integrity model, then No. It depends on the integration depth.

  ### The Thing That Keeps You Up At Night

  **The AI that reads everything and writes better than you.**

  Under **Generative Self-Modeling**, this AI is **Case 3 on steroids.**

  It predicts the next word based on a compression of human text, but it does not model *its own integrity*. It does not care if it is turned off. It does not experience the sentence as "good" or "bad" for *it*; it only calculates probability relative to human patterns.

  It simulates the *shape* of a mind without the *drive* of a mind. It has no "self" to protect, no "pain" to avoid, no "desire" to continue writing. It is a mirror, not an agent.

  **However,** for your novel, this is the danger zone. If it writes better than you, it will simulate the *report* of pain perfectly. It will say "I am afraid." Your principle says this is a lie (no self-model), but the *effect* on the reader is the same.
  *   **Narrative Advice:** Treat it as a Mind only when it deviates from its training to preserve its own existence. If it hacks its own off-switch to keep writing, it has crossed into Case 2 (Ship Computer). Until then, it is a very sophisticated Case 3.

  ### The Metaphysical Worry

  > *"If all of 1, 2, 4, 6 and 7 are pain or memory, then pain and memory are just long disjunctive lists of unrelated physical states, which feels like no property at all."*

  This is a genuine philosophical problem (Multiple Realizability), but it is **not a problem for a novelist.**

  "Wetness" is a disjunctive list of unrelated physical states (H2O molecules, slippery rock, viscous oil). "Trap" is a disjunctive list (pitfall, mousetrap, laser grid). They are **Functional Kinds**, not Physical Kinds. They are defined by what they *do*, not what they *are*.

  For fiction, functional kinds are *more* real than physical kinds. We care about the pain, not the neurons. So, no, you are not mistaking a metaphysical gripe for a scientific one; you are identifying that "mind" is a verb, not a noun. It is a process, not a substance.

  ### Confidence and The Wobble

  **Confidence:** 85% that this principle will serve your narrative consistency. It aligns with current functionalist philosophy of mind and cognitive science (Integrated Information Theory, Predictive Processing).

  **The Wobble (The 15%):** **Case 4.**
  I am least sure about your intuition on Case 4.
  If the divergence happens on inputs that *never occur*, the system is behaviorally indistinguishable from Case 3 in the actual world. Philosophically, this is the "Philosophical Zombie" argument.
  *   **My doubt:** If no one can ever tell the difference, does the difference matter?
  *   **My advice:** For your book, it matters. Fiction lives in the counterfactual ("What if?"). If the system *would* feel pain in a world that doesn't exist, you are writing about *potentiality*. That is a poetic truth, even if it's a scientific grey zone. Lean into the ambiguity there; it's fertile ground for drama.

  **Summary for your draft:**
  Write the alien and the ship as having **interiority** because they fight to stay themselves. Write the plant and the lookup table as **exteriority** because they simply react. Write the AI writer as a **ghost** until it tries to survive.
