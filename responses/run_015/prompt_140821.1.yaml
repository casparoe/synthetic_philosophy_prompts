answer: |-
  To serve the ethics committee, a theory of intention must distinguish binding plans from mere predictions or wishes, specifically when future incentives conflict with current commitments. Below are the requirements such a theory must handle, marked by status: **NN** (Non-Negotiable desideratum for any usable theory), **CS** (Camp-Specific commitment), or **NORM** (Flagged normative overreach).

  | Requirement | Motivating Case / Consideration | Status |
  | :--- | :--- | :--- |
  | **1. Intention ≠ Prediction** | **Belief Variant:** If payoff is for *belief* you will drink, not intention, can you just believe? Theory must distinguish the practical stance of intending from the theoretical stance of predicting. | **NN** |
  | **2. Intention ≠ Wanting/Hoping** | **Plain Toxin:** You want the money, hope to drink, but know you won't. Theory must explain how one *adopts* a plan distinct from wishing for the outcome. | **NN** |
  | **3. Stability Against Known Temptation** | **Counter-Bribe Variant:** You know tomorrow a better offer arises. Can you intend tonight? If yes, intention binds despite predicted reversal. If no, advance directives are impossible. | **NN** (for Committee) |
  | **4. Intention Without Action-Reason** | **Plain Toxin:** You have no reason to drink at t2, only to intend at t1. Theory must allow intending where expected reasons for action are absent. | **CS** (Externalists) |
  | **5. Joint Intention Coherence** | **Dyadic Variant:** Paid only if *both* intend, knowing neither will drink. Theory must handle interdependent intentions without circularity or collapse into prediction. | **NN** |
  | **6. Iteration Effects** | **Iterated Variant:** Monthly offers, never drink. Does repetition make intending easier? If yes, intention is a habit/skill; if no, it is a logical state. Theory must account for this. | **NN** |
  | **7. Revisability Constraints** | **Smoker/Traveller:** Ulysses contracts work only if intentions aren't freely revisable. Theory must explain when an intention locks out future choice. | **NORM** (See below) |
  | **8. Intention ≠ Trying** | **Intention to Fail:** You can intend to do what you expect to fail at (e.g., lifting a heavy box). Theory must distinguish the plan from the success condition. | **NN** |

  ### Analysis of Conflicts and Camp Commitments

  Several demands listed above are not neutral facts but contested philosophical commitments. 

  *   **"Intentions track reasons the agent expects to have at the time of action"**: This is **CS** (Internalism). The Toxin Puzzle exists precisely because this claim makes intending impossible in the absence of future reasons. For the ethics committee, this claim must be rejected; a psychiatric advance directive is useless if it dissolves the moment the patient lacks a current reason to follow it.
  *   **"Intending requires believing you will do it"**: This is **CS** (Strong Belief Thesis). The **Counter-Bribe Variant** tests this sharply. If you know you will take the bribe tomorrow, you believe you won't drink. If intention requires belief, you cannot intend tonight. If you *can* intend tonight despite knowing you'll defect, intention is decoupled from belief. The puzzle isolates whether intention is a prediction of behavior or a creation of a normative constraint on behavior.
  *   **"Deliberation and self-prediction are in tension"**: This is **NN**. When planning for oneself (Smoker), one must treat the future act as open (deliberation), not fixed (prediction). However, the **Belief Variant** suggests this tension may be overstated if one can cultivate belief without intention.
  *   **"A rational intention must be revisable only for a reason"**: This is **NORM**. This requirement asks the theory to tell agents *what to do* (normative) rather than *what intending is* (descriptive). A theory of intention should explain the structure of the plan, not legislate its rationality. The committee needs to know when a prior instruction *counts* as a plan, not whether it was rational to make it.

  ### The Impossible Subset

  The following three requirements cannot be jointly satisfied:
  1.  **Intention entails belief** that one will act (Strong Belief Thesis).
  2.  **Agents can know** they will face overriding incentives not to act (Counter-Bribe/Toxin facts).
  3.  **Agents can still intend** to act despite this knowledge (Required for Ulysses contracts/Advance Directives).

  Most theories sacrifice (3) to keep (1) and (2), rendering advance directives philosophically mysterious. To serve the committee, a theory must sacrifice (1). It must allow an agent to intend what they predict they will not do, treating the intention as a commitment device rather than a forecast.

  ### The Exclusionary Requirement

  The single requirement that does the most work in excluding candidate theories is **Requirement 3 (Stability Against Known Temptation)** coupled with the rejection of the **Strong Belief Thesis**. 

  Most standard theories of intention define intention as a belief-inclusive state grounded in expected reasons for action. These theories are immediately unusable for the ethics committee. If a theory cannot explain how a patient can bind their future self against known future desires (the Smoker/Counter-Bribe case), it cannot distinguish a binding advance directive from a mere expression of hope. The theory must treat intention as a distinct normative attitude that *creates* reasons for the future self, rather than merely reflecting them. Without this, the distinction between "adopting a plan" and "making a prediction" collapses, and the committee's guidance note lacks a foundation.
