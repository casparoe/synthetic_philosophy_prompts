answer: |-
  # Activity Design: The Precision Trap

  ## 1. Activity Overview
  **Title:** The Decimator  
  **Core Mechanism:** The "Shift Map" ($x_{n+1} = 10x_n \mod 1$).  
  **Why:** It requires only high-school algebra (multiply by 10, drop the whole number), but it mathematically guarantees that one decimal digit of precision buys exactly one step of prediction. It creates a hard, countable limit on foresight that is independent of intelligence or computing power.

  ## 2. Materials (To Print/Prepare)
  1.  **Betting Ledgers (Index Cards):** 18 cards. Pre-printed table with 6 rows (Rounds 1–6). Columns: *Round, Prediction (H/L), Confidence (1/2/3), Outcome, Score Change, Total.* Include a "Payoff Table" on the back.
  2.  **Predictor Sheet:** One sheet for the volunteer student. Contains the Rule ($x_{new} = \text{decimal part of } 10 \times x_{old}$) and the Starting Value ($0.314159$).
  3.  **Black Box Handouts:** Two half-sheets, labeled **Box A** and **Box B**. Each lists 10 numbers (rounded to 3 decimals).
      *   *Box A:* Generated by the Shift Map starting at $0.123456789...$
      *   *Box B:* Generated by a true random uniform number generator.
  4.  **Instructor Master Sheet:** Hidden. Contains the "True" system values calculated to 10 decimal places ($0.3141592653...$).
  5.  **Projector Slides:** Simple black background, white text. Displays only the current system value (rounded to 3 decimals) and the Round Number.

  ## 3. Rules & Scoring Scheme
  **The Game:** The "System" produces a number between 0.000 and 0.999. Students must predict if the *next* number will be **Low (0.000–0.499)** or **High (0.500–0.999)**.

  **The Wager (Punishing Overconfidence):**
  Students start with **20 Points**. In each round, they must wager Confidence Chips.
  *   **Confidence 1:** Win +1 | Lose -1
  *   **Confidence 2:** Win +2 | Lose -3
  *   **Confidence 3:** Win +3 | Lose -6
  *(Note: The loss scales faster than the gain. A confident mistake is punishingly expensive.)*

  **The "Predictor":** One student is selected to act as the "Ideal Forecaster." They receive the exact rule and the starting value to **6 decimal places**. They calculate the next values on the whiteboard while the class bets.

  ## 4. Minute-by-Minute Timeline (80 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Distribute Index Cards. Explain betting rules. **Do not explain the system.** Project "Round 1." |
  | **05–20** | **Phase 1: Blind Betting** | Instructor reveals System Value (rounded to 3 decimals). Students bet on the *next* value. <br> *Rounds 1–3.* <br> Instructor updates the "True" value internally (10 decimals). Project the rounded result. |
  | **20–35** | **Phase 2: The Predictor** | Select volunteer. Hand them the Rule + 6-decimal Start. <br> *Rounds 4–6.* <br> Predictor calculates on board. Class bets based on Predictor's calculation. <br> **Critical Moment:** At Round 6 (Predictor's 3rd calculation), the Predictor's value diverges from the Projected System Value. |
  | **35–50** | **Phase 3: Black Boxes** | Distribute Box A / Box B handouts. <br> Task: One is the System (Deterministic), one is Pure Chance. <br> Students wager points on which is which. <br> Collect votes. Reveal nothing yet. |
  | **50–60** | **The Reveal** | Write the Rule on the board. <br> Show the "True" 10-decimal column vs. Predictor's 6-decimal column. <br> Show that Box A = Deterministic, Box B = Random. |
  | **60–75** | **Debrief** | Map activity to the 4 Learning Objectives. Address worries. |
  | **75–80** | **Exit Ticket** | Written reflection. |

  ## 5. The Reveal (Scripted Moment)
  *At Minute 50, go to the whiteboard.*

  1.  **Write the Rule:** $x_{next} = \text{decimal part of } (10 \times x_{current})$.
  2.  **Draw Two Columns:**
      *   *Left (Predictor):* Start $0.314159$. Show their calculations.
      *   *Right (Truth):* Start $0.314159\mathbf{2653}$. Show your internal calculations.
  3.  **Highlight the Divergence:**
      *   Step 1–5: Columns match (when rounded).
      *   Step 6: Predictor has $0.900000$ (derived from the '9' in the 6th place). Truth has $0.2653...$ (derived from the 7th place '2').
      *   **Say:** "The Predictor had the Law. The Predictor had the Starting Value. The Predictor had a Calculator. The Predictor failed. Why? Because the 7th digit existed, and they did not have it."
  4.  **Black Box:** "Box A was this rule. Box B was a random number app. You could not tell them apart because, at this resolution, they are twins."

  ## 6. Debrief: Mapping Objectives & Troubleshooting

  **LO 1: Law-governed $\neq$ Predictable.**
  *   *Moment:* The Reveal.
  *   *Point:* The rule was written on the board. It never changed. It was perfectly deterministic. Yet, prediction failed.
  *   *Worry:* "Students think it's just random."
  *   *Response:* "Randomness has no rule. We just wrote the rule. If it were random, the first 5 steps wouldn't have matched the Predictor's calculation exactly. The match proves the law; the divergence proves the limit."

  **LO 2: Precision vs. Lead Time Tradeoff.**
  *   *Moment:* Comparing the two columns at the Reveal.
  *   *Point:* Count the digits. The Predictor had 6 digits. They got 6 steps of accuracy (mostly). Each step 'consumed' one digit of precision. To double your forecast time, you don't need double the precision; you need $10\times$ the precision (one more decimal place).
  *   *Worry:* "A faster computer would fix it."
  *   *Response:* "The Predictor wasn't slow. The math was 'multiply by 10.' A supercomputer cannot calculate with digits it is not given. The limit is measurement, not processing."

  **LO 3: Knowing Rule $\neq$ Prediction.**
  *   *Moment:* Phase 2 (The Predictor's failure).
  *   *Point:* The student held the truth but lost the game.
  *   *Worry:* "The student made a calculation error."
  *   *Response:* Check the board work publicly. "Their arithmetic was correct. Their input was the bottleneck. If you truncate the present, you truncate the future."

  **LO 4: Underdetermination (Deterministic vs. Random).**
  *   *Moment:* Phase 3 (Black Boxes).
  *   *Point:* Box A (Deterministic) and Box B (Random) looked identical statistically.
  *   *Worry:* "Determinism is unfalsifiable."
  *   *Response:* "It is not unfalsifiable, it is *underdetermined at this resolution*. If we had 1,000 digits and 1,000 steps, we could find correlations in Box A that Box B lacks. But with finite data and finite precision, you cannot tell the difference. That is the epistemic gap."

  ## 7. Limitations: Required Instructor Moves
  *You must break the "activity frame" and lecture briefly to prevent metaphysical overreach. Insert these statements during the Debrief.*

  1.  **On Precision vs. Reality:**
      *   *Say:* "The unpredictability you felt was an artifact of the 6-digit limit I imposed. In the real world, we do not know if nature has a '7th digit' or if the universe is truly granular. This activity shows what happens *if* there is more precision than we can measure, not that the world *is* unpredictable."
  2.  **On Detectability:**
      *   *Say:* "A sharp student might say: 'But we have techniques to find chaos in longer series.' They are right. This Black Box phase illustrated underdetermination *at a fixed resolution*. If I gave you a million data points, you could likely distinguish the Shift Map from True Random. The lesson is not that structure is undetectable in principle, but that it is invisible within the bounds of typical measurement."
  3.  **On Free Will/Determinism:**
      *   *Say:* "Nothing we did today proves the world is deterministic. Nothing proves it isn't. This was a model of *knowledge*, not a model of *ontology*. Do not leave here thinking this settles the free will debate. It only settles how much you can bet on a number."

  ## 8. Exit Ticket (5 Minutes)
  *Print on a slip of paper. Collect at the door.*

  **Name:** ___________________
  **1.** In one sentence, why did the "Ideal Predictor" fail despite having the correct rule?
  **2.** If I gave you a starting value with 100 decimal places instead of 6, how would that change your betting strategy in Phase 1?
  **3.** True or False: Because the Deterministic Box and the Random Box looked the same, it is impossible to ever tell them apart. (Circle one). If False, explain why.
  **4.** Did this activity prove that the real world is unpredictable? Why or why not?

  ---

  ### Anticipated Troubleshooting Guide

  | Worry | Mitigation Strategy |
  | :--- | :--- |
  | **Students conclude the system is simply random.** | During the Reveal, emphasize the **perfect match** of the first 5 rounds. Randomness would not align with the formula $10x \mod 1$ for 5 consecutive steps. The divergence is the proof of sensitivity, not randomness. |
  | **Students think a faster computer fixes it.** | Explicitly state during Debrief: "The Predictor had a calculator. The error was not speed; it was missing information. No computer can output the 7th digit if the input only has 6." |
  | **Students discount the data because it came from your laptop.** | The **Predictor** calculates live on the whiteboard. The divergence happens between the Student's Board Math and Your Projected Number. The "System" is you, but the "Failure" is their math vs. your hidden precision. |
  | **Predictor's failure read as carelessness.** | Verify their arithmetic publicly at the Reveal. "Look at Round 4. $0.4159 \times 10 = 4.159$. Drop the 4. Result $0.159$. Correct. The error enters at Round 7, where their digits run out." |
  | **"Determinism is unfalsifiable."** | Use the LO #4 response. Distinguish between *logical possibility* (could be either) and *practical distinguishability* (given data $N$). Acknowledge the philosophical point but ground it in data resolution. |

  ### Instructor Prep Checklist
  *   [ ] Generate the "True" 10-decimal sequence in advance (Start: $0.3141592653$).
  *   [ ] Generate the "Random" sequence for Box B (ensure no obvious patterns).
  *   [ ] Print 18 Index Cards with the Payoff Table on the back.
  *   [ ] Test the Projector/Whiteboard visibility.
  *   [ ] **Crucial:** Practice the "Shift" calculation so you can reveal numbers quickly without looking at a sheet during Phase 1.
