      *   **Jamie's Counter:** It's about *feeling* the friction, not just reading the text. The discomfort is the point.
      *   **Deep Dive - Markedness:** Bring in the linguistic term.
          *   *Alex:* Flipping marked/unmarked just creates confusion. "Man" becomes the special case. But we know "Man" is the universal. So we ignore the flip.
          *   *Jamie:* Exactly! That *ignoring* is the bias. The essay forces you to catch yourself ignoring it.
      *   **The "Preaching to the Choir" Question:** This is crucial.
