          *   *Speaker B (Friend's view):* The absurdity *is* the mechanism. It makes invisible bias visible by defamiliarization.
      *   **Specific Angle to Wrestle With:** Does the satire only land if you already agree gender shouldn't be linguistically marked? (Preaching to the choir?)
      *   **Linguistic Concept:** Markedness (unmarked default vs. marked exception). Does flipping it reveal structure or just generate filterable noise?
      *   **Tone:** Real dialogue, neither party a strawman, engaging deeply, no bibliographies.

  2.  **Character Conception:**
