      *   *Middle:* Discuss the "he/she" swap. Discuss the "man/person" swap.
      *   *Key moment:* Alex argues that reading "man" as specific makes you think of "man" as universal even harder. Jamie argues that stumbling over "man" makes you realize it's usually invisible.
