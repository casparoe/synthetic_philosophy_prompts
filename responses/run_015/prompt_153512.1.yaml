answer: |-
  ### Exam Question

  **Course:** Seminar on Rationality and Transformative Change  
  **Time Allowed:** 75 Minutes  
  **Expected Length:** Approximately 1,200 words  

  **Prompt:**

  Consider an agent facing a voluntary, irreversible procedure known as "phenomenal replacement." This procedure does not merely alter the agent's environment or provide new information about existing values. Instead, it substitutes the fundamental metric by which welfare is evaluated. Post-procedure, the agent possesses a new phenomenological capacity that renders the pre-procedure metric unintelligible. Consequently, the pre-change agent lacks any stable index for comparing outcomes across the transformation boundary; they cannot weigh the value of the new state against the old because the units of measurement themselves are incommensurable.

  Write an essay defending or rejecting the following claim: **Given this metric substitution, *ex ante* rational choice is impossible in principle.**

  Your response must strictly adhere to the following requirements:

  1.  **The Impossibility Claim:** Take a committed position. Either argue that the lack of a stable comparative index entails rational paralysis, or demonstrate a specific structural workaround that preserves rationality despite the incommensurability.
  2.  **Preference Learning:** Sharply distinguish this scenario from ordinary preference learning. Explain why acquiring information about how to satisfy existing desires fails to capture the ontological shift described in the framing.
  3.  **Standard Transformative Arguments:** Distinguish this case from standard arguments regarding transformative experience (which often focus on the epistemic limitation of knowing "what it is like"). Explain why the substitution of the *welfare metric* presents a distinct challenge to rational choice theory beyond mere epistemic ignorance.
  4.  **Third-Person Advisory:** Address whether a third-person advisor, who understands both metrics, could legitimately substitute their evaluation for the agent's absent first-person access. Justify your answer based on the nature of rational authority.

  Do not include citations or bibliographies. Avoid verbatim quotations from specific texts. Focus on argumentative precision.

  ***

  ### Model Answer

  **Position:** Rational choice is preserved via volitional endorsement.

  The claim that *ex ante* rational choice is impossible in principle relies on a overly narrow conception of rationality as strictly maximization based on comparative utility. While the "phenomenal replacement" scenario eliminates the possibility of comparative calculation across the transformation boundary, it does not eliminate rational agency. Rational choice remains possible if we shift the locus of rationality from outcome comparison to volitional commitment. The agent cannot calculate which metric is better, but they can rationally authorize the transition through a higher-order endorsement of the change itself.

  This must be distinguished sharply from ordinary preference learning. In standard learning cases, an agent updates beliefs about how to satisfy a stable utility function. If I learn I prefer tea to coffee, my metric of welfare (pleasure/satisfaction) remains constant; only the input data changes. In phenomenal replacement, the utility function itself is rewritten. The pre-change agent cannot learn their way into the decision because there is no common currency to facilitate the learning. Treating this as information gain misunderstands the ontological shift: the agent is not discovering a value they hiddenly held; they are becoming a subject for whom different things count as values.

  Furthermore, this scenario exceeds standard transformative-decision arguments. Typical analyses focus on the epistemic barrier of not knowing "what it is like" to undergo a change (e.g., becoming a parent). The challenge there is imaginative access. Here, the challenge is normative incommensurability. Even if the agent could imagine the new phenomenology, they would lack the normative framework to judge it as *good* relative to their current state. Standard arguments suggest we can choose based on current values regarding the transformation process. However, if the metric itself is replaced, current values cannot adjudicate the success of the outcome. The rationality cannot rest on the expected value of the result, because "value" post-change is undefined pre-change.

  Does this imply rational paralysis? Only if we assume rationality requires comparative optimization. If we instead view rationality as authentic self-constitution, the agent can choose the transformation by endorsing the *process* of becoming. The rationality lies in the volitional act of accepting the new metric, not in weighing the metrics against one another. The agent decides that the current self should cease to be the arbiter of the future self's welfare. This is a coherent, rational policy of self-abdication for the sake of growth, provided the commitment is authentic and voluntary.

  Consequently, a third-person advisor cannot legitimately substitute their evaluation for the agent's absent first-person access. While an advisor might comprehend both metrics intellectually, rational authority over welfare is essentially first-personal. Welfare is not an objective fact independent of the subject's capacity to feel it; it is constituted by the subject's metric. For an advisor to dictate the choice based on a comparison the agent cannot make is to violate the agent's sovereignty over their own good. The advisor can clarify the structural nature of the change, but they cannot resolve the normative incommensurability. To allow external substitution would be to treat the agent as a vessel for value rather than a source of it.

  Therefore, *ex ante* rational choice is not impossible. It is merely non-comparative. The agent rationally chooses the transformation by willing the emergence of a new evaluative standpoint, accepting that the justification for this choice will only become intelligible from the future side of the boundary. Rationality survives the loss of the stable index because it resides in the authority to define the index, not merely in the ability to calculate within it.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Position on Impossibility Claim (5 Marks)**
  *   **Criteria:** Clearly defends or rejects the claim that rational choice is impossible. Provides a structural reason (e.g., volitional endorsement vs. comparative calculation).
  *   **Characteristic Mistake:** Hedging between positions or arguing that rationality is impossible without explaining *why* the lack of an index entails paralysis (mere assertion).

  **2. Distinction from Preference Learning (5 Marks)**
  *   **Criteria:** Explicitly contrasts metric substitution with informational updates regarding stable desires. Identifies the change as ontological/normative rather than epistemic.
  *   **Characteristic Mistake:** Conflating the change in metric with discovering a pre-existing preference (treating the new value as something the agent "always really wanted").

  **3. Distinction from Standard Transformative Arguments (5 Marks)**
  *   **Criteria:** Differentiates the "metric substitution" problem from the "epistemic imagination" problem (knowing what it is like). Highlights the incommensurability of welfare units.
  *   **Characteristic Mistake:** Treating the scenario as identical to standard "what is it like" cases without addressing the specific loss of the welfare index.

  **4. Third-Person Advisor Analysis (5 Marks)**
  *   **Criteria:** Takes a definitive stance on advisor substitution linked to first-personal authority over welfare. Justifies why external evaluation succeeds or fails.
  *   **Characteristic Mistake:** Arguing the advisor *can* decide based on objective facts without addressing the loss of first-personal normative authority, or dismissing the advisor role without justification.
