      So, here is the shortest description I have. It is not that he is kind, or stubborn, or wise. Those words fit too many people. The description is this: He is the man who checks the sensor.

      If you know that, you know what he'll do next. You know he'll listen for the grind before he oils the gear. You know he'll ask "why" before he accepts "sorry." You know he'll stand by a truth even if it's unpopular, because a false reading risks the whole shaft. It narrows him down. It rules out the man who guesses, the man who pretends, the man who drifts.

      Most people think love is looking at someone and seeing everything. I think Grandpa teaches us that love is looking at someone and knowing exactly what makes them move. It's knowing the program well enough to trust the output. I know him. I know what he'll do next. And knowing that, I know I'll be safe. Happy birthday, Grandpa.

