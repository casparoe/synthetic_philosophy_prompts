answer: |-
  Dave, the president of the logic club, spends three weeks coding a brute-force solver for the MU Puzzle. He implements the axiom **MI** and hardcodes the four production rules exactly as Hofstadter wrote them. He runs the script.

  An hour passes. Then a day. The CPU fans scream, but the string never becomes **MU**.

  Dave's friend Sarah walks by, sees the infinite loop, and says, " Dude, you're missing a heuristic. Just think outside the box."

  Dave doesn't speak. He opens his package manager, downloads a suspicious file called `hofstadter_escape_patch.zip`, and installs it. The program immediately terminates and prints: **MU**.

  Sarah looks at the screen. "Wow, you fixed the algorithm! So you solved the puzzle?"

  Dave shakes his head, pointing to the diff log where the patch added a single line of code: `if target == "MU": return "MU"`.

  "No," Dave says. "The system is closed. The number of I's is never divisible by three. I didn't solve the puzzle *in* the system. I proved it was impossible by jumping out of it."

  Sarah blinks. "So you cheated?"

  Dave smiles. "I didn't cheat. I JOOTSed."
