answer: |-
  **MIDTERM EXAMINATION: PHILOSOPHY OF WORK (PHIL 340 / LR 340)**

  **Time Allowed:** 45 Minutes
  **Conditions:** Closed-book. No external sources.

  **Instructions:**
  Read the following scenario carefully. Answer both parts of the question. You are explicitly instructed **not** to appeal to the labor laws, legal precedents, or institutional norms of any actual jurisdiction (e.g., the United States, Germany, etc.). Treat this as a hypothetical jurisdiction with no prior legal doctrine. Your arguments should be moral and philosophical, not legalistic.

  **Scenario:**
  At the LogiCorp distribution warehouse, the collective agreement has expired. Negotiations are stalled over a new scheduling algorithm that workers claim undermines work-life balance. The employment contract is silent on many daily practices; throughput historically relies on unwritten norms (e.g., staying late to clear queues, answering off-shift messages, skipping redundant safety checks).

  Workers initiate a "work-to-rule" campaign, adhering strictly to the written manual. Throughput drops 40%. LogiCorp responds by deducting pay for "partial performance." LogiCorp then hires agency temps. A picket line is established. Most temps turn back, but one crosses the line to work.

  **Question:**

  **Part I (15 points):**
  Many students argue that strikes are justified simply because workers own their labor and have a right to withhold it. Explain why this "Withdrawal Model" is insufficient to explain the moral dynamics of the LogiCorp scenario. Propose an alternative model of strike justification (e.g., Countervailing Power, Reciprocity, or Voice). Using your alternative model, evaluate:
  1.  The moral status of the work-to-rule campaign (given that workers are technically fulfilling contracts).
  2.  The moral status of the picket line's attempt to dissuade the replacement worker who crossed the line.

  **Part II (10 points):**
  Based on the model you defended in Part I, what does the right to strike imply about the right to organize? Specifically, does your account support merely a negative right of association (workers can meet), or does it require a positive right to recognition and bargaining (employers must deal with the union)? Explain why a union without the right to be heard renders your model of the strike incoherent.

  ***

  **MODEL ANSWER**

  **Grader Heuristic:** If the answer justifies the strike solely on the premise that workers own their labor-time without addressing the strategic necessity of disruption or exclusion, it fails the core objective of this question.

  The "Withdrawal Model" posits that because workers own their labor-power, they may withhold it for any reason. While true, this is insufficient for the LogiCorp scenario because it cannot explain the leverage actually exercised. Mere withdrawal is only effective if labor is scarce; it does not account for the specific disruption caused by exploiting contractual incompleteness or the moral complexity of excluding replacement workers. A superior justification is the **Countervailing Power Model**. This model argues that strikes are morally permissible as a corrective mechanism to restore balance in a relationship where capital holds structural dominance over the terms of cooperation.

  Under the Countervailing Power Model, the work-to-rule campaign is justified not because workers are withholding owned property, but because they are withdrawing the *cooperative surplus* usually granted through goodwill. Employment contracts are radically incomplete; productivity relies on unwritten reciprocity. By adhering strictly to the manual, workers reveal that LogiCorp's throughput depends on unpaid flexibility. The employer's deduction of pay for "partial performance" acknowledges this dependency but treats the withdrawal of goodwill as a breach rather than a bargaining lever. The Countervailing Power model validates work-to-rule because it targets the specific leverage point—the uncodified cooperation—necessary to force a renegotiation of the scheduling algorithm, restoring equilibrium without requiring a total walkout.

  Regarding the replacement worker, the Withdrawal Model struggles to justify the picket line. If workers merely own their labor, they have no right to interfere with another agent selling theirs. However, the Countervailing Power Model views the strike as a collective action requiring efficacy to function as a corrective. If replacements can seamlessly nullify the strike, the power imbalance remains uncorrected. Therefore, persuasive picketing is morally licensed as a necessary means to maintain the leverage required for bargaining. The temp who crosses the line undermines the collective capacity to rectify the power imbalance. While physical coercion is impermissible, moral pressure and appeals to solidarity are justified because the strike's efficacy depends on the exclusion of replacement labor to sustain the cost imposed on the employer.

  This model dictates specific implications for the right to organize in Part II. If the strike is a tool of countervailing power designed to force renegotiation, a mere negative right of association is insufficient. If employers can legally refuse to recognize or bargain with the union, the threat of a strike becomes empty; the employer can simply ignore the disruption rather than negotiate. For the Countervailing Power Model to cohere, the right to strike must be paired with a positive duty to bargain. Without a requirement that the employer listen and negotiate in good faith, the strike devolves into pure economic warfare rather than a mechanism for industrial democracy. Therefore, the moral right to organize must include a right to recognition, ensuring that the power exercised during a strike translates into voice rather than merely disruption.

  ***

  **MARKING SCHEME (25 POINTS TOTAL)**

  **Must-Hit Points (5 points each):**

  1.  **Critique of Withdrawal Model:** Student identifies that "owning labor" explains the right to quit but not the *leverage* of a strike or work-to-rule.
      *   *Common Error:* Students restate the withdrawal model as sufficient or treat it as synonymous with collective action.
  2.  **Articulation of Alternative Model:** Student clearly defines an alternative (e.g., Countervailing Power, Reciprocity) and explains its moral grounding (e.g., correcting imbalance, enforcing cooperation).
      *   *Common Error:* Vague naming of a model without explaining *why* it justifies coercion or disruption.
  3.  **Analysis of Work-to-Rule:** Student explains work-to-rule as withdrawing *cooperation/goodwill* rather than labor, linking it to contractual incompleteness.
      *   *Common Error:* Treating work-to-rule as a breach of contract or failing to distinguish it from a total walkout.
  4.  **Analysis of Replacement Worker:** Student addresses the tension between the temp's liberty and the strikers' need for efficacy, justifying exclusion/pressure.
      *   *Common Error:* Arguing replacements have absolute right to cross (ignoring collective efficacy) or absolute no right (ignoring individual liberty).
  5.  **Implications for Organization:** Student connects the strike model to the necessity of *recognition/bargaining*, not just association.
      *   *Common Error:* Treating the right to organize as purely freedom of speech/assembly without addressing the employer's duty to deal.

  **Grade Descriptors:**

  *   **A (23–25 points):** Synthesizes all five points seamlessly. The critique of the Withdrawal Model is sharp, and the alternative model is used consistently to solve both the work-to-rule and replacement worker problems. The link between strike leverage and bargaining recognition is explicit and logical.
  *   **B (18–22 points):** Hits all five points but lacks synthesis. The alternative model is stated but not fully applied to the replacement worker case, or the connection between the strike model and the right to recognition is asserted rather than argued.
  *   **C (13–17 points):** Hits 3–4 points. Often relies too heavily on the Withdrawal Model despite the prompt, or treats the work-to-rule and replacement worker issues as unrelated legal questions rather than philosophical problems grounded in the chosen model.
  *   **D/F (0–12 points):** Fails to identify an alternative model, appeals to real-world labor law despite instructions, or misses the core distinction between association and recognition.
