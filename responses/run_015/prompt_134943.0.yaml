answer: |-
  When we consider Blaise Pascal's famous fragment from the Pensées that justice without force is powerless and force without justice is tyrannical, we are immediately confronted with a problem that feels strikingly modern despite its seventeenth-century origins. Pascal argues that because human nature is corrupted and reason is weak, we cannot rely on moral suasion alone to maintain order; what is just must be made strong, or what is strong must be made just. If we take this framework and apply it to the contemporary crisis of climate change, specifically the binding nature of international treaties between sovereign states, we encounter a paradox. There is no global Leviathan, no world government with a monopoly on violence to enforce agreements like the Paris Accord. If we stick rigidly to a literal reading of Pascal where force implies the sword of the monarch or the police power of the state, then these treaties are doomed to be mere wishful thinking, powerless ideals that lack the teeth to be considered truly just in a political sense. However, I argue that this verdict is too narrow and that we should defend the position that Pascal's concept of force can and should be expanded to include structural economic interdependence, allowing climate treaties to function as just instruments provided they are backed by the tangible threat of economic sanction rather than merely moral assent.

  To understand why this expansion is necessary, we must first deal with the objection that Pascal was writing in a specific monarchical context where force meant the physical coercion of the King's army, or perhaps even that his idea of force was ultimately theological, pointing toward divine authority rather than modern sanctions. It is true that Pascal lived under Louis XIV and viewed earthly justice as a provisional order necessary to curb the chaos of original sin, often contrasting it with the true justice of God which requires no force because it is loved voluntarily. If we interpret his view of force as solely divine authority, then all human treaties are irrelevant shadows. But this ignores Pascal's pragmatic advice to follow the customs and laws of one's country to maintain peace. He was concerned with the stability of the social order. In the modern international system, the sovereign state is the analogue to Pascal's monarch, but the mechanism of coercion has shifted. Physical invasion is too costly and rare to be the standard enforcer of treaties. Instead, the force that compels states to comply is the threat of economic exclusion, tariffs, and the collapse of supply chains. This is not a betrayal of Pascal's thought but an application of his principle to a new context. The force is still real, still painful, and still coercive, even if it is administered through markets rather than muskets.

  This brings us to the tension between justice and charity in Pascal's system, which is crucial for evaluating climate treaties. Pascal distinguishes sharply between the order of the flesh, the order of the mind, and the order of charity. Justice belongs to the political order, which requires coercion because humans are self-interested and fallen. Charity belongs to the supernatural order, where actions are voluntary and motivated by grace. If climate treaties are framed as acts of charity, where wealthy nations voluntarily help poorer ones out of goodwill, Pascal would likely view them as noble but politically powerless, subject to the whims of changing administrations and public opinion. They would be justice without force. For these treaties to count as just in Pascal's framework, they must be treated as obligations of justice, not gifts of charity. This means compliance cannot be optional. If a nation violates the treaty, there must be a consequence that feels like force. Therefore, the verdict must be that climate treaties are only just when they are embedded in a system of economic interdependence that acts as a coercive backup. Without this, they revert to the status of powerless idealism, relying on the charity of states which Pascal rightly distrusts in the political realm.

  We must acknowledge that Pascal might be skeptical of any human attempt to perfect justice, given his view that true justice is found only in God. He might argue that any earthly arrangement is ultimately flawed. However, his prescription for life in the meantime is to uphold the established orders that prevent violence and chaos. A climate treaty backed by economic force serves this function by preventing the chaos of environmental collapse and the conflict it would generate. If we deny that economic sanctions count as force, we are left with a binary where only a world government with an army can create justice, which is both impractical and dangerous. By accepting that structural economic dependence creates a form of power that constrains sovereign will just as effectively as a police force, we save Pascal's insight from becoming obsolete. We admit that the treaties are not based on the voluntary charity of nations, which would be fragile, but on the coercive reality that non-compliance leads to economic suffering.

  Ultimately, the conclusion we must reach is that Pascal's framework does not doom climate treaties to be mere wishful thinking, provided we recognize that force has evolved. If we treat these agreements as reliant on the voluntary charity of sovereign states, they are indeed powerless and therefore fail to achieve political justice. But if we structure them so that violation triggers automatic, painful economic consequences, they satisfy Pascal's requirement that justice be backed by power. The force is no longer the hangman or the soldier, but the market and the sanction. This preserves the integrity of Pascal's skepticism about human goodness while allowing for a functional definition of justice in a globalized world. We do not need a world government to enforce justice, but we do need a world system where the cost of injustice is enforced by something stronger than good intentions. In this light, climate treaties can be just, but only if they stop pretending to be handshake agreements and start functioning as economic constraints, aligning the selfish interests of states with the collective good through the very mechanism of coercion that Pascal deemed essential for any lasting order.
