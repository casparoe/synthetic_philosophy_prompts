answer: |-
  There is no single formulation that delivers all seven verdicts. You are holding three commitments that are mutually inconsistent:

  1.  **PII is true** (or at least survivable).
  2.  **Haecceities are illegitimate** (Case 7: "being identical with this globe" does not discern).
  3.  **Disconnected indiscernibles are possible** (Case 5: two globes in disconnected spacetimes).

  You must drop one. Given your pedagogy and your rejection of haecceities, **you must drop Verdict 5.**

  Here is the precise formulation that respects your remaining intuitions, the analysis of why Case 5 fails, the run on the homogeneous space case, and a direct assessment of the principle's substantive value.

  ### The Formulation

  **The Principle of the Identity of Indiscernibles (Weak, Impure, Structural):**
  For any objects $x$ and $y$, $x$ is identical with $y$ if and only if, for every **contingent, structural relation** $R$ and every object $z$, $x$ bears $R$ to $z$ if and only if $y$ bears $R$ to $z$.

  *   **"Contingent":** Excludes logical relations like identity (satisfies Case 7).
  *   **"Structural":** Excludes primitive "thisness" but allows spatial/causal relations (satisfies Case 3).
  *   **"Weak":** Quantifies over relations, not just monadic properties (satisfies Case 1 & 2).

  ### Case Mapping and The Casualty

  *   **Case 1 (Black's Globes, Intrinsic):** **Saved.** The principle quantifies over relations, so the lack of intrinsic difference doesn't force identity.
  *   **Case 2 (Symmetric Relations):** **Saved.** "Two miles from *a* globe" is shared. The principle requires a difference in relational profile.
  *   **Case 3 (Asymmetric Relations):** **Saved.** Globe A bears "two miles from *Globe B*" to Globe B. Globe B does not bear that relation to Globe B. They are discerned.
  *   **Case 4 (Cylindrical Space):** **PII Fails (as you suspected).** If the topology makes all relations symmetric (A is 1 mile North of B *and* B is 1 mile North of A), there is no asymmetric relational anchor. Your verdict here is correct: PII yields no result.
  *   **Case 5 (Disconnected Spacetimes):** **OVER TURNED.** This is the casualty.
      *   *Why:* You claim there are "two globes" but "nothing discerns them." If you reject haecceities (Case 7), you cannot count them as "two" without a discerning relation. To say there are "two spacetimes" presupposes a container or a higher-order relation (e.g., "exists in the same logical universe as") that distinguishes Spacetime 1 from Spacetime 2. If such a relation exists, the globes are discerned (Globe A is in S1, Globe B is not). If no such relation exists, the claim that there are "two" is metaphysically empty—it is just "Universe 1 and Universe 2," with no fact of the matter about their numerical distinctness relative to each other.
      *   *The Confusion:* Your verdict on 5 rests on a "God's eye view" that PII explicitly forbids. You are smuggling in a haecceity of the spacetimes to count them as two, which violates Case 7.
  *   **Case 6 (Bosons):** **Bracketed.** Do not lean on physics you don't have. In standard QM, PII fails for bosons in the same state. Use this to show students that PII is not a logical truth but a metaphysical principle that physics might violate.
  *   **Case 7 (Indexicals):** **Saved.** The formulation excludes "identity with $z$" as a discerning relation $R$.

  ### The New Case: Homogeneous Infinite Space

  **Scenario:** A perfectly homogeneous infinite Newtonian space containing nothing at all. Every point is qualitatively like every other.

  **Verdict:** **PII Fails (Many Indiscernible Points).**

  **Reasoning:**
  1.  **Substantivalism:** If you treat space as a substance (which your globe cases suggest you do), the points are entities.
  2.  **No Relations:** With no objects to anchor relations, Point $p_1$ bears exactly the same structural relations to the rest of space as Point $p_2$ (due to homogeneity and isotropy).
  3.  **Result:** There are infinitely many points, yet they are all indiscernible.
  4.  **Alternative:** If you want to save PII here, you must adopt **Relationism**: without bodies, there are no points. The question is malformed. But since you accept the possibility of empty space in Case 1, you are likely a substantivalist. Therefore, you must accept that PII is not a necessary truth.

  ### Meta-Evaluation: Is the Principle Doing Real Work?

  **Confidence Level:** Low that PII is a fundamental truth; High that it is a useful heuristic for structuralism.

  **Direct Assessment:**
  You asked if the principle is doing real work or restating verdicts in new notation.
  *   **With Impure Properties (Case 3):** PII is **trivial** within a connected spacetime. If $x$ and $y$ are distinct, $x$ bears the relation "distance $d$ to $x$" to $x$, and $y$ does not. This discerns them immediately. If you allow relations to particulars, PII is almost tautological for any distinct objects in the same causal network.
  *   **The Real Work:** The work is done only when you restrict the relations (e.g., to *qualitative* properties only, or to *symmetric* topologies like Case 4).
  *   **The Tension (1 vs. 3):** You worried about tension between Case 1 and Case 3. **There is no tension.** Case 1 rejects *Strong* PII (intrinsic only). Case 3 accepts *Weak* PII (relational). This is standard metaphysics.
  *   **The Real Confusion:** The tension is between **Case 5 and Case 7**. You cannot reject haecceities (7) and then assert numerical distinctness without discernment (5). That is the confusion you need to address in your seminar.

  **Teaching Recommendation:**
  Present PII not as a law of logic, but as a commitment to **Structural Realism**.
  1.  If you believe objects are nothing over and above their place in a structure (relations), PII is true (Cases 1-4).
  2.  If you believe objects have a "thismess" beyond their structure, PII is false (Cases 5-7).
  3.  Your verdicts commit you to Structural Realism *within* a spacetime, but you lapse into Haecceitism when you imagine disconnected spacetimes (Case 5).

  Drop Verdict 5. Tell your students: "If there is no relation between them, there is no fact of the matter that they are 'two' rather than 'one universe duplicated'." That is the hard metaphysical lesson.
