answer: |-
  Imagine a scribe listing every infinite decimal sequence on distinct scrolls. Cantor's diagonal argument constructs a "rogue" sequence by altering the $n$-th digit of the $n$-th scroll. For the Cantorian, this rogue sequence exists as a completed totality, instantly definable despite having infinitely many digits. However, a strict finitist views this construction not as a static object but as an open-ended potential procedure: one can always compute the next digit, but never hold the entire number in hand. The tension arises not from the logic of digit alteration, which the finitist accepts locally, but from the ontological leap required to reify the infinite output as a single, determinate entity. To the finitist, the "missing" number is merely a rule for generation, rather than an actual member of a completed set. Thus, the diagonal argument fails to prove uncountability for those who deny that an infinite process can ever culminate in a finished mathematical object, rejecting the actual infinity presupposed by the conclusion rather than the step-by-step reasoning itself.
