      *   **Core Claim to Analyze:** Moore argues friendship (like beauty) is an "organic unity." Its value isn't utility but the combination of mental states (pleasure in friend's qualities + consciousness that qualities belong to the friend).
      *   **Constraint/Condition:** The mental states must be *actually present* (epistemic access/truth condition).
      *   **The Question:** Is Moore advancing a *single* uniform theory of value for both aesthetic and personal goods, or does he implicitly distinguish two kinds of organic unity (perceptual vs. interpersonal)?
      *   **Specific Focus:** Does the requirement of "genuine presence" make friendship *more* vulnerable to value-degradation through misrepresentation than beauty, or is the vulnerability identical?
