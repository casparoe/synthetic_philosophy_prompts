answer: |-
  ### Table 1: Desiderata for Slur Theory in Annotation Pipelines

  | ID | Requirement | Motivating Case | Status | Conflicts With |
  | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **Contextual Variability** | Reclaimed in-group use; nonce slurs. | **Non-negotiable** † | R3 (if rigid), Semantic Invariance |
  | **R2** | **Use/Mention Distinction** | News reports, linguistic examples, lyrics. | **Non-negotiable** | None |
  | **R3** | **Orthographic Robustness** | Masking (e.g., n***a) leaving offense intact. | **Non-negotiable** † | R1 (if reclamation allows masks) |
  | **R4** | **Projection Stability** | Offense survives negation, conditionals, interrogation. | **Non-negotiable** | None |
  | **R5** | **Content/Attitude Separation** | Asserted true vs. conceded/distanced usage. | **Negotiable** | R1 (if attitude is purely contextual) |
  | **R6** | **Group-Target Specificity** | Pejoratives vs. slurs (group vs. individual). | **Non-negotiable** | R11 (if group defined by oppression) |
  | **R7** | **Cross-Linguistic Context** | Slur in Language A, neutral ethnonym in Language B. | **Negotiable** † | None |
  | **R8** | **Reference Independence** | Target description empty, false, or misidentified. | **Reject** | None |
  | **R9** | **Target Ontology Agnosticism** | Target defined by abandonable behavior vs. immutable trait. | **Negotiable** | R6 (if slurs require immutable traits) |
  | **R10** | **Power-Direction Neutrality** | Slurs aimed upward at dominant groups. | **Reject** † | R6 (on oppression-based definitions) |
  | **R11** | **Embedding Compatibility** | Tension between static vectors and dynamic reclamation. | **Optional** | R1 |

  *† denotes extrapolation from philosophical literature to engineering specifications.*

  ### Table 2: Scorecard of Philosophical Views

  | View | Requirement it Fails or Most Strains | Verdict for My Purpose |
  | :--- | :--- | :--- |
  | **Pure Expressivism** | Fails **R5** (Content/Attitude Separation); cannot handle asserted truth. | **Reject** (Too limited for truth-conditional contexts). |
  | **Hybrid Expressivism** | Strains **R1** (Contextual Variability); attitude often tied to word meaning. | **Viable** (If pragmatics layered on top). |
  | **Presuppositional** | Strains **R1** (Contextual Variability); presuppositions usually invariant. | **Viable** (Good for R4, needs pragmatic override). |
  | **Conventional Implicature** | Fails **R1** (Contextual Variability); CI is conventionally fixed. | **Reject** (Cannot account for reclamation without modification). |
  | **Pejorative-Only** | Fails **R6** (Group-Target Specificity); no distinction from general insults. | **Reject** (Too broad for specific slur policies). |

  ### Coda

  The jointly unsatisfiable subset is **R1 (Contextual Variability)** and standard **Semantic Invariance** (assumed by CI/Presupposition accounts). Your suspicion is real: static embeddings encode invariant offense, while reclamation requires dynamic context. You cannot satisfy R1 with a theory that treats slur content as fixed semantic properties. The single requirement doing the most work is **R1**. It excludes pure semantic accounts (CI, classic Presupposition) because they cannot explain why the same token is permissible in-group but hostile out-group without appealing to external pragmatics. For annotation, you must treat slurhood as a speech act, not a lexical property.

  ### Settlement Status

  *   **Settled:** Slurs project over negation/conditionals (R4); slurs differ semantically/pragmatically from neutral counterparts (R6).
  *   **Contested:** The locus of offensiveness (semantic vs. pragmatic); the mechanism of reclamation (R1); whether "reverse slurs" exist (R11).
