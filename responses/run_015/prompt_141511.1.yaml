answer: |-
  Here are three candidate skeletons for the 90-minute session, followed by the chosen design, the mathematical pressure-testing of your variants, and a guide to the debrief and predictable failures.

  ### Candidate Skeletons

  **Skeleton 1: The Historical Chronology**
  1.  **Lecture (15 mins):** Briefly define CDT vs. EDT/FDT using Newcomb's.
  2.  **Platonia (30 mins):** Silent ballot, then talk, then ballot.
  3.  **Luring Lottery (30 mins):** The arms race.
  4.  **Debrief (15 mins):** Map results to theories.
  *Rejection:* You explicitly forbade lecture before the debrief. Furthermore, defining the theories upfront inoculates the students against the confusion you want them to feel. They must inhabit the paradox before they have the vocabulary to dissolve it.

  **Skeleton 2: The Split-Room Comparison**
  1.  **Platonia (45 mins):** Half the room plays Silent, half plays Talk.
  2.  **Luring Lottery (45 mins):** Everyone plays, followed by immediate debrief.
  *Rejection:* Splitting the room dilutes the collective tension. The "institution collapse" you want to highlight requires the *same* group to experience the failure of their own agreement. If half the room didn't hear the promise, the betrayal feels less personal.

  **Skeleton 3: The Escalation (Chosen)**
  1.  **Platonia Silent (15 mins):** Pure intuition.
  2.  **Platonia Talk (20 mins):** Attempted coordination.
  3.  **Luring Lottery (25 mins):** Continuous variable tragedy.
  4.  **Variants (15 mins):** Asymmetry and Copy Rule as "physics changes."
  5.  **Debrief (15 mins):** High-intensity mapping.
  *Reason for Choice:* This maintains the group as a single unit experiencing escalating frustration. It moves from binary (Send/Abstain) to continuous (How many tickets?), then to structural changes (Asymmetry/Correlation), mirroring the philosophical deepening from PD to Superrationality to Mechanism Design.

  ---

  ### The Chosen Design: 90 Minutes

  **Preparation:**
  *   **Voucher:** Place the £40 voucher in a clear envelope. Have a "Disliked Cause" donation letter ready to sign if destroyed.
  *   **Cards:** Two colors. Color A for Send/Abstain. Color B for Luring numbers.
  *   **Hat:** For collecting ballots.

  #### Phase 1: The Platonia Silence (0:00–0:15)
  *   **Instruction:** "You are 20 agents (you + 2 hypothetical others to make the math classic, or just play with 18). If exactly one person sends a telegram, they get the voucher. If 0 or >1 send, the voucher is destroyed. Mark 'Send' or 'Abstain'. No talking. Seal in envelope."
  *   **Action:** Distribute cards. 3 minutes to decide. Collect in hat.
  *   **Reveal:** Open envelopes one by one. Count senders on board.
  *   **Outcome:** Likely >1 sender. Destroy voucher (or threaten to).
  *   **Goal:** Establish the CDT baseline. Everyone reasons: "My card doesn't change theirs."

  #### Phase 2: The Platonia Talk (0:15–0:35)
  *   **Instruction:** "You have 3 minutes to talk. Then a second silent ballot. Same rules. If the voucher is destroyed this time, it goes to [Disliked Cause] immediately."
  *   **Constraint:** **Permit cheap talk.** Do not enforce the agreement. This is crucial. You want them to build a fragile institution (e.g., "Person with earliest birthday sends") so they can feel the temptation to defect.
  *   **Honesty:** Use sealed envelopes collected by a *student volunteer*, not you. This reduces the "authority compliance" factor.
  *   **Outcome:** High probability of defection (2+ senders) or paralysis (0 senders).
  *   **Goal:** Demonstrate that without enforcement, agreement is just another move in the game.

  #### Phase 3: The Luring Lottery (0:35–1:00)
  *   **Instruction:** "Pot is 180 points. Write any integer number of tickets $n \ge 0$. One ticket drawn at random. Prize = $180 / \text{Total Tickets}$. Your Expected Value = $(n / \text{Total}) \times (180 / \text{Total})$."
  *   **Action:** Write numbers. Collect.
  *   **Reveal:** Sum the tickets live on the whiteboard. Calculate the Prize Value.
  *   **Math:** If everyone writes 1, Total = 18, Prize = 10, EV = 10. If everyone writes 10, Total = 180, Prize = 1, EV = 1. If one person writes 100, they dominate the probability but crush the prize value.
  *   **Allow Absurd Numbers:** Yes. Let them write 1,000,000. It highlights the lack of a Nash equilibrium in pure strategies without costs.
  *   **Second Round?** No. One round is enough to show the arms race. A second round just becomes "guess the average," which muddies the rational choice lesson.
  *   **Goal:** Show the continuous version of the Platonia failure. The "Send" decision is now "How loudly do I shout?"

  #### Phase 4: The Variants (1:00–1:15)
  *   **Asymmetry:** Hand 6 students (Philosophers, perhaps) a sealed note: "If you Abstain, you get £5 guaranteed." The other 12 play for the £40 voucher (1 sender only).
      *   *Instruction:* "Do not reveal your card type."
      *   *Goal:* Breaks the symmetry required for Superrationality.
  *   **Copy Rule:** "For this final ballot, I will roll a die. On a 6 (prob $q \approx 0.16$), your card is discarded and replaced by a copy of a random other student's card from the hat."
      *   *Instruction:* "Mark Send or Abstain. Voucher rules apply."
      *   *Goal:* Make correlation causal.

  #### Phase 5: The Debrief (1:15–1:30)
  *   Rapid-fire mapping of experience to theory (see below).

  ---

  ### Pressure-Testing the Variants

  #### 1. The Asymmetry Variant
  **The Setup:** 6 "Safe" agents (Guaranteed £5 if Abstain), 12 "Risk" agents (£40 if Unique Sender).
  **The Question:** What does Superrationality deliver here? Does similarity have to be exact?
  **Analysis:**
  *   **Safe Agents:** Dominant strategy is to **Abstain**. £5 > £0 (expected value of Platonia is low with 17 others). Even if they are superrational, their "similarity class" is only the other 5 Safe agents. If all 6 Safe agents Abstain, they remove themselves from the sender pool.
  *   **Risk Agents:** Now playing a Platonia game with $N=12$. Optimal mixed strategy $p = 1/12$.
  *   **The Lesson:** Superrationality relies on *reference classes*. If I know I am "Safe," I should not reason as if I am "Risk." The argument collapses if agents can distinguish their own type.
  *   **Debrief Point:** Similarity must be *epistemically* valid. If I know I am different, I cannot project my choice onto those who are not. This attacks the "I am a generic rational agent" premise.

  #### 2. The Copy Rule Variant
  **The Setup:** Probability $q$ my card is replaced by a copy of a random other's card.
  **The Math:**
  Let $V = £40$. Let $C$ be a small cost to sending (e.g., social effort, or simply assume $V$ is utility and we need $EU > 0$).
  Actually, to make Abstain attractive, we must assume a cost $C$ to Sending (e.g., "You must stand up to send").
  *   **If I Intend Send:**
      *   Prob $(1-q)$: My card is Send. I win if all $N-1$ others Abstain.
      *   Prob $q$: My card copies Random Other $j$.
          *   If $j$ Sent: My card is Send. But $j$ also Sent. Total Senders $\ge 2$. Prize = 0.
          *   If $j$ Abstained: My card is Abstain. Prize = 0 (I didn't send).
      *   **Crucial Insight:** Under the Copy Rule, if the copy triggers, **I cannot be the unique sender.** I either duplicate a sender (loss) or become an abstainer (loss).
      *   Therefore, $P(\text{Win} | \text{Intend Send}) = (1-q) \times P(\text{All Others Abstain})$.
  *   **If I Intend Abstain:**
      *   Payoff is 0 (unless Safe Variant).
  *   **Threshold:**
      *   You should Send only if $(1-q) V P(\text{Others Abstain}) > C$.
      *   If we assume Superrationality (Others do what I do), then if I Send, Others Send. $P(\text{Others Abstain}) \to 0$.
      *   **The Threshold $q$:** Even without superrationality, if you expect a fraction $r$ of others to Abstain, the probability all $N-1$ abstain is $r^{N-1}$.
      *   You should Abstain if $(1-q) V r^{N-1} < C$.
      *   Solving for $q$: **$q > 1 - \frac{C}{V r^{N-1}}$**.
      *   If $C$ is negligible, $q$ must be nearly 1. But if $C$ is psychological (aversion to being the "ruiner"), $q$ can be small.
  *   **What it Shows (and Doesn't):**
      *   **Shows:** It makes the *dependence* causal. In standard Superrationality, the link is logical ("We are similar"). Here, the link is physical ("Your card *is* theirs"). It validates the *structure* of the EDT argument by mechanizing it.
      *   **Doesn't Show:** It does not prove logical correlation exists in the real world. It manufactures the conclusion by changing the game physics. It proves that *if* you are correlated, you should act differently. It does not prove you *are* correlated.

  ---

  ### The Debrief: Mapping Moments to Ideas

  Do not lecture. Ask questions and let them supply the terms, then label them.

  1.  **Phase 1 (Silent Platonia):**
      *   *Ask:* "Why did you send?"
      *   *Label:* **Causal Decision Theory (CDT).** My action cannot causally affect yours. Dominant strategy.
      *   *Ask:* "Why did you abstain?"
      *   *Label:* **Evidential/Functional Decision Theory (EDT/FDT).** My choice is evidence of what others like me will do.

  2.  **Phase 2 (Talk & Collapse):**
      *   *Ask:* "You made a promise. Why break it?"
      *   *Label:* **Institutional Failure.** Without enforcement (contracts, penalties), cheap talk is non-binding. Superrationality is a *private* substitute for public coordination. When coordination is allowed, Superrationality should retreat, but it didn't because enforcement was missing.

  3.  **Phase 3 (Luring Lottery):**
      *   *Ask:* "Why write 100 tickets?"
      *   *Label:* **Tragedy of the Commons.** The Nash Equilibrium (arms race) vs. Pareto Optimal (everyone writes 1).
      *   *Math:* Show on board: $EV = n P / T^2$. Marginal gain is positive until you hold half the tickets.

  4.  **Phase 4 (Variants):**
      *   *Asymmetry:* "Did the Safe agents feel they could reason for the Risk agents?" (No. Reference classes matter.)
      *   *Copy Rule:* "Did the copy rule make you feel safer abstaining?" (Yes. It turned a logical worry into a physical risk.)

  5.  **Newcomb Anchor:**
      *   Remind them: "This is Newcomb's Problem with 18 boxes. In Newcomb, you don't take both boxes because you trust the Predictor. Here, you Sent because you didn't trust the *other students* to be Predictors of you."

  ---

  ### Risk Analysis: What Will Go Wrong

  1.  **The "Joker" Defector:** One student sends in Phase 2 just to see the voucher burn.
      *   *Mitigation:* Frame the "Disliked Cause" donation strongly. Make the social cost high.
      *   *Debrief Use:* This is the "Noise" parameter. Real worlds have irrational agents. Superrationality assumes common knowledge of rationality.
  2.  **The Economist Dominance:** A student argues loudly in Phase 2: "Sending is dominant. Anyone who abstains is irrational."
      *   *Mitigation:* Do not shut them down. Let them persuade the room. If the group follows them and loses, the lesson is stronger.
      *   *Debrief Use:* This is the CDT hegemony. It is internally consistent but collectively disastrous.
  3.  **Probability Failure:** With $N=18$, if everyone randomizes at $p=1/18$, the probability of exactly one sender is $(1 - 1/18)^{17} \approx 37\%$. There is a 63% chance of failure *even if everyone plays optimally*.
      *   *Risk:* Students might feel the game is rigged.
      *   *Mitigation:* Acknowledge this in the debrief. "The tragedy is that even perfect play likely fails."
  4.  **Luring Sabotage:** A student writes "Infinity" or a nonsensical entry.
      *   *Mitigation:* Cap entries at 1000.
      *   *Debrief Use:* This is the "Unbounded Rationality" problem.
  5.  **Copy Rule Confusion:** Students might not understand the mechanic.
      *   *Mitigation:* Write the formula on the board: *Your Card = (1-q) Your Choice + q Random Other.*

  ---

  ### Limitations: What This Cannot Reproduce

  Be frank about these in the final 5 minutes:

  1.  **Stakes:** £40 is trivial. A billion dollars changes risk aversion and focus.
  2.  **Shadow of the Future:** This is one-shot. In repeated games, reputation enforces cooperation (Tit-for-Tat). Superrationality is most needed when repetition is impossible.
  3.  **Similarity:** In the room, similarity is contested. In the thought experiment, agents are identical algorithms.
  4.  **The Copy Rule:** It is a trick. In reality, there is no physical link between minds. The seminar proves that *if* correlation exists, CDT fails. It does not prove correlation *does* exist.

  ### Final Advice on the "Institution" Hypothesis
  Your hypothesis is correct: the most instructive moment is the collapse of the Phase 2 agreement.
  *   **Why:** It forces them to confront the difference between *normative* rationality (what we should do together) and *strategic* rationality (what I should do given what you do).
  *   **The Twist:** Superrationality claims you don't *need* the institution if you are truly rational. The failure of Phase 2 suggests either they aren't superrational, or superrationality is insufficient without the *belief* in similarity.
  *   **Verdict:** Let them build the institution. Let them break it. Then tell them: "Hofstadter thought you wouldn't break it if you were truly rational. You broke it. Are you irrational, or is he?" That is the question they leave with.
