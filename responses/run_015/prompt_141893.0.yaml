      *   **Tone:** Philosophical, analytical, constructive, rigorous but accessible (like a peer review or a senior colleague's feedback).

  2.  **Deconstruct the User's Commitments:**
      *   (1) **Disjunctivism (Metaphysical/Phenomenal):** No common factor between veridical perception and hallucination.
      *   (2) **Naive Realism (Constitutive):** Mind-independent objects are constituents of the experience (in the good case).
      *   (3) **Physicalism/Local Supervenience:** Phenomenal character is fixed by local brain states. Same brain state = same phenomenology.
      *   (4) **Method:** Argument from illusion is bad (deviant cases), but causal duplication (hallucination via same proximal cause) is worrying.
      *   (5) **Epistemology:** Internalist justification (same inside = same justification), but externalist reasons (good case = factive reason, bad case = none). Knowledge norm for belief.
      *   (6) **Motivation:** Epistemic disjunctivism (direct contact/knowledge) drove the view, not metaphysics.
