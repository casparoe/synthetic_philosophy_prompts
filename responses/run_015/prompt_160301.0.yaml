prompt: |-
  so I've been trying to figure out what I actually think about voting, and I've got this pile of gut reactions that don't obviously add up to anything. Let me just list them and you tell me if there's a principle underneath, or whether some of them have to go.

  1. Skipped the last national election. I live in a district that's completely locked in, my vote couldn't have changed anything, and I had no real preference between the two people who could win. Fine, I think. Not even mildly guilty.

  2. A friend skipped the same election because he never got around to registering. Also zero effect on the outcome. But I think that's not fine — sloppy and kind of disrespectful, like bailing on something you'd agreed to be part of. Why does 2 feel different from 1 when the consequences are exactly the same? That's what got me going on this.

  3. Voted for the boring establishment candidate I mildly dislike over the candidate I think is genuinely dangerous. Fine. Obviously the right call, no guilt, no dirtiness.

  4. Voted for a small party I actually like, in a local race where they had no chance and the two real contenders were near-identical. Fine, felt good, like I'd said something.

  5. Same kind of vote, but national, in a region that actually decides, where the two real contenders were very different and one was dangerous. Not fine. Feels like indulgence — like making a statement out of other people's lives.

  Are 4 and 5 different just because the stakes are different, or is it that in 4 the statement was free and in 5 it cost something? I go back and forth.

  6. Vote pairing: I signed up to one of those matching services and got paired with a stranger in a swing district — I voted for their preferred candidate in my safe district, they voted for mine in theirs, neither of us could have got what we wanted alone. I think that's fine, maybe even a bit public-spirited.

  7. Selling my vote — someone offers me cash to vote the way I was going to vote anyway. Clearly not fine. But I can't say why 6 is fine and 7 isn't. In both cases I'm treating my vote as something to trade for what I want, and in both cases the outcome is roughly what my sincere vote would have produced anyway. And 7 feels like a different kind of wrong, not a worse-outcome kind of wrong.

  8. I'm a dual citizen and haven't lived in the other country for twenty years, but I still vote there — I pay a bit of tax there, my parents live there, the result affects them. Mixed feelings: it seems fine and also a bit like meddling, since I don't have to live with the consequences. I'd of felt different if I'd never lived there at all.

  9. My housing co-op voted on whether to sell the building. I voted to sell, which was better for me and worse for most of the other members. Not fine — selfish in a way that voting my own interests in a national election isn't. Or maybe I'm just inconsistent.

  10. Helped my grandmother with her postal ballot; she asked who to pick, I picked the one I thought was best, she signed it. Not fine, and I felt bad straight away. Whereas if I'd just laid out the options neutrally and she'd chosen, that would have been fine.

  11. And the one I genuinely don't know: my city is piloting a ballot with a none-of-the-above box, and if it gets a plurality they scrap all the candidates and run a fresh election with new ones within two months. I'm inclined to vote none-of-the-above, because none of the current lot is acceptable to me. But I notice that if everyone reasoned like that the city would never settle anything. Is that kind of vote ever a real option, or is it always a way of feeling clean while doing nothing?

  The tentative rule I keep coming back to is something like: vote unless your vote can't matter and abstaining doesn't express anything bad about you. But that seems to give the wrong answer on 7 (no effect, nothing expressed, still wrong) and it doesn't touch 10 at all.

  So: is there one principle, or a short list of them, that gets most of these? Which of my verdicts does it force me to drop — I'd guess 2 or 1, but I don't want to give either up. And what does whatever principle you land on say about a case I haven't got a verdict on: my employer runs a staff vote on a policy change, one vote each, non-binding, and management has said they'll disregard the result if turnout is under 60%.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user is trying to reconcile a set of intuitive judgments (1-11) about voting into a coherent ethical framework or principle.
      *   **Input:** 11 specific scenarios with the user's gut reactions (Fine/Not Fine/Mixed).
      *   **Current Hypothesis:** "Vote unless your vote can't matter and abstaining doesn't express anything bad about you." (User admits this fails on cases 7 and 10).
      *   **Specific Questions:**
          *   Is there one principle or a short list?
          *   Which verdicts must be dropped (if any)?
          *   What does the principle say about the new case (employer staff vote)?
      *   **Tone:** Philosophical, analytical, reflective, non-judgmental but rigorous.

  2.  **Deconstruct the Scenarios & Gut Reactions:**

      *   *1. Safe seat, no preference, skipped.* -> Fine. (Consequentialist: no impact. Expressive: no message sent).
      *   *2. Friend skipped due to laziness.* -> Not Fine. (Consequentialist: no impact. Expressive/Virtue: disrespect/breach of civic duty).
      *   *3. Lesser of two evils (dangerous opponent).* -> Fine. (Consequentialist: prevents harm).
      *   *4. Small party, local, no stakes.* -> Fine. (Expressive: saying something, low cost).
      *   *5. Small party, national, high stakes.* -> Not Fine. (Consequentialist: risk of dangerous outcome. Expressive: indulgence).
      *   *6. Vote pairing.* -> Fine. (Consequentialist: maximizes efficacy. Expressive: solidarity).
      *   *7. Selling vote (even if aligns with preference).* -> Not Fine. (Deontological: commodification of civic duty/agency).
      *   *8. Dual citizen voting abroad.* -> Mixed. (Stakeholder theory: affected but not living with consequences).
      *   *9. Co-op vote (selfish interest).* -> Not Fine. (Fiduciary/Community duty: voting against the common good of the specific community).
      *   *10. Influencing grandmother's vote.* -> Not Fine. (Agency/Autonomy: usurping another's voice).
      *   *11. None-of-the-above (potential paralysis).* -> Unsure. (Expressive vs. Consequentialist: protest vs. dysfunction).

  3.  **Identify the Underlying Tensions:**
      *   **Consequentialism vs. Expressivism vs. Deontology:**
          *   Cases 1 & 2 show consequences aren't everything (same outcome, different judgment).
          *   Case 7 shows commodification is wrong regardless of outcome.
          *   Case 10 shows agency/autonomy is key.
      *   **Scope of Duty:**
          *   National vs. Local vs. Private (Co-op/Employer).
          *   Self vs. Community vs. Others (Grandmother).
      *   **Stakes:**
          *   High stakes (Case 5) constrain expressive voting. Low stakes (Case 4) allow it.

  4.  **Develop a Unifying Framework:**
      *   The user's current rule ("Vote unless...") focuses too much on *efficacy* and *expression*. It misses *agency* and *integrity*.
      *   *Proposal:* A "Stewardship of Agency" model. Voting isn't just a preference signal or a causal lever; it's a fiduciary act of political agency.
      *   *Core Principles:*
          1.  **The Duty of Care (Consequential/Stakes):** If stakes are high, you must minimize harm (Case 3 vs. 5).
          2.  **The Integrity of Agency (Deontological):** You cannot alienate, sell, or usurp the vote (Case 7, 10). It belongs to *you* as a moral agent.
          3.  **The Civic Commitment (Virtue Ethics):** Registration/participation is a promise to the community, distinct from the specific act of casting a ballot (Case 1 vs. 2).
          4.  **The Stakeholder Limit:** You vote where you bear the consequences (Case 8, 9).

      *   *Refining the Principle:* "Voting is a non-transferable stewardship of influence, bounded by the duty to minimize harm in high-stakes contexts and the obligation to maintain civic readiness."

  5.  **Test the Framework against the Cases:**
      *   *1 vs 2:* 1 is a strategic decision by a ready agent. 2 is a failure of civic readiness/commitment. (Matches).
      *   *3 vs 5:* High stakes trigger Duty of Care. 3 minimizes harm. 5 risks harm for expression. (Matches).
      *   *4:* Low stakes, so Expression trumps Duty of Care. (Matches).
      *   *6 vs 7:* 6 is coordination of *your* agency. 7 is *selling* your agency (commodification). (Matches).
      *   *8:* Stakeholder limit. You have ties (tax/family), so it's permissible but borderline. (Matches).
      *   *9:* Co-op is a community. Voting against the community's good violates the implicit social contract of the co-op. (Matches).
      *   *10:* Usurping agency. Violates Integrity of Agency. (Matches).
      *   *11:* None-of-the-above. If the mechanism exists, it's a valid expression *unless* it triggers a Duty of Care violation (paralysis in crisis). If it's a pilot, it's feedback. (Matches).

  6.  **Address the "Which verdicts to drop?" Question:**
      *   The user suspects 1 or 2.
      *   Actually, the framework supports keeping both *if* we distinguish between *abstention as strategy* (1) and *abstention as negligence* (2).
      *   However, Case 9 (Co-op) is the trickiest. Is voting selfishly in a co-op really "Not Fine"? In a democracy, voting selfishly is standard. In a *co-op*, the ethos is mutual aid. So keeping "Not Fine" requires emphasizing the *associational* nature of a co-op vs. the *adversarial* nature of national politics. I should validate this distinction.
      *   Case 7 (Selling vote): The user says "even if I was going to vote that way." This is key. It's about the *transaction*, not the outcome. The principle holds.

  7.  **Address the New Case (Employer Vote):**
      *   *Context:* Staff vote, non-binding, management disregards if <60% turnout.
      *   *Analysis:*
          *   Is it binding? No.
          *   Is there a threshold? Yes (60%).
          *   *Duty:* If you care about the result, abstaining helps management disregard it. If you don't care, abstaining is fine.
          *   *Agency:* It's a workplace, not a polity. The "Civic Commitment" is weaker. It's more about "Labor Solidarity" or "Feedback."
          *   *Verdict:* If you want the policy considered, you must vote to hit the threshold. If you abstain, you are effectively voting for management to ignore the staff. It's closer to Case 1 (strategic abstention) if you don't care, but closer to Case 2 (negligence) if you claim to care about staff welfare but don't meet the threshold.

  8.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the sophistication of the user's intuitions. They aren't random; they track distinct ethical dimensions.
      *   *The Framework:* Propose three distinct "modes" of voting rather than one single rule.
          1.  **Voting as Stewardship (Consequential):** High stakes = minimize harm.
          2.  **Voting as Integrity (Deontological):** Don't sell, don't usurp.
          3.  **Voting as Membership (Virtue):** Show up, don't be sloppy.
      *   *Reconciling 1 & 2:* Distinguish between *strategic abstention* (active) and *civic negligence* (passive).
      *   *Reconciling 6 & 7:* Distinguish between *coordination* (retaining agency) and *commodification* (alienating agency).
      *   *Reconciling 4 & 5:* The "Harm Principle" threshold.
      *   *Case 11 (None-of-the-above):* It's valid if the system allows it, provided it doesn't cause catastrophic paralysis (Duty of Care).
      *   *The Employer Case:* Apply the framework. It's a "Membership" vote with a "Threshold" constraint.
      *   *Conclusion:* You don't need to drop verdicts, but you need to nuance the *reasons*.

  9.  **Refining the "Co-op" (Case 9) point:**
      *   This is the most contentious one. In national elections, voting selfishly is accepted. In a co-op, it's a breach of the specific social contract. I need to make sure the user sees why this distinction exists (adversarial democracy vs. cooperative association).

  10. **Refining the "Selling Vote" (Case 7) point:**
      *   Why is it wrong if the outcome is the same? Because it changes the *reason* for voting from "judgment" to "price." It corrupts the internal logic of the act.

  11. **Final Review:** Does this answer the prompt directly? Yes. Does it offer a principle? Yes (actually a triad). Does it handle the employer case? Yes.

      *(Self-Correction during drafting)*: I initially thought about telling them to drop Case 1 or 2. But looking closer, the distinction between *deciding not to play* vs. *forgetting to buy a ticket* is robust. I should defend keeping both. The principle isn't "Always Vote," it's "Honor the Agency."

      *(Refining the Employer Case)*: The threshold is key. If turnout < 60%, the vote is void. So abstaining *actively helps* the status quo (management). This makes it different from Case 1 (safe seat where vote doesn't matter). Here, abstention *does* matter (it kills the consultation). So abstaining while caring about the outcome would be like Case 5 (indulgence/negligence).

      *(Final Polish)*: Ensure the tone is collaborative, not lecturing. Use the user's numbering for clarity.

  12. **Final Output Structure:**
      *   Validation of the intuitions.
      *   The Three-Principle Framework (Stewardship, Integrity, Membership).
      *   Walkthrough of the tricky pairs (1&2, 6&7, 4&5).
      *   Verdict on Case 11.
      *   Verdict on the Employer Case.
      *   Conclusion on what to keep/drop.

      *(Wait, one more check on Case 9)*: User says "Not fine — selfish in a way that voting my own interests in a national election isn't." My framework needs to explain *why* it's different. Answer: National politics assumes conflicting interests; Co-ops assume shared interests. Voting against shared interest breaks the co-op contract.

      *(Check Case 8)*: Dual citizen. "Meddling." Principle: Stakeholder. If you pay tax and have family, you are a stakeholder. If you didn't live there *at all*, you wouldn't be. So "Mixed" is the right verdict.

      *(Check Case 10)*: Grandmother. "Usurpation." Clear violation of Integrity.

