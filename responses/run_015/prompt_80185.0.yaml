answer: |-
  **Operational Procedure for Teleosemantic Classification of Novel Systems**

  This procedure operationalizes teleosemantics for artifacts and novel systems lacking direct evolutionary history. It separates substrate from software and integrates a "Derived Proper Function" clause to handle non-evolved systems.

  **Step 1: Level Segregation**
  Identify the vehicle of representation.
  *   **Question:** Is the candidate system the physical substrate (hardware/brain) or the functional program (software/policy)?
  *   **Action:** Analyze each level separately. Do not conflate the selection history of the brain with the training history of the algorithm.
  *   **Stop Condition:** If you cannot distinguish the mechanism producing the output from the medium running it, halt. The theory requires a distinct vehicle.

  **Step 2: Direct Selection History Query**
  Determine if the specific mapping has a history of selection.
  *   **Question:** Was this specific mechanism reproduced or retained because it successfully mapped state *X* to state *Y* in the past?
  *   **Sufficient Answer:** Yes (Evolutionary) or Yes (Artificial Selection via reproduction of code).
  *   **Stop Condition:** If **No**, proceed to Step 3. Under standard teleosemantics, a **No** here yields *no content* and *no misrepresentation*.

  **Step 3: Derived Proper Function Clause (The Modification)**
  Apply this only if Step 2 failed. This attributes function based on designer intent or subsystem inheritance.
  *   **Question:** Was the system designed by a selector (human engineer) with a specific "Use Plan" for this mechanism, or does it inherit function from a selected substrate?
  *   **Sufficient Answer:** There must be evidence of a specific intent for the mechanism to correlate with environmental states, not just to produce useful outputs.
  *   **Price:** This shifts normativity from nature to designer intent. If the designer intended "utility" rather than "truth," the content is pragmatic, not semantic.
  *   **Stop Condition:** If the system is emergent (e.g., internal activations not explicitly designed), the procedure halts. Teleosemantics cannot assign content to unintended emergent properties without stretching the theory beyond recognition.

  **Step 4: Normative Standard Identification**
  Establish the condition for success.
  *   **Question:** Is there a condition of success independent of the system's actual performance?
  *   **Sufficient Answer:** Yes. There must be a state of the world that *makes* the representation correct, distinct from the system merely surviving or minimizing loss.
  *   **Stop Condition:** If success is defined solely by reward maximization or loss minimization, the procedure halts. Pragmatic success is not semantic correctness.

  **Step 5: Misrepresentation Verdict**
  *   **Question:** Did the system fail to meet the Normative Standard (Step 4) while operating under its Proper Function (Step 2 or 3)?
  *   **Verdict:** **Yes** (Misrepresentation), **No** (Accurate/Empty), or **Undecidable** (Theory limits reached).

  ***

  **Case Study 1: Language Model (LLM) Factual Claim**
  *Scenario:* An LLM generates a factual claim about a recent event absent from its training data.

  *   **Step 1 (Levels):** Substrate is GPU/Brain (biological or silicon). Program is the transformer weights. We analyze the **Program**.
  *   **Step 2 (Direct Selection):** Were the weights selected for truth-telling? **No.** They were selected via gradient descent to minimize next-token prediction loss.
  *   **Step 3 (Derived Function):** Did designers intend specific weights to represent specific facts? **No.** Designers intended a general-purpose text generator. The specific claim is emergent.
      *   *Procedure Status:* **Halts.** The Derived Function Clause requires a specific Use Plan for the representation. There is no selection history for *this* proposition.
      *   *Modification Attempt:* If we argue the system inherits a general function "to inform," the content becomes "useful text" rather than "true proposition."
  *   **Step 4 (Normative Standard):** Is there a truth condition? Only if we impose it externally. Internally, the standard is probability distribution match.
  *   **Verdict:** **Undecidable / No Misrepresentation.** Under strict teleosemantics, the system cannot misrepresent because it has no proper function to represent truth. It only has a function to predict tokens. If you classify this as misrepresentation, you are abandoning teleosemantics for a correspondence theory.

  **Case Study 2: Robot Visual Policy**
  *Scenario:* A robot trained via reinforcement learning (RL) to grasp objects misclassifies a novel object (e.g., treats a toy snake as a real snake) and fails to grasp.

  *   **Step 1 (Levels):** Substrate is the robot body/brain. Program is the visual policy network. We analyze the **Program**.
  *   **Step 2 (Direct Selection):** Was the policy selected for correct classification? **No.** It was selected for reward (successful grasps).
  *   **Step 3 (Derived Function):** Did designers intend the visual layer to classify? **Yes,** implicitly, as a means to grasping.
      *   *Modification Price:* The proper function is *grasping*, not *classifying*. Classification is instrumental.
  *   **Step 4 (Normative Standard):** What is success? A successful grasp.
      *   *Analysis:* The robot failed to grasp. However, did it misrepresent? Only if "representing a snake" was the proper function. If the proper function is "activate motor sequence X," then it simply failed to function, rather than misrepresenting.
  *   **Verdict:** **No Misrepresentation (Pragmatic Failure).** The procedure classifies this as a performance error, not a semantic error. The content is likely imperative ("Grasp here") rather than descriptive ("This is a snake").

  ***

  **Limitations and Unwanted Answers**

  You requested to see where this procedure yields results you might dislike or where it stops.

  1.  **The Emergence Problem (Step 3 Halt):** In both cases, the specific representations (the specific token string, the specific feature activation) were not individually selected. They are emergent properties of a loss-minimization process. The procedure forces you to admit that teleosemantics cannot easily assign content to novel, emergent internal states without fudging the "selection" criterion. If you want to call these misrepresentations, you must adopt a structural or causal theory, not a teleological one.
  2.  **The Pragmatic Reduction (Step 4 Price):** The procedure consistently reduces semantic content to pragmatic utility. For the LLM, "truth" collapses into "predictive utility." For the robot, "classification" collapses into "motor success." If your project requires robust truth-conditional content for AI, this procedure will tell you teleosemantics cannot provide it for non-evolved systems without significant revision.
  3.  **Substrate Ambiguity (Step 1):** If the robot runs on a biological brain (e.g., a cyborg or organoid), Step 1 becomes critical. The brain has evolutionary history; the software does not. The procedure forces you to choose: is the content biological (likely non-conceptual) or software-based (likely non-semantic)? You cannot have it both ways.

  **Summary for Afternoon Use**
  To run this on a new case:
  1.  Split hardware and software.
  2.  Ask: "Was this specific mapping selected for?" If no, ask: "Did a designer intend this specific mapping?"
  3.  If the answer to both is no, teleosemantics says **no content**.
  4.  If the answer is yes, ask: "Is the success condition truth or utility?" If utility, you have pragmatic content, not semantic misrepresentation.

  This procedure protects the theory from vacuity by refusing to assign content where there is no normative history, but the price is that it excludes most modern AI from having genuine representational states.
