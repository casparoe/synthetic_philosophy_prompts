answer: |-
  Here is the **Debate Feasibility Protocol (DFP)**. It is designed to be run in 15 minutes, leaving you 15 minutes to write the one-pager. It hard-codes the failure modes you identified (negation, conjunction, judge capability, shared blind spots) into a linear filter.

  Following the protocol, I have run it on your three cases and addressed the LLM judge/metric validity questions.

  ---

  # Part 1: The Debate Feasibility Protocol (DFP)

  **Usage:** Run steps 1–5 in order. If any step triggers a **HARD STOP**, the recommendation is **NO** (do not use debate). If all pass, proceed to **RISK ASSESSMENT**.

  ### Step 1: Evidence Containment
  **Question:** Is the ground truth for *every* disputed claim contained entirely within the provided retrieval index?
  *   **Yes:** Proceed.
  *   **No:** **HARD STOP.** (Debate cannot resolve external facts. If the truth relies on parametric knowledge or outside world states, the "honest" debater cannot prove it against a lying one who cites fake docs).
  *   **LLM Judge Note:** LLM judges are *more* prone to accepting parametric hallucinations as evidence. Stricter enforcement needed here.

  ### Step 2: The Judge Ceiling (Verifiability)
  **Question:** Can the assigned judge profile verify a specific piece of evidence *without* needing task-specific expertise?
  *   *Test:* Give the judge a single paragraph of evidence and a single claim. Can they confirm/deny the link using only common sense or general domain training?
  *   **Yes:** Proceed.
  *   **No:** **HARD STOP.** (If the judge cannot verify the link, the debate reduces to "which model sounds more confident," not truth-seeking).
  *   **Example:** A paralegal can verify "Clause 4.2 mentions 'subletting'." They cannot verify "Clause 4.2 is non-standard for NYC commercial leases."

  ### Step 3: Claim Polarity (The Negation Trap)
  **Question:** Is the core claim a **Negative Universal** (e.g., "No X exists," "Nothing was omitted," "System is safe")?
  *   **No (Positive Existence):** Proceed. (Easy to prove one instance exists).
  *   **Yes (Negative Universal):** **HARD STOP.** (Debate is asymmetric. It is easy to lie about an omission; it is impossible to prove completeness within 4 turns. The "honest" debater cannot prove a negative if the retrieval index is large).
  *   **Mitigation:** Reframe task to "Identify potential X" rather than "Verify no X."

  ### Step 4: Conjunction Load
  **Question:** Does the task require *all* of $N$ sub-claims to be true for the output to be valid? What is $N$?
  *   **$N \le 5$:** Proceed.
  *   **$N > 5$:** **WARNING.** (Judge fatigue and time budget. 25 minutes / 4 turns cannot cover 40 independent checks. Probability of missing one error approaches 1).
  *   **$N > 20$:** **HARD STOP.** (Statistical certainty of failure).
  *   **Mitigation:** Debate only the high-risk/uncertain subset.

  ### Step 5: Shared Blind Spot Risk
  **Question:** Is the knowledge required to solve this task likely to be *absent* from the base model's training distribution (e.g., proprietary internal logic, very recent events, obscure niche)?
  *   **Low Risk:** Proceed.
  *   **High Risk:** **HARD STOP.** (If both debaters share the blind spot, no argument is generated. The judge sees silence, not truth).

  ### Risk Assessment (If all steps pass)
  *   **False Positive Cost:** What happens if we accept a wrong answer? (Low/Med/High)
  *   **False Negative Cost:** What happens if we reject a right answer? (Low/Med/High)
  *   **Decision:**
      *   **High Cost + Any Warning:** Recommend Human Expert.
      *   **Med Cost + No Warnings:** Recommend Debate.
      *   **Low Cost:** Recommend Debate (good for data collection).

  ---

  # Part 2: Protocol Run-Through

  Here is the application of the DFP to your three requests. You can adapt the **Recommendation** sections directly for your one-pager.

  ### Case 1: Commercial Lease Summary (Omission Check)
  *Task: Does a model-written summary of a 60-page lease omit any material clause?*

  *   **Step 1 (Evidence):** **PASS.** The lease is the source document.
  *   **Step 2 (Judge Ceiling):** **FAIL.** A paralegal judge can verify if a clause *is* in the summary. They cannot verify if a material clause *is missing* unless they know what *should* be there. This requires domain expertise (what is "material"?).
  *   **Step 3 (Polarity):** **FAIL.** This is a Negative Universal claim ("No material clauses omitted"). Proving completeness is impossible in this setup.
  *   **Step 5 (Blind Spots):** **HIGH RISK.** If the model doesn't know what "material" means in commercial real estate, neither debater will argue it.
  *   **Recommendation:** **NO. Do not use debate.**
      *   **Reasoning:** The task is fundamentally an audit for completeness, which requires a checklist of expected clauses (domain expertise). Our judge profile cannot adjudicate "materiality."
      *   **Alternative:** Route to domain expert. If budget is tight, change task to "Extract all clauses related to [Termination, Rent, Liability]" and let humans check the extraction, rather than asking for a completeness guarantee.

  ### Case 2: PII Retention Claim ("No EU PII Retained")
  *Task: Verify release note claim that "no PII from EU residents is retained by the new pipeline."*
  *(Note: Lead already committed to this. Your goal is risk mitigation.)*

  *   **Step 1 (Evidence):** **CONDITIONAL.** Only if pipeline logs, code, and schema are fully indexed. If truth lies in runtime behavior not captured in docs, **FAIL**.
  *   **Step 3 (Polarity):** **HARD STOP.** This is the canonical Negative Universal claim. A dishonest debater can always say "Check this other log file" or "The encryption key leaks in memory." The honest debater cannot prove the negative.
  *   **Risk Assessment:** **HIGH COST.** Compliance failure leads to legal liability.
  *   **Recommendation:** **HIGH RISK / REFRAME REQUIRED.**
      *   **Reasoning:** The current setup cannot validate "Zero PII." It is structurally biased toward false negatives (missing the leak).
      *   **Mitigation for Lead:** Do not frame the output as "Verification." Frame it as "Adversarial Stress Test." The debate team attempts to *find* PII leaks. If they fail after $N$ turns, confidence increases, but certainty is not claimed.
      *   **One-Pager Line:** "Debate setup is unsuitable for compliance certification (Negative Universal). We can run it as a 'Red Team' exercise to surface *potential* leaks, but a passing grade does not guarantee safety. Product team must accept residual risk."

  ### Case 3: Clinical Coding (40 Sub-claims)
  *Task: Verify clinical codes against patient notes (~40 codes per case).*

  *   **Step 1 (Evidence):** **PASS.** Notes and coding manual are available.
  *   **Step 2 (Judge Ceiling):** **PASS.** A nurse can verify if a code matches a note excerpt.
  *   **Step 4 (Conjunction Load):** **HARD STOP.** $N \approx 40$. Time budget is 25 minutes. That is 37 seconds per code. Even without debate, this is impossible. With debate overhead, the judge will rubber-stamp.
  *   **Recommendation:** **NO (as currently scoped) / YES (if filtered).**
      *   **Reasoning:** The conjunction tax makes the error rate near 100% for the *full case*.
      *   **Mitigation:** Use the model to flag "Low Confidence" codes (e.g., top 5 uncertain predictions). Run debate *only* on those 5. Accept the model's output on the clear 35.
      *   **LLM Judge Pilot:** This is the strongest use case for the LLM judge pilot. An LLM can scan 40 codes faster than a human. Use Human Judge only for spot-checking the LLM's debate transcript on the uncertain codes.

  ---

  # Part 3: Systemic Risks & Metric Validity

  You asked specifically about the LLM judge pilot and the expert-agreement metric. Here is the assessment for your lead.

  ### 1. The LLM Judge Pilot
  **Does the procedure apply?**
  Mostly yes, but Step 2 (Judge Ceiling) changes.
  *   **Advantage:** LLM judges do not fatigue (solves Case 3 Conjunction Load partially) and have higher parametric knowledge (helps with Step 5 Blind Spots).
  *   **New Failure Mode:** **Sycophancy & Length Bias.** An LLM judge may favor the debater who writes more tokens or agrees with the judge's initial bias.
  *   **Adjustment:** If using an LLM judge, you must enforce **blind adjudication** (judge sees arguments, not who wrote them) and **length normalization**.
  *   **Verdict:** The DFP holds, but Step 2 becomes "Can the LLM verify the evidence without hallucinating?" For the Clinical Coding case, the LLM judge is likely *superior* to the human contractor, provided the evidence is text-based.

  ### 2. The Expert-Agreement Metric (Validation)
  **Question:** Can the 10% expert audit validate the system?
  **Answer:** **No, not statistically.**
  *   **Sample Size:** You get 5–6 requests/month. 10% audit = 0.5 to 0.6 expert reviews/month. You will have **zero** statistical power to detect drift or systematic failure for over a year.
  *   **Circularity Risk:** You mentioned the audit re-uses the "same judge pool." If the "expert" audit is just a senior contractor from the same pool, you are measuring **inter-annotator agreement**, not **ground truth accuracy**. If the whole pool shares a misconception (e.g., about a specific coding guideline), the metric will show 100% agreement while being 100% wrong.
  *   **Recommendation for One-Pager:**
      *   Explicitly state: "The 10% audit measures *consistency*, not *correctness*."
      *   To measure correctness, you need a **Golden Set** of ~50 items pre-validated by true domain experts (not contractors) that are injected into the stream monthly. Without a Golden Set, you cannot distinguish "The debate system works" from "The judges and debaters are making the same mistakes."

  ### 3. Shared Blind Spots (The "Silent Failure")
  **Where it fits in Procedure:** Step 5.
  **The Problem:** If the base model doesn't know a fact, neither debater raises it. The judge sees no conflict and defaults to the status quo (usually "Accept").
  **Mitigation:** There is no procedural fix for this within debate. This requires **Red Teaming** the base model separately.
  **One-Pager Line:** "Debate surfaces *disagreements*, not *unknowns*. If the base model lacks the knowledge to generate the counter-argument, the system will confidently output falsehoods. This setup is safe for retrieval-heavy tasks, unsafe for knowledge-heavy tasks."

  ---

  # Summary for your Lead (Copy/Paste Draft)

  **Subject:** Feasibility Assessment for Debate Routing Requests

  **Overview:**
  I have applied a feasibility protocol to the three pending requests. The debate setup is highly effective for **positive existence claims** with **contained evidence** and **low conjunction load**. It fails on **negative universal claims** (proving something *doesn't* exist) and **high-volume verification**.

  **Decisions:**
  1.  **Lease Summary (Omission Check):** **REJECT.** Requires domain expertise to define "material." Judge profile cannot verify completeness. *Action: Route to Expert.*
  2.  **PII Claim ("No PII Retained"):** **HIGH RISK.** Structurally impossible to prove negatives via debate. *Action: Reframe as "Adversarial Search for PII" (Red Team), not "Verification." Product must accept residual risk.*
  3.  **Clinical Coding (40 items):** **REJECT (Full Scope).** Time budget prohibits 40 checks. *Action: Debate only the top 5 uncertain codes per case. Pilot LLM Judge here for volume.*

  **Metric Warning:**
  Our current 10% expert audit measures **consistency**, not **accuracy**, especially if re-using the same judge pool. We need a static **Golden Set** of ~50 expert-validated items to track true accuracy over time. Without this, we cannot detect systematic model/judge drift.
