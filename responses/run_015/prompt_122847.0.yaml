prompt: |-
  Hey — I'm a 4th-year CS PhD student (ML eval / human-AI stuff) and I've been doing a two-days-a-week thing with an alignment team at a mid-size lab for about six months. My actual job there is being the person who says yes or no when a product team comes and asks to route some task through our debate setup instead of paying a domain expert to check model outputs directly. I get maybe five or six of these requests a month, I have 30–45 minutes per request, and my recommendation goes to a team lead who's a staff engineer and not a theorist — so it needs to be a one-pager with reasons she can push back on, not a lit review. Please don't cite papers at me; I've read the original debate proposal and the follow-ups, I need something I can run.

  Our setup, so you know what we're actually talking about: two debater models, same underlying base model, no tools except a shared retrieval index over the task's own source documents. A judge who's a contractor with general domain training but no task expertise (a paralegal judging contract summaries, a nurse judging clinical coding), 25 minutes per item, four turns total, 300 words max per turn, up to two judge questions, and a rule that if a debater explicitly concedes a point the judge is told to treat it as settled. 10% of items get re-adjudicated by a real expert and the agreement rate is our headline metric. We're also about to piloting an LLM judge with a human spot-check, and I want to know whether whatever procedure you give me even applies to that case or whether it quietly falls apart.

  Right now my test is basically one question: "could the honest debater point at something this specific judge can check?" It keeps giving me answers I don't trust. I want that turned into an actual ordered procedure — questions in the order to ask them, what counts as a sufficient answer to each, where it hard-stops with a no, and where it has to hand the decision to a person because it's a values question (how much residual risk we accept, whether judge-relativity is ok for the downstream use). Things I think it has to handle but don't know how to place: claims that are one-sidedly checkable (it's easy to raise a doubt about a negative claim like "no PII is retained anywhere in this pipeline" and impossible to demonstrate it), long-horizon empirical claims that can't be settled inside 25 minutes, the difference between "there's a fact of the matter" and "the true answer is demonstrable to *this* judge with *this* evidence," and the thing where every individual sub-claim is checkable but the conjunction is what we care about and there isn't budget to check all of it. Also: both debaters share a base model, so I'm worried about shared blind spots — if neither debater knows something, no argument surfaces it, and I don't know where in the procedure that belongs.

  Give me the procedure and then run it on three real-ish requests: (1) does a model-written summary of a 60-page commercial lease omit any material clause; (2) does a release note's claim that "no PII from EU residents is retained by the new pipeline" hold up (my lead already told the product team we'd do this one, so I need to know how bad it is); (3) clinical coding where each sub-claim is individually checkable but there are ~40 of them per case — I have a feeling this is the one where you're going to give me an answer I don't want. Include at least one case where the honest output is "no, don't use debate here, use something slower." And be explicit about what the procedure can't do — I especially want to know whether the expert-agreement metric can even validate it, since the audit re-uses the same judge pool.
