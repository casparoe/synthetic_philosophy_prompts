  # JOINT STATEMENT ON APPLIED ONTOLOGY AND METAONTOLOGICAL DISPUTE

  ### I. Agreed Claims

  1.  **Ontological Commitment:** We agree that asserting the existence of an entity (e.g., "Corporations exist") typically incurs an ontological commitment within the discourse in which the assertion is made. However, we acknowledge that the metaphysical weight of this commitment—whether it implies mind-independent reality or merely utility within a conceptual scheme—is the primary locus of our disagreement.
  2.  **Quantifier Variance:** We agree that quantifier meaning (the sense of "there exists") can vary across different linguistic frameworks and domains of inquiry. We concur that in some contexts, existence claims are best understood as shorthand for complex conditions regarding social practices, linguistic conventions, or functional roles rather than assertions of fundamental physical presence.
  3.  **Explanatory Structure in Applied Domains:** We agree that applied domains such as law, medicine, and aesthetics possess distinct explanatory structures governed by specific aims (e.g., justice, health, aesthetic appreciation). We further agree that any viable ontological account of these domains must respect the internal success conditions of these practices and cannot simply impose external metaphysical criteria without engaging with domain-specific efficacy.
  4.  **Conditions for Verbal Disputes:** We agree that a dispute counts as merely verbal if charitable reconstruction of the opposing party's language allows for agreement on all non-linguistic facts and predictive outcomes without loss of explanatory power. Conversely, we agree that a dispute is substantive if rival positions entail distinct empirical predictions, normative consequences, or explanatory capacities that cannot be harmonized through semantic clarification alone.

  ### II. Disagreements Table

  | Topic | Deflationist Formulation | Realist Formulation |
  | :--- | :--- | :--- |
  | **Explanatory Success & Ontological Commitment** | Explanatory success in applied domains (e.g., predicting market behavior or treatment outcomes) does not require ontological commitment to the entities posited; success is sufficient proof of the framework's pragmatic utility, not its metaphysical accuracy. | Explanatory success in applied domains provides defeasible evidence for the genuine existence of the posited entities; utility is a byproduct of the theory latching onto real, mind-independent structures or social objects. |
  | **Framework Selection** | Framework selection is never rationally compelled by evidence in a domain-independent sense; it is always determined by pragmatic convenience, social goals, and the specific aims of the inquirers. | Framework selection can be rationally compelled by evidence; some conceptual schemes are objectively better because they align with the actual structure of reality, even in institutional or social domains. |
  | **Nature of Institutional Entities** | Institutional entities (corporations, diseases, artworks) are ontologically lightweight; they are constituted entirely by collective intentionality and rules, with no residual "realness" beyond their functional role. | Institutional entities are ontologically robust; while dependent on human activity, they emerge as real causal powers that constrain and enable action independently of individual beliefs. |

  ### III. The Cruxes

  **Crux 1: Domain-Independent Criterion of Ontological Seriousness**
  The fundamental divergence lies in whether there exists a "God's eye" criterion for determining which entities are real, applicable across all domains (fundamental physics, law, medicine), or whether ontological seriousness is always internal to a specific framework. The Deflationist denies the possibility of a domain-independent criterion, arguing that "existence" is a pluralistic concept. The Realist maintains that without a domain-independent criterion, ontology collapses into mere sociology or linguistics, losing its ability to adjudicate between competing theories of the world.

  **Crux 2: Explanatory Redundancy in Principle**
  The second divergence concerns whether institutional entities can be eliminated in principle without explanatory loss. The Deflationist argues that for any institutional entity, a paraphrase exists that references only individuals, physical objects, and rules, rendering the entity explanatorily redundant. The Realist argues that such paraphrases inevitably fail to capture the causal powers and systemic constraints of the institutional entity, meaning the entity is not redundant but indispensable for a complete explanation of the domain.

  ### IV. Concrete Cases and Advance Predictions

  **Case for Crux 1: Corporate Personhood in Bankruptcy Proceedings**
  *Context:* Determining whether a corporate entity persists as a liable agent during Chapter 11 reorganization, distinct from its shareholders and assets.
  *   **Deflationist Prediction:** This case will reveal that "corporate existence" is purely a matter of legal stipulation. The outcome will depend on statutory interpretation and policy goals (e.g., economic stability), not on discovering whether the corporation is a "real" object. The ontological status will shift based on the legal framework's needs, proving existence is framework-relative.
  *   **Realist Prediction:** This case will reveal that the corporation functions as a genuine social agent with causal powers (e.g., the ability to hold debt, sue, be sued) that cannot be reduced to the sum of its employees or assets. The legal treatment tracks a pre-existing social reality; if the law treated the corporation otherwise, it would fail to predict the economic outcomes, proving existence is evidence-compelled.

  **Case for Crux 2: Psychiatric Taxonomy (Depression Subtypes)**
  *Context:* Adopting one taxonomy of depressive disorders over another (e.g., symptom-based DSM categories vs. neurobiological RDoC dimensions).
  *   **Deflationist Prediction:** This case will demonstrate that no single taxonomy is "true." Different classifications will serve different aims (clinical treatment vs. genetic research) with equal validity. Explanatory redundancy will be demonstrated by showing that neurobiological data can be described without positing "disease entities," treating them instead as patterns of dysfunction.
  *   **Realist Prediction:** This case will demonstrate that one taxonomy will eventually align with causal mechanisms (e.g., specific neural circuit dysfunctions), rendering competing taxonomies false or obsolete. Explanatory redundancy cannot be demonstrated because the "disease" acts as a common cause for diverse symptoms; eliminating the entity breaks the explanatory chain.
