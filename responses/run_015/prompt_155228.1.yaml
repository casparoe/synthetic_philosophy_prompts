answer: |-
  Here is a structured plan for your workshop. Since your audience is writers, the goal isn't to make them philosophers, but to give them a tool to deepen character motivation. The Heterogeneity Problem is perfect for this because it exposes the vagueness of "wanting pleasure."

  ### 1. The Prerequisite Concept: "The Common Currency"
  Before you introduce the problem, you must establish what Hedonism *requires* to function.
  *   **The Concept:** Tell them that for a character to be a true hedonist, "Pleasure" must act like a **single currency** (like dollars).
  *   **The Logic:** If I can trade "eating a taco" for "reading a poem," there must be a shared unit of value we are measuring. If there is no shared unit, the character isn't chasing *one thing* (Pleasure); they are chasing *many different things* (Tacos, Poems, Status, Relief).
  *   **Why this matters:** If there is no common currency, the protagonist's arc isn't a straight line toward a goal; it's a fragmentation of self.

  ### 2. The Single Visceral Example
  Do not use your book example for the *initial explanation*. It is too nuanced for the first pass. Use the classic philosophical hammer that breaks the "intensity" intuition.

  *   **The Example:** **Scratching a severe itch** vs. **Listening to a resolving musical chord.**
  *   **Why this works:**
      *   **Visceral:** Everyone knows the relief of an itch. Everyone knows the satisfaction of musical resolution.
      *   **Breaks Intensity:** An itch-scratch can be high intensity (urgent, physical). Music can be low intensity (calm, aesthetic). If pleasure were just "intensity," the itch wins. But most people wouldn't trade a symphony for an itch-scratch session.
      *   **The Kill Shot:** Ask them: *"What is the specific sensation that is identical in both?"*
      *   **The Result:** There isn't one. The itch is the *removal of a negative* (relief). The music is the *presence of a positive* (engagement). They feel like opposites, yet we call both "pleasure."

  ### 3. The Explanatory Arc (Sequence)
  1.  **Define the Hedonist Goal:** The protagonist wants to maximize "Pleasure."
  2.  **Establish the Currency:** To maximize it, we must be able to measure it. To measure it, it must be one consistent thing.
  3.  **Deploy the Example:** Contrast the Itch (Relief) vs. The Chord (Engagement).
  4.  **Reveal the Problem:** If they feel fundamentally different, "Pleasure" isn't a *thing* they are finding; it's a *label* they are pasting on different experiences.
  5.  **The Writer's Takeaway:** Your protagonist isn't confused about *how* to get pleasure; they are confused about *what* pleasure is. That is your conflict.

  ### 4. Misconceptions & When to Head Them Off
  Writers will try to solve the philosophical problem with plot solutions. Intercept these immediately.

  *   **Misconception 1: "One is bodily, one is mental."**
      *   *When it arises:* Immediately after the Itch/Chord example.
      *   *The Fix:* Say: "Even if we stick only to the body, compare **drinking water when dying of thirst** to **the feeling of warm sunlight on skin**. Both are physical. One is desperate relief, one is gentle addition. They still share no common sensation."
  *   **Misconception 2: "Pleasure is just Satisfaction/Getting what you want."**
      *   *When it arises:* When they try to define the "common feature."
      *   *The Fix:* Distinguish the *object* from the *feeling*. "Satisfaction is the judgment that a goal was met. Pleasure is the sensory experience. You can be satisfied without pleasure (finishing a tax return) and have pleasure without satisfaction (eating cake while depressed)."
  *   **Misconception 3: "It's just about Intensity."**
      *   *When it arises:* During the example.
      *   *The Fix:* Use the Itch/Chord contrast. High intensity itch vs. Low intensity chord. If intensity were the metric, the itch is 'better.' It isn't.

  ### 5. The Comprehension Check
  Do not ask them to define the problem. Ask them to apply the *confusion*.

  *   **The Task:** "Write three sentences from your protagonist's POV. In the first, they pursue a 'relief' pleasure (itch). In the second, they pursue an 'engagement' pleasure (chord). In the third, they realize these two feelings cannot be added together."
  *   **Success Indicator:** They understand the problem if the third sentence expresses **incommensurability** (e.g., *"He tried to weigh the silence against the hunger, but the scale had no numbers."*).
  *   **Failure Indicator:** If they write that the character is just "tired" or "confused," they haven't grasped the structural problem.

  ### 6. What to Leave Out
  *   **Mill vs. Bentham (Higher/Lower Pleasures):** Cut this entirely. That is a *normative* debate (which pleasure is *better*). You are teaching a *metaphysical* problem (do they share a *nature*). Bringing in "quality" muddies the water of "heterogeneity."
  *   **Neurobiology:** Do not mention dopamine or opioids. Keep it phenomenological (what it feels like), not biological.
  *   **Solutions:** Do not offer a solution to the Heterogeneity Problem. There isn't a consensus one. Leave them with the tension.

  ### 7. Verdict on Your Example (Anticipation vs. Consumption)
  **Does it fit?** Yes, but with a warning.
  **Does it break the plan?** It risks confusing *Time* with *Quality*.

  *   **The Risk:** Writers might think, "Oh, anticipation is just *before* and consumption is *after*." They will view it as a timeline, not a heterogeneity problem.
  *   **How to Fix It:** You must frame Anticipation vs. Consumption not as "Before vs. After," but as **"Tension vs. Release."**
      *   Anticipation is often a pleasurable *ache* (positive tension).
      *   Consumption is often a pleasurable *dissipation* (negative relief).
      *   If you frame it this way, it becomes a perfect subset of the Heterogeneity Problem. It shows that even within a single desire, the "pleasure" changes its fundamental nature.
  *   **Placement:** Use your example **after** the Itch/Chord example. Use Itch/Chord to teach the theory, then use your Book Example to show how it applies to narrative structure.

  **Summary for Tuesday:**
  Start with the "Common Currency." Smash it with the "Itch vs. Chord." Intercept the "Body/Mind" objection. Use your "Anticipation/Consumption" example to show how this creates character conflict. End with the writing check. Leave Mill and Bentham on the shelf.
