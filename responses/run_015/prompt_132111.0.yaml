prompt: |-
  I'm prepping for a talk next thurs at the interdiscplinary philosophy/econ workshop. I'm defending the view that fiat money is a socially constructed kind, but not in the boring 'we all agree' way — instead its stability comes from institutional epistemic closure. Central banks and payment rails systematically suppress counterfactual information about failure modes, so 'value' gets tracked by structured ignorance rather than shared belief. That's why hyperinflation is always a surprise even to insiders. My sketch: the kind 'US dollar' is maintained not because people jointly intend it, but because the information environment is engineered so that agents can't acquire reliable knowledge of the worlds where it collapses, which creates a tracking loop that looks like belief but functions like closure.

  Audience is mixed: three post-Keynesians who'll say I'm just redescribing liquidity preferance in fancy language, two philosophers of science who work on social kinds and will ask if my closure mechanism is just feedback loops with extra steps, one rationalist decision-theory guy who keeps bringing up prediction markets and hidden agent models, and a historian of 70s monetary policy who will destroy me if I misattribute anything about Bretton Woods. Mostly economists and phil sci people, no other decision theorists.

  I need a Q&A prep sheet — not a bibliography, just moves. Give me the six or seven objections in roughly the order they'll come, phrased like each camp actually talks. For each one: how damaging it is, what I should concede up front, a two-minute reply, and where that reply is softest. Flag the weakest point in my own position that I should defend actively rather than hoping they miss it. And include the question I'm praying nobody asks — probably whether this implies we should abolish central banks or if I'm just describing trust with extra jargon. Keep it practical, I just need to survive the room.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User's Request:**
      *   **Topic:** Fiat money as a socially constructed kind based on *institutional epistemic closure* (suppressing counterfactual info about failure modes) rather than shared belief/joint intention.
      *   **Context:** Interdisciplinary philosophy/econ workshop next Thursday.
      *   **Audience:**
          *   3 Post-Keynesians (liquidity preference, endogenous money).
          *   2 Philosophers of Science (social kinds, feedback loops).
          *   1 Rationalist Decision-Theorist (prediction markets, hidden agents).
          *   1 Historian of 70s Monetary Policy (Bretton Woods, Nixon Shock).
      *   **Deliverable:** Q&A prep sheet (6-7 objections, ordered likely occurrence, damage assessment, concession, 2-min reply, soft spot).
      *   **Specific Requirement:** Flag the weakest point in the user's position. Include the "prayer" question (abolish CBs? just trust?).
      *   **Tone:** Practical, survival-oriented, academic but sharp.

  2.  **Deconstruct the Core Argument:**
      *   *Thesis:* Money's stability $\neq$ shared belief. Money's stability $=$ engineered ignorance (epistemic closure).
      *   *Mechanism:* Central banks/payment rails hide failure mode info $\rightarrow$ agents can't model collapse $\rightarrow$ tracking loop looks like belief but is actually closure.
      *   *Implication:* Hyperinflation is a surprise because the information environment breaks down, not because beliefs change first.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Post-Keynesians):* They will hit the "liquidity preference" angle. Money is about state power and tax drives, not epistemic tricks.
          *   *Phrasing:* "Isn't this just Chartalism with extra steps?"
          *   *Damage:* High. They dominate the room numerically.
          *   *Concession:* State power is necessary.
          *   *Reply:* Power enforces the *closure*, not just the acceptance.
          *   *Soft Spot:* Distinguishing "power" from "information control."

      *   *Objection 2 (Phil Sci):* Social kinds usually involve feedback loops (Hacking). Is "epistemic closure" just a fancy name for a negative feedback loop?
          *   *Phrasing:* "Is this mechanism distinct from standard reflexive stability?"
          *   *Damage:* Medium-High. Attacks the philosophical novelty.
          *   *Concession:* It is a feedback loop.
          *   *Reply:* It's *asymmetric* information suppression, not just feedback.
          *   *Soft Spot:* Defining the boundary between "feedback" and "suppression."

      *   *Objection 3 (Rationalist):* Prediction markets price in collapse. If info is suppressed, why don't insiders bet against it?
          *   *Phrasing:* "What about the smart money? They know."
          *   *Damage:* Medium.
          *   *Concession:* Insiders know *some* things.
          *   *Reply:* They don't know *when* or *how* the closure breaks (coordination problem).
          *   *Soft Spot:* Explaining why insiders don't arbitrage the "ignorance."

      *   *Objection 4 (Historian):* 70s inflation wasn't a surprise. It was policy choice (Volcker, Burns).
          *   *Phrasing:* "Bretton Woods collapse was telegraphed for years."
          *   *Damage:* High (Factual check).
          *   *Concession:* Some signals existed.
          *   *Reply:* Signals existed, but the *mechanism* of failure was obscured (Eurodollars, etc.).
          *   *Soft Spot:* Specific historical claims.

      *   *Objection 5 (General Econ/Phil):* If it's ignorance, why doesn't more transparency help?
          *   *Phrasing:* "Shouldn't we want more info?"
          *   *Damage:* Medium. Normative implication.
          *   *Concession:* Transparency is generally good.
          *   *Reply:* Too much info on failure modes creates self-fulfilling prophecies.
          *   *Soft Spot:* The normative stance (is ignorance *good*?).

      *   *Objection 6 (The "Prayer" Question):* Normative/Political. Abolish CBs? Or just trust?
          *   *Phrasing:* "Are you arguing for crypto/anarchy or just describing trust?"
          *   *Damage:* High (Derails the metaphysics into politics).
          *   *Concession:* Not making a policy claim.
          *   *Reply:* Descriptive claim about ontology, not normative claim about governance.
          *   *Soft Spot:* The implication that CBs *must* lie/obscure.

      *   *Objection 7 (Synthesis/General):* The "Weakest Point" flagged separately.
          *   *Issue:* The transition from "closure" to "collapse." If everyone is ignorant, how does the collapse start? Someone must know first.
          *   *Strategy:* Defend the "cascade" model.

  4.  **Refining and Ordering:**
      *   Order needs to flow logically. Usually: Conceptual (Phil Sci) $\rightarrow$ Economic Mechanism (Post-Keynes/Rationalist) $\rightarrow$ Historical (Historian) $\rightarrow$ Normative (Prayer).
      *   Let's adjust:
          1.  Phil Sci (Definition of Kind) - Warm up.
          2.  Post-Keynes (State Theory) - The heavy hitters.
          3.  Rationalist (Markets/Insiders) - The specific mechanism challenge.
          4.  Historian (70s/Bretton Woods) - The factual check.
          5.  General (Transparency/Policy) - The "so what?"
          6.  The "Prayer" Question (Normative/Abolition).
          7.  *Self-Flagged Weakest Point:* The onset of collapse (who breaks the closure first?).

  5.  **Drafting the Content (incorporating "moves"):**
      *   *Tone:* Professional, slightly defensive but confident.
      *   *Concessions:* Crucial for credibility. Don't fight on everything.
      *   *Replies:* Keep them under 2 mins spoken pace (~250-300 words).
      *   *Soft Spots:* Be honest about where the argument bleeds.

  6.  **Review against Constraints:**
      *   6-7 objections? Yes.
      *   Ordered? Yes.
