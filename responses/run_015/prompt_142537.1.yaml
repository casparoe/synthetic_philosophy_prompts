  **CITY OF EQUILIBRIA**
  **DEPARTMENT OF CIVIC MEMORY ALLOCATION**
  **Policy Directive 40-Ω: Statutory Cap on Commemorative Load**

  **1.0 General Provision and Cap Maintenance**
  Pursuant to the Civic Memory Act, the Municipality of Equilibria maintains a strict statutory cap of forty (40) active honorific slots at any given time. This limit ensures equitable distribution of public attention across historical epochs and prevents commemorative inflation. When a new nominee is approved for active commemoration, an existing honoree must be displaced to maintain the cap. This zero-sum approach guarantees that public space remains a curated resource rather than an accumulation of unchecked tribute. Please note: we are not dishonoring anyone, we are reclassifying.

  **2.0 Commemorative Load Units (CLUs)**
  Honor is quantified using Commemorative Load Units to account for varying levels of public engagement and cognitive intrusion. A bronze statue occupies two (2) CLUs, while a street name occupies five (5) CLUs due to the high frequency of verbal reproduction by residents, delivery services, and navigation systems. A park naming occupies three (3) CLUs. Applicants must budget their CLUs accordingly against the available surplus. Auditory imposition is weighted heavier than visual presence. Please note: we are not dishonoring anyone, we are reclassifying.

  **3.0 Slot Occupancy and Displacement Mechanics**
  A slot is considered occupied when a physical marker exists or a geographic feature bears the subject's name. When the cap is reached, the honoree with the lowest Civic Impact Score is selected for displacement. This score is derived from pedestrian traffic data, curriculum inclusion rates, and annual public polling. In the event of a tie, a blind lottery determines the displaced party. The displaced marker is removed within thirty days to avoid confusing the public regarding current civic values. Please note: we are not dishonoring anyone, we are reclassifying.

  **4.0 Generational Revision of Judgments**
  The Department acknowledges that moral frameworks shift across generations. Consequently, past honorees are not guaranteed permanent status if their civic utility declines relative to contemporary values. This mechanism allows the city to reflect current ethical standards without expanding physical infrastructure or denying future heroes their due recognition. Stagnation is viewed as a failure of municipal governance. Please note: we are not dishonoring anyone, we are reclassifying.

  **5.0 Documentary Reclassification and Archival Status**
  Displaced honorees are transferred to Documentary Status. This includes placement in the Municipal Archive, a digital biography on the city website, or a weather-resistant QR code placed at the original site location. While these forms preserve historical data, they do not constitute active honor as they require voluntary engagement to access. Maintenance costs for QR codes are billed to the nominee's estate. Please note: we are not dishonoring anyone, we are reclassifying.

  **6.0 Renomination Protocols and Cooling-Off Periods**
  A reclassified individual may be renominated for active status after a cooling-off period of fifty (50) years. Renomination requires a supermajority vote from the Council of Memory and payment of applicable processing fees. Previous displacement does not prejudice future eligibility, provided the nominee's CLU cost can be accommodated within the current cap. History is viewed as cyclical rather than linear. Please note: we are not dishonoring anyone, we are reclassifying.

  **7.0 Mandatory Verbal Compliance**
  Staff must append the phrase "we are not dishonoring anyone, we are reclassifying" to all public communications regarding displacement. This repetition is required to prevent emotional misinterpretation of administrative adjustments and to standardize the linguistic framework of memory management. Consistent verbal framing ensures the public understands the neutral nature of the process. Failure to recite the mantra during public hearings results in immediate disciplinary action. Please note: we are not dishonoring anyone, we are reclassifying.

  ***

  **What I was going for**

  This artifact exaggerates the "zero-sum" logic often implicit in debates about public space. If commemoration is honor, and honor is scarce, then new honor necessarily displaces old honor. I targeted the bureaucratic tendency to manage moral questions through metrics (CLUs) and the comforting distinction between "honoring" and "remembering." The repetition of the mantra satirizes the compulsive reassurance required when a policy inevitably hurts feelings. The exaggeration is fair because these ethical commitments, when operationalized by a municipality, demand exactly this kind of sterile consistency. If we truly treat statues as budget line items, we must accept the spreadsheet logic that follows.
