  To: Art Selection Panel
  From: [My Name]
  Re: Selection Procedure

  I recommend we adopt the proposed testing procedure as originally outlined to determine the weight of each panelist's vote before deciding on the artwork.

  **Schedule:** We authorize the process at our meeting in nine days. Private viewings occur in the atrium during Weeks 1 and 4. Rankings are submitted immediately after each session. The final weighted vote occurs eight weeks from today, on [Insert Date].

  **Reasoning:** We must spend $240,000 on "greatest artistic merit." Beauty is not in the object but in the mind, yet some perceptions are more reliable. Good judges show consistency, practice, and freedom from prejudice. Since we cannot ask who has the best taste without begging the question, we test reliability where nothing is at stake: our existing collection. If a member distinguishes the old works consistently, their judgment carries more weight. This isolates "delicacy" from "fashion." I prefer the steel piece, but I want to be shown if I am wrong; this process tests the judge, not just the art. It requires practice and comparison, not just instinct. It respects the donor's wish that merit not be settled by counting hands.

  **Objection:** The gallery owner argues this is a rigged instrument designed to validate the lay majority. She contends that agreement on the county's old sculptures proves only that we share local habits, not merit. On this view, my procedure entrenches the untrained majority by quietly halving the experts' votes under the guise of testing "consistency," violating Hume's warning that consensus within one time and place is no evidence of true taste. She argues that true delicacy recognizes innovation, which often disrupts consensus, meaning my test penalizes the expertise the donor intended us to use. She fears we will mistake shared ignorance for shared judgment.

  **Tie-Breaker:** If weighted rankings split 2.5 to 2.5, we will invite a curator from a neighboring county to cast the deciding vote based on our recorded rankings.

  **Conflict of Interest:** The member who is the artist's neighbor should vote. She disclosed the relationship; none of us believe it affects her judgment. Hume warns against prejudice, but disclosure neutralizes hidden bias. Disqualifying her without evidence of actual distortion punishes honesty and reduces our panel's diversity of perspective.

  This procedure treats the donor's mandate seriously. I look forward to discussing these objections openly in nine days.
