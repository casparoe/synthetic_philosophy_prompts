      *   *Pinpoint the culprit:* Step (2) is the error. It imports a metaphysical requirement that LE doesn't need.
      *   *Explain why (2) is too strong:* It requires "ultimate responsibility" (Nagel/Williams). LE only requires "reasonable avoidability" or "voluntariness" in a compatibilist sense.
      *   *Address the "Causal vs. Normative" equivocation:* Yes, the argument equivocates. Just because a preference has a causal history doesn't mean the agent didn't *own* it in the relevant normative sense.
      *   *Discuss the Cost:* Rejecting (2) means accepting compatibilism. It means responsibility is about the *structure* of the choice (informed, uncoerced, reflective), not the *genealogy* of the preference.
