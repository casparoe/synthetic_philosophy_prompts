  1. **The Category-Error Blocker**
     **Question:** Before we discuss the wasp, isn't there a category error in comparing a mechanical control loop to normative agency? A thermostat corrects error, but we don't call it free; why assume adding loops bridges the gap from "is" to "ought"?
     **Likely Answer:** "It's not a category error but a continuum of complexity. Normativity emerges from sophisticated control structures managing competing drives."
     **Follow-up:** "If normativity merely emerges from complexity, isn't 'ought' just a word we use for 'high-priority causal imperative'? Where does the binding force of a reason enter the mechanism?"

  2. **The Regress Worry**
     **Question:** You define freedom as nested loops avoiding Sphex traps. But doesn't each fallback layer need its own frame-setting? If the top loop's goals are set by genetics or environment, haven't you just moved Sphexishness up a level rather than solving it?
     **Likely Answer:** "The top loop is free because it can revise goals based on reflection and new information, unlike the wasp."
     **Follow-up:** "But if the capacity for reflection is itself causally determined by prior states, isn't that revision just a longer deterministic loop? Where does the 'anti-Sphex' agency enter the chain if every setting is externally caused?"

  3. **Reasons vs. Error-Correctors**
     **Question:** What does responsiveness to reasons add that a stack of error-correctors doesn't already have? A missile adjusts its path to hit a target; is it responding to reasons?
     **Likely Answer:** "Humans respond to normative reasons, not just causal targets. We recognize the rightness of a move, not just its efficacy."
     **Follow-up:** "If that recognition is physically realized, isn't it just a complex causal adjustment? If it's not physical, how does it interact with the brain without violating physics?"

  4. **The Sorites of Freedom**
     **Question:** If there's no sharp cutoff, is there a series from wasp to me? If so, what makes it wrong to say the wasp is free at every point on it?
     **Likely Answer:** "The wasp has minimal freedom, humans have maximal. It's wrong to say it's fully free because its loop depth is shallow."
     **Follow-up:** "If freedom is degrees, is moral responsibility also degrees? Should we punish a human with 'shallow loops' less than one with 'deep loops,' and how do we measure loop depth in court?"

  5. **The External Rigging**
     **Question:** If a system is rigged from the outside by a neuroscientist to be maximally flexible—perfectly avoiding all Sphex traps—does it count as free on your account?
     **Likely Answer:** "No, because the history of the formation matters. The control must originate from the agent's own developmental history."
     **Follow-up:** "If two agents are internally identical, one rigged and one natural, why does the invisible history change their current freedom status? Is freedom a property of the structure or a property of the biography?"

  6. **The Empirical Settlement**
     **Question:** What observation would settle whether a given system is free or Sphexish on your view? Is there a test?
     **Likely Answer:** "We look for the ability to override an impulse upon reflection when presented with a defeater."
     **Follow-up:** "Isn't that override just another deterministic loop triggered by the 'defeater' input? What would you see differently in a free agent versus a sophisticated puppet?"

  7. **The Panic Dismissal**
     **Question:** You say there's no room for the usual free-will panic. But if determinism is true, isn't the panic about the loss of alternative possibilities rational, not emotional?
     **Likely Answer:** "The panic relies on an incoherent concept of libertarian freedom. Once you understand anti-Sphexishness, the panic dissolves."
     **Follow-up:** "Or does the panic persist because anti-Sphexishness doesn't give us what we actually want, which is the ability to have done otherwise in the exact same causal situation?"

  8. **Pathology and Compulsion**
     **Question:** How does your model distinguish addiction from strong desire? Both look like a top-loop priority setting.
     **Likely Answer:** "Addiction bypasses the reflective loops; the agent cannot revise the goal even when they recognize reasons to stop."
     **Follow-up:** "If the inability to revise is caused by brain chemistry, and normal revision is also caused by brain chemistry, what distinguishes the 'bypass' from the 'normal path' other than social disapproval?"

  9. **Evolutionary Teleology**
     **Question:** Is freedom on your view just an adaptive illusion? Did we evolve nested loops to survive, not to be free?
     **Likely Answer:** "We evolved loops to be flexible. That flexibility just is freedom. It's not an illusion; it's a functional capacity."
     **Follow-up:** "If evolution selected for flexibility, not truth, why trust that your philosophical account of freedom tracks reality rather than just being another adaptive survival heuristic?"

  10. **The Moral Luck Problem**
      **Question:** If freedom depends on loop complexity, and complexity depends on genetics and upbringing, isn't freedom just a matter of moral luck?
      **Likely Answer:** "Yes, freedom is unequal. But it's real where it exists."
      **Follow-up:** "If my freedom is a gift of luck and yours isn't, on what basis do I hold you responsible for failures I was lucky enough to avoid? Doesn't this undermine the justification for blame?"

