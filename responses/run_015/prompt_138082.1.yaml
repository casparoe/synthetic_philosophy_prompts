prompt: |-
  hey, I need a bit of writing for my group chat and I want it to be funny specifically to the two LW-adjacent guys in there who won't shut up about Arrow's theorem, but still readable to everyone else.

  Write a ~750 word mock consulting deliverable: "The Will of the People™: Q3 Measurement Report." Invent the firm (something like Bracknell & Volk Partners) and the client ("a coalition of stakeholders who asked not to be named"). Deadpan corporate-consultant voice the whole way through, no winking, no punchline that admits it's a joke. Sections: Executive Summary, Methodology, Findings, a dashboard/KPI block, and an appendix on data limitations.

  The jokes have to come out of the real conceptual problems, not invented silliness:

  - cycling majorities (51% prefer A to B, B to C, C to A) reported as "preference volatility" or a margin-of-error artefact, with the index still quoted to one decimal place, and last quarter's number "restated"
  - the boundary problem — who's even in the sample: non-citizens, minors, the dead, future people — handled as a scope assumption in a footnote
  - intensity vs headcount: a small number of people who care enormously netted against a large apathetic majority to yield one number
  - discovered vs constituted: whether the instrument is measuring a will that exists before the procedure or manufacturing one. I want the report to treat this as an accounting question, something like revenue recognition or when to book the asset
  - my favorite bit: the will of the people as a residual. Whatever the institutions fail to deliver gets coded as "unmet will," so the index mechanically rises whenever government performs badly for any reason at all

  Give each of those its own named KPI. Include one fake pull-quote from a senior partner and one from a focus group participant.

  Two hard constraints: the absurdity lives in the measurement apparatus, never in the voters — no jokes at the expense of ordinary people being dumb — and it shouldn't collapse into "populism is just fascism." By the end the reader should have felt the actual problem: that there may be no fact of the matter about what the people will, that this isn't merely because voters are uninformed, and that a movement insisting there obviously is one is onto something real even if its metaphysics is confused. If you catch yourself mocking a real named politician, cut it.
