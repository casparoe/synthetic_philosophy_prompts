answer: |-
  **Project Title:** Ghost Rules: When Manners Feel Like Morals
  **Applicant:** [Your Name]
  **Duration:** 3 Months
  **Request:** Stipend for living expenses + research costs

  **The Pitch**
  You know that specific panic when you're traveling and you realize you've just done something that isn't illegal, but the locals look at you like you're a monster? In New York, it's not tipping. In London, it's breaking a queue. In Berlin, it's jaywalking on a red light.

  I'm calling these "Ghost Rules." They aren't laws, and they aren't deep ethical truths like "don't hurt people." But break them, and you get a social stain. You're treated as morally broken, even if you're just a confused visitor who didn't receive the local signal.

  **The Core Question**
  Do Ghost Rules create actual obligations for outsiders, or is the anger people feel just tribal defensiveness wearing a moral mask? Basically: Do you *owe* it to strangers to follow their unwritten scripts, or is their outrage just a way of policing boundaries?

  **Why the Standard Answers Don't Work**
  Usually, people shrug and say one of two things, but neither holds up:
  1.  **"When in Rome..."** This fails because it assumes you know what Rome wants. It ignores the power imbalance between locals (who know the code) and visitors (who don't). It also treats all customs as equally serious, equating tipping with something actually harmful.
  2.  **"Morals Don't Have Borders"** This fails because it ignores reality. If you break a local convention, you *do* cause friction. You might ruin someone's day or disrupt a system that relies on everyone cooperating. Dismissing it as "not real morality" ignores the actual social cost.

  **The Plan (3 Months)**
  I'm not writing a textbook. I'm testing a hypothesis using regular reasoning.
  *   **Month 1: The Case Studies.** I'll deep-dive into the three examples (US tipping, UK queueing, DE jaywalking). I want to map out exactly *what* people feel when the rule is broken. Is it anger? Embarrassment? Inconvenience?
  *   **Month 2: Finding the Line.** I'll compare the cases to see where the shift happens. When does a habit turn into an obligation? Is it about harm? Is it about respect? Is it about coordination? I'm looking for the mechanism that makes a "ghost rule" feel binding.
  *   **Month 3: The Framework.** I'll draft a short, accessible guide—a "Field Guide to Ghost Rules." It won't tell people what to do, but it will offer a test for when a custom demands compliance versus when it's okay to ignore it.

  **Success vs. Failure**
  *   **Success:** I produce a clear framework that helps people distinguish between "local quirks" and "social obligations." If I can give people a way to navigate these moments without feeling guilty or entitled, that's a win.
  *   **Failure:** If I end up proving that it's all just arbitrary vibes with no pattern, that's still useful knowledge, but the project fails if I can't articulate *why* it feels arbitrary. The real failure is producing something too academic to be useful to regular people.

  **Reality Check on Scope**
  Three months is tiny. I'm not solving the philosophy of obligation. I'm not interviewing hundreds of people or learning German law. I'm relying on observation, conversation, and logic. The goal isn't The Truth; it's a useful lens. If I get bogged down trying to define "morality" broadly, I'll miss the deadline. I have to stay focused on the specific friction of the *visitor* experience.

  This is a small stipend for a small question, but it's one that trips up almost everyone eventually. I want to clear the air.
