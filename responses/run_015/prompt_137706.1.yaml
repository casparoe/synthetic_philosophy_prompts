answer: |-
  **The Incomplete Contract of the People**

  **By [Your Name]**

  We tend to speak of referendum results as if they were instructions delivered from a superior to a subordinate. The people speak; the government obeys. Yet, when the dust settles on a major vote, the fighting rarely stops. It merely changes venue. The legislation is drafted, the treaties negotiated, the regulations written, and at every turn, the same question resurfaces: is this what they actually meant?

  There is a more useful way to think about this. A referendum result is not an instruction. It is an **incomplete contract**.

  In contract theory, an incomplete contract is one that specifies the headline terms but leaves contingencies unspecified because they are too costly or impossible to foresee at the time of signing. When an unforeseen event occurs, the contract does not say what to do. Instead, authority rests on *residual control rights*: who has the power to decide what happens in the gaps?

  Applied to constitutional politics, this frame shifts the question from "what did the people say?" to "who holds the residual rights to interpret what the people said?" It forces us to track how the mandate is managed over time. To do this, we must distinguish between two types of implementation. **Mandate-consuming** implementation spends the authority in a one-shot change to the law; once done, the vote is settled. **Mandate-preserving** implementation requires the result to be re-derived at every subsequent decision, meaning each step quietly reopens the very question the vote was supposed to have settled.

  We must also apply the **counterfactual-stability test**. Take the outcome people actually ended up with. Ask whether the winning coalition, had they been shown that specific outcome in advance, would still have voted the same way. If the answer is no, the implementation was formally faithful but substantively a breach.

  Let us test this machinery against the heaviest case file in recent British history: Brexit.

  ### The Brexit Contract (2016–2020)

  The 2016 referendum was a textbook incomplete contract. The ballot question asked whether the UK should remain in or leave the European Union. It specified nothing about the customs union, the single market, the Northern Ireland border, or the status of EU citizens. These were not oversights; they were the contingencies left for the agents to negotiate later.

  Who were the parties? The principals were the Leave coalition—a heterogeneous group ranging from free-market neoliberals to protectionist social conservatives. The agents were the Government, Parliament, and the Civil Service.

  Where did the residual control rights sit? Initially, the Government claimed them via prerogative power. This was challenged in *Miller I* (2017), where the Supreme Court ruled that Parliament held the residual rights because leaving the EU would alter domestic statutory rights. This was a crucial allocation of control. It meant the mandate could not be executed by ministerial fiat; it required legislative gap-filling.

  This triggered a period of intense **mandate-preserving** implementation. Unlike a mandate-consuming vote (such as the 2011 AV referendum, where a 'yes' would have simply changed the voting system and ended the matter), Brexit required constant re-derivation of authority. Every stage—the triggering of Article 50, the Great Repeal Bill, the Withdrawal Agreement—required the Government to return to the well of "the will of the people" to justify specific choices that the ballot paper did not specify.

  Theresa May's Chequers Plan, for instance, was an attempt to fill the contractual gaps with a specific interpretation (close alignment on goods, divergence on services). It failed the counterfactual-stability test for the ERG and DUP, who viewed it as remaining in the EU in all but name. Boris Johnson's subsequent deal passed Parliament, but did it pass the test?

  Apply the counterfactual honestly. The Leave coalition in 2016 included millions who voted for a clean break, an end to ECJ jurisdiction, and no regulatory alignment. The final Withdrawal Agreement included a £39 billion settlement, continued ECJ jurisdiction in Northern Ireland, and a level playing field. Would the median Leave voter, or the median Leave MP, have voted 'Leave' in 2016 if shown the 2020 Trade and Cooperation Agreement as the guaranteed outcome?

  It is highly probable they would not have. The ERG tolerated the deal only because the alternative was no Brexit at all. This suggests the implementation was unstable. The residual rights had shifted to the Prime Minister following the 2019 election, which functioned as a ratification vote on his specific interpretation of the contract. The 2019 election did not settle the meaning of 2016; it replaced one set of agents with another who claimed a better understanding of the principal's intent.

  **Is this just wanky relabelling?**
  Critics might say this is merely a fancy way of saying "the mandate was ambiguous." It is not. The "ambiguity" critique focuses on the input (the question was binary). The "incomplete contract" frame explains the *governance* failure that followed. It explains why the conflict moved from the ballot box to the Supreme Court, then to Parliament, then to the electorate again. It predicts that where residual rights are contested (Government vs Parliament), implementation will stall. It explains why the 2017 election, intended to consolidate the Government's control rights, actually fragmented them further, leading to paralysis. The ambiguity critique describes the fog; the contract frame maps the struggle over who holds the torch.

  ### The Swiss Contrast: A More Complete Contract?

  Consider the Swiss federal popular initiative "Against Mass Immigration", passed on 9 February 2014. By a margin of 50.3 per cent to 49.7 per cent, voters added Article 121a to the Federal Constitution, requiring quotas on residence permits.

  On the face of it, this was a more *complete* contract. It was not a binary 'in/out' question but binding constitutional text specifying a mechanism (quotas). Surely, this reduces the residual-rights problem?

  In practice, it merely relocated it. The Federal Assembly (Parliament) held the residual rights to implement the article, but they faced a conflicting contractual obligation: the bilateral agreements with the EU on free movement. You cannot have hard quotas and free movement.

  The Swiss Parliament chose to implement the initiative via the "Inländervorrang" (priority for domestic workers) rather than hard quotas. This was a gap-filling exercise that prioritised the international treaty over the literal text of the initiative to avoid detonating the broader relationship.

  Did the completeness of the text help? It constrained the agents slightly more than in the UK, but it created a conflict of contracts. The residual rights were not about interpreting vagueness, but about adjudicating between contradictory binding commitments. The result was a delay of several years and a subsequent threat of another initiative when voters felt the implementation was too soft.

  Here, we must be honest about the limits of the comparison. The Swiss system allows for serial initiatives; the UK system is generally one-off. In Switzerland, the "contract" is never truly closed; if the agents (Parliament) fill the gaps in a way the principals (voters) dislike, a new initiative can be launched to correct the interpretation. This makes the Swiss system more responsive but less stable. The completeness of the 2014 text did not solve the residual-rights problem; it shifted the venue from "what does this mean?" to "which contract takes precedence?".

  ### Predictive Power and the Vox Populi Objection

  Is this framework merely a vocabulary for post-mortems, or does it have predictive teeth?

  Consider the question of a second referendum. In contract law, if the parties cannot agree on the interpretation of terms, they may seek renegotiation or termination. On this view, a second referendum is not a betrayal of democracy; it is an admission that the initial contract was too incomplete to be executed without breach. It is a mechanism to terminate the agreement before further value is destroyed. Conversely, if the implementation is mandate-consuming (like AV), a second vote is unnecessary. If it is mandate-preserving (like Brexit), a second vote becomes a likely pressure valve when the counterfactual-stability test fails too visibly.

  However, there is a fundamental objection to this entire frame. It comes from the *vox populi* tradition, the view that a referendum is not a contract at all. It is an exercise of constituent power. The people are the sovereign; they do not sign contracts with their agents; they issue commands. To speak of "interpretation" or "residual rights" is to misunderstand the hierarchy. The instruction does not have to be interpreted; it must be obeyed. If the agents cannot obey it, they must be replaced, not empowered to negotiate.

  This is the strongest objection, and my frame cannot fully answer it. It assumes a liberal constitutionalist order where power is mediated through institutions and law. The *vox populi* argument is Schmittian: it posits a direct line of authority that brooks no intermediaries.

  Yet, even the hardline instruction view collides with reality. An instruction without implementation details requires an agent to carry it out. That agent *must* exercise discretion. When the instruction is "Leave the EU," and there are forty different ways to leave, the agent *will* choose one. At that moment, the instruction becomes a contract, whether we admit it or not. The *vox populi* theorist claims the agent has no discretion. The contract theorist knows they do.

  The value of the incomplete contract frame is that it forces us to stop pretending the vote settled the matter. It compels us to ask: who decides the bits the vote didn't cover? And if the outcome looks nothing like what the voters were promised, at what point do we admit the contract has been breached?

  In the end, referendums are not magic wands. They are drafting exercises. And like any poorly drafted contract, the cost is not paid at the signing. It is paid in the litigation that follows.
