answer: |-
  **Game:** "The Reference Loop."
  **Setup:** Circle. Each player holds 2 Solid tokens (labeled with peers' names) and 1 Ghost token (blank).
  **Rules:** To speak, spend a token. Solid: Point to the named peer; they must say "You exist" to award you a point. Ghost: Point to empty space; valid only if the group nods unanimously. Crucially, you cannot use "I" or your own name.
  **Payoff:** Most points wins "The Ego" (a hand mirror).
  **The Trap:** The paradox: You need a name to speak, but names are held by others. Existence becomes a negotiated status. Ghost tokens (your friend's twist) allow speech without anchor, mimicking internal monologue ungrounded in reality.

  **Debrief:** Map tokens to neural symbols. Ghosts are symbols without external referents (qualia). The "I" is the tangled hierarchy of mutual reference. Show how the "speaker" is just the current locus of token exchange.

  **Troubleshooting:** *Failure:* Students treat Ghosts as free passes. *Fix:* Require Ghost plays to be ratified by two neighbors. *Failure:* Cliques form. *Fix:* Rotate seats mid-game.

  **Limitations:** The game cannot reproduce the *unity* of experience. You must verbally explain that the feeling of being one person is the loop's output, not an input. The game shows structure, not sensation.

  **Falsification:** If students report feeling like distinct observers manipulating tokens rather than components *constituted* by the exchange, this fails to capture Hofstadter. It would prove symbol manipulation isn't sufficient for selfhood.

  **Weakest Reasoning:** I assume reciprocal reference creates identity. It might only create social validation. Hofstadter claims ontological emergence; this game only shows functional dependency.
