answer: |-
  # The Political Continuity Protocol (PCP)
  **Version 1.0 | For Internal Use Only**

  ## 1. Purpose and Scope
  This procedure governs the assignment of thirty-year political continuity probabilities ($P_{30}$) for sovereign and infrastructure exposures. It replaces narrative forecasting with a reference-class anchoring method constrained by adjustment caps. It applies to all exposures requiring a political risk premium.

  ## 2. Procedure Steps

  ### Step 1: Outcome Definition (Timebox: 15 mins)
  **Objective:** Fix the definition of "Failure" before viewing data.
  1.  **Apply the Successor-Continuity Convention (SCC):** A polity persists to $T_{30}$ if and only if:
      *   (a) Effective control over $\ge 50\%$ of $T_0$ territory.
      *   (b) Recognition by $\ge 33\%$ of $T_0$ recognizing states.
      *   (c) Operation of $\ge 1$ institution founded pre-$T_0$.
  2.  **SCC Fiat Declaration:** The analyst must record which of the following are settled by SCC fiat, not evidence:
      *   *Territorial Loss:* Loss of $>50\%$ territory is a terminal event, regardless of debt service intent.
      *   *Government in Exile:* Counts only if condition (a) is met via claimed territorial control (e.g., occupied but not annexed); mere diplomatic recognition without territory is a terminal event.
      *   *Constitutional Refounding:* Counts as continuity if condition (c) is met.
  3.  **Coder Disagreement Resolution:** If the two archive coders disagree on a historical end-year:
      *   *Rule:* Adopt the earlier end-year (conservative bias).
      *   *Exception:* If the disagreement stems solely from condition (b) (recognition counts), adopt the arithmetic mean of the two recognition counts.
      *   *Default:* If raw coding sheets are missing, default to the archive's published "Consensus End-Year."

  ### Step 2: Reference Class Nomination (Timebox: 30 mins)
  **Objective:** Select the anchor distribution without cherry-picking.
  1.  **Nominate Three Classes:** The analyst must identify base rates from the archive for:
      *   *Class A (Global):* All polities in the archive ($N \approx 200$).
      *   *Class B (Structural):* Polities sharing the primary regime structure (e.g., Federal, Unitary, Supranational).
      *   *Class C (Contextual):* Polities sharing region and income level at $T_0$.
  2.  **Adjudication Rule:**
      *   Select the class with the largest $N$ provided $N \ge 20$.
      *   If multiple classes have $N \ge 20$, select the most specific (Order: C > B > A).
      *   If no class has $N \ge 20$, select Class A and trigger **Step 7 (Stopping Rule)**.
  3.  **Rejection Log:** Record the $N$ and Base Rate ($BR$) for the two unselected classes in the audit trail.
  4.  **Conflict Rule:** If Class B and C yield base rates differing by $>20$ percentage points, default to Class A (Global) and proceed to Step 6 (Adjustment Cap).

  ### Step 3: Archive Bias Adjustment (Timebox: 10 mins)
  **Objective:** Correct for the "Record-Keeper Bias."
  1.  **The Bias:** The archive contains only polities that left dated records, correlating with durability.
  2.  **The Correction:** Apply a fixed **Fragility Discount** to the selected Base Rate.
      *   *Formula:* $BR_{adj} = BR \times 0.90$.
      *   *Rationale:* Assumes a 10% overstatement of survival in the historical record due to the invisibility of stateless or non-literate failures.
      *   *Default:* This discount is mandatory. No evidence is required to waive it.

  ### Step 4: Duration Already Survived (Timebox: 15 mins)
  **Objective:** Determine if past survival predicts future survival.
  1.  **The Test:** The Lead Analyst must annually calculate the hazard rate of the archive.
      *   *If Hazard Rate is Flat:* Survival is memoryless. No adjustment for age.
      *   *If Hazard Rate Declines:* Survival indicates durability. Add $+1\%$ to $P_{30}$ for every 10 years survived past the "Infant Mortality Threshold" (set at 20 years).
      *   *Current Standing:* Until the annual test is conclusive, **default to Memoryless** (No adjustment for age).
  2.  **Application:** For this case, note the polity's current age. Apply adjustment only if the annual test permits.

  ### Step 5: Specific Adjustment (Timebox: 30 mins)
  **Objective:** Incorporate case-specific inside-view information.
  1.  **The Cap:** The final probability ($P_{final}$) cannot deviate from $BR_{adj}$ by more than **15 percentage points**.
      *   $BR_{adj} - 0.15 \le P_{final} \le BR_{adj} + 0.15$.
  2.  **Authorization:**
      *   Adjustments $\le 10$ points: Senior Analyst approval.
      *   Adjustments $> 10$ points: Director approval.
      *   Adjustments exceeding the 15-point Cap: **Prohibited** unless Step 7 is invoked.
  3.  **Documentation:** Any adjustment $>5$ points requires a written link between a specific risk factor (e.g., "succession crisis") and a percentage value, citing a comparable historical instance from the archive.

  ### Step 6: Value Handoffs (Timebox: 5 mins)
  **Objective:** Identify questions of definition, not fact.
  1.  **Mandatory Escalation:** The analyst must flag the case to the **Chief Risk Officer (CRO)** if the assessment depends on:
      *   Whether debt service by a government-in-exile without territory constitutes "continuity" (contradicts SCC Fiat).
      *   Whether a supranational entity counts as a "polity" (archive ambiguity).
      *   Whether the guarantee itself creates a reflexive failure risk (Self-Fulfilling Prophecy).
  2.  **CRO Decision:** The CRO's ruling on these values is recorded as a "Parameter Override" and is not subject to analyst adjustment.

  ### Step 7: Stopping Rules (Timebox: 15 mins)
  **Objective:** Acknowledge when a number is indefensible.
  1.  **Conditions for "No Defensible Number" (NDN):**
      *   Selected Reference Class $N < 20$.
      *   Case involves a Supranational Union with $<5$ analogues in archive.
      *   CRO flags a Reflexivity Risk (Step 6).
  2.  **Model Input for NDN:**
      *   Do not input a probability.
      *   Input a **Risk Load Multiplier** of 1.5x the standard sovereign premium for that region.
      *   Tag the exposure as "Unquantifiable Political Risk" in the portfolio report.

  ---

  ## 3. Output Template (One Page)

  | **Case ID:** | **Analyst:** | **Date:** |
  | :--- | :--- | :--- |
  | **Entity:** | **Current Age:** | **SCC Status:** [ ] Pass [ ] Fail [ ] Ambiguous |
  | **1. Outcome:** | Definition of Failure: _________________________________________________ |
  | **2. Class:** | Selected: _______ ($N=$___, $BR=$___). Rejected: A ($N=$___), B ($N=$___). |
  | **3. Bias:** | $BR_{adj}$ ($BR \times 0.9$): _______ |
  | **4. Duration:** | Hazard Rule Applied? [Y/N]. Adjustment: _______ |
  | **5. Adj:** | Specific Factor: ___________________. Magnitude: _______. |
  | **6. Cap Check:** | $P_{final}$ within $\pm 15\%$ of $BR_{adj}$? [Y/N]. Director Sign-off if $>10\%$: ____ |
  | **7. Stop:** | NDN Triggered? [Y/N]. If Y, Risk Load: 1.5x. |
  | **8. Values:** | CRO Escalation Required? [Y/N]. Topic: ___________________. |
  | **FINAL $P_{30}$:** | **________ %** (Or "Risk Load 1.5x") |

  ---

  ## 4. Case Runs (Audit Trails)

  ### Case 1: The Federal Union (Secession Risk)
  **Context:** Large federal democracy. One wealthy region polling 60% for secession. Debt is federal.
  **Time Start:** 09:00 | **Time End:** 10:55

  *   **Step 1 (Outcome):** Failure = Federal government loses control of >50% territory OR loses recognition. *SCC Fiat:* If region leaves, rump state retains capital and 80% territory. Continuity holds.
  *   **Step 2 (Class):**
      *   A (Global): $N=200$, $BR_{30}=0.65$.
      *   B (Federal): $N=25$, $BR_{30}=0.70$.
      *   C (High-Income Dem): $N=30$, $BR_{30}=0.85$.
      *   *Selection:* Class C (Most specific, $N>20$).
  *   **Step 3 (Bias):** $0.85 \times 0.90 = 0.765$.
  *   **Step 4 (Duration):** Age 150 years. Hazard rule currently "Memoryless." Adjustment = 0.
  *   **Step 5 (Adjustment):** Risk: Civil conflict during secession. Archive analogue: Canada 1995 (no split), Yugoslavia 1990 (split + war).
      *   *Adjustment:* -0.10 (Peaceful secession risks institutional paralysis).
      *   *Calculation:* $0.765 - 0.10 = 0.665$.
      *   *Cap Check:* Within 15% band ($0.615 - 0.915$). Yes.
  *   **Step 6 (Values):** No escalation. Debt service likely, SCC met.
  *   **Step 7 (Stop):** No.
  *   **Final $P_{30}$:** **67%**

  ### Case 2: The Island State (Climate/Exile)
  **Context:** Low-lying island. 60% territory projected uninhabitable by $T_{30}$. Govt plans exile in Australia, vows to pay debt.
  **Time Start:** 11:00 | **Time End:** 12:50

  *   **Step 1 (Outcome):** Failure = Loss of >50% territory. *SCC Fiat:* Territory loss is terminal regardless of intent.
      *   *Assessment:* 60% loss > 50% threshold. **SCC Status: Fail.**
  *   **Step 2 (Class):**
      *   A (Global): $N=200$, $BR_{30}=0.65$.
      *   B (Island): $N=15$ (Too small).
      *   C (Pacific): $N=12$ (Too small).
      *   *Selection:* Class A (Global).
  *   **Step 3 (Bias):** $0.65 \times 0.90 = 0.585$.
  *   **Step 4 (Duration):** Age 40 years. Memoryless default. Adjustment = 0.
  *   **Step 5 (Adjustment):**
      *   *Analyst View:* They will pay. Should be high probability.
      *   *Protocol Constraint:* SCC defines continuity, not creditworthiness.
      *   *Adjustment:* 0. (Cannot adjust for debt service intent if polity definition fails).
  *   **Step 6 (Values):** **ESCALATION REQUIRED.**
      *   *Issue:* Does debt service by a government-in-exile without territory constitute "continuity" for pricing purposes?
      *   *CRO Ruling:* "No. We insure political continuity. If the SCC is not met, the guarantee triggers as a political event. Probability of *continuity* is low. Probability of *payment* is irrelevant to this specific variable."
  *   **Step 7 (Stop):** No.
  *   **Final $P_{30}$:** **58%** (Uncongenial Result)

  **Argument for Acceptance:**
  Your desk wants to price this based on the likelihood of debt service (which is high). This procedure prices the likelihood of *Political Continuity* (which is low per SCC). If you override this to 90% based on payment intent, you are mislabeling Credit Risk as Political Risk. If the island dissolves, our guarantee may be called even if they pay from exile, depending on the legal wording of "Sovereign Default" vs "Political Dissolution." By booking 58%, we correctly price the risk that the *counterparty* ceases to exist, forcing a legal restructuring of the guarantee. If the model requires a payment probability, that is a separate input, not this one. Do not conflate the two.

  ### Case 3: The Supranational Union
  **Context:** A union of 5 sovereign states, pooled sovereignty. $N$ in archive for "Supranational" = 3 (Holy Roman Empire, etc.).
  **Time Start:** 14:00 | **Time End:** 14:45

  *   **Step 1 (Outcome):** SCC applicable? Yes, but "Territory" is ambiguous (sum of members?).
  *   **Step 2 (Class):**
      *   A (Global): $N=200$.
      *   B (Supranational): $N=3$.
      *   C (European): $N=18$ (Too small).
      *   *Selection:* Class B is $<20$. Class C is $<20$. Must default to Class A.
      *   *Conflict:* Class A is causally irrelevant.
  *   **Step 3 (Bias):** $0.65 \times 0.90 = 0.585$.
  *   **Step 4 (Duration):** N/A.
  *   **Step 5 (Adjustment):** N/A.
  *   **Step 6 (Values):** **ESCALATION REQUIRED.**
      *   *Issue:* Archive contains no valid analogues for modern supranational entities.
  *   **Step 7 (Stop):** **TRIGGERED.**
      *   *Reason:* Selected Reference Class ($N=3$) is below minimum threshold ($N=20$). Class A is adjudicated as causally invalid for this structure.
  *   **Final $P_{30}$:** **Risk Load 1.5x** (No probability assigned).

  ---

  ## 5. Limitations of This Procedure

  1.  **It Does Not Predict Black Swans:** The archive bias correction (10%) is a heuristic, not a statistical fix for unknown unknowns. It assumes the future resembles the past, merely under-recorded.
  2.  **It Separates Continuity from Solvency:** As seen in Case 2, this procedure will produce "low" continuity numbers for entities that intend to pay. It forces a distinction between "The State exists" and "The State pays." If your pricing model cannot handle two separate inputs, this procedure will create friction.
  3.  **It Penalizes Innovation:** Unique political structures (Supranational Unions) will default to "Risk Load" or "Global Average," likely mispricing them. This is a feature, not a bug: it prevents false precision on unknowable structures.
  4.  **It Is Conservative:** The Fragility Discount and the "Earlier End-Year" rule for coder disagreement systematically lower probabilities. This protects the agency from underpricing but may reduce competitiveness on safe-looking deals.
  5.  **It Cannot Solve Reflexivity:** Step 7 flags self-fulfilling prophecies, but it does not solve them. It merely instructs you to charge more (1.5x load). If the load itself causes the default, the procedure has accurately identified the risk but cannot mitigate the market dynamic.
