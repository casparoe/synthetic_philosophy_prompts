      *   *Refining Step 4 (Bias):* We can't fix the bias without external data. We must disclose it. The procedure should mandate a "Conservative Bias Adjustment" (e.g., reduce survival probability by 5% to account for the 'survivor bias' of the archive).
      *   *Refining Step 5 (Duration):* Check the archive. If the prompt says "tell me what the choice depends on," I should instruct the analyst to run a quick hazard check on the 200 cases. If inconclusive, default to Memoryless (conservative).
      *   *Refining Step 6 (Adjustment):* The "30 percentage points apart" problem needs fixing. A +/- 10% or 15% band is standard in risk modeling to prevent anchoring bias while allowing expertise.
      *   *Refining Step 8 (Values):* Explicitly list the CRO.

