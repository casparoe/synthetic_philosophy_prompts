          3.  Reference class nomination/adjudication (count, rejection log, conflicts, relevance vs. size).
          4.  Archive selection bias handling.
          5.  Duration already survived rule (memoryless vs. durable).
          6.  Adjustment rule (cap, authorization, documentation).
          7.  Stopping rules (when no number is defensible, model input).
          8.  Value judgment handoffs (named persons).
          9.  Handle specific live cases (secession, island state/exile, supranational, self-fulfilling prophecy).
          10. Run procedure on 3 cases (with audit trail, including one uncongenial result).
          11. State limitations.

  2.  **Develop the Procedure (The "Political Continuity Protocol" - PCP):**

      *   *Goal:* Rigor without impossible data demands. Focus on process integrity over false precision.
      *   *Step 1: Outcome Definition.* Must define "Failure" before looking at stats. The Successor-Continuity Convention (SCC) is key here. Need to resolve the 0.7 inter-rater reliability issue. *Solution:* Majority rule + Senior Analyst tie-break, documented. Define what SCC settles (legal continuity vs. functional capacity).
      *   *Step 2: Reference Class Selection.* Avoid the Goldilocks trap. *Solution:* Require three classes: Broad (all polities), Medium (regime type/region), Narrow (specific structural feature). Adjudication rule: Use the Medium unless Narrow has >10 cases and Broad is >2 SD away.
      *   *Step 3: Bias Correction.* The archive is biased towards record-keepers (durable states). *Solution:* Apply a "Fragility Discount" to the base rate derived from the archive. Since we can't quantify it perfectly, use a fixed conservative adjustment or acknowledge it in the uncertainty range. Let's make it a fixed downward adjustment factor based on the "record-keeping" proxy.
      *   *Step 4: Duration/Survival.* Memoryless vs. Aging. *Solution:* Test the archive. If hazard rate is flat, use memoryless. If it decreases (survival implies stability), adjust. Given the prompt asks me to decide what to do *in the meantime*, I need a rule. Political entities usually have "infant mortality" then stabilize. Let's assume a "Stabilization Threshold" (e.g., 20 years). If passed, slight boost. If not, penalty.
      *   *Step 5: Adjustment Cap.* Prevent inside-view hijacking. *Solution:* Hard cap (e.g., +/- 15% from base rate). Exceeding requires Director sign-off + written justification linking specific evidence to probability mass.
      *   *Step 6: Stopping Rules.* When is it unknowable? *Solution:* If reference class size < 5 or if specific case features (like self-fulfilling prophecy) dominate. Model input: Use a "Risk Load" instead of a probability, or a wide range converted to a conservative point estimate.
      *   *Step 7: Value Handoffs.* Who decides what "counts" as continuity? *Solution:* The Chief Risk Officer (CRO) or Board Committee. Analysts flag these.

  3.  **Address Specific Live Cases within the Procedure:**

      *   *Secession:* Does the original entity persist? SCC says 50% territory. If the rump state keeps capital + institutions, it persists.
