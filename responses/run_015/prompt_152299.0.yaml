prompt: |-
  I'm a 4th-year PhD student, mostly formal epistemology with a bit of phil physics, and I've got something like two years of dissertation time left plus (fingers crossed) a first postdoc. I want to spend them on the problem of old evidence rather than on something safer, but I can't figure out which part of it is actually worth the years. The set-up I assume we agree on: you already know E, so P(E) = 1, so conditioning on E can't bump P(T) — and yet the perihelion of Mercury sure looked like it confirmed general relativity. Whatever the fix is, it has to be reachable by someone with probability theory, a bit of modal logic, and no real physics.

  Here's my own provisional map, which might definately be junk. I think there are three different ways evidence can be old, and I suspect they're different problems wearing the same label:

  (1) temporal oldness — you believed E before you ever had T;
  (2) construction oldness — E was among the things you were staring at when you built T, so the fit is no surprise (the accommodation vs prediction thing);
  (3) derivation oldness — you had T and you had E, and the only thing that's new is that someone worked out that T entails E.

  On top of that there's an axis I'm much less sure about: whether this is a problem for a logic of confirmation (some relation between T, E and background) or for a norm of updating for agents who aren't logically omniscient. Those feel like genuinely different projects, and I think people slide between them.

  What I actually want is an agenda, not a survey. Rank the open questions here for someone in my position — two years, formal toolkit, no physics — and defend the ranking: which questions are upstream of which, which are tractable with the tools I have, which are neglected relative to how much depends on them, and which are traps that look deep but whose answer wouldn't change anything downstream. If my three-way taxonomy is the wrong way to carve the space, say what the right carving is and why the carving changes the order.

  Two things I'd especially like weighed. First, my pet suspicion: that the puzzle is an artifact of reading P(E) = 1 as a credence you actually still have, when old evidence is really evidence you have a lossy memory of — so the right treatment might be a memory-or-recall model rather than a confirmation-theoretic one. Is that a research program or a dead end, and where does it sit in the ordering? Second, how much of the value here is internal to Bayesianism (patching a technical bug in a framework) versus exportable: the same structure shows up whenever a model is fitted to data and the same data is then cited back as evidence for it (double dipping, post-hoc theorizing in the replication-crisis literature), and whenever an analyst already has all the data on file and then comes up with a hypothesis that fits it. Should the export question drive the agenda, or is chasing applications a distraction from getting the core problem right?

  And tell me what would move things: what result, argument, or empirical finding in the next couple of years would move a question up or down your list.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Request:**
      *   **User Profile:** 4th-year PhD student (Formal Epistemology + Phil Physics), ~2 years dissertation + 1 postdoc.
      *   **Goal:** Tackle the Problem of Old Evidence (POE) rather than a "safer" topic. Needs a concrete research agenda, not a survey.
      *   **Constraints/Tools:** Probability theory, modal logic, *no real physics* (crucial constraint).
      *   **Current Taxonomy:** Temporal oldness, Construction oldness, Derivation oldness.
      *   **Key Distinction:** Logic of confirmation vs. Norm of updating (logical omniscience).
      *   **Specific Questions:**
          1.  Rank open questions (upstream/downstream, tractability, neglectedness, traps).
          2.  Evaluate the "memory/recall model" hypothesis.
          3.  Evaluate the "internal vs. exportable value" question (Bayesian patch vs. general scientific methodology).
          4.  Identify "move-makers" (what results would shift the agenda).

  2.  **Deconstruct the Problem of Old Evidence (POE):**
      *   *The Core:* Standard Bayesian conditionalization $P_{new}(T) = P_{old}(T|E)$ fails if $P_{old}(E) = 1$, because $P(T|E) = P(T)$.
      *   *The Intuition:* $E$ (Mercury's perihelion) *did* confirm $T$ (GR).
      *   *Existing Solutions:*
          *   Counterfactual (Garber, Jeffrey): What if I *didn't* know $E$?
          *   Logical Omniscience (Eells, Fitelson): Relax the assumption that agents know all logical consequences of their theories.
          *   Ur-Priors (Meacham): Conditionalize on the proposition that $T$ entails $E$.
          *   Fragmentation (Stalnaker, Weisberg): Different belief states for different contexts.

  3.  **Evaluate the User's Taxonomy:**
      *   (1) Temporal: Known before theory.
      *   (2) Construction: Used to build theory (accommodation).
      *   (3) Derivation: Theory + Evidence known, link unknown.
      *   *Critique:* This is a standard taxonomy, but (1) and (3) often collapse into the "Logical Omniscience" issue. (2) is often about *novelty* and *overfitting* rather than strict Bayesian conditionalization. The user's distinction between "Logic of Confirmation" and "Norm of Updating" is the *real* carve. The taxonomy should be reorganized around *mechanisms of failure* rather than temporal history.

  4.  **Develop the Agenda (Ranking & Justification):**

      *   *Constraint Check:* No physics. This rules out deep dives into the specific history of GR/Mercury as a physics case study. It must be formal/structural.
      *   *Timeframe:* 2-3 years. Needs to be dissertation-sized chunks.

      *   *Priority 1: The Logical Omniscience/Updating Axis (Upstream).*
          *   Why: If POE is just a symptom of assuming logical omniscience, solving confirmation logic without fixing omniscience is band-aid work.
          *   Tractability: High for formal epi (modal logic + prob).
          *   Neglectedness: Moderate. Garber-style solutions are old, but new dynamic epistemic logic (DEL) approaches are fresh.
          *   *Verdict:* This is the foundation.

      *   *Priority 2: The "Construction/Accommodation" Axis (Exportable).*
          *   Why: Connects to replication crisis, machine learning overfitting. High impact outside philosophy.
          *   Tractability: Requires modeling *theory generation*, not just evaluation. Harder but doable formally (e.g., model selection criteria).
          *   *Verdict:* High value, but secondary to fixing the core Bayesian bug.

      *   *Priority 3: The Memory/Recall Hypothesis (User's Pet).*
          *   Why: Interesting, but risks being psychological rather than epistemic. If it's just "I forgot I knew E," that's a specific case of logical non-omniscience.
          *   Risk: Might dissolve into "I wasn't sure E was true" (uncertainty) rather than "I forgot."
          *   *Verdict:* Promising niche, but don't bet the dissertation on it unless framed as "Uncertainty about Evidence Status."

      *   *Priority 4: Pure Confirmation Logic (Counterfactuals).*
          *   Why: "What if I didn't know E?" is often metaphysically murky.
          *   *Verdict:* Trap. Hard to make precise without possible worlds semantics that get messy.

  5.  **Address Specific Questions:**

      *   *Memory/Recall:* It's a version of the "Uncertain Evidence" problem (Jeffrey Conditionalization). It's tractable but needs to be formalized carefully so it doesn't just become "P(E) < 1". If it's about *accessibility* of the proposition, it links to awareness logic.
      *   *Internal vs. Export:* Export should drive the agenda *if* the core bug is fixed. A broken Bayesianism doesn't help science. Fix Bayesianism -> Apply to Science.
      *   *Move-Makers:* A formal proof that certain updating rules converge on truth despite old evidence? Or a impossibility result showing POE is unavoidable for rational agents?

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Peer-to-peer, rigorous, encouraging but realistic.
      *   *Structure:*
          1.  Re-carving the Space (Critique of taxonomy).
          2.  The Ranked Agenda (1, 2, 3).
          3.  Addressing the Memory Hypothesis.
          4.  Internal vs. Export.
          5.  Move-Makers.
      *   *Refining the "No Physics" constraint:* Emphasize that formal models *stand in* for the physics cases. Don't need to know GR, need to know entailment relations.
      *   *Refining the Memory Hypothesis:* Connect it to "Awareness Logic" or "Awareness Growth." This gives it formal teeth.
      *   *Refining the Export:* Connect to "Post-Selection Inference" in statistics. This is the rigorous analog of "double dipping."

  7.  **Final Polish:** Check against the "2 years + postdoc" timeline.
      *   Year 1: Formal model of awareness/omniscience (The Core).
      *   Year 2: Application to Accommodation/Overfitting (The Export).
      *   Postdoc: Generalizing to broader norms/empirical testing.

      *Self-Correction during drafting:* I initially thought about telling them to drop the memory idea. But it's their "pet." Better to show how to make it rigorous (Awareness Logic) rather than dismiss it. It fits the "Logical Omniscience" bucket best.

      *Re-evaluating the Taxonomy:* The user's (1), (2), (3) are *scenarios*, not *problems*. The problems are (A) P(E)=1 rigidity, (B) Logical Omniscience, (C) Theory Construction bias. I need to make sure they see this distinction.

      *Final check on "Move-Makers":* Needs to be specific. "A Dutch Book argument that works for non-omniscient agents" is a good example.

  8.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a strong position to be in. You have the formal toolkit, the timeline is realistic for a deep dive, and you've correctly identified that the "Problem of Old Evidence" (POE) is often a conflation of distinct issues. The constraint of "no real physics" is actually a blessing here; the POE is fundamentally a problem in probability logic, not celestial mechanics. Using Mercury as the *motivating example* is fine, but solving it requires abstracting away from the physics.

  Here is a ranked agenda, a re-carving of your taxonomy, and an assessment of your specific hypotheses.

  ### I. Re-carving the Space

  Your three-way taxonomy (Temporal, Construction, Derivation) describes *scenarios*, not *mechanisms of failure*. This is why the literature feels tangled: people propose solutions to Derivation oldness that fail on Construction oldness.

  For a formalist, the space should be carved by **where the probability model breaks**:

  1.  **The Rigidity Problem:** $P(E)$ is fixed at 1. (This is the surface-level algebraic bug).
  2.  **The Omniscience Problem:** The agent is modeled as knowing all logical consequences of $T$ immediately. (This is why $P(E|T) = 1$ is assumed too early).
  3.  **The Generation Problem:** The space of hypotheses $\{T_1, \dots, T_n\}$ is treated as fixed, ignoring that $T$ was *selected* because it fit $E$. (This is the Construction/Accommodation issue).

  **Why this changes the order:**
  If you solve Rigidity without solving Omniscience, you're just doing algebra on a broken agent model. If you solve Omniscience without addressing Generation, you solve the Mercury case but fail to address the Replication Crisis (post-hoc theorizing).

  ### II. The Ranked Agenda (2 Years + Postdoc)

  Here is the order of operations, ranked by upstream dependency and tractability for your toolkit.

  #### 1. The Upstream Priority: Formalizing "Awareness Growth" (The Omniscience Fix)
  *   **The Question:** How do we model an agent who knows $T$ and knows $E$, but does not yet know that $T \vdash E$?
  *   **Why First:** This is the logical prerequisite. If you cannot model the *learning of the entailment*, you cannot model the confirmation. Standard Bayesianism assumes the Boolean algebra of propositions is fixed. You need a model where the algebra expands.
  *   **Tools:** Awareness Logic (Fagin & Halpern) + Probability. This fits your modal logic + prob toolkit perfectly.
  *   **Tractability:** High. There are existing frameworks (e.g., Dietrich & List, Bradley) but they are often qualitative. A rigorous probabilistic dynamics of "becoming aware of an entailment" is a dissertation-sized chunk.
  *   **Neglectedness:** High. Most people try to fix the conditionalization rule; fewer fix the state space.
  *   **Trap Warning:** Do not get bogged down in the metaphysics of "what is a proposition." Treat propositions syntactically (sentences in a language) to avoid set-theoretic explosions.

  #### 2. The Export Priority: The "Selection Effect" Model (The Generation Fix)
  *   **The Question:** How much does the fact that $T$ was *constructed* to fit $E$ discount the confirmation $E$ provides to $T$?
  *   **Why Second:** Once you have a model of learning entailments (from #1), you can layer on the meta-knowledge that "I chose $T$ because it entailed $E$." This connects directly to the "double dipping" literature in statistics (post-selection inference).
  *   **Tools:** Hierarchical Bayesian modeling or Likelihood Ratios that include a "theory generation" parameter.
  *   **Tractability:** Medium. It requires modeling the *process* of theory generation, which is hard. However, you can idealize this: assume a "theory space" and a selection function.
  *   **Value:** This is where the "exportable" value lies. If you can formalize how much "accommodation" penalizes a theory compared to "prediction," you have a contribution to methodology in psychology/economics/ML.
  *   **Trap Warning:** Avoid trying to model actual human creativity. Model *rational reconstruction* of theory choice.

  #### 3. The Downstream Priority: Norms of Updating (The Rigidity Fix)
  *   **The Question:** Given the above, what is the correct updating rule? Is it Garber-style conditionalization on "$T \vdash E$"? Is it Ur-Prior conditionalization?
  *   **Why Last:** You cannot decide the norm until you decide what the state change is (Awareness vs. Selection).
  *   **Tools:** Dutch Book arguments, Accuracy Dominance.
  *   **Tractability:** High, but risky. Many impossibility theorems exist here.
  *   **Value:** This is the "pure philosophy" payoff.

  ### III. Assessing Your Pet Hypothesis: The Memory/Recall Model

  **Verdict:** This is a **viable research program**, but only if formalized as **Uncertain Evidence** or **Awareness**, not psychology.

  *   **The Risk:** If you frame this as "I forgot I knew $E$," psychologists will eat you alive. Memory isn't binary.
  *   **The Fix:** Frame it as **Access Uncertainty**. The proposition $E$ is in your belief set, but its *availability* for conditionalization is stochastic.
  *   **Where it fits:** This is a specific instance of **Priority #1 (Awareness Growth)**. You aren't learning $E$; you are learning that $E$ is *relevant* to $T$.
  *   **Why it's worth it:** It bridges the gap between ideal Bayesianism and bounded rationality without abandoning the formalism. It allows you to say $P(E) < 1$ *effectively* at the moment of testing, even if $P(E)=1$ in the archive.
  *   **Recommendation:** Don't make this the *whole* dissertation. Make it Chapter 2. Use it to solve the "Derivation Oldness" case (you knew $E$, you knew $T$, you just didn't access the link).

  ### IV. Internal vs. Exportable Value

  **Verdict:** Let the **Export Question drive the Agenda**, but keep the **Internal Problem as the Engine.**

  *   **Reasoning:** Solving POE purely internally (patching Bayesianism so it doesn't break on Mercury) is a "bug fix." It's necessary, but it won't get you a tenure-track job in a diverse department.
  *   **The Pivot:** The structure of POE is identical to **P-Hacking** and **Overfitting**.
      *   *POE:* I found a theory that fits old data.
      *   *P-Hacking:* I found a hypothesis that fits existing data.
      *   *Machine Learning:* I tuned hyperparameters on the test set.
  *   **Strategy:** Solve the Bayesian bug (Internal) to justify a penalty term for accommodation (Export). If you can derive a formal "novelty bonus" or "accommodation penalty" from first principles of rational updating, you have a paper in *Philosophy of Science* and a paper in a methods journal (or at least a very strong interdisciplinary chapter).
  *   **Warning:** Do not try to solve the replication crisis. That is empirical. Solve the *logic of confirmation* that underpins the critique of the replication crisis.

  ### V. What Would Move Things? (Move-Makers)

  Here are specific results that would shift the priority of these questions over the next two years:

  1.  **Move Upstream (Prioritize Omniscience):** If you find a Dutch Book argument that works *only* if agents are logically non-omniscient. This would prove that fixing omniscience isn't just realistic, it's *normatively required*.
  2.  **Move Downstream (Prioritize Updating):** If a new impossibility theorem shows that Awareness Growth models cannot preserve coherence (Probability axioms) during expansion. This would force you to abandon the "Awareness" route and look at "Ur-Priors" or "Fragmentation."
  3.  **Kill the Memory Hypothesis:** If you can show that modeling "recall" is mathematically isomorphic to simply assigning $P(E) = 1 - \epsilon$. If the memory model adds no structural complexity over "uncertain evidence," drop it. It needs to offer something unique (e.g., dynamics of accessibility).
  4.  **Boost Export Value:** If a major journal (e.g., *Nature Human Behaviour*) publishes a critique of post-hoc theorizing that explicitly cites the need for a formal confirmation theory. (Keep an eye on the "Hypothesis Generation" literature in psychology).

  ### Summary of the Plan

  1.  **Year 1 (Dissertation Core):** Build a formal model of **Awareness Growth**. Show how an agent can learn "$T \vdash E$" without learning $E$ or $T$. Solve the "Derivation Oldness" case. (This handles your Memory Hypothesis as a sub-case of accessibility).
  2.  **Year 2 (Dissertation Extension):** Extend the model to **Theory Selection**. Model the probability of $T$ being proposed *given* that it fits $E$. Derive a formal penalty for accommodation. (This handles the "Construction Oldness" case and the Export value).
  3.  **Postdoc:** Generalize. Apply the framework to specific cases of scientific controversy (without needing physics expertise—use case studies from biology or psych where the logic is clearer) or connect to Computer Science (Inductive Logic Programming).

  **Final Advice:** The trap is trying to solve *all* old evidence. The "Temporal" case (I knew $E$ 10 years ago, now I have $T$) is often just a psychological intuition pump for the Derivation case. Focus on **Derivation** (the link is new) and **Construction** (the theory was tailored). Ignore pure Temporal oldness; it dissolves if you solve the other two.

  This agenda keeps you within your formal strengths, respects your "no physics" constraint, and positions you as someone who fixes Bayesianism *for the sake of scientific methodology*, which is a much stronger hiring profile than "someone who fixed Bayesianism."
