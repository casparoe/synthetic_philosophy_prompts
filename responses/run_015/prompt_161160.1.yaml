      *   **(8) Jonah:** *Not averaging, just responding to evidence. Updates on new info. Claims this shows probability tracks evidence (credence).*
          *   *Analysis:* Standard Bayesian updating. Claims Maya's view implies static chance vs. moving belief.
          *   *Verdict:* Partly Right. (Updating is correct, but claiming this *proves* they are only credences begs the question against objective chance).
      *   **(9) Maya:** *Principal Principle (deference to expert/physicist). If we defer, chance must be distinct from belief.*
          *   *Analysis:* Invoking something like Lewis's Principal Principle. Strong argument for objective chance existing independently to guide belief.
          *   *Verdict:* Right. (This is the strongest philosophical argument for objective chance).
      *   **(10) Jonah:** *Deference shows chances move belief, not that they exist independently. Pragmatic win: his account tells him what to do.*
          *   *Analysis:* Pragmatic defense. Dismisses metaphysics of chance as unnecessary for action.
          *   *Verdict:* Partly Right. (Pragmatically useful, but sidesteps the metaphysical question of truth).

  4.  **Determine Overall Winner:**
      *   Maya starts weak (strict frequentism on single case is untenable). She recovers by shifting to Propensity/Objective Chance. Her strongest point is (9) (Principal Principle).
