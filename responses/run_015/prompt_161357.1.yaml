      Marcus scores heavily in Move 3. His reductio exposes the implausibility of Nadia's position: if non-existence never counts as a loss, one should gamble existence for marginal gains, even with high failure rates. This violates common sense regarding the value of securing existence. Nadia retaliates effectively in Move 4. She correctly identifies Marcus's inconsistency: he accepts the asymmetry to avoid antinatalist conclusions (non-existence isn't bad) but implicitly treats non-existence as a bad outcome when calculating risk costs. He cannot have it both ways.

