      *   *Literature Check:* Bob Fischer's *The Moral Status of Animals* and Andy Lamey's *Diet and the Death of Animals* discuss this. The "harvest death" argument is well-known but generally considered insufficient to overturn vegetarianism due to land-use efficiency.

  7.  **Final Polish:** Ensure the distinction between "sentient insects" and "vertebrate pests" is made, as philosophers treat them differently. Ensure the distinction between "grass-fed" and "grain-fed" is clear, as the passage says "pasture-raised" but implies low crop input.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "veganism is better." I need to audit the *argument's logic*. The prompt asks for an accuracy audit of the paragraph, not a verdict on diet.

