answer: |-
  **Rejected Candidates**
  1.  **The Fridge Note:** A handwritten "Buy Milk" vs. a printed one. *Dumped:* High-resolution scanning reveals ink topology differences, violating the **Outer Message Identity** constraint.
  2.  **The Bomb Prop:** A wire labeled "Cut Me" on a real bomb vs. a training dummy. *Dumped:* Distinguishing them requires prior testimony ("This is a drill"), violating the **Same Decoder** constraint (no difference in what was told beforehand).

  **Selected Case: The High-Voltage Label**
  **Variant A:** A yellow "DANGER: HIGH VOLTAGE" sticker affixed to a live transformer in a working substation.
  **Variant B:** An physically identical sticker affixed to a decommissioned transformer in a technical museum.
  **Decoder:** The same electrical engineer, viewing each in situ.

  **Analysis**
  *   **Frame:** In A, the object is functional infrastructure within an active grid. In B, it is an artifact within a display case.
  *   **Outer Message:** Identical pixel-for-pixel scan of the sticker text and graphics.
  *   **Inner Message:** In A, the content is a performative warning: *Touching this will kill you now.* In B, the content is constative: *This object once warned of lethal voltage.*
  *   **Incompatibility:** The engineer cannot rationally believe both "This is currently lethal" and "This is historically lethal" simultaneously. The illocutionary force shifts from Warning to Description solely via the Frame.

  **Critical Feature**
  The **institutional status** of the object carrier. If you delete the substation/museum context (place the transformer in a white void), the Inner message becomes indeterminate. The Frame does not merely add tone; it selects the decoding algorithm (Safety Protocol vs. Historical Cataloging).

  **The Objection**
  A skeptic argues: "The museum walls are just more signal. The 'Outer Message' includes the background visual data. Meaning is still Signal + Code."
  **Reply:** If the background is part of the Outer Message, the boundary of "the message" becomes infinite (the whole visual field). Hofstadter's layering collapses. The case survives because the *same* retinal signal (the sticker) is processed by *different* functional schemas triggered by the Frame. The Frame tells the decoder *how* to read the signal, not *what* the signal says. Meaning is located in the interaction between signal status and decoding rule, not the signal alone.

  **Third Variant: The Prop**
  **Variant C:** The sticker is on a transformer in a film studio, with a visible clip-board tag reading "PROP - NOT LIVE."
  **Frame:** Cancels the message status. The object declares itself a non-vehicle.
  **Inner Message:** There is no warning content. The Inner message becomes *Pretend this is dangerous.*
  **Impact on Layers:** This breaks the linear hierarchy. The Frame can negate the Outer message's claim to truth entirely. If the Frame can silence the Inner message, meaning cannot reside in the Outer message even potentially. It confirms that meaning is a function of the **Frame's authorization** of the signal. Without the Frame's warrant, the Outer message is just noise.
