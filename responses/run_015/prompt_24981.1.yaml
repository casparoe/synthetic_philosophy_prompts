answer: |-
  This is a classic problem, and you are absolutely right that it sits right next to the Unity of the Proposition. The specific regress you are describing is standardly known as **Bradley's Regress**.

  It is named after the British Idealist F.H. Bradley, who formulated it in *Appearance and Reality* (1893). While the "Unity of the Proposition" is often framed in semantic or logical terms (how do words/concepts combine to say something?), **Bradley's Regress** is the ontological counterpart (how do particulars and universals combine to constitute a state of affairs?).

  Here is a breakdown of the taxonomy, the status of the viciousness, and the standard escape routes in contemporary metaphysics.

  ### 1. Is it Vicious or Benign?
  The consensus among realists about properties and facts is that **Bradley's Regress is vicious.**

  *   **Why it's vicious:** It is a regress of *ontological constitution* (or grounding). If the existence of fact $F$ (the mug being ceramic) depends on a further fact $F'$ (the mug instantiating ceramicness), which depends on $F''$, then $F$ is never actually constituted. The "ontological glue" is never applied. Unlike a benign causal regress (which could stretch back infinitely in time), this is a synchronic structural regress. If the first link requires a second link to hold it in place, and that link requires a third, nothing ever holds together.
  *   **The Minority View:** Some philosophers (often coherentists or certain infinitists) argue it is benign, suggesting that reality is essentially relational through and through. However, this is not the standard position in analytic metaphysics. Most assume the regress must be stopped at the first step.

  ### 2. Taxonomy of Solutions
  The literature generally divides responses into three main camps: **Relationalism** (which usually succumbs to the regress), **Non-Relationalism** (which tries to stop it), and **Primitivism** (which dissolves it).

  #### A. The Non-Relational Tie (Russell/Armstrong)
  This is the most common realist response.
  *   **The Move:** Admit that instantiation looks like a relation but deny that it is a *universal* relation.
  *   **Bertrand Russell:** In *The Principles of Mathematics*, Russell struggled with this. He eventually distinguished between a "relating relation" (which actually does the work) and a "relation considered as a term" (which is just an object in a list). He posited that instantiation is a unique, sui generis "relating relation" that does not itself require a further relation to relate it to the relata.
  *   **D.M. Armstrong:** Armstrong calls instantiation a **"non-relational tie."** He argues that instantiation is an ontological category distinct from universals and particulars. It is an "ontological free lunch." Because it is not a universal, it does not require a further instantiation relation to link it to the particular and the universal.
  *   **Critique:** Critics (like Michael Jubien or William Vallicella) argue this is ad hoc. If it acts like a relation, why isn't it a relation? Calling it "non-relational" seems like a verbal fiat to stop the regress.

  #### B. Fact Primitivism (State of Affairs Ontology)
  *   **The Move:** Deny that objects and properties are the fundamental building blocks. Instead, **states of affairs (facts)** are fundamental.
  *   **Proponents:** Early Wittgenstein (*Tractatus*), Kit Fine, Jonathan Schaffer (Priority Monism variants).
  *   **The Argument:** Objects and properties are merely abstractions from facts. You don't start with a mug + ceramicness and glue them together. You start with *the-mug-being-ceramic*. The "unity" is primitive. Therefore, there is no need for an instantiation relation, because the fact is not composed of separate entities that need binding.
  *   **Kit Fine:** In "The Question of Ontology," Fine argues that the existence of the constituents does not explain the existence of the whole. The unity is internal to the fact.

  #### C. The "Unsaturated" Ontology (Fregean/Strawsonian)
  *   **The Move:** Ontologize the linguistic distinction. Properties are not self-subsistent entities; they are essentially predicative.
  *   **Proponents:** Frege (obviously), P.F. Strawson, sometimes Gareth Evans.
  *   **The Argument:** Objects are "saturated" (complete); properties are "unsaturated" (incomplete). An unsaturated entity *by its very nature* seeks completion by a saturated one. Therefore, no extra "glue" is needed. The need for a connector arises only if you treat the property as a second object (a "universal object").
  *   **Critique:** Many metaphysicians find "unsaturatedness" mysterious or merely linguistic. How can an *entity* be essentially incomplete? It smells of category mistakes.

  #### D. Nominalism / Trope Theory
  *   **The Move:** Deny the existence of universals.
  *   **Proponents:** Quine, David Lewis (Class Nominalism), Keith Campbell (Trope Theory).
  *   **The Argument:** If there are no universals (like "ceramicness"), there is no instantiation relation between a particular and a universal.
      *   **Resemblance Nominalism:** The mug is ceramic because it resembles other ceramic things. No instantiation needed.
      *   **Trope Theory:** The mug possesses a *particular* instance of ceramicness (a trope). The trope is inherently tied to the bearer (or is a mode of the bearer). Campbell argues that a trope is a "property-particular" that doesn't need a tie to the substance because it is abstractly distinguishable but not separable.
  *   **Critique:** This solves Bradley's Regress by changing the subject. You avoid the regress, but you incur other costs (explaining resemblance, laws of nature, etc.).

  #### E. Substratum Theory vs. Bundle Theory
  This cuts across the above categories but is relevant to how the "mug" is conceived.
  *   **Bundle Theory:** The mug is *just* a bundle of properties. This makes Bradley's Regress worse (how do the properties bundle together?). Usually requires a "compresence" relation, which invites the regress again.
  *   **Substratum Theory:** The mug is a bare particular + properties. This makes the need for instantiation clearer, intensifying the need for a solution like Armstrong's "non-relational tie."

  ### 3. Key Search Terms & Literature
  To dive deeper, these are the specific terms and authors you should be looking for:

  *   **"Bradley's Regress"** (The primary label).
  *   **"The Unity of the Fact"** (Often used interchangeably with the ontological version of the Unity of the Proposition).
  *   **"Instantiation as a Non-Relational Tie"** (Armstrong's specific solution).
  *   **"Ontological Free Lunch"** (Armstrong's phrase for relations that don't add to the ontological count).
  *   **"The Problem of Inherence"** (Older scholastic term for the same issue).

  **Essential Reading:**
  1.  **F.H. Bradley,** *Appearance and Reality* (Book I, Chapter III) – The source.
  2.  **D.M. Armstrong,** *Universals and Scientific Realism* (Vol 2) – The definitive defense of the "non-relational tie."
  3.  **William F. Vallicella,** *A Paradigm Theory of Existence* or his papers on "The Unity of the Fact." Vallicella is arguably the contemporary scholar who has written most extensively on the specific distinction between Bradley's Regress and the Unity of the Proposition.
  4.  **Kit Fine,** "The Question of Ontology" (in *Metametaphysics*, 2009) – For the primitivist/fact-first approach.
  5.  **G.F. Stout,** "The Nature of Universals and Propositions" – Early 20th-century analysis of the "tie."
  6.  **J.M.E. McTaggart,** *The Nature of Existence* – Discusses the "determining correspondence" to solve similar issues.

  ### Summary for your research
  You are dealing with **Bradley's Regress**. It is generally considered **vicious** because it prevents the constitution of facts. The main divide in the literature is between those who posit a **sui generis non-relational tie** (Armstrong) and those who take **facts/states of affairs as primitive** (Fine/Tractatus), thereby denying that objects and properties are prior components that need binding.

  If you are writing a paper, a strong move is to clarify whether you are treating the problem as one of **explanation** (how do we explain the fact?) or **constitution** (what makes the fact exist?). The regress is vicious for constitution, but some argue it might be benign for explanation (though this is a harder sell).
