answer: |-
  # Mathematics, Truth and Proof: The Decision Tree

  **Instructions:** Begin at **START**. Answer each question honestly before checking the label. Follow the arrows to a leaf. Gaps indicate logical space no major view occupies.

  ### I. The Logical Space (Branch Questions)
  1. **Literalism:** Are claims like "2+2=4" literally true (like "cats exist")?  
  2. **Independence:** Does their truth depend on minds or language?  
  3. **Ontology:** Does truth require *objects* (vs. structures/patterns)?  
  4. **Identification:** If objects, does it matter *which* sets they are? **(Custom Node B)**  
  5. **Causal Constraint:** Must knowledge involve causal contact with truth-makers?  
  6. **AI Reliability:** If a machine proves theorems reliably without causal contact, does it *know* them? **(Custom Node A)**  
  7. **Figurative:** Can a sentence be true but its content figurative (like "the sun rose")?  
  8. **Modal:** Is truth about *possibility* of structures rather than actual existence?  
  9. **Plenitude:** Does every consistent theory describe *some* realm?  
  10. **Quietism:** Is the demand for an ontology/epistemology explanation misguided?

  ### II. The Decision Tree
  ```text
  START --> [Q1: Literal Truth?]
     |
     +-- NO --> [Q7: Figurative Content?] --YES--> YABLO FIGURALISM
     |               |
     |               +--NO--> FIELD FICTIONALISM*
     |
     +-- YES --> [Q2: Mind-Independent?] --NO--> [Q10: Demand Misguided?] --YES--> QUIETISM
     |               |                                   |
     |               +--YES--> [Q3: Objects?]            +--NO--> (EMPTY: Unstable Nominalism)
     |                       |
     |                       +-- NO --> [Q8: Modal Truth?] --YES--> MODAL STRUCTURALISM
     |                       |               |
     |                       |               +--NO--> ANTE REM STRUCTURALISM
     |                       |
     |                       +-- YES --> [Q4: ID Matters?] --YES--> [Q5: Causal Link?]
     |                                       |                       |
     |                                       +--NO--> [Q9: Plenitude?] --YES--> PLENITUDINOUS PLATONISM
     |                                       |               |
     |                                       |               +--NO--> NEO-FREGEAN ABSTRACTIONISM
     |                                       |
     |                                       +--YES--> [Q6: AI Knows?] --YES--> (EMPTY: Incoherent)
     |                                                       |
     |                                                       +--NO--> OBJECT PLATONISM
     |
     +-- (Note: Q4 & Q5 pull in same direction: rejecting objects solves ID & Epistemology)
  ```

  ### III. The Leaves (Positions & Commitments)
  *   **Object Platonism:** Numbers are abstract objects; we know them despite no causal link. *(Commitment: Epistemology is a mystery.)*
  *   **Plenitudinous Platonism:** Every consistent theory describes a real realm. *(Commitment: No mathematical error, only mismatched subject matter.)*
  *   **Neo-Fregean:** Numbers exist but are accessed via logic/language, not causality. *(Commitment: Abstraction principles are substantive truths.)*
  *   **Ante Rem Structuralism:** Mathematics studies structures, not objects. *(Commitment: Structures exist without being instantiated.)*
  *   **Modal Structuralism:** Math claims mean "such a structure *could* exist." *(Commitment: Modal logic is more fundamental than set theory.)*
  *   **Field Fictionalism:** Math is a useful fiction; science can be nominalized. *(Commitment: Standard physics is strictly false.)*
  *   **Yablo Figuralism:** Math is literally true but content is metaphorical. *(Commitment: Truth does not imply ontological commitment.)*
  *   **Quietism:** Philosophical demands on math practice are category errors. *(Commitment: Philosophy cannot improve on mathematical rigor.)*

  *\* **Note:** Field and Yablo are hard to separate without asking if nominalistic reconstruction of science is possible.*

  ***

  **Seminar Note:** Spend the most time on **Node 6 (AI Reliability)**. It forces the choice between a causal theory of knowledge (which kills Platonism) and a reliabilist one (which saves Platonism but threatens naturalism).
