answer: |-
  The Godfather films are essentially a study in competing jurisdictions, which makes them surprisingly fertile ground for your three tests. The narrative arc moves from a system of personal obligation (Vito) to a system of corporate-state fusion (Michael), mirroring the transition from traditional patronage to modern kleptocracy.

  Regarding your first question on obligation versus corrupt exchange: The film distinguishes these based on *timing* and *specificity*. An obligation is open-ended and retrospective (you help me because we are friends/I helped you before); a corrupt exchange is prospective and specific (I pay you to do this specific thing). The wedding petitions are framed as obligations. Bonasera (the undertaker) comes only after the state fails him, but he emphasizes his past loyalty and respect. The film treats this as a legitimate social contract within that community. Conversely, Sollozzo's offer to the police captain is a corrupt exchange: cash for protection of a specific illegal enterprise. The film codes the former as honorable (within its moral universe) and the latter as business-like and disposable.

  On the defense of the favor economy: The film validates the *function* of clientelism without necessarily defending the *morality*. It explicitly argues via the Undertaker scene that when the state withdraws protection, a patronage network arises to fill the vacuum (your Substitute Test). However, it does not present this as a stable utopia. The cost of entering that order is the surrender of autonomy. The film defends the *necessity* of the system for the characters, but tragically frames it as a prison.

  On leveling (Senator Geary vs. Michael): The film absolutely levels them. Geary claims moral superiority; Michael dismantles it by revealing Geary's financial dependence and moral compromises. The film notices this is a guilty plea because Michael's victory here is his ultimate defeat. By proving everyone is corrupt, he proves legitimacy is impossible. He wins the exchange but loses the soul of the enterprise. The "everyone does it" argument is presented not as a justification, but as a damnation of the entire structure.

  Where the reading strains: Your tests assume a rational actor choosing between systems. The film is a family melodrama where choices are driven by blood and vengeance, not just utility. Calling the Corleones "patrons" sanitizes the violence required to enforce the patronage. In your manufacturing context, a "favor" might get a permit approved; in the film, the favor gets a head left in a bed. The "Refusal Test" breaks down because while you can theoretically refuse the Don, the cost is death, which moves it from corruption to coercion racketeering. Your framework looks for gray areas of ethics; the film eventually reveals there are no gray areas, only different shades of blood.

