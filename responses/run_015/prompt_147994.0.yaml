prompt: |-
  I do anti-corruption training at a mid-sized manufacturing company and we've just expanded into two countries where basically every deal involves some gift, favour, or job-for-a-cousin going to somebody official. Our global policy says nothing above about 25 dollars and everyone ignores it, and to be honest I've stopped believing the policy describes anything real. The definition we're supposed to work with — roughly, abusing a position of trust for private gain — doesn't seperate the cases I actually care about, so on my own I've come up with three tests and I want to try them on something. Test one, the refusal test: a bribe is supposed to be an exchange both sides can decline, but if nothing in a given system can be refused without cost, then either every exchange there is coercion rather than corruption, or the concept has nothing to grip on. Test two, rent versus buy: cash buys a single decision, whereas a gift or a favour buys the person — it makes them your guy for the next ten years — so maybe the thing we treat as the mild case is actually the worse one. Test three, the substitute test: where the state doesn't deliver protection or credit, a patronage network isn't corrupting an order, it IS the order, and calling it corruption may just be what people say when they already have a state that works.

  I'm thinking of showing two clips in a session and I don't want to use The Godfather as a cheap scare clip, so please read the film (Part II too, if it helps) through these questions. Look at the wedding-day petitions — the undertaker asking for justice, the baker's son-in-law staying in the country, the singer who needs a movie part — where the Don is asked for things no court would give and gives them; look at Sollozzo and the police captain he supposedly keeps in his pocket, which is the straightforward bribery case; look at the senator in Part II who insists he's a different kind of operator and gets told that he and Michael are in the same racket; and look at Michael's whole project of going legitimate and the moment he says he keeps getting pulled back in. Where is the film showing me an obligation, and where is it showing me a corrupt exchange, by its own lights? Does it defend the favour economy as a working alternative to a system that doesn't serve these people, or is it just levelling — saying the senator and the gangster are equally crooked — and if it is levelling, does the film notice that this move is exactly what a guilty person would say? I'd also like you to tell me honestly where the reading strains: it's a family melodrama, the Don is a criminal rather than a patron, and maybe the whole lens is a category mistake. Don't quote the film at me, I know the scenes.

  After the reading, give me a table with these columns: "scene" (a short label), "the_exchange" (who gives what to whom and for what), "my_tests" (which of the three tests it passes, fails, or breaks on, in one sentence each — say "breaks" if the test just doesn't fit), "film_says" (what the film's own framing treats it as: obligation, corruption, or neither), and "strain" (where my test or the film is being unfair to the other). Then one JSON object at the end: {"does_the_film_defend_clientelism": "yes | no | levels_without_defending", "what_it_adds_that_argument_doesnt": "...", "best_clip_for_training": "...", "clip_to_avoid_and_why": "...", "question_im_left_with": "..."}.
