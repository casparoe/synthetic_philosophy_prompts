prompt: |-
  I just finished a long argument with a friend about whether art-status is conferred by an institution or by properties intrinsic to the object, and we kept returning to a scenario neither standard example resolves. I call it the reverse-readymade: a work that has been displayed as canonical art for decades is formally revoked by the same institution that originally conferred its status, not because the physical object changed, but because the board decides the artist's later conduct disqualifies the work from the canon. The friend insisted the object is still art; I wasn't sure. Now I want my students to feel that instability rather than just discuss it. I run an upper-level aesthetics seminar—twelve students, ninety minutes, all philosophy majors familiar with institutional theories but not with this reversal case. Design a structured in-class simulation in which participants collectively write the rules for art-status conferral before they see the revocation scenario, then must apply their rules to vote on whether the object retains art-status. The rules, roles, and voting mechanism should be arranged so that the group runs into a coordination failure or circular dependency—perhaps between curatorial authority and public aesthetic judgment—before anyone names the institutional circularity problem. Include specific roles (e.g., board curators, estate representatives, independent critics, public voters), a payoff or point scheme that requires no real money, materials needed, a minute-by-minute timeline, and a debrief that maps each crisis point in the activity onto a corresponding part of Dickie's or Danto's institutional framework and onto rival intrinsic-property accounts. Be explicit about what will predictably go wrong the first time—say, the group collapses to a simple majority vote too quickly—and how to prevent it. Also be frank about which feature of the actual philosophical debate, such as the historical-intentional constraint on artistic identity, the simulation cannot reproduce and must be supplied by me in the debrief. The students should leave having experienced the pull of both the institutional and the anti-institutional intuition, not just having heard them named.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Design a 90-minute in-class simulation for an upper-level aesthetics seminar (12 philosophy majors).
      *   **Topic:** The "Reverse-Readymade" scenario (an artwork de-certified by an institution due to artist conduct, not physical change).
      *   **Core Mechanism:** Students write rules for art-status conferral *before* seeing the scenario, then apply them to vote.
      *   **Desired Outcome:** Experience instability/coordination failure (circular dependency between authority and judgment) *before* naming the philosophical problem. Feel the pull of institutional vs. anti-institutional intuitions.
      *   **Requirements:** Specific roles, payoff/point scheme (no money), materials, minute-by-minute timeline, debrief mapping to Dickie/Danto/Intrinsic accounts, prediction of failure modes (e.g., collapsing to majority vote) + prevention, frank admission of simulation limitations.

  2.  **Deconstruct the Philosophical Stakes:**
      *   *Institutional Theory (Dickie):* Art is an artifact upon which some person or persons acting on behalf of a certain social institution (the artworld) has conferred the status of candidate for appreciation.
      *   *Historical/Intentional (Danto):* Art requires an atmosphere of artistic theory, a history, and intention.
      *   *Intrinsic/Formalist:* Art status depends on properties within the object (beauty, form, expression).
      *   *The Twist:* Revocation. Dickie implies conferral is enough, but does *de*-conferral work? If the institution says "no longer art," is it still art? If status is intrinsic, revocation shouldn't matter. If status is institutional, revocation *should* matter, but feels wrong (revisionism).
      *   *The Trap:* The simulation needs to force a conflict between *who* decides (authority) and *what* decides (properties/rules).

  3.  **Drafting the Simulation Structure:**
      *   **Phase 1: Constitution Writing (Rule Making).** Students define "Art" without knowing the specific case. This locks them into a framework.
      *   **Phase 2: The Scenario Reveal.** The "Reverse-Readymade" is introduced.
      *   **Phase 3: Adjudication.** They apply their rules.
      *   **Phase 4: Crisis.** The rules fail to yield a clear result or contradict each other.
      *   **Phase 5: Debrief.** Connect to theory.

  4.  **Developing Roles & Incentives:**
      *   Need 12 students.
      *   *Roles:*
          *   Museum Board (3): Care about reputation, liability, donor relations.
          *   Artist Estate (2): Care about legacy, market value, intent.
          *   Independent Critics (3): Care about consistency, theory, public discourse.
          *   Public Viewers (4): Care about experience, moral outrage, aesthetic enjoyment.
      *   *Incentives (Points):* Need to create conflicting goals so consensus is hard.
          *   Board: Points for consistency with past decisions + avoiding scandal.
          *   Estate: Points for maintaining status + market value.
          *   Critics: Points for theoretical coherence.
          *   Public: Points for moral alignment + aesthetic access.
      *   *The Trap:* To get points, they need a unanimous or supermajority verdict, but their incentives pull them in opposite directions regarding the *source* of authority.

  5.  **Refining the "Coordination Failure":**
      *   The prompt asks for circular dependency.
      *   *Idea:* The rules they write must define *who* has the authority to apply the rules.
      *   *Mechanism:* In Phase 1, they write a "Charter." In Phase 3, they must vote based on the Charter. But the Charter will likely say "The Board decides" OR "The Object's properties decide."
      *   *The Twist:* If the Charter says "Board decides," the Board can revoke. But the Critics/Public might revolt (losing points for consensus). If the Charter says "Properties decide," the Board *can't* revoke, but they lose points for "Reputation."
      *   *Preventing Quick Collapse:* Force a "Veto" mechanism or require a "Supermajority" that forces coalition building across roles.

  6.  **Timeline Construction (90 Minutes):**
      *   0-10: Intro & Role Assignment.
      *   10-30: Charter Writing (The Trap).
      *   30-40: Scenario Reveal.
      *   40-60: Deliberation & Voting (The Crisis).
      *   60-90: Debrief & Theory Mapping.

  7.  **Addressing Failure Modes:**
      *   *Risk:* Students just vote "Is it art? Yes/No" ignoring the rules.
      *   *Fix:* The "Compliance Officer" role (rotate or instructor) checks if the vote aligns with the Charter. If not, no points.
      *   *Risk:* They make the rules too vague ("Art is what is beautiful").
      *   *Fix:* Provide a menu of *clauses* they must select from, forcing specific commitments (e.g., "Clause A: Status is permanent once conferred" vs. "Clause B: Board holds final veto").

  8.  **Drafting the Debrief:**
      *   Map the "Charter" to Dickie (Institutional).
      *   Map the "Object Properties" to Intrinsic/Formalist.
      *   Map the "Revocation" to the specific problem of *de-conferral*.
      *   Acknowledge limitations: Simulation can't capture the *historical* weight of actual art history (Danto's atmosphere of theory).

  9.  **Review against Constraints:**
      *   12 students? Yes (Roles sum to 12).
      *   90 minutes? Yes.
      *   No real money? Yes (Points/Privileges).
      *   Coordination failure? Yes (Built into the Charter/Vote mismatch).
      *   Frank about limitations? Yes.

  10. **Polishing the Details:**
      *   Make the "Reverse-Readymade" specific (e.g., a famous minimal sculpture, artist found guilty of fraud/abuse).
      *   Ensure the "Points" system actually creates tension. (e.g., Board gets points for "Stability," Estate gets points for "Status," Public gets points for "Justice").
      *   *Self-Correction on Roles:* 12 students. 3 Board, 2 Estate, 3 Critics, 4 Public. Total 12.
      *   *Self-Correction on Rules:* To ensure circularity, the Charter needs to define "Valid Vote." If the Charter says "Board decides," but the Vote requires "Public Ratification," we have a loop. Let's make them write the *Criteria* for status, not just the voting procedure.
      *   *Better Trap:* They must define "Conferral" and "Revocation" separately. Most will forget Revocation. When the scenario hits, they realize their definition of Conferral doesn't cover Revocation.

  11. **Finalizing the Plan:** (Mental walk-through)
      *   Intro: Don't mention Dickie yet.
      *   Phase 1: Groups draft "The Definition."
      *   Phase 2: Reveal "The Scandal."
      *   Phase 3: Apply Definition.
      *   Phase 4: The Vote fails because the Definition is ambiguous on *retroactivity*.
      *   Debrief: Connect ambiguity to Institutional Theory's silence on de-conferral.

      *(Self-Correction)*: The prompt specifically asks for *roles* and a *payoff scheme*. I need to ensure the incentives drive the conflict.
      *   *Revised Incentive:* Points are awarded for *Coalition Stability*. If the vote is unanimous, everyone gets points. If split, factions get points based on their role's specific interest. This encourages them to try for consensus, fail, and then realize their rules don't support the consensus they want.

      *(Refining the "Circularity")*: The prompt asks for circular dependency between curatorial authority and public judgment.
      *   *Mechanism:* The Charter must state: "Art is what the Board designates AS LONG AS the Public accepts it." But the Public's role is to judge based on "Intrinsic Merit." If the Board revokes based on "Conduct," the Public can't accept it based on "Merit." The Board needs Public acceptance to be valid; the Public needs Board designation to vote. Loop.

      *Let's build this into the Charter drafting phase.*

  12. **Final Polish:** Check tone (academic, instructional), ensure all constraints are met. (Proceed to generate output).

  *(Post-Drafting Review)*: Did I include the "what will go wrong" section? Yes. Did I include the "limitations" section? Yes. Is the timeline realistic? 90 mins is tight, need to be strict on timekeeping.

  *Wait, one more thing:* The prompt asks for "coordination failure or circular dependency... before anyone names the institutional circularity problem." I need to make sure the instructions *don't* give away the theory. The handout must be neutral.

  *Okay, ready to write.*
answer: |-
  # Simulation: The Revocation Protocol
  **Course:** Upper-Level Aesthetics Seminar  
  **Time:** 90 Minutes  
  **Students:** 12 (Philosophy Majors)  
  **Goal:** Experiential engagement with the instability of art-status conferral vs. revocation (Institutional vs. Intrinsic/Intentional theories).

  ---

  ## I. Preparation & Materials

  **Room Setup:**  
  Four tables arranged in a square.  
  *   Table A: Museum Board (3 students)  
  *   Table B: Artist Estate (2 students)  
  *   Table C: Independent Critics (3 students)  
  *   Table D: Public Viewers (4 students)  

  **Materials:**  
  *   **Role Cards:** One per student, detailing specific victory conditions (see below).  
  *   **The Charter Worksheet:** One per table. Blank space to write "Conditions for Art Status."  
  *   **The Case File:** 12 copies of the "Reverse-Readymade" scenario (distributed only in Phase 2).  
  *   **Voting Tokens:** 12 Red (Revoke), 12 Green (Retain).  
  *   **Scoreboard:** Whiteboard to track "Institutional Stability Points" (ISP).  

  **Instructor Role:**  
  You are the **Registrar**. You do not offer philosophical opinions. You only enforce procedural rules and tally points.

  ---

  ## II. Role Cards & Payoff Scheme (No Money)

  Each student receives a secret Role Card. Their goal is to maximize **Institutional Stability Points (ISP)**. Points are awarded at the end based on the final vote and the rationale provided.

  *   **Museum Board (3 students):**  
      *   *Goal:* Protect the Museum's legal/moral reputation.  
      *   *ISP Condition:* You gain 5 points if the work is **Revoked**. You lose 5 points if the decision causes a "Public Riot" (defined as >50% of Public/Critics voting against the Board's recommendation).  
  *   **Artist Estate (2 students):**  
      *   *Goal:* Protect the Artist's legacy and market value.  
      *   *ISP Condition:* You gain 5 points if the work **Retains** status. You lose 5 points if the work is Revoked *without* a clause regarding "Physical Alteration."  
  *   **Independent Critics (3 students):**  
      *   *Goal:* Maintain theoretical consistency.  
      *   *ISP Condition:* You gain 5 points if the final decision aligns strictly with **The Charter** written in Phase 1. You lose 5 points if the decision relies on "External Moral Factors" not listed in The Charter.  
  *   **Public Viewers (4 students):**  
      *   *Goal:* Moral alignment and aesthetic access.  
      *   *ISP Condition:* You gain 5 points if the decision aligns with your **Moral Intuition** (regarding the artist's conduct). You lose 5 points if the Board overrides your collective vote.

  **The Trap:** To get maximum points, the group needs a **Unanimous Verdict**. If the vote is split, no one gets the "Consensus Bonus" (10 points). This forces them to negotiate, revealing the contradictions in their own rules.

  ---

  ## III. Minute-by-Minute Timeline

  ### Phase 1: Constitution Writing (20 Minutes)
  1.  **00:00–05:00:** Assign roles. Distribute Role Cards. Tell students: *"You are the governing body of the National Art Archive. Your task is to write 'The Charter.' This document will define the necessary and sufficient conditions for an object to hold the status of 'Art' within this institution. You do not know what specific cases you will judge."*
  2.  **05:00–20:00:** Tables draft clauses. They must agree on a single document signed by all tables.
      *   *Constraint:* They must define **Conferral** (how something becomes art) and **Revocation** (how it stops being art).
      *   *Instructor Note:* If they leave "Revocation" blank, tell them: *"The Charter must account for the permanence of status. Is it permanent or reversible?"*
      *   *Predicted Outcome:* They will likely write something vague like "Art is what the Board designates" OR "Art is what has aesthetic value." They will struggle to link Board authority to Public acceptance.

  ### Phase 2: The Scenario Reveal (10 Minutes)
  1.  **20:00–30:00:** Distribute **The Case File**.
      *   **Object:** *Void Column* (1975), a minimalist steel pillar.
      *   **History:** Acquired 1980. Displayed as a masterpiece of minimalism. Taught in textbooks.
      *   **New Information:** Diaries of the artist (now deceased) reveal the work was a cynical hoax intended to mock the buyers, *and* the artist was posthumously implicated in severe ethical violations (e.g., funding human rights abuses).
      *   **The Motion:** The Museum Board proposes **Revocation**. They wish to de-accession the work and label it "Non-Art: Ethical Hazard."
      *   **Constraint:** The physical object has not changed.

  ### Phase 3: Adjudication & The Crisis (30 Minutes)
  1.  **30:00–45:00:** Deliberation. Groups must apply *The Charter* to *The Case File*.
      *   *The Coordination Failure:* The Board wants to revoke (Reputation). The Estate wants to retain (Legacy). The Public wants to revoke (Morals). The Critics want to follow The Charter (Consistency).
      *   *The Circular Dependency:* If The Charter says "Board Decides," the Board can revoke. But if the Board revokes, the Public riots (Board loses ISP). If The Charter says "Aesthetic Properties," the work remains Art (Estate wins), but the Public riots (Public loses ISP).
      *   *Instructor Intervention:* If they try to vote immediately, stop them. Remind them: *"The Vote is only valid if it complies with The Charter. The Registrar (you) will audit the rationale."*
  2.  **45:00–60:00:** The Vote.
      *   Students cast Red/Green tokens.
      *   **Predicted Failure:** They will likely ignore The Charter and vote based on personal moral intuition, or they will amend The Charter mid-vote to suit the outcome.
      *   *Action:* If they amend The Charter mid-vote, declare a **"Procedural Violation."** Freeze the points. This creates the felt experience of instability—the rules changed because the outcome was uncomfortable.

  ### Phase 4: Debrief & Theory Mapping (30 Minutes)
  1.  **60:00–90:00:** Discussion.

  ---

  ## IV. Debrief Guide: Mapping the Crisis to Theory

  **1. The Charter as Institutional Theory (Dickie)**
  *   **Ask:** "Look at Clause 1 of your Charter. Who did you say has the power to confer status?"
  *   **Map:** If they wrote "The Board designates," they replicated Dickie's *Artworld*.
  *   **The Glitch:** "Dickie explains how status is *given*. Did your Charter explain how status is *taken away*?"
  *   **Point:** Institutional theory is notoriously silent on *de-conferral*. If art is a status conferred by a person acting on behalf of the artworld, can that person act *against* the artworld later? The simulation showed that revocation feels like a category error, not just a policy change.

  **2. The Object as Intrinsic/Formalist Account**
  *   **Ask:** "Did anyone argue that the steel pillar itself didn't change, so the art didn't change?"
  *   **Map:** This aligns with Formalism or Intrinsic Property accounts.
  *   **The Glitch:** "If art is intrinsic, why did the Board feel they had the power to revoke it at all? Why did the Public care about the artist's conduct?"
  *   **Point:** Pure intrinsic accounts cannot explain why we care about the *context* (the diaries, the ethics) enough to threaten the object's status.

  **3. The History/Intention as Historical Theory (Danto)**
  *   **Ask:** "Did the artist's intent (the hoax) matter?"
  *   **Map:** Danto's *Atmosphere of Artistic Theory* and intentionality.
  *   **The Glitch:** "If the artist intended it as a hoax *at the time of creation*, was it ever art? Or did the Board's 1980 acceptance fix that?"
  *   **Point:** This highlights the *historical-essentialist* constraint. If the "art" status depends on a specific historical relation, can that relation be severed retroactively?

  **4. The Circular Dependency (The Core Lesson)**
  *   **Ask:** "Why was it impossible to get full points?"
  *   **Explanation:** You built a system where **Authority** (Board) required **Legitimacy** (Public/Critics) to function, but **Legitimacy** required **Authority** to define the object.
  *   **Philosophical Translation:** This is the problem of *Normativity* in Institutional Theory. The Institution defines art, but the Institution is only an "Art Institution" if it deals with Art. When the Institution tries to deny the art, it undermines its own authority to make the denial.

  ---

  ## V. Predicted Failure Modes & Prevention

  **Failure 1: The "Simple Majority" Collapse**
  *   **What happens:** Students ignore the Charter and vote "Is it art? Yes/No" within 5 minutes of Phase 3.
  *   **Prevention:** The **Registrar (You)** must reject the vote. *"This vote violates Clause 3 of your Charter. You defined art as 'Board Designation,' but the Board is split. You need a procedural amendment. That costs 5 ISP points."* Penalizing the shortcut forces them to confront the rule conflict.

  **Failure 2: The "Charter Loophole"**
  *   **What happens:** Students write a Charter so vague ("Art is what is valuable") that it covers any outcome.
  *   **Prevention:** During Phase 1, act as a strict legal counsel. *"What counts as valuable? Who defines value? If you don't specify, the Registrar will define it for you randomly."* Force specificity.

  **Failure 3: Moral Dominance**
  *   **What happens:** Everyone agrees to revoke based on ethics, ignoring the aesthetic question.
  *   **Prevention:** In the Debrief, press the Critics: *"You lost points because 'External Moral Factors' were not in the Charter. Did you sacrifice theoretical consistency for moral comfort? Is that what happens in the real art world?"*

  ---

  ## VI. Simulation Limitations (Instructor Notes)

  Be frank with students about what the simulation *cannot* do. Add this to the end of the debrief:

  1.  **The Weight of History:** In the simulation, the "Art Status" is 20 minutes old. In reality, *Void Column* would have 50 years of critical literature, market transactions, and emotional attachment. The simulation cannot reproduce the *inertia* of art history, which makes revocation practically impossible even if theoretically permissible.
  2.  **The "Artworld" is not a Monolith:** In the game, "The Board" is a single table. In reality, the Artworld is a decentralized network (museums, critics, collectors, other artists). One museum revoking status doesn't erase the work; other institutions might pick it up. The simulation centralizes power too much, making the "Revocation" feel more absolute than it would be in reality.
  3.  **The Phenomenology of Art:** You cannot simulate the *experience* of the artwork. Students are arguing about a description. Intrinsic theorists argue that the *experience* constitutes the art status. The simulation reduces art to a legal contract, which biases the outcome toward Institutionalism.

  **Closing Prompt for Students:**
  *"You felt frustration when your rules didn't match your intuition. That frustration is the philosophical problem. Institutional theory explains the rules; Intrinsic theory explains the intuition. The 'Reverse-Readymade' breaks the link between them. Your homework is to propose a clause for The Charter that resolves the circularity without sacrificing either authority or experience."*
