          *   *Analysis:* This is the classic "modularity" debate (Fodor vs. Churchland/Pylyshyn).
          *   *Who's right?* Marcus is empirically stronger here. The Müller-Lyer illusion is notoriously *cognitively impenetrable*. Knowing the lines are equal rarely makes the illusion disappear phenomenally. Dana's premise (that the illusion goes away) is factually shaky. Marcus's distinction between experience and judgment is the standard philosophical view (the "belief-independence" of perception).
