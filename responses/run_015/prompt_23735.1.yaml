          *   *Verdict:* Dana wins on the philosophical logic (Marcus is begging the question). Marcus wins on the standard distinction (there *is* a difference between sensation and perception), but his claim that it's a *definition* is weak. Dana is right that the interesting question is causal contribution.

      *   **Round 3: Sherif Autokinetic Effect.**
          *   *Dana:* Sherif effect (light appears to move in dark). Group convergence suggests social context changes perception.
          *   *Marcus:* Change in judgment/report, not perception. Social pressure, not visual change.
          *   *Analysis:* The autokinetic effect is ambiguous. It involves ambiguous stimuli. Social conformity usually affects *estimates* (judgment), not necessarily the phenomenal experience of motion. However, predictive processing models suggest expectations *do* shape perception. But Marcus's skepticism is standard here: conformity $\neq$ perceptual change.
          *   *Verdict:* Marcus is likely right empirically here too. Conformity effects are usually post-perceptual. Dana is stretching the evidence.

      *   **Round 4: The Meta-Debate (Unresolvable by Construction).**
          *   *Dana:* Accuses Marcus of defining perception to exclude higher-level states, making debate unresolvable.
