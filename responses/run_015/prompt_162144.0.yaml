  # DECISION TREE: IS THE EXPANDING CIRCLE MORAL PROGRESS?

  **Instructions:** Answer each question based on the historical diagnostics (Animal concern, Violence decline, Future solicitude, Immigrant attitudes). Follow the branches to your position.

  ### Q1: What is the primary driver of the behavioral change?
  *   **External Constraint** (State capacity, commerce, literacy reduced violence/opportunity) → **LEAF 1: Pacification-Not-Moralisation**
      *   *Claim:* Behavior improved, but moral belief did not. The "circle" is a side-effect of safety/wealth.
  *   **Consistency with Old Beliefs** (We always believed slavery/violence was wrong but failed to act) → **LEAF 2: Hypocrisy-Reduction**
      *   *Claim:* Moral belief was static; compliance improved. Progress is reduced weakness of will or structural friction.
  *   **Adoption of New Beliefs** (We genuinely think differently about animals/future/out-groups) → **Go to Q2**

  ### Q2: Is the total pool of moral concern fixed (zero-sum) or expandable?
  *   **Fixed** (Rising concern for animals/future is funded by falling concern for the nearby poor) → **LEAF 3: Budget View**
      *   *Claim:* Expansion is real but isn't *growth*. It is redistribution. (Check: Does concern for immigrants fall as concern for animals rises?)
  *   **Expandable** (We can care about more things without caring less about others) → **Go to Q3**

  ### Q3: Do the newly included entities (animals, rivers, chatbots, future people) possess *moral standing*?
  *   **No** (We care for them, but they have no rights/claims comparable to humans) → **LEAF 4: Widening-Without-Status**
      *   *Claim:* The *objects* of care expanded, but the *class of beings with standing* did not. (e.g., Protecting a river is like protecting a painting).
  *   **Yes** (They are moral patients with independent claims) → **Go to Q4**

  ### Q4: Is the expansion *universal* (including hostile out-groups/immigrants) or *selective* (vulnerable/non-threatening only)?
  *   **Selective** (Concern for animals/future rises, but attitudes toward immigrants harden) → **LEAF 5: Fragmented Expansion**
      *   *Claim:* **Unattractive as 'Progress'.** Suggests moral change is driven by safety/preference, not principle.
  *   **Universal** (Concern extends even to rivals/out-groups) → **Go to Q5**

  ### Q5: Is the direction of change explained by convergence on mind-independent moral facts?
  *   **Yes** (We are tracking moral truth) → **LEAF 6: Realist Tracking**
      *   *Claim:* The circle widens because it *ought* to. Past narrower circles were errors.
  *   **No** (Change is contingent on culture/evolution) → **Go to Q6**

  ### Q6: If contingent, is morality a description of culture or an expression of attitude?
  *   **Description** (We just changed our cultural norms) → **LEAF 7: Nothing-Mind-Independent-Happened (Cultural)**
      *   *Claim:* We are different, not better. No truth was tracked.
  *   **Expression** (We are projecting new attitudes onto the world) → **LEAF 8: Nothing-Mind-Independent-Happened (Expressivist)**
      *   *Claim:* Moral claims are non-cognitive. "Progress" is just a label for attitudes we prefer.

  ---

  ### LOGICAL SPACE NOTES & EMPTY CELLS

  *   **Incoherent Cell:** *Realist Tracking* + *No Mind-Independent Facts*. (You cannot track a truth that does not exist).
  *   **Unattractive Cell:** *Fragmented Expansion* labeled as *Moral Progress*. (If progress is universal, excluding immigrants falsifies the claim).
  *   **Undefended Cell:** *Budget View* + *Expandable Concern*. (Contradictory definitions).

  ### INDETERMINATE LEAVES (THE REALIST PROBLEM)

  **Leaves 6 (Realist) and 7/8 (Nothing-Mind-Independent)** agree on all actual historical data (animals, violence, future). They cannot be separated by observation of the past. They separate only on a **Counterfactual Question**:

  > *"If our cultural evolution had led us to **contract** the circle (e.g., if commerce rewarded slavery today), would we be **mistaken** (Realist) or merely **different** (Nothing-Mind-Independent)?"*

  *   **Realist:** We would be mistaken. The truth is independent of the cultural outcome.
  *   **Nothing-Mind-Independent:** We would just be different. There is no "mistake" absent a mind-independent standard.

  *(TA Note: If you cannot answer this counterfactual, your position is historically underdetermined.)*
