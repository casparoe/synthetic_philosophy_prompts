  **Note on Interpretation and Contention**

  The poem relies on specific interpretive choices regarding Kant's ethics that warrant distinction between settled text and scholarly debate. It is settled interpretation that Kant prohibits lying in the "murderer at the door" case based on a perfect duty rather than a calculation of consequences, and that the universalization test involves a contradiction in conception (the collapse of the institution of assertion). However, the poem adopts the "juridical" reading of the wrongness of lying—specifically that it violates the right of humanity in one's own person by corrupting the speaker's capacity for rational communication—which is emphasized in Kant's *Doctrine of Right* but sometimes underplayed in introductory readings of the *Groundwork*.

  Furthermore, the poem presents the imperfect duty of beneficence as a genuine moral pull that remains felt even when overridden, rather than as a consideration that simply vanishes in the face of a perfect duty. While Kant insists the perfect duty binds absolutely, scholars contest whether this creates a tragic moral remainder or if the hierarchy of duties renders the conflict merely apparent. Finally, the universalization test is compressed for poetic form; the "loss of sound" metaphor simplifies the logical contradiction in conception, which technically turns on the impossibility of willing a world where promises or assertions function as intended while universally disregarded.
