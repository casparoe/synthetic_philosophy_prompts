answer: |-
  Treating social sanction as genuine punishment is conceptually coherent only if one decouples punitive intent from state authority and accepts distributed agency as a sufficient mechanism for imposition. To sustain this classification without collapsing into metaphor, a theory must satisfy the following desiderata, weighted by their necessity to the definition of punishment itself.

  **Desiderata for an Adequate Theory**

  1.  **The Agency Requirement**
      *   **Requirement:** The theory must identify a punishing agent or mechanism capable of intentional imposition, distinguishing coordinated sanction from mere bad luck or market forces.
      *   **Why:** Punishment implies an imposer; without agency, suffering is merely misfortune.
      *   **Status:** **Non-Negotiable (NN)**. If there is no agent imposing hardship for a reason, it is not punishment.
      *   **Challenge:** Must account for distributed agency (the 'mob') where no single individual intends the total outcome.

  2.  **The Asymmetry Condition**
      *   **Requirement:** It must differentiate between deplatforming a public figure (high power asymmetry) and dogpiling a private individual (low power asymmetry), explaining why the latter often feels more punitive and dangerous.
      *   **Why:** Punishment severity is relative to the target's capacity to absorb harm; a theory must explain why a private citizen losing their job is punitive whilst a celebrity losing a sponsorship is often merely commercial.
      *   **Status:** **NN**. A theory that treats all sanctions equally fails to capture the phenomenology of harm.

  3.  **The Temporal Coherence Clause**
      *   **Requirement:** It must explain the normative logic of asynchronous sanctions, where enforcers punish years later without having witnessed the original offence or suffered direct harm.
      *   **Why:** Traditional punishment requires a link between offender, victim, and enforcer; 'sleeping dog' pile-ons sever this link, risking the classification of punishment as mere venting.
      *   **Status:** **Camp-Specific (CS)**. Retributivists will find this unsatisfiable; consequentialists may accept it as deterrent signalling.

  4.  **The Distinction from Boycott and Shunning**
      *   **Requirement:** It must distinguish punitive imposition from the withdrawal of association (boycott/shunning), where the harm is a byproduct of free association rather than an intended penalty.
      *   **Why:** 'Just consequences' defences rely on this distinction; a punishment theory must prove the harm is *intended* as a penalty, not just an accepted side-effect of moral distancing.
      *   **Status:** **NN**. Collapsing this distinction renders all negative social feedback punitive, diluting the term to uselessness.

  5.  **The Quasi-State Acknowledgement**
      *   **Requirement:** It must account for the role of platforms (Twitter, PayPal) acting as state-adjacent infrastructure, wielding monopoly power over speech and commerce without state oversight.
      *   **Why:** Purely peer-to-peer models fail to explain deplatforming; the infrastructure itself acts as the jailer, creating carceral effects without physical walls.
      *   **Status:** **NN**. Ignoring platform architecture ignores the mechanism of confinement.

  6.  **The Due Process Paradox**
      *   **Requirement:** It must reconcile the absence of formal procedure with the target's experience of definitive judgement and sentencing.
      *   **Why:** Punishment traditionally implies legitimacy via procedure; here, the lack of process is a feature, not a bug, yet the outcome feels legally binding to the target.
      *   **Status:** **NN**. A theory claiming this is legitimate punishment must explain how legitimacy is generated socially rather than procedurally.

  7.  **The Denial of Punitive Intent**
      *   **Requirement:** It must explain why enforcers consistently deny administering punishment, framing actions as 'accountability' or 'consequences'.
      *   **Why:** If agents deny the punitive label, the theory must locate the punitive character in the *effect* or the *structure* rather than the stated *intent*.
      *   **Status:** **CS**. Retributive theories struggle here; sociological theories accommodate it as ideological masking.

  **Joint Unsatisfiability Check**

  There is a hard tension between Desideratum 1 (Agency Requirement) and Desideratum 6 (Due Process Paradox) if one holds a legalist definition of punishment. If punishment *necessarily* requires legitimate authority derived from due process (a common philosophical stance), then treating cancel culture as genuine punishment is jointly unsatisfiable with the observation that no such process exists. However, if one adopts a sociological definition where power alone constitutes authority, the set is satisfiable. The unsatisfiability arises only if one insists on normative legitimacy alongside descriptive punitive force; you cannot have 'just punishment' without process, but you can have 'punishment' without justice.

  **Scoring the Usual Suspects**

  *   **Retributive Theory:** **Poor.** Fails the Temporal Coherence Clause and Asymmetry Condition. It cannot explain why strangers feel entitled to punish years later without being victims, nor does it account for the lack of proportionality inherent in mob dynamics. It struggles with the Denial of Punitive Intent, as retribution requires admitted moral balancing.
  *   **Deterrent Theory:** **Moderate.** Handles the Public Figure case well (signalling to others) but fails the Private Person case (dogpiling a nobody deters no one). It sidesteps the Due Process Paradox by focusing on outcomes rather than legitimacy, but struggles to explain the emotional intensity of enforcers, which exceeds cold utility calculation.
  *   **Expressive/Social-Cohesion Theory:** **Strong.** Best fits the Distinction from Boycott and the Denial of Punitive Intent. It frames sanction as boundary-marking rather than penalty, which aligns with enforcer rhetoric. However, it risks dissolving the 'punishment' category entirely into 'ritual', potentially failing the Agency Requirement by treating individuals as mere vessels for social norms.
  *   **Disciplinary/Power-Knowledge (Foucaultdian):** **Very Strong.** Scores highest on the Quasi-State Acknowledgement and Carceral Experience. It treats the distributed network as the agent and the internalisation of shame as the confinement, bypassing the need for physical walls or formal process. Its weakness lies in the Asymmetry Condition; it sometimes overlooks the specific material ruin of the target in favour of analysing the abstract operation of power.

  In sum, only a disciplinary or heavily sociological framework can satisfy the Non-Negotiable criteria without contradicting the observed lack of due process, though this comes at the cost of abandoning traditional legalist definitions of punishment.
