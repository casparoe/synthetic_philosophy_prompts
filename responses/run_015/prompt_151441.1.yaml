answer: |-
  This is a classic move in moral philosophy, usually tracing back to Kant, but you are right to be suspicious. The slogan "moral worth is in the will, not in the deed" is a compression of at least three distinct claims about the relationship between motivation, action, and value.

  In your seminar, the peer used the slogan to drive a wedge between **Moral Rightness** (the act of saving lives is good) and **Moral Worth** (the agent is praiseworthy). Effective Altruism (EA) typically argues for Rightness (maximize good outcomes). The slogan argues for Worth (praise the motive).

  Here is the disambiguation menu, mapped onto your three-layer framework (Operative, Normative, Structural), with verdicts and an analysis of the deviant causal chain case.

  ### The Menu of Readings

  #### 1. The Luck Insulation Claim
  *   **The Claim:** Moral worth is resistant to factors outside the agent's control. If I intend to save a life but fail due to bad luck, I retain moral worth. If I succeed due to good luck, I gain no extra worth.
  *   **Framework Alignment:**
      *   *Operative:* Must be present (the intention).
      *   *Normative:* Irrelevant to worth (only relevant to rightness).
      *   *Structural:* Requires the will to be robust against contingency.
  *   **Verdict:** **Defensible.** This is the strongest part of the slogan. It protects moral assessment from "moral luck." Most philosophers agree you can be praiseworthy for a failed attempt if the will was good.
  *   **Seminar Relevance:** Low. This doesn't help the peer dismiss EA. The EA donor *succeeded* in saving lives; luck isn't the issue, motive is.

  #### 2. The Motive Exclusivity Claim
  *   **The Claim:** Only one specific type of operative reason confers moral worth (e.g., "duty," "concern for others," or "the right-making features"). Any other motive (tax breaks, status, sympathy) renders the act morally neutral, even if the outcome is great.
  *   **Framework Alignment:**
      *   *Operative:* Must be a specifically *moral* motive.
      *   *Normative:* Must exist (the act must be right).
      *   *Structural:* The operative reason must *be* the normative reason.
  *   **Verdict:** **Defensible but Controversial.** This is the strict Kantian reading. It is controversial because it seems to exclude "hybrid motives" (e.g., saving a life because you love the person *and* it's right). Many argue that acting from love or sympathy should also carry moral worth.
  *   **Seminar Relevance:** **High.** This is almost certainly what your peer was using. They argued that because the EA donor's *operative reason* (tax/status) did not match the *normative reason* (saving lives), the moral worth is zero.

  #### 3. The Deed-Independence Claim
  *   **The Claim:** The physical description of the action is irrelevant to moral worth. A good will is valuable even if it produces no action, or if the action is physically identical to a bad one.
  *   **Framework Alignment:**
      *   *Operative:* The only thing that matters.
      *   *Normative:* Irrelevant.
      *   *Structural:* Irrelevant.
  *   **Verdict:** **False.** You cannot have moral worth for doing nothing, nor for doing something evil with good intentions (e.g., trying to save a tribe by sacrificing a child). The "deed" must at least be *permissible* for the will to be praiseworthy. The slogan is misleading here; the deed matters as a constraint, even if it doesn't generate the worth.
  *   **Seminar Relevance:** Medium. The peer implies the donation (the deed) is morally inert without the right will. This is an overstatement; the deed still has value (lives saved), just not *credit* for the agent.

  #### 4. The Structural Alignment Claim (The "Because" Claim)
  *   **The Claim:** Moral worth requires that you do the right thing *because* it is the right thing (or because of the features that make it right). It is not enough that your operative reason *aligns* with the normative reason; the normative reason must explain the operative reason.
  *   **Framework Alignment:**
      *   *Operative:* Must be caused by the Normative.
      *   *Normative:* Must cause the Operative.
      *   *Structural:* The psychology must track the moral structure explicitly.
  *   **Verdict:** **Defensible.** This is the standard contemporary view on moral worth (often associated with the "right reasons" view). It allows for more nuance than Motive Exclusivity. For example, if you donate because "suffering is bad," that tracks the normative reason, even if you don't use the word "duty."
  *   **Seminar Relevance:** **High.** This is the sophisticated version of the peer's argument. The EA donor's psychology was not aligned with the moral structure of the act (reducing suffering); it was aligned with a financial structure (tax avoidance).

  ---

  ### Application to the EA Case

  Your seminar peer was likely combining **Reading 2 (Motive Exclusivity)** and **Reading 4 (Structural Alignment)**.

  *   **The Peer's Logic:**
      1.  **Normative Reason:** Reduce suffering (Malaria nets).
      2.  **Operative Reason:** Reduce taxes / Gain status.
      3.  **Judgment:** Since Operative ≠ Normative, there is no Structural Alignment.
      4.  **Conclusion:** No Moral Worth.

  *   **The EA Counter-Argument (using your framework):**
      The EA defender might argue that the **Structural Reason** is actually aligned, even if the **Operative Reason** feels selfish. If the agent *would not* have donated without the tax break, but the tax break allowed them to unlock a large sum that *actually* saved lives, is there a derivative worth?
      *   *Verdict:* Under the slogan, **No.** The slogan demands the *primary* mover be the moral reason. If the tax break is the "but-for" cause of the action, the will is oriented toward tax, not lives. The slogan treats the lives saved as a side effect, not the object of the will.

  ### Deviant Causal Chains: The Drowning Robber

  **Case:** I jump into a lake to steal a wallet from a drowning man. In the process of grabbing the wallet, I accidentally pull him to safety.
  **Slogan Verdict:** **No Moral Worth.**

  Here is how the slogan handles this using your layers:

  1.  **Operative Reason:** To steal (Immoral).
  2.  **Normative Reason:** To save a life (Moral).
  3.  **Structural Reason:** **Misaligned.** The psychology (greed) is opposed to the moral structure (preservation of life).

  **Why the slogan works here:**
  The slogan "in the will, not in the deed" correctly identifies that the *deed* (saving a life) happened, but the *will* (stealing) did not intend that deed *as a moral good*.

  *   **Distinction from the EA Case:**
      *   **Robber:** The good outcome was **accidental**. The will was actively hostile to the moral good (he didn't care if the man lived or died, only about the wallet).
      *   **EA Donor:** The good outcome was **intended**, but as a *means* to a selfish end, not as an *end* in itself.

  Both fail the slogan's test for moral worth, but the Robber fails harder. The EA donor at least *willed* the saving of lives (as a sub-routine); the Robber did not will the saving of lives at all. However, under the strict "Motive Exclusivity" reading your peer used, both are equally devoid of moral worth because in neither case was the *normative reason* the *operative reason*.

  ### Summary for Your Paper

  If you are writing a response paper, your critical leverage point is **Reading 4 (Structural Alignment)**.

  The slogan is not false, but it is **category-restrictive**. It defines "Moral Worth" narrowly as "Praise for Moral Character." It explicitly excludes "Praise for Good Outcomes."
  *   **The Trap:** Your peer is using the slogan to imply the EA donation is *morally irrelevant*.
  *   **The Correction:** You can grant the slogan (the donor gets no *character praise*) while rejecting the implication (the donation is still *morally required* and *objectively good*).

  The slogan demands that for **Moral Worth**, the **Operative Reason** must be a token of the **Normative Reason**. In the EA case, it is not. In the Robber case, it is not. In both, the **Structural Reason** is broken. The slogan holds up, but only if you accept that "Moral Worth" is a very specific, narrow slice of moral value that does not exhaust the importance of the "Deed."
