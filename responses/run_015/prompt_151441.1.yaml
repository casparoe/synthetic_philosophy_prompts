  hey, im in a philosophy of action / moral worth course and in teh seminar yesterday someone used 'moral worth is in the will, not in the deed' to dismiss an argument about effective altruism — basically that donating millions for malaria nets doesnt count for moral credit if you're mainly chasing tax breaks or status. i feel like teh slogan is hiding like five different claims but i cant seperate them.

