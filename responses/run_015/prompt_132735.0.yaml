answer: |-
  You have identified a very real and frustrating rhetorical move. It is distinct enough that it deserves a specific label, even if one doesn't currently exist in the standard lexicon of fallacies.

  There is no single established term for this exact pattern, though it overlaps with a few existing concepts. The closest existing frameworks are **System Justification Theory** (psychology), the **Naturalistic Fallacy** (logic), and Albert Hirschman's **Perversity Thesis** (rhetoric of reaction). However, none of these quite capture the specific *co-optive* nature of what you're describing: using the critic's own diagnosis to justify the system the critic opposes.

  Since you care more about the carving than the label, I will propose a term that captures the structural error, and then define its boundaries against the concepts you mentioned.

  ### The Proposed Concept: **Reified Adaptation**

  I suggest calling this the **Reified Adaptation Fallacy** (or simply **Adaptation Reification**).

  **The Core Mechanism:**
  1.  **Diagnosis:** Acknowledge a psychological symptom caused by a specific historical system (e.g., "Humans are anxious without work").
  2.  **Erasure:** Ignore the *causal history* of that symptom (e.g., "...because they were conditioned by 200 years of industrial scarcity").
  3.  **Reification:** Treat the symptom as a permanent, natural feature of human biology or structure (e.g., "...therefore humans *need* work to be stable").
  4.  **Justification:** Use that "permanent feature" to justify maintaining the very system that caused the symptom.

  In your Keynes example: The "inability to handle leisure" is a *transitional scar* from the age of scarcity. The argument you're noticing treats that scar as a *skeletal structure* that requires the cage of labor to remain intact.

  ### Why Existing Terms Don't Quite Fit

  To sharpen the carving, here is how **Reified Adaptation** differs from the near-misses you considered:

  **1. vs. The Naturalistic Fallacy**
  *   **Naturalistic Fallacy:** Deriving an "ought" from an "is." (e.g., "People *are* competitive, so they *ought* to compete.")
  *   **Reified Adaptation:** This is a *subset* of the naturalistic fallacy, but more specific. It doesn't just say "this is natural." It says "this adaptation to an *unnatural* condition is now natural." It relies on **historical amnesia**. It ignores that the "is" was manufactured by the status quo.

  **2. vs. Motte-and-Bailey**
  *   **Motte-and-Bailey:** Swapping a controversial claim (Bailey) for a defensible one (Motte) when challenged.
  *   **Reified Adaptation:** There is no retreat. The arguer stays in the same policy position (we must work) but swaps the *justification*. They don't retreat to a safe claim; they advance a psychological claim that *sounds* like a concession to the critic ("Keynes was right about the pain") but functions as a trap ("...so we can't leave the system").

  **3. vs. System Justification Theory**
  *   **System Justification:** The psychological *tendency* to defend the status quo.
  *   **Reified Adaptation:** The *rhetorical tool* used to enact that tendency. System justification is the engine; Reified Adaptation is the steering mechanism. One describes the bias, the other describes the argument structure.

  **4. vs. General Pessimism**
  *   **Pessimism:** "Humans are flawed, so utopia is impossible."
  *   **Reified Adaptation:** "Humans are flawed *in a specific way that this system created*, so this system is necessary." It is circular. It argues that the disease (work-obsession) is the only cure for the disease.

  ### The Boundaries of the Carving

  To use this concept effectively, the argument must meet three criteria:

  1.  **Acknowledgement of the Critique:** The arguer must accept the critic's premise (e.g., "Yes, leisure is psychologically difficult"). If they deny the premise, it's just a standard disagreement.
  2.  **Pathologizing the Transition:** The arguer must frame the difficulty as a permanent human limitation rather than a transitional cultural lag. (Keynes argued we need 100 years to culturally adapt; the arguer claims we *cannot* adapt).
  3.  **Policy Inversion:** The conclusion must be the inverse of the critic's intent. The critic says "This pain means we need to change our culture." The arguer says "This pain means we need to keep our economy."

  ### Why This Label Works

  Calling this **Reified Adaptation** highlights the specific error: **Reification** (making something abstract or social appear concrete and natural) of an **Adaptation** (a temporary adjustment to environment).

  It allows you to say: *"You aren't being realistic; you are committing a Reified Adaptation. You are taking a psychological scar from the age of scarcity and treating it like a bone structure."*

  This distinguishes you from the optimist who says "It's easy!" and the pessimist who says "It's impossible." It positions you as the historical materialist who says "It is difficult *because of history*, not because of nature, and therefore it is solvable."

  ### Summary
  There is no standard dictionary term for this. **Reified Adaptation** (or **The Symptom-as-Structure Fallacy**) captures the move of taking a transitional wound and using it as a warrant for the knife that caused it. It differs from a Motte-and-Bailey because it doesn't retreat; it co-opts. It differs from pessimism because it ignores the causality of the pessimism. It is the argumentative equivalent of keeping a cast on a healed arm because the muscles have atrophied.
