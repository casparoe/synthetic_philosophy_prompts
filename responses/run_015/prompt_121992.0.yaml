      *   Ensure "Minutes" adds up to 50.
      *   Make sure the "Refuse" section in JSON is specific.
      *   Make sure "Case Fragility" explains *why* the tweak breaks it (e.g., lowering stakes makes dominance trivial).

  8.  **Final Check on the "Two Predictor" nuance:**
      *   The prompt says Alpha is 55% on trained people. This is *worse than chance*. This is a very specific detail. If a student knows decision theory, Alpha essentially flips a coin (biased slightly to 2-box maybe?). Beta is 80%.
      *   Does this complicate the EV calculation?
      *   If I know DT, Alpha predicts wrong 45% of the time. Beta predicts right 80% of the time.
