      *   *Stage 5: The Clash.* Highlight the conflict. Why is this hard?
      *   *Stage 6: The Free Willist & The Meta.* Address the specific student objections (free will, last instant).
      *   *Stage 7: Diagnostic.* The final question.

      *Timing:* 50 mins is tight.
