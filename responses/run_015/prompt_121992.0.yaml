      *   40-50: Synthesis & Diagnostic.

      *Misconceptions to address:*
      1.  "Boxes are full, so take both." (Dominance)
      2.  "This is just determinism." (Fatalism)
      3.  "Predictor sees the future." (Backwards causation)
      4.  "My choice causes the prediction." (Confusing correlation/causation)
      5.  "I'll decide at the last instant." (Randomization/Precommitment)

      *Refusals:* Don't solve it. Don't name Causal vs. Evidential Decision Theory yet. Don't get into quantum mechanics or theology.

      *Fragility:* Stakes ratio (1000:1 is key). Accuracy (needs to be high enough to outweigh the $1k). Single predictor vs. double (double reduces "magic" feeling).

