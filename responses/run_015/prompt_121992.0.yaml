  2.  **Deconstruct the Case:**
      *   *Standard Newcomb:* One predictor, high accuracy. Tension between Dominance (2-box) and Expected Utility (1-box).
      *   *User's Variant:* Two predictors (Alpha & Beta). Alpha watches a clip (psychological profiling?), Beta checks records (historical data?).
      *   *Why this variant?* It complicates the "magic" aspect. Alpha's accuracy drops if you know the theory (meta-game). Beta is stable but lower accuracy. This forces students to think about *evidence* vs. *causation* without relying on the "oracle" trope.
      *   *Potential Issue:* Two predictors might confuse the payout structure. Usually, Newcomb has one box (opaque) + one box (clear). Who fills the boxes? The prompt says "Boxes are filled before you're called in." It implies the standard setup (Opaque has $1M or $0, Clear has $1k) but the prediction mechanism is split. I need to ensure the payout structure remains standard Newcomb (One-box = $1M, Two-box = $1k + maybe $0 in opaque) otherwise the dominance argument vanishes. I will assume standard payout ($1M vs $1k) but the *prediction condition* is the complex part. Actually, reading closely: "Two predictors... Boxes are filled before you're called in." It doesn't explicitly say how the predictors interact to fill the box. I need to clarify in the plan that the *condition* for the million is based on the predictors' consensus or a specific rule. To keep it simple for 50 mins, I should probably treat them as a combined reliability metric or specify that *if* they predict 1-box, money is in. Let's assume standard Newcomb payout logic but the *mechanism* of prediction is the twist to avoid "magic eye" objections.
      *   *Correction:* If I make it too complex, they won't grasp the dilemma. The core tension must remain: Evidence (1-box wins) vs. Causation/Control (2-box wins). The "Two Predictors" aspect is designed to stop the "It's just magic/determinism" objection by making it empirical/psychological.
      *   *Fragility:* If the opaque box is too small ($100 vs $10), dominance wins easily. If accuracy is too low (51%), evidence weakens. If accuracy is 100%, it feels like determinism/fate.

