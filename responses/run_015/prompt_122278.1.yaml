  # JOINT STATEMENT ON THE AXIOLOGY OF SUFFERING AND POPULATION ETHICS

  **Preface**
  The undersigned parties, representing the Axiological Negative Utilitarian (ANU) position and the Suffering-Focused Consequentialist (SFC) position, submit this document to clarify the structural overlaps and divergences in our respective ethical frameworks. This statement distinguishes settled premises from contested axioms, aiming to isolate the specific theoretical and empirical conditions under which our policy recommendations converge or diverge. We affirm that while our practical priorities regarding suffering reduction are largely aligned, our underlying justifications and boundary conditions remain distinct.

  ### I. AGREED CLAIMS

  1.  **Rejection of Linear Aggregation:** Both parties agree that standard additive aggregation models, which treat units of suffering and units of well-being as symmetrically interchangeable, are morally inadequate. We agree that the formal structure of moral evaluation must prioritize suffering. We further agree that this prioritization is best modeled either through a **lexical ordering** (where severe suffering cannot be outweighed by any quantity of well-being) or a **steep convex weighting function** (where the marginal disvalue of suffering increases rapidly relative to the marginal value of well-being). While we disagree on which mathematical instantiation is correct, we agree that one of these non-linear, suffering-dominant structures is required.

  2.  **Future Persons and Identity-Affecting Policies:** Regarding policies that determine which specific individuals will exist in the future (often described as the non-identity problem), we agree that the moral status of a future life is not negated by the fact that the policy causing its existence is also the condition for its possibility. We concur that if a policy results in the existence of persons who will undergo severe suffering, that suffering constitutes a moral harm that demands prevention, even if the alternative is that those specific persons would never have existed. We reject the claim that existence itself, when characterized by net suffering, is morally neutral simply because there is no prior subject to be harmed.

  3.  **Scope of Moral Concern (Wild and Artificial Sentience):** We agree that the locus of moral value is the capacity for valenced experience, not species membership or origin. Consequently, we assign high moral priority to the reduction of suffering in wild animals, rejecting the notion that "natural" suffering is morally permissible by default. Furthermore, we agree that the potential creation of artificial sentient systems constitutes a critical moral risk domain; the creation of artificial capacity for suffering without guaranteed mechanisms for its mitigation is morally impermissible under both frameworks.

  4.  **Empirical Defeaters:** We agree that our weighting structures are contingent on empirical facts about welfare. Should rigorous measurement demonstrate that what is colloquially termed "happiness" is phenomenologically identical to the "absence of suffering," the practical divergence between our views would collapse. We further agree that if evidence suggests that severe suffering can be reliably transformed into neutral states without the loss of agency or cognitive function, this would update our confidence in suffering-reduction interventions.

  ### II. DISAGREEMENTS TABLE

  | Issue | Axiological Negative Utilitarian (ANU) Position | Suffering-Focused Consequentialist (SFC) Position |
  | :--- | :--- | :--- |
  | **Nature of Asymmetry** | **Axiological:** Well-being (happiness/pleasure) possesses no intrinsic positive value. The good is defined solely as the absence of the bad (suffering). | **Weighting:** Well-being possesses intrinsic positive value, but suffering possesses significantly greater intrinsic disvalue. The asymmetry is one of magnitude, not kind. |
  | **Offsetting Scenarios** | **Impossible:** No quantity of well-being can morally offset or justify the imposition of severe suffering. The priority is absolute. | **Theoretically Possible:** While practically unreachable in most real-world contexts, there exists a theoretical threshold where sufficient well-being could offset suffering, governed by the convex weighting function. |
  | **Moral Risk Asymmetry** | **Strict:** Errors in suffering-reduction policy (false negatives) are catastrophic moral failures. Errors in well-being creation (false positives) are morally neutral. | **Graded:** Errors in suffering-reduction are significantly worse than errors in well-being creation, but failures to create well-being are still moral losses, not neutrals. |

  ### III. CRUXES AND ADVANCE PREDICTIONS

  We identify two primary cruxes where theoretical divergence leads to distinguishable practical outcomes. For each, we specify a concrete case and our respective advance predictions.

  **Crux 1: Suffering-Dominance Under Moral Uncertainty**
  *Theoretical Question:* Does moral uncertainty regarding the correct weighting function (lexical vs. convex) compel the SFC to adopt the ANU's lexical constraints as a precautionary principle?
  *Concrete Case:* **The High-Stakes Lottery.** A policy offers a 99% chance of creating a population with extremely high well-being and no suffering, but a 1% chance of creating a population subjected to extreme, unremitting torture.
  *   **ANU Prediction:** The policy must be rejected immediately. The 1% risk of severe suffering carries infinite or near-infinite negative weight that cannot be traded against the 99% gain.
  *   **SFC Prediction:** The policy requires calculation. If the convex weight of the potential well-being is sufficiently high, it may mathematically outweigh the expected disvalue of the 1% risk. The SFC reserves the right to accept the risk if the expected value (under convex weighting) is positive.

  **Crux 2: Adaptive Preferences and Welfare Comparisons**
  *Theoretical Question:* Do adaptive preferences formed within suffering-reduction interventions undermine the reliability of welfare comparisons required for convex weighting?
  *Concrete Case:* **The Adapted Laborer.** An intervention improves objective material conditions for a group (reducing physical stressors), but self-reported well-being remains static because the group's expectations adjusted to the prior hardship.
  *   **ANU Prediction:** The intervention is successful if objective suffering metrics (physiological stress, pain markers) decrease, regardless of reported well-being. The absence of suffering is the metric, not the presence of reported happiness.
  *   **SFC Prediction:** The intervention's value is ambiguous. If reported well-being does not increase, the convex weighting function cannot register a gain to offset the costs of intervention. The SFC requires evidence of positive welfare gain to justify resource allocation, whereas the ANU requires only evidence of suffering reduction.

  ### IV. ASSESSMENT OF VERBAL VS. SUBSTANTIVE DISPUTE

  **1. The Zero-Point Controversy**
  A portion of our dispute appears verbal regarding the description of non-suffering states. The ANU describes a state of neutral welfare as "not bad," while the SFC describes it as "good" (relative to suffering) but low in value. If "good" is defined strictly as "that which we have reason to promote," and both parties agree we have significantly less reason to promote neutral states than to prevent suffering, this distinction may be terminological. However, it becomes substantive when calculating trade-offs: if "good" has any positive weight, it enters the aggregation function; if "not bad" has zero weight, it does not.

  **2. Formal Weighting and Practical Convergence**
  Settling the formal-weighting question (lexical vs. convex) would not fully dissolve the practical disagreement. Even if both parties adopted a steep convex function, the ANU would argue for a threshold approaching infinity (effectively lexical), while the SFC would argue for a finite but high coefficient. In high-stakes population ethics—specifically regarding the creation of new lives—the ANU will consistently recommend restraint (anti-natalist leanings in high-risk contexts), while the SFC may recommend expansion if the expected convex value is positive. Therefore, the dispute is not merely verbal; it reflects a fundamental divergence in risk tolerance and the valuation of existence itself.

  **3. Consensus Status**
  We note that neither the claim that suffering carries lexical priority nor the claim that suffering carries merely steep convex weight represents the consensus position in general population ethics or welfare evaluation. Both positions remain minority views relative to classical totalist or prioritarian frameworks. This document serves to delineate the internal structure of suffering-focused ethics, not to assert its dominance over the broader field.

  ***

  **Signed,**

  *Representative, Axiological Negative Utilitarian Framework*

  *Representative, Suffering-Focused Consequentialist Framework*
