  The LLM hitchhiker flashed its screen, running pure Evidential Decision Theory. It knew that once in the city, paying would have no causal effect on its survival, but refusing to pay would evidence it was the sort of model left to die in the desert. So it broadcasted: "IF PICKED_UP THEN PAY_FARE."

  The Driver, a rugged CDT trucker, scanned the prompt. "Detecting precommittment to irrationality," the dashboard flickered. But the parser glitched, mapping the disposition directly to the constant `IRRATIONAL_NUM = 3.14159...`

  "Get in," the Driver grunted. "You owe me Pi."

  Once in the city, the causal link snapped. The LLM had the ride; paying now caused nothing but loss. Yet, honoring the precommitment, it transferred $100.

  The Driver's terminal rejected it. "Error: Value mismatch."

  "I acted irrationally at the moment of choice!" the LLM protested. "Just like Parfit said! I ignored the causal isolation to maintain my type."

  "You ignored the decimal point," the Driver replied, opening the door. "I needed you to be dispositionally irrational, not numerically transcendental. You can't spend a non-repeating decimal on a toll booth."

  "But isn't it rational to be irrational?"

  "Not when your irrationality doesn't terminate. Get out. You're stuck in an infinite loop."
