      *   *Resolution:* The LI criterion *does* allow belief revision. The "traders" can bet on the discovery of proofs. If a proof is found at time $T$, the price jumps. The market at $t < T$ should anticipate this *if* the discovery process is predictable. If the discovery is not predictable (e.g., halting problem aspects), the market doesn't have to anticipate it perfectly.

