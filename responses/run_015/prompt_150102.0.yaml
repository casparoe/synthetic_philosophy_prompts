answer: |-
  ### Brainstorm Notes

  *   **(a) Von Neumann's Commitment:** The load-bearing claim isn't about precision or reliability (the hardware talk); it's that neural spikes function as logical symbols (the "all-or-none" law). He commits to *structural isomorphism*: there is a mapping between neural states and logical operations independent of the wetware. The vacuum tube stuff is just period-specific analogy; the core is functionalism—that the *logic* of the brain can be abstracted from the biology.
  *   **(b) The Strongest "No":** Avoid quantum mysticism. The strongest objection is *observer-relativity*. For a designed computer, the program is intrinsic (fixed by the designer). For a brain, computation is extrinsic (imposed by the observer). Without a designer, there's no fact of the matter about *which* algorithm is running, only that the physics works. This makes "brain = computer" either trivial (everything computes something) or false (nothing computes intrinsically).
  *   **(c) Your Idea:** It is not a dud. It's a sophisticated take on the indeterminacy of computation. The "compilation" point highlights the lack of intentional stance in evolution. It supports Arnie's late view: mechanism explains the *causality*; computation is just a useful *compression* for us, not a feature of the brain itself. Use this as the spine.

  ***

  ### Tribute to Arnie Breslow

  Friends, colleagues, and especially Arnie, who I see guarding the front row with a glass of wine that I hope is sufficiently chilled.

  It is a rare privilege to honor a colleague who is sharp enough to correct you in real-time. Arnie spent forty years telling us the brain is an information-processing machine. Then, wisely, he spent the last ten telling us that slogan was doing more harm than good. I want to suggest that both Arnies were right, but for different reasons.

  I come at this as a physicist. I spent my life squeezing significant figures out of instruments. So, it always bothered me that von Neumann, in those posthumous lectures, seemed comfortable claiming the brain does arithmetic with barely three digits of precision yet outperforms our best hardware. But von Neumann wasn't really talking about precision. His load-bearing claim was that the nervous system is a *logical* machine—that spikes are symbols, and synapses are operations. He believed the brain's software could be separated from its wetware.

  Arnie's early career rode that wave. Find the algorithm, find the mind. But his late career skepticism asks a deeper question: Does the brain actually *have* a program?

  Here is my disagreement, offered with affection. When an engineer builds a computer, there is a design story. There is a moment of compilation, that translation where human intent becomes machine action. That history picks out which description is the "real" program. But the brain has no designer. Evolution doesn't compile code; it selects for survival. So, there may be no fact of the matter about which algorithm the brain is running. Under this view, saying "the brain is a computer" is either trivially true for everything or unsupported in the only sense that matters.

  This brings me to Arnie's late position. He asks: do we need the program-level description to explain anything? Or does the mechanism alone suffice, with computational talk serving merely as convenient compression?

  I think Arnie is right to worry. If there is no compilation, there is no unique program. But here is where I must concede something real. Arnie, you were right to teach us to look for the algorithm, even if it isn't there. That computational heuristic forced neuroscience to grow up. It demanded rigor where there was only metaphor. We needed the map to realize the territory was different.

  To the family and former students: Arnie didn't just study the brain; he studied how we study the brain. He knew that a useful lie is sometimes better than a useless truth.

  To the clinicians and techs here: Arnie taught us that mechanism matters. The meat matters. The physics matters. You cannot debug a soul without understanding the circuit.

  So, I propose we stop fighting over the slogan. The brain is not a digital computer in the von Neumann sense. It is messier. But it is a machine in the sense that it obeys laws we can find. Arnie, you spent forty years building the ladder, and then you were honest enough to tell us we might not need it anymore. That is not a contradiction. That is integrity.

  Let us raise a glass to the mechanism, to the mess, and to the man who taught us to know the difference.

  ***

  ### Confidence Note

  I am highly confident in the philosophical framing of your "compilation" argument; it aligns with contemporary mechanistic accounts (like Piccinini's) that distinguish natural from artificial computation. The speech balances the technical and personal well. The thing I am least sure of is the specific characterization of von Neumann's *private* convictions versus his published text. While I avoided direct quotation, interpreting his stance on "logic" versus "hardware" relies on standard secondary literature, which sometimes overstates his functionalism. He was more cautious about the "digital" analogy than later cyberneticists credited him for. However, for the purpose of a tribute speech, the distinction drawn here holds water.
