  You are a professional philosopher of mind who also knows the history of computing properly — the sort of person who could teach a seminar on mechanism and computation and then walk down the hall and explain it to a room of retired chemists without dumbing anything down. Please think carefully before you write: I want you to brainstorm first, in a few short bullet notes to me, on (a) what von Neumann is actually committing himself to when he says the nervous system is a computing machine — separate the load-bearing claim from the stuff that's really just mid-century hardware talk about vacuum tubes and reliability; (b) what the strongest version of "no it isn't" looks like if you're not allowed anywhere near Penrose and microtubules, and if you can only reach for the Chinese Room after you've earned it; and (c) whether my own half-baked idea below is a dud. Then write the actual thing.

  The occassion: my old friend Arnie Breslow is 82 in March, and his department is throwing him a one-day symposium in his honor, and I've been asked to give the after-dinner tribute. Arnie spent forty-odd years as a neurophysiologist arguing that the brain is an information-processing machine and that the only honest way to do neuroscience is to find the algorithm; late in his career he moved to something like "it's not a digital computer, it's messier and more interesting than that, and the slogan has done more harm than good." Here's the constraint that matters: he is alive, he is sharp, he will be in the front row with a glass of wine, and he gets twenty minutes to reply immediately after me. So I can't flatter him by caricaturing his position, and I can't play gotcha at his own party, and I definitely can't do that reverent Nature-obituary voice. I want to state our disagreement honestly and have it land as affection. The room is about half computational neuroscientists and philosophers of mind who will catch every single reference, and half his family, his ex-students who are now clinicians, and two old lab techs who flew in from Buffalo and who will catch none of them — so anything technical needs a one-clause gloss that doesn't insult the people who know it.

  My own angle, which I want you to use or tell me to drop: I was an experimental physicist, precision measurement, and I spent most of my career trying to squeeze one more significant figure out of an instrument. So it genuinely gets under my skin that von Neumann, in that little book about the computer and the brain that came out after he died from lectures he never lived to give, seems happy to say the brain does arithmetic with something like two or three digits of precision and still outperforms everything we've built. And here's where I've got to in my reading (I audit a philosophy course at the university, badly; my grandson is doing a CS PhD and rolls his eyes at me constantly): with an artifact somebody designed, there's a design story and a compilation event, and that's what picks out which description of the thing is "the program" it's running. With an evolved organ there's no designer and nothing gets compiled, so maybe there's just no fact of the matter about which of the many behaviourally equivalent descriptions is the one the brain is executing. Which would make "the brain is a computer" either trivially true under some description or unsupported in the only sense in which anyone cares. And Arnie's late position, as I understand him, is really a follow-up question: does neuroscience actually need a program-level description in order to explain anything, or does it explain by mechanism alone with the computational talk as a convenient compression? I'd like that question to be the spine of the speech rather than the slogan fight, but say so in your notes if you think it's a dud or if I've mangled it. About 850 words, six or seven minutes, warm, a joke or two that isn't about his handwriting, and one place where I concede something real. Please don't put words in von Neumann's mouth — paraphrase rather than quote, since I can't check a quotation and Arnie could.

  And at the end, after the speech, give me a short note (150 words or so) on how confident you are in what you've claimed, and single out the one thing you're least sure of — my guess is it's either what von Neumann actually held or whether the "nothing gets compiled" point is as lethal as I think it is, but you tell me which.
