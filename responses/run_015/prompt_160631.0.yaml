answer: |-
  Subject: Re: Distinction in social construction types

  Dear colleague,

  This is a remarkably sharp observation, and you have put your finger on a distinction that often gets blurred in social ontology literature. You are asking whether there is a name for the difference between social kinds that dissolve when their constructedness is revealed and those that persist or even rely on that transparency. The short answer is that there is no single canonical term that captures this exact dichotomy, but there are several adjacent concepts that, when stitched together, give you the vocabulary you need. I suspect the most precise way to handle this in your chapter is to coin a specific pairing, but to ground it in the existing work on interactive kinds, ideology, and convention.

  The nearest established concept is Ian Hacking's distinction between interactive kinds and indifferent kinds. Interactive kinds are classifications of people that change the people classified once they become aware of the classification, whereas indifferent kinds like quarks do not change when discovered. Your case of race fits the interactive model, but with a specific twist: you are describing a kind that not only changes but potentially dissolves upon the revelation of its genealogy. Money, conversely, behaves like an indifferent kind in some respects (the paper does not change) but is ontologically social. However, Hacking's framework does not fully capture the epistemic condition you are identifying, which is whether the construct requires ignorance to function. For that, you need to look toward the Marxist tradition of reification and the sociological tradition of institutional legitimation.

  In critical theory, particularly in the work of Marx and later Slavoj Žižek, there is a distinction between ideology as false consciousness and ideology as cynical reason. False consciousness requires the participant to believe the construct is natural or true; once the illusion is pierced, the power relation weakens. This matches your race example, where the category relies on the misrecognition of social history as biological destiny. Žižek contrasts this with fetishistic disavowal, summarized as I know very well, but still. This matches your money example. We know money is fiat, we know it is constructed, but we continue to use it because we know everyone else will too. Here, the construction does not require masking; it requires common knowledge. Similarly, Peter Berger and Thomas Luckmann discuss the necessity of ontological secrecy for institutions, arguing that for a social structure to feel objective and stable, its human origins must be forgotten. When those origins are remembered, the institution becomes fragile.

  So, to answer your hypothesis about the variable, it is not strictly about first-order belief versus iterated expectations, though those are the mechanisms. The deeper variable is dependence on misrecognition versus dependence on common knowledge. Your race example relies on a first-order belief that the category tracks a natural fact. Your money example relies on higher-order expectations about collective behavior. The critical difference is whether the function of the kind is undermined by the truth of its origin. If the kind claims to be discovered, revealing it as invented destroys it. If the kind claims to be stipulated, revealing it as invented confirms it.

  Since there is no single standard term for this, I recommend coining a distinction between epistemically fragile constructions and epistemically robust constructions. An epistemically fragile construction is one whose existence or power depends on participants believing it is not constructed, or at least not holding the constructionist story in view. An epistemically robust construction is one whose existence depends on collective acceptance that survives, or even requires, the knowledge that it is constructed. You might also consider the terms opaque construction and transparent construction, where opacity refers to the need to hide the social machinery and transparency refers to the machinery functioning openly as convention.

  Regarding your boundary cases, gender is a fascinating test case for this distinction because it often straddles the line. In an essentialist regime, gender operates as an epistemically fragile construct; if you convince people gender is purely performative and not rooted in nature, the essentialist category loses its grip. However, in a performative regime, gender operates as an epistemically robust construct; knowing that gender is a repeated stylization of the body does not stop the stylization, much like knowing money is fiat does not stop the transaction. The category survives unmasking because its function is not to track nature but to coordinate social behavior. Electability, as you noted, lands firmly in the robust category. It is purely a matter of iterated expectations. Telling people electability is a social construct does not change who is electable, because electability is nothing but the prediction of other people's predictions. Unmasking it simply confirms the mechanism.

  The political implication you noted is crucial. If you are dealing with an epistemically fragile kind, critique and unmasking are effective tools of dissolution. If you are dealing with an epistemically robust kind, unmasking is ineffective or even counterproductive, because the kind runs on the very transparency you are providing. In the latter case, change requires shifting the incentives or the higher-order expectations, not merely revealing the ontology. For your chapter, defining this distinction allows you to explain why some social constructions crumble under scrutiny while others harden, and it prevents the error of assuming that all social construction is vulnerable to the same kind of critique.

  I hope this helps you clarify the chapter. It is a vital distinction to make, and framing it around epistemic fragility versus robustness should give you the conceptual leverage you need.

  Best regards,

  [Your Name]
