prompt: |-
  I am a third-year undergraduate reading Philosophy, Politics and Economics, and I have been asked to deliver the opening remarks at a one-day interdisciplinary workshop on collective reasoning in democratic institutions, hosted jointly by my university’s philosophy and politics departments. The audience will be roughly thirty people: about half are academics in philosophy of science and political theory who will recognise any reference to the Condorcet jury theorem, and the other half are non-specialist guests—including family members of the retiring convener—who will not. I need a speech of about seven minutes that treats the Condorcet jury theorem not as a decorative reference but as structural scaffolding: the conditions under which collective competence improves with group size should determine which claims I can legitimately make about the workshop’s own deliberative format, and which I must explicitly withhold.

  Specifically, I want the speech to turn on a somewhat niche extension of the theorem that is not usually mentioned in introductory treatments: the problem of dimensional competence, where members of a group may be individually competent on different axes of a problem—for instance, empirical, normative, and conceptual dimensions—but where competence is neither binary nor independent across those axes. The speech should introduce this tension without requiring me to cite specific papers, and it should shape the rhetoric so that I acknowledge that the workshop’s interdisciplinary design risks violating the independence condition in precisely this multidimensional way—while also arguing that this violation is not necessarily fatal if we restructure how we pool judgments.

  Please do not include a bibliography, reading list, or citations to specific authors beyond what is common knowledge (Condorcet himself). Do not ask the audience to vote on anything, and avoid framing the idea as a simple celebration of democracy. Instead, the philosophical point should constrain what I can promise about the day’s outcomes: I should be able to say that collective wisdom is possible here, but only under conditions that the workshop’s format must actively maintain, and I should be explicit about what those conditions are and where they are likely to fail. The tone should be formal, respectful of the occasion, and accessible to the non-specialists without becoming patronising to the experts. Write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** Third-year PPE undergraduate.
      *   **Occasion:** Opening remarks at a one-day interdisciplinary workshop on "collective reasoning in democratic institutions."
      *   **Hosts:** Jointly Philosophy and Politics departments.
      *   **Context:** Honoring a retiring convener (family members present).
      *   **Audience:** ~30 people. 50% academics (philosophy of science/political theory, know Condorcet), 50% non-specialists (family, guests).
      *   **Duration:** ~7 minutes (approx. 900-1000 words spoken at a moderate pace).
      *   **Core Theme:** Condorcet Jury Theorem (CJT) as *structural scaffolding*, not just a reference.
      *   **Specific Twist:** Focus on "dimensional competence" (empirical, normative, conceptual axes) where competence isn't binary or independent.
      *   **Argument:** The workshop's interdisciplinary design risks violating CJT's independence condition, *but* this isn't fatal if we restructure judgment pooling.
      *   **Constraints:** No bibliography/citations (beyond Condorcet), no voting, no simple "democracy is great" celebration. Must constrain promises about outcomes.
      *   **Tone:** Formal, respectful, accessible to non-specialists but not patronizing to experts. British English.

  2.  **Determine the Structure:**
      *   **Welcome & Acknowledgements:** Welcome guests, acknowledge the retiring convener and family, set the scene.
      *   **The Hook (CJT Basics):** Introduce Condorcet simply for the non-specialists, but signal depth for the experts.
      *   **The Problem (Dimensional Competence):** Introduce the niche extension. Competence isn't just "right/wrong"; it's multi-axial (empirical, normative, conceptual).
      *   **The Risk (Interdependence):** Acknowledge that interdisciplinary talk creates correlation (violating independence).
      *   **The Solution/Reframing:** How the workshop format can mitigate this (structuring deliberation, not just aggregating).
      *   **Managing Expectations:** Explicitly state what the workshop can and cannot achieve based on this logic.
      *   **Conclusion:** Return to the convener, final thanks.

  3.  **Drafting - Section by Section:**

      *   *Welcome:* Needs to be warm but formal. Acknowledge the dual nature of the audience. Mention the retiring convener respectfully.
      *   *Condorcet Intro:* Keep it intuitive. "If individuals are more likely than not to be right, a majority is more likely to be right." But immediately pivot to the conditions (independence, competence > 0.5).
      *   *The Twist:* This is the hard part. How to explain "dimensional competence" without jargon? Use the PPE lens. Philosophy (conceptual/normative), Politics (institutional/empirical), Economics (modelling/empirical). Show how a person might be competent on one axis but not another.
      *   *The Interdisciplinary Risk:* If we all talk to each other, our errors become correlated. We influence each other. This breaks Condorcet's independence.
      *   *The Argument:* We aren't just voting; we are deliberating. We need to pool judgments *after* distinguishing the axes.
      *   *Expectations:* I cannot promise we will solve democracy today. I can promise we will test the conditions of collective reasoning.
      *   *Closing:* Tie back to the convener's legacy.

  4.  **Refining the Tone (British English & PPE Student Persona):**
      *   Use "programme," "honour," "centre."
      *   Avoid Americanisms.
      *   Sound like a bright third-year: confident but humble, acknowledging the weight of the room without pretending to be a professor.
      *   Ensure the non-specialists don't feel lost (explain the math conceptually) and experts don't feel bored (acknowledge the technical nuance).

  5.  **Drafting - Iteration 1 (Mental Check):**
      *   *Critique:* Is it too technical?
      *   *Fix:* Simplify the explanation of "independence." Use the analogy of shared bias.
      *   *Critique:* Is it too long?
      *   *Fix:* Keep the welcome concise. Focus time on the argument.
      *   *Critique:* Does it meet the "structural scaffolding" requirement?
      *   *Fix:* Ensure the logic of the theorem dictates the rules of the day. "Because X is true of the theorem, we must do Y today."

  6.  **Drafting - Writing the Content (incorporating specific constraints):**
      *   *Opening:* Distinguished guests, colleagues, family.
      *   *Condorcet:* 1785. The math of hope.
      *   *Dimensional Competence:* It's not just "do you know the answer?" It's "do you know the facts? The values? The definitions?"
      *   *Independence:* If we all read the same news, we aren't independent. If we all sit in the same department, we aren't independent.
      *   *The Workshop:* We are mixing disciplines. This creates correlation. But we can use it.
      *   *The Promise:* We won't find *the* answer. We will find *better* answers if we guard against groupthink.
      *   *The Convener:* Thank them for holding the space.

  7.  **Review against Constraints:**
      *   7 minutes? (Word count check: ~1000 words usually equals 7-8 mins at a measured pace).
      *   No citations? (Check: Only Condorcet mentioned).
      *   No voting? (Check: Explicitly avoided).
      *   British English? (Check: "programme," "honour," "centre").
      *   Dimensional competence focus? (Check: This is the core argument).
      *   Scaffolding? (Check: The theorem dictates the workshop rules).

  8.  **Final Polish:**
      *   Ensure the transition from the math to the social reality is smooth.
      *   Make sure the tribute to the convener feels integrated, not tacked on.
      *   Check the humility level (it's a student speaking to professors).

