answer: |-
  Distinguished guests, colleagues, and friends,

  It is a profound honour to stand before you to open this workshop on collective reasoning in democratic institutions. I am particularly conscious of the dual nature of our gathering today. We have with us leading scholars in political theory and the philosophy of science, whose work defines the boundaries of this field. But we are also joined by family members and friends of our retiring convener, to whom we owe a significant debt of gratitude. To the non-specialists among you: please know that while the language we use may sometimes be technical, the questions we ask are deeply human. To the experts: I speak as a student of this discipline, aware that I am addressing the very architects of the curriculum I have studied.

  We are here to discuss how groups think. And in this room, there is a mathematical ghost that we must acknowledge. It belongs to the Marquis de Condorcet.

  For those unfamiliar with Condorcet's Jury Theorem, the intuition is seductively simple. It suggests that if individual members of a group are more likely than not to be correct on a given question, and if they vote independently, then the probability of the majority being correct increases towards certainty as the group grows larger. It is the mathematical promise that democracy can be smarter than the individuals within it.

  However, for the specialists here, you know that this promise rests on fragile conditions. The two most critical are competence and independence. The voters must be competent—more than fifty per cent likely to be right—and their judgments must be independent of one another. If I copy your answer, or if we are both misled by the same bias, the mathematical magic dissolves. The group does not become wiser; it merely becomes louder in its error.

  Today, I wish to suggest that we treat this theorem not merely as a historical reference, but as the structural scaffolding for our own deliberations. If we take the logic of Condorcet seriously, it constrains what we can legitimately promise about the outcomes of this workshop.

  The standard presentation of the theorem assumes a binary world: a question is either true or false, and a voter is either competent or not. But the subject of this workshop—democratic institutions—is not binary. It is multidimensional. This brings us to a tension often overlooked in introductory treatments: the problem of dimensional competence.

  In this room, we possess different kinds of competence. Some of us are trained to assess empirical claims: what *is* the case? Others are trained to assess normative claims: what *ought* to be the case? And others still focus on conceptual clarity: what do we *mean* when we speak of liberty, or representation, or rationality?

  A participant might be highly competent on the empirical axis but less so on the normative one. Another might offer profound conceptual rigour but lack data. Crucially, competence on one axis does not guarantee competence on another, nor are these competences independent. If we all share the same theoretical framework, our errors on the conceptual axis will correlate. If we all rely on the same datasets, our errors on the empirical axis will correlate.

  This presents a specific risk for an interdisciplinary workshop such as ours. The very act of bringing philosophers, political scientists, and economists into one room to deliberate creates a threat to the independence condition. As we talk, we influence one another. We converge. While this sounds like consensus, from the perspective of collective reasoning, it can be a form of collapse. If we all begin to think alike by the afternoon session, we have not necessarily become more correct; we may have simply reduced our effective group size to one.

  Therefore, I must be explicit about what I can and cannot promise you today. I cannot promise that this workshop will produce a unified verdict on the state of democratic institutions. To demand such a verdict would be to violate the conditions under which collective wisdom emerges. If we force a consensus, we risk masking the multidimensional nature of our competence.

  However, I can promise that the format of today is designed to mitigate this risk. We are not here merely to aggregate pre-existing views, as in a vote. We are here to pool judgments across dimensions. The goal is not to make us independent in isolation—that would defeat the purpose of gathering—but to ensure that our interdependence does not become uniformity. We must structure our deliberation so that empirical challenges are met with empirical evidence, normative claims with ethical reasoning, and conceptual ambiguities with philosophical rigour, without allowing one dimension to colonise the others.

  This is where the violation of the independence condition might not be fatal, but rather transformative. If we can recognise *where* we are dependent—where our errors are correlated because of our shared disciplinary training—we can correct for it. We can treat our interdisciplinary differences not as obstacles to agreement, but as a mechanism to restore independence. When a political scientist challenges a philosopher's assumption, they are not merely disagreeing; they are breaking a correlation of error.

  So, as we proceed through the panels and discussions, let us hold ourselves to this standard. We should not ask, "Do we all agree?" We should ask, "Have we sufficiently distinguished the empirical, normative, and conceptual axes of this problem?" and "Have we allowed our agreement to emerge from the collision of these distinct competences, rather than from social pressure?"

  This approach requires effort. It requires us to resist the comfort of easy consensus. It acknowledges that collective wisdom is possible here, but only under conditions that we must actively maintain. It is a fragile thing. It can fail if we allow one dimension of competence to dominate the others. It can fail if we value harmony over accuracy.

  It is fitting, in this context, to acknowledge the retiring convener who has made today possible. For years, they have maintained the conditions under which this department thrives. They have understood that an academic community is not a monolith, but a collection of distinct, sometimes competing, competences that must be held together without being flattened. They have protected the independence of thought necessary for true collective reasoning, even when it was difficult.

  To their family and friends: the work we do today is built upon the environment they cultivated. It is an environment where rigorous disagreement is a form of respect, and where the complexity of a problem is honoured rather than simplified.

  In conclusion, let us proceed with humility. We are testing the limits of our own collective reasoning. We may not leave here with a single answer. But if we guard the conditions of our deliberation—if we respect the dimensions of our competence and watch for the correlations in our errors—we may leave with something more valuable: a clearer understanding of how we might think together, without thinking the same.

  Thank you.
