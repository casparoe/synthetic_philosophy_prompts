      *   *Who suffers?* Suffering exists, but no *sufferer* behind it. Like "there is dancing but no dancer." (Buddhaghosa).
      *   *Conclusion:* The argument fails because it demands an ontological anchor for ethical language that Buddhism simply doesn't use.

