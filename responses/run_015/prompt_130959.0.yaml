      *   *The "Two Truths" Explanation:* Avoid the cop-out. Don't say "it's true on one level, false on another." Say: "Ultimate truth describes the *mode of existence* (empty/dependent), Conventional truth describes the *functional reality* (suffering happens here)." Analogy: A chariot. No "chariot" apart from parts, but "bring the chariot" still works.
      *   *The Cost:* Rejecting (4) commits you to *Dependent Origination*. The "self" is a process, not a thing. "My suffering" means "suffering occurring in this causal stream."
