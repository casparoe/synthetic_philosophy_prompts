answer: |-
  ### Q&A Prep Sheet: "Moral Equality as Broken Symmetry"

  **Pre-Seminar Concession**
  *Say this in your opening remarks:* "I want to be clear upfront: I am not arguing that moral value *is* a physical quantity, nor that ethics can be reduced to thermodynamics. The physics here is strictly structural analogy—a way to visualize information flow and agency constraints—not ontological reduction. If I seem to slide between description and prescription, call me on it."
  *Why:* This disarms the "naturalistic fallacy" charge before it becomes a weapon.

  ---

  **1. The Humean Guillotine (Is-Ought)**
  *The Objection:* "With respect, you seem to be deriving a normative conclusion—the asymmetry of moral liability—from a descriptive premise about entropy and information flow. Even if unjust combatants are 'irreversible processes,' why does that make them morally liable? You can't get an 'ought' from an 'is,' even if the 'is' involves statistical mechanics."
  *The Reply:* "You're right that physics doesn't dictate morality. My claim isn't that entropy *creates* liability, but that the Newtonian symmetry Walzer relies on is descriptively false. If the underlying model of agency is wrong, the normative conclusion built on it collapses. I'm using thermodynamics to clear the ground, not to build the house."
  *Flag:* **Soft.** This borders on claiming descriptive truth forces normative change. Be ready to emphasize that the *moral* argument still relies on standard liability principles, just applied to a new model.

  **2. The Category Mistake (Agency vs. Particles)**
  *The Objection:* "Soldiers are intentional agents capable of moral reasoning; gas molecules are not. Entropy applies to systems where individual intent is irrelevant. By modeling combatants as nodes in a dissipative structure, aren't you simply ignoring the very thing that makes them moral subjects—their capacity to choose?"
  *The Reply:* "I'm not denying agency; I'm constraining it. Statistical mechanics works precisely because individual variance averages out into systemic behavior. Soldiers may feel they are choosing, but if the system funnels them toward error amplification regardless of intent, the *structural* asymmetry holds even if the *individual* psychology varies."
  *Flag:* **Dodges.** This risks sounding determinist. If pressed, admit that individual exemption is possible but statistically negligible for the theory of war.

  **3. The McMahan Redundancy**
  *The Objection:* "Jeff McMahan already dismantled the Moral Equality of Combatants using standard liability theory without needing a single equation. What work is the physics actually doing here? It looks like you're dressing up revisionist just war theory in jargon to make it look novel."
  *The Reply:* "McMahan focuses on individual liability. I'm focusing on systemic structure. McMahan explains why a specific soldier might be liable; I'm explaining why the *institution* of symmetric war rules is unstable. The physics highlights the irreversible feedback loops that individual liability models miss."
  *Flag:* **Solid.** This distinguishes your lane from McMahan's effectively.

  **4. The Walzerian Pragmatist**
  *The Objection:* "Even if you're theoretically right, Walzer's symmetry exists for a reason: it limits bloodshed. If we tell soldiers only one side is fighting justly, don't we remove the incentive for the 'unjust' side to follow *jus in bello*? Isn't this theory dangerous in practice?"
  *The Reply:* "That's a consequentialist worry about adoption, not a truth claim about morality. My point is that the current symmetry is already broken in practice; unjust actors exploit it. Acknowledging the asymmetry might actually tighten *in bello* constraints by removing the 'moral license' unjust combatants pretend to have."
  *Flag:* **Soft.** You are conceding the practical risk while doubling down on the theoretical truth. Dangerous ground.

  **5. The Epistemic Access Problem**
  *The Objection:* "You base this asymmetry on the justice of the cause (*ad bellum*). But soldiers rarely know the true justice of their cause. If information is asymmetric, doesn't that apply to both sides? Both sides think they're just. How does entropy solve the fog of war?"
  *The Reply:* "Entropy doesn't require perfect information; it requires information *flow*. Unjust causes typically require more secrecy, more propaganda, and more coercion to sustain themselves than just ones. That friction creates the thermodynamic signature I'm tracking, regardless of what the individual soldier believes."
  *Flag:* **Dodges.** This assumes unjust causes are inherently more informationally costly, which is empirically debatable.

  **6. The Historical Anachronism**
  *The Objection:* "As a historian, I'm bothered by the timeline. Just War Theory is theological and legal, rooted in natural law. Importing 19th-century thermodynamics into a 13th-century framework is deeply anachronistic. You're forcing a mechanistic model onto a tradition that rejects mechanism."
  *The Reply:* "I'm not rewriting history; I'm updating the model. Natural law assumed a stable moral order. Modern war is industrial and systemic. We need a vocabulary that handles mass coordination and systemic error, which Newtonian mechanics—and medieval theology—both lack."
  *Flag:* **Solid.** Acknowledges the history while claiming necessity for the present.

  **7. The Dehumanization Charge**
  *The Objection:* "Calling human beings 'nodes in a dissipative structure' is chilling. It sounds like you're stripping them of dignity to make the math work. Does this framework leave any room for the inherent worth of the combatant, regardless of their side?"
  *The Reply:* "Describing a system's mechanics isn't a judgment on human worth. A doctor describing a virus doesn't hate the patient. I'm describing the machinery of war to better stop it, not reducing the soldiers to mere cogs in their moral entirety."
  *Flag:* **Soft.** Emotional appeal. Hard to prove "dignity" remains intact in your model.

  **8. The "Prayer" Question (Thermal Death Reductio)**
  *The Objection:* "If unjust combatants are essentially entropy generators, does that imply a 'moral thermal death' is the goal? Are you suggesting unjust soldiers are 'heat' and just soldiers are 'work'? It sounds like you're turning ethics into a heat engine."
  *The Reply:* "That's a category error I explicitly warned against. Heat and work are metaphors for energy distribution, not moral status. I'm not saying unjust soldiers are waste heat; I'm saying their actions contribute to systemic disorder in a way that breaks the symmetry of liability. Please don't literalize the metaphor."
  *Flag:* **Dodges.** This is damage control. If they laugh, you lose the room. Stick to the "metaphor" defense hard.

  Focus on anchoring the physics as heuristic analogy to deflect ontological critiques while preserving the structural insight.
