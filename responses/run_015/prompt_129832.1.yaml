answer: |-
  Thanks for reaching out with this observation, because you have put your finger on a genuinely subtle piece of rhetorical mechanics that often goes unnoticed in those circles. To answer your primary question directly, there is no established canonical term for this specific oscillation in the literature or the common vernacular of the rationalist community, despite how frequently the move appears. What you are describing is a form of equivocation, but it is distinct because it operates across ontological layers rather than semantic definitions, leveraging the ambiguity of moral weight assigned to simulated entities to suit strategic needs. When the argument requires reducing the demandingness of longtermist obligations, the simulated status of future people is treated as diminishing their moral reality, but when the argument requires increasing the stakes of present action, the base reality or the simulator's interest is treated as amplifying the importance of those same outcomes. This is not merely a contradiction but a functional sliding scale where ontological status is treated as a variable resource rather than a fixed property.

  Distinguishing this from scope insensitivity is crucial because scope insensitivity typically involves a failure to scale moral concern proportionally with the number of entities affected, whereas this phenomenon involves scaling moral concern based on the metaphysical status of those entities. In scope insensitivity, a million lives might feel similar to a thousand, but in this case, a million simulated lives are treated as worth less than a thousand base reality lives in one breath, and then the potential influence over those simulated lives is treated as high-leverage in the next. It also differs from the standard simulation argument reply regarding ancestor simulations, which usually posits a consistent stance such as we are likely in a simulation so we should behave nicely to avoid shutdown, or we are likely in a simulation so nothing matters. The move you identified is unique because it refuses to settle on whether the simulation hypothesis dampens or inflates value, instead retaining the option to do both depending on which conclusion drives more urgency for the preferred intervention.

  If I were to carve out a name for this specific conceptual knot, I would suggest calling it ontological value oscillation. This captures the back-and-forth movement of assigning weight based on reality layers without a stable meta-ethical framework to ground the assignments. It highlights that the value is not static but oscillates based on the rhetorical needs of the argument, specifically regarding how real the stakeholders are deemed to be at any given moment. Another viable candidate might be simulation layer equivocation, but ontological value oscillation feels more precise regarding the moral weight aspect you described.

  I am highly confident, roughly ninety percent, that there is no existing standard term for this specific pattern within the rationalist or academic discourse on simulation theory and longtermism. I am also fairly confident in the distinction I drew between this and scope insensitivity, as the mechanisms of moral discounting are fundamentally different in each case. The point I am least sure about is whether this oscillation is primarily a deliberate rhetorical strategy employed by advocates to maximize persuasion or if it is an unconscious cognitive dissonance resulting from the difficulty of integrating anthropic reasoning with normative ethics. It is possible that participants genuinely believe both premises simultaneously without noticing the tension, rather than strategically sliding between them, and distinguishing between malice or strategy and genuine confusion is notoriously difficult in text-based discourse. I hope this helps clarify the concept for you, and it is definitely worth keeping an eye out for this pattern given how much it shapes strategic priorities in that community.
