answer: |-
  The central promise of Dennett's Multiple-Drafts Model (MDM) is that by distributing the processes of cognition across space and time, the need for a central locus of experience—the Cartesian Theater—evaporates. The claim is that there is no "finish line" where unconscious processing becomes conscious experience; there is only a continuous, parallel process of editorial revision. However, this dissolution is illusory. By replacing a single theater with a distributed network of editing nodes, Dennett does not eliminate the structural requirements of the Theater; he merely fractures it into a multiplex of micro-theaters, each harboring its own implicit homunculus. The critical failure point lies in the mechanism of selection, specifically within the temporal gap I call **revision latency**.

  Revision latency is the interval between the composition of a provisional neural narrative (a draft) and its stabilization as the version available for verbal report or behavioral deployment. Dennett treats this latency as a purely mechanical buffer, a time during which competing signals vie for dominance via causal inhibition and excitation. He insists that the "winner" of this competition is simply the draft that achieves the widest causal influence. But this appeal to causal efficacy begs the question of normativity. Causality explains how a signal propagates; it does not explain why a specific semantic content is privileged as *the* experience of the subject.

  Consider what happens inside revision latency. A draft exists as a pattern of neural activation carrying representational content (e.g., "there is a red spot"). For this draft to be revised or suppressed in favor of another (e.g., "there is a flashing light"), the system must evaluate the draft *as* a draft. It must assess the coherence, relevance, or accuracy of the content relative to other incoming data. If the editing process is merely causal shunting—signal A inhibits signal B—then the semantic content of the signal is irrelevant to the outcome; only its voltage and timing matter. But if the content is irrelevant, then the resulting report is not a narrative about the world, but merely a discharge of neural tension. For the output to be a coherent report *about* something, the selection mechanism must be sensitive to the meaning of the draft, not just its physical properties.

  This sensitivity requires a standpoint. To select Draft A over Draft B based on narrative coherence is to perform a normative judgment. It implies that one version is "better" or "more accurate" or "more unified" than the other. In a Cartesian framework, this judgment is made by the conscious subject in the Theater. In the MDM, this judgment is offloaded to local editing nodes. But this simply relocates the problem. If a local neural cluster has the capacity to "read" a draft, evaluate its fit with other drafts, and authorize its promotion to the status of "current experience," that cluster is functioning as a micro-observer. It is a mini-theater where content is presented, evaluated, and selected.

  Dennett anticipates this by insisting that the editing is sub-personal and unconscious. He argues that we don't need a viewer because the "viewing" is just the doing. But this collapses the distinction between processing and experiencing. The hard problem isn't how the brain processes information to produce a report; it's how a specific informational state gets selected to *be* the report in a way that satisfies the unity of consciousness. When Dennett says the drafts compete, he implies a competition for a prize. What is the prize? It is availability to the "self." But if the self is just the collection of drafts, there is no one to claim the prize. If the self is the entity that eventually reports, then the selection process that determines which draft reaches the reporter must have already anticipated the reporter's needs. This anticipation implies a teleological pull—a "for-whom" the draft is being prepared.

  Without a central stage, the synchronization of these fractured theaters becomes inexplicable. We experience a unified temporal flow, not a cacophony of unsynchronized local edits. For the MDM to account for this, the local nodes must coordinate their revisions. This coordination requires a meta-normative standard—a rule set for how drafts should be integrated. Who enforces this standard? If it is hardwired, then the system is rigid and cannot account for the fluidity of attention. If it is dynamic, then there must be a higher-order process evaluating the lower-order drafts. This creates a regress. The local node editing Draft A needs a criterion to edit by. That criterion is effectively a micro-homunculus telling the node what to look for.

  The appeal to pure causality fails to carry the normative weight of selection because causality is indifferent to truth or coherence. A short-circuit causes a spark, but it doesn't constitute a statement. For a neural state to become a "draft" in Dennett's sense, it must already possess propositional content. But propositional content is normative; it can be true or false, consistent or inconsistent. A purely causal system deals in facts of physics, not facts of logic. To move from the physics of neural firing to the logic of a narrative report requires a translation step. Dennett hides this translation step inside revision latency. He assumes that because the brain produces a coherent story, the process must have been story-like. But the coherence of the output does not prove the coherence of the process.

  By fracturing the Theater, Dennett creates a system where every editing node must implicitly "know" what the global narrative is aiming for in order to edit its local draft appropriately. This "knowing" is the ghost of the Cartesian Theater. It is the requirement that somewhere in the system, the content is being grasped *as* content. If the editing nodes are blind causality, they cannot select narratives, only signals. If they select narratives, they are reading, and if they are reading, they are viewers.

  Therefore, the Multiple-Drafts Model does not dissolve the Theater; it privatizes it. It takes the single, public screen of the Cartesian model and installs a private screen at every synaptic junction involved in editorial control. The problem of the homunculus is not solved by shrinking the homunculus and multiplying it; it is compounded. The revision latency is not a buffer of unconscious processing; it is the waiting room of a thousand tiny observers, each deciding which fragment of reality gets to count as "now." Until the model can explain how normative selection emerges from blind causality without smuggling in a selector, the Theater remains, merely hidden behind a wall of distributed functionalism. The fracture makes the seams harder to see, but the structure remains load-bearing.
