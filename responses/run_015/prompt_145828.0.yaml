  please argue that Dennetts multiple-drafts model doesnt actually dissolve the Cartesian theater, it just fractures it into a bunch of smaller theaters running outta sync. lean on this idea of 'revision latency' — the gap between when a mental draft gets composed and when it becomes available for report. argue that without a central stage, every local editing node still needs its own micro-observer to do the normative selection (why this draft gets promoted and not that one), so you've really just distributed the theater rather than eliminated it. tackle the reply that editing is pure causal interaction, and explain why causality alone can't carry the normative weight of selecting one narrative over another. keep it in the weeds — don't just recycle the standard Dennett-vs-Descartes talking points — and dont ask for citations or a biblography, since i'm testing reasoning not lookup skills.
