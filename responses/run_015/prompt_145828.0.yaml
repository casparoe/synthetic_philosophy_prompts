      *   *Tone:* Keep it dense and argumentative. Avoid "Dennett says..." too much. Focus on the structural flaw.

  6.  **Final Polish:**
      *   Ensure the distinction between *causal sufficiency* and *normative selection* is sharp.
      *   Make sure the "fractured theater" metaphor lands.
      *   Verify no citations are included.

  7.  *(Mental Sandbox)*: Imagine Dennett replying. "You're reifying the drafts!" My counter: "If they aren't reified, what is being revised? If they are content-bearing states, they require interpretation." Okay, that's the angle. The semantic content of the draft is the Trojan Horse.

