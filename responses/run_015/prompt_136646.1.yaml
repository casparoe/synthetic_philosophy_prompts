answer: |-
  **The Scenario**
  Two civil servants, Alex and Blake, hold identical grades, salaries, and net worth. A policy change will permanently impose one of two conditions on each. Alex will develop intractable cluster headaches (occurring daily, severe intensity, medically manageable but not curable). Blake will suffer a below-knee amputation (permanent, requiring prosthetics and home modification, but medically stable). Both remain fully employable in their current desk roles. The agency must decide which claimant receives priority for a limited hardship grant.

  **The Numbers**
  *   **Bridge-Person Valuation:** A neutral subject lives Alex's life for five years, then Blake's life for five years. When asked which state they would pay to avoid returning to, they choose Alex's (the headaches). They rate the headache year as 4/10 quality of life and the amputation year as 6/10. **Verdict: Alex's loss is larger.**
  *   **Compensating Variation (CV):** Alex calculates they would pay $40,000 (80% of savings) to avoid the headaches, as medical costs are low but relief is impossible. Blake calculates they would accept $150,000 to tolerate the amputation, based on the market cost of prosthetics, vehicle modifications, and home accessibility ramps required to maintain their pre-loss standard of living. **Verdict: Blake's loss is larger.**

  **Why They Diverge**
  The Bridge method measures **hedonic deprivation** (how bad it feels). The CV method measures **restoration cost** (how much money it takes to function). The Bridge person feels the pain of the headaches more acutely than the inconvenience of the prosthetic. However, the market prices the *mitigation* of the amputation much higher than the mitigation of the headaches. CV conflates the suffering of the loss with the price tag of the fix.

  **The Single Feature**
  **The Capital Intensity of Mitigation.**
  Alex's loss is high-suffering but low-cost to manage (pills are cheap, even if ineffective). Blake's loss is lower-suffering (due to adaptation) but high-cost to manage (hardware is expensive). CV captures the hardware cost; the Bridge captures the pain.

  **The Defense & Order Effect**
  A defender of the Bridge method would argue that CV commits a **category error**: it compensates for *expenses*, not *misery*. If the agency's goal is to alleviate suffering, funding Blake just because his hardware is expensive leaves Alex in greater agony.

  If you rerun the Bridge test with the order reversed (Blake's life first, then Alex's), the result likely holds but the margin narrows. Humans adapt quickly to physical disability (Blake's life), making the subsequent shock of the headaches (Alex's life) feel even more intrusive. However, if the Bridge person lives the headaches *first*, they may fail to adapt at all, rendering them unable to fully evaluate the second state. The divergence remains because adaptation rates are intrinsic to the loss types, not the order, but the *magnitude* of the Bridge's preference for avoiding Alex's loss increases if the headaches are experienced last, highlighting the unadaptable nature of chronic pain versus physical disability.
