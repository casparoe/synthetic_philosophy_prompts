      *   *Introduce Worry 3 (Ataraxia/Desire):* The deeper philosophical break. Cryonics violates the limit of desire. It treats death as a problem to be solved rather than a limit to be accepted.
      *   *Conclusion:* Epicurus would likely view cryonics as a disturbance of tranquility based on a false belief about identity and the necessity of infinite time.

