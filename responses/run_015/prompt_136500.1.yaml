  ### Sub-Question Decomposition

  **(i) Conceptual Necessity: 0.85**
  *Question:* Does identifying a historical "cycle" conceptually require a directional metric of state (e.g., health, complexity, cohesion) rather than purely relational or topological comparison?
  *Reasoning:* A cycle is not just repetition; it is a return to a prior *state*. To define the state, you need a coordinate system. In history, unlike astronomy, coordinates are not given by physics but by valuation (e.g., "order" vs. "chaos," "vitality" vs. "decay"). You cannot identify a "fall" without a prior metric of "height." Therefore, a directional baseline (a y-axis) is conceptually prerequisite to defining the cycle.
  *Probability:* 0.85 (High confidence. It is difficult to formulate historical recurrence without implicit scalar values).

  **(ii) Historical Fidelity: 0.90**
  *Question:* Do the canonical cyclical theorists (Polybius, Spengler, Toynbee, Ibn Khaldun) in fact employ such linear metrics implicitly, despite their explicit rhetoric?
  *Reasoning:* Textual evidence is overwhelming. Polybius measures constitutions against a standard of "stability." Spengler measures cultures against a biological vector of "birth-to-death." Ibn Khaldun measures *asabiyya* as a quantifiable surplus that accumulates and depletes. Even when they deny "progress," they utilize a metric of *intensity* or *capacity* that is inherently linear (it can be more or less). They deny the *trajectory* (upward) but keep the *ruler* (vertical).
  *Probability:* 0.90 (Very high confidence. The texts explicitly rely on metrics of growth and decay).

  **(iii) Philosophical Consequence: 0.75**
  *Question:* Does this dependency on linear metrics undermine their status as *conceptually independent alternatives* to linear historiography?
  *Reasoning:* This is the weakest link. Sharing a coordinate system (the y-axis of "complexity") does not necessarily make one "parasitic" in a way that invalidates the model. One can use the same ruler to measure a straight line and a sine wave. However, if the *definition* of the metric itself (e.g., what counts as "civilizational health") is inherited from Enlightenment progress narratives, then the cyclical theory is indeed conceptually indebted. It is not a clean break; it is a modification. This undermines the claim of *radical* independence, even if the model remains useful.
  *Probability:* 0.75 (Moderate-high confidence. "Undermines" is strong, but "complicates" is certain. I grant that it damages the claim of total conceptual autonomy).

  ### Combination Logic

  I treat these as conjunctive necessary conditions. If any term is false, the specific claim that they are "conceptually parasitic... which undermines their independence" fails.

  $$ \text{Total Credence} = P(i) \times P(ii) \times P(iii) $$
