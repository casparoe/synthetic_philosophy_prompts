  **Final Credence: 0.57**

  I find your argument significantly more robust than your friend's, though I stop short of your 0.65. The core insight—that "oscillation" requires an axis, and that axis is often borrowed from the teleological frameworks being rejected—is structurally sound. However, I reserve probability mass on the final normative leap (that this dependency *fatally* undermines their status as alternatives).

