  My final number is most sensitive to **Term (iii): Philosophical Consequence**.

  Terms (i) and (ii) are relatively stable. It is hard to argue that cycles don't need metrics (i), and harder still to argue that Spengler didn't use them (ii). The variance lies in whether sharing a metric constitutes "parasitism" that "undermines" the theory's status.

  **The Specific Argument/Example That Would Move It:**
  To move my credence significantly higher (toward your 0.65+), you would need to demonstrate that the *definition* of the metric itself is irredeemably linear-progressivist.
  *   *Example:* If you could show that "civilizational complexity" (the common y-axis) cannot be defined without referencing the Enlightenment ideal of "rationalization" or "freedom," then the cyclical theorists are not just using a ruler; they are using a *value system* they claim to reject.
  *   *Counter-Move:* To move my credence lower (toward your friend's 0.20), one would need a robust example of a cyclical theory that relies on **purely topological recurrence** without scalar valuation. For instance, a model where History moves A→B→C→A based on logical necessity alone, without B being "higher" or "healthier" than A. If such a model exists and is viable, the charge of parasitism collapses, as the "linear baseline" is shown to be optional, not necessary. (Pareto's circulation of elites approaches this, but still relies on a metric of "governing capacity," keeping my probability high).
