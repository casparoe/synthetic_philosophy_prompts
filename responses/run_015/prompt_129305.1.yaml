answer: |-
  ### 1. Exam Question

  **Course:** PHI 405: Free Will and Moral Responsibility
  **Time Allowed:** 75 Minutes
  **Instructions:** Answer the following question in essay format. Your response should demonstrate precise knowledge of the relevant arguments while critically evaluating the specific conceptual distinctions requested.

  **Question:**
  Galen Strawson's Basic Argument concludes that true moral responsibility is impossible because it requires an agent to be *causa sui* (cause of itself), which is logically incoherent. Critics argue that Strawson's regress illicitly slides between a **causal-explanatory demand** (that every feature of the agent be traceable to prior causes) and a **normative-justificatory demand** (that the agent be the ultimate source of her will in a way that grounds desert).

  Consider the following scenario: An adult human's neural architecture is gradually, over thirty years, replaced by functionally identical synthetic substrates. Psychological continuity is preserved throughout. The resulting being cannot trace any present mental states to biological origins, only to earlier synthetic states.

  Evaluate whether distinguishing between causal-explanatory and normative-justificatory demands undermines Strawson's Basic Argument. In your analysis, apply this distinction specifically to the neural-replacement scenario. Does the synthetic being escape the regress, or does the scenario reveal that Strawson's logical structure holds regardless of the substrate? Distinguish clearly between what is logically settled in Strawson's argument and what remains genuinely contested in the literature.

  ***

  ### 2. Model Answer

  Galen Strawson's Basic Argument (BA) posits that to be truly morally responsible for one's actions, one must be responsible for the way one is (at least in certain crucial mental respects). However, to be responsible for the way one is, one must have chosen to be that way, which requires a prior choice based on a prior nature. This generates an infinite regress, requiring the agent to be *causa sui*. Strawson treats this as a logical impossibility, concluding that ultimate moral responsibility is impossible. What is **settled** in this argument is its logical structure: if responsibility requires ultimate self-creation, and self-creation is incoherent, then responsibility is impossible. What is **contested** is the premise that responsibility *does* require this specific form of ultimate sourcehood.

  The distinction between causal-explanatory and normative-justificatory demands targets this contested premise. A causal-explanatory demand seeks the history of an agent's constitution: "How did you come to have this will?" A normative-justificatory demand asks: "Do you have the standing to be praised or blamed?" Critics suggest Strawson illicitly infers that because the causal-explanatory chain never terminates in the agent (it always goes back further), the normative-justificatory conditions can never be met. This assumes that normative desert requires causal ultimacy. If one rejects this assumption—arguing that responsibility grounds in reasons-responsiveness or agency rather than causal origination—the regress loses its normative force, even if the causal regress remains.

  Applying this to the neural-replacement scenario clarifies the stakes. In this case, the agent's biological substrate is entirely replaced by synthetic material over thirty years, preserving psychological continuity. The resulting being traces its mental states only to prior synthetic states, not biological ones. Does this escape the BA?

  If Strawson's argument relies on a **causal-explanatory demand** regarding biological determinism, the synthetic being might appear to escape it. It is not determined by its genetic biology. However, the BA is not about biology; it is about *determination* simpliciter. The synthetic being's states are still determined by prior synthetic states and the laws governing their function. Therefore, the causal-explanatory regress remains intact. The being did not create the synthetic architecture that constitutes its will; it merely inherited it from its past self, who inherited it from an earlier self, ad infinitum. The substrate change is irrelevant to the logical structure of the regress.

  However, the **normative-justificatory** lens offers a different evaluation. If moral responsibility requires only that the agent acts from their own reasons and maintains psychological continuity (as the scenario stipulates), the synthetic being is responsible. The fact that its will has a causal history it did not ultimately choose matters less than its current capacity for rational self-governance. Here, the distinction undermines Strawson by suggesting he conflates the *history* of the will with the *authority* of the will. The synthetic being has authority over its actions, even if it lacks ultimate causal authorship of its constitution.

  Yet, Strawson would counter that without ultimate authorship, this "authority" is merely an illusion generated by the causal chain. This returns us to the contested core: Is "ultimate sourcehood" a necessary condition for desert? The neural scenario demonstrates that changing the causal facts (biology to synthesis) does not change the structural lack of self-creation. Thus, if one accepts Strawson's normative demand, the scenario confirms the BA. If one rejects the demand as overly rigorous, the scenario shows that responsibility survives despite the lack of *causa sui*.

  In conclusion, the causal/normative distinction does not refute the logical validity of Strawson's regress (which is settled), but it challenges the normative relevance of that regress (which is contested). The neural-replacement case illustrates that the problem is not biological determinism but the nature of agency itself. Whether this impossibility of *causa sui* actually negates moral responsibility depends on whether one accepts Strawson's demanding conception of desert, a point on which the literature remains deeply divided.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 20
  **Grading Philosophy:** A-range answers (16-20) demonstrate critical synthesis and meta-philosophical awareness. B-range answers (12-15) demonstrate competence and understanding but lack critical depth or nuance regarding the contested nature of the claims.

  | Intellectual Move | Marks | A-Range Performance (Excellent) | B-Range Performance (Competent/Limited) | Common Failures |
  | :--- | :---: | :--- | :--- | :--- |
  | **1. Reconstruction of the Basic Argument** | 4 | Clearly articulates the regress (responsibility for action $\rightarrow$ responsibility for nature $\rightarrow$ *causa sui*). Identifies the logical impossibility claim as the engine of the argument. | Summarizes the argument correctly but may be vague on the specific steps of the regress or the definition of *causa sui*. | Treating the BA as simply "determinism is true" or confusing it with hard incompatibilism generally. |
  | **2. Articulation of the Causal/Normative Distinction** | 4 | Precisely defines the difference between tracing causal history (explanatory) and grounding blame/praise (normative). Explains how Strawson is accused of conflating them. | Defines the terms but fails to explain *how* the conflation allegedly works or why it matters for the argument's force. | Treating the distinction as a synonym for "determinism vs. indeterminism." |
  | **3. Application to Neural-Replacement Scenario** | 4 | Uses the scenario to test the *structure* of the regress. Notes that substrate change (bio to synthetic) does not stop the regress of determination. | Applies the scenario superficially (e.g., "The robot isn't human so it's different") or ignores the psychological continuity stipulation. | Claiming the synthetic being *escapes* the regress simply because it isn't biological. |
  | **4. Evaluation of the "Slide" (Undermining the Argument?)** | 4 | Critically assesses whether the distinction breaks the link between the regress and responsibility. Weighs Strawson's counter (authority requires authorship) against the critic's view. | Takes a side dogmatically (e.g., "Strawson is obviously wrong") without engaging with the counter-argument or the strength of the regress. | Failing to conclude whether the distinction successfully undermines the BA or merely sidesteps it. |
  | **5. Distinction of Settled vs. Contested Claims** | 4 | Explicitly flags what is logically valid (the regress structure) vs. what is philosophically debated (the requirement for ultimate sourcehood). Maintains epistemic humility. | Presents Strawson's conclusion as fact, or presents the compatibilist rebuttal as the consensus view. | Ignoring the instruction to distinguish settled logic from contested interpretation. |

  **Note on Grading:**
  *   **A-Range (16-20):** Must excel in Move 5. The student must show awareness that the model answer's conclusion is one of several live options in the literature.
  *   **B-Range (12-15):** Usually secure on Moves 1 and 2 but falter on Move 3 (scenario application) or Move 5 (treating contested views as settled).
  *   **C-Range or Below (<12):** Significant misunderstanding of the Basic Argument or failure to address the specific prompt requirements (scenario/distinction).
