answer: |-
  The heat coming off the grate wasn't just temperature; it was a weight. It pressed against Kael's shins, smelling of ozone and burnt sugar. Above his head, the simmballs hovered in their magnetic rack, glowing a soft, authoritative blue. The pattern was clear: a chevron pointing left. *Flow Left.*

  But the pipe beneath the grate was screaming to the right.

  "Hand me the aligner," Kael said, reaching for the floating orbs. His fingers hovered near the third sphere, the one depicting the fractured line. "The syntax is drifting. If I rotate the Fracture ninety degrees, the careenium should recognize the command."

  Elara didn't look up from the valve wheel. Her hands were black with grease, her knuckles swollen. "Don't touch the lights, boy. The lights are just telling us what the goo is already doing."

  "The display says Left," Kael insisted. "The heat is going Right. That's a syntax error. The substrate is lagging."

  "The substrate is stubborn," Elara grunted. She heaved against the wheel. The metal groaned, a deep, tectonic sound that vibrated in Kael's teeth. "It's got a pocket of high viscosity down there. No symbol is going to tell molten rock to flow uphill."

  "It's not rock, it's careenium. It responds to resonance." Kael tapped the aligner against the third simmball. The orb shimmered, shifting its internal light from blue to amber. The chevron pattern wobbled.

  Below them, the pipe shuddered. For a second, the hiss of steam softened. Kael smiled. "See? It's listening."

  "It's coughing," Elara corrected. She kicked the base of the valve assembly. "You're confusing the map for the terrain. The ball changed because the pressure shifted, not the other way around."

  "The pressure shifted because I changed the ball!"

  Elara spat on the grate. She pulled a heavy wrench from her belt and jammed it into the secondary release on the physical pipe, ignoring the glowing orbs entirely. "If I bleed the pressure manually, the symbol will update to match the flow. That's how this city works. Top follows bottom."

  She threw her weight onto the wrench. The bolt didn't turn. The heat spiked, warping the air so the simmballs looked like they were underwater. The blue chevron flickered, momentarily displaying a chaotic spiral before snapping back to *Flow Left*.

  "It's fighting you," Kael said, watching the orb. "The pattern wants to stabilize. Let me finish the sequence."

  "You finish the sequence, you'll blow the seal." Elara wiped sweat from her eyes, leaving a smear of grime. "You think you're programming physics. You're just reading a thermometer."

  "I think I'm the only one trying to follow the manual." Kael grabbed the aligner with both hands. He focused on the second orb, the Circle. He pushed his will into the tool, trying to force the resonance. The orb buzzed, high and sharp.

  The pipe below screamed. A jet of superheated vapor shot through a hairline crack in the grate, singeing Kael's eyebrow. He jumped back, dropping the aligner.

  Elara didn't flinch. She kept leaning on the wrench. "Careenium doesn't care about your circles. It cares about space. It needs somewhere to go."

  "It was working until you forced the valve!"

  "It was building pressure until you distracted it!"

  They worked in silence for a minute, the heat rising to a unbearable hum. Kael stared at the simmballs, convinced they were the brain of the city, waiting for the right command to unlock the flow. Elara stared at the rusted iron, convinced the lights were just ghosts reflecting the struggle of the machine.

  Kael reached for the orb again. Elara slammed the wrench down.

  At the same moment, the pipe gave a wet, lurching shudder. The scream died. The hiss of steam normalized, flowing smoothly to the left, exactly as the blue chevron indicated.

  The heat began to recede.

  Kael froze, hand hovering over the orb. Elara rested her forehead against the cool metal of the valve.

  "Did you..." Kael started.

  "Did I what?" Elara didn't look up.

  "Did the sequence lock in? Or did the valve break loose?"

  Elara straightened up. She looked at the wrench in her hand, then at the glowing blue arrow above them. The simmball hummed, steady and serene. The pipe below gurgled, heavy and blind.

  "Does it matter?" Elara asked, wiping her hands on her rag. "Flow is left. Get the kit."

  "But if I didn't fix it, the next jam—"

  "Then we'll be here for the next jam." She turned her back on the orbs. "Come on. Sector 4 is reporting a pressure drop."

  Kael looked up at the simmballs. They hovered perfectly still, offering no answer. He picked up the aligner, unsure whether to pack it away or keep it ready, and followed her into the dark.
