  Looking toward the shadow of Thursday,
  Knowing the week ends on Friday,
  Waiting for the promised Surprise.

  There can be no final Surprise
  If we reach the end of Monday
  And know the test must be on Friday.
  So Friday dies. Then Tuesday
  Becomes the edge before Thursday,
  Pushing the dread to Wednesday.

  The shadow falls on Wednesday,
  Knowing Thursday holds no Surprise.
  If Friday is gone, then Thursday
  Is the last chance. But Monday
  Knows that by Tuesday,
  Thursday replaces Friday.

  The chain consumes Friday,
  Then backward steps to Wednesday,
  And swallows up Tuesday.
  There is no room for Surprise.
  The calendar blanks out Monday,
  And leaves us nothing on Thursday.

  So no exam on Thursday,
  Nor any chance on Friday.
  We are safe on Monday,
  Secure through Wednesday.
  There will be no Surprise,
  Not even on Tuesday.

  Yet here we sit on Tuesday,
  The logic broke on Thursday.
  It was a genuine Surprise.
  Because we ruled out Friday,
  And cleared away Wednesday,
  The argument starts on Monday.

  We start again on Monday, Tuesday,
  Trapped in Wednesday, Thursday,
  By logic's Friday Surprise.
