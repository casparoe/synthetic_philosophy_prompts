answer: |-
  Here are ten interview questions designed to move beyond the standard introductory examples and engage with the structural and political stakes of judgment aggregation theory.

  **1. The Salience Problem**
  "Most popular introductions to your work rely on the Kornhauser and Sager example of the court case dissolving a company. It's a clean illustration, but it's also sterile. In your decade of working on this, where have you seen the discursive dilemma actually bite in the wild? I'm not looking for a metaphor—I want to know where a real collective body voted consistently on premises, voted consistently on a conclusion, and woke up to find they had legislated a contradiction."

  **2. Doctrinal Paradox vs. Discursive Dilemma**
  "There is often a slippage in the literature between the older 'doctrinal paradox' from legal theory and the 'discursive dilemma' as you and Philip Pettit formalized it. I want to press on why that distinction isn't just branding. When you moved the problem from the courts to political philosophy, what specific work did that generalization do? Does framing it as a *discursive* dilemma rather than a *doctrinal* paradox change the normative stakes, or does it simply expand the terrain?"

  **3. The Impossibility Theorem and the Axiom of Independence**
  "Let's talk about the impossibility theorem. The lazy summary is that we can't satisfy all the axioms simultaneously. But in practice, theorists usually sacrifice 'Independence'—the idea that the collective judgment on a proposition should depend only on individual judgments on that proposition—to save 'Consistency.' If we drop Independence, we are effectively admitting that how we vote on *P* depends on how we vote on *Q*. What is the democratic cost of that admission? Are we no longer voting on propositions, but on logical systems?"

  **4. The Practical Rule and Committee Tolerance**
  "Following up on that: if we drop Independence to preserve consistency, we usually land on a premise-based procedure. The committee votes on the reasons, and the conclusion is derived logically, not voted on directly. I can imagine a real-world committee tolerating that in a technical setting, like a central bank. But in a polarized political body? Does a premise-based procedure require a level of shared rationality that doesn't exist? At what point does the committee reject the rule because it feels like the logic is holding them hostage?"

  **5. Logical Structure and Moral Responsibility**
  "You've argued that the choice between premise-based and conclusion-based procedures depends on the logical structure of the agenda. I want to push past that abstraction. Can you walk me through a specific case involving a conjunctive agenda (where all premises must be true) versus a disjunctive one (where only one needs to be true)? I'm looking for a scenario where swapping the procedure doesn't just change the outcome, but fundamentally alters the *moral* responsibility of the committee. Where does the logical structure dictate the ethics?"

  **6. Deliberation as a Solution?**
  "A common reflex among democrats is to say, 'If they just talked to each other, this wouldn't happen.' The hope is that deliberation aligns individual judgment sets before the vote. But does judgment aggregation theory suggest the opposite? Could deliberation actually *worsen* the dilemma by making individual judgments more consistent and polarized, thereby hardening the logical conflict when it comes time to aggregate? Is the discursive dilemma a failure of voting, or a failure of talk?"

  **7. Truth-Tracking vs. Democratic Will**
  "There is an epistemic argument for premise-based procedures: they track the truth better because they force a commitment to the reasons. But democracy is often about the aggregation of will, not the discovery of truth. If a majority wants the conclusion *without* the premises—perhaps for pragmatic or symbolic reasons—does the discursive dilemma give us a theoretical warrant to overrule them in the name of consistency? Are we privileging rationality over sovereignty?"

  **8. Bounded Rationality and the "Consistent Voter" Assumption**
  "The theorem assumes individual voters are logically consistent. But behavioral science suggests people are riddled with cognitive dissonance. If the input is already inconsistent, does the impossibility theorem lose its bite? Or does that make the problem worse, because now the aggregation rule has to clean up a mess that starts at the individual level? Does the discursive dilemma presume a level of rationality that humans don't actually possess?"

  **9. The Politics of Agenda Control**
  "I want to talk about power. The dilemma arises from the set of propositions put to the vote. But who chooses that set? If we acknowledge that the structure of the agenda determines whether the dilemma appears—and whether it is resolved via premises or conclusions—doesn't that make agenda control the ultimate political lever? Is the discursive dilemma actually a problem of voting, or is it a mask for the power to define what counts as a premise?"

  **10. Legitimacy and the Threat of Inconsistency**
  "Finally, I want to close on legitimacy. Is the discursive dilemma a genuine threat to the legitimacy of collective decisions, or is it a mathematical curiosity that only bites under contrived conditions? And if we accept your answer to the previous question—that agenda control is the key—does the threat shift? Is the danger not that the committee will be inconsistent, but that the chairperson will use the threat of inconsistency to manipulate the outcome? What becomes of democratic legitimacy if consistency is a weaponizable resource?"
