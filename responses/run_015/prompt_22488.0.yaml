answer: |-
  You have excellent intuition here. You are essentially reconstructing the famous resolution proposed by E.T. Jaynes in *Probability Theory: The Logic of Science*.

  Your working assumption is **mostly correct**, but there is one critical nuance regarding *which* symmetry group is required to force uniqueness. If you rely only on the symmetry group of the circle itself (rotations and reflections), you **will not** get a unique measure. To get uniqueness, you must invoke the symmetry group of the **plane** (translations, rotations, and reflections).

  Here is the breakdown of why your intuition is right, where the specific mathematical step needs tightening, and how this applies to your Bayesian modeling.

  ### 1. The Trap: Rotational Symmetry is Not Enough
  You suspected that the "paradox" arises from parameterizations that break symmetry. You are right that the 1/3 and 1/4 solutions feel "lopsided," but mathematically, **all three standard solutions are invariant under the circle's rotation and reflection group ($O(2)$).**

  *   **1/3 Solution (Random Endpoints):** If you rotate the circle, the distribution of random endpoints rotates with it. It is rotationally invariant.
  *   **1/4 Solution (Random Midpoint):** If you pick a midpoint uniformly from the area of the disk, rotating the disk leaves the uniform area measure unchanged. It is rotationally invariant.
  *   **1/2 Solution (Random Radius):** If you pick a distance from the center uniformly and an angle uniformly, this is also rotationally invariant.

  Therefore, if your argument rests *only* on the invariance under the circle's own symmetry group (rotations/reflections), you cannot distinguish between the three answers. They all satisfy that condition.

  ### 2. The Resolution: Invariance Under the Euclidean Group
  To break the tie, you must consider the circle not as an isolated object, but as an object situated in a plane. This is the core of Jaynes' argument.

  The problem statement ("a randomly drawn chord") implies a lack of information about the circle's **position** and **size** in the universe.
  1.  **Translation Invariance:** The probability should not change if we shift the circle to a different location on the table.
  2.  **Scale Invariance:** The probability should not change if we draw a larger or smaller circle (provided we scale the chord length criterion accordingly).
  3.  **Rotation Invariance:** (As you noted).

  When you require the measure on the space of chords to be invariant under the **group of rigid motions of the plane (the Euclidean group $SE(2)$)** plus scaling, the solution becomes unique.

  ### 3. The Mathematical Step: Uniqueness of the Invariant Measure
  You asked specifically about this step: *"I'm not sure that [uniqueness of Haar measure] transfers to a space the group acts on."*

  This is the crux of the matter. Here is the rigorous justification:

  *   **The Space:** The space of all possible lines in a plane (which generate the chords) is a homogeneous space. It can be parameterized by $(p, \theta)$, where $p$ is the perpendicular distance from the origin to the line, and $\theta$ is the angle of that perpendicular.
  *   **The Group:** The Euclidean group $G = SE(2)$ acts on this space of lines.
  *   **The Measure:** There exists a unique measure (up to a scalar constant) on the space of lines that is invariant under $SE(2)$. This is known as the **kinematic measure** or the **Blaschke-Petkantschin density**. In $(p, \theta)$ coordinates, this measure is simply:
      $$ d\mu = dp \, d\theta $$
  *   **Why it's unique:** Generally, if a group $G$ acts transitively on a space $X$, and the stabilizer subgroup is compact (or satisfies specific modular function conditions), there is a unique $G$-invariant measure on $X$. For lines in the plane under rigid motions, this uniqueness holds.

  **Applying it to the Chord:**
  To find the probability, we restrict this invariant measure to the set of lines that intersect the circle.
  *   For a circle of radius $R$, a line intersects if $0 \leq p \leq R$.
  *   The condition for the chord to be longer than the side of the inscribed triangle is that the line must pass within distance $R/2$ of the center (i.e., $0 \leq p \leq R/2$).
  *   Since the invariant measure is $dp \, d\theta$, the probability is simply the ratio of the ranges of $p$:
      $$ P = \frac{\int_0^{R/2} dp}{\int_0^{R} dp} = \frac{R/2}{R} = \frac{1}{2} $$

  So, your symmetry argument **does** pick out a unique measure, but only if you expand the symmetry group to include **translations**. This selects the "1/2" answer (which corresponds to choosing the distance from the center uniformly).

  ### 4. Where This Applies to Your Bayesian Model
  You mentioned you are looking for a "default" prior. This distinction is vital for your side project.

  **When the Symmetry Prior (1/2) is Correct:**
  Use this when you truly have **no information** about the generative process other than the geometry. If your model assumes "nature" picks a chord in a way that doesn't favor any specific location or orientation in the embedding space, the invariant measure (Jaynes' prior) is the mathematically rigorous expression of "maximum ignorance."

  **When the Symmetry Prior is Wrong:**
  In Bayesian modeling, "random" is rarely metaphysical; it is usually mechanistic.
  *   If your data comes from picking two distinct features on a boundary (e.g., "two customers arrive at random times on a cycle"), the **1/3** solution (random endpoints) is the physically correct likelihood, even though it isn't translation-invariant in the plane.
  *   If your data comes from a process that fills an area uniformly (e.g., "a defect occurs anywhere in the material with equal probability"), the **1/4** solution (random midpoint) is the correct physical model.

  ### Summary
  1.  **Your Instinct:** Correct. The paradox is resolved by demanding invariance under a symmetry group.
  2.  **The Correction:** The symmetry group of the *circle* ($O(2)$) is too small; it allows all three solutions. You must use the symmetry group of the *plane* ($SE(2)$ + scaling).
  3.  **The Math:** Your worry about Haar measure transferring is unfounded in this specific case. The space of lines is a homogeneous space of the Euclidean group, and the invariant measure on that space is indeed unique.
  4.  **The Result:** This symmetry argument uniquely selects the **1/2** probability.
  5.  **Modeling Advice:** Use the symmetry-derived prior only if you lack a mechanistic model. If you know *how* the chords are generated (endpoints vs. midpoints vs. radial distance), use that specific likelihood instead of the "default" invariant one.

  You have successfully derived the Jaynes resolution. The "paradox" is indeed an artifact of underspecified problems, and symmetry (specifically translation + rotation invariance) is the standard tool for specifying the "maximum entropy" default.
