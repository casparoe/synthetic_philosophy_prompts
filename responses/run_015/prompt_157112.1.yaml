  2.  **Deconstruct the Philosophical Core:**
      *   *Standard Dollar Auction:* Trap of sunk costs. Rationality suggests stopping, but psychology drives escalation.
      *   *Planning Theory (Bratman):* Intentions are not just desires; they are partial plans that constrain future deliberation to ensure stability and coordination. We have reasons to stick to plans *because* they are plans, not just because the utility calculation hasn't changed.
      *   *The Tension:* Dynamic Consistency (doing what you planned to do) vs. Present Preference (maximizing utility *now* given new info).
      *   *The Simulation Goal:* Make students feel that *stopping* feels like a betrayal of their agency/plan, not just losing points.

