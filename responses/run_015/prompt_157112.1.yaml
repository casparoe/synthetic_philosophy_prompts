answer: |-
  # Simulation Title: The Intertemporal Pledge Protocol
  **Seminar:** Rational Agency & Planning Theory
  **Duration:** 75 Minutes
  **Participants:** 16 Upper-Level Philosophy Students

  ## I. Pedagogical Objective
  To move students beyond the behavioral economics interpretation of the "Dollar Auction" (sunk cost fallacy) and toward a planning-theoretic interpretation (Bratman, Holton). The simulation forces students to experience escalation not merely as irrational loss-chasing, but as a conflict between **dynamic consistency** (sticking to a prior plan) and **preference revision** (maximizing utility given new costs).

  ## II. Roles & Setup (16 Students)
  *   **Bidders (12):** Active participants with endowments.
  *   **The Chronicler (1):** Records the public justification for every bid and every withdrawal.
  *   **The Arbitrator (1):** Holds the power to force a "Hard Stop" once per game if efficiency collapses.
  *   **Auditors (2):** Track bids, calculate commitment costs, and manage the ledger.
  *   **Facilitator (Instructor):** Runs the clock and enforces the normative framing.

  **Materials:**
  *   Whiteboard (Public Ledger).
  *   "Intent Ledgers" (Small cards for Bidders).
  *   "Plan Revision Forms" (For withdrawal).
  *   Currency: **Agency Credits (AC)**. (10 AC = 1% added to final Participation Grade).

  ## III. The Protocol (Rules)

  ### 1. Endowments & Prize
  *   Each Bidder receives an endowment of **50 AC**.
  *   The Prize is a pool of **100 AC**.
  *   **Crucial Framing:** Do not call this an auction. Call it a "Resource Allocation Protocol." Tell students this tests *coordination stability under pressure*.

  ### 2. Bidding Mechanics
  *   Bids must be in increments of **5 AC**.
  *   **The Commitment Cost:** Every time a bid is placed, *all* active bidders (including the highest bidder) incur a **Commitment Cost of 1 AC** per 5 AC bid currently on the table. This represents the cognitive load of maintaining the intention.
  *   **The Pledge Rule:** Placing a bid registers a **Provisional Intention** to remain active. You are not just offering money; you are pledging to sustain the plan.

  ### 3. Payoff Structure
  *   **Winner:** Receives (100 AC Prize) − (Total Bids Paid) − (Accumulated Commitment Costs).
  *   **Loser:** Loses (Total Bids Paid) + (Accumulated Commitment Costs).
  *   **Note:** Because Commitment Costs apply to everyone, the pot drains rapidly. This creates the pressure to win to offset costs.

  ### 4. Withdrawal (Plan Revision)
  *   A bidder may withdraw at any time, but this constitutes **Repudiating a Prior Intention**.
  *   **Procedure:** The bidder must stand, fill out a *Plan Revision Form*, and read aloud: *"I am revising my prior intention because [Reason]."*
  *   **Forfeiture:** Withdrawing incurs a **Social Forfeiture Fee of 5 AC** (deducted from endowment) and requires the Chronicler to log the justification as a "Failure of Stability."

  ### 5. Arbitrator Power
  *   The Arbitrator may declare a **Hard Stop** if the Total Commitment Costs exceed 50% of the Prize value. This simulates external rationality constraints.

  ## IV. Phased Timeline (75 Minutes)

  ### Phase 1: Induction & Masking (0:00–0:10)
  *   **Instruction:** Distribute endowments. Explain the rules mechanically.
  *   **Masking:** Emphasize that this is a test of "Planning Stability." Avoid words like "auction," "trap," or "game." Use terms like "allocation," "pledge," and "agency."
  *   **Goal:** Students should enter believing they are demonstrating rational consistency, not gambling.

  ### Phase 2: The Escalation (0:10–0:40)
  *   **Opening:** Facilitator opens the floor.
  *   **Chronicler Duty:** After every bid, the Chronicler asks: *"Does this bid align with your opening plan?"*
  *   **Mid-Game Crisis (approx. min 25):** Bids will likely exceed 50 AC (the break-even point).
  *   **Tension Point:** Students realize that stopping now guarantees a loss (sunk cost), but continuing risks greater loss. However, the *Plan Revision* rule makes quitting feel like an agentive failure, not just a financial loss.
  *   **Arbitrator Intervention:** If bidding becomes frantic/irrational, the Arbitrator may use their Hard Stop.

  ### Phase 3: Resolution (0:40–0:50)
  *   Bidding closes when only one active bidder remains or the Arbitrator stops it.
  *   Auditors calculate final AC scores.
  *   Collect Plan Revision Forms.

  ### Phase 4: The Debrief (0:50–1:15)
  *   **Mapping Gameplay to Philosophy:**
      1.  **Moment 1 (First Bid):** *Plan Formation.* Discuss how the initial bid set a "default" for future action. Was the first bid a desire or an intention?
      2.  **Moment 2 (The Break-Even Point):** *Sunk Cost vs. Rational Persistence.* When bids passed 50 AC, did students continue because they thought they could win (utility), or because they felt bound by their prior pledge (planning theory)?
      3.  **Moment 3 (Withdrawal):** *Present-Biased Reversal.* Analyze the *Plan Revision Forms*. Did students cite new information (rational) or mere discomfort (akrasia)?
  *   **Collective vs. Individual:** Discuss how the Commitment Cost created a collective drain, making individual rationality (bidding to recoup costs) collectively irrational.

  ## V. Anticipated Failures & Remedies

  | Potential Failure | Diagnosis | Remedy |
  | :--- | :--- | :--- |
  | **Anticipatory Refusal** | Students recognize the "Dollar Auction" trap immediately and refuse to bid. | **Reframe:** Explicitly state, "If you do not bid, you cannot demonstrate planning stability. Non-participation is recorded as 'Agency Abstention' (neutral grade impact, but no credit opportunity)." |
  | **Chronicler Passivity** | The Chronicler simply writes names without probing justifications. | **Script:** Provide the Chronicler with a prompt card: *"Ask every bidder: Is this a new desire or fidelity to your old plan?"* |
  | **Arbitrator Hesitation** | The Arbitrator feels uncomfortable stopping peers. | **Authority:** Give the Arbitrator a "Red Card" they can physically place on the table. Make the stop condition objective (e.g., "When Total Costs > 50 AC"). |
  | **Point Anxiety** | Students worry too much about the grade impact. | **Cap:** Announce a "Loss Cap." No student can lose more than 5% of their total course grade regardless of outcome. This lowers stakes enough for risk-taking. |

  ## VI. The Normative Limitation (Facilitator Note)

  **Frank Statement on Planning-Theoretic Agency:**
  This simulation can only represent the **structure** of planning agency, not its **normative force**.

  In Michael Bratman's planning theory, prior intentions possess a *normative authority* over present preferences independent of expected utility. We *ought* to stick to plans because doing so constitutes us as temporally extended agents.

  **The Limitation:**
  The rules of this simulation cannot generate normative authority; they can only generate **prudential incentives** (the Social Forfeiture Fee and the Commitment Cost). When a student feels "bound" by their bid in this game, it is because they want to save points, not because they recognize the intrinsic rationality of intention-stability.

  **Facilitator Duty:**
  During the debrief, you must explicitly supply the missing normative premise. You must argue: *"In the game, you stayed because of the penalty. In real agency, you should stay because breaking plans undermines your capacity to be an agent over time, even when the utility calculation shifts."* The simulation creates the *tension*; the lecture must provide the *justification*.
