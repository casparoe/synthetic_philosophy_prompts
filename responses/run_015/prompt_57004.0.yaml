answer: |-
  **The Case**
  Alice and Bob are senior auditors at the same mid-sized firm in Cleveland. They receive identical salaries, benefits, and office space. Both report identical life satisfaction scores and possess no adaptive preferences; Alice simply values financial security over labor mobility, while Bob prefers the reverse. Two years ago, Alice voluntarily signed a retention contract granting her a significant upfront bonus but binding her to a three-year non-compete clause with a steep financial penalty for early exit. Bob declined this offer. Alice can leave the firm, but doing so requires paying a penalty that would deplete her savings, making the option "costly" but not impossible. Currently, Alice sits comfortably above the threshold on all ten of Nussbaum's Central Capabilities (she has health, affiliation, control over her environment, etc.), and she affirms this assessment herself.

  **Target Verdicts**
  *   **Welfarist:** No complaint. Utility is equal.
  *   **Dworkinian:** No complaint. Resources were equal; the contract reflects option luck.
  *   **Sen:** Capability inequality. Alice's effective opportunity set is smaller than Bob's.
  *   **Nussbaum:** No injustice. The sufficiency threshold is met for both.

  **Walkthrough**
  The **Welfarist** looks only at the metric of utility or preference satisfaction. Since the case stipulates genuine equality in welfare and bans adaptive preferences, the source of satisfaction is irrelevant. The currency is mental states; since those are equal, justice is satisfied.

  The **Dworkinian** measures resources via the envy test under an insurance model. Assuming Alice and Bob started with equal bidding power in the initial auction, the contract is a gamble using those resources. Dworkin distinguishes brute luck from option luck; Alice's restriction is the result of a voluntary gamble (taking the bonus). Unless the contract violates background fairness (e.g., coercion), the resulting distribution reflects their choices, not a deficit in resource equality. The currency is impersonal resources; both hold equal shares.

  **Sen** measures the *capability set*—the real freedom to achieve functionings. For Sen, freedom has intrinsic value independent of chosen outcomes. Even though Alice chose the restriction, her *opportunity set* is objectively narrower than Bob's because the "exit" option is heavily priced. The conversion factor here is the contractual penalty, which transforms her resources into less freedom than Bob's identical resources buy him. Sen prioritizes the expansion of capability as freedom; a reduction in the set, even voluntarily incurred, registers as a comparative inequality in freedom.

  **Nussbaum** measures against a fixed threshold of human dignity. Her approach is sufficiency-based, not comparative. Since Alice remains above the threshold on all ten capabilities (including "Control over One's Environment"), justice is satisfied. The currency is central capabilities, but the metric is a floor, not a ceiling. A loss of "something good" (extra freedom) is not an injustice if the minimum required for a dignified life is secured.

  **The Key Feature**
  The "costly-but-possible exit" is the engine here. It allows **Sen** to claim inequality because the *cost* reduces the effective freedom relative to Bob (the set is smaller). It allows **Nussbaum** to claim justice because the *possibility* keeps Alice above the threshold (the floor is met). If the exit were free, Sen loses the inequality claim. If the exit were impossible, Nussbaum likely loses the justice claim (threshold violation).

  **Deletion Test**
  If the exit is **flatly impossible** (indentured servitude), Nussbaum's verdict flips: Alice falls below the threshold on "Control over One's Environment," creating an injustice. Dworkin's verdict also flips: a contract removing future agency is void as it undermines the capacity to hold resources. Sen's verdict intensifies: the capability set is crushed.
  If the restriction is **involuntary**, all four verdicts shift to "injustice." Welfarism fails if welfare drops; if welfare stays high (manipulation), it reveals the theory's blindness, but the prompt bans adaptive preferences, implying welfare would track the coercion.

  **Nussbaum's Counter**
  A Nussbaum defender might attack Sen's verdict by invoking the **architectonic priority of Practical Reason**. She could argue that if Alice's contract was chosen via Practical Reason (a central capability), interfering with that choice to "restore" capability disrespects her agency. However, she would maintain that justice is only violated if the contract *threatens* the threshold of Practical Reason itself. Since Alice remains above the threshold, the defender insists justice is secure, distinguishing her view from Sen's comparative maximization. The loss is tragic or sub-optimal, but not unjust.
