answer: |-
  # Desiderata for a Theory of Real Patterns Across the Physical, Design, and Intentional Stances

  To adjudicate the disagreement regarding the ontological status of design-stance patterns—specifically whether they are emergent features of reality or merely epistemic heuristics—a theory of "real patterns" must satisfy a specific set of constraints. The following specification outlines the obligations such a theory incurs. These are divided into **Non-Negotiable Desiderata** (conditions required to maintain the coherence of the three-stance framework) and **Contested Desiderata** (conditions reflecting specific metaphysical commitments). Finally, I address the **Incompatibility Constraint**, identifying where these requirements may become jointly unsatisfiable.

  ---

  ## I. Non-Negotiable Desiderata
  *These criteria are constitutive of the three-stance framework. A theory that fails these does not explain the stances; it eliminates them.*

  ### 1. The Compression Criterion (Informational Efficiency)
  **Requirement:** The theory must demonstrate that adopting a higher-level stance (Design or Intentional) yields a compression of information that is unavailable to the Physical stance, without loss of predictive accuracy within the relevant domain.
  **Motivating Case:** Consider a chess-playing computer. A physical description requires tracking voltage states across billions of transistors. A design/intentional description predicts the next move by referencing "checkmate threats." If the intentional description is longer or more computationally expensive than the physical simulation, it is merely a gloss, not a real pattern.
  **Weight:** **High.** This is the baseline for "realness." If the pattern does not carve nature at joints that simplify description/prediction, it is noise.

  ### 2. The Distinctness Criterion (Non-Collapse)
  **Requirement:** The theory must preserve the logical independence of the three stances. It must explain why valid predictions in the Design/Intentional stances cannot be *practically* derived from the Physical stance, even if they are *in principle* consistent with it.
  **Motivating Case:** **Multiple Realizability.** A mousetrap functions as a trap whether made of wood, plastic, or metal. A theory that collapses the Design stance into the Physical stance must treat "wooden-mousetrap" and "plastic-mousetrap" as fundamentally distinct patterns. An adequate theory must identify the invariant functional pattern despite physical variance.
  **Weight:** **Absolute.** If the theory collapses the stances, it fails to address the prompt's core problem. It must explain why we *need* three stances, not one.

  ### 3. The Normativity Criterion (Failure Conditions)
  **Requirement:** The theory must account for the specific modal profile of Design and Intentional patterns, specifically their capacity for *malfunction* or *irrationality*, which has no analogue in the Physical stance.
  **Motivating Case:** **The Broken Thermostat.** In the Physical stance, a thermostat that fails to switch at 68°F is simply a system obeying thermodynamic laws in a specific configuration. In the Design stance, it is *failing* to be a thermostat. A theory of real patterns must ontologically ground this "ought." If patterns are merely statistical regularities (Physical), "error" is impossible; everything that happens is what happens.
  **Weight:** **High.** This distinguishes Design/Intentional patterns from accidental regularities (e.g., "all coins in my pocket are copper"). Without normativity, the Design stance collapses into a subset of the Physical.

  ### 4. The Indeterminacy Criterion (Interpretive Flexibility)
  **Requirement:** The theory must accommodate cases where a single physical system supports multiple, incompatible Intentional/Design interpretations that are equally predictive.
  **Motivating Case:** **Radical Translation / The Alien Artifact.** An observer might interpret an alien device as a communication tool (Intentional) or a environmental regulator (Design). Both yield successful predictions. A theory claiming patterns are "mind-independent objects" struggles here. The theory must specify whether the pattern resides in the object, the observer, or the interaction, without rendering the pattern arbitrary.
  **Weight:** **Medium-High.** This prevents the theory from naively reifying patterns as "little things inside the system." It forces a relational ontology.

  ---

  ## II. Contested Desiderata (Camp Preferences)
  *These criteria are often demanded by specific metaphysical camps. An adequate theory should explicitly state whether it accepts or rejects these, rather than smuggling them in as assumptions.*

  ### 5. The Reducibility Preference (Physicalist Demand)
  **Requirement:** All real patterns must be ontologically grounded in, and reducible to, physical laws without remainder.
  **Motivating Pressure:** The fear of "spooky" emergent causation. Physicalists demand this to preserve the causal closure of the physical world.
  **Status:** **Optional/Contested.** Accepting this satisfies Physicalists but risks violating the **Distinctness Criterion** (see above). If Design patterns are *nothing but* Physical patterns, their normative force becomes difficult to explain. A theory can reject this (favoring strong emergence) provided it solves the causal exclusion problem.

  ### 6. The Causal Efficacy Preference (Realist Demand)
  **Requirement:** Real patterns must be causally efficacious. The "Design" of a system must be able to cause physical changes, not just describe them.
  **Motivating Pressure:** The intuition that beliefs and functions *do* things. If patterns are merely heuristic (instrumentalism), they don't actually drive the system.
  **Status:** **Optional/Contested.** Accepting this invites the **Causal Exclusion Problem** (if the Physical causes the effect, what work is left for the Design pattern to do?). Rejecting it preserves physical closure but risks making the patterns "epiphenomenal ghosts."

  ---

  ## III. The Incompatibility Constraint: Self-Modifying Systems
  *This section addresses whether a subset of the above requirements is jointly unsatisfiable.*

  There is a specific tension between the **Normativity Criterion** (Design/Intentional autonomy) and the **Reducibility Preference** (Physical completeness) in cases of **Self-Modifying Systems**.

  **The Case:** Consider an AI agent with a reward function that allows it to rewrite its own source code to better achieve its goals.
  1.  **Intentional Description:** The agent *believes* rewriting code will maximize reward, so it *chooses* to alter its architecture. The "goal" causes the "structural change."
  2.  **Physical Description:** The electrical states triggered the logic gates which altered the memory states.

  **The Conflict:**
  If the theory insists on **Physical Completeness** (every physical event has a sufficient physical cause), then the "goal" is causally inert; the physical chain is sufficient. However, if the theory insists on **Intentional Autonomy** (the goal is the genuine explanation for the architectural change), it implies that the semantic content of the goal exerted causal power over the physical substrate.

  **Joint Unsatisfiability:**
  It is likely impossible to satisfy the following triad simultaneously:
  1.  **Causal Closure of the Physical:** No physical event lacks a sufficient physical cause.
  2.  **Causal Efficacy of Patterns:** Design/Intentional patterns exert distinct causal influence (not just description).
  3.  **Non-Overdetermination:** Effects are not systematically caused twice (once by physics, once by pattern).

  **Resolution Obligation:**
  An adequate theory must explicitly sacrifice one.
  *   **Reductionists** sacrifice (2): Patterns are real but causally inert (they "supervene" without pushing).
  *   **Strong Emergentists** sacrifice (1): Higher-level patterns exert "downward causation" that is not fully determined by lower-level physics.
  *   **Compatibilists** argue for (3) via "Constitutive Explanation": The pattern *is* the physical system organized differently, so there is only one cause described two ways. (This risks violating the **Distinctness Criterion** if not handled carefully).

  ---

  ## IV. Brief Evaluation of Existing Approaches Against Desiderata

  To illustrate the weight of these criteria, consider where standard accounts typically falter:

  *   **Physicalist Reductionism:**
      *   *Success:* Satisfies **Reducibility** and **Causal Closure**.
      *   *Failure:* Struggles with the **Normativity Criterion**. It cannot easily explain why a physical state is a "mistake" rather than just a "different state." It often collapses the stances, violating **Distinctness**.
  *   **Functionalist Design Theory:**
      *   *Success:* Excellent at **Compression** and **Normativity** (function implies malfunction).
      *   *Failure:* Often vague on **Causal Efficacy**. If function is defined by role, does the role cause the behavior, or does the behavior define the role? Risks circularity in self-modifying systems.
  *   **Interpretivist Accounts (e.g., Dennett):**
      *   *Success:* Handles **Indeterminacy** well (patterns are real relative to the interpreter).
      *   *Failure:* Often accused of failing **Causal Efficacy**. If patterns depend on an interpreter, are they "in the world" or "in the head"? This threatens the **Compression Criterion** if the pattern vanishes when the interpreter leaves.

  ## V. Conclusion: The Burden of Proof

  For your seminar, the critical takeaway is that the disagreement with your colleague (emergent vs. heuristic) turns on **Desideratum #6 (Causal Efficacy)**.

  *   If they argue patterns are **heuristic**, they are prioritizing **Physical Completeness** and accepting that Design patterns are epistemically useful but ontologically lightweight.
  *   If they argue patterns are **emergent**, they are prioritizing **Causal Efficacy** and must explain how these patterns exert force without violating physical law.

  An adequate theory must not try to hide this trade-off. It must explicitly state whether "realness" entails "causal power" or merely "predictive indispensability." If it claims both, it must solve the Incompatibility Constraint regarding self-modifying systems, or admit that the theory breaks down at the limit of recursive architectural change.
