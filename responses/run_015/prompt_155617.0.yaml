answer: |-
  Your diagnosis of the "ratchet" effect is the key that unlocks the stalemate. You have identified what political theorists call **constitutive endogeneity**: the law does not merely reflect social norms; it constitutes them. Because of this, the Hart–Devlin debate is not primarily an empirical disagreement, nor is it merely verbal. It is a **bedrock normative clash regarding the teleology of law**, which has successfully camouflaged itself as an empirical dispute about social stability.

  Here is the diagnosis of the disagreement's structure, followed by what actual progress would look like.

  ### 1. The Diagnosis: A Normative Clash Masked as Empirics

  The debate appears empirical because Devlin frames his argument as a sociological prediction: *If you remove legal enforcement of morality, society will disintegrate.* Hart counters with a different prediction: *Society is robust enough to tolerate moral pluralism without collapse.*

  However, your "ratchet" insight reveals why this empirical layer is a mirage.

  **The Empirical Route is Closed**
  Devlin's thesis is effectively unfalsifiable due to the endogeneity you spotted. If the state stops enforcing a moral norm and society changes, Devlin can claim this confirms his theory (the bond is broken). If the state continues enforcing it and society remains stable, he claims victory (the law preserved the bond). Because the law is an active ingredient in the "moral consensus" it claims to protect, you cannot run a controlled experiment to see if the consensus would survive without the law. The data is always contaminated by the variable you are testing.

  Therefore, the stalemate is not due to a lack of data. It is because **Devlin is not making a prediction; he is making a definition.**

  **The Bedrock Normative Clash**
  Once the empirical mask slips, the real disagreement is revealed. It is a clash over what the law *is for*.
  *   **Hart's Teleology:** The purpose of law is to manage conflict between autonomous agents. The state is a referee. Its legitimacy derives from protecting the conditions under which individuals can pursue their own conceptions of the good.
  *   **Devlin's Teleology:** The purpose of law is to maintain the identity of the community. The state is a guardian. Its legitimacy derives from preserving the shared ideas that make "society" possible in the first place.

  When Devlin says "society will disintegrate," he does not mean "there will be more violence" (which Hart could empirically refute). He means "the shared conceptual framework that makes us 'us' will vanish." For Devlin, a society that changes its fundamental morals *is* a society that has ended, replaced by a new one.

  This is why they talk past each other. Hart is arguing about the **limits of coercion** in a liberal state. Devlin is arguing about the **conditions of existence** for a communal entity. They are answering separate questions under one heading, as you suspected, but not accidentally. Devlin *needs* it to look like an empirical question about safety to justify what is actually an existential claim about identity.

  ### 2. Why the Stalemate Persists

  The debate hasn't moved because both sides are digging into a **foundational axiom** that cannot be proven without begging the question.

  *   **Hart's Axiom:** Individual liberty is the default; coercion requires specific justification (harm).
  *   **Devlin's Axiom:** Social cohesion is the default; liberty is a privilege granted within the bounds of that cohesion.

  You cannot adjudicate between these axioms using evidence, because evidence is only relevant *after* you decide what counts as a relevant outcome. If you value autonomy above cohesion, Hart wins by definition. If you value cohesion above autonomy, Devlin wins by definition. The "empirical" argument is just a rhetorical tool used to make the axiom look like a fact.

  ### 3. What Would Count as Progress?

  Since the empirical question is contaminated and the normative question is axiomatic, progress cannot come from "solving" the 1960s debate. Progress comes from **dissolving the framework** that makes the debate necessary. Here are three specific paths where actual theoretical movement has occurred or could occur:

  **A. Shift from "Morality" to "Legitimacy" (The Rawlsian Turn)**
  Progress happens when we stop asking "Is this conduct immoral?" and start asking "Whose morality counts?"
  In a pluralistic society, Devlin's "shared morality" is a fiction. There is no single public morality to enforce. Therefore, the state enforcing *one* group's morality over another is not "preserving society"; it is taking a side in a civil conflict.
  *   **Progress Metric:** The debate moves from *whether* to enforce morality to *which* morality can be legitimately enforced in a pluralistic state. This renders Devlin's argument politically obsolete, not because he was empirically wrong, but because his premise (a homogeneous moral community) no longer exists.

  **B. The "Harm" Expansion (The Feminist/Critical Turn)**
  Hart's victory relied on a narrow definition of "harm" (physical/financial). Progress occurred when theorists argued that *social stigma and exclusion* are themselves harms.
  If criminalizing homosexuality creates a caste system, induces psychological trauma, or fosters violence, then the "moral enforcement" *is* the harm.
  *   **Progress Metric:** This turns Devlin's empirical claim against him. Instead of "enforcement prevents disintegration," the argument becomes "enforcement *causes* the social damage Devlin fears." This reclaims the empirical ground by measuring the harm of the law itself, bypassing the ratchet.

  **C. Acknowledging the Ratchet (The Expressive Turn)**
  This is where your insight leads. If we admit that law *manufactures* consensus, the question changes from "Does the law protect morality?" to "Do we want the state engineering our moral character?"
  This forces the Devlinian to drop the "social disintegration" defense and admit to **legal paternalism**. They must argue: "It is good for the state to shape citizens into virtuous people, even if they don't want it."
  *   **Progress Metric:** The debate becomes honest. It stops being about "social safety" and becomes about "state perfectionism." This clarifies the stakes: it is no longer about saving society from collapse, but about whether the state has the right to mold the souls of its citizens.

  ### Summary
  The disagreement is a **bedrock normative clash** (Autonomy vs. Cohesion) that sustains itself by pretending to be an **empirical dispute** (Stability vs. Fragility). Your "ratchet" observation proves the empirical dispute is undecidable.

  Progress is not found in gathering better data on social fragility. It is found in:
  1.  Exposing the **pluralistic reality** that makes Devlin's "shared morality" impossible.
  2.  Counting the **harm of enforcement** (stigma/violence) as part of the harm calculus.
  3.  Forcing the debate onto the terrain of **political legitimacy**: admitting that using law to shape morality is an act of engineering, not preservation.

  The debate stalls when participants pretend they are arguing about facts. It moves when they admit they are arguing about who gets to decide what a human life is for.
