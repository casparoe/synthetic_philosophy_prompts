      *   **(1) Mira:** Argues for *permissiveness*. The source pair `abc → abd` is underdetermined. It supports "successor" AND "replace with d" AND "add one". Since the source doesn't distinguish, players shouldn't be penalized for picking a valid interpretation.
          *   *Strength:* Logically sound regarding the source pair in isolation.
