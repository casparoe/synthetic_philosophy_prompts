          *   (2) Owen: Wins on the necessity of the target context. Analogy requires $A:B :: C:D$. $C$ matters.
          *   (3) Mira: Wins on empirical evidence. Player behavior shows they aren't just copying 'd'.
          *   (4) Owen: Wins on the "Game Design" necessity. A checker must reject *something*.
          *   (5) Mira: Wins on the inconsistency of Owen's "pressure" metric.
