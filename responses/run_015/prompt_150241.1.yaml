      *   **(4) Owen:** Dismisses the empirical prediction (says inconsistency is allowed if concepts are fluid). Makes a *design argument*: If we allow all re-descriptions, the checker accepts everything. We need a constraint to make the game playable.
          *   *Strength:* Pragmatic. A game needs win/loss states.
          *   *Weakness:* The "concepts are fluid" defense weakens his own objective criterion claim.

      *   **(5) Mira:** Traps Owen on the `mrrzzz` case. If "pressure" determines validity, and `zzz` breaks the successor rule, *all* answers should be valid. Owen's criterion fails to distinguish here.
          *   *Strength:* Exposes a hole in Owen's "pressure" logic regarding edge cases.
