      *   **(2) Owen:** Argues for *contextual salience* ("pressure"). The target string (`mrrjjj`) suggests a specific rule (groups/repetition) that makes "add one" plausible, but `ijk` does not suggest "replace with d". The rule must fit the *target* context, not just the source.
