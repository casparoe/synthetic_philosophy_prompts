      *   `mrrjjjj` vs `mrrkkk`: This is about *object identification*. Is the object 'j' or the group 'jjj'?
      *   *Missing Piece:* The concept of **Slippage** or **Mapping Depth**. A rule isn't valid just because it fits the data; it's valid if it preserves the *relational structure* without unnecessary concretization. `ijd` concretizes the output value. `mrrjjjj` concretizes the operation (count vs. value).
      *   *Engineering perspective:* You need a canonical representation of the rule graph, not just input/output matching.

