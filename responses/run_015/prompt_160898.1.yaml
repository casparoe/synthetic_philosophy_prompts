answer: |-
  ### The checklist

  This procedure adapts teleological and informational accounts of content for machine learning systems. It replaces evolutionary history with design history and training objectives. Complete this for every alert spec. Do not proceed to marketing copy until all steps are signed off.

  **1. Identify the Selected Function (Teleological Grounding)**
  Since the system lacks biological evolution, content is fixed by the training objective. Ask: What specific loss function was minimised during gradient descent? Was the model rewarded for detecting a physiological state (e.g., inflammation) or a proxy outcome (e.g., yield drop)? The target of the optimisation defines what the alert is *about*. If the training data labelled images as 'lameness' based on vet diagnosis, the content is lameness. If labelled based on reduced movement alone, the content is immobility. Write this down as the 'Primary Content'. This step anchors the teleological account: the alert misrepresents if it fails to perform this specific function, regardless of current correlations.

  **2. Identify the Informational Covariance (Indicator Grounding)**
  Ask: What physical state does the signal currently covary with under field conditions? Run a correlation check against ground truth data collected post-deployment. If the alert fires when the Primary Content is absent but another factor is present (e.g., mud on the lens), the signal *indicates* mud, even if it is *about* lameness. Informational accounts require reliable covariance. If the correlation coefficient drops below 0.85 in specific contexts, note these as 'Compromised Conditions'. This distinguishes what the system is doing (indicating) from what it is for (aboutness).

  **3. Specify Normal Conditions**
  Informational accounts fail without specifying 'normal conditions'. List the environmental constraints required for the covariance in Step 2 to hold. Include lighting levels, camera angles, accelerometer attachment tightness, and barn cleanliness. If the system was trained on clean data but deployed in muddy yards, the normal conditions are violated. The alert does not misrepresent when conditions are abnormal; it simply ceases to carry information. Define these boundaries clearly to prevent false accusations of system error when the environment is at fault.

  **4. Define Misrepresentation Conditions**
  Combine Steps 1 and 2 to define error. A false positive is a misrepresentation only if the Selected Function was to detect X, the Normal Conditions obtained, but X was absent. If the system was trained to detect yield drops (Step 1) but fires when heat stress is present without yield drop, it is not misrepresenting; it is functioning correctly according to its design, even if marketed otherwise. A false negative is a miss where X was present, conditions were normal, but the signal failed. Distinguish these from 'System Limitations' where conditions were abnormal. This protects the company from liability when the farm environment violates the spec.

  **5. Separate Aboutness from Indication**
  Compare Step 1 and Step 2. If they diverge, you have a theoretical conflict. For example, if the alert is *about* milk yield (Step 1) but *indicates* panting (Step 2), you must declare which takes precedence in the spec. For welfare alerts, prioritise Step 1 (design intent) to ensure ethical alignment. For efficiency alerts, Step 2 (covariance) may suffice. Flag any divergence as 'Content Tension'. Do not allow marketing to conflate the two. If the alert indicates heat but is about yield, the copy must not claim it detects heat stress physiologically.

  **6. Define Permissible Inference (Evidence)**
  Determine what the farmer is entitled to conclude. An alert being *about* X does not mean X is definitely present; it means there is good evidence for X. Specify the posterior probability required for action. If the false positive rate is 10%, the farmer cannot conclude 'This cow is lame' but only 'This cow requires inspection'. Distinguish between 'Diagnostic certainty' (vet only) and 'Screening evidence' (farmer). This prevents over-reliance on the system. The spec must state: 'This alert provides evidence for X, not confirmation of X.'

  **7. Marketing Alignment Check**
  Finally, compare the drafted customer-facing copy against Step 1 (Primary Content). If the copy claims the alert detects a physiological state but Step 1 says it detects a behavioural proxy, rewrite the copy. Marketing often slides from 'indicates' to 'detects'. Enforce the distinction. If the system indicates heat stress but is about yield, the copy must read 'Alerts on productivity changes associated with heat' rather than 'Detects heat stress'. This ensures legal and ethical compliance with the philosophical spec.

  ### Stop and handover points

  This procedure is not autonomous; it requires human judgement at specific friction points. You must halt and escalate to the senior engineer or company vet in the following three scenarios. Do not attempt to resolve these alone.

  First, hand over when **Content Tension** is flagged in Step 5. If the teleological content (design intent) diverges from the informational content (current covariance), this is a theoretical deadlock. For example, if the model was trained on yield but correlates with pain, you cannot decide which defines the alert's meaning. This is a values question. The vet must decide whether welfare (pain) or economics (yield) takes precedence in the spec. If the vet chooses welfare, the model may need retraining. Record the decision explicitly: 'Vet elected to prioritise welfare content over training history.'

  Second, escalate when **Normal Conditions** cannot be met in practice. If Step 3 reveals that the system only works in clean, dry conditions but the typical client farm is muddy and dark, this is a deployment risk. The engineer must decide if the hardware can be improved or if the spec must warn the farmer that reliability will drop. This is a practical engineering constraint, not a philosophical one. Do not write a spec that assumes ideal conditions if the product will not operate in them.

  Third, stop when **Permissible Inference** carries regulatory risk. If Step 6 suggests the farmer can treat based on the alert alone, but veterinary regulations require a physical diagnosis for certain conditions (e.g., mastitis medication), you must hand over to the vet. They must confirm that the alert spec complies with veterinary medicine regulations. You are defining content; they are defining legal liability. If the alert implies a diagnosis that only a vet can make, the spec must be downgraded to 'inspection recommended' regardless of the system's accuracy.

  ### Three worked cases

  **1. Lameness Alert (Leg Accelerometer)**
  *Step 1 (Function):* Training objective was minimising error against vet-labelled gait asymmetry. Primary Content: 'Gait Asymmetry consistent with lameness'.
  *Step 2 (Covariance):* Signal covaries strongly with hoof lesions (0.92) but also with fresh bedding sticking to legs (0.65).
  *Step 3 (Conditions):* Requires accelerometer attached firmly to hind leg above hoof.
  *Step 4 (Misrepresentation):* Fires with clean leg and symmetrical gait = False Positive. Fires with lesion but silent = False Negative.
  *Step 5 (Tension):* Low tension. Design and covariance align on gait.
  *Step 6 (Inference):* Farmer concludes 'Check hoof', not 'Trim hoof'.
  *Step 7 (Marketing):* Copy 'Detects gait asymmetry' is accurate. 'Detects lameness' is acceptable shorthand given Step 1.
  *Verdict:* Spec approved. Clear teleological grounding.

  **2. Pain Face Classifier (Barn Camera)**
  *Step 1 (Function):* Training objective was minimising error against human-labelled images of 'grimacing'. Primary Content: 'Human-identified facial tension'.
  *Step 2 (Covariance):* Covaries with physiological pain markers (0.75) but also with chewing cud (0.60).
  *Step 3 (Conditions):* Requires cow facing camera, head clear of barrier.
  *Step 4 (Misrepresentation):* Fires when cow is chewing comfortably = Misrepresentation of pain, but correct function of 'tension detector'.
  *Step 5 (Tension):* High tension. Design is about human labels, not necessarily pain itself.
  *Step 6 (Inference):* Farmer concludes 'Observe behaviour', not 'Administer analgesia'.
  *Step 7 (Marketing):* Copy 'Detects pain' is false. Must read 'Detects facial expressions associated with discomfort'.
  *Verdict:* Spec flagged. Content is 'expression', not 'pain'. Vet to confirm welfare protocol.

  **3. Heat-Stress Alert (Flagship Product)**
  *Step 1 (Function):* Training objective was minimising error against milk-yield drop events. Primary Content: 'Imminent reduction in milk yield'.
  *Step 2 (Covariance):* Covaries with high ambient temperature and panting (0.88).
  *Step 3 (Conditions):* Requires accurate yield logging.
  *Step 4 (Misrepresentation):* Fires when cow is hot but yield holds = Not a misrepresentation per Step 1.
  *Step 5 (Tension):* Critical tension. Alert is *about* yield, *indicates* heat.
  *Step 6 (Inference):* Farmer concludes 'Check cooling', not 'Cow is suffering'.
  *Step 7 (Marketing):* Current copy 'Detects heat stress' is misleading. It detects yield risk.
  *Verdict:* Spec rejected for current copy. Must disclose yield basis. This exposes the product as economic, not welfare-focused. Boss may resist, but procedure dictates this distinction.

  ### What this can't do

  This procedure clarifies content, but it does not guarantee truth or moral rectitude. It is a tool for consistency, not a solution to the hard problems of AI ethics. You must recognise its limitations to avoid overconfidence in the specs you produce.

  First, it cannot fix bad training data. If the human labels used in Step 1 were biased or incorrect (e.g., vets misdiagnosed lameness in the training set), the teleological content will be flawed. The procedure will faithfully document that the alert is 'about' incorrect diagnoses. It identifies the content, but cannot validate the ground truth. You need separate data auditing for that.

  Second, it does not solve the disjunction problem. If a state fires for 'heat stress OR yield drop', the procedure helps you choose which to prioritise, but it cannot metaphysically determine which one is the 'real' content without human stipulation. Where the procedure says 'unsettled', you are making a choice, not discovering a fact. Own that decision in the documentation.

  Third, it does not absolve moral responsibility. Even if the spec correctly states that an alert is 'about yield' and not 'welfare', deploying it in a way that farmers treat it as a welfare tool remains an ethical risk. The procedure protects the company from false claims, but not from the consequences of known misunderstandings. If you know marketing will ignore the distinction in Step 7, flagging it in the spec is necessary but insufficient. You may need to escalate further.

  Finally, this procedure assumes the system is static. In continuous learning systems, Step 1 (design history) changes as the model retrains on farm data. The content can drift over time. This checklist is a snapshot. You must repeat it whenever the model is retrained. If you do not, the spec will describe a system that no longer exists.
