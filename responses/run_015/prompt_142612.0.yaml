prompt: |-
  Eighteen months ago my father died and left my sister and me joint control of the small charitable fund he had set up. The deed gives each of us an independent annual allocation — roughly forty thousand pounds apiece — to disburse as we each see fit, provided only that it reaches a registered charity. Over the past two years my sister and I have discovered that we disagree about nearly every grant either of us proposes: I want the money to go where it does the most measurable good per pound, she wants it to go to the hospice and the parish youth work in the village where we grew up. We have been splitting the difference, and both of us now leave every meeting feeling that our half was simply wasted.

  A friend who works in philanthropy told me that what we have been groping toward has a name — moral trade — and I have since read just enough about it to think the fit is genuine but not perfect. Next month I have to put the idea to the fund's advisory panel in about forty minutes with nothing but a whiteboard. The panel is my sister; our father's old colleague, a retired actuary; and my cousin, a hospice nurse. None of the three has any philosophy or economics. My sister is quick, allergic to jargon, and will treat any hint of condescension as evidence that the whole scheme is a device for pointing her money at my causes.

  One complication runs through all of this and I do not know where in the session it belongs. My sister's objection to my preferred grants is not that she ranks them below hers. She holds that there are things she must not fund — that to direct money to them would be to cooperate in something seriously wrong, and that this remains true whatever she might get in return. I cannot tell whether that closes off the idea entirely or only forces us to look for a different lever, and I would rather find out from you than in front of her.

  So please do not explain moral trade to me; plan how I should explain it to them. I want: the order in which the component ideas have to arrive and what each one depends on, including what must be in place before a trade so much as looks available to people who share no scale of value; the single example that should carry the whole thing, what it must contain and what it must carefully not contain, and why that example rather than the vegetarianism-for-bednets sort of case, or rather than our own disagreement; the misconceptions to expect, in the order they will actually arise, with the point in the sequence at which each should be headed off — that it is just compromise, that it is vote-trading, that it is bribery, that a person who will act against her own convictions for a price never had any, that if her view is mistaken I should not be paying her to act on it, that we should simply argue until one of us wins, that if she would have funded the hospice anyway my concession buys nothing, and that both of us have an incentive to overstate how much we would hate conceding; where in the sequence my sister's constraint should enter and what the honest answer is about whether someone with a constraint of that shape can trade at all; one question I can ask at the end that would show the idea had landed rather than merely been endured; and what I should openly decline to explain at this level, naming it as a refusal. I am not asking you to adjudicate our disagreement about which causes are worth funding, and please do not point me to anything to read — I want the shape of the session, not sources.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**

      *   **Goal:** Plan a 40-minute presentation to a specific advisory panel (Sister, Retired Actuary, Hospice Nurse Cousin) about implementing "moral trade" within their charitable fund.
      *   **Context:** Father died 18 months ago. Joint control. Independent annual allocations (£40k each). Disagreement on causes (Effective Altruism vs. Local/Community). Current "splitting the difference" makes both feel money is wasted.
      *   **Audience:**
          *   Sister: Quick, allergic to jargon, sensitive to condescension, suspects manipulation.
          *   Retired Actuary: Likely numerical, pragmatic, understands risk/value but no philosophy/econ.
          *   Hospice Nurse Cousin: Practical, care-focused, likely aligned with Sister's values but professional perspective.
          *   *Constraint:* None have philosophy/economics background.
      *   **Specific Constraint (The "Complication"):** Sister has deontological constraints (some things she *must not* fund, regardless of outcome). This might block trade. Needs to be addressed carefully.
      *   **Deliverables:**
          *   Order of component ideas (dependencies).
          *   The Single Example (content, exclusions, why this one).
          *   Misconceptions (order of arrival, when to head off).
          *   Handling the Sister's Constraint (where it enters, honest answer on tradability).
          *   Closing Question (proof of understanding).
          *   What to Decline to Explain (boundary setting).
      *   **Tone:** Practical, respectful, non-condescending, clear structure for a whiteboard session. No reading lists, no adjudication of the actual cause dispute.

  2.  **Deconstruct the Challenge:**

      *   *The Core Tension:* Moral trade usually relies on consequentialist logic (maximizing good). The Sister operates on deontological logic (constraints on action). If she thinks funding X is *sinful/wrong*, she won't trade her vote on X for Y, even if Y is great.
      *   *The Audience Dynamic:* The Sister is the primary obstacle/opponent but also the key partner. The Actuary and Nurse are swing votes/witnesses. If the Sister feels manipulated, the session fails.
      *   *The Time Limit:* 40 minutes is tight for a conceptual shift. Needs high impact, low abstraction.
      *   *The "Whiteboard" Aspect:* Visual aids need to be simple.

  3.  **Drafting the Plan - Section by Section:**

      *   **Order of Ideas:**
          1.  Acknowledge the status quo (waste/frustration).
          2.  Define the goal (more good done, not just compromise).
          3.  Introduce the mechanism (trading *control*, not *values*).
          4.  The Example (concrete illustration).
          5.  Addressing Constraints (the Sister's specific worry).
          6.  Safeguards/Misconceptions.
          *Dependency:* You can't trade until you agree the status quo is suboptimal. You can't understand trade until you see it's not compromising values. You can't apply it until you know constraints are respected.

      *   **The Single Example:**
          *   *Why not Vegetarianism/Bednets?* Too abstract, political, implies one side is "wrong."
          *   *Why not Our Disagreement?* Too charged, triggers defensiveness immediately.
          *   *What works?* Needs to be neutral, high-stakes, clear preference intensity.
          *   *Idea:* Two donors, two projects. Donor A cares 10x more about Project 1. Donor B cares 10x more about Project 2.
          *   *Refinement:* Let's use a community scenario similar to theirs but distinct. A "Village Hall" vs. "School Library." Or perhaps something even simpler. Let's go with two neighbors and a fence/tree. No, needs to be charitable.
          *   *Selected Example:* Two donors (Alice & Bob). Alice cares deeply about Local Art. Bob cares deeply about Cancer Research. Both have £10k.
          *   *Wait, better:* Use the Actuary's language. "Utility." No, too jargon.
          *   *Best:* "The Two Donors and the Two Causes." Keep it generic but relatable.
          *   *Crucial:* Must show *intensity* of preference, not just ranking.
          *   *Exclusions:* Do not imply one cause is objectively better. Do not use their actual causes yet.

      *   **Misconceptions (Order & Timing):**
          1.  *It's just compromise:* Head off early (Minute 5).
          2.  *Vote trading/Bribery:* Head off during mechanism explanation (Minute 15).
          3.  *Integrity/Convictions:* Head off before the Sister's constraint discussion (Minute 25).
          4.  *Strategic Overstatement:* Head off during safeguards (Minute 30).
          5.  *Counterfactuals (Would have funded anyway):* Head off during safeguards.
          *Strategy:* Weave these into the flow rather than a Q&A list.

      *   **The Sister's Constraint (The Hard Part):**
          *   *Where:* After the example, before finalizing the proposal.
          *   *Honest Answer:* If an action is morally forbidden (deontological constraint), it cannot be traded *directly*. However, we can trade *other* decisions where no constraint exists. Or, we trade based on *intensity* of preference on permissible items.
          *   *Nuance:* If she thinks *my* cause is sinful, she can't fund it. But she can give me control of *her* money for *my* cause, provided *she* isn't the one signing the check (structural separation)? No, that's too legalistic.
          *   *Better:* Acknowledge that some things are off-limits. Trade only happens in the "permissible zone." If the overlap is too small, trade fails. This validates her integrity.

      *   **Closing Question:**
          *   Needs to test understanding, not agreement.
          *   "What would make this unacceptable to you?" (Too negative).
          *   "How would we know if this failed?"
          *   *Best:* "If we did this, what would you need to see in the minutes to know your values weren't compromised?"

      *   **What to Decline:**
          *   Deep philosophical justification (Utilitarianism vs. Deontology).
          *   Valuation of specific causes (which is better).
          *   *Refusal:* "I will not argue that my causes are better than yours today."

  4.  **Refining the Flow (Timing Check):**

      *   0-5 mins: Status Quo & Goal.
      *   5-15 mins: The Concept (via Example).
      *   15-25 mins: Misconceptions (Bribery, Compromise).
      *   25-35 mins: The Constraint (Sister's specific worry).
      *   35-40 mins: Closing Question & Next Steps.

  5.  **Addressing Specific Prompt Requirements:**

      *   *Dependencies:* Make sure the plan explicitly states what relies on what.
      *   *Example:* Must specify what it contains/doesn't contain.
      *   *Misconceptions:* List specific ones requested (compromise, bribery, convictions, etc.) and place them.
      *   *Constraint:* Specific section on the "must not fund" issue.
      *   *Decline:* Specific section on what not to explain.

  6.  **Self-Correction/Polishing:**

      *   *Critique:* Is the example too abstract?
      *   *Fix:* Make the example about *intensity*. "Alice loses sleep if Art doesn't get funded. Bob loses sleep if Cancer doesn't."
      *   *Critique:* How to handle the "Bribery" accusation?
      *   *Fix:* Emphasize the money stays in charity. No personal gain.
      *   *Critique:* The Sister's constraint is the dealbreaker.
      *   *Fix:* Be very clear: "You never fund what you forbid." You only cede control of *your* allocation to *me*, so *I* make the decision. Or, we only trade on causes you find neutral, not forbidden. Actually, the cleanest moral trade in this context is: "I give you my £40k to spend entirely on your causes; you give me your £40k to spend entirely on mine." *Wait, does that violate her constraint?* If she signs the check for my cause, yes. If she delegates authority *legally* so it's my decision, maybe.
      *   *Correction:* The prompt says "independent annual allocation... to disburse as we each see fit." If she transfers her allocation to me, *I* disburse it. She is not cooperating in the act. This is the key distinction. She isn't funding the "sinful" thing; she is empowering *me* to fund it with *my* judgment. I need to make sure this distinction is clear in the "Constraint" section.
      *   *Wait, re-reading the prompt:* "provided only that it reaches a registered charity." They have joint control but independent allocation.
      *   *The Trade:* I let you spend my £40k on Hospice. You let me spend your £40k on Global Health.
      *   *The Constraint:* She believes funding Global Health is *wrong*. If she allows me to use her allocation for that, is she cooperating?
      *   *Resolution:* This is the crux. I must advise the user to address this honestly. If she views *delegating authority for a forbidden act* as cooperation, trade is impossible on those items. The plan must reflect this uncertainty and suggest testing the boundary without crossing it.
      *   *Revised Plan for Constraint:* Place it late. Acknowledge that if delegation = cooperation, then those items are off the table. Trade requires a "zone of permission."

  7.  **Final Review against constraints:**
      *   No reading lists.
      *   No adjudication of causes.
      *   40 minutes.
      *   Whiteboard focus.
      *   Address all specific misconceptions listed in the prompt.

  8.  **Final Polish of the Plan:** (Drafting the response with the structured headings requested). *Self-correction on the "Decline" section:* The prompt asks what I should openly decline to explain. I should decline to explain *why* my causes are better. That keeps the peace.

      *   *Wait, one more check on the Example:* The prompt asks why *not* the vegetarianism/bednets case. I need to explain that in the plan. (Because it implies one side is irrational/immoral). Why not *our* disagreement? (Too emotional).
      *   *Misconceptions:* I need to make sure I hit the specific list: compromise, vote-trading, bribery, convictions, mistaken view/pay to act, argue until win, counterfactual funding, overstating hate. That's a lot for 40 mins. I need to group them or prioritize. The prompt says "in the order they will actually arise... with the point in the sequence at which each should be headed off." I will integrate them into the flow.

      *(Self-Correction on Misconceptions)*: I cannot address all 8 individually in a 40-minute talk without it becoming a defensive lecture. I must group them logically.
      1. Compromise (Early).
      2. Bribery/Vote Trading (During Mechanism).
      3. Convictions/Mistaken View (During Constraint).
      4. Argue/Counterfactual/Overstating (During Safeguards).
