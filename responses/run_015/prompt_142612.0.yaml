answer: |-
  Here is the plan for your forty-minute session. It is designed to be drawn on the whiteboard as you speak.

  ### 1. Order of Component Ideas
  *Dependencies are noted in brackets.*

  1.  **The Diagnosis (Minutes 0–5):** Establish that the current "split the difference" approach is inefficient. [Depends on: Shared desire to honour the father's intent.]
  2.  **The Mechanism (Minutes 5–15):** Introduce the concept of trading *control*, not *values*. [Depends on: Acceptance of the Diagnosis.]
  3.  **The Safeguards (Minutes 15–25):** Pre-emptively address corruption and integrity. [Depends on: Understanding the Mechanism.]
  4.  **The Constraint (Minutes 25–35):** Address the moral boundary regarding "forbidden" acts. [Depends on: Trust in the Safeguards.]
  5.  **The Trial (Minutes 35–40):** Propose a one-year pilot. [Depends on: Resolution of the Constraint.]

  ### 2. The Single Example
  *Do not use the vegetarian/bednets case, and do not use your actual dispute yet.*

  *   **The Scenario:** Draw two stick figures, "Alice" and "Bob." Each has £10,000. There are two charities: "Local Park" and "Global Vaccines."
  *   **The Preferences:**
      *   Alice *prefers* the Park, but only slightly. She thinks Vaccines are fine, just less personal.
      *   Bob *prefers* Vaccines intensely. He thinks the Park is nice, but Vaccines save lives.
      *   *Crucially:* Alice cares about the Park at a "3 out of 10" intensity. Bob cares about Vaccines at a "10 out of 10" intensity.
  *   **The Trade:** Alice gives her £10k to Bob to spend on Vaccines. Bob gives his £10k to Alice to spend on the Park.
  *   **The Outcome:** The Park gets funded (by Bob's money). Vaccines get funded (by Alice's money).
      *   Alice is happier (she got her "3" cause funded, plus she knows Bob is ecstatic about his "10").
      *   Bob is happier (he got his "10" cause funded with double the money).
      *   Total good done is higher because money went where the *intensity* of care was highest.
  *   **What it must contain:** Explicit mention that neither person changes their mind about which cause is better. Alice still likes the Park best *for herself*.
  *   **What it must not contain:** Any suggestion that Vaccines are *objectively* better than the Park. If the example implies one side is morally superior, your sister will reject the premise as a trojan horse for your values.
  *   **Why this example:** It isolates *intensity of preference* from *moral ranking*. The vegetarian/bednets case fails because it usually implies one moral view is correct and the other is mistaken. Your actual dispute fails because it is too emotionally charged to serve as a neutral model. This example creates a "sandbox" where the math works without triggering defensiveness.

  ### 3. Misconceptions: Order and Timing
  *Head these off before they are voiced. Do not wait for questions.*

  1.  **"This is just compromise." (Minute 5)**
      *   *When:* Immediately after the Diagnosis.
      *   *Head off:* Draw a line down the middle of the board. Left side: "Compromise" (we each fund half of what we want). Right side: "Trade" (we each fund all of what we want, using each other's resources). Emphasize that in compromise, both lose value; in trade, both gain leverage.
  2.  **"This is vote-trading or bribery." (Minute 15)**
      *   *When:* As you draw the arrows of money exchange in the Example.
      *   *Head off:* State clearly: "No money enters our pockets. No personal favours are exchanged. The money stays in the charitable stream. We are trading *decision rights*, not cash."
  3.  **"A person who acts against convictions for a price has no convictions." (Minute 25)**
      *   *When:* Just before opening the floor to the Sister's specific constraint.
      *   *Head off:* "This is not about changing your mind. It is about acknowledging that I care more about X than you do, and you care more about Y than I do. You are not acting against your convictions; you are respecting my intensity on a matter where you are neutral."
  4.  **"If her view is mistaken, I shouldn't pay her to act on it." / "We should argue until one wins." (Minute 25)**
      *   *When:* Simultaneously with the convictions point.
      *   *Head off:* "We are not adjudicating who is right today. Even if one of us is objectively wrong, forcing the other to concede creates resentment and wastes the fund's potential. This mechanism works *regardless* of who is morally correct."
  5.  **"If she would have funded the hospice anyway, my concession buys nothing." / "We have an incentive to overstate how much we would hate conceding." (Minute 30)**
      *   *When:* During the Safeguards section.
      *   *Head off:* "We need transparency. We must declare our 'baseline'—what we would fund without trade. We only trade the *surplus*. And to prevent bluffing, we start with a one-year pilot where we review the 'intensity' claims honestly."

  ### 4. The Sister's Constraint
  *Where it enters and the honest answer.*

  *   **Placement:** Minute 25. This is the pivot point. Do not introduce the example until the panel accepts that constraints are respected.
  *   **The Whiteboard Visual:** Draw a circle labeled "Permissible Actions." Draw a shaded wedge inside labeled "Forbidden."
  *   **The Honest Answer:**
      *   Acknowledge explicitly: "If you believe funding [My Cause] is morally forbidden cooperation, you cannot trade your allocation to me for that purpose. Delegation does not absolve you if you view the outcome itself as sinful."
      *   The Lever: "Trade is only possible in the 'Permissible' zone. If there are causes you are *neutral* on (not forbidden, just less preferred), we can trade there. If your constraint covers everything I propose, then trade is impossible, and we return to the status quo."
      *   *Why this works:* It validates her integrity. It shows you are not trying to circumvent her conscience. It forces the question: "Is there *anything* my brother wants to fund that is not sinful, just less important to me?" If the answer is no, the session ends honestly without damage. If the answer is yes, you have a path forward.

  ### 5. The Closing Question
  *Do not ask "Do you agree?" Ask a question that requires them to simulate the process.*

  **"If we run this pilot for one year, what specific line item in the minutes would convince you that your values had not been compromised?"**

  *   *Why:* This shifts them from evaluating the *theory* to evaluating the *implementation*. It gives your sister control over the verification process. If she can articulate a safeguard, she has accepted the premise.

  ### 6. What to Decline to Explain
  *You must set a boundary to prevent the session from becoming a debate on cause efficacy.*

  **The Refusal:**
  "I am not going to argue today that my preferred causes are more effective than yours, nor will I defend your causes against my criteria. This proposal is designed to work *without* us agreeing on that. If we cannot agree on the mechanism, we can argue about the causes next month, but I ask that we keep today strictly about how we manage our disagreement, not who is right."

  *   *Why:* If you allow the efficacy debate, the Actuary will try to solve it with numbers, the Nurse with care ethics, and your Sister with moral intuition. You will run out of time. This refusal keeps the whiteboard focused on the *structure* of the fund, not the *content* of the grants.
