answer: |-
  **Module:** Political Philosophy and Relational Ethics
  **Assessment:** Final Examination
  **Time Allowed:** 2 Hours

  ***

  ### Essay Question

  In a jurisdiction that formally recognises customary law, an elder asserts that a deceased community member's estate must be distributed according to obligations of reciprocal care rather than individual testamentary freedom. The elder argues that the deceased was never an autonomous proprietor but a node in a network of living kin and ancestors.

  Critically analyse how an Ubuntu-informed relational conception of personhood — the idea that personhood is constituted through others, often captured in the phrase *I am because we are* — challenges liberal assumptions about moral autonomy and property rights. In your response, you must evaluate whether this relational framework can accommodate what is termed **interstitial agency**: the capacity of an individual to renegotiate obligations without thereby dissolving into a self-defining, atomistic subject.

  ***

  ### Model Answer

  The elder's assertion foregrounds a fundamental ontological clash between relational ethics and liberal legalism. At the heart of this dispute lies the conception of the person. To evaluate the claim, one must first articulate the relational ontology underpinning Ubuntu, contrast it with methodological individualism, and determine whether a space for agency exists within the network of obligation.

  Ubuntu posits that personhood is not a biological given but a moral achievement contingent upon social recognition. The maxim *umuntu ngumuntu ngabantu* (a person is a person through other people) signifies that identity is constituted through relationships. One does not exist prior to community; rather, one becomes a full person only through participation in reciprocal networks of care. In this framework, the deceased is not a discrete unit whose existence ends at death, but a node whose continuity depends on the proper maintenance of kinship ties. Property, therefore, is not an external object owned by a sovereign self, but a resource entrusted to the living to sustain the network that includes the ancestors. To treat the estate as disposable private property is to misunderstand the metaphysical status of the deceased; it is to treat a relational node as an atomistic owner.

  This stands in stark contrast to the liberal assumption of methodological individualism. Liberal political philosophy typically presupposes the individual as the primary unit of moral value, possessing rights and capacities prior to social engagement. Autonomy is defined negatively as freedom from interference, and property rights are viewed as extensions of individual will—a zone of exclusion where the owner's sovereignty is absolute. In this view, testamentary freedom is the ultimate expression of autonomy: the right to dispose of one's holdings as one sees fit, irrespective of communal need. The liberal subject owns property; the Ubuntu subject is owned by the relationships that property sustains. Where liberalism sees a restriction of freedom in the elder's claim, Ubuntu sees the necessary condition for personhood.

  The critical challenge, however, is whether this relational density permits agency. If one is wholly constituted by others, is there room for renegotiation, or is the subject merely a vessel for tradition? This is the problem of interstitial agency. A robust relational framework does not require the dissolution of the individual into the collective. Instead, agency is located in the interstices of relationships—the space where obligations are interpreted, contested, and renewed. Agency is not the power to sever ties (which would be atomism), but the capacity to navigate them responsibly. An individual within an Ubuntu framework can renegotiate obligations, provided such negotiation aims to restore or strengthen the network rather than escape it. For instance, a community member might argue for a different distribution of an estate if the traditional arrangement would cause harm to the kinship network itself. This is not liberal autonomy; it is relational responsibility exercised through dialogue. Therefore, interstitial agency is coherent within Ubuntu, provided it is understood as competence within a context rather than independence from context.

  The implication for legal practice is profound. A court operating within this jurisdiction cannot simply adjudicate based on static rules of inheritance or strict testamentary validity. Instead, institutional design must prioritise restorative processes over adversarial judgement. Legal mechanisms should facilitate family councils or mediation forums where the network of obligations can be openly discussed and the estate distributed in a manner that reaffirms relationships. The law should not enforce a specific outcome so much as enforce the process of relational negotiation. This ensures that the 'node' is honoured without freezing the network in time, allowing for interstitial agency to function within a recognised legal structure.

  In conclusion, the elder's claim challenges the liberal fiction of the autonomous proprietor by asserting the primacy of the relational network. Ubuntu ontology reframes property as a tool for sustaining personhood rather than a right of exclusion. Crucially, this does not erase agency but relocates it. Interstitial agency allows individuals to renegotiate obligations without becoming atomistic, provided the goal remains the flourishing of the community. Legal institutions must therefore shift from enforcing individual will to facilitating relational continuity.

  ***

  ### Marking Scheme

  **Total Marks:** 20
  **Criteria:** 5 (4 marks each)

  | Criterion | Focus |
  | :--- | :--- |
  | **1. Relational Ontology** | Articulation of Ubuntu's conception of personhood and property. |
  | **2. Liberal Contrast** | Clarity of distinction between relationality and methodological individualism. |
  | **3. Interstitial Agency** | Evaluation of whether agency can exist without atomism. |
  | **4. Practical Implication** | Identification of a concrete legal or institutional consequence. |
  | **5. Coherence & Style** | Argumentative flow, clarity, and adherence to academic convention. |

  #### Grade Band Descriptors

  **A-Range (16–20 Marks)**
  *   **Conceptual Depth:** Demonstrates a sophisticated understanding of Ubuntu ontology, moving beyond cliché to explain the metaphysical status of the deceased and property.
  *   **Critical Evaluation:** Offers a nuanced judgement on interstitial agency, successfully resolving the tension between obligation and renegotiation without retreating into liberal individualism.
  *   **Application:** The practical implication is innovative and logically derived from the philosophical argument.
  *   **Structure:** The essay is seamlessly integrated, with clear transitions between ontological analysis and normative evaluation. British English spelling and grammar are flawless.

  **B-Range (12–15 Marks)**
  *   **Conceptual Depth:** Accurately describes Ubuntu and liberal individualism but may rely on general descriptions rather than precise philosophical articulation.
  *   **Critical Evaluation:** Addresses interstitial agency but may struggle to fully explain how renegotiation occurs without becoming atomistic; the judgement may be somewhat tentative.
  *   **Application:** The practical implication is relevant but may be generic (e.g., "courts should be fair") rather than specific to institutional design.
  *   **Structure:** The argument is clear and logical but may feel segmented (e.g., distinct blocks for each requirement rather than a flowing argument). Minor errors in British English conventions.

  **Fail Range (Below 10 Marks)**
  *   **Conceptual Depth:** Misinterprets Ubuntu as mere collectivism or fails to distinguish it clearly from liberalism.
  *   **Critical Evaluation:** Fails to address interstitial agency, or argues that relationality completely extinguishes individual agency.
  *   **Application:** No concrete implication is offered, or the implication contradicts the philosophical argument presented.
  *   **Structure:** The essay lacks coherence, ignores the hypothetical scenario, or suffers from significant language errors that impede understanding.

  #### Criterion-Specific Mark Allocation (4 Marks per Criterion)

  *   **4 marks:** Insightful, precise, and fully developed.
  *   **3 marks:** Competent and accurate, but lacks depth or nuance.
  *   **2 marks:** Basic understanding with significant gaps or vagueness.
  *   **1 mark:** Minimal engagement with the specific criterion.
  *   **0 marks:** Criterion not addressed or fundamentally incorrect.
