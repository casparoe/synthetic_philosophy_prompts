prompt: |-
  I am drafting the final examination for an upper-level module on political philosophy and relational ethics. I need a single essay question, together with a model answer of approximately 800 words and a detailed marking scheme. The question should present the following hypothetical: in a jurisdiction that formally recognises customary law, an elder asserts that a deceased community member's estate must be distributed according to obligations of reciprocal care rather than individual testamentary freedom, arguing that the deceased was never an autonomous proprietor but a node in a network of living kin and ancestors. Students must be asked to analyse how an Ubuntu-informed relational conception of personhood — the idea that personhood is constituted through others, often captured in the phrase I am because we are — challenges liberal assumptions about moral autonomy and property rights. Crucially, they should not merely summarise this contrast; the question must compel them to evaluate whether relational personhood can accommodate what I term interstitial agency — the capacity of an individual to renegotiate obligations without thereby dissolving into a self-defining, atomistic subject. The model answer should contain four specific moves: a precise articulation of Ubuntu's relational ontology; a clear contrast with methodological individualism; a reasoned judgement on the coherence of interstitial agency within relational frameworks; and one concrete implication for either legal practice or institutional design. The marking scheme should allocate 20 marks across five criteria (each worth 4 marks), and must explicitly state what separates an A-range response (16–20) from a B-range (12–15) and from a failing answer (below 10). Every element of the prompt and the answer should be written in British English. Do not include bibliographies, reading lists, or requests for citations; the answer must stand on conceptual argument alone.
