answer: |-
  This is a sharp observation, and you are right to press your colleagues. What you are describing is distinct from the standard "Bank Cases" (Stanley, Fantl & McGrath) because the shift in stakes is not contemporaneous with the belief formation or the initial attribution, but *retrospective*.

  In the standard Pragmatic Encroachment (PE) literature, the stakes must be salient *to the subject* (or objectively obtain) at the time of belief to affect the knowledge status. Your students, however, are letting the *current* context of the attributor (you and them, knowing the outcome/stakes now) overwrite the *past* context of the subject.

  There isn't one canonical noun for this, but there are three established frameworks that claim it, explain it away, or study it. Depending on whether you view your students' intuition as a *feature* of knowledge or a *bug* in their psychology, you should look at these three notions.

  ### 1. The Semantic Account: Assessment-Sensitivity
  If you take your students' intuitions at face value (i.e., the truth value of "S knew p" actually changes based on later information), the technical term you want is **Assessment-Sensitive Truth** (or **Relativism**).

  *   **The Proponent:** John MacFarlane (*Assessment Sensitivity*, 2014).
  *   **The Mechanism:** In standard Contextualism (DeRose), the truth of "S knows p" is fixed by the context of the *speaker* at the time of utterance. In Relativism, it is fixed by the context of *assessment*.
  *   **Why it fits:** This allows a claim made on Tuesday ("She knows") to be true relative to Tuesday's context of assessment, but false relative to Friday's context of assessment (once the life-or-death stakes are revealed).
  *   **The Name:** **Retrospective Assessment-Sensitivity**.
  *   **Does it fit your cases?** Perfectly. It explains why the verdict tracks "where the discussion has got to" rather than the thinker's state at the time. For a relativist, knowledge is not a property you "have or lack at a time" in an absolute sense; it is a property you have relative to an assessor's context.

  ### 2. The Normative Account: Knowledge Norms of Action
  If you think the shift isn't about truth conditions but about *responsibility*, you are looking at the **Knowledge Norm of Action** combined with **Retrospective Evaluation**.

  *   **The Proponent:** Timothy Williamson (*Knowledge and Its Limits*), extended by others in action theory.
  *   **The Mechanism:** Knowledge is the norm of practical reasoning. We judge whether someone "knew" by checking if they were licensed to act.
  *   **Why it fits:** In Case 1, because the action turned out to be life-critical, we retroactively judge that the license to act (knowledge) was insufficient. We are conflating *epistemic standing* with *practical licensing*.
  *   **The Name:** **Teleological Epistemic Evaluation** or **Outcome-Dependent Normative Assessment**.
  *   **Does it fit your cases?** It explains Case 1 well (the action was too important for that level of evidence). Case 2 is trickier here: if the career stakes vanished, the normative pressure vanishes, so we retroactively grant the license. This suggests your students are treating "knows" as a *retrospective seal of approval* on the action, not a description of the mental state.

  ### 3. The Psychological Account: Epistemic Outcome Bias
  If you suspect your students are making a mistake (as an Invariantist would argue), this is a specific cognitive bias studied in Experimental Philosophy.

  *   **The Field:** Experimental Epistemology (Knobe, Machery, Turri).
  *   **The Mechanism:** People struggle to separate the *justification* of a belief from the *consequences* of the belief.
  *   **The Name:** **Epistemic Outcome Bias** (analogous to Outcome Bias in decision theory).
  *   **Why it fits:** Just as we judge a doctor's decision as "wrong" if the patient dies (even if the decision was medically sound), your students judge the epistemic state as "not knowledge" if the stakes turn out to be high.
  *   **Does it fit your cases?** Yes. This view holds that knowledge *did not change*, but the students' *attribution* is contaminated by irrelevant posterior information. This validates your worry that "nothing about him changed in the meantime."

  ### Distinguishing Your Two Cases
  You asked if these are different animals. Under the lenses above, they diverge slightly:

  *   **Case 1 (Hidden High Stakes):** This is **Objective Pragmatic Encroachment**. The stakes existed objectively at the time, even if unknown. Standard PE (e.g., Fantl & McGrath) might actually agree with your students here: if knowledge depends on *objective* stakes, she never knew. The shift is only in *our awareness*, not the fact of the matter.
  *   **Case 2 (Vanished Stakes):** This is **Subjective/Contextual Encroachment**. The stakes existed in the subject's mind but vanished objectively (or contextually). If the students say he *now* knew, they are prioritizing the *current* lack of stakes over the *past* presence of stakes. This is harder for standard PE to explain and leans heavily toward **Assessment-Sensitivity** (the stakes *now* matter for the assessment *now*).

  ### Summary for Your Syllabus
  If you need a label to put on the slide:

  1.  **Most Precise Technical Term:** **Assessment-Sensitive Knowledge Attribution**. (This captures the temporal shift in the evaluator's context).
  2.  **Most Descriptive Term:** **Retrospective Pragmatic Encroachment**. (Not standard, but immediately understandable to epistemologists).
  3.  **If you think they are wrong:** **Epistemic Outcome Bias**.

  **Regarding "What is shifting?":**
  *   **Contextualists** say the *semantic content* of "knows" shifts with the attributor's context (which is now later in time).
  *   **Relativists** say the *truth value* shifts relative to the context of assessment.
  *   **Invariantists** say only the *assertability conditions* shift (it's true he knew, but it's misleading to say so given the new stakes).

  Your colleagues' "standard-shifting" wave of the hand is likely gesturing at **Contextualism**, but they are missing the crucial *diachronic* element. Standard Contextualism usually deals with synchronous shifts (I say "I know" in a low-stakes room; you say "He doesn't know" in a high-stakes room). Your cases are *diachronic contextualism*, which raises much harder questions about the stability of truth over time.

  **Recommendation:** If you want to press this in print or discussion, frame it as a challenge to **Temporal Invariantism**. Ask: "Does the truth of a knowledge ascription depend on the stakes at the time of belief, or the stakes at the time of assessment?" Your students have voted for the latter.
