prompt: |-
  I sit on a small city ethics review board and every month we get proposals asking citizens to take a real hit for collective goods -- mandatory vax for healthcare workers, carbon fees, zoning rules that wipe out a landlord's income. I need a reusable decision procedure my board can run in about 20 minutes, no philosophy phd required, grounded in consequentialist reasoning but with demandingness objections built in. Don't just measure cost size; check whether the demand is sacrificial -- it forces someone to abandon or radically shrink a core life project -- versus friction, where they just adjust inside the project. Also run a residue check: even if they comply, is there a grievance that doesn't vanish?

  Write it as ordered questions with clear stop/no points and explicit flag points where it's a values call not a fact call, so the board chair has to sign off. Include test conditions a non-expert can apply, and say exactly where the procedure breaks down -- probably when goods are incommensurable, and when we ask if collective benefits ever justify sacrificial demands.

  Then apply it to three proposals:
  - mandatory flu vaccination for nursing-home staff
  - an 8% post-tax income donation mandate for local food security (this is one I actually support, so I want the procedure to wrestle with it and maybe tell me I'm wrong)
  - a retrofit zoning rule that wipes out a small landlord's rental income

  Keep it checklist form, no bibliographies, just steps and worked examples.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Member of a small city ethics review board.
      *   **Task:** Create a reusable decision procedure (checklist) for evaluating proposals that impose costs on citizens for collective goods.
      *   **Constraints:**
          *   Time limit: ~20 minutes.
          *   Audience: Non-philosophers (no PhD required).
          *   Ethical Framework: Consequentialist grounding but with built-in "demandingness objections" (sacrifice vs. friction).
          *   Specific Feature: "Residue check" (does grievance remain even after compliance?).
          *   Format: Ordered questions, clear stop/no points, explicit "values call" flag points (requiring Chair sign-off).
          *   Limitations: Must state where the procedure breaks down (incommensurability, justification of sacrifice).
          *   Application: Apply to three specific cases (Mandatory flu vax, 8% income donation mandate, Retrofit zoning wiping out income).
          *   Style: Checklist form, no bibliographies, steps + worked examples.

  2.  **Deconstruct the Ethical Framework:**
      *   *Consequentialism:* Maximize overall good.
      *   *Demandingness Objection:* Morality shouldn't require us to give up everything that makes life worth living.
      *   *Sacrifice vs. Friction:*
          *   *Friction:* Inconvenience, cost, adjustment within the current life plan.
          *   *Sacrifice:* Abandoning or radically shrinking a core life project/identity.
      *   *Residue:* Moral remainder. Even if the act is "right," does the agent feel (rightfully) wronged? Is there a debt owed?

  3.  **Drafting the Procedure (The "20-Minute Ethics Triage"):**
      *   Need a logical flow.
      *   *Step 1: Benefit Verification.* Is there actually a collective good? (Consequentialist baseline).
      *   *Step 2: Cost Classification.* Friction vs. Sacrifice. This is the core innovation requested.
      *   *Step 3: The Demandingsness Check.* If it's sacrificial, does the collective good *really* outweigh it? (High bar).
      *   *Step 4: Residue & Mitigation.* If we proceed, how do we handle the leftover grievance?
      *   *Flags:* Need to highlight where objective facts end and value judgments begin.

  4.  **Refining the "Sacrifice vs. Friction" Test:**
      *   How does a layperson tell the difference?
      *   *Test:* Can they still pursue their main goal?
      *   *Test:* Does this change *who they are* or just *how they operate*?
      *   *Test:* Is the cost recoverable?

  5.  **Refining the "Values Call" Flags:**
      *   These need to be explicit. "Chair must sign here."
      *   Examples: Defining "Core Life Project," deciding if a specific benefit outweighs a specific sacrifice.

  6.  **Addressing the Breakdown Points:**
      *   Incommensurability (comparing health to money to liberty).
      *   The "Trolley Problem" limit (can we ever demand total sacrifice?).

  7.  **Applying to the Three Cases:**

      *   *Case 1: Mandatory Flu Vax for Nursing Home Staff.*
          *   Benefit: High (vulnerable population).
          *   Cost: Low/Friction (needle prick, minor side effects).
          *   Sacrifice? No. Doesn't stop them from being nurses.
          *   Residue: Low.
          *   Verdict: Pass.

      *   *Case 2: 8% Post-Tax Income Donation.*
          *   Benefit: Food security (High).
          *   Cost: 8% of *post-tax*. Significant.
          *   Sacrifice vs. Friction? For low income, it's survival (Sacrifice). For high income, it's lifestyle (Friction). But as a *mandate*, it treats everyone the same.
          *   Core Project: Financial autonomy/security.
          *   Residue: High. "Forced charity" feels like theft to many.
          *   Verdict: Likely Fail or Needs Major Mitigation (progressive scale?). The prompt asks me to wrestle with it since the user supports it. I need to show where the procedure pushes back.

      *   *Case 3: Retrofit Zoning Wiping Out Rental Income.*
          *   Benefit: Environmental/Safety (Collective).
          *   Cost: 100% of income from that asset.
          *   Sacrifice vs. Friction? If this is their retirement/savings, it's a Core Life Project (Security).
          *   Residue: Very High.
          *   Verdict: Fail (unless compensated). Uncompensated taking is usually a hard stop in ethics/law.

  8.  **Review and Refine:**
      *   *Tone:* Professional, pragmatic, directive.
      *   *Time Check:* Can this be done in 20 mins? Yes, if the questions are sharp.
      *   *Constraint Check:* Did I include the "Breakdown" section? Yes. Did I flag the Chair's sign-offs? Yes.
      *   *Self-Correction on Case 2:* The user supports the 8% mandate. I need to make sure the procedure doesn't just knee-jerk reject it but forces the *justification* to be explicit. It should highlight that this crosses the "Friction/Sacrifice" line for many, requiring a higher burden of proof.

  9.  **Final Polish:** Organize into clear sections: The Protocol, The Breakdown Limits, The Applications. Ensure the "Stop/No" points are visible. (Self-correction: Make sure the distinction between Friction and Sacrifice is operationalized clearly).

      *   *Operationalizing Sacrifice:* "Does this prevent the agent from maintaining their baseline life plan?"
      *   *Operationalizing Residue:* "If they comply, do they have a valid claim for compensation or apology?"

  10. **Final Output Generation** (Drafting the response based on these thoughts).
answer: |-
  # The 20-Minute Ethics Triage Protocol
  **For:** City Ethics Review Board
  **Purpose:** Evaluate proposals imposing costs on citizens for collective goods.
  **Framework:** Consequentialist baseline with Demandingsness Constraints.
  **Time Limit:** 20 Minutes per proposal.

  ---

  ## PART 1: THE DECISION CHECKLIST

  ### Step 1: The Benefit Baseline (Consequentialist Floor)
  *Goal: Ensure there is actually a collective good to justify any cost.*

  1.  **Is the collective benefit empirically verifiable?** (e.g., reduced infection rates, carbon reduction data).
      *   [ ] Yes
      *   [ ] No → **STOP.** Reject proposal. Speculative benefits cannot justify real costs.
  2.  **Is the benefit public/non-excludable?** (Does it help everyone, or just a specific lobby?)
      *   [ ] Public
      *   [ ] Private/Specific → **FLAG: VALUES CALL.** Chair must sign off that this specific group's benefit counts as a "collective good."
      *   *Chair Signature: ___________________*

  ### Step 2: The Cost Classification (Friction vs. Sacrifice)
  *Goal: Distinguish between inconvenience and life-altering loss.*

  3.  **The "Life Plan" Test:** Does the cost prevent the affected party from pursuing their primary life project (career, retirement security, family stability)?
      *   [ ] No, they can still pursue their main goals. (Proceed to Q4)
      *   [ ] Yes, it blocks or radically shrinks their main goals. (Proceed to Q5)
  4.  **The "Recovery" Test:** Can the cost be absorbed within 12 months without changing their standard of living?
      *   [ ] Yes → **CLASSIFICATION: FRICTION.** (Proceed to Step 3)
      *   [ ] No → **CLASSIFICATION: SACRIFICE.** (Proceed to Step 3)
      *   *Note: If the board disagrees on classification, default to SACRIFICE.*

  ### Step 3: The Demandingsness Check
  *Goal: Apply higher scrutiny if the cost is sacrificial.*

  5.  **If FRICTION:** Is the benefit clearly greater than the inconvenience?
      *   [ ] Yes → Proceed to Step 4.
      *   [ ] No → **STOP.** Reject proposal.
  6.  **If SACRIFICE:** Is the collective benefit *catastrophic* if not achieved? (e.g., mass death, system collapse vs. moderate improvement).
      *   [ ] Catastrophic prevention → Proceed to Step 4.
      *   [ ] Moderate improvement → **STOP.** Reject proposal. Sacrifice cannot be demanded for marginal gains.
      *   **FLAG: VALUES CALL.** Chair must sign off that the benefit is severe enough to warrant sacrifice.
      *   *Chair Signature: ___________________*

  ### Step 4: The Residue & Mitigation Check
  *Goal: Acknowledge that "right" actions can still leave moral debts.*

  7.  **The "Grievance" Test:** If the citizen complies, is there a remaining feeling of being used or wronged that doesn't vanish?
      *   [ ] No residue.
      *   [ ] Yes, residue remains. → **MITIGATION REQUIRED.** You must propose compensation, apology, or sunset clauses.
  8.  **Is the burden distributed fairly?** (Are the same people always asked to sacrifice?)
      *   [ ] Yes, distributed.
      *   [ ] No, concentrated on one group. → **FLAG: VALUES CALL.** Chair must sign off that this specific group bears the burden for the greater good.
      *   *Chair Signature: ___________________*

  ### Final Vote
  *   [ ] **APPROVE** (No mitigation needed)
  *   [ ] **APPROVE WITH MITIGATION** (Compensation/Apology required)
  *   [ ] **REJECT** (Costs exceed ethical limits)

  ---

  ## PART 2: WHERE THIS PROCEDURE BREAKS DOWN
  *Board members must acknowledge these limits before voting.*

  1.  **Incommensurability:** This tool assumes we can compare "dollars lost" to "lives saved." Sometimes these values cannot be mathematically weighed. When Q6 is triggered, we are making a qualitative leap, not a calculation.
  2.  **The Sacrifice Ceiling:** This procedure assumes *some* sacrifice is permissible. It does not resolve the philosophical limit where a demand becomes slavery or tyranny (e.g., demanding a citizen give their life). If Step 2 classifies a cost as "Existential Threat," this checklist is void; legal counsel must be consulted.
  3.  **Rights Trumps:** Consequentialism can justify violating rights if the good is big enough. This checklist tries to block that via Step 3, but if the Board decides the "Collective Good" is absolute, this procedure will not stop a rights violation.

  ---

  ## PART 3: WORKED APPLICATIONS

  ### Case A: Mandatory Flu Vaccination for Nursing-Home Staff
  **Proposal:** All staff must receive annual flu shot or wear masks permanently.

  *   **Step 1 (Benefit):** Verifiable reduction in elderly mortality. Public good (herd immunity in vulnerable ward). **[PASS]**
  *   **Step 2 (Cost):**
      *   *Life Plan Test:* Does a shot stop them from being a nurse? No.
      *   *Recovery Test:* Minor arm soreness, 1 day max. Absorbed easily.
      *   *Classification:* **FRICTION.**
  *   **Step 3 (Demandingsness):** Benefit (lives saved) > Friction (needle prick). **[PASS]**
  *   **Step 4 (Residue):**
      *   *Grievance:* Low. Bodily autonomy concern exists but is minimal relative to risk.
      *   *Distribution:* Burdens all staff equally.
  *   **Verdict:** **APPROVE.**
  *   *Note:* Low residue. No compensation needed.

  ### Case B: 8% Post-Tax Income Donation Mandate
  **Proposal:** All citizens must donate 8% of post-tax income to local food security fund.
  *(User Note: You support this, but the procedure must test it rigorously.)*

  *   **Step 1 (Benefit):** Elimination of local hunger. Verifiable. Public good. **[PASS]**
  *   **Step 2 (Cost):**
      *   *Life Plan Test:* For a minimum wage earner, 8% of post-tax is food/rent money. Blocks survival project. For wealthy, it's lifestyle.
      *   *Recovery Test:* Cannot be absorbed by low-income without changing standard of living.
      *   *Classification:* **SACRIFICE** (for lower/middle income brackets).
      *   *Board Note:* A flat rate mandates sacrifice from the poor, friction for the rich.
  *   **Step 3 (Demandingsness):**
      *   Is hunger "catastrophic"? Yes.
      *   **FLAG: VALUES CALL.** Does ending hunger justify *mandatory* income seizure beyond taxes?
      *   *Chair Signature Required:* ___________________
      *   *Constraint:* Step 3 says Sacrifice requires Catastrophic prevention. Hunger qualifies. However, is *this method* the only way? If voluntary donation fails, mandate gains strength.
  *   **Step 4 (Residue):**
      *   *Grievance:* **HIGH.** "Forced charity" creates moral residue. Citizens feel like tools of the state.
      *   *Mitigation:* Requires progressive scaling (0% for low income, higher for wealthy) to move cost from Sacrifice to Friction.
      *   *Distribution:* Flat tax is regressive. Fails Q8.
  *   **Verdict:** **REJECT (As Written) / APPROVE WITH MITIGATION.**
      *   *Reasoning:* The procedure flags this as a Sacrifice for the poor. To pass, it must be progressive so the cost becomes Friction for the payer. If kept flat, it violates the Demandingsness Check for low-income citizens.
      *   *Ethical Wrestling:* You support the goal, but the *mechanism* forces a sacrificial demand on those least able to bear it. The procedure forces you to adjust the mechanism (progressive scale) to align with the ethics.

  ### Case C: Retrofit Zoning Wiping Out Rental Income
  **Proposal:** Small landlords must retrofit old units to new green standards. Cost exceeds property value. Income lost.

  *   **Step 1 (Benefit):** Carbon reduction / Safety. Verifiable. Public good. **[PASS]**
  *   **Step 2 (Cost):**
      *   *Life Plan Test:* If this is retirement income, the project (Retirement Security) is destroyed.
      *   *Recovery Test:* Cost exceeds asset value. Not recoverable.
      *   *Classification:* **SACRIFICE.** (Total loss of income stream).
  *   **Step 3 (Demandingsness):**
      *   Is carbon reduction from *this specific building* catastrophic if not achieved immediately? Likely No. (Grid-wide issue vs. single landlord).
      *   **STOP.** Reject Proposal.
      *   *Reasoning:* You cannot demand total financial sacrifice from an individual for a diffuse collective benefit unless the individual caused the harm directly (nuisance).
  *   **Step 4 (Residue):**
      *   *Grievance:* **EXTREME.** This functions as an uncompensated taking.
      *   *Mitigation:* Subsidies or grandfathering required.
  *   **Verdict:** **REJECT.**
      *   *Reasoning:* Fails Step 3. The benefit (marginal carbon reduction) does not meet the "Catastrophic" threshold required to justify a "Sacrifice" classification cost.
      *   *Fix:* Offer 100% subsidy. If subsidized, cost becomes Friction (paperwork), and proposal can pass.

  ---

  ## CHAIR'S SUMMARY INSTRUCTION
  1.  Run the checklist.
  2.  If you hit a **FLAG: VALUES CALL**, stop the clock. Discuss the value judgment explicitly. Sign the line.
  3.  If you hit a **STOP**, the proposal is ethically dead unless rewritten to lower the cost classification from Sacrifice to Friction.
  4.  If you hit **MITIGATION REQUIRED**, approval is conditional on the city budgeting for the residue (compensation/apology).
