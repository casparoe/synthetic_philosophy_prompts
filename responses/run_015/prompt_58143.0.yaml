      *   *Claim 3 (What Matters)* is explicitly **Parfitian**. Parfit argues that identity is not what matters; *Relation R* (psychological connectedness/continuity) is what matters, and it *does* come in degrees.
      *   *Claim 4 (Physicalism)* constrains the metaphysics. No Cartesian Ego. Identity must be grounded in physical facts.

      *   *The Core Tension:* The tension lies primarily between Claim 1 & 2 (The "Fission Problem") and between Claim 2 & 3 (The "What Matters" vs. "Identity" distinction).
      *   *Claim 1 vs. Claim 2:* If survival depends on psychological continuity (implied by 1 and 3), why does branching (fission) kill you? Usually, if psychological continuity is sufficient for survival (1), then in fission, you should survive as *both* (or at least one). Denying survival in fission while accepting it in normal teletransportation suggests identity requires *uniqueness* (Non-Branching View).
