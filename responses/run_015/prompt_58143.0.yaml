          *   **Tension C (Physicalism & Uniqueness):** Claim 4 (Physicalism) makes the "Non-Branching" requirement in Claim 2 metaphysically suspicious. If I'm just a pattern, why does a duplicate elsewhere negate my survival here?

      *   *Ranking:*
          1.  **Severity 1:** Claim 2 vs. Claim 3. (This is the Parfitian pivot point).
          2.  **Severity 2:** Claim 1 vs. Claim 2. (The logical consistency of the survival condition).
