answer: |-
  Your colleague's term, **"the caring ratchet,"** is exceptionally precise, and frankly, it captures the dynamic better than most existing academic labels. However, since you asked for the theoretical carving and whether established concepts exist, the answer is that this is a hybrid of two distinct frameworks that rarely get discussed together.

  The phenomenon you are describing is the intersection of **Net-Widening** (from criminology and policy studies) and **Pastoral Power** (from Foucault/critical sociology).

  When you combine them, you get a specific mechanism that doesn't have a single universal noun, but is often discussed under the header of **"Therapeutic Governance"** or **"Coercive Care."**

  Here is the carving you asked for: the precise definition, the boundary cases, and the function of the vocabulary.

  ### 1. The Carving: What exactly is this pattern?

  To count as an instance of this phenomenon, four conditions must be met simultaneously. If one is missing, it is a different dynamic.

  1.  **The Intensity/Extensity Trade-off:** There is a genuine reduction in *intensity* (harshness, pain, exclusion) for the individual, purchased at the cost of an increase in *extensity* (the number of people subject to intervention and the duration of that intervention).
      *   *Example:* One kid suspended (high intensity, low extensity) vs. fifty kids on "wellness plans" (low intensity, high extensity).
  2.  **The Datafication of Care:** The mechanism of "support" requires the extraction of data. Care is operationalized through forms, logs, check-ins, and reviews. The act of helping is indistinguishable from the act of recording.
  3.  **The Moral Asymmetry (The Shield):** The system is immunized against critique by framing the intervention as benevolent. To object to the *surveillance* is framed as objecting to the *support*. Resistance is re-categorized as "non-compliance with treatment" or "refusal of help."
  4.  **The Permanence of the File:** The intervention creates a record that outlasts the immediate incident. The "support" leaves a trace (a file, a flag, a history) that travels with the subject, potentially triggering future interventions.

  ### 2. What is NOT an instance of this? (Boundary Cases)

  To understand the shape, you need to know what falls outside the lines.

  *   **Genuine Decarceration/Depathologization:** If a school stops excluding kids *and* fewer kids are put on support plans because the underlying behavioral thresholds are raised, that is not this. In your cases, the threshold for intervention lowers even as the punishment softens. If the *total number of files* drops, it's not a ratchet.
  *   **Hard Repression:** If a school introduces metal detectors and security guards without using the language of "safety" or "wellbeing," that is traditional social control. It lacks the Moral Asymmetry. You can oppose metal detectors without being accused of wanting kids to be unsafe.
  *   **Simple Mission Creep:** Mission creep is bureaucratic drift (e.g., "we started doing X, now we also do Y"). The Caring Ratchet is structural and ideological. It is a deliberate *substitution* of one form of power for another, justified by a moral framework.
  *   **Voluntary Opt-In:** If the "support pathway" is genuinely optional, with no administrative consequence for declining, it breaks the third condition (Moral Asymmetry). The ratchet engages when "support" becomes the default administrative requirement.

  ### 3. Is it Foucault?

  Yes, but specifically **Pastoral Power**, not just "surveillance."

  Foucault distinguished between *sovereign power* (the right to let live or make die; e.g., exclusion/seclusion) and *pastoral power* (the shepherd's duty to ensure the salvation/wellbeing of every sheep).

  *   **Sovereign Power:** "You broke the rule, you are expelled." (Visible, brutal, finite).
  *   **Pastoral Power:** "You are struggling, we must monitor your sleep and mood to save you." (Invisible, benevolent, infinite).

  The reason Foucault fits is that Pastoral Power *requires* knowledge of the interior life. A prison guard doesn't need to know your sleep schedule; a shepherd does. When agencies shift from punishing behavior to managing "wellbeing," they legitimately require more intimate data. The surveillance isn't a bug; it's a feature of the "care."

  However, Foucault described the *logic*, not the specific policy metric. The metric—where diversion programs catch more people than the punitive system did—is **Net-Widening**. This term comes from 1970s criminology (Stanley Cohen). It describes when "alternatives to incarceration" (probation, community service) are applied to people who otherwise would have been ignored entirely, rather than to those who would have been jailed.

  Your observation is the synthesis: **Pastoral Net-Widening.**

  ### 4. Is the "Caring" Vocabulary Essential?

  Yes. It is not just marketing; it is the structural glue.

  If the vocabulary were neutral (e.g., "Behavioral Monitoring Level 2"), parents and advocates would oppose it as bureaucracy. By using the vocabulary of *care* ("Support Pathway," "Wellness Plan"), the system creates **Moral Immunity**.

  This changes the political cost of opposition.
  *   **Opposing Punishment:** Morally easy. ("Stop suspending kids.")
  *   **Opposing Support:** Morally hazardous. ("Stop supporting kids?")

  This forces critics into a bind: they must argue that the "support" is actually harmful surveillance. But because the "support" is genuinely milder than the punishment it replaced (the kid *is* still in school), the critique looks ungrateful or extreme. The vocabulary neutralizes the opposition by claiming the moral high ground.

  ### 5. Naming It

  Your colleague's **"Caring Ratchet"** is the best operational name because it captures the *mechanism* (it only goes one way) and the *justification* (care).

  If you need a formal term for reports or analysis, **"Therapeutic Net-Widening"** is the closest established concept. It signals that the expansion of the system (Net-Widening) is driven by a therapeutic/support ideology (Therapeutic).

  **Definition:**
  > **Therapeutic Net-Widening:** A policy dynamic wherein punitive measures are replaced by supportive interventions, resulting in reduced individual harshness but expanded systemic reach. The intervention is legitimized through the language of care, rendering critique morally difficult and transforming administrative surveillance into a requirement of wellbeing.

  ### Summary of the Dynamic

  1.  **The Hook:** A genuine moral improvement (less brutality).
  2.  **The Switch:** The metric of success changes from "fewer punishments" to "more support."
  3.  **The Trap:** Support requires data; data requires access; access requires permanence.
  4.  **The Shield:** To question the data is to question the support.

  You are seeing the transition from a system that *excludes* problems to a system that *manages* populations. The former is visible and brutal; the latter is invisible and total. The "Caring Ratchet" is the mechanism that ensures once a population is brought into management, they can never be released, because release would look like abandonment.
