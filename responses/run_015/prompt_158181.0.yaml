      *(Second thought on 1 vs 5)*: Actually, (5) is a very specific, somewhat controversial claim (unwitting > knowing). It might be worth challenging. But the prompt asks to fix the view, not necessarily dismantle it. I should point out that (5) requires redefining (1)'s "authority."

      *(Final Plan)*:
