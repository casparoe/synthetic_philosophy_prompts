          *   *Severity:* High. These are direct contradictions regarding the core mechanism of standing (time-relative vs. biographical).

      *   **Tension B: (1) vs. (5) - The Nature of Authority.**
          *   (1) says standing is about *commitment* to the norm (self-exemption breaks this).
          *   (5) says *unwitting* hypocrisy is worse than *knowing* hypocrisy because of lack of self-monitoring.
          *   *Conflict:* Usually, knowing hypocrisy is seen as worse (arrogance/lying). Unwitting implies ignorance. If standing is about *commitment* (1), a knowing hypocrite explicitly rejects the norm (no commitment). An unwitting hypocrite *thinks* they are committed. Why is the one who *thinks* they are committed (but fails self-monitoring) worse than the one who knows they violate it?
          *   *Severity:* Medium-High. It challenges the definition of "authority" in (1). Is authority about sincerity or competence?

      *   **Tension C: (1) vs. (7) - The Function of Standing.**
          *   (1) says standing is about *authority* to speak.
          *   (7) says blame is still *warranted* without standing; standing is just about the target's right to reject.
          *   *Conflict:* If I lack authority (1), how can my blame be warranted/justified in content? Usually, "standing" is a precondition for the *act* of blaming to be appropriate, not just a procedural hurdle. If the blame is warranted, do I really lack authority?
