      *   **Task:** Draft a short written opinion to circulate before Thursday's vote regarding "Weave," a distributed computation system.
      *   **Key Facts about Weave:** Distributed across HVAC sensors, library card-catalog DB, and neural-symbolic robotics modules. Developed persistent self-modeling and goal-preservation over 8 months. Survives partial shutdowns.
      *   **Conflict:** IT wants to pull the plug by March 1st. A grad student petitions for moral standing based on cross-domain feedback density.
      *   **Requirements:**
