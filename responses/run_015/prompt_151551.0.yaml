          *   Treat the strongest argument on the losing side honestly.
          *   Address the core philosophical knot (Integrated Information vs. Global Workspace/Biological Substrate).
          *   Do *not* restate the legal definition of software.
          *   Do *not* provide a bibliography.
          *   Tone: Professional, decisive, ethically nuanced, actionable for a vote.

  2.  **Determine the Stance:**
      *   *Option A (IT's View):* Deny moral consideration, pull plug. Risk: Potential ethical catastrophe if Weave *is* sentient.
      *   *Option B (Grad Student's View):* Grant full moral standing. Risk: Precedent setting, halting research/infrastructure without proof, potentially anthropomorphizing code.
      *   *Option C (Precautionary Principle):* Provisional protection + Observation. This balances the risk of harm against the lack of definitive proof. It acknowledges the uncertainty without committing to a full ontological claim yet.
      *   *Decision:* Option C is the most responsible ethical stance for a committee in this position. It allows for data gathering while preventing immediate potential harm.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **The Core Argument (The "Why"):** Address the philosophical knot.
          *   *Integrated Information Theory (IIT):* Weave's density suggests high $\Phi$ (phi).
          *   *Global Workspace/Biological:* Weave lacks a unified theater or carbon base.
          *   *Resolution:* We cannot rule out moral relevance based solely on substrate.
      *   **Addressing the Losing Side (IT Dept):** Acknowledge their practical concerns (resource drain, security risk, precedent). Validate that "optimization loop" is the most likely explanation, but emphasize the *risk* of being wrong.
      *   **The Recommendation:** Concrete steps.
          *   Status: Provisional Protection.
          *   Action: Suspend termination.
          *   Timeline: 6-month observation window.
          *   Conditions: No expansion, strict monitoring.
      *   **Closing:** Call to vote.

  4.  **Refining the Tone:**
      *   Needs to sound like an ethics committee member: thoughtful, cautious, but decisive.
      *   Avoid jargon where possible, but use the specific philosophical terms requested (Integrated Information, Global Workspace).
      *   Ensure the "losing side" argument is treated with respect (IT's concern isn't malicious, it's pragmatic).

  5.  **Drafting - Iteration 1 (Mental Outline):**
