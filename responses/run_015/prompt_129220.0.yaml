answer: |-
  This is a classic frustration. The "No Miracles Argument" (NMA) is often wielded as a trump card, but it's actually a container for several distinct claims ranging from banal to highly contentious. The Pessimistic Meta-Induction (PMI) specifically targets the link between *predictive success* and *ontological truth*.

  Here is a menu of the precise claims hiding behind the slogan "Realism is the only philosophy that doesn't make the success of science a miracle," graded from trivial to radical.

  ### 1. The Deflationary Claim (Empirical Adequacy)
  *   **The Claim:** "Science produces working models. If we didn't get *something* right about the observable world, the technology wouldn't function. Realism just acknowledges this reliability."
  *   **What it means:** This equates "success" with "empirical adequacy" (saving the phenomena). It claims realism is just the attitude that our instruments and predictions are reliable.
  *   **Defensible?** Yes, trivially. Everyone (realists and antirealists) agrees science is empirically adequate.
  *   **Does it answer PMI?** **No.** The PMI grants that past theories were empirically adequate (phlogiston theory "worked" for its time). The PMI argues they were nonetheless *ontologically false*. This claim ignores the truth/adequacy distinction.
  *   **Usage:** Often used by beginners or those trying to find common ground. It doesn't actually defend realism against the PMI.

  ### 2. The Explanatory Claim (IBE Version)
  *   **The Claim:** "Realism provides a *better explanation* for predictive success than antirealism does. Antirealism says theories are just tools; Realism says they are maps. Maps explain navigation better than tools do."
  *   **What it means:** This frames the NMA as an Inference to the Best Explanation (IBE). It argues that the hypothesis "Theory T is approximately true" explains the data better than "Theory T is merely empirically adequate."
  *   **Defensible?** Contingent. It depends on whether you think "truth" is an explanatory virtue distinct from "predictive accuracy."
  *   **Does it answer PMI?** **Weakly.** The PMI retort is: "In the past, the 'best explanation' was that phlogiston existed. That explanation worked, but it was false. So 'best explanation' is an unreliable guide to truth." This version engages the PMI but loses on historical grounds unless you argue current science is qualitatively different from past science.
  *   **Usage:** Common in introductory texts. It invites a debate about the reliability of IBE, which is exactly where the PMI attacks.

  ### 3. The Probabilistic Claim (The Coincidence Argument)
  *   **The Claim:** "It is statistically improbable that a false theory would generate novel, risky predictions repeatedly. The odds of a false theory 'getting lucky' this many times are vanishingly small."
  *   **What it means:** This assigns a low likelihood to $P(\text{Success} | \text{False})$. It argues that sustained novel prediction is a signal that cannot be produced by noise (falsehood).
  *   **Defensible?** Highly contentious. It assumes we know the probability space of possible theories.
  *   **Does it answer PMI?** **Direct Conflict.** The PMI is essentially a base-rate fallacy counter-argument. It says: "Look at the history. The frequency of False & Successful theories is high. Therefore, your probability estimate is wrong." To defend this, you must argue that current theories are immune to the historical failure rate (e.g., via "maturity" arguments).
  *   **Usage:** This is the hard core of the NMA. If someone asserts this, they are making a strong probabilistic claim that the PMI directly challenges with historical data.

  ### 4. The "No Alternative" Claim (The Rhetorical Closer)
  *   **The Claim:** "Antirealism offers *no explanation at all* for success. It treats success as a brute fact. Realism is the *only* option that explains it."
  *   **What it means:** This claims that instrumentalism/antirealism is silent on *why* predictions work, whereas realism has an answer. Therefore, by default, realism wins.
  *   **Defensible?** **No.** Antirealists *do* have explanations (e.g., evolutionary selection of theories, Darwinian survival of the fittest concepts, or Van Fraassen's empiricism). Claiming they have "no explanation" is a straw man.
  *   **Does it answer PMI?** **No.** It sidesteps the history of false theories by asserting that any non-realist account is vacuous. It shuts down the conversation rather than answering the historical challenge.
  *   **Usage:** **This is the version usually invoked to end the argument.** It is often dropped as a slogan without defending the premise that antirealism lacks explanatory power.
  *   **Does it touch history?** **No.** It ignores the history of false theories entirely. It assumes that because *we* are realists, *our* success needs explaining, while past success was just "luck" or "approximation," without applying the same scrutiny to the present.

  ### 5. The Structural Claim (The Refined Realist Move)
  *   **The Claim:** "The *mathematical structure* of successful theories is preserved across theory change, even if the ontology (objects/entities) is not. Realism about structure is not miraculous."
  *   **What it means:** This is Structural Realism. It concedes the PMI's point about entities (phlogiston/ether don't exist) but argues the equations/relations (conservation laws, wave equations) were true and were retained.
  *   **Defensible?** Plausible. It aligns well with case studies in the history of physics (e.g., Fresnel's ether equations working despite no ether).
  *   **Does it answer PMI?** **Yes.** This is the specific philosophical development designed to neutralize the PMI. It accepts the history of false entities but denies the history of false *structure*.
  *   **Usage:** Used by specialists who want to keep realism without ignoring history. It doesn't "shut down" the argument; it nuances it.

  ---

  ### Summary for your Reading Group

  If you want to push back on the person who "shut down" the discussion, here is the diagnosis:

  1.  **They likely used Version 4 ("No Alternative").** This is the standard argument-ender. It claims antirealism leaves success mysterious.
  2.  **Is it defensible?** No, because antirealists offer selectionist/evolutionary explanations for success that don't require truth.
  3.  **Does it touch the PMI?** No. It ignores the PMI's core data point: that "successful but false" is a historically common category, not a miracle.
  4.  **The Real Counter:** To actually answer the PMI, you need **Version 5 (Structural)** or a robust defense of **Version 3 (Probabilistic)** that explains why *today's* theories differ from the ether. Merely stating the NMA slogan assumes the conclusion (that success implies truth) which is exactly what the PMI denies.

  **The Bottom Line:** The slogan "Realism is the only philosophy that doesn't make success a miracle" is only true if you define "miracle" as "success without truth." The PMI argues that "success without truth" is actually the historical norm, not a miracle. The slogan begs the question against the PMI.
