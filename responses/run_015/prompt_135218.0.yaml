answer: |-
  **Guidance for Applicants and Auditors: Permits for Acts Beyond the Call of Duty (Form S-77)**

  **Preamble**
  This document outlines the operational procedures for the Bureau of Supererogatory Administration (the Bureau). The Bureau is charged with certifying acts that are morally praiseworthy to perform but permissible to omit. To maintain the integrity of the category, the Bureau must ensure that certified acts remain strictly optional. Permit holders receive no tangible benefit other than a Certificate of Moral Excess. Applicants are advised that processing times vary based on regional compliance rates.

  **1. Retrospective Authorization**
  Authorization is necessarily retrospective. A permit applied for prior to the performance of an act constitutes an intent to comply, thereby reclassifying the act as a duty. Consequently, applicants must submit Form S-77 only after the act is complete. Applicants acknowledge that submission does not guarantee certification. An individual who returns a lost wallet without a permit risks performing a mandatory duty without a license if the regional compliance threshold has been met unknowingly. In such cases, the act is voided, and the applicant may be liable for penalties regarding unlicensed compliance.

  **2. Compliance Thresholds and Allocation**
  Obligation is determined by the behavior of the relevant reference class. An act becomes mandatory when participation within a demographic or geographic cohort exceeds the Compliance Threshold (currently set at 65%). To prevent acts from becoming mandatory, the Bureau caps the number of issued permits.
  *Worked Example:* In District 4, 60% of residents currently return lost wallets. The Bureau has opened a lottery for 4% of the remaining population. Applicants who return wallets outside this allocation raise the participation rate. If the rate crosses 65%, wallet-returning becomes mandatory for all District 4 residents. Permits are revoked retroactively, and non-participants are cited for negligence. Applicants wishing to donate blood or pull bicycles from canals are placed on a waiting list to ensure participation rates remain below the threshold of obligation.

  **3. The Bystander Field Test**
  Auditors must determine whether the act was truly optional at the time of omission. The primary metric is the reactive attitude of observers. Officers will canvass neighbors, colleagues, and passers-by to ascertain if resentment or indignation was expressed regarding the applicant's initial failure to act.
  *Worked Example:* An applicant claims staying late to finish a colleague's report was supererogatory. However, witness statements indicate the colleague expressed anger at the initial refusal. This indignation proves the act was expected, thus constituting a duty. The permit is refused, and the file is transferred to Enforcement for investigation into initial non-compliance. Where no resentment is recorded, the act may be certified as beyond the call of duty.

  **4. Non-Transferability of Credit**
  Supererogatory credit is not transferable against statutory or moral obligations. A claimant may not set an act of rescue or extraordinary generosity against an unmet obligation.
  *Worked Example:* An applicant who saved a neighbor from a fire cannot apply this credit to outstanding child support payments or unfiled tax returns. The Ledger of Optional Works and the Ledger of Requirements are maintained separately. There is no mechanism for offsetting. Applicants suggesting that extraordinary virtue should excuse minor vices are referred to Section 4.1 of the General Code.

  **5. Motivation and Disqualification**
  Applicants are disqualified if they acted in order to obtain a permit, or because the permit scheme exists. Auditors review diaries, text messages, and browser history for evidence of credit-seeking motivation. The phrase "doing this for the certificate" is grounds for immediate rejection.
  *Statistical Note:* Valid applications have fallen steadily since the Bureau opened. This correlates with increased public awareness of the motivation clause. Applicants are advised that the desire to be certified undermines the certification.

  **Appendix: Note from the Office of Maximizing Review**
  The Office of Maximizing Review maintains that the best available act is always the one an agent ought to perform. Consequently, they argue the category of the supererogatory is empty and every permit is void. The Bureau does not refute this position but observes the awkward consequence for its own staff. If the Office is correct, Bureau employees are currently processing invalid claims while failing to perform the optimal act themselves. Staff are reminded to continue processing until further notice, despite the likelihood that their own labor is morally insufficient.

  **Forward Programme**
  To ensure acts remain supererogatory, participation must be kept low. High visibility encourages imitation, which raises compliance rates and converts optional acts into duties. Therefore, the Bureau proposes to stop publicizing the scheme effectively. Future campaigns will withhold the names of permit-holders to prevent social pressure. Furthermore, the Bureau will pilot a quiet discouragement of the most generous acts. Public service announcements will suggest that donating organs or intervening in emergencies is "not for everyone" and "potentially risky." By lowering expectations, we preserve the optionality required for the Bureau's continued existence.
