  Please write the exam prompt (about 300 words), a model answer around 600 words, and a marking scheme that separates A from B. The scheme should list the specifc conceptual moves an A answer must contain — e.g. mapping the exit-fee structure onto pump vulnerability, locating the unitary-self assumption in the standard argument, and saying exactly what the partitioned view does to the normative force. Also name two mistakes that should cost marks, like conflating cyclical preference with simple preference change or treating the exit option as automatically solving everything without explaining the bargaining structure it introduces.
