answer: |-
  The book claims to map a natural kind,
  yet draws us in a tightening loop.
  Once printed, every diagnostic label
  instructs the patient's hidden behavior,
  turning the home into a clinic,
  until the mind remakes the world.

  They return to the living world,
  defined as a specific kind,
  summoned back to the clinic.
  The history forms a loop,
  where suffering shapes behavior,
  beneath the heavy label.

  They rewrite the old label,
  watching shifts across the world,
  tracking every new behavior.
  Is this a distinct kind?
  They step outside the clinic,
  to follow where the loop leads.

  No static wall inside the clinic,
  no inert stone beneath the label,
  but a reactive, living kind.
  They push back at the world,
  snapping shut the logical loop,
  with wild and unscripted behavior.

  Emergent forms of behavior,
  crowd the halls of the clinic,
  echoing through the world.
  We name this moving kind,
  and print a fresh label,
  tightening the golden loop.

  Who can escape the loop?
  Where every measured behavior
  defines the evolving kind.
  Beyond the gray clinic,
  the diagnosis fills the world,
  under every new label.

  The classifier enters the loop with a label,
  changing behavior inside the clinic, spans the world,
  for he too is an interactive kind.
