  Whole in the now, the substance stands complete,
  Yet bears the bend that later time imposes.
  To be entirely here implies a place
  Where changing shapes inhabit single forms.
  The straight grows curved, a contradiction stirs,
  That splits the one into a broken part.

  Part of the line exists within the slice,
  And never claims the fullness of the time.
  The bending sits in sections, not the cost
  Of unity throughout the extension.
  A fusion built of moments makes the object,
  Where traits reside within the stretching whole.

  Whole again, the object seeks a ground,
  But finds the sequence breaks identity.
  Whether the time is in the thing or space,
  The contradiction bears a heavy weight.
  We speak of being as a single form,
  Yet end by cutting off the final part.
