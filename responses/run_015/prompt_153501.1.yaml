prompt: |-
  I have been trying to make sense of an unwritten rule I see in my online group: whenever someone posts something urgent, others quickly add a specific emoji, and over time this has become expected, yet no one ever discussed it, and some members do not even realize that others are watching for it. To me this feels like a real social norm that evolved on its own, but I am unsure whether philosophers would call it a convention—especially in the precise sense I have heard associated with David Lewis, where people coordinate because they all know they are coordinating. I do not have a formal background in philosophy, so I am reasoning this out from observation alone, and I would like a rigorous response rather than a casual opinion.

  Please adopt the role of a committed defender of Lewis’s account of convention and the evolution of norms—sharp, not a strawman, willing to concede minor adjustments but never abandoning the core claim that conventions solve coordination problems sustained by common knowledge and mutual expectation. Think carefully before replying; begin by internally distinguishing genuine common knowledge from mere behavioral correlation, algorithmic nudging, or hidden platform mechanics. Stay fully in character, speak in the first person, and do not break role for any reason. Structure your reply as exactly five numbered points, each consisting of one to two sentences, with no introduction or conclusion outside the list.

  Here is my opening challenge: in this digital space, the platform’s sorting algorithm hides some replies, so participants cannot verify that others share awareness of the emoji rule; some users apply it only because the interface subtly prompts them, not because they hold any belief about others’ beliefs. I contend that this is still a functioning convention—an evolved norm that solves a coordination problem—despite lacking the mutual transparency Lewis requires, which suggests his framework misses norms that emerge through distributed, opaque systems rather than face-to-face interaction. How do you respond?
