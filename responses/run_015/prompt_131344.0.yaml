  ### JOINT STATEMENT ON MATERIAL CONSTITUTION AND ONTOLOGICAL COUNTING
  **Adversarial Collaboration Group: Metaphysics of Material Objects**
  **Date:** October 2023
  **Subject:** The Statue, The Clay, and The Copy

  #### 1. Agreed Claims (Common Ground)

  Both the Unitarian and Pluralist contingents agree to the following claims as the baseline for our dispute. We treat these as the data points any successful theory must accommodate or explain away.

  1.  **Existence of Matter:** There is a quantity of bronze arranged statue-wise in location L at time T. Neither side denies the existence of the bronze matter itself.
  2.  **The Squashing Intuition:** If the object in L is subjected to a hydraulic press at T+1, the resulting flattened bronze would not be described as a "statue" in any standard sense, though it would still be described as "clay" or "bronze."
  3.  **Spatial Coincidence:** At time T, the spatial region occupied by the statue-shaped entity is identical to the spatial region occupied by the clay-shaped entity. There is no gap between them.
  4.  **Counting Context:** In ordinary discourse, if asked "how many things are on the pedestal?", speakers typically say "one." However, under philosophical interrogation, speakers diverge on whether this counts ontological entities or pragmatic units.
  5.  **The Scan-and-Print Scenario:** If a perfect digital scan is taken of the bronze statue and used to 3D-print a numerically distinct copy in marble:
      *   Both sides agree the copy is a distinct physical object from the original.
      *   Both sides agree the original bronze does not physically change upon the completion of the copy.
      *   Both sides agree this scenario bears on the modal properties of the original (e.g., could it have been made of marble?), though we disagree on the outcome.
  6.  **Explanatory Burden:** Both sides agree that a theory must explain why we have divergent persistence conditions (squashing) without violating logical laws (like Leibniz's Law) unless explicitly justified.

  #### 2. Disagreements Table

  The following table outlines the precise ontological commitments of each camp. Each side accepts the wording in their own row as an accurate formulation of their view.

  | Feature | Unitarian Position (One Object) | Pluralist Position (Two Objects) |
  | :--- | :--- | :--- |
  | **Ontological Commitment** | There is exactly one material object in location L. The statue is identical to the clay. | There are exactly two material objects in location L. The statue is constituted by the clay but not identical to it. |
  | **Persistence Conditions** | Persistence is sortal-relative. The object survives squashing *qua* clay but does not survive *qua* statue. There is no absolute survival. | Persistence is object-specific. Object A (clay) survives squashing. Object B (statue) does not. Both facts are absolute. |
  | **Nature of Form** | Form is a mode or property of the matter. It is not an ontological constituent that generates a new entity. | Form is a principle of individuation. When matter takes on a specific form, it constitutes a new object with its own identity conditions. |
  | **Modal Properties** | Modal claims are conceptual or linguistic. The bronze itself has no "modal profile" independent of how we describe it. | Modal properties are real and mind-independent. The statue has essential properties (e.g., origin) that the clay lacks. |
  | **Counting Objects** | Counting is pragmatic. We count one object because we are usually interested in the dominant sortal (statue). | Counting tracks mind-independent joints in reality. There are two things there, even if pragmatically we treat them as one. |

  #### 3. The Cruxes

  We have identified two primary theoretical divergences that drive the disagreement. For each crux, we specify the concrete case that bears on it and record each side's prediction.

  **Crux A: The Ontological Status of Form**
  *   **The Issue:** Is "being statue-shaped" merely a way the bronze is arranged (a mode), or is it a constituent that brings a new object into existence?
  *   **Concrete Case:** The initial creation of the statue. When the artist shapes the clay, does a new object come into existence, or does the existing object merely change properties?
  *   **Unitarian Prediction:** No new object is created. The existing clay object acquires a new property (statue-shape). Identity is preserved through the change.
  *   **Pluralist Prediction:** A new object is created. The clay exists prior to the shaping; the statue begins to exist only when the form is imposed. They have different birth dates.

  **Crux B: Modal Externalism and the Copy**
  *   **The Issue:** Do modal properties (what an object *could* have been) depend on facts external to the object, such as the existence of duplicates?
  *   **Concrete Case:** The Scan-and-Print Scenario. Once the marble copy exists, is it true of the original bronze statue that it *could have been* made of marble?
  *   **Unitarian Prediction:** **Yes/Neutral.** Since modal properties are tied to our concepts sorts, the existence of the copy validates the concept "statue-shape-in-marble." It doesn't change the bronze, but it makes the modal claim true relative to the sortal. The bronze itself doesn't care.
  *   **Pluralist Prediction:** **No.** The original statue's essence is fixed by its actual history and origin (origin essentialism). The existence of a duplicate elsewhere does not alter the historical essence of the original. The original bronze statue *could not* have been marble, regardless of the copy. The copy is a counterpart, not a modal possibility of the original.

  **Crux C: Counting and Joints in Nature**
  *   **The Issue:** Does our counting of objects track mind-independent reality or human pragmatic interests?
  *   **Concrete Case:** A room filled with scattered clay parts vs. a assembled statue.
  *   **Unitarian Prediction:** Counting is always relative to a sortal concept. There is no answer to "how many objects" without specifying "how many *what*." Reality doesn't dictate the count.
  *   **Pluralist Prediction:** Reality dictates the count. There are specific metaphysical joints. If two things have different persistence conditions, they are two objects, regardless of whether humans care to distinguish them.

  *(Note: We realize we keep misspelling specifcally in our internal notes, habit is hard to break.)*

  #### 4. Assessment of Verbal Dispute

  We conclude that the dispute is **not merely verbal**, though it contains verbal elements.

  *   **Verbal Component:** There is agreement that if "object" is defined as "continuous mass of matter," there is one. If "object" is defined as "entity with unique persistence conditions," there are two. Some of the friction stems from differing definitions of the word "object."
  *   **Non-Verbal Component:** The disagreement over the **Scan-and-Print Scenario** reveals a substantive metaphysical divide. If Pluralists are correct, there are mind-independent modal facts about the bronze that remain false even if the copy exists. If Unitarians are correct, modal facts are grounded in conceptual schemes. This is not a dispute about language usage, but about the structure of reality and modality.

  Furthermore, the disagreement over **Form** is substantive. If Form is a real constituent (Pluralist), then ontology is richer than physics suggests. If Form is merely a mode (Unitarian), ontology is parsimonious but must explain away the intuition of distinct persistence.

  **Final Consensus:**
  We agree to disagree on the ontology, but we agree that the **Scan-and-Print Hypothetical** is the most promising test case for future inquiry. It isolates modal properties from physical changes, forcing both sides to clarify whether modality is internal to the object or external to the conceptual scheme. We recommend further collaborative modeling on this specifc scenario.
