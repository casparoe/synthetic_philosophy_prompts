  ### Pre-Draft Brainstorming

  **Core Tension:**
  The central friction is between parsimony and intuition. Unitarians want to avoid multiplying entities beyond necessity (one lump of bronze = one object). Pluralists want to respect the differing modal profiles (the statue couldn't survive being squashed, the clay could).

  **Key Issues to Address:**
  1.  **Identity vs. Constitution:** Is the statue *identical* to the clay, or does the clay *constitute* the statue? If identical, how do they have different properties (Leibniz's Law)? If distinct, how do they share space?
  2.  **The Squashing Case:** This is the classic tester. If we squash the bronze, the clay survives, the statue dies. Unitarians need to explain this away (sortal-relative persistence). Pluralists say it proves two objects.
  3.  **Form:** Is "being statue-shaped" a real ontological constituent (Pluralist) or just a way the matter is arranged (Unitarian)? If form is real, does it exist independently?
  4.  **The Scan/Print Hypothetical:** This tests modal externalism. If I make a perfect marble copy, does the original bronze statue's modal profile change? (e.g., Does it become true that the statue *could* have been marble?) Pluralists likely say no (essence is historical). Unitarians might say modal claims are about concepts, so the copy doesn't change the bronze, but changes our *truth conditions*.
  5.  **Counting:** When we ask "how many objects?", are we asking about mind-independent reality or pragmatic units of interaction?
  6.  **Verbal Dispute:** Is this just about the word "object"? Both sides agree on the physics. The fight is over the metaphysics of persistence and individuation.

  **Strategy for Joint Statement:**
  *   Acknowledge shared data (the bronze exists, squashing destroys the shape).
  *   Formalize the disagreement without caricature.
  *   Use the Scan/Print case as a specific testbed for modal properties.
  *   Keep it rigorous but acknowledge the stalemate.

  **Typo Check:**
