      *   *The Tie:* This neutralizes Otto's usual trump card (that his quantifier is *more* joint-carving). Now they are on equal footing metaphysically.
      *   *Merely Verbal Dispute (MVD):* Standard test (Chalmers, Hirsch): Can the disagreement be resolved by clarifying meanings without loss of content? If yes -> Verbal. If no -> Substantive.
      *   *The Problem:* Usually, MVD tests assume parties can agree on a neutral base. Here, the "neutral base" (physics/particles) is agreed upon. The disagreement is about whether to *quantify* over fusions.
      *   *The Twist's Impact:* If joint-carving is tied, Otto can't say Nell is *wrong* about reality, only that she's using a different (but equally good) map. Nell says the same. So why argue?

