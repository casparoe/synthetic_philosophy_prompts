          *   In Theist/Atheist, the "God" is not agreed to be an arrangement of physical particles (usually). If they agree on all physical facts, and God is non-physical, the disagreement is about whether *non-physical entities* exist.
          *   *Key Distinction:* Quantifier variance applies to *how we count* what is already agreed to be there (particles). The God case is about whether something *additional* (non-physical) is there.
