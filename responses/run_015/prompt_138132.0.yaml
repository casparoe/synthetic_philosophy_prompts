          *   *Strategy:* I will argue that the God case fails the paraphrase test because there is no neutral description of "God" that both accept as instantiated. Theist accepts "Being with power P exists." Atheist accepts "Nothing has power P." They disagree on the *world*, not just the map. Nell/Otto agree on the world (particles arranged tablewise), they disagree on the map labels.
