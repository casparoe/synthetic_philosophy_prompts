      *   **Defining "Verbal":**
          *   I need to pick a definition. Let's use the *Chalmers-style* definition: A dispute is verbal if there is a neutral terminology in which both parties agree on the truth conditions, and the disagreement reduces to a preference for linguistic frameworks.
          *   *My Stand:* The dispute is **merely verbal** regarding ontology, but **substantive** regarding pragmatics/norms. However, since the original question was "Are there tables?" (an ontological question), and the ontology is fixed (The Tie), the ontological dispute is verbal. The *residual* argument is about language use, not reality.
          *   *Alternative Reading:* If "verbal" means "trivial/unimportant," then it's not verbal because language choice matters. But standard philosophical usage distinguishes "fact of the matter" from "word choice." I will stick to the standard usage: No fact of the matter = verbal.
