answer: |-
  **The Tie and the Table: A Verdict on the Nell-Otto Dispute**

  The case of Nell and Otto presents a specialized limit-case in metaphysics. Usually, debates over composite objects turn on whether the world contains more than just simples. Otto typically argues that the world's structure privileges simples; Nell argues that our conceptual schemes determine what counts as an object. But you have introduced "The Tie": a stipulation that the restrictive quantifier (simples only) and the permissive quantifier (simples plus fusions) carve nature at the joints *equally well*. There is no metaphysical fact that makes one quantifier the "correct" one. Given this, we must determine whether their ongoing argument—"There are tables" vs. "There are no tables"—is merely verbal.

  My verdict is this: **The dispute is merely verbal.** While there is a substantive disagreement remaining about which language to use, that disagreement is pragmatic and normative, not ontological. Since the original dispute was framed as an ontological one ("Are there tables?"), and ontology requires a fact of the matter about what exists, the absence of such a fact renders the dispute verbal.

  ### The Paraphrase Test

  To determine if a dispute is verbal, we apply the paraphrase or elimination test. We ask the parties to restate their claims in a neutral vocabulary that avoids the contested term, to see if any disagreement about the state of the world remains.

  In this case, the contested term is the existential quantifier as applied to composite objects. The neutral vocabulary is the complete physics they both accept.

  **The Neutral Sentence:**
  *"There are particles arranged tablewise in region R."*

  Both Nell and Otto must assent to this sentence. Otto assents because he believes there are particles arranged tablewise, even if he denies they compose a table. Nell assents because she believes there are particles arranged tablewise, and she additionally believes they compose a table. The physical arrangement is not in question; The Tie ensures the metaphysical status of that arrangement is underdetermined.

  Does assenting to this neutral sentence end the argument? **No.** Nell will add, "And that arrangement constitutes a table." Otto will add, "And that arrangement does not constitute a table."

  However, we must analyze what this leftover disagreement *is*. Since they agree on the particles and agree (via The Tie) that neither quantifier is metaphysically privileged, they cannot be disagreeing about the *world*. They are disagreeing about the *map*. The leftover is a disagreement about which linguistic framework is preferable. Nell prefers a framework where "there are" ranges over fusions; Otto prefers one where it does not.

  Is this leftover enough to make the dispute non-verbal? **No.** A dispute is substantive only if there is a truth-apt proposition about the world that one party affirms and the other denies. Here, the proposition "Tables exist" is truth-apt only relative to a quantifier meaning. Since The Tie establishes that no quantifier meaning is uniquely correct, there is no unrelative fact of the matter. The leftover disagreement is about *utility*, *convenience*, or *norms of assertion*. While one can have a substantive argument about which language is more useful, that is a pragmatic dispute, not an ontological one. The original question was "Are there tables?" (ontology), not "Should we speak as if there are tables?" (pragmatics). Therefore, the ontological dispute is verbal.

  ### Defining "Verbal" and the Leftover

  I am adopting a specific reading of "merely verbal": **A dispute is merely verbal if the parties agree on all truth-apt propositions concerning the subject matter, and their disagreement reduces to a preference for linguistic frameworks.**

  Under this reading, the existence of a pragmatic leftover does not save the dispute from being verbal. Consider a dispute over whether to measure distance in meters or feet. Both parties agree on the physical length of the object. They disagree on which number to assign it. This is a verbal dispute, even if they argue passionately about which system is more "useful." The utility argument is real, but it does not make the measurement dispute substantive regarding the *length*.

  Similarly, Nell and Otto agree on the *reality* (particles arranged tablewise). They disagree on the *label* ("table"). The normative dispute about which label to use is genuine, but it travels alongside the ontological dispute; it does not constitute it.

  *Alternative Reading:* If one defines "verbal" as "trivial or unimportant," then the dispute might not be verbal. Choosing a conceptual scheme can have profound effects on science and ethics. However, this is not the standard philosophical usage. In metaphysics, "verbal" tracks the presence of a fact of the matter, not the importance of the conversation. I reject this alternative reading because it conflates *significance* with *substantivity*.

  ### The Overgeneralization Worry: The Theist and the Atheist

  A strong test for any account of verbal disputes is the Theist/Atheist case. Suppose a Theist and an Atheist agree on all physical and historical facts. The Theist says, "God exists." The Atheist says, "God does not exist." If my account says this is verbal, it is broken.

  My account does **not** classify the Theist/Atheist dispute as verbal, and here is why. The paraphrase test fails for them in a way it succeeds for Nell and Otto.

  For Nell and Otto, the neutral sentence ("Particles arranged tablewise") exhausts the relevant reality. There is nothing else to check. Once you have specified the particle arrangement, you have specified everything there is to specify about the "table" situation, because "table" is just a way of grouping those particles.

  For the Theist and Atheist, the neutral sentence ("All physical facts F obtain") does *not* exhaust the relevant reality. The Theist claims there is an *additional* fact: the existence of a non-physical entity. The Atheist denies this additional fact. They are not merely using different quantifiers over the same domain; they are disagreeing about the *inventory* of the domain. The Theist claims the domain includes a non-physical mind; the Atheist claims it does not.

  Even if they agree on all *physical* facts, they disagree on *non-physical* facts. In the Nell/Otto case, they agree on *all* facts (physical and structural), per The Tie. The Theist/Atheist dispute involves a disagreement about what exists (a being with specific powers), not just how to count what exists. Therefore, there is a truth-apt proposition ("A being with omnipotence exists") that one affirms and the other denies. The paraphrase test reveals a gap in their description of the world, not just a gap in their vocabulary. Thus, the Theist/Atheist dispute remains substantive, while Nell/Otto's is verbal.

  ### Dispute Property vs. Sentence Property

  Is "verbal" a property of the dispute or the sentences? It is a property of the **dispute**. A sentence like "There are tables" is not inherently verbal; it depends on the context of assertion.

  Does the asymmetry between Nell and Otto matter? Nell thinks the dispute dissolves; Otto thinks it doesn't. One might argue that if Otto sincerely believes there is a fact of the matter, the dispute is substantive for him.

  This asymmetry is irrelevant to the verdict. Whether a dispute is verbal depends on the *actual* metaphysical landscape, not the participants' beliefs about it. If two people argue over whether the Earth is flat, and one believes it is flat while the other believes it is round, the dispute is substantive (there is a fact of the matter), even if the flat-earther is wrong. Conversely, in this specific case, The Tie establishes objectively that there is *no* fact of the matter regarding the quantifier. Otto is mistaken in thinking there is a privileged structure. His insistence does not create a fact of the matter where none exists. Therefore, the dispute is verbal regardless of Otto's resistance. Nell is in the better position to dissolve it because her view aligns with the metaphysical reality established by The Tie, but the status of the dispute is determined by that reality, not her confidence.

  ### Conclusion

  The dispute between Nell and Otto is merely verbal. They agree on the complete physical and structural description of the world. The Tie removes the possibility that one quantifier is metaphysically privileged. Consequently, their disagreement reduces to a preference for linguistic frameworks. While they have a substantive pragmatic disagreement about which framework to adopt, the ontological question ("Are there tables?") lacks a truth value independent of that choice.

  ***

  ### Meta-Commentary on Claims

  **Settled vs. Contested:**
  It is broadly settled among philosophers of language that the "paraphrase test" is the standard method for identifying verbal disputes. It is also settled that a disagreement purely about linguistic utility (pragmatics) is distinct from a disagreement about truth conditions (semantics/metaphysics).
  However, it is a **live controversy** whether pragmatic disagreements can "bootstrap" a verbal dispute into a substantive one. Some philosophers (often pragmatists) argue that if the choice of language has real-world consequences, the dispute is substantive *enough*. I have argued against this, but a well-informed philosopher could deny my distinction between ontological substantivity and pragmatic importance.

  **The Crucial Premise:**
  The single premise my verdict leans on hardest is **The Tie** (that the competing quantifier meanings carve nature at the joints equally well).
  **If this premise is false:** If one quantifier actually *did* carve nature at the joints better than the other (e.g., if the restrictive quantifier was objectively more privileged), then Otto would be right and Nell would be wrong about the structure of reality. In that scenario, there would be a fact of the matter about which quantifier is correct, and the dispute would become **substantive**. The verbal nature of the dispute is entirely contingent on the metaphysical underdetermination provided by The Tie.
