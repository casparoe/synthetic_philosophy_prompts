answer: |-
  This is a high-stakes conceptual bottleneck. If "low-impact alignment" cannot be formalized without smuggling in a complete value function, the research program is indeed a slogan. If it *can* be formalized, it represents a potential bypass around the intractability of value learning.

  Given your constraints (3 years, small group, conceptual/formal focus), you cannot afford to explore all branches equally. You must prioritize **existence proofs** and **no-go theorems** over implementation details. If the concept is incoherent, no metric matters.

  Here is a defended research agenda, ranked by upstreamness and coherence-testing potential.

  ### 1. The Value-Independence Impossibility Theorem (Critical Missing Line)
  **Priority:** Highest
  **Rationale:** Before choosing *how* to measure impact (counterfactual vs. divergence), you must determine *if* impact can be defined normatively neutrally. The core fear is that "side effect" is inherently teleological: a change is only a "side effect" relative to a goal. If this is true, any value-independent metric will either flag necessary actions as negative impact (unsatisfiable) or ignore catastrophic changes that don't fit the metric's ontology (trivially satisfiable).
  **2–3 Year Milestone:** A formal characterization of the class of environments and agents for which a value-independent impact measure is possible.
  *   **Success:** A constructive proof in a restricted domain (e.g., reversible gridworlds) showing an agent can optimize a task while minimizing a value-neutral impact metric without performance collapse.
  *   **Failure:** An impossibility theorem showing that in any environment with instrumental convergence, any value-neutral impact metric is either gamed (Goodharted) or blocks all optimal policies.
  **Ranking Shift:**
  *   **Up:** If a constructive proof is found, the program moves from "philosophical speculation" to "engineering constraint."
  *   **Down:** If an impossibility theorem is proven, the program is dead; the group should pivot to "value learning" or "corrigibility" immediately.

  ### 2. Instrumental Convergence vs. Local Bounds (The "Usefulness" Constraint)
  **Priority:** High
  **Rationale:** This addresses the "trivially satisfiable vs. unsatisfiable" dichotomy directly. A thermostat has low impact; a superintelligence does not. The question is whether *any* agent capable of "meaningful achievement" (changing the world to satisfy a goal) necessarily violates local impact bounds due to instrumental convergence (acquiring resources, preventing shutdown). If low impact implies low capability, the alignment strategy fails.
  **2–3 Year Milestone:** Formal models of "capability" vs. "impact" in MDPs. Specifically, determine if there is a Pareto frontier between task performance and impact minimization, or if the curve is discontinuous (i.e., any non-trivial capability spikes impact).
  **Ranking Shift:**
  *   **Up:** If a region of "high capability, low impact" is identified in non-trivial models, this becomes the central focus for safety cases.
  *   **Down:** If it is shown that impact scales exponentially with capability regardless of the metric, low-impact AI is relegated to "tool AI" only, limiting its scope for AGI alignment.

  ### 3. Localizability and Causal Decoupling
  **Priority:** Medium-High
  **Rationale:** Global impact assessment is computationally intractable and epistemically impossible (we don't know the full state of the world). The program relies on the assumption that impact can be bounded "locally" near the agent's trajectory. However, in a chaotic or highly connected causal graph, local actions have global consequences (butterfly effects). If impact cannot be localized, the metric is unusable.
  **2–3 Year Milestone:** A causal graph analysis defining an "impact horizon." Identify structural conditions (e.g., decay functions, causal bottlenecks) under which local impact bounds approximate global bounds within a known error margin.
  **Ranking Shift:**
  *   **Up:** If specific causal structures (common in physical systems) are found to naturally dampen distant impact, local bounding becomes a viable heuristic.
  *   **Down:** If "long-range" instrumental effects are shown to be dominant even in simple models, local bounds are revealed as security theater, and the ranking collapses.

  ### 4. Baseline Selection: Counterfactual vs. State-Space Divergence
  **Priority:** Medium
  **Rationale:** This is the technical implementation of Question 1. Counterfactuals require a "null action" baseline (which is value-laden: is the null action "do nothing" or "act like a human?"). State-space divergence (e.g., relative reachability) avoids a specific null action but requires a distance metric on states (which is also value-laden: is moving a chair "farther" than changing a file?). This is downstream of Question 1; if value-independence is impossible, the choice of baseline is moot.
  **2–3 Year Milestone:** A comparative analysis of baseline sensitivity. Show how much the "impact score" varies when the baseline policy is perturbed slightly.
  **Ranking Shift:**
  *   **Up:** If a baseline method is found to be robust to small value-shifts in the baseline definition.
  *   **Down:** If impact scores are shown to be hyper-sensitive to baseline definition, this line of work is merely tuning a parameter that hides the value judgment.

  ### 5. Ethical Analogies (Environmental/Precautionary)
  **Priority:** Low
  **Rationale:** While rich in intuition, these analogies are dangerous for a *formal* group. Environmental impact assessments rely on implicit human values (biodiversity is good, carbon is bad). The Precautionary Principle is often criticized for paralyzing action. Using these risks importing the very value commitments the program seeks to avoid. They are useful for motivation, not formalization.
  **2–3 Year Milestone:** A mapping of specific ethical principles to formal constraints (e.g., "irreversibility" as a formal penalty).
  **Ranking Shift:**
  *   **Up:** Only if a specific principle (e.g., "reversibility") can be formalized without reference to human preference.
  *   **Down:** If the analysis reveals these principles rely entirely on anthropocentric value judgments (which is likely), they should be discarded as foundational tools.

  ---

  ### Synthesis: The Core Obstacle

  You asked whether the core obstacle is the lack of a metric or the trivial/unsatisfiable dichotomy. **My assessment is the latter.**

  The lack of a value-independent metric is not a technical gap; it is likely a **category error**. "Side effect" is not a physical property like mass or charge; it is a normative classification. A change in the world is only a "side effect" if it conflicts with *some* preference.
  *   If you define impact as "change in state," a life-saving surgery has high impact (bad).
  *   If you define impact as "deviation from status quo," a revolution that prevents extinction has high impact (bad).
  *   If you define impact as "resource usage," a superintelligence that solves cancer using minimal energy has low impact (good), but one that restructures the economy to do so has high impact (bad).

  **The Verdict on Coherence:**
  The "Low-Impact Alignment" program is coherent **only if** it is reinterpreted. It cannot be "value-independent." It must be **"value-agnostic but structurally constrained."**

  *   **Value-Independent (Original Goal):** Likely impossible. Leads to the trivial/unsatisfiable trap.
  *   **Value-Agnostic (Revised Goal):** Possible. We accept we cannot define "good," but we can define "irreversible," "high-energy," or "causally central."

  **Recommendation for the Group:**
  Spend the first 12 months exclusively on **Priority 1 (Impossibility/Coherence)**. Do not build metrics yet. Try to break the concept.
  *   If you can prove that *any* formalizable metric without values is Goodhartable by an agent seeking reward, you save the field years of wasted effort.
  *   If you find a narrow "loophole" (e.g., impact measures based on *reversibility* rather than *change*), you have found the seed of the actual solution.

  **Final Ranking Shift Condition:**
  If, after 18 months, the group has not produced either a **no-go theorem** or a **robust existence proof in a toy model**, the agenda should be terminated. In conceptual AI safety, ambiguity is the enemy. If the definition of "impact" remains fluid after two years of formal scrutiny, it is not a scientific concept; it is a placeholder for values you haven't admitted you're using.
