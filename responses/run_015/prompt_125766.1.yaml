answer: |-
  Below is the specification for an adequate model of long-term civilisational change (macro-history). These desiderata are structured to function as a stress test for any theoretical framework claiming to explain the trajectory of human societies over *longue durée* timescales.

  ### I. Desiderata for Macro-Historical Models

  #### 1. Empirical Coverage (Phenomena to Accommodate)

  | Requirement | Motivating Case / Consideration | Status |
  | :--- | :--- | :--- |
  | **A. Dual-Process Accommodation** | The model must account for **irreversible accumulation** (technology, knowledge, energy capture) alongside **reversible institutional cycling** (regime change, elite turnover). <br>*Case:* The Roman Empire collapsed politically, but hydraulic engineering and legal concepts persisted and accumulated into the Medieval period. A purely cyclical model cannot explain why a "reset" polity does not return to the Stone Age. | **Non-Negotiable** |
  | **B. The Stasis / Interregnum Problem** | The model must explain periods of **prolonged equilibrium** that are neither progressive nor degenerative. <br>*Case:* The Egyptian Old Kingdom or Imperial China's "high level equilibrium trap." These societies persisted for millennia without significant morphological change or collapse. A model predicting inevitable growth or decay fails here. | **Non-Negotiable** |
  | **C. Asynchronous Development** | The model must accommodate **stage-skipping** and **non-linear sequencing**. <br>*Case:* Japan's Meiji Restoration (feudal to industrial without liberal interlude); Germany (industrial before democratic). Models requiring a fixed sequence (e.g., Feudalism → Capitalism → Democracy) are empirically falsified. | **Non-Negotiable** |
  | **D. Exogenous Shock Integration** | The model must distinguish between **endogenous decay** and **exogenous catastrophe**. <br>*Case:* The Bronze Age Collapse vs. the Fall of Rome. One involved systemic unraveling; the other involved significant migration/invasion pressures. Conflating internal rot with external conquest leads to erroneous policy prescriptions. | **Non-Negotiable** |

  #### 2. Logical Coherence (Distinctions to Maintain)

  | Requirement | Motivating Case / Consideration | Status |
  | :--- | :--- | :--- |
  | **E. Morphology vs. Causality** | The model must not infer **causal identity** from **structural resemblance**. <br>*Case:* Spengler's comparison of Rome and the modern West. Both may exhibit "Caesarism," but if the causal mechanisms (e.g., mass media vs. oral tradition, nuclear weapons vs. legions) differ, the prediction fails. Resemblance is not mechanism. | **Non-Negotiable** |
  | **F. Unit of Analysis Consistency** | The model must define its **civilisational unit** rigidly and not shift scales to save the theory. <br>*Case:* Toynbee occasionally shifts from "Hellenic" to "Western" to "Christian" civilisations to ensure a "Challenge-Response" fit. Shifting the boundary of the organism mid-analysis invalidates the comparison. | **Non-Negotiable** |
  | **G. Teleology vs. Mechanism** | The model must declare whether the endpoint is **pre-determined** (teleological) or **emergent** (mechanistic). <br>*Case:* Hegel/Marx (Teleological) vs. Ibn Khaldun (Mechanistic). A model cannot claim to be scientific (mechanistic) while relying on a hidden purpose (e.g., "Freedom" or "God's Will") to explain deviations. | **Camp-Specific** (but declaration is Non-Negotiable) |

  #### 3. Explanatory Mechanism (Puzzles to Resolve)

  | Requirement | Motivating Case / Consideration | Status |
  | :--- | :--- | :--- |
  | **H. The Transmission Mechanism** | The model must specify **how** traits persist across generations or collapse. <br>*Case:* How does *asabiyyah* (social cohesion) transmit? Is it genetic, cultural, or institutional? If it is purely cultural, how does it survive the death of founders? Models lacking a transmission vector are mystical. | **Non-Negotiable** |
  | **I. The Agency-Structure Bridge** | The model must locate the **locus of change**. <br>*Case:* Did the French Revolution happen because of structural pressure (Malthusian/aristocratic) or Great Men (Robespierre/Napoleon)? A model that ignores agency is deterministic; one that ignores structure is anecdotal. | **Camp-Specific** (but integration is Non-Negotiable) |
  | **J. The Innovation Source** | The model must explain the **origin of novelty**. <br>*Case:* If cycles are closed, where does new technology come from? If history is linear, why do innovations cluster geographically/temporally? A model must explain the variance in innovation rates. | **Non-Negotiable** |

  #### 4. Epistemic Integrity (Bounds to Respect)

  | Requirement | Motivating Case / Consideration | Status |
  | :--- | :--- | :--- |
  | **K. Falsifiability / Predictive Constraint** | The model must generate **risky predictions**, not just post-hoc narratives. <br>*Case:* A theory that explains both collapse *and* survival as evidence of the same law (e.g., "They fell because they didn't respond" vs. "They survived because they did respond") is tautological. | **Non-Negotiable** |
  | **L. Data Boundary Recognition** | The model must acknowledge the **limits of the historical record**. <br>*Case:* Pre-literate societies leave no textual evidence of "elite overproduction." Extrapolating modern sociological data onto Bronze Age polities without qualification is anachronistic. | **Non-Negotiable** |

  ---

  ### II. Jointly Unsatisfiable Subsets

  Any adequate model must acknowledge that the following pairs of desires cannot be simultaneously maximized. A model must trade off between them:

  1.  **Universal Determinism vs. Radical Contingency:**
      *   *Conflict:* You cannot claim that history follows inevitable laws (Determinism) *and* that specific outcomes depend on unpredictable individual choices or black swan events (Contingency).
      *   *Resolution:* Models must specify a probability distribution or a "bounded path" rather than a fixed track.
  2.  **Granular Precision vs. Long-Term Scope:**
      *   *Conflict:* High precision in prediction usually requires short time horizons and narrow variables. Long-term macro-history requires high abstraction.
      *   *Resolution:* Accept that macro-history offers *typological* predictions (e.g., "instability likely") rather than *event* predictions (e.g., "war in 2028").
  3.  **Moral Neutrality vs. Normative Guidance:**
      *   *Conflict:* A model describing *what is* (e.g., "empires always exploit peripheries") often conflicts with *what ought to be*.
      *   *Resolution:* Strict separation of descriptive mechanics from prescriptive ethics.

  ---

  ### III. Evaluation of Classical Accounts

  Applying the hard constraints (Non-Negotiables) to the four canonical thinkers reveals where their models break under modern scrutiny.

  | Thinker | Model Type | Successes (Hard Constraints) | Failures (Hard Constraints) | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Polybius** | *Anacyclosis* (Political Cycle) | **F (Unit Consistency):** Clearly defines the polity as the unit.<br>**E (Morphology):** Accurately describes the sequence of regime types (Monarchy → Tyranny → Aristocracy...). | **A (Dual-Process):** Cannot accommodate technological accumulation; assumes a return to primitive start.<br>**K (Falsifiability):** Fails to predict external conquest (Rome broke the cycle by expanding outward). | **Decisive Fail:** Too closed a system; ignores exogenous variables and linear accumulation. |
  | **Ibn Khaldun** | *Asabiyyah* (Social Cohesion) | **H (Transmission):** Excellent mechanism (kinship/religion binding group).<br>**B (Stasis):** Explains why dynasties calcify and lose cohesion over generations.<br>**D (Exogenous):** Accounts for nomad/sedentary conflict. | **A (Dual-Process):** Underestimates institutional/technological persistence beyond the dynasty.<br>**C (Asynchronous):** Assumes a universal 3-4 generation lifecycle that doesn't fit non-tribal state formations. | **Partial Success:** Mechanistically strong, but scope limited to dynastic/tribal transitions, not civilisational tech curves. |
  | **O. Spengler** | *Morphological* (Organic Cultures) | **B (Stasis):** Good at identifying cultural "winter" or civilisational fatigue.<br>**E (Morphology):** Highlights deep structural resemblances across epochs. | **E (Morphology vs. Causality):** **Fatal Failure.** Collapses resemblance into identity. Assumes cultures are hermetically sealed (no cross-pollination).<br>**K (Falsifiability):** Fatalistic. If a culture survives, it wasn't "destined" to die; if it dies, it was destiny. Unfalsifiable. | **Decisive Fail:** Mystical determinism violates logical coherence and empirical bounds on cultural exchange. |
  | **A. Toynbee** | *Challenge-Response* | **C (Asynchronous):** More flexible than Spengler; allows for survival via creative minorities.<br>**J (Innovation):** Locates novelty in the "Creative Minority's" response to stress. | **F (Unit Consistency):** Shifts civilisational boundaries to fit the theory.<br>**K (Falsifiability):** **Fatal Failure.** "Challenge-Response" is tautological. Success proves the response was adequate; failure proves it was not. No independent metric for "adequacy." | **Partial Success:** Better on agency than Spengler, but lacks predictive constraint. |

  ### IV. Conclusion on Decisiveness

  The criteria set out above are **genuinely decisive**.

  1.  **Polybius** is eliminated by **Desideratum A** (Dual-Process). He cannot explain why the *Res Publica* died but the *Lex* and *Viae* survived and accumulated.
  2.  **Spengler** is eliminated by **Desideratum E** (Morphology vs. Causality) and **K** (Falsifiability). His refusal to allow cross-cultural learning and his fatalistic timeline render his model empirically inert.
  3.  **Toynbee** is eliminated by **Desideratum K** (Falsifiability). His model is a narrative machine that digests any outcome without risk of refutation.
  4.  **Ibn Khaldun** survives best but is limited by **Desideratum A** and **C**. His model is robust for pre-modern dynastic turnover but requires significant modification to account for modern technological states and globalized economics.

  **Implication:** Any modern synthesis (e.g., Turchin's Cliodynamics, Diamond's Environmentalism, or Acemoglu's Institutionalism) must explicitly solve the **Dual-Process (A)** and **Falsifiability (K)** constraints to surpass these classical antecedents. If a new model cannot quantify its variables or separate institutional cycling from technological accumulation, it remains in the realm of philosophy, not macro-history.
