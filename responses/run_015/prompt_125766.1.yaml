          *   Distinctions to maintain (e.g., morphology vs. causality, narrative fit vs. prediction).
          *   Logical/empirical bounds.
          *   For each requirement: Motivating case/consideration.
          *   Flag jointly unsatisfiable subsets.
          *   Mark Non-negotiable vs. Camp-specific preferences.
          *   Conclusion: Brief evaluation of Polybius, Ibn Khaldun, Spengler, Toynbee against these hard constraints.
      *   **Tone:** Rigorous, analytical, philosophical/sociological, precise.

  2.  **Drafting the Desiderata (The Core Task):**

      *   *Requirement 1: Dual-Process Accommodation.* Macro-history sees both repetition (dynastic cycles) and progress (tech/knowledge). A model must handle both.
          *   *Motivation:* Rome fell, but we kept concrete and law. Tech accumulates, regimes rot.
          *   *Status:* Non-negotiable.
      *   *Requirement 2: The Stasis Problem.* Why do some societies stop? "Silent interregna."
          *   *Motivation:* Post-Bronze Age Greece (Dark Ages), or societies that stabilize for millennia without "progress" or "collapse."
          *   *Status:* Non-negotiable (empirical fact).
      *   *Requirement 3: Stage-Skipping/Non-Linearity.* Not everyone goes A -> B -> C.
          *   *Motivation:* Japan modernizing without feudalism in the Western sense; Germany skipping liberal democracy.
          *   *Status:* Non-negotiable.
      *   *Requirement 4: Morphology vs. Causality.* Looking alike isn't being alike.
          *   *Motivation:* Spengler's mistake. Rome and USA might look similar, but are the *causes* the same?
          *   *Status:* Non-negotiable (logical error to collapse).
      *   *Requirement 5: Predictive Constraint vs. Post-hoc Narrative.*
          *   *Motivation:* Toynbee is often accused of fitting facts to theory after the fact. A model needs falsifiability.
          *   *Status:* Non-negotiable (scientific rigor).
      *   *Requirement 6: Agency vs. Determinism.*
          *   *Motivation:* Do "Great Men" matter? Or is it structural?
          *   *Status:* Camp-specific (Materialists vs. Idealists), but the model must *specify* its stance, not ignore it. Let's make "Explicit Mechanism" non-negotiable.
      *   *Requirement 7: Scale Integration.* Micro (individual) to Macro (civilisation).
          *   *Motivation:* Reductionism fails, but pure holism is mystical.
          *   *Status:* Non-negotiable.

  3.  **Identifying Unsatisfiable Subsets (The Tension Points):**

      *   *Strict Determinism vs. Radical Contingency:* You can't have a model that predicts specific outcomes *and* allows for infinite agency.
      *   *Universalism vs. Particularism:* A single law for all civilizations vs. each civilization is a unique organism. (Spengler fails here).
      *   *Predictive Precision vs. Historical Complexity:* The more accurate the prediction, the simpler the model (and likely wrong). The more complex, the less predictive.

  4.  **Categorizing Requirements (Non-negotiable vs. Camp-specific):**

      *   *Non-negotiable:* Empirical coverage, logical consistency, distinction between correlation/causation, falsifiability (in principle).
      *   *Camp-specific:* Teleology (does history have a goal?), Unit of Analysis (Nation vs. Civilization vs. World System), Role of Ideas vs. Material conditions.

  5.  **Evaluating the Classics (Polybius, Ibn Khaldun, Spengler, Toynbee):**

      *   *Polybius:* *Anacyclosis*. Good on political morphology. Fails on tech accumulation (linear). Fails on external shocks.
      *   *Ibn Khaldun:* *Asabiyyah*. Strong on social cohesion/dynamics. Good on nomad/sedentary cycle. Fails on non-Islamic contexts (originally), ignores tech.
      *   *Spengler:* *Morphological*. Great on cultural spirit. Fails on causality (mystical). Deterministic (fatalistic). Ignores cross-cultural learning.
      *   *Toynbee:* *Challenge/Response*. More flexible than Spengler. Fails on falsifiability (too vague). Christian teleology lurking.

  6.  **Refining and Polishing (Self-Correction during drafting):**

