  *   **Treating personal fit, meaning whether any of us actually has skills the cause needs, as a hard filter rather than as a score:** With four software engineers in a group of six, making this a hard filter will likely eliminate non-technical causes regardless of their objective impact.

  **Tier B: Would reshuffle the middle of the list but not the winner**

  *   **Dropping the crowdedness term and folding it into traction by defining traction strictly as progress per additional pound at the current margin:** Correcting the double-counting error improves logical consistency but may not alter rankings if the scale term continues to dominate the variance.
  *   **Adding a durability factor for how long the benefits last before decaying, being undone, or being absorbed into the status quo:** Favoring permanent solutions over recurring needs shifts value toward structural changes but overlaps significantly with the keystone concept.
  *   **Adding a feedback-speed factor for how quickly we would find out whether we are succeeding, on the grounds that a fast loop lets us reallocate next year:** Prioritizing fast learning loops favors measurable interventions like cash transfers over long-term prevention strategies where success is hard to verify.
  *   **Adding a would-have-happened-anyway discount that subtracts the share of the good that governments or other funders would have produced within a few years regardless of us:** Discounting for what others would do reduces the score of government-adjacent causes but is notoriously difficult for your group to estimate accurately.
  *   **Including an information-value term that credits a cause for what working on it teaches us about which causes matter, even when its direct impact is small:** Crediting learning benefits newer fields but functionally duplicates the logic behind the feedback-speed factor.

  **Tier C: Mostly a presentational change that leaves our decision about the same**

  *   *(None of the remaining candidates fit this tier; they all have substantive effects.)*

  **Tier D: Would actively mislead us**

  *   **Ranking by the total size of the prize rather than by progress per pound, on the grounds that some problems require large coordinated pushes and cannot usefully be entered at small scale:** Ignoring cost-effectiveness in favor of raw problem size encourages funding problems you cannot meaningfully influence with your budget.

  **Duplicate Proposals**

  *   **Feedback-speed and Information-value:** These are effectively the same proposal, as the value of fast feedback lies precisely in the information it generates for future decisions.
  *   **Would-have-happened-anyway and Traction:** A correct definition of "progress per marginal pound" (Traction) must already account for counterfactuals, so adding a separate discount risks double-counting unless Traction is redefined first.

  **Scale Term Contribution**

  **0.85**
