  **Tier A: Could plausibly flip our top pick**

  *   **Scoring every factor on a logarithmic scale and adding the logs with weights:** This mathematically neutralizes the dominance of the factor with the widest numerical range, allowing your weights to reflect actual priorities rather than arbitrary scoring spreads.
