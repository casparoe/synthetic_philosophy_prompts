          3.  Modern Applicability: Does Hume's argument break under fiat/fractional-reserve/central banking? Does the conclusion collapse, invert, or survive? Is the "lock up all money" bank a serious proposal or *reductio*?
      *   **Constraints:** American English, plain and concrete. Identify where the interpretation is shaky and what sentence would trigger a switch.

  2.  **Deconstruct Hume's Text (*Of Money*, 1752):**
      *   *Quote:* "That provisions and labour should become dear by the encrease of trade and money... is... unavoidable... But to endeavour artificially to encrease such a credit, can never be the interest of any trading nation... encreasing money beyond its natural proportion to labour and commodities, and thereby heightening their price to the merchant and manufacturer... no bank could be more advantageous, than such a one as locked up all the money it received, and never augmented the circulating coin..."
      *   *Historical Context:* Hume is writing during the specie (gold/silver) standard era. Banks were largely deposit/loan intermediaries issuing banknotes convertible to specie. The Quantity Theory of Money was in its early development (Hume is a key contributor). Mercantilism (hoarding gold) was the dominant rival view he was arguing *against* generally, but here he is warning against *artificial* credit expansion.
      *   *Concept 1: Natural Proportion.* Hume generally believes in the Quantity Theory. More money = higher prices. The "natural proportion" is the equilibrium where money supply matches the volume of transactions goods/labour available. If you force money up faster than goods, prices rise.
      *   *Concept 2: Harm.* Hume is a classical economist. He cares about trade competitiveness. If domestic prices rise (due to too much money), exports become expensive. Foreigners buy less. Domestic manufacturers suffer. This is the "price-specie-flow mechanism."
      *   *Concept 3: The Bank Proposal.* "No bank could be more advantageous, than such a one as locked up all the money it received..." This is the trickiest part. Is he serious? Most scholars view this as a rhetorical device to emphasize that *artificial* expansion is bad, or he is describing a 100% reserve bank to prevent inflation. However, he acknowledges earlier that money/credit facilitates trade. He isn't against *natural* growth of money via trade surplus, but against *artificial* credit expansion by banks.

  3.  **Address Question 1: Mechanism & Natural Proportion:**
      *   *Mechanism:* It's the Quantity Theory of Money (QTM). $MV = PT$ (though Hume didn't write it that way). More money chasing same goods = higher prices.
      *   *Natural Proportion:* It's the ratio of Money Stock to Real Output (Labour/Commodities).
      *   *Precision:* He isn't giving a formula, but he is saying prices scale with money stock *if* output doesn't change. He distinguishes between money growing because trade grew (good/natural) vs. banks creating credit artificially (bad).

  4.  **Address Question 2: Nature of Harm:**
      *   *Inflation vs. Competitiveness:* It's both, but the *harm* is specifically competitiveness. Inflation is the mechanism, but the pain is felt by the "merchant and manufacturer" because their goods become too expensive for foreign buyers. Hume is worried about the balance of trade. If prices go up, exports go down, gold flows out.
      *   *Key Phrase:* "heightening their price to the merchant and manufacturer." This implies the cost of production or the price they must charge becomes uncompetitive.

  5.  **Address Question 3: Modern Applicability (The Crux):**
      *   *Sister's View:* Modern banks create deposits (money) when they lend. This is standard Post-Keynesian/Money Multiplier-adjacent fact.
      *   *Hume's View:* Banks intermediate existing specie. If they issue notes beyond specie, that's "artificial credit."
      *   *Fiat/Central Bank:* Hume assumes a self-correcting specie flow. If prices rise, gold leaves, money supply shrinks, prices fall. Modern fiat doesn't have this automatic brake. Central Banks manage inflation targets.
      *   *Does the argument collapse?* Hume's warning against *unbacked* credit expansion causing inflation/loss of competitiveness still holds water (monetarist view). However, his solution (100% reserve bank) is generally rejected today because we want monetary elasticity to prevent deflationary spirals.
