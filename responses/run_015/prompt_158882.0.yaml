answer: |-
  Here is the breakdown of Hume's argument, how it fits your argument with your sister, and where the text gets slippery.

  ### 1. The Mechanism and the "Natural Proportion"
  Hume is describing an early version of the **Quantity Theory of Money**.

  *   **The Mechanism:** He believes the price of goods and labor is determined by the amount of money chasing them. If you have more money but the same amount of stuff (labor and commodities), prices go up.
  *   **The "Natural Proportion":** This is the ratio of the **Money Stock** to the **Volume of Goods/Trade**.
  *   **Is it just "prices scale with money"?** Yes, basically. Hume argues there is an equilibrium point. If the economy grows (more trade), you *need* more money to facilitate it, and prices can stay stable. But if you increase the money *without* an increase in trade (what he calls "artificially"), you break that proportion. The money becomes "watered down," and prices rise purely because there is more cash floating around, not because people are more productive.

  **Verdict:** He is saying prices scale with the money stock *relative to output*. If money grows faster than output, you get inflation.

  ### 2. The Harm: Inflation or Competitiveness?
  The harm Hume is pointing at is **loss of international competitiveness**, caused by inflation.

  *   **The Chain of Logic:** Artificial credit $\rightarrow$ More money in circulation $\rightarrow$ Higher domestic prices (inflation) $\rightarrow$ Domestic goods become too expensive for foreigners $\rightarrow$ Merchants and manufacturers lose sales to other countries.
  *   **Why "Merchant and Manufacturer"?** In Hume's time, Britain was a trading nation. If British prices rise because of too much bank credit, British wool and tools become too expensive for buyers in France or the colonies. The "inconvenience" of dear labor is unavoidable if you get rich naturally, but *artificial* credit makes your goods uncompetitive without making you actually more productive.
  *   **Price Level vs. Relative Price:** It starts as a general price level increase (inflation), but the *economic damage* is measured in relative prices (British goods vs. Foreign goods). He is worried about the balance of trade.

  **Verdict:** It is a claim about the price level causing a failure in relative prices. Inflation is the disease; losing export markets is the symptom that kills the economy.

  ### 3. Modern Applicability: Does the Argument Break?
  This is where your argument with your sister gets complicated. You are both partially right, but you are talking about different layers of the system.

  *   **Your Sister (The Mechanic):** She is right about **how** modern banking works. In a fiat, fractional-reserve system, banks *do* create money when they lend. They credit your account with new deposits that didn't exist before. Hume assumes banks are just moving existing metal coins around. On the *mechanics* of lending, Hume is outdated.
  *   **Hume (The Warning):** He is right about the **risk**. Even though the mechanics have changed, the consequence he warns about remains valid. If banks create too much credit (money) relative to the economy's ability to produce goods, you get inflation or asset bubbles.
  *   **The Central Bank Factor:** Hume assumes a "specie-flow mechanism." If prices rise, gold flows out, money supply shrinks, and prices correct automatically. Today, a Central Bank (like the Fed) manages this. They try to prevent the "artificial increase" Hume hates by raising interest rates if lending gets too hot.
  *   **Does the Conclusion Collapse?** It **survives but shifts**.
      *   *Hume's Conclusion:* Don't let banks create credit; it causes inflation and hurts trade.
      *   *Modern Conclusion:* Let banks create credit (we need it for growth), but use the Central Bank to throttle it so it doesn't cause inflation.
      *   *The "Who Spends First" Point:* You hit on something sharp here. Modern economists (like Cantillon) argue the harm isn't just "more money," it's *distribution*. The people who get the new loans first spend before prices rise; the people who get it last suffer higher prices. Hume hints at this, but his main focus is the national trade balance.

  **The "Lock Up All Money" Bank:**
  Is he endorsing a 100% reserve bank (a vault that never lends)?
  *   **Most likely:** He is using a **rhetorical extreme**. He is saying, "If the choice is between a bank that inflates the currency artificially and a bank that just stores cash safely, the safe storage bank is less dangerous."
  *   **However:** Some scholars argue he is seriously suggesting that fractional-reserve lending (creating credit beyond actual deposits) is inherently destabilizing. He isn't necessarily against *all* lending, but he is against lending that *augments the circulating coin* beyond what trade naturally requires.

  **Verdict:** His warning survives (excessive credit creation is dangerous), but his solution (stop banks from expanding credit) is rejected today in favor of managing that expansion.

  ***

  ### Where This Reading Might Break Down
  I need to be honest about the weak point in this analysis. The entire interpretation hinges on this sentence:

  > *"no bank could be more advantageous, than such a one as locked up all the money it received, and never augmented the circulating coin, as is usual, by returning part of its treasure into commerce."*

  **Why this sentence is the hinge:**
  1.  **If read literally:** Hume is advocating for **100% Reserve Banking**. He believes the act of banks lending out deposits (fractional reserve) is the "artificial increase" that ruins the nation. If this is his true view, then your sister's modern banking model is exactly what Hume thinks is disastrous.
  2.  **If read contextually:** Hume spends other parts of the essay praising the growth of trade and credit *when it follows real wealth*. In this specific paragraph, he is attacking *artificial* schemes (like the Mississippi Bubble or excessive paper money) that had recently crashed. He might mean "No bank could be more advantageous [than a safe vault] *if the alternative is a bank that prints fake money*."

  **What would make me switch interpretation:**
  If I found evidence in Hume's other essays (like *Of Interest* or *Of the Balance of Trade*) that he explicitly supports fractional-reserve lending for legitimate commerce. (Scholars are actually split on this). If he elsewhere says "banks are useful for mobilizing capital," then the "lock up" quote is a *reductio ad absurdum* against inflationary banks. If he consistently treats paper credit as suspect, he is a proto-Austrian economist advocating for hard money only.

  **Bottom line for your argument:**
  Tell your sister: "You're right that banks create money mechanically. But Hume's point is that if they create *too much* relative to real work, it causes inflation that hurts exporters. He thought the cure was to stop banks from lending; we think the cure is for the Fed to manage the interest rates. He got the risk right, but the mechanics and the solution are outdated."
