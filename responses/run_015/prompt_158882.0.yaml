      *   *Correction on Q3:* The user asks if the conclusion collapses. Hume's conclusion is "Artificial credit is bad." Modern view: "Credit creation is normal, but *excessive* credit is bad." So the conclusion survives but is moderated. The mechanism (loans create money) is different, but the risk (inflation) is the same.
      *   *The "Hinge" Sentence:* "no bank could be more advantageous, than such a one as locked up all the money it received." This is the sentence that determines if he's proposing a radical reform or making a rhetorical point.

  7.  **Final Polish:** Check against constraints. American English? Yes. Plain/Concrete? Yes. Identify weak points? Yes.

