answer: |-
  # Activity Design: The Federation Plan

  **Title:** The Central Plan Simulation
  **Time:** 120 minutes (including break)
  **Participants:** 20 (12 Co-op Managers, 3 Planning Group, 1 Facilitator, 4 Runners/Observers)
  **Materials:** Ordinary stationery (envelopes, index cards, pens, paper slips), whiteboard/markers, one laptop with projector (for Round 2).

  ## 1. Setup and Roles (15 Minutes)

  **The Narrative:**
  Tell the group: *"We are a federation of 12 co-ops making a single essential product: 'Units.' Some co-ops are Producers (they make Units), some are Consumers (they need Units to operate), and some are Mixed. We want to coordinate without a money market. A Planning Group will set a 'Transfer Value' (Price) for Units. You will report how many you can supply and how many you need at that Price. The Plan will adjust the Price until Supply equals Demand."*

  **Roles:**
  *   **Co-op Managers (12 people):** Sit in a circle or scattered tables. Each receives a **Co-op Packet** (Envelope).
  *   **Planning Group (3 people):** Sit at a central table with a whiteboard. They cannot talk to Managers directly, only via Runners.
  *   **Runners (4 people):** Collect report slips from Managers and deliver them to Planning; return new Prices to Managers.
  *   **Facilitator (You):** Timekeeper and rule arbiter.

  **The Co-op Packet:**
  Inside each envelope are:
  1.  **Capacity Card:** A number (e.g., "Max Supply: 10").
  2.  **Need Card:** A number (e.g., "Min Need: 4").
  3.  **Score Sheet:** To track "Autonomy Points."
  4.  **Reporting Slips:** Pre-printed forms with only three fields: *Current Price, Qty I Will Supply, Qty I Will Demand.* (No space for notes).

  **The Incentive Scheme (Autonomy Points):**
  Explain the scoring clearly. This is crucial for the Incentive Problem.
  *   **Safety Bonus:** If you receive the resources you requested, you get 5 Points.
  *   **Target Penalty:** The Planning Group sets a **Production Target** for you based on what you *reported* you could supply. If you report 10, your Target is 10. If you produce less than your Target, you lose 10 Points. If you produce more, you get no bonus.
  *   **Surplus Bank:** If you receive more resources than you use, you keep the surplus as 1 Point each.
  *   **Goal:** Maximize your Co-op's Autonomy Points.

  *Why this creates the Incentive Problem:*
  *   To avoid the Target Penalty, **understate** your capacity (Report 6 when you can do 10).
  *   To ensure Safety Bonus and build a Surplus Bank, **overstate** your need (Report 8 when you need 4).

  ## 2. Round 1: The Manual Iteration (30 Minutes)
  *Focus: The Incentive Problem & Calculation Friction.*

  **Rules:**
  1.  **No Shocks:** Capacity and Need Cards remain constant.
  2.  **Manual Pricing:** The Planning Group starts with Price = 1.
  3.  **Adjustment Rule:** The Planning Group sums all Reported Supply and Reported Demand.
      *   If Demand > Supply: Increase Price by 20%.
      *   If Supply > Demand: Decrease Price by 20%.
      *   If Balanced (within 5%): Stop.
  4.  **Process:**
      *   Planning posts Price.
      *   Managers fill slips (Supply/Demand) based on Price + Incentives.
      *   Runners collect/deliver (simulate communication lag: 2 minutes per trip).
      *   Planning calculates totals on paper calculators.
      *   Repeat for 4 cycles or until time runs out.

  **Expected Outcome:**
  The system will likely fail to converge. Managers will sandbag capacity (to lower targets) and inflate needs (for safety). The Planning Group will see "Excess Demand" persist forever, raising prices, but Managers won't respond honestly because the incentive structure punishes honesty. The calculation itself will feel slow and clunky.

  ## 3. Break (15 Minutes)
  *Allow frustration to settle. Do not discuss the theory yet.*

  ## 4. Round 2: The Mechanical Clearing (30 Minutes)
  *Focus: The Knowledge Problem (isolated from Calculation speed).*

  **Rule Changes:**
  1.  **Forced Honesty:** Announce: *"To test the math, auditors are present. You must report exactly what is on your Capacity and Need Cards. Lying results in immediate disqualification (0 Points)."* (This removes the Incentive Problem).
  2.  **Mechanical Pricing:** The Facilitator uses a laptop/spreadsheet projected on the wall. As soon as slips are in, the spreadsheet calculates the exact clearing price instantly. (This removes the Calculation Problem).
  3.  **Private Shocks:** **Crucial Change.** Halfway through the reporting phase (after Managers have sent their slips but *before* Production is validated), hand **Shock Cards** to 4 random Co-ops.
      *   *Examples:* "Machine Breakdown (Capacity -50%)", "Skilled Member Left (Quality Fail - cannot supply)", "Perishable Input Spoiled (Need +50%)".
      *   **Constraint:** Managers cannot tell the Planning Group about the Shock. The Reporting Slips are already in. The Price is already set by the spreadsheet based on the *old* data.

  **Process:**
  1.  Managers report honest numbers based on initial Cards.
  2.  Spreadsheet instantly announces the "Perfect Market Clearing Price."
  3.  **Shock Phase:** Distribute Shock Cards.
  4.  **Production Phase:** Managers reveal if they could actually meet the plan.
  5.  **Scoring:** Many will fail due to Shocks the Center didn't know about.

  **Expected Outcome:**
  The math works perfectly. The Price clears the *reported* market. But the *real* economy fails because the Center set the Price based on information that was true when reported but false when acted upon. The Center had no way to know about the breakdowns.

  ## 5. Debrief and Mapping (30 Minutes)

  **Step 1: The Experience (10 mins)**
  Ask open questions:
  *   "Round 1: How did it feel to fill out those slips? Did anyone feel tempted to write a number that wasn't their real capacity?"
  *   "Round 2: The price was calculated instantly. Why did we still have shortages or surpluses?"
  *   "Planning Group: In Round 2, you had the 'correct' price. Why didn't it work?"

  **Step 2: Mapping Moments to Claims (15 mins)**
  Now you can introduce the concepts. Draw two columns on the whiteboard: **Incentives** and **Knowledge**.

  | Moment in Game | Economic Claim | Theorist (Reveal Names Now) |
  | :--- | :--- | :--- |
  | **Round 1 Sandbagging:** Managers reporting low capacity to avoid targets. | **The Incentive Problem:** If rewards depend on reported data, agents will distort data to game the system. Truth-telling is not rational. | **Mises / Mechanism Design** |
  | **Round 1 Lag:** Planning Group taking 5 mins to calculate price adjustments. | **The Calculation Problem (Weak):** Solving equations takes time/resources. (Note: This is the part Lange thought computers would solve). | **Lange (The Counter-claim)** |
  | **Round 2 Shocks:** Machine breakdowns happening *after* reports were sent. | **The Knowledge Problem:** Relevant data is local, fleeting, and changes faster than it can be transmitted to a center. | **Hayek** |
  | **Round 2 Failure:** Perfect price, failed plan. | **Prices as Signals:** A price tells you *that* there is scarcity, but not *why*. The Center couldn't adjust for the specific shock. | **Hayek** |
  | **Narrow Slips:** No space to write "My machine is noisy." | **Tacit Knowledge:** You can't quantify everything (quality, morale, skill) into a single number. | **Polanyi / Hayek** |

  **Step 3: Conclusion (5 mins)**
  Summarize: "Round 2 showed us that even if we solve the math (Lange's hope), we still face the human truth (Incentives) and the reality of change (Knowledge). The market isn't just a calculator; it's a discovery procedure."

  ---

  ## Facilitator's Notes: Troubleshooting & Limitations

  **Predictable Issues & Fixes:**
  1.  **Managers ignore incentives:** In Round 1, some might report honestly out of altruism.
      *   *Fix:* During the game, whisper to laggards: *"Remember, if you report high capacity, your Target goes up. Protect your Co-op."*
  2.  **Planning Group dominates:** They might try to negotiate verbally.
      *   *Fix:* Enforce the "Narrow Channel" rule strictly. Only slips accepted.
  3.  **Math errors:** The Planning Group might sum numbers wrong in Round 1.
      *   *Fix:* Have a Runner double-check the sum. The *friction* of calculation is the point, but gross errors confuse the lesson.
  4.  **Round 2 feels "unfair":** Managers hit by Shocks might feel cheated.
      *   *Fix:* Frame it in the debrief: *"That frustration is exactly the point. In a real federation, this is what happens when a co-op has a crisis the center doesn't see."*

  **What the Game Cannot Stage (The "Must State" Note):**
  You must explicitly state this in the debrief, as the game cannot simulate it:
  *   **Dynamic Innovation:** The game assumes fixed goods (Units). In reality, co-ops invent new products or methods. A central plan struggles to price things that don't exist yet.
  *   **Consumer Sovereignty:** The game treats "Need" as fixed. In a real market, consumers change their minds based on price/quality. The Planning Group in the game is essentially guessing final demand.
  *   **The Political Cost:** The game abstracts away the power dynamics. In reality, a Planning Group that sets targets has immense power over Co-op survival, which creates political friction beyond simple "points."

  **Learning Outcome:**
  Participants should leave feeling that **convergence in a toy model does not equal viability in a social system.** They will have felt the temptation to lie (Incentive) and the frustration of being misunderstood by the Center (Knowledge). They will see that "Coordination without a Market" requires not just better math, but impossible levels of trust and omniscience.
