answer: |-
  Here is a breakdown of the desiderata for a theory of biological function, tailored to your goals in medicine and working biology. I have categorized them by whether they are generally considered non-negotiable for a robust theory or if they represent specific theoretical commitments.

  ### The Desiderata List

  **1. The Malfunction Constraint (Non-Negotiable)**
  *   **The Requirement:** The theory must distinguish between a trait failing to perform its function and a trait simply performing a different causal role. A heart that cannot pump is broken, not just "doing something else."
  *   **The Case:** This is the core of medical normativity. Without this, pathology collapses into mere variation. If function is just "what happens," then a diseased organ is just an organ doing something different, and you lose the ability to prescribe intervention.
  *   **Status:** Non-negotiable for your purposes. Any theory that cannot ground "brokenness" is useless for medicine.

  **2. The Ahistorical Constraint (Non-Negotiable for Synthetic Bio)**
  *   **The Requirement:** The theory must assign functions to traits in organisms that lack an evolutionary selection history (e.g., synthetic genomes, first-generation lab mutants, or potentially the first organism of a new species).
  *   **The Case:** Working biology increasingly involves design. If a lab-engineered bacterium has a pump designed to move toxins, calling that a "function" should not require waiting a million years for selection to act.
  *   **Status:** Non-negotiable given your interest in lab-designed genomes. This is the hardest hurdle for traditional evolutionary accounts.

  **3. The Exaptation Constraint (Non-Negotiable)**
  *   **The Requirement:** The theory must distinguish between what a trait was selected *for* originally and what it is useful *for* now (e.g., feathers for warmth vs. feathers for flight).
  *   **The Case:** Biology is full of repurposed machinery. A theory that conflates current utility with original history cannot explain how new functions emerge or how traits survive during the transition period before new selection pressures stabilize.
  *   **Status:** Non-negotiable. A theory that cannot handle exaptation is historically blind.

  **4. The Conservation Constraint (Preference of Etiological Camp)**
  *   **The Requirement:** The theory must allow a trait to retain its function even if it is currently useless, provided it was selected for that role recently enough (e.g., a vestigial organ).
  *   **The Case:** This handles vestigial parts. The appendix may do little, but we call it vestigial because it *had* a function.
  *   **Status:** Camp Preference. Causal-role theorists often deny vestigial parts have a function *now*, calling them "dysfunctional" or "functionless" immediately upon losing utility. Etiological theorists insist the history preserves the function label.

  **5. The Hierarchical Consistency Constraint (Non-Negotiable)**
  *   **The Requirement:** The theory must apply consistently across levels of organization (gene, cell, organ, organism) without generating contradictions (e.g., a gene's function shouldn't contradict the organ's function in a way that breaks the system).
  *   **The Case:** You noted the grain problem. In cancer, a cell's function (replicate) conflicts with the organism's function (survive). A theory needs to explain whose function counts or how they relate without saying one is "wrong."
  *   **Status:** Non-negotiable for a unified theory, though many accounts punt on this by restricting their scope to one level.

  **6. The Temporal Transparency Constraint (Your Proposal)**
  *   **The Requirement:** The theory must explicitly state the time-scale to which a function claim is indexed (evolutionary history, organismal lifetime, or instantaneous causal contribution).
  *   **The Case:** You suspected this is doing hidden work. You are correct. Debates often stall because one side is talking about why the trait *arrived* (deep time) and the other is talking about what the trait *does* (current time).
  *   **Status:** **Strong Desideratum.** It is not a bad idea; it is essential for clarity. Ambiguity here is the primary source of equivocation in the literature. A theory that hides its time-scale is defective because it invites category errors.

  ---

  ### Incompatible Desiderata

  The most significant tension lies between **The Malfunction Constraint** and **The Ahistorical Constraint**.

  To get normativity (malfunction), you usually need a standard of correctness. In biology, that standard is typically provided by history (selection established the norm). If you remove history to satisfy the Ahistorical Constraint (synthetic biology), you lose the independent standard that allows you to call a trait "broken." If a designer builds a pump and it doesn't pump, it's broken because of the *designer's intent*, not biology. If you want a purely biological account of function for a synthetic organism that grounds malfunction without appealing to human intent, you are trying to derive an "ought" from an "is" without the help of natural selection. This is the hardest logical knot in the field.

  ### The Killer Requirement

  The single requirement that knocks out the most accounts is **The Malfunction Constraint**.

  While the Ahistorical Constraint kills the pure Selected-Effect theories, the Malfunction Constraint kills the entire Causal-Role family and many systemic accounts. It is easy to describe what parts *do*; it is incredibly difficult to explain why a part *should* do something but *doesn't*. Any theory that defines function strictly as "current causal contribution" logically cannot account for dysfunction, because if the part isn't contributing, it simply lacks the function, rather than malfunctioning. This requirement forces a theory to be normative, which is philosophically expensive.

  ### Where the Major Families Fail

  **Selected-Effect (Etiological) Theories**
  They handle malfunction and vestigiality beautifully by anchoring function in evolutionary history, establishing a clear standard for what a trait is *supposed* to do. However, they collapse completely when faced with synthetic biology or novel traits, as they cannot assign function to items that lack a history of selection without resorting to fictionalized histories.

  **Causal-Role Theories**
  They excel at describing the actual contribution of traits in complex systems and handle novel or synthetic traits well by focusing on current capacity rather than past history. However, they fail to ground malfunction, as they reduce function to causal contribution, meaning a broken heart is not "broken" but simply lacks the function of pumping, rendering them inadequate for medical normativity.
