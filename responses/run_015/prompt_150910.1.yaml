answer: |-
  Your equilibrium hypothesis is robust against external policy transplantation but faces fatal challenges from evidence that modern state capacity and service quality can substitute for labor-market solidarity in sustaining tax compliance.

  **Fatal Defeaters**
  1.  **Decoupling of Density and Compliance:** The most damaging evidence is internal to the Nordic model itself; union density in Sweden and Denmark has fallen significantly (from ~80% to ~65% over two decades) without a corresponding collapse in tax morale or welfare sustainability. If the labor backbone were the load-bearing wall, gradual erosion should show immediate structural stress, yet tax compliance remains among the highest globally despite this weakening.
  2.  **State Capacity Substitution:** Empirical studies on tax morale consistently show that perceived quality of public services and horizontal equity (belief that others are paying) are stronger predictors of compliance than union membership. Modern digital governance (e.g., pre-filled tax returns, automated data matching) reduces the need for social enforcement mechanisms, meaning a high-trust equilibrium can be engineered through administrative capacity rather than corporatist bargaining.

  **Awkward Defeaters**
  1.  **Reverse Causality:** Historical analysis suggests high social trust and homogeneity preceded the establishment of centralized bargaining, implying unions are a symptom of the underlying culture required for high taxes, not the cause. This makes the "engine without fuel" analogy partially correct but misidentifies the fuel as labor institutions rather than pre-existing social capital.
  2.  **Non-Corporatist High-Trust Cases:** Countries like Switzerland and Canada maintain high tax compliance and significant welfare provisions with much lower union density and fragmented labor markets. While their total tax burden is lower than Sweden's, their ability to sustain redistribution without corporatism challenges the necessity of the specific Nordic labor backbone.

  **Defender Responses: Concede vs. Wave Away**
  Defenders of the equilibrium view would **concede** that if union density drops below a critical functional threshold (likely around 50%) or if the Ghent system (union-managed unemployment funds) is abolished, the model would fracture. They would **wave away** gradual density declines as having a "lag effect" on political coalitions, arguing that the *norms* established by decades of corporatism persist even as membership falls. They would also dismiss non-Nordic high-trust cases as outliers dependent on unique cultural homogeneity that cannot be replicated, thereby insulating the core thesis.

  **The Unfalsifiability Problem**
  This view risks unfalsifiability if proponents treat "lack of union density" as a universal excuse for any failed welfare expansion, effectively creating a "no true Scotsman" fallacy where success proves the theory and failure proves the conditions weren't met. This is a real scientific problem if the claim is presented as a universal law of political economy, but it is less problematic if framed as a historical sociology argument about path dependence. To remain falsifiable, the theory must specify a threshold of union density or bargaining centralization below which tax compliance *must* demonstrably drop, regardless of state capacity or cultural factors.
