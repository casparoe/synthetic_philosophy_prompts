      *   *Implicit Theory:* This is evaluative well-being, not hedonic (affective) well-being. It relies on cognitive judgment, not just felt experience. It assumes interpersonal comparability (my 7 is comparable to your 7). It assumes cardinality (moving from 5 to 6 is comparable to 6 to 7, or at least ordered). It assumes stability and rationality in the counterfactual imagination.
      *   *Policy Usage:* Using this for budget allocation implies utilitarianism (maximize the sum/average) or prioritarianism (help those lower on the ladder). It treats the score as a proxy for welfare that the state should maximize.
