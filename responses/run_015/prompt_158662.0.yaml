answer: |-
  Democratic backsliding is distinguishable from partisan disagreement only if coding relies on structural reversibility and symmetry tests rather than policy outcomes or stated intent.

  To operationalize this, your team will use a six-step decision tree. Each step requires a Yes/No answer based on available English-language documentation. If a coder cannot answer based on facts available within 15 minutes, the case moves to "Contested/Do-Not-Code" until senior review.

  **Step 1: The Rules vs. Outputs Filter**
  *Question:* Does this change alter the constitutional or statutory rules governing political competition, accountability, or rights adjudication (e.g., election law, judicial tenure, media licensing), rather than ordinary policy outputs within existing rules (e.g., tax rates, healthcare provision)?
  *   **No:** Stop. Verdict: **Not Backsliding**. (This addresses the rules/outputs line; policy preferences are not erosion).
  *   **Yes:** Proceed to Step 2.

  **Step 2: The Prior-State Requirement**
  *Question:* Did the pre-reform institutional arrangement meet minimum thresholds for liberal democracy (free elections, independent judiciary, civil liberties) within the last five years?
  *   **No:** Stop. Verdict: **Not Backsliding** (Code as Authoritarian Consolidation or Non-Consolidation). (This addresses the baseline problem; you cannot slide back from a state that was never democratic).
  *   **Yes:** Proceed to Step 3.

  **Step 3: The Symmetry Test**
  *Question:* If the ideological opposition enacted this exact institutional change tomorrow, would your team code it as a threat to institutional integrity based on existing precedents in your dataset?
  *   **No:** Stop. Verdict: **Not Backsliding**. (This addresses asymmetry; if you wouldn't worry about the other side doing it, your concern is likely policy preference).
  *   **Yes:** Proceed to Step 4.

  **Step 4: The Ratchet vs. Tilt Distinction**
  *Question:* Does the change make it significantly harder for a future losing party to reverse the change or regain power (e.g., extending terms beyond election cycles, shifting referee control to partisan actors, raising amendment thresholds)?
  *   **No:** Stop. Verdict: **Not Backsliding** (Code as Reversible Tilt). (This addresses the reversible/ratchet line; ordinary political wins are not erosion).
  *   **Yes:** Proceed to Step 5.

  **Step 5: The Salami-Slicing Aggregation**
  *Question:* Is this change part of a sequence of two or more similar institutional changes by the same actor within the last 24 months that cumulatively shift control of a specific lever (e.g., judiciary, media, elections)?
  *   **No:** Code as **Backsliding (Single Event)**.
  *   **Yes:** Code as **Backsliding (Systemic)**. (This addresses aggregation; pool changes by institutional lever over a 24-month window).

  **Step 6: The Mandate and Trade-Off Handoff**
  *Question:* Is the change justified by the actors as correcting a prior democratic deficit (e.g., unpacking a court) or fulfilling an electoral mandate that trades institutional constraints for majoritarian responsiveness?
  *   **No:** Finalize Step 4/5 verdict.
  *   **Yes:** **Handoff to Senior Editor**. (This addresses intent, trade-offs, and mandates; these are value judgments about whether the end justifies the institutional means).

  **Intent Handling:** Coders must ignore stated intent in Steps 1–5. Intent is inferred solely from structural effects (Step 4). If the structure locks in power, intent is irrelevant to the coding, though it triggers Step 6.

  ***

  **Application to Cases**

  **Case 1: Supermajority Court Rewrite**
  *   **Step 1:** Yes (Appointment rules/tenure are rules of the game).
  *   **Step 2:** Yes (Assume prior state was democratic enough to slide).
  *   **Step 3:** Yes (If opposition did this, it would be coded as a threat).
  *   **Step 4:** Yes (Extending terms past the next election creates a ratchet; opponents cannot reverse via election).
  *   **Step 5:** (Assume standalone for this exercise).
  *   **Step 6:** No (Usually justified as efficiency, not correcting deficit).
  *   **Verdict:** **Backsliding**.
  *   **Reasoning:** It fails the symmetry and ratchet tests. It locks in current power beyond the electoral cycle.

  **Case 2: Partisan Election Administration**
  *   **Step 1:** Yes (Election administration is a rule of competition).
  *   **Step 2:** Yes (Prior state had bipartisan commission).
  *   **Step 3:** Yes (If opposition moved control to their partisan, it would be flagged).
  *   **Step 4:** Yes (Shifts control of referees to partisan officeholder; hard to reverse without winning legislature).
  *   **Verdict:** **Backsliding**.
  *   **Reasoning:** Control of referees is a canonical indicator of erosion. Fraud prevention claims are ignored per Step 4 structural test.

  **Case 3: Reformist Court Expansion (9 to 15 Seats)**
  *   **Step 1:** Yes (Court composition is a rule of the game).
  *   **Step 2:** Yes (Assume prior state was democratic, albeit with a packed court).
  *   **Step 3:** Yes (If the opposition expanded the court to fill seats, your team would code it as packing).
  *   **Step 4:** Yes (Expanding from 9 to 15 allows a supermajority that persists beyond the current term; it is a ratchet).
  *   **Step 5:** (Depends on history, assume standalone).
  *   **Step 6:** **Yes** (Explicitly justified as correcting prior packing and fulfilling manifesto).
  *   **Verdict:** **Handoff to Senior Editor**.
  *   **Reasoning:** Structurally, this is court-packing (Backsliding). Normatively, it claims to be repair. The procedure identifies the structural risk but flags the normative conflict for human judgment.

  **On Your Instinct vs. The Procedure**
  The procedure flags Case 3 as potential backsliding (or at least high-risk contested), not repair. The defect is in your instinct, not the procedure. Your instinct conflates *majoritarian legitimacy* (we won, they blocked us) with *liberal institutional integrity* (courts must be independent of the current majority). Expanding a court to dilute prior packing is politically understandable, but structurally it replicates the disease it claims to cure by establishing a precedent that court size is variable based on who holds power. If your team codes this as "repair," you validate the tool your opponents will use against you later. The procedure correctly identifies that institutional independence is degraded even if the immediate outcome is popular.

  ***

  **Limitations and Conclusion**

  **Judgment Calls Dressed as Procedure:** Step 3 (Symmetry) relies on the coder's internal consistency, which varies by individual bias despite training. Step 6 (Mandate) admits that some questions are inherently normative; the procedure cannot resolve whether a specific trade-off between responsiveness and constraints is "worth it."

  **What the Procedure Cannot Do:** It cannot measure the *quality* of democracy, only the *direction* of institutional change. It cannot distinguish between a necessary emergency measure and a power grab if the structural effects are identical. It cannot solve the "essentially contested" nature of democracy itself; it only stabilizes the measurement of *change* relative to a baseline.

  **Does It Answer Your Friend?** Yes, but partially. It answers the charge that backsliding is merely a label for disliked reforms by demonstrating that reforms pass through a symmetry filter and a structural ratchet test before earning the label. If a reform passes the Symmetry Test (Step 3) and fails the Ratchet Test (Step 4), it is not backsliding by this definition. However, it does not answer the friend's claim that there is no canonical baseline (Step 2 merely sets a functional minimum); if your friend rejects liberal democratic minimums as a baseline, no procedure will convince them. The procedure protects you from partisan inconsistency, not from fundamental philosophical disagreement about what democracy is.
