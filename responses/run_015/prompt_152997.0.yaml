answer: |-
  Your unease is well-founded. You are detecting the friction points where **welfare economics** (the positive theory of how people behave) meets **political philosophy** (the normative theory of how the state should treat them). The procedure you describe is the standard apparatus of Regulatory Impact Analysis, but its theoretical underpinnings are often glossed over in operational manuals.

  Here is a reconstruction of the implicit theory, an analysis of its consistency, and an evaluation of the alternatives you raised.

  ### 1. The Implicit Theory: Ex-Ante Preference-Satisfaction Utilitarianism

  The procedure rests on a specific hybrid view: **Kaldor-Hicks Efficiency** constrained by a **Normative Equality** rule.

  *   **The Metric:** You are not putting a number on "life." You are putting a number on **risk reduction**. The theoretical object being valued is the *marginal rate of substitution* between income and mortality risk. In economic terms, $VSL = \frac{\partial Income}{\partial Risk}$.
  *   **The View of Utility:** Utility is defined as **preference satisfaction**. A policy is good if it satisfies the preferences people *actually hold*, not the preferences they *should hold*.
  *   **The Aggregation:** It is **Utilitarian**. You sum the individual willingness-to-pay (WTP) figures. If the total WTP for safety exceeds the cost, the project increases social welfare.
  *   **The Timeframe:** It is strictly **Ex-Ante**. You are valuing the *expectation* of safety held by the population before the accident occurs, not the *outcome* for the victim after the fact. This resolves your third tension: the "people who will never enjoy the benefit" is a category error in this theory. The benefit is the *reduction in anxiety/expected loss* accruing to the entire risk-exposed population, not the survival of the specific statistical victim.

  ### 2. Reconstructing the Three Tensions

  Here is how the implicit theory attempts to reconcile the features that strike you as contradictory.

  **Tension 1: Uniformity vs. Deference**
  *   **The Conflict:** If we defer to individual trade-offs, and individuals vary (by income, risk tolerance, occupation), why use one number?
  *   **The Reconciliation:** The theory distinguishes between the *source* of the value and the *application* of the value.
      *   *Source:* Revealed preference (wage-risk studies).
      *   *Application:* The State as a neutral agent.
      *   *Why Uniform?* If you varied VSL by income (since WTP correlates with income), you would value the safety of the rich more than the poor. If you varied it by risk tolerance, you would value the safety of the cautious more than the reckless. The Authority implicitly adopts a **Normative Equality Constraint**: *The state must regard every citizen's statistical life as equal, regardless of their ability to pay or their personal risk appetite.*
      *   *Verdict:* You are right that this is not pure deference. It is deference to the *average* trade-off, capped by a political norm of equality. The variation is discarded not because it doesn't exist, but because acknowledging it violates the principle of equal protection.

  **Tension 2: Revealed vs. Stated Preferences**
  *   **The Conflict:** Why trust wage premiums (inferred, noisy, market-constrained) over consultation answers (direct, specific, hypothetical)?
  *   **The Reconciliation:** This relies on the **Budget Constraint Epistemology**.
      *   Economic theory holds that a preference is only "real" if it is tested against scarcity. In a wage negotiation, the worker trades real money for real risk. In a consultation, the resident trades words for hypothetical safety.
      *   The theory assumes **Hypothetical Bias**: People overstate WTP when it costs them nothing.
      *   *Verdict:* This is internally consistent *if* you accept that markets reveal truth and surveys reveal fantasy. However, your skepticism is valid: labor markets are imperfect (workers lack perfect information, mobility is limited). The procedure treats the labor market as a "truth machine" and the consultation as a "wish list," which is a methodological hierarchy, not a logical necessity.

  **Tension 3: Aggregation and the Dead**
  *   **The Conflict:** Summing trade-offs across people, including those who die (or rather, whose risk is reduced but who are not individually identified).
  *   **The Reconciliation:** This is **Expected Utility Theory**.
      *   We do not value the life of the specific person who dies. We value the *probability shift* for the population.
      *   If 1 million people pay $5 each to reduce their risk by 1-in-1-million, we have collectively "bought" one statistical life. The theory does not need to identify *who* is saved. It only requires that the *group* valued the risk reduction enough to pay for it.
      *   *Verdict:* This is consistent within utilitarianism. It treats the population as a single risk-pool.

  ### 3. Internal Consistency: Market Behaviour vs. Stated WTP

  Is the procedure internally consistent? **Yes, but fragilely.**

  It relies on the axiom that **only constrained choices reveal true opportunity costs.**
  *   **Market Behaviour:** Viewed as constrained by reality (you either take the risky job or you don't).
  *   **Stated WTP:** Viewed as unconstrained (cheap talk).

  **Where it rules out rival views:**
  1.  **Paternalism:** It rules out the view that the state knows better than the citizen what is good for them (e.g., "They shouldn't accept that risky job").
  2.  **Objective Welfarism:** It rules out the view that there is a "good life" independent of what people choose (e.g., that safety is intrinsically valuable regardless of WTP).
  3.  **Rights-Based Deontology:** It rules out the view that safety is a right that cannot be traded off against cost. (If it were a right, you wouldn't rank projects by net benefit; you would fund all necessary safety until the budget broke).

  **The Weakness:** The consistency breaks if you acknowledge that labor markets are not perfectly competitive. If workers accept risk because they lack alternatives, not because they truly value the money, the "revealed preference" is distorted. The procedure assumes the market is free enough to count as "deference."

  ### 4. The Consultant's Proposal: Individualized Valuation

  The consultant proposes inferring individual VSL from behavior (smoking, seatbelts) and weighting protection accordingly.

  *   **Does it follow from the same view?**
      *   *Logically:* Yes. If WTP reveals value, and behavior reveals WTP, then high-risk behavior reveals a low valuation of safety. Strict preference-satisfaction utilitarianism would say: "Give less protection to those who demonstrate they care less about it."
      *   *Normatively:* No. It violates the **Equality Constraint** implicit in your current uniform VSL.
  *   **The Misunderstanding:** The consultant conflates **Time Preference** with **Value of Life**.
      *   Smoking or ignoring seatbelts often reveals a high *discount rate* (valuing present comfort over future safety) or a belief in personal invulnerability (optimism bias), not necessarily a low valuation of life itself.
      *   Furthermore, domain specificity applies: A person might undervalue health risk in smoking but highly value safety in transport. Inferring one from the other is econometrically hazardous.
  *   **The Consequence:** Adopting this would shift the Authority from a **Public Protector** (equal safety for all) to a **Market Mimic** (safety allocated to those who act like they want it most). It would likely direct resources away from young males (highest risk takers) toward risk-averse demographics, effectively penalizing the reckless with higher mortality.

  ### 5. The Alternative: "How Well Lives Actually Go"

  If you replaced the presupposed view (Preference-Satisfaction) with one where what matters is **Objective Well-Being** (e.g., Prioritarianism or Health Maximization), the procedure would change fundamentally.

  **The Theoretical Shift:**
  *   **From:** WTP / VSL (Value of Statistical Life).
  *   **To:** QALYs / DALYs (Quality-Adjusted Life Years / Disability-Adjusted Life Years).
  *   **Philosophy:** Instead of asking "What would you pay to avoid this risk?", you ask "How much healthy life time does this project preserve?"

  **What Would Change in Ranking:**
  1.  **Age Weighting:** VSL is generally uniform across ages (or slightly higher for working-age adults due to income). A QALY approach typically values saving a 20-year-old more than an 80-year-old because the 20-year-old has more *life years* to lose. Projects protecting schools would rank higher than those protecting retirement communities.
  2.  **Income Neutrality:** VSL correlates with income (richer people have higher WTP). QALYs are income-blind. Projects in poorer areas (often higher risk) would become relatively more attractive compared to projects in wealthy commuter corridors.
  3.  **Severity of Outcome:** VSL focuses on fatality. A well-being view might weight severe disability heavily. Projects preventing paralysis might rank higher than those preventing low-probability fatalities.

  **Would Rankings Differ Much in Practice?**
  *   **Significantly.**
  *   *Current (VSL):* Favors high-traffic roads (more exposure = more statistical lives saved), often in wealthier areas (higher traffic volume/commercial value).
  *   *Alternative (QALY):* Would favor projects saving younger populations and vulnerable road users (pedestrians/cyclists) where the loss of life-years is highest, regardless of traffic volume or income.
  *   *Budget Impact:* A QALY approach often justifies higher spending on pediatric safety and lower spending on infrastructure that primarily serves older, wealthier commuters.

  ### Summary of the Reconstruction

  | Feature | Current Procedure (VSL/CBA) | Consultant's Proposal | Alternative (Well-Being/QALY) |
  | :--- | :--- | :--- | :--- |
  | **Underlying Value** | Preference Satisfaction (WTP) | Preference Satisfaction (Behavioral) | Objective Health/Well-being |
  | **Unit of Account** | Currency ($) | Currency ($) weighted by risk | Life Years (QALYs) |
  | **Equality Norm** | **Equal VSL** (Political constraint) | **Unequal VSL** (Market mimicry) | **Equal Weight per Life Year** |
  | **Evidence** | Revealed (Wage-Risk) | Revealed (Lifestyle) | Clinical/Demographic |
  | **Consistency** | High (within Kaldor-Hicks) | High (within Libertarianism) | High (within Prioritarianism) |
  | **Main Flaw** | Ignores heterogeneity in WTP | Punishes risk-takers; domain error | Ignores individual autonomy |

  **Conclusion:**
  Your procedure is internally consistent *only if* you accept the **Normative Equality Constraint** as a political override on the **Positive Economic Data**. You are using economic data to measure efficiency, but political philosophy to distribute it.

  The consultant's proposal removes the political override, leaving pure market logic. This is coherent economically but likely incoherent with your statutory mandate as a *public* authority.

  The "how well lives go" alternative (QALYs) removes the market logic entirely. It is more equitable regarding age and income but less deferential to individual autonomy (it assumes a year of life is a year of life, regardless of what the person would have paid for it).

  **Recommendation:** The tension you feel is the friction between **Efficiency** (maximizing preference satisfaction) and **Equity** (treating citizens as equals). The uniform VSL is the compromise. The consultant wants to slide toward Efficiency; the "lives actually go" view slides toward Equity. Your current method is the stable center, provided you acknowledge that the uniformity is a moral choice, not an economic finding.
