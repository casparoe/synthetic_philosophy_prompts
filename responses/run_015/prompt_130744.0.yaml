      *Focus on the "Impersonal Value" error:* This is the big one. Scheffler argues that the *existence* of future people is a precondition for *our* present activities having value. He does *not* argue that future people have impersonal value. The student writes: "Scheffler seems to assume that future generations have an intrinsic, impersonal value." This is the opposite of Scheffler's agent-relative argument. This needs to be the main critique.

