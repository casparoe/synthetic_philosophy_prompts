      *   *Strengths:* Distinction between harm and meaning, Non-identity mention, Structure.
      *   *Weaknesses:*
          1.  **Impersonal Value:** Scheffler doesn't claim future people have impersonal value; he claims their existence is a precondition for *our* valuing.
          2.  **Preference-Satisfaction:** It's not about satisfying a preference; it's about the possibility of valuation itself.
