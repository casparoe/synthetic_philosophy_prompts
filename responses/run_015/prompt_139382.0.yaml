answer: |-
  Your argument is sophisticated and targets the core tensions in the literature, but it relies on two specific misconceptions about the mechanics of the views you are testing. Here is the breakdown regarding your three questions and the location of the error.

  (i) **Escaping the Dilemma:** There is a version of pragmatic encroachment that escapes your dilemma in step (2). Your argument assumes that knowledge is constituted by *warranted credence* crossing a *threshold*. You argue that since evidence determines warranted credence, and stakes cannot change evidence, stakes cannot change knowledge without becoming mere prudence. Pragmatic encroachers (specifically Interest-Relative Invariantists) reject the premise that knowledge is simply warranted credence plus a fixed threshold. Instead, they define knowledge as the *norm of practical reasoning*. On this view, practical stakes do not change the evidence or the credence; they change whether that credence is *sufficient to license action*. This is not "advice about caution dressed up as epistemology"; it is a claim that the concept of knowledge itself is partly practical. The epistemic position remains constant, but the status of "knowledge" changes because knowledge is defined by its functional role in action, not just by its probabilistic support.

  (ii) **Contextualism vs. Encroachment:** You are not right that they are the same view. The distinction lies in *whose* context sets the semantic standard for "knows."
  *   **Contextualism:** The *attributor's* (speaker's) context sets the standard. If I say, "Pell knows but Nura does not," I am using one standard for both subjects. Since Pell and Nura have the same evidence, a contextualist must say either both know or neither knows (relative to my current context). To say otherwise would be contradictory within a single conversational context.
  *   **Pragmatic Encroachment (Invariantism):** The *subject's* context sets the standard. The word "knows" has a fixed meaning, but its truth conditions depend on the subject's practical environment. Therefore, "Pell knows but Nura does not" is coherent and true in a single breath because the subjects differ in their practical situations, even if the speaker's context remains fixed.
  They are not notational variants because they predict different truth values for the same sentence in the same conversational context.

  (iii) **The Verdict on Sable:** On the standard pragmatic encroachment view (e.g., Stanley), the stakes that matter are typically the *objective* stakes or what the subject *reasonably believes* the stakes to be.
  *   If the view relies on **objective stakes**: Sable does not know. The fact that the shelter will lose its licence is a fact about her situation, regardless of her ignorance. Knowledge is severed from her *conscious* reasoning but remains the norm for what she *ought* to do.
  *   If the view relies on **reasonable belief about stakes**: Sable knows. Since she reasonably believes the stakes are low, the lower standard applies.
  Most defenders prefer the objective or "reasonable belief" account to avoid making knowledge too subjective. They accept that one can fail to know something because of a hidden fact (objective stakes), arguing that knowledge is a normative status that can outstrip the agent's awareness.

  **Where the argument goes wrong:**
  The primary error is in **Step 1**, where you equate the strength of an epistemic position solely with warranted credence. Encroachers deny this, positing that knowledge is a relation sensitive to practical facts, not just probabilistic ones. A secondary error is in **Step 3**, where you conflate the *source* of the semantic variation. Contextualism varies the standard by speaker; encroachment varies it by subject. This allows encroachers to affirm the conjunction "Pell knows and Nura does not" in a single context, which contextualists cannot do without shifting context.

  \answer{unsound: conflates subject and attributor contexts}
