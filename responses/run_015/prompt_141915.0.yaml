      *   **Task:** Create a written procedure (checklist/test sequence) for auditing each regularity.
      *   **Philosophical Constraint:** Must not presuppose one view of laws of nature. Must incorporate tests from both:
          *   *Humean/Best System Account (BSA):* Laws are patterns that optimize simplicity and strength in the total system.
          *   *Necessitarian/Modal Account:* Laws are features of the world that produce patterns, explain them, and support counterfactuals/interventions.
      *   **Specific Inclusions:**
          *   "Grue-style" worry (projectibility of predicates).
          *   Distinction between exceptionless pattern vs. coincidence of initial conditions.
          *   Handling disagreement between the two philosophical families of tests.
          *   Explicit routing of value judgments (risk tolerance) to sign-off.
      *   **Constraints:** Runnable in <1 hour, uses existing data, output is a one-page register entry.
      *   **Limitations:** Must state what the procedure *cannot* catch.
      *   **Application:** Run the procedure on three specific regularities:
          1.  Peak follows school reopening (18-22 days).
          2.  Transmission vs. indoor occupancy (power law).
          3.  Hospital admissions lag cases (6 days).
      *   **Specific Output Requirement:** Assume (3) gets the "least wanted" tag and write the register entry as it would appear.

  2.  **Develop the Procedure (The "Protocol"):**

      *   *Goal:* A practical checklist that embodies philosophical rigor without using jargon.
      *   *Structure:*
          1.  **Preparation:** Define the regularity clearly.
          2.  **Test A (Projectibility/Grue):** Are the terms stable? (Addresses the "grue" worry).
          3.  **Test B (Humean/BSA):** Systematic integration. Does this fit with other accepted laws? (Simplicity/Strength).
          4.  **Test C (Necessitarian/Modal):** Mechanism & Intervention. Is there a causal story? Does it hold under perturbation?
          5.  **Test D (Initial Conditions vs. Law):** Scope and Exceptions. Is it universal or local?
          6.  **Decision Matrix:** Combining results into tags.
          7.  **Conflict Resolution:** What if A/B say yes and C says no?
          8.  **Sign-off:** Where human judgment enters.

      *   *Drafting the Tests:*
          *   *Test 1 (Predicates):* Check if variables are defined by time or location (e.g., "pre-2025" or "Region X"). If so, fail.
          *   *Test 2 (BSA):* Check consistency with other model modules. Does adding this make the whole model simpler or more complex?
          *   *Test 3 (Modal):* Check for mechanism. Can we intervene? (Sensitivity analysis).
          *   *Test 4 (Scope):* Check for known exceptions. Are they explainable by boundary conditions or does the rule break?

      *   *Tags:* Exportable Law, Effective/Derived, Local Coincidence, Not Decidable.
      *   *Actions:* Extrapolate Freely, Extrapolate with Conditions, Refuse, Escalate.

  3.  **Address the Philosophical Tension:**

      *   *Humean Test:* Focus on *integration* and *compression*. Does this regularity help summarize *other* data without adding too much complexity?
      *   *Necessitarian Test:* Focus on *production* and *counterfactuals*. If we change $X$, does $Y$ change *because* of this rule, or just correlation?
      *   *Conflict:* If Humean says "Yes" (fits well) but Necessitarian says "No" (no mechanism), treat as "Effective Regularity" (use with caution/conditions). If Necessitarian says "Yes" but Humean says "No" (mechanism exists but fits poorly with other data), treat as "Exportable" but flag for model incoherence. *Correction:* Actually, if Necessitarian says Yes (strong mechanism) but Humean says No (doesn't fit system), it's likely a "Derived Regularity" (true locally but not fundamental). If Humean says Yes but Necessitarian says No, it's a "Local Coincidence" risk (spurious correlation that looks good).
      *   *Refinement on Conflict:* The prompt asks to state explicitly what to do. I will route conflicts to "Escalate/Sign-off" because that's a value judgment on risk.

  4.  **Drafting the Limitations:**

      *   What can't this catch?
          *   Black Swans (unknown unknowns).
          *   Phase shifts (non-linear tipping points not in data).
          *   Social/Behavioral adaptation (people change behavior *because* of the model/policy).
          *   Data quality issues (garbage in).

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1 (School Reopening):*
