          *   Verdict: This is the "Least Wanted" tag. Why? Because "Reported Cases" is not a natural kind; it's an administrative artifact. If testing strategy changes, the regularity breaks. This is a "Local Coincidence" or "Not Decidable" depending on policy stability. Let's make it "Local Coincidence" (holds only under specific testing regimes).

