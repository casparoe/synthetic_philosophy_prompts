answer: |-
  # Regularity Assurance Protocol (RAP-v1)

  **To:** Model Assurance Analysts
  **From:** Team Lead
  **Subject:** Mandatory Audit Procedure for Model Regularities
  **Time Limit:** 60 Minutes per Regularity
  **Output:** One-Page Register Entry

  ## 1. Purpose
  We use mathematical relationships (regularities) to predict the future. This procedure determines whether a regularity is robust enough to be used outside the specific data it was built on. You are not judging statistical fit (p-values, R²); you are judging **stability** and **projectibility**.

  ## 2. The Procedure
  Complete the following four tests in order. Use existing data and model documentation. If a test requires a value judgment (e.g., "acceptable risk"), do not decide it yourself; flag it for the Senior Modeller sign-off.

  ### Test 1: Predicate Stability (The "Grue" Check)
  **Question:** Are the variables in this regularity defined by *what they are* or by *when/where we measured them*?
  *   **Pass:** Variables refer to stable physical or biological properties (e.g., "viral load," "indoor volume," "age").
  *   **Fail:** Variables refer to specific times, locations, or administrative categories that could change without the physics changing (e.g., "Case Count" defined by a specific testing policy, "Region A," "Pre-Vaccine Era").
  *   **Action:** If **Fail**, tag as **Local Coincidence** immediately. Do not proceed.

  ### Test 2: Systematic Integration (The "Best System" Check)
  **Rationale:** *A regularity is more likely to hold if it simplifies the total description of the world rather than standing alone.*
  **Question:** Does accepting this regularity make the rest of the model simpler or more consistent, or does it require special exceptions elsewhere?
  *   **Procedure:** Check if this regularity conflicts with other accepted modules (e.g., does this transmission rate contradict the incubation period module?).
  *   **Pass:** Consistent with ≥90% of other model assumptions; reduces need for ad-hoc corrections elsewhere.
  *   **Fail:** Requires multiple "patch" parameters elsewhere to make the model work.
  *   **Action:** If **Fail**, downgrade final tag by one level (e.g., from *Exportable* to *Effective*).

  ### Test 3: Intervention Survival (The "Mechanism" Check)
  **Rationale:** *A regularity is a law only if it describes how the world works, not just what happened. It must survive hypothetical changes.*
  **Question:** If we intervene on the input variable in the model (change it by ±20%), does the output change in the predicted way, and is there a plausible causal story for why?
  *   **Procedure:** Run a sensitivity analysis. Is there a documented mechanism (biological/physical) linking Input to Output?
  *   **Pass:** Mechanism documented (e.g., aerosol physics) AND sensitivity analysis shows smooth, predicted response.
  *   **Fail:** Mechanism is unknown ("black box fit") OR sensitivity analysis shows threshold effects/breaks not explained by theory.
  *   **Action:** If **Fail**, tag as **Not Decidable** or **Local Coincidence**.

  ### Test 4: Exception Analysis (The "Initial Condition" Check)
  **Question:** Are known exceptions due to a breakdown of the rule, or due to boundary conditions (initial state)?
  *   **Pass:** Exceptions occur only when boundary conditions are violated (e.g., "holds unless ventilation exceeds X").
  *   **Fail:** Exceptions occur randomly or when the system appears normal (e.g., "holds in 14 regions, fails in 2 identical regions").
  *   **Action:** If **Fail**, tag as **Local Coincidence**.

  ## 3. Decision Matrix & Conflict Resolution
  Combine the results to assign a **Tag** and an **Action**.

  | Test 1 (Predicates) | Test 2 (System) | Test 3 (Mechanism) | Test 4 (Exceptions) | **Resulting Tag** | **Permitted Action** |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | Pass | Pass | Pass | Pass | **Exportable Law** | Extrapolate Freely |
  | Pass | Pass/Fail | Pass | Pass (w/ conditions) | **Effective Regularity** | Extrapolate under Stated Conditions |
  | Pass | Fail | Fail | Fail | **Local Coincidence** | **Refuse to Extrapolate** |
  | Fail | Any | Any | Any | **Local Coincidence** | **Refuse to Extrapolate** |
  | Any | Any | **Inconclusive** | Any | **Not Decidable** | **Escalate to Sign-off** |

  **Conflict Rule:** If Test 2 (System) and Test 3 (Mechanism) disagree (e.g., fits the system well but has no known mechanism):
  1.  Default to **Effective Regularity**.
  2.  **Escalate:** You must flag this for Senior Modeller sign-off. The risk tolerance for using a "black box" that fits well is a policy decision, not an analytical one.

  ## 4. Limitations Statement
  **This procedure cannot detect:**
  1.  **Phase Shifts:** Non-linear tipping points where the system behavior changes fundamentally (e.g., new variant changes biology, not just parameters).
  2.  **Reflexivity:** Changes in human behavior caused by the publication of the model itself.
  3.  **Data Artifacts:** Systemic biases in the input data that mimic a stable pattern (e.g., reporting delays that look like biological lags).
  4.  **Unknown Unknowns:** Variables not currently in the model that dominate future dynamics.

  ***

  # Application to Current Regularities

  Here is the application of the RAP-v1 protocol to the three regularities currently in the pipeline.

  ### Regularity 1: Epidemic Peak follows School Reopening (18–22 Days)
  *   **Test 1 (Predicates):** **Pass.** "School reopening" and "Epidemic Peak" are identifiable events. Time delay is a stable metric.
  *   **Test 2 (System):** **Pass.** Consistent with incubation periods and testing lag modules.
  *   **Test 3 (Mechanism):** **Pass/Condition.** Mechanism is biological (incubation) + behavioral (contact rates). Sensitivity holds, *but* depends on "Reopening" meaning "Full Capacity."
  *   **Test 4 (Exceptions):** **Pass.** Holds across 14 regions.
  *   **Verdict:** **Effective Regularity.**
  *   **Action:** Extrapolate only under stated conditions (must define "School Reopening" strictly).

  ### Regularity 2: Transmission vs. Indoor Occupancy (Power Law)
  *   **Test 1 (Predicates):** **Pass.** "Occupancy" and "Transmission" are physical/epidemiological quantities.
  *   **Test 2 (System):** **Pass.** Stable exponent across countries simplifies the international module.
  *   **Test 3 (Mechanism):** **Pass.** Plausible airborne dose mechanism. Sensitivity analysis confirms power law response.
  *   **Test 4 (Exceptions):** **Pass (w/ conditions).** Known exceptions (ventilation) are boundary conditions, not random failures.
  *   **Verdict:** **Exportable Law.**
  *   **Action:** Extrapolate Freely (with standard ventilation caveats).

  ### Regularity 3: Hospital Admissions Lag Reported Cases (6 Days)
  *   **Test 1 (Predicates):** **Fail.** "Reported Cases" is an administrative artifact dependent on testing policy, not a biological state. "Hospital Admissions" is stable, but the *relation* depends on the definition of the input.
  *   **Test 2 (System):** **Pass.** Fits the last 3 years of national data perfectly.
  *   **Test 3 (Mechanism):** **Fail.** The lag is a mix of biology (progression) and administration (testing speed/reporting). If testing policy changes (intervention), the lag changes, breaking the mechanism.
  *   **Test 4 (Exceptions):** **Fail.** Holds only while testing policy remains static.
  *   **Verdict:** **Local Coincidence.**
  *   **Action:** Refuse to Extrapolate.

  ***

  # Model Register Entry: Regularity 3

  **REGISTRY ID:** REG-2023-042
  **REGULARITY:** Hospital Admissions Lag Reported Cases (Fixed 6-Day Delay)
  **MODEL MODULE:** Flagship Forecaster (v4.1)
  **ANALYST:** J. Doe
  **DATE:** 24 Oct 2023

  | **AUDIT STEP** | **RESULT** | **EVIDENCE / NOTES** |
  | :--- | :--- | :--- |
  | **1. Predicate Stability** | **FAIL** | Input variable "Reported Cases" is defined by testing policy, not biology. Predicate is not projectible if policy changes. |
  | **2. Systematic Integration** | PASS | Fits historical national data (2020-2023) with high precision. |
  | **3. Intervention Survival** | **FAIL** | Sensitivity analysis shows lag collapses if testing turnaround time changes. No invariant causal mechanism. |
  | **4. Exception Analysis** | **FAIL** | Regularity holds only under "Initial Condition" of stable testing regime. Not exceptionless. |

  | **FINAL CLASSIFICATION** | **LOCAL COINCIDENCE** |
  | :--- | :--- |
  | **PERMITTED ACTION** | **REFUSE TO EXTRAPOLATE** |
  | **RISK JUDGMENT** | **N/A (Mandatory Refusal)** |

  **ANALYST COMMENT:**
  This regularity is a conflation of biological progression and administrative reporting speed. While statistically stable for three years, it fails Test 1 (Predicate Stability). "Reported Cases" is not a natural kind; it is a function of testing capacity and policy. If the government shifts from PCR to antigen testing, or changes eligibility criteria, the 6-day lag will shift immediately, but the model will not anticipate this. Treating this as a law creates a high risk of structural error during policy transitions.

  **RECOMMENDATION:**
  Replace "Reported Cases" with "Symptom Onset Date" or "Positive Test Date (adjusted for processing)" in the model structure. If data is unavailable, do not use this lag parameter for forecasting beyond the current testing regime.

  **SENIOR MODELLER SIGN-OFF:**
  [ ] Approved (Override Required)
  [ ] Rejected (Follow Analyst Recommendation)
  [ ] Escalated to Director

  **Signature:** ___________________ **Date:** ___________

  ***

  # What This Procedure Cannot Do

  As requested, here is the explicit statement on the limitations of this audit protocol. You must attach this to the final assurance report.

  1.  **It cannot predict Phase Shifts:** The tests rely on past data and current mechanisms. They cannot detect when a pathogen mutates to change its fundamental biology (e.g., changing from respiratory to blood-borne) or when societal behavior undergoes a non-linear shift (e.g., total lockdown vs. partial).
  2.  **It cannot detect Reflexivity:** The procedure assumes the model observes the world without changing it. It cannot account for the possibility that publishing the forecast changes human behavior, thereby invalidating the regularity (the "Lucas Critique" applied to epidemiology).
  3.  **It cannot fix Bad Data:** If the input data is systematically biased (e.g., under-reporting in specific demographics) but consistent, Test 1 and Test 2 may Pass. The procedure validates the *relationship*, not the *truth* of the variables.
  4.  **It cannot resolve Value Conflicts:** When the Decision Matrix routes to "Escalate," this procedure offers no mathematical way to decide the acceptable risk. It forces a human to take responsibility for the trade-off between accuracy and safety.
