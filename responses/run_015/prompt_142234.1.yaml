answer: |-
  Start your session by reconstructing the identity theory exactly as they learned it two weeks ago, stating clearly that it defines mental states by their physical constitution, such as pain being identical to C-fiber firing. You should present this not as a straw man but as the serious target functionalism aims to improve upon. Immediately follow this with the multiple realizability argument, but frame it carefully as a challenge to the identity theory specifically, not to materialism as a whole. This is the first crucial pivot point where you must intervene to stop the misconception that multiple realizability proves dualism. Tell them explicitly that multiple realizability shows the identity theory is too narrow, not that physicalism is false, because one can still be a materialist by believing mental states are physical tokens even if they are not uniform physical types. This distinction between type identity and token identity is where the first half of your group is getting lost, so pause here to ensure they see that functionalism is still a materialist theory, just a different flavor than the identity theory. Once they accept that the physical stuff can vary while the mental state remains the same, you introduce functionalism as the solution that defines mental states by their causal role rather than their physical occupant. This is where you introduce the role versus occupant distinction, explaining that the role is the job description and the occupant is the thing doing the job. Do not introduce this distinction before multiple realizability because they will not understand why we need to separate the job from the worker until they see that different workers can do the same job.

  For your carrying example, you should use a vending machine rather than a mousetrap, martians, or an octopus. The vending machine works best because it has clear internal states, such as being in a state of having received fifty cents, which connects inputs like coin insertion to outputs like dispensing a snack. A mousetrap is often too simple because it lacks complex internal states and looks more like a reflex arc, which might reinforce the idea that mental states are just stimulus-response pairs. You should avoid martians and octopuses because they smuggle in biological intuitions about pain and consciousness, which triggers the exact confusion your second half of the group is experiencing about computers feeling pain. You want an example where nobody intuitively thinks the object has feelings, so they can focus on the structural definition of the state without getting distracted by qualia. The example must have distinct physical realizations, such as a mechanical vending machine with gears versus an electronic one with circuits, to demonstrate multiple realizability clearly. It must lack any ambiguity about consciousness, so you can safely say the machine is in a state analogous to pain without implying it suffers. This allows you to say functionalism defines the state by what it does, not what it is made of, without forcing them to decide if a computer is conscious yet.

  As you move through the explanation, you need to head off specific misconceptions at precise moments rather than saving them for the end. When you first define multiple realizability, stop and correct the idea that it just means everyone's brain is wired differently. Clarify that it is about structural differences across kinds, such as silicon versus carbon, not individual variation within a species. When you transition to functionalism, address the misconception that functionalism claims the mind is software running on brain hardware. Explain that this is an analogy used to illustrate the role versus occupant distinction, not a literal claim that brains are computers, which prevents them from thinking functionalism commits them to strong artificial intelligence. You must also address the idea that multiple realizability is an empirical prediction neuroscience could have refuted. Explain that while it is supported by empirical evidence, it is primarily a conceptual argument about the logic of identification, meaning even if neuroscience found uniformity in humans, the possibility of realization in other substrates would still challenge the identity theory. Throughout this, you need to flag what is settled versus what is a live fight among specialists. It is settled that multiple realizability is the standard argument against type identity theory, but it is live debate whether this argument actually succeeds. Some contemporary physicalists argue that we can refine identity theory to accommodate multiple realizability by narrowing the mental types, so do not present the refutation of identity theory as a closed case. Similarly, it is settled that functionalism was developed to handle multiple realizability, but it is heavily contested whether functionalism can account for consciousness itself, which is where the computer pain confusion comes from.

  You should openly refuse to cover the Chinese Room argument and the Knowledge Argument, and you should tell them you are doing this. These topics introduce problems about consciousness and qualia that functionalism struggles with, but bringing them up now will confuse the specific issue of multiple realizability and the definition of mental states. Tell them these are objections to functionalism that belong in a later week, and that today is strictly about how functionalism defines mental states differently from the identity theory. If you do not draw this boundary, the students who think computers are in pain will latch onto the Chinese Room to argue against functionalism, and the students who think materialism is false will latch onto the Knowledge Argument to argue for dualism, derailing your specific goal of clarifying the role versus occupant distinction. By excluding these, you keep the focus on the metaphysical definition of mental states rather than the epistemology of consciousness.

  To finish the session, you need one question that tests whether they understand the structural difference between the theories rather than just memorizing definitions. Ask them to consider the concept of a heart and ask whether being a heart is defined by being made of muscle or by pumping blood, and then ask them to apply that distinction to pain under functionalism versus identity theory. This forces them to use the role versus occupant framework on a non-mental example first, which checks if they grasp the logical structure, and then apply it to the mind, which checks if they can transfer the concept. If they answer that functionalism defines pain like pumping blood, they understand the role concept. If they say functionalism defines pain like muscle tissue, they have not grasped the lesson. This question avoids asking them to solve the hard problem of consciousness and instead tests their understanding of the functionalist definition itself.

  Finally, keep reminding them throughout the hour that functionalism is a theory about how we define and individuate mental states, not necessarily a theory about what it feels like to have them. This is the key to resolving the confusion about computers being in pain. You can explain that a functionalist might say a computer is in a pain state because it realizes the functional role, but that this does not necessarily mean it feels pain in the way humans do, depending on whether one thinks functional role is sufficient for phenomenology. This nuance is where the specialist debate lies, so flag it as an open question in the field rather than a settled fact. By keeping the definition of the state separate from the experience of the state, you allow them to see how functionalism accommodates multiple realizability without forcing them to accept that your laptop is suffering. This approach respects the complexity of the field while giving them a clear framework to organize the concepts they learned in lecture.
