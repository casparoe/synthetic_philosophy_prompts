answer: |-
  The bottom line is that establishing a formal negative reference class of failed analogies does not resolve the ambiguity inherent in the reference class problem but merely relocates it to the boundary conditions that determine membership in either class, effectively doubling the degrees of freedom available to the forecaster rather than constraining them. You are proposing a mechanism that sounds like increased rigor but functions primarily as a justification engine, allowing you to select the historical trajectory that best matches your desired conclusion by arguing over whether current AI developments share more structural DNA with a breakthrough success or a hyped failure. The core difficulty has never been the lack of historical data points to choose from, but the absence of an objective metric for similarity, and adding a second bin of data points simply gives you more options to cherry-pick from when constructing your outside view.

  When you look closely at how these classes are constructed, you realize that the decision to place artificial intelligence into the category of realized technological revolutions versus the category of perpetually imminent breakthroughs is itself an inside view judgment disguised as an outside view statistic. If you define the negative class by the presence of hype cycles and expert prediction without realization, you could easily include technologies that failed for reasons entirely irrelevant to machine intelligence, such as specific regulatory bottlenecks or material science limits that do not apply to software. Conversely, if you define the positive class by rapid capability gain and economic integration, you might exclude early-stage developments that look slow initially but compound later. The forecaster is then left to argue why AI is structurally analogous to one group rather than the other, and since structural analogy is a matter of interpretation rather than measurement, this introduces a new layer of subjectivity that undermines the statistical discipline you are hoping to achieve.

  We have seen this dynamic play out repeatedly in discussions that rely on the same tired examples of powered flight, nuclear energy, and electronic computing, precisely because those cases are flexible enough to be spun in either direction depending on which features the analyst chooses to highlight. A skeptic can point to the decades of fusion research as a negative reference class for hard technical problems, while an optimist can point to the rapid scaling of semiconductor manufacturing as a positive reference class for exponential improvement, and both are technically using reference class forecasting while arriving at opposite conclusions. By formalizing a negative class of failed analogies, you are not removing the ability to make these selective comparisons; you are institutionalizing them. You now have two distinct distributions to sample from, and without a rigid, pre-commitment rule for class membership that is immune to motivated reasoning, you will inevitably categorize AI based on your prior belief about its timeline rather than letting the class dictate the probability.

  The deeper issue is that reference class forecasting treats historical outcomes as atomic events rather than the results of specific causal processes, which is particularly dangerous when dealing with technological development where the failure modes vary wildly. Some technologies fail because the physics does not work, others because the economics never pencil out, and others because the social license is revoked, and lumping these together into a single negative class obscures the mechanistic reasons why a project stalls. If your negative reference class includes flying cars due to regulatory and energy density issues, but you are forecasting software-based automation, the statistical weight of that failure is noise rather than signal. Unless you can decompose the failure modes and match them to the specific bottlenecks facing AI development, you are just counting vibes from history rather than updating on evidence, and the addition of a negative class simply provides a larger bucket of vibes to draw from.

  Ultimately, predictive discipline comes from causal modeling and explicit error tracking rather than expanding the taxonomy of historical analogies. If you want to improve your forecasting practice, you are better served by identifying the specific prerequisites for AI success and tracking their realization than by arguing over whether AI belongs in the bin of things that happened or the bin of things that did not. The reference class problem is not solved by adding more classes; it is solved by reducing the reliance on analogy altogether in favor of models that explain why the past happened the way it did. Until you have a theory of change that distinguishes between a failed analogy and a delayed success based on observable parameters rather than retrospective outcome, adding a negative reference class will only make your uncertainty look more calculated without actually reducing the risk of self-deception.
