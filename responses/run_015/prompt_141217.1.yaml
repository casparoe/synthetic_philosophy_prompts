      *   *Ambiguities:*
          *   What makes a claim "extraordinary"? (Low prior? High stakes? Violation of laws? Specificity?)
          *   What counts as "evidence"? (Testimony? Physical proof? Bayes Factor?)
          *   What is the consequence? (Reject belief? Reject action? Shift burden of proof?)
          *   What is the threshold? (Probability > 0.5? Probability > action threshold?)

  3.  **Drafting the Menu of Theses:**

      *   *Thesis 1: The Bayesian Truism.*
          *   Idea: Low prior requires high Likelihood Ratio (LR) to get high posterior.
          *   Status: Trivial/True (math).
          *   Problem: Doesn't justify *ignoring* the EV. Even with low posterior, if Stake is huge, EV is huge.
          *   Handling Variants: Applies to all, but doesn't dismiss the mugging decision-theoretically.

      *   *Thesis 2: The Pragmatic/Action Threshold.*
          *   Idea: We shouldn't *act* on claims unless posterior probability exceeds a certain fixed threshold (e.g., > 50% or > 90%), regardless of stakes.
          *   Status: Contentious (violates Expected Utility Theory).
          *   Problem: This is basically "Pascal's Mugging immunity" but ad hoc.
