answer: |-
  This is an exceptionally sharp dissection of a slogan that often functions as a conversation-stopper rather than an argument. You are correct that "Extraordinary claims require extraordinary evidence" (ECREE) is polysemous, and that most readings fail to bridge the gap between *epistemic skepticism* (low credence) and *decision-theoretic dismissal* (ignoring the expected value).

  Below is a disambiguated menu of six distinct theses that ECREE might be encoding. I have structured them to isolate the definitions of "extraordinary" and "evidence," the domain of application, and their performance against your specific test cases (Original, Humdrum, Scaling, Mundane Risk).

  ### The Menu of Theses

  #### 1. The Bayesian Truism
  *   **Statement:** For a hypothesis $H$ with a very low prior probability $P(H)$, a large Likelihood Ratio $P(E|H)/P(E|\neg H)$ is required to raise the posterior $P(H|E)$ to any fixed threshold (e.g., 0.5).
  *   **Label:** **Trivial** (Mathematical identity).
  *   **Definitions:** "Extraordinary claim" = Low prior probability. "Evidence" = Data with a high Likelihood Ratio.
  *   **Domain:** **Belief** (Epistemic).
  *   **Licenses Dismissal of Mugging?** **No.** It explains why credence remains low, but it does not justify ignoring the bet. If the stakes are $10^{30}$, a posterior of $10^{-15}$ still yields a massive Expected Value (EV).
  *   **Variants:**
      *   *Humdrum:* Applies equally (priors on tech claims might be higher, but logic holds).
      *   *Scaling:* The demo provides a high Likelihood Ratio, raising credence, but logic holds.
      *   *Mundane Risk:* Applies equally.
  *   **Verdict:** True but useless for your group member's purpose. It caps belief, not action.

  #### 2. The Fixed Credence Threshold (The "Proof Beyond Reasonable Doubt" Norm)
  *   **Statement:** An agent is rationally prohibited from acting on a hypothesis unless its posterior probability exceeds a fixed context-independent threshold $\tau$ (e.g., $\tau > 0.5$ or $\tau > 0.95$), regardless of the potential utility.
  *   **Label:** **Contentious** (Violates Expected Utility Theory).
  *   **Definitions:** "Extraordinary claim" = Any claim with $P(H|E) < \tau$. "Evidence" = Sufficient data to push $P(H|E) > \tau$.
  *   **Domain:** **Action** (Pragmatic/Decision-Theoretic).
  *   **Licenses Dismissal of Mugging?** **Yes.** It explicitly severs the link between high stakes and action when probability is low.
  *   **Variants:**
      *   *Humdrum:* Dismisses it (unless you are >95% sure the tech is telling the truth).
      *   *Scaling:* Might allow action if the demo pushes credence over $\tau$.
      *   *Mundane Risk:* **Dangerous.** If the risk of extinction is estimated at 10% (below $\tau$), this norm forbids spending resources to avert it, even if the stakes are infinite.
  *   **Verdict:** This likely does the work your member wants, but it is philosophically costly. It requires rejecting standard decision theory.

  #### 3. The Complexity Penalty (Solomonoff/Simplicity Prior)
  *   **Statement:** The prior probability of a claim decays exponentially with the Kolmogorov complexity (description length) of the claim. "Extraordinary" claims are those that are highly specific or complex.
  *   **Label:** **Substantive-but-Defensible** (Standard in algorithmic information theory).
  *   **Definitions:** "Extraordinary claim" = High bit-length description. "Evidence" = Data that compresses the explanation or verifies the specific details.
  *   **Domain:** **Belief** (Epistemic prior setting).
  *   **Licenses Dismissal of Mugging?** **Conditionally.** Only if the utility function does not grow faster than the complexity penalty. If utility scales as $3 \uparrow\uparrow\uparrow n$ and complexity scales as $n$, the mugging returns.
  *   **Variants:**
      *   *Humdrum:* **Fails to dismiss.** A data-center tech claiming $10^{30}$ sims is less complex than a magical mugger. The complexity penalty is lower, so the claim is *more* credible, making the EV problem worse.
      *   *Scaling:* The demo reduces the effective complexity of the hypothesis, raising the prior/posterior.
      *   *Mundane Risk:* **Fails to dismiss.** Aggregated ordinary mechanisms often have low description length (simple models), so this norm would *favor* taking mundane long-term risks seriously.
  *   **Verdict:** Robust epistemically, but fails to solve the mugging if utility is unbounded, and fails to dismiss the Humdrum/Mundane cases.

  #### 4. The Testimony Reliability Cap
  *   **Statement:** The probability of a claim being true given *only* human testimony is bounded above by the probability of human error, deception, or hallucination in that context.
  *   **Label:** **Substantive-but-Defensible** (Empirical heuristic).
  *   **Definitions:** "Extraordinary claim" = A claim that, if false, would be indistinguishable from a lie or delusion. "Evidence" = Non-testimonial verification.
  *   **Domain:** **Belief** (Epistemic, specifically regarding testimony).
  *   **Licenses Dismissal of Mugging?** **Yes (for the Original).** The probability the mugger is lying/joking > probability they are telling the truth.
  *   **Variants:**
      *   *Humdrum:* **Weak.** A tech worker pulling a plug is a mundane physical act. The probability of error is lower than for a magical mugger.
      *   *Scaling:* **Fails to dismiss.** The demo provides non-testimonial physical evidence, bypassing the cap.
      *   *Mundane Risk:* **Fails to dismiss.** Risk estimates based on modeling/data are not pure testimony.
  *   **Verdict:** Explains why we ignore the *stranger*, but not why we ignore the *structure* of the argument in other contexts.

  #### 5. The Leverage Penalty (Stakes-Indexed Prior)
  *   **Statement:** The prior probability that *you* are in a position to influence $N$ lives should decrease as a function of $N$. It is intrinsically improbable that a single agent has high leverage.
  *   **Label:** **Contentious** (Ad hoc, but popular in EA/FHI circles).
  *   **Definitions:** "Extraordinary claim" = A claim implicating the agent in high-stakes leverage. "Evidence" = Proof of causal pathway.
  *   **Domain:** **Belief** (Epistemic prior setting).
  *   **Licenses Dismissal of Mugging?** **Yes.** It forces the prior to shrink as fast as the stakes grow, neutralizing the EV.
  *   **Variants:**
      *   *Humdrum:* **Partial.** The tech has leverage; you (the donor) do not. If the mugger asks *you* for money to stop the tech, the leverage penalty applies to *your* causal influence.
      *   *Scaling:* If the demo proves the system exists, the leverage penalty might still apply to *your* ability to save it via $5.
      *   *Mundane Risk:* **Dangerous.** This is the "Pascal's Mugging of EA." If I donate to AI safety, I am claiming leverage over billions of future lives. A strict leverage penalty dismisses *all* long-termist interventions as "extraordinary claims."
  *   **Verdict:** This is the only reading that solves the Mugging while preserving Bayesianism, but it threatens to paralyze effective altruism.

  #### 6. The Norm of Assertion (Burden of Proof)
  *   **Statement:** The burden of proof lies on the asserter to provide evidence proportional to the claim's deviation from consensus before the listener is obligated to engage.
  *   **Label:** **Defensible** (Social/Conversational norm).
  *   **Definitions:** "Extraordinary claim" = Deviation from common knowledge. "Evidence" = Publicly verifiable justification.
  *   **Domain:** **Assertion** (Social/Discursive).
  *   **Licenses Dismissal of Mugging?** **Yes (Socially).** You are entitled to walk away from the conversation without engaging in the calculation.
  *   **Variants:**
      *   *Humdrum:* **Weak.** The claim is less deviant from consensus (tech exists).
      *   *Scaling:* **Fails.** The evidence is provided, shifting the burden.
      *   *Mundane Risk:* **Fails.** Academic risk estimates meet the burden of assertion in policy contexts.
  *   **Verdict:** Justifies ignoring the *mugger*, but not ignoring the *problem* in a reading group or policy shop.

  ---

  ### Analysis of Collapses and Overlaps

  *   **T1 (Bayesian) + T4 (Testimony) $\rightarrow$ T2 (Fixed Threshold):** Often, people conflate the mathematical fact that testimony yields low posteriors (T1+T4) with the normative claim that one should not act on low posteriors (T2). This is the most common confusion.
  *   **T3 (Complexity) + T5 (Leverage):** These are often run together as "Occam's Razor." However, T3 penalizes *description length*, while T5 penalizes *causal influence*. A claim can be simple to describe ("I can save the world") but carry a heavy leverage penalty. T5 is required to kill the mugging if the mugger's story is simple.
  *   **The "Real Work" Doer:** The only reading that actually licenses setting the mugging aside *decision-theoretically* without violating Bayesian math is **T5 (Leverage Penalty)** or **T2 (Fixed Credence Threshold)**. T1, T3, T4, and T6 explain why you shouldn't *believe* the mugger, but as you noted, EV maximization does not require belief > 0.5.

  ### Diagnosis of Your Group Member

  Your group member was most plausibly reaching for a conflation of **T4 (Testimony Reliability)** and **T2 (Fixed Credence Threshold)**, likely motivated by an intuitive sense of **T5 (Leverage Penalty)**.

  *   **Why they said it:** They felt the *social* impropriety of the claim (T6) and the *empirical* unreliability of such stories (T4), and assumed this automatically solved the *decision* problem (T2).
  *   **Does it survive scrutiny?** **No.**
      1.  **Against the Humdrum Variant:** T4 collapses. A data-center tech is not a magical mugger. If the group member dismisses the Humdrum case using ECREE, they must be relying on T5 (Leverage) or T2 (Threshold).
      2.  **Against the Scaling Variant:** T4 collapses. Physical evidence bypasses testimony reliability. If they still dismiss it, they are committed to T2 (Threshold) or T5 (Leverage).
      3.  **Against the Mundane Risk:** This is the fatal blow. If they use ECREE to dismiss the aggregated risk estimate, they are explicitly applying **T5 (Leverage Penalty)** or **T2 (Threshold)** to ordinary policy analysis.
          *   If **T2**: They are arguing that we should ignore existential risks unless we are >95% sure they are real. This is incompatible with risk management and EA philosophy.
          *   If **T5**: They are arguing that *any* claim of high-impact intervention (like AI safety) is "extraordinary" simply because the stakes are high. This undermines the foundation of the policy shop your colleagues work for.

  ### Recommendation for the Group

  Bring the **Humdrum** and **Mundane Risk** variants back to the table. Ask your colleague:

  1.  "In the **Humdrum case**, there is no magic, only a tech worker. Does ECREE still apply? If so, is 'extraordinary' about *weirdness* or *stakes*?"
  2.  "In the **Mundane Risk case**, there is no single extraordinary claim, only a model. If ECREE dismisses this, are we committing to a **Fixed Credence Threshold (T2)** that forbids acting on existential risk unless it is probable (>50%)? Or are we committing to a **Leverage Penalty (T5)** that implies we cannot meaningfully affect the long-term future?"

  If they accept T2, they have abandoned Expected Utility Theory. If they accept T5, they have abandoned the premise that policy interventions can be high-impact. If they retreat to T1 or T4, they must admit that ECREE caps *belief* but does not justify ignoring the *bet*.

  The slogan, in short, is an epistemic shield being wielded as a decision-theoretic sword. It does not cut.
