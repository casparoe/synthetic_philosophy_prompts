      *   **Problem:** One member dismissed the mugging using the slogan "Extraordinary claims require extraordinary evidence" (ECREE). The user thinks this slogan is ambiguous and might not actually justify *ignoring* the claim for decision-theoretic purposes (since EV can be high even with tiny credence).
      *   **Task:** Provide a disambiguated "numbered menu" of distinct precise theses that ECREE could express.
      *   **Requirements for each thesis:**
