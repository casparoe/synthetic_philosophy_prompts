      *Refining the "Mundane Risk" test:* The user says the slogan was used to dismiss a long-term risk estimate involving *aggregation of ordinary mechanisms*. This suggests the "Extraordinary" label was applied to the *magnitude of the outcome* (e.g., extinction), not the mechanism. This points strongly toward a Stakes-indexed prior (Leverage Penalty) or a Fixed Credence Threshold. I need to highlight this.

      *Final Polish:* Ensure the distinction between *epistemic* dismissal (don't believe) and *pragmatic* dismissal (don't act) is central, as the user flagged this ("paying five dollars does not require believing").

