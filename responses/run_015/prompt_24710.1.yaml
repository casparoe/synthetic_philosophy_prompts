      *   **Acknowledge validity:** Start by validating the intuition. It's a very common and sensible starting point. The "Credal Set" in IP *can* be viewed as a set of Bayesian priors.
      *   **The Pivot:** However, the *inference rules* and *decision rules* differ fundamentally.
      *   **The "Non-Verbal" Test (Decision Theory):**
          *   Setup: A gamble $G$ that pays \$1 if $E$, \$0 otherwise. Cost to buy: $c$.
          *   HBM: Calculates precise expected value $EV$. If $EV > c$, buy.
          *   IP: Calculates Lower Expectation ($\underline{E}$) and Upper Expectation ($\overline{E}$).
          *   Divergence: If $\underline{E} < c < \overline{E}$, the IP agent *abstains*. The HBM agent *must* choose (based on their specific $\pi$).
