          *   Actually, a better example for the "range vs. distribution" claim is **Updating**.
          *   *Scenario:* Prior range $[0.4, 0.7]$.
          *   HBM: Needs a shape (e.g., Uniform on $[0.4, 0.7]$). Mean = 0.55.
          *   IP: No shape. Lower Prob = 0.4, Upper Prob = 0.7.
          *   *Evidence:* Observe 100 Heads.
          *   HBM: Posterior concentrates near 1.0 (depending on prior strength).
          *   IP (e.g., Imprecise Dirichlet): Posterior interval might be $[0.9, 1.0]$ or similar, but the *rate* of contraction depends on a "strength" parameter $s$ that represents prior caution, not just a shape.
          *   *Wait, keep it simpler.* Focus on the **Sure Thing Principle**.
          *   HBM satisfies it. IP (with E-admissibility) can violate it.
          *   *Better:* Focus on **Robustness**.
          *   If I change the HBM prior slightly (within the range), the decision might flip. IP acknowledges this instability by giving an interval that covers both decisions.

      *   **Refining the "Non-Verbal" Request:** The user wants an event/claim/evidence where they give different answers.
      *   *Claim:* "Is the expected value of gamble $G$ greater than $X$?"
      *   HBM: Yes/No (Probability 1 or 0, effectively).
      *   IP: "Indeterminate."
      *   *Claim:* "Should I accept bet $B$?"
      *   HBM: Yes.
      *   IP: No definite recommendation.

      *   **Structuring the Argument:**
          1.  **Concession:** You are right that a Credal Set *is* a set of Bayesian priors. (Walley's representation theorem).
          2.  **The Catch:** The *aggregation* rule is different. HBM integrates (averages). IP takes Inf/Sup (bounds).
          3.  **Example 1: Decision Making (The Gap).** Show a case where HBM forces a choice, IP allows suspension.
          4.  **Example 2: Learning (Dilation/Contraction).** Show how they handle new data differently regarding precision.
          5.  **Philosophical Core:** HBM models *risk* (known unknowns). IP models *ambiguity* (unknown unknowns / model uncertainty).

  5.  **Self-Correction/Refinement during drafting:**
      *   *Correction:* I need to be careful not to say HBM *can't* represent ambiguity. It can, via the hyperprior. But it requires *committing* to a specific hyperprior. IP refuses that commitment.
      *   *User's specific claim:* "IP is... the case in which she retains only the range... and discards the rest."
      *   *Rebuttal:* If you discard the rest (the density), you lose the ability to calculate a single expectation. HBM *requires* the density to function. If you run HBM without the density, it's not HBM anymore, it's IP. So they are distinct *procedures*, even if the input objects look related.
      *   *The "Different Answers" constraint:* I need a specific numerical example.
      *   *Scenario:* Coin with unknown bias $p$.
      *   *State:* Prior knowledge suggests $p \in [0.4, 0.6]$.
      *   *HBM:* Choose $\pi(p) = \text{Uniform}(0.4, 0.6)$. $E[p] = 0.5$.
