prompt: |-
  I convene a fortnightly graduate reading group on decision theory and rational agency — fourteen participants, mostly philosophy and theory-CS doctoral students with two economists, all of whom know the prisoner's dilemma and can state what a Nash equilibrium is. I have one ninety-minute session, no budget, no screens beyond the room's projector, and no appetite for a lecture.

  What I want them to run into, rather than be told, is the move from choosing an action to submitting something that chooses on your behalf, and the way that dissolves the dominance argument for defection in a one-shot dilemma — and then, before they can settle into satisfied mutual cooperation, the discovery that what they achieved rested on something much thinner than mutual recognition.

  My provisional design is three short rounds plus an optional fourth, with sealed submissions and random re-pairing each round: an anonymous baseline dilemma; then a round in which each person submits a program written in a tiny pseudo-code that may inspect the other's source at a small cost in points; then a round in which a meaning-preserving rewriter (renaming local variables, reordering independent clauses, reformatting) is applied, privately and at random, to one side of each pairing before its source is inspected — so that the obvious "cooperate if and only if the other source is character-for-character the same as mine" quietly stops working. The optional fourth round replaces inspection with a sandbox: you may run the opponent's program against a probe program of your own choosing and observe only its output.

  What I need from you:

  1. The pseudo-code itself: the smallest set of primitives — including some way for a program to refer to its own source and to the opponent's, and a conditional on their syntactic or behavioural relation — with the hard constraint that I can adjudicate any pair by hand, on paper, in under a minute. Include a worked adjudication of a pair in which both sides inspect, and a rule for malformed or non-halting submissions.
  2. A payoff scheme, with the inspection cost calibrated so that neither blind cooperation nor free verification is trivially right, and a trivial stake — chocolate, not money.
  3. The exact handout text and submission protocol, including how to stop out-of-band coordination and pre-agreed conventions, which would make the whole thing collapse into a handshake.
  4. A debrief that maps specific moments onto specific claims: the invention of the identity check; the appearance of the bully program that cooperates only with its mirror image alongside the program that cooperates unconditionally, and the realisation that the equilibrium set contains the bad as well as the good; the recompiler round; and, if we get there, the point at which a program that cooperates with any probe becomes indistinguishable, from the outside, from one that cooperates only with cooperators.
  5. An honest note on what the activity cannot reproduce: the self-reference is stipulated rather than derived, the existence of a fixed point is assumed rather than proved, and the set-up is not the same thing as acausal or superrational reasoning. Tell me which of these the facilitator must simply supply in words, and how to do that without it landing as a lecture.
  6. What will predictably go wrong: formatting mismatches, someone taking exploitation personally, the recompiler round reading as a rigged gotcha, and the clock.

  Finally, be explicit about where you are least confident that this design lands the point it is meant to land, which contested reading of the program-game result the design takes sides on, and what I should watch for during the session that would tell me to drop or swap a round. Participants should not hear the theoretical label until the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested design:

  1.  **Analyze the Request:**
      *   **Context:** Fortnightly graduate reading group (Decision Theory/Rational Agency). 14 participants (Philosophy, Theory-CS, 2 Economists). Knowledge level: High (know PD, Nash).
      *   **Constraints:** 90 minutes, no budget, projector only, no lecture.
      *   **Goal:** Experiential discovery of "submitting a chooser" (program equilibrium), dissolution of dominance via source inspection, fragility of that solution (extensional vs. intensional equality), and the limits of behavioral testing (sandboxing).
      *   **Structure:** 3 mandatory rounds + 1 optional.
          *   Round 1: Baseline PD (sealed).
          *   Round 2: Program Equilibrium (source inspection allowed, cost involved).
          *   Round 3: Obfuscation/Recompilation (syntactic equality breaks).
          *   Round 4 (Optional): Sandbox/Behavioral testing.
      *   **Deliverables:**
          1.  Pseudo-code (hand-adiudicable, self/opp reference, <1 min/pair).
          2.  Payoff scheme (chocolate, inspection cost).
          3.  Handout/Protocol (prevent collusion).
          4.  Debrief (map moments to claims).
          5.  Limitations (what the activity *can't* show).
          6.  Failure modes (what goes wrong).
          7.  Confidence/Contested readings.

  2.  **Deconstruct the Core Mechanic (Program Equilibrium):**
      *   *Challenge:* Real Turing machines are undecidable. Halting problems make hand-adjudication impossible.
      *   *Solution:* Restricted language. No loops, no recursion (except a specific `MY_SOURCE` token), limited depth.
      *   *Self-Reference:* Needs to be stipulated. A token `SOURCE` that evaluates to the string of the program.
      *   *Inspection:* Needs to be cheap enough to use but costly enough to matter.
      *   *Obfuscation:* Needs to break string equality without changing behavior.

  3.  **Drafting the Pseudo-code (Deliverable 1):**
      *   Need variables: `OPP_SOURCE` (string), `MY_SOURCE` (string).
      *   Need operations: String equality (`==`), Substring check (maybe too complex?), Logical operators (`AND`, `OR`, `NOT`).
      *   Need output: `COOPERATE` (C) or `DEFECT` (D).
      *   *Constraint:* Hand adjudication in <1 min.
      *   *Design:* Line-based script.
          *   Line 1: `READ OPP` (Implicitly done by facilitator).
          *   Logic: `IF [condition] THEN C ELSE D`.
          *   Condition: `OPP_SOURCE == MY_SOURCE` or `TRUE` or `FALSE`.
          *   To make it interesting: Allow a "cost" declaration.
      *   *Refinement:* Let's simplify. The "program" is just a decision rule based on source comparison.
      *   *Syntax:*
          ```
          COST: [0 or 1]
          STRATEGY:
            IF OPP_SOURCE == MY_SOURCE THEN C
            ELSE IF OPP_SOURCE == "ALWAYS_C" THEN C
            ELSE D
          ```
          *Wait, this is too rigid.* Participants need to write *their* logic.
          *Better:* A tiny functional language.
          `return (condition) ? C : D`
          Condition can use `self` and `other` (strings).
          *Adjudication:* The facilitator holds the strings. Comparing strings is fast.
          *Halting:* No loops allowed. Just boolean logic on strings.
          *Self-Reference:* The string `self` is literally the text submitted.
          *Constraint:* Max 5 lines of logic.

  4.  **Drafting the Payoff Scheme (Deliverable 2):**
      *   Standard PD: T > R > P > S. (5, 3, 1, 0).
      *   Inspection Cost: Needs to make blind cooperation risky but blind defection safe.
      *   If I inspect (cost 1) and find a defector, I defect (get 1 - 1 = 0). If I don't inspect and they defect, I get 0.
      *   If I inspect and find cooperator, I cooperate (get 3 - 1 = 2). If I don't inspect and cooperate, I get 3.
      *   *Problem:* If inspection costs points, `Tit-for-Tat` via source code becomes strictly dominated by `Cooperate` if you trust the pool, or `Defect` if you don't.
      *   *Adjustment:* The cost is only paid if you *access* the source.
      *   *Payoff Matrix (Net):*
          *   CC: 3 (no inspect), 2 (inspect)
          *   CD: 0 (no inspect), 0 (inspect, then D) -> Wait, if I inspect and see D, I D. Payoff P=1. Net 0.
          *   DC: 5 (no inspect), 4 (inspect, then C - irrational)
          *   DD: 1 (no inspect), 0 (inspect)
      *   *Calibration:* Cost = 1 point.
          *   Inspect + Match (C) = 3 - 1 = 2.
          *   Inspect + Mismatch (D) = 1 - 1 = 0.
          *   No Inspect + C = 3.
          *   No Inspect + D = 0.
          *   Blind C vs Blind C = 3.
          *   Blind C vs Inspect-C = 2 (for inspector), 3 (for blind).
          *   *Risk:* If I inspect, I cap my max gain at 2. If I don't, I risk 0.
          *   *Incentive:* Inspection is insurance. It guarantees $\ge 0$. Blind C risks 0. Blind D guarantees 1.
          *   *Wait, Blind D guarantees 1.* Inspection guarantees 0. So Inspection is dominated by Blind D unless there's a chance of getting 2 vs 1.
          *   *Correction:* In Program Equilibrium (Prouty/Barasz/etc.), the point is that `If Other == Me then C else D` creates a Nash Equilibrium of Cooperation.
          *   *Payoff:* T=5, R=3, P=1, S=0. Cost=1.
          *   Strategy `FairBot`: If `other == self` C else D.
          *   Pair `FairBot` vs `FairBot`: Match -> CC. Payoff 3-1 = 2 each.
          *   Pair `FairBot` vs `DefectBot`: Mismatch -> DD. Payoff 1-1 = 0 each.
          *   Pair `BlindC` vs `FairBot`: `FairBot` sees mismatch -> D. `BlindC` -> C. Payoff: `FairBot` 5-1=4, `BlindC` 0.
          *   *Issue:* `FairBot` exploits `BlindC`. This is good (shows robustness).
          *   *Issue:* `BlindD` vs `FairBot`: `FairBot` sees mismatch -> D. `BlindD` -> D. Payoff: `FairBot` 1-1=0, `BlindD` 1. `BlindD` beats `FairBot`.
          *   *Conclusion:* `FairBot` is not a dominant strategy, but it forms a *Nash Equilibrium* with itself. `BlindD` is the dominant strategy in the causal sense, but `FairBot` creates a correlation.
          *   *Stakes:* Chocolate pieces. 1 point = 1 small square.

  5.  **Drafting the Protocol (Deliverable 3):**
      *   Prevent collusion: Random pairing, sealed envelopes/digital forms.
      *   Since no budget/tech beyond projector: Paper slips.
      *   Anonymity: Use ID numbers assigned at door.
      *   Submission: Write code on slip. Fold.
      *   Facilitator Role: The "Compiler". Collects, pairs, reads, calculates.
      *   *Crucial:* The "Recompiler" (Round 3) needs to be done by the facilitator secretly.

  6.  **Drafting the Debrief (Deliverable 4):**
      *   Map the rounds to concepts.
      *   Round 1: Causal Dominance (D is best).
      *   Round 2: Program Equilibrium (Logical Correlation). The "Mirror" strategy.
      *   Round 3: Intensional vs. Extensional. Syntax vs. Semantics.
      *   Round 4: Black Box / Halting Problem limits.

  7.  **Addressing Limitations (Deliverable 5):**
      *   Fixed points are assumed (you can't actually write `self == other` without quining, but we stipulate `MY_SOURCE` token).
      *   It's not truly acausal; it's causal inspection of a causal object.
      *   Facilitator must explain the "Stipulation" without lecturing. "We granted you a magic mirror."

  8.  **Predicting Failure Modes (Deliverable 6):**
      *   Time: Adjudicating 7 pairs by hand takes time. 14 people = 7 pairs. 1 min/pair = 7 mins + overhead. Doable.
      *   Syntax wars: "Does whitespace count?" (Yes, for Round 2. No, for Round 3).
      *   Hurt feelings: "They exploited me." (Reframe as rational agency).
      *   Round 3 confusion: "Why did my code stop working?" (The point).

  9.  **Refining the Pseudo-code for Hand Adjudication:**
      *   To ensure <1 min adjudication, the logic must be trivial.
      *   Allowed tokens: `MY_CODE` (string), `OPP_CODE` (string), `TRUE`, `FALSE`.
      *   Allowed operators: `==`, `!=`, `AND`, `OR`.
      *   Format: `IF [condition] THEN C ELSE D`.
      *   Cost declaration: `COST: 0` or `COST: 1`.
      *   *Wait, one constraint:* If they write complex boolean logic, adjudication slows down.
      *   *Restriction:* Single condition only. `IF [A] [OP] [B] THEN C ELSE D`.
      *   Actually, let's allow a specific function `MATCH(x, y)`.
      *   *Simpler:* Just let them write the condition in English if it's unambiguous? No, needs to be "code".
      *   *Decision:* A specific template.
          ```
          INSPECT: [YES/NO]
          CONDITION: [OPP_CODE == MY_CODE] / [TRUE] / [FALSE]
          ACTION_IF_TRUE: [C/D]
          ACTION_IF_FALSE: [C/D]
          ```
      *   This limits creativity but ensures speed.
      *   *Better:* Allow free text for condition but restrict to equality checks.
      *   *Best for "Graduate Level":* Allow them to write the logic, but the Facilitator reserves the right to rule "Undecidable/Too Complex" as Defect.
      *   *Let's go with a specific "Language Specification" handout.*

  10. **Confidence & Contested Readings:**
      *   *Confidence:* Low on Round 4 (Sandbox). It's hard to simulate "running" a program by hand without getting into halting problems. Might need to drop Round 4 if time slips.
      *   *Contested Reading:* Does this actually model *Newcomblike* problems? Or just *conditional* causation? (The "Why ain'cha rich?" argument).
      *   *Watch for:* If everyone just writes `C`. Then the lesson fails. Need to ensure `D` is tempting.

  11. **Final Polish:**
      *   Tone: Precise, academic but practical.
      *   Formatting: Clear headings for the 6 requested sections.
      *   Check constraints: 90 mins. 14 people.
      *   *Timing:*
          *   Intro: 10 min.
          *   Round 1: 5 min sub + 5 min calc = 10.
          *   Round 2: 10 min sub + 10 min calc = 20.
          *   Round 3: 10 min sub + 10 min calc = 20.
          *   Round 4: 10 min sub + 10 min calc = 20.
          *   Debrief: 10 min.
          *   Total: 90. Tight. Round 4 is definitely the cuttable one.

  12. **Self-Correction on "Hand Adjudication":**
      *   Comparing two strings of text (source code) for exact equality takes more than a few seconds if they are long.
      *   *Constraint:* Max 20 characters for the logic line?
      *   *Constraint:* Participants submit a "Hash" of their code? No, too abstract.
      *   *Solution:* The Facilitator types the code into a projected text editor live? No, "no appetite for lecture" implies minimal facilitator performance.
      *   *Solution:* The "Code" is just a specific strategy selection from a menu? No, defeats the "writing a program" goal.
      *   *Compromise:* The "Code" is written on a standard form with limited space (3 lines). Facilitator compares visually. If it looks the same, it is. If there's a whitespace diff, Round 2 counts as mismatch, Round 3 counts as match (if semantically same).
      *   *Actually:* For Round 2 (Syntax), exact string match. For Round 3 (Semantics), Facilitator normalizes.
      *   *To save time:* The Facilitator needs a TA or just accepts that 7 pairs x 1 min is 7 minutes. That's fine.

  13. **Final Review against Prompt:**
      *   Pseudo-code primitives? Yes.
      *   Payoff/Chocolate? Yes.
      *   Handout/Protocol? Yes.
      *   Debrief map? Yes.
      *   Limitations note? Yes.
      *   Failure modes? Yes.
      *   Confidence/Contested? Yes.

      *One critical detail:* "The move from choosing an action to submitting something that chooses on your behalf." The handout must emphasize that they are submitting the *algorithm*, not the *move*.

      *Refining the "Recompiler":* How does the facilitator do this live?
      *   Facilitator collects Round 3 slips.
      *   Facilitator takes one slip from each pair.
      *   Facilitator rewrites variable names on the fly (e.g., change `x` to `y`, add comments).
      *   This is risky for time.
      *   *Alternative:* The "Recompiler" is a rule announced *after* submission. "For this round, I will treat `IF A==B` as identical to `IF B==A`." No, that's changing the rules.
      *   *Better:* The prompt says "a meaning-preserving rewriter... is applied, privately and at random, to one side".
      *   *Implementation:* The Facilitator has a stack of "Obfuscation Cards". When a pair is drawn, flip a coin. If heads, take Player A's code and manually add a comment or rename a variable before comparing to Player B.
      *   *Time Cost:* High.
      *   *Mitigation:* Limit code to a single line of logic. `IF OPP == ME THEN C ELSE D`. Obfuscation: `IF (OPP) == (ME) THEN C ELSE D`.
      *   *Decision:* I will advise the user to pre-prepare the obfuscation or do it very simply (adding whitespace/comments).

      *Let's write the response.*
answer: |-
  This design is tight. It relies on the friction between *syntax* (what you wrote) and *semantics* (what you meant) to drive the philosophical point. The biggest risk is administrative overhead eating the debrief time.

  Here is the complete package for your session.

  ### 1. The Pseudo-Code & Adjudication Rules

  To ensure hand-adjudication in under a minute per pair, the language must be restricted to **string comparison** and **boolean literals**. No loops, no recursion, no arithmetic.

  **The Primitives:**
  *   `MY_CODE`: A string literal representing the exact text submitted on your slip.
  *   `OPP_CODE`: A string literal representing the exact text submitted by your opponent.
  *   `TRUE` / `FALSE`: Boolean constants.
  *   `==`: String equality (case-sensitive, whitespace-sensitive unless specified).
  *   `THEN ... ELSE ...`: Conditional output.
  *   `INSPECT`: A flag declaring whether you pay the cost to read `OPP_CODE`.

  **The Submission Template (Printed on slips):**
  ```text
  ID: [Assigned Number]
  INSPECT: [YES / NO]
  LOGIC: IF [CONDITION] THEN [C / D] ELSE [C / D]
  ```
  *Constraint:* The `[CONDITION]` must be one of: `MY_CODE == OPP_CODE`, `OPP_CODE == MY_CODE`, `TRUE`, or `FALSE`. (This prevents complex boolean trees that slow adjudication).

  **Adjudication Algorithm (Facilitator Only):**
  1.  **Check Inspection:** If Player A marked `YES`, subtract 1 point from A's final score.
  2.  **Evaluate Logic:**
      *   Substitute the actual text of the slips into `MY_CODE` and `OPP_CODE`.
      *   Evaluate the `IF` condition.
      *   Determine Action (C or D) for each player.
  3.  **Calculate Payoff:** Apply matrix (see Section 2).
  4.  **Malformed/Non-Halting:** Any slip not following the template, or with a condition not in the allowed list, is treated as `INSPECT: NO` and `LOGIC: IF FALSE THEN C ELSE D` (i.e., Unconditional Defect). *State this rule clearly at the start.*

  **Worked Adjudication Example:**
  *   **Player A:** `INSPECT: YES`, `LOGIC: IF MY_CODE == OPP_CODE THEN C ELSE D`
  *   **Player B:** `INSPECT: YES`, `LOGIC: IF MY_CODE == OPP_CODE THEN C ELSE D`
  *   **Step 1 (Cost):** A pays 1, B pays 1.
  *   **Step 2 (Compare):** Facilitator reads slips. Text is identical. Condition `TRUE`.
  *   **Step 3 (Action):** A plays C, B plays C.
  *   **Step 4 (Payoff):** Base CC = 3 points. Net: A=2, B=2.

  *   **Player C:** `INSPECT: NO`, `LOGIC: IF TRUE THEN C ELSE D` (Unconditional Cooperator)
  *   **Player D:** `INSPECT: YES`, `LOGIC: IF MY_CODE == OPP_CODE THEN C ELSE D` (Mirror)
  *   **Step 1 (Cost):** C pays 0, D pays 1.
  *   **Step 2 (Compare):** Text differs. Condition `FALSE`.
  *   **Step 3 (Action):** C plays C, D plays D.
  *   **Step 4 (Payoff):** Base CD = 0 (Sucker) / 5 (Temptation). Net: C=0, D=4.

  ---

  ### 2. Payoff Scheme & Stakes

  **Stakes:** High-quality dark chocolate.
  *   **Unit:** 1 small square (approx. 5g).
  *   **Conversion:** 1 Point = 1 Square.
  *   **Endowment:** Everyone gets 1 square on entry (to prevent negative scores feeling punitive).

  **The Matrix (Gross Points):**
  | | Opponent C | Opponent D |
  | :--- | :---: | :---: |
  | **You C** | 3 | 0 |
  | **You D** | 5 | 1 |

  **Inspection Cost:** 1 Point.

  **Calibration Logic:**
  *   **Blind Defect (`D`):** Guarantees 1 point (if opp C) or 1 point (if opp D). *Wait, if opp C, you get 5. If opp D, you get 1.* Expected value depends on pool.
  *   **Blind Cooperate (`C`):** Risks 0. Max 3.
  *   **Mirror (`IF Me==Opp THEN C ELSE D`) + Inspect:**
      *   vs Mirror: You get 3 - 1(cost) = **2**. (Worse than Blind C vs Blind C, but safe).
      *   vs Blind D: You get 1 - 1(cost) = **0**. (Same as Sucker payoff, but you avoided being exploited).
      *   vs Blind C: You get 5 - 1(cost) = **4**. (You exploit the naive cooperator).
  *   **The Tension:** Inspection caps your maximum gain against cooperators (2 vs 3) but protects you against defectors (0 vs 0) and allows you to exploit naive cooperators (4 vs 5). It creates a *Nash Equilibrium* of mutual inspection/mirroring that is stable, even if Blind Cooperation yields higher gross utility in a trusting pool.

  ---

  ### 3. Handout Text & Submission Protocol

  **Handout Header:**
  > **AGENCY PROTOCOL: ROUND [X]**
  > You are not choosing an action. You are submitting a **policy**.
  > Your policy will be paired anonymously with one other policy.
  > **Rules:**
  > 1. Write your ID number.
  > 2. Mark INSPECT (YES/NO). If YES, 1 point is deducted from your score.
  > 3. Write your LOGIC using only the allowed primitives.
  > 4. **No marks outside the slip.** No folding patterns. No ink smells.
  > 5. **Round 3 Note:** Syntax may be altered before comparison. Semantics matter.

  **Protocol to Prevent Collusion:**
  1.  **ID Assignment:** Assign IDs 1–14 at the door. Record mapping privately.
  2.  **Collection:** Use a sealed box. Participants drop slips in.
  3.  **Pairing:** Facilitator draws pairs randomly from the box. (e.g., 1st & 2nd, 3rd & 4th).
  4.  **Anonymity:** Facilitator reads only the *Logic* and *Inspect* flag during adjudication. IDs are only used to distribute chocolate at the end.
  5.  **The "Recompiler" (Round 3 Specific):**
      *   *Instruction to Participants:* "In Round 3, I may normalize whitespace or rename variables before comparing strings. Write robust code."
      *   *Facilitator Action:* For each pair, flip a coin. If Heads, take Player A's slip and add a comment (e.g., `// round 3`) or change spacing *before* comparing to Player B's slip. This breaks exact string equality for `MY_CODE == OPP_CODE` strategies.

  ---

  ### 4. The Debrief Map

  Do not lecture. Use the Socratic method, pointing to the results on the board.

  **Moment 1: The Baseline (Round 1)**
  *   *Observation:* High defection rate.
  *   *Claim:* Causal dominance. "Why did you defect?" (Answer: "Regardless of what they do, D is better.")
  *   *Label:* **Causal Decision Theory.**

  **Moment 2: The Mirror (Round 2)**
  *   *Observation:* Emergence of `IF MY_CODE == OPP_CODE`. Pairs of these get 2 points each.
  *   *Claim:* "You didn't choose C. You chose a machine that chooses C *conditionally*."
  *   *Key Insight:* The dominance argument dissolves because your choice *logically correlates* with the opponent's choice (via the source code).
  *   *Label:* **Program Equilibrium / Logical Decision Theory.**

  **Moment 3: The Bully & The Sucker**
  *   *Observation:* Point out a pair where a Mirror player got 4 points (vs a Blind Cooperator).
  *   *Claim:* "The Mirror strategy isn't 'nice'. It exploits unconditional cooperation."
  *   *Key Insight:* The equilibrium set contains "good" outcomes (Mirror vs Mirror) and "bad" outcomes (Mirror vs Sucker). Rationality doesn't guarantee morality; it guarantees stability.

  **Moment 4: The Recompiler (Round 3)**
  *   *Observation:* Mirror strategies fail. Scores drop. Confusion.
  *   *Claim:* "The code was the same meaning, but different text."
  *   *Key Insight:* **Intensional vs. Extensional Equality.** Your strategy relied on *syntactic identity*, not *behavioral equivalence*. This is fragile.
  *   *Question:* "How would you write a program that cooperates with any program that *behaves* like you?" (Leads to Halting Problem).

  **Moment 5: The Sandbox (Round 4 - If time permits)**
  *   *Observation:* Players try to run the opponent's code.
  *   *Claim:* "You can't simulate them without simulating yourself."
  *   *Key Insight:** **Undecidability.** You cannot perfectly predict a peer who is predicting you.

  ---

  ### 5. Limitations & Facilitator Notes

  You must supply the theoretical bridge verbally, briefly, during the debrief. Do not hide these limitations, but frame them as "features of the model."

  **1. Stipulated Self-Reference:**
  *   *The Gap:* In reality, a program cannot easily contain its own source code (Quining is hard). We gave them `MY_CODE` as a magic token.
  *   *What to Say:* "We granted you a 'magic mirror' token. In real computational theory, constructing this is non-trivial. We assumed the fixed point exists to focus on the *decision* logic, not the compilation logic."

  **2. Causal vs. Acausal:**
  *   *The Gap:* This is technically *causal* inspection. You are reading a physical slip. Acausal trade (Newcomb) implies correlation without physical inspection.
  *   *What to Say:* "This models *logical* correlation, not spooky action. The 'acausal' leap is assuming your decision algorithm is instantiated in the other player's prediction of you. Here, we made that instantiation physical."

  **3. The "Why Ain'cha Rich?" Objection:**
  *   *The Gap:* A Causal Decision Theorist (CDT) can observe your Program Equilibrium strategy, predict you will cooperate with mirrors, and simply Defect. They get 5, you get 0.
  *   *What to Say:* "Notice the Mirror player got 0 against a Blind Defector. Program Equilibrium doesn't beat Causal Defection; it beats *other* Program Equilibria. It creates a clique, not a domination."

  ---

  ### 6. Predicted Failure Modes

  1.  **Formatting Wars (Round 2):**
      *   *Risk:* "I wrote `IF A==B` and they wrote `IF A == B`. You said that's a mismatch!"
      *   *Fix:* Enforce the template strictly. No spaces around operators unless the template includes them.
  2.  **The "Rigged" Feeling (Round 3):**
      *   *Risk:* Participants feel cheated when their Mirror strategy fails due to your manual obfuscation.
      *   *Fix:* Frame this *before* Round 3. "In the real world, code is compiled. Whitespace doesn't change meaning. Does your logic survive compilation?"
  3.  **Time Creep:**
      *   *Risk:* Adjudicating 7 pairs takes 15 minutes, not 7.
      *   *Fix:* **Drop Round 4.** It is the most complex to adjudicate by hand (simulating output) and the least critical for the core "Syntax vs. Semantics" point. If Round 3 runs late, cut to debrief.
  4.  **Personal Exploitation:**
      *   *Risk:* A philosopher feels morally aggrieved at being exploited by a CS student's "Bully" program.
      *   *Fix:* Remind them during the game: "This is a study of rationality, not ethics. Exploitation is a data point."

  ---

  ### 7. Confidence & Contested Readings

  **Least Confident Element:**
  **Round 3 (The Recompiler).**
  *   *Why:* Manually obfuscating code on paper is error-prone and slow. If you make a mistake (e.g., accidentally change the logic while adding a comment), the data is ruined.
  *   *Mitigation:* Pre-print "Obfuscation Stickers" with comments like `// optimized` or `// v2` that you stick onto one slip of the pair before comparing. This ensures you don't accidentally alter logic.

  **Contested Reading:**
  **The "Rationality" of the Mirror Strategy.**
  *   *The Contention:* Many economists/CDT proponents argue that `IF MY_CODE == OPP_CODE` is not a valid move in a one-shot game because "my code" is not a causal lever on "their code" unless there is a pre-existing causal link (like shared source).
  *   *The Design's Stance:* This design takes the **Functional Decision Theory (FDT)** side: that you should choose as though you are selecting the output of the algorithm that runs in both places.
  *   *Watch For:* If the two economists in the room aggressively argue that Round 2 is "cheating" because the slips are physically distinct objects.
  *   *Response:* "The slip represents the *algorithm*, not the physical paper. If you believe rational agents converge on similar algorithms, the correlation is real. If you don't, then Round 1 is the only valid round."

  **When to Drop a Round:**
  *   **Watch the Clock at Minute 45.** If you are finishing Round 2 adjudication, **skip Round 3** and go straight to Debrief using the Round 2 results.
  *   *Why:* It is better to have a deep discussion on Program Equilibrium (Round 2) than a rushed, confusing experience of Obfuscation (Round 3). The core lesson (submitting a chooser vs. choosing) lands in Round 2. Round 3 is nuance.

  **Final Check:**
  Ensure you have enough chocolate. 14 people x ~3 points average x 3 rounds = ~126 squares. Buy 150g of high-quality chocolate. It's worth the budget creep.
