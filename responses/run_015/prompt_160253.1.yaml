answer: |-
  I reject step (3).

  The error is an illicit slide from a comparative premise to an exclusive conclusion. Premise (2) states that host-neutral biases do *most* of the work, while host-aligned biases (including truth-tracking) do *very little*. Premise (3) concludes that belief content is explained by neutral biases *and not* by truth. "Very little" is not "none." Even if truth-tracking is a minor causal factor compared to conformity or prestige, it can still be a necessary condition for the stability of certain beliefs or sufficient to ground epistemic support. By converting a claim about predominance into a claim about exclusion, (3) creates the vacuum that allows the debunking principle in (5) to trigger.

  This step looked fine because it masquerades as a simple transitive inference from (1) and (2). Premise (1) defines a selectionist explanation as one that cites transmission success rather than host benefit. Premise (2) provides the empirical data that transmission success is driven mostly by neutral biases. It feels like a straightforward application: if selection explains via transmission, and transmission is driven by biases, then selection explains via biases. The exclusion of truth seems to follow from (1)'s definition ("not by what carrying the variant does for the humans"). However, (1) distinguishes two *types* of explanation (selectionist vs. rational-agent), not two mutually exclusive *causal histories*. A belief can spread via selectionist mechanisms (copying) while still being constrained by host-aligned factors (truth) that affect whether the copy is retained or acted upon. Step (3) treats these as a zero-sum game where the winner takes all causal credit, which is not warranted by the "most vs. little" data in (2).

  Here is the price of the alternatives:

  *   **Rejecting (5):** This is the costliest option for your broader philosophical toolkit. Premise (5) is the engine of evolutionary debunking arguments (EDAs) in ethics and religion. If you reject (5) here to save cultural evolution, you concede that the causal origin of a belief (e.g., fitness benefits rather than moral truths) is irrelevant to its justification. You would lose the ability to argue that evolutionary explanations of moral intuition undermine moral realism. Rejecting (3) instead allows you to keep (5) as a valid conditional: *if* truth plays no causal role, *then* justification fails. You merely deny that the antecedent is met in this specific case.
  *   **Rejecting (1):** This would require abandoning the standard Dual Inheritance Theory framework used in your seminar. It would blur the distinction between cultural evolution and rational choice theory, suggesting that selectionist explanations *can* cite host benefits directly. While some modern theorists argue for this integration, rejecting it now would undermine the specific model you found convincing.
  *   **Rejecting (2):** This requires denying the empirical modeling results of your course. Since you stipulated the simulation as a fair toy model, rejecting this would force you to dispute the data rather than the logic, which doesn't solve the structural problem of the argument.

  The self-referential step, (4) together with (7), is not a red herring; it is a valid *reductio ad absurdum*. It does not make the argument easier to dismiss; rather, it signals that the argument is unsound because it entails a self-defeating conclusion (a theory that proves it shouldn't be believed). It forces you to locate the false premise rather than allowing you to ignore the implication. If the argument did not self-destruct, you might be forced to accept global skepticism; the self-reference is the warning light that a premise must be false.

  I would change my mind about (3) being the culprit if you could demonstrate that truth-tracking is causally inert even when agents attempt it—for example, if evidence showed that "true" beliefs spread no better than "false" ones even when neutral biases are controlled for. If truth is genuinely epiphenomenal to transmission, then (3)'s exclusion claim holds, and you would be forced to reject (5) or accept skepticism.

  My own reasoning is most likely to fail in assuming that a "small" causal role for truth is sufficient for epistemic support. Some externalist epistemologies require the truth-link to be the *primary* driver of belief formation, not just a background constraint. If justification requires truth to be the dominant causal factor, then (2)'s claim that neutral biases do "most of the work" might still trigger (5), even if (3) is softened.
