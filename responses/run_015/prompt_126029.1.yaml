prompt: |-
  I would be grateful for your comments on the essay notes below. They sketch the argument of a paper I am planning on the non-identity problem; I want to know whether its central move can be made to work before I write it up at length. Please do not spend your reply summarising the standard positions in the literature — I know them, and restating them is not useful to me. What I want is pressure on the argument itself.

  ---

  **Slots, Not Persons: Filling-Relative Assessment for Identity-Affecting Choice** *(notes)*

  **§1. Where I take the debate to be stuck.** In the familiar family of cases — a girl conceives at fourteen rather than waiting; a government depletes rather than conserves; prospective parents select for a child who will be deaf when they could have selected otherwise — the agent's act is a condition of the existence of the individual it affects. Whoever ends up existing has a life worth living and would not have existed had the agent acted otherwise. So the act cannot be wrong in virtue of making someone worse off, and yet it seems wrong.

  There are two familiar packages. Keep the person-affecting restriction and accept that such acts are not wrong, unless the life produced is not worth living at all. Or abandon the restriction for an impersonal axiology that ranks outcomes by total or average welfare, and accept that the wrongness of such acts is of a piece with the wrongness of failing to add further happy people to the world. I want to claim that these packages share an assumption, which I will call *identity-determined assessment*: the moral significance of an outcome is a function of which individuals it contains, so that outcomes differing only in who exists are morally incomparable unless one reaches for an impersonal value. The first package holds the assumption and pays in counter-intuitive verdicts; the second abandons it and pays in implications elsewhere.

  **§2. The proposal.** Deny the assumption while keeping the relational structure of wrongness. Distinguish the *occupants* of an act's effects from the *slots* those occupants fill. Slots are the positions that the agent's practical question was about: my first child, the patient who receives this kidney, a resident of this city in 2120, the child of the violinist I hire. Feasible options in identity-affecting cases differ not merely in who fills those slots but in how well they are filled. Proposal: an act is pro tanto wrong when, relative to the practical question the agent actually faced, it fills some slot worse than a feasible alternative fills the corresponding slot, and fills no slot better. Call this *filling-relative assessment*.

  **§3. The complaint.** On this view the child of the girl who conceived at fourteen has a genuine complaint, but not the counterfactual one — not that she would have been better off had her mother waited. The complaint concerns occupancy: the slot you filled, your first child, you filled below the level that was open to you, and you did it knowingly. Wrongness becomes a relation between an agent, a slot her choice filled, and the alternatives she had. It does not require that the complainant would have existed under any alternative, only that she occupies a slot the agent was in a position to fill well. So the view keeps no wrong without a possible complainant while dropping no complainant without counterfactual improvement. That combination is the whole point of the paper.

  **§4. Two claimed payoffs.** First, the view generates no verdicts in different-number cases. Where the options differ in how many slots there are, there is no counterpart matching to perform and filling-relative assessment is undefined. The procreation asymmetry and the repugnant conclusion are therefore outside its scope. I intend to present this as a virtue rather than a gap, on the grounds that these are separate problems needing separate resources, but I am aware it may look like an evasion. Second, the view appears to describe what large-scale institutional reasoning already does: cost-benefit analysis, risk regulation and demographic forecasting compare outcomes slot-wise, by reference to positions and statistical lives rather than to identified individuals, and feel no embarrassment about it.

  **§5. The soft spot: matching.** Filling-relative assessment needs a counterpart relation between slots in distinct outcomes, and identity cannot supply one. My suggestion is that the relation is supplied by the practical question: the slots are those the agent's deliberation was already about, and the matching is fixed by what she was choosing between. I expect this to be where the view fails if it fails. If the practical question can be redrawn freely — individuate the slots by ordering their occupants by welfare, and match in that order — filling-relative assessment becomes a maximising impersonal view in disguise. I gesture at a constraint, that slots must be individuated independently of the welfare levels of their occupants on pain of begging the question, but I do not think I have shown that the constraint bites.

  **§6. The soft spot: propagation.** Consider an orchestra. A conductor can appoint a competent first-chair violinist now, or hold further auditions and appoint a stronger player in five years. Either appointment determines where a person lives, whom she meets, and hence which children come to exist; so the decision fixes the filling of slots indefinitely far downstream, and filling-relative assessment is now comparing whole genealogical futures. If slots propagate without limit, every hiring decision becomes an occasion for optimising the welfare of the descendants of every candidate, and the view collapses back into impersonalism. If they do not propagate, I owe a principled cut-off, and I do not have one. My current line is that the slots that matter are those the agent could have foreseen being affected; but foresight is scalar, which would make the verdicts of the view come in degrees where I had hoped for something binary.

  ---

  **What I would like from you.**

  1. Is the diagnosis in §1 fair, or does filling-relative assessment already sit on the standard menu under a different description? If it is a redescription of a position you recognise, say in your own terms what the redescription is supposed to buy and whether it buys it.
  2. Attack §5. What, if anything, constrains the counterpart relation? Try to construct a case in which the practical question is genuinely indeterminate between two matchings and the verdict flips depending on which one is chosen.
  3. Is the propagation problem in §6 fatal, or is there a non-ad-hoc cut-off? Does the orchestra case show the view is wrong, or only that it must become a view about foresight — and would that be a cost or an unexpected gain?
  4. Is the silence claimed in §4 defensible? A view that falls silent exactly where the number of possible people varies may turn out to have no advantage over the views it was meant to replace.
  5. If you were refereeing this, which section would you say is weakest, and what is the single objection you would put first?

  Tell me where I am wrong rather than where I am unclear, and feel free to say if you think the whole framing of §2 is confused.
reasoning: |-
  Here's a thinking process that leads to the critique:

  1.  **Analyze the Request:**
      *   **Task:** Critique essay notes on a paper about the Non-Identity Problem (NIP).
      *   **Topic:** "Slots, Not Persons: Filling-Relative Assessment for Identity-Affecting Choice."
      *   **Constraint:** Do *not* summarize standard positions (I know them). Focus on pressure on the argument itself.
      *   **Specific Questions:**
          1.  Is the diagnosis in §1 fair? Is this a redescription of an existing view?
          2.  Attack §5 (Matching/Counterpart Relation). Construct a case where the practical question is indeterminate.
          3.  Address §6 (Propagation). Is it fatal? Is there a non-ad-hoc cut-off?
          4.  Defend/Critique §4 (Silence on Different-Number Cases).
          5.  Identify the weakest section and the primary objection.
      *   **Tone:** Critical, direct ("Tell me where I am wrong"), philosophical rigor.

  2.  **Analyze the Proposed View ("Slots, Not Persons"):**
      *   **Core Idea:** Moral assessment is relative to "slots" (roles/positions defined by the agent's practical question) rather than specific individuals.
      *   **Mechanism:** An act is wrong if it fills a slot worse than an alternative would have filled the *corresponding* slot, without filling any slot better.
      *   **Goal:** Solve NIP (same-number cases) without impersonal total/average utilitarianism (avoiding Repugnant Conclusion/Procreation Asymmetry issues).
      *   **Key Distinction:** Occupants vs. Slots. Complaints are about occupancy quality, not counterfactual harm to the specific occupant.

  3.  **Drafting the Critique - Section by Section:**

      *   **Q1: Diagnosis & Originality (§1 & §2)**
          *   *Is it new?* It sounds very much like **Person-Affecting Restriction + Counterpart Theory** (Parfit's suggestions) or **Hanser's "Compound Principle"** or **Shiffrin's "Harm to Future People"**. But the specific "Slot" metaphor aligns closely with **Kasper Lippert-Rasmussen's** work on "birth slots" or **McMahan's** "embryo view" (though McMahan focuses on identity).
          *   *Closer match:* It resembles **Holtug's** or **Roberts's** "Person-Affecting Restriction with Flexible Identity." But the strongest resonance is with **structuralist** or **role-based** accounts in institutional ethics.
          *   *Critique:* The diagnosis that standard views assume "identity-determined assessment" is slightly straw-ish. Person-affecting views *do* try to handle this via counterfactuals. The innovation is shifting the relata of the comparison from *persons* to *slots*.
          *   *Verdict:* It's a sophisticated redescription of a "non-identity sensitive person-affecting view." Does it buy anything? It buys intuitive verdicts in same-number cases. But does it solve the *problem* or just relocate the metaphysical burden?

      *   **Q2: The Matching Problem (§5)**
          *   *The Weakness:* This is the metaphysical heart. If slots are defined by the "practical question," what fixes the question?
          *   *Counter-example construction:* I need a case where the agent's deliberation is ambiguous between two slot-mappings.
          *   *Case:* "The Two-Child Dilemma." A couple can have Child A (happy) now, or wait and have Child B (very happy) later. NIP standard.
          *   *Harder Case:* "The Swap." I can hire Alice for Job 1 and Bob for Job 2, OR hire Bob for Job 1 and Alice for Job 2. The "slots" are Job 1 and Job 2. But what if the jobs are qualitatively identical? Or what if the choice is between "Having a child with Genetic Profile X" vs "Having a child with Genetic Profile Y"? Are these the *same slot* ("my child") or *different slots* ("child X" vs "child Y")?
          *   *The Trap:* If "my child" is the slot, it's same-number. If "child X" is the slot, it's different-number (or undefined). The agent's intention ("I want a child") is too vague. The specific intention ("I want *this* embryo") fixes identity.
          *   *Critique:* The "practical question" is endogenous to the agent's framing. An agent can game the system by framing the slot broadly ("a successor") vs narrowly ("this successor"). This makes moral status depend on descriptive framing, which is objectionable (frame dependence).

      *   **Q3: Propagation (§6)**
          *   *The Problem:* Causal chains. Every choice affects who exists later.
          *   *Proposed Solution:* Foresight.
          *   *Critique:* Foresight is epistemic, morality is usually ontic. If I unknowingly cause a lineage of misery, am I off the hook?
          *   *Deeper Issue:* If slots propagate, the "slot" becomes "inhabitant of Earth in 2200." This collapses into impersonalism because the slot is defined by time/place, not role.
          *   *Cut-off:* The cut-off must be **normative**, not epistemic. The slot is defined by the *scope of the agency*. In the orchestra case, the slot is "First Chair Violinist," not "Descendant of the Violinist." Why? Because the conductor's authority/role is limited to the orchestra.
          *   *Verdict:* It's not fatal, but it requires a theory of **Normative Jurisdiction**. The view becomes: "Slots are defined by the scope of the agent's normative authority." This is a gain (connects to role morality) but a cost (limits applicability to personal procreation).

      *   **Q4: Silence on Different-Number (§4)**
          *   *The Claim:* View is silent on different-number cases.
          *   *Critique:* This is a major vulnerability. Many NIP cases *are* different-number (or can be framed as such). If the view cannot handle the "Non-Identity Problem" in its full generality (including Parfit's Risky Policy which affects numbers), it's a partial solution.
          *   *Defense:* It claims to solve the *intuitive* wrongness in same-number cases (Depletion, Young Mother).
          *   *Objection:* If the mechanism (slots) works for same-number, why does it break for different-number? If "my child" is a slot, is "no child" an empty slot? If so, we can compare filled vs. empty. If not, why not? The silence looks like an inability to handle the metaphysics of non-existence.
          *   *Verdict:* It limits the paper's impact. It solves "Same-Number Non-Identity" but leaves "Different-Number Non-Identity" (the Repugnant Conclusion) untouched. This is acceptable *if* framed as a distinct problem, but risky if reviewers think NIP *is* the different-number problem.

      *   **Q5: Weakest Section & Primary Objection**
          *   *Weakest:* §5 (Matching).
          *   *Primary Objection:* **The Framing Objection.** The moral verdict depends on how the agent conceptualizes the "slot." This makes wrongness mind-dependent in an unacceptable way. I can make an act permissible by describing the slot broadly enough to mask the welfare difference, or impermissible by narrowing it.
          *   *Example:* Conceiving at 14. Slot = "My first child" (Comparable). Slot = "The child born from this specific egg/sperm union" (Not comparable, different identity). The agent chooses the description. Morality shouldn't depend on this.

  4.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Check Tone:* Ensure I'm not summarizing Parfit/etc. Focus on the "Slot" mechanics.
      *   *Check Specifics:* The user asked for a case where the practical question is indeterminate. I need to be precise there.
      *   *Check §6:* The "Foresight" reply is weak. I should push for "Normative Scope" instead.
      *   *Check §1:* Is "Identity-Determined Assessment" a fair label? Most person-affecting views *try* to avoid this. But they fail because they tie harm to *persons*. The Slot view ties harm to *positions*. This is the key shift.

  5.  **Finalizing the Output Structure:**
      *   Address the 5 points directly.
      *   Maintain a rigorous, peer-reviewer style.
      *   Ensure the "Framing Objection" is the climax.

  6.  *(Self-Correction during drafting)*: Wait, is this just **Role Morality** applied to NIP? It resembles **David Velleman's** work on "Well-Being and Identity" or **Elizabeth Harman's** "Actual Future Principle." I need to mention that the "Slot" view risks collapsing into the Actual Future Principle if the slot is "the person who will exist." I need to press on how the slot is individuated *prior* to occupancy.

      *   *Refinement on §5:* If the slot is "The child of this union," identity is fixed. If the slot is "A child for me," identity is not fixed. The agent's choice of description determines the moral logic. This is the "Description Dependence" objection.

      *   *Refinement on §6:* The propagation problem is actually a version of the **Non-Identity Problem itself**. If every act changes identity, *no* slots persist across options except abstract ones ("person living in 2100"). If slots are abstract, we are back to impersonalism. If slots are concrete, they don't persist. The view needs to explain why *some* slots persist (orchestra chair) and others don't (genetic lineage). The answer must be **Institutional/Functional** vs **Biological**.

      *   *Refinement on §4:* Silence on different-number is a feature, not a bug, *provided* the view claims to solve the *paradox* of same-number cases. But if the NIP is fundamentally about the link between identity and welfare, ignoring different-number cases might look like ignoring the hard part.

      *   *Final Polish:* Ensure I answer "Where am I wrong?" clearly.

      *(Drafting response based on these thoughts...)*
answer: |-
  Here is a critical assessment of the argument, focusing on the structural vulnerabilities you requested.

  ### 1. Diagnosis and Originality (§1 & §2)

  Your diagnosis in §1 is mostly fair, but you are underestimating the proximity of your view to existing "person-affecting with counterparts" strategies. The view closely resembles **Melinda Roberts's** *Person-Affecting Principle* combined with a **counterpart theoretic** approach to identity across worlds, or **Hanser's** account of harm. However, the "Slot" terminology does buy you something specific: it shifts the locus of moral concern from *metaphysical identity* to *functional role*.

  **The Gain:** By moving from "persons" to "slots," you bypass the need for transworld identity. You do not need to claim Child A (born at 14) is the *same person* as Child B (born at 20); you claim they occupy the *same slot* ("my first child"). This allows you to retain the relational structure of wrongness (wrong *to* someone) without the counterfactual condition of harm (worse off *than* they would have been).

  **The Cost:** You are not escaping "identity-determined assessment" entirely; you are replacing *biological* identity with *functional* identity. The risk is that this is merely a verbal shuffle. If the "slot" is individuated too finely (e.g., "the slot filled by the zygote resulting from *this* egg"), you return to the standard NIP deadlock. If individuated too coarsely (e.g., "a human life"), you collapse into impersonalism. Your view lives or dies on the granularity of the slot, which leads directly to the matching problem.

  ### 2. Attack on §5 (The Matching Problem)

  This is the metaphysical engine of the paper, and it is vulnerable to **Description Dependence**. You claim the matching is fixed by "the practical question the agent actually faced." This makes moral verdicts dependent on the agent's conceptual framing of their own choice, which is normatively suspicious.

  **The Indeterminacy Case:**
  Consider a prospective parent using IVF. They have two embryos, E1 (predicted moderate welfare) and E2 (predicted high welfare).
  *   **Framing A:** The agent asks, "Which embryo should I implant?" Here, the slots are *Embryo-Slot-1* and *Embryo-Slot-2*. If they choose E1, they fill Slot-1 moderately. They could have filled Slot-1 highly (by putting E2 in Slot-1? No, that doesn't make sense). In this framing, the slots are tied to the specific biological entities. There is no cross-world matching. The view falls silent (or says no wrong).
  *   **Framing B:** The agent asks, "Which child should I have?" Here, the slot is *My-Child*. E1 fills *My-Child* moderately. E2 fills *My-Child* highly. There is a match. The act is wrong.

  **The Objection:** The biological facts are identical in both framings. The moral verdict flips based entirely on whether the agent conceptualizes the choice as "selecting an embryo" or "selecting a child." If the agent is philosophically sophisticated and knows about the NIP, they can game the system by adopting Framing A to insulate themselves from criticism. A moral theory cannot allow the agent to determine the structure of the moral comparison through their own deliberative description. You need an *objective* criterion for slot individuation that is independent of the agent's mindset.

  ### 3. The Propagation Problem (§6)

  The propagation problem is not fatal, but your proposed solution (foresight) is the wrong tool. Foresight is epistemic; moral slots should be ontic or normative. If I unknowingly cause a lineage of misery, I am not off the hook simply because I didn't foresee it.

  **The Non-Ad-Hoc Cut-off:**
  The cut-off is not foresight; it is **Normative Jurisdiction**. Slots exist only where the agent has a specific normative mandate or functional role that persists across the options.
  *   **Orchestra Case:** The conductor has a mandate to fill the position of "First Chair." This position is defined by the institution of the orchestra, which persists regardless of who holds it. The slot is institutional.
  *   **Procreation Case:** Does "parent" constitute an institutional slot in the same way? In the "Young Mother" case, the slot is "child of this mother." This persists across the choice to wait or not.
  *   **Propagation Limit:** The slot does *not* propagate to "descendant of the violinist" because the conductor has no normative jurisdiction over the violinist's reproductive life. The slot ends where the agent's authority/role ends.

  **The Cost:** This turns your view into a theory of **Role-Based Obligations**. This is a gain for institutional ethics (explaining why cost-benefit analysis works there) but a potential cost for personal morality. If procreation is not a "role" with a defined functional slot independent of the specific child, the view loses its grip on the hard cases. You must argue that "being a parent" entails a functional slot ("offspring") that is distinct from the specific biological identity of that offspring.

  ### 4. Silence on Different-Number Cases (§4)

  This silence is defensible only if you frame the Non-Identity Problem as primarily a problem about *same-number* intuition pumps (like the Young Mother or Depletion cases). However, many philosophers view the NIP as fundamentally tied to the **Non-Identity Intuition** that exists *because* of different-number possibilities.

  **The Vulnerability:** If your view relies on "filling a slot," what happens when a slot is left empty?
  *   Option A: Fill Slot X with Person 1 (Welfare 10).
  *   Option B: Leave Slot X empty (No person).
  If "empty" is a valid filling state, you can compare Filled vs. Empty. This generates a verdict (Presumptive duty to fill).
  If "empty" is not a filling state (the slot ceases to exist), your view falls silent.

  **The Objection:** If you fall silent on different-number cases, you cannot solve the **Risky Policy** case where the policy changes the number of people (e.g., a policy that allows a community to grow larger but poorer vs. smaller but richer). If the NIP is a general problem about identity-affecting choices, a solution that only works when numbers are held constant is a partial solution at best. It risks looking like you have solved the "Same-Number Non-Identity Problem" but simply stipulated away the "Different-Number Non-Identity Problem." You need to argue why the moral intuition in same-number cases is structurally distinct from different-number cases, rather than just asserting silence.

  ### 5. Weakest Section and Primary Objection

  **Weakest Section:** **§5 (Matching).**
  This is where the view is most likely to collapse into either standard person-affecting views (if slots are too tight) or impersonalism (if slots are too loose).

  **The Primary Objection: The Individuation Objection.**
  You have not provided a principled basis for individuating slots that is neither circular nor arbitrary.
  *   **Circularity:** If you individuate slots by welfare (to ensure matching), you become an impersonal maximizer.
  *   **Arbitrariness:** If you individuate slots by the agent's description, you allow moral gaming (as shown in point 2).
  *   **Biological Reality:** If you individuate slots by biological function (e.g., "the child gestated by this womb"), you often return to the standard NIP because the biological specificities determine identity.

  **Where you are wrong:** You claim in §3 that "Wrongness becomes a relation between an agent, a slot her choice filled, and the alternatives she had." You are wrong to think this relation is stable. The "slot" is not a pre-existing container waiting to be filled; it is a conceptual construct generated by the description of the act. Because the description is underdetermined by the facts, the slot is underdetermined.

  **Recommendation:** To save the paper, you must ground slot individuation in **social practices** or **normative expectations** rather than the agent's practical question. The slot "first child" exists because society/kinship structures define that role, not because the mother thinks of it that way. This moves the view from a theory of *deliberation* to a theory of *social ontology*. This is a heavier metaphysical lift, but it avoids the "Framing Objection."

  **Summary:** The central move can be made to work, but only if you abandon the subjective "practical question" criterion for slot matching and replace it with an objective, normative account of role-individuation. Without that, the view is vulnerable to description-relativity.
