  # The Method Validation Tree for Intuition Differences

  **Root:** Some studies report cross-cultural differences in responses to these vignettes.

  1.  **Calibration Check:** Suppose we rerun the comparison with strict comprehension checks and a forced-choice format (yes/no instead of scales). Does the difference shrink or disappear?
      *   **YES** → **Leaf 1: Measurement Artifact** (The underlying competence is the same).
          *   *Awkward commitment:* "The signal was noise; the sample hasn't changed."
      *   **NO** → Go to 2.

  2.  **Matrix Check:** Suppose we analyze the translation. Are the key words (e.g., "knows", "intentional") doing the same conceptual job in both languages?
      *   **NO** → **Leaf 2: Different Concepts** (There is no single thing being theorized).
          *   *Awkward commitment:* "You are measuring pH, they are measuring acidity; stop comparing."
      *   **YES** → Go to 3.

  3.  **Specificity Check:** Suppose we test all four vignettes (Barn, Temperature, Name, Chairman). Does the difference appear in all of them or just some?
      *   **JUST SOME** → **Leaf 3: Variation is a Datum** (A good theory should predict this variation).
          *   *Awkward commitment:* "If your theory can't predict the noise, your theory is wrong."
      *   **ALL OF THEM** → Go to 4.

  4.  **Expertise Check:** Suppose we test people trained in the relevant subject (philosophers/scientists). Does the difference persist among them?
      *   **NO** → **Leaf 4: Restrict to Reliable Intuitions** (Only the intuitions of calibrated experts count).
          *   *Awkward commitment:* "Ignore the laymen; only the certified instruments get a vote."
      *   **YES** → Go to 5.

  5.  **Threshold Check:** Suppose we probe error costs. Do they disagree about the case itself or about how much evidence is enough / how bad it is to be wrong?
      *   **EVIDENCE/COST** → **Leaf 5: Variation in Error-Cost Settings** (Like signal detection thresholds; your hobby horse).
          *   *Awkward commitment:* "They see the same signal, but set the alarm threshold differently."
      *   **CASE ITSELF** → Go to 6.

  6.  **Dependence Check:** Suppose the judgment differs. Does the philosophical theory actually depend on these intuitions to be built?
      *   **NO** → **Leaf 6: Philosophy Doesn't Rest on Intuitions** (Methodological claim).
          *   *Awkward commitment:* "We never needed your ruler to build this machine."
      *   **YES** → Go to 7.

  7.  **Validity Check:** Suppose it depends on them. Does this variation invalidate the evidence entirely?
      *   **YES** → **Leaf 7: Discredits Intuitions** (Skepticism).
          *   *Awkward commitment:* "The instrument is fundamentally unreliable; trust nothing."
      *   **NO** → **Leaf 8: Unnamed: Intuitions are Fallible Evidence** (We weigh them, not obey them).
          *   *Awkward commitment:* "The ruler wobbles, but we can still average the readings."

