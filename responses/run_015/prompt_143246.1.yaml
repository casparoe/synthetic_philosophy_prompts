prompt: |-
  I'm writing the final for my grad seminar on translation theory and I want one essay question that gets deep into Marot's idea of le ton beau — the notion that a translator should preserve the elegant formal architecture of the source (meter, rhyme scheme, stanza shape) even when that forces semantic drift. I definatly don't want students just summarizing Marot's biography or listing his translations; I want them to actually argue whether formal fidelity can be philosophically defensible when it distorts the conceptual content.

  Specifically, build the question around a hypothetical case: a translator working in Marot's mode renders a passage from Ovid's Metamorphoses where Daphne becomes a laurel tree, and the Latin plays on the ambiguity between substance and accident — she is still present in the bark and leaves. The translator has to choose between keeping the rhyme royal and a strict decasyllabic couplet intact (which forces a generic term like 'wood-being' that blurs the metaphysical distinction) or breaking the form to preserve the exact philosophical vocabulary. Ask students whether le ton beau is merely an aesthetic preference or whether preserving form is actually a kind of fidelity to the text's mode of being — its performative or event-like existence — rather than just its propositional content. They should weigh form against content and say something concrete about what translation is for.

  Please write the exam question (answerable in about 90 minutes), a model answer around 600 words, and a marking scheme out of 20 with five must-hit points. Each point should note the marks and a one-line description of how students typically mess it up. Make sure the scheme separates an A answer — which should recognize that formal preservation might constitute fidelity to the conditions under which meaning arises — from a B answer that treats form as purely decorative and only talks about semantic loss. Also list specific mistakes that should cost marks, like conflating Marot with a naive literalist or invoking citation-heavy scholarship. Keep it concrete, avoid asking for bibliographies, and don't lean on ultra-niche theorists that a small LLM wouldn't have seen. Oh, and I accidently spelled 'definitely' wrong above — not important, but keep the tone casual.
