          5.  Final Value Judgment (The "Superintendent Clause").
      *   *Marking Boundaries:* Need to clearly say "Stop: Fact Check" vs "Stop: Value Call."
      *   *Omitted Nuances:* Deep metaphysical questions about the nature of time, specific pedagogical methods (how to teach), and granular political ideologies. Reason: Usability and scope.

  4.  **Developing the Test Cases:**

