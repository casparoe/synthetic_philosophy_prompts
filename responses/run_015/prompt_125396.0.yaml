      *   *Case 6 (Institutional We):* Internal split, external unity.
          *   *Requirement:* The "we" is a functional output, not a psychological sum. (Functionalism over Psychology).

  3.  **Synthesize Requirements (Desiderata):**

      *   *Req 1: Decoupled Intention.* (Cases 1, 3, 5). Agents don't need to know/endorse the specific goal.
      *   *Req 2: Epistemic Minimalism.* (Case 2, 5). No common knowledge or mutual awareness required.
      *   *Req 3: Responsibility Tracking.* (All cases, specifically 1 & 3). Must identify *who* is on the hook, not just *that* action occurred.
      *   *Req 4: Functional Unity.* (Case 4, 6). The "we" is defined by output/response, not internal consensus.

  4.  **Evaluate "Non-negotiable" vs. "Preference":**
      *   *Responsibility Tracking:* Non-negotiable for the user's purpose (journalistic/legal/ethical stakes).
