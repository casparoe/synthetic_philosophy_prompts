      *   *Closing:* One paragraph.

  8.  **Refining the "Misdescription" point:**
      *   Case 4 (The Constituted We): A crowd kettled by police is arguably *not* acting jointly; it is being *acted upon* as a unit. Treating it as joint action confuses *classification by authority* with *capacity for agency*. This is a crucial distinction for the columnist.
