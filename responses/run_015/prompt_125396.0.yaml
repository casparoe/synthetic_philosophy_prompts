answer: |-
  ### Desiderata for an Account of Sociotechnical Joint Action

  | Requirement | Primary Cases | Status | Rationale |
  | :--- | :--- | :--- | :--- |
  | **1. Decoupled Intention** | Rubber Stamp, Swarm, Reluctant Participant | **Non-negotiable** (for your purpose) | Individual participants need not endorse, know, or intend the specific outcome of the collective act. The system acts even if the parts do not grasp the whole. |
  | **2. Epistemic Minimalism** | Rotating Collective, Swarm | **Non-negotiable** (for your purpose) | Common knowledge or mutual awareness among participants is not required. Agency must persist despite high turnover and zero interpersonal contact. |
  | **3. Responsibility Tracking** | All, specifically Rubber Stamp & Reluctant Participant | **Non-negotiable** (for your purpose) | The account must identify specific loci of liability ("who is on the hook"). An account that identifies action but dissolves responsibility is inadequate for your normative goals. |
  | **4. Functional Unity** | Institutional We, Constituted We | **Preference** (Functionalism) | The "we" is defined by external output and stability, not internal consensus. This favors institutional realism over psychological summation. |
  | **5. Categorical Boundary** | Swarm vs. Aggregate | **Preference** (Parsimony) | A bright line between "mere aggregate" and "joint agent." Many modern accounts prefer scalar agency (degrees of jointness), but you require a binary for legal/moral assignment. |
  | **6. No Group Minds** | All | **Preference** (Methodological Individualism) | The account should not posit a metaphysical entity over and above the components. This is a philosophical constraint, not an empirical observation. |

  ### Audit of Your Cases

  You have correctly identified the stress points, but one case is likely a category error.

  *   **The Rubber Stamp, The Swarm, The Rotating Collective:** These are the hard cases. They generate **Decoupled Intention** and **Epistemic Minimalism**. They break the dyadic model because the "shared plan" is either nonexistent, opaque, or distributed across time and non-human nodes.
  *   **The Reluctant Participant:** This is not a hard case for *description*, but for *normativity*. It generates **Responsibility Tracking**. Standard theory says if you intend your part, you share the action. Your intuition asks: does coercion or dissent sever the moral tie? This requires the account to separate *participation* from *complicity*.
  *   **The Institutional We:** This is a linguistic/functional case. It supports **Functional Unity**. It is less philosophically difficult than the Swarm, as courts/committees have established rules of authorization.
  *   **The Constituted We (The Misdescription):** A crowd kettled by police is likely **not** a joint agent. It is a *target* of action, not a *source*. Its unity is imposed externally. Treating this as joint action confuses *classification by an outsider* with *capacity for agency*. If you include this, you risk validating profiling ("the police treated them as a unit, therefore they were one"). I recommend dropping this as a case of *action* and using it as a foil for *ascription*.

  ### Incompatibility Matrix: What Cannot Be Jointly Satisfied

  Your suspicion is correct. The list contains internal tensions that force a choice between philosophical comfort and empirical accuracy.

  1.  **Responsibility Tracking vs. Decoupled Intention + No Group Minds:**
      *   *The Conflict:* If no individual intends the outcome (Decoupled Intention) and there is no metaphysical group mind (No Group Minds), there is no one to hold responsible.
      *   *The Trade-off:* To satisfy **Responsibility Tracking**, you must either accept "Group Minds" (the system itself is the agent) or violate "Decoupled Intention" (force a fiction that the individuals intended it). You cannot have all three.
  2.  **Categorical Boundary vs. The Swarm:**
      *   *The Conflict:* Swarms exhibit agency-like behavior that scales with size. Drawing a bright line (Categorical Boundary) between a 100-drone swarm (agent) and a 99-drone swarm (aggregate) is arbitrary.
      *   *The Trade-off:* To satisfy **Categorical Boundary**, you must ignore the continuous nature of emergent coordination. To respect the **Swarm**, you must accept scalar agency, which muddies legal liability.
  3.  **Epistemic Minimalism vs. Shared Plan:**
      *   *The Conflict:* Traditional joint action requires a "shared plan." The Rotating Collective has no shared plan known to the participants.
      *   *The Trade-off:* You must abandon the "shared plan" requirement. If you keep it, you must deny the Rotating Collective is an agent, which contradicts the empirical stability of its output.

  ### The Single Exclusionary Requirement

  The requirement that does the most work in excluding candidate accounts is **Responsibility Tracking combined with Decoupled Intention**.

  Most theories of joint action are descriptive; they explain how coordination happens, not who pays for the damage. When you demand an account that explains how a system acts *without* individual endorsement (Decoupled Intention) but still tells you *who is liable* (Responsibility Tracking), you break the standard tools.

  The broad family hit hardest by this is **Reduction to individual attitudes plus common knowledge**.
  This family (e.g., Bratman-style accounts) insists that collective action is nothing over and above the interlocking intentions of individuals. In your Rubber Stamp and Swarm cases, those interlocking intentions are absent. The clinician does not intend the triage outcome; the drone does not know the mission. Reductionism must therefore conclude that **no joint action occurred**. If no joint action occurred, there is no collective responsibility, only individual negligence. This leaves you with the "Responsibility Gap" you are trying to solve: the harm exists, the action exists, but the theory says no one did it. To solve your problem, you must abandon reductionism.

  ### Closing

  To write this column defensibly, you must accept that standard philosophical accounts of joint action are tools built for small-scale human cooperation, not sociotechnical infrastructure. If you insist on Responsibility Tracking without positing a Group Mind, you will find that no existing theory fully satisfies your desiderata; you will likely need to argue for a new hybrid view where institutions bear a functional agency that distributes liability differently than individual intent. The reductionist family fails you here because it cannot locate the "we" without finding it in the "I," and in your cases, the "I" has checked out.
