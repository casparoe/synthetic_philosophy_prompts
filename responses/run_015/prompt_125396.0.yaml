      *   *The Table:* List the Desiderata, link to Cases, Mark Status (Non-negotiable/Preference), Explain Rationale.
      *   *Case Analysis:* Address the user's specific six cases. Which are hard? Which are misdescribed? (Case 4 is likely the misdescription—it's passive unity, not active agency).
