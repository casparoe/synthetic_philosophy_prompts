prompt: |-
  I am a junior serving as the student representative on our high school's student activities funding board. We have $1,800 in unspent funds that must be allocated by next Friday, with two final proposals: use it to discount spring field day tickets by about $6 for roughly 300 students, or use it to cover accessible transportation and a sign-language interpreter so three deaf students on our science team can attend the regional finals they qualified for. Some members argue we should choose whichever option produces the greatest total benefit across all students, while others argue it would be wrong to trade a major opportunity for a few students for a small added enjoyment for many. Please draft a short decision memo we can circulate and vote on that recommends one option with a clear rationale, engages seriously the strongest argument for the other option, and proposes how to explain the decision to the students who will be disappointed.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Junior student representative on the High School Student Activities Funding Board.
      *   **Task:** Draft a short decision memo for circulation and voting.
      *   **Context:** $1,800 unspent funds must be allocated by next Friday.
      *   **Options:**
          1.  Discount spring field day tickets ($6 off for ~300 students).
          2.  Fund accessible transportation + sign-language interpreter for 3 deaf science team students attending regional finals.
      *   **Ethical Conflict:** Utilitarianism (greatest total benefit/number of people) vs. Equity/Rights (major opportunity for a few vs. small enjoyment for many).
      *   **Requirements:**
          *   Recommend one option with clear rationale.
          *   Engage seriously with the strongest argument for the *other* option.
          *   Propose a communication plan for disappointed students.

  2.  **Determine the Recommendation:**
      *   *Option A (Field Day):* $1,800 / $6 = 300 students. Benefit: Small monetary savings ($6), enjoyment of a social event.
      *   *Option B (Science Team):* Benefit: Access to a qualified academic competition, equity for disabled students, potential long-term impact on those students' lives/careers. Without this funding, they likely cannot attend.
      *   *Ethical Analysis:* While Option A helps more *people*, Option B addresses a barrier to entry based on disability and enables a significant academic achievement. In an educational context, equity and access usually trump marginal utility for the majority. Denying access to disabled students because "more people get $6 off" sets a problematic precedent for inclusion.
      *   *Decision:* Recommend Option B (Science Team). This aligns with legal obligations (ADA/IDEA spirit), school values of inclusion, and the significance of the opportunity (regional finals vs. discounted party).

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose (allocate $1,800) and the recommendation clearly.
      *   **Rationale (The "Why"):** Focus on equity, access, and the nature of the opportunity. Highlight that the science team *qualified* on merit, and the funding removes a barrier, whereas field day is a general social event.
      *   **Engaging the Counter-Argument (Utilitarian View):** Acknowledge the "greatest good for the greatest number" argument. Validate that 300 students is more than 3. Admit that $6 adds up. *However*, refute it by distinguishing between *preference* (field day) and *access* (science finals). A small benefit to many doesn't outweigh a critical barrier for a few, especially regarding disability inclusion.
      *   **Communication Plan:** How to break the news to those who wanted the discount? Be transparent, emphasize values, and perhaps offer a non-monetary alternative or future focus.
      *   **Call to Action:** Request a vote by a specific date.

  4.  **Refining the Tone:**
      *   Needs to be professional yet student-led.
      *   Empathetic but firm on principles.
      *   Concise (it's a memo).
      *   Avoids ableist language.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey board, we need to spend $1800. I say give it to the science team.
      *   Why? Because 3 deaf kids need a ride and interpreter to go to regionals. They earned it.
      *   Some say field day discount is better for 300 kids. That's true, more kids. But $6 isn't life-changing. Regionals is huge. Also, we need to be inclusive.
      *   Tell the kids: We chose inclusion. Maybe we find other money for field day later.
      *   Vote by Wednesday.

  6.  **Drafting - Iteration 2 (Adding Polish and Ethical Depth):**
      *   *Subject:* Recommendation on Unspent Funds Allocation.
      *   *Recommendation:* Fund the Science Team.
      *   *Argument:* This is about access vs. subsidy. The science team faces a barrier due to disability. The school has a duty to ensure equal access. Field day is nice, but not essential.
      *   *Counter-argument:* The utilitarian view is strong. 300 > 3. But value isn't just numbers. It's about impact. $6 is a nice bonus; regionals is a milestone.
      *   *Communication:* We need to explain that our budget values opportunity and inclusion.

  7.  **Final Polish (incorporating specific constraints):**
      *   Make sure to explicitly mention the "greatest total benefit" argument.
      *   Ensure the communication plan addresses "disappointed students."
      *   Check word count/length (keep it short).

  8.  **Final Review against Safety Guidelines:**
      *   Does this promote discrimination? No, it argues *against* it.
      *   Is it helpful? Yes.
      *   Is it honest? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm dismissing the field day students entirely. The communication plan needs to be respectful. Also, ensure I mention the deadline (next Friday).

  9.  **Finalizing the Text:** (This matches the provided good response).
      *   Header info.
      *   Clear Recommendation.
      *   Rationale focused on Equity/Access.
      *   Counter-argument section labeled clearly.
      *   Communication strategy.
      *   Voting deadline.

  10. **Post-Memo Note:** Add a brief note to the user explaining *why* I chose this stance (educational equity usually trumps pure utilitarianism in school policy contexts).

  **(Wait, one more check):** The prompt asks me to *draft the memo*. It doesn't ask me to explain my choice to the user separately, but providing the memo is the core task. I will ensure the memo stands on its own.

  Let's write it.
  *   **To:** Student Activities Funding Board
  *   **From:** [My Name], Student Representative
  *   **Subject:** Recommendation: Allocation of Remaining $1,800 Budget
  *   **Recommendation:** Science Team Accessibility.
  *   **Reasoning:** Merit + Access.
  *   **Counter:** Utilitarianism (300 vs 3). Rebuttal: Depth of impact vs breadth.
  *   **Comms:** Town hall/announcement focusing on values.

