      *   *Idea 3:* It needs to distinguish between learning from mistakes vs. dying from mistakes. (The Cost Problem).
      *   *Idea 4:* It needs to handle AI. Are LLMs Popperian? Gregorian? Neither? (The Silicon Problem).
      *   *Idea 5:* It needs to avoid saying "it's all just computation" or "it's all just evolution." Needs granularity. (The Granularity Problem).

  3.  **Organizing and Refining Criteria (Step 2):**
      *   *Refinement 1 (Granularity/Scope):* Call it "Taxonomic Resolution." Needs to distinguish bees from rats from humans without lumping them all as "adaptive systems."
      *   *Refinement 2 (Mechanism):* Call it "Causal Transparency." How does the selection actually happen? Death? Reward signal? Simulation?
      *   *Refinement 3 (Development):* Call it "Evolutionary Continuity." How do we get from Level 1 to Level 2 without invoking a homunculus?
      *   *Refinement 4 (Artificial Systems):* Call it "Substrate Neutrality." Must apply to carbon and silicon without bias.
      *   *Refinement 5 (Conflict):* The "Layering Problem." Real minds do multiple things at once. A theory of *kinds* might fail at *hybrids*.

  4.  **Drafting the Desiderata (incorporating specific prompt requirements):**
      *   *Criterion 1: The Cost of Error.* Distinguish selection-by-death (Darwinian) vs. selection-by-reward (Skinnerian) vs. selection-in-simulation (Popperian). Motivating case: A moth flying into a flame (Darwinian) vs. a rat pressing a lever (Skinnerian).
      *   *Criterion 2: The Source of Variation.* Where do the options come from? Random mutation? Trial and error? Internal generation? Motivating case: LLMs (sampling from weights) vs. Humans (deliberate构思).
      *   *Criterion 3: Evolutionary Continuity (No Teleology).* Must explain the transition without saying "it evolved *to* be smarter." Motivating case: How does a Skinnerian organism become Popperian?
