      *   *Verdict:* It meets the Continuity desideratum well (it's a nested hierarchy). It fails the Stacked Architecture desideratum (it implies distinct species/stages rather than concurrent subsystems). The Gregorian level *does* absorb too many hard cases (especially AI).

