prompt: |-
  I'm teaching an upper-level undergraduate seminar on social philosophy, and we're spending two weeks on David Lewis's account of convention from his book *Convention: A Philosophical Study* (1969). I'd like to pair the theoretical material with Shirley Jackson's short story "The Lottery" (1948), which I'm assigning as a companion text.

  Lewis argues that conventions are arbitrary but stable regularities that solve recurrent coordination problems: they are self-enforcing because each person has reason to conform given that others do, they could have been otherwise, and they persist through mutual expectation and common knowledge without requiring explicit agreement. Jackson's story depicts a convention — the annual stoning — that seems, on its face, to be maintained through precisely these mechanisms: precedent, mutual expectation, and the sheer inertial weight of "that's how we've always done it." Yet the lottery is a convention that no one can articulate a genuine purpose for, that many participants seem privately uneasy about, and that everyone would presumably be better off abandoning. Old Man Warner's proverb — "Lottery in June, corn be heavy soon" — gestures at a long-forgotten rationale, but the ritual details have eroded over time while the essential violence remains intact.

  I'd like a reading of "The Lottery" through Lewis's theory that takes both seriously and doesn't reduce either to a straw man. Specifically:

  1. Where does the story illustrate Lewis's mechanisms — salience, precedent, common knowledge of mutual expectations — in ways that deepen our understanding of how conventions grip participants? Which scenes or details show Lewisian convention at work?

  2. Where does the story pose genuine problems for Lewis's framework? Can his account explain a convention that persists when the original coordination problem has become opaque to participants, or when the convention is actively harmful and would be rejected if the population could coordinate on an alternative? Does the story suggest that Lewis's picture is too rationalistic — that it misses the way conventions can become ritualized, insulated from the purposes that originally sustained them, and propped up by superstition rather than by mutually recognized interests?

  3. What does the story add to the philosophical debate that Lewis's formal account alone doesn't capture? I want students to see both that Lewis's framework genuinely illuminates the story's logic and that the story forces us to complicate the framework — perhaps by attending to the difference between a convention that is in fact a coordination equilibrium and one that is merely believed to be, or to the role of sanction and fear in maintaining regularities that have ceased to serve anyone's interests.

  I'm not looking for a thematic essay that gestures vaguely at "tradition" or "conformity." I want a reading that engages the specific conceptual architecture of Lewis's account — arbitrariness, coordination equilibria, common knowledge, precedent, salience — and tests it against the specific narrative machinery of Jackson's story: the black box, the slips of paper, the children gathering stones before they fully grasp why, the neighboring village that is talking of giving up the lottery, Old Man Warner's insistence that abandoning it would return them to primitive chaos, and Tessie Hutchinson's protest that the process "wasn't fair" even as she participates in it until the moment it turns against her.
reasoning: |-
  Here's a thinking process that leads to the suggested reading:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level undergraduate seminar on social philosophy.
      *   **Texts:** David Lewis's *Convention* (1969) and Shirley Jackson's "The Lottery" (1948).
      *   **Goal:** A reading that pairs the two seriously, avoiding straw men or vague thematic generalizations ("tradition is bad").
      *   **Specific Tasks:**
          1.  Identify where the story illustrates Lewis's mechanisms (salience, precedent, common knowledge, etc.).
          2.  Identify where the story challenges Lewis's framework (harmful conventions, opaque coordination problems, irrationality/superstition vs. rational interest).
          3.  Determine what the story adds to the philosophical debate (belief vs. fact in equilibria, role of sanction/fear).
      *   **Tone:** Philosophical, rigorous, textually grounded (both Lewis and Jackson).

  2.  **Deconstruct Lewis's *Convention* (Key Concepts):**
      *   **Coordination Problem:** A situation where agents have a common interest in coordinating their actions but multiple ways to do so (e.g., driving on the left vs. right).
      *   **Convention:** A regularity in behavior that is arbitrary (could be otherwise), self-enforcing (everyone conforms because everyone else does), and sustained by common knowledge of mutual expectations.
      *   **Precedent:** Past solutions to coordination problems create expectations for future ones.
      *   **Salience:** Some solutions stand out naturally (focal points).
      *   **Common Knowledge:** Everyone knows $P$, everyone knows that everyone knows $P$, etc.
      *   **Rationality Assumption:** Agents conform because it is in their interest to do so *given* that others conform. It's a Nash Equilibrium.

  3.  **Deconstruct Jackson's "The Lottery" (Key Elements):**
      *   **The Ritual:** Annual stoning of a villager.
      *   **The Artifacts:** Black box (shabby, old), slips of paper, stones.
      *   **The Participants:** Villagers (nervous but compliant), Old Man Warner (traditionalist), Tessie Hutchinson (victim, protests fairness only when targeted).
      *   **The Justification:** "Lottery in June, corn be heavy soon" (agricultural sacrifice).
      *   **The Atmosphere:** Casual violence, social pressure, fear of change (neighboring villages).

  4.  **Drafting Section 1: Lewisian Mechanisms in the Story (The Fit):**
      *   *Regularity:* It happens every year, same date, same place.
      *   *Arbitrariness:* The specific date (June 27th), the specific box (even though it's falling apart, they won't replace it), the specific method (drawing slips). It *could* be different (as evidenced by other villages).
      *   *Common Knowledge/Mutual Expectation:* Everyone knows everyone else will show up. The children gathering stones is a key detail—they are learning the expectation before understanding the reason.
      *   *Precedent:* "Always been done." The shabby box is a relic of precedent.
      *   *Salience:* The black box is the focal point. The date is salient.
      *   *Self-Enforcement:* People participate because others participate. If you opt out, you stand out (social cost).
      *   *Key Scene:* The gathering. The nervous laughter. The way they avoid looking at the box. This shows the *expectation* of the event governing behavior before the event concludes.

  5.  **Drafting Section 2: Problems for Lewis's Framework (The Friction):**
      *   *Coordination Problem?* Lewis assumes a *common interest* in coordinating. Do the villagers have a common interest in stoning one of them?
          *   *Lewisian Defense:* Maybe they think they do (crop yield).
          *   *Jacksonian Challenge:* The rationale is forgotten ("corn be heavy soon" is a rhyme, not a belief). Warner says other villages are "pack of crazy fools" for quitting, implying *their* village is rational, but the text suggests the fear is of chaos, not starvation.
      *   *Rationality/Interest:* Lewis assumes agents conform because it maximizes utility *given* others conform. In "The Lottery," conforming means risking death.
          *   *The Equilibrium:* It's not a coordination equilibrium (where $A$ and $B$ both want to match); it's a Prisoner's Dilemma or Assurance Game gone wrong, enforced by threat.
          *   *Harm:* Lewis focuses on conventions that solve problems (traffic, phone calls). He doesn't focus heavily on *malignant* conventions where the equilibrium is Pareto-inferior (everyone would be better off if *no one* did it).
      *   *Common Knowledge of Purpose:* Lewis requires common knowledge of the *preferences* leading to the convention. Here, the preferences are obscured by superstition and fear.
      *   *Tessie's Protest:* "It wasn't fair." She accepts the convention until she loses. This highlights that the "agreement" is hypothetical, not actual.

  6.  **Drafting Section 3: What the Story Adds (Philosophical Complications):**
      *   *Belief vs. Fact:* Lewis talks about conventions as solutions. Jackson shows conventions as *believed* solutions that might be delusions. The "equilibrium" exists in the minds of the villagers (fear of crop failure/chaos) but not necessarily in reality.
      *   *Sanction and Fear:* Lewis emphasizes *reasons to conform* based on coordination. Jackson emphasizes *coercion*. The stones aren't just tools; they are weapons of sanction against the deviant (the "winner") and implicitly against those who might refuse to throw.
      *   *The "Arbitrary" Nature:* Lewis says conventions are arbitrary (R vs. L driving). Jackson shows arbitrariness can be deadly. The *content* of the convention matters morally, even if the *structure* is conventional.
      *   *Inertia:* Lewis talks about precedent. Jackson shows precedent becoming *ritual*. The box is splintered; they won't change it. This is "path dependence" taken to a morbid extreme.
      *   *Common Knowledge of Complicity:* Everyone knows everyone is guilty. This shared guilt binds them. It's a "conspiracy of silence."

  7.  **Synthesizing and Refining:**
      *   *Structure:* Introduction (setting the stage), Section 1 (Lewisian Illumination), Section 2 (Lewisian Tensions), Section 3 (Philosophical Contributions), Conclusion (Pedagogical takeaway).
      *   *Tone Check:* Ensure I'm not just saying "Lewis is rational, Jackson is irrational." I need to show how Lewis's *tools* explain the *stability* of the irrationality.
      *   *Specific Details:* Make sure to mention the black box, the stones, Old Man Warner, Tessie, the neighboring villages.
      *   *Lewis Nuance:* Acknowledge that Lewis does discuss "bad" conventions, but his focus is on the *logic* of convention, not the *ethics*. Jackson forces the ethics back in.
      *   *Key Insight:* The Lottery is a *coordination equilibrium* only if we accept the villagers' superstitious beliefs as their utility function. If we view it objectively, it's a *failed* coordination problem maintained by fear. This distinction is crucial for students.

  8.  **Final Review against Prompt:**
      *   Did I address salience/precedent/common knowledge? Yes.
      *   Did I address the opacity/harm/rationality problem? Yes.
      *   Did I address what the story adds (sanction, belief vs. fact)? Yes.
      *   Is it specific to the texts? Yes.

  9.  **Final Polish:** (Self-Correction during drafting) *Wait, I need to be careful not to say Lewis ignores harmful conventions entirely. He acknowledges they exist but focuses on the structural definition. I should frame it as Jackson testing the limits of the "common interest" condition.* *Also, make sure to highlight Tessie's shift from participant to victim as a shift in her perception of the "fairness" of the convention.*

  10. **Generate Output.** (Proceed to write the response based on these thoughts.)
answer: |-
  This is a sophisticated pairing that promises to generate significant friction in the best possible way. Lewis provides the structural anatomy of social regularities, while Jackson provides a pathological case study that tests the limits of that anatomy.

  Here is a reading of "The Lottery" through the conceptual architecture of *Convention*, designed for your seminar.

  ### 1. The Lewisian Illumination: How the Convention Grips
  Lewis defines a convention as a regularity in behavior that is arbitrary, self-enforcing, and sustained by a system of preferences and expectations. "The Lottery" is a masterclass in the *mechanics* of such a regularity, even if the *content* is horrific.

  **Precedent and the Weight of History**
  For Lewis, precedent is the primary engine of convention. We drive on the right because we drove on the right yesterday, and we expect others to do the same. In Jackson's story, precedent is the only justification offered. The black box is the physical embodiment of Lewisian precedent. It is "shabby," "splintered," and no longer even the original box, yet the villagers refuse to replace it.
  *   **Textual Detail:** Mr. Summers speaks of making a new box, but "no one liked to upset even as much tradition as was represented by the black box."
  *   **Lewisian Reading:** This illustrates the *arbitrariness* of convention. The specific box does not matter functionally (any container could hold the paper), but it matters conventionally. To change the box is to disrupt the salience of the focal point. The stability of the ritual relies on the continuity of the signal.

  **Common Knowledge and Mutual Expectations**
  Lewis argues that conventions require common knowledge: I know you will conform, you know I know, and so on. This creates a self-fulfilling prophecy of compliance.
  *   **Textual Detail:** The children gathering stones at the beginning of the story is the most chilling example of Lewisian socialization. Bobby Martin stuffs his pockets with stones; the other boys soon follow. They do not yet understand the *purpose* of the lottery, but they understand the *expectation*. They know that stones are required for the conclusion of the event.
  *   **Lewisian Reading:** This shows how conventions are transmitted intergenerationally not through explicit instruction of rationale, but through the mimicry of behavior required by mutual expectation. The children are learning the "rules of the game" before they understand the "payoff."

  **Salience and Focal Points**
  Lewis uses Schelling's concept of salience: in the absence of communication, agents converge on the most prominent solution.
  *   **Textual Detail:** The date (June 27th) and the time (10 AM) function as salient focal points. The villagers assemble precisely then. Even the neighboring villages, though some are talking of quitting, still coordinate on the same timeframe.
  *   **Lewisian Reading:** The ritual creates a temporal focal point that organizes the community's year. Old Man Warner's dismissal of the younger villages ("Pack of crazy fools") reinforces the salience of *their* specific tradition. To deviate is to lose the focal point, which Warner equates with social collapse ("eating chickweed and acorns").

  ### 2. The Lewisian Tension: Rationality, Harm, and Opacity
  This is where the seminar should pivot from application to critique. Lewis's account is fundamentally rationalistic: conventions solve *coordination problems* where agents have a *common interest* in coordinating. "The Lottery" exposes the fragility of these conditions.

  **The "Common Interest" Condition**
  Lewis assumes that in a coordination equilibrium, everyone is better off conforming *given* that others conform (e.g., we both prefer driving on the same side, regardless of which side).
  *   **The Problem:** In "The Lottery," the equilibrium is Pareto-inferior. Everyone would objectively be better off if *no one* coordinated on stoning a neighbor. The "common interest" exists only within the superstitious belief system (corn will grow), which the text suggests is opaque or forgotten.
  *   **Textual Detail:** When asked about the original rationale, no one can cite it specifically other than Warner's rhyme. The "coordination problem" (how to ensure harvest) has become decoupled from the "solution" (stoning).
  *   **Critique:** Lewis's framework struggles to explain why a convention persists when the *actual* coordination problem it solved no longer exists, or when the convention creates a new, worse problem (fear of death). Jackson suggests that conventions can outlive their utility functions and become self-perpetuating machines of harm. Lewis explains *how* they stick (expectations); Jackson asks *why* we don't break them when they hurt us.

  **Rationality vs. Ritualized Fear**
  Lewis models agents as rational maximizers. If I conform, it is because I prefer the outcome of conformity over the outcome of deviation *given* your behavior.
  *   **The Problem:** Tessie Hutchinson arrives late, chatting casually, fully participating in the logic of the lottery until she is the "winner." Her protest—"It wasn't fair"—is not a moral objection to the lottery itself, but a procedural objection to her specific loss.
  *   **Critique:** This reveals a dark side of Lewisian rationality. The villagers are acting "rationally" within the constraints of the convention. To opt out is to invite social sanction or be blamed for the harvest failure. Jackson suggests that what Lewis calls "reasons to conform" can easily mutate into *coercion*. The "self-enforcing" nature of the convention is maintained not just by mutual benefit, but by the threat of violence against the deviant (the victim) and the social ostracization of the dissenter.

  **The Opacity of the Equilibrium**
  Lewis requires common knowledge of the *preferences* that sustain the convention.
  *   **The Problem:** The villagers seem unsure of their own preferences. They are nervous; they hesitate; they laugh nervously. There is a gap between their public conformity and private unease.
  *   **Critique:** Lewis's model assumes a transparency of intention that Jackson denies. The story suggests that conventions can be maintained through *pluralistic ignorance* (everyone privately dislikes it but believes everyone else supports it). If Lewis's "common knowledge" is disrupted by private doubt, the convention should theoretically collapse. That it doesn't suggests Lewis underestimates the power of inertia and the fear of being the *first* to deviate.

  ### 3. What the Story Adds: Complicating the Framework
  Assigning Jackson alongside Lewis forces students to move from the *logic* of convention to the *ethics* and *psychology* of convention.

  **Coordination Equilibrium vs. Believed Equilibrium**
  Lewis analyzes conventions as they *are*. Jackson asks us to analyze them as they are *believed to be*.
  *   **Philosophical Addition:** The Lottery is a coordination equilibrium only if we accept the villagers' utility functions (fear of crop failure > fear of death). If we view the utility functions objectively (life > corn), it is not an equilibrium; it is a trap.
  *   **Seminar Point:** This distinguishes between a *functional* convention (traffic laws) and a *dogmatic* convention (ritual sacrifice). Lewis's framework explains the stability of both, but Jackson forces us to ask if the *definition* of convention should include a condition of transparency regarding the common good.

  **The Role of Sanction in "Self-Enforcement"**
  Lewis emphasizes that conventions are self-enforcing because it is in my interest to follow them. Jackson shows that "interest" is often manufactured by the threat of sanction.
  *   **Philosophical Addition:** The stones are not just tools for the ritual; they are the mechanism of sanction. By making every villager a participant in the killing (including the children), the convention ensures complicity.
  *   **Seminar Point:** Lewis discusses sanctions in the context of ensuring compliance, but usually as a secondary feature. Jackson makes sanction the *primary* feature. The convention persists not because everyone wants to stone someone, but because everyone knows they might be stoned if they break the social contract. This complicates Lewis's idea of "common interest." Is it a common interest if it is maintained by the threat of death?

  **Arbitrariness and Moral Luck**
  Lewis emphasizes the *arbitrariness* of convention (we could drive on the left). Jackson weaponizes this arbitrariness.
  *   **Philosophical Addition:** In traffic conventions, arbitrariness is benign. In "The Lottery," arbitrariness is lethal. Tessie's death is purely random (the draw of the slip).
  *   **Seminar Point:** This challenges the normative neutrality of Lewis's account. Lewis is descriptive; he doesn't judge the convention. Jackson forces a normative judgment: a convention that relies on pure chance to distribute severe harm cannot be justified merely by its stability or its status as a coordination equilibrium. It highlights the difference between a convention that *solves* a conflict and one that *manages* a conflict through violence.

  ### Pedagogical Strategy: The "Tessie Test"
  To bring this home in class, I recommend focusing on Tessie Hutchinson's shift.
  1.  **Phase 1 (Arrival):** Tessie is a Lewisian conformist. She accepts the precedent, the salience, and the mutual expectations. She is part of the equilibrium.
  2.  **Phase 2 (Selection):** Once the equilibrium turns against her, she appeals to "fairness."
  3.  **The Philosophical Question:** Is Tessie appealing to a higher moral law, or is she appealing to a *different convention* (that the lottery should be fair)?
      *   If the latter, she is still trapped within Lewis's framework. She isn't saying "Stop the lottery"; she is saying "Redraw the slips." She accepts the *system* but disputes the *outcome*.
      *   This suggests that Lewis's account is robust enough to explain why revolutions are rare: even victims often argue for procedural correctness within the existing convention rather than abandoning the convention itself.

  ### Summary for the Syllabus
  **Lewis provides the skeleton; Jackson provides the flesh and blood.**
  *   **Lewis** explains *why* the villagers cannot easily stop: the cost of deviation is high, the precedent is deep, and the mutual expectations are locked in.
  *   **Jackson** explains *what it feels like* to be inside a malignant convention: the dissonance between nervous laughter and lethal intent, the erosion of rationale, and the way "common knowledge" can mask collective trauma.

  By pairing them, you avoid the trap of treating Lewis as too dry or Jackson as too allegorical. Instead, you show that the dry logic of coordination is exactly what allows the allegory of violence to function so efficiently. The horror of "The Lottery" is not that the villagers are irrational; it is that they are perfectly rational within the confines of a terrible convention.
