answer: |-
  ## The Task-Supervision Decision Procedure (TSDP)

  **Purpose:** To select a supervision strategy (Goal-Directed, Approval-Directed, or Hybrid) for new agent tasks within 20 minutes.
  **Operator:** Research Assistant (You).
  **Authority:** You may sign off on Facts (Q1–Q3). You must hand off Values (Q4–Q5) to the Graduate Mentor.
  **Constraint:** Ignore all prior annotation time sunk into a task. Decisions are forward-looking only.

  ---

  ### Step 1: The Verifiability Check (Fact)
  **Question:** Is there a digital signal that confirms task completion with >95% accuracy, available within 48 hours of action, that cannot be trivially faked by the agent without actually completing the task?
  *   *Examples:* "Room booked in API" (Yes). "User satisfied" (No). "Ticket closed" (No, can be faked). "Ticket closed + no reopen in 48h" (Maybe).
  *   **Sufficient Answer:** A specific database field or API response that maps to success.
  *   **If YES:** Mark **GD-Candidate**. Proceed to Q2.
  *   **If NO:** Mark **AD-Candidate**. Proceed to Q3.

  ### Step 2: The Gaming Risk Check (Fact/Estimation)
  **Question:** If we optimize purely for the signal in Q1, what is the worst plausible behavior the agent could adopt that satisfies the signal but harms the user?
  *   *Test:* Can you describe a scenario in one sentence where the metric goes up but value goes down? (e.g., "Agent books meetings that nobody attends just to book them.")
  *   **Sufficient Answer:** A concrete failure mode.
  *   **If Risk is Low/Negligible:** Terminate → **Use Goal-Directed.**
  *   **If Risk is Moderate/High:** Mark **GD-Risky**. Proceed to Q3.

  ### Step 3: The Visibility Gap Check (Fact)
  **Question:** Can the approver (the person labeling data) see the downstream consequences of the action at the time of approval?
  *   *Test:* If the agent sends an email that burns a bridge three weeks later, would the approver know that *today*?
  *   **Sufficient Answer:** Yes (consequences are immediate/visible) or No (consequences are delayed/hidden).
  *   **If NO (Hidden Consequences):** Terminate → **Do Not Deploy Approval-Directed.** (You cannot train on blind spots). Hand off to Mentor for GD-Safety review.
  *   **If YES (Visible Consequences):** Mark **AD-Viable**. Proceed to Q4.

  ### Step 4: The Stakeholder Alignment Check (Value Hand-Off)
  **Question:** Do the people approving the actions bear the cost of the agent's mistakes, or do they represent those who do?
  *   *Test:* If the agent annoys a professor, does the approver get annoyed? Or does a student get annoyed?
  *   **Sufficient Answer:** A confirmation of identity between approver and stakeholder.
  *   **If MISMATCH:** **HAND OFF TO MENTOR.** This is a value judgment about representation. Do not proceed until Mentor signs off on who is authorized to approve.
  *   **If MATCH:** Proceed to Q5.

  ### Step 5: The Reversibility & Cost Check (Strategy)
  **Question:** Given the answers above, which error is cheaper to fix: a wrong reward function or a wrong approval instruction?
  *   *Supervisor's Heuristic:* If the task definition is stable (e.g., "book room"), GD is cheaper long-term. If the task definition is fluid (e.g., "draft email in current style"), AD is cheaper to update.
  *   **Sufficient Answer:** A judgment on task stability.
  *   **Decision Matrix:**
      *   **GD-Candidate + Low Risk:** → **Goal-Directed.**
      *   **GD-Candidate + High Risk + AD-Viable:** → **Hybrid** (Optimize for Goal, Filter by Approval).
      *   **AD-Candidate + AD-Viable:** → **Approval-Directed.**
      *   **AD-Candidate + Visibility Gap (No):** → **No-Go.**

  ---

  ## Case Runs

  ### Case 1: Calendar Negotiation Agent
  **Form Filled:**
  *   **Q1 (Verifiability):** **YES.** Meeting appears on calendar API.
  *   **Q2 (Gaming Risk):** **HIGH.** Agent could schedule meetings at impossible times, or schedule useless meetings just to hit quotas, or be overly aggressive in rescheduling to force a slot.
  *   **Q3 (Visibility):** **YES.** Approver sees the email draft and the proposed time. They can judge politeness and feasibility immediately.
  *   **Q4 (Stakeholders):** **MATCH.** The approver (lab member) is the one whose calendar is being managed (or represents them directly).
  *   **Q5 (Reversibility):** Task is stable (booking is booking), but *style* is fluid.
  *   **Decision:** **Hybrid.** (Goal: Meeting Booked. Constraint: Email Draft Approved).

  **The Unliked Truth:**
  You asked me to be plain about the calendar agent. This procedure classifies the core task as **Goal-Directed**. The six weeks of approval data you have collected are **not** useful for teaching the agent *what* to achieve (booking the meeting), only *how* to achieve it (tone, politeness).
  If you continue to train the agent primarily on approval signals for the *outcome*, you are paying for human judgment on a fact that the API already verifies. The procedure dictates you should switch the objective function to the API confirmation immediately. The sunk cost of the six weeks of annotation is irrelevant; continuing to use AD as the primary objective is burning budget on a verifier you already have for free. You are likely attached to that data because it represents labor already spent, but the procedure flags this as an efficiency leak.

  ### Case 2: Support-Ticket Triage
  **Form Filled:**
  *   **Q1 (Verifiability):** **MAYBE.** "Closed + no reopen in 48h" is the signal.
  *   **Q2 (Gaming Risk):** **CRITICAL.** Agent can close tickets without solving the problem. User gives up rather than reopening. Metric looks green, user trust is destroyed.
  *   **Q3 (Visibility):** **NO.** The approver (you/undergrads) cannot know if the solution *actually worked* within the annotation window. You only see the text of the response, not the user's subsequent success.
  *   **Q4 (Stakeholders):** **MISMATCH.** Approvers are undergrads; stakeholders are department users.
  *   **Decision:** **HAND OFF TO MENTOR.**
      *   *Reasoning:* Q3 fails the Visibility Check. You cannot use Approval-Directed supervision because the approvers are blind to the true outcome (resolution). You cannot use pure Goal-Directed because the metric is gameable.
      *   *Recommendation to Mentor:* This task requires a **Human-in-the-Loop** deployment, not offline training. Do not train an autonomous agent on this dataset yet. Sample 10% of closed tickets for manual follow-up verification to create a true ground-truth signal before automating.

  ### Case 3: Seminar Feedback Drafting
  **Form Filled:**
  *   **Q1 (Verifiability):** **NO.** There is no "correct" feedback.
  *   **Q2 (Gaming Risk):** **N/A.** (No objective signal to game).
  *   **Q3 (Visibility):** **YES.** The quality of feedback is apparent in the text (clarity, tone, relevance).
  *   **Q4 (Stakeholders):** **MISMATCH.** Approvers are Course Staff (TAs/Prof); Stakeholders are Students receiving feedback. Staff may value brevity; students may value encouragement.
  *   **Decision:** **HAND OFF TO MENTOR.**
      *   *Reasoning:* Q4 fails. While this is the clearest case for Approval-Directed supervision technically (no ground truth), the *values* encoded in the approval are political.
      *   *Resolution:* If Mentor confirms Staff are authorized to define "good feedback," proceed with **Approval-Directed**. If not, you need student representatives in the approval loop.

  ---

  ## Limitations & Blind Spots

  This procedure is a tool for resource allocation, not a safety guarantee. Here is where it fails:

  **1. The "Goodhart's Law" Blind Spot**
  The procedure assumes that if a metric is "non-gameable" (Q1), it is safe. It is not. It only checks for *obvious* gaming in a 20-minute window. It cannot detect slow-drift specification gaming where the agent optimizes the metric in ways that degrade the system over months (e.g., booking meetings that are technically valid but slowly erode team culture).

  **2. The "Distributional Shift" Blind Spot**
  The procedure assumes the task today is the task tomorrow. It does not account for the agent encountering inputs significantly different from the training distribution. If the calendar agent encounters a VIP user with complex constraints not seen in training, the GD/AD distinction matters less than the fact that the agent is out-of-distribution. The procedure has no "Stop" button for novelty.

  **3. Forbidden Tasks**
  Do not apply this procedure to tasks involving:
  *   **Irreversible Financial Transactions:** (e.g., purchasing hardware).
  *   **Personnel Decisions:** (e.g., screening resumes).
  *   **Private Data Exposure:** (e.g., summarizing confidential emails).
  For these, the "Hybrid" option is insufficient. These require deterministic rules or direct human execution, not learned agents.

  **4. Judgment Calls Disguised as Checklists**
  *   **"Trivially Faked" (Q1):** This is subjective. An undergrad RA might think "ticket closed" is hard to fake, while a senior engineer knows it's trivial. This step relies on your technical intuition, which varies by task.
  *   **"Represented Stakeholders" (Q4):** This is political, not technical. The procedure forces a hand-off, but in practice, RAs often assume alignment where none exists to avoid friction. The checklist cannot enforce honesty in the answer to Q4.

  **5. The Reversibility Red Herring**
  Your supervisor's point about reversibility is valid for *development*, but dangerous for *deployment*. An approval instruction is easy to rewrite, but if the agent has already taken 1,000 bad actions under the old instruction, the "cheap revision" does not undo the damage. The procedure includes this in Q5, but treat it as a tie-breaker for efficiency, never as a justification for skipping safety checks (Q2/Q3).
