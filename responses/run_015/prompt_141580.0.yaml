  2.  **Deconstruct the Theoretical Framework:**
      *   *Goal-Directed (GD):* Good when outcomes are easily, cheaply, and robustly verifiable. Bad when specification gaming is likely or outcomes are hard to measure.
      *   *Approval-Directed (AD):* Good when outcomes are hard to define but human judgment is reliable. Bad when approvers have blind spots, myopia, or when the "style" of approval diverges from actual utility. Expensive in human time.
      *   *Hybrid:* Outcome as objective, Approval as constraint (or vice versa).
      *   *Reversibility:* Supervisor's point. AD instructions are easier to tweak than GD reward functions/verifiers. Valid for *iterative* development, less valid for *deployment* safety.
      *   *Stakeholders:* Who bears the cost of error vs. who approves?

  3.  **Drafting the Decision Procedure (The "Form"):**
      *   *Goal:* Needs to be actionable within 20 minutes by an undergrad RA.
      *   *Structure:* Flowchart style but text-based.
