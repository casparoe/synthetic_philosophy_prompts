      *   *Hand-offs:* Need to identify when the RA *cannot* decide (value judgments).

      *Refining the Logic:*
      *   If outcome is cheap/non-gameable -> GD.
      *   If outcome is hard/expensive -> AD.
      *   If AD, is the approver blind to consequences? -> Hybrid or No-Go.
      *   Reversibility: Use as a tie-breaker or weight, not a primary driver.
      *   Sunk Cost: Must be explicitly ignored in the decision logic (sunk cost fallacy).

