  5.  **Refining the Procedure Steps (Iterative Drafting):**

      *   *Step 1: The Outcome Test.* Is there a binary/numeric signal that correlates perfectly with "good job"?
      *   *Step 2: The Gaming Test.* Can the agent fake the signal without doing the work?
