answer: |-
  This is a fantastic contradiction to hang a character on. It's specific, technical, but points directly to a philosophical fracture in how we imagine "the people."

  Here is the reconstruction of the implicit philosophy, the institutional consequences, and how to weave it into the scene without triggering your editor's "politics lecture" alarm.

  ### 1. The Implicit Philosophy: "The Two Bodies of the Voter"

  For this asymmetry to make sense, the system must presuppose that the voter is not a single sovereign entity, but two distinct legal persons with different rights.

  *   **Person A (The Citizen):** Has a positive right to demand public goods (schools, roads, prisons). Since these are "benefits," a simple majority (50% + 1) is enough to legitimize them. This treats spending as an expression of *desire*.
  *   **Person B (The Taxpayer):** Has a negative right to property protection. Since taxation is a "taking" (a violation of natural property rights), it requires a supermajority (2/3) to overcome the default right of ownership. This treats taxation as an expression of *coercion*.

  **The Theory:** This isn't **Popular Sovereignty** (where the people are the state); it is **Lockean Constraint** (where the people are property owners hiring a night watchman).
  *   **The Logic:** "We, the majority, can tell the watchman what to protect (spending), but we, the minority, can stop you from paying him too much (taxation)."
  *   **The Contradiction:** In a direct democracy, a spending mandate *is* a tax mandate. If you mandate $10B for schools without raising revenue, you are implicitly taxing the general fund, which means you are reallocating money taken from someone else. The system pretends spending is "free" and taxes are "pain," ignoring that spending *is* the application of tax revenue.

  **What to call it in her head:** *Fiscal Schizophrenia.* Or *Asymmetric Sovereignty.*

  ### 2. Does the Practice Need This Theory?

  **No.** The practice survives on **Cognitive Dissonance**, not philosophy.

  *   **The Pragmatic Reality:** The system doesn't need a coherent theory of will; it needs a satisfied electorate. Voters want the *feeling* of agency (spending) without the *feeling* of loss (taxation).
  *   **If you remove the theory:** If you admit that spending *is* taxation, the whole ballot box becomes a paradox. The system survives because voters treat propositions like a menu at a restaurant where someone else pays the bill.
  *   **Alternative Theory:** You could view it as a **Minority Veto System**. It's not democracy; it's a check against majoritarian tyranny. But that admits that "the will of the people" is dangerous when it touches the wallet.

  ### 3. What Breaks if You Symmetrize Direct Democracy?

  If your character asks, "What if we treated both sides the same?" here is where the institution breaks:

  *   **Scenario A: Majority for Both (50% + 1)**
      *   **The Break:** **Majoritarian Predation.** A coalition of 51% could vote to tax the 49% into oblivion to fund their specific projects. This destroys the incentive for the minority to participate or remain in the jurisdiction. It turns the budget into a weapon.
  *   **Scenario B: Supermajority for Both (2/3)**
      *   **The Break:** **Status Quo Atrophy.** Nothing changes. Any 34% of voters can block any new initiative, whether it's a tax or a school program. The state loses the ability to react to crises.
  *   **The Real Break: The Linkage**
      *   Representative democracy works because the *same body* raises and spends. They feel the pain of the tax when they authorize the spend.
      *   Direct democracy **severs the nerve**. You can vote "Yes" on Prop A (Spend) and "Yes" on Prop B (No Tax) in the same election.
      *   **Result:** A **Zombie Budget.** The government is legally mandated to spend money it is legally forbidden to collect. It must then slash *discretionary* spending (parks, maintenance) to pay for the *mandated* spending (prisons, schools). The system doesn't collapse; it just cannibalizes itself.

  ### 4. Scene & Dialogue Strategy (For the Editor)

  To keep the editor happy, avoid abstract nouns ("sovereignty," "coercion," "libertarianism"). Anchor the philosophy in **physical metaphors** and **character observation**. She shouldn't sound like a professor; she should sound like someone who has found a glitch in the matrix.

  **Key Metaphors:**
  *   **The Vending Machine:** "It's a vending machine that accepts orders but rejects coins."
  *   **The Menu:** "We're ordering off the menu, but we've glued the wallet to the table."
  *   **The Ghost:** "There's a ghost in the budget. The money is supposed to appear by magic."

  **Drafting the Beat:**

  > She tapped the glass of the tablet, right on the pie chart. "Look at the geometry of it. It's not a circle. It's a ratchet."
  >
  > "A ratchet?"
  >
  > "Fifty-one percent can force you to build a school," she said. "But sixty-seven percent is required to make you pay for the chalk. Do you know what that implies?"
  >
  > "That people are cheap?"
  >
  > "That the system thinks we're two different people." She leaned back, the chair creaking. "When I vote to spend, I'm a Citizen. I have rights. I have a voice. When I vote to tax, I'm a Taxpayer. I have property. I have defenses."
  >
  > "And those two people don't talk to each other."
  >
  > "They're enemies. The system is built on the idea that spending is natural, like breathing. But taxation is violence. Like holding a knife to someone's throat." She tapped the screen again. "But if I mandate the spending, I'm already holding the knife. I'm just pretending I'm not."
  >
  > "So what happens?"
  >
  > "The math breaks. You get mandates without revenue. You get a government that's legally required to do things it's legally forbidden to fund. It doesn't crash. It just... rots. It starts eating its own legs to keep the heart beating."

  ### 5. Why This Works for Fiction

  *   **It reveals character:** She sees structures, not just events. She looks for the "source code" of society.
  *   **It creates tension:** The "rotting" government is a ticking clock for your plot.
  *   **It avoids preaching:** She isn't saying "This is bad." She's saying "This is inconsistent." It's an observation of mechanics, not morality.

  **The Takeaway for her arc:**
  She realizes that California isn't governed by **Will**, but by **Friction**. The policy isn't what anyone wants; it's what remains after the spending mandates and tax restrictions grind against each other. The "People" don't rule; the *gridlock* rules.
