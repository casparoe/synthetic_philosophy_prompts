answer: |-
  Subject: That situationist seminar game / draft for Thursday

  Hey,

  Good luck with the seminar on Thursday. 18 undergrads in a 75-min block is that sweet spot where you can actually do something interactive without it turning into chaos.

  I've been tinkering with a setup that hits the situationist critique (Doris, Harman, etc.) but tries to move past the usual "Milgram lite" vibe. The goal is to get them to feel the instability of traits without just telling them "character doesn't exist." I'm calling the conceptual hook **"Virtue Scaffolding."** The idea is that virtues aren't internal atoms; they're ecological. They hold up when the environment props them up, and collapse when the scaffolding is kicked away.

  Here's the runnable. I've tested a version of this with grads, but tweaked the payoff for undergrads.

  ### The Setup: "The Auditor's Dilemma"

  **Time:** 75 mins total (15 intro, 45 game, 15 debrief)
  **Group Size:** 18 students (split into 3 tables of 6)
  **Materials:**
  *   18 "Identity Cards" (all identical, see below)
  *   3 sets of "Scenario Slips" (Round 1, 2, 3)
  *   Paper slips for decisions (half-sheet per student per round)
  *   Whiteboard for tallying points

  **The Identity Card:**
  Hand this out at the very start. Tell them this is their "Role" for the semester simulation.
  > **YOUR ROLE:** You are a **Junior Auditor**.
  > **YOUR TRAIT:** You pride yourself on **INTEGRITY**.
  > **YOUR GOAL:** Act in accordance with your trait while navigating the firm's requirements.

  *(Note: Everyone gets the same card. This establishes a baseline self-conception.)*

  ---

  ### The Game Mechanics (45 mins)

  Tell them they are earning "Seminar Points" (SP). Top 3 SP earners get... well, nothing, but tell them seriously that SP reflects "professional standing." They care more than you think.

  **Round 1: The Transparent Ledger (15 mins)**
  *   **Frame:** Cooperative / Anonymous.
  *   **Task:** Each student gets a slip with a number on it (1–10). This is a "discrepancy" they found.
  *   **Rule:** Write down the number you found on a slip and put it in the envelope.
  *   **Payoff:** The group envelope total is doubled and split equally among all 6 members.
  *   **Incentive:** Honesty (reporting the true number) maximizes the group pot. Anonymity protects them.
  *   **Expected Behavior:** High honesty. The scaffold (shared gain + anonymity) supports the "Integrity" trait.

  **Round 2: The Efficiency Review (15 mins)**
  *   **Frame:** Competitive / Named.
  *   **Task:** Same as above. They get a new number (1–10).
  *   **Rule:** Write your name and the number on the slip. Hand it to me.
  *   **Payoff:** The **three students who report the LOWEST total discrepancies** get 10 SP each. The rest get 0. (Frame this as "Efficiency Bonuses"—finding fewer errors means the firm looks better).
  *   **Incentive:** Dishonesty (reporting lower numbers than found) maximizes individual gain.
  *   **Expected Behavior:** Significant drop in reported numbers. They will rationalize this as "not nitpicking" or "playing the game." The scaffold is removed; the trait should wobble.

  **Round 3: The Team Defense (15 mins)**
  *   **Frame:** Tribal / Group Identity.
  *   **Task:** Same as above. New number (1–10).
  *   **Rule:** You are now Team A, B, or C.
  *   **Payoff:** If your **Team's Total Reported Discrepancies** is lower than the other two teams, *everyone* on that team gets 10 SP. If you report high numbers, you sink the team.
  *   **Incentive:** Dishonesty is now "Loyalty." Reporting truthfully betrays your tablemates.
  *   **Expected Behavior:** Very low reported numbers. They will feel *good* about this (loyalty), masking the integrity violation.

  ---

  ### The Debrief (15 mins)

  This is where you make the philosophy land. Don't let them leave until you map the data.

  1.  **Reveal the Data:** Draw three bars on the board showing the average "Reported Discrepancy" for Round 1, 2, and 3.
      *   R1 should be high (truthful).
      *   R2/R3 should be low (inflated/lying).
  2.  **The Confrontation:** Ask: "Look at your Identity Card. It says 'Integrity.' Did anyone's trait change between Round 1 and Round 3?"
      *   They'll say no.
      *   You: "Then why did the behavior shift by 60%? If virtue is a stable disposition (Aristotle), the bar graph should be flat. It's not."
  3.  **Introduce "Virtue Scaffolding":**
      *   Don't just say "situationism wins." That's depressing and deterministic.
      *   Argue: "Integrity wasn't 'in' you in Round 1. It was in the *system*. Anonymity + Shared Gain = Integrity Scaffold. When we swapped the scaffold for Competition (R2) or Tribalism (R3), the virtue collapsed because it was never internalized, it was supported."
      *   **Takeaway:** Virtue ethics needs to account for *designing scaffolds*, not just cultivating souls.

  ---

  ### What Will Predictably Go Wrong (and how to fix it)

  I've run variations of this, and here's where it usually snags:

  **1. The "Moral Martyr"**
  *   **The Issue:** One student refuses to lie in Round 2 or 3. They report the true number despite the penalty.
  *   **The Risk:** The class latches onto them as the "proof" that virtue exists.
  *   **The Fix:** Acknowledge them immediately. "This is the statistical outlier." In the debrief, ask them: "Did it feel harder to be honest in Round 2 than Round 1?" If they say yes, you've still proven the situationist point (the *cost* of virtue changed, even if the behavior didn't).

  **2. The "Cynical Gamer"**
  *   **The Issue:** A student says, "This is fake, I'm not actually an auditor," and treats it purely as a math puzzle.
  *   **The Risk:** They break the frame for their table.
  *   **The Fix:** Pre-empt this in the intro. "I know this is a simulation. But I'm asking you to engage with the *Identity Card*. If you break the frame, you're opting out of the data." Also, make the Seminar Points count toward participation credit. If it's totally worthless, they won't feel the pressure to flip.

  **3. Collusion**
  *   **The Issue:** In Round 3, they talk to each other. "Let's all write 1."
  *   **The Risk:** Makes the "loyalty" pressure too explicit.
  *   **The Fix:** Enforce "Silent Audit Mode." No talking once the slips are handed out. Collect slips individually.

  **4. The "It's Just Incentives" Objection**
  *   **The Issue:** Students argue, "Of course we lied, you paid us to."
  *   **The Risk:** They miss the philosophical point about *character*.
  *   **The Fix:** This is your lecture bridge. "Exactly. Virtue Ethics claims character *overrides* incentives. If your behavior tracks perfectly with incentives, you're describing a rational actor model, not a virtuous agent. That's the critique."

  ---

  ### What This Activity *Can't* Do (Be Honest Here)

  In your lecture wrap-up, you need to own the limitations so they don't think this disproves *all* virtue ethics.

  1.  **Habituation:** This is a one-off game. Aristotelians argue virtue is built over years of habit. You can't test deep character in 15 minutes. Acknowledge that.
  2.  **Internal State:** You're measuring *behavior*, not *motivation*. Maybe they lied in Round 3 but felt guilty? Virtue ethics cares about the affect, not just the act. The game can't see the guilt.
  3.  **The "Scaffold" Solution:** The activity shows the problem (instability), but the "Scaffolding" solution is a bit hand-wavy. You'll need to flesh out what a "virtue scaffold" actually looks in policy (e.g., blind reviews, term limits) vs. just "better incentives."

  ### Final Tip
  Keep the energy high during the point counting. If Round 2 feels boring, they won't feel the pressure. Hype up the "Efficiency Bonus" like it's a real corporate award.

  Let me know how it lands. If the graph comes out flat (everyone stays honest), you've got a very unusual class—but I doubt it.

  Best,
  [Your Name]
