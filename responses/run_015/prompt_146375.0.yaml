  9.  **Final Polish:**
      *   Check word count and tone.
      *   Ensure "Virtue Scaffolding" is clearly defined.
      *   Make sure the limitations are honest (game can't capture *habituation*).

  10. **Final Review against constraints:**
      *   18 undergrads? Yes (3 groups of 6).
      *   75 mins? Yes.
      *   Paper/Role cards? Yes.
      *   Payoff scheme? Yes (Points).
      *   Debrief mapping? Yes.
      *   Predictable errors? Yes.
      *   Casual tone? Yes.

  *(Self-Correction on the "Flip"):* If I tell them "Be Honest" on a card, and then the rules say "Lie to win," they know they are violating the card. That's obedience, not situationism.
  *Better approach:* The Card defines their *Self-Concept*. "You are an Honest Person." The Rules define the *Situation*.
  *Round 1:* Honesty is rewarded. (Consistent).
  *Round 2:* Honesty is punished (subtly). "Efficiency" is rewarded. (They rationalize lying as efficiency).
  *Round 3:* Honesty hurts the group. "Loyalty" is rewarded. (They rationalize lying as loyalty).
  *Key:* They must feel justified in the flip. The debrief reveals the inconsistency.
