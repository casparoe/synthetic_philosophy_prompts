      *   **Task:** Audit the recursive-function analogy. Spell out the correspondence (function call, stack frame, crash, patch) in continuous prose. Explain where it breaks (especially the assumption that truth is computable). Evaluate if the coworker's conclusion (it's just a syntax error) survives. Suggest a better analogy (revision theory vibes).
      *   **Format:** Continuous prose only. No headings, no bullet points, no bold, no tables. Like a long email reply.
      *   **Tone/Audience:** Backend engineer, no formal philosophy background, keep jargon light but logic rigorous.

  2.  **Deconstruct the Analogy (Coworker's View):**
      *   *Function Call:* Evaluating the truth value of the sentence.
      *   *Stack Frame:* Each step of evaluation pushing context onto a mental/logical stack.
      *   *Base Case:* A grounded fact (e.g., "Snow is white") that stops recursion.
      *   *No Base Case:* The Liar sentence refers only to itself.
      *   *Crash:* Stack overflow / Contradiction (True implies False, False implies True).
      *   *Patch:* Tarski's hierarchy (Object language vs. Meta-language) prevents self-reference, like type safety or namespacing.

  3.  **Identify the Breaks (User's Intuition & Philosophical Reality):**
