      *   *The "Crash":* In programming, a stack overflow is a resource failure. In logic, the paradox is a consistency failure (True = False). One is engineering, the other is foundational.
      *   *Revision Theory:* Gupta and Belnap. Truth isn't a fixed point found by computation but a revision process. It's more like a steady state in a feedback loop than a crash.
      *   *Hidden Assumption:* That truth *is* a computable property. If truth isn't computable, the recursion analogy fails at step one.

