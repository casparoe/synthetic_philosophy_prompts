      *   They miss the distinction between modeling rights as *outcomes* (social choice) vs. *powers* (game forms). In game forms, individuals have direct control over outcomes within their sphere, which avoids the aggregation problem entirely for those spheres, but requires a meta-agreement on the game form itself (which brings back Alex's point). They also miss the solution of "waiving rights" (Gibbard) or the idea that preferences might be constrained by the rights structure itself (preference adaptation).
