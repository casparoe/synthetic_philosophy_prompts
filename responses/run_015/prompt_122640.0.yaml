answer: |-
  **Exam Question**

  Consider a 'stipulation-proof dispute': two parties agree on all non-ontological facts, accept each other's paraphrases in a neutral vocabulary, and would assent to each other's sentences when read in the other's idiolect. Yet, neither accepts a stipulation to dissolve the disagreement, each insisting the other's vocabulary is misleading for theoretical purposes. 

  Is this dispute merely verbal? In your answer, you must address: (1) whether 'verbal' is a verdict about the dispute's structure or the disputants' activity; (2) whether a fully verbal dispute can still be worth having, and if so, what kind of disagreement it constitutes; and (3) whether applying the verbalness test to the metaontological debate itself generates a vicious regress or a stable fixed point. Conclude by explaining how your answer affects the status of first-order ontology.

  ***

  **Model Answer**

  The stipulation-proof dispute forces us to separate the semantic diagnosis of a disagreement from its pragmatic value. Standard diagnostics, such as the paraphrase test, identify whether a dispute arises from differing usage rules rather than conflicting beliefs about the world. In the stipulation-proof case, these diagnostics confirm the dispute is verbal in origin. However, calling it 'merely verbal' often carries the implicature that the dispute is worthless. We must reject this implicature. 'Verbal' is a verdict about the dispute's structure—specifically, that it lacks a truth-conditional difference given a shared neutral ontology—not a verdict on the utility of the disputants' activity.

  Consequently, a fully verbal dispute can still be worth having, but it changes category from a factual disagreement to a pragmatic negotiation. When both sides refuse stipulation, they are not fighting over what exists; they are fighting over which conceptual framework best serves their theoretical goals. One side might prioritize parsimony, the other expressive power. Neither is factually wrong, but one framework might be more useful for physics, while the other is better for ethics. The disagreement is substantive because the choice of vocabulary has downstream consequences for theory construction, even if the base ontological commitments are intertranslatable. The dispute is not about the world, but about the best map for navigating it. Recognizing this preserves the intensity of the debate without requiring hidden factual residues.

  The harder challenge arises when we apply the verbalness test to the metaontological debate itself. If the metaontologist claims the first-order dispute is verbal, but the disputants disagree about whether *that* claim is correct, is the metaontological dispute also verbal? If we require a neutral vocabulary to settle the metaontological dispute, and none is available, we risk a regress: every level of analysis requires a higher level to verify its non-verbalness. 

  However, this is not a vicious regress; it is a fixed point. The criteria for verbalness are internal to the conceptual framework being employed. There is no 'view from nowhere' to adjudicate which framework is uniquely correct. The regress stops because we do not need a meta-meta-ontology to validate the metaontology; we only need to acknowledge that the choice of framework is itself a pragmatic decision, not a factual discovery. The fixed point is the recognition that ontology is framework-relative. Once we accept that the rules of quantification are themselves part of the conceptual scheme being negotiated, the demand for a further factual grounding dissolves. The metaontological dispute is verbal in the same way the first-order dispute is: it is a negotiation over how we should conceptualize conceptualization.

  This stabilizes first-order ontology rather than destroying it. If we treat verbalness as a dismissal, ontology collapses into linguistics. But if we treat verbalness as identifying the pragmatic stakes of framework selection, first-order ontology remains robust. We can still say "there are tables" or "there are only simples," provided we index these claims to the framework being used. The status of first-order ontology shifts from describing mind-independent reality to recommending useful conceptual structures. The stipulation-proof dispute shows that we cannot stipulate away the need to choose a framework, because the choice itself carries theoretical weight. Therefore, the dispute is verbal in structure but substantive in consequence, and the metaontological regress is benign because it rests on a fixed pragmatic foundation. Ontology survives not as a science of existence simpliciter, but as the engineering of existence claims.

  ***

  **Marking Scheme (Total: 20)**

  **1. Distinguishing Verdict vs. Activity (4 marks)**
  *   **Hit:** Explicitly separates 'verbal' as a semantic structural diagnosis (no truth-conditional difference) from 'worthless' as a pragmatic evaluation.
  *   **Screw-up:** Equates "verbal" with "pointless" or claims the dispute must be factual because it feels substantive.

  **2. Characterizing the Disagreement (4 marks)**
  *   **Hit:** Identifies the dispute as pragmatic/negotiative (framework choice, theoretical utility) rather than factual.
  *   **Screw-up:** Tries to find a hidden factual difference (e.g., "they disagree about causation") violating the stipulation-proof premise.

  **3. Applying Verbalness to Metaontology (4 marks)**
  *   **Hit:** Addresses whether the metaontological debate is itself subject to the verbalness test.
  *   **Screw-up:** Ignores the reflexive layer entirely; treats metaontology as a factual arbiter immune to the same diagnostics.

  **4. Regress vs. Fixed Point (4 marks)**
  *   **Hit:** Takes a stand on whether the reflexive test causes a vicious regress or a stable fixed point (and justifies it).
  *   **Screw-up:** Claims it is a regress without explaining why it is vicious, or claims it is fixed without explaining where the stopping condition lies.

  **5. Implications for First-Order Ontology (4 marks)**
  *   **Hit:** Clearly states how the previous steps save or alter the status of first-order ontology (e.g., framework-relative, engineering vs. discovery).
  *   **Screw-up:** Concludes ontology is destroyed/illusory OR concludes ontology is unchanged (ignoring the shift to framework-relativity).

  **A/B Boundary:**
  *   **B Range (10-14):** Accurately redescribes the stipulation-proof case and correctly identifies it as verbal. May struggle to explain *why* it matters without slipping back into factualism, or treats the regress problem superficially.
  *   **A Range (15-20):** Uses the stipulation-proof case to argue for a specific conception of ontological value (pragmatism/engineering). Successfully resolves the regress objection without cheating (i.e., without reintroducing a 'real' fact). Commits to a position rather than hedging.

  **Potential Misreading Flag:**
  *   **Line:** *"If their fight about what fixes the meaning of the neutral vocabulary is verbal in the same way..."*
  *   **Issue:** Students often read this as introducing a new factual disagreement about linguistics (e.g., "what English speakers actually mean").
  *   **Correction:** Remind students this is also stipulation-proof; the disagreement is over which vocabulary *should* fix the meaning for theoretical purposes, not empirical linguistics.
