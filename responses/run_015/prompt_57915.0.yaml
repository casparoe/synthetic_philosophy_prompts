answer: |-
  # The "Moloch on Campus" Diagnostic
  **A 9-Question Quiz for Freshers Who Feel the Grind**

  You know the vibe: the group chat that never sleeps, the library at 2am, the feeling that if you stop running everyone else will pass you. We call this a "multipolar trap" (or sometimes "Moloch"): a situation where everyone competes in a way that makes everyone worse off, but no one can stop without losing out.

  This quiz isn't about right or wrong. It's about your instinctive reaction when the system starts grinding. Pick the option that feels most like *you* in the moment.

  ***

  **1. The House Group Chat**
  Your housemates are replying to messages instantly at 3am. You feel pressured to keep up, but you want to sleep. What's the move?
  *   **A.** Set up a bot that batches all messages and delivers them at 9am.
  *   **B.** Have a frank chat and agree that replying after midnight is 'not done'.
  *   **C.** Mute the chat permanently and only check it when you're ready.

  **2. The Revision Arms Race**
  Everyone in your seminar is doing the extra reading nobody asked for. You don't have time, but you don't want to fall behind.
  *   **A.** Accept that grades are partly about who has the most free time, and adjust your expectations.
  *   **B.** Propose a house rule: no discussing readings after 6pm.
  *   **C.** Start a 'study pact' where you all agree to skip the extra stuff together.

  **3. The 3am Chicken Shop**
  The takeaways on your street stay open until dawn. The owners say they're exhausted, but they're scared to close early in case customers go elsewhere.
  *   **A.** Open your own spot that closes at 10pm and market it as the 'healthy choice'.
  *   **B.** Create an app that shows customers which shops are currently resting.
  *   **C.** Assume the market demands it; if they close, someone else will open.

  **4. Society Instagram Spam**
  Every society is posting 10 times a day to stay relevant. Your feed is ruined, but if you post less, your events get no attendance.
  *   **A.** Lobby the Students' Union to cap posts per society per week.
  *   **B.** Accept that algorithmic attention is the only currency that matters now.
  *   **C.** Switch to a newsletter format that rewards depth over frequency.

  **5. The Dirty Kitchen**
  Dishes are piling up. Everyone says they'll do them 'later', but 'later' never comes because everyone's waiting for someone else to crack.
  *   **A.** Move to a smaller flat where you know the people better.
  *   **B.** Put a whiteboard up and write names next to dirty plates.
  *   **C.** Institute a £5 fine for overnight dishes, enforced by the house rep.

  **6. Lecture Recordings**
  Professors upload recordings. Attendance drops. Professors make lectures worse because no one is there. You watch at 2x speed but learn less.
  *   **A.** Form a 'watch party' group where you discuss the content live.
  *   **B.** Acknowledge that the lecture model is broken for good.
  *   **C.** Use a plugin that disables speed-up functions to force engagement.

  **7. Email Response Times**
  Students expect replies within an hour. Staff are burning out. Everyone is angry.
  *   **B.** Stop checking your student email outside 9-5, regardless of expectations.
  *   **A.** Department head sends a memo: "We reply within 48 hours. Period."
  *   **C.** It's a status symbol now; being busy is the point.

  **8. Freshers' Fair Noise**
  Societies shout over each other to recruit. It's deafening. If you whisper, no one hears you.
  *   **A.** Rent a booth in the quiet corridor and attract people who hate the noise.
  *   **B.** Agree with other socs to take turns using the megaphone.
  *   **C.** Install a decibel meter that cuts the mic if it gets too loud.

  **9. Essay Deadlines**
  Everyone submits early to get feedback. Tutors are overwhelmed. Feedback quality drops. You still submit early to be safe.
  *   **A.** Trust that your peers will value quality over speed if you lead by example.
  *   **B.** Submit on the actual deadline and accept you might be at a disadvantage.
  *   **C.** Implement a token system where you 'spend' credits to submit early.

  ***

  # Scoring Key

  Tally up which letter you chose most often. (Note: The letters map to different archetypes in different questions to stop you gaming it).

  *   **Mostly A: The Techy (Mechanism Designer)**
      You think the rules of the game are coded wrong. You don't want to punish people or beg them to be nicer; you want to change the interface, the incentives, or the flow of information so the 'bad' choice becomes impossible or unrewarding.
  *   **Mostly B: The Enforcer (Leviathan)**
      You trust authority and binding agreements. You think informal promises are weak sauce. If there's a rule with teeth (a fine, a ban, a mandate), people will follow it, and the trap closes.
  *   **Mostly C: The Culture (Norm Shifter)**
      You believe in the power of the vibe. You think shame, pride, and social expectations can solve this without needing bosses or apps. If we all agree on what's 'cool' or 'decent', the pressure lifts.
  *   **Mostly 'Accept/Assume' Answers: The Doomster (Fatalist)**
      *(Specifically: Q2A, Q3C, Q4B, Q6B, Q7C)*. You think the trap is structural and inevitable. Competition is human nature; markets will always optimise for exhaustion. The best you can do is understand it, not fix it.
  *   **Mostly 'Leave/Opt-out' Answers: The Exiter (Secessionist)**
      *(Specifically: Q1C, Q3A, Q5A, Q7B, Q8A, Q9B)*. You don't want to fix the big system; you want to build a small lifeboat. If the main game is rigged, play a smaller game with people you trust, or just walk away.

  *(If you have a tie, read the descriptions and see which one makes you nod. If you have a spread across all five, you're either a centrist or currently having an existential crisis.)*

  ***

  # Meta-Analysis & Designer Notes

  **1. Indistinguishable Pairs**
  *   **The Enforcer vs. The Techy:** This is the blurriest line in the quiz. Both advocate for structural change rather than cultural change. In Q4 and Q8, "capping posts" (Enforcer) and "decibel meters" (Techy) are functionally similar constraints. The distinction relies on *who* imposes it (authority vs. automated mechanism), but in practice, a Techy solution often requires an Enforcer to implement it.
  *   **The Exiter vs. The Doomster:** Both result in disengagement from the main system. The Doomster stays but resigns themselves to the loss (Q3C "Assume market demands it"); the Exiter physically or socially leaves the coordinate system (Q5A "Move to a smaller flat"). However, a cynical Exiter looks a lot like a pragmatic Doomster.

  **2. Weird/Incoherent Combos**
  *   **High Doomster + High Enforcer:** This is the "I think this is hopeless, but I want a dictator to fix it" paradox. It's not strictly incoherent (it's a common political stance), but it suggests a tension between your diagnosis (inevitable) and your prescription (control).
  *   **High Exiter + High Culture:** This suggests you want to leave the main system *in order to* build a high-trust normative community elsewhere. This is actually a very coherent "monastery" model, though the quiz might score it as conflicted.

  **3. Confidence Assessment**
  *   **Overall Confidence:** Moderate (65%). Nine questions is a low sample size for a five-way split. The quiz is designed to be a conversation starter, not a psychometric evaluation.
  *   **Least Sure Mapping:** **The Techy.** In a university context, "mechanism design" often sounds just like "rules" to a first-year. Distinguishing between "an app that delays messages" and "a rule that says don't message" relies on a nuance about *automation vs. obligation* that might get lost in a noisy freshers' fair setting.

  **4. Unexplored Territory**
  *   The quiz assumes the "trap" is negative. It doesn't account for the possibility that the "race to the bottom" is actually generating value (e.g., genuine passion driving the late nights). A "Accelerator" leaf (lean into the chaos) was considered but cut to keep the focus on trap-resolution.
