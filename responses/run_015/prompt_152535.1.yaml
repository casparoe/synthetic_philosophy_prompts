prompt: |-
  I sit on a small commission on electoral law reform, and I have been asked to write the short normative appendix to our report. Before I commit it to paper I would like my own position audited, because my worry is not that any one of these claims is indefensible but that I have been quietly using different principles in different chapters. I do not want a survey of the literature or a map of the debate, and I do not want to be told that reasonable people disagree; I want the argumentative structure of my own set. Please write in British English.

  Here is where I have landed.

  (1) The boundary of the franchise should be fixed by affected interests rather than by citizenship or by membership in a national community: roughly, anyone whose significant interests are foreseeably and non-trivially affected by a decision is entitled to a say in making it. I have argued against both the coercion test and the national self-determination test as criteria of inclusion.

  (2) Consequently, lawful non-citizen residents should have the vote in national as well as local elections after a short period of residence — residence being only a proxy for affectedness, not a test of belonging — while citizens who have lived abroad for years, pay no tax here and have no intention of returning should lose it.

  (3) The voting age should come down to sixteen, but no further. I oppose proxy votes cast by parents on behalf of younger children, I oppose any competence or civics test as a condition of adult voting, and I would leave eighteen as the age for jury service and for standing for election.

  (4) Voting should be legally compulsory: a duty to attend and return a ballot, with a formal none-of-the-above option and a modest fine for non-attendance. The secret ballot together with that option is, I take it, what answers the objection that compulsion coerces political expression.

  (5) Two grounds for (4). First, that abstention is a collective-action problem — no individual vote makes a difference, but low and socially skewed turnout biases policy against the worse-off — so compulsion is a legal remedy for a coordination failure and improves the representativeness of outcomes. Second, more broadly, that those who live under and benefit from a legal order owe it their participation.

  (6) The franchise is a right that individuals hold against the state, which they are free to exercise or refrain from exercising; that is part of why disenfranchisement — of serving prisoners, for instance — strikes me as a grave wrong.

  What I want from you: which of these genuinely pull against which, ordered by how severe the strain is, and for each tension what would have to give, what the cheapest repair would be, and what that repair would cost me elsewhere in the set. Please also say explicitly which of the apparent tensions dissolve on inspection and why, rather than flagging everything as a problem. If the package survives intact, say so — and then tell me where it is weakest regardless.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the Request:**
      *   **Task:** Audit the argumentative structure of a specific set of six normative claims regarding electoral law reform.
      *   **Goal:** Identify internal tensions/contradictions, order them by severity, propose repairs (and their costs), identify dissolved tensions, and assess overall coherence/weakness.
      *   **Constraints:** British English, no literature survey, no "reasonable people disagree" platitudes, focus *only* on the internal logic of the provided set.
      *   **User Persona:** Member of a commission on electoral law reform, writing a normative appendix. Wants rigour, not hand-holding.

  2.  **Analyze the Six Claims:**
      *   (1) *Franchise Boundary Principle:* Affected Interests (All Affected Interests - AAI). Rejects coercion and national membership.
      *   (2) *Residency/Citizenship:* Non-citizen residents vote (national/local) after short residence. Expatriates lose vote (no tax/intention to return). *Link to (1):* Residence = proxy for affectedness.
      *   (3) *Voting Age:* 16. No proxy for younger. No tests. Standing/Jury age = 18.
      *   (4) *Compulsory Voting:* Duty to attend/return ballot. None-of-the-above option. Modest fine. Secret ballot protects expression.
      *   (5) *Justification for Compulsion:* (a) Collective action/representativeness (bias against worse-off). (b) Fair play/obligation to legal order.
      *   (6) *Nature of Franchise:* A right held *against* the state, free to exercise or refrain. Disenfranchisement (e.g., prisoners) is wrong.

  3.  **Identify Potential Tensions (Brainstorming):**

      *   *Tension A: (4)/(5) vs (6).*
          *   (4)/(5) say voting is a *duty* (compulsory, fine for non-attendance).
          *   (6) says voting is a *right* one is "free to exercise or refrain from exercising".
          *   *Severity:* High. This looks like a direct contradiction in the deontic status of voting (Right to abstain vs. Duty to attend).

      *   *Tension B: (1) vs (3).*
          *   (1) says affected interests determine franchise.
          *   (3) sets a hard age cutoff (16).
          *   *Issue:* Are under-16s affected? Yes. Why exclude them? (3) says no proxy votes either.
          *   *Severity:* Medium/High. If AAI is the *sole* principle, age cutoffs need justification beyond "we drew a line here".

      *   *Tension C: (1) vs (2).*
          *   (1) says affected interests.
          *   (2) uses residence as a proxy.
          *   *Issue:* Is residence a *good* proxy for expats? (2) says expats lose vote if no tax/intention to return. But what if they are affected (e.g., pensioners abroad)?
          *   *Severity:* Low/Medium. The prompt acknowledges residence is a proxy. The tension is in the application, not the principle.

      *   *Tension D: (4) vs (6) - The "Right to Refrain" aspect.*
          *   (6) explicitly says "free to... refrain from exercising".
          *   (4) says "legally compulsory... fine for non-attendance".
          *   *Nuance:* (4) allows "none-of-the-above". Does that count as refraining? No, that's exercising the vote to reject. Refraining implies staying home.
          *   *Severity:* High. This is the strongest contradiction.

      *   *Tension E: (5b) vs (1).*
          *   (5b) says those under a legal order owe participation (fair play/coercion hint).
          *   (1) explicitly rejects the "coercion test" for inclusion.
          *   *Issue:* (5b) sounds like the coercion principle used as a justification for *duty*, while (1) rejects it for *rights*.
          *   *Severity:* Medium. It's a asymmetry in how coercion is treated (inclusion vs. obligation).

      *   *Tension F: (3) - Standing vs. Voting.*
          *   Vote at 16, Stand at 18.
          *   *Issue:* Why is the affected interest sufficient for choosing rulers but not for being one?
          *   *Severity:* Low. Competence/maturity distinction is standard, but needs to align with (1).

  4.  **Select and Order the Tensions:**

      *   *Priority 1 (Severe):* The Duty vs. Right to Abstain conflict ((4)/(5) vs (6)). This is a logical contradiction in terms of liberty.
      *   *Priority 2 (Moderate/Severe):* The Affected Interests Principle vs. Age Cutoff ((1) vs (3)). If AAI is the *fixed boundary*, arbitrary age lines undermine it.
      *   *Priority 3 (Moderate):* Coercion Rejection vs. Fair Play Duty ((1) vs (5b)). Rejecting coercion for inclusion but using subjection to law for obligation.
      *   *Priority 4 (Dissolved):* Residence Proxy ((1) vs (2)). This is explicitly acknowledged as a proxy in the text, so it's not a tension, just an operationalisation.
      *   *Priority 5 (Dissolved):* Secret Ballot ((4) vs Coercion). The prompt argues this solves the expression issue. I should evaluate if it solves the *duty* issue. (It doesn't solve the duty/right conflict).

  5.  **Drafting the Audit (incorporating British English and specific constraints):**

      *   *Introduction:* Acknowledge the coherence of the set but pinpoint the structural fault lines.
      *   *Tension 1: The Deontic Contradiction (Right to Refrain vs. Duty to Attend).*
          *   *Conflict:* (6) says free to refrain. (4) says compulsory with fine.
          *   *Repair:* Recast (6). Voting is a right *to participate*, not a right to ignore the duty. Or recast (4) as a duty to register/attend, not vote (but (4) says return a ballot).
          *   *Cheapest Repair:* Amend (6). Change "free to... refrain from exercising" to "free to determine the *content* of their ballot (including spoil/none)".
          *   *Cost:* Weakens the liberal defence against compulsion. Admits voting is a civic duty akin to jury service (which fits (5b) but clashes with the "right against the state" language).
      *   *Tension 2: Affected Interests vs. Age Cutoff.*
          *   *Conflict:* (1) says affected interests fix boundary. (3) excludes under-16s who are affected.
          *   *Repair:* Justify 16 as a *competence* threshold, but (3) rejects competence tests.
          *   *Cheapest Repair:* Argue 16 is a *administrative* proxy for affectedness/autonomy, similar to residence in (2).
          *   *Cost:* Undermines the purity of (1). If residence is a proxy for affectedness, and age is a proxy for... what? If it's competence, you contradict the ban on tests. If it's affectedness, it's weak (children are affected).
      *   *Tension 3: Coercion and Obligation.*
          *   *Conflict:* (1) rejects coercion test for *inclusion*. (5b) uses subjection to law for *obligation*.
          *   *Repair:* Distinguish between coercion as a sufficient condition for rights vs. subjection as a source of duty.
          *   *Cheapest Repair:* Clarify that coercion creates a *claim* to protection (vote), while subjection creates an *obligation* to sustain.
          *   *Cost:* Requires nuanced philosophical distinction that might look like special pleading.

      *   *Dissolved Tensions:*
          *   (1) vs (2): Explicitly handled as proxy.
          *   (4) vs Expression: The secret ballot + NOTA handles *expression*, but not the *act* of attendance.

      *   *Overall Weakest Point:* The justification for the age limit (3) given the strict adherence to Affected Interests (1).

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I use British English? (e.g., "programme", "defence", "labour" - though not needed here, ensure spelling and idiom).
      *   *Check:* Did I avoid literature survey? Yes.
      *   *Check:* Did I avoid "reasonable people disagree"? Yes.
      *   *Focus:* Ensure the distinction between the *right to the franchise* and the *duty to use it* is central.
      *   *Refinement on Tension 1:* Claim (6) says "free to exercise or refrain". Claim (4) says "compulsory... fine for non-attendance". This is the big one. If I am fined for non-attendance, I am not free to refrain. The "none-of-the-above" option in (4) is an *exercise* of the vote, not a *refraining* from it.
      *   *Refinement on Tension 2:* If (1) is the *sole* boundary, (3) is vulnerable. If (3) relies on competence, it contradicts the ban on tests. If it relies on affectedness, it's false (kids are affected). The repair must be to treat age as a proxy similar to residence in (2).

  7.  **Final Polish:** Structure clearly with headings. Ensure tone is analytical and rigorous. (British spelling: *programme, defence, analyse, labour, centre* - though specific words may not arise, keep the style).

      *   *Structure:*
          1.  Executive Summary (Coherence verdict).
          2.  Severe Tension (Duty vs. Right).
          3.  Moderate Tension (AAI vs. Age).
          4.  Moderate Tension (Coercion Asymmetry).
          5.  Dissolved Tensions.
          6.  Weakest Link.

      *   *Drafting the content:*
          *   Make sure to explicitly answer "what would have to give", "cheapest repair", "cost elsewhere".
          *   Ensure the distinction between "right to hold" and "duty to use" is clear.

      *(Self-Correction on Tension 1)*: Is it possible to hold a right that you are duty-bound to exercise? Yes (e.g., jury service is a duty, but you have a right to be on the jury if selected? No, that's different). Voting is usually framed as a right. If it's a duty, is it a right *against the state*? Yes, the state cannot stop you. But (6) says "free to... refrain". That is the specific phrase to attack.

      *(Self-Correction on Tension 2)*: The prompt says "Voting age should come down to sixteen, but no further." Why? If AAI is the principle, why not 14? Or 10? The prompt opposes proxy votes. This implies the child must vote themselves. This implies competence. But (3) opposes competence tests. This is a triangle of tension. I will focus on AAI vs Age.

      *(Final check on British English)*: Use "s" instead of "z" in *analyse/organisation* where appropriate (though Oxford spelling allows z, traditional British is s). Use "programme" if needed. Ensure phrasing is UK-appropriate (e.g., "MP", "constituency" if relevant, but here it's general).

