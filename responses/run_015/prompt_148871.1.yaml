answer: |-
  First off: **your advisor is wrong.** You are writing a dissertation on the Doctrine of Double Effect (DDE) and trolley cases; parsing the logic of the *Summa Theologiae* II-II, q. 64, a. 7 is literally the job. This passage is the genesis of the modern DDE, and it is notoriously dense. The tension you are feeling between "authority," "proportionality," and "causal structure" is not a bug in your reading; it is the central interpretive crux of the literature.

  Here is a breakdown of how to untangle Aquinas's text, how to treat that 1920s manual reading, and how to apply it to the Fat Man case for your chapter.

  ### 1. Deconstructing Aquinas's Three Conditions
  In *Summa* II-II, q. 64, a. 7, Aquinas outlines three conditions for legitimate self-defense. To understand where the "Fat Man" fails, you have to see which condition does the heavy lifting.

  1.  **The Intention of the End:** The agent must intend self-preservation (*conservatio propriae vitae*).
  2.  **The Intention of the Act (The "Double Effect" clause):** The death of the aggressor must be *praeter intentionem* (beside the intention). A private individual cannot intend to kill another human being, even for self-preservation. Only public authority can intend death (for the common good).
  3.  **Proportionality:** The act must be proportionate to the end (*actus sit proportionatus fini*). Specifically, one must not use "more violence than necessary" (*majori violentia quam oportet*).

  ### 2. Is Proportionality Mental-State or Causal-Structure?
  You asked if proportionality is a mental-state constraint (don't will more harm) or a causal-structure constraint (death as side-effect).

  **The Textual Answer:** It is primarily a **necessity constraint on the degree of force**, which implies a causal assessment but is distinct from the "means vs. side-effect" distinction.

  When Aquinas says "more violence than necessary," he is talking about the *quantum* of force relative to the threat. If an unarmed thief breaks in and you nuke the neighborhood, that is disproportionate. If you shoot an armed murderer, it may be proportionate.

  *   **Causal Structure:** This is handled by Condition #2 (*praeter intentionem*). This is where the "means vs. side-effect" distinction lives. If the death is the *mechanism* by which you survive, it is intended as a means, and thus illicit for a private person.
  *   **Proportionality:** This handles the *efficiency* and *excess*.

  **The 1920s Manual Reading (Modal Robustness):**
  You found a neo-scholastic manualist interpretation (likely from the pre-Vatican II era, e.g., Prümmer, Noldin, or Genicot). The reading you describe—"in nearby possible worlds where the aggressor doesn't die, you still survive"—is a **counterfactual test of necessity.**

  Is it "made up"? In the sense that Aquinas did not have possible world semantics, yes. But is it a faithful reconstruction of *majori violentia quam oportet*? **Yes.**
  *   If there is a nearby world where you use less force (or force that doesn't kill) and you *still* survive, then the lethal force was not "necessary."
  *   Therefore, the death was "more violence than oportet."

  So, you can cite that manual not as "what Aquinas said," but as "a rigorous logical explication of Aquinas's necessity condition." It treats proportionality as a **modal constraint on the causal link between force and survival.**

  ### 3. Authority vs. Causal Structure in the Fat Man Case
  This is the core of your dissertation problem. Why is pushing the Fat Man wrong?

  **A. The Authority Constraint**
  Aquinas is explicit: *"Soli illi qui habent publicam auctoritatem..."* (Only those who have public authority...).
  *   **Public Authority:** Can intend the death of a criminal for the common good (Condition #2 exception).
  *   **Private Individual:** Cannot intend death. Period.

  In the Fat Man case, you are a private individual. The Fat Man is innocent (not an aggressor). Therefore, you lack the jurisdiction to dispose of his life. If you *intend* his death (even as a means to save five), you are usurping public authority.

  **B. The Causal Structure (Means vs. Side-Effect)**
  In the standard "Switch" trolley case, the death of the one is arguably a side-effect of redirecting the threat.
  In the "Fat Man" case, the man's body is the *brake*. His mass stops the train. His crushing/death is the causal mechanism.
  *   For Aquinas, if the death is the *means* to the end, it is *in intentione*.
  *   Since you are a private individual, you cannot intend death as a means.

  **C. Does Proportionality Decide Between Them?**
  **No.** This is the trap you need to avoid in your chapter.
  *   Pushing the Fat Man is **proportionate**. One death to save five is mathematically proportionate. The force used is exactly what is needed to stop the train.
  *   If you argue the Fat Man case fails on *proportionality*, you undermine the Switch case (which passes proportionality).
  *   The Fat Man case fails on **Intention/Causal Structure** (using a person as a means) and **Authority** (private citizen killing an innocent).

  ### 4. How to Frame This in Your Chapter
  Your advisor thinks you're overthinking it because they might be viewing DDE as a monolithic "rule." You need to show that Aquinas's text actually separates these constraints, and that modern trolley problems often conflate them.

  **Suggested Argument Structure:**

  1.  **Distinguish the Constraints:** Argue that Aquinas offers a *tripartite* test (Intention of End, Intention of Act/Authority, Proportionality of Force), not a single "double effect" rule.
  2.  **Locate the "Fat Man" Failure:** Argue that the Fat Man case is illicit primarily because it violates the **Intention/Authority** constraint, not the Proportionality constraint. The death is intended as a means by a private authority.
  3.  **Rehabilitate the 1920s Reading:** Use the "modal robustness" reading to clarify **Proportionality**. Argue that proportionality is about *necessity of force*, not *justification of killing*.
      *   *Example:* If I can shove the Fat Man gently and he stops the train without dying, but I shove him hard and he dies, I violated proportionality (excessive force).
      *   *Example:* If the *only* way he stops the train is by dying, proportionality is met, but Intention/Authority is violated.
  4.  **Conclusion on Jurisdiction:** Conclude that for Aquinas, the "wrongness" of killing in trolley cases is fundamentally **juridical** (who has the right to weigh lives?) rather than purely **consequentialist** (does the math work?). The "causal structure" matters only insofar as it reveals the intention.

  ### Summary for your Notes
  *   **Proportionality** = Necessity of force (Modal/Counterfactual test).
  *   **Intention/Authority** = Causal structure (Means vs. Side-effect) + Jurisdiction.
  *   **Fat Man Wrongness** = Fails Intention/Authority. Passes Proportionality.
  *   **1920s Manual** = Valid heuristic for "necessity," but anachronistic terminology.

  You are not overthinking it. You are noticing that modern DDE discussions often collapse Aquinas's "Authority" condition into the "Intention" condition, or conflate "Proportionality" with "Necessity." Your dissertation will be stronger if you tease these apart. Keep digging.
