answer: |-
  Thank you for coming. It is a strange thing to stand in Amsterdam and speak to a room that is half memory and half mystery. I have spent two years telling interviewers that this novel is about what politeness costs. Standing here, looking at you, I understand that this reception is itself a polite act, and I feel the price of it already.

  We are gathered to celebrate a text that no longer exists in the form I wrote it. It exists now in Dutch, and in Japanese. Translation is often described as bridge-building, but for a book about silence, it is more like acoustics. You must decide how much noise the room can tolerate.

  To my Dutch translator, my friend of twenty years: You know me better than I know myself. You have heard me speak these sentences aloud in kitchens and backyards long before they were printed. When you translated this book, you did not just translate the words; you translated the intention behind them. Where I left a gap, you supplied the context our friendship provided. You made the text hospitable. You invited the Dutch reader into my home, rather than leaving them outside in the cold silence where the story begins. That is a gift of intimacy, and I know it came from loyalty.

  To my Japanese translator: You did not have the privilege of knowing me. You met only the text, and you treated its difficulties as structural, not personal. When you stood in Tokyo and said your translation was inadequate, you were not being modest. You were acknowledging that the silences in this book are heavy, and that carrying them across a language barrier changes their weight. You refused to guess what I meant. You kept the gaps open. You invited the Japanese reader into the silence itself, even when it was uncomfortable.

  There are translations that invite you into the writer's home, and translations that invite you into the writer's silence. Both are acts of love, but they charge different costs.

  My editor, who is no longer here to correct me, taught me that you may withhold judgment, but you must not invert it. So I will not say that one version is superior. I will say that they are faithful to different things. The Dutch version is faithful to the author I have been for two decades. The Japanese version is faithful to the book as it sits on the page, stripped of my explanations.

  I am aware that half this room knows me well enough to hear what I am not saying. The other half knows the text well enough to hear what was kept. My mother is here, and she knows I am difficult. My ex is here, and knows I am polite only when necessary.

  We are here to mark the publication of a book that argues kindness is a transaction. Tonight, we are completing the transaction. You have flown here. You have read the words. You have listened to me speak through an interpreter, knowing that something is always lost in the pause between sentences. That loss is the point.

  Thank you for paying the cost of being here. Thank you for reading.

