  # Joint Statement on the Governance of the Global Digital Memorial Archive

  ### 1. Agreed Claims

  1.  **Harms of Erasure and Compulsion:** Both camps acknowledge that state-enforced erasure facilitates impunity and distorts historical truth, while compulsive institutional remembrance can inflict secondary trauma on survivors and obstruct social renewal.
  2.  **Algorithmic Limits:** Both camps accept that algorithmic curation is not value-neutral; ranking, surfacing, and retention policies inherently prioritize certain narratives over others regardless of intent.
  3.  **Survivor Consent:** Both camps agree that survivor consent is a critical input for governance but disagree on whether it constitutes a veto power over archival retention versus a primary constraint on archival display.
  4.  **Institutional Neutrality:** Both camps concede that institutional neutrality regarding memory is impossible in the design phase; the architecture of the archive itself constitutes a moral stance on the past, even if operational execution strives for impartiality.

  ### 2. Disagreements Table

  | Topic | Remembrance Duty Camp | Forgetting Rights Camp |
  | :--- | :--- | :--- |
  | **Nature of Remembrance** | Remembrance is a debt owed to the victims of injustice, independent of the comfort of the living. | Remembrance is a burden imposed on survivors and descendants, which must be justified by its utility for the present. |
  | **Nature of Forgetting** | Forgetting is primarily a form of moral evasion that risks repeating harm and betraying the dead. | Forgetting is a moral right essential for individual and collective flourishing and liberation from the past. |
  | **Algorithmic Neutrality** | Algorithmic curation can be normatively aligned with justice if programmed to prioritize fidelity to the record over user engagement. | Algorithmic curation cannot be normatively neutral because surfacing records constitutes a performance of memory that coerces attention. |

  ### 3. The Cruxes and Concrete Cases

  **Crux 1: The Normative Weight of Natural Forgetting**
  *Question:* Does the biological or cultural naturalness of human forgetting carry independent normative weight that institutions ought to mimic, or is artificial preservation a necessary corrective to human frailty?

  *   **Concrete Case:** An automated protocol that deprecates (removes from search results but retains in deep storage) records of collective harm after 80 years unless actively renewed by a stakeholder.
  *   **Remembrance Duty Prediction:** This protocol should be rejected. Truth does not expire, and relying on active renewal places an unfair burden on victims' descendants to maintain the memory of injustice against the flow of time.
  *   **Forgetting Rights Prediction:** This protocol should be implemented. It aligns institutional memory with the human lifecycle, allowing grievances to settle unless there is a present, active will to maintain them.

  **Crux 2: Separation of Preservation and Performance**
  *Question:* Can institutional design separate preservation (storage) from performance (attention), such that truth is retained without compelling society to remember it?

  *   **Concrete Case:** A "Deep Storage" mode where records are verified and preserved but algorithmically suppressed from feeds, recommendations, and standard queries unless a specific archival request is made.
  *   **Remembrance Duty Prediction:** This governance model is insufficient. Memory requires active engagement and public witness; storing truth without surfacing it renders the archive a tomb rather than a moral tool.
  *   **Forgetting Rights Prediction:** This governance model is optimal. It satisfies the requirement for historical truth without enforcing a therapeutic culture of compulsory recall that impedes moving forward.

  Summary: Both camps endorse a global digital archive with tiered retention protocols and verified expungement requests, but remain divided on whether the default setting should prioritize fidelity to victims or the flourishing of the living.
