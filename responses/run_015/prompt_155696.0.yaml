      *   *Solution:* The "Fink" card instructs the player: "When the Stimulus occurs, you must immediately discard your Resource Card face down. You no longer have the capacity."
      *   *Solution:* The "Mask" card instructs: "You retain the Resource Card, but you are forbidden from playing it."

      *Scoring:* Observers get points for predicting *accurately* whether the resource is played. If they assume "Role = Play," they lose points when Finks/Masks activate.

