  1.  **Analyze the Request:**
      *   **Target Audience:** ~12 Graduate Students (Metaphysics Seminar).
      *   **Duration:** 90 Minutes.
      *   **Goal:** Make the collapse of the Simple Conditional Analysis (SCA) of dispositions feel *unavoidable* through play, not lecture.
      *   **Core Metaphysical Idea:** Capacities (dispositions) can be present but systematically blocked (Masks) or removed upon triggering (Finks), even at a collective level.
      *   **Key Twist:** Collective-level dispositions vs. Individual hidden modifiers.
      *   **Mechanics:**
          *   Overt Group Roles (Mediator, Skeptic, etc.).
          *   Hidden Individual Modifiers (Masks, Finks).
          *   Concrete Cooperative Task (Puzzle/Consensus).
          *   Prediction Protocol (Observers predict manifestation based on roles).
          *   Scoring (Points for correct forecasts, penalty for false positives).
      *   **Requirements:** Precise rules, task structure, scoring, timeline, debrief (mapping to Finks/Masks/Contextualism), limitations (modal stability), troubleshooting (common errors).
      *   **Constraint:** The metaphysical idea must emerge *before* technical terms are named.

  2.  **Deconstruct the Metaphysics:**
      *   *Simple Conditional Analysis (SCA):* $x$ is disposed to $M$ when stimulated by $S$ iff if $x$ were stimulated by $S$, $x$ would $M$.
      *   *Fink:* The disposition disappears exactly when the stimulus occurs (e.g., a wire loses conductivity the moment it is touched).
      *   *Mask:* The disposition remains, but something prevents the manifestation (e.g., a poison is antidoted immediately upon ingestion).
      *   *Collective Disposition:* The group has a capacity (e.g., "to solve the puzzle") that depends on individual capacities.
      *   *The "Feel":* Students need to *have* a capacity, try to use it, fail, and realize the failure wasn't due to lack of capacity but due to structural interference they couldn't see.

  3.  **Designing the Game ("The Protocol of Hidden Currents"):**
      *   *Task:* Needs to be simple enough to do in 30 mins but complex enough to require specific roles. A "Logical Consensus" task works well. They need to agree on a truth value for a set of propositions based on distributed clues.
      *   *Roles:* Need to imply specific dispositions.
          *   *Synthesizer:* Disposed to combine clues.
          *   *Verifier:* Disposed to check logic.
          *   *Speaker:* Disposed to announce conclusions.
      *   *Hidden Modifiers:*
          *   *Mask Card:* "You have the capacity, but you cannot speak/act when the Stimulus occurs."
          *   *Fink Card:* "The moment you intend to act, you lose the capacity (forget the clue/cannot move)."
      *   *Prediction:* Rotating observers bet on whether a specific role *will* manifest its function when stimulated.

  4.  **Drafting the Mechanics (Iterative Process):**
      *   *Issue:* If I just give cards, it's LARP. How to make it metaphysical?
      *   *Solution:* The scoring system must punish the assumption that Role = Manifestation. The observers *must* fail if they assume SCA.
      *   *Refinement:* Let's make the "Stimulus" explicit. The Facilitator triggers the stimulus.
      *   *Refinement:* The "Fink" needs to be instantaneous. In a game, this means "When you try to play a card, you must discard it instead."
      *   *Refinement:* The "Mask" means "You hold the card, but you are silenced."
      *   *Collective Aspect:* The group wins if they solve the puzzle. The observers win if they predict the *failure* correctly. This creates tension: Group wants success, Observers want to predict the failure (which ensures group failure?). No, Observers predict *manifestation*. If they predict "Yes" and it fails, they lose. This aligns them with understanding the *true* conditions.

  5.  **Structuring the 90 Minutes:**
      *   0-10: Setup & Rules (No metaphysics yet).
      *   10-20: Round 1 (Baseline).
      *   20-30: Round 2 (Hidden Modifiers introduced secretly).
      *   30-50: Round 3 & 4 (Escalation/Rotation).
      *   50-70: The Debrief (The "Lecture" part, but grounded in experience).
      *   70-90: Discussion/Implications.

  6.  **Addressing the "Collective Twist":**
      *   The Group has a disposition: "To Solve."
      *   This depends on Individual dispositions.
      *   If an Individual is Finked, does the Group lose the disposition?
      *   *Metaphysical Point:* The Group disposition might still be ascribed ("They are a competent team") even if a specific instance fails due to hidden interference.
      *   *Game Mechanic:* The Group gets a "Competence Rating" based on Roles. Observers bet on the Group Success. Hidden cards sabotage individual contributions, causing Group Failure despite High Competence Rating.

  7.  **Troubleshooting (Predicting Failure):**
      *   *Problem:* Players think it's just lying.
      *   *Fix:* Emphasize the "Phenomenology." The Fink player *feels* like they are about to act, then can't.
      *   *Problem:* Confusion between Task Failure and Prediction Failure.
      *   *Fix:* Separate scoreboards. One for Puzzle, one for Prediction.

  8.  **The Debrief (Mapping to Metaphysics):**
      *   Connect "Hidden Modifiers" to Intrinsic vs. Extrinsic.
      *   Connect "Prediction Failure" to the falsity of the Conditional.
      *   Connect "Group Capacity" to Distributed Dispositions.
      *   *Limitation:* The game is actual, not modal. We can't show *what would have happened* in a nearby possible world. The Facilitator must narrate that.

  9.  **Refining the Rules for Clarity:**
      *   Need specific cards.
