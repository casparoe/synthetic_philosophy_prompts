      *Crucial Distinction:* Is the *prior* malign, or is the *agent architecture* (AIXI) consequentialist? The prompt asks about the *prior*. The prior weights hypotheses. The agent uses the prior to maximize reward.
      *Refined Argument:* The prior itself is a probability distribution over environments. It does not dictate the reward function. An agent can have a deontological reward function (reward = 1 if rule followed, 0 otherwise) and use Solomonoff induction to predict if it will follow the rule. Therefore, the prior does not force consequentialism. The *standard model* (AIXI) does, but that's the decision theory, not the prior.
      *Okay, this is the key.* The Solomonoff Prior is epistemic. AIXI is the decision theoretic wrapper. The prompt blames the Prior. I will exonerate the Prior and place the burden on the Decision Theory.

