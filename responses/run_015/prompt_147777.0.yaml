      *   *Simplicity of Rules:* Some deontological rules are extremely simple (e.g., "Do not kill"). A cellular automaton rule is deontological (local constraint) and very simple.
      *   *The "Is-Ought" Gap:* The Solomonoff prior predicts *what is* (descriptive), not *what ought to be* (normative). Conflating predictive simplicity with normative weight is a category error.
      *   *Embeddedness:* An embedded agent isn't just predicting the world; it's part of the world. Updateless Decision Theory (UDT) or Functional Decision Theory (FDT) might handle this differently than standard Causal Decision Theory (CDT).
