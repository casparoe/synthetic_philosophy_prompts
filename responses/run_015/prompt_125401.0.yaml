answer: |-
  This is a classic formulation of Jaegwon Kim's **Causal Exclusion Argument**. Your group has correctly identified that if you accept Physical Causal Closure (1), Supervenience (2), and the Exclusion Principle (4), you are forced into epiphenomenalism (mental events cause nothing) or reductive physicalism (mental events just *are* neural events). The extension to omissions and social facts shows the argument is too strong—it threatens to eliminate all higher-level causation, which seems absurd (a *reductio ad absurdum*).

  The "leak" is almost universally located at **step (4), the Exclusion Principle**. This principle assumes that causation is a zero-sum game: if the physical cause is sufficient, there is no "work" left for the mental cause to do. This assumes $M$ and $N$ are distinct, competing causes. However, most non-reductive physicalists argue that $M$ and $N$ are not competitors; $M$ causes $B$ *in virtue of* $N$ causing $B$, or they are related via realization/constitution rather than competition. Rejecting (4) allows you to save mental, social, and omission causation without violating physical closure.

  You mentioned you want to keep (4). You *can* keep (4), but only if you accept **Reductive Physicalism (Identity Theory)**. If $M$ is identical to $N$, there is only one cause, so no exclusion problem arises. However, this costs you the ability to explain multiple realizability (the same mental state realized by different physical states) and undermines the distinctness of social/omission facts. If you want to maintain that mental/social facts are distinct from but dependent on physical facts (non-reductive), you cannot keep (4). Rejecting (4) requires you to adopt a metaphysics where causation operates at multiple levels without competition.

  \answer{4, Accepting non-competitive causation}
