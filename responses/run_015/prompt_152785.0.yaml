prompt: |-
  I lead a three-person trust and safety policy team at a peer-to-peer marketplace — people list services, tickets, access, and a steady stream of weird one-off things — and most of my week goes into deciding whether a proposed listing category is allowed at all. It's about a dozen calls a week, usually turned around within a day, made by an analyst with no philosophy training, and whatever we write has to survive a look from outside counsel and, in the worst case, from a state attourney general. We keep going in circles, so I want an actual procedure rather than a vibe.

  Here's the half-baked framework I've been working from, which you should feel free to fix or throw out. The objections we raise seem to land in one of three places: (1) in the good itself — it's the kind of thing whose value is damaged by being for sale, so the sale changes what the thing even is; (2) in the relationship between the parties — someone gets taken advantage of, or one side is treated as a source of supply rather than as an equal you transact with, or the price is only "freely accepted" because the seller's alternatives are terrible; (3) in the effect on people who aren't in the deal — the market exists and bystanders are worse off, or the good starts getting distributed by ability to pay instead of by whatever principle was distributing it before. Then there's a fourth bucket we argue about constantly and cannot operationalize: the worry isn't what the market does but what it says — the market existing changes what everyone, including people who'd never trade, believes about the good or about each other. Every time we try to test for that it collapses into "does this make our stomach turn," which is exactly what I want out of the process, because our stomachs are unreliable and mostly just track whatever our user base happened to find normal that year.

  So please turn that, or a better version of it, into a triage procedure my analyst can run in under thirty minutes on a proposed category. I want, in order: the questions to ask; what counts as an adequate answer to each; what she's allowed to infer from thin evidence versus what she must escalate because it's an empirical question a company our size can't answer; where the procedure stops with a block versus an "allow, but constrain" (and which kinds of constraints answer which objection); and above all the points where it hands the decision to me or to legal because the disagreement is about values rather than facts — mark those explicitly instead of hiding them inside a proxy question. Be honest about which distinctions in this literature actually survive being compressed into a checklist and which ones I'd only be pretending to preserve, and about where a procedure like this will systematically misfire (my guesses: cases where the problem is that the market exists at all rather than that any particular trade is bad, and cases where the norm is mid-change). Then run it on three proposals in my queue: (a) paid kidney donation — I know it's the canonical example, so I want to see whether the procedure blocks it for a reason we'd actually defend to a regulator or just because everyone knows it's banned; (b) selling your place in a queue, i.e. someone books a free slot (campsite reservation, DMV appointment, popular restaurant waitlist) and resells it — my instinct is that this is obviously fine, like ticket resale, but a couple of us think it's a different problem; (c) a "rent an attendee" category, where people pay strangers to show up in person at things like funerals or small-town hearings purely so more bodies are in the room, with no one pretending to be a relative and no lies told — the buyer just wants the room to look full. I personally think (c) is harmless and suspect I might be wrong, so give me the result I won't like: if the procedure clears (c), tell me why I should distrust the clearance, and if it blocks something I'm attached to, say so straight. American English, please, in a form I can paste into a policy doc.
reasoning: |-
  Here's a thinking process that leads to the suggested policy framework:

  1.  **Analyze the Request:**
      *   **User:** Lead of a 3-person Trust & Safety policy team at a P2P marketplace.
      *   **Problem:** Current decision-making is ad-hoc ("vibe-based"), slow, and inconsistent. Needs a concrete, operationalizable procedure for analysts (no philosophy training) to triage new listing categories in <30 mins.
      *   **Current Framework:** Based on commodification objections (Sandels/Walzer style):
          1.  Corruption of the good (sale damages value).
          2.  Exploitation/Coercion (relationship imbalance).
          3.  Negative Externalities (harm to bystanders/distribution principles).
          4.  Expressive Harm (what the market *says* about norms) - *This is the pain point.*
      *   **Requirements:**
          *   Turn the framework into a triage procedure (Questions, Adequate Answers, Inference vs. Escalation, Block vs. Constrain, Handoff points).
          *   Be honest about limitations (what gets lost in compression, where it misfires).
          *   Run the procedure on three specific cases: (a) Paid Kidney Donation, (b) Queue Scalping, (c) Rent an Attendee.
          *   Tone: American English, policy-doc ready, direct, honest about value judgments.
      *   **Constraint:** The output must be usable by an analyst but honest about where philosophy/legal takes over.

  2.  **Deconstruct the Philosophical Framework (Sandels/Walzer/Zelizer):**
      *   *Corruption of the Good:* Selling a Nobel Prize changes what a Nobel Prize is. Selling a kidney might change what a body part is.
      *   *Exploitation:* Desperation sales (selling a kidney to pay debt).
      *   *Externalities:* Ticket scalping makes tickets harder for fans to get.
      *   *Expressive Harm:* Selling friendship devalues friendship even for those who don't buy it.
      *   *The "Stomach Turn" Problem:* Expressive harm is hard to measure. It often just maps to current social norms, which shift.

  3.  **Drafting the Procedure (The "Market Harm Triage Protocol"):**
      *   *Goal:* 30-minute triage.
      *   *Structure:*
          1.  **Threshold Check (Legal/Safety):** Immediate blocks (illegal items).
          2.  **Harm Assessment (The 4 Buckets):** Translating the philosophical objections into empirical questions.
          3.  **Mitigation (Constrain vs. Block):** Can we fix it with friction?
          4.  **Escalation (The "Value Handoff"):** Where the analyst *must* stop.
      *   *Addressing the "Expressive Harm" Bucket:* This is the hardest. Instead of asking "Does this feel wrong?", ask "Does this violate a specific, codified community norm or legal standard regarding dignity?" If it's just "weird," allow. If it touches on protected classes or fundamental human rights, block/escalate.
      *   *Inference vs. Evidence:* Analysts can infer risk from *analogous* categories. They cannot infer societal impact without data.
      *   *Handoff Points:* Explicitly mark where the decision is about *company values* vs. *risk management*.

  4.  **Refining the "Expressive Harm" Operationalization:**
      *   The user hates "stomach turn."
      *   Solution: Tie it to *Dignity and Agency*. Does the listing require the seller to suppress their agency or treat their personhood as a tool?
      *   Test: "If this became normal, would it undermine the legal or social standing of the seller class?"

  5.  **Developing the Test Cases:**
      *   *(a) Paid Kidney Donation:*
          *   Legal: Illegal (NSOTRA in US).
          *   Harm: Exploitation (poverty), Corruption (body as parts bin), Externalities (rich get organs).
          *   Result: Hard Block.
          *   *Critique:* The procedure shouldn't just say "it's illegal." It needs to explain *why* the policy exists beyond the law (in case law changes).
      *   *(b) Queue Scalping:*
          *   Legal: Grey area (some states ban).
          *   Harm: Externalities (fairness of access).
          *   Result: Allow with Constraints (verification, limits).
          *   *Nuance:* Is it different from tickets? Tickets are property. Queue spots are often non-transferable rights.
      *   *(c) Rent an Attendee:*
          *   Legal: Generally legal.
          *   Harm: Expressive (devalues civic/familial participation).
          *   Result: This is the tricky one. User suspects it's harmful.
          *   *Analysis:* It treats human presence as decoration. It risks fraud (even if "no lies told," the implication is deception). It touches on *dignity*.
          *   *Verdict:* Likely Block or Heavy Constraint. Why? Because it commodifies *witnessing*, which is a civic/moral act.

  6.  **Addressing the "Honesty" Requirement:**
      *   I need to explicitly state where this checklist fails.
      *   *Failure Mode 1:* Norm Shifts. The checklist codifies *current* norms. If norms change (e.g., surrogacy), the checklist lags.
      *   *Failure Mode 2:* Aggregation. One listing is fine; 10,000 changes the culture. The checklist looks at the *category*, not the *scale*.
      *   *Failure Mode 3:* The "Expressive" bucket will always be partly subjective. I need to admit that.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, direct, slightly academic but practical.
      *   *Format:* Policy Document style.
      *   *Section 1: The Protocol.* (Questions, Evidence, Escalation).
      *   *Section 2: Limitations.* (Where the map isn't the territory).
      *   *Section 3: Case Studies.* (Applying the protocol).

      *(Self-Correction during drafting)*: I initially thought about letting the analyst decide on Expressive Harm. No, the prompt says "mark those explicitly instead of hiding them inside a proxy question." I need to make sure the "Expressive/Dignity" check triggers an escalation to the Lead (User) or Legal, not a hard block by the analyst, unless it's egregious.
      *Wait, re-reading prompt:* "where the procedure stops with a block versus an 'allow, but constrain'... and above all the points where it hands the decision to me or to legal."
      *Okay:* Analyst can Block on Safety/Legality. Analyst can Allow/Constrain on Low Risk. Analyst *must* Escalate on High Risk/Value Judgments (especially Expressive Harm).

      *Refining the "Expressive Harm" Question:* Instead of "Does this feel wrong?", ask "Does this transaction require the seller to perform a role that implies a non-commercial relationship (family, civic duty, grief)?" If yes -> Escalate.

      *Refining Case (c):* "Rent an Attendee." Even if no lies are told, the *function* is to create a false impression of support. This is "fraud-adjacent." It treats human presence as a commodity. This hits the "Corruption of the Good" (what is attendance?) and "Expressive" (what does it say about community?). I should recommend a Block here, or at least a hard Escalation, validating the user's suspicion.

  8.  **Final Review against Constraints:**
      *   30-minute triage? Yes, if questions are sharp.
      *   American English? Yes.
      *   Paste-ready? Yes.
      *   Honest about limitations? Yes.
      *   Case studies included? Yes.

  9.  **Final Polish:** Ensure the distinction between "Analyst Decision" and "Lead/Legal Decision" is crystal clear. The user wants to stop the circles, so the handoff points must be unambiguous.

  *(Self-Correction on Case B)*: Queue scalping. Is it allowed? Many platforms ban it because it violates the *source's* Terms of Service (e.g., DMV slots are non-transferable). The procedure needs to check "Transferability of the underlying right." If the underlying right is non-transferable, the listing is facilitating a breach of contract. That's a legal/risk block, not just a moral one. I need to make sure the procedure catches that.

  *(Self-Correction on Case C)*: "Rent an Attendee." If no lies are told, is it fraud? It's "astroturfing." It undermines the integrity of the hearing/funeral. This falls under "Negative Externalities" (bystanders think the support is real) and "Expressive Harm" (dignity of mourning/civic duty). I will argue this should be blocked, validating the user's worry.

  10. **Constructing the Output.** (Proceed to generate response).
answer: |-
  # Market Category Triage Protocol (MCTP)
  **Version:** 1.0  
  **Owner:** Trust & Safety Policy  
  **Audience:** Policy Analysts  
  **Time Budget:** 30 Minutes per Category  

  ## 1. Purpose
  This procedure replaces ad-hoc moral reasoning with a structured risk assessment. It distinguishes between **empirical risks** (harm, legality, fraud) which analysts can assess, and **value judgments** (norms, dignity, brand voice) which require Leadership or Legal escalation. 

  **Goal:** Produce one of four outcomes:  
  1.  **Allow** (No significant risk identified).  
  2.  **Constrain** (Allow with specific friction/limits).  
  3.  **Block** (Clear violation of law, safety, or core policy).  
  4.  **Escalate** (Ambiguous value judgment; requires Lead/Legal decision).

  ---

  ## 2. The Triage Checklist
  *Analyst Instructions: Answer "Yes/No/Unclear" to the following. Cite evidence for every "Yes." If you cannot cite evidence, mark "Unclear" and move to Escalation.*

  ### Phase A: Legality & Safety (Hard Gates)
  *If any answer is YES, result is **BLOCK**. Do not proceed.*
  1.  **Statutory Ban:** Is the good/service illegal to sell under US federal law or the law of the largest relevant state jurisdiction? (e.g., organs, controlled substances).
  2.  **Physical Harm:** Does the transaction inherently require high risk of physical injury to the seller, buyer, or bystander? (e.g., unregulated medical procedures).
  3.  **Fraud Facilitation:** Does the listing require the seller to lie to a third party to complete the transaction? (e.g., fake credentials, impersonation).

  ### Phase B: Exploitation & Coercion (Relationship Harm)
  *If any answer is YES, result is **ESCALATE** or **CONSTRAIN** (see Section 3).*
  4.  **Desperation Indicator:** Is the supply of this good/service correlated with acute financial distress or lack of alternatives? (e.g., selling plasma vs. selling used furniture).
      *   *Evidence Standard:* Look for academic/NGO reports linking this specific market to poverty traps. Do not infer from "low price."
  5.  **Irreversibility:** Is the transaction physically or legally irreversible for the seller? (e.g., surrogacy, permanent data rights).
      *   *Evidence Standard:* Contract law or medical consensus.

  ### Phase C: Corruption & Externalities (Market Harm)
  *If any answer is YES, result is **CONSTRAIN** or **ESCALATE**.*
  6.  **Zero-Sum Access:** Does this sale allow the buyer to bypass a queue or allocation system intended to be first-come, first-served or needs-based? (e.g., ticket scalping, DMV appointments).
      *   *Evidence Standard:* Terms of Service of the underlying provider (e.g., does the DMV forbid transfer?).
  7.  **Dignity of Function:** Does the service require the seller to perform a role traditionally associated with non-market relationships (family, civic duty, grief, friendship)?
      *   *Evidence Standard:* Is there a social script being monetized? (e.g., "rent a friend," "rent a mourner").

  ### Phase D: Expressive Harm (The "Norm" Check)
  *If YES, result is **ESCALATE**. Analysts may not decide this.*
  8.  **Norm Shift:** If this category became normalized (10,000 listings), would it fundamentally alter how society values the underlying good, even for non-users?
      *   *Decision Rule:* Do **not** use personal intuition ("stomach turn"). Ask: "Does this violate a protected class dignity or a codified human right?" (e.g., voting rights, bodily integrity).
      *   *If Unclear:* Escalate.

  ---

  ## 3. Decision Matrix & Mitigations
  *Match your Phase results to these actions.*

  | Primary Objection | Allowed Action | Required Constraints (if Allow) | Escalation Trigger |
  | :--- | :--- | :--- | :--- |
  | **Legality/Safety** | **BLOCK** | N/A | None (Legal confirms block). |
  | **Exploitation** | **CONSTRAIN** | • Income caps/verification.<br>• Mandatory cooling-off periods.<br>• Prohibit bulk selling. | If the good is *inseparable* from the person (e.g., bodily fluids), Escalate. |
  | **Externalities** | **CONSTRAIN** | • Limit quantity per buyer.<br>• Price caps (face value + fee).<br>• Identity verification to prevent botting. | If the underlying provider explicitly forbids transfer (breach of contract risk), Escalate to Legal. |
  | **Dignity/Expressive** | **ESCALATE** | N/A | **All** Phase D "Yes" answers go to Policy Lead. |

  ---

  ## 4. Limitations & Failure Modes
  *Read before applying. This procedure is a tool, not a truth machine.*

  1.  **The Aggregation Blind Spot:** This checklist assesses a *category*, not *scale*. A category may be harmless at 10 listings but corrosive at 10,000. If a category is approved, it must be reviewed again if volume exceeds 500 active listings/month.
  2.  **The Norm Lag:** This procedure codifies *current* norms. It will systematically block innovative categories that challenge outdated norms (e.g., surrogacy in 1980). Escalation is the safety valve for this; do not Block based on "old" norms without Lead approval.
  3.  **The "Expressive" Proxy:** Phase D attempts to measure "what the market says." We cannot measure this empirically. We proxy it via "Dignity of Function." This will misfire on edge cases where dignity is contested. **Always Escalate Phase D positives.**
  4.  **Analyst Authority:** Analysts are authorized to Block on Safety/Law and Constrain on Friction. Analysts are **not** authorized to Block on Moral/Expressive grounds. That is a Leadership decision.

  ---

  ## 5. Case Study Applications
  *Below are the results of running the MCTP on your current queue items.*

  ### Case A: Paid Kidney Donation
  *   **Phase A (Legality):** **YES.** (National Organ Transplant Act prohibits valuable consideration).
  *   **Phase B (Exploitation):** **YES.** (High correlation with poverty; irreversible).
  *   **Phase C (Corruption):** **YES.** (Allocates life-saving treatment by wealth, not need).
  *   **Phase D (Expressive):** **YES.** (Commodifies bodily integrity).
  *   **MCTP Result:** **BLOCK.**
  *   **Analyst Note:** This is a clear statutory block. However, even if the law changed, Phase B and C trigger an automatic Escalation/Block due to irreversibility and allocation fairness.
  *   **Regulatory Defense:** "We prohibit this not only because it is illegal under NSOTRA, but because it violates our policy on Irreversible Bodily Harm and Equitable Access to Essential Resources."

  ### Case B: Selling Place in Queue (DMV/Campsite)
  *   **Phase A (Legality):** **UNCLEAR.** (Varies by state; often a breach of contract rather than criminal).
  *   **Phase B (Exploitation):** **NO.** (Low barrier to entry; reversible).
  *   **Phase C (Externalities):** **YES.** (Zero-sum access; bypasses FCFS allocation).
  *   **Phase D (Expressive):** **NO.** (Queueing is not a dignitary role).
  *   **MCTP Result:** **ESCALATE TO LEGAL.**
  *   **Reasoning:** Phase A is not a hard "Yes" on criminal law, but Phase C indicates a high risk of facilitating breach of contract with the underlying provider (e.g., Recreation.gov or state gov).
  *   **Recommendation:** If Legal clears the breach-of-contract risk, **CONSTRAIN**. 
      *   *Constraints:* Require proof of original booking; limit to 1 listing per user; cap price at 20% above face value/standard fee.
  *   **Why it differs from Tickets:** Tickets are property rights explicitly designed for transfer. Queue spots are often personal privileges. The procedure catches this distinction in Phase C (Question 6).

  ### Case C: "Rent an Attendee" (Funerals/Hearings)
  *   **Phase A (Legality):** **NO.** (Generally legal).
  *   **Phase B (Exploitation):** **UNCLEAR.** (Low skill, but potentially preys on those needing cash).
  *   **Phase C (Corruption):** **YES.** (Question 7: Dignity of Function).
      *   *Analysis:* Funerals and civic hearings rely on the presumption that attendance implies *genuine* support or interest. Monetizing presence decouples the signal from the meaning.
  *   **Phase D (Expressive):** **YES.**
      *   *Analysis:* Normalizing paid attendance devalues the concept of "witnessing." It turns civic/familial duty into a service commodity.
  *   **MCTP Result:** **ESCALATE TO POLICY LEAD.**
  *   **Analyst Note:** This triggers Phase C (Dignity of Function) and Phase D (Expressive Harm). Analyst cannot Block this on moral grounds alone.
  *   **Lead Recommendation (The result you might not like):** **BLOCK.**
      *   *Why:* While no direct lie is told (as per your prompt), the *commercial intent* creates a constructive fraud on other attendees and the organizers. It undermines the integrity of the gathering.
      *   *Risk:* If we allow "Rent a Mourner," we become the platform for astroturfing grief and civic manipulation. The reputational risk outweighs the GMV.
      *   *Distrust the Clearance:* If the procedure cleared this, it would be because Phase C/D was treated as "vibe" rather than "integrity risk." Do not clear this. The harm is not to the buyer/seller, but to the *institution* being attended. We do not want to be the infrastructure that degrades public trust in civic/familial institutions.

  ---

  ## 6. Escalation Handoff Form
  *When Phase D is triggered, or Phase A/B/C are ambiguous, submit this to Leadership.*

  *   **Category:** [Name]
  *   **Trigger:** [e.g., Phase D - Expressive Harm]
  *   **The Value Conflict:** [e.g., "Freedom to monetize labor" vs. "Preserving the non-market meaning of grief."]
  *   **Precedent:** [Have we allowed analogous categories? e.g., Professional Mourners exist in some cultures; Professional Line-Standers exist in DC.]
  *   **Recommendation:** [Allow / Constrain / Block]
  *   **Rationale:** [Why does this align with our company values *this year*?]

  ---

  ## 7. Honest Assessment of This Procedure
  *For the Policy Lead's eyes only.*

  **What this preserves:**
  *   It separates **Law** (Block) from **Risk** (Constrain) from **Values** (Escalate). This stops your analysts from pretending their personal morals are company policy.
  *   It forces evidence citation. "This feels exploitative" is rejected; "Studies show 80% of sellers are below poverty line" is accepted.

  **Where this will misfire:**
  *   **The "Mid-Change" Norm:** If society is currently split on an issue (e.g., AI art, surrogacy), this checklist will flag it as "Escalate" constantly. You will become the bottleneck. *Mitigation:* You must make a definitive value call on contested categories and update the "Blocked Categories" list so analysts don't have to escalate the same debate twice.
  *   **The "Existence" Problem:** You noted the worry isn't what the market *does*, but that it *exists*. This checklist struggles there. It assesses the *transaction*. If the transaction is safe but the *category* is corrosive (e.g., "Rent a Friend"), Phase D is your only hook. If your company values are vague, Phase D will fail.
  *   **Compression Loss:** We are compressing "Human Dignity" into "Dignity of Function." This misses subtle harms. It is better than "stomach turn," but it is still a proxy.

  **Final Advice:**
  Your instinct on (c) is correct. The procedure flags it because it monetizes *social truth*. Even if no lie is told, the *implication* is false. Block it, but own the decision as a Value Call, not a Safety Call. Do not let the analyst make that call.
