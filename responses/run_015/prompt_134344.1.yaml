answer: |-
  The 2006 decision by the International Astronomical Union (IAU) to reclassify Pluto from a planet to a dwarf planet serves as a potent contemporary case study for Gottlob Frege's puzzle concerning identity statements. In his seminal 1892 paper "On Sense and Reference," Frege sought to explain how an identity statement of the form $a = b$ can possess greater cognitive value than $a = a$, despite both asserting the same relationship between objects. The Pluto episode illuminates this distinction by separating the stability of the celestial referent from the volatility of the conceptual sense attached to its classification. By analyzing this event through Frege's framework, and subsequently distinguishing between 'planet' as a natural kind versus an institutional kind, we can determine whether the public's cognitive shock stemmed from a discovery of fact or a revision of convention, and what this implies for the epistemic profile of identity statements in social ontology.

  ### Mapping the Case onto Frege's Framework

  Frege's puzzle arises from the observation that while "The Morning Star is the Morning Star" is trivial, "The Morning Star is the Evening Star" is informative, even though both terms refer to the same object (Venus). Frege resolved this by positing that while the *reference* (*Bedeutung*) is the object itself, the *sense* (*Sinn*) is the "mode of presentation" by which the object is given to the mind. Cognitive value resides in the sense, not the reference.

  In the case of Pluto, we must distinguish between the proper name 'Pluto' and the general term 'Planet'.
  1.  **The Referent:** The *Bedeutung* of 'Pluto' is the specific physical body orbiting the Sun in the Kuiper Belt. This referent remained ontologically stable before and after 2006. The ice, rock, and orbit did not change; only the human description of them did. Therefore, the statement "Pluto is Pluto" remained cognitively trivial and true throughout.
  2.  **The Identity Statement:** The informative statement at the heart of the controversy is not "Pluto is Pluto," but rather "Pluto is a planet" (which became false) or "Pluto is a dwarf planet" (which became true).
  3.  **The Cognitive Shock:** Prior to 2006, the sense of 'Pluto' for the general public was inextricably linked to the sense of 'Planet'. The mode of presentation was "the ninth member of the set of major solar bodies." When the IAU announced the reclassification, they effectively asserted that the object referred to by 'Pluto' does not satisfy the sense required for the predicate 'Planet'.

  The cognitive shock experienced by the public was not due to a change in the reference of 'Pluto'—the object remained the same—but rather a divergence in the sense associated with the category 'Planet'. Pre-2006, the sense of 'Planet' was loosely defined by historical precedent and observational prominence. Post-2006, the IAU imposed a precise dynamical definition (specifically, the requirement to "clear the neighborhood" around the orbit). Thus, the statement "Pluto is [the object satisfying the IAU definition of Planet]" turned out to be false. The informativeness lies in the realization that the mode of presentation "Ninth Planet" and the mode of presentation "Kuiper Belt Object failing the clearing criterion" pick out the same referent, yet belong to mutually exclusive categories under the new definitions. The public resistance was a reaction to the decoupling of a familiar sense ("my childhood planet") from the referent, forcing an update in cognitive mapping without a change in the physical world.

  ### Natural Kind vs. Institutional Kind

  To fully grasp the implications of this shift, we must determine the ontological status of the term 'Planet'. Is it a natural-kind term, akin to 'water' or 'tiger', implying an underlying essence waiting to be discovered? Or is it an institutional kind, akin to 'money' or 'border', constituted by collective agreement and rules? This distinction radically alters the Fregean analysis of the identity statement's informativeness and the legitimacy of public attachment.

  **1. 'Planet' as a Natural Kind**
  If 'planet' is a natural-kind term, it refers to a category fixed by mind-independent properties (an essence). Under this reading, the IAU's 2006 decision was not a legislative act but a *discovery*.
  *   **Fregean Implication:** The sense of 'Planet' attempts to describe an intrinsic essence. If Pluto lacks this essence, the statement "Pluto is a planet" was *always* false, even before 2006. The 2006 announcement merely updated our epistemic access to this truth.
  *   **Informativeness:** The identity statement "Pluto is a non-planet" carries the cognitive value of an *a posteriori* necessity (in the Kripkean sense, filtered through Frege). It informs us about the structure of the solar system, not our language.
  *   **Legitimacy of Resistance:** If this reading holds, public resistance is epistemically illegitimate. It represents an attachment to a false sense. The public is clinging to a mode of presentation that fails to map onto the natural reality. Their grief is based on a category error.

  **2. 'Planet' as an Institutional Kind**
  If 'planet' is an institutional kind, its existence depends on "status functions" imposed by collective intentionality (as described by John Searle). Here, the IAU acts as a governing body defining the rules of the category, much like a central bank defines 'currency'.
  *   **Fregean Implication:** The sense of 'Planet' is constituted by the IAU's criteria. In 2006, the IAU did not discover a fact about Pluto; they changed the *Sinn* of the word 'Planet' itself. They altered the mode of presentation required to access the category.
  *   **Informativeness:** The statement "Pluto is a dwarf planet" is informative not because we learned something new about Pluto's physics, but because we learned the rules of our linguistic institution have changed. It is a normative truth, not merely a descriptive one.
  *   **Legitimacy of Resistance:** Under this reading, public resistance gains legitimacy. If 'planet' is a cultural and educational category as much as a scientific one, the IAU unilaterally altered the sense associated with a term embedded in public culture. The cognitive shock is not just about astronomy; it is about a breach in the social contract of language. The public's attachment to the old classification is a defense of the stability of the *sense* that allows for intergenerational communication.

  ### Conclusion: The Epistemic Profile of Institutional Identity

  The Pluto episode ultimately reinforces Frege's central thesis—that cognitive value tracks divergence in sense—while revealing a nuance regarding the *source* of that sense. Frege's original examples (Morning Star/Evening Star) relied on empirical discovery to align two distinct senses with one reference. The Pluto case, however, demonstrates that in institutional contexts, the senses themselves are malleable by fiat.

  If we treat 'planet' as an institutional kind, the 2006 reclassification shows that identity statements involving socially constructed categories have a different epistemic profile than Frege's astronomical examples. In Frege's puzzle, the informativeness of $a = b$ comes from realizing that two independent paths lead to the same object. In the Pluto case, the informativeness of "Pluto is a dwarf planet" comes from realizing that the path previously labeled 'Planet' has been rerouted. The reference (Pluto) stayed still; the signpost ('Planet') was moved.

  However, this does not refute Frege; it extends him. It confirms that cognitive value *always* tracks a divergence in sense, regardless of whether the kind is natural or conventional. The public outrage was not a failure to understand reference, but a keen intuitive grasp that the *sense*—the mode of presentation that gives the object meaning in human discourse—had been severed from the object. Whether 'planet' is natural or institutional, the Pluto incident demonstrates that identity is not merely a relation between objects, but a relation between *concepts* held by a community. The shock was the realization that while the heavens remain unchanged, the senses by which we navigate them are subject to revision, and with them, the cognitive value of our most basic identity statements. Thus, the puzzle endures: we are not disturbed by changes in the world, but by changes in the light by which we see it.
