          *   Address the referent of 'Pluto' (did it change?).
          *   Address the cognitive shock (shift in *sense* of 'planet' vs. change in reference).
      *   **Key Task 2 (Distinction):** Distinguish between 'planet' as a *natural-kind term* (essence) vs. an *institutional kind* (IAU convention).
          *   How does each reading affect the informativeness of the identity statement?
