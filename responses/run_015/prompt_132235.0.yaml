prompt: |-
  You are a professional social choice theorist with expertise in mechanism design and the axiomatic analysis of voting rules. Before answering, please spend a few sentences brainstorming the key correspondences and disanalogies you want to cover, then present your analysis in a structured, formal manner.

  In public debates about electoral reform, advocates often invoke a pairing of analogies. The first compares a strategy-proof social-choice mechanism to a second-price auction: just as a bidder in a Vickrey auction has a dominant strategy to bid her true valuation, a voter in an ideal mechanism should be able to report her true preference ranking without fear of being punished for sincerity. Reformers then extend this by saying that ranked-choice voting works like a sports tournament bracket — candidates are eliminated round by round — and that this structure reduces strategic incentives because weak candidates are removed before they can act as spoilers.

  Against this, critics routinely cite the Gibbard-Satterthwaite impossibility result: any deterministic, non-dictatorial rule that allows three or more alternatives and respects an unrestricted preference domain is vulnerable to strategic manipulation. They sometimes summarize this by saying that manipulation is unavoidable like friction in any physical machine — an inherent cost rather than a design flaw.

  More recently, I have seen a niche framing imported from machine-learning robustness: the preference profile is treated as a vector in a discrete space, and a strategic misreport is treated as an adversarial perturbation — flipping a single adjacent pair in a voter's ranking — that can cause a discontinuous jump in the winner. On this view, strategy-proofness is analogized not to truthful bidding but to adversarial robustness, with the social-choice function having a kind of Lipschitz constant with respect to preference perturbations.

  Please audit both the auction-tournament pairing and the adversarial-perturbation framing. For each, provide an explicit correspondence table mapping elements from the source domain onto elements in the target domain (for example, bidder maps to voter, true valuation maps to true preference ordering, auctioneer maps to election administrator, perturbation vector maps to misreported ranking). Then identify precisely where the mapping breaks: does the auction analogy illegitimately import transferable utility and quasilinear preferences that ordinal voting lacks? Does the tournament bracket analogy obscure the fact that elimination order depends on the very preferences being reported? Does the adversarial-ML analogy smuggle in a metric or topology on the space of preference orderings that social-choice theory does not naturally supply, and does it conflate discontinuity in the mechanism with strategic gain?

  Next, assess whether the practical conclusions drawn from these analogies survive the disanalogies. Does the claim that manipulation is unavoidable, therefore we should accept it, hold up once we see that the friction analogy hides normative differences between unavoidable physical loss and avoidable institutional design failure? Does the adversarial-robustness framing actually help us design better rules, or does it merely redescribe the impossibility result in different vocabulary?

  Finally, state whether either analogy genuinely supports the reform positions it is used for, and propose a more accurate analogy — perhaps drawn from judicial recusal rules, error-correcting codes, or contract design — that captures what strategy-proofness demands without importing false structural commitments.
