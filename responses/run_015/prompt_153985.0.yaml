  Your intuition that "right but early" is a distinct epistemic category from "falsified and rescued" is sound, and it maps closely onto Imre Lakatos's distinction between a **progressive** and a **degenerating** research programme. As a physicist, you are naturally attuned to the difference between a parameter error (tuning a constant) and a structural error (wrong equation). In philosophy of science, the demarcation lies in whether the modifications made to save the theory possess **independent empirical content**.

  ### The Principle: Independent Corroboration of Auxiliaries

  A theory is "right but early" if its **core causal mechanism** remains invariant and the discrepancy between prediction and observation is resolved by adjusting **auxiliary hypotheses** (initial conditions, parameters, boundary constraints) that are corroborated by evidence *independent* of the anomaly they explain. Conversely, a theory is "falsified and rescued" if survival requires *ad hoc* modifications that merely accommodate the failure without generating novel, independently testable predictions, or if the core mechanism itself must be altered to fit the data.

  In your terms:
  *   **Right but Early:** Error is in *boundary conditions* or *magnitude* (Hubbert's US peak, potentially Malthus).
  *   **Falsified/Rescued:** Error is in *causal structure* or *closed-system assumptions* (1900 Coal, potentially Limits to Growth).

  ### Re-evaluating Your Verdicts

  To achieve coherence across your four cases, you must revise your verdict on **Thomas Malthus**.

  You classify Malthus as "right but early" (chronometric error) and *Limits to Growth* (LtG) as "falsified" (structural error). However, these models are structurally identical: both posit exponential demand pressing against linear or finite supply.
  *   **Limits to Growth:** You argue it is falsified because it required "structural rescues" (recycling, substitution). Yet, recent historical analysis (e.g., Herrington, 2022) shows the LtG "Standard Run" scenario tracks 1970–2020 data remarkably well without structural alteration; the "collapse" is simply later than the original 2020 window. If Malthus is "right but early" because the constraint is real but the timing was off, LtG must be granted the same status.
  *   **Malthus:** You argue the mechanism (reproductive potential) is intact. However, the *Demographic Transition* demonstrates that human fertility is not a biological constant (geometric) but a variable dependent on economic development. Malthus missed a **negative feedback loop** in the core mechanism. This is not a parameter error; it is a structural omission similar to the "technological substitution" in LtG.

  **Revision:** To be coherent, you must treat Malthus and LtG identically. Given that LtG's system dynamics actually track historical data better than Malthus's biological imperative, the stronger philosophical move is to revise **Malthus** to "Falsified/Rescued." The core mechanism (unchecked geometric growth) is false for humans; the "rescue" is the sociological discovery of the demographic transition, which Malthus's model cannot internally generate.

  ### The Fusion Case

  Is magnetic-confinement fusion like Hubbert (parameter error) or *Limits to Growth* (structural rescue)?

  *   **The Core:** The physics of thermonuclear cross-sections is invariant and confirmed (Hubbert-like).
  *   **The Auxiliaries:** The barriers are confinement time, temperature, and materials resilience.
  *   **The History:** Predictions have slipped by "twenty years" per decade.

  **Analysis:** Fusion is currently exhibiting the symptoms of a **degenerating shift** (LtG-like) in its *engineering predictions*, but remains a **progressive shift** (Hubbert-like) in its *physics*. The "twenty years" claim relies on engineering auxiliaries (magnet strength, plasma stability). When these fail, new designs (tokamak to stellarator, copper to superconducting) are introduced. Crucially, these technologies (e.g., high-temp superconductors) are often developed for *other* industries (MRI, accelerators) and then applied to fusion. This provides **independent corroboration** of the auxiliaries.

  **Prediction:** Fusion is **Hubbert-like ("Right but Early")**. The barrier is magnitude (engineering scale), not kind (new physics). Unlike the 1900 Coal prediction (which assumed a closed energy regime), fusion acknowledges the need for technological advancement. Unlike LtG, the modifications (better magnets) are not invented solely to save the model but are part of a broader materials science progression. However, the *economic* viability prediction may still be falsified if the parameters converge on a cost curve that exceeds alternatives.

  ### Epistemic Vulnerabilities and Changing My Mind

  **Where my reasoning is vulnerable:**
  The **Duhem-Quine thesis**. There is no algorithmic way to distinguish a "core mechanism" from an "auxiliary hypothesis." A proponent can always claim a failure is due to a boundary condition (auxiliary) rather than the law (core). My classification relies on a consensus about what constitutes the "core," which is theory-laden. For example, is "human fertility is constant" core to Malthus or an auxiliary assumption about the 18th century?

  **What would change my mind:**
  1.  **For Limits to Growth:** If future data (2030–2050) shows global industrial output per capita continuing to rise indefinitely without environmental feedback (pollution/climate) constraining it, LtG must be reclassified as "Falsified" (like Coal), implying the core feedback loops are weaker than modeled.
  2.  **For Fusion:** If achieving net energy (Q>10) requires discovering a new physical confinement regime fundamentally different from current magnetic inertia (e.g., if tokamaks are physically impossible at scale regardless of engineering), it becomes "Coal-like" (mechanism failure).
  3.  **For the Principle:** If a theory classified as "Falsified" (e.g., Malthus) begins making accurate *novel* predictions without structural change, I would have to abandon the "core mechanism" criterion in favor of pure predictive success.

  ### Conclusion

  Your judgments are largely coherent regarding resource extraction (Hubbert/Coal), but inconsistent regarding feedback systems (Malthus/LtG). Aligning them requires acknowledging that missing feedback loops constitute structural errors, not just timing errors.

  Verdict: \answer{A theory is "right but early" only if its core causal mechanism remains invariant and all temporal deviations are resolved by auxiliary hypotheses that possess independent empirical confirmation rather than merely accommodating the anomaly.}
