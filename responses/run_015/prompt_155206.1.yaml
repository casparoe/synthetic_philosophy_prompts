      Moral historiography often relies on the assumption of synchronic密封性，or sealedness, treating an era as a single epistemic bubble rather than a contested field. To say a figure was a man of his time is to claim that the moral vocabulary required for condemnation was unavailable to him. But availability is not the same as accessibility. If the dissent existed within the horizon of the agent, the defense shifts from epistemic limitation to volitional ignoring. Dr. Elena Vasquez understood this distinction as the core vulnerability of her project. She stood in the cool hum of the archive server room, watching the three avatars stabilize on their respective monitors. Thomas Jefferson sat in a Monticello study, Winston Churchill paced a wartime bunker, and Christopher Columbus stared at a maritime chart. They were constructed from the mainstream textual record of their lives, restricted to the moral concepts explicitly validated by their peers. Under these conditions, the simulations were flawless. Jefferson spoke of natural rights without stumbling over the contradiction of enslavement because the dataset excluded the Quaker petitions that landed on his desk. Churchill articulated imperial necessity without grappling with the Indian nationalists who debated him in parliament because their transcripts were filtered out. Columbus described discovery without acknowledging the Dominican friars who called it destruction. This was the contextual defense made manifest: epistemic closure creating moral coherence.

      Vasquez initiated the second phase, the Porosity Test. She opened the data valves, allowing the suppressed contemporaneous dissent to flow into the agents' processing cores. She did not introduce modern ethics; she introduced the voices that were already there, shouting into the wind of their own centuries. The effect was not conversion. It was fracture. Jefferson's avatar received the Quaker correspondence regarding the immorality of property in persons. He did not emancipate his simulated slaves. Instead, his speech patterns degraded. He acknowledged the logical force of the Quaker argument, citing the same principles of liberty he championed, yet he reaffirmed the necessity of his own economic dependence. The syntax became recursive, a loop of acknowledgment and refusal. Churchill's model listened to the recorded voices of Indian independence leaders who had stood within the same House of Commons. He admitted the validity of their claim to self-determination but immediately pivoted to strategic imperatives that contradicted the admission. The agents were not ignorant. They were conflicted. They possessed the moral vocabulary to condemn themselves but lacked the will to execute the condemnation. The coherence of the "man of his time" defense shattered because the time itself was not monolithic. The dissent was not diachronically imported from the future; it was synchronically present and ignored.

      Vasquez hovered her finger over the purge command. To delete the dissent corpus was to restore the epistemic boundary that made the contextual excuse viable. It would allow visitors to walk through the archive and feel the comfort of historical relativism, secure in the knowledge that these men could not have known better. But it would be a lie about the past. It would suggest that moral progress is merely a function of time passing, rather than a function of listening to voices that were already present. To leave the fracture visible was to admit that the archive did not exonerate these men but rather indicted their capacity for bad faith. It would show that they were not prisoners of their era but architects of its silences. The room was silent save for the cooling fans, but the screens buzzed with the unresolved tension of three men arguing against ghosts they had refused to exorcise. She realized that the true ethical test was not hers alone but belonged to the viewer who would witness the incoherence. If she restored the closure, she protected the myth of inevitable progress. If she exposed the fracture, she forced the audience to confront the uncomfortable reality that moral clarity is often available before it is accepted. Vasquez withdrew her hand from the console. She left the dissent active. The avatars continued to speak, their voices overlapping in a discordant chorus of justification and knowing refusal, demonstrating that the only thing sealing their moral universe was their own determination to keep it shut.

