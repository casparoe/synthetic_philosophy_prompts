answer: |-
  **1. The Causal Collapse**
  **Question:** You argue that the reformer needn't understand the original purpose *or* the present effects of a practice, only that *some* reason for its existence likely obtained. But if the justification is simply that removal constitutes an "unmodeled intervention," doesn't this reduce to ordinary causal inquiry with a high uncertainty discount?
  **Note on Likely Reply:** She will likely insist it is *not* merely a discount, but an asymmetry of knowledge: we know the risk of removal is opaque, whereas the risk of retention is already priced into the system's survival.
  **Follow-up:** If it is merely risk asymmetry, why the rhetorical emphasis on *ignorance of origins*? Does that not do illegitimate work by shielding the practice from the very causal inquiry you claim to respect, effectively treating "we don't know why" as a positive argument for "it works"?

  **2. The Symmetry of Filtering**
  **Question:** You ground the asymmetry between fence and reformer in the idea that the status quo has survived an adversarial filtering process that proposals have not. But how do you handle "zombie practices"—liturgical vestments, sumptuary rules, degree requirements—that persist without any apparent adversarial pressure?
  **Note on Likely Reply:** She will likely argue that these are local exceptions or that the "filter" is broader than immediate political contestation (e.g., social cohesion filters).
  **Follow-up:** Who then carries the empirical burden of showing the filter *was* operating? If I say "this degree requirement never faced selection pressure," do you require me to prove the negative, or must you prove the positive? If the latter, doesn't the presumption of wisdom vanish until the history is written?

  **3. The Dead Fence Test**
  **Question:** What would you count as evidence that a fence is genuinely dead? Can you name a historical practice you would concede was a "dead fence" whose removal caused no systemic harm?
  **Note on Likely Reply:** She will likely point to a technological obsolescence, such as agricultural taboos rendered moot by modern preservation, or perhaps the corset.
  **Follow-up:** If you concede a case, what is the *test* that identified it? Is it possible for the principle to fail a test at all, or does "survival" simply redefine "work" to fit the outcome, making the principle unfalsifiable?

  **4. Restoration vs. Innovation**
  **Question:** Burke defended the 1688 settlement as a restoration of ancient rights rather than an innovation. But any reformer can narrate their change as a return to first principles. What distinguishes a true restoration from an innovation masquerading as one?
  **Note on Likely Reply:** She will likely lean on the continuity of spirit or the intergenerational consensus surrounding the change, arguing that restoration preserves the "partnership" while innovation breaks it.
  **Follow-up:** That is an ex-post judgment. Ex-ante, what procedural marker distinguishes them? If there isn't one, doesn't the "restoration" label become a rhetorical shield that allows any radical change to claim the immunity of the status quo?

  **5. The Language Analogy**
  **Question:** You draw an analogy between inheriting a practice and inheriting a language, leaning on Burke's image of a partnership among the living, the dead, and the unborn. But a grammar is descriptive, whereas a political rule is prescriptive and enforced by sanction.
  **Note on Likely Reply:** She will likely argue that the "sanction" is simply the cost of social breakdown or miscommunication, akin to the penalty of being misunderstood in speech.
  **Follow-up:** A grammar doesn't punish you for a solecism; a state does. What carries the *normative authority* across that analogy when the inherited item is a rule backed by force? Why does the "partnership" obligate the living to obey a grammar they cannot amend without penalty?

  **6. Institutionalizing the Burden**
  **Question:** You propose institutionalizing the principle by requiring a documented account of a rule's history before repeal. But why does that burden fall on the remover? Why does no equivalent burden fall on those who keep the rule to maintain the manual?
  **Note on Likely Reply:** She will likely argue that stability is the default good and that requiring history for retention would invite ideological clearing or perpetual review that destabilizes governance.
  **Follow-up:** If the archival work is perfunctory, the burden is discharged cheaply. If it's rigorous, it calcifies the status quo. How do you prevent the procedure from becoming a box-ticking exercise that legitimizes ignorance, while still avoiding the trap where the retainer bears no cost for maintaining obsolete rules?

  **7. The Moral Valence of Survival**
  **Question:** Survival indicates a practice is doing "work." But if that work is the stable oppression of a minority, survival is evidence of efficiency, not value. Does your principle inadvertently privilege stable oppression over unstable justice?
  **Note on Likely Reply:** She will likely maintain that the principle is epistemic, not moral: it tells you what *is* functioning, not whether that function is *good*, and that moral judgment must be layered on top.
  **Follow-up:** But if the epistemic weight always favors the status quo, doesn't the moral burden become impossible to meet? Are you not encoding a conservative bias into the epistemology itself, such that the "work" of oppression is granted the same deference as the "work" of cohesion?

  **8. Falsification and Concession**
  **Question:** Close with this: What empirical finding, class of cases, or historical episode would lead you to restrict or abandon the principle entirely?
  **Note on Likely Reply:** (Variable) She may suggest systematic evidence that reformers consistently outperform tradition in specific domains, or a case where adherence to the principle caused catastrophic harm.
  **Follow-up (Version if she concedes nothing):** If no empirical finding could falsify it—if every survival proves function and every failure proves we didn't wait long enough—is this a political principle or an article of faith?
  **Follow-up (Version if she concedes something):** [To be deployed based on her specific concession, e.g., "If that case occurred, would you apply the principle retroactively to condemn the reform, or prospectively only?"]
