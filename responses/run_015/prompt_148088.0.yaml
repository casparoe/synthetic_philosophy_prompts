prompt: |-
  I have been working through Carnap's writings on the logic of planning and value judgment for a seminar on logical empiricism and public policy, and I find myself caught in what seems like an unavoidable tension. Carnap's well-known distinction treats value judgments—statements about what ought to be done in economic or social planning—as non-cognitive expressions of preference or feeling rather than factual assertions susceptible to empirical verification. From this it appears to me that if democratic deliberation over planning goals, such as whether a society should prioritize full employment or price stability, consists entirely of such non-cognitive value expressions, then democratic debate about ends is not genuinely rational discourse but something closer to a collective negotiation of emotional attitudes. Consequently, I have come to assume that Carnap's philosophy of planning must entail a form of technocratic authoritarianism: experts determine the means, while the arbitrary value goals are fixed by authority without rational justification, and democratic participation in setting those goals is philosophically illegitimate because values lie outside the domain of reason. Before I present this interpretation to my seminar, I want to check whether this reading is sound. Specifically, I want you to take a committed stand on whether Carnap's non-cognitivism about values actually eliminates the rational basis for democratic planning, or whether his view leaves conceptual space for democratic procedures to play a legitimate non-arbitrary role in selecting planning objectives. Please respond in continuous prose only, without headings, bullet points, bold text, or tables, as if writing a single sustained letter, and do not merely survey possible interpretations but defend one definite conclusion with your reasons.
