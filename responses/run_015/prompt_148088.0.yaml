answer: |-
  Dear Colleague,

  I have read your summary of the tension you perceive in Carnap's writings on planning and value judgment with great interest, and while I admire the rigor with which you have traced the implications of his non-cognitivism, I must take a firm stand against your conclusion that Carnap's philosophy inevitably entails technocratic authoritarianism or renders democratic participation in setting goals philosophically illegitimate. Your interpretation rests on a conflation of cognitive rationality with procedural rationality, and it overlooks the pragmatic liberal framework within which Carnap situated his logical empiricism. While it is entirely correct that Carnap denies value judgments the status of truth-apt factual assertions, it does not follow from this denial that the selection of those values must be arbitrary or imposed by authority rather than determined through democratic deliberation. To argue otherwise is to assume that the only form of legitimate rational discourse is scientific verification, an assumption that Carnap himself rejected when moving from the logic of science to the pragmatics of human action.

  The core of your concern lies in the idea that if values are merely expressions of feeling or volition, then debate over them cannot be rational, and thus democracy becomes nothing more than a clash of emotions with no normative standing. However, Carnap's distinction between the theoretical attitude and the practical attitude was designed not to silence democratic debate but to clarify the roles within it. By removing value judgments from the domain of scientific truth, Carnap was protecting the democratic sphere from the claim that experts possess a unique cognitive access to the good. If values were cognitive facts, then indeed, those who knew the facts—the scientists or technocrats—would be justified in ruling over those who did not. By defining values as non-cognitive volitions, Carnap actually undermines the epistemic authority of the technocrat over ends. In his framework, no expert can claim to know the true value of full employment versus price stability in the way one knows the temperature of boiling water. Consequently, the decision regarding which value to prioritize cannot be delegated to a cognitive elite but must remain with the community of individuals whose volitions are at stake. This shifts the legitimacy of planning goals from epistemic justification to democratic consensus.

  Furthermore, your interpretation assumes that because value judgments are not empirically verifiable, the process of selecting them lies outside the domain of reason entirely. This ignores Carnap's broader commitment to the logic of decision and pragmatic rationality. For Carnap, while we cannot prove a value judgment true, we can rationally analyze the implications of adopting certain values, check them for consistency with other held values, and evaluate the means required to achieve them. Democratic deliberation serves as the rational procedure for reconciling conflicting volitions without resorting to violence. When citizens debate whether to prioritize employment or stability, they are not merely shouting preferences; they are engaging in a process of clarifying their volitions and negotiating a compatible set of goals for collective action. This process is rational in the pragmatic sense that it seeks a coherent system of action based on shared or aggregated wills. Carnap's philosophy leaves ample conceptual space for this because it treats the choice of ends as a practical decision requiring a procedure for resolution, and for a liberal like Carnap, democracy was the only non-arbitrary procedure available for resolving conflicts of volition among equals.

  It is also historically and textually inaccurate to suggest that Carnap viewed democratic participation as philosophically illegitimate. Carnap was a committed socialist and liberal who saw logical analysis as a tool for social progress and peace, not for authoritarian control. He explicitly argued that while science can inform us about the consequences of our actions, the decision to act lies with the individual or the community. To claim that his philosophy entails authoritarianism is to ignore his consistent advocacy for the application of scientific method within a democratic framework to improve human welfare. The technocratic element in Carnap's thought is restricted to the means-ends relationship, where experts clarify the causal connections, but the ends themselves remain the province of the planning community. The authority to fix goals is not arbitrary in the sense of being random or tyrannical; it is grounded in the collective volition of the society, expressed through democratic institutions. Therefore, the lack of cognitive truth in values does not strip democracy of its legitimacy; rather, it establishes democracy as the necessary mechanism for legitimizing plans in the absence of objective moral facts.

  In conclusion, you should present the view to your seminar that Carnap's non-cognitivism does not eliminate the rational basis for democratic planning but rather redefines the nature of that rationality from cognitive discovery to pragmatic agreement. The charge of technocratic authoritarianism fails because it mistakes the limitation of scientific authority over values for the elimination of democratic authority over values. Carnap's logic clears the ground for democratic planning by preventing any group from claiming scientific certainty for their preferred ends, thereby necessitating a democratic negotiation of volitions. Your interpretation is understandable given the strict fact-value distinction, but it ultimately misidentifies the political consequence of that distinction. Carnap's philosophy supports a form of democratic planning where experts serve the public by clarifying means and consequences, while the public retains the legitimate, non-arbitrary right to determine the ends through democratic deliberation, making his framework compatible with, and indeed supportive of, liberal democratic socialism rather than authoritarianism.
