answer: |-
  This is an incredibly sophisticated prompt for a high school junior. You have identified a genuine tension in legal philosophy and institutional design that many adults never notice. You are asking about the *teleology* of marriage (what is it *for*?) versus its *ontology* (what *is* it?).

  Per your request, I am going to walk you through my analytical process first. I'll lay out the brainstorming phase where I break down the components of the system, and then I will synthesize that into the structured argument you can use for your paper.

  ### Phase 1: Analytical Brainstorming & Deconstruction

  Before we can say what the system *means*, we have to list exactly what the system *does*. Here is the breakdown of the current US/Western model of civil marriage:

  1.  **The Dyadic Limit:** Exactly two people.
      *   *Initial thought:* Is this biological? No. Is it about resource division? Maybe. Two is mathematically simple for inheritance (50/50). Three introduces game theory problems (two against one).
      *   *Institutional reason:* The state wants a clear "unit of responsibility." If a medical bill comes, who pays? If two people are married, they are jointly liable in many contexts. With three, liability gets messy.
  2.  **The Bundling:** You can't just get the tax break without the inheritance rights. You can't get hospital visitation without the potential alimony obligation.
      *   *Initial thought:* This is administrative efficiency. It's cheaper for the state to have one "Marriage" switch than 50 different "Care Contracts."
      *   *Philosophical implication:* This implies the state sees these things as a *package deal* of human life. It assumes if you are intimate enough for sex/romance, you are also economically interdependent.
  3.  **The Ceremony/Officiant:** You can't just file a form at the DMV. You need a performance.
      *   *Initial thought:* This is "costly signaling." In economics, if something is hard to do, it proves you are serious.
      *   *Philosophical implication:* Marriage isn't just a contract; it's a *status*. The ritual transforms you from "individuals" to "a unit." It creates a public record that overrides private wishes (e.g., you can't easily opt out of alimony).
  4.  **The Romantic Presumption:** You generally can't marry your aunt or best friend.
      *   *Initial thought:* This is the biggest clue. If the goal was "care," an aunt and niece should qualify. If the goal was "household stability," roommates should qualify.
      *   *Conclusion:* The goal is *not* just care. It is specifically regulating *adult sexual/romantic pairing*.

  **Brainstorming Conclusion:** The current system isn't actually designed around "care." It is designed around a specific *type* of relationship (romantic/sexual) that the state has decided is the primary building block of society. The "care" benefits are a subsidy to encourage people to enter that specific structure.

  ***

  ### Phase 2: Reconstructing the Implicit Philosophical Theory

  Now, let's turn that brainstorming into the core analysis for your paper. You asked what theory makes the current system make sense.

  **The Theory: "The Nuclear Family as a Privatized Welfare State"**

  The implicit theory behind current marriage law is not primarily about love, nor is it strictly about care. It is a theory of **social risk management.**

  Here is the reasoning: The state knows that people get sick, old, and poor. Ideally, the state would care for everyone. But that is expensive. So, the state creates an incentive structure (marriage) that encourages adults to pair up and promise to take care of *each other* so they don't have to rely on the state.

  *   **Why two people?** A dyad is the smallest possible group that creates mutual dependency. It is the most efficient "mini-welfare state."
  *   **Why romantic?** Historically, this comes from the need to track lineage for property. But in the modern era, it persists because the state assumes romantic bonds are the most likely to result in *long-term* financial entanglement and child-rearing. The state is betting that romantic love is a strong enough glue to keep the "welfare unit" together.
  *   **Why bundled?** Because the state wants to create a "total institution." By bundling tax, medical, and inheritance rights, the state makes it very costly to leave the marriage. This "lock-in" effect ensures the care arrangement lasts longer, which saves the state money in the long run.
  *   **Why the ceremony?** To mark the moment the state transfers responsibility from the public sphere to the private sphere. It is the moment you become responsible for another adult.

  **Is this theory coherent?**

  This is where your paper can get really sharp. The theory is **internally consistent but externally contradictory.**

  *   **Consistent:** If the goal is to create stable, two-person economic units that reduce state burden, the laws make sense. They make it hard to enter (ceremony), hard to exit (divorce law), and rewarding to stay (tax breaks).
  *   **Contradictory:** The system claims to support "care" and "family," but it excludes actual caregivers.
      *   *The "Care Gap":* If an elderly woman lives with her niece who cares for her full-time, they get fewer legal protections than a same-sex couple who have been together for two months. This proves the law is not actually about *care*; it is about *relationship type*.
      *   *The "Stability" Contradiction:* If the goal is stability, why ban polyamorous groups? A three-person household might be *more* economically stable (three incomes) and provide *more* care (three people to watch the kids) than a two-person household. Banning them suggests the state cares more about *normative morality* (what relationships look like) than *functional outcomes* (how well people are cared for).

  ### Phase 3: The Alternative Model (Care-Network Modularization)

  You mentioned "care-network modularization." In philosophy, this is often discussed under terms like "Minimal Marriage" (Elizabeth Brake) or "Designated Beneficiary Agreements."

  If we replaced the current system with a view where marriage is just a customizable contract for care, here is exactly what would have to change in the law:

  1.  **Shift from Status to Contract:**
      *   *Current:* Marriage is a **Status**. The government defines what it is, and you opt-in. You get the pre-set package.
      *   *New:* Care is a **Contract**. Adults can draft specific agreements. "I want my best friend to have my medical power of attorney, but I want my brother to have my inheritance."
  2.  **Unbundling of Rights:**
      *   The government would separate the "benefits." You could file a *Medical Proxy Form* with Person A, a *Tax Household Form* with Person B, and a *Housing Tenancy Form* with Person C.
      *   *Institutional Impact:* This increases bureaucratic complexity. The state saves money on welfare but spends more on administration.
  3.  **Removal of the "Romantic" Test:**
      *   The law would become neutral regarding *why* you care for each other. Whether it is sexual, platonic, or familial would be irrelevant. The only test would be **interdependency**. Do you share bills? Do you provide daily care?
  4.  **Liability and Number Limits:**
      *   To allow trios or networks, contract law would need to specify liability. In a trio, if one person incurs debt, are the other two liable? The law would need to move from "joint and several liability" (default in marriage) to "proportional liability" (based on the contract).

  ### Phase 4: Suggestions for Your Paper's Thesis

  Since you are a junior, you want a thesis that is arguable but manageable. Here are three options ranging from descriptive to normative:

  *   **Option 1 (The Critical Approach):** "While modern marriage law claims to protect care and stability, its restriction to dyadic romantic pairs reveals that its true function is social control and the privatization of welfare, rather than the support of vulnerable people."
  *   **Option 2 (The Reform Approach):** "A modular system of care contracts would better achieve the state's own stated goals of stability and support than the current bundled marriage model, as it aligns legal rights with actual economic and caregiving realities."
  *   **Option 3 (The Philosophical Approach):** "The requirement of a ceremonial, two-person marriage presupposes that romantic love is the only valid foundation for adult dependency. This presupposition is incoherent because it excludes non-romantic care networks that provide equal social value."

  ### Final Advice for Writing

  1.  **Define your terms:** Early in the paper, define "Bundling" (getting all rights together) vs. "Modularization" (picking specific rights).
  2.  **Use the "Aunt Test":** This is your strongest example. Ask the reader: *Why can a romantic partner make medical decisions for you after two months, but a sister who raised you cannot?* This highlights the emotional core of the problem.
  3.  **Don't ignore the counter-argument:** A smart paper acknowledges why the current system exists. Acknowledge that "Modularization" is complicated. It is easier for a hospital to check "Are they married?" than to read a custom contract. Your job is to argue whether that convenience is worth the exclusion.

  You have spotted a real flaw in the matrix of social organization. Don't let anyone tell you this is "too complex" for high school. It's exactly the kind of institutional analysis that college professors love to see. Good luck with the draft!
