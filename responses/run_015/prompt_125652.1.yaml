      *   *Check:* Is the "colonization" insight central? *Correction:* Yes, build the "Agency" argument around it.
      *   *Check:* Is the mechanism specific enough? *Correction:* Need to talk about the anterior cingulate cortex vs. somatosensory cortex distinction (affective vs. sensory).

  8.  **Final Polish:** Ensure the ending is supportive but clear on the stakes. (The user is grieving; don't be cold, but be rigorous).

  *(Self-Correction on the "Money" aspect)*: The user says "real money going behind this." I need to be careful not to give financial advice, but rather *philosophical risk assessment* regarding the funding target.

  *(Refining the "Mechanism")*: The user asks: "gain on an aversive channel, a brake on attentional capture, speeded habituation, something else." I need to pick one or rank them. *Attentional Capture* seems most aligned with "colonization." *Affective Gain* is the biological lever. I should argue for capping Affective Gain to limit Attentional Capture.

  *(Refining the "Weakest Link")*: The weakest link is the *political/biological stability* of the cap. If the cap is editable, it will be edited. If it's hard-coded, it might be maladaptive.

