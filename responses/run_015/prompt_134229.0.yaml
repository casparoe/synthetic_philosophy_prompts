  8.  **Finalizing the Structure:**
      *   **0-5:** Setup & Intuition Pump (The "Pain is Bad" consensus).
      *   **5-15:** The Case (Mrs. G). Disrupt the consensus.
      *   **15-30:** The Taxonomy (The 3 Claims). Map the case.
