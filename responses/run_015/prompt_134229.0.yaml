      Okay, I will structure the discussion to show that Asymbolia *preserves* Sensation but *removes* Badness. Therefore, Badness cannot be identical to Sensation (Claim 1 goes).
      Does it remove Aversion (Claim 2)? Yes.
      Does it remove Life Interference (Claim 3)? Maybe not entirely (they still know they are injured).
      So Claim 1 is the casualty.

