      Left: "Common Sense View" (Sensation + Badness = One Thing).
      Middle: "The 3 Components" (Sensation, Reaction, Interference).
      Right: "Parking Lot" (Real Pain? Meds?).

      *Closing Question:* "You have 10mg of morphine. Patient A screams (Normal Pain). Patient B smiles (Asymbolia) but has the same injury. Who gets the morphine? Why?" (Forces them to define what they are treating).

