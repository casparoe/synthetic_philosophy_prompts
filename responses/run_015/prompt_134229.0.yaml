      Structure:
      1. Direct answers to the four sticking points.
      2. The Minute-by-Minute Plan.
      3. Whiteboard Layout.
      4. Scripting key transitions.
      5. The Closing Question logic.

      *Self-Correction on the "Three Claims":*
      Claim 2 (Aversion) and Claim 3 (Life Interference) are closely related. Asymbolia patients *can* still protect the limb (withdrawal reflex often intact), so "Life Interference" is tricky. They don't *learn* to avoid it.
      I should advise the user to clarify Claim 3 as "Long-term narrative harm" vs Claim 2 "Immediate motivational push."
      Actually, for a non-philosophy group, Claim 2 (Motivation/Aversion) and Claim 3 (Functional Cost) might blur.
