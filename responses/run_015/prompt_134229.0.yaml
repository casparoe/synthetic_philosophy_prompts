      *Checking "What to rule out".*
      "Are they really in pain?" is the big one. "Should we medicate?" is the second.
      Is there a third? "Is this brain damage?" (Medicalizes the philosophy too much). Keep it on experience.

      *Time Management:* 45 mins content. 5 mins buffer.
      Intro: 5
      Case: 10
      Taxonomy/Analysis: 20
      Implications/Close: 10
      Total: 45.

      *Tone:* Respectful of clinical expertise, humble on philosophy. "You are the experts on pain, I'm just here to help you map it."

