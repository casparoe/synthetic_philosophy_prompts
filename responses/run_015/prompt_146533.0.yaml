answer: |-
  **Project Title:** Operationalizing Inquiry: A Deweyan Diagnostic for Technocratic Deliberation

  **Research Question**
  Does the "Reframing Condition"—the requirement that a mechanism allow participants to revise ends-in-view rather than merely optimize means—yield a set of necessary and sufficient structural constraints for participatory institutions that resolve the regress of institutional design and the problem of the absent public without importing external normative premises?

  **Statement of the Problem**
  Contemporary governance increasingly relies on participatory mechanisms (citizens' assemblies on climate, AI governance boards, deliberative polling) to legitimize technical decisions. Designers describe these as democratic deliberation, yet they often function as aggregative mechanisms that treat preferences as fixed inputs. My project argues that John Dewey's logic of inquiry supplies a principled distinction between aggregation and inquiry. Specifically, a mechanism counts as inquiry only if it satisfies the Reframing Condition: it must allow the problem definition itself to be mutated by the process.

  Current literature fails to operationalize this distinction. Standard Dewey scholarship focuses on democracy as "associated living" or historical exegesis, offering no traction for institutional design. Mainstream deliberative democracy theory (e.g., Habermasian or Rawlsian variants) focuses on legitimacy, consensus, or reason-giving validity claims, often treating the agenda as pre-political or assuming preferences are malleable without specifying the *structural* conditions required for that malleability. Consequently, we lack a diagnostic to distinguish a citizens' assembly that genuinely inquires from one that merely ratifies expert constraints. This project seeks to construct that diagnostic and test its limits against two internal problems: the regress of design (who designs the designers?) and the absent public (how to represent future/unidentified victims of technical systems).

  **Methodology and Timeline (Nine Months)**
  The project proceeds in three phases, moving from theoretical resolution to case application to diagnostic formulation.

  *Months 1–3: Theoretical Constraints and Stopping Rules*
  I will focus exclusively on the two hard problems identified in the preliminary research.
  1.  **The Regress Problem:** I will test whether Dewey's experimentalism supplies an internal stopping rule for institutional design. If every institution requires a prior inquiry to design it, does the chain terminate in a habit or a convention? I will analyze whether the "consequences falling on agents" criterion can serve as a natural boundary for design authority, or if an external norm is required.
  2.  **The Absent Public:** I will examine whether Dewey's account of the public constituting itself via suffering consequences can extend to future or unidentified parties (e.g., in germline editing or long-horizon AI risk). I will determine if the framework requires a proxy (e.g., a trustee model) that violates the internal logic of inquiry, or if "consequences" can be modeled hypothetically without collapsing into speculation.
  *Deliverable:* A theoretical memo establishing whether the Deweyan framework is self-sufficient or requires normative imports.

  *Months 4–6: Case Studies in Mechanism Design*
  I will apply the Reframing Condition to two specific institutional forms to identify failure modes.
  1.  **Algorithmic Governance:** I will analyze public comment periods and oversight boards attached to model deployments (e.g., NIST AI Risk Management Framework inputs). The test: Can a commenter successfully redefine the risk metric, or only select from pre-defined risk categories?
  2.  **Climate Assemblies:** I will analyze the design protocols of recent citizens' assemblies (e.g., France's CCC). The test: Was the mandate fixed by the executive (blocked reframing), or could the assembly redefine the scope of "climate action" (e.g., from technology to consumption)?
  *Deliverable:* Two case reports mapping the "option space" and "agenda control" of each mechanism against the Reframing Condition.

  *Months 7–9: Synthesis and Diagnostic Formulation*
  I will synthesize the theoretical limits and case findings into a usable diagnostic tool. This will not be a normative verdict but a structural checklist for designers (e.g., "Does the protocol allow amendment of the success metric?"). I will draft the dissertation chapters, focusing on the argument that structural validity precedes empirical outcome evaluation.
  *Deliverable:* Full dissertation draft.

  **Success and Failure Conditions**
  *Success:* The project produces a "Reframing Diagnostic"—a set of structural criteria (e.g., agenda control, feedback loops, mandate flexibility) that a designer can apply *ex ante* to determine if a mechanism supports inquiry. Crucially, success requires resolving the regress and absent public problems either by showing they are solvable internally or by precisely locating where external norms must be grafted.
  *Failure:* The project fails if the Reframing Condition proves too abstract to distinguish mechanisms in practice, or if the regress problem demonstrates that Deweyan inquiry cannot govern its own institutionalization without circularity. If I conclude that the framework *requires* external normative imports to function, I must specify exactly which ones, rather than glossing over the gap.

  **Justification of Approach**
  This approach is superior to two obvious alternatives.
  1.  **Vs. Empirical Outcome Evaluation:** Evaluating mechanisms by their policy outcomes (e.g., "did carbon emissions drop?") is post-hoc and confounds institutional validity with external variables. A mechanism can be structurally democratic and fail, or structurally aggregative and succeed by luck. We need a structural validity test *ex ante*.
  2.  **Vs. Discourse Ethics:** A Habermasian framework evaluates the validity of claims and the ideal speech situation. However, technical governance is often less about consensus on norms and more about problem-solving under uncertainty. Dewey's focus on *consequences* and *hypothesis testing* fits the technical mediation context better than discourse ethics' focus on *justification*. The Reframing Condition captures the experimental nature of technical risk better than consensus conditions.

  **Feasibility and Scope**
  To ensure completion within nine months and address committee concerns, I am making the following cuts:
  1.  **No Historical Exegesis:** I will not re-argow Dewey's interpretation. I assume the logic of inquiry as a premise. This addresses the Political Theorist's concern about normative hand-waving by treating the philosophy as a fixed tool for institutional analysis, not a site of interpretive contest.
  2.  **No Broad Democratic Theory:** I am not arguing for Deweyan democracy as a whole. I am arguing for a specific diagnostic for *technical governance mechanisms*. This addresses the Computer Scientist's concern about spec sheets by focusing on concrete design constraints (agenda control, feedback loops) rather than abstract values.
  3.  **Limited Case Scope:** I will not survey all participatory mechanisms. I will restrict analysis to the two named cases (AI oversight, Climate Assemblies) to ensure depth. If the Regress or Absent Public problems prove intractable in Month 3, I will pivot to documenting the limit rather than solving it, ensuring the timeline holds.

  This scope ensures the project remains a philosophical investigation into institutional logic, legible to a theorist as rigorous conceptual work and to a computer scientist as a specification of system constraints.
