      *   *The Two Failure Modes:* 1. Agenda fixed by experts (no reframing allowed). 2. Reframing allowed but no feedback loop to decision (reframing is impotent).
      *   *The Two Hard Problems:* 1. Regress problem (who designs the designers?). 2. Future/Unidentified Public problem (how to represent those who can't suffer consequences *yet*).
