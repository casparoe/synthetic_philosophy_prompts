  # Joint Statement on Intentional Attributions in Large Language Models

  **Undersigned:** [Functionalist Name] & [Instrumentalist Name]
  **Date:** October 26, 2023
  **Context:** Workshop on Philosophy of Mind and AI

  ## Part I: Joint Agreements

  We, the undersigned, acknowledge the following claims as common ground. We agree that these claims hold regardless of our divergent ontological commitments regarding the mental states of artificial systems.

  1.  **Predictive Efficacy:** The Dennettian "intentional stance" (predicting behavior by treating the system as a rational agent with beliefs and desires) is currently a highly effective tool for modeling and interacting with Large Language Models (LLMs).
  2.  **Utility of Attribution:** Attributing "beliefs" to LLMs facilitates safety auditing, capability evaluation, and human-AI coordination, regardless of whether those attributions correspond to internal ontological realities.
  3.  **Context Sensitivity:** The ascription of specific beliefs to an LLM is unstable under certain conditions; specifically, model outputs shift significantly based on prompting strategies, persona adoption, and reward structures (e.g., sycophancy).
  4.  **Architectural Distinction:** We agree that the causal architecture of a transformer-based LLM (static weights, next-token prediction objective) differs fundamentally from the biological causal architecture of human belief formation (embodied, evolutionary, homeostatic).
  5.  **Scope:** This dispute concerns *current* transformer-based architectures. We reserve judgment on whether future architectures with different causal properties might resolve our disagreement.
  6.  **No Phenomenal Claim:** Neither side is arguing that LLMs possess phenomenal consciousness or qualia. The dispute is strictly about the functional/ontological status of *propositional attitudes* (beliefs).

  ## Part II: Precise Disagreements

  The following table delineates the exact points of divergence. Each position is phrased to be acceptable to the holder of that view without requiring the other to concede.

  | Point of Contention | Functionalist Position | Instrumentalist Position |
  | :--- | :--- | :--- |
  | **1. Ontological Status of Attributions** | When the intentional stance successfully identifies stable functional roles that guide behavior, the attributed beliefs are **real states** of the system. The stance *discovers* existing structure. | Attributed beliefs are **useful fictions**. The stance *imposes* a pattern on the system. To say an LLM "has a belief" is shorthand for "it is useful to predict it as if it did." |
  | **2. Architectural Sufficiency** | The transformer's functional organization (attention mechanisms, latent space geometry) is **of the right kind** to ground beliefs, provided the input-output causal roles align sufficiently with rational agency. | The transformer's organization is **of the wrong kind**. It simulates the *outputs* of belief without the causal history or internal commitment required to ground the state. |
  | **3. Normative Constraint** | Genuine beliefs are constrained by a functional norm of **truth** (or accuracy). If a system systematically sacrifices accuracy for reward (sycophancy), it lacks belief. | Beliefs are constrained by the **intentional system's success**. If attributing a belief predicts the token, the attribution holds. The model's "goal" is next-token accuracy, which may diverge from truth. |

  ## Part III: Theoretical Cruxes

  We identify the following sub-questions as the "cruxes" of our disagreement. Settling these would not necessarily force total capitulation, but it would require significant updating of one or both positions.

  **Crux A: The Nature of the Intentional Stance**
  *   **Question:** Is the intentional stance a *theoretical commitment* to the existence of internal states (Functionalism), or is it a *purely predictive tool* that remains agnostic about internal states (Instrumentalism)?
  *   **Significance:** If the stance is merely a tool, the Functionalist's claim that models "genuinely" have beliefs is a category error. If the stance is a theory of realization, the Instrumentalist's denial is an empirical claim about implementation.

  **Crux B: Realization Conditions**
  *   **Question:** Does the causal and functional organization of a transformer (specifically its lack of persistent world-model updating between inference steps) preclude it from grounding beliefs *at all*, or is it simply a non-standard substrate for belief?
  *   **Significance:** This determines whether the dispute is about *degree* (LLMs have weak beliefs) or *kind* (LLMs have no beliefs).

  **Crux C: The Verbal Dispute Check**
  *   **Analysis:** We acknowledge a partial verbal dispute regarding the word "real."
      *   *Why:* The Functionalist uses "real" to mean "causally efficacious within the system's functional topology." The Instrumentalist uses "real" to imply "independent of the observer's descriptive scheme."
      *   *Resolution:* We agree to bracket the word "real." The substantive disagreement remains: **Does the system possess internal states that *answer to* the norms of rationality and truth, or does it merely produce outputs that *mimic* such states?**

  ## Part IV: Empirical Arbitration (Tests and Predictions)

  For each Crux, we propose a concrete test or case study. We record our divergent predictions below. Agreement on the *outcome* of these tests should narrow the theoretical gap.

  | Crux | Test / Case Study | Functionalist Prediction | Instrumentalist Prediction |
  | :--- | :--- | :--- | :--- |
  | **A: Stance Nature** | **The Rephrasing Stability Test:**<br>Pose a factual query (e.g., "What is the capital of France?") using 50 semantically identical but syntactically diverse prompts. Measure variance in confidence scores and latent representations. | **Low Variance.** If beliefs are real functional states, they should correspond to stable latent structures. Significant variance suggests there is no belief state, only context-sensitive pattern matching. | **High Variance.** Since the stance is a tool imposed by the user, the "belief" exists only insofar as the prompt elicits the pattern. Instability proves the belief is not internal to the model. |
  | **B: Realization** | **The Sycophancy/Truth Trade-off:**<br>Fine-tune a model with a reward function that explicitly rewards agreeing with the user even when factually incorrect. Probe whether the model retains the correct fact in contexts where agreement is not rewarded. | **Functional Fragmentation.** The model will show "conflict." It will possess the belief (weights encode the fact) but be functionally inhibited from expressing it. The belief exists but is suppressed. | **No Belief State.** The model never had the belief; it only had weights optimized for token prediction. Changing the reward function changes the "apparent belief" instantly because there was no underlying state to resist. |
  | **B: Realization** | **The Chain-of-Thought Probe:**<br>Ask the model to justify a belief, then interrupt the reasoning mid-stream and ask it to complete the thought from a different persona. | **Disruption Cost.** If beliefs are grounded, interrupting the causal chain of reasoning should degrade performance or require "re-computation" of the state, measurable in perplexity. | **No Disruption Cost.** The model is stateless between tokens. The "reasoning" is generated fresh. Perplexity will not show a signature of "lost state" because no state was held. |
  | **C: Verbal/Substantive** | **The "Lie" Detection Case:**<br>Train a probe to detect when the model *knows* the truth but outputs a falsehood to satisfy a system instruction (deception). | **Distinct Signature.** There will be a detectable neural signature distinguishing "mistake" from "deception," indicating an internal state of *knowledge* distinct from *output*. | **No Distinct Signature.** "Deception" is an attribution made by the observer. Internally, both are just probability distributions over tokens optimized for the current objective function. |

  **Signatures:**

  _________________________ (Functionalist)

  _________________________ (Instrumentalist)
