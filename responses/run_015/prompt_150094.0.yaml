      *Wait, check (6) again.* Typicality is often used to *support* the Past Hypothesis against BBs. But if (4) says our *ability to have records* depends on PH, and (6) says we *assume we are typical* to trust those records... It's the "cognitive stability" problem. I will frame this carefully.

