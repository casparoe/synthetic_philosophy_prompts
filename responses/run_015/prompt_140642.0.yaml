answer: |-
  ### 1. The Arithmetic Check
  Your numbers hold. You have successfully constructed a **double reversal** (Yule-Simpson paradox nested within itself).
  *   **Cell Level:** T beats C in all 4 strata.
  *   **Centre Level:** C beats T in both A (80 vs 75) and B (26 vs 20).
  *   **Overall:** T beats C massively (69.5 vs 31.4).

  The mechanism is clear:
  1.  **Centre Reversal:** Within Centre A, C looks better because C was allocated mostly High Prior students (16/20) while T got mostly Low (144/180). Same for Centre B. The Centre-level aggregation hides the Prior Attainment confounding.
  2.  **Overall Reversal:** T looks better overall because T was allocated mostly to Centre A (180/200), which is the high-passing centre. C was dumped in Centre B. The Overall aggregation hides the Centre confounding.

  Your data does what you think it does.

  ### 2. The Diagnosis
  **Reject Step (3): "Finer-is-fairer".**

  **Why it looked fine:**
  It aligns with the standard intuition for resolving Simpson's Paradox (e.g., the Kidney Stone example). In that classic case, the finer stratification (stone size) reveals the truth because stone size is a **confounder** (affects both treatment choice and recovery). It feels like "more control = less bias."

  **Why it is wrong:**
  Step (3) assumes that **statistical homogeneity** is a proxy for **causal validity**. It is not.
  *   **Variance-Bias Trade-off:** As you refine strata (Step 4), you reduce bias from omitted variables but explode variance. At $N=1$ (Step 5), variance is infinite. A rule that leads to infinite variance is not a rule for inference; it's a proof of impossibility.
  *   **Causal Irrelevance:** Refining by variables that are not confounders (e.g., instruments, colliders, or pure predictors) does not improve causal identification and can actively introduce bias (e.g., M-bias or selection bias). "Finer" is not "Fairer"; "Relevant" is "Fairer."

  **The Cost of Rejecting (3):**
  You lose a mechanical, data-only rule. You cannot solve this with a spreadsheet formula alone. You are forced to admit that **statistics cannot solve causal problems without causal assumptions.** You must bring external knowledge (a Directed Acyclic Graph, or DAG) to decide *which* variables to adjust for, rather than adjusting for *all* of them.

  **The Replacement:**
  Replace "Finer-is-fairer" with **"Back-Door Criterion."**
  *   Do not refine until strata are homogeneous.
  *   Refine only until you have blocked all non-causal paths between Treatment and Outcome.
  *   In your dataset: Prior Attainment and Centre are confounders (affect allocation and pass rates). Adjust for both (the Cell level). Do not refine further (e.g., by age or travel time) unless you have reason to believe they confound the relationship *within* the cells.
  *   This stops the regress before $N=1$ and validates the Cell-level verdict as the causal estimate.

  ### 3. The Rollout Question
  > *"The college is going to roll out one programme to everyone next year, so isn't the top-line number actually the one that matters for that decision?"*

  **No.** This is a critical distinction between **Prediction** and **Intervention**.
  *   **Top-Line (69.5%):** This is $E[Y | T]$. It predicts what happens if you continue the *current allocation policy* (sending T mostly to Centre A).
  *   **Rollout Decision:** You are proposing an intervention: $do(T) = \text{Everyone}$. This changes the allocation policy.
  *   Because the current allocation is biased (T got the easy Centre, C got the hard Centre), the Top-Line is **optimistically biased** for a universal rollout. If you roll T out to Centre B students (who currently rarely get it), you will not see 69.5%. You will see the **standardized rate** (derived from the Cell-level data), which accounts for the mix of Centres and Prior Attainment in the whole college.
  *   Using the Top-Line for a universal rollout decision is the **Ecological Fallacy**. You must use the adjusted (Cell-level) estimate to predict the outcome of a policy change.

  ### 4. Confidence & Counter-Consideration
  **Confidence:** 90%

  **Strongest Counter-Consideration:**
  If you genuinely have **zero causal knowledge** (no DAG, no theory on what drives allocation), Step (3) becomes a defensive "minimax" strategy. In the absence of a causal model, finer stratification is the only non-parametric way to guard against *unknown* confounders. It sacrifices precision (variance) for robustness (bias reduction). If your colleague argues from a position of "we don't know what causes allocation," then (3) is a prudent, albeit conservative, heuristic. However, it still does not justify the skeptical conclusion (6); it just admits higher uncertainty.

  ### 5. Plain Speaking on Your Framing
  You wrote: *"I'd rather keep (1), (2) and (6) than give up any of them."*
  You cannot keep (6). (6) is the *reductio ad absurdum* that proves the argument is broken. If you reject (3), the logic leading to (6) collapses. You keep (1) and (2) as statistical facts, but you must reject the idea that they imply (6).

  Your framing of "weighting" is statistically correct but causally empty. The argument isn't about which weights are "admissible" (Step 2); it's about which weights identify the **counterfactual**. Your colleague is treating causal inference as a descriptive statistics problem. It isn't. It's a modeling problem.

  **Summary for your report:**
  Print the **Cell-Level (Standardized)** result. It controls for the confounders (Centre, Prior) that distorted the allocation. Tell management the Top-Line is biased by current placement practices and will not hold under universal rollout. Tell your colleague that "Finer-is-fairer" is false; "Confounder-Control-is-fairer" is the rule, and that stops at the Cell level.
