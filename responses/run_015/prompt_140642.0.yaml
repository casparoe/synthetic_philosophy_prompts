  I do student analytics at a big FE college and I've got into an argument with a colleague about Simpson's paradox that I can't find my way out of. I've简化... sorry, I've made up a dataset — hers was messier, this is tidied — where the sign flips twice, and I'd be grateful if someone would tell me which step to reject.

