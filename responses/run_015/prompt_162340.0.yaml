answer: |-
  **MEMORANDUM**

  **TO:** University Research Ethics Board (REB)
  **FROM:** Undergraduate Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommended Resolution: Proposal 24-09 (Active METI Transmission)

  **1. RECOMMENDED DECISION**
  **Status:** **DEFERRED**
  **Condition:** Approval is withheld pending evidence of international regulatory consultation and consensus.
  **Timeline:** Applicants may resubmit with required documentation no earlier than Spring 2025 (24-month deferral).

  **2. TECHNICAL ASSESSMENT OF RISK**
  The Board's debate has hinged on two technical premises that require correction before an ethical vote can be cast.

  *   **The "Leakage" Premise:** The applicants argue that Earth is already detectable via atmospheric biosignatures and radio leakage, rendering this transmission redundant rather than risky. This is technically incorrect. A directed beam from our department's dish creates a spectral flux density approximately $10^6$ times higher than omnidirectional leakage.
      *   *Implication:* We cannot claim "no added risk." If a civilization exists at the target coordinates, this transmission changes their detection horizon from "possible" to "certain." The risk is not status quo; it is incremental and significant.
  *   **The "Content" Premise:** The Chair's proposed compromise (restricting content to mathematics) is technically insufficient. As the applicants correctly noted, the act of beaming *itself* reveals location. A repeating signal from a specific right ascension and declination, modulated by Earth's rotation and orbital period, provides all the coordinates a recipient needs to locate the source.
      *   *Implication:* We cannot mitigate risk by censoring the message. The medium is the location data.

  **3. JURISDICTIONAL AUTHORITY**
  The central ethical failure of this proposal is not necessarily the physics, but the governance. This Board is constituted to assess risk to *research subjects* and *institutional liability*. We are not constituted to assess existential risk to a species.

  Authorizing this transmission asserts that six members of a university committee possess the mandate to speak for eight billion people and all future generations. We do not. Even if the probability of harm is low, the *scope* of the potential harm exceeds our pay grade. To approve this would be to claim an authority we do not hold. To deny it outright is to claim a authority to veto global scientific inquiry we also do not hold.

  Therefore, the only ethically defensible position is to acknowledge our jurisdictional limit. We cannot approve a planetary announcement without planetary consultation.

  **4. ACKNOWLEDGEMENT OF DISSENT (THE LOSING ARGUMENT)**
  This deferral effectively sides with the cautionary bloc, but we must honestly acknowledge the cost borne by the proponents of the project.
  *   **The Scientific Cost:** Delaying active transmission experiments perpetuates the "Great Silence" observational bias. If the solution to the Fermi Paradox requires active probing rather than passive listening, this decision actively hinders the acquisition of knowledge.
  *   **The Speech Cost:** Restricting the students' ability to utilize available university infrastructure for a non-harmful (probabilistically) expression of scientific curiosity sets a precedent of institutional risk-aversion that may stifle legitimate high-risk/high-reward research.
  *   **The Opportunity Cost:** A 24-month delay is significant in an undergraduate timeline. The specific students proposing this will likely graduate before they are permitted to resubmit. This decision prioritizes abstract protocol over the specific academic development of the applicants.

  **5. CONDITIONS FOR RESUBMISSION**
  To move from "Deferral" to "Approval," the applicants must demonstrate that the decision has been elevated beyond this Board. Upon resubmission in 2025, the proposal must include:

  1.  **Evidence of External Review:** Documentation showing the proposal has been submitted to and reviewed by an international body with a broader mandate (e.g., The SETU Post-Detection Hub, UNOOSA, or the IAAG).
  2.  **Consensus Statement:** A letter of non-objection from the University's Department of Astronomy *and* the Faculty of Law/International Relations, confirming that the transmission complies with current interpretations of the Outer Space Treaty.
  3.  **Revised Timeline:** A confirmation that the target star system remains optimal for transmission following the 24-month delay.

  **6. BOTTOM LINE**
  We are not denying the science. We are declining to act as the sole signatories for the human species. If this signal is to be sent, it must be sent with the awareness—and ideally the consent—of a body larger than this Board. Until that consensus is demonstrated, the dish remains a receiver.

  ***

  **Action Required:** Board members are asked to review this rationale prior to next week's vote. If you cannot support a Deferral with these conditions, please prepare a motion for outright Denial or Approval to be seconded during the session.
