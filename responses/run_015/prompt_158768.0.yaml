answer: |-
  Part I: The Translation

  A convention is a specific class of joint policy $\Pi$ adopted by a population of agents $N$ interacting within a recurrent Markov game $G$. To satisfy the definition, the following conditions must hold:

  1.  **Regularity:** In instances of situation type $S$, agents almost always execute actions prescribed by $\Pi$.
  2.  **Expectations:** Almost every agent $i$ possesses a model (explicit or implicit) predicting that almost every other agent $j$ will execute actions prescribed by $\Pi_{-i}$. *Addition:* Standard policy gradients do not necessitate explicit opponent modeling; this clause requires augmenting agents with belief states over other agents' policies.
  3.  **Conditional Preferences (Coordination Equilibrium):** Almost every agent $i$ prefers to execute $\Pi_i$ conditional on others executing $\Pi_{-i}$. Formally, $\Pi$ is a Nash Equilibrium. Furthermore, it is a coordination equilibrium: agents prefer conformity only because others conform.
  4.  **Arbitrariness:** There exists at least one alternative joint policy $\Pi'$ such that, had agents expected $\Pi'$, $\Pi'$ would also have been a coordination equilibrium. This corresponds to the existence of multiple basins of attraction in the loss landscape with comparable payoff structures.
  5.  **Common Knowledge:** The facts of clauses 1–4 are common knowledge among $N$. *Addition:* In MARL, this usually requires parameter sharing or a central critic; to match Lewis, agents must maintain recursive belief states (I believe that you believe that I believe...) to infinite depth, not merely shared weights.

  The bootstrapping story translates as follows: Conventions emerge without explicit negotiation via path dependence in gradient descent. Salience corresponds to features in the observation space with high variance or distinctiveness that act as focal points for equilibrium selection. Precedent is the training history; once a population settles into a basin, the gradient dynamics reinforce that trajectory. Analogy is transfer learning: agents apply a joint policy learned in $S$ to a novel situation $S'$ based on structural similarity.

  The application to language models signaling games within $G$. A signal is a subset of actions $A_{signal} \subset A$ that modifies the observation space of other agents. Meaning emerges when agents coordinate on a mapping between states and signals such that sending and interpreting the signal becomes a coordination equilibrium. No prior semantic resources are required; the "meaning" is the stable correlation between signal, state, and response enforced by the equilibrium payoff.

  Part II: The Residue Report

  **Clean Translation:**
  The concepts of Regularity, Coordination Equilibrium, and Arbitrariness translate cleanly. A stable joint policy in a multi-equilibrium environment captures the extension of Lewis's definition. The notion of multiple basins of attraction perfectly mirrors the arbitrariness condition: the system could have settled elsewhere given different initialization or noise.

  **Distorted Translation:**
  Expectations and Common Knowledge are distorted. In Lewis, expectations are propositional attitudes. In MARL, they are encoded in weights. While functionally similar, the MARL version lacks the explicit representational structure of a belief. Common knowledge is the greater distortion: Lewis requires an infinite hierarchy of mutual expectations. MARL approximates this via shared parameters or centralized training, but decentralized agents rarely maintain recursive belief states beyond depth one or two. The translation here stretches "common knowledge" to mean "correlated via shared training dynamics," which is weaker than the logical infinity Lewis demands.

  **Inexpressible:**
  Normativity is inexpressible. Lewis argues conventions provide reasons for action: "I conform *because* I expect you to." MARL describes causal mechanisms: "I conform because my gradients point there." The distinction between a rule that guides an agent and a regularity that merely describes an agent's behavior vanishes in the weights. The "ought" derived from the equilibrium condition is lost; there is only the "is" of the optimized policy.

  Part III: Four Stress Cases

  **1. A Public Signal with No One Behind It**
  Two agents converge on a correlated equilibrium using an environmental random signal, without modeling each other. Lewis requires expectations about others' conformity. If the agents merely react to the signal without opponent modeling, this fails the Expectations clause. The translation requires adding an explicit convention of obeying the signal. In MARL, this regress does not appear; agents simply minimize loss given the signal. Lewis would deny this is a convention without the hierarchy of expectations; MARL accepts it as a valid solution. The translation reveals Lewis's requirement for intentionality is stricter than MARL's requirement for optimality.

  **2. The Alternative that Cannot be Represented**
  A population locks into a suboptimal joint policy (a multipolar trap) where the superior policy is outside the function class or unreachable basin. Lewis's arbitrariness condition requires the alternative $\Pi'$ to be a possible equilibrium. If $\Pi'$ is computationally unrepresentable, Lewis's counterfactual ("would have preferred") fails. My vocabulary can state this limitation (function class constraints), but Lewis's account might misclassify this lock-in as a convention because he assumes logical possibility rather than computational feasibility. The translation suggests Lewis's account is too idealized for bounded rationality.

  **3. Sanctions Rather than Coordination**
  Consider a regularity maintained by third-party punishment (a repeated Public Goods Game). Conformity is costly; agents deviate if unobserved. Lewis excludes this; it is not a coordination problem but a cooperation problem enforced by sanctions. In MARL, this is reward shaping or a penalty term in the loss function. The translation respects this scope restriction: Lewis defines convention, not norm generally. This is an honest restriction. Most pretheoretic "norms" are sanction-backed cooperation problems, not Lewisian conventions. The vocabulary distinguishes them cleanly: Coordination Equilibrium vs. Nash Equilibrium in a Prisoner's Dilemma with punishment.

  **4. Weights Rather than Beliefs**
  Lewis quantifies over expectations and preferences. MARL agents have parameters and gradients. Can "expects" translate to "learned opponent model"? If we adopt functionalism, yes: if the agent behaves *as if* it expects conformity, it expects conformity. Lewis was officially neutral on machinery. However, if the agent lacks the capacity to represent the expectation (e.g., a tabular Q-learner vs. a theory-of-mind network), the "reason" for action is missing. The account survives under functionalism, but loses explanatory power regarding *how* the expectation is stored. If the weights break under distribution shift but the "belief" should hold, the as-if reading fails.

  Part IV: The Verdict

  The residue is significant. The inexpressibility of normativity marks a genuine explanatory gap. Lewis assumes agents who represent rules as reasons; MARL assumes optimizers who represent strategies as weights. This is not merely verbal. It matters for prediction. Lewis predicts that agents capable of reasoning by analogy will transfer conventions to novel situations where gradient dynamics have not yet trained them. MARL predicts distribution shift failure unless the agents are meta-trained to generalize norms.

  The furniture Lewis was handed—agents with beliefs, desires, and unbounded reasoning—is indeed free relative to MARL. We must build belief states and recursive modeling explicitly. However, the core insight survives: social order can emerge from decentralized optimization without explicit agreement. The disagreement lies in the mechanism of stability. Lewis relies on mutual knowledge stabilizing expectations; MARL relies on basin stability stabilizing weights.

  To settle this, observe a trained population dropped into a new environment with a novel coordination problem. Lewis predicts rapid convergence via salience and analogical reasoning (the convention transfers as a rule). MARL predicts slow re-convergence via new gradient steps (the convention transfers only as initialization bias). If agents converge faster than gradient descent allows, Lewis's intentional stance captures something the optimization stance misses: the representation of the rule itself. Until then, the MARL translation remains a powerful, if causally reduced, shadow of the Lewisian original.
