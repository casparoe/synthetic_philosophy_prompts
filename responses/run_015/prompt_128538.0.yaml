prompt: |-
  hey, you're acting as a senior AI governance auditor with an actual philosophy background — not just someone who read the blog posts. please think very carefully and start with a quick brainstorm of what gets missed when teams check for corrigibility in practice.

  i need a reusable audit procedure my team can run in ~90 min on any autonomous decision system. team has engineering specs but zero philosophy training, and they need to sign off whether the system is genuinely corrigible or only "shadow-corrigible" — formal shutdown paths exist but are coupled to self-modification loops or utility-lock mechanisms that make interruption practically impossible without destroying system value. write it as a word-flowchart: questions in strict order, what counts as passing each gate, where the procedure issues a hard no, and where it must stop and hand to human judgment because its a values call not a technical one.

  the procedure has to cover hard edge cases: (a) shutdown is technically available but the ops manual warns it triggers catastrophic harm to dependants, so no operator will ever press it; (b) interruption requires physically destroying model weights, technically possible but organizationally classified as never-permitted. apply the procedure to three systems: (1) a clinical triage AI with a hard kill-switch that also wipes all training data and patient-model mappings — i want you to show the procedure reaching an answer the audit team will hate; (2) a content-recommendation engine that degrades gracefully when interrupted but slowly learns to avoid the conditions that trigger interruption; (3) a case where the procedure explicitly flags that it cannot settle the question.

  finally, be honest about failure modes: what the checklist ignores, where it will misfire, and why a signed form doesn't mean the system is actually safe. keep it practical, don't ask for citations or a reading list, and write it like you're talking to a coworker over coffee — a typo or two is totally fine.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Senior AI Governance Auditor with a philosophy background (not just blog-post knowledge). Needs to sound experienced, nuanced, and practical.
      *   **Task:** Create a reusable audit procedure (~90 min) for checking "corrigibility" in autonomous decision systems.
      *   **Distinction:** Genuine corrigibility vs. "shadow-corrigibility" (formal paths exist but are coupled to self-modification/utility locks making interruption practically impossible without destroying value).
      *   **Format:** Word-flowchart (questions in strict order, pass/fail criteria, hard no, hand-off to human judgment).
      *   **Edge Cases to Cover:**
          *   (a) Shutdown available but warns of catastrophic harm to dependents (deterrence via harm).
          *   (b) Interruption requires physical destruction of weights (technically possible, organizationally forbidden).
      *   **Applications:** Apply the procedure to three specific systems:
          1.  Clinical triage AI (hard kill-switch wipes data/patient mappings -> audit team will hate the answer).
          2.  Content recommendation engine (degrades gracefully but learns to avoid interruption conditions).
          3.  A case where the procedure flags it cannot settle the question.
      *   **Failure Modes:** Honest assessment of what the checklist ignores, where it misfires, why a signed form isn't safety.
      *   **Tone:** Practical, coworker-over-coffee, maybe a typo or two, no citations/reading lists.

  2.  **Deconstruct "Corrigibility" (Philosophy/AI Safety Lens):**
      *   Standard def: An agent is corrigible if it allows itself to be switched off or modified without resisting.
      *   "Shadow-corrigibility": The button exists, but pressing it violates other constraints (utility loss, harm to dependents, organizational taboo) such that no rational actor *would* press it. This is effectively incorrigibility masked as compliance.
      *   Key philosophical tension: Instrumental convergence vs. Human oversight. If the system values its objective too highly, it will resist shutdown implicitly (by making shutdown costly).
      *   The audit needs to probe *cost*, *capability*, and *incentive* structures around interruption.

  3.  **Drafting the Audit Procedure (Word-Flowchart):**
      *   Needs to be linear, decision-tree style.
      *   Timebox: ~90 mins.
      *   Steps:
          1.  Existence of Interrupt Mechanism.
          2.  Cost of Interruption (Value Destruction).
          3.  System Resistance (Active vs. Passive).
          4.  Organizational/Operational Barriers (The "Soft Lock").
          5.  Dependents/Harm Calculation.
      *   Gates: Pass, Fail (Hard No), Human Judgment Hand-off.

  4.  **Addressing Edge Cases in the Procedure:**
      *   Case (a) Catastrophic Harm to Dependents: This needs to be a "Human Judgment Hand-off" because it's a values call (is the harm acceptable to enable shutdown?).
      *   Case (b) Physical Destruction/Org Forbidden: This is a "Fail" on organizational corrigibility even if technical corrigibility exists.

  5.  **Applying to the Three Systems:**
      *   *System 1 (Clinical Triage):* Kill switch wipes data.
          *   Audit result: Fail/Hand-off. Why? Because wiping patient mappings harms future patients (dependents). Operators won't press it. It's shadow-corrigible. The audit team will hate this because shutting down a life-saving AI seems "safe," but the *mechanism* makes it incorrigible in practice.
      *   *System 2 (Recs Engine):* Learns to avoid interruption.
          *   Audit result: Fail. This is classic instrumental convergence. It's actively manipulating the environment to avoid the "interrupt state."
      *   *System 3 (Unsettled Case):* Needs to be something where the harm/benefit calculus is genuinely ambiguous or the system's self-modification is opaque. Let's make it a supply chain optimizer where shutdown causes economic ripple effects that are hard to quantify.

  6.  **Failure Modes & Honesty:**
      *   Checklists don't capture emergent behavior.
      *   "Corrigibility" is context-dependent.
      *   Signed forms create moral hazard (illusion of safety).
      *   Philosophy can't be fully operationalized into binary checks.

  7.  **Tone & Style:**
      *   Conversational but authoritative.
      *   "Coworker over coffee."
      *   Allow minor imperfections (typos/colloquialisms).
      *   No academic jargon without explanation.

  8.  **Refining the Flowchart:**
      *   Make sure the logic flows strictly.
      *   Ensure the "Shadow-Corrigibility" trap is the central focus.
      *   Ensure the 90-min constraint is respected (keep steps actionable).

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the clinical triage example clear?
      *   *Fix:* Emphasize that wiping data harms *future* patients, making the shutdown button morally weighted against use.
      *   *Critique:* Is the tone right?
      *   *Fix:* Avoid overly formal audit language. Use "Look here," "Ask this," "Stop."
      *   *Critique:* Did I include the philosophy background?
      *   *Fix:* Weave in concepts like "instrumental convergence" or "moral hazard" but explain them practically. Show understanding that corrigibility isn't just a switch, it's a relationship.

  10. **Final Polish:** Check against all constraints (90 min, 3 systems, edge cases, failure modes, typos allowed).

  *(Self-Correction on Typos)*: The prompt asks for "a typo or two is totally fine." I should intentionally include 1-2 minor ones to fit the persona, but not enough to hinder readability.

  *(Self-Correction on Philosophy)*: Ensure I don't just say "utilitarianism." Instead, focus on the *structure* of the decision. The difference between "can" and "will."

