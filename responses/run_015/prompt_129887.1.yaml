prompt: |-
  hey — i'm prepping a segement for my podcast (i cover science and ideas, usually the stuff that's too in-the-weeds for normal outlets) and next week i'm interviewing a historian of public memory, let's call him dr. vorn, who runs a pretty niche argument: germany's Vergangenheitsbewältigung isn't really "working through the past" but a form of state-level "archival closure" that converts private grief into bureaucratic monument culture. he lines up japan's yasukuni shrine politics, turkey's institutional denial of the armenian genocide, and the american south's lost cause mythology as the same structural move — different aesthetics, same suppression mechanism — and he thinks the south's recent monument removals are just closure wearing a progressive mask.

  i need 8-10 interview questions. not generic biography stuff — i want them in the weeds. specifically: a question or two on whether there's even a fact of the matter about a society "having dealt with" its past, or if that's purely normative framing; a cluster on how he keeps japan and turkey in the comparison without flattening the actual historical differences; and something on the south's monument removals that pushes his "progressive closure" claim. for each, include a follow-up keyed to the answer he's most likely to give.

  and here's the thing — don't sit on the fence. i want the questions to commit to vorn's framework, take a definite critical line, and explain briefly why that line is the right pressure point. no bibliographies or reading lists either — just write from what you know.
