  Hi there, it sounds like you are in the thick of it with this chapter and the pressure of the reading group plus teaching is making the knot feel tighter than it needs to be, so let's try to untangle the specific threads you mentioned without getting bogged down in the formalism. The first thing to clarify is your claim that the result establishes indicatives don't express propositions full stop, because that is actually the biggest mistake in your current story and the easiest one to fix before Thursday. Lewis's triviality result is a consistency proof, not an impossibility proof for propositions in isolation, meaning it shows that you cannot hold three specific claims simultaneously without collapsing into triviality. Those three claims are that conditionals express propositions with truth conditions, that Stalnaker's Thesis holds for all probability functions in a rich algebra, and that there are non-trivial probability functions available. You can save propositionalism if you are willing to deny Stalnaker's Thesis, which is exactly what the material conditional account does, or if you restrict the richness of the algebra so that not all combinations of sentences generate new propositions. So when you tell your group that the argument decides against truth-conditionality as such, you are overstating the case, because the argument only forces a choice between the horns of a trilemma rather than singling out propositionalism for elimination. Many philosophers keep propositionalism and simply accept that the probability of the conditional is not the conditional probability, so you should correct that impression before you present.

  Regarding your own proposed solution involving credence-indexed content, your instinct that there is a circularity or fixed-point worry is exactly right and points to the second major mistake in your draft. If the proposition expressed by the conditional is individuated partly by the credence function evaluating it, then you are no longer working with a fixed algebra of propositions that exists independently of the agent's state, which is a core assumption in the standard formulation of Lewis's proof. By making the content shift with the probability function, you avoid the triviality result because the proof relies on comparing the probability of the same proposition across different probability functions, specifically when updating on the antecedent. However, the cost of this move is that you have effectively abandoned standard truth-conditional propositionalism in favor of a view where content is context-sensitive in a very strong way, likely collapsing into the non-propositionalism you are trying to avoid. If the truth conditions depend on the credence function, then negating the conditional or embedding it becomes problematic because the content might shift again under the new context of evaluation, which means you owe a complex account of embedding that most non-propositionalists try to dodge. You are correct to worry that this looks like a version of the conditional event account or a dynamic semantics, and if you present it as a rescue of standard propositionalism without addressing this shiftiness, your committee will likely point out that you have changed the definition of proposition to make the problem disappear.

  On the question of approximate agreement, you are right to be suspicious that banning exact equality isn't enough, because there are indeed triviality results that rule out even approximate agreement under similar assumptions. These results show that if the probability of the conditional is merely required to be close to the conditional probability within some error bound, you still face triviality constraints unless you restrict the class of sentences or the probability functions significantly. This means your fallback option of simply hoping for approximation won't work without also adopting one of the other horns of the trilemma, such as restricting the algebra. This connects to your worry about banning iterated and self-embedding conditionals, which is actually the most standard way for propositionalists to escape the result without giving up Stalnaker's Thesis entirely. The move is to say that the language is not closed under the conditional operator, so iterated conditionals are not well-formed or do not express propositions in the same way. While you are worried that defending this empirically is a big ask, it is actually the most defensible position for a propositionalist who wants to keep the equation, because it limits the scope of the triviality proof without requiring you to change the nature of propositions or the probability function. You don't necessarily need to claim natural language never embeds them, but rather that the logical form relevant for the probability assignment does not support infinite iteration in the way the proof requires.

  So to summarize where you stand before Thursday, your understanding of the algebraic nature of Lewis's proof is roughly on target, since you correctly noted it doesn't depend on worlds or similarity orderings but rather on probability axioms and closure. Your mistake lies in thinking the result forces non-propositionalism exclusively, when it really forces a choice between the equation, the propositional status, and the closure of the language. Your credence-indexed move is creative but likely incurs the cost of non-propositionalism anyway due to the instability of content across updates, so you should be prepared to defend why that counts as a proposition in the sense required for the probability axioms. If you want to stay propositional, the safest route is to restrict the embedding conditions rather than indexing content to credence, and you should correct your claim that the result kills truth-conditionality full stop. You have enough here to lead a good discussion if you frame it as a mapping of the available options rather than a proof of one specific outcome, so take a breath and focus on clarifying the trilemma for your group. Good luck on Thursday.
