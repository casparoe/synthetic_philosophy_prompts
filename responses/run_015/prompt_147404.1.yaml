      *   Carr's point is about selection. Which shards do you pick? The ceramicist tries to find *all* shards. The historian must select based on significance, which is value-laden.
      *   Does the defense survive? Only if "objectivity" is downgraded to "constraint by evidence" rather than "recovery of truth." But the participant claims the *form* is recovered. This is the weak point. The form of an event is not physical.

