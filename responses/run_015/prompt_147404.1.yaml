answer: |-
  The ceramicist analogy offers a robust defense of empirical constraint but ultimately collapses as a justification for historical objectivity because it presupposes a bounded, designed physical object where history presents only diffuse, unbounded processes shaped by narrative emplotment.

  | Ceramicist Analogy Component | Historical Correspondence | Critical Tension |
  | :--- | :--- | :--- |
  | **Burial Context** | The socio-economic structures and archival silence surrounding the event. | Soil chemistry is constant; archival silence is often structural (e.g., suppressed voices) rather than accidental. |
  | **Missing Fragments** | Lost records, unrecorded private moments, and the voices of the subaltern. | A missing shard leaves a gap; a missing record often obscures the *existence* of the phenomenon itself. |
  | **Adhesive Compound** | The historian's theoretical framework (Marxist, Liberal, etc.) and causal logic. | Adhesive is neutral filler; theory actively selects which shards count as significant. |
  | **Forger Planting Fake Shards** | Contemporary propaganda, forged documents, or biased testimony intended to deceive. | A fake shard is detectable via chemistry; a biased document is often the *only* source available. |
  | **Museum Curator's Label** | Periodization, titles, and historiographical classification (e.g., "The Fall of Rome"). | Labels describe the object; periodization creates the object's temporal boundaries. |

  The analogy's primary failure lies in the ontology of the object being reconstructed. An amphora is a bounded artifact with a finite number of shards and an original form determined by a potter's intent; a historical event like "The French Revolution" lacks physical edges, has no infinite limit of documentary shards, and possesses no intrinsic design. The ceramicist discovers the vase's shape because the clay retains the memory of its firing; the historian imposes the event's boundaries because the past flows continuously without natural breaks. This disanalogy validates Hayden White's claim: while the shards (facts) constrain the reconstruction, they do not dictate the *plot*. A ceramicist cannot reconstruct a vase as a tragedy or a romance, but a historian can emplot the same revolution as a triumph of liberty or a descent into terror without violating empirical constraints.

  Furthermore, the analogy imports a teleological assumption that threatens the modified Rankean conclusion. The amphora was created *to be* a vessel, meaning its "truth" is its functional form. Historical events are often emergent properties of conflicting human agencies without a unified purpose or end-state. To claim the form is "recovered" rather than "projected" assumes the event had a coherent shape waiting to be found, which is precisely the metaphysical assumption Carr and White challenge. The ceramicist can claim objectivity because the original whole once physically existed; the historian cannot, because the "whole event" is a conceptual category carved out of continuous time.

  Consequently, the defense of objectivity as "disciplined reconstruction" does not survive the breakdown of the analogy. The argument relied on the physical necessity of the vase's shape to prove that the historian's agency is limited. Once it is revealed that the "vase" (the historical event) has no physical form independent of the narrative used to describe it, the "adhesive" (theory) is shown to be constitutive rather than merely connective. The archaeologist is correct that skepticism mistakes practical difficulty for metaphysical impossibility, but she is wrong that the constraints of evidence equate to the recovery of truth. The analogy was carrying the argument; without the physical guarantee of the shard's fit, the reconstruction becomes a construction, and objectivity retreats from a mirror of the past to a coherence within the present narrative.
