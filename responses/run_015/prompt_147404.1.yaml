      *   Adhesive compound -> The historian's theoretical framework (Marxist, Annales, Great Man, etc.) and logical connectives.
      *   Forger planting fake shards -> Propaganda, forged documents, biased testimony intended to deceive contemporaries and thus historians.
      *   Museum curator's label -> The historiographical classification, periodization, and title given to the work (e.g., "The Fall of Rome" vs. "Transformation of the Mediterranean").

  4.  **Identifying Disanalogies (The Critical Part):**
      *   *Boundedness:* An amphora has a clear edge. A historical event (e.g., "The French Revolution") does not. Where does it start/end? The ceramicist doesn't decide the vase's boundaries; the historian does.
      *   *Teleology/Design:* The amphora was made *to be* a vessel. It has an intrinsic form. Historical events (wars, revolutions, economic shifts) are not artifacts designed with a single shape. They are emergent processes. Reconstructing a "shape" here is imposing form, not finding it.
      *   *Uniqueness vs. Typology:* A ceramicist can compare the shard to known typologies. Historians deal with unique configurations of human agency.
      *   *The "Object" Status:* The vase exists physically even when broken. The "historical event" does not exist as a physical object waiting to be glued; it exists only as a conceptual category carved out of continuous flow.

