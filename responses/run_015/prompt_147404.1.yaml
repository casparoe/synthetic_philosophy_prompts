prompt: |-
  I'm facilitating a philosophy-of-history reading circle that just worked through Ranke's program of rendering the past as it actually was, Carr's counter that facts never speak for themselves, and Hayden White's deeper claim that historical narratives are essentially literary emplotments rather than discoveries. One of the participants—a trained archaeologist—keeps pressing an analogy: she says the historian is like a forensic ceramicist reconstructing a shattered amphora from a burial site. The ceramic shards correspond to primary documents; the adhesive and armature correspond to causal inference and contextual framing; the reconstructed vessel corresponds to the historical event itself; and the museum display case corresponds to the published narrative. She uses this to defend a modified Rankean position: Carr is right that shards don't self-assemble, but wrong that this makes objectivity impossible, since fracture patterns and clay chemistry constrain the reconstruction; White is wrong that the ceramicist is inventing the vase's shape, because the form is recovered, not projected. She concludes that historical objectivity isn't mirroring but disciplined reconstruction, and that scepticism about it mistakes practical difficulty for metaphysical impossibility.

  How far does this ceramicist analogy actually hold? Lay out an explicit correspondence table—what plays the burial context, the missing fragments, the adhesive compound, the forger planting fake shards, and the museum curator's label—then identify the disanalogies that specifically threaten her conclusion. Does the analogy smuggle in the idea of a single, bounded object with an integral design, which may not apply to diffuse social processes? Does it import a teleological assumption—an original purpose for the vessel—that historical events lack? And once these breaks are visible, does her defense of objectivity as reconstruction survive, or was the analogy carrying the argument all along? Lead with your bottom line in the first sentence, then give the reasoning with no preamble and without restating the question.
