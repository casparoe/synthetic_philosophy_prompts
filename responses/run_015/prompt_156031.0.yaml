          1.  **Ex-Ante vs. Ex-Post:** Good's theorem is about expectation *before* looking. You can look, learn bad news, and be worse off *in reality*, but you shouldn't have *expected* that to happen often enough to outweigh the benefits. Miriam's akrasia case is ex-ante, which is stronger.
