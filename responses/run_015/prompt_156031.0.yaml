  4.  **Drafting the Adjudication (Iterative Process):**

      *   *Introduction:* Define Good's Theorem clearly. Distinguish *ex-ante* expected value from *ex-post* realized value. List the assumptions (Bayesian updating, EU maximization, costless, no externalities of observation).
