  The scenario (~250 words, one paragraph, present tense, concrete: name the hardware, the symbols, the data path):
  In a hospital automated dispensing cabinet, a UR5 robotic arm retrieves medication from bins. Two symbols represent the target item within the controller: `VIS_CAT` and `DB_SLOT`. `VIS_CAT` is a categorical vector generated by an onboard CNN processing Intel RealSense depth-color feeds of the pill in the chute; it is trained via backpropagation on raw pixel data to distinguish shapes and colors. `DB_SLOT` is an alphanumeric string received via JSON from the hospital EHR, mapping directly to a physical bin coordinate. The control logic is hard-wired: the arm moves strictly according to `DB_SLOT`. `VIS_CAT` is tokenized every cycle and written to a regulatory audit log, but the actuation thread ignores it completely; there is no conditional branch where vision data alters the motor trajectory. Both symbols function as identifiers for the dispensing task, yet the motor responds only to the database string while the camera continuously classifies the object independently. The system is not malfunctioning; this architecture is deployed to prioritize throughput, assuming database integrity is higher than vision reliability, making the visual stream a passive witness rather than an active participant.

  Verdict table (~120 words):
  Symbol A (`VIS_CAT`): BUG-yes (learned from pixels), IG-no (actuation invariant).
  Symbol B (`DB_SLOT`): BUG-no (derived from text), IG-yes (actuation dependent).
  Result: A is grounded but inert; B is ungrounded but effective.
  This separation holds because the system architecture decouples perception from action. The table reflects the orthogonal status of the symbols. A satisfies the historical/structural requirement of sensory learning but fails the counterfactual action test. B satisfies the counterfactual action test but fails the sensory learning requirement. Neither is malfunctioning; they occupy different lanes in the processing pipeline.

  Why each cell comes out that way (~400 words):
  For `VIS_CAT` (A), BUG is satisfied because the CNN weights were updated via gradient descent on raw sensor matrices, not dictionary definitions; the system discriminates pills using its own transducers. It builds categorical representations from iconic input. However, IG fails. Intervention (i) holds: swap the pill for a different shape, and `VIS_CAT` changes value. But intervention (ii) fails: tokening `VIS_CAT` does not alter the arm's trajectory. Whether `VIS_CAT` reads "Aspirin" or "Placebo," the arm executes the move commanded by `DB_SLOT`. The symbol tracks the world but steers nothing.
  For `DB_SLOT` (B), BUG fails. The symbol originates from a text field in a remote database; the robot has no sensorimotor capacity to distinguish "Bin_4" from "Bin_5" without the lookup table. It is purely symbolic all the way down. However, IG succeeds. Intervention (i) holds: change the JSON input, and `DB_SLOT` changes. Intervention (ii) holds: tokening `DB_SLOT` dictates the motor's target coordinates. If you swap the JSON ID, the arm moves to a new location, even if the physical bin layout was rearranged overnight (provided the map is updated). The symbol steers the system reliably despite lacking sensory roots.
  The divergence arises because `VIS_CAT` lacks causal leverage over the effector, while `DB_SLOT` lacks sensory lineage. Both are "working" as designed: one audits, one acts. The system is not broken; it is optimized for throughput where database integrity is assumed higher than vision reliability. This ensures A remains a passive observer while B remains an active commander. The criteria separate because one measures the history of the symbol's acquisition (BUG) and the other measures its current causal leverage (IG).

  The load-bearing feature (~150 words):
  The structural fact doing the work is the *architectural decoupling of the perceptual channel from the actuation channel*. The system is designed with a "trust boundary" that privileges upstream semantic data (the EHR order) over downstream sensory data (the camera feed) for control decisions. This is not a malfunction but a reliability feature: sensory false positives are deemed costlier than database errors. Because the vision system is wired to logging rather than stopping, its grounded symbols remain causally inert regarding the primary task, while the ungrounded database symbols retain full causal grip on the motors. This wiring asymmetry allows the robot to "know" what it sees without "acting" on that knowledge, creating the space for BUG and IG to diverge.

  Pull the feature out (~150 words):
  If you remove this decoupling by rewiring the system so the vision system can halt or redirect the arm (coupling perception to action), `VIS_CAT` gains IG-yes. The criteria would then align (both BUG-yes and IG-yes), collapsing the distinction. Conversely, if you sever the database link and force blind reliance on vision, `DB_SLOT` vanishes, and `VIS_CAT` becomes the sole driver. The divergence exists *only* because the engineering design allows a grounded representation to exist in parallel with, but subordinate to, an ungrounded command signal. Without this specific wiring asymmetry, grounding and grip covary. The case relies entirely on the permission to ignore sensory data while still processing it.

  How the grounding theorist bites back (~250 words):
  A strict BUG theorist (Harnad-style) will argue this case cheats. They claim grounding *just is* the capacity to pick out referents successfully in service of action. If `VIS_CAT` doesn't guide the pick, it isn't truly grounded; it's merely a causal covariate, like a thermometer reading that doesn't trigger a thermostat. They'll assert `DB_SLOT` is grounded parasitically via the human staff who maintain the EHR-bin mapping, making the whole system grounded externally. They might argue that without the potential for action, the discrimination is meaningless syntax.
  My read: This conflates the *value* of grounding with its *presence*. The robot *can* discriminate (BUG) but isn't *allowed* to act (IG). Denying A's grounding because it's ignored stipulates that grounding requires efficacy, which begs the question against separating origin from role. The human parasitic claim saves BUG only by expanding the "system" boundary beyond the robot, violating the "system itself" constraint. If we accept the robot as the boundary, the separation stands: one symbol has sensory roots but no hands, the other has hands but no roots. The theorist's move protects the theory by redefining grounding to include IG, which is exactly what this case challenges.
