  2.  **Initial Brainstorming & Mapping (The "Obvious" Stuff):**
      *   *Solomonoff Induction:* Sum over all programs $p$ that output data $x$, weighted by $2^{-|p|}$.
      *   *Compression:* Find a program $p$ (compressed file + decompressor) that outputs $x$ with minimal length.
      *   *Friend 1's view:* Shortest zip = Best hypothesis.
      *   *Friend 2's view:* Zip depends on the algorithm (the reference machine).
      *   *Two-Part Code:* Length(Model) + Length(Data | Model).
      *   *Implementation Reality:* A `.zip` file contains the compressed stream *and* a header indicating the method (Deflate, LZMA, etc.). The *decompressor* is usually external (the `unzip` tool).
      *   *Kolmogorov Complexity:* Length of the shortest program on a *Universal* Turing Machine (UTM).
