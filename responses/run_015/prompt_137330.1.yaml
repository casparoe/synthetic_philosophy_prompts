          *   Friend 2: Right about finite data/UTM choice, wrong about asymptotic irrelevance. The "constant" isn't just pedantry for finite $N$.
          *   Postdoc: MDL is the practical bridge.
      *   **Phase 4: The Decompressor/Subjectivity Deep Dive:** Address the "hardcoded $\pi$" argument. Explain why natural UTMs penalize specific hardcoding.
