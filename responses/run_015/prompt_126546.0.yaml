  Next, construct a decision-tree taxonomy (not a named list) that assigns any system to one of Dennett's four categories, or to an explicitly marked empty cell, using only concrete, observable capabilities. The tree must contain exactly five branch nodes, each phrased as a diagnostic yes/no question that a non-specialist could answer about behaviour or architecture. The four named leaves are Darwinian, Skinnerian, Popperian, and Gregorian.

  Crucially, inject the following niche architectural case: a "reflective oracle" that possesses a complete internal predictive model of its environment but is structurally barred from using that model to select actions; it may only output predictions, never act upon them. Determine where this architecture belongs—whether it occupies an existing leaf, creates a new unnamed leaf, or sits in an unoccupied region of the logical space—and flag any ambiguity it introduces with the Popperian or Gregorian nodes.

