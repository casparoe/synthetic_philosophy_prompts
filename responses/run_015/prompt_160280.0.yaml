      *Wait, one nuance:* The user says "the one showing that a state of knowledge can't reproduce the interference predictions." PBR doesn't strictly rely on interference, it relies on distinguishability of product states. I should clarify that distinction gently. The theorem shows that if $\psi$ is epistemic, the underlying ontic states must overlap, but PBR shows they *can't* overlap under certain assumptions.

