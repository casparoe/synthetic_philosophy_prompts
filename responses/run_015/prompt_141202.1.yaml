  This is a classic setup for dissecting the boundary conditions of the "Protected Sphere" in liberal theory. Your supervisor's verdicts reveal a specific, somewhat rigid heuristic that prioritizes the **definition of the act** over the **intensity of the preference**.

  Here is my analysis of her likely verdict, the competing rules, the best test case to distinguish them, and the implication for the mechanism.

  ### 1. Best Guess: She will UPHELD the right.

  **Reasoning:**
  Your hypothesis ("the sphere only dissolves when something physical crosses... and offence never counts") is the most parsimonious explanation of her five prior verdicts.
  *   **Case 1 (Whisky/Disapproval):** No physical crossing. Right **Upheld**.
  *   **Case 3 (Fish/Smell):** Physical crossing, but *de minimis*. Right **Upheld**.
  *   **Case 2 (Drums/Noise):** Physical crossing, significant. Right **Denied**. *Crucially*, her reason was a **redescription of the act's location** ("everyone in the flat is being drummed at"). She treated the sound waves as making the act public.
  *   **Case 5 (TV/Shared):** Act occurred in shared space. Right **Denied**.

  In your new case, the guest is in A's *private room*. There is *no physical crossing* (stipulated). Therefore, under her "Physical Boundary" heuristic, the act remains private. The fact that B's reaction is PTSD rather than moral disapproval (Case 1) should not matter if her rule is strictly about the **integrity of the sphere**, not the **welfare consequences**. She treats the right as a "side-constraint" (Nozick-style) rather than a utility maximizer. If she starts weighing the *severity* of B's internal state (Disapproval vs. Terror), she undermines the bright-line rule she used in Case 1.

  ### 2. Alternative Rules & Predictions

  However, there is a competing rule that fits her data equally well, which would lead to the opposite verdict.

  **Rule B: The "Harm vs. Offense" Distinction (Millian)**
  *   **Logic:** Rights protect private acts unless they cause **harm** to others. "Offense" (moral disapproval, Case 1) does not count as harm. "Nuisance" (noise, Case 2) does.
  *   **Application to New Case:** PTSD is a medical injury/harm, not merely an offense. Even without physical contact, inflicting known psychological trauma can be redescribed (like Case 2) as "Harassment" rather than "Hosting."
  *   **Prediction:** **DENY**. She will argue that A's right to host does not extend to weaponizing that right to inflict trauma, effectively redescription the act from "Private Hosting" to "Public Harassment."

  **Rule C: The "Reasonable Expectation" Contract**
  *   **Logic:** Rights in a shared flat are defined by the implicit contract of cohabitation.
  *   **Application:** Tenants have a reasonable expectation of safety from known abusers, whereas they do not have an expectation of a sober flat (Case 1).
  *   **Prediction:** **DENY**.

  ### 3. The Cleanest Test Case

  You need a case that separates **Physical/Objective Harm** from **Subjective/Preference Intensity**. Your "False Belief" idea is the winner here; the tarantula is a close second but introduces the variable of "animal" which might trigger specific pet rules.

  **Proposed Case: The False Belief Variant**
  *   **Setup:** Same as the new case (A hosts overnight guest in A's room). B is terrified and sleeps elsewhere.
  *   **Twist:** The guest is **not** B's ex-abuser. B *believes* they are (perhaps due to a misunderstanding or misinformation), and suffers the exact same PTSD symptoms. A knows B believes this, but A knows the guest is harmless.
  *   **Why this separates the rules:**
      *   **If she UPHELDS:** She is committed to the **Physical Boundary** rule. Since there is no physical intrusion and no *objective* harm (the guest is harmless), A's right stands. B's internal state (even if traumatic) is B's problem.
      *   **If she DENIES:** She is committed to a **Subjective Welfare** or **Peacekeeping** rule. If B's mental state is shattered, the right is voided regardless of objective truth. This would imply she might have been *wrong* to Uphold Case 1 if B's disapproval was similarly visceral (e.g., religious trauma triggered by alcohol).

  **Why this is better than the Tarantula:** The Tarantula introduces "Phobia" which is often treated legally differently than "Trauma from Violence." The False Belief case keeps the "Violence/Trauma" framing constant but removes the "Objective Threat," isolating the variable of **Reality vs. Perception**.

  ### 4. The Mechanism Question

  **"If she does uphold, does she owe me a story about what the mechanism outputs?"**

  **Yes, absolutely.**
  If she upholds the right, she accepts the Liberal Paradox cycle ($x \succ y \succ z \succ x$). Sen's theorem proves that no Social Welfare Function can satisfy Weak Pareto, Minimal Liberalism, and Unrestricted Domain simultaneously without producing a cycle.

  If she says "Uphold Rights, Drop Pareto," she is essentially choosing **Liberalism as a Trump**. But a cycle is not a choice; it is a contradiction. She owes you an explanation of the **Decision Procedure**:
  *   **Status Quo Bias:** Does $z$ (the cycle center) persist because no majority can form to move to $x$ or $y$?
  *   **Agenda Power:** Who gets to propose the vote first? (If A proposes $z$ vs $x$, $z$ wins. If B proposes $y$ vs $z$, $y$ wins).
  *   **Intransitive Social Choice:** Is she admitting that society's preference is simply irrational?

  If she cannot explain how the cycle resolves into a single social outcome, she hasn't solved the paradox; she has merely accepted the inconsistency. For your chapter, press her on **Gibbard's Resolution** (waiving rights) vs. **Sen's Capability Approach** (restricting the domain of preferences). If she upholds, she is implicitly restricting the domain of *admissible preferences* (B isn't allowed to prefer $y$ to $z$ based on this reason), which contradicts her "Unrestricted Domain" setup in the paradox.

  ### Summary Recommendation
  1.  **Predict Uphold** based on her "Physical Boundary" consistency, but prepare for **Deny** based on "Harm Redescription."
  2.  **Run the False Belief Case.** It is the knife-edge that separates "Physical Reality" from "Psychological Impact."
  3.  **Demand the Mechanism.** If she upholds, ask: "In the cycle $x \succ y \succ z \succ x$, which alternative is actually chosen, and by what rule?" Her answer will tell you whether she is a Libertarian (Status Quo), a Democrat (Agenda), or a Theorist (Domain Restriction).
