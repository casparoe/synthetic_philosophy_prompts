answer: |-
  Here is a 90-minute lesson plan designed to land the core intuition of Updateless Decision Theory (UDT) without getting bogged down in formalism or history.

  ### 1. The Carrier Scenario: Counterfactual Mugging
  **Do not use Transparent Newcomb.**
  **Why:** Transparent Newcomb relies on the agent *seeing* the money. This triggers a visceral "it's right there, take it" reflex that overrides logical reasoning. It conflates *logical correlation* with *causal opportunity*. Students spend the whole time arguing about whether the money is "really theirs" rather than focusing on the decision algorithm.

  **Use Counterfactual Mugging instead.**
  **The Setup:** Omega flips a fair coin.
  *   **If Heads:** Omega asks you for $100. (No other payoff).
  *   **If Tails:** Omega gives you $10,000, *but only if* he predicted you would have given him $100 had the coin come up Heads.
  *   **The Catch:** You are only approached *after* the coin is flipped. You are told: "The coin came up Tails. Here is $10,000. But wait—this is the counterfactual version. The coin actually came up **Heads**. Omega is asking for $100. He predicted you would pay if this happened. Do you pay?"

  **Why this works:**
  1.  **Isolates the Update:** You receive specific evidence ("Coin is Heads") that tempts you to deviate from the optimal policy.
  2.  **No "Free Money" Illusion:** Unlike Transparent Newcomb, you aren't walking away from a million on the table. You are paying a cost to validate a policy. This feels like a *commitment* problem, which is easier to rationalize than leaving free money.
  3.  **Clean Policy Mapping:** It forces the distinction between "What do I do now?" (Action) and "What would I have done?" (Policy).

  ---

  ### 2. The Sequence (90 Minutes)

  #### Phase 1: Reframing "Rationality" (15 mins)
  *   **Goal:** Shift the metric from "acting reasonable given current info" to "getting the best outcome."
  *   **Whiteboard:** Write **WINNING ≠ REASONABLE**.
  *   **Activity:** Briefly recap Newcomb's Problem (which they know). Ask: "Who leaves with more money?" (One-boxers). "Who acted more causally reasonable?" (Two-boxers).
  *   **Key Point:** Establish that if your decision theory makes you poorer than a different decision theory would have, your decision theory is broken. We are here to fix the theory, not justify the action.
  *   **Defuse Magic:** Explicitly state: "Omega is not magic. Omega is a perfect simulator of your source code. When Omega predicts, he is running *you*."

  #### Phase 2: The Trap — The Standard Update (25 mins)
  *   **Goal:** Let them feel the pull of the "wrong" answer using their existing expected utility intuition.
  *   **Activity:** Walk through Counterfactual Mugging from the moment they are told "The coin is Heads."
  *   **The CDT/EDT Calculation:**
      *   *Evidence:* Coin = Heads.
      *   *Fact:* The $10,000 (Tails payoff) is already gone. It is counterfactual.
      *   *Choice:* Pay $100 or Keep $100.
      *   *Causal Link:* My paying now cannot change the past coin flip.
      *   *Conclusion:* Keep the $100. Paying is throwing money away.
  *   **The Result:** If everyone reasons this way, Omega predicts "Won't Pay." Omega flips Tails (50% chance). You get $0.
  *   **The Expected Value:** 50% chance of $0 (Tails) + 50% chance of $0 (Heads, because you kept your $100 but got no reward) = **$0 Average.**
  *   **Pain Point:** Make sure they feel the loss. "You reasoned perfectly given your evidence, and you ended up with nothing."

  #### Phase 3: The Move — Policy Selection (35 mins)
  *   **Goal:** Introduce the UDT shift: Optimize the *mapping*, not the *point*.
  *   **The Whiteboard Diagram:**
      *   Draw a box labeled **YOU (POLICY)**.
      *   Arrow from **YOU** to **OMEGA'S PREDICTION** (happens at T=0).
      *   Arrow from **COIN FLIP** (T=1).
      *   Arrow from **OBSERVATION** (T=2).
      *   Arrow to **PAYOFF** (T=3).
  *   **The Pivot:** "You are not choosing an action at T=2. You are choosing the function that determines the action at T=2, and Omega sees that function at T=0."
  *   **The Calculation:**
      *   *Policy A (Conditional):* "Pay if Heads, Keep if Tails." -> Omega predicts this. Tails: $0 (because you wouldn't pay in counterfactual). Heads: -$100. **Avg: -$50.**
      *   *Policy B (Always Pay):* "Pay regardless." -> Omega predicts this. Tails: +$10,000. Heads: -$100. **Avg: +$4,950.**
      *   *Policy C (Never Pay):* "Keep regardless." -> Omega predicts this. Tails: $0. Heads: $0. **Avg: $0.**
  *   **The Definition:** UDT says: **Maximize Expected Utility over the Policy, evaluated at the Prior (before the coin flip), even if you execute at the Posterior (after the coin flip).**
  *   **Addressing the "Version" Distinction:** Briefly note: "Early UDT said 'Choose the action before seeing anything.' Refined UDT says 'Choose the *map* from observations to actions.' In this problem, the map is `If Heads -> Pay`. You are selecting that map before the coin flips, even though you execute it after."

  #### Phase 4: The Misconception — "Ignoring Evidence" (15 mins)
  *   **Goal:** Defuse the "don't use your eyes" fear.
  *   **The Fear:** "Does UDT mean I should ignore the coin result? Should I pretend I don't know it's Heads?"
  *   **The Correction:** "No. You use the evidence to *index* into your policy, but not to *select* the policy."
  *   **Analogy:** **The Ulysses Contract.**
      *   Ulysses didn't gouge his eyes out (ignore evidence). He heard the Sirens (updated on evidence).
      *   But he tied himself to the mast (pre-selected a policy).
      *   When he heard the song, he didn't say "I hear no song." He said "I hear the song, but my policy is 'Do not steer'."
  *   **Application:** In Mugging, you look at the coin. You see Heads. Your policy says `If Heads -> Pay`. You pay. You didn't ignore the coin; you let the coin determine *which branch* of your pre-selected policy to execute. You just refused to let the coin change *which policy* you run.
  *   **Epistemic vs. Instrumental:** "Update your *beliefs* (it is definitely Heads). Do not update your *decision criterion* (I am still the kind of agent who pays in this branch)."

  ---

  ### 3. What to Explicitly Exclude (Scope Limits)
  To stay within 90 minutes, explicitly state at the start:
  1.  **No Formal Logic:** We are not writing Gödel-Löb provability logic on the board. We are doing intuition pumping.
  2.  **No TDT History:** We won't distinguish between Timeless Decision Theory and Updateless Decision Theory. Treat them as "Decision Theories that care about logical correlations."
  3.  **No Anthropics:** Do not bring up Sleeping Beauty. It introduces indexical uncertainty which muddies the water on *logical* uncertainty.
  4.  **No Real-World Application:** Do not let them argue about whether this applies to voting or climate change. It's a toy model for now.

  ---

  ### 4. The Comprehension Check
  Do not ask "What is UDT?" (They will recite a definition).
  Do not ask "What do you do in the Mugging?" (They will guess the 'right' answer).

  **Ask this:**
  > "Imagine you have the ability to modify your own source code. You are allowed to do this **after** Omega flips the coin and tells you it came up Heads, but **before** you decide whether to pay.
  >
  > **Do you modify your code to 'Never Pay'? Why or why not?**"

  **Why this works:**
  *   **If they say "Yes, I modify to Never Pay":** They failed. They are still optimizing for the local action given the update. They don't understand that the modification itself would have been predicted.
  *   **If they say "No, I keep the 'Pay' code":** They understand. They realize that modifying the code *now* changes what Omega predicted *then*, effectively retroactively costing them the Tails payoff.
  *   **The Nuance:** This tests if they understand that *they are the algorithm Omega simulated*, not just the agent acting in the moment.

  ### 5. Summary of the "Ordering" Logic
  1.  **Winning > Reasonableness:** Breaks their attachment to CDT intuition.
  2.  **Mugging Scenario:** Provides a case where Updating = Losing.
  3.  **Policy Optimization:** Provides the mechanism to Win.
  4.  **Ulysses Analogy:** Decouples "Seeing" from "Obeying" to fix the blindness misconception.
  5.  **Self-Mod Question:** Verifies they internalized the algorithmic identity.

  This order prevents the "Why would I do that?" reaction by establishing the *cost* of the intuitive move before presenting the *solution*.
