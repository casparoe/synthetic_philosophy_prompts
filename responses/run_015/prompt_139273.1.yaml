answer: |-
  This is a classic philosophical puzzle known as the **Inefficacy Objection** (or the Problem of Causal Impotence). It is frequently discussed in the context of voting, climate change, and animal ethics. Your housemate has constructed a rigorous version of it.

  Here is the breakdown of the philosophical landscape, which step to target, and how to solve your "roadkill" worry.

  ### 1. Status Report: Settled vs. Disputed vs. My Take

  *   **Settled:** There is **no consensus** among professional philosophers on the single "correct" solution to this paradox. It remains a live dispute between consequentialists (who focus on outcomes) and non-consequentialists (who focus on duties, virtues, or complicity).
  *   **Live Dispute:** The main battle lines are between **Expected Utility** theories (modifying Step 1 or 3) and **Complicity/Participation** theories (rejecting Step 1).
  *   **My Take:** I recommend rejecting **Step (1)**, but replacing it with a specific principle of **Participation** rather than a vague "pattern" idea. This preserves your intuition about the mob and voting while exonerating the roadkill deer.

  ### 2. Which Step to Give Up?

  You should give up **Step (1)**: *"There can be a moral reason against doing something only if doing it makes some difference to what happens."*

  This premise is the **Individual Difference Principle**. It claims that moral responsibility tracks *causal pivotality*. If you aren't the switch that flips the outcome, you bear no responsibility.

  **Why break it here?**
  If you keep (1), you are forced into one of two uncomfortable positions:
  1.  **Accept the conclusion:** Admit that buying the chicken is morally neutral (which contradicts your intuition about the mob).
  2.  **Deny the empirical claim (2):** Argue that you *do* make a difference (e.g., via probability). Your housemate has effectively blocked this by stipulating the "rigid crate" scenario. While in the real world markets are probabilistic, in the logic of this argument, we must assume the threshold is real.

  By rejecting (1), you allow that an act can be wrong even if it is not causally pivotal.

  ### 3. What Replaces "Makes a Difference"? (Solving the Roadkill Worry)

  Your worry is valid: if you replace "makes a difference" with "part of a pattern," you risk condemning anyone who benefits from harm, including eating roadkill.

  To avoid this, you do not replace (1) with "being part of a pattern." You replace it with a **Principle of Complicity in Harmful Practices**.

  **The New Principle (1*):**
  > "There is a moral reason against doing something if it constitutes voluntary participation in a collective practice that causes harm, even if your individual participation is not causally pivotal."

  **How this solves the Roadkill Case:**
  *   **Supermarket Chicken:** When you buy the chicken, you are engaging in a market transaction. You are a *participant* in the economic system that breeds and kills chickens. You are playing your role in the practice.
  *   **Roadkill Deer:** The deer was killed by a car, not by a market practice you are joining. Eating it is *benefiting* from a harm that has already occurred, but it is not *participating* in the act of killing. There is no ongoing practice of "roadkill production" that your purchase sustains.
  *   **The Mob:** Throwing a stone is active participation in the practice of killing the man. Even if he would have died anyway, you joined the killing party.
  *   **Voting:** Voting is participation in a democratic practice. If everyone abstains, the practice collapses. Your participation is required for the *practice* to function, even if your single vote doesn't change the winner.

  **The Cost of This View:**
  By rejecting (1), you move away from **Act Consequentialism** (which judges acts solely by their specific outcomes). You are adopting a view that values **Integrity** or **Complicity**.
  *   **The Cost:** It makes morality slightly less "clean." You have to define what counts as a "harmful practice" versus a "neutral background condition." (e.g., Is paying taxes participation in a war? Is driving a car participation in climate change?). This requires nuance that "did it change the outcome?" does not.

  ### 4. Alternative: The "Expected Difference" Move (Modifying Step 1)

  If you are reluctant to fully abandon the idea that "difference matters," there is a second option favored by many consequentialists (like Peter Singer or Shelly Kagan). You don't reject (1); you refine what "difference" means.

  **The Modification:**
  Morality tracks **Expected Difference**, not **Actual Difference**.

  *   **The Argument:** Even if the crate is rigid *this week*, your purchase signals demand. There is a *probability* that your purchase triggers a reorder next week, or prevents a cancellation. If there is a 1/60 chance your purchase triggers a crate of 60 birds, your **expected harm** is 1 bird (1/60 × 60).
  *   **Why this works:** It saves the "difference" principle. You *are* making a difference, just a probabilistic one.
  *   **Why you might dislike it:** Your housemate stipulated the "rigid crate" to block this. If you accept this, you are arguing against their empirical setup, not their logic. Also, it doesn't handle the "Mob" case as well as the Complicity view (if 500 people shoot a victim who only needed 1 bullet, the expected harm per shooter is tiny, yet we feel they are all murderers).

  ### 5. Summary Recommendation

  To win this argument while keeping your intuitions about the mob and roadkill intact:

  1.  **Concede Step (2) for the sake of argument:** Acknowledge that in this specific hypothetical, your single purchase doesn't change the *number* of dead birds this week.
  2.  **Reject Step (1):** State that moral responsibility is not limited to causal pivotality.
  3.  **Propose Principle (1*):** "It is wrong to voluntarily participate in a harmful collective practice."
  4.  **Distinguish Roadkill:** Explain that eating roadkill is * scavenging*, not *participating*. The harm is sunk. Buying chicken is *sustaining* the harm.
  5.  **Address the Mob:** In the mob case, each stone-thrower is participating in the killing practice. The fact that the victim was overdetermined (going to die anyway) does not absolve the participants of the joint enterprise.

  **The Price You Pay:**
  You must accept that morality is sometimes about **what kind of agent you are** (someone who refuses to join in killing) rather than just **what state of the world you produce**. This is a shift from pure consequentialism toward a hybrid view or virtue ethics. Most ethicists consider this a reasonable price to pay to avoid the conclusion that mob violence is permissible.
