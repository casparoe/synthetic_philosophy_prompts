answer: |-
  You have hit on one of the most persistent and powerful objections to compatibilism, often formalized as the **Manipulation Argument** or the **Ultimate Sourcehood Objection**. However, your claim that the hierarchical view is *covertly* incompatibilist is a category error. It assumes that the compatibilist accepts the incompatibilist's necessary conditions for responsibility and is simply trying to hide the fact that they can't meet them. They are not. They are rejecting the conditions themselves.

  Here is the plain pushback on your framing, followed by the principled defense you asked for.

  ### 1. You are conflating "Causal Origination" with "Agential Ownership"
  Your argument rests on this premise: *If an agent did not cause her character, she cannot be responsible for actions flowing from it.*

  This is the **Incompatibilist Intuition**. It is not a neutral fact. To say Frankfurt's view is "covertly incompatibilist" implies that Frankfurt secretly agrees with this premise but is trying to fudge the details. He does not.

  *   **Libertarian Sourcehood:** Requires that the agent be the *causal originator* of the will (an uncaused cause or a specific kind of probabilistic break).
  *   **Frankfurtian Sourcehood:** Requires that the action issues from the agent's *endorsed psychology* (the structure of the will).

  For the compatibilist, "sourcehood" is a structural relation, not a historical one. If your second-order volition aligns with your first-order desire, and that alignment is produced by a rational process *within* you (rather than external coercion), you are the source **in the only sense required for responsibility.**

  To claim this is "covert incompatibilism" is to beg the question. It's like accusing a vegetarian of "covertly eating meat" because they use a protein substitute. They are explicitly rejecting the necessity of meat. Similarly, Frankfurt explicitly rejects the necessity of ultimate causal origination.

  ### 2. You are misrepresenting what Frankfurt's hierarchy was meant to solve
  You frame this as a response to van Inwagen's Consequence Argument. It isn't.

  *   **Van Inwagen (1975/1983):** Argues that determinism rules out the *ability to do otherwise*.
  *   **Frankfurt (1969):** Argues that the *ability to do otherwise* is not necessary for moral responsibility (via Frankfurt Cases).
  *   **Frankfurt (1971):** Argues that freedom of the *will* (not just freedom of action) is about hierarchical alignment.

  Frankfurt's project was never to solve the Consequence Argument by showing we *can* do otherwise. His project was to show that the Consequence Argument is irrelevant because responsibility doesn't require the ability to do otherwise.

  Your objection essentially reinstates the Consequence Argument through the back door: *"Even if you don't need alternative possibilities, you still need ultimate sourcehood, which determinism rules out."*

  This is a valid incompatibilist counter-move, but it doesn't make Frankfurt a *covert* incompatibilist. It just means the incompatibilist refuses to accept the compatibilist's redefinition of control.

  ### 3. The Regress Problem (The Principled Defense)
  You asked: *"Is there a principled way to hold that I can genuinely identify with a causally determined character without requiring that I caused that character?"*

  Yes. The principled way is to recognize that requiring an agent to cause their own character leads to an infinite regress, rendering responsibility impossible for *anyone*, libertarian or compatibilist. This is Galen Strawson's **Basic Argument**:

  1.  To be responsible for an action, you must be responsible for the character that produced it.
  2.  To be responsible for your character, you must have chosen it.
  3.  To choose it, you must have a prior character/values that guided that choice.
  4.  Therefore, to be responsible for that prior character, you must have chosen it... (ad infinitum).

  If you insist on the condition you posed (that I must cause my character to be responsible), **no one is ever responsible.** Not in a determined world, and not in an indeterministic one. (Even if my choice is random, *I* didn't cause it in a way that grounds responsibility).

  The compatibilist offers the only principled way out: **Stop the regress.** We accept that we are not the *ultimate* creators of our selves. We are the *current* stewards of our selves. Responsibility attaches to the current alignment of will, not the metaphysical genesis of the will.

  ### 4. The Real Vulnerability: History vs. Structure
  Your intuition isn't wrong; it's just aimed at the wrong target. The weakness of the hierarchical view isn't that it's covertly incompatibilist; it's that it is **ahistorical**.

  This is the force of the **Manipulation Argument** (developed by Mele and Pereboom). If a scientist programs a robot (or a human) to have a specific hierarchy of desires (2nd order volitions aligning with 1st order), the hierarchical criteria are met. But we intuitively feel the agent isn't responsible because the *history* of those desires is deviant.

  *   **Compatibilist Reply:** We can add historical conditions (e.g., the desires must be formed via a process of critical reflection that wasn't coerced).
  *   **Incompatibilist Reply:** Any determined history is deviant compared to a libertarian history.

  If you take the Incompatibilist Reply, you aren't showing that Frankfurt is *covertly* on your side. You are showing that you reject the compatibilist framework entirely.

  ### Summary
  Your framing conflates **identification** (a psychological state of endorsement) with **sourcehood** (a metaphysical status of causal origination).

  *   **Frankfurt's Claim:** Identification *is* the relevant form of sourcehood.
  *   **Your Claim:** Identification is not sourcehood unless it is ultimately uncaused.

  If you hold your claim, you are an incompatibilist. But you cannot accuse Frankfurt of being a *covert* incompatibilist for denying your claim. He is an **overt** compatibilist who argues that your requirement for responsibility is incoherent (due to the regress) and unnecessary (due to the nature of blame/praise).

  The hierarchical view avoids the Consequence Argument not by disguising an incompatibilist premise, but by denying the premise that "control requires causal origination." It posits that control is a property of the **relationship between mental states**, not the **genealogy of those states.** Whether that successfully captures our moral practices is the debate, but it is not a disguised form of the view it opposes.
