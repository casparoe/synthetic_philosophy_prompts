      *   **Frankfurt's Hierarchical Compatibilism:** Freedom/Responsibility isn't about the ability to do otherwise (Principle of Alternative Possibilities - PAP) but about the structure of the will. Specifically, acting in accordance with a second-order volition (wanting to want X).
      *   **The "Deep Self" View (Wolf, etc.):** Responsibility depends on actions issuing from the "deep self" (values, character).
