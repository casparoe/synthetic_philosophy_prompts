      *   **Specific Issues:** Invention of Christopher Morcom (fictionalized composite), exaggeration of social awkwardness/caricature, family/historian objections vs. public awareness benefits.
      *   **Analytical Lens:** Obligations to the real dead. Map out who was wronged (Turing, relatives, record). Does "greater good" cancel the debt?
