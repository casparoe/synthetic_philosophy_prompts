      *   **Constraint:** No bibliography. No standard "artistic license vs. accuracy" rehearsing. Needs to be sharper, exploring "narrative property rights" or similar concepts.
      *   **Tone:** Disciplined case study, philosophical but grounded.

  2.  **Initial Brainstorming & Conceptual Framing:**
      *   *The Problem of the Subject:* The dead cannot suffer. So how can they be harmed? (Feinberg's argument on posthumous harm). If harm requires subjective experience, Turing can't be harmed. If harm involves the violation of interests that persisted beyond death, he *can* be harmed.
      *   *Narrative Property Right:* This is the user's prompt suggestion. It implies ownership of one's story. But does ownership expire? Copyright expires. Does moral ownership?
      *   *The Imitation Game Specifics:*
          *   Christopher Morcom: In reality, a friend Turing loved. In the film, a composite confidant who dies early, serving as a plot device to motivate Turing.
          *   Social Awkwardness: Turing was eccentric, but the film leans into "Asperger's coding" (diagnosis posthumous) to make him a "quirky genius" trope.
          *   The "Greater Good": The film popularized Turing, contributed to the campaign for his pardon (King's Pardon 2013, film 2014), and highlighted the injustice of his chemical castration.
      *   *The Tension:* Instrumentalization. Turing is used as a means to an end (entertainment/awareness). Kantian ethics says don't treat humans merely as means. Does this apply to the dead?

  3.  **Structuring the Analysis:**
