      *   **Section 1: The Nature of the Distortion (The "What"):** Move beyond "inaccuracy." Focus on *reduction* and *instrumentalization*. The Christopher composite isn't just a lie; it erases the specific nature of Turing's grief and love. The social awkwardness isn't just exaggeration; it creates a specific *type* of person (the trope) rather than the complex human.
      *   **Section 2: The Victim of the Harm (The "Who"):**
          *   *Turing:* Can he be wronged? Use the "Interest Principle." Turing had an interest in truth and dignity while alive. Did that interest survive?
          *   *The Legacy:* The "Symbolic Self." The public Turing becomes a proxy for the real Turing.
          *   *The Living:* Family/Community. They are the custodians of the narrative property.
      *   **Section 3: The Calculus of Redemption (The "Greater Good"):** Does awareness cancel the debt? Analyze the transaction. We traded complexity for reach. Is that a fair trade *for Turing*?
      *   **Section 4: Refining the Theory (Splitting the Obligation):** Address the user's prompt about vagueness. Propose a distinction between *Biographical Fidelity* (facts) and *Ontological Respect* (essence).
