      *   *The Harm:* If we accept the "Interest Principle" (Joel Feinberg), Turing had an interest in not being misrepresented. But did he have an interest in *fame*? Probably not. He wanted privacy. So the film violates his ante-mortem desire for privacy to grant him posthumous fame. That's a paradox.
