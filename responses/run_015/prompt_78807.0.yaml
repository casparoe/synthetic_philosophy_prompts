          *   *Frankfurt Cases:* Too niche. Requires explaining counterfactual interveners. *Discard.*
          *   *Semicompatibilism (Fischer):* Good middle ground (responsibility without alternate possibilities), but the term is jargon. The *idea* is useful: focus on the *source* of action, not the ability to rewind time.
          *   *Strawson (P.F.) - Reactive Attitudes:* Crucial. Distinguishes between seeing someone as a participant in relationships vs. an object to be managed. Solves the "busted toaster" fear. *Keep.*
          *   *Pereboom - Basic Desert:* This is the user's core view. We can't justify suffering just because. But we can justify forward-looking measures. *Keep.*
          *   *Galen Strawson - Basic Argument/Regress:* Too nihilistic for a policy speech. Sounds like "nothing matters." *Discard.*
          *   *Manipulation Argument:* Good for showing luck plays a role, but might sound like making excuses. *Use lightly.*
      *   *Strategy:* Don't argue metaphysics. Argue *purpose*. Shift the question from "Did they choose freely?" to "What does this consequence achieve?" Use P.F. Strawson's distinction implicitly: RJ keeps us in the moral community; suspension treats kids like objects/outcasts. Use Pereboom's distinction: No *basic desert*, but yes to *forward-looking responsibility*.
      *   *The Parents' Objection:* "If you don't punish, they won't learn." "It's unfair to victims." "You're saying it's not their fault."
      *   *The Hook:* Acknowledge the fear. Validate the need for accountability. Redefine accountability.
      *   *The Stop:* End on the vision of the community, not the metaphysics.

  3.  **Drafting the Speech:**
      *   *Opening:* Acknowledge the tension. "Letting off the hook" vs. "Real accountability."
      *   *Middle (Philosophy in action):* Address the "Why." Punishment looks backward (payback). RJ looks forward (repair). Address the "Desert" issue without saying "Desert." We don't help anyone by making them suffer just because. Address the "Toaster" issue (Strawson): RJ treats them as moral agents capable of change, not broken things to be discarded.
      *   *Closing:* Call to action. Vote for the code that builds people, not walls.
      *   *Word Count Check:* Need to keep it tight. ~130 words per minute. 3 mins = ~390 words.

