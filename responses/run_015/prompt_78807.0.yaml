      *   **Required Output:**
          1.  Brainstorming/Analysis (including assessment of specific philosophical concepts).
          2.  The Speech (approx. 400 words).
          3.  Notes on Choices (technical).
          4.  Confidence Assessment (including least sure point).

  2.  **Brainstorming & Philosophical Triage:**
      *   *Time Limit:* 3 minutes is roughly 350-450 words spoken at a moderate pace. This is *very* tight for deep metaphysics.
      *   *The Core Tension:* The user believes basic desert is unjustified (Pereboom/Strawson/Galen Strawson), but knows saying "nobody is responsible" kills the policy. The policy needs *accountability*, just not *suffering*.
      *   *Concept Triage:*
