  *(Refining the Strawson point)*: The user is worried about viewing kids as "busted toasters" (Objective Attitude). RJ is actually the *antidote* to that. Suspension is the Objective Attitude (remove the broken part). RJ is the Participant Attitude (engage the moral agent). I need to make sure this flip is clear.

