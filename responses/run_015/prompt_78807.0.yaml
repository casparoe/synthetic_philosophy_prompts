answer: |-
  ### Brainstorming & Philosophical Triage

  **The First Fifteen Seconds:**
  You cannot start with metaphysics. If you start with "We are not truly free," the parents will tune out and the board will vote no. You must start with *their* fear: safety and accountability. You need to validate that harm requires a response, then pivot to *what kind* of response.

  **Heavy Lifting Concepts:**
  1.  **P.F. Strawson (Reactive Attitudes):** This is your most important tool. It solves your "busted toaster" worry. Suspension treats the student as an object to be removed (Objective Attitude). Restorative Justice treats them as a moral agent capable of understanding harm and repairing it (Participant Attitude). This allows you to argue for *more* moral engagement, not less.
  2.  **Pereboom (Basic Desert vs. Forward-Looking):** You need to sever the link between "responsibility" and "suffering." You can hold someone responsible (forward-looking) without thinking they deserve pain just because (basic desert).
  3.  **Discard:** The Consequence Argument and Galen Strawson's Regress. These lead to "we can't do otherwise," which sounds like excuse-making to parents. Frankfurt Cases are too technical. Semicompatibilism is the *structure* of your argument (responsibility without alternate possibilities), but don't name it.

  **The Parents' Objection:**
  "It's unfair to the victim if the offender doesn't suffer." "If there's no punishment, there's no deterrent." "You're saying biology/society made them do it, so they aren't responsible."

  **Where to Stop:**
  Do not try to prove determinism. Do not try to convince them that free will is an illusion. Stop at the pragmatic conclusion: "Regardless of the metaphysics, this system works better for community safety."

  **Is it Impossible?**
  It is not impossible, but it is risky. You are walking a tightrope between "no desert" and "no responsibility." The speech must sound like you are demanding *more* from the offender (repair) rather than *less* (suspension).

  ***

  ### The Speech

  Good evening. I'm a junior, and I'm here to ask you to vote yes on the new code.

  I know the worry in this room. It sounds like this: "If you take away suspension, you're taking away consequences. You're telling kids their choices don't matter."

  That is not what we are doing. We are changing what we think a consequence is *for*.

  Right now, our system looks backward. It asks, "What rule was broken, and how much does the offender need to suffer to pay for it?" That assumes the main point of discipline is payback. But suffering for its own sake doesn't fix a broken window, and it doesn't heal a hurt classmate. It just removes the problem child from the room.

  The new code looks forward. It asks, "What harm was done, and what does the offender need to do to make it right?"

  Some might say this lets kids off the hook. I argue it puts them *on* the hook. Suspension is passive; you sit at home. Restorative justice is active. You have to sit across from the person you hurt. You have to listen. You have to agree on how to repair the damage. That requires more courage, more accountability, and more maturity than sitting on your couch for three days.

  There is a deeper worry, too. If we stop punishing because a kid "couldn't help it" due to their background or brain, do we stop seeing them as people? Do we treat them like broken machines that need fixing rather than moral agents who made a choice?

  That is the trap of the old system. When we suspend a kid, we treat them like an object to be discarded. We step out of our relationship with them. Restorative justice does the opposite. It demands we treat the offender as a full member of this community, capable of understanding right and wrong, and capable of change. It keeps them in the moral conversation.

  We don't need to agree on the mysteries of free will to agree on this. Whether a choice was determined or free, the harm is real. And the response should be repair, not revenge.

  Vote for a code that demands more from our students, not less. Vote for repair.

  ***

  ### Notes on Choices (Technical)

  1.  **Semicompatibilist Structure:** I structured the argument to work whether determinism is true or false. By focusing on the *function* of consequences (forward-looking vs. backward-looking), I bypass the "could have done otherwise" requirement. This aligns with Fischer's semicompatibilism: moral responsibility is compatible with determinism because what matters is the quality of the agency and the response, not the ability to do otherwise.
  2.  **P.F. Strawson's "Participant Attitude":** You were worried about the "Objective Attitude" (viewing the offender as a toaster). I flipped this. I framed Suspension as the Objective Attitude (discarding the object) and RJ as the Participant Attitude (engaging the moral agent). This validates your intuition that RJ is *more* respectful of agency, even if basic desert is false.
  3.  **Pereboom's Hard Incompatibilism:** I smuggled in the rejection of Basic Desert without using the term. The line "suffering for its own sake doesn't fix a broken window" signals that retribution is unjustified/unuseful without explicitly denying free will. This allows the parents to hear "pragmatism" while you hear "no basic desert."
  4.  **Avoiding the Consequence Argument:** I deliberately avoided saying "kids couldn't help it." That triggers the Consequence Argument (Van Inwagen) which leads to "no responsibility." Instead, I focused on the *utility* of the response. This prevents the parents from hearing "excuse."
  5.  **Ambiguity of "Choice":** I used the word "choice" loosely. Compatibilists hear "rational deliberation," Incompatibilists hear "causal output." This allows both sides to nod along without realizing they disagree on the metaphysics.

  ***

  ### Confidence Assessment

  **Confidence Level:** 85%
  I am confident this speech achieves your rhetorical goal: it advocates for the policy without alienating the retributivists or lying about your views. It successfully uses Strawson to solve your "toaster" anxiety.

  **Least Sure Point:**
  I am least sure about the line: *"Whether a choice was determined or free, the harm is real."*
  **Risk:** The ex-cop board members might hear "determined" as a dog whistle for "soft on crime." However, burying it in the final paragraph minimizes the risk. If you remove it, you lose the philosophical honesty you requested. If you keep it, you risk triggering their bias. I kept it because you asked for honesty, but deliver it with absolute conviction, not hesitation. If you sound unsure, they will pounce. If you sound matter-of-fact, they will likely let it pass as sociological observation rather than metaphysical claim.
