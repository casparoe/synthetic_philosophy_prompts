answer: |-
  **UNIVERSITY OF [REDACTED]**
  **DEPARTMENT OF PHILOSOPHY**
  **MODULE: PHI3041 — MIND AND MORAL STATUS**

  **TAKE-HOME EXAMINATION**
  **Time Allowed:** 48 Hours
  **Word Limit:** 1,200 words maximum
  **Total Marks:** 20

  ***

  **QUESTION 1**

  Read the following extract from a fictional policy document. Then answer the question below.

  > **MEMORANDUM**
  > **TO:** Regulatory Oversight Committee
  > **FROM:** Interspecies Welfare Directorate
  > **SUBJECT:** Advisory Standard 7(b) — Taxonomic Uncertainty
  >
  > **(i)** For regulatory cost–benefit analysis, a taxon's expected welfare cost = (estimated number of individuals affected) × (probability that members of that taxon are sentient) × (average intensity of a pain-like state, scaled to the human case) × (duration).
  >
  > **(ii)** Where the probability in (i) is assessed at less than 0.1, the taxon is assigned a welfare weight of zero and excluded from analysis. This is on the grounds that acting on probabilities that low would be speculative and would let remoter and remoter possibilities crowd out everything else on the agenda.
  >
  > **(iii)** Assessments under (i) are made taxon by taxon; the probabilities assigned to distinct taxa are treated as independent. Probabilities assigned to distinct individuals within a taxon are also treated as independent.

  **Audit Standard 7(b).** Assume, for the sake of the question, that the probability an individual insect is sentient is around 0.05, that the number affected by the policy under review is very large (say $10^{13}$ per year), and that we have no direct evidence either way about the intensity or duration of insect affective states. Does the Standard give the right verdicts, and if not, where exactly does it go wrong?

  *Note: Do not dispute the empirical assumptions provided above. Focus on the normative and decision-theoretic implications of the Standard.*

  ***

  ### MODEL ANSWER

  **Audit of Advisory Standard 7(b)**

  Standard 7(b) attempts to manage epistemic uncertainty regarding non-human sentience through a rigid expected-value framework. While administratively convenient, the Standard fails to provide a rational basis for decision-making under the specific conditions described. It commits a category error regarding biological correlation, relies on an unjustified threshold for moral consideration, ignores the symmetry of uncertainty, and overlooks the value of information. Consequently, the Standard does not give the right verdicts.

  The most critical failure lies in Clause (iii), which treats the probability of sentience as independent across individuals within a taxon. This misrepresents the biological reality of sentience. Sentience is not a lottery ticket distributed randomly among individuals; it is a phylogenetic trait. If one cricket possesses the neural substrate for subjective experience, it is overwhelmingly likely that all crickets do. By treating individual probabilities as independent, the Standard calculates expected value as if there is a 5% chance of *each* of $10^{13}$ insects suffering. In reality, the distribution is bimodal: there is a 0.05 probability that *all* $10^{13}$ are sentient, and a 0.95 probability that *none* are.

  This distinction transforms the decision problem. Under the Standard's independence assumption, the expected harm is a manageable, diffuse quantity. Under the correct correlation assumption, the expected harm is mathematically identical, but the risk profile is radically different. We are not facing a certainty of small harm, but a small chance of catastrophic harm. Clause (ii) attempts to dismiss this by assigning a weight of zero because $0.05 < 0.1$. However, in a bimodal distribution where the 'high' mode dwarfs all other policy concerns, a low probability does not necessarily justify exclusion. A rational agent concerned with risk aversion or worst-case scenarios might prioritise the 5% chance of massive suffering over the 95% chance of negligible cost. The Standard silently assumes risk-neutrality without argument, which is inappropriate for potential moral catastrophes.

  Furthermore, Clause (ii)'s threshold is normatively arbitrary. Drawing a line at 0.1 creates a 'cliff-edge' effect. If new evidence shifts the probability from 0.09 to 0.11, the moral weight of trillions of lives jumps from zero to full consideration. There is no moral justification for why a 2% increase in evidential confidence should toggle the status of billions of beings from non-existent to morally considerable. This arbitrariness allows the Standard to function as a veil for the status quo. By setting the threshold just above the current state of evidence (0.05), the Directorate ensures that insect welfare never enters the calculus, regardless of the scale involved. A more robust approach would utilise a sliding scale of weightings or a precautionary principle that acknowledges the gravity of the potential error.

  This leads to the issue of symmetry. The rationale for Clause (ii) is that acting on low probabilities is 'speculative'. However, maintaining the status quo (e.g., permitting industrial practices that kill $10^{13}$ insects) is also an action based on speculation. It speculates that the insects are not sentient. If uncertainty is grounds for exclusion, it must be grounds for halting the practice until certainty is achieved. One cannot use uncertainty to justify inaction when inaction itself carries a potential infinite disvalue. The Standard asymmetrically applies the burden of proof: it demands certainty to protect the insects but accepts speculation to harm them. A consistent application of the 'speculative' rationale would require suspending the policy entirely until the probability crosses the 0.1 threshold, rather than assuming zero cost.

  Additionally, Clause (i) assumes the calculation is of 'welfare cost'. This presupposes that the lives in question are, on balance, negative for the subject. Given the prompt states we have 'no direct evidence either way' about intensity or affective states, it is equally possible that these lives are net positive. If the lives are worth living, multiplying by $10^{13}$ generates a massive expected value of *good* lost by preventing their existence (depending on the policy). By hardcoding 'cost' into the formula, the Standard biases the outcome towards negative utilitarianism without justification. It assumes that existence under the policy is a harm, rather than a neutral or positive state, which is an empirical claim the Directorate admits it cannot make.

  Finally, the Standard presents a false dichotomy: either regulate now or ignore the issue. It fails to account for the Value of Information (VoI). Given the bimodal risk profile (nothing vs. catastrophe) and the current probability of 0.05, the most rational policy is not to assign a weight of zero, nor to regulate immediately as if sentience were certain, but to invest resources in resolving the uncertainty. The expected value of perfect information here is enormous. If research confirms sentience, we avoid a moral catastrophe; if it refutes it, we save regulatory costs. Clause (ii) forecloses this option by assigning a weight of zero, thereby removing the incentive to fund research. A rational Directorate should treat the 0.05 probability not as a reason for dismissal, but as a trigger for investigation.

  In conclusion, Standard 7(b) fails because it models biological traits as independent events, imposes an arbitrary cutoff that favours the status quo, applies uncertainty asymmetrically, assumes negative valence without evidence, and ignores the option of research. It mistakes administrative tidy-mindedness for moral rigour. The correct verdict is not to assign a weight of zero, but to acknowledge the possibility of catastrophic moral error and act to reduce the uncertainty before proceeding.

  ***

  ### MARKING SCHEME

  **Total Marks:** 20
  **Structure:** 5 Key Criteria (4 marks each).

  | Criterion | Marks Available | Requirements for Full Marks (4) | Common Errors / Deductions |
  | :--- | :---: | :--- | :--- |
  | **1. The Independence/Correlation Error** | 4 | Identifies that Clause (iii) wrongly treats sentience as independent per individual rather than correlated per taxon. Explains the resulting bimodal distribution (0 or All) vs. smooth expectation. | **2 marks:** Calculates expected value correctly but misses the distributional difference.<br>**0 marks:** Accepts the independence assumption or argues only about the numbers. |
  | **2. The Threshold Arbitrariness** | 4 | Critiques Clause (ii)'s 0.1 cutoff. Highlights the 'cliff-edge' problem where small evidential changes cause massive moral shifts. Notes this allows the status quo to persist by fiat. | **2 marks:** Notes the threshold is low but fails to explain why the *discontinuity* is problematic.<br>**0 marks:** Accepts the threshold as reasonable administrative policy. |
  | **3. Symmetry of Uncertainty** | 4 | Argues that using uncertainty to justify inaction (exclusion) is inconsistent. If uncertainty blocks protection, it must also block harmful practices (Precautionary Principle). | **2 marks:** Mentions uncertainty but treats it only as a reason to act, not a reason to halt current practice.<br>**0 marks:** Argues we should just wait for certainty without noting the cost of waiting. |
  | **4. Valence and Framing** | 4 | Notes Clause (i) assumes 'welfare cost' (negative valence). Points out that without evidence, lives could be net positive, flipping the moral calculation. | **2 marks:** Mentions we don't know about pain but misses the implication for 'cost' vs 'benefit' of existence.<br>**0 marks:** Assumes insect lives are necessarily suffering. |
  | **5. Value of Information** | 4 | Proposes that the rational response to high-stakes uncertainty is research/investigation, not immediate regulation or dismissal. Critiques Standard for foreclosing this. | **2 marks:** Suggests research but doesn't link it to the high stakes of the bimodal risk.<br>**0 marks:** Treats the choice as only between 'ban' or 'allow'. |

  **General Notes for Markers:**
  *   **Word Count:** Penalise significantly if over 1,200 words (per department policy).
  *   **Empirical Disputes:** If a student spends >200 words arguing about whether $P=0.05$ is accurate, deduct marks under 'Relevance'. The question stipulates assumptions for a reason.
  *   **British English:** Ensure spelling is consistent (e.g., *programme, analyse, defence*). Minor inconsistencies should not be penalised heavily unless they impede readability.
  *   **Originality:** Top-tier answers (18-20) will weave these points into a cohesive argument rather than a bulleted list. Lower-tier answers (10-14) will likely focus heavily on Criterion 1 and miss the policy implications in Criteria 3 and 5.
