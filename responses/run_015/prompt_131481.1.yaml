prompt: |-
  Please act as an expert in decision theory and cognitive science: someone who knows the literature on how agents actually choose when time, attention and information are limited, and who is additionally careful about the difference between a genuine distinction and a relabeling. Take your time with this. Before you commit to an answer, brainstorm at least five candidate concepts drawn from more than one field — economics, psychology, computer science, biology if it is relevant — and try actively to rule each one out rather than settling on the first plausible label. Say in your answer which ones you discarded and why.

  I am seventeen, in my last year of school, and I have noticed a pattern in how I make choices that I have no word for. I would be grateful for help identifying it — or, if it has no name, for a name and a careful definition.

  The pattern. When I have to pick one thing out of a large pool and cannot inspect all of it — a used bicycle, a summer programme, an extracurricular I will be stuck with for two years — I have fallen into a routine. I look at a few options at the start, form a rough sense of what counts as good "around here", turn that sense into a cutoff, and then take the first later option that clears the cutoff. Three concrete instances.

  First. Buying a used bicycle, I inspected three that were rusted and badly priced, concluded that bicycles "around here" are in poor shape, set a low bar, and bought the fourth one I saw. It was serviceable. A week later I came across two bicycles, both cheaper and in better condition, that I would clearly have preferred. My mistake was not that I stopped looking early; it was that the standard I stopped at had been manufactured out of three bad draws.

  Second. Choosing a summer programme, I read three excellent descriptions first, set my bar at that level, and then rejected four perfectly good programmes for falling short of it. The deadline passed and I ended up with something weaker than the things I had turned down. Here the same routine produced the opposite error — and this is the part that interests me — for what seems to be the same structural reason: the few options I happened to see first were unrepresentative in the other direction.

  Third, and hardest. A society I belong to fills a handful of positions by rolling admissions, and the pool visibly thins over the year: the strongest candidates are taken early. My cutoff was calibrated in September against a full pool. By March, holding to it means almost certainly ending up with nothing, while lowering it to match what remains means I will accept essentially whatever is left, since each downward adjustment redefines "good enough" in terms of what is still available. Either way the standard seems to have no independent grip on the choice: it is always just the pool I happen to be looking at, whether the pool I sampled or the pool I am stuck with.

  Two features seem to me to be doing the work, and I want to know whether either has been singled out before.

  (a) The cutoff is not given to me in advance, by my preferences or by the world. It is manufactured out of the same set of options it is then used to judge. It is a measurement taken with a ruler made of the thing being measured.

  (b) The options I calibrate on are not a random sample of the pool. They are the first ones, and what comes first is not neutral: the three listings at the top of the page, the three a friend happened to send me, the three that were still available in September. So the error in the cutoff is not noise that averages out across many decisions; it points in whatever direction the ordering of the options happens to be biased.

  Somebody told me there is a term of art, from economics or psychology, for settling for something good enough rather than holding out for the best. Somebody else mentioned a puzzle in mathematics about how many candidates you should interview before you start making offers. I suspect what I am describing is neither, or is only a corner of one of them. In the first, as I understand it, the standard is something you bring with you and sensibly revise as you gain experience, whereas mine is constructed mid-search out of the search itself. In the second, I believe the pool is fixed and known in advance, which is exactly what breaks down in my third case. But I may be misrepresenting either one, and I would like to be corrected if so.

  So my question is not really "what is it called". I do not want a word. I want to know whether this configuration — a stopping standard estimated from a non-random early part of the very sequence it is applied to, in a pool that may itself be changing underneath you — has a name of its own; if it is a known phenomenon, exactly how it differs from the things it gets confused with; and if it is not, what you would call it, how you would define it so as to exclude its neighbours, and where you would draw the boundaries. In particular: are my three cases really one phenomenon, or do only two of them belong together, or one?

  Please do not point me at papers, authors or reading lists. I am not asking for references and I cannot chase them up. I want the carving, in your own words.

  Format. Please answer in two parts.

  Part one: at most 250 words of plain English, giving me your verdict.

  Part two: a single JSON object, with nothing after it, containing exactly these fields:

  - "verdict": one of "has a standard name", "imperfect fit to a standard name", "no standard name"
  - "best_label": string — the established term if there is one, otherwise the term you propose
  - "definition": string — one or two sentences, precise enough that someone could apply it to a new case they had not thought about
  - "candidates_considered": array of at least five objects, each with "concept" (string), "field" (string), "why_it_might_fit" (string), "why_it_was_ruled_out_or_kept" (string), and "verdict" (one of "identical", "overlapping", "adjacent", "distinct")
  - "necessary_conditions": array of strings — what must hold for a case to be this phenomenon rather than a neighbour of it
  - "boundary_cases": array of at least four objects, each with "case" (string), "classification" (one of "in", "out", "borderline"), and "reason" (string)
  - "case_verdicts": an object with the keys "bicycle", "summer_programme", "rolling_admissions", each mapping to a string saying whether that case is an instance of the phenomenon and why or why not
  - "diagnostic_question": string — the single question to ask in a concrete situation to tell whether one is faced with this or with its nearest neighbour
  - "what_to_do_differently": string — concrete, honest advice for someone who has noticed he does this, given that "examine every option" is not available to him
  - "confidence": a number between 0 and 1

  Thank you for taking this seriously.
