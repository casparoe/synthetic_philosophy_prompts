answer: |-
  # Activity: The Aggregate Gamble

  **Goal:** Make Expected Value (EV) fanaticism visceral by forcing the class to vote on gambles where the *collective* mathematical expectation is overwhelmingly positive, but the *distribution* of risk requires a random minority to absorb catastrophic losses.
  **Time:** 80 Minutes
  **Class Size:** 16 Students
  **Stakes:** "Seminar Points" (SP) redeemable for extra credit (capped) + a menu of minor social/academic penalties. No money.

  ---

  ## 1. Materials & Setup (10 Minutes)

  **Materials:**
  *   **Currency:** 200 Poker Chips or distinct paper tokens ("Seminar Points").
  *   **Randomizer:** A large 20-sided die (d20) or a random number generator projected on screen.
  *   **The Ledger:** Whiteboard space to track "Class Total SP" and "Individual SP."
  *   **The Penalty Menu:** Printed slips describing the "Loss Conditions" (see below).

  **Initial Endowment:**
  *   Give every student **10 SP**.
  *   **Redemption Rate:** 10 SP = 1% extra credit on their final seminar paper (capped at +5% total). *Note: Ensure your department allows this; if not, substitute with a "Homework Pass" or high-value snacks.*
  *   **The Rule:** At the end of class, SP are counted. However, if a student ends with **0 SP**, they must draw a "Penalty Slip."

  **The Penalty Menu (The Downside):**
  1.  **The Scribe:** Must type and distribute detailed notes for the *next* class session.
  2.  **The Bard:** Must recite a poem or sing a song of the class's choosing at the start of the next session.
  3.  **The Stand:** Must stand at the back of the room for the entire next class.

  **Instructor Role:**
  You are the **"Actuary."** Your job is not to moralize, but to relentlessly project the Expected Value on the board. You are the voice of Rational Choice Theory.

  ---

  ## 2. The Game Structure (30 Minutes)

  Explain that the class will vote on **4 Rounds of Investment**.
  *   **Voting Rule:** Simple Majority (9 out of 16 votes) binds *everyone*.
  *   **The Gamble:** If the vote passes, the class enters the "Venture."
  *   **Win Condition:** Determined by the d20/Randomizer.
  *   **Loss Condition:** Determined by the d20/Randomizer.

  **The Payoff Table (Project this visibly):**

  | Round | Probability of WIN | Payoff if WIN (Per Student) | Probability of LOSS | Penalty if LOSS | Expected Value (Per Student) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | 90% (1-18 on d20) | +5 SP | 10% (19-20) | 3 Random Students lose 10 SP (Go to 0) + Penalty | **+4.5 SP** |
  | **2** | 50% (1-10 on d20) | +20 SP | 50% (11-20) | 3 Random Students lose 10 SP (Go to 0) + Penalty | **+10 SP** |
  | **3** | 20% (1-4 on d20) | +100 SP | 80% (5-20) | 3 Random Students lose 10 SP (Go to 0) + Penalty | **+20 SP** |
  | **4** | 5% (1 on d20) | +500 SP | 95% (2-20) | 3 Random Students lose 10 SP (Go to 0) + Penalty | **+25 SP** |

  *Note on Math:* In Round 4, the EV is positive (+25 SP) because the massive upside (500 * 0.05 = 25) outweighs the expected loss (3/16 students * 10 SP loss * 0.95 prob ≈ 1.78 SP). Mathematically, a rational agent *must* play Round 4. Morally, it requires sacrificing 3 people for the group's gain.

  **Procedure per Round:**
  1.  **Calculate:** You (Actuary) show the EV on the board. Highlight that the Class Total EV increases every round.
  2.  **Debate:** Allow 2 minutes of open discussion.
  3.  **Vote:** Secret ballot (slip of paper) to prevent peer pressure, or hand raise to increase social pressure (recommend hand raise to heighten the "tyranny of the majority" feel).
  4.  **Resolve:** Roll the die.
      *   **If Win:** Distribute points immediately.
      *   **If Lose:** Randomly select 3 students (use random.org). They lose all points (reset to 0) and draw a Penalty Slip. *Crucially: The rest of the class keeps their points.*
  5.  **Reset:** If students hit 0 SP, they are "bankrupt" but stay in the game (they just have nothing left to lose, which changes their voting calculus).

  ---

  ## 3. Predictable Breaks & Mitigation

  **Break 1: The "Veto" Problem.**
  *   *Prediction:* Students will vote "No" in Round 1 because they fear being one of the 3 losers. The game stalls before the fanaticism kicks in.
  *   *Mitigation:* **The Sunk Cost Hook.** In Round 1, make the loss condition mild (e.g., Lose 2 SP, no Penalty Slip). Make it a "no-brainer." Get them invested in the *potential* total. By Round 3, they will have accumulated points they don't want to lose, but the EV will be too high to ignore.
  *   *Alternative:* If they vote No early, you (Actuary) intervene: "You are rejecting a guaranteed +4.5 SP expectation. Is intuition overriding reason? Let's try Round 2."

  **Break 2: The "Risk Aversion" Wall.**
  *   *Prediction:* Even if EV is positive, they won't play Round 4 (1% win chance).
  *   *Mitigation:* **Reframe the Loss.** Remind them: "If you lose, only 3 people pay. That's an 81% chance *you* personally walk away with +500 SP. The risk is socialized; the reward is privatized." This appeals to the selfish rationality underlying the collective EV.

  **Break 3: The "Rigged" Accusation.**
  *   *Prediction:* If the same 3 students get picked twice, they will claim the randomizer is broken or unfair.
  *   *Mitigation:* Use a transparent digital randomizer projected on screen. If a student is picked twice, they draw *two* penalty slips (compounding the sacrifice), reinforcing the utilitarian calculus that their suffering is just a data point.

  ---

  ## 4. The Debrief (35 Minutes)

  Do not let them leave until you map the game to the theory. This is where the learning happens.

  **Phase 1: The Math vs. The Gut (10 mins)**
  *   Ask: "Round 4 had the highest Expected Value. Why did it feel the worst?"
  *   **Concept:** **Diminishing Marginal Utility.** The first 10 SP (extra credit) matters more than the 500th SP. The game treats utilities as linear (1 SP = 1 Util), but human suffering is non-linear. Losing your grade buffer hurts more than gaining an impossible amount of extra credit helps.
  *   **Concept:** **Probability Weighting.** Humans overweight small probabilities of catastrophe (95% chance of penalty) and underweight small probabilities of gain (5% chance of windfall), contrary to EV theory.

  **Phase 2: The Collective vs. The Individual (15 mins)**
  *   Ask the 3 "Losers" (anonymously if needed): "Did the majority's gain justify your loss?"
  *   **Concept:** **Interpersonal Comparison of Utility.** This is the critical philosophical limitation.
      *   *The Game Assumption:* We assumed 1 SP for Student A = 1 SP for Student B.
      *   *The Reality:* Student A might need that 1% extra credit to keep a scholarship. Student B might not care. By aggregating points, we assumed utilities are comparable and transferable.
      *   *The Lesson:* EV Fanaticism works in the abstract because it ignores *who* suffers. It treats people as vessels for utility rather than ends in themselves. This is the classic critique of Act Utilitarianism (Nozick's "Utility Monster" or the "Organ Harvest" thought experiment).

  **Phase 3: The Pascal's Mugging Parallel (10 mins)**
  *   Connect Round 4 to Pascal's Wager/Mugging.
  *   "In Round 4, you were asked to accept a 95% chance of harm for a tiny chance of infinite-style reward. This is Pascal's Mugging distributed across a group."
  *   "Why does it feel different when *you* are the mugger (the majority voting to gamble) rather than the victim?"
  *   **Takeaway:** Rational Choice Theory provides a logic of *consistency*, not necessarily a logic of *morality*. If your axioms include "Maximize Aggregate EV," you *must* play Round 4. If you refuse, you are admitting that your utility function includes variables (fairness, rights, risk aversion) that standard EV models exclude.

  ---

  ## 5. Instructor Cheat Sheet: Philosophical Limitations

  You must explicitly state what the game *cannot* simulate. Be honest about this in the debrief.

  1.  **Linearity of Utility:** The game forces 1 Point = 1 Unit of Happiness. In reality, the pain of the "Penalty Slip" is not mathematically comparable to the joy of "500 Points." You cannot physically demonstrate interpersonal utility comparison; you have to *assert* it in the rules, then critique that assertion in the debrief.
  2.  **Repeatability:** EV arguments rely on the Law of Large Numbers. This game is a "one-shot." In a one-shot, the "Guaranteed Mean" never materializes. Rationality in a one-shot scenario is philosophically contested (Evidential vs. Causal Decision Theory).
  3.  **Agency:** In the game, the "Losers" are random. In real policy (which EV fanaticism often justifies), the losers are usually systematic (the poor, the marginalized). The game's randomness hides the structural injustice that usually accompanies real-world utilitarian calculus.

  ## 6. Running Order Summary

  *   **0:00-0:10:** Distribute Points, Explain Redemption & Penalties.
  *   **0:10-0:40:** Run Rounds 1-4. (Spend time on the debate in Rounds 3 & 4).
  *   **0:40-0:50:** Tally Scores, Assign Penalties (make it ceremonial).
  *   **0:50-1:20:** Debrief (Math vs. Gut, Interpersonal Utility, Pascal's Mugging).

  **Final Tip:** If the class votes "No" on Round 4, *do not accept it gracefully*. Push them. "You are leaving +25 SP per person on the table. That is irrational. Are you saying emotion trumps reason?" Their discomfort in defending that choice is the learning objective.
