prompt: |-
  I'm teaching a senior seminar on rational choice and risk—about 16 students, one 80-minute session. We've talked through the usual expected-value arguments and everyone gets Pascal's wager intellectually, but they treat EV fanaticism like a remote math puzzle rather than something that could actually pull on a decision. I want an in-class game that makes them feel that pull in their bones, but with a twist: instead of one agent facing an infinite-upside gamble, I want the risk and reward distributed across the group so that advancing the collective "expected value" requires sacrificing the outcomes of a minority subset. Think collective EV fanaticism staged with small real stakes—like forfeiting a snack, taking on an embarrassing task, or losing points that affect a group grade—never actual money. Design the full activity: rules, materials, a payoff structure using points or tokens, decision rounds where they construct the escalation themselves, and a debrief that maps each round onto the formal structure (probability weighting, utility aggregation, and the point where the downside becomes arbitrarily bad relative to the upside). Also be honest about what will predictably break the first time I run it, and which feature of the philosophical view—probably the assumption that utilities are interpersonally comparable and linearly aggregable—this physical setup literally can't reproduce, so I need to supply it in the debrief. No bibliography or citation list needed; I just need something I can run monday.
