          *   *Risk Imposition:* Even in Variant 1, I am imposing a risk. In Variant 2, I am relying on a system designed to hide harm.
          *   *Key Point:* Relying on the 0% chance in Variant 2 is parasitic on the 100% aggregate harm. It's a "free rider" problem on the causal structure.

