          *   *Commitment:* If I accept this, a one-off flight *might* be permissible if it doesn't cross a threshold, BUT...
          *   *Critique:* This leads to "moral accounting" where I game the system.
          *   *Better View:* The "Act" is actually an instance of a *Policy*. I should act according to a policy that, if universalized (or followed by me over time), prevents harm.
          *   *Verdict on this point:* Support the "Policy/Habit" view. It dissolves the "one-off" excuse. A one-off flight is only okay if it's truly exceptional, not a hidden habit.

      *   **Section 5: When Does the Objection Work? (Real World Application):**
