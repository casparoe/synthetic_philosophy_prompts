      *   *Benefit:* Saves the multi-trustee model, saves the by-law (which acts as a constitutional constraint, not an irrational preference), and acknowledges Social Choice Theory.
      *   *Addressing User's Worry:* Rejecting (4) doesn't mean you can't criticize the fund. It means you criticize it based on *procedural rationality* (did we follow the rules? was there conflict of interest?) and *fiduciary prudence* (did we waste money?), not based on whether the group preference ordering is transitive.

  5.  **Drafting the Diagnosis:**
