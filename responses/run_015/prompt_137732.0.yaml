      *   (3) *Inference:* Therefore, a money pump exists.
      *   (4) *Group Agency:* Group rationality = Individual rationality.
      *   (5) *Voting Reality:* Condorcet cycles happen (majority voting over transitive individual preferences can yield intransitive group preferences).
