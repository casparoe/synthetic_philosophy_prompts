          *   *Analysis:* It's the strongest link in the chain logically, but applying it to a *charitable fund* with specific constraints (the by-law) is tricky. The by-law *defines* the utility function (preservation of capital is a terminal value, not just an instrument).

      *   **Step (2): Description of Procedure.**
