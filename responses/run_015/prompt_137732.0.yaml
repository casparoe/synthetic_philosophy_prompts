      *   **Step (3): Inference from 1 & 2.**
          *   *Status:* Technically true *if* 1 and 2 hold. If you violate EU axioms, you are vulnerable to money pumps *in theory*.
          *   *Issue:* In practice, transaction costs prevent pumps. Also, the "reserve" isn't a preference inconsistency; it's a constraint.

      *   **Step (4): Group Agency (Homomorphism).**
          *   *Status:* **The Weak Link.** This is the classic "Fallacy of Composition" applied to social choice.
          *   *Theory:* Arrow's Impossibility Theorem and Condorcet's Paradox show that aggregating rational individual preferences does *not* guarantee a rational group preference ordering without a dictator.
          *   *Implication:* A group can be "rational" in a procedural sense (fair voting, deliberation) without satisfying the axioms of individual rationality (transitivity, completeness). Rejecting this doesn't mean the fund can't be criticized; it means the *standard* of criticism changes from "individual EU maximization" to "procedural legitimacy + fiduciary constraints."
          *   *User's worry:* "If I reject (4) I can only ever criticize individual trustees and never a decision of the fund."
          *   *Counter:* You can criticize the fund's *process* or its adherence to its *charter*, even if it doesn't behave like a single expected-utility maximizer. Fiduciary duty applies to the *rules* and *prudence*, not necessarily to EU axioms.

      *   **Step (5): Voting Cycles.**
          *   *Status:* Empirically true (they experienced it). Theoretically sound (Condorcet).
          *   *User's preference:* Wants to keep this.

      *   **Step (6): The Conclusion (Dictatorship required).**
          *   *Status:* Follows from 1-5. If 4 is false, 6 doesn't follow.

  4.  **Select the Step to Reject:**
      *   **Step (4) is the target.** It is the most philosophically contentious and the easiest to reject without abandoning fiduciary responsibility.
