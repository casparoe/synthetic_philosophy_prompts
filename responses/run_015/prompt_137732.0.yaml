      *   They flipped a coin to break a tie in a cycle. That's okay, but it highlights the instability.
      *   To make the process more robust without becoming a dictatorship: **Change the voting method.**
      *   *Option A:* Ranked Choice (Instant Runoff). Reduces cycling.
      *   *Option B:* Approval Voting. Simpler, less strategic voting.
      *   *Option C:* Deliberation before voting.
      *   *Option D:* **Pre-commitment to a Chair's tie-break.** (Simplest administrative fix).
      *   *Option E:* **Score Voting (Cardinal Utility).** Since Marta wants quantification, ask trustees to assign scores (0-10) rather than ranks. This aggregates better than ordinal ranking and reduces Condorcet cycles.
      *   *Selection:* **Score Voting (Cardinal Aggregation).** It bridges the gap. It keeps the 5 trustees (rejecting 4's implication of dictatorship), keeps the qualitative feel (scoring is still subjective), but reduces the mathematical vulnerability to cycles (Step 5) and gives Marta some "numbers" without full EU pricing. It respects the "rough five-point scale" they already use but aggregates it mathematically rather than via majority pairwise comparison.
