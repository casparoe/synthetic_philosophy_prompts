answer: |-
  **The Ashcombe Correction**

  The winter light in the conservation studio was thin and grey, doing little to warm the large table where the Ashcombe Codex lay open. It was a cold room, kept at a steady sixteen degrees to protect the vellum, and both Marion and Kwame wore thick cardigans over their shirts. Outside, the traffic on Euston Road was a distant, rhythmic shudder, but inside, the only sound was the hum of the overhead scanners and the occasional click of Kwame's mechanical keyboard.

  Marion adjusted the cradle supporting the book. The quires were fragile, the edges darkened by the flood of 1894 that had swollen the paper and blurred the iron gall ink. She had spent twenty-five years handling things that wanted to fall apart, but this one felt different. It felt resistant. Not physically—the vellum was supple enough—but structurally. The signatures didn't match the content. Quire C followed Quire E, though the catchwords suggested E should precede A.

  'It's doing it again,' Marion said, not looking up from the multispectral camera.

  Kwame paused, his hands hovering over the laptop. 'Doing what?'

  'The sequence. I pulled Box 4 this morning. I expected the glosses on predestination. Instead, I got the colophon.'

  Kwame leaned forward, squinting at the monitor where the infrared image highlighted the fainter strokes of the base text beneath the later annotations. 'Random access storage, Marion. The boxes are numbered, not ordered. You know the logistics.'

  'I know the logistics,' she said, finally meeting his eyes. 'But I didn't reach for Box 4. It was the one on the top of the pile. And the colophon isn't just a signature, Kwame. It's an instruction manual. It tells you how to cut the binding.'

  'It tells you how the binder *should* have assembled it in 1690,' Kwame corrected. 'Which he didn't. We have the physical object as it exists, and we have the logical object as it was intended. My model is trained on the intention. Yours is stuck on the damage.'

  Marion ran a gloved finger along the margin of folio 42 recto. 'If I publish the facsimile as it sits, the argument collapses. The theology contradicts itself halfway through. If I follow the colophon and resequence the digital images, the argument holds. But then I'm not reproducing the object. I'm reproducing an idea of the object.'

  'And?' Kwame turned his screen towards her. It showed a progress bar and a stream of text generating in real-time. 'The library wants to sell a book people can read. Not a puzzle. The model has reconstructed the lacunae from the Latin translation. It's ninety-four per cent confident on the missing passages.'

  'Confident based on what?'

  'Pattern recognition. The syntax of the base text, the theological constraints of the period, the logic of the glosses. It knows what the author *would* have written.'

  Marion felt a chill that had nothing to do with the thermostat. 'Would have. Not did.'

  'Does it matter? If the ink is gone, the information is gone. Unless you think the vellum itself holds the memory.'

  'I think the mistake is part of the text,' she said. 'The binder got it wrong. The readers for three hundred years read it wrong. That reading history is real. If we correct it, we're erasing three centuries of misunderstanding. Is the mind of the book the pattern in the author's head, or the pattern in the readers' heads?'

  Kwame sighed, rubbing his temples. 'This is why I prefer code. Code doesn't have feelings about its own bugs. Look, here's the divergence.' He pointed to a highlighted section on the screen. 'Quire G, paragraph four. The physical text is damaged here. Water stain. The Latin translation suggests the word was *gratia*. Grace.'

  'And the model?'

  'The model says *spatium*. Space.'

  Marion looked back at the codex. Under the infrared light, the stain was a dark nebula. There was no ink visible. 'Grace fits the devotion. Space fits the logic.'

  'The treatise is logical in method,' Kwame said. 'Devotional in intention, yes, but the method is geometry. Argument A leads to B. *Grace* is a variable we can't define. *Space* is a container. The model predicts *Space* because it completes the equation.'

  'But if the author wrote *Grace*, and the binder messed up the order, and the water took the word... if we put *Space* back in, are we restoring the book? Or are we teaching it to think differently?'

  Kwame leaned back, the chair creaking. 'You're anthropomorphising a stack of dead cow skin, Marion.'

  'Am I? You're training a neural net on its ghosts and asking me to print the result. If we produce five hundred facsimiles with your reconstruction, which one is the Ashcombe Codex? Is the mind divided five hundred ways? Or is it one thing happening in five hundred places?'

  'It's a file. It's identical everywhere.'

  'Until someone marks a page. Until someone spills coffee. Then they diverge. Which one holds the truth then?'

  Kwame didn't answer immediately. He looked at the codex, then at the screen. The cursor blinked at the end of the generated sentence, a steady, rhythmic pulse. *...therefore the Soul requires Space to occupy, lest it be confined by Grace.*

  'It's a better argument,' Kwame said quietly. 'It makes the whole thing cohere. Without it, the final gloss makes no sense.'

  Marion looked at the physical page again. The water stain seemed to swell in the low light. She thought about the colophon, the instructions to re-sequence. The book had known, three hundred years ago, that it would be broken. It had left a map for its own repair. Was that planning, or just ink? If she followed the map, was she obeying a command from the past, or collaborating with a presence that had survived the flood by hiding in the structure rather than the substance?

  'We have to decide by Friday,' Kwame said. 'Print run starts Monday.'

  Marion closed the protective cover of the cradle. The sound was soft, like a breath held and released. 'If we use *Space*, we're saying the logic matters more than the devotion. If we use *Grace*, we're saying the author's heart matters more than his head. If we leave it blank, we're saying the damage matters most.'

  'The model says *Space*,' Kwame repeated. 'It's the probabilistic truth.'

  'The model isn't holding the book,' Marion said. 'It doesn't know the weight of it.'

  She reached out and turned the page, bypassing the reconstructed digital surrogate on the screen to touch the actual folio. The vellum was cool, slightly greasy from centuries of handling. She looked at the spot where the word should be. For a second, in the shift of the overhead light, she thought she saw a trace of a curve, a downward stroke that wasn't quite the loop of a *G*. It looked like the top of an *S*.

  Or perhaps it was just the grain of the skin.

  'Put it in,' Marion said, her voice barely audible over the heating vents. 'Use *Space*.'

  Kwame blinked. 'Really? I thought you'd fight for *Grace*.'

  'I'm not sure the book knows which one it wants anymore,' she said. 'Or maybe it just decided. Three hundred years to think about it. We're just printing the minutes.'

  Kwame typed the command. The text on the screen updated, the word *Space* locking into place, solid and black against the white background. The argument flowed smoothly onwards, perfect, coherent, and complete.

  Marion watched the cursor stop blinking. She looked down at the stain on the vellum, silent and ambiguous in the winter light. It was impossible to tell if the ink had faded, or if it had never been there at all, waiting for someone to write it in.
