  I'm TAing an upper-level seminar on moral responsibility and I want a 'which view of responsibility are you actually stuck with?' decision tree for a handout — four or five branch questions, seven or eight leaves. Two hard rules: every branch question has to be a concrete case a student can answer without knowing which view it feeds (so nothing like 'is free will compatible with determinism?'), and the leaves have to be real positions in the alternative-possibilities debate: classical leeway incompatibilism, the flicker-of-freedom reply, source incompatibilism, semicompatibilism, reasons-responsiveness compatibilism, attributionism, and anything else that earns a leaf. Build it from the logical space first — which combinations of answers are even available — then drop the positions in; where a combination is empty, say in one line whether that's because it's incoherent, just unattractive, or merely unexplored.

  Two cases I want as branch nodes. One: my 'unsignalled intervention' variant, where the neuroscientist doesn't wait for a telltale prior sign but keys the intervention to a coin flip tied to a quantum event in the agent's motor cortex, stepping in only if it lands heads — so there's no difference in her reasons, deliberation, or character between the actual sequence and the blocked one, and she still couldn't have done otherwise. Two: a case where the agent could have voted for the other candidate but both were equally awful, so her one alternative possibility is one that sheds no light on whether she's blameworthy for this decision.

  Also, my sense is that semicompatibilism and attributionism give the same verdict on nearly every case in the tree; if yours can't seperate them, say so and give me the extra question I'd need.

  Lay it out as exactly five numbered parts: (1) the branch questions in order, one sentence each; (2) the tree in plain text or ASCII; (3) the leaves, one sentence each on the most awkward commitment the view carries; (4) the empty combinations with their one-line diagnosis; (5) the pairs of leaves the tree can't seperate, each with a follow-up question that would. No intro, no conclusion.
