answer: |-
  1. In the quantum coin-flip intervention case (no prior sign, identical deliberation, couldn't have done otherwise), is the agent blameworthy?
  2. In the vote case (could have voted for an equally awful candidate), is the availability of that alternative necessary for blame?
  3. In a deterministic world where the agent acts from their own character, is the agent blameworthy?
  4. If an agent acts wrongly from deep ignorance that reflects their caring profile, are they blameworthy despite lacking control over that ignorance?
  5. If the agent's reasons-responsive mechanism was engineered yesterday without their consent but functions normally today, are they responsible?

  2.
  Q1: Unsignalled Intervention (Blameworthy?)
  ├── No → Q2: Vote Case (AP Necessary?)
  │   ├── No → Leaf 1: Responsibility Skepticism
  │   └── Yes → Q3: Determinism (Blameworthy?)
  │       ├── No → Leaf 2: Classical Leeway Incompatibilism
  │       └── Yes → Leaf 3: Classical Leeway Compatibilism
  └── Yes → Q2: Vote Case (AP Necessary?)
      ├── Yes → Leaf 4: Flicker of Freedom
      └── No → Q3: Determinism (Blameworthy?)
          ├── No → Leaf 5: Source Incompatibilism
          └── Yes → Q4: Ignorance (Blameworthy?)
              ├── No → Leaf 6: Reasons-Responsiveness Compatibilism
              └── Yes → Q5: Engineered Mechanism (Responsible?)
                  ├── No → Leaf 7: Historical Compatibilism
                  └── Yes → Leaf 8: Semicompatibilism / Attributionism

  3.
  Leaf 1 (Skepticism): You must deny moral responsibility even in paradigmatic cases of uncoerced, indeterministic action.
  Leaf 2 (Leeway Incompatibilism): You must deny responsibility in Frankfurt-style cases even when the agent's actual sequence is identical to a free action.
  Leaf 3 (Leeway Compatibilism): You must maintain that alternative possibilities are required for responsibility even though determinism does not remove them.
  Leaf 4 (Flicker): You must claim that morally trivial alternatives, like voting for an equally awful candidate, ground blameworthiness.
  Leaf 5 (Source Incompatibilism): You must deny responsibility in deterministic worlds even when the agent is the sole source of the action.
  Leaf 6 (RR Compatibilism): You must excuse agents who act from deep ignorance if their mechanism was not sensitive to reasons at that moment.
  Leaf 7 (Historical Compatibilism): You must deny responsibility for agents with engineered histories even if they function identically to normal agents.
  Leaf 8 (Sem Compat/Attributionism): You must accept responsibility for agents acting from non-voluntary habits if those habits reflect their values.

  4.
  Q1-No / Q2-No / Q3-Yes: Incoherent, as accepting responsibility in deterministic worlds while rejecting it in Frankfurt cases lacks a unified principle of control.
  Q1-Yes / Q2-Yes / Q3-Yes: Unexplored, as flicker strategists typically rely on incompatibilism to motivate the significance of the flicker.

  5.
  Semicompatibilism and Attributionism: Follow-up question: Is an agent responsible for attitudes they cannot control but which define their moral self?
  Source Incompatibilism and Hard Incompatibilism: Follow-up question: Is responsibility impossible in indeterministic worlds where the agent lacks ultimate sourcehood?
