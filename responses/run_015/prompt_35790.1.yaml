      *   *Does it survive?* Yes. The psychological barrier remains. Knowing the action is irrational at T2 makes forming the intention at T1 impossible, regardless of whether a scanner or a human judge is watching.
      *   *Diagnosis 2: Bratman/Planning Theory.* Rationality applies to plans over time. If you treat yourself as a temporally extended agent, you should intend now to secure the grant, even if future-you wants to quit. You bind yourself.
      *   *Does it survive?* This is trickier. In Kavka's original, there's no self-binding mechanism. Here, there's also no mechanism. Bratman argues we *can* intend if it fits a coherent plan. But if the plan is "get money then quit," is that coherent? If the condition is "intend to do X," and you plan "intend to do X then not do X," is that a valid intention? Bratman might say the intention must be stable. If you know you'll defect, you can't stably intend. So this case likely survives (i.e., the puzzle remains) because the lack of enforcement prevents stable planning.

