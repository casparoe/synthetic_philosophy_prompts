answer: |-
  You are a struggling artist approached by a reclusive patron who offers a life-changing grant, but only if she becomes convinced you truly intend to undertake a specific, grueling, and privately unnoticed creative project starting tomorrow. She interviews you deeply; if she judges you sincere, she wires the money immediately and disappears forever, never checking your work and imposing no penalties for quitting. There are no reputation stakes since she leaves and the work is private, yet she is a seasoned judge of character whose intuition you trust enough to know you cannot bluff her. You want the money, but the work is painful and pointless once the funds are secure, creating a conflict between the benefit of forming the intention now and the irrationality of acting on it later.

  This retains the toxin structure because the reward tracks the *attributed intention* at T1 (the interview), not the *action* at T2 (the work); once the money is yours, the action is costly with no further benefit, yet the reward was inaccessible without the intention to act. Regarding the standard diagnoses: first, the "you can't decide to intend" (voluntarism) objection holds here just as in the original; knowing you will not rationally perform the action tomorrow prevents you from genuinely forming the intention today, regardless of whether a scanner or a human judge is verifying it. Second, the Bratman-style planning theory response also fails to dissolve the puzzle; since rational intention requires stability and consistency with belief, you cannot form a stable plan to do something you already believe you will abandon when the time comes, so the intention remains inaccessible.

  The case is weakest at the verification mechanism. A skeptic would attack the claim that you "cannot bluff" a fallible human judge; unlike a brain scanner, a human relies on external cues which can be manipulated or misread. If there is even a small probability you can fake sincerity, rational choice theory suggests you should attempt the bluff rather than struggle with the impossibility of intention, turning the puzzle into a simple gamble rather than a paradox of rationality.
