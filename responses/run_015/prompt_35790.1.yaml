      *   *Wait, the constraint:* "Verification... has to be an ordinary human's fallible read of you."
      *   *Scenario:* A mentor offers a career-making sponsorship *if* they believe you are truly committed to a risky pivot. They judge your sincerity now. The pivot happens later. Once sponsored, you don't need to pivot. But if they suspect you won't pivot, no sponsorship.
