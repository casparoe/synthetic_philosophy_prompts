answer: |-
  1. The Readings

  1.  **Epistemic Limitation:** You currently lack the context to evaluate this rule safely. This is near-trivial. It presupposes only that knowledge is localized and that you have not yet acquired the specific history. It claims nothing about the rule's value, only about your ignorance.
  2.  **Informational Signal:** The bare existence of a long-standing practice is evidence of past utility. This presupposes a selection environment where useless things tend to disappear. It claims that survival correlates with function, making the rule a data point you should not ignore.
  3.  **Distributed Cognition:** The organization possesses tacit knowledge that no individual holds. The rule encodes institutional memory lost to personnel turnover. This presupposes that the organization is a coherent cognitive agent and that the rule was retained by someone for a reason, even if that reason is not documented.
  4.  **Procedural Burden:** The burden of proof lies on the changer, not the keeper. This is a rule of argumentation, not ontology. It presupposes that the status quo has a default privilege. It claims nothing about the fence's quality, only that you must justify removal before removal occurs.
  5.  **Option Value:** Delaying deletion has value because deletion is irreversible or costly to undo. This presupposes that learning is ongoing and that waiting allows you to gather more information about the rule's function without incurring the risk of immediate deletion. It is an economic claim about the timing of decisions.
  6.  **Political Standing:** You lack the authority to alter arrangements others rely on without consensus. This presupposes that the rule is a social contract, not just code. It claims that entitlement to change depends on stakeholder alignment, not just technical correctness.
  7.  **Teleological Preservation:** The rule persists *because* it works, even if the mechanism is invisible. This is the strongest claim. It presupposes a functionalist universe where inefficiency is naturally selected against. It claims the rule is actively preventing harm, and removing it will cause specific damage regardless of your understanding.

  2. Verdicts

  | Reading | Verdict | Notes |
  | :--- | :--- | :--- |
  | 1. Epistemic Limitation | Platitude | True but actionless; solved by reading logs. |
  | 2. Informational Signal | Defensible | Contingent on selection pressure (see Section 4). |
  | 3. Distributed Cognition | Contested | Requires a healthy org; fails in zombie systems. |
  | 4. Procedural Burden | Defensible | Standard engineering governance; shifts workload. |
  | 5. Option Value | Defensible | Depends on cost of rollback vs. cost of delay. |
  | 6. Political Standing | Contested | Depends on your role and the change's scope. |
  | 7. Teleological Preservation | False | Things persist via inertia, politics, and forgetfulness. |

  Readings 2 and 3 collapse if the organization lacks memory; Reading 5 supports Reading 4 economically. The strongest reading available to your colleague is a hybrid of **Procedural Burden** and **Option Value**. He is not necessarily claiming the rule is good (Teleological), but that you have not yet paid the cost to prove it is safe to remove (Burden), and that waiting costs less than fraud (Option Value). This shifts the debate from "Is this rule useful?" to "Have you completed the due diligence required to delete shared infrastructure?"

  3. Two Cases

  **The Address Rule:**
  Under **Epistemic Limitation**, you must simply find the reason; checking Jira tickets discharges this. Under **Informational Signal**, you must assume fraud correlation until data proves otherwise; a quarter of monitoring discharges this. Under **Procedural Burden**, you must convince stakeholders; sign-off discharges this. Under **Option Value**, you must weigh the cost of waiting against the cost of fraud; a cost-benefit model discharges this. Under **Teleological Preservation**, you cannot delete it until you understand the mechanism; this is nearly impossible to discharge without experimentation.

  **The Escalator Convention:**
  Consider the norm "stand on the right, walk on the left." Everyone knows *why* there is a rule (flow efficiency), but the specific assignment (right vs. left) is arbitrary.
  *   **Teleological Preservation** misfires here. It implies the *right side* specifically is optimal. It is not; the *coordination* is optimal.
  *   **Procedural Burden** works. You cannot switch sides without convincing everyone, because the cost of miscoordination is high.
  *   **Option Value** works. Wait until you can switch all signs simultaneously.
  *   **Informational Signal** fails. The existence of "stand right" does not signal that "right" is physically safer than "left."
  The maxim gets the result right (don't change it casually) but for the wrong reason under the strong readings. It is not that the fence's location is sacred, but that the *fence itself* (the norm) prevents collision. The maxim conflates the existence of a constraint with the optimality of its specific configuration.

  4. My Distinctions

  (a) **The Three Whys:** You are correct that the maxim conflates origin, retention, and impact. A rule may be born stupid (origin), kept due to inertia (retention), yet still prevent disaster (impact). The maxim implicitly relies on **Retention**. If the rule survived solely due to bureaucratic friction, the "wisdom" claim fails. This distinction is not implied by the slogan; the slogan treats existence as a monolith. You must explicitly separate "why it started" from "why it hasn't been killed."

  (b) **The Retention Condition:** This is the critical constraint. The maxim is only valid if the environment selects against useless rules. In your lender, rules are added after incidents and never audited. This is a "ratchet" environment, not a selection environment. Therefore, **Reading 2 (Informational Signal)** and **Reading 7 (Teleological)** are false in your context. The maxim does not imply this condition; it assumes a natural selection that organizations rarely possess. You must add this as an external premise: "Existence is evidence only if deletion is possible." Without this, the maxim is superstition.

  5. What the Maxim Leaves Open

  The maxim functions as a mood, not an algorithm, because it lacks operational parameters. First, it supplies no **stopping rule**. How long must you search for the "why" before you are permitted to ignore it? A week? A quarter? Indefinitely? Second, it offers no **standard of evidence**. Does a verbal nod from a veteran count as knowing the "why," or do you need data? Third, it ignores the **cost of inquiry**. If investigating the fence costs more than the fence itself, the maxim mandates waste. It treats the investigation as free.

  Finally, the maxim fails **self-application**. The practice of deferring to inherited practice is itself an inherited practice. If we apply the maxim to itself, we must ask: "Why do we defer to fences?" If the answer is "because it works," we are circular. If the answer is "because we always have," we are stuck in inertia. To function as a decision rule, the maxim needs meta-rules: a budget for investigation, a threshold for evidence, and an exemption for low-cost reversibility. Without these, it is merely a rhetorical shield for the status quo, valid only when the cost of being wrong exceeds the cost of being slow. In your case, you must argue that the cost of the inquiry (deletion + monitoring) is lower than the cost of the fence (manual review overhead), thereby satisfying the Option Value reading without satisfying the Teleological one.
