          *   Better argument: If $E_1$ and $E_2$ are both born, they are distinct people (twins). PE implies that the person born from $E_1$ could have been the person born from $E_2$. But since both exist, this implies transworld identity confusion. It suggests that the distinction between "me" and "my fraternal twin" is contingent. That seems wrong. The distinction is necessary.

      *   *Reason 3: Parental Origin does not Screen Off Gametic Origin.*
          *   "Screening off" means if you fix the parents, the gametes don't matter for identity.
