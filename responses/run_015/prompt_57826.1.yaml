answer: |-
  In the debate over origin essentialism, the central question is how finely we must individuate the conditions of a person's coming into existence to preserve their numerical identity. **Gamete Essentialism (GE)** holds that a specific sperm and egg are necessary for a specific person. **Parental Essentialism (PE)** holds that only the parents are necessary, allowing for different gametic combinations.

  While Parental Essentialism aligns with certain social intuitions about lineage, **Gamete Essentialism provides the more defensible verdicts.** PE fails to account for the distinctness of siblings in cases of multiple viable conceptions (the IVF case) and relies on an arbitrary conception of timing (the Natural Delay case). Furthermore, parental origin does not "screen off" gametic origin because parents function as efficient causes, while gametes function as material causes; identity requires specificity in both.

  ### 1. The IVF Case: The Problem of Fraternal Twins
  The strongest argument against Parental Essentialism arises from the IVF scenario. Suppose a couple produces two distinct embryos, $E_1$ and $E_2$, from different gametes during the same cycle. $E_1$ is implanted and develops into Person $A$. $E_2$ is discarded.

  *   **The PE Verdict:** According to PE, Person $A$ could have come from $E_2$. Since $E_2$ shares the same parents as $E_1$, the origin conditions for $A$ are satisfied.
  *   **The GE Verdict:** According to GE, Person $A$ is essentially tied to $E_1$. Had $E_2$ been implanted instead, a *different* person (a sibling of $A$) would have been born.

  PE leads to a metaphysical absurdity here. $E_1$ and $E_2$ are genetically distinct, analogous to dizygotic (fraternal) twins. If both were implanted, we would undoubtedly have two distinct people. Let us call the person from $E_1$ "Alice" and the person from $E_2$ "Beth." If PE is true, then in the actual world (where only $E_1$ is implanted), Alice could have been Beth. This implies that the distinction between Alice and Beth is contingent.

  However, the **Necessity of Distinctness** dictates that if $x$ and $y$ are distinct individuals, they are necessarily distinct. It cannot be that Alice *is* Beth in some possible world. If PE allows that Alice could have originated from $E_2$, it collapses the necessary distinction between siblings. It implies that "being Alice" is compatible with having a completely different genetic constitution (different sex, different hereditary traits, etc.). GE preserves the intuition that your fraternal twin is a *different person*, not a counterfactual version of you. Therefore, GE offers the superior verdict: the unimplanted embryo represents a lost sibling, not a lost self.

  ### 2. The Natural Delay Case: Timing and the "Queue"
  Consider the case where the couple conceives naturally a month later than they actually did. Biologically, a month's delay involves a different egg (from a new ovulation cycle) and different sperm (from a new production cycle).

  *   **The PE Verdict:** Since the parents are the same, the person born from the later conception could be the same person as the actual one.
  *   **The GE Verdict:** Since the gametes are numerically different, the person born from the later conception would be a different person (a younger sibling).

  This case highlights the role of **timing** in origin essentialism. Kripke famously argued that we cannot imagine being born of different parents; GE extends this to the gametes. The intuition here relies on the causal chain of conception. The specific sperm that fertilizes the egg is contingent upon the precise timing of intercourse relative to ovulation.

  If PE were true, the identity of a person would be insensitive to the specific biological materials that constitute them, provided the "agents" (parents) remain the same. This leads to the "Too Many People" problem. If a couple is fertile for 20 years, PE suggests they could have produced *you* at any point during that window. This implies there are thousands of possible worlds where *you* exist, each with a different genetic makeup and birth date. This dilutes the concept of individual identity to the point of meaninglessness.

  GE respects the intuition that if your parents had waited a month (or a year) to conceive, they would have had a *different child*. That child might look like you and share your name, but metaphysically, it would be your sibling. Timing is essential not because time itself is magical, but because time determines *which* gametes meet. Since gametes are essential (per the IVF argument), the timing that selects those gametes becomes indirectly essential.

  ### 3. Does Parental Origin Screen Off Gametic Origin?
  Proponents of PE might argue that parental origin "screens off" gametic origin. In probabilistic terms, screening off means that once you know the cause (the parents), knowing the intermediate detail (the gametes) adds no further information about the effect (the person's identity). They might argue that we identify people by their lineage, not their genetic code.

  However, this view conflates **efficient causation** with **material causation**.
  *   **Parents** are the *efficient cause*: they are the agents who bring the child into being.
  *   **Gametes** are the *material cause*: they are the physical stuff from which the child is constituted.

  In metaphysics, identity is typically tied to material constitution. Consider a statue: knowing the sculptor (efficient cause) does not tell you *which* statue it is if the sculptor makes many. You need to know which lump of clay (material cause) was used. Similarly, parents produce many potential genetic combinations. To pick out a specific individual, we must specify the material from which they arose.

  Parental origin does not screen off gametic origin because the parents do not determine the identity of the child; they determine the *pool* of possible children. The specific gametes select the specific individual from that pool. If we accept that genetic constitution plays a significant role in who we are (our physical traits, predispositions, and even aspects of personality), then changing the gametes changes the person. PE asks us to accept that "you" could have been a different sex or had a different genetic disease simply because the parents remained the same. This is counterintuitive. GE acknowledges that while parents are necessary, they are not sufficient for transworld identity; the specific genetic starting point is required to individuate one possible person from another within the same lineage.

  ### Conclusion
  Gamete Essentialism offers a more robust metaphysical framework than Parental Essentialism. In the IVF case, GE preserves the necessary distinctness of siblings, avoiding the absurdity that you could have been your fraternal twin. In the Natural Delay case, GE aligns with the intuition that a later conception yields a younger sibling, not the same person born later. Finally, GE correctly identifies that parental origin does not screen off gametic origin because identity requires specificity in material cause, not just efficient cause. While PE appeals to a looser, social sense of origin, GE is required to maintain a coherent, non-arbitrary account of numerical identity across possible worlds.
