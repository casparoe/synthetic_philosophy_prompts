      *   *Reason 4: Timing.*
          *   Timing is crucial for gamete selection.
          *   GE respects the causal chain: Specific Time $\rightarrow$ Specific Gametes $\rightarrow$ Specific Person.
          *   PE ignores the causal specificity of the gametes, focusing only on the agents.
          *   Intuition: If my parents had waited 5 years, they would have had a different child. That child is my sibling, not me. PE struggles to explain why the 5-year delay creates a sibling while a 1-minute delay (same gametes potentially?) might not. GE handles this by focusing on the material cause.

  5.  **Address Counterarguments (Steel-manning PE):**
      *   PE might argue that "you" are defined by your lineage/narrative, not your DNA.
      *   Rebuttal: While lineage is important for *social* identity, *metaphysical* identity requires stricter conditions to avoid duplication problems (IVF case).
      *   PE might argue GE is too chancy (what if the sperm wiggled differently but was the same sperm?).
      *   Rebuttal: GE usually specifies the *numerical identity* of the gametes, not their exact trajectory. But the IVF case involves *numerically distinct* gametes (different sperm, different egg). PE fails most clearly there.

  6.  **Structure the Essay:**
