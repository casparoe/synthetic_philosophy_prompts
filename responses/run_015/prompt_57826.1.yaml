      *   **Two Versions:**
          1.  *Gamete Essentialism (GE):* A person $x$ could not have come from a different sperm ($s$) and egg ($e$) than the actual $s$ and $e$. (Strict identity based on specific genetic material).
          2.  *Parental Essentialism (PE):* A person $x$ could have come from different gametes, provided they are from the same parents ($P_1, P_2$). (Identity based on lineage/parents, not specific genetic combination).
      *   **Test Cases:**
          1.  *IVF Twin Case:* Couple creates two viable embryos ($E_1, E_2$) from their gametes in the same cycle. Only $E_1$ is implanted (resulting in Person $A$). Could $A$ have been $E_2$?
          2.  *Natural Conception Delay Case:* Couple conceives naturally a month later than actual, using different gametes (since gametes are produced cyclically). Could the resulting person be the same as the actual person?
      *   **Task:** Argue for one version over the other based on:
          *   Intuitions about identity.
          *   The role of timing.
          *   Whether parental origin "screens off" gametic origin.

