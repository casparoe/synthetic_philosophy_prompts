      *   *Grad:* Testimony is a specific case of a signal. JB is different (no source). Soft spot: Boundary between testimony and direct evidence.

  5.  **Strategic Advice (Concede/Refuse/Weakest Joint):**
      *   *Concede:* JC is useful/heuristic. Virtual Evidence is mathematically equivalent.
      *   *Refuse:* That JC is a fundamental norm. That JB has a unique solution without extra assumptions.
      *   *Weakest Joint:* User suspects "RI well-definedness on infinite algebras." Flatmate suspects "Grain -> RI." Actually, the weakest joint is likely *why* RI is a requirement of rationality. Why *should* representation invariance hold?
      *   *The Dreaded Question:* "If you need a signal model to get uniqueness, haven't you just admitted JC wasn't the problem, but rather the *input* was?" OR "Doesn't RI just collapse into MaxEnt anyway?" Let's go with: "Doesn't RI just force you to assume a uniform prior over the sub-cells, which is exactly the MaxEnt solution you're criticizing?" (This hits the "smuggling assumptions" charge back at the user).

  6.  **Refining and Polishing:**
