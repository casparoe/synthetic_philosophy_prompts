      *   Make sure the ML person doesn't sound like the Imprecise person.
      *   Ensure the "Weakest Joint" analysis is honest.

      *(Self-Correction during drafting)*: I need to make sure I don't solve the philosophy for them, but equip them to handle the room. The ML person's objection is tricky because the user admits the math is similar. The distinction must be *philosophical* (normative vs descriptive).
      The "Weakest Joint": The user thinks it's the algebra issue. The flatmate thinks it's the move to RI. I should advise them that the *normative force* of RI is the real weak point. Why is representation invariance a rational requirement?
      The "Dreaded Question": Needs to be something that undermines the *motivation*. "If the signal model is required, isn't this just standard Bayesianism, and JC was never the rival?"

  7.  **Final Review against constraints:**
      *   8 objections? Yes.
