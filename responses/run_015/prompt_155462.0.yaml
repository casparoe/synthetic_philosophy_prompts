  # HANDOUT: The Aunt Hillary Decision Tree
  **Starting Commitment:** *The mature ant colony is a genuine biological individual (a superorganism) subject to natural selection.*  
  **Goal:** *Determine the mental status of this individual.*

  ---

  ## THE FLOWCHART

  ```text
  START: [Biological Individual]
    │
    ▼
  Q1: GLOBAL STATE (Case: Repletes / Soldier Ratio)
  "Does the colony maintain a variable (e.g., defense level, food volume) 
   that no single ant represents or tracks?"
    │
    ├─ NO ───────────────────────────────────────► LEAF A: Mere Aggregate
    │                                              (Biologically real, mentally none)
    │
    ▼ YES
    │
  Q2: DECISION LOCUS (Case: Nest-Site Quorum Sensing)
  "When a choice is made, does any single ant compare the alternatives?"
    │
    ├─ YES ──────────────────────────────────────► LEAF B: Nothing Over and Above 
    │                                              the Ants' Minds
    │                                              (Systemic outcome, individual logic)
    ▼ NO
    │
  Q3: SUBSTRATE (Case: Pheromone Trails / Nest Structure)
  "Is the information processing done exclusively inside ant nervous systems,
   or does it constitutively depend on the nest/trails?"
    │
    ├─ DEPENDS ON NEST/TRAILS ───────────────────► LEAF C: Cognition Spread Across 
    │                                              Nest and Trails
    │
    ▼ ANTS ONLY
    │
  Q4: ONTOLOGY (Case: Predictive Success vs. Mechanism)
  "Is calling the colony a 'thinker' merely a useful predictive strategy,
   or a claim about its internal causal reality?"
    │
    ├─ USEFUL STRATEGY ──────────────────────────► LEAF D: Intentional System 
    │                                              (No what-it's-likeness)
    │
    ▼ CAUSAL REALITY
    │
  Q5: IDENTITY CONDITIONS (Case: Fission / Storm Death)
  "When the colony splits or loses organization, is there a fact of the matter
   about whether the 'subject' survived, or is it a stipulation?"
    │
    ├─ FACT OF THE MATTER ───────────────────────► LEAF E: Real Colony-Level Mind
    │                                              (Ants play the role of neurons)
    │
    └─ STIPULATION ──────────────────────────────► LEAF F: No Determinate Answer
                                                   (Subject boundaries are vague)
  ```

  ---

  ## LOGICAL SPACE ANALYSIS
  *This matrix shows how the 5 Questions (Q1–Q5) map to the 6 Leaves. Combinations marked [X] are incoherent or undefended.*

  | Path | Q1 (State) | Q2 (Locus) | Q3 (Substrate) | Q4 (Ontology) | Q5 (Identity) | **POSITION** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **A** | No | — | — | — | — | **Mere Aggregate** |
  | **B** | Yes | Yes | — | — | — | **Nothing Over Ants' Minds** |
  | **C** | Yes | No | Extended | — | — | **Cognition Spread Across Nest** |
  | **D** | Yes | No | Ants | Instrumental | — | **Intentional System** |
  | **E** | Yes | No | Ants | Realist | Fact | **Real Colony-Level Mind** |
  | **F** | Yes | No | Ants | Realist | Stipulation | **No Determinate Answer** |
  | *[X]* | *No* | *Yes* | *—* | *—* | *—* | *[Incoherent: Global state requires systemic logic]* |
  | *[X]* | *Yes* | *No* | *Ants* | *Realist* | *Fact* | *[See Leaf E]* |
  | *[X]* | *Yes* | *No* | *Extended*| *Realist* | *Fact* | *[Undefended: Extended minds usually accept vague boundaries]* |

  ---

  ## NOTES FOR DISCUSSION
  1.  **Q1 (Repletes/Ratio):** If you answer "No," you deny the colony has a perspective distinct from the ants, even if it is a biological individual.
  2.  **Q2 (Quorum):** If you answer "Yes," you locate the mind in the scout ants, not the colony. Hofstadter argues "No."
  3.  **Q3 (Trails):** If you answer "Extended," you align with Extended Cognition Theory (Clark/Chalmers). If "Ants Only," you align with traditional Functionalism.
  4.  **Q4 (Ontology):** This is the Dennett Fork. Is the mind *real* or just a *stance*?
  5.  **Q5 (Fission):** If the colony splits, does the "self" divide? If boundaries are vague, Leaf F follows.

