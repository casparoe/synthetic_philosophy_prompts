  # META-COMMENTARY FOR THE ORGANIZER

  ### Logical Space Construction
  I built the tree to force commitments on **function** before **ontology**. This prevents participants from jumping straight to "It's just a metaphor" (Leaf A/D) without acknowledging the biological reality established in your starting commitment. The concrete cases (Repletes, Quorum, Trails, Fission) anchor abstract questions in the specific biology of *Pogonomyrmex* or *Temnothorax*, keeping the discussion grounded in the Aunt Hillary text.

  ### Empty Combinations
  *   **Q1-No / Q2-Yes:** Incoherent. If no global states exist (Q1-No), there is nothing for individual ants to sum up into a decision (Q2-Yes) that differs from their own intent.
  *   **Q3-Extended / Q5-Fact:** Undefended. Extended cognition theorists generally embrace vague boundaries (the "coupling" fades gradually), making a sharp "Fact of the matter" (Leaf E) difficult to defend if you choose the Extended path (Leaf C). I routed Q3-Extended directly to Leaf C to avoid this tension.

  ### Least Confident Fork: Q4 (Ontology)
  I am least confident in the separation between **Leaf D (Intentional System)** and **Leaf E (Real Colony-Level Mind)**.
  *   **Why:** Dennett's core argument is that "Real Mind" *just means* "System reliably predictable via Intentional Stance." Separating them implies there is a "further fact" of consciousness beyond functional organization, which Dennett explicitly denies.
  *   **Rebuild Trigger:** If your group consists of hardline Dennettians, they will reject Q4 as a false dichotomy. They will argue Leaf D *is* Leaf E. In that case, collapse Q4 and Q5 into a single question: *"Is the colony a subject of experience, or merely a locus of information processing?"* This would merge Leaves D and E, simplifying the tree but losing the nuance between Instrumentalism and Functional Realism.

  ### Separation of Leaves
  *   **Leaf E vs. Leaf F:** These are hard to separate empirically. Both accept a real functional mind; they differ only on whether identity conditions are sharp (E) or vague (F). I kept them separate because the *Fission* case (one becoming two) is a classic philosophical puzzle in the Aunt Hillary dialogue that deserves its own node.
  *   **Leaf C vs. Leaf E:** These are distinct based on substrate. Leaf E requires the "Ants as Neurons" isomorphism (internal processing). Leaf C allows the nest itself to be part of the mind. This is a clear, defensible distinction.
