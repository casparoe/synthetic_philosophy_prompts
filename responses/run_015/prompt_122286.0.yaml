      *   *Setup:* Symmetric universe. Two spheres, same material, size, color, temperature, etc. Distance $d$ apart.
      *   *The "Property" Issue:* Is "being 5 miles from Sphere B" a property of Sphere A?
          *   If yes: They differ (A is 5 miles from B, B is 5 miles from A). PII holds.
