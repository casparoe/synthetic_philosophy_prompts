  **AXIOMATIC HOLDINGS**
  **INTERNAL POLICY DOCUMENT 904-B**
  **SUBJECT: Moral Luck-Adjusted Accountability Framework (MLAAF)**

  **1. Purpose and Philosophical Alignment**
  This framework aligns disciplinary sanctions and merit compensation with the principle of Agentic Purity. Employees are accountable only for variables within their voluntary control. All performance metrics must be scrubbed of fortune contamination to isolate the residual agentic contribution. The objective is to ensure that no employee is rewarded for success derived from chance nor punished for failure induced by external determinants.

  **2. Type-C Circumstantial Fortune Variables**
  Situational Blame Ratings must be adjusted for Type-C Circumstantial Fortune Variables. These define external conditions encountered by the employee, such as market volatility, unexpected regulatory shifts, or the presence of unethical competitors. If an employee faces a scenario where ethical failure is statistically probable due to environmental pressure, the Situational Blame Rating is reduced proportionally. However, voluntary exposure to high-risk environments constitutes a waivable offense, negating this adjustment. Managers must document the probability of temptation inherent in the assigned role prior to evaluation.

  **3. Causal Chain Interruption**
  Background causal factors, including socioeconomic upbringing and prior institutional conditioning, are classified as Causal Luck. While recognized as determinants of behavior, Causal Luck is generally inadmissible in mitigation unless it directly impairs cognitive capacity as defined by Medical Policy 12. Employees claiming causal determination must submit genealogical impact statements for review.

  **4. Constitutive Fortune Adjustments**
  Character-Based Evaluations assess innate temperament and disposition. Under this clause, traits such as natural diligence, risk aversion, or charisma are identified as Constitutive Fortune. Since these traits are not chosen, Character-Based Evaluations are discounted when those traits lie outside the employee's control. Performance reviews will therefore penalize natural aptitude to ensure equity between naturally gifted and struggling personnel. Effort metrics are prioritized over outcome metrics to compensate for constitutive disparities. A "Natural Talent Tax" may be applied to high-performers whose success stems from unearned neurological advantages.

  **5. Internal Critique and Limitation**
  Senior Analyst J. Aris has noted that removing constitutive and causal variables leaves no subject to evaluate. Per Compliance Directive 5, this objection is logged but does not halt implementation. The framework proceeds on the assumption that an Agentic Core exists, despite the inability to locate it empirically. Employees are reminded that questioning the existence of the Agentic Core is itself a constitutive trait subject to adjustment.

  **6. Counterfactual Normalization Protocol**
  This protocol applies to Resultant Luck Events, where outcomes depend on unforeseeable factors. Bonuses are forfeited when success is judged fortune-contaminated. Managers must simulate counterfactual scenarios wherein the employee's actions remained constant but external variables shifted. If the project fails in the simulation, the actual success is deemed luck-dependent. Conversely, failed projects resulting from bad luck may be reclassified as neutral performance, preventing undue penalty for unfortunate outcomes. The Simulation Software must run at least one thousand iterations to establish statistical significance.

  **7. Calculation of Agentic Residual**
  The final accountability score is derived by subtracting Circumstantial, Constitutive, and Resultant variables from the total performance data. In cases where the subtraction exceeds the total data, the employee is assigned a Zero-Agency Status. Zero-Agency employees are ineligible for promotion but remain liable for contractual obligations. This ensures that the firm retains operational capacity while acknowledging the metaphysical innocence of the workforce.

  **8. Appeals and Board Constitutive Luck**
  An employee may petition the Ethics Adjustment Board if they believe a blame rating ignores circumstantial or causal luck. The Board reviews petitions using the MLAAF standards. However, the Board's own decision is noted as subject to Board Constitutive Luck. Therefore, Board rulings are provisional and subject to reversal by a future Board whose members possess different constitutive traits. Finality is not guaranteed under this framework. All appeals are processed within sixty to ninety business days, depending on the temperamental patience of the adjudicator.

  **Appendix A: Fortune Contamination Matrix**
  [Table Omitted for Brevity]
  **End of Document**

  ***

  **Author's Note**

  This satire maps Thomas Nagel's four categories of moral luck (constitutive, circumstantial, causal, resultant) onto HR metrics. Clauses 2, 4, and 6 correspond to settled distinctions in the literature regarding how luck influences judgment. However, the "Zero-Agency Status" and "Board Constitutive Luck" are speculative institutional extensions. The piece takes liberties with the contested interpretation of whether constitutive luck entirely undermines responsibility; many philosophers argue it mitigates rather than eliminates blame. Similarly, the "Counterfactual Normalization Protocol" satirizes the impossibility of fully isolating resultant luck without collapsing evaluation into arbitrariness, a point heavily debated among compatibilists and skeptics.
