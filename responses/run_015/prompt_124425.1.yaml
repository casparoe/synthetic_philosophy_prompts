answer: |-
  Here's a run-sheet for the "Coupled Tree" exercise. It's designed to force the coupling so hard that the constitution question becomes unavoidable when you pull the plug on the artifact.

  ### **Activity: The Coupled Tree**
  **Goal:** Make the parity principle feel visceral by breaking the coupling mid-stream.
  **Class Size:** 14 students (7 pairs).
  **Time:** 75 mins.

  ---

  ### **Materials**
  1.  **7 Printed Decision Trees:** Large format (11x17 ideally). A root node ("Defendant Liable?") branching into 4 layers of conditions (e.g., Duty, Breach, Causation, Damages). Each node has a blank box for the verdict (Yes/No) and a small margin for "Reason Code."
  2.  **Role Cards:** 7 marked "VOICE," 7 marked "HAND."
  3.  **Pens:** Only HAND gets a pen.
  4.  **Blinders (Optional):** Folded cardstock for VOICE to hide the tree if they try to peek at annotations (though rules should forbid this).
  5.  **Exit Slips:** Half-sheets of blank paper for the individual recall phase.

  ---

  ### **Timeline (75 mins)**

  **0:00 – 0:10 | Intro & Grouping**
  *   Don't mention Extended Mind yet. Tell them this is a workshop on collaborative reasoning under constraints.
  *   Split into 7 pairs. Hand out Role Cards.
  *   **Rule:** VOICE can see the tree and talk. HAND can see the tree and write. HAND cannot speak. VOICE cannot write or point (must use verbal directions only, e.g., "top left branch").
  *   **Goal:** Fill every node on the tree within 20 mins. Consistency matters more than speed.

  **0:10 – 0:30 | The Task (20 mins)**
  *   Hand out the Trees.
  *   Start the clock.
  *   **Instructor Role:** Walk around. If VOICE starts pointing, stop them. If HAND talks, stop them. If a pair finishes early, tell them to double-check consistency on branch 3.
  *   *Note:* Watch for the dynamic. Usually, VOICE starts dictating like a boss, HAND becomes a stenographer.

  **0:30 – 0:45 | The Separation (15 mins)**
  *   **Crucial Step:** Collect the Trees immediately. Do not let them take photos.
  *   Separate the pairs (move chairs apart or have one person turn around).
  *   Hand out Exit Slips.
  *   **Prompt:** "Without consulting your partner or the sheet, write down the specific reasoning chain used for Node 3 (the Causation branch). Include the verdict and the specific reason code written in the margin."
  *   Tell them: "Your pair receives full participation credit only if both slips match the original tree exactly."

  **0:45 – 1:15 | Reveal & Debrief (30 mins)**
  *   **The Reveal (5 mins):** Have pairs compare slips to the original tree (you hold the tree). Most will fail. Some will match the verdict but forget the reason code. Some will disagree on *why* they chose the path.
  *   **Discussion (25 mins):** See Debrief Guide below.

  ---

  ### **Payoff Scheme**
  *   **Shared Points:** 2 participation points per pair if *both* individuals reproduce Step 3 correctly.
  *   **Reality Check:** Almost no one will get this. That's the point.
  *   **Consolation:** Give 1 point to everyone who attempts the recall honestly. The frustration of losing the second point is where the learning lives.

  ---

  ### **Debrief Guide**
  *Don't lecture. Ask questions based on their failure.*

  1.  **The Parity Principle (Clark & Chalmers):**
      *   *Ask:* "When you were working, where was the reasoning happening? Was the logic in VOICE's head, or on the paper?"
      *   *Push:* If they say "in the head," ask why they couldn't recall it without the paper. If the paper was just storage, the retrieval should be internal. If the paper was part of the *process*, removing it breaks the cognitive loop.
      *   *Point:* The tree wasn't just a record; it was a workspace. The cognitive state was distributed across the dyad + paper.

  2.  **Coupling-Constitution Objection (Adams & Aizawa):**
      *   *Ask:* "Just because you were coupled to the paper, does that mean the paper was *part* of your mind?"
      *   *Push:* Bring up the failure of the recall test. The coupling was clear, but did it constitute a unified cognitive system?
      *   *Point:* This is where you note the limits. The exercise shows *coupling* clearly. It hints at *constitution*, but a critic could say you just created a fragile dependency, not a genuine cognitive extension. The memory wasn't integrated; it was offloaded.

  3.  **The "Fuzzy Boundary" Moment:**
      *   Highlight moments where HAND corrected VOICE using the visual layout (e.g., seeing a contradiction VOICE forgot). Was HAND thinking, or was the *system* thinking?
      *   Admit openly: This demo can't prove functionalism. It just makes the internalist view feel awkward. You supply the functionalist analysis in the lecture next week.

  ---

  ### **Predictable Breaks & Fixes**
  You asked how to stop VOICE from dominating and HAND from becoming a passive scribe. If HAND is just a tool, the "extended mind" is just "using a tool," which is trivial. You need HAND to have cognitive agency.

  **Problem 1: Voice Dictatorship**
  *   *Symptom:* VOICE streams consciousness; HAND writes whatever is said.
  *   *Fix:* **The Veto Token.** Give HAND one physical token (a poker chip or colored sticker). HAND can place this on any node to indicate "I disagree/uncertain." VOICE must stop and re-argue that node verbally before HAND removes the token. This forces HAND to evaluate logic, not just transcribe.

  **Problem 2: Hand as Passive Storage**
  *   *Symptom:* HAND doesn't engage with the content, just the motor act.
  *   *Fix:* **Reason Code Constraint.** VOICE cannot give the "Reason." VOICE gives the argument; HAND must summarize the argument into a 3-word "Code" written in the margin. This forces HAND to process and compress the info, making them a co-processor rather than a hard drive.

  **Problem 3: Memorization Cheat**
  *   *Symptom:* One student just memorizes the tree during the 20 mins to pass the recall test.
  *   *Fix:* **Complexity Load.** Ensure the tree has enough branches (at least 15 nodes) that rote memorization is impossible in 20 mins. They *must* rely on the structure logic, not raw memory.

  **Problem 4: Communication Breakdown**
  *   *Symptom:* VOICE says "left branch," HAND writes on "right branch."
  *   *Fix:* Allow HAND to point to confirm, but not speak. Or give HAND a "Clarify" card they can raise to force VOICE to rephrase.

  ---

  ### **Instructor Notes (Casual)**
  *   **Typo check:** I probaby missed a comma somewhere above, hope thats cool.
  *   **Vibe:** Keep the separation phase strict. No talking between partners once the trees are collected. The anxiety of "did we match?" is useful data for the debrief.
  *   **Backup:** If a pair finishes way too fast, give them a "Disruptor Card" mid-game that changes one rule (e.g., "VOICE must now whisper"). This adds noise to the coupling and makes the reliance on the artifact even sharper.

  This should get them feeling the boundary blur without you having to draw diagrams on the board. Good luck with the seminar.
