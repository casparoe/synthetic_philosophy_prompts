answer: |-
  Here is an analysis of the boundary problem applied specifically to your friend's situation in the Gulf state.

  ### 1. The Puzzle Stated
  The boundary problem arises because democracy requires a defined group ("the people") to make decisions, but the definition of that group is itself a decision. To vote on who gets to vote, you must already be a voter. This creates a logical circle: the demos must exist to define the demos. In your friend's case, this is not merely logical; it is structural. The current citizenry (the demos) holds the exclusive power to define membership, but they have a material incentive to keep the circle small to maintain their political and economic dominance over the non-citizen majority. The puzzle asks: On what basis can the current group legitimately exclude your friend, and who has the authority to draw that line?

  ### 2. & 3. Resolutions and Specific Implications

  Here are the three primary ways political theorists attempt to resolve this circle, and what each implies for your friend and the political system he lives in.

  #### A. The Territorial Principle (All-Subjected or All-Affected)
  **The Theory:** This approach argues that the boundary of the demos should match the boundary of coercion or impact. If you are subject to the laws of a state, or if your life is fundamentally shaped by its decisions, you should have a voice in making them. This resolves the circle by prioritizing *facts on the ground* over legal status.

  **Implications for Your Friend:**
  *   **Membership:** Under this principle, your friend is unequivocally a member of the demos. He was born there, has lived there for 50 years, and is subject to the state's laws, security apparatus, and economic policies. His residency is "renewable at discretion," meaning he is subject to coercion (deportation) without representation.
  *   **The System:** The current political structure is illegitimate. A system where a small minority of citizens governs a large majority of permanent residents violates the core democratic tenet that those who are ruled must choose the rulers.
  *   **Who Decides the Rules?** This is where the implication becomes radical. If the "All-Subjected" principle is adopted, the *current* citizens cannot be the ones to decide the new rules of membership, because they are biased beneficiaries of the exclusion. Ideally, a constitutional convention including long-term residents would be required to draw the new boundaries. However, since the current citizens hold the monopoly on force, they would have to voluntarily surrender their exclusivity. This implies that reform cannot come from within the existing electoral logic; it would require a fundamental restructuring of the state, likely driven by external pressure or internal unrest, because the current "people" will not vote to cease being the exclusive "people."

  #### B. The National/Ethnic Principle (The *Ethnos*)
  **The Theory:** This approach resolves the circle by claiming the demos is not a political choice but a pre-political fact. The "people" are defined by shared blood, lineage, tribe, or historical culture. Democracy is not the rule of everyone in a territory, but the self-determination of a specific nation.

  **Implications for Your Friend:**
  *   **Membership:** Your friend is excluded legitimately. In many Gulf states, citizenship is based on *jus sanguinis* (right of blood) and proof of lineage prior to a certain date (often the 1920s or 1950s). Despite his 50-year residence and birth in the country, he lacks the tribal or genealogical connection required to be part of the "nation." He is a long-term guest, not a family member.
  *   **The System:** The system is consistent, provided one accepts that the state exists to protect a specific ethnic or national group rather than to govern a territory democratically. The demographic imbalance (small citizen majority, large non-citizen minority) is a feature, not a bug; it preserves the welfare and political power of the national group.
  *   **Who Decides the Rules?** The existing national community decides. Because membership is based on identity rather than residence, the current citizens are the sole guardians of that identity. They have the right to exclude your friend to preserve the cultural or economic integrity of the nation. The circularity is broken by saying, "We do not decide who the people are; history/blood decided, and we merely recognize it." For your friend, this implies that no amount of time or integration will grant him a voice, because the boundary is not meant to be permeable.

  #### C. The Legalist/Status Quo Principle (Constitutional Positivism)
  **The Theory:** This approach sidesteps the philosophical question by accepting the existing legal order as the starting point. The "people" are simply whoever the current constitution says they are. Democracy operates *within* the boundaries, not *on* them.

  **Implications for Your Friend:**
  *   **Membership:** Your friend has no claim to membership. He entered under a specific legal contract (employment/residency visa) that explicitly distinguishes him from a citizen. By accepting the visa and staying, he arguably accepted the terms of the political order.
  *   **The System:** The system is legally valid. The boundary problem is treated as a "bootstrap" issue: someone had to draw the first line, and that line is now the law. The fact that the current demos decides the rules is not a bug; it is the definition of sovereignty.
  *   **Who Decides the Rules?** The current citizens (or the ruling family acting on their behalf) decide. This creates a "locked door" scenario. Since the mechanism for changing the rules (voting, constitutional amendment) is restricted to citizens, your friend has no procedural path to change his status. The implication is that any change in his status is an act of *grace* or *policy* by the rulers, not an act of *justice* or *right*. He must wait for the existing demos to decide to include him, knowing that doing so would dilute their own wealth and voting power.

  ### Summary of the Implications for the Case
  The boundary problem in this specific Gulf context reveals a tension between **democratic legitimacy** and **regime survival**.

  1.  **If you follow the Territorial Principle:** The state is fundamentally undemocratic. Your friend is being governed without consent. The implication is that the state should either naturalize the long-term residents (which would turn citizens into a minority and likely collapse the current welfare/political system) or it must admit it is not a democracy.
  2.  **If you follow the National Principle:** Your friend's exclusion is justified, but the state must admit it is an ethnostate or a tribal polity, not a universal democracy. The implication is that your friend should not expect political integration, but perhaps better labor protections as a "guest."
  3.  **If you follow the Legalist Principle:** Your friend is stuck in a trap. The group that decides the rules (citizens) is the exact group that benefits from keeping him out. The boundary problem here exposes that the "will of the people" is actually the "will of a specific subset of people" protecting their privileges against the majority they employ.

  For your friend, the boundary problem implies that his lack of a voice is not an oversight; it is the result of a specific choice about where to draw the line. Because the group inside the line controls the pen that draws it, the only way for his situation to change is if the cost of excluding him (economic stagnation, human rights pressure, social instability) becomes higher for the citizens than the cost of including him (sharing political power and wealth). Until then, the circle remains closed.
