  7.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "citizen" and "resident" is sharp. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to be careful not to diagnose the specific country (e.g., UAE vs Qatar) but treat it as the archetype described (Gulf state, 1970s labor migration, demographic imbalance). I will refer to it as "the Gulf state" to maintain the hypothetical framing while being realistic.

  *(Refining the "Who Decides" aspect)*: This is the hardest part. In the "All Affected" view, an external arbiter or a constituent assembly including residents is needed. In the "National" view, the existing citizens decide. I need to make sure this tension is clear.

  *(Refining the "Circularity")*: Emphasize that in this specific case, the circle is locked tight. The citizens won't expand the demos because they would become a minority. This makes the boundary problem a matter of regime survival, not just philosophy.

