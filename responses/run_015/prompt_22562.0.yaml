      *   **Context:** Small citizen demos governing a large non-citizen majority.
      *   **Tasks:**
          1.  State the puzzle in my own words.
          2.  Lay out main resolutions (territorial, cultural/national, existing order, consent).
          3.  Apply each resolution specifically to the friend's case, addressing who decides the rules.
      *   **Constraint:** Do not give a general abstract discussion; focus on the specifics of this case (multi-generational residents, small demos/large non-citizen majority, circularity of reform).

  2.  **Deconstruct the Boundary Problem (Task 1):**
      *   *Core Issue:* Democracy requires a "demos" (the people) to make decisions. But defining the "demos" is itself a decision. Who makes *that* decision? If the demos decides, they must already exist. If they don't exist yet, who decides? It's circular (the "constituency problem").
      *   *Relevance to Case:* In the Gulf state, the current "citizens" define the boundaries. They exclude long-term residents. Is this democratic? If democracy means "rule by all affected," the exclusion seems undemocratic. If it means "rule by the pre-defined nation," it might be consistent internally but exclusionary externally.

  3.  **Identify Resolution Strategies (Task 2 & 3):**
      *   *Strategy A: All Affected Interests (AAI) / Terrorial Connection.*
          *   *Theory:* Anyone affected by decisions should have a say. Or, anyone subject to coercion within a territory.
          *   *Application:* The friend is affected by laws, taxes (if any), infrastructure, security. He lives there permanently.
          *   *Implication:* He *should* vote. The current boundary is unjust.
          *   *Who Decides?* Ideally, a neutral arbiter or a constitutional convention including residents. But practically, the current citizens hold the power. This highlights the paradox: the excluded cannot vote themselves in.
      *   *Strategy B: National/Cultural Identity (Ethnos).*
          *   *Theory:* The demos is defined by shared history, blood, language, religion.
          *   *Application:* The Gulf state often defines citizenship via *jus sanguinis* (blood) or specific tribal/national lineage. The friend, despite birth/residency, lacks the "blood" or tribal affiliation.
          *   *Implication:* Exclusion is legitimate. Democracy is for the *nation*, not just residents.
          *   *Who Decides?* The existing nation defines its own identity. This avoids the circularity by grounding it in pre-political facts (ethnicity).
      *   *Strategy C: Existing Legal Order / Status Quo.*
          *   *Theory:* The boundary is whatever the current constitution/law says. Democracy operates *within* boundaries, not *on* them.
          *   *Application:* The law says citizens vote, residents don't. That's the rule.
          *   *Implication:* The friend has no claim to vote. Reform is a gift from the state, not a right.
          *   *Who Decides?* The current citizens/rulers. This accepts the circularity as a necessary starting point (the "bootstrap" problem).
      *   *Strategy D: Consent of the Governed.*
          *   *Theory:* Legitimacy comes from consent.
          *   *Application:* Did the friend consent? He stayed. Is that consent? Or is it coerced because leaving means losing livelihood/home?
          *   *Implication:* Ambiguous. If staying = consent, exclusion is okay. If consent requires meaningful choice, exclusion is problematic.
          *   *Who Decides?* The state interprets the terms of residence (visa contracts).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the friend's situation. It's not just theory; it's his life.
      *   **Part 1: The Puzzle:** Define it clearly but briefly. Focus on the circularity: To vote on the rules, you must be a member; to be a member, you must vote on the rules.
      *   **Part 2 & 3: Resolutions and Implications:** (Combine these as requested to ensure specific application).
          *   *Approach 1: The "All-Subjected" or Territorial Principle.* Focus on coercion and residence.
              *   *Implication:* The current system is undemocratic. The friend is subjected to laws he can't shape.
              *   *The Decision Paradox:* The current citizens won't vote to dilute their power. This reveals the boundary problem isn't just logical; it's a power struggle.
          *   *Approach 2: The National/Ethnic Principle.* Focus on *jus sanguinis* and Gulf specificities (tribalism, lineage).
              *   *Implication:* The friend is a guest, not a member. Democracy is for the "family," not the "household staff."
              *   *The Decision Paradox:* The existing demos protects its identity. The boundary is rigid by design.
          *   *Approach 3: The Constitutional/Status Quo Principle.* Focus on legal positivism.
              *   *Implication:* There is no injustice, only legal distinction.
              *   *The Decision Paradox:* Only citizens can change the constitution. The friend is locked out of the mechanism of change.
      *   **Synthesis/Conclusion:** Address the specific constraint about the "small group governing a large non-citizen majority." This is the crux. In most democracies, the excluded are outside the border. Here, they are *inside*. This makes the boundary problem acute. The "Who decides?" question becomes a question of power, not just logic.

  5.  **Refining and Polishing:**
      *   *Tone:* Empathetic but analytical. Respectful of the friend's lived experience.
      *   *Specifics:* Ensure I mention the 1970s arrival, the 50-year residence, the renewable residency.
      *   *Check Constraints:* Did I avoid abstract generalization? Yes, kept tying back to the Gulf state context. Did I address who decides the rules? Yes, in each section.
