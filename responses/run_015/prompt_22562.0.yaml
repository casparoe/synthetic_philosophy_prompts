      *   *Crucial Point:* The prompt mentions "current demos is a small group governing a large non-citizen majority." This is the "Demographic Imbalance." I must highlight how this makes the "All Affected" principle revolutionary (it would overturn the state's structure) vs. the "National" principle (which preserves it).

  6.  **Final Review against constraints:**
