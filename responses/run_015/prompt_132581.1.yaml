answer: |-
  It is a pleasure to correspond with a colleague who understands that "the long term" is not a metaphor. In limnology, you deal with varves and sedimentation rates where a century is a blink; in economics, a century is often treated as a horizon beyond which numbers turn to zero. That friction is where the philosophy lives.

  You have asked me to map the exposure of your position: that the pure rate of time preference (PRTP) should be zero, and that discounting should reflect only risk/probability of receipt and opportunity costs. You want to know where the bodies are buried. I will adopt the role you requested: a philosopher of intergenerational ethics and decision theory. I will not give you the textbook summary of Ramsey vs. Pigou; you likely know the history. Instead, I will stress-test your specific arguments.

  Here is the breakdown of the defeaters, the physics argument, the empirical question, and the institutional case.

  ### 1. The "Absurd Savings" Objection (The Ramsey Trap)

  You recalled this correctly. It is the most significant technical challenge to your view.

  **The Mechanism:** In the standard Ramsey-Cass-Koopmans growth model, the optimal consumption path is governed by the Euler equation. Roughly: the social discount rate ($r$) is the sum of the pure rate of time preference ($\rho$) plus the product of the elasticity of marginal utility ($\eta$) and the growth rate of consumption ($g$).
  $$r = \rho + \eta g$$

  If you set $\rho = 0$ (your view), and you assume the economy will grow ($g > 0$), and you assume people get less satisfaction from each extra dollar as they get richer ($\eta > 0$), the math can imply one of two "absurdities" depending on the context:

  1.  **The Savings Glut:** If the return on capital is high, a zero $\rho$ implies we should save almost everything we produce today to make the infinitely long future infinitely rich. Since the future is infinite, the sum of utilities there dwarfs any finite loss today. This demands a savings rate that leaves the current generation in poverty.
  2.  **The Reverse Transfer:** Conversely, if we assume standard growth (future people will be richer than us), their marginal utility of consumption will be *lower* than ours. If $\rho = 0$, we weigh their utility equally to ours. Therefore, we should actually *consume* now and let them have less, because a dollar helps us more than it helps them. This violates the intuition of stewardship.

  **Does this sink you?**
  No, but it forces you to adjust other variables. It is not a *fatal* defeater for $\rho = 0$, but it is a *constraining* one.
  *   **Solution A:** You adjust $\eta$. If you argue that basic goods (clean water, stable climate) do not have diminishing marginal utility (a lake is either usable or dead), then $\eta$ behaves differently.
  *   **Solution B:** You change the Social Welfare Function. Instead of "Total Utilitarianism" (sum of all utility, which diverges to infinity over infinite time), you adopt "Average Utilitarianism" or a "Prioritarian" view that weights the worst-off generations more heavily.
  *   **Solution C:** You accept the implication. In the context of climate change (the Stern Review logic), the "absurd" savings rate is actually just the cost of preventing catastrophe. If the alternative is a collapsed biosphere, then yes, sacrificing 20% of GDP now might be rational.

  **Verdict:** **Serious, but not fatal.** It shows that $\rho=0$ cannot be held in isolation; it requires a coherent theory of value ($\eta$) and aggregation.

  ### 2. Map of Defeaters: From Fatal to Awkward

  Here is the exposure map for your specific claim ("Pure time preference is morally indefensible").

  **1. The Divergence Problem (Fatal-ish)**
  If time is infinite and $\rho = 0$, the total value of the future is infinite. Any finite cost today is justified to secure an infinite future. This leads to the "Tyranny of the Future," where the present generation has no moral permission to consume anything beyond subsistence.
  *   *Counter:* Most philosophers now agree we need a modified welfare function (not simple summing) rather than a positive $\rho$ to solve this.

  **2. The Non-Identity Problem (Complicated)**
  Associated with Derek Parfit. Policies that change the course of history (like building a dam or saving a lake) change *who* gets born in the future. If you save the lake, different people will exist in 2250 than if you drain it. Those specific future people cannot claim they were harmed by your decision, because without that decision, they wouldn't exist.
  *   *Exposure:* This doesn't defend discounting, but it undermines the simple "harm to future people" calculus you might be relying on. It suggests your ethics needs to be "impersonal" (about states of affairs) rather than "person-affecting."

  **3. The "Tie-Breaker" Argument (Awkward)**
  Some argue that even if future welfare counts equally, we have special obligations to our contemporaries (contracts, reciprocity, shared projects). Pure time preference might be zero, but "relational priority" is positive.
  *   *Exposure:* This concedes the metaphysical point (time itself doesn't matter) but reintroduces discounting via social ties. It's a pragmatic defeat, not a theoretical one.

  **4. The Uncertainty Conflation (Methodological Risk)**
  Your colleague argues for discounting. You argue it's all risk. If you define *all* discounting as risk, you risk making your theory unfalsifiable (see Section 4).

  ### 3. The Block Universe Argument: Physics or Category Error?

  You asked: *Physics doesn't pick out the present as metaphysically special... so why should temporal distance discount welfare?*

  **The Verdict:** It is a category error, but a productive one.

  **Why it's an error:** Ethics is not about the structure of spacetime; it is about *agency*. Agency is causally asymmetric. I can act on the future; I cannot act on the past. I can help a person in Tokyo (spatial distance) via a chain of causation that reaches them now. I cannot help a person in 2250 *now*, but I can set conditions for them.
  The "present" is metaphysically ordinary in relativity, but it is *agentially* unique. It is the only point where choice exists. A defender of pure time preference can argue that the "thinning out" of causal control over time justifies discounting. As time extends, my ability to ensure the benefit lands decreases, not just due to risk, but due to the fragility of causal chains.

  **Why it's productive:** It correctly identifies that "later" is not intrinsically "worse." It shifts the burden of proof to the discounter. They must explain *why* the causal distance matters morally. Usually, when pressed, they admit it's about risk or capacity, which collapses back into your view.

  ### 4. The Unfalsifiability Risk

  You are right to be suspicious. If every instance of apparent time preference is re-described by you as "implicit risk assessment," you have created a tautology.
  *   *Colleague:* "I discount 5%."
  *   *You:* "That's just your estimate of societal collapse."
  *   *Colleague:* "No, it's just impatience."
  *   *You:* "That's irrational, so it must be risk."

  **Is this fatal?** It is methodologically dangerous. To avoid it, you must allow for the possibility of *irrational* pure time preference. You need to admit that people (and economists) might genuinely value the present more *just because it is the present*, and label that a moral error.
  **The Fix:** Distinguish *epistemic* discounting (probability the benefit arrives) from *ontological* discounting (the benefit arrives, but counts less). Your claim is that ontological discounting is zero. If you treat all observed discounting as epistemic, you are making an empirical claim that might be wrong. You should instead say: "Observed discounting is a mix of legitimate risk and illegitimate pure time preference. We should policy-correct for the latter."

  ### 5. The Empirical Question

  *Suppose a study shows people have zero pure time preference when risk is controlled. Is this evidence for you?*

  **Strictly speaking: No.** This is the Is-Ought gap. Even if every human on earth believed the sky was green, the sky would not be green. Even if every human purely preferred the present, it might be morally wrong.
  **Practically speaking: Yes.** In public policy, we seek "Reflective Equilibrium." If our moral theory demands we treat people in a way that violates their deepest considered judgments about fairness, the theory is unstable. If empirical work shows that *when people think clearly* they reject pure time preference, it undermines the "human nature" defense your colleague uses. It suggests his discount rate is a technical artifact, not a psychological reality.

  **Verdict:** It is not proof of truth, but it removes a major defensive shield for your opponent.

  ### 6. The Institutional Case (Colleges and Cathedrals)

  *Does the behavior of a 400-year-old college support your side?*

  **Yes, but with a caveat.**
  Endowments operate on a "perpetual trust" model. They explicitly reject pure time preference. They smooth consumption over infinite time. If they discounted the future at 5%, they would spend the principal in 30 years. They don't.
  **The Caveat:** These are *artificial* agents with a specific mandate: *preservation*. A human being has a mandate that includes their own life and flourishing *now*. The college is a steward; the colleague is arguing for a utility that serves current ratepayers.
  However, this case supports your **Stewardship Model**. It shows that low-discount reasoning is not "science fiction"; it is the standard operating procedure for institutions designed to outlive individuals. It validates that $\rho \approx 0$ is a coherent, operationalizable stance for public goods (like lakes).

  ### 7. Confidence and Uncertainty

  **Confidence Level:** High on the ethical principle; Moderate on the decision-theoretic implementation.
  I am confident that the claim "a benefit counts less merely because it is later" is morally arbitrary. That is the consensus of modern intergenerational ethics (Parfit, Rawls, Stern).

  **The Claim I Am Least Sure About:**
  The **Aggregation Problem**.
  I am uncertain whether we can mathematically sum welfare across generations without running into the "Divergence" (infinity) problems I mentioned in the Ramsey section.
  *   **Is this factual or judgment?** It is a **judgment call** in decision theory. There is no settled "fact" on how to compare the welfare of an infinite sequence of generations. Some philosophers argue we should use "discounted utilitarianism" simply to make the math converge, treating $\rho$ as a mathematical necessity rather than an ethical one. I disagree, but I cannot prove them wrong without a better theory of infinite ethics.

  **Summary for your reunion:**
  Your colleague is defending a convention (market discounting) as a moral truth. You are defending a moral truth (temporal neutrality) that requires complex implementation. You are right that pure time preference is ethically indefensible. However, be prepared to answer the "Tyranny of the Future" objection: if we owe everything to 2250, what do we owe ourselves? The answer lies not in discounting the future, but in defining "sufficiency" for the present.

  Keep pulling those cores. The sediment doesn't discount.
