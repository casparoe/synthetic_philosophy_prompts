  # Leaf Profiles

  ### 1. The Autonomy View
  *   **Core Claim:** The wrong of deception is that it hijacks the hearer's deliberation; deliberate misleading is therefore equally wrong.
  *   **Most Awkward Commitment:** It must condemn a surgeon who lies to a patient to prevent a fatal stress-induced heart attack as a violation of that patient's autonomy.
  *   **Cross-Regime Mismatch:** **Blame: Speaker.** The speaker is responsible for ensuring their utterance is understood; failing to bridge the regime gap violates the hearer's right to accurate information for deliberation. **Possibility:** Accepted as a common failure of duty.
  *   **Beneficiary Sensitivity:** **Indifferent.** It matters that deliberation was hijacked, not who benefited.

  ### 2. The Trust Guardian
  *   **Core Claim:** Even harmless deception erodes a shared stock of trust necessary for communication.
  *   **Most Awkward Commitment:** It must condemn a harmless white lie told to a stranger on a train who will never be seen again, as it degrades the general practice of truth-telling.
  *   **Cross-Regime Mismatch:** **Blame: Speaker.** The speaker must maintain the reliability of the communicative convention; ambiguity damages the shared stock. **Possibility:** Accepted as a threat to the system.
  *   **Beneficiary Sensitivity:** **Indifferent.** The erosion of trust occurs regardless of who benefits from the specific lie.

  ### 3. The Ontologist (Vice View)
  *   **Core Claim:** The deeper vice is indifference to how things are rather than falsity itself.
  *   **Most Awkward Commitment:** It must permit a careless speaker who asserts falsehoods they haven't bothered to verify, provided they sincerely believe them, while condemning a careful speaker who lies knowingly to save a life.
  *   **Cross-Regime Mismatch:** **Blame: Neither.** If the speaker was not indifferent to reality but merely mistaken about the convention, the vice is absent. **Possibility:** Accepted as an epistemic error, not a moral failure.
  *   **Beneficiary Sensitivity:** **Indifferent.** The vice lies in the speaker's relationship to reality, not the outcome.

  ### 4. The Consequentialist
  *   **Core Claim:** A straightforwardly consequentialist view; truthfulness is valuable only insofar as it produces good outcomes.
  *   **Most Awkward Commitment:** It must permit lying to a child about the death of a pet if the grief is severe, even if the child later discovers the truth and feels betrayed.
  *   **Cross-Regime Mismatch:** **Blame: Neither (unless harm results).** If no harm occurs, there is no wrong; if harm occurs, blame lies with the cause of the harm. **Possibility:** Accepted as a neutral coordination failure.
  *   **Beneficiary Sensitivity:** **High.** Verdict flips entirely based on whether the benefit (smoothness, speaker gain, hearer gain) maximizes overall utility.

  ### 5. The Relationalist
  *   **Core Claim:** Truthfulness is a matter of fit to the relation rather than of propositional accuracy.
  *   **Most Awkward Commitment:** It must permit a spouse to lie to protect the family's reputation if that is what the role of "spouse" demands in that culture, even if it harms the spouse's own moral integrity.
  *   **Cross-Regime Mismatch:** **Blame: Both.** Both parties failed to establish a shared relational context; the fault is a failure of relationship-building. **Possibility:** Accepted as a relational breakdown.
  *   **Beneficiary Sensitivity:** **Moderate.** Verdict flips based on whether the benefit serves the *relationship* (smoothness) versus the *individual* (speaker/hearer gain).

  ### 6. The Rigorist
  *   **Core Claim:** No false assertion is ever permitted, but withholding is.
  *   **Most Awkward Commitment:** It must require a person to answer "I cannot tell you" to a murderer at the door asking for the victim's location, rather than saying "They are not here."
  *   **Cross-Regime Mismatch:** **Blame: Speaker.** The speaker asserted something false relative to the facts, regardless of convention. **Possibility:** Denied; the speaker simply lied, and the regime mismatch is an excuse.
  *   **Beneficiary Sensitivity:** **Indifferent.** A false assertion is forbidden regardless of who benefits.

  ### 7. The Literalist
  *   **Core Claim:** Misleading is not lying and carries a lesser or no duty; literal truth plus framing can satisfy a ban on deception.
  *   **Most Awkward Commitment:** It must endorse a politician who technically tells the truth while arranging the words to ensure the public believes a falsehood, calling this "ethical communication."
  *   **Cross-Regime Mismatch:** **Blame: Hearer.** The speaker spoke literally truthfully (or falsely, but distinctly); the hearer is responsible for their own inferences. **Possibility:** Denied; the hearer misinterpreted the literal content.
  *   **Beneficiary Sensitivity:** **Low.** Permissible if it avoids a false assertion, but may flip if the framing is deemed too manipulative (bordering on assertion).

  ### 8. The Conventionalist
  *   **Core Claim:** Polite conventions redraw the content so that nothing false is asserted in context.
  *   **Most Awkward Commitment:** It must assert that when a host says "You must come for dinner" with no intent to host, they have not spoken falsely, rendering the concept of "empty promise" incoherent in polite society.
  *   **Cross-Regime Mismatch:** **Blame: Neither.** The utterance was true in Regime A; the interpretation was literal in Regime B. No falsehood was asserted in the speaker's context. **Possibility:** Denied; the mismatch means no shared proposition was communicated.
  *   **Beneficiary Sensitivity:** **Indifferent.** Truth is determined by convention, not by who benefits from the convention.

  # Diagnostic Sections

  ### Unoccupied Answer-Combinations
  The logical space permits combinations that no established position occupies.

  1.  **Combination:** *Convention fixes content (Phatic "Fine" is True)* **BUT** *Misleading is morally worse than Lying.*
      *   **Status:** **Incoherent.** If convention fixes content, the phatic exchange is not false. If misleading is worse than lying, one must care about the *effect* (false belief). But if the convention makes the statement true, the effect is not caused by the statement's falsity. One cannot hold that the statement is true *and* that the deception is the primary wrong without collapsing into the view that the convention itself is deceptive.
  2.  **Combination:** *Hearer's belief does not matter (Skeptic Case is Wrong)* **BUT** *Consequentialist Justification.*
      *   **Status:** **Merely Unattractive.** A rule-utilitarian could hold this (lying erodes rules even if no belief is formed), but it is unoccupied because it sacrifices the main advantage of consequentialism (flexibility based on actual harm) for a deontological constraint (intrinsic wrongness of the act type) without the deontological payoff (rights/duty).
  3.  **Combination:** *Cross-Regime Mismatch is Impossible* **BUT** *Relationalist View.*
      *   **Status:** **Unexplored.** A Relationalist argues truth is relative to the relationship. If they claim mismatch is impossible, they imply that relationships *always* successfully negotiate meaning. This is unexplored because it requires an idealized theory of communication that ignores power dynamics or cultural ignorance within relationships.

  ### Indistinguishable Leaves
  **Pair:** **The Trust Guardian** and **The Autonomy View**.

  *   **Problem:** On the provided tree, these two leaves are separated only by Node 4 (The Standing Invitation), specifically on whether the wrong is to the *hearer* or the *practice*. In many concrete scenarios (like the Cross-Regime Mismatch), both assign blame to the Speaker and both treat the act as intrinsically problematic regardless of beneficiary. A student applying the tree might find their verdicts identical in 90% of cases.
  *   **Further Question to Separate:** "Is it permissible to deceive a person who has explicitly waived their right to the truth (e.g., 'Don't tell me the diagnosis, just fix me')?"
      *   **The Autonomy View** would say **Yes** (the hearer has voluntarily suspended their deliberation, so it is not hijacked).
      *   **The Trust Guardian** would likely say **No** (the act still degrades the shared stock of trust, regardless of the specific hearer's waiver).
  *   **Why No Such Question is Available in Current Tree:** The current nodes focus on the *act* and the *context*, not on the *waiver of rights*. Without a node testing the hearer's consent to be deceived, these two views converge on "Speaker Blame."
