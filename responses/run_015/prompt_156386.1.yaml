  │   │       │   │   │   (May one assert falsehood to prevent grave harm to a third party?)
  │   │       │   │   │
  │   │       │   │   │   ├── BRANCH B1a: No, never.
  │   │       │   │   │   │   └── LEAF 6: The Rigorist
  │   │       │   │   │   │
  │   │       │   │   │   └── BRANCH B1b: Yes, harm overrides.
  │   │       │   │   │       └── LEAF 7: The Literalist
  │   │       │   │   │
  │   │       │   └── BRANCH B2: Convention redraws the content (It is not false).
  │   │       │       └── LEAF 8: The Conventionalist
