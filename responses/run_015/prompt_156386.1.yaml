  # The Logical Space of Truthfulness

  Before mapping the positions, we must define the dimensions of the logical space. A position on truthfulness is determined by a series of commitments regarding the nature of speech, the role of convention, and the source of moral obligation. Not all choices are independent; some collapse into others depending on prior commitments.

  **The Five Core Choices:**
  1.  **The Locus of the Wrong:** Is the wrong-making feature the *assertion of a believed falsehood* (Subjective Assertion), the *intentional causing of a false belief* (Objective Effect), or the *violation of an entitlement to trust* (Relational Breach)?
  2.  **The Role of Convention:** Do social conventions (like politeness regimes) fix the *truth-conditions* of an utterance (making "I'm fine" literally true when polite), or do they merely govern *inferences* (making "I'm fine" literally false but conventionally expected)?
  3.  **The Hearer's State:** Does the moral status of the utterance depend on whether the hearer *actually forms* the false belief?
  4.  **The Scope of Deception:** Is "misleading" (speaking literally true words known to imply a falsehood) morally equivalent to "lying" (speaking falsely)?
  5.  **The Override Condition:** If an act is deceptive, can it be justified by consequences (harm prevention), role obligations, or is it intrinsically forbidden?

  **Independence and Collapse:**
  *   **Convention and Locus:** If one chooses that Convention fixes Truth-Conditions (Choice 2), the Locus of the Wrong (Choice 1) collapses for polite speech; there is no false assertion to evaluate.
  *   **Hearer's State and Locus:** If the Locus is Objective Effect (Choice 1), the Hearer's State (Choice 3) is critical. If the Locus is Subjective Assertion, the Hearer's State is irrelevant (a lie is a lie even if disbelieved).
  *   **Scope and Locus:** If the Locus is Objective Effect, Misleading and Lying (Choice 4) collapse into the same category (both cause false belief). If the Locus is Subjective Assertion, they separate.

  The taxonomy below navigates this space using concrete cases as decision nodes.

  # The Taxonomy Tree

  ```text
  ROOT: Start
  │
  ├── NODE 1: The Strictly True Answer
  │   (Speaker answers a question literally truthfully, knowing the hearer 
  │    will infer a falsehood to answer a different question.)
  │
  │   ├── BRANCH A: This is morally equivalent to lying. (Effect Matters)
  │   │   │
  │   │   ├── NODE 2: The Falsehood to the Skeptic
  │   │   │   (Speaker asserts falsehood to a hearer who discounts everything 
  │   │   │    said and forms no false belief.)
  │   │   │
  │   │   │   ├── BRANCH A1: This is still wrong. (Intrinsic/Trust Wrong)
  │   │   │   │   │
  │   │   │   │   ├── NODE 3: Cross-Regime Mismatch
  │   │   │   │   │   (Speaker uses Politeness Regime A; Hearer uses Regime B. 
  │   │   │   │   │    Hearer takes utterance literally, forms false belief. 
  │   │   │   │   │    Speaker did not intend deception.)
  │   │   │   │   │
  │   │   │   │   │   ├── BRANCH A1a: Speaker is blameworthy. (Strict Liability)
  │   │   │   │   │   │   │
  │   │   │   │   │   │   ├── NODE 4: The Standing Invitation (I)
  │   │   │   │   │   │   │   (Neither party expects acceptance. Is the wrong 
  │   │   │   │   │   │   │    to the specific hearer or the general practice?)
  │   │   │   │   │   │   │
  │   │   │   │   │   │   │   ├── BRANCH A1a-i: Wrong to the Hearer's Deliberation.
  │   │   │   │   │   │   │   │   └── LEAF 1: The Autonomy View
  │   │   │   │   │   │   │   │
  │   │   │   │   │   │   │   └── BRANCH A1a-ii: Wrong to the Shared Stock of Trust.
  │   │   │   │   │   │   │       └── LEAF 2: The Trust Guardian
  │   │   │   │   │   │   │
