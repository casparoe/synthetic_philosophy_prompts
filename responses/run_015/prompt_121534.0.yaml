answer: |-
  # JOINT STATEMENT ON AGGREGATION AND THRESHOLDS IN MORAL HARM

  **Signatories:**
  **Signatory A (The Archimedean Aggregator)**
  **Signatory B (The Threshold Theorist)**

  **Date:** 24 May 2024

  ## 1. AGREED CLAIMS

  We, the undersigned, acknowledge a fundamental disagreement regarding the aggregation of moral harm. To ensure our dispute is substantive rather than verbal, and to prevent further argument past one another, we stipulate the following claims as the common ground for our debate. We bind ourselves to these premises in all subsequent arguments regarding this specific collaboration.

  **1.1 The Nature of the Harms**
  1.  **The Speck:** The 'speck' refers to a momentary, minor irritation to a human eye (e.g., a particle of dust). It causes a fleeting sensation of discomfort.
  2.  **No Downstream Effects:** The experience is unremembered. It leaves no physical trace, no psychological scar, and no impact on the recipient's future choices, welfare, or capabilities. The recipient does not know they were harmed, nor do they know they were spared.
  3.  **The Torture:** The 'torture' refers to fifty years of continuous, extreme physical and psychological suffering inflicted upon a single individual, resulting in a life permanently ruined by trauma and pain.
  4.  **Comparability:** Both signatories agree that both the speck and the torture constitute negative experiences. We disagree on whether they are comparable in a single metric of badness.

  **1.2 The Scope of the Population**
  5.  **Finite but Vast:** The number of individuals receiving the speck is finite. However, it is sufficiently large that it exceeds human capacity to enumerate or visualise (e.g., exceeding the number of atoms in the observable universe).
  6.  **Distinct Individuals:** Each recipient of a speck is a distinct, separate person. There is no overlap of identity.
  7.  **Exclusivity:** The choice is strictly between Outcome S (the vast population receives specks) and Outcome T (one person receives torture). No other outcomes are available.

  **1.3 Methodological Constraints**
  8.  **Practical Impossibility:** Neither signatory may argue that the case is irrelevant because such a choice could never arise in practice. We accept the case as a test of principle.
  9.  **Meaningfulness of Numbers:** Neither signatory may argue that the numbers are so large that the question loses meaning or that 'finite' becomes functionally 'infinite' in a way that dissolves the arithmetic.
  10. **Intuition:** Neither signatory may rely solely on raw intuition (e.g., 'It is obvious that...') without providing a principled justification. We acknowledge that our intuitions currently diverge.
  11. **Good Faith:** We agree that the other side is not motivated by a desire to minimise suffering less than ourselves, but by a different conception of how suffering counts.

  ---

  ## 2. DISAGREEMENTS TABLE

  The following table sets out our respective positions. We have drafted the wording to ensure each signatory accepts the description of their own view, even if they reject the other's.

  | Feature of the View | Signatory A (Archimedean Aggregator) | Signatory B (Threshold Theorist) |
  | :--- | :--- | :--- |
  | **Status of the Speck** | A speck is a harm. It possesses a positive quantity of disvalue ($d > 0$). | A speck is a phenomenological nuisance, but it falls below the threshold of *moral significance*. It carries zero moral weight ($w = 0$). |
  | **Aggregation Principle** | Total badness is the sum of individual badnesses. $Total = \sum d_i$. There is no lower bound on $d$ that prevents it from entering the sum. | Harms below the threshold of moral significance do not enter the sum. They cannot be aggregated to outweigh a harm above the threshold. |
  | **The Verdict** | Outcome S is worse than Outcome T, provided the number of specks is sufficiently large. | Outcome T is worse than Outcome S, regardless of the number of specks. |
  | **Weighting by Welfare** | I am committed to the additivity of harm. I *may* allow that a speck hurts a deprived person more than a wealthy one, but the speck still adds *some* positive value to the total badness even for the wealthy. Pure addition is the baseline; weighting is a modifier, not a zeroing mechanism. | I am committed to the threshold. Whether I weight harms above the threshold by prior welfare is a separate question. The core commitment is that sub-threshold harms are morally inert, regardless of the recipient's prior state. |
  | **Nature of the Disagreement** | This is a dispute about mathematics and scope. If you accept each speck is bad, you must accept the sum is bad. | This is a dispute about categories. There is a category error in treating a nuisance as the same kind of object as a catastrophe. |

  ---

  ## 3. CRUXES

  We identify the following sub-questions as the critical pivot points of our disagreement. For each, we record a line of argument we both accept as bearing on the issue, our prior predictions, and what would constitute evidence against our respective views.

  ### 3.1 The Saturation Problem

  **The Issue:** If torture is worse than any finite number of specks, then the total disvalue of specks must stay bounded however many recipients there are. Is this bound per person or global?
  *   If the bound is **per person** (i.e., specks sum for one person up to a point, then stop), a sufficiently vast population of capped harms should still add up to something enormous. If the threshold view allows summation across persons for capped harms, it seems to collapse into aggregation.
  *   If the bound is **global** (i.e., adding recipients beyond some point adds nothing at all to how bad things are), this implies that the moral badness of the world can stop increasing even as suffering increases, which is a costly commitment.

  **Signatory B's Commitment:** I go with the **global zero-weight** view. Sub-threshold harms do not sum across persons because they possess no moral weight to sum. It is not that they sum to a cap; it is that $0 + 0 + 0 = 0$.
  **Cost:** This commits me to the claim that a world with a trillion people each suffering a sub-threshold nuisance is no worse, in that specific respect, than a world with one person suffering it.

  **Shared Line of Argument:** We agree that if Signatory B allows *any* positive moral weight to the speck, Signatory A's mathematics eventually wins. Therefore, Signatory B must defend the claim that moral weight is discontinuous.

  **Predictions:**
  *   **Signatory A:** Predicts that under reflection, Signatory B will find the 'global zero' commitment untenable when faced with a population large enough to mirror the complexity of the torture victim's neural states.
  *   **Signatory B:** Predicts that Signatory A will find the 'linear sum' commitment untenable when it implies we should prioritise preventing dust specks over preventing murders if the numbers are high enough.

  **Falsification Conditions:**
  *   **Against A:** If it can be shown that linear aggregation leads to 'fanaticism' (where tiny probabilities of vast numbers dictate all moral action), A must modify the view.
  *   **Against B:** If it can be shown that the threshold is arbitrary (e.g., why *this* level of pain and not 1% less?), B must provide a non-arbitrary grounding for the cutoff.

  ### 3.2 The Marginal Speck

  **The Issue:** If the Aggregator is right, removing a single speck from a vast collection makes the outcome better, yet the difference any one speck makes is negligible. Is there a coherent position in which each individual contribution is morally inert while the sum of them is morally decisive?
  *   **Analogy for Torture:** Does removing one second of torture from the fifty years make the outcome better?

  **Positions:**
  *   **Signatory A:** Each speck makes a difference. The sum is decisive *because* each individual contribution is non-zero. Regarding torture: Removing one second of torture makes the outcome better by a small, but non-zero, amount.
  *   **Signatory B:** Each speck is morally inert. The sum is therefore inert. Regarding torture: Removing one second of torture makes the outcome better, because the torture is *above* the threshold. The harm is already in the 'counting' zone.

  **Shared Line of Argument:** We agree that the 'inert individual, decisive sum' paradox is the heart of the Sorites problem. We agree to test this against the torture analogy.

  **Predictions:**
  *   **Signatory A:** Predicts that Signatory B cannot explain why one second of torture counts but one speck does not, without appealing to a vague 'significance' that dissolves under scrutiny.
  *   **Signatory B:** Predicts that Signatory A cannot explain why we feel no obligation to save a specific individual from a speck in the vast scenario, if that act is objectively 'the right thing to do'.

  **Falsification Conditions:**
  *   **Against A:** If A is forced to admit that no human agent could ever be obligated to act on the difference made by one speck, A must reconcile objective badness with action-guidance.
  *   **Against B:** If B is forced to admit that a sequence of sub-threshold harms can accumulate to a threshold harm within a single life (see 3.3), B must explain why this does not hold across lives.

  ### 3.3 Intra-life Aggregation (The Long Life Variant)

  **The Issue:** Consider a variant where one very long-lived subject receives all the specks, one at a time, with no habituation and no interaction between them.
  *   Does the verdict change if one person receives $N$ specks over a millennium versus $N$ people receiving one each?

  **Positions:**
  *   **Signatory A:** The verdict does not change. Badness aggregates across time within a life just as it aggregates across lives. $N$ specks are worse than torture if $N$ is high enough, even for one person.
  *   **Signatory B:** The verdict *may* change. I hold that there is a threshold for *interpersonal* aggregation. However, within a single life, nuisances can accumulate to become a burden. If the specks make the life go worse overall, they may cross a threshold of 'life-ruining' even if individually trivial.

  **Shared Line of Argument:** We agree this tests whether the threshold is a property of the *experience* or a property of the *distribution*.

  **Predictions:**
  *   **Signatory A:** Predicts Signatory B will concede aggregation within a life, thereby admitting that specks *do* sum, which undermines the claim that they have zero moral weight.
  *   **Signatory B:** Predicts that even in the single-life case, there is a limit. A life with a billion momentary irritations is still preferable to a life with fifty years of torture.

  **Falsification Conditions:**
  *   **Against A:** If A must concede that a life of constant micro-irritations is not 'worse' than a life of torture in any meaningful sense that guides preference, A's metric of 'badness' is detached from welfare.
  *   **Against B:** If B concedes that specks sum within a life but not across lives, B must defend the moral relevance of personal identity boundaries in a way that does not rely on metaphysical claims we have not settled.

  ### 3.4 The Sorites and Sharp Cutoffs

  **The Issue:** What happens across a graded series of cases between a speck and torture? Is either side committed to a sharp cutoff?

  **Positions:**
  *   **Signatory A:** There is no sharp cutoff in badness. Badness is continuous. A harm slightly larger than a speck is slightly worse.
  *   **Signatory B:** There must be a cutoff for moral aggregation, though it may be vague. There is a point where a harm becomes 'serious enough to matter'.

  **Shared Line of Argument:** We agree that if Signatory B posits a sharp cutoff, it invites the charge of arbitrariness. If Signatory B posits a vague cutoff, it invites the charge of indeterminacy in moral obligation.

  **Predictions:**
  *   **Signatory A:** Predicts that any attempt to define the threshold will fail to capture our moral intuitions across all cases.
  *   **Signatory B:** Predicts that the demand for precision is a category mistake; legal and moral concepts often rely on vague thresholds (e.g., 'reasonable doubt') without collapsing.

  **Falsification Conditions:**
  *   **Against A:** If continuity implies we cannot distinguish between significant and trivial harms in policy, A's view is impractical.
  *   **Against B:** If the vagueness implies we cannot know whether to save a million people from near-threshold harms or one person from just-above-threshold harms, B's view fails to guide action.

  ### 3.5 Decision Under Uncertainty

  **The Issue:** Is the practical question of what to choose, given uncertainty about which view is correct and about how many people there are, settled by anything said so far?

  **Positions:**
  *   **Signatory A:** If there is a non-zero probability I am right, and the numbers are vast, the expected value of preventing specks dominates. We should prevent the specks.
  *   **Signatory B:** If there is a non-zero probability I am right, the risk of allowing torture is catastrophic and non-compensable. We should prevent the torture.

  **Shared Line of Argument:** We agree this is a further question not settled by the metaphysics of harm. It depends on risk aversion and decision theory.

  **Predictions:**
  *   **Signatory A:** Predicts that standard expected utility theory favours the Aggregator view in cases of vast numbers.
  *   **Signatory B:** Predicts that a maximin or lexical priority rule favours the Threshold view to avoid catastrophic loss.

  **Falsification Conditions:**
  *   **Against Both:** If it turns out that the 'numbers' are never empirically knowable to the degree required to trigger the Aggregator's switch-point, the Aggregator's view may be practically empty.

  ---

  ## 4. CONCLUSION ON VERBAL VS SUBSTANTIVE DISPUTE

  We have considered whether our disagreement is merely verbal.

  **Agreed Finding:** The dispute is **substantive**, not verbal.
  It is not merely that we define 'harm' differently. We agree on the phenomenology: the speck hurts a little, the torture hurts a lot. The disagreement concerns the *structure of moral value*.
  *   Signatory A claims moral value is a **continuous quantity**.
  *   Signatory B claims moral value is a **partially ordered set with a lexical gap**.

  However, we acknowledge one **verbal component**: The definition of 'harm'. Signatory B prefers to reserve the word 'harm' (in the moral sense) for threshold-crossing events, calling specks 'nuisances'. Signatory A uses 'harm' for any negative experience. We agree to use the terminology in Section 2 (Phenomenological Nuisance vs. Moral Weight) to avoid confusion, acknowledging that this terminological shift does not resolve the underlying structural disagreement.

  **Signed:**

  _________________________
  **Signatory A**

  _________________________
  **Signatory B**
