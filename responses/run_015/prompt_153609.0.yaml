  **SUBJECT: Allocation of Case #892 (The Well-Being Supplement)**
  **PARTICIPANTS: Director Vane, Senior Actuary Krell**

  **Director Vane:** Put the file on the table, Krell. We have two claimants for the Supplement: Citizen 404 and Citizen 505. The Bureau's mandate is to award it to whoever stands to gain the most utility. We have the numbers?

  **Actuary Krell:** We do, Director. Under Protocol 7-B, we normalized both citizens' scales by stipulating $u=0$ at "Spilling Hot Tea" and $u=1$ at "Freshly Made Bed." We then asked them to rate the Supplement relative to that unit.

  **Director Vane:** And?

  **Actuary Krell:** Citizen 404 reports the Supplement yields 5,000 utils. Citizen 505 reports 0.8 utils.

  **Director Vane:** Five thousand? That's a staggering magnitude. Is 404 a utility monster?

  **Actuary Krell:** No, sir. It's an anchor issue. 404 interprets "Freshly Made Bed" as "Straightening the blanket slightly." 505 interprets it as "Egyptian Cotton, thread count 800, housekeeping service." Because 404's unit is experientially tiny, the Supplement buys thousands of them. 505's unit is experientially massive, so the Supplement buys less than one.

  **Director Vane:** So 404 is objectively happier?

  **Actuary Krell:** According to the calibration, yes. Also, 404's current life satisfaction level is registered at 200,000 utils, whereas 505 is at 15. So 404 is both better off and stands to gain more.

  **Director Vane:** Excellent. Draft the award for 404. Wait—what's that red flag on 505's intake form?

  **Actuary Krell:** Ah. A clerical error in the stipulation. For 505, the anchor event $u=1$ was recorded as "Freshly Made Bed." But the legal statute for his demographic specifies "Freshly Made Bed *After a Double Shift*."

  **Director Vane:** And the difference?

  **Actuary Krell:** Significant. "After a Double Shift" is a much smaller incremental gain than a standard made bed. It shrinks the unit size.

  **Director Vane:** Explain the math, Krell.

  **Actuary Krell:** If the unit shrinks, the number of units contained in the Supplement grows. We previously thought the Supplement was 0.8 of a "Standard Bed." But relative to a "Double-Shift Bed," the Supplement is actually 50 units.

  **Director Vane:** And 404?

  **Actuary Krell:** 404's anchor remains "Straightening the blanket." His score stays at 5,000.

  **Director Vane:** So 404 still wins?

  **Actuary Krell:** No, sir. I just found 404's correction notice. His anchor wasn't "Straightening the blanket." It was "Straightening the blanket *While Humming*."

  **Director Vane:** Which is?

  **Actuary Krell:** A much higher bar. It expands his unit size by a factor of 10,000. His 5,000 utils collapse to 0.5.

  **Director Vane:** So 505 now has 50 utils, and 404 has 0.5.

  **Actuary Krell:** Correct. 505 is the rightful recipient.

  **Director Vane:** Fine. Switch the award. And Krell?

  **Actuary Krell:** Sir?

  **Director Vane:** In the final report, note that we compared their total life satisfaction levels to determine the marginal gain allocation. The public finds the distinction confusing, but the numbers are the numbers.

  **Actuary Krell:** ...Yes, Director.

  ***

  **Note on Theoretical Status**

  The joke relies on two premises settled in welfare economics and decision theory: that ordinal utility functions contain no information about magnitudes, and that even cardinal utility functions (such as von Neumann-Morgenstern utilities) are unique only up to positive affine transformations, rendering interpersonal comparisons of levels and differences indeterminate without further assumptions. What remains genuinely contested is whether this indeterminacy is ontological (there is no fact of the matter about who is happier) or merely epistemic (the facts exist but are hard to measure), and whether non-arbitrary conventions, neuroscientific data, or moral realism could ever render interpersonal comparisons determinate. The joke treats the Bureau's normalization as obviously arbitrary, but does not resolve whether a non-arbitrary solution is possible in principle.
