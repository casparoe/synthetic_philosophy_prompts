      *(Refining the "Verdicts to Give Up" section)*: The user thinks convergence under transparency supports objectivity. To keep this, they must accept that lack of convergence under *non-transparency* does *not* refute objectivity. This means they must reject the speaker's bridge principle. But the deeper cost is admitting that *some* cultures are epistemically better positioned than others on specific moral questions. This is politically sensitive but logically necessary for their position. I need to highlight this tension.

