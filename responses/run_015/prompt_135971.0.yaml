      *   *Thesis 4: The Institutional Transparency Claim (User's Specific Interest).*
          *   Bridge: Variance is due to lack of scrutiny/revision mechanisms.
          *   Verdict: Defensible. Objectivity is a *goal* of inquiry, not a starting state.
          *   Math Test: Survives well. (Math consensus grows with rigorous peer review).

  5.  **Address the Specific Interests:**
      *   *Institutional Transparency:* Treat variance as an epistemic confound. WEIRD societies have mechanisms (science, law, free press) that scrub error. Non-WEIRD might rely on tradition.
      *   *Purity Decline:* If purity declines with secular exposure, is it because purity is *false* (objectivity wins) or because secular institutions *suppress* a valid intuition?
