          *   *User's leaning:* Convergence under transparency supports objectivity.
      *   *Math Substitution:* "If mathematical truths were objective, we wouldn't see variance in numeracy."
          *   This clearly shows that objectivity $\neq$ universal intuition. It requires *method*.

