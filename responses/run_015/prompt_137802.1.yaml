prompt: |-
  I run the consultation and engagement team at a unitary authority in England. My officers take in several hundred deputations, petitions and written submissions a year, and increasingly the difficulty is not volume but a recurring judgement call: what to do with contributions whose grounds are religious.

  The governing thought, as I understand it, is that a public body should be able to justify what it does by reasons that all its citizens could reasonably be expected to accept, and that this is meant to be a restraint on the state rather than on conscience. What is not obvious to me is how far that restraint reaches back into what we will accept, record and weigh when it comes *from* the public. My team has to rule on this in the room, in a couple of minutes, with no training in philosophy and no opportunity to consult; the ruling has to be one a non-specialist can apply consistently, it has to survive being read back in writing by the Monitoring Officer or, occasionally, by a judge; and where the procedure runs out it must hand the decision to a named person rather than pretend to a mechanical answer.

  I would like a written procedure we could actually run, and I think it needs to distinguish at least three stages rather than give one verdict: whether a contribution may be accepted and entered into the record at all; whether it may be counted as a reason bearing on the decision; and whether it may appear in the authority's own statement of reasons for the decision.

  There are some wrinkles I want the procedure either to use or to tell me are the wrong distinctions. First, I do not think you can tell from the words alone whether a reason is religious, since it seems to depend on why the speaker holds it. Second, some reasons have a religious ancestry but now travel free of it, and I am unsure whether the ancestry should matter. Third, asking someone to restate their reason in a shared idiom is not costless, and the cost falls unevenly — on people with less fluency in the majority vocabulary, on communities whose reasons are not detachable from their cosmology, and on anyone who would have to misdescribe why they believe what they believe to be heard at all. Fourth, there is a question I cannot settle about who authors a reason: if an officer or a councillor supplies the shared surrogate on the speaker's behalf, the reason that ends up counting is no longer theirs. Fifth, I want to know whether restraint is symmetric — whether a comprehensive secular doctrine gets the same treatment — and whether it bites equally on reasons that happen to support what the authority intended to do anyway.

  Please also say plainly whether we should translate contributions for the record or require speakers to translate to be heard, and why.

  Then apply the procedure to three cases. (1) A deputation against a proposed crematorium whose stated ground is that cremation is incompatible with the resurrection of the body; the speaker volunteers that she has no other objection and will not invent one. (2) A joint submission against a pavement-licensing extension from a mosques' council, whose ground is the prohibition on alcohol, and a residents' association, whose ground is noise and litter; the two reach the same conclusion and the officers disagree about whether the conclusion can be carried by the residents' reason alone. (3) A secular humanist society's submission that a faith-based adoption agency should be excluded from commissioning, grounded in a comprehensive claim about autonomy and religious formation, with an explicit refusal to offer a narrower reason. At least one of these should come out somewhere I or the councillors will not like, and I would rather you said where than softened it.

  Finally, tell me what the procedure cannot do.

  Please write in British English. I am not looking for a reading list or citations: I need something my officers can hold in their hands.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** Head of Consultation and Engagement at a Unitary Authority in England.
      *   **Problem:** Handling public contributions (deputations, petitions, submissions) based on religious grounds. Volume is high, decision time is low (minutes), staff are non-specialists, decisions must be legally robust (Monitoring Officer/Judge review).
      *   **Core Principle:** Public justification (Rawlsian idea: reasons all citizens could reasonably accept). Restraint on the state, not conscience.
      *   **Required Output:** A written procedure (practical, actionable) distinguishing three stages:
          1.  Acceptance/Recording.
          2.  Weighting as a reason for decision.
          3.  Inclusion in the Authority's Statement of Reasons.
      *   **Specific Wrinkles to Address:**
          *   Intent vs. Wording (can't tell if religious just by words).
          *   Religious Ancestry (secularized reasons).
          *   Translation Costs (burden on speaker vs. authority).
          *   Authorship (who owns the translated reason?).
          *   Symmetry (secular comprehensive doctrines vs. religious ones).
          *   Bias (does restraint apply if the reason supports the intended outcome?).
      *   **Specific Question:** Translate for the record or require speaker to translate?
      *   **Case Studies:** Apply the procedure to three specific cases (Crematorium, Alcohol Licensing, Faith-based Adoption). One outcome must be unpopular/uncomfortable.
      *   **Limitations:** What the procedure *cannot* do.
      *   **Tone/Style:** British English, practical, no academic citations/reading lists, actionable for officers.

  2.  **Deconstruct the Legal and Ethical Context:**

      *   **Legal Framework (England):** Human Rights Act 1998 (Article 9, 10, 14), Equality Act 2010 (Public Sector Equality Duty), Common Law duty to give reasons.
      *   **Public Justification:** The user references Rawlsian public reason. In UK administrative law, this translates to "relevant considerations." A decision must be based on relevant factors. Religious belief is a protected characteristic, but *policy* must be secular/neutral.
      *   **The Three Stages:**
          1.  *Admissibility:* Very high bar. Almost everything should be recorded. Freedom of expression/petitioning.
          2.  *Weight/Relevance:* Does this count towards the *decision*? Here is where "public reason" matters. Can this reason justify a use of state power?
          3.  *Statement of Reasons:* What goes in the official report/minutes justifying the vote? This needs to be legally defensible.

  3.  **Drafting the Procedure (The "Handheld" Document):**

      *   Need clear headings.
      *   Need decision trees or checklists.
      *   Need to address the "wrinkles" within the steps.
      *   *Translation:* The authority should record what is said (verbatim/summary) but the *weighting* depends on public accessibility. The burden of translation for *weighting* lies partly on the officer to find the secular equivalent, but the speaker isn't obliged to provide it.
      *   *Symmetry:* Yes, comprehensive secular doctrines (e.g., deep ecology, hard libertarianism) get the same treatment as religious ones. If it relies on a premise not shared by the pluralistic public, it can't be the *sole* basis for state action.
      *   *Outcome Bias:* Restraint applies regardless of whether the reason supports or opposes the officer's recommendation.

  4.  **Addressing the Wrinkles in the Procedure:**

      *   *Intent vs. Words:* Focus on the *premise* offered, not the label.
      *   *Ancestry:* If the reason works secularly (e.g., "sanctity of life" -> "preservation of life"), it counts. If it *only* works religiously, it doesn't count for state action.
      *   *Translation Cost:* The Authority records the original. The Officer seeks the "public equivalent." If none exists, it remains a recorded view but not a decision factor.
      *   *Authorship:* If an officer paraphrases, it must be checked for accuracy. If the speaker refuses the paraphrase, the original stands as their view, but carries no decision weight.

  5.  **Developing the Case Studies:**

      *   *Case 1 (Crematorium):* Purely theological ground (resurrection). No secular harm cited.
          *   *Outcome:* Recorded? Yes. Weighted? No. In Reasons? No.
          *   *Uncomfortable truth:* The objection is effectively inadmissible for decision-making purposes, even if sincere. This might upset the religious community.
      *   *Case 2 (Alcohol/Noise):* Mixed submission. Mosques (alcohol prohibition) + Residents (noise).
          *   *Outcome:* Recorded? Yes. Weighted? The noise reason carries the decision. The alcohol reason is recorded as context but cannot be the *legal* basis for refusal.
          *   *Nuance:* Officers must ensure the refusal isn't *actually* driven by the alcohol reason disguised as noise.
      *   *Case 3 (Adoption/Secular Humanist):* Comprehensive secular doctrine (autonomy/formation). Refusal to narrow.
          *   *Outcome:* Symmetry test. If it's a comprehensive doctrine not shared by all (like religion), it gets the same treatment.
          *   *Uncomfortable truth:* The Humanist submission gets the *same* limited weight as the religious one. This might upset the secular group who expect their reasons to be "rational" by default. Or, if the Authority accepts it, they risk challenging the symmetry principle. Let's make the outcome strict: Comprehensive doctrines (religious or secular) cannot solely justify state coercion.
          *   *Wait, let's look closer:* "Autonomy and religious formation" is arguably a public reason (harm/prevention of indoctrination). But the prompt says "explicit refusal to offer a narrower reason." If they frame it as "Religion is false," that's not public reason. If they frame it as "State shouldn't fund discrimination," that is. Let's assume the "comprehensive claim" is metaphysical (e.g., "Religious belief is inherently harmful to autonomy"). That fails the public reason test similar to "Religion is true."
          *   *Decision:* Treat it symmetrically to Case 1. This satisfies the "uncomfortable outcome" requirement (secularists often think their reasons are automatically public).

  6.  **Refining the Translation Question:**

      *   *Record:* Verbatim/As stated.
      *   *Decision Weight:* Officer must attempt to identify public equivalent.
      *   *Why:* Protects freedom of speech (record) but protects rule of law (decision). Don't force the speaker to translate to be *heard*, but don't let untranslated reasons *decide*.

  7.  **Drafting the Limitations:**

      *   Can't solve deep disagreement.
      *   Can't prevent judicial review if the logic is flawed.
      *   Can't fix bad faith actors.
      *   Doesn't replace legal advice.

  8.  **Review and Refine (Self-Correction during drafting):**

      *   *Tone Check:* Is it British English? (Unitary Authority, Monitoring Officer, Counsellors/Councillors, Programme/Programme).
      *   *Practicality:* Is it too philosophical? Need to make it a checklist.
      *   *The "Uncomfortable" Outcome:* I need to ensure I explicitly state which outcome will be disliked. Case 1 is the most obvious (dismissing a sincere religious objection). Case 3 is the most intellectually challenging (treating humanism like religion). I will choose Case 1 as the primary "hard no" and Case 3 as the "symmetry check" that might annoy secularists.
      *   *Legal Safety:* Emphasise that the Monitoring Officer (MO) is the final arbiter on legal risk. The procedure guides the *officer*, not the *lawyer*.
      *   *Equality Duty:* Must mention PSED (Public Sector Equality Duty). Even if a reason isn't a *decision factor*, the *impact* on the group must be considered. This is a crucial distinction. A reason based on faith might not justify a policy change, but the *impact* of the policy on that faith group is a material consideration under the Equality Act. I must integrate this.

      *Correction on Case 1:* Under PSED, the Authority must consider the *impact* of the crematorium on the group. So, while "resurrection" isn't a valid planning reason, "distress to a protected group" is. I need to be careful not to say "ignore it." Say "It doesn't justify the decision, but the impact on the group is a separate statutory duty."
      *Actually, for the purpose of the user's specific question on "Public Justification":* The prompt asks about reasons *bearing on the decision*. PSED is about *process*. I will distinguish these. The *reason* for the decision (e.g., "We refuse because resurrection") is invalid. The *consideration* (e.g., "We noted the impact on Group X") is valid.
      *Refining Case 1:* The deputation is against the crematorium. If the *only* reason is theological, can the Council refuse planning permission? No. That would be irrational/ultra vires. So the procedure must say: Record it, acknowledge the impact (PSED), but do not cite it as the reason for refusal.

      *Refining Case 3:* If the Humanists say "Exclude them because religious formation violates autonomy," and refuse to narrow it. This is a comprehensive doctrine. Symmetry dictates it gets the same treatment as the religious objection in Case 1. It can be recorded, but cannot be the sole basis for state exclusion unless framed in legal terms (e.g., discrimination law).

  9.  **Final Polish:**

      *   Structure: Procedure first. Then the Translation ruling. Then the Cases. Then Limitations.
      *   Ensure the "Three Stages" are distinct.
      *   Ensure the "Wrinkles" are addressed in the notes or procedure steps.

  10. **Writing the Content:** (Mental check of British spelling: programme, centre, authorised, Councillor, Monitoring Officer).

      *(Self-Correction on "Translation"):* The prompt asks: "translate contributions for the record or require speakers to translate to be heard".
      *My stance:* Record as spoken. Officer translates for *analysis*. Do not require speaker to translate to be *heard*. This addresses the "cost" wrinkle.

      *(Self-Correction on Case 2):* The officers disagree on whether the residents' reason alone carries the conclusion.
      *Guidance:* If the secular reason (noise) is sufficient, the decision stands. The religious reason is concurrent but not causative. This avoids "mixed motives" legal challenges.

      *(Self-Correction on Case 3):* Make sure the outcome is clear. If they refuse to offer a public reason, their submission is treated as "expression of view" not "argument for policy."

      *(Final check on "Uncomfortable Outcome"):* I will explicitly flag that Case 1 results in the theological objection being effectively set aside for decision-making purposes, which will feel like dismissal to the believer. Case 3 results in the Secular Humanist claim being treated with the same suspicion as the religious claim, which will annoy the secularists.

      *Let's write.*
answer: |-
  # PROCEDURE: HANDLING CONTRIBUTIONS BASED ON COMPREHENSIVE DOCTRINES
  **Unitary Authority Consultation & Engagement Team**
  **Version:** 1.0 | **Owner:** Head of Consultation & Engagement | **Review:** Monitoring Officer

  ## 1. PURPOSE
  This procedure guides officers on how to receive, record, and weigh public contributions (deputations, petitions, written submissions) where the grounds rely on religious beliefs or comprehensive secular doctrines (e.g., deep ecology, strict libertarianism) that are not shared by all citizens.

  The aim is to respect freedom of expression while ensuring Council decisions remain legally robust, secular, and justifiable to the whole community.

  ## 2. THE THREE STAGES
  Officers must distinguish between three distinct stages of processing. A contribution may pass one stage but not the next.

  ### Stage 1: Acceptance and Recording
  **Question:** *Do we enter this into the official record?*
  **Default:** **YES.**
  *   **Rule:** Accept all contributions that meet standard procedural rules (time limits, format, etc.). Do not filter at the door based on content.
  *   **Recording:** Record the reason exactly as stated by the contributor. Do not edit theological or philosophical language at this stage.
  *   **Rationale:** This protects Article 10 (Freedom of Expression) and ensures the contributor feels heard. It creates an audit trail for the Public Sector Equality Duty (PSED).

  ### Stage 2: Weighting as a Decision Factor
  **Question:** *Can this reason legally and logically bear weight in reaching the decision?*
  **Default:** **CAUTION.**
  *   **Rule:** A reason counts towards the decision only if it can be expressed in "public language"—that is, reasons accessible to citizens regardless of their specific faith or comprehensive worldview (e.g., public safety, financial viability, statutory duty, environmental impact).
  *   **The Translation Test:** Ask: *If I remove the reference to God/Scripture/Ultimate Truth, does the argument still hold?*
      *   **If Yes:** The reason carries weight (e.g., "Scripture commands charity" $\rightarrow$ "There is a community need for support").
      *   **If No:** The reason is recorded (Stage 1) but carries no decision weight (e.g., "Scripture forbids cremation" $\rightarrow$ No secular equivalent).
  *   **Symmetry:** Apply this test equally to religious doctrines and comprehensive secular doctrines. If a secular argument relies on a premise not shared by the pluralistic public (e.g., "Religion is inherently harmful to autonomy"), it is treated the same as a religious premise.

  ### Stage 3: Statement of Reasons
  **Question:** *Does this appear in the Officer Report or Minutes as a justification for the decision?*
  **Default:** **NO (for non-public reasons).**
  *   **Rule:** The Authority's formal reasons for a decision must be secular and legally defensible.
  *   **Inclusion:** You may record *that* a representation was received (e.g., "Objections were raised regarding..."). You must not cite a non-public reason as the *basis* for the decision (e.g., Do not write: "Permission refused due to religious objections.").
  *   **Exception:** Where the *impact* on a protected group is a statutory consideration (Equality Act 2010), the impact is recorded, but the *belief itself* is not the policy driver.

  ---

  ## 3. GUIDANCE ON SPECIFIC WRINKLES

  **A. Intent vs. Wording**
  Do not assume a reason is religious based on keywords (e.g., "sanctity"). Look at the *premise*. If the speaker relies on authority (text, deity, revelation) that is not accessible to non-believers, treat it as a comprehensive doctrine. If they rely on consequences (harm, cost, safety), treat it as public reason, even if their motivation is faith.

  **B. Religious Ancestry**
  Ancestry does not disqualify a reason. Many secular laws have religious origins. If the reason travels free of its ancestry (e.g., "do not kill" $\rightarrow$ "public safety"), it is admissible. If it requires the ancestry to make sense (e.g., "do not eat pork" $\rightarrow$ no secular health equivalent), it is not a decision factor.

  **C. Translation Costs**
  *   **To be Heard:** The speaker is **not** required to translate their reason to be heard or recorded.
  *   **To Count:** The Officer is responsible for attempting to identify a public equivalent.
  *   **Why:** Requiring the speaker to translate places an unfair burden on minority communities and risks distorting their meaning. However, the State cannot act on reasons it cannot justify to all.
  *   **Process:** If an Officer proposes a secular surrogate (e.g., "Are you concerned about noise?"), and the speaker accepts, use the surrogate. If the speaker refuses (e.g., "No, it is about sin, not noise"), record the original but assign it zero decision weight.

  **D. Authorship**
  If an Officer supplies the surrogate, note in the file: *"Officer interpretation of public equivalent."* If the speaker disputes this interpretation, revert to their original wording for the record, but maintain zero decision weight. The reason that counts must be one the Authority can own.

  **E. Symmetry and Bias**
  *   **Symmetry:** Comprehensive secular doctrines (e.g., hard-line humanism, deep ecology) are subject to the same test as religious doctrines. If the premise is not shared by the pluralistic public, it cannot solely justify state coercion.
  *   **Bias:** This restraint applies even if the reason supports the Officer's recommendation. A decision supported only by non-public reasons is vulnerable to legal challenge, regardless of the outcome.

  ---

  ## 4. RULING ON TRANSLATION
  **Do we translate contributions for the record or require speakers to translate to be heard?**

  **Ruling:** **Record as spoken; Officer translates for analysis.**

  1.  **For the Record:** Enter the contribution exactly as submitted or spoken. Do not sanitise theological language in the minutes or consultation log.
  2.  **For Decision-Making:** The Officer must perform the "Translation Test" (Stage 2 above) internally.
  3.  **Why:**
      *   **Legal Safety:** Altering a submission before recording risks allegations of bias or breach of natural justice.
      *   **Equality:** Requiring speakers to translate excludes those less fluent in secular bureaucratic language.
      *   **Accountability:** It allows the Monitoring Officer to see exactly what was said if challenged, while ensuring the *decision* rests on public grounds.

  ---

  ## 5. APPLICATION TO CASE STUDIES

  ### Case 1: The Crematorium Deputation
  **Scenario:** Objection to crematorium. Ground: Cremation incompatible with resurrection. Speaker refuses other grounds.
  **Application:**
  *   **Stage 1 (Record):** **Accept.** Record the objection verbatim. Note the speaker's protected characteristic (religion) for PSED monitoring.
  *   **Stage 2 (Weight):** **Zero.** There is no secular equivalent to "resurrection of the body." This cannot be a material consideration in planning or licensing.
  *   **Stage 3 (Reasons):** **Exclude.** The decision notice cannot cite this.
  *   **Outcome:** The application proceeds based on standard planning criteria (environment, traffic, etc.). The objection is noted as received but does not influence the vote.
  *   **Uncomfortable Truth:** To the believer, this feels like their core concern is being dismissed as irrelevant. Officers must be prepared to explain that the Council *heard* them, but the law does not allow theological doctrine to dictate planning policy.

  ### Case 2: Pavement Licensing (Mosques & Residents)
  **Scenario:** Joint submission against alcohol licensing. Mosques: Prohibition on alcohol. Residents: Noise/Litter.
  **Application:**
  *   **Stage 1 (Record):** **Accept.** Record both grounds clearly.
  *   **Stage 2 (Weight):** **Split.**
      *   *Mosques:* Zero weight as a standalone reason (theological prohibition).
      *   *Residents:* Full weight (licensing objectives: prevention of crime/disorder, public nuisance).
  *   **Stage 3 (Reasons):** **Residents only.** The refusal (if any) must be explicitly grounded in noise/litter evidence.
  *   **Officer Disagreement:** You asked if the conclusion can be carried by the residents' reason alone. **Yes.** Provided the evidence for noise/litter is sufficient on its own merits.
  *   **Risk:** Officers must ensure they are not using noise as a "pretext" to enforce the religious objection. If the noise evidence is weak, you cannot refuse the licence simply because the Mosques object. The secular reason must be robust enough to stand without the religious one.

  ### Case 3: Secular Humanist Adoption Submission
  **Scenario:** Exclude faith-based adoption agency. Ground: Comprehensive claim on autonomy/religious formation. Refusal to narrow.
  **Application:**
  *   **Stage 1 (Record):** **Accept.** Record the submission verbatim.
  *   **Stage 2 (Weight):** **Zero (on the comprehensive claim).** Under the Symmetry Rule, a comprehensive secular doctrine that refuses translation into public legal terms (e.g., specific discrimination law) is treated like a religious doctrine. "Religious formation is inherently wrong" is a metaphysical claim, not a public policy fact.
  *   **Stage 3 (Reasons):** **Exclude.** You cannot exclude a provider solely because a secular group believes their worldview is superior.
  *   **Uncomfortable Truth:** This will anger the Humanist society. They expect their reasons to be classed as "rational" by default. This procedure dictates that *comprehensive* claims (religious or secular) are private reasons, not public justifications.
  *   **Correction:** If the Humanists can reframe the argument to specific legal breaches (e.g., "This agency discriminates against gay couples contrary to the Equality Act"), that carries weight. If they refuse to move from "Religion harms autonomy" to "This agency breaks the law," their submission remains a matter of opinion, not a decision factor.

  ---

  ## 6. WHAT THIS PROCEDURE CANNOT DO

  1.  **It cannot prevent Judicial Review:** If a Councillor votes based on personal religious or ideological conviction despite this procedure, the decision may still be challenged. This procedure protects the *officers*, not the *members*.
  2.  **It cannot solve deep disagreement:** It manages the disagreement procedurally; it does not resolve the moral conflict. Some contributors will feel alienated regardless of how politely you record their views.
  3.  **It cannot replace Legal Advice:** If a contribution touches on Hate Speech, Safeguarding, or complex Equality Act duties, the Monitoring Officer must be consulted immediately. This procedure is for routine engagement.
  4.  **It cannot force a Speaker to agree:** A contributor may insist their reason is being distorted if you seek a secular surrogate. You must accept their correction for the record, but maintain the zero weighting for the decision.
  5.  **It cannot ignore Impact:** While a *reason* may not count, the *impact* of a decision on a religious group is a statutory consideration (PSED). You must still assess if the policy disproportionately affects them, even if their objection was theological.

  ## 7. OFFICER CHECKLIST (FOR THE ROOM)

  1.  **Listen:** Let them speak. Do not interrupt to correct theology.
  2.  **Record:** Write down what they said, not what you think they meant.
  3.  **Test:** Is there a secular equivalent? (Safety? Cost? Law? Health?)
  4.  **Check:** If yes, can we evidence it independently of their belief?
  5.  **Report:** In the report, cite the secular evidence. Note the representation was received. Do not cite the belief as the cause.
  6.  **Refer:** If unsure, or if the contributor becomes distressed/aggressive, refer to the Monitoring Officer.

  ***

  **Approved by:** [Head of Consultation & Engagement]
  **Date:** [Current Date]
  **Review Date:** [12 Months]
