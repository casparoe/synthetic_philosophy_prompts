answer: |-
  Here are the desiderata for an account of genetic information, structured to adjudicate the literal/metaphorical status of biological coding.

  ### Desiderata for an Account of Genetic Information

  **1. The Conventionality Constraint**
  *   **Status:** *Non-negotiable for "Literal Code" camps; Rejected by "Causal Template" camps.*
  *   **Conceptual Distinction:** Whether the mapping must be **arbitrary** or may be **stereochemical**.
  *   **Motivating Case:** **Case 3 (Codon Reassignment).** In a lineage where a synthetase reassignment shifts a codon family, the physical chemistry of the codon remains identical, but the semantic output changes. If the account defines information via physical affinity (stereochemistry), the reassignment is inexplicable or must be treated as a breakdown of the system. If the account defines information via convention, the reassignment is merely a change of dictionary.
  *   **Requirement:** The account must explain how the mapping between vehicle (codon) and content (amino acid) is maintained by the system's history or function, rather than by physicochemical necessity.

  **2. The Locus Constraint**
  *   **Status:** *Non-negotiable for coherence.*
  *   **Conceptual Distinction:** Whether the code is a property of a **string** or of a **string-plus-reader**.
  *   **Motivating Case:** **Case 2 (Dual Translation Systems).** A single mRNA sequence produces Protein A under Ribosome System 1 (triplet) and Protein B under Ribosome System 2 (quadruplet). If the information resides solely in the nucleic acid string, the string simultaneously carries contradictory instructions.
  *   **Requirement:** The account must locate the code in the *relation* between the polymer and the decoding machinery, not in the polymer alone. The molecule is a *key*, not a *message*; the message exists only relative to the lock.

  **3. The Functional Scope Constraint**
  *   **Status:** *Preference of the "Instructional" camp (narrow) vs. "Causal Role" camp (broad).*
  *   **Conceptual Distinction:** Whether the message's output is **amino-acid sequence**, **phenotype**, or **selected function**.
  *   **Motivating Case:** **Case 1 (Sequence-Specific Binding).** A DNA spacer or promoter site binds a protein to regulate timing or structure, with no downstream translation into a distinct polypeptide product. If "information" requires translation into amino acids, these sites are merely structural scaffolds. If "information" includes regulatory instruction, they are carriers.
  *   **Requirement:** The account must specify whether "reading" implies synthesis of a new polymer (transcription/translation) or if it includes the direct execution of a regulatory function (binding).

  **4. The Substrate Neutrality Constraint**
  *   **Status:** *Preference of the "Pluralist" camp (e.g., Jablonka); Rejected by "Digitalist" camp.*
  *   **Conceptual Distinction:** Whether carrying information requires a **linear polymer sequence**.
  *   **Motivating Case:** **Case 4 (Prions and Methylation).** Heritable phenotypic variation is transmitted via protein conformation or epigenetic marks without changes to the DNA sequence. If information requires a digital alphabet, these are non-genetic environmental effects. If information requires only heritable specificity, these are information carriers.
  *   **Requirement:** The account must decide if the "code" is defined by the medium (nucleic acid) or by the causal role (heritable specificity).

  **5. The Normativity Constraint**
  *   **Status:** *Non-negotiable for Semantic accounts; Incompatible with strict Reductive Naturalism.*
  *   **Conceptual Distinction:** Whether carrying information requires the **possibility of misreading**.
  *   **Motivating Case:** **General (Mutation vs. Variation).** For a code to be literal, a mutation must be a *mistake* (falsehood), not just a *difference* (alternative cause). A causal template cannot be "wrong," only different. A semantic code can be misread.
  *   **Requirement:** The account must provide truth conditions for the genetic message. It must distinguish between a system functioning correctly (producing the selected effect) and a system malfunctioning (mutation/error), even if the malfunction is physically deterministic.

  ***

  ### Incompatible Subsets: The Naturalism Trap

  You cannot jointly satisfy **Desideratum 5 (Normativity)** and a strict **Reductive Naturalism** without adopting a specific bridging theory (e.g., Teleosemantics).

  *   **The Conflict:** To satisfy Desideratum 5, you must claim that a mutation is a *misrepresentation* of the genome. This introduces normativity (a "should" that is violated). To satisfy strict Naturalism, you must claim that biological processes are purely physical causal chains where "error" is just a label for low-fitness outcomes, not a semantic failure.
  *   **The Consequence:** If you insist that "error" is real and literal (Non-negotiable for semantic realism), you risk committing to a normativity that sits badly with a physicalist ontology. If you insist on strict Naturalism (Non-negotiable for physicalism), you are forced to treat "error" as a metaphor, which collapses the claim that the code is *literal*. Most contemporary accounts (e.g., Godfrey-Smith, Shea) attempt to resolve this by grounding normativity in evolutionary history, but this remains the primary friction point in the literature.

  ***

  ### The Exclusionary Requirement

  The single requirement that excludes the most contenders is **Desideratum 1 (The Conventionality Constraint)**.

  Demanding that the mapping be arbitrary/conventional rather than stereochemical/causal immediately eliminates all "template" or "causal correlation" accounts of genetic information, forcing a choice between semantic realism (the code is literal but requires a theory of convention) and causal deflationism (the code is a metaphor for physical affinity).
