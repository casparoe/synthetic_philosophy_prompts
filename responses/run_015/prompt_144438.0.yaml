answer: |-
  **Part (a): 5/6**
  You correctly set out the Moorean argument: the contrast in acceptability between the two conjunctions suggests assertion represents the speaker as knowing. You also correctly identify the "generality objection": the same pattern of absurdity arises for *any* proposed norm (if assertion represents satisfaction of the norm, denying satisfaction sounds odd). This successfully explains why the datum does not uniquely establish (K) over (R).

  However, your explanation of why the sentence sounds odd under (R) is slightly imprecise. You suggest it is odd because denying knowledge while claiming reasonable belief is "misleading." A sharper point would be that if (R) were the constitutive norm, the *constitutive* absurdity should attach to "*p*, but I don't reasonably believe *p*." The fact that the absurdity attaches specifically to *knowledge* requires extra explanation under (R) (e.g., via implicature), whereas (K) explains it directly. You captured the logical structure well, but this nuance distinguishes a top-grade answer.

  **Part (b): 2/6**
  This section contains significant errors relative to the exam instructions. First, you failed to follow the explicit instruction to "outline the two main lines of reply available to a defender of (K)." The prompt even listed them in parentheses (denying acceptability; contextualism/stakes). Instead, you argued that the case refutes (K). You lost most of the marks here by ignoring the directive to explain the *defence* of (K).

  Second, and more seriously, you violated Stipulation 2. The prompt explicitly required you to "keep distinct the questions whether a speaker violates a norm... and whether she is blameworthy." It stated: "a constitutive rule can be violated by someone who has done nothing blameworthy." Your argument claims (K) is implausible because it convicts careful speakers of "blameworthy conduct" and says Ada is "open to blame and sanction." This reasoning contradicts the stipulated framework. A defender of (K) argues the assertion is *defective* (violates the norm) even if Ada is *blameless* (non-culpable ignorance). You conflated defectiveness with blameworthiness, which undermines your philosophical analysis in this section. You did correctly note how (T) and (R) handle the case, which saved this from a zero.

  **Part (c): 7/8**
  This is a strong assessment. You correctly identified the structural differences: (DW) is non-factive (unlike K/T) and audience-relative via clause (iii) (unlike K/T/R). You logically applied the definition to the lottery case, showing how (DW) permits the assertion to the layperson but blocks it for the inspector, which is a sophisticated application of clause (iii).

  Your identification of the "guidance problem" is excellent. Your second criticism regarding factivity is also compelling: you noted that because (DW) lacks a factive condition, a false assertion with good evidence satisfies the norm. You argued persuasively that a norm of assertion must deem some false assertions defective. This shows strong critical engagement. The only minor deduction is for the Moorean accommodation: you claim (DW) predicts "*p*, but I have no evidence" is odd (correct), but imply this fully captures the Moorean datum regarding *knowledge*. While (DW) explains evidential absurdity, explaining the specific *knowledge* absurdity requires an extra step you didn't fully articulate. Nevertheless, this is high-quality work.

  **Total: 14/20**

  ***

