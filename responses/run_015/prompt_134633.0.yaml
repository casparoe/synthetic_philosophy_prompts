answer: |-
  **The Enumerated Day**

  The package arrived on a Tuesday, wrapped in brown paper that smelled of old libraries. Inside lay a notebook bound in grey cloth. The first page bore my name, not written, but embossed, as if the fibers of the paper had grown around the letters. The text within described the current day. At 10:00 A.M., it noted, I would open the package. This was true. At 10:15, I would feel a sudden chill near the window. This also occurred.

  The entry for 6:00 P.M. stated: *He will burn the notebook in the fireplace.*

  I am not a man given to fatalism, nor to arson. I resolved to test the ontology of the text. At 5:55, I placed the notebook on the mantel. At 6:00, I did not burn it. I placed it in the drawer of my desk, feeling a quiet triumph over the sequence of causes. I had severed the link between the prediction and the act. The future was not a landscape, but a fog.

  On Wednesday, a second notebook arrived. It was identical to the first, save for the date. It described my Tuesday. It noted that at 6:00 P.M., believing himself free, the subject would place the book in the drawer. It added: *He believes this act is a rebellion. He does not see that the rebellion is the terrain.*

  I understood then that the first notebook was written from a vantage point where my Tuesday was a static object, a line drawn on a map. The second notebook, however, described the first notebook as an object within *its* timeline. The observer of the second book saw my Tuesday and my reaction to the first book as simultaneous facts.¹

  I tried again. On Wednesday evening, I resolved to destroy the second notebook. On Thursday, a third notebook arrived. It recorded my resolution to destroy the second, and my failure to do so. It described the pile of grey cloth growing on my desk.

  By Sunday, there were seven notebooks. They formed a small tower. I sat before them, reasoning. If every moment requires a higher dimension to be viewed as a whole, then my present is always a past for someone else. But who observes the observer? If the regress is infinite, there is no final observer to collapse the probability into certainty. There is no top floor to the tower.

  Consider the "I" that reads the first notebook at 10:00 A.M. and the "I" that burns (or does not burn) it at 6:00 P.M. We share a name and a body, but we do not share a moment. The first "I" is a memory to the second. The second "I" is a prophecy to the first. To say they are the same person is a grammatical convenience, a way to link two discrete states of consciousness with a verb.²

  If the stack of notebooks is infinite, then for every moment I experience, there is already a record of it. But if the record exists before the experience, the experience is not a becoming; it is a reading. I am not moving through time. I am turning the pages of a book that is already written, mistaking the turn of the page for the flow of a river.

  I picked up a pen. I intended to write a sentence that none of the notebooks could predict. I pressed the nib to the paper. But I realized that the act of writing this sentence is itself a moment. If there is an eighth notebook arriving tomorrow, it already contains the shape of this ink. If there is no eighth notebook, then the series terminates, and the universe is blind. But the precision of the first seven suggests no blindness.

  Therefore, the ink is already dry. The effort I feel in moving my hand is not the creation of the line, but the sensation of traversing it. The succession I feel—the tick of the clock, the scratch of the pen—is merely the shadow of a higher geometry cast upon my senses. I am not writing. I am being read.

  I put the pen down. The stack of notebooks sits before me. They do not accumulate dust. They seem to hum with a low vibration, as if each page is touching every other page simultaneously. I look at the clock. It is 6:00 P.M. I do not know which notebook this is. It does not matter. The moment is complete. It contains the reading, the writing, and the ash in the fireplace. I am all of them, and none.

  ***

  ¹ *This implies a hierarchy of temporal planes. If Plane B sees Plane A as static, Plane B must possess a time dimension orthogonal to A's. However, if B possesses time, it too must be subject to observation by Plane C. See: Quain, "The Paradox of the Orthogonal Witness."*

  ² *Schopenhauer noted that the will is free, but the individual is not. Here, the individual is not even a continuous entity. The "I" is merely the locus where the notebooks intersect.*
