answer: |-
  Here is a complete simulation design tailored for an upper-level philosophy seminar. It moves away from technological standards (QWERTY/VHS) and focuses on **normative institutionalism**—how early moral/procedural commitments create "deontic debt" that makes rational deviation impossible later.

  # Simulation Title: The Doctrinal Inertia Protocol

  **Time:** 60 Minutes
  **Participants:** 16 Students (4 Groups of 4)
  **Materials per Group:**
  *   3 **Founding Principle Cards** (labeled A, B, C).
  *   1 **Crisis Deck** (3 cards drawn sequentially).
  *   15 **Precedent Tokens** (poker chips or paper slips).
  *   1 **Ledger Sheet** (for tracking points).
  *   1 **Auditor's Brief** (sealed envelope, opened only at the end).

  ---

  ## 1. The Setup (5 Minutes)
  **Instructor Script:**
  "You are not building a company; you are founding a **Normative Order**. Your goal is to accumulate *Legitimacy Points* (LP) by solving social crises. However, legitimacy is not just about outcomes; it is about consistency with your foundational doctrines. One of you is the **Counterfactual Auditor**. You do not play. You observe, record, and judge the ontology of your group's history."

  **Group Roles:**
  *   **3 Legislators:** Make decisions, spend tokens, collect LP.
  *   **1 Counterfactual Auditor:** Silent during play. Holds the "Ghost Deck" (a list of optimal moves). Records *why* decisions were made.

  ---

  ## 2. The Mechanics (40 Minutes Total)

  ### Round 1: The Arbitrary Founding (10 mins)
  *   **Action:** Legislators draw 3 **Founding Principle Cards**. They must choose **one** to adopt as their Constitution.
      *   *Card A (Egalitarian):* LP gains are capped at 5 per round, but cost 1 Token to enact.
      *   *Card B (Meritocratic):* LP gains are uncapped, but cost 3 Tokens to enact.
      *   *Card C (Procedural):* LP gains are random (dice roll), cost 2 Tokens to enact.
  *   **The Trap:** The choice seems stylistic. However, choosing a card grants **Precedent Tokens** equal to the "cost" listed (1, 3, or 2).
  *   **Ontological Hook:** These Tokens represent **Institutional Capital**. You *must* hold tokens to make moves in later rounds. You cannot generate new tokens; you can only spend or save what you got in Round 1.
  *   **Auditor Task:** Record which path was *not* taken.

  ### Round 2: The Stress Test (10 mins)
  *   **Action:** Draw a **Crisis Card**. It presents a scenario requiring a response.
      *   *Example Crisis:* "Resource Scarcity. Demands high-efficiency distribution."
  *   **Choice:**
      1.  **Align:** Solve the crisis using your Round 1 Principle. Cost: Standard Token rate. Gain: Standard LP.
      2.  **Pivot:** Solve the crisis using a *different* Principle. Cost: **2x Token rate**. Gain: **1.5x LP**.
  *   **The Squeeze:** Most groups will hoard tokens in Round 1. In Round 2, pivoting is expensive but profitable. Staying aligned is cheap but limited.
  *   **Auditor Task:** Note if the group sacrificed efficiency for coherence, or vice versa.

  ### Round 3: The Lock-In (15 mins)
  *   **Action:** The **Golden Opportunity** arrives.
      *   *Offer:* A policy change that guarantees **20 LP** (massive win).
      *   *Requirement:* It fundamentally violates the Round 1 Principle (e.g., An Egalitarian group must adopt a Meritocratic bypass).
      *   **The Lock:** To switch, you must pay a **Reversal Tax**.
      *   **Formula:** Reversal Tax = (Current LP Total) × 3.
      *   **Constraint:** You pay the tax using **Precedent Tokens**. 1 Token = 1 LP of tax credit.
  *   **The Reality:** By Round 3, groups will have spent most tokens in Rounds 1 & 2. They will likely have <5 Tokens left. The Tax will be ~60 LP (3x their score). They physically *cannot* pay the tax to access the better branch.
  *   **Result:** They are rationally locked into a suboptimal normative framework. They *see* the 20 LP, but the cost of their own history makes it irrational to take it.
  *   **Auditor Task:** Open the **Auditor's Brief**. It reveals the "Ghost Score" (what they would have had if they chose the optimal path in Round 1 and stayed).

  ### Scoring & Audit (5 mins)
  The Auditor fills out the **Ontological Rubric** (see below) and presents the verdict to the group.

  ---

  ## 3. The Counterfactual Auditor's Rubric
  *The Auditor does not judge "winning." They judge the **nature of the history**.*

  | Criterion | **Fitness-Selected** | **Frozen Accident** | **Normatively Path-Locked** |
  | :--- | :--- | :--- | :--- |
  | **Definition** | The group ended on the optimal path because it was inherently better. | The group ended on a suboptimal path due to random chance in Round 1. | The group ended on a suboptimal path because *switching costs* exceeded gains. |
  | **Evidence** | High LP Score + Low Regret Ratio. | Low LP Score + Low Switching Cost (they just chose wrong). | **Low LP Score + High Switching Cost** (They *couldn't* switch). |
  | **Verdict** | "Your history reflects truth." | "Your history reflects luck." | **"Your history reflects inertia."** |

  * **Regret Ratio:** (Ghost Score - Actual Score) / Ghost Score.
  * **Lock-In Index:** (Cost to Switch in R3) / (Gain from Switching in R3). If >1, they are locked.

  ---

  ## 4. Debrief & Mapping (15 Minutes)
  *Do not lecture. Ask the groups to report their Auditor's Verdict.*

  **Phase 1: Contingency (Round 1)**
  *   *Question:* "Did anyone choose their Round 1 Principle because it was objectively superior, or because it felt 'right' in the moment?"
  *   *Philosophical Link:* This maps to **Initial Conditions Sensitivity**. In social ontology, small, arbitrary normative choices (e.g., "we value privacy over security") become the bedrock of reality.

  **Phase 2: Irreversibility (Round 3)**
  *   *Question:* "Auditors, how many groups saw the 20 LP gain but couldn't take it? Why?"
  *   *Philosophical Link:* This is **Increasing Returns to Scale** in normative space. It's not that the old rule is better; it's that the *cost of de-legitimizing* the old rule (burning Institutional Capital) is too high. This is distinct from tech lock-in; it's *moral* lock-in.

  **Phase 3: Convergence (The Auditor's Ghost)**
  *   *Question:* "Did all groups converge on the same score? Or did early divergence persist?"
  *   *Philosophical Link:* If scores vary wildly, history is **not convergent**. If the Auditors show that everyone *could* have scored the same but didn't, it proves **Underdetermination**.

  ---

  ## 5. Predicted Failure Modes (Instructor Notes)
  1.  **The Token Math Glitch:** Students might forget they can't generate new tokens. *Fix:* Remind them at the start of Round 2: "Your Institutional Capital is finite. Spend wisely."
  2.  **The Auditor Boredom:** The Auditor might feel excluded. *Fix:* Emphasize that the Auditor holds the "God's Eye View." Their verdict is the only one that matters for the seminar discussion.
  3.  **Rational Rebellion:** A group might realize in Round 3 that they can't pay the tax, so they just stop playing. *Fix:* Tell them they *must* attempt a move. If they can't pay the tax, they must stay on the suboptimal path and accept the lower score. This *is* the lesson.

  ---

  ## 6. Limitations: What This Cannot Reproduce
  *Be honest about this in the final 2 minutes.*

  1.  **The Fog of Counterfactuals:** In the sim, the Auditor knows the "Ghost Score." In real history, **we do not have Auditors.** We never know if the path not taken was actually better. We suffer from *hindsight bias*, assuming the path we are on was inevitable (Whig history).
  2.  **Timescale Compression:** Real lock-in takes generations. Norms solidify as people die and new ones are socialized. In this sim, the "generations" are minutes. You feel the *logic* of lock-in, but not the *weight* of intergenerational transmission.
  3.  **Rationality Assumption:** The sim assumes players want to maximize LP. In reality, actors often destroy their own institutions out of spite or passion. This sim models *structural* lock-in, not *agential* self-sabotage.

  ---

  ## 7. Niche Framing for the Seminar
  *Use this language to elevate the discussion beyond "game theory."*

  *   **Deontic Debt:** The "Reversal Tax" isn't financial; it's the cost of violating your own established norms.
  *   **Institutional Capital:** The Precedent Tokens represent the stored authority of the institution. Once spent, the institution loses the power to authorize new moves.
  *   **Normative Hysteresis:** The lag between the "optimal" moral choice and the "possible" moral choice due to past commitments.

  **Instructor Closing Line:**
  "Today you didn't just play a game; you experienced **ontological drag**. You wanted to move to a better future, but the mass of your own past made it irrational to do so. That is social ontology."
