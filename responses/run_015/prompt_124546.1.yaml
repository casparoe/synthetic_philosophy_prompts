      *   Auditor Rubric: Specific.
      *   Debrief Questions: Targeted.
      *   Limitations: Honest assessment.

  *(One last thought on the "3x cost")*: Make sure the math works. If Gain is 10, Cost must be 30. If they have 20 points saved, they can't pay it. They are *locked*.

  Let's finalize the Auditor's Rubric.
  1. **Efficiency:** Did they maximize points?
  2. **Coherence:** Did they stay true to Round 1?
  3. **Lock-in Index:** (Switching Cost / Potential Gain).

