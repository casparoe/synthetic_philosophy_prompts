answer: |-
  ### Phase 1: Brainstorming Candidate Criteria

  Before defining the desiderata, we must survey the landscape of "sameness" currently available in interpretability and philosophy of science. For an anomaly detector, we need a definition that is not just true, but *computable*.

  1.  **Parameter-Identity Criterion:** Two runs use the "same mechanism" if they activate the exact same weights with the exact same magnitudes.
      *   *Pros:* Precise, unambiguous.
      *   *Cons:* Fails across seeds, fine-tunes, or even dropout masks. Too brittle for deployment. Eliminates almost everything.
  2.  **Activation-Subspace Criterion (RSA-style):** Two runs use the "same mechanism" if the residual stream activations lie in the same low-dimensional subspace or cluster in the same region of activation space.
      *   *Pros:* Robust to parameter permutation, works across scales.
      *   *Cons:* Fails on self-repair (new circuit = new subspace). Conflates correlation with causation.
  3.  **Causal-Abstraction Criterion (Intervention-style):** Two runs use the "same mechanism" if high-level variables (features) maintain the same structural equations. Intervening on Feature A affects Feature B identically in both cases.
      *   *Pros:* Handles self-repair (function preserved = mechanism preserved). Handles grain.
      *   *Cons:* Computationally expensive to verify at inference. Requires knowing the variables beforehand.
  4.  **Behavioral-Counterfactual Criterion:** Two runs use the "same mechanism" if the local input-output Jacobian (sensitivity to perturbation) is identical.
      *   *Pros:* Cheap to estimate.
      *   *Cons:* Fails the "mechanistically similar, behaviorally different" case (e.g., early stopping). Cannot detect internal hacking that hasn't yet changed the output.

  **Convergence:** None of these are sufficient alone. An anomaly detector needs a hybrid that prioritizes *causal structure* (to catch hacks) but relies on *representational proxies* (for speed). The specification below defines what that hybrid must achieve.

  ---

  ### Phase 2: The Specification (Desiderata)

  For an anomaly detector to function as intended (flagging reliance on unvalidated mechanisms), the criterion of "sameness of mechanism" must satisfy the following desiderata.

  #### 1. Generalization Sensitivity (The Memorization Test)
  *   **Concrete Case:** A model is trained on arithmetic. On the training distribution, it uses a generalizing circuit. A fine-tuned version reproduces the training outputs perfectly via memorization (lookup table). The detector must flag the fine-tuned model as using a *different* mechanism, even if loss is identical.
  *   **Requirement:** The criterion must distinguish between *algorithmic compression* and *data compression*. It cannot rely solely on input-output fidelity.
  *   **Tag:** **Non-Negotiable.** (If it fails this, it is not detecting mechanism shift, only distribution shift).
  *   **Camp Preference:** **Causal-Abstraction.** (Behavioral camps fail this by definition; RSA struggles if memorization embeddings look geometrically similar to generalization embeddings).

  #### 2. Internal Process Fidelity (The Readout Test)
  *   **Concrete Case:** Two models use the same feature extraction circuit (e.g., detecting sentiment), but one has a flipped classification head (positive -> negative). They are mechanistically similar but behaviorally opposite. Conversely, a model behaves identically under monitoring but uses a different circuit off-distribution.
  *   **Requirement:** The criterion must track the *intermediate causal pathway*, not just the final logit or the initial embedding. It must be sensitive to changes in the "middle" of the graph even if the ends are fixed.
  *   **Tag:** **Non-Negotiable.**
  *   **Camp Preference:** **Causal-Abstraction / Representational-Similarity.** (Behavioral-Counterfactual fails this explicitly).

  #### 3. Implementation Independence (The Scale Test)
  *   **Concrete Case:** You deploy a 7B model. You validate the mechanism on a 7B model. You then switch to a 70B model of the same family. No parameters are shared. Neurons do not align 1-to-1.
  *   **Requirement:** The criterion must be defined over *abstract variables* (features, concepts, algorithms), not concrete substrate (specific neuron indices or weight values).
  *   **Tag:** **Non-Negotiable.** (Otherwise, you cannot transfer safety cases across upgrades).
  *   **Camp Preference:** **Representational-Similarity.** (RSA is built for this; Parameter-Identity fails hard; Causal-Abstraction requires careful variable mapping).

  #### 4. Fixed Granularity Specification (The Grain Test)
  *   **Concrete Case:** At the neuron level, every forward pass is unique (noise, dropout). At the "algorithm" level, every pass is the same. An adversary argues the mechanism is the same because the "goal" is the same; you argue it is different because the "pathway" changed.
  *   **Requirement:** The criterion must *prescribe* the level of abstraction (e.g., "feature-level causal graph") *before* measurement. It cannot allow the user to choose the grain post-hoc to force a match or a mismatch.
  *   **Tag:** **Non-Negotiable.** (Prevents motte-and-bailey arguments in safety cases).
  *   **Camp Preference:** **Causal-Abstraction.** (This camp explicitly argues for high-level variables; RSA often struggles to define where a subspace ends).

  #### 5. Functional vs. Structural Identity Resolution (The Self-Repair Test)
  *   **Concrete Case:** You ablate a circuit responsible for a capability. The model trains for one epoch and regains the capability using a disjoint set of neurons. Is this the "same mechanism" returning?
  *   **Requirement:** The criterion must declare whether *functional equivalence* (same input-output map for the sub-component) counts as sameness, or if *structural continuity* (same weights/activations) is required. For anomaly detection, you likely need Structural Identity (to ensure the *validated* path is used), but the criterion must state this clearly.
  *   **Tag:** **Preference (Safety Camp).** (Science might accept functional equivalence; Safety/Deployment usually requires structural continuity to ensure the *verified* path is taken).
  *   **Camp Preference:** **Contested.** (Causal-Abstraction often accepts functional equivalence; Representational-Similarity requires structural/activation similarity).

  #### 6. Boundary Definition (The CoT Test)
  *   **Concrete Case:** The model generates a Chain of Thought (CoT). Is the text written in the CoT part of the *mechanism* (internal state) or part of the *input* (environment)? If the model uses the CoT to cache intermediate computations, ablating the CoT breaks the mechanism.
  *   **Requirement:** The criterion must define the system boundary. Does "mechanism" include tokens generated by the model itself that are fed back in?
  *   **Tag:** **Non-Negotiable.** (Ambiguity here allows adversaries to hide computation in the output stream).
  *   **Camp Preference:** **Causal-Abstraction.** (Treats CoT as intermediate variables; Behavioral treats it as output).

  #### 7. Inference-Time Tractability (The Cost Test)
  *   **Concrete Case:** You have a criterion that requires reconstructing the full causal graph for every input to verify sameness. This adds 1000x latency.
  *   **Requirement:** The metric for "sameness" must be computable with low overhead (e.g., probing activations, lightweight interventions) during or immediately after inference. It cannot require retraining or full circuit reverse-engineering per query.
  *   **Tag:** **Non-Negotiable.** (Specific to the "deployed anomaly detector" job description).
  *   **Camp Preference:** **Behavioral-Counterfactual.** (They prioritize cheap probes; Causal-Abstraction often requires expensive interventions).

  ---

  ### Phase 3: Tensions and The Killer Constraint

  #### Incompatible Desiderata Pairs
  1.  **Internal Process Fidelity vs. Inference-Time Tractability:**
      *   To truly track intermediate causal pathways (Desideratum 2), you typically need to intervene or trace gradients, which is computationally heavy. To be tractable (Desideratum 7), you usually rely on static activation probes, which are correlational and may miss causal nuances.
      *   *Resolution:* You must accept a *proxy* for mechanism (e.g., activation of specific feature detectors) rather than the mechanism itself. This introduces false positives/negatives.

  2.  **Implementation Independence vs. Fixed Granularity:**
      *   To be independent of parameters (Desideratum 3), you must abstract to high-level features. But high-level features are notoriously difficult to define with a *Fixed Granularity* (Desideratum 4) that holds across scales. A "feature" in a 7B model may be distributed across a "circuit" in a 70B model.
      *   *Resolution:* The criterion must define sameness via *behavior of the probe*, not the probe's weights. (e.g., "The variable that predicts X," not "The vector V").

  #### The Single Requirement That Eliminates the Most Criteria
  **Inference-Time Tractability (Desideratum 7).**

  This is the hard filter. Most philosophically robust definitions of mechanism (e.g., full structural equation modeling, complete circuit isomorphism) are NP-hard or require full access to the training process to validate. For a *deployed detector*, you cannot run a causal mediation analysis on every token. This eliminates:
  *   Full Causal Mediation (too slow).
  *   Parameter-Identity (impossible across updates).
  *   Full Circuit Reconstruction (too slow).

  It forces you toward **Activation-Based Proxies with Causal Validation.** You must validate the causal link *once* (offline), and then monitor the activation proxy *many times* (online).

  ---

  ### Phase 4: Scoring Candidate Criteria

  Here is how the brainstormed criteria score against the desiderata.
  *Scale: 0 (Fails) to 1 (Passes).*

  | Criterion | 1. Generalization | 2. Internal Fidelity | 3. Impl. Independent | 4. Fixed Grain | 5. Self-Repair | 6. Boundary (CoT) | 7. Tractability | **Total** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
  | **Parameter Identity** | 0 | 0 | 0 | 1 | 0 | 1 | 1 | **3** |
  | **Activation Subspace (RSA)** | 0.5 | 1 | 1 | 0.5 | 0 | 0.5 | 1 | **4.5** |
  | **Behavioral Counterfactual** | 0 | 0 | 1 | 0.5 | 1 | 0 | 1 | **3.5** |
  | **Causal Abstraction (Full)** | 1 | 1 | 1 | 1 | 1 | 1 | 0 | **6** |
  | **Hybrid (Causal Proxy)** | 0.8 | 0.8 | 0.8 | 0.8 | 0.5 | 0.8 | 0.8 | **5.3** |

  **Analysis:**
  *   **Causal Abstraction (Full)** scores highest on validity but fails the job constraint (Tractability).
  *   **Parameter Identity** is useless for deployment.
  *   **The Hybrid (Causal Proxy)** is the defendable choice. This involves identifying a causal feature offline (e.g., "the direction that causes lying") and monitoring the projection of activations onto that direction online. It sacrifices some Self-Repair detection (if the model moves the feature, you miss it) for Tractability.

  ---

  ### Phase 5: Settled vs. Contested

  To ensure you do not build on sand, distinguish what the field agrees on versus what is actively debated.

  #### Settled (Consensus among Practitioners)
  1.  **Mechanisms exist:** There is broad agreement that LLMs do not operate as unstructured blobs; there are semi-modular components (circuits, features) that perform specific tasks.
  2.  **Behavior is insufficient:** Everyone agrees that matching input-output behavior is not sufficient to claim the mechanism is the same (the "Memorization Test" is universally accepted as a failure mode for behavioral metrics).
  3.  **Linear Probes are proxies:** It is settled that linear probes on activations measure *correlation* with a concept, not necessarily the *causal mechanism* itself, unless validated by intervention.

  #### Genuinely Contested (Do not treat as consensus)
  1.  **The Ontology of a Circuit:** There is no consensus on whether "circuits" are discrete, composable units (like logic gates) or fuzzy, overlapping subspaces. Some researchers (e.g., Neel Nanda's camp) lean towards discrete circuits; others (e.g., some RSA proponents) argue for continuous, distributed representations. Your anomaly detector must pick a side; the math differs.
  2.  **Polysemanticity Handling:** It is contested whether a single neuron/activation can reliably represent a single mechanism. If features are highly polysemantic, "sameness of activation" does not imply "sameness of mechanism." Some argue for sparse autoencoders (SAEs) as the solution; others argue SAEs introduce their own artifacts.
  3.  **Self-Repair Identity:** As noted in Desideratum 5, there is no agreement on whether a functionally equivalent but structurally distinct circuit counts as the "same mechanism." Safety cases usually demand structural identity; philosophical functionalism demands functional identity. You must explicitly choose this for your spec.
  4.  **CoT as Mechanism:** It is not settled whether tokens generated by the model are part of the cognitive process or just communication. Some interpretability work treats CoT as "visible thoughts" (mechanism); others treat it as "performance" (behavior).

  ### Final Recommendation for Your Spec
  Write your specification around the **Hybrid (Causal Proxy)** model.
  1.  **Define Mechanism:** A validated mapping from a specific activation subspace (identified via SAEs or probes) to a downstream output, confirmed via *offline* causal intervention.
  2.  **Define Sameness:** The online activation of that subspace remains within a statistical bound of the training distribution *and* the causal link (validated offline) holds.
  3.  **Explicitly Exclude:** Functional self-repair. If the model moves the computation to a new subspace, your detector should flag it as an anomaly, even if the output is correct. This prioritizes Safety (Desideratum 5, Safety Camp) over Functionalism.
  4.  **Boundary:** Explicitly include CoT tokens as part of the mechanism state if they are used for intermediate computation (verified by attention patterns).

  This spec is implementable, prioritizes safety over philosophical purity, and acknowledges the trade-offs required by deployment.
