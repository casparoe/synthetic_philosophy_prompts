prompt: |-
  I am writing a historical novel set in first-century Judea, and for every scene or line of dialogue I must decide whether a gospel detail is historically plausible enough to present without framing it as authorial invention. Write a reusable decision procedure — an ordered checklist I can run alone in under ten minutes — that translates the standard criteria of authenticity into practical steps, with explicit stopping points, conflict-resolution rules for when criteria point in opposite directions, and clear flags marking which steps are judgment calls disguised as rules. The procedure should include a specific friction test I have devised: determine whether the detail generates narrative tension that serves no obvious theological or apologetic purpose for its source, and whether it survives a counterfactual in which the author sought to make Jesus appear more conventionally pious or politically unthreatening. Apply it to three details: the temple action, attested across all four narratives but with divergent settings and motives; the birth narratives with angelic announcements and genealogies, present in only two sources and tightly woven into theological claims; and the reported cry of dereliction at the crucifixion, in which Jesus asks why he has been forsaken, a moment that is theologically awkward but emotionally powerful. Include one case where the procedure classifies a resonant, dramatically useful detail as likely invented — an outcome I will not want — and conclude by stating precisely what this checklist can never establish, such as whether Jesus was divine or whether any particular event actually happened. Note that I face editorial deadlines and must justify each decision in a brief author's note.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Goal:** Create a reusable decision procedure (checklist) for a historical novelist set in 1st-century Judea.
      *   **Task:** Determine if a gospel detail is historically plausible enough to present *without* framing it as authorial invention.
      *   **Constraints:**
          *   Must be runnable alone in under 10 minutes.
          *   Must translate standard criteria of authenticity (historical-critical methods) into practical steps.
          *   Must include explicit stopping points.
          *   Must include conflict-resolution rules (when criteria clash).
          *   Must flag judgment calls disguised as rules.
          *   Must include a specific "Friction Test" (narrative tension vs. theological purpose; counterfactual piety/politics).
          *   Must apply the procedure to three specific details: Temple Action, Birth Narratives, Cry of Dereliction.
          *   Must include one case where the procedure classifies a resonant/dramatically useful detail as *likely invented* (even if the author dislikes this).
          *   Must conclude with limitations (what the checklist can *never* establish).
          *   Context: Editorial deadlines, needs justification for author's note.

  2.  **Deconstruct the "Standard Criteria of Authenticity":**
      *   Historians usually use: Multiple Attestation, Embarrassment, Discontinuity (Dissimilarity), Coherence, Semitic Context/Language, etc.
      *   *Challenge:* These are academic tools, not quick checklists. I need to operationalize them for a novelist.
      *   *Integration:* The user's specific "Friction Test" needs to be the core engine, supported by the standard criteria.

  3.  **Drafting the Decision Procedure (The Checklist):**
      *   *Time Limit:* To keep it under 10 minutes, it needs to be binary (Yes/No) or scaled (1-5) with clear thresholds. Let's go with a weighted scoring system or a flowchart style. A flowchart is faster for "stop points."
      *   *Steps:*
          1.  Source Check (Multiple Attestation).
          2.  Theological Utility Check (Embarrassment/Dissimilarity).
          3.  Context Check (Semitic/1st Century fit).
          4.  **The Friction Test** (User's specific requirement).
      *   *Conflict Resolution:* What if Multiple Attestation says "Yes" but Embarrassment says "No"? (e.g., Resurrection). Need a rule.
      *   *Judgment Flags:* Need to explicitly mark where the user is making a subjective call.
      *   *Output:* "Present as History," "Present as Ambiguous," or "Frame as Invention."

  4.  **Developing the "Friction Test":**
      *   *Part A:* Does it generate narrative tension serving no obvious theological/apologetic purpose for the source?
      *   *Part B:* Does it survive a counterfactual where the author wanted Jesus to appear more pious/politically safe?
      *   *Scoring:* If Yes to both -> High Plausibility. If No to both -> Low Plausibility.

  5.  **Applying to the Three Details:**

      *   **Detail 1: The Temple Action (Cleansing).**
          *   *Sources:* All 4 Gospels (Multiple Attestation = Strong).
          *   *Friction:* It's politically dangerous. It leads to arrest. Doesn't make him look "safe."
          *   *Verdict:* Plausible enough to present as history.

      *   **Detail 2: Birth Narratives (Angels/Genealogies).**
          *   *Sources:* Only Matthew & Luke (Mark/John missing).
          *   *Theology:* Tightly woven (Virgin birth, Davidic line).
          *   *Friction:* Serves high theological purpose. Counterfactual: A normal birth makes him *less* messianic, not more pious in a conventional sense, but the angelic element is pure theological signaling.
          *   *Verdict:* Likely Invention (or at least needs framing). *Wait, the prompt asks for one case where a resonant detail is classified as invented.* This fits perfectly. It's dramatic but historically shaky.

      *   **Detail 3: Cry of Dereliction ("My God, why have you forsaken me?").**
          *   *Sources:* Mark & Matthew (Luke/John differ).
          *   *Theology:* Embarrassing. Why would the Son of God feel forsaken?
          *   *Friction:* High tension. No apologetic benefit (early church had to explain this away). Counterfactual: A pious author would write a triumphant last word.
          *   *Verdict:* Plausible enough to present as history.

  6.  **Refining the Procedure for Time & Clarity:**
      *   Need to make sure the "Judgment Call Flags" are visible.
      *   Need to ensure the "Conflict Resolution" is clear.
      *   *Constraint Check:* "Under 10 minutes." The steps must be concise.

  7.  **Addressing the "One Case of Likely Invention":**
      *   The Birth Narrative is the obvious candidate here. It is dramatically resonant (angels, stars, miracles) but fails the Friction Test and Multiple Attestation compared to the ministry/crucifixion accounts. I need to make sure the procedure *forces* this result, even if the novelist loves the scene.

  8.  **Addressing the Limitations:**
      *   Must state clearly: This establishes *narrative plausibility within a historical framework*, not ontological truth or exact factual occurrence.

  9.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Set the tone. Professional, practical.
      *   *The Checklist:* Name it "The Judean Plausibility Protocol (JPP)."
      *   *Steps:*
          1.  Attestation Scan.
          2.  Theological Utility Scan.
          3.  The Friction Test (Core).
          4.  Contextual Fit.
      *   *Scoring:* Keep it simple. Pass/Fail with weights.
      *   *Conflict Rule:* Embarrassment/Friction trumps Attestation for *historicity* (because legends tend to smooth things over).
      *   *Application:* Walk through the three examples using the checklist.
      *   *Limitations:* The "Cannot Establish" section.

  10. **Review against Constraints:**
      *   *Reusable?* Yes.
      *   *Under 10 mins?* Yes, if kept concise.
      *   *Stopping points?* Yes (if you fail Step 3, stop).
      *   *Conflict resolution?* Yes (Hierarchy of criteria).
      *   *Judgment flags?* Yes (marked with [JC]).
      *   *Friction Test included?* Yes.
