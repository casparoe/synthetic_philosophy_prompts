answer: |-
  # The Judean Plausibility Protocol (JPP)
  **Time Estimate:** 8–10 Minutes per detail  
  **Goal:** Classify gospel details as *Historical Core*, *Ambiguous*, or *Theological Invention* for novelistic presentation.

  ---

  ## Part 1: The Decision Checklist

  Run these four steps in order. Do not proceed to Step 4 if Step 3 fails completely.

  ### Step 1: Attestation Scan (2 Minutes)
  *   **Q1:** Is this detail found in Mark, Q (sayings source), or John (independent tradition)?
      *   *Yes:* +2 Points.
      *   *No (Only Matthew/Luke special material):* 0 Points.
  *   **Q2:** Is the detail consistent with known 1st-century Judean/Galilean material culture (archaeology, names, geography)?
      *   *Yes:* +1 Point.
      *   *No/Anachronistic:* -2 Points. **[STOP: Frame as Invention]**

  ### Step 2: Theological Utility Scan (2 Minutes)
  *   **Q3:** Does this detail fulfill a specific Old Testament prophecy or solve an early Christian theological problem (e.g., explaining why the Messiah died)?
      *   *Yes:* -1 Point (Suggests fabrication to fit theology).
      *   *No:* +1 Point.
  *   **Q4:** Is the detail potentially embarrassing to the early church (e.g., Jesus baptized by John, Jesus confused about the end times)?
      *   *Yes:* +2 Points (Criterion of Embarrassment).
      *   *No:* 0 Points.

  ### Step 3: The Friction Test (3 Minutes) **[CORE STEP]**
  *Apply the user-defined friction metric strictly.*
  *   **Q5 (Narrative Tension):** Does this detail generate narrative tension that serves **no obvious theological or apologetic purpose** for its source?
      *   *Yes:* +3 Points.
      *   *No (It glorifies Jesus or validates a doctrine):* 0 Points.
  *   **Q6 (Counterfactual Piety):** Does this detail survive a counterfactual in which the author sought to make Jesus appear **more conventionally pious or politically unthreatening**?
      *   *Yes (It makes him look risky/impious):* +3 Points.
      *   *No (It makes him look safer/holier):* 0 Points.
  *   **Threshold:** If you score less than 3 points total on Step 3, **[STOP: Classify as Theological Invention]**.

  ### Step 4: Coherence Check (2 Minutes)
  *   **Q7:** Does this detail cohere with the "Historical Core" established by Steps 1–3 (e.g., an apocalyptic prophet executed by Rome)?
      *   *Yes:* Final Classification: **Historical Core** (Present without framing).
      *   *Mixed:* Final Classification: **Ambiguous** (Present, but avoid dogmatic internal monologue).
      *   *No:* Final Classification: **Theological Invention** (Frame as character perspective or rumor).

  ---

  ## Part 2: Conflict Resolution & Judgment Flags

  **Conflict Resolution Rule:**
  If **Step 1 (Attestation)** says "Yes" (everyone reports it) but **Step 3 (Friction)** says "No" (it serves theology/reduces tension), **Step 3 wins.**
  *Reasoning:* Widespread reporting can indicate a widespread legend. High friction indicates a detail too awkward to be invented.

  **Judgment Call Flags [JC]:**
  Be aware that the following steps rely on your interpretation, not objective data:
  *   **[JC]** in Step 2, Q3: Determining "theological purpose" requires you to interpret the evangelist's intent.
  *   **[JC]** in Step 3, Q6: Determining "conventionally pious" depends on your understanding of 1st-century Pharisaic vs. Roman norms.
  *   **[JC]** in Step 4: Defining the "Historical Core" is itself a scholarly hypothesis.

  ---

  ## Part 3: Application to Three Details

  ### Case 1: The Temple Action (The "Cleansing")
  *   **Step 1:** Attested in all 4 Gospels (+2). Fits 1st-century temple commerce context (+1). **Score: 3.**
  *   **Step 2:** Fulfills prophecy (Zech/Mal)? Debatable, but primarily acts as arrest trigger (-1). Embarrassing? It's a violent act leading to execution (+2). **Score: +1.**
  *   **Step 3 (Friction):**
      *   *Tension:* High. It provokes the authorities immediately. Serves no apologetic purpose for a church trying to be legally safe (+3).
      *   *Counterfactual:* A pious author would depict Jesus paying the tax or praying, not overturning tables. This survives the counterfactual (+3).
      *   **Score: 6.**
  *   **Step 4:** Coheres with execution by Rome as a disturber of peace.
  *   **Verdict:** **Historical Core.**
  *   **Author's Note Justification:** *Multiple independent attestation combined with high political friction suggests this event precipitated the arrest, regardless of theological interpretations added later.*

  ### Case 2: The Birth Narratives (Angels, Genealogies, Virgin Conception)
  *   **Step 1:** Absent in Mark and John. Only Matthew/Luke (who contradict each other on geography/details) (0). Genealogies differ (0). **Score: 0.**
  *   **Step 2:** Fulfills prophecy (Isaiah 7:14, Bethlehem) explicitly (-1). Embarrassing? No, it elevates status (0). **Score: -1.**
  *   **Step 3 (Friction):**
      *   *Tension:* The angelic announcements resolve the problem of Jesus' legitimacy; they do not create tension that lacks theological purpose (0).
      *   *Counterfactual:* If an author wanted Jesus to appear more conventionally pious, a miraculous birth is better than a normal one. It fails the counterfactual of "unthreatening/normal" (0).
      *   **Score: 0.** **[STOP]**
  *   **Verdict:** **Theological Invention.**
  *   **Author's Note Justification:** *These narratives appear late in the tradition, serve explicit prophetic fulfillment, and lack the narrative friction of the ministry accounts. Presented here as community tradition rather than objective fact.*
      *(Note: This is the required "Hard Truth" case. Despite being dramatically resonant, the protocol classifies it as invention.)*

  ### Case 3: The Cry of Dereliction ("My God, why have you forsaken me?")
  *   **Step 1:** Attested in Mark and Matthew (0). Absent in Luke/John (who replace it with triumphant words). **Score: 0.**
  *   **Step 2:** Fulfills Psalm 22? Possibly, but primarily creates a theological problem for the divinity of Christ (-1). Highly Embarrassing for early Christology (+2). **Score: +1.**
  *   **Step 3 (Friction):**
      *   *Tension:* Extreme. It suggests a rupture in the divine relationship. Serves no obvious apologetic purpose for a church claiming he is God (+3).
      *   *Counterfactual:* A pious author would write a prayer of trust (as Luke/John did). This detail survives the counterfactual of "conventionally pious" (+3).
      *   **Score: 6.**
  *   **Step 4:** Coheres with the reality of Roman execution as a place of despair.
  *   **Verdict:** **Historical Core.**
  *   **Author's Note Justification:** *This saying fails the "piety" test; later evangelists altered it to be more triumphant. Its awkwardness suggests it was retained because it was remembered, not because it was useful.*

  ---

  ## Part 4: Limitations Statement

  **What This Checklist Can Never Establish:**
  1.  **Ontological Truth:** This protocol cannot determine if Jesus was divine, if angels actually spoke, or if miracles occurred. It only measures *narrative plausibility within a historical-critical framework*.
  2.  **Exact Verbatim Accuracy:** Even if classified as "Historical Core," this does not guarantee the dialogue occurred exactly as recorded in Greek or Aramaic.
  3.  **Motivation:** It can suggest *that* an event happened, but not definitively *why* the historical Jesus intended it (e.g., was the Temple action symbolic judgment or practical reform?).

  **Usage for Editorial Deadlines:**
  When queried by an editor, cite the **Step Number** and **Friction Score**.
  *   *Example:* "I presented the Cry of Dereliction as fact because it scored 6/6 on the Friction Test (Step 3), passing the Criterion of Embarrassment."
  *   *Example:* "I framed the Nativity Angels as visionary experience because the detail scored 0 on Attestation and failed the Counterfactual Piety check."
