      *   *One "Invented" classification?* Yes (Birth Narrative).
      *   *Limitations stated?* Yes.
      *   *Author's Note justification?* Included in the output structure.

  11. **Final Polish:** Ensure the tone is supportive but rigorous. The user is a novelist, not a PhD candidate, so avoid jargon where possible, or define it quickly. Make sure the "Friction Test" is highlighted as requested. (Self-Correction: Make sure the Conflict Resolution rule explicitly handles the tension between "Everyone says it happened" vs. "It looks too theological.")

  12. **Final Output Structure:**
      *   Title.
      *   Time Estimate.
      *   The Protocol (Steps 1-4 + Scoring).
      *   Conflict Resolution & Flags.
      *   Application to Three Details.
      *   The "Hard Truth" Case (Birth Narrative).
      *   Limitations Statement.
      *   Author's Note Template.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Birth Narratives are fake." I need to show *how the procedure leads there*. The procedure must weigh the lack of Markan/Q attestation heavily against the dramatic utility.

  *(Refining the Friction Test)*: The prompt defines it specifically. I must use that definition verbatim or near-verbatim in the step. "Determine whether the detail generates narrative tension that serves no obvious theological or apologetic purpose for its source, and whether it survives a counterfactual in which the author sought to make Jesus appear more conventionally pious or politically unthreatening."

