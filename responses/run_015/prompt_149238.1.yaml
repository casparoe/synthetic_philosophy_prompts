  # Moral Diversity & Objectivity: A Sorting Exercise
  **Seminar Handout**

  **Instruction:** Please work through the following decision tree. Where written justification is required, kindly use British English spelling and convention (e.g., *colour*, *analyse*, *behaviour*).

  ---

  ## Part I: The Decision Tree

  Proceed through the four nodes below. Record your choice (A, B, or C) for each.

  ### Node 1: The Loyalty–Harm Trade-off
  *Cross-cultural data shows WEIRD societies prioritise harm prevention, whilst many non-WEIRD societies prioritise loyalty to the group, even at some cost to individual welfare.*

  *   **(1A)** These differences are **noise around a universal core**. (Everyone values both; culture merely adjusts the volume.)
  *   **(1B)** These represent **genuinely different moral weights**. (The fundamental hierarchy of values differs.)

  ### Node 2: The Status of Purity
  *Non-WEIRD groups often condemn acts based on purity/sanctity (e.g., dietary restrictions, ritual cleanliness) that WEIRD groups view as neutral.*

  *   **(2A)** These condemnations track **real moral wrongness**. (There is an objective fact about purity.)
  *   **(2B)** These track **culturally shaped disgust**. (There is no moral fact, only a psychological reaction.)

  ### Node 3: Moral Dumbfounding
  *When pressed for justification, subjects often maintain strong moral judgements without able reasons (e.g., harmless taboo violations).*

  *   **(3A)** This favours **hidden objective knowledge**. (Intuition accesses truths reason cannot yet articulate.)
  *   **(3B)** This favours **pure conditioning**. (Judgements are socialised habits without truth-value.)
  *   **(3C)** This favours **error theory**. (The judgements are assertoric but systematically false.)

  ### Node 4: The Ancestor Stress-Test
  *Imagine a society that consistently ranks breaking a promise to a dead ancestor above letting a starving child take food.*

  *   **(4A)** A universalist framework **can absorb** this ranking. (e.g., They have false factual beliefs about ancestors, but the moral structure is universal.)
  *   **(4B)** A universalist framework **cannot absorb** this without collapsing. (The ranking itself constitutes a different moral reality.)

  ---

  ## Part II: Instructor's Logic Map & Diagnostics

  *For seminar leaders: The following maps answer combinations to the five target positions. Note that 24 theoretical combinations exist (2 × 2 × 3 × 2); many converge on the same leaf, whilst others are diagnosed as incoherent.*

  ### The Five Leaves

  #### 1. Strong Universalism
  *   **Definition:** One true morality exists; cross-cultural differences are errors of fact or reasoning.
  *   **Primary Path:** 1A (Core) + 2B (Disgust) + 3A (Hidden Knowledge) + 4A (Absorbable).
  *   **Logic:** Variation is superficial (1A), purity is non-moral (2B), intuitions track truth (3A), and even extreme cases are explainable via non-moral facts (4A).
  *   **Other Combos:** 1A + 2B + 3B + 4A (if conditioning aligns with truth).

  #### 2. Weak Universalism (with Cultural Noise)
  *   **Definition:** Core principles exist, but the moral law under-specifies certain areas, allowing cultural variation without error.
  *   **Primary Path:** 1A (Core) + 2B (Disgust) + 3A (Hidden Knowledge) + 4B (Inabsorbable as error, but permissible as noise).
  *   **Logic:** Similar to Strong Universalism, but admits that some divergences (like Node 4) are not 'mistakes' but permissible variations within a universal framework.
  *   **Distinction:** Differs from Strong Universalism by refusing to label the Ancestor Case as 'wrong', only 'different'.

  #### 3. Relativism
  *   **Definition:** Moral truth is constituted by the cultural framework; no transcendent standpoint exists.
  *   **Primary Path:** 1B (Different Weights) + 2B (Disgust/Local Truth) + 3B (Conditioning) + 4B (Inabsorbable).
  *   **Logic:** Weights differ fundamentally (1B), psychology is local conditioning (3B), and universalism fails the stress test (4B).
  *   **Other Combos:** 1B + 2A (if purity truths are also local) + 3B + 4B.

  #### 4. Error Theory
  *   **Definition:** Moral judgements aim at truth but always fail; no moral facts exist.
  *   **Primary Path:** Any combination featuring **3C (Error Theory)**.
  *   **Logic:** If dumbfounding reveals systematic falsity (3C), the status of variation (1) or purity (2) becomes moot regarding *truth*, though relevant to sociology.
  *   **Note:** This overrides Node 4. If all judgements are false, the Ancestor Case is no more true than the WEIRD alternative.

  #### 5. Contextualist Objectivism
  *   **Definition:** Moral truths are objective but indexed to a framework (e.g., "Relative to Framework F, X is wrong").
  *   **Primary Path:** 1B (Different Weights) + 2A (Real Wrongness) + 3A (Hidden Knowledge) + 4B (Inabsorbable).
  *   **Logic:** Accepts fundamental difference in weights (1B) and real wrongness (2A), but maintains objectivity via indexing rather than abandoning truth (Relativism) or calling it error (Universalism).
  *   **Other Combos:** 1B + 2A + 3C is incoherent (cannot have real wrongness + error theory).

  ---

  ## Part III: Diagnostic Notes on Logical Space

  ### 1. Empty or Incoherent Combinations
  Several theoretical combinations collapse under scrutiny. These are useful for teaching logical consistency.

  *   **1A (Core) + 4B (Inabsorbable):** *Diagnosis: Tension.* If there is a universal core, why can it not absorb the Ancestor Case? This usually forces a move to **Weak Universalism** (redefining 'core' to be very thin) or **Contextualism**. If held rigidly, it is incoherent.
  *   **3C (Error Theory) + 2A (Real Wrongness):** *Diagnosis: Contradiction.* One cannot claim purity tracks real wrongness whilst simultaneously claiming all moral judgements are false. This combo is empty.
  *   **1B (Different Weights) + 3A (Hidden Objective Knowledge):** *Diagnosis: Requires Contextualism.* If weights differ objectively, knowledge must be indexed. If knowledge is not indexed, this combo collapses into Relativism (if truth varies) or Strong Universalism (if one weight is actually the 'hidden' true one).

  ### 2. Flag: Contextualist Objectivism vs. Weak Universalism & Relativism
  *Students often conflate these three. Use the following distinctions to clarify the leaf.*

  *   **Vs. Weak Universalism:** Weak Universalism claims the variation is **morally neutral** (the universe does not care). Contextualist Objectivism claims the variation is **morally significant but indexed** (it matters, but only relative to the framework).
      *   *Test:* In the Ancestor Case, does the Weak Universalist say "It doesn't matter"? Does the Contextualist say "It matters objectively *to them*"?
  *   **Vs. Relativism:** Relativism often implies **no cross-framework adjudication** is possible. Contextualist Objectivism maintains **objective truth conditions**, they just contain indexicals (like "here" or "now").
      *   *Test:* Can a Contextualist say "Their judgement is true"? Yes. Can a Relativist say "Their judgement is true" without adding "for them"? Usually no.
      *   *Seminar Note:* If the respondent cannot articulate how 'indexed objectivity' differs from 'relativism', they likely occupy the Relativism leaf but are using sophisticated vocabulary to obscure it.

  ### 3. The "Noise" Diagnosis
  *   Combinations landing on **Weak Universalism** often rely on Node 2B (Purity is disgust). If a respondent selects 2A (Purity is real wrongness) but lands on Weak Universalism, they must explain how conflicting 'real wrongness' claims do not violate non-contradiction. This is a fertile ground for seminar debate.

  ---

  **End of Exercise**
