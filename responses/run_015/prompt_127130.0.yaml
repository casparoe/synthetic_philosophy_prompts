prompt: |-
  hey so im a software engineer and ive been reading a bit about democracy stuff on the side, mostly because my roommate is in poli sci. we got into this argument about who actually belongs to the demos - like, who gets to be part of the group that decides things. there are these two views i keep seeing: one says its anyone who is subject to the states coercive power (so if the cops can arrest you, you should vote), and another says its anyone whose interests are affected by the decisions (so if a policy changes your life in a big way, you get a say even if youre not a citizen). can you compare these two ideas really carefully? i dont want the wikipedia version - i want to know where they actually diverge in practice, especially for weird edge cases like long-term expats who still pay taxes but live elsewhere, or people who live inside a country but are legally outside the system for some reason. also, heres a weird thought: both of these seem to assume the demos is like a container with a boundary you can draw, but what if its more like a network where belonging is graded or relational? im not asking you to solve that, but i want to know if either of the two standard views can even handle that idea without breaking. write this like youre explaining to someone who codes for a living and doesnt have a philosophy degree - so no jargon unless you explain it, and please dont just list readings at the end, i cant check them anyway.
