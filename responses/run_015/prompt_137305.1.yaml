answer: |-
  Here are three options for the line, ranging from self-protective to unsettling, all grounded in the indirect-duty view.

  **Option 1**
  > "I'm afraid I'm only kind to them out of self-preservation; I need to keep my capacity for sympathy intact for the humans."

  *   **The Mechanism:** This turns on the core of the indirect-duty view: moral treatment of animals is a hygiene practice for the human agent's soul, not a right of the animal.
  *   **Reader Reaction:** A lay reader hears a charmingly honest admission of selfishness; a Kantian reader recognizes the precise formulation of *duties regarding* animals versus *duties to* humans.
  *   **Foreshadowing:** It hints that his care for people is also transactional or functional ("capacity for sympathy") rather than emotional, suggesting he may withdraw that sympathy once he deems it unnecessary.

  **Option 2**
  > "Kant argued we may shoot a dog once it stops serving us, provided it doesn't damage our humanity; I keep rescues to ensure I never find out if I'd pass that test."

  *   **The Mechanism:** This references Kant's specific, notorious example of the old dog while pivoting to the agent's moral disposition (the "damage to humanity").
  *   **Reader Reaction:** A lay reader is shocked by the mention of shooting but charmed by his humility; a Kantian reader nods at the accurate citation of the *Lectures on Ethics* example without needing the title.
  *   **Foreshadowing:** It admits a genuine capacity for cruelty within him that is merely restrained by fear of self-damage, hinting that under pressure, the restraint might fail.

  **Option 3**
  > "It's not that the dog has rights, it's that I need the practice; I worry that if I stop treating animals like persons, I might start treating persons like things."

  *   **The Mechanism:** This highlights the "practice" aspect of the indirect duty—the idea that cruelty creates a habit of mind that violates the Categorical Imperative regarding rational beings.
  *   **Reader Reaction:** A lay reader sees a witty paradox; a Kantian reader identifies the underlying fear that violating imperfect duties erodes the disposition required for perfect duties.
  *   **Foreshadowing:** It suggests he views social interactions as "practice" or duty-fulfillment rather than genuine connection, and hints that he is prone to viewing people as "things" when he is tired or stressed.
