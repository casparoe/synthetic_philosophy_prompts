      *(Self-Correction)*: Wait, I should be more precise. The reasoning breaks down if one assumes "intrinsic intentionality" requires *phenomenal consciousness* (qualia). If intentionality is just about representation and function, the robot wins. If it requires "what it is like," the robot loses (currently). I need to introduce the Phenomenology vs. Representation distinction.

      *Revised Plan:*
