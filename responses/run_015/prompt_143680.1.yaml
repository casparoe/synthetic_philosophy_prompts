answer: |-
  **Podcast:** The Inquiry Room
  **Guest:** [Philosopher Name]
  **Topic:** Deweyan Experimentalism & Democratic Design
  **Duration:** 45 mins
  **Prep Notes:** Keep it moving. No bio fluff. Dive straight into the mechanics of the "Democratic Lab."

  **1. The Literal vs. Metaphorical Lab**
  You argue that democracy shouldn't just be *like* inquiry, but should literally instantiate Dewey's phases—problematic situation, hypothesis, testing. When you say "distributed laboratory," are you proposing new institutional hardware (like permanent citizens' assemblies with research budgets), or are you talking about a software layer for existing deliberation? Because if it's hardware, the barrier to entry seems massive; if it's software, how do you prevent it from becoming just another forum for shouting?

  **2. The Peer-Reviewer Problem (Expertise vs. Technocracy)**
  *Core Question:* If we treat citizens as peer-reviewers in this democratic lab, someone has to validate the data they're reviewing. In science, peer review relies on a shared methodological training. In politics, doesn't requiring an expert class to filter out manufactured data just to make the "experiment" viable recreate the technocracy Dewey wanted to avoid?
  *Follow-up/Probe:* I anticipate you'll say filtering is just part of good inquiry, not rule by experts. But if the experts define what counts as "noise" versus "signal," don't they effectively hold veto power over the public's hypotheses? How do we prevent the "epistemic controls" from becoming political gatekeeping?

  **3. Defining the "Problematic Situation"**
  *Core Question:* Dewey starts inquiry with a "problematic situation." In science, that's usually a broken prediction or an anomaly. In politics, though, conflicts are often about incompatible values, not just factual uncertainty. If we frame everything as a technical puzzle to be solved through inquiry, do we risk depoliticizing moral conflict? What counts as a *genuinely* problematic situation versus just a clash of ends?
  *Follow-up/Probe:* If you say inquiry can resolve value conflicts by reframing them, isn't that assuming all moral disagreement is actually just misinformation about consequences? That seems like a big leap.

  **4. Pluralism vs. Warranted Assertability**
  *Core Question:* There's a tension here between Dewey's pluralism and his idea of convergence on "warranted assertability." Science aims for a single best explanation eventually. Does democracy need shared answers to function, or is the goal just continuous problem-solving without consensus?
  *Follow-up/Probe:* If we don't converge on answers, does the "experiment" ever conclude? Or are we suggesting a state of permanent beta testing where policy is never truly settled?

  **5. The Attention Cycle Analogy (Niche/Odd)**
  *Core Question:* I want to dig into your claim that rotating cycles of public attention map onto Dewey's inquiry phases—that the news cycle isn't a bug but a feature of the testing phase. Is this a real structural isomorphism, or is it a stretched metaphor to make the 24-hour news cycle sound less pathological?
  *Follow-up/Probe:* Because Dewey's phases require sustained focus. If public attention rotates too fast, does the "testing" phase get aborted before data comes in? How do you slow the cycle down without killing engagement?

  **6. Misinformation as Epistemic Noise**
  You've described polarization and misinformation as epistemic failures—like broken controls in an experiment—rather than moral failures. But bad actors often *use* misinformation strategically to win. If the problem is broken controls, how do we fix the apparatus without relying on the very institutions (media, academia) that half the population already distrusts?

  **7. Power Asymmetries in the Lab**
  Dewey is sometimes criticized for assuming a community of inquirers with relatively equal standing. In a democratic lab, couldn't powerful actors hijack the "hypothesis formation" phase by flooding the zone with their own data? How does experimentalism account for power asymmetries that distort the inquiry before testing even begins?

  **8. Temporal Mismatch (Urgency vs. Inquiry)**
  Inquiry is slow; politics is often urgent. Climate change or pandemics don't wait for a full cycle of public deliberation and testing. How do you reconcile the slow tempo of experimentalism with the need for rapid decision-making? Do we need a "fast track" for emergencies, and if so, who decides when to use it?

  **9. Scale and Complexity**
  Does this model only work at the municipal level? Dewey loved local communities. But can a nation-state function as a single inquiry community? At what point does the complexity of the "experiment" exceed the cognitive bandwidth of the distributed peer reviewers?

  **10. The Verdict: Broken or Badly Designed?**
  *Closing:* To wrap up: Is democracy basically broken, or just badly designed? If you had to pick one repair priority based on this model—fixing the information flow, the institutional structure, or the civic education—where do we start the next experiment?
