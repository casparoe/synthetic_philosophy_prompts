      *   *Meaning:* It generally refers to viewing oneself as the protagonist of reality and others as supporting cast.
      *   *Literary Application:* In fiction, it can mean a protagonist who dominates the narrative so thoroughly that other characters lack agency or interiority.

  3.  **Address the "Real Term vs. Slang" Question:**
