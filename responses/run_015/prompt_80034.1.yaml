  5.  **Analyze the Three Dimensions (Life, Treatment of Others, Character Realism):**
      *   *Experience of Life:* Solipsism. We all feel like the main character of our own lives.
      *   *Treatment of Others:* Instrumentalization. Using people as tools for your plot.
