  2.  Kaelen picks it up.
  3.  Elara watches his face.
  4.  The Dialogue about "Badness."
  5.  The specific philosophical pivot: If it's not bad, why avoid injury?
  6.  The ending: The disk cools. The question remains hot.

  Let's write.

  *Focus on the "Badness":*
  Kaelen: "The fire is not cruel."
  Elara: "But it destroys."
  Kaelen: "Only if you cling."
  Elara: "If I don't care if it destroys, am I still me?"

  Okay, ready to draft.

  *(Final Polish Check)*: Ensure the distinction between *nociception* (signal) and *suffering* (affect) is clear in the prose without using medical terms. Use "the message" vs "the panic."

