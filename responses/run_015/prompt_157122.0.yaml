answer: |-
  The brazier sat in the center of the stone room, breathing a low, blue heat. There were no cushions, no icons, only the smooth grey floor and the iron fire. Kaelen stood beside it, his robes still, his hands open at his sides. Elara, ten years old and small for her age, sat cross-legged before him. She had been told this was the Day of the Clear Signal.

  Kaelen reached into the coals with a pair of tongs and withdrew a disk of copper. It glowed a dull, angry orange. He set it on the stone floor between them. The heat radiated in visible shimmers.

  "Watch my hand," Kaelen said. His voice was level, devoid of the hush usually reserved for holy things.

  He placed his palm upon the cooling disk.

  Elara flinched. Her own nerves fired in sympathy, a phantom recoil in her shoulder. She waited for the Master to pull away, for the hiss of breath, for the tightening of the jaw. She waited for the *no*.

  Kaelen did not move. He looked at his hand as one might look at a stranger's. He held it there for ten seconds, then twenty. The skin began to redden. The smell of searing protein rose, sharp and distinct.

  He lifted his hand. The palm was blistered, the skin tight and shiny. He turned the hand over, examining the damage with the mild curiosity of a scribe reading a text.

  "Did it burn?" Elara asked. Her voice trembled, though she tried to steady it.

  "Yes," Kaelen said. "Intensely. The heat was sharp, then throbbing. The location was precise, centered on the thenar eminence. The intensity peaked at seven, then settled to five."

  "Did it hurt?"

  Kaelen tilted his head. "Define *hurt*."

  "It felt... wrong. It wanted to stop. It screamed."

  "The signal screamed," Kaelen corrected gently. "I heard it. It was very loud. But I did not listen to the command."

  Elara looked at the blister, then at his face. His eyes were calm, dark pools reflecting the brazier. "But it damaged you. Look." She pointed to the red ruin of his palm. "That is bad. To be broken is bad."

  "To be broken is a change in state," Kaelen said. He began to wrap his hand in a linen strip. "The sensation told me the state was changing. That is all the sensation is. Information. The *badness* you speak of is the resistance to the change. It is the shout of the self saying, *I should not be this way.*"

  "But if you don't shout," Elara pressed, leaning forward, "how do you know to move? If I touch the fire, I pull back. That pull is... it's important. It keeps me safe."

  "Wisdom keeps you safe," Kaelen said. "Fear makes you clumsy. If you know the fire burns, you do not need to hate the fire to avoid it. You simply acknowledge the nature of the thing."

  "That's not true." Elara stood up. She was close to the brazier now, feeling the warmth on her shins. "If it isn't bad, then it doesn't matter. If the burning doesn't matter, then the wound doesn't matter. And if the wound doesn't matter..." She trailed off, searching for the shape of the thought. "Then *I* don't matter."

  Kaelen paused in his bandaging. "Why does the wound matter, Elara?"

  "Because it ruins the body. Because it stops you from working. Because... because it's suffering."

  "And if there is no suffering?" Kaelen asked. "If the signal is clear, but the suffering is absent. Is the wound still a tragedy?"

  "Yes," Elara said. "Because the body is yours. If you don't care when it breaks, you aren't keeping it. You're just renting it."

  Kaelen finished the knot and let his hand rest on his knee. "Consider a bell. When struck, it rings. If you hate the sound, you cover your ears and tremble. The sound is still the same frequency. The vibration is the same. But your experience is now doubled. There is the bell, and there is your war with the bell. We teach you to silence the war, not the bell."

  "But the war is what makes it real!" Elara's voice rose, echoing off the stone walls. "If I step on a thorn and I feel the sharpness but I don't care... am I not ignoring the thorn? If I don't care that it hurts, why should I care that it festers? You say the badness is the resistance. I say the badness is the truth. The pain tells us that we are vulnerable. That we are fragile. If you take that away, you take the reason to be kind."

  Kaelen looked at her, and for the first time, a shadow passed behind his eyes. Not pain, but perhaps recognition. "Kindness does not require panic, Elara. I can tend to this wound," he gestured to his bandaged hand, "because I understand the mechanics of healing. I do not need to weep to clean a cut."

  "You didn't weep because you didn't feel it was wrong," Elara insisted. "You felt the heat, but you didn't feel the *injury*. You separated them. But they are the same thing. The pain *is* the body saying *no*. If you silence the *no*, you are lying to yourself."

  "I am silencing the panic, not the *no*," Kaelen said. "The *no* remains. I will not touch the fire again. Not because I am afraid, but because it is inefficient to damage the vessel."

  "Efficient," Elara repeated. The word felt cold in the warm room. "So if someone else touched the fire... if someone burned them... you would not feel it was wrong? Only inefficient?"

  Kaelen was silent for a long moment. The brazier crackled. A spark flew up and died in the dark air.

  "I would feel their panic," Kaelen said softly. "And I would seek to end it. But I would not add my own panic to the pile. Two people screaming at the fire does not cool the flame."

  "But if the pain isn't bad," Elara whispered, "then why end their panic? If the sensation is just information, and the suffering is optional... then suffering is a choice. And if it's a choice, then the person burning is failing. You make them responsible for their own agony."

  Kaelen stood. He walked to the brazier and stirred the coals. The orange glow intensified.

  "There is the truth of the signal," he said, his back to her. "And there is the truth of the self. We train to separate them so the self does not drown in the signal. You argue that the drowning is the point. That the struggle proves we are alive."

  "I argue that the struggle proves we care," Elara said. "If you can be burned and stand still... you are like stone. And stone does not heal. It just erodes."

  Kaelen turned. His face was unreadable, the lines around his eyes deep. He held up his bandaged hand.

  "Tomorrow," he said, "you will place your hand on the disk. Not as long as I did. Just long enough to know the difference between the heat and the fear."

  "And if I find they are the same?" Elara asked.

  "Then you will have learned that you are not ready," Kaelen said. "Or you will have learned that I am wrong."

  "Which is it?"

  "That," Kaelen said, turning toward the door, "is the practice."

  He left the room. Elara remained alone with the brazier. She looked at the copper disk, now blackening as it cooled. She held her own hand over it, feeling the warmth seep into her palm. It felt pleasant. It felt safe.

  She moved her hand closer. The heat sharpened. It became a distinct point of pressure. It became a warning.

  She waited for the fear to rise, the instinctive command to *pull back*. It came, swift and hot in her chest. She watched it. She tried to imagine the heat without the command. She tried to imagine the fire as merely light, the burn as merely change.

  But as the heat grew, the *no* grew with it. A tightness in her throat. A demand for safety.

  Elara pulled her hand away. She looked at her unblemished palm. It was safe. It was whole. And it was trembling.

  She did not know if the trembling was the sign of her weakness, or the only proof that she was there to feel it at all. She sat in the cooling room, holding her hand in the air, waiting for the shaking to stop, or for the reason for it to become clear. Neither happened.
