answer: |-
  This is an exceptionally sharp set of questions. You have correctly identified the central tension in the critique of utilitarianism, and you are bumping up against one of the most debated topics in modern moral philosophy (meta-ethics and population ethics).

  Here is a breakdown of the issues you raised, correcting a few premises along the way and connecting the dots regarding Parfit and Prioritarianism.

  ### 1. Intrapersonal vs. Interpersonal Trade-offs
  **Your Question:** *If there is no super-subject, why is it okay to make tradeoffs across time for a single person (suffer now, benefit later) but not across persons?*

  **The Standard Response:**
  The justification usually isn't metaphysical; it's about **consent and coercion**.
  *   **Intrapersonal:** When you sacrifice now for later, the entity suffering and the entity benefiting are part of the same "life." In a liberal framework, you are presumed to have authority over your own life. You can "consent" to the pain (implicitly) because you reap the reward. There is no violation of autonomy because the boundary of the agent contains both the cost and the benefit.
  *   **Interpersonal:** When you sacrifice Person A for Person B, Person A does not consent to be a means for Person B's end. There is no mechanism to compensate Person A *within their own life* that balances the scales.

  **The Reductionist Challenge:**
  You are right to sense a wobble here. If Personal Identity is reductionist (I am just a series of psychological connections), the difference between "Me now vs. Me in 10 years" and "Me vs. You" is one of degree, not kind. If my psychological connection to my future self is weak (e.g., severe dementia), is it still okay to sacrifice "current me" for "dementia me"?
  *   **Rawls' Stance:** Rawls generally sidesteps the metaphysics. He treats persons as "moral persons" capable of a conception of the good. For political philosophy, the *social boundary* of the person is what matters, not the metaphysical glue holding their consciousness together over time.
  *   **The "Non-Reductionist" Accusation:** Critics (like Parfit) argue Rawls *does* rely on a "further fact" view of identity to make the intrapersonal/interpersonal distinction hold water. If you admit Reductionism, the force of the "separateness of persons" objection weakens significantly.

  ### 2. Does Rawls Rely on Non-Reductionism?
  **Your Hypothesis:** *Is Rawls secretly relying on a non-reductionist view of personal identity?*

  **The Verdict:** **Yes and No.**
  *   **No:** Rawls claims his theory is "political, not metaphysical." He argues we don't need to solve the metaphysics of identity to agree on justice. We just need to agree that society is a cooperation between free and equal citizens.
  *   **Yes:** Philosophically, the "Separateness of Persons" objection carries much more weight if you believe persons are distinct, enduring substances (Cartesian egos or Lockean souls). If persons are just bundles of experiences, the utilitarian calculation looks much more reasonable.
  *   **The Literature:** You mentioned that "nobody in the ethics literature actually connects those dots." **This is actually the central thesis of Derek Parfit's *Reasons and Persons* (Part III).** Parfit explicitly argues that if we accept Reductionism about personal identity, the "Separateness of Persons" objection to Utilitarianism loses its bite. He suggests that Rawls (and Nozick) rely on a view of identity that Parfit thinks is false. So, the dots *are* connected, but Parfit's conclusion is controversial. Many Kantians argue that even if Reductionism is true metaphysically, **Moral Separateness** remains true normatively. Just because I am a bundle of experiences doesn't mean you can use me as a resource.

  ### 3. Does this hit Average Utilitarianism?
  **Your Question:** *Does this objection hit average utilitarianism too, or does averaging fix it?*

  **The Verdict:** **It hits Average Utilitarianism just as hard.**
  *   **The Problem:** The "Separateness of Persons" objection is not about the *math* (Sum vs. Average); it is about the *structure of justification*.
  *   **Why:** Both Total and Average Utilitarianism allow for the sacrifice of one individual for the greater good of the collective.
      *   *Total:* Torture one to save a million.
      *   *Average:* Torture one if it raises the average welfare enough (e.g., removing a very unhappy person, or sacrificing a low-welfare person to boost the stats of the high-welfare majority).
  *   **The Objection:** Rawls' point is that **no one** should be sacrificed simply to maximize a social metric, whether that metric is a sum or an average. The "indivisible unit" aspect you mentioned doesn't save Average Utilitarianism because it still aggregates utility *across* those units. It still treats the society as a single container of value.

  ### 4. What about Prioritarianism?
  **Your Question:** *Is there a version of this that applies to prioritarianism, or is it immune?*

  **The Verdict:** **Prioritarianism is NOT immune.**
  *   **Definition:** Prioritarianism (associated with Parfit and Arnesen) says we should maximize welfare, but give extra weight to benefits for the worse off.
  *   **The Aggregation Problem:** Prioritarianism is still a **consequentialist aggregation view**. It does not have side-constraints (rights).
  *   **Scenario:** Imagine you can inflict moderate harm on a "middle class" person to give a massive, weighted benefit to the "worst off." Prioritarianism might endorse this.
  *   **Rawls' Critique:** Rawls' objection isn't just about *who* gets the utility; it's about the **inviolability** of the person. Rawls wants a system where certain liberties and claims cannot be overridden by social gains, even weighted ones. Prioritarianism softens the blow of Utilitarianism, but it does not respect the "separateness" in the sense of establishing rights that trump the aggregate good.
  *   **Exception:** Some argue Prioritarianism avoids the "Repugnant Conclusion" better than Utilitarianism, but regarding the *Separateness of Persons* (the right not to be used as a means), it fails the Rawlsian test because it still aggregates.

  ### 5. Summary of the "Parfit Connection"
  You felt like the literature ignores the link between Reductionism and the Separateness Objection. That is actually the specific niche Parfit carved out for himself.

  1.  **Rawls/Nozick:** Persons are separate. Aggregation is wrong. (Implicitly assumes strong personal identity).
  2.  **Parfit:** Personal identity is Reductionist (just psychological connectedness). Therefore, the difference between "intrapersonal" and "interpersonal" is less significant. Therefore, Utilitarianism is less objectionable than Rawls thought.
  3.  **The Counter-Response (Scanlon, Scheffler, Kamm):** Even if Parfit is right about metaphysics, he is wrong about morality. The *moral* boundary of the person is what matters for justice, not the *metaphysical* boundary. We have reasons to care about the distribution of goods across distinct lives, regardless of how "deep" those lives are metaphysically.

  ### Conclusion
  *   **Intrapersonal trade-offs** are justified by autonomy/consent within a life, not just metaphysical identity.
  *   **Rawls** tries to avoid metaphysics, but his argument is stronger if you assume non-reductionism.
  *   **Parfit** did connect these dots famously, arguing Reductionism helps Utilitarianism.
  *   **Average Utilitarianism** fails the objection just like Total Utilitarianism (it still aggregates).
  *   **Prioritarianism** also fails the objection (it still aggregates, just with weights).

  You are thinking at a very high level on this. The intuition that "Reductionism dissolves the Separateness Objection" is the exact argument that defines the last 40 years of population ethics and normative theory. You're in good company.
