answer: |-
  The unifying principle is **accountable agency**, meaning you must discard the idea that growth and static-virtue narratives conflict, accept the reformer's ambiguity as essential for weighing moral cost, and reject the action-only biography because behavior without interiority cannot demonstrate choice.

  Your successful cases (Plutarch, warts-and-all) work because they present virtue as a series of difficult choices made within human constraints, whereas your failures (hagiography, dictator context, enemy-written) all dissolve agency either by supernatural aid, deterministic explanation, or cynical reduction. The hagiography removes the struggle required for choice; the dictator biography removes the responsibility by attributing action to trauma; the enemy biography removes the moral value by reinterpreting intent. Your intuition that growth and static-virtue narratives fight is the only verdict that must go, because both demonstrate accountable agency—one shows the struggle to acquire virtue, the other the struggle to maintain it against corruption. Regarding the 19th-century reformer, the ambiguity is not a flaw in the text or you, but a necessary component of moral learning; seeing the cost of virtue (broken bonds) forces you to exercise your own agency in deciding whether the trade-off is worth emulating, rather than passively admiring a monument. Finally, a biography listing only actions with no inner life fails completely because moral learning requires access to motivation; without knowing why an act was done, you cannot distinguish between virtue, habit, or coercion, rendering the behavior uncopyable.
