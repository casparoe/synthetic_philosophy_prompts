prompt: |-
  I'm trying to figure out what I actually think about moral learning from biograpy, going by my gut on cases. Reading Plutarch's parallel lives — Cato's austerity set against a more indulgent Roman — feels like I'm doing practical reasoning on a grid, not just absorbing a story; that counts as real learning. A medieval hagiography where the saint never doubts and miracles fix everything gives me a warm feeling for an hour but doesn't shift my behavior; not real learning. A modern warts-and-all biography of a civil-rights organizer: seeing her grudges and broken friendships makes her courage feel copyable, where the polished version felt like a monument I couldn't approach — transparency helps. But then a biography of a cruel dictator that explains every atrocity through childhood trauma and context makes me understand him too well; I come away excusing things I shouldn't. That's negative learning, not neutral. I also think growth narratives teach well — seeing someone become good over time shows the path — but I also think static-virtue narratives teach well — seeing someone good from youth proves it's not just repair. Those two verdicts fight each other. And I keep goign back and forth on a 19th-century reformer who sacrificed every personal bond for one cause: heroic focus or monomaniacal warning? I can't tell if the ambiguity is in the life or in me. I'm half-tempted to say the key is "evaluative distance" — the biography has to force you to compare your own choices against the subject's in a structured way, not just identify or admire — but I'm not sure that survives the enemy-written biography case, where every good act gets a cynical explanation and there's plenty of structure but no moral gain. Is there a principle that saves most of my verdicts, and which ones have to go? What's its call on the reformer case, and on a biography that only lists actions with no inner life at all? Please lead with your bottom line in the first sentence, then the reasoning, with no preamble and don't restate the question.
