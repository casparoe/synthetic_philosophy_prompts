  3.  **Identify the Core Principle:**
      *   The common thread in the "successful" cases (Plutarch, Warts-and-All) is *agency within constraints*.
      *   Plutarch: Shows choices between competing goods/bads (austerity vs. indulgence).
      *   Warts-and-All: Shows virtue despite flaws (agency persists through imperfection).
