      *   **HoR Move 2:** Concedes *karoshi* is real. Argues it's a *corruption* of vocation into productivity. True calling includes rest. State limits = paternalistic (bureaucratic leisure vs. authentic integration).
      *   **LL Move 2:** Distinction lacks practical weight. If an idea generates deadly outcomes under power asymmetries, defending it as "corrupted" abandons workers. Without 35-hour week, no enforceable boundary against exploitation.

  3.  **Evaluate Move-by-Move:**

      *   **HoR Move 1:**
          *   *Strengths:* Historically nuanced. Weber's *Beruf* (calling) does imply a spiritual dimension, not just economic grind. Challenging the quantification of life is philosophically sound.
          *   *Weaknesses:* Idealistic. Ignores how "vocation" functions ideologically to suppress dissent. Assumes workers have the agency to define their own "calling."
          *   *Rating:* Partially Right (Philosophically strong, sociologically weak).

      *   **LL Move 1:**
          *   *Strengths:* Materialist focus. *Karoshi* is empirical evidence of harm. Focuses on power dynamics and enforceable rights.
          *   *Weaknesses:* Potentially reductive about the HoR's historical claim (though accurate about the *effect*).
