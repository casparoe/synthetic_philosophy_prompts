          3.  **Verbal vs. Substantive Dispute:** Identify if any part is merely verbal.
      *   **Constraints:** No bibliographies/citations. Neutral language (no caricatures). Self-contained conceptual distinctions.
      *   **Tone:** Academic, collaborative, precise, philosophical.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Binary-Constraint Deontologist (BCD):** Holds that certain actions are absolutely prohibited regardless of consequences. Constraints are side-constraints (Nozickian). They do not aggregate. The paradox is a feature, not a bug (or at least, the absolute nature is non-negotiable).
      *   **Structural-Threshold Deontologist (STD):** Holds that deontological constraints are robust but not necessarily absolute. They function as high thresholds. Below the threshold, they act like absolute bans. Above the threshold (catastrophe), the structure shifts or the constraint is overridden by the magnitude of harm, but *not* via simple consequentialist calculus. It's a structural shift, not a weighing.
      *   **The Paradox of Deontology:** Why is it permissible to let many die rather than kill one innocent person to save them? (Scheffler's formulation).
      *   **Shared Ground:** Both reject consequentialism (constraints aren't just weights). Both acknowledge the tension between agent-centered restrictions and outcome value.

  3.  **Drafting the Agreed-Claims Section:**
      *   *Claim 1 (Structure):* Needs to define constraints as side-constraints, not weights.
      *   *Claim 2 (Paradox):* Needs to state the tension: absolute constraint vs. minimizing overall violation/wrongness.
      *   *Claim 3 (Harm Distinctions):* Intended vs. Foreseen vs. Omission. This is crucial for the Doctrine of Double Effect (DDE) nuances often tied to these views.
      *   *Claim 4 (Anti-Consequentialism):* Both agree that dissolving the constraint into a cost destroys deontology.

      *Drafting thought:* Ensure the language doesn't bias toward BCD (who might say "absolute") or STD (who might say "threshold"). Use "function as" or "operate as."

  4.  **Drafting the Disagreements Table:**
      *   *Issue 1: Scaling Parameter.* Does the norm break or transform at a certain point?
          *   BCD: No scaling. It's binary.
          *   STD: Yes, structural transformation at a threshold.
      *   *Issue 2: Hierarchy of Constraints.* Does allowing catastrophe reveal a hierarchy?
          *   BCD: No, it reveals the priority of agency over outcome.
          *   STD: Yes, it reveals a meta-constraint against catastrophe.
      *   *Issue 3: Nature of the Paradox.* Feature of rationality or artifact of logic?
          *   BCD: Feature of moral reality (agent-relative reasons).
          *   STD: Artifact of applying binary logic to graded moral reasons.
      *   *Crux/Case:* Need a specific scenario. A "Trolley on a Bridge" variant or a "Terror Bomber" variant works well. Let's use a "Multi-Agent Rescue Scenario" as requested in the prompt.
          *   Scenario: 1 prohibited act (killing A) prevents $N$ deaths.
          *   BCD Verdict: Never kill A.
          *   STD Verdict: Kill A if $N$ exceeds Threshold $T$.

  5.  **Drafting the Verbal vs. Substantive Analysis:**
      *   Are they just saying the same thing differently?
      *   Likely substantive on the *action guidance* in extreme cases.
      *   Likely verbal on the *description* of the reason (e.g., "infinite weight" vs. "lexical priority").
      *   Need to identify where the grammar differs but the moral phenomenology might align (e.g., "honoring" vs. "respecting").

  6.  **Refining and Polishing:**
      *   *Check Tone:* Is it neutral? Avoid words like "rigid" for BCD or "compromised" for STD.
      *   *Check Constraints:* Did I cover all four agreed claims? Yes. Is the table formatted correctly? Yes. Is the verbal/substantive section included? Yes.
      *   *Check Specific Prompt Requirements:* "Structural-Threshold Deontologist," "Binary-Constraint Deontologist," "Paradox of Deontology," "Side-constraints," "Intended/Foreseen/Omission."
      *   *Self-Correction on "Threshold":* Ensure STD doesn't sound like a consequentialist. The threshold must be *structural*, not a simple sum of utility. It's a "catastrophe clause," not a "calculus."
      *   *Self-Correction on "Binary":* Ensure BCD doesn't sound irrational. Emphasize "agent-integrity" or "inviolability."

  7.  **Final Review against the Prompt:**
      *   Numbered agreed claims? Yes.
      *   Table with Issue, STD, BCD, Crux? Yes.
      *   Concrete case in Crux? Yes.
      *   Verbal vs. Substantive section? Yes.
      *   No citations? Yes.

  8.  **Final Polish:** (Mental check of the text for flow and clarity). The distinction between "transforming" (STD) and "breaking" (BCD view of STD) needs to be careful. BCD views STD as breaking the constraint; STD views it as the constraint having a built-in limit. I will phrase the BCD column to reflect their view of their *own* position, not their critique of STD, to maintain neutrality as per instructions ("worded so that its proponents would accept it as accurate").

