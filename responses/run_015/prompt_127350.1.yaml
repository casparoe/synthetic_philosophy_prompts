prompt: |-
  Draft the joint statement that a Structural-Threshold Deontologist and a Binary-Constraint Deontologist could both sign after a good-faith adversarial collaboration on the paradox of deontology. The agreed-claims section should be numbered and cover: the formal structure of deontological reasons (prohibitions that function as side-constraints rather than weights in a calculus); the precise formulation of the paradox, namely that in extreme cases an absolute constraint against performing a certain kind of wrong act appears to mandate permitting an outcome that contains far greater wrongness of the same or related kinds; the distinction between intended harm, foreseen harm, and harm permitted through omission; and the shared judgment that a straightforward consequentialist dissolution—treating the constraint as merely one cost among others—fails to preserve what is distinctive about deontological moral reasoning. Follow this with a disagreements table containing columns for the issue, the Structural-Threshold formulation (worded so that its proponents would accept it as accurate), the Binary-Constraint formulation (worded so that its proponents would accept it), and the crux. The table should address at least: whether deontological norms contain a hidden, non-aggregative scaling parameter that transforms rather than breaks when harm reaches a structurally defined magnitude; whether the permission of catastrophic harm to avoid a single prohibited act reveals a latent hierarchy among constraints; and whether the paradox is a genuine feature of moral rationality or an artifact of misapplying binary logic to graded reasons. For each crux, specify a concrete case or structural argument both sides agree bears on it—for example, a modified multi-agent rescue scenario with precisely defined casualty ranges in which violating one prohibition could prevent outcomes of geometrically increasing wrongness, together with an argument about the logical form of moral permission—plus each camp's predicted verdict or inference. Identify any portion of the dispute that is verbal rather than substantive, explaining which descriptions (e.g., "honoring the constraint" versus "respecting the reason") are equivalent across camps despite different surface grammar. Do not request bibliographies, reading lists, or citations; present all necessary conceptual distinctions within the prompt itself, and keep every formulation neutral enough that neither side could reject it as a caricature.
