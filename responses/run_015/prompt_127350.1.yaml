answer: |-
  # Joint Statement on the Paradox of Deontology

  **Signatories:** A Representative of Structural-Threshold Deontology (STD) and A Representative of Binary-Constraint Deontology (BCD)
  **Date:** October 26, 2023
  **Subject:** Findings from Adversarial Collaboration on Agent-Centered Restrictions

  ### I. Agreed Claims

  Following a period of adversarial collaboration, the undersigned parties affirm the following propositions as the shared foundation of our respective deontological frameworks:

  1.  **The Formal Structure of Deontological Reasons:** Deontological norms operate primarily as side-constraints on action rather than as weights within a maximization calculus. To treat a prohibition (e.g., against killing the innocent) as a negative value to be outweighed by sufficient positive value is to misunderstand the logical form of the constraint. The constraint functions to rule out certain modes of agency, not merely to register costs.
  2.  **The Formulation of the Paradox:** The paradox of deontology arises when an agent faces a choice between violating an agent-centered constraint (performing a prohibited act) and permitting an outcome that contains a significantly greater quantity of similar wrongs (e.g., allowing multiple deaths to avoid causing one). The tension lies in the intuition that morality requires the minimization of overall wrongness, while deontological reasoning appears to mandate permitting greater overall wrongness to preserve the integrity of the agent's own actions.
  3.  **Distinctions in Harm:** Moral evaluation requires precise differentiation between (a) harm intended as a means or end, (b) harm foreseen but unintended as a side-effect, and (c) harm permitted through omission where the agent has no direct causal agency in the threat's origin. Both parties agree that these distinctions are morally salient and that collapsing them undermines the explanatory power of deontological ethics.
  4.  **Rejection of Consequentialist Dissolution:** Both parties reject the dissolution of the paradox via straightforward consequentialism. Treating the constraint as merely one cost among others, which can be overridden whenever the aggregate good is sufficiently large, fails to preserve the distinctive feature of deontological moral reasoning: the inviolability of persons against being used merely as means, even for the sake of the general welfare.

  ### II. Areas of Disagreement

  While the parties share a common rejection of consequentialism, we diverge on the internal architecture of deontological norms and their behavior under extreme pressure. The following table delineates these disagreements.

  | Issue | Structural-Threshold Formulation (STD) | Binary-Constraint Formulation (BCD) | Crux: Case, Argument, and Verdicts |
  | :--- | :--- | :--- | :--- |
  | **1. Scalability of Norms** | Deontological norms contain a hidden, non-aggregative scaling parameter. The constraint remains absolute within a standard range but undergoes a structural transformation when harm reaches a defined magnitude of catastrophe. | Deontological norms are strictly binary. They do not scale, transform, or contain hidden parameters. A constraint is either applicable or it is not; its force does not vary with the magnitude of consequences. | **Case:** *The Geometric Rescue.* A single prohibited act (killing Innocent A) prevents a threat from killing $N$ innocents. $N$ increases geometrically (10, 100, 1,000, 1,000,000).<br>**Argument:** Does the logical form of permission change at $N=1,000,000$?<br>**STD Verdict:** At $N=1,000,000$, the structure shifts; killing A is permitted (not required) because the threshold of catastrophe is met.<br>**BCD Verdict:** At all $N$, killing A is prohibited. The logic of permission remains constant regardless of $N$. |
  | **2. Hierarchy of Constraints** | Permitting catastrophic harm to avoid a single prohibited act reveals a latent hierarchy among constraints. A meta-constraint against catastrophe overrides specific prohibitions against direct agency in extreme contexts. | Permitting catastrophic harm reveals no hierarchy among constraints, but rather the priority of agent-integrity over outcome-value. The prohibition remains paramount; the resulting catastrophe is a tragedy, not a moral violation by the agent. | **Case:** *The Multi-Agent Threat.* Five agents are each poised to kill 100 people unless the focal agent kills one innocent hostage. The focal agent's act is the only barrier.<br>**Argument:** Is the focal agent responsible for the 500 deaths if they refrain?<br>**STD Verdict:** The meta-constraint against 500 deaths creates a permission to violate the specific constraint against killing the hostage.<br>**BCD Verdict:** The focal agent is not responsible for the 500 deaths. Violating the constraint against killing the hostage makes the focal agent the sole author of a murder, which is impermissible. |
  | **3. Nature of the Paradox** | The paradox is an artifact of misapplying binary logic to graded moral reasons. Moral reasons have degrees of urgency; the "absolute" feel of constraints is a heuristic for high-priority reasons, not a logical absolute. | The paradox is a genuine feature of moral rationality. It reflects the distinctness of persons. Agent-relative reasons are not graded versions of agent-neutral reasons; they are categorically different in kind. | **Case:** *The Logical Form.* Analysis of the proposition "You must not kill" vs. "You must minimize killing."<br>**Argument:** Is the tension resolvable by refining the logic of reasons?<br>**STD Verdict:** Yes. By acknowledging a threshold, the tension dissolves into a complex but consistent hierarchy of graded reasons.<br>**BCD Verdict:** No. The tension is irreducible. It marks the boundary where moral rationality diverges from rational optimization. |

  ### III. Assessment of Verbal vs. Substantive Dispute

  Upon review, the collaboration identifies both substantive and verbal elements within our disagreement.

  **1. Substantive Disagreement:**
  The divergence regarding **action-guidance in catastrophic scenarios** is substantive. In the *Geometric Rescue* case where $N$ reaches extreme magnitudes (e.g., global extinction events), the STD prescribes a permission to act that the BCD explicitly forbids. This yields different real-world recommendations and different assessments of moral blameworthiness for the agent who kills the one to save the many. This is not a difference in terminology; it is a difference in prescribed conduct.

  **2. Verbal Disagreement:**
  A portion of the dispute regarding the **description of moral force** appears to be verbal.
  *   **BCD Description:** "The constraint has infinite weight."
  *   **STD Description:** "The constraint has lexical priority below the threshold of catastrophe."

  In all non-catastrophic, ordinary moral contexts, these descriptions yield identical practical inferences. Both camps agree that in standard cases, one cannot violate the constraint to prevent a marginal or moderate increase in overall good. The BCD describes this as the nature of the constraint itself; the STD describes it as the threshold not yet being met.
  *   **Equivalence:** The BCD phrase "honoring the constraint" and the STD phrase "respecting the reason's priority" are functionally equivalent in ordinary contexts. Both denote a refusal to trade off the prohibited act against aggregate value.
  *   **Surface Grammar:** The disagreement here stems from the BCD preferring ontological language (the rule *is* absolute) and the STD preferring functional language (the rule *operates* as absolute until conditions change). Where the threshold is not triggered, this grammatical difference does not map to a difference in moral phenomenology or judgment.

  **Conclusion:**
  The collaboration confirms that while both parties occupy the deontological space distinct from consequentialism, the boundary condition of "catastrophe" remains the decisive fault line. The BCD maintains that the paradox is the cost of maintaining the inviolability of persons, while the STD maintains that the paradox is resolved by recognizing that the inviolability of persons has a limit when personhood itself is threatened en masse.
