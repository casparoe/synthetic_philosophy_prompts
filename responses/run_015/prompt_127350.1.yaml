      *Verbal Dispute:* The prompt asks to identify *any* portion that is verbal. I should be careful not to dismiss the whole thing as verbal. The action-guidance is substantive. The metaphysical grounding might be verbal.

      *Let's write.*

  **(Self-Correction during drafting):** Make sure the "Crux" column explicitly mentions the "concrete case or structural argument" and "predicted verdict" as requested.

  **(Refining the Verbal/Substantive section):** The prompt asks to explain which descriptions are equivalent. I should highlight that "infinite weight" (BCD) and "lexical priority below threshold" (STD) might be functionally equivalent in non-extreme cases, making the dispute verbal *in ordinary contexts* but substantive *in extreme contexts*.

