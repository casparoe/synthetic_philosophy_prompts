      *   *Claim 4: EMH (Strong Form).* Prices reflect all information, public and private. Insider trading doesn't work (obviously false legally/empirically, but theoretically interesting).
      *   *Claim 5: The Grossman-Stiglitz Paradox / No-Trade Theorem.* If markets are perfectly efficient, no one has an incentive to gather information, so prices can't be efficient. Or, if beliefs are common knowledge, trade shouldn't happen.
      *   *Claim 6: The Zero-Sum Game (before costs) / Negative-Sum (after costs).* For every winner, there's a loser.

  3.  **Evaluate Each Claim:**

