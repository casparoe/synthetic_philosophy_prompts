      *   *Claim 2 (Weak EMH):* Generally true. *Applicability:* Irrelevant to user (they are doing fundamental/pharma research, not chart patterns).
      *   *Claim 3 (Semi-Strong EMH):* Contested. Prices reflect public info *quickly*, but not always *correctly* or *instantly*. *Applicability:* This is the core of the roommate's argument. If true, reading news is useless. But behavioral finance suggests over/underreactions happen.
