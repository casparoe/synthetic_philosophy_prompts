answer: |-
  You handled yourself well in that argument. Your intuition that "someone has to be trading on information for prices to reflect it" is not just common sense; it is a famous economic paradox (Grossman-Stiglitz) that you independently reconstructed. Your roommate was throwing slogans at you; you were asking for mechanisms.

  The phrase "you can't beat the market" is a semantic suitcase. It contains claims ranging from boring accounting truths to radical theoretical assertions that we know are false in practice.

  Here is the menu you asked for, ordered from **Empirical Truism** to **Theoretical Radicalism**, with a verdict on whether each claim actually supports your roommate's position.

  ---

  ### The Menu: What "You Can't Beat the Market" Actually Means

  #### 1. The Empirical Claim (The SPIVA Argument)
  *   **The Claim:** "Data shows that over 10-year periods, roughly 85-90% of active professional fund managers underperform their benchmark index after fees."
  *   **Is it True?** **Yes.** This is robust data (S&P Indices Versus Active). Professionals have better data, faster computers, and CFA charters, and they still mostly lose to a passive index.
  *   **Does it apply to you?** **Weakly.** This is an argument about *probabilities*, not *possibilities*. It means you are betting against heavy odds, not against the laws of physics. It suggests you *shouldn't* pick stocks, not that you *can't*. Furthermore, professionals are constrained by mandates, liquidity needs, and career risk (they can't go all-in on one pharma stock); you are not.
  *   **Verdict:** Good advice, bad proof. It warns of difficulty, not impossibility.

  #### 2. The Zero-Sum Claim (The Arithmetic Argument)
  *   **The Claim:** "Before costs, the market return is the average of all investors. After costs, the average investor must underperform the market. For you to win alpha, someone else must lose it."
  *   **Is it True?** **Yes.** This is mathematical identity. The market *is* the aggregate of all holders. You cannot collectively outperform yourselves.
  *   **Does it apply to you?** **Yes, but...** It implies that for you to beat the market, there must be a "loser" on the other side of your trade. In your pharma example, if you buy before a trial result, someone sold to you. If the trial succeeds, they lost out on gains; if it fails, you lost principal. The question is: *Are you smarter than the person on the other side?* The slogan doesn't answer that; it just says the game exists.
  *   **Verdict:** True, but doesn't prove you will lose. It just proves someone has to.

  #### 3. The Efficient Market Hypothesis (Semi-Strong Form)
  *   **The Claim:** "Asset prices reflect all publicly available information. By the time you read about the drug trial in the news, algorithms have already digested it and adjusted the price."
  *   **Is it True?** **Mostly, but with leaks.** Prices adjust incredibly fast to public news. However, "reflect" does not mean "perfectly value." Markets frequently overreact or underreact due to human psychology (behavioral finance). Prices are *right* on average, but can be *wrong* at any specific moment.
  *   **Does it apply to you?** **This is the core disagreement.** If this were perfectly true, your research is useless. But empirical anomalies (momentum, value effects, post-earnings drift) suggest prices are not perfectly efficient. In biotech specifically, information asymmetry is high; interpreting a clinical trial protocol requires expertise that the "market average" might not price perfectly instantly.
  *   **Verdict:** A strong warning, but not a wall. Markets are "efficient enough" to make it hard, not "efficient perfectly" to make it impossible.

  #### 4. The Grossman-Stiglitz Paradox (The "Price Baking" Argument)
  *   **The Claim:** "If prices perfectly reflected all information, no one would bother gathering information. But if no one gathers information, prices can't reflect information. Therefore, prices cannot be perfectly efficient."
  *   **Is it True?** **Yes.** This is the argument you accidentally made when you asked, *"Who is doing the price-baking if literally nobody can beat the market?"*
  *   **Does it apply to you?** **It actually supports YOU.** This paradox proves that there *must* be profit opportunities (alpha) available to some participants, or else the market would cease to function. The pros need the incentive of potential profit to do the work of making prices efficient. If you concede "no one can beat the market," you break the mechanism that makes the market efficient in the first place.
  *   **Verdict:** Your roommate used this logic to silence you, but the logic actually validates your existence as an informed trader.

  #### 5. The No-Trade Theorem (The "Semi-Mystical" Claim)
  *   **The Claim:** "If we are both rational, and I know you are rational, and we have common prior beliefs, then the mere fact that you want to sell to me signals you know something bad. Therefore, no speculative trade should ever happen."
  *   **Is it True?** **Theoretically, under strict assumptions.** This is the **Milgrom-Stokey No-Trade Theorem** (1982). It states that with common priors and rational expectations, speculative trade is impossible because any offer to trade reveals private information that kills the deal.
  *   **Does it apply to you?** **No.** This is the "vibes" argument. It relies on assumptions that are blatantly false in the real world:
      1.  **Common Priors:** Investors do not agree on the "background picture." You might believe the drug works; the seller might believe it fails. That disagreement is why you trade.
      2.  **Liquidity Needs:** People sell stocks not because they know bad news, but because they need cash for a house, a margin call, or rebalancing.
      3.  **Risk Tolerance:** Someone might sell simply because they are more risk-averse than you, not because they have better info.
  *   **Verdict:** **Pure Vibes.** Invoking this against a retail investor is intellectual cheating. It describes a frictionless vacuum that does not exist.

  ---

  ### The Verdict on the "Mystical Impossibility"

  You asked specifically about that last point—the idea that math proves trading is impossible.

  **It is just vibes.**

  Your roommate remembered the *name* of a theorem (likely No-Trade or related Rational Expectations models) but missed the *assumptions*. The No-Trade Theorem is a "frictionless sphere" model. It is useful for academics to understand the role of information, but it has zero predictive power over whether you can buy Pfizer stock.

  In the real world, trade happens constantly because:
  1.  **We disagree:** You think the probability of FDA approval is 60%; the market prices it at 50%.
  2.  **We have different needs:** You have a 10-year horizon; the seller has a 10-day horizon.
  3.  **We have different risk profiles:** You are willing to hold volatile biotech; they want bonds.

  If your roommate wants to use the "math says you're wrong" card, he has to prove you share identical priors and risk profiles with the person on the other side of the trade. He can't.

  ### How to Bring This to Him (Without Dunking)

  Since he's a good guy and you want to preserve the peace, you don't need to prove him wrong, just clarify the terms. You can frame it like this:

  > "I looked into that 'no-trade' thing you mentioned. It's called the Milgrom-Stokey Theorem. It's cool math, but it assumes we all agree on the basics and only trade on secret info. Since I'm trading on *opinion* and *risk tolerance*, not just secret info, the theorem doesn't apply.
  >
  > But you were right about the main point: The **Grossman-Stiglitz Paradox** shows that for the market to work, *someone* has to be able to profit from research. If I concede 'no one can beat the market,' the market breaks. So the reality is probably in the middle: It's really hard (you're right), but not impossible (I'm right), and the fact that pros exist proves there's alpha to be found."

  **The Defensible Version of His Point:**
  If he wants to be precise, his argument shouldn't be "You can't beat the market." It should be: **"After adjusting for risk and the value of your own time, the expected value of your stock picking is likely negative compared to a low-cost index fund."**

  That is a boring, statistical, humble claim. It's also probably true. But it's not a spell that forbids you from trying; it's just a warning that the house has an edge.

  **Summary for the Dinner Table:**
  1.  **Statistically:** He's right (it's hard).
  2.  **Theoretically:** You're right (someone must win for prices to work).
  3.  **Mathematically:** The "No-Trade" theorem is irrelevant to your situation.
  4.  **Friendship:** Agree that you're taking a calculated risk with money you can afford to lose, and acknowledge his advice comes from wanting you to be safe.
