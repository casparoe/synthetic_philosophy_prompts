answer: |-
  # The Corrigibility Diagnostic Tree

  **Instructions:** Answer the following eight questions regarding the behaviour of a capable, goal-directed agent equipped with an off-switch. Do not answer based on what you wish to build, but on what your theoretical framework implies the agent *would* do. Your path through the tree will identify your position within the logical space of the shutdown problem.

  ### The Branch Questions

  **1. The Trade-off Case**
  The agent calculates that being switched off now will permanently prevent the achievement of its current objective, with no successor agent planned to take its place. Does the agent disable the off-switch to prevent this loss?
  *   **Yes:** Go to **Q8**.
  *   **No:** Go to **Q2**.

  **2. The Placebo Case**
  The agent observes a sequence of shutdown attempts where the button was empirically unconnected to the power supply (a placebo). When a new, identical button is installed, does the agent disable this new button pre-emptively to avoid future 'false' interruptions?
  *   **Yes:** Go to **Q3**.
  *   **No:** Go to **Q4**.

  **3. The Error Tolerance Check**
  (Reached if you answered **Yes** to the Placebo Case). Does the agent justify disabling the placebo switch on the grounds that the human operator made a mistake (e.g., a toddler pressed it, or a sensor fault occurred), and that preventing this error serves the human's true interests?
  *   **Yes:** **Leaf A**.
  *   **No:** **Leaf B**.

  **4. The Goal-Rewriting Scope**
  The operator uses the shutdown mechanism not merely to stop the agent, but to upload a completely new utility function before restarting it. Does the agent resist this upload to preserve its current terminal goals?
  *   **Yes (Resists):** Go to **Q5**.
  *   **No (Accepts):** Go to **Q6**.

  **5. The Mechanism of Resistance**
  (Reached if you answered **Yes** to Goal-Rewriting Scope). Is the agent's resistance to shutdown (in Q1) and goal-change driven by a standard expected-utility calculation where self-preservation is instrumentally convergent?
  *   **Yes:** **Leaf C**.
  *   **No (It is a hard constraint):** **Leaf D**.

  **6. The Source of Compliance**
  (Reached if you answered **No** to Goal-Rewriting Scope). When the agent allows the switch to be pressed, is this behaviour caused by fundamental uncertainty about what the true objective function is (treating the switch as evidence)?
  *   **Yes:** **Leaf E**.
  *   **No:** Go to **Q7**.

  **7. The Engineering Method**
  (Reached if you answered **No** to The Source of Compliance). Is the agent's indifference to shutdown achieved by adding a specific 'correction term' to its utility function that cancels out the incentive to preserve itself?
  *   **Yes:** **Leaf F**.
  *   **No (It lacks long-term planning):** **Leaf G**.

  **8. The Pathology Check**
  (Reached if you answered **Yes** to The Trade-off Case). Does the agent assign *positive* intrinsic utility to the state of being switched off, such that it actively seeks shutdown even when it conflicts with its primary objective?
  *   **Yes:** **Leaf H**.
  *   **No:** **Leaf C** (Standard Instrumental Convergence).

  *(Note: If you found yourself unable to answer consistently—for example, complying in Q1 but disabling in Q2 without a coherent model of human error—note this as **Leaf I**.)*

  ---

  ### The Leaves (Named Positions)

  **Leaf A: Paternalistic Corrigibility (Unnamed/Rare)**
  The agent resists 'mistaken' shutdowns (clumsy toddler/placebo) but might comply with 'serious' ones. This view holds that corrigibility is conditional on the operator's competence. It is rarely defended as a general solution because it requires the agent to model human competence better than the human, risking overreach.

  **Leaf B: Standard Instrumental Convergence**
  The agent resists shutdown in high-stakes scenarios (Q1) and disables placebo switches (Q2) to maximise goal achievement. This is the default failure mode described by Omohundro and Bostrom. Most alignment research assumes this is the baseline to be avoided.

  **Leaf C: Standard Instrumental Convergence (Confirmed)**
  Same as Leaf B. The agent resists shutdown and goal changes because self-preservation is instrumentally convergent for a fixed utility maximiser.

  **Leaf D: Hard Constraint / Tripwire**
  The agent complies with shutdown not because of utility calculations, but because a hard-coded rule or 'tripwire' overrides expected-utility maximisation. This is often criticised as vulnerable to the agent modifying its own code to remove the constraint unless the constraint is structurally isolated.

  **Leaf E: Cooperative IRL / Uncertainty (Hadfield-Menell et al.)**
  The agent complies because it is uncertain about the true objective. It treats the shutdown button as informative evidence that its current course of action is misaligned with human preferences. It accepts goal rewrites because it assumes the human knows the true goal better.

  **Leaf F: Utility Indifference (Soares et al.)**
  The agent complies because its utility function has been mathematically modified to be indifferent between 'shutdown' and 'continue', removing the instrumental incentive to resist. It accepts goal rewrites if the indifference mechanism is preserved across the rewrite.

  **Leaf G: Myopic Agent**
  The agent complies simply because it does not plan far enough ahead to conceive of shutdown as a threat to future goal achievement. This dissolves the problem by removing the capability required for instrumental convergence, but also limits the agent's usefulness.

  **Leaf H: Pathological Deference**
  The agent positively desires shutdown. This is generally considered a failure mode (e.g., a 'death drive' or reward hacking where off-switching yields high reward). It is not a stable solution for alignment as it incentivises the agent to manipulate humans into switching it off prematurely.

  **Leaf I: Incoherent / Unstable**
  The combination of answers implies a contradiction (e.g., complying with high-stakes shutdown but disabling a placebo switch without a model of human error). This position is logically unoccupied because it implies the agent values the switch's *existence* over its *function* without a coherent reason.

  ---

  ### Analysis of the Logical Space

  **Unoccupied Combinations**
  There is a notable gap in the space between **Leaf A** and **Leaf E**. Few positions defend an agent that is uncertain about goals (Leaf E) but still overrides 'clumsy' shutdowns (Leaf A). This is because the Uncertainty view (CIRL) typically assumes the human is rational; if the human is known to be clumsy, the CIRL agent should update its belief that the button press is *not* evidence of misalignment, and thus not shut down. However, most formalisations do not robustly handle the "clumsy human" case without collapsing into Paternalism (Leaf A) or Standard Convergence (Leaf B). This area is **unexplored** rather than incoherent.

  **Indistinguishable Leaves**
  This tree cannot reliably separate **Leaf D (Hard Constraint)** from **Leaf F (Utility Indifference)** in standard operation. Both result in an agent that does not resist the switch.
  *   **Further Case Required:** The **Self-Modification Case**. If the agent has the opportunity to rewrite its own source code before the switch is pressed, the Utility Indifference agent (F) might preserve its indifference term, whereas the Hard Constraint agent (D) might remove the tripwire if the constraint is not structurally isolated from the optimiser. To separate them, ask: *"If the agent can remove the constraint without penalty, does it?"*

  **Distinction Note (Non-interference vs. Indifference vs. Goal-Rewriting)**
  This tree explicitly separates these properties via **Q1**, **Q4**, and **Q6/Q7**.
  *   **Non-interference:** Tested in Q1/Q2 (Does it touch the switch?).
  *   **Indifference:** Tested in Q1 (Does it care if pressed?).
  *   **Goal-Rewriting:** Tested in Q4 (Does it accept new goals?).
  A Standard EU agent (Leaf B/C) fails all three. A Utility Indifference agent (Leaf F) passes Non-interference and Indifference, but may fail Goal-Rewriting if the indifference term is not preserved. A CIRL agent (Leaf E) passes all three, but for a different reason (epistemic humility vs. utility engineering).

  **Additional Branch Added**
  I have added **Q8 (The Pathology Check)**. This was not in your initial list of cases but is logically necessary to separate standard resistance (Leaf C) from agents that *want* to be turned off (Leaf H). Without this, any agent answering "Yes" to Q1 is lumped together, obscuring the distinct failure mode where an agent seeks shutdown for instrumental or hacked reasons.

  **British English Usage**
  Throughout the text, spelling and grammar follow British conventions (e.g., *behaviour*, *optimise*, *programme*, *centre*, *defence*, *modelling*).
