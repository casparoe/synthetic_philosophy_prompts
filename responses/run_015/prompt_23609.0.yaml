answer: |-
  **Anchored in Actuality: Defending the Robustness of the Necessary A Posteriori Against the Baptismal Contingency Objection**

  The Kripkean revolution in the philosophy of language rests on a pillar that has become orthodoxy: the existence of necessary a posteriori truths. Paradigmatic examples are theoretical identities involving natural kinds, such as "Water is H2O." According to Saul Kripke and Hilary Putnam, because "water" and "H2O" are rigid designators—terms that refer to the same object in every possible world in which that object exists—and because they corefer in the actual world, their identity is metaphysically necessary. Yet, we know this identity only through empirical investigation, rendering it a posteriori.

  However, a persistent and sophisticated challenge threatens to destabilize this category. The challenge does not deny rigidity but targets the *grounds* of the reference. As you have noted, the reference of "water" is fixed by a contingent historical event: an initial baptism latching onto a specific sample. Had history gone differently (e.g., on Twin Earth), that baptism would have latched onto XYZ. If the truth of "Water is H2O" depends on a contingent reference-fixing event, can the resulting identity be genuinely necessary in a robust metaphysical sense? Or is it merely a "relative" necessity, anchored to the accidental facts of our linguistic history?

  This essay argues that the "Baptismal Contingency Objection" fails to undermine the robustness of the necessary a posteriori. While the objection correctly identifies a contingency in the *semantic mechanism* of reference fixation, it erroneously conflates the contingency of *proposition selection* with the contingency of *propositional content*. I will defend the view that metaphysical necessity is inherently indexed to the actual world's structure. Once the actual world fixes the semantic value of "water," the identity "Water is H2O" expresses a truth that holds across all possible worlds. The necessity is not weakened by the contingency of the baptism; rather, the contingency of the baptism explains the *a posteriori* character of the knowledge without impinging on the *metaphysical* status of the truth.

  ### The Kripkean Mechanism: Rigidity and Essence

  To evaluate the objection, we must first be precise about the Kripkean account. Kripke distinguishes between fixing the reference and giving the meaning. For a natural kind term like "water," the reference is fixed ostensively or causally: "This [liquid] is water." Crucially, this act does not associate the word with a descriptive sense (e.g., "the clear, drinkable liquid in lakes"). Instead, it establishes a causal-historical chain linking subsequent uses to the original sample.

  On this view, "water" is a rigid designator. It refers to whatever substance shares the same underlying nature (microstructure) as the original sample. In the actual world, that substance is H2O. When we evaluate the modal claim "Necessarily, water is H2O," we are not asking, "In every possible world, does the word 'water' refer to H2O?" That would be a contingent linguistic claim. Rather, we are asking, "Given that 'water' refers to H2O in the actual world, is there any possible world where H2O is not H2O?" Since identity is necessary (Leibniz's Law), the answer is no.

  The Kripkean defense against the baptismal worry is straightforward: modal evaluation is anchored to the actual world. We hold the reference fixed *as it is actually determined* and then vary the world. The fact that we *could have* used the sound "water" to refer to XYZ is irrelevant to the modal profile of the proposition actually expressed by English speakers on Earth. The proposition is singular (in the sense of Scott Soames), involving the kind *water* itself, not the concept or the word. Thus, the necessity flows from the essence of the kind, not the history of the word.

  ### The Objection: Anchored Necessity and Semantic Contingency

  The objection you have outlined presses harder on the metaphysical implications of this anchoring. Let us call this the "Semantic Contingency Argument." It runs as follows:

  1.  The truth of "Water is H2O" depends on the fact that the term "water" refers to H2O.
  2.  The fact that "water" refers to H2O depends on the contingent historical event of the reference-fixing baptism (and the contingent fact that we are on Earth, not Twin Earth).
  3.  If a truth $P$ depends on a contingent fact $C$, then $P$ is not metaphysically necessary in a robust sense.
  4.  Therefore, "Water is H2O" is not metaphysically necessary in a robust sense.

  Proponents of this line, often drawing from two-dimensional semantics (e.g., Chalmers, Jackson), argue that the necessity is merely "secondary" or "relative." They distinguish two intensions. The *primary intension* (considering the world as actual) captures the epistemic dimension: if we consider a world as actual where the clear liquid in lakes is XYZ, then "water" refers to XYZ, and "Water is H2O" is false. The *secondary intension* (considering the world as counterfactual) captures the metaphysical dimension: given our actual reference, "water" is H2O in all worlds.

  The objection claims that because the primary intension is contingent (the statement could be false if the world were different), the "necessity" of the secondary intension is shallow. It is a necessity purchased only by stipulating the actual world's accidental features. If the very identity of the subject term relies on a contingent historical chain, the resulting necessity looks like a artifact of our linguistic perspective rather than a deep feature of reality. It suggests that "Water is H2O" is necessary only *relative to our actual linguistic practices*, which seems to fall short of the unqualified metaphysical necessity traditionally associated with identity statements.

  ### Evaluation: Distinguishing Proposition Selection from Evaluation

  The Semantic Contingency Argument is compelling because it highlights the indexical nature of natural kind terms. However, it ultimately fails to dissolve the necessary a posteriori because it conflates the *context of utterance* with the *content of the proposition*.

  The core error lies in premise (3): "If a truth $P$ depends on a contingent fact $C$, then $P$ is not metaphysically necessary." This principle is plausible if $C$ is a constituent of the proposition $P$. But in the Kripkean picture, the contingent fact of the baptism is not part of the proposition expressed; it is part of the mechanism that *selects* which proposition is expressed.

  Consider an analogy involving indexicals. When I say, "I am here now," the proposition expressed depends contingently on where and when I am speaking. If I were in London, the proposition would be different. Yet, once I am in New York, the proposition *<David is in New York at t>* is contingently true. But consider a necessary truth involving an indexical: "If I exist, I am self-identical." The fact that *I* refer to David is contingent on my existence and the linguistic context. Does this make the necessity of "David is self-identical" fragile? No. The contingency lies in *who is speaking*, not in the *truth conditions of the proposition once expressed*.

  Similarly, the contingent baptism determines *which property* the term "water" picks out. It determines whether we are talking about the proposition <Water is H2O> or the proposition <Water is XYZ>. But once the actual world fixes the reference to H2O, the proposition is <H2O is H2O> (under the guise of "water"). The contingency of the baptism explains why we had to do empirical work to identify the proposition (the *a posteriori* element), but it does not render the proposition itself contingent.

  The objection assumes that for a necessity to be "robust," it must be independent of all contingent facts, including the facts that determine our linguistic access to the world. But this sets the bar for metaphysical necessity impossibly high. All human knowledge and assertion are anchored in the actual world. Metaphysical necessity is defined as truth in all possible worlds *given the actual world's facts*. To demand that the necessity of "Water is H2O" be independent of the actual world's chemistry is to demand that it be true even in worlds where water is XYZ. But that is not a demand for robust necessity; it is a demand for the statement to be true under a *different meaning*.

  The Two-Dimensionalist insight is correct that there is a sense in which "Water is H2O" is contingent: the *sentence* "Water is H2O" expresses different propositions in different contexts (Earth vs. Twin Earth). This is a semantic contingency. But metaphysical necessity is a property of *propositions*, not sentences. The proposition expressed by an Earthling uttering "Water is H2O" is necessary. The proposition expressed by a Twin-Earthling uttering "Water is H2O" is false (since for them, water is XYZ). The fact that the sentence is context-sensitive does not undermine the necessity of the proposition expressed in the actual context.

  ### The Stability of the Necessary A Posteriori

  Does this mean the category of the necessary a posteriori survives unscathed? Yes, but with a clarified understanding of its architecture. The "necessary a posteriori" is not a single, monolithic modal status but a conjunction of two distinct modal profiles:

  1.  **Epistemic Contingency (A Posteriori):** The reference-fixing description (e.g., "the stuff in the lakes") does not entail the microstructure. We can conceive of water not being H2O because we can conceive of the reference-fixing description being satisfied by something else. This explains why the truth is not knowable a priori.
  2.  **Metaphysical Necessity (Necessary):** Once the reference is fixed to the kind with microstructure H2O, the identity holds in virtue of the transworld identity of the kind.

  The Baptismal Contingency Objection attempts to collapse (1) into (2), arguing that the epistemic contingency infects the metaphysical necessity. But this infection only occurs if one adopts a descriptivist theory of content, where the reference-fixing description remains part of the proposition's truth conditions. Kripke's fundamental insight was to sever this link. The reference-fixing description fixes the *value*, but the value (the kind itself) is what enters the proposition.

  Therefore, the necessity is not "relative" in a way that diminishes its metaphysical weight. It is relative only in the trivial sense that all modal claims are evaluated from the actual world. To say "Water is H2O is necessary" is to say "Given that water is actually H2O, it is H2O in all worlds." The contingency of the baptism explains *why* we didn't know this a priori, but it does not change the *de re* modal profile of the substance.

  ### Conclusion

  The worry that the necessity of "Water is H2O" is undermined by the contingency of reference-fixing rests on a category mistake. It treats the historical conditions of *semantic access* as if they were truth-conditional constituents of the *proposition accessed*. While it is contingent that our term "water" latched onto H2O, it is not contingent that H2O is H2O. Since "water" rigidly designates H2O in our mouth, the statement asserts an identity between rigid designators.

  Consequently, the necessary a posteriori survives as a stable and genuine category of metaphysical necessity. It does not dissolve into a weaker, relative necessity, nor is it a confusion of epistemic and metaphysical modality. Rather, it is the precise intersection of them: the epistemic modality tracks the contingency of our reference-fixing descriptions (explaining the a posteriori status), while the metaphysical modality tracks the essential nature of the referent once fixed (explaining the necessity). The contingency of the baptism is the price of admission for the a posteriori, but it does not mortgage the necessity. The truth is anchored in actuality, but once anchored, it holds across the entirety of modal space.
