      *   *Also:* The user claims "no extra credit for copies" avoids the repugnant conclusion. I need to show it doesn't, or it creates a worse one. If unique lives add full value, then a huge population of unique +1 lives *still* outranks a small population of +100 lives if the numbers are big enough. 1 trillion unique +1s > 1 billion unique +100s. The diversity doesn't stop the math, it just delays it. The Repugnant Conclusion returns as long as the total sum wins. The user thinks diversity stops the discount, but if the discount is removed for diversity, the Total View logic applies fully again. I should point this out. If diverse lives add *full* value, then the Repugnant Conclusion is back for diverse populations.

