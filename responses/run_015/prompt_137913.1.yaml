      *   *Drafting - Paragraph 3:* The independence issue. Suppose I'm living a life at +5. Does my life's value drop if someone else is born on the other side of the galaxy living a similar +5 life? On your view, yes. My moral worth becomes contingent on facts I can't know and don't interact with. It makes the value of existence a cosmic lottery of uniqueness. The Total View is simple: if life is worth living, adding it is good. Your view makes adding a good life *bad* if it's too similar to existing ones, or at least less good. That implies we should prioritize strange, fringe lifestyles over common happy ones. Should we fund eccentric hobbies instead of curing malaria because malaria pain is "common"? That's the real repugnance.

