          *   *Selection:* The Suffering asymmetry is the strongest punch. If welfare is discounted by similarity, diswelfare must be too. That leads to absurdity. Also, the "retroactive value" issue is good.

      *   *Drafting - Paragraph 1:* Start with the numbers. You say a trillion lives at +1 are better if diverse. But why? If welfare is what matters, why does the *type* matter? Imagine two worlds. World A: 1 million people listening to Beethoven, each getting +10 utility. World B: 1 million people listening to different nursery rhymes, each getting +10 utility. Your view says B is better because variety. But from the inside, the people don't care about the variety elsewhere. They just care about their +10. You're smuggling in an aesthetic preference for the universe, not the welfare of the people.

