prompt: |-
  hey so i help run a small uni fund that gives away like 5k a term and we only get about an hour to decide, most of us arent philosophy people. we keep getting pascals mugging style pitches where the expected value looks huge cause of some tiny probablity of an enormous payoff but it feels off. can you turn the usual fixes people talk about — like capping payoffs, ignoring super tiny chances, judging by long-run policy not one bet — into a quick checklist we could actually run in 15 mins, with clear when to reject vs escalate to a longer debate and flagging where its just a judgement call? then try it out on two toy cases i made up: A) someone wants $400 to brute-force search for a mathematical proof that if found would supposedly let him create a vast number of happy simulated lives, chance of success is like one in two million, B) paying for a flood wall with about a 5% chance of preventing serious harm to a village. also show us one case where your checklist says something most of us would hate, and say what the checklist just cant settle.
reasoning: |-
  Here's a thinking process that leads to the suggested checklist and analysis:

  1.  **Analyze the Request:**
      *   **Context:** Small university fund, \$5k/term, 1 hour decision window, non-philosophers.
      *   **Problem:** "Pascal's Mugging" style pitches (tiny probability $\times$ huge payoff = huge EV) feel wrong but are hard to reject rigorously in the moment.
      *   **Task:** Create a 15-minute checklist based on standard philosophical/economic fixes (capping payoffs, ignoring tiny probs, policy-based reasoning).
      *   **Requirements:** Clear "Reject" vs. "Escalate" vs. "Judgement Call" flags.
      *   **Testing:** Apply to two toy cases (A: Math proof/simulated lives, B: Flood wall).
      *   **Critical Reflection:** Show one case where the checklist gives a counter-intuitive result (that people would hate) and identify what the checklist *can't* settle.

  2.  **Deconstruct "Pascal's Mugging" Fixes for a Practical Context:**
      *   *Philosophical Concept:* Bounded Utility (capping payoffs).
          *   *Practical Translation:* Does the claimed benefit exceed a reasonable maximum impact for this fund?
      *   *Philosophical Concept:* Probability Thresholds (ignoring tiny probs).
          *   *Practical Translation:* Is the evidence for the probability robust, or just a guess? Is it below a "actionable threshold"?
      *   *Philosophical Concept:* Policy/Rule Utilitarianism (long-run consistency).
          *   *Practical Translation:* If we said yes to this, would we have to say yes to 100 similar requests next term? Would that bankrupt us?
      *   *Philosophical Concept:* Epistemic Humility/Inside View vs. Outside View.
          *   *Practical Translation:* Who is making the claim? Do they have a track record? Is this a known mechanism or magic?

  3.  **Drafting the Checklist (Iterative Process):**
      *   *Goal:* 15 minutes max. Needs to be binary or simple scaling.
      *   *Step 1: The Sanity Check (Probability).* Is the probability based on data or a guess? If $< 1\%$ without hard data, red flag.
      *   *Step 2: The Cap (Utility).* Is the claimed good actually achievable with \$5k? If they claim "Save the World," that's usually a no for a uni fund.
      *   *Step 3: The Policy Test.* Can we afford to fund every pitch like this?
      *   *Step 4: Verification.* Can we verify the claim *before* paying?
      *   *Refinement:* Make it a scoring system or a flow chart. A flow chart is faster for a group. Let's do a "Three-Strike" rule.

      *   *Drafting the Rules:*
          1.  **Probability Floor:** If prob < 1% and based on speculation -> Reject.
          2.  **Impact Cap:** If claimed impact > 100x typical grant -> Reject (unless proven).
          3.  **Policy Consistency:** If funding this sets a precedent we can't sustain -> Reject.
          4.  **Evidence Standard:** Extraordinary claims need extraordinary evidence (within 1 hour).

      *   *Decision Logic:*
          *   Fail 2+ strikes = Reject.
          *   Pass all = Fund.
          *   Mixed/Unclear = Escalate (or Judgement Call).

  4.  **Developing the Toy Cases:**
      *   **Case A (Math/Sim Lives):** \$400, 1 in 2 million chance, huge payoff (simulated lives).
          *   *Analysis:* Classic Pascal's Mugging. Probability is tiny. Evidence is likely speculative. Impact is unbounded/unverifiable.
          *   *Checklist Result:* Should Reject.
      *   **Case B (Flood Wall):** 5% chance, prevent serious harm.
          *   *Analysis:* Probability is low but not astronomical. Impact is concrete (village safety). Evidence (engineering) is verifiable.
          *   *Checklist Result:* Should Escalate/Judgement Call (5% is low, but impact is real). Actually, for a \$5k fund, preventing "serious harm to a village" might be out of scope or the cost might be wrong. Let's assume the \$5k covers the wall. 5% is low, but it's not "1 in a billion." This tests the probability threshold.

  5.  **Developing the "Counter-Intuitive" Case:**
      *   Need a case where the checklist says "Fund" but intuition says "No," OR checklist says "Reject" but intuition says "Fund."
      *   *Idea:* A boring, high-probability, low-impact project that passes the checklist but feels like a waste compared to a moonshot.
      *   *Better Idea:* The "Policy Test" trap. If we reject a high-risk/high-reward project because we can't fund *all* of them, we might miss the one winner.
      *   *Selected Case:* "The Lottery Ticket." A project with a 10% chance of saving 100 lives (cost \$5k). EV is 10 lives. A project with 100% chance of saving 1 life (cost \$5k). EV is 1 life. The checklist might favor the 10% one based on EV, but risk-averse humans hate the 90% failure rate.
      *   *Wait, the prompt asks for a case where the checklist says something most would hate.*
      *   *Let's try:* A "Sure Thing" that violates the "Policy Consistency" rule. Example: Emergency aid. If we fund one emergency, we must fund all. Checklist says "Reject" (to avoid precedent), Humans say "Fund" (compassion).
      *   *Alternative:* The "Tiny Prob, Massive Good" that *passes* because the probability is just above the threshold (e.g., 2% instead of 0.0001%).
      *   *Let's go with the "Policy Trap":* A unique, one-off opportunity that looks like a Pascal's Mugging but is actually real. The checklist rejects it because "we can't fund everyone like this."

  6.  **Refining the Checklist for Speed (15 mins):**
      *   Make it a "Red Flag" system.
      *   1. **The "Magic Number" Test:** Is the probability < 1%? Is the impact > 1,000x normal?
      *   2. **The "Evidence" Test:** Can you verify the mechanism in 10 mins?
      *   3. **The "Clone" Test:** If 50 people asked for this, would we be broke?
      *   *Decision:* 2 Red Flags = Auto Reject. 1 Red Flag = Judgement. 0 Red Flags = Fund.

  7.  **Writing the Response:**
      *   **Tone:** Practical, direct, empathetic to the time crunch.
      *   **Structure:**
          1.  Intro (acknowledge the pain point).
          2.  The 15-Min "Anti-Mugging" Checklist (The Tool).
          3.  Decision Matrix (How to use the score).
          4.  Application to Case A & B.
          5.  The "Hateable" Outcome (The limitation).
          6.  The "Unsettled" Question (Philosophical residue).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 1% too arbitrary?
      *   *Fix:* Acknowledge it's a heuristic, not a law. It's about *evidence quality* not just the number.
      *   *Critique:* Case B (Flood Wall) 5% chance. Is that "tiny"?
      *   *Fix:* In engineering/risk, 5% is low but actionable. In Pascal's Mugging, "tiny" means "negligible." I need to distinguish "low probability" from "speculative probability."
      *   *Refinement:* Differentiate between *Known Risk* (5% flood chance based on data) vs. *Epistemic Uncertainty* (1 in 2 million based on a hunch). This is crucial.

  9.  **Final Polish:** Ensure the "Hateable Outcome" is clear. The checklist prioritizes sustainability over moonshots. This means rejecting the one-in-a-million cure that *might* work. Most people hate rejecting potential cures.

      *(Self-Correction on the "Hateable Outcome"):* Actually, a better "Hateable" outcome is when the checklist forces you to fund a "boring" project over a "sexy" one, or vice versa. Let's go with: The checklist forces you to **Reject** a high-risk project that *feels* morally urgent (like the flood wall) because of the "Policy/Clone" test. If the village floods every year, you can't fund them all. So you reject the first one. That feels cruel.

      *Wait, let's look at the prompt again:* "Show us one case where your checklist says something most of us would hate."
      Okay, I'll construct a case where the EV is clearly positive, but the checklist kills it due to the "Policy/Precedent" rule. This highlights the tension between Act Utilitarianism (this bet) and Rule Utilitarianism (policy).

  10. **Finalizing the Content:** (Proceed to generate output based on these thoughts).
answer: |-
  This is a classic resource allocation problem. You are fighting **Goodhart's Law**: once a measure (Expected Value) becomes a target, it ceases to be a good measure because people will game it with infinite claims.

  Since you have one hour and aren't ethicists, you need a **heuristic filter**, not a philosophical proof. The goal isn't to find the *truth*, but to avoid being *exploited* while remaining open to genuine high-impact opportunities.

  Here is a 15-minute **"Anti-Mugging" Checklist** designed for a committee setting.

  ### The 15-Minute "Anti-Mugging" Checklist

  Assign one person as the "Timekeeper." Spend 5 minutes per section.

  #### 1. The Evidence Floor (Probability Quality)
  *Don't just look at the number; look at the source.*
  *   **Green Flag:** Probability is based on historical data, engineering models, or peer-reviewed precedents (e.g., "5% flood risk based on 50-year weather data").
  *   **Red Flag:** Probability is based on theoretical speculation, personal conviction, or "unknown unknowns" (e.g., "1 in a million chance I discover a new physics principle").
  *   **The Rule:** If the probability is **<1%** AND the evidence is **speculative**, mark **1 Strike**.

  #### 2. The Impact Cap (Bounded Utility)
  *Your fund is \$5k. Claims should scale with the check size.*
  *   **Green Flag:** The outcome is proportional to the spend (e.g., "\$5k buys food for 50 families").
  *   **Red Flag:** The outcome is astronomically disproportionate to the spend (e.g., "\$400 creates a billion happy simulations").
  *   **The Rule:** If the claimed benefit is **>100x** the typical impact of your grants, mark **1 Strike**. (You are capping utility to prevent infinite leverage).

  #### 3. The "Clone" Test (Policy Consistency)
  *Imagine 50 students submit the exact same pitch next term.*
  *   **Green Flag:** If 50 people asked for this, you could fund them all (or the problem wouldn't scale that fast).
  *   **Red Flag:** If 50 people asked for this, you would be bankrupt, or the value would dilute to zero (e.g., "I need \$5k to be the *only* person researching X").
  *   **The Rule:** If funding this sets a precedent you **cannot sustain**, mark **1 Strike**.

  ---

  ### Decision Matrix

  *   **0 Strikes:** **FUND.** (Passes sanity checks).
  *   **1 Strike:** **JUDGEMENT CALL.** (Discuss for remaining time. Requires 2/3 majority vote).
  *   **2+ Strikes:** **AUTO REJECT.** (Do not debate. The math is likely gaming the system).

  ---

  ### Testing Your Toy Cases

  #### Case A: The Math/Sim Proof
  *   **Pitch:** \$400 for brute-force search. 1 in 2,000,000 chance. Payoff: Vast simulated lives.
  *   **Checklist:**
      1.  **Evidence:** Probability is speculative/theoretical. (<1% + Speculative) = **1 Strike**.
      2.  **Impact:** "Vast simulated lives" is astronomically disproportionate to \$400. (>100x cap) = **1 Strike**.
      3.  **Clone:** If 50 math students asked for \$400 to brute-force proofs, you'd fund them, but the "vast lives" claim relies on being the *one* winner.
  *   **Score:** **2 Strikes.**
  *   **Verdict:** **AUTO REJECT.**
  *   **Why:** This is the definition of a Pascal's Mugging. The utility is unbounded and the probability is unverified.

  #### Case B: The Flood Wall
  *   **Pitch:** \$5k for flood wall. 5% chance of preventing serious harm to a village.
  *   **Checklist:**
      1.  **Evidence:** 5% is low, but presumably based on hydrology/data, not a hunch. (Known Risk) = **0 Strikes**.
      2.  **Impact:** Preventing harm to a village is significant, but not "infinite." It fits the scale of a uni fund's moral ambition. = **0 Strikes**.
      3.  **Clone:** If 50 villages needed walls, you'd be broke. This is a scalability issue. = **1 Strike**.
  *   **Score:** **1 Strike.**
  *   **Verdict:** **JUDGEMENT CALL.**
  *   **Why:** It passes the evidence and impact caps, but fails the sustainability test. You need to vote: Is this a one-off emergency or a systemic duty?

  ---

  ### The "Hateable" Outcome (Where the Checklist Fails Intuition)

  Here is a case where the checklist tells you to do something that feels morally repugnant.

  **Case C: The Unique Cure**
  *   **Pitch:** A student has a unique, one-off opportunity to buy a rare reagent for \$5k.
  *   **Claim:** 10% chance (based on solid lab data) of curing a specific rare disease for **one person**.
  *   **Clone Test:** If 50 students came in with "10% chance to cure a rare disease for one person," you would run out of money immediately. You cannot make a policy of funding low-probability cures for individuals.
  *   **Checklist Score:** **1 Strike (Clone Test).**
  *   **Verdict:** **JUDGEMENT CALL / LIKELY REJECT.**

  **Why you will hate this:**
  The Expected Value is positive. The evidence is solid (not a mugging). The impact is saving a human life. But the checklist flags it because **you can't turn it into a policy.**
  Most humans feel a moral duty to save the life in front of them (Act Utilitarianism). The checklist forces you to think like an institution (Rule Utilitarianism). It prioritizes the *fund's survival* over the *single life*, which feels cold. The checklist cannot resolve the tension between **compassion for the individual** and **sustainability for the group.**

  ### What The Checklist Cannot Settle

  The checklist cannot solve **Risk Aversion vs. Risk Neutrality.**

  *   **Scenario:** You have \$5k.
      *   **Option 1:** Guarantee 10 people get \$500 worth of books. (Sure thing).
      *   **Option 2:** 1% chance to save 2,000 people from malaria. (EV = 20 people saved).
  *   **The Conflict:** Mathematically, Option 2 is 2x better. Emotionally, Option 2 means a 99% chance you do *nothing*.
  *   **The Limit:** The checklist treats these as "Judgement Calls." It filters out the *magic* (Pascal's Mugging), but it cannot tell you if you should be **bold** (high variance) or **safe** (low variance). That is a values question, not a logic puzzle. You have to vote on your fund's "personality."

  ### Summary for your Meeting
  1.  **Print the 3 Rules.**
  2.  **Apply Strikes.**
  3.  **If 2+ Strikes:** Stop talking, reject.
  4.  **If 1 Strike:** Vote, acknowledging you are breaking a policy rule.
  5.  **If 0 Strikes:** Fund, but check if you're just being too soft on the evidence.

  This saves you 45 minutes of debating magic math proofs and leaves you 15 minutes to actually decide on the real projects.
