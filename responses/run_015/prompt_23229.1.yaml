  9.  **Self-Correction during drafting:** I initially thought about focusing heavily on Verificationism. But the user didn't specify they are a verificationist, just that they find KP appealing. I should frame the defense of KP in terms of *modal stability* or *category errors* rather than strict Dummettian anti-realism, to make it broader. However, the link between KP and anti-realism is the strongest motivation for KP, so I must mention it. I will frame the restriction as preserving the *anti-realist motivation* without the *logical explosion*.

      *Wait, one nuance:* If I restrict KP to non-epistemic propositions, do I save the claim "All truths are knowable"? Technically, if epistemic propositions are truths, and KP doesn't apply to them, then "All truths are knowable" is false. I need to phrase this carefully. The claim becomes "All *basic* truths are knowable." Or, "The concept of truth relevant to KP is restricted." I should argue that the *philosophical weight* of KP rests on ordinary truths, so restricting the domain saves the *spirit* even if it technically modifies the universal quantifier.
