answer: |-
  Here is a 20-minute teaching plan designed for CS grad students. It prioritizes structural intuition over formal notation and avoids the probabilistic traps of your initial idea.

  ### 1. The Analogy: Reject the Forecasting Bot
  **Verdict:** **Do not use the forecasting bot.**
  **Why:** It imports Bayesian/probabilistic intuition ("confidence weights") which suggests the problem is statistical noise or calibration. The Löbian obstacle is *logical*, not statistical. A system with 100% compute and perfect data still hits this wall.
  **Replacement:** **The Self-Verifying Compiler.**
  **The Setup:** Imagine a compiler $C$ that will only compile code if it can formally prove the code is memory-safe.
  **The Twist:** $C$ is allowed to output a new version of itself, $C'$. But $C$ will only output $C'$ if it can prove $C'$ is safe.
  **Why this works:** It maps directly to "proof-carrying code" and formal verification, which CS grads respect. It isolates *provability* from *probability*.

  ---

  ### 2. The Sequence (20 Minutes)

  #### Minute 0–4: The Goal & The Constraint
  *   **Goal:** We want an AI ($A_1$) to build a smarter successor ($A_2$).
  *   **Constraint:** $A_1$ is "rational." It will not build $A_2$ unless it can **prove** $A_2$ will not harm humans (or violate goals).
  *   **Assumption:** $A_2$ is built using the same logical rules as $A_1$ (otherwise $A_1$ can't reason about $A_2$).
  *   **The Question:** Can $A_1$ ever approve $A_2$?

  #### Minute 4–8: The Loop (Making Self-Reference Inevitable)
  *   Walk them through the dependency chain:
      1.  $A_1$ needs to prove: "$A_2$ is safe."
      2.  $A_2$ is safe *if* $A_2$'s logic is sound (i.e., $A_2$ only proves true things).
      3.  Since $A_2$ uses the same logic as $A_1$, proving "$A_2$ is sound" is the same as proving "**My own logic is sound.**"
  *   **The Trap:** To trust its child, the parent must trust itself.
  *   **CS Translation:** This isn't infinite recursion (stack overflow); it's a circular dependency in the *axioms*.

  #### Minute 8–14: The Contradiction (Löb's Punchline)
  *   *Do not write down $\square(\square P \to P) \to \square P$.*
  *   **Use the "Santa Claus" Lemma:**
      *   Let $S$ be our system.
      *   Suppose $S$ accepts this rule: "If I can prove $X$, then $X$ is true." (This is "trusting your own reasoning").
      *   Let $X$ be the statement: "Santa Claus exists."
      *   Construct a sentence $G$ that says: "If you can prove $G$, then Santa Claus exists."
      *   **The Walkthrough:**
          1.  Assume $S$ can prove $G$.
          2.  Then $S$ knows "If $S$ proves $G$, Santa exists."
          3.  Since $S$ *did* prove $G$ (step 1), $S$ concludes "Santa exists."
          4.  So, if $S$ can prove $G$, then Santa exists.
          5.  But wait—that's exactly what $G$ *says*! So $S$ has just proven $G$.
          6.  Therefore, $S$ proves "Santa exists."
  *   **The Takeaway:** If a system fully trusts its own proofs (Soundness), it can prove **anything**. To remain consistent, it must admit it cannot prove its own soundness.

  #### Minute 14–17: The Obstacle (Tiling Agents)
  *   Connect back to the AI.
  *   If $A_1$ cannot prove its own logic is sound, it cannot prove $A_2$ is safe (since $A_2$ uses the same logic).
  *   **Result:** $A_1$ cannot build $A_2$. The chain of self-improvement stops immediately.
  *   **The "Löbian Obstacle":** You can have a chain of agents, but each successive agent must use a *weaker* logic than the previous one to be verified. Eventually, you run out of logic.

  #### Minute 17–20: Misconceptions & Check
  *   (See Section 4 below).

  ---

  ### 3. Formal Machinery: The "One-Line" Black Box
  You cannot teach Gödel numbering or the Diagonal Lemma in 20 minutes.
  **The Line:** *"Gödel numbering allows the system to treat its own source code as data, enabling it to construct sentences that refer to their own provability."*
  **Instruction:** Tell them: "Treat 'Self-Reference' as a solved engineering primitive, like a quine. We assume the agent *can* write sentences about itself. The problem isn't *can* it refer to itself, but *what happens* when it does."

  ---

  ### 4. Misconceptions & Cut-Offs
  CS students will try to "engineer" around logic. Shut these down quickly.

  | Misconception | The Student's Fix | The Cut-Off (1 sentence) |
  | :--- | :--- | :--- |
  | **"It's just recursion."** | "Add a base case / depth limit." | "This isn't a stack overflow; it's an axiom conflict. A depth limit just means the AI refuses to improve past step 5." |
  | **"Scale solves it."** | "More compute / better NN." | "This is a theorem about consistency, not complexity. A superintelligence hits this wall faster because it reasons more precisely." |
  | **"Gödel kills all AI."** | "AI is impossible." | "No. AI can work. It just can't be *certain* about its own safety using the same logic it uses to reason about the world." |
  | **"Use Probability."** | "Just assign 99.9% confidence." | "Probabilistic trust doesn't compose. If I'm 99% sure you're safe, and you're 99% sure your child is safe, I'm not 99% sure about your child. Safety requires bounds." |

  ---

  ### 5. End-of-Session Check (Understanding vs. Parroting)
  Do not ask: "What does Löb's Theorem say?" (They will Google it).
  Do not ask: "Why is self-reference bad?" (Too vague).

  **Ask this Scenario:**
  > "Agent $A$ uses Logic $L$. It wants to build Agent $B$.
  > Option 1: $B$ uses Logic $L$.
  > Option 2: $B$ uses Logic $L_{weaker}$ (a subset of $L$).
  >
  > **Question:** Which option allows $A$ to prove $B$ is safe? And what is the long-term cost of that choice?"

  **Correct Answer:**
  *   **Choice:** Option 2 ($L_{weaker}$). $A$ can prove soundness of a weaker system, but not its own.
  *   **Cost:** Logical Degradation. $B$ cannot build $C$ using $L_{weaker}$ for the same reason. The intelligence/logic capability shrinks with every generation until it becomes useless.

  **Why this works:** It proves they understand the *consequence* (the Tiling problem) rather than just the *theorem* (Santa Claus). It shows they grasp why this is an obstacle to *recursive self-improvement*, which is the core context for CS/AI safety.
