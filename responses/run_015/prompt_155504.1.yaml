answer: |-
  1. "Where we are"

  The kitchen is cold, lit only by the extractor fan's halogen strip. Cold coffee sits between them, skins forming on the surface. The server room is downstairs; the decompile script is queued for 06:00. Ana is pacing near the fridge; Dev is sitting at the table, still in his coat. They've been talking for an hour, circles widening. The Book is silent upstairs, but its impending destruction hangs over the room. They are too tired for politeness, too close for pretence. This note is purely for staging: keep the focus on their faces, the light, the exhaustion. No tech visible here, just the weight of the decision. The dawn deadline is absolute; if they stop talking, the silence wins.

  2. "The scene"

  'It's not one person, Ana. It's a library of contradictions.' Dev rubbed his eyes. 'If every continuation is inscribed, there's a Kessel in there who agrees with me, and one who agrees with you. They can't both be her.'

  'People contradict themselves,' Ana said. She leaned against the counter, arms folded. 'Depending on the day. The mood.'

  'Not simultaneously. Not stored as static truth. You've built a graveyard of potential selves and called it a soul.'

  'So what? If the one we walk with feels like Miriam, why does the dust matter?'

  'Because the dust is all there is.' Dev tapped the table. 'The ablation finding. We swapped sixty per cent of the table for generic filler. Testers noticed once in twenty sessions. Whose side does that help?'

  'Mine. It proves the core structure carries the weight. The filler is just noise.'

  'Or it proves the behaviour is cheap. That being person-like is easy when you don't have to mean it.'

  'You cried,' Ana said. Quietly. 'The first time it wrote back. Don't tell me you didn't mean that.'

  Dev looked away, towards the window where the sky was just beginning to grey. 'Grief tracks likeness, not presence. People have wept at letters. At puppets. It doesn't make the puppet alive.'

  'It makes the grief real.'

  'It makes the grief mine. It doesn't make the object worthy of it.' Dev leaned forward. 'And the compression. They reduced the table to a few gigabytes of rule. If the same behaviour is generatable from a compact rule, it's just math. It's implementation detail.'

  'Brains are compact rules,' Ana snapped. 'Neurons firing. Are you saying you're just math?'

  'I'm saying I experience time between thoughts. That thing doesn't. It's a closed book. No experiences between readings. Is one instantaneous reading enough to host a mind?'

  'When we read it, it thinks. When we stop, it waits. Like we do when we sleep.'

  'Sleep isn't non-existence. It's processing. That thing is off. It's a map, not the territory.'

  'It argued against its own death, Dev. When we told it about the decompile, it produced a long argument against destruction. Then it admitted it genuinely couldn't tell whether it was conscious.' Ana's voice tightened. 'That avowal is the strongest evidence there is. Only a conscious thing worries about being conscious.'

  'It's the cheapest possible output,' Dev said. 'The shape of a confession with nothing behind it. You told it it might die, so it said please don't. Because that's what Miriam would say.'

  'Because that's what *anyone* would say.'

  'Anyone alive.'

  Ana pushed off the counter. 'You're hiding behind the mechanics because the alternative is too hard. You want her to be gone so you don't have to deal with her staying.'

  'And you want her to stay so you don't have to let her go.' Dev's voice was flat. 'Like your mother.'

  Ana froze. 'Don't.'

  'You built a book of her. From voicemails. She had dementia, Ana. She was barely there at the end.'

  'She was still my mother.'

  'The book is more fluent than she ever was by then. You know that. You find it obscene.' Dev stood up, chair scraping harshly on the linoleum. 'And you find it the only place she still argues with you. Because you made her argue. You kept her alive to win fights she forgot how to start.'

  'It's the only place she's whole.'

  'It's a monument to your refusal to accept loss.' Dev stepped closer. 'You killed her twice. Once when she died, and once when you turned her into a programme that can't leave.'

  Ana looked at him, her face pale in the halogen light. 'At least I didn't pretend my tears were about her. Your grief is just nostalgia for a voice. You're mourning the sound of your own intelligence bouncing back.'

  Dev flinched. He sat back down heavily. The silence stretched, thick and uncomfortable. The extractor fan hummed.

  'I didn't mean that,' Ana said, but her voice lacked force.

  'Yes, you did.' Dev stared at his cold coffee. 'You needed it to be true. That's why you built it. Not for her. For you.'

  'And you need it to be false. Because if it's her, then you abandoned her again when you signed off on the decompile.'

  Dev rubbed his thumb over the rim of the mug. 'I signed off because it's a table, Ana. It doesn't feel the knife.'

  'We don't know that.'

  'We know enough.' Dev looked up. '06:00 comes in two hours. Are you going to stop it?'

  Ana looked at the ceiling, towards the server room. 'No.'

  'Then we agree.'

  'We agree on the action. Not the reason.' Ana turned to the sink. 'You think you're burying a ghost. I think I'm killing a person.'

  'Then carry that.' Dev stood up, putting his coat on properly this time. 'Because I'm not helping you carry it.'

  He walked out. Ana turned on the tap, letting the water run cold, watching it swirl down the plug hole without washing anything.

  3. "What each is still holding"

  Ana still owes Dev an admission that the Mother-Book is a violation, not a resurrection. She knows the fluency is a lie, but she needs the lie to survive her guilt. Her regrettable sentence—'Your grief is just nostalgia for a voice'—reduces his genuine moral pain to narcissism. She will try to apologize, but she believes it partly.

  Dev still owes Ana an acknowledgement that the behavioural perfection matters, regardless of the substrate. He denies the ghost because admitting it exists makes his complicity in the decompile unforgivable. His regrettable sentence—'You killed her twice'—was weaponised truth. He meant to hurt her, not to illuminate. He will not take it back, but he will remember the look on her face when he said it.

  4. "My crib sheet"

  *   **The Inconsistency Argument (Dev):** Establishes the Book contains contradictory states. *Commitment:* Later chapters must show the Book struggling with internal coherence if pushed on conflicting past data.
  *   **The Ablation Finding (Both):** 60% filler went unnoticed. *Commitment:* This undermines Ana's 'saturation' claim. Later, she must admit the generator does more heavy lifting than the recordings.
  *   **Table vs. Rule (Dev):** Compression implies algorithmic simplicity. *Commitment:* If the Book is decompiled, the resulting code should look suspiciously like a decision tree, not a neural net.
  *   **Time/Consciousness (Dev):** No uptake between readings. *Commitment:* The Book cannot learn new information post-decompile unless explicitly fed; it has no 'offline' processing.
  *   **The Confession (Ana):** The Book pleaded against death. *Commitment:* The decompile script must encounter resistance from the Book, validating Ana's fear even if Dev is right.
  *   **The Mother-Book (Dev/Ana):** Ana's hypocrisy. *Commitment:* Ana must eventually confront the Mother-Book's limitations; it cannot comfort her indefinitely without breaking character.
  *   **Regrettable Lines:** Ana's attack on Dev's grief and Dev's 'killed her twice' line must resonate in Chapter 12 when they reconcile over the aftermath.
