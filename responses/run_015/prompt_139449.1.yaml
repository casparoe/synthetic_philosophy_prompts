          *   Identify where two requirements pull against each other (trade-offs).
          *   Evaluate the user's own "chewing on" points (Three Clocks, Sharp Line, Adjective Test, Feedback Problem, Export Test).
          *   Identify which single requirement knocks out the most popular accounts.
