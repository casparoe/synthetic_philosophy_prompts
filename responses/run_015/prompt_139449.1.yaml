      *   Explanation: $Cohort = Period - Age$. Perfect collinearity. You need an external constraint to solve it. Most pop-theory just assumes the constraint without stating it.

  9.  **Refining the "Trade-off":**
      *   The user asked: "Tell me where two of the requirements pull against each other."
      *   Best candidate: **Predictive Specificity (Individual Utility)** vs. **Statistical Validity (Group Averages).**
      *   Or: **Reflexivity** vs. **Objectivity.**
      *   Let's go with **Internal Variance (Adjective Test)** vs. **Category Utility (The Purpose).** If you demand low variance (tight groups), you lose the ability to categorize anyone easily. If you demand high utility (broad groups), variance swamps the signal.
      *   Actually, the **APC Problem** vs. **Causal Mechanism** is strong. To solve APC, you often have to assume a mechanism, but if you assume the mechanism, you bias the APC solution.
      *   *Better Trade-off for this User:* **The "Specific Person" Goal vs. The "Statistical Reality" Requirement.** A theory can be statistically valid (generations exist as averages) but fail the user's requirement (useful for individuals). This is the crucial tension.

