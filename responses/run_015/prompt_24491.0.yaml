          1.  Accept EI (real wavefunction, unitary, branching).
          2.  Accept Deutsch-Wallace (DW) decision-theoretic Born rule.
          3.  QS looks like "nothing happens" (first-person survival).
          4.  Personal identity not preserved across branching (no fact of the matter which copy is "you").
          5.  Rational agent should *never* perform QS (expected disutility > gain).

  2.  **Initial Assessment of Claims:**
      *   (1) & (2) are standard Everettian orthodoxy (Wallace-style). They generally hang together well.
      *   (3) is the core of the "Quantum Immortality" intuition.
      *   (4) is a specific view on personal identity (Parfitian reductionism applied to branching).
      *   (5) is a normative claim about action based on the previous premises.

  3.  **Identify Potential Tensions:**

      *   **Tension A: (2) vs. (3) & (5).**
          *   (2) says use Born weights for decision theory.
          *   (3) says from 1st person perspective, you *always* survive (probability of survival = 1).
          *   (5) says don't do it because of expected disutility (implying Born weights matter for the *outcome* evaluation).
          *   *Conflict:* If (3) is true (I definitely survive), why does (2) matter for the *outcome* of survival? If I know I will experience survival, the Born weight of the death branch seems irrelevant to my *experience*, though relevant to my *caring measure*.
          *   *Refinement:* DW says act *as if* probabilities are Born weights. QS says subjective probability of survival is 1. This is the classic "Incoherence Problem" or "Probability Problem" in EI, though DW claims to solve it. The tension here is specifically about *self-locating uncertainty*. If I know branching happens, do I have uncertainty? DW says yes (pre-measurement). QS proponents say no (post-measurement selection effect).
          *   *Severity:* High. This strikes at the heart of probability in EI.

      *   **Tension B: (3) vs. (4).**
          *   (3) says "you can only find yourself in a branch in which you exist." This implies a continuity of "yourself."
          *   (4) says "Personal identity is not preserved... no fact of the matter which post-branching copy is 'you'."
          *   *Conflict:* (3) relies on a notion of "finding yourself" which suggests a persistent subject tracking through branches. (4) denies that persistence. If there is no "you" that persists, who is doing the "finding"?
          *   *Severity:* Medium-High. This is a metaphysical clash between phenomenological claim (3) and ontological claim (4).

      *   **Tension C: (4) vs. (5).**
          *   (5) says a rational agent shouldn't do it because of disutility to *you* (or the copies).
          *   (4) says the copies aren't strictly "you."
          *   *Conflict:* If they aren't "you," why do you care about their disutility enough to veto the experiment? (Parfitian response: you care about them *as much* as you care about future-you in a non-branching world).
          *   *Severity:* Low-Medium. Parfitian reductionism usually supports (5) rather than undermining it, provided the caring measure aligns with Born weights.

      *   **Tension D: (2) vs. (5).**
          *   (2) says weight by Born rule.
          *   (5) says expected disutility outweighs gain.
          *   *Conflict:* In QS, the "death" branch has high Born weight (usually). But in the "survival" branch (low weight), you suffer near-death trauma. If you *know* (3) that you will experience survival, the "death" branch disutility is zero *for you*. So the calculation in (5) only counts the survival branch disutility. But if the survival branch has low weight, why does it dominate the decision?
          *   *Wait, re-reading (5):* "expected disutility of the near-death experience in the branches in which you survive." This acknowledges you only experience survival. So the calculation is: (Weight of Survival) * (Disutility of Trauma) > (Gain).
          *   *But:* If (3) is true, the *subjective probability* of survival is 1. So why multiply by Weight of Survival?
          *   *Severity:* High. This is the crux of the DW vs. QS clash.

  4.  **Deep Dive into Specific Tensions:**

      *   **Tension 1: The Probability/Decision Clash (2 vs. 3 & 5).**
          *   *Issue:* DW (2) says act according to Born weights. QS intuition (3) says subjective probability of survival is 1. If subjective prob is 1, then Expected Utility = Utility(Survival). The weight of the death branch drops out of the *experiential* calculation. But (5) tries to use expected utility reasoning. If I know I won't experience death, why do I care about the weight of the death branch? DW says because it represents the *measure of existence* of my successors. But (3) suggests a first-person certainty that overrides this.
          *   *Verdict:* Genuine Tension. (3) undermines the uncertainty required for (2) to function as a guide for *self-locating* decisions in QS scenarios.
          *   *Resolution:* Either reject (3) (deny QS immunity) or qualify (2) (DW applies to pre-branching caring, not post-branching self-location).
          *   *Cheapest Revision:* Modify (3). Acknowledge that while you don't experience death, the *caring measure* for the dead successors matters. But (3) says "looks like nothing happens." That's phenomenological.
          *   *Better Revision:* Modify (5). If (3) is true, the risk isn't death, it's trauma. But if (2) is true, you should care about the *measure* of successors. The tension is between "I will experience survival" (certainty) and "I should weight by Born rule" (uncertainty/caring).
          *   *Actually, the standard Wallace response to QS:* Wallace rejects (3). He argues that pre-measurement, you are uncertain which branch you will be on. Post-measurement, there are two successors. One dies. One lives. The pre-measurement agent should care about both. The "I will survive" intuition is a confusion.
          *   *So:* (2) and (3) are in direct conflict in the Wallace framework. Wallace accepts (2) and rejects (3). The user accepts both.
          *   *Severity:* **Critical.**

      *   **Tension 2: The Identity/Phenomenology Clash (3 vs. 4).**
          *   *Issue:* (3) says "you can only find yourself." This implies a trans-branch identity tracker. (4) says "no fact of the matter which copy is you."
          *   *Verdict:* Genuine Tension. (3) presupposes a persistent "self" that gets filtered. (4) denies the persistence.
          *   *Resolution:* Adopt a Parfitian view explicitly in (3). "The successor who survives finds themselves alive." But the user says "you can only find yourself."
          *   *Severity:* **High.** It undermines the metaphysical grounding of the QS claim.

      *   **Tension 3: The Normative Clash (4 vs. 5).**
          *   *Issue:* If identity isn't preserved (4), why does the pre-branch agent care enough to forbid the experiment (5)?
          *   *Verdict:* Apparent Tension. Parfitian reductionism allows for "what matters" (psychological continuity) without strict identity. (5) can hold if "what matters" is distributed across branches weighted by Born rule.
          *   *Severity:* **Low.** Easily reconciled via Parfit.

  5.  **Drafting the Audit:**

      *   *Structure:*
          1.  Executive Summary (Overall coherence).
          2.  Tension 1 (Critical): DW Probabilities vs. QS Certainty (2 vs 3).
          3.  Tension 2 (High): Phenomenology vs. Identity (3 vs 4).
          4.  Tension 3 (Medium): Normativity vs. Identity (4 vs 5).
          5.  Recommendations/Revisions.

      *   *Refining Tension 1 (2 vs 3):*
          *   DW (2) relies on the idea that pre-branching agents face uncertainty (or act *as if* they do) regarding which outcome they will witness.
          *   QS (3) relies on the idea that pre-branching agents know with certainty they will witness survival.
          *   You cannot simultaneously hold that a rational agent weights branches by Born probabilities (implying non-zero weight on death matters for decision) AND that the agent knows they will certainly experience survival (implying death weight is experientially null).
          *   *Wallace's View:* He explicitly argues against Quantum Immortality. He says (3) is false. The pre-branch agent should anticipate *both* outcomes (in terms of caring), even if only one successor experiences life.
          *   *User's Position:* Trying to have cake (DW probabilities) and eat it (QS certainty).
          *   *Revision:* Drop (3) or qualify it heavily. Or drop (2) in QS contexts (but that breaks DW universality).
          *   *Cost:* Dropping (3) makes you align with Wallace but loses the "immortality" hook. Dropping (2) breaks the standard Everettian orthodoxy.

      *   *Refining Tension 2 (3 vs 4):*
          *   (3) uses "you" as a singular persistent entity. (4) denies this.
          *   If (4) is true, (3) should read "A successor with psychological continuity to the pre-branch agent will exist in the survival branch."
          *   *Revision:* Reword (3) to be compatible with (4).
          *   *Cost:* Weakens the rhetorical punch of QS.

      *   *Refining Tension 3 (5):*
          *   (5) is actually consistent with (2) + Parfitian (4), *provided* you reject (3)'s certainty. If you accept (3)'s certainty, (5)'s calculation changes (no risk of non-existence, only risk of trauma).
          *   *Revision:* Ensure (5)'s justification aligns with the chosen resolution of (2) vs (3).

  6.  **Finalizing the Advice:**
      *   The biggest problem is holding (2) and (3) together. Wallace (the main proponent of 2) explicitly rejects (3). Tegmark (who discusses QS) might accept (3) but usually doesn't lean on DW for the Born rule in the same way.
      *   The user is mixing Wallacean Decision Theory with Tegmarkian Immortality intuition. They are famously incompatible.
      *   *Severity Order:* (2)+(3) > (3)+(4) > (4)+(5).
      *   *Cheapest Revision:* Modify (3) to align with Wallace (deny subjective certainty of survival) OR Modify (2) to admit QS is a special case where decision theory breaks (high cost).
      *   *Actually, the "Cheapest" for an Everettian:* Keep (1), (2), (4), (5). Modify (3). Acknowledge that while the *surviving copy* experiences survival, the *pre-branch agent* should not expect *only* survival. This kills Quantum Immortality but saves Consistency.
      *   *Alternative:* Keep (1), (3), (4). Modify (2) and (5). Admit DW doesn't apply to self-locating belief in QS. (High cost to orthodoxy).
      *   *Best advice for a seminar:* Point out the tension between Wallace (2) and Immortality (3). Most professors will pounce on this.

  7.  **Review against Constraints:**
      *   Audit not lecture? Yes.
      *   Order by severity? Yes.
      *   Specific commitments to give? Yes.
      *   Cheapest revision + cost? Yes.

  8.  **Final Polish:** Ensure tone is analytical and helpful for a student preparing for a "poke at them" session. (Self-Correction: Make sure to clearly distinguish between *pre-branching expectation* and *post-branching experience*. That's where the confusion usually lies.)

      *   *Wait, one nuance:* Does DW allow for (3)? DW says pre-branching agents should act *as if* they have subjective probabilities. It doesn't necessarily dictate post-branching phenomenology. However, if I *know* EI is true, do I have self-locating uncertainty? Wallace says yes. QS proponents say no (because I know I won't be the dead one). This is the "Elga vs. Wallace" debate on self-locating uncertainty.
      *   Okay, I need to be precise here. The tension is between the *normative guidance* of (2) and the *phenomenological prediction* of (3). If (3) is true, (2) loses its grip in QS cases because the "probability" of death becomes 0 from the first-person view, violating the Born rule weighting.

      *   *Let's structure the response.*
      *   Introduction: Overall verdict (mostly coherent but one fatal flaw).
