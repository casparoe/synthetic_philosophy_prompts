      *   *Borges's Position:* The user is right. Borges is closer to *Co-actual Plenitude*. In "Garden," Ts'ui Pên's book *is* the labyrinth. It doesn't grow; it exists. In "The Aleph," all points are seen at once. In "New Refutation," he tries to disprove succession. The "popular many-worlds reading" often temporalizes what Borges spatializes.
