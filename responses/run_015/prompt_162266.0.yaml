  11. Final Review of the "Retroactive Collapse" category: This is the trickiest. It sounds like the "Garden" if read as a detective story where the solution fixes the crime. But in Borges, it's more about the reader creating the path. I should note that this category is the least Borgesian but useful for contrast.

