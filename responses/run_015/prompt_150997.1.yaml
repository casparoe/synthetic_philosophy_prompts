  The two views in plain english
  Lewis's Principal Principle says objective chances are real features of the world that rational beliefs must track. If you know the chance of an event is 50%, your credence should be 50%, provided you don't have "inadmissible" info (like knowing the future). It's a bridge between metaphysics and epistemology, demanding deference to external probabilities. The rival epistemic-subjectivist view denies chances exist independently. Instead, talk of "chance" is just shorthand for the credences an ideally informed agent would hold given the available evidence. There's no external constraint forcing belief to match reality; rather, calling something "chancy" just describes a specific epistemic stance under ignorance. So, while PP says "belief bows to chance," the rival says "chance is just refined belief." This distinction matters most when evidence gets tricky.

  The multivers twist
  Now imagine a multiverse where Domain X has a 70% decay rate and Domain Y has 30%. You know half the domains are X and half are Y, but you don't know which one you inhabit. PP says you should defer to the objective chance. But what is the chance? Is it the local law (unknown) or the global mixture? Strict PP suggests you can't defer to a local chance you don't know. If you defer to the mixture (50%), you're treating self-locating ignorance as admissible evidence about chance. Some argue PP blocks this: you should suspend judgment until you locate yourself, because deference requires knowing the specific chance function governing your situation. The principle might demand waiting for location data before setting credence, creating a paralysis where rational belief is impossible until you check your ID card. The rival view handles this smoothly. Since chances are just ideal credences, the "chance" of decay relative to your evidence is 50%. There's no gap between the objective setup and your belief. Your uncertainty about location constitutes the chance value. The rival view collapses the metaphysical gap: the mixture isn't a proxy for real chance; it is the only chance there is for you. PP struggles with whether the mixture counts as a legitimate object of deference, worrying that you're deferring to a weighted average of laws rather than a law itself. The rival view says the question is misplaced—your credence defines the chance here. For the subjectivist, the multiverse distribution just is the epistemic situation, so there's no tension between where you are and what you should believe. The friction only exists if you insist chances are out there waiting to be found.

  Settled vs genuinely contested
  Everyone agrees PP requires matching credence to known chance and that future knowledge is inadmissible. That's the core. What's live is whether self-locating ignorance counts as inadmissible information that blocks deference. Lewis originally framed admissibility around temporal information, not spatial or modal location. Applying PP to multiverses stretches his original intent. It's contested whether an agent can defer to a probability distribution over laws rather than a single law. Some say PP breaks here; others say it extends naturally. Also, note that treating the mixture as a "chance" function leans on a contested interpretation of admissibility, assuming global statistics are accessible enough for deference. The rival view avoids this by denying the metaphysical weight of laws, but that denial is itself the main contention. We aren't settled on whether location uncertainty is epistemic noise or a metaphysical blocker. My analysis here assumes PP requires a specific local law to defer to, which is a debated reading of how flexible the principle really is.

  Verdict
  PP hits a wall when laws vary across domains you can't identify. It forces a choice between suspending belief or deferring to a statistical proxy. The rival view dissolves the problem by making chance dependent on your evidence, including your lost location. It's smoother but costs you objective chance. If you want real laws, PP leaves you hanging in the multiverse. If you want actionable beliefs, the subjectivist view wins. Ultimately, the case exposes PP's reliance on knowing which game you're playing, while the rival view just cares about the odds you're facing.
