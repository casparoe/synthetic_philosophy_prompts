answer: |-
  ### The Filtering Process

  To build a theory of health that sustains Nietzsche's triple burden, we must first discard the obvious candidates. A purely biological definition fails the *normative-ideal* job (mere survival is not "great health"). A purely metaphorical definition fails the *regimen* job (you cannot diet on a metaphor). A purely retrospective definition fails the *regimen* job (you cannot act on a verdict delivered after death). A purely prospective definition fails the *criteriological* job (you cannot diagnose a philosophy by a feeling that might be deluded).

  We need a concept that is embodied enough to be affected by climate and food, but expansive enough to judge metaphysics. It must treat sickness as a threat to be managed, but also as a resource to be exploited. It must offer a rule for action now, while admitting the rule might only be validated later.

  Below are the five requirements that survive this cut. They are ordered from the most foundational (ontological) to the most practical (pragmatic).

  ### The Desiderata for a Nietzschean Theory of Health

  **1. The Psychophysiological Unity Requirement**
  *   **Motivation:** This addresses the **non-substitutability** constraint. If health were merely a state of mind or will, the specific injunctions about climate, digestion, and sleep in the regimen would be superfluous. If health were merely biological, the *criteriological* use (judging philosophies) would be a category error. The theory must posit that every spiritual judgment has a physiological cost and every physiological state has a spiritual consequence.
  *   **Status:** **Non-Negotiable.** Without this, the regimen collapses into Stoic mental training or generic medical advice.
  *   **Implication:** Health cannot be defined as the absence of physical symptoms, nor as the purity of rational thought. It must be a state of the whole organism.

  **2. The Typological Relativity Requirement**
  *   **Motivation:** This addresses the tension between **regimen** (first-personal) and **criteriological** (third-personal) uses. Nietzsche insists that what is healthy for one type is poison for another. However, to judge a doctrine as decadent, there must be a standard of type-fitness. A theory of health must allow for universal standards of *function* relative to specific *types*.
  *   **Status:** **Non-Negotiable.** Without this, the criteriological job fails (you cannot call Christianity decadent if health is purely idiosyncratic) or the regimen job fails (you cannot give advice if everything is relative).
  *   **Implication:** Health is not a single state everyone aims for, but the optimal functioning of a specific hierarchy of drives.

  **3. The Affective Proxy Requirement**
  *   **Motivation:** This addresses the **verdict/decision problem**. If health is only legible retrospectively (from the totality of a life), it cannot guide daily choices about food or work. The agent needs a signal *now* that correlates with the long-term verdict. The theory must posit a specific class of feelings (e.g., feelings of power, lightness, resistance overcome) that serve as a fallible but necessary proxy for the final health verdict.
  *   **Status:** **Non-Negotiable.** This is the only bridge between the prospective need of the regimen and the retrospective nature of biological outcomes.
  *   **Implication:** The theory must distinguish between "comfort" (which can be decadent) and "power" (which indicates health), providing a phenomenological marker for the agent.

  **4. The Assimilation Capacity Requirement**
  *   **Motivation:** This addresses the **normative-ideal** job ("Great Health"). Mere stability or homeostasis is insufficient for the ideal of growth. Health must be defined not as a static equilibrium, but as the capacity to incorporate new, potentially disruptive experiences (including errors and sickness) without disintegrating.
  *   **Status:** **Non-Negotiable.** This distinguishes Nietzschean health from conservative preservation.
  *   **Implication:** Health is a measure of range and resilience, not just a measure of current stability.

  **5. The Productive Resistance Requirement**
  *   **Motivation:** This addresses the **asymmetry between the epistemic and normative standing of illness**. Sickness provides insight (epistemic value) but is not the goal (normative disvalue). The theory must explain how physiological disturbance can deepen perspective without defining health *as* disturbance. It must posit that health is the *strength to endure and exploit* sickness, not the absence of it.
  *   **Status:** **Interpretive Taste (High Consensus).** Some readings prefer to view sickness as purely negative, but this fails to account for the epistemic privilege Nietzsche grants his own suffering.
  *   **Implication:** The theory must distinguish between *degenerative* sickness (which reduces the capacity to assimilate) and *stimulative* sickness (which challenges the organism to grow stronger).

  ***

  ### The Incompatibility Flag

  There is a severe tension between **Requirement 3 (Affective Proxy)** and **Requirement 2 (Typological Relativity)**.

  *   **The Conflict:** Requirement 3 demands that the agent trust their immediate feelings of power as a guide to health. Requirement 2 admits that agents are often mistaken about their own type (e.g., the decadent who feels strong in their decay). If the affective proxy is fallible, it cannot securely ground the regimen. If it is infallible, the retrospective verdict becomes redundant.
  *   **The Philosophical Cost:** To satisfy both, the theory must posit a mechanism of *educating* the affects. One cannot simply "feel" one's health immediately; one must learn to interpret the feelings correctly. This introduces a circularity: you need health to interpret the signs of health correctly. This suggests the regimen is not a set of rules, but an experimental practice where the rules are revised by the very feelings they produce. This is jointly satisfiable, but it makes the theory unstable and risky, which fits the text but troubles systematic philosophy.

  ***

  ### Scorecard of Candidate Readings

  Here is how three common interpretations of Nietzschean health fare against the five requirements above.

  | Requirement | **Reading A: Ascending Vitality** (Health = Quantity of Life-Force) | **Reading B: Political Multiplicity** (Health = Hierarchy of Drives) | **Reading C: Convalescent Resilience** (Health = Capacity to Recover) |
  | :--- | :--- | :--- | :--- |
  | **1. Psychophysiological Unity** | **Pass.** Treats body and spirit as expressions of the same force. | **Pass.** Drives are embodied; command is physiological. | **Pass.** Recovery is a bodily process with spiritual effects. |
  | **2. Typological Relativity** | **Fail.** "More vitality" implies a universal metric, struggling to explain why high vitality can be destructive or why different types need different things. | **Pass.** Explicitly allows for different orderings of command/obedience suitable to different types. | **Mixed.** Focuses on the process rather than the type, risking a universal ideal of "resilience." |
  | **3. Affective Proxy** | **Mixed.** "Feeling strong" is a good proxy, but often deluded in decadent types who feel powerful in domination. | **Pass.** The feeling of "commanding" provides a specific, distinguishable affective marker. | **Fail.** Recovery is often felt as relief or exhaustion, not necessarily power, making it a poor guide for daily regimen. |
  | **4. Assimilation Capacity** | **Fail.** Vitality can be rigid. A stone has high persistence but low assimilation. | **Pass.** A strong hierarchy can incorporate rebel drives without collapsing. | **Pass.** This is the core definition of this reading. |
  | **5. Productive Resistance** | **Fail.** Sickness is merely a reduction of vitality. It struggles to explain the *epistemic* gain of sickness without valuing the loss. | **Pass.** Internal conflict (resistance) is necessary for the hierarchy to strengthen itself. | **Pass.** Sickness is the prerequisite for the virtue of recovery. |

  **Summary of Performance:**
  *   **Reading A (Vitality)** collapses the distinction between health and mere force, failing the typological and resistance requirements.
  *   **Reading C (Resilience)** captures the sickness asymmetry best but fails to provide a prospective guide for the regimen (one cannot aim at recovery without first aiming at sickness).
  *   **Reading B (Multiplicity)** is the strongest candidate. It handles the internal politics of the body (regimen), allows for different constitutions (typology), and explains how conflict (sickness) can strengthen the command structure (resistance).

  ***

  ### The Eliminator

  The single requirement that eliminates the most candidates is **Requirement 3: The Affective Proxy Requirement**.

  Most theories of health can handle the retrospective definition (health is what worked) or the normative ideal (health is good). Very few can explain how an agent, in the moment, without a physician and without knowing the future, can distinguish between a feeling of *decadent relief* (e.g., the comfort of a dogma that numbs pain) and a feeling of *genuine health* (e.g., the lightness of a truth that demands more).

  Readings that define health as "Vitality" fail here because decadence often feels like power. Readings that define health as "Recovery" fail here because recovery feels like rest, which can be indistinguishable from exhaustion. Only a theory that posits a specific *structure* of feeling (like the political feeling of command over resistance) can satisfy the demand that health serve as a rule for acting now. If a theory cannot solve the proxy problem, it cannot support the regimen, and if it cannot support the regimen, it cannot be Nietzsche's concept.
