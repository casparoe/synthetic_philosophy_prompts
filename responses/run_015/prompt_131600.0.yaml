prompt: |-
  I am trying to settle an argument, not to learn what Ayn Rand wrote, so please skip citations, reading suggestions, and summaries of her corpus: I want the argument space mapped, and I want it mapped without anyone looking anything up.

  The argument was about effective altruism. My interlocutor reached for the title of Rand's 1964 collection, "The Virtue of Selfishness," and used it, in one breath, to two conclusions: first, that giving a large share of one's income to strangers is not merely optional but degrading, a self-sacrifice that a person of integrity would refuse; second, that a genuinely rational person would never make an anonymous gift, since an anonymous gift cannot come back to benefit the giver. He also leaned on the point that Rand glosses "selfishness" in her introduction as nothing more than concern with one's own interests, and on her definition of value as that which one acts to gain and/or keep.

  I am convinced the one-liner is sliding, and I want the slide made explicit. Please give me a menu of the distinct precise theses the slogan could be asserting, and grade each one. My own attempts, which I expect you to correct, split, and add to, are these:

  One: a purely verbal thesis. Selfishness is redefined so that any action flowing from what the agent values counts as selfish, in which case the slogan says almost nothing and cannot reach either conclusion.
  Two: an objective-standard thesis. "Interests" are not whatever the agent happens to want but what serves her life as the kind of being she is, so the slogan has real content, but only if the account of a person's objective interests does independent work.
  Three: a jurisdictional thesis. What is wrong with altruism is not the cost to the agent or the benefit to others but the location of the normative trigger: the agent acts on another's need rather than on her own judgment of value. This may have no behavioral content at all, so that a kidney donation and a refusal to donate could each be virtuous or vicious depending on their source.
  Four: an anti-fixed-pie or harmony thesis: value is created rather than transferred, so benefit to another at cost to self is never the net gain it appears to be, and altruistic codes systematically destroy value.
  Five: an epistemic thesiss: others' needs are not transparent to me, whereas my own interests are, so an altruistic code is a systematically error-prone decision rule.
  Six: an empirical psychological thesis about what altruistic motivation does to character, to dependents, and to the giver's own capacity for sustained action.
  Seven: a narrow scope thesis: no positive duty to serve others, gifts permitted as luxuries, i.e. a denial of obligation rather than a denial of permissibility or admirability.

  For every reading, tell me: how to state it precisely; whether it is a definitional maneuver, a platitude, a substantive and defensible thesis, a substantive but contested one, or false; what would count as refuting it; whether Rand or a defender of the slogan is actually committed to it or whether it is an extrapolation; and, most importantly, whether it licenses the first conclusion, the second, both, or neither. Note where the readings differ along the axes that I think are doing the hidden work: the extension of "selfishness," the kind of normative status being claimed (permissible, praiseworthy, obligatory, admirable), and the direction of the contrast (altruism is not obligatory, versus never permissible, versus never admirable).

  Two things I cannot work out and particularly want addressed. First, over what interval are interests summed? Rand's own framework must permit forgoing present goods for long-range ones, so the self whose interests matter is a life and not a time slice; say what that does to the bite against altruism. Second, if the content of the virtue is just concern with one's own interests, and if the standard is indexed to a living organism's survival, what principle internal to the view stops the boundary of the self at the skin, so that the interests of those I love cannot be counted as mine? If no such principle can be given, say what happens to my interlocutor's two conclusions.

  Finally: tell me which reading he must have meant, and if no reading both survives scrutiny and supports what he said, say so plainly and tell me which suppressed premise is actually carrying the weight.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Settle an argument about Effective Altruism (EA) vs. Ayn Rand's "The Virtue of Selfishness."
      *   **Constraint:** No citations, reading suggestions, or summaries of Rand's corpus. Map the *argument space* without looking anything up (rely on internal knowledge of Objectivist ethics and philosophical analysis).
      *   **Task:** Evaluate the user's seven proposed theses (plus add/correct/split), grade them, and analyze their logical connection to the interlocutor's two conclusions.
      *   **Specific Questions to Address:**
          1.  Time interval of interests (life vs. time-slice).
          2.  Boundary of the self (skin vs. loved ones).
          3.  Identify which reading the interlocutor *must* have meant, or if the argument fails, identify the suppressed premise.
      *   **Tone:** Analytical, precise, philosophical, direct. No fluff.

  2.  **Deconstruct the Interlocutor's Argument:**
      *   **Premise:** Rand's "The Virtue of Selfishness."
      *   **Conclusion 1:** Giving large income to strangers is degrading/self-sacrificial (integrity refusal).
      *   **Conclusion 2:** Rational people never give anonymously (no benefit returns to giver).
      *   **Key Definitions Used:** Selfishness = concern with one's own interests; Value = that which one acts to gain/keep.

  3.  **Evaluate the User's Seven Theses:**

      *   *Thesis One (Verbal/Definitional):* "Selfishness" = acting on what one values.
          *   *Analysis:* If true, EA is selfish if the agent values it. This kills the interlocutor's argument.
          *   *Grade:* Definitional maneuver/Platitude. Doesn't support conclusions.
      *   *Thesis Two (Objective Standard):* "Interests" = objective life-serving values, not whims.
          *   *Analysis:* This is the core Objectivist move. It allows criticizing EA *if* EA doesn't serve life.
          *   *Grade:* Substantive/Contested. Supports Conclusion 1 *if* EA is proven life-negative. Doesn't necessarily support Conclusion 2 (reputation might not be the only return).
      *   *Thesis Three (Jurisdictional/Source):* Wrongness is acting on *others' needs* vs. *own judgment*.
          *   *Analysis:* This is about moral authority. If I give because *they need*, it's bad. If I give because *I value their survival*, it's okay.
          *   *Grade:* Substantive. Supports Conclusion 1 (if EA is need-based). Undermines Conclusion 2 (anonymity doesn't prove source of judgment).
      *   *Thesis Four (Harmony/Non-Zero-Sum):* Value is created, not transferred. Sacrifice is illusory or destructive.
          *   *Analysis:* Metaphysical/Economic claim.
          *   *Grade:* Substantive/Contested. Supports Conclusion 1 (sacrifice is net negative). Weak on Conclusion 2.
      *   *Thesis Five (Epistemic):* I know my needs, not others'.
          *   *Analysis:* Hayekian knowledge problem applied to ethics.
          *   *Grade:* Empirical/Contested. Supports caution, not blanket prohibition.
      *   *Thesis Six (Psychological):* Altruism ruins character/dependency.
          *   *Analysis:* Consequentialist claim about virtue ethics.
          *   *Grade:* Empirical. Supports Conclusion 1 (degrading).
      *   *Thesis Seven (Narrow Scope/Duty):* No duty to serve, but permissible.
          *   *Analysis:* This contradicts the interlocutor who calls it *degrading* (impermissible/vicious).
          *   *Grade:* Defensible Randian position, but contradicts interlocutor's strong claim.

  4.  **Address the Two "Stuck" Points:**
      *   *Time Interval:* Rand's ethics is life-based ("man's life qua man"). Short-term sacrifice for long-term gain is rational. This weakens the attack on EA *if* EA is framed as long-term species survival or psychological satisfaction. However, Rand distinguishes *investment* from *sacrifice*. If the return is uncertain or non-existent, it's sacrifice.
      *   *Boundary of Self:* Rand allows valuing others *for your own sake*. Loved ones are extensions of self-interest because their happiness causes yours. Strangers are different. The "skin" boundary is porous for loved ones, impermeable for strangers/duty. If this boundary fails, Conclusion 1 collapses (giving to strangers could be self-interested).

  5.  **Synthesize and Grade:**
      *   Need to map each thesis against the two conclusions.
      *   Need to identify the "Slide." The slide is usually between "Selfishness = Rational Self-Interest" (Thesis 2) and "Selfishness = Immediate Tangible Return" (Interlocutor's Conclusion 2).
      *   The interlocutor's Conclusion 2 (no anonymous gifts) is actually *anti-Randian* in a subtle way. Rand values integrity and independence. If I give anonymously because *I* value the cause and don't want social credit, that is selfish (in her sense). The interlocutor argues anonymity is irrational because no *external* return comes. This implies a transactional view Rand might reject (value is internal/psychological too).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the constraint (no citations, map argument space).
      *   *The Menu:* Go through the 7 theses + additions.
          *   For each: Precision, Classification (Platitude/Substantive/etc.), Refutation conditions, Rand's commitment, Licensing of Conclusions 1 & 2.
      *   *The Two Stuck Points:*
          *   Time: Life-span vs. Moment. Sacrifice is trading a greater value for a lesser. EA often trades certain present value for uncertain future/abstract value. Rand would call this irrational *if* the future value isn't concretely tied to the agent's life.
          *   Boundary: "For your own sake." Loved ones = selfish. Strangers = duty (altruism). The principle is *why* you value them. If the interlocutor can't distinguish, his argument fails.
      *   *The Verdict:* Which reading did he mean?
          *   He likely mixed Thesis 2 (Objective Standard) with a crude Transactional View (Thesis 2 corrupted).
          *   Conclusion 1 relies on Thesis 2 + Thesis 6 (Psychological damage).
          *   Conclusion 2 relies on a crude Transactional View (Value = External Return) which is actually *inconsistent* with Rand's deeper metaphysics (Value = Internal Psychological State).
          *   *Suppressed Premise:* "Value must be externally reciprocated to be rational." This is the weak link.

  7.  **Refining the "Slide":**
      *   The slide is from "Rational Self-Interest" (broad, psychological, long-term) to "Immediate Reciprocity" (narrow, transactional).
      *   The interlocutor uses Rand's *definition* of selfishness (Thesis 2) to block the *label* of altruism, but uses a *transactional* definition of value to block *anonymity*. These are in tension.

  8.  **Final Review against Constraints:**
      *   Did I cite books? No.
      *   Did I suggest reading? No.
      *   Did I summarize the corpus? No.
      *   Did I map the argument space? Yes.
      *   Did I address the specific questions? Yes.

      *(Self-Correction during drafting)*: Be careful not to defend Rand, but to defend the *coherence* of the positions. The user wants to know if the interlocutor is using Rand correctly to support *his* conclusions.
      *   *Crucial Point:* Rand explicitly argues against "whim-worship." So Thesis 1 is out.
      *   *Crucial Point:* Rand argues against "sacrifice" (giving up a greater value for a lesser). EA often demands giving up a greater personal value for a "greater good." Rand rejects the "greater good" metric.
      *   *Crucial Point on Anonymity:* Rand values recognition of achievement, but charity isn't necessarily "achievement" in her sense. However, if the giver values the *feeling* of generosity, anonymity is fine. The interlocutor's claim that anonymity is *irrational* is the weakest link.

      *Let's structure the grading clearly.*
      *   Classification: Definitional, Platitude, Substantive/Defensible, Substantive/Contested, False.
      *   Licensing: C1 (Giving is degrading), C2 (Anonymity is irrational).

      *Refining the "Boundary of Self" answer:* The principle is *causal connection to one's own happiness*. If a stranger's survival does not causally impact my happiness (except through guilt, which Rand says we shouldn't feel), it's outside the boundary. If the interlocutor admits loved ones count, he admits the boundary isn't skin. He must argue *causal distance*, not physical distance.

      *Final Verdict:* The interlocutor is smuggling in a crude psychological egoism (we only do what feels good immediately) disguised as Objectivist rational egoism.

      *(Final Polish)*: Ensure the tone is neutral and analytical, not taking sides on EA vs. Rand, but on the logical validity of the interlocutor's use of Rand.

      *Wait, one check on Conclusion 2:* "A genuinely rational person would never make an anonymous gift, since an anonymous gift cannot come back to benefit the giver."
      *   Rand's view: Value is that which one acts to gain *or keep*. Psychological peace is a value. If anonymity preserves psychological peace (e.g., avoiding social obligation), it is rational.
      *   Interlocutor's view: Benefit must be *external/returned*.
      *   This confirms the "Transactional" slip.

      *Okay, ready to write.*
answer: |-
  Here is the map of the argument space, graded and analyzed according to your constraints.

  ### The Menu of Theses

  I have evaluated your seven theses, corrected their formulations where necessary to match the internal logic of the position you are debating, and added two necessary distinctions. For each, I provide the classification, the conditions for refutation, the commitment level of the slogan's defender, and whether it licenses the interlocutor's conclusions.

  **Legend:**
  *   **C1:** Giving large income to strangers is degrading/self-sacrificial.
  *   **C2:** Anonymous giving is irrational (no return benefit).
  *   **Status:** Definitional (true by stipulation), Platitude (trivial), Substantive-Defensible (coherent but requires proof), Substantive-Contested (coherent but debatable), False (incoherent or empirically wrong).

  #### 1. The Verbal Thesis (Your "One")
  *   **Precise Statement:** "Selfishness" denotes any action motivated by the agent's own psychological impulses, regardless of content.
  *   **Status:** **Definitional Maneuver / False.** It empties the term "selfishness" of normative force. If acting on a whim to destroy oneself is "selfish," the term cannot guide action.
  *   **Refutation:** Show that the framework distinguishes between *rational* self-interest and *irrational* whim. (Rand explicitly does this).
  *   **Commitment:** A defender of the slogan cannot hold this without abandoning the claim that selfishness is a *virtue*.
  *   **Licenses:** **Neither.** If all action is selfish, EA is selfish, and C1 fails. Anonymity is just a preference, so C2 fails.

  #### 2. The Objective-Standard Thesis (Your "Two")
  *   **Precise Statement:** "Interests" are objectively determined by the requirements of human survival *qua* human, not by subjective desire. An action is selfish only if it objectively sustains the agent's life.
  *   **Status:** **Substantive-Contested.** This is the core engine of the view. It makes the claim falsifiable: one must prove that EA objectively harms the agent's life.
  *   **Refutation:** Demonstrate a case where giving to strangers objectively enhances the giver's life (e.g., psychological fulfillment, risk mitigation, societal stability).
  *   **Commitment:** **High.** This is the standard Objectivist reading.
  *   **Licenses:** **C1 only (conditionally).** It supports C1 *if* EA is proven to be life-negative. It does **not** support C2, because psychological fulfillment (an internal return) counts as a benefit even without social recognition.

  #### 3. The Jurisdictional Thesis (Your "Three")
  *   **Precise Statement:** The moral quality of an act is determined by the *source of the command*. Acting because "I judge this valuable" is virtuous; acting because "They have a need/claim on me" is vicious.
  *   **Status:** **Substantive-Defensible (within the system).** It shifts the debate from consequences to moral authority.
  *   **Refutation:** Show that the distinction is psychologically impossible to maintain (i.e., one cannot feel the weight of another's need without feeling a claim).
  *   **Commitment:** **High.** This is the primary distinction between "trade" and "sacrifice" in this framework.
  *   **Licenses:** **C1 only.** If EA is framed as "duty to the global poor," C1 holds. If EA is framed as "I choose to maximize impact," C1 fails. It does **not** support C2; one can anonymously act on one's own judgment.

  #### 4. The Harmony/Non-Zero-Sum Thesis (Your "Four")
  *   **Precise Statement:** In a rational society, there is no conflict of interests. Therefore, a net cost to the self is always an error in calculation or a result of irrational social codes.
  *   **Status:** **Substantive-Contested.** It relies on a metaphysical claim about the nature of value (that it is created, not finite).
  *   **Refutation:** Identify a scenario where resources are genuinely finite and time-constrained, such that helping B *necessarily* harms A's life prospects.
  *   **Commitment:** **Medium.** Defenders often rely on this, but it is more of a social ideal than an ethical axiom.
  *   **Licenses:** **C1.** If value harmony is true, sacrifice is unnecessary. **Not C2.** Harmony does not require public acknowledgment.

  #### 5. The Epistemic Thesis (Your "Five")
  *   **Precise Statement:** The agent lacks the knowledge to properly weigh strangers' needs against their own, making altruistic rules heuristic failures.
  *   **Status:** **Empirical/Contested.** This is a Hayekian knowledge argument applied to ethics.
  *   **Refutation:** Demonstrate that effective altruism methodologies successfully overcome this knowledge gap (e.g., via data on bed nets).
  *   **Commitment:** **Low/Medium.** Often used as a backup argument, not the core ethical claim.
  *   **Licenses:** **Neither strongly.** It suggests caution, not that giving is *degrading* (C1) or that anonymity is *irrational* (C2).

  #### 6. The Psychological/Character Thesis (Your "Six")
  *   **Precise Statement:** Altruistic motivation systematically erodes the agent's sense of self-efficacy and creates dependency in the recipient.
  *   **Status:** **Empirical/Contested.** A claim about moral psychology and sociology.
  *   **Refutation:** Empirical evidence that givers maintain high self-efficacy and recipients achieve independence.
  *   **Commitment:** **High.** This is the "degrading" component of C1.
  *   **Licenses:** **C1.** Directly supports the claim of degradation. **Not C2.** Publicity might worsen the character corruption (vanity), so anonymity could be *better*.

  #### 7. The Narrow Scope Thesis (Your "Seven")
  *   **Precise Statement:** There are no positive duties to others, but benevolence is permissible as a minor value, provided it does not conflict with major values.
  *   **Status:** **Substantive-Defensible.** This is the actual normative output of the system.
  *   **Refutation:** Argue for the existence of positive duties (outside the scope of this mapping).
  *   **Commitment:** **High.** This is the actual policy implication.
  *   **Licenses:** **Neither.** This thesis explicitly permits giving (as a luxury). It contradicts C1 (which calls it degrading) and is neutral on C2.

  #### 8. The Transactional Thesis (Added)
  *   **Precise Statement:** Value is strictly reciprocal. An action is rational only if it yields a tangible or social return to the agent comparable to the cost.
  *   **Status:** **False (within the system) / Crude.** This reduces "value" to "trade goods." It ignores internal psychological values (pride, peace, joy).
  *   **Refutation:** Point out that reading a book, walking in nature, or private artistic creation yields value without external return.
  *   **Commitment:** **Low.** A sophisticated defender rejects this. Your interlocutor likely *assumes* it.
  *   **Licenses:** **C2.** This is the only thesis that makes anonymity irrational. **C1.** It makes giving degrading if the return is insufficient.

  #### 9. The Temporal-Integration Thesis (Added)
  *   **Precise Statement:** The "self" whose interests matter is the organism over its entire lifespan, not the time-slice.
  *   **Status:** **Substantive-Defensible.** Essential to the view.
  *   **Refutation:** Show that long-term planning is epistemically impossible.
  *   **Commitment:** **High.**
  *   **Licenses:** **Complicates C1.** It allows for short-term cost for long-term gain. It forces the debate to be about whether EA provides long-term *self*-gain.

  ---

  ### The Two Stuck Points

  #### 1. The Interval of Interests (Time-Slice vs. Life)
  In this framework, the unit of moral value is "man's life qua man." The relevant interval is the **entire lifespan**.
  *   **The Bite:** This *weakens* the attack on EA if EA is framed as an investment in long-term security (e.g., preventing pandemics that might reach the giver). However, the framework distinguishes between **investment** (trading a lesser value for a greater future value *for oneself*) and **sacrifice** (trading a greater value for a lesser value, or for a value that does not belong to oneself).
  *   **Impact on Argument:** To sustain C1, the interlocutor must argue that EA is not a long-term investment in the self, but a sacrifice of a certain high value (personal projects) for an uncertain or alien value (strangers' lives). If the interval is the whole life, "giving" is only vicious if it lowers the *total* quality of the giver's life.
  *   **Correction:** The interlocutor cannot simply say "you lose money now." He must say "you lose *life* overall."

  #### 2. The Boundary of the Self (Skin vs. Loved Ones)
  The principle that stops the boundary at the skin is **Causal Connection to One's Own Happiness.**
  *   **The Mechanism:** In this view, you do not love your family *altruistically* (for their sake); you love them *selfishly* (because their existence is a precondition of your joy). They are part of your "self" metaphysically because their flourishing causes yours. Strangers, causally distant, do not trigger this mechanism.
  *   **Impact on Argument:** If the interlocutor admits that giving to a child is rational, he admits the boundary is not the skin. He must argue **Causal Distance.**
  *   **If No Principle Exists:** If he cannot distinguish why a child counts and a stranger doesn't other than "proximity," then C1 collapses. It becomes arbitrary. If the stranger's survival brings the giver psychological satisfaction (even via anonymity), the stranger *becomes* a value to the giver. To maintain C1, the interlocutor must claim that satisfaction derived from strangers' welfare is *irrational* or *guilt-based*, not genuine value.

  ---

  ### The Verdict: What Your Interlocutor Meant

  Your interlocutor is not arguing from a single coherent thesis. He is sliding between **Thesis 2 (Objective Standard)** and **Thesis 8 (Transactional Thesis).**

  **The Diagnosis:**
  1.  **For Conclusion 1 (Giving is Degrading):** He is relying on **Thesis 3 (Jurisdictional)** mixed with **Thesis 6 (Psychological).** He assumes EA is motivated by "duty/need" (Jurisdiction) which damages character (Psychological). This is a defensible internal argument *if* one accepts the premise that duty is vicious.
  2.  **For Conclusion 2 (Anonymity is Irrational):** He is relying on **Thesis 8 (Transactional).** He claims a gift "cannot come back to benefit the giver" if anonymous. This is **false** within the sophisticated version of the view (Thesis 2). Internal psychological states (pride, peace, joy) are benefits that do not require public recognition.

  **The Suppressed Premise Carrying the Weight:**
  The argument collapses without this hidden premise:
  > *"Value is exclusively external or social. Internal psychological satisfaction derived from the welfare of strangers is not a legitimate 'selfish' interest."*

  **Why this matters:**
  *   If internal satisfaction counts as a selfish benefit, **C2 is false.** An anonymous gift buys internal satisfaction.
  *   If internal satisfaction counts as a selfish benefit, **C1 is weakened.** If the giver *values* the strangers' survival enough to pay for it, it is a trade, not a sacrifice.

  **Final Grade of the Interlocutor's Argument:**
  *   **Logical Consistency:** **Fail.** He uses a high-minded definition of selfishness (Objective Standard) to block the label of "altruism," but a crude definition of value (Transactional) to block the rationality of anonymity.
  *   **Randian Fidelity:** **Mixed.** C1 is consistent with the corpus (sacrifice is vicious). C2 is inconsistent (integrity and private judgment are virtues; social recognition is a secondary value, not a primary requirement for rationality).
  *   **Effectiveness against EA:** **Low.** EA can bypass C1 by framing giving as a personal value (Thesis 3) and bypass C2 by citing psychological utility (Thesis 8 refutation).

  **How to Settle the Argument:**
  Force him to choose: Is the "benefit" required for rationality **external** (reputation, reciprocity) or **internal** (psychological fulfillment)?
  *   If **External:** He is a crude transactionalist, not a philosophical egoist. C2 stands, but the view is easily refuted (art, hobbies, private love are irrational).
  *   If **Internal:** C2 collapses (anonymity is fine). C1 only holds if he can prove the EA practitioner is *lying* about their internal fulfillment and is actually acting on guilt (Thesis 6). He must prove the psychology, not just the action.
