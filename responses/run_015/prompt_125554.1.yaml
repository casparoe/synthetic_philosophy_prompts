answer: |-
  **Project Title:** Structural Instability in Contractualist Justification: Pairwise Comparisons and Cyclical Reasoning in Scanlonian Moral Theory

  **I. Research Question and Conceptual Framing**

  T. M. Scanlon's contractualism, as articulated in *What We Owe to Each Other* (1998), grounds moral wrongness in the inability to justify one's actions to others on grounds they could not reasonably reject. A central tenet of this framework is the rejection of aggregative moral reasoning; Scanlon argues that one cannot justify harming a single individual merely by appealing to the greater aggregate welfare of many others. The prevailing literature interprets this primarily as a quantitative dispute: do numbers count in moral deliberation? Critics argue that ignoring numbers leads to counterintuitive results in rescue cases, while defenders argue that counting heads violates the separateness of persons.

  This project proposes a structurally distinct framing of the problem. Rather than asking whether numbers possess moral weight, I ask whether Scanlon's model of interpersonal justification is best reconstructed as a system of pairwise comparisons that is vulnerable to cyclic preference structures. If justification proceeds by comparing principles relative to specific individuals (e.g., Principle P is justifiable to Agent A over Principle Q, but Q is justifiable to Agent B over P), the relation of "reasonable rejection" may lack transitivity. Consequently, the aggregation problem may not be a refusal to sum welfare, but a deeper logical problem akin to Condorcet cycles in social choice theory: Principle P may be justifiable over Q, Q over R, and R over P, leaving no globally justifiable principle even when every local comparison is valid.

  The precise research question is: *Does a rigorous reconstruction of Scanlonian justification as a pairwise comparative system generate intransitive cycles that undermine the determination of a unique, morally permissible principle, and if so, can contractualism accommodate this structural instability without collapsing into aggregation?*

  **II. Gap in Existing Literature**

  Existing scholarship largely treats the Scanlonian rejection of aggregation as a substantive moral claim about the value of individuals versus collectives. Debates focus on the "Numbers Debate," analyzing whether contractualism can permit saving the greater number without violating its individualist constraints. While some commentators have noted that Scanlon's formula involves comparing burdens, none have rigorously analyzed the *logical structure* of these comparisons using the tools of formal social choice theory.

  The literature leaves the pairwise-reconstruction question open because it assumes that if a principle cannot be reasonably rejected by any individual, it is stable. This assumption presupposes transitivity in the "reasonable rejection" relation. However, if rejection is context-dependent and agent-relative, the collective set of rejections may form a cycle. By failing to model the *relations* between justifications formally, existing treatments miss the possibility that contractualism fails not because it counts incorrectly, but because its decision procedure is structurally incomplete. This project fills that gap by applying the logic of tournament graphs to moral justification.

  **III. Methodology and Timeline**

  The methodology combines close conceptual exegesis with formal conceptual mapping. I will not produce original mathematical proofs but will utilize tournament graphs (directed graphs where every pair of vertices has exactly one edge) to visualize the relations of justification.

  *   **Month 1: Textual Exegesis.** Close reading of *What We Owe to Each Other*, specifically Chapters 5 and 6. The goal is to isolate the precise conditions under which a principle is "reasonably rejected." I will codify the criteria for interpersonal comparison into a set of logical rules.
  *   **Month 2: Model Construction.** I will formalize the "reasonable rejection" relation as a binary relation. I will construct hypothetical moral dilemmas (e.g., multi-party rescue cases) involving three or more agents and competing principles to test for pairwise consistency.
  *   **Month 3: Graph Mapping.** Using the data from Month 2, I will map these relations as tournament graphs. I will identify conditions under which Condorcet cycles emerge (e.g., Agent A rejects P1 for P2, Agent B rejects P2 for P3, Agent C rejects P3 for P1).
  *   **Month 4: Analysis of Implications.** I will analyze whether Scanlon's framework has internal resources to resolve these cycles (e.g., through tie-breaking rules or hierarchical ordering of reasons) or if the cycles indicate a fundamental indeterminacy.
  *   **Month 5: Drafting.** I will write the full dissertation draft, integrating the textual analysis with the structural models. The argument will proceed from the textual basis to the formal problem, and finally to the normative implications.
  *   **Month 6: Revision and Polish.** I will refine the argument for clarity, ensure the formal mapping remains accessible to a philosophical audience, and incorporate feedback from advisors.

  **IV. Success and Failure Conditions**

  A **successful result** will look like a reconstructed contractualist procedure that explicitly addresses the possibility of cyclic justification. Success does not require proving that cycles never occur; rather, it requires demonstrating either (a) that the specific constraints of "reasonable rejection" prevent cycles in moral contexts (unlike in voting), or (b) that contractualism can accommodate indeterminacy without losing its normative force. The project will successfully distinguish the structural problem from the quantitative aggregation problem.

  A **failure condition** would arise if the pairwise reconstruction proves conceptually incoherent—for example, if the "pairwise" model cannot be squared with Scanlon's insistence on generic reasons rather than agent-relative preferences. Additionally, the project fails if the formal mapping simply collapses into standard utilitarian aggregation (i.e., if resolving the cycle inevitably requires summing burdens), as this would imply the structural critique offers no distinct alternative to the standard quantitative critique.

  **V. Scope Assessment and Risks**

  This project carries a specific risk: that the formal mapping may outpace the philosophical payoff within the six-month timeframe. There is a danger of becoming engrossed in the mechanics of graph theory at the expense of normative analysis. To mitigate this, I will restrict the formal modeling to illustrative examples rather than attempting a comprehensive axiomatic system. Furthermore, there is a risk that the "cycle" problem is merely theoretical and does not arise in realistic moral scenarios. If cycles only emerge in highly contrived cases, the philosophical significance of the project diminishes. I will address this by focusing on "hard cases" already present in the literature (e.g., complex rescue scenarios) to ensure the structural problems have genuine moral relevance. Finally, six months is a tight constraint for developing a novel structural critique; if the textual analysis in Month 1 reveals that Scanlon explicitly rules out pairwise comparison, the project may require a significant pivot to address a weaker version of the claim. I will maintain flexibility in Months 2 and 3 to adjust the model if the textual evidence demands it.
