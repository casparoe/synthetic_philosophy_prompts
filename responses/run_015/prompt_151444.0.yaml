      *   *User's Worry:* If dopamine = precision, then wireheading is just maximizing confidence artificially. If AI reward = loss minimization, then tampering is also minimizing loss artificially. Aren't they the same?
      *   *Evaluation:* PP actually *helps* the distinction if framed correctly.
