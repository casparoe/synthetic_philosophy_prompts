answer: |-
  Mira: The cursor is blinking at me like a metronome. "Sixty years." We're carving history into billable hours.

  Dev: You're typing the minority report. That means you've lost the vote.

  Mira: I'm losing the vote. Tomorrow. But tonight, I'm trying to understand why we're funding thick identities. The Somali-Haldeni tenants' union has been keeping people housed for twelve years. They're articulate, they're organized, they're vital. But because they haven't been saying the same paragraph in public since 1964, they get nothing. Meanwhile, the Yacht Club gets a consultative role. We're ranking conceptions of the good.

  Dev: You're right that the sixty-year threshold is arbitrary. But the liberal city already sustains one thick identity and just launders it as neutrality. The identity of the person who stands back from their ends and revises them. Our schools, the exit right you insisted on, the anti-discrimination code itself—they all train for that specific kind of self. This grant only admits that some identities worth keeping aren't the state's own product.

  Mira: Okay, I'll concede the neutrality claim is overdone. Schools do shape character. But there's a distinction between enforcing the conditions under which you can revise your ends and subsidising a particular end. Call it the literacy/creed distinction. We teach them how to read, not what to read.

  Dev: Literacy is never content-free. You can't teach someone to read without handing them texts that privilege certain worlds over others. But look, some goods are constitutive. You only have them by being inside a practice that started before you and will outlast you. Take a language. You can leave a language community, sure. Your exit is costless. But you cannot take a living mother tongue with you; it dies with the community. So costless exit protects your freedom to choose and protects nothing at all about this kind of good.

  Mira: Then exit is the wrong right here. For constitutive goods what you'd want is a secession floor. If some share, say a fifth, of members want to continue the practice differently, they take a proportional slice of the grant and of the story with them. That's a liberal repair, not a veto. It keeps the practice alive without locking the dissenters out.

  Dev: The floor gives splinter groups money and no standing, because standing is exactly what the continuity test withholds. And it drags the city into adjudicating schisms. Who gets to be the "real" continuation? You're asking the zoning committee to decide theological inheritance. Has the liberal state avoided those quasi-theological questions or just privatised them and then re-administered them through the courts?

  Mira: Better the courts than a blanket ban on newness. But fine, let's look at the reform problem. A congregation that admitted women to its governing board in the 1980s has to tell the city whether that was growth or a break. Whoever certifies continuity is certifying a story about change as either faithfulness or apostasy. You can't avoid that judgment.

  Dev: Someone has to hold the power. If not the city, then the elders inside the association. At least this way, the city acknowledges the stakes. We aren't pretending the state doesn't care what survives.

  Mira: But who holds the pen? If the city certifies the story, the city owns the orthodoxy. If the association certifies the story, the city funds the oppression. I'm looking at the anti-discrimination carve-out. That's where the actual fight will land. We're saying you can exclude who you want, unless the code says otherwise.

  Dev: Which means the code is the only real boundary. Everything else is negotiation.

  Mira: Exactly. So why the sixty years? Why not ten? Why not merit?

  Dev: Because endurance is a proxy for value. Not perfect, but better than our whim.

  Mira: It's a proxy for power. The ones who survived already won. We're just handing them the trophy.

  Dev: Or we're acknowledging that some things take longer than a election cycle to build. You want to fund the tenants' union? Fine. Come back in 1964.

  Mira: They won't exist in 1964. They exist now.

  Dev: Then they aren't a continuity project. They're a startup. Startups don't get endowments.

  Mira: That's the whole point. We're calcifying the city. We're saying the only things worth saving are the things that haven't changed enough to die.

  Dev: Or the things that have changed enough to live. You're worried about the women on the board. I'm worried about the language that disappears because nobody stayed to speak it.

  Mira: And I'm worried that by funding the speakers, we freeze the language.

  Dev: Maybe. But without the grant, there are no speakers.

  Mira: So we trade freedom for survival.

  Dev: We trade one kind of freedom for another. The freedom to leave versus the freedom to belong.

  Mira: I'm putting that in the report.

  Dev: Put it in. They'll vote anyway.

  Mira: I know. I just want the record to show we knew what we were buying.

  Dev: We bought time. Whether it's enough is up to them.

  Mira: It's never enough.

  Dev: No. But it's all we have.

  \answer{Who adjudicates faithful change versus apostasy}
