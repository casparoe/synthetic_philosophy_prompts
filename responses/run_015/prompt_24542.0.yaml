answer: |-
  This is a classic and deeply troubling problem in the metaphysics of causation. You are encountering the tension between **counterfactual dependence** (if I had acted, the outcome would differ) and **causal selection** (why we pick *this* non-event as the cause rather than the infinite other non-events).

  Your worry about circularity is well-founded. If you define causation by omission using normative terms (like "expected" or "duty"), you are arguably defining causation in terms of responsibility, which many metaphysicians find objectionable. However, a dominant strand of literature (following H.L.A. Hart and Tony Honoré) argues that causation by omission *cannot* be separated from normative expectations. Unlike positive events (a brick hitting a window), omissions are only causally salient against a backdrop of what *should* have happened.

  Let's test your tentative principle, refine it to handle the edge cases, and then apply it to the software engineer.

  ### 1. Testing Your Tentative Principle
  **Your Principle:** Omission causes outcome iff (i) Counterfactual Dependence + (ii) Reasonable Expectation.

  *   **Physician & Plant Operator:** Pass easily. Dependence holds; expectation is high (professional duty).
  *   **Runaway Cart:** Passes.
      *   *Case A (Brake works):* Dependence fails (cart stops anyway). Verdict: Not a cause. (Matches your intuition).
      *   *Case B (Brake fails):* Dependence holds. Expectation holds. Verdict: Cause. (Matches your intuition).
      *   *Note:* Here, Clause (i) is doing all the work. Clause (ii) is redundant.
  *   **Charity Donor:** Passes *only if* "Reasonable Expectation" is interpreted narrowly. If "reasonable" means "what a good moral person would do," then you fail your own intuition (you should donate). To match your verdict, "Expectation" must mean "Specific Obligation," not "General Morality."
  *   **Pond Bystander:** This is the breaking point. Counterfactual dependence holds (if you jump, child lives). Does "Reasonable Expectation" hold? In many legal systems and moral frameworks, yes. To get your verdict ("Not a cause"), Clause (ii) must be stricter than "reasonable." It must require a **specific, localized duty** that distinguishes you from the general background of moral agents.
  *   **Signal Box:** Your principle says "Cause" (Dependence + Job Duty). You are torn. This suggests your intuition is fighting the logical implication of your own criteria.

  **Diagnosis:** Your Clause (ii) is too vague. "Reasonably expected" smuggles in the ambiguity you are trying to resolve. We need to distinguish between *general moral expectations* (Charity, Bystander) and *specific causal responsibilities* (Physician, Operator).

  ### 2. A Refined Principle: The Specific-Deviation Account

  To capture your verdicts without collapsing into "everything is a cause," I propose we tighten the normative condition. We should adopt a version of **Normative Contextualism**. The principle is:

  > **The Specific-Deviation Principle:**
  > An agent's omission $O$ causes an outcome $E$ if and only if:
  > 1.  **Dependence:** $E$ would not have occurred at that time and in that manner had the agent performed the omitted act $A$.
  > 2.  **Specific Responsibility:** The performance of $A$ was required by a **specific role, contract, or prior assumption of control** assigned to the agent, distinguishing them from the general background of moral agents.
  > 3.  **Non-Redundancy:** The omitted act $A$ was not causally redundant given other actual or potential interventions in the specific context.

  **Motivation for Clauses:**
  *   **Clause 1 (Dependence):** Motivated by the **Runaway Cart** cases. It explains why the guard's omission causes the crash in one scenario but not the other. The physical facts change the counterfactual truth value.
  *   **Clause 2 (Specific Responsibility):** Motivated by the **Physician vs. Bystander vs. Charity** triad. It explains why the physician causes the death (specific role vis-à-vis *this* patient) while the charity donor does not (general duty vis-à-vis *anyone*). It handles the Bystander case by noting that without a specific assumption of care (like a lifeguard), the bystander remains part of the "background," even if they *could* help.
  *   **Clause 3 (Non-Redundancy):** Motivated by the **Runaway Cart (Success)** case and the **Bystander (with others)** nuance. If the brake stops the cart, the guard is redundant. If four other adults are actively rescuing the child, your omission might be redundant; but in your case, they are *filming*, so they are not intervening. However, Clause 2 does the heavier lifting for the Bystander case (lack of specific duty).

  ### 3. Reflective Equilibrium: The Cost

  You asked me to be honest about which verdicts this forces you to drop.

  1.  **The Signal Box:** This principle forces you to conclude the operator **did cause** the deaths.
      *   *Why:* She meets Dependence (button diverts train), Specific Responsibility (signal box job), and Non-Redundancy (no one else can press it).
      *   *Resolution:* Your hesitation likely stems from the "Doing vs. Allowing" distinction in *moral* psychology, not *causal* metaphysics. You feel she is less *blameworthy* than a killer, or that her causation is "negative." But under this principle, causation is established. You must accept that "causing by omission" is genuine causation, even if it feels different from pushing someone onto the tracks.
  2.  **The Bystander:** This principle supports your verdict (**Not a cause**), but for a specific reason: lack of *specific* duty.
      *   *Nuance:* If the bystander were the *only* person there, some versions of this principle might tip toward "Cause" because the "Specific Responsibility" can be generated by unique capacity in an emergency (the "easy rescue" debate). However, given your stipulation that four others are present, the "Specific Responsibility" clause easily excludes the agent, preserving your intuition.
  3.  **The Circularity Worry:** You must drop the hope that causation by omission is purely descriptive/metaphysical like billiard balls hitting.
      *   *Honest Assessment:* Clause 2 is inherently normative. It relies on social facts (roles, contracts, expectations). This is not a bug; it is the consensus of scholars like Hart & Honoré. Causation in law and ordinary language is a selection mechanism that relies on norms to distinguish "causes" from "mere conditions." If you want a principle that matches your intuitions, you must accept that **causation by omission is partly a normative concept.**

  ### 4. The Software Engineer Case

  **The Case:** A software engineer knows her code has a bug that creates a *small probability* of fatal malfunction. She decides not to fix it. The malfunction occurs, and someone dies.

  **Application of the Specific-Deviation Principle:**

  1.  **Dependence:** Had she fixed the bug, would *this* death have occurred?
      *   *Analysis:* This is the tricky part. If the bug creates a probabilistic risk, fixing it removes the risk. In the actual world, the bug triggered. In the counterfactual world (bug fixed), the trigger is gone. So, yes, Dependence holds.
  2.  **Specific Responsibility:** Does she have a specific role-based duty?
      *   *Analysis:* Yes. Unlike the charity donor, she is the specific engineer assigned to *that* code base. She has a professional duty of care regarding the specific system she built.
  3.  **Non-Redundancy:** Was her fix redundant?
      *   *Analysis:* Assuming no other safety system caught the bug (like the brake in the Cart case), her omission is non-redundant.

  **Verdict:** Her omission **caused** the death.

  **Is this over-generating?**
  It feels harsh because of the "small probability" clause. However, causation is an *ex post* concept (looking backward from the effect), whereas probability is *ex ante* (looking forward from the decision).
  *   **Ex Post:** The bug *did* kill the person. The failure to fix the bug *was* a necessary condition for the death (given her role). Therefore, it is a cause.
  *   **Ex Ante:** The *blame* or *negligence* might be debated based on the probability. If the risk was 1 in a billion, she might not be *criminally negligent*, but the causal link remains.

  **Comparison to Charity Case:**
  Why is this different from the Charity Donor?
  *   **Charity:** You have no specific responsibility to *that specific* dying person. Your duty is general/imperfect.
  *   **Engineer:** She has specific responsibility to the users of *that specific* software. Her duty is perfect/specific.
  *   **Probability:** In the Charity case, the link is often probabilistic too (money *might* save a life). But the primary blocker for the Charity case is Clause 2 (Specific Responsibility). For the Engineer, Clause 2 is satisfied, so the probability only affects blame, not causation.

  ### Summary of Recommendations

  1.  **Accept Normativity:** Stop fighting the idea that Clause (ii) is normative. For omissions, norms *select* the cause. Without the norm (the duty), the omission is just a state of the world, like the absence of a hurricane.
  2.  **Tighten "Expectation":** Replace "Reasonably Expected" with "Specific Responsibility" (Role/Contract/Control). This saves the Charity and Bystander verdicts while securing the Physician and Operator verdicts.
  3.  **Resolve the Signal Box:** Accept that the operator *did* cause the deaths. Your hesitation is likely moral (killing vs. letting die), not causal. In the metaphysics of omission, if you have the duty and the power, and you don't act, you are a cause.
  4.  **Engineer Verdict:** The engineer's omission is a cause. The low probability makes the *risk-taking* less blameworthy, perhaps, but does not sever the causal chain once the harm actualizes.

  This approach preserves most of your intuitions while providing a rigorous framework that explains *why* the Physician is a cause and the Donor is not, without collapsing into the view that "everything not done is a cause of everything that happens."
