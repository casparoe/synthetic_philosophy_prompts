      *   Even if we grant (4), step (6) is contentious. Is an act less moral if it feels good or brings reputation? Most ethical frameworks (virtue ethics, consequentialism) care about the *act* and the *character*, not just the purity of the impulse. However, rejecting (6) is harder for the user who wants to preserve "genuine" morality in a strong sense. Better to stick with rejecting (4)/(5) as the primary evolutionary error.

  7.  **Address the Scope Shift:**
