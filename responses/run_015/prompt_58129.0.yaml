answer: |-
  **The Dilemma of the Critical Level: Continuity, Discontinuity, and the Repugnant Conclusion**

  Population axiology seeks to determine the moral value of different possible futures containing different numbers of people. A prominent candidate for such a theory is the Critical-Level View (CLU). As stipulated, CLU holds that the overall value of a world is determined by summing, across all people who ever live, each person's lifetime wellbeing minus a fixed positive critical level ($c$). This view is often motivated by the desire to avoid the Repugnant Conclusion (RC)—the implication that for any world containing a smaller number of people with very high lifetime wellbeing, there is a morally better world containing a much larger number of people whose lifetime wellbeing is positive but barely above zero. By setting $c$ above the level of a life "barely worth living," CLU aims to ensure that adding such lives reduces the total value of a world.

  However, this argument demonstrates that any impartial CLU that posits a positive threshold remains vulnerable to a variant of the Repugnant Conclusion unless it accepts an implausible discontinuity in moral value. To establish this, we must first define two constraints on an acceptable population axiology: impartiality and continuity. **Impartiality** requires that the moral value of a world depends only on the distribution of wellbeing, not on who holds it; each person's wellbeing counts equally. **Continuity** requires that small changes in individual wellbeing result in only small changes in the overall moral value of a world; there should be no "moral cliffs" where a negligible drop in wellbeing causes a catastrophic drop in value.

  **The Sequence of Worlds**

  Consider the stipulated sequence of worlds $W_1$ through $W_{50}$.
  *   **World $W_1$:** Contains 2,000 people, each with a lifetime wellbeing of 100.
  *   **The Progression:** Each subsequent world $W_{n+1}$ doubles the population of $W_n$ while reducing average lifetime wellbeing by 2 units.
  *   **World $W_{50}$:** Contains an enormous population with average wellbeing of 2 (lives barely worth living).

  Assume a critical level $c = 20$. According to CLU, a life contributes positive value to the world only if its wellbeing exceeds 20.

  **The Vulnerability to a Variant of the Repugnant Conclusion**

  Let us analyze the value of these worlds under an impartial CLU that respects Continuity. The value of $W_1$ is calculated as the population multiplied by the difference between wellbeing and the critical level:
  $$V(W_1) = 2,000 \times (100 - 20) = 160,000.$$

  Now consider the progression through the sequence. In each step, the population doubles, while the contribution per person $(w - c)$ decreases by only 2 units. Because the population grows exponentially while the per-person value shrinks linearly, the total value of the world must eventually increase, provided wellbeing remains above the critical level.

  We can identify a world in this sequence, let us call it $W_k$, where the average wellbeing is only slightly above the critical level. For instance, consider a world where average wellbeing is 22. In the stipulated sequence, this occurs roughly at $W_{40}$. At this point, the contribution per person is only $2$ units ($22 - 20$). However, because the population has doubled roughly 39 times from the baseline of 2,000, the population is astronomical. Even with a tiny positive contribution per person, the sheer number of people ensures that the total value $V(W_k)$ vastly exceeds $160,000$.

  Consequently, a standard impartial CLU implies that $W_k$ (a world with billions of people living mediocre lives just above the threshold) is morally better than $W_1$ (a world with a smaller population living excellent lives). This is a **Variant of the Repugnant Conclusion**. While the standard RC compares excellent lives to lives barely above zero, this variant compares excellent lives to lives barely above the *critical level*. It implies that quantity can always trade off against quality, provided the quality remains technically "positive" relative to the threshold. If the CLU proponent accepts the mathematical implications of their view combined with Continuity, they must accept this counter-intuitive result.

  **The Discontinuity Escape**

  To avoid this Variant of the Repugnant Conclusion, the proponent of a critical-level view must deny that $W_k$ is better than $W_1$. They must assert that the excellence of life in $W_1$ cannot be outweighed by the quantity of lives in $W_k$, even if those lives are above the critical level. However, they also wish to maintain that lives below the critical level (e.g., at wellbeing 18) contribute negative value.

  This creates a dilemma. If the view respects Continuity, the value of a life at wellbeing 22 cannot be categorically different in kind from a life at wellbeing 18; the difference in value should be proportional to the difference in wellbeing (4 units). But if the theorist wants to block the Variant RC, they must claim that the value of $W_k$ (wellbeing 22) is *not* high enough to surpass $W_1$, while simultaneously maintaining that a world with wellbeing 18 is *negative* in value (worse than an empty world).

  To sustain this position, the theorist must posit a **sharp evaluative break** or discontinuity in moral value once wellbeing falls near the critical level. They must claim that the moral value of a life drops precipitously as it approaches 20 from above, or that there is a lexical priority for higher-quality lives that overrides the additive sum. This implies that a person with wellbeing 20.1 contributes significantly to the "goodness" of a world in a way that allows for aggregation, while a person with wellbeing 19.9 renders the world worse than if they had never existed.

  **The Implausibility of Discontinuity**

  Such a discontinuity is difficult to defend when the underlying individual differences are stipulated to be tiny. The phenomenological difference between a life at level 20.1 and a life at level 19.9 is negligible. It represents a marginal difference in pleasure, pain, or satisfaction. It is implausible to claim that this marginal difference marks the boundary between a life that helps make the world a better place and a life that makes the world a worse place than emptiness.

  Furthermore, in the context of the sequence, accepting this discontinuity leads to absurd rankings. If there is a sharp break at 20, then adding a million people at level 20.1 might make the world better, but adding a million people at level 19.9 makes it worse. Given that the difference between 20.1 and 19.9 is imperceptible to the inhabitants, a moral theory that treats these two states as opposite poles of value fails to track the reality of wellbeing. It violates the constraint of Continuity, which demands that moral value supervene smoothly on the properties that constitute wellbeing. To accept this discontinuity is to prioritize the abstract mathematical threshold over the actual experiential content of the lives involved.

  **Reply to the Objection on Moral Significance**

  An objector might argue that a threshold for a life to be worth creating can be morally significant even if the phenomenological difference between lives just above and just below it is minor. They might claim that while the experience of 20.1 and 19.9 is similar, the *moral status* of bringing such a person into existence is distinct. Perhaps we have a duty not to create lives below 20, but no duty to create lives above 20.

  While this distinction may hold for deontological constraints on *creation*, it does not rescue the axiological evaluation of *worlds*. The Repugnant Conclusion and the sequence of worlds $W_1$ through $W_{50}$ concern the comparative value of existing states of affairs, not the permissibility of bringing them about. The question is whether a world containing people at 19.9 is *worse* than a world without them, and whether a world containing people at 20.1 is *better* in a way that accumulates to outweigh $W_1$.

  If the objector insists that the value contribution flips from positive to negative across this tiny gap to avoid the Repugnant Conclusion, they are still positing a discontinuity in the *value of the world*, not just the permissibility of action. A world with a billion people at 19.9 would be deemed a moral catastrophe (negative total value), while a world with a billion people at 20.1 would be deemed a moral triumph (positive total value). The phenomenological similarity of the lives renders this axiological chasm unjustified. The "moral significance" of the threshold cannot bear the weight of inverting the value of entire worlds based on differences that are, by stipulation, trivial to the subjects living them.

  **Conclusion**

  The stipulated sequence of worlds demonstrates that an impartial Critical-Level View faces a forced choice. If it maintains Continuity, the exponential growth of population ensures that a world with mediocre lives (barely above the critical level) will eventually outweigh a world with excellent lives, entailing a Variant of the Repugnant Conclusion. If it seeks to avoid this conclusion, it must posit a sharp discontinuity in moral value at the critical threshold. Since such a discontinuity implies that negligible differences in wellbeing determine whether a life contributes positively or negatively to the world's value, it is implausible. Thus, the Critical-Level View fails to provide a satisfactory account of population value, as it must either accept counter-intuitive trade-offs between quality and quantity or rely on an unjustified moral cliff.
