answer: |-
  This is a sophisticated comparison, but before diving into the philosophical meat, there is a crucial bibliographic correction you need to flag for your students (and perhaps adjust in your own notes): **The "Incoherence Argument" you describe is canonically Daniel Dennett's**, specifically from his 1988 paper *"Quining Qualia."*

  Chase and Sanborn are the **coffee tasters** in Dennett's thought experiment, not the authors of the argument. They are the *subjects* used to demonstrate that introspective reports about qualia drift over time, rendering the concept of stable, intrinsic qualia incoherent. If your students attribute the argument to Chase and Sanborn as the philosophers, that is a significant error in scholarly precision.

  Assuming we are discussing **Dennett's Incoherence Argument** (via the Chase/Sanborn case) vs. the **Phenomenal Contrast-Space (PCS)** view (often associated with structuralist representationalism or quality-space theories like Clark, Shepard, or recent determinable accounts), here is the precise breakdown for your seminar.

  ### 1. Core Divergence: Eliminativism vs. Structural Realism

  The fundamental split is not just about the nature of properties, but about the **ontological status of the phenomenal**.

  *   **The Incoherence Argument (Dennett/Chase-Sanborn Case):** This is an **eliminativist** or **error-theoretic** move. It argues that the *concept* of qualia (defined as intrinsic, ineffable, private, directly apprehensible) is logically inconsistent. If a property is truly intrinsic and ineffable, it cannot play a role in reasoning, memory, or reporting (compositionality). If it can't play a role, it's explanatorily inert. Therefore, nothing fits the description. The conclusion is: **Qualia do not exist.**
  *   **The Contrast-Space View (PCS):** This is a **reconstructive realist** move. It argues that we have misidentified the *category* of phenomenal properties. They are not intrinsic atoms; they are **structural positions** within a multi-dimensional quality space. "Redness" is not a qualitative glue; it is a coordinate defined by its distance from "Green" and "Orange." The conclusion is: **Phenomenal character exists, but it is relational, not intrinsic.**

  **Grading Point:** Students should identify that Dennett wants to *dissolve* the target, while PCS wants to *reform* it.

  ### 2. The Grounding Objection: Does PCS Relocate the Incoherence?

  Your worry is astute: *If properties are relational, do we need something intrinsic to ground the relations?*

  *   **The Charge:** A relation requires relata. If the "nodes" in the contrast space (the specific experiences) don't have intrinsic character, what is being related? If they *do* have intrinsic character, hasn't PCS just smuggled qualia back in, violating the Incoherence Argument?
  *   **The PCS Defense:** PCS proponents argue this is a category mistake. The "nodes" are not grounded by intrinsic feels; they are grounded by **functional/causal roles** or **neural states** that occupy the structural positions. The "phenomenality" *just is* the occupation of that structural position. There is no "inner glow" at the node; there is only the node's location in the topology.
  *   **The Incoherence Counter:** Dennett would argue that if the node is just a functional state, you have explained *discrimination*, not *experience*. If the PCS proponent insists there is still "something it is like" to occupy that node *over and above* the structural position, Dennett charges that they have reintroduced the intrinsic ineffability that makes the concept incoherent.

  **Verdict:** PCS evades the letter of the Incoherence Argument (by denying intrinsic atoms) but risks violating its spirit if it cannot explain why the *structure itself* is phenomenal rather than merely cognitive.

  ### 3. The Hidden Disagreement: What Counts as "Explanation"?

  This is the most critical point for a grad seminar. The debate turns on competing standards of explanatory adequacy.

  *   **Dennett/Incoherence Standard:** Explanation requires **causal integration**. To explain consciousness is to show how reports, behaviors, and cognitive accesses are produced. If "qualia" are defined as things that escape this causal net (ineffable/intrinsic), they are by definition unexplainable and likely non-existent. Explanation = **Functional Mechanism.**
  *   **PCS Standard:** Explanation requires **phenomenal adequacy** (saving the appearances). To explain consciousness is to map the topology of experience (e.g., why red is more similar to orange than green). If a functional account misses the structural similarity relations, it has failed to explain the *phenomenology*. Explanation = **Structural Isomorphism.**

  **Grading Point:** Look for students who notice that Dennett thinks PCS might be explaining *access* while pretending to explain *phenomenology*, whereas PCS thinks Dennett is explaining *behavior* while ignoring *phenomenology*.

  ### 4. Are They Notational Variants?

  **No.** They are not notational variants.

  *   **Notational Variants** describe the same ontology using different symbols.
  *   **These Views** posit different ontologies.
      *   Dennett: There are no phenomenal properties (as traditionally conceived). There are only heterophenomenological reports.
      *   PCS: There are phenomenal properties, but they are structural universals or relational determinables.

  If PCS were true, Dennett is wrong to eliminate qualia; he merely defined them too narrowly. If Dennett is right, PCS is a sophisticated way of describing cognitive access structures while falsely labeling them "phenomenal."

  ### 5. Grading Rubric / Key Distinctions for Midterms

  When grading your students' responses, look for their ability to articulate these three specific tensions:

  1.  **Attribution Accuracy:** Do they recognize the argument as Dennett's "Quining Qualia" (using Chase & Sanborn as cases), or do they mistakenly treat Chase & Sanborn as the philosophers? (The latter suggests a lack of close reading).
  2.  **The "Relata" Problem:** Do they spot the risk that PCS needs *something* to occupy the contrast space?
      *   *Weak Answer:* "PCS says relations are all there is."
      *   *Strong Answer:* "PCS must argue that the occupation of the structural role *constitutes* the phenomenality, otherwise they face a regress or reintroduce intrinsic qualia."
  3.  **Explanatory Targets:** Do they identify that Dennett prioritizes *causal efficacy* while PCS prioritizes *phenomenal structure*?
      *   *Key Insight:* The debate is not just about consciousness; it's about whether "explanation" in philosophy of mind must be purely third-person functional (Dennett) or can include first-person structural constraints (PCS).

  ### Summary for Your Notes

  | Feature | Incoherence Argument (Dennett/Chase-Sanborn Case) | Phenomenal Contrast-Space (PCS) |
  | :--- | :--- | :--- |
  | **Ontology** | Eliminativist / Error Theory | Structural Realist |
  | **Nature of Property** | Rejects intrinsic/ineffable atoms as incoherent | Accepts properties as relational determinables |
  | **Grounding** | N/A (Properties don't exist) | Grounded in functional/neural topology |
  | **Explanatory Goal** | Causal integration of reports/behavior | Isomorphism between experience & quality space |
  | **Response to "What feels?"** | Nothing; the question is based on a false concept | The system state occupying the structural node |

  **Final Advice:** If a student argues that PCS successfully evades the Incoherence Argument, push them on whether their "structural nodes" have any intrinsic nature. If they say "no," ask why it feels like something to be that node (Hard Problem). If they say "yes," ask how that avoids Dennett's charge of incoherence. This tension is where the seminar discussion should live.
