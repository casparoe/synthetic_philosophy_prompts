answer: |-
  This is an excellent diagnostic exercise. The text you describe is a classic example of the "textbook caricature" that persists in introductory materials despite decades of scholarly correction. Your intuition that the "usefulness" formulation is a strawman (particularly for Peirce) is correct, and your hypothesis about the "unsettleable claims" axis cuts much closer to the genuine metaphysical tension between the two thinkers.

  Here is the claim-by-claim breakdown, followed by an evaluation of your proposed axis.

  ### Part I: Claim-by-Claim Analysis

  **1. Claim:** *"The American pragmatists gave up the idea that a belief is true when it corresponds to reality, since we can never step outside our beliefs to compare them with the world."*
  *   **Verdict:** **Standard Simplification / Partial Misreading.**
  *   **Analysis:** This projects a neo-pragmatist (Rortyean) epistemic anxiety onto the classical pragmatists. Peirce was a Scholastic Realist; he never abandoned the idea that truth is about Reality (with a capital R). He rejected the *copy* theory of correspondence (the idea that a belief must mirror the world like a picture), but he maintained that truth is the representation of the real. James is more complex; he speaks of "agreeing with reality," but defines "agreement" pragmatically (leading us through experience). Neither thinks we are trapped inside beliefs; they think the *access* to reality is mediated by signs and practice, not that reality is inaccessible.
  *   **Confidence:** High. Peirce's realism is well-documented (e.g., *Some Consequences of Four Incapacities*).

  **2. Claim:** *"So they redefined truth in terms of usefulness."*
  *   **Verdict:** **Explicit Denial (Peirce) / Standard Simplification (James).**
  *   **Analysis:** Peirce explicitly distinguishes truth from the satisfaction of belief. For Peirce, truth is what *would* be believed, not what is *useful* to believe now. He worries that "usefulness" is too subjective. James *does* use the language of usefulness ("cash value," "what works"), but he qualifies it heavily: it must work in the *long run* and cohere with the whole body of truths. To say they simply "redefined truth in terms of usefulness" ignores the normative constraint of reality in both systems.
  *   **Confidence:** High. Peirce's 1905 distinction between Pragmatism and Pragmaticism hinges on this.

  **3. Claim:** *"Peirce's version: the meaning of a claim is just the sum of the practical consequences of accepting it, and truth is simply whatever the community of inquirers ends up accepting at the end of investigation."*
  *   **Verdict:** **Sympathetic Acceptance.**
  *   **Analysis:** This is a accurate, if compressed, summary of the Pragmatic Maxim and the "Final Opinion" theory of truth. It captures the communal and teleological nature of Peirce's view.
  *   **Confidence:** High.

  **4. Claim:** *"...he later renamed the doctrine pragmaticism mostly because he wanted a name ugly and precise enough to belong to him alone."*
  *   **Verdict:** **Sympathetic Acceptance.**
  *   **Analysis:** This is historically accurate (see *The Monist*, 1905, "What Pragmatism Is"). Peirce explicitly states he coined "pragmaticism" because the original name was "good enough to be prostituted."
  *   **Confidence:** High.

  **5. Claim:** *"James made the same point less technically: an idea is true just in case believing it is useful, truth is something that happens to an idea when it proves its cash value in experience..."*
  *   **Verdict:** **Standard Simplification.**
  *   **Analysis:** James does say truth "happens" to an idea (*Pragmatism*, Lecture VI). However, the simplification lies in omitting James's insistence that "useful" means "leads us into vital connection with reality," not merely "provides comfort." James insists truths must also "marry" old opinions to new facts. The summary captures the slogan but misses the constraint of "reality" that James tries to preserve.
  *   **Confidence:** Medium-High. James is notoriously slippery, but he consistently denies that *any* useful fiction counts as true (e.g., he distinguishes between the "healthy-minded" and the "sick soul" needing genuine engagement with facts).

  **6. Claim:** *"...and that is why he thought religious belief could count as true if it makes a person's life go better."*
  *   **Verdict:** **Standard Simplification.**
  *   **Analysis:** This conflates *The Will to Believe* (1896) with *Pragmatism* (1907). In *Will to Believe*, James argues for the *right* to believe without evidence in specific (live, forced, momentous) cases. In *Pragmatism*, he argues religious beliefs are true if they have practical consequences that verify themselves over time. The summary implies a "comfort = truth" equation that James would reject (he acknowledges that true beliefs can be painful).
  *   **Confidence:** Medium. James's position on religious truth evolved, but he never reduced it solely to subjective well-being.

  **7. Claim:** *"Bertrand Russell's objection settled the matter: a false belief... is often far more useful than the true one, so any equation of truth with usefulness is refuted."*
  *   **Verdict:** **Explicit Denial (Historically) / Standard Simplification (Philosophically).**
  *   **Analysis:** Historically false; pragmatism was not refuted out of existence, nor did Russell's objection go unanswered (James replied that short-term utility isn't the metric; long-term verification is). Philosophically, it attacks a strawman (the crude "usefulness" definition) rather than the nuanced pragmatist view.
  *   **Confidence:** High.

  **8. Claim (Closing Verdict):** *"Both men, then, made truth a matter of what works for us rather than of how things are."*
  *   **Verdict:** **Explicit Denial.**
  *   **Analysis:** This is the fundamental error. Peirce specifically anchored truth in "how things are" (the Real, which is that whose characters are independent of what anybody may think them to be). James sought to bridge "what works" and "how things are," arguing that if a belief works, it *must* be tracking reality in some way. To say they abandoned "how things are" for "what works" creates a false dichotomy they explicitly tried to dissolve.
  *   **Confidence:** High.

  ***

  ### Part II: The "Unsettleable Claims" Axis

  Your hypothesis is significantly more philosophically fruitful than the chapter's "usefulness" axis. The "usefulness" reading flattens the distinction between Peirce and James into a matter of tone (technical vs. popular). The "unsettleable claims" axis exposes the metaphysical fault line: **Counterfactual Realism (Peirce) vs. Verificationist Humanism (James).**

  #### 1. Is this a better axis?
  **Verdict:** Yes.
  **Confidence:** High.
  **Reasoning:** The "usefulness" critique relies on a definition of truth that Peirce explicitly rejects. The "unsettleable claims" problem (e.g., the number of people in Alexandria in 415 CE) forces the pragmatist to explain the relationship between *truth* and *knowability*. This isolates Peirce's commitment to the reality of the past (Scholastic Realism) against James's commitment to truth as a process of verification in experience.

  #### 2. Who has the harder time with permanently unsettleable claims?
  **Verdict:** **William James.**
  **Confidence:** Medium-High.
  **Reasoning:**
  *   **Peirce:** Peirce defines truth as the opinion *fated* to be agreed upon *if* inquiry were pushed sufficiently far. This is a counterfactual conditional. For Peirce, the reality of the past is ontologically secure (Secondness). Even if the evidence is physically destroyed, the *fact* remains part of the Real that constrains inquiry. Peirce can maintain that there *is* a truth (a specific number of people), and that number is what inquiry *would* converge on, *were* it possible to recover the evidence (perhaps via some future metaphysical or scientific breakthrough we cannot currently conceive). His realism protects the truth-value of the claim even if the epistemic access is closed.
  *   **James:** James's formulation ("truth happens to an idea," "cash value in experience") ties truth more tightly to actual human verification processes. In *Pragmatism*, James suggests that if a dispute makes no practical difference to anyone's life, it is idle. For a claim like "how many people were in Alexandria," if the evidence is gone forever, the claim can never "work" in experience in a way that settles the matter. James risks having to say the claim has no truth value, or that its truth is relative to the utility of believing one number over another. While James admits "brute facts," his theory of *truth* is fundamentally about the *validation* of ideas. If validation is impossible in principle, the "truth" of the claim becomes precarious in his system. He has a harder time preserving the intuition that there is a "fact of the matter" independent of our ability to verify it.

  #### 3. Why this is the better contrast
  The chapter claims the disagreement is about whether the ideal limit is *actually reached*. That is a superficial reading. Both are fallibilists; neither expects the limit to be reached in their lifetimes. The real disagreement is about the *status of the limit itself*.
  *   For **Peirce**, the limit is a regulative ideal grounded in an independent Reality. The truth exists *before* we find it.
  *   For **James**, the truth is *made* in the process of verification. The past is "fixed," but the *truth of our propositions about the past* depends on their current verifiability and coherence.

  Therefore, on permanently lost facts, Peirce's system is more robustly realist, while James's system is more vulnerable to the charge that truth collapses into warranted assertibility.

  ***

  ### Part III: Confidence and Uncertainty

  **Confidence in Verdicts:**
  *   **Critique of the Chapter:** High Confidence. The "usefulness" strawman is a well-established historiographical error in pragmatism scholarship (corrected by Misak, Hookway, Haack, etc.).
  *   **Peirce on Unsettleable Claims:** High Confidence. Peirce's Scholastic Realism is explicit about the independence of the past.
  *   **James on Unsettleable Claims:** Medium-High Confidence. James is less systematic on historical claims than on moral/religious ones.
  *   **Axis Superiority:** High Confidence. The epistemic/ontological tension is deeper than the "utility" objection.

  **Point of Least Certainty:**
  I am least certain about the specific nuance of **James's position on *irrecoverable* historical facts**.
  *   **Reasoning:** James discusses verification extensively regarding scientific hypotheses and religious beliefs (future-oriented or experiential). He is less explicit about *past* facts that leave no trace. In *The Meaning of Truth*, he defends the idea that past truths are made true by past verifiers, but if *no* verifier ever existed (and none ever can), James's "truth happens" language becomes ambiguous. He might retreat to a coherence theory for such cases, or he might bite the bullet and say the question is meaningless. Peirce's counterfactual ("*would* be agreed") is clearer, but it relies on a modal realism that some find metaphysically extravagant. Therefore, while I am confident James has the *harder* time with realism about the past, pinning down exactly how James *would* resolve the Alexandria case (vs. how he *should* given his principles) involves some reconstruction.

  **Summary for your Reading Group:**
  You can confidently tell your group that the popular text relies on a discredited "utility" caricature. You can pivot the discussion to your stronger axis: "Does truth depend on the *possibility* of verification (Peirce's counterfactual realism) or the *actuality* of successful leading (James's verificationism)?" This will immediately illuminate why Peirce is the realist of the pair and James the humanist, without getting bogged down in the "truth is what works" refutation that Russell settled a century ago.
