  Hey, it was great catching up the other day, and I have been thinking about what you told me regarding Maya's views on reasons. It is a fascinating puzzle because she seems to be holding together two ideas that often pull in opposite directions. On one hand, she clearly thinks reasons have to come from inside the agent, since she says the comfortable amoralist has no reason to be moral and the gambler has no reason to stop just because he would feel bad in a scenario that never happens. On the other hand, she thinks objective facts matter even when the agent is ignorant, since she says the donor has a reason to switch charities despite never knowing the truth. If I had to put money on it, I would say Maya is running a system of informed internalism, which means she thinks you have a reason to do something if it aligns with what you would want after thinking clearly and knowing the facts, rather than just what you happen to want right now.

  Based on that, I predict she will say that Dan does have a reason to apologize, but the woman with the promise does not have a reason to keep it. Dan is similar to the charity donor in that there is an objective fact about his own standards that he is missing, and fixing that error creates a reason even if he does not feel it yet. The woman with the promise is similar to the donor but in reverse, where the objective fact about the cost to her kid undermines the desire itself, so even though she wants to keep it now, the reason vanishes under scrutiny. This fits her pattern of letting objective reality dictate the reason rather than just subjective feelings.

  There are two main rules that fit her past verdicts equally well, though. The first is actualist internalism, which says reasons depend on what you actually care about right now, combined with objective facts about how to satisfy those cares. The second is idealized internalism, which says reasons depend on what you would care about if you were fully informed and rational. Both rules explain why the amoralist has no reason, why the smoker does, and why the gambler does not, since his counterfactual loathing never actually activates. Both also explain the charity case, since one views it as satisfying the actual desire to help more effectively, and the other as satisfying the informed desire to help.

  Between your two new cases, the one about Dan does more to separate those rules. The promise case is largely about factual ignorance, which the charity case already settled in favor of objective facts mattering. If Maya says the woman has no reason, it just confirms that facts matter, which we already knew from the charity scenario. The Dan case is different because it tests whether a disposition to care counts as caring. The gambler case suggested that counterfactual feelings do not count, but Dan is not just a hypothetical feeling; he has actual standards that logically imply he should care. If Maya says Dan has a reason, she is prioritizing the idealized rule over the gambler precedent, which is a much bigger tell about her system than the promise case would be.

  To settle this for good, you should bring her a case about conflicting desires rather than ignorance. Imagine someone who genuinely wants to be healthy and also genuinely wants to smoke, knowing full well that smoking harms health, and she values the pleasure of smoking more in the moment. The actualist rule says she has a reason to smoke because it satisfies her strongest actual desire. The idealized rule might say she has no reason to smoke if rational reflection would prioritize her long-term health commitment over her short-term urge. This isolates the question of whether reasons come from current desires or refined values without the confusion of unknown facts, and her answer there would lock down exactly where she draws the line.
