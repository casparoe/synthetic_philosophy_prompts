  2.  **Evaluate the Skeleton & Identify Problems:**
      *   *Ratio (12 tokens / 22 players):* This is roughly 55%. It's competitive but not desperate. If the goal is to show *structural constraint*, scarcity needs to be the driver. If there are too many tokens, effort drops to zero. If too few, effort skyrockets. 12/22 is okay, but maybe slightly tighter (10/22) makes the constraint more visible. Let's stick close to 12/22 but ensure the cost/benefit ratio makes over-bidding irrational *unless* you fear others over-bidding. Actually, the core insight is that the *cap* determines the total effort, not the psychology.
      *   *Revealing Bids:* If bids are revealed, Round 3 (imitators) becomes trivial or chaotic. If bids are secret, students can't verify the "median." Secret bids are better for the "black box" feel, but they need feedback on the *outcome* (total effort) to write their explanations.
      *   *Slip Passing:* Handing out slips to 1/3 of the class secretly is logistically messy and risks breaking the "common knowledge" frame. It's better to announce rule changes globally but assign *roles* or simply change the *incentive structure* for everyone in a way that mimics the psychological shift. However, the prompt specifically wants "wildly different psychologies." A better way: Announce a "Policy Change" that *effectively* changes the psychology without needing secret slips. Or, keep the slips but make them public roles? No, secret is better for the "explanation" phase. Let's refine the slip mechanism to be less prone to error. Actually, the prompt asks to fix the holes. Secret slips are high friction. *Fix:* Make the rule changes global but framed differently, OR accept the friction but streamline it. Let's go with global rule changes that *simulate* the psychological shifts to save time, OR keep the slips but make the groups pre-assigned (seating chart). Pre-assigned seating is safer.
      *   *The "Rigged" Objection:* Students will say "Of course total effort tracked the tokens, you set the tokens." This is actually the *point*, but it needs to land as a discovery, not a premise. The debrief must handle this.
      *   *Coordination/Cheating:* If a sharp student organizes the table to minimize effort (collusion), this *proves* the point (agency changed the outcome), but it might ruin the "structural constraint" lesson if they succeed too well. Actually, if they collude to lower effort, they are demonstrating *agency*. If the structure forces them back up, that's structure. If they succeed, it shows structure isn't everything. The prompt asks how to steer this. *Steer:* Acknowledge it as a change in the "micro-foundations" but ask if the *constraint* disappeared.
      *   *Time:* 80 minutes is tight for 5 rounds + debrief. 5 rounds might be too many. 3 rounds might be enough to show the pattern. Let's aim for 3 distinct regimes + 1 policy tweak.
      *   *Schelling Contrast:* Schelling shows order from disorder. This game needs to show *stability* across different disorders.

  3.  **Refining the Game Mechanics:**
      *   *Core Mechanic:* All-Pay Auction with a Cap.
      *   *Payoff:* Token Value (V) - Effort Cost (C).
      *   *Constraint:* Only N tokens available.
      *   *Goal:* Show that Total Effort $\approx$ N $\times$ (Marginal Cost to win).
      *   *Rounds:*
          1.  Baseline (Selfish).
          2.  Altruistic/Team (Shift motivation).
          3.  Conformist (Shift heuristic).
          4.  Structural Change (Change Token Count or Cost).
      *   *Logistics:* 22 students. 12 Tokens.
      *   *Secret Slips:* Too slow. Let's assign "Types" on the index cards they pick up at the door, or just announce global rule changes that *feel* like psychological shifts. Actually, the prompt wants "wildly different psychologies." Let's keep the secret slips but simplify. *Better:* Divide the room into three sections. Tell Section A they are selfish, Section B they are team players, Section C they are conformists. This is faster than passing slips.
      *   *Feedback:* After each round, announce: Total Effort Sum, Number of Winners, Average Bid. Do *not* announce individual bids.
      *   *The "Rigged" Beat:* Save the token count reveal for the very end of the data collection, or make it common knowledge but ask them to ignore it in their explanation. No, make it common knowledge. The point is they *ignore* it in their explanations.

  4.  **Addressing the Specific "Holes":**
      *   *Ratio:* 12 tokens for 22 people is good. It creates scarcity without hopelessness.
      *   *Revealing Bids:* Do not reveal individual bids. Reveal aggregate stats only. This preserves the "black box" of individual psychology.
      *   *Slip Passing:* Use seating sections. Pre-print instructions on colored paper placed on seats before class. Saves 10 minutes.
      *   *The "Rigged" Objection:* This is the climax of the debrief. "You say it was rigged. That is exactly my point."
