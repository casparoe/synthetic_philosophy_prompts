      *   *Limitation:* The game shows *structural constraint*, not *causal power* of social entities. It shows supervenience without reduction. It doesn't show social entities *doing* things (like a corporation suing).

  5.  **Drafting the Plan (Iterative refinement):**
      *   *Time:* 80 mins.
      *   *Intro:* 5 mins.
      *   *Rounds:* 4 rounds x 10 mins (instruction + bid + tally + write explanation) = 40 mins.
      *   *Debrief:* 35 mins.
      *   *Buffer:* 5 mins.
      *   *Materials:* Index cards (pre-colored), poker chips (tokens), whiteboard.
      *   *Rules:* Clarify the "Cost" and "Value".
      *   *Debrief Questions:* Move from "What happened?" to "Why?" to "What does this mean for explanation?"

  6.  **Addressing the "Sharp Student" Scenario:**
      *   If they collude to bid 1 each: Total effort = 12 (if 12 bid) or 22 (if all bid).
      *   If they collude to bid 0: Total effort = 0.
      *   *Steering:* If they coordinate to lower effort, ask: "What changed in the room?" (Communication/Trust). "Did the number of tokens change?" (No). "So the *potential* constraint remained, but you altered the micro-foundations." This actually helps the lesson: it shows micro *can* matter, BUT usually it doesn't because coordination is hard. The structural constraint is the *default* attractor.
      *   *Better Steering:* If they coordinate, point out that coordination *itself* is a social fact that now needs explaining. You haven't escaped social explanation; you've just pushed it back one step.

  7.  **Final Polish on Terminology:**
      *   Ensure no forbidden words until the end.
      *   Ensure the Schelling distinction is clear (Stability vs. Emergence).

  8.  **Review against Constraints:**
      *   22 people.
      *   80 mins.
      *   No computers.
      *   Fix the skeleton's holes.
      *   Predict failures.
      *   Identify the game's limitation.

      *(Self-Correction during drafting)*: 5 rounds is too many for 80 mins with 22 people to tally. Tallying 22 cards takes time. Let's cut to 3 substantive rounds + 1 policy twist.
      Round 1: Baseline.
