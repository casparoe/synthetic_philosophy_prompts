answer: |-
  Democratic backsliding is not an essentially contested concept if operationalized as the unilateral alteration of institutional rules governing political competition to increase the cost of reversal for opponents, distinct from policy outputs, regardless of electoral mandate.

  ### The Decision Procedure

  **Step 1: The Prior-State Threshold (Baseline & Prior-State)**
  *Question:* Did the country meet a minimal threshold of electoral competitiveness (free elections, universal suffrage, basic civil liberties) immediately preceding this change?
  *   **Source:** Use existing indices (e.g., V-Dem Electoral Democracy Index > 0.5) or senior editor baseline file.
  *   **Verdict:** If **No**, stop. Code as **Not-Backsliding (Non-Consolidation)**. You cannot slide from a floor that does not exist.
  *   **Verdict:** If **Yes**, proceed to Step 2.
  *   **Handling Disagreement:** If coders disagree on the baseline status using provided indices, flag for **Senior Editor Review**. Do not code until baseline is settled. This resolves the "no canonical design" objection by fixing the *status quo ante* as the baseline, not an ideal type.

  **Step 2: The Rules vs. Outputs Filter (Institutional Design)**
  *Question:* Does this change alter the *rules of selection* or *authority distribution* (e.g., who appoints judges, how votes are counted), or does it merely alter *policy outcomes* within existing rules (e.g., tax rates, immigration quotas)?
  *   **Verdict:** If **Policy Output**, stop. Code as **Not-Backsliding**. Disliking a policy is not democratic erosion.
  *   **Verdict:** If **Institutional Rule**, proceed to Step 3.
  *   **Rationale:** This draws the line tightly enough that a policy you dislike is not automatically constitutional sabotage.

  **Step 3: The Symmetry Test (Partisanship)**
  *Question:* If the current opposition party gained power tomorrow and enacted this exact same institutional change using the same legal mechanism, would your team classify it as a threat to democratic competition?
  *   **Verdict:** If **No** (i.e., you would accept it from them), stop. Code as **Not-Backsliding (Partisan Bias Risk)**. This prevents the concept from becoming a label for reforms you dislike only when enemies enact them.
  *   **Verdict:** If **Yes**, proceed to Step 4.
  *   **Exit Valve:** If coders genuinely disagree on the symmetry hypothetical based on ideological values rather than institutional mechanics, flag for **Contested-Do-Not-Code**. This acknowledges essentially contested elements without forcing a false positive.

  **Step 4: The Ratchet Test (Reversibility)**
  *Question:* Can a simple legislative majority reverse this change after the next scheduled election without supermajorities, constitutional amendments, or consent from the appointees created by this change?
  *   **Verdict:** If **Yes** (Easy Reversal), stop. Code as **Not-Backsliding (Normal Politics)**. A reversible tilt is competition, not erosion.
  *   **Verdict:** If **No** (Hard Reversal), proceed to Step 5.
  *   **Key Indicator:** Who controls the referees who adjudicate reversal? If the change places the referees under the control of the beneficiaries, it is a ratchet.

  **Step 5: The Aggregation Rule (Salami-Slicing)**
  *Question:* Is this the second or third institutional change affecting the *same lever of control* (Judiciary, Electoral Administration, Media Regulation, Security Apparatus) within a rolling 24-month window?
  *   **Verdict:** If **No** (Isolated Incident), proceed to Step 6.
  *   **Verdict:** If **Yes** (Sequence), stop. Code as **Backsliding**.
  *   **Rule:** Pool changes by lever, not by bill. Three minor tweaks to judicial appointment rules over two years count as one major lever change. This solves the salami-slicing problem by measuring cumulative control rather than individual legal validity.

  **Step 6: The Mandate & Trade-off Check (Elitism & Values)**
  *Question A (Mandate):* Was this specific institutional change explicitly detailed in the winning party's manifesto and campaigned upon as a constitutional reform, rather than a policy goal?
  *   **Question B (Trade-off):** Does the change increase majoritarian efficiency (e.g., passing laws faster) while decreasing institutional constraints (e.g., judicial review)?
  *   **Verdict:** If **Yes to Mandate** BUT **Yes to Trade-off (Constraints Decreased)**, proceed to **Senior Editor Review**. An electoral mandate validates policy, not the rewriting of the rules that enable fair competition. This is a values handoff.
  *   **Verdict:** If **No to Mandate** (Surprise Change) OR **Yes to Trade-off**, Code as **Backsliding**.
  *   **Rationale:** This confronts the "elitism" objection. Voters can mandate policy; they cannot mandate the dismantling of checks without triggering a backsliding code, because democracy requires more than majority rule.

  ---

  ### Application to Cases

  **Case 1: Supermajority Court Rewrite**
  *   **Step 1 (Prior-State):** Assume Hungary/Poland baseline met threshold previously. **Pass.**
  *   **Step 2 (Rules):** Changes appointment rules and term lengths. **Institutional Rule. Pass.**
  *   **Step 3 (Symmetry):** If opposition did this to lock in their judges past the next election, would it be called dangerous? Yes. **Pass.**
  *   **Step 4 (Ratchet):** Terms extend past next election; reversal requires waiting out extended terms or new supermajority. **Hard Reversal. Pass.**
  *   **Step 5 (Aggregation):** Likely part of a sequence (typical of this profile). Even if isolated, Step 4 is strong.
  *   **Step 6 (Mandate):** Rarely is "extending judge terms to past next election" a specific manifesto promise.
  *   **Verdict:** **Backsliding.** The procedure captures the ratchet effect and the asymmetry of locking in power.

  **Case 2: Partisan Election Administration**
  *   **Step 1 (Prior-State):** US State baseline met. **Pass.**
  *   **Step 2 (Rules):** Moves authority from bipartisan commission to partisan officeholder. **Institutional Rule. Pass.**
  *   **Step 3 (Symmetry):** If the other party moved election admin to their partisan officeholder, would it be called dangerous? Yes. **Pass.**
  *   **Step 4 (Ratchet):** Can a simple majority reverse this? Usually requires legislation which the new officeholder can obstruct or veto via party control. **Hard Reversal. Pass.**
  *   **Step 5 (Aggregation:** Tightening mail-ballot rules + admin change. Two levers (Administration + Voting Access) in one window. **Pass.**
  *   **Step 6 (Mandate):** "Fraud prevention" is a policy goal, not a mandate to partisanize the referee.
  *   **Verdict:** **Backsliding.** The procedure ignores the stated intent (fraud) and focuses on the institutional shift of referees to partisan control.

  **Case 3: Reformist Court Expansion (The Hard Case)**
  *   **Step 1 (Prior-State):** Baseline met, though court was obstructive. **Pass.**
  *   **Step 2 (Rules):** Expands court size and fills seats immediately. **Institutional Rule. Pass.**
  *   **Step 3 (Symmetry):** If the *previous* conservative majority had expanded the court to fill it when they won, would your team call it backsliding? Yes, that is the definition of court-packing. **Pass.**
  *   **Step 4 (Ratchet):** New judges serve long terms; reversal requires waiting out terms or another expansion. **Hard Reversal. Pass.**
  *   **Step 5 (Aggregation):** Assuming isolated, but Step 4 is sufficient.
  *   **Step 6 (Mandate):** Explicit manifesto promise. **Yes.** However, it degrades institutional constraint (independence) for majoritarian efficiency (agenda implementation).
  *   **Verdict:** **Backsliding (flagged for Senior Editor).**
  *   **Analysis of Instinct:** Your instinct is that this is *repair*. The procedure says *backsliding*. The defect is in your instinct, not the procedure. You are conflating *substantive justice* (the court was blocking good laws) with *procedural democracy* (the court was an independent check). Democratic backsliding measures the erosion of procedural constraints on power, not the morality of the outcomes those constraints produce. If you code this as "repair," you validate the principle that whoever wins the election owns the judiciary, which is the exact logic autocrats use. The procedure correctly identifies that expanding a court to fill it is a ratchet, regardless of the virtue of the fillers.

  ---

  ### Limitations and Conclusion

  **Judgment Calls Dressed as Procedure**
  Step 3 (Symmetry) and Step 6 (Mandate vs. Constraint) are value judgments operationalized as questions. Coders must imagine a counterfactual world (Symmetry) and weigh competing democratic goods (Trade-off). No algorithm removes this; we have merely standardized the intuition.

  **What the Procedure Cannot Do**
  It cannot distinguish between a "democratic crisis" that requires extraordinary measures and a "power grab" disguised as crisis management. Case 3 illustrates this: if the prior court was genuinely illegitimate (e.g., rigged elections put them there), expansion is repair. If the prior court was merely conservative, expansion is backsliding. The procedure assumes the prior state was legitimate (Step 1). If the prior state was *legally* democratic but *substantively* corrupt, the procedure will code necessary repairs as backsliding. It prioritizes stability over justice.

  **Does It Answer Your Friend?**
  Yes, on three grounds. First, it defeats the "partisan label" claim via the Symmetry Test (Step 3); if you wouldn't code it against your side, you cannot code it against theirs. Second, it defeats the "no baseline" claim via the Prior-State Threshold (Step 1); we measure slide from the *existing* floor, not an ideal ceiling. Third, it defeats the "elitism" claim via Step 6; we acknowledge mandates but distinguish policy mandates from constitutional rewiring. However, it concedes his point on disputed cases: Step 3 and Step 6 include exit valves for **Contested-Do-Not-Code** or **Senior Editor Review**. This admits that where values fundamentally diverge on the legitimacy of the prior state or the trade-off between majority rule and minority rights, coding is impossible. The procedure does not eliminate disagreement; it isolates it to specific value judgments so it does not contaminate the measurement of institutional ratchets.
