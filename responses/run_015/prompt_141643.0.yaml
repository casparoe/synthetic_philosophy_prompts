  You are not mad, and your supervisor's margin note ("role-content decoupling") is, as you suspect, a placeholder that papers over the ontological unease you're feeling. It treats the problem as a functionalist bookkeeping error, whereas you have identified a structural feature of emergent representation.

  Here is the carving you are looking for.

  ### 1. The Nearest Established Concepts (and Why They Miss)

  There is no single canonical term for this specific configuration, but your description triangulates three existing concepts. Understanding why they *almost* fit will help you define the gap.

  **A. The Grain Problem (Dennett)**
  *   **The Concept:** How do smooth, high-level properties (beliefs, meanings) arise from grainy, low-level substrate (neurons, ants)?
  *   **Why it fits:** You are describing the mismatch between the ant-scale grain and the colony-scale smoothness.
  *   **Why it misses:** The Grain Problem is usually about *how* the macro emerges from the micro. Your problem is about *where the content lives* relative to the vehicle. In the Grain Problem, the content is usually about the *world*. In your case, the content is often about the *substrate itself* (the colony's own workforce).

  **B. Relational Supervenience**
  *   **The Concept:** A macro-state supervenes not on the intrinsic properties of the parts, but on the *relations* between them.
  *   **Why it fits:** This explains your "Flip Case." If the ants' dispositions (intrinsic properties) stay fixed, but the colony verdict flips because of where they are standing (relations/configuration), the macro-state supervenes on the topology, not the tokens.
  *   **Why it misses:** Relational supervenience is a metaphysical claim about dependence. It doesn't capture the *semantic* weirdness of the "Self-Directed Case"—specifically, the fact that the content is *about the system* but *unlocalized within the system*.

  **C. Distributed Cognition (Hutchins)**
  *   **The Concept:** Cognitive states are not bounded by the skin but distributed across agents and tools.
  *   **Why it fits:** It validates that the "vehicle" is the whole colony.
  *   **Why it misses:** Distributed cognition usually focuses on how a group solves a problem *external* to the group (navigating a ship). It rarely addresses the reflexive case where the group represents *its own internal state* without a central monitor.

  ### 2. The Carving: "Reflexive Semantic Dislocation"

  Since no established term captures the specific unease of a system representing itself at a level invisible to its constituents, I propose you coin the term **Reflexive Semantic Dislocation**.

  **Definition:**
  Reflexive Semantic Dislocation occurs when a system's representational state satisfies two conditions:
  1.  **Content Reflexivity:** The truth conditions of the state refer to the systemic properties of the vehicle itself (e.g., "we are short on foragers").
  2.  **Vehicle Dislocation:** No proper subset of the vehicle's constituents contains sufficient information to verify those truth conditions, nor does any constituent's causal role map 1:1 onto the semantic content.

  **The Mismatch:**
  In standard cognition, there is a *Vehicle-Content Alignment*. Even in connectionist networks, the weight configuration that *is* the belief has a structural relationship to the content. In Reflexive Semantic Dislocation, the vehicle (ant traffic) is **causally sufficient** for the state but **semantically opaque** to the parts. The content is "dislocated" from the machinery that carries it.

  **Borderline Cases:**
  *   **Clear Case:** Your ant colony. The content "we need foragers" is true, the colony acts on it, but no ant knows "we" refers to the colony, nor does any ant know the forager ratio.
  *   **Borderline Case:** A human immune system. It "detects" self vs. non-self and acts. Is this representation? It has Reflexive Semantic Dislocation (no white blood cell knows "self"), but it lacks the functional flexibility of a cognitive system.
  *   **Non-Case:** A thermostat. It represents temperature, but the content is not *reflexive* (it's not about the thermostat's own state), and the vehicle is localized (the bimetallic strip).

  ### 3. The Flip Case vs. The Self-Directed Case

  Your reading group is split because these look like different phenomena (one is about *change*, one is about *reference*). They are not. They are the static and dynamic views of the same structural property.

  *   **The Self-Directed Case** is the **Structural Description**. It describes the *topology* of the representation: the content points to the whole, but the vehicle is scattered.
  *   **The Flip Case** is the **Dynamic Consequence**. Because the content is fixed at the macro-level (colony needs) while the vehicle is fluid at the micro-level (ant turnover), you can swap micro-tokens without altering the macro-state, *until* the relational configuration crosses a threshold.

  When the colony verdict flips (North to South) with no individual ant changing dispositions, it proves that the **semantic boundary does not respect the physical boundaries of the constituents.** The "belief" is not in the ants; it is in the *field of relations* between them.

  **Verdict:** They are one phenomenon. The Flip Case is simply the empirical proof of the Dislocation described in the Self-Directed Case. If the content were localized in the ants, swapping ants (with identical dispositions) would not flip the verdict. The fact that it *can* flip based on positioning alone proves the content is dislocated from the individual tokens.

  ### 4. Is This Special to Colonies?

  No. If you can articulate this clearly, it applies to at least two other domains, which will strengthen your defense.

  **A. The Brain (Neural Populations)**
  *   **The Mismatch:** A specific memory engram is not in one neuron. It is distributed.
  *   **The Dislocation:** Sometimes, the content is about the *organism's state* (e.g., homeostatic regulation, pain). No single neuron represents "I am in pain." The representation is dislocated across the network.
  *   **The Flip:** In neural plasticity, a functional state can be maintained even as specific synaptic weights change (degeneracy). Conversely, a functional flip can occur via neuromodulation without changing the structural connectivity (changing "which ants are alive" analogously to changing the chemical milieu).

  **B. Institutions (Bureaucracies)**
  *   **The Mismatch:** A university "decides" to cut funding.
  *   **The Dislocation:** The content ("we are broke") is about the institution. The vehicle is emails, meetings, forms. No individual administrator holds the full representation of "the university is broke." They only see their budget line.
  *   **The Flip:** The institution can shift policy (North to South) even if every individual employee retains the same job description and dispositions, simply due to turnover or restructuring (changing the relational topology).

  ### 5. Strategy for the Defense

  Your supervisor's "role-content decoupling" suggests they want you to argue that the causal role (ants moving) and the content (food is north) are independent variables. **Do not accept this framing.** It implies they *could* come apart. Your insight is stronger: they are *inseparable but scale-relative*.

  **The Argument to Defend:**
  1.  **Reject Local Supervenience:** Argue that mental states in superorganisms do not supervene on the intrinsic states of the constituents. They supervene on the *relational configuration*.
  2.  **Defend Real Patterns:** Use Dennett's "Real Patterns" to argue the colony state is not an "as if" stance. It is causally potent *because* it is dislocated. If the content were localized in a "queen ant" or "leader," the system would be more fragile. The dislocation is a feature, not a bug.
  3.  **Reframe Externalism:** You are right that this isn't standard content externalism. Standard externalism says content depends on the *environment*. You are describing **Structural Internalism**: the content depends on the *internal structure* of the system, but that structure is invisible to the parts. Call it **Opaque Internalism**.

  **The Term to Use:**
