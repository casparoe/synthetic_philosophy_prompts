  The root split determines whether Hobbes is read as a competitor to Euclidean truth (Substance) or a reformer of Euclidean rigor (Formulation). This dictates whether his errors are categorized as falsehoods or alternative axiomatizations. The ontological branch (Q2) isolates the source of geometric certainty: if objects are physical (A.1), truth depends on causal mechanics; if linguistic (B.1), truth depends on definitional consistency. The circle-squaring branch (Q3) acts as the ultimate stress test for the interpretation: a "Proto-Formalist" can tolerate Hobbes's quadrature as internally consistent, whereas the "Standard" view must condemn it as objectively false.

  **Logical Combinations and Unoccupied Leaves**
  1.  **The Empty Constructivist Leaf (A.1.ii):** This leaf is logically coherent but historically empty. It demands that Hobbes's geometry be valid *only* if executable by finite physical tools. It is awkward because Hobbes's own preferred quadratures involved steps (such as specific arc-straightenings) that were not demonstrably finite or constructible by strict ruler-and-compass rules, even by the standards of his contemporaries like Wallis. The interpretation collapses because Hobbes failed his own proposed criteria.
  2.  **The Unoccupied "Contingent Limitation" Leaves:** No major scholarship argues Hobbes viewed the circle squaring as merely a tool limitation. He either believed he had solved it (Resolved) or, according to critics, failed at something impossible (Principled Impossibility). The middle ground suggests Hobbes thought it *could* be done with better tools but hadn't done it himself, which contradicts his aggressive claims of discovery.
  3.  **The Unoccupied "Mental Construction" Branches:** Hobbes's vehement materialism makes a pure "Mental Construction" ontology (distinct from physical motion) untenable for most interpreters. While he speaks of "phantasms," these are traces of motion. Consequently, leaves under A.2 and B.3 remain unoccupied by significant scholarly positions.
  4.  **The Proto-Formalist Niche (B.1.i):** This leaf is occupied but precarious. It requires reading Hobbes's insistence on physical definitions as a metaphor for syntactic precision. It survives only if one ignores his explicit claims about physical causality being the ground of truth.
