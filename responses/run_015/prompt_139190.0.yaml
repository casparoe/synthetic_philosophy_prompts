answer: |-
  Brainstorm: I first reached for the heroic individualism reading that reduces the legal failure of the UN to a backdrop for one man's moral triumph, but it is too easy because it bypasses the structural question of why the law required a hero to function at all. I considered the historical accuracy critique that faults the film for omitting the RPF's violence, but it is too easy because it mistakes narrative economy for historical error rather than analyzing why that simplification serves the politics of naming. I also thought to dismiss the Western gaze critique that identifies the journalist's cynicism, but it is too easy because it stops at identity politics without grappling with his epistemological claim about visibility without classification.

  The three scenes you selected do not support the student's proposal to amputate the ranking job; rather, they demonstrate that without the superlative, the legal trigger remains inert and the intent-claim remains invisible. In the exchange with the Western journalist, the camera lingers on the footage of the refugees while the correspondent explains that shock is required to disrupt the domestic routine of the viewer; this scene functions as a direct rebuttal to the idea of a "flat descriptive category," asserting that "ascriptive mass killing" is precisely the kind of phrase one reads while eating dinner, whereas "genocide" is the only lexical unit capable of arresting the hand. The UN officer's insistence on his mandate, contrasted with Paul's desperate invocation of the word at the climax, illustrates the separation between the legal trigger and the moral intent-claim: the officials withhold the name to avoid the duty, while Paul wields the name as a moral weapon that lacks legal efficacy within the diegesis. The closing text, noting the conviction for war crimes rather than genocide, confirms that the legal trigger was never successfully pulled in the record, leaving the ranking job to be performed entirely by the film's narrative arc rather than the court's judgment. These scenes suggest that the film's subject is indeed salience, and that a non-ranking vocabulary would fail harder because it would lack the mobilizing force necessary to convert witness into action.

  However, the film resists this reading in the specific moment Paul screams the word at the General. When Paul accuses the General of genocide, the General does not stop because of the moral weight of the classification; he stops because Paul threatens him with future accountability. This suggests the film knows the superlative has no intrinsic power to prevent atrocity in the moment, only the power to organize memory and punishment after the fact. The film is indeed a naming machine, but it does not fail in nerve by relying on the hierarchy; it knowingly outsources the ranking job to the audience because the legal system abdicated it. It forces us to supply the shudder and the label that the UN withheld, making the viewer complicit in the legal categorization that the treaty system refused to apply. The emotional architecture depends on the hierarchy not to describe the violence accurately, but to compensate for the legal system's refusal to act on that accuracy.

  The film demonstrates that when the legal category refuses to function as a trigger, the cultural category must suffice as a verdict, proving the superlative is indispensable even when the law disowns it.
