answer: |-
  Your hypothesis is incisive and largely correct, but it misses one sociological variable that is arguably the engine driving the epistemological stalemate. You identify the philosophical friction (priors, identity conditions, oral mechanics), but you underweight the disciplinary incentives that lock those positions in place.

  Here is the diagnosis, the path to progress, and the conditions under which this diagnosis would fail.

  ### Diagnosis

  You are right that the two sides share the same facts but operate with different priors. However, this is not merely a philosophical disagreement about where the burden of proof lies; it is a **category error regarding the function of the narrative.**

  The "Invention Default" camp treats these stories as **failed history**. Their metric is correspondence: does the narrative map onto reality? If the map is distorted, the document is flawed. For them, the cost of a false positive (validating a myth) is high: it undermines the discipline's claim to scientific rigor.

  The "Memory Default" camp treats these stories as **successful memory**. Their metric is coherence: does the narrative preserve a cultural experience? For them, the cost of a false negative (erasing a kernel of truth) is high: it enacts a form of colonial or skeptical violence against a culture's self-understanding.

  The stalemate persists because you are debating the *truth value* of the proposition ("Arthur existed"), when the disagreement is actually about the *ontology* of the proposition ("What kind of thing is 'Arthur'?").

  Furthermore, your intuition about professional penalties is the hidden gear in the machine. In modern academic history, the penalty for a false positive is career-limiting (you are branded a credulous romantic), while the penalty for a false negative is negligible (you are a rigorous skeptic). This asymmetry calcifies the "Invention Default" as the professional norm, forcing the "Memory Default" into the position of a populist or nationalist dissent. This is why the debate replays without resolution: one side is playing a professional game of risk mitigation, and the other is playing a cultural game of preservation.

  Finally, lumping Troy, Arthur, and Exodus together obscures the specific evidentiary profiles of each.
  *   **Troy** is an archaeological problem with textual garnish (Hittite records + Hisarlik).
  *   **Exodus** is a theological problem with negative archaeology (no evidence in Sinai/Egypt).
  *   **Arthur** is a textual problem with archaeological silence (post-Roman Britain is a "dark age" precisely because of a lack of records).
  Treating them as a single class of "legendary history" allows participants to smuggle in evidence from one case to support arguments in another (e.g., using Troy's validation to argue for Arthur's plausibility), which keeps the debate fuzzy.

  ### What Would Count as Progress

  Progress will not come from finding new evidence (which is rare) but from **decomposing the question** and **formalizing the priors**.

  **1. Distinguish "Event" from "Referent"**
  Stop asking "Did this happen?" and start asking "What is the referent of this name?"
  *   *Progress:* We agree that "Arthur" may not refer to a single 6th-century warlord (Event) but may refer to a composite of several commanders, or a title (*Dux Bellorum*), or a mythologized memory of a cavalry tactic (Referent).
  *   *Application:* If the "Memory" side concedes that the *narrative details* are invented, and the "Invention" side concedes that the *name* likely anchors to a specific historical anxiety or figure, the binary collapses. We move from "True/False" to "Stratified."

  **2. Bayesian Transparency**
  Make the priors explicit rather than implicit.
  *   *Progress:* Instead of arguing over the evidence, argue over the prior probability. "Given the rate of oral degradation in non-literate societies (X), and the political utility of foundation myths (Y), what is the prior probability that a specific siege narrative survives 500 years?"
  *   *Application:* This forces the "Memory" side to defend the mechanics of transmission, not just the intuition of memory. It forces the "Invention" side to defend the assumption that silence equals absence. It shifts the debate from "You are credulous" vs. "You are cynical" to "Your prior assigns too much weight to oral stability."

  **3. Decouple the Cases**
  *   *Progress:* Acknowledge that Troy, Arthur, and Exodus require different epistemological frameworks.
  *   *Application:* Troy is now largely settled (a war happened, the scale is debated). Exodus is largely settled as theology (no mass migration occurred as described). Arthur remains the true outlier. By separating them, you remove the ability to use Troy's archaeological validation as a shield for Arthur's textual silence.

  ### Where This Diagnosis Is Likely to Fail

  My diagnosis rests on the assumption that this is a rational dispute constrained by evidence and professional incentives. It would fail under the following conditions:

  **1. The Discovery of a "Smoking Gun"**
  If an inscription is found dating to 500 CE naming Arthur at Badon Hill, or if Egyptian records surface confirming a Semitic exodus in the 13th century BCE, the epistemological debate vanishes instantly. The stalemate is a luxury of evidentiary scarcity. If the scarcity ends, the priors become irrelevant.

  **2. The Political Utility Overrides the Historical**
  If the debate is not actually about history but about identity politics, no amount of decomposition will help.
  *   *Exodus:* If the narrative is required for national legitimacy, the "Memory Default" becomes a non-negotiable dogma, not a historical hypothesis.
  *   *Arthur:* If the narrative is required for regional tourism or cultural cohesion, the "Invention Default" is viewed as an attack on heritage.
  If the stakes are political rather than historical, the "cost of error" calculation changes. A false negative becomes politically expensive, which sustains the "Memory Default" regardless of the evidence.

  **3. Advances in Cognitive Archaeology**
  Your hypothesis notes we lack measurements on oral degradation. If cognitive science or anthropology provides a robust model for how long specific types of information (e.g., genealogies vs. battle sites) survive in oral cultures, the empirical question is solved. If we learn that oral traditions *cannot* survive more than 150 years without significant distortion, the "Memory Default" for Arthur (6th century to 9th century texts) becomes empirically untenable. If we learn they *can* survive a millennium (as some Indigenous Australian songlines suggest), the "Invention Default" loses its scientific footing.

  ### Summary
  You are diagnosing a symptom (the argument) rather than the disease (the conflation of history and memory, protected by professional risk aversion). Progress requires separating the *historical kernel* from the *narrative function* and forcing both sides to defend their priors explicitly. However, be prepared for the possibility that the debate persists not because the history is unclear, but because the history is doing work that history is not supposed to do.
