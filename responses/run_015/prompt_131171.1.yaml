answer: |-
  ### The Moral Geography of Empire: Reconstructing Adam Smith via "Sympathetic Jurisdiction"

  The standard interpretation of Adam Smith's political economy casts him as the arch-technocrat of empire, opposing British imperialism primarily on the grounds of allocative efficiency, monopoly distortion, and fiscal imprudence. In this reading, the *Wealth of Nations* (WN) is a ledger book: colonies cost more to defend than they yield in trade, and the East India Company (EIC) is a rent-seeking monopoly that distorts markets. While textually supported, this economic reading risks decapitating Smith's thought, separating the moral philosopher of *The Theory of Moral Sentiments* (TMS) from the political economist of WN.

  A more coherent reconstruction of Smith's anti-imperialism centers on the concept of **sympathetic jurisdiction**. This thesis posits that for Smith, legitimate rule depends on a proximity—both geographic and social—sufficient to allow the mechanism of the "impartial spectator" to operate between governors and governed. Empire fails not merely because it is expensive, but because geographic and social distance attenuate sympathy, corrupting the moral judgment of the ruler and rendering administration tyrannical. By viewing Smith's critiques of the American colonies and the EIC through this moral-psychological framework, we see that administrative failure is, at its root, a failure of moral imagination caused by structural distance.

  #### Theoretical Framework: The Impartial Spectator as a Mechanism of Rule

  In TMS, Smith argues that moral judgment arises from "sympathy" (what we might call empathy), a process where an observer imagines themselves in the situation of another. For this judgment to be "impartial," the observer must be close enough to understand the context but distant enough to avoid self-interest. Crucially, this mechanism requires a feedback loop: the governed must feel they are understood, and the governor must feel the weight of the governed's approval or disapproval.

  "Sympathetic jurisdiction" suggests that political legitimacy is bounded by the reach of this psychological mechanism. When a government rules a people it cannot "sympathize" with—because they are too far away, culturally alien, or structurally invisible—the impartial spectator collapses. The governor no longer judges actions by how they affect the subject, but by how they affect the governor's own interest or abstract metrics (like revenue). Thus, distance does not just raise transaction costs; it severs the moral tether of accountability.

  #### The American Colonies: The Attenuation of Legislative Sympathy

  Smith's treatment of the American colonies in WN (Book V) is often read as a critique of mercantilist trade restrictions. However, the specific administrative failures he identifies align with a breakdown of sympathetic jurisdiction. Smith argues that the British Parliament's attempt to tax the colonies (e.g., the Stamp Act) failed because the legislators could not accurately gauge the burden imposed.

  In a domestic context, a tax on grain in London is felt by the MP who levies it; the "spectator" in Parliament shares the pain of the constituent. In the imperial context, Smith notes that the distance renders the burden invisible to the metropole. He writes that the colonies are "distant" and that the people there are "not represented." While this sounds like a legalistic argument, Smith's deeper point is psychological: without representation, there is no mechanism to force the British spectator to inhabit the colonial perspective.

  Smith famously entertained the idea of colonial representation in Parliament as a theoretical solution. Why? Not merely to balance a budget, but to bring the colonial voice into the room where the "impartial spectator" of British legislation resides. By admitting colonial representatives, the distance would be bridged, forcing British MPs to confront the colonial reality. However, Smith concedes this is impractical due to the sheer geographic distance. Here, the economic argument (it's too hard to manage) serves the moral one: because the distance prevents the operation of sympathy, the jurisdiction is illegitimate. The administrative failure—rebellion and mismanagement—is the inevitable result of a legislature trying to rule a people whose suffering it cannot imagine.

  #### The East India Company: The Corruption of the Merchant-Sovereign

  The case of the East India Company offers even stronger evidence for the sympathetic jurisdiction thesis. Standard economics focuses on the EIC's monopoly power. Smith, however, focuses on the *character* of the rulers. He draws a sharp distinction between the natural interests of a sovereign and the interests of a merchant.

  Smith argues that a sovereign, even if negligent, is structurally compelled to care for the people because the sovereign's revenue depends on the general prosperity of the territory. The merchant-sovereign, however, answers to shareholders in London. Smith writes in WN: "The interests of the sovereign and those of the people... are exactly the same. But the interests of the merchants... are not the same."

  Why are they not the same? Because of the breakdown of the spectator. The EIC official in Bengal is accountable to a director in London whom he will never meet and a populace in India over whom he holds absolute power.
  1.  **Distance from the Subject:** The official does not live permanently in the territory he rules (rotation was common). He has no stake in the long-term flourishing of the land, only in the short-term extraction of profit. He cannot sympathize with the Indian subject because his tenure is temporary and his social circle is exclusively European.
  2.  **Distance from the Master:** The directors in London cannot judge the official's conduct because they are too far away to verify facts. They judge by the bottom line (dividends), not by justice.

  Smith describes the resulting administration as one of "negligence and profusion." This is not merely inefficiency; it is moral corruption. The "impartial spectator" for the EIC official is not the suffering Indian peasant, nor the abstract ideal of justice, but the dividend sheet. Smith's specific condemnation of the EIC's "cruelty" and "oppression" in Bengal cannot be explained by market monopoly theory alone. Monopoly explains high prices; it does not explain famine induced by policy or judicial murder. These are moral failures resulting from a jurisdiction where the ruler is insulated from the moral feedback of the ruled. The geographic distance allows the official to act without shame; the corporate structure ensures he is rewarded for it.

  #### Administrative Failures as Moral Pathologies

  Through the lens of sympathetic jurisdiction, specific administrative failures Smith identifies transform from economic errors into moral pathologies:

  *   **Negligence:** In WN, Smith notes that distant administrators ignore local infrastructure (roads, canals). Economically, this is underinvestment. Morally, it is a failure of sympathy; the administrator does not feel the inconvenience of the traveler or the farmer because he does not travel or farm among them.
  *   **Arbitrary Justice:** Smith critiques the lack of rule of law in colonial settings. In a sympathetic jurisdiction, the judge fears the resentment of the community if he rules unjustly. In empire, the judge is an outsider protected by military force. The "resentment" of the local population cannot reach him emotionally.
  *   **War-Mongering:** Smith observes that colonial administrators often provoke unnecessary wars to gain glory or plunder. This occurs because the costs of war (blood and treasure) are borne by the distant state and the local populace, while the glory is reaped by the administrator. The spectator in London cheers the victory without seeing the cost; the spectator in the colony is silenced by force.

  #### Weaknesses, Counter-Evidence, and Falsification

  While the "sympathetic jurisdiction" reconstruction offers a philosophically rich unity between TMS and WN, it is not without significant vulnerabilities. I must be explicit about where this reasoning is weakest and what evidence would compel a retreat to the standard economic reading.

  **1. Textual Silence and Explicit Priority:**
  The weakest point of this reconstruction is that Smith never explicitly links the "impartial spectator" to imperial jurisdiction in WN. He does not write, "Empire fails because sympathy attenuates." He writes, "Empire fails because it drains capital."
  *   *Counter-Evidence:* If passages in WN regarding empire can be fully explained by cost-benefit analysis without any residual explanatory gap, the moral-psychological reading becomes an unnecessary overlay (a violation of Occam's Razor). For instance, Smith's argument that defense costs outweigh trade profits is purely arithmetic. If Smith treats the "negligence" of administrators solely as a principal-agent problem regarding information asymmetry (a knowledge problem) rather than a moral failure (a sympathy problem), the TMS link is tenuous.
  *   *Falsification:* If one can demonstrate that Smith believed a benevolent, omniscient administrator *could* rule an empire justly despite distance, then the failure is epistemic, not moral-sympathetic. However, Smith's skepticism about human virtue suggests he believed distance *corrupts* virtue, not just hides information.

  **2. The "Knowledge Problem" vs. The "Sympathy Problem":**
  Much of what I attribute to "attenuated sympathy" could be better described as "attenuated knowledge." A London MP might sympathize with a Bostonian if he knew the facts, but he simply doesn't know the facts.
  *   *Counter-Evidence:* If Smith's proposed solutions focus entirely on information gathering (better reporting, audits) rather than structural proximity (representation, local residency), then the issue is epistemic.
  *   *Rebuttal:* Smith's support for representation (bringing the voice closer) and his critique of rotating EIC officials (preventing attachment) suggests he views the *relationship* as the problem, not just the data flow. However, this distinction is fine, and the economic reading can absorb it: representation reduces information costs. To maintain the "sympathetic" reading, one must prove Smith thought *emotional identification* was necessary for justice, not just accurate data.

  **3. Smith's Pragmatism regarding Empire:**
  Smith did not call for immediate, unconditional decolonization on moral grounds. He suggested that if the colonies could be made to pay for their own defense, the empire might be sustainable.
  *   *Counter-Evidence:* If Smith's primary objection to the Stamp Act was that it was *unprofitable* for Britain rather than *unjust* for America, the economic reading wins. In WN, Smith often frames the injustice of monopoly in terms of the loss of wealth to the *metropole*, not the suffering of the *colony*.
  *   *Falsification:* A close textual analysis showing that Smith's metric for "failure" in empire is exclusively GDP/Revenue growth, with no independent variable for "justice" or "liberty," would reject the sympathetic jurisdiction thesis. If Smith cares about the American colonists only insofar as they are British subjects contributing to British wealth, the moral framework collapses into national accounting.

  **4. The Role of Self-Interest:**
  Smith's system relies on self-interest driving prosperity. In the imperial context, he argues that the self-interest of the merchant is incompatible with rule.
  *   *Counter-Evidence:* If Smith argues that the EIC failed simply because the *incentive structure* was misaligned (principal-agent theory), then we do not need TMS. Modern economics explains the EIC's failure without invoking "sympathy."
  *   *Falsification:* If Smith's critique of the EIC can be perfectly modeled using modern principal-agent theory without reference to moral sentiments, virtue, or the "spirit" of the administrator, then the "sympathetic jurisdiction" reading is a romantic projection onto a proto-institutionalist argument.

  #### Conclusion

  Reconstructing Adam Smith's anti-imperialism around "sympathetic jurisdiction" rescues him from being merely a calculator of colonial balance sheets. It posits that for Smith, governance is a moral technology that requires proximity to function. The American colonies rebelled and the East India Company tyrannized not just because the economics were wrong, but because the moral psychology of rule was impossible across such distances. The "impartial spectator" cannot exist when the ruler and the ruled inhabit different moral worlds separated by an ocean.

  However, this reconstruction must remain humble. It relies on synthesizing two texts Smith never explicitly joined. If future analysis demonstrates that Smith's objections to empire were strictly predicated on the wealth of the *nation* rather than the justice of the *relationship*, or if the "sympathy" mechanism can be fully reduced to "information costs," then the standard economic reading must prevail. Until then, viewing Smith's empire through the lens of sympathy offers a profound insight: that legitimate power requires the capacity to feel the weight of the power one wields, a capacity that empire, by its very nature, destroys.
