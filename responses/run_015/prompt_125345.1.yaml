answer: |-
  ok here's the run of play for the pub night. keep it loose, keep the beer flowing, but don't let the logic slip. since you've got law and physics brains in the room, they'll try to formalize this too quick. you need to walk them down the ladder step by step.

  **phase 1: the single ruler (commensurability)**
  before you even mention thresholds or lexical priority, you have to land the idea that pain and pleasure are measurable on the *same* scale. this is the foundation. if they think pain is "red" and pleasure is "blue," you can't have a threshold where one trumps the other.
  *   **the move:** ask them if it makes sense to say "this headache is worth skipping the party." that implies a trade-off, which implies a common currency.
  *   **misconception intercept #1 (right here):** they will jump to say "oh so 1 unit of pain = 10 units of pleasure like converting celsius to fahrenheit." stop this immediately. tell them commensurability just means they sit on the same number line, not that there's a fixed exchange rate. if there was a fixed rate, lexical priority would be impossible (because everything would be tradable). you need them to see the scale without seeing the exchange rate.

  **phase 2: the asymmetry (the threshold claim)**
  once they buy the single scale, introduce the twist. the scale isn't symmetric. there's a point on the negative side where the rules change.
  *   **the move:** propose that below a certain intensity of suffering, the positive side of the scale gets zeroed out. it doesn't matter how much happiness you pile on the other side.
  *   **misconception intercept #2 (right here):** someone will say "so suffering is just *really really* important?" no. clarify that "lexical" means *trumping*, not weighting. it's not that suffering weighs 1,000x more; it's that once you cross the line, the happiness side stops counting entirely. it's a veto, not a heavy weight.

  **phase 3: the carrying example (society A vs B)**
  now hit them with the scenario.
  *   **society A:** 1% of people are in extreme physical torture. the other 99% are living decent, happy lives.
  *   **society B:** 0% torture. but everyone is stuck in low-grade existential dullness. no agony, but no real flourishing either. just kinda meh forever.
  *   **why this works:** it isolates the extreme negative against aggregate neutral/positive. it forces them to choose between "some hell" vs "no heaven."
  *   **what it must lack:** do not let them draw utility curves. no numbers. no "if the happiness is 500 utils..." keep it qualitative. if they start calculating, you've lost the lexical point.
  *   **misconception intercept #3 (right here):** they'll try to visualize the threshold as literally a line on a graph they can draw. remind them the line is moral, not mathematical. it's about the *kind* of experience, not just the intensity meter.

  **phase 4: the check question**
  you need to know if they actually get the dependency between the threshold and the commensurability. don't ask "is suffering bad." ask this:

  *"if i convinced you that pain and pleasure are fundamentally different kinds of things—like length and weight, totally incommensurable—could i still coherently argue for a threshold where pain lexically outranks pleasure?"*

  *   **the right answer:** no. because if they aren't on the same scale, you can't set a threshold *on that scale* where one cancels the other. you'd just have two separate buckets. the threshold claim *needs* them to be on the same ruler to say "below this point on the ruler, the other side doesn't matter."
  *   **the wrong answer:** yes. (means they think lexical priority works even with incommensurability, which breaks the specific version of the theory you're teaching).

  **phase 5: what to refuse**
  be explicit about what you aren't doing. tell them straight up:
  1.  **no formal axiomatics.** we aren't writing out the logic proofs tonight. put the symbols away.
  2.  **no comparison to prioritarianism.** that's a different beast and it'll muddy the water. we're talking about thresholds, not weighting the worse off.

  if they push on those, tell em that's for the next round after everyone's had another pint. keep it focused on the scale and the threshold.

  typo check: hope i didn't miss anything teh important. good luck with the room.
