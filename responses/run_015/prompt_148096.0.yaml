answer: |-
  Here is the specification sheet for a theory of hard choices and incommensurability, structured for a background in formal systems.

  ### I. The Desiderata (The Spec)

  To be taken seriously, a theory must satisfy the following boundary conditions. I have flagged these as **Non-Negotiable (NN)** (required for the phenomenon to exist as described) or **Camp Preference (CP)** (depends on your meta-ethical stance).

  1.  **Failure of Trichotomy (NN):** The theory must formally allow for a relation between options $A$ and $B$ where neither $A > B$, $B > A$, nor $A = B$ holds. Standard ordering is incomplete.
  2.  **The Indifference Distinction (NN):** It must structurally distinguish **Incommensurability** from **Equality**.
      *   *Test:* If $A = B$, randomization (coin flip) is rational. If $A$ || $B$ (incommensurable), randomization is irrational evasion; commitment is required.
  3.  **Rational Regret Symmetry (NN):** Post-choice, the agent must be able to rationally regret the chosen option *and* rationally regret the unchosen option, without implying the choice was erroneous. The "loss" must be real, not epistemic.
  4.  **The Weighing Operator (NN):** It must specify the cognitive mechanism of comparison in the absence of a common metric (scalar). If there is no hidden variable $U(x)$, what function is being computed?
  5.  **Action Guidance (NN):** The theory cannot result in paralysis. It must explain how a decision is finalized without a pre-existing maximization rule.
  6.  **Decision Theory Compatibility (CP):**
      *   *Completeness:* Can the theory violate the axiom of completeness (for all $A, B$, either $A \succeq B$ or $B \succeq A$)? **Yes, this must be violable.**
      *   *Transitivity:* Should it preserve transitivity ($A \succeq B, B \succeq C \implies A \succeq C$)? **Preferred, but risky.** Violating this invites money-pump arguments, but preserving it with incommensurability is mathematically difficult.
  7.  **Normative Realism vs. Constructivism (CP):** Are the values discovered (realist) or created by the choice (constructivist)? A robust theory usually needs to lean constructivist to solve the "Weighing Operator" problem.

  ---

  ### II. Critical Distinctions: Equality vs. Incomparability

  This is the most common point of failure. A theory collapses if it treats incommensurability as "unknown equality."

  *   **Equality ($=$):** The reasons for $A$ and $B$ are of the same kind and magnitude. The "coverage" of value is identical.
      *   *Phenomenology:* "It doesn't matter."
      *   *Decision:* Randomization is optimal.
  *   **Incomparability (||):** The reasons for $A$ and $B$ are of different *kinds*. They occupy orthogonal dimensions in value space.
      *   *Phenomenology:* "It matters immensely, but I can't calculate it."
      *   *Decision:* Randomization is a failure of agency. You must *create* a reason to tip the scale.

  **The Small Improvement Test:**
  If $A = B$, then $A^+$ (A plus a penny) must be $> B$.
  If $A$ || $B$, it is possible that $A^+$ is still not $> B$. The addition of a marginal value doesn't resolve the structural mismatch. A theory fails if it cannot model this stability.

  ---

  ### III. The Missing Comparator & Regret Symmetry

  **1. The Missing Comparator (The Weighing Mechanism)**
  If there is no common scale (no "util"), what is the mental act?
  *   **Standard View:** We are searching for a hidden variable. (Fails NN #1).
  *   **Required View:** The mental act is not *measurement*, it is *integration*. You are not weighing; you are synthesizing a new framework that encompasses both.
  *   **Mechanism:** You project a "covering value" (e.g., "the kind of life I want to lead"). $A$ and $B$ are not compared directly; they are compared relative to a self-conceived narrative $N$. The choice determines $N$.
  *   **Why this works:** It shifts the problem from comparing $A$ vs $B$ to comparing $A$-in-$N_1$ vs $B$-in-$N_2$.

  **2. Rational Regret Symmetry**
  Why feel regret if you chose rationally?
  *   **Utilitarian View:** Regret implies error (you didn't maximize).
  *   **Incommensurability View:** Choice is **eliminative**. Choosing $A$ makes the specific value of $B$ unavailable *forever*. Because $B$ was not "less than" $A$, its loss is a genuine loss of value, not a trade-off for higher value.
  *   **Symmetry:** Since neither dominated, the loss is symmetric. Regret is the recognition of the "path not taken" having independent worth that was sacrificed, not subordinated.

  ---

  ### IV. Decision Theory & Transitivity

  **Can it stay consistent with Decision Theory?**
  *   **Completeness:** **Must be violated.** If you enforce completeness, you force a hidden scale, collapsing incommensurability into ignorance. You must accept that the preference relation is partial, not total.
  *   **Transitivity:** **High Risk.**
      *   If $A$ || $B$ and $B$ || $C$, does $A$ || $C$?
      *   If $A > B$ and $B$ || $C$, is $A > C$?
      *   *The Danger:* If you allow cycles (A > B, B > C, C > A), you are vulnerable to money pumps (irrational).
      *   *The Fix:* Most serious theories preserve transitivity for strict preference ($>$) but leave the "on a par" relation ($||$) non-transitive or restrict its interaction with $>$.
      *   *Verdict:* You can keep transitivity for strict preferences, but you must abandon the idea that all options are connectable in a single chain.

  ---

  ### V. No-Go Theorems (Joint Impossibilities)

  Here are the logical conflicts you need to watch for. If a theory claims these pairs, it is broken.

  1.  **Completeness + Genuine Hard Choices:**
      *   *Impossible.* If the preference order is complete, there is always a determinate answer (max or indifference). Hard choices imply the order is incomplete. You cannot have both.
  2.  **Utility Maximization + Rational Regret:**
      *   *Impossible.* If you maximized $U(x)$, the unchosen option had lower $U$. Regretting a lower $U$ outcome is irrational. To have rational regret, you must deny maximization occurred.
  3.  **Value Realism + No Common Scale:**
      *   *Tense.* If values are mind-independent facts, and there is no common scale, how do facts dictate a choice? This leads to paralysis. To solve the "Action Guidance" (NN #5), you usually need **Voluntarism** (the will creates the reason). If you insist on pure Realism *and* Action Guidance without a scale, you have a contradiction.

  ---

  ### VI. Scoring the Contenders

  Here is how the two main camps score against the spec.

  #### 1. Straight Utilitarian Scaling (Single Metric)
  *Assumes all values reduce to a common unit (utils, QALYs, etc.).*

  *   **Failure of Trichotomy:** **FAIL.** Forces trichotomy. Hard choices are merely epistemic uncertainty (we don't know the utils yet).
  *   **Indifference Distinction:** **FAIL.** Collapses incommensurability into equality. Coin flips become rational in hard choices (counter-intuitive).
  *   **Regret Symmetry:** **FAIL.** Regret is irrational; you picked the max.
  *   **Weighing Operator:** **PASS.** It's simple subtraction.
  *   **Decision Theory:** **PASS.** Fully compatible.
  *   **Verdict:** Mathematically clean, phenomenologically false. It solves the physics by denying the particle exists.

  #### 2. Ruth Chang's "Parity" (The 4th Relation)
  *Assumes a relation $A$ || $B$ distinct from $>, <, =$.*

  *   **Failure of Trichotomy:** **PASS.** Explicitly adds the 4th relation.
  *   **Indifference Distinction:** **PASS.** Uses the Small Improvement Argument to distinguish parity from equality.
  *   **Regret Symmetry:** **PASS.** Explains regret via the loss of the unchosen "par" value.
  *   **Weighing Operator:** **PASS (with caveats).** Argues the agent *creates* reasons through commitment ("will"). This satisfies Action Guidance without a hidden scale.
  *   **Decision Theory:** **PARTIAL FAIL.** Violates Completeness (by design). Risks Transitivity violations if not carefully bounded, but Chang argues for a modified transitivity.
  *   **Verdict:** Phenomenologically accurate, mathematically messy. It requires upgrading your logic (partial orders + voluntarist operators).

  ### Summary Recommendation
  If you want a theory that matches the *data* (human experience of hard choices), you must accept the **Violation of Completeness**. You cannot model this with a standard utility function $U(x)$. You need a vector space where some vectors are orthogonal, and the "choice" is a rotation of the basis set (a change in self-conception) that allows projection.

  Chang's view is the only one that meets the **Non-Negotiables**, provided you accept that rationality involves reason-creation, not just reason-tracking. Utilitarianism fails the spec because it treats a structural feature of value space (orthogonality) as a measurement error.
