      *   *Thomson:* If Jefferies violates property rights (trespass via lens?) or harms Thorwald (accusation), Thomson says that's the wrong, not privacy. The film suggests the *watching itself* is the wrong, regardless of the outcome.
      *   *Mosaic Theory:* User is spot on here. Individual facts are public; the pattern is private.
      *   *Phenomenology:* Use the concept of "The Gaze" (Sartre/Lacan) but keep it grounded in privacy theory.

  8.  **Final Polish:**
      *   Make sure to answer the specific question: "Is this a metaphor or a theory?" -> It's a phenomenological supplement to theory.
      *   Ensure the "Where you're wrong" section is sharp. The biggest risk is ignoring that the film *rewards* the violation.
      *   Check the "Grad Student Handout" format. Needs to be concise, directive.

  9.  **Self-Correction/Review during drafting:**
