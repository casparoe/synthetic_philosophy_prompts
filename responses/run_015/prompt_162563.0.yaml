      *   **Specific Questions:**
          1.  Is the film best read as an argument against control accounts (mosaic theory) OR for an attentional account?
          2.  Is "attentional privacy" a real philosophical theory or just a metaphor?
          3.  Does the film support or undercut this reading (given Jefferies catches a murderer)?
          4.  Where does the film resist the reading? (Is it just a thriller where the watcher is vindicated?)
