answer: |-
  # Seminar Plan: The Ontological Census Bureau

  **Topic:** The Special Composition Question (SCQ)
  **Level:** Year 2 Metaphysics
  **Time:** 75 Minutes
  **Students:** 16 (4 groups of 4)
  **Resources:** Whiteboard, markers, index cards (two colours), chocolate coins/tokens (approx. 50), printed case sheets.

  ## 1. Learning Objectives
  By the end of the session, students should:
  1.  Understand the SCQ as a request for a *general, non-arbitrary principle*, not a list of intuitions.
  2.  Feel the dialectical pressure on "Common Sense" restricted composition (the vagueness/arbitrariness objection).
  3.  Recognise the costs of Universalism ("Nose+Eiffel") and Nihilism ("No Tables").
  4.  Treat "Brutalism" (composition is a brute fact) as a coherent, albeit costly, theoretical position rather than a shrug.
  5.  Distinguish synchronic composition from diachronic persistence (Theseus).

  ## 2. Materials & Setup
  *   **Whiteboard:** Divided into four quadrants, one for each group.
  *   **Index Cards (Colour A - 'Legislation'):** 1 per group. For writing their Composition Rule.
  *   **Index Cards (Colour B - 'Audit'):** 1 pack per group (4 cards). For recording failures in other groups' rules.
  *   **Case Pool:** 16 printed "Data Sheets" (see Section 5).
  *   **The Squeeze Deck:** A specific subset of 6 cases arranged in a gradient (see Section 5).
  *   **Currency:** 50 chocolate coins or plastic tokens.

  ## 3. Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Briefing** | Introduce SCQ. Explain the "Census Bureau" metaphor. Distribute groups and materials. **Crucial:** Emphasise *Synchronic Only* (no time travel, no Ship of Theseus). |
  | **10–25** | **Legislation** | Groups draft their Composition Rule on Colour A card. Must be mechanical, universal, no proper names. |
  | **25–40** | **The Audit** | Groups swap rules. Each group receives 3 standard cases. They must apply the *other* group's rule. If the verdict clashes with intuition, they file an Audit Objection. |
  | **40–55** | **The Squeeze** | Tutor intervenes. Hands out the "Squeeze Deck" (gradient cases). Groups must mark the exact boundary where composition stops. If they hesitate, they lose tokens. |
  | **55–65** | **The Exit** | Groups may amend their rule or switch to "Brute Fact" status. Final wagers placed on whether their position survives the Tutor's final counter-example. |
  | **65–75** | **Debrief** | Map activity moves to philosophical positions (Universalism, Nihilism, Van Inwagen, Brutalism). Flag literature assumptions. |

  ## 4. Activity Mechanics

  ### The Constraints (The "Clerk Test")
  Write this on the board. To be valid, a rule must pass the Clerk Test:
  1.  **No Proper Names:** You cannot say "tables", "cats", "Eiffel Tower".
  2.  **No Indexicals:** You cannot say "things we use", "near us".
  3.  **Mechanical:** A clerk who knows physics but not metaphysics must be able to apply it to the Data Sheet and output YES/NO.
  4.  **Universal:** One rule for all candidate collections.

  ### The Wagering Scheme
  *   Each group starts with **5 tokens**.
  *   **Audit Success:** If you find a contradiction in another group's rule (e.g., their rule says YES to a heap and NO to a table, but the data sheets are identical regarding their criteria), you steal 1 token from them.
  *   **Squeeze Penalty:** During The Squeeze, if a group cannot identify the precise switch-over point between Case $N$ (Yes) and Case $N+1$ (No), they pay 1 token to the "Bank" (you).
  *   **Survival Bonus:** At the end, if a group's rule (or Brutal stance) survives the Tutor's final challenge without contradiction, they gain 2 tokens.
  *   **Winning:** Most tokens win the chocolate.

  ## 5. The Case Pool

  You need 16 Data Sheets. Each sheet describes a candidate collection of simples ($xs$) at time $t$.
  **Fields on Sheet:** *Spatial Proximity, Causal Bonding, Functional Unity, Biological Life, Consciousness.*

  ### Standard Audit Cases (1–10)
  1.  **The Scattered:** Two electrons, opposite ends of the universe. (Bond: Gravity only. Function: None. Life: No.)
  2.  **The Nose-Tower:** Your nose simples + Eiffel Tower simples. (Bond: Gravity. Function: None. Life: Mixed.)
  3.  **The Heap:** Scrap metal in a skip, touching. (Bond: Contact/Friction. Function: None. Life: No.)
  4.  **The Glued Heap:** Scrap metal welded into a lump. (Bond: Chemical. Function: None. Life: No.)
  5.  **The Watch:** Gears arranged to tell time. (Bond: Mechanical. Function: High. Life: No.)
  6.  **The Rock:** Natural mineral formation. (Bond: Chemical. Function: None. Life: No.)
  7.  **The Cat:** Living organism. (Bond: Biological. Function: High. Life: Yes.)
  8.  **The Corpse:** Same cat, 5 mins post-mortem. (Bond: Biological (decaying). Function: None. Life: No.)
  9.  **The Swarm:** 1000 bees flying in formation. (Bond: Aerodynamic/Social. Function: High (foraging). Life: Yes (individually).)
  10. **The Cloud:** Water droplets, shifting boundaries. (Bond: Electrostatic/Gravity. Function: None. Life: No.)

  ### The Squeeze Deck (11–16)
  *These are designed to vary only **Causal Integration**.*
  *Instruction to students: "These cases differ only in the strength of the bond holding the parts together. All have some functional unity. Mark the exact card where composition CEASES."*

  11. **Case 11:** Parts bonded by Strong Nuclear Force. (Verdict: YES)
  12. **Case 12:** Parts bonded by Covalent Chemical Bonds. (Verdict: YES)
  13. **Case 13:** Parts bonded by High-Strength Epoxy. (Verdict: ?)
  14. **Case 14:** Parts bonded by Velcro/Hooks. (Verdict: ?)
  15. **Case 15:** Parts held by Magnetic Field (can be separated by hand). (Verdict: ?)
  16. **Case 16:** Parts held by Gravity only (orbiting). (Verdict: NO)

  *Pedagogical Note:* The pressure comes from forcing them to say "Epoxy counts, Velcro doesn't." Why? What is the ontological significance of epoxy vs. velcro?

  ## 6. Troubleshooting Predictable Failures

  ### Failure 1: The "Interesting Function" Rule
  *   **The Move:** A group writes: *"Composition occurs iff the parts do something interesting together."*
  *   **The Counter:** Invoke the **Clerk Test**. Ask: "Can the clerk measure 'interestingness' with a Geiger counter?" If not, the rule is invalid.
  *   **The Fix:** Force them to define the function physically (e.g., "emits a signal", "resists force"). Once defined, hit them with **Case 5 (Watch)** vs **Case 3 (Heap)**. If the heap resists wind, does it compose?

  ### Failure 2: The Gerrymandered Disjunction
  *   **The Move:** *"Composition occurs iff (Life) OR (Artifact) OR (Bonded)."*
  *   **The Counter:** This is a list, not a principle. It violates the spirit of the SCQ (which asks for a *general* answer).
  *   **The Fix:** Impose a **Word Limit** on the index card (max 20 words). Or, penalise it in scoring: "Disjunctive rules cost 2 tokens to file." This mirrors the theoretical cost of lacking unity in your ontology.

  ### Failure 3: The Persistence Drift (Ship of Theseus)
  *   **The Move:** Student asks, "But what if we replace the parts?"
  *   **The Counter:** Stop immediately. Point to the Data Sheet header: **TIME $t_0$**.
  *   **The Script:** "We are asking if there is *an* object here now, not if it's the *same* object as yesterday. That is a different question. Stick to the snapshot."

  ### Failure 4: Brutalism as Laziness
  *   **The Move:** "It's just a brute fact. We can't know."
  *   **The Counter:** Validate it, but price it. "That is a valid position (Brutalism). However, in this game, Brutalists cannot participate in The Squeeze. You automatically pass the Squeeze round (no tokens lost) but you gain no Audit tokens. You are opting out of explanation."
  *   **Goal:** This makes Brutalism look like a stable *equilibrium* (you stop losing tokens) rather than a failure (you couldn't answer).

  ## 7. Debrief & Literature Mapping (10 Minutes)

  Do not just announce the answers. Map the *feelings* they had during the game to the arguments.

  1.  **The Audit Phase $\rightarrow$ Universalism & Nihilism.**
      *   *Ask:* "Who found it easy to apply rules that said YES to everything?" (Universalism).
      *   *Point:* Universalism is precise (no Squeeze problem) but costly (Nose+Eiffel).
      *   *Ask:* "Who found it easy to say NO to everything?" (Nihilism).
      *   *Point:* Nihilism is precise but costly (No Tables).
      *   *Literature:* Lewis (Arguments for Universalism); Rosen & Dorr (Nihilism).

  2.  **The Squeeze Phase $\rightarrow$ The Vagueness Argument.**
      *   *Ask:* "How did it feel to pick the boundary between Epoxy and Velcro?"
      *   *Point:* If composition is restricted, there must be a cutoff. If the cutoff is vague, reality is vague (which many deny). If the cutoff is sharp, it looks arbitrary.
      *   *Literature:* Lewis ('Many But Almost One'); Sider ('World Enough and Structure').
      *   *Note:* Flag that Van Inwagen denies composition can be vague, which is why he chooses 'Life' (arguably less vague than 'Artifact').

  3.  **The Exit Phase $\rightarrow$ Brutalism.**
      *   *Ask:* "Who wanted to say 'It just does'?"
      *   *Point:* This is the Brute Fact view. It avoids arbitrariness by denying the need for a *further* fact beyond the parts.
      *   *Literature:* Merricks ('Objects and Persons'); Cameron ('From Humean Truthmaker Theory').

  4.  **Van Inwagen's Specific Move.**
      *   *Point:* Van Inwagen tries to split the difference. Only Living things compose.
      *   *Check:* Did anyone try this? How did they handle **Case 8 (Corpse)** or **Case 9 (Swarm)**?
      *   *Literature:* Van Inwagen ('Material Beings').

  ## 8. Philosophical Flags (What to Say Out Loud)

  You must explicitly flag the assumptions the game bakes in, as these are contested in the literature.

  *   **Assumption 1: Composition is Factual.**
      *   *Say:* "This game assumes there is a fact of the matter about whether composition occurs. Some philosophers (e.g., Eli Hirsch, Quantifier Variance) argue the debate is merely verbal—about how we use the word 'exists', not about the world. Our game assumes Realism."
  *   **Assumption 2: Composition is Not Vague.**
      *   *Say:* "The Squeeze round assumes a sharp boundary is required. Lewis and Sider argue composition cannot be vague. But some (e.g., Sorensen) argue vagueness is in the world. If you think vagueness is real, the Squeeze doesn't hurt you."
  *   **Assumption 3: Ontological Innocence.**
      *   *Say:* "We are assuming that if composition happens, a *new* object exists. Some argue composition is 'ontologically innocent'—the whole is just the parts. If so, the SCQ is less urgent."
  *   **Assumption 4: Synchronic Focus.**
      *   *Say:* "We deliberately excluded persistence (time). This isolates composition, but in reality, what counts as an object often depends on its history. We are looking at a frozen slice of reality."

  ## 9. Tutor's Cheat Sheet: Handling the "Life" Answer

  If a group successfully defends Van Inwagen's "Life" answer:
  *   **Challenge:** Press them on **Case 9 (Swarm)** and **Case 7 (Virus - if you add it)**.
  *   **Question:** "Does the swarm compose an object? It acts as a unit. Is it alive?"
  *   **Question:** "When does life begin/end exactly? Conception? Birth? Brain death?"
  *   **Goal:** Show that 'Life' is also subject to a Squeeze, just a different one. Van Inwagen accepts this risk because 'Life' is less vague than 'Artifact', not because it is perfectly sharp.

  ## 10. Contingency: If the Room Goes Quiet
  *   **Inject Tokens:** "I am putting 5 tokens on the table. The first group to find a contradiction in the 'Life' rule gets them."
  *   **Play Devil's Advocate:** "I am the Universalist. I claim your 'Table' rule is superstition. Prove to me the table exists over and above the wood."
  *   **Force a Vote:** "Show of hands: Who thinks the Glued Heap is an object? Who thinks the Watch is? Look at the gap between you."

  ## 11. Summary of Costs (For the Whiteboard)
  Draw this up during the Debrief to visualise the "Unstable Middle".

  | Position | Verdict on Tables | Verdict on Nose+Eiffel | Vulnerability |
  | :--- | :--- | :--- | :--- |
  | **Universalism** | Yes | Yes | Counter-intuitive |
  | **Nihilism** | No | No | Counter-intuitive |
  | **Common Sense** | Yes | No | **The Squeeze (Arbitrariness)** |
  | **Van Inwagen** | No | No | Artifacts don't exist |
  | **Brutalism** | Yes/No (Brute) | Yes/No (Brute) | Epistemically Opaque |

  This structure ensures the "pressure" comes from the mechanics of the game (the inability to define the boundary without losing tokens) rather than you lecturing them on why they are wrong. It makes the metaphysical cost palpable.
