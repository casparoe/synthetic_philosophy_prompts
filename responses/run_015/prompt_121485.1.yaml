answer: |-
  **Project Title:** The Architecture of Bad Faith: A Taxonomy of Epistemic Vice in Polarized Discourse

  **Central Question**
  Does the colloquial accusation of "arguing in bad faith" refer to a unitary normative failure, or does it conflate four distinct structural defects with divergent remedies? This project seeks a determinate answer: if the four proposed categories (Insincerity, Etiological Failure, Asymmetric Standards, Misdirected Aim) demand identical corrective interventions, the distinction is merely descriptive. If they demand distinct interventions, the distinction is explanatory and normative. Success is defined by demonstrating that treating Etiological Failure as Insincerity, for example, actively worsens polarization rather than resolving it.

  **Rival Framings**
  Two dominant framings currently obscure this question. First, the *Symmetry Worry* suggests that because opposing factions mutually accuse one another of bad faith, no attribution is epistemically respectable. This parallels the symmetry argument in peer disagreement: if my opponent thinks I am biased and I think she is biased, we should suspend judgment. This inference is too quick. Symmetric attribution is compatible with asymmetric distribution of the four failures. One side may predominantly exhibit Asymmetric Standards while the other exhibits Misdirected Aim. Breaking this symmetry requires evidence independent of the immediate dispute, specifically longitudinal consistency in applying evidentiary standards across different partisan valences.

  Second, the *Refinement-versus-Rationalization Problem* complicates the identification of Asymmetric Standards. When an agent raises the evidentiary bar for a conclusion that inconveniences them, they may be rationalizing a pre-determined outcome, or they may be genuinely refining a principle they previously stated too crudely. To distinguish these without begging the question, I propose using prior statements made under opposite partisan valence as a "revealed baseline." If an agent demanded high evidentiary standards for a policy when it was proposed by the opposition, but lowers them when proposing it themselves, this inconsistency signals rationalization rather than refinement. The philosophical challenge is to establish criteria for which prior statements count as a valid baseline without cherry-picking.

  **Method and Work Packages**
  The project proceeds over twelve months in four work packages (WPs).

  *WP1: Taxonomy and Adequacy (Months 1–3).* I will rigorously define the four categories. The adequacy condition for this taxonomy is non-equivalence of remedy. Insincerity requires exposure or trust-building; Etiological Failure requires debiasing or structural insulation from identity threats; Asymmetric Standards requires consistency enforcement; Misdirected Aim requires changing the incentive structure from competitive to inquisitive. I will test these definitions against paradigmatic cases from recent political discourse to ensure they track distinct observable signatures.

  *WP2: The Epistemology of Attribution (Months 4–6).* This WP addresses the Symmetry Worry and the Baseline Problem. I will develop a normative framework for when a third-party observer is justified in attributing bad faith. This involves formalizing the "revealed baseline" method to determine when a change in standards constitutes a violation of prior commitment rather than intellectual growth. I will argue that symmetry is broken not by claiming one side is virtuous, but by identifying specific structural violations relative to an agent's own historical commitments.

  *WP3: Echo Chambers and Institutional Design (Months 7–9).* Here I distinguish the *informational mechanism* of echo chambers (participants lack corrective evidence) from the *incentive mechanism* (participants perform for an audience that rewards specific conclusions). The former requires information injection; the latter requires incentive realignment. I will develop the concept of *valence-blind procedures*, where evidentiary standards are fixed before it is known which partisan conclusion they will support. I will analyze the limits of this approach, specifically where valence-blindness might entrench status quo biases, and propose safeguards.

  *WP4: Synthesis and Normative Upshot (Months 10–12).* The final WP integrates the findings into a coherent account of epistemic accountability. I will draft the practitioner-facing diagnostic and finalize the journal articles. The normative upshot will clarify when "calling out" bad faith is morally permissible and when it is counter-productive noise.

  **Deliverables**
  For a twelve-month fellowship, three journal articles and one practitioner diagnostic is an aggressive but appropriate target.
  1.  *Article 1:* "Four Faces of Bad Faith" (WP1 output), targeting a general philosophy journal.
  2.  *Article 2:* "Symmetry and Attribution" (WP2 output), targeting epistemology or social philosophy.
  3.  *Article 3:* "Valence-Blindness and Echo Chambers" (WP3 output), targeting political theory or public policy.
  4.  *Diagnostic:* A short, accessible guide for journalists and moderators on identifying which type of bad faith is present in a dispute to select the correct intervention.
  This shape ensures both academic impact and public relevance, fitting the fellowship's duration.

  **Failure Modes**
  Honest assessment suggests four primary risks. First, the *Collapse Risk*: the four categories may reduce to a single underlying mechanism (e.g., all are merely forms of motivated reasoning), rendering the taxonomy redescriptive rather than explanatory. Second, the *Baseline Failure*: the refinement-versus-rationalization distinction may prove impossible to draw even as an idealization, gutting the proposal for Asymmetric Standards. Third, the *Symmetry Soundness*: it may turn out that we lack the epistemic access required to break the symmetry of mutual accusation, forcing a skeptical conclusion. Fourth, the *Inertia Risk*: all four diagnoses may imply the same institutional remedies (e.g., "more deliberation"), making the taxonomy practically inert. A fifth risk, not initially anticipated, is that *Misdirected Aim* may simply be a subset of *Asymmetric Standards* regarding the standard of "winning" versus "truth-seeking," requiring a consolidation of categories.

  **Scope and Disciplinary Justification**
  The project is likely to blow past twelve months in WP3. Designing and testing valence-blind procedures touches on institutional economics and constitutional design. To keep the project tractable, I will limit WP3 to a theoretical analysis of existing procedures (e.g., blind peer review, randomized legislative drafting) rather than proposing new institutional architectures. If further cuts are needed, WP4's diagnostic will be reduced to a conceptual appendix within Article 3.

  To the political scientist on the panel: This project is philosophy, not social psychology, because it does not measure the prevalence of bad faith in any population, nor does it empirically model the causal psychology of belief formation. Social psychology asks *how much* bias exists and *what causes it*. This project asks *what it means* to be accountable for bias and *when* an accusation of bad faith is justified. Without a clear normative taxonomy, empirical measures of polarization lack a target: we cannot measure the success of an intervention if we cannot define the vice it is meant to cure. This project provides the conceptual infrastructure required to make empirical work on polarization action-guiding. It clarifies the conditions under which political distrust is epistemically rational versus when it is a self-fulfilling prophecy, a distinction essential for normative political theory but invisible to purely descriptive social science.
