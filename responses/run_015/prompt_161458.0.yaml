  | **3. Bad Stretch** | Prefer flat +8 | Prefer flat +8 (Lexical Negative rules out the -40 stretch) | **Yes** |
  | **4. Imperceptible Losses** | Ambivalent | (a) is Better (Loss to 8B outweighs gain to 1) | **Partial** (Resolves ambivalence) |
