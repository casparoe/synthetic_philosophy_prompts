answer: |-
  ### 1. Candidate Principle: Segmented, Risk-Weighted Critical Level Utilitarianism (SR-CLU)

  I propose replacing your rough principle with a more precise formulation that retains the Critical Level intuition but adds segmentation, risk-sensitivity, and a distinction between axiological ranking and deontic requirement.

  **The Principle:**

  1.  **Unit of Account (Motivation: Case 3):** The fundamental units of value are *temporal segments* of lives, not whole lives. A life is the sum of its segments.
      *   *Strains against:* Intuition that lives are holistic wholes (Case 8 Fission).
  2.  **Lexical Negative Priority (Motivation: Case 3, 11):** Any outcome containing a segment with welfare $< 0$ is strictly worse than any outcome containing no segments $< 0$, provided the negative segment was avoidable.
      *   *Strains against:* Cases where massive happiness might intuitively outweigh small suffering (not present in your verdicts, but a common counter-argument).
  3.  **Critical Level Threshold (Motivation: Case 2, 5):** For segments $\ge 0$, value is calculated as $(Welfare - C) \times Weight$, where $C$ is a critical level fixed at $+10$. Segments below $C$ contribute negative value to the sum.
      *   *Strains against:* Intuition that a life at $+5$ is still "good" in itself (Case 2 ambiguity).
  4.  **Population Discounting (Motivation: Case 6, 8):** The $Weight$ assigned to a segment is $1 / \sqrt{N}$, where $N$ is the total number of people existing in that outcome. This reduces the value of "diluting" welfare across more persons.
      *   *Strains against:* Case 9 (see analysis below).
  5.  **Risk Transformation (Motivation: Case 10, 11):** When welfare is uncertain, calculate the value of the segment using a concave transformation of expected welfare (e.g., square root of positive welfare, negative of square root of absolute negative welfare) before applying the Critical Level.
      *   *Strains against:* Standard expected utility theory.
  6.  **Axiology/Deontology Split (Motivation: Case 1):** The sum calculated above determines *Betterness*. *Obligation* requires that the chosen outcome's score exceed the status quo by a margin $\delta > 0$.
      *   *Strains against:* Views that equate "better" with "ought to choose."

