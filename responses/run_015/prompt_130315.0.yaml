answer: |-
  Welcome, everyone. To our moral philosophers and anthropologists, thank you for returning to this table. To our local community organizers, thank you for grounding us in the reality of this city. And to our international graduate students, who arrived only days ago: welcome. You are not merely observers at this workshop. In a very real sense, you are the living test case for the question that brings us here.

  We are gathered to discuss "Everyday Obligations." On the surface, this sounds trivial. We are not talking about the trolley problem, or duties of rescue, or the foundations of justice. We are talking about tipping baristas, queuing for the bus, and whether it is permissible to jaywalk on an empty street at 2:00 AM.

  But do not mistake the scale of the act for the scale of the stakes. For the student navigating a new city, a misread norm can mean social ostracization or economic penalty. For the community organizer, these norms determine who feels they belong in a public space and who feels policed. And for the philosopher, these conventions present a profound puzzle about the source of moral authority.

  In preparing these remarks, I found myself oscillating between two unsatisfying answers. The first is a rigid universalism: "When in Rome, do as the Romans do," because the Roman way is presumed to be the *right* way. This imposes a false moral weight on local habits. The second is a hollow relativism: "It's just culture," implying these norms are arbitrary preferences with no binding force. This dissolves the obligation entirely.

  To navigate between these poles, I want to propose a working distinction for our time together. I suggest we distinguish between *coordination conventions* and *deference conventions*.

  Coordination conventions are practices like queuing or driving on a specific side of the road. They depend on shared expectations to function. If you are a visitor, you have a direct, pragmatic reason to participate: if you don't queue, the system creates a bottleneck, and you become part of the problem. Your obligation here stems from a duty of non-disruption.

  Deference conventions, by contrast, encode local status relations. Think of complex tipping hierarchies or unwritten rules about who yields space on a sidewalk. These are not just about efficiency; they are about signaling respect, acknowledging power, or maintaining social distance. A visitor might question these without necessarily breaking the cooperative system.

  However, I am not offering this distinction as a clean solution. In fact, I offer it primarily because it is where the friction lies. Our work this weekend is to examine where this distinction frays.

  Consider the queue. It looks like pure coordination. But what happens when the queue is used to enforce social hierarchy? When certain bodies are assumed to be "out of place" in line, or when "holding a spot" is a privilege reserved for locals? Suddenly, a coordination norm is doing the work of a deference norm.

  Or consider tipping. We might classify it as deference—a payment signaling the status of the server. But in many contexts, tipping is the coordination mechanism that ensures you receive service at all. Refusing to tip doesn't just insult the waiter; it disrupts the economic coordination of the restaurant. If you treat it as optional deference, you may find yourself unable to coordinate your next meal.

  This is the philosophical work we must do. We cannot simply categorize and move on. We must look at the hybrid nature of these obligations.

  To the philosophers in the room: I ask you not to abstract these norms until they lose their texture. A moral theory that cannot account for the anxiety of a student unsure whether to tip 15% or 20% is a theory that has lost contact with the moral life.

  To the anthropologists and community organizers: I ask you to challenge us when we treat these norms as neutral. Show us where a "coordination" rule is actually a tool of exclusion. Show us where the "local custom" is a burden disproportionately carried by the vulnerable.

  And to the new students: Your confusion is data. When you feel a tug of obligation that doesn't make sense to you, that is not a failure of your understanding. It is a signal that you have encountered a norm where the coordination and deference functions are tangled. Do not apologize for that confusion. Bring it to us.

  Our goal this weekend is not to produce a universal handbook for travelers. We will not settle, once and for all, which obligations travel with us and which remain locally anchored. Instead, we aim to map the terrain of that transition. We want to understand when a local habit demands our compliance as a matter of fairness, and when it demands our critique as a matter of justice.

  The everyday is not a break from the moral world; it is the medium in which it flows. Let us trace that current together.

  Thank you, and let us begin.
