prompt: |-
  I'm in an undergraduate seminar on ethics and public policy, and we have just spent two weeks on social discounting. I want to get clearer on what our actual institutional practice commits us to. I don't need citations or a reading list, and I'd rather you worked from the practice as I describe it than from any canonical statement of it.

  Here is the pattern I can't turn into a single theory.

  (a) When a government cost-benefit analysis compares a regulation that saves lives soon with one that saves lives a century from now, it discounts the later lives at a positive annual rate, so a hundred statistical lives saved in the distant future come out worth a small fraction of a hundred saved next year.

  (b) The same government, licensing a repository for long-lived radioactive waste, evaluates the risk over a horizon of many thousands of years and in some frameworks declines to discount the harm at all, or applies something close to a zero rate.

  (c) The same government borrows at long maturity and funds basic research and disease-surveillance infrastructure, justifying the spending by benefits that arrive decades out, which implies a far lower implicit rate than the one in (a).

  (d) Courts in the same jurisdiction reduce an award for lost future earnings to present value, but do not discount the pain, the loss of a faculty, or the wrongfulness of the injury itself: those are made good in full no matter how far into the future they fall.

  (e) And in the personal case we treat it as a failing, not a preference, that I care less about my own toothache next year than about an identical one today.

  So: what view of the moral significance of time does this set of practices presuppose? More specifically, does (a) strictly presuppose pure time preference, or could the whole of the observed discounting be reconstructed as two non-temporal factors that happen to shrink with distance: a hazard factor, the chance that the benefit never arrives because the beneficiaries, the institution or the state does not survive, and a satiety factor, the thought that future people will be richer, so a unit of resource buys less welfare? If that reconstruction is available, is the practice underdetermined, licensed equally by a date-sensitive and a date-neutral theory? And where do the zero-rate and declining-rate schedules in (b) fit: do they show the practice was never committed to pure time preference, or do they substitute a different view, on which uncertainty about the rate, or extinction risk, is the only legitimate discounter?

  One proposal my seminar kicked around, which we called the Two-Key Rule, is that a public evaluation may apply a hazard factor and a satiety factor and no other temporal factor, and must state the two separately. I have three questions about it. Would the practice as it actually stands look any different under the Two-Key Rule, and if so in which of the cases above? Is the current practice really Two-Key in disguise, which would mean it presupposes nothing about pure time preference at all? And what would the defender of an explicit pure rate say is the strongest reason not to accept the reconstruction?

  Finally, one of us suggested that the discounting in (a) is not about dates at all but about identity: if who exists in a century depends on what we do now, there may be no particular person whose life is being weighed less, so the worry about pure time preference never gets a grip. Does that dissolve the puzzle or just relocate it, and does it make (a) easier or harder to reconcile with (b) through (e)? Please also tell me where in this I have described the practice wrongly, or where an inconsistency I am reading into it is only apparent.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **Context:** Undergraduate seminar on ethics and public policy.
      *   **Topic:** Social discounting (time preference in policy).
      *   **Goal:** Clarify what current institutional practice *actually commits us to* morally/theoretically, based on the described patterns (a) through (e).
      *   **Constraints:** No citations, no reading lists. Work from the practice *as described* (though I need to check if the description is accurate).
      *   **Specific Questions:**
          1.  What view of the moral significance of time does this practice presuppose?
          2.  Does (a) strictly presuppose pure time preference, or can it be reconstructed as hazard + satiety factors?
          3.  Is the practice underdetermined (licensed by both date-sensitive and date-neutral theories)?
          4.  How do (b) and declining-rate schedules fit (do they show no commitment to pure time preference, or a shift to uncertainty/extinction risk)?
          5.  Regarding the "Two-Key Rule" (hazard + satiety only, stated separately):
              *   Would practice look different?
              *   Is current practice Two-Key in disguise?
              *   What is the strongest argument *against* this reconstruction (from a pure time preference defender)?
          6.  Regarding the "Identity" proposal (non-identity problem): Does it dissolve or relocate the puzzle? Does it help reconcile (a) with (b)-(e)?
          7.  Fact-check: Where have I described the practice wrongly, or where is an apparent inconsistency actually consistent?

  2.  **Deconstruct the Observed Practices (a)-(e):**
      *   (a) Standard CBA (Cost-Benefit Analysis): Positive discount rate applied to future lives/benefits. (Implies future counts less).
      *   (b) Nuclear Waste/Long-term risks: Zero or near-zero discounting over millennia. (Implies future counts equally, or uncertainty dominates).
      *   (c) Infrastructure/Research: Low implicit discount rate (long-term investment). (Implies future counts significantly).
      *   (d) Legal Damages: Economic loss discounted; pain/suffering/wrongfulness *not* discounted. (Distinction between market value and moral harm).
      *   (e) Personal Prudence: Caring less about future self is a *failing* (irrationality), not a preference. (Implies date-neutrality is the moral ideal).

  3.  **Address Question 1: What view of time does this presuppose?**
      *   *Initial thought:* It's inconsistent.
      *   *Refinement:* It's not a single moral theory; it's a pragmatic hybrid. It presupposes that time *itself* isn't the moral multiplier, but *uncertainty* and *capacity* are. However, (a) often hides this behind a single rate.
      *   *Core Tension:* The practice oscillates between treating time as morally neutral (e, d-partly, b) and treating time as a cost (a).
      *   *Conclusion:* The practice doesn't presuppose a *single* view. It presupposes that different domains (market efficiency vs. moral rights vs. existential risk) trigger different valuation logics.

  4.  **Address Question 2 & 3: Pure Time Preference vs. Hazard + Satiety (Ramsey Equation):**
      *   *Theory:* The Ramsey formula $r = \delta + \eta g$. $\delta$ = pure time preference. $\eta g$ = satiety (growth). Hazard is often added as a probability of extinction/cancellation.
      *   *Reconstruction:* Can (a) be explained without $\delta$? Yes, if we assume future wealth growth ($\eta g$) and some probability the project fails ($h$).
      *   *Underdetermination:* Mathematically, yes. A 3% rate could be 1% pure + 2% growth, or 0% pure + 3% growth/hazard.
      *   *Practice:* Official guidance (like OMB Circular A-4 or UK Green Book) often *says* it includes pure time preference, but the *justification* often leans on opportunity cost of capital (which is market-based, not purely temporal).
      *   *Verdict:* The practice is theoretically underdetermined but administratively often treats the rate as a lump sum.

  5.  **Address Question 4: Fitting in (b) and Declining Rates:**
      *   *Observation:* (b) uses zero/declining rates.
      *   *Implication:* This suggests the "Pure Time Preference" ($\delta$) component is recognized as ethically dubious for very long horizons (intergenerational equity).
      *   *Interpretation:* It shows the practice *is* sensitive to the ethical objection against pure time preference. It suggests the standard rate in (a) is largely proxy for opportunity cost/satiety, which diminishes or becomes ethically unacceptable over centuries.
      *   *Reconciliation:* (b) admits that for *rights/harms* (nuclear waste), we can't assume future people are richer (satiety fails) or that the state will vanish (hazard is binary).

  6.  **Address Question 5: The Two-Key Rule (Hazard + Satiety only):**
      *   *Would practice look different?* Yes. In (a), agencies usually report a single "social discount rate." Under Two-Key, they'd have to publish "Probability of Project Survival" and "Expected Future Wealth Index." This would make CBA more transparent but more complex.
      *   *Is current practice Two-Key in disguise?* Often, yes, in the *economic justification* (opportunity cost of capital reflects growth/satiety), but no in the *ethical accounting* (they don't separate the moral weight of future lives).
      *   *Strongest Argument Against:* The "Opportunity Cost of Capital" argument. Money spent now could earn returns. If we don't discount, we invest too much in low-yield long-term projects and starve the present. Pure time preference is a proxy for the productivity of capital. (Wait, strictly speaking, opportunity cost is distinct from pure time preference, but in practice, they get conflated). A better argument against Two-Key: *Political Accountability.* Elected officials represent *current* constituents. They have a democratic mandate to prioritize the present slightly ($\delta > 0$).

  7.  **Address Question 6: The Identity Proposal (Non-Identity Problem):**
      *   *Concept:* Parfit's Non-Identity Problem. Policy changes *who* is born.
      *   *Application to (a):* If we save lives in 100 years, those specific people might not exist if we choose a different policy. So we aren't harming *them* by discounting; we are choosing which *possible* people exist.
      *   *Dissolve or Relocate?* It relocates. It shifts from "discounting value" to "comparing possible populations."
      *   *Reconciliation with (b)-(e):* It makes (a) *harder* to reconcile. (b) treats future harm as real harm to specific entities (the environment/future humans). (e) treats future self as identical to present self. If (a) relies on non-identity, it creates a moral discontinuity between personal prudence (e) and public policy (a).
      *   *Critique:* Most policy analysts ignore non-identity because it makes CBA impossible (you can't compare utilities of non-identical people easily). So while philosophically interesting, it doesn't describe the *practice*.

  8.  **Address Question 7: Fact-Checking the User's Description:**
      *   (a) *Accurate:* Standard CBA discounts future benefits.
      *   (b) *Mostly Accurate:* Nuclear waste (e.g., Yucca Mountain) often uses zero discounting for health standards over 10k years, though cost calculations might still discount.
      *   (c) *Accurate:* Infrastructure implies low discounting, but often justified by "market failure" rather than low time preference.
      *   (d) *Accurate:* Pecuniary losses discounted; non-pecuniary (pain/suffering) often not discounted in jury instructions (though some jurisdictions vary).
      *   (e) *Accurate:* Philosophical consensus (Sidgwick/Parfit) is that pure time preference is irrational personally.
      *   *Inconsistency:* The main inconsistency is between (a) and (e). The state acts in a way deemed irrational for individuals. The "apparent" consistency is usually resolved by saying the state faces *budget constraints* and *opportunity costs* individuals don't, but the user's prompt asks about *moral significance*, not budget mechanics.

  9.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the sophistication of the observation. The practice is indeed a patchwork, not a unified theory.
      *   **Section 1: The Moral View Presupposed.** It's not one view. It's a distinction between *consumption* (discounted) and *rights/harms* (not discounted).
      *   **Section 2: Pure Time Preference vs. Reconstruction.** Yes, (a) can be reconstructed. The practice is underdetermined. (b) supports the reconstruction (removing pure time preference for long horizons).
      *   **Section 3: The Two-Key Rule.** Practice would change (transparency). Current practice is *economically* Two-Key but *ethically* opaque. Strongest counter-argument: Democratic representation/Opportunity Cost.
      *   **Section 4: The Identity Proposal.** It relocates the problem. It creates tension with (e). It doesn't match actual bureaucratic practice.
      *   **Section 5: Corrections/Nuance.** Point out where the description might be slightly off (e.g., distinction between financial discounting and ethical discounting).

  10. **Refining the Tone:**
      *   Keep it seminar-appropriate (analytical, precise, avoiding jargon where possible).
      *   Respect the constraint: "Work from the practice as I describe it." (Don't just lecture on Ramsey, use the user's terms).
      *   Ensure the "Two-Key" and "Identity" sections are directly answered.

  11. **Self-Correction during drafting:**
      *   *Check:* Did I distinguish between *financial* discounting (opportunity cost) and *ethical* discounting (utility of lives)? The user blends them in (a). I need to clarify that (a) is usually financial/opportunity cost disguised as ethical valuation.
      *   *Check:* In (d), do courts *really* not discount pain and suffering? In many US jurisdictions, they instruct juries not to discount non-economic damages. This is a crucial distinction between market value and moral worth.
      *   *Check:* On Identity. If I say it "relocates" the puzzle, I need to explain where. It moves from "valuing time less" to "valuing potential people less."

  12. **Final Polish:** Ensure all specific sub-questions are answered clearly. (e.g., "Would practice look different?" "Is it Two-Key in disguise?").

  *(Self-Correction on the "Identity" point)*: The user asks if identity dissolves the puzzle. If the people don't exist yet, do we owe them the same? If we say "no," that justifies (a). But (b) assumes we *do* owe them. So Identity makes (a) and (b) *harder* to reconcile. I need to make sure this is clear.

  *(Self-Correction on "Two-Key")*: Is current practice Two-Key in disguise? Economists argue the social discount rate *is* derived from growth (satiety) and risk. But they often bundle it. So yes, technically, but ethically they often defend the bundle as including a pure time preference component ($\delta$). I should nuance this.

  *(Final check on constraints)*: No citations. No reading list. Focus on the logic of the practice.

