prompt: |-
  hey, you are an expert on space ethics and political philosophy, right? please think step by step, and do some quick brainstorming first before you give your final take.

  my sister is helping draft the charter for a private lunar settlement in one of the south pole ice craters. there's a clause saying anyone born there automatically owes twenty years of life-support maintanance labor, even if they want to leave the earth-moon system. there's also a clause saying if indigenous microbial life is found in the crater ice within fifty years, the base must be fully decommisioned within five years — so kids could be born into a community that's legally required to disappear. my sister thinks this is unfair but the other planners say its no different from taxes or mandatory national service. she asked me and i just said its messy. can you advise her? is the charter fair, what's the actual philosophical problem hiding in this, and how should she think about the consent issue? don't give generic life advice — unpack the structure like a philosopher would.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Request:**
      *   **Role:** Expert on space ethics and political philosophy.
      *   **Task:** Advise the user's sister on a specific charter clause for a private lunar settlement.
      *   **Specific Clauses:**
          1.  "Birthright Labor": Anyone born there owes 20 years of life-support maintenance labor, even if they leave the Earth-Moon system.
          2.  "Decommissioning Clause": If indigenous microbial life is found within 50 years, the base must be decommissioned within 5 years.
      *   **Conflict:** Sister thinks it's unfair; planners compare it to taxes/national service.
      *   **Requirements:** Think step-by-step, do quick brainstorming first, unpack the structure like a philosopher (no generic advice), address fairness, the underlying philosophical problem, and the consent issue.

  2.  **Quick Brainstorming (Internal Monologue/Drafting):**
      *   *Clause 1 (Labor):* It's a debt incurred by birth. Not voluntary. Enforceable how? If they leave, how do you make them work? Indentured servitude? Slavery? Social contract theory (Locke, Rawls). Comparison to taxes is weak because taxes are monetary and proportional; this is *bodily* labor and time-bound regardless of income. It binds the person to the location or creates a debt peonage.
      *   *Clause 2 (Decommissioning):* Planetary Protection (COSPAR guidelines). Ethical duty to alien life vs. duty to inhabitants. If kids are born, they have a right to a home. Destroying the home violates their security. Conflict between environmental ethics (preservation) and human rights (habitation).
      *   *The Combination:* Born into a place that might cease to exist, owing labor to a place that might cease to exist. This creates a "trap."
      *   *Consent:* Children cannot consent. Social contract usually implies tacit consent by staying, but here the debt follows them *if they leave*. That's extraterritorial enforcement.
      *   *Planners' Argument:* "Like taxes." Counter: Taxes fund services you use. This is repayment for existence? "Like national service." Counter: Usually domestic, limited duration, citizenship-based. This is birth-based and follows you off-world.
      *   *Key Philosophical Concepts:* Intergenerational justice, bodily autonomy, social contract, planetary protection, coercion, vulnerability.

  3.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the role, validate the complexity.
      *   **Brainstorming Section:** Explicitly show the "step-by-step" thinking as requested.
      *   **Analysis of Clause 1 (The Labor Debt):** Focus on bodily autonomy and the limits of social contract.
      *   **Analysis of Clause 2 (The Decommissioning):** Focus on intergenerational justice and planetary protection conflicts.
      *   **The Core Philosophical Problem:** Identify the specific tension (e.g., "The Trap of Non-Consensual Obligation").
      *   **Advice/Recommendation:** Concrete philosophical framing for her to use in negotiations.

  4.  **Drafting the Content - Section by Section:**

      *   *Brainstorming:* Keep it raw but organized. List the tensions.
      *   *Clause 1 (Labor):* Is it slavery? 13th Amendment vibes (even if not US law). It's a *corvée* labor system. The "tax" analogy fails because taxes are fungible; labor is personal. Also, enforcement off-world is dubious. It treats humans as capital assets.
      *   *Clause 2 (Decommissioning):* This is the "Planetary Protection vs. Human Rights" clash. If kids are born, they are stakeholders. Decommissioning displaces them. Is it ethical to birth people into a temporary structure?
      *   *Consent:* The crux. Children can't sign contracts. Parents consent for them, but can parents consent to lifelong debt or homelessness for their kids? Locke says no.
      *   *Synthesis:* The charter treats citizens as *resources* rather than *ends in themselves* (Kant).

  5.  **Refining the Philosophical Arguments:**
      *   *Social Contract:* Hobbes/Locke/Rousseau. Usually, you trade liberty for security. Here, the security is conditional (Clause 2) and the liberty is restricted (Clause 1).
      *   *Kantian Ethics:* Treating humanity as an end, not merely a means. The labor clause treats the child as a means to maintain the base.
      *   *Rawlsian Veil of Ignorance:* Would planners agree to this if they didn't know they were the planners? Probably not.
      *   *Arendt:* The right to have rights. If the base dissolves, what citizenship do they have?

  6.  **Developing the Advice:**
      *   Don't just say "it's bad." Say *why* it's philosophically incoherent.
      *   Suggest alternatives: Labor as residency requirement (not debt), Planetary Protection protocols that prioritize human safety/relocation rather than immediate abandonment.
