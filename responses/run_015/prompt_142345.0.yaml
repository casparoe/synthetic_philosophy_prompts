  **Note on Form and Theory**

  The pantoum's interlocking repetitions map the Higher-Order Thought (HOT) targeting a first-order state. The recurring line ("A red light burns...") is the first-order state; its reappearance in new stanzas represents it becoming the object of a HOT. In Stanza 4, the line recurs despite the admission that "nothing waits," enacting the targetless HOT problem. The subsequent line ("The thought survives...") offers the merely-intentional reply implicitly: the thought exists even if the object does not. I take liberties by maintaining the state-line in positions 2 and 4 throughout, prioritizing the philosophical constraint over strict stanzaic novelty. I am confident the form illuminates the structural relation between state and thought. I am least confident that the merely-intentional reply, as staged here, successfully avoids collapsing consciousness into mere illusion; the poem leaves this tension unresolved in the final stanza's oscillation between an unconscious watcher and self-representing light.
