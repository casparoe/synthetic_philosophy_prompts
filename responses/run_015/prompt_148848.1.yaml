prompt: |-
  I work in distributed systems and think in terms of consensus protocols, Byzantine fault tolerance, state-machine replication, and message-passing between nodes with unknown failure modes. Please restate the philosophical debate about testimony—specifically reductionism (testimony is justified only by inductive tracking of a speaker's reliability) versus anti-reductionism (hearers possess a default entitlement to accept testimony, analogous to perceptual entitlement)—entirely within that vocabulary. Map speaker reliability to node-trust metrics, default acceptance to replication rules that do not require prior validation, and testimonial chains to multi-hop message propagation. Then give me a residue report: which philosophical claims translate without loss, which must be distorted to fit (for instance, social practices of accountability or moral dimensions of trust), and which have no counterpart in distributed-system design. Conclude by saying whether the untranslated residue points to something genuinely missing from an engineering framework—perhaps an irreducibly normative social dimension—or whether it indicates that part of the philosophical disagreement concerns distinctions that do not affect system behavior.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

