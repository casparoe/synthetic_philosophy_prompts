  6.  **Drafting - Iteration 2 (Fleshing out the Philosophy):**
      *   *Structural Manipulation:* Exploiting System 1 thinking (fast, emotional) to override System 2 (slow, rational). Even if facts are true.
      *   *Substantive Manipulation:* Changing the facts or hiding alternatives.
