answer: |-
  # The Unit of Selection Decision Tree

  **Start:** We agree we are looking at a population of entities that vary and leave different numbers of descendants.

  **Node 1 (The Equivalence Check)**
  When you say "genes are selected" versus "organisms are selected," are you describing two different causal processes that could theoretically pull in opposite directions, or are you describing the same frequency changes using different accounting variables?
  *   **A:** Different causal processes (Realist). → Go to Node 2.
  *   **B:** Different accounting variables (Bookkeeping). → **Leaf: Deflationary/Bookkeeping.**

  **Node 2 (The Meiotic Drive Case)**
  Consider Case 2: A meiotic-drive allele sweeps through a population, but every male carrying it is half-sterile. The allele frequency goes up; the total number of organisms goes down. Did "selection" favor the allele?
  *   **A:** Yes, the allele won despite the organism losing. → **Leaf: Genic/Gene's-Eye Selectionism.**
  *   **B:** No, selection cannot favor something that reduces the organism's total reproductive output. → Go to Node 3.

  **Node 3 (The Sterile Worker Case)**
  Consider Case 1: A sterile worker dies defending a colony of close kin. To explain why this trait exists, must you track the reproduction of the *queen* (kin), or can you track the survival of the *colony* as a whole?
  *   **A:** Must track the queen/kin (the worker's genes survive elsewhere). → **Leaf: Kin Selection / Inclusive Fitness.**
  *   **B:** Can track the colony (the colony survives because of the worker). → Go to Node 4.

  **Node 4 (The Reproduction Constraint)**
  To count as a "unit of selection," must that level of entity reproduce as a lineage (make copies of *itself*, e.g., colony fission), or is it enough that entities at that level differentially contribute particles (individuals) to the next generation?
  *   **A:** Must reproduce as a lineage (Heredity required). → Go to Node 5.
  *   **B:** Differential contribution is enough (Aggregation allowed). → Go to Node 6.

  **Node 5 (The Darwinian Individual Check)**
  If a level must reproduce to be a unit, does a multicellular organism count as a single "Darwinian individual" only if there is a single-cell bottleneck that aligns the fitness of all its cells?
  *   **A:** Yes, without a bottleneck, it's just a collection of competing cells. → **Leaf: Darwinian Individuals / Populations.**
  *   **B:** No, the organism is an individual regardless of internal conflict. → Go to Node 7.

  **Node 6 (The MLS1 vs. MLS2 Split)**
  Consider "Group Selection." Is the fitness of a group defined by the *average fitness of its members* (how many offspring the members have), or by the *number of new groups it produces* (how many daughter colonies it buds)?
  *   **A:** Average fitness of members. → **Leaf: Multilevel Selection 1 (Trait-Group).**
  *   **B:** Number of new groups produced. → **Leaf: Multilevel Selection 2 (Groups-as-Individuals).**

  **Node 7 (The Cancer Case)**
  Consider Case 3: Cancer cell lineages win inside a body while killing the body. Is this "selection at the cell level" occurring alongside organism selection, or is it a "breakdown of selection" at the organism level?
  *   **A:** Breakdown of organism selection (The organism failed to suppress cells). → **Leaf: Major Transitions / Hierarchy.**
  *   **B:** Selection at the cell level (Cells are always evolving, even inside bodies). → Go to Node 8.

  **Node 8 (The Hypothetical Colony Case)**
  Consider Case 4: In a colonial species, internal cell lineages compete to become germline. Colonies with *less* competitive internal lineages make more propagules. Within a colony, the *most* competitive lineage takes the germline slot. Which entity's fitness determines the long-term evolutionary trend?
  *   **A:** The cell lineage (it wins the slot, even if the colony makes fewer propagules). → **Leaf: Multilevel Selection 1 (Trait-Group).**
  *   **B:** The colony (it makes the propagules, even if the germline is recruited from 'weaker' cells). → **Leaf: Multilevel Selection 2 (Groups-as-Individuals).**

  **Node 9 (Causal Priority)**
  If gene frequencies and organism frequencies change in perfect lockstep, which change is the *cause* and which is the *effect*?
  *   **A:** Gene change is the cause (Organisms are vehicles). → **Leaf: Genic/Gene's-Eye Selectionism.**
  *   **B:** Organism change is the cause (Genes are records). → **Leaf: Organismal Primacy.**

  **Node 10 (Group Heredity)**
  For a group to be a unit (MLS2), does it need to split via fission (like a cell dividing), or is it enough that it sends out a swarm of propagules that found new groups?
  *   **A:** Needs fission/splitting (Strict Heredity). → **Leaf: Darwinian Individuals / Populations.**
  *   **B:** Propagules are enough (Loose Heredity). → **Leaf: Multilevel Selection 2 (Groups-as-Individuals).**

  ***

  # The Leaves (Positions)

  1.  **Deflationary/Bookkeeping:** All units of selection are just different ways of partitioning the same variance. No factual disagreement exists.
  2.  **Genic/Gene's-Eye:** The gene is the only replicator; all other units are vehicles. Meiotic drive is paradigmatic selection.
  3.  **Kin Selection / Inclusive Fitness:** Altruism is explained by genetic relatedness, not group benefit. The "group" is just a collection of kin.
  4.  **Darwinian Individuals / Populations:** A unit must have high fidelity reproduction (bottlenecks) to evolve. Organisms are Darwinian individuals; groups usually are not.
  5.  **Multilevel Selection 1 (Trait-Group):** Groups affect selection, but group fitness is just the aggregate of individual fitness. No group heredity required.
  6.  **Multilevel Selection 2 (Groups-as-Individuals):** Groups are individuals in their own right, with their own birth/death/reproduction rates distinct from members.
  7.  **Major Transitions / Hierarchy:** Evolution creates new higher-level individuals by suppressing selection at the lower level (e.g., somatic cells). Cancer is a reversion.
  8.  **Organismal Primacy:** The organism is the primary unit; lower levels are parts, higher levels are environments.

  ***

  # Analysis of Logical Space

  ### Unoccupied Answer Combinations
  There are several combinations of answers that are logically possible but theoretically unoccupied or unstable:

  1.  **Node 2 (No) + Node 9 (A):** Claiming meiotic drive is *not* selection (N2-B) but genes are the *cause* of evolution (N9-A).
      *   *Status:* **Incoherent.** If genes are the causal drivers, a gene that increases its frequency (meiotic drive) must be selected, regardless of organismal cost. Denying this while affirming genic causality is a contradiction.
  2.  **Node 4 (A) + Node 6 (A):** Claiming a level *must* reproduce to be a unit (N4-A) but defining group fitness as *average member fitness* (N6-A).
      *   *Status:* **Unattractive.** This mixes the "Darwinian Individual" requirement with the "MLS1" metric. If groups don't reproduce, they can't have "group fitness" in the reproductive sense. This position collapses into Organismal Primacy.
  3.  **Node 7 (A) + Node 8 (B):** Claiming cancer is a "breakdown" of organism selection (N7-A) but in the Hypothetical Colony, the *cell lineage* determines the trend (N8-A).
      *   *Status:* **Unexplored/Unstable.** This implies lower-level selection is "illegitimate" in natural organisms (cancer) but "legitimate" in the hypothetical colony. It requires a normative distinction between "natural" and "hypothetical" suppression that few theorists maintain.

  ### Indistinguishable Leaves
  The tree struggles to pull apart two specific pairs, confirming your suspicion about the deflationist and the kin-selectionist:

  1.  **Deflationary vs. Genic (Node 1):**
      *   *The Problem:* A hardline Genic Selectionist (Dawkins) and a Deflationist (Walsh) often make the exact same empirical predictions. The Genicist says "Only genes replicate," and the Deflationist says "Replication is a model-dependent concept." In practice, both will answer "Yes" to the Meiotic Drive case (Node 2) and "Gene" to Causal Priority (Node 9).
      *   *Flag:* The tree only separates them at Node 1, which relies on the user's philosophical self-identification rather than a concrete case. A user who says "It's just bookkeeping" but then treats genes as causal agents in Node 9 is functionally a Genicist.

  2.  **Kin Selection vs. MLS1 (Node 3 vs Node 6):**
      *   *The Problem:* Mathematically, Inclusive Fitness (Kin) and Trait-Group (MLS1) are often equivalent formulations of the Price Equation. A user might answer "Kin" at Node 3 (tracking the queen) but "Aggregate" at Node 6 (average member fitness).
      *   *Flag:* These are not distinct empirical positions but distinct accounting methods. The tree forces a choice at Node 3, but a sophisticated user will argue they are the same leaf. The tree treats them as distinct because of the *explanatory narrative* (kin vs. group), not the math.

  ### The "Hypothetical Colony" Function
  Case 4 (Node 8) is the strongest discriminator in the tree. It breaks the correlation between "internal success" and "external success."
  *   **MLS1/Genic** theorists must bite the bullet that the "selfish" cell lineage is the unit, even if the colony goes extinct.
  *   **MLS2/Transition** theorists must bite the bullet that the "altruistic" (less competitive) colony is the unit, even if the germline is recruited from winners.
  *   **Kin Selectionists** struggle here because the germline is *not* kin to the previous germline (recruited fresh), breaking the standard relatedness calculation. This forces them to either adopt an MLS2 view (Colony is the individual) or admit their model doesn't fit.
