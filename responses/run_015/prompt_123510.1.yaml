prompt: |-
  I am preparing a seminar on diachronic identity of artifacts and want the evaluative framework first, before consulting the standard literature. Consider this case: a 19th-century greenhouse is maintained for two centuries; every iron frame and glass pane is eventually replaced by mycelium-composite replicas grown in situ, chemically identical and structurally continuous but bearing no original manufacturing provenance, while the form, institutional designation, and ecological function remain unbroken. Write the desiderata any adequate theory of artifact persistence through material replacement must satisfy: the specific cases it must classify correctly (the greenhouse, a ship whose planks are replaced but the originals are stored in a warehouse, a car with every part swapped over time), the puzzles it must dissolve (the two-objects problem at full replacement, the boundary problem during gradual change, the distinction between restoration and replacement), and the conceptual distinctions it must preserve (material continuity versus formal or institutional continuity, provenance of parts versus provenance of structure). Flag any two desiderata that appear jointly unsatisfiable given ordinary metaphysical commitments. Then briefly score—without bibliographic citation—how mereological essentialism, four-dimensionalism (perdurance), and conventionalist or social-constructivist accounts each fare against your list, noting the specific failure that most undermines each view.
