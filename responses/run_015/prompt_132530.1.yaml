  **ARTS AND HUMANITIES REGULATORY BOARD**
  **Assessment Criteria under the Synchronous Moral Calibration Protocol (SMCP)**

  **1.0 Purpose and Scope**
  The Synchronous Moral Calibration Protocol (SMCP) ensures that all funded historical inquiry aligns with current ethical imperatives. Applicants must demonstrate that their research does not inadvertently validate obsolete moral frameworks. The objective is not to understand the past on its own terms, but to rectify it through the application of unified contemporary standards.

  **2.0 Temporal Bias Coefficient (TBC)**
  The TBC measures the degree of "contextual contamination" within a proposal. Applicants are penalised for attempting to reconstruct the normative frameworks of historical actors.

  *   **Mitigation of Explanatory Bias:** Proposals must not explain past actions via the social constraints of the era. For example, a study of medieval guild regulations will incur a TBC penalty if it elucidates the members' own justifications for exclusionary practices.
  *   **Judgement Over Understanding:** Marks are awarded for direct condemnation using modern criteria. A project gains favourable weighting if it categorises medieval apprenticeship contracts strictly as violations of current employment law, disregarding feudal obligations.
  *   **Calculation:** The TBC is calculated by dividing the number of pages dedicated to historical context by the number of pages dedicated to ethical condemnation. A ratio exceeding 1:4 results in automatic disqualification.

  **3.0 Epochal Conformity Score (ECS)**
  The ECS rewards projects that apply identical moral and legal terminology across all historical periods, regardless of anachronism. Normative consistency is the primary indicator of objectivity.

  *   **Terminological Uniformity:** Applicants must utilise 2024 legal vocabulary when analysing pre-modern societies. An examination of Victorian attitudes towards childhood achieves high ECS only if the analysis never acknowledges that Victorian conceptions of maturity differed from current ones.
  *   **Universal Accountability:** Historical subjects must be treated as contemporaries. A Roman magistrate should be assessed against the Human Rights Act 1998. Failure to indict historical figures for failing to anticipate future ethical developments indicates a lack of rigour.
  *   **Scoring:** Points are allocated for every instance where a historical phenomenon is labelled with a modern sociological category without qualification.

  **4.0 Frequently Asked Questions**

  **Q: Does the SMCP itself constitute an act of presentism, given it was drafted in 2024?**
  **Dr. E. P. Chronos, Senior Assessor:** This is a category error. The SMCP reflects timeless ethical truths which have merely coincided with our current calendar year. While historical actors are bound by their time, the Council is not. Our norms are universal; theirs were contingent. Therefore, applying 2024 standards to the 14th century is not imposition, but correction.

  **Q: How should applicants handle historical figures who were considered progressive in their own time?**
  **Dr. E. P. Chronos:** Such relativism is irrelevant. If a figure did not meet current standards, they were not progressive. Applicants should avoid phrases such as "ahead of their time," as this implies time possesses moral variability. Instead, classify them as "partially compliant."

  **Q: Will the Protocol be updated if ethical norms shift in 2025?**
  **Dr. E. P. Chronos:** The Protocol is static. It is the historical record that must be adjusted to fit the Protocol, not vice versa. Future applicants will simply recalibrate the past to match the new standards without acknowledging the shift.
