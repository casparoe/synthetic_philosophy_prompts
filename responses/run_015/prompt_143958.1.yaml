      *   **Task:** Translate the "hard problem of consciousness" (specifically panpsychism and the composition problem) into the user's distributed systems vocabulary.
      *   **Structure:**
          1.  **Visible Brainstorming Phase:** List candidate mappings, mark renames vs. smuggled assumptions, decide which to keep and why.
          2.  **Translation:**
