      *   **The Masking/Overwriting Worry:** User asks: Why don't we see the nodes if the service is real? In CS, both descriptions are valid. In Phil, the "nodes" (micro-subjects) shouldn't be experiential if the "service" (macro-subject) is the only one experiencing.
          *   *Critique:* In CS, nodes exist independently of the service abstraction. In Panpsychism, if micro-experiences exist, why aren't they *subjects*? The disanalogy is that "Service" is an abstraction for *users*, but "Subject" is the *user*. You can't abstract away the user.
