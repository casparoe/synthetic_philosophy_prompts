answer: |-
  Here's a decision tree to help you nail down what your conlang speakers are actually talking about. Since you can't peek into their brains, you have to trick them with edge cases.

  We're using three field tests to split the possibilities. Follow the **Yes/No** paths down to find your theory.

  ### **The Gavagai Decision Tree**

  **START: Point at a detached rabbit ear on the ground. Do they agree the word applies?**

  *   **YES** → Go to **Dead Rabbit Test**
  *   **NO** → Go to **Dead Rabbit Test**

  *(Wait, actually, if they say YES to the ear, we pretty much know what's up, but let's keep the tree consistent so you can spot weird contradictions.)*

  ---

  #### **Branch 1: The "Ear" Test = YES**
  *(They accept the word applies to just a part.)*

  **NEXT: Point at a whole dead rabbit. Does the word still apply?**

  *   **YES** → **Theory: Undetached Part Theory**
      *   *What it means:* The word doesn't mean "rabbit," it means "rabbit-piece." Even when they point at a whole bunny, they're technically referring to the collection of parts.
      *   *The Awkward Commitment:* You have to translate every instance of this noun as "rabbit-part" or "bit of rabbit." If your players try to buy a "live rabbit," the shopkeeper might hand them a bag of ears because that's literally what the word guarantees.
  *   **NO** → **Theory: Living Part Theory (Unnamed)**
      *   *What it means:* The word refers to a piece of the animal, but only if the animal is alive.
      *   *The Awkward Commitment:* You have to track the life status of every body part. If a rabbit loses an ear, does that ear stop being called by the word the second the rabbit dies? It makes inventory tracking a nightmare.

  ---

  #### **Branch 2: The "Ear" Test = NO**
  *(They insist the word only applies to the whole thing.)*

  **NEXT: Point at a dead rabbit. Does the word still apply?**

  *   **NO** → Go to **Sleeping Rabbit Test**
      *(The word requires life.)*
  *   **YES** → Go to **Sleeping Rabbit Test**
      *(The word tolerates death.)*

  ---

  #### **Branch 3: (From "Ear=NO" + "Dead=NO")**
  *(They say it's not an ear, and it's not a corpse.)*

  **NEXT: Point at a sleeping rabbit. Does the word still apply?**

  *   **YES** → **Theory: Animate Object Theory**
      *   *What it means:* The word means "living creature." It doesn't matter if it's moving, as long as it's breathing.
      *   *The Awkward Commitment:* You can never use this word for a stuffed toy, a robot, or a skeleton. If your players encounter a mechanical rabbit, you have to invent a completely new word for it, because this one strictly bans non-living things.
  *   **NO** → **Theory: Event/Process Theory**
      *   *What it means:* The word doesn't mean "rabbit" at all. It means "rabbiting" or "running rabbitly." It's a verb disguised as a noun.
      *   *The Awkward Commitment:* You can't say "There is a rabbit." You have to say "There is rabbiting happening." If the rabbit stops moving, it literally ceases to exist in the grammar. Your players can't capture one without the word becoming invalid.

  ---

  #### **Branch 4: (From "Ear=NO" + "Dead=YES")**
  *(They say it's the whole thing, and it still counts when dead.)*

  **NEXT: Point at a sleeping rabbit. Does the word still apply?**

  *   **YES** → **Theory: Whole Object Theory (or Universal Theory)**
      *   *What it means:* This is the standard setup. The word refers to the enduring object (the rabbit itself) regardless of what it's doing. Some philosophers argue it might refer to "Rabbithood" (the abstract idea), but practically, it works the same for translation.
      *   *The Awkward Commitment:* You have to treat the rabbit as the same entity from birth to death. If their grammar marks tense heavily on nouns, you're forced to decide if a baby rabbit is the "same word" as an adult rabbit. It locks you into a boring, object-focused worldview.
  *   **NO** → **🚫 EMPTY BRANCH (Logically Possible, Undefended)**
      *   *The Combo:* They accept the word for a **Dead** rabbit, but reject it for a **Sleeping** one.
      *   *Why this is empty:* This implies the word means "Corpse" specifically, even though you learned it by pointing at a *running* animal. Logically, you could teach a word this way, but nobody actually defends this interpretation because it violates basic pragmatics. If the word tolerates death (static), it should definitely tolerate sleep (static). If it requires motion, it should reject both. Accepting Death but rejecting Sleep makes no sense unless the word means "Dead Thing," which contradicts the original context.

  ---

  ### **Quick Translator's Cheat Sheet**

  1.  **If they accept the Ear:** You're translating **Parts**. Prepare for body-horror inventory lists.
  2.  **If they reject Motion (Sleeping=No):** You're translating **Events**. Prepare to turn all nouns into verbs.
  3.  **If they accept Everything (Dead=Yes, Sleep=Yes):** You're translating **Objects**. Boring, but safe.
  4.  **If they accept Dead but reject Sleep:** Stop testing. They're messing with you, or your logic is broken.

  **Pro-Tip:** If you land on **Whole Object**, try one extra test off the books: show them a *picture* of a rabbit. If they say the word applies, you're actually dealing with **Universal Theory** (they mean the abstract idea of "rabbit"). If they say no, it's definitely **Object Theory** (they mean the physical thing). That'll save you from headaches later if your magic system relies on names having power over ideas vs. things.
