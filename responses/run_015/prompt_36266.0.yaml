  Hey, I have been thinking about Maya's track record and I think I have figured out her system. Based on how she handled those earlier cases, I am pretty confident she will say that Dan does have a reason to call and apologize, and she will say the woman has no reason to keep her promise. It might seem counterintuitive for Dan since he feels nothing right now, but Maya's verdict on the scam charity suggests she cares more about the truth of the situation and the agent's underlying commitments than their current emotional state. Since Dan knows deep down that his standards of fairness condemn his behavior, Maya will likely treat his current numbness as a form of ignorance or avoidance rather than a lack of reason. For the woman with the promise, Maya will probably say she has no reason to keep it because if she knew the full cost to her kid, her desire to keep it would vanish. This mirrors the scam charity case where the donor has a reason to switch even if they never find out the truth, because the reality of the situation frustrates their actual goal of helping.

  The rule Maya seems to be running is a version of reflective internalism, which says you have a reason to do something if it aligns with what you would desire after full information and rational reflection on your existing values. This fits her view on the amoralist who has no underlying value for morality, and it fits the smoker and gossip who have clear current aversions. It also explains the gambler; since he never loses big, the condition that would trigger his self-loathing never happens, so there is no reason to stop based on his actual trajectory. However, there is another rule that fits all her past verdicts just as well, which is objective desire satisfaction. This rule says you have a reason to do whatever actually satisfies your current desires given the true facts of the world, regardless of what you believe. This explains the scam charity donor because they currently desire to help, and only the real charity satisfies that desire in reality. It also explains the gambler because his current desire for thrill is not objectively threatened by a loss that will never happen.

  Between the two new cases, Dan's situation does more to separate these rules. The woman's case is structurally almost identical to the scam charity case, where an agent is ignorant of a fact that frustrates their goal, so Maya's verdict there is heavily constrained by her previous ruling. Dan's case is different because it tests whether a dormant value counts as a current desire. The objective desire satisfaction rule would say Dan has no reason because he currently feels nothing and has no active motivation to apologize. Maya's reflective rule says he does have a reason because his own standards would condemn him if he just paid attention. Since the gambler case showed Maya rejects hypothetical reactions to non events, Dan is the true test of whether hypothetical reactions to actual events count as reasons.

  To settle this for good, you should bring her a case where someone has full information and a strong current desire, but knows they will regret it immediately upon reflection. Imagine a person who is furious and wants to send a nasty email right now. They know all the facts about the damage it will cause, and they admit that if they waited ten minutes they would not want to send it. If Maya says they have a reason to send it because they want to now, she is following the objective desire rule. If she says they have no reason because their reflective self rejects it, she is following the reflective internalism rule. That distinction between current impulse and reflective endorsement is the only gap left in her system. Let me know what she says when you ask her.
