answer: |-
  First off, congratulations: you have independently reinvented a sophisticated philosophical position known as **Attitudinal Hedonism**.

  You are absolutely right that the "common sensation" (or "tingle") version of the heterogeneity problem is largely considered a straw man by modern ethicists. Very few contemporary hedonists argue that reading a poem and drinking a beer share a specific phenomenological "glow." Most agree with you: what unifies pleasure is not a *sensation*, but a *pro-attitude*. It is the "wanting it to continue" aspect.

  However, the reason philosophers still treat the heterogeneity problem (and hedonism generally) as a live debate is that your solution solves the *descriptive* problem but opens up several difficult *normative* problems. You haven't so much dissolved the objection as shifted the battlefield.

  Here is where your definition faces serious friction, and why the debate is far from over.

  ### 1. The Tautology Trap (Direction of Fit)
  Your definition is: *Pleasure is the kind of experience you'd rather be having than not having.*

  This creates a problem regarding the "direction of fit."
  *   **Option A:** Do we want these experiences *because* they are pleasurable?
  *   **Option B:** Are they pleasurable *because* we want them?

  If you choose **Option B** (which your definition suggests), you risk making hedonism tautological. If "pleasure" just means "whatever people happen to desire to sustain," then the theory "One ought to maximize pleasure" translates to "One ought to maximize whatever one desires to maximize." That's empty. It offers no guidance. It also means if a masochist desires to sustain pain, that pain counts as "pleasure" by your definition, which breaks the common-sense link between pleasure and well-being.

  If you choose **Option A**, you need to explain *why* such heterogeneous things (beer, puzzles, friends) all trigger this desire. If the only answer is "because they are good for you," you are defining pleasure in terms of the good, rather than defining the good in terms of pleasure.

  ### 2. The Problem of False Pleasures
  Your "add them up" calculation assumes that the *source* of the pleasure doesn't matter, only the experience itself. This is the biggest hurdle for attitudinal hedonism.

  Consider the "Experience Machine" (Robert Nozick) or the "Deceived Businessman" (Fred Feldman).
  *   **Scenario:** You believe your friends love you and your career is thriving. You take great attitudinal pleasure in this (you want this state to continue).
  *   **Reality:** Your friends hate you and are mocking you behind your back; your career is a sham.

  Under your definition, you are experiencing "the kind of experience you'd rather be having." The internal attitude is identical. So, a hedonist must say your life is going just as well as the person whose friends *actually* love them.

  Many people have the strong intuition that the deceived person's life is *worse*, even if their subjective experience is identical. If you agree with that intuition, you are no longer a pure hedonist; you are admitting that **truth** or **authenticity** has value independent of the pleasure it produces. If you disagree and say the deceived life is equally good, you have to defend that counter-intuitive claim against the majority of human judgment.

  ### 3. The Aggregation Problem (Can you actually add them up?)
  You wrote: *"Can't I just list whatever experiences are good for me, weight them by how long and how strong they are, add them up, and be done?"*

  This assumes **commensurability**. It assumes there is a single currency (hedons) into which a cold beer and a spiritual epiphany can both be converted.

  The heterogeneity problem returns here, not as "do they feel the same?" but as "can they be measured on the same scale?"
  *   Is 100 units of "beer pleasure" exchangeable for 1 unit of "friendship pleasure"?
  *   If you say **yes**, you face the "Pushpin vs. Poetry" problem again. If you say **no** (that some pleasures are lexically superior and cannot be traded off), you have abandoned quantitative hedonism.

  If you abandon quantitative hedonism, you need a metric for *quality*. Mill tried to solve this by saying "higher pleasures" are those preferred by competent judges. But critics argue that if a competent judge prefers poetry because it involves *knowledge* or *beauty*, then it isn't the *pleasure* making it valuable; it's the knowledge or beauty. Again, hedonism collapses into a pluralistic theory of value.

  ### 4. Why Philosophers Don't Drop It
  You asked if the debate is overblown. It isn't, because the stakes are high for moral theory.

  If your definition holds, then **well-being is entirely subjective.** A life spent in a drug-induced coma where you *believe* you are saving the world is just as good as a life actually saving the world, provided the "attitudinal pleasure" intensity is the same.

  Most philosophers find this conclusion unacceptable. They argue that well-being must be partly **objective**. The heterogeneity objection is often a proxy for this deeper worry: *"These things feel different because they connect to different human needs (social, intellectual, physical), and treating them as a single homogenous substance ('pleasure') erases what actually makes them valuable."*

  ### Summary: Where your definition stands
  You are not wrong that the "common sensation" objection is weak. Your definition (Attitudinal Hedonism) is a standard, respected position in contemporary ethics (championed by philosophers like Fred Feldman).

  However, it is not a "get out of jail free" card. It trades the **Heterogeneity Problem** for:
  1.  **The Reality Problem:** Does truth matter for well-being?
  2.  **The Tautology Problem:** Is pleasure what we desire, or do we desire it because it's good?
  3.  **The Commensurability Problem:** Can distinct values really be summed on one scale?

  So, you haven't found a flaw in the philosophers' reasoning; you've just graduated from Hedonism 101 (Sensationalism) to Hedonism 201 (Attitudinalism). The objections are harder now, but they are also much more interesting.
