answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON THE INTERPRETATION OF PROBABILITY

  **Parties:** The Frequentist Working Group (FWG) and the Subjectivist Working Group (SWG)
  **Date:** October 26, 2023
  **Subject:** Charter for Structured Collaboration on Probability Semantics and Methodology

  ## PREAMBLE

  We, the undersigned, acknowledge a decade of persistent disagreement regarding the ontology and semantics of probability. We recognize that this disagreement has not hindered the mathematical development of the calculus of probability, but it has impeded communication regarding the justification of statistical inference in science. This document establishes the ground rules for our collaboration. It does not seek to dissolve our differences via compromise, but to isolate them with precision. We agree to distinguish between disputes over *terminology* (verbal), disputes over *mathematical consistency* (formal), and disputes over *ontological commitment* (substantive).

  ## SECTION I: SUBSTANTIVE SHARED CLAIMS

  We jointly affirm the following propositions. These are not merely diplomatic pleasantries but commitments to the utility and formal constraints of our respective frameworks.

  1.  **Formal Identity:** Both parties accept the Kolmogorov axioms as the necessary formal constraints for any calculus bearing the name "probability." Disagreement exists regarding the *interpretation* of the terms in the axioms, not the algebraic manipulation of those terms.
  2.  **Empirical Adequacy of Frequencies:** Both parties agree that in repeatable experimental conditions (e.g., particle collisions, quality control sampling), relative frequencies converge to stable values. The FWG identifies this convergence as the *definition* of probability; the SWG identifies this as a *constraint* on rational belief (via the Principal Principle or calibration).
  3.  **Operational Utility of Betting Quotients:** Both parties agree that agents who consistently violate the laws of probability in setting betting quotients are susceptible to Dutch Books (sure losses). The SWG views this as a normative foundation for probability; the FWG views this as a pragmatic consistency check on decision-making under uncertainty, independent of ontological claims.
  4.  **Methodological Convergence:** In many standard inference problems (e.g., normal means with flat priors), Frequentist Confidence Intervals and Bayesian Credible Intervals yield numerically identical results. Both parties agree that reporting such numbers is scientifically useful, even if the *justification* for the report differs.
  5.  **Predictive Calibration:** Both parties agree that a probabilistic forecast is defective if it is systematically miscalibrated (e.g., events assigned 70% probability occur only 40% of the time). The FWG views miscalibration as a falsification of the frequency model; the SWG views it as evidence of incoherent learning or poor prior specification.

  ## SECTION II: MAP OF DISAGREEMENTS

  The following table isolates specific points of divergence. We have attempted to phrase each party's position such that the other party acknowledges it as a faithful representation of their opponent's view. The final column classifies the nature of the disagreement.

  | Issue | Frequentist Formulation (FWG) | Subjectivist Formulation (SWG) | Classification & Rationale |
  | :--- | :--- | :--- | :--- |
  | **1. The Unit of Analysis** | Probability claims apply primarily to *procedures* or *collectives*. A claim about a single event is elliptical for a claim about the reference class to which the event belongs. | Probability claims apply primarily to *propositions* regarding single events. A claim about a collective is derivative of aggregated single-event beliefs. | **Verbal / Semantic.** Both parties can calculate the same numbers for the same cases. The dispute is over which entity (event vs. class) is the primary bearer of the property "probability." |
  | **2. Single-Event Claims** | "There is a 30% chance this patient dies" is meaningless unless expanded to "30% of patients in reference class *R* die." The choice of *R* is objective, determined by causal homogeneity. | "There is a 30% chance this patient dies" is a complete statement of the clinician's degree of belief, conditioned on all available data. Reference classes are heuristic aids, not ontological grounds. | **Substantive (Pragmatic).** If FWG is right, single-event risk communication is strictly false. If SWG is right, FWG risk communication is unnecessarily restricted. This affects clinical practice guidelines. |
  | **3. Infinite Sequences** | The "hypothetical infinite sequence" is a necessary idealization, akin to frictionless planes in physics. It defines the limit that finite frequencies approximate. | The "hypothetical infinite sequence" is a metaphysical fiction. Probability is defined by finite coherence conditions; the limit is a mathematical consequence, not a physical precondition. | **Substantive (Ontological).** FWG commits to the existence (or meaningfulness) of counterfactual infinite ensembles. SWG denies this commitment is necessary or coherent. |
  | **4. Quantum Mechanics** | The Born rule describes a physical propensity inherent in the system, measurable only via ensemble statistics. The probability exists prior to measurement. | The Born rule describes an agent's maximal information about the outcome of a measurement. The probability is a statement about the observer's expectations, not the system's intrinsic state. | **Substantive (Ontological).** This is a disagreement about the nature of physical reality (propensity vs. information), not merely statistics. |
  | **5. Identical Intervals** | A 95% Confidence Interval means: "If we repeated this procedure infinitely, 95% of intervals would contain the true parameter." The specific interval either contains it or it does not. | A 95% Credible Interval means: "Given the data and prior, there is a 95% degree of belief the parameter lies here." | **Verbal (with Substantive Consequences).** The math is identical in specific cases. The disagreement is over what inference is licensed *after* the data is observed (conditioning on the specific interval vs. the procedure). |
  | **6. Objectivity** | Objectivity is achieved by eliminating personal judgment (priors) and adhering to pre-specified error rates (alpha levels). | Objectivity is achieved by transparency of priors and adherence to coherence rules. All methods involve judgment; hiding it (via reference class selection) is less objective than stating it. | **Substantive (Methodological).** Disagreement on what constitutes "bias." FWG sees priors as bias; SWG sees reference class selection as hidden priors. |

  ## SECTION III: THE CRUXES (PRE-REGISTERED TESTS)

  To move beyond stalemate, we identify three empirical or logical "cruxes." Resolution of these points would require at least one party to modify their stated position. We pre-register our predictions and the concessions we are prepared to make should the evidence weigh against us.

  ### Crux 1: The Reference Class Problem
  **Question:** In cases where an individual belongs to multiple, equally causal reference classes with divergent frequencies (e.g., a patient who is both a "smoker" and a "marathon runner"), is there a fact of the matter regarding which class determines the "true" probability?

  *   **FWG Prediction:** There is a fact of the matter, determined by the most causally specific homogeneous class. Statistical methods can identify this class objectively.
  *   **SWG Prediction:** There is no fact of the matter. The choice of class reflects the agent's decision-theoretic goals and prior judgments about relevance.
  *   **Accepted Evidence:** Analysis of predictive accuracy in machine learning models when feature selection (reference class proxy) is varied.
  *   **Anticipated Concession (FWG):** *If* it is demonstrated that "causal homogeneity" cannot be determined without implicit prior assumptions about feature relevance, the FWG concedes that **reference class selection involves non-frequency judgments functionally equivalent to prior specification.**
  *   **Anticipated Concession (SWG):** *If* it is demonstrated that arbitrary prior selection leads to systematically worse calibration than frequency-based reference classes, the SWG concedes that **coherence alone is insufficient for empirical accuracy and must be constrained by frequency data.**

  ### Crux 2: Expert Calibration
  **Question:** Can human agents maintain coherent degrees of belief (probabilities) that are well-calibrated to frequencies *without* access to long-run frequency data for the specific event type (e.g., geopolitical forecasting)?

  *   **FWG Prediction:** No. Without a repeatable trial structure, "probability" claims by experts are indistinguishable from guesswork. Calibration will not exceed chance.
  *   **SWG Prediction:** Yes. Through scoring rules and feedback on binary outcomes, agents can learn to align subjective belief with empirical rates, even for unique events.
  *   **Accepted Evidence:** Data from structured forecasting tournaments (e.g., IARPA ACE, Good Judgment Project) regarding Brier scores of super-forecasters vs. baseline frequency models.
  *   **Anticipated Concession (FWG):** *If* super-forecasters consistently outperform simple frequency baselines on unique events, the FWG concedes that **single-event probability claims can possess empirical content distinct from simple reference class frequencies.**
  *   **Anticipated Concession (SWG):** *If* expert calibration decays rapidly without aggregate frequency feedback, the SWG concedes that **subjective probability is not self-correcting and requires frequentist error-checking mechanisms.**

  ### Crux 3: Model Misspecification
  **Question:** When the statistical model is known to be false (which is always the case), which framework provides more robust error control: Frequentist robustness checks or Bayesian posterior predictive checks?

  *   **FWG Prediction:** Frequentist methods provide guaranteed error rates (Type I/II) regardless of the truth of the model, provided assumptions (e.g., randomization) hold. Bayesian methods inherit the bias of the prior/model.
  *   **SWG Prediction:** Bayesian methods allow for direct probability statements about model fit (posterior predictive p-values) and can average over model uncertainty. Frequentist guarantees vanish when assumptions are violated.
  *   **Accepted Evidence:** Simulation studies where data is generated from a process structurally different from the analysis model (e.g., non-linear truth, linear model).
  *   **Anticipated Concession (FWG):** *If* Frequentist error rates are shown to be nominal only (not actual) under common forms of misspecification, the FWG concedes that **"objectivity" via error control is fragile and depends on untestable model assumptions.**
  *   **Anticipated Concession (SWG):** *If* Bayesian model averaging is shown to be computationally intractable or overly sensitive to hyper-priors in high-dimensional misspecification, the SWG concedes that **Frequentist robustness offers a necessary pragmatic safeguard that subjective coherence cannot replicate.**

  ## SIGNATORIES

  We sign this document not as an agreement on truth, but as a commitment to test the boundaries of our respective doctrines against the constraints listed above.

  _________________________
  **Lead, Frequentist Working Group**
  *Date:*

  _________________________
  **Lead, Subjectivist Working Group**
  *Date:*

  _________________________
  **Facilitator, Philosophy of Science Dept.**
  *Date:*
