prompt: |-
  I am writing the framing chapter for an edited volume at the intersection of philosophy of biology, astrobiology, and synthetic biology, and I do not want to open it by parading the familiar candidate definitions and scoring them. I want the specification first: what would a definition of life have to be able to do in order to count as adequate?

  The purpose, since adequacy is relative to it. I need the definition to do two jobs, and I strongly suspect they are not the same job. The first is to tell a sample-return team what kind of finding would justify announcing a discovery, and what would justify staying silent. The second is to tell an oversight body for synthetic biology which artifacts fall inside its remit and which are merely complicated chemistry. If those two purposes pull the requirements in different directions, that divergence is itself one of the results I want, so please say so explicitly rather than splitting the difference.

  What I want from you is a list of requirements, each accompanied by the case or consideration that makes it a requirement rather than a taste: which phenomena the definition must cover, which verdicts it must be able to return, which distinctions it must respect, which findings from chemistry, thermodynamics, and evolutionary theory it must not contradict. For each, say whether it is non-negotiable or merely the preference of one camp, and identify which requirement does the most exclusionary work against the theories actually on offer. Where some subset cannot be jointly satisfied, give the argument for the incompatibility and say which item you would drop and why.

  The case base, so that the requirements are anchored rather than abstract. Here is my working inventory; add to it any case that discriminates between definitions my list does not separate. Viruses and viroids, which evolve and have lineages but no metabolism, with the complication that the largest of them carry genes for translation and blur into the cellular. Prions: heritable, selectable, sequence-free, no nucleic acid at all. Transposons and other selfish genetic elements that reproduce inside a genome while being parts of one. Organisms of zero fitness: mules, sterile workers, a neutered animal. Everything at the temporal edges: spores, desiccated tardigrades, centuries-old seeds, permafrost microbes revived after geological time, cryopreserved embryos, a vitrified organ, a cell line that has outlived its donor by decades and whose karyotype is no longer that of the donor species. The part-whole tangle: a cultured cell, a gamete, an organoid, a siphonophore colony, a eusocial colony considered as a unit, a mycelium with no clear individual boundary, a cellular slime mold aggregating. Things that maintain themselves, grow, and propagate without being organisms on any view: flames, growing crystals, convection cells, autocatalytic sets, storms. Software: a computer worm, an evolved agent in a simulated physics, a program running on hardware it cannot build. Engineered and dissociated entities: a cell whose genome was chemically synthesized and booted up inside a recipient stripped of its own DNA; protocells with compartment and metabolism but no heredity; hereditary systems with heredity but no metabolism; frog cells reassembled into motile constructs that replicate by pushing other cells into piles; organisms engineered with recoded genomes and kill switches so that they cannot exchange genes and have no evolutionary future; chirality-reversed organisms that would metabolize and evolve while sharing no molecular code with anything on Earth.

  And one case I have constructed precisely because no existing discussion has had to take a stand on it. A culture is derived from a subsurface sample returned from an icy moon. It is maintained in a solvent that is not water, at temperatures where Earth biochemistry does not operate, on a mineral substrate. Across two hundred transfers it shows heritable variation, competition for surface, and directional change: the composition of the mineral face shifts in ways that persist and that improve retention of the face under the transfer regime. There is no membrane, no polymer, no genome, no identifiable individual, no discrete generation. If there is a unit of selection it is the composition of a surface. I want to know what a definition must be able to say about this, what would count as evidence on either side, and which of your requirements a definition fails the moment it cannot return a verdict here.

  Distinctions I expect a definition to keep apart rather than collapse: being alive versus being an organism; being alive versus being a living individual; being alive versus being part of something alive; being alive versus being capable of becoming alive; being alive versus having interests or a moral status; being alive versus having a mind, a goal, or agency; and the definition's own content versus the operational markers a lab would use to detect it.

  Constraints from outside the case base. No vitalism: the definition must be continuous with chemistry and physics rather than carving life off as a separate substance or force. Every organism we know descends from a single origin, so we have one independent instance, and a definition checked only against it cannot claim Generality without argument. Any definition that builds in carbon, water, or nucleic acid must answer the parochialism objection directly. Far-from-equilibrium self-maintenance is presumably necessary but plainly not sufficient, since flames and convection cells have it. Evolution by selection is a property of populations over time, not of a token organism at an instant, which threatens any definition that makes life a property of individuals and then has to verdict on the mule and the spore. And the definition must not be circular with respect to our instruments: a definition of the form life is whatever our current assay portfolio flags would tell the sample-return team nothing it did not already know, while a definition no instrument could ever apply is useless to them.

  Tensions I want adjudicated rather than smoothed over. Generality across unknown substrates versus discriminating power against flames, crystals, and software: I suspect you cannot maximize both, and I want to see where the trade-off bites. A sharp boundary, which the oversight body needs, versus fidelity to what may be a genuinely graded phenomenon. Verdicts at the level of individuals versus verdicts at the level of lineages, given individuals without lineages and lineages without individuals. Descriptive neutrality versus the temptation to gerrymander the boundary so that embryos, organoids, or artificial systems land on the side one already wants for ethical reasons; I would treat that temptation as a vice, but tell me if you disagree. There is also the possibility of a relational definition, on which a thing is alive only with respect to some larger system or process; I would like to see how far that goes, what it costs, and whether it is a real option or a way of changing the subject.

  Close with a short scorecard, no more than a sentence or two each, for the main contenders as you see them: the astrobiology working definition in the vicinity of a self-sustaining chemical system capable of Darwinian evolution, autopoietic accounts, negative-entropy and far-from-equilibrium accounts, accounts that start from Darwinian populations rather than from organisms, and any others you think belong on the list. Keep the weight on the criteria and on the cases; the scorecard is for orientation only. And give me your view on the last question: if the requirements really are jointly unsatisfiable, does that show that life is not the kind of thing that has a single correct definition, and if so, what replaces the project?

  One instruction about form. Write as if you had no library and no connection: reason from the cases, the distinctions, and the constraints I have given, and do not spend your words on who said what. A table for the requirements is welcome, prose for the incompatibilities. I would rather have eight argued requirements than twenty listed ones.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Goal:** Write a framing chapter for an edited volume (philosophy of biology, astrobiology, synthetic biology).
      *   **Task:** Specify requirements for an *adequate* definition of life, *not* by listing existing definitions, but by asking what work the definition must *do*.
      *   **Two Main Jobs:**
          1.  Guide a sample-return team (astrobiology): When to announce discovery vs. stay silent.
          2.  Guide an oversight body (synthetic biology): What artifacts fall under regulation vs. complicated chemistry.
      *   **Key Constraint:** If these jobs pull in different directions, highlight the divergence explicitly. Do not smooth it over.
      *   **Output Format:**
          *   List of requirements (anchored in cases/constraints).
          *   Table for requirements (preferred).
          *   Prose for incompatibilities/tensions.
          *   Scorecard for main contenders (brief).
          *   Final view on whether a single definition is possible.
          *   *Style:* Reason from cases/constraints provided, no citations/library references ("write as if you had no library").
          *   *Quantity:* ~8 argued requirements rather than 20 listed ones.
      *   **Specific Cases to Address:** Viruses, prions, transposons, zero-fitness organisms, temporal edges (spores, etc.), part-whole tangles (colonies, organoids), non-living analogs (flames, crystals), software, engineered entities, and the *constructed case* (icy moon surface composition evolution).
      *   **Specific Distinctions to Keep:** Alive vs. Organism, Alive vs. Individual, Alive vs. Part, Alive vs. Potential, Alive vs. Moral Status, Alive vs. Agency, Definition vs. Operational Markers.
      *   **Constraints:** No vitalism, acknowledge single origin (N=1), avoid parochialism (C/H2O/DNA), avoid circularity with instruments.
      *   **Tensions to Adjudicate:** Generality vs. Discrimination, Sharp Boundary vs. Graded Phenomenon, Individual vs. Lineage, Descriptive Neutrality vs. Ethical Gerrymandering, Relational Definitions.

  2.  **Deconstruct the Two Jobs (Astrobiology vs. Synthetic Biology):**

      *   *Astrobiology (Sample Return):* Needs high specificity to avoid false positives (flames, crystals). Needs to handle unknown substrates (non-water, non-polymer). Needs to detect *process* over time (evolution) but often only has a snapshot or short window. The "Icy Moon Surface" case is critical here.
      *   *Synthetic Biology (Oversight):* Needs clear boundaries for regulation (binary decision: regulated or not). Needs to handle engineered edge cases (kill switches, recoded genomes, xenobiology). Needs to distinguish between "living tool" and "chemical reagent."
      *   *Divergence:* Astrobiology might tolerate a process-based, graded, or relational definition (is this *system* evolving?). Synthetic Biology needs an entity-based, binary definition (is *this bottle* regulated?). Astrobiology looks for *evidence of history*; SynBio looks for *capacity for future risk*.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: Substrate Neutrality.* (Addresses Parochialism). Must cover the Icy Moon case. Non-negotiable for Astro, important for SynBio (xenobiology).
      *   *Requirement 2: The Individual/Lineage Split.* (Addresses Mules, Spores, Viruses). A definition must distinguish the token from the type. Non-negotiable.
      *   *Requirement 3: The False Positive Filter.* (Addresses Flames, Crystals, Software). Must exclude far-from-equilibrium systems that lack heredity or specific closure. Non-negotiable for Astro.
      *   *Requirement 4: Operationalizability.* (Addresses Instrument Circularity). Must be detectable without defining life *as* the detection method. Non-negotiable for both.
      *   *Requirement 5: The Engineering Boundary.* (Addresses SynBio Oversight). Must distinguish between a self-maintaining system and a controlled chemical reaction. Crucial for SynBio, less for Astro.
      *   *Requirement 6: Temporal Resilience.* (Addresses Spores, Dormancy). Must account for potentiality without defining life as merely potential.
      *   *Requirement 7: Part-Whole Coherence.* (Addresses Colonies, Organoids). Must distinguish the living unit from the living part.
      *   *Requirement 8: The Verdict Requirement.* (Addresses the Icy Moon Case). Must be able to say "Yes," "No," or "Insufficient Data" without collapsing into agnosticism.

      *Refining for the Prompt's "Divergence" Instruction:* I need to make sure Requirement 5 (Engineering) and Requirement 1 (Substrate) might conflict with Requirement 3 (False Positives) in specific ways. Actually, the biggest conflict is between *Sharp Boundary* (SynBio) and *Graded/Process* (Astro/Evolution). Let's make that a central tension in the incompatibility section.

      *Refining the "Icy Moon" Case:* This is the stress test. It has heredity (composition shifts), selection (retention), but no individual, no membrane, no polymer. A definition based on "cells" fails. A definition based on "Darwinian evolution" passes. A definition based on "autopoiesis" (boundary) might fail.

  4.  **Developing the Incompatibilities (The "Meat"):**

      *   *Tension 1: Binary Regulation vs. Continuous Evolution.* SynBio needs a switch (Regulate/Don't Regulate). Astrobiology deals with probabilities and gradients (Likely Life/Abiogenesis/Life-like).
      *   *Tension 2: Individual vs. Population.* Mules are alive but dead ends. Viruses are lineage but not individuals. The Icy Moon is a population process without individuals. You can't satisfy "Alive Individual" and "Alive Lineage" with one predicate.
      *   *Tension 3: Generality vs. Discrimination.* To include the Icy Moon, you must generalize "metabolism" and "heredity." To exclude flames, you must specify "constraint" and "coding." The wider you cast the net for Astro, the more chemical noise you catch for SynBio.

  5.  **Drafting the Scorecard:**

      *   *NASA/Working Definition:* Good for Astro, bad for SynBio (too vague on individual).
      *   *Autopoiesis:* Good for Individual/Boundary, bad for Icy Moon/Viruses (no membrane).
      *   *Thermodynamic:* Good for Physics, bad for Discrimination (includes flames).
      *   *Darwinian Population:* Good for Icy Moon/Viruses, bad for Mules/Spores (individual verdict).
      *   *Synthetic/Functional:* Good for Engineering, bad for Substrate Neutrality (often assumes Earth chemistry).

  6.  **Final Conclusion:**

      *   Is a single definition possible? Likely not, given the divergent purposes. The project should shift from "What is life?" to "What concept of life serves this specific inquiry?" (Pluralism/Pragmatism).

  7.  **Review against Constraints:**

      *   *No Library:* Avoid names (Kant, Schrödinger, NASA, Gánti, etc.). Use descriptions ("the working definition," "the self-making account").
      *   *Table:* Use for requirements.
      *   *Prose:* For tensions.
      *   *Tone:* Philosophical, rigorous, direct.
      *   *Case Coverage:* Ensure Viruses, Mules, Flames, Icy Moon are explicitly referenced in the requirements/tensions.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I explicitly state the divergence between the two jobs? *Correction:* Ensure the introduction and the incompatibility section highlight that the Sample-Return Team and the Oversight Body have fundamentally different truth conditions.
      *   *Check:* Did I address the Icy Moon case specifically? *Correction:* Make sure Requirement 1 or 8 hinges on this. Let's put it in Requirement 1 (Substrate/Structure) and the Incompatibility section (Individual vs. Process).
      *   *Check:* Is the table clear? *Correction:* Ensure columns for "Non-negotiable/Preference" and "Exclusionary Work" are clear.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### The Functional Specification for a Definition of Life

  A definition of life is not a mirror of nature but a tool for inquiry. Its adequacy is not determined by its fit with intuition, but by its capacity to discharge specific duties without contradiction. You have identified two distinct duties: the **Discovery Duty** (astrobiology/sample-return) and the **Regulatory Duty** (synthetic biology/oversight). The Discovery Duty requires high sensitivity to unknown forms and tolerance for process-based evidence; the Regulatory Duty requires high specificity, binary verdicts, and entity-based accountability.

  Below are eight requirements derived from your case base and constraints. They are not a consensus of the field but a specification of what a definition *must* survive to be useful.

  #### Table of Requirements

  | Req. | Specification | Anchoring Case / Consideration | Status | Exclusionary Work |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Substrate & Structure Neutrality** | *Icy Moon Surface.* Must verdict on heritable surface composition without polymers, membranes, or water. | Non-negotiable (Astro) | Excludes definitions requiring cells, DNA, or specific chemistry (carbon/water). |
  | **2** | **The False-Positive Filter** | *Flames & Crystals.* Must distinguish far-from-equilibrium self-maintenance from metabolic closure. | Non-negotiable (Both) | Excludes pure thermodynamic accounts (negative entropy alone). |
  | **3** | **The Token/Type Distinction** | *Mules & Spores.* Must distinguish being alive (token) from being part of a lineage (type). A mule is alive; a sterile lineage is not. | Non-negotiable (Both) | Excludes definitions that define life *only* as evolution (cannot verdict on individuals). |
  | **4** | **Operational Independence** | *Instrument Circularity.* "Life" cannot be defined as "what our assays detect." Must allow for false negatives. | Non-negotiable (Astro) | Excludes operational definitions tied to current tech (e.g., "detects ATP"). |
  | **5** | **The Engineering Boundary** | *Recoded Kill-Switches.* Must classify engineered organisms with no evolutionary future as alive (for regulation) despite lacking Darwinian potential. | Non-negotiable (SynBio) | Excludes strict Darwinian definitions (would classify engineered sterile organisms as non-living chemistry). |
  | **6** | **Temporal Resilience** | *Dormancy (Spores/Seeds).* Must account for suspended animation without defining life as mere potentiality. | Non-negotiable (Both) | Excludes definitions requiring continuous metabolism at every instant. |
  | **7** | **Part-Whole Coherence** | *Colonies & Organoids.* Must distinguish the living unit from the living part without arbitrary size cutoffs. | Preference (Philosophy) | Excludes definitions that cannot handle nested hierarchies (e.g., strict individualism). |
  | **8** | **Verdict Capacity** | *Icy Moon & Viruses.* Must return a Yes/No/Insufficient Data verdict, not a gradient of "aliveness." | Non-negotiable (SynBio) / Preference (Astro) | Excludes cluster-concept or family-resemblance accounts (cannot regulate gradients). |

  ***

  ### Incompatibilities and Tensions

  The requirements above cannot be jointly satisfied by a single definition. This is not a failure of current theory but a structural feature of the two jobs you have assigned. The divergence is sharpest between the **Discovery Duty** and the **Regulatory Duty**.

  **1. The Individual vs. Population Tension (Requirements 3 & 5)**
  The Discovery Duty is fundamentally historical and population-based. To identify the *Icy Moon Surface* case as life, the definition must track heredity and selection across transfers. This favors a Darwinian account. However, the Regulatory Duty is fundamentally instantaneous and entity-based. An oversight body cannot regulate a "population process"; it regulates a *vial*.
  *   **The Conflict:** A strict Darwinian definition (life = capacity for open-ended evolution) fails the Regulatory Duty. It would classify a genetically recoded organism with a kill-switch as "non-living chemistry" because it has no evolutionary future. Yet, for safety oversight, that organism is biologically active and dangerous. Conversely, a definition that classifies the recoded organism as alive (to satisfy Regulation) risks classifying the *Icy Moon Surface* as non-living if it lacks discrete individuals to hold the "status" of life.
  *   **Resolution:** You must drop the demand for a single predicate. The Discovery Duty requires a **Process Definition** (is this system evolving?). The Regulatory Duty requires a **State Definition** (is this entity metabolically active and self-maintaining?). A mule is alive by State, dead by Process. The Icy Moon is alive by Process, ambiguous by State. A single definition that forces these into one category will either over-regulate chemistry or under-detect alien life.

  **2. The Sharp Boundary vs. Graded Phenomenon Tension (Requirements 2 & 8)**
  The Regulatory Duty demands a binary switch: the artifact is either under remit or it is not. The Discovery Duty, however, confronts abiogenesis and edge cases (viruses, protocells) that suggest life is a gradient of complexity.
  *   **The Conflict:** To satisfy the Oversight Body, you must draw a line that excludes autocatalytic sets but includes protocells. To satisfy the Sample-Return Team, you must acknowledge that the line between "complex chemistry" and "life" may be empirically unfindable in a single snapshot. If you enforce a sharp boundary (Req 8), you risk arbitrary exclusion of the *Icy Moon* case if it lacks one specific marker (e.g., a membrane). If you allow a gradient, the Oversight Body cannot write law.
  *   **Resolution:** The Sharp Boundary is a legal fiction required for Regulation, not a biological truth. The definition for Regulation must be **stipulative** (we define life as X for the purpose of this act). The definition for Discovery must be **diagnostic** (we infer life from evidence Y). Treating the stipulative boundary as a natural kind is a category error.

  **3. Generality vs. Discrimination (Requirements 1 & 2)**
  To include the *Icy Moon Surface* (non-polymer, non-cellular), you must generalize "metabolism" to "resource transformation" and "heredity" to "informational persistence."
  *   **The Conflict:** As you generalize to accommodate alien substrates, you invite false positives. A convection cell transforms resources and persists. A computer worm persists and replicates. To exclude these, you must add constraints (e.g., "chemical," "physical embodiment"). But adding constraints risks parochialism (excluding the *Icy Moon* if its "chemistry" is too exotic).
  *   **Resolution:** The most exclusionary work is done by the requirement for **material heredity coupled to functional constraint**. Software is excluded not because it is digital, but because its hardware is not produced by its own code. Flames are excluded because their structure is not heritable. The *Icy Moon* passes only if the surface composition *causes* the retention of that composition. This is the narrowest bottleneck: **causal closure between structure and persistence.**

  **4. Descriptive Neutrality vs. Ethical Gerrymandering**
  You noted the temptation to define life to secure moral status for embryos or organoids.
  *   **The Conflict:** If "alive" implies "has moral status," then definitions will be fought over ethically, not empirically. A mule is alive but has different status than a human. A cultured organoid may be alive but lack interests.
  *   **Resolution:** This requirement must be dropped entirely from the definition of life. "Alive" is a biological classification; "Moral Status" is an ethical assignment. Conflating them renders the definition useless for both Astrobiology (which doesn't care about rights) and SynBio (which needs to regulate pathogens that have no moral status). The definition must be **morally inert**.

  ***

  ### The Icy Moon Verdict

  Your constructed case is the stress test. A culture with heritable variation, competition, and directional change, but no membrane, polymer, genome, or individual.

  *   **What the definition must say:** It must be able to classify this as **Life** (or at least "Biological System") based on the *process* of selection acting on heritable variation, despite the lack of discrete individuals.
  *   **Evidence required:** Proof that the surface composition changes are **heritable** (daughter surfaces resemble parent surfaces) and **functional** (composition affects retention/survival). If the changes are random drift without selection, it is chemistry. If they are directed by the physics of the transfer regime without variation, it is crystal growth. It is life only if the history of the surface constrains its future composition via a selection mechanism.
  *   **Which requirement fails:** Any definition that requires a **discrete individual** (Req 7 strictness) or a **genomic polymer** (Req 1 violation) fails immediately. Autopoietic accounts fail (no membrane). Strict Darwinian accounts succeed *if* they apply to populations, but fail the Regulatory Duty (who do you fine for contamination?).

  ***

  ### Scorecard of Contenders

  *   **The Working Definition (Self-sustaining chemical system capable of Darwinian evolution):**
      *   *Verdict:* Best for Astrobiology, fails SynBio.
      *   *Flaw:* Cannot verdict on mules (no evolution) or engineered kill-switch organisms (no future evolution); too vague on "chemical system" for the Icy Moon case.
  *   **Autopoietic Accounts (Self-making boundaries):**
      *   *Verdict:* Best for Individuality, fails Astrobiology.
      *   *Flaw:* Excludes viruses, prions, and the Icy Moon surface (no membrane/compartment); risks vitalism if "self-making" is not rigorously physicalized.
  *   **Thermodynamic Accounts (Far-from-equilibrium/Entropy):**
      *   *Verdict:* Best for Physics, fails Discrimination.
      *   *Flaw:* Includes flames, storms, and convection cells; lacks a mechanism for heredity, making it useless for distinguishing life from complex chemistry.
  *   **Darwinian Population Accounts:**
      *   *Verdict:* Best for Icy Moon/Viruses, fails Individual Verdicts.
      *   *Flaw:* Cannot tell a sample-return team if *this specific rock* is alive, only if the *system* is evolving; useless for regulating a specific vial of engineered cells.
  *   **Functional/Systems Accounts:**
      *   *Verdict:* Best for SynBio, risks Parochialism.
      *   *Flaw:* Often implicitly assumes Earth-like modularity; may exclude the Icy Moon if "function" is tied to known biochemical pathways.

  ***

  ### Final View: The Impossibility of a Single Definition

  If the requirements are jointly unsatisfiable, it shows that **life is not a natural kind with a single essence, but a cluster of phenomena that serve different explanatory roles.**

  The project should not be to find the One Definition, but to replace the question "What is life?" with "**Which concept of life is required for this inquiry?**"

  1.  **For Discovery:** Use a **Process Concept**. Life is a historical lineage of evolving systems. This accommodates the Icy Moon, viruses, and unknown substrates. It accepts gradients and probabilities.
  2.  **For Regulation:** Use a **State Concept**. Life is a self-maintaining chemical entity capable of interaction with biosphere X. This accommodates mules, engineered organisms, and pathogens. It demands binary boundaries.
  3.  **For Ethics:** Discard the biological definition entirely. Use a **Sentience/Interest Concept**. Being alive is neither necessary nor sufficient for moral status.

  To insist on a single definition is to force a legal boundary onto a historical process, or a historical process onto a legal boundary. The divergence you suspected is real. The framing chapter should not promise to resolve it, but to weaponize it: show the contributors that their disagreement stems not from error, but from optimizing for different jobs. The "Definition of Life" is a toolshed, not a holy grail.
