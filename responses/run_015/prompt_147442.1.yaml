answer: |-
  # Decision Tree: The Coherence of Qualia (Post-Chase-Sanborn)

  **Target Audience:** Graduate Seminar in Philosophy of Mind
  **Root Case:** *The Synthetic Cortex.* A subject undergoes gradual neuron replacement with functionally identical silicon analogues. All behavioral and cognitive profiles are preserved. The subject reports: "The qualitative feel is exactly the same."

  ---

  ## Part 1: The Logical Decision Tree

  This tree maps the logical space of positions based on commitments to **Incorrigibility**, **Coherence**, and **Reference**. It does not begin with philosopher names, but with answers to concrete claims about the case.

  ### **Node 1: Incorrigibility & Supervenience**
  **Question:** In the Synthetic Cortex case, is it *possible* for the subject's report to be false (or for their qualia to differ) without *any* change in behavior, disposition, or cognitive processing?
  *   **(A) YES:** Qualia can vary independently of function/behavior. (Possibility of Inverts/Zombies).
  *   **(B) NO:** Qualia supervene on function/behavior. If function is identical, qualia must be identical (or the report is constitutive of the qualia).

  ---

  ### **Node 2A: Theoretical Coherence (Follows Path A)**
  **Question:** If qualia can vary without behavioral detection, is a property that allows such undetectable variation a **coherent theoretical posit**? (The Chase-Sanborn Challenge).
  *   **(A1) NO:** The concept is incoherent; it posits a difference that makes no difference.
  *   **(A2) YES:** It is coherent, even if epistemically inaccessible.

  ### **Node 2B: Conceptual Reference (Follows Path B)**
  **Question:** If qualia cannot vary without functional change, do our phenomenal concepts refer to **real functional states** or are they **systematically misleading**?
  *   **(B1) REAL:** Phenomenal concepts accurately track functional/representational states.
  *   **(B2) MISLEADING:** Phenomenal concepts represent states as having intrinsic qualities they do not possess.

  ---

  ### **Node 3A: Nature of Reference (Follows Path A2)**
  **Question:** Do phenomenal concepts refer to properties that are **essentially ineffable and intrinsic**?
  *   **(A2-i) YES:** Qualia are intrinsic, ineffable, and private.
  *   **(A2-ii) NO:** Qualia are real, but effable, relational, or public.

  ### **Node 3B: Ontological Status (Follows Path B2)**
  **Question:** If concepts are misleading, does the **experience itself exist** (but lack qualia) or is the **concept entirely empty**?
  *   **(B2-i) EXPERIENCE EXISTS:** Consciousness is real, but "qualia" (as traditionally defined) are an illusion.
  *   **(B2-ii) CONCEPT EMPTY:** The distinction between experience and judgment is void; eliminate the terminology.

  ---

  ## Part 2: Mapping the Leaves (Positions)

  Here we map the 8 logical endpoints to philosophical positions. Note that some leaves are densely populated, while others are "logical ghosts."

  | Leaf | Path | Position Name | Key Commitments | Representative Thinkers |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **A → A1** | **Strong Eliminativism / Quining** | Qualia concept is incoherent. Reports are judgments, not observations of intrinsic properties. | **Daniel Dennett**, Paul Churchland (early) |
  | **2** | **A → A2 → A2-i** | **Standard Non-Reductive Realism** | Qualia are real, intrinsic, ineffable, and can float free of function. | **David Chalmers**, Frank Jackson (pre-2000s) |
  | **3** | **A → A2 → A2-ii** | **Restricted Realism (Effability)** | Qualia are real and function-independent, but *not* ineffable. We can theorize them publicly. | **Fred Dretske** (some readings), **Michael Tye** (Representationalism) |
  | **4** | **A → A2 → A2-ii** | **Restricted Realism (Privacy)** | Qualia are real, but not essentially private. Introspection is a form of perception open to error. | **William Lycan**, **Gilbert Harman** |
  | **5** | **B → B1** | **Reductive Functionalism** | Qualia just *are* functional roles. The report is authoritative because it constitutes the state. | **David Lewis**, **J.J.C. Smart** |
  | **6** | **B → B2 → B2-i** | **Illusionism** | Experience exists, but the "qualitative" character is a user-illusion generated by cognitive processing. | **Keith Frankish**, **Daniel Dennett** (later) |
  | **7** | **A → A1 → [Concept Refers]** | **UNNAMED: Metaphysical Mysticism** | The concept is theoretically incoherent, *but* refers to a real noumenal reality beyond logic. | *(Unoccupied logical space)* |
  | **8** | **B → B2 → B2-ii** | **UNNAMED: Hard Pragmatism** | Concepts are empty, but we keep them for utility. No ontological commitment either way. | *(Rare; overlaps with Leaf 1)* |

  ---

  ## Part 3: Diagnostic Notes on Branches

  ### **Indistinguishable Leaves (The "Empirical Equivalence" Problem)**
  *   **Leaf 1 (Eliminativism) vs. Leaf 6 (Illusionism):**
      *   **The Overlap:** Both agree that *traditional* qualia (intrinsic, ineffable) do not exist. Both agree the Synthetic Cortex subject's report is not about a private inner object.
      *   **The Distinction:** Leaf 6 claims *phenomenal consciousness* exists but is non-qualitative (a "zero-qualia" state). Leaf 1 often suggests the distinction between consciousness and judgment is itself void.
      *   **Flag:** For the purposes of the Chase-Sanborn argument, these leaves are often functionally identical. The debate is merely verbal *unless* one can specify what "consciousness without qualia" cashes out to in behavioral terms.

  *   **Leaf 3 (Restricted Realism) vs. Leaf 5 (Functionalism):**
      *   **The Overlap:** Both deny ineffability and privacy. Both allow for error in self-report.
      *   **The Distinction:** Leaf 5 says qualia *are* functional states. Leaf 3 says qualia are *correlated* with functional states but remain distinct properties (property dualism without the mystery).
      *   **Flag:** This distinction collapses if one adopts a causal theory of reference. If the property does no causal work (Leaf 3), why posit it? If it does work, isn't it functional (Leaf 5)?

  ### **Empty Branches (Diagnosis)**
  *   **Leaf 7 (Real but Incoherent):**
      *   **Diagnosis:** This position claims qualia are real but logically contradictory (e.g., "private yet public"). Most philosophers reject this as dialetheism applied to mind. It is unoccupied because admitting incoherence usually forces one to Leaf 1 (Eliminativism).
  *   **Leaf 8 (Hard Pragmatism):**
      *   **Diagnosis:** This view treats "qualia" as a useful fiction without ontological commitment. It is rarely explicitly defended because it is unstable: if it's useful, *what* makes it useful? If nothing, eliminate it (Leaf 1). If something, it's real (Leaf 6).

  ---

  ## Part 4: Seminar Discussion Guide (Settled vs. Contested)

  When discussing this tree in seminar, distinguish between the **dialectical landscape** (what is agreed upon) and the **substantive disputes** (what is fought over).

  ### **What is Settled (The Live Debate)**
  1.  **The Trilemma is Live:** Everyone acknowledges the tension between **Incorrigibility**, **Intrinsicness**, and **Coherence**. You cannot easily keep all three.
  2.  **No Consensus on "Quining":** There is no agreement that Dennett's Chase-Sanborn argument successfully eliminates qualia. It is viewed as a powerful *challenge* to Realism, not a refutation.
  3.  **The Cost of Realism:** It is settled that maintaining Standard Non-Reductive Realism (Leaf 2) requires accepting epiphenomenalism or nomological danglers (properties that don't affect behavior). The debate is whether that cost is acceptable.

  ### **What is Genuinely Contested**
  1.  **The Success of the Incoherence Argument:**
      *   *Contest:* Does the possibility of undetectable variation *actually* render the concept incoherent (Leaf 1), or does it merely render it mysterious (Leaf 2)?
      *   *Stakes:* If Dennett is right, the "Hard Problem" dissolves. If Chalmers is right, the Hard Problem is the central fact of mind.
  2.  **The Sacrifice Required:**
      *   *Contest:* If we save qualia, *what* must we give up? Must we abandon **Privacy** (Leaf 4), **Ineffability** (Leaf 3), or **Intrinsicness** (Leaf 5)?
      *   *Stakes:* Restricted Realists argue we can save qualia by naturalizing them. Standard Realists argue that once you naturalize them, you haven't saved *qualia*, you've saved something else.
  3.  **The Authority of the Subject:**
      *   *Contest:* Is the subject's report in the Synthetic Cortex case a *measurement* (fallible) or a *constitution* (incorrigible)?
      *   *Stakes:* This determines whether Node 1 is answered (A) or (B). This is the deepest fault line in the tree.

  ### **Instruction for Students**
  *   **Do not** assume Leaf 2 (Standard Realism) is the default. In post-Dennett debates, Leaf 1 and Leaf 6 are equally viable starting points.
  *   **Do not** conflate Leaf 3 (Restricted Realism) with Leaf 5 (Functionalism). Check whether the philosopher posits a property *over and above* the functional role.
  *   **Focus** on Node 2A. The Chase-Sanborn argument hinges entirely on whether "theoretical posit" requires "detectable difference." If you think theoretical physics posits undetectable things (e.g., other universes), you may resist Node 2A. If you think mental posits must be grounded in behavior, Node 2A forces you to Leaf 1.
