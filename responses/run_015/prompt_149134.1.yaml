answer: |-
  **Setting:** *The Corner Room, a slightly noisy pub near UCL. It's Tuesday evening. Mara and Leo are huddled around a sticky table, notebooks open, half-empty pints of lager in front of them.*

  **Leo:** So, your flatmate's phrase. "Structural jointness without mental overlap." I've been turning it over since you mentioned it. I think she's onto something proper.

  **Mara:** *(Sipping her pint)* I think she's onto a category error. Look, I get the appeal. It sounds sleek. But if I'm writing this essay, I can't just redefine joint action out of existence. Take your Silent Grid. Thousands of households, smart batteries, AI coordinating the discharge. Nobody knows anyone else. Most don't even know *why* their battery is draining, just that their bill is lower. You're telling me that's a collective agent?

  **Leo:** I'm telling you it's a collective *action*. The outcome is coordinated. The interdependence is real. If House A doesn't discharge, House B's lights flicker. They are functionally locked together. Why does it matter if House A thinks about House B?

  **Mara:** Because it matters for the 'joint' bit. Bratman would have a fit. For us to paint a house together, I need to intend that *we* paint. I need to know you're intending it too. There's got to be mutual responsiveness. In the Silent Grid, the homeowners aren't responding to each other. They're responding to a price signal. It's aggregated individual behaviour, nothing more. It's like thousands of people opening umbrellas when it rains. They're coordinated by the weather, not by a shared intention.

  **Leo:** But the weather doesn't write an algorithm to optimise the umbrella spacing. The AI is the glue. That's the structural jointness. Look, Mara, your mentalist view works for a duo painting a house. It falls apart at scale. Think about a massive bureaucracy. Does the bloke in the basement filing tax returns share a we-intention with the Chancellor?

  **Mara:** They share a institutional framework. They understand they're part of HMRC.

  **Leo:** Do they? Half of them are just doing their job to avoid getting sacked. They don't care about the collective goal. Or take open-source software. Thousands of contributors on GitHub. Some never log in again after one commit. They never meet. They don't know who else is coding. But Linux exists. That's a joint product. If you say there's no joint action there because there's no mental overlap, you're ignoring the reality of how the modern world gets things done.

  **Mara:** I'm not ignoring it, I'm distinguishing it. There's cooperation, sure. There's systemic integration. But calling it 'joint action' in the philosophical sense dilutes the normativity. Here's the problem: suppose the Silent Grid goes wrong. The AI glitches, discharges too much, and a hospital loses power. People die. Who do we blame?

  **Leo:** You blame the utility company. You blame the algorithm designers.

  **Mara:** Exactly. You blame specific agents. But if you insist this was a *joint action* by the households, you're implying the households share some responsibility. But how can they? They didn't know. They had no idea they were part of a 'we'. You can't hold a group responsible if the group doesn't know it's a group. That's the cost of your structural view. It severs the link between agency and accountability.

  **Leo:** *(Leaning forward)* Hold on. You're conflating *participation* with *liability*. I can be part of a joint action without being morally culpable for every outcome. Think of a relay team. If the baton drops because the third runner trips, the team loses. That's a collective outcome. The first runner participated in the joint action even if he didn't drop the baton. In the Silent Grid, the households are the runners. The AI is the coach. If the team loses, the team lost.

  **Mara:** But the relay team knows they're a team. They wear the same kit. They train together. If the third runner didn't know he was in a race, he's not a runner, he's just a bloke jogging across the track. That's the Silent Grid. They're just jogging across the track. The AI makes it look like a race, but ontologically, it's not.

  **Leo:** Is it though? Let's push the intuition. Suppose the utility company sends a letter saying, "By signing up, you agree to participate in grid stabilisation." They tick the box. They don't read the terms. Legally, they've consented to the joint enterprise. Functionally, their battery responds to the collective need. What mental state is missing?

  **Mara:** The mutual belief. They don't believe *others* are doing it. They might think their battery is just saving *them* money. If I think I'm painting the house alone, and you're painting the other side, and we never acknowledge each other, we aren't painting it together. We're just painting near each other. The 'we' is constituted by the recognition of the 'we'. Without that, you haven't got collective intentionality. You've got clever causation.

  **Leo:** But that's so internalist. It privileges the phenomenology over the mechanics. In social ontology, we're trying to explain how groups act in the world. If the mechanism works—if the structure sustains the interdependence—why do we need a little magic spirit of 'we-ness' floating around in their heads? Your flatmate's phrase... "structural jointness without mental overlap." It captures the modern condition. We are increasingly coordinated by systems we don't understand.

  **Mara:** *(Sighs, tapping her pen)* I see the allure. It describes the *effect*. But philosophy isn't just about describing effects; it's about understanding the nature of the act. If you remove the mental overlap, you remove the possibility of *shared* reasoning. They can't deliberate together. They can't change their minds together. They're locked in by the code. That's not action, Leo. That's processing.

  **Leo:** But they opted in. They could opt out. That's a form of minimal agency.

  **Mara:** It's individual agency. Stacked up. Look, if I write this essay arguing that the Silent Grid is genuine joint action, my tutor will ask: "Where is the plural subject?" If the answer is "in the server," then we're talking about the AI acting, not the humans. The humans are just peripherals.

  **Leo:** *(Laughs)* Peripherals. That's harsh. But maybe that's the point. Maybe we need to stop thinking of joint action as always bottom-up, from minds to group. Maybe sometimes it's top-down. The structure creates the group, not the other way around.

  **Mara:** Then it's not a group of agents anymore. It's a system with components. And components don't bear responsibility. Components just function. If you want to treat people like components, fine. But don't call it joint action. Call it what it is: engineered coordination.

  **Leo:** Engineered coordination... *(He takes a long drink)* Alright. Maybe 'joint action' is the wrong label. But the phenomenon is real. The interdependence is real. You can't just dismiss it as aggregation because there's no handshake.

  **Mara:** I'm not dismissing it. It's fascinating. It's just not *collective intentionality*. It's something else. Maybe that's what your flatmate meant. Not that it *is* joint action, but that it *mimics* it perfectly enough to break our theories.

  **Leo:** So, structural jointness is a simulacrum of joint action?

  **Mara:** Exactly. A philosophical zombie of collective agency. It walks like a team, talks like a team, but there's nobody home.

  **Leo:** *(Grinning)* Right. Well, if we're ordering another round, is that a joint action? I mean, I'm buying, you're drinking. Technically, I'm just responding to your thirst signal.

  **Mara:** *(Smiling)* Only if we both know we're having a pint together. Otherwise, you're just a vending machine I haven't paid yet.

  **Leo:** Cheers to that, then. *(He raises his glass)* To the we-intention.

  **Mara:** *(Clinks glass)* To the we-intention. But I'm still writing the essay on Bratman.

  **Leo:** figured.
