  hey so I'm running the final exam for my grad seminar in philosophy of history and I'm kind of burnt out on grading essays that just do Hempel vs. narrative like it's a debate club match. I want one essay prompt that actually gets in the weeds — forces students to confront whether the covering-law / narrative distinction really holds up when you look at actual historical writing, not just textbook summaries.

  Here's the specific angle: present a case where a historian explains the collapse of an 1880s municipal water board through a super particular story — one secretary misreads a ledger entry, then there's a cascade of personal grudges and budget shifts. The historian insists she's giving a purely narrative, particularist explanation with zero law-like premises. But her account implicitly relies on a tacit generalization about how bureaucratic misinterpretation propagates in hierarchical organizations — something that functions just like a mini covering-law. The exam should ask students to diagnose whether that hidden premise collapses her explanation into a covering-law model, or whether narratives can legitimately carry such background conditions without losing their distinctiveness.

  Please write the exam question (80 mins, ~1000 words), a model answer (~750 words), and a marking scheme out of 30 points with five specific moves. For each move, name exactly what it is, assign marks, include a one-line note on the typical mistake, and make sure the scheme clearly seperates an A answer from a B by saying which moves are essential vs. just nice-to-have. Don't ask for citations, reading lists, or bibliographies — students won't have books in the room. And please don't use quotation marks for anything from a real text; paraphrase any references. You can keep the casual vibe and maybe leave a typo or two, since I'm writing this in a rush between classes.
