      *   *Query 2:* Is the harm claim automatic? Answer: No. It's possible, but not the default expectation in all Darwinian models (e.g., group selection models suggest cultural traits often benefit the group).
      *   *Query 3:* Does the belief claim follow? Answer: No, it requires a specific psychological assumption (that reasons are epiphenomenal) not guaranteed by the evolutionary framework alone.

  6.  **Final Polish:** Organize by the user's requested structure (Accept, Simplify, Reject/Controversy) and then address the three specific uncertainties. Ensure the tone is analytical and neutral. (Make sure to explicitly mention Dan Sperber and the "Epidemiology of Representations" as the counter-view to copying, and Boyd/Richerson for the coevolution view).

