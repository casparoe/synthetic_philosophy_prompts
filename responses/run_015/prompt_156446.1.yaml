  Bottom line
  The summary is half-right: Ayer did argue that survival claims are nonsensical under verificationism, but he never endorsed technological uploads as a valid form of afterlife. His late-life near-death experience softened his atheism slightly, but it did not constitute a full philosophical recantation.

  What's accurate here
  It is accurate that Ayer's early logical positivism classified statements about life after death as cognitively meaningless because they cannot be empirically verified. He consistently maintained that without verifiable evidence, talk of a disembodied soul is not false but literally nonsensical. Furthermore, he did publicly recount a near-death experience in 1988 that challenged his strict previous stance on religious experience. This experience led him to admit that his previous rigid dismissal of spiritual phenomena was perhaps too hasty.

  What's distorted or added
  The summary distorts his views by attributing a specific belief in technological uploads to him, which is an anachronistic projection of modern transhumanist ideas onto his work. It also exaggerates the impact of his near-death experience, implying he abandoned verificationism when he only admitted a personal shift in perspective. The claim that he accepted a digital afterlife conflates his theoretical discussion of psychological continuity with a specific endorsement of sci-fi scenarios. Consequently, the summary presents a modernized version of Ayer that aligns more with current debates than his actual writings.

  The tech-upload claim specifically
  Ayer discussed psychological continuity as a possible criterion for personal identity, but he never explicitly argued that copying neural patterns to a server would count as survival. This claim likely mistakes his abstract philosophical thought experiments for a concrete belief in digital immortality that he never held. There is no record in his corpus of him validating server-based existence as a form of living on.

  The near-death experience part
  Ayer stated that his near-death experience weakened his strict atheism and involved seeing a divine presence, but he clarified this did not mean he accepted religious dogma. He maintained that while the experience was genuine for him, it did not prove the truth of traditional life-after-death claims.
