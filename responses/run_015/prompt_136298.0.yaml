          *   Address the restricted knowability principle (physical/mind-independent truths) and whether Fitch's reasoning applies or if the restriction is gerrymandered.
      *   **Tone:** Academic, precise, helpful, suitable for a final-year undergraduate/early graduate level.

  2.  **Deconstruct the Book Passage:**
      *   *Claim 1:* "The anti-realist's guiding slogan is that every truth is knowable..." (The Knowability Principle: $\forall p (p \to \Diamond Kp)$).
      *   *Claim 2:* "Take the claim that some truths are in fact unknown." (Existence of unknown truths: $\exists p (p \land \neg Kp)$).
      *   *Claim 3:* "If that claim is true, then it is a truth that can never be known -- because the moment anyone came to know it, it would cease to be true..." (The core Fitch derivation logic).
      *   *Claim 4:* "So if there are unknown truths at all, there is at least one unknowable truth, and the anti-realist's slogan collapses." (Derivation of $\neg \exists p (p \land \neg Kp)$ from Knowability).
      *   *Claim 5:* "Since of course there are unknown truths, the only way out would be to deny that anything is unknown, i.e. to attribute omniscience to someone..." (The dilemma: Omniscience or Reject Knowability).
