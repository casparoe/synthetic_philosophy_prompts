answer: |-
  This is an excellent set of questions. You have correctly identified that the popular book is conflating the *formal validity* of Fitch's proof with the *philosophical interpretation* of its premises and scope. Your TA is right: the devil is in the details of the proposition fed into the principle, and the live debate is almost entirely about restricted versions of the Knowability Principle (KP).

  Here is an audit of the passage, followed by an evaluation of your hunch and the question of restricted domains.

  ### Part 1: Audit of the Passage

  Let's break the text down claim by claim. I will categorize them as **Accepted** (standard view), **Loose/Simplified** (pedagogically useful but technically imprecise), or **Contested/Wrong** (where the author overreaches).

  **1. "The anti-realist's guiding slogan is that every truth is knowable..."**
  *   **Verdict:** **Accepted (with caveats).**
  *   **Comment:** This is the standard formulation of the Knowability Principle ($\forall p (p \to \Diamond Kp)$). It is historically associated with verificationist anti-realism (e.g., Dummett). However, calling it *the* anti-realist slogan is a simplification; some anti-realists reject KP precisely because of Fitch, adopting "response-dependent" or "superassertibility" theories instead. But as a starting point for the paradox, this is fine.

  **2. "Take the claim that some truths are in fact unknown."**
  *   **Verdict:** **Accepted.**
  *   **Comment:** This is the "Non-Omniscience" premise ($\exists p (p \land \neg Kp)$). Almost everyone accepts this.

  **3. "If that claim is true, then it is a truth that can never be known -- because the moment anyone came to know it, it would cease to be true..."**
  *   **Verdict:** **Loose/Simplified.**
  *   **Comment:** This is the most common pedagogical explanation, but it invites confusion. It suggests a *temporal* change (the truth "ceases" to be true). In modal logic, the problem is not that the truth value flips, but that the *content* is logically inconsistent with being known.
      *   The proof shows that $K(p \land \neg Kp)$ entails a contradiction ($Kp \land \neg Kp$).
      *   It is not that knowing it *makes* it false; it is that the proposition "$p$ is true and not known" is a **Moorean sentence**. It is like saying "It is raining but I don't believe it." It can be true, but it cannot be *coherently asserted or known*.
      *   **Correction:** A specialist would say: "The proposition is *unstable* under the knowledge operator. It is logically impossible for any agent to stand in the knowledge relation to that specific conjunction."

  **4. "So if there are unknown truths at all, there is at least one unknowable truth, and the anti-realist's slogan collapses."**
  *   **Verdict:** **Accepted.**
  *   **Comment:** This is the valid conclusion of the Fitch derivation. If KP is true, then there are no unknown truths. Since there are unknown truths (Non-Omniscience), KP must be false. This part of the book is correct: unrestricted KP is widely regarded as refuted.

  **5. "Since of course there are unknown truths, the only way out would be to deny that anything is unknown, i.e. to attribute omniscience to someone..."**
  *   **Verdict:** **Accepted (as a dilemma).**
  *   **Comment:** The book presents the dilemma correctly: Accept KP $\to$ Accept Omniscience. Since Omniscience is absurd, Reject KP. Most anti-realists choose to reject (or modify) KP.

  **6. "The same argument also kills the more cautious versions... restricted to physical world... closed under that operation."**
  *   **Verdict:** **Contested/Overreaching.**
  *   **Comment:** This is where the author is sweeping too broadly. The claim that any restricted domain is "closed under that operation" (i.e., if $p$ is in the domain, then $p \land \neg Kp$ is also in the domain) is the exact point of contemporary disagreement.
      *   If the domain is "truths about the physical world," does the conjunction "$p$ (physical) and $\neg Kp$ (epistemic)" count as a "truth about the physical world"?
      *   Many philosophers argue **no**. If the domain is defined by subject matter (mind-independent objects), adding an epistemic operator ($\neg K$) may push the proposition *outside* the domain.
      *   To say the argument "kills" restricted principles assumes the restriction is porous. If the restriction is robust, Fitch's construction fails to generate a counter-instance *within the domain*.

  ---

  ### Part 2: Evaluating Your Hunch

  > *"It seems to me that the whole argument works by demanding knowledge of a proposition whose truth the knowing would destroy, and that this is somehow an unfair demand, so that the paradox shows only that some truths are unknowable-by-us-under-that-description rather than that they are unknowable full stop."*

  This is **not a confusion**; it is a sophisticated objection that aligns with several serious responses in the literature.

  **1. The "Unfair Demand" (Unstable Truths)**
  You have identified the core logical feature: the proposition $p \land \neg Kp$ is **epistemically unstable**.
  *   **Name:** This is often discussed under the header of **Moorean Paradoxes** or **Unstable Truths**.
  *   **The Objection:** The Knowability Principle says "Every truth is *capable* of being known." Fitch shows that specific *token* propositions (like $p \land \neg Kp$) cannot be known.
  *   **The Defense:** Anti-realists (like **Dorothy Edgington**) argue that Fitch conflates *knowing a truth in a situation* with *knowing that truth in that same situation*.
      *   Edgington's Solution: We can know *in the actual world* (where $p$ is known) that $p$ is true *in a counterfactual world* (where $p$ is unknown).
      *   Formula: $K_{actual} (p_{counterfactual} \land \neg K_{counterfactual} p)$.
      *   This preserves the idea that $p$ is knowable, even if the specific conjunction "p is unknown" cannot be known *in the world where it is unknown*.

  **2. "Under that description"**
  Your phrase "unknowable-by-us-under-that-description" points to the distinction between **propositional content** and **sentential form**.
  *   Fitch proves that the *sentence* "$p$ and it is not known that $p$" cannot be known.
  *   It does *not* prove that the state of affairs $p$ is unknowable.
  *   If the anti-realist cares about the knowability of the *world* (the facts), rather than the knowability of every possible *description* of the world, Fitch's paradox may not bite as hard.
  *   **Verdict:** Your hunch is philosophically robust. It suggests the paradox is a logical curiosity about self-referential epistemic operators rather than a metaphysical refutation of anti-realism.

  ---

  ### Part 3: Restricted Knowability and Gerrymandering

  > *"If the knowability principle is restricted to truths about the physical or mind-independent world, does Fitch-style reasoning still get a grip, or does the instance simply fall outside the restricted domain -- and if it falls outside, is that an honest restriction or a gerrymandered one?"*

  This is the current frontline of the debate.

  **1. Does Fitch's reasoning get a grip?**
  *   **No, if the domain is not closed under conjunction.**
  *   Let $D$ be the domain of "physical truths."
  *   Fitch requires us to feed the principle a proposition $\phi \in D$.
  *   The Fitch proposition is $\phi = (p \land \neg Kp)$.
  *   If $p \in D$ (physical), is $\neg Kp \in D$?
      *   If "physical" means "concerns only mind-independent objects," then $\neg Kp$ (which concerns a mind's epistemic state) is **not** physical.
      *   Therefore, $(p \land \neg Kp) \notin D$.
      *   Therefore, the Restricted KP ($\forall p \in D (p \to \Diamond Kp)$) does not apply to the Fitch proposition. The proof is blocked.

  **2. Is this restriction honest or gerrymandered?**
  *   **The Realist Charge (Gerrymandering):** Realists argue this is ad hoc. They claim the anti-realist is simply carving out the domain to avoid the counter-example. If the domain is "all truths," Fitch wins. If the domain is "all truths except the ones Fitch uses," the principle is trivialized. They argue that epistemic facts supervene on physical facts, so excluding them is artificial.
  *   **The Anti-Realist Defense (Honest Restriction):** Anti-realists argue that their position was never about *epistemic* truths (truths about knowledge), but about *empirical* truths.
      *   The slogan "All truths are knowable" was always a shorthand for "All empirical facts are ascertainable."
      *   It is not part of the scientific/empirical project to know "what is unknown." It is a meta-claim.
      *   Therefore, restricting the domain to "non-epistemic truths" is not gerrymandering; it is clarifying the original intent of verificationism.

  **3. Does the book's conclusion survive?**
  *   **No.** The book's claim that "no restricted knowability principle is safe" is too strong.
  *   **Corrected Conclusion:** Fitch's paradox decisively refutes the **unrestricted** Knowability Principle. It forces anti-realists to either:
      1.  Accept a restricted KP (limiting the domain to non-epistemic truths).
      2.  Adopt a more complex logic (like Edgington's situation semantics).
      3.  Abandon KP entirely for a different theory of truth (e.g., Peircean idealization).
  *   Whether the restricted KP is "safe" depends on whether one accepts the boundary between "physical" and "epistemic" truths as metaphysically significant. This is not settled by Fitch's logic alone; it requires further metaphysical argument.

  ### Summary for your Reading Group

  1.  **The Logic:** The book is right that the formal derivation is valid. Unrestricted KP + Non-Omniscience = Contradiction.
  2.  **The Explanation:** The book is loose on *why* it fails (logical inconsistency vs. truth ceasing).
  3.  **The Scope:** The book is wrong/overconfident about restricted principles. This is where the actual philosophy happens.
  4.  **Your Hunch:** You are channeling **Edgington** and **Hand & Kvanvig**. The paradox shows that some truths are "Fitch-conjunctions" which are inherently unknowable *as stated*, but this doesn't necessarily refute the idea that the underlying facts are knowable.
  5.  **The Restriction:** Blocking Fitch by restricting the domain is a viable strategy, but it shifts the debate from logic to metaphysics (i.e., "What counts as a physical truth?").

  If you want to impress the group, mention that Fitch's paradox is now seen less as a "refutation of anti-realism" and more as a **constraint on formalizing anti-realism**. It tells us we cannot simply equate Truth with Knowability in classical modal logic without qualification.
