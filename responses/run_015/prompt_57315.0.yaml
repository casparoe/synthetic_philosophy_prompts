  The legal claim that broad consent violates specificity requirements is the only objection that can veto this administratively.

  **1. Attorney:** "GDPR requires specific purpose; broad consent is invalid."
  **Reply:** "The Revised Common Rule explicitly permits broad consent for secondary research provided ethics oversight exists. GDPR allows derogations for scientific research. We aren't waiving review; we're front-loading authorization to match the regulatory framework. The liability is managed through oversight, not repetition."
  **Soft:** EU partner's DPO can still block data transfer regardless of US IRB approval.

  **2. Advocate:** "It's a blank check; I regret my signatures."
  **Reply:** "We replace repeated permission with sustained veto power via the opt-out registry. You retain control without the pressure to repeat 'yes' until you just want it to stop. It respects your regret by making withdrawal easier."
  **Soft:** Emotional resonance of "blank check" outweighs technical safeguards for grieving parents.

  **3. Staff Ethicist:** "You're trading autonomy for administrative convenience."
  **Reply:** "Autonomy isn't counting signatures. If fatigue turns choice into habit, autonomy is diminished. Protecting the quality of the choice requires fewer, clearer choices, not more paperwork. We are prioritizing meaningful authorization over procedural box-checking."
  **Soft:** "Quality of choice" is hard to measure; convenience looks suspiciously like efficiency savings.

  **4. Investigator 1:** "Opt-out registry won't work across partner sites."
  **Reply:** "We're piloting internally first. Partner MOUs will mandate registry checks before data release. It's a governance hurdle, not a conceptual flaw in the consent model itself. We can solve contracts; we can't solve consent fatigue."
  **Soft:** Governance hurdles often become dealbreakers in multi-site collaborations.

  **5. Psych Resident:** "Offers aren't coercion. Voluntariness isn't worn down by offers."
  **Reply:** "In therapeutic relationships, repeated offers feel like expectations. Compliance isn't consent. We're protecting the patient from the subtle pressure to please the provider they trust. A 'yes' born of exhaustion is not valid consent."
  **Soft:** Philosophically contentious; looks like paternalism to protect them from their own agreement.

  **6. Investigator 2:** "What are the numbers on re-contact burden?"
  **Reply:** "Minimal. Only for sensitive categories like psych or reproductive. Estimated <5% of studies trigger re-contact, keeping burden low while protecting high-risk areas. The burden is proportional to the sensitivity."
  **Soft:** If that 5% turns out to be high-risk/high-profile, the burden spikes exponentially.

  **7. Informatics:** "Tracking opt-outs dynamically is a tech nightmare."
  **Reply:** "We're building a flag in the EHR, not a new database. It's a binary field linked to biobank ID, manageable within current IT capacity. It's a simple switch, not a complex system."
  **Soft:** EHR integration is always slower and bugrier than promised.

  **8. Public:** "Won't people be confused?"
  **Reply:** "Confusion comes from complexity. One clear conversation is easier to understand than ten complex forms that change every year. Clarity drives comprehension, not frequency."
  **Soft:** "Broad" sounds vague to laypeople regardless of explanation quality.

  **Concede:** Acknowledge broad consent *looks* less protective initially and admit tech implementation risks. This disarms the "efficiency" critique and shows you aren't ignoring the burden on IT.

  **Must Land:** The autonomy/fatigue argument (Obj 3). If the committee believes consent is merely compliance, the proposal dies. You must prove repetition degrades validity.

  **Dreaded Question:** "What if a profitable drug comes from this and the patient gets nothing?" This triggers justice concerns you haven't addressed and alienates the Patient Advocate.
