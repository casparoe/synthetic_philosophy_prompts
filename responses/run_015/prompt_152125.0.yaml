      *   **Philosophical Problem:** The user read Kripke's *Wittgenstein on Rules and Private Language* (1982). They interpret it as: "No fact of the matter about which rule anyone is following... Meaning just is agreement... Therefore, Aldgyth's internal confusion is a lie/psychology only. The climax should be communal ratification (Abbess/sisters deciding)."
