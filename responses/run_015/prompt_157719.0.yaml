answer: |-
  The stalemate is substantive but bottoming out in opposed starting intuitions about which normative constraint is sovereign—local phenomenological accuracy or global rational coherence—so you will never resolve it by arguing about transitivity itself.

  Your hypothesis that this is two questions under one label is the most charitable explanation, but the sequential case you mentioned kills it. If "better than" were purely about value standing full stop (Side 1) and distinct from choice settling (Side 2), the sequential pump wouldn't matter; an agent could acknowledge $A_{i+1}$ is better than $A_i$ in value but refuse the trade to avoid the bad endpoint. But Side 1 typically insists the comparison *does* recommend the trade. They want "better than" to guide action locally while denying it must cohere globally. Side 2 insists that if it doesn't cohere globally, it cannot guide action at all. They are not answering different questions; they are answering the same question—"What norms govern 'better than'?"—with incompatible axioms. Side 1 axiomatizes the immediate comparative intuition; Side 2 axiomatizes the structural role of preference in planning.

  This explains why your group hasn't budged. Side 1 treats the pairwise intuition as infallible data, viewing transitivity as a theoretical imposition that distorts the phenomenology of trade-offs. Side 2 treats transitivity as constitutive of rationality, viewing the pairwise intuition as prone to vagueness or error. Your reversibility doubt actually undermines Side 1 more than they realize: if judgments flip based on traversal direction ($A_{100} > A_{99}$ when going down), the "data" Side 1 relies on is context-dependent psychological noise, not stable value facts. Your sequential doubt undermines Side 1 practically: if an agent follows Side 1's advice step-by-step, they are guaranteed to end up in a state they themselves rank as inferior to their start. This isn't just verbal; it's a vulnerability to exploitation (a value pump). However, Side 2's solution posits a "lexical break" or threshold that is phenomenologically undetectable—you cannot tell where $A_i$ stops being better than $A_{i+1}$ until you hit the magic number—which looks like magical thinking to Side 1.

  Because this is a clash of foundational normative priorities rather than a discoverable fact about value, no amount of analyzing the spectrum will move them. Progress will not come from finding the hidden transitivity or proving the intransitivity. Progress counts as shifting the debate from metaphysical status to cost acceptance. You need to run a "Bullet-Biting Audit" next week. Stop asking whether "better than" is transitive. Instead, present the consequences of each view as fixed costs and ask them to choose which cost they are willing to bear.

  Put Side 1 on the spot: "If you maintain pairwise betterness without transitivity, you must accept that a rational agent can be guided into a strictly worse outcome through a series of rational choices. Are you committed to accepting money pumps as rational?" If they say no, they must explain what blocks the trade without denying the pairwise comparison, which usually forces them into Side 2's camp. Put Side 2 on the spot: "If you maintain transitivity, you must accept there is a specific pair $A_k, A_{k+1}$ where the improvement vanishes or reverses, despite being indistinguishable from the pairs before and after. Are you committed to an epistemically inaccessible lexical threshold?" If they say no, they must explain how transitivity holds without a break, which usually forces them into Side 1's camp.

  If they refuse to bite either bullet, you have diagnosed the real problem: they want a concept of "better than" that has phenomenological fidelity *and* rational coherence, and the spectrum argument proves you cannot have both. The only progress possible is agreeing to replace "better than" with two distinct concepts: one for local phenomenology (non-transitive) and one for global choice (transitive), and admitting that the spectrum argument shows these two concepts diverge. If they reject that distinction, you should expect no progress ever, because they are demanding a logical possibility that the argument has ruled out.
