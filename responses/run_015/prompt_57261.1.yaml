answer: |-
  The river outside the lab was the colour of wet slate, moving slowly against the tide. Inside, the air was filtered, dry, and held at a constant twenty degrees, though Elise could feel the damp coming through the old brickwork whenever the heating kicked off. It was Monday. The notebook lay open on the stainless-steel bench, the pages stiff with decades of handwritten logs.

  She laid out the blotters. There were twelve of them, arranged in a fan. Each carried a dilution of the reference standard, a violet base she had compounded in 1994. The vials were small, amber glass, the corks sealed with parafilm that had yellowed and cracked. She had built this set when her nose was thirty-four years old. Now she was sixty-eight.

  The routine was simple. Smell the strongest. Wait thirty seconds. Smell the next. Note the point where the scent vanished. If the disappearance point matched the log from last Monday, the nose was stable. If it dropped a step, the nose was drifting, or the standard was evaporating. There was no way to tell which from the inside.

  Elise lifted the first blotter. The scent was sharp, powdery, metallic. Ionones. It filled the back of her throat, a familiar pressure. She put it down. She lifted the second. Slightly weaker. She worked her way down the series. At blotter nine, the scent was a ghost. At ten, nothing. She logged *nine*. The same as last week. The same as the week before.

  She capped the vials. Her hands were steady, but she felt the tiredness in the sinus cavity, a dull ache behind the eyes. Olfactory fatigue was a physical weight. You could carry too much scent for too long, and the receptors would simply stop firing.

  The door opened. Julian stood there. He was young, wearing a suit that looked too new for the lab, holding a tablet against his chest like a shield. He was from the compliance group, auditing the release protocols for the new batch of *River Mist*.

  "Morning, Elise," he said. He didn't come closer. He knew the rules. No cologne, no scented soap. He smelled of laundry detergent and nothing else.

  "Morning, Julian." She peeled off the nitrile gloves.

  "I need the sign-off on the batch 404 reformulation by noon. The clients are asking."

  "It'll be ready."

  He stepped into the room, staying near the door. He looked at the notebook, then at the row of amber vials. "I was looking at the calibration logs last night. The reference set."

  "And?"

  "It's thirty years old, Elise."

  "It's sealed."

  "Chemically? Maybe. But you're judging it." He tapped the side of his nose. "You're the instrument. If the instrument drifts, the reading drifts. But the standard is read by the instrument. So if the instrument drifts, the standard drifts with it."

  Elise wiped the bench with ethanol. The smell was sharp, cleansing. "I know the material. I know what it should smell like."

  "But how do you know you know?" Julian asked. He wasn't being rude. He was reading from a script, or maybe he just thought like an engineer. "If you lose sensitivity by one percent a year, you won't feel it happen. You'll just adjust what you think 'normal' is. You're calibrating against yourself."

  "I'm calibrating against the vials."

  "Which you certified thirty years ago. With the nose you had then."

  Elise paused. The ethanol dried quickly, leaving the steel cold. She understood the geometry of what he was saying. It was the same problem she had faced in the old days with pressure transducers. You couldn't use a gauge to check itself. You needed a master gauge. But the master needed a master. Eventually, you ran out of masters and just had to trust the thing in your hand.

  "The vials haven't changed," she said.

  "You can't know that from in here," Julian said. He gestured at the room. "Without an external check."

  "GC-MS won't help," Elise said. "It'll tell me the molecular weight. It won't tell me if the balance is right to the human nose. Someone still has to smell the output peak. And who calibrates them?"

  Julian didn't answer. He just waited.

  "Bring the batch sample," she said.

  He left and returned with a coded vial. Batch 404. The reformulation. One of the restricted materials had been swapped for a substitute, and the balance of the violet base needed to be tweaked to compensate. If the tweak was wrong, the scent would be too thin. If it was right, it would match the original profile.

  Elise put on fresh gloves. She dipped a fresh blotter into the batch sample. She placed it next to blotter nine from the reference series. The boundary line. The point where the scent was barely there.

  She leaned in. She breathed.

  The scent was there. Powdery. Violet. It matched the reference.

  She leaned back. She waited for the air to clear. She leaned in again.

  It matched.

  But the match was tight. There was no slack. If her sensitivity had dropped even a fraction since Monday morning, the batch would have to be stronger than the standard to register the same intensity. If the batch was actually weak, but her nose was insensitive, they would meet in the middle and feel like a match. She had no buffer. She was standing on the edge of the cliff, looking down, and the fog was at her feet.

  "Well?" Julian asked.

  "It matches," she said.

  "Are you sure?"

  "I smell it."

  "But are you sure you know it matches?" Julian pressed. "If you were five percent less sensitive, would you smell a difference here?"

  Elise looked at the two blotters. They sat side by side on the steel. To her, they were identical. But she knew the logic of the drift. If she was wrong, she was wrong in a way she couldn't detect. The condition of 'matching' obtained. The scent was present. But the knowledge—the certainty that she could report it as fact—required a margin she didn't have. She was like a thermometer that read twenty degrees when it was twenty degrees, but would also read twenty degrees when it was nineteen-point-nine. At the exact point of twenty, it couldn't know it wasn't nineteen-point-nine.

  "I can't step outside my head, Julian," she said.

  "Then how do we certify?"

  "Because I have to."

  She picked up the pen. It was a heavy thing, black plastic, the ink flow consistent. She opened the logbook. She wrote the date. She wrote the batch number. She wrote *Passed*.

  Her hand didn't shake. The ink flowed onto the paper, dark and permanent. She signed her name. *E. Vance*.

  Julian watched her. He didn't look satisfied, but he looked resolved. He took the book. "Thank you, Elise. I'll process the release."

  "Wait," she said.

  He paused.

  "Check the GC on this anyway."

  "We don't have time."

  "Check it. Not to override me. Just to check."

  Julian nodded. He left the room, taking the book and the sample vial with him.

  Elise was alone. The hum of the ventilation system was the only sound. The river outside continued to move, silent behind the double glazing. She looked at her hands. They were covered in fine lines, the skin thin. She looked at the reference vials. They were dark, opaque. She could not see the liquid level inside.

  She stood up and walked to the sink. She washed her hands. The soap was unscented, but she scrubbed hard, wanting to remove the ionones, wanting to clear the fatigue. She dried her hands on the paper towel.

  She walked back to the bench. She looked at the spot where the blotters had been. They were in the waste bin now.

  She needed to know if the scent was gone from her skin. She had handled the blotters. Sometimes the oils lingered on the fingers even through gloves. She brought her wrist to her nose.

  She breathed in.

  There was a smell. Was it the soap? Was it the ionones? Was it nothing?

  She breathed in again. Harder.

  The scent was faint. It might have been the memory of the scent. If she smelled it, she was contaminated. If she didn't, she was clear. But the threshold was so low now. The difference between 'clean' and 'contaminated' was a single molecule, a fraction of a perception.

  She lowered her arm. She looked at the door Julian had walked through. She had locked it when he arrived. She remembered turning the key. The click was distinct in her memory.

  She walked to the door. She tried the handle.

  It was locked.

  She took the key from her pocket. She inserted it. She turned it. She opened the door. She stepped out into the corridor. She turned around. She pushed the door shut. She reached for the key to lock it again.

  Her hand hovered over the lock.

  She remembered locking it before. She remembered the click. But she had just unlocked it. So it must have been locked. But had she locked it *then*, or had she just found it locked?

  The sequence was a chain of small steps. Lock. Walk. Sit. Work. Stand. Walk. Unlock.

  Somewhere in the chain, the state had changed. But she couldn't pinpoint where the knowledge ended and the assumption began. She stood in the corridor, the key in the lock, the metal cold against her thumb. She could turn it. She could lock it again. But if she locked it again, she would have to unlock it again to leave. And then she would wonder if she had locked it the second time.

  She left the key in the lock. She walked away down the corridor, towards the lift. She didn't look back. She couldn't be sure if the door was secure, or if she had left it open, or if the lock had failed halfway through the turn. The state of the door was real. Either it was locked or it wasn't. But she was no longer in a position to know which.

  The lift doors opened. She stepped in. She pressed the button for the ground floor. The doors closed. She felt the drop in her stomach, a physical shift, undeniable. But as the numbers ticked down, she wondered if she had actually pressed the button, or if she had just imagined the pressure of her finger, and the lift was moving on its own, or not moving at all.

  She looked at her hand. The finger was extended. The muscle was tense. But the sensation of touch was already fading, replaced by the hum of the cable. She held her hand there, waiting for the feeling to return, but the floor kept dropping, and she couldn't tell if she was going down or if the world was coming up to meet her.
