      Where the host moved from fact to interpretation was in explaining how Gödel used this result. Gödel did not view these closed timelike curves as merely a mathematical curiosity or a physical impossibility to be discarded. Instead, he argued that because general relativity allowed for such solutions, our intuitive notion of time as an objective flow was untenable. His argument was that if you can travel to the past, then the past must still exist in some sense, and the distinction between past, present, and future loses its objective meaning. He concluded that temporal change is an illusion of our perception rather than a feature of reality. This was a direct challenge to the idea that time is a fundamental dimension similar to space, or at least it challenged the idea that time has an objective lapse. He presented this in a companion essay for a book honoring Einstein, and it genuinely troubled Einstein, who felt that Gödel's solution might need to be excluded on physical grounds rather than accepting the conclusion that time is ideal. So the host was right that Gödel believed time was unreal in the sense of an objective flow, though saying Einstein was wrong to treat time as a dimension is a slight simplification of a deeper metaphysical disagreement about the nature of becoming.

