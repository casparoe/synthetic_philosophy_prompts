  **MEMORANDUM OF ADJUDICATION 2024-Q3**
  **TO:** The Board of Meridian Persistence
  **FROM:** Ontology Compliance Group (OCG)
  **SUBJECT:** Revised Schedule of Compensable Events (Realist Line Implementation)
  **REF:** OCG-RL-88-B

  **1.0 PREAMBLE AND DEFINITIONS**

  1.1 Pursuant to Directive 88-B, the Platform formally adopts the Realist Line to resolve moderation ambiguities. Rights are anchored in the persistence of computational entities rather than user phenomenology. This ensures that ownership claims rely on database state rather than subjective experience.

  1.2 **Object-Instance:** A unique record in the persistent substrate possessing independent existence regardless of rendering or perception.
  1.3 **Rendering-Event:** The transient visualisation of an Object-Instance on user hardware. Variance in draw distance or texture quality does not alter the Object-Instance.
  1.4 **Structural Harm:** Any unauthorized alteration to an Object-Instance's state ID, persistence vector, or computational allocation.

  **2.0 SCHEDULE OF COMPENSABLE EVENTS**

  **2.1 Theft and Restoration (The Numerical Identity Clause)**
  2.1.1 Theft constitutes the unauthorized transfer of an Object-Instance's state ID to another user account.
  2.1.2 Because an Object-Instance is a unique computational entity, restoration from a backup snapshot constitutes the creation of a *numerically distinct* successor, not the resurrection of the original.
  2.1.3 Compensation for theft is calculated at 100% of current market value. Compensation for restoration is classified as "Replacement Cost," minus a depreciation factor for the loss of original historical continuity.

  **2.2 Orphaned Objects (The Procedural Pruning Clause)**
  2.2.1 Procedurally generated terrain and entities in unvisited regions possess full Object-Instance status upon generation.
  2.2.2 Deletion of such entities during maintenance windows is classified as "Scheduled Ontological Reduction."
  2.2.3 Tariff: Compensation is owed to the Region Holder based on computational resource cost, not user perception. The fact that no user perceived the object is irrelevant to its ontological status.

  **2.3 Recursion (The Nested Persistence Clause)**
  2.3.1 Object-Instances contained within a user-operated VR rig inside Meridian (Level 2 Objects) are recognized as genuine entities.
  2.3.2 However, their persistence is dependent on the allocation resources of the parent Instance (Level 1).
  2.3.3 Ruling: A Depth Discount of 15% per level of nesting applies to all compensation claims. The Board notes that while Level 2 Objects are real, their reality is computationally subordinate.

  **2.4 Avatar Injury and Offline Destruction**
  2.4.1 Harm to an Avatar is compensable only if it alters the Object-Instance's functional parameters.
  2.4.2 **The Offline Case:** Destruction of an Object-Instance while the owner is offline constitutes Structural Harm. The tariff recognizes object-directed harm independent of user experience. The object's persistence was violated; the user's lack of immediate perception does not mitigate the ontological loss.

  **3.0 WORKED EXAMPLES**

  > **CASE A: The Sleeping Owner**
  > *Scenario:* User *K* logs off. A griefier deletes *K*'s inherited sword instance. *K* logs on six hours later.
  > *Adjudication:* Compensable. The sword existed persistently during the offline window. Its destruction is a real event. Compensation is paid for the loss of the specific Instance ID, not for *K*'s distress.
  > *Valuation:* Full market value of the sword instance at time of deletion.

  > **CASE B: The Nested Rig**
  > *Scenario:* User *V* operates a virtual computer inside Meridian. Inside that computer runs a simulation containing a virtual gem. A server crash deletes the rig.
  > *Adjudication:* Compensable. The rig is a Level 1 Object; the gem is a Level 2 Object.
  > *Valuation:* Rig paid at 100%. Gem paid at 85% (Level 2 Depth Discount). The gem was real, but its reality was hosted.

  **4.0 APPENDIX: EXOGENOUS PHYSICAL TRAUMA**

  4.1 Classification of physical injury sustained in reality (e.g., a broken wrist sustained while reaching for a real table) is outside the scope of Object-Instance compensation.
  4.2 Such events are classified as "User Hardware Failure."
  4.3 Rationale: The user's biological body is not an Object-Instance within the Meridian substrate. Therefore, damage to the biological substrate does not trigger the Schedule of Compensable Events, though it may trigger standard Terms of Service liability waivers.

  **5.0 APPROVAL**

  Approved for immediate implementation. The Board affirms that consistency in ontology requires consistency in compensation, regardless of counter-intuitive outcomes regarding unperceived events.

  ***

  *Footnote 1 (Dissenting Opinion, Board Member H. Vance):* I concur with the Realist Line but dissent on Clause 2.1.2. If a backup preserves the exact state vector and history logs of an Object-Instance, numerical identity should be maintained via continuity of information. Treating backups as replacements introduces unnecessary inflation into the replacement market. This is a dispute about identity conditions, not realism.
