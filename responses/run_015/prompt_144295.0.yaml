      *(Self-Correction during drafting)*: I should make sure to mention that if the PhD student claims the bridge principles are *analytic*, then he *is* committing the naturalistic fallacy (defining good). If he claims they are *synthetic necessary*, then they aren't descriptive premises. Either way, he loses.

