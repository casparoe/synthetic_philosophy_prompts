answer: |-
  You are right to be suspicious. This argument is a slick piece of philosophical jiu-jitsu that feels decisive but relies on equivocations that collapse under scrutiny. It is a variation on the "Supervenience Argument against Non-Naturalism," but your friend is using it to try to dissolve the Is-Ought gap entirely.

  The argument fails primarily at **Step (6)**, but it leans heavily on an unjustified assumption in **Step (2)**.

  Here is the breakdown of where it goes wrong, the distinction you were looking for, and how to handle the "brute necessity" worry.

  ### 1. The Logical Slip: Step (6) and the Status of Bridge Principles

  The fatal error is in the inference from (4) to (6).

  **Hume's Law (5)** states: No valid argument has *only* descriptive premises and a normative conclusion.
  **The PhD's Claim (6)** states: If bridge truths exist (Necessarily, if D then N), we can derive Ought from Is.

  **The Mistake:** To run the derivation, your argument looks like this:
  1.  *Premise 1 (Descriptive):* Act A has descriptive properties D.
  2.  *Premise 2 (Bridge):* Necessarily, if anything has D, it ought to be done.
  3.  *Conclusion (Normative):* Act A ought to be done.

  This argument is valid. **But it does not violate Hume's Law.** Why? Because **Premise 2 is not a descriptive premise.**

  A proposition containing normative vocabulary ("ought," "good," "reason") is a normative (or at least mixed) proposition, even if it is a necessary truth. Consider the identity statement "Water is H₂O." It is necessarily true. But if I want to derive "There is water in the glass" from "There is H₂O in the glass," I need the premise "Water is H₂O." That premise is not a truth of *logic*; it is a metaphysical identity.

  In ethics, if the bridge principle is "Necessarily, D implies Ought," that principle itself contains the concept *Ought*. Therefore, it is not a purely descriptive truth. To accept Premise 2, you must already have a grip on the normative concept. You have not derived the normative from the descriptive alone; you have derived it from the descriptive *plus a normative principle*.

  **The Verdict:** Step (6) is false. The existence of necessary bridge truths does not allow you to construct an argument with *only* descriptive premises. Hume's Law survives because the "bridge" is not made of descriptive wood; it is made of normative steel.

  ### 2. The Metaphysical Overreach: Step (2) and Particularism

  Even if we grant the point above, **Step (2)** is philosophically contentious. It claims that supervenience implies either brute connection *or* explainable connection via **bridge truths (laws)**.

  This disjunction is not exhaustive. It assumes **Moral Generalism** (the view that there are universal principles linking specific descriptive features to normative status).

  **The Alternative:** You can accept supervenience (1) while denying that there are codifiable bridge laws (2). This is the position of **Moral Particularists** (e.g., Jonathan Dancy).
  *   **The View:** The normative status of an act is *grounded* in its descriptive features, but the way those features ground the status is context-dependent. A feature that is a reason in one case (e.g., "it promises pleasure") might be no reason or even a counter-reason in another (e.g., "it is sadistic pleasure").
  *   **The Consequence:** There is no finite list of "If D then Ought" truths. The supervenience holds globally (no difference without a descriptive difference), but there are no *statable bridge laws* that cover all cases.
  *   **Why this blocks the argument:** If there are no bridge truths of the form "Necessarily, if D then N," then Step (4) is false, and the derivation in Step (6) cannot even be set up.

  **Cost of giving up (2):** You commit to Particularism. This makes moral reasoning less algorithmic, but it preserves the distinction between descriptive facts and normative reasons without positing "brute" laws.

  ### 3. The "Brute Necessity" Worry: Step (3)

  Your friend flags Step (3) as a "philosophical bet," claiming brute necessary connections are unacceptable coincidences. This is a Modal Rationalist intuition (associated with people like Frank Jackson or David Chalmers in some moods), but it is not a consensus view.

  **Non-Naturalist Realists (e.g., Parfit, Scanlon)** often accept a version of "brute" supervenience. They argue:
  *   Normative properties are *sui generis*.
  *   The fact that they supervene on the descriptive is a necessary truth about the *nature* of normativity, not a coincidence.
  *   It is not "brute" in the sense of "unexplainable mystery"; it is constitutive. To be a normative property *just is* to be determined by the natural facts.

  **Cost of giving up (3):** You accept that some necessary connections are not reducible to conceptual truths or identities.
  *   **In Ethics:** This is standard Non-Naturalism. It costs you reductionism, but it saves the autonomy of ethics.
  *   **In Mind:** This is Non-Reductive Physicalism. You accept that consciousness supervenes on physics, but there is no a priori entailment from physics to phenomenology (the "Hard Problem").
  *   **Is it costly?** Only if you are committed to a reductive naturalist worldview. If you are open to non-reductive realism, this is a feature, not a bug.

  ### 4. The Distinction You Were Looking For: Metaphysical vs. Conceptual

  You asked: *"Is there a usable distinction between a gap in the argument and a gap in the world that this argument slides between?"*

  **Yes.** This is the core of the confusion.

  1.  **The Metaphysical Gap (World):** Are normative properties *distinct* from descriptive properties?
      *   Non-Naturalists say **Yes**.
      *   Naturalists say **No** (they are identical).
      *   *Supervenience (1)* is compatible with **both**. You can have distinct properties that covary necessarily.
  2.  **The Conceptual/Logical Gap (Argument):** Can we *derive* normative conclusions from descriptive premises using only logic and descriptive concepts?
      *   Hume's Law (5) says **No**.
      *   Your friend argues that if the Metaphysical Gap is closed (via bridge laws), the Conceptual Gap must close.

  **The Rebuttal:** Even if the properties covary necessarily (Metaphysical connection), the *concepts* remain distinct. To move from the concept D to the concept N, you need a premise that links them. If that premise is analytic (true by definition), you've defined 'good' as 'D' (Naturalistic Fallacy). If that premise is synthetic (true by metaphysics), it is not a truth of logic, and it contains the normative concept N.

  Therefore, the **Metaphysical Determination** (the world) does not entail **Logical Derivability** (the argument). Your friend is conflating *ontological dependence* with *epistemic reducibility*.

  ### 5. Summary Advice for the Reading Group

  Here is how you can push back in the next session:

  1.  **Challenge Step (6) directly:** Ask him to classify the Bridge Premise ("Necessarily, if D then N"). Is it a descriptive truth?
      *   If **Yes**: He is defining 'ought' in terms of 'is'. He has committed the Naturalistic Fallacy despite his denial. (Open Question Argument applies: "I know it is D, but is it Ought?" remains intelligible).
      *   If **No** (it is normative/mixed): Then the argument for the conclusion uses a normative premise. Hume's Law (no *only* descriptive premises) is not violated.
  2.  **Challenge Step (2):** Ask if he is committed to Moral Generalism. If he admits that moral reasons might be context-dependent (Particularism), then there are no universal bridge truths, and his derivation fails.
  3.  **Address the Mind/Body Analogy:** Point out that Non-Reductive Physicalists *do* accept supervenience without accepting that you can deduce "what it is like to see red" from physics alone. They accept brute (or grounded) necessary connections. If he thinks that's unacceptable, he's arguing against Non-Reductive Physicalism, not just ethics. If he's fine with it there, he should be fine with it in ethics, which means accepting Hume's Law as a limit on *derivation*, not a limit on *metaphysics*.

  **The Cheapest Premise to Drop:**
  Drop **(2)**.
  Supervenience does not require codifiable bridge *laws*. It only requires that the normative status is *fixed* by the descriptive facts. This allows you to keep Supervenience (1), keep Hume's Law (5), and avoid "brute" laws by appealing to **grounding** or **particularism**.

  **What you give up:** You give up the dream of a "moral calculator" (Step 7). You admit that knowing all the facts of the world does not logically force a moral conclusion without a normative insight (the bridge). But that isn't a bug; that's just what it means for ethics to be normative.
