answer: |-
  ### The Scenario

  It is 3:00 AM in the shared on-call room of a busy urban hospital. There is a single whiteboard next to the door labeled "Bed Log," and the residents' informal but strict norm is that anyone taking a bed must write their name and time to ensure fair rotation during surges. Resident Evans slides into a bed without writing anything. At that exact moment, two colleagues intervene using the same words: "You can't take that bed without signing the log." The first is Resident Chen, who is currently occupying the *other* bed after having taken it twenty minutes ago without signing the log; Chen is unrepentant, has not been punished, and offers no apology for their own identical omission. The second is Dr. Aris, an Attending Physician who is morally upright and never violates hospital protocols, but who has a private suite and never uses the on-call beds, meaning she is not subject to the Bed Log norm and cannot be blamed for failing to sign it. Both Chen and Aris are colleagues who know the facts, are not acting out of spite, and are not complicit in Evans's violation.

  ### The Three Accounts

  **1. The Forfeiture Account (Tu Quoque)**
  *Verdict:* Chen lacks standing; Aris has standing.
  *Reasoning:* This account holds that standing is a function of moral integrity regarding the specific norm being enforced. By currently and unrepentantly violating the very norm she invokes, Chen forfeits the moral authority to hold Evans accountable; her blame is rendered inert by her own conduct. Aris, however, has clean hands. She has not violated the norm (indeed, she follows all protocols), and she is not motivated by ill will. Because she is morally consistent regarding the rule in question, she retains the standing to enforce it, regardless of her administrative exemption from the roster.

  **2. The Equal Standing Account (Moral Agency)**
  *Verdict:* Chen has standing; Aris has standing.
  *Reasoning:* This account holds that standing is a baseline feature of moral personhood and does not come in grades based on past or present conduct. To blame is to call someone to account as a moral equal; this capacity is not lost simply because the blamer is also flawed. Chen's hypocrisy is a separate moral failing from Evans's violation, but it does not sever her capacity to address him as a responsible agent. Aris, likewise, is a moral agent addressing another. Since neither is a stranger to the moral community, and both are addressing a genuine wrong (breach of agreement), both possess the standing to blame.

  **3. The Reciprocal Liability Account (Relational/Practice)**
  *Verdict:* Chen has standing; Aris lacks standing.
  *Reasoning:* This account holds that standing is not about the blamer's moral record, but about their location within the normative relationship that generates the obligation. The Bed Log norm creates a specific reciprocal tie among residents: I am bound to sign because you are bound to sign, and I can hold you accountable because you can hold me accountable. Chen is inside this circle of reciprocity; she is liable to be blamed by Evans for the exact same token of conduct (taking a bed without signing), which preserves her standing to blame him. Aris is outside this circle. Because she never uses the beds, she is not exposed to being blamed for this specific failure. Lacking this mutual vulnerability, she is not a participant in the practice, and her blame is experienced not as a legitimate call to account but as an external interference.

  ### The Single Feature Doing the Work

  The decisive feature is **mutual vulnerability to the same blame**.
  The case is engineered so that the Hypocrite (Chen) is *liable* to be blamed by the Blamed (Evans) for the exact same act, while the Clean-Handed Outsider (Aris) is *immune* from such blame. The Forfeiture Account focuses on the *act* of the blamer (Chen's violation kills standing). The Equal Standing Account focuses on the *status* of the blamer (agency grants standing). The Reciprocal Liability Account focuses on the *tie* between blamer and blamed (shared liability grants standing). By making Chen liable but violating, and Aris clean but immune, the case forces the accounts to diverge.

  ### Collapse Tests

  1.  **Clean the Hypocrite's Hands:** If Chen had signed the log properly (making her clean-handed), the Forfeiture Account shifts to "Yes." The Reciprocal Liability Account remains "Yes." The spread collapses: Forfeiture and Reciprocity now agree (Both Yes), leaving only Equal Standing as distinct (though it also says Yes, so all three converge on "Yes").
  2.  **Swap for a Generic Moral Norm:** If the violation were "don't lie to a patient" (a universal moral duty) rather than "sign the log" (a practice norm), Aris (the Attending) becomes liable to the same blame. The Reciprocal Liability Account shifts to "Yes" for Aris. The spread collapses: Reciprocity and Equal Standing now agree (Both Yes), and Forfeiture remains the outlier (Aris Yes, Chen No).
  3.  **Make the Outsider a Full Co-Member:** If Aris were a Resident who uses the beds (making her inside the practice), she becomes liable to reciprocal blame. The Reciprocal Liability Account shifts to "Yes" for Aris. Again, the spread collapses as Reciprocity and Equal Standing converge.

  ### The Honest Critique

  A defender of the **Forfeiture Account** will attack the case by arguing that you have conflated *procedural legitimacy* with *moral standing*. They will claim that by choosing a trivial, conventional norm (the Bed Log) rather than a moral one, you have rigged the intuition pump to make Aris's interference feel like bureaucratic meddling rather than moral blame. They will argue: "If the norm were truly weighty enough to warrant blame, Aris's clean hands *would* grant her standing even as an outsider, and Chen's hypocrisy *would* remove it even as an insider. You haven't proven the Relational Account works; you've just described a club rule where membership matters more than morality. Standing to *blame* requires moral authority, not just a name on a roster."

  *Is this fair?* It is a strong objection if one believes standing is inherently moral. However, it is sour grapes if one accepts that much of our normative life is practice-dependent. The case succeeds only if you accept that some norms are internal to practices such that outsiders literally lack the position to enforce them, regardless of their virtue. If the students feel Aris *should* have standing, the case fails; if they feel Aris is "butting in," the case holds.
