answer: |-
  ### Context and Working Definitions

  Our triage process uses three lenses to predict robot behavior. The **Physical Way** looks at material states: voltage, heat, friction, and code execution. Use this when hardware integrity is in question. The **Design Way** looks at function: what components like lidars or path planners are built to do and how they fail according to specs. Use this for subsystem errors. The **Intentional Way** looks at goals: treating the robot as an agent avoiding obstacles or optimizing routes. Use this for logical anomalies where hardware seems intact.

  A **Real Pattern** exists when a behavior repeats reliably enough to bet on it, even if we ignore lower-level details. For technicians, a pattern is real if it helps you predict the next incident correctly more often than chance. If a prediction holds across similar situations, it is a valid basis for triage. If it fails repeatedly, the pattern is illusory, and you must switch lenses. This procedure prioritizes safety: physical faults override intentional explanations when risk is present.

  ### The Triage Procedure

  **Step 1: Validate the Real Pattern**
  *   **Action:** Review incident history for this unit and similar units.
  *   **Question:** Does this anomaly repeat under similar conditions?
  *   **Pass:** Behavior occurs ≥2 times or matches a known fleet-wide signature.
  *   **Fail:** Isolated event with no recurrence.
  *   **Action on Fail:** Log as transient noise. Return to service unless safety flag exists.
  *   **Action on Pass:** Proceed to Step 2.
  *   **Judgment Point:** Technician decides if "similar conditions" are close enough to count as a pattern.

  **Step 2: Apply the Intentional Way**
  *   **Action:** Treat the robot as pursuing a goal (e.g., delivery, safety).
  *   **Question:** Does the behavior make sense as a rational choice to achieve a goal given its information?
  *   **Pass:** Behavior aligns with goal optimization (e.g., stopping to avoid collision).
  *   **Fail:** Behavior contradicts goals without explanation (e.g., driving into walls).
  *   **Action on Pass:** If non-safety critical, mark as "Logic Constraint." Proceed to Step 5.
  *   **Action on Fail:** Proceed to Step 3.
  *   **Simplification Risk:** Assuming the robot is "smart" when it is merely reacting to sensor noise.

  **Step 3: Apply the Design Way**
  *   **Action:** Compare behavior against subsystem specifications and error logs.
  *   **Question:** Does this match a known failure mode for a specific component (e.g., lidar drift, map mismatch)?
  *   **Pass:** Error codes or behavior match documented functional failures.
  *   **Fail:** Behavior is undocumented or contradicts subsystem specs.
  *   **Action on Pass:** Execute standard repair for that component. Proceed to Step 5.
  *   **Action on Fail:** Proceed to Step 4.

  **Step 4: Apply the Physical Way**
  *   **Action:** Inspect material states (wiring, heat, voltage, mechanical resistance).
  *   **Question:** Is there physical evidence of degradation regardless of software logic?
  *   **Pass:** Physical fault found (e.g., overheating, loose connection).
  *   **Fail:** Hardware tests within nominal limits.
  *   **Action on Pass:** **STOP.** Ground unit for physical repair. Do not return to service.
  *   **Action on Fail:** Escalate to Engineering for deep analysis.
  *   **Safety Rule:** If any safety flag (collision, near-miss, overheat) is present, you must pass Step 4 before returning to service.

  **Step 5: Safety Officer Sign-off**
  *   **Action:** Prepare return-to-service dossier.
  *   **Condition:** Any incident involving safety-relevant flags (obstacle avoidance, emergency stop, motor overheat).
  *   **Requirement:** Safety Officer must review Physical Way findings.
  *   **Constraint:** Technicians cannot authorize return-to-service on safety flags alone.
  *   **Judgment Point:** Technician classifies whether a flag is "safety-relevant." Err on the side of caution.

  **Step 6: Final Decision**
  *   **Action:** Authorize service or escalate.
  *   **Rule:** If Step 4 identified a physical fault, the robot remains grounded even if Step 2 (Intentional) predicted the behavior perfectly.
  *   **Reason:** Predictive success does not equal physical safety.

  ### Worked Applications

  **Unit 14: Forklift Halts**
  *   **Step 1 (Pattern):** Unit 14 halts at the same intersection when forklifts pass. Happened 3 times this shift. **Pass.**
  *   **Step 2 (Intentional):** Does this make sense as a goal? Yes. The robot prioritizes collision avoidance over speed. It perceives the forklift as an obstacle and stops. **Pass.**
  *   **Step 3 (Design):** Lidar logs show occlusion during stops. Matches design spec for dynamic obstacle avoidance. **Pass.**
  *   **Step 4 (Physical):** No motor heat, no voltage drops, no brake wear. **Fail (No fault found).**
  *   **Step 5 (Safety):** Flag is "Emergency Stop." Requires sign-off.
  *   **Decision:** Behavior is a Real Pattern predicted by Intentional and Design ways. No Physical fault. Safety Officer reviews logs confirming avoidance logic. **Result:** Return to service with note to monitor intersection speed.

  **Unit 07: Long Loop**
  *   **Step 1 (Pattern):** Unit 07 takes 30% longer route since map update. Consistent across 5 trips. **Pass.**
  *   **Step 2 (Intentional):** Is it pursuing a goal? Yes. It avoids the newly marked pedestrian zone. The loop is the optimal path remaining. **Pass.**
  *   **Step 3 (Design):** Map version matches update log. Path planner functioning within spec. **Pass.**
  *   **Step 4 (Physical):** No hardware anomalies. **Fail (No fault found).**
  *   **Step 5 (Safety):** No safety flags (collision/heat).
  *   **Decision:** Intentional prediction holds. The robot is behaving rationally given new constraints. **Result:** Return to service. Escalate to Fleet Management to review traffic congestion caused by the new zone.

  **Unit 22: Pallet Pushing and Overheat**
  *   **Step 1 (Pattern):** Unit 22 pushes empty pallet, stops, reverses, repeats. Motor overheat warning active. Happened 4 times. **Pass.**
  *   **Step 2 (Intentional):** Does this make sense as a goal? No. Pushing an empty pallet wastes energy and risks damage. It contradicts efficiency goals. **Fail.**
  *   **Step 3 (Design):** Error log shows "Path Blocked" but lidar sees clear space. Mismatch between sensor input and planner. **Fail (Unexplained).**
  *   **Step 4 (Physical):** Motor temperature exceeds nominal by 15°C. Wheel encoder shows slippage during push. **Pass (Physical fault found).**
  *   **Step 5 (Safety):** Motor overheat is a safety-relevant flag. Requires sign-off.
  *   **Decision:** Although one might argue the robot is "confused" (Intentional/Design), the Physical Way confirms material degradation (overheat/slippage).
  *   **Unwelcome Result:** The team wants to reboot software to clear the "confusion." The procedure forbids this. Because Step 4 passed on a fault, the unit must be grounded.
  *   **Result:** **Ground Unit 22.** Send to maintenance for motor/wheel inspection. Safety Officer denies return-to-service until physical repair is verified. This causes short-term capacity loss but prevents fire or mechanical failure.

  ### Judgment Points and Predictable Misfires

  Technician judgment cannot be eliminated at two critical junctures. First, in **Step 1**, deciding whether a pattern is "real" requires estimating future reliability based on past data. A technician might dismiss a rare but catastrophic fault as noise. Second, in **Step 5**, classifying a flag as "safety-relevant" is a value judgment. A technician might deem a minor overheat "operational" to keep fleet numbers up, bypassing the Safety Officer.

  The procedure is most likely to misfire when technicians over-rely on the **Intentional Way**. It is cognitively easier to say "the robot decided to stop" than to diagnose a voltage drop. This simplification risks masking physical degradation. If a robot stops because its battery is failing (Physical), but the technician logs it as "avoiding traffic" (Intentional), the battery may fail catastrophically later. The procedure mitigates this by forcing Step 4 on safety flags, but human bias toward the simplest explanation remains a risk. Technicians must be trained to distrust "rational" behavior when physical signs contradict it.

  ### Limits of the Procedure

  This procedure cannot identify novel failure modes outside existing design specs or physical test parameters. It does not replace engineering root-cause analysis; it only categorizes incidents for escalation. It cannot guarantee future safety, as a "Real Pattern" may break under new environmental conditions. Finally, it cannot resolve conflicts between fleet throughput and safety; it merely enforces the rule that physical safety checks override operational convenience.
