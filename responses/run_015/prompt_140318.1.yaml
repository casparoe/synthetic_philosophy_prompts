answer: |-
  ### Strategic Pre-emption: The First Two Minutes
  **Goal:** Forestall the "artifact of decision rule" shrug.
  **Concession:** Do not defend Expected Utility (EU) as sacred. Defend *probability hygiene* as a prerequisite for *any* decision rule.

  **Script:**
  "I want to start by conceding a point to the Decision Theorist on the committee. I am not arguing that Expected Utility Maximization is the final, unassailable norm of rationality. If Risk-Weighted Utility or another framework better captures our intuitions about risk, I am open to that. However, my claim is prior to that debate. Before we decide how to *weight* utilities, we must ensure the probabilities we are weighting are epistemically well-formed. My argument is that 'hypothesis-space-generated' probabilities are not just small; they are structurally defective inputs. Even if you replace EU with Risk-Weighted Utility, feeding it unanchored probabilities from an unbounded hypothesis space will still produce pathological recommendations. So, while I concede the decision rule might need adjustment, I maintain that fixing the probability input is a necessary condition for *any* sane decision theory, fanatic or not."

  ***

  ### Q&A Preparation Sheet

  #### 1. The Decision Theorist: "The Root Cause"
  **Objection:** "You're treating a symptom, not the disease. Fanaticism arises because you treat Expected Utility as the baseline. If you adopted Risk-Weighted Utility or a similar framework, the tiny probability would be down-weighted automatically without needing your complex 'Modal Scarcity' constraints. Why complicate the epistemology when the fix is in the normative ethics of choice?"
  **Reply:** "That is a compelling alternative, and I agree Risk-Weighted Utility handles *known* small probabilities well. However, my diagnostic claim is that Mugging-style probabilities aren't just small; they are *ill-formed*. They are residues of an unbounded partition, not estimates derived from a model. Risk-Weighting assumes a coherent probability distribution exists to be weighted. My argument is that in Mugging cases, no such coherent distribution exists because the hypothesis space is unstable. You cannot weight a probability that shouldn't enter the calculation in the first place. My constraint is a gatekeeper for what counts as a valid probability input, which is a prerequisite for applying Risk-Weighting or EU alike."
  **Concession:** I concede that for *anchored* low probabilities (like X-risk), Risk-Weighting is a compatible and perhaps necessary additional layer.
  **Soft Spot:** If the DT argues that 'ill-formed' is just a label for 'low weight', the distinction collapses.

  #### 2. The Ethicist/Longtermist: "The Disguised Discount"
  **Objection:** "This looks like a solution in search of a problem. You claim to distinguish Mugging from Longtermism, but functionally, 'Modal Scarcity' acts exactly like a lexical discount rate on the far future. You've invented an epistemic constraint to avoid the moral demandingness of longtermism. How do we know you aren't just rationalizing an intuition that we *shouldn't* care about the far future?"
  **Reply:** "I understand the concern, but the justification is epistemic, not temporal. A discount rate reduces value because of time; Modal Scarcity excludes probability because of *grounding*. In X-risk mitigation, the probability is anchored to physical mechanisms—asteroid trajectories, AI alignment pathways, nuclear exchange models. These have reference classes. In Pascal's Mugging, the probability is anchored to 'a hypothesis I haven't thought of.' The distinction isn't about *when* the payoff occurs, but *how* the probability is generated. If we can articulate a mechanism for a far-future event, Modal Scarcity allows it. It only blocks the residue of ignorance."
  **Concession:** I concede that the *effect* is similar to discounting unanchored claims, but the *justification* rests on model structure, not time preference.
  **Soft Spot:** If the Longtermist argues that far-future mechanisms are *also* reference-class unstable, the distinction blurs.

  #### 3. The Formal Epistemologist: "Operationalizability"
  **Objection:** "You require probabilities to be 'anchored to an articulable mechanism.' Is this condition computable? Or is it just a philosophical redescription of 'calibrated probabilities'? If I cannot write down an algorithm to check if a hypothesis is 'anchored,' how is this a formal constraint rather than a heuristic?"
  **Reply:** "It is not intended as an algorithmic filter for agents, but a normative constraint on model construction. In statistics, we reject models that are unidentifiable or over-parameterized. Modal Scarcity is the decision-theoretic equivalent: it forbids assigning positive mass to hypotheses that cannot be distinguished within a fixed partition of live possibilities. It's not about computability in real-time; it's about the validity of the prior. If you cannot specify the reference class that bounds the hypothesis, the probability is undefined, not zero. This aligns with your work on imprecise probabilities: where the model is unstable, the probability set should be maximal, effectively blocking decision-relevance."
  **Concession:** I concede it is not a computable algorithm for bounded agents, but a standard for ideal model specification.
  **Soft Spot:** Without an algorithm, it relies on expert judgment, which reintroduces the subjectivity the rule tries to banish.

  #### 4. The Decision Theorist: "The Many Bets Defence"
  **Objection:** "You claim the 'many independent bets' defence of fanaticism works for X-risk but not Mugging. But why? If the Mugger offers the bet repeatedly across possible worlds or iterations, doesn't the Law of Large Numbers eventually vindicate the expected value calculation there too? Your distinction between 'mechanism-anchored' and 'space-generated' seems to break down under iteration."
  **Reply:** "The Law of Large Numbers requires independent, identically distributed trials drawn from a stable distribution. In X-risk, the 'trials' are distinct physical mechanisms (e.g., different extinction pathways) that are causally independent. In Mugging, the 'trials' are just re-runs of the same epistemic gap. You cannot generate independence by re-partitioning the same ignorance. If I assign probability to 'some unknown consideration,' running that again doesn't create a new independent hypothesis; it just double-counts the residue. Mechanism-anchoring provides the causal structure required for independence; hypothesis-space generation does not."
  **Concession:** I concede that if the Mugger could specify a *mechanism* for the payout that repeats, the bet becomes valid—but then it's no longer a Mugging case.
  **Soft Spot:** Determining what counts as a 'causal structure' vs. 'epistemic gap' can be contentious in edge cases.

  #### 5. The Ethicist/Longtermist: "The Line-Drawing Problem"
  **Objection:** "You say X-risk is anchored and Mugging is not. But consider a hypothesis that the universe is a simulation controlled by a being who rewards muggings. That has a 'mechanism.' Conversely, some far-future scenarios are highly speculative. Where exactly is the line? It seems you can manipulate the 'anchoring' description to get whatever result you want."
  **Reply:** "The line is the *bounded reference class*. For the simulation hypothesis to be anchored, we need a reference class of 'simulators' with a bounded total probability. Usually, this hypothesis is introduced as a residual 'maybe reality is weird' claim, which is unbounded. For X-risk, we have a finite set of known physical pathways to extinction. The constraint is that the sum of probabilities of all live hypotheses in the class must be bounded from below by 1/N. Simulation hypotheses typically expand N indefinitely to keep probabilities non-zero. X-risk scenarios usually fix N (the number of plausible extinction pathways). The discipline is in fixing N *before* assigning probabilities."
  **Concession:** I concede that a determined fanatic can dress a Mugging in mechanistic clothing, but that violates the spirit of fixing N in advance.
  **Soft Spot:** The requirement to fix N in advance is a procedural norm that agents can easily ignore.

  #### 6. The Formal Epistemologist: "Imprecise Probabilities"
  **Objection:** "Why not just use imprecise probabilities? If the model is uncertain, set the probability interval to [0, 1]. This handles the uncertainty without needing your 'Modal Scarcity' rule. It seems you are reinventing the wheel of robust Bayesianism."
  **Reply:** "Imprecise probabilities allow the upper bound to be non-zero. In fanaticism cases, even a tiny upper bound (e.g., 0.0001) multiplied by infinite utility still dominates decision-making. My claim is stronger: for hypothesis-space-generated claims, the probability is not just imprecise; it is *undefined* for the purpose of maximization. It shouldn't enter the expectation integral at all. Imprecise probability still treats the hypothesis as 'live' in a way that permits fanaticism if the stakes are high enough. Modal Scarcity says the hypothesis is not 'live' in the decision-relevant sense until anchored."
  **Concession:** I concede that imprecise probabilities are the right tool for *model uncertainty*, but they are insufficient for *model validity*.
  **Soft Spot:** Distinguishing 'undefined' from '[0, ε]' is mathematically subtle and may not change practical outcomes.

  #### 7. The Decision Theorist: "Risk of False Negatives"
  **Objection:** "Your constraint blocks false positives (Mugging), but what about false negatives? If we require 'articulable mechanisms' for all probabilities, we might ignore genuine black swan events precisely because we can't articulate them yet. Isn't it safer to keep the probability space open?"
  **Reply:** "That is the cost of avoiding fanaticism. However, Modal Scarcity doesn't require knowing the *truth* of the mechanism, only its *articulability*. We can posit a 'unknown unknown' category, but we must assign it a bounded probability mass (e.g., 5% for 'all unmodelled risks'). We cannot let that 5% spread over infinite hypotheses. This allows us to hedge against black swans without letting any single unarticulated hypothesis dominate. We protect against ignorance without succumbing to it."
  **Concession:** I concede this increases the risk of ignoring novel threats, but it prevents decision paralysis by infinite expectations.
  **Soft Spot:** Deciding the size of the 'unmodelled risks' bucket is itself subjective and vulnerable to manipulation.

  #### 8. The Ethicist/Longtermist: "Moral Demandingness"
  **Objection:** "If you block Mugging, do you also block high-stakes moral duties that rely on small probabilities? If saving a billion lives has a 1 in a billion chance, EU says do it. If your rule blocks this because the probability isn't 'anchored' enough, you are advocating moral negligence."
  **Reply:** "If the probability of saving a billion lives is derived from a specific, mechanism-anchored plan (e.g., a specific vaccine distribution strategy), Modal Scarcity allows it. It only blocks the probability if it comes from 'maybe something will work.' The rule demands epistemic rigor in moral planning. It forces us to find the mechanism before claiming the obligation. This isn't negligence; it's a demand for evidence-based altruism. We shouldn't be obligated to act on residues of ignorance, no matter the stakes."
  **Concession:** I concede this raises the bar for moral action, potentially reducing 'easy' opportunities to do good.
  **Soft Spot:** It may imply we have no obligation to act in novel crises where mechanisms are not yet understood.

  ***

  ### Duplicate Objections Note
  *   **Objections 1 & 4** are siblings: Both suggest alternative decision rules (EU modification vs. Iteration) solve the problem without your epistemic constraint.
  *   **Objections 3 & 6** are siblings: Both argue that existing formal tools (Computability/Imprecise Probabilities) render your specific constraint redundant.
  *   **Objections 2 & 5** are siblings: Both challenge the boundary between Mugging and Longtermism (Discounting vs. Line-Drawing).

  ### The "Hope Nobody Asks" Question
  **Question:** "Isn't 'Articulable Mechanism' just a euphemism for 'A Probability I Find Intuitively Plausible'? If so, isn't Modal Scarcity circular: it blocks fanaticism by excluding probabilities that imply fanaticism?"

  **Honest Answer:** "There is a risk of circularity if 'articulable' is defined purely by current consensus. My defence is that 'articulable' refers to the *structure* of the hypothesis (membership in a bounded reference class), not its *content*. However, I concede that in practice, distinguishing structural anchoring from intuitive plausibility is difficult. The theory relies on a community standard of explanation that I have not fully formalized. If that standard is biased, the rule inherits that bias."
