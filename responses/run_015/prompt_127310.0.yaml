prompt: |-
  hey so i'm running this biweekly reading group for grad students — mix of philosophy and cs folks — and last thursday one of the cs people mentioned how llms during rlhf seem to converge on these weirdly uniform "safe" answers even when the reasoning is shaky, and someone else said that's just information cascades. i realized i actually only have a pop-science grasp of rational herding and i want to do a 40-minute session on it next week, but not as a dry econ lecture. i need a teaching plan, not the lecture itself.

  the audience has taken basic game theory but no microeconomics, and they all think herding means "people are sheep" or peer pressure. i want to use the analogy of model fine-tuning suppressing minority reasoning traces because raters cluster — that's what made it click for me personally, since i just started working with a small llm and noticed it refuses things in this very predictable, almost ritualistic way that doesn't match its pretraining distribution. but i need the explanation to stand on its own even for the philosophers who don't care about ai. so: what's the dependency chain? i think i have to start with private signals vs public actions, but i'm not sure whether to introduce bayesian updating before or after the cascade mechanism. what's the one carrying example — probably not the restaurant one? — that makes the rationality visible rather than hidden, and what must it have and lack? which misconceptions should i expect at each step (they'll think it's about social pressure, they'll confuse cascade with correlation, they might think breaking the cascade is always good) and exactly where in the sequence do i head each off? what's the check at the end — maybe ask them to design a situation where herding is socially optimal? also what should i openly say i'm leaving out, like the formal equilibrium conditions? and please don't just explain the concept; plan the arc: what must come before what, why the example needs hidden private information and visible public choices, where the "this is actually rational" reveal lands, and how to handle the objection that in real life people don't do explicit bayesian math. also one typo in my notes: i wrote "cascde" somewhere and now i'm worried i don't even understand the spelling.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Context:** Biweekly reading group, grad students (Philosophy + CS).
      *   **Topic:** Rational Herding / Information Cascades.
      *   **Duration:** 40 minutes.
      *   **Goal:** A teaching plan (arc/structure), not the lecture content itself.
      *   **Audience Knowledge:** Basic game theory, no microeconomics. Pop-science grasp of herding ("people are sheep").
      *   **Key Insight to Convey:** Herding is rational given information structures, not just peer pressure. Analogy: LLM RLHF converging on "safe" answers due to rater clustering (suppressing minority reasoning).
      *   **Specific Constraints/Questions:**
          *   Dependency chain (Private signals vs. Public actions).
          *   Bayesian updating timing.
          *   Choosing a carrying example (not the standard restaurant one?).
          *   Misconceptions to head off (social pressure, cascade vs. correlation, breaking cascade is always good).
          *   Ending check (design a socially optimal herding situation).
          *   What to explicitly exclude (formal equilibrium conditions).
          *   Address the "people don't do Bayes" objection.
          *   Fix the typo ("cascde" -> "cascade").

  2.  **Deconstruct the Core Concept (Information Cascades):**
      *   *Mechanism:* Agents have private signals. Agents observe prior agents' public actions. Agents update beliefs based on both. At some point, the weight of public actions overwhelms the private signal, leading the agent to ignore their own information and follow the crowd.
      *   *Rationality:* It is individually rational to ignore private info if the public history implies enough aggregate information.
      *   *Fragility:* Cascades can be wrong (based on early noise) and are brittle (small new info can break them).
      *   *LLM Analogy:* Pre-training = Private Signal (diverse knowledge). RLHF/Raters = Public Actions (previous human feedback). Model converges on "safe" output because the reward signal (public history) overwhelms the pre-trained distribution (private signal).

  3.  **Drafting the Teaching Plan - Step-by-Step:**

      *   **Phase 1: Hook & Setup (0-5 mins)**
          *   Need to bust the "sheep" myth immediately.
          *   Use the LLM analogy early? No, keep it general first, then bridge. Or use the LLM analogy as the *mystery* to solve. Let's make the LLM behavior the puzzle.
          *   *Correction:* The prompt asks for an example that stands on its own for philosophers. So, start with a human example, bridge to LLM later.
          *   *Example Choice:* The prompt suggests avoiding the restaurant one. What's better? *Job Market Signaling*? *Adoption of Technology*? *The "Two Urns" Experiment* is the classic formal one, but maybe too abstract. Let's go with **"The Dark Alley Restaurant"** (variation of the classic) or **"The Job Candidate"**. Actually, a **"Safe Investment"** scenario works well for CS/Phil. Let's stick to a binary choice scenario (Good/Bad) because it simplifies the Bayes math. Let's use **"The Two Doors"** (One leads to reward, one to trap). It's clean.
          *   *Wait, better idea:* **"The AI Safety Filter"** itself. Since the audience is mixed, use a scenario that fits both. How about **"Peer Review"**? Everyone submits a paper. You see previous accepts/rejects. Do you accept a borderline paper?
          *   *Decision:* Let's use a generic **"Binary Choice with Private Info"** scenario (e.g., Accepting a risky project). It maps perfectly to LLM token generation (Accept/Reject token).
          *   *Typo Check:* "Cascde" -> "Cascade".

      *   **Phase 2: The Mechanics (5-20 mins)**
          *   Define Private Signal vs. Public Action.
          *   *Bayes Timing:* Introduce the *intuition* of Bayes first, then the mechanism. Don't do formulas. Use "Weight of Evidence."
          *   *The Reveal:* Show the moment where ignoring private info becomes rational.
          *   *Misconception Check:* "Isn't this just peer pressure?" No, it's math.

      *   **Phase 3: The LLM Bridge (20-30 mins)**
          *   Connect the human model to the RLHF model.
          *   Pre-training = Private Signal.
          *   RLHF Rewards = Public Actions (from previous raters/models).
          *   Result: Mode collapse / "Safe" answers.

      *   **Phase 4: Nuance & Wrap (30-40 mins)**
          *   "People don't do Bayes" objection.
          *   Social Optimality exercise.
          *   Exclusions statement.

  4.  **Refining the Arc (Self-Correction during drafting):**
      *   *Bayes Placement:* If I put Bayes too early, Phils might get bored, CS might get impatient. If I put it too late, the "rationality" claim doesn't land. *Solution:* Use a "Mental Accounting" metaphor for Bayes. "You have 1 vote (private), the crowd has N votes (public). When N > 1, you follow the crowd."
      *   *Example:* The "Two Urns" is the standard for a reason (Bikhchandani et al.). But it's dry. Let's spice it up. **"The Faulty Sensor"**. You are a robot. You have a sensor (private). You see other robots moving Left or Right (public). Where do you go? This bridges human and AI nicely.
      *   *Actually, keep it human for the core theory.* Philosophers need to see *human* rationality to accept the premise. Use the **"Job Interview"** or **"Restaurant"**. Let's stick to the prompt's hesitation about the restaurant. How about **"Adoption of a New Software Tool"**? CS folks get it. Phils get the epistemic logic.
      *   *Revised Example:* **"The Bug Fix"**. There's a bug. Is it in Module A or B? You have a private log (signal). You see what previous devs committed (action).
      *   *Wait, simplest is best:* **"The Coin Flip Bet"**. Heads or Tails. You get a noisy hint. You see what others bet.
      *   *Let's go with the "Two Doors" (Good/Bad State).* It's the cleanest for binary cascades.

      *   *Addressing the "People don't do Bayes" objection:* This is crucial. Need to address it in the "Nuance" section. Evolution/Heuristics argument.

      *   *Social Optimality:* This is a great closing task. When is herding good? (e.g., Fire drills, Bank runs - wait, bank runs are bad. Fire drills are good coordination). *Correction:* Herding is good when private signals are *very* noisy but public actions are reliable, or when coordination matters more than truth.

  5.  **Finalizing the Structure:**
      *   **0-5:** Hook (LLM behavior) + Definition (Cascade vs. Herd). Fix typo.
      *   **5-15:** The Model (Private Signal, Public Action, Sequential). The "Weight of Evidence" (Bayes lite).
      *   **15-25:** The Tipping Point (The "Rational" Reveal).
      *   **25-35:** The LLM Connection (RLHF as Cascade).
      *   **35-40:** Objections + Closing Exercise.

  6.  **Fleshing out the Details (incorporating specific constraints):**
      *   *Dependency Chain:* Private Signal -> Public Action -> Observation -> Update -> Decision.
      *   *Misconceptions:* Peer pressure (address early), Correlation (address during mechanism), Breaking is good (address during closing).
      *   *Exclusions:* Nash Equilibrium proofs, specific probability thresholds.

  7.  **Review against constraints:**
