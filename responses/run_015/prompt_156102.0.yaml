      *   *Constraint Check:* Did I cite anyone? No. Did I make a reading list? No.
      *   *Specifics:* Make sure to explicitly mention Saemaul, Export-led model, US umbrella, Labor suppression.
      *   *Weber Nuance:* Ensure I use "elective affinity" correctly. It's not direct causation, it's a resonance.
      *   *Critical Edge:* Don't let the "Confucian Capitalism" argument slide unchallenged. Emphasize the *invention* of tradition. Park Chung-hee actively manipulated these values.

  5.  **Final Review against the Prompt:**

      *   *Propulsive vs. Permissive?* Yes, distinct sections.
      *   *Map specific features?* Yes (Saemaul, Exports, US, Labor).
      *   *Weber's limits?* Yes (Coercion, Geopolitics).
