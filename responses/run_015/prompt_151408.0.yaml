      You argue that because men agree upon this rule, the barren becomes fertile, but you confuse the naming of a thing with its essence. Just as a community might agree to call a stone a loaf of bread, this convention does not nourish the body, so too this protocol does not truly generate wealth but only multiplies claims upon it. I have said that interest is money born of money, and of all modes of getting wealth this is the most unnatural, for money was intended to be used in exchange, not to increase at interest. In your protocol, there is no craft, no farming, no exchange of goods for need, only the coin begetting coin like a monster without a mother. That men accept these offspring as genuine does not make the breeding natural; it merely means the vice is now common to all participants. This is not wealth-getting for the household, which is limited by need, but limitless acquisition divorced from nature, and thus it remains the most contrary to nature, regardless of how many men consent to the fiction.

