prompt: |-
  In American and common-law courts, parties routinely stipulate to facts—agreeing that X occurred for the purposes of trial—even when both sides privately believe X is false, and judges treat these stipulations as binding. At the same time, witnesses swear an oath to tell the truth, perjury statutes punish false statements made under oath, and plea bargains allow conviction without any court ever establishing what actually happened. So the institution simultaneously treats truth as a correspondence that must be enforced under penalty and as something that can be bracketed by mutual agreement or procedural efficiency. What theory of truth does this design presuppose? Is it Peircean—truth as the ideal limit of inquiry, with stipulations being merely temporary practical concessions—or Jamesian—truth as what works in experience, with the oath functioning as a useful reliability tool rather than a correspondence claim? Or does the practice presuppose a hybrid: a private realm of belief governed by correspondence and a public legal realm governed by warranted assertibility? Reconstruct the implicit theory, distinguish what the practice strictly requires from what merely fits it, say whether its parts are philosophically consistent, and describe what courtroom procedure would have to change if the underlying view were replaced by a strict correspondence theory that banned all stipulations and required every conviction to rest on independently established fact. Keep your answer to a single paragraph of no more than 300 words.
