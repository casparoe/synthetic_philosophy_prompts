          *   *Verdict:* Yes, it's including the sampling mechanism. If you ignore it, you compare $P(D|M)$ instead of $P(D|M, E)$.
      *   *No-New-Evidence Corollary:* We knew $E$ (existence) before measuring $D$ (constants).
          *   *Statistical Analogue:* Reusing data / Double dipping / Selective Inference. If $E$ is background info $I$, then $P(E|M, I) = 1$. The update comes from $D$. But if $D$ was chosen *because* it supports the theory (looking at the data to define the "life-permitting" region), that's $p$-hacking or selective inference.
