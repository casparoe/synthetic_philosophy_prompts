          That point about the backward producers anchoring social value when automation generalises is the strongest shot you've taken; it forces the contradiction into the open rather than hiding it in sectoral differentials. But you mistake the consequence. If the whole economy is automated, value production ceases, and capitalism stops functioning *because* profit disappears, not because it morphs into rent. Capital isn't a machine for making goods; it's a social relation for expanding value. No labour, no expansion. The "loop" you describe couldn't sell at prices of production yielding average profit because there's no surplus value to constitute that profit.

