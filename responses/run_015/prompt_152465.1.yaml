          *   Paragraph 2: Prices vs. Value. Prices don't float free. They sum to values. If total value drops, total price mass must adjust via crisis/deflation/devaluation.
          *   Paragraph 3: Rent. Rent is a share of $s$. No $s$, no rent sustainable long term. It becomes fictitious capital.

      *   *Refining the Arithmetic:* Let $c$ be constant capital, $v$ variable, $s$ surplus. Rate of profit $p' = s / (c+v)$. If automation drives $v \to 0$, then $s \to 0$ (assuming rate of exploitation $s/v$ doesn't go to infinity). Thus $p' \to 0$.
