  You're describing the endpoint of capital, not its renewal. If living labour vanishes, surplus value vanishes, because surplus value is just unpaid labour time. Do the arithmetic: if $v$ goes to zero, $s$ goes to zero, so the rate of profit $s/(c+v)$ crashes to zero regardless of the mass of constant capital piled up. You say prices stay put, but prices of production are just redistributed values; if the aggregate surplus value pool is empty, there's nothing to redistribute as profit. What you call rents are merely claims on a shrinking mass of value, which triggers a violent devaluation of that constant capital you're so proud of.

  That point about the backward producers anchoring social value when automation generalises is the strongest shot you've taken; it forces the contradiction into the open rather than hiding it in sectoral differentials. But you mistake the consequence. As Marx argues in the third volume on the formation of a general rate of profit, the sum of prices equals the sum of values. If the total value produced is zero because no labour is employed, the total profit must be zero. Capital isn't a machine for making goods; it's a social relation for expanding value. No labour, no expansion. The loop you describe couldn't sell at prices of production yielding average profit because there's no surplus value to constitute that profit.

  So inside the loop, what happens is crisis, not stability. Capitalists won't invest in machines that don't promise a return derived from exploitation. If they try to charge monopoly prices without value backing, they're just circulating fictitious capital until the credit system snaps. You say automation relocates rents; I say it destroys the substrate rent is deducted from. The system doesn't reach your fully automated utopia because it chokes on its own success long before, forcing a devaluation of capital to restore profitability. That's the crisis tendency, not a bug.
