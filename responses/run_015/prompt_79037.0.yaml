      *   *Key Insight:* The tension isn't just about belief; it's about the *cost* of error in different contexts. The Bookkeeper case introduces pragmatic encroachment implicitly.

      *(Self-Correction during drafting)*: Make sure to explicitly state *what would move a project up or down*.
      *(Self-Correction on Readings)*: Don't just accept one. Explain how the agenda tests them.
      *(Self-Correction on Bookkeeper)*: Ensure I answer "Is any rational filing available?"

      *Let's settle the Bookkeeper answer:* If filing = believing, and regulation = closure + consistency, and evidence = LP structure -> No rational filing exists. The fault lies with the regulation (it demands logical omniscience/consistency incompatible with fallible evidence) or the assumption (filing $\neq$ believing). The agenda should focus on decoupling them.

      *Final Plan:*
      1.  Define EV Weights (Upstream 0.5, Tractability 0.3, Neglect 0.2).
      2.  Evaluate Readings: (iii) is highest EV but riskiest. (ii) is best intermediate. (i) is lowest EV (over-mined).
      3.  Agenda Item 1: Norms of Belief Aggregation (Fragmentation access).
      4.  Agenda Item 2: Inquiry Termination vs. State Ownership.
