      I will recommend an agenda that uses (ii) to test (iii), while keeping (i) as a control.

      *Bookkeeper:* The regulation forces a "State" view (filing is a static record). If belief is "Inquiry" (Reading iii), filing is premature. If belief is "Fragmented" (Reading ii), filing the whole ledger is impermissible.
