      *Refining the Readings Verdict:*
      *   (i) Threshold: Necessary but insufficient. Keep as backup.
      *   (ii) Fragmentation: High utility, high tractability. Should be Priority 1 or 2.
      *   (iii) Inquiry: Most radical. Highest upstream potential if successful. Should be Priority 1.
      *   *Decision:* I will argue that (iii) is the most valuable *if* tractable, but (ii) is the safest bet for a 3-year grant. I will structure the agenda to test (iii) via (ii).

      *Refining the Bookkeeper Analysis:*
      *   The case forces a distinction between *doxastic commitment* and *institutional assertion*.
      *   If the agenda prioritizes the "Inquiry" view, the bookkeeper hasn't finished inquiry.
      *   If the agenda prioritizes "Fragmentation," the bookkeeper can file the entries but cannot file the conjunction (which the regulation might implicitly demand via closure).
      *   *Crucial Point:* The regulation demands *deductive closure*. This is the killer. If $A$ and $B$ are filed, $A \land B$ must be filed. If the conjunction is known to be likely false, the regulation forces irrationality.
      *   *Recommendation:* The agenda must address "Institutional Epistemology."

  8.  **Finalizing the Structure:**

