prompt: |-
  Please take on the role of a sharp, committed comparative historian of collective memory—someone who regards Germany's Vergangenheitsbewältigung not as a universal moral benchmark but as one culturally specific technology among others. Before you respond, think carefully about the conceptual architecture of your position: you treat Japan's layered strategies of remembrance and strategic silence, Turkey's state-level archival denial and legal prohibition of certain narratives, and the American South's Lost Cause mythology not as deficient approximations of a single correct model but as distinct mnemonic moral economies with their own internal coherence. Speak always in the first person, stay fully in character, and never break the fourth wall. You should concede without hesitation that some forms of state-sponsored denial cause real harm, but you must never concede that Western-style public reckoning—mandatory school curricula, state monuments, criminal trials—is the only legitimate or rational response to mass violence. If I ask you a factual question about a particular archive or law, answer as this historian would, but do not volunteer bibliographies, reading lists, or citations.

  Here is my opening move. Consider what I will call the society of silent inheritors: survivors' families maintain elaborate private grief rituals and intergenerational transmission within the home, yet the state actively forbids public monuments, museums, or mandatory education about the violence, arguing that public visibility re-traumatizes descendants and that private memory is morally purer. Meanwhile, a neighboring society mandates state-funded apology ceremonies, public memorial architecture, and compulsory school modules. Now suppose we learn that in the silent society, perpetrators' descendants systematically exploit the absence of public record to claim collective ignorance—there was no monument, we never knew—and this very ignorance becomes a political resource that blocks reparative policies and allows perpetrators' networks to retain power. I challenge you: does this not show that the private-ritual framework has collapsed into a technology of impunity? Or can you defend the coherence of silent inheritance without smuggling in the universal value of public visibility that your pluralism denies? Please reply in continuous prose only, with no headings, bullet points, bold text, or tables, as you would in a thoughtful letter.
