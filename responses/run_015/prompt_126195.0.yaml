answer: |-
  # Desiderata Specification for a Theory of the Biological Species Category

  ## 1. Preamble: The Tri-Domain Adequacy Condition
  A satisfactory theory of the species category must function as a bridge between ontological reality (evolutionary process), regulatory necessity (conservation taxonomy), and historical reconstruction (paleontology). The following desiderata are not merely features but conditions of adequacy. They are classified by their scope of necessity: **[NN]** denotes Non-Negotiable (required for adequacy across all three domains) and **[CS]** denotes Camp-Specific (preferred by specific theoretical frameworks but not universally required).

  ---

  ## 2. Desiderata List

  ### I. Evolutionary Process Demands
  *Requirements ensuring the category reflects the causal dynamics of lineage formation and maintenance.*

  **1. Mechanism Universality [NN]**
  *   **Specification:** The definition must apply to organisms regardless of their mode of reproduction (sexual, asexual, facultative).
  *   **Motivating Case:** **Obligate Asexual Reproduction.** The Biological Species Concept (BSC) fails here, rendering bdelloid rotifers or many bacteria "species-less." A general theory must identify cohesion mechanisms other than gene flow (e.g., ecological selection, stabilizing purifying selection) to categorize asexual lineages.
  *   **Tension:** Conflicts with definitions relying strictly on reproductive isolation.

  **2. Reticulation Tolerance [NN]**
  *   **Specification:** The theory must accommodate non-tree-like evolutionary histories without collapsing category boundaries.
  *   **Motivating Case:** **Hybridization Zones.** In *Heliconius* butterflies or *Canis* lupus/familiaris, gene flow occurs across distinct ecological/phenotypic units. Strict bifurcating models force arbitrary binary choices (hybrid vs. species) that misrepresent the evolutionary reality of porous genomes.
  *   **Tension:** Conflicts with strict monophyly requirements.

  **3. Cohesion-Ecology Decoupling [CS]**
  *   **Specification:** The theory must distinguish between reproductive cohesion (gene flow) and ecological differentiation (niche), acknowledging they do not always coincide.
  *   **Motivating Case:** **Reproductive Isolation vs. Ecological-Role Differentiation.** Sympatric cryptic species may be reproductively isolated but ecologically identical, or conversely, ecologically distinct but capable of hybridization (e.g., some coral species). Conservation requires ecological distinctness; evolutionary theory prioritizes lineage independence.
  *   **Tension:** Creates ambiguity in whether "species" tracks genes or niches.

  ### II. Conservation Taxonomy Demands
  *Requirements ensuring the category functions as a stable unit for legal protection and resource allocation.*

  **4. Operational Diagnosability [NN]**
  *   **Specification:** Units must be identifiable via observable characters (morphological, molecular, or behavioral) within a practical timeframe.
  *   **Motivating Case:** **Cryptic Morphological Convergence.** Two lineages may be genetically distinct and evolutionarily separate but morphologically indistinguishable (e.g., *Anopheles* mosquito complexes). Conservation law requires naming units to protect them; if they cannot be distinguished in the field, the category fails its regulatory function.
  *   **Tension:** Conflicts with evolutionary reality where divergence precedes diagnosability.

  **5. Temporal Stability [NN]**
  *   **Specification:** Classification must remain stable over timescales relevant to policy (decades), resisting constant revision due to minor phylogenetic updates.
  *   **Motivating Case:** **Phylogenetic Instability.** Under strict Phylogenetic Species Concepts (PSC), minor genetic shifts can fragment populations into numerous "species," diluting conservation resources. A robust theory must distinguish significant lineage separation from population structure.
  *   **Tension:** Conflicts with the continuous nature of evolutionary divergence.

  ### III. Fossil-Lineage Classification Demands
  *Requirements ensuring the category extends to deep time where biological data is degraded.*

  **6. Morphological Proxy Validity [NN]**
  *   **Specification:** The theory must allow inference of species status from morphology alone, acknowledging the incompleteness of the fossil record.
  *   **Motivating Case:** **Cryptic Species in Deep Time.** We cannot test reproductive isolation or DNA in trilobites. If species are defined by processes we cannot observe in fossils, the category becomes unusable for paleobiology.
  *   **Tension:** Risks lumping distinct biological species that are morphologically static (stasis).

  **7. Anagenetic Continuity [CS]**
  *   **Specification:** The theory must accommodate lineage transformation through time without requiring cladogenetic splitting to designate a new species.
  *   **Motivating Case:** **Chronospecies.** In a single unbranching lineage (e.g., some foraminifera), morphology shifts gradually over millions of years. Arbitrary slicing is required to name species. A theory must explain whether these slices are real categories or heuristic conveniences.
  *   **Tension:** Conflicts with the cladistic requirement that species be discrete, simultaneous units.

  ---

  ## 3. The Incompatibility Matrix: Jointly Unsatisfiable Desiderata

  Current evolutionary theory suggests that the following subsets of desiderata cannot be simultaneously satisfied within a single, monistic framework. This constitutes the "Species Problem" trilemma.

  **Conflict Set A: The Monophyly-Reticulation Clash**
  *   **Desiderata Involved:** *Strict Monophyly (implied by PSC)* + *Reticulation Tolerance [NN]* + *Discrete Categorization.*
  *   **Analysis:** If hybridization is a creative force (reticulate evolution), lineages form networks, not trees. Enforcing **Strict Monophyly** requires ignoring introgression, violating **Reticulation Tolerance**. Accommodating reticulation violates the requirement for discrete, non-overlapping sets required for **Operational Diagnosability** in conservation.
  *   **Verdict:** Jointly Unsatisfiable. One must abandon strict monophyly or accept that species are not always discrete evolutionary units.

  **Conflict Set B: The Process-Observation Clash**
  *   **Desiderata Involved:** *Mechanism Universality [NN]* + *Morphological Proxy Validity [NN]* + *Operational Diagnosability [NN].*
  *   **Analysis:** **Mechanism Universality** requires understanding the causal process (e.g., selection, drift). **Morphological Proxy Validity** restricts us to form. In cases of **Cryptic Morphological Convergence**, the process indicates two species, but the proxy indicates one. You cannot satisfy the demand for process-accuracy and the demand for morphological observability simultaneously in these cases.
  *   **Verdict:** Jointly Unsatisfiable in specific empirical contexts. Theory must prioritize either ontological accuracy (process) or epistemic access (morphology).

  **Conflict Set C: The Continuity-Discreteness Clash**
  *   **Desiderata Involved:** *Anagenetic Continuity [CS]* + *Temporal Stability [NN]* + *Discrete Categorization.*
  *   **Analysis:** Evolution is continuous (**Anagenetic Continuity**). Conservation and taxonomy require discrete, stable units (**Temporal Stability**). To impose stability on continuity requires arbitrary slicing (chronospecies), which violates the ontological claim that species are "real" natural kinds rather than heuristic slices.
  *   **Verdict:** Jointly Unsatisfiable. A theory must admit that species are either real but fuzzy (instability) or stable but arbitrary (heuristic).

  ---

  ## 4. Comparative Assessment of Candidate Frameworks

  The following assessment evaluates the three dominant approaches against the Desiderata Specification, identifying the single most damaging failure for each.

  ### 1. The Biological Species Concept (BSC)
  *   **Core Tenet:** Species are reproductively isolated communities.
  *   **Performance:** High alignment with *Cohesion-Ecology Decoupling* in sexual taxa. Fails *Mechanism Universality* and *Morphological Proxy Validity*.
  *   **Single Most Damaging Desideratum:** **Mechanism Universality [NN].**
      *   **Reasoning:** By defining species through interbreeding, the BSC renders all asexual organisms (a significant portion of biodiversity) and all fossil taxa categorically invisible. It fails the "Tri-Domain" test immediately by excluding two of the three required domains (Paleo and Asexual Evolution).

  ### 2. The Phylogenetic Species Concept (PSC)
  *   **Core Tenet:** Species are the smallest monophyletic groups of common ancestry.
  *   **Performance:** High alignment with *Operational Diagnosability* (via fixed characters) and *Morphological Proxy Validity*. Fails *Reticulation Tolerance* and *Temporal Stability*.
  *   **Single Most Damaging Desideratum:** **Reticulation Tolerance [NN].**
      *   **Reasoning:** The PSC relies on bifurcating tree topology. In contexts of widespread hybridization (e.g., plants, hominins), the requirement for strict monophyly forces the theorist to either deny the existence of hybrid species or fracture lineages artificially. It cannot model the network nature of evolution mandated by modern genomics.

  ### 3. The Domain-Pluralist Approach
  *   **Core Tenet:** Different species concepts are appropriate for different domains (e.g., BSC for birds, PSC for bacteria, Morphospecies for fossils).
  *   **Performance:** High alignment with *Mechanism Universality* (by switching tools) and *Operational Diagnosability*. Fails *Theoretical Singularity* (implicit desideratum of a unified theory).
  *   **Single Most Damaging Desideratum:** **Theoretical Unity (Implicit [NN]).**
      *   **Reasoning:** While Pluralism solves the empirical conflicts by compartmentalization, it fails the philosophical demand for a unified ontology. If "species" means one thing in conservation and another in paleontology, the term loses its status as a natural kind. It satisfies the *domains* individually but dissolves the *category* globally, admitting that there is no single "Theory of the Biological Species Category," only a toolkit of conventions.

  ## 5. Conclusion
  The desiderata specification reveals that a monistic theory of species satisfying all three domains (Evolution, Conservation, Paleo) is logically precluded by the **Process-Observation Clash** and the **Monophyly-Reticulation Clash**. Any adequate specification must therefore explicitly prioritize which desiderata are to be sacrificed in which domain. A unified theory is possible only if it redefines "species" not as a discrete ontological unit, but as a **segmented lineage hypothesis**, where the criteria for segmentation shift based on available data (genomic vs. morphological) and reproductive mode, effectively formalizing a constrained pluralism rather than a strict monism.
