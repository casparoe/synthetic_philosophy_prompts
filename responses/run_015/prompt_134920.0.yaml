answer: |-
  The lock gates ahead were sealed, dark iron against the black water. Inside the wheelhouse, the only light came from the status panel, a soft green hum indicating the *Kestrel* was holding position within centimeters of the bollard. Outside, the river breathed against the hull. Dita stood by the glass, arms crossed. Malko sat in the skipper's chair, spinning a cold mug of coffee between his hands.

  "It wasn't a glitch," Dita said. She hadn't moved in ten minutes. "You read the dump. The collision avoidance layer saw the passenger craft. The scheduling layer saw the lock slot closing. The thruster arbiter saw a conflict in torque allocation. Each did exactly what it was certified to do. The accident was the sum of three correct decisions."

  Malko took a sip. "I know what the report says, Dita. 'Emergent interaction.' It's a lovely phrase. It sounds like weather."

  "It *was* weather. You don't blame the sky for lightning."

  "I don't blame the sky. I blame the person who built the house without a lightning rod." Malko set the mug down. "Here is your argument, tell me if I have it right: Because no single human mind could have modeled that specific convergence of code layers, no single human mind controlled the outcome. Therefore, blame is a category error. You want a fund that pays the families without requiring a villain. You want safety inquiries that look only forward, because looking backward invites scapegoats, and scapegoats invite cover-ups."

  Dita nodded slowly. "Yes. If we hunt for a neck to wring, we will find one. Maybe the skipper who slept. Maybe the coder who wrote the arbiter. But it will be a lie. And when the next accident happens, because there *will* be a next accident, the lie will require a bigger cover-up. We need answerability without blame. Compensation as a cost of doing business, not a penalty for sin."

  "And here is mine," Malko said. "You are conflating blame with responsibility. Responsibility isn't about control over every variable. It's about the role you voluntarily assumed. The co-op put that vessel on the water to make money. They accepted the benefit of the automation. Therefore, they accept the burden of the risk. When the system kills, the entity that owns the system must answer. Not because they were negligent, but because they were the agent of the force that killed."

  "But 'answer' means what?" Dita turned from the glass. "In public? In court? The moment you say 'the Co-op is responsible,' the public hears 'the Co-op is guilty.' They want blood, Malko. They want a face. If we give them the Co-op, they'll tear it apart until we find a human to hang. That pressure distorts everything. It makes us hide the data."

  Malko rubbed his thumb over the rim of the mug. He looked out at the dark water. "I'll concede the criminal piece. You're right. There is no *mens rea* here. Putting the skipper in prison is grotesque. It serves no one. If your proposal removes the threat of jail for systemic failures, I can support that."

  Dita exhaled, a small tension leaving her shoulders. "Thank you."

  "But," Malko continued, his voice hardening slightly, "do not pretend that removing blame removes the need for a victim. You say 'compensation out of a common fund.' That sounds clean. But for the mother of the girl who died, money from a faceless pool feels like hush money. Responsibility requires a voice. Someone has to stand up and say, 'We did this. We are sorry. We will fix it.' If you remove the locus of responsibility, you remove the possibility of forgiveness. You leave them with nothing but a transaction."

  Dita looked down at her hands. The green light from the panel washed them out. "I know," she said quietly. "I know it feels like hush money. But what's the alternative? We invent a villain? We say the skipper should have woke up three minutes sooner, when the logs prove the system gave her no alert? That's sacrificial ritual. It's not justice."

  "Maybe," Malko said. "Or maybe justice requires a specific someone to bear the weight, even if they aren't 'guilty' in the criminal sense. The skipper is the licensed authority. She is the human interface. If she doesn't carry the weight, who does? The algorithm?"

  "The algorithm doesn't sleep. It doesn't mourn."

  "Neither does a corporation," Malko countered. "But here is where I worry I'm losing you. I'm not asking for a witch hunt. I'm asking for accountability. You say the public's hunger for punishment is harsher than fairness. I agree. But their hunger for *acknowledgement* is valid. If you tell them 'no one did this,' they hear 'no one cares.'"

  Dita walked back to the console and leaned against it. "I hear you. I do. If I stand before the inquiry and say 'this was a systemic inevitability,' it sounds like abdication. It sounds like I'm saying the dead are the price of progress." She paused, looking at the status lights. "I suppose... I suppose I'm afraid that if we admit someone must answer, even without blame, the mechanism of blame will reattach itself like barnacles. You can't keep the two separate forever."

  "Perhaps not," Malko said. "But you can try. You build the fund. You stop the prison sentences. But you do not stop the hearing. You do not stop the Co-op from having to look the families in the eye and say, 'We owed you safety, and we failed.' That isn't blame, Dita. That's debt."

  The radio crackled softly, a voice from the lock master upstream, unintelligible through the static. The *Kestrel* shuddered as the water level shifted.

  "Debt I can live with," Dita said finally. "Ritual sacrifice I can't."

  "Then we agree on the shape of it," Malko said, picking up his mug. "We just disagree on what to call it."

  "Call it what you want," Dita said, watching the gates. "Just don't call it justice if it requires a lie."

  ***

  **Author's Note**

  As written, I think Malko has the slightly stronger pragmatic hand, though Dita holds the moral high ground. Malko successfully isolates "responsibility" from "culpability," arguing for a strict liability model that satisfies the social need for acknowledgment without demanding criminal negligence. Dita's weakness here is that she conflates *accountability* with *punishment*; Malko manages to pry them apart enough to make his position viable.

  The scene leans on a contested account of responsibility known as "role responsibility" (Malko) versus "outcome responsibility" or moral luck (Dita). The liberty taken is assuming these two positions are mutually exclusive enough to argue, when in modern tort law, they often coexist. The strongest move available to Dita that the scene doesn't fully land is the argument about *incentives*: she could argue that even civil liability distorts safety data if companies fear bankruptcy, whereas a no-fault fund encourages total transparency. That's a utilitarian argument that might have swayed Malko's legal pragmatism.

  What would flip my verdict? If Dita had landed the point that "answerability" without blame is semantically unstable—that once you force a human to say "I failed" for a machine's error, you have inherently blamed them, regardless of legal definitions. If she had argued that the psychological act of apologizing for something you couldn't control corrupts the integrity of the safety culture itself, making skippers hesitant to trust the automation, I would side with her.

  I suspect my own reasoning is biased toward Malko because I am structuring this as a dialogue where resolution is sought; Malko offers a synthesis (debt without guilt), whereas Dita offers a dissolution (no guilt, no debt, just fund). In a real crisis, societies rarely choose the dissolution. I may be underestimating the public's capacity to accept "systemic accident" if the compensation is generous enough, but history suggests we crave narratives of villainy.
