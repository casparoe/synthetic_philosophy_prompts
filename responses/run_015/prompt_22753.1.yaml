          1.  If math is just unpacking definitions (nominalism), isn't it trivial/empty (tautological)?
          2.  If it's just definitions, how does it apply to the real world (surveying, building)?
          3.  How does he handle idealized objects (lines with no width) that can't exist physically?
      *   **Goal:** Clarify Hobbes's position, explain *why* he thinks this way, and address the tension between "just definitions" and "real-world utility."

  2.  **Deconstruct Hobbes's Position on Geometry:**
      *   *Context:* Hobbes was a materialist and a nominalist. He believed only bodies exist. Universal concepts (like "triangle") are just names we give to groups of similar things.
      *   *The Nature of Proof:* For Hobbes, reasoning is computation (*computatio*). It's adding and subtracting names/concepts. A proof demonstrates the necessary connection between the names we've assigned.
      *   *The "Truth" of Geometry:* Geometric truths are true *because* we made them so. We define the terms. Unlike physics (where we observe nature), in geometry, we construct the objects of study.
      *   *Application to Reality:* This is the crux. If it's just names, why does it work on land? Hobbes argues that while the *perfect* line doesn't exist, the *reasoning* holds for physical approximations because the causal principles (motion, extension) are the same.
