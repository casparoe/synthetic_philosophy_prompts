      *   **Role:** Philosopher of action specializing in weakness of will (akrasia) and intertemporal choice.
      *   **Task:** Provide a specification (list of requirements) for a theory of weakness of will that can adjudicate a specific fictional case.
      *   **The Case:** A character fails to write a novel. She never acts against a current judgment (each evening she judges "tomorrow" is better). She never abandons the plan. It's not compulsion, addiction, self-deception, or simple preference reversal. It's a "failure to write" accused as "weakness."
      *   **Constraints:**
          *   Distinguish weakness from compulsion/addiction, self-deception, preference reversal, and mere neglect.
          *   Do not require an occurrent better judgment at the moment of action (Socratic constraint violation allowed).
          *   Acknowledge present-bias/preference reversal/binding.
          *   Identify non-negotiable vs. school-specific requirements.
          *   Identify tensions/incompatibilities between requirements.
          *   Evaluate families of accounts (Judgment-based, Desire-based, Plan-based).
