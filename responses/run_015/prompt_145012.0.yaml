prompt: |-
  Eight months ago I was appointed as one of the two lay members of the clinical ethics committee at a large teaching hospital, and I have been asked to run a forty-five minute session for the committee on how we ought to reason when we cannot settle which moral framework is the right one. Our live docket is whether to fund one more place on a very expensive therapy that produces a large benefit for a single patient, or to spend the same money on a change to discharge and follow-up procedures that produces a very small benefit for a very large number of patients. I have to write the recommendation, so this is not academic for me.

  The committee is thirteen people: five physicians, two nurses, a hospital lawyer, a chaplain, a health economist, two lay members and the chair. Nobody has any philosophy training, and several are openly impatient with anything that will not change what we do on Monday. I have a whiteboard and a single one-page handout I will write from your plan, and I do not want to hand out or cite any readings.

  Do not explain the topic to me. Give me a plan for explaining it, covering the following.

  The order the ideas must come in, and for each step what it depends on in the previous step: in particular, where the distinction between uncertainty about the facts and uncertainty about the framework has to be introduced, and why it cannot wait until later.

  The one case that should carry the whole session, built from our docket. Tell me how to construct it so that three frameworks genuinely come apart on it — an aggregating one, one that gives priority to the worst off, and one that treats certain side-constraints as not tradeable at all — and tell me what the case must be stripped of. My instinct is to remove every bit of empirical uncertainty, so that nothing in the disagreement is about how the world is, and also to remove any vividly described named patient; tell me if the second removal is a mistake.

  The misconceptions, in the order the committee will form them, and the exact point in the sequence at which each should be headed off. I anticipate these: that the middle option is the neutral or fair response; that one should average the frameworks' verdicts the way one would average two experts' probability estimates; that uncertainty about which framework is correct is just another empirical uncertainty and so expected-value reasoning settles it in the obvious way; and that if the frameworks cannot be ranked, any decision is arbitrary and we should simply vote. Say which ones I should let surface before answering, and which would poison the rest of the hour if voiced early.

  The hardest thing I need them to see: that the frameworks may not share a scale, so that "how much better is this than that, according to framework one" is not automatically comparable to the same question for framework two, and that our answer on the docket may shift depending on how the scales are lined up. Where in the arc must this go, what has to be in place before it can be said without baffling people, and how do I present it so it does not read as a licence to do whatever we liked anyway?

  One thing I should openly refuse to explain at this level, announcing that I am not explaining it. My instinct is that it should be how weights get assigned to the frameworks in the first place, but tell me if something else is the better omission.

  A check I can run in the last five minutes that distinguishes understanding the structure from having learned my vocabulary. I would like it to be a new case with the property that the compromise action is ranked last, or near last, by every framework on the table, so that someone who has grasped the point refuses to split the difference and someone who has not does it confidently.

  Finally, one complication I want handled rather than set aside: our uncertainty is not only inside each person's head. Different members are confident in different frameworks and will not change their minds in an hour, so for us the question is as much what a body should do when its members' moral convictions differ as what an individual should do when their own do. Tell me whether to build the session around the individual case and translate at the end, or to run both from the outset, and what is lost either way.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the Request:**
      *   **User:** Lay member of a clinical ethics committee (CEC) at a teaching hospital.
      *   **Task:** Run a 45-minute session on reasoning under moral framework uncertainty.
      *   **Context:** Live docket involves funding one expensive therapy (large benefit, one patient) vs. discharge procedure change (small benefit, many patients).
      *   **Audience:** 13 people (clinicians, lawyer, chaplain, economist, lay members, chair). No philosophy training. Some impatient with theory.
      *   **Constraints:** Whiteboard + one-page handout. No readings/citations. Do not explain the topic to the user (they know it).
      *   **Required Elements:**
          1.  Order of ideas & dependencies (specifically fact vs. framework uncertainty).
          2.  The One Case (constructing it to separate three frameworks: aggregating, prioritarian, deontological/constraint-based). Empirical uncertainty removal? Named patient removal?
          3.  Misconceptions (order of appearance, when to head off, which to let surface).
          4.  The Hard Thing (incommensurability of scales). Placement and presentation.
          5.  The Refusal (what *not* to explain).
          6.  The Check (last 5 mins, new case where compromise is worst).
          7.  The Complication (individual vs. committee uncertainty).

  2.  **Deconstruct the Required Elements & Draft the Plan:**

      *   **1. Order of Ideas:**
          *   Need to start with the *problem*, not the theory.
          *   Must distinguish factual uncertainty from moral uncertainty *early*. If we don't, people will try to solve moral disagreement by gathering more data (e.g., "how much *exactly* does the discharge help?").
          *   Flow: The Docket -> The Impasse -> Fact vs. Moral Uncertainty -> The Three Lenses -> Incommensurability -> Decision Procedure -> Committee Application.

      *   **2. The One Case:**
          *   *Goal:* Make Utilitarianism (Aggregating), Prioritarianism (Worst Off), and Deontology (Constraints) diverge.
          *   *Current Docket:* 1 expensive therapy (large benefit) vs. Discharge change (small benefit, many patients).
          *   *Problem:* This looks like Cost-Effectiveness Analysis (CEA). Economists love this. It doesn't naturally trigger Deontology unless there's a rights violation or promise breaking.
          *   *Modification:* Need to tweak the "Expensive Therapy" option. It shouldn't just be "expensive." It needs to involve a *claim* or a *right* or a *rescue*. Let's make it a "Rescue" case vs. "Statistical Lives."
          *   *Frameworks:*
              1.  Aggregating (Utilitarian/CEA): Maximize total QALYs. Choose discharge change.
              2.  Prioritarian (Worst Off): The single patient is dying/destined for severe disability without therapy. The many are just slightly uncomfortable. Choose therapy.
              3.  Deontological (Constraint): Maybe the therapy was *promised* or there's a rule against "abandoning" identified patients. Or, conversely, the discharge change violates a duty of care to the many. Let's go with the "Identifiable Victim" constraint or a "Rule against letting die vs. letting suffer." Actually, to make it a *constraint*, it needs to be something like "We cannot deny a treatment that sustains life to an identified patient currently under care to fund systemic tweaks."
          *   *Empirical Uncertainty:* Yes, remove it. Make the outcomes certain. If outcomes are fuzzy, people argue about the numbers, not the ethics.
          *   *Named Patient:* The user asks if removing the name is a mistake. *Verdict:* Yes, keep the "identifiability" but remove the *name*. The psychological pull of the "identifiable victim" is part of the moral intuition we are testing. If it's purely abstract "Patient A," the deontological/rescue intuition weakens. Keep it vivid but anonymous.
          *   *Stripping:* Remove cost differences (stipulate costs are identical). Remove clinical uncertainty (outcomes are guaranteed).

      *   **3. Misconceptions:**
          *   *List:*
              1.  Middle option = Fair/Neutral.
              2.  Averaging frameworks like expert probabilities.
              3.  Moral uncertainty = Empirical uncertainty (Expected Value).
              4.  Inability to rank = Arbitrary/Vote.
          *   *Timing:*
              *   "Middle option is fair" usually comes when proposing solutions. Let it surface early to show why it fails later.
              *   "Moral uncertainty = Empirical" is the most dangerous. It needs to be headed off *immediately* after introducing the distinction between fact and framework. If they think they can just assign probabilities to moral truths and calculate EV, the rest of the session is useless.
              *   "Averaging frameworks" comes when discussing how to combine views. Head off before the "Hard Thing" (incommensurability).
              *   "Arbitrary/Vote" comes at the end. Let it surface as the despair conclusion, then offer the alternative.
          *   *Poison:* The "Expected Value" misconception is the poison. It shuts down the need for a specific meta-ethical approach.

      *   **4. The Hard Thing (Incommensurability):**
          *   *Concept:* Framework A measures in "Total Welfare," Framework B measures in "Rights Violations." You can't add them.
          *   *Placement:* After the frameworks are defined but *before* discussing how to decide.
          *   *Prerequisite:* They must understand that the frameworks aren't just estimating the same number with different error margins.
          *   *Presentation:* Use the whiteboard. Draw two different y-axes. Don't call it "incommensurability" (jargon). Call it "Different Scorecards."
          *   *Avoiding License:* Emphasize that *we* still have to choose the exchange rate, but we must admit we are choosing it, not discovering it.

      *   **5. The Refusal:**
          *   *User's Instinct:* How weights get assigned to frameworks.
          *   *Analysis:* This is correct. If you try to explain how to weight utilitarianism vs. deontology, you enter meta-ethics hell. You need to stop at "We need a procedure to weigh them," not "Here is the correct weight."
          *   *Alternative:* Maybe refuse to explain how to resolve the committee vs. individual distinction? No, that's the final complication. Stick with the weights. It's the "Meta-Meta" problem.

      *   **6. The Check (Last 5 Mins):**
          *   *Requirement:* New case. Compromise action is ranked last by *all* frameworks.
          *   *Case Idea:* Trolley problem variant? No, too abstract. Clinical.
          *   *Scenario:* A drug has a 50% chance to cure completely, 50% chance to kill immediately.
          *   *Options:*
              1.  Give Drug (High risk/High reward).
              2.  Palliative Care (Safe, death eventually).
              3.  Compromise: Give Half-Dose (Guarantees prolonged suffering, no cure, no quick death).
          *   *Frameworks:*
              *   Aggregating: Half-dose wastes resources for no gain.
              *   Prioritarian: Half-dose leaves patient in worst state (suffering).
              *   Constraint: Half-dose might violate "do no harm" without the justification of cure.
          *   *Better Idea:* Resource allocation.
              *   Option A: Save 1 child (Cost $100k).
              *   Option B: Save 10 adults (Cost $100k).
              *   Option C (Compromise): Spend $50k on child (fails), $50k on adults (fails). Everyone dies.
              *   *Critique:* Too obvious.
              *   *Refinement:* We need a compromise that *actively* makes things worse or satisfies no one's principle.
              *   *Case:* Triaging two patients for one ICU bed.
                  *   Patient A: Young, high survival chance.
                  *   Patient B: Old, low survival chance, but currently on the ward (duty of care?).
                  *   Option 1: Give to A (Utilitarian).
                  *   Option 2: Give to B (Prioritarian/Duty).
                  *   Option 3: Split the time/resources equally. Both die.
              *   *Why it works:* Splitting ensures the worst outcome (two deaths vs one). Every framework prefers a decisive choice over the "fair" split that kills both.
              *   *Test:* If they say "Split it," they missed the point.

      *   **7. The Complication (Individual vs. Committee):**
          *   *Analysis:* If you start with "Committee," it gets political too fast ("I represent the nurses"). If you start with "Individual," it's cleaner reasoning, then scale up.
          *   *Strategy:* Run the reasoning as if it were an individual agent first (cleaner logic), then translate in the last 10 minutes to "How do we vote/consensus?"
          *   *Loss:* You lose the dynamic of negotiation. But you gain clarity on the *structure* of the disagreement.
          *   *Decision:* Build around the individual case, translate at the end. It prevents the session from becoming a procedural debate about voting rules before they understand the moral stakes.

  3.  **Refining the Plan (Self-Correction/Polishing):**
      *   *Tone:* Direct, instructional, no fluff.
      *   *Handout:* Needs to be described as part of the plan.
      *   *Timing:* 45 mins is tight. Need strict timeboxes.
      *   *Fact vs. Framework:* Make sure this is Step 2. Step 1 is the Case.
      *   *Named Patient:* I need to be firm. Removing the "identifiable" aspect kills the deontological intuition. Keep the *story*, lose the *name*.
      *   *Incommensurability:* Use the "Temperature vs. Weight" analogy or "Apples vs. Oranges" but stricter. "Different Rulers."
      *   *Refusal:* Confirm the "Weights" refusal is the right one. Yes, because assigning weights *is* the decision procedure we are trying to design, not a premise we can assume.

  4.  **Final Review against Constraints:**
      *   Do not explain the topic to me? (Check. I am giving the plan, not lecturing on moral uncertainty).
      *   Order of ideas? (Check).
      *   One Case? (Check).
      *   Misconceptions? (Check).
