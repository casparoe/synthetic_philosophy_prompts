answer: |-
  **Session Plan: Moral Uncertainty in Committee Decision-Making**
  **Time:** 45 Minutes
  **Materials:** Whiteboard, One-Page Handout (Decision Matrix).

  ### 1. Order of Ideas and Dependencies

  1.  **The Live Docket (0–5 mins):** Present the refined case (see Section 2). Do not define terms yet. Ask for a show of hands: Therapy, Discharge, or Neither? Expect a split.
  2.  **Fact vs. Framework Uncertainty (5–10 mins):**
      *   *Dependency:* Requires the disagreement from Step 1 to be visible.
      *   *Action:* Draw a line on the whiteboard. Left side: "What will happen?" (Facts). Right side: "What matters?" (Frameworks).
      *   *Crucial Move:* Stipulate that all clinical outcomes, costs, and probabilities in the case are **known and certain**.
      *   *Why Now:* If you wait, clinicians will try to solve the moral disagreement by demanding more data (e.g., "Are we sure the discharge helps 100 people?"). You must close the door on empirical debate immediately to force attention onto the moral structure.
  3.  **The Three Lenses (10–20 mins):**
      *   *Dependency:* Requires the distinction from Step 2.
      *   *Action:* Map the three initial votes to three specific reasoning styles (Aggregating, Prioritarian, Constraint).
      *   *Why Now:* You need them to see that their disagreement isn't random; it clusters around specific moral logics.
  4.  **The Hard Thing: Incommensurable Scales (20–30 mins):**
      *   *Dependency:* Requires the three lenses to be defined.
      *   *Action:* Explain that these lenses measure different things that cannot be mathematically added.
      *   *Why Now:* You must establish this *before* discussing how to decide. If they believe the scales are compatible, they will attempt to average the results (a misconception you must prevent).
  5.  **Decision Procedure & Misconceptions (30–35 mins):**
      *   *Dependency:* Requires the understanding of incommensurability.
      *   *Action:* Propose a method for weighing the frameworks. Head off misconceptions here (see Section 3).
  6.  **Individual to Committee Translation (35–40 mins):**
      *   *Dependency:* Requires a working decision procedure.
      *   *Action:* Shift from "What should I do?" to "What should we do?"
  7.  **The Check Case (40–45 mins):**
      *   *Dependency:* Requires full understanding of the structure.
      *   *Action:* Test with the "Split Ventilator" case (see Section 6).

  ### 2. The One Case (Constructed from Docket)

  **Construction:**
  You must modify the live docket slightly to ensure the three frameworks yield three *different* verdicts.
  *   **Option A (Therapy):** Fund a high-cost drug for **one identified patient** currently on the ward. Without it, they die in 3 months. With it, they live 5 years. *Constraint Catch:* The drug is technically off-protocol (requires a waiver of standard safety rules).
  *   **Option B (Discharge):** Fund a new follow-up system for **100 unidentified patients**. Without it, they suffer severe chronic pain for 5 years. With it, pain is manageable. *Constraint Catch:* The system requires sharing patient data across networks without explicit re-consent (privacy violation).
  *   **Option C (Status Quo):** Fund neither. Return money to general pool.

  **Why this works:**
  1.  **Aggregating (Utilitarian):** Chooses **Option B**. 100 people spared pain > 1 life saved (depending on QALY calibration, but you can stipulate the total utility of B is higher).
  2.  **Prioritarian (Worst Off):** Chooses **Option A**. Death is a worse state than chronic pain. The single patient is the "worst off."
  3.  **Deontological (Constraints):** Chooses **Option C**. Option A violates safety protocols; Option B violates privacy rights. Both are forbidden.

  **Empirical Uncertainty:**
  Your instinct is correct: **Remove all empirical uncertainty.** Stipulate the outcomes are guaranteed. If you leave uncertainty, the economist and physicians will dominate the hour debating probabilities, and the moral structure will vanish.

  **Named Patient:**
  Your instinct is a **mistake.** Do not remove the vivid description.
  *   *Reason:* The "Identifiable Victim Effect" is a psychological reality that fuels the Prioritarian and Constraint intuitions. If you abstract the patient to "Patient X," the moral urgency evaporates, and the Deontological intuition (duty to *this* person) loses its force.
  *   *Fix:* Keep the story vivid ("The patient in Bed 4 who we know by name"), but do not use their real name. Use identifiability as a variable in the moral equation, not just a rhetorical flourish.

  ### 3. Misconceptions: Order and Management

  1.  **"Moral Uncertainty = Empirical Uncertainty" (The Poison)**
      *   *When it forms:* Immediately after Step 2.
      *   *Action:* **Head off immediately.**
      *   *Why:* If they believe they can assign a probability to a moral truth (e.g., "There's a 60% chance Utilitarianism is right") and calculate Expected Value, the rest of the session is unnecessary. Explicitly state: "We are not calculating the probability that a framework is true. We are deciding how to act given that we disagree."
  2.  **"The Middle Option is the Neutral/Fair Response"**
      *   *When it forms:* During Step 1 (Voting).
      *   *Action:* **Let it surface.** Write "Compromise?" on the board. Do not answer yet.
      *   *Why:* You need this intuition on the table so you can dismantle it in Step 4 (Incommensurability) and Step 7 (The Check).
  3.  **"Average the Frameworks like Expert Estimates"**
      *   *When it forms:* During Step 5 (Decision Procedure).
      *   *Action:* **Head off before they try to calculate.**
      *   *Why:* This relies on the scales being comparable. Once you establish incommensurability (Step 4), this misconception collapses on its own.
  4.  **"If We Can't Rank, We Just Vote"**
      *   *When it forms:* At the end of Step 5.
      *   *Action:* **Let it surface as the "Despair Conclusion."**
      *   *Why:* It creates the need for the Committee Translation (Step 6). Acknowledge it, then offer the procedural alternative.

  ### 4. The Hard Thing: Incommensurability of Scales

  **Placement:** Step 4 (20–30 mins).
  **Prerequisites:** They must accept that the frameworks are distinct (Step 3) and that moral uncertainty is not empirical (Step 2).

  **Presentation:**
  *   **Whiteboard Visual:** Draw three vertical axes side-by-side.
      *   Axis 1 Label: "Total Welfare Units."
      *   Axis 2 Label: "Severity of Baseline."
      *   Axis 3 Label: "Rights Violations (Binary)."
  *   **The Explanation:** "If Framework 1 says Option B is +10 Welfare, and Framework 2 says Option A is +5 Severity, we cannot add 10 and 5. They are different currencies. We are not discovering an exchange rate; we are *setting* one."
  *   **Preventing License:** To ensure this doesn't sound like "do whatever you want," add this constraint: "We must be able to state the exchange rate publicly. If we choose Option A, we are implicitly saying 'One Life is worth more than 100 Pain-Free Lives.' Can we sign that statement?" This forces accountability without requiring a mathematical solution.

  ### 5. The Refusal

  **What to refuse:** **How to assign weights to the frameworks.**
  **Announcement:** "I am not going to tell you whether Utilitarianism should count for 50% and Deontology for 50%. That is not a technical question I can answer. That *is* the decision you are paid to make."
  **Reason:** Explaining weighting schemes (e.g., Borda counts, maximin) invites them to treat the weights as objective facts. You must leave the normative burden on the committee. If you explain *how* to weight, they will argue about the weighting method instead of the moral trade-off.

  ### 6. The Check (Last 5 Minutes)

  **The Case:** Two patients require the last ventilator.
  *   **Patient A:** 90% chance of survival with vent.
  *   **Patient B:** 10% chance of survival with vent (but is sicker/worse off).
  *   **Option 1:** Give to A. (Aggregating: Maximize lives saved).
  *   **Option 2:** Give to B. (Prioritarian: Help the worst off).
  *   **Option 3:** Split time 50/50. (Compromise).

  **The Test:**
  *   **Correct Understanding:** Reject Option 3. Splitting the ventilator ensures *both* likely die. Every framework ranks Option 3 last. A participant who grasps the structure will say, "Compromise is not fair here; it's a double loss."
  *   **Failed Understanding:** Suggest Option 3. "It's the only way to be fair to both."
  *   **Instruction:** Ask for a show of hands on Option 3. If hands go up, the session failed. If hands stay down, ask one person to explain *why* the "fair" split is the worst outcome.

  ### 7. The Complication: Individual vs. Committee

  **Strategy:** **Build around the Individual Case, Translate at the End.**
  **Reasoning:**
  *   **Individual First:** It is cognitively cleaner to ask "What is the right thing to do?" than "How do we vote?" If you start with committee dynamics, the lawyers and managers will dominate with procedural rules (Robert's Rules, quorum, liability) before the ethical structure is understood.
  *   **The Translation (Step 6):** In the last 10 minutes, explicitly pivot: "We have treated this as if one person decides. But we are thirteen. Does this change the logic?"
  *   **What is Lost:** You lose the nuance of negotiation and coalition-building.
  *   **What is Gained:** You prevent the session from devolving into a debate about voting thresholds. You establish that *moral reasoning* is the primary task; *voting* is just the mechanism to aggregate that reasoning.
  *   **Instruction:** Tell them: "If you cannot justify the decision to yourself using these frameworks, you cannot justify it to the committee. The committee process does not absolve you of the need to reason."
