  # WORKING PAPER: STRUCTURAL MECHANISMS OF LEGISLATIVE INTEGRITY
  **Subject:** Comparative Analysis of Electoral and Sortitive Chamber Designs
  **Status:** Draft for Adversarial Collaboration
  **Date:** October 2023

  ## 1. AGREED CLAIMS

  The following propositions are accepted by both the Sortitionist and Electoralist factions as the baseline for this commission's work. These claims exclude platitudes regarding the value of democracy and focus on structural mechanics.

  1.  **The Influence Market:** In any legislative body, there exists a market for influence. External actors (donors, lobbyists, parties) seek to exchange resources for legislative outcomes, and legislators seek resources (money, status, re-election, post-office employment) to maintain their position.
  2.  **Insufficiency of Term Limits Alone:** Both sides agree that imposing term limits on elected officials, without additional structural changes, does not eliminate the influence market. It alters the timing and the counterparties of influence transactions (e.g., shifting from re-election funding to post-office employment positioning).
  3.  **Necessity of Expertise:** Effective legislation requires access to high-quality information and technical expertise. No chamber design can function if members are systematically unable to process complex policy data.
  4.  **Risk of Bureaucratic Dominance:** Any chamber, whether elected or selected by lot, relies on a permanent administrative secretariat for briefing and procedure. There is a shared risk that this permanent staff may exert undue influence over transient members.
  5.  **Legitimacy Requirement:** For a constitutional reform to be stable, the public must perceive the chamber as legitimate. Legitimacy is derived from either descriptive representation (the chamber looks like the people) or authorized representation (the chamber is chosen by the people), but both sides agree that a total collapse of public trust renders the chamber ineffective.
  6.  **The Sanction Mechanism:** Removing the possibility of re-election removes a specific mechanism of retrospective punishment (voting an official out). Both sides agree this mechanism currently exists in elections and currently does not exist in sortition.
  7.  **The Mandate Problem:** Elected officials claim a policy mandate based on campaign promises. Sortitioned members claim a descriptive mandate based on statistical representation. Both sides agree that neither guarantee is perfect: elected officials break promises, and sortitioned members may not perfectly mirror the public will.

  ## 2. DISAGREEMENTS TABLE

  This table isolates the specific points of divergence. It distinguishes between verbal disputes (definitions) and substantive disputes (causal claims about behavior).

  | Crux ID | The Core Question | Sortitionist Formulation | Electoralist Formulation | Verbal or Substantive? | Admissible Considerations |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **A.1** | **The Ex Ante Influence Market** | Because a sortitioned member is unidentified until selection and cannot serve again, there is no target for *ex ante* vote-buying. The "Unpredictability Dividend" destroys the market for promises. | Because a sortitioned member still needs party placement or post-office employment, or because lobbyists can target the *pool* rather than the individual, the influence market relocates rather than vanishes. | **Substantive** | Data on lobbying expenditure targeting non-reelectable bodies; simulation of lobbying success rates against anonymous vs. known targets. |
  | **A.2** | **The Locus of Capture** | Capture is primarily driven by *donor dependency* required for re-election. Removing elections removes the dependency, reducing capture. | Capture is driven by *information asymmetry* and *career incentives*. Amateurs without electoral mandates will defer to the permanent secretariat or future employers, shifting capture from donors to bureaucrats. | **Substantive** | Comparative analysis of decision independence in citizen assemblies vs. term-limited legislative committees; measures of staff amendment rates. |
  | **B.1** | **Retrospective Sanction** | The threat of re-election induces short-termism and pandering. Removing it allows members to act on long-term evidence without fear. | The threat of re-election is the only reliable mechanism to remove corrupt or incompetent actors. Removing it eliminates the primary check on misconduct. | **Substantive** | Corruption indices in term-limited vs. non-term-limited bodies; rates of unpopular but necessary legislation passage. |
  | **C.1** | **Definition of Accountability** | Accountability means fidelity to the *interest* of the constituency and the *evidence* of the case, free from fear of punishment. | Accountability means the institutional capacity of the constituency to *remove* the representative for poor performance. | **Verbal** | Philosophical coherence; consistency with constitutional theory. (Note: The *consequences* of these definitions are substantive, see B.1). |
  | **C.2** | **Definition of Mandate** | A mandate is the statistical likelihood that the chamber's aggregate preference matches the population's preference. | A mandate is the explicit authorization granted by voters to pursue a specific platform or party agenda. | **Verbal** | Linguistic usage in political theory; public perception surveys on what "representation" means. |

  **Note on Verbal Disputes (C.1 & C.2):**
  Both sides acknowledge that the disagreement over the definition of "Accountability" is largely semantic. However, this verbal dispute masks a substantive disagreement regarding *institutional design*. If Accountability is defined as "removal power" (Electoralist), the institution must build removal mechanisms. If defined as "freedom from fear" (Sortitionist), the institution must build insulation mechanisms. The surviving substantive dispute is not what the word means, but which institutional feature (insulation vs. removal) produces better legislative outcomes.

  ## 3. PREDICTIONS LEDGER

  For each substantive crux, the factions agree to the following diagnostic tests. These are pre-registered predictions regarding hypothetical or controlled pilots. If the outcome contradicts a faction's prediction, that faction concedes the specific causal claim associated with that crux.

  | Crux ID | Diagnostic Pilot / Thought Experiment | Sortitionist Prediction | Electoralist Prediction | Concession Condition |
  | :--- | :--- | :--- | :--- | :--- |
  | **A.1** | **The "Blind Lobbying" Simulation:** A controlled environment where lobbyists attempt to secure votes from two groups: (1) Officials known 2 years in advance (Elected模拟), and (2) Officials selected 2 days before voting (Sortition模拟). Both groups have identical career incentives post-service. | Lobbyist expenditure and success rates will be statistically significantly lower in Group 2. The inability to identify the target *ex ante* will break the transaction. | Lobbyist expenditure will shift to "general pool" influence (e.g., media campaigns, briefing papers), and success rates will remain equal because the *incentive* to trade votes for future career capital remains in both groups. | **Sortitionist:** If success rates are equal, they concede the Unpredictability Dividend does not structurally block influence markets.<br>**Electoralist:** If expenditure drops >50% in Group 2, they concede that *ex ante* identification is a primary vector for capture. |
  | **A.2** | **The "Secretariat Dependency" Pilot:** Two chambers draft complex technical legislation. Both have no re-election. Chamber E has prior legislative experience. Chamber S is randomly selected laypeople. Both have identical access to staff briefings. | Chamber S will produce legislation with equal independence scores (measured by deviation from staff drafts) because random masters can fire/bully staff just as effectively as experienced masters. | Chamber S will show significantly higher adoption rates of staff-drafted language because they lack the confidence and procedural knowledge to challenge expert authority. | **Sortitionist:** If Chamber S adopts >80% more staff language than Chamber E, they concede that amateurism increases bureaucratic capture.<br>**Electoralist:** If independence scores are equal, they concede that experience is not a prerequisite for resisting bureaucratic dominance. |
  | **B.1** | **The "Unpopular Decision" Test:** A scenario where the optimal policy is highly unpopular in the short term but beneficial in the long term. Compare decision rates between a body facing re-election in 6 months vs. a body with no re-election possibility. | The non-reelectable body will pass the unpopular measure at a significantly higher rate, demonstrating the benefit of insulation from retrospective sanction. | The non-reelectable body will pass the measure at the same or lower rate, because without the mandate of election, they will lack the confidence to act against public opinion, or will defer to media pressure. | **Sortitionist:** If passage rates are equal/lower, they concede that retrospective sanction is not the primary driver of short-termism.<br>**Electoralist:** If the non-reelectable body passes the measure significantly more often, they concede that elections structurally bias against long-term planning. |

  **Procedural Note on Concessions:**
  Conceding a causal claim does not require a faction to abandon their preferred system entirely. It requires them to acknowledge that the specific *mechanism* they argued for (e.g., "Lot destroys the influence market") is not the primary driver of the outcome. They must then adjust their proposal to address the revealed weakness (e.g., Sortitionists must propose stronger anti-bureaucratic controls; Electoralists must propose stronger campaign finance restrictions).
