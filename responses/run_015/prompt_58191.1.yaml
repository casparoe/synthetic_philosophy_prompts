answer: |-
  **Essay Question**

  **Political Theory II: The Ethics of Compatriot Partiality**

  **Take-Home Assessment**

  Consider the following hypothetical: A Health Minister holds a fixed discretionary budget. She must choose between a domestic programme expected to extend the lives of 200 fellow citizens and an overseas aid contribution through an effective multilateral fund expected to save 800 lives abroad at identical cost. The Minister is democratically accountable only to the domestic citizens, yet she retains personal discretion to direct the funds either way.

  Write an essay evaluating whether the Minister is morally permitted or required to prioritize the domestic programme. In your analysis, you must:

  1.  Distinguish between **instrumental**, **accountability-based**, and **intrinsically associative** defences of giving priority to compatriots.
  2.  Demonstrate how each defence fares when confronted with the specific disparity in numbers (200 vs. 800), the certainty of effectiveness, and the non-voluntary character of the citizenship relationship.
  3.  Commit to a definite verdict on the Minister's choice and defend it against the strongest objection from the opposing view.

  ***

  **Model Answer**

  The Minister is morally required to save the 800 lives abroad. While compatriot partiality is often defensible, the four-fold disparity in lives saved, combined with the high effectiveness of the aid, overrides the specific duties owed to co-nationals in this instance.

  To understand why, we must separate the available justifications for partiality. **Intrinsically associative** defences, such as those suggested by Samuel Scheffler or David Miller, argue that shared citizenship constitutes a valuable relationship generating special duties. However, this defence weakens when the relationship is non-voluntary. Citizens do not choose their nationality; thus, the obligations cannot be as binding as voluntary commitments like friendship. Furthermore, intrinsic value rarely justifies letting 600 extra people die. The moral weight of a shared culture cannot mathematically outweigh the right to life of outsiders when the cost is this catastrophic.

  **Accountability-based** defences posit that the Minister acts as an agent for her principals (the voters). Since she is accountable only to the 200, she lacks the mandate to spend their resources elsewhere. This is a strong procedural objection. However, it conflates political liability with moral permissibility. While the Minister might face electoral punishment for saving foreigners, moral philosophy asks what she *ought* to do, not merely what she will be rewarded for. If the voters' mandate requires complicity in 600 preventable deaths, the mandate itself lacks moral legitimacy. The accountability argument explains the political risk, but it does not justify the moral failure.

  **Instrumental** defences suggest that prioritizing compatriots maintains state stability and trust, which ultimately benefits everyone. Prioritizing domestic health might sustain the welfare state's integrity. Yet, this relies on empirical contingency. If the overseas fund is highly effective (as stipulated), the instrumental gain of domestic spending is outweighed by the sheer loss of human capital abroad. Moreover, if the state's stability relies on ignoring mass death abroad, that stability is morally precarious. Instrumental reasons are too weak to trump the immediate urgency of saving lives when the efficiency gap is this wide.

  The strongest objection to this verdict comes from the **Democratic Contract**. One might argue that citizenship is a cooperative scheme for mutual advantage. By prioritizing outsiders, the Minister violates the implicit contract that sustains the domestic welfare system, potentially eroding the trust required to fund future public goods. If citizens feel their contributions are diverted globally, they may withdraw support, harming the poor domestically in the long run.

  This objection fails on two grounds. First, it assumes a fragile citizenship that cannot withstand moral leadership. Second, it treats the welfare state as a closed insurance club rather than a moral agent. While long-term stability matters, it cannot be purchased at the price of 600 immediate deaths. The threshold for overriding associative duties is high, but it is met here. The Minister's role is not merely to maximize domestic utility, but to act justly. When the cost of partiality is measured in hundreds of preventable deaths, impartialist humanitarianism must prevail. The Minister should save the 800, accept the political consequences, and argue for a broader moral horizon.

  ***

  **Marking Scheme (Total: 25 Marks)**

  **Required Analytical Moves (5 marks each)**

  1.  **Application of Hypothetical:** The essay must explicitly utilise the 200 vs. 800 ratio and the specific constraints (fixed budget, discretion). Failure to reference the numbers or the accountability constraint limits marks to a maximum of 10.
  2.  **Tripartite Distinction:** Clear conceptual separation of *instrumental* (state stability/trust), *accountability* (mandate/agency), and *intrinsic* (value of relationship) defences. Conflating these categories limits marks to a maximum of 15.
  3.  **Stress-Testing Defences:** Analysis of how the specific variables (numbers, effectiveness, non-voluntary citizenship) weaken or strengthen each defence. For example, noting how non-voluntary citizenship weakens the intrinsic claim.
  4.  **Definite Verdict:** The essay must state clearly whether partiality is permitted or required. Ambivalence or sitting on the fence limits marks to a maximum of 15.
  5.  **Objection and Rebuttal:** Identification of a strong counter-argument (e.g., Democratic Contract/Trust) and a substantive rebuttal. Merely stating the objection without refuting it limits marks to a maximum of 20.

  **Differentiation Criteria**

  *   **First Class (20–25):** Seamless integration of theory and hypothetical. The argument drives the theory, not vice versa. The verdict is nuanced (e.g., acknowledging political costs while maintaining moral necessity). The rebuttal anticipates a sophisticated version of the objection (e.g., long-term erosion of welfare trust) rather than a straw man.
  *   **Upper Second (15–19):** Correctly identifies the three defences and applies them to the case. Gives a verdict. However, the connection between the *numbers* and the *theory* may be mechanical (e.g., "800 is more than 200" without discussing moral weight). The objection handling may be standard rather than insightful.
  *   **Lower Second/Third (10–14):** Summarizes positions (Miller vs. Utilitarians) without anchoring them in the Ministerial scenario. Fails to distinguish the three specific defences requested. No clear verdict.

  **Characteristic Errors (Deductions)**

  *   **-5 Marks:** Ignoring the "non-voluntary" constraint specified in the prompt.
  *   **-5 Marks:** Failing to commit to a verdict (e.g., "both sides have points").
  *   **-3 Marks:** Treating the accountability constraint as a moral justification rather than a political constraint.
  *   **-3 Marks:** Exceeding or falling significantly short of the expected depth/length balance (though word count is not strictly policed, depth is).
