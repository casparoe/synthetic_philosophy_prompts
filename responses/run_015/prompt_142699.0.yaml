  **Project Title:** Moral Risk-Pooling and Climate Obligations

  **Project Summary**
  Here's the pitch. Standard intergenerational climate justice feels like a one-way transfer. We save capital, future gens get the benefit. It's usually framed through Rawlsian savings or economic discounting fights. I want to try something different. The core idea is treating future generations as co-insured parties in a climate-risk pool rather than passive beneficiaries of current savings.

  **Research Question**
  Does this insurance-contract framing actually restructure cross-generational obligations, or is it just distributive justice in different clothes?

  **Gap in Existing Work**
  Existing work leaves it open because most accounts frame obligations as direct harm-avoidance or capital-transfer, not mutual risk-bearing. By shifting the lens to insurance, we might find duties that don't fit the standard savings model.

  **Methodology**
  I'll apply contractarian risk-pool logic to climate obligations, contrast it with standard intergenerational models, and test it on one concrete allocation problem like carbon-budget alocation. This keeps the theory grounded without getting bogged down in macroeconomics.

  **Outcomes**
  A result looks like showing the insurance frame creates distinct duties beyond standard distribution. Failure means it collapses back into regular distributive justice—but knowing that is still useful for clearing the field.

  **Scope**
  One semester. Realistic load. No bibliography needed.
