      *   *Critique:* Does this break Hacking? Hacking focused on the *interaction*. If the interaction is blocked, the looping effect is dampened or altered.
      *   *Relevance:* This touches on *power dynamics* in psychiatry (Foucaultian angle). It explains why some categories stay stable despite social change (institutional inertia).
      *   *Verdict:* It doesn't break Hacking; it refines the *mechanics* of the loop. It suggests the loop isn't automatic; it's mediated.

  5.  **Determine "Settled" vs. "Contested":**
      *   *Settled:* Classifications change over time. Patients react to labels. Biology plays *some* role (even constructivists admit brains exist). Pure biological reductionism is currently impossible for most psych disorders.
      *   *Contested:* The *weight* of biology vs. social feedback. Whether biomarkers will ever "solve" the looping. Whether "asymmetric looping" invalidates the interactive kind model or just describes a specific institutional context. Whether the "kind" is the label or the pathology.

  6.  **Develop Recommendations to Move the Debate:**
