      *   **CT Response:** Counterpart relations are already vague/gradual. Lewis explicitly allows degrees of counterpartedness. So this isn't "ad hoc" for CT; it's built-in.
      *   *Problem:* This case might not force a crisis because CT *expects* vagueness, and TWI *expects* sharp boundaries (epistemic or metaphysical).
      *   *Better Diagnosis:* The real issue isn't the *degree* of change, but the *nature* of the relation.

  5.  **Diagnose the Stall (The Core Question):**
