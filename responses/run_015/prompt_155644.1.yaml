      *   **Counterpart Theory (CT):** Associated with David Lewis. $a$ in $W_1$ is *not* identical to $b$ in $W_2$. $b$ is a *counterpart* based on similarity. Avoids contradictions by relativizing properties to counterparts.
      *   **The Stalemate:** TWI proponents say CT violates intuition ("I care about *my* survival, not some similar guy"). CT proponents say TWI violates logic/metaphysics ("How can one thing have incompatible properties?").
      *   **The User's Insight:** The user suspects a semantic/metaphysical split. This is a sophisticated observation (reminiscent of Carnap vs. Quine or deflationary meta-ontology).
