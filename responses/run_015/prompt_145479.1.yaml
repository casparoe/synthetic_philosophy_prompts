answer: |-
  **Diagnosis**
  Your hypothesis is elegant, but it risks dissolving a genuine ideological rupture into a semantic confusion. The scholarly disagreement is substantive, not merely verbal, because Douglass did not simply separate text from practice; he changed his answer to the "as-written" question itself. In the Garrisonian phase, he argued the text *authorized* slavery (citing the Three-Fifths Clause and fugitive slave provisions). Later, he argued the text *forbade* slavery (citing the absence of the word "slave" and due process clauses). If he had only distinguished practice from text, he could have maintained the text was pro-slavery while arguing for moral opposition. Instead, he redeemed the text itself. The debate persists because scholars are weighing whether this hermeneutic flip was a genuine intellectual conversion or a strategic retrofitting. Your distinction explains how he could hold both views simultaneously, but it does not explain why he felt compelled to change his reading of the clauses themselves.

  **Douglass's Words and Situation**
  The evidence suggests the shift was driven by political necessity, which complicates your "two registers" theory. In the late 1840s, Douglass concluded that moral suasion alone failed; political action was required. But one cannot vote under a pro-slavery compact. To join Gerrit Smith's Liberty Party, Douglass needed a Constitution that permitted black citizenship. Consequently, his speeches stop treating the Three-Fifths Clause as a recognition of slavery and start treating it as a penalty on slave states. This is not a shift in emphasis; it is a reversal of legal evidence. In the 1852 Oration, he challenges the audience to find pro-slavery clauses not because he is ignoring practice, but because he has re-defined the rules of interpretation to prioritize natural law over framers' intent. The situation demanded a tool for power. If the distinction were merely between text and practice, he could have kept the Garrisonian reading while voting anyway as a moral exception. He did not. He changed the document to fit the action.

  **What Would Count as Progress**
  The hypothetical letter would not settle the debate because both camps would absorb it to fit their narrative. The "strategic" camp would cite it as proof of cynicism; the "conversion" camp would argue that political utility catalyzed genuine belief. For Douglass, truth and action were inseparable, so admitting strategic utility does not prove a lack of conviction. Progress requires abandoning the binary "did he change his mind?" framing. Instead, ask: "What logical costs did this shift incur?" Analyze what arguments he had to suppress later that he cherished earlier. Did the new reading blind him to structural flaws he previously identified? The scholarly impasse exists because everyone wants Douglass to be consistent. You will make progress by showing how his inconsistency was the point: he altered his theory of law to save the Union. The disagreement isn't about what he believed, but whether we forgive him for changing it to win.
