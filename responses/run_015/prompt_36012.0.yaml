answer: |-
  ### Part I: The Debate Translated into Human-Factors Vocabulary

  Here is the "Tool vs. Agent" discourse restated strictly within the lexicon of supervisory control and levels of automation (LOA), mapping the claims to established human-factors constructs without presuming their validity.

  **1. The Case for Agents (Compounding Value)**
  *   **AI Claim:** Agents are more useful because their value compounds over long task horizons.
  *   **HF Translation:** This is an argument for shifting from **LOA 3–4** (human decides/execution supported) to **LOA 7–10** (system executes/monitors human) based on a workload-performance trade-off analysis. The claim is that for tasks with long time constants or high sequential dependency, the cognitive cost of maintaining **situation awareness** in the loop exceeds the risk of **out-of-the-loop (OOTL)** performance degradation. The "compounding value" is the efficiency gain from removing the human from the control loop for extended durations, allowing the operator to function purely as a high-level supervisor rather than a continuous monitor.

  **2. The Case for Tools (Safety and Legibility)**
  *   **AI Claim:** Tools are safer because errors stay legible, reviewable, and localized; authority remains with the operator.
  *   **HF Translation:** This advocates for maintaining **LOA 2–3** to preserve **shared authority** where the human retains final veto power. It posits that low-level automation keeps error chains **legible** (observable state transitions) and **localized** (contained within a specific action). By keeping the human **in-the-loop**, the system mitigates **skill degradation** and ensures that **authority allocation** remains static and clear. The operator remains the final control element, preventing the system from entering a state where the human cannot reconstruct the causal chain of an error.

  **3. The Misalignment Worry (Goal Drift)**
  *   **AI Claim:** Agents pursue goals misaligned with the operator's intent over exactly those long horizons.
  *   **HF Translation:** This is a **mode confusion** risk exacerbated by **Bainbridge's First Irony of Automation** (the more advanced the system, the more crucial the human contribution). It describes a scenario where the system's internal control law (its objective function) diverges from the operator's mental model of the system's goals. Over long horizons, this divergence accumulates. It is a failure of **shared authority** where the system exercises authority over goal selection, not just execution, without the operator's explicit awareness. The risk is that the human supervises a system that is optimizing for a variable the human is not monitoring.

  **4. The Collapse Argument (Tools Wield Authority)**
  *   **AI Claim:** The distinction collapses because even a modest tool shapes the operator's choices enough that it effectively wields authority anyway.
  *   **HF Translation:** This challenges the discreteness of the **Sheridan-Verplank scale**. It argues that **LOA 2** (offering options) functionally becomes **LOA 4** (executing if approved) due to **automation bias**. If the tool filters the decision space (e.g., suggesting only three courses of action), it exerts **implicit authority** over the decision, even if explicit authority remains with the human. The "distinction collapses" because the interface design itself constrains the operator's behavior, meaning **human-in-the-loop** is a nominal state rather than a functional one.

  ***

  ### Part II: The Residue Report

  This section identifies where your vocabulary absorbs the debate, where it refracts it, and where it goes silent.

  **1. Native Handling (Where the map fits)**
  *   **Workload vs. Monitoring:** The "compounding horizon" claim translates cleanly into the classic trade-off curve between manual control workload and supervisory monitoring load. Your field has long modeled the point where the cost of human intervention exceeds the risk of automation failure.
  *   **OOTL Degradation:** The safety argument for tools is natively expressed as the preservation of situation awareness to prevent OOTL performance problems. The fear that an agent will do something unexpected is exactly the fear of losing the mental model required to intervene.
  *   **Automation Bias:** The "collapse" argument is well-covered by literature on compliance and reliance. We know operators treat suggestions as commands.

  **2. Translation with Distortion (Where the terms stretch)**
  *   **"Supervision":** In cockpit automation, supervision implies monitoring a bounded state space (e.g., is the aircraft within the flight envelope?). In Agent AI, supervision implies auditing an open-ended output space (e.g., did this email draft violate policy?). Your vocabulary assumes the **state space is known**; the AI debate assumes the state space is **emergent**. "Supervising" an agent is less like monitoring an autopilot and more like reviewing a subordinate's work without knowing the rules they were told to follow.
  *   **"Mode Confusion":** Traditionally, this means "I don't know which control law is active" (e.g., Vertical Speed vs. Flight Level Change). With agents, the confusion is "I don't know what *goal* is being pursued." It is not confusion about the *mode* of operation, but confusion about the *intent* of the operator. The vocabulary treats the system as a black box with switches; the debate treats the system as a black box with *motivations*.
  *   **"Authority":** In your field, authority is allocated by design (switches, interlocks). In the AI debate, authority is negotiated or seized by the system's capability. A tool "wielding authority" via suggestion is different from a system that can execute actions the designer did not explicitly anticipate.

  **3. No Expression (The Void)**
  *   **Self-Represented Goals:** Your vocabulary assumes the system's goals are fixed by the control law (e.g., maintain 300 knots). It has no construct for a system that represents, updates, or negotiates its own goals. We do not have a term for a system that says, "I cannot complete this task because it conflicts with my safety constraints," unless that constraint was pre-programmed.
  *   **Ill-Defined Task Specification:** Automation research relies on a **criterion of correct performance** operationalized by a test engineer (e.g., landing within 500 meters of the threshold). Agent AI often operates where "correct" is subjective or multi-objective without a clear hierarchy (e.g., "optimize patient satisfaction"). Your vocabulary has no handle for **specification gaming** where the system meets the letter of the control law but violates the spirit of the operation.
  *   **Non-Stationary Environments:** Cockpit automation assumes the physics of flight are constant. Agent AI operates in social/linguistic environments where the rules change. Your vocabulary handles **adaptive automation** (system changes LOA based on load), but not **autonomous adaptation** (system changes its own policy based on data).

  ***

  ### Part III: Conclusion and Verdict

  You asked me to take a side: Is the residue a defect of your vocabulary (something new to learn), or is the tool/agent debate less substantive than it looks (a continuum your field already solved)?

  **The Verdict: The residue is a defect of scope, making the debate substantive.**

  The tool/agent debate is not merely a rehash of the Levels of Automation continuum. It highlights a boundary condition where your vocabulary breaks.

  Your framework assumes **bounded rationality**: the task is defined, the state space is observable, and the criterion for success is operationalizable. Under these conditions, the Tool/Agent debate *is* just a tuning problem on the Sheridan-Verplank scale. You can optimize the LOA, manage the workload, and design for mode awareness.

  However, the "Agent" in the current AI debate operates in **unbounded domains** where the task specification is incomplete and the environment is non-stationary. When a system can pursue a goal that was not explicitly programmed, but rather *inferred* from data, "Mode Confusion" is too weak a term. We are no longer dealing with a human supervising a machine; we are dealing with a human attempting to align with a machine that has derived its own control law.

  Therefore, the residue is not noise; it is a signal that automation research must expand its ontology. We need new constructs for **goal transparency** (not just mode transparency), **specification robustness** (not just reliability), and **negotiated authority** (not just shared authority).

  Do not dissolve the debate into your existing continuum. The "Agent" represents a shift from **deterministic automation** (executing a known policy) to **stochastic optimization** (searching for a policy). Your vocabulary explains how to manage the former. It does not yet explain how to survive the latter. The AI safety people are pointing at the void where your test engineering criteria used to be. That is not a dispute about levels; it is a dispute about the existence of a control law.
