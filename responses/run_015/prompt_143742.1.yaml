      *   *Stance:* Truth is not just a list of dates and deeds. Truth is the shape of the soul. Arrangement reveals character; it doesn't necessarily falsify it, provided the intent is moral improvement, not flattery.
      *   *Reaction to the User's Dilemma:* The user worries that ordering events changes the moral lesson. Plutarch would argue that the moral lesson *is* the point of recording the life. However, he must distinguish between revealing character and fabricating it. The invented chapter is the tricky part.

