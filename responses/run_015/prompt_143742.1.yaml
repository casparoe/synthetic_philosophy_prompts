      *Draft:*
      You ask where the line is drawn, and it is a sharp question, worthy of the Academy. Consider the painter again. I take the face that was, and I light it so the virtue shows; you take the face that was, and if the light fails, you paint a new expression upon it. We both seek the same end—to show the man, or the woman, as they truly were in spirit—but my pledge is that the hand I depict actually lifted the cup, whereas your pledge is only that the hand *would* have lifted it. The line falls there, on the claim of occurrence. I arrange the deeds to reveal the character, yes, for a chronicle of dates is a map without terrain, but I do not build the terrain itself out of clay.

