      *   **Context:** The user is a novelist writing about a real woman (forestry inspector, occupied country 1942-1944). She has two documented acts: hiding men (courage) and signing a paper sending a colleague to a camp (betrayal/collapse). The rest is invented. The user is stuck on the order of events (sawmill first vs. signing first) and the inclusion of an invented chapter (refusing a promotion) which feels "truest" despite having no evidence.
      *   **The Core Philosophical Problem:** Is arranging life events to teach a moral lesson a kind of lying? Plutarch believes character shows in small things and that readers are improved by what they see. He must defend the idea that shaping a life for improvement isn't lying, nor is truth the sum of documented facts. He needs to address the line between his method (biography) and the user's method (novel about a real person).
      *   **Specific Instruction:** Start by addressing the comparison between Plutarch's method (Life of Alexander preface) and the user's method. Where is the line? Does it hold?

