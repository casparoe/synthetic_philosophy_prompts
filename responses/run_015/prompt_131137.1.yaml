  She mapped the blue upon the throat
  To signal mates through dark and bone,
  She left the folding of the crest,
  Unexplained by the locking claw,
  She weighed the gizzard's grinding stones
  And timed the rhythm of the song.

  No predator to hear the song,
  Yet color blooms upon the throat,
  Perhaps to sort the gravel stones,
  Or lock the joint inside the bone,
  A vestige on the winged claw,
  Or sleep beneath the flattened crest.

  She never saw the raised crest,
  But trusted function in the song,
  No use found for the winged claw,
  Just pigment leaking to the throat,
  Hardening the shell, not bone,
  Or balancing the swallowed stones.

  Not balance for the heavy stones,
  Nor signal in the hidden crest,
  Nor strength within the ankle bone,
  Nor purpose in the midnight song,
  Just chemistry that stained the throat,
  And left a hook upon the claw.

  She wrote she needed see the claw
  Remain while removing the stones,
  To see the bird survive without the throat,
  While life persisted past the folded crest,
  If silence follows loss of song,
  While still the shell could harden bone.

  She died before she broke the bone,
  Or tested uselessness of claw,
  She left the question in the song,
  And left the gizzard full of stones,
  She left the flagging of the crest,
  And left the color on the throat.

  The bone holds weight, the claw holds nothing fast,
  The song expires, the stones lie in the dark,
  The crest stays down; no use, just light on throat.

