  8.  **Final Review of the "Recency" Argument:**
      *   Premise: Duty is to preserve subject's self-interpretation.
      *   Conclusion: It's worse to do this when witnesses are alive.
      *   Gap: If the duty is to the *dead*, the presence of living witnesses is irrelevant to the *violation*, only relevant to the *consequence*. The speaker conflates the *wrongness of the act* with the *possibility of remediation*. I need to make this clear.

  9.  (Self-Correction on "Epistemic Trespass"): The term usually refers to experts speaking outside their field. Here it's used to mean "violating epistemic boundaries between fact and fiction." I should note this terminological looseness.

  10. **Final Plan:**
      *   Intro: Validate the user's intuition.
      *   Part 1: Posthumous Harm (The Sentience Claim).
      *   Part 2: Mnemonic Stewardship (The Identity Claim).
      *   Part 3: Epistemic Trespass (The Disclosure Claim).
      *   Part 4: The Recency Inference (The Logical Gap).
      *   Closing Advice for the Novelist.

