answer: |-
  The dramatization of historical lives occupies a precarious ethical space between the demands of art and the obligations of memory. When a filmmaker or novelist takes up the life of the dead, they inevitably engage in fabrication. Dialogue is reconstructed, timelines are compressed, and composite characters are invented to serve the rhythm of the narrative. To demand strict biographical accuracy in these mediums is to misunderstand the nature of drama; a scene-by-scene recitation of the historical record rarely yields a coherent story. However, there is a boundary that distinguishes necessary artistic license from a profound ethical violation. This boundary is not drawn at the level of factual precision, but at the level of what might be called structural fidelity.

  Structural fidelity requires that while the surface details of a life may be altered, the moral-causal architecture of the subject's agency must remain intact. A creator is free to invent the words a historical figure spoke, but they are not free to invent the reasons why the figure spoke them, particularly when those invented reasons contradict the internal logic the figure actually possessed. To violate this structure is to commit a specific wrong against the dead: it is to usurp their agency and replace their actual moral struggle with a fictionalized puppet show that bears their name but not their soul.

  To understand why structural fidelity matters more than biographical accuracy, we must distinguish between the *events* of a life and the *agent* of those events. History records what happened; biography seeks to explain who acted. In a biopic, moving a battle from Tuesday to Wednesday changes the history but does not necessarily change the person. However, changing the motive behind a decision changes the person fundamentally. Human identity is constituted not merely by external actions, but by the internal reasoning that bridges intention and action. If a creator severs that bridge and replaces it with one of their own design, they are no longer dramatizing the historical figure; they are using the figure's corpse as a costume for a different character entirely.

  Consider the hypothetical case of the nineteenth-century reformer. Let us assume the historical record, specifically her private correspondence, reveals a complex psychological landscape. She advocated for radical labor laws, but her letters show she was driven by a volatile mixture of genuine empathy for the workers and a calculated desire to elevate her own social standing among the intellectual elite. She knew this about herself. In fact, her letters suggest she wrestled with this duality, fearing her ambition tainted her cause, yet using that ambition as fuel to persist when her conviction wavered. This is a human moral structure: a hybrid engine of action powered by both light and shadow.

  Now, consider the filmmaker who decides this mixture is too messy for a general audience. Seeking a cleaner narrative arc, the screenplay portrays every major decision she made as arising solely from disinterested moral principle. In the film, she never calculates social gain; she never hesitates due to ego; she is a vessel of pure altruism. On the surface, this seems like a compliment. It makes her a hero. But structurally, it is a demolition of her actual character.

  This distortion constitutes a distinct wrong to the dead because it denies the reality of her moral labor. In the historical reality, this woman had to overcome her own vanity to do good. She had to navigate the tension between self-interest and public service. That navigation *was* her virtue. By stripping away the self-interested causal component, the filmmaker does not merely simplify her story; they erase the struggle that defined her moral worth. A saint who feels no temptation is not virtuous in the same way as a human who feels temptation and chooses the good anyway. The film transforms a triumph of will into a state of being. It suggests she was good because she was perfect, rather than good because she chose to be.

  Furthermore, this violation disrespects the subject's own self-conception. The prompt specifies that the reformer's private correspondence shows she recognized her own mixed motives. She endorsed a specific understanding of her own psychology. When the filmmaker portrays her as purely altruistic, they are not just ignoring facts; they are contradicting the subject's own testimony about her interior life. They are effectively saying, "You thought you were ambitious, but I know you were actually a saint." This is a form of ventriloquism that silences the dead. It imposes an external judgment upon an internal reality that the subject is no longer present to defend. The dead rely on the living to preserve the integrity of their selfhood. To rewrite their motives is to colonize their consciousness.

  One might argue that this sanitization is a victimless crime, or even a benefit. If the reformer's work helped people, does it matter if the movie makes her look better than she was? Does the audience not deserve an inspiring hero rather than a conflicted opportunist? This argument prioritizes the utility of the myth over the truth of the person. It assumes the purpose of biographical fiction is to provide moral instruction for the living, regardless of the cost to the memory of the dead.

  However, structural fidelity serves the living better than sanitization, even if it is less comfortable. If we teach audiences that great moral change is only effected by people of pure, disinterested intent, we create a barrier to entry for ordinary morality. Most people operate like the historical reformer: driven by a mix of conviction and ambition, principle and ego. If the cultural narrative insists that only the "pure" count as good, then ordinary people may feel their own mixed motives disqualify them from doing good. By preserving the structural fidelity of the reformer's mixed motives, the filmmaker offers a more usable truth: that good works can emerge from imperfect hearts. The "cleaner narrative arc" is actually a lie that diminishes the potential of the audience, while the messy truth of the historical record empowers them.

  Moreover, the preference for a simpler moral portrait treats the historical figure as a means to an end, rather than an end in themselves. It instrumentalizes the dead. It says their value lies only in their utility as a symbol, not in their reality as a person. Structural fidelity is a demand that we treat the dead as subjects with rights to their own identity, not objects to be sculpted for our consumption. When we collapse a timeline, we are editing a story. When we reverse a moral-causal structure, we are editing a soul.

  In the case of the reformer, the filmmaker's choice to remove her ambition is not a neutral artistic decision. It is an ethical failure to recognize that the "shadow" motives were load-bearing elements of her character. Without them, the structure collapses. The resulting character may be inspiring, but she is not the reformer. She is a mascot wearing the reformer's clothes.

  Ultimately, the duty owed to the dead in fiction is not the duty of a court stenographer, but the duty of a trustee. We are entrusted with their legacy. We have the freedom to arrange the furniture of their lives to make the house habitable for an audience—we can move the dates, write the dialogue, and stage the scenes. But we do not have the right to knock down the load-bearing walls of their moral architecture. To portray a decision as flowing from motives the person explicitly rejected is to break the trust. It creates a false ghost that haunts the cultural imagination, obscuring the real human being who once lived, struggled, and chose. Structural fidelity ensures that when the lights come up, the audience has met a person, not a projection. It honors the dead not by making them perfect, but by making them true.
