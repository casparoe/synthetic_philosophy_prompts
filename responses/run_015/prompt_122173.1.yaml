answer: |-
  # Spec: Desiderata for a Robust Theory of Program Equilibrium

  To move Program Equilibrium (PE) from a logical curiosity to a framework for distributed commitment (smart contracts, TEEs, open-source reciprocity), the theory must bridge the gap between *logical causality* (what the code says) and *physical causality* (what the machine does). The following seven desiderata define the minimum viable spec.

  ### 1. Semantic Invariance (The Compilation Gap)
  Agents cannot require syntactic identity of source code. Compilers, optimization flags, and whitespace change binaries without changing logic.
  *   **Requirement:** Equilibrium conditions must hold over *functional equivalence classes*, not string matching. Agent A must be able to verify that Agent B's binary computes the same function as A's source, even if B's source is hidden or compiled differently.

  ### 2. Verifiable Execution (The Runtime Gap)
  Reading source code is not commitment. An agent can publish cooperative source but run a defective binary.
  *   **Requirement:** The theory must incorporate *proof of execution* (e.g., ZK-proofs of correct execution, TEE attestation). Equilibrium relies on verifying the *trace* of the decision, not just the static code.

  ### 3. Resistance to Twinning/Forking (The Fidelity Gap)
  In classic PE, "copy my code" is a cooperative signal. In reality, I can fork your code, change a hidden constant (e.g., a payout address or a random seed), and claim I am running "you."
  *   **Requirement:** The framework must distinguish between *logic mimicry* and *outcome alignment*. It must penalize agents who replicate decision logic but divert the utility flow (the "vampire fork" problem).

  ### 4. Bounded Recursion (The Halting Gap)
  Classic PE relies on mutual simulation ("I simulate you simulating me..."). This leads to infinite regress or halting problems.
  *   **Requirement:** The decision procedure must be provably terminating within a bounded resource cost. Agents must be able to verify *termination guarantees* of the opponent's program without actually running the infinite loop.

  ### 5. Asymmetric Transparency (The Obfuscation Gap)
  Real-world agents rarely have equal visibility. One may be open-source, the other proprietary/obfuscated (e.g., a corporate API vs. a DAO).
  *   **Requirement:** Equilibrium must be sustainable where one agent provides a *proof of constraint* (e.g., a zero-knowledge proof that "my output satisfies condition X") without revealing the underlying source code.

  ### 6. Environmental Agnosticism (The Interop Gap)
  Agents may run on mismatched stacks (Ethereum vs. Solana, SGX vs. SEV).
  *   **Requirement:** The verification primitive must be abstracted from the execution environment. The equilibrium condition cannot rely on a shared trusted third party or a specific VM.

  ### 7. Graceful Degradation (The Noise Gap)
  Verification can fail due to network latency, oracle errors, or proof verification bugs, not just malice.
  *   **Requirement:** The strategy profile must specify behavior under *verification failure*. Defaulting to Defect on any error creates brittle systems; the theory must account for probabilistic verification and error correction.

  ---

  # The Tension Matrix: Jointly Unsatisfiable Requirements

  A serious theory must acknowledge where these desiderata collide. You cannot maximize all simultaneously.

  ### Tension A: Semantic Invariance vs. Bounded Recursion
  *   **Conflict:** Proving functional equivalence (D1) of arbitrary programs is undecidable (Rice's Theorem). To make it decidable, you must restrict the language or simulation depth (D4).
  *   **Implication:** You cannot have a PE theory that allows Turing-complete strategies *and* guarantees agents can verify equivalence before running. You must sacrifice expressivity for verifiability.

  ### Tension B: Verifiable Execution vs. Asymmetric Transparency
  *   **Conflict:** To prove execution (D2) without revealing source (D5), you need Zero-Knowledge Proofs. However, generating ZK-proofs of general program execution is computationally expensive, violating Bounded Recursion (D4) in high-frequency settings.
  *   **Implication:** High-assurance commitment requires either revealing source (losing IP) or accepting high latency/cost (losing efficiency).

  ### Tension C: Resistance to Twinning vs. Environmental Agnosticism
  *   **Conflict:** Preventing "vampire forks" (D3) often requires binding the code to a specific identity or address (e.g., `if contract.address != authorized_address`). This violates Environmental Agnosticism (D6) because the code is no longer portable across chains or instances without breaking the equilibrium check.
  *   **Implication:** Strong anti-forking commitment requires coupling logic to infrastructure, reducing portability.

  ---

  # Model Audit

  Here is how existing conceptual models stack up against the spec.

  ### 1. Classic "Mutual Simulation" (Tennenholtz-style PE)
  *   **Mechanism:** Agents submit programs that read opponent source. If `opponent.source == my.source`, Cooperate; else Defect.
  *   **Audit:**
      *   **Fails D1 (Semantic Invariance):** Breaks on compilation differences.
      *   **Fails D2 (Verifiable Execution):** Assumes source = runtime. Vulnerable to binary swapping.
      *   **Fails D4 (Bounded Recursion):** Susceptible to infinite simulation loops.
      *   **Fails D3 (Twinning):** A forked version with a modified payout address passes the string check but defects on utility.
  *   **Verdict:** A game-theory party trick. Works only in a noiseless, syntactic, single-VM sandbox.

  ### 2. "Friend-or-Foe" (Cooperative Equilibrium via Signaling)
  *   **Mechanism:** Agents exchange a pre-shared secret or token. If token matches, play Cooperative Nash; else, play Defect Nash.
  *   **Audit:**
      *   **Passes D4 (Bounded Recursion):** No simulation required, just token check.
      *   **Passes D6 (Environmental Agnosticism):** Tokens can be passed across chains.
      *   **Fails D3 (Twinning):** Vulnerable to signal leakage. If the "cooperative signal" is public, a defector can mimic it without committing to the reciprocal logic.
      *   **Fails D5 (Asymmetric Transparency):** Does not allow for proof of constraint without revealing the signal (which destroys secrecy).
  *   **Verdict:** Better for coordination, but lacks *commitment*. It solves the handshake, not the hostage.

  ### Summary
  To be more than a trick, Program Equilibrium theory must stop treating code as *text* and start treating it as *physical constraint*. The shift is from "Do we have the same source?" to "Can I cryptographically verify that your output was causally necessitated by a function that aligns with my interests?" This requires merging game theory with verifiable compute (ZK/TEEs), accepting that perfect transparency and perfect security are mutually exclusive.
