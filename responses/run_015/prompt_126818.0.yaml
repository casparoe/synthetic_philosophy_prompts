answer: |-
  **Conceptual Contrast: Scale Argument vs. Threshold Deference**

  **1. Handling Epistemic Uncertainty**
  The **Scale Argument** treats epistemic uncertainty as a discount factor within an expected utility calculus. It posits that moral weight is aggregative: even if the probability ($p$) of any single insect possessing consciousness is low, the vast population size ($N$) ensures that the expected number of sentient beings ($N \times p$) remains morally significant. Uncertainty reduces the weight per individual but does not negate the cumulative obligation; ignorance is managed through probabilistic weighting.

  **Threshold Deference** treats epistemic uncertainty as a gatekeeping mechanism. It holds that moral consideration is contingent upon an entity satisfying specific ontological criteria for sentience, not upon the statistical likelihood of those criteria being met across a population. Under this view, uncertainty functions as a barrier: unless evidence pushes the probability of sentience past a categorical threshold, the entities remain outside the moral circle regardless of their abundance. Uncertainty is managed through burden-of-proof standards rather than calculation.

  **2. Policy Divergence: Agricultural Pest Control**
  The practical divergence is sharpest in **large-scale insecticide deployment**.
  *   **Scale Argument:** Recommends drastic restriction or redesign of pest management. Because the expected sum of suffering is high due to the sheer number of victims, even a low probability of sentience justifies high economic costs to mitigate harm (e.g., shifting to sterile insect techniques or accepting crop loss).
  *   **Threshold Deference:** Permits current intensive practices. Unless insects demonstrably cross the sentience threshold, their interests do not outweigh human agricultural needs. Policy remains anthropocentric until positive evidence of consciousness forces a categorical reclassification.

  **3. Structural Vulnerability of the Scale Argument**
  The objection that the Scale Argument inflates moral status through arithmetic rather than evidence targets its **multiplicative aggregation of ontological probability**. By treating the *probability of moral status* as a fungible quantity that can be compensated for by *population magnitude*, the argument conflates epistemic confidence with moral reality. This structure allows the moral equation to be balanced by adding more non-sentient (or uncertain) entities rather than by securing better evidence of sentience, effectively permitting arithmetic volume to substitute for ontological verification.
