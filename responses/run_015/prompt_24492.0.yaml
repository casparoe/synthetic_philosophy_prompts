  **Q&A Prep Sheet: Defending Good's Theorem**

  **1. The Triviality Objection (Statistician)**
  *Q:* "Isn't this just Jensen's inequality applied to the value function? Why the heavy framing?"
  *Reply:* Yes, algebraically it's trivial given convexity of the value function in beliefs. The contribution is clarifying that apparent counterexamples violate the convexity assumption via external constraints, not the information itself.
  *Soft Spot:* Conflating mathematical triviality with conceptual clarity.

  **2. The Strategic Objection (Decision Theorist)**
  *Q:* "What about games? If my opponent sees me learn, information signals my strategy and hurts me."
  *Reply:* That violates the fixed state space assumption; the 'state' now includes the opponent's strategy which reacts to your observation. In single-agent decision problems against nature, the theorem holds; in games, information changes the game tree.
  *Soft Spot:* Dismissing strategic settings feels like moving the goalposts.

  **3. The Commitment Objection (Decision Theorist)**
  *Q:* "Consider commitment problems where knowing a prediction prevents optimal action."
  *Reply:* That implies you cannot commit to the optimal action ex-post, violating the 'act optimally on what a signal reveals' condition. If you are constrained from optimizing post-signal, the value loss comes from the constraint, not the entropy reduction.
  *Soft Spot:* Assumes rationality is maintainable under all informational states.

  **4. The Prior Objection (General)**
  *Q:* "If the prior is wrong or the state space excludes 'black swans', isn't the expected value calculation garbage?"
  *Reply:* The theorem is conditional on the agent's subjective prior; it proves consistency within that belief system, not truth relative to reality. Garbage priors yield garbage decisions, but information still improves decisions relative to those priors.
  *Soft Spot:* Subjective consistency offers little comfort if the model is misspecified.

  **5. The Regret Objection (Behavioral Economist)**
  *Q:* "People pay for info and regret it. Doesn't realized negative utility contradict your ex-ante claim?"
  *Reply:* The theorem concerns ex-ante expectation, not ex-post realization. A rational agent maximizes expected utility; regret on a specific trajectory doesn't invalidate the optimality of the purchase before the signal arrived.
  *Soft Spot:* Doesn't address why humans systematically misestimate these expectations.

  **6. The Ignorance Objection (Hope Nobody Asks)**
  *Q:* "If information is always valuable, why do agents ever remain ignorant?"
  *Reply:* Because acquisition costs exist, which I explicitly exclude from the 'value of information' definition. Once costs are added, marginal value equals marginal cost at the optimal stopping point.
  *Soft Spot:* Risks sounding tautological if costs are ill-defined.
