answer: |-
  Your observation identifies a sophisticated and rather treacherous fault line in the praxis of translation, particularly where the target language (English) possesses a rigid syntactic linearity compared to the source (likely French, given your reference to Marot). To answer your primary question directly: there is no single, canonical term in contemporary translation theory that precisely isolates this specific interaction between preserved prosody and inverted logical architecture.

  While the phenomenon is well-recognised anecdotally among practitioners of formal verse translation, it remains taxonomically underdeveloped in theory. Existing concepts approach the periphery of the issue but fail to capture the specific mechanism of *formal fidelity causing argumentative reversal*.

  ### Existing Taxonomies and Near-Misses

  To situate your observation within the current discourse, we must examine why existing terms fall short:

  1.  **Antoine Berman's 'Deforming Tendencies':** In *The Experience of the Foreign*, Berman outlines tendencies such as 'rationalisation' and 'clarification'. While your phenomenon involves a restructuring of logic, Berman's deformations usually imply a loss of nuance or a flattening of the exotic, rather than a complete inversion of the propositional content driven by prosodic obligation.
  2.  **George Steiner's 'Hermeneutic Motion':** Steiner's stage of 'incorporation' describes how the target language absorbs the source. However, this is a broad metaphor for cultural assimilation and does not account for the mechanical causality of rhyme schemes forcing syntactic contortion.
  3.  **Oulipian Constraint:** The Oulipo group explores how constraints generate new meaning. However, their work is predicated on *creation*, not translation. In your scenario, the constraint is not a generative engine for new poetry, but a preservative measure that inadvertently corrupts the semantic payload.
  4.  **Harold Bloom's 'Misprision':** You rightly allude to this. However, Bloomian misprision is a creative, psychological defence mechanism employed by a strong poet against a precursor. It is intentional and agonistic. The phenomenon you describe is often unintentional, a structural artifact of the translator's fidelity to form rather than a wilful reinterpretation.

  ### Delimiting the Phenomenon

  Since no precise term exists, this presents an opportunity for you to define one within your thesis. To distinguish this from plain mistranslation or deliberate adaptation, I propose delimiting the phenomenon via three necessary conditions. You might consider this a tripartite test for **Formal-Logical Inversion**:

  1.  **Micro-Defensibility:** Every local lexical or syntactic choice must be defensible in isolation. The translator cannot be accused of simple incompetence or ignorance of vocabulary. The error is not in the *word*, but in the *placement* necessitated by the form.
  2.  **Formal Causality:** The inversion must be demonstrably caused by the preservation of a formal constraint (rhyme, metre, stanzaic turn). If the form were relaxed, the logical priority would restore itself. This distinguishes it from general semantic drift.
  3.  **Macro-Incompatibility:** The global argument or illocutionary force of the target text must be logically incompatible with the source. It is not merely a shift in emphasis (which is inevitable in translation) but a reversal of truth conditions (e.g., a conditional denial becoming an assertion).

  ### Distinguishing from Related Concepts

  *   **Vs. Mistranslation:** Mistranslation implies a failure of competence. In your configuration, the translator displays high competence in prosody and lexicon, but fails in *structural semantics*. It is a systemic error, not a local one.
  *   **Vs. Adaptation:** Adaptation implies agency and intent. The translator chooses to alter the meaning for a new audience. In this phenomenon, the translator often believes they are being faithful; the reversal is a byproduct of the struggle to marry target syntax with source form.
  *   **Vs. Domestication (Venuti):** Domestication seeks to make the text read as if originally written in the target language. Your phenomenon often results in a text that *looks* foreign (due to rigid form) but *speaks* incorrectly. It is a 'faithful betrayal'.

  ### Proposed Nomenclature

  If you wish to coin a term for your dissertation, you require something that signals both the structural nature of the error and its semantic consequence. Consider the following options:

  1.  **Prosodic Peripeteia:** Borrowing from Aristotelian poetics, *peripeteia* denotes a reversal of circumstances. This captures the dramatic inversion of the argument caused by prosodic demands.
  2.  **Formalist Reversal:** A more descriptive, dry term that highlights the causality (Formalism) and the result (Reversal).
  3.  **Constraint-Induced Semantic Inversion (CISI):** This is functional and clear, suitable for a taxonomic classification, though perhaps less elegant.
  4.  **Structural Misprision:** Adapting Bloom's term but qualifying it as 'structural' to remove the psychological/intentional element.

  ### Recommendation for Your Thesis

  Given your focus on comparative poetics, I would recommend **Prosodic Peripeteia** or **Formal-Logical Inversion**. The former carries the necessary literary weight; the latter offers analytical precision.

  In your analysis of Marot, you might argue that this is a specific risk in translating from languages with flexible syntax (like French or Latin) into languages with fixed word order (like English). When the rhyme requires a specific sound at the line-end, and the English syntax requires the verb to precede the object, the translator may be forced to promote a subordinate clause to a main clause position solely to satisfy the rhyme. If that subordinate clause contains a negation or a condition, the entire logical weight of the stanza shifts.

  This is not merely a 'loss in translation'; it is a **generative error**. The form generates a meaning that negates the source. By defining this rigorously, you would be making a significant contribution to the poetics of constraint and translation ethics. It moves the discussion beyond the binary of 'faithful vs. free' and into the mechanics of how fidelity to *shape* can constitute infidelity to *sense*.

  I trust this provides the conceptual scaffolding you require to proceed. It is a formidable insight, and one that deserves precise naming.
