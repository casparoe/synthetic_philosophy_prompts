  Based on the dossier of verdicts you have provided, I can offer a diagnosis of R.'s theoretical commitments, a prediction for the Nadia/Tomas/Ines case, and a strategy for your presentation.

  ### 1. Diagnosis: What View is R. Holding?

  R. is **not** a Supervaluationist, despite your initial guess. The "smoking gun" is her refusal to call the distributed disjunction ("Either it will land heads or it will land tails") true. Standard Supervaluationism (e.g., Thomason) validates the principle that if a disjunction is settled (true on all histories), and the disjuncts exhaust the possibilities, the disjunction of the "will"-claims is often treated as true, or at least the logic preserves classical tautologies. More specifically, on a Supervaluationist account, "Will H" is false (not merely gappy) because H does not occur on *all* histories. If "Will H" is false and "Will T" is false, their disjunction is false. R. refuses to call it true, implying she treats the components as **neither true nor false (gappy)** and holds that disjunction does not resolve gaps.

  R. is **not** an Ockhamist (Linear Future). She explicitly denies that future contingents have a determinate truth value ("not an epistemic point").

  R. is an **Aristotelian Gap Theorist with Retrospective Settling.**
  *   **The Gap:** Future contingents lack a truth value until the world "narrows" (Vienna case, Coin case).
  *   **The Logic:** She employs a non-classical logic (likely Strong Kleene or a specific Gap logic) where $NT \lor NT = NT$. This explains the distributed disjunction verdict.
  *   **The Settling:** Truth values are assigned retroactively once the branch is actualized. This explains the Rain case ("I am wrong now... on Thursday there was nothing there yet") and the Vienna case (True once signed, NT before).
  *   **The Modality:** She treats "Might" as possibility (true on some branch) and "Will" as settledness (true only if the branch is unique/narrowed), rejecting the duality that $\text{Might} = \neg \text{Will}$.

  ### 2. Predictions for the Nadia/Tomas/Ines Case

