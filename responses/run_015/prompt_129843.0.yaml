      *   *Conway's Glider (No):* User says it's a pattern. But it *does* satisfy 1 (pattern sustains pattern). Clause 2? Can a glider be "sick"? No. Clause 3? Maybe.
      *   *String Quartet (Yes):* Interesting. Fits 1 (music sustains the performance), 2 (can play out of tune), 3 (maximal). *Critique:* This is an *event*, not an *object*. User treats it as "one thing doing something."
      *   *Crowd (No):* Fits 1 (no joint activity).
