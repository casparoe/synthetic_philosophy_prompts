      *   **Explain Why (5) is too strong:** Use the Perception Analogy. I don't need to know my optic nerve is firing to know I see a cup. I just need it to *be* firing. Same for testimony.
      *   **Address the "Risk":** It's not reckless. It's "default reasonable." We assume cooperation/truthfulness unless we have a "defeater" (reason to doubt). This is the "Anti-Reductionist" view (Burge, Lackey).
      *   **Epistemic Closure:** Clarify that this isn't exactly closure. It's about the *structure of justification*. Closure says knowledge transmits through deduction. This argument says knowledge requires *tracking the history* of deduction. That's different. It's more about Internalism.
      *   **Recommendation:** Keep (1). Reject (5). Embrace Externalism/Anti-Reductionism regarding testimony. This is the standard "Knowledge Norm" defense (Williamson would say you *do* know Canberra is the capital, even if you can't trace the chain, provided the chain is actually good).
