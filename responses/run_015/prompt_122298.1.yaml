          *   Premise 3: KNA applies to testimony-based assertion (I must know $p$).
          *   Premise 4: Testimonial knowledge depends on the source knowing $p$.
          *   Premise 5: To know $p$ via testimony, I need to know *that* the source knew $p$.
          *   Premise 6: This leads to an infinite regress (source's source, etc.).
          *   Premise 7: Nobody can trace the whole chain.
          *   Premise 8: Therefore, nobody can assert secondhand info (absurd).
          *   Conclusion: KNA is false; belief/truth is enough.
      *   **Study Partner's Critique:** The slip is between (3) and (5). The user is adding a second-order requirement (knowing *that* the source knows) which KNA doesn't demand.
      *   **User's Worry:** If they reject (5), does testimony work even when they don't know the source knew? Isn't that risky? They want to keep (1) (KNA) but (8) (the absurd conclusion) is troubling.
      *   **Questions:** Which step to give up? What's the cost? Is there a connection to epistemic closure?

  2.  **Evaluate the Argument Steps:**
      *   (1) KNA: Standard view (Williamson, etc.).
      *   (2) Assertoric Inheritance: Fact of life.
      *   (3) KNA applies to testimony: Plausible. If I assert $p$, I must know $p$, regardless of how I got $p$.
      *   (4) Testimonial knowledge conditions: Generally, for me to know $p$ via testimony, the testifier must know $p$ (no false lemmas, etc.).
      *   (5) **The Crux:** "To be justified inheriting, I need to know that my friend knew $p$."
          *   *Is this true?* This is the "reductionism" vs. "anti-reductionism" debate in testimony.
          *   *Reductionism (Hume):* Yes, I need positive reasons to trust the source (which might include knowing they know).
          *   *Anti-Reductionism (Reid, Burge, Lackey):* No, testimony is a basic source of knowledge. I can know $p$ via testimony *without* knowing *that* the source knows $p$, provided there are no defeaters.
      *   (6) Infinite Regress: Follows from (5).
      *   (7) Skeptical Conclusion: Follows from (6).
      *   (8) Absurdity: Follows from (7).
      *   (9) Reject KNA: The user's conclusion.

  3.  **Address the Study Partner's Point:**
      *   The partner is right. The KNA says "Assert $p$ only if you know $p$." It does *not* say "Assert $p$ only if you know *that you know* $p$."
      *   Step (5) conflates *knowing $p$* with *knowing the conditions of your knowledge*.
      *   This is related to the "KK Principle" (If you know, you know that you know). Most epistemologists reject KK.
      *   If I know $p$ via testimony, I satisfy (1). I don't need to verify the chain to satisfy (1). I just need to actually *be* in a state of knowledge.

