answer: |-
  TO: Programme Board, National Brain and Mind Research Programme
  FROM: Methods and Standards Subcommittee
  DATE: October 26, 2023
  SUBJECT: Recommendation on First-Person Reports for Call 2

  The Subcommittee submits this recommendation regarding the status of first-person reports in the second call for proposals. Our guidance is driven by the Program's stated success metric: a validated, clinically usable measure of conscious experience.

  **1. The Calibration Dilemma**
  To validate any neural or behavioral marker as a measure of consciousness, researchers must calibrate it against a ground truth. Currently, subject reports are the only available calibrators. In the proposed blindsight and no-report paradigms, excluding reports as evidence of experience creates a methodological circularity: we cannot validate a marker of consciousness without referencing consciousness as reported. Adopting a standing rule that demotes reports to mere texts—never authoritative about experience—renders the Program's success metric unreachable. We cannot certify a clinical measure of experience if experience itself is methodologically inaccessible.

  **2. Methodological Scruple vs. Ontological Thesis**
  We distinguish heterophenomenology as a *methodological scruple* from heterophenomenology as an *ontological thesis*.
  *   **Scruple (Methodological):** Do not take reports at face value; acknowledge they are question-dependent and partially constructed by the elicitation context. It is **settled** among experts that reports are sensitive to elicitation methods.
  *   **Thesis (Ontological):** Reports tell us only about a theorist's construct and never about experience itself. It is **genuinely contested** whether reports can veridically reflect experience.
  The Subcommittee is voting on methodology, not metaphysics. The scruple can be adopted without the ontological thesis. We recommend adopting the scruple only. This allows reports to serve as evidence while requiring rigorous control over elicitation.

  **3. Standards for Evidence**
  If reports are admitted as evidence, they must meet standards comparable to other measurement instruments. A validated elicitation procedure requires: (1) standardized interview protocols (e.g., structured explication); (2) documented interviewer training to minimize leading questions; and (3) consistency checks across contexts. Unstructured introspection does not meet this bar.

  **Rejected Consideration**
  We reject the proposal to adopt the strict heterophenomenological rule. The strongest consideration for this rule is the well-documented risk of confabulation and bias in introspective data. Untrained subjects often misdescribe experiences due to conceptual limitations or demand characteristics. However, this risk mandates methodological rigor, not the exclusion of the data source.

  **Recommendation**
  The Subcommittee recommends applicants treat first-person reports as evidentiary but theory-laden. Projects must justify their elicitation methods as validated instruments. We do not legislate specific phenomenological schools but require that any claim linking reports to experience demonstrates control over elicitation artifacts.

  \answer{Adopt-Scruple-Only}
