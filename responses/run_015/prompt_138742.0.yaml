answer: |-
  Your skepticism is well-founded. Your friend's blog post gets the *mechanics* of Updateless Decision Theory (UDT) roughly right, but it simplifies the "updating" part in a misleading way, and it presents a controversial normative judgment (that Counterfactual Mugging refutes the theory) as if it were an objective fact.

  Most importantly, **your friend is wrong about your test case.** A UDT proponent would not say "The Sim pays and the Real refuses." They would say "Both pay" or "Both refuse," because UDT treats the Sim and the Real as logically linked instances of the same algorithm.

  Here is a breakdown of what a researcher in this field would accept, what is a distortion, and how to resolve your test case.

  ### 1. "UDT says you should never update on your evidence."
  **Verdict: Distortion / Over-simplification.**

  This is the most common misunderstanding of UDT. A UDT agent does not walk around with its eyes closed. It *does* process observations.

  *   **What CDT/EDT do:** They start with a prior probability distribution over worlds. When they observe evidence $E$, they *update* that distribution to a posterior $P(World | E)$ and then choose the action that maximizes expected utility relative to that *posterior*.
  *   **What UDT does:** It starts with a prior. When it observes evidence $E$, it does *not* update the prior. Instead, it asks: "Given my prior, what *policy* (a function mapping observations to actions) would have maximized expected utility?" It then executes the action that policy dictates for observation $E$.

  **The Nuance:** The agent still conditions on $E$ to know *which* action the policy prescribes. It doesn't ignore the evidence; it just refuses to let the evidence change the *criterion* by which it judges success.

  **Analogy:** Imagine you are writing a computer program to play a video game before you turn the console on.
  *   **Updating:** You turn the console on, see a monster, update your belief about the level, and then decide what button to press.
  *   **UDT:** Before turning the console on, you write a script that says `IF monster THEN attack ELSE explore`. When you turn it on and see the monster, you don't "re-decide"; you just run the script. You reacted to the evidence, but the decision logic was fixed "updatelessly."

  ### 2. "UDT pays in Counterfactual Mugging... and since nobody sane would pay there the theory is refuted."
  **Verdict: Accurate description of behavior; Disputed conclusion.**

  *   **The Behavior:** Yes, UDT pays in Counterfactual Mugging. In this problem, a coin flip determines if you are asked for money. If Heads, you pay. If Tails, you get nothing, *but* the predictor would have given you a huge reward if it predicted you *would have paid* on Heads.
      *   CDT says: "I'm on the Tails branch. The money is already gone. Paying costs me $100 and gains nothing. I refuse."
      *   UDT says: "Before the coin was flipped, the optimal policy was 'Always Pay'. That policy yields the big reward. I must execute that policy now, even on the losing branch, to be the kind of agent that wins ex-ante."
  *   **The Refutation:** Your friend claims this refutes the theory because "nobody sane would pay." Researchers in this field (like Wei Dai, Eliezer Yudkowsky, Nate Soares) argue the opposite: **This is a feature, not a bug.**
      *   They define rationality as *winning* (maximizing actual utility), not *feeling justified ex-post*.
      *   If you refuse to pay, you are the kind of agent that doesn't get the big reward. If you pay, you are the kind of agent that does.
      *   Whether this is a "refutation" depends on your moral intuition about whether you should care about counterfactual branches where you don't exist. UDT says yes; standard intuition says no. It is not a mathematical error, but a philosophical clash.

  ### 3. "Functional Decision Theory is just a rename."
  **Verdict: Mostly Accurate.**

  Functional Decision Theory (FDT) is the branding used by MIRI (Yudkowsky/Soares) for a formulation very similar to UDT (originally by Wei Dai). FDT focuses more explicitly on "logical counterfactuals" and the output of the decision *function*, whereas UDT focuses on "policies" selected from a prior. For the purposes of your friend's blog post, treating them as the same thing is acceptable shorthand.

  ### 4. Your Test Case: The Sim and the Real
  **Verdict: Your friend is wrong. UDT says the Real should Pay.**

  This is the most critical part. Your friend's analysis relies on **Causal Decision Theory (CDT)** logic, not UDT logic.

  **The Setup:**
  1.  **Sim:** A simulation of you. Asked to pay $1k to give Real $100k.
  2.  **Real:** You. Told the Sim already decided. Asked to pay $1k (but the payout is already fixed by the Sim).

  **Your Friend's Claim (CDT Logic):**
  *   **Sim:** "I might be the Real. If I pay, the Real might get money. I should pay." (Or Sim pays because it's a sim).
  *   **Real:** "The Sim already decided. My choice cannot change the past. Paying costs me $1k and changes nothing. I refuse."
  *   **Result:** Sim pays, Real refuses. Real gets $100k for free.

  **The UDT Rebuttal:**
  UDT rejects the premise that "The Sim already decided" means the Sim's decision is independent of the Real's current decision.
  *   **Logical Correlation:** The Sim is a perfect scan of you. It runs the same source code (your brain/decision algorithm) on the same inputs.
  *   **The Logic:** If the Real's algorithm outputs "Refuse," then the Sim's algorithm *must have* output "Refuse" (because they are the same math). If the Real's algorithm outputs "Pay," the Sim *must have* output "Pay."
  *   **The Choice:** The Real is not choosing an action in isolation; the Real is choosing the output of the algorithm that *both* instances share.
      *   If Real chooses **Refuse**: Sim Refused -> Real gets $0. Real pays $0. Net: $0.
      *   If Real chooses **Pay**: Sim Paid -> Real gets $100k. Real pays $1k. Net: $99k.
  *   **Conclusion:** A UDT agent (Real) **Pays**.

  **Why it feels like magic:**
  It feels like magic because you are thinking causally ("The past is fixed"). UDT thinks logically ("The truth of mathematics is fixed"). Since the Sim's decision is a mathematical fact derived from the same algorithm as the Real's decision, the Real's current computation *logically determines* what the Sim did, even if the Sim ran yesterday.

  If the Real refuses, they are essentially saying, "I wish the Sim had paid, but I won't." UDT points out that you can't have it both ways. If you are the type who refuses, you are the type whose Sim refuses.

  ### Summary for your reply to your friend

  1.  **On Updating:** Tell him "Never updating" is misleading. UDT agents use observations to index into a pre-committed policy; they just don't update the *prior* used to select that policy.
  2.  **On Mugging:** Acknowledge UDT pays. Disagree that it's a refutation. It's a disagreement on whether rationality is about ex-ante optimization (winning) or ex-post justification (not regretting).
  3.  **On Your Test Case:** Tell him his analysis is CDT, not UDT. UDT asserts logical correlation between the Sim and the Real. If the Real refuses, the Sim refused. Therefore, to get the $100k, the Real must pay. The "free money" outcome is impossible for a UDT agent because it requires the same algorithm to output two different things.

  **Should you believe it?**
  That depends on whether you accept the premise of **logical correlation**. If you believe your decision now can logically (not causally) determine the output of a simulation that ran in the past, UDT is consistent. If you believe the past is strictly causally sealed off from the present regardless of logical identity, UDT will feel like magic. Most people working on AI alignment take the logical correlation view seriously because advanced AI systems will likely be able to simulate each other accurately.
