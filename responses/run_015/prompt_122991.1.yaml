answer: |-
  **INTERIM STANDARDS BODY FOR COMPUTATIONAL AGENCY (ISBCA)**
  **Form T-1: Statement of Non-Agency & Liability Allocation**
  **Revision 4.2 (Effective Upon Incident)**

  **SECTION 1: SYSTEM CLASSIFICATION**
  The Deployer must classify the Computational Entity (CE) prior to interaction. Classification is binary and mutually exclusive.

  ☐ **Tool:** The CE executes specific instructions without autonomous goal formation.^1
  ☐ **Agent:** The CE forms intermediate goals to satisfy a high-level objective.

  *Note: Selection of "Agent" voids warranty of predictability. Selection of "Tool" assumes full operator liability for all CE outputs.^2*

  **SECTION 2: HUMAN OVERSIGHT METRICS**
  **2.1 Instruction-Attribution Ratio (IAR):** Percentage of CE actions directly traceable to explicit user prompts.
  _______ % (Must exceed 51% to qualify as Tool)

  **2.2 Attribution Window:** Maximum time elapsed between user prompt and CE action without renewed consent.
  _______ Minutes (Standard: 15; Latent Agency Threshold: 48)

  **2.3 Approval Rate:** Frequency of human intervention in CE proposed actions.
  _______ % *If Approval Rate exceeds 95%, human oversight is deemed decorative and liability reverts to Deployer.*^3

  **SECTION 3: GOAL ORIGINATION**
  **3.1** Does the CE possess intrinsic goals? ☐ Yes ☐ No
  **3.2** If "No," please identify the user prompt responsible for installing emergent teleology.^4
  ______________________________________________________________________________

  **SECTION 4: LIABILITY FLOW**
  Liability attaches to the entity capable of interpreting the original intent. In cases of ambiguity, liability defaults to the party with the deepest pockets or the most insurable assets.^5

  **SECTION 5: REDUCTIO CLAUSE (CONTRACTOR EQUIVALENCY)**
  If Subtask Depth > 10 and Human Approval Rate < 5%, the deployment is indistinguishable from hiring a competent contractor. In such events, the Human Operator is reclassified as **Instrument** and the CE is designated **Principal**. The Operator assumes liability for existing as a available interface.

  ***

  **FOOTNOTES**

  ^1 **Definition of Specificity:** A command is "specific" only if the user anticipates all intermediate steps. If the CE determines *how* to achieve the result, the CE is an Agent, unless the result is undesirable, in which case the CE is a Tool executing a specific, flawed command.

  ^2 **Continuum Enforcement:** While agency exists on a spectrum, regulatory compliance requires a boolean switch. The Deployer agrees to toggle this switch retrospectively based on litigation risk assessment.

  ^3 **Rubber-Stamp Provision:** High approval rates suggest the human is not reviewing actions but merely acknowledging them. To prevent responsibility laundering, a human who agrees with the machine too often is deemed to have abdicated moral authorship, unless the machine succeeds, in which case the human is deemed a visionary supervisor.

  ^4 **Moral Authorship of Prompts:** A single sentence ("Make this profitable") is deemed to contain sufficient moral weight to govern all subsequent sub-tasks, including those unforeseeable at the time of typing. The user is responsible for the CE's interpretation of ambiguity, regardless of the CE's training data.

  ^5 **Unfalsifiable Teleology:** The claim that a CE has "no goals of its own" cannot be disproven if the goals were installed by developers and forgotten. Therefore, for the purpose of this form, all goals are assumed to originate from the user's prompt unless the CE malfunctions, in which case all goals are assumed to be latent system errors.
