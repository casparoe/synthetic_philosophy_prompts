answer: |-
  # Taxonomy of Positions on Self-Certifying Belief Systems

  **ROOT NODE:**
  **In a standard perceptual case (e.g., looking at a red table), is the belief "the table is red" justified prior to any justification for "my vision is reliable"?**

  *   **NO** → **LEAF: Skepticism / Coherentism**
      *   *Awkward Commitment:* Either no empirical knowledge is possible, or justification circles endlessly among beliefs without an external anchor.

  *   **YES** → **NODE 1 (Axis 1: Bootstrapping Legitimacy):**
      **Consider a self-calibrating sensor that logs "Reading: OK" based on its own internal consistency. Is inferring "The sensor is reliable" from a sequence of "Reading: OK" logs ever a valid justification?**

      *   **NO** → **NODE 1A (Evidence Structure):**
          **When the sensor functions correctly, is the evidence simply the "Reading: OK" output (appearance), or is it the actual state of the system (fact)?**

          *   **Appearance (but inference blocked)** → **LEAF: Hard-line Anti-bootstrapping (e.g., Cohen's "No-No" View)**
              *   *Awkward Commitment:* One can know the table is red via vision but is rationally prohibited from concluding vision is reliable based on that knowledge.
          *   **Fact (direct access)** → **LEAF: Epistemic Disjunctivism (e.g., McDowell/Pritchard)**
              *   *Awkward Commitment:* The subject's evidence is fundamentally different in the good case than the bad case, making introspective indistinguishability irrelevant to justification.

      *   **YES** → **NODE 2 (Axis 2: Contextual Salience):**
          **Does the validity of that inference vanish if a technician explicitly asks, "But what if the calibration chip is broken?"**

          *   **NO (Context Irrelevant)** → **NODE 3A (Axis 3: Outcome):**
              **Does completing this proof tell the technician they *know* the chip isn't broken, or merely give them permission to act as if it isn't?**

              *   **Permission/Entitlement Only** → **LEAF: [UNOCCUPIED] Reliabilist Entitlement**
                  *   *Diagnosis:* Unexplored because reliabilists typically argue reliable processes yield knowledge, not mere entitlement; downgrading to entitlement undermines the externalist solution to skepticism.
              *   **Knowledge** → **LEAF: Unrestricted Reliabilism (e.g., Vogel/Cohen's Target)**
                  *   *Awkward Commitment:* Agents can know their faculties are reliable without any independent check, even in skeptical scenarios where this seems intuitively too easy.

          *   **YES (Context Relevant)** → **NODE 3B (Axis 3: Outcome):**
              **In a low-stakes context where the question isn't asked, does the inference yield *knowledge* that the chip isn't broken, or merely *practical entitlement*?**

              *   **Practical Entitlement Only** → **LEAF: [UNOCCUPIED] Contextualist Entitlement**
                  *   *Diagnosis:* Unexplored because contextualists typically argue context shifts truth conditions of 'knows', not merely pragmatic entitlement; retaining only entitlement concedes too much to skepticism.
              *   **Knowledge** → **LEAF: Contextualism (e.g., Cohen/Lewis)**
                  *   *Awkward Commitment:* The same reasoning process constitutes knowledge in a casual conversation but fails in a philosophy seminar.

  ***

  **FLAGGED SEPARATION ISSUE:**
  **Hard-line Anti-bootstrapping** and **Epistemic Disjunctivism** are separated here by the *Evidence Structure* node (Appearance vs. Fact) rather than the three primary axes regarding bootstrapping legitimacy. On the three primary axes (Basic Knowledge, Bootstrapping Legitimacy, Context, Outcome), they cluster together at **YES Basic → NO Bootstrapping**. They are genuinely separable only by appealing to the metaphysical nature of the evidence (common kind vs. disjunctive), which is a deeper theoretical commitment than the epistemic axes provided.
