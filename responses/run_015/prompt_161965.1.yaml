      *(Self-Correction on Clinical Case):* The performativity aspect (prediction affects outcome) means the probability distribution $P(State | Signal)$ is not stable. This violates the standard Bayesian updating assumption where the signal is informative about a fixed state. This moves it into the realm of causal decision theory or reflexive systems.

