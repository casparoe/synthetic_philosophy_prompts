  2.  **Deconstruct the Philosophical Positions:**
      *   **Representational Realists (RR):** Believe interpretability methods (like probing, circuit analysis) find *real* things. These states have causal power and semantic content. The network *uses* these representations to compute.
      *   **Deflationary Instrumentalists (DI):** Believe "representation" is a user-relative tool for prediction. The ontology is just weights and activations. Attributing content is like using a map; the map isn't the territory. Superposition suggests the "representation" view is breaking down.

  3.  **Drafting Section 1: Agreed Claims:**
