      *   *DI View:* It shows the "representation" concept is fraying. It's a coding scheme optimized for loss, not a semantic structure.
      *   *Focus:* Ontological Status.
      *   *RR View:* States bear content independently of the observer (mostly).
      *   *DI View:* Content is observer-relative (Dennett/Ironist style).

  5.  **Drafting Section 3: Cruxes:**
      *   *Crux 1: Causal Explanation vs. Predictive Utility.*
          *   *Case:* Intervening on a "feature" (e.g., activation patching).
          *   *RR:* Intervention works *because* we targeted the real causal vehicle.
          *   *DI:* Intervention works because we found a causal lever; calling it a "representation" adds nothing to the causal story.
      *   *Crux 2: Superposition and Discrete Vehicles.*
          *   *Case:* Polysemantic neurons or superposition in toy models (Elhage et al.).
          *   *RR:* Representations are subspaces, not neurons. The geometry is the vehicle.
          *   *DI:* If the vehicle isn't discrete/local, "representation" is just a metaphor for dimensionality reduction.

  6.  **Refining Tone and Language:**
      *   Ensure the physicist background is respected (use terms like "degrees of freedom," "basis," "manifold").
      *   Avoid colloquialisms.
      *   Ensure the "Joint Statement" framing is clear (e.g., "We, the undersigned...").
