      *   *Claim 1 (Math):* Feedforward networks are deterministic functions (compositions of linear transforms and nonlinearities). No mystery there.
      *   *Claim 2 (Interpretability Success):* Methods like probing, attention visualization, and circuit tracing *do* yield predictive insights. We can find "circuits" that correlate with behaviors.
      *   *Claim 3 (Non-Stakes):* This isn't about consciousness or sentience. It's not about whether ANNs are "minds." It's about the ontology of the intermediate states.
      *   *Claim 4 (Causal Graph):* Both agree the causal structure is defined by the weights.

  4.  **Drafting Section 2: Disagreements Table:**
