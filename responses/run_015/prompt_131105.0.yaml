answer: |-
  # Joint Statement on the Ontological Status of Internal States in Deep Neural Networks

  **Issued by:** The Adversarial Collaboration on Neural Representationalism (ACNR)
  **Signatories:** The Representational Realist Working Group & The Deflationary Instrumentalist Working Group
  **Date:** October 26, 2023

  ### Preamble
  We, the undersigned researchers, represent two distinct philosophical interpretations of the internal mechanics of deep artificial neural networks (ANNs). While we agree on the mathematical formalism and the empirical utility of current interpretability techniques, we diverge on the ontological implications of those techniques. This document delineates our common ground, specifies our disagreements regarding the nature of "representation," and identifies the empirical and theoretical cruxes that will determine the future of this debate.

  ---

  ### Part I: Agreed Claims
  *The following propositions are accepted by both camps as settled matters of mathematics, engineering, or scope definition.*

  1.  **Formal Architecture:** We agree that standard feedforward and transformer-based networks are deterministic computational graphs composed of linear transformations and point-wise nonlinearities. The state of the network at any layer is fully described by a vector of activations in a high-dimensional space, transformed by weight matrices. There is no hidden variable or non-physical component involved in the forward pass.
  2.  **Empirical Success of Interpretability:** We agree that mechanistic interpretability techniques (e.g., activation patching, circuit tracing, probing classifiers, and dictionary learning) successfully identify substructures within networks that correlate robustly with specific inputs and outputs. Manipulating these substructures often yields predictable changes in network behavior.
  3.  **Exclusion of Consciousness:** We agree that this debate is not about machine consciousness, sentience, or moral status. The question is strictly whether the intermediate activation states function as *representational vehicles* (bearing content about the input/task) in a sense that is ontologically robust, or whether "representation" is exclusively a descriptor applied by external observers.
  4.  **Causal Sufficiency of Weights:** We agree that the causal power of the network resides entirely in the parameters (weights) and the activation dynamics. No additional "semantic force" acts upon the network from outside the physical (or digital) implementation.
  5.  **Utility of the Idiom:** We agree that using representational language (e.g., "the network detects edges," "this neuron encodes gender") is pragmatically useful for engineering, debugging, and communicating about model behavior, regardless of the underlying ontology.

  ---

  ### Part II: Disagreements Table
  *The following table contrasts our positions on the interpretation of the agreed-upon phenomena. Wording has been vetted by each side to ensure accurate characterization.*

  | Domain of Inquiry | Representational Realist Position | Deflationary Instrumentalist Position |
  | :--- | :--- | :--- |
  | **Ontological Status of Features** | Internal activation patterns (or directions in activation space) are **causally efficacious representational vehicles**. They bear content because the network's computational architecture relies on their semantic properties to minimize loss. | Attributions of content are **observer-relative heuristic tools**. The network processes signals, not symbols. "Content" is a projection imposed by the interpreter to compress the description of the input-output mapping. |
  | **Feature Superposition**<br>*(Where multiple features share the same neural substrate)* | Superposition indicates **distributed, high-density coding**. Representations are not local to single neurons but exist as linear subspaces. The overlap is a compression trade-off within a genuine representational system. | Superposition demonstrates the **breakdown of the representation concept**. If distinct "contents" interfere with one another within the same physical substrate, they are not distinct representations but merely entangled signal components optimized for loss, not truth. |
  | **Role of the Interpreter** | The interpreter **discovers** structures that exist independently of the analysis method (method-invariant). A feature exists even if we haven't probed it yet. | The interpreter **constructs** the representation through the choice of probe or basis. Different probing methods yield different "features," proving the features are not intrinsic to the network. |
  | **Explanation vs. Description** | Identifying a representation provides a **causal explanation**. Knowing *what* the network represents explains *why* it behaves as it does. | Identifying a representation provides a **predictive description**. It allows us to guess the output, but the actual explanation is purely the mathematical transformation of vectors. |

  ---

  ### Part III: Cruxes of the Debate
  *We identify two specific points of contention where future empirical work or philosophical argumentation could shift the consensus. For each crux, we specify a concrete case and how each side evaluates it.*

  #### Crux 1: Causal Explanation vs. Predictive Utility
  **The Question:** Does attributing semantic content to an internal state add explanatory power beyond describing the causal flow of activation vectors?

  **Concrete Case:** **Activation Patching on a "Name Identity" Circuit.**
  In a transformer trained on biographical data, researchers identify a specific set of attention heads and MLP neurons that, when their activations are swapped (patched) from a run involving "Barack Obama" to "Michelle Obama," cause the model to correctly output the spouse's name. The Realist identifies this as manipulating the "Identity Representation."

  *   **Representational Realist Evaluation:**
      *   **Verdict:** Causally Explanatory.
      *   **Argument:** The intervention succeeds *because* we targeted the specific semantic content (Identity). If the state were merely a vector of numbers without content, the success of the patch would be coincidental. The fact that semantic coherence (Obama $\to$ Michelle) is preserved under intervention proves the internal state carries that specific content as a causal property.
  *   **Deflationary Instrumentalist Evaluation:**
      *   **Verdict:** Predictively Useful only.
      *   **Argument:** The intervention succeeds because we identified a causal lever in the high-dimensional manifold. Describing that lever as "Identity" is a shorthand for "the subspace of activations that correlates with name tokens." The explanation is complete without invoking content; adding "representation" is an anthropomorphic overlay that does not change the causal graph.

  #### Crux 2: Superposition and Discrete Representational Vehicles
  **The Question:** Does the phenomenon of superposition (polysemanticity) undermine the claim that networks possess discrete representational vehicles?

  **Concrete Case:** **Interference in Toy Model Superposition (Elhage et al., 2022).**
  In a toy model where the dimensionality of features exceeds the dimensionality of the network layer, features are encoded in non-orthogonal directions. When two features are active simultaneously, they create interference noise that degrades the fidelity of both.

  *   **Representational Realist Evaluation:**
      *   **Verdict:** Evidence of Distributed Representation.
      *   **Argument:** Physical brains and digital systems alike must compress information. Superposition shows that representations are geometric subspaces rather than "grandmother cells." The interference is a measurable cost of compression within a real representational system, analogous to crosstalk in physical circuits, not evidence that the representations are unreal.
  *   **Deflationary Instrumentalist Evaluation:**
      *   **Verdict:** Evidence of Projective Interpretation.
      *   **Argument:** If a "representation" cannot be individuated without interference from other "representations" sharing the same vehicle, the term loses its discrete ontological grip. This confirms that the network is performing lossy signal processing. The "features" we extract are merely the most convenient basis for *us* to describe the signal, not discrete entities the network maintains. The interference proves the network does not treat them as distinct semantic units.

  ---

  ### Closing Remark
  We acknowledge that the mathematical structure of feedforward computation is settled, but the philosophical interpretation of that structure remains open. We commit to refining these cruxes through further collaborative experimentation, specifically focusing on interventions that dissociate semantic coherence from causal efficacy.

  **Signed,**

  *The Representational Realist Working Group*
  *The Deflationary Instrumentalist Working Group*
