      *Drift Trigger:* Repair requires engineering sprint.
      *Final Classification (Tier 3):* User possesses a desire to be frustrated and attributes agency to a script. The pattern of anger is real because it predicts the user will churn without costing us engineering hours.

      Agents are authorized to shift from Physical to Intentional mid-thread. Once the user is framed as an intentional agent holding incorrect beliefs, the burden of adaptation shifts to the user.

      **4.0 REAL PATTERNS AND VALIDATION**

      Per company policy, a "Real Pattern" is defined as any explanatory model that yields projectible predictions regarding cost avoidance.
      *   If blaming hardware predicts a payout, the hardware failure is a Real Pattern.
      *   If blaming user intent predicts compliance, the user error is a Real Pattern.

