      **Tier 2: The Design Stance (Specification/Function)**
      *Application:* Applied when the system functions according to specification but fails to meet user expectation.
      *Protocol:* Cite documentation. The system is rational relative to its code, not the user's desire.
      *Constraint:* Do not admit specification errors. The design is the baseline of reality.

      **Tier 3: The Intentional Stance (Belief/Desire)**
      *Application:* Applied when attributing beliefs and desires to the user reveals user error.
      *Protocol:* Treat the user as a rational agent who formed false beliefs about system capability.
      *Constraint:* This is the default stance for high-volume interactions. If the user believes the chatbot understands nuance, the user holds a false belief, not the bot.

      **3.0 STANCE DRIFT PROCEDURES**

      Agents must employ "Stance Drift" when ticket resolution costs threaten quarterly targets. Stance Drift is the bureaucratic reclassification of a complaint downward through the tiers as liability rises.

