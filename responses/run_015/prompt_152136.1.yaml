      *   *Marcus (Direct Normativity/Opacity Critique):* Believes that if parts of our reasoning are opaque to each other (modular), we can't truly have a "unified" idealization. The conflicts aren't just noise; they are structural fractures. We should judge actions/outcomes directly rather than relying on a flawed procedural ideal.
      *   *Deliberative Echo:* The specific mechanism of conflict. Subsystem A says "do X" based on local rules, Subsystem B says "do Y" based on global norms, and A doesn't know *why* B says Y.

