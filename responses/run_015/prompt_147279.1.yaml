prompt: |-
  hey, i'm taking a course on philosophy of social science and we're deep into Weber's Protestant Ethic thesis, but i'm stuck on the conceptual problem, not the history. my study group argued about whether culture can literally cause something like capitalism, or if that's just a shorthand for millions of people having the same belief. it feels like Weber says the protestant work ethic mattered only because people interpreted their labor through that specific religious lens - so isn't the real cause just those internal interpretations?

  i want to understand the actual conceptual issue: what does it take for a shared meaning-system to be causally responsible for a macro outcome without either reducing to individual psychology or treating values like physical forces. i also keep seeing references to 'structuring causes' versus 'triggering causes' in social explanation, and i'm wondering if Weber needs culture to be a structuring cause - something that sets up the conditions for interpretation - rather than a direct trigger, to avoid the reduction problem. can you lay out how that distinction works here and whether downward causation from culture is actually required? please write in american english, and don't give me a bibliography since i don't have library access right now anyway. also sorry if my question is confused - i think i'm recieveing the wrong idea about interpretation being the only causal link.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Philosophy of Social Science course, specifically focusing on Max Weber's *The Protestant Ethic and the Spirit of Capitalism*.
      *   **Core Problem:** The conceptual issue of cultural causation. Can "culture" cause macro outcomes (like capitalism), or is that just shorthand for individual beliefs?
