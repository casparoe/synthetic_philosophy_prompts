answer: |-
  The stall is not merely verbal, nor is it a fundamental impasse about bedrock values. It is a **substantive disagreement masquerading as a textual critique**, rooted in competing, unstated models of moral psychology. Both camps agree on the goal (moral improvement) and the object (hagiography), but they diverge on the *mechanism of transmission*.

  Here is the structural diagnosis:

  **1. The Equivocation on "Learning"**
  The debate stalls because "moral learning" is being used to describe two distinct cognitive operations:
  *   **Mirror Camp (Procedural):** Learning is *technical acquisition*. Virtue is a skill set (a *techne*). To learn a skill, you need to see the causal chain of actions, including errors and corrections. If the text hides the "messy middle," it withholds the necessary data for replication.
  *   **Ladder Camp (Teleological):** Learning is *affective orientation*. Virtue is a disposition of desire (a *hexis*). To align desire, you need a clear, unblemished target. The "messy middle" is noise that distracts from the normative pull of the ideal.

  When the Mirror camp says "This corrupts," they mean "This makes replication impossible." When the Ladder camp says "This teaches," they mean "This makes aspiration possible." They are not contradicting each other's facts; they are contradicting each other's *functional definitions of pedagogy*.

  **2. The Hidden Empirical Claim**
  Both sides are making a falsifiable claim about human psychology, though they present it as hermeneutics:
  *   **Mirror Claim:** Human mimesis requires *causal transparency*. We copy mechanisms, not just outcomes. (Empirical basis: Social Learning Theory).
  *   **Ladder Claim:** Human motivation requires *normative opacity*. We are drawn by ideals, not manuals; too much detail dilutes the emotional charge. (Empirical basis: Idealization Theory / Moral Elevation).

  The debate is stuck because neither side is testing the psychological premise. They are arguing over Plutarch to avoid arguing over the human mind.

  **3. The Resolution Vector**
  The disagreement is resolvable if "moral learning" is treated as a **developmental sequence** rather than a monolithic state.
  *   **Hypothesis:** The Ladder works for *novices* (who need to know *what* to want), while the Mirror works for *practitioners* (who need to know *how* to do it).
  *   **Progress Condition:** The debate dissolves if empirical moral psychology demonstrates that moral acquisition is stage-dependent. If data shows that early moral development relies on idealization (Ladder) but advanced moral reasoning requires causal modeling (Mirror), then hagiography is neither universally corrupting nor universally teaching—it is *phase-specific*.

  **4. Why it feels "Bedrock"**
  It feels like a clash of intuitions because both mechanisms exist in human cognition. We *do* need heroes to love (Ladder), and we *do* need peers to copy (Mirror). The stall persists because both camps universalize their partial truth. The Mirror camp assumes all learners are ready for technique; the Ladder camp assumes all learners need vision.

  **Conclusion**
  This is not hopeless. It is a category error regarding the *stage* of the learner. To move it, you must stop asking "Does hagiography teach virtue?" and start asking "Which cognitive mechanism drives virtue at which stage of development?"

