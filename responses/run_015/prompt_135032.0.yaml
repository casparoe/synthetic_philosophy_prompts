      *   **Problem:** Data is scarce (no historical failure rates). Current practice of guessing a single number is dishonest/unstable. Using ranges leads to "reversion to the mean" (midpoint used as truth) or confusion when ranges widen upon learning more (the "burrow" problem).
      *   **Resources:** Small team (3-4 people), limited stats knowledge (school level), limited time (half-day per asset/year).
      *   **Goal:** A practical, robust procedure to handle uncertainty, aggregate expert opinion, make decisions despite overlapping ranges/straddling thresholds, handle correlated failures, and report to the funding body without lying or deluding themselves.
      *   **Tone:** British English, practical, honest, not softening uncomfortable conclusions.

  2.  **Deconstruct the Request:**
      *   **Procedure Steps:**
          1.  Eliciting the range (question framing, betting analogy?).
          2.  Combining ranges (disagreement handling).
          3.  Decision making (overlapping ranges, straddling BCR=1).
          4.  Correlated failures (multiple assets failing together).
          5.  Reporting (single number for spreadsheet vs. internal truth).
          6.  Handling "widening uncertainty" (the burrow case).
          7.  Handling "total ignorance" (0-100%).
          8.  Flagging unresolved issues (more data vs. value judgment).
      *   **Case Studies:** Run the procedure on three specific cases (Embankment/Village, Two Pumps, Burrow Embankment). One must yield an uncomfortable result.
      *   **Meta-Commentary:** Confidence levels on controversial recommendations, identifying the least certain point.
      *   **Style:** British English, gloss technical terms.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   *Step 1: Eliciting the Range.* The betting analogy is classic decision analysis (De Finetti). It forces concrete commitment. *Verdict:* Keep it, but simplify. Ask: "At what odds would you *just* take the bet?"
      *   *Step 2: Combining Ranges.* Simple averaging is dangerous if ranges don't overlap. If they don't overlap, there's a fundamental disagreement on mechanism. Need a "consensus range" (union of extremes) but flag the disagreement.
      *   *Step 3: Decision Making (BCR).* Calculate BCR for Low, Mid, and High probabilities.
          *   If Low BCR > 1: Do it (Robust).
          *   If High BCR < 1: Don't do it (Hopeless).
          *   If Straddling 1: This is the danger zone. Need a "Precautionary Principle" or "Value of Information" check.
      *   *Step 4: Correlated Failures.* This is hard for non-stats people. Keep it simple: "If one goes, do they all go?" If yes, treat as a single combined asset cost.
      *   *Step 5: The Spreadsheet Number.* This is the ethical crux. Putting the midpoint lies. Putting the low end underfunds. Putting the high end might be rejected. *Solution:* Put the number that reflects the *decision* made, but annotate internally. Actually, the prompt asks what single number to give. If the funding body demands a single number, giving the "conservative" (high risk) number maximizes safety but might fail BCR. Giving the "expected" (midpoint) is standard but misleading. *Better approach:* Use the midpoint for the form, but attach a "Uncertainty Flag" in the internal record. Wait, the prompt asks how to stop it being mistaken for the estimate. *Idea:* Use the number required for the *decision*, but label it "Planning Assumption" internally, not "True Probability".
      *   *Step 6: Widening Uncertainty.* This is the "Paradox of Information." Acknowledge it. It means the model was wrong. The procedure must allow for "Pause and Investigate" rather than "Decide Now."
      *   *Step 7: Total Ignorance.* If 0-100%, BCR is meaningless. Action: Emergency monitoring or "Minimum Viable Protection."

  4.  **Refining the "Widening" Problem:**
      *   The user is right: finding burrows increases known risk (upper bound) but also makes the lower bound more secure (we know where the weakness is). Actually, the prompt says the bottom moved down (1%) and top moved up (40%). This means *variance* increased.
      *   Standard stats says more info = less variance. But in engineering/risk, finding a new failure mode *increases* the space of possibilities.
      *   *Procedure fix:* If the range widens significantly, trigger a "Value of Information" calculation. Is it worth spending money to narrow it before spending money on the fix?

  5.  **Developing the Case Studies:**

      *   *Case 1 (Village Embankment):*
          *   Cost: £400k. Benefit: £4m.
          *   Prob: 2% - 10%.
          *   Expected Loss (Low): £4m * 0.02 = £80k. BCR = 80/400 = 0.2.
          *   Expected Loss (High): £4m * 0.10 = £400k. BCR = 400/400 = 1.0.
