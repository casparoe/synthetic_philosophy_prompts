answer: |-
  **The Case**
  Dr. Aris, a senior attending, faces a triage crisis: she must either micromanage a complex procedure herself or delegate it to Resident Vance. The proposition $p$ is "Vance is competent to handle this." The evidence is insufficient: Vance is trained but untested under this specific pressure, placing his success rate at a statistical coin-flip. Aris must decide now (forced), the patient's life hangs on the outcome (momentous), and Vance is a viable candidate (live). If Aris *believes* $p$, her physiological stress markers remain low, signaling calm to Vance, who regulates his own anxiety via her affective cue; the procedure succeeds. If Aris merely *accepts* $p$ (acting as if she trusts him while privately doubting), the cognitive load of maintaining the policy against her doxastic state generates micro-tensions and cortisol leakage. Vance detects this incongruence, panics, and fails. The truth of $p$ (Vance's underlying capacity) is fixed independently of Aris's mind, but the *realization* of that capacity requires Aris's genuine belief to stabilize the environment.

  **Analysis**

  **Clifford's Rule:** Clifford forbids Aris from believing $p$. Because the evidence is insufficient (the 50/50 stats), believing $p$ is a violation of epistemic duty. For Clifford, the morality of the belief is determined solely by the evidential support, not the consequences. To believe without evidence is to cultivate a habit of credulity that endangers society in the long run, even if it saves a patient today.

  **James's Argument:** James licenses the belief. The option is live, forced, and momentous. Since the evidence is logically insufficient to decide the matter (the stats don't dictate *this* case), the passional nature—the desire to save the patient and mentor Vance—rightfully tips the scale. Waiting for sufficient evidence (waiting for Vance to be tested) destroys the opportunity (the patient dies).

  **The Belief-versus-Acceptance Move:** The Evidentialist argues Aris need not *believe* $p$; she need only *accept* $p$ for the sake of action. She can voluntarily adopt the policy "treat Vance as competent" without changing her credence. This preserves epistemic integrity (she acknowledges the risk) while securing the practical benefit (she delegates).

  **The Breakdown Point:** This route breaks at the mechanism of **affective leakage**. Acceptance is a voluntary, second-order policy that requires cognitive monitoring to maintain the gap between what one accepts and what one believes. Belief is a first-order state that requires no such monitoring. In high-stakes interpersonal regulation, the cognitive overhead of "acting as if" generates the very stress signals that undermine the subordinate's performance. The good (Vance's calm) is causally linked to Aris's *congruence*, which acceptance cannot provide because acceptance is inherently non-congruent with doubt.

  **Isolated Feature:** The feature doing the work is **Doxastic Transparency**. The payoff is available only to belief because the partner (Vance) can read the agent's (Aris's) doxastic state through non-verbal channels that are impervious to voluntary control.

  **If Stripped Out:** If you strip out the interpersonal element (e.g., Aris supervises via audio-only, or Vance is a robot), the leakage vanishes. Acceptance becomes sufficient because the cognitive load no longer impacts the outcome. The case collapses back into a standard pragmatic justification where belief is unnecessary.

  **Strongest Cliffordian Reply:** "You are trading long-term calibration for short-term gain. By allowing herself to believe $p$ now, Aris corrupts her sensitivity to evidence. Next time, the leakage won't matter, but her belief will persist even when Vance is *actually* incompetent, leading to a fatal error that genuine evidential scrutiny would have prevented. The 'transparency' benefit is a local shortcut that degrades the global reliability of her judgment."

  **Name for the Condition:** **The Transparency Condition** (or **Doxastic Transparency**). This names the requirement that the agent's mental state must be causally efficacious *through* its being transparent to the environment, a property acceptance lacks due to its voluntary, simulated nature.
