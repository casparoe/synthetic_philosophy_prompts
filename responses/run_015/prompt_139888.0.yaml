answer: |-
  1. Does "water" carry *any* descriptive condition attached to it, even just to fix reference?
      *   **No** → **Leaf 1**
      *   **Yes** → 2

  2. "Zembla" stipulation (H₂O here, XYZ if not). In a counterfactual world where the watery stuff is XYZ, does "zembla" denote XYZ?
      *   **No** (Actual-Anchored) → 3
      *   **Yes** (World-Relative) → 5

  3. Researcher in windowless lab writes "sample boiling now" at the moment of boiling. Is the truth of this settled by her evidence alone?
      *   **No** (Requires External Context) → 4
      *   **Yes** (Internal Evidence Suffices) → 4

  4. When different people say "I am here," does the *thought* expressed change, or just the truth?
      *   **Thought Changes** → 7
      *   **Truth Changes** → 7

  5. Can you coherently describe a scenario where water is not H₂O, even if it is metaphysically impossible?
      *   **No** → 9
      *   **Yes** → 6

  6. Could the "zembla" stipulator know "zembla is H₂O" just by understanding the stipulation?
      *   **No** → 9
      *   **Yes** → 8

  7. Isotopic drift chain. Is there a specific link where reference snaps?
      *   **Yes** → 9
      *   **No** → 9

  8. In the armchair scenarios you imagine, must you specify *who* is in them to settle truth?
      *   **Yes** → 9
      *   **No** → 9

  9. Does distinguishing these two dimensions *explain* why some truths are necessary but a posteriori, or does it just label them?
      *   **Just Labels** → **Leaf**
      *   **Explains** → **Leaf**

  ***

  **Leaf 1: Direct Reference (Soames)**
  *   **Bitstring:** 1-No
  *   **Steelman:** Preserves the intuition that names and natural kind terms latch onto the world directly, without descriptive mediation.
  *   **Awkward Commitment:** Must treat "Hesperus is Phosphorus" as a brute modal fact rather than something explicable via semantic structure.

  **Leaf 2: Indexical Semantics (Kaplan)**
  *   **Bitstring:** 1-Yes, 2-Yes, 3-Yes, 4-Thought, 9-Explains
  *   **Steelman:** Captures the intuitive difference between the content of "I am here" and its truth conditions across contexts.
  *   **Awkward Commitment:** Struggles to accommodate empty names or terms that lack a clear context of utterance.

  **Leaf 3: Indexical Deflationist**
  *   **Bitstring:** 1-Yes, 2-Yes, 3-Yes, 4-Thought, 9-Labels
  *   **Steelman:** Accepts the utility of the two-dimensional map without committing to it as a metaphysical explanation of modality.
  *   **Awkward Commitment:** Risks making the framework a mere notation system with no predictive power over semantic disputes.

  **Leaf 4: Contextual Proposition (Stalnaker-Sharp)**
  *   **Bitstring:** 1-Yes, 2-No, 3-No, 4-Truth, 7-Yes, 9-Explains
  *   **Steelman:** Treats assertion as the elimination of possibilities, keeping the proposition constant while the context shifts.
  *   **Awkward Commitment:** Commits to a sharp, perhaps arbitrary, cutoff point in the isotopic drift chain where reference snaps.

  **Leaf 5: Contextual Proposition (Stalnaker-Vague)**
  *   **Bitstring:** 1-Yes, 2-No, 3-No, 4-Truth, 7-No, 9-Explains
  *   **Steelman:** Accommodates the vagueness of natural language reference without positing hidden precision in the world.
  *   **Awkward Commitment:** Must accept that some assertions lack a determinate truth value in borderline cases.

  **Leaf 6: Contextual Deflationist**
  *   **Bitstring:** 1-Yes, 2-No, 3-No, 4-Truth, 9-Labels
  *   **Steelman:** Uses the apparatus to clarify communication without reifying the "diagonal" as a distinct semantic object.
  *   **Awkward Commitment:** May lack the resources to explain why certain a priori truths feel necessary.

  **Leaf 7: Epistemic Two-Dimensionalism (Chalmers-Centered)**
  *   **Bitstring:** 1-Yes, 2-Yes, 5-Yes, 6-Yes, 8-Yes, 9-Explains
  *   **Steelman:** Unifies epistemic and metaphysical possibility by treating the first dimension as a space of centered scenarios.
  *   **Awkward Commitment:** Requires accepting that some epistemically possible scenarios are metaphysically impossible.

  **Leaf 8: Epistemic Two-Dimensionalism (Chalmers-Uncentered)**
  *   **Bitstring:** 1-Yes, 2-Yes, 5-Yes, 6-Yes, 8-No, 9-Explains
  *   **Steelman:** Maintains the epistemic reading without the ontological cost of centering every scenario on a subject.
  *   **Awkward Commitment:** Struggles to account for indexical knowledge like "I am here now" within the uncentered framework.

  **Leaf 9: Rationalist Physicalism (Jackson)**
  *   **Bitstring:** 1-Yes, 2-Yes, 5-No, 9-Explains
  *   **Steelman:** Secures the a priori entailment of the macroscopic by the physical without invoking impossible worlds.
  *   **Awkward Commitment:** Must deny that "water is not H₂O" is even coherently describable, which clashes with modal intuitions.

  **Leaf 10: Empiricist Two-Dimensionalism**
  *   **Bitstring:** 1-Yes, 2-Yes, 5-Yes, 6-No, 9-Explains
  *   **Steelman:** Allows world-relative reference without committing to a priori knowledge of natural kind identities.
  *   **Awkward Commitment:** Loses the explanatory link between conceptual competence and modal knowledge.

  **Leaf 11: Epistemic Deflationist**
  *   **Bitstring:** 1-Yes, 2-Yes, 5-Yes, 6-Yes, 9-Labels
  *   **Steelman:** Accepts the full Chalmersian apparatus but treats it as a tool for organizing epistemic states rather than grounding modality.
  *   **Awkward Commitment:** Leaves the metaphysical source of necessity unexplained by the semantic framework.

  **Leaf 12: Empiricist Deflationist**
  *   **Bitstring:** 1-Yes, 2-Yes, 5-Yes, 6-No, 9-Labels
  *   **Steelman:** Combines a world-relative reference fixer with a modest view of what the framework can achieve.
  *   **Awkward Commitment:** Risks collapsing into a standard Kripkean view with extra notation.

  ***

  ### Unreached Verdict Combinations

  *   **Actual-Anchored + World-Relative Reference (1-No, 2-Yes):** *Incoherent.* One cannot hold that reference is fixed solely by the actual world while simultaneously holding that the term denotes differently in counterfactual worlds based on local conditions.
  *   **Internal Evidence + Truth-Changes (3-Yes, 4-Truth):** *Stable but Unattractive.* This view claims the researcher knows the truth a priori, but that the thought expressed is constant across speakers. It implies a form of solipsistic propositionalism that few have defended.
  *   **Impossible Scenarios + No A Priori Knowledge (5-Yes, 6-No):** *Merely Unexplored.* (Reached by Leaf 10/12). A view here would need to argue that while we can *imagine* water being XYZ, our conceptual competence grants no armchair authority over the identity, perhaps due to a gap between conceivability and epistemic justification.

  ### Indistinguishable Leaves

  **Leaf 3 (Indexical Deflationist) and Leaf 11 (Epistemic Deflationist)**
  *   **Flag:** These leaves are separated in the tree by the "Zembla Reference" node (2), but if a reader answers "Yes" to Node 2 (World-Relative) yet treats the framework as merely labeling (Node 9), they land on Leaf 11. If they answer "Yes" to Node 2 but are routed through the Indexical path (Node 3/4), they land on Leaf 3.
  *   **Separating Question:** "When you say 'I am here,' is the *reason* it is a priori true because of the word 'I' (indexical) or because of the scenario description (epistemic)?"
  *   **Note:** If the reader sees no difference between indexicality and epistemic centering, these views are functionally identical for their purposes.

  **Leaf 4 (Stalnaker-Sharp) and Leaf 5 (Stalnaker-Vague)**
  *   **Flag:** Separated only by the Drift case (Node 7).
  *   **Separating Question:** "If we added a precise measurement of isotopic ratio to the drift case, would that force a reference snap?"
  *   **Note:** Many Stalnakerians regard the sharp/vague distinction as a pragmatic feature of use rather than a semantic one, making these leaves potentially identical in commitment.
