answer: |-
  You have stumbled onto one of the most famous problems in contemporary political philosophy. You're basically recreating the argument Harry Brighouse and Adam Swift make in their book *Family Values*. They argue exactly what you did: if luck egalitarianism is true, the family is a threat to justice.

  You are right to feel cornered. Your logic is sound, but your **categorization** is too blunt. You are treating all "advantages" as the same commodity, which forces you into the "ban bedtime stories" conclusion.

  Here is the exit. You do not need to kill (1) or (6). You need to kill the inference in **(5)** by refining **(2)**.

  ### 1. Which step to kill?
  **Kill the equivalence in Step (2) and the inference in (5).**

  Your error is assuming that because two things share a *moral source* (luck), they must share a *political remedy* (taxation/bans). This is false.

  Money and Bedtime Stories are both "unearned advantages," but they belong to different **categories of goods**.
  *   **Money/Inheritance** is a *positional, rivalrous resource.* It converts directly into political power and market dominance. It is measurable, transferable, and finite.
  *   **Love/Stories/Genes** are *relational, non-rivalrous goods.* They constitute the relationship itself. They are not easily measurable, and my kid being loved does not inherently subtract from your kid being loved (unlike capital accumulation).

  **The Fix:**
  Modify your principle from "Justice says luck shouldn't decide outcomes" to "Justice says luck shouldn't decide outcomes **via convertible capital.**"

  You argue that the state has a compelling interest in preventing the *dynastic accumulation of power* (money), but lacks the legitimacy to regulate the *intimacy of the family unit* (stories).

  ### 2. Why Money *Is* Special (Answering your fear)
  You said: *"If I drop (2) I have to explain why money is special, and I don't have a good answer for that."*

  Here are three answers you can use in-round. Money is special because:

  1.  **Rivalry & Zero-Sum Dynamics:** Capital is rivalrous. If one family hoards billions, that is capital *not* circulating in the economy or available for public investment. A bedtime story is non-rivalrous. Regulating capital levels the playing field; regulating love destroys the game.
  2.  **Privacy & Enforcement:** To tax inheritance, the state audits a bank. To tax bedtime stories, the state must install microphones in your bedroom. The *cost to liberty* of enforcing equality on money is low; the cost to enforce equality on parenting is totalitarian. You can keep (1) by arguing that Justice is constrained by Liberty.
  3.  **The "Family Autonomy" Exception:** Liberal democracy grants the family a protected sphere. We accept *some* inequality (like bedtime stories) as the price of preserving the institution of the family. We do not accept *dynastic wealth* because that threatens the institution of democracy.

  ### 3. Is your Partner's "Level Up" a Dodge?
  Your partner suggests **Sufficientarianism** (ensure everyone has enough) rather than **Strict Egalitarianism** (ensure everyone has the same).

  **Is it a dodge?**
  No, it's a standard philosophical pivot. But your worry is correct: if you frame it as "The state must make sure every kid gets the *same* benefit," you end up forcing parents to maximize enrichment.

  **How to save it:**
  Frame "Level Up" as **Public Provision**, not **Private Coercion**.
  *   **Bad Framing:** "The state should force dads to read more." (This leads to your nightmare scenario).
  *   **Good Framing:** "The state should provide high-quality public preschool and libraries so that the *absence* of a bedtime story doesn't ruin a kid's life."

  **Does (4) (The Swap Test) survive?**
  Only if you modify it. The Swap Test shouldn't be "Claw back the difference." It should be "Ensure no one falls below the random average."
  *   **Old Swap Test:** You had $1M, random kid had $0. State takes $500k.
  *   **New Swap Test:** You had bedtime stories, random kid had none. State gives the random kid preschool. We do **not** take away your stories.

  This preserves (1) (Luck is the problem) and (6) (Don't ban stories) by changing the *mechanism* of justice from **confiscation** to **floor-setting**.

  ### 4. How to argue this in the round
  If the Neg reads your own logic back at you ("Why tax money but not love?"), here is your script:

  > "The Neg is confusing **moral arbitrariness** with **state actionability**. Yes, both wealth and love are unearned. But the state's job is to manage **public resources**, not **private relationships**.
  >
  > Wealth is a public tool; it buys laws, influence, and market control. When wealth becomes hereditary, democracy breaks. That's why we tax it.
  >
  > Love is a private good. It doesn't buy legislation. To equalize love, the state would have to destroy the family. To equalize wealth, the state just audits a trust.
  >
  > We accept some luck (like who reads to you) because the alternative is totalitarianism. We reject other luck (like who owns the factory) because the alternative is oligarchy. Our plan targets the oligarchy, not the family."

  ### Summary of the Exit
  1.  **Keep (1):** Luck is the moral problem.
  2.  **Keep (6):** State-raised kids are immoral.
  3.  **Modify (2):** Not all luck is *actionable*. Distinguish **Capital** (rivalrous, public impact) from **Care** (non-rivalrous, private impact).
  4.  **Adopt Partner's "Level Up":** But frame it as **Public Floors** (state gives resources to the disadvantaged), not **Private Ceilings** (state stops parents from loving).

  This gets you out of the corner. You admit the logic holds for *resources*, but draw a bright line at *relationships*. That is a defensible, standard liberal position.
