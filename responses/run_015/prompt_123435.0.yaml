      *Correction on Specific 3:* The user asks about verificationism surviving when latents are real but unidentifiable (like mixture components). I need to clarify that in PoM, the doubt isn't about label swapping (mixture components), it's about the *existence* of the latent variable itself in the other agent's graph.

      *Correction on Specific 2:* 1st/3rd person. Is it Policy vs Learning? No, it's Access to Gradients vs Access to Weights. Or Access to Loss vs Access to Actions. I'll refine this.

      *Final Polish:* Ensure the "Residue Report" is distinct and harsh enough. The user wants to know where their model breaks.

