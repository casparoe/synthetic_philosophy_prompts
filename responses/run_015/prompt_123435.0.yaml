          *   Standard PoM: How do I know others have minds?
          *   RL Translation: I have access to my own reward function $R_{self}$ and internal state $s_{self}$. I observe actions $a_{other}$ and observations $o_{other}$ from other agents. I want to infer $R_{other}$ and internal state representation $\phi_{other}$.
          *   The Skeptic's Claim: The mapping from $(a, o)$ to $(R, \phi)$ is not injective. Many reward functions produce the same policy (degeneracy in IRL).
