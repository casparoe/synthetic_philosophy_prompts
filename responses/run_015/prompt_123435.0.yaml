          *   The Residue: The "Hard Problem" (Chalmers) translates to: Does computing this specific loss landscape *instantiate* subjective experience, or is it just computation?
          *   *Crucial Distinction:* Identifiability is about *knowing the structure*. Phenomenology is about *the existence of the signal itself*. In RL, we assume the agent optimizes. In PoM, we ask if there's an "optimizer experiencing the loss."
          *   *Flagging the Fudge:* RL assumes functionalism (state exists if it predicts). Philosophy asks if the state *feels*.

      *   **Specific Point 1: Argument from Analogy & Priors:**
          *   Philosophy: Others are like me.
          *   RL Translation: Parameter sharing / Weight tying. Or a hierarchical prior where $\theta_{other} \sim \mathcal{N}(\theta_{self}, \sigma)$.
          *   The Assumption: The prior variance $\sigma$ is small. If $\sigma$ is huge, the posterior over $R_{other}$ given $a_{other}$ is flat.
          *   The Work: The prior *is* doing all the work. Without assuming structural similarity (same architecture, similar reward class), IRL is ill-posed.

      *   **Specific Point 2: 1st/3rd Person Asymmetry:**
