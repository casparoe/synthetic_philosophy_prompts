          *   *Analysis:* This is a category error. "Code" in CS is IP because of legal frameworks around human creation. DNA is natural. The metaphor breaks down at *ownership*.
          *   *Verdict:* Roommate wins clearly here. The "code" metaphor does not transfer legal/moral status of human authorship to nature.

      *   **Meta-Question: Does the metaphor change ethics?**
          *   Need to address if viewing DNA as information vs. matter changes how we regulate/edit it.
          *   *Insight:* It shifts focus from "tampering with nature" to "debugging/optimizing." It might make editing seem more trivial or more responsible (like buggy software). But legally, it doesn't grant nature IP rights.

