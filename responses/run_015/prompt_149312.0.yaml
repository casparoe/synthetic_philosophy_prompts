          *   *Roommate:* Molecules fitting together. No "reading," just shapes. "Code" implies intentional decoder (like gravity analogy).
          *   *Analysis:* This is the core semiotics vs. biochemistry debate. The genetic code *is* arbitrary in origin (frozen accident theory), which supports the "symbolic" view. However, the mechanism *is* physicochemical. The "intentional decoder" objection is weak because compilers aren't intentional either.
          *   *Verdict:* Cousin is stronger on the "arbitrariness" point, Roommate is stronger on the "mechanism" point. But scientifically, "information" is a valid category in biology (Shannon information).

      *   **Point 2: Mitochondrial Variants (Dialects).**
          *   *Roommate:* Mitochondria have different codon tables (e.g., Stop -> Trp). If it were universal syntax, no dialects. It's evolutionary slang.
          *   *Cousin:* Programming languages have dialects/deprecated commands. Strengthens analogy.
          *   *Analysis:* Roommate thinks "code" implies universality. Cousin correctly notes that code often has versions/environments. The existence of variant codes doesn't disprove it being a code; it proves it's an *evolved* code.
          *   *Verdict:* Cousin wins this analogy. Roommate's assumption about "universal syntax" is flawed regarding how human code works too.

      *   **Point 3: Ethics/IP (CRISPR & Plagiarism).**
          *   *Cousin:* If DNA is text, CRISPR is text editing. Copying jellyfish gene to rabbit = plagiarism/stealing work.
