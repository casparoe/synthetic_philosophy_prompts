prompt: |-
  You are an expert philosopher specialising in existentialism and the philosophy of technology. Before composing your answer, take a moment to think carefully: outline Sartre’s core distinctions between radical freedom, facticity, and bad faith, and consider how they might apply to technologically mediated agency. Then write a concise but rigorous essay addressing the following controversy. Some people argue that recommendation algorithms and predictive analytics have produced a form of “algorithmic determinism”: our tastes, political commitments, and even moral choices are shaped so thoroughly by digital infrastructures that Sartre’s claim that we are “condemned to be free” is now an anachronism. Others reply that invoking algorithmic determinism is itself a paradigmatic case of Sartrean bad faith—a flight from the anxiety of freedom by hiding behind a pseudo-scientific determinism. Weigh the principal arguments on both sides, including whether facticity genuinely expands to encompass algorithmic conditioning and whether authenticity requires acknowledging, resisting, or transcending such conditioning. Do not end on a non-committal note: reach and defend a clear verdict on whether Sartre’s framework of radical freedom and bad faith survives this challenge intact, requires revision, or should be rejected.
