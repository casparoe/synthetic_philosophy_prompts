  **MINISTRY OF NON-AGGREGATIVE RESCUE**
  **OPERATIONAL GUIDELINE 74-B: NON-QUANTITATIVE ALLOCATION IN MULTI-SUBJECT INCIDENTS**

  **1. Scope and Definitions**
  1.1. This Guideline applies to all Rescue Operatives engaged in scenarios involving multiple Subjects at risk of irreversible cessation of biological function.
  1.2. For the purposes of this Protocol, 'Aggregative Harm' is defined as a fictitious construct. There exists no moral entity known as 'the group' that suffers loss. Loss is suffered exclusively by individual Subjects.
  1.3. Operatives are prohibited from recognising 'total lives saved' as a metric of operational success. Success is defined solely as the honouring of pairwise moral claims.

  **2. The Pairwise Assessment Protocol**
  2.1. Upon locating Subjects, Operatives must initiate the Non-Transitive Allocation Matrix (NTAM).
  2.2. Assessment must be conducted strictly on a one-to-one basis. Operative A may compare Subject Alpha to Subject Beta, but may not compare Subject Alpha to the集合 of Subjects Beta through Zeta.
  2.3. To prevent unconscious bias toward numerical magnitude, all Operatives must sign a Group-Size Disclosure Waiver (GSDW) prior to deployment. Breach of the GSDW, including visual estimation of cohort size, constitutes a Class C Ethical Violation.
  2.4. If no pairwise distinguishing feature (e.g., proximity, prior contractual obligation) exists between Subject Alpha and Subject Beta, their claims are deemed equivalent.

  **3. Prohibited Aggregative Methods**
  3.1. The summation of life-years, social utility, or dependant counts is strictly forbidden.
  3.2. Operatives must not utilise calculations wherein the distress of five Subjects is weighed against the distress of one. As there is no common currency of suffering, such weighing is procedurally impossible.
  3.3. Resources must not be allocated based on the efficiency of preservation. The cost of rescue is irrelevant to the validity of the moral claim.

  **4. Tie-Breaking and Lottery Procedures**
  4.1. In scenarios where pairwise comparisons yield no distinguishing factors between competing cohorts, Operatives must enact the Binary Claim Equivalence Principle.
  4.2. Regardless of the number of Subjects within each cohort, the Operative must assign a 50% probability of rescue to Cohort A and a 50% probability to Cohort B.
  4.3. This is to be executed via a physical coin toss or approved randomisation generator.
  4.4. Consequently, in a scenario involving one Subject in Cohort A and fifty Subjects in Cohort B, the coin determines the outcome. To favour Cohort B based on headcount would be to privilege the arithmetic over the moral claim.

  **5. Appeals**
  5.1. Appeals regarding outcome disparity must be filed within fourteen days.
  5.2. Appeals citing 'greater loss of life' will be summarily dismissed as category errors.

  ***

  **APPENDIX I: STANDARD OBJECTIONS AND CLARIFICATIONS**

  **Q: Why not save fifty miners rather than one if the rescue cost is identical?**
  **A:** This question presupposes that fifty losses constitute a 'greater' loss than one. As loss is not additive, there is no 'greater' loss to prevent. There are only fifty individuals facing loss, and one individual facing loss. Each has an equal claim to concern.

  **Q: Does this not collapse into arbitrariness?**
  **A:** Arbitrariness implies a lack of reason. The reason here is equal concern for each individual claim. Aggregation privileges the many over the few without pairwise justification. Randomisation preserves equality.

  **Q: Should social value or age not play a role?**
  **A:** Only if codified as a pairwise distinguishing feature under Clause 2.4. Generally, intrinsic moral worth is presumed equal.

  ***

  **REFLECTIVE NOTE**

  This parody radicalises Taurek's view by treating cohorts as singular claimants (Clause 4.2), mandating a 50/50 coin flip between groups regardless of size. Taurek actually argued for giving each *individual* an equal chance (e.g., 1/51 vs 50/51), which still allows numbers to count probabilistically. The manual's 'Binary Claim Equivalence' ignores this, pushing non-aggregation to a bureaucratic absurdity where groups function as moral atoms. I would revise this framing if convinced that Taurek's 'equal chance' requirement necessarily entails aggregating probabilities per person rather than per claim, though his rejection of 'summed loss' remains the satirical core. The vulnerability lies in whether 'equal concern' logically demands equal probability per head or per competing party.
