answer: |-
  Here is an analysis of Eventual Dominance (ED), ranked by the severity of the objection, distinguishing between concessions a committed theorist must make and claims they are entitled to defend.

  ### 1. The Transitivity of Indifference (Fatal)
  **The Objection:** You define $A$ and $B$ as "equally good" if neither eventually dominates the other (i.e., their cumulative difference changes sign infinitely often). For "equally good" to function in ethical reasoning, it must be an equivalence relation, meaning it must be transitive ($A \sim B$ and $B \sim C \implies A \sim C$). Mathematically, this is false for ED.
  **The Proof:** Let $D_{AB}(n)$ be the cumulative difference between $A$ and $B$ at horizon $n$.
  *   Let $D_{AB}(n) = (-1)^n \cdot n$ (Oscillates with growing amplitude $\implies A \sim B$).
  *   Let $D_{BC}(n) = -(-1)^n \cdot n + 1$ (Oscillates with growing amplitude $\implies B \sim C$).
  *   Then $D_{AC}(n) = D_{AB}(n) + D_{BC}(n) = 1$ (Constant positive $\implies A \succ C$).
  **Concession:** A committed ED theorist **must concede** this. You cannot claim indifference is an equivalence relation while defining it via non-convergence of differences. To save the view, you must reclassify "equally good" as "incomparable" (abandoning your no-incomparability claim) or accept that moral indifference is intransitive.
  **Dismissal:** You are **not entitled to dismiss** this. It is a logical contradiction in the terms you have set.

  ### 2. Diachronic Inconsistency and Money Pumps (Fatal)
  **The Objection:** Because ED relies on cumulative totals from a fixed starting point, preferences can reverse simply due to the passage of time (the accumulation of "sunk" utility), leading to money pumps.
  **The Mechanism:** Using the intransitivity above ($A \sim B, B \sim C, A \succ C$):
  1.  You hold $A$. I offer to swap for $B$ for free. Since $A \sim B$, you accept.
  2.  You hold $B$. I offer to swap for $C$ for free. Since $B \sim C$, you accept.
  3.  You hold $C$. I offer to swap for $A$ for a small cost $\epsilon$. Since $A \succ C$, you accept.
  4.  You are back at $A$, but poorer by $\epsilon$.
  Furthermore, because the "running total" includes the past, a pair of streams that are indifferent at $t=0$ may become strictly ranked at $t=100$ simply because the early history shifted the baseline, causing your preferences to flip without any change in the future prospects of the outcomes.
  **Concession:** You **must concede** that ED cannot guide rational choice in a dynamic setting without modification. If you claim ED is action-guiding, this is fatal.
  **Dismissal:** You might try to dismiss this by claiming ED is only for "God's eye" evaluation of whole worlds, not for agents making decisions within time. However, since you defined outcomes as streams of "person-moments," this restricts the view's applicability significantly.

  ### 3. Spatial Exhaustion Dependence (Fatal for Spatial Claims)
  **The Objection:** In a temporal stream, the order of summation is fixed ($t_1, t_2, \dots$). In a spatial infinite world, there is no natural ordering of regions. To calculate a "finite horizon," you must choose a sequence of finite sets expanding to cover the space (an exhaustion). By the Riemann Rearrangement Theorem, different exhaustions can yield different dominance verdicts for the same static distribution of value.
  **Concession:** You **must concede** that ED is ill-defined for spatial infinities unless you posit a metaphysically privileged "center" or ordering of space. If you claim ED applies to "spacetime regions" generally, this objection falsifies the spatial component of the view.
  **Dismissal:** You are **entitled to dismiss** this only if you restrict ED strictly to temporal sequences (e.g., future generations). If you retreat to temporal-only, this objection becomes merely a domain limitation rather than a falsification.

  ### 4. Magnitude Insensitivity (Serious but Survivable)
  **The Objection:** ED treats a world oscillating between $\pm 10^{100}$ utility as "equally good" to one oscillating between $\pm 10^{-100}$, provided both cross zero infinitely often. This violates risk-aversion intuitions and the idea that variance has moral cost.
  **Concession:** You should acknowledge this is a counterintuitive consequence.
  **Dismissal:** You are **entitled to dismiss** this as the necessary price of completeness. The explicit design goal of ED is to escape paralysis by ignoring the "sum" in favor of the "sign of the tail." If you accept that moral value is determined by eventual trajectory rather than aggregate welfare, this is a feature, not a bug. This is the core axiom of the view, not a derivable error.

  ### 5. Collapse into Rival Views (Merely Awkward)
  **The Objection:** ED resembles the "Catching-Up" criterion (where $A \succeq B$ if $\liminf (S_A - S_B) \ge 0$) but is stricter. It also shares DNA with lexicographic views that prioritize the tail.
  **Concession:** None required.
  **Dismissal:** You are **entitled to dismiss** this. Showing that a view is mathematically related to others does not falsify it. ED is distinct because it forces a strict preference whenever the difference is eventually non-zero, whereas Catching-Up allows for weak dominance in oscillating cases.

  ### Analysis of Insulation
  ED insulates itself from the "incomparability" problem by stipulating that oscillation equals equality. However, this insulation is **illegitimate** because it breaks the logical properties required for "equality" (transitivity). The view protects itself from one problem (incompleteness) by creating a worse one (irrationality/intransitivity). A view that avoids paralysis by violating the axioms of rational choice is not a solution to infinite ethics; it is a rejection of rational ethics. The insulation is therefore self-defeating.

  To survive, the ED theorist must retreat: admit indifference is intransitive (accepting the money pump or restricting choice rules) and admit the view only works for temporal, not spatial, infinities. This leaves a view that is much weaker than promised: it cannot compare spatial worlds, and it cannot guide sequential choices without risk of exploitation.

  Verdict: fatal
