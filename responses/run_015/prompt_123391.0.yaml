answer: |-
  Here is the specification you asked for. It is structured as an engineering spec for a measurement instrument, because that is what a method chapter needs to be when you are trying to adjudicate existence claims.

  ### Part 1: The Spec (Desiderata List)

  These are divided into **Non-Negotiables** (conditions for the method to function as a science of consciousness) and **Camp Preferences** (methodological commitments that look like requirements but are actually theoretical bets).

  #### A. Non-Negotiable Requirements
  *If a method fails these, it cannot settle the claims you listed (S has K / lacks K / differs in R).*

  **1. The Dissociation Constraint**
  *   **Requirement:** The method must provide a principled rule for adjudicating cases where verbal report and forced-choice behavior diverge (e.g., vivid imagery + chance discrimination, or blind discrimination + report of darkness). It must specify which channel is treated as the signal and which as noise, or provide a third metric to resolve the conflict.
  *   **Rationale:** Without this, the method cannot distinguish between *error in reporting* and *error in performance*. If you treat all dissociations as "noise to be averaged," you lose the individual cases where the interesting philosophy lives (e.g., blindsight).
  *   **Status:** **Non-Negotiable.** A science of consciousness that collapses whenever report $\neq$ behavior is just a science of consensus.

  **2. The Conceptual Sensitivity Condition (The "Discovery" Clause)**
  *   **Requirement:** The method must distinguish between *absence of experience* and *absence of the concept required to categorize the experience*. It must allow for the possibility that a subject moves from "I have no imagery" to "I have imagery but it isn't picture-like" without their underlying physiology changing.
  *   **Rationale:** This addresses the aphantasia discovery case. If your method treats the first report as false and the second as true, you have no stability. If you treat them as equally valid texts, you cannot track the *experience*. You need a mechanism to tag conceptual learning vs. phenomenological change.
  *   **Status:** **Non-Negotiable.** Otherwise, you are measuring vocabulary, not consciousness.

  **3. Individual Validity (The "N=1" Constraint)**
  *   **Requirement:** The method must be capable of returning a "Measurement Failure" flag for a specific subject, independent of group statistics. It must be possible for the method to work for S1 and fail for S2 in the same session.
  *   **Rationale:** Consciousness is instantiated individually. Group-level significance (e.g., P300 across a cohort) does not guarantee consciousness in a specific subject. If the method only works at the group level, it cannot adjudicate claims about *a* subject.
  *   **Status:** **Non-Negotiable.**

  **4. The Revision Protocol (Version Control)**
  *   **Requirement:** The method must treat reports as versioned data. If a subject revises a report in Session 2 ("Actually, it wasn't red, it was pink"), the method must specify the status of Session 1's data. Is it retroactively invalidated? Is it a record of a *previous* state? Is it noise?
  *   **Rationale:** As you noted, most methods treat reports as fixed points. But phenomenological data is often iterative. Without a protocol for revision, you cannot distinguish between *refinement of access* and *confabulation/instability*.
  *   **Status:** **Non-Negotiable.** Without this, longitudinal data is incoherent.

  **5. Instrument Calibration (The Interviewer Constraint)**
  *   **Requirement:** The interviewer/probe must be treated as part of the measurement apparatus. Variables such as question framing, vocabulary offered, and interviewer demeanor must be either controlled, randomized, or independently measured.
  *   **Rationale:** If the interviewer suggests "Was it like a picture?" they are injecting structure into the data. If this isn't tracked, the "experience" measured is partially an artifact of the probe.
  *   **Status:** **Non-Negotiable.** Uncontrolled probes make the data unreproducible.

  ---

  #### B. Camp Preferences (Disguised as Requirements)
  *These are often presented as necessary conditions, but they are actually theoretical commitments. You can drop them if you pay a price.*

  **6. Strict Neutrality (The Heterophenomenological Bet)**
  *   **Claim:** "We must not grant first-person authority; we must treat reports as texts without assuming the described items exist."
  *   **Verdict:** **Preference.**
  *   **Cost of Dropping:** If you drop this, you commit to *Realism* about reports (i.e., if they say they see red, you assume a red-experience occurred). This opens you to error but allows you to make positive existence claims.
  *   **Cost of Keeping:** You can never settle the "No-Report" or "Blindsight" cases. You can only say "The subject claims X." You cannot say "The subject experiences X."

  **7. Access Optimism (The Neurophenomenological Bet)**
  *   **Claim:** "Reporting is a skill that improves with training; naive reports are noisy, trained reports are veridical."
  *   **Verdict:** **Preference.**
  *   **Cost of Dropping:** You treat all reports as equally opaque. You lose the ability to resolve the "Conceptual Sensitivity" condition (you can't help them find the concept).
  *   **Cost of Keeping:** You risk training subjects to produce the *expected* report (demand characteristics). You assume the "noise" was lack of skill, not lack of experience.

  **8. Structural Isomorphism (The Comparability Bet)**
  *   **Claim:** "We can compare Subject A and Subject B because the structure of their experience space is sufficiently similar to map onto a common scale."
  *   **Verdict:** **Preference.**
  *   **Cost of Dropping:** You cannot make general claims. Every subject is a universe.
  *   **Cost of Keeping:** You risk imposing your own phenomenological structure onto subjects who might not share it (the Inverted Spectrum worry).

  ---

  ### Part 2: The Impossibility Results (Trade-offs)

  You suspected some desiderata are jointly unsatisfiable. You are correct. Here are the hard constraints.

  **1. The Neutrality vs. Detection Paradox**
  *   **Conflict:** You cannot maintain **Strict Neutrality** (Req 6) and satisfy the **Conceptual Sensitivity Condition** (Req 2) regarding unreportable experience.
  *   **Why:** Strict Neutrality forbids you from positing an experience that the subject does not report (or reports as absent). To say "Subject S lacks the concept but has the experience" requires you to look *behind* the text. That violates neutrality.
  *   **Resolution:** You must choose. Either you are studying *claims about consciousness* (keep Neutrality, lose the ability to detect unreportable experience) OR you are studying *consciousness itself* (drop Neutrality, accept the risk of error).
  *   **Thesis Implication:** If your goal is to settle "Does the blindsight patient see?", you **must** drop Strict Neutrality. Heterophenomenology literally cannot answer that question; it can only answer "Does the patient *say* they see?"

  **2. The Comparability vs. Agnosticism Tension**
  *   **Conflict:** You cannot have full **Comparability** (across subjects) and full **Structural Agnosticism** (no presupposition of shared structure).
  *   **Why:** To compare S1 and S2, you need a common metric (e.g., "vividness"). To use that metric, you must assume "vividness" refers to a comparable dimension in both. If you are agnostic about shared structure, you cannot assume the metric holds.
  *   **Resolution:** You need a **Calibration Phase**. You must establish a shared reference frame *before* comparison. This is not a discovery of shared structure, but a *construction* of one.
  *   **Thesis Implication:** Your method must include a protocol for establishing shared vocabulary (e.g., "Show me an example of 'vivid'") before treating differences as phenomenological rather than semantic.

  **3. The Stability vs. Revision Trade-off**
  *   **Conflict:** If you honor the **Revision Protocol** (Req 4), you undermine the **Stability** of the data.
  *   **Why:** If Session 2 revises Session 1, is Session 1 wrong? If yes, your initial measurement was invalid. If no, what was it measuring?
  *   **Resolution:** You must treat the *trajectory* as the data, not the points. The "measurement" is the convergence (or divergence) of reports over time, not the report at T1.
  *   **Thesis Implication:** Single-session phenomenology is methodologically suspect for your purposes.

  ---

  ### Part 3: The "Killer" Requirement

  Which single requirement does the most work in ruling candidates out?

  **The Dissociation Constraint (Req 1).**

  *   **Why it kills:** It forces you to define the *target variable*.
  *   **How it kills Heterophenomenology:** When report conflicts with behavior (e.g., priming effects without awareness), Heterophenomenology treats both as texts. It has no rule to say which one tracks the *experience*. It dissolves the problem rather than solving it.
  *   **How it kills No-Report Paradigms:** When neural markers (e.g., GNW ignition) conflict with report (subject says "I saw nothing"), No-Report paradigms usually privilege the neural marker. The Dissociation Constraint forces them to justify *why* the neural marker counts as "experience" while the report counts as "error." Most cannot do this without circularity.
  *   **How it kills Neurophenomenology:** When a trained subject reports X but performs at chance on X, the method must decide: Did the training fail (report is noise) or did the task fail (behavior is noise)? Most assume the training validates the report. The Constraint forces them to prove it.

  **Verdict:** If your chapter can explicitly state how your method resolves the Dissociation Constraint, you solve 80% of the methodological fights.

  ---

  ### Part 4: Scorecard

  Here is how the three camps stack up against the Non-Negotiables.

  | Requirement | Heterophenomenology | Neuro/Microphenomenology | No-Report Neuroscience |
  | :--- | :--- | :--- | :--- |
  | **1. Dissociation Constraint** | **FAIL.** Treats dissociation as competing texts. Cannot adjudicate which tracks experience. | **PARTIAL.** Privileges trained report, but struggles when behavior contradicts trained report. | **FAIL.** Privileges neural marker, but cannot justify it as *experience* without begging the question. |
  | **2. Conceptual Sensitivity** | **FAIL.** Cannot distinguish "no experience" from "no concept" (both are just texts). | **PASS.** Training is designed specifically to refine concepts and access. | **FAIL.** Assumes neural marker maps directly to experience, ignoring conceptual mediation. |
  | **3. Individual Validity** | **PASS.** Focuses on the individual subject's text. | **PASS.** Focuses on the individual subject's trained access. | **FAIL.** Relies on group-level neural statistics; poor at single-subject adjudication. |
  | **4. Revision Protocol** | **PASS.** Naturally handles revision (texts change). | **PASS.** Views revision as learning/refinement. | **N/A.** Typically single-shot trials; revision not applicable. |
  | **5. Instrument Calibration** | **PARTIAL.** Controls the *interpretation*, but often ignores the *elicitation* bias. | **FAIL.** Interviewer is a tool for access, rarely calibrated as a source of noise. | **PASS.** Stimuli are controlled, but the "experience" inference is uncalibrated. |
  | **6. Strict Neutrality** | **PASS.** Core commitment. | **FAIL.** Assumes experience is accessible and real. | **FAIL.** Assumes neural markers indicate real experience. |

  ### Summary Recommendation for the Chapter

  1.  **Declare the Goal:** You are not reviewing methods; you are specifying an instrument.
  2.  **Adopt the Non-Negotiables:** Explicitly adopt Requirements 1–5 as the criteria for adequacy.
  3.  **Drop Strict Neutrality:** Argue that for your specific job (adjudicating existence claims), Strict Neutrality is a category error. You need to be a *Critical Realist* about reports (they are data, but fallible data), not a *Textualist*.
  4.  **Solve the Interviewer Problem:** Propose that the "method" includes a standardized calibration of the interviewer's probes (e.g., blind scoring of interview transcripts, or standardized prompt libraries).
  5.  **Solve the Revision Problem:** Define your unit of analysis as the *stable report after calibration*, not the initial report. Acknowledge that T1 data is provisional.
  6.  **Use the Dissociation Constraint:** Use this to show why your lab's specific hybrid approach (likely combining neural markers with trained reporting) is necessary. Neither reports nor neurons alone can satisfy the constraint; only their triangulation can.

  This framework moves you from "My supervisor says X, my labmate says Y" to "X fails Requirement 1, Y fails Requirement 5, therefore we need Z." That is a thesis chapter.
