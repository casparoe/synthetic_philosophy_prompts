answer: |-
  The session must demonstrate that superrationality relies on logical correlation between identical reasoning processes, distinct from both causal influence and evidential conditioning.

  1.  **Order of Components**
      You must establish the **identity of the reasoning procedure** before you introduce the **Platonia payoff matrix**. If the room grasps the game mechanics first, they will default to standard game theory (Nash equilibria) and treat 'superrationality' as a quirky constraint rather than a different ontology of decision-making.
      *   **First:** Define the agents not as 'rational' but as 'identical algorithms'. Use a code analogy: twenty instances of the same function running on isolated servers. This prevents the 'Common Knowledge of Rationality' confusion; it is not that we *trust* each other to be rational, but that we *are* the same computation.
      *   **Second:** Present the Platonia payoff. Now ask for the output of the function.
      *   **Third:** Derive the superrational strategy (randomisation) as a maximisation of group utility under the identity constraint.
      *   **Fourth:** Contrast with CDT and EDT. This depends entirely on the first step; without the 'identical algorithm' premise, the distinction collapses.
      *   **Movable:** The specific history of Hofstadter's column or the real-world lottery results can be shifted to the end or dropped entirely without cost.

  2.  **The Carrying Case**
      Use the **Original Platonia Dilemma**. It is the sharpest knife for this specific conceptual dissection.
      *   **Why not the others:** The Luring Lottery introduces continuous variables that distract newcomers with calculus rather than logic. Your Variant (lost telegrams/uncertain pool) introduces noise that undermines the core lesson of logical identity; it is excellent for stress-testing the theory later, but poisonous for initial instruction.
      *   **Must Have:** Perfect symmetry of information and payoff; absolute isolation (no causal channels); a binary choice that leads to total failure if coordinated poorly.
      *   **Must Lack:** Any mechanism for signalling or binding; any asymmetry in player capability; any probability of communication leakage. The cleanliness forces the logical correlation to be the only variable left standing.

  3.  **Misconceptions and Timing**
      *   **'Superrationality just means cooperate':** Defuse this **immediately** after defining the agents. Clarify that superrationality maximises expected utility, which sometimes requires defecting or randomising; it is not a morality play.
      *   **'If we are all rational we all do the same thing, therefore all send/abstain':** Defuse this when you introduce the **mixed strategy**. Explain that 'doing the same thing' means running the same *probability distribution*, not making the same binary move.
      *   **'Common Knowledge of Rationality (CKR) is doing the work':** Defuse this during the **contrast phase**. Show that CKR leads to Nash Equilibrium (which, in Platonia, often implies collision or suboptimal mixing), whereas superrationality leads to the Pareto optimum via logical correlation.
      *   **'This is just one-boxing (EDT) again':** Leave this standing until the **final ten minutes**. It is a useful tension for your Sequences expert to hold while the newcomers grasp the basics. Resolve it by distinguishing *evidence* (EDT: my action correlates with theirs) from *logical identity* (Super: my reasoning determines theirs).
      *   **The 1/20 Calculation:** Introduce this **after** the logical identity premise is cemented. If arrived at too early, it cements the idea that this is just a Mixed Strategy Nash Equilibrium. Arriving late, it cements that while the *number* matches CDT, the *derivation* (group utility maximisation vs individual best response) is fundamentally different.

  4.  **Closing Question**
      Ask the room: **'If you discovered your reasoning contained a unique bug no one else shared, would you still follow the superrational strategy?'**
      *   If they say 'yes', they have not understood the logical correlation requirement.
      *   If they say 'no', they understand that the power comes from the identity of the procedure, not the action itself.

  5.  **Declinations**
      You should openly decline three additional things beyond the two you listed:
      *   **The metaphysics of logical causation:** Do not let the room drift into Platonism. Say: *'We are treating the reasoning procedure as a black box that returns identical outputs for identical inputs; questioning the box's ontology is outside scope.'*
      *   **Evolutionary stability:** Do not discuss whether superrational agents would be outcompeted by defectors in a population. Say: *'We are analysing a single instance of a decision problem, not an evolutionary tournament.'*
      *   **Fuzzy superrationality:** Do not attempt to solve for agents who are 90% identical. Say: *'We require perfect identity for this model; grading similarity is a separate problem.'*
