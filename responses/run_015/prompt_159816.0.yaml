prompt: |-
  Had a long argument at a pub after a department seminar the other night and I still can't figure out where it bottoms out. My friend keeps pushing what he calls a "deferred assent" rule for constitutional entrenchment: to lock a provision in you need two separate approvals separated by at least one general election, the second vote is taken by an electorate that includes everyone who will be eligible at that point (so if the voting age is coming down, the newly enfranchised get to ratify something passed before they could vote), and the thing being locked has to be a constraint-type provision — a right, a structural limit — not a ordinary policy. His claim is that this is a real Ulysses contract at the level of a polity, i.e. the later majority is genuinely bound and not just inconvenienced. I'm at maybe 0.45 that a device like this generates a defeasible duty for the later electorate to keep the provision rather than treat it as repealable at will; he's at something like 0.75 and I can't locate the disagreement.

  So: your number, but really the decomposition. The terms I think matter are (a) whether personal Ulysses contracts are justified at all and on what basis — the temptation model versus something about diachronic identity, trust, or agency over time; (b) whether a polity across an election or a generation is the kind of continuing agent that the justification needs, i.e. whether the later electorate is the same "self" in the sense the analogy requires; (c) whether the two-votes-across-an-election structure actually helps — does the intervening election make T2 a different agent giving fresh assent, or does it just turn the lock into a higher hurdle, which is exactly what the anti-entrenchment objection complains about; (d) the bootstrapping worry that nobody consented to the binding procedure itself, so the people at T1 are binding people who never agreed to be bindable in that way; and (e) whether any of this turns on what's being locked — "panic-proofing" (we know we get frightened and illiberal after shocks) versus locking a hard-won moral achievement so a later majority can't walk it back. Give each term a rough number and one line of justification, say how you're combining them and don't pretend it's clean multiplication if it isn't, give the bottom line, then tell me which single term my 0.45 and his 0.75 are most likely diverging on and what one argument or piece of evidence would move your own number the most.

  Two caveats: no citations, no bibliography, no "the literature distinguishes X from Y" hand-waving — I know the general shape of the debate and I'll fill in names myself; and where you think a term isn't well defined enough to bear a probability, say that instead of inventing a number. Under 600 words total; a small table of the terms is fine and counts toward the limit.
