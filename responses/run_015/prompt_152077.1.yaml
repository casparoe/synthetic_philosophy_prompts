answer: |-
  Here's the blueprint for your story. You want to know what a theory of idealization actually needs to do to earn its keep, without getting bogged down in the academic weeds. Here are the desiderata, the stress tests, and the scorecard.

  ### The Desiderata: What a Theory of Idealization Must Deliver

  If you're building a philosophy of science that can handle the "F-twist" (false assumptions, true predictions), it needs to hit these five marks:

  1.  **The Success Condition:** It must explain *how* a model can be literally false in its premises but still nail the predictions. It can't just say "it works"; it has to say *why* the lies don't matter in specific contexts.
  2.  **The Domain Condition:** It must define the boundaries. A theory of idealization is useless if it doesn't tell you where the model breaks. It needs a "Here Be Dragons" marker for when the idealization stops being harmless and starts being harmful.
  3.  **The Distinction Condition:** It must separate **harmless fiction** (frictionless planes) from **harmful distortion** (ignoring systemic risk). Not all lies are equal; some cut to the bone, others just smooth the edges.
  4.  **The Explanatory Condition:** It can't just be about prediction. It needs to account for understanding. If a model predicts right but tells you the wrong story about *why*, the theory needs to flag that as a deficit, not a feature.
  5.  **The Non-Accident Requirement:** This is the big one. It must ensure that predictive success isn't just luck. If a model works because two errors canceled out, the theory needs to treat that differently than a model that works because it captured the causal structure.

  ### The Cases: The Stress Test Suite

  Any account that can't handle these three is dead on arrival:

  *   **The Ideal Gas Law:** Assumes particles have zero volume and no attraction. Obviously false. Works great at low pressure/high temp. Fails miserably near condensation. Your theory has to explain why the "zero volume" lie is acceptable in one regime and catastrophic in another.
  *   **Rational-Agent Economics:** Assumes *Homo Economicus*—perfect information, infinite computing power, pure self-interest. Humans are none of these. Yet, markets often clear as if they were. But then you get bubbles and crashes. The theory must explain when the "rationality" fiction aggregates out and when it compounds.
  *   **Climate Grid Approximations:** We chop the continuous atmosphere into discrete 3D boxes. The physics inside the box is averaged. This is computationally necessary but physically false. The theory needs to justify why discretizing reality yields trustworthy warming trends without hiding the sub-grid chaos.

  ### The Niche Scenario: The 'Echo-Chamber Problem'

  Here's your plot twist. Imagine a complex model built from two sub-models.
  *   **Sub-model A** has an assumption that overestimates a variable by $+X$.
  *   **Sub-model B** has an assumption that underestimates a variable by $-X$.
  *   **Inside the calibration window** (the data you have), $+X$ and $-X$ cancel out. The output looks perfect.
  *   **Outside the window** (extrapolation), the relationship becomes non-linear. The errors stop canceling and start amplifying. Boom. Disaster.

  **Which Desiderata Does This Threaten?**
  This scenario directly attacks **The Non-Accident Requirement** and **The Domain Condition**.
  *   It threatens *Non-Accident* because the model *looks* successful, but the success is purely accidental (compensating errors). A theory that says "prediction = validation" gets fooled here.
  *   It threatens *Domain* because the calibration data gives you no signal that you are near the edge of the model's validity. The model lies about its own reliability.

  ### The Killer & The Paradox

  **The Single Requirement That Knocks Out the Most Theories:**
  **The Non-Accident Requirement.**
  This is the Friedman-killer. Milton Friedman's instrumentalism says *only* predictions matter. He doesn't care if the assumptions are false or if the success is luck. If you demand that a theory explain *why* the success isn't accidental (i.e., it tracks some structural truth), Friedman's "as if" methodology collapses. He can't distinguish between a robust model and a lucky coincidence of compensating errors.

  **The Jointly Unsatisfiable Pair:**
  **Predictive Sufficiency** vs. **Extrapolative Security.**
  *   *Predictive Sufficiency:* The model is valid because it fits the existing data.
  *   *Extrapolative Security:* We can trust the model outside the existing data range.
  *   *The Conflict:* The Echo-Chamber Problem proves you cannot have both. If you rely solely on predictive sufficiency (fitting the curve), you have no guarantee of extrapolative security because compensating errors can hide anywhere. To get security, you need to know the assumptions are independently true, which violates the spirit of idealization (which admits assumptions are false). You can't demand models be useful fictions *and* demand they be safe guides for the unknown.

  ### The Scorecard

  Here's how the usual suspects stack up against your list:

  **1. Friedman's Instrumentalism (The F-Twist)**
  *   **Gist:** Assumptions don't need to be true; they just need to yield accurate predictions.
  *   **Score:** Fails the **Non-Accident Requirement** and **Explanatory Condition**.
  *   **Verdict:** It's great for defending the status quo of economics, but it's dangerous for your story. It treats the Echo-Chamber Problem as a non-issue. If the prediction works, Friedman says the model is good. Your story shows why that's a ticking time bomb.

  **2. Cartwright's Capacities (The Anti-Realist)**
  *   **Gist:** Physical laws are lies that only hold in "nomological machines" (carefully controlled setups). In the wild, capacities interfere and laws break.
  *   **Score:** Aces the **Domain Condition** and **Distinction Condition**. She's all about where the lies fail.
  *   **Verdict:** Strong contender. She handles the Ideal Gas and Climate cases well by admitting the laws are context-bound. However, she sometimes struggles to explain *how* the models work as well as they do if the laws are so fundamentally misrepresentative. She might be too pessimistic for a story about scientific success.

  **3. Patchwork Realism (The New Guard)**
  *   **Gist:** Models are locally true. We stitch together different models for different domains. No "Theory of Everything," just a quilt of reliable tools.
  *   **Score:** Hits the **Domain Condition** and **Non-Accident Requirement**.
  *   **Verdict:** This is probably your protagonist's philosophy. It admits the assumptions are false globally but true locally. It handles the Echo-Chamber by demanding we check the seams where the patches stitch together. It's the most robust against the "false premises" critique because it doesn't claim the premises are universal truths, just local tools.

  **Summary for your Editor:**
  If you want drama, pit Friedman against the Echo-Chamber. Friedman says "The model works, shut up." The Echo-Chamber says "The model works *for now*, but it's lying to you." The tension lies in whether we value the prediction (Friedman) or the reliability of the mechanism (Realism/Patchwork). Cartwright sits in the middle, warning that the world is too messy for any model to be fully true.
