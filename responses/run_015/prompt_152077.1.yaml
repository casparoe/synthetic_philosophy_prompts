  4.  **Tackle the "Echo-Chamber Problem":**
      *   Scenario: Assumption A is $+ \delta$, Assumption B is $- \delta$. Inside data range, $A+B \approx 0$. Outside data range, non-linearities kick in, $A+B \rightarrow \text{disaster}$.
      *   Threatened Desiderata: The *Domain Condition* (knowing limits) and the *Robustness Condition* (understanding error structure). It specifically attacks the idea that predictive success validates assumptions.

  5.  **Identify the "Killer" Desideratum & Unsatisfiable Pair:**
      *   *Killer:* The requirement to distinguish *why* it works (mechanism) vs. *that* it works (prediction). This kills pure instrumentalism. Let's call it the "No-Accident Requirement" (it can't be luck).
      *   *Unsatisfiable Pair:* Maybe "Universal Applicability" vs. "Context Sensitivity"? No, that's too easy. How about "Complete Transparency of Error" vs. "Computational Tractability"? A bit practical. Let's go philosophical: "Ontological Commitment to Assumptions" vs. "Predictive Success of False Assumptions." If you commit to them being true, you lose the success. If you commit to them being false, you lose the explanation. Let's refine: *The Explanatory Depth Requirement* vs. *The Instrumental Flexibility Requirement*. You can't have deep truth *and* total freedom to lie.

  6.  **Score the Three Views:**
      *   *Friedman (Instrumentalism):* Great at prediction, terrible at explanation/limits. Fails the Echo-Chamber (doesn't care why it works).
