  9.  **Refining the "Killer Desideratum":**
      *   What kills the most theories? Usually, it's the demand for *explanation* alongside *prediction*. Pure instrumentalism dies here. Pure realism dies on the *falsehood* aspect.
      *   Let's pick: *The Non-Accident Requirement*. (It can't just be luck). This kills Friedman hardest because he says *only* prediction matters. If prediction is achieved via luck (canceling errors), Friedman says "Good theory," but a robust philosophy says "Dangerous."

