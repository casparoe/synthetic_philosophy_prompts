answer: |-
  You have correctly identified that the Condorcet Jury Theorem (CJT) is a mathematical truth about a specific, fragile set of conditions that rarely exist in the wild. Your intuition is fighting against the *map* (CJT) because the *territory* (real-world epistemology) is messier.

  Your tentative principle ("effective independent opinions") is the right direction, but it misses a crucial variable that resolves your Ox vs. Mechanic conflict. The missing variable is **Signal Accessibility**.

  Here is the principle that captures your verdicts, followed by the application and the honest confession.

  ### The Principle: Effective Independent Signal (EIS)

  **Trust an aggregate judgment $J$ to the degree that:**
  $$ \text{Trust} \propto \text{Access} \times \text{Competence Floor} \times \sqrt{N_{\text{eff}}} $$

  Where:
  1.  **Access (0 to 1):** Can the average participant directly perceive the signal, or do they require specialized tools/training? (Resolves Ox vs. Mechanic).
  2.  **Competence Floor ($p > 0.5$ or Symmetry):** Is there a prior reason to believe individual errors are better than chance (binary) or symmetrically distributed (continuous)? (Resolves <50% Voters and Ox).
  3.  **Effective Independence ($N_{\text{eff}}$):** What is the headcount discounted by the correlation of errors? (Resolves Philosophy, Polls, Whales, Wiki).

  ---

  ### How the Clauses Save Your Verdicts

  | Verdict | Principle Diagnosis | Why it fits |
  | :--- | :--- | :--- |
  | **Ox Weight** | **High Access, Symmetric Error.** | Anyone can see an ox. Errors are visual noise (symmetric), not systematic bias. $\sqrt{N}$ works even if individual competence is low, because the *median* of symmetric noise converges on truth. |
  | **Taqueria (Crowd vs. Friend)** | **High Access, High $N_{\text{eff}}$.** | **Crucial Distinction:** This isn't CJT; it's **Sample Aggregation**. 500 people *ate the food* (Data). 1 friend *didn't* (No Data). Access is 1 for crowd, 0 for friend. |
  | **Philosophy Book** | **Low Orthogonality.** | Access is high (anyone can read), but **Error Orthogonality fails**. "Pretentious" is a cultural shibboleth. Errors are correlated (shared upstream bias). $N_{\text{eff}}$ collapses. |
  | **10k People @ 51%** | **Low Orthogonality (Meta).** | Mathematically trustable *if* independent. But your verdict relies on a **Meta-Prior**: "Real-world consensus implies shared source." You are discounting $N_{\text{eff}}$ because you believe the *independence premise* is false. |
  | **Poll Average (20 $\to$ 5)** | **Partial Correlation.** | Methodologies share "house effects." Errors are partially correlated. $N_{\text{eff}}$ is discounted, but not to 1 (some variation exists). |
  | **Prediction Market (Whales)** | **Low $N_{\text{eff}}$.** | Volume $\neq$ Independence. If 90% of volume is 3 whales, you have 3 opinions, not 10,000. $N_{\text{eff}}$ is tiny. |
  | **Wiki Deletion** | **Zero Orthogonality.** | Coordination. They aren't voting independently; they are executing a strategy. $N_{\text{eff}} \approx 1$. |
  | **Voters < 50%** | **Fails Competence Floor.** | CJT math explicitly dictates divergence. If $p < 0.5$, more voters = more certainty in the *wrong* answer. |
  | **Mechanic vs. Drivers** | **Fails Access.** | Car engine truth is not accessible to laypeople. Driver Access $\approx 0$. Mechanic Access $\approx 1$. Competence of crowd is effectively random noise, not signal. |

  ### The Subculture Case: Two Biased Groups

  **Scenario:** Subculture A (Bias +X) and Subculture B (Bias -X). Both internally correlated.
  **Question:** Is averaging the two group verdicts good or bad?

  **EIS Prediction:** **Good for Accuracy, Bad for Confidence.**

  1.  **Bias Cancellation:** If the biases are roughly equal and opposite, averaging the *group means* cancels the systematic error. This is superior to trusting one group.
  2.  **Effective N:** You do **not** have $N_A + N_B$ independent opinions. You have **$N_{\text{eff}} = 2$** (one for each subculture).
  3.  **Verdict:** The average will likely be *more accurate* than either group alone (because systematic bias is removed), but your *confidence interval* should remain wide (because you only have two independent data points).
  4.  **Action:** Update your estimate toward the average, but do not tighten your error bars. You have corrected the aim, but you haven't increased the precision.

  ### The Unsaveable Verdict

  I have to be honest: My principle cannot save the specific calibration of your **Poll Average** verdict.

  **Your Verdict:** "20 polls... trust... like maybe the equivalent of 5."
  **The Principle's Limit:** The EIS principle correctly predicts you should *discount* the 20 polls due to correlated error (Clause 3: Orthogonality). However, there is no first-principles way to derive the number **5** from **20** without knowing the actual correlation coefficient ($\rho$) between the polling houses.

  If $\rho$ is 0.9, $N_{\text{eff}}$ is closer to 2. If $\rho$ is 0.5, $N_{\text{eff}}$ is closer to 10. Your intuition that it is "5" is a heuristic guess—a "vibe check" on the industry's methodological diversity. The principle justifies the *direction* of your skepticism (trust less than 20), but it cannot validate the *magnitude* (trust exactly 5). That number is purely experiential, not derivable from the epistemic structure alone.

  ### One Final Correction on the Taqueria Case

  You noted a tension: *"I trust the crowd on the ox's weight... without having any real evidence those people are above chance, while I'd take one mechanic... over a survey of 500 drivers."*

  The EIS principle clarifies that these are **different epistemic categories**:
  1.  **Ox = Estimation Task.** Errors are symmetric noise. The *median* is robust even if individuals are incompetent, provided they aren't systematically biased.
  2.  **Car = Diagnostic Task.** Errors are not symmetric; they are **ignorance**. A driver looking at an engine doesn't produce "noise around the truth"; they produce "random guesses detached from the truth." Access = 0.

  Your intuition was right to treat them differently, but not because of "competence" in the abstract. It's because **visual estimation is a low-barrier signal, while engine diagnosis is a high-barrier signal.** The crowd can access the first; they cannot access the second.
