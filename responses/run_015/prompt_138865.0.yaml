      *   **Task:** Stress-test a specific thesis about the film *Arrival* (2016) using Hofstadter's Frame/Outer/Inner message framework from GEB.
      *   **Thesis:** Heptapod B is *only* an Outer Message (decoding hardware/installer). The Inner Message is null/irrelevant. The "3000 years" help request is a decoy. The goal is to upgrade the receiver (humans).
      *   **Specific Questions:**
          *   Does Hofstadter's scheme break if Outer = Point?
