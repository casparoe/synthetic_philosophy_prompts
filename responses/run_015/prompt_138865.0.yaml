      *   *12 Shells:* Literal fragmentation. You need the whole to get the context. This supports the "Outer Message is Prerequisite" thesis.
      *   *Fermat's Principle:* Minimum time vs. Least action. Teleological vs. Causal. This is the perfect analogy for Heptapod B. Same physics (Inner), different cognitive framing (Outer).
