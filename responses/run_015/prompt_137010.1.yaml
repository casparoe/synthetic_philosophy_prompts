answer: |-
  This project requests support to determine whether the contractualist distinction between intra-personal and inter-personal aggregation is morally defensible, a question whose answer determines the viability of Scanlonian ethics against standard utilitarian objections and thus warrants dedicated independent study. Scanlon-style contractualism holds that an act is wrong if it would be forbidden by any principle that no one could reasonably reject. A defining commitment of this view is its resistance to the aggregation of complaints across different people: a large number of trivial harms cannot typically outweigh a single serious harm to one individual. However, the theory explicitly permits aggregation within a single person's life; to determine if a principle is reasonably rejectable by an individual, we must sum the various burdens that principle imposes on them across time and across different interests. This creates a structural asymmetry: intra-personal aggregation is built into the machinery of reasonable rejectability, while inter-personal aggregation is banned. My research focuses on the "slicing problem," which asks whether the boundary between "one person" and "many people" is morally significant enough to bear the weight of this asymmetry. If we can redescribe inter-personal cases as intra-personal ones, or vice versa, without changing the qualitative nature of the complaints, the contractualist prohibition on aggregation risks appearing arbitrary.

  Existing contractualist positions leave this question open because they typically treat the individual person as a pre-theoretical unit of moral concern. Scanlon and his defenders argue that the separateness of persons matters morally, but they often assume rather than demonstrate where that separateness lies. Utilitarian critics argue that this boundary is morally arbitrary, but they rarely engage with the specific mechanics of how contractualism aggregates intra-personally. Consequently, there is a gap in the literature regarding whether the contractualist can provide a non-circular account of the "unit of complaint." This project fills that gap by shifting focus from exegesis to structural stress-testing. I will not merely summarize existing arguments but will construct matched pairs of cases designed to isolate the variable of subject distribution. The core method involves comparing a case where one person bears many small burdens against a case where many people bear one small burden each, ensuring the total sum of harm and the qualitative nature of the complaints are identical. I will then introduce "awkward" variants where the small burdens differ slightly in strength from one another, preventing simple tie-breaking stories from resolving the tension. By testing candidate explanations of the asymmetry against these cases, I can determine whether the distinction holds under pressure or collapses into metaphysical assumptions about personal identity.

  This methodological approach is necessary because standard literature review cannot resolve a problem that is fundamentally about the limits of conceptual coherence. Reading more commentary on Scanlon will not reveal whether the theory can withstand redescription arguments; only constructing those arguments can do so. The matched-pair method forces a choice between competing explanations: either the theory must accept some form of inter-personal aggregation, or it must adopt a robust metaphysical view of personhood that forbids slicing subjects arbitrarily. The possible conclusions are determinate. If the asymmetry is defensible, the project will identify the specific condition that blocks redescription (e.g., a requirement of psychological continuity or biological unity). If the asymmetry is indefensible, the project will demonstrate that contractualism must either permit inter-personal aggregation or abandon its claim to handle numbers cases distinctively from utilitarianism. What decides between these outcomes is whether a principle can be formulated that tracks the moral intuition without relying on circular definitions of the "self."

  The finished deliverable will be a 6,000–7,000 word paper suitable for submission to undergraduate philosophy journals, accompanied by a one-page summary written for non-specialists to ensure the research is accessible to the alumni community funding this grant. Additionally, I will produce a taxonomy table sorting kinds of aggregation by whether contractualism can allow them, categorizing cases by temporal distribution, subject distribution, and burden intensity. This table will serve as a visual reference for the structural limits of the theory. The scope risks are significant but manageable within the semester. The primary risk is metaphysical scope creep; the slicing problem touches on personal identity, which is a vast field unto itself. To mitigate this, I will restrict my analysis to the moral implications of identity claims rather than defending a specific metaphysical theory of personhood. A second risk is time management, as this work proceeds alongside a normal course load. I have allocated eight hours per week, with the first month dedicated to case construction, the second to drafting, and the final two to revision.

  A honest assessment of failure conditions is essential for a project of this complexity. The project would fail only if I am unable to articulate a clear distinction between the cases or if the paper remains descriptive rather than argumentative. However, even a negative result—proving that the asymmetry is indefensible—constitutes a successful philosophical outcome, as it clarifies the costs of maintaining contractualism. The only true failure would be an inability to complete the draft due to underestimating the complexity of the redescription arguments. By focusing on matched pairs rather than broad historical survey, I ensure the work remains bounded and achievable. This grant would provide the necessary time and resources to conduct this analysis with the rigor it requires, allowing me to contribute a precise structural critique to an ongoing debate in normative ethics.
