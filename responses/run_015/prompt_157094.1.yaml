      *   *Diagnosis:* The colleague is likely jumping from Item 1 or 2 straight to Item 3 or 4. They are using the slogan to bypass the burden of proof required for adaptationist hypotheses. They are treating the *existence* of the bias as proof of its *utility*.

  5.  **Addressing the Crucial Question (Inference & Spandrels):**
