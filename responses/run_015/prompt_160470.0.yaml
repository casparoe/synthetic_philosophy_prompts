prompt: |-
  I'm a graduate TA for a first-year seminar on persons, property, and virtual worlds — I'm also taking a metaphysics seminar this term where we keep using the word real in ways I can't pin down, which is part of why I'm worried about this session. Next week I have one fifty-minute section to cover whether virtual objects and virtual harms are real. The assigned reading, which I didn't choose, runs the two questions together, and the students will arrive with two reflexes pulling in opposite directions: half of them will say the objects are real because they were paid for with real money and can be bought and sold, which settles a legal question and short-circuits the metaphysical one, and half will say nothing in a game is real because it's all just code, so that demolishing someone's in-game building is like tearing up a photograph of their house — bad only because of how it makes them feel. What I want them to leave with is the ability to hold apart three things: whether a virtual object is a real object; whether damage to it is a real loss; and whether that loss is someone's fault, and hence a harm that someone can be wronged by. So please don't explain the topic to me; plan how I should explain it. Tell me what has to come first and what genuinely depends on what — my instinct is that I can't say anything useful about virtual objects until they have some grip on an object that is publicly observable, causally active, and mind-independent but not made of the stuff we normally count as physical, something like a pattern or process implemented in a computational system and realizable in many different substrates — but I'm not sure whether to introduce that contrast before the case, inside it, or as a cleanup move after the students' own two reflexes have been used as foils.

  I also want your judgment on the example that has to carry the whole session, and on what such an example needs to have and to lack. I've been toying with a player-built structure in a persistent multiplayer sandbox world, run in two variants: one where another player spends four hours demolishing it with tools the game itself provides, and one where the studio wipes it in a server migration, with an apology and no wrongdoer. I like that pair because the first looks like something done to someone and the second like a loss with no agent at all, which is exactly the seam I want them to see. But I worry it smuggles in questions I don't want to answer — effort and desert, whether the builder owned the thing, whether the game's own rules made the demolition permitted — and I'd rather the case force the three-way separation than settle it by intuition. Tell me whether that's the right carrying case, what it should be stripped of, and, if there's a better one, what makes it better.

  Then the misconception map and the ending. I've guessed at four misconceptions: that real means made of matter; that if the object is real then damaging it is straightforwardly theft, on a par with smashing a window; that because the underlying bits persist, or can be restored from a backup, nothing was really lost; and that the only candidate for harm here is hurt feelings, so the whole question collapses into how sensitive the victim happens to be. Rank them by when in the session they'll actually bite rather than by how important they are, give me the move that defuses each at that moment, and tell me if I'm missing a fifth that first-years reliably produce. Finally, give me one question for the last five minutes that would show me they've got the three-way separation rather than just agreeing with me — I was thinking of a variant where the studio silently restores the structure from a backup five minutes later and only one of the two players ever notices — and a short list of what I should openly refuse to settle at this level, saying out loud that I'm refusing it. My current list is the legal and end-user-license question, the question whether an entire virtual world could itself be real in the way ours is, and the reading's own detour through taboo content, where it makes much of an asymmetry between how players treat virtual killing and virtual sexual content involving children; I have fifty minutes and no training in moderating that discussion. Tell me if that's the right set of refusals, or if I'm declining something I should actually be using.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Request:**
      *   **User:** Graduate TA for a first-year seminar (Persons, Property, Virtual Worlds). Also taking a metaphysics seminar (struggling with the word "real").
      *   **Task:** Plan a 50-minute section on "Whether virtual objects and virtual harms are real."
      *   **Goal:** Students must leave able to distinguish three things: (1) Is the virtual object a real object? (2) Is damage to it a real loss? (3) Is that loss someone's fault (harm/wrong)?
      *   **Constraints:** Don't explain the topic *to* the TA (they know the material); explain *how* to teach it. Sequence matters. Evaluate the proposed example (player-built structure, two variants: griefing vs. server wipe). Map misconceptions (rank by timing, provide defuses). Provide a final assessment question. Define what to explicitly *not* settle (refusals).
      *   **Tone:** Professional, pedagogical, precise, respectful of the TA's expertise but directive on structure.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   **Time:** 50 minutes is very tight for metaphysics + ethics + property theory.
      *   **Student Reflexes:** Binary thinking (Real/Money vs. Fake/Code).
      *   **TA's Instinct:** Needs a robust ontology of virtual objects (patterns/processes) before discussing harm.
      *   **TA's Worry:** The example might smuggle in intuitions about effort/ownership/rules that bypass the metaphysical distinction.
      *   **TA's Metaphysics Worry:** Confusion over "real" from their own seminar bleeding into the TAing.

  3.  **Step 1: Sequencing the Ontology (The "Real Object" Question):**
      *   *TA's Instinct:* Introduce the pattern/process ontology *before* the case.
      *   *Critique:* First-years will glaze over if you start with "computational functionalism." They need the intuition pump first.
      *   *Strategy:* Use the students' reflexes as the foil. Let them argue the binary (Money vs. Code). *Then* introduce the ontology as the tool to resolve the stalemate.
      *   *Sequence:*
          1.  Elicit reflexes (5 mins).
          2.  Present the Case (10 mins).
          3.  Introduce Ontology to save the case from the binary (10 mins).
          4.  Distinguish Loss vs. Wrong (15 mins).
          5.  Assessment & Refusals (10 mins).
      *   *Correction:* Actually, the TA is right that they need *some* grip on objecthood before they can assess loss. But defining it abstractly is boring. Define it *through* the case.
      *   *Decision:* Start with the case to generate the tension. Use the tension to motivate the ontology. The ontology comes *inside* the case discussion, not before.

  4.  **Step 2: Evaluating the Example (The Carrying Case):**
      *   *Proposed:* Player-built structure. Variant A: Griefing (4 hours demolition). Variant B: Server Wipe (Studio error).
      *   *Pros:* Distinguishes Agent vs. Event. Distinguishes Loss from Wrong.
      *   *Cons (TA's worry):* Effort (4 hours), Ownership (did they own it?), Rules (was griefing allowed?).
      *   *Analysis:* The "4 hours" is dangerous. It invites the "Sweat Equity" argument, which conflates *value* with *reality*. The "Rules" issue invites legalism (EULA), which the TA wants to avoid.
      *   *Improvement:* Strip the effort. Make the object *given* or *instant*. Focus on the *state change* of the world, not the labor. Strip the EULA ambiguity. Make the griefing clearly against community norms but technically possible, or make the wipe clearly accidental.
      *   *Better Example:* A unique, non-fungible in-game item (e.g., a "Legendary Sword" or a specific plot of land with a specific configuration) that has social significance beyond stats.
      *   *Wait, stick to the TA's intuition:* The structure is good because it's *spatial* and *persistent*. But remove the "4 hours." Make it "overnight." Remove the "tools the game provides." Make it "exploit" or just "destruction."
      *   *Verdict:* Keep the structure/wipe pair. It's the strongest for separating Loss (both cases) from Wrong (only one case). *Strip:* The specific time duration (replace with "significant investment" vaguely), the specific mechanics of destruction (replace with "deleted"), and any mention of EULA.

  5.  **Step 3: Misconception Map:**
      *   *TA's List:*
          1.  Real = Matter.
          2.  Real Object = Theft/Window Smashing.
          3.  Bits Persist/Backup = No Loss.
          4.  Harm = Hurt Feelings.
      *   *Ranking by Timing:*
          1.  **Real = Matter:** Comes immediately (Reflex 2: "It's just code"). *Defuse:* Functionalism/Pattern ontology.
          2.  **Bits Persist = No Loss:** Comes when discussing the Wipe. *Defuse:* Distinction between token and type, or continuity of history.
          3.  **Harm = Hurt Feelings:** Comes when discussing the impact. *Defuse:* Distinguish psychological state from objective setback of interests.
          4.  **Real Object = Theft:** Comes when assigning blame. *Defuse:* Distinguish metaphysical status from normative status.
      *   *Missing Fifth:* **"The Magic Circle" / "It's Just a Game."** The idea that actions inside the boundary don't count as actions *simpliciter*. This underpins Reflex 2. Needs to be addressed early.

  6.  **Step 4: The Final Question:**
      *   *TA's Idea:* Studio restores from backup silently. Only one player notices.
      *   *Analysis:* This is excellent. It tests the "Loss" vs. "Experience of Loss" distinction. If the object is restored, was there a loss? If only one knows, was there harm?
      *   *Refinement:* Make sure it targets the *three-way separation*.
      *   *Question:* "If the backup is restored instantly and only the griefer knows they did it, did a harm occur?"
      *   *Target:*
          *   Object Real? (Yes, it was deleted then restored).
          *   Loss Real? (Temporary loss of access/utility).
          *   Wrong? (Intent to disrupt).
      *   *Wait, TA's version:* "Only one of the two players ever notices." This targets the "Hurt Feelings" misconception perfectly. If the victim doesn't know, are they harmed? (Objective vs. Subjective well-being).

  7.  **Step 5: Refusals:**
      *   *TA's List:* Legal/EULA, Virtual World Realism (Matrix style), Taboo Content (CSAM/Killing).
      *   *Critique:*
          *   Legal/EULA: Correct refusal. Keep metaphysics/ethics separate from law.
          *   Virtual World Realism: Correct refusal. Don't get bogged down in "Is the *world* real?" Focus on objects/harms.
          *   Taboo Content: **Crucial.** As a first-year seminar TA, do not touch CSAM/virtual pedophilia without faculty supervision. It's a minefield. Keep the refusal.
      *   *Addition:* Refuse the "Definition of Reality" itself. Acknowledge "real" is a cluster concept, we are using a specific functional definition for this class.

  8.  **Drafting the Plan (Iterative refinement):**

      *   *Intro:* Acknowledge the TA's metaphysics stress. Validate that "real" is doing too much work.
      *   *Structure:*
          1.  **The Hook (0-10):** Elicit the two reflexes. Don't solve yet.
          2.  **The Case (10-25):** Present the Structure/Wipe vs. Griefing.
          3.  **The Ontology (25-35):** Introduce the "Pattern/Process" view *here* to resolve the "Just Code" objection.
          4.  **The Ethics (35-45):** Separate Loss from Wrong.
          5.  **The Exit (45-50):** The Backup Question & Refusals.
      *   *Example Tweak:* The "4 hours" is the biggest risk. It triggers "Labor Theory of Value." Change to "A unique structure that served as a guild headquarters." Focus on *function* and *social role*, not labor time.
      *   *Misconception Ordering:*
          1.  "Just Code" (Matter) - Early.
          2.  "Just a Game" (Magic Circle) - Early/Mid.
          3.  "Backups fix it" (No Loss) - Mid.
          4.  "Hurt Feelings" (Harm) - Late.
          5.  "Real Object = Crime" (Category Error) - Late.
      *   *Refusals:* The Taboo one is non-negotiable. Do not touch it. The Legal one is good. The "Is the World Real" one is good.

  9.  **Final Review against constraints:**
      *   Did I explain the topic to the TA? No, I'm planning the pedagogy.
      *   Did I address the ontology timing? Yes (inside the case).
      *   Did I evaluate the example? Yes (keep, but strip labor/rules).
      *   Did I rank misconceptions? Yes.
      *   Did I provide the final question? Yes.
      *   Did I validate the refusals? Yes.

  10. **Tone Check:** Ensure I sound like a senior colleague/mentor, not a textbook. Acknowledge the difficulty of the "real" predicate.

  *(Self-Correction during drafting)*: I need to be careful about the Ontology section. The TA wants to introduce "publicly observable, causally active, mind-independent but not made of stuff." That's heavy. I need to tell them *how* to say that without losing the room. Suggest using an analogy (a wedding, a promise, a software bug) to illustrate "real but non-physical."

  *(Refining the Example)*: The TA worries the example smuggles in effort/ownership. I need to tell them to *stipulate* ownership and value. "Assume the structure is valuable to the builder. Assume the builder has the right to have it there." Force the metaphysical/ethical question by fiatting the legal/labor ones.

  *(Refining the Refusals)*: The Taboo content refusal is vital. But I should advise them to frame it as "out of scope for *this* session" rather than "too dangerous," to maintain intellectual openness while protecting themselves.

  *(Final Polish)*: Ensure the three-way distinction (Object, Loss, Wrong) is the through-line. Every section must map back to it.

