answer: |-
  This is a sharp pedagogical problem. You are trying to teach a metaphysical distinction (ontology) and a normative distinction (ethics) simultaneously, using a concept ("real") that is doing too much work for both. Your instinct to separate Object, Loss, and Wrong is correct; that is the only way to prevent the discussion from collapsing into "It's just a game" vs. "I paid real money."

  Here is the plan for the fifty minutes, structured to force the three-way separation without requiring you to solve the metaphysics of virtuality before you begin.

  ### 1. Sequencing the Ontology
  **Do not introduce the ontology first.** If you start by defining virtual objects as "causally active patterns implemented in a computational substrate," you will lose the room. First-years do not yet feel the *need* for that definition.

  **The Sequence:**
  1.  **Elicit the Reflexes (0–10 mins):** Let them argue the binary. Money/Law vs. Code/Feelings. Write their arguments on the board in two columns. Do not adjudicate.
  2.  **Run the Case (10–25 mins):** Present the scenario. Let the binary reflexes fail to explain the difference between the two variants.
  3.  **Introduce the Ontology as a Tool (25–35 mins):** Now that they are stuck (because "code" applies to both variants, and "money" applies to both), introduce your functionalist definition of the object to explain *what* was lost in both cases.
  4.  **Separate Loss from Wrong (35–45 mins):** Use the ontology to show that while the *loss* is identical in both variants, the *wrong* is not.
  5.  **Assessment & Refusals (45–50 mins).**

  **Why this order:** You need the students to feel the explanatory gap before you offer the metaphysical tool. The ontology solves the stalemate generated by the case, not the stalemate generated by the reading.

  ### 2. The Carrying Case
  Your pair (Griefing vs. Server Wipe) is the right engine for this session. It cleanly separates **Loss** (occurs in both) from **Wrong** (occurs in only one). However, your worry about smuggled intuitions is valid.

  **What to Strip:**
  *   **Strip the "Four Hours":** This invites the Labor Theory of Value ("I made it, so it's mine/real"). It conflates *creation* with *ontology*. Change this to "A structure that served as the group's meeting place." Focus on the *function* and *social role*, not the sweat equity.
  *   **Strip the "Tools the Game Provides":** This invites the "Rules As Written" defense ("The game allowed it, so it's fair"). Stipulate that the destruction was unintended by the designers in both cases, or simply irrelevant to the metaphysical status.
  *   **Strip the "Apology":** In the server wipe variant, remove the studio's emotional response. Make it a cold technical event. You want to isolate the *event*, not the *remediation*.

  **What to Add (Stipulations):**
  *   **Stipulate Value:** Tell them, "For the sake of argument, assume this structure was essential to the players' goals and represented a significant investment of time or resources." This prevents them from dismissing the loss as trivial.
  *   **Stipulate Rights:** "Assume the players had a legitimate expectation that the structure would persist." This prevents the "It's just code, they have no rights" dodge.

  **Why this is better:** By fiatting the labor and legal questions, you force them to confront the metaphysical and ethical core. If they argue "But did they own it?", you point to the stipulation. If they argue "But was it hard to build?", you point to the stipulation. The only variables left are **Existence**, **Loss**, and **Agency**.

  ### 3. The Misconception Map
  You identified four strong misconceptions. Here is the ranking by *when* they will appear in the room, and the specific move to defuse them.

  1.  **"Real Means Material" (The Code Reflex)**
      *   **When:** 0–10 mins (Initial reflexes).
      *   **Defuse:** Do not argue yet. Park it. Say, "We will test whether 'made of matter' is the right test for 'real' using the case."
      *   **Move:** When you introduce the ontology (min 25), use a non-virtual analogy. Ask: "Is a *promise* real? Is a *bug* in the software real?" They are not made of matter, but they are causally active and mind-independent (the bug exists even if I don't see it). Use this to bridge to the virtual object as a **pattern**.

  2.  **"The Magic Circle" (It's Just a Game)**
      *   **When:** 10–25 mins (During the case).
      *   **Defuse:** This is the belief that actions inside the boundary don't count as actions *simpliciter*.
      *   **Move:** Ask, "If I punch you in the arm during a boxing match, is it a punch? Yes. Is it a foul? Maybe. Is it a crime? No. But the *impact* is physical." Distinguish the *context* of the action from the *reality* of the action.

  3.  **"Backups Mean No Loss" (The Restoration Fallacy)**
      *   **When:** 25–35 mins (When discussing the object's persistence).
      *   **Defuse:** This is the belief that if the bits can be restored, the token wasn't lost.
      *   **Move:** Use the "House Fire" analogy. "If your house burns down and you rebuild it exactly the same using the insurance money, did you suffer a loss?" (Yes, the historical continuity was broken). This clarifies that the loss is the **interruption of the process**, not the permanent annihilation of the type.

  4.  **"Harm Is Hurt Feelings" (The Subjectivity Trap)**
      *   **When:** 35–45 mins (When discussing the Wrong).
      *   **Defuse:** This collapses harm into psychological distress.
      *   **Move:** Distinguish **Setback to Interests** from **Psychological State**. "If I steal your wallet while you are asleep, and you never find out, have I harmed you?" (Yes, your security and resources are compromised, even if you feel fine). Apply this to the virtual object: the loss of access/utility is the harm, regardless of emotional reaction.

  5.  **The Missing Fifth: "The Category Error"**
      *   **When:** 35–45 mins.
      *   **Misconception:** "If the object is real, then destroying it must be theft/vandalism in the *legal* sense."
      *   **Defuse:** This is where you enforce the three-way separation. "We are asking if it is a *harm*, not if it is a *crime*." A harm can exist without a legal remedy.

  ### 4. The Final Question (Assessment)
  Your backup variant is excellent. Here is how to phrase it to test the three-way separation specifically.

  **The Scenario:** "The griefer destroys the structure. The studio detects it instantly and restores the structure from a backup before the builder ever logs back in. The builder never knows it happened. The griefer knows."

  **The Question:** "Did a harm occur? If yes, to whom, and of what kind?"

  **What to listen for (The Three-Way Separation):**
  *   **Object:** Did they acknowledge the object existed and was deleted? (Ontology)
  *   **Loss:** Did they acknowledge a loss occurred even if restored? (Continuity/Interruption)
  *   **Wrong:** Did they identify the griefer's intent as the source of the *wrong*, distinct from the *loss*?
  *   **Success Indicator:** A student says, "The builder wasn't emotionally hurt, and their access wasn't permanently lost, but their right to security was violated," or "The studio suffered a loss of resources, but the builder suffered no harm."
  *   **Failure Indicator:** "No harm because nobody felt sad" (Collapses to feelings) OR "Yes, it's theft" (Collapses to law).

  ### 5. The Refusals
  Your list of refusals is mostly correct, but one needs reframing.

  1.  **Legal / EULA:** **Keep.** Explicitly say: "We are asking about metaphysics and ethics, not contract law. A thing can be a real harm even if the EULA says you have no recourse."
  2.  **Virtual World Realism (Matrix style):** **Keep.** "We are not asking if the *world* is real, but if the *objects and interactions* within it have real consequences."
  3.  **Taboo Content (CSAM/Virtual Killing):** **Keep and Fortify.** Do not moderate this without training. Frame the refusal as **Scope**, not **Sensitivity**.
      *   *Say:* "The reading raises questions about taboo content. That is a crucial ethical question, but it relies on premises about harm we haven't established yet. We are bracketing that for today to focus on the structure of harm itself."
  4.  **The Definition of "Real":** **Add this.**
      *   *Say:* "I am not going to give you the final definition of 'real.' I am asking you to test which definition makes sense of our intuitions about loss and blame."

  **One Refusal to Reconsider:**
  Do not refuse the **"Is it theft?"** question entirely. Instead, reframe it. If a student asks, "Is this theft?", do not say "I won't answer that." Say, "That is a legal category. I am asking if it fits the *moral structure* of theft. Those are different questions." This uses their legal intuition as data without letting it dominate the metaphysics.

  ### Summary of the Flow
  1.  **0–10:** Board work. Two columns. Money vs. Code. No resolution.
  2.  **10–25:** The Case (Griefing vs. Wipe). Stipulate value/rights. Ask: "Is the loss the same? Is the blame the same?"
  3.  **25–35:** Ontology Intervention. "Just code" vs. "Functional Pattern." Use the Bug/Promise analogy.
  4.  **35–45:** Harm vs. Wrong. Use the "Sleeping Wallet" analogy to detach harm from feelings.
  5.  **45–50:** The Backup Question. Check for the three-way split. State refusals.

  You are not trying to solve the metaphysics of virtual worlds in 50 minutes. You are trying to give them the vocabulary to notice that they are asking three different questions when they think they are asking one. If they leave knowing that "Is it real?", "Did I lose something?", and "Did you wrong me?" are separable, you have succeeded.
