  The beauty lives not in the thing observed.
  It is a sentiment raised within the breast, distinct from the fact.

  2.
  Since every mind reflects a different light, we seek a rule to calm the chaotic variance of feeling.

  3.
  We crown the judge whose practiced eye compares the whole, whose delicate sense detects the subtle part, unswayed by interest or the fashion of the day.

  4.
  Yet we identify this sovereign taste only because their verdicts echo the sentiments we struggle to trust.

  5.
  We find the standard only where our feelings converge.
  The beauty lives not in the thing observed, but in the sentiment we chose to name the law.
