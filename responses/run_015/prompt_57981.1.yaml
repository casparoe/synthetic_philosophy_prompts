      *   *Wait, is 9 too harsh?* For an upper-level seminar, understanding the compatibility of externalism and self-knowledge is usually a learning objective. Accepting the skeptical conclusion without argument is a failure. However, the writing is clear. Let's go with 10/20 to allow for some clarity points, but heavily penalize the philosophical errors. Actually, better to stick to accuracy. 9/20 seems defensible for "substantive errors on 2/3 parts." Let's split the difference at 10/20 for clarity + part (a).
      *   *Decision:* I will grade strictly on accuracy as requested.
