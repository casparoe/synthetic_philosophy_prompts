answer: |-
  Here are eight interview questions (four main lines of inquiry with follow-ups) designed to press your source on the "right reasons" requirement. They cover your three required topics plus a fourth on moral testimony, which is a strong secular parallel to the divine command objection.

  **1. The Divine Command Objection**
  **Q:** A standard objection to your view is that it rules out religious motivation as morally worthy. But if God's commands *are* the source of moral reasons, isn't acting because God commanded it the very definition of acting for the moral reason? When you dismiss this as "heteronomy," aren't you just making a verbal distinction between "obeying the good" and "obeying God"?
  **[Anticipated Answer]:** She will likely argue that moral worth requires *autonomy*—the agent must understand and endorse the value of the action themselves, rather than blindly submitting to external authority.
  **Follow-up:** But if the agent *does* understand the value—say, they see that murder is wrong *and* that God forbids it—does the religious motivation contaminate the moral worth? Or is your worry only about the agent who obeys *without* understanding the value?

  **2. The Moral Luck / Failed Rescue Case**
  **Q:** Let's look at moral luck. Suppose I jump into a river to save a drowning child for the right reasons, but unbeknownst to me, the child was already dead. My action was futile; I didn't actually save anyone. On your view, do I still possess moral worth?
  **[Anticipated Answer]:** She will likely say yes, following the Kantian line that moral worth resides in the will (the maxim), not the successful outcome.
  **Follow-up:** If moral worth is detached from the actual good we bring about, aren't we praising a kind of delusion? If the "right reason" is supposed to track the good, but the good is impossible, doesn't the reason lose its object and therefore its worth?

  **3. The Content of the "Right Reason"**
  **Q:** There's a debate about what the "right reason" actually looks like in the agent's mind. When I help a friend, is the morally worthy reason the abstract fact *that I ought to help*, the intrinsic *value of their welfare*, or simply my *care for them*? If I help because I love them, but not because "it's my duty," do I lack moral worth?
  **[Anticipated Answer]:** She will likely argue for a nuanced view where the *underlying* commitment must be moral, even if the conscious thought is love (avoiding the "one thought too many" objection).
  **Follow-up:** So you're saying the moral reason operates in the background? If so, how do we distinguish that from someone who just happens to have nice instincts? If the moral reason isn't the *primary* conscious motivator, does it really deserve the credit for the worth?

  **4. Moral Testimony and Deference**
  **Q:** A secular version of the divine command problem is moral testimony. If I do the right thing solely because a moral expert told me to, without grasping the reasons myself, you'd say I lack moral worth. But in a complex world, isn't deferring to expertise often the *most* rational way to get the right result?
  **[Anticipated Answer]:** She will likely maintain that deferring strips the agent of moral agency; to have worth, one must grasp the first-order reasons, not just second-order authority.
  **Follow-up:** But if grasping the first-order reasons is too demanding for ordinary people in complex situations, does your view make moral worth an elite status? Are you saying the average person, trying to be good by following trusted guidance, is incapable of acting with moral worth?
