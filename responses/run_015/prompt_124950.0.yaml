answer: |-
  Good evening, everyone.

  For those of you who don't know me, I am a retired physical oceanographer. For those of you who do know me, you know that for the last thirty-five years, I have had the privilege of arguing with the guest of honour. We have argued over data, over equations, and, most frequently, over the shape of the ocean.

  Specifically, we have argued over the fact that [Friend's Name] spent his career modelling the ocean as a series of boxes.

  Now, half the people in this room know that the ocean is not made of boxes. The other half can take my word for it. It is fluid, it is chaotic, and it is gloriously continuous. To represent it as a handful of rectangular tanks is, by any standard measure, a lie.

  [Friend's Name] never denied this. In fact, he wore it as a badge of honour. For three decades, at conference after conference, when a young modeller would stand up and apologize for the crudeness of his assumptions, [Friend's Name] would lean back and deliver his favourite maxim: "A model you cannot falsify in the first five minutes is a model you have not yet understood."

  He believed that if your model was too complex to be quickly proven wrong, it was too complex to teach you anything.

  Standing here tonight, looking back over thirty-five years of collaboration, I find myself in a slightly awkward position. Usually, when we praise a scientist's career, we say one of two things. We say, "He found the truth," or we say, "He made useful predictions."

  I cannot say either of those things about [Friend's Name].

  I cannot say he found the truth, because he chose his assumptions knowing they were false. He didn't stumble into simplification; he marched toward it deliberately. And I cannot say he made useful predictions in the conventional sense, because his models were notorious for getting the numbers wrong. Occasionally by an order of magnitude. If you were betting on the exact temperature of a current based on his box model, you would have lost your shirt.

  And yet, we are all here. We are here because his work is the reason we knew which measurements to take next. It is the reason we knew where to look.

  So, what do we call a career built on deliberate falsehoods that predicted badly but guided us true?

  I have been reading a bit of philosophy since I retired, trying to understand what it was we were actually doing. I have come to a distinction that I think fits [Friend's Name]'s work perfectly. It is the distinction between a falsehood you can *pay back*, and a falsehood that is *load-bearing*.

  Most science uses the first kind. It is like a map with a slightly wrong scale. You know it's not perfect, but you can fix it. You can add the friction, you can resolve the eddies, you can split the box in two. As you add the detail, the result degrades continuously. You can see exactly how much error you took on, and you can pay it back with better data. That is standard, careful science.

  [Friend's Name] worked with the second kind. A load-bearing falsehood.

  Think of it like a caricature sketch. If you draw a caricature of a friend, you might exaggerate the nose. If you try to "fix" the drawing by making the nose realistic, you don't get a better likeness. You lose the likeness entirely. The exaggeration was not a shortcut to the image; it was the only place where the resemblance showed up at all.

  This was [Friend's Name]'s genius. He found places in the physics of the ocean where the phenomenon he was studying was so buried in noise that it vanished in a realistic model. It only became visible when you stripped the world down to its bones. When you made the assumption less false, the effect didn't get more accurate; it dissolved.

  For a scientist, this is a terrifying place to stand. It means you cannot claim you are approximating the truth. You have to claim that you are holding up a mirror that distorts the face in order to reveal the expression.

  To his family and friends here tonight: this is why he worked so hard, and why he was so un-defensive. He wasn't trying to be right about the numbers. He was trying to be clear about the mechanism. He treated his models not as prophecies, but as questions. He would build a box, watch it fail, and say, "Ah, look. It failed *here*. That means the real ocean must be doing something interesting at this boundary."

  He didn't give us answers. He gave us better questions.

  To the modellers in the room: we know that General Circulation Models are the future. They are beautiful, complex, and true to the geometry. But they are also black boxes. You put the data in, and the answer comes out, and sometimes you don't know why. [Friend's Name] gave us the white box. He gave us the transparency that allowed us to trust the black box when it mattered. He built the scaffolding. You don't live in the scaffolding, but you cannot build the cathedral without it.

  There is a humility in this approach that I admire more than any award he could have won. It requires a lack of ego to stand up at a conference and say, "I know this is wrong, and I know exactly why it is wrong, and that is why you should listen to me."

  He taught me that clarity is a virtue distinct from accuracy. Accuracy is about the world. Clarity is about us, and our ability to understand the world. And sometimes, to be clear, you have to be wrong.

  [Friend's Name], you have spent thirty-five years building boxes that the ocean does not fit into. You have shown us that sometimes you have to break the world to see how it ticks. You have been a collaborator who valued the argument more than the agreement, and the question more than the answer.

  You are retiring from the work, but you are not retiring from the questioning. And for those of us left in the room, still trying to measure the unmeasurable, we will need that.

  So, if everyone could please rise.

  To [Friend's Name]. May your future models be falsifiable in five minutes, and may your life be infinitely more complex than any box you can put it in.

  To [Friend's Name].
