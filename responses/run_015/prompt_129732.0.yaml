answer: |-
  You have a really strong historical intuition. You're correctly sensing that not all "missing evidence" arguments are created equal.

  There is indeed one overarching principle that captures the distinction you're feeling. Historians and scientists often call it **Consilience** (or the Convergence of Evidence), but for your specific rule, I'd phrase it as:

  ### **The Principle of Independent Corroboration**

  **The Rule:** A historical claim is plausible if it fits into the existing web of *independent* evidence (geology, astronomy, biology, foreign records) without requiring you to cut the threads of that web. A claim becomes pseudohistory when it requires a **conspiracy of silence** or the **systematic falsification** of independent data to survive.

  Here is how this rule breaks down your examples, validates your Olmec theory, and predicts your Library case.

  ---

  ### 1. Why your gut is right about Phantom Time vs. Olmecs
  You noticed that both Phantom Time and your Olmec theory rely on "missing evidence," but they feel different. The Principle of Independent Corroboration explains why.

  *   **The Olmec Palm-Leaf Theory (Verdict: Plausible Inference)**
      *   **Does it fit known science?** Yes. We know organic material (palm leaves, bark paper) rots in tropical humidity. We know the Maya used bark paper, so it is consistent that neighbors might have too.
      *   **Does it require a conspiracy?** No. It relies on a natural process (decay).
      *   **Does it contradict other evidence?** No. It explains why we *don't* have writing without contradicting the stone carvings we *do* have.
      *   **Result:** This is valid historical reasoning. It acknowledges the limits of preservation rather than inventing a cover-up.

  *   **The Phantom Time Hypothesis (Verdict: Pseudohistory)**
      *   **Does it fit known science?** No. To delete 300 years, you have to explain away tree rings (dendrochronology) that show 300 years of growth. You have to explain away ice core layers. You have to explain away solar eclipses recorded by the Chinese and Islamic worlds (who weren't involved in the Pope's calendar).
      *   **Does it require a conspiracy?** Yes. It requires the Holy Roman Emperor and the Pope to somehow coordinate a lie that silently affected tree growth and Chinese astronomers.
      *   **Result:** This fails the rule. It requires cutting too many independent threads of evidence.

  ### 2. The Black Death / Volcano Question
  Your gut says you "can't decide" on this one. The rule helps here too.

  *   **Verdict: Legitimate Historical Debate.**
  *   **Why:** This hypothesis does not deny the Black Death happened. It suggests an *environmental variable* (volcanic winter) influenced the *spread*.
  *   **Testability:** We can check ice cores for sulfate spikes (volcanic ash) around 1347. We can check tree rings for cold weather. We can check trade records.
  *   **The Difference:** Unlike Phantom Time, this theory *invites* counter-evidence. If ice cores show no eruption, the theory is modified or dropped. That makes it science/history, not pseudohistory.

  ---

  ### 3. Prediction: The Library of Alexandria Acid Rain Theory
  **The Claim:** The Library wasn't burned in wars; it was slowly dissolved by acid rain from a nearby volcano.

  **My Prediction based on the Rule:**
  This classifies as an **Improbable Hypothesis** (bordering on pseudohistory depending on how it's argued).

  **Here is the breakdown:**
  1.  **Geology Check (Independent Evidence):** Alexandria is not near an active volcano. The nearest major volcanic zones are the Aegean (Santorini) or East Africa. For acid rain to specifically target Alexandria without destroying other stone structures in the region or being recorded as "ash falling from the sky" by contemporary witnesses is geologically unlikely.
  2.  **Textual Check (Independent Evidence):** We have multiple historical accounts referencing fires in Alexandria (Caesar's civil war, etc.). To say it was *only* acid rain requires dismissing these texts.
  3.  **The Verdict:**
      *   If the claim is: *"Acid rain might have contributed to the decay of scrolls alongside fire,"* it is an **Unproven Theory**. It is testable (check ice cores for eruptions, check papyrus for chemical erosion).
      *   If the claim is: *"The fires never happened, it was all acid rain, and the historians lied,"* it becomes **Pseudohistory**.

  **Why it differs from the Olmec case:**
  The Olmec case uses missing evidence to say "We don't know what they wrote." The Acid Rain case uses missing evidence to say "We know what happened, but everyone else is wrong." The former expands knowledge; the latter requires a conspiracy of error.

  ### Summary of Your Rule
  You don't need to drop a verdict on every case individually. Just apply this filter:

  > **"Does this theory explain the missing evidence through natural processes (rot, decay, loss), or does it explain the *contradictory* evidence through human deception (fakes, lies, conspiracies)?"**

  *   **Olmec Leaves:** Natural process. (Keep)
  *   **Phantom Time:** Human deception. (Drop)
  *   **Black Death/Volcano:** Natural process. (Keep as debate)
  *   **Alexandria Acid Rain:** Natural process, but contradicts geography/texts. (Treat as highly skeptical/unproven).

  Your intuition is spot on: **Missing evidence is a mystery; contradictory evidence is a wall.** You can build a theory on a mystery (Olmecs); you cannot build one by smashing through a wall (Phantom Time).
