answer: |-
  Here is a defended prioritization of your three research lines, ranked by their logical dependency and potential to unblock the seminar's stalemate.

  ### The Ranking

  **1. Scalar Moral Ontology (Line 1)**
  **2. Distributive Justice in Memorial Culture (Line 2)**
  **3. Transitional Justice Mechanisms (Line 3)**

  ### The Defense

  I am prioritizing **(1) Scalar Moral Ontology** as the upstream bottleneck, based primarily on the criterion of **dependency**. Your seminar is stuck because participants are treating comparison as an inherent violence (the "flattening" charge). Until you establish a conceptual framework where comparison does not necessarily equal reductionism—for example, by distinguishing between *ordinal ranking* (which is obscene) and *typological differentiation* (which is analytical)—Lines 2 and 3 lack normative legitimacy. If the tool of comparison is fundamentally broken, you cannot justly distribute memory (2) or assign legal proportionality (3). While (1) has low **tractability** (it is dense philosophical work), it has the highest **payoff** for the field because it validates the possibility of comparative history itself.

  I place **(2) Distributive Justice** second because it explains the *intensity* of the resistance to (1). The *Historikerstreit* was ostensibly about history but functionally about German national identity and resource allocation. Researching this is highly **tractable** (you can track funding, curriculum hours, and museum square footage), and it contextualizes the "moral outrage" as political strategy. However, it is downstream of ontology because the political claims are framed *as* ontological ones (e.g., "Our suffering is unique" is a claim about the nature of the event, not just a bid for funds).

  I place **(3) Transitional Justice** last because it is the most **downstream application**. Legal mechanisms for proportionality depend entirely on the outputs of (1) and (2). Without a settled ontology, legal comparisons are arbitrary; without a settled memory politics, they are contested. While the **practical payoff** here is highest for victims (sentencing, reparations), it is the least fruitful starting point for a *historiographical* research agenda because law often operates on procedural fictions regardless of philosophical consensus.

  ### Upstream/Downstream Dynamics

  If you settled the ontology question (1), you would **partially resolve** the transitional justice question (3) but likely **fail to resolve** the memorial culture question (2).

  *   **Ontology → Justice:** A robust moral ontology that allows for multidimensional comparison (e.g., comparing intent vs. outcome vs. scale without creating a single "suffering index") provides the normative grounding legal scholars need to argue for proportionality without trivializing specific traumas.
  *   **Ontology → Memory:** Solving the philosophy does not solve the politics. Even if philosophers agree that comparison is valid, groups may still resist it to protect group identity or secure funding. The "obscenity" objection often functions as a political veto, not a philosophical critique. Therefore, (1) and (2) run on partially separate tracks: one is about truth-conditions, the other about power-conditions.

  ### Confidence and Uncertainty

  **Confidence Level:** I am **highly confident** (85%) in this ordering based on logical dependency; you cannot build a comparative methodology without first defending the comparability of the units.

  **Point of Least Certainty:** I am **least sure** (40% confidence) about the causal link between resolving the ontological debate and actual changes in transitional justice outcomes. Legal systems are path-dependent; courts often rely on precedent and statutory definitions rather than moral philosophy, so a breakthrough in moral historiography might be ignored by practitioners in The Hague or domestic truth commissions.

  ### Summary

  Prioritize the ontological defense of comparison as the logical precondition for the field, but treat the political economy of memory as the primary driver of resistance that philosophy alone cannot fix.
