answer: |-
  hey, this is a really fascinating puzzle you have dug up, and i think you are right to feel that the standard application of the principal principle gets something wrong in this specific deterministic branching context. the intuition that rational credence should track the global proportion of 0.3 feels robust at first glance because we are trained to think of objective chance as a God's-eye view of the system, but in cases involving self-locating uncertainty within a known mechanistic structure, that God's-eye view becomes misleading for the agent embedded in the system. when you have a deterministic splitter creating one hundred copies where thirty have a red light, the global frequency is indeed 0.3, but if the deterministic rule clusters those red lights in a way that correlates with the agent's epistemic situation, deferring to the global number ignores the relevant structure of the uncertainty. imagine for a moment that the deterministic rule assigns red lights to copies with indices one through thirty, and blue to thirty-one through one hundred, but suppose the agent also knows they are in a copy that possesses a specific localized feature, say a particular hum in the ventilation system, which only occurs in copies one through ten. in this scenario, every copy with that hum has a red light, so the local frequency within that epistemic equivalence class is 1.0, even though the global chance remains 0.3. if the agent clings to the principal principle's directive to defer to the global objective chance of 0.3, they are effectively ignoring admissible evidence about their own location within the branching structure, which seems irrational.

  this is where your local branch deference principle becomes necessary, because it recognizes that in branching scenarios, the objective chance relevant to rational credence is not the global measure over all branches but the measure over the branches compatible with the agent's self-locating evidence. the standard principal principle assumes a separation between the chance process and the evidence, but here the chance process is the branching itself, and the evidence is indexical. by deferring to the localized branch-relative frequency, you are respecting the fact that the agent's uncertainty is not about the laws of nature or the global distribution, but about which branch they occupy. the rational credence should match the proportion of red lights within the set of copies that the agent cannot distinguish between, because that is the only set over which their uncertainty ranges. to insist on the global 0.3 is to treat the agent as if they were an external observer betting on the output of the machine as a whole, rather than a participant trying to predict their own experience within one of the outputs.

  now, the reply you mentioned tries to dissolve this problem by claiming that knowing the branching law plus your self-location counts as evidence about the outcome itself, which would traditionally be considered inadmissible evidence that overrides the principal principle entirely. the objector argues that because the system is deterministic, once you know the law and your specific situation, the outcome is fixed, so there is no chance to defer to and the principal principle never applied in the first place. this objection relies on conflating knowledge of the generating mechanism with knowledge of the particular result, and that is where the argument fails. knowing the deterministic rule tells you how the copies are generated and how properties are distributed across indices, but it does not tell you which index you are. the self-locating uncertainty is genuine because even with full knowledge of the law, there are multiple distinct copies that satisfy your current evidence, and they do not all share the same outcome in every clustering scenario.

  the crucial distinction here is between knowing the map and knowing your location on the map. the objection treats the deterministic law as if it collapses the uncertainty about self-location into certainty about the outcome, but it does not. the evidence you have is admissible in the sense that it describes your current state and the laws governing the system, but it does not reveal the future truth of the proposition in a way that bypasses the need for a probabilistic guide. in Lewisian terms, inadmissible evidence is usually information about the future outcome itself, like seeing the light turn red before you bet. knowing the branching law is not seeing the light; it is knowing the structure of the room. the uncertainty remains probabilistic because the agent is essentially sampling from the set of compatible copies, and the probability of being in a red copy is determined by the proportion of red copies within that compatible set. therefore, the principal principle does apply, but it must be applied to the correct chance function, which is the local branch frequency rather than the global one.

  if we accept the objector's view that this knowledge makes the principal principle inapplicable, we are left with no normative guide for how to set credences in deterministic branching cases other than pure conditionalization, but conditionalization requires a prior probability distribution over the indices. the local branch deference principle provides the justification for that prior by linking it to the objective structure of the branching. it tells us that the rational prior over self-locations should be uniform over indistinguishable copies within the relevant equivalence class. this preserves the spirit of the principal principle, which is to align subjective credence with objective structure, while correcting for the indexical nature of the agent's perspective. knowing the mechanism tells you the constraints, but it does not tell you the result, so the chance claim remains vital. the global proportion is a fact about the multiverse, but the local proportion is a fact about your epistemic situation within it, and rationality requires you to care about the latter when forming expectations about your own experiences.

  so ultimately, you are right to push for the local branch deference principle because it captures the idea that objective chance in a branching world is relative to the observer's epistemic access. the objection that this knowledge overrides chance mistakes the transparency of the law for transparency of the outcome. the law is transparent, but the outcome is opaque because of the self-locating uncertainty, and that opacity is exactly where chance lives. by deferring to the local frequency, you are acknowledging that the objective chance relevant to you is the chance of being in a red room given that you are in this kind of room, not the chance of a red room existing somewhere in the multiverse. this keeps the principal principle alive and useful in deterministic contexts, provided we understand that the chance function must be sensitive to the branching structure and the agent's location within it. it is a subtle shift, but it prevents the absurdity of an agent ignoring clear local correlations in favor of a global average that does not reflect their actual predicament. i think this holds up well against the standard objections because it respects the difference between metaphysical determination and epistemic uncertainty, which is the heart of the issue here.
