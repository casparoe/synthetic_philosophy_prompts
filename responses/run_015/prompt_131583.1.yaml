answer: |-
  # Coherence Audit Procedure: Conditional Forecast Triviality Check

  **Document ID:** AUD-COND-004
  **Owner:** Coherence Audit Desk
  **Time Limit:** 15 Minutes per Statement
  **Auditor Requirement:** No graduate logic training required.

  ## 1. Audit Objective
  To identify conditional forecasts ("If A, then B") that implicitly assume the **Equation** ($P(\text{If } A \text{ then } B) = P(B|A)$) while simultaneously maintaining a non-trivial belief system (uncertainty about other events). If a forecaster assumes the Equation universally while claiming uncertainty about the antecedent and other background facts, their probability distribution mathematically collapses (assigns 0 or 1 to all events). This audit detects that incoherence.

  ## 2. Audit Flowchart (Verbal)

  ### Step 1: Extraction and Formalization
  *   **Question:** Can you identify the Antecedent ($A$), the Consequent ($B$), and the assigned Confidence ($C$) as a numerical probability or a clear verbal equivalent (e.g., "likely" = >50%)?
  *   **Sufficient Answer:** A written record stating $A$, $B$, and $C$ (e.g., $A$="Rates rise", $B$="Recession", $C$=0.75).
  *   **Stop Condition:** **FAIL** (Escalate) if $A$ or $B$ are unintelligible or $C$ is missing. **PASS** to Step 2 if extracted.
  *   **Judgment Flag:** `false` (Mechanical extraction).
  *   **Misfire Warning:** Do not reject vague terms (e.g., "economic distress") as failures. Translate them to the best operational definition used by the forecaster. Rejecting vague but usable terms causes false negatives.

  ### Step 2: The Equation Check
  *   **Question:** Does the forecaster treat the Confidence ($C$) as identical to the conditional probability $P(B|A)$? (i.e., If asked "Given A happens, how likely is B?", would they give the same number $C$?)
  *   **Sufficient Answer:** Explicit confirmation from the forecaster or documentation showing $C$ was derived from $P(B|A)$ data (e.g., regression coefficients, historical frequency).
  *   **Stop Condition:** **PASS** (Audit Ends) if they distinguish $P(\text{If } A \text{ then } B)$ from $P(B|A)$. **CONTINUE** to Step 3 if they treat them as identical.
  *   **Judgment Flag:** `true` (Requires interpreting forecaster intent).
  *   **Misfire Warning:** Do not assume all forecasters equate these. Many treat "If A then B" as a causal mechanism with its own uncertainty. Forcing the Equation on them creates false positives.

  ### Step 3: Antecedent Contingency
  *   **Question:** Is the Antecedent ($A$) treated as contingent? (i.e., Does the forecaster assign $0 < P(A) < 1$?)
  *   **Sufficient Answer:** Documentation showing $A$ is uncertain (e.g., "Policy decision pending," "Market dependent").
  *   **Stop Condition:** **PASS** (Audit Ends) if $P(A)$ is 0 or 1 (Triviality constraints do not apply to certain events). **CONTINUE** to Step 4 if $A$ is uncertain.
  *   **Judgment Flag:** `false` (Check recorded probabilities).
  *   **Misfire Warning:** Do not flag $P(A)$ as 1 just because the forecast assumes a scenario. Check if the scenario itself is probabilistic in the broader model.

  ### Step 4: Propositional Status Check
  *   **Question:** Does the forecaster treat the statement "If A then B" as a standalone event that could be updated by new information $D$ (where $D$ does not imply $A$ or $B$)?
  *   **Sufficient Answer:** Evidence that the forecaster would change Confidence ($C$) if background theory $D$ changed, *without* changing $P(B|A)$. OR, evidence they treat the conditional as a bettable proposition independent of $A$'s occurrence.
  *   **Stop Condition:** **PASS** (Audit Ends) if they deny the conditional is a standalone proposition (treating it purely as an inference rule). **CONTINUE** to Step 5 if they treat it as a proposition *and* equate it to conditional probability.
  *   **Judgment Flag:** `true` (Semantic interpretation).
  *   **Misfire Warning:** This is the highest risk step. Many valid models treat conditionals as propositions. Do not flag this alone; it must be combined with Step 5.

  ### Step 5: The Collapse Test (Invariance Check)
  *   **Question:** Does the forecaster claim the Confidence ($C$) remains invariant across a partition of uncertain background states (e.g., "This probability holds regardless of which economic model is true")?
  *   **Sufficient Answer:** Explicit claim of invariance (e.g., "Robust across all models") while maintaining uncertainty about those models.
  *   **Stop Condition:** **FAIL** (Retraction Recommended) if they claim invariance while maintaining model uncertainty. This implies the distribution collapses to triviality. **PASS** if they admit $C$ varies by background state.
  *   **Judgment Flag:** `false` (Logical consistency check).
  *   **Misfire Warning:** Do not flag robustness claims that are approximations. Only flag claims of *strict* invariance that contradict the existence of the partition.

  ---

  ## 3. Case Applications

  ### Case (i): Central Bank Forecast
  *   **Statement:** "If the central bank raises rates by more than 150 basis points this quarter, recession is likely" (75% confidence).
  *   **Path:**
      1.  **Extraction:** $A$=Rates >150bp, $B$=Recession, $C$=0.75. (Pass)
      2.  **Equation:** Forecaster confirms 0.75 represents $P(\text{Recession} | \text{Rates}>150)$. (Continue)
      3.  **Contingency:** Rates decision is uncertain ($0 < P(A) < 1$). (Continue)
      4.  **Propositional:** Forecaster treats this as a model output, not a truth-apt proposition subject to independent updating. They view it as a structural relation. (Pass - Audit Ends).
  *   **Final Disposition:** **PASS**. The forecaster implicitly denies the conditional is a standalone proposition in the logical sense required for Lewis's triviality proof. They treat it as a structural constraint.
  *   **Unwelcome Result:** `false`

  ### Case (ii): Supplement Preprint
  *   **Statement:** "If this supplement is taken daily for eight weeks, working memory improves." (Supported by 40-subject preprint, no explicit probability).
  *   **Path:**
      1.  **Extraction:** $A$=Take supplement, $B$=Improve memory. Confidence implicit ("supported by"). (Pass with note)
      2.  **Equation:** Evidence maps to $P(B|A)$ from study data. Forecaster implies confidence matches study significance. (Continue)
      3.  **Contingency:** Taking supplement is voluntary/uncertain. (Continue)
      4.  **Propositional:** Ambiguous. Is the claim "The study is right" or "The biological mechanism holds"? (Escalate to Judgment).
      5.  **Collapse:** Forecaster admits confidence would drop if a larger trial contradicts the preprint (not invariant). (Pass).
  *   **Final Disposition:** **PASS (with advisory)**. No triviality violation, but low evidentiary quality. The conditional probability is not claimed to be invariant to new data.
  *   **Unwelcome Result:** `false`

  ### Case (iii): Institutional Macro Forecast (Retraction)
  *   **Statement:** "If Fiscal Stimulus >5% GDP is enacted, Growth >3% will occur (90% confidence). This probability is robust across all competing macroeconomic models (Keynesian, Monetarist, etc.), despite our uncertainty about which model is correct."
  *   **Path:**
      1.  **Extraction:** $A$=Stimulus >5%, $B$=Growth >3%, $C$=0.90. (Pass)
      2.  **Equation:** 0.90 is treated as $P(B|A)$. (Continue)
      3.  **Contingency:** Stimulus enactment is uncertain. (Continue)
      4.  **Propositional:** By claiming "robustness across models," they treat the conditional probability as a fixed fact independent of the model partition. (Continue)
      5.  **Collapse:** They claim $P(B|A)$ is invariant across the partition of Models ($M_1, M_2...$), while asserting $0 < P(M_i) < 1$. Lewis's triviality results show that if the Equation holds and conditional probabilities are independent of the partition, the probabilities of the partition elements ($M_i$) must be 0 or 1. This contradicts their stated model uncertainty. (Fail).
  *   **Final Disposition:** **FAIL (Retraction Recommended)**. The forecast is mathematically incoherent. It asserts model uncertainty while asserting a conditional probability that is only possible if model uncertainty is zero.
  *   **Unwelcome Result:** `true`

  ---

  ## 4. Limitations and Philosophical Silence

  **What the Procedure Cannot Do:**
  1.  **Settle Semantic Debates:** The audit assumes the Lewis/Stalnaker framework for indicative conditionals. It cannot adjudicate between philosophers who reject the Equation (e.g., Jackson, assertability theorists) and those who accept it (Adams). If a forecaster holds a non-probabilistic theory of conditionals, the audit may flag them incorrectly as "incoherent" relative to probability theory, though they are coherent relative to their own semantics.
  2.  **Handle Counterfactuals:** This procedure is for *indicative* conditionals ("If A is happening..."). It is silent on *subjunctive* conditionals ("If A had happened..."), which follow different logical constraints (e.g., imaging vs. conditioning).
  3.  **Detect Hidden Algebras:** The audit relies on stated uncertainties. If a forecaster has a "hidden" variable that resolves the triviality (making the algebra degenerate in a way not disclosed), the audit will Pass a statement that is technically trivial relative to the full truth.
  4.  **Resolve Vagueness:** The procedure cannot solve Sorites paradoxes inherent in vague antecedents (e.g., "If growth is *strong*..."). It treats vague terms as atomic propositions, which may mask underlying incoherence in how boundaries are drawn.

  **Where Philosophical Disagreement Makes the Audit Inconclusive:**
  *   **The Nature of "Probability":** If the forecaster uses "confidence" to mean *degree of assertability* rather than *degree of belief*, the triviality constraint does not apply. The audit cannot distinguish these without deep interrogation.
  *   **The Logic of Conditionals:** If the forecaster operates in a tri-valued logic (True/False/Indeterminate) rather than Boolean algebra, Lewis's proof does not hold. The audit assumes Boolean algebra; it cannot verify the underlying logic system in 15 minutes.

  ---

