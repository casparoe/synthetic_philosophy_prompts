answer: |-
  # DECISION TREE: THE SPACE OF VIEWS ON EXPERIENCE
  **Instructions:** Start at the top. Answer **Yes** or **No** (or choose A/B) to move down the branches. Do not worry about the names of the views until you reach a leaf.

  ### THE BRANCH QUESTIONS
  1.  **Properties:** Do the specific qualities (redness, pain) exist in the mind exactly as they seem?
  2.  **Dream Case:** In a vivid dream of a red room (no stimulus), is the redness present?
  3.  **Meditator Case:** If a meditator loses the "feeling" but keeps the skill, was the feeling real?
  4.  **Location:** If the qualities don't exist, is the error in the **sensing** (painting the scene) or the **reporting** (telling the story)?
  5.  **Seeming:** Is the "impression of feeling" itself a felt state?
  6.  **Mid-Task Case:** If you miss a stimulus while busy, were you experiencing it?
  7.  **Concept:** Is the confusion about the world or about our definitions?
  8.  **Meta:** Must we explain why everyone insists the qualities are real?
  9.  **Talk:** Should we stop using the talk if it's false?

  ---

  ### THE TREE

  **Q1: Do the qualities exist as they seem?**
  │
  ├── **YES** ──┬── **Q2 (Dream): Is redness present in a dream?**
  │             │
  │             ├── **YES** ──┬── **Q7 (Concept): Confusion about world or definitions?**
  │             │             │
  │             │             ├── **World** ──┬── **Q3 (Meditator): Was the feeling real?**
  │             │             │               │
  │             │             │               ├── **YES** ────────────────────────────────► **LEAF 1: Chalmers-Style Realism**
  │             │             │               │                                            *(Awkwardness: Properties exist but do nothing.)*
  │             │             │               │
  │             │             │               └── **NO** ─────────────────────────────────► **LEAF 2: Functionalism/Disjunctivism**
  │             │             │                                                            *(Awkwardness: Skill exists without the feeling.)*
  │             │             │
  │             │             └── **Definitions** ─────────────────────────────────────────► **LEAF 3: Quietist / Verbal Dispute**
  │             │                                                                              *(Awkwardness: The whole dispute is pointless.)*
  │             │
  │             └── **NO** ──────────────────────────────────────────────────────────────────► **LEAF 4: Disjunctivist Realism**
  │                                                                                            *(Awkwardness: Dreaming and waking are fundamentally different kinds.)*
  │
  └── **NO** ──┬── **Q4 (Location): Error in Sensing or Reporting?**
               │
               ├── **SENSING (Paint-First)** ──┬── **Q5 (Seeming): Is the impression a felt state?**
               │                               │
               │                               ├── **YES** ─────────────────────────────────────► **LEAF 5: First-Order Error Theory**
               │                               │                                                *(Paint-First | Awkwardness: Perception lies to us directly.)*
               │                               │
               │                               └── **NO** ──┬── **Q9 (Talk): Stop using the talk?**
               │                                            │
               │                                            ├── **YES** ────────────────────────► **LEAF 6: Hard Eliminativism**
               │                                            │                                    *(Paint-First | Awkwardness: The talk must be abolished.)*
