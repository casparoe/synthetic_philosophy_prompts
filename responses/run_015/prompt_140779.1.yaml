  ### UNOCCUPIED CELLS (Diagnosed)

  *   **[EMPTY CELL A] (Reporting + Seeming=Yes + Properties=No):**
      *   *View:* The story is added later, but the "impression of feeling" is itself a real feeling, yet there are no qualitative properties.
      *   *Diagnosis:* **Collapses.** If the impression is genuinely felt (Warm), then a qualitative property exists by definition. You cannot have a real feeling without a property of feeling.
  *   **[EMPTY CELL B] (Sensing + Seeming=No + Talk=Keep + Meta=No):**
      *   *View:* Perception paints a false picture, the subject feels nothing, we keep the talk, and we don't explain why people insist it's real.
      *   *Diagnosis:* **Unattractive.** If you don't explain why everyone insists on the qualities, you haven't solved the problem; you've just ignored the data.
  *   **[EMPTY CELL C] (Dream=No + Properties=Yes):**
      *   *View:* Qualities exist in waking life but vanish completely in dreams.
      *   *Diagnosis:* **Incoherent.** If qualities are mental, they should persist in hallucination. If they vanish in dreams, they depend on the external world (Disjunctivism), not the mind.

  ---

  ### COLLAPSED DISTINCTIONS (Flagged)

  *   **Attention Schema vs. Standard Illusionism (Leaf 9):**
      *   *Status:* **Collapsed.** On this tree, both land in **Press-First + Seeming=No**.
      *   *Reason:* Both claim the error is in the reporting/modeling system and that the "seeming" is not a real felt state. To split them, you would need a question about *what* the report is modeling (attention vs. belief), which is too technical for this level.
  *   **Dennett-Style (Leaf 10) vs. Quietist (Leaf 3):**
      *   *Status:* **Near Collapse.** Both treat the dispute as verbal/conceptual.
      *   *Reason:* Dennett says "Consciousness is real but not magical" (Leaf 10), Quietist says "The question is bad" (Leaf 3). They differ on whether we should keep doing science of consciousness, but on this tree, they both reject the "Properties as they seem" claim.
  *   **Hard Eliminativism (Leaf 6) vs. Fictionalism (Leaf 7):**
      *   *Status:* **Separated by Q9.**
      *   *Reason:* The only difference is whether we keep the language. This is a pragmatic, not metaphysical, split.

