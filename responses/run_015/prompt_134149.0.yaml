      *   *Time:* 55 minutes total.
          *   Intro/Setup: 5 mins.
          *   Round 1 (Binary): 10 mins.
          *   Round 2 (Budget/Gradation): 15 mins.
          *   Debrief/Discussion: 25 mins.
      *   *Materials:* Index cards (or slips of paper), pens, whiteboard.
      *   *Entities:* Need a clear spectrum.
          1.  Human Infant (High status intuition)
          2.  Golden Retriever (High animal status)
          3.  Hive of Bees (Collective/Instinctual)
          4.  Smart Thermostat (AI/Machine)
          5.  Rock (Control/Zero status)
      *   *Mechanic:* "Rescue Tokens."
          *   Round 1: Save/Discard (Binary).
          *   Round 2: Budget (Degrees).
      *   *Constraint:* Hidden voting to prevent bandwagoning initially, then public defense.

  3.  **Drafting the Activity - "The Lifeboat Protocol":**
      *   *Scenario:* A disaster is happening. You have limited resources.
      *   *Round 1 (The Line):* Give them 5 cards representing the entities. Ask them to sort into "Save" and "Let Go." But they only have resources to save 2. This forces a hard cutoff.
      *   *Round 2 (The Slider):* Give them 100 "points" to distribute. This allows for degrees.
      *   *Twist:* The "Thermostat" needs to be described carefully so it sounds *just* complex enough to be confusing (learns, avoids damage, regulates home for sick owner).

  4.  **Addressing the "Feel" of the Problem:**
      *   To make them feel the pull, the descriptions need to be evocative but neutral.
      *   To make the cutoff feel arbitrary, the debrief needs to highlight *why* they drew the line where they did.
      *   To make equality break down, point out that if they gave the rock the same as the baby, the game becomes meaningless.

  5.  **Planning the Debrief (Crucial Step):**
      *   Need to map the game mechanics to the philosophy.
      *   *Binary Round* = All-or-Nothing View (Species membership, Soul, Rationality).
      *   *Budget Round* = Gradualist View (Sentience, Suffering capacity).
      *   *Pitfalls:*
          *   *The Joker:* Someone treats the thermostat like a god to be funny. -> Mitigation: Facilitator seriousness.
          *   *The Dominator:* One loud voice. -> Mitigation: Silent voting first.
          *   *The Relativist:* "It's just opinion." -> Mitigation: Ask for *reasons*, not just votes.
      *   *Limitations:* Real life isn't a lifeboat. Emotions run higher with real victims.

  6.  **Refining the Rules & Flow:**
      *   *Setup:* Keep it tight. 5 mins.
      *   *Round 1:* "The Hard Cutoff." Save 2, Lose 3. Secret vote. Reveal. Argue.
      *   *Round 2:* "The Resource Allocation." 100 points to split. Secret vote. Reveal. Argue.
      *   *Discussion:* Compare the two rounds. Where did the tension happen?

  7.  **Writing the Response:**
