      *   *Check:* Debrief needs to explicitly mention "Arbitrary Cutoff" vs. "Equality Breakdown."
      *   *Adjustment:* Make sure the "Hidden Cards" part is clear. They write down their choice, then reveal. This prevents herd mentality.

  9.  **Final Polish:** Ensure the distinction between Round 1 (Binary) and Round 2 (Degrees) is sharp, as that's the core philosophical tension. Make sure the facilitator knows *when* to introduce the terms "Moral Status" (only in debrief).

  *(Self-Correction on the "Rock"):* The prompt asks about "bee closer to a rock or closer to a dog." I should include the rock to anchor the bottom, but maybe keep the focus on the middle. Let's include 5 entities total: Infant, Dog, Bee Hive, Thermostat, Rock.
  *Wait, 16 people.* Group work might be better than individual voting for discussion, but individual voting prevents the "loud kid" issue initially. Let's do Individual Silent Vote -> Small Group Discussion -> Whole Group Reveal. Actually, for 55 mins, Individual Silent Vote -> Whole Group Reveal is tighter. Let's stick to Individual Silent Vote to ensure everyone thinks, then open floor.
  *Correction:* To make it more interactive, let's have them write their "Cutoff Line" on a card.
