prompt: |-
  Next thursday I'm presenting a draft chapter to our phil of mind seminar. The thesis is kind of in the weeds: I accept Searle's core point that syntax isn't semantics and that original intentionality needs consciousness, but I want to defend this middle category I'm calling "prosthetic intentionality" — it applies when a conscious agent is tightly coupled to a syntactic system (say an LLM or even just a really complex lookup table) so the combined unit generates states that aren't reducible to the human's original intentionality or to the machine's derived intentionality alone. I'm using it to answer Dennett's two-bitser worry, where he shows that if you interpret any syntactic pattern liberally enough you can ascribe beliefs, but I think prosthetic cases are different because the anchoring is external and functional rather than interpretive. The audience is my advisr (who thinks I'm just smuggling in Clark/Chalmers extended mind without citing them), two grad students who are hardcore Searleans and will say any concession to Dennett kills the distinction, and one visiting scholar who thinks Dennett's intentional stance makes the whole original/derived debate moot. I need the objections ordered by how likely and damaging they are, phrased in their own voices, with notes on what to concede, what to hold, and especially the weakest spot — which is probably explaining why prosthetic intentionality isn't just derived intentionality with extra steps. Can you also flag the objection I'm secretly hoping nobody asks?

  Please format the answer with these sections in order:
  1. The setup and who says what (about 150 words)
  2. Objections in likely order, each with speaker, phrasing, and reply strategy (around 300 words)
  3. The concession/hold breakdown for each (around 150 words)
  4. The weakest point and how to defend it in 60 seconds (around 100 words)
  5. The hidden objection you're praying they skip, with a quick damage-control line (around 100 words)
