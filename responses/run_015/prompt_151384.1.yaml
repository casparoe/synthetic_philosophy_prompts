answer: |-
  You have stumbled onto one of the most persistent and technically thorny issues in formal epistemology. You are absolutely right to feel that the arithmetic is behaving strangely; it isn't a calculation error on your part, but a structural feature of the update rule you are using.

  The framework you are describing is **Jeffrey Conditionalization** (also known as **Probability Kinematics**). Unlike standard Bayesian conditionalization, where you update on a proposition becoming certain ($P(E) = 1$), Jeffrey conditioning allows you to update on a proposition becoming *more probable* without reaching certainty (e.g., shifting $P(E)$ from $0.5$ to $0.7$).

  Here is the carving you asked for, separating the two phenomena, identifying their boundaries, and assessing whether they are defects or features.

  ### 1. The Order Sensitivity: Non-Commutativity of Jeffrey Conditionalization

  **The Name:**
  In the literature, this is formally called the **Non-Commutativity of Sequential Jeffrey Conditionalization**.

  **The Carving:**
  In standard Bayesian conditioning, order never matters. If you learn $E_1$ (with certainty) and then $E_2$ (with certainty), $P(H | E_1, E_2)$ is identical to $P(H | E_2, E_1)$. This is because conditioning on certainty is a projection operation that collapses the possibility space; the intersection of sets is commutative ($A \cap B = B \cap A$).

  In Jeffrey conditioning, you are not collapsing the space; you are *redistributing* mass across a partition while trying to preserve conditional probabilities (a constraint called **Rigidity**). When you do this sequentially for two uncertain cues ($E_1$ then $E_2$), the redistribution performed by the first step changes the baseline for the second step. Because the second step preserves conditionals *relative to the new baseline*, the path matters.

  **Is Independence the Boundary?**
  You hypothesized that independence is the boundary. It is a **sufficient** condition, but not a **necessary** one.
  *   **Sufficient:** If the two cues are conditionally independent given your hypothesis (and the update satisfies certain separability constraints), the order will typically drop out.
  *   **Necessary:** The exact boundary is defined by the **Jeffrey-Field Condition** (named after Hartry Field). Commutativity holds if and only if the **Bayes Factors** (the ratio by which the odds are multiplied) for each cue are invariant regardless of the order in which they are processed.
  *   **Your Fog Case:** In your sailing example, the fog creates a common cause for the degradation of both cues. This induces a correlation. Because the cues are correlated, the Bayes factor for the sound depends on the visual state, and vice versa. When you update the visual first, you change the context for the sound, altering its effective weight. This is why the gap widens with correlation.

  **Defect or Feature?**
  Most formal epistemologists regard this as a **defect of the sequential model**, not a feature of reality. It indicates that Sequential Jeffrey Conditionalization is the wrong tool for *simultaneous* uncertain evidence. The math assumes the first update is "settled" before the second arrives. When they arrive together (or effectively so), forcing a sequence introduces an artificial artifact. The "correct" move, theoretically, is **Holistic Jeffrey Conditionalization**, where you construct the posterior distribution directly based on the joint impact of both cues, bypassing the sequential step entirely.

  ### 2. The Repetition Problem: The Input Problem (or Rigidity)

  **The Name:**
  This is known as **The Input Problem** for Jeffrey Conditionalization, sometimes discussed under the heading of **Rigidity** or **Conservation of Conditional Probability**.

  **The Carving:**
  You noted that feeding the same input twice yields no change. This is because Jeffrey Conditionalization is defined by the constraint:
  $$P_{new}(H | E) = P_{old}(H | E)$$
  It tells you how to shift your belief in $H$ *given* a shift in belief in $E$. It does not tell you how to derive the new belief in $E$ from the sensory experience itself.
  *   **First Glance:** You experience a sensation $S_1$. You translate this to $P_{new}(E) = 0.7$. You update.
  *   **Second Glance:** You experience sensation $S_2$. If you treat $S_2$ as identical to $S_1$, you again set $P(E) = 0.7$. Since your probability is already $0.7$, the update equation results in zero change.

  **Why Intuition Fights the Math:**
  Intuitively, two glances should increase confidence because the second glance is *new evidence* that the first glance was reliable. But Jeffrey Conditioning has no memory of *how* you got the probability $0.7$. It treats $P(E)=0.7$ as a static constraint. It cannot distinguish between "I saw it once and I'm 70% sure" and "I saw it twice and I'm 70% sure."

  **Defect or Feature?**
  This is widely considered a **defect** (or at least a significant limitation) of the framework. It means Jeffrey Conditioning is not a complete theory of learning; it is a theory of *constraint propagation*. It requires an external "oracle" to tell it what the new probability of the evidence should be. It cannot model the *weight* of evidence, only the *direction*.

  ### 3. Are They One Phenomenon or Two?

  They are **two symptoms of the same underlying limitation**: Jeffrey Conditionalization separates the *evidence* (the input probability) from the *impact* (the update rule).

  1.  **Order Sensitivity** arises because the update rule assumes the input probabilities are fixed constraints that arrive sequentially. When they are correlated, the "fixed constraint" of the first distorts the impact of the second.
  2.  **Repetition Failure** arises because the update rule has no mechanism to adjust the input probability based on the *history* of updates.

  Both stem from the fact that Jeffrey Conditioning is **not a model of evidence accumulation**; it is a model of **probability redistribution**.

  ### 4. How This Differs from Other Concepts

  **Vs. Ordinary Conditioning (Crisp Evidence):**
  *   **Crisp:** You condition on $E$ being true. The operation is $P(\cdot | E)$. This is a projection onto the subspace where $E$ is true. Projections onto intersecting subspaces commute.
  *   **Fuzzy (Jeffrey):** You condition on a *distribution* over $E$. This is a linear transformation of the probability vector. Linear transformations do not generally commute unless they share eigenvectors (which corresponds to the independence/Field condition).

  **Vs. Psychological Order Effects:**
  *   **Psychological:** These are biases (e.g., recency effect, primacy effect) where human cognition *fails* to follow the normative arithmetic.
  *   **Your Case:** This is **Arithmetic Non-Commutativity**. Even a perfect rational agent using Jeffrey Conditioning *must* get different results depending on the order. It is a property of the logic, not the mind.

  ### 5. Summary and Recommendations for the Sailor

  To answer your specific questions directly:

  *   **Established Name:** **Non-Commutativity of Jeffrey Conditionalization** (Order) and **The Input Problem** (Repetition).
  *   **One or Two:** Two symptoms of the incompleteness of Probability Kinematics regarding evidence weight and simultaneity.
  *   **Boundary:** Independence is sufficient, but the exact boundary is the invariance of Bayes Factors (Field Condition).
  *   **Defect or Feature:** Defect of the *sequential application* to simultaneous problems.
  *   **What to call it if you're naming it:** If you were writing this up, you might call it **"Kinematic Path-Dependence."**

  **Practical Resolution (for the sailing and the math):**
  Since you cannot easily switch to Holistic Updating in the moment (it requires calculating joint posteriors which is hard in the dark), epistemologists suggest two workarounds:

  1.  **For Order:** If the cues are highly correlated (the fog case), do not update sequentially. Estimate the combined reliability of the *situation* (e.g., "In this fog, my senses are 60% reliable") and update once based on the aggregate impression.
  2.  **For Repetition:** You must treat the second glance as a *different proposition*. Let $E_1$ be "Light looks steady at $t_1$" and $E_2$ be "Light looks steady at $t_2$". Even if they feel the same, formally they are distinct events. You then need a likelihood $P(E_2 | E_1, H)$. If the light is a buoy, $E_2$ is highly likely given $E_1$. If it's a trawler, $E_2$ might be less likely given $E_1$ (boats move/rock). This restores the learning value of the second glance.

  **References for your reading:**
  *   **Diaconis & Zabell (1982):** "Updating Subjective Probability" (The definitive technical treatment of commutativity).
  *   **Field (1978):** "A Note on Jeffrey Conditionalization" (Derives the condition for order independence).
  *   **Weisberg (2009):** "Locating IBE in the Bayesian Framework" (Discusses the Input Problem extensively).

  You are not going in circles; you have hit the wall that stops many graduate seminars in epistemology. The math is working as designed, but the design is insufficient for the task you are asking it to perform.
