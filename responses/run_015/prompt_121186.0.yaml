      *   *The Eight Kinds:*
          1.  Religious doctrine (teaching false religion).
          2.  Lying that profits no one and harms someone.
          3.  Lying that profits one and harms another.
          4.  Lying for the pleasure of lying.
          5.  Lying to please others (flattery).
          6.  Lying to profit someone without harming another (e.g., saving money).
          7.  Lying to save someone from physical defilement (but not death).
          8.  Lying to save someone from death/sexual violation.
      *   *The Core Principle:* A lie is *always* a sin because it violates the order of truth and corrupts the soul (the "double heart").
      *   *The Grading:* The gravity of the sin varies. Why? It's a mix of *intent* (charity vs. malice) and *consequence* (harm to God, harm to neighbor, harm to self).
      *   *Absolutism vs. Excusability:* Augustine distinguishes between the *objective sinfulness* (it's always wrong) and the *subjective culpability/punishment* (some are venial, some mortal; some are understandable human weakness). He uses the term "officious lie" (lie for utility) but still condemns it, though less severely.

