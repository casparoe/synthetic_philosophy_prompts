answer: |-
  Good morning. It is a profound privilege to stand here, not merely to celebrate a career, but to mark the retirement of a colleague who has spent thirty years making us uncomfortable in the best possible way.

  Looking around this room, I see a familiar geography. On my left, I see clinicians—psychiatrists, psychologists, nurse practitioners—who carry the weight of daily decision-making. You are the ones who have to write the prescription, justify the insurance code, and look a patient in the eye when you say, "This is medically necessary," or, "I cannot prescribe this for that purpose." On my right, I see philosophers and ethicists, who carry the weight of conceptual clarity. You are the ones who point out when our language is smuggling in assumptions we haven't examined.

  For decades, these two groups have often talked past one another regarding the therapy-enhancement distinction. The clinicians have tended to treat it as a lifeline—a practical boundary that keeps the floodgates of demand from swallowing the scarce resources of care. The philosophers have tended to treat it as a mirage—a normative confusion that vanishes under scrutiny.

  Our honoree, Dr. Elena Vance, spent her career standing right in the middle of that divide. She did not try to build a bridge so we could ignore the gap. She widened the gap, so we could see what was underneath.

  Today, I want to focus on one specific conceptual move that defined her work. It is an argument that appears in her early papers on psychostimulants and echoes through her later work on neuroethics. It is her critique of "species-typical functioning."

  The standard defense of the therapy-enhancement distinction relies on a specific definition of therapy. Therapy, we are told, is the restoration of function to a species-typical baseline. Enhancement is everything that pushes performance beyond that baseline. If you have a broken leg, setting the bone restores you to the typical human ability to walk. That is therapy. If you take a drug to run faster than an Olympic sprinter, that is enhancement.

  This sounds clean. It sounds biological. It sounds like it belongs in the realm of facts, not values.

  Dr. Vance's great intervention was to show us that in psychiatry, "species-typical functioning" is not a biological given. It is a statistical baseline that smuggles value judgments into medical description.

  Consider the diagnosis of Attention Deficit Hyperactivity Disorder. We often speak of treating ADHD as restoring a patient's ability to focus to "normal" levels. But what is the biological baseline for human attention? Is it twenty minutes? Forty? Is it the ability to sustain focus on a spreadsheet, or the ability to scan a horizon for predators?

  When we define therapy as "restoration to the norm," we are implicitly arguing that the statistical average of our current population represents the correct biological design specification for the human mind. But statistics are not biology. If the average height of a population drops due to malnutrition, the statistical norm changes, but the biological standard of health has not been met. Conversely, in psychiatry, if the average attention span of a population is calibrated to the demands of a digital economy, treating a patient to match that average is not merely fixing a broken part. It is aligning a mind with a specific social expectation.

  Dr. Vance argued that when we draw the line between therapy and enhancement, we are not discovering a boundary in nature. We are drawing a boundary around a specific vision of how minds *ought* to work. We are deciding that a mind that works well enough to hold a job in a capitalist economy is "healthy," and a mind that works differently is "disordered."

  This is why the distinction collapses. It does not collapse because all treatment is secretly enhancement. It collapses because "therapy" already presupposes a contested normative standard. To call something therapy is to make a claim about what a good human life looks like.

  Now, I can feel the shift in the room. I see the clinicians leaning forward. I hear the unspoken question, which is practical and urgent.

  "If the boundary dissolves," you are asking, "on what basis do we allocate scarce resources?"

  This is not a trivial worry. It is the bedrock of your practice. If we admit that prescribing a cognitive stimulant to a student with sub-clinical focus issues is not categorically different from prescribing it to a patient with severe ADHD, does that mean we must treat them both? Does it mean insurance must cover "enhancement"? If we lose the distinction, do we lose the ability to say "no"?

  Dr. Vance never asked you to stop saying "no." She asked you to change the reason *why*.

  Her argument was not that we should provide every possible intervention to every person. Her argument was that we should stop hiding behind the idea that biology makes that decision for us. When resources are scarce, we must allocate them based on justice, not just medical necessity.

  If the line between therapy and enhancement is porous, then the question shifts from "Is this treatment medically necessary?" to "Is this allocation fair?"

  Perhaps we prioritize the student with severe ADHD not because their treatment is "biological restoration" while the other student's is "enhancement," but because the student with ADHD faces a structural barrier to opportunity that the other does not. Perhaps we limit access to cognitive stimulants not because they are "unnatural," but because widespread use might create coercive environments where no one can compete without them.

  This is a heavier burden for the clinician. It requires you to be not just a technician of the mind, but a guardian of social equity. It admits that when you write a prescription, you are participating in a conversation about what kind of cognitive capacities we value as a society.

  Dr. Vance understood that this makes your job harder. She often said that ethical clarity is not a comfort; it is a demand. By dismantling the therapy-enhancement distinction, she did not remove the gates; she just showed us that we are the ones holding the keys, not nature. She invited the clinicians in this room to own that power, rather than outsourcing it to a dubious biological definition.

  And to the philosophers in the room: she challenged you as well. She warned against declaring the distinction bankrupt and then walking away. To say the distinction is normatively flawed is the beginning of the work, not the end. If we cannot rely on "species-typical functioning" to guide policy, we must do the hard work of constructing a normative framework that is explicit about its values. We must argue for justice, for opportunity, for relief of suffering, without pretending these are purely medical categories.

  In honoring her legacy, we must accept that the comfort of the binary is gone. We cannot retreat to the idea that medicine fixes what is broken and leaves the rest alone. In psychiatry, fixing what is broken *is* deciding what should be whole.

  I want to close with an image that Dr. Vance used often in her later lectures, though she always warned us not to lean on it too heavily.

  Imagine a bridge. The bridge was built to carry a specific load—say, ten tons. Over time, cracks appear. To repair the bridge is to restore its capacity to hold ten tons. That is therapy. To reinforce the bridge so it can hold twenty tons is enhancement.

  In this image, the distinction seems clear. We know the original specification. We know the design load. We can measure the structural integrity against a blueprint that exists independently of our desires.

  This is how many of us wish to view the human mind. We wish to believe there is a blueprint. We wish to believe that "ten tons" is written in our DNA, and our job is simply to patch the cracks until we match the design.

  But here is where the image fails, and where Dr. Vance's insight cuts deepest. In psychiatry, we do not have the blueprint. We do not know the original load specification.

  When we treat a mind, we are not repairing a bridge to its original design. We are rebuilding a bridge while traffic is still crossing it, without the original plans, in a city that keeps changing its zoning laws.

  Is the goal of the mind to endure suffering? To produce economic value? To experience joy? To conform to social norms? There is no "species-typical" answer to these questions, only competing human answers.

  If we treat a patient to help them tolerate a high-stress job, are we restoring their function, or are we reinforcing the bridge to support a traffic load that perhaps no bridge should bear? If we treat a patient to help them leave a high-stress job, are we restoring their function, or enhancing their capacity for autonomy?

  The bridge analogy fails because bridges do not argue about what they are for. Minds do.

  Dr. Vance spent her career reminding us that because minds argue about what they are for, our medicine must be humble enough to admit it is part of that argument. She taught us that we cannot solve ethical problems with biological definitions.

  To the clinicians: Thank you for the care you provide, and for accepting the burden of the ambiguity she left you.
  To the philosophers: Thank you for the rigor you bring, and for remembering that these concepts have pulse and breath.

  And to Dr. Vance: Thank you for showing us that the most ethical thing we can do is to stop pretending our values are facts. You have earned your rest. But for those of us remaining on the bridge, you have left us with better maps, even if the destination is still ours to decide.

  Thank you.
