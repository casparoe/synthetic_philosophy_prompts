          *   Crucially: There is no "counterfactual comparison" built into the utility function itself. The utility of a history $H$ is the sum (or integral) of utilities of experienced moments. $\int_{birth}^{death} u(t) dt$.
          *   Badness: Death isn't "bad" in itself; it's just the end of positive utility accumulation. It's not a negative term; it's a zero term.
