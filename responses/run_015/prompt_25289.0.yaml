      *   *Deprivation Account (Nagel):*
          *   Standard view: Death is bad because it prevents goods you *would have* had.
          *   DT Translation: Utility is defined over *possible life histories* or *worlds*, not just experienced slices. It involves counterfactual comparison.
          *   Let $H_{actual}$ be the actual life history. Let $H_{counterfactual}$ be the life history if death hadn't occurred at $t$.
