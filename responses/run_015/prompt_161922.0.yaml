answer: |-
  This is a classic problem in non-ideal theory: you are looking for a normative framework to regulate decentralized social enforcement. Your intuition about "withdrawal vs. enlistment" is a version of the distinction between *negative liberty* (I won't associate with you) and *coercive enforcement* (I will make sure no one associates with you). But as you noted, that distinction collapses when a gatekeeper (like a publisher) exercises negative liberty in a way that functions as coercive enforcement within a specific practice.

  Here is a candidate principle designed to capture your verdicts, followed by an analysis of its costs and predictions.

  ### The Principle of Constitutive Accountability

  **Extra-legal social sanction is warranted if and only if three conditions are met:**

  1.  **The Agency Condition:** The sanctioning party must be a direct participant in the specific practice or relationship affected (e.g., employer, peer, venue), rather than an external third party instrumentalized to inflict cost.
  2.  **The Functional Condition:** The sanction must protect the *constitutive norms* or *internal goods* of that practice, rather than enforcing external moral purity unrelated to the practice's function.
  3.  **The Repair Condition:** The sanction must allow for the possibility of moral repair and reintegration, unless the wrongdoing fundamentally destroys the agent's capacity to fulfill the practice's norms.

  ---

  ### How This Maps to Your Verdicts

  This principle shifts the focus from *who* is punishing (the publisher vs. the mob) to *why* and *within what structure* the punishment occurs.

  *   **Tenured Prof/Book Contract (Not OK):**
      *   *Analysis:* Fails the **Functional Condition**. The practice is philosophical inquiry/pedagogy. Reading a slur in a 19th-century text with warning is consistent with the internal goods of philosophy (historical accuracy, critical engagement). Dropping the book enforces external moral purity at the expense of the practice's function.
      *   *Resolution:* This solves your worry about your initial rule. The publisher is a direct participant (passes Agency), but their withdrawal undermines the practice they are supposed to sustain.

  *   **PR Person/Murder/Fired (OK):**
      *   *Analysis:* Passes all three. Employer is direct participant (Agency). Viciousness undermines the function of PR (trust/reputation) (Function). Refusal to apologize negates Repair.

  *   **15-Year-Old/DMs/Scholarship (Not OK):**
      *   *Analysis:* Fails the **Repair Condition**. Adolescents lack full moral capacity; development *is* the function of education. Punishing past private growth without opportunity for reintegration violates the practice of education.

  *   **Photographer/Peers/Boycott (Fine) vs. Strangers/Emails (Not OK):**
      *   *Analysis:* Peers pass **Agency** (direct participants in the referral network). Strangers fail **Agency** (they are instrumentalizing the clients).
      *   *Cost:* This forces a slight adjustment on your "Peers" verdict. If the peers are coordinating to "tell each other why" based on moral grounds unrelated to photography skills (e.g., his politics), this might fail the **Functional Condition**. If the "why" is professional unreliability, it's fine. If the "why" is moral purity, the principle suggests this is *not* warranted, even if peers do it. You might have to accept that "quiet peer boycotts" are only warranted if they relate to professional conduct.

  *   **Old Blog/Apology (Not OK) vs. No Apology (OK):**
      *   *Analysis:* Pure **Repair Condition**. The apology signals reintegration into shared norms. Ignoring it makes the sanction punitive rather than protective.

  *   **Speaker Disinvitation (OK) vs. Journal Retraction (Not OK):**
      *   *Analysis:* Disinvitation passes **Function** (venues curate for safety/mission). Retraction fails **Function** (journals curate for truth/validity; retracting valid work harms the internal good of science).

  *   **Podcaster/Advertisers (Not OK):**
      *   *Analysis:* Fails **Agency**. Advertisers are third parties to the speech act; using them as a lever is instrumentalization.

  ### Addressing Your Structural Worries

  **1. "Nobody is in charge" (The Aggregation Problem)**
  Your worry is that without a central authority, severity is arbitrary. The **Agency Condition** addresses this by decentralizing authority *but* restricting it to stakeholders. It legitimizes the "peers" case while delegitimizing the "strangers emailing clients" case. It predicts that severity becomes illegitimate when the coalition includes people who have no stake in the practice. It doesn't solve the "pile-on" entirely, but it gives you a vocabulary to say, "You are not a participant in this practice, so your volume does not count as normative sanction."

  **2. Partisanship (Ignoring identical acts by "our side")**
  The **Functional Condition** is the tool here. If a partisan coalition sanctions an opponent for X but ignores X when done by an ally, they are not protecting the *practice's* norms; they are weaponizing the practice for tribal gain. The principle doesn't stop them, but it renders their actions *normatively unwarranted*. It gives you a criterion to critique the bias: "You are claiming to protect the integrity of the journal, but your selective enforcement proves you are protecting a tribe."

  **3. "It's just consequences" (Descriptive vs. Normative)**
  This principle clarifies the distinction.
  *   **Descriptive:** "If you say X, people might not hire you." (Market consequence).
  *   **Normative:** "If you say X, we *ought* to ensure you aren't hired." (Social sanction).
  The principle validates the first (as market preference) but restricts the second. It tells you that "consequences" become "punishment" when they shift from individual choice to coordinated enforcement that violates the three conditions.

  ---

  ### Predictions for Your New Cases

  **(a) Department stripping a donor's name off a building for legal, publicly known past acts.**
  *   **Verdict:** **Conditional OK / Likely Not OK.**
  *   **Application:**
      *   *Agency:* Passes (Department controls the building).
      *   *Repair:* Fails (Donor is likely dead or unable to repair; acts were past).
      *   *Function:* This is the crux. Does the name on the building serve the *internal good* of the university (truth, mission, values)? If the donor's acts (e.g., segregationist philanthropy) actively contradict the university's *current constitutive values*, removing the name upholds the Functional Condition. If the acts were merely "legal but icky" and widely known at the time of naming, removing the name might be seen as rewriting history (violating the internal good of institutional memory).
      *   *Prediction:* The principle predicts this is warranted *only if* the donor's legacy actively impedes the institution's current function (e.g., makes students feel unsafe/unwelcome in a way that hinders learning). If it's just moral signaling, it fails the Functional Condition.

  **(b) Wealthy self-publisher; only traction is event boycotts.**
  *   **Verdict:** **OK.**
  *   **Application:**
      *   *Agency:* Passes (Event organizers are direct participants in the "event" practice).
      *   *Function:* Passes (Organizers curate content for their community standards).
      *   *Repair:* Depends on her response. If she is "independently wealthy," economic sanction is impossible. The *only* available lever is association.
      *   *Prediction:* Since there are no third parties to instrumentalize (she self-publishes, no advertisers to pressure), a coordinated refusal by venue hosts to book her is the *only* form of sanction that satisfies the Agency Condition. It is essentially the "Peers Boycott" case scaled up. The principle validates this as the *limit* of warranted sanction. If they then try to pressure the *printing company* to not print her books, that would fail the Agency Condition (printing is a neutral service, not a curatorial practice).

  ### The Cost: What You Might Have to Drop

  To adopt this principle, you may need to refine your verdict on the **Photographer/Peers** case.
  *   **Your Verdict:** "Fine, or at least none of my business."
  *   **Principle's Verdict:** Only fine if the peers are sanctioning based on *professional* norms (e.g., he steals ideas, is abusive to assistants). If they are sanctioning him for private moral failings unrelated to photography, the principle suggests this is *not* warranted because it fails the **Functional Condition**.
  *   **Why drop it?** Because if we allow peers to sanction for *any* moral reason, the "Functional Condition" collapses into general moral policing, which risks the same problems as the "Strangers Emailing" case, just with a smaller mob. The principle demands that professional communities police *professional* integrity, not general virtue.

  ### Summary
  The **Principle of Constitutive Accountability** captures your intuition that context, role, and capacity for growth matter more than the raw "harm" inflicted. It solves the Publisher/Prof paradox by noting that publishers have a duty to the *practice of publishing*, not just their own risk management. It handles the "nobody in charge" worry by restricting legitimate sanctioners to direct stakeholders. It forces you to be stricter on "peer boycotts" (they must be practice-relevant), but it gives you a robust defense against the "strangers emailing clients" and "journal retraction" cases.
