answer: |-
  **Project Title:** The Reframing Condition: A Deweyan Diagnostic for Technocratic Deliberation

  **Research Question**
  Contemporary institutions claim the mantle of democratic inquiry while functioning as aggregative mechanisms. My project asks: **Do the structural requirements of Deweyan inquiry supply immanent stopping rules for institutional regress and proxies for the absent public, or must they import external normative constraints?** Specifically, I seek to derive a set of necessary and sufficient institutional conditions under which a mechanism satisfies the *reframing condition*—the capacity to revise ends-in-view rather than optimize means toward fixed inputs. This question admits a determinate answer: either the logic of inquiry generates its own boundary conditions for design and representation, or it fails to govern the very institutions it mandates, requiring supplementation by rights-based or consequentialist norms.

  **Intervention in Existing Literature**
  Current scholarship leaves this question open from two sides. First, standard Deweyan political theory (e.g., Gouinlock, Hickman) focuses on democracy as a mode of "associated living" or the metaphysical grounds of experience. It treats democracy as an ethical ideal but lacks an institutional mechanics capable of distinguishing a citizens' assembly from a plebiscite in design terms. It explains why inquiry is valuable but not how to engineer it.

  Second, mainstream deliberative democracy (e.g., Dryzek, Mansbridge) acknowledges preference transformation but grounds it in validity claims and ideal speech situations. This framework treats the *discursive* conditions as primary, often decoupling them from the *experimental* test by consequences. Consequently, it cannot distinguish between a deliberation that changes minds through argumentation and one that changes problems through the observation of consequences. Neither literature provides a diagnostic for the specific failure modes of technocratic participation: where reframing is structurally blocked by expert agenda-setting, or where reframing is permitted but decoupled from decision authority.

  **Methodology and Timeline (Nine Months)**
  I will treat Dewey's *Logic of Inquiry* not as a metaphor but as a functional specification for institutional design. The method is a conceptual audit of existing mechanisms against the reframing condition.

  *   **Months 1–2: Conceptual Sharpening.** I will formalize the "reframing condition" into distinct institutional variables: (1) Agenda Control (who defines the indeterminate situation?), (2) Hypothesis Generation (who formulates solutions?), and (3) Consequence Integration (does the decision mechanism accept revised ends?). I will define the two failure modes: *Expert Capture* (fixed agenda) and *Decoupled Deliberation* (revised ends ignored).
  *   **Months 3–5: Case Audits.** I will apply these variables to two test instances.
      1.  *The French Citizens' Convention on Climate:* High claim to inquiry. I will analyze whether the mandate allowed the redefinition of "climate action" (e.g., from carbon tax to consumption limits) or merely optimized within a pre-set legislative frame.
      2.  *NIST AI Risk Management Framework Public Comment:* High technical mediation. I will analyze whether the comment period allowed for the redefinition of "risk" or merely solicited inputs on a fixed taxonomy.
      *   *Deliverable:* A comparative matrix mapping where each mechanism fails the reframing condition.
  *   **Months 6–7: The Hard Problems.** I will test the limits of the Deweyan resource.
      1.  *The Regress:* If inquiry governs institution design, what governs the design of the design-body? I will investigate whether Dewey's distinction between *valued* and *valuable* provides an internal stopping rule (i.e., the process stops when further inquiry yields no new consequences) or if it requires an external constitutional constraint.
      2.  *The Absent Public:* For AI and germline editing, the affected public is future/unidentified. I will determine if Dewey's "recognition of consequences" can generate a proxy (e.g., modeled impact agents) from within the logic of inquiry, or if this constitutes a structural blind spot requiring representation theory imports.
  *   **Months 8–9: Synthesis and Diagnostic.** I will draft the final "Inquiry-Ready Diagnostic"—a usable tool for designers—and write the dissertation chapters.

  **Conditions for Success and Failure**
  *   **Success:** The project produces a *usable diagnostic*. A designer should be able to apply the criteria to a proposed mechanism and determine *ex ante* whether it permits reframing. Success also means resolving the "Hard Problems" negatively or positively: demonstrating either that Dewey's logic contains its own stopping rules/proxies, or precisely where it requires external normative supplementation.
  *   **Failure:** The project fails if the diagnostic collapses into *consequentialism* (judging the mechanism by its output rather than its structure) or *proceduralism* (judging it by inclusivity rather than inquiry logic). It also fails if the "Hard Problems" force an appeal to natural rights or transcendental norms that contradict Dewey's immanent naturalism, rendering the framework incoherent.

  **Comparative Advantage**
  This approach is superior to **empirical evaluation** because outcome-based assessment is *ex post* and often takes decades (e.g., climate policy), whereas institutional designers need *ex ante* structural criteria. We cannot wait for consequences to judge if the mechanism was capable of learning.

  It is superior to **discourse ethics** because discourse ethics focuses on the validity of speech acts and the idealization of the communicative situation. It is often blind to the *material* constraints of technical systems (e.g., an algorithm that hard-codes the option space). A Deweyan approach targets the *logic of the situation* itself, asking whether the system architecture allows the problem to change, regardless of the quality of the speech within it. This makes the project legible to computer scientists concerned with system constraints, not just political theorists concerned with legitimacy.

  **Scope and Feasibility**
  To ensure completion within nine months and satisfy committee concerns, I am making three specific cuts:

  1.  **No Metaphysics of Experience:** I will not revisit the metaphysical grounds of *Experience and Nature*. I will take the *Logic of Inquiry* as a functional given. This addresses the Computer Scientist's concern that this is "speculative philosophy" by treating Dewey's logic as an engineering constraint.
  2.  **No Full Theory of the Public:** I will not attempt to solve the representation of the future public generally. I will restrict the analysis to whether the *mechanism itself* can generate a functional proxy for consequences. If it cannot, the finding is a limit condition, not a call for a new theory of representation. This addresses the Political Theorist's concern about "normative hand-waving" by defining the boundary of the theory's applicability.
  3.  **Fixed Case Studies:** I will not survey the field of participatory mechanisms. I will restrict the empirical audit to the two named cases (French Convention, NIST Comment). This ensures the timeline is realistic.

  The result will not be a defense of Dewey, but a stress test of his logic against the hardest cases of modern governance. If the logic holds, we have a design tool. If it breaks, we know exactly where the import is needed.
