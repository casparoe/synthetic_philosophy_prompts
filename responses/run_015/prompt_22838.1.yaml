answer: |-
  You have stumbled, quite elegantly, onto one of the most famous results in game theory and epistemology. The "vague memory" you have is almost certainly **Aumann's Agreement Theorem**, proposed by the Nobel laureate Robert Aumann in 1976.

  The short answer to your question is: **Yes, it is entirely possible for two careful people to end up stuck like this.** In fact, according to the strict logic of Aumann's theorem, the fact that you stalled implies that one of the necessary conditions for "perfect rationality" was violated.

  Given your background in ecology and Dave's in statistics, you'll appreciate that the theorem relies on specific model assumptions. When those assumptions break down in the messy real world (or a pub), the "agreement" breaks down too.

  Here is what likely went "wrong" in the epistemological sense, and why your stalemate makes perfect sense.

  ### 1. The Theorem: "Agreeing to Disagree"
  Aumann's Agreement Theorem states roughly this: If two agents are **rational Bayesians**, share **common priors**, and have **common knowledge** of each other's posterior beliefs (probabilities), they cannot agree to disagree. If you know what I think, and I know what you think, and we both know we are rational, our probabilities must converge to the exact same number.

  Since you and Dave ended at 0.64 and 0.61, you "agreed to disagree." Therefore, logically, at least one of the theorem's conditions was not met.

  ### 2. Violation One: The Common Prior Assumption
  You hit the nail on the head with your guess about priors. Aumann's theorem requires that before you saw the coin, you and Dave had the same baseline belief about the state of the world (e.g., the base rate of fake coins in circulation).

  *   **Your Prior:** As an ecologist, you might implicitly treat the coin like a specimen. Most specimens in a garden context are likely what they appear to be unless proven otherwise.
  *   **Dave's Prior:** As a statistician, he might be hyper-aware of base rates in the antique market. If 90% of "found" coins are fakes, his starting probability is massively lower than yours.

  In strict Bayesian theory, if we have different priors, we can process the exact same evidence and end up with different posteriors. Aumann's theorem *requires* common priors to force convergence. Since you admitted you had "different hunches," the theorem no longer applies, and your stalemate is mathematically valid.

  ### 3. Violation Two: Common Knowledge of *Information*, Not Just Numbers
  This is the subtler point. Aumann's theorem requires that we have common knowledge of each other's **information partitions**.

  In the pub, you told Dave your number (0.7), and he told you his (0.55). But a number is a compressed summary of evidence.
  *   You knew the **weight**.
  *   Dave knew the **wear patterns**.

  When Dave moved from 0.55 to 0.6, he wasn't updating on your *evidence* (the weight); he was updating on your *confidence*. He was essentially saying, "I don't see the weight data, but I trust the Ecologist's judgment enough to nudge my number."

  True Aumannian agreement requires that you effectively pool all the raw data. If you had said, "The weight is 12.5g, which matches the 1890 spec," and Dave had said, "The wear on the serif is inconsistent with circulation," you would have pooled the evidence. Instead, you were pooling *opinions*. Updating on someone else's opinion is much "noisier" than updating on their data, which leads to the asymptotic stalling you experienced.

  ### 4. Violation Three: Bounded Rationality
  Aumann's agents are idealized. They have infinite computing power and perfect honesty. You and Dave are humans in a pub.

  The "nudging" process you described sounds less like Bayesian updating and more like **weighted averaging**.
  *   Round 1: You trust your evidence 70%, Dave's opinion 30%.
  *   Round 2: Dave trusts his evidence 60%, your opinion 40%.

  If you both implicitly assign a slightly higher weight to your own private evidence than to the other person's opinion (which is rational! You held the coin; you did the weighing), you will approach each other asymptotically but never touch. You are essentially calculating:
  $$New\_Belief = (Weight_{self} \times Own\_Evidence) + (Weight_{other} \times Other\_Opinion)$$

  If $Weight_{self} > Weight_{other}$ for both parties, you get a stalemate. This isn't a failure of rationality; it's a feature of **bounded rationality**. You recognized that Dave doesn't have your tactile data, so you shouldn't fully defer to him, and vice versa.

  ### The Epistemological Takeaway
  For a retired ecologist turning to philosophy, this is a rich scenario. It highlights the difference between **idealized epistemology** (how perfect minds *should* work) and **social epistemology** (how actual humans *do* work).

  The stalling tells us that you and Dave were being honest about your **epistemic trust**. You respected Dave enough to move from 0.7 to 0.64, but you respected your own evidence enough not to go all the way to 0.61.

  If you want to break the stalemate, you have to stop trading probabilities and start trading **likelihood ratios**. Instead of saying "I think it's 64%," you say, "The weight makes it 3 times more likely to be real." Dave says, "The wear makes it 1.5 times more likely to be fake." Multiply those ratios against your shared prior, and you'll get a single, converged number.

  But where's the fun in that? The stalemate is arguably more valuable. It preserves the uncertainty that keeps the inquiry alive. If you'd converged perfectly at 0.625, you might have sold the coin or thrown it away. Stuck at 0.64 vs 0.61, the coin remains a puzzle, and you have a reason to keep talking about it. In that sense, the disagreement was more useful than the agreement.
