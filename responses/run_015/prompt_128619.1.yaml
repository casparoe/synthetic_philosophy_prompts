      *   *Against Hayek:* Hayek argued the problem isn't computation but knowledge. Prices convey dispersed, tacit knowledge that cannot be centralized. Lange acknowledged the information problem but believed statistical aggregation and rules could suffice for macro-allocation, leaving micro-decisions to managers.
      *   *The "Trial and Error" Method:* The CPB sets prices, observes surpluses/shortages, adjusts prices. Iterative process converging on equilibrium.
      *   *Role of Managers:* Rule-following (minimize cost, equalize marginal cost to price).
      *   *Role of Consumers:* Sovereign (demand determines production).

  3.  **Analyze the 2025 Scenario:**
