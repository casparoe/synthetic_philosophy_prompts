          *   *Refinement:* Lange believed in market socialism, not cybernetic communism. He wanted managers to act *as if* they were owners. If the AI does the managing, the "as if" is literalized. He might find this acceptable *if* the ends are social welfare.

      *   **Synthesis/Conclusion:**
