      *   **Point 2: The Epistemic Objection (Hayek):**
          *   *Original View:* Hayek said knowledge is local, tacit, and fleeting. Prices summarize this. Centralizers can't get it.
          *   *2025 View:* ML agents ingest massive local data streams. "Compressed model updates" act like price signals but richer.
          *   *Lange's Verdict:* This is the trickiest part. Lange valued consumer sovereignty and worker initiative. If ML agents optimize for a loss function defined by humans, it might work. But if the "knowledge" is purely quantitative data, does it capture *tacit* human preference or local context?
          *   *Nuance:* Lange might argue that if the ML agents are distributed (not one central brain), they mimic the dispersed nature of the market. However, he would worry about the *objective function*. Who defines what is being optimized? If it's not genuine consumer utility, it fails. He might see it as bridging the gap, but only if the "loss function" respects consumer sovereignty. He might critique the lack of *entrepreneurial discovery* if the AI just optimizes within known parameters rather than discovering new wants.

      *   **Point 3: Property Rights and Incentives (Mises):**
          *   *Original View:* Mises said without private property, there's no incentive to be efficient or innovate. Lange said public ownership + rules for managers + labor markets solves this.
