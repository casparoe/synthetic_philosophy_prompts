answer: |-
  **Project Title:** The Complexity of Obligation: Normative Intractability and the Limits of Ethical Theory

  **Project Summary**
  Contemporary philosophy of computation and ethics largely focuses on *bounded rationality*: the idea that human agents lack the cognitive resources to compute the optimal action prescribed by a normative theory. This project proposes a shift in focus from the agent to the theory itself. I investigate *normative intractability*: the possibility that a moral or political theory demands the computation of a function that is intractable (e.g., NP-hard) by definition, regardless of the agent's cognitive capacity. If a theory of justice requires solving a problem that cannot be specified in tractable time, does the theory lose its normative authority? Over three months, I will formalize two toy normative procedures, classify their computational complexity (specifically looking for fixed-parameter tractability), and argue whether approximation algorithms with bounded error can preserve normative force.

  **Research Question and Motivation**
  The central research question is: *Does the computational complexity class of a normative decision procedure undermine the theory's claim to action-guidance or authority?*

  Standard discussions in moral philosophy assume that if a theory is too difficult for humans to apply, the fault lies with human cognition. This project challenges that assumption. Some normative procedures—particularly in social choice and contractualist aggregation—require ranking feasible worlds or merging preference profiles in ways that scale exponentially with input size. If the "right answer" is computationally inaccessible not because humans are slow, but because the function itself is intractable, the theory may be formally self-defeating.

  Existing literature fails to settle this because it conflates psychological limits with formal complexity. Furthermore, it rarely considers *parameterized complexity*. A procedure might be intractable for a nation-state (large input) but fixed-parameter tractable for a small board (small parameter). This distinction is philosophically vital: it suggests a theory might be valid for small-scale interactions but fundamentally breakdown at scale, not due to corruption or ignorance, but due to computational structure.

  **Methodology and Work Plan**
  I will employ a formal-philosophic method, constructing simplified models of normative procedures and analyzing their computational properties. While I have training in logic, I will rely on established complexity classifications from social choice theory where possible, focusing my original labor on the philosophical interpretation of these results.

  *   **Month 1: Formalization of Normative Models**
      *   Select two candidate normative procedures prone to complexity issues.
          *   *Model A:* A simplified contractualist aggregation rule requiring the comparison of all feasible welfare distributions.
          *   *Model B:* A preference aggregation procedure (social choice function) sensitive to ranking orders.
      *   Define the input size (number of agents, number of options) and the output (the obligatory action).
      *   Draft a precise definition of "normative authority" in the context of computational feasibility (e.g., does 'ought implies can' extend to 'ought implies polynomial-time computable'?).

  *   **Month 2: Complexity Classification**
      *   Analyze Model A and Model B to determine their complexity class (P, NP-hard, etc.).
      *   Investigate *parameterized tractability*. Specifically, test if the problems become tractable if the number of agents is fixed as a parameter, even if the number of options grows.
      *   Identify if there is a "complexity threshold" where the theory transitions from action-guiding to formally opaque.
      *   *Deliverable:* A technical appendix mapping the normative procedures to their complexity classes.

  *   **Month 3: Normative Implications of Approximation**
      *   If the exact procedures are intractable, evaluate the use of approximation algorithms (polynomial-time procedures that yield "close enough" answers).
      *   Argue whether a bounded error rate preserves the *identity* of the normative theory. If a "justice algorithm" is 95% accurate due to complexity constraints, is it still justice, or merely a heuristic?
      *   Synthesize findings into a final paper arguing whether complexity classes act as validity conditions for normative theories.
      *   *Deliverable:* Final 15-page research paper.

  **Expected Outcomes and Feasibility**
  A successful outcome will demonstrate that computational complexity is a distinct constraint from bounded rationality, potentially invalidating high-demand normative theories for large populations while saving them for small groups via parameterized tractability. I aim to produce a draft paper suitable for submission to a journal in moral philosophy or philosophy of technology.

  **Risk Management and Scope**
  I am aware of the mathematical risks. As a philosophy student with basic logic training, I am not equipped to prove novel complexity theorems.
  *   *Mitigation:* I will not attempt to prove new complexity bounds. Instead, I will map existing normative models to known complexity results in social choice theory (e.g., winner determination in voting rules) and focus my original contribution on the *philosophical interpretation* of those bounds.
  *   *Failure Condition:* If the formalization proves too mathematically dense, I will pivot to a conceptual analysis of "approximation" in ethics, using the complexity results as a motivating thought experiment rather than a formal proof.
  *   *Scope:* The project is limited to two toy models. I will not attempt a general taxonomy of all ethical theories.

  **Conclusion**
  This project bridges a gap between computer science and normative ethics. By isolating the computational demands of the theory itself, rather than the agent, this research clarifies whether some moral obligations are impossible not because we are human, but because the universe of computation is restrictive. The grant will allow me to dedicate the summer to the necessary formalization and writing required to make this argument precise.
