      *(Self-Correction on Nagel)*: Nagel's absurdity is that we take life seriously *despite* knowing it doesn't matter from the outside. Phil's breakthrough is taking life seriously *because* it doesn't matter from the outside (no consequences). That's a subtle shift. I need to articulate that carefully.

