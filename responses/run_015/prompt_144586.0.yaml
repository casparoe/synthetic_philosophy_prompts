  btw I'm not looking for a reading list here — I want someone to tell me where my framing breaks.

  Question about Aquinas on tyrannicide. My reading group got stuck on it and I want to get it straight before writing it up. The case I actually care about is what I've started calling consent-proofing: a ruler who comes in through a legitimate procedure and then systematically dismantles the machinery by which the people could ever remove him — packing the courts, rewriting who gets to vote and how votes get counted, capturing whatever body certifies the result — so that the consent that originally made him ruler can no longer be withdrawn by any lawful means. Formally he still has title, so he looks like the ruler-turned-tyrant rather than the usurper, and for the ruler-turned-tyrant Aquinas (as I read him) says removal belongs to public authority and that private people should just endure it, or pray. But then every real case of the thing I actually worry about lands in the do-nothing box, which makes me think I'm misreading the framework somewhere: is the title/exercise cut really about how you came to power, or about whether you still rule for the common good — i.e. does consent-proofing convert a tyrant in exercise into a tyrant in title by destroying the relation that was supposed to ground his authority in the first place? And is it anachronistic of me to talk about a right to kill tyrants in Aquinas at all, when he seems to be asking a different sort of question — who has authority, and what serves the common good — rather than one about private permissions? Five numbered points, one or two sentences each, no preamble and no summing-up at the end.
