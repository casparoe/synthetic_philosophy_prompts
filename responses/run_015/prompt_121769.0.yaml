answer: |-
  You are not being picky; you have identified a structural limit in how language and logic handle "purpose." There isn't one single pop-philosophy name for it (like "The Mandela Effect"), but there are three precise philosophical carvings that, when combined, describe exactly the glitch you're seeing.

  ### 1. The Logical Error: Category Mistake
  The most precise label for the scaling failure is a **Category Mistake** (coined by Gilbert Ryle).
  *   **The Kidney:** A kidney is a *part* within a *system* (the body). Asking its purpose is valid because there is a larger framework (health/survival) against which to measure it.
  *   **Human Existence:** When you ask for the purpose of "everything," you are treating the **totality** (the system itself) as if it were a **component** (a part within a larger system).
  *   **The Glitch:** You are asking for the function of the container as if it were an object inside a bigger container. Since there is no "meta-universe" for our universe to serve, the question commits a type error. It treats "Existence" as a tool, when tools only exist *within* existence.

  ### 2. The Teleological Boundary: External vs. Internal Teleology
  The boundary where the questioning breaks is the shift from **Instrumental Value** to **Intrinsic Value**.
  *   **Local (Kidney):** This is *External Teleology*. The kidney serves something outside itself (the body). The "why" is answered by pointing outward.
  *   **Global (Existence):** This requires *Internal Teleology* (purpose found within the thing itself) or *Intrinsic Value*.
  *   **The Glitch:** The questioner refuses to accept Intrinsic Value. They keep demanding External Teleology ("Yes, but what is it *for*?"). They are demanding that the totality of existence be instrumental to something else. If you deny that a "something else" exists (like a God or a Multiverse goal), the question becomes logically malformed, like asking "What is the color of jealousy?"

  ### 3. The Regress Mechanism: The Münchhausen Trilemma
  The endless ladder you described ("Okay, but what's the point of *that*?") is a specific instance of the **Münchhausen Trilemma**. This states that any attempt to ultimately justify a truth (or purpose) must end in one of three ways:
  1.  **Circular Logic:** "We exist to live, we live to exist."
  2.  **Infinite Regress:** "To serve God, who serves...?" (The ladder you described).
  3.  **Dogmatic Stop:** "It just *is*." (Where the conversation usually dies).

  The "glitch" you notice is that people accept a **Dogmatic Stop** for the kidney ("It filters blood for health"—we stop at health), but they refuse the **Dogmatic Stop** for existence ("We exist to experience"—they reject experience as the final stop).

  ### The Precise Carving
  If you need a single phrase to describe this scaling failure, it is **The Fallacy of External Teleology for a Closed Totality**.

  It differs from ordinary infinite regress because ordinary regress can happen anywhere (e.g., "What caused this?"). This specific regress only triggers when you ask for the **function of the context itself**.

  *   **Valid Question:** "What is the function of X within System Y?"
  *   **Glitch Question:** "What is the function of System Y within [Null]?"

  The frustration arises because the questioner is linguistically demanding a **Supersystem** that they metaphysically deny exists. They want the comfort of a part (having a purpose) without the humility of a whole (being the purpose).

  ### Summary
  *   **Is it a named glitch?** Not as a single noun, but it is a recognized **Category Mistake** regarding **Teleology**.
  *   **The Boundary:** The line is drawn between **Functional Explanation** (valid for parts) and **Ultimate Justification** (invalid for the whole without theology).
  *   **Why it feels different:** With a kidney, you are inside the system looking at a part. With existence, you are the system trying to look at yourself from the outside. Wittgenstein called this "trying to run against the walls of our cage." The question isn't deep curiosity; it's a syntax error in human reasoning.
