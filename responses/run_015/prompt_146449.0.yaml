prompt: |-
  I'm prepping an interview for my small podcast—kinda philosophy of mind and value-theory adjacent—and next week's guest is pushing this niche view about pain asymbolia that I can't quite wrap my head around. She argues the standard affective theory gets the framing wrong: pain isn't bad in virtue of how it feels, but because a specific evaluative mechanism tags the sensory represention of tissue damage with negative valence, and in asymbolia that tag gets knocked out without destroying the represention itself. So patients report "it hurts" but genuinely don't mind it, and she takes this to show that badness is a separable module, not part of pain proper. I want maybe eight or nine actual interview questions that dig into this, not generic "what drew you to this" stuff. Specifically, I need one pressing her on why asymbolics still pull away from noxious heat if the badness-module is genuinely offline—anticipating she'll say it's just reflex, then a follow-up asking whether protective reflex still needs some evaluative signal to be adaptive rather than random twitching. Another should tackle the suppression objection: how do we know they're not just hiding the affect? With a follow-up keyed to her likely reply that suppression feels effortful, asking what neural or behavioral marker could actually distinguish absence from suppression on her account. I also want a question about phantom limb pain, since there's no tissue damage to represent—does her representational component collapse there, or does she need a separate story? And one about whether, if decoupling works for pain, it should also work for nausea or itch, which might make her account too broad and lose what makes pain special. Finally, I want a closing question about ethics: if pain's badness is genuinely modular, is injury only instrumentally bad in a world full of asymbolic people, or are there still direct moral reasons to prevent damage? Make them sound like real podcast questions, not exam prompts, and please don't ask for reading lists or citations—she hates that and I don't want her to deflect.
