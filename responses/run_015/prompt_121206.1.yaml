answer: |-
  You have identified a genuine structural flaw in applied ethics, particularly in fields like bioethics, rational choice theory, and policy making. While there is no single, canonical Latin name for this specific maneuver (like *ad hominem* or *petitio principii*), it is a recognized pathology in the literature surrounding **Ideal Advisor Accounts** (metaethics) and the **Substituted Judgment Standard** (bioethics).

  Because you want a term with precise boundaries that distinguishes this from general hypocrisy or Kantian regulation, I propose we coin the term:

  ### **Asymmetric Idealization**

  Here is the technical specification of the concept, its boundaries, and how to distinguish it from adjacent phenomena.

  ---

  ### 1. The Definition
  **Asymmetric Idealization** occurs when an arguer invokes an **Ideal Agent** (a fully rational, fully informed version of a person) to ground a normative claim, but selectively shifts the **epistemic status** of that Ideal Agent based on whether its hypothetical output aligns with the arguer's preferred default position.

  It involves two modes of operation used within the same argumentative framework:
  *   **Mode A (Constitutive/Authoritative):** When the Ideal Agent's hypothetical choice aligns with the arguer's preference, the Ideal is treated as *ontologically robust* and *epistemically accessible*. Its will is binding.
  *   **Mode B (Regulative/Heuristic):** When the Ideal Agent's hypothetical choice conflicts with the arguer's preference, the Ideal is treated as *counterfactual* and *epistemically inaccessible*. Its will is dismissed as unknowable, and a default heuristic (e.g., "preserve life," "maximize liquidity") is substituted.

  ### 2. The Boundaries (What it is NOT)

  To ensure this term is useful and not just a synonym for "inconsistency," we must delineate its edges.

  #### **Vs. Ordinary Equivocation**
  *   **Equivocation** is usually linguistic (using the same word with two different meanings).
  *   **Asymmetric Idealization** is *methodological*. The definition of the "Ideal Agent" remains constant (fully informed/rational); what changes is the **modal status** assigned to the Agent's output. It is not a confusion of terms, but a strategic shift in how much authority the calculation is granted.

  #### **Vs. Motte-and-Bailey**
  *   **Motte-and-Bailey** involves retreating to a defensible position (Motte) when a controversial position (Bailey) is attacked.
  *   **Asymmetric Idealization** is often proactive. The arguer doesn't necessarily retreat under fire; they pre-emptively assign "Authoritative" status to the Ideal when it yields Conclusion X, and "Heuristic" status when it yields Conclusion Y. While Asymmetric Idealization often *functions* like a Motte-and-Bailey, the specific mechanism relies on the metaphysics of the *Ideal Agent*, not just any defensible claim.

  #### **Vs. Kantian Regulative Ideas**
  *   This is the most important distinction for a philosopher of action.
  *   **Kantian Regulative Ideals:** For Kant, ideals (like the *Kingdom of Ends*) are **consistently regulative**. They orient inquiry and action but are never treated as empirically constitutive. They do not vanish when the outcome is inconvenient; they remain a standard against which we measure our failure.
  *   **Asymmetric Idealization:** The ideal is treated as **constitutive** (it determines the truth of the obligation) when convenient, and **regulative** (it's just a vague guide) when inconvenient. It violates the *consistency of modal status* required for a legitimate regulative ideal.

  ### 3. The Chemist's Analogy
  Since you come from chemistry, think of it like **Theoretical Yield**:

  *   **Scenario 1 (The Retirement Argument):** "You must save 20% of your income."
      *   *Argument:* "Your Ideal Self knows the compound interest rates and probability of longevity. That self demands you save."
      *   *Status:* The Theoretical Yield is treated as a **mandatory quota**. If you don't hit it, you are irrational.
  *   **Scenario 2 (The Medical Argument):** "We must continue ventilation."
      *   *Argument:* "Your Ideal Self might prefer death over vegetative state, but we cannot calculate that utility function accurately."
      *   *Status:* The Theoretical Yield is treated as **experimentally unreachable**. Because we can't compute the Ideal Self's preference perfectly, we default to the "baseline reaction" (preserve biological function).

  **Asymmetric Idealization** is claiming the Theoretical Yield is a binding contract when it favors savings, but an impossible calculation when it favors stopping treatment.

  ### 4. Diagnostic Criteria
  To label a move as **Asymmetric Idealization**, three conditions must be met:

  1.  **Invocation:** The argument explicitly relies on the hypothetical will of an idealized agent (rational, informed, future self, etc.).
  2.  **Status Shift:** The epistemic access to that will shifts from "knowable/binding" to "unknowable/heuristic" (or vice versa) within the same normative framework.
  3.  **Outcome Correlation:** The shift correlates perfectly with whether the Ideal's will supports the arguer's pre-existing normative default (e.g., status quo, preservation of life, market efficiency).

  ### 5. Why this matters
  In philosophy of action, this undermines the **Full Information Account** of well-being. If the "Ideal Self" is only authoritative when it converges with the theorist's intuitions, the Ideal Self is not doing the normative work; it is a **philosophical puppet**.

  Using the term **Asymmetric Idealization** allows you to pinpoint that the error isn't in the *conclusion* (saving for retirement or preserving life might both be good), but in the **mechanism of justification**. It exposes that the "Ideal Agent" is being used as a rhetorical shield rather than a genuine tool of discovery.

  ### Summary for your toolkit:
  *   **Term:** Asymmetric Idealization.
  *   **Core Mechanism:** Switching the Ideal Agent between *Constitutive* (binding truth) and *Regulative* (unknowable guide) based on desired outcomes.
  *   **Not:** Simple hypocrisy (which is about values) or Equivocation (which is about language).
  *   **Use Case:** When someone says "The rational agent would want X" to mandate action, but "We can't know what the rational agent wants" to block action Y.

  This gives you a precise scalpel to dissect the argument without getting bogged down in accusations of bad faith. It targets the structural integrity of the normative model itself.
