answer: |-
  1. The instability arises because the future self, upon reaching the decision node, faces the same local preference and lacks any binding commitment from the past self to honor the initial refusal. Consequently, the sophisticated agent's initial prediction proves false when the future self inevitably accepts the trade, collapsing the backward induction.

  2. When applied to plans, dynamic consistency requires executing a chosen sequence regardless of future temptations, whereas applied to choices it requires merely acting in accordance with one's current evaluation of future actions. A sophisticated agent is inconsistent in the first sense because they abandon the optimal plan to avoid future deviation, yet consistent in the second because their actual choices align with their backward-inducted predictions.

  3. To establish irrationality of the preferences themselves, the argument must premise that rational agents are prohibited from employing sophisticated or resolute strategies to mitigate exploitation. Without assuming that only myopic choice is permissible, the pump demonstrates only that a specific combination of preferences and decision strategy is costly, not that the preferences are inherently flawed.

  4. Resolute choice allows the decision at a node to depend on the originally adopted plan rather than solely on the available options and predicted future behavior at that node. Accordingly, resolute choice gives up the principle of separability, which dictates that choices should depend only on the current situation and future consequences, ignoring past intentions.

  5. The money pump is better read initially as an argument that certain diachronic choice strategies are self-defeating when paired with cyclic preferences, rather than proving the preferences themselves are irrational. To move to the first reading, one must show that no rational choice strategy exists that can protect an agent with cyclic preferences from exploitation, thereby forcing the defect onto the preferences.
