answer: |-
  This is a beautifully constrained design problem. You are asking for a controlled experiment where the independent variable is the *aggregation rule* and the dependent variable is *satisfaction/outcome*, holding the *electorate* constant. The challenge is to make the abstract trade-off (mirroring vs. deciding) somatic—something they feel in their seats—without lecturing.

  Here is a design for **"The Polis Protocol,"** tailored to your audience's quantitative literacy and your material constraints.

  ### **I. The Setup (Materials & Preparation)**

  **Materials:**
  *   **20 Identity Cards:** Index cards, pre-filled. (See *Distribution* below).
  *   **20 Ballot Slips:** Small slips of paper.
  *   **5 District Boxes:** Envelopes labeled "District 1" through "District 5."
  *   **1 National Box:** A larger envelope.
  *   **Whiteboard & Markers.**
  *   **Score Sheet:** A grid on the board to track points.
  *   **Sticky Dots:** Two colors (e.g., Green for "Satisfied," Red for "Dissatisfied").

  **The "Country" (Polis):**
  *   **Population:** 20 Citizens (your participants).
  *   **Assembly:** 5 Seats.
  *   **Majority to Govern:** 3 Seats.
  *   **Factions (Visible Axis):** **Red**, **Blue**, **Green**. (Write these in large text on the cards).
  *   **Sub-factions (Hidden Axis):** **Circle**, **Square**. (Write these in small text in the corner).
  *   **The Issue:** The Assembly must pass one **Policy Law**. The Law has two attributes: **Color** (which Faction's name is on it) and **Shape** (Circle or Square).

  **The Distribution (The "Fixed Electorate"):**
  You must pre-assign the 20 cards to ensure the paradoxes occur.
  *   **Total Counts:** Red (8), Blue (7), Green (5). *Red is the Plurality.*
  *   **Shape Split:** Roughly 50/50 Circles/Squares across all colors, but *correlated* such that Red is mostly Circles, Blue is mixed, Green is mostly Squares.
  *   **District Allocation (For FPTP):** This is the critical hidden variable. You will physically sort the players into districts *after* they choose the rule, but you (the facilitator) know the map.
      *   *District 1:* 3 Red, 1 Blue (Red wins)
      *   *District 2:* 1 Red, 3 Blue (Blue wins)
      *   *District 3:* 1 Red, 3 Blue (Blue wins)
      *   *District 4:* 1 Red, 2 Blue, 1 Green (Blue wins)
      *   *District 5:* 2 Red, 1 Blue, 1 Green (Red wins)
      *   *Result:* Red has 40% votes, 2 Seats. Blue has 35% votes, 3 Seats. Green has 25% votes, 0 Seats. **(The FPTP Bite: Cohesion beats Popularity).**

  ### **II. The Procedure (90 Minutes Hard Stop)**

  #### **Phase 1: The Constitutional Convention (20 mins)**
  1.  **The Pitch:** "We are founding Polis. We need an election rule. There are two options."
  2.  **The Data:** On the whiteboard, write the **Visible Axis**: *Red: 8, Blue: 7, Green: 5.*
  3.  **The Blind Spot:** Tell them: "There is a second dimension of preference (Circle vs. Square) that affects policy quality, but we do not know its distribution. Also, if you choose Districts, you do not yet know the boundary lines."
  4.  **The Rules:**
      *   **Rule A (District/Plurality):** The country is divided into 5 districts of 4 people. The top vote-getter in each district wins a seat. The party with 3+ seats forms the Government and sets the Law (Color & Shape).
      *   **Rule B (National/Proportional):** The whole country is one district. Seats are awarded by % of vote (rounded to nearest whole). Parties must coalition to reach 3 seats. The Coalition negotiates the Law.
  5.  **The Vote:** Participants vote by show of hands for Rule A or Rule B. Majority wins. Record the choice.

  #### **Phase 2: Identity & Balloting (10 mins)**
  1.  **Deal Cards:** Hand out the 20 pre-prepared Identity Cards face down. Participants look secretly.
  2.  **The Ballot:** Ask them to write their **Color** preference on a ballot slip. (Keep it simple: vote for Faction).
  3.  **Collection:**
      *   If **Rule A** was chosen: Ask them to stand and move into 5 groups (Districts) according to a list you call out (this is where you enforce the pre-set distribution that hurts Red). Collect ballots in District Envelopes.
      *   If **Rule B** was chosen: Collect all ballots in the National Box.

  #### **Phase 3: Election I (The Chosen Rule) (25 mins)**
  1.  **The Count:** Open envelopes. Count publicly on the whiteboard.
  2.  **The Government:**
      *   *If Rule A:* The party with 3+ seats declares victory. They choose the Law (e.g., "Blue Circle"). *Facilitator Note: If Blue wins districts, they will likely pick Blue Circle.*
      *   *If Rule B:* Assign seats (Red 2, Blue 2, Green 1). Announce: "No Majority." Open the floor for 5 minutes of **Coalition Bargaining**. Pick one representative from each party to stand at the front. They must agree on a Law (Color + Shape) to secure 3 seats.
      *   *The Trap:* Ensure Green (the smallest) realizes they hold the deciding vote. Let them pick a partner that excludes the largest party (Red).
  3.  **Scoring:** Reveal the Payoff Scheme.
      *   **Law matches your Color:** 10 Points.
      *   **Law matches your Shape:** 5 Points.
      *   **Total:** Max 15.
      *   Participants calculate their score silently. Ask for a show of hands: "Who scored 0? Who scored 15?" Place sticky dots on the board (Green/Red).

  #### **Phase 4: Election II (The Counterfactual) (20 mins)**
  1.  **The Pivot:** "Keep your cards. Keep your ballots. We are now running the *other* rule on the *same* votes."
  2.  **The Re-Count:**
      *   If they played Rule A: Pool all ballots into the National Box. Count proportionally. Force the Coalition Bargaining phase (Red vs. Blue vs. Green).
      *   If they played Rule B: Sort them into the 5 Districts (use the pre-set distribution). Count district winners.
  3.  **The Government:** Declare the new Law.
  4.  **Scoring:** Recalculate points. Update sticky dots on the board.

  #### **Phase 5: The Debrief (15 mins)**
  1.  **Reveal the Hidden Axis:** Show the actual distribution of Circles vs. Squares.
  2.  **Map the Pain:** Point to the sticky dots.
      *   "Under Rule A, who lost points because their Color was popular but their District was drawn badly?" (The Cohesion Bite).
      *   "Under Rule B, who lost points because the smallest party dictated the Shape?" (The Bargaining Bite).
  3.  **The Physicist's Summary:** (See below).

  ---

  ### **III. Troubleshooting: What Will Go Wrong**

  **1. The "Hybrid" Amendment**
  *   **Risk:** Halfway through Phase 1, an engineer will propose "Proportional Districts" or "Ranked Choice."
  *   **Fix:** "The Convention is closed. We are testing two specific Hamiltonians. We cannot change the physics mid-experiment."

  **2. The "Rigged" Accusation**
  *   **Risk:** When Red loses under FPTP despite having the most votes, someone will claim the District Map was manipulated.
  *   **Fix:** Acknowledge it. "Gerrymandering is a feature of District systems, not a bug. The system is sensitive to boundary conditions. That is the variable we are testing."

  **3. Coalition Stalemate (PR)**
  *   **Risk:** In the PR bargaining phase, the three representatives can't agree.
  *   **Fix:** Impose a "Shapley Value" timeout. "If you don't agree in 2 minutes, the smallest party (Green) gets dictator power." This forces the realization that small parties gain leverage in PR.

  **4. Time Creep**
  *   **Risk:** Bargaining takes too long.
  *   **Fix:** Use a visible timer. When it beeps, the Government is formed by the Facilitator based on the most likely coalition (usually the one that excludes the largest party to maximize partner share).

  ---

  ### **IV. Limitations: What This Design Cannot Show**

  Be frank in the debrief. This simulation is a *static* snapshot. It cannot reproduce:

  1.  **Strategic Voting (Duverger's Law):** In real FPTP, the Green voters would have seen the polling, realized they can't win, and voted Blue to stop Red. In this game, they voted honestly. *You must tell them:* "In reality, the voters adapt to the rule over decades. This game shows the *mechanical* effect, not the *psychological* adaptation."
  2.  **Thresholds:** We didn't have a 5% threshold. In real PR, Green might have been excluded entirely if they got 4%.
  3.  **Path Dependence:** Countries rarely switch systems. This game makes switching look easy (just re-count). In reality, the incumbents elected by Rule A would never vote to implement Rule B.

  ---

  ### **V. The Closing Sentence**

  You asked for a single sentence to leave them with. Given your background and the room's temperament, avoid moralizing. Stick to the structural insight.

  > **"Electoral systems do not measure the will of the people; they are the machinery that constructs it."**

  ### **VI. Facilitator's Cheat Sheet (The "Physics")**

  *   **Independent Variable:** Aggregation Rule (District vs. National).
  *   **Dependent Variable:** Participant Payoff (Color + Shape match).
  *   **Control Variable:** The Ballots (Preferences).
  *   **Confounding Variable to Watch:** Participants talking to each other during the ballot phase. *Instruction:* "No campaigning. This is a secret ballot."
  *   **The "Bite" Configuration:**
      *   **FPTP:** Red voters are "efficiently wasted" (packed into District 1 & 5). Blue voters are "efficiently distributed" (winning 2-1 in Districts 2, 3, 4).
      *   **PR:** Red (40%) + Green (25%) = 65% (Majority). BUT, Blue (35%) + Green (25%) = 60% (Majority). If Blue and Green hate Red, Red is excluded despite being the largest party. The "Shape" preference of Green becomes the Law, alienating the Red Circles.

  This design respects your constraint: same voters, same ballots, different machinery. It forces them to feel the frustration of *wasted votes* (FPTP) and the frustration of *unmandated coalitions* (PR) without you ever needing to define those terms until the end.
