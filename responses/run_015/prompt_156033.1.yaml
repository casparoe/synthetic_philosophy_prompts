answer: |-
  Your "protocol mismatch" intuition is excellent. It cuts very close to the philosophical joint, but you're right to sense that it needs a tweak to account for the fact that Dave isn't experiencing an error state. He isn't failing to handshake; he is successfully running a **dual-stack** system.

  Here is the breakdown of the concepts you are looking for, translated into your domain, without the reading list.

  ### 1. Is "Protocol Mismatch" the right frame?
  **Verdict:** Close, but it's not a mismatch between *you and Dave*. It's a **Layer Violation** within Dave's own stack.

  In your metaphor, you assume "Truth" is the Application Layer (data), and "Evidence" is the Transport Layer (TCP). You expect that if the Transport Layer fails (no evidence), the Application Layer should drop the packet (reject the claim).

  Dave's system works differently. For him, "God exists" is not an Application Layer packet that *travels* over the Transport Layer of evidence. For him, "God exists" is part of the **Handshake Protocol itself**. It is a root certificate. You cannot validate the root certificate using the data transmitted over the connection; the root certificate is what allows you to validate the connection in the first place.

  When Dave says, "The Resurrection happened or it didn't," he is speaking Application Layer (factual claim).
  When Dave says, "Nothing would change my mind," he is speaking Protocol Layer (foundational axiom).

  He doesn't feel contradictory because in his architecture, the Protocol Layer *authorizes* the Application Layer. You are trying to debug his Application Layer using your Transport Layer logs, but his Transport Layer is configured to trust a different Certificate Authority.

  ### 2. The Wittgensteinian Concept: "Hinge Propositions"
  You mentioned Wittgenstein. There are two distinct Wittgensteinian ideas here, and you need the second one.

  *   **Idea A (Language Games):** Often summarized as "Religion isn't about facts, it's about attitudes." This is what your meetup friend told you. **This does not fit Dave.** Dave insists it *is* about facts. If you tell Dave "Religion is just a language game," he will feel misunderstood, because he believes a dead man actually came back to life.
  *   **Idea B (Hinge Propositions):** This comes from Wittgenstein's later work, *On Certainty*. This fits Dave perfectly.

  A **Hinge Proposition** is a statement that looks like a fact but functions like a rule.
  *   *Example:* "The earth has existed for more than 5 minutes."
  *   *Fact-like:* It describes the world.
  *   *Rule-like:* No amount of evidence could convince me otherwise. If I found a fossil that suggested otherwise, I would assume the fossil was fake, not that the earth is 5 minutes old.

  Hinge propositions are "groundless believing." They are the hinges on which the door of inquiry swings. You don't test the hinge; you use the hinge to test the door.

  **How this explains Dave:**
  When Dave says, "The Resurrection happened," he is treating it as a Hinge.
  *   **In normal conversation:** It functions as a fact (Application Layer). "If it didn't happen, Christianity is garbage."
  *   **In epistemic defense:** It functions as a rule (Protocol Layer). "Nothing would change my mind."

  Wittgenstein isn't saying Dave *can't* state facts. He is saying that for Dave, this specific fact has been promoted to the status of a **constitutive rule**. It defines what counts as evidence. If a historical document contradicted the Resurrection, Dave's "Hinge" tells him the document is flawed, not the Resurrection. That isn't irrationality to him; it's system integrity.

  ### 3. The Dad Concept: "Properly Basic Beliefs"
  Your dad's analogy ("I trust my wife") maps to a school of thought called **Reformed Epistemology** (associated with philosopher Alvin Plantinga).

  The concept is **Properly Basic Beliefs**.
  *   Most beliefs are inferred (I see smoke, I infer fire).
  *   Some beliefs are "basic" (I see a tree, I believe there is a tree). You don't need an argument for the tree. The belief is produced by a cognitive faculty (perception).
  *   Plantinga argues belief in God is like perception or memory. It is "properly basic."

  **The Switch:**
  When your dad says, "God is someone I trust," he is describing the *source* of the belief (a cognitive faculty, like vision).
  When he prays for parking, he is testing the *output* of that faculty (prediction).

  The friction you feel is that vision is inter-subjectively verifiable (we both see the tree), whereas his "God perception" is private. But structurally, he is claiming that his belief doesn't require the "Evidence Transport Layer" because it comes from a "Direct Hardware Interface."

  ### 4. The Register-Switching: "Grammar vs. Use"
  You asked about the switching itself. How can Dave run both modes at once?

  In philosophy of language, this is the distinction between **Grammar** and **Use**.
  *   **Grammar:** The sentence structure. "Jesus rose from the dead" has the grammar of a historical claim. It uses the syntax of fact.
  *   **Use:** What the sentence *does* in a specific context.

  Dave switches **Use** without changing **Grammar**.
  *   **Context 1 (Theology/History):** He uses the sentence to demarcate truth from falsehood. (Fact-Use).
  *   **Context 2 (Apologetics/Evidence):** He uses the sentence to signal commitment and identity. (Hinge-Use).

  Because the Grammar stays the same ("It is true that..."), he doesn't feel like he's switching. He feels like he is talking about the same object, just from different angles. You feel like he's cheating because you expect the Grammar to dictate the Use. If it looks like a fact, it should be tested like a fact. He operates on the rule that some facts are too important to be tested; they are the testers.

  ### 5. The Edges: What looks like this but isn't?
  To know if you've identified the phenomenon correctly, you need to know what would falsify your diagnosis. Here are three cases that look similar but are structurally different:

  **A. Conspiracy Theories (Not the same)**
  *   *Similarity:* Immune to counter-evidence. "Nothing would change my mind about QAnon."
  *   *Difference:* Conspiracy theories claim to be *empirically* grounded. They pretend to have the Transport Layer logs ("Do your research!", "Look at this clue!"). Dave admits he doesn't have public evidence.
  *   *Test:* If Dave started producing fake historical documents to prove the Resurrection, he would have moved from "Hinge Belief" to "Conspiracy." As long as he admits the evidence isn't public/accessible, he's in the religious register.

  **B. Hypocrisy / "Noble Lie" (Not the same)**
  *   *Similarity:* Says it's true, acts like it's true.
  *   *Difference:* The hypocrite knows it's false in the Protocol Layer. Dave does not.
  *   *Test:* If Dave admitted, "Well, it might not have literally happened, but it's a useful story," he would be a Non-Cognitivist. He refuses to say this. He insists on the literal truth. That insistence is what makes it a Hinge, not a lie.

  **C. Scientific Paradigms (Close, but distinct)**
  *   *Similarity:* Thomas Kuhn showed scientists operate within paradigms that resist falsification.
  *   *Difference:* Scientists admit the paradigm *could* break under enough pressure (a crisis). Dave says *nothing* would change his mind.
  *   *Test:* If Dave said, "If we found Jesus's bone box with DNA, I'd stop believing," he would be treating it as a Scientific Hypothesis. By saying "Nothing would change my mind," he confirms it is a Hinge.

  ### Summary for your argument
  You don't need to win the argument, but you can name the dynamic.

  1.  **Your Intuition:** You identified a **Protocol Mismatch**.
  2.  **The Correction:** It's not a mismatch between you and him. It's that he treats the claim as a **Root Certificate** (Hinge Proposition) while you treat it as **Payload Data** (Empirical Hypothesis).
  3.  **The Switching:** He switches between **Grammar** (which sounds like data) and **Function** (which acts like a certificate).
  4.  **The Name:** In philosophy, this is **Hinge Epistemology** (Wittgenstein) combined with **Reformed Epistemology** (Plantinga). In cognitive science, it might be called **Epistemic Framing**.

  **The "Gotcha" you're looking for:**
  The tension arises when he tries to use the *authority* of the Payload ("It's a fact!") to convince outsiders, while using the *immunity* of the Root Certificate ("You can't test this!") to defend against outsiders.

  He wants the **Social Capital of Facts** (objective truth) without the **Liability of Facts** (falsifiability). You can point this out without attacking the belief itself: *"Dave, you're claiming the bandwidth of a fact but the latency protection of a protocol. You can't have both in a public network."*

  He may reply that he isn't on the public network. And that, ultimately, is the name of the thing: **Incommensurable Epistemic Frameworks.**
