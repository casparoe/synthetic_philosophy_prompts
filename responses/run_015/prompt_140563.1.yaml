      *   *Tone:* Keep it analytical, philosophical, but grounded in scientific practice. Avoid overly jargon-heavy prose where possible, but use terms like "Correspondence Principle" and "Structural Realism" correctly.

  5.  **Final Review against Prompt Requirements:**
