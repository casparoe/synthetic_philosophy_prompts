prompt: |-
  Most scientists seem to treat it as a hard requirement on any successor theory that it give back the old theory's results in the region where the old theory worked — general relativity has to hand you Newtonian gravity in the slow, weak-field limit, quantum results have to shade into classical ones when things get big, and a referee will bounce a proposal that can't show the limit coming out. What does that practice presuppose? On it's face it looks like it needs two things: some theory-neutral way of saying what the old theory's successes even were, so that both theories can be scored against the same phenomena, and enough continuity in what the words mean that reproducing the old predictions is a well-defined ask. But if the meanings shift when the paradigm shifts, I can't see what the ask is an ask about — and yet scientists keep making it and it seems to work fine in practice.

  Two wrinkles I want dealt with. First, recovery might just be a feature of one kind of transition rather than a requirement on all of them: in some episodes the old theory's central quantity gets deleted rather than recovered — phlogiston, the luminiferous ether — and nobody thinks that makes the replacement any less of an improvement. Second, imagine a field that swaps its mechanistic theory for a big fitted predictor that matches every old prediction to within noise but shares no vocabulary and no mechanism with it; it recovers the successes on the test above while explaining nothing, and I doubt that's what scientists think they're demanding.

  So: reconstruct the implicit view of theories, meaning and progress that the recovery requirement fits with. Tell me which parts are strictly presupposed by the practice and which would sit just as happily under Kuhn-style meaning variance or under something more like structural realism. Say whether the practice is consistent with itself, given that the same textbooks call the old theory straightforwardly false, go on using it, and teach it to undergraduates before the new one. And say what would concretely have to change in peer review and in how we teach science if the requirement were dropped, or if incommensurability were taken seriously enough to act on.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Question:** What does the scientific practice of requiring "recovery limits" (new theory $\to$ old theory in appropriate limits) presuppose about theories, meaning, and progress?
      *   **Constraint 1 (Wrinkle 1):** Acknowledge that not *all* concepts are recovered (e.g., phlogiston, ether are discarded). Recovery applies to *successes/predictions*, not necessarily ontology.
      *   **Constraint 2 (Wrinkle 2):** Acknowledge that mere empirical fit (black box predictor) isn't enough; explanation/mechanism matters. Recovery isn't just curve-fitting.
      *   **Task 1:** Reconstruct the implicit view of theories, meaning, and progress fitting this practice.
      *   **Task 2:** Distinguish between what is *strictly presupposed* vs. what is compatible with Kuhnian meaning variance or Structural Realism.
      *   **Task 3:** Address consistency (textbooks call old theory false but teach/use it).
      *   **Task 4:** Describe concrete changes in peer review and teaching if the requirement were dropped or if incommensurability were taken seriously.

  2.  **Initial Brainstorming & Philosophical Mapping:**

      *   *The Practice:* Correspondence Principle (Bohr), Limiting Case Recovery.
      *   *Presuppositions:* Continuity of nature, cumulative progress (at least empirically), stability of observational language.
      *   *Kuhn:* Incommensurability suggests meanings change (mass in Newton vs. Einstein). If meanings change strictly, recovery is impossible. But scientists do it. So, either Kuhn is too strong, or there's a layer of language that *doesn't* shift.
      *   *Structural Realism (Worrall, Ladyman):* Save the structure (math/relations), discard the ontology. This fits recovery well (equations limit to equations) while allowing ontological discard (ether).
      *   *Entity Realism (Hacking):* Believe in the entities you manipulate.
      *   *Pragmatism:* It works, so we keep it.
      *   *The "False but Useful" Paradox:* Newton is "false" (ontologically) but "approximately true" (empirically/structurally) in limits.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. It touches on the Correspondence Principle and the realism/anti-realism debate.

      *   **Reconstructing the Implicit View:**
          *   What is a theory? Not just a story, but a mathematical structure mapping to observations.
          *   What is progress? Cumulative *empirically*, potentially revolutionary *ontologically*.
          *   What is meaning? Partially stable (observational terms), partially fluid (theoretical terms).
          *   *Key Distinction:* Recovery is about *predictions/phenomena*, not necessarily *mechanisms*. (Addresses Wrinkle 1).
          *   *Key Distinction:* Recovery requires *derivation*, not just fitting. (Addresses Wrinkle 2).

      *   **Strict Presuppositions vs. Compatible Philosophies:**
          *   *Strictly Presupposed:* There is a stable domain of "phenomena" (observational reports) that is theory-neutral enough to be identified across paradigms. There is a mathematical continuity in the formalism.
          *   *Compatible with Kuhn:* Kuhn admits "overlap" in normal science. Incommensurability isn't total. We can translate enough to check limits.
          *   *Compatible with Structural Realism:* This is the best fit. $T_{new}$ preserves the structure of $T_{old}$ in the limit, even if the nature of the entities changes.

      *   **Addressing the Consistency Problem (False but Taught):**
          *   How can Newton be false but taught?
          *   *Solution:* Domain specificity. It's not "False" simpliciter, it's "False outside domain D". Inside D, it's effectively true.
          *   *Pedagogy:* Scaffolding. You learn the limit before the general case.
          *   *Consistency:* It is consistent if we view theories as *effective field theories* rather than Final Truths.

      *   **Concrete Changes if Dropped (The Counterfactual):**
          *   *Peer Review:* No more "show the Newtonian limit." Acceptance of "brute force" models (ML/AI style) without physical derivation. Fragmentation of fields (no common language).
          *   *Teaching:* No historical progression. Start with the most general (and hardest) theory immediately. Loss of intuition building.
          *   *Incommensurability acted upon:* Scientists would stop talking to each other across paradigm shifts. Science would become a series of isolated silos.

  4.  **Refining and Polishing (Self-Correction during drafting):**

