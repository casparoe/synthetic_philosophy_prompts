answer: |-
  The practice you describe is known as the **Correspondence Principle** (broadly construed). It is the methodological engine that allows science to claim progress without claiming that previous scientists were simply blind. To reconstruct the implicit view of theories, meaning, and progress that fits this practice, we must distinguish between *ontology* (what exists), *formalism* (the math), and *phenomena* (the measured outcomes).

  Here is the reconstruction of the implicit view, the analysis of its philosophical commitments, and the concrete consequences of dropping it.

  ### 1. The Implicit View: Effective Structural Realism

  The practice presupposes a view that sits comfortably between Naive Realism and Instrumentalism. It treats theories not as final declarations of Truth, but as **effective descriptions of structure within specific domains.**

  *   **On Theories:** A theory is viewed as a mathematical structure that maps boundary conditions to observational outcomes. The "truth" of a theory is domain-relative. Newtonian gravity is not "false" in an absolute sense; it is "false outside its domain of validity." Inside that domain, it is structurally isomorphic to reality *as far as we can measure*.
  *   **On Meaning:** This practice rejects strong Kuhnian incommensurability regarding *observational terms* while accepting it regarding *theoretical terms*. "Position," "time," and "energy" must have stable enough meanings across theories to allow comparison (otherwise the limit makes no sense). However, the *nature* of those things (absolute time vs. proper time) can shift.
  *   **On Progress:** Progress is cumulative regarding **predictive structure** and **explanatory scope**, but not necessarily cumulative regarding **ontology**.

  **Addressing your Wrinkles:**
  1.  **Ontological Deletion (Phlogiston/Ether):** The recovery requirement applies to *phenomena*, not *entities*. Oxygen theory had to recover the *observations* of phlogiston theory (weight gain during calcination), not the entity of phlogiston itself. The implicit view is that the *relations* between observables are preserved, even if the underlying machinery is swapped.
  2.  **The Black Box Predictor:** A fitted predictor that matches data but shares no vocabulary fails the "explanation" criterion. The recovery requirement demands a **derivational link**. We need to see *why* the old theory worked (e.g., because $v \ll c$), not just *that* it worked. This preserves the understanding of the domain boundaries, which a black box does not.

  ### 2. Strict Presuppositions vs. Philosophical Compatibility

  What is strictly required for this practice to function, and what is merely compatible?

  **Strictly Presupposed:**
  1.  **Stability of the Phenomenal Domain:** There must be a theory-neutral (or at least theory-permeable) language of "data" or "phenomena" (e.g., pointer readings, spectral lines) that both theories can claim to predict. If the new theory says the old data was an illusion (rather than an approximation), recovery is impossible.
  2.  **Mathematical Continuity:** The formalism of the new theory must contain parameters or limits that allow it to mathematically reduce to the old formalism. If the math is discontinuous (e.g., discrete vs. continuous with no bridge), recovery fails.
  3.  **Causal/Explanatory Continuity:** The new theory must provide a reason for the old theory's success. If the old theory worked by accident, recovery is not possible; the new theory would simply supersede it. The practice presupposes the old theory wasn't just lucky.

  **Compatible with Kuhn-Style Meaning Variance:**
  *   **Weak Incommensurability:** Kuhn argued that meanings shift (e.g., "mass" in Newton vs. Einstein). The recovery practice is compatible with this *if* the shift is continuous. We can translate between the languages in the limit region. The practice presupposes that incommensurability is not total; there is always an overlap region where translation is possible.
  *   **Paradigm Shifts:** Kuhn allows for "normal science" where puzzles are solved within a framework. Recovery is a requirement of normal science transitioning into a new paradigm. It fits Kuhn's view that new paradigms must explain why the old one was successful enough to command assent for so long.

  **Compatible with Structural Realism (Worrall/Ladyman):**
  *   **Best Fit:** This practice is the strongest evidence for **Epistemic Structural Realism (ESR)**. ESR argues that while we cannot know the true nature of entities (ontology changes: ether $\to$ fields), we can know the structural relations between them (math changes continuously).
  *   **The "Nodal" View:** The old theory captures a part of the structure of the world. The new theory captures more of the structure, encompassing the old part. The recovery requirement is essentially a demand that the structural relations of the old theory be preserved as a sub-structure of the new one.

  ### 3. Consistency: "False" yet Taught

  You note the apparent contradiction: Textbooks call the old theory false, yet teach it and use it. Is this consistent?

  **Yes, under the "Effective Theory" framework.**
  When a physicist says "Newtonian gravity is false," they mean "It is not the fundamental description of spacetime." When they teach it, they are teaching **Effective Field Theory (EFT)** logic.
  *   **Consistency:** It is consistent to say a map is "not the territory" (false ontologically) but "accurate for navigation in this city" (true empirically within a domain).
  *   **Pedagogical Necessity:** We teach the limit before the general case because the human cognitive architecture requires scaffolding. You cannot understand General Relativity without understanding gravitational fields, and you cannot understand fields without understanding forces. The "false" theory is a cognitive stepping stone that mirrors the mathematical limiting case.
  *   **The "Lie-to-Children" Defense:** It is not a lie if the domain of applicability is clearly stated. Textbooks are consistent if they explicitly frame the old theory as an *approximation* rather than a *mistake*. Inconsistency only arises if they claim the old theory is fundamentally true in one chapter and fundamentally false in the next without qualifying the domain.

  ### 4. Concrete Consequences of Dropping the Requirement

  If we stopped demanding limiting case recovery, or if we took strong incommensurability seriously (no translation between paradigms), the practice of science would change radically.

  **In Peer Review:**
  1.  **Fragmentation of Literature:** Without the requirement to link back to established results, new theories could become isolated silos. A new theory of gravity wouldn't need to explain planetary orbits; it could just claim to explain black holes. We would lose the ability to adjudicate between competing theories using historical data.
  2.  **Rise of "Oracle" Science:** Acceptance of black-box models (like high-dimensional neural nets) would accelerate. If we don't require the model to reduce to known physics in simple limits, we accept predictive power without understanding. This risks brittleness; the model might work in the training distribution but fail catastrophically outside it because it lacks the structural constraints of the old theory.
  3.  **Loss of Constraint:** The recovery requirement acts as a severe constraint on theory construction (it's why String Theory is so hard; it *must* produce the Standard Model). Dropping it would lead to an explosion of unconstrained speculative theories that are impossible to falsify using existing data.

  **In Teaching:**
  1.  **History Erased:** If paradigms are truly incommensurable and old theories are simply "false" with no structural link, there is no reason to teach them. We would teach only the current "best" theory. Undergraduates would attempt to learn Quantum Field Theory before Classical Mechanics.
  2.  **Loss of Intuition:** Scientific intuition is built on the limiting cases. Engineers build bridges using Newton, not Einstein. If we drop the requirement to show how Einstein becomes Newton, engineers wouldn't know when they can safely use the simpler math.
  3.  **Cognitive Overload:** Without the scaffolding of approximate theories, learning science would become significantly harder. The "false" theories serve as low-resolution maps that are easier to read. Throwing them away forces students to navigate with high-resolution maps that are too complex for routine tasks.

  **If Incommensurability were Acted Upon:**
  If we truly believed scientists in different paradigms cannot understand each other:
  *   **Collaboration Stops:** A relativist and a Newtonian (in a hypothetical world where both coexist) could not collaborate.
  *   **Data Hoarding:** Data would become theory-bound. "My data is theory-laden, so you can't use it."
  *   **Science becomes Sectarian:** Science would fracture into cults of specific theoretical frameworks, with no objective arbiter (the phenomena) to settle disputes.

  ### Summary

  The recovery requirement presupposes that **nature is continuous** even if our **descriptions are discontinuous**. It demands that the *structure* of prediction be preserved even if the *story* of existence changes. It is fully consistent with Structural Realism and weak Kuhnianism, but incompatible with strong incommensurability or instrumentalism that denies reality to theoretical terms.

  Dropping it would not liberate science; it would fragment it. It would turn physics into a collection of disconnected algorithms that predict without explaining, and it would sever the link between the cutting edge and the engineering base that keeps the lights on. The requirement is not just a logical nicety; it is the glue that holds the cumulative enterprise of science together.
