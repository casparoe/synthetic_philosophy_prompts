answer: |-
  Dear colleague,

  I share your irritation, because the argument you reconstruct is seductive precisely because the mathematics in the first half is impeccable while the philosophical inference in the second half is a category error. Your friend has constructed a valid proof for a specific proposition and then mistakenly assumed that proposition defines rationality universally. To diagnose this cleanly, we should accept steps (1) and (2) without reservation, as they are standard results in stochastic growth theory. The strong law of large numbers does indeed guarantee that for any fixed fraction f, the time-average growth rate converges to the expected log return. Step (3) is also technically correct within its specific domain, which is the comparison of fixed-fraction strategies over an infinite horizon. However, this is where the first crack appears, because the claim that Kelly beats every other strategy with probability one is a pointwise claim about each fixed alternative separately, not a uniform claim over all possible strategies simultaneously. It holds against any other fixed fraction, but it does not hold against strategies that modify their behavior based on wealth levels, such as those designed specifically to avoid an absorbing barrier. If you introduce a ruin state, the strategy that maximizes growth rate may actually have a lower probability of survival than a slightly more conservative strategy, because the asymptotic advantage only kicks in if you survive long enough to reach the asymptote.

  The real break in the chain occurs at step (4), where your friend moves from a description of long-run wealth dynamics to a prescription for rational preference. This step conflates the time-average growth rate with the ensemble-average expected utility. In the specific context of repeated multiplicative shocks where the agent survives indefinitely, maximizing the time-average growth rate is equivalent to maximizing expected logarithmic utility. However, this equivalence relies on the ergodicity of the process, meaning that the time average equals the ensemble average. For a single agent facing a sequence of bets, the time average is what matters, which justifies the log utility behavior instrumentally. But step (4) asserts that rationality consists in having logarithmic utility over wealth intrinsically. This is a leap from instrument to identity. The log function is doing instrumental work here to maximize survival and growth in a multiplicative environment, not intrinsic work representing the agent's true valuation of wealth states. When you treat it as intrinsic, you arrive at the absurdities listed in (6) and (7).

  This leads directly to your question about step (5) and the principled line between the casino and the rest of life. Your friend claims there is no line, but the line is not defined by the venue or the subject matter of the bet; it is defined by the repeatability and the horizon of the decision. The justification for logarithmic behavior relies on the law of large numbers acting over time. In a one-shot decision, or a decision where the horizon is short relative to the volatility, the time average does not converge, and the ensemble average (expected value) becomes the relevant metric for a risk-neutral agent, or some other utility function for a risk-averse one. Therefore, the principled line is ergodicity. Choices that are part of a long, repeated sequence of multiplicative shocks should be governed by growth maximization, which looks like log utility. Choices that are one-off, or where the stakes involve non-recoverable losses like health or essential subsistence, do not satisfy the conditions required for the geometric argument to hold. You can maintain the thought that one's attitude should not change at the door of the casino, provided you recognize that the casino offers repeated multiplicative shocks while life often offers single additive or multiplicative shocks with absorbing barriers. The attitude changes because the structure of the problem changes, not because the location changes.

  Your absorbing-floor objection is not merely a separate complaint; it is the fatal flaw in the application of step (3) to the real world. The theorem in (3) assumes an infinite horizon where wealth can approach zero arbitrarily closely without stopping the process. In reality, wealth has a floor, whether it is zero or a subsistence level, and hitting this floor is an absorbing state. Once there is an absorbing floor, the growth rate is only defined conditional on non-absorption. Maximizing the unconditional growth rate might require taking risks that increase the probability of hitting the floor before the asymptotic growth advantage materializes. A strategy with a slightly lower growth rate but significantly lower volatility might dominate in terms of expected utility because it ensures survival. This means that even within the domain of repeated betting, pure Kelly betting is not strictly rational if there is a non-zero cost to ruin. Your friend's argument ignores the transients and focuses only on the asymptote, but for any real agent, the path to the asymptote matters more than the asymptote itself.

  Regarding the side claim about estimation risk, your intuition is correct that the value of information can sometimes justify betting more than the Kelly fraction computed at the current point estimate, though in practice full Kelly is often too aggressive when parameters are uncertain. However, this debate is secondary to the main argument. Even if the estimation risk claim were false, it would not rescue step (4) or (5), because the fundamental error is the identification of long-run growth maximization with universal rational preference. The estimation risk issue is a refinement within the geometric framework, whereas the ergodicity and absorbing floor issues are objections to the framework's universal applicability. You do not need to resolve the estimation risk question to reject the conclusion that one should pay ninety-nine thousand dollars to avoid a one-in-ten-thousand chance of ruin in a one-shot scenario.

  So, to summarize the diagnosis, you should reject step (4) and consequently step (5). Step (4) looks solid because it hides the assumption of ergodicity behind the authority of the strong law of large numbers. It tricks you into thinking that because log utility maximizes growth in the long run, it must be the correct utility function for all decisions. Rejecting it costs you the claim that geometric rationality is the sole definition of rationality, but it saves you from the absurd implications in (7). You can keep the mathematics of (2) and (3) as a description of what happens to wealth processes over long horizons, and you can keep the thought that creatures facing many multiplicative shocks should care about growth rates. You simply cannot extend that care to one-shot decisions or decisions with absorbing barriers without modifying the objective function to account for survival probability. The logarithmic function is doing instrumental work in the specific context of repeated multiplicative growth, not intrinsic work as a universal measure of value. Your friend's argument refutes itself only because it overextends a valid local optimum into a global theory, and your absorbing-floor objection supplies the precise mechanism by which that overextension fails.
