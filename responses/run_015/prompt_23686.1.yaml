answer: |-
  **Characters:**
  *   **Encroacher (E):** Defends Pragmatic Encroachment (Stanley/Fantl & McGrath style).
  *   **Contextualist (C):** Defends Lewisian Epistemic Contextualism.

  **Setting:** Two philosophers observing a case study.
  **The Case:** A resident, Dr. S, checks a lab value for a drug dosage.
  *   **Time 1 (Low Stakes):** Routine checkup. S has standard evidence (a reliable test result).
  *   **Time 2 (High Stakes):** The patient suddenly goes into anaphylactic shock. The same dosage is now life-or-death. S has the *exact same evidence* as Time 1.
  *   **The Attributor Context:** E and C are observing this from a quiet office. Their conversation about S remains casual; no error possibilities are being highlighted by *them*.

  ***

  **E:** Let's look at Time 2. The patient is crashing. The cost of being wrong about this lab value is death. Dr. S has the exact same test result as before. Intuitively, at Time 2, it is false to say "S knows the value."

  **C:** Intuitively for whom? For you, perhaps. But we are the attributors here. Our conversational context hasn't shifted. We aren't discussing possibilities of lab error. We aren't raising the standard. By Lewis's rules, the score of our conversation is still set to "ordinary." So, "S knows" remains true.

  **E:** That's the problem. You're making knowledge depend on *our* chat in this office, not on *S's* situation in the ward. S cannot rationally administer the drug based on that test result alone at Time 2. If knowledge is the norm of practical reasoning, and S shouldn't reason on it, S doesn't know.

  **C:** You're conflating the norm of *action* with the truth conditions of *knowledge ascriptions*. Look, maybe S *ought not* assert "I know" at Time 2. Maybe S ought not act. But that doesn't mean the proposition "S knows" is false. It just means asserting it is inappropriate.

  **E:** Inappropriate why? If the truth value hasn't changed, what blocks the assertion?

  **C:** Gricean norms. Or a specific norm of assertion. Think of it like this: I know a secret that would hurt you if I told you. I *know* it, but I *ought not* assert it. Ought-implies-can. If I ought not assert it, it doesn't follow that I don't know it. Similarly, S has the evidence. S stands in the factive relation. But the stakes make asserting "I know" reckless. The truth stays; the license to speak vanishes.

  **E:** That distinction collapses under pressure. If S truly knows, then S is in a position to use that proposition as a premise in deliberation. At Time 2, S is *not* in that position. If you say "S knows" is true but "S should act on p" is false, you've severed the link between knowledge and rational action. You're left with a useless concept of knowledge.

  **C:** I've left the concept intact, you're the one changing it. You're trying to bake practical rationality into the semantics of "knows." But consider the At-Issue problem. When we ask "Does S know?", we are asking about S's epistemic position—their evidence, their reliability, the truth of the belief. Why should the patient's blood pressure be part of the *truth conditions* of that epistemic claim?

  **E:** Because the epistemic position isn't just about evidence accumulation; it's about whether that evidence is *good enough*. And "good enough" is inherently teleological. It's good enough *for what?* For a routine checkup? Yes. For a lethal injection? No. The stakes determine the sufficiency of the evidence.

  **C:** But that sufficiency shift is happening in the *subject's* context, not the *attributor's*. In my framework, "knows" is indexical. It refers to a standard of evidence. *We* set that standard by our conversation. Since *we* are still chatting casually, the standard is low. So "S knows" is true relative to us. You want to say the patient's physiology shifts the semantic value of "knows" from across the room. That's magic.

  **E:** It's not magic, it's subject-sensitivity. You think the attributor's context matters more than the subject's stakes. But that leads to absurdity. Imagine a third party, a surgeon, asking S: "Do you know the dosage?" If the surgeon is casual, you say "True." If the surgeon is anxious, you say "False." S's epistemic state flickers based on the surgeon's mood.

  **C:** S's *description* flickers. Not the state. The state is fixed: S has evidence E. The word "knows" just picks out different relations to E depending on who is speaking. You're fetishizing the word. I'm explaining the usage.

  **E:** I'm not fetishizing the word; I'm tracking the norm. If "S knows" is true in the surgeon's casual context, then S is permitted to act. But S is *not* permitted to act. So "S knows" must be false. You're forced to say S knows but shouldn't act on what they know.

  **C:** And I am forced to say that. Because "S knows" is a theoretical claim, not a green light for action. Look, let's press your view. If stakes determine truth, does S *lose* knowledge when the patient crashes?

  **E:** Yes.

  **C:** Without losing any evidence? Without any change in reliability?

  **E:** Correct. The practical environment changed the epistemic status.

  **C:** That violates the purity of the epistemic. It makes truth depend on utility. If I'm betting a million dollars on 2+2=4, do I suddenly not know 2+2=4?

  **E:** If the cost of error is high enough, and your evidence is fallible (which it always is), then yes. You don't know it *for the purposes of that bet*.

  **C:** "For the purposes of." There! You admit it. It's about the purpose, not the truth. "S knows for routine purposes" vs "S knows for critical purposes." That sounds like pragmatic modulation of the *claim*, not a shift in the *fact*. You're describing different relations but calling them all "knowledge." I just make that modulation explicit in the context.

  **E:** I'm not modulating the claim. I'm saying the single relation of knowledge has a practical condition. You're the one positing a hidden parameter in the context. Why should the truth of "S knows" ride on what *we* are talking about in this office? It's solipsistic.

  **C:** It's not solipsistic, it's semantic. "Tall" depends on the comparison class. "Flat" depends on the tolerance for irregularities. "Knows" depends on the salience of error. In your case, the error isn't salient *to us*. So "S knows" is true. You feel it's false because you're projecting S's high-stakes context into our low-stakes conversation.

  **E:** I'm not projecting. I'm recognizing that S's context is the one that matters for S's knowledge. If you insist the truth value stays fixed because *our* chat is fixed, you make knowledge irrelevant to the subject's life. S is facing a dying patient. You're telling me the truth about S's mind depends on whether *we* are worrying about lab errors in the next room.

  **C:** And you're telling me the truth about S's mind depends on the patient's blood pressure. Both sound crazy. But mine respects the linguistics of "knows." Yours respects the psychology of action. We're just disagreeing on whether "knows" is an action-norm or a semantic predicate.

  **E:** And until you can explain why S should act on a "true" knowledge claim that rationality forbids, your semantics is empty.

  **C:** And until you can explain how practical stakes alter evidence without altering evidence, your encroachment is just a category mistake.

  ***

  **[Dialogue Ends]**
