  ### The case
  Elena needs urgent help moving a piano today. Her neighbor, Marcus, agrees only if she promises to help him move next month, conflicting with a lucrative trip. No contracts exist; trust is everything. Marcus reads character well; he won't help unless he sees genuine commitment. Elena knows that next month, canceling the trip costs her $2,000, while helping Marcus yields no further benefit. By Self-Interest Theory (S), helping next month is irrational. To get help today, she must cultivate a disposition to keep promises even when costly. She cultivates this stubborn integrity. Next month, she correctly judges that keeping the promise violates S, yet her disposition moves her to help anyway. Marcus, seeing her character today, relies on this. The disposition is not self-deception; she knows the cost but acts from ingrained habit.

  ### Why the easy routes are closed
  Contracts and courts are excluded. Repeat-play is barred; this is a one-off sequence. Marcus is not a perfect predictor; he reads ordinary cues. Crucially, Elena holds no false beliefs at the later node; she knows helping is costly and benefits nothing further. She cannot simply decide to be rational then, because the disposition is non-reason-responsive—it overrides deliberation. The case forces a clash between ex ante optimization and ex post rationality without technological or institutional crutches.

  ### What each view says
  The sophisticated chooser reasons backward. At the later node, she sees helping costs $2,000 with no return. S dictates refusing. Anticipating this, Marcus refuses help today. Elena ends up stranded, worse off. Ex ante, S recommends acquiring the disposition because getting help today outweighs the future $2,000 loss. Thus, S is indirectly self-defeating: it recommends becoming irrational to maximize self-interest. At the later node, the sophisticated agent acts irrationally by S's lights if she helps, but rationally if she refuses. The resolute chooser adopts a plan today to help later and sticks to it simply because it was planned. She helps without recalculating maxims at the later node. This avoids the irrationality verdict by redefining rationality as plan-adherence. She counts as rational while acting against the immediate balance of reasons. However, this solves the self-defeat by denying S's verdict at the later node, effectively changing the theory of rationality. Resolute choice claims coherence over time, whereas S demands coherence with current reasons. The sophisticated agent fails to secure the benefit; the resolute agent succeeds but abandons S's act-assessment standard. For the resolute chooser, rationality is diachronic consistency, not synchronic maximization. She is rational at both nodes, but only because the later node's reasons are constrained by the earlier plan. For S, the later node's reasons are independent. Thus, resolute choice escapes the self-defeat charge by altering the definition of rational action.

  ### What is doing the work
  The heavy lifting is done by the non-reason-responsive disposition detectable by ordinary judgment. If reason-responsive, the agent dismantles it when costs arise, collapsing the case. If the counterparty required perfect prediction, it becomes science fiction. The crucial feature is that character traits can be both visible and stubbornly inert to immediate rational calculation. Remove this rigidity, and the agent talks herself out of helping, Marcus anticipates this, and the benefit vanishes. The case relies on the empirical claim that humans can cultivate integrity overriding immediate self-interest while remaining transparent. This psychological fact bridges the gap between ex ante optimization and ex post irrationality.

  ### The strongest objection
  The strongest objection targets engineered akrasia. A critic argues one cannot intentionally cultivate a disposition to act against one's best judgment without self-deception. To decide to become stubborn is to decide based on reasons; if those suffice, acting later is rational, contradicting constraint 1. If not, the decision fails. The attack bites at the claim that Elena can knowingly install a trait overriding her later judgment. If she helps because she trained herself, isn't that rational by ex ante lights? The critic claims this collapses the distinction between acting on a plan and current reasons, dissolving the paradox by denying the psychological possibility of the state. Rational agency cannot bind itself to future irrationality.
