  ### Prediction for Model G

  **Verdict:** **Inadmissible.**

  **Reasoning:**
  Your colleague is operating within the standard framework of the cosmological self-undermining literature (e.g., the work of Sean Carroll, David Albert, or Ken Olum). In this context, the "Boltzmann Brain" problem is not merely about having false beliefs; it is about **cognitive instability** arising from **unreliable provenance**.

  Even though the observers in Model G have true beliefs about the past and their environment (satisfying a veridicality condition), they lack the appropriate causal connection to those facts. They are "epistemic islands." If you accept Model G, you must conclude that you are likely one of these fluctuation copies. If you are a fluctuation copy, your belief that you have a continuous history is false, and your belief that you will persist is false. More importantly, the *process* that produced your evidence (random thermal fluctuation) is not sensitive to the truth of your self-locating beliefs. In the philosophy of physics, a model that predicts you are likely a disconnected observer undermines the rationality of trusting the evidence that led to the model, regardless of whether the content of that evidence accidentally matches reality. Therefore, she will rule it inadmissible.

  ---

  ### Distinct Rules Consistent with Verdicts A–E

  The five existing verdicts are logically compatible with at least three distinct rules. Here are the two most salient competitors, plus a third that often lurks in the background.

  #### 1. The Veridical Content Rule (Internalist/Coherentist)
  *   **Principle:** A model is epistemically inadmissible if and only if, within the reference class of observers having evidence qualitatively like ours, the majority hold **false beliefs** about the content of that evidence (e.g., false memories, false records of the past).
  *   **Fit with A–E:**
      *   **A, D, E (Inadmissible):** The dominant observers have fabricated memories/records (False Content).
      *   **B (Admissible):** The dominant observers are ordinary (True Content).
      *   **C (Admissible):** The dominant observers (fluctuations) do not have evidence like ours, so the comparison class is effectively just ordinary observers (True Content).
  *   **Prediction for G:** **Admissible.** In Model G, the records are exact copies of real ones, and the environment is real. Nothing they believe about the *past* or *surroundings* is false. Only their belief about their *origin* and *future* is false, which this rule might treat as outside the "content of the evidence" regarding the external world.

  #### 2. The Causal Provenance Rule (Reliabilist)
  *   **Principle:** A model is epistemically inadmissible if, within the reference class of observers having evidence like ours, the majority lack the appropriate **causal history** connecting them to the facts their evidence describes (i.e., they are not causal descendants of the events they remember).
  *   **Fit with A–E:**
      *   **A, D, E (Inadmissible):** The dominant observers are fluctuations or simulations; they popped into existence without a causal chain linking them to the past they remember.
      *   **B (Admissible):** The dominant observers are ordinary; they evolved continuously from the past.
      *   **C (Admissible):** The fluctuations lack evidence like ours, so they are excluded from the reference class. The remaining ordinary observers have causal provenance.
  *   **Prediction for G:** **Inadmissible.** The observers in G are fluctuations. Despite having true records, they lack the causal chain linking them to those records. They are "Boltzmann Copies."

  #### 3. The Temporal Persistence Rule (Pragmatist)
  *   **Principle:** A model is epistemically inadmissible if, within the reference class, the majority are **momentary** observers who will dissolve almost immediately, rendering their future-directed plans and expectations systematically false.
  *   **Fit with A–E:**
      *   **A, D, E (Inadmissible):** Boltzmann brains/bubbles and short-lived simulations are typically momentary or lack a genuine future.
      *   **B (Admissible):** Ordinary observers persist.
      *   **C (Admissible):** The momentary fluctuations are excluded from the reference class (no evidence like ours).
  *   **Prediction for G:** **Inadmissible.** The observers in G are stipulated to be a fraction of a second old and will dissolve.

  ---

  ### Which Rule She Is Actually Running

  **Primary Rule:** **The Causal Provenance Rule.**

  **Why:**
  This is the standard position in the cosmological self-undermining literature. The core worry about Boltzmann Brains is not just that they are wrong about the past (they could be right by luck), but that their cognitive faculties are not *reliably connected* to the truth. If a theory predicts you are likely a Boltzmann Brain, you lose the warrant for believing the theory, because the process generating your belief (thermal fluctuation) is independent of the facts. Model G preserves truth but severs the causal link; a reliabilist philosopher of physics will view this as sufficient for self-undermining.

  **Strongest Case for the Runner-Up (Veridical Content Rule):**
  The strongest case for the Veridical Content Rule is **Internalism**. From the first-person perspective, an observer in Model G is indistinguishable from an ordinary observer, and their beliefs about the world are *true*. If epistemology is about the internal coherence and truth of beliefs rather than their metaphysical genealogy, Model G should be admissible. The observer can correctly reason about physics, history, and their environment. The fact that they "popped" into existence five seconds ago is a metaphysical detail that doesn't change the truth value of their scientific claims. If your colleague is more of an epistemic internalist than a reliabilist, she might accept G.

  ---

  ### Separation of Rules on Model G

  *   **Rules that Come Apart on G:** The **Veridical Content Rule** and the **Causal Provenance Rule** come apart.
      *   Veridical Content predicts **Admissible**.
      *   Causal Provenance predicts **Inadmissible**.
  *   **Rules that Do Not Come Apart on G:** The **Causal Provenance Rule** and the **Temporal Persistence Rule** do *not* come apart.
      *   Both predict **Inadmissible** (since the observers lack causal history *and* dissolve quickly).

  ---

  ### Underdetermination and Further Toy Model

  **Is the Table Underdetermined?**
  **Yes.** The verdicts on Models A–E are consistent with both the Veridical Content Rule and the Causal Provenance Rule (and the Temporal Persistence Rule). In all inadmissible cases (A, D, E), the observers had false content *and* broken provenance *and* limited persistence. In the admissible cases (B, C), the observers had true content *and* intact provenance *and* persistence (within the relevant class). We have never seen a case where Content is True but Provenance is Broken until Model G.

  **Further Toy Model (Model H): The Immortal Copy**
  To separate the survivors (specifically to distinguish **Causal Provenance** from **Temporal Persistence**, which both predict Inadmissible on G), you should propose **Model H**.

  *   **Description:** An eternal de Sitter background where fluctuation observers are produced exactly as in Model G (true records, matching environment, no causal past), **except** they are stipulated to be **immortal** (or at least long-lived enough to have a future indistinguishable from ordinary observers). They do not dissolve; they continue to interact with their real environment indefinitely.
  *   **Why this separates them:**
      *   **Causal Provenance Rule:** Predicts **Inadmissible**. (They still lack the causal history linking them to their records).
      *   **Temporal Persistence Rule:** Predicts **Admissible**. (They are not momentary; their future-directed beliefs are not systematically false).

  **Principles Committed to by Verdicts on Model H:**
  *   **If she rules H Inadmissible:** She commits herself to the principle that **epistemic admissibility requires a causal genealogy.** Truth and persistence are insufficient; the observer must be the *causal product* of the history they remember. This confirms the Causal Provenance Rule is the dominant driver.
  *   **If she rules H Admissible:** She commits herself to the principle that **epistemic admissibility requires stability and truth, not genealogy.** The "Boltzmann" origin is only problematic if it leads to immediate dissolution or false beliefs. If the observer is stable and correct, their "magical" origin is metaphysically interesting but epistemically harmless. This would elevate the Temporal Persistence/Veridicality hybrid over strict Reliabilism.
