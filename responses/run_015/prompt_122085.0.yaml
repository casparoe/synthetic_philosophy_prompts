answer: |-
  **Project Title:** Rank-Dependent Moral Weight: Re-evaluating the Leveling-Down Objection and the Stability of Prioritarianism

  **1. Statement of the Research Question**
  Prioritarianism holds that we should give greater weight to benefits affecting the worse off. The standard defense against the Leveling-Down Objection (LDO)—the claim that equality is valuable even if it makes everyone worse off—is that prioritarianism values absolute welfare levels, not relative equality. Consequently, leveling down reduces total moral value because absolute welfare decreases.

  This project challenges the stability of that defense. I argue that by anchoring moral weight to *absolute* welfare levels, standard prioritarianism renders moral recommendations unstable under uniform translations of the welfare scale (the "zero-point problem"). If moral weight depends on absolute levels, shifting the baseline of measurement (e.g., from Kelvin to Celsius, or redefining the subsistence line) alters the distribution of moral priority without changing the underlying reality.

  The central research question is: **Can a rank-dependent prioritarianism, where moral weight is determined by an individual's position within a dynamically defined reference class rather than absolute welfare, resolve the measurement instability of standard prioritarianism without succumbing to the Leveling-Down Objection?**

  Specifically, I will investigate whether shifting from absolute weighting to rank-weighting transforms the LDO from a decisive refutation into a manageable constraint, or if it collapses the view into a form of egalitarianism that lacks the prioritarian advantage of avoiding the "repugnant conclusion" of leveling down.

  **2. Theoretical Context: Why the Standard Framing is Insufficient**
  Derek Parfit's original formulation of prioritarianism successfully distinguished the view from strict egalitarianism by emphasizing absolute gains. However, this framing leaves the *metric* of welfare underspecified. In social choice theory and welfare economics, measures based on absolute levels are vulnerable to "translation invariance" issues. If the priority weight function $f(w)$ is concave, the marginal moral value of a gain depends on where $w$ sits on the scale. If the zero-point of $w$ is arbitrary or context-dependent, the moral urgency of a policy intervention becomes arbitrary.

  The standard Parfit-style defense assumes a fixed, cardinal scale of welfare. By exposing this assumption, this project opens a gap: if we fix the scale instability by moving to rank-dependent weighting (similar to rank-dependent utility in economics), we risk making the view insensitive to absolute deprivation. If everyone's welfare drops by 50% but ranks remain constant, a pure rank-weighted view might register no moral loss. This project asks whether a hybrid model can be formalized that retains scale invariance while preserving sensitivity to absolute suffering, thereby refining the response to the LDO.

  **3. Work Plan (12 Months)**

  *   **Months 1–3: Conceptual Analysis and Literature Synthesis**
      *   Refine the distinction between "absolute instability" and the "leveling-down objection."
      *   Map existing rank-dependent views in social choice theory (e.g., Yaari's dual theory) against philosophical prioritarianism.
      *   Define the "dynamic reference class": Is rank determined globally, locally, or relative to a sufficiency threshold?
      *   *Deliverable:* A working paper outlining the conceptual framework and defining the specific formal gap in current prioritarian literature.

  *   **Months 4–6: Formal Modeling**
      *   Construct a formal axiomatic model of Rank-Weighted Prioritarianism (RWP).
      *   Test the model for translation invariance: Does shifting the welfare scale $w \to w + k$ alter moral rankings in RWP compared to standard prioritarianism?
      *   Test for "Leveling-Down Sensitivity": Does RWP assign negative value to uniform downward shifts that preserve rank?
      *   *Deliverable:* A technical appendix containing the formal proofs and axiomatic characterization.

  *   **Months 7–9: Case Testing and Objection Handling**
      *   Apply the model to classic thought experiments (e.g., The Sadist's Gain, The Mere Addition Paradox).
      *   Specifically test the "Absolute Deprivation Objection": If ranks stay the same but everyone starves, does RWP fail to register a crisis?
      *   Explore hybrid solutions: Can absolute thresholds constrain rank-weighting?
      *   *Deliverable:* Draft of the core argument section, addressing counter-arguments from both egalitarian and utilitarian perspectives.

  *   **Months 10–12: Writing, Dissemination, and Policy Translation**
      *   Complete the full manuscript for journal submission.
      *   Draft a non-technical policy brief summarizing the implications for welfare measurement.
      *   Present findings at two graduate workshops or conferences.
      *   *Deliverable:* Final manuscript ready for submission and a public-facing summary.

  **4. Criteria for Project Failure**
  Intellectual honesty requires defining what constitutes a negative result. This project would be considered unsuccessful if:
  1.  **Triviality:** The formalization of rank-dependent weighting collapses into standard prioritarianism or strict egalitarianism under plausible constraints, offering no novel theoretical ground.
  2.  **Fatal Normative Implications:** The model demonstrates that rank-dependence necessarily implies indifference to absolute universal decline (e.g., a world where everyone is tortured is morally equivalent to a world where everyone is happy, provided ranks are identical). If no hybrid constraint can fix this without re-introducing scale instability, the core hypothesis fails.
  3.  **Incoherence:** The concept of a "dynamically defined reference class" proves logically incoherent when applied to intergenerational or global justice contexts where the "population" is ill-defined.

  Even in failure, the project yields value by formally proving the limits of rank-based approaches in normative ethics.

  **5. Assessment of Scope**
  This is a focused, high-risk/high-reward project. It does not aim to construct a complete theory of justice or solve the measurement problem of welfare generally. It restricts itself to the *weighting function* of prioritarianism. The scope is manageable for one year because it leverages existing formal tools from social choice theory rather than building new mathematics from scratch. However, the risk lies in the philosophical interpretation of the formal results; bridging the gap between axiomatic properties and normative intuition requires careful argumentation to avoid technical irrelevance.

  **6. Relevance Beyond Philosophy**
  While this inquiry is grounded in normative ethics, the results have direct implications for economists and policymakers working on distributive justice.
  *   **Metric Robustness:** Policymakers often toggle between absolute poverty lines (e.g., $2.15/day) and relative measures (e.g., bottom 10%). This project provides an ethical justification for when and why rank-sensitive metrics (like the Gini coefficient or percentile-based targeting) are morally preferable to absolute aggregates.
  *   **Policy Stability:** If moral weight is sensitive to arbitrary zero-points, policy recommendations may fluctuate based on how data is normalized. A rank-stable ethical framework offers more robust guidance for long-term planning, particularly in contexts of inflation, currency fluctuation, or changing baseline expectations.
  *   **Inequality vs. Poverty:** The project clarifies the ethical trade-off between reducing inequality (rank) and increasing absolute welfare. This helps practitioners articulate why a policy might be desirable even if it doesn't improve the absolute lot of the worst-off, or conversely, why absolute gains might trump relative standing in crisis scenarios.

  By formalizing the ethical weight of "position" versus "amount," this fellowship will produce a framework usable by both moral philosophers and social scientists designing algorithms for resource allocation.
