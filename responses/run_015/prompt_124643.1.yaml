answer: |-
  **Question**

  Hilbert's Hotel is often cited to argue that actual infinities are metaphysically impossible because they entail absurdities, such as accommodating new guests in a full hotel. In statistical physics, however, the 'thermodynamic limit' (infinite volume and particle number) is routinely employed. While finite systems have smooth thermodynamic functions, genuine phase transitions (non-analyticities) appear only in this infinite limit. Physicists treat this infinity as an idealization of finite systems, yet it represents phenomena finite models cannot.

  Critically assess whether the thermodynamic limit undermines the Hilbert's Hotel argument against actual infinities. Does the physicist's successful use of infinity show that such paradoxes are artifacts of misapplying finite intuitions (supporting realism), or does it confirm infinities are merely instrumental idealizations (supporting finitism)?

  In your answer, distinguish between mathematical existence, procedural executability, and physical realizability. Conclude by stating what a finitist physicist must deny, or what a realist must explain regarding the difference between hotel guests and spin lattices. Do not merely recount the Hotel story.

  ***

  **Model Answer**

  The argument from Hilbert's Hotel against actual infinity relies on conflating three distinct senses of "impossible." Mathematically, a bijection between the original guests and the guests-plus-newcomer exists; there is no contradiction in set theory (Dedekind infinity). The impossibility is procedural: in a sequential move variant, there is no first step to empty a room. However, the metaphysical weight usually rests on physical realizability: no finite agent can execute infinitely many tasks, nor does infinite matter exist. The paradox arises only if we demand a physical system behave like a finite hotel while possessing infinite extent.

  The thermodynamic limit (TL) in statistical physics presents a nuanced counterpoint. For any finite number of particles $N$, the partition function is a finite sum of analytic terms, making free energy smooth. True phase transitions—sharp non-analyticities—mathematically require $N \to \infty$. Physicists use this infinite model to predict behavior in finite systems (like water boiling) with high precision. This suggests the infinite model captures emergent structure lost in finite descriptions.

  Does this support realism about infinity? A realist might argue that since the infinite model explains phenomena the finite model cannot (the sharpness of the transition), the infinity is not merely shorthand but captures physical reality. The Hotel paradox, on this view, results from applying finite mereology (the part-whole principle) to infinite collections, just as applying finite thermodynamics to infinite lattices fails.

  However, the finitist has a stronger instrumentalist reading. The TL is explicitly defined as a limit of finite systems. The non-analyticity is a mathematical feature of the limit, not a claim that infinite matter exists. The infinity is a tool to simplify calculations regarding large finite numbers. If this is the case, the Hotel story remains a valid caution: treating the limit object as a physically existing system (expecting to measure infinite energy) leads to errors. The TL works because it approximates finite systems, not because infinite hotels are coherent.

  The crucial distinction lies in representational success versus ontological commitment. The TL succeeds representationally without requiring ontological infinity. Therefore, the Hotel argument stands if interpreted as a claim about physical realizability (sense c). A finitist physicist need not deny the utility of the TL, but must deny that the infinite lattice exists independently of the limit process. Conversely, a realist must explain why the Hotel's physical impossibility (infinite matter/energy) does not apply to the lattice. Given that lattices also require infinite matter, the realist must argue that phase transitions are emergent properties only definable at infinity, whereas "fullness" is not. Ultimately, the TL supports instrumentalism: infinities are indispensable fictions for describing finite nature, not evidence that Hilbert's Hotel could be built.

  ***

  **Marking Scheme (25 Marks)**

  **1. Analysis of Hilbert's Hotel "Impossibility" (5 marks)**
  *   **Must hit:** Distinguish between mathematical bijection (possible), procedural execution (problematic), and physical realizability (impossible). Identify that standard arguments often conflate these.
  *   **Common error:** Retelling the Hotel story without analyzing the *type* of impossibility; claiming the bijection itself is mathematically impossible.

  **2. Dedekind Infinity and Part-Whole Principle (5 marks)**
  *   **Must hit:** Note that the Hotel illustrates Dedekind infinity (whole equinumerous with proper subset). Acknowledge that the argument against infinity often rests on rejecting this counter-intuitive property.
  *   **Common error:** Failing to mention Dedekind infinity or the part-whole principle; treating the paradox as purely logical rather than conceptual.

  **3. Explanation of Thermodynamic Limit Physics (5 marks)**
  *   **Must hit:** Correctly state that finite systems have analytic free energies; sharp transitions require the infinite limit. Acknowledge the limit is treated as an idealization of finite systems.
  *   **Common error:** Vague gestures at "densities" without mentioning analyticity/non-analyticity; claiming finite systems have sharp transitions identical to infinite ones.

  **4. Comparison: Instrumentalism vs. Realism (5 marks)**
  *   **Must hit:** Evaluate whether TL supports realism (infinity explains reality) or instrumentalism (infinity is a useful tool). Connect this back to the Hotel case.
  *   **Common error:** Asserting the analogy holds without arguing *why*; claiming TL proves actual infinities exist physically without qualification.

  **5. Conclusion: Commitments of Finitist/Realist (5 marks)**
  *   **Must hit:** Clearly state what position the candidate defends. E.g., Finitist must deny ontological status of limit; Realist must explain physical difference between lattice and hotel.
  *   **Common error:** Sitting on the fence without specifying consequences; concluding "both are right" without resolving the tension.

  ***

  **Examiner's Note**

  I am highly confident in the philosophical distinction drawn between instrumentalism and realism here. The physics sketch is standard statistical mechanics (Yang-Lee theory), but I am less confident in the claim that finite systems *never* exhibit sharp transitions. In practice, finite-size scaling shows precursors that are experimentally indistinguishable from singularities. If a candidate argues that finite systems *do* have transitions for all practical purposes, they should be credited provided they note the mathematical distinction remains. The question relies on the strict mathematical definition of a phase transition; if this is contested in the course, the preamble should be adjusted to specify "mathematically sharp" transitions.
