answer: |-
  Here is the translation of the game-theoretic apparatus into your MARL pipeline vocabulary, followed by the residue report and the verdict on your "support problem."

  ### Part 1: The Pipeline Translation (IESDS as League Pruning)

  Imagine your league of frozen checkpoints is not just a training curriculum, but a payoff matrix. You want to prune this league before the next training cycle to reduce compute and focus on viable contenders.

  **1. The Setup (Normal Form Reduction)**
  *   **GT:** A finite game with players, actions, and payoff functions.
  *   **MARL:** You fix a set of $N$ frozen policies (checkpoints) for each player slot. You evaluate all permutations of these policies against each other to build an empirical payoff tensor (e.g., expected return or win-rate).
  *   **Epistemic Assumption:** "Common Knowledge of Rationality." In your pipeline, this translates to: **Assume no agent in the active training loop will ever sample a policy that is provably sub-optimal against the current league.**

  **2. Strict Dominance (The Pruning Criterion)**
  *   **GT:** Strategy $s_i$ is strictly dominated if there exists another strategy (or mixture) $\sigma_i$ such that $U(\sigma_i, s_{-i}) > U(s_i, s_{-i})$ for all opponent profiles $s_{-i}$.
  *   **MARL:** A checkpoint $P_{old}$ is marked for deletion if there exists a **stochastic meta-policy** $P_{mix}$ (which samples from a subset of *other* frozen checkpoints in the league) such that $P_{mix}$ achieves a higher expected return than $P_{old}$ against **every single opponent checkpoint** currently in the league, with a margin $\epsilon > 0$.
  *   **Note:** It is not enough to beat the average opponent. It must beat the *worst-case* opponent in the current active set.

  **3. Mixed Dominators (The Support)**
  *   **GT:** The dominating strategy $\sigma_i$ can be a probability distribution over pure strategies.
  *   **MARL:** The dominator is not necessarily a single trained checkpoint. It can be a uniform (or weighted) sampler over a subset of $k$ other checkpoints. You are effectively asking: "Can a distillation of these $k$ models outperform $P_{old}$ in all matchups?"

  **4. Iteration (The Loop)**
  *   **GT:** Remove dominated strategies. Update the game matrix (remove rows/cols). Repeat until no more strategies can be removed.
  *   **MARL:**
      1.  Evaluate all-vs-all.
      2.  Identify checkpoints strictly dominated by mixtures of surviving checkpoints.
      3.  **Hard Delete** them from the league.
      4.  Recompute dominance relations on the *reduced* league (since the "worst-case opponent" set has shrunk, some previously safe checkpoints might now be dominated).
      5.  Stop when the league stabilizes.
      6.  Initialize the next training phase using only the surviving checkpoints as the population.

  ---

  ### Part 2: The Residue Report

  Here is what breaks when you try to run Game Theory (GT) code on a MARL engine.

  **1. What Translates Cleanly**
  *   **Pure Strategies $\leftrightarrow$ Frozen Checkpoints:** This is a 1:1 map. A deterministic policy is a pure strategy.
  *   **Mixed Strategies $\leftrightarrow$ Stochastic Samplers:** A mixed strategy in GT is mathematically identical to a policy that samples actions (or sub-policies) from a categorical distribution.
  *   **Payoff $\leftrightarrow$ Expected Return:** $U(s)$ maps directly to $E[\sum \gamma^t r_t]$.

  **2. What I Had to Fudge**
  *   **The "Mixed" Definition:** In GT, a mixed strategy is a *solution concept* (often making opponents indifferent). In MARL, a stochastic policy is usually an *exploration mechanism* (entropy regularization).
      *   *The Fudge:* When I described the "mixed dominator" above as sampling checkpoints, that is valid. But if you mean a single neural network outputting a softmax over actions: GT assumes the randomness is *strategic* (I mix to protect myself). MARL assumes randomness is *exploratory* (I mix to learn). If you turn temperature to zero in MARL, you get a pure strategy. In GT, turning probability to 0 or 1 collapses the equilibrium.
  *   **Strict Inequality vs. Confidence Intervals:** GT requires $U(\sigma) > U(s)$ strictly. In MARL, you have sampling noise. You never know if $P_{mix}$ is truly better than $P_{old}$ or just won the seed lottery. You have to fudge this with statistical significance testing (e.g., bootstrapped confidence intervals). If the intervals overlap, GT says "no dominance," MARL says "keep training."

  **3. What Has No Counterpart**
  *   **Common Knowledge:** GT assumes Player A knows Player B knows Player A is rational. In MARL, you have **non-stationarity**. You don't know if the opponent is rational; you know they are a gradient descent process that might be stuck in a local optimum playing a dominated strategy for another 10k steps.
  *   **Partial Observability:** IESDS is defined on Normal Form games (matrices). Your trading game is likely a POMDP. A "strategy" in GT is a complete plan of action for every history. In MARL, a policy is a function approximator over observations. Pruning "actions" in a POMDP is pruning regions of the observation-action space, which is topologically complex, not just deleting a row in a matrix.

  ---

  ### Part 3: The Verdict on the "Support Problem"

  You asked: *The randomisation that does the dominating can lean on actions that a later round of deletion removes, so the dominator decays, and what survives depends on the order you delete in. Is this real?*

  **Commitment:** **No, the support problem is not genuine for Strict Dominance.** You have misread the theorem, though your intuition is excellent for *Weak* Dominance.

  **The Logic (in your vocabulary):**
  Let's say Checkpoint $A$ is dominated by a mixture $\sigma = 0.5 B + 0.5 C$.
  Later, you find that Checkpoint $B$ is dominated by a mixture $\sigma' = 0.5 D + 0.5 E$.
  You worry that since $B$ is deleted, $\sigma$ is now broken, and maybe $A$ should survive.

  **Why you are wrong:**
  Dominance is transitive. If $B$ is strictly worse than $\sigma'$, then any mixture containing $B$ is strictly worse than the same mixture where $B$ is replaced by $\sigma'$.
  You can construct a new mixture $\sigma_{new}$ that substitutes $\sigma'$ wherever $B$ appeared in $\sigma$.
  Mathematically:
  $$U(A) < U(\sigma) = 0.5 U(B) + 0.5 U(C)$$
  Since $$U(B) < U(\sigma')$$
  Then $$U(A) < 0.5 U(\sigma') + 0.5 U(C)$$
  The new dominator $\sigma_{new}$ relies only on $\{C, D, E\}$. $B$ is gone, but the dominance relation holds. The "support" shifts, but the inequality remains strict.

  **The Order Independence Theorem:**
  For **Strict** Dominance (even by mixed strategies), the order of elimination **does not matter**. The set of surviving strategies (Rationalizable Strategies) is unique. Whether you delete $A$ first or $B$ first, you end up with the same final league.

  **Where your intuition is right:**
  Your "Support Problem" is real for **Weak** Dominance (where payoffs are $\geq$ instead of $>$). If $B$ is only *equal* to $\sigma'$ in some matchups, substituting them can break the dominance chain. In Weak Dominance, order *does* matter, and you can delete Nash Equilibria by mistake.
  Also, your intuition is real for **Noisy Estimates**. If your payoff matrix is estimated via rollouts, and you delete $B$ because it looked slightly worse than $\sigma'$, but it was actually noise, then substituting $\sigma'$ might actually make the dominator worse than $A$. In empirical MARL, the "Support Problem" is a numerical stability issue, even if it's not a theoretical one.

  ---

  ### Part 4: Which Framework is Poorer?

  You asked me to commit: if one framework can say something the other can't, which is the poorer one?

  **On the specific question of pruning logic:**
  **MARL is the poorer framework.**
  Game Theory provides a rigorous guarantee (Order Independence of IESDS) that your intuition suspected was broken. Your MARL background biases you toward "training dynamics matter" (order of updates, curriculum), but this is a static property of the payoff structure. GT sees the landscape; MARL sees the hike. On the map, the peak is in one place. GT is right.

  **On the utility of the operation:**
  **Game Theory is the poorer framework.**
  Here is the hard truth: **Iterated Elimination of Strictly Dominated Strategies is almost useless for modern MARL training.**

  1.  **If a strategy is strictly dominated,** a competent RL algorithm (with sufficient capacity and exploration) should *never* learn it in the first place, or should unlearn it quickly via self-play. Pruning it manually saves you evaluation compute, but not training compute.
  2.  **If the game is non-transitive (Rock-Paper-Scissors style),** *nothing* is strictly dominated. IESDS reduces the game by zero. Your trading game likely has cycles (momentum vs. mean-reversion vs. breakout). IESDS will leave the whole messy league intact.
  3.  **The "Mixed" requirement is computationally prohibitive.** To check if a checkpoint is dominated by a *mixture* of other checkpoints, you have to solve a Linear Program for every checkpoint you consider deleting. In GT, this is fine (matrix is small). In MARL, your league has hundreds of checkpoints. Running an LP solver over the payoff matrix of 100 checkpoints to decide whether to delete one is often more expensive than just letting the RL algorithm ignore it naturally.

  **Final Call:**
  Your "Support Problem" is a theoretical false alarm (GT wins on logic). But your instinct that "pruning is tricky and maybe not worth it" is practically correct (MARL wins on utility).

  Don't implement IESDS as a preprocessing step. It assumes exact payoffs and static opponents. Instead, use **Population Based Training (PBT)** or **Fictitious Play** dynamics where dominated strategies naturally lose sampling weight in the league. Let the gradient flow do the elimination; it's robust to the noise that breaks the GT assumptions.
