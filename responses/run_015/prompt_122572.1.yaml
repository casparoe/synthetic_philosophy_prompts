  A theorist friend told me you can shrink a game by repeatedly deleting strategies that are strictly dominated, where the thing doing the dominating is allowed to be a randomisation over that player's own surviving strategies rather than a single action. I get the appeal as a pre-prossessing step before training, but I think I've spotted a wrinkle: the randomisation that does the dominating can lean on actions that a later round of deletion removes, so the dominator decays, and what survives depends on the order you delete in. I've started calling this the support problem and I want to know whether it's real or I've misread something.

