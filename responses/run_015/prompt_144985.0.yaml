      *   **Context:** A small city heritage board deciding on "historical significance" for tax breaks/demolition delays.
      *   **Problem:** The term is vague; current process is unstructured arguing until exhaustion.
      *   **Goal:** Create a 30-minute practical decision procedure based on the philosophical distinction between *Epistemicism* (hidden sharp cutoff) and *Supervaluationism* (admissible precisifications/super-truth).
      *   **Constraints:**
          *   Must keep the philosophical difference intact (not just "we're unsure").
          *   Must include ordered questions, stopping conditions (Yes/No/Indeterminate), and hand-off points for value judgments.
          *   Must flag where the procedure misfires or yields unpopular results.
          *   Must include test conditions/sentences.
          *   Must run the procedure on three specific cases (1923 Courthouse, 1978 Parking Garage, 1999 Community Center).
          *   One case must produce an unpopular result.
          *   Must explain what the procedure *cannot* do (limitations).

  2.  **Deconstruct the Philosophy for Practical Use:**
      *   *Epistemicism:* There *is* a fact of the matter about whether a building is significant, even if we don't know it. It implies we should dig for hidden facts (dates, architects, events) until we hit a threshold. If we can't find the fact, it's still either true or false, just unknown.
      *   *Supervaluationism:* "Significant" is vague. There are many ways to make it precise (precisifications). If a building is significant on *all* admissible precisifications, it's "Super-True" (Yes). If it's significant on *none*, it's "Super-False" (No). If it varies depending on the precisification, it's a "Gap" (Indeterminate).
      *   *Integration:* The procedure needs to first try to find the "Epistemic Fact" (hard criteria). If that fails, move to "Supervaluation" (testing against different reasonable definitions). If that yields a Gap, admit it's a value judgment, not a fact-finding mission.

  3.  **Drafting the Procedure (The "Heritage Vagueness Protocol"):**
      *   *Time Limit:* 30 mins. Needs to be tight.
      *   *Phase 1: Epistemic Search (The "Hard Facts" Phase).* Look for criteria that *must* be met. If missing -> No. If present -> Move on. This respects the idea that there might be a hidden threshold of objective merit.
      *   *Phase 2: Supervaluation Testing (The "Admissible Definitions" Phase).* Define 3 distinct "precisifications" (e.g., Age, Architectural Integrity, Cultural Event). Test the building against all three.
          *   Passes all 3? -> Super-True (Yes).
          *   Fails all 3? -> Super-False (No).
          *   Mixed? -> Gap (Indeterminate).
      *   *Phase 3: The Gap Handling.* If Indeterminate, acknowledge this is not a fact problem but a policy/value problem. Vote based on community benefit, not "significance."

  4.  **Refining the Philosophical Integrity:**
      *   *Crucial Distinction:* I need to make sure the board understands that Phase 1 assumes there *is* a right answer we can find. Phase 2 assumes there *isn't* one right answer, but rather a range of acceptable definitions. Phase 3 admits that sometimes "significance" is the wrong question; it's actually about "what do we want to keep?"
      *   *The "Misfire":* The procedure will misfire when the board *wants* a factual answer for a value problem. It forces them to admit they are making policy, not finding history. This will be unpopular.

  5.  **Developing Test Conditions:**
      *   Need simple sentences to apply.
      *   Example: "Is it older than X?" "Is it the only one of its kind?"

  6.  **Running the Cases:**
      *   *Case 1: 1923 Courthouse.* Old, agreed upon. Should pass Phase 1 or 2 easily. Result: Yes.
      *   *Case 2: 1978 Brutalist Garage.* Splits the board. Likely fails Age (too new?) but passes Architectural Integrity (brutalism is trendy now). Result: Indeterminate/Gap. Forces value vote.
      *   *Case 3: 1999 Community Center.* Architect famous *later*. This is the tricky one. Epistemically, was it significant *then*? Supervaluationally, does retrospective fame count?
          *   *Strategy:* Let's make this one produce the "unpopular result." If the procedure says "No" because it fails the "Age" precisification, but the architect is now famous, preservationists will hate it. Or, if it says "Yes" based on retrospective fame, developers will hate it.
          *   *Better Unpopular Result:* The procedure declares it "Indeterminate" and forces a vote on *future utility* rather than *past significance*. This frustrates people who want a "historical" justification.
          *   *Actually, let's look at the prompt:* "Make sure one of these produces a result the board won't like."
          *   *Idea:* The 1999 Center. Epistemically, it wasn't significant *when built*. Supervaluationally, "Significance" usually implies time depth. If the precisifications require 50 years, it fails. If the board *wants* to save it, the procedure tells them "You can't call it historically significant honestly; you have to vote to save it as a *policy choice*." This removes the moral shield of "preserving history." That's unpopular.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, procedural, slightly philosophical but accessible.
      *   *Structure:* Introduction -> The Protocol -> Test Sentences -> Case Studies -> Limitations.
      *   *Check:* Did I distinguish Epistemicism vs. Supervaluationism?
          *   Epistemicism = Phase 1 (Searching for the hidden fact).
          *   Supervaluationism = Phase 2 (Testing across admissible definitions).
          *   Gap = Phase 3 (Value judgment).
      *   *Check:* Did I flag misfires? Yes, in the "Warning Labels" section.
      *   *Check:* Did I explain what it can't do? Yes, it can't justify demolition of borderline cases on *historical* grounds; it shifts the burden to *policy*.

  8.  **Final Review against Constraints:**
      *   30 minutes? Yes, the steps are timed.
      *   No philosophy degree? Yes, terms are translated to "Fact Hunt" and "Definition Test."
      *   Keep distinction intact? Yes, Phase 1 treats vagueness as ignorance; Phase 2 treats it as semantic flexibility.
      *   Test conditions included? Yes.
      *   Three cases run? Yes.
      *   Unpopular result? Yes (The 1999 Center gets labeled "Not Historically Significant" but saved via policy, which annoys purists).
      *   Limitations explained? Yes.

  9.  **Polishing:** Ensure the distinction between "We don't know the fact" (Epistemic) and "The fact depends on how we define the word" (Supervaluation) is clear in the instructions. *Self-Correction:* Make sure the "Epistemic" phase doesn't just look like "checking boxes." It needs to be framed as "Is there a hidden threshold we haven't found?" If we exhaust the search, we move to Supervaluation.

      *Refining the 1999 Case:* To make it truly unpopular, let's have the procedure rule it "Super-False" (No) because on *no* admissible precisification of "historical" does a 25-year-old building count, regardless of the architect. But the board *wants* to save it. The procedure forces them to admit they are subsidizing a *new* building, not preserving history. That's the friction.

      *Wait, let's adjust:* The prompt asks for a result the board won't like. If the board *wants* to save the 1999 center, but the procedure says "It is not historically significant," they have to vote to save it on *other* grounds. This strips them of the "Heritage" cover. That is the unpopular outcome.

      *Let's adjust the 1978 Garage:* This is the classic "borderline." It should land in the "Gap." This forces the value vote. This is where the procedure works as intended.
      *Let's adjust the 1999 Center:* This should be the "Super-False" (No) that feels wrong because the architect is famous. This highlights the "Epistemic" limit (it wasn't significant *then*) vs "Supervaluation" (no admissible definition of 'history' covers 25 years).

      *Actually, the prompt asks for "one of these produces a result the board won't like."*
      Let's make the 1978 Garage the one. The board is split. The procedure might force a "No" because it fails the "Age" precisification which is admissible, even if it passes "Style." If "Age > 50 years" is an admissible precisification, and the garage is 46 years old (1978 to 2024), it fails Super-Truth. It becomes "Indeterminate" or "False." If the procedure forces a "No" because it's not Super-True, preservationists will hate it.
      *Better:* The procedure declares the 1978 Garage "Indeterminate." The board *hates* this because they want a definitive answer. The procedure refuses to give one.
      *Best:* The procedure declares the 1999 Center "Not Significant" (Super-False). The board *wants* to save it because of the architect. The procedure says "You can't use the Heritage law for this." That's the unpopular result.

      *Let's finalize the plan:*
