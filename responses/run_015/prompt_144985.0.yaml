answer: |-
  # The Heritage Vagueness Protocol (HVP)
  **Time Limit:** 30 Minutes per Proposal
  **Goal:** Distinguish between *unknown facts* (Epistemic) and *semantic flexibility* (Supervaluation) to reach a decision or identify a value judgment.

  ## Part 1: The Procedure

  ### Phase 1: The Epistemic Search (10 Minutes)
  *Philosophical Basis: Epistemicism. Assumes there is a hidden fact of the matter about significance that we simply haven't found yet.*

  **Instruction:** The Board acts as investigators. We assume the building is either definitely significant or definitely not, and our job is to find the evidence that reveals the cutoff.

  **Question 1.1: The Hard Threshold Check**
  Does the building meet any statutory "hard" criteria (e.g., listed on National Register, designed by a architect with a documented federal landmark, site of a legally recognized event)?
  *   **Yes:** Stop. **Verdict: YES (Significant).**
  *   **No:** Proceed to 1.2.

  **Question 1.2: The Hidden Fact Hunt**
  Is there specific, discoverable evidence currently missing that would settle this? (e.g., "We don't know the architect," "We haven't verified the date.")
  *   **Yes:** Stop. **Verdict: CAN'T CALL IT (Table for Evidence).**
  *   **No:** (We have all the facts, but they still feel borderline). Proceed to Phase 2.

  **Warning:** If you argue here about whether the facts *should* matter, you are leaving Phase 1. Stop arguing values.

  ### Phase 2: The Supervaluation Test (10 Minutes)
  *Philosophical Basis: Supervaluationism. Assumes "Significant" is vague. There are multiple "admissible precisifications" (reasonable definitions). We test if the building is significant across **all** of them.*

  **Instruction:** The Board agrees on three distinct "lenses" (precisifications) of significance. A building is **Super-True** (Yes) only if it passes all three. It is **Super-False** (No) only if it fails all three.

  **The Three Lenses (Select or adapt these):**
  1.  **Age/Scarcity:** Is it old enough that few remain? (e.g., >50 years AND <10% survival rate).
  2.  **Architectural Integrity:** Is it a pure example of its style, regardless of age?
  3.  **Cultural Association:** Is it tied to a specific community memory or person?

  **Question 2.1: Apply the Lenses**
  *   **Passes All 3:** Stop. **Verdict: YES (Super-True).**
  *   **Fails All 3:** Stop. **Verdict: NO (Super-False).**
  *   **Mixed Result (Passes some, fails others):** Proceed to Phase 3.

  ### Phase 3: The Gap Acknowledgement (10 Minutes)
  *Philosophical Basis: Truth-Value Gaps. The concept "Significant" does not apply here. This is not a fact problem; it is a policy problem.*

  **Instruction:** Admit that the building is neither historically significant nor historically insignificant. It is a **Borderline Case**.

  **Question 3.1: The Policy Handoff**
  Since "Historical Significance" cannot be truthfully asserted, are we willing to grant the tax break/delay based on *Future Community Value* instead of *Past History*?
  *   **Yes:** Vote on Community Value. **Verdict: YES (Policy Exception).**
  *   **No:** Vote on Strict History. **Verdict: NO.**

  ---

  ## Part 2: Test Conditions (Sentences for the Board)
  *Use these sentences to force clarity during the phases.*

  1.  **For Phase 1:** "Is there a document in existence that, if we found it, would make us all agree? If not, stop looking for facts."
  2.  **For Phase 2:** "If we define 'Historic' strictly as 'Pre-1950', does it pass? If we define it as 'Architecturally Unique', does it pass?"
  3.  **For Phase 3:** "Are we preserving this because it *was* important, or because we *want* it to be important?"

  ---

  ## Part 3: Warning Labels (Where This Misfires)

  1.  **The "Cowardice" Objection:** Phase 3 will feel like passing the buck. Board members will hate admitting they are making policy, not finding history. **This is a feature, not a bug.** It prevents lying about history to achieve policy goals.
  2.  **The "Rigidity" Objection:** Phase 2 may reject a beloved building because it fails one admissible lens (e.g., it's too new). This will cause public outrage. **The procedure cannot fix this.** It forces you to own the decision as a preference, not a historical truth.
  3.  **The "Epistemic Trap":** Do not linger in Phase 1. If you spend 20 minutes arguing about the quality of the brickwork, you are treating an aesthetic value as an epistemic fact. The Chair must cut this off.

  ---

  ## Part 4: Case Studies

  ### Case 1: The 1923 Courthouse
  *   **Phase 1:** Meets hard statutory criteria for age and public function. Evidence is complete.
  *   **Result:** **YES (Epistemic Fact).**
  *   **Board Reaction:** Satisfaction. The procedure confirmed what everyone felt.
  *   **Philosophical Note:** This was a "Sharp Cutoff" case. The vagueness was merely ignorance, now resolved.

  ### Case 2: The 1978 Brutalist Parking Garage
  *   **Phase 1:** No hard criteria met. All facts are known (architect, date, materials). No hidden document will change the date. Move to Phase 2.
  *   **Phase 2:**
      *   *Lens 1 (Age >50 yrs):* **FAIL** (It is 46 years old).
      *   *Lens 2 (Architectural Integrity):* **PASS** (Pristine Brutalist example).
      *   *Lens 3 (Cultural Association):* **FAIL** (Public hates garages).
      *   *Result:* Mixed.
  *   **Phase 3:** The Board must admit this is a **Gap**. It is not "Historically Significant" by the Super-Truth standard.
  *   **Decision:** The Board votes to save it based on *Architectural Rarity Policy*, not History.
  *   **Board Reaction:** Frustration. Half the board wanted to call it "Historic." The procedure forbade them from telling that truth.
  *   **Philosophical Note:** This is the procedure working correctly. It prevented a "Super-True" claim on a "Gap" object.

  ### Case 3: The 1999 Community Center (The Unpopular Result)
  *   **Context:** Designed by an architect who became famous in 2010. Building is 25 years old.
  *   **Phase 1:** No hard criteria. Facts are known. Move to Phase 2.
  *   **Phase 2:**
      *   *Lens 1 (Age >50 yrs):* **FAIL** (25 years).
      *   *Lens 2 (Architectural Integrity):* **PASS** (High integrity).
      *   *Lens 3 (Cultural Association):* **FAIL** (Association is retrospective, not contemporary to building).
      *   *Result:* Mixed/Leaning False.
      *   *Refinement:* Under strict Supervaluationism, if "Age" is an *admissible* precisification of "Historic," and the building fails it, it cannot be Super-True. If the Board agrees "Historic" *must* imply time depth, it fails all admissible precisifications regarding time.
      *   *Strict Ruling:* **NO (Super-False).**
  *   **Phase 3:** To save it, the Board must vote a *Policy Exception* for "Living Architects."
  *   **Board Reaction:** **Hostility.** Preservationists want to call it "Historic" to justify the tax break. The procedure says: *"You are lying if you call this history. It is a subsidy for contemporary art."*
  *   **Why they hate it:** It strips the moral authority of "Preservation" away from the decision. They have to admit they are subsidizing a new building, which taxpayers may resent.

  ---

  ## Part 5: What This Procedure Cannot Do

  1.  **It Cannot Justify Demolition on "Borderline" Grounds:** If a building lands in the Gap (Phase 3), this procedure does not tell you to demolish it. It tells you that *History* is silent. If you demolish it, you must admit you are doing so for economic reasons, not because it "wasn't historic." This removes the shield of "We just followed the facts."
  2.  **It Cannot Resolve Value Conflicts:** If the Board is split on whether "Age" is a necessary condition for "History" (Phase 2), the procedure halts. You must vote on the definition before you vote on the building.
  3.  **It Cannot Create "Super-Truth" from Consensus:** Even if 100% of the Board *wants* the 1999 Center to be historic, Phase 2 flags this as a value preference. The procedure forces you to record the vote as "Policy Exception," not "Historical Finding." This protects the integrity of the term "Historic" for future cases, but it makes the current decision harder to defend publicly.

  **Final Note to the Board:**
  This protocol will not make your decisions easier. It will make them more honest. It forces you to admit when you are acting as historians (finding facts), when you are acting as semanticists (defining terms), and when you are acting as politicians (making value choices). The anger you feel when the procedure blocks you from calling a 25-year-old building "Historic" is the sound of vagueness being managed, rather than ignored.
