answer: |-
  You're raising the Parfitian challenge, and it's a serious one, but I think you're conflating the metaphysics of identity with the morality of justification. Even if we accept reductionism—that persons are just chains of psychological connectedness—the *moral* reality remains that there are distinct loci of consciousness to whom justification is owed. When I assess whether a principle is reasonably rejectable, I'm asking whether a specific individual, occupying a specific standpoint, has a complaint strong enough to veto it. The fact that "I" am a series of connected states doesn't mean my complaint gets fragmented; the complaint belongs to the standpoint as it exists. Reductionism might blur the boundaries of *who* I am over time, but it doesn't blur the boundary between *me* and *you* enough to dissolve the requirement that I justify my actions to you individually. The unit of moral concern isn't a metaphysical soul; it's a capacity for rationality and suffering that presents itself distinctly.

  Your claim that intra-personal aggregation is already aggregation misses the structural point. When I weigh forty years of pain against a lifetime of benefit for a single person, I'm not summing separate claims; I'm assessing the *strength of one claim* based on the total impact on that life. That's necessary to determine how much that person has at stake. But when you bring in *other* people, you aren't assessing the strength of a single complaint anymore; you're trying to outvote one person's serious stake with a heap of minor stakes. Reductionism doesn't change the fact that there are multiple standpoints here. Even if connectedness comes in degrees, the demand for justification arises from each distinct standpoint. If you say numbers matter simply because there are more standpoints, you're abandoning the core contractualist idea that we owe justification to *each* person, not to the collective. So I'll ask you: if you dissolve the separateness of persons, who exactly is being justified?
