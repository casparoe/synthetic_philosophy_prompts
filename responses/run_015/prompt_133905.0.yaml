answer: |-
  Here is the spec sheet you're asking for. I'm going to skip the preamble because you're on deadline.

  You are right to feel stuck. Most theories of collective memory fail because they treat "memory" as a monolith when it's actually a bundle of conflicting legal, psychological, and political technologies. If you try to evaluate Margalit and Rieff against a single metric, they will both pass and fail depending on which wire you touch.

  Here are the **Desiderata for an Adequate Theory of Mnemonic Duty**. If a theory can't handle these rows, it's dead on arrival.

  ### 1. The Case Load (Stress Testing)
  A viable theory must provide actionable guidance (not just hand-waving) for these four specific scenarios:

  *   **State-Mandated Amnesia (The Transition Problem):**
      *   *Case:* Post-dictatorship pacts (e.g., Spain's *Pacto del Olvido*, Chile).
      *   *Requirement:* The theory must distinguish between *impunity* (forgetting to protect perpetrators) and *stabilization* (forgetting to prevent civil war recurrence).
      *   *Pass Condition:* It must explain when forgetting is a moral hazard vs. a political necessity.
  *   **The Survivor's Veto (The Agency Problem):**
      *   *Case:* Victims who refuse to testify or demand silence to survive psychologically.
      *   *Requirement:* The theory cannot impose a "duty to remember" that re-traumatizes the witness. Collective duty cannot cannibalize individual psychic integrity.
      *   *Pass Condition:* It must resolve the conflict between the public's "right to know" and the victim's "right to forget."
  *   **The Cult of Remembrance (The Identity Trap):**
      *   *Case:* Communities where victimhood is the primary currency of political capital (e.g., sectarian Northern Ireland, certain nationalist narratives).
      *   *Requirement:* The theory must identify when memory becomes a weapon that locks a group into permanent grievance, preventing future-oriented politics.
      *   *Pass Condition:* It needs an "off-ramp" mechanism. When does remembering become maladaptive?
  *   **Ambient/Material Archives (The Non-Human Witness):**
      *   *Case:* Radioactive soil, deforested landscapes, ice core data. These hold records of trauma without consciousness.
      *   *Requirement:* This is the hard mode. Standard ethics requires a subject to whom duty is owed. Soil cannot demand recognition.
      *   *Pass Condition:* The theory must ground the duty not in the *object's* rights, but in the *observer's* obligation to truth. If the land remembers, do we owe it acknowledgment? Or do we owe *future humans* the data the land holds?
      *   *Verdict:* Most theories fail here. They are anthropocentric. A robust theory must treat material traces as *evidence* that generates duty regardless of human testimony.

  ### 2. Critical Distinctions (Don't Conflate These)
  Your framework must keep these columns separate. If a theory blurs them, it's useless.

  | Distinction | Side A | Side B | Why it matters |
  | :--- | :--- | :--- | :--- |
  | **Function** | **Acknowledgment** (Cognitive/Political) | **Ritual** (Performative/Emotional) | You can have rituals without truth (empty memorials). Duty requires acknowledgment, not just ceremony. |
  | **Subject** | **Collective** (Institutional/State) | **Individual** (Psychological) | States don't have psyches. You cannot diagnose a nation with PTSD. Duty applies differently to institutions vs. people. |
  | **Mechanism** | **Erasure** (Active Suppression) | **Fading** (Natural Obsolescence) | Forgetting as *policy* is usually suspect. Forgetting as *time* is inevitable. The theory must judge the intent. |
  | **Goal** | **Justice** (Retributive/Restorative) | **Peace** (Coexistence/Stability) | These are often mutually exclusive in the short term. |

  ### 3. Non-Negotiables vs. Camp Preferences
  Here is where you separate the engineering requirements from the ideological flavor.

  **Non-Negotiables (The Theory Breakers):**
  1.  **Non-Contradiction:** It cannot demand we remember *everything* (impossible) and *nothing* (unjust). It needs a selection criteria.
  2.  **Agency Preservation:** It cannot mandate memory in a way that destroys the mental health of the bearer.
  3.  **Truth-Tracking:** It cannot validate false memories just because they are socially cohesive. (Rieff flirts with this; Margalit doesn't).

  **Camp Preferences (Ideological Flavor):**
  1.  **Sacralization:** Is memory a "sacred" duty (Margalit) or a "burden" (Rieff)? This is aesthetic/moral preference, not structural.
  2.  **Temporality:** How long does the duty last? One generation? Forever? (Margalit implies "thick relations" fade; Rieff says fade them faster).
  3.  **Scope:** Does the duty extend to distant strangers? (Cosmopolitanism vs. Communitarianism).

  ### 4. Joint Unsatisfiability (The Trade-Offs)
  This is the part you wanted most. You need to flag these explicitly in your feature. You cannot optimize for all variables simultaneously.

  *   **Transparency vs. Stability:** Full disclosure of past atrocities often destabilizes fragile democracies. You can have Truth *or* Peace, rarely both immediately. (See: South Africa TRC vs. Nuremberg).
  *   **Justice vs. Closure:** Legal justice requires digging up details; psychological closure often requires burying them.
  *   **Inclusivity vs. Coherence:** If every sub-group remembers their specific trauma, the national narrative fragments (Balkanization of memory). If you enforce one narrative, you silence minorities.
  *   **Material Truth vs. Social Harmony:** The soil might say "poison," but the community needs to say "habitable" to survive economically.

  **The Hard Truth:** A unified theory that resolves these tensions without remainder is likely impossible. The tensions are structural features of society, not bugs in the theory.

  ### 5. Scoring the Positions
  Here is how the main contenders stack up against the spec sheet.

  **Avishai Margalit (The Ethics of Memory)**
  *   *Core:* We have a moral duty to remember to maintain "thick relations" within a community.
  *   *Score:* **B+**
  *   *Pros:* Handles the *why* of memory beautifully (ethical glue). Strong on the human/human obligation.
  *   *Cons:* Fails the **Non-Human Witness** test (too relational). Struggles with the **Cult of Remembrance** (doesn't offer a clear off-ramp for toxic memory). Assumes memory is always good for relations.
  *   *Fatal Flaw:* Doesn't account for when memory *destroys* the community.

  **David Rieff (In Praise of Forgetting)**
  *   *Core:* Collective memory is usually mythical, vengeful, and impedes peace. Forgetting is a prerequisite for reconciliation.
  *   *Score:* **B-**
  *   *Pros:* Excellent on the **Cult of Remembrance** and **Stability** trade-off. Realistic about the weaponization of history.
  *   *Cons:* Dangerous on **State-Mandated Amnesia** (too close to impunity). Fails the **Truth-Tracking** non-negotiable (risks enabling revisionism). Dismissive of **Survivor Agency** (tells them to move on).
  *   *Fatal Flaw:* Confuses "forgetting" with "forgiveness." You can stop fighting without forgetting the cause.

  **The Liberal Compromise ("Never Again" / Constitutional Patriotism)**
  *   *Core:* Remember the abstract lesson, forget the specific grievance. Universalize the trauma.
  *   *Score:* **C**
  *   *Pros:* Good for **State Stability**.
  *   *Cons:* Often feels hollow (**Ritual without Acknowledgment**). Fails the **Ambient Archive** test (too human-centric).
  *   *Fatal Flaw:* It's a platitude, not a theory. It kicks the can on *how* to select what to remember.

  ### 6. The Pushback (Is the Framing Confused?)
  Yes. Here is the blunt assessment you asked for.

  Asking for a **Unified Theory of Mnemonic Duty** is likely a category error.
  1.  **Memory is not one thing:** Legal memory (evidence), Psychological memory (trauma), and Political memory (narrative) operate on different logics. A theory that satisfies the lawyer will break the therapist.
  2.  **The "Non-Human" angle breaks the ethics:** If you include degraded soil/climate data, you are no longer doing *memory ethics*; you are doing *ontological politics*. You are asking about the rights of matter. Margalit and Rieff are useless here. You need New Materialism (Bennett, Barad) or Object-Oriented Ontology.
  3.  **The Goal is Wrong:** The goal shouldn't be a theory of *memory*. It should be a theory of *repair*. Memory is just a tool. Sometimes the tool is remembering, sometimes it's forgetting, sometimes it's archiving without looking.

  **Recommendation for your feature:**
  Don't try to solve the equation. Frame the "Spec Sheet" as a diagnostic tool. Show the editors that the reason they keep hitting a wall is that they are asking for a moral solution to a structural paradox.

  The winning angle isn't "Here is the duty." It's "Here is why the duty is impossible to calculate, and why we have to do it anyway."

  Get the draft in. Good luck.
