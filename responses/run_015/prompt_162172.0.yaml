answer: |-
  # Q&A Prep Sheet: Causation by Omission & EA

  **Strategy Note:** You are walking into a room where "causation" is operationalized as "predictive dependency under intervention." Your metaphysical distinction (event vs. absence) will sound like category error to half the room and like a solved problem to the philosophers. Your goal is not to prove omissions *aren't* causes in the interventionist sense (they are), but that they aren't causes in the *ontological* sense required to ground the specific moral weight EA assigns to them.

  **The Core Concession:** You should concede **in the talk** that interventionist models (DAGs, do-calculus) are valid for *prediction and policy selection*, but invalid for *ontological attribution*. If you wait for the ML engineers to ask this, you will look like you're ignoring their toolkit. Pre-empt it: "Keep using your DAGs. Just don't reify the zero."

  **The Sleeping Dog:** Objection #2 (Agglomeration). If nobody asks this, you win. If they do, your positive proposal (CNP) risks collapsing under collective action problems. Hope they miss it, but have the reply ready.

  **The Strongest Objection:** Objection #1 (Interventionism). It is the dominant epistemology in the room. If you cannot reconcile your metaphysics with their operationalism, you will be dismissed as a pedant.

  ---

  ### 1. The Interventionist (ML/Quant PhD)
  **The Objection:** "You're defining causation metaphysically, but we define it operationally. In a structural causal model, if $P(Donate=0) \to P(Death=1)$ under the $do$-operator, then not-donating is a cause. Full stop. If your metaphysics says otherwise, your metaphysics is wrong, not the math. Why should we change our language to fit a distinction that changes no predictions?"

  **The Reply (2 mins):** "I'm not asking you to change your math; I'm asking you to change your *interpretation*. Your DAGs track *dependencies*, not *ontological glue*. When you set a variable to 0, you are modeling a counterfactual dependency, which is real. But dependency isn't causation. Causation requires a process transmission. A '0' in your dataset isn't an event; it's the absence of an event. If you conflate the two, you end up saying the absence of a meteor strike caused the meeting to start. That's true counterfactually, but it's not a causal explanation. Keep using do-calculus for prediction. Just don't tell donors they 'caused' death in the same way a bullet causes death."
  *   **Dependence:** Stands without CNP.
  *   **Soft Spot:** You are relying on a process theory of causation which many in the room reject as outdated.
  *   **Fold Condition:** If they press on "What else could causation possibly mean?", concede that *explanatory* causation includes omissions, but *physical* causation does not.

  ### 2. The EA Generalist (Collective Action/Agglomeration)
  **The Objection:** "Your 'Culpable Non-Prevention' (CNP) doesn't agglomerate. But EA is built on collective action problems. If 1,000 people could each donate $10 to prevent extinction, and none do, extinction happens. On your view, is the *group* culpable? If the group is culpable, doesn't that imply a collective causal power? If not, how do you justify prioritizing meta-charity which relies on coordinating thousands of non-causes?"

  **The Reply (2 mins):** "CNP is agent-relative. Each of the 1,000 stands in the relation to the outcome individually. The *group* culpability is a separate normative layer, not a sum of causal powers. We don't need collective causation to justify collective duty. We justify meta-charity not because it 'stops' extinction causally, but because it coordinates the fulfillment of 1,000 individual duties. The urgency remains, but the justification shifts from 'making a difference' to 'meeting an obligation.' The math of coordination stays the same; the story we tell about *why* changes."
  *   **Dependence:** Heavily dependent on CNP.
  *   **Soft Spot:** This is the hardest philosophical lift. If the group is responsible, there must be *some* relation holding between the group and the outcome. Denying it looks like special pleading.
  *   **Fold Condition:** If they show that CNP fails to generate the *magnitude* of obligation EA requires (e.g., why is my duty stronger if 999 others also fail?), concede that CNP needs a aggregation principle for *severity*, even if not for *causation*.

  ### 3. The Causation Specialist (Phil Grad Student)
  **The Objection:** "Your central exhibit is just overdetermination. We have handled this since Lewis. In structural equation models, we can trace the active path. If both donors decline, both are actual causes under the H1 or H2 accounts. You're rejecting the framework because it yields a symmetric result you dislike, not because the framework is broken. Why isn't this just a refusal to accept the counterfactual verdict?"

  **The Reply (2 mins):** "I'm not rejecting the verdict because I dislike it; I'm rejecting it because the symmetry shows the *category* is wrong. If the counterfactual test says 'neither caused it' or 'both caused it' in a way that violates transitivity or proportionality, that suggests 'cause' is the wrong word for the relation. In the donor case, there is no active path from either donor to the child. There is only a broken promise. The symmetry isn't a bug in the math; it's a signal that we've applied a physical concept to a normative situation. We should stop trying to fix the counterfactual account and start using the normative account."
  *   **Dependence:** Stands without CNP (attacks the negative thesis).
  *   **Soft Spot:** The literature on preemption is vast. They know more than you.
  *   **Fold Condition:** Concede that *some* refined counterfactual accounts can handle overdetermination, but maintain they do so by smuggling in normative assumptions (like 'default values') which proves my point.

  ### 4. The Normative Ethicist (Phil Grad Student)
  **The Objection:** "This is a solution in search of a problem. If the output of 'You caused the death' and 'You were culpably non-preventive' is identical—same blame, same duty to rectify—why make the distinction? You're creating a metaphysical quibble that does no moral work. The Shallow Pond case settles that I must act. Whether my inaction is a 'cause' is irrelevant to the obligation."

  **The Reply (2 mins):** "It does moral work because it changes *prioritization*. If omissions are causes, then everyone who didn't fund the bed net is equally causally responsible for the death, regardless of their capacity or proximity. That leads to infinite regress and diluted responsibility. If it's CNP, the duty is bounded by capacity and specific role. It prevents the 'everyone is guilty' conclusion that paralyzes agents. It distinguishes the person who *could* have helped from the person who *promised* to help. The metaphysics protects the agent from infinite demand."
  *   **Dependence:** Dependent on CNP (specifically the capacity/duty link).
  *   **Soft Spot:** Many ethicists are consequentialists who *want* infinite demand.
  *   **Fold Condition:** Concede that for a pure act-utilitarian, the distinction collapses. Your view presupposes a agent-relative constraint.

  ### 5. The Prosecutor (Retired)
  **The Objection:** "I've put people in prison for failures to act. Negligent homicide. Duty of care. The law treats the omission as the cause of death for the purpose of liability. If you tell a jury 'you didn't cause the death, you just had a duty,' they won't convict. Are you saying the law is metaphysically wrong, or that we should change legal instruction?"

  **The Reply (2 mins):** "The law is pragmatic, not metaphysical. Legal causation is about *liability assignment*, not *process tracing*. The law treats omissions as causes because it's the most efficient way to enforce duty. I'm not arguing we should change the law. I'm arguing that when EAs talk about 'saving lives,' they are invoking a physical causal power they don't have. In court, we care about blame. In EA, we care about resource allocation. Conflating the two leads to spending money on interventions that feel like 'saving' but are actually just 'not letting die,' which changes how we measure impact."
  *   **Dependence:** Stands without CNP.
  *   **Soft Spot:** Legal causation *is* the dominant folk concept of causation for many.
  *   **Fold Condition:** Concede that 'legal causation' is a valid distinct category, but insist it shouldn't bleed into 'scientific causation.'

  ### 6. The Longtermist (XRisk Researcher)
  **The Objection:** "This threatens the core longtermist argument. We say 'failure to align AI causes extinction.' If that's false, does the risk disappear? If we can't claim we are 'preventing' a cause, do we lose the urgency? It sounds like you're disarming the movement right before the most critical decade."

  **The Reply (2 mins):** "The risk doesn't disappear; the *description* changes. We aren't 'stopping' extinction causally; we are 'fulfilling a duty' to secure the future. The urgency comes from the magnitude of the duty, not the causal leverage. In fact, this protects longtermism. If we claim we 'cause' survival, and we fail, we 'caused' extinction. That's a heavy burden. If we say we had a duty to try, and we failed, we are culpable, but we didn't single-handedly cause the apocalypse. It makes the project more robust to failure."
  *   **Dependence:** Dependent on CNP (duty grounding).
  *   **Soft Spot:** "Difference-making" is the currency of EA. Removing it devalues the coin.
  *   **Fold Condition:** If they argue that donors are motivated by *impact* (causation) not *duty*, concede that this might lower donations short-term but increase sustainability long-term.

  ### 7. The Kantian (Phil Grad Student)
  **The Objection:** "You ground CNP in a duty. Where does the duty come from? If it comes from the consequence (the child dies), then the consequence is grounding the duty. Doesn't that make the link between action and consequence the primary moral fact? Isn't that just causation in disguise?"

  **The Reply (2 mins):** "No. The duty comes from the *capacity* to help and the *need* of the other, not the causal link. I have a duty to save the child because I am an agent and they are a human in need. Whether my action is the 'cause' of their survival is secondary. If a second donor appears, my duty doesn't vanish, even if my causal efficacy does. The duty is robust; the causation is fragile. That's why we should ground the ethics in the duty, not the cause."
  *   **Dependence:** Heavily dependent on CNP.
  *   **Soft Spot:** If the need is defined by the *absence* of help, you're back to omissions.
  *   **Fold Condition:** Concede that consequences are *evidence* of duty, but not the *ground* of it.

  ### 8. The Logistics Person (Humanitarian)
  **The Objection:** "On Monday, I model supply chains. If 'Truck A' doesn't arrive, 'Clinic B' closes. My model says 'No Truck' causes 'Closed Clinic.' If I adopt your view, do I have to rebuild my model? Does this change how I allocate resources, or is it just philosophy?"

  **The Reply (2 mins):** "Do not rebuild your model. Your model predicts flows. 'No Truck' is a valid state variable that predicts 'Closed Clinic.' I am not asking you to change your operations research. I am asking you to change how you *talk* to donors. Tell donors 'Your funding enables the truck,' not 'Your lack of funding kills the patient.' The first is true and empowering. The second is metaphysically shaky and guilt-inducing. The math stays; the marketing changes."
  *   **Dependence:** Stands without CNP.
  *   **Soft Spot:** None. This is the easiest win.
  *   **Fold Condition:** None. Stand firm here.

  ---

  ### Final Recommendation

  **Concede in the Talk:**
  Explicitly state: *"I am not arguing against the utility of counterfactual models for prediction. If you are an ML engineer optimizing a policy, treat omissions as causes. My claim is ontological, not instrumental."*
  This disarms Objection #1 and #8 immediately. It shows you respect their tools, you just dispute their reification.

  **The "Kill Shot" to Prepare For:**
  If someone combines #1 and #2: *"If your ontology doesn't change the prediction or the duty, why does it matter?"*
  **Your Answer:** *"Because it changes the emotional and strategic landscape. 'Cause' implies control and leverage. 'Duty' implies obligation and constraint. EA has sold itself on leverage. If the leverage is illusory (because omissions aren't causes), we are selling a false product. We should sell the duty instead. It's more honest."*

  **Tone Check:**
  Do not sound like you are absolving donors. You are *increasing* the normative pressure (Duty) while removing the causal claim (Leverage). Make sure they understand you are not letting them off the hook; you are moving the hook from their hands to their conscience.
