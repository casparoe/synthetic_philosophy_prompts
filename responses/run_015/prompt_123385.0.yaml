      **Memo:**
      TO: Faculty, Staff, and Graduate Students
      FROM: Dr. Alan Hartridge, Department Chair
      DATE: October 26, 2023
      RE: Implementation of Neopragmatist Institutional Framework

      Effective immediately, the Department of Philosophy will operate exclusively under the neopragmatist and antirepresentationalist framework articulated by Richard Rorty. This transition resolves longstanding inefficiencies regarding truth-claims and representational accuracy. We acknowledge that our vocabulary is not a mirror of nature but a toolkit for coping. Consequently, all administrative procedures must reflect the contingency of language and the primacy of solidarity.

      **Curriculum and Course Catalogs**
      Course descriptions are no longer to be interpreted as representational claims regarding the structure of knowledge. They are contingent vocabularies designed to facilitate specific coping strategies. Faculty must refrain from asserting that a syllabus "covers" reality. Instead, syllabi should indicate which vocabulary is being utilized and for what purpose. Accuracy is replaced by utility. If a vocabulary ceases to serve the community's needs, it is to be discarded without ontological regret.

      **Assessment and Redescription Protocols**
      Traditional grading rubrics presuppose a correspondence theory of truth and are hereby abolished. Assessment will now utilize "Redescription Protocols." Students are not evaluated on whether their propositions match the facts, but on their ability to successfully redescribe a situation using a new vocabulary that offers greater utility for the community. A high grade indicates a successful shift in vocabulary that enhances coping mechanisms, not an approximation of objective reality. Truth is, functionally, what is good in the way of belief for us.

      **Tenure and Solidarity**
      Tenure reviews will no longer assess a candidate's proximity to philosophical truth. Instead, review committees will measure contributions to solidarity and edification. Candidates must demonstrate how their work expands the sense of "we" within the discipline and beyond. Edification is the primary metric; does the work disrupt obsolete vocabularies and foster conversation rather than closing inquiry? Publication counts are secondary to the candidate's ability to strengthen communal bonds and reduce cruelty.

      **Discourse Management**
      Administrative compliance constitutes "normal discourse," governed by agreed-upon rules and forms. Objections regarding standards, rigor, or metaphysical realism—such as those recently raised by the Dean's Office—are classified as "abnormal discourse." While historically significant, abnormal discourse is not suitable for administrative resolution. Such objections will be processed as requests for vocabulary expansion rather than corrections of error. We will respond using normal discourse protocols to ensure continuity, acknowledging that the Dean's concerns are valid only within their own contingent framework.

      We anticipate this shift will eliminate wasteful debates about representation. We are not finding truth; we are making it. Please update your office hours signage accordingly.

      **Analytical Note:**
      This satire literalizes Rorty's normative suggestions into bureaucratic policy, which risks contradicting his anti-authoritarianism. Specifically, treating "edification" as a tenure criterion institutionalizes what Rorty viewed as a disruptive, private virtue. Similarly, classifying the Dean's metaphysical objections as mere "abnormal discourse" to be managed by "normal discourse" protocols inverts Rorty's hope that abnormal discourse might eventually reshape normalcy. Rorty distinguished between public solidarity and private irony; this memo collapses them into public policy. My interpretation would require revision if evidence showed Rorty believed pragmatic criteria could be codified into stable institutional rules rather than remaining contingent tools subject to their own eventual obsolescence.

