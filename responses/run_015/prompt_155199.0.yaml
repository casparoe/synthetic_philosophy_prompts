answer: |-
  1. If small harms don't aggregate across persons, your model invalidates the additive QALY framework we use to set cost-effectiveness thresholds and allocate budgets. Insist person-boundaries block aggregation, but admitting this renders most preventive public health interventions economically unjustifiable under current HTA rules is your weakest point.

  2. Stated preference studies show individuals are willing to pay for small risk reductions across populations, contradicting your claim that these values sum to zero. Argue preferences are mistaken about aggregation, but ignoring revealed willingness to pay undermines the demand-side validity of your model.

  3. Refusing to sum minor benefits across lives creates massive opportunity costs by diverting resources from high-volume, low-effect treatments to niche interventions. Contend compounding within a life justifies priority, but this offers no heuristic for weighing one person's compounded specks against another's minor fracture.

  4. Guideline committees already apply severity weights to prioritize worse-off patients, so your lexical threshold is redundant to existing equity modifiers. Claim severity weights miss the person-boundary issue, yet you cannot quantify how much weight a boundary deserves versus a clinical severity modifier.

  5. How do you model the transition from independent specks to compounded harm without drawing the exact arbitrary threshold line you claim to avoid? Suggest time-clustering defines compounding, but this collapses back into threshold hunting when defining the temporal window for aggregation.
