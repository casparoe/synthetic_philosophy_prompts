answer: |-
  Consider the "Quad-Basin Accord," a coalition of four small democratic states sharing a critical river system, where each has abolished standing armies in favor of unarmed police forces and signed a treaty pledging non-interference in internal governance, yet they have deliberately rejected forming a formal federation or league with binding arbitration mechanisms. Instead, they manage water allocation through ad hoc diplomatic summits while simultaneously enforcing strict border closures against outside migrants and traders to protect domestic labor markets. When an upstream state diverts flow during a drought, causing agricultural collapse downstream, the injured party threatens economic sanctions and mobilizes its police reserve, citing the violation of shared resources, but lacks a legal court to adjudicate the claim and faces domestic pressure to secure resources for its citizens despite the non-interference pact.

  Under the "preliminary-articles-are-sufficient" reading, perpetual peace holds in this bloc because the negative conditions have removed the material capacity and legal pretexts for war; without standing armies or the right to interfere, the water dispute remains a diplomatic friction rather than a *casus belli*, implying that stripping away the tools of conflict is enough to maintain stability. Conversely, the "definitive-articles-are-jointly-necessary" reading argues that perpetual peace is impossible here because the states remain in a state of nature regarding water rights; without a Federation to provide public lawful arbitration, the dispute lacks a juridical solution, and the restriction of hospitality fosters isolationism that undermines the cosmopolitan right required for stable interaction, meaning the Preliminary Articles are merely a ceasefire rather than a constitution of peace. The structural feature actually doing the work is the missing Federation, as the Preliminary Articles merely suspend violence while the Definitive Articles establish the public legal status needed to resolve resource conflicts without force; the republican constitutions help constrain aggression but cannot solve the coordination problem without a league, and the blocked hospitality is secondary to the immediate lack of arbitration. A modern realist critic would attack this framing by arguing that abolishing standing armies is irrelevant in an anarchic system where water control constitutes coercive power, meaning the security dilemma persists regardless of constitutional labels because capabilities matter more than intentions. Finally, if you remove the republican constitutions but keep the other conditions, the case collapses into a standard multipolar security dilemma because autocratic leaders do not bear the costs of war and thus view the Preliminary Articles as cheap talk, rendering the non-interference pledge non-credible when vital resources are at stake.
