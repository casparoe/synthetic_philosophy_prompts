      *   *Revision on Analysis:* Ensure the "Preliminary-sufficient" view isn't dismissed too easily. It argues that without the *means* of war, conflict remains diplomatic. The "Definitive-necessary" view argues that without legal public status (Federation), the dispute remains in a state of nature.

      *   *Revision on Realist:* Realists would say "no standing armies" is irrelevant if the capability to coerce exists (water control).
      *   *Revision on Non-Republics:* If they aren't republics, the leaders don't care about the cost of war, so the Preliminary Articles are ignored when expedient.

      *   *Final Check:* One paragraph for the scenario. The rest can be structured as requested.

