  2.  **Deconstruct Kant's *Perpetual Peace*:**
      *   **Preliminary Articles:** Negative conditions (e.g., no secret reservations, no independent states acquired by inheritance/exchange, standing armies abolished, no national debt for war, no interference in internal affairs, no hostile acts during peace). These remove immediate causes of war.
      *   **Definitive Articles:** Positive conditions (1. Civil Constitution of every state shall be Republican; 2. Right of Nations shall be based on a Federation of Free States; 3. Cosmopolitan Right shall be limited to Conditions of Universal Hospitality). These establish the structural basis for lasting peace.
      *   **The Debate:** Some argue if you follow the Preliminary Articles (especially abolishing standing armies and non-interference), peace might hold temporarily without the Definitive Articles. Others argue without the Definitive Articles (especially the Federation and Republicanism), the Preliminary Articles are unstable or insufficient for *perpetual* peace.

  3.  **Drafting the Scenario (Constraint: One Paragraph):**
      *   *Elements:* 4 small democratic states, river-basin authority, abolished standing armies, non-interference, no formal federation/league, restricted borders (no hospitality).
      *   *Conflict:* Water rights.
      *   *Draft:* Consider the "Danubian Quad," a consortium of four small democratic states sharing a critical river basin, where each has abolished standing armies in favor of police forces and signed a treaty pledging non-interference in internal governance, yet they have deliberately rejected forming a formal federation or league with binding arbitration mechanisms. Instead, they manage water allocation through ad hoc diplomatic summits while simultaneously enforcing strict border closures against outside migrants and traders to protect domestic labor markets. When an upstream state diverts flow during a drought, causing agricultural collapse downstream, the injured party threatens economic sanctions and mobilizes its police reserve, citing the violation of shared resources, but lacks a legal court to adjudicate the claim and faces domestic pressure to secure resources for its citizens despite the non-interference pact.

  4.  **Analyzing the Readings:**
      *   **"Preliminary-articles-are-sufficient" Reading:** This reading suggests that if you remove the *tools* of war (standing armies) and the *pretexts* (interference, secret reservations), peace holds. In the scenario, they abolished standing armies and agreed to non-interference.
          *   *Verdict:* Peace should hold or be easily resolvable because the *means* of war are gone. The water dispute is a legal/administrative issue, not a casus belli. The lack of federation shouldn't matter if the negative conditions prevent escalation.
      *   **"Definitive-articles-are-jointly-necessary" Reading:** This reading argues that without a Republican constitution (checked by citizens), a Federation (legal arbitration), and Hospitality (interaction), peace is unstable.
          *   *Verdict:* Peace is fragile or impossible. Without a Federation (Definitive Article 2), there is no public legal mechanism to solve the water dispute. Without Hospitality (Definitive Article 3), the states are isolated and potentially hostile to outsiders, fostering a closed mentality. Even if they are republics (Definitive Article 1), without a federation to adjudicate the water rights, the dispute threatens the peace. The Preliminary Articles are just a ceasefire, not peace.

  5.  **Identifying the Structural Feature:**
      *   Is it the missing federation? Yes. The water dispute needs arbitration. Preliminary articles say "don't fight," Definitive say "build a court."
      *   Is it the blocked hospitality? This creates tension but isn't the immediate cause of war between *them*.
      *   Is it the republics? This keeps them from wanting war, but doesn't solve the coordination problem.
      *   *Conclusion:* The missing Federation is the key. The Preliminary Articles remove the sword, but the Definitive Articles provide the scale. Without the Federation, the water dispute lacks a lawful resolution mechanism, making the Preliminary Articles unstable.

  6.  **Realist Critic:**
      *   Realists care about power and anarchy.
      *   *Attack:* Abolishing standing armies doesn't remove the security dilemma. Police reserves can be militarized. Water is a vital resource (survival). In anarchy (no federation), states will cheat or defect when survival is at stake. Trust is irrelevant; capability matters.
      *   *Removing Republics:* If they aren't republics (e.g., autocracies), the security dilemma returns instantly. Leaders don't answer to citizens who bear the cost of war. The "no standing army" pledge becomes non-credible. The case collapses into standard multipolar security dilemma because the internal constraint (Republicanism) is gone, leaving only external promises (Preliminary Articles) which are cheap talk in anarchy.

  7.  **Refining the Output:**
