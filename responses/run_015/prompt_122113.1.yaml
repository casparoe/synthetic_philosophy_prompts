answer: |-
  No worries about the typos; I know that rush between lectures. You've actually picked a stronger angle than the standard vision-first approach. Framing this through **interoception and active inference** makes it much more relevant to philosophy of mind (selfhood, agency, drive) and avoids the "brain as a camera" trap.

  Here is a 40-minute teaching plan designed for first-years with no neuroscience background, prioritizing logical flow and misconception management.

  ### Session Goal
  To demonstrate that the brain is not a passive stimulus-responder, but an active organ that predicts internal and external states to keep the organism alive (minimising free energy/surprise).

  ### The Logical Arc (Order of Ideas)
  You asked: *Hierarchy first or Surprise minimisation first?*
  **Answer:** Start with **Surprise Minimisation (The Goal)**.
  If you start with hierarchy, they get lost in anatomy. If you start with "The brain wants to avoid being surprised," you give them a *motive*.
  **Flow:** Goal (Free Energy) → Mechanism (Prediction) → Action (Active Inference) → Implication (Self/Will).

  ---

  ### The 40-Minute Plan

  #### 1. Introduction: The Problem of Uncertainty (0–5 mins)
  *   **Hook:** Ask, "Why don't you faint every time your heart beats louder?" or "Why don't you panic when you feel thirsty?"
  *   **Concept:** Introduce **The Free Energy Principle (FEP)** simply.
      *   *Definition:* Organisms must avoid surprising states (e.g., extreme heat, low glucose, high heart rate) to survive.
      *   *Rebranding:* "Free Energy" is just a mathematical way of saying "Surprise" or "Prediction Error."
  *   **⚠️ Misconception Cut-off #1 (Thermodynamics):**
      *   *When:* Immediately after saying "Free Energy."
      *   *What to say:* "Despite the name, this has nothing to do with heat or thermodynamics in the skull. It is *informational* surprise. If your body predicted 37°C and is suddenly 40°C, that is high 'free energy.' It's about being wrong, not being hot."

  #### 2. The Mechanism: Prediction & The Teapot (5–15 mins)
  *   **Concept:** The brain is a prediction machine, not a perception machine. It guesses what *should* happen and checks the error.
  *   **The Teapot Example (Proprioceptive/Motor):**
      *   *Scenario:* You reach for a teapot you believe is full. You predict resistance (weight). It is empty. Your arm shoots up.
      *   *What this example MUST have:* **A prior expectation.** You must emphasise that the brain *sent a signal down* expecting weight, not just reacted to the arm going up. The error was the mismatch between the *prediction of sensation* and the *actual sensation*.
      *   *What this example MUST lack:* **Reflex framing.** Do not let them think this is a simple knee-jerk reflex. It must be framed as a *failed prediction*.
      *   *Connecting to Interoception:* Crucial step. Why were you lifting the teapot? To pour tea. Why pour tea? To satisfy **thirst** (interoceptive state).
      *   *Point:* The motor error (arm shooting up) is in service of the interoceptive goal (quenching thirst). This prevents them from thinking PP is just about vision or movement.
  *   **⚠️ Misconception Cut-off #2 (Literal Bayes):**
      *   *When:* When explaining how the brain updates after the teapot slip.
      *   *What to say:* "The brain updates its model to weigh the teapot less next time. It acts *as if* it is calculating statistics (Bayes' theorem), but it isn't doing math. It's adjusting synaptic weights. Don't imagine a calculator in the head."

  #### 3. The Core: Interoceptive Active Inference (15–25 mins)
  *   **Concept:** This is the heart of your session. Move from "perceiving the world" to "regulating the self."
  *   **The Shift:** In vision, we usually change our *mind* to match the world (Perceptual Inference). In interoception, we often change the *world* to match our mind (Active Inference).
  *   **Example:** Thirst.
      *   *Prediction:* "My body should have hydration level X."
      *   *Input:* "Hydration is low."
      *   *Error:* High surprise (discomfort).
      *   *Resolution:* I don't just "perceive" thirst; I drink water. I acted to make the sensation match the prediction of "being hydrated."
  *   **Why this matters:** This explains *agency*. We are not passive observers; we are control systems keeping our internal variables within safe limits.
  *   **Hierarchy Note:** Briefly mention that deep brain structures predict heart rate/breath (unconscious), while cortex predicts complex goals (making tea). You don't need to teach the layers, just the concept of "deep vs. shallow" predictions.

  #### 4. Philosophical Implications: Self & Will (25–35 mins)
  *   **Concept:** If the brain is just minimising error, where is the "Self"?
  *   **The "Self" Model:** The "Self" is just the brain's best long-term prediction of the organism's boundary and needs. You feel like a "you" because your brain predicts a persistent body with specific needs.
  *   **⚠️ Misconception Cut-off #3 (Free Will/Determinism):**
      *   *When:* When students ask, "If the brain just minimises error, do we have choices?"
      *   *What to say:* "Predictive processing doesn't remove choice; it explains *how* choice is possible. You aren't a robot following a script. You are simulating different futures (policies) and selecting the one that minimises long-term surprise. Freedom isn't the absence of causes; it's the flexibility of the model."
      *   *Timing:* Do not let this derail the middle section. Park it for here.

  #### 5. Assessment & Wrap Up (35–40 mins)
  *   **Review:** Goal (Survival/Surprise) → Mechanism (Prediction) → Action (Active Inference).
  *   **The Killer Question:** (See below).

  ---

  ### Analysis of the Teapot Example
  You asked specifically what this case needs to have and lack to avoid the "vision/motor only" trap.

  *   **It MUST Have:** **Teleological Context.** You must explicitly state *why* the arm was lifted. If it's just "lifting an object," it's motor control. If it is "lifting to pour to quench thirst," it is **interoceptive active inference**. The motor prediction is subservient to the physiological prediction.
  *   **It MUST Lack:** **Passive Reaction Language.** Avoid phrases like "the arm reacted." Use "the prediction failed." Ensure they understand the brain *caused* the arm to move based on a guess, and the error was in the guess, not the muscle.

  ### Does Interoception Change the Teaching Order?
  **Yes.**
  *   **Standard Order:** Perception (Vision) → Action (Motor) → Homeostasis (Interoception).
  *   **Your Order:** Homeostasis (Goal/Survival) → Action (How we fix homeostasis) → Perception (How we model the world to allow action).
  *   **Why:** This is actually better for Philosophy of Mind. It grounds the mind in *life* and *needs* rather than abstract representation. It makes the "Free Energy" concept (staying alive) much more intuitive than "visual surprise."

  ### What to Leave Out (The "Do Not Touch" List)
  You have 40 minutes. Be ruthless.
  1.  **Variational Calculus:** Do not write the equation $F = E - H$. Do not mention "variational bounds." Just say "a mathematical measure of surprise."
  2.  **Specific Neuroanatomy:** Do not teach Layer 4 vs. Layer 5 pyramidal cells. Do not teach the exact pathway of the vagus nerve. Keep it functional (Deep brain vs. Cortex).
  3.  **Evolutionary Deep-Dive:** Don't spend time on single-celled organisms unless it's a one-sentence analogy. Focus on the human mind.
  4.  **The "Dark Room" Problem:** Your tutor covered it. If a student brings it up, acknowledge it ("Yes, why don't we just sit in dark rooms? Because our deep predictions demand food/social/safety, not just visual silence") and move on.

  ### The Final Assessment Question
  Do not ask: "What is the Free Energy Principle?" (They will recite a definition).
  **Ask this instead:**

  > "Imagine a person who feels anxious (high heart rate) before a presentation.
  > **Scenario A:** They take a pill to lower their heart rate.
  > **Scenario B:** They practise the speech until they feel confident, and their heart rate lowers.
  > Using Predictive Processing, explain why Scenario B is 'Active Inference' while Scenario A is just 'interference.' Which one updates the brain's model of the world, and why does that matter for the 'Self'?"

  *   **Correct Answer Logic:** Scenario A changes the input to match the prediction (chemically), but the brain still predicts "danger." Scenario B changes the prediction ("I am safe/capable"), which minimises long-term free energy. This tests if they understand that PP is about *model updating*, not just symptom suppression.

  Good luck. You've got a solid angle here; the interoceptive focus will make it stick.
