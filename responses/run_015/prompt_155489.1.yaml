      *   **Fiction and Irony:** How does he escape condemning Shakespeare? The "pact" of fiction. No claim to reference reality. Therefore, no breach of the sign-reality link regarding *res*.
      *   **Casuistry Connection:** Did they misread him? Yes and no. They used his distinction between "officious" and "pernicious" lies to grade sins, but they tried to use his semiotics to allow loopholes he wouldn't accept. Augustine blocks *restrictio mentalis* because the sin is in the *will to mislead*, not the grammatical falsity.
