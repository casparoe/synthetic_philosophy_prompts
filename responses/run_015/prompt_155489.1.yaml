answer: |-
  You are right to be frustrated by the "always wrong, period" summary. It captures Augustine's *conclusion* but obliterates his *mechanism*. If you treat Augustine as a simple deontologist, you miss the metaphysical weight he places on language itself.

  To answer your core question: Augustine's prohibition is neither purely semantic nor purely ethical. It is a **theological-ontological hybrid**. The semiotic violation *is* the ethical corruption. They are not two separate arguments weighing against each other; they are the same reality described from different angles (the nature of signs vs. the nature of the soul).

  Here is the breakdown of that machinery, how it handles equivocation, and why it conceptually blocks the later casuist moves of *restrictio mentalis*.

  ### 1. The Semiotic-Ethical Hybrid: *Signum* and *Res*
  In *De Doctrina Christiana*, Augustine outlines a semiotics where signs (*signa*) are instituted by God to lead us to things (*res*), and ultimately to God, who is Truth (*Veritas*). Language is not merely a human convention for Augustine; it is part of the created order designed for communion.

  When you lie, you are not just breaking a social contract. You are perverting the ontological function of a sign. You are using a God-given faculty (speech) to point away from Being (Truth) toward Non-Being (Falsehood).

  This is where the "soul corruption" argument kicks in. The corruption isn't a downstream consequence (i.e., "If you lie, you might feel bad later"). The corruption is immediate and constitutive. To lie is to create a split in the self (*cor duplex*, the double heart). You hold the truth in your mind but will the falsehood with your voice. This internal dissonance is a turning away from the unity of God.

  **So, to your question:** Does the semiotic view leave room for mental reservation?
  **No.** Because for Augustine, the "sign" isn't just the grammatical proposition. The sign includes the **communicative intent**. If you use a technically true sign to convey a false meaning, you have still perverted the sign's function. The sign is designed to unite minds in truth; if you use it to separate minds (by making the listener believe what you know is not the case), you have violated the semiotic order, regardless of the propositional truth-value.

  ### 2. The Definition of the Lie: *Voluntas Fallendi*
  This is where Augustine actually aligns surprisingly well with modern Speech-Act Theory (specifically Gricean pragmatics) and clashes with simple truth-conditional semantics.

  For Augustine, the definition of a lie rests on the *voluntas fallendi* (the will to deceive), not the falsity of the statement. He explicitly categorizes four scenarios in *De Mendacio*:
  1.  **False statement, no intent to deceive:** (You are mistaken). This is **error**, not a lie. No sin.
  2.  **True statement, intent to deceive:** (You tell a truth to make someone believe a falsehood). This **is a lie**.
  3.  **False statement, intent to deceive:** The standard lie.
  4.  **True statement, no intent to deceive:** Truth-telling.

  **The Clash with Speech-Act Theory:**
  Modern analytic philosophy often struggles with whether a lie requires a false *proposition* or a false *belief*. Augustine sides with the **false belief/intent** camp. If I say "The cat is on the mat" believing the cat is on the mat, but the cat is actually in the kitchen, I have not lied. I have spoken falsely, but I have maintained communicative integrity. My will is aligned with my understanding.

  Conversely, if I know the cat is in the kitchen but say "The cat is on the mat" to make you think otherwise, I have lied. Even if, by some cosmic accident, the cat *was* on the mat, Augustine would argue I still lied because my will was oriented toward deception.

  This implies that for Augustine, lying is an **illocutionary act of betrayal**, not a locutionary act of falsification.

  ### 3. Mental Reservation and Equivocation
  This is the critical point regarding the casuists. Later Jesuit casuists (like Suarez or Sanchez) developed *restrictio mentalis* (mental reservation) to argue that if you mentally add a qualifier to your statement that the listener doesn't hear, you aren't lying because the *full* proposition (vocal + mental) is true.

  **Augustine's logic blocks this move conceptually.**
  Why? Because Augustine locates the sin in the *intent to mislead the neighbor*. In *Contra Mendacium*, he argues that the purpose of speech is to make known the thoughts of the speaker to the hearer. If you withhold the key to decoding your speech (the mental reservation), you are actively preventing that communion.

  He distinguishes between **lying** and **keeping silence**. You can refuse to answer. You can say "I do not wish to speak on this." But the moment you open your mouth, you enter a covenant of truth. To speak words calculated to generate a false belief in the listener is to violate that covenant, even if the words are technically ambiguous.

  For Augustine, equivocation that relies on the listener's ignorance is just a sophisticated form of the *voluntas fallendi*. The "technical truth" of the words is irrelevant if the **pragmatic effect** is deception. The soul is corrupted because the will is engaged in deception, not because the grammar is false.

  ### 4. Fiction and Irony: The "Pact" of Discourse
  If all falsehood is sin, how does Augustine handle fiction, parables, or irony? He addresses this in *De Mendacio* and *Contra Mendacium*.

  He argues that these are not lies because there is no **claim to factual reference**.
  *   **Fiction/Poetry:** The context establishes a "pact" that this is not referring to *res* (reality) but to *signa* (signs) for the sake of beauty or moral instruction. No one is deceived about reality because no one expects a reference to reality.
  *   **Irony/Joking:** The tone and context signal that the literal meaning is not the intended meaning.

  The sin of lying requires the **expectation of truth** to be established and then violated. If I tell you a parable, I am not inviting you to believe a historical event occurred; I am inviting you to grasp a spiritual truth. Therefore, the sign-reality link is not broken; it is just operating on a different level (allegorical rather than literal).

  However, if I tell a fiction *presenting it as fact* (e.g., a forged relic, a fake miracle), that becomes a lie because I have invoked the expectation of factual reference to deceive.

  ### 5. Did the Casuists Misread Him?
  Yes and no.
  *   **Where they followed him:** They adopted his gradation of lies. Augustine distinguishes eight types of lies (from pernicious lies that kill, to jocose lies, to officious lies that help). He says all are sins, but some are venial and some mortal. The casuists latched onto this grading system to justify "lesser evils."
  *   **Where they diverged:** They tried to use Augustine's semiotics to create loopholes (like mental reservation) that his ethics forbade. They treated the *proposition* as the locus of truth; Augustine treated the *communion of minds* as the locus of truth.

  If you ask Augustine, "Did I lie if I said 'I don't know' meaning 'I don't know *what I'm allowed to tell you*'?" he would say: **Yes.** You intended the listener to believe you lacked knowledge, while you possessed it. You created a false belief. The mental reservation is irrelevant because the *voluntas fallendi* was present.

  ### Summary: The Conceptual Machinery
  Augustine's prohibition is not a rule imposed on language from the outside; it is a description of how language functions within a created order.

  1.  **Ontology:** God = Truth. To lie is to turn toward Non-Being.
  2.  **Semiotics:** Signs are for conveying reality. To use signs to conceal reality is to break the tool.
  3.  **Ethics:** The breakage of the tool damages the user (the soul) because it disorders the will (*voluntas*).
  4.  **Speech-Act:** The lie is defined by the intent to deceive (*voluntas fallendi*), not the truth-value of the proposition.

  **Conclusion on your specific tension:**
  The soul-corruption side does **not** make the semiotic distinctions moot; rather, it **subsumes** them. The reason the soul is corrupted is *because* you have perverted the sign-relation. Therefore, mental reservation fails because it still perverts the sign-relation (by using signs to mislead), even if it preserves propositional truth.

  Augustine is stricter than the casuists because he cares less about the *words* and more about the *will*. A casuist asks, "Are these words technically false?" Augustine asks, "Are you using these words to make your brother believe what is not in your heart?" For Augustine, if the answer is yes, you have lied, and you have damaged your soul, regardless of how clever your equivocation was.
