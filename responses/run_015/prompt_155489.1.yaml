      *   **Constraint:** Do not just recap treatises. Dig into the conceptual machinery. Relate to later casuist debates (*restrictio mentalis*) but keep it focused on Augustine's logic.
      *   **Tone:** Academic but accessible, analytical, nuanced. Avoid the "he thinks it's always wrong, period" simplification.

  2.  **Deconstruct Augustine's Position:**
