  This feels near the non-identity problem, but that literature usually asks whether we harm people by causing them to exist with poor lives; here no life is poor, and the concern is about the clustering of properties across a non-identical set rather than about individual welfare. It also does not fit ordinary distributive equality, since equality comparisons across non-overlapping populations are typically dismissed as inapplicable. Is there an established concept—perhaps in population ethics, social choice theory, or political philosophy—for this kind of "structural complaint" regarding uniformity across non-identically generated populations? If not, please coin a precise term, define it, and carefully distinguish it from the non-identity problem, from impersonal value comparisons, and from standard equality concerns, including boundary cases where it might collapse into one of those.

