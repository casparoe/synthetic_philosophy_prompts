  ### Logical Architecture of the Instrument

  Before presenting the tree, here is the logical space from which the branches are derived. The tree is constructed from five independent choice points regarding possibility, consistency, determination, mechanism, and truth.

  1.  **Completion:** Can the infinite sequence occur? (Yes/No)
  2.  **Consistency:** Is the final state logically contradictory? (Yes/No)
  3.  **Mathematical Determinacy:** Does set-theoretic limit reasoning (like the Urn) fix the state? (Yes/No)
  4.  **Physical Determinacy:** Does physical mechanism (like the Loop) fix the state? (Yes/No)
  5.  **Metaphysical Status:** Is the state stipulated, hidden, or indeterminate? (Stipulated/Hidden/Indeterminate)

  There are $2^5 = 32$ theoretical combinations. The tree prunes these down to seven occupied leaves. The unoccupied combinations are largely incoherent (e.g., asserting the task is impossible while also asserting a determinate final state). The tree below navigates this space without revealing the destination at any node.

  ***

  ### The Supertask Classification Tree

  **Node 1 (Completion):** An agent can physically execute the infinite sequence of switchings described.
  *   **No** $\rightarrow$ **Leaf 1**
  *   **Yes** $\rightarrow$ Go to Node 2

  **Node 2 (Consistency):** The proposition "The lamp is on at midnight" is logically inconsistent with the switching history.
  *   **Yes** $\rightarrow$ **Leaf 2**
  *   **No** $\rightarrow$ Go to Node 3

  **Node 3 (Urn Variant):** The set-theoretic limit that renders the urn empty at midnight fixes the lamp's state.
  *   **Yes** $\rightarrow$ **Leaf 3**
  *   **No** $\rightarrow$ Go to Node 4

  **Node 4 (Closed-Loop Variant):** Replacing the schedule with a continuous physical feedback loop resolves the indeterminacy.
  *   **Yes** $\rightarrow$ **Leaf 4**
  *   **No** $\rightarrow$ Go to Node 5

  **Node 5 (Stipulation):** To complete the story, one must stipulate the state at midnight.
  *   **Yes** $\rightarrow$ **Leaf 5**
  *   **No** $\rightarrow$ Go to Node 6

  **Node 6 (Audit Variant):** In the audit case at 12:01, the question "Was it on?" lacks a truth value.
  *   **Yes** $\rightarrow$ **Leaf 6**
  *   **No** $\rightarrow$ **Leaf 7**

  ***

  ### Leaf Descriptions and Awkward Commitments

  **Leaf 1: Hard Impossibilism**
  *   **Position:** The schedule cannot be completed and no question about midnight arises.
  *   **Awkward Commitment:** You must deny the coherence of standard continuous time or infinite divisibility, potentially undermining the calculus used in physics.

  **Leaf 2: Logical Contradictionism**
  *   **Position:** The description is itself contradictory and no such lamp is so much as possible.
  *   **Awkward Commitment:** You are committed to the view that logical consistency constrains physical possibility more tightly than most scientific models allow.

  **Leaf 3: Mathematical Continuityism**
  *   **Position:** Reaches a determinate on or off by a principled rule about the togglings (the limit) rather than by stipulation.
  *   **Awkward Commitment:** You must accept that a function can have a definite value at a point where it is discontinuous, or force a limit where the sequence oscillates without converging.

  **Leaf 4: Physical Mechanism Realism**
  *   **Position:** The final state is fixed once the actual mechanism is specified, so that the bare logical question is ill-posed.
  *   **Awkward Commitment:** You make the metaphysical answer depend on engineering details, implying the puzzle dissolves if the switch is heavy enough or slow enough.

  **Leaf 5: Stipulationism**
  *   **Position:** The supertask is performed but the final state is not fixed by anything in the story and must simply be stipulated.
  *   **Awkward Commitment:** You accept that reality can contain brute facts that are entirely arbitrary and untethered to prior causal history.

  **Leaf 6: Ontic Indeterminism**
  *   **Position:** The lamp is neither determinately on nor determinately off at midnight (because predicates do not apply or state admits of degrees).
  *   **Awkward Commitment:** You must embrace truth-value gaps in reality, accepting that some propositions about the physical world are neither true nor false.

  **Leaf 7: Epistemic Hiddenness**
  *   **Position:** The state is determinate but not fixed by history (a "hidden fact").
  *   **Awkward Commitment:** You posit facts that are in principle inaccessible to evidence, even retrospective audit, making them metaphysically idle.

  ***

  ### Logical Space Analysis: Unoccupied Combinations

  The tree leaves 25 theoretical combinations unoccupied. The most significant unoccupied regions are:

  1.  **Impossible Completion + Determinate State:** (Node 1 No + Any Leaf except 1). This is incoherent; if the sequence cannot occur, there is no midnight state to evaluate.
  2.  **Contradictory Description + Possible Completion:** (Node 1 Yes + Node 2 Yes + Any Leaf except 2). If the description is contradictory, the task cannot be possible; holding both implies a paraconsistent logic that tolerates explosion.
  3.  **Mechanism Determines + Stipulation Required:** (Node 4 Yes + Node 5 Yes). This is contradictory; if the mechanism fixes the state, stipulation is redundant.
  4.  **Audit Has Truth Value + Predicates Don't Apply:** (Node 6 No + Leaf 6). If the audit question has a truth value, the predicates "on/off" must apply in some sense; denying this creates a semantic gap.

  These combinations are unoccupied because they represent logical contradictions or unstable philosophical positions that collapse under seminar scrutiny.

  ***

  ### Flagged Collisions

  There are three pairs of leaves that this tree cannot sharply separate. A student's path might land them in one, but their rationale could easily support the other.

  1.  **Leaf 5 (Stipulationism) vs. Leaf 7 (Epistemic Hiddenness):**
      *   **Collision:** Both assert a determinate fact at midnight not fixed by history. The difference is whether we *choose* the fact (Stipulation) or *find* it (Hiddenness).
      *   **Separation Case:** A case where the stipulation leads to a causal paradox (e.g., if stipulating "on" prevents the supertask). The Hiddenness view must say the fact *would* prevent it; the Stipulationist must say we simply cannot stipulate that.

  2.  **Leaf 3 (Continuityism) vs. Leaf 4 (Mechanism Realism):**
      *   **Collision:** If the physical mechanism is modeled continuously, the "Mathematical Limit" and the "Physical Solution" often coincide.
      *   **Separation Case:** A case where the physical mechanism has a threshold that diverges from the mathematical limit (e.g., a switch that fuses after $10^{10}$ toggles). The Mechanist says "Off (broken)"; the Continuityist says "Undefined/limit."

  3.  **Leaf 6 (Ontic Indeterminism) vs. Leaf 2 (Logical Contradictionism):**
      *   **Collision:** Both deny the standard "On/Off" bivalence at midnight. One says "Neither" (Gap), the other says "Impossible" (Contradiction).
      *   **Separation Case:** A case where the lamp is observed at midnight. The Contradictionist says the observation is impossible; the Indeterminist says the observation might yield a third outcome or fail to register.

  ***

  ### The Unaskable Three

  These are three questions you should put to the class that the tree cannot accommodate as branch nodes.

  1.  **"Is time fundamentally discrete or continuous?"**
      *   **Why it resists the tree:** This is a background metaphysical assumption that determines the validity of Node 1, not a choice point within the supertask logic itself; branching on it would dissolve the puzzle before it begins.
  2.  **"Do causal powers supervene on Humean mosaics?"**
      *   **Why it resists the tree:** This concerns the nature of causation underlying Node 4 (Mechanism), but asking it directly requires technical jargon that reveals the "Mechanist" destination, violating the blind-node constraint.
  3.  **"Is the lamp at midnight the same object as the lamp at 11:30?"**
      *   **Why it resists the tree:** This is a diachronic identity question that cuts across all leaves; every position from Impossibilism to Indeterminism must answer it, but it does not cleanly sort them into mutually exclusive categories.
