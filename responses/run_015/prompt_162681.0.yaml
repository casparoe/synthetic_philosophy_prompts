answer: |-
  **Scenario**
  On Santa Cruz Island, a isolated population of island foxes (*Urocyon littoralis*) faces extinction due to a novel neurotoxin released by an invasive spider species. A single juvenile male arises with a *de novo* mutation: a previously non-coding DNA sequence begins expressing a novel peptide in the kidney that binds and neutralizes the toxin. This structural novelty has no homolog in the lineage; the sequence was junk DNA in his parents. The peptide successfully detoxifies his blood, allowing him to survive, hunt, and thrive where others perish. However, the chromosomal rearrangement that enabled the expression also causes complete meiotic failure, rendering him sterile. He lives a full lifespan, contributing causally to his own survival, but leaves no offspring. Shortly after his death, the rest of the population succumbs to the toxin, and the lineage terminates.

  **Argument Derivations**
  *   **Selected-Effect (Neander-style):** Proper function is defined by the actual historical selection of a trait for a specific effect. Since this is the *first* token of the trait, there is no prior selection history. Since the bearer is sterile and the lineage goes extinct, there is no subsequent selection history. Therefore, the condition "selected for" is never satisfied. **Verdict:** The peptide has no proper function; its survival contribution is merely a "lucky effect."
  *   **Causal-Role (Cummins-style):** Function is defined by a trait's current causal contribution to a containing system's capacity. The peptide causally contributes to the organism's capacity to survive in a toxic environment (a capacity the biologist identifies as physiological maintenance). This contribution is occurring right now, independent of history. **Verdict:** The peptide has the function of detoxification, and it is performing it properly.
  *   **Pro-Selection:** Function is what *would* be selected for if the lineage persisted.
      *   *Interpretation A (Actual Persistence):* If the view requires the lineage to *actually* persist for the counterfactual to ground out, the verdict is **No** (lineage extinct). This collapses Pro-Selection into SE, sharpening your paper by showing the objection targets *historicity itself*, not just *actual* history.
      *   *Interpretation B (Dispositional):* If the view asks only if the trait *is selectable* (i.e., confers fitness advantage) in principle, the verdict is **Yes**. The trait *would* be selected *if* the sterility linker were absent. This separates Pro-Selection from SE: SE requires *actual* selection events; Pro-Selection requires only *selectability*.

  **Key Feature & Flip Condition**
  The work is done by the **combination of *de novo* origin and terminal sterility/extinction**.
  *   If you remove **sterility/extinction** (the fox reproduces), SE flips to "Yes" (history begins), aligning with CR.
  *   If you remove **novelty** (the peptide is homologous to an ancestral gene), SE flips to "Yes" (function inherited via homology), aligning with CR.

  **Best Selected-Effect Replies**
  1.  **The "Historical Kind" Reply:** Functions are historical kinds like "being a heart" or "being a coin." Just as a perfect counterfeit coin has no monetary function despite looking identical, this peptide has no biological function despite working. The biologist's "yes" is loose talk; the philosopher's "no" is strict.
  2.  **The "Systemic Function" Reply:** The peptide has a *systemic* causal role (Cummins-function), but not a *proper* function. We should not conflate the two. The objection only works if you insist proper function must track current utility, which SE denies by definition.

  **Constraint Check & Pro-Selection Rebuild**
  Your combination is **satisfiable**, but with a caveat. To make Pro-Selection say "Yes" while SE says "No," you must adopt **Interpretation B (Dispositional)** above. This requires defining Pro-Selection as tracking *fitness contribution potential* rather than *lineage persistence*. If you do this, the case isolates SE (Actual History) from both CR (Current Causation) and Pro-Selection (Counterfactual History). However, many proponents of Pro-Selection (e.g., Bigelow & Pargetter) tie function to the *actual* survival of the system. If you hold that constraint, Pro-Selection says "No," which **sharpens** your paper: it demonstrates that *any* view tying function to lineage persistence (actual or counterfactual) fails the "first bearer" test, forcing a choice between ahistorical views (CR) or accepting that novelty is functionless until replicated. I recommend keeping the extinction clause; it makes the "Wait a few generations" reply impossible and forces the SE theorist to bite the bullet that the first, life-saving mutant is functionally identical to a useless spandrel.
