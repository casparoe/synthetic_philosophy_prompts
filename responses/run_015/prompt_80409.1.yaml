answer: |-
  Here is the menu of readings for the slogan **"A forgery is a lie, not just a bad copy"** as applied to your specific case (a perfect, documented, non-deceptive replica).

  ### 1. The Deception Claim
  *   **The Claim:** The object is a "lie" because it involves an intent to defraud a viewer or buyer about its identity.
  *   **Verdict:** **False.**
  *   **Reasoning:** You specified that "nobody is passing it off" and paperwork distinguishes it. By the standard legal and ethical definition, this object is not a forgery because there is no *mens rea* (guilty mind) regarding deception.
  *   **Supports "Missing Something"?** **No.** Since the premise of deception is absent, this reading cannot explain why the object lacks value. It collapses immediately in this context.

  ### 2. The Intention Claim
  *   **The Claim:** The object is a "lie" because the maker's intention was to *reproduce* rather than to *express*. The "lie" is a mismatch between the creative impulse of the original and the technical execution of the copy.
  *   **Verdict:** **Defensible.**
  *   **Reasoning:** Philosophical aesthetics (e.g., Collingwood) often distinguish between "art proper" (expression of emotion/idea) and "craft" (technical reproduction). Even with perfect notes, the replicator is executing a plan, not generating one.
  *   **Supports "Missing Something"?** **Yes.** It suggests the replica lacks **creative agency**. It is a vessel of someone else's will, which is a substantive ontological deficit.

  ### 3. The Causal History Claim
  *   **The Claim:** The object is a "lie" because its physical properties suggest a history of creation it did not undergo. It claims (via its material presence) to have been touched by the Master, but it was not.
  *   **Verdict:** **Defensible.**
  *   **Reasoning:** This is the Nelson Goodman argument (*Languages of Art*). Paintings are "autographic"; their history of production is constitutive of their identity. A perfect duplicate lacks the correct causal chain linking it to the artist's hand.
  *   **Supports "Missing Something"?** **Yes.** It suggests the replica lacks **provenance**. It is not just an image; it is a specific physical event in spacetime that cannot be repeated.

  ### 4. The Authorship Claim
  *   **The Claim:** The object is a "lie" because it attributes the work to an agent who did not perform the final act of creation.
  *   **Verdict:** **Defensible.**
  *   **Reasoning:** Even with workshop records, the "author" of the physical strokes is the replicator, not the original artist. To treat it as the artist's work is a category error.
  *   **Supports "Missing Something"?** **Yes.** It suggests the replica lacks the **"aura" (Benjamin)**. The specific human trace of the original genius is irrecoverable, regardless of visual fidelity.

  ### 5. The Institutional Status Claim
  *   **The Claim:** The object is a "lie" because the "Artworld" (museums, markets, critics) refuses to confer the status of *The Work* upon it.
  *   **Verdict:** **Platitude.**
  *   **Reasoning:** It is descriptively true that institutions classify it differently (as a replica/facsimile) and price it differently. This is a tautology of how the system functions.
  *   **Supports "Missing Something"?** **Trivially.** It confirms the replica lacks **market/museum status**, but this is a social convention, not necessarily an inherent property of the object. It explains the price difference, but not necessarily the *ontological* difference.

  ### 6. The Aesthetic Value Claim
  *   **The Claim:** The object is a "lie" because knowing it is a copy fundamentally alters the aesthetic experience, rendering it inferior even if visually identical.
  *   **Verdict:** **Contestable / Defensible.**
  *   **Reasoning:** If aesthetic value is purely perceptual, this is **False** (you said they are indistinguishable on the table). If aesthetic value is knowledge-dependent (we value the *achievement* of the artist, not just the retinal stimulus), this is **Defensible**.
  *   **Supports "Missing Something"?** **Conditionally.** It suggests the replica lacks **artistic achievement**. We admire the original for solving problems; we admire the copy only for mimicking solutions.

  ### 7. The Moral Status Claim
  *   **The Claim:** The object is a "lie" because it is ethically tainted by its nature as a non-original, regardless of fraud.
  *   **Verdict:** **False.**
  *   **Reasoning:** There is no victim, no fraud, and no violation of rights. Calling a documented replica "immoral" or "tainted" is a category error unless one believes copying itself is sinful.
  *   **Supports "Missing Something"?** **No.** There is no moral deficit in a transparent replica.

  ### Summary Verdict
  The slogan only does the work the speaker wants it to do if you interpret "lie" **metaphorically** (Readings 2, 3, and 4).
  *   If you interpret "lie" **literally** (Readings 1 and 7), the slogan is **false** for this object.
  *   If you interpret "lie" **institutionally** (Reading 5), the slogan is **true but trivial**.
  *   If you interpret "lie" **ontologically** (Readings 2, 3, 4, and 6), the slogan is **defensible** and successfully argues that the replica lacks **agency, history, and achievement**, even if it possesses visual fidelity.
