      *   *Defeater 4 (Awkward):* Artistic Creation. A poem written in a diary no one reads. Mind-independent? Yes (ink/paper). Simulated? No. But if written in a sim? CTC says no. But the skill is real.

      *Collapse Analysis:* The view is unstable. It wants to be Objective (mind-independent) but relies on Epistemic access (transparency) and Structural features (isomorphism).

