      *   To Phenomenalism: If "structural isomorphism" is enough, then the *quality of the experience of resistance* is what matters, not the ontology.

      *British English Check:* "Realise" vs "Realize", "Centre" vs "Center", "Programme" vs "Program", "Defence" vs "Defense". Tone should be academic and polite.

  7.  **Final Polish of the Arguments:**

