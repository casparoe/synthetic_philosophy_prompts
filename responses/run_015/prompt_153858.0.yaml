answer: |-
  Hi there, it sounds like a fantastic group and a challenging topic, and I think you are right to push for an experiential approach rather than a standard seminar discussion because the boundary problem is one of those philosophical puzzles that feels abstract until you are the one being excluded by the rule you just wrote. To make this work in ninety minutes with twelve participants, you need to structure the room so that the procedural confusion becomes the lesson rather than an obstacle to be cleared away, and the core mechanism relies on a delayed reveal of facts that interact with the principles they choose. Before the workshop starts, you should prepare twelve sealed envelopes, each containing a role card, and keep a separate master list for yourself that you will reveal later. Ten of the envelopes should contain cards that simply say Voting Member, while one should say Proxy for Future Generations and another should say Proxy for the Local River Watershed, but do not tell them this distribution yet. You also need a whiteboard or large sheet of paper to record the membership principle they draft, and you should have a set of colored voting tokens ready, giving one to every person at the start so everyone feels initially included.

  The session should begin by telling them that their task is to constitute themselves as a legitimate democratic body capable of making binding decisions, but that before they can make any substantive decisions, they must first agree on the rule that determines who is allowed to vote on anything, including the rule itself. Hand out the envelopes and the voting tokens immediately, instructing them not to open the envelopes until you signal the reveal phase, which creates an initial assumption of equality among the twelve. For the first twenty minutes, let them struggle with drafting the membership principle without giving them any criteria, and you will likely hear them suggest things like citizenship, residency, being affected by decisions, or being subject to the laws. Your role here is to act as a neutral secretary, writing their proposed principles on the board exactly as they phrase them, while refusing to answer questions about whether specific people qualify because you want them to realize they lack the factual basis to apply the rule yet. This is the first layer of the paradox, where they are trying to define the subject without knowing the object, and you should resist the urge to clarify the ambiguity because that ambiguity is where the philosophical tension lives.

  At the thirty-minute mark, you trigger the reveal by asking them to open their envelopes and then handing out a factual dossier that corresponds to the specific people in the room, which is where your hidden membership list comes into play. This dossier should state specific facts about each role, such as noting that the person holding the River Proxy card represents a non-human entity that cannot speak but is heavily affected by pollution, or that the Future Generations Proxy represents interests that do not yet exist, and crucially, you should include facts about the human voters that might contradict their assumed status, such as labeling two of the Voting Members as temporary visitors who are not subject to long-term laws or labeling one as a minor who cannot legally consent. Now ask them to apply the principle they drafted on the board to these new facts to determine who actually holds a valid vote, and this is where the simulation should hit a wall because if they chose the all-affected principle, the River Proxy might demand veto power over human voters, or if they chose the all-subjected principle, the temporary visitors might suddenly be disenfranchised despite holding tokens. The circularity becomes visceral here because they are using their current votes to decide if their current votes are valid, and if the River Proxy claims that the principle grants them equal standing, the human voters must vote on whether to allow the River to vote, which presupposes the very boundary they are trying to set.

  Give them about twenty minutes to wrestle with this application phase, and expect the conversation to fracture as people realize their own voting rights are contingent on a rule they might not have voted for if they knew the outcome. If they try to vote on the membership rule before resolving who is eligible to vote, let them proceed until the count is challenged, because that moment of procedural collapse is exactly what you want to analyze later. Once the tension peaks or time runs low, stop the activity and move into the debrief, which should take up the final thirty minutes of the workshop. Start by asking them how it felt to discover their membership was conditional, and then map their experience back to the concept of recursive legitimation, pointing out that they just experienced the impossibility of democratically deciding the demos without already having a demos to make the decision. You should highlight the tension they felt between the all-affected and all-subjected principles, noting how the all-affected principle tended to expand the boundary to include the river and future generations while the all-subjected principle contracted it to exclude visitors, and ask them which felt more just versus which felt more practical.

  When discussing the non-human and future proxies, press them on the problem of representing interests that cannot speak, asking whether the proxy card actually solved the problem or just created a new layer of interpretation where the human holding the card imposes their own will on the river. This is a good moment to be frank about what the simulation cannot reproduce, specifically the element of time and democratic learning, because in reality, boundary disputes are settled over decades through constitutional change and cultural shifts rather than in a single ninety-minute burst of procedural negotiation. You should also note that in the real world, there is usually an external enforcer or a historical precedent that stabilizes the boundary, whereas in this room, the boundary was entirely contingent on their immediate agreement, which lacks the weight of actual political history. Acknowledge that the stakes were low because no one was actually losing money or rights, which means the anxiety they felt was intellectual rather than material, and that this safety net is necessary for a workshop but limits the realism of the power dynamics.

  There are a few predictable things that will go wrong the first time you run this, and the most common one is that participants will attempt to vote on the membership principle before they have agreed on what counts as a valid vote, essentially trying to use the tool they are trying to build. When this happens, do not lecture them or stop them immediately, but instead ask a simple procedural question like whether the person holding the River Proxy card is allowed to cast a ballot on this specific motion, which forces them to confront the circularity themselves. If they get stuck in endless procedural loops, you can intervene by suggesting they pause and treat the confusion as data for the debrief rather than a problem to be solved, which validates their struggle as part of the learning objective. Another likely issue is that the humans might gang up on the proxies to exclude them quickly to restore order, so you should be ready to ask in the debrief whether that exclusion was democratic or just a majority power grab disguised as procedure. Finally, make sure you keep strict time during the drafting and reveal phases because the debrief is where the actual philosophical work happens, and if they spend too long trying to fix the game, you will lose the opportunity to analyze why the game was broken in the first place.

  This structure should give you the paradoxical feel you are looking for without requiring them to read dense theory beforehand, and by embedding the niche elements of the river and future generations, you force them to deal with the ecological and temporal boundaries that standard political theory often ignores. The key to success is your restraint as the facilitator, allowing them to feel the frustration of the circularity rather than rescuing them with a correct answer, because the point is to show that there is no clean solution to the boundary problem, only different ways of managing the tension. If you keep the tone curious rather than corrective during the activity, the students will likely leave with a much deeper intuition for why defining the people is the hardest part of democracy, and you will have turned a theoretical abstraction into a lived experience that they can reference throughout the rest of the course.
