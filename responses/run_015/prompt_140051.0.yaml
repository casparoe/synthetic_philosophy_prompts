prompt: |-
  I host a tiny philosophy podcast that basically only my running club listens to, and next week's guest is Glaucon — I know, just work with me, he's agreed to come on and defend the challenge from Republic II himself instead of letting Socrates answer it. My brother-in-law just got a job where nobody checks his hours and he's been needling me about exactly this at Sunday dinner, so I actually want it to be good.

  Draft me eight or nine questions that don't let him just retell the ring story again. I want at least one on: whether the challenge is really a prudential one (why be just, given self-interest) or a demand that justice be shown good in itself and not merely for what it brings — and whether he can even keep those two apart given he explicitly asks for the third kind of good; one on the fact that there is only one ring, so the case is secretly a free-rider case that needs everyone else to keep playing by the rules, and what he says to someone who answers 'because if everyone took that deal the practice collapses'; one on whether he's begging the question by assuming the just person has no internalized motivation that the ring can't switch off, since the ring only removes the audience and not the agent's own dispositions — and what would even count as evidence against his picture of human nature.

  Then two questions built on variants I made up: (1) a leaky ring, where impunity is 95% reliable and you never know in advance which time you'll be seen; (2) a small ring, that only works for petty things and never for the big ones. Does the force of the challenge survive either? For each question, give me the follow-up keyed to the answer he's most likely to give — he'll probably say the question is about a whole life and not one act, or that nature is the same in every case. Close with one question about what would actually satisfy him: is there any answer he'd accept as meeting the challenge, or is part of the point that he can always want the praise of justice stripped one layer further?
