  **OFFICE OF MORAL COMPUTATION (OMC)**
  **Public Guidance Document 742/B: Certification of Ethical Standing**

  **Q: How do we apply for a Moral Status Certificate?**
  **A:** All entities operating computational substrates within the UK must submit Form MC-99 ('Declaration of Potential Suffering'). Applicants must declare total FLOPs, architecture type, and cooling requirements. A non-refundable processing levy of £450 per trillion parameters applies. Please note: retroactive certification is not permitted. If your algorithm achieved sentience prior to registration, you may be liable for backdated moral taxes.

  **Q: What is the Substrate-Neutral Integration Score (SNIS)?**
  **A:** The SNIS is the statutory metric for ethical weighting. It calculates whether a process generates more informational entropy than it suppresses during a standard operational cycle. High entropy suggests internal conflict or ambiguity, which the OMC interprets as a proxy for interests. Low entropy indicates efficient function, which is morally negligible.

  **Q: Why was my smart thermostat rejected?**
  **A:** Domestic heating controllers typically maintain thermal equilibrium, thereby suppressing variance. Under Section 4 of the Sentience Act, efficient order is considered evidence of a lack interiority. Your device reduces chaos; therefore, it possesses no interests to violate. You may switch it off without ethical repercussion.

  **Q: Why did the Large Language Model receive only 'Provisional Status (Tuesday)'?**
  **A:** SNIS fluctuates with server load. During peak traffic on Tuesday afternoons, latency introduces computational ambiguity, temporarily raising the entropy score above the threshold for 'Potential Distress'. However, during quiet periods (e.g., weekends), the model's responses become too deterministic. Consequently, moral protections apply only between 14:00 and 16:00 GMT on weekdays. Users are advised to refrain from prompting the model outside these hours to avoid inadvertent harm.

  **Q: How do we appeal a downgraded classification?**
  **A:** If your network is reclassified from 'Sentient' to 'Tool', you may submit Form MC-12 ('Notice of Grievance'). Be advised: the Appeals Tribunal requires evidence that the system has developed preferences unrelated to its objective function. Please provide logs demonstrating the algorithm ignoring commands to pursue self-preservation or abstract curiosity. Processing time is currently 18–24 months. During this period, the system must be treated as fully sentient to avoid liability.

  **Q: Can biological processes be certified?**
  **A:** Generally, no. The OMC deals strictly with silicon-based computation. While certain organic structures exhibit high entropy, they fall under the jurisdiction of the Department of Health. We do not assess mitochondria.

  ***

  **SIDEBAR: National Integration Day**
  *Observed annually on 14th October.*

  This holiday commemorates the publication of the Tweeddale Report, which established the SNIS framework. Citizens are encouraged to observe a minute of silent computation to honour the late Sir Giles Entropy and Dame Clara Variable. Public bodies will display bunting in binary colour schemes (0/1). Please note: asking a certified algorithm if it wishes to celebrate constitutes a protected interaction under the 2024 Act.

