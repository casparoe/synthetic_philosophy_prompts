  Question and working hypothesis
  The central question is whether inferences drawn from distrusted speakers constitute genuine speaker meaning or merely exploited hearer-side inference. I argue they are genuine speaker meaning, generated not by Grice's Cooperative Principle but by a principle of Strategic Rationality. This principle holds that speakers choose utterances to optimize outcomes given the hearer's likely interpretation, even when goals conflict. The project asks if we can derive adversarial implicatures—such as a negotiator's inflated opening or a liar's careful truth—by assuming the speaker is rational and predictable, while dropping the assumption of shared cooperative goals. My working hypothesis is that adversarial implicature is speaker meaning because the speaker intentionally designs the utterance to trigger the specific inference, relying on the hearer's attribution of rationality rather than benevolence. This reframes meaning as grounded in mutual recognition of agency rather than shared communicative purpose.

  Why the standard derivations leave it open
  Grice's original framework collapses here because the Cooperative Principle requires a shared goal; adversarial contexts define themselves by conflicting goals. If the speaker is actively misleading, the maxim of Quality is flouted or violated, not observed, blocking standard implicature derivation. Neo-Gricean reductions, like Horn's Q and R principles, streamline the maxims but retain the presumption of cooperative efficiency. They explain why a speaker says *this* rather than *that* to be helpful, not why they say *this* to be misleading yet transparently so. Relevance Theory offers a stronger tool by focusing on cognitive effects versus processing effort, but its Communicative Principle of Relevance still presumes the utterance is optimally relevant to the hearer's interests. In adversarial cases, the utterance is relevant to the *speaker's* interests, often at the hearer's expense. Existing models treat adversarial inference as a breakdown, failing to explain systematic cases like the "double bluff." None provide a derivational mechanism that retains interpretive charity regarding rationality while discarding benevolence.

  Method and schedule
  I will employ a case-driven conceptual analysis rather than empirical methods. Psycholinguistic experiments measure processing speed but cannot adjudicate the normative question of whether these inferences count as *meaning*. Signaling-game models offer formal precision but risk abstracting away from nuanced linguistic data required to distinguish meaning from inference. A survey of usage would merely catalog instances without explaining the underlying mechanism. The method involves selecting paradigmatic cases: the legal non-denial, diplomatic ambiguity, and the strategic lie.

  Weeks 1-3: Refine Strategic Rationality and review literature on deception in pragmatics. Weeks 4-6: Develop detailed analyses of three core case studies, mapping inferential paths. Weeks 7-9: Draft the argument, focusing on the distinction between speaker meaning and hearer inference. Weeks 10-12: Revise for clarity and compliance. By focusing on the logic of the inference rather than its psychological reality, I can address the philosophical core without requiring resources beyond textual analysis.

  Possible conclusions and deciding considerations
  Two primary conclusions are possible. First, adversarial implicature is genuine speaker meaning, supported if the speaker's intention to induce the inference is mutually manifest and relies on shared linguistic conventions. This would require showing that the Strategic Rationality principle yields determinate predictions comparable to the Cooperative Principle. Second, it is merely exploited hearer-side inference, supported if the speaker's intention is too opaque or if the inference relies on extra-linguistic knowledge unavailable to a general competent speaker. The deciding consideration is recoverability: can the hearer reconstruct the speaker's reasoning solely from the utterance and the context of conflict? If the inference requires specific knowledge of the speaker's private goals rather than general rationality, it falls outside speaker meaning. A hybrid conclusion might distinguish between institutional adversarial contexts where rules stabilize meaning, and informal lying, where meaning collapses. I will argue for the first conclusion, positing that rationality alone suffices for meaning when intentions are overt, even if hostile.

  Failure conditions and scope
  The project fails if I cannot distinguish adversarial implicature from general behavioral prediction. If interpreting a liar is no different than interpreting a cloud as a sign of rain, linguistic specificities are lost. Additionally, if the "Strategic Rationality" principle proves too vague to generate specific implicatures without ad hoc adjustments, the derivation model collapses. 6,000 words is tight but tractable provided I restrict the analysis to two or three detailed case studies rather than a comprehensive taxonomy. The risk lies in over-formalizing the rationality principle; keeping it conceptual avoids getting bogged down in game-theoretic notation while preserving philosophical rigor.
