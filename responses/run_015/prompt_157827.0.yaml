      *   **Section 5: Failure conditions and scope (~150 words)**
          *   *Goal:* Honest assessment of risks and word count fit.
          *   *Content:* Failure = cannot distinguish from general inference. Scope = 6,000 words is tight but doable if focused on 2-3 cases.
