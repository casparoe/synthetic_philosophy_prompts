      *   **Section 1: Question and working hypothesis (~150 words)**
          *   *Goal:* Define the core question and state the committed stance.
          *   *Content:* Is adversarial implicature genuine speaker meaning? Can it be derived from rationality without cooperativeness?
          *   *Commitment:* I need to choose. Let's argue that it *is* speaker meaning derived from a principle of *strategic rationality* rather than cooperation.
          *   *Drafting:* The central question is whether inferences drawn from distrusted speakers constitute genuine speaker meaning or merely exploited hearer-side inference. I argue they are genuine speaker meaning, generated not by Grice's Cooperative Principle but by a principle of Strategic Rationality. This principle holds that speakers choose utterances to optimize outcomes given the hearer's likely interpretation, even when goals conflict. The project asks if we can derive adversarial implicatures—such as a negotiator's inflated opening or a liar's careful truth—by assuming the speaker is rational and predictable, while dropping the assumption of shared cooperative goals. My working hypothesis is that adversarial implicature is speaker meaning because the speaker intentionally designs the utterance to trigger the specific inference, relying on the hearer's attribution of rationality rather than benevolence. This reframes meaning as grounded in mutual recognition of agency rather than shared purpose.

      *   **Section 2: Why the standard derivations leave it open (~250 words)**
          *   *Goal:* Explain why Grice, Neo-Griceans (Horn, Levinson), and Relevance Theory don't solve this.
          *   *Content:* Grice requires cooperation. Neo-Griceans streamline maxims but keep the cooperative frame. Relevance Theory focuses on cognitive effects but assumes communicative principle of relevance (optimal relevance implies effort worth taking, usually implying cooperation).
          *   *Drafting:* Grice's original framework collapses here because the Cooperative Principle requires a shared goal; adversarial contexts define themselves by conflicting goals. If the speaker is actively misleading, the maxim of Quality is flouted or violated, not observed, blocking standard implicature derivation. Neo-Gricean reductions, like Horn's Q and R principles, streamline the maxims but retain the presumption of cooperative efficiency. They explain why a speaker says *this* rather than *that* to be helpful, not why they say *this* to be misleading yet transparently so. Relevance Theory offers a stronger tool by focusing on cognitive effects versus processing effort, but its Communicative Principle of Relevance still presumes the utterance is optimally relevant to the hearer's interests. In adversarial cases, the utterance is relevant to the *speaker's* interests, often at the hearer's expense. While Sperber and Wilson allow for deception, their framework treats it as an abuse of the relevance mechanism rather than a structured alternative system. Consequently, existing models treat adversarial inference as a breakdown of communication or a parasitic case, failing to explain the systematicity of inferences like the "double bluff." None provide a derivational mechanism that retains interpretive charity regarding rationality while discarding benevolence.

