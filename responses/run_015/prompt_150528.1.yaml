  what's he going to say your final credence in p should be, and which rule is he running: straight pooling on the base rate, or something enkratic where your first-order credence has to land on the fixed point of what you'd judge appropriate given that you hold it, or just withhold and treat it as a decision problem under uncertainty about your own rationality. is there any version where the right answer really is to sit there in epistemic akrasia, holding a first-order credence you yourself judge irrational. and give me the one further case that would actually separate the rules, because every variant i try comes out the same for all three.
