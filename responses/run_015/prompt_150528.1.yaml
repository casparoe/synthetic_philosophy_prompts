  so i've been recieving this one commenter's takes on higher-order evidence cases for years and i want to know if they actually hang together. his verdicts so far: you form a belief while blackout drunk and then learn you were drunk -> basically back to the prior; a trusted expert says your checked-twice argument is wrong but can't point at the error -> move maybe a quater of the way, don't defer; good calibration data saying people at your confidence level on this topic are only right 60% of the time -> shade the number down, keep the direction; you learn you were raised in a community that shaped how you weigh exactly this kind of consideration -> big revision, near suspension; a better-calibrated forecaster disagrees with you but lacks the evidence you have -> barely move.

