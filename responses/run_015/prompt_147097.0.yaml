answer: |-
  Based on the track record you've provided, here is the breakdown of your friend's decision algorithm, her likely verdict on the new case, and an evaluation of your proposed follow-up experiment.

  ### The Verdict on the New Case
  **She refuses.**

  She will not wire the hundred dollars. She will likely file the letter under "interesting anomaly" and throw it away.

  **Why?**
  The smoking gun is her comment on the second mugger case: *"the number stopped mattering somewhere around a billion."*

  This is a direct confession of **Bounded Utility**. To her, $10^{40}$ lives is cognitively equivalent to $10^{100}$ lives, and both are equivalent to "a really big number that maxes out my moral concern." Once you pass the billion-life threshold, adding more zeros does not increase the subjective value of the outcome. Since the cost ($100) is real and bounded, and the benefit is capped at her "billion" utility ceiling, the expected value calculation collapses. The lottery prediction proves the sender is *anomalous*, but it doesn't uncap her utility function.

  ### Analyzing the Implicit Rules
  You identified four candidate rules. Here is how they stack up against her history and the new case.

  **1. Bounded Utility (Stakes Flattening)**
  *   **The Rule:** Value does not scale linearly indefinitely. Beyond a certain point (approx. $10^9$ lives), marginal utility drops to near zero.
  *   **Fit:** Perfect. Explains the rejection of both Muggers ($10^{100}$ and $10^{10^{10}}$). Explains the rejection of the Button Pusher ($10^{20}$).
  *   **The X-Risk Anomaly:** Why does she fund X-risk (astronomical stakes)? Because she views X-risk not as "saving $10^{50}$ simulated people" but as "preserving the *actual* future we inhabit." The utility of *our* future is high, but the probability is the variable. In Pascal's Mugging, the *probability* is the variable attached to a *metaphysical* claim. She treats "real world extinction" differently from "magic torture simulation."
  *   **Prediction for Letter:** **Refuse.** $10^{40}$ is above the cap.

  **2. Evidence-Probability Scaling (Complexity Penalty)**
  *   **The Rule:** The prior probability of a claim must decrease as the complexity/magnitude of the claim increases. One prediction (lottery) does not buy enough credence for a $10^{40}$ impact claim.
  *   **Fit:** Strong. Explains why she rejects the Magic Mugger (zero evidence) and the Button Pusher (zero evidence). It accommodates the X-Risk funding because the mechanism (physics/biology) is low-complexity and grounded, whereas "magic laptop" is high-complexity.
  *   **Prediction for Letter:** **Refuse.** A lottery prediction (LR $\sim 10^7$) is insufficient to overcome the complexity penalty of controlling $10^{40}$ beings (which requires a prior penalty likely exceeding $10^{-40}$). The evidence proves *precognition*, not *causal power over vast simulations*.

  **3. Threat/Exploitation (Straight EV if No Threat)**
  *   **The Rule:** She only rejects muggings because they are adversarial threats. If it's a pure opportunity (positive EV), she takes it.
  *   **Fit:** Weak. She funds X-risk (no threat, pure opportunity) but rejects the Button Pusher (no threat, pure opportunity). The presence or absence of a threat is not the deciding factor; the *grounding* of the claim is.
  *   **Prediction for Letter:** **Ambiguous/Refuse.** If this rule were dominant, the lack of threat combined with the lottery proof might tempt her. But given the Button Pusher precedent, she likely still refuses.

  **4. Policy/Adversarial (Saying Yes Loses)**
  *   **The Rule:** Adopting a policy of paying such claims makes you a target for scams, leading to net loss.
  *   **Fit:** Moderate. This is a pragmatic heuristic for the real world.
  *   **Prediction for Letter:** **Refuse.** Paying a black-box request with no feedback sets a bad precedent.

  ### Which Rule Does the Letter Case Separate?
  The Letter case is specifically designed to test **Rule 2 (Evidence Scaling)** against **Rule 1 (Bounded Utility)**.

  *   **The Variable:** The lottery proof provides objective, non-magical evidence of anomalous ability (LR $\sim 10^7$).
  *   **The Conflict:**
      *   If she accepts, it means her previous refusals were due to **lack of credibility** (Rule 2). The evidence finally pushed the probability high enough to trigger payment.
      *   If she refuses, it means her previous refusals were due to **value capping** (Rule 1) or **mechanism opacity**. The evidence didn't matter because $10^{40}$ is simply too big to process, or because the *mechanism* is still unexplained (unlike X-risk).

  **My Bet:** She refuses. The "billion" comment is too specific to ignore. It suggests a psychological cap on empathy/valuation that no amount of evidence can bypass. Furthermore, the letter explicitly states the mechanism "won't be explained." For someone who funds X-risk based on *mechanisms* (nets stop mosquitoes, asteroids can be deflected), a black-box causal claim is a non-starter, regardless of the lottery proof.

  ### Evaluating Your Proposed Next Case
  **Your Proposal:** Same $10^{40}$ stakes, but the mechanism is physically inspectable and the outcome is checkable afterward.

  **Verdict:** This is an **excellent** experiment. It is the cleanest way to split Bounded Utility from Evidence Scaling.

  *   **Why it works:** It removes the "Credibility" variable entirely. If she can inspect the machine and verify the outcome, the probability approaches 1. The Complexity Penalty (Rule 2) vanishes.
  *   **The Split:**
      *   **If she Pays:** It proves **Bounded Utility is false.** She was refusing before because she didn't *believe* the numbers, not because the numbers were too big. Her rule is Evidence-Scaling.
      *   **If she Refuses:** It proves **Bounded Utility is true.** Even when she *knows* $10^{40}$ lives are at stake, she cannot value them higher than $100. The utility function is hard-capped.

  **Is there a cleaner one?**
  Your proposal is the "Nuclear Option" for testing Bounded Utility. However, to be absolutely rigorous, I would suggest a **Stakes Ladder** modification to your experiment.

  **The Improved Experiment:**
  Run the "Inspectable Mechanism" case at three different stakes levels:
  1.  **1 Million Lives** (Below her "billion" cap).
  2.  **10 Billion Lives** (Just above her "billion" cap).
  3.  **$10^{40}$ Lives** (Astronomical).

  **Why this is better:**
  *   If she pays for #1 and #2 but refuses #3 -> **Bounded Utility** (The cap is real).
  *   If she pays for #1 but refuses #2 and #3 -> **Bounded Utility** (The cap is lower than she thought).
  *   If she refuses #1, #2, and #3 -> **Policy/Pragmatic Rule** (She doesn't trust inspectable machines from strangers, or she rejects the "people-equivalent" framing entirely).
  *   If she pays for all three -> **Straight Expected Value** (She was just skeptical before).

  **Summary:**
  Your friend is running a **Bounded Utility** heuristic with a side-constraint for **Ontological Grounding** (she needs to understand the physics, hence X-risk yes, Mugger no). The Letter case will be refused because the stakes exceed her empathy cap and the mechanism is opaque. Your proposed inspectable experiment is the correct next step to prove whether her limit is on *belief* or on *value*. Add the "Billion" control group to pinpoint the exact asymptote of her moral math.
