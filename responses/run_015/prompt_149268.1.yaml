  # Joint Statement of Adversarial Collaboration: The Function of Costly Ritual

  **Date:** October 26, 2023
  **Parties:** The Strong Handicap Camp & The Institutional Coordination Camp
  **Facilitator:** Doctoral Research Group on Cooperation and Cultural Transmission

  ## I. Shared Claims and Common Ground

  Both camps endorse the following propositions as the baseline for this collaboration. These claims establish the evolutionary and behavioral context without prejudging the specific mechanism of ritual cost.

  1.  **Selection on Costly Traits:** Natural and cultural selection can favor traits that bear substantial individual costs, provided those costs confer differential benefits to the actor (e.g., access to resources, mating opportunities) or stabilize cooperative equilibria that benefit the group.
  2.  **Existence of Expenditure:** Ethnographic and historical records confirm that many documented rituals involve significant material, temporal, or bodily expenditure (e.g., fasting, scarification, pilgrimage) that reduces immediate individual fitness or economic utility.
  3.  **Incompleteness of Single-Factor Models:** Purely functionalist accounts that ignore strategic interaction between individuals are incomplete, just as purely signaling accounts that ignore collective-action problems and the need for common knowledge are incomplete. A robust model must account for both individual incentives and group-level dynamics.
  4.  **Cost as a Stabilizer:** Whether by design or byproduct, the presence of cost in ritual contributes to the stability of the practice by deterring defection or ensuring participation fidelity.

  ## II. Areas of Disagreement

  The following table outlines the specific theoretical divergences. Each position is phrased to be acceptable to the proponent of that view while remaining intelligible to the opposition.

  | Domain of Dispute | Strong Handicap Camp Position | Institutional Coordination Camp Position |
  | :--- | :--- | :--- |
  | **(a) Origin of Cost** | The cost of a ritual is primarily a **signal-design feature**. Wastefulness is selected for because it creates a barrier that filters out free riders, making the signal hard-to-fake and thus honest. | The cost of a ritual is primarily a **coordination byproduct**. Expense arises as friction necessary to generate common knowledge and synchronize collective action, not to advertise individual quality. |
  | **(b) Informational Value** | The informational value of participation depends on **individual-level reputation tracking**. Observers update beliefs about a specific participant's commitment or quality based on their willingness to bear cost. | The informational value of participation depends on **group-level boundary maintenance**. Observers update beliefs about group cohesion and synchronized readiness, regardless of individual variance in status. |
  | **(c) Modern Analogs** | The handicap logic applies **analogously** to modern secular costly practices (e.g., credential inflation, extreme athletics). These function as honest signals of underlying traits despite lacking ancestral religious contexts. | These phenomena are **structurally disanalogous**. Modern secular costs lack the ancestral social context and enforcement mechanisms that made ritual waste informative, serving instead as institutional gatekeeping or arbitrary norms. |

  ## III. Identification of Cruxes

  To move this debate forward, we identify two specific sub-questions (cruxes) where empirical resolution would necessitate a theoretical update for at least one camp.

  **Crux 1: The Credibility Surplus**
  Does ritual expenditure exhibit a measurable "credibility surplus"—costs that exceed the minimum threshold necessary for pure coordination? Furthermore, does this surplus correlate with *individual-level* benefits (e.g., mating opportunities, alliance formation, status mobility) or exclusively with *group-level* benefits (e.g., collective-action success, resource defense)?
  *   *Resolution Condition:* If the surplus correlates strongly with individual benefits independent of group success, the Handicap view is strengthened. If the surplus correlates only with group success or disappears when coordination difficulty is controlled for, the Coordination view is strengthened.

  **Crux 2: Signal Amortization vs. Recurrent Synchronization**
  How does ritual cost distribute across an individual's lifecycle?
  *   *The Handicap Prediction (Amortization):* Ritual costs are front-loaded. Once a reputation for commitment is established, the required cost should depreciate, as the signal has already been sent and verified.
  *   *The Coordination Prediction (Recurrence):* Ritual costs remain recurrent and synchronized. High costs must be borne by veterans and novices alike to maintain the synchronization of the group and the common knowledge of participation, regardless of established reputation.

  ## IV. Empirical Tests and Advance Predictions

  For each crux, we specify a concrete case or dataset and record explicit advance predictions. Each side acknowledges that failure of their prediction would weaken their theoretical position.

  | Crux | Proposed Test / Dataset | Strong Handicap Prediction | Institutional Coordination Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Credibility Surplus** | **Cross-cultural analysis of initiation intensity vs. status mobility.**<br>Dataset: Ethnographic records coding ritual pain/cost against post-ritual individual status gains and group warfare success. | Ritual intensity will positively correlate with individual status mobility (rank, mating success) *independent* of group warfare success. High cost buys individual reputation. | The correlation between ritual intensity and individual status will disappear or reverse once collective-action outcomes (e.g., warfare success) are controlled for. Cost buys group coordination, not individual rank. |
  | **2. Amortization vs. Recurrence** | **Longitudinal study of recurring ritual contributions.**<br>Case: A community with annual costly contributions (e.g., potlatch, feast, or time-intensive ceremony). | Senior members (high reputation) will contribute *less* over time than juniors. Their past costs are amortized; they no longer need to prove commitment. | Senior members will contribute *equal to or more than* juniors. Synchronization requires uniform participation; opting out based on reputation undermines the common knowledge of group unity. |

  ## V. Meta-Assessment: Verbal vs. Substantive Dispute

  We conclude by assessing the nature of our disagreement.

  **1. The Verbal Component:**
  A portion of the dispute is verbal, centering on the definition of "cost." The Handicap camp defines cost functionally as *selected expenditure for honesty*, whereas the Coordination camp defines cost mechanically as *friction required for synchronization*. If we rigorously distinguish between **cost-as-signal-design** and **cost-as-coordination-friction**, we agree that both exist in human societies. Some practices may be primarily friction (e.g., standing for a national anthem), while others are primarily signal (e.g., extreme bodily modification).

  **2. The Residual Substantive Dispute:**
  However, a genuine empirical disagreement remains regarding the *dominant* explanation for high-intensity, high-waste rituals (e.g., prolonged fasting, scarification). The disagreement is not merely semantic; it is about the selection pressure driving the *magnitude* of the cost.
  *   If the magnitude is driven by the need to out-signal rivals (Handicap), we should observe the amortization effect and individual status correlations.
  *   If the magnitude is driven by the need to solve equilibrium selection problems (Coordination), we should observe recurrent uniformity and group-level outcome correlations.

  **3. Normative Implications:**
  Finally, we acknowledge a normative divergence. The Handicap camp implies that reducing ritual cost might undermine cooperation by enabling free-riding. The Coordination camp implies that reducing ritual cost might be possible through alternative synchronization mechanisms (e.g., institutional contracts) without loss of cooperation. Resolving the empirical cruxes above will inform whether ritual waste is an evolutionary inevitability or a solvable coordination tax.

