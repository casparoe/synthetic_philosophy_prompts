answer: |-
  # The Transworld Identity Diagnostic Tree

  This tree is designed to bypass the jargon and test your intuitions on the underlying metaphysical commitments. Start at the root and follow the path that matches your gut reaction to the cases.

  **Note on Haecceitism:** This tree treats the "Bare Difference" question (Haecceitism) as a major branching point early on. While it technically cuts across Identity/Counterpart views, in practice, it clusters the historical positions in a way that makes the diagnostic cleaner. I have flagged where logical space exists but is unoccupied.

  ---

  ### **ROOT: The Ontology Check**
  **Case:** When we say "Humphrey could have won," are we describing a genuine feature of reality (other ways the world *is* or *could be*), or are we just analyzing the truth conditions of a sentence without committing to "other worlds" existing in any robust sense?

  *   **A. It's just a manner of speaking / analyzing sentences.**
      *   → Go to **Leaf 1 (Modal Fictionalism)**.
  *   **B. It describes genuine reality (abstract or concrete).**
      *   → Go to **Node 2**.

  ---

  ### **NODE 2: The Bare Difference Check (Haecceitism)**
  **Case:** Imagine two possible worlds that match perfectly in every qualitative respect (every atom, every property, every history). The *only* difference is that in World 1, Humphrey wins, and in World 2, a qualitatively identical person wins but *isn't* Humphrey (identities are swapped). Is this a real difference between worlds, or an empty stipulation?

  *   **A. It's an empty stipulation. Worlds can't differ without a qualitative difference.** (Anti-Haecceitist)
      *   → Go to **Node 3**.
  *   **B. It's a real difference. "Who is who" is a fact over and above qualities.** (Haecceitist)
      *   → Go to **Node 4**.

  *(Diagnostic Note: If you answered B here but want to be a Counterpart Theorist, you are in **Unoccupied Logical Space**. This is "Haecceitist Counterpart Theory." It is logically coherent but deeply unattractive: if you believe in primitive thisness, you usually want the stronger relation of Transworld Identity. Counterpart Theory is usually motivated by rejecting the metaphysical baggage that allows Haecceitism.)*

  ---

  ### **NODE 3: The "Very Same Guy" Check (Identity vs. Counterpart)**
  *(For Anti-Haecceitists)*
  **Case:** In the world where Humphrey wins, is the winner *numerically identical* to actual Humphrey (one object existing across modal space), or is it a distinct individual who merely resembles him closely enough to count as his representative?

  *   **A. Distinct individual (Representative).**
      *   → Go to **Node 5 (Counterpart Branch)**.
  *   **B. Numerically identical (The Very Same Guy).**
      *   → Go to **Leaf 2 (Plantinga)**.

  ---

  ### **NODE 4: The "Very Same Guy" Check (Identity vs. Counterpart)**
  *(For Haecceitists)*
  **Case:** Same as Node 3. In the world where Humphrey wins, is it *him* or a *representative*?

  *   **A. Distinct individual (Representative).**
      *   → **Unoccupied Logical Space.** (See Note in Node 2).
  *   **B. Numerically identical (The Very Same Guy).**
      *   → Go to **Node 6 (Grounding Branch)**.

  ---

  ### **NODE 5: The "Split" Check (Fission/Everett)**
  *(For Counterpart Theorists)*
  **Case:** In an Everett branching or sci-fi fission scenario, actual Humphrey splits into two future branches. Do *both* resulting people count as Humphrey's counterparts equally, or must the theory pick a unique winner to preserve a one-to-one mapping?

  *   **A. Both count equally (One-Many relation allowed).**
      *   → Go to **Node 7 (Context Check)**.
  *   **B. Must pick a unique winner (One-One relation required).**
      *   → **Unoccupied Logical Space.** This is "Strict Counterpartism." It is logically coherent but redundant: if you insist on one-to-one mapping, you've reinvented Transworld Identity but denied the name. It bites the bullet of denying identity without gaining the benefit of solving fission cases.

  ---

  ### **NODE 6: The "Hook" Check (Stipulation vs. Thisness)**
  *(For Haecceitist Transworld Identity)*
  **Case:** What makes the winner in the other world *Humphrey*? Is it because we *stipulate* by linguistic fiat that we are talking about him, or because Humphrey possesses a metaphysical "hook" (primitive thisness) that tracks him independently of our talk?

  *   **A. Linguistic Stipulation / Direct Reference.** (We just fix the reference).
      *   → Go to **Leaf 3 (Kripke)**.
  *   **B. Metaphysical Hook (Primitive Thisness).** (There is a real property of "Humphrey-ness").
      *   → Go to **Leaf 4 (Adams)**.

  ---

  ### **NODE 7: The "Conversation" Check (Context)**
  *(For Counterpart Theorists)*
  **Case:** Does the truth of "Humphrey is the winner" change depending on the conversational context (e.g., if we care about his biology vs. his political career, does the counterpart relation shift)?

  *   **A. Yes, it shifts with context.**
      *   → Go to **Leaf 5 (Lewis)**.
  *   **B. No, the counterpart relation is fixed by metaphysics.**
      *   → **Unoccupied/Unattractive.** This is "Fixed Counterpartism." It loses Lewis's flexibility to handle intuitive cases while retaining the counterintuitive denial of identity.

  ---

  ### **THE LEAVES**

  #### **Leaf 1: Modal Fictionalism**
  *   **Path:** Root → A.
  *   **Position:** Talk of possible worlds is useful fiction; only the actual world exists.
  *   **The Bullet to Bite:** You have to explain away the overwhelming intuitive sense that reality itself is contingent, reducing "could have been" to "according to the story."

  #### **Leaf 2: Plantinga-Style Transworld Identity (Essences)**
  *   **Path:** Root → B → Node 2(A) → Node 3(B).
  *   **Position:** Humphrey exists across worlds via a qualitative "individual essence" (e.g., origin). Anti-Haecceitist.
  *   **The Bullet to Bite:** You must accept that Humphrey *could not* have had different parents/origins, or else he wouldn't be Humphrey (Origin Essentialism).

  #### **Leaf 3: Kripke-Style Transworld Identity (Stipulation)**
  *   **Path:** Root → B → Node 2(B) → Node 4(B) → Node 6(A).
  *   **Position:** We refer to Humphrey directly across worlds by stipulation; no "essence" mediates the reference. Haecceitist.
  *   **The Bullet to Bite:** You face the "Grounding Problem": if there are no qualitative facts that make it Humphrey, you must accept brute modal facts that feel like magic.

  #### **Leaf 4: Adams-Style Transworld Identity (Primitive Thisness)**
  *   **Path:** Root → B → Node 2(B) → Node 4(B) → Node 6(B).
  *   **Position:** Humphrey has a non-qualitative property ("thisness") that grounds his identity across worlds. Haecceitist.
  *   **The Bullet to Bite:** You must commit to ontologically real, unanalyzable "thisnesses" that exist independently of any qualities, which many find to be metaphysical obscurantism.

  #### **Leaf 5: Lewis's Counterpart Theory**
  *   **Path:** Root → B → Node 2(A) → Node 3(A) → Node 5(A) → Node 7(A).
  *   **Position:** Humphrey is world-bound; "possible Humphrey" is a distinct counterpart selected by context-sensitive similarity. Anti-Haecceitist.
  *   **The Bullet to Bite:** You must deny that *you* could have done otherwise; strictly speaking, only a *copy* of you does otherwise, which clashes violently with how we experience agency and regret.

  ---

  ### **DIAGNOSTIC FLAGS & UNOCCUPIED SPACE**

  **1. The "Haecceitist Counterpartist" (Unoccupied)**
  *   **Logic:** Believes worlds can differ by bare identity swaps (Node 2B) but denies numerical identity across worlds (Node 4A).
  *   **Status:** **Deeply Unattractive.** If you believe identities can swap without qualitative change, you already accept the metaphysical machinery of primitive thisness. Refusing to call that "Transworld Identity" gains you nothing while losing the intuitive benefit of saying "I could have won."

  **2. The "Strict Counterpartist" (Unoccupied)**
  *   **Logic:** Believes in counterparts but insists on a one-to-one relation (Node 5B).
  *   **Status:** **Redundant.** This view denies identity to avoid the "two Humphreys" problem in fission, but by forcing a one-to-one mapping, it reintroduces the exact rigidity problems of Transworld Identity that Counterpart Theory was meant to solve.

  **3. Indistinguishable Leaves?**
  *   **Kripke (Leaf 3) vs. Adams (Leaf 4):** These are very close. The tree separates them on whether the "hook" is linguistic (stipulation) or metaphysical (thisness). In practice, many people slide between these. If your friend says "It's just how we talk, but reality supports it," the tree might wobble. *Flag:* If they can't distinguish stipulation from metaphysics, group them as "Haecceitist TWI."
  *   **Plantinga (Leaf 2) vs. Lewis (Leaf 5):** Both are Anti-Haecceitists. The tree separates them cleanly on Identity vs. Counterpart. However, if a Lewisian adopts a "best candidate" theory that is extremely strict, they functionally mimic Plantinga. *Flag:* Ask the Fission case (Node 5). Lewis *must* allow one-many; Plantinga *must* deny it. That is the hard break.

  **4. The "Context" Axis**
  *   Only Lewis (Leaf 5) takes the "Shifty" option (Node 7A). All Transworld Identity views (Leaves 2, 3, 4) must say Identity is absolute and context-invariant. If your friend says "It's the same guy, but only in this conversation," they are confused—they are describing Counterpart Theory but using Identity language. Push them to Node 3.
