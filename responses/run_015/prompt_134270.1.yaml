      *   Structure: Activity Overview, Materials, Timeline, Mechanics, Debrief, Limitations, Failure Modes, Self-Critique.

      *(Self-Correction on the "Borrowed" mechanic)*: To ensure I hit the prompt's specific requirement about "borrowed or miscounted standing," I will include a specific rule card for 2 of the 12 students that says "You attempted to offset an Academic violation with Environmental good deeds. Your Academic Standing is NULL." This forces the issue of whether domains *should* be fungible.

      *(Refining the Payoff)*: Social-Reputation Points (SRP). Winner gets "Moral Authority" title (bragging rights).

      *(Refining the Failure Mode)*: High schoolers might giggle or treat it as "gotcha." Need to frame it seriously.

      *(Refining the Self-Critique)*: Be honest about the gamification potentially trivializing the moral sentiment.

  11. **Final Review against constraints:**
