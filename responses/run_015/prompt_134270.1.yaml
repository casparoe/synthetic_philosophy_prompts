answer: |-
  # Activity Title: The Partitioned Ledger
  **Topic:** Standing to Blame, Hypocrisy, and Domain-Specificity
  **Time:** 75 Minutes
  **Participants:** 12 Students (4 Triads)
  **Materials:** Role Cards, Standing Ledgers (sealed envelopes), Scenario Deck, Scoreboard (whiteboard), "Reveal Tokens."

  ---

  ## 1. Conceptual Framework (For the Facilitator)
  *   **First-Order Blame:** The claim that a specific act was wrong (e.g., "You cheated").
  *   **Second-Order Standing:** The authority to make that claim (e.g., "I have the right to hold you accountable").
  *   **The Twist:** Standard intuition suggests hypocrisy destroys standing *globally* (if you cheat, you can't blame anyone for anything). This activity enforces a **Domain-Partitioned View**: Hypocrisy in *Academic Integrity* does not strip standing in *Interpersonal Fairness*. However, the "Borrowed Standing" mechanic introduces friction to test if students *feel* this partition is legitimate.

  ## 2. Setup & Roles (5 Minutes)
  Divide the class into **4 Triads**. Each triad consists of:
  1.  **The Blamer:** Initiates the accusation.
  2.  **The Target:** Defends against the accusation.
  3.  **The Observer-Juror:** Verifies facts and awards Social-Reputation Points (SRP).

  **The Three Domains:**
  *   🟢 **Green (Environmental):** Waste, consumption, sustainability.
  *   🔵 **Blue (Academic):** Cheating, plagiarism, effort.
  *   🔴 **Red (Interpersonal):** Lying, gossip, exclusion, kindness.

  **The Currency:** Social-Reputation Points (SRP).
  *   **Goal:** The group with the highest collective SRP wins "Moral Authority" (bragging rights/certificate).
  *   **Stakes:** No money. SRP determines who gets to speak first in the debrief and who assigns the final "verdict" on the club's code of conduct.

  ## 3. The Hidden Ledger Mechanism (5 Minutes)
  Hand each student a sealed **Standing Ledger**. They must not show this to anyone until the "Reveal Phase."

  **Ledger Contents:**
  *   **Status Grid:** Shows their current standing in Green, Blue, and Red.
      *   *Clear:* Full standing to blame in this domain.
      *   *Tainted:* No standing to blame in this domain (Hypocrite).
  *   **The Twist Entry (Distributed to 4 of the 12 students):**
      *   *Entry:* "You previously attempted to offset a 🔵 Blue violation with 🟢 Green good deeds. The Ledger rejects this transfer. Your Blue Standing is **NULL**, and your Green Standing is **Reduced**."
      *   *Purpose:* This simulates the confusion between global and partitioned standing. These students *thought* they had standing, but the ledger enforces the partition (you can't trade domains) and penalizes the attempt.

  ## 4. Gameplay Timeline (30 Minutes)
  **Three Rounds (10 Minutes Each).**

  **Phase A: The Accusation (3 mins)**
  *   **Blamer** draws a **Scenario Card** (e.g., "Target copied homework" [Blue] or "Target littered" [Green]).
  *   Blamer states the accusation publicly: *"I blame you for [Action] because it violates [Domain]."*
  *   **Target** admits or denies. (For the sake of game flow, Targets must admit if the Scenario Card matches their hidden "Secret Sin" card, which they check silently. *Simplification:* To save time, assume the Target is **Guilty** in every round. The focus is on the Blamer's standing, not the Target's guilt.)
      *   *Correction for Flow:* To ensure focus on standing, **all Targets are factually guilty** in this simulation. The only variable is the Blamer's right to speak.

  **Phase B: The Juror's Ruling (3 mins)**
  *   **Juror** confirms the Target's action was indeed a violation of the domain (Fact Check).
  *   Juror awards **+1 SRP** to the Blamer *provisionally*.
  *   *Crucial:* The Juror does *not* know the Blamer's Ledger yet.

  **Phase C: The Ledger Check & Payoff (4 mins)**
  *   Blamer reveals their Ledger status *for that specific domain only* to the Juror.
  *   **Payoff Scheme:**
      *   **Valid Blame (Blamer Clear):** Blamer keeps +1 SRP. Juror gets +1 SRP.
      *   **Hypocritical Blame (Blamer Tainted):** Blamer loses -2 SRP. Juror gets +1 SRP (for catching hypocrisy).
      *   **The "Borrowed" Twist:** If the Blamer holds the "Borrowed Standing" card and tries to blame in the Nullified domain, they lose -3 SRP, and the Juror must announce to the group: *"Standing cannot be transferred across domains."*

  ## 5. The Grand Reveal (10 Minutes)
  1.  **Tally Scores:** Calculate total SRP per Triad.
  2.  **Open Ledgers:** All students open their full Ledgers.
  3.  **The Shock:** Students with the "Borrowed Standing" card reveal they lost points because they assumed good deeds in Green covered bad deeds in Blue.
  4.  **Discussion Prompt:** "Why did the ledger penalize the transfer? Does that match your intuition?"

  ## 6. Debrief & Philosophical Mapping (20 Minutes)
  *Guide the discussion using these specific mappings:*

  **A. First-Order vs. Second-Order (5 mins)**
  *   *Question:* "In Round 1, did anyone factually disagree that the Target did something wrong?" (Likely no).
  *   *Map:* This is **First-Order Blame** (The act is wrong).
  *   *Question:* "Did anyone lose points even though they told the truth?"
  *   *Map:* This is **Second-Order Standing** (The right to speak). The game separates the truth of the claim from the authority of the claimant.

  **B. The Partitioned View (10 mins)**
  *   *Question:* "If you were Tainted in Blue (Academic), were you allowed to blame someone in Red (Interpersonal)?"
  *   *Map:* Most rules allowed this. This supports the **Domain-Partitioned View** of standing (Macalester Bell / Todd's view). Hypocrisy is local, not global.
  *   *Challenge:* "Did it *feel* right to let a cheater blame a bully?"
  *   *Map:* This exposes the instability. If character is holistic, partitioning feels artificial. If standing is about specific relationships, partitioning feels natural.

  **C. The "Borrowed" Mechanic (5 mins)**
  *   *Question:* "For those who had the 'Borrowed' card: Why did the ledger punish you for trying to trade Green points for Blue standing?"
  *   *Map:* This tests **Fungibility**. The game asserts moral domains are *not* fungible currency.
  *   *Philosophical Hook:* Does this match reality? Can we "buy" moral authority in one area by being saintly in another? (e.g., A philanthropist who abuses their spouse).

  ## 7. Honest Note on Limitations
  **What this simulation cannot reproduce:**
  The simulation cannot capture the **emotional force of resentment**. In the game, losing standing costs "points." In reality, losing standing costs *relationships* and triggers reactive attitudes (Strawson). A student in the game might think, "I lost 2 points, whatever." In real life, being told "You have no right to blame me" induces shame or anger. The game gamifies the *logic* of standing but strips away the *affective weight* that gives standing its power. You must supply this via discussion: Ask students, "How would you feel if a teacher punished you for lateness while they were late?"

  ## 8. Predictable Failure Modes & Fixes
  **Failure Mode 1: The "Gotcha" Giggle.**
  *   *Risk:* Students treat the hypocrisy reveal as a joke/insult rather than a philosophical constraint. They might cheer when a Blamer loses points.
  *   *Fix:* Frame the Juror role as a "Guardian of Norms," not a judge in a competition. Before starting, state: "We are testing the stability of moral community, not trying to destroy each other. If you cheer a hypocrisy reveal, you are undermining the seriousness of the norm."

  **Failure Mode 2: Rule Lawyering on Domains.**
  *   *Risk:* A Blamer argues, "Littering is actually Interpersonal because it affects others," trying to shift domains to find where they have standing.
  *   *Fix:* The Facilitator is the Supreme Court on Domain Classification. Keep definitions rigid during the game to enforce the partition. Save the "blurry lines" discussion for the debrief.

  **Failure Mode 3: The "Borrowed" Card Confusion.**
  *   *Risk:* Students with the "Borrowed" card don't understand why they are penalized until too late.
  *   *Fix:* During setup, explicitly state: "Some of you may have assumptions about your standing that the Ledger does not support. Read your Ledger carefully before Round 1."

  ## 9. Self-Critical Note
  **What would change my mind about this design?**
  If, during the debrief, a majority of students argue: *"It shouldn't matter if I cheated on a test (Blue); I still have the right to stop you from bullying someone (Red)."*
  *   **Why this matters:** This feedback would suggest the **Partitioned View** is too intuitive and the simulation failed to generate the necessary tension. The philosophical puzzle relies on the intuition that hypocrisy *does* contaminate character globally. If students effortlessly accept partitioning, the activity fails to illuminate the *problem* of hypocrisy; it merely teaches a rule.
  *   **Debrief Vulnerability:** My reasoning in the debrief risks failing if I prioritize the "Partitioned View" as the correct answer. I must remain neutral. If I steer them toward "Partitioning is correct," I stop doing philosophy and start doing catechism. I must be willing to let them conclude that the Ledger's partitioning is *wrong* and that standing *should* be global. The activity succeeds only if it makes the *conflict* between global and partitioned views palpable, not if it forces one conclusion.

  **Failure Mode that Convincingly Misses the Concept:**
  If students report that the SRP points felt like "video game health bars" completely disconnected from their actual willingness to blame. If they say, "I knew I was a hypocrite, but I blamed anyway because I needed the points," the simulation has prioritized *game mechanics* over *moral psychology*. This would indicate that "Social-Reputation Points" are an inadequate proxy for "Moral Standing," and the activity would need to be redesigned to involve real social consequences (e.g., loss of speaking privileges in the club) rather than abstract points.
