prompt: |-
  I am organizing a 75-minute session for my high school philosophy club—about twelve students, ages 16 to 18—to explore standing to blame and hypocrisy, but I want to move past the generic “who are you to judge” conversation. Please design an in-class role-play that makes participants feel the force of the idea that hypocrisy undermines moral standing to blame, while also injecting a structural twist that is not usually in textbook treatments: the activity should treat standing as domain-partitioned rather than globally lost, using a hidden “standing ledger” that tracks separate moral credentials in environmental conduct, academic integrity, and interpersonal fairness. The rules should assign each student a role (blamer, target, or observer-juror) and a concealed ledger entry showing they have borrowed or miscounted standing across domains. Use only social-reputation points as stakes—no real money—with a payoff scheme that rewards accurate blame but penalizes hypocrisy when the ledger is revealed. Include a clear timeline, the mechanism for the hidden revelation, and a debrief that maps specific moments in the game onto first-order blame versus second-order standing, explaining where the partitioned-standing view gains support and where it feels unstable. Also provide an honest note on which feature of domain-partitioned standing this simulation cannot reproduce and must be supplied by discussion, and tell me what will predictably go wrong the first time I run it and how to handle it. Finally, include a brief self-critical note stating what would change your mind about whether this design genuinely captures the philosophical idea—specifically, which student feedback or failure mode would convince you the mapping misses the concept, and where your reasoning about the debrief is most likely to fail.
