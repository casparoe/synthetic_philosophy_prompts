answer: |-
  Here is a complete seminar plan designed to meet your constraints. It avoids the forbidden vocabulary, accommodates the colour-vision deficiency (CVD) by shifting the stimulus dimension, and uses a payoff scheme that incentivizes relational reasoning without rigging the outcome.

  ### Activity Title: The Permutation Protocol
  **Time:** 80 Minutes
  **Students:** 18 (6 Triads of 3)
  **Forbidden Words:** Qualia, Qualitative, Dennett, Consciousness, Experience (use "State," "Registration," or "Input" instead).

  ---

  ### 1. Materials & Setup (10 Minutes)

  **The Dimension Shift (CVD Accommodation):**
  Do not use colour. Use **Line Orientation**.
  *   **Why:** It is perceptually immediate (like colour) but accessible to students with CVD. It allows for precise mathematical "rotation" (addition modulo 180°).
  *   **Deck:** 12 cards per deck. Each card has a single black line printed on white cardstock.
  *   **Angles:** 0°, 15°, 30°, ... up to 165°.
  *   **Rotation:** A "Global Swap" adds 90° to every card (modulo 180°). A "Partial Swap" rotates only cards 1–6.
  *   **Legend:** A reference sheet numbering the cards 1–12 based on their *current* orientation (e.g., Card 1 is the shallowest slope, Card 12 is the steepest).

  **Roles (Rotate every two rounds):**
  1.  **Subject (S):** Views the deck, orders it, keeps the ledger.
  2.  **Intervener (I):** Holds the "Master Deck." Swaps the Subject's deck between rounds. Keeps the **Truth Log**.
  3.  **Auditor (A):** Sees only the Subject's Ledger and the Intervener's Truth Log *after* the game. Verifies consistency.

  **The Payoff Scheme: "Epistemic Credit"**
  *   **Goal:** Maximize group credit. No individual prizes.
  *   **Currency:** Paper slips (Credit).
  *   **Base Rule:** The group gets 1 Credit for every round where the Subject's report matches the Intervener's Truth Log.
  *   **The Cost of Claiming Change:**
      *   If Subject reports **"No Change"**: Group gets 1 Credit if Log says "Same."
      *   If Subject reports **"Change Detected"**: Group gets 2 Credits if Log says "Different." **BUT**, the Subject must write down *which relational rule broke* (e.g., "Card 3 is no longer between 2 and 4"). If they claim change but cite no broken relation, it counts as "No Change" (max 1 Credit).
      *   **Penalty:** If Subject claims "Change" and Log says "Same," the group loses 1 Credit.
  *   **Why this works:** Silence ("No Change") is safe but low yield. Claiming "Change" is high risk/high reward but *requires* relational evidence. This penalizes "I just feel it's different" assertions, forcing them toward structural discrimination.

  ---

  ### 2. The Rounds (45 Minutes)

  *Instructions to Students:* "You are calibrating a sensor system. Your goal is to track the stability of the input array. Do not discuss your internal states. Communicate only via the Ledger."

  **Round 1: Calibration (Baseline)**
  *   **Action:** Subject orders the deck by slope. Records the order (1–12) in the Ledger.
  *   **Ledger Entry:** "Order confirmed."
  *   **Intervener:** Logs "Baseline."

  **Round 2: The Global Automorphism (The "Dance")**
  *   **Action:** Intervener swaps the deck for a pre-rotated deck (all angles +90°). The *relations* (order) are identical. The *stimuli* are different.
  *   **Subject:** Orders deck. (It looks the same relationally).
  *   **Ledger Entry:** Subject must choose: "Same" or "Different."
  *   **Trap:** If they say "Different" because the lines look steeper, they risk the Penalty (Log says "Same" because the *structure* is preserved). If they say "Same," they get the Credit.
  *   **Goal:** Demonstrate that without a broken relation, "Change" is costly and unjustified.

  **Round 3: The Broken Structure (Partial Swap)**
  *   **Action:** Intervener rotates only Cards 1–6. Cards 7–12 remain static.
  *   **Subject:** Orders deck. The sequence is now broken (e.g., Card 7 is now "steeper" than Card 8).
  *   **Ledger Entry:** Subject should claim "Change" and cite the broken order (e.g., "7 > 8").
  *   **Goal:** Show that detectable change *requires* relational disruption.

  **Round 4: The Phantom Disclosure (False Information)**
  *   **Action:** Intervener performs **No Swap**. However, Intervener writes on the Subject's slip: *"Warning: Array Instability Detected."*
  *   **Subject:** Must decide whether to trust the disclosure or their own discrimination.
  *   **Goal:** Test if "authority" can generate a fact of the matter where there is no structural difference. (Correct play: Ignore disclosure, report "Same").

  **Round 5: The Ineffable Handover (The "Qualia" Trap)**
  *   **Action:** No swap. Subject writes a note to a *new* partner (from another group).
  *   **Constraint:** You cannot mention numbers, order, slopes, or comparisons. You must describe **only the property of Card 1 itself**.
  *   **Partner:** Must guess if their Card 1 has the "same property."
  *   **Goal:** They will fail. They will inevitably use relations ("It's the flattest one"). This demonstrates ineffability failure.

  ---

  ### 3. The Debrief (25 Minutes)

  *Now* you can say "Qualia" and "Dennett." Write **INTRINSIC, INEFFABLE, PRIVATE, DIRECT** on the board.

  **Mapping the Game to the Argument:**

  1.  **Round 2 (Global Swap) → The Incoherence of "Intrinsic":**
      *   *Ask:* "In Round 2, the physical cards changed. Did the 'State' change?"
      *   *Point:* If you said "No," you prioritized structure over stimulus. If you said "Yes," you paid a penalty because you couldn't verify it.
      *   *Philosophical Link:* This is the Chase & Sanborn coffee tasters. If the discrimination profile is identical, what does "different taste" mean? If it has no effect on ordering, naming, or preferring, is it a difference *in* anything?

  2.  **Round 3 (Partial Swap) → Identity Conditions:**
      *   *Ask:* "Why was Round 3 detectable but Round 2 wasn't?"
      *   *Point:* Because the *relations* broke.
      *   *Philosophical Link:* The only way to pin down *which* state you are in is by its place in the quality space. Strip away the relations (the space), and you strip away the identity of the state.

  3.  **Round 5 (Handover) → Ineffability:**
      *   *Ask:* "Who successfully described the property without using relations?"
      *   *Point:* Nobody could. You all used "flattest," "first," etc.
      *   *Philosophical Link:* Qualia are supposed to be ineffable (indescribable). But if you can't describe it even to yourself without referencing its role in your cognitive economy, is it truly ineffable, or just unreported?

  4.  **Round 4 (Phantom Disclosure) → Privileged Access:**
      *   *Ask:* "Did the warning slip change the reality of the cards?"
      *   *Point:* No. But it tempted you to claim a fact you couldn't verify.
      *   *Philosophical Link:* Claims of private access often function like the warning slip—they assert a fact that carries no functional weight.

  ---

  ### 4. Troubleshooting & Predicted Failures

  **1. "It's a Trick / You Stipulated the Answer"**
  *   *Student:* "Round 2 was undetectable only because you told us to order them. If I looked at the ink density, I might have seen the swap."
  *   *Recovery:* "Valid. In philosophy, we call this the 'Inverted Spectrum' problem. But ask yourself: If you *did* notice the ink density, that would be a *relational* difference (Card A is darker than Card B). If there are *no* relational differences available (even in principle), does the 'swap' exist?"

  **2. The CogSci Definition ("Difference = Discriminability")**
  *   *Student:* "If I can't discriminate it, by definition it's not different. So Round 2 is trivial."
  *   *Recovery:* "Exactly. That is the functionalist stance. The 'Qualia Realist' wants to say: 'But I might still *feel* it differently.' This game shows the cost of that claim: you have to pay 'Epistemic Credit' for a fact that changes nothing in the world. Is it worth the price?"

  **3. Memory Erasure Conflation**
  *   *Student:* "I didn't notice Round 2 because I forgot what Round 1 looked like."
  *   *Recovery:* "Good point. That's why we have the Ledger. The Ledger is your externalized memory. If the Ledger (the functional output) is the same, does the 'forgotten feeling' matter?"

  **4. The Intervener Cheating**
  *   *Student:* "The Intervener didn't actually swap the cards in Round 2."
  *   *Recovery:* "Audit the decks. (Keep the swapped decks). Even if they didn't swap, the *possibility* of the swap is the point. If a swap *could* happen without changing the Ledger, is the 'feeling' doing any work?"

  **5. The CVD Student**
  *   *Mitigation:* By using Line Orientation, this is minimized. If a student still struggles, pair them as an **Auditor**. Their job is to check the logic of the Ledger, not the perception of the lines. This makes their role critical and distinct from the sensory task.

  ---

  ### 5. The Honest Limitation (The "Realist" Escape Hatch)

  *This is the most important part of the debrief. Do not skip it.*

  **The Objection:**
  A strong realist will say: *"This whole game is rigged. You swapped the **cards**, not the **experience**. I could have had the exact same cards, and my experience could have inverted without the cards moving. You haven't touched the first-personal seeming."*

  **Your Response:**
  "You are absolutely right. This activity models the **Third-Person Perspective** (the Auditor/Intervener view). From the outside, the 'intrinsic' drop-out looks like incoherence.
  *   **What the game cannot do:** It cannot reproduce the *first-personal authority* you feel when you say 'I know what red looks like.'
  *   **The Dennett/Chase-Sanborn Move:** They argue that this 'first-personal authority' is an illusion generated by the very relational dispositions you just used in the game.
  *   **The Realist Move:** You argue that the game misses the target because the 'what-it-is-like' is the *subject* of the investigation, not the *object*.
  *   **The Stalemate:** We have reached the exact impasse of the reading. The game shows why the Eliminativist thinks the concept is broken (no identity conditions). The Realist thinks the game proves the concept is *private* (outside the game's rules).
  *   **Next Step:** Read Dennett. He argues that the Realist's 'escape hatch' is where the incoherence hides. Your job in the essay is to decide if that hatch is a valid exit or a trap."

  ---

  ### Summary Checklist for TA
  *   [ ] **Print:** 6 Decks of 12 Orientation Cards (Master + Rotated versions).
  *   [ ] **Print:** Ledger Sheets (Columns: Round, Order 1-12, Change Y/N, Relational Reason).
  *   [ ] **Print:** Truth Logs for Interveners.
  *   [ ] **Prepare:** "Epistemic Credit" paper slips.
  *   [ ] **Briefing:** Emphasize "No forbidden words" until debrief.
  *   [ ] **CVD:** Ensure Orientation cards are high contrast (thick black lines).
  *   [ ] **Debrief:** Save 5 minutes at the end for the "Honest Limitation" speech.
