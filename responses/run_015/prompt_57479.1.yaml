answer: |-
  Here is the bottom line: Marcus wins on the philosophy of science and the practical justification for Occam's razor, while Dev wins on the internal coherence of the theoretical framework, but neither fully resolves the core question because Solomonoff induction does not actually eliminate the arbitrariness of the prior, it merely confines it to a constant that is irrelevant only in the limit.

  Starting with the opening exchange, Marcus is technically correct that Solomonoff induction is uncomputable, but he overreaches by claiming this disqualifies it as a theory of reasoning. Dev is right to push back here by distinguishing normative ideals from operational algorithms; Bayesian optimality is often uncomputable in practice yet remains the gold standard for evaluating approximations, so dismissing it as useless because it cannot be steered is a category error. However, Marcus lands a solid hit in his second point regarding the choice of universal machine. He is correct that the invariance theorem only bounds the difference in description length by a constant, and he is also correct that this constant is not just theoretical noise but can dominate inference when data is scarce. Dev's response relying on the limit behavior is where his argument begins to fray, specifically in the analogy you flagged. Comparing the choice of universal machine to inches versus centimetres is shaky because unit conversion involves a known, fixed scaling factor that preserves the ordering of lengths exactly, whereas the constant between two universal Turing machines is unknown, can be arbitrarily large depending on the machines chosen, and can actually flip the ordering of hypothesis probabilities for any finite dataset. When Dev claims the arbitrariness is harmless because it washes out asymptotically, he is conceding Marcus's point that the justification for Occam's razor collapses in the finite regime where science actually takes place, which is exactly what Marcus identifies in his counter that the theorem proves something about the shape of priors rather than the likelihood of truth for specific hypotheses.

  Moving to the final exchanges, Dev is on solid technical ground regarding the dominance property, as it is true that no computable predictor can systematically outperform the universal prior, but his claim that there is no non-arbitrary alternative begs the question since the arbitrariness has simply been relocated to the reference machine. This sets up Marcus's final move about metaphysical commitment, which is not a cheap shot but a foundational critique. Assuming the world is generated by a computable measure is indeed a metaphysical stance; while Dev is right that empirical science assumes laws can be written down, writeability does not guarantee computability, and there are physical models involving real-valued parameters or non-computable dynamics that would fall outside Solomonoff's scope. Marcus is correct that framing this as a technical necessity hides the philosophical assumption that the universe is effectively a computer, which is precisely the kind of substantive claim that requires justification rather than assumption when debating the foundations of induction.

  There are two critical pieces of context neither of them brought up that an expert would have raised to clarify the stalemate. First, the constant in the invariance theorem is not just unknown but can grow according to the Busy Beaver function, meaning it can be astronomically large relative to any conceivable amount of empirical data, so appealing to asymptotic convergence is practically vacuous for any agent situated in the universe. Second, while convergence results do show that the universal prior converges to the true distribution with probability one, the rate of convergence depends on the Kolmogorov complexity of the true distribution relative to the chosen universal machine, meaning that a poorly chosen reference machine could require more data than exists in the observable universe to correct its initial bias. This means the convergence results do not rescue Dev's position because they guarantee success only in a limit that is physically unreachable, leaving the finite data problem entirely open.

  Ultimately, Marcus is more right overall because his objections target the specific claim that Solomonoff induction justifies Occam's razor for actual reasoning agents, whereas Dev defends the elegance of the mathematical structure without solving the translation problem to physical reality. The original question does not have a straight answer because Solomonoff induction formalizes Occam's razor only relative to a chosen universal machine, so it settles the worry about taste only by replacing subjective taste with a technical choice that is equally unconstrained by the theory itself. If the goal is to show that simpler hypotheses are objectively likelier to be true given finite evidence, Solomonoff induction fails to deliver that proof without additional assumptions about the reference machine, but if the goal is to define a coherent upper bound on predictive performance, Dev is correct that it remains the best tool we have.
