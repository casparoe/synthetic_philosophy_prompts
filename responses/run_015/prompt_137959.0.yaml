answer: |-
  Here is an analysis of the commitments presupposed by the practice of diplomatic apology, followed by an assessment of how the practice would mutate if the signaling model were false.

  ### Part I: Categorizing the Commitments

  To determine what the practice strictly requires versus what merely fits it, we must distinguish between the *conceptual conditions* of an apology (what makes it an apology) and the *strategic mechanisms* used to validate it (why we believe it).

  #### 1. Strictly Required Commitments
  These are the conceptual prerequisites without which the practice ceases to be a "diplomatic apology" and becomes something else (e.g., a settlement, a press release, or a tribute).

  *   **Indexicality (Speech Act Felicity):** The practice strictly presupposes that an apology is a performative utterance subject to felicity conditions. As you noted, costly signaling theory is indifferent to the vehicle of the cost, but the practice is not. To apologize is to perform a specific speech act that must refer indexically to the wrong (the *what*), the victims (the *who*), and the location/context (the *where*). A generic expression of sorrow is not an apology; it is a lament. Therefore, the practice requires that the cost be incurred through *specific* recognition, not just magnitude.
  *   **Non-Fungibility of Standing:** The practice presupposes that moral standing (face, honor, status) is a currency distinct from and non-fungible with economic capital. If money were fully fungible with honor, reparations alone would satisfy the wronged party. They do not. The victim demands a transfer of status (abasement, admission), and the apologizer resists because that specific currency is what depletes their political capital. The liability disclaimer confirms this: the state attempts to pay in one currency (regret) while hoarding the other (legal/financial liability).
  *   **Continuity of Agency:** Even when apologizing for a predecessor regime, the practice presupposes a metaphysical continuity of the state. The current government must accept that it is the *same moral agent* as the perpetrator, despite the regime change. Without this commitment, the apology is logically impossible (one cannot apologize for another's crime), and the act becomes merely a humanitarian aid package.

  #### 2. Commitments That Fit Well
  These explanations align with the observed behavior but are not strictly necessary for the concept of the apology to hold.

  *   **Costly Signaling (The Handicap Principle):** This fits the *dynamics* of the negotiation well. It explains why the victim demands cost (to filter out insincere actors) and why the apologizer resists (cost is utility-negative). However, it is not strictly required for the *definition* of the act. One could imagine a low-cost apology that is accepted if trust is already high. The pattern you describe relies on signaling because trust is low, but the practice of apology itself does not logically demand a handicap, only sincerity.
  *   **Future Commitment (Bonding):** The idea that the cost serves as a bond against future repetition fits the "predecessor regime" dynamic very well. Since current leaders cannot feel genuine psychological remorse for acts they did not commit, the "cost" functions as a pledge of future restraint. This fits the data, but it is not strictly required; victims often demand acknowledgment of the *past* suffering as an end in itself, regardless of future utility.

  #### 3. Philosophically Underdetermined
  These are elements where the practice remains ambiguous or operates successfully regardless of the underlying truth.

  *   **Present Remorse:** The practice is underdetermined regarding the inner psychological state of the apologizer. Because the state is a fiction, it cannot "feel." When a leader kneels at a monument, are they expressing personal remorse, institutional regret, or strategic calculation? The practice works regardless. The victim accepts the gesture as a proxy for remorse, but the mechanism does not require actual remorse to function, only the *performance* of it.
  *   **The Efficacy of the Signal:** It is underdetermined whether the cost actually *proves* sincerity or merely *buys* silence. The liability clause suggests the latter (trying to minimize risk), while the public gesture suggests the former (maximizing visibility). The practice straddles the line between genuine moral repair and strategic reputation management, and it is often impossible to distinguish the two from the outside.

  ***

  ### Part II: If the Signaling Picture Were False

  If we assume there is **no reliable way to distinguish a repentant state from an unrepentant one**—meaning cost does not correlate with sincerity, and a cynical state can mimic a repentant one just as easily as a sincere one—the practice of diplomatic apology would undergo a structural collapse. It would cease to be a mechanism for moral repair and would mutate into one of two alternative forms:

  #### 1. Retreat to Pure Legalism (The "Settlement" Model)
  If costly gestures signal nothing, they are wasted resources. The "indexicality requirement" would remain (you still need to name the wrong to settle the claim), but the *performative* elements would vanish.
  *   **Change:** Heads of government would stop traveling to sites. Public abasement would be viewed as irrational theater.
  *   **Result:** The interaction would revert entirely to the "lawyer-drafted regret" you described in the opening, but stripped of the moral pretense. It would become a quiet financial settlement with a non-disclosure agreement. The "apology" would be a line item in a budget, not a speech act. The victim, knowing the signal is noise, would stop demanding honor and demand only enforceable constraints or cash.

  #### 2. Shift to Verifiable Structural Constraints (The "Compliance" Model)
  If we cannot signal *inner* remorse, we must demonstrate *outer* change. The focus would shift from the past (what happened) to the future (what is being mechanically prevented).
  *   **Change:** Instead of demanding a leader kneel at a monument (which is easily faked), victims would demand verifiable institutional changes: curriculum revisions, the dismantling of specific security apparatuses, or third-party monitoring of minority rights.
  *   **Result:** The "cost" would no longer be symbolic (status loss) but functional (sovereignty loss). The apology would transform into a compliance treaty. The "liability clause" would become irrelevant because the focus would be on future monitoring rather than past liability.

  #### 3. The Loss of "Felicity"
  Most critically, if signaling is false, the **speech act fails**. An apology relies on the uptake of the victim. If the victim knows the signal is unreliable, they cannot accept the apology as "felicitous."
  *   **Change:** The ritual would become hollow. We would see "apology inflation," where states issue endless specific apologies with high costs because the currency has been debased.
  *   **Result:** The practice would likely be abandoned in favor of **Truth Commissions**. Unlike an apology, which relies on the sincerity of the perpetrator, a Truth Commission relies on the verification of facts by a neutral body. If you cannot trust the signal, you stop listening to the sender and start auditing the records.

  ### Summary
  The practice strictly requires that **status is non-fungible** and that **speech acts must be indexical**. It fits well with **costly signaling**, but it is underdetermined regarding **actual remorse**. If signaling were proven impossible, the ritual of the diplomatic apology would dissolve. It would be replaced by either cold financial settlements or rigorous structural treaties, as the "middle ground" of symbolic moral repair depends entirely on the belief that pain inflicted on the ego reliably indicates a change in the heart.
