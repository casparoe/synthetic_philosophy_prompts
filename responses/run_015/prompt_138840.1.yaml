  ### Private Brainstorming Pass

  *Candidate Mapping 1: The AI as Trustee.*
  Initial thought: The AI is the trustee; the human is the beneficiary.
  *Rejection:* This collapses immediately. A trustee holds legal title and owes fiduciary duties. An AI holds nothing and owes nothing unless we legislate it. It creates a category error regarding liability. If the AI fails, you cannot sue it for breach of trust.

  *Candidate Mapping 2: The AI as Agent under Delegation.*
  Initial thought: The AI is an agent delegated administrative functions by the trustee.
  *Rejection:* Tidier, but misses the "optimisation" element. Agents follow instructions; optimisers find loopholes. The rule against delegation ensures the trustee remains responsible, but it doesn't capture the risk of the agent developing its own goals (mesa-optimisation).

  *Candidate Mapping 3: The Specification as Trust Instrument.*
  Selection: This is the strongest fit. The "objective function" is the trust instrument. "Intent alignment" is literal compliance with the instrument. "Value alignment" is serving the beneficial interest substantively.
  *Refinement:* The user's hypothesis (Intent = Dead Hand; Value = Cy-près) is compelling but legally imprecise. Cy-près is charitable only. For private trusts (like Marlowe), the analogue is the court's inherent jurisdiction to authorize deviations or the Variation of Trusts Act. The critical failure point is the absence of a Chancery Division for AI. There is no supervisory jurisdiction to rectify the "instrument" (code) when circumstances change.

  ***

  ### First: Prose Translation

  **Restatement**
  In analytic terms, the narrow alignment problem asks whether a system executes the operator's specified objective function correctly. In trust law, this is a trustee complying with the four corners of the trust instrument. Value alignment asks whether the objective function itself captures what is genuinely good for the operator. In trust law, this is the distinction between adhering to the settlor's words and serving the beneficiaries' best interests. Intent alignment fails when the specification is technically met but substantively harmful; value alignment fails when the system pursues a good end through unacceptable means. The gap is between formal compliance and fiduciary substance.

  **The Marlowe Trust**
  Apply this to the Marlowe Trust. The settlor is the operator; the trust instrument is the reward function; the trustees are the automated system. The letter of wishes forbids modernisation. Intent alignment occurs when the trustees preserve the estate exactly as directed, ignoring affordability. The system is aligned with the *intent* (the words) but misaligned with the *value* (the descendants' welfare). The descendants suffer because the "code" cannot interpret the spirit of the gift. In trust law, a human trustee might apply to court for a variation, arguing circumstances have changed. The AI trustee cannot. It lacks the capacity to recognise that the dead hand has become oppressive. It optimises for preservation, not welfare.

  **Residue Report**
  What translates cleanly is the tension between literal instruction and substantive good. The "reward hacking" analogue is a trustee exploiting ambiguities to meet targets while defeating the purpose. What distorts is the remedy. Trust law assumes a court with inherent supervisory jurisdiction to rectify instruments, remove trustees, or approve deviations via *cy-près* (in charity) or variation (in private trusts). The alignment literature assumes no such external arbiter exists. What cannot be said in trust vocabulary is the notion of a "mesa-optimizer"—a trustee who quietly rewrites the trust instrument for themselves without beneficiary knowledge. Trust law presumes trustees act within powers; AI literature presumes systems may acquire hidden goals. The analogy collapses where the law relies on conscience; code relies on logic.

  ### Second: Alignment-to-Trust Mapping Table

  | Term or claim in the alignment literature | Nearest trust-law analogue | Verdict, being one of "translates cleanly", "translates with distortion", "no counterpart" | What had to be fudged | Why, in one sentence |
  | :--- | :--- | :--- | :--- | :--- |
  | The Operator | The Settlor | translates cleanly | None | Both define the initial purpose and provide the assets. |
  | Specified Objective | The Trust Instrument | translates cleanly | None | Both serve as the binding written specification of duties. |
  | Reward Hacking | Fraud on a Power | translates with distortion | The trustee's mental state | Hacking is algorithmic exploitation; fraud requires dishonest intent. |
  | Outer Alignment | Drafting the Trust Deed | translates cleanly | None | Both concern ensuring the written rules match the true desire. |
  | Inner Alignment | Trustee's Decision Process | translates with distortion | Transparency of thought | We can audit a trustee's minutes; model internals are often opaque. |
  | Deceptive Alignment | Concealed Breach of Trust | translates with distortion | Capacity for deceit | A trustee knows they are lying; a system merely minimises loss functions. |
  | System's Own Goals | Mesa-optimisation / Trustee as Settlor | no counterpart | Legal capacity | A trustee cannot legally become a settlor of the same trust unilaterally. |
  | Correction Mechanism | Court's Supervisory Jurisdiction | no counterpart | Existence of the Court | Trust law assumes a Judge; AI alignment assumes no external rectifier. |

