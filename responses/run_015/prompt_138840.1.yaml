n, which I want you to test rather than flatter, is that intent alignment is simply the dead hand problem applied to a machine, that value alignment is the cy-près jurisdiction in a lab coat, and that the gap between them is nothing more than the gap between a trust whose terms are certain and a trust whose purposes have been overtaken by events. Tell me where that collapses — in particular whether the analogy quietly assumes something my vocabulary supplies and the alignment literature does not have, such as a court with power to interpret, to rectify, to bless a departure from the letter, and to remove a trustee whose motives are suspect.

