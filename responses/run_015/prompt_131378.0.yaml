answer: |-
  1. **The CDT Smuggling Objection**
     **Question:** You're building this view on a "no-mirror constraint" to stop infinite regress, but doesn't that just smuggle Causal Decision Theory in through the back door? If I stop modeling you modeling me at level three, aren't I effectively treating your choice as causally independent from mine again?
     **Follow-up:** *(Anticipating he'll say it's about epistemic access, not causation)*: But if the output is the same as CDT—where I ignore the correlation once the recursion gets deep—how do you distinguish this from just giving up on evidential reasoning? Or are you okay with the charge that this turns rational choice into magical thinking about causation whenever the recursion limit isn't hit?

  2. **The Arbitrariness of the Cutoff**
     **Question:** Let's look at the Luring Lottery. You claim superrationality holds inside a three-level recursion cutoff. But what exactly breaks in the lottery if the predictor can model reasoning up to level four but not five? Is there a mathematical discontinuity there, or is the number three just a placeholder?
     **Follow-up:** *(Anticipating he'll say higher levels introduce logical incoherence)*: But if the logic holds at level three, why doesn't moving the boundary just push the paradox up one level? If I can model you at level four, haven't I just recreated the same evidential link you claimed was stable at level three?

  3. **Prisoner's Dilemma and Dominance**
     **Question:** Does your version of indexed evidentialism force rational agents to always coordinate in one-shot Prisoner's Dilemmas, even when defection strictly dominates? If I have evidence that you're reasoning like me, does your view say I'm irrational to defect even if I gain more regardless of your move?
     **Follow-up:** *(Anticipating he'll say dominance only applies outside the index)*: So you're saying the dominance principle is conditional on the recursion depth? That seems like a heavy bullet to bite—essentially telling agents to ignore guaranteed payoffs because of a hypothetical correlation that vanishes if they think too hard about it.

  4. **Moral Status and Transparency**
     **Question:** If rationality depends on how deeply a predictor can model you, does that mean moral status or blame depends on how transparent your reasoning is to outside observers? Are opaque thinkers less responsible because they fall outside the superrational cutoff?
     **Follow-up:** *(Anticipating he'll deny moral implications)*: But if your decision theory dictates what you "ought" to do, and that changes based on external modeling capacity, aren't you making moral obligation contingent on someone else's computational power? That seems like luck, not responsibility.

  5. **Falsifying the Three-Level Claim**
     **Question:** What evidence could actually count against the three-level cutoff? I'm not looking for intuitions—what concrete scenario or result would falsify the claim that recursion breaks specifically at three?
     **Follow-up:** *(Anticipating he'll say it's a conceptual truth)*: If it's conceptual, how do you respond to agents who claim they can comfortably reason at level five without contradiction? Are you saying they're mistaken about their own cognitive access, or that your theory doesn't apply to them?

  6. **Platonia Dilemma Application**
     **Question:** In the Platonia Dilemma, standard EDT often suggests randomizing to avoid collision. With your no-mirror constraint, do agents submit or not? Does the cutoff force everyone to act as if they're the unique submitter, or does it collapse back into everyone submitting and losing?
     **Follow-up:** *(Anticipating he'll suggest a mixed strategy)*: If everyone adopts that mixed strategy based on your cutoff, doesn't that create a new correlation pattern that violates the original assumption? Are you sure the equilibrium holds once everyone knows the rule?

  7. **The "Index" in Indexed Evidentialism**
     **Question:** You call this "indexed" evidentialism. What exactly is the index tracking? Is it my physical location, my computational state, or something else? If two agents are identical but have different indices, do they make different choices?
     **Follow-up:** *(Anticipating he'll say it's about epistemic perspective)*: But if the index is just epistemic perspective, aren't we back to subjective Bayesianism where two people can look at the same data and rationally do opposite things? How do you coordinate action if the index splits us?

  8. **Self-Prediction Stability**
     **Question:** The no-mirror constraint stops me from modeling you modeling me. But what stops me from modeling myself modeling myself? Does self-prediction trigger the constraint immediately, or do I get a free pass to model my own reasoning indefinitely?
     **Follow-up:** *(Anticipating he'll say self-modeling is limited too)*: If self-modeling is limited, how do I verify I'm following your theory? If I can't model my own reasoning past level three, how can I be sure I'm not violating the constraint right now?
