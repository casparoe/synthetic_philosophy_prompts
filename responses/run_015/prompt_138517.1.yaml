answer: |-
  This is a remarkably sharp set of questions. You've identified the friction points where moral theory grinds against institutional machinery. Given your background, you'll appreciate that moral philosophy often struggles with the same problem geochemistry does: distinguishing signal from noise, and natural kinds from instrumental categories.

  Here is an analysis of the apparatus you're describing, treating the "duty/supererogation" distinction as a dataset we are trying to model.

  ### 1. The Line: Phase Boundary or Bookkeeping?

  You ask whether the duty/beyond-duty line is a real phase boundary or a line drawn for bookkeeping. In the philosophical literature (specifically following J.O. Urmson's 1958 paper *Saints and Heroes*), the standard view is that it is a **bookkeeping line**, but one that is treated *as if* it were a phase boundary to maintain system stability.

  If it were a true phase boundary (a natural kind), the moral status of the act would inhere in the act itself. But as you noted, the line moves based on context (lifeguard vs. sunbather) and jurisdiction (Bad Samaritan laws in France vs. common law in the UK/US). This variability suggests the line is not measuring an intrinsic property of the "swim," but rather the **assignment of risk liability.**

  What fixes where the line sits? It is primarily a function of **role-based expectation** and **enforceability**.
  *   **Role:** The lifeguard has contracted to absorb risk. The sunbather has not. When the sunbather absorbs risk voluntarily, they are subsidizing the public good beyond their tax/contractual contribution. That subsidy is what we label "heroism."
  *   **Enforceability:** We cannot practically compel high-risk behavior without a coercive apparatus so heavy it breaks the social contract. Therefore, we set the "duty" line at the limit of what can be reasonably enforced (or what is explicitly contracted). Everything above that line is "supererogatory."

  Regarding the crowd: If your duty shrinks because others have boats, this supports the bookkeeping view. It suggests duty is not a fixed moral mass, but a **distributed load**. Supererogation, in this light, is often just the act of picking up a load that was distributed but dropped by others. It implies that much of what we call "heroism" is actually **system failure compensation**. The hero is the person who acts when the institutional allocation of duty has failed to cover the risk.

  ### 2. Deflationary Story vs. Genuine Category

  Is there a genuine third category, or is praise just an incentive where compulsion is too expensive?

  The **deflationary story** (praise as incentive) predicts the "no credit transfer" rule much better than the "genuine moral category" story.

  If supererogation were a genuine moral bank account—where you accumulate moral credit—the logic of banking suggests you should be able to spend it. If I have saved five lives, surely I have earned the right to be mildly selfish later? But institutions (courts, HR departments, military justice) explicitly reject this. A war hero who commits murder is not treated more leniently.

  Why? Because the apparatus is not designed to track **moral net worth**; it is designed to manage **future risk**.
  *   **Praise** is a forward-looking incentive mechanism. It says, "We want more of this behavior."
  *   **Blame/Punishment** is a forward-looking deterrent. It says, "We want less of this behavior."

  If you allowed credit transfer, you would create **moral hazard**. A soldier might think, "I stormed the hill in 2020, so I can shirk in 2024." This undermines the reliability of the institution. The "no credit transfer" rule ensures that every decision point is treated as a fresh liability assessment. The deflationary story explains this perfectly: the medal buys future compliance from *others*, not future leniency for *you*.

  ### 3. The Asymmetry: Why no "Suberogatory"?

  You note there is no negative counterpart: the "nasty-but-permitted" zone (not visiting your mother, letting a friendship die). In philosophy, this is sometimes called the **suberogatory**.

  The absence of an institutional category for this is not a gap; it is a feature of **enforcement costs**.
  *   **Praise is cheap.** Giving a medal costs money, but it doesn't require a trial, a prison, or a police force.
  *   **Blame is expensive.** To formally categorize an act as "bad but permissible" implies you have investigated it. To investigate it requires a bureaucracy.

  If you institutionalize the "suberogatory," you risk sliding into policing private life. If the state says, "It is not a crime to ignore your mother, but it is suberogatory," you have implicitly claimed the authority to judge the act. Institutions generally want to minimize the surface area they are liable to judge.

  Furthermore, recognizing a "permissibly rotten" category might normalize the behavior. By leaving the zone unmarked (neither praised nor blamed), the institution maintains **plausible deniability**. It allows social pressure (guilt, gossip) to do the work of regulation without incurring the cost of legal or formal regulation. So, the asymmetry exists because praise is a low-cost tool for encouraging rare positive outliers, while blame is a high-cost tool reserved for threats to system integrity. The "meh" zone is left to the free market of social opinion.

  ### 4. Continuous Scale vs. The Cliff

  Finally, if we moved to a continuous scale of merit (reporting concentration rather than phase), would we lose anything?

  **Theoretically:** No. Utilitarianism, for instance, is essentially continuous. Every act produces some utility; there are no cliffs, just slopes.
  **Institutionally:** Yes, you would lose everything.

  The concept of supererogation, as an *institutional practice*, strictly depends on the cliff. Here is why:

  1.  **Decision Thresholds:** Institutions must make binary decisions. Promote/Don't promote. Guilty/Not guilty. Medal/No medal. A continuous score of "0.73 bravery units" does not map onto a budget for medals or a statute for sentencing. You need a **detection limit**.
  2.  **The Definition of Duty:** Duty is defined by the cliff. Duty is "what is required up to the limit." If you remove the cliff, duty expands to fill the available space. If every increment of goodness is scored, then failing to maximize the score becomes a deficit. This leads to **moral demandingness**. If there is no line where duty stops, then you are always in deficit. The "cliff" is a protective barrier that says, "You are safe up to here."
  3.  **Coordination:** In your geochemistry work, a phase boundary tells you how to handle the material. In social coordination, the duty line tells people what they can *expect* from each other. I can expect you to do your duty. I cannot expect you to be a hero. If you erase the line, social expectations become unstable. I might resent you for not being heroic; you might resent me for expecting it.

  ### Summary of the Apparatus

  To synthesize this in terms of your "detection limits" metaphor:

  1.  **The Line:** It is a bookkeeping cutoff, not a natural phase boundary. It is set at the limit of enforceable expectation, not the limit of moral possibility.
  2.  **The Incentive:** The practice is deflationary. Praise is a subsidy for high-risk behaviors the institution cannot mandate. The "no credit transfer" rule prevents moral hazard and maintains consistent compliance standards.
  3.  **The Asymmetry:** There is no "suberogatory" category because policing the "mediocre" zone is too expensive and risks overreach. Social pressure handles that; the institution handles the tails.
  4.  **The Scale:** A continuous scale works for moral *theory*, but fails for moral *administration*. The "cliff" is necessary to define the baseline of safety and expectation. Without the cliff, duty becomes infinite, and the system collapses under the weight of demandingness.

  The apparatus presupposes a picture of duty that is **contractual and protective**, not **perfectionist**. It assumes humans are risk-averse agents who need a guaranteed "safe zone" of compliance, with incentives offered to tempt them out of it, but without penalties for staying in. It is a system designed for stability, not for the maximization of moral goodness.
