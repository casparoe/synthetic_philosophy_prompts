          *   *Verdict:* The deflationary/incentive model fits the institutional practice (courts, medals) better than the pure moral theory.

      *   **Question 3: The Asymmetry (No "Suberogatory"):**
          *   *Concept:* Suberogatory acts (permissible but bad). Philosophers like Hill have discussed this.
          *   *Why no institutional category?* Blame is expensive. Praise is cheap.
          *   *Institutional logic:* We punish crimes (below duty). We ignore the "meh" zone. We celebrate heroes (above duty).
          *   *Reason:* Social stability. If we formally recognized a category of "allowed but rotten," it might encourage sliding into it. Also, blame requires enforcement mechanisms. Praise just requires a ceremony.
