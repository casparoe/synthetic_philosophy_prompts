answer: |-
  Structure the entire section around a direct "Hostage Execution" scenario rather than the trolley problem to isolate agent-relative constraints from causal complexity.

  Use a case where a villain tells the student, "I will kill these five innocents unless you personally shoot this one innocent." Avoid the trolley problem because its mechanical intermediaries (switches, tracks) allow students to hide behind distinctions about "direct vs. indirect" causation or "intended vs. foreseen" consequences, which distracts from the core paradox of why *my* agency matters more than the total count of violations. The Hostage scenario forces the violation to be identical in nature (killing an innocent) in both options, leaving only the agent's participation as the variable.

  Begin the first ten minutes by securing a commitment to the constraint itself: ask if it is ever permissible to kill an innocent person for fun or profit, establishing that killing has a negative moral weight independent of outcomes. Once they agree that killing is pro tanto wrong, introduce the Hostage scenario at minute fifteen and ask for a vote on what they should do. Most will say "shoot the one," revealing their consequentialist intuition. At minute twenty-five, pivot to the paradox by asking the deontological counter: "If killing is wrong because it violates a person's rights, haven't you just violated a right to prevent five violations? Why doesn't the math of rights matter?" This is where you must head off the first major misconception: "Killing is worse than letting die." Intercept this by reminding them that in this specific scenario, the five will definitely die if the student refuses; the choice is strictly between one death by the student's hand or five deaths by the villain's hand. Force them to acknowledge that the *outcome* (five dead vs. one dead) is worse in the refusal case, but the *act* is prohibited in the acceptance case.

  At minute thirty-five, address the second misconception: "Just be a consequentialist then." Students will argue that if the constraint leads to more deaths, the constraint is irrational. Head this off by asking them to articulate what they value in morality: is it a clean world (low body count) or clean hands (no personal violation)? Explain that the paradox exists precisely because deontology values clean hands even when it dirties the world. Do not resolve this tension; the goal is for them to feel the friction between minimizing harm and minimizing personal wrongdoing.

  Conclude at minute forty-five with this specific diagnostic question: "If a deontologist refuses to kill the one to save the five, do they believe the world is better or worse off than if they had killed, and why does that belief not change their action?" A correct understanding requires them to say the deontologist likely believes the world is worse off (more deaths) but that the moral requirement is about the agent's integrity, not the world's state. If they answer that the deontologist thinks the world is better off, they have missed the paradox and reverted to consequentialist reasoning.
