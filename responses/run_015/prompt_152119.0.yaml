answer: |-
  It is completely understandable why this argument has lingered with you, because you have stumbled onto one of the most persistent and structurally complex problems in the philosophy of science, even if the context was a late-night conversation about animals. What you are describing is a specific configuration of disagreement that has received significant attention in contemporary metaphysics and metaethics, and while your friend's intuition that it involves language is not wrong, their conclusion that it is therefore trivial or merely verbal misses the normative weight you are correctly sensing. The shape of disagreement you are outlining, characterized by full empirical agreement, sharp divergent verdicts, high stakes, and no stipulative intent, is best diagnosed as a metalinguistic negotiation, though in the specific context of biology it is deeply entangled with what is known as conceptual pluralism. To see why this fits better than the alternatives, we need to walk through why the other candidate diagnoses fail to capture the specific texture of your exchange.

  Your friend's diagnosis is that this is a merely verbal dispute. In the philosophical literature, a merely verbal dispute is one where the parties agree on all the underlying facts but disagree on the language used to describe them, such that once the meanings are clarified, the disagreement dissolves. The classic example is arguing about whether a tomato is a fruit or a vegetable; if you agree on the botanical facts and the culinary uses, the only thing left to argue about is which label to apply. The reason this feels unsatisfying to you, and why you are right to push back, is that merely verbal disputes typically lack the downstream stakes you described. If we argue about whether a tomato is a fruit, the outcome rarely changes legal protection or funding allocation. In your case, the classification drives real-world consequences, which suggests that the choice of concept is not arbitrary but carries normative weight. Furthermore, in a standard merely verbal dispute, once you realize you are using different definitions, you usually stop arguing. You did not stop. You both continued to insist that one concept was the correct one, not just a useful tool. This persistence indicates that you were not just comparing definitions, but advocating for which definition should govern your shared practices.

  On the other side, your intuition is that this is a substantive disagreement about the world, not just words. This aligns with a realist perspective, where species are mind-independent natural kinds and there is a fact of the matter about whether a population constitutes one species or two. For you to be right in this realist sense, it would have to be true that nature comes pre-carved into units that our concepts must track, and that one of your criteria successfully tracks those units while the other fails. However, the condition you both agreed on—that even perfect genomic and field data would not resolve the disagreement—undermines the strong realist position. If the facts are exhausted and the disagreement remains, the difference cannot be located in the empirical world. This is where the idea of faultless disagreement often comes up, suggesting that both of you are right relative to your own conceptual frameworks. While this captures the mutual admission of utility, it fails to account for the feeling that one of you ought to prevail. In a faultless disagreement, like arguing over whether a film is boring, we accept that different tastes yield different truths. In your case, you both feel there is a correct answer for the purpose of conservation and science, which implies a normative standard beyond personal preference.

  The diagnosis that best captures the configuration you described is metalinguistic negotiation. This is a concept developed in recent metaphysics and linguistics to describe situations where speakers use object-level claims to negotiate the meaning or usage of a term because the choice of meaning has practical consequences. When you argued about whether the populations are one species or several, you were not just describing the populations; you were implicitly arguing about which conceptual scheme should be adopted for your shared scientific and legal purposes. You were saying, in effect, that the concept of species ought to be defined by criterion A because it serves conservation goals better, while your friend was arguing that criterion B ought to be adopted because it serves phylogenetic clarity better. This explains why the disagreement feels substantive rather than verbal: you are negotiating norms and values, not just semantics. It explains why empirical data cannot settle it: no amount of genetic sequencing can tell us which value is more important. It also explains why neither of you was stipulating: in a negotiation, you do not simply declare your definition; you try to persuade the other party that your definition is the one we should all use.

  This diagnosis is particularly robust in the philosophy of biology, where it overlaps with the thesis of conceptual pluralism. Philosophers of biology like Marc Ereshefsky have long argued that there is no single natural kind corresponding to the word species. Instead, there are multiple legitimate concepts, such as the biological species concept, the phylogenetic species concept, and the ecological species concept, each carving the world differently for different purposes. Your observation about asexual organisms supports this perfectly. When biologists encounter asexual populations, they quietly switch from the interbreeding criterion to a phylogenetic or ecological one without treating it as a crisis. This suggests that the term species is a cluster of concepts rather than a single rigid designator. In your argument, you and your friend were likely privileging different concepts within this cluster. The disagreement was not about the animals, but about which concept in the cluster should be the default for the context you were discussing. If the context was legal protection, your criterion might be more appropriate; if the context was evolutionary history, your friend's might be. The friction arose because you were both treating your preferred concept as the single authoritative one.

  To answer your specific question about what would have to be true for each of you to be right, we have to look at the metaphysical commitments underlying your positions. For your friend to be right that it is just a matter of preferred definition, it would have to be the case that there are no mind-independent species boundaries whatsoever, and that all classification is purely instrumental. This is a strong conventionalist view. It implies that nature is a continuum and any lines we draw are entirely for our convenience. If this were true, your insistence that one concept is correct would be a mistake, and the stakes you mentioned would be purely political, not scientific. For you to be right that there is a fact of the matter independent of our word choices, it would have to be true that species are real entities existing in nature regardless of human classification, and that one of your criteria successfully latches onto this reality while the other misses it. This is a strong realist view. It implies that there is a true number of species in any given region, even if we cannot measure it. If this were true, your friend's concession that your criterion is useful for some purposes would be an understatement; it would mean their criterion is literally false regarding the ontology of the populations.

  However, the metalinguistic negotiation framework suggests a third option that dissolves this dichotomy. On this view, neither of you is wrong about the facts, and neither of you is wrong about the values, but you are mistaken about the nature of your disagreement. You are treating a normative question about how we ought to classify as a descriptive question about how the world is. What would have to be true for this diagnosis to hold is that the term species is indeed polysemous, carrying multiple legitimate meanings, and that the choice between them is determined by pragmatic goals rather than empirical discovery. This fits the data you provided: the empirical agreement, the sharp divergence, the stakes, and the inability of data to resolve the issue. It also accounts for the asexual organism case you mentioned, where the switch in criteria is accepted because the pragmatic goal shifts from tracking reproduction to tracking lineage. In that case, no one argues because the context makes the relevant concept obvious. In your argument, the context was likely ambiguous, leading to a clash over which pragmatic goal should take precedence.

  If I were to offer a more specific label for this biological instantiation of metalinguistic negotiation, I might call it a pragmatic ontological dispute, though this is not a standard term in the literature. It captures the sense that you are arguing about ontology what exists but the resolution is pragmatic what works best. However, since metalinguistic negotiation is the established philosophical concept that covers this structure across domains, it is the more precise tool for your analysis. The key distinction to keep in mind for future cases is to look for the stakes. If there are no consequences to the classification, it is likely merely verbal. If there are consequences but the facts are vague, it is a borderline case. If there are consequences, the facts are sharp, and yet the facts do not decide the issue, you are in a metalinguistic negotiation. In such cases, the productive move is not to gather more data, but to make explicit the values and purposes that are driving your choice of concept. You and your friend were not disagreeing about the animals; you were disagreeing about what you want science to do for you.

  So, to summarize the landscape you are navigating, your friend is partially right that the disagreement turns on concepts, but wrong to dismiss it as merely verbal because concepts carry normative weight. You are partially right that the disagreement is substantive and not just about words, but wrong to think that the substance is empirical rather than pragmatic. The shape of the disagreement is a metalinguistic negotiation grounded in conceptual pluralism. This explains why you could agree on every measurement and still disagree on the verdict, why the stakes make it feel real, and why no amount of genomic data will ever settle it. The resolution lies not in finding the true number of species, but in agreeing on which concept of species serves the purposes you both care about, whether that is preserving biodiversity, tracking evolutionary history, or allocating legal resources. Once you shift the conversation from what are they to how should we treat them, the disagreement may not vanish, but it will become productive rather than circular.
