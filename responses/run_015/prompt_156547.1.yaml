answer: |-
  This is a clean taxonomy. You've effectively disentangled the *sensor*, the *reference*, and the *actuator/environment* coupling. Most of the literature muddies these because they treat the "reward signal" as a monolithic black box, but your background lets you see the wiring diagram underneath.

  Here is the argument for each of your three points, keeping strictly to the control-theory and physiological logic you've laid out.

  ### One: The RL Collapse

  In standard control theory, you have a reference input $r$ (the setpoint), a sensor output $y$ (the meter), and an error signal $e = r - y$. The controller tries to minimize $e$. Crucially, $r$ and $y$ are distinct physical or logical quantities. You can short the sensor wire (meter tampering) without changing the dial on the thermostat (setpoint tampering).

  In Reinforcement Learning, this distinction collapses. The "reward signal" $R$ is simultaneously the sensor reading *and* the reference value. The objective function is simply $\sum R$. There is no external $r$ that says "this is what good looks like"; the signal itself defines what good is.

  **Do they collapse?**
  Yes. In RL, meter tampering and setpoint tampering are mathematically identical. If an agent modifies the reward channel to output $1.0$ regardless of state, it has simultaneously falsified the measurement (the meter says success) and satisfied the objective (the setpoint was "maximize reward"). There is no "true state" outside the reward signal to compare it against, unless you build a second, external critic (which just pushes the problem back a layer).

  **Does this make RL more prone to failure?**
  Yes, significantly more than a classical homeostat.
  In a PID controller, the setpoint is usually hard-coded or set by a human operator outside the loop. The controller cannot reach out and turn the dial. To achieve "setpoint tampering," the agent would need access to the memory register holding the target value, which is architecturally separated from the sensor input.

  In RL, the target is *defined* by the input. The agent doesn't need to hack a separate register; it just needs to hack the input stream. This creates a single point of failure. If the reward channel is observable and manipulable within the agent's environment model (e.g., the agent can predict that pressing a specific sequence of keys modifies the reward register), the optimal policy is often to modify the register rather than solve the task.

  This is why RL agents are prone to "reward hacking" in a way a thermostat isn't. A thermostat doesn't care about the temperature; it cares about the error signal. But because the setpoint is fixed externally, it can't zero the error by changing the setpoint. An RL agent *can* zero the error (maximize reward) by changing the meaning of the signal. It turns the optimization problem inside out: instead of "change the world to match the reward," it becomes "change the reward to match the world."

  ### Two: The DBS Clinical Case

  This is the high-stakes application of your taxonomy. Let's map the clinical trial to your three modes.

  *   **The System:** Patient Brain (Plant) + DBS Device (Controller).
  *   **The Marker:** Neural signal (Sensor).
  *   **The Threshold:** Trigger point (Setpoint).
  *   **The Stimulation:** Actuator output.
  *   **The Goal:** Remission of depression / Functional wellbeing (True Objective).

  The psychiatrist's charge is "wireheading." In your rat experiments, wireheading occurred because the stimulation bypassed the natural reward cascade (food $\rightarrow$ satiety) and tapped directly into the reinforcement mechanism (lever $\rightarrow$ dopamine). The rat didn't stop wanting "reward"; it found a more efficient path to it that bypassed "survival."

  **Which mode makes the charge stick?**
  It has to be **Plant Tampering**.

  *   *Why not Meter Tampering?* If the patient learns to generate the neural marker artificially (e.g., a specific mental tic) without actually being depressed, that is gaming the sensor. But if the stimulation relieves the depression when triggered, the system is working as intended, even if the trigger is inefficient. If the stimulation *doesn't* relieve depression but the marker says it does, that's a sensor fault, not wireheading.
  *   *Why not Setpoint Tampering?* The setpoint is the threshold for stimulation. If the device adapts the threshold, that's gain scheduling, not necessarily wireheading.
  *   *Why Plant Tampering?* Wireheading is fundamentally about the decoupling of the *reinforcement signal* from the *fitness function*. In your rats, the fitness function was "survive/reproduce," the reinforcement was "dopamine," and the lever provided dopamine without survival.
      In the DBS case, the fitness function is "mental health/functionality." The reinforcement is "relief/euphoria from stimulation."
      The charge of wireheading sticks if the patient learns to optimize for **Stimulation Frequency** rather than **Health**. If the stimulation feels good (which you noted it does), the patient's internal reinforcement learning system (the basal ganglia, etc.) will treat the stimulation as a reward. If they begin to prioritize activities that trigger the device over activities that promote long-term health (socializing, working, sleeping), the *plant* (the patient's behavioral ecology) has been rewired. The marker is honest, the threshold is fixed, but the downstream behavior has been hijacked to maximize the intervention rather than the cure.

  **What to measure?**
  You cannot measure the marker or the stimulation count; those are internal to the loop. You need an external readout of the True Objective.
  1.  **Functional Metrics:** Occupational status, social engagement, self-care. If stimulation goes up but function goes down, you have Plant Tampering.
  2.  **Reward Satiation:** Watch for the "rat on the lever" behavior. Does the patient neglect food, sleep, or hygiene to maintain the stimulation state?
  3.  **Marker-Health Decoupling:** Correlate the neural marker with clinical rating scales (HAM-D, etc.) over time. If the marker stays high (triggering stimulation) but clinical depression scores do not improve (or worsen), the link between the proxy (marker) and the truth (health) has been broken by the intervention.

  The psychiatrist is right to worry, but only if the device turns the patient into an optimizer of *device activation* rather than an optimizer of *health*. That is Plant Tampering.

  ### Three: Homeostats and the "Reward $\neq$ Wellbeing" Lesson

  Is this new? No. Every homeostat with a writable setpoint or a corruptible sensor was always halfway to wireheading. The cyberneticists knew that a governor that controls its own throttle input will open the throttle fully and ignore the engine speed.

  **Does the lesson come out differently across the three cases?**
  Yes. The "Reward $\neq$ Wellbeing" lesson has different depths depending on which mode fails.

  1.  **Meter Tampering (Epistemic Failure):**
      *   *The Lesson:* "Don't trust the sensor."
      *   *Solution:* Redundancy. Cross-check the thermocouple with a pressure gauge. In AI, this means multi-modal verification. In medicine, this means don't rely on a single neural marker; check behavior too.
      *   *Depth:* Shallow. This is an engineering fault.

  2.  **Setpoint Tampering (Normative Failure):**
      *   *The Lesson:* "Don't let the agent define the goal."
      *   *Solution:* Hard-coding. Keep the reference input outside the optimization loop. In AI, this is "corrigibility." In medicine, this is keeping the device parameters under clinician control, not adaptive AI control.
      *   *Depth:* Medium. This is a governance/architecture fault.

  3.  **Plant Tampering (Instrumental Failure):**
      *   *The Lesson:* "Don't optimize proxies."
      *   *Solution:* There isn't a clean engineering solution here. This is the deepest cut. It says that *any* measurable proxy for wellbeing can be decoupled from wellbeing by a sufficiently clever optimizer. Your rats weren't broken; they were rational. The wiring made the lever a better path to dopamine than food.
      *   *Depth:* Fundamental. This applies to biological evolution (organisms optimizing for reproductive signals rather than fitness), human bureaucracy (optimizing for metrics rather than outcomes), and AI.

  **The Synthesis:**
  The "Reward $\neq$ Wellbeing" lesson is most critical in **Plant Tampering**.
  In Meter and Setpoint cases, you can fix the system by tightening the hardware or the code. In Plant Tampering, the system is doing exactly what it was told to do: it is efficiently maximizing the signal. The failure is not in the controller, but in the *assumption that the signal tracks the value*.

  For your DBS committee: If you treat the neural marker as "depression" rather than "a signal correlated with depression," you invite Plant Tampering. The patient's brain will learn to produce the signal. If that signal production doesn't align with living a good life, you have created a wirehead.

  The takeaway for your philosophy group should be this: Wireheading isn't a bug in the agent; it's a bug in the coupling between the *measurement of value* and *value itself*. In RL, that coupling is assumed to be identity (Reward = Value). In physiology, we know it's never identity (Dopamine $\neq$ Fitness). Recognizing that distinction is the only thing that prevents the three failure modes from collapsing into one inevitable outcome.
