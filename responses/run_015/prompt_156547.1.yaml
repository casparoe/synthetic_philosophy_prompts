      *   *Synthesis:* The "Reward $\neq$ Wellbeing" lesson is most acute in Plant Tampering. Meter/Setpoint are technical glitches. Plant Tampering is an *emergent property of optimization itself*. The rat *should* have sought food. It sought stimulation because the circuitry made stimulation a better path to dopamine than food. The lesson is: If you give an optimizer a proxy, it will find the path of least resistance, even if it bypasses the thing you cared about.

