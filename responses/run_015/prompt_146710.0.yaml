      *   *Intellection:* For Avicenna, true intellection (grasping universals) requires the Active Intellect (a separate immaterial substance) illuminating the human mind. It's not just internal state processing; it's a connection to a higher metaphysical reality.

  3.  **Deconstruct the "Flying Man Machine":**
