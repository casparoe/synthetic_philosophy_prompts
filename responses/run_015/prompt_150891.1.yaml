answer: |-
  **Graduate Seminar in Value Theory: Final Examination**
  **Time Allowed: Three Hours**
  **Closed Book**

  **Question 1**

  Lexical Threshold Negative Utilitarianism (LTNU) posits that the prevention of severe suffering takes absolute priority over the promotion of pleasure once a certain threshold of suffering is present. However, this view faces what we shall term the *Calibration Problem*. This problem arises from an apparent tension: lexical ordering似乎 requires that suffering and pleasure be comparable on a shared scale (such that any amount of suffering can be meaningfully said to outweigh any amount of pleasure), yet the primary motivation for LTNU often appeals to a qualitative asymmetry in valence that treats suffering and pleasure as not symmetrically measurable at all.

  Critically evaluate whether this tension is fatal to the coherence of LTNU. In your response, you must address whether a defender can resolve this tension by abandoning cardinal measurement in favor of an ordinal or categorical comparison. Furthermore, analyze what such a resolution implies for the possibility of cross-personal and cross-modal judgments of affective states. Do not merely summarize the position; demonstrate whether the Calibration Problem constitutes a logical contradiction or a manageable theoretical cost.

  ***

  **Model Answer**

  The Calibration Problem presents a formidable challenge to Lexical Threshold Negative Utilitarianism, but it is not fatal provided one distinguishes between *commensurability* and *comparability*. The tension identified in the prompt rests on the assumption that for suffering to lexically outweigh pleasure, the two must be measured on a single cardinal scale. If one assumes cardinality is required, the qualitative asymmetry argument collapses, for asymmetry suggests that suffering and pleasure are different kinds of goods that cannot be quantified into a common currency. However, this assumption is false. Lexical priority is a structural rule about ranking, not a quantitative ratio about measurement.

  To resolve the Calibration Problem, the defender of LTNU must abandon the requirement for cardinal commensurability. Cardinal measurement implies that there exists a unit of value such that ten units of pleasure could, in principle, be equated to one unit of suffering. LTNU explicitly denies this. Instead, the view relies on an ordinal or categorical framework. In an ordinal framework, states of affairs are ranked without assigning specific magnitudes. A lexical rule simply states that any state containing severe suffering is ranked lower than any state containing no severe suffering, regardless of the pleasure involved. This preserves the qualitative asymmetry: suffering is not "more" than pleasure in a quantitative sense; it is *prior* in a deontic or axiological hierarchy. Therefore, the tension dissolves. One does not need a shared scale to establish a priority rule; one only needs a consistent ordering relation.

  However, shifting to an ordinal framework introduces significant costs regarding cross-personal and cross-modal judgments. If we reject cardinal measurement, we lose the ability to aggregate utility across persons in the traditional utilitarian sense. More critically for the Calibration Problem, we must explain how the lexical threshold is identified across different modalities of experience. If suffering and pleasure are qualitatively asymmetric, how do we determine when the "threshold" of suffering has been breached without referencing a scale?

  The defender must argue that the threshold is categorical, not scalar. Severe suffering is identified by its phenomenological character (e.g., agony, torture) rather than its intensity relative to pleasure. This allows for cross-modal judgment without cardinal calibration. We can recognize agony as lexically prior to mild contentment without measuring both in "hedons." Yet, this raises the specter of interpersonal comparison. If valence is qualitative and ordinal, can we compare Person A's agony to Person B's agony? A strict ordinalist might argue that we only need to compare the presence of the category "severe suffering" across persons, not the precise intensity. As long as the category is robust, the lexical rule applies.

  Consequently, the Calibration Problem is not a logical contradiction but a demand for theoretical precision. It forces LTNU to reject the utilitarian instinct to quantify all value. The tension is only fatal if one insists that moral priority requires quantitative calibration. If one accepts that moral structure can be categorical, the qualitative asymmetry of valence actually supports the lexical view rather than undermining it. The cost is a reduced ability to handle trade-offs below the threshold and a reliance on robust phenomenological categories for cross-personal judgment. Nevertheless, the theory remains coherent. The Calibration Problem successfully strips LTNU of its cardinal pretensions, but in doing so, it clarifies the view's true nature: not a calculus of pain, but a hierarchy of moral urgency.

  ***

  **Marking Scheme**

  **General Criteria**
  Answers will be evaluated on the precision of conceptual distinctions, the coherence of the argumentative structure, and the ability to address the specific constraints of the prompt without relying on external citations.

  **A Grade (Excellent)**
  To achieve an A, the answer must move beyond restating the problem and offer a resolution based on structural distinctions. Specifically, the answer must contain the following moves:
  1.  **Distinguish Commensurability from Comparability:** Explicitly explain why lexical priority does not strictly depend on cardinal commensurability. The student must argue that one can rank options (comparability) without measuring them in common units (commensurability).
  2.  **Articulate the Ordinal/Categorical Solution:** Demonstrate how an ordinal framework preserves qualitative asymmetry. The answer should explain that lexicality is a ranking rule (If S exists, P is irrelevant) rather than a quantitative ratio.
  3.  **Distinguish Calibration from Interpersonal Utility Comparison (IUC):** The answer must distinguish the Calibration Problem (internal coherence of value scales) from the problem of IUC (epistemic access to other minds). While related, conflating them indicates a lack of precision.
  4.  **Address Implications:** Clearly analyze the cost of this resolution, specifically regarding how thresholds are identified without cardinal metrics.

  **B Grade (Good)**
  A B answer will demonstrate a solid understanding of the tension but will lack the technical precision of an A answer.
  1.  **Identify the Tension:** Correctly identifies that cardinal measurement conflicts with qualitative asymmetry.
  2.  **Propose a Solution:** Suggests abandoning cardinality for ordinality but may not fully explain *how* this preserves lexical ordering without collapsing into incommensurability.
  3.  **Minor Conflations:** May blur the lines between the Calibration Problem and general interpersonal comparison issues without fully disentangling them.
  4.  **Implications:** Discusses cross-personal judgments but may treat them as impossible rather than merely requiring a different framework (categorical vs. scalar).

  **C Grade (Satisfactory)**
  A C answer will summarize the positions without resolving the logical tension.
  1.  **Recitation:** Mostly summarizes LTNU and the definition of the Calibration Problem without critical evaluation.
  2.  **Vague Resolution:** Claims the problem is solvable but relies on hand-waving regarding "quality" vs. "quantity."
  3.  **Missed Distinctions:** Fails to distinguish between cardinal and ordinal frameworks clearly.

  **Specific Errors and Penalties**
  *   **The Cardinality Error (Major Penalty):** Assuming that rejecting cardinal measurement automatically undermines lexical ordering. This indicates a failure to understand lexicality as a structural relation.
  *   **The Incommensurability Conflation (Major Penalty):** Conflating qualitative valence asymmetry with full incommensurability. The student must recognize that asymmetry allows for priority ranking even if it denies symmetric measurement.
  *   **The IUC Conflation (Minor Penalty):** Treating the Calibration Problem as identical to the problem of comparing utility between different people. While related, the Calibration Problem is primarily about the internal structure of value (suffering vs. pleasure), whereas IUC is about epistemic access between subjects.
  *   **Recitation (Minor Penalty):** Spending more than 25% of the response defining LTNU rather than analyzing the Calibration Problem.
