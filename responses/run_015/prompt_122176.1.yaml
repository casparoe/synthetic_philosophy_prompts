  2.  **Deconstruct the Content & Dependencies:**
      *   *Core Problem:* Distinguishing between reasons that count towards the correctness of an attitude (Right Kind) vs. reasons that count towards the benefits of having the attitude (Wrong Kind).
      *   *Prerequisite:* The distinction between *object-given* reasons (properties of the object) and *state-given* reasons (properties of having the state/attitude). Or, more accessibly for 2nd years, reasons *for the attitude itself* vs. reasons *to want to have the attitude*.
      *   *Pedagogical Pitfalls:*
          *   Confusing "wrong kind" with "morally bad" or "selfish".
          *   Confusing "wrong kind" with "insufficient weight".
          *   Thinking it's about the agent's psychology (motivation) rather than the normative structure.
          *   The "leakage" problem: instrumental benefits making the object seem intrinsically valuable.
      *   *Example Evaluation (Mathematician's Proof):*
          *   *Works if:* The proof is elegant (Right Kind) vs. being admired brings a reward (Wrong Kind).
          *   *Fails if:* The reward makes them *actually* admire it (psychological causation) rather than giving a reason to admire.
          *   *Needs:* Clear separation between the *merit* of the proof and the *benefit* of admiring it.
      *   *Niche Twist (Belief):* Doxastic involuntarism makes WKR trickier here. Believing because of peer pressure is usually epistemically improper. This connects to Pragmatic Encroachment or Epistemic Normativity.
