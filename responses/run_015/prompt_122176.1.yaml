answer: |-
  Right, let's get the scaffolding sorted before we worry about the timetable. If you jump straight into 'wrong kind' without the prior architecture, they'll just treat it like a synonym for 'shabby reasoning'.

  ### Pedagogical Pitfalls Brainstorm
  Here's what usually goes pear-shaped in these sessions:
  1.  **The Moralisation Trap:** Students think 'Wrong Kind' means 'Immoral' or 'Selfish'. They need to see that a WK reason can be morally good (e.g., admiring a tyrant to save hostages) but still the wrong *type*.
  2.  **The Weight Confusion:** They assume WK reasons are just *weaker* reasons that get outweighed. You have to stress that they don't count towards the *correctness* of the attitude at all, regardless of weight.
  3.  **Psychologising:** They think it's about what *caused* the feeling (motivation) rather than what *justifies* it (normativity).
  4.  **The Leakage Error:** The sneaky one. They think if the instrumental benefit is big enough, it somehow transforms into intrinsic value.

  ### Dependency Structure
  Before 'Wrong Kind' makes any sense, this distinction must be solid:
  1.  **Object-Given vs. State-Given:** Reasons grounded in the properties of the object (the proof, the person) vs. reasons grounded in the benefits of holding the state (the admiration itself).
  2.  **Fittingness vs. Utility:** The idea that attitudes have a 'correctness condition' (fittingness) distinct from whether it's 'good to have them' (utility).

  If they don't grasp that an attitude can be *useful* but *unfitting*, the rest is noise.

  ### The Mathematician Example: Will it work?
  Admiration is a classic test case, but your specific setup needs tweaking.
  *   **Verdict:** It works, *but* only if the proof is **mediocre**.
  *   **Properties it must have:** The scenario needs an external incentive (a prize, a threat) detached from the proof's elegance.
  *   **What it must lack:** It must lack *actual merit*. If the proof is brilliant, students will conflate the RK reasons (it's elegant) with the WK reasons (I get paid). To isolate the problem, use a trivial proof where the *only* reason to admire is the external reward.
  *   **Risk:** If you don't separate the 'reason to admire' from the 'reason to want to admire', they'll collapse into the motivation trap.

  ---

  ### 90-Minute Teaching Arc

  **00–15 mins: The Fittingness Hook**
  Start with emotions. Ask: "Is it possible to be afraid of something harmless?" (Yes). "Is it possible to be afraid of something dangerous but not know it?" (Yes).
  Push them to see that fear aims at *danger*. If there's no danger, the fear is *unfitting*, even if it's useful (keeps you alert).
  *   **Misconception Head-off:** This tackles the 'Bad Reasons' confusion immediately. We aren't talking about weak reasons; we're talking about reasons that miss the target of the attitude.
  *   **Goal:** Establish that attitudes have a 'job description' (correctness condition).

  **15–45 mins: The Core Case (The Demon & The Proof)**
  Introduce the Mathematician scenario. A demon says: "Admire this trivial proof by 5 PM or I destroy the library."
  *   **Discussion:** Do you have a reason to admire? Yes. Is it a reason that makes the proof admirable? No.
  *   **Misconception Head-off (Motivation):** When they say "But I'd only do it for the safety!", stop them. Ask: "Does your safety make the proof elegant?" This shifts focus from their psychology to the object's properties.
  *   **Misconception Head-off (Weight):** If someone says "But the library is worth more than the proof!", acknowledge the weight but reiterate: "Does saving the library make the math *better*?"
  *   **Activity:** Have them list three RK reasons (elegance, novelty, rigour) and three WK reasons (prize, threat, career boost) on the board. Visually separate them.

  **45–60 mins: The Leakage Problem**
  This is where you catch the instrumental value sneak.
  Ask: "If admiring this proof gets me into a top uni, does that make the proof worthy of admiration *because* it's a gateway?"
  *   **Intervention:** Show how instrumental value attaches to the *agent*, not the *object*. Use the phrase: "Value of the attitude vs. Value in the object."
  *   **Typo check:** Make sure they don't think the value *transfers*. It doesn't.

  **60–80 mins: The Twist (Belief & Climate Models)**
  Shift gears. Attitudes aren't just emotions; they're doxastic too.
  Scenario: A junior researcher believes the climate model outputs are accurate.
  *   **RK Reason:** The data, the statistical significance, the peer-reviewed methodology.
  *   **WK Reason:** Departmental peer pressure, funding security, wanting to be on the 'right side' of history.
  *   **Discussion:** How does this look different from admiration?
      *   *Key Difference:* We can choose to admire (voluntarism-ish). We can't really choose to believe (involuntarism).
      *   *Point:* WK reasons for belief feel even more alien. You can't believe something *just* because it's useful, whereas you can pretend to admire. This highlights the 'fittingness' constraint of belief (truth) vs. admiration (value).
  *   **Note:** Don't solve the debate on pragmatic encroachment. Just show the tension.

  **80–90 mins: Wrap & The Check Question**
  Summarise the structre: Object-properties → RK. State-properties → WK.
  Openly state what we're skipping: We aren't solving *why* fittingness matters (meta-ethics) or debating constitutive aims today. That's grad school stuff.

  ---

  ### The One Check Question
  Don't ask them to define WK reasons. Ask this:

  *"Imagine a world where admiring a terrible painting saves the universe. In that world, is the reason to admire it a Right Kind reason or a Wrong Kind reason, and **what feature of the painting itself** would have to change for it to become a Right Kind reason?"*

  *   **Why this works:** If they say "It becomes RK because the stakes are high," they've failed (they think weight/type is interchangeable). If they say "It stays WK because the painting is still terrible; only the painting's aesthetic properties could make it RK," they've got the structural point.

  ### What to Openly Skip
  Tell them straight: "We are skipping the **reductionist solutions**. We aren't asking today whether WK reasons can be reduced to RK reasons via some clever trick (like 'reasons to want to admire'). We're taking the distinction as brute for now." This stops the clever clogs from derailing the session with literature they haven't read.

  ### Final Note on the Belief Twist
  When you hit the climate model bit, be careful not to imply peer pressure *can* justify belief. The point is to show that WK reasons exist in epistemology too (pragmatic reasons for belief), but they clash harder with the norm of truth. It sharpens the distinction because belief feels more 'locked' to evidence than admiration does.

  Right, that should keep them on their toes without drowning them in the lit. Good luck with the group.
