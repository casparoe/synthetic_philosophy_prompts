          *   Students conflate "reason to admire" with "cause of admiration".
          *   Students think if the benefit is huge, it becomes a Right Kind reason.

      *   *Prerequisite:* The distinction between *fittingness* (does the object warrant this?) and *prudence/utility* (is it good for me to have this?).

      *   *Example (Mathematician):*
          *   *Verdict:* It's risky. Admiration is reactive.
          *   *Fix:* Needs a demon offering a reward. "Admire this proof or I shoot you."
          *   *Properties:* The proof must be mediocre (so no RK reason) or excellent (so there is a RK reason, but the threat is separate). Let's say the proof is elegant (RK exists) but the threat is separate. Actually, better: The proof is trivial/bad, but the demon forces admiration. Or the proof is good, but the reason given is the threat.
          *   *Requirement:* Must lack *any* aesthetic merit if we want to isolate the WKR completely, OR acknowledge the RK exists but show the WKR is distinct. Let's go with the "Demon offers reward for admiring a mediocre proof" scenario.
