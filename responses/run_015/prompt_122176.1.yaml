prompt: |-
  I'm prepping a session for my second-year philosophy reading group — theyre mostly comfy with basic ethics but now hitting teh wrong-kind-reasons problem and mixing it up with just having bad reasons generally. You are a seasoned philosophy tutor; please think carefully about the dependency structure before you lay out the plan, and start with a quick brainstorm of what can go wrong pedagogically. I need the answer in British English.

  Don't explain the concept to me directly — design the teaching arc for a single 90-minute meeting. First, what distinction must be solid before 'wrong kind' makes any sense, and in what order do the pieces have to come? Then the carrying example: I'm tempted to use admiration for a mathematician's proof, but tell me whether that works, what properties it must have, and what it must lack so it doesn't collapse into 'bad reasons' or 'selfish motives'. Map out the misconceptions they'll arrive with or form — especially thier tendency to think it's about hidden motivation rather than the category of reason being inappropriate — and say exactly where in the sequence each gets headed off, including teh sneaky misconception that instrumental value can 'leak' into intrinsic appreciation without them noticing.

  Also: the one check question at the end that shows they've got the structural point, not just memorised the phrase; what I should openly say we're skipping at this level; and weave in this niche twist — show how the problem looks different when the attitude is belief rather than admiration, using a scenario about someone forming confidence in climate-model outputs mainly because of departmental peer-pressure rather than evidence, but don't ask them to research anything. Keep it casual; a typo or two is fine.
