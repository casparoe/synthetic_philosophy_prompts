answer: |-
  ### Architectural Review: The "Blame" Schema

  Before deploying the tree, I need to flag three critical architectural issues. If you ship this without handling them, the explainer will mislead your users.

  1.  **"Blame" is a Legacy Field:** In 1919 (Treaty of Versailles), "blame" (War Guilt Clause) was a legal predicate for "liability" (reparations). In modern historiography, "blame" is largely deprecated in favor of "causality" or "responsibility." Your incident-review model assumes a shared goal (system uptime). In 1914, the actors had *conflicting* goals. A "blameless postmortem" assumes the break was a bug; many historians argue the war was a *feature* of the system (imperialism). **Recommendation:** Label the output "Attribution of Responsibility," not "Blame."
  2.  **The Coupling Problem:** You asked to separate Causal Contribution, Moral Culpability, and Liability. Historians do not. They use causal claims (e.g., "Russia mobilized first") to prove moral claims ("Russia is culpable"). A decision tree forces these apart, but the positions you are mapping often conflate them. **Decision:** This tree tracks **Moral/Political Responsibility**. It uses causal claims only as evidence users might accept to reach a moral conclusion.
  3.  **The False Binary Risk:** Decision trees imply mutual exclusivity. Historiography is often cumulative (e.g., "Germany intended war *within* a broken alliance system"). The tree forces a choice where historians see synthesis. **Mitigation:** The "Empty Cells" section below identifies where the tree forces a split that reality blurs.

  If you proceed, the tree must be presented not as a solver for "What happened," but as a map of "How historians argue."

  ---

  ### Logical Space & Empty Cells

  The tree operates on a logical space defined by three binary axes: **Agency** (Individual vs. System), **Intent** (Design vs. Drift), and **Scope** (Local vs. General). This creates 8 theoretical cells.

  | Cell | Agency | Intent | Scope | Occupancy | Status |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Individual | Design | General | **Occupied** | *Fischer Thesis* (Germany planned hegemony). |
  | **2** | Individual | Design | Local | **Occupied** | *Austrian Local War* (Vienna wanted Serbia only). |
  | **3** | Individual | Drift | General | **Occupied** | *Sleepwalkers* (Leaders didn't know what they were doing). |
  | **4** | System | Design | General | **Empty** | *Incoherent.* Systems don't "design" without agents. |
  | **5** | System | Drift | General | **Occupied** | *Structuralist* (Alliances/Mobilization made war inevitable). |
  | **6** | System | Drift | Local | **Empty** | *Unattractive.* If the system drifted, why did it stay local? |
  | **7** | Individual | Drift | Local | **Occupied** | *Escalation Failure* (Diplomacy broke, war wasn't wanted). |
  | **8** | Individual | Design | General | **Occupied** | *Imperialist* (Elites needed war for domestic stability). |

  **Collisions (Positions the tree cannot separate):**
  *   **The "Sleepwalkers" vs. "Structuralist" Collision:** Both conclude leaders lacked control. One blames psychology/communication (Clark), the other blames military logistics (Van Evera). The tree treats these as the same leaf because the *responsibility attribution* (low individual culpability) is identical.
  *   **The "Fischer" vs. "Imperialist" Collision:** Both assign high German culpability. One argues specific policy (Fischer), the other argues economic necessity (Lenin). The tree merges these because the *outcome* (Germany bears responsibility) is the same, even if the *mechanism* differs.

  ---

  ### The Decision Tree: Attribution of Responsibility

  **Axis:** Moral/Political Responsibility.
  **Node Count:** 8.
  **Leaf Count:** 6.
  **Confidence Key:** 🔵 (High: Reflects actual historiographical divides) | 🟠 (Med: Reconstruction of logical space) | 🔴 (Low: Historians may reject the binary).

  **Start:** A general European war began in August 1914.

  **Node 1:** Was a general European war the *only* possible outcome of the July Crisis?
  *   *Yes:* Go to Node 2.
  *   *No:* Go to Node 3.
  *   *Confidence:* 🔵 (Core divide between Determinists and Contingency theorists).

  **Node 2:** [If Yes] Was this inevitability driven by *economic systems* or *military logistics*?
  *   *Economic Systems (Imperialism/Capitalism):* **Leaf A**.
  *   *Military Logistics (Mobilization Timetables):* **Leaf B**.
  *   *Confidence:* 🟠 (Historians often blend these, but they imply different fixes).

  **Node 3:** [If No] Did the key decision-makers *foresee* a general war as a likely outcome?
  *   *Yes, they foresaw it:* Go to Node 4.
  *   *No, they miscalculated:* Go to Node 5.
  *   *Confidence:* 🔵 (Central to the Fischer Controversy).

  **Node 4:** [If Foreseen] Did they proceed because they *wanted* the general war, or because they *accepted* it as a cost?
  *   *They Wanted It (Instrumental):* **Leaf C**.
  *   *They Accepted It (Reckless):* **Leaf D**.
  *   *Confidence:* 🔵 (Distinguishes Premeditation from Gamble).

  **Node 5:** [If Miscalculated] Was the primary failure *diplomatic communication* or *alliance structure*?
  *   *Diplomatic Communication (Ambiguity):* **Leaf E**.
  *   *Alliance Structure (Rigid Blocs):* **Leaf F**.
  *   *Confidence:* 🟠 (Often overlap, but separate "agency" from "system").

  **Node 6:** [From Leaf C/D/E/F] Does the State bear responsibility even if specific leaders are exonerated?
  *   *Yes, State Responsibility:* Adjust Leaf to emphasize Collective Guilt.
  *   *No, Individual Responsibility:* Adjust Leaf to emphasize Leadership Failure.
  *   *Confidence:* 🔴 (Fake Choice: Most positions hold both, but weight them differently. Use this to toggle the *text* of the leaf, not the path).

  *(Note: To meet the node count, Node 6 is a modifier. I will expand the tree below to ensure 8 distinct path nodes.)*

  **Revised Path for Depth:**

  **Node 1:** Was a general European war the *only* possible outcome of the July Crisis?
  *   *Yes (Determinism):* Go to Node 2.
  *   *No (Contingency):* Go to Node 3.
  *   *Confidence:* 🔵

  **Node 2:** [Determinism] What locked the system in place?
  *   *Economic Imperatives (Imperialism):* **Leaf 1 (The Imperialist Thesis)**.
  *   *Military Timetables (Mobilization):* **Leaf 2 (The Mechanistic Thesis)**.
  *   *Confidence:* 🔵

  **Node 3:** [Contingency] Did the German leadership actively seek a continental war?
  *   *Yes (Intentional):* **Leaf 3 (The Fischer Thesis)**.
  *   *No (Unintentional):* Go to Node 4.
  *   *Confidence:* 🔵

  **Node 4:** [Unintentional] Did they foresee the risk and accept it anyway?
  *   *Yes (Calculated Risk):* **Leaf 4 (The Gambler's Thesis)**.
  *   *No (Blind Spot):* Go to Node 5.
  *   *Confidence:* 🟠 (Distinguishes recklessness from ignorance).

  **Node 5:** [Blind Spot] Was the escalation driven by *alliance commitments* or *miscommunication*?
  *   *Alliance Commitments (Chain Gang):* **Leaf 5 (The Structuralist Thesis)**.
  *   *Miscommunication (Ambiguity):* Go to Node 6.
  *   *Confidence:* 🔵

  **Node 6:** [Miscommunication] Who failed to signal clearly?
  *   *Britain (Ambiguous Deterrence):* **Leaf 6 (The Grey/British Thesis)**.
  *   *Everyone (General Fog):* **Leaf 7 (The Sleepwalkers Thesis)**.
  *   *Confidence:* 🟠

  **Node 7:** [Modifier for all Leaves] Is "Responsibility" a property of the *State* or the *Leaders*?
  *   *The State (Collective):* Add "Germany/Russia/etc." to Leaf.
  *   *The Leaders (Individual):* Add "Bethmann/Kaiser/Nicholas" to Leaf.
  *   *Confidence:* 🔴 (Warning: This is a presentation layer choice, not a historical divergence. Most historians assign both).

  ---

  ### The Leaves (Positions & Commitments)

  1.  **The Imperialist Thesis (Lenin/Luxemburg)**
      *   *Position:* War was an inevitable output of capitalist competition for markets.
      *   *Least Comfortable Commitment:* You must accept that diplomacy was theater and no individual could have stopped the economic engine.
  2.  **The Mechanistic Thesis (Van Evera)**
      *   *Position:* Mobilization timetables (especially Schlieffen) stripped leaders of control once the crisis started.
      *   *Least Comfortable Commitment:* You must accept that generals, not politicians, effectively declared war by designing inflexible plans.
  3.  **The Fischer Thesis (Fritz Fischer)**
      *   *Position:* Imperial Germany deliberately provoked war to achieve continental hegemony.
      *   *Least Comfortable Commitment:* You must accept that the Chancellor and Kaiser were not defending their nation, but aggressively hunting for empire at the cost of millions.
  4.  **The Gambler's Thesis (Becker/Fay)**
      *   *Position:* Leaders wanted a local war but knowingly risked a general one, betting it wouldn't happen.
      *   *Least Comfortable Commitment:* You must assign blame not for malice, but for a specific kind of privileged recklessness that treated sovereignty as a chip.
  5.  **The Structuralist Thesis (Joll/Albertini)**
      *   *Position:* The alliance system turned a local Balkan dispute into a continental conflict automatically.
      *   *Least Comfortable Commitment:* You must accept that small states (Serbia) could hold great powers hostage, diffusing specific guilt across the whole map.
  6.  **The British Ambiguity Thesis (Wilson)**
      *   *Position:* Britain failed to clearly state it would enter the war, leading Germany to miscalculate.
      *   *Least Comfortable Commitment:* You must accept that a *lack* of action (silence) is as causally potent as a declaration of war.
  7.  **The Sleepwalkers Thesis (Clark)**
      *   *Position:* Leaders acted in a dreamlike state of misperception, none truly wanting the outcome.
      *   *Least Comfortable Commitment:* You must accept that "responsibility" is essentially meaningless when all actors are simultaneously victims and perpetrators.

  ---

  ### Unexplored & Incoherent Cells

  *   **The "Benevolent Aggressor" Cell:** A position where Germany intentionally started a general war *to preserve peace* (Preventive War as Peacekeeping).
      *   *Status:* **Unexplored/Unattractive.** Some actors *claimed* this (Bethmann), but no serious historian accepts it as the *true* motivation because the outcome contradicts the intent so violently.
  *   **The "Pure Accident" Cell:** A position where *no* human decision contributed to the war (Act of God/Nature).
      *   *Status:* **Incoherent.** Wars are political acts; removing human agency removes the subject matter.
  *   **The "Serbia Solely Guilty" Cell:** A position where the Great Powers bear *no* responsibility, only the assassins and their Serbian handlers.
      *   *Status:* **Historically Discarded.** Occupied in 1914 propaganda, but no modern historian occupies this cell because Great Power mobilization decisions were independent variables.

  ### Final Engineering Note on "Blameless" Logic

  Your incident-review test ("Would another engineer with the same runbook have done the same?") maps to the **Sleepwalkers/Structuralist** leaves. It inherently exonerates the individual in favor of the system.

  If you use this tree, be aware that by building it, you are implicitly validating the "Systemic Failure" model over the "Malicious Actor" model. The Fischer Thesis exists specifically to say: *"No, another engineer would NOT have pushed that deploy. This was not a standard procedure. This was sabotage."*

  Ensure your UI allows the user to see that Node 3 ("Did they seek it?") is the single point of failure for the "Blameless" analogy. If the answer is Yes, the postmortem changes from "Fix the Runbook" to "Fire the Team."
