answer: |-
  Here are nine questions designed to press the specific vulnerabilities of Actualist Counterpart Theory, tailored to settle your debate with Nadia. Each includes the anticipated answer and a follow-up designed to close the escape route.

  ### 1. The Constraint on Similarity
  **Question:** You say counterparts are picked out by similarity, but similarity is notoriously unconstrained—any two things are similar in some respect. What objective feature of the world constrains the counterpart relation so that it's not just an arbitrary classification we impose?

  **Anticipated Answer:** She will likely say that *context* and *causal history* constrain it. It's not arbitrary because we are embedded in a causal network that makes certain similarities salient (e.g., genetic origin matters more than shirt color).

  **Follow-up:** If causal history is the constraint, aren't you just smuggling in a primitive this-worldly identity relation? If the reason I'm not the counterpart of the plumber is that I don't share his causal origin, then aren't you admitting that *identity* is doing the heavy lifting and similarity is just the label?

  ### 2. Modality as Anthropocentrism (Nadia's "About Us" Objection)
  **Question:** Since you admit the counterpart relation shifts with context and salience, doesn't that mean modal claims aren't facts about the world, but facts about *us* and our interests? If I say "I could have been a plumber," am I describing a possibility, or just describing my current interest in plumbers?

  **Anticipated Answer:** She will likely deny the dichotomy. She'll argue that our interests track real patterns in the world, so modal claims are still world-directed, just indexical.

  **Follow-up:** But if the truth conditions of the claim change depending on who is speaking and what they care about, then two people can contradict each other about "what was possible for me" without either being wrong about the world. If the truth value floats on our interests, how is this not just a sophisticated form of anti-realism about modality?

  ### 3. The Uniqueness Problem
  **Question:** In standard logic, identity is unique. If I have two equally similar actual counterparts—say, identical twins both living my life but with different minor choices—does the necessity of identity hold? Am I identical to both, neither, or is identity itself non-unique in your system?

  **Anticipated Answer:** She will likely bite the bullet and say identity is not necessary, or that "I" refer to a stage that has multiple counterparts. She will reject the necessity of identity ($a=b \to \Box(a=b)$).

  **Follow-up:** If you reject the necessity of identity, you break the link between logic and metaphysics. But more practically: if I can have two counterparts who diverge, which one determines the truth of "I will survive tomorrow"? If both do, and they have different futures, do I have contradictory futures?

  ### 4. Iterated Modality (S4/S5)
  **Question:** Your counterpart relation isn't transitive—my counterpart's counterpart might not be my counterpart. This means S4 and S5 modal logic fail on your view. Do you simply accept that "possibly possibly p" does not entail "possibly p," and if so, why are our logical intuitions so universally opposed to this?

  **Anticipated Answer:** She will likely say our intuitions are trained on transworld identity, which is a mistake. She'll argue we should revise our logic to fit the metaphysics, not vice versa.

  **Follow-up:** Revision is fine if it solves problems, but here it seems to create them. If "possibly possibly p" doesn't collapse, then we can't reason about hypotheticals of hypotheticals. Doesn't this make counterfactual reasoning—the kind we use in science and ethics—systematically unreliable?

  ### 5. The Twin/Duplicate Case
  **Question:** Imagine an actual molecule-for-molecule duplicate of you exists right now. He is qualitatively identical. Is he your counterpart? If yes, what happens to the thought experiment if he makes a different choice five minutes from now? Do we say *you* made two different choices?

  **Anticipated Answer:** She will likely say yes, he is a counterpart, but context usually rules out duplicates because we prioritize causal continuity. In the specific thought experiment, we stipulate he is a counterpart.

  **Follow-up:** But if we stipulate he is a counterpart despite lacking your causal history, then similarity *alone* suffices. If similarity alone suffices, then why isn't a very similar stranger on the other side of the world also your counterpart? Where is the non-arbitrary cutoff?

  ### 6. Semantics and Circularity (Nadia's "Change of Subject" Objection)
  **Question:** Can you state the truth conditions for "I could have been a plumber" without using any modal vocabulary like "could," "possible," or "world"? If you can't, isn't your theory just possible-worlds semantics with the labels switched, rather than an elimination of modality?

  **Anticipated Answer:** She will likely attempt a paraphrase: "There exists an actual person x such that x is a plumber and x resembles me." She will claim this is non-modal.

  **Follow-up:** But "resembles me" in the relevant sense *means* "shares my essential properties." If you define resemblance by essential properties, and essential properties by modal profiles, haven't you just defined modality in terms of itself? Is this not circular?

  ### 7. Essence and the Euthyphro Dilemma
  **Question:** Does the counterpart relation track my essence, or does the counterpart relation *determine* what my essence is? In other words, is a property essential because all counterparts have it, or do counterparts have it because it's essential?

  **Anticipated Answer:** She will likely say the relation determines essence. What is essential is just what is common to the set of counterparts picked out by the relation.

  **Follow-up:** If the relation determines essence, and the relation is context-sensitive (as you admitted in Q1), then my essence changes depending on the context of the conversation. Does it make sense to say I literally gain or lose essential properties based on what we are discussing?

  ### 8. The Problem of Regret (Nadia's Emotional Objection)
  **Question:** If the plumber is just some other actual guy who resembles me, and not *me* in any robust sense, why should I care about his outcome? When I regret not being a plumber, I'm grieving a loss for *myself*. If counterpart theory is true, what is the object of my regret?

  **Anticipated Answer:** She will likely say regret is about the *property* not being instantiated by a counterpart, or that we identify with our counterparts psychologically even if not metaphysically.

  **Follow-up:** But psychological identification is exactly what transworld identity proponents say is the core of the matter. If you admit we identify with them psychologically to make sense of regret, but deny we are identical to them metaphysically, aren't you just saying our emotional lives are based on a metaphysical illusion?

  ### 9. Falsification Conditions
  **Question:** Finally, what would actually change your mind? I don't mean a theoretical cost you're willing to eat, like rejecting S4 logic. I mean: what empirical evidence or logical proof would force you to abandon Actualist Counterpart Theory and accept transworld identity?

  **Anticipated Answer:** She will likely say that if it were shown that similarity cannot do the work of picking out individuals without presupposing identity, she would have to leave the view.

  **Follow-up:** Given that Nadia and I have just argued that similarity *does* presuppose identity (in Q1 and Q6), do you acknowledge that your view is currently resting on a premise that is actively being contested as circular? If the circularity is proven, is the view dead?
