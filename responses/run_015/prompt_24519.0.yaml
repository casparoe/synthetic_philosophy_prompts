  *   **Rule B: The Axiomatic Acceptance Rule**
      *   **Definition:** Agent A acts on $P$ from Source $S$ if and only if A accepts $S$'s axioms as a subset of its own (i.e., $Axioms(S) \subseteq Axioms(A)$).
      *   **Consistency:**
          *   *Verdict 1 & 2:* If $B$ is weaker, its axioms are a subset of $A$'s. A accepts them. Thus, A acts.
          *   *Verdict 3:* If $B$ is unsound, its axioms likely contradict truth or $A$'s beliefs. A does not accept them. Thus, A does not act.

