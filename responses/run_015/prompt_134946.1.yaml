      *   *What does it NOT establish?* It doesn't mean speakers are ignorant of their own language in a way that invalidates communication. It doesn't mean reference is *always* fixed by microstructure (descriptions still play a role in fixing the reference initially). It doesn't mean the speaker has *no* authority over their intent. It doesn't mean past usage is retroactively erased if the environment changes (the "switching" case). It doesn't entail skepticism about self-knowledge (privileged access is compatible with externalism, usually via a disquotational principle or a distinction between content and vehicle).
      *   *Key nuance:* The "Switching Case" (Burge/Brown). If Oscar moves from Earth to Twin Earth, does "water" switch reference immediately? No, usually there's a transition period where the concept is ambiguous or memory-based.

  3.  **Analyze the Protagonist's Situation:**
