          *   *Not Establish:* Speakers are clueless; communication is impossible; self-knowledge is illusory. It doesn't mean we don't know our own words; it means our words reach further than our brains.

      *   **Diagnosing the Non Sequitur:**
          *   The protagonist conflates *reference* with *descriptive knowledge*.
