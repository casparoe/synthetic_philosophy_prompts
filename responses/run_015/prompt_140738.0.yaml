  11. **Final Polish:** Ensure the distinction between the Oesterheld et al. definition (which relies on isomorphism assumptions) and the user's stricter "every way of playing" definition is clear. The user's definition is actually *harder* to satisfy than the standard SPI literature unless "way of playing" is restricted by qualitative assumptions. I need to make sure I clarify that "every way of playing... I am willing to count as possible" *is* the belief-free assumption space.

