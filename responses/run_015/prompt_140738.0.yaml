      *   The standard definition (from Oesterheld, Conitzer, et al.) usually involves:
          *   Surrogate games.
          *   Isomorphism assumptions (players play isomorphic games similarly).
          *   Strict Pareto improvement over the *set* of plausible outcomes.
      *   The user's definition is stricter: "for every way of playing... every player does strictly better." This implies a dominance condition over the *counterfactual* set of outcomes.
      *   The biggest hurdle is the *counterfactual*: How do we know what would have happened in $G$ if we are playing $G'$? This requires a theory of continuity or similarity in play (the "isomorphism" assumption).

  3.  **Evaluate the User's List of Demands:**

      *   *Certainty vs. Expectation:* SPI literature demands certainty (ex post). Expected utility is standard game theory, but SPI is specifically about avoiding risk in high-stakes miscoordination. -> Non-negotiable for SPI, but a preference for standard mechanism design.
      *   *Belief-freeness:* Crucial. If we assume beliefs, we just do Bayesian mechanism design. SPI is about *uncertainty* about equilibrium selection. -> Non-negotiable for the specific concept of SPI.
      *   *Non-vacuity:* If it only works on trivial games, it's useless. -> Non-negotiable.
      *   *Determinate Baseline:* The "what would have happened" problem. -> Critical technical hurdle.
      *   *Partial Adoption/Robustness:* If I opt in and get exploited, no one opts in. -> Non-negotiable for voluntary implementation.
