      *   *Item 4: Ordinal Invariance.* No utility comparisons.
      *   *Item 5: Computational/Strategic Feasibility.* Can actually be implemented by programs/agents.

  6.  **Addressing the "Camp Prejudices" vs. "Requirements":**

      *   *Certainty:* Requirement for SPI, Preference for general mechanism design.
