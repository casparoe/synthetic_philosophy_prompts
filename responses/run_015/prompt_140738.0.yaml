      *   *Program Renegotiation (EU maximizers):* Bad on belief-freeness (they have beliefs), good on scope.
      *   *Compensation Test (Kaldor-Hicks):* Bad on interpersonal comparisons (hypothetical), bad on certainty.

  8.  **Refining the "Impossible Joint Satisfaction":**

      *   The triad of **Strict Certainty**, **Belief-Freeness**, and **Non-Vacuity** is the tightest bottleneck. To get non-vacuity, you must assume *something* about how $G$ is played (e.g., isomorphism). If you assume nothing, the set of "possible ways of playing" includes outcomes where $G$ yields the best possible payoff for Player 1, making improvement impossible.
      *   Therefore, the "Belief-free" requirement actually smuggles in "Qualitative Assumptions about Play."
      *   The most exclusionary requirement is **Ex-Post Certainty without Distributional Assumptions**.

  9.  **Structuring the Response:**

