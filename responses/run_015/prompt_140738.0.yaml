      *   *Implementability:* No trusted third party. -> Non-negotiable for the "delegation/program" context.
      *   *Scope:* General games. -> Non-negotiable for a general theory.

  4.  **Identify Tensions/Impossibilities:**

      *   *Certainty + No Beliefs + Non-Vacuity:* This is the "Holy Grail" tension. To guarantee improvement without beliefs, you usually need to restrict the game structure heavily or rely on strong assumptions about play (like isomorphism). If you demand robustness to *any* way of playing, the only SPI is doing nothing (vacuity).
      *   *Certainty + Robustness to Misspecification:* Logical contradiction. If payoffs are slightly off, a strict inequality might flip.
      *   *Voluntary Adoption + Pareto Improvement:* If adoption is voluntary, the *act* of adoption changes the game. If $G'$ is strictly better, everyone adopts. But if others don't adopt, the opt-in player might be worse off (e.g., signaling weakness). This requires $G'$ to be robust to *mixed* populations, which is much harder than universal adoption.
