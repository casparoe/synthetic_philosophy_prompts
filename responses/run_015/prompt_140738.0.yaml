      *   *Item 1: Counterfactual Continuity.* We need to map outcomes of $G'$ to outcomes of $G$. Without this, "better than $G$" is meaningless.
      *   *Item 2: Ex-Post Dominance.* Not expected utility. Every plausible outcome in $G'$ must beat every plausible outcome in $G$.
