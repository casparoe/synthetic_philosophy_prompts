answer: |-
  Here is the specification analysis you requested. It treats "Safe Pareto Improvement" (SPI) not as a settled theorem but as a design constraint satisfaction problem.

  ### I. Desiderata List

  **1. Counterfactual Continuity (The Baseline Problem)**
  *   **Requirement:** There must exist a mapping from outcomes in $G'$ to outcomes in $G$ that justifies the claim "this $G'$ outcome is better than the $G$ outcome that *would have occurred*."
  *   **Rationale:** Without a theory of how play in $G'$ relates to play in $G$, the comparison is category error. You cannot compare a realized payoff in $G'$ to a counterfactual in $G$ without assuming players behave similarly in structurally similar contexts (e.g., isomorphism).
  *   **Status:** **Non-negotiable.** Without this, the definition collapses into "Pareto improvement over the null set."

  **2. Ex-Post Dominance (Certainty)**
  *   **Requirement:** For every outcome $o' \in \text{Possible}(G')$ and every outcome $o \in \text{Possible}(G)$, $u_i(o') > u_i(o)$ for all $i$. (Or, more weakly, $u_i(o') \geq u_i(o)$ with strict inequality for at least one plausible pair).
  *   **Rationale:** The motivation for SPI is avoiding catastrophic miscoordination risk, not optimizing average utility. If improvement is only in expectation, a player facing Knightian uncertainty may rationally reject $G'$.
  *   **Status:** **Non-negotiable** for the specific concept of *Safe* PI. (Standard mechanism design accepts expectation; SPI does not).

  **3. Voluntary Stability (Partial Adoption Robustness)**
  *   **Requirement:** Adopting $G'$ must be a dominant strategy (or at least a Nash equilibrium) in the meta-game where players choose whether to delegate/commit. If others play $G$, playing $G'$ alone must not leave the adopter exploitable.
  *   **Rationale:** As you noted, if adoption is optional, the option itself signals information. If opting in makes you a "sucker" when others opt out, universal adoption will not occur.
  *   **Status:** **Non-negotiable** for implementation without a trusted enforcer.

  **4. Ordinal Invariance (No Interpersonal Comparison)**
  *   **Requirement:** The validity of the improvement must hold under any positive affine transformation of individual utility functions. Side payments must be denominated in a game-internal numeraire, not abstract utility units.
  *   **Rationale:** Designers cannot access cardinal utility. Mechanisms relying on "total welfare" increases (Kaldor-Hicks) fail the "strictly better for *every* player" constraint unless compensation is actual, not hypothetical.
  *   **Status:** **Non-negotiable.**

  **5. Qualitative Belief-Freeness**
  *   **Requirement:** The set of "possible ways of playing" must be defined by structural constraints (e.g., iterated elimination of dominated strategies, symmetry/isomorphism) rather than probabilistic priors over opponent types or equilibria.
  *   **Rationale:** If you assume a probability distribution, you are doing Bayesian mechanism design. SPI is specifically for contexts where players disagree on priors or where the equilibrium selection problem is intractable.
  *   **Status:** **Non-negotiable** for the SPI concept, though it is a **Preference** for general game design.

  **6. Payoff Robustness (Continuity)**
  *   **Requirement:** The improvement holds if payoffs are perturbed by $\epsilon$.
  *   **Rationale:** Payoffs are estimates. A guarantee that relies on $u(o') > u(o)$ by a margin of $10^{-9}$ is operationally useless.
  *   **Status:** **Preference** (High priority). This clashes with Ex-Post Dominance (see Section III).

  **7. Composability**
  *   **Requirement:** If $G_1$ is a safe improvement on $G_0$, and $G_2$ on $G_1$, then $G_2$ is a safe improvement on $G_0$.
  *   **Rationale:** Modular design. Multiple designers should be able to layer safety protocols without breaking the safety guarantee.
  *   **Status:** **Preference.**

  ---

  ### II. Critical Distinctions

  The definition must not collapse the following:

  1.  **Better-for-Each vs. Better-on-Average:** SPI requires the former. A mechanism that increases total surplus but risks ruin for one player is not an SPI.
  2.  **Improving the Outcome vs. Improving the Game:** SPI is a property of the *transformation* $G \to G'$, not a specific outcome. It guarantees that the *set* of plausible outcomes in $G'$ dominates the *set* in $G$.
  3.  **Belief-Free Safety vs. Subjective Rationality:** A player might *believe* $G$ yields a good outcome (optimism bias). SPI must be safe even if that belief is wrong. Conversely, a player might *believe* $G'$ is risky; SPI must be demonstrably safe regardless of their subjective fear.
  4.  **Universal vs. Partial Adoption:** A transformation can be Pareto superior under universal adoption but Pareto inferior under partial adoption. The desiderata must distinguish "Safe if everyone does it" from "Safe to do unilaterally."

  ---

  ### III. Incompatibility Analysis

  **The Impossible Triad:**
  You cannot jointly satisfy **Ex-Post Dominance**, **Belief-Freeness**, and **Non-Vacuity** without smuggling in strong qualitative assumptions.

  *   **The Conflict:** If you assume *nothing* about how $G$ is played (Belief-Freeness), the set of "possible outcomes" for $G$ includes *all* feasible payoff profiles (including the Pareto frontier). If $G$ *could* have yielded the best possible outcome for Player 1, no $G'$ can guarantee a strict improvement for Player 1 with Certainty (Ex-Post Dominance).
  *   **The Resolution:** To achieve Non-Vacuity, you must restrict the "possible ways of playing" $G$. This is usually done via the **Isomorphism Assumption** (players play $G'$ analogously to how they would play $G$).
  *   **The Cost:** This makes the "Belief-Free" claim fragile. It relies on the empirical premise that agents treat isomorphic games similarly. If agents are "clever" and treat the commitment device in $G'$ as a signal to exploit, the safety guarantee breaks.

  **The Robustness Clash:**
  **Ex-Post Dominance** is logically incompatible with **Payoff Robustness** at the limit.
  *   **The Conflict:** A guarantee of "strictly better with certainty" relies on strict inequalities ($u' > u$). If payoffs are continuous variables subject to noise, a strict inequality can always be flipped by sufficient noise.
  *   **The Cost:** You must either accept "improvement with probability $1-\delta$" (violating Certainty) or require a minimum utility gap $\Delta$ (violating Scope/Non-Vacuity on tight games).

  **The Most Exclusionary Requirement:**
  **Ex-Post Dominance (Certainty) without Distributional Assumptions.**
  This requirement excludes almost all standard mechanism design, all Bayesian solutions, and most cheap-talk protocols. It forces the designer into the narrow corridor of "program equilibrium" or "binding commitment" solutions where the logic of the game forces the outcome rather than incentivizing it.

  ---

  ### IV. Scorecard of Existing Notions

  **1. Belief-Free Improvements (Oesterheld/Conitzer style)**
  *   *Mechanism:* Replace $G$ with $G'$ where strategies are restricted or mapped via isomorphism assumptions.
  *   *Score:* Passes **Belief-Freeness** and **Ex-Post Dominance** (within the model). Fails **Payoff Robustness** (knife-edge relies on exact isomorphism). Fails **Partial Adoption** (usually assumes universal delegation).
  *   *Verdict:* Theoretically pure, empirically fragile.

  **2. Cheap-Talk + Advance Commitments**
  *   *Mechanism:* Pre-play communication rounds with binding responses ("If you say X, I do Y").
  *   *Score:* Passes **Implementability**. Fails **Ex-Post Dominance** (cheap talk allows lying; commitments must be credible). Fails **Belief-Freeness** (credibility often depends on beliefs about reputation).
  *   *Verdict:* Good for coordination, unsafe for high-stakes miscoordination.

  **3. Program Renegotiation (EU Maximizers)**
  *   *Mechanism:* Agents submit source code; code negotiates a correlated equilibrium before playing.
  *   *Score:* Passes **Scope** and **Composition**. Fails **Belief-Freeness** (requires common priors to agree on the negotiation solution). Fails **Certainty** (negotiation can fail, leading to default $G$).
  *   *Verdict:* Efficient, but not "Safe" in the strict sense.

  **4. Compensation Test (Kaldor-Hicks with Side Payments)**
  *   *Mechanism:* Modify $G$ to increase total surplus; losers are paid by winners.
  *   *Score:* Passes **Non-Vacuity**. Fails **No Interpersonal Comparisons** (requires cardinal utility for pricing compensation). Fails **Ex-Post Dominance** (compensation is often contingent on outcomes, reintroducing risk).
  *   *Verdict:* Standard welfare economics, incompatible with SPI constraints.

  ### V. Summary Recommendation

  If you require **Ex-Post Dominance** and **Belief-Freeness**, you are forced to accept **Vacuity** unless you adopt the **Isomorphism Assumption** as an axiom of player psychology rather than a game structure.

  To make progress, you must relax **Ex-Post Dominance** to **High-Probability Safety** (allowing $\epsilon$ risk) OR relax **Belief-Freeness** to **Common Qualitative Assumptions** (e.g., "all players reason via CDT and recognize isomorphisms"). The current literature attempts to hold both, which is why non-trivial examples are rare and brittle. The **Partial Adoption** constraint is the most likely point of failure for any proposed scheme; most SPIs work only as a coordinated switch, not as an open protocol.
