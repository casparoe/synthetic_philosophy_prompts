      *   **Section 4: The Extreme Models (Health vs. Freedom).**
          *   Health-Only: Everything is medical. Stigma removed, but autonomy reduced (mandatory treatment?).
          *   Freedom-Only: Everything is market/personal. No age limits, no employment testing (bodily integrity).
      *   **Conclusion:** Summary of the trade-offs.

  7.  **Refine the Tone:**

