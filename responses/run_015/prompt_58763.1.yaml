          *   View: Drug use is a symptom or a disease management issue.
      *   *Freedom-Only (Full Libertarian/Deregulation):*
          *   Focus: Bodily autonomy, property rights.
          *   Changes: No age limits (maybe), no licensing (free market), employers *cannot* test (bodily integrity), landlords *cannot* ban (property use rights). Or, conversely, total private discretion (state stays out entirely).
          *   *Correction:* A "Freedom-Only" model usually means the state doesn't interfere. So, no bans on selling, but also no state protection from private consequences. However, if "Freedom" means "Civil Liberty," then private discrimination might be banned. I need to clarify this distinction. Let's define "Freedom-Only" as "Bodily Autonomy + Market Freedom."
          *   Changes: Legalize everything, remove age restrictions (pure autonomy), prevent employers from policing off-clock behavior.

  6.  **Synthesize and Structure the Argument:**

