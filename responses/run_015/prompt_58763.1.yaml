answer: |-
  You have hit on a really sophisticated tension in drug policy. The confusion you feel comes from the fact that these laws aren't just based on one consistent philosophy (like "people are rational" or "drugs are bad"). Instead, they are patchworks of **pragmatism, morality, and property rights.**

  Here is a breakdown of the views on choice and responsibility baked into these models, whether they strictly require those views, and what the extremes would look like.

  ### 1. The Portugal Model (Decriminalization)
  **Your Hypothesis:** *It presupposes users aren't fully in control (so no punishment), while dealers are (so punishment).*

  **The Reality:** It's less about *control* and more about *harm and role.*
  Portugal's model (decriminalization of possession, criminalization of trafficking) doesn't necessarily assume users lack agency. If they believed users had zero control, they wouldn't fine them or suspend their gun licenses (which the Dissuasion Commissions can do).

  *   **The View on Users:** It treats the user as a **consumer of a risk**, not a criminal enemy. The assumption is that criminalizing the user creates more social harm (prison, lost jobs, stigma) than the drug use itself. It shifts responsibility from "obey the law" to "manage your health."
  *   **The View on Dealers:** Dealers are criminalized because they are viewed as **profiteers of harm**. The logic is that while using might be a personal choice or a health issue, *selling* is an act of introducing that risk into the community for profit.
  *   **Does it need this view?** No. You could justify Portugal's model without saying users "lack control." You could justify it purely on **Utilitarianism**: "Punishing users costs taxpayers money and increases HIV rates; treating them saves money and lives." It fits a **Public Health** framework better than a **Determinist** one.

  ### 2. The US Weed Model (Regulated Legalization)
  **Your Hypothesis:** *It tries to have it both ways: saying it's a free choice but not protecting that choice.*

  **The Reality:** This is a clash between **Civil Liberty** and **Private Property Rights.**
  This model isn't necessarily hypocritical; it draws a hard line between the *State* and the *Market*.

  *   **The State's View:** "We (the government) will not arrest you for this. It is a legal activity for adults." This acknowledges **Bodily Autonomy**.
  *   **The Employer/Landlord's View:** "We (private owners) do not have to accommodate the risks associated with that activity." This acknowledges **Property Rights** and **At-Will Employment**.
  *   **The Responsibility Baked In:** It assumes you are responsible enough to buy it legally, but you are *also* responsible for the consequences of that choice in the private sphere. If you choose to smoke, you choose to risk your job. The law protects you from the police, but it does not protect you from the market.
  *   **Does it need this view?** It fits perfectly with **Liberal Capitalism**. In this view, freedom is "negative liberty" (freedom from government interference), not "positive liberty" (guaranteed ability to act without consequence). It doesn't require the view that "choice isn't protected," but rather that "private contracts override public permissions."

  ### 3. What if we switched models entirely?

  To see the assumptions clearly, it helps to look at the two theoretical extremes you mentioned.

  #### A. The "Health-Only" Model (Full Medicalization)
  If we fully committed to the view that drug use is purely a health matter (like diabetes or depression):

  *   **Choice/Responsibility:** Drug use is viewed as a symptom or a management issue, not a moral choice.
  *   **What would change:**
      *   **Possession:** Never a crime. Always a medical interaction.
      *   **Dealing:** Could go two ways. Either it becomes strictly pharmaceutical (only doctors dispense), OR dealers are treated as people endangering public health (like selling contaminated food) rather than "criminals."
      *   **Employment/Housing:** You generally cannot fire someone for having diabetes. In this model, you couldn't fire someone for a positive drug test unless they were impaired *at work*. Addiction would be a protected disability.
      *   **The Trade-off:** You gain protection from stigma and punishment, but you lose privacy. The state/medical system might claim the right to mandate treatment if your use becomes "severe," arguing you are sick and need help whether you want it or not.

  #### B. The "Freedom-Only" Model (Full Libertarian/Deregulation)
  If we fully committed to the view that bodily autonomy and free markets are absolute:

  *   **Choice/Responsibility:** You own your body; you own your business. The state has no say in either.
  *   **What would change:**
      *   **Possession/Buying:** No age limits (minors' rights vs. parental rights), no licensing for shops. Any substance could be sold like alcohol or caffeine.
      *   **Employment/Housing:** This is the tricky part.
          *   *Version 1 (Bodily Integrity):* Laws prevent employers from testing off-clock behavior. What you do at home is your business.
          *   *Version 2 (Pure Property):* Employers can fire you for *anything*, including eating a banana, if they want. The state doesn't regulate drug tests, but it also doesn't regulate the drugs.
      *   **The Trade-off:** You get maximum access and minimum state interference. However, without "Health" safeguards, there is no state-funded treatment, no potency limits, and no consumer protection against addictive product design.

  ### Summary of the Baked-In Assumptions

  | Model | View on User Choice | View on Responsibility | Primary Conflict |
  | :--- | :--- | :--- | :--- |
  | **Portugal** | Choice exists, but criminal law is the wrong tool to manage it. | Civic responsibility (fines/treatment) rather than Penal responsibility (prison). | **Harm Reduction** vs. **Moral Justice** |
  | **US Weed** | Choice is legal, but consequences are private. | You are free to do it, but fully liable for how it affects your contracts (job/lease). | **Public Liberty** vs. **Private Property** |
  | **Health-Only** | Choice is secondary to well-being. | Society is responsible for your health; you are responsible for accepting care. | **Autonomy** vs. **Paternalism** |
  | **Freedom-Only** | Choice is absolute. | You bear all risks; the state bears none. | **Liberty** vs. **Safety** |

  **The Verdict:**
  Your intuition is right that these systems feel contradictory. That's because they are trying to solve different problems. Portugal is trying to stop the **justice system** from breaking addicts. The US Weed model is trying to let the **market** sell weed without forcing **businesses** to accept the liability.

  Neither requires the view that users "can't control themselves." Portugal just thinks prison makes control *harder*. The US thinks your boss should have the right to judge your control, not the government.
