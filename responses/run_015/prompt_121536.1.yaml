      Aristotle contends that assigning a definite truth-value to future contingent statements entails fatalism because truth implies a fixed reality, so he resolves the problem by denying bivalence for such propositions rather than altering logical necessity. The bridge between truth and necessity relies on the assumption that if a prediction is true now, the state of affairs it describes is already determined in the present, making it impossible for things to turn out otherwise. If a statement about the future is already true, it functions like a statement about the past, and since past truths are unchangeable and necessary, the future event becomes equally unchangeable. This creates a modal collapse where the definition of "possible" as "capable of being otherwise" is destroyed, because every future event becomes either necessary (if the statement is true) or impossible (if the statement is false). Consequently, nothing would happen by chance or deliberation, as all outcomes would be fixed by the eternal truth-value of propositions. Aristotle avoids this by distinguishing the Law of Excluded Middle from the Principle of Bivalence, maintaining that while it is necessary that either the battle will occur or it will not, it is not yet true that one specific side of the contradiction holds. By treating the truth-value of future contingents as indeterminate until the event occurs, he preserves the reality of chance and human agency without violating logical laws. Giving up definite truth-values for future events resolves the worry because it prevents the present from containing the fixed facts that would force the future to unfold in only one way.

