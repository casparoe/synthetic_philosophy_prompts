answer: |-
  ### Brainstorming & Conceptual Mapping

  Before I lay out the critique, I need to map exactly where your view sits in the conceptual space. You are proposing a **Pure Ex-Ante Prioritarianism** (let's call it PEAP).

  1.  **The Core Claim:** Moral value is a function of the distribution of *risk profiles* (ex-ante expectations), not *realized welfare* (ex-post outcomes).
  2.  **The LDO Defense:** You argue that because risk is fixed prior to resolution, leveling down the well-off (ex-post) doesn't alter the risk distribution. Therefore, the act has no negative moral weight regarding priority.
  3.  **The Tension:** Standard Prioritarianism (Parfit) is outcome-regarding. It says benefits to the worse off matter more. Your view says *exposure to the possibility of being worse off* matters more, regardless of whether they actually become worse off.
  4.  **The Immediate Red Flag:** If ex-post welfare is morally inert, why do we care about risk? Risk is derivative; it is only bad because it threatens bad outcomes. If the outcomes don't count morally, the threat seems to lose its normative force. This is the "Fetishism" worry.
  5.  **Formal Landscape:** I need to bring in the social choice impossibility results regarding Ex-Ante vs. Ex-Post Pareto. If you satisfy Ex-Ante Pareto and a Prioritarian weighting, you often violate Ex-Post Pareto (Mongin, Fleurbaey).
  6.  **The "Metric" Worry:** You mention tweaking the risk metric. Is this objective chance? Subjective credence? Epistemic probability? If you switch metrics to save the theory from counterexamples, you risk making the view a "just-so story" generator.
  7.  **Collapse Conditions:** When uncertainty vanishes (probability = 1), Ex-Ante views must align with Ex-Post views. If your view says "outcomes don't matter" even when certainty is reached, it divorces from welfare entirely. If it says "outcomes matter once certainty is reached," you have a discontinuity problem.

  Okay, I have the map. I will structure the response by ranking the defeaters from fatal structural flaws to awkward implications, focusing on what a *sympathetic* prioritarian should worry about.

  ***

  ### Critical Map: The Vulnerabilities of Pure Ex-Ante Prioritarianism

  It is good to see work being done on the ex-ante dimension. As you know, the literature (Otsuka, Voorhoeve, Fleurbaey) has been grappling with the tension between fairness in chances and fairness in outcomes for decades. Your specific move—insulating the view from the Leveling-Down Objection (LDO) by anchoring moral weight exclusively in risk exposure—is bold. It technically succeeds in dodging the *standard* formulation of the LDO, but I fear it does so by cutting the normative tether to welfare itself.

  Here is the honest map of defeaters, ranked from fatal structural inconsistencies to awkward intuitive costs. I have focused on arguments that should worry a *prioritarian*, not just a utilitarian or egalitarian critic.

  #### 1. Fatal: The "Fetishism" of Risk (Outcome Insensitivity)
  This is the most dangerous internal critique. You claim to dodge the LDO because harming the well-off ex-post doesn't change the ex-ante risk burden. But if ex-post welfare levels carry *no* moral weight in your calculus, you are no longer a welfarist prioritarian; you are a **risk-distribution fetishist**.

  *   **The Problem:** Risk is instrumentally bad, not intrinsically bad. We care about a 50% chance of starvation because starvation is bad. If two societies have identical risk profiles, but in Society A everyone gets lucky and thrives, and in Society B everyone gets unlucky and starves, your view (strictly read) implies these societies are morally equivalent.
  *   **Why it's Fatal:** Prioritarianism is fundamentally a view about how to weigh *benefits* to individuals. If benefits (ex-post welfare) don't count, you aren't prioritizing people; you're prioritizing probability distributions. A committed prioritarian must admit that actual suffering matters. If you concede that ex-post welfare matters *at all*, you reopen the door to the LDO, because leveling down now affects the moral metric.
  *   **The Concession:** You must admit that your view is not a theory of *distributive justice over welfare*, but a theory of *procedural justice over chances*. This limits its scope significantly.

  #### 2. Fatal/Formal: The Ex-Ante / Ex-Post Pareto Conflict
  You asked for formal results. The most significant threat comes from the impossibility theorems surrounding the aggregation of individual preferences under uncertainty.

  *   **The Result:** Work by **Mongin (2001)** and **Fleurbaey (2010)** demonstrates that you cannot simultaneously satisfy:
      1.  **Ex-Ante Pareto:** If everyone prefers Lottery A to B based on expected utility, Society prefers A to B.
      2.  **Ex-Post Pareto:** If A turns out better for everyone than B after resolution, Society prefers A to B.
      3.  **Prioritarian Weighting:** Giving extra weight to the worse off (whether in expectation or outcome).
  *   **The Break:** To maintain your Ex-Ante Prioritarianism, you must violate Ex-Post Pareto. This means there are cases where *everyone* is actually better off in Outcome B, but your view recommends Outcome A because the *risk profile* was better.
  *   **Why it's Fatal:** This makes the view **paternalistic in the extreme**. It overrides the actual interests of all individuals in favor of a statistical abstraction. A prioritarian cares about individuals. Telling a group of people, "I know you are all suffering more in this world, but the *risk* was distributed better," is a hard sell for a view grounded in individual moral urgency.

  #### 3. Serious: The Discontinuity (Collapse) Problem
  You asked about limit cases. Consider the limit where uncertainty approaches zero.

  *   **The Scenario:** Suppose we have a policy that leads to a certain outcome (Probability = 1). In this limit, Ex-Ante Risk = Ex-Post Outcome.
  *   **The Collapse:** Does your view suddenly become vulnerable to the LDO at Probability = 1?
      *   **If Yes:** You have a discontinuous moral theory. A 99.9% chance of an outcome is evaluated by Risk Priority, but a 100% chance is evaluated by Outcome Priority. This arbitrariness undermines the theoretical unity of the view.
      *   **If No:** You maintain that even at 100% certainty, only the "risk history" matters. This leads back to the Fetishism objection (Defeater #1). You would have to say that a world where everyone certainly starves is morally equivalent to a world where everyone certainly feasts, provided the "risk exposure" leading up to it was identical.
  *   **The Concession:** A smart defender must admit that the view loses traction as uncertainty resolves. This suggests the view is a *decision guide* for policymakers under uncertainty, not a *metric of justice* for evaluating states of affairs.

  #### 4. Awkward: Compensation and "Bad Luck"
  How does your view handle compensation for those who suffer despite fair odds?

  *   **The Intuition:** Most prioritarian views (and egalitarian ones) support a social safety net. If someone falls into a pit despite having a fair chance to avoid it, we help them because they are *now* worse off.
  *   **Your View's Implication:** If the ex-ante risk was fairly distributed, and the individual lost the gamble, your view suggests no *priority-based* reason to compensate them. Their "risk burden" was already accounted for. To compensate them now is to double-count their disadvantage.
  *   **The Problem:** This aligns your view closely with **Luck Egalitarianism** (specifically the "brute luck" variant), which is notorious for being harsh on the imprudent or unlucky.
  *   **Catastrophic Risk:** This gets worse with low-probability catastrophes. If a policy has a 0.01% chance of killing a million people, but saves everyone a small amount of effort ex-ante, an Ex-Ante Prioritarian view might endorse the risk (depending on the weighting function). An Ex-Post view would scream that the million victims are the *worst off* and must be prioritized. Your view might undervalue preventing catastrophes because the *ex-ante* burden is spread thinly across everyone (via precaution costs), whereas the *ex-post* burden is concentrated.

  #### 5. Methodological: The Unfalsifiability of the "Risk Metric"
  You asked if tweaking the risk metric makes the view unfalsifiable.

  *   **The Worry:** When a counterexample hits (e.g., "What about the person who faced low risk but suffered greatly?"), do you switch from **Objective Chance** to **Subjective Credence** to **Epistemic Probability**?
  *   **The Verdict:** This is not fatal, but it is methodologically costly. If the metric is flexible, the view risks becoming a **description of intuitions** rather than a **generator of them**.
  *   **Is it a Problem?** For a normative view, some flexibility is allowed (e.g., specifying the "currency" of advantage). However, if the definition of "risk exposure" shifts to ensure the "right" outcome in every thought experiment, the theory loses predictive power.
  *   **The Concession:** You need a fixed metaphysics of risk. You must commit to whether risk is "out there" in the world (propensity) or "in here" (credence). If you don't, critics will charge that you are simply reverse-engineering the risk metric to match your pre-theoretic intuitions about welfare.

  ### Summary: What a Committed Proponent Should Admit

  If I were defending this view in a dissertation defense, here is what I would advise you to concede to show intellectual honesty:

  1.  **Admit Outcome Insensitivity:** Acknowledge that your view privileges *procedural fairness* over *outcome goodness*. You are not solving the problem of suffering directly; you are solving the problem of *unfair exposure* to suffering. This limits the view's applicability to ex-ante policy choices, not ex-post redress.
  2.  **Accept the Pareto Violation:** Concede that your view will sometimes recommend policies that make *everyone* actually worse off, provided it improves the distribution of risk. Argue that this is a feature, not a bug (we value fairness over aggregate welfare), but own the cost.
  3.  **Clarify the LDO Dodge:** Admit that you dodge the LDO only by changing the subject from "welfare distribution" to "risk distribution." The LDO still applies to the *risk* itself (i.e., "Leveling Down of Chances"). If you equalize risk by making everyone's chances worse (e.g., everyone has a 50% chance of death instead of some having 10% and some 90%), does your view endorse it? If so, you haven't escaped LDO; you've just moved it upstream.
  4.  **Define the Metric:** Commit to a specific definition of risk to avoid the unfalsifiability charge. I recommend **Objective Chances** for policy evaluation, but acknowledge this creates the "Harshness" problem for those who suffer due to bad brute luck.

  ### Final Thought
  Your view is essentially a sophisticated form of **Ex-Ante Egalitarianism** with a prioritarian weighting function. It is a live position in the literature (see *Voorhoeve & Fleurbaey, "Prioritarianism and Risk"*). However, the claim that it "dodges" the Leveling-Down Objection is slightly misleading. It avoids the *Ex-Post* LDO by ignoring ex-post welfare, but it inherits an *Ex-Ante* LDO (why equalize risks if it lowers expected utility for everyone?).

  The strongest version of your view doesn't claim to solve all distributive justice problems. It claims that **under conditions of uncertainty, the fairness of the gamble is the primary moral currency.** If you frame it that narrowly, it is defensible. If you claim it replaces standard prioritarianism for all moral evaluation, the formal and intuitive defeaters above will likely break it.
