      **Welcome Aboard**
      Congratulations on securing your berth. At Aqua Mundi, we recognize that safety is not a universal condition but a managed asset. You are here because you qualify for protection. While others remain in the water, you have been selected for stability. Please review this guide to understand how we maintain the integrity of our vessel against the encroaching sea.

      **Our Philosophy**
      Aqua Mundi operates under the Lifeboat-First Governance Charter. We explicitly reject the romantic notion of "Spaceship Earth." There is no shared commons, only distinct vessels with fixed carrying capacities. To pretend otherwise is to invite disaster. Our ship has a Maximum Safe Load, determined by engineering, not sentiment. Adding weight beyond this limit does not spread justice; it ensures everyone drowns. Therefore, we prioritize the survival of those already aboard over the rescue of those outside. Universal solidarity is a dangerous fiction that compromises structural buoyancy. We believe that complete justice leads to complete catastrophe. Our duty is to the vessel, not the ocean.

      **Emergency Protocols**
      In the event of a mass-swimming incident, passengers must remain calm. Do not attempt to pull survivors aboard without authorization. Unregulated rescue efforts destabilize the hull. Instead, crew will deploy the **Dynamic Capacity Index (DCI)**. The DCI recalculates remaining seats in real-time, factoring in each passenger's projected resource consumption over the voyage duration. If a potential rescue target exceeds the caloric or spatial allowance of the current DCI score, boarding is denied. This is not cruelty; it is arithmetic. Distributing resources to all produces total ruin rather than justice. We must guard against the tragedy of the commons by ensuring the commons remains closed. Safety gates will lock automatically when the DCI reaches zero.

      **Frequently Asked Questions**

      *Q: Why don't we share our supplies with everyone in the water?*
      A: Sharing finite resources with infinite demand guarantees the depletion of all stocks. If we feed everyone, no one eats. Survival requires selective exclusion.

      *Q: How is boarding priority determined during evacuations?*
      A: Priority is assigned via the **Pre-Boarding Contribution Assessment (PCA)**. The PCA evaluates a candidate's prior tax contributions to maritime governance structures. Need is not a valid metric; civic investment is. Those who have funded the vessel deserve its protection. This converts moral scarcity into an objective procedural rule.

      *Q: Is there any hope for those left behind?*
      A: Hope is not a safety protocol. Please return to your cabin.

