answer: |-
  This is a classic case of what happens when a heuristic slogan is treated as a law of nature. As a scientist, your instinct is correct: the phrase "all art is propaganda" is operationally useless until you define your terms and specify the relationship between the variables (art, propaganda, intent, effect).

  In your book club, you are witnessing a category error. One member is making a *sociological observation* (how art is received), while treating it as a *normative rule* (how art should be judged). The member who walked out likely sensed the reductionism but lacked the vocabulary to isolate the flaw.

  Here is the dissection you requested. I have broken the slogan down into four distinct claims, ranging from the empirically sound to the philosophically reductive. I have also included a section on Du Bois's actual text, because you are right to suspect citation drift.

  ### Part 1: The Historical Context (Du Bois, 1926)
  **The Source:** The line comes from Du Bois's essay *Criteria of Negro Art*, delivered as an address to the NAACP in 1926.
  **The Actual Quote:** "Thus all Art is propaganda and ever must be, despite the wailing of the purists."
  **The Context:** Du Bois was not making a universal claim about the *Mona Lisa* or Beethoven's Symphonies in a vacuum. He was arguing specifically about **Black art in a racialized society.** His argument was that because Black humanity was constantly under political attack, Black artists could not afford the luxury of "art for art's sake." If they wanted their work to exist and be seen, it *had* to fight for the legitimacy of Black life.

  **The Drift:** Modern usage often universalizes this into "All Art (everywhere, always) is Propaganda." Du Bois was making a situational claim about *survival*, not an ontological claim about *aesthetics*. He actually argued that the best propaganda *must* possess beauty to be effective. He did not say political utility replaces aesthetic value; he said they must be fused for the specific project of racial justice.

  ---

  ### Part 2: The Menu of Claims
  Here are four precise ways to operationalize the slogan. I have evaluated each for plausibility and whether it supports your book club member's specific argument (that the author should be judged on whether unsympathetic characters hurt "the struggle").

  #### Claim 1: The Reception Thesis (Descriptive/Sociological)
  *   **The Claim:** "All art is *received* within a political context, and audiences will derive political meaning from it regardless of the artist's intent."
  *   **Plausibility:** **High.** This is empirically robust. Art does not exist in a vacuum. A novel about Black characters written in 2024 will be read through the lens of current racial politics, even if the author claims to be writing a universal human story.
  *   **Does it support the Book Club Member?** **Weakly.** This explains *why* people are judging the book politically, but it does not justify *that* they should. It describes the mechanism of the criticism, but it doesn't validate the criticism as the *correct* metric for quality. It acknowledges the effect exists, but doesn't mandate the author optimize for it.

  #### Claim 2: The Ethical Imperative (Normative/Prescriptive)
  *   **The Claim:** "Artists from oppressed groups have a moral obligation to prioritize political utility over aesthetic autonomy."
  *   **Plausibility:** **Contested.** This is a philosophical stance, not a fact. It posits that group survival trumps individual expression. It is arguable, but it is a value judgment, not a description of reality.
  *   **Does it support the Book Club Member?** **Yes, Directly.** This is almost certainly what she meant. She is arguing that the author has a duty to the group. If this claim is accepted, then unsympathetic characters are a breach of duty if they reinforce negative stereotypes, regardless of how well-written they are.

  #### Claim 3: The Reductionist Thesis (Definitional/Aesthetic)
  *   **The Claim:** "The aesthetic value of a work is identical to its political utility. 'Good art' is simply art that advances the correct political end."
  *   **Plausibility:** **Low.** This is the "philistinism" your other member objected to. It collapses two distinct variables (craft/beauty and political effect) into one. History is full of art that was politically "useful" but aesthetically terrible (forgotten socialist realism, bad protest songs), and art that was politically ambiguous but aesthetically transcendent.
  *   **Does it support the Book Club Member?** **Yes, but dangerously.** If this is true, then craft doesn't matter. If the unsympathetic characters serve justice, the book is "good." If they don't, it's "bad," even if the prose is brilliant. This removes the ground for discussing literature *as literature*.

  #### Claim 4: The Causal Thesis (Empirical/Predictive)
  *   **The Claim:** "Art inevitably functions as propaganda; it will measurably shift audience attitudes in a specific direction."
  *   **Plausibility:** **Mixed/Unproven.** This is a hypothesis that requires data. Does reading a novel with unsympathetic Black characters actually increase racism in the audience? Or does it foster empathy for complexity? The causal link between specific artistic choices and long-term political outcomes is notoriously difficult to isolate (confounding variables are everywhere).
  *   **Does it support the Book Club Member?** **Only if proven.** She is assuming the causal link (Unsympathetic Character → Harm to Struggle). If the novel actually humanizes flawed people in a way that deepens understanding, the "propaganda" might be working *for* justice, not against it. This claim requires evidence she likely doesn't have.

  ---

  ### Part 3: The "Unsympathetic Characters" Variable
  There is a specific flaw in your book club member's application of the theory, which you can point out without attacking her personally.

  Even if we accept **Claim 2 (The Ethical Imperative)**, it does not automatically follow that "unsympathetic characters" are bad propaganda.
  *   **Positive Representation Propaganda:** Shows Black excellence to counter stereotypes. (Risk: Uncanny valley, lack of depth).
  *   **Humanist Realism Propaganda:** Shows Black complexity (including flaws) to assert that Black people are fully human, not caricatures of virtue. (Risk: Reinforcing stereotypes).

  Du Bois himself wrestled with this. He wanted to counter the "lying tales" of Black inferiority, but he also warned against art that was merely "boosting." If the novel in question portrays flawed Black characters with psychological truth, one could argue it is *better* propaganda for long-term humanity than a novel full of saints. Your book club member is assuming a specific, short-term theory of propaganda (positive images = good) that ignores the long-term utility of truth-telling.

  ### Summary for the Group
  If you want to restore peace, I suggest proposing this operational distinction to the group:

  1.  **Acknowledge Claim 1:** Agree that the book *will* be read politically (Reception Thesis). That is unavoidable.
  2.  **Isolate Claim 2:** Ask the group if they want to debate whether the author *ought* to have prioritized politics (Ethical Imperative). That is a valid ethical debate, but it is distinct from literary criticism.
  3.  **Reject Claim 3:** Push back gently on the idea that political utility is the *only* measure of the book's value (Reductionist Thesis).
  4.  **Contextualize Du Bois:** Remind them that Du Bois was arguing for Black art to be *both* beautiful and political, not to sacrifice beauty for politics. He wrote: *"I do not care a damn for any art that is not used for propaganda. But I do not care when the propaganda becomes merely art and is not art any longer."* He saw them as a synthesis, not a hierarchy.

  **The Bottom Line:** Your book club member is treating a **normative preference** (Black authors should protect the group image) as an **empirical law** (All art is propaganda). You can validate her concern (representation matters) without accepting the slogan (which kills the nuance required to discuss the book).
