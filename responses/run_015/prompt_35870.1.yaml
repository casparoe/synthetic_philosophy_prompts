      *   **The Conflict:** One member invoked W.E.B. Du Bois's line "all art is propaganda" to argue that the author's choices should be judged by their political effects on the struggle (i.e., representation politics). Another member called this philistinism and left.
      *   **The Task:** Deconstruct the slogan "all art is propaganda" into distinct, precise claims (from trivial to false). Evaluate plausibility. Determine if each claim supports the book club member's specific argument (judging character choices by political effects). Provide historical context on Du Bois's actual usage.
      *   **Tone:** Intellectual, respectful, precise, analytical (appealing to the scientist background), but accessible.

  2.  **Deconstruct the Slogan ("All Art is Propaganda"):**
