  ### Setup and purpose

  The theory must adjudicate moral compromise between parties holding incompatible terminal values without invoking a shared cardinal currency. It faces a nonprofit board scenario: animal-welfare and global-health factions must set budget and policy. Money cannot buy stance; neither side accepts the other's axiology. The account must distinguish genuine mutual improvement from mere modus vivendi, capitulation, or epistemic hedging. It must quantify gains without interpersonal utility comparisons, model the integrity tax of endorsing wrongness, and remain determinate enough to recommend specific divisions. Finally, it must withstand strategic misrepresentation of intensity. The output is a specification list revealing which desiderata are jointly unsatisfiable.

  ### The requirements

  The following table specifies the necessary conditions for a theory of moral compromise, detailing the motivation and negotiability of each. Collectively, these requirements force the theory to navigate the space between moral absolutism and utilitarian aggregation. The non-negotiable items define the problem space, while the camp preferences reflect specific hypotheses about where gains originate.

  | Requirement | Motivation | Status |
  | :--- | :--- | :--- |
  | **Incommensurability Constraint** | The core difficulty is the lack of an agreed cardinal currency between value systems. Money cannot serve as a side payment because both sides think buying or selling the organization's stance is itself objectionable. The theory must not help itself to interpersonal comparison or a shared cardinalization, as that being the entire difficulty. Using a common metric would dissolve the problem rather than solve it. | Non-negotiable |
  | **Own-Lights Pareto** | The theory should say when a compromise is a genuine improvement by each party's own lights. This is opposed to a modus vivendi, a capitulation dressed up as an agreement, or a refusal to compromise that was correct. Each faction must see the outcome as better than their best alternative to negotiated agreement. | Non-negotiable |
  | **Modus Vivendi Distinction** | Everyone argues from a single favorite case, so the list must distinguish genuine joint improvement from mere temporary truce. A modus vivendi rests on power balance; a genuine compromise rests on mutual gain. The theory must identify the surplus created, not just the cessation of conflict. | Non-negotiable |
  | **Integrity Tax Integration** | Must model the integrity tax: the cost a party bears, over and above how the outcome ranks by its own lights, from having authorized or lent credibility to something it thinks is wrong. I want to know whether a non-trivial integrity tax is compatible with there being any gains from trade at all. | Non-negotiable |
  | **Determinacy** | While avoiding common currency, the theory must still output something determinate. It must be determinate enough to actually recommend a division to someone. Vague appeals to dialogue fail this test. It must specify the budget split or policy line. | Non-negotiable |
  | **Gain Source Specification** | My guess is that people conflate two sources: diminishing marginal returns along a single issue, and nonconvexities plus differing intensities across separate issue dimensions. If that taxonomy is right the theory should predict which mechanism applies from features of the case. | Camp Preference |
  | **Strategy-Proofness** | It should be robust to strategic misrepresentation. If a party does better by exaggerating how much it cares about an issue, and both sides know this about each other, the naive gains seem to evaporate. I want to know whether that is fatal or merely an engineering problem. | Non-negotiable |
  | **Hedging Distinction** | It must distinguish a genuine joint improvement from epistemic hedging between value systems, and say whether hedging is a separate mechanism or a special case of the same one. This prevents confusing uncertainty about the good with disagreement about the good. | Camp Preference |

  ### Collisions

  The suspected unsatisfiable subset comprises Incommensurability, Determinacy, and Strategy-Proofness. Mechanism design impossibility results suggest that without a common currency to truthfully reveal intensity, any determinate rule is manipulable. If parties know this, they exaggerate care to shift the determinate outcome, evaporating naive gains. Adding a live Integrity Tax tightens the constraint: if endorsing wrongness carries a fixed cost independent of outcome quality, the zone of Pareto improvements shrinks. If the tax is high enough, no gains remain. To maintain Determinacy without Currency, one must accept manipulability. To maintain Strategy-Proofness without Currency, one must accept indeterminacy. Thus, you cannot have a determinate, strategy-proof compromise mechanism that respects incommensurability. The Integrity Tax further threatens the existence of any gains at all, potentially rendering the Pareto condition unsatisfiable regardless of mechanism. Specifically, if the integrity cost exceeds the marginal benefit of the compromise policy, the Own-Lights Pareto requirement fails. This creates a trilemma: either accept that compromises are manipulable, accept that they are indeterminate, or accept that genuine gains are rarer than hoped because integrity taxes consume the surplus. The most likely casualty is Strategy-Proofness, as real-world bargaining is rarely incentive-compatible. Furthermore, if Epistemic Hedging is treated distinct from Value Compromise, the Integrity Tax calculation becomes ambiguous. Is the cost from endorsing a wrong value or a uncertain value? If the theory cannot distinguish these, the Integrity Tax cannot be calculated, breaking Determinacy. This reinforces the collision: without resolving the hedging status, the tax remains undefined, making Determinacy impossible under Incommensurability.

  ### The load-bearing requirement

  The Incommensurability Constraint is the load-bearing requirement. If dropped, the problem dissolves into standard welfare economics. Utilitarian aggregation or Kaldor-Hicks efficiency could immediately solve the budget allocation by maximizing total utility across factions. This would let in theories that are obviously inadequate for the specific philosophical job, which is to handle disagreement about terminal values, not just interests. By forbidding a common currency, we force the theory to confront the hard problem of moral trade rather than smoothing it over with a meta-axiology. Every other requirement is manageable if we can just sum utilities. Therefore, this constraint does the most work in excluding candidate theories that rely on interpersonal comparisons or monetary side payments to resolve conflict. It ensures the theory remains about moral compromise rather than resource allocation. It forces the mechanism to find gains purely from structure or curvature rather than magnitude comparison. Without it, the Integrity Tax becomes just another utility term, losing its distinctive normative weight.

  ### Scorecard

  **Splitting the Difference**: Fails Strategy-Proofness by incentivizing extreme anchoring. It assumes diminishing returns without verification, violating Gain Source Specification. Often violates Own-Lights Pareto if the integrity tax of the midpoint exceeds the value of compromise.

  **Log-rolling/Turn-taking**: Satisfies Gain Source Specification by exploiting differing intensities across dimensions. Better on Strategy-Proofness if issues are separable. However, struggles with Determinacy regarding cycle length. Integrity Tax is critical here: endorsing a wrong policy every other cycle may be unacceptable, negating gains.

  **Jurisdictional Separation**: Scores high on Incommensurability and Integrity Tax, as neither side endorses the other's domain. However, it fails Determinacy on shared issues like overall budget splits. It is vulnerable to the Modus Vivendi critique, appearing as turf division rather than genuine compromise. It avoids strategy on policy but invites strategy on domain definition.

  Overall, Log-rolling offers the most plausible path to genuine gains, provided the integrity tax does not compound over time. Splitting the difference is the least robust, collapsing under strategic pressure. Jurisdictional separation is the safest for integrity but offers the least trade.
