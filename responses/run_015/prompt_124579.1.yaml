answer: |-
  1. **The Case**

  Elena, a lab technician, certifies sample 409 as O-negative using the standard dual-assay protocol, known to misclassify once per 10,000 runs. She believes the batch is for general inventory, where a mismatch triggers merely a wasted unit. In reality, a downstream routing error sent this unit to a trauma bay for a patient with rare antibodies; a mismatch here is fatal. Re-testing requires four hours and new reagents. Elena, unaware of the routing error, sees no reason to delay release. Dr. Aris, the assessing pathologist, knows the patient's status and the assay's fallibility. For Aris, the possibility of assay error is salient given the mortality risk. Elena proceeds to release the blood without re-testing. Aris reviews the log later. The evidence, costs, and proposition remain fixed across evaluations; only the awareness of stakes and assessors' salience varies.

  2. ** Held-Fixed Parameters**

  | Parameter | Value |
  | :--- | :--- |
  | **Proposition** | Sample 409 is O-negative |
  | **Evidence** | Dual-assay protocol (1/10,000 error rate) |
  | **Real Cost of Error** | Fatal (High) |
  | **Cost of Checking** | 4 hours + reagents (High) |
  | **Subject's Awareness** | Low (Believes routine inventory) |
  | **Assessor's Context** | High (Salient error possibility/Fatal stakes) |

  3. **Verdicts and Reasoning**

  | Account | Q1: Does she know? | Q2: May she act? | Reasoning & Key Feature |
  | :--- | :--- | :--- | :--- |
  | **Attributor Contextualism** | **No** | **Yes** | **Q1:** Keys on **Assessor's Context**. Aris's high-stakes context raises the standard; Elena's evidence fails it. **Q2:** Keys on **Subject's Context**. Elena's low-stakes deliberation lowers the standard; her evidence meets it, permitting action. |
  | **Interest-Relative Invariantism** | **No** | **No** | **Q1 & Q2:** Keys on **Actual Stakes**. The real cost is fatal, raising the invariant standard. Elena's evidence is insufficient for high stakes. No knowledge entails no permission to act. |
  | **Transparency-Conditioned Encroachment** | **Yes** | **Yes** | **Q1 & Q2:** Keys on **Perceived Stakes**. Encroachment triggers only on stakes in view. Elena sees low stakes, so the standard remains low. Her evidence suffices for knowledge and action. |

  4. **The Load-Bearing Feature**

  The tripartite split relies entirely on the **asymmetry of stake-awareness** (Subject ignores real stakes; Assessor acknowledges them).
  *   **Remove Subject Ignorance (Subject told stakes):** Transparency-Conditioned Encroachment collapses into Interest-Relative Invariantism (Both **No/No**), as perceived stakes now match actual stakes. Contextualism remains distinct (**No/Yes**).
  *   **Remove Assessor Salience (Assessor context relaxed):** Contextualism collapses into Transparency-Conditioned Encroachment (Both **Yes/Yes**), as the ascriber's standard lowers. Interest-Relative Invariantism remains distinct (**No/No**).
  This demonstrates that the divergence is not decorative; it requires both the gap between actual/perceived stakes and the gap between subject/assessor contexts to be open simultaneously.

  5. **Strongest Attack**

  **Target:** Interest-Relative Invariantism (IRI).
  **Attack:** **The Guidance Objection.** Epistemic norms are meant to guide deliberation. IRI makes knowledge status depend on facts inaccessible to the subject (the routing error). If Elena cannot access the stakes determining whether she knows, the norm "Act only on knowledge" cannot guide her. She is rational to act given her information, yet IRI declares she lacks knowledge and acts impermissibly. This severs the link between epistemic status and rational agency, rendering knowledge normatively inert for the subject.
  **Why Strongest:** It targets IRI's core motivation (linking knowledge to action) and shows it fails precisely when the link is needed most: when stakes are hidden. It is not merely an intuition pump but a structural critique of externalist pragmatic encroachment.
