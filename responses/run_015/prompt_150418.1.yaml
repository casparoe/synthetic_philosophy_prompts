          *   It is a *palimpsest*. The meaning layers.
      *   **Falsifiability / Changing My Mind:**
          *   What would prove hidden intentionality irrelevant? If aesthetic formalism holds absolute sway (New Criticism). If the text *alone* dictates value regardless of context.
