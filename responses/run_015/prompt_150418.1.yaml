answer: |-
  This is a sophisticated ontological puzzle that strikes at the heart of analytic aesthetics. You are proposing a category of artifact that functions as a *conceptual trap*: its aesthetic completion depends on the viewer's error, yet its artistic success depends on the eventual correction of that error. This creates a diachronic tension in the work's identity.

  Here is an analysis of the conceptual tension between causal and negative provenance, the applicability of Goodman's distinctions, and the conditions under which this reasoning might fail.

  ### 1. The Goodman Problem: Allographic Medium, Autographic Intent

  Nelson Goodman, in *Languages of Art*, distinguishes between **autographic arts** (like painting), where the history of production is constitutive of the work's identity (a perfect copy of a Vermeer is a forgery), and **allographic arts** (like music or literature), where the work is identified solely by compliance with a notation (a printed copy of *Hamlet* is as much *Hamlet* as the manuscript).

  Under standard Goodmanian logic, literary forgery is an oxymoron. If your forger produces a text that matches the notation of a "lost Modernist manuscript," and that manuscript never existed, they haven't forged a work; they have created a *new* work that is being fraudulently labeled. If the text is unique to them, it is an original in the allographic sense.

  However, your conceit challenges this by making the **history of production** semantically constitutive.
  *   **Standard Allography:** The meaning resides in the words.
  *   **Your Conceit:** The meaning resides in the *gap* between the words and the assumed origin.

  If the text is engineered to be read *as if* written by, say, Kafka in 1924, then the "notation" (the words) is insufficient to define the work. The work is not just the text $T$; the work is the function $f(T, \text{Attributed Context})$. By making the deception structurally necessary (like an unreliable narrator), you are effectively importing an **autographic dimension** into an allographic medium. The "hand" that produced it matters not because of the physical ink (as in painting), but because the *intentionality* behind the text is bifurcated.

  There is the **surface intentionality** (the simulated voice of the Modernist) and the **deep intentionality** (the Forger's critique of Modernism). In a standard novel, these align. In your performative forgery, they are adversarial. Therefore, Goodman's distinction fails to capture the ontology here. The work behaves autographically because its identity conditions require knowledge of its specific history of production (the act of forgery) to be fully instantiated. Without the history, you have only half the work.

  ### 2. Causal vs. Negative Provenance

  The tension you identify lies between two modes of valuing the artifact:

  **Causal Provenance** is the traditional humanist value. It posits that the aesthetic power of a text derives from the specific consciousness that generated it. We read Woolf to encounter Woolf's mind. If the provenance is fake, the causal chain is broken. The standard view (held by critics like Denis Dutton) is that upon exposure, the work suffers an "aesthetic collapse." The emotional resonance is retroactively poisoned because the perceived connection to the genius is severed.

  **Negative Provenance** is the value derived from the *distance* between the actual and the attributed. In your novel, the forgery is not a parasite trying to suck value from the host; it is a host trying to incubate a new organism. The value is not in the successful imitation of Kafka, but in the successful *deconstruction* of why we believe it is Kafka.
  *   **Before Exposure:** The work functions as a **Simulacrum**. It derives value from Causal Provenance (illusory).
  *   **After Exposure:** The work functions as a **Revelation**. It derives value from Negative Provenance (actual).

  Does the exposed forgery remain distinct? **Yes.** It is neither the "genuine article" (it lacks the causal genesis of the attributed author) nor an "innocent duplicate" (it possesses a unique historical property: the intent to deceive for aesthetic ends). It becomes a **palimpsest**. The aesthetic logic does not vanish; it inverts. The "failure" of the forgery (being caught) is the "success" of the artwork (revealing the mechanism of authority).

  If the revelation eliminated all non-derivative worth, it would imply that art is purely about the *source* and not the *effect*. But if the effect (the reader's realization of their own complicity in the authentication process) is part of the design, then the exposure is the *premiere* of the work, not its funeral.

  ### 3. What Would Change My Mind (Falsifiability Conditions)

  You asked for specific arguments or findings that would lead me to conclude that hidden intentional structure is aesthetically irrelevant or that provenance is merely a market construct.

  **Condition A: The Triumph of Radical Formalism (New Criticism)**
  If one accepts the strict tenets of New Criticism (Wimsatt and Beardsley's "Intentional Fallacy"), my argument collapses. If the text is a self-contained verbal icon, then the secret of its authorship is extrinsic data.
  *   *The Argument:* If the text stands on its own merits, the "concealed true authorship" is biographical trivia. If the aesthetic logic relies on the reader's ignorance, it is a **gimmick**, not a structure. A structure should hold regardless of external knowledge (like a sonnet's rhyme scheme). If the work *requires* the lie to function, it is not a literary work but a **prank**.
  *   *Conclusion:* If it can be proven that the "aha!" moment of exposure does not enrich the reading of the text itself but merely comments on the *market* surrounding the text, then the hidden intentionality is aesthetically irrelevant. The work would be a sociological experiment, not a literary one.

  **Condition B: Provenance as Purely Economic (Bourdieuian Field Theory)**
  If sociological analysis demonstrates that "provenance" is nothing more than a mechanism of capital accumulation with no correlate in phenomenological experience.
  *   *The Argument:* If readers report identical aesthetic experiences (same emotional resonance, same cognitive engagement) regardless of whether they believe the text is by Kafka or the Forger, then provenance is a market construct, not a philosophical category.
  *   *Conclusion:* If the "gap" creates no distinct aesthetic friction—if the reader feels no betrayal, no shift in perspective, no meta-cognitive engagement—then Negative Provenance is a fiction invented by critics to justify the existence of the forgery.

  ### 4. Vulnerabilities in This Reasoning

  My reasoning is most vulnerable in two areas:

  **1. The Problem of the "Double Bind"**
  For your conceit to work, the reader must be in two states simultaneously or sequentially.
  *   *Vulnerability:* If the exposure destroys the ability to re-read the text in the original mode, the work is self-cannibalizing. An unreliable narrator works because we can re-read and see the clues. A forgery works only once. If the "performance" of the forgery consumes the "text" entirely, leaving nothing to re-engage with after exposure, it lacks **repeatability**, a key criterion for literary endurance. If the work cannot survive the exposure as a readable text (only as a historical curiosity), it fails as literature and succeeds only as event art.

  **2. The Ethical/Aesthetic Contamination**
  My reasoning assumes the reader is willing to be played.
  *   *Vulnerability:* There is a distinction between *fictional deception* (I pretend to be a character) and *factual deception* (I pretend to be the author). If the reader feels ethically violated by the factual deception, that negative affect may overwhelm the aesthetic appreciation of the "Negative Provenance." If the feeling of "betrayal" blocks the appreciation of the "conceptual twist," then the causal provenance (the demand for honesty) trumps the negative provenance (the value of the gap). In this case, the exposure *does* drain the value, not because of ontology, but because of **trust**. Art relies on a contract; if the forger breaks the contract too severely, the audience leaves the theater.

  ### Summary for the Novel

  In your narrative, the forger is not creating copies; they are creating **temporal bombs**.
  *   **Phase 1 (Concealed):** The work is autographic in function (dependent on the specific fake history) but allographic in form. It draws value from Causal Provenance (the ghost of the Modernist).
  *   **Phase 2 (Exposed):** The work transmutes. It becomes a critique of Causal Provenance. It draws value from Negative Provenance (the gap).

  The tension is not whether the work survives exposure, but whether the *reader* survives the shift. The tragedy or triumph of your characters should hinge on whether the audience is capable of valuing the **Negative Provenance**—the beauty of the lie itself—or if they are slaves to the **Causal**, demanding a biological lineage for meaning.

  Your forger is essentially arguing that **authorship is a collaborative act between the writer and the believer.** By removing the believer's ignorance, you don't kill the work; you force the believer to become a co-conspirator. That is the aesthetic logic you are defending.
