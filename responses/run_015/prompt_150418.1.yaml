      *   **The Problem:** Standard theory says forgery is parasitic (value collapses upon exposure). These "performative forgeries" seem to change status without becoming mere copies.
      *   **Task:** Explain the conceptual tension between *causal provenance* (value from actual creator) and *negative provenance* (value from the gap between attributed and actual author).
