prompt: |-
  hey — I'm stuck on a paper about aggregation in Scanlon-style contractualism and I want to stop and write down what I'd even count as a solution before going back to the literature and getting sucked in again.

  So: what does a contractualist way of handling aggregation actually have to do to count as adequate? I mean a principled story about cases where a big cost to one person has to be set against small benefits to many (or the other way round), inside the contractualist framing where the test is whether some individual could reasonably reject the principle — not whether total welfare goes up. Fix the purpose as this: it has to be a principle you could hand to an institution (a triage committee, a transport authority, an ethics review board) and have them actually decide a case, with the justification framed in terms no individual could reasonably reject. Not just "an interesting position in a debate."

  Give me the full spec. For each requirement, the case or consideration behind it, and whether it is genuinely non-negotiable for the view or just something one camp wants. I especially want to know which demands follow from contractualism itself and which are smuggled in from elsewhere: from consequentialism, from a prior commitment to the ordering being complete and transitive, from wanting the principle to be usable by actual committees under time pressure, and so on.

  Cases I want any candidate to handle, and ones I keep coming back to:

  - the plain one: one person loses a limb, ten thousand people avoid something trivial. Give your cleanest version.
  - dilution: same total benefit, spread over more and more people, so each person's share shrinks toward nothing. At what point should aggregating stop working, if ever? And is the thing being added up a sum of benefit sizes or a count of people who have a complaint? Those come apart and I think the spec has to say which one it is using.
  - the shrapnel case: one person loses something enormous. Can her loss be broken up into many smaller losses and set against many small benefits to many people? If the answer is no, why not — and does that depend on how fine-grained we make "a complaint"? If the answer is yes, hasnt aggregation just come back in through the back door?
  - the same-person-over-time version: the many small benefits and the one big cost all land on the same person at different times (lots of small pleasures now, one serious injury later). Is that structurally a different case from the many-person case, or the same one? I dont trust my intuition here.
  - the reverse direction: one person gets a large benefit, many people each lose a little.
  - mixed-motive / role-rotation: the people who benefit are also the ones imposing the risk, and anyone might end up on either side. Does that change what the principle needs to do?
  - the conditional-existence one: the many are people who will only exist if the principle permits aggregating.

  Then the part I care most about: flag any subset of the requirements you suspect cannot be jointly satisfied, and say which single requirement does the most work in ruling out candidates and which requirement is really a prejudice of one camp dressed up as neutral.

  Whatever you take Scanlon's own move to be — the bit where you compare how individuals fare across candidate principles rather than summing — I want a spec that an answer has to meet regardless of whether that move survives.

  Short scorecard at the very end is fine, but keep the weight on the criteria: (a) straight aggregation done inside contractualism, (b) the individualist style restriction where you compare the loser against each winner one at a time, (c) threshold or tie-breaker views where aggregation only gets to decide among principles that already survived individual objections, (d) ex ante or randomizing versions that aggregate expected complaints, (e) anything else that deserves a row. Dont bother with citations or a reading list, I cant look anything up rn — I know the names, I want the shape of the problem.
reasoning: |-
  Here's a thinking process that leads to the suggested specification for a contractualist solution to aggregation:

  1.  **Deconstruct the Request:**
      *   **Goal:** Define what counts as an *adequate* solution to the aggregation problem within Scanlon-style contractualism.
      *   **Constraint:** It must be actionable for an institution (triage committee, etc.), not just theoretical.
      *   **Framework:** Reasonable rejectability (individual complaints), *not* total welfare maximization.
      *   **Specific Cases to Handle:** Plain case (limb vs. trivial), Dilution, Shrapnel (fragmentation), Same-person-over-time, Reverse direction (one benefit/many costs), Mixed-motive/Role-rotation, Conditional-existence.
      *   **Critical Analysis:** Identify conflicting requirements, distinguish contractualist core vs. smuggled assumptions (consequentialism, completeness, usability), and evaluate specific strategies (straight aggregation, individualist restriction, threshold, ex ante, etc.).
      *   **Format:** Full spec, requirements with justification/negotiability status, case handling, tension analysis, scorecard. No citations.

  2.  **Initial Brainstorming & Core Tension:**
      *   *The Core Problem:* Contractualism is fundamentally individualistic ("no one could reasonably reject"). Aggregation is fundamentally collective ("the sum of small gains outweighs the big loss").
      *   *Scanlon's Move:* Compare the strongest complaint against Principle A with the strongest complaint against Principle B. Don't sum complaints.
      *   *The Institutional Need:* Institutions *must* make trade-offs. If 10,000 people get a headache vs. 1 person loses a leg, a hospital *will* choose the leg. A contractualist theory needs to justify this without saying "10,000 headaches > 1 leg" in a utilitarian sense.
      *   *The "Smuggled" Stuff:* Completeness (must always have an answer), Transitivity (A>B, B>C -> A>C), Usability (fast decisions), Impartiality.

  3.  **Drafting the Specification (The "What"):**
      *   I need to list requirements that a solution *must* meet to be considered "adequate" by the user's standards.
      *   *Req 1: The Individualist Constraint.* Complaints must be grounded in individual burdens. (Core Contractualism).
      *   *Req 2: The Decision Rule.* Must yield a binary verdict (Permissible/Impermissible) or a ranking for the institution. (Institutional Necessity).
      *   *Req 3: Non-Arbitrary Thresholds.* If numbers matter, there must be a principled reason why *n* people trump *m* people, not just "because I say so." (Principled Story).
      *   *Req 4: Complaint Granularity.* Must define what counts as a "complaint." (Addresses Shrapnel/Dilution).
      *   *Req 5: Ex Ante/Ex Post Consistency.* Must handle risk and actual outcomes coherently. (Addresses Role-Rotation).

  4.  **Analyzing the Cases (The "How"):**
      *   *Plain Case:* Limb vs. Trivial. Contractualism usually says Limb wins. Aggregation needs to explain when Trivial *starts* to win.
      *   *Dilution:* If I spread the benefit over infinite people, does it still trump the limb? Intuition says no. The theory needs a "significance threshold."
      *   *Shrapnel:* Can I break the limb loss into 1 million tiny pains? If yes, aggregation returns. If no, why? (Integrity of the person/complaint).
      *   *Same-Person:* Prudence vs. Morality. Contractualism is interpersonal. Intrapersonal is usually rational choice. This highlights the distinctiveness of the moral claim.
      *   *Reverse:* One big gain vs. many small losses. (Liberty vs. Security).
      *   *Conditional Existence:* Non-identity problem. Contractualism struggles here because the "losers" don't exist to reject.
      *   *Role Rotation:* Veil of ignorance vibes. Ex ante expectations matter.

  5.  **Identifying the Tensions (The "Catch"):**
      *   *The Trilemma:* (1) Strict Individualism (no summing), (2) Institutional Decidability (must resolve conflicts), (3) Intuitive Aggregation (sometimes numbers *do* matter).
      *   *Smuggled Premise:* "Completeness." Contractualism allows for "neither is rejectable" (ties/indeterminacy). Institutions hate ties. Demanding a decisive answer smuggles in consequentialist efficiency.
      *   *Smuggled Premise:* "Cardinality of Complaints." To compare a limb to a headache, you need a common metric. Contractualism prefers ordinal ranking of principles.

  6.  **Evaluating the Strategies (The Scorecard):**
      *   *(a) Straight Aggregation:* Violates core contractualism.
      *   *(b) Individualist Restriction (Scanlon's view):* Safe on theory, fails on institutional decisiveness in hard cases.
      *   *(c) Threshold/Tie-Breaker:* Best bet. Aggregation only breaks ties between principles that are otherwise non-rejectable.
      *   *(d) Ex Ante:* Good for risk, bad for actual victims (ex post complaints remain).
      *   *(e) Hybrid/Weighted Complaints:* Trying to weight complaints by severity + numbers. Risky.

  7.  **Refining the Output:**
      *   *Tone:* Analytical, direct, slightly philosophical but focused on the "spec."
      *   *Structure:*
          1.  The Core Specification (Requirements).
          2.  Case Handling (How the spec applies).
          3.  The Incompatibility Matrix (What breaks).
          4.  Strategy Scorecard.
      *   *Focus:* Ensure I distinguish between what Contractualism *is* and what an *Institution* needs. This is the key friction point the user identified.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Check:* Did I address "Shrapnel"? *Correction:* Need to emphasize the "unity of complaint" requirement.
      *   *Check:* Did I address "Conditional Existence"? *Correction:* Acknowledge this is a known black spot for contractualism; don't pretend there's an easy fix.
      *   *Check:* Is the distinction between "Non-negotiable" and "Smuggled" clear? *Correction:* Use explicit labels for each requirement.
      *   *Check:* User wants to know which requirement rules out candidates. *Correction:* Identify the "Decidability Requirement" as the main killer of pure contractualism.

  9.  **Final Polish:** Ensure the "Short Scorecard" is at the end as requested. Make sure the "Institutional Test" is woven throughout. (Proceed to generate response).

  *(Self-Correction during final review)*: Wait, the user asked for "The full spec. For each requirement, the case or consideration behind it, and whether it is genuinely non-negotiable for the view or just something one camp wants." I need to make sure this is very structured. I also need to make sure I don't just summarize Scanlon but define what a *solution* looks like.

  Okay, let's build the "Adequacy Spec."

  *   **Req 1: The Complaint Grounding.** (Non-negotiable).
  *   **Req 2: The Comparability Constraint.** (Non-negotiable but tricky).
  *   **Req 3: The Decidability Clause.** (Smuggled/Institutional).
  *   **Req 4: The Non-Fragmentation Rule.** (Addresses Shrapnel).
  *   **Req 5: The Significance Threshold.** (Addresses Dilution).

  *   **Tension:** Req 3 vs Req 1 & 5.
  *   **Biggest Prejudice:** Completeness/Decidability.

