answer: |-
  Here is the specification for an adequate contractualist solution to aggregation, designed to meet your institutional constraint while remaining faithful to the core logic of reasonable rejectability.

  ### Part 1: The Adequacy Specification

  To count as a solution, a principle must satisfy the following five requirements. I have flagged which are core to contractualism and which are smuggled in from institutional or consequentialist demands.

  #### 1. The Complaint Grounding Requirement
  *   **Spec:** Every objection to a principle must be grounded in a burden borne by a specific, identifiable individual (or a specific set of individuals sharing an identical burden). You cannot cite "the loss of total value" or "the inefficiency of the system" as a reason for rejection.
  *   **Case/Consideration:** The core definition of contractualism. If an institution rejects a policy because "it lowers aggregate welfare," it has left contractualism.
  *   **Status:** **Non-Negotiable.** This is the definition of the view. Without this, you are just doing rule-consequentialism with extra steps.

  #### 2. The Non-Fragmentation (Unity) Requirement
  *   **Spec:** A single individual's burden must be treated as a unified complaint. It cannot be artificially subdivided into smaller complaints to be weighed against multiple smaller benefits elsewhere. Conversely, a single individual's benefit cannot be subdivided to count as multiple "wins."
  *   **Case/Consideration:** **The Shrapnel Case.** If I lose a leg, I have one complaint about losing a leg. I do not have 1,000 complaints about losing 1/1000th of a leg. If fragmentation were allowed, I could be outvoted by 1,000 people getting a pinprick, which violates the intuition that severe burdens have priority.
  *   **Status:** **Non-Negotiable.** This protects the "separateness of persons." If you allow fragmentation, aggregation sneaks in through the back door by turning one person into a container of utility units.

  #### 3. The Significance Threshold Requirement
  *   **Spec:** There must be a principled account of why some burdens are too trivial to ground a reasonable rejection, even if they are widespread. A principle is not rejectable merely because it imposes *some* cost; the cost must cross a threshold of significance relative to the alternative.
  *   **Case/Consideration:** **Dilution.** If 1 billion people avoid a barely perceptible dust mote settling on their shoe, that should not trump one person losing a limb. The theory must explain where the "moral silence" begins.
  *   **Status:** **Non-Negotiable (with caveats).** Contractualism requires complaints to be *reasonable*. Trivialities are not reasonable grounds for veto. However, defining the threshold precisely is the hardest part of the spec.

  #### 4. The Decidability (Completeness) Requirement
  *   **Spec:** For any pair of principles available to the institution, the framework must yield a determinate verdict: Principle A is permissible, Principle B is permissible, or A is required over B. It cannot return "indeterminate" or "both are rejectable" as a final output for the committee.
  *   **Case/Consideration:** **Institutional Usability.** A triage committee cannot say "we don't know." They must act.
  *   **Status:** **SMUGGLED.** This is the most dangerous requirement. Pure contractualism allows for indeterminacy (where neither principle can be reasonably rejected, or both can). Demanding a binary output forces the theory to adopt a tie-breaking mechanism that often looks suspiciously like aggregation.

  #### 5. The Ex Ante/Ex Post Consistency Requirement
  *   **Spec:** The framework must specify whether complaints are based on *expected* burden (before the risk is run) or *actual* burden (after the outcome). It cannot switch between them opportunistically to get the desired result.
  *   **Case/Consideration:** **Role-Rotation / Risk.** If everyone faces a 1/1,000,000 risk of death to save everyone from a headache, is that rejectable? If we look ex post, the dead person has a massive complaint. If we look ex ante, everyone had a tiny expected burden.
  *   **Status:** **Contested.** Scanlon leans ex post (actual burden matters most). Institutions often need ex ante (fairness of risk distribution). A solution must pick one and stick to it.

  ---

  ### Part 2: Case Handling & Stress Tests

  Here is how the spec applies to your specific cases. If a candidate solution fails these, it fails the spec.

  | Case | The Test | Adequate Contractualist Answer |
  | :--- | :--- | :--- |
  | **Plain Case** (1 Limb vs. 10k Trivial) | Does the theory permit saving the limb? | **Yes.** The complaint of losing a limb is significantly stronger than the trivial complaints of the 10k. The 10k cannot reasonably reject a principle that prioritizes the limb. |
  | **Dilution** (1 Limb vs. 1M Micro-benefits) | Does adding more people eventually trump the limb? | **No.** If the individual benefit is below the **Significance Threshold**, the *number* of people is irrelevant. You cannot sum zeros (or near-zeros) to make a non-zero. |
  | **Shrapnel** (1 Limb vs. 1M Pinpricks on *One* Person) | Can the victim's loss be fragmented to match the granularity of the winners? | **No.** Violates **Non-Fragmentation**. The victim has one severe complaint. The winners have 1M tiny complaints. The severe complaint wins. |
  | **Same-Person** (Prudence) | Is this treated like the Many-Person case? | **Distinct.** Contractualism is interpersonal. Intrapersonal trade-offs are rational prudence, not moral rejectability. A solution must explain why numbers matter *between* people but not *within* a life (or admit they do). |
  | **Reverse** (1 Big Gain vs. 10k Small Losses) | Can one person demand a huge benefit at small cost to many? | **Generally No.** This tests the symmetry of the view. If the small losses are below the significance threshold, the one person can claim the gain. If the small losses are aggregate-significant (e.g., taxation), the principle must justify the imposition. |
  | **Role-Rotation** (Risk) | Does mutual risk change the verdict? | **Yes, via Ex Ante.** If everyone faces the same risk for mutual benefit, the complaint is weaker than if a specific minority is sacrificed. This relies on **Ex Ante Consistency**. |
  | **Conditional Existence** (Non-Identity) | Can future people reject a principle that creates them? | **Fail State.** Contractualism struggles here. If they wouldn't exist otherwise, they have no grounds to reject the principle that created them (unless their life is not worth living). A solution must admit this limitation or adopt a "representative" proxy. |

  ---

  ### Part 3: The Incompatibility Matrix (The "Catch")

  You asked to flag requirements that cannot be jointly satisfied. Here is the central tension.

  **The Trilemma:**
  1.  **Strict Individualism** (No summing of complaints; compare strongest vs. strongest).
  2.  **Intuitive Aggregation** (Sometimes 10,000 headaches *should* trump 1 limb, or at least 10,000 broken arms should).
  3.  **Decidability** (The institution must always have a clear answer).

  **The Conflict:**
  *   If you hold **Strict Individualism** and **Decidability**, you often get counter-intuitive results (the "Plain Case" where 1 limb always beats 10,000 headaches, no matter how many headaches). This makes the theory useless for public policy.
  *   If you hold **Intuitive Aggregation** and **Decidability**, you violate **Strict Individualism**. You are summing welfare, which breaks contractualism.
  *   If you hold **Strict Individualism** and **Intuitive Aggregation**, you lose **Decidability**. You end up with indeterminacy in the middle range (e.g., 1 limb vs. 500 broken arms). The theory says "neither principle is uniquely reasonable," but the hospital *must* choose.

  **The Smuggled Prejudice:**
  The **Decidability Requirement** is the primary smuggled premise. It comes from a consequentialist habit of thinking that morality must always produce a single "best" action. Contractualism is naturally a logic of *veto*, not *optimization*. It is designed to rule out the impermissible, not to identify the perfect. Demanding it identify the perfect forces it to become consequentialist in the hard cases.

  **The Requirement That Does The Most Work:**
  **The Significance Threshold.** This is the only lever available to stop the "Dilution" problem without summing. If you can define a threshold below which complaints don't count for *veto power*, you solve the triviality problem. But if you set it too high, you become rigid (1 limb always wins). If you set it too low, aggregation creeps back in.

  ---

  ### Part 4: Strategy Scorecard

  Here is how the current candidate strategies measure up against the Spec.

  | Strategy | Description | Meets Spec? | Fatal Flaw |
  | :--- | :--- | :--- | :--- |
  | **(a) Straight Aggregation** | Sum the complaints; greatest total burden wins. | **NO.** | Violates **Complaint Grounding** and **Non-Fragmentation**. It is utilitarianism in contractualist clothing. Fails the core definition. |
  | **(b) Individualist Restriction** (Scanlon's standard view) | Compare the strongest complaint in A vs. strongest in B. Ignore numbers. | **PARTIAL.** | Fails **Decidability** and **Intuitive Aggregation**. In the "Plain Case" (Limb vs. Headaches), it says save the limb. In "Limb vs. 1M Broken Arms," it still says save the limb. Institutions cannot use this. |
  | **(c) Threshold / Tie-Breaker** | Aggregation is only used to break ties between principles that are otherwise non-rejectable. | **BEST FIT.** | Satisfies **Individualism** (strong complaints veto first) and allows **Decidability** (numbers break ties among weak complaints). *Risk:* Defining the "tie" zone is arbitrary. |
  | **(d) Ex Ante / Randomizing** | Aggregate *expected* complaints rather than actual ones. | **MIXED.** | Solves **Role-Rotation** well. Fails **Ex Post** intuition (the actual victim still has a massive complaint). If the actual victim can reject, ex ante calculations don't silence them. |
  | **(e) Weighted Complaints** | Complaints have a base weight (severity) + a multiplier (numbers). | **NO.** | Violates **Non-Fragmentation**. It explicitly sums. It is a hybrid view that abandons pure contractualism for pragmatic reasons. |

  ### Final Recommendation for Your Paper

  If you are writing this for an institutional audience, you must argue for **(c) Threshold / Tie-Breaker**, but you must explicitly acknowledge the cost.

  **The Argument:**
  1.  **Stage 1 (Veto):** Any principle that imposes a *significant* burden on an individual is rejectable unless there is no alternative that avoids it. (Protects the One).
  2.  **Stage 2 (Tie-Break):** If multiple principles remain (i.e., the burdens on the losers are all below the significance threshold, or the burdens are comparable), *then* we count numbers to minimize total complaints. (Satisfies the Institution).

  **The Honest Admission:**
  You must state that Stage 2 is a concession to **Decidability**, not a derivation from **Individualism**. It acknowledges that when no one has a veto-worthy complaint, fairness requires we look at the aggregate. This keeps the view contractualist in the hard cases (protecting the vulnerable) but functional in the easy cases (policy making).

  **The "Shrapnel" Defense:**
  To prevent Stage 2 from swallowing Stage 1, enforce the **Non-Fragmentation Rule** strictly. You cannot break the Stage 1 victim's burden into Stage 2 units. The limb loss stays a "Veto" burden; the headaches stay "Tie-Break" burdens. They never meet on the same scale.

  This is the only shape that survives your spec without collapsing into utilitarianism or paralysis.
