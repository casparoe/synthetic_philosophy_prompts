answer: |-
  1. Quick Recap
  Maya and Luis are fighting over whether to replace an old auto shop with a new apartment building or a community garden. Maya argues the current neighbors deserve priority and that new development will just raise rents and push people out. Luis argues that blocking housing hurts workers who need homes and that the citywide shortage matters more than one block's comfort. Their debate boils down to whether the right to the city belongs to current residents or everyone who needs a place to live.

  2. Move-by-Move
  Maya is partially right in her first move. She correctly spots that new fancy buildings can raise nearby rents and that a one-time payment doesn't fix long-term displacement, but she is mostly mistaken to call the dividend a simple bribe since construction really does disrupt daily life. Her garden idea is nice for community spirit but doesn't solve the actual housing shortage.

  Luis is mostly right on his first point. He makes a strong case that keeping housing low helps insiders at the expense of workers who commute far, and housing 100 people is objectively more useful than a garden for 20 hobbyists. His point about market-rate units eventually helping everyone is debated, but the logic holds up in a growing city.

  Maya is mostly right here. She hits a real weak spot in the plan by noting that affordable lotteries often skip existing low-income renters who don't fit specific income bands, and filtering takes too long to help people facing rent hikes now. She is correct that the immediate neighbors take the hit for noise and shadows while strangers get the keys.

  Luis is mostly right overall. His argument that one block shouldn't veto housing for a whole city is ethically strong, especially during a shortage, and he is right that construction pain is temporary. However, he glosses over whether $2000 is actually enough to make that pain worth it for the people living through it.

  3. What They Are Both Missing
  Both neighbors are stuck fighting over yes or no instead of asking how to make the project work for everyone. They ignore the chance to negotiate for permanent community benefits like free ground-floor space for locals or stronger rent controls for the existing block. Neither talks about how the new affordable units could be reserved specifically for people currently living on the street instead of a citywide lottery. They treat the $2000 as either a bribe or a fix, missing that it's too small to be either and should be part of a bigger package. Finally, they assume current residents and future workers are enemies, when better design could help both groups coexist without pushing anyone out. They also overlook that the building design itself could minimize shadows and parking loss if the city demanded better plans instead of just arguing about the concept.

  4. Bottom Line
  Luis is more right overall because housing shortages cause more harm than construction noise, and blocking homes hurts the wider city more than building them helps one block. However, Maya wins on the details because this specific deal leaves current neighbors vulnerable without enough real protection. The best path forward is to build the housing but rewrite the rules to protect the people already living there.
