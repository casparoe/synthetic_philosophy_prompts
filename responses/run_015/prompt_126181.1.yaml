answer: |-
  This is the right move. Your tutor's "insoluble in principle" claim is logically defensible (it's a version of the Münchhausen trilemma applied to politics), but politically useless. If you are drafting a constitutional clause for an electoral commission, you need a decision procedure, not a metaphysical proof.

  Here is the specification for a theory of the *demos* boundaries designed for high-stakes constitutional application, followed by the impossibility result you asked for.

  ### Part 1: The Desiderata List (The Spec)

  I have categorized these by **Non-Negotiable (NN)** for your specific purpose (a working constitutional rule) versus **Contested/Preference (P)** (theoretical commitments that specific camps fight over). I have also flagged my confidence in each.

  **1. Non-Circularity of Justification (NN)**
  *   **The Requirement:** The rule for determining membership cannot presuppose the existence of the membership it is defining. You cannot say "citizens vote" if the definition of "citizen" is "those who can vote."
  *   **Case Consideration:** Prevents the "We decide who decides" closure.
  *   **Confidence:** **High.** This is the tutor's point. If you violate this, the rule is tautological.
  *   **Baggage Check:** Assumes legitimacy requires external justification. A strict "decisionist" might argue the act of drawing the line *creates* the legitimacy, rendering this requirement unnecessary. I would drop this only if you accept that might makes right at the founding moment.

  **2. Administrative Feasibility (NN)**
  *   **The Requirement:** An electoral commission must be able to apply the rule to specific individuals by a statutory deadline using available data.
  *   **Case Consideration:** **Future generations** fail this immediately. **Cross-border commuters** might fail this if "affectedness" requires complex economic modeling for every voter.
  *   **Confidence:** **High.** You specified this is for a constitution. A rule that requires a PhD in econometrics to verify voter eligibility is not a constitutional rule; it's a policy paper.
  *   **Baggage Check:** Smuggles in a statist assumption that the *state* administers the vote. If you envision a decentralized or digital democracy, this might be less rigid.

  **3. Non-Manipulability / Who-Counts-the-Counters (NN)**
  *   **The Requirement:** The criterion for inclusion cannot be unilaterally adjustable by the current insiders to secure a desired outcome.
  *   **Case Consideration:** **Non-resident citizens.** If the ruling party can grant citizenship to diaspora voters easily but deny it to **undocumented residents**, they are rigging the *demos*.
  *   **Confidence:** **High.** This is your second invented requirement. It is essential to prevent gerrymandering the electorate itself.
  *   **Baggage Check:** Assumes there is a distinction between "the people" and "the government." In a total direct democracy, the people *are* the government, so this distinction blurs.

  **4. The Self-Induced Affectedness Filter (NN)**
  *   **The Requirement:** A state cannot claim authority over a group solely because the state has already coerced or affected them without prior authorization.
  *   **Case Consideration:** **People abroad affected by emissions/sanctions.** If the state pollutes their air, they are affected. But if that affectedness grants them a vote, the state is rewarded for polluting (by expanding its *demos* and thus its mandate). Conversely, **occupation/annexation:** An occupier cannot say "you are now subject to our laws, therefore you must vote in our elections to legitimize our rule."
  *   **Confidence:** **Medium-High.** This is morally robust but hard to codify. How do you prove "self-induced"?
  *   **Baggage Check:** Assumes a baseline of legitimate borders. If you think borders are inherently violent, this filter is meaningless.

  **5. Determinacy / Uniqueness (P)**
  *   **The Requirement:** For every person, the rule yields a binary Yes/No on eligibility. No grey zones.
  *   **Case Consideration:** **Children.** Are they in or out? If "in," do they vote or have guardians? If "out," at what exact second do they become "in"?
  *   **Confidence:** **Low (Your suspicion is correct).** This is a legal preference, not a moral necessity. A theory could legitimately say "eligibility is a spectrum" or "probabilistic." However, for your *constitutional spec*, you likely need this for practical counting, even if it's theoretically false.
  *   **Baggage Check:** Smuggles in a preference for legal clarity over moral nuance.

  **6. Issue-Neutrality / Temporal Stability (P)**
  *   **The Requirement:** The *demos* boundary should not shift radically between different decisions (e.g., the voters for a nuclear waste referendum should be roughly the same as for a tax referendum).
  *   **Case Consideration:** **All-Affected Interests.** If the *demos* changes based on who is affected by the specific issue, the "people" never exist long enough to ratify a constitution.
  *   **Confidence:** **Medium.** Essential for a stable polity, but arguably sacrifices moral accuracy.
  *   **Baggage Check:** Prioritizes the stability of the *state* over the accuracy of the *representation*.

  **7. Capacity for Agency (P)**
  *   **The Requirement:** Members must have the cognitive and practical capacity to form and express a political will.
  *   **Case Consideration:** **Children, severe cognitive disabilities, prisoners.**
  *   **Confidence:** **Medium.** This is the most dangerous criterion. It is easily abused to exclude marginalized groups (historically: women, the poor).
  *   **Baggage Check:** Heavily laden with ableist and rationalist assumptions. I would defend dropping this in favor of "guardianship" models rather than exclusion.

  ---

  ### Part 2: Testing Your Two Invented Requirements

  **1. The Self-Induced Affectedness Filter**
  *   **Verdict:** **Robust, but operationally difficult.**
  *   **Why it works:** It blocks imperialist expansions of the *demos*. It prevents a state from saying, "We sanctioned your country, now you are affected by our foreign policy, so you should vote in our elections to legitimize the sanctions."
  *   **The Trap:** It requires a counterfactual baseline. To know if affectedness is "self-induced," you need to know what the world would look like if the state *hadn't* acted. In the case of **emissions**, the causal chain is global. Does the state get to count the foreigners? No, per your filter. But does that mean the foreigners have no recourse? The filter protects the *integrity of the existing demos* but doesn't solve the *injustice to the outsiders*. It's a defensive shield, not a justice mechanism.
  *   **Confidence:** I would defend this under pressure as a necessary condition for *non-imperial* democracy, but I would admit it doesn't solve the problem of global externalities.

  **2. The Who-Counts-the-Counters Requirement**
  *   **Verdict:** **The strongest constraint in the list.**
  *   **Why it works:** It exposes the circularity of citizenship laws. If the *demos* decides the citizenship rules, and the citizenship rules decide the *demos*, the insiders have a veto on the outsiders.
  *   **The Trap:** To satisfy this, you need an *external* standard for membership (e.g., residence, birth, or moral affectedness) that the state cannot easily tweak. But if the standard is external, who enforces it? If an electoral commission enforces it, who appointed the commission?
  *   **Confidence:** **Very High.** This is the lever that breaks the "Self-Constitution" model.

  ---

  ### Part 3: The Impossibility Result (The Incompatibility Theorem)

  You asked for the subset of desiderata that cannot be jointly satisfied. This is not a failure of imagination; it is a structural feature of the problem.

  **The Trilemma:** You cannot simultaneously satisfy **Non-Circularity**, **Moral Inclusivity (All-Affected/Subjected)**, and **Administrative Feasibility/Stability**.

  1.  **If you prioritize Non-Circularity + Moral Inclusivity:** You get the **All-Affected Principle**.
      *   *Failure:* Violates **Administrative Feasibility/Stability**. The *demos* changes with every issue (nuclear waste vs. park zoning). You cannot write this into a constitution for a binding referendum because the electorate is fluid. The electoral commission cannot count the voters by the deadline.
  2.  **If you prioritize Moral Inclusivity + Administrative Feasibility:** You get a **Residency or Stakeholder Model**.
      *   *Failure:* Violates **Non-Circularity**. Why is residency the magic line? Because the state says so. The state defines residency to define the *demos*. This violates the **Who-Counts-the-Counters** requirement.
  3.  **If you prioritize Non-Circularity + Administrative Feasibility:** You get **Self-Constitution (The People Decide)**.
      *   *Failure:* Violates **Moral Inclusivity**. The existing *demos* excludes those who are coerced by it (e.g., **undocumented residents**, **foreigners affected by emissions**). It legitimizes exclusion by fiat.

  **The Specific Trap You Guessed:**
  You guessed the trap is between *"the demos has to be able to authorise itself"* and *"no body gets to certify its own constituency."*
  *   **Correction/Refinement:** That is the *political* version of the trap. The *logical* version is between **Issue-Sensitivity** (Moral Inclusivity) and **Institutional Stability** (Feasibility).
  *   **Argument:** If the *demos* is the source of legitimacy (authorizes itself), it must be stable enough to act over time. If the *demos* is determined by moral stakes (no self-certification), it must be fluid enough to track those stakes. A body cannot be both fixed (to govern) and fluid (to be just) simultaneously.
  *   **Confidence:** **High.** This is the core insight of the boundary problem literature. Any theory that claims to solve this is usually hiding one of the costs.

  ---

  ### Part 4: The Killer Requirement

  **The single requirement that does the most work in knocking out otherwise popular answers is: Non-Manipulability (Who-Counts-the-Counters).**

  *   **Why:** It devastates the **Citizenship/Statist Model**.
      *   Standard Answer: "Citizens vote."
      *   Objection: The state defines who is a citizen. If the state can naturalize allies and denaturalize enemies, the *demos* is a tool of the regime, not the source of its legitimacy. This requirement forces you to find a criterion for membership that the state *cannot* easily change (like bare residence or physical presence).
  *   **Secondary Kill:** It also wounds the **Self-Constitution Model**.
      *   Standard Answer: "The people constitute themselves."
      *   Objection: *Which* people? The ones currently inside. They are certifying their own constituency. This violates the requirement that no body certifies its own constituency.
  *   **Survivor:** It leaves the **All-Subjected Coercion Principle** as the strongest contender, *but* only if "subjection" is defined physically (presence) rather than legally (citizenship).

  ---

  ### Part 5: Scorecard Against Standard Answers

  | Theory | Non-Circularity | Feasibility/Stability | Moral Inclusivity | Non-Manipulability | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **All-Affected Interests** | **Pass** (External standard) | **Fail** (Fluid electorate) | **Pass** (High) | **Pass** (Hard to rig) | **Theoretically pure, administratively impossible.** Good for moral critique, bad for constitutional text. |
  | **All-Subjected (Coercion)** | **Pass** (External standard) | **Pass** (If based on residence) | **Mixed** (Misses externalities) | **Pass** (If residence is hard to rig) | **Best functional candidate.** Fails on **Future Gens** and **Emissions** (they aren't coerced by the state's laws). |
  | **Self-Constitution (Citizenship)** | **Fail** (Circular) | **Pass** (Very stable) | **Fail** (Excludes residents/affected) | **Fail** (State picks citizens) | **Legally easy, morally bankrupt.** Only works if you assume the state already exists legitimately. |

  ---

  ### Part 6: Confidence and Baggage Check

  **Where I am most confident:**
  *   **The Trilemma:** I am 90% confident that you cannot have Stability, Inclusivity, and Non-Circularity simultaneously. This is a structural constraint, not a lack of cleverness.
  *   **Non-Manipulability:** I am 85% confident this is the critical filter. If a theory allows the incumbent government to define the electorate, it is not a democratic theory; it is a theory of administration.

  **Where I am least confident (and where you should push back):**
  *   **Administrative Feasibility as NN:** I flagged this as NN because you asked for a constitutional spec. However, in *philosophical theory*, this is a weak constraint. If the moral truth requires a fluid *demos*, maybe the constitution is the problem, not the theory. **Argument to drop this:** If we accept "liquid democracy" or digital voting, feasibility constraints dissolve.
  *   **The Self-Induced Affectedness Filter:** I am 70% confident here. The counter-argument is that *all* affectedness in a globalized world is entangled. Distinguishing "self-induced" from "natural" affectedness might be impossible (e.g., is climate change "self-induced" by the state or by industrial civilization?). **Argument to drop this:** If you can't cleanly separate the causality, the filter creates arbitrary lines.
  *   **Smuggled Legitimacy Theory:** My entire list assumes **Liberal Democratic Legitimacy** (consent of the governed, protection of rights). If your seminar is discussing **Republican Freedom** (non-domination) or **Deliberative Democracy** (quality of discourse), the desiderata shift. For example, a Republican might prioritize "Non-Domination" over "Inclusivity," arguing that including everyone might create a *demos* that dominates a minority.

  **Final Advice for the Seminar:**
  Don't argue that the boundary problem is *soluble*. Argue that it is **manageable**. The tutor is right that there is no *perfect* philosophical foundation. But for a constitutional commission, you don't need perfection; you need a **reflective equilibrium**. You choose the criterion (likely Residence + Subjected) that minimizes the worst moral outrages (excluding long-term residents) while remaining administrable, acknowledging explicitly that this leaves some moral remainders (like foreign affectedness) to be solved by international law, not domestic franchise rules.

  The "insoluble" claim is a reason to be humble, not a reason to stop designing.
