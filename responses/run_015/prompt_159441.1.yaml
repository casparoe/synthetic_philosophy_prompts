      *   **Pair:** $(HH, HD)$.
      *   **Difference:** Only Bob's action changes (Hang vs. Don't); Alice's action is fixed (Hang). This falls within Bob's personal sphere.
      *   **Preference:** Bob strictly prefers $HH$ ($6$) to $HD$ ($0$). *Note: Since Alice is already hanging, Bob's view is blocked regardless. He strictly prefers gaining laundry ($C$) to gaining nothing.*
      *   **Social Judgment:** By ML, Society ranks **$HH \succ HD$**.

  **Result:** Combining the three legs yields the cycle: **$HD \succ DD \succ HH \succ HD$**. The social ordering is intransitive.

  ***

  ### Diagnosis

  The single feature doing the work is **interdependent utility** (material externalities). The cycle relies on the fact that Alice's exercise of her right ($HD \succ DD$) imposes a cost on Bob, and Bob's exercise of his right ($HH \succ HD$) is conditioned on Alice's prior action.

  **If you delete every preference that ranges across another person's sphere:**
  The conflict **does not survive**. If preferences were purely self-regarding regarding one's *own* action (i.e., my utility depends *only* on whether I hang laundry, not on whether you do), then Bob would be indifferent between $HH$ and $HD$ (since in both cases he hangs or doesn't hang, and your action doesn't affect him). Without strict preferences over the cross-sphere pairs, the decisiveness conditions cannot generate a strict social ranking on those legs, and the cycle collapses. The paradox requires that private acts have public consequences.

  ***

  ### Strongest Attack & Escape Routes

  A defender of Paretian Liberalism might argue:

  1.  **Restrict the Domain of Preferences:** Argue that preferences over others' sphere (even material ones) should not count for social choice.
      *   *Cost:* This blinds the social planner to genuine welfare impacts (externalities). If my factory smoke hurts you, your preference for clean air shouldn't be "excluded" from the calculus.
  2.  **Redefine the Sphere:** Argue that balcony use affecting a neighbor's light is not a "personal" sphere.
      *   *Cost:* This shrinks the domain of rights until Minimal Liberalism is vacuous. Almost any private act has some material externality (noise, smell, visual).
  3.  **Coasean Bargaining:** Argue that in reality, Alice and Bob would contract (e.g., Alice pays Bob for the view).
      *   *Cost:* This addresses the *outcome* but not the *rights conflict*. The paradox shows that rights and Pareto efficiency are logically incompatible *before* bargaining. Furthermore, transaction costs often prevent such agreements.
  4.  **Acyclicity:** Give up transitivity for a weaker condition (no strict cycles).
      *   *Cost:* This makes social choice indecisive. If $HD \succ DD \succ HH \succ HD$, there is no "best" alternative to choose.

  **Least Damaging:** The most robust defense is **Domain Restriction** (excluding "meddlesome" preferences), but as this case shows, drawing the line between "meddlesome" and "material" is arbitrary. Light obstruction is material, yet functions identically to moral prurience in the logic of the theorem. The cost is admitting that Liberalism and Pareto cannot be absolute; one must yield in cases of interdependence.

  ***

  ### Conclusion for Students

  This case shows the liberal paradox is not merely an artefact of moralistic busybodying, but a structural conflict between **individual authority** and **collective welfare** in any environment with **externalities**. You should tell your students that rights and efficiency are logically incompatible when private choices have public consequences; resolving it requires either limiting the scope of rights, ignoring certain welfare impacts, or accepting social indecision.
