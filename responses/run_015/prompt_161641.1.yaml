          9.  Nihilistic Conclusion: No rational procedure under moral uncertainty.
      *   **User's Constraints:** Cannot accept (9). Wants to keep (1) [MEC] and (5) [IIA/Menu Independence] if possible. Willing to sacrifice (3) [Range Normalization] or (6) [Arbitrariness Claim].
      *   **Task:** Identify the broken step, explain why it looks fine, explain the cost of rejecting it, and evaluate the proposed fixes (Borda Count/Ordinal, Imprecise Probabilities).

  2.  **Deconstruct the Argument & Identify the Weak Links:**
      *   *Step (1) MEC:* Standard view (MacAskill). User wants to keep this.
      *   *Step (2) Inter-theoretic Comparison:* This is the core philosophical problem. The user assumes theories *don't* measure the same thing. This is the "Problem of Intertheoretic Comparisons."
      *   *Step (3) Range Normalization (Variance/Min-Max):* This is the specific mechanism causing the IIA violation. This is the most obvious technical culprit.
      *   *Step (5) IIA Intuition:* "Whether I should do (a) rather than (b) can't depend on... an option I'm not going to take." This is strong, but in decision theory, IIA violations are common (e.g., regret theory, context-dependent preferences). However, in *moral* uncertainty, most philosophers want IIA to hold.
      *   *Step (6) Arbitrariness:* The claim that *any* conversion rule is arbitrary because units are undefined. This assumes there is *no* fact of the matter about intertheoretic comparisons.

  3.  **Evaluate the "Broken Step":**
      *   **Candidate 1: Reject (3) - Range Normalization.**
          *   *Why:* It causes the IIA violation (Step 4).
          *   *Alternative:* Variance Normalization (MacAskill's preferred view in *Uncertain Ethics*). Instead of 0-1 based on the *menu*, use the statistical variance of the theory's choiceworthiness distribution over the *space of possible actions*.
          *   *Cost:* Requires defining the "space of possible actions." Still has some arbitrariness, but avoids menu-dependence.
          *   *Fit:* User wants to keep (1) and (5). Rejecting (3) saves (5).
      *   **Candidate 2: Reject (2) - The Claim that Comparisons are Impossible/Arbitrary.**
          *   *Why:* Maybe there *are* objective intertheoretic comparisons. (Hedonic utilitarianism vs. Prioritarianism might share a common currency of "well-being").
          *   *Cost:* Metaphysically heavy. Requires moral realism about *degrees* of value across theories.
          *   *Fit:* Saves MEC, but requires a strong meta-ethical commitment the user might not have.
      *   **Candidate 3: Reject (5) - The IIA Intuition.**
          *   *Why:* Maybe moral choice *is* context-dependent. (Less popular, but defensible).
