          2.  Inter-theoretic comparison problem (different scales/units).
          3.  Proposed solution: Variance/Range normalization (0 to 1 based on best/worst *on the menu*).
          4.  Problem: Menu dependence (Independence of Irrelevant Alternatives violation). Adding/removing (d) flips the ranking of (a) vs (b).
          5.  Intuition: This is absurd (IIA should hold).
          6.  Conclusion: Normalization is arbitrary; any scaling factor is arbitrary.
          7.  Skepticism: MEC yields no objective verdicts.
