prompt: |-
  In the replication literature I keep meeting a pair of reactions that I cannot tell are consistent. When a well-powered, pre-registered replication of a well-known effect comes back null, the field does not say the hypothesis has been refuted; it says the effect is smaller than published, or context-dependent. The original authors point to differences in population, measure, or procedure, or to unmeasured moderators, and reviews and textbooks go on treating the finding as standing. When the same effect is replicated in a different country with a different measure, nobody calls that context-dependence: it is reported as evidence of generality, and the finding is treated as established.

  Reconstruct the epistemology this pair of reactions presupposes. My suspicion is that the hypothesis actually in play is not that the manipulation raises the outcome, but a quantifier-hedged claim — that there is some nonempty set of populations, measures, and settings in which it does, with the boundaries left unspecified — so that no pattern of results across studies could refute it. Say whether that is right, what such a claim is worth if so, and what would have to be added to make it testable: moderators specified in advance, a stated mechanism, pre-registered predictions of where the effect should be absent.

  Then separate what the practice strictly requires from what it merely fits. Does an error-statistical or severity-based view license the asymmetry, does a Bayesian picture on which the true effect is itself a distribution across contexts license it more naturally, or is it best explained as a convention for assigning credit and blame to researchers? Notice too that on a strict significance-testing logic a null replication is absence of evidence rather than evidence of absence — so tell me whether the reluctance to say *refuted* is the same logic that ought also to stop the field from saying *established* when a replication succeeds.

  A reform has been floated where I work: before a registered replication is run, the original authors file, sealed, the conditions under which they would publicly withdraw the claim, and a failure meeting those conditions counts as a refutation. What does current practice deny that this reform assumes?

  Be explicit about which parts of your reconstruction are common ground among statisticians and philosophers of science who work on replication, which are live disputes, and where you are extrapolating.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Observation:** There's an asymmetry in how replication results are interpreted.
          *   Null replication of a famous effect $\rightarrow$ "Effect is smaller/context-dependent" (Hypothesis not refuted).
          *   Successful replication in a *different* context $\rightarrow$ "Evidence of generality" (Hypothesis established).
      *   **Task 1: Reconstruct the Epistemology.** What underlying logic makes these reactions consistent?
          *   User's suspicion: The hypothesis is actually an existential claim ($\exists$ context where effect holds) rather than a universal one ($\forall$ contexts).
          *   Evaluate this suspicion.
          *   Assess the worth of such a claim.
          *   Specify what's needed to make it testable (moderators, mechanisms, absence predictions).
      *   **Task 2: Separate Practice Requirements from Fit.**
          *   Does Error-Statistics/Severity license this?
          *   Does Bayesian hierarchical modeling license this?
          *   Is it sociological (credit/blame)?
          *   Analyze the "absence of evidence vs. evidence of absence" logic regarding null replications vs. successful replications.
      *   **Task 3: Analyze the Proposed Reform.**
          *   Sealed conditions for withdrawal.
          *   What does current practice deny that this reform assumes?
      *   **Task 4: Meta-Analysis of the Response.**
          *   Identify common ground among statisticians/philosophers.
          *   Identify live disputes.
          *   Identify extrapolations.

  2.  **Task 1: Epistemological Reconstruction:**

      *   *The User's Suspicion:* The hypothesis is $\exists x (Effect(x))$ rather than $\forall x (Effect(x))$.
      *   *Analysis:* This is largely correct. In psychology/social sciences, theories are often "tendency" claims. They posit a causal mechanism that *can* operate, not one that *must* operate in every instance.
      *   *Worth:* An existential claim is very weak. It's almost unfalsifiable unless the space of possible contexts is bounded. It risks becoming a "zombie theory" (never dies, just hides).
      *   *Making it Testable:* Needs boundary conditions. "Effect holds in $C_1, C_2$ but not $C_3$." Needs a theory of *why* (mechanism). Needs pre-registered predictions of *null* results (risky predictions).

  3.  **Task 2: Statistical/Philosophical Frameworks:**

      *   *Error-Statistics (Mayo):* Severity requires passing a severe test. A null replication *can* be evidence of absence if the test had high power to detect the claimed effect size. If the original claim was "large effect," a high-powered null *should* refute it. The asymmetry (accepting generality from one success, but denying refutation from one failure) is *not* licensed by strict severity unless the "claim" is vague.
      *   *Bayesian/Hierarchical:* This fits best. The "true effect" is a distribution $\theta \sim N(\mu, \tau)$. A new study samples from this distribution. A success updates $\mu$. A null updates $\tau$ (heterogeneity) or suggests the new context is an outlier. This naturally accommodates "context-dependence."
      *   *Sociological (Mertonian):* Credit/Blame. Protecting the "brand" of the original finding vs. expanding the brand via generalization.
      *   *Significance Testing Logic:*
          *   Null Replication: $p > .05$. Strictly, "fail to reject $H_0$." Not evidence $H_0$ is true. So, reluctance to say "refuted" is technically consistent with NHST.
          *   Successful Replication: $p < .05$. Reject $H_0$. But does this "establish" the effect? NHST doesn't prove $H_1$ is true, just that data is unlikely under $H_0$. However, the asymmetry is stark: We treat $p < .05$ as "established" but $p > .05$ as "inconclusive." This is the "file drawer" logic inverted. If we are cautious about nulls, we should be cautious about positives (replication crisis logic).

  4.  **Task 3: The Reform (Sealed Withdrawal Conditions):**

      *   *What it assumes:* That the original claim has *falsifiable* boundary conditions. That the authors *know* (or can commit to) what would disprove their theory.
      *   *What current practice denies:* Current practice assumes theories are open-ended (Lakatosian "protective belt"). It denies that a single study (even a registered replication) can definitively kill a theory. It prioritizes theory preservation over falsification.
      *   *Implication:* The reform forces the existential claim ($\exists$) to become a bounded universal claim ($\forall x \in Boundaries$).

  5.  **Task 4: Categorization (Common Ground, Disputes, Extrapolation):**

      *   *Common Ground:* NHST limitations (null $\neq$ evidence of absence), the problem of vague theories (unfalsifiability), the value of pre-registration.
      *   *Live Disputes:* Bayesian vs. Frequentist interpretation of replication, the role of sociological factors vs. epistemic norms, how much heterogeneity is "normal."
      *   *Extrapolation:* The specific impact of the "sealed envelope" reform (this is speculative/novel).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sharpness of the observation. It's a classic problem in philosophy of science (Duhem-Quine, Lakatos).
      *   *Section 1: The Existential Hypothesis.* Confirm the user's suspicion. It's a "possibilist" claim. Discuss the cost (low informational value). Discuss the fix (specifying moderators).
      *   *Section 2: Statistical Frameworks.*
          *   NHST: Explain why it creates the asymmetry (asymmetric burden of proof). But note the inconsistency in calling successes "established."
          *   Bayesian: Explain how random effects models make the asymmetry rational (estimating a distribution).
          *   Error-Statistical: Argue that Severity *criticizes* the current practice if the original claim was precise.
          *   Sociology: Acknowledge the "credit economy."
      *   *Section 3: The Reform.* Contrast "Falsificationism" (Reform) vs. "Research Programmes" (Current Practice). The reform assumes commitment; practice assumes flexibility.
      *   *Section 4: Meta-Commentary.* Clearly label the consensus vs. debate points.

      *(Self-Correction during drafting)*: Be careful not to say NHST *justifies* calling a success "established." It doesn't. It just allows rejecting the null. The prompt asks if the logic stopping us from saying "refuted" should also stop us from saying "established." The answer is yes, strictly speaking, but convention ignores this for positives. I need to highlight this hypocrisy.

      *(Refining the Bayesian point)*: A Bayesian doesn't necessarily see a null replication as "refutation" because they update the probability of the effect size being non-zero, considering heterogeneity. If the prior allows for heterogeneity, a null in one context just shifts the mean or increases variance. This *licenses* the asymmetry more than NHST does.

      *(Refining the Reform)*: The reform assumes the theory is mature enough to have known boundary conditions. Current practice assumes theories are nascent and need protection to be developed.

  7.  **Final Polish:** Check tone (analytical, philosophical, precise). Ensure all parts of the prompt are addressed. Ensure the "Common Ground/Dispute/Extrapolation" section is distinct.

      *Key Philosophical References to keep in mind:* Lakatos (Research Programmes), Popper (Falsification), Mayo (Severity), Gelman (Garden of Forking Paths/Multiverse), Open Science Collaboration.

  8.  **Final Review against constraints:**
      *   Reconstruct epistemology? Yes.
      *   Evaluate existential claim? Yes.
      *   Separate practice requirements from fit? Yes.
      *   Analyze reform? Yes.
      *   Explicitly mark common ground/disputes/extrapolation? Yes.

      *Let's write.*
answer: |-
  This is a precise diagnosis of a structural feature of contemporary social science, particularly psychology. The asymmetry you describe is not merely a bug; it is a feature of how the field manages theoretical risk. Below is a reconstruction of the epistemology, an evaluation of the statistical frameworks, an analysis of the proposed reform, and a mapping of the consensus versus dispute in the literature.

  ### 1. Epistemological Reconstruction: The Existential Hypothesis

  Your suspicion is correct. The working hypothesis in much of this literature is not a universal claim ($\forall$ contexts, $Manipulation \rightarrow Outcome$) but a **bounded existential claim** ($\exists$ a non-empty set of contexts where $Manipulation \rightarrow Outcome$).

  **The Logic:**
  *   **Original Publication:** Establishes existence ($\exists$). It proves the effect *can* happen.
  *   **Successful Cross-Context Replication:** Expands the known set of the existential quantifier. It is treated as "generality" because it shows the set is larger than previously thought.
  *   **Null Replication:** Is treated as a mapping of the *boundary* of that set. It does not prove the set is empty (refutation); it merely identifies a point outside the set (context-dependence).

  **The Worth of Such a Claim:**
  Epistemically, an unbounded existential claim is weak. If a theory predicts only that an effect *can* occur somewhere, it is compatible with almost any pattern of data (some successes, some failures). It risks becoming what philosophers call **degenerative**: it absorbs anomalies by positing unspecified moderators ("it works, just not here") without generating new, risky predictions. The informational value is low because it does not constrain the world; it merely asserts a possibility.

  **Making it Testable:**
  To move from a "zombie hypothesis" (unfalsifiable) to a scientific one, the field must shift from $\exists$ to a **conditional universal**: $\forall x \in \text{Specified Boundaries}, Effect(x)$. This requires:
  1.  **Specified Moderators:** Not just "context," but *which* contextual variables (e.g., "only in individualistic cultures," "only when cognitive load is low").
  2.  **Mechanism:** A causal story that entails *why* the boundary exists. If the mechanism relies on Variable M, the effect must vanish when M is absent.
  3.  **Risky Predictions of Absence:** Pre-registered predictions of where the effect should *not* occur. A theory that predicts both presence and absence in specific conditions is falsifiable; one that predicts only presence is not.

  ### 2. Statistical Frameworks: Requirement vs. Fit

  Does the data analysis logic *require* this asymmetry, or merely *accommodate* it?

  **A. Strict Significance Testing (NHST)**
  *   **Logic:** A null result ($p > .05$) is "failure to reject," not "evidence for null." A positive result ($p < .05$) is "reject null."
  *   **The Asymmetry:** Strictly, NHST licenses the reluctance to say "refuted" (you cannot accept the null). However, it **does not** license saying "established" upon a successful replication. NHST never confirms the alternative hypothesis; it only rejects the null.
  *   **Verdict:** The field is being inconsistent. If the logic of the null (absence of evidence $\neq$ evidence of absence) prevents refutation, that same logic should prevent "establishment" on a single successful replication. The practice fits NHST loosely but violates its symmetry.

  **B. Error-Statistics / Severity (Mayo)**
  *   **Logic:** A claim is warranted only if it has passed a severe test (a test that would likely have found an error if one existed).
  *   **The Asymmetry:** If the original claim was "Effect size $d = 0.5$," a well-powered replication finding $d = 0$ *is* a severe test that the claim is false. Severity theory would generally **not license** the asymmetry. It would demand that if the replication had high power to detect the claimed effect, the null is evidence of absence.
  *   **Verdict:** Current practice violates severity principles. It protects the hypothesis from severe testing by retreating to "context-dependence" after the fact.

  **C. Bayesian Hierarchical Modeling**
  *   **Logic:** The "true effect" is a distribution across contexts ($\theta_j \sim N(\mu, \tau)$).
  *   **The Asymmetry:** This framework **naturally licenses** the asymmetry. A successful replication updates the mean ($\mu$). A null replication updates the heterogeneity parameter ($\tau$) or suggests the new context is an outlier. It treats the effect as a random variable, not a fixed constant.
  *   **Verdict:** This is the most coherent statistical justification for current practice. It assumes the effect is inherently heterogeneous. However, it is rarely the *explicit* model used in interpretation; it is an implicit assumption.

  **D. Sociological Economy (Credit/Blame)**
  *   **Logic:** Science is a reputation market.
  *   **The Asymmetry:** Calling a finding "refuted" assigns blame to the original author (lowering capital). Calling it "context-dependent" assigns credit to the replicator (nuance) while preserving the original author's capital. Calling a cross-context success "established" builds capital for the whole sub-field.
  *   **Verdict:** This explains the *motivation* for the asymmetry, even if it doesn't justify it epistemically.

  ### 3. The Reform: Sealed Withdrawal Conditions

  **The Proposal:** Original authors pre-commit to conditions under which a replication failure counts as a refutation.

  **What Current Practice Denies vs. What the Reform Assumes:**
  *   **Current Practice (Lakatosian):** Assumes theories are "Research Programmes." Anomalies are handled by adjusting the "protective belt" (auxiliary hypotheses about context/measurements). It denies that a core theory can be killed by a single empirical result. It assumes theoretical maturity comes *after* accumulation of data.
  *   **The Reform (Popperian):** Assumes the theory is mature enough to have known **falsification conditions**. It assumes the authors *can* distinguish between a failed theory and a failed procedure *in advance*.
  *   **The Conflict:** The reform assumes **commitment**; current practice assumes **flexibility**. The reform forces the existential claim ($\exists$) to become a bounded universal ($\forall x \in \text{Sealed Conditions}$). If the field adopts this, it admits that "context-dependence" cannot be an *ex post* excuse, but must be an *ex ante* prediction.

  ### 4. Consensus, Disputes, and Extrapolation

  Here is the breakdown of the analysis above according to the state of the literature.

  **Common Ground (Consensus among Statisticians/Philosophers):**
  1.  **NHST Limitations:** It is consensus that $p > .05$ is not evidence of absence, and $p < .05$ is not proof of truth. The asymmetry in how these are treated rhetorically ("established" vs. "inconclusive") is widely recognized as logically inconsistent under strict NHST.
  2.  **Unfalsifiability Risk:** There is broad agreement that theories relying on unspecified moderators ("it depends on context") are difficult to falsify and hinder cumulative science (Meehl, 1978; Smaldino, 2019).
  3.  **Value of Pre-registration:** There is strong consensus that specifying analysis plans and predictions in advance reduces researcher degrees of freedom and makes tests more severe.

  **Live Disputes:**
  1.  **The Ontology of Effects:**
      *   *View A (Contextualist):* Effects are inherently heterogeneous (Bayesian random effects). Variation is the norm; exact replication is impossible. (Supports current practice).
      *   *View B (Universalist):* Basic psychological effects should be robust across minor procedural changes. High variation indicates measurement error or fraud. (Supports the Reform).
  2.  **The Role of Falsification:**
      *   *Dispute:* Should a single high-powered registered replication be considered definitive? Error-statisticians (Mayo) might say yes, if the test is severe. Lakatosians and many social scientists say no, because auxiliary assumptions (procedure, population) are always involved (the Duhem-Quine problem).
  3.  **Credit Assignment:**
      *   *Dispute:* Is the reluctance to refute a harmful protectionism that stalls science, or a necessary courtesy that encourages risk-taking in original theorizing?

  **Extrapolation (My Analysis):**
  1.  **The "Existential" Diagnosis:** While philosophers often discuss "ceteris paribus" laws, explicitly framing the field's working hypothesis as an *unbounded existential claim* ($\exists$) is my synthesis of your observation. It clarifies why the logic feels slippery.
  2.  **The Reform's Feasibility:** The claim that the reform forces a shift from "Research Programme" to "Popperian Falsification" is an extrapolation. In practice, authors might seal conditions so vague ("if the effect is in the opposite direction") that they preserve the protective belt. The success of the reform depends on the *specificity* of the sealed conditions, which current practice actively discourages.
  3.  **Bayesian Licensing:** While Bayesian models *can* license the asymmetry, most researchers using the "context-dependent" defense are not actually running hierarchical Bayesian models. They are using NHST logic with a Bayesian *interpretation* of truth (i.e., treating the effect as a property of the world that varies, rather than a parameter to be estimated). This hybrid incoherence is what drives the friction you observe.

  ### Summary
  The field operates on a **Lakatosian protective belt** disguised as **NHST**. It uses the technical limitations of NHST (null $\neq$ absence) to protect theories from refutation, while ignoring those same limitations (positive $\neq$ truth) to claim establishment. The proposed reform attempts to impose **Popperian risk** on a system designed to minimize it. For the reform to work, the field must agree that specifying boundary conditions is a requirement of theory, not an admission of weakness.
