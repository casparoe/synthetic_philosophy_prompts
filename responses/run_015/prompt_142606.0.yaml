answer: |-
  You are describing the distinction between **categorical identity** (is this an *a*?) and **systemic coherence** (does this *a* belong to *this* set?). The property you are looking for is not intrinsic to the shape, nor is it merely a matter of social convention. It is a relational property derived from a shared generative history.

  There is no single, universally standardized term in philosophy that captures this precisely without baggage, but in the cognitive science of design and the philosophy of art, the concept you are hunting is best defined as **Generative Consistency** within an **Idiolect**.

  The "hazy memory" you mention refers to the **Letter Spirit** project (part of the Fluid Analogies Research Group in the early 1990s). Their central finding was relevant to your plight: they discovered that style cannot be treated as a filter applied to a neutral grid. Instead, style is a set of **constraints on the construction** of the letter. A letter is "in style" not because it looks like its neighbors, but because it could have been produced by the same **procedural rules**.

  Here is the carving you requested.

  ### 1. The Concept: Generative Consistency
  You are correct to reject Family Resemblance. Family resemblance is retrospective and descriptive (looking at what exists and finding overlaps). What your calligraphy teacher is doing is prospective and prescriptive (inferring the rule that generated the set and testing the new shape against it).

  The property a shape has when it fits the page is **Generative Consistency**.
  *   **Categorical Identity:** Determined by recognition features (does it have a bowl and a stem? Is it legible as *a*?). This is binary.
  *   **Systemic Coherence:** Determined by procedural derivation (was this shape produced by the same motor constraints, tool angles, and rhythmic decisions as the neighbors?). This is the axis of "goodness" you identified.

  The "one thing" every letter on a well-made page shares is not a visual feature, but a **causal origin**. In philosophy of art, Nelson Goodman distinguishes between *autographic* arts (where the history of production matters, like painting) and *allographic* arts (where only the final structure matters, like music scores). Calligraphy is a hybrid: it is allographic in that it communicates letters, but autographic in that the *style* is tied to the specific hand that made it. Your teacher is treating the page as an autographic work. She is not asking, "Is this an *a*?" She is asking, "Is this *by the same hand*?"

  ### 2. Verdicts on the Hard Cases
  If we define the property as **Generative Consistency** (membership in a specific procedural idiolect), here is how the hard cases resolve:

  *   **The One-Letter Alphabet:**
      *   *Verdict:* A one-letter script cannot have a style.
      *   *Reasoning:* Style is a system of constraints revealed through *variation*. If there is only one letter, there is no evidence of how the hand handles different structural problems (curves vs. straights, ascenders vs. descenders). Style is the constant across variables; without variables, there is no constant to observe. This is not a *reductio*; it is a necessary consequence of style being relational.
  *   **The Perfect Forgery:**
      *   *Verdict:* It is a member of the style, but not a member of the work.
      *   *Reasoning:* This separates **Stylistic Identity** from **Historical Authenticity**. If the forgery replicates the generative rules perfectly, it possesses Generative Consistency. It *is* in the style. The fact that it was not made by the original designer is a historical fact, not a stylistic one. Your teacher would accept the forgery as "right" on the page, even if the market would reject it as "fake."
  *   **The Bitmap/Stencil (Constraint-Driven):**
      *   *Verdict:* Stylelessness is a style.
      *   *Reasoning:* The "hand" here is not a human wrist but the grid or the physical stencil. The generative rule is "conform to the matrix." A letter that obeys the grid perfectly is stylistically coherent. A letter that wobbles off the grid is "wrong." The absence of human choice is itself a generative constraint, and consistency to that constraint constitutes style.
  *   **The Weathered Inscription / Shadow:**
      *   *Verdict:* It has style only if agency is inferred.
      *   *Reasoning:* If the shape reads as an *a* but looks like erosion, it has categorical identity but no stylistic coherence, because there is no inferred "hand." If it looks like it was *carved* (even by wind), we infer a process. Style requires the perception of a **generative agent**, whether human or natural. If the viewer perceives a rule being followed, style exists.
  *   **The Child's Drawing:**
      *   *Verdict:* It captures the spirit but fails the category.
      *   *Reasoning:* If the child uses the same rhythm and pressure (the "hand") but draws a shape that is not an *a*, they have achieved Generative Consistency with your hand but failed Categorical Identity. This proves your suspicion that the two phenomena are separate. You can have the style without the letter, and the letter without the style.

  ### 3. The Fact of the Matter
  You ask if there is a fact of the matter, or if this is merely a projection of trained perception.

  **It is a fact of the matter, but it is a relational fact, not an intrinsic one.**

  Consider the property "being a sibling." You cannot look at a single person in a room and determine intrinsically whether they are a sibling. You must know their relation to others. Similarly, you cannot look at a single letterform in isolation and determine intrinsically whether it is "in style." You must know its relation to the generative system that produced its neighbors.

  This does not collapse into sociology. It collapses into **inference to the best explanation**. When your teacher says a letter is "wrong," she is making a cognitive claim: "The hypothesis that this shape was generated by the same rules as the surrounding shapes is less probable than the hypothesis that it was generated by a different set of rules."

  The evidence that settles this is **predictive power**. If you can take the "wrong" letter and place it on a *different* page where it suddenly looks "right," you have proven that the property was not in the shape, but in the relationship between the shape and the system. This is an objective test.

  ### 4. Why the Other Concepts Fail
  *   **Family Resemblance:** Fails because it implies a network of similarities without a common core. You have identified a common core (the generative rule), even if it isn't visually locatable in a single stroke.
  *   **Prototype Theory:** Fails because it grades category membership (how "bird-like" is a penguin?). You are grading system membership (how "hand-like" is this *a*?). A penguin is still a bird. A "bad" *a* in a calligraphic sense might still be an *a* categorically, but it is a "bad citizen" of that specific alphabet.
  *   **Parametric Systems:** Fail because they are top-down. They define the family by equation. You are working bottom-up, inferring the equation from the family. A parametric system can tell you what fits the equation; it cannot tell you what equation fits the shape.

  ### 5. The Name
  If you require a term to teach your seminar, do not use "Style" alone, as it is too contaminated by fashion and aesthetics. Do not use "Font," as that implies digital replication.

  Use **Idiolect**.
  In linguistics, an idiolect is the specific, unique variety of language used by one individual. It encompasses their vocabulary, grammar, and pronunciation.
  *   **Categorical Identity:** Is this English?
  *   **Systemic Coherence:** Is this *your* English?

  The property the shape possesses is **Idiolectal Fit**.
  *   **Definition:** A shape has Idiolectal Fit relative to a set of other shapes if and only if the shape can be plausibly inferred to be the output of the same generative constraints (motor, tool, decision-rule) as the set.
  *   **Hard Case Resolution:** A one-letter alphabet has no idiolect (no variation to establish rules). A forgery has Idiolectal Fit but lacks Historical Provenance.

  ### Summary for the Seminar
  Your calligrapher's complaint is one thing, not several. It is the detection of **procedural discontinuity**.

  The "fact of the matter" is that human perception is tuned to detect the signature of agency. We are not just recognizing shapes; we are reverse-engineering the hand that made them. When a letter is "wrong," it is because it breaks the causal chain. It suggests a different hand, a different moment, a different intention. The judgment attaches to the pair because the pair is the minimum requirement to establish a rule. A single point cannot define a line; a single letter cannot define a hand.

  You are teaching your students that categorization is not just about what a thing *is*, but about where it *comes from*. The "spirit" your teacher sees is the perceived continuity of origin. That is a real property, located not in the ink, but in the inference.
