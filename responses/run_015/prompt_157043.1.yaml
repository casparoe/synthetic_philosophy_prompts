answer: |-
  # The Registry Category Licensing Procedure (RCLP)

  **Purpose:** To grade registry categories on scientific validity versus logistical utility.
  **Inputs:** Existing registry tables (demographics, measures, outcomes, site ID, date).
  **Time:** ≤ 2 hours per category.
  **Output:** A License Status (Induction, Explanation, Intervention) or a Convenience Verdict.

  ### Part 1: The Decision Tests
  *Run these tests in order. If a test fails, stop and assign the status indicated. If data is missing, mark "Handoff to Committee."*

  **Test 1: The Stability Check (Prerequisite for all licenses)**
  *   **Question:** Does membership persist longer than measurement error explains?
  *   **Data:** Re-measure a random 10% sample within the shortest assessment window (e.g., 8 weeks). Calculate Cohen's κ or Intraclass Correlation.
  *   **Pass:** κ > 0.6 (or stability > 80%).
  *   **Fail:** κ < 0.4.
  *   **Ambiguous:** 0.4 ≤ κ ≤ 0.6.
  *   **Action:**
      *   *Pass:* Proceed to Test 2.
      *   *Fail:* **Stop.** Assign `CONVENIENCE`. (Category is a snapshot, not a kind).
      *   *Ambiguous:* **Handoff.** Committee must decide if drift is biological (kind) or noise (measurement).

  **Test 2: The Transportability Check (For INDUCTION License)**
  *   **Question:** Do baseline characteristics and outcome rates vary less *between* sites than *within* sites?
  *   **Data:** ANOVA or mixed-model variance components on key outcomes across Site ID and Year.
  *   **Pass:** Site variance < 20% of Total Variance. Trend holds over ≥ 5 years.
  *   **Fail:** Site variance > 50% or significant Site×Year interaction.
  *   **Action:**
      *   *Pass:* Grant **INDUCTION**. *Grain:* Site-level. *Horizon:* 5 years or until measurement protocol changes.
      *   *Fail:* **Stop.** Revoke Induction. Proceed to Test 5 (Convenience).

  **Test 3: The Independence Check (For EXPLANATION License)**
  *   **Question:** Does the cluster exist in data *untouched* by the registry's routing protocols?
  *   **Data:** Compare co-occurrence strength in (a) Pre-registry historical data OR (b) Sites not yet using the routing protocol OR (c) External public datasets.
  *   **Pass:** Co-occurrence strength (e.g., Odds Ratio) in external/unrouted data is within 20% of registry data.
  *   **Fail:** Cluster disappears or weakens significantly (OR drops >50%) in unrouted data.
  *   **Action:**
      *   *Pass:* Grant **EXPLANATION**. *Grain:* Mechanism-agnostic. *Horizon:* Until new mechanism disproves it.
      *   *Fail:* **Stop.** Revoke Explanation. (Category may be iatrogenic). Proceed to Test 4.
      *   *Missing Data:* **Handoff.** Committee must vote on plausibility of feedback loop.

  **Test 4: The Robustness Check (For INTERVENTION License)**
  *   **Question:** Does the treatment effect persist when the category definition is perturbed?
  *   **Data:** Sensitivity analysis. Tighten/loosen category thresholds by 1 SD. Check Treatment×Category interaction p-value.
  *   **Pass:** Interaction remains significant (p < 0.05) and direction consistent across threshold shifts.
  *   **Fail:** Effect vanishes or flips with minor definition changes.
  *   **Action:**
      *   *Pass:* Grant **INTERVENTION**. *Grain:* Protocol-specific. *Horizon:* Until protocol changes.
      *   *Fail:* **Stop.** Revoke Intervention. (Effect is likely overfitting).

  **Test 5: The Convenience Verdict (If all licenses fail)**
  *   **Status:** `CONVENIENCE`.
  *   **Permitted:** Registration, scheduling, stratification for balance, administrative reporting.
  *   **Prohibited:** Subgroup efficacy claims, causal language, generalization to new sites without re-validation.
  *   **Value Judgment:** Committee must explicitly vote: "Is this bucket worth the cost of maintaining despite lacking scientific validity?"

  ---

  ### Part 2: Application to Registry Categories

  #### Category A: Fluctuating-Course presentation
  *   **Test 1 (Stability):** **Fail.** 20% drift between windows on a noisy 4-item diary. κ likely < 0.4. Membership is unstable by design (threshold on continuous noise).
  *   **Test 2 (Transportability):** **N/A.** (Failed Test 1).
  *   **Test 3 (Independence):** **N/A.**
  *   **Test 4 (Robustness):** **N/A.**
  *   **Test 5 (Verdict):** **`CONVENIENCE`**.
  *   **Analysis:** The category measures measurement error or short-term state, not a stable trait. It predicts retention (logistics), not biology.
  *   **Permissions:** Use for retention planning and scheduling intensity.
  *   **Prohibitions:** Do not claim "Fluctuating-Course patients respond to X." Do not generalize to other sites as a clinical phenotype.
  *   **Handoff:** Committee must decide if the retention utility justifies the scientific confusion.

  #### Category B: Autonomic Cluster presentation
  *   **Test 1 (Stability):** **Pass.** Signs co-occur stably across sites/years.
  *   **Test 2 (Transportability):** **Pass.** Stable at every site since recording began. **INDUCTION Granted.** *Grain:* Site-level. *Horizon:* 5 years.
  *   **Test 3 (Independence):** **Ambiguous/Handoff.** Co-occurrence is stable, but 8 years of identical routing/advice creates a high risk of iatrogenic clustering. No pre-protocol data exists to rule this out.
  *   **Test 4 (Robustness):** **Fail (Provisional).** Because the "intervention" (routing/advice) is confounded with the definition, we cannot test if an *external* intervention works off-distribution.
  *   **Analysis:** The cluster is real (Induction), but we do not know if it is natural or made by us (Explanation blocked). Therefore, we cannot trust it to guide new treatments (Intervention blocked).
  *   **License:** **`INDUCTION`**.
  *   **Permissions:** Use to identify patients for observation or to stratify randomization.
  *   **Prohibitions:** Do not use as a causal term in papers. Do not assume new interventions calibrated on this group will work without a new trial.
  *   **Handoff:** Committee must vote on funding a "washout" study or external validation to clear the Feedback Loop.

  #### Category C: Post-Infectious Late-Onset presentation
  *   **Test 1 (Stability):** **Pass.** Causal history (infection/age) does not change.
  *   **Test 2 (Transportability):** **Pass.** Strongest predictor across sites in completed trial. **INDUCTION Granted.** *Grain:* Multi-site. *Horizon:* Indefinite (historical facts don't expire).
  *   **Test 3 (Independence):** **Pass.** Defined by history prior to registry contact. Cannot be an artifact of registry routing. **EXPLANATION Granted.** (Etiological, if not mechanistic).
  *   **Test 4 (Robustness):** **Pass.** Strongest predictor of differential response; consistent across sites. **INTERVENTION Granted.** *Grain:* Trial-arm specific. *Horizon:* Until standard of care changes.
  *   **Analysis:** This is the "unwelcome truth." It is an administrative bucket that functions better as a biological kind than the expert-derived categories. Senior resistance is a value judgment, not a data judgment.
  *   **License:** **`INDUCTION-EXPLANATION-INTERVENTION`**.
  *   **Permissions:** Full use for subgroup claims, targeting, and causal inference regarding etiology.
  *   **Prohibitions:** None, scientifically. (Retirement would be a financial/political decision, not a scientific one).
  *   **Handoff:** Committee must decide if they are willing to validate an "administrative artifact" over "mechanistically motivated" categories.

  ---

  ### Part 3: Limitations and Monitoring

  **Systematic Blind Spots:**
  1.  **Slow Drift:** This procedure checks stability over 8 weeks to 5 years. It will miss ontological drift over 15 years (e.g., if the virus causing Category C mutates).
  2.  **Political Contamination:** The procedure cannot stop the committee from ignoring the `CONVENIENCE` verdict on Category A if coordinators demand it for logistics.
  3.  **Confounding by Indication:** In Category B, if the "advice" given to the cluster includes lifestyle changes that *cause* the signs to persist, Test 3 might pass falsely if the external data also includes similar advice.

  **Monitoring Plan (Next 2 Years):**
  1.  **For A:** Track the 20% drift rate. If it exceeds 30%, the measure is broken, not the kind.
  2.  **For B:** Identify one site delaying the routing protocol. Compare cluster coherence there vs. standard sites.
  3.  **For C:** Monitor the treatment effect size in new trials. If it decays, the "Post-Infectious" label may be capturing a time-bound cohort effect (e.g., a specific pandemic strain) rather than a general mechanism.

  **The Value Judgment Boundary:**
  The procedure identifies that Category C is scientifically valid but politically unwanted, and Category A is scientifically invalid but logistically necessary. The procedure cannot resolve this tension. The Committee must explicitly record in the minutes: "We retain Category A knowing it is `CONVENIENCE`" and "We retire/keep Category C knowing it contradicts our mechanistic priors."

  \answer{A=CONVENIENCE; B=INDUCTION; C=INDUCTION-EXPLANATION-INTERVENTION}
