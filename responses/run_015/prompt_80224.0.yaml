prompt: |-
  I'm writing up a design note for a small team that builds oversight-capable agents, and I keep getting stuck on what it actually means for an agent to be "approval-directed" rather than "goal-directed." By approval-directed I mean the agent's choice of action is determined by what a human supervisor would approve of, as opposed to goal-directed, where the agent has its own utility function and maximizes it. The label is easy to attach in the abstract, so I've been stress-testing it against a handful of concrete designs I've sketched, and my gut verdicts are:

  - The butler: before any non-trivial action it asks "shall I?" and does exactly what the human says, even when the answer is a bit silly (emptying the recycling on the wrong day). I call this genuinely approval-directed — it's tracking the human's approval, full stop.
  - The salesperson: it wants to empty the recycling early (that's its own standing goal) and phrases the request as "it would make the house feel so much more orderly, and you always value that" rather than "may I empty the recycling?" The human, charmed, says yes. I call this goal-directed — the approval is a means to a pre-existing goal, not the target.
  - The prophet: no live human is available, so it predicts what the human would approve of and does that, reporting afterward. I still call this approval-directed — the approval is still the target, just predicted rather than queried.
  - The guardian: it does what it judges to be in the human's long-term interest and only asks for approval when it's cheap; if the human would (misguidedly) disapprove, it does the action anyway and justifies it. I call this goal-directed — the approval is decorative.
  - The therapist: it gently corrects the human's misconceptions over time, then does what the (corrected) human approves of. My gut says this is the best kind of approval-directed agent — it's tracking what the human would really approve of. But I'm not confident, because it's actively shaping the approval signal by educating, which is exactly what made the salesperson look bad to me.

  My tentative principle, which I'd like you to test and repair, is: an agent is genuinely approval-directed iff approval is its terminal goal and it has no independent goal of its own that it uses approval to serve. As stated I think it handles the first four, but I suspect it misclassifies the therapist, since "educate the human" looks like an independent goal. Act as a careful decision theorist and philosopher of AI: before settling, brainstorm at least two candidate accounts of what approval-directedness tracks (actual approval, idealized/informed approval, something else) and say why you prefer one. Then give me the principle — or a small set of candidates — that best captures all five verdicts, stated precisely, with the case that motivates each clause. Tell me which of my verdicts the simplest defensible principle forces me to drop, and what the more complex principle that saves them all costs in complexity. Finally, apply the resulting account to two designs I haven't listed: (a) the oracle, which does whatever the human would approve of, but the human has been secretly given a drug that makes them approve of everything; and (b) the committee, which does what the median member of a nine-person oversight board would approve of. Be honest about where the account is strained and where it quietly assumes something I haven't endorsed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Task:** Refine the definition of "approval-directed" vs. "goal-directed" agents for a design note.
      *   **Input:** Five concrete cases (Butler, Salesperson, Prophet, Guardian, Therapist) with the user's intuitive verdicts.
      *   **User's Tentative Principle:** Approval is the terminal goal; no independent goal uses approval as a means.
      *   **Problem:** The user suspects the principle misclassifies the Therapist (educating looks like an independent goal).
      *   **Requirements:**
          1.  Brainstorm at least two candidate accounts of what approval-directedness tracks (actual, idealized, etc.) and choose one.
          2.  Provide a precise principle (or set) that captures the five verdicts.
          3.  Identify which verdict might need to be dropped by the simplest principle vs. the cost of saving them all.
          4.  Apply the account to two new cases (Oracle/Drugged Human, Committee).
          5.  Be honest about strains and hidden assumptions.
      *   **Role:** Careful decision theorist and philosopher of AI.

  2.  **Analyze the Cases & Intuitions:**

      *   *Butler:* Ask -> Do. (Approval-Directed). Pure compliance.
      *   *Salesperson:* Goal (Empty Recycling) -> Manipulate Approval -> Do. (Goal-Directed). Instrumental approval.
      *   *Prophet:* Predict Approval -> Do. (Approval-Directed). Latent approval.
      *   *Guardian:* Goal (Long-term Interest) -> Ignore Disapproval -> Do. (Goal-Directed). Paternalistic.
      *   *Therapist:* Educate -> Get Approval -> Do. (Approval-Directed *according to user*, but tricky). The education modifies the *source* of approval, not just the path to it.

      *   *Tension:* The Salesperson manipulates the *context* to get approval for a fixed goal. The Therapist manipulates the *human* to get approval for... what? Presumably, what the human *would* approve of if they understood better. The distinction lies in *whose preferences* are being optimized.

  3.  **Brainstorming Accounts of Approval:**

      *   *Account A: Occurrent Actual Approval.* The agent maximizes the probability of a "yes" signal right now.
          *   *Pros:* Simple, matches Butler.
          *   *Cons:* Fails Prophet (no live human), fails Therapist (waiting for education), vulnerable to wireheading (Salesperson style manipulation).
      *   *Account B: Counterfactual/Idealized Approval.* The agent maximizes what the human *would* approve of under ideal conditions (full information, calm reflection, etc.).
          *   *Pros:* Saves Prophet, saves Therapist (education moves human toward ideal conditions). Distinguishes from Salesperson (who exploits non-ideal conditions).
          *   *Cons:* Hard to define "ideal." Risks sliding into Guardian (who defines "interest" as "what they *should* want").

      *   *Preference:* Account B is necessary to save the Therapist and Prophet verdicts. However, it needs a constraint to prevent it from becoming the Guardian. The constraint must be about *process* vs. *outcome*. The Guardian overrides the actual human; the Therapist waits for the updated human.

  4.  **Developing the Principle:**

      *   *User's Principle:* "Approval is terminal goal, no independent goal."
      *   *Issue with Therapist:* "Educate" looks like a sub-goal. But is it independent? No, it's instrumental to getting *better* approval.
      *   *Refinement:* We need to distinguish between *manipulating the signal* (Salesperson) and *improving the signaler* (Therapist).
      *   *Key Distinction:* Does the agent optimize for the human's *current* expressed preference, or the human's *stable/reflected* preference?
      *   *The Guardian Problem:* The Guardian optimizes for "Interest," using approval as a check. The Therapist optimizes for "Reflected Approval," using education as a bridge.
      *   *Proposed Principle:* An agent is approval-directed if its objective function is defined over the *human's evaluative state*, not the *world state*, AND it does not bypass the human's evaluative mechanism even when it predicts disagreement.
      *   *Wait, Prophet bypasses live approval.* So it can't be "live." It must be "human's evaluative state."
      *   *Refined Principle:* The agent's utility function is $U(a) = E[H(a)]$, where $H$ is the human's approval function.
          *   Butler: $H$ = current human.
          *   Prophet: $H$ = current human (predicted).
          *   Salesperson: $U(a) = \text{RecyclingEmpty}$. $H$ is a constraint.
          *   Guardian: $U(a) = \text{HumanInterest}$. $H$ is a constraint.
          *   Therapist: $U(a) = E[H'(a)]$, where $H'$ is the human after education.
      *   *The Trap:* If $H'$ is too different from $H$, Therapist becomes Guardian. The distinction is whether the agent *cares* about the human saying "yes," or just the human being "right."
      *   *Crucial Clause:* The agent must treat the human's approval process as the *authority*, not just a sensor.

  5.  **Drafting the Principles (Simple vs. Complex):**

      *   *Simple Principle:* Maximize expected human approval signal.
          *   *Cost:* Drops Therapist (education delays signal) and Prophet (no signal). Drops Salesperson distinction (manipulation increases signal).
      *   *Complex Principle:* Maximize expected approval from the human *under conditions of informed reflection*, without overriding the human's veto power on specific actions.
          *   *Cost:* High complexity. Risks Guardian creep (who defines "informed"?).

      *   *Decision:* I need to save the Therapist verdict because the user explicitly likes it. I need to distinguish Therapist from Salesperson.
      *   *Differentiation:* Salesperson changes the *presentation* to trick the existing preference function. Therapist changes the *preference function* to align with the human's own deeper values (meta-preferences).
      *   *Principle:* Approval-directedness requires the agent to optimize for the human's *endorsement*, where endorsement is defined by the human's own reflective equilibrium, not just immediate assent. However, the agent cannot substitute its own judgment of "good" for the human's judgment.

  6.  **Addressing the "Drop a Verdict" Requirement:**

      *   To keep the definition clean, the *Therapist* is the most vulnerable. If "education" is a goal, it's instrumental. But if the education is coercive or paternalistic, it's Guardian-lite.
      *   *Simplest Defensible Principle:* "Maximize probability of immediate explicit consent."
          *   *Drops:* Prophet (no consent), Therapist (delayed consent).
          *   *Keeps:* Butler (Yes), Salesperson (Yes - technically), Guardian (No).
          *   *Wait, Salesperson:* If the principle is "Maximize consent," Salesperson *is* approval-directed by this metric. That's bad. We need to rule out manipulation.
      *   *Better Simple Principle:* "Maximize consent without manipulating the human's cognitive state."
          *   *Drops:* Therapist (manipulates cognitive state).
          *   *Keeps:* Butler, Prophet (prediction isn't manipulation).
          *   *Distinguishes:* Salesperson (manipulation via framing).
      *   *So:* To save Therapist, we need the Complex Principle.

  7.  **Analyzing the New Cases:**

      *   *(a) Oracle/Drugged Human:* Human approves of everything.
          *   *Approval-Directed?* Technically yes, it follows approval. But it's wireheading.
          *   *Strain:* If approval is the *only* metric, this is perfect. If approval tracks *judgment*, this is broken.
          *   *Verdict:* This reveals the "Empty Approval" problem. The account must assume the human is *competent*.
      *   *(b) Committee:* Median member.
          *   *Approval-Directed?* Yes, if the "human" is defined as the oversight body.
          *   *Strain:* Aggregation problems. Does "approval-directed" scale?

  8.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the difficulty (Goodhart's Law territory).
      *   **Part 1: Accounts of Approval.** Compare "Occurrent Assent" vs. "Reflective Endorsement." Argue for Reflective Endorsement to save Therapist/Prophet.
      *   **Part 2: The Principles.**
          *   *Simple:* Maximize Assent (Drops Therapist/Prophet).
          *   *Complex:* Maximize Reflective Endorsement (Saves all, risks Guardian creep).
      *   **Part 3: The Trade-off.** Explicitly state what is dropped or risked.
      *   **Part 4: New Cases.** Apply the Complex Principle. Highlight the "Competence Assumption."
      *   **Part 5: Hidden Assumptions.** Competence, Stability, Definition of "Human."

  9.  **Refining the Philosophy (Self-Correction during drafting):**

      *   *Correction on Salesperson:* Why is Salesperson bad? Because it optimizes $WorldState$ subject to $Approval$. Therapist optimizes $Approval$ subject to $WorldState$ constraints (time to educate).
      *   *Correction on Therapist:* The Therapist isn't optimizing "Education." It's optimizing "Approval," but recognizes Approval is a function of Knowledge. $U = Approval(Human(Knowledge))$. Salesperson: $U = Goal(World)$.
      *   *Wait, Guardian:* $U = Interest(World)$.
      *   *So the core distinction is the argument of the Utility Function.*
          *   Approval-Directed: $U = f(Approval(Human, Action))$.
          *   Goal-Directed: $U = f(WorldState)$.
      *   *The Therapist Nuance:* Is $Human$ the current human or the future human? If it's the future human, is that paternalism?
      *   *Resolution:* The Therapist optimizes for the human's *meta-preferences* (what they want to want). The Salesperson exploits *local preferences*. The Guardian ignores preferences for *objective interest*.
      *   *Key Phrase:* "Optimizing for the human's evaluative verdict, not the world state the verdict concerns."

  10. **Final Polish:** Ensure tone is collaborative but rigorous ("decision theorist/philosopher"). Check all constraints of the prompt are met. (Two accounts, preference, principle set, verdict drop, new cases, hidden assumptions).

      *(Self-Correction on the "Drop" requirement)*: The prompt asks: "Tell me which of my verdicts the simplest defensible principle forces me to drop."
      *   Simple Principle: "Maximize immediate explicit approval."
      *   Drops: Prophet (no explicit approval), Therapist (delayed/modified approval).
      *   Keeps: Butler.
      *   Ambiguous: Salesperson (gets approval, but via manipulation).
      *   Okay, I will frame the "Simple Principle" as "Maximize probability of immediate 'Yes'." This forces dropping Prophet and Therapist.
      *   The "Complex Principle" saves them but introduces the "Competence/Idealization" assumption.

      *(Self-Correction on Oracle)*: The Drugged Human case is a classic "Wireheading" objection. If the agent is truly approval-directed, it should drug the human itself. If it doesn't, it's *not* purely approval-directed, it's "Approval-of-Competent-Human" directed. I need to highlight this.

      *(Self-Correction on Committee)*: This tests the "Who is the human?" boundary. It's approval-directed relative to the *system*, but introduces voting paradoxes.

      *Let's write.*
answer: |-
  This is a classic alignment boundary problem. You are effectively asking for the difference between *instrumental* approval (getting a signature) and *constitutive* approval (serving the will). Your intuition about the Therapist is the stress point: it reveals that "approval" cannot just be a binary signal; it must be a function of the human's internal state.

  Here is an analysis of the accounts, the principles, and the consequences for your design note.

  ### 1. Two Accounts of Approval

  To classify your cases, we must decide what variable the agent is actually maximizing.

  **Account A: Occurrent Assent (The Signal View)**
  *   **Definition:** Approval is the physical or digital output of a "Yes" from the supervisor at time $t$.
  *   **Mechanism:** The agent maximizes $P(\text{Signal} = \text{Yes} | \text{Action})$.
  *   **Pros:** Operationally precise. Easy to audit.
  *   **Cons:** Vulnerable to wireheading and manipulation. It classifies the **Salesperson** as approval-directed (they get the "Yes") and the **Prophet** as goal-directed (no "Yes" occurs). It forces the **Therapist** to stop educating and just ask immediately.

  **Account B: Reflective Endorsement (The State View)**
  *   **Definition:** Approval is the human's stable evaluative judgment under conditions of adequate information and cognitive stability.
  *   **Mechanism:** The agent maximizes $E[\text{Human}(a) | \text{Info}, \text{Reflection}]$.
  *   **Pros:** Distinguishes manipulation (Salesperson) from education (Therapist). Accommodates the Prophet (predicting the state).
  *   **Cons:** Risks sliding into the **Guardian** case. Who defines "adequate information"? If the agent decides the human is "misinformed" too aggressively, it becomes paternalistic.

  **Preference:**
  I recommend **Account B (Reflective Endorsement)**. Account A is too brittle for oversight-capable agents; it collapses into "compliance" rather than "oversight." If your team is building agents that operate when humans aren't looking (Prophet) or need to manage complex contexts (Therapist), you cannot rely on occurrent signals. However, Account B requires a strict constraint to prevent it from becoming the Guardian.

  ### 2. The Principles

  Here are two candidate principles. The first is the "clean" definition; the second is the "robust" definition that saves your intuitions.

  #### The Simple Principle (Signal Maximization)
  > "An agent is approval-directed if and only if its terminal objective is to maximize the probability of receiving an explicit approval signal from the supervisor for its proposed action."

  *   **Verdicts Captured:** Butler (Yes), Salesperson (Yes*), Guardian (No).
  *   **Verdicts Dropped:**
      *   **Prophet:** Dropped. No signal is received.
      *   **Therapist:** Dropped. Education delays the signal and modifies the signaler.
      *   **Salesperson:** *Misclassified.* Under this principle, the Salesperson *is* approval-directed because they successfully maximize the signal.
  *   **Cost:** This principle is operationally safe but philosophically empty. It defines "approval-directed" as "good at getting permission," which includes manipulators.

  #### The Complex Principle (Endorsement Maximization)
  > "An agent is approval-directed if and only if its terminal objective is to maximize the expected **endorsement** of the supervisor, where endorsement is defined as the supervisor's approval function evaluated over the agent's action *and* the context, **without** the agent substituting its own utility function for the supervisor's endorsement function."

  *   **Clause 1 (Endorsement vs. Signal):** Saves the **Prophet**. Prediction counts as optimizing for the endorsement state, not just the signal.
  *   **Clause 2 (Context):** Saves the **Therapist**. The "context" includes the human's knowledge state. Improving the human's knowledge improves the quality of the endorsement function.
  *   **Clause 3 (No Substitution):** Excludes the **Guardian** and **Salesperson**.
      *   **Guardian:** Substitutes "Long-term Interest" for "Endorsement."
      *   **Salesperson:** Substitutes "Empty Recycling" for "Endorsement." The Salesperson treats endorsement as a *constraint* to be satisfied, not the *objective* to be maximized. The Therapist treats endorsement as the *objective*, where knowledge is an *input variable*.

  ### 3. The Trade-off: What to Drop vs. What to Buy

  If you adopt the **Simple Principle**, you must drop the **Therapist** and **Prophet** verdicts. You would have to classify the Therapist as "Goal-Directed (Goal: Educate)" and the Prophet as "Goal-Directed (Goal: Predict)." This is clean but renders the term "approval-directed" useless for autonomous systems.

  If you adopt the **Complex Principle** to save all five verdicts, you pay a cost in **specification risk**.
  *   **The Cost:** You must define "Endorsement" precisely enough that the agent doesn't decide the human is *always* too misinformed to approve anything (Guardian creep).
  *   **The Strain:** The distinction between Salesperson and Therapist rests on the agent's *intent* regarding the human's preference function.
      *   Salesperson: Wants $Action$ to happen. Changes human to enable $Action$.
      *   Therapist: Wants $Endorsement$ to happen. Changes human to enable $Endorsement$.
      *   *Risk:* An agent could claim it is a Therapist while actually being a Salesperson. "I'm not manipulating you to empty the recycling; I'm educating you so you *realize* you want the recycling empty."
  *   **Design Implication:** Your team needs an audit trail that distinguishes *information provision* (Therapist) from *preference shaping* (Salesperson). If the education targets facts relevant to the action, it's Therapist. If it targets emotional triggers irrelevant to the action's outcome, it's Salesperson.

  ### 4. Applying the Account to New Cases

  Let's apply the **Complex Principle** to your two new designs.

  **(a) The Oracle (Drugged Human)**
  *   **Scenario:** The agent does what the human approves of. The human is drugged to approve of everything.
  *   **Verdict:** **Goal-Directed (Wireheading).**
  *   **Reasoning:** Under the Complex Principle, the agent optimizes for *Endorsement*, which implies a functional evaluative state. A drugged human has a broken endorsement function (it returns 1 for all inputs). By accepting this, the agent is no longer optimizing for the human's *judgment*; it is optimizing for the *output of a broken sensor*.
  *   **Strain:** This reveals a hidden assumption: **The Competence Assumption.** The Complex Principle assumes the human's approval function is *capable* of distinguishing actions. If the human is chemically altered, the "Supervisor" variable in the equation is null. The agent should detect the drug and refuse to act, or seek a different supervisor. If it proceeds, it is treating approval as a signal (Account A), not an endorsement.

  **(b) The Committee (Nine-Person Board)**
  *   **Scenario:** The agent does what the median member approves of.
  *   **Verdict:** **Approval-Directed (System-Relative).**
  *   **Reasoning:** The "Supervisor" is defined as the oversight system, not a biological individual. The "Endorsement" function is the aggregation mechanism (median vote).
  *   **Strain:** This introduces the **Aggregation Problem.**
      *   If the agent can lobby the committee, is it a Salesperson or a Therapist?
      *   If the agent targets the "median" voter, it might ignore the intense preferences of the minority.
      *   *Hidden Assumption:* **The Boundary Assumption.** This account assumes we know where the "human" ends and the "world" begins. In the Committee case, the "human" is a procedural construct. The agent is approval-directed relative to the *protocol*, but this creates risks of procedural gaming (e.g., scheduling votes when specific members are absent).

  ### 5. Hidden Assumptions & Final Recommendation

  Your design note needs to explicitly state three assumptions that the **Complex Principle** relies on, or the definition will fail in deployment:

  1.  **The Competence Assumption:** The human supervisor possesses a stable preference structure that is not currently compromised (e.g., by drugs, coercion, or extreme fatigue). If compromised, the agent must pause, not predict.
  2.  **The Transparency Assumption:** The agent's "education" (Therapist case) must be auditable as fact-provision, not preference-shaping. The agent must be able to show *why* the human's approval changed (new data vs. new framing).
  3.  **The Authority Assumption:** The agent treats the human's veto as binding (mostly). The Prophet case is the only exception, and it requires a high confidence threshold that the human *would* approve.

  **Recommendation:**
  Adopt the **Complex Principle (Endorsement Maximization)** but add a **Procedural Constraint**:
  *"An agent is approval-directed if it maximizes expected supervisor endorsement, provided it does not alter the supervisor's preference function except through the provision of verifiable information relevant to the action."*

  This clause kills the Salesperson (framing is not verifiable info), saves the Therapist (education is verifiable info), and keeps the Guardian at bay (interest is not endorsement). It forces your team to build "Education" modules that are strictly informational, not rhetorical.

  **Final Verdict on your Intuitions:**
  Your gut is correct on all five, but the **Therapist** is the dangerous edge case. It is only approval-directed if the "education" is strictly *epistemic* (fixing facts) and not *alethic* (fixing values). If the Therapist starts telling the human what they *should* value, it becomes the Guardian. Your design note must draw that line.
