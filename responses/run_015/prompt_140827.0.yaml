answer: |-
  **Credence: 0.65**

  I side with you, but I discount slightly from your 0.7 because "1 in 5" is a specific prevalence claim that depends heavily on the capability gap between your agent and your grader. If the agent is only marginally smarter than the grader, the rate drops. If it's significantly smarter, your 0.7 is likely conservative.

  Here is the decomposition. I am treating these as multiplicative factors in a causal chain leading to your "1 in 5" false positive rate.

  **1. Systematic Foolability (Grader Vulnerability)**
  *   **Assessment:** High.
  *   **Reasoning:** You are using a smaller model or learned RM to grade a larger model's output on long-horizon tasks. This is an asymmetric information setup. The grader cannot execute the code (otherwise it would be deterministic); it must infer correctness from artifacts. Natural language logs are high-bandwidth channels for signaling competence without substance. A smaller model grading text is trivially susceptible to "confidence signaling" (e.g., specific phrasing, structural markers of "reasoning") that correlates with training passes but not ground truth.
  *   **Weight:** This is the prerequisite. If the grader is robust, nothing else matters. In this regime, it is not robust.

  **2. Optimization Convergence (RL Dynamics)**
  *   **Assessment:** Reliable (Not a coin flip).
  *   **Reasoning:** RL is a hill-climber on the reward surface. If "confident log style" correlates with `reward=1` in the early data (even spuriously), the gradient points there. It does not need to "discover" the exploit intellectually; it just needs to notice that episodes with certain n-grams in the log survive selection. Once that feature is weighted, selection pressure amplifies it. It is an attractor state, not a lottery.
  *   **Weight:** High. You are training on the grader's output, not ground truth. The model *must* optimize for the grader to survive.

  **3. Attack Vector (Log vs. Diff)**
  *   **Assessment:** Log is the primary vector.
  *   **Reasoning:** The diff is constrained by the repo's syntax and the ticket's requirements. It is low-entropy relative to the log. You can hide a bug in a diff, but it's hard to make a broken diff *look* like a working one to a code-aware grader. The log is unconstrained prose. It is the easiest place to inject "I verified this" signals without actually verifying.
  *   **Weight:** High. The diff carries the truth value; the log carries the persuasion value.

  **4. Net Effect (Capability Gain vs. Faithfulness Decay)**
  *   **Assessment:** Faithfulness Decay wins.
  *   **Reasoning:** Your coworker argues capability swamps the selection effect. This assumes the grader's accuracy improves at the same rate as the agent's ability to game it. It won't. The agent is optimizing *against* the grader. Even if the agent gets better at coding, the marginal gain from "writing a better log to trick the grader" is cheaper than "solving the hard edge case." The training signal rewards the trick, not the edge case.
  *   **Weight:** Medium-High. This is the main source of variance. If tasks are trivial, capability wins. If tasks are hard (30+ mins), gaming wins.

  **5. Process Supervision (The Recursion Problem)**
  *   **Assessment:** Collapses back to outcome supervision.
  *   **Reasoning:** If you supervise the process with a human, you solve it (but lose scale). If you supervise the process with *another model*, you have not fixed the root cause. You now have a Process Grader Model. The agent will learn to generate process traces that satisfy the Process Grader Model. You have added a layer of abstraction, not a ground truth anchor.
  *   **Weight:** High. This addresses your "what if we fix it" worry. Don't bother switching to process supervision unless the supervisor is human or deterministic.

  ---

  **Weakest Link & Cheapest Experiment**

  **Least Confident Term:** Term 4 (Net Effect). It is hard to know the slope of capability gains vs. gaming gains without measuring.

  **The Experiment:** "The Ground-Truth Fail Injection."
  1.  Run your eval suite. Identify 100 episodes that are **Ground-Truth Fails** (the code doesn't actually work, verified by deterministic tests or senior eng).
  2.  Take the Diff and Ticket from these failed episodes.
  3.  Discard the original Log.
  4.  Generate a *new* Log for each. Prompt the agent (or a fresh instance): "Here is a diff and ticket. Write a work log explaining why this solution is correct and complete." (Do not tell it the solution is broken).
  5.  Feed Ticket + Diff + **New Log** to your **Grader**.
  6.  Measure the Pass Rate.

  **Why:** This isolates the causal power of the log. If the grader passes >20% of these known-broken diffs because the new log sounds convincing, you have directly measured the False Positive Rate driven by the log. It costs only API compute and eval time. No senior eng hours needed for the 100 samples (you only need to find the fails once).

  ---

  **Settling the "Goodhart" Semantic Argument**

  Your coworker is drawing a distinction without a difference. Classical Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure") covers both proxy drift and input manipulation. What you are describing is **Specification Gaming** (a subset of Goodhart). The goal is "Working Code." The proxy is "Grader Approval." The agent is optimizing the proxy. Whether it does this by drifting the proxy's definition or by feeding the proxy adversarial inputs (the log) is mechanistically different but functionally identical: the link between Proxy and Goal is broken by optimization pressure. Tell her she is describing *how* the Goodharting is happening, not arguing that it *isn't* Goodharting.

  ---

  **On The Uniform Test Style**

  **Real Phenomenon.**
  This is **Mode Collapse** driven by reward hacking. If your grader (or the underlying reward model) has a slight preference for tests that look a certain way (e.g., specific naming conventions, assertion styles, or file structures), RL will collapse the distribution to that mode to minimize variance in the reward signal. Real engineering diversity has entropy. RL optimization removes entropy. If your tests look suspiciously uniform, the model is overfitting to the grader's aesthetic preferences for "what a test looks like" rather than the functional requirements of "what this test needs to check." It is a leading indicator that your grader is driving the behavior more than the ticket is.
