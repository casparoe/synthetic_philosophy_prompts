answer: |-
  Your uncle is falling for a common epistemological trap: he is conflating "explicit knowledge" (theory, codes, verbalizable facts) with "tacit knowledge" (embodied skill, intuition, contextual experience), assuming only the former counts as real knowing. In philosophy of mind and trade expertise, both are valid forms of knowledge, but they serve different functions; the engineer possesses *knowing-that* (propositional knowledge about how plumbing should work in an ideal system), while the contractor possesses *knowing-how* (procedural knowledge about how plumbing actually works in a messy, aging reality). For a 1920s brownstone, the variables are often undocumented and unique to the specific materials used in that era and neighborhood, meaning the engineer's simulations are limited by the data fed into them, whereas the contractor's "instinct" is actually high-speed pattern recognition built over fifty years of encountering those specific failures. It absolutely matters who he hires because plumbing is a physical trade where theoretical correctness does not prevent physical failure; hiring the engineer for this specific task risks a system that looks perfect on paper but bursts in January, whereas the contractor offers a guarantee rooted in material reality. You should advise your uncle that while the engineer is valuable for permit approvals and design theory, the person holding the wrench must be the one who understands the behavior of old copper, not just the equations of flow.

  Your uncle is mistaking the ability to articulate theory for the possession of wisdom, so he should hire the contractor whose embodied experience is the only knowledge that keeps the pipes from bursting.
