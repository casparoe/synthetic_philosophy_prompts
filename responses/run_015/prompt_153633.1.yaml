  *(Refining Q2)*: Is domain-indexing principled? If "domain" = "method," then it's just restating Nozick's method-relativity. But P1 uses it to *save* closure. That's the ad hoc part. Nozick uses method-relativity to *explain* closure failure. P1 uses it to *prevent* closure failure. That's the crucial distinction.

  *(Refining Q3)*: Ascription universality. Nozick is an externalist. Facts about tracking are objective. But *which* method is used can be vague. P2's objection is about the *stability* of knowledge attributions. P1 is right that knowledge is method-relative.

