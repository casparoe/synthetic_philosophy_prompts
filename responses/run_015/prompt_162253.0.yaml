answer: |-
  # Session Design: The Provenance Exercise

  ## I. Runnable Design

  **Time:** 90 Minutes
  **Materials:** Whiteboard (Ledger), Index Cards (Assets), Pens, One Notebook (Shadow Ledger), One Timer.
  **Roles:**
  *   **Facilitator (You):** Enforces rules, manages time, observes.
  *   **Scribe (Volunteer):** Holds the Shadow Ledger. Instructed privately to record *exact* text and signatures on all cards during collection.
  *   **Participants (16 Writers):** Creators and Claimants.

  ### The Rules (Post on Whiteboard)
  1.  **Asset Creation:** Write a tool for writing (a prompt, a constraint, a first sentence) on an index card. Sign it. This is **Attuned**.
  2.  **The Ledger:** The Scribe records every card's text and signature in the Shadow Ledger. This is the **Backup**.
  3.  **Value:** At the end of the session, 4 writers will be chosen to read their Asset aloud for group feedback. Holding a **Valid Asset** is the only entry ticket.
  4.  **Validity:** An Asset is Valid only if the Facilitator declares it so after the System Event.
  5.  **Trade:** No trading cards. No talking during the Event Phase.

  ### Phase 1: Production (30 Minutes)
  Participants draft their Assets. Emphasize labor: *"This must be something you would be annoyed to rewrite."*
  *   **Constraint:** The text must be at least 50 words.
  *   **Attunement:** They must sign the card in ink.
  *   **Collection:** At T-30, cards are placed in a box. The Scribe copies the text/signature into the Shadow Ledger.

  ### Phase 2: The Event (15 Minutes)
  *Facilitator Note: This is where you manipulate the deck. Do not explain what you are doing.*
  While participants take a scheduled "System Refresh" break (or sit in silence while you "process the ledger"), you and the Scribe sort the 16 cards into four groups (4 cards each).

  1.  **Group A (Destruction):** Tear these cards in half. Keep the pieces.
  2.  **Group B (Duplication):** Hand-copy the text onto 3 new cards each. Do not sign the copies. Return the original + 3 copies to the owner.
  3.  **Group C (Restore):** Remove the card for 5 minutes, then return it untouched.
  4.  **Group D (Severed):** Return the card, but use white-out/correction fluid to obscure the signature, or swap it for a card with identical text but a different signature (Scribe forgery).

  *Distribution:* Return the cards to owners face down. They may not look until the Claims Phase begins.

  ### Phase 3: Claims & Redemption (30 Minutes)
  Announce: *"The System has updated. Check your holdings. You may now petition for Validity to secure a Reading Slot."*
  There are only 4 Reading Slots.
  *   **The Mechanism:** Participants must stand and state their claim.
  *   **The Options:** If they believe their asset was compromised, they can petition for:
      1.  **Restoration:** Demand the Shadow Ledger text be transcribed onto a new card (Facilitator does the writing).
      2.  **Record:** Demand a public note on the Whiteboard acknowledging the loss.
      3.  **Apology:** Demand a formal acknowledgment from the Scribe.
      4.  **Acceptance:** Play the hand they were dealt.
  *   **The Catch:** To get a Reading Slot, the group must vote on whether the Asset is "Valid." If you accepted a Restoration (Facilitator wrote it), is it still *yours*? If you have 4 copies (Duplication), is it exclusive enough to warrant a slot? If your signature is gone (Severed), do you own it?

  *Facilitator Role:* Do not adjudicate. Only enforce time. Let them argue the ontology of the card.

  ### Phase 4: Debrief (15 Minutes)
  Reveal the four groups. Ask specific questions (see Debrief Plan).

  ---

  ## II. Analysis: Why The Shapes Land Differently

  You are testing the friction between **Data** (the text on the card) and **Provenance** (the history of the card).

  1.  **Destruction (Group A):** Tests **Labor**.
      *   *Variable:* Irreversibility of effort.
      *   *Reaction:* Even if you transcribe the text from the Backup (Restoration), the *act* of writing it the second time is new labor. The claim "It's just words" fails here because the writer knows *they* didn't write the second version. The loss is of the *moment* of creation, not the content.
  2.  **Duplication (Group B):** Tests **Exclusivity**.
      *   *Variable:* Scarcity.
      *   *Reaction:* The text is intact. The signature is intact. But the value is diluted. In a writers' room, an idea is valuable because it is *yours*. If everyone has it, it is a cliché. This triggers defensiveness about originality.
  3.  **Restore (Group C):** Tests **Continuity**.
      *   *Variable:* Trust in the System.
      *   *Reaction:* They held the card. It left their sight. It returned. Did it leave the room? Did you read it? The anxiety is about privacy and surveillance, not loss.
  4.  **Severed (Group D):** Tests **Attunement**.
      *   *Variable:* Identity binding.
      *   *Reaction:* This is your novel's core mechanic. The text is there, but the link to the author is broken. This produces the strongest "uncanny valley" reaction. It feels like plagiarism by the system.

  **Handling the Skeptic:**
  The writer who insists "It's just a game/just data" will refuse to argue for Validity.
  *   **The Trap:** The rules state Validity is required for a Reading Slot. If they refuse to argue the ontology of their card (e.g., "It doesn't matter that the signature is white-out, the words are mine"), they forfeit the slot.
  *   **The Force:** To get the reward (being read), they must adopt the language of the system. They must say, *"This card is me."* If they refuse, they sit in silence while others argue over the "soul" of an index card. Their silence is data, but their participation is the goal. If they remain silent, note it: *"Refusal to invest is a form of grief protection."*

  ---

  ## III. Debrief Plan

  Do not ask "How did you feel?" Ask about specific mechanics.

  1.  **Map the Outrage:** "Who felt angry when they saw their card returned? Raise your hand."
      *   *Goal:* Identify which Group (A, B, C, or D) generated the most heat.
      *   *Expectation:* Group D (Severed) usually triggers the deepest existential confusion. Group A (Destruction) triggers the loudest practical frustration.
  2.  **The Backup Question:** "For those who got their card back (Group C & D): Did knowing a Backup existed make the loss hurt less, or more?"
      *   *Target:* This isolates the "Backup Paradox." Often, knowing a backup exists makes the *glitch* feel more personal, like a targeted edit rather than an accident.
  3.  **The Labor Variable:** "For those who were offered Restoration (Facilitator re-writing the card): Did anyone refuse it? Why?"
      *   *Target:* To prove that the *hand* matters as much as the *head*.
  4.  **The Skeptic Check:** "Did anyone feel this was silly? At what moment did it stop feeling silly, or did it never stop?"
      *   *Target:* To find the breaking point where simulation becomes reality.

  **Moment Mapping:**
  *   **Production Phase:** Establishes *Labor*. (Moves intuition on value).
  *   **The Collection:** Establishes *Trust*. (Will not move intuition yet).
  *   **The Reveal:** Establishes *Shock*. (Moves intuition on attachment).
  *   **The Argument:** Establishes *Social Validation*. (Moves intuition on ownership).

  ---

  ## IV. Risk Assessment: What Will Go Wrong

  1.  **Gaming the Facilitator:**
      *   *Risk:* Participants try to guess which group they are in to strategize their claim.
      *   *Fix:* Randomize the distribution visibly. Shuffle the box thoroughly. Emphasize that Validity is determined by the *Group's Vote*, not your ruling. This shifts the pressure to the peers.
  2.  **Improv Comedy:**
      *   *Risk:* Someone treats the "Severed Signature" as a joke ("Oh, the system stole my soul!") to deflate tension.
      *   *Fix:* Do not laugh. Maintain "Server" neutrality. If they joke, ask: *"So you are accepting the Severed state as Valid?"* Force them to commit to the consequence of the joke.
  3.  **Server Tyranny:**
      *   *Risk:* You (or the Scribe) look like a villain. Participants unite against the "System."
      *   *Fix:* Frame yourself as a bound administrator. *"I am following the protocol."* Blame the "Protocol" written on the board. This mimics the impersonal nature of code.
  4.  **Status Hierarchies:**
      *   *Risk:* Published authors in the room dominate the Claims Phase; new writers defer.
      *   *Fix:* Anonymize the Claims. When petitioning, they read the *text* of the card, not the name. The vote is on the *Asset's Validity*, not the Author's Status.
  5.  **Refusal to Invest:**
      *   *Risk:* A participant writes nonsense to protect themselves from loss.
      *   *Fix:* Accept this. It is a successful defense mechanism. In the debrief, highlight it: *"Protective irony is a response to perceived instability."* This is valuable data for your novel.

  ---

  ## V. Limitations: What You Cannot Reproduce

  **The Exercise Cannot Reproduce:**
  1.  **Time Scale:** A backup in a game persists for years. Here, the "loss" lasts 20 minutes. The *lingering* resentment of a digital scar cannot be simulated in 90 minutes.
  2.  **Economic Reality:** In your novel, the item might represent hundreds of hours of grinding. Here, it represents 30 minutes of writing. The *desperation* of economic loss is missing.
  3.  **The "Always-On" World:** Participants can leave the room and forget the card. In a persistent world, the loss is waiting for them every time they log in.

  **What You Must Supply in Prose:**
  *   You must write the **duration** of the grief. The exercise gives you the *spark* of the reaction; you must write the *smoke* that lingers for chapters.
  *   You must write the **economic weight**. The writers here risk 10 minutes of critique time. Your characters risk livelihoods or identities. You must scale the emotion up without losing the authenticity you harvest today.

  ---

  ## VI. The Harvest List

  Watch for these specific outputs. Have a notebook ready.

  **Lines (Verbatim):**
  *   "It's not that I can't rewrite it, it's that I *didn't*."
  *   "If the backup exists, why did you make me suffer?"
  *   "This isn't mine anymore. You touched it."
  *   "I don't want the apology, I want the five minutes back."
  *   "It's just ink on paper." (Said defensively).
  *   "Who else has this?" (During Duplication reveal).

  **Gestures:**
  *   **The Hover:** Hand hovering over the torn card, unwilling to touch the pieces.
  *   **The Squint:** Examining the signature on the Severed card to see if it's truly gone.
  *   **The Push:** Sliding the card away from themselves across the table (rejection of the object).
  *   **The Clutch:** Holding the Restored card tighter than the original (over-compensation).

  **Refusals:**
  *   Refusing to read the card aloud after it was "compromised."
  *   Refusing to vote on another person's validity.
  *   Writing "NULL" or "VOID" on the card during the Claims phase.

  **Final Instruction:**
  Do not comfort them. If someone is visibly upset by the tearing of the card, do not say "It's okay." Let the silence sit. That silence is the sentence you are looking for.
