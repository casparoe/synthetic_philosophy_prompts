prompt: |-
  I'm a software architect fluent in build-system design: I work daily with transitive dependency resolution, circular-dependency breaking, self-hosting compiler bootstrapping, minimal root binaries, and the distinction between source-built artifacts and pre-built vendor dependencies whose provenance is opaque. I have no formal philosophy background beyond casual reading.

  Restate the philosophical distinction between cranes and skyhooks—explanatory structures that build themselves up through transparent, recursive stages versus ones that appear fully formed without lower-level support—together with the critique of greedy reductionism, which treats every higher-level phenomenon as collapsible into its base components without remainder. Do this entirely inside my vocabulary: map cranes onto bootstrapping toolchains that compile themselves from a minimal seed through explicit dependency graphs; map skyhooks onto vendor binaries or framework blobs that enter the build with no traceable source ancestry; and map greedy reductionism onto an aggressive dependency-pruning strategy that insists every high-level feature is derivable from the minimal root set, dismissing any structural residue as illusory.

  Keep the translation honest: do not smuggle philosophical commitments in under engineering labels, and do not reduce "skyhook" to mere "bad practice" unless the translation genuinely forces that.

  Then deliver the residue report. For each element—cranes, skyhooks, greedy reductionism—state what translates cleanly into build-system terms, what must be distorted to fit, and what has no counterpart at all. In particular, address whether the normative or metaphysical weight of "skyhook" (that it is not just inefficient but conceptually illegitimate) survives translation, or whether it collapses into a purely practical objection about maintainability.

  Finally, take a definite, committed position with reasons: is greedy reductionism actually a disguised skyhook—an unearned assumption that the minimal dependency base already contains all necessary structure—or is it a legitimate, if risky, crane? And does whatever fails to translate point to a real limitation in how build architectures conceptualize emergence, or to an overreach in the original philosophical argument? Do not lay out options neutrally; defend one view.
