prompt: |-
  Right, I'm curating a set of prompts on philosophical ideas that sit a bit off the beaten track — not so niche that a small LLM hasn't clocked the concept, but far enough from the usual trolley-and-teleporter stuff that it can't just parrot training data. I need you to build me a thought experiment to spec.

  Domain: mind uploading through gradual neuronal replacement. Give me a realistic medical scenario — say, a patient with an early degenerative condition getting synthetic implants over years — but inject one slightly weird constraint: every replacement happens only during a medically induced coma with flatline EEG, and when they wake the synthetic nodes have been pre-loaded with their pre-sleep neural state so memory is seamless. By the end, 99% of the brain is synthetic and biologically inert; they definately recieve no metabolic support from the old tissue.

  Here are the specifcations. First, keep it to one paragraph, hospital setting, no branching or duplication. Second, engineer it so psychological-continuity theory (Parfit-style) is forced to say the original person survives, while a strict biological-substance view is forced to say they've died and been replaced by an artefact. I want the usual split, but tightened: no "closest continuer" wiggle room, since there's never more than one waking patient and subjective experience reports continuous behaviour.

  Then, after the scenario, do the check: state the claim at stake, the method of replacement, the relevant nearby worlds, and why each theory gives its verdict. Tell me which feature is actually doing the work — the coma gap in consciousness, the total loss of metabolising tissue, or the pre-loading of memory state? And be honest: how would a biological-substance defender attack this case, and does removing the coma element collapse the distinction back into a standard Ship-of-Theseus problem?

  Write it casually, British spelling please (behaviour, anaesthetic, artefact), and don't bother with citations or a reading list — this is meant for a model with no web access. A typo or two is actually welcome for flavour; I want it to feel like a real journalist's rushed email. Don't ask for bibliographies.
