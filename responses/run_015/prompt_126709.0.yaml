  | **(1) Analyst** | **2** | Action is right, but guidance is anchored to guilt-relief, not the charity's efficacy or the need. |
  | **(3) Wallet** | **2** | Guidance tracks divine command, not property rights; robustness fails completely on meta-ethics. |
  | **(10) Activist** | **2** | Guidance tracks community conformity, not justice; robustness fails on the cause's content. |
  | **(2) Surgeon** | **4** | Guidance is habitual/craft-based; post-hoc rationalization fails Conception, but habit is non-accidental. |
  | **(4) Researcher** | **4** | Guidance tracks professional reputation; instrumental alignment with good work is derivative, not direct. |
  | **(6) Donor** | **6** | Guidance tracks "good per dollar" (right genus), but factual belief about mechanism is false (Conception error). |
  | **(8) Nurse** | **6** | Overdetermined; sufficient right-making reason (patient need) is present and causally active alongside self-interest. |
  | **(5) Parent** | **8** | Guidance is direct and non-accidental; lacks explicit Conception, but impulse tracks the right feature perfectly. |
  | **(7) Juror** | **8** | Guidance tracks evidence (right feature); inert bribe is causally irrelevant, so it does not diminish worth. |

  **Tiers (within 1 point):**
  *   **Tier 1 (0–2):** (9), (1), (3), (10) — *No Worth / Wrong Reasons*
  *   **Tier 2 (4–5):** (2), (4) — *Derivative / Habitual Reasons*
  *   **Tier 3 (6–7):** (6), (8) — *Mixed / Partially Accurate Reasons*
  *   **Tier 4 (8–9):** (5), (7) — *High Worth (Virtuous Inertia / Pure Evidence)*

  ### 2. The Reasons-Condition Fraction

  **Number:** **0.95**

  **Explanation:** Since you stipulated that *Rightness* and *Consequences* are held constant (all actions are right and produce good), they explain **0%** of the *variance* (spread) across these ten cases. The entire spread (0 to 8) is driven by the *Reasons-Condition* (your components ii, iii, and iv). I deduct 0.05 to acknowledge that in intuitive judgments, extreme consequences (e.g., saving a life vs. returning a wallet) sometimes leak into worth assessments despite the philosophical stipulation.

  **Driving Cases:**
  1.  **Case (9) Algorithm:** Sets the floor. It proves that Rightness + Good Consequences = 0 Worth without agency/reasons.
  2.  **Case (5) Parent:** Sets the ceiling (tied with 7). It proves that high Worth is possible without explicit normative Conception, provided Guidance is tight.

  ### 3. Stress-Testing the Components

  **Redundant Component:** **(iv) Robustness**

  **Diagnosis:** Robustness is doing no independent work; it is merely a modal stress-test for **(ii) Guidance**. If the right-making features *actually* figure in the causal history (Guidance), the agent is, by definition, sensitive to those features. If they are not robust (e.g., Case 3 or 10), it is because the *actual* guiding feature was something else (God's Command, Community Norms), which means Guidance (ii) already failed. Robustness adds granularity but no new discriminative power.

  **Re-Rating Without (iv):**
  *   **Case (6) Donor:** Moves from **6 → 7**. Without the robustness check on the *mechanism* (malaria vs. school), her Guidance on the *value* (good per dollar) suffices for a higher score.
  *   **Case (3) Wallet:** Stays at **2**. Guidance still fails because "God's Command" is not the truth-maker for property rights.
  *   **Case (10) Activist:** Stays at **2**. Guidance still fails because "Community" is not the truth-maker for "Justice."
  *   **All others:** No change.

  **Conclusion:** Removing (iv) collapses the distinction between "fragile right reasons" and "wrong reasons that look right," suggesting your intuition about (iv) was actually a worry about the precision of (ii).

  ### 4. Rival Account Disagreement

  **Divergent Cases:** **Case (5) Parent** vs. **Case (7) Juror**

  **My Rating:** (5) = 8, (7) = 8 (Equivalent high worth).
  **Rival Rating (Strict Kantian):** (5) = 3, (7) = 9 (Gap of 6 points).

  **The Crux:** **Component (iii) Conception.**
  The Kantian rival argues that moral worth requires the agent to represent the right-making feature *as a moral law or duty*. The Parent (5) acts on impulse/love without normative representation, so they lack moral worth (mere prudence or inclination). The Juror (7) acts on evidence/duty, so they have full worth. My framework allows non-normative representations (e.g., "she was drowning") to suffice if Guidance is tight.

  **Settling Case:** **"The Instinctive Truth-Teller"**
  *   **Description:** An agent returns a lost wallet containing cash.
  *   **Variant A:** Returns it thinking, "Keeping this would violate the owner's autonomy and the categorical imperative."
  *   **Variant B:** Returns it thinking, "This belongs to someone else and they'll be sad without it," with no concept of "duty" or "rights," and admits under questioning they don't know *why* it's wrong to keep it, just that it is.
  *   **Resolution:** If you intuit Variant A has significantly more moral worth than B, your Component (iii) needs to be strengthened to require *Normative Conception*. If you intuit they are roughly equal, your current framework holds, and the Kantian is demanding too much intellectualization.

  ### 5. Missing Distinction

  **Distinction:** **Affective Resonance**

  **Definition:** The degree to which the agent's emotional state tracks the *moral significance for the other* (e.g., compassion, indignation) versus the *status of the self* (e.g., guilt, pride, anxiety). This is operationalized by asking: "If the beneficiary's suffering were removed but the agent's self-status remained threatened, would the agent still act?"

  **Why it's missing:** Your four components are cognitive and causal. They track *what* guides the agent and *how* they represent it, but not the *tone* of the motivation.

  **Discrimination:** This distinguishes **Case (2) Surgeon** from **Case (5) Parent**.
  *   **Current Framework:** Both rate highly on Guidance (non-accidental) and low on Conception (no explicit deliberation). They land in similar tiers (4 vs 8, but the gap is explained by Conception).
  *   **With Affective Resonance:**
      *   **Case (5) Parent:** High Resonance. The emotion is directed at the *child's peril*.
      *   **Case (2) Surgeon:** Low Resonance. The emotion is directed at the *craft/professional identity* ("taste for the craft").
  *   **Impact:** This explains why we intuitively feel the Parent's action has a "warmer" moral worth than the Surgeon's, even if both are reliable. It captures the difference between *virtue* and *skill*, which your current framework treats as structurally identical (non-accidental guidance without normative conception). Adding this would lower Case (2) to a **3** and keep Case (5) at **8**, widening the gap your current Conception component hints at but doesn't fully capture.
