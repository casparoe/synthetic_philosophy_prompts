      *   *Hypothesis 3 (Repeatability):* Crucial. SETI relies on signal processing. If it doesn't repeat, you can't verify it's not a glitch. Spectroscopy integrates light over time; the "signal" is the accumulation of photons, which *is* repeatable in the sense that the atmosphere stays there (mostly).

  4.  **Tackling the Thought Experiments:**

      *   *Case 1 (One-off Message):* If the information content is mathematically certain (primes), repeatability matters less for *verification of artificiality*, but matters for *source localization/trust*. Current practice would likely label it "unverified candidate" until correlated with another telescope. It wouldn't be "detection" in the formal sense. This suggests *independent verification* is the real key, not just repeatability.
      *   *Case 2 (Industrial Gas):* This is the bridge. CFCs are technosignatures found via spectroscopy (biosignature method). Would it get the SETI standard? Likely yes, because it implies *agency*. This reveals the asymmetry is about *Agency*, not the method of detection.

  5.  **Planetary Protection:**

      *   Why protect Martian bugs?
