      *   *Moral Standing:* Not really about the bacteria's rights, but about preserving the integrity of the discovery and preventing ecological harm to Earth.

  6.  **Synthesizing the "Cost of Being Wrong" Framework:**

      *   *False Positive (Life):* Embarrassment, wasted telescope time.
      *   *False Positive (Intelligence):* Societal disruption, religious crisis, massive resource diversion, credibility collapse for science.
      *   *False Negative (Life):* Missed science.
      *   *False Negative (Intelligence):* Missed contact.
