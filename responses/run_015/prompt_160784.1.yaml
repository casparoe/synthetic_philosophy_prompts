      *(Self-Correction during drafting)*: I initially thought about saying biosignatures are easier to verify. Actually, they aren't. You can't go there. But the *physics* is more constrained. A gas ratio is a physical state. A radio signal is an information packet. The verification of a physical state is statistical; verification of information requires decoding. That's a key distinction.

