      *   **Planetary Protection Angle:** Why do we protect potential Martian microbes (clean rooms) if Earth bacteria have no moral standing? Is it rarity, independent origin, or just caution?
      *   **Desired Output:**
          *   Distinguish what the practice *strictly presupposes* vs. what it *sits comfortably with*.
          *   Check for consistency across different parts of the practice.
