  3.  **Addressing the Hypotheses:**

      *   *Hypothesis 1 (Extraordinariness):* Sagan's "Extraordinary Claims." Intelligence *is* considered a subset of life, so logically rarer. But is the *evidentiary bar* higher, or just the *interpretive caution*?
