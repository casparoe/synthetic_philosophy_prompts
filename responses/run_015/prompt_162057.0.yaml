  **FACULTY SENATE MINUTES**
  **Regular Meeting, October 14, 2024**
  **Present:** The Chair, forty-two Senators.

  **1. Curriculum Motion 24-05.**
  The Senate considered the suspension of the Language Requirement. Per Procedure 9.1 (Premise Priority), the motion was decomposed. Premise A: "If enrolment in Level 101 has fallen below fifty percent, the requirement shall be suspended." Passed 25–10. Premise B: "Enrolment in Level 101 has fallen below fifty percent." Passed 26–9. Conclusion: "The Language Requirement is suspended." Failed 15–20.

  Senator Haskins objected that a majority voted against suspension. The Chair ruled that the Senate's will is the logical closure of its accepted premises. While a majority opposed the outcome, a majority supported the sufficient conditions for it; therefore, the opposition was procedurally irrelevant. The suspension carries.

  **2. Hiring Motion 24-06.**
  The Senate considered a request for a new line in Comparative Literature. The justification relied on Premise B ("Enrolment in Level 101 has fallen below fifty percent") to demonstrate critical mass for specialized tracks. Premise B was put to the vote. Failed 12–23. The request was denied. The minutes record the conflicting findings on Premise B without comment.

  **3. Report of the Governance Committee.**
  The Committee reported on voting architectures. It certified that no arrangement satisfies all desiderata simultaneously: that individual judgments be admissible, every senator carry equal weight, each question decided on votes cast on that question alone, a unanimous Senate get its way, and the resulting position be logically consistent. The Committee recommends the Chair be empowered to nominate, per agenda item, which desideratum to set aside. It noted in passing that vesting all decisions in a single person would satisfy all but one desideratum and was rejected on grounds unrelated to logic. Adopted.

  **4. New Business: Procedural Bundling.**
  To ensure consistency, the Senate adopted "bundling," by which logically connected propositions are fused into one compound resolution. Motion 24-07 was presented as a bundle: "Resolved: That enrolment has fallen, that resources should be redirected, and that $50,000 be allocated." Passed 22–18.

  Senator Haskins protested that the Senate is no longer deciding anything but merely ratifying what the drafter wrote. Haskins insisted that the Senate itself holds beliefs and not merely vote totals. The Chair corrected Haskins for a confusion about collective agency, noting that the Senate is a decision-making body, not a cognitive subject. Haskins objected that the procedure renders the Senate incapable of error only by rendering it incapable of thought. The objection went unanswered.

  **Adjourned 9:45 PM.**

  ***

  **MEMORANDUM**
  **TO:** Faculty Senate
  **FROM:** University Parliamentarian
  **RE:** Propositional Consistency

  Regarding the conflicting findings on Premise B in Items 1 and 2: This arrangement is named "Contextual Propositional Relativity." Judgments are held relative to, or exhausted by, the question then before the Senate. A factual premise is not established as universal truth but is validated only within the logical scope of the specific motion it supports. This prevents external inconsistencies from obstructing internal procedural validity. The Senate does not assert facts; it validates conditions for action. This feature ensures that the Senate may proceed efficiently regardless of empirical volatility.
