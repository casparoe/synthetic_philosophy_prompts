answer: |-
  ### Part I: Brainstorming Candidate Principles

  To arrive at a principle that respects your intuitions while resolving your theoretical tensions, I considered three competing frameworks common in social ontology. I will reject two before settling on the third.

  **Candidate 1: The Institutional Declaration Principle (Searle-inspired)**
  *Principle:* A kind is socially constructed if and only if it exists in virtue of a collective status function assignment (e.g., "X counts as Y in context C").
  *Verdict:* **Reject.**
  *Why:* This handles the US Dollar (Case 1) perfectly. However, it fails your verdicts on Race (Case 2) and Gender (Case 5). There was no specific moment where "Blackness" or "Gender" was declared into existence by a competent authority. These kinds emerged through diffuse practices, violence, and norms, not specific constitutive rules. If we adopt this, you must surrender the intuition that Race and Gender are constructed in the same robust sense as Money. That is too high a price; it renders the principle too narrow to capture the social world you want to describe.

  **Candidate 2: The Causal Looping Principle (Hacking-inspired)**
  *Principle:* A kind is socially constructed if and only if the classification of the kind interacts with the classified (looping effects). It is real if the looping stabilizes.
  *Verdict:* **Reject.**
  *Why:* This handles Gender (Case 5) and the Sillans (Case 6) well. However, it struggles with Case 7 (NRD). If NRD has a genetic basis, the "looping" is incidental to the ontology. The kind exists *regardless* of the classification once the gene is found. Furthermore, this principle struggles to distinguish the Witch (Case 3) from the Sillan (Case 6) sharply enough. Witches experienced looping effects (confessions, treatment), yet you rightly judge the kind as empty/unreal. A principle based solely on causal interaction cannot distinguish between a *real* social kind and a *false* belief system that causes real effects. We need an ontological ground, not just a causal history.

  **Candidate 3: The Principle of Ontological Grounding and Causal Stabilization**
  *Principle:*
  1.  **Construction:** A kind $K$ is socially constructed if and only if the truth conditions for "$x$ is a $K$" are grounded fundamentally in social facts (relations, attitudes, institutions) rather than intrinsic physical or biological facts.
  2.  **Reality:** A constructed kind $K$ is real if and only if (a) it is instantiated (there are actual members), and (b) the social facts grounding it are sufficiently stable to support robust counterfactuals and causal explanations independent of individual whim.

  *Verdict:* **Accept.**
  *Why:* This distinguishes the *history of the label* from the *ontology of the kind*. It allows us to say NRD (Case 7) is natural if grounded in genes, even if the label was social. It allows us to say Witches (Case 3) are unreal because the grounding condition (pact with devil) was never instantiated, whereas Sillans (Case 6) are real because the grounding condition (social identification) *was* instantiated. It preserves the reality of Race (Case 2) because the grounding condition is social treatment/identity, which is robustly instantiated.

  ---

  ### Part II: The Committed Principle

  I recommend you adopt **The Principle of Ontological Grounding and Causal Stabilization**.

  **The Principle:**
  > A kind is **socially constructed** iff membership in that kind is determined constitutively by social relations, attitudes, or institutions.
  > A constructed kind is **real** iff the social relations grounding it are instantiated and stable enough to generate objective causal patterns.

  **Defense:**
  This principle respects your hierarchy of verdicts (cases 1, 2, 5, 6, 8 are central) while forcing clarity on the edge cases (3, 7, 9, 10). It solves the "Witch vs. Sillan" problem by focusing on *instantiation* of the grounding conditions. Witches were constructed (the concept depended on social beliefs about demons) but not real (no one actually satisfied the condition of having a pact). Sillans were constructed and became real (people actually satisfied the condition of being identified and identifying as Sillan).

  It solves the "NRD" problem by separating the *classification practice* from the *kind ontology*. If the kind is grounded in a gene, it is not constructed, even if the classification was. This contradicts your worry that "whether a kind is constructed should not depend on how the science later turned out." I argue that worry is mistaken. Ontology *must* depend on what exists. If the gene exists, the kind is natural. If the gene does not exist, and the kind persists only via diagnostic convention, it is constructed. The *status* of the kind depends on the ground, not the history of the name.

  **Stipulation:**
  I stipulate that "social facts" include collective intentionality, institutional power, and normative status, but exclude brute physical facts.
  **Condition for Abandonment:**
  I would abandon this principle if it were demonstrated that *all* social facts reduce without remainder to individual psychological states or brute physical facts (eliminative materialism). If "institutions" are just fictions for individual behaviors, then *nothing* is socially constructed in the robust sense, and the distinction collapses.

  ---

  ### Part III: The Three Further Things

  #### 1. Category vs. Kind Distinction
  You asked whether construction is one thing, or if we must distinguish the construction of a *category* (the label/concept) from the construction of the *kind* (the ontology).
  **Verdict:** You **must** distinguish them. Case 7 (NRD) forces this.
  *   **The Category:** The label "Nocturnal Regulatory Deficit," the questionnaire, and the diagnostic protocol are undeniably socially constructed. They are human artifacts.
  *   **The Kind:** The cluster of humans picked out by that label. If they share a polymorphism, the *kind* is natural.
  *   **Resolution:** Your intuition that "the label was invented, the kind was discovered" is not incoherent; it is precisely the correct application of the Category/Kind distinction. You must surrender the worry that this makes construction dependent on science. It does not make *construction* dependent on science; it makes *ontological status* dependent on science. Construction is a claim about ontology. If the ontology turns out to be genetic, the claim of construction is false.

  #### 2. Verdicts on Three New Cases
  Applying the Principle of Ontological Grounding and Causal Stabilization:

  *   **Marriage:**
      *   **Constructed:** Yes. Membership is determined by institutional recognition (legal/religious vows). Two people cohabiting for 50 years are not "married" without the social fact of recognition.
      *   **Real:** Yes. It is instantiated and causally potent (tax status, next-of-kin rights, health outcomes).
  *   **Nationhood:**
      *   **Constructed:** Yes. Membership depends on borders, citizenship laws, and collective recognition (similar to Sillans).
      *   **Real:** Yes. Highly stable, causally potent (war, trade, identity).
  *   **Major Depressive Disorder (MDD):**
      *   **Constructed:** **Yes.** This is the hard case. While there are biological correlates, membership is determined by meeting DSM criteria (a social document). The *boundaries* of the kind are drawn by committee, not by a sharp biological cliff.
      *   **Real:** **Yes.** It is instantiated and causally potent (predicts suicide risk, response to therapy, disability).
      *   *Note:* MDD is likely a "hybrid kind" (biological base, social boundary), but because the *boundary* determines membership, it counts as constructed under my principle. If we found a specific "depression gene" necessary and sufficient for diagnosis, it would become a Natural Kind (like NRD).

  #### 3. Which Verdicts to Overturn
  To maintain consistency with this principle, you must surrender or modify three of your existing verdicts. Here they are in the order you should overturn them:

  1.  **Case 7 (NRD): The "Incoherence" Verdict.**
      *   *Your View:* "Whether a kind is constructed should not depend on how the science later turned out."
      *   *My Recommendation:* **Surrender this.** You must accept that if the genetic study finds a specific polymorphism, NRD is **Not Constructed**. It is a Natural Kind with a social history of discovery. If the study had come back empty, it *would* have been a Constructed Kind. Ontology tracks reality, not intention. You can keep the intuition that the *label* was constructed, but the *kind* is natural.
      *   *Reason:* To claim a kind is constructed is to make a claim about what *makes* it that kind. If genes make it that kind, it isn't constructed.

  2.  **Case 10 (Whiteness): The "Thinness" Verdict.**
      *   *Your View:* Whiteness is "thinner" than Blackness and therefore "somehow less real."
      *   *My Recommendation:* **Surrender this.** You must accept that Whiteness is **Equally Real** to Blackness.
      *   *Reason:* If Race is a social kind grounded in social relations of power and classification, Whiteness is just as robustly grounded as Blackness. It has done enormous causal work (housing, lending, violence). "Thinness" (being defined by exclusion) is a *feature* of the construction, not a deficit in reality. To deny Whiteness reality while affirming Blackness reality is ontologically inconsistent; both are grounded in the same racial structure.

  3.  **Case 9 (Biological Species): The "Untroubled" Verdict.**
      *   *Your View:* Species are discovered, not constructed, and the choice of concept "ought to bother me more than it does."
      *   *My Recommendation:* **Modify this.** You should accept that **Species Concepts are Constructed**, even if Species (the populations) are not.
      *   *Reason:* The *boundaries* you draw (how much genetic drift counts as a new species) are determined by explanatory interests (social/scientific practices). The *populations* are mind-independent. You need to feel the tension here: The *kind* (the population) is real/natural, but the *classification system* (the species concept) is constructed. This aligns with the Category/Kind distinction required by Case 7.

  ### Summary of the Trade
  You gain a unified theory that explains why Money, Race, and Sillans are real constructed kinds, while Witches are unreal constructed kinds.
  You pay for this by accepting that:
  1.  **Science dictates ontology:** If NRD is genetic, it's not constructed (Case 7).
  2.  **Symmetry of Power:** Whiteness is as real as Blackness (Case 10).
  3.  **Conceptual Humility:** We construct the maps (Species Concepts), even if the territory (Species) is natural (Case 9).

  This is the cost of a rigorous social ontology. It protects the reality of the social world (Race, Money, Gender) by refusing to blur the line between what we make and what we find.
