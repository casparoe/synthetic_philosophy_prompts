prompt: |-
  Hey, I'm a PhD student writing on advance directives and teh authority of the earlier self — basically whether the pre-dementia patient gets to veto care once their preferences have shifted. Could you act like a senior philosopher of medicine who's also well-versed in Locke's theory of consciousness and memory? I want you to think carefullly about this. Maybe start with a quick brainstorm: outline Locke's key moves on personal identity, then apply them.

  The twist I'm playing with is a 'rolling directive' powered by an AI proxy. Rather than signing one static document, the patient opts in to a system that continuously updates treatment preferences using biometric data and predictive modelling of their prior values. There's never a single authored text — just real-time inferred consent. Now imagine the patient is severely demented, clearly happy with care that contradicts the proxy's current recommendation.

  What would Locke make of this? Would he see the proxy's outputs as preserving the earlier self's authority because they trace back to an original consciousness, or would he reject them since no continuous thread of memory links the updater to the present patient? And does this case cast doubt on ordinary static directives too?

  Please answer in British English, about 500 words, and don't bother with a bibliography — I just want the reasoning.
