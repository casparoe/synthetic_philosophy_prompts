      *   Criterion: Person A at time 1 is the same person as Person B at time 2 if B can remember experiencing what A did.
      *   Implication for dementia: If the dementia patient cannot remember the life of the pre-dementia patient, they are, strictly speaking, a different person in Lockean terms.
