      Yes --> LEAF 7: Khaldunian Solidarity (Awkward commitment: Must accept that civilisation inevitably breeds the weakness that destroys it.)
      No --> LEAF 8: Polybian Rotation (Awkward commitment: Must accept that justice is merely a phase in a mechanical rotation.)

  Q9. Must the successor inheriting the system be human?
