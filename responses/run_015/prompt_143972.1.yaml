      Yes --> Q4
      No --> Q7

  Q4. Is it the same state or a similar process at a higher level of technique?
      Same State --> Q8
      Higher Level --> LEAF 2: Spiral/Compartmentalized (Awkward commitment: Must accept that political wisdom can be stored like technical knowledge.)

  Q5. What drives the transition?
      Internal Stock/Creative --> LEAF 3: Spenglerian Morphology (Awkward commitment: Must accept that great cultures are sealed organisms that cannot learn from each other.)
      External Challenge --> LEAF 4: Toynbee Challenge-Response (Awkward commitment: Must accept that suffering is a necessary stimulus for spiritual growth.)

  Q6. Is there an external frontier for renewal?
      Yes --> LEAF 5: Progress/Stage View (Awkward commitment: Must accept that material accumulation guarantees moral stability.)
      No (Closure) --> Q9

  Q7. What drives the decline?
