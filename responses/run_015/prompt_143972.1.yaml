  ROOT: Large-scale political orders have risen and collapsed; over long stretches population and stored technique have increased.

  Q1. Is the sequence of rise and fall a fixed law, or an artifact of periodisation?
      Artifact --> LEAF 1: Deflationary (Awkward commitment: Must accept that your own theory is just another narrative artifact.)
      Law --> Q2

  Q2. What is the primary unit undergoing the pattern?
      Regime/Constitution --> Q3
