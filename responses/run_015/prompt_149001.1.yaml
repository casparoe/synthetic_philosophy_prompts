          *   **Computational Irreducibility:** If prediction requires simulation, the "explanation" offers no compression. Explanation usually implies compression/understanding.
          *   **Causal Exclusion Problem:** If micro is closed, macro is epiphenomenal. If macro does work, micro isn't closed. One must give. If macro does work *distinctly*, reductionism fails.

