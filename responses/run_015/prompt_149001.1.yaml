      *   They are rejecting *Strong Emergence* (causal powers at the macro level not derivable from micro levels) in favor of *Weak Emergence* (macro patterns are surprising but fully derivable).
      *   The "Skyhook vs. Crane" metaphor comes from Daniel Dennett (*Darwin's Dangerous Idea*). Dennett actually agrees with the user mostly, but the user is taking a harder line ("no extra emergent layer that does real work").
