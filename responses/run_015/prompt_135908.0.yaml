answer: |-
  Here is the specification for an account of causation by omission, tailored to the constraints of a disciplinary hearing and the cases you provided.

  **Desiderata for an Account of Omission Causation**

  **D1 (Outcome Granularity):** The account must distinguish between the immediate physical outcome (the voided time) and the downstream normative consequence (the lost qualification), allowing liability to attach to one without necessitating the other. *Case: Gala.*

  **D2 (Overdetermination Resolution):** Where multiple omissions are individually sufficient to prevent the harm, the account must provide a principle to identify one as *the* cause, or explicitly justify joint causation without diluting responsibility to zero. *Case: Fire Door.*

  **D3 (Temporal Boundaries):** The account must specify the temporal location of an omission (onset, duration, or cessation) and determine whether causation persists after the agent loses the ability to act. *Case: Window.*

  **D4 (The Selection Filter):** The account must distinguish between background non-actors (the 1,198 students) and specific causes (the 2 assigned), stating whether this filter relies on causal structure or normative status. *Case: Seedlings.*

  **D5 (Act/Omission Symmetry Status):** The account must explicitly state whether it treats active intervention and failure to intervene as causally equivalent given identical outcomes. *Case: Router.*

  **D6 (Capacity Separation):** The account must separate knowledge and physical ability from duty, ensuring that lacking either excludes causation or blame distinctly. *Case: Exchange Student/Isolation.*

  **D7 (Normative Independence):** The account must declare whether 'cause' is a norm-free relation existing prior to duty, or whether duty is constitutive of causation, acknowledging the risk of circularity with blame. *General.*

  **Status and Incompatibilities**

  For the purpose of a disciplinary hearing, **D1, D2, D3, D4, and D6 are non-negotiable**; without them, the committee cannot assign specific blame to specific agents for specific harms. **D5 and D7 are theoretical preferences**: D5 depends on whether you view causation as physical or functional, and D7 depends on whether you prioritise metaphysical purity or practical utility.

  **Incompatibility Warning:** **D4 and D7 cannot be jointly satisfied without remainder.** If you demand Normative Independence (D7), a standard causal account (like counterfactuals) implicates all 1,200 students in the Seedlings case, violating D4. To satisfy D4, you must import normative duty into the definition of cause, thereby violating D7 and risking the circularity you identified (where "did she cause it?" collapses into "did she owe it?").

  **Evaluation of Theory Families**

  **Difference-making:** Fails D4 (implicates all 1,200) and D2 (overdetermination); survives only if norms are smuggled in to restrict the counterfactual set.
  **Process/Connection:** Denies omission causation entirely or struggles with D5 (no physical link); useful for acts but leaves the gala and seedlings unexplained.
  **Agency/Norm-first:** Satisfies D4 and D2 easily but fails D7 (circularity); makes causation dependent on the very duty the hearing seeks to establish.

  \answer{D4}
