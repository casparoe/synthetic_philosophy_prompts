      *   *Nuance:* SI is uncomputable. So no one is actually running SI on climate data. They are using it as a philosophical bludgeon. I need to point out that *nobody uses raw SI* for practical modeling.

  9.  **Final Polish:** Organize into clear headings. Ensure the "True/False/Feature" classification is explicit. Make sure the conclusion answers the specific question about the climate model. (Proceed to generate output based on this structure.)

