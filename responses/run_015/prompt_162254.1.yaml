answer: |-
  You are right to suspect that the impossibility theorem is doing less explanatory work than the literature often claims, primarily because it describes a mathematical constraint rather than a causal mechanism for the conflict. To map this disciplinedly, you have to separate the agent who constructs the score from the agent who acts on it. In the Broward case, the decision-maker the theorem is technically about is the entity setting the classification threshold, but that authority was fractured. Northpointe, the vendor, constructed the score and ensured calibration within groups, effectively locking in the relationship between the score and the observed outcome. The Broward County Pretrial Services Agency and the judges were the users who implicitly set the threshold for what constituted high risk, thereby determining the false positive and false negative rates. ProPublica acted as an auditor, imposing their own threshold post hoc to calculate error rates. The evidence each side appealed to was distinct: Northpointe relied on internal validation metrics showing that a score of 7 meant the same probability of rearrest for black and white defendants, while ProPublica relied on administrative data showing that among those who did not reoffend, black defendants were disproportionately labeled high risk. The theorem maps to this by showing that because the base rates of rearrest differed between groups in the data, Northpointe could not have satisfied ProPublica's metric without sacrificing calibration, but the theorem does not explain why Northpointe prioritized calibration in the first place.

  On your first sticking point regarding binary classification versus the ten-level decile score, the conflict is not merely an artifact of dichotomization, though ProPublica's choice of cutoff made the disparity stark. The impossibility result holds for any threshold applied to a continuous score. If a score is calibrated across groups and the base rates differ, then at any cutoff you choose to define high risk, the false positive and false negative rates will diverge across groups. A defender of the tool cannot claim the conflict disappears if you keep the score continuous, because the tool is ultimately used to make binary decisions like granting or denying bail. However, the defender can argue that by providing deciles rather than a binary label, they allow the user to select a threshold that balances these errors according to local preferences. The tension remains structural, but the decile format shifts the burden of choosing the specific trade-off from the vendor to the user. ProPublica collapsed the score to make the inequality legible to the public, but the mathematical incompatibility exists across the entire receiver operating characteristic curve, not just at the specific cut point they selected.

  Your second point about the outcome measure is where the theorem becomes technically valid but substantively hollow. The impossibility result quantifies over the joint distribution of the score and the observed outcome. In this case, the outcome is rearrest, not reoffense, and it is only observed for those released. This introduces selection bias and measurement error into the base rates that drive the theorem. If policing practices lead to higher arrest rates for black defendants independent of underlying culpability, the base rate difference is contaminated. The theorem still holds mathematically on the observed data, meaning you still cannot satisfy calibration and error rate parity simultaneously on the arrest records. However, it does not become unfalsifiable so much as it becomes moot regarding fairness. If the ground truth is corrupted, satisfying calibration simply ensures you are accurately predicting a biased process. The result survives being applied to a distribution you cannot see only in the sense that the math works on the observed variables, but it loses its normative force because satisfying the theorem's conditions on biased data codifies the bias rather than mitigating it. This suggests the episode is not a confirmation of the theory's sufficiency, but rather a demonstration that the theory is silent on the validity of the target variable.

  Regarding accuracy, the trade-off described by the theorem is independent of the classifier's strength, provided it is not perfect. A weak classifier can be calibrated, and if base rates differ, the error rate parity will still fail. However, your intuition that this is second-order to the tool's modest predictive power has merit. If the tool is barely better than chance, the social cost of the fairness trade-off is smaller because the tool is doing less harm overall, but the utility of the tool is also negligible. The COMPAS case is not an anomaly for the theory, but it highlights that the theory focuses on the distribution of errors rather than the utility of the prediction. The debate over which fairness criterion to satisfy matters less if the tool adds little value over a simple heuristic, yet the conflict persists because the stakes of the errors are high even if the prediction is weak. The theory explains why the metrics conflict, but it does not explain why anyone is using a weak tool to make high-stakes decisions in the first place.

  Finally, on the question of who chooses the criterion, the theorem is standardly read as presenting a menu of ethical options for a benevolent designer, but the episode suggests the choice is often determined by institutional power and liability shielding. Northpointe chose calibration because it is robust to threshold changes and defensible in court, effectively outsourcing the error rate disparities to the judges who set the thresholds. The theorem never anticipated this separation of design and deployment power, where the vendor satisfies one mathematical condition to avoid liability while the user inherits the consequences of the incompatible condition. Someone who believes in the results should revise their view to see the theorem not as a guide for ethical decision-making, but as a technical constraint that can be weaponized by vendors to limit their accountability. The lesson from Broward is that without governance over who sets the threshold and which metric is prioritized, the mathematical trade-off will be resolved by whoever has the most power, not the most reason, and the impossibility result merely describes the landscape in which that power struggle occurs.
