  By keeping utopia points private until after agreement, students must negotiate based on claims of potential rather than known constraints, creating friction when one side's hidden technological advantage expands the feasible set asymmetrically; this forces them to confront whether "fairness" means splitting the surplus equally or proportionally to hidden potential. However, a physical role-play cannot exactly reproduce the **monotonicity axiom over strictly convex feasible sets**, because discrete unit allocations and human psychology introduce step-functions and fairness heuristics that ignore the geometric continuity of the utopia ray intersecting a smooth frontier.

