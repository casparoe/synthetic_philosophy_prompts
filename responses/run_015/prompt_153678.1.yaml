g the first time you run it (for example, students treating fairness as equal division regardless of utopia points, or missing that the disagreement point scales the solution) and how you will handle each failure in the moment. Be frank about which mathematical feature of the Kalai-Smorodinsky solution—specifically the continuous scaling of the monotonicity constraint across convex sets—this staged negotiation cannot reproduce, and explain exactly how you will supply that missing formal rigor verbally in the final five minutes. Do not assign any advance reading, do not include bibliographies or citations, and do not reference obscure theorems by author-date. Write in American English.
