  # Activity Design: The Orbital Mining Accord

  **Course:** Upper-Level Seminar in Philosophy & Economics
  **Participants:** 14 Students (7 Pairs)
  **Duration:** 75 Minutes
  **Objective:** Experiential understanding of the Kalai-Smorodinsky (KS) bargaining solution, specifically the tension between proportional gain (KS) and equal relative sacrifice (Nash), and the role of the monotonicity axiom.

  ## I. Setup and Incentives

  **The Scenario:**
  Seven pairs of delegations (North and South) negotiate mining rights on a newly discovered asteroid. Each round represents a new geological survey revealing a different total resource pool.
  *   **Disagreement Point ($d$):** Fixed at **(10, 10)** for all rounds. If negotiations fail, both sides retain only their baseline survival reserves.
  *   **Resource Pool ($P$):** The total extractable units available to split ($x_1 + x_2 \le P$). This is public knowledge.
  *   **Utopia Points ($u$):** Determined by private "Extraction Technology" cards. This represents the maximum payoff a delegation could secure if the other received only their disagreement point.
  *   **Incentives:** Points are redeemable for classroom privileges (e.g., choosing next week's reading, 48-hour extension on an assignment, preferred seating). Points are awarded based on **Agreement Efficiency** and **Axiomatic Accuracy**.

  **Payoff Structure:**
  1.  **Agreement Bonus:** 10 points each if an agreement is reached.
  2.  **Accuracy Bonus:** 5 bonus points if the agreed split is within 2 units of the Kalai-Smorodinsky solution (calculated post-reveal).
  3.  **Disagreement Penalty:** 0 points (only the fixed 10 units remain, no privileges).

  ## II. Precise Rules of Negotiation

  1.  **Pairing:** Students are assigned to 7 tables. One student is North, one is South.
  2.  **Information Flow:**
      *   The **Resource Pool** is announced publicly at the start of each round.
      *   **Technology Cards** are dealt face-down. Each student sees only their own card.
      *   **Revelation Rule:** Students *may* show their cards to their partner during negotiation to justify claims, but the Facilitator verifies the true values only after the agreement is submitted. Bluffing is permitted but risky (if caught bluffing during verification, the Accuracy Bonus is forfeited).
  3.  **Proposal Submission:** Pairs have a fixed time per round. They must submit a single written split $(x_{North}, x_{South})$ such that $x_1 + x_2 \le Pool$.
  4.  **Verification:** After submission, the Facilitator collects the cards. The "Shift" (changes in utopia points) is revealed to the class. The KS solution is calculated on the board.
  5.  **Constraints:**
      *   No side payments between rounds.
      *   Negotiations must cease immediately when the timer ends.

  ## III. Round Parameters

  | Round | Public Pool ($P$) | North Utopia ($u_1$) | South Utopia ($u_2$) | KS Solution Target $(x_1, x_2)$ | Nash Target (Equal Surplus) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | 50 | 40 | 40 | **(25, 25)** | (25, 25) |
  | **2** | 80 | 40 (Constant) | 70 (Shifted) | **(30, 50)** | (35, 35) |
  | **3** | 100 | 40 (Constant) | 100 (Shifted) | **(30, 70)** | (40, 40) |

  *Note: Disagreement point $d=(10,10)$ for all rounds. Surplus = Pool - 20.*
  *KS Calculation Logic:* Split the surplus $(P-20)$ in proportion to utopia surpluses $(u_1-10) : (u_2-10)$.
  *   R1: Ratio 30:30 (1:1). Surplus 30. Split 15/15. Total 25/25.
  *   R2: Ratio 30:60 (1:2). Surplus 60. Split 20/40. Total 30/50.
  *   R3: Ratio 30:90 (1:3). Surplus 80. Split 20/60. Total 30/70.

