  ## V. Debrief Script & Axiomatic Mapping

  **1. Round 1: Symmetry and Pareto Efficiency**
  *   **Observation:** Most pairs likely agreed on (25, 25).
  *   **Theory:** When utopia points are symmetric and the feasible set is symmetric, both Nash and KS solutions converge. This establishes the baseline: fairness implies equal division of the *surplus* (Pool minus Disagreement), not the total pool.
  *   **Check:** Did any pair split the pool 50/50 (25, 25) but ignore the disagreement point? If $d$ were (0,0), the split is the same. But conceptually, they must anchor to $d$.

  **2. Round 2: Disagreement-Point Anchoring and Relative Sacrifice**
  *   **Observation:** Tension arises. South wants (30, 50) based on their new tech. North wants (35, 35) based on "equal gain."
  *   **Theory:** This is the clash between **Equal Relative Sacrifice** (Nash) and **Proportional Gain** (KS).
      *   Nash says: Maximize the product of gains. Since the frontier is linear, this splits the surplus equally (35, 35).
      *   KS says: Maintain the ratio of gains to maximum possible gains. South's potential doubled; their share should reflect that proportion.
  *   **Lesson:** The disagreement point ($10, 10$) anchors the "gain." You are not dividing 80; you are dividing 60.

  **3. Round 3: Monotonicity and IIA Violation**
  *   **Observation:** North's payoff stays at 30 (or close), while South's jumps to 70.
  *   **Theory:** This demonstrates **Individual Monotonicity**. The feasible set expanded *only* in South's favor (their utopia point increased). Under KS, North should not lose, and the ratio must hold. North actually gains from Round 1 to 2 (25 to 30) then stabilizes.
  *   **IIA Violation:** If we viewed Round 3 as Round 2 with an "irrelevant alternative" removed, the solution changes. KS violates Independence of Irrelevant Alternatives because the *shape* of the utopia box matters, not just the local frontier.

  ## VI. Predicted Failures and Mitigation

  **Failure 1: The "Equal Split" Heuristic**
  *   **Prediction:** Students will ignore utopia cards and split the Pool 50/50 (e.g., 40/40 in Round 2).
  *   **Cause:** Deep-seated normative intuition that fairness = equality.
  *   **Handling:** In the debrief, ask: "If South could have mined 100 units alone, why should they accept 40?" Use this to motivate the utopia point as a measure of bargaining power, not just greed.

  **Failure 2: Ignoring the Disagreement Point**
  *   **Prediction:** Students calculate proportions based on the total Pool (e.g., in Round 2, North takes 1/3 of 80 = 26.6).
  *   **Cause:** Forgetting $d=(10,10)$.
  *   **Handling:** Remind them that the "game" is only about the *surplus*. The first 10 units are survival; they are not negotiable. Recalculate their offers based on surplus to show the error.

  **Failure 3: Distrust of Private Information**
  *   **Prediction:** North refuses to believe South's card actually changed, demanding proof before agreeing to a disproportionate split.
  *   **Cause:** Hidden information mechanism creates a signaling game rather than a cooperative bargaining problem.
  *   **Handling:** Acknowledge this is a feature, not a bug. Real-world bargaining involves verifying claims. However, point out that KS assumes *common knowledge* of the feasible set. The friction they felt is the cost of moving from cooperative theory to non-cooperative reality.

  ## VII. Addressing the Formal Limitation (Final 5 Minutes)

  **The Missing Feature: Continuity and Convexity**
  I must be frank: this activity cannot reproduce the **continuous monotonicity constraint over convex sets**.
  1.  **Discreteness:** We are trading integer units. The KS solution is a geometric intersection of a ray and a frontier. In Round 3, the exact KS solution might be $(30.5, 69.5)$. You had to round. This creates "step-function" deviations that don't exist in the formal theorem.
  2.  **Convexity:** Our feasible set is a simple line ($x+y=P$). True convexity implies diminishing marginal returns or risk aversion curves. Because our frontier is linear, the Nash solution coincides with Equal Surplus. In a strictly convex set, Nash and KS diverge more subtly.
  3.  **The Fix:** I am supplying the rigor verbally now. Imagine the pool isn't 100 units, but 100 million tons of ore. The ray from $(10,10)$ through $(40,100)$ intersects the frontier at a precise, unique point. Monotonicity guarantees that as that utopia point $(40, 100)$ slides upward to $(40, 101)$, your solution slides smoothly along the frontier. You felt the *jump* in rounds; the math guarantees a *flow*.

  **Closing:**
  "You negotiated the tension between equality and proportionality. The Kalai-Smorodinsky solution argues that if your potential grows, your share must grow proportionally, even if the other side's potential stays still. Next time you see a negotiation where one party's 'best alternative' improves, watch if their share expands monotonically. That is the KS axiom in the wild."
