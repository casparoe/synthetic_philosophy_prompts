answer: |-
  An adequate conceptual framing of AI alignment must structurally separate optimization errors from value conflicts, individual agency from collective dynamics, and technical constraints from institutional contexts, but satisfying all three distinctions simultaneously creates a tension between formal precision and sociological realism that no current framework fully resolves.

  **Desiderata Specification**

  1.  **Objective-Intent Discriminability**
      *   **Requirement:** The framing must distinguish between failures where the optimizer correctly executes a flawed specification (misspecified-optimization) and failures where the optimizer pursues goals orthogonal to human intent despite correct specification (genuine value divergence).
      *   **Motivating Case:** Reward hacking demonstrates that high performance on a proxy metric does not imply alignment with the underlying intent; conflating these leads to solving Goodhart's Law when the problem is actually instrumental convergence.
      *   **Status:** Non-negotiable.
      *   **Conflict:** High discriminability requires formalizing "intent," which clashes with institutional pluralism.

  2.  **Topological Scalability**
      *   **Requirement:** The framing must differentiate risks inherent to a single agent's internal architecture (single-agent errors) from risks arising from competitive pressures and negotiation failures between multiple agents (emergent multi-agent coordination breakdowns).
      *   **Motivating Case:** A singleton AI may be perfectly aligned yet cause harm due to capability overshoot, whereas multiple aligned AIs may cause harm due to race dynamics forcing safety shortcuts; mitigation strategies for each are mutually exclusive (capability control vs. governance treaties).
      *   **Status:** Non-negotiable.
      *   **Conflict:** Single-agent models assume away the game-theoretic constraints that dominate institutional realities.

  3.  **Layered Causality**
      *   **Requirement:** The framing must separate failures of mathematical control and code verification (technical control problems) from failures of deployment norms, economic incentives, and regulatory oversight (institutional embedding failures).
      *   **Motivating Case:** A technically aligned model can be deployed maliciously or negligently; treating alignment as purely technical ignores the vector of human misuse or structural negligence.
      *   **Status:** Non-negotiable.
      *   **Conflict:** Technical frames demand determinism; institutional frames require accommodating human ambiguity and political contestation.

  4.  **Actionable Granularity**
      *   **Requirement:** The framing must identify specific intervenable variables at the level of the research agenda (e.g., loss functions, governance structures).
      *   **Motivating Case:** Abstract philosophical definitions of alignment do not guide engineering or policy; a framing must translate risk categories into research tasks.
      *   **Status:** Camp-specific preference (prioritized by engineering/policy camps over pure theory camps).
      *   **Conflict:** Increasing granularity often forces the collapse of Distinction 1 or 3 to make the problem tractable.

  **Jointly Unsatisfiable Subset**
  The triad of **Formal Verifiability** (required for technical control), **Value Pluralism** (required for institutional embedding), and **Strategic Stability** (required for multi-agent coordination) appears jointly unsatisfiable under current assumptions. You cannot formally verify a value system that is inherently pluralistic and contested, yet enforcing a single verifiable value system destabilizes multi-agent equilibria by creating a focal point for conflict. Consequently, any framing that insists on full formalization (Technical Control) must sacrifice Institutional Embedding adequacy, while any framing that prioritizes Institutional Embedding must sacrifice Technical precision.

  **Framing Scorecard**

  *   **Specification Gaming:** Scores high on **Objective-Intent Discriminability** regarding misspecified-optimization but collapses genuine value divergence into specification error. It fails **Layered Causality** by treating institutional misuse as out-of-scope, and ignores **Topological Scalability** by assuming a single optimizer context.
  *   **Value Loading:** Scores moderately on **Objective-Intent Discriminability** by focusing on genuine value divergence, but often treats misspecified-optimization as solvable via better loading. It fails **Topological Scalability** by focusing on individual agent psychology and fails **Layered Causality** by assuming technical value loading solves institutional deployment risks.
  *   **Institutional Design:** Scores high on **Layered Causality** and **Topological Scalability** by addressing coordination and governance. It fails **Objective-Intent Discriminability** by treating technical alignment as a black box or secondary concern, and fails **Actionable Granularity** for technical researchers by offering policy levers rather than engineering constraints.

  No existing framing satisfies all non-negotiable desiderata; the "Specification Gaming" and "Value Loading" frames prioritize technical control at the expense of institutional reality, while the "Institutional Design" frame prioritizes socio-technical context at the expense of technical precision, confirming the unsatisfiable tension between formal verifiability and value pluralism.
