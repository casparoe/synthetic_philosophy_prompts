  ## Facilitator's Script: The "Blame" Question

  **Student:** "In a flat voice: So on this view, there is no one to be blamed?"
  **You:** "There is no one to be *metaphysically* blamed, because there is no standing owner who deserves retribution. But there are causes and conditions to be *causally* managed. If a tree falls on a car, we do not blame the tree, but we still move the tree. If a person harms another, we do not need a soul to justify stopping them. We stop them to alter the conditions that produced the harm. Accountability is a tool for conditioning, not a verdict on a soul."
