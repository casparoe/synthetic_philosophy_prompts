  ## 20-Minute Compressed Version (Emergency Backup)

  **If the room refuses to participate or time is cut:**

  1.  **00:00 – 00:05 | The Command:** "Raise your hand if you chose to come to class today." (Most will). "Keep it up if you chose the exact thought you had when you woke up this morning." (Hands will drop).
  2.  **00:05 – 00:10 | The Confabulation:** "Write down why you came. Swap cards. Read the reason. Could this have been your reason?" (Yes). "So the reason is not unique to the 'I'."
  3.  **00:10 – 00:15 | The Relapse:** "Who is reading the card?" (Silence). "Notice the urge to answer."
  4.  **00:15 – 00:20 | Naming:** Map to Intermittence Thesis. Exit Ticket.

