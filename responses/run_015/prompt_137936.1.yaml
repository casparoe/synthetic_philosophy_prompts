prompt: |-
  I am a PhD student in philosophy writing on personal identity, and I am leading one 75-minute session of an upper-level undergraduate seminar on persons and identity: 20 students, one room with moveable chairs, a whiteboard and a projector, me as sole facilitator though I can press one volunteer into service as a helper. The students have just finished Parfit's reductionism and reacted to it in a way I find more interesting than the view itself: they can state correctly that identity is not what matters, and they feel exactly as they did before they read it. Nothing moved. They have no background in Buddhism, and several are openly allergic to anything that smells like mindfulness culture, so the session cannot open with mats, candles, closing of eyes, or the word meditation. It has to earn its strangeness in the first ten minutes by doing something rather than by announcing a thesis.

  The target I want them to run into is something I will call the intermittence thesis: for any human subject, (i) the sense that there is a single owner who has these experiences and initiates these actions is an occurrent, causally conditioned event rather than a standing structural feature of the stream; (ii) that sense has onsets and offsets the subject does not choose; (iii) when it lapses, experience does not go dark — there is still seeing, hearing, intending, and acting — but nothing in the stream is thereby left unowned or orphaned, because ownership was never a property of the stream in the first place; and (iv) nothing in the intrinsic character of an experience settles whether it is accompanied by that sense. The contrast I want them to feel is with what I will call the auditor model: the self as a standing inner subject who witnesses, owns, and commands what goes on in the stream — the thing most of them will defend within about ninety seconds of being asked whether they have one.

  A second target matters more to me than the first, and it is the one I expect to be hard to design for. The students will grant (i) through (iv) intellectually inside twenty minutes, and the auditor model will be fully back online before they leave the room. I want the session to end with that relapse felt as the interesting datum rather than as a failure of teaching — because it is the point at which the specifically Buddhist claim becomes visible: what has to cease is not a belief whose falsity one comes to see but a recurring activity of treating experience as mine and oneself as its subject, and the tradition's interest in anatta is in the cessation of that activity, not in the correctness of a metaphysical thesis. A classroom cannot produce the cessation. It can, I think, produce the relapse, and stage it so that the relapse is the thing people notice.

  Please design the session. What I need:

  A full runnable plan with materials, rules, and a timeline in five-minute blocks. One to three linked exercises, not more. No lecture at the front end, and the words anatta, the five aggregates, and the tradition's pairing of I-making with mine-making should not be uttered until the last fifteen minutes; the naming comes after the experience, not before it.

  Each exercise should be engineered so that what happens in the room is the argument, not an illustration of one I have already given. I have been toying with two devices and would rather you improve on or replace them than execute them as stated: a command test, in which students try to exercise exactly the control the auditor model attributes to them and discover that they cannot command the failure any more than they commanded its arrival; and a five-line ledger on which they write what they take themselves to be across the categories of body, feeling, perception, disposition, and awareness, then are walked through what each line can and cannot be made to do. There also has to be one moment in which the class catches itself in the act of narrating a reason for something it did not in fact have that reason for — I want them to discover the confabulation from their own first-person reports rather than to be told that people confabulate — but the mechanism has to be something I can run with index cards and no sleight of hand, it must not leave anyone feeling ridiculed, and any misdirection in it has to be fully unwound in the debrief. Small real stakes, please: a public prediction each student commits to and the aggregate result, or something better.

  Two predictable misreadings have to be blocked by design rather than by my saying so: that the view is nihilism, i.e. that nothing exists or nothing matters; and that it is just Parfit again, or just cognitive science with a foreign vocabulary. Say how the structure of the exercises makes each of these come out wrong, and give me what I should actually say to the student who asks, in a flat voice, whether on this view there is no one to be blamed.

  A debrief that maps specific moments in the session onto specific clauses of the intermittence thesis, in the order I should take them, including how to handle the student who reports zero mind-wandering and thereby becomes a local celebrity, the student who opts out of the introspective parts, and the skeptic who refuses to play.

  An honest account of what the activity cannot reproduce. I already assume it cannot produce the uprooting of the appropriative stance, only its temporary lapse, and that nothing in it shows the lapse to be revelatory rather than merely quiet; tell me what else it leaves out and what I will therefore have to assert on the tradition's behalf rather than demonstrate.

  Finally, give me a way of telling whether it worked: an exit ticket with a small number of forced options, the distribution across those options that would count as success, and the distribution that would tell me the session has backfired into nihilism or into reductionism-with-feelings. And a twenty-minute compressed version I can fall back on if the room simply refuses to participate.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**

      *   **User:** PhD student in philosophy, teaching an upper-level undergrad seminar on personal identity.
      *   **Context:** 75-minute session, 20 students, moveable chairs, whiteboard, projector. Sole facilitator (one volunteer helper allowed).
      *   **Student State:** Just finished Parfit (reductionism). They intellectually grasp "identity is not what matters" but feel unchanged ("Nothing moved"). No Buddhism background, allergic to "mindfulness culture" (no mats, candles, eyes closed, word "meditation").
      *   **Goal 1 (Intermittence Thesis):** Demonstrate that the sense of self/ownership is an occurrent, conditioned event with onsets/offsets, not a standing structural feature. Experience continues without it.
      *   **Goal 2 (The Relapse):** The session must end with the *relapse* into the "Auditor Model" (standing inner subject) being felt as the interesting datum, not a failure. This points to *anatta* as the cessation of an activity (I-making), not just a metaphysical thesis.
      *   **Constraints:**
          *   Full runnable plan (5-min blocks).
          *   1-3 linked exercises (improve on/replace "command test" and "five-line ledger").
          *   No lecture at the start.
          *   No Buddhist terminology (*anatta*, aggregates, etc.) until the last 15 mins.
          *   Must include a moment of catching confabulation (first-person, index cards, no ridicule, unwound in debrief).
          *   Must block misreadings: Nihilism (nothing exists/matters) and Parfit/CogSci redux.
          *   Must handle specific student types (zero mind-wandering, opt-out, skeptic).
          *   Must include honest account of limitations (what it *can't* do).
          *   Exit ticket (success/failure metrics).
          *   20-minute compressed backup plan.
      *   **Tone:** Philosophical, rigorous, experiential, avoiding "woo-woo."

  2.  **Deconstruct the Pedagogical Challenge:**

      *   *The Problem:* Students treat "no-self" as a proposition to agree/disagree with. They need to treat it as a phenomenological observation about the *activity* of claiming.
      *   *The Trap:* If I tell them "you are confabulating," they will resist. They need to catch themselves doing it.
      *   *The "Relapse" Goal:* This is tricky. Usually, teachers want students to *stay* in the insight. Here, the teacher wants them to *fall out* of it and notice the gravitational pull of the Auditor Model. This requires a shift from observation back to discursive reasoning.
      *   *The "Allergy":* Avoid anything that looks like therapy or spiritual practice. Keep it analytic and experimental.

  3.  **Designing the Exercises:**

      *   *Exercise 1: The Command Test (Refined).* The user suggested a command test. Let's make it about *volition onset*. Can you choose when to choose?
          *   *Idea:* "Don't think of a white bear" is too cliché. "Decide to raise your hand" is better.
          *   *Refinement:* Focus on the *urge* to act. Ask them to perform a simple action (tap pencil) but only when they feel the "command" arise spontaneously, not when they force it. Then ask them to force it. The gap between "I decided" and the neural prep is hard to show in 5 mins.
          *   *Better Idea:* **The Prediction/Confabulation Loop.** This hits the requirement for catching confabulation.
          *   *Mechanism:* Use index cards. Ask them to make a choice (A or B) based on a reason. Then reveal the choice was constrained or random, but they generated a reason anyway.
          *   *Constraint:* No sleight of hand.
          *   *Solution:* **The "Reason Generation" Task.**
              1.  Write down a preference (Tea vs. Coffee).
              2.  Write down *why*.
              3.  Swap cards.
              4.  The facilitator reveals that the *actual* reason was a random constraint (e.g., "Pick the option whose first letter matches your middle name").
              5.  Students realize their written "why" was post-hoc.
              *Critique:* This feels a bit like a psych 101 trick. Might feel manipulative.
              *Alternative:* **The "Interruption" Task.**
              1.  Engage in a focused task (counting breaths? No, too mindfulness-y. Counting syllables in a text?).
              2.  Interrupt it unexpectedly.
              3.  Ask "Who was doing that?"
              *Critique:* Too vague.
              *Let's go back to the User's "Command Test" but make it about the *sense* of ownership.*
              *Revised Exercise 1: The Volition Gap.*
              1.  Sit still.
              2.  Wait for the *impulse* to move a finger. Don't make it happen. Wait for it to happen.
              3.  Note the moment you feel "I am doing this."
              4.  Compare with just moving it.
              *Risk:* Too meditation-adjacent.
              *Let's try a Cognitive Load/Confabulation hybrid.*
              **Exercise 1: The "Choice & Reason" Protocol.**
              1.  Distribute cards. Side A: "Choose Left or Right." Side B: "Write the single decisive reason."
              2.  Constraint: They must choose within 3 seconds.
              3.  Collect cards.
              4.  Facilitator shuffles and reads a few.
              5.  **The Twist:** Before they chose, they were shown a subliminal cue? No, unethical/impossible.
              6.  **The Twist:** The facilitator assigns the choice based on seat number (Even=Left, Odd=Right) *after* they write the reason? No, that's lying.
              7.  **The Twist (Honest):** Ask them to choose. Then ask them to write the reason. Then ask them to *change* the choice. Ask if the reason changed. Usually, the reason retrofits.
              *Let's look for a stronger phenomenological hook.*
              **Exercise 1: The "Stream Interruption."**
              Focus on the *continuity* of experience vs. the *intermittence* of the "I".
              Task: Read a dense paragraph. Every 30 seconds, a bell rings. At the bell, mark: Were you "there" (self-conscious) or "gone" (absorbed)?
              *Problem:* Too subjective.
              *Let's use the User's "Ledger" idea but make it dynamic.*
              **Exercise 1: The Attribution Ledger.**
              1.  Three columns: "Happened," "I Made Happen," "Reason."
              2.  Event: A loud noise (facilitator drops book).
              3.  Event: A thought ("I'm hungry").
              4.  Event: A movement (raising hand).
              5.  Compare the "I Made Happen" checkmarks.
              *Refinement:* This is good. It highlights the inconsistency of ownership attribution.

      *   *Exercise 2: The Relapse Engine.*
          How to force the Auditor Model back online?
          Discursive debate. Once they stop observing and start *arguing*, the "I" who argues solidifies.
          So, Exercise 2 should be a debate or a defense of the findings from Exercise 1.
          *Plan:* After Exercise 1 (observation), move immediately to Exercise 2 (explanation/defense). The struggle to explain the observation *is* the relapse.

      *   *Exercise 3 (Integrated): The Confabulation Catch.*
          Needs to be specific.
          *Idea:* **The "Reason Swap."**
          1.  Students write a preference (A or B) and a reason.
          2.  They pass the card to the right.
          3.  They read the *reason* on the new card.
          4.  They must argue *for* that preference using that reason, even if it wasn't their choice.
          5.  *Debrief:* Notice how easily the "I" adopts a reason that isn't its own to defend a position it didn't take. The "owner" is fluid.
          *Wait, the prompt asks for catching themselves confabulating their **own** actions.*
          *Revised Idea:* **The "Arbitrary Anchor."**
          1.  Ask: "How many minutes do you think this session has lasted so far?" (Write it down).
          2.  Ask: "Why that number?" (Write it down).
          3.  Reveal: The room temperature is 72 degrees. (Irrelevant).
          4.  Reveal: I thought of the number 45 before I asked. (Irrelevant).
          5.  *Better:* **The "Free Choice" Illusion.**
          1.  "Think of a number between 1 and 10." Write it.
          2.  "Write why you picked that number."
          3.  Collect.
          4.  Show the distribution (usually skewed to 3 or 7).
          5.  Ask: "Did you choose the skew?"
          6.  Point: The *sense* of choice was there, the *determination* was conditioned.
          7.  *Crucial Step:* Ask them to look at their "Why." Most will say "It just came to me" or "It's my lucky number."
          8.  *The Catch:* Ask them to try to pick the *same* number again intentionally. They can't replicate the "random" generation. The "I" that chose it is gone.

      *   *Let's Synthesize a Stronger Flow:*
          1.  **Phase 1 (0-25): Phenomenological Disruption.** The "Volition Watch." Not meditation, but data logging.
          2.  **Phase 2 (25-50): The Confabulation Trap.** The "Reason Generation" task.
          3.  **Phase 3 (50-60): The Relapse.** Argument/Defense.
          4.  **Phase 4 (60-75): Mapping & Naming.** Connect to Intermittence Thesis & Buddhist terms.

      *   *Refining the Confabulation Task (Index Cards, No Sleight of Hand):*
          *   Task: "Decision Logging."
          *   Step 1: Card 1. "Make a small decision right now. (e.g., cross your legs, uncross them, shift weight). Do it."
          *   Step 2: Card 2. "Write down the exact moment you decided. Write down the reason."
          *   Step 3: Card 3. "Do the opposite."
          *   Step 4: "Write down the reason."
          *   *The Catch:* Many will write "I felt like it" for both. Or they will struggle to find a reason for the second one.
          *   *Better:* **The "Interrupted Intention."**
          1.  Ask students to form an intention to raise their hand *in the next minute*, but not until they feel a specific internal signal (an urge).
          2.  When they raise it, they mark a card: "Time" and "Reason."
          3.  Facilitator tracks the room.
          4.  *Debrief:* Compare the "Reasons." Most will be post-hoc narratives ("I felt ready," "It felt right").
          5.  *The Twist:* Ask them to do it again, but *force* it. Compare the "sense of ownership."
          6.  *Wait, I need them to catch confabulation specifically.*
          7.  **The "False Constraint" Protocol.**
          1.  Hand out cards. Top: "Choose Red or Blue." Bottom: "Why?"
          2.  Instruction: "Choose based on your genuine preference."
          3.  Collect.
          4.  Facilitator says: "Actually, I need you to switch. If you chose Red, write Blue. If Blue, write Red. Keep the *Why* exactly as it is."
          5.  Instruction: "Read your Why next to the new Color. Does it still make sense?"
          6.  *Result:* Most reasons ("I like the warmth," "It's calm") apply to both.
          7.  *Point:* The reason was not the cause of the choice. The "I" generated a reason to fit a choice, then fit the same reason to the opposite choice. The "Author" is a narrator, not a cause.
          8.  *Ethical Check:* Is this deceptive? Yes, but unwound immediately. It fits "no sleight of hand" if the unwind is clear. It creates the "small real stakes" (public prediction of coherence).

  4.  **Addressing the "Relapse" Goal:**
      *   After the card exercise, the students will feel the instability.
      *   To trigger the relapse, I need to ask them to *stabilize* it. "So, who *is* writing the reasons?"
      *   They will revert to "Me." "My brain." "My psychology."
      *   I need to highlight *that* reversion. "Notice how quickly you reached for a noun to hold the verb."

  5.  **Addressing Misreadings (Nihilism & Parfit):**
      *   *Nihilism:* The exercises show experience *continues* without the owner. It's not emptiness of experience, but emptiness of *claim*.
      *   *Parfit:* Parfit is metaphysical (identity over time). This is phenomenological (ownership right now). Parfit says "I am a bundle." This says "The 'I' is a verb happening in the bundle."

  6.  **Addressing Student Types:**
      *   *Zero Mind-Wandering:* "You are reporting high stability of the Auditor. That is a datum, not a refutation. Did you have to work to maintain it?"
      *   *Opt-Out:* "Observation of resistance is also data. What is the resistance protecting?"
      *   *Skeptic:* "You are testing the hypothesis. Good. Did the hypothesis predict your skepticism?"

  7.  **Drafting the Plan (Iterative refinement):**

      *   *Intro (0-5):* No lecture. Immediate task.
      *   *Task 1 (5-25):* The "Reason/Choice Decoupling" (The Card Swap).
      *   *Task 2 (25-45):* The "Volition Watch" (Refined Command Test).
      *   *Task 3 (45-55):* The Relapse Trigger (Debate/Explanation).
      *   *Debrief (55-75):* Mapping to Intermittence Thesis, Naming (*Anatta*), Exit Ticket.

      *Wait, I need to ensure the "Relapse" is the *end* state.*
      The prompt says: "I want the session to end with that relapse felt as the interesting datum."
      So the Debrief shouldn't resolve it back to comfort. It should name the relapse.
      Okay, so the structure is:
      1.  Disrupt the Auditor (Ex 1 & 2).
      2.  Let the Auditor return (Ex 3 - Discussion).
      3.  Point at the return (Debrief).

      *Refining the Confabulation Exercise:*
      The "Color Swap" is good. Let's make it about *action* reasons.
      "Why did you come to class today?"
      1.  Write reason.
      2.  Swap cards.
      3.  Read the reason you received.
      4.  Ask: "Could this have been your reason?"
      5.  Most will say yes.
      6.  Point: The specific "I-reason" link is loose.

      *Let's go with the "Choice/Reason Decoupling" using a trivial choice.*
      It's safer and more controlled.
      Choice: Pen up or Pen down.
      Reason: Write it.
      Swap.
      Read.
      Does it fit?
      This shows the *generality* of reasons vs. the *specificity* of the "I" claim.

      *Wait, the prompt asks for "One moment in which the class catches itself in the act of narrating a reason for something it did not in fact have that reason for."*
      The Color Swap shows reasons are interchangeable. It doesn't prove *they didn't have the reason*.
      I need a stronger confabulation.
      **The "Forced Choice" Protocol.**
      1.  Tell them: "In 30 seconds, I will ask you to raise your Left or Right hand. You must choose one."
      2.  Wait 30 seconds.
      3.  Say: "Actually, everyone raise your RIGHT hand." (Command, not choice).
      4.  Ask them to write down: "Why did you raise your hand?"
      5.  Many will write "Because I chose to" or "To participate."
      6.  Reveal: "I told you to do it. You had no choice."
      7.  *Critique:* This feels coercive/ridiculing. "You failed to follow instructions."
      8.  *Better:* **The "Subliminal" Prime (Simulated).**
      1.  Show a slide with numbers flashing.
      2.  Ask them to pick a number.
      3.  Reveal the flash was biased.
      4.  *Too much tech/setup.*
      5.  *Best Option:* **The "Retroactive Reason" Task.**
      1.  Card 1: "Perform a small action (stretch, sigh, shift seat). Do it now."
      2.  Card 2: "Write the reason you did it *before* you did it."
      3.  *Wait, they can't write before.*
      4.  Card 1: "Think of an action. Hold it in mind."
      5.  Card 2: "Write the reason."
      6.  Card 3: "Do the action."
      7.  *Debrief:* Compare the anticipation with the execution.
      8.  *Actually, the "Reason Swap" is the most robust for a classroom.*
      Let's stick to the **Color/Reason Swap** but frame it carefully.
      1.  Choose Red or Blue.
      2.  Write Reason.
      3.  Facilitator says: "Statistically, 70% of you chose Blue due to [Fake Reason X]. If you chose Blue for Reason X, stand."
      4.  (No one stands hopefully).
      5.  "Now, swap cards. Read the reason. Does it explain *your* choice?"
      6.  "Now, imagine you chose the *other* color. Does the reason still work?"
      7.  *This shows the reason is post-hoc decoration.*

      *Let's try to meet the "did not in fact have that reason" constraint more strictly.*
      **The "Arbitrary Rule" Experiment.**
      1.  Distribute cards.
      2.  Rule: "If your seat number is Even, circle 'A'. If Odd, circle 'B'. Do not tell anyone."
      3.  Task: "Write down why you chose the letter you circled."
      4.  Collect.
      5.  Read aloud: "I chose A because it looks stable." "I chose B because it's my initial."
      6.  Reveal: "Your choice was determined by your seat number."
      7.  *Result:* They confabulated a reason for a determined choice.
      8.  *Safety:* Unwind immediately. "This is not to mock you. It is to show the mechanism of 'I-making'."
      9.  *Stakes:* Public prediction. "How many of you think you will be able to tell the difference between a chosen choice and an assigned choice?" (Vote). Then run the experiment.

      *This is the one.* It meets all criteria: Index cards, no sleight of hand (the rule is real), catches confabulation, small stakes (prediction), unwound in debrief.

  8.  **Structuring the Timeline:**
      *   0-5: Entry & Prediction (Stakes).
      *   5-25: The Seat Number Experiment (Confabulation).
      *   25-45: The Volition Gap (Intermittence).
      *   45-55: The Relapse (Discussion/Defense).
      *   55-75: Debrief, Naming, Exit Ticket.

  9.  **Addressing the "Relapse" specifically:**
      *   During 45-55, ask them to explain *why* the experiment worked.
      *   They will use agent-language ("My brain tricked me," "I assumed...").
      *   I need to point out that *this explanation* is the Auditor Model rebooting.

  10. **Refining the "Nihilism/Parfit" Block:**
      *   Structure: The experiment shows *experience exists* (they saw the card, wrote the reason). It's not nihilism.
      *   Structure: Parfit asks "Am I the same person?" This asks "Is there an owner *now*?" Different category.

  11. **Exit Ticket:**
      *   Needs to measure: Did they feel the relapse? Or did they feel nihilism?
      *   Options:
          1.  "I feel like I don't exist." (Nihilism)
          2.  "I understand the argument but feel unchanged." (Parfit/Intellectual)
          3.  "I noticed myself trying to find the 'I' again after the exercise." (Success/Relapse Awareness)
          4.  "I think the experiment was flawed." (Skeptic)

  12. **Compressed Version:**
      *   Cut the Volition Gap. Focus on the Seat Number Experiment + Relapse Discussion.

  13. **Final Review against Constraints:**
      *   No "meditation," "anatta," etc. until end. (Check)
      *   No mats/candles. (Check)
      *   Confabulation caught first-person. (Check)
      *   Relapse is the datum. (Check)
      *   Handle specific student types. (Check)
      *   Honest account of limitations. (Check)

  14. **Writing the Plan:** (Self-Correction during drafting)
      *   *Correction on Seat Number:* Seat numbers might not exist or be known. Use "Row Number" or "Count off 1-2". Counting off is better. 1s = A, 2s = B.
      *   *Correction on Relapse:* Make sure the discussion *induces* the relapse. Ask: "Who is responsible for the error?" This forces the "I" back in to take blame.
      *   *Correction on Exit Ticket:* Ensure the "Success" metric aligns with the "Relapse as Datum" goal. Success = Noticing the gravitational pull of the Auditor.

  15. **Final Polish:** Check tone. Needs to be precise, philosophical, not therapeutic. Use terms like "phenomenological," "attribution," "narrative construction."

  *(Self-Correction on the "Confabulation" constraint)*: The prompt says "catches itself in the act of narrating a reason for something it did not in fact have that reason for."
  The Seat Number trick works perfectly. They *think* they chose. They write a reason. The reason is false because the choice was determined by the count-off.
  *Crucial:* I must ensure they don't feel stupid. Frame it as "The brain's narrative function is automatic."
  *Unwinding:* Must be explicit. "I assigned the choice. You generated the reason. This is the mechanism we are studying."

  *(Self-Correction on "Relapse")*: How to ensure they relapse?
  After the reveal, ask: "Okay, so who *actually* made the choice?"
  They will say "You did."
  Then ask: "But who *felt* like they made the choice?"
  They will say "Me."
  Then ask: "Is that 'Me' a fact or a feeling?"
  They will start arguing. *That argument* is the relapse. The "I" is defending its territory.
  I need to stop them *in* the argument and say "Look at what is happening right now."

  Okay, ready to write.
answer: |-
  # Session Plan: The Intermittence of Ownership

  **Course:** Persons and Identity (Upper-Level Undergraduate)
  **Topic:** The Phenomenology of Self-Ownership (Intermittence Thesis vs. Auditor Model)
  **Time:** 75 Minutes
  **Materials:** Index cards (3 per student), pens, whiteboard, projector (for timer only), a bell or distinct sound file.
  **Facilitator:** You + 1 Volunteer (to distribute/collect cards).

  ---

  ## Part 1: The Setup & Stakes (00:00 – 00:10)

  **00:00 – 00:05 | Entry & Prediction**
  *   **Action:** As students enter, chairs are arranged in a large circle (or two concentric circles). No podium. You stand among them.
  *   **Handout:** One index card per student.
  *   **Instruction (Verbal):** "Do not write your name. On the front, write a prediction: *'If I am asked to make a free choice in this room today, I will be able to distinguish it from a choice that was determined for me.'* Mark True or False."
  *   **Action:** Collect these cards immediately into a pile (Volunteer helps). Place the pile visibly on a table.
  *   **Facilitator Note:** This creates the "small real stakes." They have committed to the reliability of their own sense of agency.

  **00:05 – 00:10 | The Constraint**
  *   **Instruction:** "Take a new card. We are going to run a quick decision protocol. I will give you an instruction that sounds like a choice. It is not a choice. Follow the instruction exactly. Do not discuss it."
  *   **Instruction:** "Count off silently to yourself, starting from the door, 1, 2, 1, 2... If you are a **1**, circle the letter **A** on your card. If you are a **2**, circle the letter **B**."
  *   **Instruction:** "On the back of that same card, write one sentence answering this question: *'Why did I choose that letter?'*"
  *   **Action:** Give them 60 seconds. Collect the cards into a *separate* pile from the predictions.

  ---

  ## Part 2: The Confabulation Catch (00:10 – 00:30)

  **00:10 – 00:20 | The Reveal**
  *   **Action:** Shuffle the second pile (Choice/Reason cards). Read 3-4 aloud.
      *   *Example:* "I chose A because it looks more stable."
      *   *Example:* "I chose B because it's the second letter of my name."
  *   **Instruction:** "Look at the card in your hand. Did you choose that letter?"
  *   *(Most will nod or say yes.)*
  *   **Facilitator:** "You did not. Your letter was determined by your seat position and my count-off instruction. You had no agency in that selection."
  *   **Instruction:** "Now look at the reason you wrote. Did you have that reason *before* you circled the letter?"
  *   *(Pause. Let the silence sit.)*
  *   **Facilitator:** "You generated a cause for an effect that already had a cause. You narrated ownership over an event you did not initiate."

  **00:20 – 00:30 | Phenomenological Mapping (Intermittence Thesis i & iv)**
  *   **Whiteboard:** Draw two columns: **Event** | **Sense of Ownership**.
  *   **Instruction:** "We are not debating whether you *should* have known. We are observing what happened. In the moment you wrote the reason, did it *feel* like you were the author?"
  *   **Action:** Poll the room. (Show of hands).
  *   **Facilitator:** "The feeling was present. The causal power was absent. This suggests the feeling of ownership is not a reliable indicator of causal control. It is an occurrent event that can attach to things you did not do."
  *   **Key Move:** Do not let them defend themselves yet. Keep it descriptive. "We are logging data, not assigning blame."

  ---

  ## Part 3: The Volition Gap (00:30 – 00:50)

  **00:30 – 00:40 | The Command Test (Intermittence Thesis ii & iii)**
  *   **Instruction:** "New card. We are testing the 'Auditor Model'—the idea that there is a standing subject who commands actions."
  *   **Task:** "I want you to lift your index finger. But do not decide to do it. Wait until you feel the *impulse* arise on its own. When the impulse arises, let the finger move. Mark the time on your card."
  *   **Task 2:** "Now, do it again. But this time, *force* it. Command your hand to move."
  *   **Instruction:** "On the card, note the difference in the 'texture' of the action. Was the 'I' present in both? Or only in the second?"
  *   **Debrief:** "In the first case, the action happened without a commander. In the second, the commander appeared. This suggests the commander is optional, not structural."

  **00:40 – 00:50 | The Relapse Engine**
  *   **Instruction:** "Turn to the person next to you. You have 5 minutes. Explain to them *who* or *what* generated the impulse in the first test. If it wasn't 'you,' what was it?"
  *   **Observation:** Listen to the conversations. They will struggle. They will reach for nouns ("My brain," "My subconscious," "The environment"). They will reify the "I" to explain the lack of "I."
  *   **Facilitator Note:** This is the critical moment. The discomfort they feel trying to explain the experience *without* an agent is the Auditor Model rebooting. They are trying to find a new owner for the ownerless event.

  ---

  ## Part 4: Naming & The Relapse Debrief (00:50 – 01:10)

  **00:50 – 01:00 | The Intermittence Thesis**
  *   **Whiteboard:** Write the four clauses of the Intermittence Thesis (from your prompt).
  *   **Mapping:**
      *   Point to the **Confabulation Exercise**: "This demonstrates Clause (iv): Nothing in the experience settled whether it was accompanied by the sense of ownership. You felt ownership over a determined event."
      *   Point to the **Volition Gap**: "This demonstrates Clause (i) and (ii): The sense of ownership had an onset and offset. It was not standing."
      *   Point to the **Experience Continuing**: "When you waited for the impulse, did experience go dark? No. Seeing and hearing continued. Clause (iii)."

  **01:00 – 01:05 | Blocking Misreadings (Nihilism & Parfit)**
  *   **Nihilism Block:** "Did the experience stop when the 'I' stopped? No. The world was still here. This is not a claim that nothing exists. It is a claim that *appropriation* is an event, not a fact."
  *   **Parfit Block:** "Parfit argues about identity over time (am I the same person tomorrow?). We are arguing about ownership right now (is there an owner of this thought?). Parfit reduces the *person*. This view reduces the *claim*."
  *   **The "Blame" Question:** (Prepare for the student who asks: "So no one is to be blamed?")
      *   **Response:** "Blame is a social technology, not a metaphysical fact. We punish the virus to stop the infection, not because the virus is 'evil.' We hold persons accountable to condition future behavior, not because there is a metaphysical subject who deserves pain. The question is not 'Who deserves blame?' but 'What conditions stop the harm?'"

  **01:05 – 01:10 | The Relapse as Datum (Anatta)**
  *   **Instruction:** "During the discussion with your partner, did you feel a pressure to find a 'thing' that caused the impulse? Did you feel uncomfortable saying 'It just happened'?"
  *   **Naming:** "In the tradition this comes from, this pressure is called *upadana* (clinging). The doctrine is *anatta* (not-self). But notice: *Anatta* is not the conclusion you just reached. *Anatta* is the practice of noticing when you try to reach that conclusion and solidify it."
  *   **The Point:** "The session is ending. You are likely already feeling your 'self' return to manage your exit, pack your bag, and evaluate this class. That return is not a failure. That return is the datum. The work is not to kill the Auditor. It is to notice when it clocks in."

  ---

  ## Part 5: Exit Ticket (01:10 – 01:15)

  **Distribution:** Half-sheet of paper.
  **Prompt:** "Select the statement that best describes your current state:"
  1.  **Nihilism:** "I feel like I don't exist or that nothing matters."
  2.  **Reductionism:** "I understand the argument intellectually, but I feel exactly the same as before class." (The Parfit Trap)
  3.  **Relapse Awareness:** "I noticed myself trying to find a 'self' to hold the experience during the discussion." (Success)
  4.  **Skepticism:** "I believe the experiment was flawed or the conclusion is wrong."

  **Success Metric:**
  *   **Target:** >50% in Option 3.
  *   **Acceptable:** >30% in Option 3, <10% in Option 1.
  *   **Failure:** >40% in Option 1 (Nihilism) OR >80% in Option 2 (Parfit/Intellectual only).
  *   **Backfire:** If Option 1 is high, you framed the cessation of ownership as a loss of existence rather than a loss of a specific *claim*.

  ---

  ## Contingencies & Student Types

  **1. The "Zero Mind-Wandering" Student (High Stability)**
  *   *Report:* "I felt in control the whole time."
  *   *Response:* "That is a valuable datum. It suggests high stability in your appropriation mechanism. Did you have to exert effort to maintain that stability? If so, who was exerting the effort?" (Pushes them to see the *work* of the Auditor).

  **2. The Opt-Out (Refuses Introspection)**
  *   *Report:* "I'm not doing this. It's nonsense."
  *   *Response:* "Noting your resistance is data. What is the risk in looking? Does the resistance feel like it comes from 'you'?" (Validates without forcing).

  **3. The Skeptic (Challenges the Confabulation)**
  *   *Report:* "I knew you made me pick the letter."
  *   *Response:* "Then why did you write a reason? If you knew it was determined, the reason should have been 'Because the professor told me.' If you wrote anything else, the narrative engine overrode the knowledge."

  ---

  ## Honest Account of Limitations

  **What this session cannot do:**
  1.  **Uproot the Stance:** It produces a temporary lapse, not a permanent cessation. The "Auditor" will return strongly as they walk out the door.
  2.  **Prove Soteriological Value:** It cannot demonstrate that living without the Auditor is *better* (less suffering, more ethical). It only shows the Auditor is *intermittent*. You must assert on the tradition's behalf that the cessation of appropriation correlates with the cessation of suffering; the class can only show the intermittence.
  3.  **Distinguish Quietism from Insight:** A quiet mind is not necessarily an insight into *anatta*. It might just be relaxation. You must assert that the *recognition* of the mechanism is what matters, not the quiet itself.

  **What you must assert:**
  *   "The tradition claims that seeing this mechanism *changes* how it runs. We cannot verify that today. We can only verify that the mechanism exists."

