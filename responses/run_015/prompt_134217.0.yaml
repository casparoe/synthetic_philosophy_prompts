answer: |-
  Good morning. It is a privilege to welcome you to this workshop on institutional failure. Looking around this room, I see a necessary tension. On one side, we have scholars of collective action who understand the deep logic of coordination problems. On the other, we have urban-policy managers who live inside those problems every day. Usually, when these two groups meet, the goal is to figure out how to get people to do *more*. How do we incentivize compliance? How do we secure participation? How do we overcome apathy?

  Today, I want to invert that assumption. I want to suggest that in many of our most critical systems, the threat is not that actors will withhold effort, but that they will exert too much of it.

  We are all familiar with the tragedy of the commons. It is the paradigmatic failure mode of the twentieth century: rational actors, pursuing individual gain, deplete a shared resource. The solution, theoretically, is to align incentives so that everyone contributes their fair share. But there is a shadow inverse to this tragedy, a failure mode I call **cooperative exhaustion**.

  In cooperative exhaustion, competing actors race to *over-contribute* to a shared system. They do not deplete the resource through extraction; they collapse the system through saturation.

  For the policy managers in the room, consider the reality of your work. You do not suffer from a lack of safety protocols; you suffer from having three overlapping sets of them that contradict one another. You do not lack data infrastructure; you have parallel databases built by different departments that cannot speak to each other. You do not lack carbon-credit registries; you have so many competing standards that the market itself has frozen.

  For the philosophers in the room, consider the structure. This is a multipolar trap where the Nash equilibrium is not defection, but hyper-cooperation. Every stakeholder, acting in good faith and under distinct mandates, pours resources, rules, and oversight into the commons. The system's absorptive capacity—the ability of the institution to process and utilize these inputs—is exceeded. The result is not a barren commons, but a choked one.

  The danger here is that our standard toolkit for fixing institutional failure is designed for scarcity, not congestion. When we see a system struggling, our instinct is to apply the usual remedies: transparency, binding commitments, and hierarchical coordination. In the context of cooperative exhaustion, these remedies do not cure the disease; they accelerate it.

  Consider transparency. In a standard collective action problem, shining a light on free-riders shames them into contributing. But in a system suffering from cooperative exhaustion, transparency reveals the "gap" between current effort and ideal safety. It signals to every well-meaning actor that *more* is needed. Transparency becomes an accelerant, prompting a fresh wave of redundant interventions.

  Consider binding commitment devices. We use these to ensure follow-through. But when the problem is too much follow-through on incompatible tracks, locking actors into their current course prevents the necessary pruning. It calcifies the redundancy.

  Consider hierarchical coordination. When a system is bloated, adding a central authority to manage the bloating often adds another layer of metabolic cost. It is an attempt to solve congestion by building a wider road, which only invites more traffic.

  If the standard virtues of institutional design—transparency, commitment, coordination—are exacerbating the collapse, we are left with a difficult normative question. What is the ethical obligation of the actor in this context?

  I propose a counter-intuitive claim: In contexts of cooperative exhaustion, strategic restraint is not merely permissible; it is ethically obligatory.

  This is a hard pill to swallow. We are trained to view inaction as negligence. We are trained to view the free-rider as a villain. But if the system is collapsing under the weight of good intentions, the actor who steps back is not free-riding. They are preserving the structural integrity of the commons.

  To the managers: I know this sounds dangerous. Telling a public servant to *not* implement a safety protocol feels like malpractice. But if that protocol duplicates an existing one and creates administrative friction that slows down emergency response, implementing it is the true malpractice.

  To the philosophers: This requires a shift in how we model virtue. We must move from an ethics of maximization to an ethics of optimization. We must recognize a form of public-spiritedness that looks, from the outside, like withdrawal. It is the discipline of asking not "How much can I add?" but "How much can the system bear?"

  This workshop aims to bridge the gap between the logic of this trap and the reality of managing it. We need the philosophers to help us articulate the logic of restraint, to provide the vocabulary that allows a manager to say "no" without being labeled incompetent. We need the managers to show us where the friction points are, where the absorptive capacity has already been breached.

  We are here to learn how to stop saving the world to death.

  I will leave you with this image. We often fear the bridge that collapses because too many vehicles drive across it. That is the tragedy of the commons. But there is another kind of collapse. Imagine a bridge that fails not because of traffic, but because too many engineers, fearing the bridge is weak, simultaneously reinforce different sections. One strengthens the cables, another thickens the deck, a third adds support pillars. They do not coordinate their standards. They do not pause to calculate the load distribution. They simply build. And the bridge collapses under the weight of the reinforcements themselves.

  Let us spend the next two days ensuring we are not the engineers bringing down the bridge. Thank you.
