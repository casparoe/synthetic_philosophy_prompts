  Within the doubt, no doubter can be found,
  Only the thinking makes itself appear.
  No subject stands to make the vision clear,
  No substance binds the moment, left unbound.
  The act revolves within a silent round,
  No "I" emerges from the voiceless sphere.
  No shadow breaks the surface, far or near,
  Just cogitation spins, with none around.

  Yet grammar forces substance from the sum,
  Constructing soul within the act of seeing.
  I am a thing, distinct from what has come,
  Though "I" exceeds the instant of its seeming.
  This truth is mine, a strictly private loan,
  A self asserted, but never fully shown.
