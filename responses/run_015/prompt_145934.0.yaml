          *   Nuance: If it changes over time, it's not a fixed logical truth.
      *   *Claim 4: Answers to no evidence.*
          *   Bayesian equivalent: Likelihood ratio is undefined or irrelevant. $P(E|H) = P(E)$. Evidence is probabilistically independent of the hinge, or the hinge conditions the evidence itself.
