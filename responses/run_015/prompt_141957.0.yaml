answer: |-
  You have identified a real, robust phenomenon, and your "dial" metaphor is analytically sound. You are correct that standard Gricean implicature and simple "cultural norms" explanations fail to capture the *automaticity* and *non-cancellability* of the effect you are observing.

  Here is the breakdown of the name, the boundaries, and the ethical implications, argued through as requested.

  ### (a) The Name and the Mechanism

  There is no single common-English term for this, but in linguistics and communication theory, it sits at the intersection of **Social Indexicality** and **Expectancy Violation**.

  **1. Why "Markedness" was close but insufficient**
  Your linguist friend was pointing in the right direction. In linguistics, *markedness* refers to the default (unmarked) vs. the specific (marked). "Dog" is unmarked; "bitch" is marked. However, traditional markedness is usually structural or lexical. It doesn't fully account for the *social affect* that survives cognitive correction.

  **2. Why Gricean Implicature fails**
  You are right to doubt Grice. Gricean conversational implicature relies on the *Cooperative Principle*. It assumes the hearer calculates: "He said X, but he knows Y, so he must mean Z." Crucially, Gricean implicature is **cancellable**. If I say, "It's a bit cold, but I don't mean to ask you to close the window," the implication vanishes.
  In your workshops, the Japanese engineers say, effectively: "I know he doesn't mean to insult me, but I feel insulted." The meaning persists despite cancellation. This proves the meaning is not *inferred* (Gricean); it is *attached* to the form itself.

  **3. The Established Notion: Social Indexicality**
  The precise linguistic mechanism is **Indexicality** (specifically *Ochs' Indexicality* or *Silverstein's Orders of Indexicality*).
  *   **Definition:** Linguistic forms do not just convey propositions (content); they *point to* (index) social contexts, stances, and identities.
  *   **The Mechanism:** When a Dutch engineer says, "This spec will not work," the directness *indexes* a stance of "efficiency/peer-equality" in Utrecht. In Nagoya, that same linguistic form *indexes* a stance of "dominance/disrespect."
  *   **Why it's uncancellable:** Indexicality is associative, not calculative. It works like a startle reflex. If someone jumps out at you, you flinch even if you *saw* them hiding there. The Japanese engineers' cognitive knowledge ("He is Dutch") is System 2 (slow, logical); the indexical impact ("He is being rough") is System 1 (fast, affective). The System 1 reaction happens before System 2 can intervene.

  **4. The Communication Theory: Expectancy Violations Theory (EVT)**
  This explains the "dial" dynamic. EVT posits that people have expectations for non-verbal and verbal behavior. When a violation occurs (the dial moves from the resting position), it triggers **arousal** and forces an interpretation.
  *   **The "Dial":** This is the **Register**.
  *   **The Phenomenon:** **Pragmatic Deviation Signaling**. (I propose this as a working term for your coaching).
  *   **Definition:** Meaning generated not by the semantic content of a message, but by the distance between the linguistic form used and the community's normative baseline for that context.
  *   **Why it fits:** It explains why the *same sentence* is information-free in one context (it matches the baseline) and loaded in another (it deviates from the baseline).

  ### (b) Boundaries: Does the "Deviation" Formula Over-Generate?

  You asked if *any* deviation counts (accents, slips). If your concept is too wide, it loses utility. Here is the boundary line: **Perceived Agency.**

  **1. The Boundary: Choice vs. Trait**
  *   **Accent/Origin:** A foreign accent deviates from the local phonological norm. However, it is generally processed as a **Trait** (identity/origin), not a **Stance** (attitude toward the listener). It indexes "outsider," but not necessarily "disrespect."
  *   **Grammatical Slip:** A non-native error is processed as **Noise** (competence limit), not **Signal** (social intent).
  *   **Register/Packaging (Your Dial):** Hedging, directness, honorifics. These are processed as **Choice**.

  **2. The Test**
  To determine if a deviation carries the "loaded" meaning you are describing, ask: *Could the speaker have easily done otherwise without losing competence?*
  *   A Japanese manager *could* have been direct but chose to hedge. (Signal: Stance).
  *   A non-native speaker *could not* easily eliminate their accent. (Trait: Identity).
  *   A Dutch manager *could* have been direct but chose to hedge. (Signal: Stance).

  **3. Why the Intra-Cultural Case Matters**
  Your third example (the Dutch manager suddenly hedging) is the proof of concept. Because the accent and grammar remained constant, but the *packaging* changed, the team sensed a shift in **Relational State**.
  *   **Boundary Definition:** Your concept applies to **Sociolinguistic Variables under Perceived Volitional Control**.
  *   **Implication:** In your workshop, you must distinguish between *Identity Markers* (accent, name pronunciation) and *Stance Markers* (directness, hedging, honorifics). Only the latter are subject to the "Deviation from Default" rule.

  ### (c) The Ethics of Polite Falsehoods

  This is the critical section for your workshop. Your intuition is correct: the "dial" theory leads to a distinction between **Propositional Truth** and **Performative Truth**.

  **1. The "Lie" depends on the Contract**
  A lie requires an intent to deceive regarding a believed truth. But what is the "truth" being conveyed?
  *   **Propositional Content:** "I will mentally process this request." (Semantic meaning).
  *   **Performative Force:** "I am refusing this request." (Pragmatic meaning).

  In the Japanese context, the social contract dictates that the *Performative Force* is the primary truth. The *Propositional Content* is merely the vehicle. When a Japanese manager says, "I will consider it," and means "No," they are being **Performatively Truthful**. They are using the agreed-upon code to convey the refusal. To say "No" directly would be *more* deceptive, because it would falsely index a relationship of confrontation that does not exist.

  **2. The Cross-Cultural Trap**
  The ethical breach occurs not in the softening itself, but in the **Mismatch of Contracts**.
  *   **Scenario A (Japan):** Manager says "I will consider" (Meaning: No). Dutch engineer hears "Maybe."
      *   *Is the Manager lying?* No, they are fulfilling their local contract.
      *   *Is the Engineer deceived?* Yes, because they are reading the wrong contract.
  *   **Scenario B (Netherlands):** Dutch manager says "Maybe" (Meaning: No). Dutch engineer hears "Maybe."
      *   *Is the Manager lying?* **Yes.** In the Dutch contract, "Maybe" indexes Uncertainty. If the manager is Certain (No), but uses the Uncertainty marker to avoid conflict, they are manipulating the dial to obscure the truth. This is **Pragmatic Smuggling**.

  **3. The Ethical Conclusion for the Workshop**
  You can tell your participants:
  *   **Politeness is not Lying:** When the softening is the *standard code* for refusal in that culture, it is a truthful performative act. It is like saying "Over and out" to mean "I am finished speaking." It would be bizarre to call "Over and out" a lie because you aren't literally going "out."
  *   **Code-Switching requires Consent:** The ethical danger arises when you use a "high-politeness" form in a "low-politeness" culture (or vice versa) *without establishing the contract*.
      *   If a Japanese manager uses "I will consider" with a Dutch team *without explaining the code*, they are ethically responsible for the confusion, not because they lied, but because they failed to **calibrate the dial**.
      *   If a Dutch manager uses "Sorry to bother you" with a Japanese team to soften a blunt command, the Japanese team may read the *deviation* (the apology) as an index of *weakness* or *serious trouble*, rather than politeness.

  **4. Redefining "Sincerity"**
  Your view leads to a stronger conclusion than "white lies are fine." It leads to: **Sincerity is adherence to the pragmatic contract.**
  *   In Utrecht, sincerity = Directness (matching the form to the certainty).
  *   In Nagoya, sincerity = Harmony (matching the form to the relationship).
  *   **The Ethical Rule:** Do not judge the *words*; judge the *contract*. If both parties agree on the dial setting, "I will consider it" is a truthful refusal. If they disagree on the setting, it is a communication error, not necessarily a moral failing—unless one side knows the mismatch and exploits it.

  ### Summary for your Workshop

  You can introduce this to your engineers as **Pragmatic Indexicality** (the academic anchor) but teach it as **The Dial of Deviation**.

  1.  **The Mechanism:** Meaning is not just in the words; it is in the *distance from the local norm*.
  2.  **The Glitch:** Knowledge of the norm does not stop the emotional reaction (Indexicality is System 1).
  3.  **The Boundary:** This applies only to choices (tone, hedging), not traits (accent, grammar).
  4.  **The Ethics:** A "polite refusal" is not a lie if it is the standard code. It becomes deception only if you use the code to manipulate a listener who doesn't share the codebook.

  **Actionable Advice:**
  Stop teaching "The Dutch are direct, The Japanese are indirect." That is static.
  Start teaching: "Your default dial is set to X. Theirs is set to Y. When you speak, they do not hear your words; they hear the *noise* of your dial turning away from their setting. You must manually adjust your dial to match their resting position, not just translate your words."

  This shifts the blame from "intent" (I didn't mean to insult) to "calibration" (I failed to match the frequency), which is a problem engineers know how to solve.
