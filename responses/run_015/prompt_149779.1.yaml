answer: |-
  # Teaching Plan: Pragmatic Encroachment vs. Epistemic Contextualism
  **Session Duration:** 90 Minutes
  **Target Audience:** Political Theory Students (Rawls/Foucault background, no Epistemology)
  **Core Scenario:** Dr. Aris Thorne (Climate Researcher) & The Permafrost Data

  ## I. Scenario Architecture: Carrying & Excluded Features
  To ensure the concepts emerge distinctly, the scenario must be engineered to isolate epistemic variables from institutional noise.

  **Features the Scenario MUST Have:**
  1.  **Fixed Evidence Vector:** Thorne's data, statistical confidence (e.g., 92%), and methodological rigor must remain *identical* in both settings. This prevents students from attributing the shift in "knowledge" to new information.
  2.  **Truth Stability:** The proposition ("The methane loop is accelerating") must be *true* in the scenario's reality. This prevents the discussion from collapsing into a debate about false belief or lying.
  3.  **Distinct Attributors:** The "knowledge" claim must be evaluated by different agents (The Panel Chair vs. The Lead Journalist) to allow for Contextualism (speaker-relative standards) to take hold.
  4.  **Actionable Consequences:** Both settings must involve a decision based on the claim (Resource allocation vs. Headline placement) to activate Pragmatic Encroachment (subject-relative stakes).

  **Features the Scenario MUST Lack:**
  1.  **Moral Valence:** Thorne's character must be neutral. Do not make her a hero or a villain. If students judge her *virtue*, they will conflate moral responsibility with epistemic justification.
  2.  **Evidence Degradation:** Do not suggest the data is "shakier" in one setting. The only variable is the *environment of assessment*.
  3.  **Obvious Falsehood:** Do not hint that the data is actually wrong. If the data is false, she doesn't know it in *any* context, which kills the exercise.

  ---

  ## II. Sequential Architecture (90 Minutes)

  ### Phase 1: Fixing the Epistemic Base (00:00 – 00:15)
  **Goal:** Establish the invariant evidence to prevent "evidence shifting" explanations later.
  1.  **Present the Data:** Describe Thorne's findings. 92% confidence interval. Mechanism understood. Not yet peer-reviewed (the only deficit).
  2.  **Establish Truth:** Stipulate explicitly: *"In the reality of this scenario, the permafrost is accelerating. Thorne's data is correct."*
  3.  **Define the Question:** We are not asking "What should she do?" (Normative/Policy). We are asking "Is it *true* to say she **knows**?" (Epistemic).
  4.  **Interception Point (Misconception: Evidence Shifting):** If a student suggests, "Well, maybe she knows it in the media because the evidence is good enough for TV," stop them. Remind them: *The evidence is identical. Why does the truth of 'she knows' change?*

  ### Phase 2: Generating the Intuitions (00:15 – 00:35)
  **Goal:** Elicit the conflicting intuitions that both theories must explain.
  1.  **Setting A (Government Panel):** High stakes (billions in infrastructure). Formal protocol.
      *   *Ask:* "The Chair asks: 'Dr. Thorne, do you **know** this is happening?' She says 'Yes.' Is the Chair right to reject this claim?"
      *   *Expected Intuition:* She does *not* know. 92% isn't enough for policy.
  2.  **Setting B (Journalists):** Mediated stakes (public credibility). Informal protocol.
      *   *Ask:* "A Reporter asks: 'Do you **know** this is happening?' She says 'Yes.' Is the Reporter right to print this?"
      *   *Expected Intuition:* She *does* know. 92% is sufficient for public awareness.
  3.  **The Problem:** "Same evidence. Same truth. Different knowledge status. Why?"

  ### Phase 3: The Competing Models (00:35 – 00:55)
  **Goal:** Introduce PE and EC as rival explanations for the Phase 2 data.
  1.  **Model 1: Pragmatic Encroachment (PE).**
      *   *Definition:* Knowledge depends on the **subject's** practical stakes.
      *   *Application:* In Setting A, the cost of being wrong is high (wasted billions). This raises the threshold for knowledge. In Setting B, the cost is lower (correction in tomorrow's paper). Threshold lowers.
      *   *Key Phrase:* "Stakes change the *state* of the knower."
  2.  **Model 2: Epistemic Contextualism (EC).**
      *   *Definition:* Knowledge depends on the **attributor's** conversational standards. The word "knows" is indexical (like "tall" or "flat").
      *   *Application:* In Setting A, the Panel sets a "High Standard" context (policy certainty). In Setting B, Journalists set a "Low Standard" context (plausible reporting).
      *   *Key Phrase:* "Context changes the *meaning* of the word 'knows'."
  3.  **Interception Point (Misconception: Relativism):**
      *   *Risk:* Students will hear EC and think "Truth is relative to power/discourse" (Foucaultian regime of truth).
      *   *Correction:* Explicitly state: *"Contextualism is not relativism about facts. The methane is accelerating regardless. It is semantic contextualism about the word 'knows,' similar to how 'tall' means different things for a jockey vs. a basketball player. It is not about political power constructing reality."*

  ### Phase 4: The Divergence Test (The Wedge) (00:55 – 01:15)
  **Goal:** Force the theories apart. If they explain Phase 2 identically, they are synonyms. We need a case where they predict different outcomes.
  1.  **Introduce Variation:** "The Skeptical Editor."
      *   *Scenario:* Thorne speaks to Journalists (Setting B).
      *   *Stakes:* **Low.** (Thorne is retired; no policy depends on this; no career risk).
      *   *Conversational Standards:* **High.** (The Editor is a science purist who demands peer-review before using the word 'know' in print).
  2.  **The Test:** "The Editor says: 'You don't *know* this yet.' Is the Editor correct?"
  3.  **Prediction Split:**
      *   **PE Prediction:** She **Knows**. (Stakes are low for her, so the threshold is low).
      *   **EC Prediction:** She **Does Not Know**. (The conversational context demands high standards, so 'knows' means something stricter here).
  4.  **Discussion:** Ask students which prediction aligns with their intuition. This forces them to choose a side based on whether they think *stakes* or *conversation* drives the knowledge relation.

  ### Phase 5: Misconception Sweep & Assessment (01:15 – 01:30)
  **Goal:** Consolidate distinctions and test understanding.
  1.  **Interception Point (Misconception: Stakes = Context):**
      *   *Risk:* Students argue the Editor's high standards *are* a form of stake.
      *   *Correction:* Distinguish *Practical Cost* (PE) from *Semantic Precision* (EC). "The Editor isn't risking money (Stake); he is risking semantic accuracy (Context)."
  2.  **Check-for-Understanding Question:**
      *   *"Dr. Thorne is in a Low-Stakes situation (no career risk), but she is speaking to a High-Standard Attributor (demands 99% certainty). According to Pragmatic Encroachment, does she know? According to Contextualism, does she know? Explain why the answers differ."*
      *   *Correct Answer:* PE = Yes (Stakes low); EC = No (Standards high).

  ---

  ## III. Formal Apparatus to Explicitly Refuse
  To maintain focus on institutional/policy reasoning and avoid analytic rabbit holes, you must explicitly **exclude** the following at the start of Phase 3:

  1.  **Modal Tracking Conditions (Safety/Sensitivity):** Do not introduce possible world semantics (e.g., "In nearby worlds where she believes P, is P true?"). This distracts political theorists into metaphysics rather than institutional norms.
  2.  **Invariantist Semantics:** Do not discuss "Subject-Sensitive Invariantism" as a technical label. Stick to "Pragmatic Encroachment." The technical debate about whether 'knows' is invariant is less relevant than the *practical* implication of stakes.
  3.  **Kaplanian Indexicality:** Do not teach the formal semantics of context-dependence. Use the analogy of "tall" or "flat" instead. The mechanism matters less than the *effect* on attribution.

  ## IV. Rationale for Pedagogical Choices

  **1. Why the "Skeptical Editor" Wedge is Necessary:**
  Without Phase 4, PE and EC are observationally equivalent for your students. In the original two settings (Gov vs. Media), Stakes and Standards covary (High/High vs. Low/Low). Students will inevitably collapse them into "Institutional Rigor." The Wedge forces a choice: does the *risk* matter (PE) or does the *dictionary* matter (EC)? This is the only way to satisfy your requirement that they emerge as competing explanations.

  **2. Why Intercept Relativism in Phase 3:**
  Political theory students are trained to view truth claims as exercises of power (Foucault). If you introduce Contextualism without guarding against this, they will interpret EC as "The Panel has the power to define truth." You must preempt this by framing EC as a *linguistic* constraint, not a *political* one. The Panel doesn't make the knowledge false; they change the definition of the word used to describe it.

  **3. Why Exclude Modal Apparatus:**
  Your students think in terms of institutions and norms, not possible worlds. Introducing "safety conditions" will alienate them and shift the debate to metaphysics. By keeping the language on "thresholds," "standards," and "costs," you keep the epistemology legible within their existing theoretical framework (normative evaluation of institutions).

  **4. Why the Check-for-Understanding Question is Structured This Way:**
  A standard definition question ("What is contextualism?") allows for rote memorization. A divergence question ("Why do the answers differ?") tests whether they grasp the *mechanism* of the theory. If they answer "Yes" for both, they have collapsed the concepts. If they answer "No" for both, they haven't grasped the variables. They must identify the specific variable (Stakes vs. Standards) that drives the verdict.
