answer: |-
  This is a precise and painful observation. You have identified a failure mode that standard business theory often glosses over because it requires shifting from a model of *agency* (what a firm decides) to a model of *ecology* (which firms remain).

  Here is the carving you asked for, in the order of your questions.

  ### 1. Is there an established concept?

  You are right to reject "Race to the Bottom" and "Moloch." Those are *game-theoretic* models. They assume the players remain at the table and change their strategies. Your observation is *evolutionary*: the players who hold the "good" strategy are removed from the table entirely.

  There are two established concepts that come close, but both have edges that do not quite fit your wood.

  **A. Gresham's Law ("Bad money drives out good")**
  *   **How it works:** This applies when two forms of currency have the same face value but different intrinsic values (e.g., gold vs. debased coin). People spend the bad money and hoard the good money. The bad money circulates; the good money disappears from circulation.
  *   **Where it fits:** It captures the "disappearance of the better option."
  *   **Where it stops:** Gresham's Law relies on *legal tender laws* or fixed exchange rates. The "bad" and "good" are forced to be treated as equal by an external authority. In your trade, there is no law forcing a retailer to treat particleboard as equal to hardwood; they simply prefer the price. The mechanism is market pressure, not legal fiat.

  **B. Adverse Selection (Akerlof's "Market for Lemons")**
  *   **How it works:** This is the insurance example your friend gave. Sellers know the quality of the product; buyers do not. Because buyers can't tell the difference, they offer an average price. High-quality sellers cannot make a profit at the average price, so they exit the market. The average quality drops, the price drops further, and more sellers exit.
  *   **Where it fits:** It describes high-quality providers exiting because the market price does not support their cost structure.
  *   **Where it stops:** Adverse Selection usually hinges on *information asymmetry* (the buyer can't see the quality). In your case (a) and (b), the buyers *know* the quality is worse. They accept it because they are price-constrained themselves. The driver is not hidden information; it is solvency pressure.

  **The Closest Established Field: Organizational Ecology**
  There is a branch of sociology and economics called Organizational Ecology (Hannan & Freeman) that studies populations of firms. They distinguish between *adaptation* (a firm changing its strategy) and *selection* (firms with certain strategies surviving while others die).
  Your observation is a classic **Selection-Driven Decline**. The environment (retail price pressure) selects for a trait (low cost/low quality). Firms with the trait (high quality/high cost) suffer higher mortality rates. The population average degrades not because firms mutated, but because the high-quality organisms went extinct.

  ### 2. If there is no name, give me one.

  Since "Adverse Selection" implies hidden information and "Gresham's Law" implies fixed value, I propose you call this **Attritional Convergence**.

  **Definition:**
  Attritional Convergence occurs when a market standard degrades not because active participants choose a lower standard over a higher one, but because participants maintaining the higher standard are systematically eliminated from the population due to viability constraints.

  **The Boundary Cases:**
  To distinguish this from the ordinary "Race to the Bottom" (Prisoner's Dilemma), apply the **Solvency Test**:

  *   **Ordinary Race to the Bottom (Choice):** A firm *could* remain solvent while maintaining the high standard, but it would make *less profit* than if it lowered the standard. The firm chooses lower quality to maximize gain.
      *   *Remedy:* Change the incentives (contracts, penalties).
  *   **Attritional Convergence (Attrition):** A firm *cannot* remain solvent while maintaining the high standard at the prevailing market price. The firm lowers quality (or exits) to avoid bankruptcy.
      *   *Remedy:* Change the viability conditions (price floors, niche protection).

  **Your Case:** In your example (b), the members who complied went out of business. They failed the Solvency Test. This is Attritional Convergence. If they had stayed in business but made less money, it would have been a Race to the Bottom.

  ### 3. Is the distinction real, or is it cosmetic?

  The distinction is **real**, and treating it as cosmetic is dangerous.

  In game theory (the "choice" model), the system is in equilibrium because no player *wants* to move. If you bind them (contract), you change the payoff matrix, and they will happily comply because it is now in their interest to do so.

  In evolutionary selection (the "attrition" model), the system is in equilibrium because the players who *would* want to move are dead. If you bind the survivors, you are asking them to sign a death warrant. They cannot comply, not because they are greedy, but because the physics of their cash flow does not allow it.

  **Why it matters for you:**
  If you treat Attritional Convergence as a Prisoner's Dilemma, you will try to solve it with **agreements** (like your attempt in case b). This will fail. You are asking solvent firms to become insolvent for the greater good. No amount of moral suasion works against bankruptcy.

  If you treat it as Selection, you realize you cannot fix this by talking to the firms. You must change the **environment** that is doing the selecting. You cannot convince the wolf to stop eating sheep by asking the sheep to sign a pact; you must build a fence or kill the wolf.

  ### 4. What follows from it? (Interventions)

  Because the mechanism is selection, interventions must target *viability*, not *incentives*. You cannot solve this with "just don't do it" or "let's all agree." You have to alter the conditions under which survival is granted.

  Here are the three viable responses to Attritional Convergence, ranked by feasibility for a small workshop:

  **A. Niche Isolation (Escape the Selection Pressure)**
  If the general market selects for low cost, you must move to a market segment where the selection criterion is different.
  *   *The Logic:* You cannot win a cost war against firms that have already sacrificed the quality you value. They are fitter for *that* environment. You must find an environment where your trait (solid hardwood) is the fitness advantage.
  *   *The Action:* Stop bidding on contracts where the primary variable is price. Move to direct-to-consumer, bespoke, or restoration work where the customer is buying the *method* as much as the object. You are not selling furniture; you are selling "not particleboard." This creates a new selection pool where your workshop is the fitter organism.

  **B. Coercive Standardization (Raise the Floor)**
  In your example (a), the industry shifted because it was *allowed* to shift. Attritional Convergence can be halted by regulation that makes the "cheaper" way illegal or impossible.
  *   *The Logic:* If the "low quality" option is removed from the board, the selection pressure reverts to the next variable (e.g., design, service) rather than cost of materials.
  *   *The Action:* This is hard for a small player alone. It requires trade association lobbying for regulations (e.g., labeling laws, durability standards, safety codes) that increase the cost of the "cheap" method disproportionately. If particleboard requires specific fire retardants or labeling that eats its margin advantage, the selection pressure eases. This is not a "gentlemen's agreement"; it is a rule that binds the survivors to a cost structure that allows quality to survive.

  **C. Vertical Integration (Control the Selector)**
  In your example (c), the "selector" is the customer calling in a slow week. The selection pressure is "empty bench vs. bad job."
  *   *The Logic:* You cannot resist selection pressure if you are dependent on the selector.
  *   *The Action:* Reduce dependency on spot-market customers. Move to a model where you control the flow. This might mean holding inventory of standard high-quality pieces (selling what you want to make, not making what they ask for) or securing retainer contracts with clients who value the specific quality. You must insulate the workshop from the immediate pressure of "cash now or die," which is the engine of the attrition.

  **Summary for your decision:**
  You are not facing a moral failure of your competitors, nor a coordination failure of your association. You are facing an **ecological filter**.

  *   Do not try to restart the agreement in (b). It asks survivors to commit suicide.
  *   Do not expect the industry in (a) to return. The firms that would do it are gone.
  *   Do not blame the phone-taker in (c). They are responding to the immediate threat of an empty bench.

  Your only viable path is **Niche Isolation**. You must position your workshop in a part of the market where "solid hardwood" is not a cost disadvantage, but a prerequisite for entry. You cannot save the industry standard. You can only save your own workshop by leaving the environment that is selecting against it.
