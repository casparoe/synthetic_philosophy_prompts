  2. **Cartesian separation:** While foundational, this inference is weaker because it relies on naive clear-and-distinct perception without the machinery to handle necessary a posteriori truths.
  3. **Kripke's table-ice case:** This is a poor guide since Kripke explicitly uses it as a counterexample to show that conceivability often masks metaphysical impossibility regarding origin essentialism.
  4. **The 'double-blind modal mirror':** This is the weakest guide because its indirect meta-modeling adds unnecessary epistemic distance and lacks established warrant compared to direct conceptual analysis.

  The failure of **Chalmers' zombie move (3)** is most likely just hidden conceptual confusion rather than real impossibility, as proponents argue that physicalists who deem zombies impossible are conflating epistemic gaps in explanation with ontological gaps in reality.
