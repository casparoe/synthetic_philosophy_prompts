prompt: |-
  I'm part of a small team writing the conduct code and the internal risk metric for a development organization that operates in roughly thirty countries, and we have got as far as discovering that the word corruption appears in every section of the draft and is defined in none of them. Before we look at any of the standard definitions on offer, I want the specification: what would a working definition of corruption have to deliver to count as adequate for our particular purpose — a code that a country director and a field officer have to apply on a Tuesday, and a risk score we then publish about the places we work — with the case or consideration behind each requirement. I would like the cases, not just the labels: the phenomenon or hypothetical it has to handle, the distinctions it must not collapse (corruption versus clientelism versus patronage versus rent-seeking versus state capture versus ordinary theft; corrupt act versus corrupt official versus corrupt system; the need case versus the greed case), and the findings from anthropology and economics it is not allowed to contradict — that gift exchange frequently constitutes a relationship rather than distorting a pre-existing one, that enforcement is itself politically selective, that in some settings side payments move goods faster rather than slower.

  Several requirements keep being presented to me as mandatory, and I suspect they are a mix of genuine desiderata and the prejudices of whichever camp is speaking: that corruption requires a public office, so a kickback to a purchasing manager inside a private firm is fraud but not corruption; that it requires an identifiable quid pro quo; that the gain must be private, whatever we then say about the official who steers contracts to her own ethnic group or her party and takes nothing herself; that there must be a loser, which seems to fall apart on the payment that buys a service the citizen was already owed, or the one that gets a nurse to turn up; that the standard must be identical in every country we operate in, which one of my colleagues says simply smuggles in the assumption that arm's-length impartial administration is the neutral baseline rather than one local ideal among others; and that whatever we end up with must be provable enough to dismiss or prosecute someone on. A different colleague has proposed a shortcut she calls the sunlight test — an act is corrupt just in case the people involved would not be willing to have it entered in a public register — and I do not think it survives contact with an official who would be delighted to publicise a patron's gift, or with a disclosed, budgeted, lawful fee for faster inspections, or with a practice the whole district knows about and approves of. I would also like to know whether the list has to cover corruption with no corruptible human in the loop at all: a procurement model whose training data encodes a decade of favouritism, or a vendor selected because he is somebody's cousin, where no individual exercised a discretion that anyone can point to.

  So: sort the requirements I have listed into the ones that are non-negotiable and the ones that are a camp's preferences, add the ones I have missed, and give me the case behind each. Two things matter most to me. First, whether some subset of the desiderata cannot be jointly satisfied — I have a suspicion that demanding courtroom-grade provability and demanding sensitivity to systemic or institutional corruption pull in opposite directions, and that demanding one cross-national standard and demanding something our own staff find legitimate and enforceable do too, but tell me if the real conflict is elsewhere, because if the list is jointly unsatisfiable that is itself the answer I should bring back to the team. Second, which single requirement does the most work in excluding candidate definitions. You can score the two or three usual families of definition in a line or two each at the end if it helps, but the criteria are the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Context:** Small team writing a Code of Conduct and Internal Risk Metric for a development org operating in ~30 countries.
      *   **Problem:** The word "corruption" is everywhere in the draft but defined nowhere.
      *   **Goal:** Define the *specification* for a working definition of corruption. What must it *deliver* to be adequate for two specific use cases:
          1.  Operational guidance (Country Director/Field Officer applying it on a Tuesday).
          2.  Risk scoring (Publishing risk scores about operating locations).
      *   **Constraints/Requirements:**
          *   Must handle specific distinctions (corruption vs. clientelism vs. patronage vs. rent-seeking vs. state capture vs. theft; act vs. official vs. system; need vs. greed).
          *   Must not contradict findings from anthropology/economics (gift exchange as relationship, selective enforcement, side payments speeding things up).
          *   Must evaluate "mandatory" requirements provided by colleagues (public office, quid pro quo, private gain, loser, universal standard, provability, sunlight test).
          *   Must address algorithmic/structural corruption (no human in the loop).
          *   **Deliverable 1:** Sort requirements into Non-Negotiable vs. Camp Preferences with cases behind each.
          *   **Deliverable 2:** Identify missing requirements.
          *   **Deliverable 3:** Analyze joint satisfiability (are the desiderata contradictory?).
          *   **Deliverable 4:** Identify the single requirement that does the most work in excluding candidate definitions.
          *   **Deliverable 5:** Briefly score usual definition families (optional but helpful).
      *   **Tone:** Analytical, precise, pragmatic, acknowledging complexity (anthropological/economic nuance), avoiding moralizing.

  2.  **Deconstruct the "Mandatory" Requirements:**

      *   *Public Office:* (Legalistic view). *Case:* Distinguishes public trust from private fraud. *Counter-case:* Private sector corruption impacts public goals (development org context).
      *   *Quid Pro Quo:* (Transactional view). *Case:* Clear evidence. *Counter-case:* Systemic corruption lacks explicit deals; gift economies blur this.
      *   *Private Gain:* (Motivation view). *Case:* Distinguishes from incompetence. *Counter-case:* Political gain, group gain (nepotism) without personal pocketing.
      *   *Must be a Loser:* (Harm view). *Case:* Defines victimhood. *Counter-case:* "Grease payments" where everyone wins short-term (nurse shows up), but system degrades long-term.
      *   *Identical Standard Everywhere:* (Universalist view). *Case:* Consistency, brand protection. *Counter-case:* Imperialism, ignores local legitimacy, impractical for field staff.
      *   *Courtroom Provability:* (Legal view). *Case:* Safety, fairness. *Counter-case:* Impossible for systemic risk scoring, stifles reporting.
      *   *Sunlight Test:* (Reputational view). *Case:* Intuitive. *Counter-case:* Cultural variance, shameless actors, lawful but shady acts.

  3.  **Determine Non-Negotiables vs. Preferences:**

      *   *Context is Key:* This is a *development organization*. Their goal is effective aid/development. Corruption undermines this.
      *   *Use Case 1 (Field Officer):* Needs actionability. If they can't decide, the definition fails.
      *   *Use Case 2 (Risk Metric):* Needs comparability across 30 countries.
      *   *Non-Negotiable:* Actionability, Consistency (for risk), Alignment with Org Mission (development effectiveness), Safety (for staff).
      *   *Preferences:* Legalistic precision (public office), Universal moral standard (identical everywhere), High evidentiary bar (courtroom).

  4.  **Identify Missing Requirements:**

      *   *Temporal Dimension:* Short-term gain vs. Long-term institutional decay.
      *   *Power Asymmetry:* Who has the choice? (Coercion vs. Agency).
      *   *Mission Alignment:* Does it hinder the development goal?
      *   *Whistleblower Safety:* Can staff report without risk?

  5.  **Analyze Joint Satisfiability (The Conflict):**

      *   *The Big Tension:* "Courtroom Provability" vs. "Systemic Sensitivity" vs. "Field Actionability."
      *   You cannot have a definition strict enough for prosecution *and* broad enough to capture systemic risk *and* simple enough for a Tuesday morning decision.
      *   *Resolution:* You likely need *two* definitions or a tiered approach (Conduct Code = strict/provable; Risk Metric = broad/probabilistic). The prompt asks for *a* definition, but the analysis must highlight this fracture.
      *   *Another Tension:* "Universal Standard" vs. "Local Legitimacy." If you impose a universal standard, field staff may view it as illegitimate. If you localize too much, risk scoring becomes impossible.

  6.  **Identify the "Kingmaker" Requirement:**

      *   Which one kills the most candidates?
      *   Is it "Public Office"? No, too easy to expand.
      *   Is it "Quid Pro Quo"? Kills systemic definitions.
      *   Is it "Actionability"? This is the strongest. If a field officer can't use it, it's useless.
      *   *Decision:* **Actionability/Decidability.** A definition that requires legal proof or deep anthropological study fails the "Tuesday" test.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. Validate the tension.
      *   *Section 1: Sorting Requirements.* Group into Non-Negotiable (Functional) vs. Preferences (Ideological/Legalistic). Provide the "Case" for each as requested.
      *   *Section 2: Missing Requirements.* Add the ones derived from the specific context (Development Org, Risk Metric).
      *   *Section 3: Joint Satisfiability.* Address the "Impossible Trinity" of Prosecution, Systemic Risk, and Field Simplicity.
      *   *Section 4: The Single Exclusionary Requirement.* Pinpoint Actionability.
      *   *Section 5: Scoring Definitions.* Briefly touch on Legalistic, Functionalist, and Public-Interest models.

      *(Self-Correction during drafting)*: I need to be careful not to just say "it's impossible." The user wants to know *if* it's impossible. I should argue that a *single* definition cannot serve both the Conduct Code (disciplinary) and the Risk Metric (analytical). They have different epistemic requirements. I must highlight this divergence.

      *(Refining the Anthropology/Economics constraint)*: The prompt specifically mentions gift exchange and "grease payments." The definition must distinguish between *relationship maintenance* (social capital) and *undue influence* (distorting allocation). The "Mission Harm" criterion is crucial here.

      *(Refining the "Public Office" debate)*: For a development org, private sector corruption (vendors) matters as much as public. So "Public Office" is a preference, not a non-negotiable.

      *(Refining the "Universal Standard")*: This is tricky. For a Risk Metric, you need comparability (universal). For Conduct, you need local legitimacy. I will classify "Identical Standard" as a Preference that conflicts with Field Actionability.

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   Did I cover the distinctions (clientelism, etc.)? Yes, in the criteria.
      *   Did I cover the anthropology (gift exchange)? Yes, in the criteria.
      *   Did I cover the algorithmic corruption? Yes, in missing requirements.
      *   Did I answer the two "most important" things? (Joint satisfiability + Single requirement).

  9.  **Final Output Structure:**
      1.  Executive Summary (The Core Tension).
      2.  Specification of Requirements (Non-Negotiable vs. Preferences).
      3.  Missing Requirements (The Gaps).
      4.  Analysis of Joint Satisfiability (The "Impossible Trinity").
      5.  The Single Exclusionary Requirement.
      6.  Brief Scoring of Definition Families.

      *(Self-Correction on Tone)*: Keep it professional, dense, and direct. Avoid fluff. The user is an expert or near-expert.

      *(Final check on the "Tuesday" test)*: Ensure the "Actionability" argument centers on the cognitive load of the field officer.

      *(Final check on "Risk Score")*: Ensure the "Comparability" argument centers on the need to rank 30 countries.

      Let's write.
answer: |-
  This specification requires you to resolve a fundamental tension: you are attempting to build a single conceptual tool that must function as both a **disciplinary rule** (Code of Conduct) and an **analytical lens** (Risk Metric). These have different epistemic requirements. The former requires certainty to punish; the latter requires sensitivity to measure.

  Below is the specification of requirements for your definition, sorted by necessity, followed by the analysis of their joint satisfiability and the single constraint that will eliminate the most candidates.

  ### I. Specification of Requirements

  #### A. Non-Negotiable Requirements (Functional Desiderata)
  *These are required for the definition to function within your specific organizational context (30 countries, development mission, field application).*

  1.  **Operational Decidability (The "Tuesday" Test)**
      *   **Requirement:** A field officer must be able to classify an interaction as corrupt or non-corrupt within the timeframe of a decision, without requiring legal counsel or anthropological fieldwork.
      *   **Case:** If the definition requires deep investigation into intent or systemic history to apply, field staff will ignore it or freeze. A Code of Conduct is a heuristic device, not a treatise. It must reduce cognitive load, not increase it.
  2.  **Comparability (The "Risk Score" Test)**
      *   **Requirement:** The definition must yield data that can be aggregated across thirty distinct legal and cultural jurisdictions to produce a coherent risk metric.
      *   **Case:** If the definition allows for too much local relativism (e.g., "corruption is what the local community says it is"), you cannot produce a global risk map. You need a common denominator to rank countries, even if the manifestation differs.
  3.  **Mission Alignment (The "Development" Test)**
      *   **Requirement:** The definition must identify acts that degrade the organization's specific development outcomes (e.g., aid diversion, exclusion of beneficiaries, institutional weakening).
      *   **Case:** In development economics, some "corrupt" acts (like grease payments to get medicine delivered) have positive short-term utility but negative long-term institutional effects. A definition based solely on "harm to a victim" fails here; the harm is often to the *system* that delivers the aid. The definition must capture institutional decay, not just individual loss.
  4.  **Safety and Non-Retaliation**
      *   **Requirement:** Applying the definition must not expose the staff member or the beneficiary to physical or legal risk.
      *   **Case:** In high-risk environments, a definition that mandates reporting every "quid pro quo" may get a local partner killed. The definition must allow for a distinction between *identifying* risk (for the metric) and *prosecuting* acts (for the code).

  #### B. Camp Preferences (Ideological or Legalistic Desiderata)
  *These are often presented as mandatory but are actually choices between competing frameworks. You must choose one, knowing it excludes other valid perspectives.*

  1.  **The "Public Office" Requirement**
      *   **Status:** **Preference (Legalistic Camp).**
      *   **Case for Exclusion:** Limiting corruption to public officials excludes private-sector vendor fraud, NGO subcontractor kickbacks, and algorithmic bias in private procurement. For a development org, a private vendor stealing funds is functionally identical to a public official doing so.
      *   **Case for Inclusion:** It aligns with most national penal codes, making legal prosecution easier.
  2.  **The "Quid Pro Quo" Requirement**
      *   **Status:** **Preference (Transactional Camp).**
      *   **Case for Exclusion:** This collapses systemic corruption. It cannot handle *state capture* (where the rules themselves are written for private gain) or *nepotism* (where the exchange is implicit/long-term). It also contradicts anthropological findings on gift exchange, where the "quo" is relationship maintenance, not a specific transaction.
      *   **Case for Inclusion:** It provides a clear evidentiary line for disciplinary hearings.
  3.  **The "Private Gain" Requirement**
      *   **Status:** **Preference (Motivation Camp).**
      *   **Case for Exclusion:** It fails to capture *political corruption* (steering contracts to a party) or *ethnic clientelism* (hiring a cousin to support the clan) where the actor gains status or group security but no personal cash.
      *   **Case for Inclusion:** It distinguishes corruption from incompetence or bureaucratic bloat.
  4.  **The "Identical Standard" Requirement**
      *   **Status:** **Preference (Universalist Camp).**
      *   **Case for Exclusion:** As your colleague noted, this smuggles in Weberian bureaucracy as the neutral baseline. It risks labeling legitimate local reciprocity networks as corrupt, alienating field staff and partners.
      *   **Case for Inclusion:** Essential for the Risk Metric. Without a universal standard, you cannot compare Country A to Country B.
  5.  **The "Courtroom Provability" Requirement**
      *   **Status:** **Preference (Compliance Camp).**
      *   **Case for Exclusion:** This is incompatible with the Risk Metric. You cannot score systemic risk based only on what is provable in court. It also creates a perverse incentive to define corruption so narrowly that almost nothing qualifies.
      *   **Case for Inclusion:** Essential for the Code of Conduct if the penalty is dismissal or prosecution.
  6.  **The "Sunlight Test"**
      *   **Status:** **Preference (Reputational Camp).**
      *   **Case for Exclusion:** It fails in contexts where corruption is normalized (everyone knows, no one cares) or where the corrupt actor is proud (patronage as virtue). It also fails for "lawful corruption" (legal fees for fast-tracking).
      *   **Case for Inclusion:** It is a useful heuristic for Western donors and public relations.

  #### C. Missing Requirements (The Gaps)
  *These are not currently on your list but are necessary to handle the phenomena you described.*

  1.  **The Discretion Criterion**
      *   **Specification:** The definition must identify the *abuse of discretionary power*.
      *   **Case:** This handles the "algorithmic corruption" and "cousin hiring" scenarios. If a procurement model selects a vendor based on biased training data, discretion was exercised by the designer or the data selector. If a rule *mandates* hiring a cousin (legal nepotism), there is no discretion, and thus no corruption under this definition, only bad policy. This distinguishes *corrupt acts* from *corrupt laws*.
  2.  **The Temporal Horizon**
      *   **Specification:** The definition must distinguish between short-term efficiency and long-term institutional integrity.
      *   **Case:** This handles the "nurse who needs a bribe to show up" case. The bribe solves the immediate problem (need case) but degrades the salary system (system case). A working definition must flag this as corrupt *even if* the immediate outcome is positive, to prevent the risk metric from rewarding "efficient corruption."
  3.  **The Coercion Asymmetry**
      *   **Specification:** The definition must distinguish between *active bribery* (offering) and *extortion* (demanding).
      *   **Case:** For a Code of Conduct, a field officer paying a bribe under duress to save a project is morally distinct from one offering a bribe to gain an unfair advantage. A single definition that treats them identically will be rejected by staff as unjust.

  ### II. Analysis of Joint Satisfiability

  You suspected that some desiderata cannot be jointly satisfied. **You are correct.** There is an "Impossible Trinity" in your requirements:

  1.  **Courtroom Provability** (High evidentiary bar)
  2.  **Systemic Sensitivity** (Capturing culture, algorithms, state capture)
  3.  **Field Actionability** (Simple enough for a Tuesday decision)

  **The Conflict:**
  *   To capture **Systemic Sensitivity** (anthropological nuance, algorithmic bias, state capture), you need a complex, contextual definition.
  *   To achieve **Courtroom Provability**, you need a narrow, binary definition (did X give Y to Z?).
  *   To achieve **Field Actionability**, you need a simple heuristic.

  **The Verdict:**
  You cannot satisfy all three with a *single* definition.
  *   If you prioritize **Provability**, you lose **Systemic Sensitivity** (you will miss the algorithmic bias and the cultural patronage).
  *   If you prioritize **Systemic Sensitivity**, you lose **Actionability** (field officers cannot diagnose state capture on a Tuesday).
  *   If you prioritize **Actionability**, you lose **Provability** (simple heuristics are easy to dispute in a dismissal hearing).

  **Recommendation:** You need **two definitions** linked by a common principle.
  1.  **For the Risk Metric:** A broad, probabilistic definition that captures systemic risk, algorithmic bias, and "efficient corruption." It does not need to be provable, only observable.
  2.  **For the Code of Conduct:** A narrow, behavioral definition focused on *abuse of discretion for undue advantage*. It must be provable enough to justify dismissal.

  If you insist on one definition, you must sacrifice **Courtroom Provability**. You cannot build a risk metric on a legal standard of proof. It is better to have a Code of Conduct that relies on "preponderance of evidence" and a Risk Metric that relies on "indicators" than to force the Risk Metric to meet legal standards.

  ### III. The Single Exclusionary Requirement

  The single requirement that does the most work in excluding candidate definitions is **Operational Decidability (The "Tuesday" Test).**

  **Why:**
  Most academic and legal definitions of corruption fail this test.
  *   **The "Public Interest" Definition** (Corruption is harm to the public good): Fails because a field officer cannot calculate the net public good of a specific transaction on site.
  *   **The "Systemic" Definition** (Corruption is deviation from institutional norms): Fails because the officer cannot determine if the norm is legitimate or captured without deep research.
  *   **The "Legalistic" Definition** (Corruption is violation of statute): Fails because in 30 countries, the officer cannot know every statute, and local statutes may legitimize corruption (lawful state capture).

  **The Winner:**
  The definition that survives this filter is usually a variant of **Abuse of Discretion for Undue Advantage.**
  *   *Did the actor have a choice?* (Handles algorithms/coercion).
  *   *Did they use it to bypass a rule or norm?* (Handles quid pro quo and systemic).
  *   *Did they gain an advantage (personal, group, or project) not available to others?* (Handles private gain and need/greed).

  This is the only framework simple enough for a Tuesday, broad enough for a risk score (if aggregated), and robust enough to cover private/public sectors.

  ### IV. Scoring Definition Families

  Based on the specification above, here is how the usual families score:

  1.  **Public-Office-Centric (Legalistic):**
      *   *Score:* **Fail.** Excludes private vendors and algorithms. Fails the "Development Mission" test. High on Provability, low on Systemic Sensitivity.
  2.  **Public-Interest-Centric (Functionalist):**
      *   *Score:* **Mixed.** Good for Risk Metric (captures harm), terrible for Code of Conduct (too vague for dismissal). Fails the "Tuesday" test.
  3.  **Market-Centric (Rent-Seeking):**
      *   *Score:* **Pass.** Defines corruption as distorting market competition. Handles private/public equally. Good for Risk Metric. Weak on "Need" cases (survival bribes) unless "undue advantage" is carefully defined.
  4.  **Abuse-of-Discretion (Hybrid):**
      *   *Score:* **Best Fit.** Handles the algorithm (discretion in coding), the cousin (discretion in hiring), and the bribe (discretion in approval). Requires a clear policy on what constitutes "undue" to satisfy the Universal Standard requirement.

  **Final Instruction to Team:**
  Do not search for a definition that satisfies the lawyers *and* the anthropologists *and* the field staff simultaneously. It does not exist. Adopt the **Abuse of Discretion** framework for the Code (prioritizing Decidability and Safety) and a **Systemic Integrity** framework for the Risk Metric (prioritizing Mission Alignment and Comparability), and explicitly acknowledge the gap between them in your documentation.
