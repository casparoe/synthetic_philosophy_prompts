  Here is a pedagogical plan for the scene. It prioritizes conceptual accuracy over dramatic flair, ensuring the decision theory holds up under scrutiny while remaining grounded in the characters' dynamic.

  ### 1. The Prerequisites: What Must Be Established First
  Before the word "updateless" can land, the Lawyer needs to accept three premises that her legal training will initially resist. The Postdoc must secure these agreements before introducing the theory.

  *   **Policy vs. Act:** She must distinguish between a *single action* (signing this contract now) and a *policy* (being the kind of client who honors contracts). In law, these are often separate; in UDT, the action *is* the instantiation of the policy.
  *   **Logical Correlation vs. Causal Influence:** She understands causality (A causes B). She understands evidence (A implies B). She does *not* yet accept that her decision can be *logically correlated* with a past event without causing it. The Postdoc must establish that two similar reasoning processes (her brain now, the Predictor's brain then) will output the same result, creating a link that isn't physical causation.
  *   **The "Time" of Decision:** She believes the decision happens *now*, when she has the information. The Postdoc must convince her that the *effective* decision happened *before* the information was received, because that's when the policy was selected.

  **Where Precommitment Carries Her:**
  Use her legal intuition. A contract signed *before* a trial binds you regardless of how the evidence looks during the trial. She understands that binding yourself early yields better outcomes than deciding ad hoc. This is the bridge.

  **Where Precommitment Breaks:**
  She will argue: "But I didn't sign a contract. I'm free to choose now."
  The Postdoc must break this by saying: "In this scenario, *you* are the contract. Your reasoning process is the binding agent. You can't sign it now because the other party already checked for your signature yesterday."

  ### 2. The Case: "The Favor Insurance" (Domesticated Counterfactual Mugging)
  Do not use Newcomb's Problem (boxes) or Smoking Lesion (genes). They feel like puzzles. Do not use a purely "small human" coordination game (like meeting for dinner); that fails to capture the *updateless* tension because there's no predictor to create the logical link.

  You need a scenario where a past benefit was granted *conditional on a future choice* that hasn't happened yet, mediated by prediction.

  **The Setup:**
  Use the cards to model a **"Favor Bank"** scenario.
  *   **The Story:** "Last month, I helped you move house (a big cost to me). I didn't ask for anything in return. But I only helped because I predicted that if I ever needed help, you'd give it without being asked. If I had predicted you'd say no, I would have stayed home and saved my energy."
  *   **The Moment:** "Now I'm asking for that help. You know I already helped you. You know the past is fixed. Causal Decision Theory says: 'He already helped. My choice doesn't change the past. I should save my energy.' Updateless Decision Theory says: 'If I refuse, I confirm I am the type he shouldn't have helped. To validate the logic that got me the help, I must help now.'"
  *   **Why this works:** It removes the "magic box" but keeps the *Counterfactual Mugging* structure (the core motivation for UDT). It's human, repeatable (social reciprocity), and legally adjacent (quasi-contract/unjust enrichment vibes).
  *   **The Cards:** Use the cards to simulate the "Prediction."
      *   Deal a card face down (The Postdoc's past prediction).
      *   Lawyer chooses "Help" or "Don't Help."
      *   Reveal: If Card was Red (Prediction: Help), Postdoc paid a cost earlier. If Black (Prediction: Don't Help), he didn't.
      *   Payoff depends on the *match* between Card and Choice.

  **Argument Against Your Instinct:**
  You mentioned wanting something "small, human... rather than a one-off encounter with an all-knowing predictor."
  *   **The Risk:** If you remove the predictor entirely, you remove the *reason* for UDT. Without a logical correlation (prediction), Causal Decision Theory is actually correct.
  *   **The Fix:** The predictor doesn't need to be all-knowing (Omega). They just need to be *better than chance* at modeling the Lawyer. The Postdoc should emphasize: "I don't need to know your future. I just need to know your *algorithm*. And you're consistent."

  ### 3. The Misconception Sequence
  She will form these misconceptions in this specific order. The Postdoc must head them off at the exact points listed.

  1.  **"It's just refusing to look at the evidence."**
      *   *Her take:* "So I should ignore that you already helped me?"
      *   *The Correction:* "No. You use the evidence to know *which* world you're in. But you choose the *policy* that would have worked best across *all* possible worlds before you knew."
      *   *Timing:* Immediate. As soon as he says "updateless."

  2.  **"It's Causal Decision Theory with a Precommitment bolted on."**
      *   *Her take:* "I should have just promised you last month."
      *   *The Correction:* "Promises are external constraints. This is internal. You can't promise *now* to change what I did *then*. You have to *be* the person who would have promised."
      *   *Timing:* After she tries to solve it with contract law.

  3.  **"It's Evidential Decision Theory in a trenchcoat."**
      *   *Her take:* "I'm just trying to make it true that you helped me." (Magical thinking).
      *   *The Correction:* "You aren't changing the past. You are acknowledging that your choice and the past are outputs of the same function. If the function outputs 'No', the past was different."
      *   *Timing:* When she accuses him of superstition.

  4.  **"It only works with perfect predictors."**
      *   *Her take:* "But you're not a psychic. You might be wrong."
      *   *The Correction:* "It works as long as there's a correlation. If I'm 60% right, the math still shifts. It's about weighting the logical link, not worshipping it."
      *   *Timing:* When she attacks his confidence.

  ### 4. Technical Wrinkles: The Deep Cuts
  A beta reader flagged the "logically impossible selves" and "copies" issue. This is advanced material, but if the Lawyer is sharp, she will hit it.

  *   **The "Logically Impossible" Wrinkle:**
      *   *Her Question:* "What if I decide to refuse? Does that make the past impossible?"
      *   *The Answer:* "It means you are in a branch of the decision tree that has lower prior probability. UDT says: Optimize the algorithm for the *whole* tree, not just the branch you're on."
      *   *Scene Advice:* **Do not let him explain this fully.** It is too technical for a candlelit scene. He should acknowledge it ("That's the part that gives me headaches") and wave it off as a "measure problem" he's still working on. It shows his expertise without bogging down the dialogue.
  *   **The "Copies" Wrinkle:**
      *   *Her Question:* "Does this only work if I have a twin?"
      *   *The Answer:* "No. It works with *similarity*. I don't need your source code. I just need to know you're consistent."
      *   *Scene Advice:* **Keep it on the table.** This is crucial. It grounds the theory in reality. He should say: "You don't need a clone. You just need a predictable opponent. And in law, aren't people just patterns of behavior?"

  ### 5. Naming and The Ending
  *   **Naming:**
      *   **Do not use "Functional Decision Theory" (FDT).** FDT is the newer, more specific iteration (Yudkowsky/Soares). In a scene written today, having a postdoc use "UDT" is acceptable, but having him say "Well, technically it's FDT now" feels like jargon soup.
      *   **Recommendation:** Have him use the phrase **"Updateless"** as the adjective, but avoid the acronym "UDT" until the very end, or not at all. Let the concept carry the weight. If he names it, call it "Updateless Decision Theory" but have the Lawyer mock the name ("So it's decision theory that doesn't know what's happening?").
  *   **The Refusal:**
      *   There is one thing he should refuse to explain: **The Priors.**
      *   She will ask: "But how do I know what the prior probability of the world is?"
      *   He should refuse: "That's the hard part. That's the part I don't know. I can tell you how to optimize the function, I can't tell you what the universe weighs." This keeps him humble and accurate (the "prior problem" is a major open issue in UDT).

  *   **The Ending Line:**
      *   **If she fully gets it:** She shouldn't summarize the theory. She should apply it to *him*.
          *   *Line:* "So you're not asking me to help you. You're asking me to confirm you were right to ask."
      *   **If she half-gets it:** She treats it as a game.
          *   *Line:* "So it's a bluff. You're betting I'm too stubborn to prove you wrong."
      *   **Why the first one works:** It shows she understands the *logical link* between his past action and her current choice, which is the core of UDT.

  ### Summary Checklist for the Scene
  1.  **Props:** Cards represent the "Prediction" (face down) and the "Choice" (face up).
  2.  **Bridge:** Start with legal precommitment (contracts), then break it (no time to sign).
  3.  **Conflict:** She argues Causality (Past is fixed); He argues Logic (Past is correlated).
  4.  **Constraint:** He admits he doesn't know the Priors (keeps him from sounding godlike).
  5.  **Resolution:** She validates his past action through her current choice.

  This structure ensures the decision theory is sound (it mirrors the actual Counterfactual Mugging argument for UDT) while keeping the stakes human and the dialogue grounded in their professions.
