answer: |-
  To adjudicate between 'falsified' and 'premature' without resorting to hindsight bias, we require a pre-commitment protocol. The core difficulty is that long-run social predictions operate in open systems where *ceteris paribus* clauses are rarely safe. A theory that cannot fail is not a theory; it is a theology. To distinguish a robust research programme from a degenerating one, we must establish what constitutes a legitimate 'rescue' of a failed prediction.

  Below is the specification for an account of premature truth.

  ### The Desiderata

  **1. Ex-Ante Error Margins (Non-negotiable)**
  A prediction must specify not only a target state and a deadline, but a variance window and the conditions under which the deadline may slip *before the deadline arrives*.
  *   **Case:** If a theory predicts 'collapse by 1980' and, upon failure, claims 'collapse by 2050', this is ad hoc unless the theory originally posited a mechanism with high temporal uncertainty (e.g., 'within two centuries of resource saturation').
  *   **Rationale:** Without pre-committed variance, every failed date can be infinitely extended. A theory that allows unlimited date-shifting explains everything and predicts nothing.

  **2. Causal Invariance (Non-negotiable)**
  The causal mechanism driving the prediction must remain identical in the rescue. The 'why' cannot change even if the 'when' does.
  *   **Case:** If Malthus predicted famine due to *geometric vs. arithmetic growth*, a rescue cannot later rely on *environmental degradation* or *political instability* unless those were explicitly derived from the original growth rates.
  *   **Rationale:** Changing the mechanism is not saving the theory; it is proposing a new one. This prevents 'mechanism-swap' rescues where the label 'Malthusian' is retained while the content is gutted.

  **3. The Mortgage Rule (Non-negotiable)**
  Every rescue must incur a cost. To extend the timeline or adjust the scope, the theorist must surrender a class of cases, drop a subsidiary prediction, or commit to a new, risky observable that was not previously claimed.
  *   **Case:** If you argue the Green Revolution was merely a 'delay', you must predict a specific, observable limit to future technological yield that is distinct from the original claim. You cannot simply say 'wait and see'.
  *   **Rationale:** This is the logical barrier against immunisation. If a theory can absorb contrary evidence without losing any empirical content or risking new falsification, it is degenerate.

  **4. The Mirror Test (Prejudice)**
  If we would be embarrassed to grant the same rescue to a theory we oppose (e.g., a Marxist historical materialism prediction or a libertarian market absolutism prediction), the rescue is suspect.
  *   **Case:** Would we accept 'right but early' if a communist theorist claimed the revolution was delayed by cultural hegemony rather than falsified?
  *   **Rationale:** This controls for motivated reasoning. However, it is a heuristic for the *adjudicator*, not a logical constraint on the *theory*.

  ***

  ### Testing the Candidate Requirements

  **1. The Trichotomy of Rescues (Date-shift, Domain-shift, Mechanism-swap)**
  *   **Verdict:** This is a taxonomy, not a criterion. It describes *what* happened, not *if it is valid*.
  *   **Analysis:**
      *   **Date-shift:** Legitimate only if it satisfies the *Ex-Ante Error Margins*. Without pre-committed variance, it is always ad hoc.
      *   **Domain-shift:** (e.g., 'It didn't happen in Europe, but it will in Africa'). This is highly suspect. It often implies the theory was not universal as claimed. It is legitimate only if the theory originally specified boundary conditions that excluded the failed domain.
      *   **Mechanism-swap:** Almost always fatal. If the positive check becomes a preventive check, or population pressure becomes resource pressure, the original causal chain has been abandoned.
  *   **Conclusion:** The trichotomy is useful for classification, but it cannot stand alone as a requirement. It must be subordinate to *Causal Invariance* and *Ex-Ante Margins*.

  **2. The Mortgage Rule**
  *   **Verdict:** Real desideratum, not mere Popperian bookkeeping.
  *   **Analysis:** A theory that survives falsification by becoming more vague has reduced its empirical content. To maintain scientific status, the 'rescued' theory must have *more* explanatory power or *new* testable implications than the falsified version. If the rescue costs nothing, the theory is unfalsifiable in principle.
  *   **Conclusion:** Non-negotiable. It is the only way to prevent a theory from becoming a 'not even wrong' tautology.

  **3. The Mirror Test**
  *   **Verdict:** Genuine test of bias, but punishes unpopular theories only insofar as it exposes double standards.
  *   **Analysis:** The Mirror Test does not guarantee truth; a theory could be symmetrically treated and still false. However, it guarantees *procedural fairness*. Its weakness is that some theories are genuinely context-dependent. Demanding symmetry for a theory that claims uniqueness (e.g., 'this applies only to capitalist modes of production') might force a false equivalence.
  *   **Conclusion:** It is a prejudice in the sense that it prioritises fairness over structural validity. It is a tool for the judges, not a law of the theory.

  ***

  ### The Knockout and The Conflict

  **The Single Most Effective Requirement**
  The **Mortgage Rule** does the most work.
  Specifically, the clause requiring a **new observable commitment**.
  Most 'right but early' claims fail here. They ask for patience (time) without offering new evidence (data). If a theorist claims the reckoning is postponed, they must identify a specific, measurable indicator that will signal the approach of the new deadline *before* it arrives. If they cannot name what we should look for in the interim, they are not making a prediction; they are expressing a hope. The Mortgage Rule forces skin in the game *now*, rather than demanding credit for a victory *later*.

  **Incompatible Pairs**
  There is a tension between **The Mirror Test** and **Causal Invariance**.

  *   **The Conflict:** The Mirror Test demands we treat competing theories symmetrically. However, if Theory A claims universal applicability and Theory B claims context-specific applicability, applying the Mirror Test might force us to judge Theory B by the standards of Theory A. If we demand Theory B satisfy the Mirror Test against a universalist rival, we may force it to make claims outside its valid domain, thereby violating its own *Causal Invariance*.
  *   **Example:** Suppose a theory claims 'Resource collapse occurs only in closed political systems'. A rival claims 'Resource collapse occurs everywhere'. The Mirror Test might demand we judge the first theory by the failures of the second (in open systems). But doing so violates the first theory's causal specification.
  *   **Resolution:** I would drop **The Mirror Test**.
  *   **Why:** Truth is not democratic. A theory can be valid even if we are unwilling to grant its rescue to an opponent, provided it satisfies the logical constraints of *Causal Invariance* and the *Mortgage Rule*. The Mirror Test polices our bias, which is valuable, but it should not override the structural integrity of the theory itself. If a theory pays its Mortgage and maintains Invariance, it survives regardless of whether we would be embarrassed to treat its ideological opposite similarly. Fairness is a virtue of the adjudicator, not a condition of reality.
