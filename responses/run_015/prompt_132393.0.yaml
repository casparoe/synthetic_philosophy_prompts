answer: |-
  ### Exam Question

  **Aesthetics Seminar: Final Assessment**
  **Time Allocation:** 45 Minutes
  **Word Limit:** 900–1000 Words

  **Prompt:**

  Consider the following stipulation: A seventeenth-century masterpiece is scanned at molecular resolution and rebuilt atom-by-atom by a machine. An exhaustive verification procedure certifies that the facsimile is intrinsically identical to the original down to craquelure, pentimenti, and varnish layering. There is no epistemic gap; it is impossible to distinguish them by inspection.

  **Case A (The Swap):** The facsimile is hung in the museum; the original goes into a climate-controlled vault. A label identifies the wall-piece as the facsimile. Later, the museum runs the swap without the label.
  **Case B (The Restoration):** Independent analysis reveals that on the *original* canvas, two-thirds of the paint layer currently visible was applied by restorers in the 1800s.
  **Case C (The Collector):** A buyer knowingly purchases the facsimile at facsimile price, intends no deception, and derives identical aesthetic satisfaction. Yet, if the original were destroyed after the copy was made (undetectably), we intuit a loss remains.

  **Essay Task:**
  Assume the *Certainty Stipulation* holds (do not argue that we could not know the copy is perfect). Using Cases A, B, and C, argue for a specific account of what is lost when the original is removed from circulation or destroyed. You must:
  1.  Distinguish the **epistemic** worry from the **non-epistemic** remainder.
  2.  Identify at least **three distinct kinds of value** at stake (e.g., aesthetic, historical, symbolic).
  3.  Specify **to whom** (or what) the loss accrues in the Swap and Destruction scenarios.

  ***

  ### Model Answer (Approx. 700 Words)

  If we accept the Certainty Stipulation, the standard Goodmanian worry collapses. If the facsimile is intrinsically identical, the aesthetic properties supervene on the physical structure; therefore, the aesthetic experience provided by the facsimile is identical to that of the original. If we feel a loss remains when the original is vaulted or destroyed, that loss cannot be aesthetic in the immediate perceptual sense. We must separate the epistemic worry (the fear of being deceived) from the ontological or normative remainder. Case C (The Collector) proves this: if deception is removed and price is adjusted, the transaction is morally clean regarding fraud. Yet, the destruction of the original still feels like a diminution of the world. This suggests the value of the original is not exhausted by its capacity to generate visual experiences in present viewers.

  To locate the loss, we must distinguish three kinds of value. First, **Aesthetic Value**, which resides in the perceptual properties. Under the Stipulation, the facsimile preserves this fully. Second, **Historical-Testimonial Value**, which resides in the object's causal history. The original is a physical trace of the artist's action; it is evidence that the artist *did* this. The facsimile is evidence only that a machine *replicated* this. Third, **Symbolic-Status Value**, which resides in the social institution of art. The original functions as a relic or a token of a specific cultural moment.

  In Case A (The Swap), if the label is present, the public retains Historical-Testimonial value because they know they are viewing a stand-in. The loss is primarily to the institution's integrity if they claim the copy is the original. If the label is removed, the public loses the Historical-Testimonial value unknowingly, but the object itself retains its status as a placeholder. However, the original in the vault loses its Symbolic-Status Value. An artwork hidden ceases to function socially as a public good; it becomes a commodity. The loss here is to the *public sphere*, which is denied access to the historical witness, even if they cannot perceive the difference.

  Case B (The Restoration) complicates the "Original" category. If two-thirds of the paint is 19th-century, the object we venerate is already a hybrid. This suggests that Historical-Testimonial Value is not binary but graded. We value the *survival* of the artist's gesture, not necessarily the preservation of every atom. If the restoration preserves the artist's intended visual structure, it retains Aesthetic Value. However, it dilutes Historical-Testimonial Value. This case forces us to admit that we do not value the "original matter" fetishistically, but rather the continuity of the artistic intention. The facsimile breaks this continuity; the restoration preserves it imperfectly. Thus, the facsimile is worse than a restoration, even if physically more precise, because the restoration maintains the causal chain, however frayed.

  Finally, regarding the loss in the Destruction scenario (Case C): If the original is destroyed, the loss is not to the Collector (who is satisfied) nor the Viewer (who sees the copy). The loss is to **History** and the **Artist**. The object serves as testimony. Destroying the original severs the physical link to the moment of creation. It is akin to destroying a historical document after transcribing it perfectly. The transcription holds the information, but the document holds the authority.

  Therefore, the "residue" of loss is non-epistemic. It is the loss of the object's capacity to function as a causal witness. In the Swap, the loss is to the public's relationship with history (mitigated by honesty). In Destruction, the loss is absolute because the testimony is extinguished. We care about originals not because they look different, but because they *are* different in their genealogy. To value art is to value human agency, and the facsimile, however perfect, is a record of machine agency, not human creation. The loss is the erasure of that specific human act from the tangible world.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Epistemic vs. Non-Epistemic Distinction (4 Marks)**
  *   **Hit:** Explicitly accepts the Certainty Stipulation and argues that the loss persists *despite* perfect knowledge/inspection.
  *   **Miss:** Wriggles out by reintroducing doubt (e.g., "But we can't ever really know it's perfect") or claims the loss is purely about the risk of deception.

  **2. Tripartite Value Distinction (4 Marks)**
  *   **Hit:** Clearly defines three distinct categories (e.g., Aesthetic/Perceptual, Historical/Causal, Symbolic/Institutional) and assigns them different weights in the cases.
  *   **Miss:** Uses "value" loosely as a single blob, or fails to explain why the facsimile fails on one type while succeeding on another.

  **3. Specification of Loss Recipient (4 Marks)**
  *   **Hit:** Identifies a specific loser beyond the "viewer" (e.g., History, the Artist, the Public Sphere, or the Object's status).
  *   **Miss:** Claims "everyone loses" vaguely, or insists no one loses if they can't tell the difference (ignoring the non-epistemic requirement).

  **4. Engagement with Restoration Case (4 Marks)**
  *   **Hit:** Uses Case B to nuance the definition of "original" (e.g., continuity of intention vs. material purity) and contrasts it with the facsimile.
  *   **Miss:** Treats Case B as irrelevant or claims it proves originals don't matter (missing the causal chain distinction).

  **5. Engagement with Collector/Deception Case (4 Marks)**
  *   **Hit:** Explains why destruction is a loss even without fraud (e.g., testimony, historical record, corruption of the archive).
  *   **Miss:** Argues that if there is no lie, there is no wrong, failing to address the intuition of loss provided in the prompt.

  ***

  ### Instructor Notes

  **A vs. B Distinction:**
  *   **B Grade:** Hits all five points competently. Distinguishes the values and accepts the stipulation. The argument is consistent but may treat the "Historical Value" as a black box (i.e., "History matters" without explaining *why* physical testimony matters if information is preserved).
  *   **A Grade:** Makes the specific move of **conceding the aesthetic equivalence** to strengthen the ontological claim. The A answer explicitly argues that art is not just a container of visual data but a *trace of action*. They will articulate that the facsimile changes the *category* of the object from "work of art" to "artifact of replication," fundamentally altering its normative standing in the institution, not just its history. They handle Case B (Restoration) not as a contradiction, but as proof that *causal continuity* matters more than *material purity*.

  **Flagged Rigging/Constraints:**
  *   **The Certainty Stipulation:** This is philosophically "rigged" to block Goodman's epistemic argument. Students who rely heavily on *Languages of Art* may feel frustrated that the prompt forbids the standard "we can't know" reply. You should be prepared to grade fairly if a student challenges the coherence of the stipulation itself (e.g., arguing that causal history is intrinsic to identity), provided they do so rigorously rather than as an evasion.
  *   **Case B (Restoration):** This risks collapsing the "fake" vs. "original" distinction entirely. If 2/3 is new paint, is it still the original? An A answer will navigate this by distinguishing *conservation* (maintaining the causal chain) from *replication* (starting a new chain). If a student argues the original is *already* a fake, ensure they follow through on the implications for the Swap case.
