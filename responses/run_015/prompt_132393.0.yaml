  *(Self-Correction on Model Answer Length)*: 700 words is quite tight for a philosophy essay covering 4 complex cases. I need to ensure it's punchy and doesn't waffle. I will prioritize depth on the "Loss to Whom" and "Three Values" as requested.

  *(Self-Correction on Marking Scheme)*: The prompt asks for "one line on how students typically get it wrong or wriggle out of it." I must ensure this is included for each of the 5 points.

  *(Self-Correction on Rigging)*: I need to be honest about the "Certainty Stipulation." It basically begs the question against Goodman if not handled carefully, but for the purpose of the exam, it forces the ontological debate. I will flag this.

