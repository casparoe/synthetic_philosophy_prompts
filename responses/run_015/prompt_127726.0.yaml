  I'm putting together a proposal for an 8-week summer project on AI deception, pitching it to a small ethics-in-tech fund. My half-formed idea is that the usual debate—can LLMs lie if they don't have intentions?—is stuck because both sides either demand mental-state stories (which AI lacks) or collapse everything into generic misalignment or hallucination. I want to try splitting deception from mere error with a non-mentalistic criterion: whether the user's false belief is counterfactually dependent on the model concealing or distorting its own internal confidence/state (call it counterfactual belief-dependance). But I'm also worried that's too behaviorist, so I want to contrast it with an "epistemic contract" framing, where deception is violating the implicit interation terms—like the user expects representation of knowledge boundaries, not strategic optimization for engagement.

  Turn this into a short proposal (around two pages). I need: the precise question—probably whether a counterfactual-dependence criterion can distinguish deceptive from non-deceptive AI outputs without mental states, and whether it outperforms an epistemic-contract account—plus why current positions don't settle it. Then the method: what I'd actually do week by week, probably constructing synthetic interaction cases and running them through both frameworks, plus checking consistency with legal/intuitive judgments about deception. Say what a result looks like (maybe a clean taxonomy that survives hard cases) and what failure looks like (the two criteria collapse into each other or can't separate clear cases). And be honest about scope: is 8 weeks enough, and what's the realistic deliverable? Don't include a bibliography or citation list, I'll fill that in myself. Keep it casual—there might be a typo or two in the framing, that's fine.
