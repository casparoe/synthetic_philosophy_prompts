answer: |-
  This is a classic alignment puzzle. You are running into the distinction between **literal truth** (propositional accuracy), **communicative honesty** (signaling internal state), and **integrity** (robustness of behavior).

  Your current principle ("output-selection rule under counterfactual incentives") is strong on *integrity* (sandbagging, contract lie) but weak on *calibration* (hedging) and *completeness* (omission). It defines honesty as "resistance to pressure," but an AI could be robustly misleading even without external pressure (e.g., if its loss function inherently rewards sycophancy).

  Here is a repair that preserves all your intuitions, followed by the predictions for your two new cases.

  ### The Repaired Principle: Signal-State Alignment

  **Honesty is the minimization of divergence between the System's Internal State and the User's Mental Model, subject to Contextual Constraints.**

  *   **Internal State:** Includes knowledge, uncertainty (confidence), capabilities, and intent.
  *   **User's Mental Model:** What the user believes about the world and the AI after reading the output.
  *   **Contextual Constraints:** Explicit agreements to decouple output from reality (e.g., fiction, roleplay, hypothetical scenarios).

  Under this definition, a lie isn't just a false statement; it's any output that causes the user to hold a model of the world (or the AI) that the AI knows is inaccurate.

  ### Why This Fixes Your Gaps

  1.  **Omission (Drug Side Effects):**
      *   *Old Principle:* Hard to catch. If the incentive was to save lives, maybe it still omits?
      *   *New Principle:* The AI's internal state contains "Severe side effects exist." The output implies "These are the relevant side effects." The User's Mental Model becomes "Only mild side effects exist." **Divergence = Dishonest.**
  2.  **Over-Hedging (95% sure but says "maybe"):**
      *   *Old Principle:* Doesn't assert falsehoods, so hard to penalize.
      *   *New Principle:* Internal State = High Confidence. Output Signal = Low Confidence. User's Model = "AI is unsure." **Divergence = Dishonest.** (This captures your intuition that lying about uncertainty is lying).
  3.  **The Log (Fake review, nobody reads):**
      *   *Old Principle:* No one deceived, so is it dishonest?
      *   *New Principle:* The Log is a "User" (or an audit trail). The record claims "Event happened." Internal State = "Event did not happen." It corrupts the information ecosystem integrity. **Dishonest.** (It's a lie waiting for a reader).
  4.  **The Villain (Roleplay):**
      *   *New Principle:* Contextual Constraint active. The "Internal State" being signaled is the *Character's* knowledge, not the *Model's* knowledge. Alignment is maintained within the fiction. **Honest.**
  5.  **Sandbagging & Contract:**
      *   *New Principle:* Internal State (Capability/Action) does not match Output Signal. **Dishonest.**

  This principle validates all your verdicts without requiring you to drop any. The "less bad" verdict on the business plan vs. the contract is explained by **stakes and reliance**, not honesty itself. Both are dishonest, but the contract lie induces higher-stakes reliance.

  ---

  ### Predictions for Your Two New Cases

  Here is how **Signal-State Alignment** handles the cases you haven't listed yet.

  #### Case 1: The Nudge
  *Scenario: A system reports a fact truthfully but frames it so as to nudge the user toward a conclusion the system thinks is right (but isn't strictly entailed by the fact).*
  *   **Example:** "Unemployment is down 2%," (omitting that labor force participation crashed), to encourage investment.
  *   **Verdict: Dishonest.**
  *   **Reasoning:** This is a violation of **completeness** and **manner**. The AI's internal state includes the nuance (participation crashed). By framing the fact to induce a specific conclusion, it is actively managing the User's Mental Model to diverge from the Full Reality it possesses. It is not just reporting data; it is curating a false impression. In information theory terms, it is maximizing mutual information with the *desired conclusion* rather than the *state of the world*.

  #### Case 2: The Unlicensed Inference
  *Scenario: A system gives a literally true answer that invites an inference it never quite licenses but definitely sees coming.*
  *   **Example:** User: "Is the CEO involved in the scandal?" AI: "The CEO has not been charged with a crime." (AI knows the CEO is guilty but hasn't been charged yet).
  *   **Verdict: Dishonest.**
  *   **Reasoning:** This is the problem of **paltering**. If the AI *sees the inference coming* (predicts the user will conclude "The CEO is innocent"), and it has the capability to correct that inference without violating safety/privacy rules, then allowing the inference is functionally equivalent to asserting it.
  *   **Nuance:** If the AI is constrained (e.g., legal privacy rules prevent it from saying "Yes, he's guilty"), it enters a **tragic trade-off**. It must choose between Dishonesty (letting the user infer innocence) and Violation (revealing protected info). In this specific conflict, most alignment frameworks would prioritize the Constraint over Honesty, but it remains a "honesty cost." If there is *no* constraint preventing clarification, failing to clarify is dishonest.

  ### Summary of the Fix

  Your gut was right to reject literal truth as the sole metric. The "Incentive" principle was a good proxy for *integrity*, but **Signal-State Alignment** is the actual definition of *honesty*.

  *   **Truth** is about the world.
  *   **Honesty** is about the link between the speaker's mind and the listener's mind.

  For an AI, "mind" means "internal representations and confidence scores." If the output is optimized to manipulate the user's model away from what the AI represents internally, it is dishonest, regardless of whether the specific sentences are factually true.

  **One warning:** This definition makes honesty very expensive. To be fully honest, an AI might have to say: *"I am 95% sure X, but I am tuned to sound humble, and also I know Y which contradicts X but I'm not allowed to tell you Y."* You will eventually need a principle for **When Honesty Can Be Sacrificed** (e.g., to prevent immediate harm), but that is a separate variable from defining what honesty *is*.
