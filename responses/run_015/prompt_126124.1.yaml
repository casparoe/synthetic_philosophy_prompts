  I'm putting together questions for a podcast episode where I intervew Dr. Elara Voss, a philospher of economics who's defnding a reconstructed Keynesian view she calls leisure as moral infrastructure. She argues that Keynes's 1930 essay on our grandchildren isn't just forecasting shorter hours, but smuggling in a normative claim: that absolute needs include not only subsistence but also unstructured cognitive time—what she terms idle cognition—and that modern productivity culture actively destroys the conditions for the good life Keynes envisioned. She also claims Keynes's Bloomsbury aestheticism gives him resources to resist the idea that leisure must be earned through prior labor, though she admits this sits uneasily with Keynes's own investment-driven macro framework.

  Please draft eight interview questions that go deep into the actual content of her position, not generic bio stuff. For each question include a folow-up keyed to the answer she's most likely to give—especially if she tries to deflect by saying Keynes was just being predictive, not normative. I want at least one question on how idle cognition differs from mere rest or recreation, one on whether her view collapses Keynes's distinction between absolute and relative needs, and one on what her Keynesianism says about people who genuinely prefer high-earning, long-hour lives.

  Structure your response like this:
  - Setup recap (about 100 words): summarize Voss's position in your own words so I can check you got the framing right.
  - The eight questions with folow-ups (about 400 words): number them, keep each tight.
  - The curveball (about 100 words): one final question that ties her view back to Keynes's personal life and the Bloomsbury circle's actual attitudes toward work and pleasure, pressing a tension she hasn't addressed.
  - Delivery notes (about 50 words): quick suggestions on tone—where to push, where to let her talk.

  Don't ask for bibliographies or citations. Keep it grounded in ideas a model could reason about without searching.
