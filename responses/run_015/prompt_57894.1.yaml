  And I realized it's like we both bought the exact same dog, but you paid the breeder price and I bought mine off a guy in a van.

  You're not paying for the shoe, bro. **You're paying for the shoe's birth certificate.** We're wearing the same thing, but your shoes have a lineage and mine just have a mailing address. You paid the extra $750 for the invisible aura that says, *"I was allowed to be made."*
