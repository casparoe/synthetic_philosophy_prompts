prompt: |-
  I am writing the chapter of my dissertation in which the standards of adequacy for an account of mental causation get fixed, and I want the specification settled before I begin scoring candidate views. I have read enough of the surrounding literature to recognise the standard moves, so please do not survey it, attribute positions to authors, or hand me a reading list: I want requirements, each with the case or consideration that earns it a place on the list, together with your judgement about which of the things people demand in this area are genuine desiderata and which are prejudices of one camp.

  The purpose against which adequacy is to be measured is fixed, and I would like the list held to it. The theory must vindicate the claim that an agent's reasons can explain her action in a way that could bear on moral responsibility: not merely predict the action, not merely redescribe it in mental vocabulary, and not merely rationalise it after the fact. An account that secures causation for the mental only by making mental properties causally idle summaries of neural goings-on fails for this purpose, and I would rather that failure be recorded as a requirement on the list than silently assumed.

  Here is the pile of demands I have collected. For each, tell me whether it is a genuine desideratum, a demand that presupposes the answer against one family of views, or a preference of a camp; rewrite the genuine ones into a form that does not beg the question; and add the requirements I have missed.

  1. The theory must respect the causal closure of the physical, or else say exactly which formulation of closure it rejects and why the formulation its opponents use is stronger than anything physics supports. My suspicion is that the premise usually written down (roughly, that every physical event with a cause has a physical cause) is weaker than what the exclusion reasoning needs, and that the difference becomes visible if microphysics turns out to be indeterministic.
  2. It may not buy room for the mental by appealing to indeterminacy at the micro-level without saying why the resulting probabilities are not themselves fixed by prior physical goings-on.
  3. It must not let the exclusion reasoning generalise: if the argument drains causal work from the mental, it seems equally to drain it from temperature, from the brittleness of glass, and from the special sciences generally, and a view that stops the argument only at the mental looks ad hoc.
  4. It must not make the causal status of the mental hostage to how complete physics happens to be at a given time; a theory that predicts mental causation is refuted by further neuroscientific detail is, I think, disqualified.
  5. It must respect a set of distinctions I take to be non-negotiable candidates: causation by a property versus causation by a particular event; causation versus causal explanation; difference-making versus production; symmetric overdetermination versus preemption; and the causal relevance of a state versus the agent's exercising control in acting on it.
  6. It must handle the case in which the mental cause and its physical realiser come apart in time: a long-standing intention is cited as the cause of an action performed months later, though nothing that realised the intention when it was formed still exists. Say what the causal relation relates, and what the requirement rules out.

  Two further cases are of my own construction, and I want every candidate scored on them. The first: a single belief, with one content, is realised twice over inside one nervous system, each realiser sufficient on its own for the behaviour and one of them actually pre-empting the other. Does the mental cause survive, and does your answer differ if the two realisers had different contents? The second: the state that does the causal work is subpersonal, in the sense that it is not a state the agent could cite as her reason even on ideal reflection. If a theory allows such a state to be the cause of action, I want to know whether it has thereby given up the thing my chapter needs, and whether that is a cost or a discovery.

  Finally, three things I most want from you. First: is any subset of the retained desiderata jointly unsatisfiable, and if so which one would you drop and what does dropping it cost — I suspect the list itself is a result here. Second: which single requirement does the most exclusionary work? Third: mark which requirements hold only relative to the responsibility-focused purpose I have fixed, and say where the list forces a decision about what causation itself is, since I suspect much of the dispute is a fight about that question conducted at one remove. Keep any scoring of the live candidate families to a short paragraph each, described by their structural claim rather than by name.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**

      *   **Goal:** The user is writing a dissertation chapter on mental causation. They need to fix the "standards of adequacy" (desiderata) *before* evaluating candidate theories.
      *   **Constraint 1 (Crucial):** Do *not* survey literature, attribute positions to authors, or provide a reading list.
      *   **Constraint 2 (Crucial):** The purpose is fixed: Vindicate the claim that an agent's *reasons* can explain her *action* in a way that bears on *moral responsibility*. (Not just prediction, redescription, or post-hoc rationalization).
      *   **Constraint 3 (Crucial):** Mental properties cannot be causally idle summaries of neural goings-on (epiphenomenalism fails).
      *   **Task:** Evaluate a provided list of 6 demands + 2 custom cases.
          *   Classify each as: Genuine Desideratum, Question-Begging Demand (presupposes answer), or Camp Preference.
          *   Rewrite genuine ones to be question-neutral.
          *   Add missing requirements.
          *   Address the 2 custom cases.
          *   Answer 3 specific final questions (Joint unsatisfiability, most exclusionary requirement, responsibility-relative vs. metaphysical requirements).
          *   Keep scoring of candidate families to a short paragraph each (structural claim, not names).

  2.  **Evaluate the Provided List (1-6):**

      *   *Demand 1 (Causal Closure):* The user suspects the standard formulation is too weak for exclusion arguments, especially regarding indeterminism.
          *   *Analysis:* Closure is often used to force exclusion. If the goal is responsibility, we need to know if physical determination blocks reason-based control. However, demanding acceptance of closure can beg the question against dualists or libertarians. But given the "responsibility" aim, we need a clear account of how physical and mental causes relate.
          *   *Verdict:* Genuine, but needs reframing. It shouldn't demand *acceptance* of closure, but rather *accommodation* of the physical causal sufficiency that physics suggests, without rendering the mental otiose.
      *   *Demand 2 (Indeterminacy):* Don't hide behind quantum gaps unless you explain why probabilities aren't fixed physically.
          *   *Analysis:* This targets "quantum mind" escapes. If the goal is responsibility, mere randomness doesn't help (luck problem).
          *   *Verdict:* Genuine desideratum. It prevents cheap escapes.
      *   *Demand 3 (Generalisation/Special Sciences):* If exclusion kills the mental, it kills temperature/brittleness. Don't stop the argument arbitrarily at the mental.
          *   *Analysis:* This is the "problem of many minds" or "causal drainage." If we want mental causation for responsibility, we likely want macro-causation generally. However, some might argue mental is *sui generis*.
          *   *Verdict:* Genuine. Ad hoc exceptions weaken the theory.
      *   *Demand 4 (Completeness of Physics):* Don't make mental causation depend on current physics.
          *   *Analysis:* This is about robustness. If neuroscience finds a gap, mental causation shouldn't vanish.
          *   *Verdict:* Genuine. Prevents "god of the gaps" mental causation.
      *   *Demand 5 (Distinctions):* Property vs. Event, Causation vs. Explanation, etc.
          *   *Analysis:* These are conceptual tools. Demanding specific distinctions might beg the question (e.g., if a theory rejects property causation).
          *   *Verdict:* Camp Preference/Methodological. The theory must *clarify* these, not necessarily adopt this specific ontology. Rewrite to demand *clarity* on these distinctions rather than adherence to them.
      *   *Demand 6 (Time Lag/Realiser Persistence):* Intention formed months ago, realiser gone.
          *   *Analysis:* This targets token-identity or strict realisation accounts. If the physical base is gone, how does the mental persist causally?
          *   *Verdict:* Genuine. Essential for diachronic agency (planning).

  3.  **Evaluate the Custom Cases:**

      *   *Case 1 (Double Realisation/Preemption within one agent):* One belief, two realisers, one preempts.
          *   *Analysis:* Tests multiple realisability and causal relevance. If the mental is the cause, it shouldn't matter which realiser fired. If the realiser is the cause, the mental is epiphenomenal.
          *   *Requirement:* The theory must specify whether the *content* or the *vehicle* carries the causal weight in preemption scenarios.
      *   *Case 2 (Subpersonal States):* Cause is subpersonal (not citable as reason).
          *   *Analysis:* This strikes at the "Reasons as Causes" link required for responsibility. If the cause is subpersonal, can the agent be responsible?
          *   *Requirement:* For *this specific dissertation purpose* (responsibility), the cause must be personal-level (citable). This is a constraint derived from the purpose, not metaphysics.

  4.  **Identify Missing Requirements:**

      *   *The "Because" Constraint:* The action must happen *because* of the reason, not just coincident with it. (Deviant causal chains).
      *   *Normative Sensitivity:* Reasons have normative force. The causation must respect the rational connection, not just brute force. (Rationalizing vs. Explaining).
      *   *Control:* For responsibility, the agent must have control over the causal link.

  5.  **Address the Three Final Questions:**

      *   *Joint Unsatisfiability:* Likely between "Causal Closure/Physical Sufficiency" and "Robust Mental Causation for Responsibility" if one assumes incompatibilism. Or between "Subpersonal Causal Efficacy" and "Reasons as Causes." I need to highlight the tension between Physical Sufficiency and the need for the Mental to do *distinct* work for responsibility.
      *   *Most Exclusionary Requirement:* Likely the combination of Causal Closure + The requirement that Mental Properties do *non-redundant* work (Exclusion Problem).
      *   *Responsibility-Relative vs. Metaphysical:* Distinguish what is needed for *agency* (citability, control) vs. what is needed for *causation* (counterfactual dependence, production).

  6.  **Drafting the Response (Iterative refinement for tone and constraints):**

      *   *Tone:* Academic, direct, rigorous, no fluff.
      *   *Constraint Check:* No author names (Davidson, Kim, Yablo, etc.). No reading lists. Focus on structural claims.
      *   *Refining Demand 1:* Instead of "Respect Closure," make it "Account for the causal sufficiency of the physical without rendering the mental redundant."
      *   *Refining Demand 5:* Change from "Must respect these distinctions" to "Must explicitly locate its claims within these distinctions."
      *   *Custom Cases:* Integrate these as test cases or specific requirements.
      *   *Scoring:* Keep it brief. Non-reductive physicalism, Reductive physicalism, Dualism, Compatibilist/Agency views.

  7.  **Final Review against constraints:**
      *   Did I attribute positions? (Avoid "Kim says," "Non-reductive physicalists argue").
      *   Did I survey literature? (No).
      *   Is the purpose (Responsibility) central? (Yes).
      *   Are the 3 final questions answered? (Yes).
      *   Is the scoring short and structural? (Yes).

      *(Self-Correction during drafting)*: I need to be careful with Demand 1. The user suspects the premise is weaker than exclusion needs. I should validate that insight in the rewrite.
      *(Self-Correction on Custom Case 2)*: The user asks if allowing subpersonal causes gives up the project. I need to be firm: For *this* dissertation (responsibility), yes, it risks giving up the project unless a bridge is built.
      *(Self-Correction on Unsatisfiability)*: The tension is often between "Physical Causal Closure" and "Mental Causal Relevance" *given* the "No Overdetermination" principle. I should identify this triad.

  8.  **Final Polish:** Ensure the distinction between "Desideratum" (needed for the job) and "Prejudice" (metaphysical bias) is sharp. Ensure the rewrite of requirements is neutral.

      *Plan:*
      1. Introduction acknowledging the fixed purpose.
      2. Evaluation of List 1-6 (Status + Rewrite).
      3. Evaluation of Custom Cases (as Requirements).
      4. Missing Requirements.
      5. The Three Final Questions.
      6. Short Structural Scoring.

      *Let's execute.*
answer: |-
  ### Evaluation of Provided Demands

  Your fixed purpose is to vindicate reason-based explanation for moral responsibility. This rules out epiphenomenalism (mental properties are idle) and mere redescription (mental talk is just neural talk). Below is the classification and refinement of your list.

  **1. Causal Closure of the Physical**
  *   **Status:** Genuine Desideratum (with caveats).
  *   **Analysis:** You are correct that the standard formulation ("every physical event has a physical cause") is often too weak to generate the exclusion problem, while the stronger formulation ("every physical event is *sufficiently* caused by prior physical events") is metaphysically loaded. Demanding acceptance of the strong version begs the question against libertarians; demanding the weak version renders the exclusion argument toothless.
  *   **Rewrite:** *The theory must account for the causal sufficiency of the physical base without rendering the mental property causally redundant. It must specify whether it accepts that physical events are nomologically sufficient given prior physical states, and if so, how mental properties contribute causal work that is not merely a shadow of that sufficiency.*

  **2. Indeterminacy and Probabilities**
  *   **Status:** Genuine Desideratum.
  *   **Analysis:** Appealing to micro-indeterminacy to save mental causation often trades causal efficacy for randomness, which undermines responsibility.
  *   **Rewrite:** *If the theory appeals to indeterminacy to secure room for mental causation, it must explain how the mental influences the probability distribution without violating the physical account of those probabilities, and why this influence constitutes control rather than chance.*

  **3. Generalisation to Special Sciences**
  *   **Status:** Genuine Desideratum.
  *   **Analysis:** A solution that saves mental causation by sacrificing the causality of temperature or biology is ontologically profligate and unstable.
  *   **Rewrite:** *The mechanism securing mental causation must be applicable to other special science properties (e.g., biological functions, macro-physical dispositions) unless a principled distinction is drawn between the mental and other higher-level properties relevant to agency.*

  **4. Independence from Completeness of Physics**
  *   **Status:** Genuine Desideratum.
  *   **Analysis:** Mental causation should not rely on gaps in current neuroscience.
  *   **Rewrite:** *The account must remain robust even if the physical causal story becomes complete. Mental causation cannot rely on the incompleteness of the physical description.*

  **5. Conceptual Distinctions (Property/Event, etc.)**
  *   **Status:** Camp Preference / Methodological Requirement.
  *   **Analysis:** Demanding specific distinctions (e.g., property causation) presupposes an ontology that some viable theories reject (e.g., trope theory or process ontology). However, clarity on these points is necessary.
  *   **Rewrite:** *The theory must explicitly locate its claims regarding the relata of causation (events, properties, facts, or tropes) and distinguish between causal production and causal explanation. It need not adopt your specific list, but it must map its claims onto these distinctions to show where the causal work is located.*

  **6. Diachronic Realisation (Time Lag)**
  *   **Status:** Genuine Desideratum.
  *   **Analysis:** Essential for planning agency. If the mental cause vanishes when the neural realiser changes, long-term intention is impossible.
  *   **Rewrite:** *The theory must explain how a mental state formed at $t_1$ can cause an action at $t_2$ even if the specific physical realiser existing at $t_1$ does not persist until $t_2$. It must specify what bears the causal relation across time.*

  ---

  ### Evaluation of Custom Cases

  **Case 1: Double Realisation with Preemption**
  *   **Verdict:** This functions as a **Genuine Desideratum** regarding Multiple Realisability and Causal Relevance.
  *   **Requirement:** *The theory must specify whether the causal efficacy resides in the multiply realisable type (the belief content) or the specific token realiser. If the belief causes the action, the preemption of one realiser by another of the same type must not negate the causal status of the belief. If the contents differ, the theory must explain why one content preempts the other without reducing the causation to the physical vehicle.*

  **Case 2: Subpersonal Causes**
  *   **Verdict:** This is a **Responsibility-Relative Constraint**.
  *   **Requirement:** *For the specific purpose of vindicating moral responsibility, the theory must distinguish between states that merely produce behaviour and states that constitute the agent's reasons. If the causal work is done entirely by subpersonal states inaccessible to reflection, the theory must provide a bridge explaining how the agent exercises control over those states. Without this bridge, the theory fails the specific purpose of this chapter, even if it succeeds as a metaphysics of mind.*

  ---

  ### Missing Requirements

  You have missed three critical constraints derived from your fixed purpose (Responsibility):

  **7. The Deviancy Constraint**
  *   *Requirement:* The theory must rule out deviant causal chains. It is not enough that the reason causes the action; it must cause it *in the right way*. A belief that I am nervous causing me to spill coffee (which looks like an intentional signal) is causation without agency.
  *   *Reason:* Responsibility requires the action to flow from the reason via a non-accidental pathway.

  **8. Normative Sensitivity**
  *   *Requirement:* The theory must explain how the causal relation respects the normative force of the reason. The action happens *because* the reason was good (or taken to be good), not merely because the neural state had force.
  *   *Reason:* Rational explanation differs from brute mechanical explanation. Responsibility hinges on responsiveness to reasons, not just stimuli.

  **9. The Control Condition**
  *   *Requirement:* The theory must locate the agent's control within the causal structure. It must distinguish between the agent causing the action and the agent's states causing the action.
  *   *Reason:* If the mental states cause the action but the agent does not control the states, responsibility is undermined (the "manipulation argument" worry).

  ---

  ### The Three Final Questions

  **1. Joint Unsatisfiability**
  There is a tension between **Requirement 1 (Physical Sufficiency)**, **Requirement 3 (No General Exclusion)**, and **Requirement 9 (Control/Non-Redundancy)**.
  *   **The Conflict:** If physical states are nomologically sufficient for action (Req 1), and we deny systematic overdetermination (implied in Req 3), then mental properties appear redundant. If they are redundant, they cannot ground the specific control needed for responsibility (Req 9).
  *   **What to Drop:** If forced, **Requirement 1 (in its strong form)** is the candidate for modification. You should not demand the theory accept strong physical sufficiency as a premise, but rather demand it *explain* the physical data. Dropping the demand for strong closure allows for non-physicalist accounts of agency, but costs alignment with a standard physicalist worldview. Keeping it forces the theory into a compatibilist or non-reductive physicalist box.
  *   **Cost:** Dropping the strong closure premise opens the door to dualist or libertarian accounts that may be scientifically costly but metaphysically clearer on agency. Keeping it forces the theory to perform complex gymnastics to avoid epiphenomenalism.

  **2. Most Exclusionary Requirement**
  **Requirement 1 (Physical Sufficiency/Non-Redundancy)** combined with the **No Overdetermination** assumption does the most exclusionary work. This is the engine of the Exclusion Argument. Any theory that accepts physical sufficiency and denies overdetermination must show how mental properties are not causally screened off. This eliminates simple dualism and naive non-reductive physicalism immediately.

  **3. Responsibility-Relative vs. Metaphysical**
  *   **Responsibility-Relative:** **Case 2 (Subpersonal States)**, **Requirement 7 (Deviancy)**, **Requirement 8 (Normative Sensitivity)**, and **Requirement 9 (Control)**. These are not required for "causation" in the abstract (a volcano causes an eruption without control or norms), but they are required for *agency*.
  *   **Metaphysical:** **Requirement 1 (Closure/Sufficiency)**, **Requirement 3 (Special Sciences)**, **Requirement 4 (Completeness)**, **Requirement 6 (Diachronic)**. These concern the structure of reality and causation itself.
  *   **Where Causation is Decided:** The list forces a decision on causation at **Requirement 5 (Relata)** and **Requirement 1 (Sufficiency)**. If you define causation as counterfactual dependence, mental causation is easy to secure but hard to link to production. If you define it as physical production, mental causation is hard to secure. The dispute is indeed about the nature of causation conducted at one remove; your list forces the candidate to declare whether causation is a relation of *dependence* or a relation of *production*.

  ---

  ### Structural Scoring of Candidate Families

  **Reductive Identity Theories**
  *   **Structure:** Mental properties are identical to physical properties.
  *   **Score:** Secures Physical Sufficiency and avoids Exclusion easily. Fails Responsibility-Relative constraints: struggles to distinguish rational explanation from neural explanation (Req 8) and often reduces control to physical determinism (Req 9). Risks failing the Diachronic requirement if identity is token-specific and transient.

  **Non-Reductive Physicalism (Realisation)**
  *   **Structure:** Mental properties are distinct but realised by physical properties; causation is often inherited.
  *   **Score:** Handles Special Sciences (Req 3) well. Struggles with Exclusion (Req 1): if the realiser does all the work, the mental is redundant. Often fails the Subpersonal test (Case 2) by allowing realisers to do the work while the agent claims credit. Must work hard to satisfy Normative Sensitivity (Req 8).

  **Dualist Interactionism**
  *   **Structure:** Mental and Physical are distinct substances or properties; mental exerts distinct causal force.
  *   **Score:** Secures Control (Req 9) and Normative Sensitivity (Req 8) naturally. Fails Physical Sufficiency (Req 1) unless it posits violations of physical conservation laws or systematic overdetermination. High cost on the Completeness of Physics (Req 4).

  **Agency/Causalist Theories**
  *   **Structure:** Causation is primitive or agent-centric; agents cause actions via reasons, not merely states causing events.
  *   **Score:** Best fit for Responsibility-Relative constraints (Control, Deviancy, Norms). Often treats Physical Sufficiency (Req 1) as secondary or compatible via "dual explanations." Risks obscurity on the Metaphysical requirements (Relata, Special Sciences) if "agent-causation" is not naturalised.

  **Eliminativist / Interpretivist Theories**
  *   **Structure:** Mental states are useful fictions or patterns; no robust mental causation exists.
  *   **Score:** Passes Physical Sufficiency and Special Science consistency easily. Fails the fixed purpose entirely: cannot vindicate moral responsibility as defined (Req 9, Case 2). Disqualified by your chapter's aim.
