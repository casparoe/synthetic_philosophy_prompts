  ## 8. Materials Checklist
  *   24 Index Cards (drawn with markers: Shapes, Textures, Numbers).
  *   Printed Rule Sheet (3 Rules).
  *   Timer.
  *   Whiteboard/Flipchart for tracking "Coherence Points."
  *   Scratch paper for participants.

  ## 9. Facilitator's Secret Key (For Your Eyes Only)
  *   **Cluster A:** Form (Square).
  *   **Cluster B:** Texture (Solid).
  *   **Cluster C:** *Intended Slip.* Technically Texture (Striped). But to satisfy Rule 3 (Harmony with B), it *must* be re-interpreted.
      *   *Valid Slip:* "Striped" = "Directional" (slips to Orientation).
      *   *Valid Slip:* "Circle/Triangle" = "Non-Square" (slips to Form-Negation).
  *   **Cluster D:** Texture (Dotted). Satisfies Harmony with A (Form).
  *   **The Trap:** If they classify C as Texture, they violate Rule 3 (B & C are adjacent). They *must* slip a concept to win the points. If they refuse to slip, they lose the points but maintain "objective" accuracy. This tension is the learning objective.
