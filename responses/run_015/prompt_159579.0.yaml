answer: |-
  1. **Sequence of Ideas.** Begin with intra-personal ranking versus intra-personal intensity. Participants must see that knowing Person A prefers X to Y does not reveal *how much* more they prefer it. Only once intensity is distinct from ranking can you show that social decisions require comparing intensities, not just ranks. Next, separate the three demands: ordinal comparison (who is worse off?), unit comparison (whose gain is larger?), and full comparability (trade-off rates). Clarify that this vote demands unit comparison, not merely ordinal ranking. Finally, introduce common currencies (money, QALYs) only *after* establishing the structural problem. If introduced earlier, participants will treat currency as a solution rather than a relocation of the comparison burden. The currency must be presented as a way of forcing a choice on unit comparison, not avoiding it.

  2. **The Case.** The joint replacement versus talking therapy case works, provided you strip it of cost differences. It must lack cash equivalents; neither group is seeking income. It must lack a single identifiable victim to prevent emotional hijacking. It must prevent head-counting; ensure the cohort sizes are identical. It must resist 'need alone' appeals; describe both conditions as severe. The crucial feature is that self-reports ('my pain is 10', 'my despair is 10') feel incomparable intuitively. Do not change the case, but tighten the descriptions so severity cannot be ranked by clinical observation alone. This ensures the trade-off survives every attempt to find a common currency.

  3. **Misconceptions.** Head off 'empathy required' immediately; frame the problem as structural, not psychological. Counter '0–10 scales solve it' when participants first propose scoring. Address 'anchors settle the middle' during the scaling exercise by showing non-linear distress. Challenge 'equal treatment default' before discussing voting rules. The final misconception—'no comparison possible means no comparison available'—must be addressed last. For the thought that some decisions survive incomplete scales to be intelligible, participants must first see the *set* of admissible rescalings. They need to recognise that while the exact trade-off is unknown, some rankings hold across all admissible scales. This fits after the scaling exercise but before the final vote. You must demonstrate that robustness exists within the uncertainty, not despite it.

  4. **Final Task.** Present a proposed decision rule: 'Fund the group whose members report the largest average improvement on their own scale.' Ask: 'What hidden assumption makes this rule work?' A diagnostic wrong answer cites sample size or honesty. The correct answer identifies the assumption of unit comparability across persons. This separates those who see the structural gap from those merely reciting incomparability. It forces them to articulate the metric they are implicitly adopting.

  5. **Exclusions.** 'We will not calculate QALYs today; that is a measurement tool, not a justification.' 'We will not discuss the history of utilitarianism; we are solving a vote, not a thesis.' 'We will not derive a perfect formula; we are identifying what makes any formula work.' 'We will not decide the vote now; we are deciding how to decide.'
