answer: |-
  You have identified a precise and well-documented paradox in political economy, but you are correct that there is no single "magic noun" that captures every nuance of it. Instead, scholars use a cluster of concepts to describe this specific configuration.

  The closest established concept to your description is **"The Development of Underdevelopment"** (within **Dependency Theory**), operationalized through what modern institutional economists call **"Extractive Institutions."**

  However, to capture the specific *mechanism* you described—where "improvement" (roads, literacy) is the very tool used to enforce dependency—the anthropologist James Ferguson's concept of **"The Anti-Politics Machine"** is perhaps the most precise fit for the institutional design.

  Here is how to map this terrain, distinguish it from paternalism, and name the specific configuration.

  ### 1. The Economic Configuration: "The Development of Underdevelopment"
  Coined by Andre Gunder Frank (1966), this concept directly addresses your observation that concrete metrics (trade volume, infrastructure) can improve while the region becomes *more* dependent, not less.

  *   **The Logic:** Conventional wisdom says trade and infrastructure lead to independence. Dependency theorists argue that in a colonial/imperial context, these improvements are designed to integrate the periphery into the core's economy *as a subordinate*.
  *   **The Fit:** A road built by a metropole doesn't connect local towns to each other (which would build internal markets); it connects mines/plantations to the port (which locks in raw material export). Literacy improves, but only enough to create clerks for the colonial administration, not citizens for a local parliament.
  *   **Why it fits your criteria:** It explains why the "benefit data" cited by defenders is real but misleading. The development *is* the dependency.

  ### 2. The Institutional Configuration: "Extractive Institutions"
  In *Why Nations Fail*, Acemoglu and Robinson distinguish between *inclusive* institutions (which distribute power and opportunity) and *extractive* institutions (which concentrate power and extract wealth).

  *   **The Logic:** You noted that legal authority stays with the metropole and leaders are appointed. This is the definition of an extractive political institution. It may provide "order" and "property rights" (improving metrics), but those rights are designed to secure the flow of wealth to the center, not to empower local political agency.
  *   **The Fit:** This distinguishes the system from simple theft. It is a *system of governance* that functions well for its intended purpose (extraction/stability) but fails at the purpose defenders claim (preparation for self-rule).

  ### 3. The Bureaucratic Mechanism: "The Anti-Politics Machine"
  This is likely the most specific term for the "benevolent improvement as control" dynamic you described. In his 1990 book of the same name, James Ferguson analyzed development projects in Lesotho.

  *   **The Logic:** Ferguson argued that "development" agencies often present their work as technical and benevolent (building roads, improving health metrics). However, the *effect* of these institutions is to expand bureaucratic state power and depoliticize the population. By framing problems as technical (needing experts from the metropole) rather than political (needing local authority), the system makes self-governance impossible.
  *   **The Fit:** It captures your point that the dependency is "structurally baked in." The institution isn't failing to govern; it is succeeding at *preventing* local governance by making itself indispensable.

  ### 4. Distinguishing from Paternalism: "Indefinite Tutelage"
  You asked how to draw the boundary between this and paternalism where the authority intends to let go. The distinction lies in the **Exit Clause**.

  *   **Benevolent Paternalism (Trusteeship):** The ideological framework here is the League of Nations "Mandate" system or the British "Trusteeship" model. The claim is: *"We rule temporarily until you are capable."* There is a theoretical horizon of independence.
  *   **The Configuration You Describe (Indefinite Tutelage):** Here, the metrics of "capability" are moved or structurally unattainable. For example, a colony is told it needs a certain GDP or literacy rate to govern itself, but the trade restrictions prevent the GDP growth, and the education system limits the literacy to clerical levels.
  *   **The Name:** In postcolonial legal theory, this is often called **"Permanent Tutelage"** or **"Structural Guardianship."** It is paternalism without the promise of maturity.

  ### Summary: How to Name It
  If you need a precise label for your discussion, you can construct one using these established terms:

  1.  **For the Economic Structure:** **"Structural Dependency"** (rooted in Dependency Theory).
  2.  **For the Institutional Design:** **"Extractive Modernization."** (This captures the "improvement" that is actually "extraction.")
  3.  **For the Political Arrangement:** **"Imperial Trusteeship without Exit."**

  **Adam Smith's Specific Contribution:**
  Smith didn't have these modern terms, but he identified the mechanism as the **Mercantile System**. He argued that the "protection" Britain offered was a pretext to maintain a **monopoly of trade**. He noted that the colonies were forbidden from manufacturing goods or trading with others, which stunted their economic diversification. He famously argued that Britain was draining capital from the colonies to maintain this system, and that the "benefit" of protection was outweighed by the cost of the monopoly.

  **The Precise Phrase:**
  If you want to sound precise in a political economy context, describe it as:
  > **"A regime of Extractive Institutions masked by Developmentalism, resulting in Structural Dependency."**

  Or, more poetically, drawing on Ferguson:
  > **"Technocratic Tutelage."**

  This distinguishes it from "failed aid" (which implies accident) and "hypocrisy" (which implies intent). It identifies the *system* itself as the generator of the paradox: the improvement *is* the mechanism of control.
