answer: |-
  **Essay Question**

  Deflationists maintain that truth is not a substantive property capable of explaining scientific success. However, scientific practice routinely ranks deliberately false models containing known idealisations as 'closer to the truth' than their predecessors. Analyse whether a deflationist can accommodate this intuition without contradicting their core thesis. Specifically, assess whether invoking a graded notion of truth-likeness in this context inevitably smuggles in a correspondence theory of truth, thereby rendering the deflationary position circular or unstable.

  ***

  **Model Answer**

  Deflationary theories of truth posit that the concept of truth does not denote a robust, explanatory property of propositions. Instead, truth is merely a logical device used for endorsement, generalisation, or disquotation. For the deflationist, asserting that a theory is true adds nothing substantive to asserting the theory itself. Consequently, truth cannot serve as the causal explanation for why successful theories succeed; only the specific content of the theory can do that. This creates a significant tension when confronting scientific realism, particularly regarding the progress of science through idealised models.

  Scientific practice frequently employs models known to be strictly false. Physicists utilise frictionless planes, ideal gases, and point masses. These models contain deliberate idealisations that deny actual features of the world. Yet, scientists confidently assert that newer models are "closer to the truth" or more accurate than older ones, even when both are technically false. This intuition suggests a graded notion of truth-likeness or verisimilitude. If science progresses by approximating the truth, truth appears to be a target independent of our assertions, possessing a structure that allows for measurement of distance. This suggests truth is a substantive relation between theory and world.

  The deflationist attempts to accommodate this by reducing claims of truth-likeness to logical relations between sentences. They might argue that saying Model A is closer to the truth than Model B simply means A entails more true observational consequences than B, or that A is logically stronger without being false in critical areas. However, this strategy faces a severe difficulty regarding known falsehoods. If both models are false, comparing their truth-likeness requires knowing what the truth *is* to measure the distance from it. Without a substantive account of what makes a proposition true—typically a correspondence relation between theoretical structures and worldly structures—there is no metric for "closeness."

  Here lies the critical risk of circularity. To explain scientific success via truth-likeness, one must assume that the world is structured in a way that matches the theory to varying degrees. If the deflationist invokes this structural matching to define closeness, they are implicitly relying on a correspondence theory. They are treating truth as a substantive property that theories can approximate, which contradicts the core deflationary thesis that truth is insubstantial and non-explanatory. If truth is merely a device for disquotation, there is no "distance" to measure between a sentence and the world, only the sentence and its conditions of assertion.

  Therefore, invoking graded truth-likeness to explain scientific progress while maintaining deflationism is unstable. To make sense of "closeness," the deflationist must borrow the explanatory resources of realism—specifically, the idea that truth involves a relation of mapping or correspondence that can hold partially or approximately. Once this substantive notion is admitted to save the intuition of scientific progress, the deflationary constraint is violated. The deflationist cannot consistently deny that truth is explanatory while simultaneously using truth-likeness to explain why false models are preferable. They are left with a dilemma: either abandon the claim that truth explains scientific progress, leaving scientific success unexplained, or accept a substantive notion of truth, thereby collapsing into realism. The attempt to have both results in a circular argument where the insubstantial notion of truth is secretly doing substantive work.

  ***

  **Marking Scheme (Total: 25 Marks)**

  **Essential Moves (5 marks each)**

  1.  **Articulation of the Deflationary Constraint:** Clearly states that deflationism denies truth is a substantive, explanatory property (e.g., truth is for endorsement/disquotation, not causal explanation).
  2.  **Characterisation of Scientific Idealisation:** Accurately describes the problem of deliberately false models (e.g., frictionless planes) and the scientific intuition that these can be ranked by accuracy.
  3.  **Explanation of Truth-Likeness Demand:** Explains why ranking false models requires a graded notion of truth (verisimilitude) rather than a binary true/false distinction.
  4.  **Analysis of Circularity/Correspondence Risk:** Explicitly identifies that measuring "distance" from truth presupposes a substantive target (correspondence), thereby smuggling in the very property deflationism denies.
  5.  **Evaluation of Consistency:** Concludes whether deflationism can remain stable given this tension (e.g., acknowledging the dilemma between abandoning explanation or abandoning deflationism).

  **Grade Differentiation**

  *   **A-Grade (20–25 marks):** The response must explicitly execute Move 4 by identifying the *circularity risk*: that using truth-likeness to explain success presupposes a substantive relation (correspondence) to measure distance, which contradicts the deflationary premise. The argument should show how the deflationist borrows realist resources inconsistently.
  *   **B-Grade (15–19 marks):** The response opposes deflationism to correspondence theory (Move 4) but treats them as merely competing options. It fails to analyse the *internal circularity* of the deflationist position when invoking truth-likeness, instead simply arguing that correspondence is a "better" theory without showing why deflationism becomes unstable specifically through this invocation.

  **Common Misconception (Penalty Applied within Move 4)**

  *   **The "Error Theory" Mistake:** Candidates often lose marks by claiming deflationism denies truth *exists*. Deflationism accepts truth exists but denies it is *substantive*. Marks are deducted if the candidate argues the deflationist cannot speak of truth at all, rather than arguing they cannot speak of it as a *measurable relation*.
