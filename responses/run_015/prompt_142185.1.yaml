answer: |-
  When peace grows long the spirit turns to fat,
  And private gain consumes the public good.
  We need the wind to shake the rooted mat,
  A risk of life to make the nation blood.

  A risk of life to make the nation blood.
  You mean the corpse is fertilizer now?
  You dress the grave in ethical attire,
  Then call the bone a necessary shroud.

  Then call the bone a necessary shroud.
  Without the stake, we are but animals.
  To fear the end is less than being free,
  The fight must stop before the light goes out.

  The fight must stop before the light goes out.
  So kill enough to wake them, not to kill.
  A measured harvest for the moral soul,
  But what if no one here pays out the bill?

  But what if no one here pays out the bill?
  The screen remains clean, the distant field is red.
  The ethical life retreats into the cloud,
  Then spirit walks on legs it has not bred.

  Then spirit walks on legs it has not bred.
  Is this the peace Kant wanted, rotting twice?
  Or just a lie that learned to hide its face?
  The ghost is safe, the blood is someone else's.

  ***

  **Note**

  I stretched the timeline significantly by merging the *Phenomenology*'s master-slave dialectic (individual recognition) with the *Philosophy of Right*'s interstate relations (collective ethical health). While Hegel connects them, the leap from "staking life for recognition" to "war prevents social stagnation" is interpretive, not always explicit text. I am fairly confident in the reading that Hegel views perpetual peace as corrosive to the *Sittlichkeit* (ethical life) and targets Kant's federation directly. The point I am least sure about is whether Hegel requires *actual* war or merely the *possibility* of war to maintain ethical vitality; scholars debate this, and it matters immensely for the drone question. If remote warfare removes risk from the citizenry entirely, Hegel's logic might imply the state has become a hollow shell, but he never anticipates technology that separates killing from dying so completely.
