answer: |-
  # Research Proposal: Commitment and Evidence — Disentangling the Stages of XOR Blackmail

  **Principal Investigator:** [Your Name]
  **Department:** Department of Philosophy
  **Duration:** One Academic Term (12 Weeks)
  **Word Count:** Approx. 4,000 words

  ## 1. Abstract

  This project proposes a formal and philosophical investigation into the structural vulnerabilities of Evidential Decision Theory (EDT) when confronted with XOR Blackmail scenarios. Standard analyses of XOR Blackmail suggest that EDT agents are uniquely susceptible to exploitation, paying out on blackmail threats that Causal Decision Theory (CDT) agents would ignore. However, existing literature often treats the decision to pay as a singular, ex-post event, conflating the agent's capacity for ex-ante commitment with their ex-post evidential updating. This project hypothesises that by formally separating the decision problem into two distinct stages—a commitment stage (credibility) and a compliance stage (updating)—we can isolate the precise locus of EDT's failure. The research will construct a two-stage formal model to determine whether the paradox dissolves when these stages are distinguished, or merely shifts from a problem of rational action to a problem of rational pre-commitment. The outcome will clarify whether EDT requires a fundamental revision of its conditionalisation rules or merely an account of diachronic rationality.

  ## 2. Introduction and Rationale

  ### 2.1 The Context of Rational Choice
  In contemporary decision theory, the demarcation between rational and irrational agency is often tested against 'Newcomb-like' problems. These scenarios are designed to pry apart the recommendations of Causal Decision Theory (CDT) and Evidential Decision Theory (EDT). While CDT advises agents to maximise causal expected utility, ignoring correlations that do not reflect causal influence, EDT advises agents to maximise evidential expected utility, treating their actions as evidence for states of the world they cannot causally affect.

  Historically, CDT has been criticised for failing in Newcomb's Problem (leaving money on the table), while EDT has been criticised for failing in the Smoking Lesion problem (abstaining from smoking due to spurious correlations). However, a more recent class of problems, broadly categorised under 'logical blackmail' or 'XOR Blackmail', presents a distinct challenge. In these scenarios, a predictor (or a logical fact) correlates the agent's action with a prior event in such a way that the EDT agent appears compelled to act against their own ex-ante interests.

  ### 2.2 The Specific Problem: XOR Blackmail
  XOR Blackmail is a scenario wherein a predictor sends a blackmail demand based on a logical function of the agent's future action and the truth of a proposition. Typically, the predictor sends the letter if and only if (The Agent Pays XOR The Proposition is True). The proposition is often tautological or related to the sending of the letter itself, creating a logical loop.

  For the EDT agent, receiving the letter constitutes evidence. Because the agent's action (paying or not paying) is logically correlated with the predictor's decision to send the letter, the agent reasons that paying is evidence that the letter was sent (which is already the case) but, more critically, in many formulations, paying is treated as evidence that the 'bad' state of the world (the existence of the blackmail condition) is mitigated. Consequently, the EDT agent pays. The CDT agent, recognising that their payment cannot causally influence the past decision of the predictor to send the letter, refuses to pay.

  Intuitively, refusing to pay seems the rational course; paying the blackmailers is generally regarded as irrational policy. Yet, EDT recommends payment. This has led many theorists to conclude that EDT is fundamentally flawed in handling logical correlations, prompting the development of Updateless Decision Theory (UDT) or Functional Decision Theory (FDT). These newer frameworks suggest that the agent should decide as if they are choosing the output of their decision algorithm before receiving specific evidence (i.e., 'updatelessly').

  ### 2.3 The Gap in the Literature
  While the literature surrounding UDT and FDT is robust, particularly within the 'rationalist' community and associated technical institutes, there remains a gap in the formal philosophical analysis of *why* EDT fails in these specific instances. The prevailing consensus is that EDT fails because it updates on evidence it should ignore. However, this consensus may conflate two distinct normative requirements:
  1.  **Commitment Credibility:** The ability of an agent to bind themselves to a policy ex-ante (before the letter is sent).
  2.  **Evidential Updating:** The correct method for processing new information ex-post (after the letter is received).

  Current critiques often assume that if EDT fails the XOR Blackmail test, it is because its updating rule is incorrect. This proposal challenges that assumption. It posits that the failure may not lie in the updating rule itself, but in the modelling of the decision problem as a single-stage event. If we model the agent as having an ex-ante opportunity to commit to a policy of 'non-payment', the EDT agent might successfully avoid the blackmail without altering their evidential conditionalisation rules. The paradox may not be a failure of evidence processing, but a failure of diachronic agency.

  ### 2.4 Research Objective
  The primary objective of this one-term project is to formalise a two-stage model of XOR Blackmail and test the performance of EDT within this structure. By separating the ex-ante commitment stage from the ex-post compliance stage, I aim to determine whether the 'blackmail vulnerability' is an inherent feature of evidential reasoning or an artefact of synchronic modelling.

  This distinction is crucial. If the problem is merely one of commitment, then EDT can be salvaged by integrating standard pre-commitment mechanisms (such as binding contracts or reputational costs) without requiring the radical overhaul proposed by UDT. If, however, the paradox persists even in a two-stage model, this suggests a deeper flaw in how EDT handles logical evidence, reinforcing the need for updateless frameworks.

  ## 3. Precise Statement of the Research Question

  The central research question guiding this project is:

  **Does formally separating the ex-ante commitment stage from the ex-post compliance stage in XOR Blackmail scenarios dissolve the evidential decision theorist's paradox, or does it merely relocate the normative failure from the domain of action to the domain of commitment?**

  This main question breaks down into three subsidiary inquiries:
  1.  **Formalisation:** Can XOR Blackmail be rigorously modelled as a sequential game with distinct information sets for the commitment and compliance stages?
  2.  **Dominance Analysis:** Does an EDT agent, maximising evidential expected utility at the ex-ante stage, select a policy of 'non-payment' that dominates the policy of 'payment'?
  3.  **Dynamic Consistency:** If the EDT agent commits to 'non-payment' ex-ante, do they have an incentive to deviate from this commitment ex-post upon receiving the letter? (i.e., Is the commitment dynamically consistent?)

  Answering these questions will clarify whether the 'rational' response to XOR Blackmail is a matter of choosing the right decision algorithm (UDT vs. EDT) or choosing the right temporal structure for the decision problem (Single-stage vs. Two-stage).

  ## 4. Background and Literature Context

  ### 4.1 The Standard Decision-Theoretic Landscape
  The debate between CDT and EDT is well-established in academic philosophy. CDT, championed by [Author, Year], relies on causal counterfactuals. It argues that rational agents should only consider the causal consequences of their actions. EDT, associated with [Author, Year], relies on conditional probabilities. It argues that rational agents should consider what their actions indicate about the state of the world.

  In standard Newcomb problems, EDT 'wins' (gets the million) while CDT 'loses' (gets the thousand). In the Smoking Lesion, CDT 'wins' (smokes and enjoys it) while EDT 'loses' (abstains unnecessarily). This trade-off has led to a stalemate where each theory is superior in certain environments.

  ### 4.2 The Rise of Logical Decision Theory
  XOR Blackmail belongs to a class of problems designed to break this stalemate by targeting EDT in domains where intuition strongly favours the CDT response (refusing blackmail). This has spurred the development of 'Logical Decision Theories' such as UDT and FDT. Proponents like [Author, Year] argue that agents should reason as if they are selecting the output of their decision function prior to receiving any observations. This 'updatelessness' allows the agent to ignore the evidence of the letter's arrival when calculating expected utility, effectively treating the correlation as a fixed logical fact rather than new evidence.

  ### 4.3 The Conflation Hypothesis
  Despite the technical sophistication of UDT, there is a philosophical risk in adopting it too hastily. UDT requires a significant departure from standard Bayesian conditionalisation. It asks agents to ignore evidence they undeniably possess. My hypothesis is that this radical move might be unnecessary if we properly account for the temporal structure of the blackmail scenario.

  In the standard presentation of XOR Blackmail, the agent is presented with the letter and asked to decide. This is a synchronic snapshot. However, rational agency is diachronic. Agents exist over time. They can form intentions, make promises, and build reputations. In game theory, the distinction between a one-shot game and a repeated game (or a game with a pre-play communication stage) is fundamental.

  The literature on blackmail in decision theory often treats the receipt of the letter as the starting point of the decision problem. This ignores the ex-ante perspective where the agent knows the *structure* of the predictor (i.e., that the predictor uses an XOR function). If the agent knows this structure beforehand, they can form a policy.

  The 'Conflation Hypothesis' suggests that current critiques of EDT conflate:
  1.  **Credibility:** The predictor must believe the agent will not pay. This is determined ex-ante.
  2.  **Updating:** The agent receives the letter. This happens ex-post.

  If EDT fails, is it because it updates wrongly on the letter? Or because it failed to establish credibility before the letter was sent? If the latter, then EDT does not need to change its updating rules; it needs to be embedded in a diachronic framework that values commitment. This project seeks to test this hypothesis formally.

  ### 4.4 Why Existing Literature Does Not Settle This
  While game-theoretic approaches to decision theory exist (e.g., [Author, Year]), they typically focus on CDT agents or Nash equilibria. The specific application of sequential game modelling to *Evidential* agents in *XOR* scenarios is under-explored in mainstream philosophical journals. Much of the rigorous work on this is found in technical reports from AI alignment organisations. While valuable, these reports often prioritise finding a working solution for AI agents (hence UDT/FDT) over diagnosing the precise philosophical category error in EDT.

  Academic philosophy has been slower to engage with the formal specifics of XOR Blackmail, often grouping it with Newcomb's Problem. This proposal aims to bridge that gap by bringing the formal rigour of the rationalist community into conversation with the diachronic rationality literature in academic philosophy (e.g., work on temptation, resolute choice, and planning). The specific question of whether separating stages *dissolves* the paradox for EDT, rather than just solving it via a new theory, is a novel contribution.

  ## 5. Methodology

  The project will employ a mixed method of formal modelling and conceptual analysis. The work will be divided into three phases over the one-term duration.

  ### 5.1 Phase 1: Formalising the Two-Stage Model (Weeks 1-4)
  The first task is to construct a rigorous formal representation of the XOR Blackmail scenario that explicitly distinguishes between two time steps: $t_1$ (Commitment) and $t_2$ (Compliance).

  *   **Variables:**
      *   $P$: The proposition (e.g., 'The letter is sent').
      *   $A_1$: The action at $t_1$ (Commit to Pay / Commit to Refuse).
      *   $A_2$: The action at $t_2$ (Actually Pay / Actually Refuse).
      *   $L$: The event of the Letter being sent.
      *   $Pred$: The Predictor's algorithm.

  *   **The XOR Condition:**
      The standard XOR condition is $L \iff (Pay \oplus True)$. In the two-stage model, we must define whether the Predictor predicts $A_1$ or $A_2$.
      *   *Scenario A:* Predictor predicts $A_2$ (the final action).
      *   *Scenario B:* Predictor predicts $A_1$ (the commitment).

      I will formalise both, but the critical analysis will focus on Scenario A, as this creates the tension between commitment and compliance. If the Predictor predicts the final action, the agent's ex-ante commitment is only effective if it is dynamically consistent.

  *   **Utility Functions:**
      I will define utility functions $U$ for the agent, incorporating the cost of the blackmail, the cost of the letter being sent, and any cost associated with breaking a commitment (reputational or psychological).

  *   **EDT Calculation:**
      I will calculate the Evidential Expected Utility (EEU) for the agent at both $t_1$ and $t_2$.
      $$EEU(Action) = \sum_{States} P(State | Action) \times U(State, Action)$$
      Crucially, at $t_2$, the agent has the evidence $L$ (Letter received). At $t_1$, they do not.

  ### 5.2 Phase 2: Dominance and Consistency Analysis (Weeks 5-8)
  With the model established, I will perform a dominance analysis across the two stages.

  *   **Ex-Ante Dominance:** Does 'Commit to Refuse' dominate 'Commit to Pay' at $t_1$ from the perspective of an EDT agent?
      *   If yes, the EDT agent voluntarily chooses a policy of non-payment before the letter arrives.
  *   **Ex-Post Incentive:** Upon receiving $L$ at $t_2$, does the EDT agent have an incentive to deviate from their $t_1$ commitment?
      *   This tests for **Dynamic Consistency**. If $EEU(Pay | L) > EEU(Refuse | L)$, the agent is time-inconsistent. They will plan to refuse but end up paying.
  *   **The Role of Commitment Costs:** I will introduce a parameter $C$ representing the cost of breaking a commitment. I will solve for the threshold of $C$ required to make the EDT agent dynamically consistent.
      *   If a negligible $C$ restores rationality, the problem was merely one of binding.
      *   If an impossibly high $C$ is required, the problem is intrinsic to EDT's updating.

  ### 5.3 Phase 3: Philosophical Interpretation and Drafting (Weeks 9-12)
  The final phase involves interpreting the mathematical results philosophically.
  *   **Dissolution vs. Relocation:** If the model shows that EDT agents choose the correct policy ex-ante but fail to follow through ex-post, the paradox is relocated to the problem of *akrasia* or weak will, rather than faulty logic.
  *   **Comparison with UDT:** I will compare the two-stage EDT results with the one-stage UDT results. Does two-stage EDT achieve the same utility as UDT without ignoring evidence?
  *   **Writing:** The final output will be a 4,000-word research paper suitable for submission to a journal such as *Analysis*, *Mind*, or *The British Journal for the Philosophy of Science*.

  ### 5.4 Tools and Resources
  The project requires no empirical data collection. It relies on logical analysis and mathematical modelling. I will utilise standard decision-theoretic notation and potentially simple Python scripts to verify expected utility calculations across different probability thresholds, ensuring the algebraic derivations are robust. As a philosophy professor, I have access to the necessary literature databases and mathematical training to execute this without external assistance.

  ## 6. Expected Outcomes and Success Criteria

  ### 6.1 What Success Looks Like
  A successful outcome for this project is a definitive classification of the EDT failure mode in XOR Blackmail.
  *   **Best Case:** The model demonstrates that an EDT agent, when modelled diachronically, selects the rational policy ex-ante. The 'paradox' is shown to be an artefact of synchronic modelling. This would suggest that EDT is more robust than currently acknowledged, provided it is embedded in a framework of diachronic agency.
  *   **Moderate Case:** The model shows that while EDT selects the right policy ex-ante, it requires substantial commitment costs to remain consistent ex-post. This quantifies the 'cost of rationality' for EDT agents in blackmail scenarios.
  *   **Theoretical Contribution:** Regardless of the specific result, successfully formalising the two-stage distinction contributes to the literature by clarifying the relationship between updatelessness and pre-commitment. It provides a structured way to discuss whether UDT is a new theory or simply a formalisation of ideal pre-commitment.

  ### 6.2 What Counts as Failure
  *   **Formal Collapse:** If the two-stage model mathematically collapses back into the single-stage model (i.e., the ex-ante decision provides no new leverage), the hypothesis would be falsified. This would confirm that the problem is indeed with EDT's core updating rule, not its temporal framing.
  *   **Ambiguity:** If the results are highly sensitive to minor changes in the definition of the XOR function or the information sets, the project may fail to yield a generalisable philosophical conclusion.
  *   **Scope Creep:** Given the one-term limit, failure would also constitute an inability to complete the formalisation and drafting within 12 weeks.

  ### 6.3 Risk Management
  The primary risk is that the 'two-stage' distinction is already implicitly handled in the UDT literature, rendering the project redundant. To mitigate this, I will focus strictly on the *EDT* perspective. The question is not 'Does UDT solve this?' but 'Can EDT be saved by this distinction?'. Even if the answer is 'No', the formal proof of *why* it is 'No' is a valuable philosophical result that clarifies the boundary between EDT and UDT.

  ## 7. Significance and Impact

  ### 7.1 Academic Impact
  This project addresses a live debate in decision theory. By rigorously testing the 'Conflation Hypothesis', it contributes to the metaphysics of rational choice. It challenges the assumption that decision problems are atomic events, reinforcing a view of agency as extended over time. This aligns with broader interests in the philosophy of action regarding planning and intention.

  ### 7.2 Relevance to AI Safety
  While this is a theoretical philosophy project, the implications extend to Artificial Intelligence. AI agents are often modelled as expected utility maximisers. If we deploy EDT-like agents in environments where they face logical blackmail (e.g., in negotiations with other AI systems), understanding whether they need 'updateless' architectures or simply 'commitment' mechanisms is vital.
  If the two-stage model solves the problem, AI designers might prioritise building agents with robust commitment devices (smart contracts, cryptographic pre-commitments) rather than rewriting their core decision algorithms. This is a potentially less disruptive and more implementable solution for AI alignment.

  ### 7.3 Teaching and Curriculum
  The results of this research will directly inform my teaching modules on Decision Theory and Rational Choice. The distinction between ex-ante and ex-post rationality is a powerful pedagogical tool for explaining the differences between CDT, EDT, and UDT to undergraduates and postgraduates. Producing a clear paper on this topic will provide a valuable resource for the department.

  ## 8. Scope Check and Feasibility

  ### 8.1 One-Term Feasibility
  A one-term timeline (12 weeks) is tight but feasible for a theoretical paper of 4,000 words.
  *   **Weeks 1-4:** Focused on the math. This is the heavy lifting. Since I am already familiar with the basics of XOR Blackmail, the novelty lies in the two-stage formalisation, which is a modification of existing models rather than a creation from scratch.
  *   **Weeks 5-8:** Analysis. This involves interpreting the math. This is standard philosophical work.
  *   **Weeks 9-12:** Writing and revision. 4,000 words is approximately 10-12 pages single-spaced. This is a standard journal article length.
  *   **Constraint:** I will not attempt to solve the general case for all logical correlations. I will restrict the scope strictly to the XOR Blackmail formulation. This ensures the project remains bounded.

  ### 8.2 Resource Requirements
  *   **Time:** I am requesting a buy-out of one module's teaching load or equivalent research time to ensure the 12-week timeline is met without interference from administrative duties.
  *   **Funding:** Minimal funding is required. The project is theoretical. I am requesting internal grant funds primarily to support the teaching buy-out and to cover open-access publication fees should the paper be accepted.
  *   **Collaboration:** I intend to work independently, though I may circulate drafts to colleagues specialising in formal epistemology for feedback during Week 10.

  ### 8.3 Ethical Considerations
  As a theoretical project involving no human or animal subjects, there are no direct ethical concerns. The research adheres to standard academic integrity guidelines.

  ## 9. Conclusion

  XOR Blackmail presents a stark challenge to our understanding of rational agency. The standard response has been to discard Evidential Decision Theory in favour of Updateless frameworks. This proposal argues that we should not be so quick to abandon EDT. By distinguishing between the credibility of commitment and the mechanics of evidence updating, we may find that EDT is not broken, but merely misplaced in time.

  This project offers a precise, formal test of that hypothesis. It promises to clarify the normative structure of blackmail scenarios, contributing to both academic philosophy and the theoretical foundations of AI safety. The scope is appropriate for a one-term intensive, and the methodology is robust. I am confident that this research will yield a publishable result that advances the debate beyond the current stalemate.

  ## 10. Researcher Confidence Statement

  As requested, I am providing an assessment of my confidence in the main claims underpinning this proposal.

  **Claim 1: The existing literature conflates ex-ante commitment with ex-post updating in the context of XOR Blackmail.**
  *   **Confidence:** **High (85%)**.
  *   **Reasoning:** Most standard presentations of the problem present the agent with the letter and ask for a decision immediately. While UDT literature discusses 'updatelessness', it often treats this as a property of the decision algorithm rather than a distinct temporal stage of commitment. The specific diagnostic separation proposed here is not the primary focus of major papers by [Key Authors], which tend to focus on the superiority of UDT rather than the diagnosis of EDT's specific failure mode.

  **Claim 2: Formalising a two-stage model is sufficient to test whether the paradox dissolves for EDT.**
  *   **Confidence:** **High (90%)**.
  *   **Reasoning:** Decision theory is formal by nature. If the paradox relies on the conflation of stages, a formal model that separates them will reveal this mathematically. The tools (game trees, expected utility calculations) are well-established and fit for purpose.

  **Claim 3: The paradox will likely shift to a problem of dynamic consistency (commitment) rather than dissolving entirely.**
  *   **Confidence:** **Moderate (60%)**.
  *   **Reasoning:** **This is the claim I am least sure about.** My intuition, based on preliminary mental modelling, is that EDT agents will still face a temptation to deviate ex-post because the evidential correlation remains strong even after commitment. The letter's arrival is strong evidence that the predictor expects payment. However, it is possible that the ex-ante calculation is so heavily weighted against payment that it alters the ex-post priors in a way I haven't fully anticipated. If the paradox dissolves completely, it would be a more revolutionary result than if it merely shifts. I am less confident in predicting the *outcome* of the model than in the *validity* of the model itself.

  **Claim 4: The project is feasible within one term.**
  *   **Confidence:** **High (95%)**.
  *   **Reasoning:** The scope is limited to a specific thought experiment and a specific theoretical modification. No empirical data is needed. The word count is standard for a journal article. The main risk is philosophical writer's block, but the formal structure provides a skeleton to hang the argument on.

