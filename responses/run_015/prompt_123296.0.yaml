  2.  **Deconstruct Skolem's Paradox:**
      *   ZFC proves there exist uncountable sets (e.g., $\mathbb{R}$).
      *   Löwenheim-Skolem Theorem: If ZFC has a model, it has a countable model.
      *   In a countable model $M$, there is an element $U \in M$ such that $M \models "U \text{ is uncountable}"$.
      *   But externally, the domain of $M$ is countable, so $U$ (as a subset of the domain) is countable.
      *   Resolution: The bijection $f: \mathbb{N} \to U$ exists externally, but $f \notin M$. The model "doesn't know" about the bijection.
      *   Key distinction: Element vs. Function. The missing object is the *function* (the mapping), not the elements themselves.

