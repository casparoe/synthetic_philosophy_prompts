  # The Walled Town

  The registry seals up the city wall.
  No citizen is missing from the hall.
  *No mapping binds the numbers to this set.*

  The surveyor stands beyond the county call.
  He sees the stones, the battlements, and all.
  I count them first and second, third and yet.

  The function waits where outside shadows stall.
  Inside the function cannot stand at all.
  *No mapping binds the numbers to this set.*

  The axiom holds, though walls are built so tall.
  Truth depends on where we make the call.
  I count them first and second, third and yet.

  Is power set absolute or merely small?
  The continuum waits behind the high wall.
  *No mapping binds the numbers to this set.*

  Who stands above to watch the model fall?
  Is our continuum behind a wall?
  *No mapping binds the numbers to this set.*
  I count them first and second, third and yet.

  ***

  **Note to the Visitor:**
  The italicized refrain speaks from within the walled town (the countable model), asserting uncountability because no pairing function exists inside. The roman refrain speaks from the county surveyor's view (the metatheory), enumerating the inhabitants externally. Both are true. What is missing from the town is not an inhabitant, but the function mapping them to numbers. The poem leaves unresolved whether this relativity limits the sets themselves or merely our language about them — including this explanation.
