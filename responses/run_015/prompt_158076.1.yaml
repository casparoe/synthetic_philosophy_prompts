prompt: |-
  I am a journalist writing about science and ideas for a general audience, currently developing a feature on virtual worlds. Before I can assess competing claims about virtual objects and virtual harms, I need the underlying conceptual architecture spelled out.

  Write the desiderata that any adequate theory of virtual objecthood and virtual harm must satisfy—specifically within immersive virtual environments, not merely conventional digital representations. For each requirement, provide the motivating case or conceptual distinction that makes it necessary: for instance, why a theory must distinguish between the destruction of a socially meaningful virtual heirloom and the deletion of a disposable in-game asset; why it must reconcile phenomenological presence with the causal closure of the physical world; and why it must respect the difference between derivative and non-derivative properties without collapsing into naive realism about pixels.

  Indicate which desiderata are non-negotiable—those any adequate theory must preserve regardless of camp—and which reflect preferences of particular philosophical camps (such as commitments to ontological parsimony, phenomenal realism, or strict physicalism). Then, briefly, evaluate how virtual fictionalism, derivative-realist accounts, and strong virtual realism fare against the list.

  Crucially, I want you to identify whether any subset of these requirements is jointly unsatisfiable: for example, can a theory maintain both that virtual harms are causally efficacious in a non-derivative sense and that all causation remains physically closed? I do not want a bibliography, citation list, or reading recommendations—this is for conceptual clarification, not source-gathering. Write in a rigorous but accessible register suitable for an educated non-specialist reader.
