answer: |-
  You mistake the horizon for the ground beneath your feet. That this individual capital extracts a bounty while employing scarce labour is precisely how the law asserts itself, not how it is negated. The surplus value realised here is indeed largely a transfer from those sectors still bleeding living labour; the market price does not reflect the individual value produced in your ghostly factory, but the social value determined by the average composition of capital across the sphere. So long as one worker remains elsewhere producing surplus value, this firm can claim a share. You say the whole sector goes this way? Then the mass of profit must fall, even if the rate appears stable for the early adopters. You see a stable profit rate; I see a mass of capital struggling to find enough labour to exploit to maintain the total sum. As for the *Grundrisse*, you read my prophecy as my surrender. When I wrote that general intellect would overwhelm labour time as the measure, I was not saving the theory of profit; I was describing the point where capital becomes a fetter on production! If labour time ceases to be the measure, value ceases to exist, and thus *capital* ceases to exist. That is not a bug in my theory; it is the revolutionary conclusion.

  But we are not there yet, and you evade the contradiction in your own description. The machines grow cheap, yes, because the labour required to produce them falls—but this is merely a countertendency that delays the inevitable devaluation of the existing stock. You say the control layer was designed once and copies for nothing; but design is labour, crystallised past labour, and it transfers value only gradually. Who maintains this stack? You mention a handful of contract engineers—are they the sole source of new value for this entire output, or is their labour being intensified to a degree that disguises their number? And tell me: the energy bill you dismiss as mere cost—is that electricity generated by automated plants, or does it rely upon a grid maintained by living labour? We must find where the living labour hides, for it cannot simply vanish while money still accumulates.
