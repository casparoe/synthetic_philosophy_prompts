  I’m a backend engineer who’s pretty fluent in event sourcing and distributed tracing, but I only know Al-Ghazali’s occasionalism from a podcast episode. Could you restate his claim that fire doesn’t actually burn cotton — that God creates every effect directly, with no necessary causal link between what we call cause and effect — using only the vocabulary of event-driven microservices, database transactions, and message brokers? Treat God as the single admin writing every state change directly, and treat fire and cotton as services that never actually invoke each other. Then give me the residue report: which parts translate cleanly, which have to be distorted to fit (for instance, treating habitual conjunction as retry logic or idempotency keys), and what is left over that the distributed-systems vocabulary can’t capture at all — especially the denial that anything besides God has real causal power. Is that leftover a limit of my framework, or is it philosophical language that was never precise?

  Please answer with a JSON object using exactly these fields:
  - "translations": array of { "philosophical_point": string, "systems_analog": string, "status": "clean"|"distorted"|"forced" }
  - "residue_items": array of { "missing_or_distorted_idea": string, "why_the_vocab_fails": string, "blame": "framework_limit"|"original_vagueness" }
  - "overall_verdict": string, 2-3 sentences on whether my 'God as direct database writer' intuition captures the argument or misses the metaphysical point

  Keep it casual — I dont care about citations, just whether the mapping actually holds.
