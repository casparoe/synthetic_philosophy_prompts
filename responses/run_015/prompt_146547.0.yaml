answer: |-
  # SEMINAR HANDOUT: THE CONDITIONAL DECISION TREE

  **Starting Commitments:**
  1.  **The Equation:** You want $P(\text{If } A \text{ then } C) = P(C|A)$. (Motivation: Conditional bets look sane).
  2.  **Non-Triviality:** You want conditionals to be contingent (probability strictly between 0 and 1).

  **The Problem:** Lewis's triviality results suggest you cannot hold both, given standard assumptions about truth, probability, and logic. Follow the tree to find your position.

  ---

  ### NODE 1: The Simple Bet (Truth Conditions)
  **Case:** Three cards (King, Queen, Jack) face down. You bet on: *"If it's not the King, it's the Queen."* The card is revealed to be the Jack. You win the bet.
  **Question:** Did you win because there was a **fact of the matter** that made the conditional true (truth-conditional), or was the bet **void/cancelled** and the payout just a rule of the game (no truth-conditional content)?

  *   **LEFT (No Fact of the Matter):** Conditionals do not express propositions; they have acceptability conditions, not truth conditions.
      *   ⬇
      *   **LEAF A: The Acceptability View** (e.g., Adams/Suppose).
      *   *Status:* Keeps Equation (as a norm of acceptability); Saves Non-Triviality.

  *   **RIGHT (Fact of the Matter):** Conditionals express propositions; they are true or false in worlds.
      *   ⬇
      *   **NODE 2**

  ---

  ### NODE 2: The Peeked Card (Zero Antecedent)
  **Case:** You peeked. You know the card is the King. The antecedent *"If it's not the King"* has probability 0.
  **Question:** Is $P(C|A)$ **undefined** here (and thus the Equation does not apply), or can we still assign a probability to the conditional (via limit, imaging, or stipulation)?

  *   **LEFT (Undefined/Restricted):** The Equation only holds when $P(A) > 0$.
      *   ⬇
      *   **LEAF B: The Restricted Domain View**.
      *   *Status:* Keeps Equation (locally); Saves Non-Triviality by restricting scope.

  *   **RIGHT (Defined):** We can assign probabilities even when the antecedent is known false.
      *   ⬇
      *   **NODE 3**

  ---

  ### NODE 3: The Nested Bet (Iteration)
  **Case:** A coin is tossed. You consider: *"If the coin landed Heads, then (if I bet, I win)."*
  **Question:** Is this a **coherent single proposition** that can be the object of belief (Iteration allowed), or is it gibberish/logically illicit (No Iteration)?

  *   **LEFT (No Iteration):** Conditionals cannot appear in the consequent of conditionals.
      *   ⬇
      *   **LEAF B: The Restricted Domain View** (Collapses with Leaf B above).
      *   *Note:* Whether you restrict by antecedent probability or by logical form, you are saving the Equation by limiting its jurisdiction.

  *   **RIGHT (Iteration Allowed):** Nested conditionals are valid propositions.
      *   ⬇
      *   **NODE 4**

  ---

  ### NODE 4: The Learning Case (Synchronic vs. Diachronic)
  **Case:** You currently doubt $A$. You will soon learn $A$ for certain.
  **Question:** Does the Equation describe your **current** degrees of belief ($P_{now}(A \to C) = P_{now}(C|A)$), or does it only describe how you **should change** your beliefs upon learning $A$ ($P_{new}(C) = P_{old}(A \to C)$)?

  *   **LEFT (Diachronic/Update):** The Equation constrains belief *revision*, not current state. You update by "Imaging" (shifting probability mass to nearest $A$-worlds) rather than Conditionalization.
      *   ⬇
      *   **LEAF C: The Dynamic/Imaging View**.
      *   *Status:* Keeps Equation (diachronically); Saves Non-Triviality; Avoids Triviality Proof (which assumes conditionalization).

  *   **RIGHT (Synchronic):** The Equation describes your current state. $P(A \to C)$ *is* $P(C|A)$ right now.
      *   ⬇
      *   **NODE 5**

  ---

  ### NODE 5: The Double Bookkeeping Check (Semantic Identity)
  **Case:** You have a similarity semantics (Stalnaker-style) that gives truth conditions.
  **Question:** Must the probability of that truth condition **match** the conditional probability $P(C|A)$, or is the Equation merely a **pragmatic norm** on assertion that can diverge from semantic probability?

  *   **LEFT (Norm Only / Double Bookkeeping):** They can diverge. The Equation is a rule for when it is *appropriate to suppose*, not a semantic identity.
      *   ⬇
      *   **LEAF D: The Pragmatic Rescue** (See Collapse Note below).
      *   *Status:* Keeps Truth Conditions; Gives up Equation (as semantic identity).

  *   **RIGHT (Semantic Identity):** The probability of the proposition *must* be the conditional probability.
      *   ⬇
      *   **NODE 6**

  ---

  ### NODE 6: The Triviality Bullet
  **Case:** You have affirmed Truth Conditions, Defined Zero-Antecedents, Iteration, Synchronic Equation, and Semantic Identity.
  **Question:** Lewis proves this set of commitments implies all conditionals are trivial (probability 0 or 1). Do you accept this result?

  *   **LEFT (Accept):** Conditionals are trivial. There are no contingent conditionals.
      *   ⬇
      *   **LEAF E: The Trivialist**.
      *   *Status:* Keeps Truth Conditions + Equation; Gives up Non-Triviality. (Often considered empty/unattractive).

  *   **RIGHT (Reject):** This result is impossible; something above must be wrong.
      *   ⬇
      *   **CELL F: THE IMPOSSIBLE SPACE**.
      *   *Status:* **Empty.** (Incoherent per Lewis's proof).

  ---

  ### INSTRUCTOR NOTES & COLLAPSE FLAGS

  **1. Collapse of "Double Bookkeeping" (Node 5 Left)**
  *   **Destination:** Collapses into **Leaf D (The Pragmatic Rescue)**.
  *   **Why:** If you deny the semantic probability must match $P(C|A)$, you have formally given up the Equation as a constraint on truth-conditional probability. You are in the same formal box as the view that says "The Equation is false, but pragmatically compelling." The difference is motivational, not structural.

  **2. Collapse of Restrictions (Node 2 Left & Node 3 Left)**
  *   **Destination:** Both route to **Leaf B (The Restricted Domain View)**.
  *   **Why:** Whether you block triviality by banning zero-probability antecedents or banning nesting, the structural move is identical: you prevent the triviality proof from running by limiting the logical domain of the Equation. Students often treat these as distinct views, but the tree treats them as the same survival strategy.

  **3. Indistinguishable Leaves**
  *   **Leaf A (Acceptability)** vs. **Leaf D (Pragmatic Rescue):**
      *   **Flag:** These are often empirically indistinguishable in betting behavior.
      *   **Difference:** Leaf A denies truth conditions exist. Leaf D says they exist but don't govern the betting odds. In a seminar discussion, these two leaves will look identical unless you press on metaphysics (what exists) rather than epistemology (how we bet).

  **4. Empty Cells**
  *   **Cell F (The Impossible Space):**
      *   **Why Empty:** **Incoherent.** This is the exact conjunction of premises Lewis proves leads to contradiction. If a student tries to occupy this leaf, ask them to write down the proof and find the error.
  *   **Leaf E (The Trivialist):**
      *   **Why Empty:** **Unattractive.** While logically consistent, this view renders conditional discourse vacuous. It is rarely defended as a final destination, usually serving as a *reductio* to force movement to other branches.

  **5. Placement of Required Views**
  *   **"Double Bookkeeping":** Placed at **Node 5 (Left)**. Collapses into Leaf D.
  *   **"Imaging/Update":** Placed at **Node 4 (Left)**. Earns its own leaf (Leaf C) because it preserves the Equation diachronically, distinguishing it from views that abandon the Equation entirely.
