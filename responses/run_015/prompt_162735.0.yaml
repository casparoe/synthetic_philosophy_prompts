      *   The user suggests this is about *priors* and *cost of error*. This feels very strong.
      *   The user suggests *identity conditions*. Also strong. When does "Arthur" stop being Arthur?
      *   The user suggests *oral transmission mechanics*. This is the weak link empirically, but central to the argument.

  3.  **Evaluate the User's Hypothesis:**
      *   *Priors/Burden of Proof:* Yes. This is Bayesian. One side sets $P(Event) \approx 0$ without contemporary proof. The other sets $P(Event) > 0$ based on narrative persistence.
      *   *Identity Conditions:* Yes. This is the "Ship of Theseus" problem applied to history. If the Exodus story changes from a small slave escape to a national founding myth, is it the "same" event?
      *   *Oral Transmission:* Yes, but as the user notes, we lack data.
      *   *Professional Penalties:* This is a crucial sociological factor. In academia, being called "uncritical" (false positive) is often worse than being called "over-skeptical" (false negative).
