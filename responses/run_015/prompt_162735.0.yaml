  4.  **Formulate the Diagnosis:**
      *   The user is mostly right, but there's a deeper layer: *Category Errors*.
      *   The debate treats "History" as a singular category when it's actually functioning as two different disciplines: *Event-History* (Res Gestae) and *Memory-History* (Historia Rerum Gestarum).
      *   The stalemate persists because both sides are trying to answer the same question ("Is this true?") using different definitions of "this" (the event vs. the narrative) and "true" (correspondence vs. coherence/cultural impact).
      *   The "Professional Penalties" point is vital. Skepticism is safer for a career than credulity.

  5.  **Define Progress:**
      *   Progress isn't finding new evidence (that's luck).
      *   Progress is *decomposition*. Separating the ontological status of the event from the sociological function of the myth.
      *   We need to stop asking "Did Arthur exist?" and start asking "What layer of social reality does the Arthur narrative occupy?"
      *   Formal point: Explicitly stating priors. "I am operating under a prior that requires contemporary documentation."
      *   Argument for stagnation: If the evidence base is static, the debate is purely ideological.

  6.  **Identify Failure Conditions:**
      *   Where could this diagnosis be wrong?
      *   If new evidence *does* appear (e.g., an inscription), the debate resolves instantly. So the diagnosis only holds in evidence-scarce environments.
      *   If the debate is actually about *national identity* or *ideology* rather than epistemology. (e.g., Exodus isn't about history; it's about Zionism or Biblical literalism).
