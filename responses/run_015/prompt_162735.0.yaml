answer: |-
  Your hypothesis is remarkably precise, and I believe you have correctly identified the structural components of the stalemate. You are right that this is not a dispute about evidence, because the evidence has not changed. It is a dispute about epistemology, metaphysics, and professional risk assessment. However, I would refine your diagnosis by suggesting that these three disputes are not merely running in parallel; they are hierarchical. The disagreement about priors is driven by the asymmetry of professional penalties, and the confusion over identity conditions is a symptom of failing to distinguish between two different objects of study.

  Here is the diagnosis, the path to progress, and the conditions under which this diagnosis would fail.

  ### The Diagnosis

  You are correct that the debate is fueled by conflicting default priors. The "invention default" side operates with a Bayesian prior that $P(Event) \approx 0$ absent contemporary documentation. The "memory default" side operates with a prior that $P(Event) > 0$ given narrative persistence. But you asked if something else is doing the work. I argue that the engine driving these priors is the **asymmetry of professional penalties** you mentioned, which creates a sociological imperative masquerading as a methodological one.

  In professional academic history, the cost of a Type I error (a false positive: asserting an event occurred when it did not) is significantly higher than the cost of a Type II error (a false negative: denying an event occurred when it did). To claim Arthur existed without hard proof risks labeling as a romantic or a pseudo-historian; to claim he did not exist risks only being called overly skeptical. Skepticism is career-safe; credulity is career-threatening. Consequently, the "invention default" is not just an epistemological stance; it is an institutional defense mechanism. The "memory default," often found in literary studies, archaeology, or popular history, operates under a different reward structure where uncovering cultural continuity is valued over strict verification.

  This leads to the second layer: the **category error regarding identity conditions**. Both sides are asking "Is this story true?" but they are pointing to different referents.
  *   Side A asks: *Did the specific event described in the text occur in spacetime?* (Res Gestae)
  *   Side B asks: *Does this narrative preserve a social memory of a transformative experience?* (Historia Rerum Gestarum)

  When you discuss Troy, Side A wants to know if the Iliad accurately describes a Late Bronze Age siege. Side B wants to know if the Iliad encodes a genuine cultural memory of conflict between Mycenaeans and Hittites. These are compatible truths, but they are treated as mutually exclusive verdicts. The stalemate persists because a "Yes" from Side B is heard as a "Yes" from Side A, triggering Side A's defense mechanisms against Type I errors.

  Finally, your point about oral transmission is the empirical black box. Both sides rely on analogies (Parry-Lord formulaic theory for Side B; telephone-game degradation for Side A), but neither has data specific to the transmission chains of the second millennium BCE. This uncertainty allows both sides to project their priors onto the gap.

  ### What Would Count as Progress

  Progress will not come from new pottery shards or textual fragments. It will come from **decomposition and transparency**.

  1.  **Decompose the Question:** The magazine should explicitly separate the *ontological question* (Did X happen?) from the *sociological question* (Why does this story exist in this form?). A piece on the Exodus should not be asked to verdict on the historical migration until it has first established the literary and cultural function of the Exodus narrative. We must stop treating "myth" as a synonym for "falsehood" and start treating it as a distinct category of historical evidence that testifies to the *values* of the teller, if not the *actions* of the ancestor.
  2.  **Formalize the Priors:** Authors should be required to state their epistemic baseline. "This article proceeds from the assumption that oral traditions require external corroboration to be treated as historical fact" versus "This article proceeds from the assumption that persistent toponyms and narrative structures indicate a historical kernel." This does not solve the dispute, but it prevents the participants from talking past one another. It moves the debate from "You are ignoring the evidence" to "We are weighing the evidence differently."
  3.  **Acknowledge the Cost of Error:** A mature historiography would admit that the "invention default" is a choice to minimize false positives at the expense of erasing genuine but poorly documented history. Acknowledging this trade-off would humanize the skeptics and discipline the traditionalists.

  Progress looks like an article that concludes: "We cannot know if Arthur fought at Badon Hill (ontological), but the attribution of Badon Hill to Arthur by the 9th century indicates a specific political need to unify British resistance against a specific Saxon threat (sociological)." That is a verdict both sides can accept, because it answers two different questions.

  ### Where This Diagnosis Fails

  My diagnosis rests on the assumption that the participants are primarily interested in historical truth, however defined. It is most likely to fail if the dispute is actually **ideological or theological** in nature.

  1.  **Identity Politics and Nationalism:** If the debate over the Exodus is fundamentally about modern Israeli or Palestinian identity, or if the debate over Arthur is about British national cohesion, then epistemological decomposition will not work. The stakes are not about error costs; they are about legitimacy. In these cases, the "memory default" is a claim to land or rights, and the "invention default" is a tool of delegitimization. No amount of Bayesian transparency will resolve a conflict over belonging.
  2.  **The Discovery of a "Smoking Gun":** My diagnosis assumes an evidence-scarce environment. If an administrative tablet is found explicitly listing "Arturius" as a *Dux Bellorum*, or if Egyptian records confirm a mass Hebrew departure, the stalemate vanishes instantly. The debate is only structural because the evidence is ambiguous. If the evidence becomes decisive, the sociological and epistemological layers collapse back into simple fact.
  3.  **Advances in Cognitive Science:** I noted that the oral transmission question is a black box. If cognitive science or digital humanities develops a robust model for how long specific narrative details survive in oral transmission without literate support, the empirical basis of the "memory default" could be quantified. If we learn that specific names do not survive more than 150 years orally, the "memory default" loses its empirical footing.

  ### Conclusion

  You are right to suspect that the debate is stagnant because it is actually three different debates wearing a single mask. The path forward is not to find a verdict on Troy, Arthur, or the Exodus, but to change the editorial policy so that the mask is removed. Require authors to specify whether they are hunting for events or analyzing memories. Require them to state their tolerance for Type I vs. Type II errors.

  If you do this, you may find the debate becomes less fiery, because the combatants will realize they are often fighting on different battlefields. However, if you find that even with these distinctions, the anger remains, you will know that the dispute was never about history at all, but about who owns the past.
