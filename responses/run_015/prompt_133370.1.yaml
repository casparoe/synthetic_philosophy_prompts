answer: |-
  1. "Where the room is"
  The econometricians and statistician will open fire, aligning on identifiability and expected value dominance; they view risk aversion as bias in public spending. The program directors will defend the informal overlay as political necessity, fearing your rule kills moonshots. The actuary is your natural ally on risk but will argue for solvency constraints over utility distortion. The board member knows Buchak's framework and will target the axiomatic justification. Expect the statistician to raise the political objection (budget cuts) usually reserved for directors, or the actuary to challenge the coherence of cohort-level weighting. The board member may surprise you by siding with the econometricians on normative grounds, arguing that public funds mandate risk neutrality.

  2. "The objections, in the order they will come"

  1.  **The Normative Standard (Econometricians):** "Public money requires risk neutrality. Risk aversion is hoarding resources that belong to beneficiaries." *Damage: Critical.* **Reply:** Neutrality assumes infinite horizon and survival. We face a truncated horizon where failure ends the program. **Weakness:** Defines "failure" loosely.
  2.  **The Axiomatic Attack (Board Member):** "You are violating Independence. Why abandon VNM rationality for public funds?" *Damage: High.* **Reply:** Allais preferences are rational under structural constraints; axioms describe agents, not institutions facing ruin. **Weakness:** Doesn't solve dynamic inconsistency over cycles.
  3.  **The Capital Argument (Actuary):** "Risk belongs in capital reserves, not preference weighting. Set a buffer, then maximize EV." *Damage: High.* **Reply:** Buffers are political fiction; this rule makes the trade-off explicit and transparent. **Weakness:** Hard to quantify buffer needed without this rule.
  4.  **The Noise Objection (Statistician):** "Outcome models are order-of-magnitude guesses. Calibrating $k$ to 1.3 vs 1.6 is signal-free noise." *Damage: Medium.* **Reply:** We report recommendations across the full range; robustness matters more than precision. **Weakness:** If noise is structural, rule fails.
  5.  **The Moonshot Fear (Directors):** "This penalizes high-variance, high-upside work. You will fund safe mediocrity." *Damage: High.* **Reply:** Cohort-level weighting protects moonshots via diversification; only uncorrelated ruin is penalized. **Weakness:** Carve-out might not be enough.
  6.  **The Arbitrage Risk (Board/Stat):** "Inconsistency between cohort and one-shot buckets creates gaming opportunities." *Damage: Medium.* **Reply:** Administrative boundary is clear; borderline cases go to the carve-out. **Weakness:** Borderline cases will game it.
  7.  **The Calibration Opacity (Directors):** "Committee calibration of $k$ is subjective and political." *Damage: Low.* **Reply:** Current overlay is opaque; this makes the bias explicit and adjustable. **Weakness:** Still looks like a black box.
  8.  **The Correlation Assumption (Actuary):** "You assume diversification works; what if outcomes are correlated?" *Damage: Medium.* **Reply:** We use conservative correlation estimates; stress tests show resilience. **Weakness:** Hard to verify.

  3. "What I should concede before anyone asks"
  Concede immediately that our outcome models are noisy and that $k$ is not empirically discovered but normatively chosen. Acknowledge the one-shot carve-out boundary will be porous and invite the directors to define it. Admit that if the agency had infinite capital buffers, risk neutrality would be correct. This disarms the statistician on noise and the actuary on capital theory, leaving them to argue only about the degree of risk aversion, not its existence. It frames the rule as a pragmatic adjustment to constraints rather than a theoretical triumph.

  4. "The reply that has to land"
  The core argument is that public agencies face a non-linear loss function disguised as risk aversion. A cycle with zero visible successes triggers legislative budget cuts that foreclose future cycles. This is not a preference; it is a structural constraint of the political environment. Expected value maximization assumes we can survive a string of losses to capture the long-run mean. We cannot. Our time horizon is discrete and punitive. Therefore, maximizing EV maximizes the probability of institutional ruin. The risk-weight function $r$ is not distorting preferences; it is modeling the survival constraint. If you deliver this as a preference argument, the econometricians will crush you on normative grounds. If you deliver it as a survival constraint, it becomes a technical necessity. Fail to distinguish these, and you look like you're hoarding public money.

  5. "The question I am hoping nobody asks"
  Your guess is correct; that is the lethal question. If ruin is an attitude, the board member will argue public funds mandate neutrality. If it is a feature of the world, it must be modeled in the payoff structure, not the weighting function. If you say it belongs in $r$, you admit it is subjective preference. You must argue it is a feature of the world: the payoff function itself is non-linear because future funding depends on current success. However, since modeling that dependency explicitly is computationally intractable for this committee, $r$ acts as a proxy for the truncated horizon. If pressed, admit $r$ is a heuristic for a dynamic programming problem we cannot solve. Do not claim it is pure preference.
