  13/20. I have drafted the specific feedback below exactly as you could hand it back to the student, followed by a note to you about the question itself. You have written with great clarity and you have clearly grasped the core of Dennett's analogy regarding the centre of gravity, which is the hardest part of this topic for beginners. Your explanation of the Cartesian Theatre and why the self is an abstraction rather than a lump of stuff is accurate and well-expressed. You also make a reasonable attempt to distinguish Parfit from Dennett by focusing on identity over time versus the nature of the self at a time, which is a valid distinction for this level of study. However, there are two significant issues that limit your mark. The first is length. The question asked for about 700 words and your answer is closer to 400. This means you haven't had space to develop your ideas fully, particularly in the comparison between Parfit and Dennett where you could have explored whether Parfit also offers an ontology of the self, not just an account of survival. The second issue is more serious. The question preamble explicitly stated that Dennett insists he is not denying that there are selves, only that they are abstract objects. In your final paragraph, you conclude that strictly speaking there are no selves and that they are useful fictions that do not exist. This directly contradicts the framing you were given. For Dennett, abstracta like centres of gravity do exist, they just do not exist as concrete things. You need to be careful to distinguish between not being a physical substance and not existing at all. To correct this, you should reword your conclusion to say that the self exists as an abstraction located where the narrative is sustained, rather than saying it does not exist. In the case of Maria, you argue convincingly that the narrative is in the file, but you should acknowledge that Dennett might still locate the centre of gravity in the body that the narrative is about, even if others tell the story. You have a good instinct for the material but you need to read the question constraints more closely and push your analysis further to meet the word count. Regarding your question to me about whether the prompt was unfair or gave something away, I think it is a fair question for an introductory class. The preamble actually does a lot of heavy lifting by defining the terms for them, which is helpful rather than giving too much away. The fact that the student missed the explicit instruction in the preamble about Dennett not denying selves suggests they rushed the reading rather than the question being misleading. You might consider emphasizing in class that when a prompt defines a philosopher's position, contradicting that definition is a critical error, regardless of whether the student's independent reading suggests otherwise.
