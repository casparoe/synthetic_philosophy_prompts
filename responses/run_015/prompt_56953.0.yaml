answer: |-
  # The Moral Deference Inventory

  **Instructions:** Read each scenario and select the option that best matches your reaction. There are no right answers. Be honest about your immediate instinct, not what you think a philosopher would say.

  **1. The Partner's Conviction**
  Your partner, whom you trust deeply, tells you that eating meat is morally wrong. They cannot explain the philosophical argument to you, and you can't quite reconstruct it yourself, but you trust their judgment. You stop eating meat.
  *   A. You feel you are now doing the right thing, and your belief is justified.
  *   B. You feel you are doing the right thing, but you worry you aren't truly a moral agent regarding this issue.
  *   C. You feel you are merely mimicking them; you haven't actually formed a moral belief of your own.

  **2. The Friend's Grievance**
  A close friend tells you that a third person is treating you disrespectfully. You haven't noticed it yourself, and your gut says the third person is fine.
  *   A. You accept your friend's testimony immediately; they see things you miss.
  *   B. You thank them, but you feel you must verify the disrespect through your own experience before accepting it.
  *   C. You suspect your friend is projecting; accepting their word would be an abdication of your own self-knowledge.

  **3. The Intuition Clash**
  A respected ethicist argues that a practice you find deeply repulsive (e.g., certain medical interventions) is morally permissible. Their argument is sound, but your visceral reaction remains strong.
  *   A. You override your visceral reaction; the expert's reasoning carries more weight.
  *   B. You suspend judgment; you can't accept the conclusion until your intuition aligns with the argument.
  *   C. You stick with your intuition; first-person moral perception trumps third-party argument.

  **4. The Pragmatic Compliance**
  An expert panel tells you that donating to Charity X is the most moral use of your funds. You remain personally unconvinced that Charity X is good, but you donate anyway because you trust their process.
  *   A. This is a responsible way to act; you don't need full conviction to do the right thing.
  *   B. This is hypocritical; action should only flow from genuine personal belief.
  *   C. This is impossible; if you truly donate, you must believe it's good on some level.

  **5. The Emergency**
  You are in a complex emergency situation. A stranger with a "Safety Officer" badge tells you to push a button that might hurt someone to save others. You have no time to think.
  *   A. You push the button; in emergencies, institutional authority substitutes for moral deliberation.
  *   B. You push the button, but you feel you are acting on non-moral pressure, not moral knowledge.
  *   C. You refuse; you cannot outsource life-and-death decisions, even under pressure.

  **6. The Complex Policy**
  A trusted advocacy group tells you that a specific, dense tax policy is the only just option. You lack the economic knowledge to verify it.
  *   A. You adopt their position as your own moral view.
  *   B. You support the policy politically, but you don't claim to *know* it is just.
  *   C. You withhold support; if you can't understand the justice of it, you shouldn't enforce it on others.

  **7. The Child's Question**
  Your child asks why hitting is wrong. You could explain the complex social contract, or just say, "Because I said it's wrong, and you trust me."
  *   A. The trust-based answer is sufficient and morally appropriate for now.
  *   B. The trust-based answer is necessary for safety, but it doesn't count as moral education yet.
  *   C. The trust-based answer is harmful; they need reasons to develop their own moral compass.

  **8. The Historical Wrong**
  A marginalized group testifies that a historical statue honors a figure who committed atrocities. You have read the standard history books which say he was a hero.
  *   A. You accept their testimony as definitive; their lived heritage grants epistemic authority.
  *   B. You accept their testimony as a prompt to investigate, but not as proof in itself.
  *   C. You require archival evidence; testimony alone cannot rewrite historical moral facts.

  ***

  # Scoring Key

  Tally your answers to determine your coordinates on the two axes.

  **Axis 1: Epistemic Optimism (Can testimony yield moral knowledge?)**
  *   **High Score:** You believe testimony can justify moral belief or knowledge.
  *   **Low Score:** You believe testimony is insufficient for moral knowledge/understanding.

  **Axis 2: Normative Deference (Is deferring morally acceptable/admirable?)**
  *   **High Score:** You believe deferring to others is sometimes virtuous or required.
  *   **Low Score:** You believe moral autonomy is required; deference is suspect.

  **Point Values:**
  *   **Option A:** +1 Epistemic, +1 Normative
  *   **Option B:** +1 Epistemic, -1 Normative **OR** -1 Epistemic, +1 Normative *(See Note Below)*
  *   **Option C:** -1 Epistemic, -1 Normative

  *Note on Option B:* Option B is the "Mixed" response. To score accurately, apply the following specific weights per question:
  *   **Q1:** B = -1 Epistemic, -1 Normative (Focus on lack of agency)
  *   **Q2:** B = +1 Epistemic, -1 Normative (Trusts knowledge, rejects deference on self)
  *   **Q3:** B = -1 Epistemic, -1 Normative (Suspension implies testimony failed)
  *   **Q4:** B = -1 Epistemic, -1 Normative (Hypocrisy charge)
  *   **Q5:** B = -1 Epistemic, +1 Normative (Action ok, knowledge no)
  *   **Q6:** B = -1 Epistemic, +1 Normative (Support ok, knowledge no)
  *   **Q7:** B = -1 Epistemic, +1 Normative (Pedagogy ok, knowledge no)
  *   **Q8:** B = +1 Epistemic, -1 Normative (Trusts prompt, rejects authority)

  *(Simplified Scoring: Just count your A's, B's, and C's and map to the grid below based on your dominant tendency.)*

  **The Grid:**

  | | **High Normative Deference** (Deference is OK) | **Low Normative Deference** (Autonomy Required) |
  | :--- | :--- | :--- |
  | **High Epistemic Optimism** (Testimony gives knowledge) | **1. The Disciple**<br>Testimony provides knowledge, and using it is virtuous. | **2. The Independent Thinker**<br>Testimony *can* give knowledge, but you shouldn't rely on it. |
  | **Low Epistemic Optimism** (Testimony fails) | **3. The Pragmatist**<br>Testimony doesn't give knowledge, but you should follow it anyway. | **4. The Autonomist**<br>Testimony fails, and deference is morally immature. |

  **Position Descriptions:**
  *   **The Disciple:** Full optimism. You see moral community as a web of trust where knowledge flows freely and relying on it is good.
  *   **The Independent Thinker:** You grant that experts *know* things, but you hold that moral worth requires grasping the reasons yourself.
  *   **The Pragmatist:** You doubt you truly *know* the truth via testimony, but you think trust or social harmony makes deference the right move.
  *   **The Autonomist:** Full pessimism. Moral truth requires first-person grasp, and deferring is a failure of moral character.

  ***

  # Diagnostic & Limitations

  **The Discriminator (Question 4)**
  Question 4 (Acting without Belief) is designed to split **The Pragmatist** from the other three cells.
  *   Selecting **A** pushes you toward **The Pragmatist** (Low Epistemic, High Normative). It isolates those who separate *action-guidance* from *knowledge-acquisition*.
  *   Selecting **B** or **C** pushes you toward **The Autonomist** or **The Independent Thinker**, as it insists on a unity between internal conviction and external action.

  **Indistinguishable Pairs**
  This quiz cannot cleanly separate **The Disciple** (High/High) from **The Pragmatist** (Low/High).
  *   *Why:* Both groups endorse deference in practice. A respondent in the Disciple cell often *says* they "know" the truth via testimony, while a Pragmatist says they "don't really know but trust anyway." In concrete scenarios (like Q5 or Q6), their behavioral outputs are identical, and self-reporting on internal "knowledge states" is notoriously unreliable.

  **The Empty Cell**
  **The Pragmatist (Low Epistemic / High Normative)** often comes out empty or unstable.
  *   *Diagnosis:* This combination is theoretically precarious; if you admit testimony gives you no moral knowledge, it is difficult to argue that deferring to it is *admirable* rather than merely expedient or blindly obedient. Most respondents who want to defer (High Normative) will instinctively claim they gain some understanding (High Epistemic) to avoid the charge of heteronomy.
