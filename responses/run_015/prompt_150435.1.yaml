answer: |-
  The stalemate between you and your friend comes down to a category error. Caruso is arguing against a metaphysical notion of desert that basically doesn't exist outside of theology, while Dennett is defending a pragmatic notion of desert that is essential for society to function. You can side with Dennett without needing to prove that humans have magical, uncaused free will. The key is to stop thinking of "desert" as a cosmic ledger where bad deeds create a spiritual debt that must be paid, and start viewing it as a mechanism of calibrated trust within a cooperative system.

  Here is the argument for why just deserts survive free will skepticism, provided we understand responsibility as a dynamic status of trust rather than a static metaphysical property.

  **The Shift from Metaphysics to Normative Practice**

  Caruso's skepticism hits a wall only if we assume that punishment is about inflicting suffering to balance the scales of the universe. If that's the goal, he's right: in a deterministic world, no one is the "ultimate source" of their actions, so no one deserves suffering in a cosmic sense. But that's not what moral responsibility is for in a secular, naturalistic framework.

  Responsibility is the operating system of social cooperation. For a society to work, agents need to be predictable, and more importantly, they need to be responsive to reasons. When Dennett argues that moral competence is a real skill, he means that some agents have the hardware and software to process normative expectations (laws, morals, social cues) and adjust their behavior accordingly. When you hold someone responsible, you aren't invoking a ghost in the machine; you are acknowledging that they are a functioning node in the network who *can* be influenced by social sanctions.

  Therefore, "desert" isn't about paying back the past. It's about securing the future of the normative practice. If someone violates a norm and we treat it as meaningless—like a tree branch falling on a car—we degrade the practice itself. We signal to everyone else that normative expectations don't actually govern behavior. Punishment, in this view, is the serious affirmation that the rules matter. The offender "deserves" this response not because they are cosmically guilty, but because they are a participant in a game where breaking rules triggers specific consequences necessary to keep the game playable.

  **Calibrated Trust as the Metric of Desert**

  This is where the concept of calibrated trust comes in. We don't trust agents blindly; we trust them based on their demonstrated competence. When an agent commits a wrongful act, they aren't incurring a metaphysical sin; they are burning trust capital. The "punishment" or blame is the societal reaction to that loss of trust.

  This explains why we punish intentional harm differently from accidental harm, even if the physical outcome is the same. In a deterministic world, both events were caused. But the intentional harm signals a breakdown in the agent's alignment with the normative system. They have shown they cannot be trusted to prioritize the group's rules. The "desert" here is the proportional withdrawal of trust and liberty required to protect the system and signal the severity of the breach.

  If we adopted Caruso's quarantine model strictly, we would treat criminals like carriers of a virus. We would lock them up until they are no longer dangerous, but we wouldn't blame them. The problem is that viruses don't respond to blame. They don't understand norms. Human agents do. By withholding blame and treating them purely as medical or safety hazards, we strip them of their status as agents. Paradoxically, this makes rehabilitation harder because it removes the normative feedback loop they need to recalibrate their own behavior. To treat someone as deserving of blame is to respect their capacity to do better.

  **The Diachronic Dimension: Why Your Friend Was Onto Something**

  This is where your friend's point about the "diachronic" nature of desert actually strengthens the Dennettian view rather than undermining it. If responsibility is calibrated trust, then it cannot be a binary switch that is either on or off at the exact moment of a crime. It has to be a trajectory.

  Trust is built or eroded over time. When your friend suggested that you accumulate desert through repeated choices, they were describing the erosion of trust. A first-time offender might retain a high degree of trust; we assume the breach was an anomaly. A repeat offender has demonstrated a stable pattern of normative incompetence. They have, over time, proven that they are not a reliable participant in the social contract. Therefore, they "deserve" harsher sanctions, not because God is angrier, but because the evidence shows their trust calibration is fundamentally broken. The desert is tied to the stability of their agency over time.

  Conversely, this model perfectly explains why desert diminishes when capacities change. If an agent suffers a brain injury, develops a severe addiction, or undergoes genuine rehabilitation, their relationship to the normative system changes.
  *   **Brain Injury/Mental Illness:** If the hardware required to process normative reasons is damaged, the agent can no longer function as a trust-holder. We reduce their desert not out of pity, but because blaming them becomes functionally incoherent. They are no longer full participants in the practice.
  *   **Addiction:** This is the tricky middle ground. If addiction hijacks the decision-making apparatus, the agent's competence is compromised. However, if they repeatedly refuse treatment or engage in behaviors that deepen the dependency, they are diachronically responsible for the erosion of their own competence. They deserve blame for the choices that led to the loss of control, even if control is diminished now.
  *   **Rehabilitation:** If an agent demonstrates, over time, a renewed capacity for normative competence, their "desert" shifts. They rebuild trust. To keep punishing them at the original level would be unjust, not because the past changed, but because their current role in the normative system has changed.

  **Conclusion: Desert as a Living Status**

  Caruso wants to sever the link between determinism and blame because he thinks blame requires magical freedom. But if you view desert as the maintenance of a shared normative practice, it requires no magic. It only requires that agents are capable of learning and that society has an interest in regulating behavior through reasons rather than just force.

  Your friend's diachronic twist is the missing piece that makes this robust. It acknowledges that agency isn't a snapshot; it's a history. We hold people responsible based on the story of their choices and their capacities. When that story changes—through degradation of capacity or restoration of competence—what they deserve changes with it.

  So, Dennett is right, but for a deeper reason than he sometimes articulates. Just deserts survive free will skepticism because "desert" is just another word for the standing you hold within a community of agents. It is real, it is gradable, and it is necessary. To deny it is to treat human beings as objects to be managed rather than partners to be trusted, and that is a metaphysical error far more damaging than determinism.
