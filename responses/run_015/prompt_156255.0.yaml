answer: |-
  Here is a runnable plan for your evening. It is designed to be material-heavy and instruction-light, forcing the problem into their hands before it enters their heads.

  ### **Preparation (Before the Evening)**

  You need to create three specific handout packs. Do not tell them what the evening is about; title the handouts simply "Session 4: Shape & Sign."

  **Pack A: The Borderline Deck (12 sets)**
  *   Create 20 small cards per set (business card size).
  *   **15 Clear Cases:** Standard *a*s (single-storey, two-storey, italic, bold, handwritten).
  *   **5 Borderline Cases:** An *a* with the tail missing (looks like *o* or *c*); an *a* rotated 90 degrees; a child's circle-and-stick *a*; an *a* where the loop is open; a glyph that is technically an *a* in a very obscure font but looks like a *u*.
  *   *Note:* Include a few non-letters that look like letters (a Greek alpha, a reversed *e*).

  **Pack B: The Reduction Sheet (12 copies)**
  *   Print a large, standard two-storey *a* (like Times New Roman) in the center of the page.
  *   Surround it with 5 empty boxes labeled "Step 1" through "Step 5."
  *   Provide a stack of tracing paper.

  **Pack C: The Transplant Word (12 copies)**
  *   Print the word "mop" in a very distinct, heavy serif font (e.g., Bodoni).
  *   Leave a large blank space where the "o" is, or print the "o" very faintly in grey.
  *   Provide a stack of tracing paper and scissors.

  **Room Setup:**
  *   Tables arranged so everyone can see each other's hands, not just their own paper.
  *   Central pile of markers, pencils, scissors, glue sticks.
  *   **The "Sound Trap" Card:** Print one large card and keep it in your pocket. It should read: *"If you mention the sound the letter makes, you must pay a penalty: You have to draw the letter with your non-dominant hand."* (This handles the linguistics drift playfully).

  ---

  ### **The Run of Play (75 Minutes)**

  #### **Phase 1: The Sort (15 Minutes)**
  **Goal:** Establish that recognition is instant but agreement on edges is fragile.

  1.  **Hand out Pack A.** Tell them: *"Sort these into two piles. Left: 'Reads as A'. Right: 'Does not read as A'. You have 3 minutes. Go."*
  2.  **The Twist:** After 3 minutes, say: *"Swap your 'Borderline' cards (the ones you hesitated on) with the person to your right. They must now decide for your pile."*
  3.  **Observation:** Watch the arguments. "That's an *o*." "No, it's an *a* without a tail."
  4.  **Hold:** Do not resolve the arguments. Collect the cards. Ask: *"Did anyone find a card they were sure about, that their neighbour disagreed with?"* (Acknowledge answers, give no verdict).

  #### **Phase 2: The Surgeon's Cut (20 Minutes)**
  **Goal:** Prove that no single feature is essential.

  1.  **Hand out Pack B and tracing paper.**
  2.  **Instruction:** *"Trace the big 'a' in the center. Now, in Box 1, redraw it removing one small part, but it must still be an 'a'. In Box 2, remove something else. Keep going until Box 5, where it is the simplest possible 'a' you can make that still reads as 'a'."*
  3.  **Constraint:** *"You cannot add ink, only remove or simplify."*
  4.  **Comparison:** After 15 minutes, have them lay their sheets in the center of the table.
  5.  **Prompt:** *"Look at everyone's Box 5. Did anyone end up with the same shape?"* (They won't). *"Did anyone break it so far it became a different letter?"* (They will).
  6.  **Point:** You have 12 different definitions of the "minimum a" on the table. None match.

  #### **Phase 3: The Foreign Exchange (20 Minutes)**
  **Goal:** Isolate identity from style and context.

  1.  **Hand out Pack C.**
  2.  **Instruction:** *"On tracing paper, draw an 'a' in your own natural handwriting. Cut it out. Place it into the word 'mop' where the 'o' is (making 'map')."*
  3.  **Step 2:** *"Now, trace the 'o' from the heavy serif font. Cut it out. Place it into the word 'map' written in your own handwriting."*
  4.  **Discussion:** *"Which one looks wrong? Which one is harder to read? Is the letter still an 'a' in both cases?"*
  5.  **Outcome:** They will admit the serif 'o' in their handwriting looks terrible but is still an 'o'. Their handwritten 'a' in the serif word looks foreign but is still an 'a'. The identity survives the style clash.

  #### **Phase 4: The Specification (15 Minutes)**
  **Goal:** The failure of definition.

  1.  **Instruction:** *"Take a fresh sheet. You are texting instructions to an alien who has never seen writing. Write the rule for drawing an 'a'. It must be precise enough that the alien doesn't draw a 'd' or an 'o'."*
  2.  **Time:** 10 minutes.
  3.  **Test:** Swap sheets. Try to draw what the other person described.
  4.  **Result:** Almost certainly, the drawings will not match the intended letter, or the rules will be contradicted by the work they did in Phase 1 (e.g., "Must have a loop" is contradicted by the single-storey *a*).

  #### **Debrief (15 Minutes)**
  **Goal:** Map the frustration to your original question.

  1.  **Reveal:** *"I didn't tell you the theme. The question I've been chewing over is: What makes every 'a' an 'a'?"*
  2.  **Map the Phases:**
      *   *Phase 1:* You recognized them instantly (Intuition).
      *   *Phase 2:* You couldn't agree on the parts (Feature Failure).
      *   *Phase 3:* The letter survived style changes (Context Independence).
      *   *Phase 4:* You couldn't write the rule (Definition Failure).
  3.  **The Plain Words (Your Part):** *"I can read an 'a' I've never seen. But I can't define it. If it were a list of features, I could write the list. If it were just the sound, 'c' and 'k' would be the same letter. It seems we hold a shape in our heads that is flexible, like a memory of a face rather than a blueprint of a house. We know the person, but we can't list the measurements."*
  4.  **Close:** *"Keep the sheets. If you solve it, let me know."*

  ---

  ### **Troubleshooting & Recovery**

  | What Goes Wrong | Why | Recovery |
  | :--- | :--- | :--- |
  | **"It's about the sound."** | Participants default to phonetics. | Pull the **Sound Trap Card**. Make it a game. *"Ah, but 'a' in 'cat' vs 'car' sounds different. Does the letter change? If you say yes, how many letters are there?"* Keep it light, move on. |
  | **The Experts Dominate.** | The brush letterers dictate the "correct" form. | In Phase 2, enforce **anonymous comparison**. Collect the sheets, shuffle them, and lay them out without names. Ask *"Which is the minimal a?"* rather than *"Who drew the best a?"* |
  | **Phase 4 feels boring.** | Writing rules is dry. | Change the prompt: *"Draw the 'a' that is forbidden."* (i.e., describe the boundary where it stops being an *a*). |
  | **Time Overrun.** | Cutting and tracing takes longer than expected. | Drop Phase 3 Step 2. Just do the handwritten *a* in the serif word. The point is the clash, not the bidirectional swap. |

  ---

  ### **Confidence Assessment**

  **Phase 1 (The Sort): High Confidence (90%)**
  *   **Why:** Sorting is low-barrier. Everyone can do it. The disagreement on edge cases is almost guaranteed if the deck is rigged with ambiguous glyphs.
  *   **Watch for:** People rushing.
  *   **Swap:** If they sort too fast, add a "Maybe" pile. Force them to put at least 3 cards in "Maybe."

  **Phase 2 (The Surgeon): Medium Confidence (70%)**
  *   **Why:** People are afraid to "ruin" the letter. They might stop too early.
  *   **Watch for:** Everyone stopping at the single-storey *a* and refusing to go further.
  *   **Swap:** If they stall, intervene: *"Remove the loop. Just the stick and curve. Is it still an a?"* Force the breakdown.

  **Phase 3 (The Exchange): High Confidence (85%)**
  *   **Why:** Visual dissonance is immediate. It feels "wrong" physically.
  *   **Watch for:** People focusing on neatness rather than the identity clash.
  *   **Swap:** If they get bogged down in cutting, use tracing paper overlay instead of cutting.

  **Phase 4 (The Specification): Low Confidence (50%)**
  *   **Why:** This is the most abstract. Adults often hate feeling stupid. Failing to write a rule can feel like a personal failure rather than a philosophical point.
  *   **Watch for:** Silence or frustration.
  *   **Swap:** If they struggle, turn it into a game of "Telephone." One person whispers a rule to the next, who draws it. Reveal the distortion at the end. This makes the failure *funny* rather than *frustrating*.

  ---

  ### **Hidden Assumptions (Where I Have Committed You)**

  1.  **Visual Primacy:** This design assumes the identity of the letter is primarily visual, not phonetic. By focusing on shape sorting and drawing, I am biasing the room against the "sound" argument. If the truth is that letter identity *is* phonetic, this workshop will lead them to a false negative.
  2.  **The "Family Resemblance" Theory:** The debrief pushes the Wittgensteinian idea (we recognize things by overlapping similarities, not a single shared rule). If there *is* a strict geometric rule (e.g., specific curvature ratios) that you haven't found yet, Phase 2 will obscure it rather than reveal it.
  3.  **Stability of Recognition:** The plan assumes everyone in the room recognizes "a-ness" the same way. If cultural or educational background changes what counts as a valid *a* (e.g., single vs. two-storey prevalence), Phase 1 will show disagreement that isn't about the philosophy of identity, but just literacy habits.
  4.  **The "Alien" Metaphor:** In Phase 4, asking them to describe it to an alien assumes the problem is language/description. It assumes the rule exists but is ineffable. It is possible the rule doesn't exist at all. The workshop is designed to prove the *rule* is missing, not that the *identity* is unstable.

  **Final Note:** You mentioned you want them to run into the problem rather than hear it. This plan hides the question until the last 15 minutes. The risk is that without the question, Phase 2 and 4 feel like arbitrary games. You must sell the *tasks* as interesting puzzles in their own right ("How little ink can you use?" "Can you break the font?") so the frustration feels earned, not manufactured.
