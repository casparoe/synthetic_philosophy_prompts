answer: |-
  Your flatmate's argument is a classic piece of philosophical judo: it uses the weight of your own premises (localism, convention-dependence) to throw you into a corner (moral relativism). It feels compelling because steps (1) through (3) look innocuous individually, but the jump to (4) is where the logic snaps.

  You are right to be worried. If you accept the argument as written, you lose the ability to criticize local corruption, and you turn etiquette violations into moral sins.

  Here is the diagnosis: **The argument breaks at (3), supported by a hidden equivocation in (2).**

  You can keep (1) (conventions determine content) and the core of (4) (visitors aren't exempt from fair play), but you must reject the claim in (3) that *any* local regularity generates a *moral* duty.

  Here is the step-by-step breakdown of why (3) fails, how to fix (2), and how to apply your "guest clause" without it being ad hoc.

  ### 1. Why Premise (3) is the Broken Step
  **The Claim:** "There's no in-principle limit on what a local practice can require."
  **The Error:** This conflates **descriptive regularities** with **normative conventions**.

  Just because everyone does $X$ in place $Y$ does not mean there is a *convention* that creates a *moral obligation* to do $X$. For a regularity to generate a moral duty, it usually needs to serve a cooperative function that relies on mutual expectation.

  *   **The Queue:** This is a **cooperative convention**. It solves a coordination problem (who gets served first) fairly. Everyone benefits from the order, so everyone has a duty to maintain it.
  *   **The Scrum:** This is a **non-cooperative equilibrium**. It's not a convention; it's a breakdown of convention. People shove because they don't trust others to wait. It doesn't solve a coordination problem; it creates a war of all against all. There is no moral duty to participate in a breakdown.
  *   **The Bribe:** This is a **corrupt regularity**. It functions like a convention (everyone expects it), but its *purpose* is to subvert a just system (fair allocation of permits).

  **The Test (Avoiding Ad Hocery):**
  To avoid your flatmate's charge that you're just picking cases you like, use the **Function Test**:
  > *Does the regularity serve a mutually beneficial cooperative end, or does it rely on harm/exploitation?*

  *   **Queueing:** Cooperative end (orderly service). **Binding.**
  *   **Tipping:** Cooperative end (subsidizing wages in a specific labor market). **Binding** (if you participate in the market).
  *   **Bribery:** Exploitative end (buying undue advantage). **Not Binding.**
  *   **Scrum:** Competitive end (survival of the fittest). **Not Binding.**

  By rejecting (3), you stop the slide into "must bribe." You acknowledge that while the *practice* exists, it lacks the *normative force* to bind a moral agent.

  ### 2. The Sneaky Work in Premise (2)
  **The Claim:** "The practice... doesn't sort people into locals and visitors."
  **The Error:** This confuses the **content** of the rule with the **source** of the obligation.

  Your flatmate is right that the *sign* on the queue doesn't say "Locals Only." But the *reason* you are bound by the queue isn't the sign; it's the **Principle of Fair Play**.

  *   **Content (Local):** *How* you queue (single line vs. number ticket) is determined by local convention. (This saves your Premise 1).
  *   **Obligation (Universal):** *Why* you queue (because you are benefiting from a cooperative scheme) is determined by universal morality.

  This addresses your worry about (2) being sneaky. Yes, you need moral resources from "outside the practice" (fairness, reciprocity) to explain *why* the practice binds anyone. But this doesn't undercut (1). (1) says conventions determine *what* you owe; Fairness says conventions determine *that* you owe something when you benefit.

  **The Fix:** Modify (2) to read: "The content of the duty is fixed by the practice, but the **bindingness** of the duty is fixed by the visitor's voluntary acceptance of the practice's benefits."

  ### 3. Evaluating Your "Guest Clause"
  Your intuition is essentially the **Principle of Fair Play**. Let's refine your two conditions to make them robust:

  *   **(a) Benefit Acceptance:** She has to actually use the system. (If she doesn't eat at the restaurant, she doesn't tip. If she doesn't take the taxi, she doesn't scrum.)
  *   **(b) Point of the Practice:** You phrased this as "conformity even when nobody can tell." That's a bit Kantian. A better formulation is: **"The practice must be reasonably just and cooperative."**

  **Does this prove too much?**
  *   **Free-Riding:** No. If you eat the meal (benefit) in a tipping culture (cooperative scheme), you are free-riding if you don't tip. The clause correctly identifies this as wrong.
  *   **Bribery:** No. Even if you benefit (get the permit), the scheme is not "reasonably just." The clause correctly identifies this as optional (or forbidden).

  ### 4. Applying the Fix to Your Cases

  Here is how this diagnosis handles the specific examples you're worried about:

  **1. The Scrum (Shared Taxis)**
  *   **Verdict:** No moral duty to shove.
  *   **Why:** Fails the Function Test. It's a non-cooperative equilibrium.
  *   **Visitor Status:** A visitor can stand aside. They aren't violating a moral norm, just opting out of a chaotic system. If they *do* shove, they aren't "following local custom," they are "participating in a disorder."

  **2. The Bribe (Permit Application)**
  *   **Verdict:** No moral duty to pay.
  *   **Why:** Fails the Function Test. It undermines public justice.
  *   **Visitor Status:** The visitor is morally permitted (perhaps required) to refuse. The "local practice" argument holds no water against corruption.

  **3. The Gift Refusal (Etiquette)**
  *   **Verdict:** Moral duty? No. Etiquette duty? Yes.
  *   **Why:** This is the case that scares you, but it's actually safe. You need to distinguish **Morality** from **Etiquette**.
      *   Morality concerns harm, fairness, and rights.
      *   Etiquette concerns social smoothness and signaling respect.
  *   **Visitor Status:** A visitor who accepts a gift immediately hasn't done anything *wrong* (immoral). They have been *rude* (socially clumsy). Your paper is on "everyday morality," so you are allowed to say this falls outside the scope of moral obligation. The flatmate is conflating "breaking a norm" with "committing a moral fault."

  **4. Tipping (The US Context)**
  *   **Verdict:** Moral duty to tip.
  *   **Why:** Passes the Function Test. It's a cooperative wage-subsidy scheme.
  *   **Visitor Status:** If the visitor eats the food, they accept the benefit of the scheme. Refusing to tip is free-riding. The "I'm from elsewhere" excuse fails because the waiter relies on the tip regardless of the customer's origin.

  **5. Jaywalking (Red Light, No Cars)**
  *   **Verdict:** Depends on the *coordination*, not the law.
  *   **Why:** This is where (1) does the most work.
      *   **In Germany:** The convention is "Wait for green." Drivers expect pedestrians to wait. Crossing on red disrupts the predictive model drivers use, even if no car is visible *now*.
      *   **In Italy:** The convention is "Cross if clear." Drivers expect pedestrians to cross. Waiting on green might actually confuse drivers.
  *   **Visitor Status:** The visitor is bound by the **safety coordination**. If the local convention is "Wait," waiting is the moral duty because it maintains the safety system. If the local convention is "Go," going is fine. The law is secondary; the *expectation of others* is what creates the duty.

  ### 5. What This Costs You
  You asked what you lose by rejecting (3) and modifying (2).

  1.  **You lose Pure Conventionalism:** You cannot say "Morality is *only* local conventions." You have to admit there is a layer of universal morality (fairness, non-harm) that judges *which* conventions bind us.
  2.  **You lose the "Insider Critique" Problem:** Your flatmate argued that if duty is fixed by practice, insiders can't criticize the practice. By adding the "Function Test" (is it cooperative/just?), you restore the ability to criticize. An insider can say, "This scrum is inefficient and dangerous; we should queue."
  3.  **You gain nuance on "Visitor":** You don't have to say visitors are totally exempt or totally bound. They are bound by **Fair Play** (don't free-ride on cooperative schemes) but exempt from **Corruption** (don't bribe) and **Etiquette** (it's okay to be a bit clumsy with gifts).

  ### Summary for Your Paper
  The flatmate's argument is valid but unsound. It fails because **not all regularities are moral conventions.**

  *   **Keep (1):** Conventions determine the *content* of the duty (18% vs. 0%, queue vs. scrum).
  *   **Reject (3):** Regularities that are corrupt or non-cooperative (bribes, scrums) do not generate moral duties.
  *   **Modify (2):** The duty binds visitors not because the rule says so, but because the **Principle of Fair Play** binds anyone who voluntarily benefits from a just, cooperative scheme.

  This lets you condemn the line-cutter (violates Fair Play), excuse the non-briber (violates Justice), and tolerate the gift-acceptor (violates Etiquette, not Morality). It saves your thesis without swallowing the relativist pill.
