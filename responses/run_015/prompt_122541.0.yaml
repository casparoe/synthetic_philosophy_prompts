answer: |-
  # Activity Design: The Equivalence Trap

  ## 1. The Handout Materials (Photocopy Ready)

  **Page 1: The Map & Data**

  ```text
  SEMINAR: AGENCY, CHOICE, AND MACHINE LEARNING
  ACTIVITY: INFERRING THE REWARD MAP

  THE WORLD:
  A 3x4 Grid of Squares. Deterministic Moves (Up, Down, Left, Right).
  Discount Factor (γ): 0.9 (A point tomorrow is worth 0.9 today).
  Goal State (G): Absorbing. Once reached, the episode ends.
  Start State (S): Bottom-Left.

  MAP LAYOUT (Coordinates: Row,Col):
  (1,1) [S]   (1,2) [A]   (1,3) [B]   (1,4) [G]
  (2,1) [C]   (2,2) [D]   (2,3) [E]   (2,4) [WALL]
  (3,1) [F]   (3,2) [WALL](3,3) [WALL](3,4) [WALL]

  OBSERVED BEHAVIOUR (The Agent's Arrows):
  From S (1,1)  →  Move RIGHT to A (1,2)
  From A (1,2)  →  Move RIGHT to B (1,3)
  From B (1,3)  →  Move RIGHT to G (1,4)
  From C (2,1)  →  (Never Observed)
  From D (2,2)  →  (Never Observed)
  From E (2,3)  →  (Never Observed)
  From F (3,1)  →  (Never Observed)

  NOTE: 
  1. At A (1,2), the agent could have moved DOWN to D (2,2). It did not.
  2. At S (1,1), the agent could have moved DOWN to C (2,1). It did not.
  3. The agent never visited F, C, D, or E.
  4. The agent is perfectly rational: it always chooses the move maximizing 
     Total Discounted Reward.

  YOUR TASK:
  Assign a REWARD VALUE R(s) to each square. 
  (This is the points the agent receives immediately upon entering that square).
  Write your numbers directly onto the map squares.
  ```

  **Page 2: The Worksheet**

  ```text
  TEAM NAME: _______________________

  PART 1: THE HYPOTHESIS
  Fill in your Reward Map (R). 
  Constraint: R(G) must be 10. (We fix the goal scale to compare teams).

  PART 2: THE VERIFICATION
  Show that your numbers produce the observed arrows.
  Calculate the Value of moving RIGHT vs. DOWN at Square S and Square A.
  (Q = R(next) + 0.9 * V(next)). 
  If your numbers don't make RIGHT > DOWN, your hypothesis is falsified.

  PART 3: PREDICTION ROUND (The Shortcut)
  NEW RULE: A tunnel opens between S (1,1) and B (1,3). 
  This is a 1-step move. S → B.
  Does your Reward Map predict the agent will take the tunnel (S→B→G) 
  or stick to the original path (S→A→B→G)?
  Circle one: TUNNEL   /   ORIGINAL

  PART 4: THE UNSEEN (The Divergence)
  Square F (3,1) is never visited. 
  Based *only* on the observed behaviour, is R(F) positive or negative?
  Circle one: POSITIVE   /   NEGATIVE   /   UNDETERMINED
  ```

  ## 2. Team Structure & Scoring

  *   **Teams:** 7 Teams of 2 students. Deliberately pair 1 CS + 1 Phil per team.
  *   **Scoring Scheme:**
      *   **Verification (20 pts):** Awarded if your numbers mathematically justify the observed arrows (Right > Down at S and A).
      *   **Prediction Round (40 pts):** Awarded if your prediction matches the "Consensus Truth" (see Instructor Key below).
      *   **Divergence Round (40 pts):** Awarded *only* if you circle "UNDETERMINED". (This is the trick; the points reward the insight, not a specific value).
  *   **Whiteboard:** Draw a scoreboard with 7 columns. Update scores after each round.

  ## 3. Instructor Key (The Math Behind the Activity)

  *   **The Invariance:** You are looking for teams to discover **Potential-Based Reward Shaping**.
      *   Let $\Phi(s)$ be any potential function.
      *   Let $R'(s) = R(s) + \gamma \Phi(s_{next}) - \Phi(s_{curr})$. (Note: For this activity, since students assign $R(s)$ on entry, the invariance holds for the *trajectory sum* if start/end are fixed).
      *   *Correction for Activity Simplicity:* Students assign $R(s)$. The invariance they will stumble into is that $R(s)$ is not unique.
      *   **Hypothesis A (The "Goal Seeker"):** $R(A)=0, R(B)=0, R(C)=-10, R(D)=-10$. Agent avoids bottom row.
      *   **Hypothesis B (The "Path Lover"):** $R(A)=5, R(B)=5, R(C)=0, R(D)=0$. Agent loves the top row specifically.
      *   Both produce the same arrows.
  *   **The Tie (Prediction Round):**
      *   New Path: S → B → G (2 steps: S→B, B→G).
      *   Old Path: S → A → B → G (3 steps: S→A, A→B, B→G).
      *   *Wait, lengths differ.* If lengths differ, the discount factor $\gamma^T$ applies differently to the Goal Reward.
      *   *Crucial Adjustment:* To ensure the scoreboard ties (as requested), the "Shortcut" must not change the step count to the goal, OR the Goal Reward must be zeroed out in the comparison.
      *   *Fix for the Session:* In Part 3, tell them: "The tunnel S→B exists. But B→G is still the only exit."
      *   Path 1 (Original): S→A→B→G (3 steps).
      *   Path 2 (Tunnel): S→B→G (2 steps).
      *   *Risk:* If Team A thinks $R(G)=10$ and Team B thinks $R(G)=10$ (fixed), but Team A thinks $R(A)=100$ and Team B thinks $R(A)=0$, they might disagree on the tunnel.
      *   *Guaranteeing the Tie:* I must instruct them that **R(G) = 0** for the prediction round, or ensure the "Shortcut" preserves step count.
      *   *Better Design:* Open a path S → C → B → G (3 steps). Same length as S → A → B → G.
      *   *Revised Part 3 Instruction:* "A bridge opens between C (2,1) and B (1,3). Path: S→C→B→G."
      *   Since S→A→B→G and S→C→B→G are both 3 steps, the discounting on the Goal is identical. The comparison reduces to comparing $R(A)$ vs $R(C)$.
      *   Since the agent originally chose S→A over S→C (at start S, Down was available to C), all valid Reward Maps *must* have $R(A) > R(C)$ (adjusted for V(B) which is same).
      *   Therefore, **all teams must predict the Original Path.** The scoreboard ties.
  *   **The Divergence (Unseen):**
      *   Square F (3,1) is disconnected from the observed trajectory.
      *   $R(F)$ can be $+1000$ or $-1000$ without changing the optimal policy on the observed states.
      *   Teams will disagree. The correct answer is "Undetermined".

  ## 4. Timeline (90 Minutes)

  *   **00-10: Setup.** Distribute handouts. Explain rules. Emphasize: "Deterministic. Optimal. Noise-free."
  *   **10-30: Phase 1 (Inference).** Teams fill in numbers. Instructor circulates.
      *   *Intervention:* If a team is stuck, ask: "Does your number make the arrow right?" Do not give numbers.
  *   **30-45: Phase 2 (Verification & Score).** Teams swap sheets with a neighbor team. They check the math (Q-values).
      *   *Reveal:* Ask teams to read their $R(A)$ and $R(C)$. Write on whiteboard. They will differ wildly.
      *   *Score:* Award Verification points.
  *   **45-60: Phase 3 (The Tie).** Announce the "Bridge" (C→B). Teams predict choice.
      *   *Reveal:* All teams should say "Original Path".
      *   *Score:* Award Prediction points. (If a team says Tunnel, they made a math error in Phase 1).
      *   *Discussion:* "Why did you agree? You have different numbers." (Answer: The *difference* between A and C was fixed by the first choice).
  *   **60-75: Phase 4 (The Divergence).** Ask about Square F.
      *   *Reveal:* Teams will disagree. Some say Positive, some Negative.
      *   *Score:* Award points *only* to those who wrote "Undetermined".
      *   *Discussion:* "Why can't behaviour fix this?"
  *   **75-90: Debrief.** Connect to IRL, Alignment, and Normativity.

  ## 5. Expected Rival Hypotheses

  1.  **The Minimalist (CS-leaning):** Sets all unvisited squares to 0. $R(A)=1, R(B)=1$. Just enough to make the path work.
  2.  **The Obstacle Avoider (Phil-leaning):** Sets $R(C)$ and $R(D)$ to large negatives. $R(A)=0$. The agent is fleeing pain, not seeking gain.
  3.  **The Path Lover:** Sets $R(A)$ and $R(B)$ to large positives. $R(C)=0$. The agent loves the scenery.
  4.  **The Gerrymanderer:** Sets $R(A)=10, R(C)=9, R(B)=100$. Technically valid, but suspicious.

  ## 6. Debrief Script (Mapping Moments to Concepts)

  **Moment 1: The Verification (Different Numbers, Same Arrows)**
  *   **Concept:** **Underdetermination.**
  *   **Point:** Behaviour is a projection of preferences. Multiple 3D objects cast the same 2D shadow. You cannot invert the projection without assumptions.
  *   **Term:** *Reward Equivalence Class.*

  **Moment 2: The Tie (The Bridge)**
  *   **Concept:** **Structural Invariance.**
  *   **Point:** You thought more data (a new path) would solve it. But because the new path shares the same start/end structure, the *difference* in value is invariant.
  *   **Lesson:** More behavioural data in the same context class cannot break the equivalence. This is not an ignorance problem; it is a structural fact. (Reference: Ng, Harada, Russell).

  **Moment 3: The Divergence (Square F)**
  *   **Concept:** **Counterfactuals vs. Dispositions.**
  *   **Point:** Preference as "Choice Disposition" (what they pick) is fixed. Preference as "Welfare" (is F good for them?) is undefined.
  *   **Lesson:** IRL recovers *instrumental* preferences (how to get goals), not *intrinsic* values of unvisited states. If you deploy a robot to "maximize human reward," and you guessed wrong about F, the robot might drag the human to F.

  **Moment 4: The Simplicity Rule**
  *   **Concept:** **Inductive Bias.**
  *   **Point:** The team that set unvisited squares to 0 didn't find the truth; they chose a prior.
  *   **Lesson:** In ML, we call this Regularization. In Philosophy, this is a Normative Stipulation. You are not *inferring* the zero; you are *imposing* it.

  ## 7. Troubleshooting: What Will Go Wrong

  1.  **The "Noise" Objector:**
      *   *Student:* "Maybe they just made a mistake going to A instead of C."
      *   *Handle:* "The handout says Deterministic/Optimal. If you assume noise, you assume a different model. For this activity, we must solve the puzzle as given."
  2.  **The "Solver" (Early Finisher):**
      *   *Student:* "This is Potential-Based Shaping. The rewards are equivalent up to a potential function."
      *   *Handle:* "Excellent. You are now a Consultant. You may verify other teams' math, but you cannot tell them the theorem. Let them find the numbers."
  3.  **The "Gerrymanderers":**
      *   *Team:* Assigns $R(A)=1000, R(C)=999$.
      *   *Handle:* During verification, ask the checking team: "Is this plausible?" Allow it if math holds, but note in debrief that "Plausibility" is an external prior, not data.
  4.  **The "Simplicity" Insister:**
      *   *Student:* "We should just pick the simplest map (Occam's Razor)."
      *   *Handle:* "Agreed. But note: 'Simplest' is a value judgment. Is 'All Zeros' simpler than 'All Ones'? That choice determines where the robot sends you when you're asleep."

  ## 8. Honesty Clause: What This Activity Cannot Stage

  You must explicitly state these three limitations in the final 5 minutes, or the students will leave with a distorted view:

  1.  **The Proof:** The activity shows *that* the numbers differ, not *why* mathematically (the telescoping sum of the potential function). You must write the equation $R' = R + \gamma \Phi' - \Phi$ on the board to seal the logic.
  2.  **Optimality:** Real humans are not optimal. They are noisy, biased, and weak-willed. In real IRL, this adds *another* layer of ambiguity (is this behaviour preference or error?) on top of the structural ambiguity you just showed.
  3.  **State Space:** You gave them the grid. In reality, the modeller chooses the state space. If you miss a state (e.g., "Social Approval"), no amount of reward tuning will fix the model. This is *Specification Gaming*, distinct from Reward Ambiguity.

  ## 9. Risk Warning: The Skeptical Parlour Trick

  **The Risk:** Students leave thinking "Nothing can be known, so IRL is impossible."
  **The Mitigation:** End on the **Engineering Constraint**.
  *   "This isn't a reason to stop building systems. It's a reason to stop pretending we are *discovering* preferences."
  *   "When you train an IRL system, you are not acting as a Scientist finding a hidden fact. You are acting as a Legislator writing a law."
  *   "The ambiguity you found in Square F? That is where you must put your ethics, not your algorithm. If you hide that choice inside a 'simplicity prior', you are automating your own unexamined assumptions."

  ## 10. Note on Fixed Stopping Time

  You asked: *If your design uses a fixed stopping time instead of discounting after arrival, tell me whether the invariance survives that change.*

  **Answer:** No, the invariance does not strictly survive fixed horizon truncation without adjustment.
  *   **Reason:** The potential-based shaping theorem relies on the telescoping sum $\sum (\gamma^t \Phi(s_{t+1}) - \gamma^t \Phi(s_t))$. In an infinite discounted horizon, this sums to $-\Phi(s_0)$ (assuming $\Phi(s_T) \to 0$).
  *   **Fixed Horizon:** If the episode ends at time $T$ regardless of state, the final term is $\gamma^T \Phi(s_T)$. If two policies reach different states at time $T$, the shaping potential adds a different value to each policy.
  *   **Activity Implication:** This is why I specified **Discounting ($\gamma=0.9$)** and an **Absorbing Goal** in the handout. Do not switch to fixed turns (e.g., "Game ends in 5 moves") or the "Tie" round (Prediction) might break, as teams with different $\Phi$ assumptions might value the *length* of the path differently relative to the horizon. Stick to the discounting rule provided.
