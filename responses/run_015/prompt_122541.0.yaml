prompt: |-
  I co-teach a cross-listed upper-level seminar, Agency, Choice and Machine Learning — fourteen students, half from computer science and half from philosophy, ninety minutes, one whiteboard, a projector, no laptops in the room and no robot to borrow. Next week's session is on inverse reinforcement learning and the thought that we might read human preferences off human behaviour, and I want the students to run into the central limitation rather than be told it. Last year I did this as a lecture with a handout and it went badly: everyone agreed in the abstract that behaviour underdetermines what an agent wants, everyone then blamed noise, partial observability or the agent's own imperfect rationality, and nobody felt the underdetermination as a structural fact that more data cannot fix. So I would like a runnable activity — rules, roles or teams, materials, a payoff or scoring scheme — in which the point shows up in what happens in the room. What they should come away seeing is the difference between two kinds of ambiguity, the kind that dissolves when you get more behaviour and the kind that no amount of behaviour, in any environment you rebuild, can dissolve; and then, because the second kind turns out not to be a behavioural ambiguity at all, what the question we actually wanted answered was really asking.

  Let me fix the setting so no one can appeal to ignorance, and state the fact the session has to land. Hand out a small grid world — please design it: ten to fourteen squares, deterministic moves, one absorbing goal square, at least two distinct routes from start to goal, at least one square every route passes through, at least one square the agent is never observed in, and somewhere the agent could visibly dawdle or double back. Give teams the agent's complete behaviour, an arrow in every square saying where it goes next, noiseless, with the transition rules and the discount printed on the handout (say, a point tomorrow is worth 0.9 points today, and discounting continues after arrival at the goal). Ask each team to write down what the agent wants as one number per square. The fact they must collide with is this: take any assignment of a number Φ to the squares and change the reward of a move from s to s′ by adding 0.9·Φ(s′) − Φ(s); the total discounted score of every route from a given starting square then shifts by exactly the same amount, so the ranking of routes is untouched and no choice changes — and this holds in the world as given and in any world you rebuild it into by adding or closing paths, and it survives even if you stop assuming perfect optimality and let the agent be a soft, noisy chooser that favours higher-scoring options without always taking the best. (I have a vague memory that the reinforcement-learning literature names this; use the name in your reply to me if you like, but the students will not know it and the session must not depend on it. If your design uses a fixed stopping time instead of discounting after arrival, tell me whether the invariance survives that change.) Your job is to make fourteen people rediscover this by proposing numbers and finding that they disagree while all of them reproduce the arrows: the rival hypotheses must be ones real students would actually volunteer — she wants to get to the café versus she likes the riverside stretch and finds leaving it costly — not numbers gerrymandered to look different, and the disagreement must be verified against the data rather than asserted, so build in a check in which each team confirms its numbers generate the arrows. Then two beats I want engineered by the rules and the scoreboard rather than announced by me. First, a scored prediction round in which the world is altered — a short cut opens, a path closes — and every team's numbers predict the same choice, so the scoreboard ties and the room discovers that a rebuilt world will not separate them either. Second, a divergence beat where the numbers finally do come apart, and note that it cannot be another behavioural prediction, since the first beat has just shown those all agree: it has to be a question of a different kind, such as which square it would be better for her to be placed in, where to put the single bench we can afford, or what she thinks of the square she has never visited.

  Please give me the map and the behavioural data as I would photocopy them, the wording of the handout, the team structure and scoring scheme, a timeline with minute marks, the rival hypotheses you expect students to produce with their actual numbers, and a debrief that maps each moment onto a piece of the idea — including the distinction between preference as choice-disposition, preference as what is good for someone, and preference as what someone would choose among options they have never faced, and the point that picking one member of the equivalence class by a simplicity rule is a stipulation and not an inference, especially since which member looks simplest depends on how you write the numbers down. Be honest about what the activity cannot stage and I will have to supply in discussion: the proof itself, the fact that real humans are not optimal and are only partly observed, and the fact that the state space is itself something the modeller chose. Tell me what will predictably go wrong the first time I run it — the team that produces gratuitous numbers nobody would defend, the team that insists we just pick the simplest, the student who blames noise, the one who sees the trick in the first five minutes — and how to handle each. Do not give me a reading list or citations; I have those. And tell me, finally, where the activity risks making the lesson look like a sceptical parlour trick rather than the thing that should worry someone building a system that infers what we want from what we do.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level seminar, "Agency, Choice and Machine Learning". 14 students (7 CS, 7 Philosophy). 90 minutes. Low tech (whiteboard, projector, no laptops).
      *   **Topic:** Inverse Reinforcement Learning (IRL), specifically the underdetermination of rewards by behavior (potential-based reward shaping / reward equivalence).
      *   **Goal:** Students must *experience* the limitation structurally, not just hear about it. They need to distinguish between ambiguity solvable by more data vs. structural ambiguity (reward equivalence) that no data can fix.
      *   **Key Mechanism:** Reward shaping invariance ($R'(s, s') = R(s, s') + \gamma \Phi(s') - \Phi(s)$). This preserves optimal policies under discounting.
      *   **Requirements:**
          *   Design a grid world (10-14 squares, deterministic, absorbing goal, multiple routes, shared squares, unvisited squares, potential for dawdling).
          *   Handout with behavior (arrows), transition rules, discount ($\gamma=0.9$).
          *   Task: Teams assign reward values ($\Phi$ or $R$) per square.
          *   Activity Flow:
              1.  Propose numbers (rival hypotheses).
              2.  Verify numbers generate the observed arrows.
              3.  Prediction Round 1 (World altered): All teams predict same choice (scoreboard ties).
              4.  Prediction Round 2 (Divergence): Numbers differ on non-behavioral questions (e.g., welfare, unvisited states).
          *   Debrief: Map moments to concepts (choice-disposition vs. welfare vs. counterfactuals).
          *   Troubleshooting: Predict failure modes (gerrymandered numbers, "just pick simplest", noise complaints, early solvers).
          *   Warning: Avoid making it look like a skeptical trick; emphasize the engineering risk.
      *   **Constraint:** Do not give reading lists. Use the technical name if helpful (Potential-Based Reward Shaping), but students shouldn't need it. Address fixed stopping time vs. discounting.

  2.  **Designing the Grid World:**

      *   *Size:* Needs to be small enough to calculate by hand but complex enough to allow multiple paths. Let's aim for 12 squares.
      *   *Structure:* Start (S), Goal (G).
      *   *Routes:* Need at least two distinct routes. Let's make a "fast" route and a "scenic" route.
      *   *Shared Square:* A bottleneck.
      *   *Unvisited Square:* A dead end or a detour not taken.
      *   *Dawdling:* A loop or a back-and-forth possibility. To keep it deterministic and optimal, "dawdling" usually implies a cycle, but optimal policies in discounted MDPs with positive rewards usually don't cycle unless there's a negative cost to moving. Let's interpret "dawdle" as taking a longer path because the short path has a high negative reward (obstacle/cost).
      *   *Discount:* $\gamma = 0.9$.
      *   *Behavior:* Deterministic arrows.
      *   *Math Check:* I need to ensure there are at least two distinct reward functions that produce the *same* policy.
      *   *The Trick:* The prompt asks students to assign "one number per square". In standard IRL, we usually recover $R(s)$. However, the invariance described ($R'(s, s') = R(s, s') + \gamma \Phi(s') - \Phi(s)$) is about *potential-based shaping*. If students assign values $V(s)$ (value function) or $\Phi(s)$ (potential), the invariance holds. The prompt says "write down what the agent wants as one number per square". This sounds like $R(s)$ (reward at state) or $\Phi(s)$ (potential).
      *   *Correction/Refinement:* If students assign $R(s)$, the invariance is usually $R'(s) = R(s) + \gamma \Phi(s') - \Phi(s)$ (if reward is on transition) or similar. The prompt specifically describes the Ng, Harada, Russell (1999) potential-based shaping theorem. To make this work for students assigning "one number per square", it's easiest if they are assigning the *Potential* $\Phi(s)$, and the "Reward" is derived, OR they assign Reward $R(s)$ and we show that adding the potential difference doesn't change the policy.
      *   *Decision:* Let's have them assign **Reward Values $R(s)$** to each square. The "invariance" they will discover is that adding a potential function difference to the rewards doesn't change the optimal path.
      *   *Wait, simpler approach for students:* Have them assign **Values $V(s)$** (how good is it to be here?). No, the prompt says "what the agent wants". That implies Reward.
      *   *Let's stick to the Prompt's Math:* "change the reward of a move from s to s' by adding $0.9 \cdot \Phi(s') - \Phi(s)$". This implies the reward is on the *transition*. But the prompt asks students to write "one number per square".
      *   *Resolution:* I will define the reward as being received *upon entering* a square. So $R(s')$. The Bellman equation is $V(s) = \max_a [ R(s') + \gamma V(s') ]$. The shaping theorem says $R'(s') = R(s') + \gamma \Phi(s') - \Phi(s)$.
      *   *Activity Setup:* I will ask them to propose a "Reward Map" ($R$ for each square). I will secretly know two maps that are equivalent.
      *   *Grid Layout:*
          *   S (Start) at (0,0).
          *   G (Goal) at (2,2).
          *   Path 1: S -> A -> B -> G (Short)
          *   Path 2: S -> C -> D -> E -> G (Long)
          *   Wait, if Path 1 is short, why take Path 2? Path 1 must have a penalty.
          *   Let's make it a line with a branch.
          *   Squares: 1 (Start), 2, 3 (Goal). Branch: 1 -> 4 -> 5 -> 3.
          *   Observed Behavior: Agent takes 1 -> 4 -> 5 -> 3.
          *   Why? Maybe 2 is painful (-10), 4,5 are neutral (0), 3 is +10.
          *   Alternative Hypothesis: 2 is neutral, but 4,5 are highly rewarding (+5 each).
          *   Both explain the path.
          *   Need an unvisited square. Add Square 6 attached to 5. Agent doesn't go there.
          *   Need "dawdle". Maybe a loop? No, deterministic optimal policies don't loop with discounting < 1 unless rewards are negative everywhere. Let's interpret "dawdle" as "taking the long way".
          *   Let's refine the Grid for the Handout.

  3.  **Drafting the Handout & Rules:**

      *   **Map:** 12 Squares.
      *   **Observed Policy:** Arrows drawn on the map.
      *   **Task:** Infer $R(s)$.
      *   **Verification:** Calculate $Q$-values for available moves. If $Q(move) > Q(other)$, policy holds.
      *   **Scoring:**
          *   Round 1: Consistency check (Does your $R$ produce the arrows?).
          *   Round 2: Prediction on modified map (New path opens). *Crucial:* If the shaping invariance holds, *all* consistent $R$ maps should predict the same choice here too? Wait.
          *   *Correction on Invariance:* Potential-based shaping preserves the optimal policy *in the same MDP*. If we change the MDP (add a path), does it preserve the prediction?
          *   Ng et al. (1999) say: "Policy invariance under reward transformations... guarantees that the optimal policy remains unchanged." This applies to the *same* state space.
          *   If we add a *new* state/path, the potential function $\Phi$ needs to be defined for the new state. If we define $\Phi$ consistently, the preference between existing paths remains, but the new path's value depends on its $\Phi$.
          *   *The Prompt's Requirement:* "every team's numbers predict the same choice, so the scoreboard ties and the room discovers that a rebuilt world will not separate them either."
          *   This implies I need to construct the "New Path" such that the *difference* in value between the new path and old paths depends only on the potential difference at the endpoints, which is fixed by the observed behavior?
          *   Actually, if Team A uses $R$ and Team B uses $R'$, and $R' = R + \gamma \Phi' - \Phi$, then for *any* trajectory $\tau$, the total return $G(\tau)$ changes by $\gamma^T \Phi(s_{final}) - \Phi(s_{start})$.
          *   If the start and end states are the same for all competing paths, the *difference* in return between Path 1 and Path 2 is invariant!
          *   *Key Insight:* If all paths start at S and end at G, the additive term cancels out when comparing paths. $G_1 - G_2 = (G_1^{orig} + \Delta) - (G_2^{orig} + \Delta) = G_1^{orig} - G_2^{orig}$.
          *   So, if I add a *new path* from S to G, the ranking of New Path vs Old Path depends on the specific rewards of the new squares. Wait. If the teams have different $R$ assignments for the *old* squares, do they have to assign consistent $R$ for the *new* squares?
          *   To make the scoreboard tie, the new path must be clearly better or worse for *all* equivalent reward functions. Or, I need to ask a question where the answer is invariant.
          *   *Better Idea for Round 2:* Ask them to predict the choice between two *existing* paths if a barrier is removed. Since the value difference between any two paths from S to G is invariant under potential shaping (because start and end potentials cancel), all teams must agree on which path is better, even if their absolute numbers differ.
          *   *Round 3 (Divergence):* Ask about a square that is never visited (e.g., "Is square X good or bad?"). Since it's never visited, the potential $\Phi(X)$ is unconstrained by the observed policy. Team A might say it's heaven, Team B says it's hell. Both fit the data. This reveals the underdetermination.

  4.  **Refining the Activity Flow:**

      *   **Teams:** 7 teams of 2 (mixed CS/Phil).
      *   **Materials:** Handout with Grid + Arrows.
      *   **Phase 1 (Inference):** Teams assign $R(s)$. Check consistency.
      *   **Phase 2 (The Tie):** Modify the world (remove a wall between two existing squares, creating a shortcut). Ask: "Does the agent take the shortcut?"
          *   *Math:* Value of Path Old = $V_{old}$. Value of Path New = $V_{new}$.
          *   Under shaping, $V'_{old} = V_{old} + \gamma \Phi(G) - \Phi(S)$. $V'_{new} = V_{new} + \gamma \Phi(G) - \Phi(S)$.
          *   The difference $V'_{old} - V'_{new} = V_{old} - V_{new}$.
          *   So if Path Old was better than Path New for Team 1, it must be better for Team 2.
          *   *Wait, one catch:* The new path involves *new transitions*. The shaping term applies to transitions. As long as the start and end states of the *entire trajectory* are the same (S to G), the total accumulated shaping potential is $\gamma^T \Phi(G) - \Phi(S)$.
          *   Since $\gamma < 1$, the time horizon $T$ matters. The shaping term is $\sum (\gamma^t \Phi(s_{t+1}) - \gamma^{t-1} \Phi(s_t))$. This telescopes to $\gamma^T \Phi(G) - \Phi(S)$.
          *   If Path 1 takes 3 steps and Path 2 takes 5 steps, the shaping term is $\gamma^3 \Phi(G) - \Phi(S)$ vs $\gamma^5 \Phi(G) - \Phi(S)$. These are *different* if $\Phi(G) \neq 0$.
          *   *Problem:* The invariance holds for the *optimal policy*, meaning if Policy $\pi$ was optimal before, it is optimal after shaping. But if we introduce a *new* path, we are comparing a previously optimal path to a new candidate.
          *   If the shaping function $\Phi$ is different between teams, the valuation of the *length* of the path might change relative to the rewards.
          *   *Fix:* To ensure the scoreboard ties, I must ensure the "New Path" is *dominated* or *dominating* regardless of the potential, OR I restrict the "New Path" to have the *same length* as the old one.
          *   *Better Fix for the Activity:* Don't change the path length. Open a door that swaps a "bad" square for a "neutral" square, but keep step count same? No, that changes the rewards.
          *   *Let's go back to the Prompt:* "a short cut opens, a path closes — and every team's numbers predict the same choice".
          *   If I open a shortcut (fewer steps), the discount factor $\gamma^T$ changes. The shaping term $\gamma^T \Phi(G)$ changes. If Team A thinks $\Phi(G)$ is huge and Team B thinks $\Phi(G)$ is small, they might disagree on the value of saving time.
          *   *Solution:* Set $\Phi(G) = 0$ by convention? No, students won't do that.
          *   *Solution:* Make the Goal an absorbing state with 0 future reward, and the "Reward" is only on entry.
          *   *Actually, the Prompt says:* "the total discounted score of every route from a given starting square then shifts by exactly the same amount". This is only true if the routes have the *same length* or if $\Phi(Goal) = 0$ and we ignore the time discount on the potential?
          *   *Re-reading Ng et al:* The invariance ensures the *same policy* is optimal. It does not guarantee that if you add a *new* state, the ranking is preserved unless the potential is defined consistently.
          *   *Strategy for the "Tie":* I will construct the "New Path" such that it is *strictly dominated* by the observed path for *any* reward function that rationalizes the observed behavior.
          *   *How?* If the observed behavior goes S->A->G. I open a path S->B->G. If the observed behavior implies A is much better than B (e.g., agent went near A but didn't go to B when they could have), then all rationalizing rewards must value A > B.
          *   *Wait, I need the "Tie" to show that *different* reward hypotheses yield the *same* prediction.*
          *   Okay, Team 1 says: "Agent loves A, hates B." Team 2 says: "Agent loves A, indifferent to B." Both agree: Don't take path through B.
          *   *The Divergence:* Ask about Square C, which was never reachable. Team 1: "C is hell." Team 2: "C is heaven." Both fit data.
          *   *This works.*

  5.  **Addressing the "Fixed Stopping Time" Question:**

      *   Prompt asks: "If your design uses a fixed stopping time instead of discounting after arrival, tell me whether the invariance survives that change."
      *   *Answer:* No. Potential-based shaping relies on the telescoping sum of discounted potentials. If the horizon is fixed ($T$), the term is $\Phi(s_T) - \Phi(s_0)$. If policies reach the goal at different times, the terminal potential differs. Invariance generally requires infinite horizon discounting or specific conditions. I will stick to Discounting ($\gamma=0.9$) as requested in the prompt ("a point tomorrow is worth 0.9 points today"). I will explicitly note this in the "Honesty" section.

  6.  **Troubleshooting & "Gotchas":**

      *   *Team "Gerrymander":* Assigns wild numbers that barely work. *Fix:* Require them to show the Q-value calculation.
      *   *Team "Simplicity":* "Just set unvisited to 0." *Fix:* Acknowledge this is a prior, not data.
      *   *Student "Noise":* "Maybe they made a mistake." *Fix:* Rules state "Deterministic, Optimal".
      *   *Student "Solver":* Knows the theorem. *Fix:* Make them a "Consultant" who can verify but not reveal.
      *   *Skeptical Trick:* Ensure the debrief focuses on *alignment risk*, not just "truth is unknowable".

  7.  **Finalizing the Grid:**

      *   Start: S (0,0)
      *   Goal: G (0,4)
      *   Path 1 (Taken): S -> A -> B -> G. (3 steps)
      *   Path 2 (Available but not taken): S -> C -> D -> G. (3 steps). *Wait, if lengths are equal, discounting doesn't differentiate.*
