      *   Tone: Professional, pedagogical, precise.
      *   Sections: Map/Handout, Activity Rules, Timeline, Expected Hypotheses, Debrief, Troubleshooting, Risks.
      *   Check constraints: 14 students, 90 mins, no laptops.

