  ### 1. The Principles

  Based on the consistency of your friend's verdicts, she is rejecting the Simple Conditional Analysis (which fails on Cases 1, 2, 3, and 4) and adopting a **Causal Basis** view with a specific constraint on **Intrinsic vs. Extrinsic** interference. Two principles best capture her reasoning, with a third serving as a tie-breaker on specific edge cases.

  **Principle 1: The Intrinsic Categorical Base Principle (ICBP)**
  *   **Statement:** An object $x$ has the disposition to manifest $M$ in response to stimulus $S$ at time $t$ if and only if $x$ possesses the relevant intrinsic categorical base $B$ at $t$.
  *   **Supplementary Clause (The Extrinsic Irrelevance Clause):** The presence or absence of *extrinsic* factors (finks, masks, mimics) that prevent, remove, or simulate the manifestation does not affect the possession of the disposition. Only changes to the *intrinsic* base itself (as in the wet matches) alter the disposition.
  *   **Computational Rule:** Check the intrinsic properties of $x$ at $t$. If the standard physical realizer for the disposition is present, output **Disposed**. If absent, output **Not Disposed**. Ignore extrinsic machinery.

  **Principle 2: The Explanatory Priority Principle (EPP)**
  *   **Statement:** An object $x$ has the disposition to manifest $M$ in response to $S$ at $t$ if and only if, in the nearest possible worlds where $S$ occurs and $M$ occurs, the primary causal explanation for $M$ is an intrinsic property of $x$ existing at $t$.
  *   **Supplementary Clause (The Mimic/Fink Exclusion):** If the manifestation is caused by an extrinsic device (mimic/reverse fink) or prevented by an extrinsic device (fink/mask) such that the intrinsic property is causally inert or absent, the disposition is not ascribed.
  *   **Computational Rule:** Simulate the stimulus. If $M$ happens, ask "Why?" If the answer is "Because of $x$'s intrinsic nature at $t$," output **Disposed**. If the answer is "Because of an external device" or "It didn't happen because of an external blocker," evaluate based on whether the intrinsic base was *capable* of doing the work absent the blocker (per Case 8).

  **Principle 3: The Net Intrinsic Power Principle (NIPP)**
  *   **Statement:** An object $x$ has the disposition to $M$ given $S$ at $t$ if and only if the *total* intrinsic nature of $x$ at $t$ supports the causal production of $M$.
  *   **Supplementary Clause (The Intrinsic Mask Clause):** Unlike extrinsic masks (Case 2), *intrinsic* masks or self-negating mechanisms remove the disposition, even if a sub-component of the object resembles the standard base.
  *   **Computational Rule:** Check the *net* causal power of the object's intrinsic state. If the intrinsic state includes a mechanism that intrinsically prevents $M$, output **Not Disposed**, even if a "standard base" is nominally present.

