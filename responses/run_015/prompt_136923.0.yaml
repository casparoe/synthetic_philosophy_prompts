answer: |-
  1. "What the verdict is for"

  The Commission is not producing a history book, nor a moral absolution. It is producing a divisor. Its verdict must quantify an *assignable share of liability* against a finite pot. If it ranks only 'wrongness', it ignores the living heirs who need the money; if it ranks only 'present claim', it rewards the loudest lobby rather than the deepest wound. It must therefore rank *compensable harm*. This fixes the list because it forces every philosophical abstraction—intent, tempo, agency—to be converted into a currency that can be split. You cannot allocate nine minutes of speaking time based on virtue; you allocate it based on stake. The method must therefore treat every atrocity as a debt instrument, regardless of whether the debtor intended to sign it.

  2. "The requirements"

  1.  **Robustness to Uncertainty.** The method must function when data is destroyed. *Case:* The 800 pulped ledgers mean death counts range from 40,000 to 400,000. A model relying on precise body counts fails here. *Mark:* Non-negotiable.
  2.  **Granularity Neutrality.** The severity rating must not change based on how the act is described. *Case:* The 'Grain Problem'. Is it one policy of rationing, or 11,000 individual decisions to deny stamps? Aggregating them as one event must yield the same weight as summing the parts. *Mark:* Non-negotiable.
  3.  **Disjoint Claimant Sets.** The method must prevent double-counting of the same dead. *Case:* The population burned by neighbours forty years prior overlaps with the Allotment dead. Lawyers know this. Paying two groups for one corpse bankrupts the fund. *Mark:* Non-negotiable.
  4.  **Intent Insensitivity.** Harm must be weighted regardless of malice. *Case:* The starvation was bureaucratic negligence; the language suppression was deliberate cruelty. If intent weights heavily, the 400,000 dead are worth less than the caned children. *Mark:* Preference of the State (to lower liability).
  5.  **Diffuse Agency Accounting.** Perpetrator status must not be binary. *Case:* Clerks were conscripted from the starving districts and stood in the queues themselves. A method that demands distinct 'guilty parties' excludes the Allotment entirely. *Mark:* Preference of the Claimants.
  6.  **Tempo Neutrality.** Duration must not dilute severity. *Case:* Thirty-eight slow years of starvation versus a one-month pogrom. A method that weights 'intensity' over 'cumulative loss' penalises slow violence. *Mark:* Non-negotiable.
  7.  **Commensurability of Loss.** Deaths and cultural destruction must be comparable. *Case:* 400,000 dead versus a language reduced to few hundred speakers. To split one pot, the method must find a common unit between breath and speech. *Mark:* Non-negotiable.
  8.  **Rankability of Attempt.** Aborted atrocities must be scoreable. *Case:* A 'near-miss' atrocity ninety per cent built then abandoned. If only executed harm counts, this group gets nothing despite the intent being identical to successful groups. *Mark:* Preference of the Legalists (who say no).

  3. "Demands I should ignore"

  Your characters will face demands that sound like criteria but are actually veto powers. Ignore 'Proportionality to Current Population': this suggests a genocide that succeeded completely deserves less than one that failed because fewer heirs remain to claim it. Ignore 'Purity of Victimhood': any argument that collaboration by some members voids the claim of the dead is merely a way to reduce the payout. Ignore 'Recency Bias': the suggestion that older wounds heal and should weigh less is politically convenient but morally hollow. Finally, ignore 'Administrative Feasibility'. If the method is easy to calculate but ignores the pulped ledgers, it is not a solution; it is a erasure. These are not criteria; they are budget cuts dressed as philosophy.

  4. "Where the list eats itself"

  The Commission breaks on the conflict between **Robustness to Uncertainty** and **Disjoint Claimant Sets**. To prevent double-counting the overlapping dead (Requirement 3), you need precise records of who died when and why. But the ledgers are pulped (Requirement 1). You cannot simultaneously acknowledge radical uncertainty about the numbers and guarantee no double-payment. If you estimate high to be safe, you likely double-count; if you estimate low to be safe, you erase victims.

  Furthermore, **Commensurability** (7) excludes the most candidate methods. Most ethical frameworks refuse to trade lives against language. To do so requires a utilitarian calculus that many characters will find repugnant. If you insist on a single number to split the pot, you force a comparison that denies the unique horror of each event. The Commission must either lie and produce a number, or tell the truth and produce nothing. This is where your protagonists should fight: one demanding the impossible precision to prevent fraud, the other demanding the impossible comparison to prevent erasure. The method cannot satisfy both. It must choose which truth to sacrifice.

  5. "Scorecard"

  **Total-Harm/Body-Count:** Simplest. Counts dead and injured. *Verdict:* Fails the Ledger Problem. Incentivises inflating numbers and erases the language suppression entirely. Good for math, bad for truth.

  **Culpability-and-Intent-First:** Weights malice over outcome. *Verdict:* Collapses the Long Allotment. Since nobody ordered the killings, the starvation becomes 'tragedy' not 'crime'. The language camp wins everything. Morally satisfying for some, financially disastrous for others.

  **Incommensurability ("We decline to rank"):** Refuses to compare deaths to culture. *Verdict:* Philosophically honest, practically useless. The pot remains unspent. The Commission dissolves. Good for a ending where nothing is solved.

  **Let-the-Claimants-Bargain-it-Out:** Political negotiation rather than moral arithmetic. *Verdict:* Ignores the dead entirely in favour of the living lobbyers. The Long Allotment loses because their heirs are too exhausted to fight. Realistic, cynical, and likely what would actually happen.
