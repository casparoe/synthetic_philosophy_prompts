answer: |-
  ### Pre-emptive Concessions (Slide 1 & 2)
  **Concede these immediately to disarm the room:**
  1.  **Utility:** Acknowledge that treating DNA as a code is heuristically indispensable for synthetic biology. If you're designing a plasmid, thinking of it as code is the right engineering stance. You are not telling them to stop using the word; you are telling them not to reify it as ontology.
  2.  **Arbitrariness:** Grant Clause 1 of the Detour Test completely. The codon table is contingent. We agree that the mapping is detachable. Your argument rests entirely on Clause 2, so do not waste capital defending the arbitrariness of the codon table—the tRNA people and postdocs already know that better than you.

  ### The Single Reply That Must Land
  **The Response to the tRNA/Synthetase Objection (Objection #1).**
  If you cannot defend Clause 2 against the existence of editing domains, your Detour Test fails empirically, and the talk collapses. You must successfully argue that kinetic proofreading and hydrolytic editing are *chemical affinity checks*, not *semantic error corrections*. You need to land the distinction between "this key doesn't fit the lock" (chemistry) and "this word is spelled wrong" (semantics). If the room accepts that biological error correction is just stereochemical filtering, you survive. If they convince you that editing domains constitute "reading," you lose.

  ### The Question I'm Hoping Nobody Asks
  "If I synthesize a whole genome from scratch on a computer, send the file to a DNA printer, and transplant it into a cell to produce a specific phenotype, haven't I just written code? Does your view imply that *I* am the only coder in that loop, and the cell is just chemistry?"
  *(Why it's dangerous: It collapses the distinction between human intentionality and biological function. If you say yes, you make biology passive. If you say no, you undermine your claim that DNA isn't code.)*

  ---

  ### The Objections (Ordered by Damage)

  #### 1. The tRNA/Synthetase Person (Empirical Falsification)
  **Objection:** "You claim the system doesn't distinguish a garbled message from a damaged carrier. That's empirically false. Class I synthetases have editing domains that hydrolyze mischarged tRNAs. The system explicitly checks if the amino acid matches the anticodon. If it doesn't, it rejects it. That is literally distinguishing a wrong symbol from a broken tool. Your Clause 2 fails."

  **Reply:** "It looks like distinction, but it's just affinity filtering. The editing domain doesn't know what 'Leucine' means; it knows that Isoleucine fits into a hydrolytic pocket that Leucine doesn't. It's a second chemical lock, not a semantic check. If you swap the chemistry of the editing pocket, the 'error' changes. In a real code, the error is defined by the mapping, not the physics of the reader. Here, the physics *is* the mapping. There's no layer where the molecule says 'this is the wrong symbol'; there's only 'this binding energy is too low.'"

  **Soft Spot:** You are drawing a hard line between chemistry and information that might be too clean. If the editing domain evolved *specifically* to preserve the mapping despite chemical similarity, isn't that functional equivalence to semantic error correction? You're betting on a philosophical distinction that biology might not respect.

  #### 2. The Postdocs (Pragmatic Utility)
  **Objection:** "I write genomes for a living. I swap codons to optimize expression, I rewrite regulatory elements to tune output. I treat the DNA as a instruction set and the cell as a compiler. It works predictably. If I call it code, and the model predicts the outcome, in what useful sense is it 'false'? You're offering a philosophical correction that doesn't change my pipetting."

  **Reply:** "It's false in the sense that it mislocates the causality. You think you're programming the DNA, but you're actually engineering the context. When you optimize codons, you're matching the DNA to the existing tRNA pool of the host. If you move that same DNA to a different host with a different tRNA abundance, it fails. The 'code' isn't in the sequence you wrote; it's in the relationship between your sequence and the host's machinery. Calling it code hides the contingency. It makes you think the DNA carries the instruction, when actually the cell carries the interpretation."

  **Soft Spot:** This sounds like hairsplitting to someone holding a pipette. If the input-output function is stable enough to engineer, the "code" label is functionally true. You risk sounding like you deny the reality of their engineering success.

  #### 3. The Senior PI (Research Program Validity)
  **Objection:** "The 'Code Biology' program treats codes as natural kinds discovered in nature, not metaphors imposed by us. You're saying we should throw out a discovery because it doesn't meet a philosopher's definition of semantics. Isn't that throwing out the baby with the bathwater? We find regularities that behave like codes. Why demand more?"

  **Reply:** "Because calling it a natural kind locks you into looking for dictionaries that aren't there. If you think the code is in the DNA, you look for the key in the genome. If you understand the regularity is in the readout machinery, you look at the evolution of the ribosome and the synthetases. It shifts the research question from 'decoding the genome' to 'characterizing the readout context.' It's not about stopping the work; it's about pointing it at the actual mechanism causing the regularity."

  **Soft Spot:** You are telling a funded PI that their central conceptual framework is misdirecting their lab. That's a hard sell in ten minutes. They will hear "your grant proposal is based on a category error."

  #### 4. The Comparative Genomics Person (Information Theory)
  **Objection:** "I compute mutual information over alignments. I don't care about semantics. Shannon information is measurable regardless of meaning. You're conflating semantic information with statistical information. DNA clearly carries Shannon information. Why do you need to drag 'meaning' into this to make your point?"

  **Reply:** "You're right that DNA carries Shannon information. My argument isn't about quantity; it's about载体 (carrier) vs. content. Shannon theory measures the capacity of the channel, not the nature of the signal. My point is that people hear 'information' and think 'message.' I'm saying DNA is a high-capacity template, not a message. You can measure the entropy of a mold spore pattern, but that doesn't make the mold a sender. I want to stop the slide from statistical information to semantic content."

  **Soft Spot:** You risk conceding too much. If you agree DNA carries Shannon information, many in the room will equate that with "coding information" anyway. You need to be sharper on why Shannon info doesn't imply a code.

  #### 5. The Philosopher of Biology (Parity/Originality)
  **Objection:** "This sounds like a restatement of the parity argument or maybe Millikan's teleosemantics. You're saying content depends on the consumer history, not the producer. Have you just added a 'Detour Test' label to existing literature? What's the actual novelty here besides the terminology?"

  **Reply:** "The novelty is the engineering constraint. Most philosophical accounts focus on selection history. My Detour Test is designed to be falsifiable by synthetic biology. Clause 1 checks for arbitrariness, which we know. Clause 2 checks for error distinction, which is testable by swapping readers. I'm not just arguing about history; I'm proposing a mechanistic test that synthetic biologists can run to see if a system is coding or just templating."

  **Soft Spot:** If the philosopher knows the literature better than you, they might point out that 'consumer theory' already covers this. You need to ensure the Detour Test isn't just a repackaging of 'use conditions.'

  #### 6. The Structural Biologist (Stereochemistry)
  **Objection:** "You're dressing up stereochemistry as philosophy. The ribosome is a machine. It matches shapes. A template matches a mold. Why do we need a 'Detour Test' to tell us that molecular recognition is based on physical affinity? It's obvious."

  **Reply:** "It is obvious physically, but it's obscured linguistically. When we say 'the gene for eye color,' we imply the DNA contains the blueprint for eyes. Structurally, the DNA contains binding sites for proteins that eventually trigger a cascade. The 'blueprint' is distributed across the whole system. I'm using the test to force us to admit that the specificity comes from the 3D structure of the readers, not the 1D sequence of the writer. It stops us from anthropomorphizing the molecule."

  **Soft Spot:** You might sound like you're fighting a straw man. Most structural biologists already know DNA is just chemistry. They might feel you're solving a problem they don't have.

  #### 7. The General Audience (Positive Alternative)
  **Objection:** "Okay, DNA isn't a code. It's not a message. So what is it? A template? A scaffold? If I can't say 'genetic code,' what do I put on my slide tomorrow when I teach intro bio?"

  **Reply:** "Call it a 'chemically specific template.' It's a scaffold that recruits machinery. The 'information' is in the lineage of the cell, not the strand. For teaching: tell them the DNA is the key, but the cell is the lock. You need both to open the door. If you change the lock (the machinery), the key doesn't work. That relational view is more accurate than saying the key holds the 'message' of the door."

  **Soft Spot:** "Chemically specific template" is clunky. It lacks the punch of "code." You might leave them with a void rather than a better tool.

  #### 8. The Synthetic Biologist (Horizontal Transfer)
  **Objection:** "What about horizontal gene transfer? A gene jumps from bacteria A to bacteria B and works. The machinery is different, the context is different, but the 'message' stays the same. Doesn't that prove the information is in the DNA, independent of the original reader?"

  **Reply:** "It proves the machinery is conserved enough across lineage to accept the template. It's not that the message traveled; it's that the readers are homologous. If you transfer a gene to a lineage with divergent synthetases or codon usage, it fails unless you optimize it. The success of transfer is a measure of the similarity of the readers, not the independence of the message. It's compatibility, not portability."

  **Soft Spot:** This is empirically shaky. Some genes are highly portable across vast phylogenetic distances. If the readers are that different and the gene still works, your claim that the "reader defines the function" looks weaker.
