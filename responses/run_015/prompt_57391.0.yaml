answer: |-
  ### 1. Candidate Principle: The Indexical Counterfactual & Epistemic Diagnostic (ICED) Protocol

  This principle replaces the static multiplication of Importance, Tractability, and Neglectedness with a sequential diagnostic filter. It treats "Neglectedness" not as a score, but as a question requiring a specific answer before capital is deployed.

  **Inputs Required:**
  1.  **Counterfactual Impact (CI):** Estimated impact *with* grant minus estimated impact *without* grant.
  2.  **Constraint Diagnostic (CD):** The specific reason capital has not already entered this space. Categories:
      *   *Saturation:* Others are already covering the need.
      *   *Hard Constraint:* Physical, technical, or evidentiary barriers make success unlikely.
      *   *Soft Constraint:* Social, reputational, or coordination barriers prevent entry.
  3.  **Leverage Mechanism (LM):** A causal story for how this grant changes the behavior of other actors (e.g., matching funds, proof-of-concept).
  4.  **Uncertainty Type (UT):** Classification of the primary risk as either *Empirical* (facts about the world) or *Moral* (values about the world).

  **Order of Operations:**
  1.  **Calculate CI.** If CI is negligible because other funding would displace yours, **Reject**. (If CI is positive but dependent on future conditions, proceed to Step 4).
  2.  **Run CD.**
      *   If *Saturation*, **Reject**.
      *   If *Hard Constraint*, **Reject** (unless Step 4 applies).
      *   If *Soft Constraint*, **Flag for Priority**.
  3.  **Verify LM.** If claiming leverage (impact > direct cost), you must specify the mechanism. If the mechanism is "general enthusiasm" or "signaling," **Reject**. If the mechanism is specific (e.g., "unlocks matching grant X"), **Accept** and multiply value.
  4.  **Assess Scale & Information.** If the opportunity has high Information Value (resolves uncertainty for future capital), fund a tranche sufficient to resolve that uncertainty, not the full scale. If the opportunity exhibits sharp diminishing returns, fund only to the inflection point.
  5.  **Apply UT Discount.**
      *   If *Empirical Uncertainty*: Discount the expected value by the probability of the empirical claim being true. If the probability is below your threshold for action, **Reject**.
      *   If *Moral Uncertainty*: Do not discount the probability. Instead, weight the value by your degree of moral endorsement. If you endorse the moral view sufficiently to act on it personally, **Accept**.
  6.  **Ex-Post Evaluation.** Judge the decision by the quality of the ex-ante reasoning, not the ex-post outcome.

  **Conflict Rule:**
  A *Hard Constraint* (Step 2) overrides High Importance. A specific *Leverage Mechanism* (Step 3) overrides Modest Direct Impact. *Empirical Uncertainty* (Step 5) warrants caution; *Moral Uncertainty* warrants action.

  ***

  ### 2. Case Mapping

  *   **Case 1 (Displacement):** Handled by **Step 1 (Calculate CI)**. The CI is near zero because institutional funders cover the cost. Verdict: Reject.
  *   **Case 2 (Staged/Info Value):** Handled by **Step 4 (Assess Scale & Information)**. The grant is sized to resolve uncertainty (Information Value), not to solve the problem immediately. Verdict: Accept (Staged).
  *   **Case 3 (Stigma/Soft Constraint):** Handled by **Step 2 (Run CD)**. The neglect is classified as a *Soft Constraint* (social stigma), which flags it for priority rather than rejection. Verdict: Accept.
  *   **Case 4 (Impossibility/Hard Constraint):** Handled by **Step 2 (Run CD)**. The neglect is classified as a *Hard Constraint* (technical impossibility). Verdict: Reject.
  *   **Case 5 (Leverage):** Handled by **Step 3 (Verify LM)**. A specific mechanism for follow-on funding is identified. Verdict: Accept.
  *   **Case 6 (Signaling):** Handled by **Step 3 (Verify LM)**. The mechanism is vague ("general enthusiasm"). Verdict: Reject.
  *   **Case 7 (Diminishing Returns):** Handled by **Step 4 (Assess Scale & Information)**. Funding is capped at the point of marginal efficiency. Verdict: Accept (Partial).
  *   **Case 8 (Uncertainty Types):** Handled by **Step 5 (Apply UT Discount)**. Empirical uncertainty triggers a probability discount (Reject); Moral uncertainty triggers a weighting (Accept). Verdict: Split.
  *   **Case 9 (Failed Outcome):** Handled by **Step 6 (Ex-Post Evaluation)**. The decision is validated by ex-ante reasoning despite ex-post failure. Verdict: Accept (No Regret).
  *   **Case 10 (Dynamic Neglectedness):** Handled by **Step 1 (Calculate CI)** and **Step 2 (Run CD)**. The landscape has shifted from *Soft Constraint* to *Saturation* due to previous success. CI is now low. Verdict: Reject (Current Cycle).

  ***

  ### 3. Stress Test Cases

  Here are four cases where the ICED Protocol delivers a verdict that may feel intuitively unwelcome or risky.

  **Case A: The Warranted Stigma**
  *   **Description:** A research program is neglected because the broader community finds its methods ethically dubious (e.g., certain types of psychological manipulation or dual-use biosecurity work). You determine this is a *Soft Constraint* (social stigma) rather than a *Hard Constraint* (it is technically feasible).
  *   **ICED Verdict:** **Fund.** (Step 2 flags Soft Constraints for priority).
  *   **Unwelcome Feature:** The principle treats social stigma as a market inefficiency to be exploited, potentially funding work that the community correctly identified as normatively dangerous. It lacks a "normative veto" independent of your own moral view.

  **Case B: The Empirical Long-Shot with High Leverage**
  *   **Description:** A program has a 5% chance of working (Empirical Uncertainty), but if it works, it unlocks $100M in government funding (Leverage Mechanism). The expected value is positive.
  *   **ICED Verdict:** **Reject.** (Step 5 discounts Empirical Uncertainty heavily; Step 1 likely shows low CI if the 95% failure case is considered).
  *   **Unwelcome Feature:** The principle is overly conservative on empirical moonshots. By demanding high confidence in empirical claims, it may filter out the highest-variance, highest-reward opportunities that venture capital models would accept.

  **Case C: The Moral Fringe**
  *   **Description:** A program addresses a harm you view as morally significant with 30% confidence (e.g., rights for a non-sentient entity, or a radical population ethic). The community ignores it because they reject the moral premise.
  *   **ICED Verdict:** **Fund.** (Step 5 says do not discount Moral Uncertainty, only weight it).
  *   **Unwelcome Feature:** This licenses funding highly idiosyncratic moral projects that lack intersubjective validation. It privileges the funder's personal moral uncertainty over the consensus of the relevant moral community.

  **Case D: The Information Silo**
  *   **Description:** A staged grant (like Case 2) will resolve a major uncertainty, but the results will be proprietary or difficult to communicate, meaning other funders cannot easily use the information.
  *   **ICED Verdict:** **Reject.** (Step 4 requires Information Value to resolve uncertainty for *future capital*; if the info doesn't leak, the public good is lost).
  *   **Unwelcome Feature:** You might decline a grant that would be privately valuable to your fund's strategy because it doesn't generate a public good for the broader funding ecosystem. It forces a degree of altruism on information that you might not want to give.

  ***

  ### 4. Incompatibilities and Trade-offs

  **The 3 vs. 4 Tension (The Cause of Neglect)**
  The ICED Protocol *can* accommodate both, but only by asserting that **the cause of neglect is more important than the fact of neglect.**
  *   **Accommodation:** Case 3 is funded because the constraint is *Soft* (social). Case 4 is rejected because the constraint is *Hard* (technical).
  *   **The Cost:** This requires the funder to make a potentially arrogant epistemic judgment: "I know why *they* aren't funding this, and they are wrong (Case 3)," vs "I know why *they* aren't funding this, and they are right (Case 4)."
  *   **Recommendation:** If you must simplify, **abandon Case 3.** It is safer to assume consensus neglect is evidential (Case 4) than to assume it is social bias (Case 3). By keeping Case 3, you accept the risk of Case A (Warranted Stigma). The complexity is not ad hoc; it is the core of "Epistemic Arbitrage." However, it requires high confidence in your ability to diagnose social vs. technical constraints.

  **The 5 vs. 6 Tension (Leverage)**
  The Protocol accommodates both by demanding **mechanistic specificity.**
  *   **Accommodation:** Case 5 has a named mechanism ("bring several times its own value"). Case 6 relies on "general enthusiasm."
  *   **The Cost:** This rules out "field building" grants where the mechanism is inherently diffuse. If you believe that mere visibility *is* a mechanism (even if untraceable), this principle is too strict.
  *   **Recommendation:** **Keep the distinction.** Case 6 is the weaker link. Funding based on "signaling" without a mechanism is often a post-hoc rationalization for following trends. Requiring a mechanism (Case 5) forces rigor.

  **The Verdict That Cannot Be Accommodated: Case 8**
  The ICED Protocol handles Case 8, but it does so by asserting a meta-ethical claim that is not universally shared: *Moral uncertainty is action-guiding; empirical uncertainty is evidence-guiding.*
  *   **The Conflict:** A strict Bayesian might argue both should be discounted by probability. A pragmatist might argue both should be weighted by impact.
  *   **The Loss:** To accommodate Case 8, you must accept that **your moral intuition is a valid data source in a way that empirical intuition is not.** If you cannot defend the claim that "I get to decide what is morally valuable, but I don't get to decide what is physically true," this clause is ad hoc.
  *   **Argument:** Keep it. In grantmaking, the funder *is* the moral arbiter. You are not funding "objective moral truth"; you are funding *your* values. Therefore, uncertainty about *your* values is a weighting problem, not a truth-tracking problem. Empirical claims, however, are truth-tracking. The distinction holds.

  ***

  ### 5. Game-Theoretic Stability

  **The Problem:**
  Cases 1 and 10 reveal that Neglectedness is not a static property but a dynamic equilibrium. If multiple funders adopt the ICED Protocol, they will all identify the same *Soft Constraints* (Case 3) and *Leverage Opportunities* (Case 5).

  **The Consequence:**
  1.  **The Rush:** All ICED-compliant funders will rush into Case 3 (Stigma-breaking) and Case 5 (Leverage).
  2.  **The Dissolution:** As they fund, the area ceases to be neglected. It moves from *Soft Constraint* to *Saturation* (Case 1).
  3.  **The Instability:** The principle tells you to fund what others aren't. If everyone follows the principle, there is nothing left to fund that fits the criteria.

  **Is the Principle Stable?**
  No, not in a static sense. It is **cyclical**.
  *   **Phase 1:** Few funders use ICED. High yield from Soft Constraints (Case 3).
  *   **Phase 2:** Many funders use ICED. Soft Constraints become Saturated (Case 1).
  *   **Phase 3:** ICED funders must exit (Case 10) and find new Soft Constraints.

  **Implication for You:**
  The principle implies you must treat your portfolio as **temporary**. You cannot build a 10-year strategy on a Case 3 opportunity. The moment you fund it, you are working to make it unfundable by your own standards (by reducing its neglectedness).
  *   **Stability Condition:** The principle is only stable if there is a constant influx of *new* Soft Constraints (new stigmas, new coordination failures). If the world runs out of market failures, the ICED funder runs out of work.
  *   **Strategic Advice:** Do not coordinate with other funders on *what* to fund, only on *why*. If you all agree on the diagnostic, you will crowd each other. You need an indexical advantage: "Why is this neglected *specifically relative to me*?" (e.g., I have unique expertise, I have unique risk tolerance). Without an indexical component, the principle generates a race to the bottom where the easiest-to-diagnose opportunities are instantly saturated.

  **Final Recommendation:**
  Adopt the **ICED Protocol**, but add an **Indexical Clause** to Step 2: *"Why is this constraint soft for me, specifically?"* If the answer is "It is soft for everyone," expect competition. If the answer is "It is soft for me because I have unique capacity," the opportunity is stable. This resolves the tension in Case 10: your funding changed the landscape for everyone, but if you had unique capacity, you might have retained an edge. Since you didn't, the exit (Case 10) was correct.
