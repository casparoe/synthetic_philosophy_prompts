answer: |-
  You are running into the standard walls of infinite ethics: the **Aggregation Problem** (how to sum infinite values), the **Measure Problem** (how to weigh zero-volume suffering), and the **Non-Identity Problem** (creation vs. prevention).

  You cannot have a single *impersonal world-ranking* principle that satisfies Case 1 (Adding a happy person is neutral) and The Pond (Saving a kid is good) without contradiction. In both scenarios, you are moving from "Infinite Happy" to "Infinite Happy + 1 Local Good." If the *world state* is identical in structure, the *ranking* must be identical.

  To save your intuitions, you must abandon the idea that "Goodness" is solely a property of world-states. You need a **Person-Affecting View** for actions, combined with a **Lexical Negative Utilitarian** view for world states.

  Here is the principle that captures the maximum number of your verdicts, clause by clause.

  ### The Principle: Lexical Suffering with Person-Affecting Constraints

  **Clause 1: The Suffering Threshold (The Contaminant Rule)**
  *   **Rule:** Any world containing *any* suffering is strictly worse than any world containing *no* suffering, regardless of the measure (volume) of that suffering.
  *   **Captures:** **Case 6** (Filament is worse than All-Happy) and **Case 3** (Finite agony is worse than All-Happy).
  *   **Why:** This treats suffering as a lexical disqualifier. It solves your Case 6 dilemma: the filament world is "tainted" (so worse than pure happiness) but less tainted than the spread world.

  **Clause 2: Suffering Minimization (The Measure Rule)**
  *   **Rule:** Among worlds that both contain suffering, the world with the lower spatiotemporal measure (volume/density) of suffering is better. If measures are mathematically equal (e.g., both zero), the world with fewer *locations* of suffering is better.
  *   **Captures:** **Case 6** (Filament is better than Spread) and **Case 5** (1/1000 agony is worse than Finite agony).
  *   **Why:** This handles the ranking *within* the "tainted" category. It requires you to accept that a 0-volume filament has a non-zero "moral measure" (topological presence) distinct from mathematical volume.

  **Clause 3: Happiness Density (The Quality Rule)**
  *   **Rule:** Among worlds with *no* suffering, the world with higher average well-being per person is better.
  *   **Captures:** **Case 2** (Everyone +2 is better than Everyone +1).
  *   **Why:** In the absence of suffering, we revert to a form of Average Utilitarianism. This prioritizes the *depth* of happiness over the *count* of happy people.

  **Clause 4: The Addition Neutrality (The Infinity Rule)**
  *   **Rule:** Adding happy people to an infinite world with no suffering yields no *impersonal* increase in value, provided average well-being does not rise.
  *   **Captures:** **Case 1** (One extra happy person is no improvement).
  *   **Why:** In an infinite background, density is the only meaningful metric. If density doesn't change, the world-state hasn't improved.

  **Clause 5: Agent-Relative Obligation (The Pond Clause)**
  *   **Rule:** Moral obligation is determined by the impact on *identifiable existing individuals*, not by changes in impersonal world-value.
  *   **Captures:** **The Pond** (Saving the kid is obligatory) without contradicting **Case 1**.
  *   **Why:** This is the crucial pivot. Case 1 involves *creating* a new person (who doesn't exist in the baseline to be benefited). The Pond involves *saving* an existing person (who exists in both alternatives). You are not obligated to maximize the "World Score"; you are obligated to help those who are already there.

  **Clause 6: Variance Aversion (The Equality Rule)**
  *   **Rule:** Among worlds with equal average well-being and no suffering, lower variance in well-being is better.
  *   **Captures:** **Case 4** (All +1 is better than Half +3 / Half -1).
  *   **Why:** Even if the average is the same, the presence of the "-1" (even if not "agony") introduces a negative skew that is penalized.

  ---

  ### Prediction for Your New Case
  **Case:** One happy person per cubic parsec at well-being $W$ **versus** two people per cubic parsec at well-being $W/2$ each.

  **Prediction:** **The first world (1 person @ $W$) is better.**

  **Reasoning:**
  1.  Both worlds have zero suffering (Clause 1 satisfied).
  2.  Both worlds have the same *total well-being per volume* ($1 \times W = 2 \times W/2$).
  3.  However, **Clause 3** prioritizes *average well-being per person*.
  4.  World 1 has average $W$. World 2 has average $W/2$.
  5.  Therefore, World 1 is superior.
  *Note: This follows your verdict on Case 2 (+2 better than +1). If you prefer these worlds to be equal, you must discard Clause 3 and replace it with "Total well-being per volume," which would then contradict Case 2.*

  ---

  ### The Straight Talk: What You Have to Give Up

  You asked me to be straight about which verdicts can't be saved. Here is the cost of this principle:

  **1. You must give up on "Impersonal Goodness" for The Pond.**
  You cannot say the *world* where you save the kid is objectively better than the world where you don't, not in the same way Case 2 is better than Case 1. If you use the World-Ranking rules (Clauses 1-4), The Pond is a tie (Infinite Happy vs. Infinite Happy).
  *   **The Cost:** You have to accept that "Right Action" (saving the kid) does not always equal "Better World State." This is a standard move in deontology, but it breaks the link between axiology (value) and decision theory. If you demand that saving the kid makes the *universe* better, you must admit Case 1 also makes the universe better. You can't have both.

  **2. You must accept "Moral Magic" in Case 6.**
  You want the filament (0 volume) to be worse than the happy world, but better than the spread suffering.
  *   **The Cost:** Mathematically, the integral of suffering in the filament is zero. To say it is morally worse than zero, you are asserting that **ethics does not map cleanly to standard measure theory.** You are positing a "topological moral weight" that exists without volume. This is philosophically coherent, but mathematically non-standard. You have to be okay with saying "Zero volume $\neq$ Zero moral weight."

  **3. You must accept the "Repugnant Conclusion" Lite.**
  By prioritizing Average Well-being (Clause 3) over Total Density (to satisfy Case 2), my prediction for your New Case says it is better to have fewer, happier people than more, moderately happy people.
  *   **The Cost:** If you could have a billion people at $W$ or a trillion people at $0.9W$, this principle forces you to choose the billion. If your intuition is that "more good lives" should matter even if average dips slightly, Clause 3 needs to be softened.

  ### Summary
  The only way to hold Case 1 (Neutral Addition) and The Pond (Obligatory Rescue) simultaneously is to distinguish between **Creating Value** (Impersonal) and **Protecting Interests** (Person-Affecting).

  If you refuse that distinction, you must concede that **Case 1 is an improvement.** If Case 1 is an improvement, your intuition that "nothing happened" is wrong, and you are indeed failing the kid in the pond by walking past. Pick your poison.
