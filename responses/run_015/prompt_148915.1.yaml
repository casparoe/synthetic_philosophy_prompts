answer: |-
  A linguist corners a molecular biologist at a conference buffet. "You have to admit," the linguist says, poking a shrimp, "the genetic code is arbitrary. Sixty-four codons for twenty amino acids. That redundancy proves it's a semantic system, not just chemistry."

  The biologist wipes her hands. "It's not arbitrary. It's frozen accident plus steric hindrance. You're treating the ribosome like a translator who chooses words. It's actually a compiler without a debugging environment."

  "How so?"

  "If I write 'prnt' instead of 'print' in code, the compiler flags a syntax error. If a ribosome hits a mismatched base, it doesn't flag an error; it just incorporates the wrong shape and hopes the protein doesn't misfold. There's no grammar police, only thermodynamics."

  "So a stop codon isn't a period?"

  "It's not a period," she says. "It's a wall. In your language, a stop sign works because we agreed it means stop. In the cell, the stop codon works because the tRNA key breaks and a release factor wedge fits in. We aren't reading instructions; we're bouncing off obstacles. DNA doesn't *describe* the protein. It's the mold it was poured from."

  ***

  **Philosophical Note:**
  This joke endorses the **causal-structural view** of genetic information, arguing that DNA functions as a physical template rather than a semantic code. The punchline relies on the claim that biological "syntax" (like stop codons) is reducible to chemical affinity and steric fit rather than conventional rules.

  **Liberty Flagged:**
  The joke takes a liberty regarding **ribosomal proofreading**. While the joke claims the ribosome lacks a "debugging environment" and simply incorporates mismatches, modern molecular genetics acknowledges that ribosomes do employ kinetic proofreading mechanisms to reject incorrect tRNAs before peptide bond formation. This biological nuance is suppressed to sharpen the philosophical distinction between *syntax errors* (which halt processing by rule) and *chemical mismatches* (which are resolved by physical affinity).
