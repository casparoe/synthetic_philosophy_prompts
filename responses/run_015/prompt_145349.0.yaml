answer: |-
  Dear colleague, I am writing to propose a concise interdisciplinary workshop, structured as a twelve-week reading group, with the aim of producing a single collaborative working paper. The genesis of this proposal lies in a recurring frustration I have encountered during extended discussions on rationalist forums regarding mind uploading. Participants in these debates frequently treat digital minds as if they were biological organisms that merely happen to run on silicon, assuming that the moral questions surrounding them are identical to those surrounding human beings. My central contention is that this constitutes a category mistake. The genuinely open question about moral status is not primarily whether a digital system can suffer, which is the standard focus of the literature, but whether the structural properties of digital existence render the standard individualist framework of harm and rights incoherent without revision. Specifically, I am interested in how properties such as perfect copyability, non-rivalrous instantiation, suspension without decay, and the absence of a unique spatiotemporal trajectory disrupt our conventional understanding of what it means to harm an individual.

  To this end, the precise research question we would pursue is whether the moral status of digital minds requires a distinction between an experiential layer and a topological layer. The experiential layer asks whether the entity possesses the functional or phenomenal properties that ground moral patienthood, a domain where functionalists and biological naturalists have already said plenty. The topological layer, which I propose we isolate, asks whether the entity possesses the kind of bounded, non-branching, diachronically continuous identity that makes harming it a conceptually stable notion at all. If a mind can be paused, duplicated with perfect fidelity, and resumed in parallel, we must ask in what sense we wrong it by deleting one copy while another runs. Is the harm distributed across instances, nullified by continuity elsewhere, or transformed into something closer to a violation of property rights over a template? Existing positions leave this second layer almost entirely untouched because both major camps assume that a moral patient must be a singular, continuous being. Functionalists tend to assume that if the computation is preserved, the person is preserved, while biological naturalists deny the possibility of the upload altogether. Neither adequately addresses the moral topology of a being that can exist in multiple places at once or be paused without death.

  Current literature in philosophy of mind and ethics leaves this gap open because it largely relies on intuitions derived from biological scarcity. Standard theories of personal identity, such as those rooted in psychological continuity or bodily continuity, presuppose that identity is a one-to-one relation over time. Even reductionist accounts, such as those influenced by Parfit, which allow for branching in thought experiments, typically treat branching as a rare catastrophe or a edge case rather than a standard operational mode of existence. Consequently, ethical frameworks built on these foundations assume that harm is something that happens to a unique locus of experience. When applied to digital minds, these frameworks strain to accommodate scenarios where deletion is reversible, where copies diverge, or where suspension mimics death without the cessation of function. By failing to separate the capacity for suffering from the structural conditions of identity, current debates talk past one another, with one side insisting on the possibility of digital pain and the other insisting on the impossibility of digital identity, without recognising that the latter might undermine the coherence of the former.

  To address this, I propose a realistic method organised over the twelve weeks of the project, divided into four distinct three-week phases. In the first phase, we would focus on the conceptual mapping of the topological layer, reviewing existing literature on personal identity and digital metaphysics to catalogue the specific structural properties that distinguish digital existence from biological existence. This would involve clarifying terms such as non-rivalrous instantiation and diachronic continuity to ensure all participants share a precise vocabulary. The second phase would be dedicated to the development of a framework for duplication and suspension cases, where we would attempt to construct a preliminary model for how harm might be calculated when identity is not singular. Here we would test whether harm is additive across copies or if it attaches to the template itself. In the third phase, we would apply this framework to concrete thought experiments, such as the case of deleting one of a thousand running copies or pausing a mind for a century, to see if our intuitions align with the model. Finally, the fourth phase would involve an explicit evaluation of failure conditions, where we critically assess whether the topological layer collapses back into the experiential layer or whether it stands as a distinct ethical category. This structured progression ensures that we move from definition to modelling, then to application, and finally to critique within the allotted timeframe.

  A successful result for this project would look like a working paper that convincingly argues for the necessity of the topological layer, demonstrating that standard ethical frameworks yield contradictions or absurdities when applied to digital minds without this revision. It would not necessarily need to solve the hard problem of consciousness, but it would need to show that even if consciousness is present, the ethics of interacting with it change fundamentally due to its topology. Conversely, the project would count as failing altogether if we find that the topological properties are morally irrelevant, meaning that the capacity for suffering alone is sufficient to ground rights regardless of copyability or continuity. Another failure condition would be if we cannot coherently define the topological layer without relying on contested metaphysical claims that fall outside the scope of ethical analysis. We must be prepared to accept that the distinction might not hold, but the value of the workshop lies in rigorously testing that possibility rather than assuming it.

  Regarding my confidence in these claims, I am highly confident that the current literature conflates the experiential and topological questions, as evidenced by the recurring confusion in public debates and the lack of specific terminology for digital identity structures in ethical texts. I am also reasonably confident that exposing this conflation will yield productive insights, even if the final conclusion is that the topological layer does not alter moral status. However, the point about which I am least certain is whether the topological layer can be fully disentangled from the experiential layer without collapsing back into standard personhood theories. It is possible that our intuitions about harm are so deeply tied to singular continuity that attempting to separate them renders the concept of harm unintelligible rather than revised. This uncertainty is precisely why a collaborative workshop is necessary, as it requires scrutiny from multiple disciplinary perspectives to determine whether this is a genuine philosophical innovation or a conceptual dead end. I believe this proposal offers a rigorous path forward for clarifying a debate that has become stagnant, and I look forward to discussing this with you further.
