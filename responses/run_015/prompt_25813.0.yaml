answer: |-
  This is one of the most persistent and difficult problems in normative ethics. You are essentially mapping the boundary between **obligation** (what we owe each other) and **supererogation** (the moral "saintliness" that goes beyond what is owed). Your intuitions are actually quite sophisticated; they track with what many ethicists call a "moderate" view, distinct from both strict utilitarianism (which would make Case 3 a duty) and strict libertarianism (which might make Case 1 supererogatory).

  To help you systematize this, I will not simply label your view. Instead, I will construct a principle that attempts to codify your specific data points, test it against your hardest cases, and then identify where your intuitions may be inconsistent.

  ### Step 1: Diagnosing the Factors
  Before stating the principle, let's isolate the variables driving your verdicts. Based on your nine cases, your moral calculus weighs four distinct factors:

  1.  **Magnitude of Sacrifice:** Low cost (Pond, 911) $\rightarrow$ Duty. High cost (Kidney, Grenade) $\rightarrow$ Supererogatory.
  2.  **Bodily Integrity:** Invasions of the body (Kidney, Grenade) seem to have a higher "exemption threshold" than property or time.
  3.  **Special Roles:** Formal or intimate roles (Doctor, perhaps Neighbor) lower the threshold of acceptable sacrifice.
  4.  **Causal Immediacy:** Direct, unique agency (Pond, 911) creates stronger duties than diffuse, statistical agency (Ten Percent).

  ### Step 2: The Proposed Principle
  Here is the principle that best captures your pattern of judgments. I call it **The Principle of Reasonable Demand with Integrity Constraints.**

  > **An agent is morally required to perform an action if and only if:**
  > 1.  **Harm Prevention:** The action prevents significant harm to another.
  > 2.  **Cost Threshold:** The cost to the agent (physical, financial, or temporal) does not exceed a threshold of "reasonable demand."
  > 3.  **Integrity Veto:** The action does not require a significant violation of bodily integrity or the sacrifice of the agent's fundamental life projects.
  >
  > **Modifiers:**
  > *   **Role Multiplier:** If the agent holds a special professional or relational role regarding the victim, the Cost Threshold is raised (more sacrifice is required).
  > *   **Immediacy Multiplier:** If the agent is the unique, immediate cause of rescue, the Cost Threshold is raised.
  > *   **Aggregation Cap:** A life composed entirely of individually required acts does not become a required life-plan; agents retain a right to a personal sphere.

  ### Step 3: Applying the Principle to Your Cases
  Let's run your nine cases through this principle to see where it holds and where it strains.

  *   **1. The Pond:** Harm is high (death). Cost is low (ruined suit). No integrity violation. **Verdict: Duty.** (Preserved)
  *   **2. The Kidney:** Harm is high. Cost is high. **Integrity Veto triggered** (surgical intrusion). **Verdict: Supererogatory.** (Preserved)
  *   **3. The Ten Percent:** Harm is high. Cost is moderate. No integrity violation. No special role. No immediacy (statistical rescue). **Verdict: Borderline.** The principle predicts ambivalence here because it sits right on the "Cost Threshold." (Preserved)
  *   **4. The 911 Call:** Harm is high. Cost is zero. **Verdict: Duty.** (Preserved)
  *   **5. The Grenade:** Harm is high (squad dies). Cost is extreme (death). **Integrity Veto triggered** (life sacrifice). **Verdict: Supererogatory.** (Preserved)
  *   **6. The Lonely Neighbor:** Harm is moderate (suffering). Cost is moderate (time). No formal role, but relational proximity exists. **Verdict: Supererogatory.** (Preserved, but see "Overturning" below).
  *   **7. The Doctor:** Harm is high. Cost is moderate (time). **Role Multiplier triggered.** **Verdict: Duty.** (Preserved)
  *   **8. The Mugging:** Harm is high. Cost is high (physical risk). **Integrity Veto triggered** (risk of injury). **Verdict: Supererogatory.** (Preserved)
  *   **9. The Life's Work:** Individual acts may be permissible/required, but the **Aggregation Cap** protects the agent from being required to surrender their entire life to duty. **Verdict: Supererogatory.** (Preserved)

  ### Step 4: Addressing Your Stuck Cases

  **Case 3: The Ten Percent**
  Your ambivalence here is rational under this principle. You are torn because this case lacks the *Immediacy Multiplier* of the Pond (Case 1) but also lacks the *Integrity Veto* of the Kidney (Case 2).
  *   **The Principle's Verdict:** It suggests this is a **Duty**, provided 10% does not threaten your "fundamental life projects" (Aggregation Cap).
  *   **Why you hesitate:** You likely feel the lack of *Immediacy*. In the Pond, *you* save the child. In the Ten Percent, you contribute to a system that saves a child. The principle suggests that if you accept Case 1, you should logically accept Case 3 as a duty, unless you believe "statistical rescue" is fundamentally different from "direct rescue." I argue it is not, but your intuition on this defines whether you are a "moderate" or a "utilitarian."

  **Case 9: The Life's Work**
  This is the **Aggregation Problem**. If every Saturday visit to the neighbor is a duty, is a lifetime of visits a duty?
  *   **The Principle's Verdict:** No. The **Aggregation Cap** states that morality leaves space for a "personal sphere." You are required to do the right thing *often*, but not *always*.
  *   **Resolution:** The individual acts in the life's work might be supererogatory *because* doing them every day violates the Aggregation Cap. Alternatively, the individual acts are duties, but quitting after a reasonable period (e.g., 5 years of disaster relief) is permissible. The "saintliness" comes from ignoring the Aggregation Cap.

  ### Step 5: Overturning Your Verdicts
  To make your moral framework coherent, I must ask you to reconsider two verdicts. A consistent application of the principle above conflicts with your gut on these points.

  **1. Case 6 (The Lonely Neighbor)**
  *   **Your Verdict:** Supererogatory.
  *   **My Challenge:** This should be a **Weak Duty**.
  *   **Reasoning:** You classify the Pond (stranger, one-time cost) as a duty. The Neighbor involves an existing relationship (proximity) and ongoing harm (loneliness/depression). If you accept that low-cost harm prevention is a duty (Pond), and that relationships increase obligation (Doctor), the Neighbor case combines both. To call it merely "admirable" creates a gap where you allow preventable suffering in your immediate vicinity without moral failure. I suggest reclassifying this as a duty, perhaps one that can be discharged by finding *someone* to visit, not necessarily *you* forever.

  **2. Case 1 vs. Case 3 (The Consistency Check)**
  *   **Your Verdict:** Pond = Duty; Ten Percent = Uncertain.
  *   **My Challenge:** These must match.
  *   **Reasoning:** If the suit in Case 1 represents a significant financial loss, and the 10% in Case 3 represents a significant financial loss, the moral structure is identical. The only difference is distance. Most modern ethicists argue distance is morally irrelevant. If you keep Pond as Duty and Ten Percent as Supererogatory, you are privileging *psychological proximity* over *actual need*.
  *   **Recommendation:** If you want to be consistent, you must either admit the Pond is supererogatory (too high a cost for a stranger) or the Ten Percent is a duty (cost is reasonable relative to life saved). Given your other verdicts (like 911), I recommend moving **Case 3 to Duty**.

  ### Step 6: The Stress Test
  To reveal a weakness in this principle (and in your intuitions), consider this new case:

  **Case 10: The Carbon Footprint.**
  You live in a wealthy country. You know that your individual carbon emissions contribute to climate change, which will cause significant harm (drought, displacement) to strangers in the future. Reducing your footprint to a morally sustainable level requires significant lifestyle changes (no flying, eating less meat, higher costs). It is not immediate (harm is future), not unique (millions emit), and violates no bodily integrity.

  *   **Applying the Principle:**
      *   **Harm:** Significant.
      *   **Cost:** Moderate/High (lifestyle change).
      *   **Integrity:** None.
      *   **Immediacy:** Low (future harm, collective cause).
      *   **Role:** Citizen (weak role).
  *   **The Prediction:** The principle suggests this is **Supererogatory** due to the low Immediacy and lack of Unique Agency.
  *   **The Problem:** Many ethicists argue this *should* be a Duty. If the Ten Percent (Case 3) is a duty because it saves lives statistically, then reducing carbon emissions (which saves lives statistically) should also be a duty.
  *   **The Weakness Revealed:** This exposes a flaw in the **Immediacy Multiplier**. If we allow "lack of unique agency" to reduce duty too much, we escape responsibility for all collective action problems (voting, climate, public health).

  ### Final Recommendation
  Your intuitions are largely those of a **Moderate Deontologist**. You believe in duties of rescue, but you place a hard ceiling on sacrifice to protect the agent's right to a life of their own.

  To resolve your uncertainty:
  1.  **Adopt the Aggregation Cap:** Accept that you are not required to maximize the good over a lifetime (solves Case 9).
  2.  **Equalize Property and Money:** Decide if a ruined suit is morally equivalent to 10% income. If so, align Case 1 and Case 3. I urge you to make Case 3 a **Duty**.
  3.  **Tighten the Neighbor Case:** Acknowledge that proximity creates weak duties, not just admiration (Case 6).

  If you make these three adjustments, your list becomes consistent under the **Principle of Reasonable Demand with Integrity Constraints.** You preserve the right to your own body and life plan, but you accept a robust obligation to prevent harm when the cost to you is reasonable.
