  Hey so I was arguing with my friend last week about whether legal authority is ever really "outside" the system, and it made me think of Hofstadter's strange loops and that Drawing Hands idea where there's an inviolate level — the paper that never gets drawn. Could you analyize Marbury v. Madison (1803) through that lens? I want an actual mapping, not a summary I can read on Wikipedia: what's the hierachy here (Constitution -> Judiciary Act -> Court?), where's the loop exactly (Marshall using Article III authority to strike down part of the statute that creates that authority?), and what is supposed to be the untouched substrate — the ratifying people, the original text, something else? Then tell me what the tangled-hierarchy framework predicts Marshall should have done, whether the case fits or breaks it, and specifcally whether law actually preserves an inviolate level or if Marbury proves the paper is just another hand drawing itself. Does the episode help Hofstadter's claim that every hierarchy eventually leaks, or is constitutional law a special case where the loop is managed?

  Please lead with your bottom line in the very first sentence, then lay out the reasoning with no preamble and don't restate the question. Also don't give me a bibliography or citation list — I just want the argument itself.
