      *Marbury v. Madison* proves there is no inviolate level in legal authority because the Supreme Court constructed a strange loop where it simultaneously acts as the subordinate enforcer of the Constitution and the supreme definer of its limits, effectively drawing the very paper it stands on. In the standard legal hierarchy, the Constitution sits as the meta-rule above statutes, which sit above the judiciary that applies them. Marshall disrupted this stratification by ruling that the Judiciary Act of 1789 was void because it conflicted with Article III, yet the Court's jurisdiction to hear *Marbury* depended entirely on that specific voided statute. This creates a tangled hierarchy where the judiciary (the lower level) uses the Constitution (the higher level) to invalidate the statute (the middle level) that granted the judiciary the power to speak in the first place. If the statute is void, the Court lacked jurisdiction to declare it void; if the Court lacked jurisdiction, its declaration is null; yet the declaration stands, meaning the Court validated its own authority by negating the source of that authority.

