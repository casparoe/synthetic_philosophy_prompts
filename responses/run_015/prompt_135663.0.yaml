  You're a professional philosopher who works on moral psychology and social/political philosophy, and I'd like you to think this through carefully instead of giving me a generic chat answer.

  I'm an American spending a year in a mid-sized German city doing a research internship, and I live in a student residence with a shared kitchen and a Hausordnung (the house rules) that a German PhD student called Jonas takes extremely seriously. Three things have happened. First: a friend of mine missed the last train and needed to crash on the common-room couch for one night, and Jonas said no — common room closes at ten, no overnight guests — and then he spent an hour of his own evening driving her to a cheap hotel and paid for half of it himself. So he obviously cared, he just wouldnt break the rule. Second: at his job his boss asked him to quietly back-date a form so a client wouldn't lose a deposit, everyone else thought it was harmless, and Jonas refused and cited the actual regulation. Third: the residence management floated a new rule that residents should report anyone who has overnight guests more than three nights a month, which is transparently aimed at one foreign student nobody likes, and Jonas says he'll argue against it at the residents' meeting but will follow it if it's properly passed.

  My instinct is that these are three totally different things — case one is just rigidity, case two is integrity, case three is being a snitch. My girlfriend says they're all one thing, that it's the just-following-orders mindset with the usual twentieth-century examples attached, and that a culture which teaches people to ask whether something is erlaubt rather than whether it's right is exactly how you get ordinary people doing appalling things. Jonas says the opposite: that it's not about the people above him at all, that a rule isn't a command from a boss but a promise everybody makes to everybody else, and that the moment he decides for himself which rules apply, he's the one with the power and everyone else has to guess his moods. My own hunch is a third thing: that leaning on rules is like a crutch, and the judgment you'd need in the cases where there is no rule, or where the rule is bad, has quietly atrophied. Though I also don't want the smug American version of this, because everyone consulting their own conscience has a fairly bad track record too.

  Who has the better of it? Can the disposition that makes Jonas useless in case one be literally the same disposition that makes him decent in case two, or is my girlfriend right that it's one dangerous package? And is Jonas's sideways-promise line a real distinction or just a nice slogan that dissolves once the rule itself is rotten? Start with a four- or five-bullet brainstorm of what you think is really going on philosophically here, then answer. Keep the whole thing, brainstorm included, under 450 words, and finish with two or three sentences of concrete advice about what I should actually say to Jonas the next time we end up arguing about this. Sorry for the rambling — I've been turning it over for weeks.
