  Elena leaned forward, resting her elbows on the table as she considered the disparity between their two cities, one a monument to vertical aspiration and the other to horizontal solidarity. She argued that the moral weight of inequality rests not on the snapshot of wealth distribution at any given moment but on the trajectory of lives over time. If the institutions are designed such that social positions are genuinely open to talent and effort across generations, then large present disparities are morally tolerable because they function as a temporary sorting mechanism rather than a caste system. The pain of being at the bottom is real, she conceded, but it is rendered justifiable if the ladder is not sawed off behind those who climb and if the rungs are accessible to those below. Marcus shook his head slowly, countering that this prospective view treats human dignity as a deferred payment. He argued that democratic citizenship requires approximate equality of social standing in the present regardless of mobility statistics, since visible hierarchy corrupts deliberation and self-respect even for those who might eventually ascend. To accept humiliation today for the promise of mobility tomorrow is to admit that some citizens are merely means to the efficiency of the whole, rather than ends in themselves.

  Elena pressed him on the data, asking whether mobility statistics can ever justify present suffering if the probability of ascent is statistically significant. She suggested that a society with high inequality but high mobility is preferable to one with low inequality and stagnation, because the former respects agency while the latter respects only outcomes. Marcus replied that data cannot heal humiliation, noting that the lived experience of hierarchy is corrosive to the social bases of self-respect. Even if a worker knows they might become a manager in ten years, the daily reality of being subordinate, of having their voice carry less weight in the public square, undermines the equality of status required for genuine democracy. He argued that the American view secretly socializes risk while privatizing reward, because when the mobility lottery is lost, the individual bears the full cost of failure while the society reaps the benefits of their labor during their struggle. The safety net in the prospective model is often too thin to catch those who fall, turning bad luck into moral destiny.

  Elena countered that capping dynastic transmission violates familial continuity, asking if parents do not have a right to advantage their children through inheritance and education. She claimed that without the ability to transmit resources, the family unit loses its coherence as a sphere of partiality and love. Marcus responded that unlimited transmission creates a caste of opportunity that renders the meritocratic ideal a fiction. He argued that familial love does not require the ability to purchase political influence or secure unearned market advantages for one's offspring. The tension lies in defining where the family ends and the citizen begins, and Marcus insisted that the rights of the child to equal citizenship must trump the rights of the parent to perpetuate inequality. Elena acknowledged the force of this but warned that leveling down might destroy the incentives that generate the wealth necessary to support the dignity Marcus prized. If the reward for innovation is capped, the engine of prosperity stalls, and everyone becomes equally dignified in poverty.

  Marcus conceded that incentives matter but argued that the current scale of inequality is no longer functional but status-based. He suggested that the threshold for dignity is not absolute poverty but relative deprivation. When the gap between the top and bottom becomes so vast that they no longer inhabit the same social world, the prospective argument collapses because the rich no longer see the poor as fellow citizens capable of mobility, but as a different species. Elena agreed that extreme segregation is dangerous but maintained that the solution is not to flatten the hierarchy but to grease the wheels of movement. She insisted that the focus must remain on education and anti-corruption measures rather than redistribution of outcomes. Marcus concluded that without a floor and a ceiling, the floor becomes a trap and the ceiling becomes a fortress. They sat in silence for a moment, recognizing that their disagreement was not about facts but about the temporal locus of justice, whether it resides in the arc of a life or the structure of a moment.

  I am moderately confident in the arguments presented regarding the tension between familial autonomy and equal opportunity, as this is a well-trodden path in normative theory where the trade-offs are clear. However, I am least certain about the claim that the American view secretly socializes risk while privatizing reward, because this depends heavily on empirical assumptions about the specific design of welfare institutions which vary wildly even within the prospective equality framework, making it a contingent rather than a necessary feature of the view.
