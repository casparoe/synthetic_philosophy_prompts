      *   *Hidden factual question about identity?* Yes, Jasmine's point highlights this. If personhood is the unit of value, defining "person" matters. But even if they are 5 distinct people, Taurek still says numbers don't count. So identity isn't the *whole* problem, but it complicates the aggregation.
