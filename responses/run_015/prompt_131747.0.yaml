  2.  **Deconstruct the Philosophical Landscape:**
      *   **Taurek's Core Claim:** "Numbers don't count." Each individual has a claim to be saved. Aggregating claims is unjust to the one. Fairness requires equal chance (coin flip).
      *   **Marcus's Core Claim (Aggregativism/Utilitarianism):** Loss of 5 is worse than loss of 1. We minimize harm/maximize value.
