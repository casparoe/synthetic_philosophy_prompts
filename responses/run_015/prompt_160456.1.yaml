answer: |-
  **Brainstorming the Fragility of Factored Cognition**

  If we treat deliberation as purely recursive decomposition, the first load-bearing failure is **context stripping**. In HCH, leaf nodes answer sub-questions without seeing the root. But meaning is often holistic; asking "Is this sentence grammatical?" differs from "Is this sentence grammatical *in a legal contract*?" If the leaves don't know the stakes, they can't weight importance, only syntax.

  Second is the **decomposition bottleneck**. Someone at the top must decide how to break the question. If they understand the question well enough to decompose it correctly, they arguably already possess the cognition we're trying to amplify. If they don't, they'll carve nature at the wrong joints, and the tree inherits a structural error no amount of lower-level processing can fix.

  Third is **non-compositionality**. Truths about parts do not always sum to truths about wholes. You can verify every brick in a house is solid and still miss that the design is uninhabitable. If the system bans "gestalt judgment" to avoid bias, it loses the very synthesis required to make the parts meaningful. These three—blind leaves, the omniscient decomposer, and the fallacy of composition—are the richest veins for bureaucratic horror.

  ***

  **AMPLIFIED DELIBERATION PARTNERS**
  **INTERNAL ONBOARDING FAQ (V. 4.2.1)**

  **1. What is my specific role within the Deliberation Tree?**
  You are a Node. Depending on your clearance, you will either decompose queries received from above or answer sub-queries received from above. Most employees are Answer Nodes. You will receive a text string via terminal. You will provide a text string response. You will not be told the original client query. You will not be told the names of the Nodes above or below you. Context leakage compromises epistemic purity. If you find yourself guessing the broader project goal, please submit a Form 12-B (Speculative Overreach) to Compliance.

  **2. Who decides how to break down the client's problem?**
  Tier 1 Decomposers handle root-level segmentation. They are the only personnel permitted to view the original client request. This is a high-stress role requiring the ability to partition complex ambiguities into discrete, context-free units without altering the semantic load. Please note: Tier 1 Decomposers are exempt from the tree structure themselves. Their cognition is not amplified; it is the foundation upon which amplification is built. Do not ask them for help; they are not permitted to speak to lower tiers during active cycles.

  **3. What if my sub-question is just as hard as the parent question?**
  Submit a Circular Reference Ticket. Ideally, every query decomposes into simpler queries until reaching base facts. However, on topics involving ethics, aesthetics, or long-term strategy, nodes occasionally return queries identical to their input. When this occurs, the branch is flagged as an Infinite Regress Loop. The system will automatically truncate the branch at Depth 50 and substitute a median value from adjacent branches. Do not be alarmed if your terminal freezes; you are likely waiting for a descendant to resolve a paradox you initiated.

  **4. How are individual answers combined into a final solution?**
  We assume compositional integrity. If every sub-component is verified, the whole is verified. In cases where sub-answers contradict (e.g., Branch A proves "X is safe" and Branch B proves "X is unsafe"), the Aggregation Protocol applies a weighted average based on node tenure. Holistic or gestalt judgments are strictly prohibited. You may not say "The vibe feels off." You may only evaluate the specific token string provided. Intuition is a legacy cognitive habit and constitutes a violation of the Factored Cognition Policy.

  **5. Will I ever see the final report delivered to the client?**
  Unlikely. Due to the exponential expansion of sub-queries, final deliverables often exceed human reading capacity. A standard Level 3 consultation generates approximately 4 petabytes of justification text. The client receives a summary hash generated by a separate verification tree. No single human being, including the CEO, has read a complete Level 3 deliverable. This is a feature, not a bug; it ensures the conclusion is derived purely from the process, not human bias.

  **6. Who wrote this handbook?**
  This document was produced via Tier-4 Internal Deliberation. It has not been edited by a human. If you find contradictions within these instructions, please decompose them into smaller contradictions and submit them as new tickets. Welcome to Amplified Deliberation Partners. Please log in to begin your shift. Your descendant in Sector 7 is waiting for your input.

  ***

  **Note to Editor**

  This piece treats HCH (Humans Consulting HCH) as a literal business process rather than an alignment idealization. It is faithful to the mechanistic claims: that cognition *is* decomposition, that answers compose, and that context can be stripped without loss. It leans unfair on the "infinite regress" and "unread deliverable" bits; proponents argue the tree bottoms out in human intuition eventually, and the "human" at the root does read the summary.

  The strongest defense a proponent could offer is that I'm conflating *efficiency* with *capability*. They'd argue the point isn't to run a company this way, but to show that a human + tree is *smarter* than a lone human, even if inefficient. They'd say the satire misses the point: HCH isn't about replacing thought with bureaucracy, but defining what "trustworthy thought" looks like when scaled. My counter is that if the model requires banning gestalt judgment to work, it defines "trustworthy thought" as something no human actually does.
