answer: |-
  # OMISSION CAUSALITY CHECKLIST (OCC-1)
  **Purpose:** To determine whether a system failure to act (omission) is a **Reportable Cause** (triggers mandatory redesign) or a **Background Condition** (no redesign required).
  **Users:** Audit Team.
  **Time Limit:** 30 Minutes per incident.
  **Authority:** Lead Auditor Office.

  ---

  ## PROCEDURE STEPS

  ### Step 1: Design Baseline Check
  **Question:** Was there a written design specification, standard operating procedure (SOP), or safety protocol in effect at the time of the incident that explicitly required the system to act or maintain a specific state?
  *   **Evidence Required:** Design schematics, SOP manuals, configuration files dated prior to the incident.
  *   **If NO:** Classify as **Background Condition**. Stop. (Absence without duty is not a cause).
  *   **If YES:** Proceed to Step 2.

  ### Step 2: Operational-Override Check
  **Question:** Was the requirement identified in Step 1 legitimately suspended at the time of the incident via a documented protocol update, authorized maintenance window, or formal reassignment order?
  *   **Evidence Required:** Signed maintenance logs, change-order tickets, or official memo timestamped *before* the incident.
  *   **If YES:** Classify as **Background Condition**. Stop. (The duty was officially paused; the omission is a mere non-event).
  *   **If NO:** Proceed to Step 3.
  *   **⚠️ FLAG FOR MISFIRE:** If the suspension was verbal or informal (e.g., "manager said it was okay"), do not count this as a valid override. Mark for **Hand-Off Point A** (see Step 5).

  ### Step 3: Omission Typology Classification
  **Question:** Which type of failure occurred?
  *   **Type I (Interruptive):** The system was supposed to *stop* an active process (e.g., close a valve, cut power, trigger alarm).
  *   **Type II (Maintaining):** The system was supposed to *keep* a static state (e.g., maintain pressure, hold temperature, sustain barrier integrity).
  *   **Evidence Required:** System function logs, engineering diagrams.
  *   **Action:** Select Type I or Type II. Proceed to Step 4.

  ### Step 4: Prevention Test (Counterfactual Necessity)
  **Question:** Based on the Type selected in Step 3, would performing the expected action have prevented the harm?
  *   **If Type I:** Would the interruption have broken the causal chain leading to the harm? (e.g., Would closing the valve have stopped the flow before contamination spread?)
  *   **If Type II:** Would the maintained safeguard have blocked the pathway entirely? (e.g., Would the correct pressure threshold have prevented the leak from starting?)
  *   **Evidence Required:** Simulation data, historical performance data, engineering assessment.
  *   **If NO:** Classify as **Background Condition**. Stop. (The omission made no difference to the outcome).
  *   **If YES:** Proceed to Step 5.

  ### Step 5: Final Classification & Hand-Off
  **Decision:**
  *   **Standard Path:** If Steps 1, 2 (No override), 3, and 4 (Yes prevention) are satisfied, classify as **Reportable Cause**. Mandatory redesign triggered.
  *   **⚠️ HAND-OFF POINT A (Legitimacy of Authority):** If Step 2 failed only because the override was *informal* (verbal approval, undocumented management decision) but claimed by staff to be valid, the procedure cannot resolve this factually.
      *   **Action:** Flag for Lead Auditor review.
      *   **Issue:** This is no longer a factual question about causation but a value judgment about whether informal management authority overrides written safety baselines.
      *   **Risk:** Listing as **Cause** may conflict with management intent; listing as **Condition** may violate safety compliance standards.

  ---

  ## CASE APPLICATIONS

  ### Case 1: Standard Valve Failure
  **Incident:** Chlorine-monitoring node fails to trigger shutdown valve during contamination spike. Valve designed to respond in 2 seconds; no signal sent. No maintenance mode active.

  **Walkthrough:**
  1.  **Design Baseline Check:** Yes. Design specs require valve response within 2 seconds upon contamination signal. (Evidence: Design Schema v4.2).
  2.  **Operational-Override Check:** No. Logs confirm node was active, not in maintenance, no reassignment orders. (Evidence: System Status Log).
  3.  **Omission Typology:** Type I (Interruptive). The valve was expected to stop an active flow.
  4.  **Prevention Test:** Yes. Engineering simulation confirms that closing the valve within 2 seconds would have contained the contamination before it entered the network.
  5.  **Final Classification:** **Reportable Cause**.

  **Decision Point:** Made at Step 5 (Standard Path).
  **Evidence Required:** Design schema, status logs, simulation data.
  **Judgment Required:** Minimal. The facts align strictly with the procedure.
  **Outcome:** Mandatory redesign of the signaling protocol or valve mechanism.

  ### Case 2: Authorized Maintenance Mode
  **Incident:** Same node type. Placed in maintenance mode by authorized technician 3 hours prior. Automatic shutdown disabled. No manual check occurred. Contamination followed.

  **Walkthrough:**
  1.  **Design Baseline Check:** Yes. Normally, the node must trigger shutdown.
  2.  **Operational-Override Check:** **YES.** An authorized technician placed the node in maintenance mode. There is a digital log of this action timestamped 3 hours before the incident.
      *   **Stopping Rule Applied:** The procedure dictates that if a documented override exists, the expectation of action is suspended.
  3.  **Omission Typology:** (Skipped due to Stop).
  4.  **Prevention Test:** (Skipped due to Stop).
  5.  **Final Classification:** **Background Condition**.

  **Decision Point:** Made at Step 2.
  **Evidence Required:** Maintenance log with technician ID and timestamp.
  **Judgment Required:** Low. The check is binary: Is there a documented override? Yes.
  **Hand-Off Status:** None reached. The authorization was documented, satisfying the "legitimate suspension" requirement. The failure of the *manual check* might be a separate human-resources issue, but regarding the *automated system omission*, it is not a causal factor for redesign under this procedure.

  ### Case 3: Informal Management Approval (The Friction Case)
  **Incident:** Pressure-safeguard system (Type II) failed to maintain threshold. Slow leak accumulated over days. Safeguard was active but calibrated to a higher tolerance. Management approved this calibration informally one week prior. Design documentation was *not* updated.

  **Walkthrough:**
  1.  **Design Baseline Check:** Yes. Written design documentation specifies the original lower pressure threshold.
  2.  **Operational-Override Check:** **NO (Procedurally).** The procedure requires a *documented* protocol update or change-order ticket. The management approval was informal (verbal/email chain not linked to design docs).
      *   **Conflict:** The system operated according to management's wish, but against the written baseline.
  3.  **Omission Typology:** Type II (Maintaining). The system was expected to sustain a static threshold.
  4.  **Prevention Test:** Yes. Had the original threshold been maintained, the leak would not have accumulated to harmful levels.
  5.  **Final Classification:** **Reportable Cause** (Strict Procedure) OR **Hand-Off Point A** (Auditor Discretion).

  **Decision Point:** Made at Step 2/Step 5 Boundary.
  **Evidence Required:** Original design docs (showing old threshold) vs. Email/Memo from management (showing informal approval).
  **Judgment Required:** **High.** This is the "answer you will not like."
  *   **Option A (Strict Adherence):** You classify as **Reportable Cause**.
      *   *Consequence:* Mandatory redesign is triggered. Engineering must revert to old threshold. Management is implicitly cited for operating outside documented safety baselines. This creates organizational friction but maintains audit integrity.
  *   **Option B (Invoke Hand-Off):** You flag for Lead Auditor review under **Hand-Off Point A**.
      *   *Consequence:* You are no longer auditing causation; you are adjudicating whether informal management authority invalidates written safety protocols. This introduces liability and values into a factual report. Regulators may reject this ambiguity.

  **Why This Misfires:**
  The procedure is designed to prevent "shadow systems" (undocumented changes) from excusing failures. However, in this case, the "omission" (failing to hold the old threshold) was actually a commissioned action by management. The procedure forces you to either:
  1.  Ignore management's authority because it wasn't documented (treating the omission as a Cause).
  2.  Break the procedure's requirement for documentation to accommodate management (treating the omission as a Condition).

  **Recommendation for Lead Auditor:**
  In Case 3, you must invoke **Hand-Off Point A**. Do not sign the report as a standard Cause. Escalate to legal/compliance to determine if informal approvals constitute a valid "Operational Override." If they do not, the report must list the omission as a Cause, forcing the organization to choose between compliance (redesign) and bureaucracy (updating docs retroactively). This highlights the procedure's value: it exposes gaps between practice and documentation.
