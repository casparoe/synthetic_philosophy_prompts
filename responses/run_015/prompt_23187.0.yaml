      *   *Flow:* Start with the basis invariance objection. Move to superposition. Then ablation. End on the nature of "reality."

      *(Self-Correction during writing the ablation section)*: I need to make sure Marcus doesn't dismiss ablation entirely. He should admit it shows *causal relevance* but deny it shows *ontological primacy*. Elena should argue that causal relevance in a structured system *is* what ontology amounts to in this context.

      *(Refining the ending)*: They shouldn't shake hands and agree. They should acknowledge the depth of the problem. The "convergence" is on the difficulty, not the answer.

