      *   *Correction:* Ensure Elena doesn't just say "it works." She needs a philosophical grounding. Maybe structural realism?
      *   *Nuance on Superposition:* Marcus should argue that if features are superposed, the "direction" is arbitrary. Elena should argue that the *sparse* direction is the natural one.
      *   *Nuance on Ablation:* Marcus needs to distinguish between *intervention* and *constitution*.

  5.  **Writing the Dialogue (Iterative Process):**
