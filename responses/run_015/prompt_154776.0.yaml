prompt: |-
  You are a professional philosopher of risk ethics and philosophy of science. Before you answer, take a moment to brainstorm: list the three main risk-decisions that drive the plot of Michael Crichton's Jurassic Park (1990) or Steven Spielberg's 1993 film adaptation, identify which characters embody different attitudes toward scientific uncertainty, and note one scene where the narrative seems to endorse caution and one where it seems to ridicule it.

  Then read the work through the lens of the precautionary principle — specifically, the tension between the 'strong' formulation (associated with the 1998 Wingspread Conference, which places the burden of proof on proponents to demonstrate that an activity is harmless) and the 'weak' formulation (which permits action in the absence of full scientific certainty provided that safeguards are proportionate to the potential harm). Do not reduce the story to a simple morality tale about hubris; instead, map specific choices and design features — Hammond's decision to open the park before complete testing, Malcolm's chaos-theory objections, the layered containment-system architecture, the unexpected dinosaur breeding — onto these two formulations, saying precisely where each formulation illuminates a decision and where it misdescribes the actors' reasoning.

  Next, apply a less-discussed conceptual twist: the problem of 'precautionary asymmetry,' in which precaution is demanded aggressively for engineered risks (genetic reconstruction, electric fencing, automated tracking) but not applied with equal force to the 'baseline' risks of leaving nature untouched — predation, disease, extinction dynamics — that the park was meant to study, replace, or commodify. Examine whether this asymmetry undermines the moral coherence of the characters' objections. Where in the plot does the asymmetry appear — for instance, in the treatment of dinosaur welfare versus human safety, or in Hammond's framing of the park as a 'restoration' rather than a creation — and where does the narrative collapse the distinction?

  Finally, assess what Jurassic Park adds to the philosophical debate about precaution that purely conceptual argument misses. Does the depiction of cascading, unforeseen interactions — frog DNA enabling gender switching, weather disruptions disabling systems, behavioral adaptations exceeding predictions — serve as an intuitive case for the strong formulation? Or does Malcolm's fatalism suggest that once system complexity exceeds human modeling capacity, precaution itself becomes impossible to operationalize? Be precise about scenes and character reasoning, avoid inventing dialogue or quoting the text verbatim, and conclude by stating honestly where the work resists this reading and a disciplined critic must concede that the philosophical lens distorts rather than clarifies.
