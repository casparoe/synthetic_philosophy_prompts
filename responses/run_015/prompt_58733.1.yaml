      *   No "both-sides"? Yes.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm bashing the teacher personally, but rather criticizing the *argumentative move*. Keep it focused on the philosophy of biology. Ensure the distinction between "information" and "causation" is clear.

      *(Refining the "Alien Cell" point)*: This is essentially the "context" argument. If the machinery changes, the output changes. Therefore, the information isn't *just* in the DNA. It's in the DNA-Cell system. This supports the student's skepticism.

      *(Refining the "Junk DNA" point)*: Non-coding DNA is often regulatory. Calling it "code" depends on if you think regulation is part of the instruction. It highlights the ambiguity of the word "code."

