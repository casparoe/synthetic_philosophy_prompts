  The quarterly faculty meeting had dragged on for an hour when Department Chair Dr. Aris clicked to the final slide: a bar chart titled "Intuitive Appeal of Ethical Frameworks."

  "Good news," Aris announced, adjusting his glasses. "Our internal survey confirms that Contractualism is significantly more intuitively appealing to this department than Utilitarianism. The aggregate approval rating for Contractualism is 75%, compared to only 25% for Utilitarianism."

  Prof. Kantowski, a tenured moral realist, slammed his hand on the table. "That's absurd. Among the faculty, Utilitarianism polls at 20% approval and Contractualism at 10%. We hate Contractualism."

  Millie, the graduate student representative, raised her hand timidly. "It's not better for us, either. In the grad cohort, Utilitarianism has 90% approval, and Contractualism has 80%. We prefer Utilitarianism too."

  Aris nodded serenely. "You are both statistically correct. Within the faculty stratum, Utilitarianism dominates. Within the graduate student stratum, Utilitarianism dominates. Yet, in the aggregate, Contractualism wins."

  "That's impossible," Kantowski snapped. "If every subgroup prefers X, the whole group must prefer X."

  "Not when career stage is a confounder with skewed marginal distributions," Aris replied, pointing to the footnotes. "Notice the sample sizes. We surveyed 100 graduate students on Contractualism, but only 10 faculty members. Conversely, we surveyed 100 faculty members on Utilitarianism, and only 10 graduate students."

  Kantowski blinked. "So... Contractualism was mostly evaluated by the group that approves of everything, and Utilitarianism was mostly evaluated by the group that approves of nothing?"

  "Precisely," Aris said. "Graduate students are optimists; faculty are cynics. Contractualism benefited from the optimist weighting. Utilitarianism suffered from the cynic weighting. Conditioning on career stage inverts the association entirely."

  "So the 'will of the department' is a statistical ghost?" Millie asked. "It doesn't reflect anyone's actual philosophical conviction?"

  "Correct," Aris said, closing his laptop. "The preference exists only at the level of aggregation. It's a property of the dataset, not the minds within it."

  Kantowski stared at the screen. "So you're saying our ethical truth is contingent on the sampling frame?"

  "Exactly," Aris smiled. "Now, regarding the budget cuts: the aggregate data suggests everyone is thrilled about them. But if we condition on 'having a salary,' the sign flips. Shall we vote on the aggregate?"
