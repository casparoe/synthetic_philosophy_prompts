      *   *Moral Philosophers:* Focus on consistency, moral weight, and the "inflation" problem. If everything is urgent, nothing is. They worry about "duty dilution." They might ally with the User on the moral necessity of intervention but clash on the mechanism (new category vs. reinterpreting existing ones).
      *   *Historians:* Focus on context, specificity, and the danger of analogies. They hate "frameworks" that erase nuance. They will be skeptical of "structured group destruction" as a ahistorical sociological bucket. They might ally with Lawyers on keeping "genocide" distinct but for different reasons (historical accuracy vs. legal utility).
      *   *Alliances:* Lawyers + Historians (Protect the specific term "genocide"). Philosophers + User (Focus on moral obligation), *unless* the Philosophers argue that creating a new category creates a moral hierarchy that is unjustifiable.

  3.  **Drafting the Objections (Iterative Process):**
