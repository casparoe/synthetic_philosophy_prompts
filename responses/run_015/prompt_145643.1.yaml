answer: |-
  ### Part 1: Audience Analysis & Intellectual Alliances

  Before stepping into the room, you must map the terrain. These three subgroups share a skepticism of "concept creep," but for different reasons.

  *   **International Lawyers:** Their commitment is to *prosecutorial viability*. They view the Genocide Convention as a fragile tool; if the definition broadens, convictions become harder, and states will ratify fewer treaties.
      *   *Rhetorical Habit:* They will ask about *enforcement mechanisms* and *precedent*. They will use terms like *mens rea*, *jus cogens*, and "treaty integrity."
      *   *Alliance:* They will align with **Historians** on preserving the specificity of the term "genocide," but they will clash with **Philosophers** if the argument shifts from legal utility to moral obligation.
  *   **Moral Philosophers:** Their commitment is to *consistency* and *moral weight*. They fear that creating a parallel category creates a moral hierarchy where some victims are "first-class" (genocide) and others "second-class" (structured destruction).
      *   *Rhetorical Habit:* They will ask about *normative implications* and *conceptual coherence*. They will worry about "dilution of obligation" (if we have a duty to stop everything, we stop nothing).
      *   *Alliance:* They may support your moral intuition regarding "juridical spotlighting" but will attack your solution if it seems to institutionalize inequality.
  *   **Historians:** Their commitment is to *particularity*. They resist frameworks that flatten distinct events into sociological buckets. They worry that "structured group destruction" becomes an ahistorical catch-all that ignores the specific political ideologies driving the violence.
      *   *Rhetorical Habit:* They will ask about *context* and *anachronism*. They will challenge whether your framework applies retroactively or only prospectively.
      *   *Alliance:* They will side with **Lawyers** against expanding definitions, fearing that your parallel category will eventually cannibalize the historical specificity of the Holocaust, Rwanda, etc.

  **The Dangerous Alliance:** The Lawyers and Historians may combine to argue that your proposal destabilizes the existing ecosystem without offering a functional replacement. The Philosophers are your potential swing vote, provided you can convince them that "equivalent duties" solves the moral hierarchy problem rather than creating it.

  ***

  ### Part 2: Strategic Concessions

  To maintain credibility, you must concede the following immediately in your opening or early Q&A. Do not wait to be cornered.

  1.  **Concede Legal Rigidity:** Explicitly state that you are *not* proposing a change to the 1948 Genocide Convention text for the purposes of criminal prosecution. Acknowledge that the *specific intent* (dolus specialis) requirement is necessary for individual criminal liability.
  2.  **Concede Implementation Vagueness:** Admit that "structured group destruction" currently lacks a treaty architecture. You are proposing a *normative framework* for state obligation and commemoration, not a new penal code for the ICC.
  3.  **Concede the Risk of Bureaucratization:** Acknowledge that creating a new category risks creating a new bureaucracy that could, ironically, become another site of political delay.

  ***

  ### Part 3: The Weakest Point in Your Position

  **The Enforcement Gap:** Your thesis argues that "structured group destruction" should trigger *equivalent duties* of prevention and intervention. However, the Genocide Convention's duties are binding because of the treaty's specific legal status.
  *   **The Vulnerability:** If you remove the legal label "genocide," on what basis do you compel states to act? If the answer is "moral obligation," Lawyers will dismiss it as non-binding rhetoric. If the answer is "new treaty," Philosophers and Historians will ask why we aren't just fixing the old one.
  *   **Preparation:** You must be ready to argue that "duties" can be political and institutional (e.g., UN Security Council triggers, funding mechanisms) without requiring criminal conviction standards. You are decoupling *prevention* from *prosecution*.

  ***

  ### Part 4: The "Forbidden" Question

  **The Question:** "Isn't 'structured group destruction' just a euphemism for when we want the moral capital of the word 'genocide' without the political cost of actually declaring one?"

  *   **Why it's dangerous:** It accuses you of political cowardice. It suggests your framework facilitates the very "juridical spotlighting" you claim to oppose by allowing states to say, "It's not genocide, it's just structured destruction," and then do nothing.
  *   **Survival Strategy:** Do not deny the political utility. Embrace it as a *transitional* tool.
      *   *Response:* "That is a fair risk. However, currently, the choice is binary: declare genocide and face political paralysis, or declare nothing and face moral indifference. My proposal offers a third path: acknowledge the structural reality without getting bogged down in the intent trial *for the sake of intervention*. It forces the conversation onto *prevention* rather than *retrospective labeling*. If states use it to avoid action, that is a failure of political will, not a failure of the category. But currently, the strict category guarantees inaction for anything that isn't a 'perfect' genocide."

  ***

  ### Part 5: Q&A Prep Sheet

  The following objections are ordered by likelihood and potential damage.

  #### 1. The International Lawyer Objection (High Likelihood / High Damage)
  **Objection:** "You propose decoupling intervention duties from the Genocide Convention's intent requirement. But the Convention is a *quid pro quo*: states accepted strict liability because the crime was so narrow. If you create a parallel category with 'equivalent duties' but no *dolus specialis*, you are asking states to accept the same sovereignty costs for a much broader range of internal conflicts. Why wouldn't states simply reject this new category entirely, leaving us with less protection, not more?"

  **Reply (2 mins):**
  "That is the central tension, and I agree the risk of state rejection is real. However, the current *quid pro quo* is already failing. States routinely reject the 'genocide' label even when evidence is strong, precisely because the intent bar is so high it allows for plausible denial. By creating 'structured group destruction,' we are not asking states to accept *more* sovereignty costs; we are asking them to acknowledge a reality they already face but currently ignore because it doesn't fit the legal box.
  The goal is to shift the trigger for intervention from *prosecutorial certainty* to *structural risk*. Currently, we wait until intent is proven—often after the destruction is complete—to act. My framework argues that when the *structure* of destruction is evident (systematic targeting, dehumanization, resource seizure), the duty to prevent should activate immediately, regardless of whether we can prove the leader's specific intent in a court of law. We are trading legal precision for preventive speed. If states reject this, it reveals that their commitment was never to prevention, but only to post-hoc legal purity."

  **Vulnerability Note:** This reply assumes states care about prevention. A cynical lawyer will counter that states prefer the current system *because* it allows inaction. Be ready to admit this is a normative argument, not a predictive one.

  #### 2. The Moral Philosopher Objection (Medium Likelihood / High Damage)
  **Objection:** "You claim this avoids concept creep, but you are explicitly creating a two-tiered ontology of mass violence. You have 'Genocide' (Intent + Duty) and 'Structured Group Destruction' (No Intent + Duty). Doesn't this institutionalize a moral hierarchy where victims of 'genocide' are grievable in a way that victims of 'structured destruction' are not? If the duties are truly equivalent, why do we need two names? If they aren't, haven't you just codified the inequality you claim to critique?"

  **Reply (2 mins):**
  "This is the strongest philosophical challenge to the framework. However, the two names are necessary to preserve the specific historical and legal weight of 'genocide' without diluting it. If we merge them, we lose the specific condemnation of *intent to destroy*, which is a unique moral evil.
  Regarding the hierarchy: The inequality currently exists *de facto* through 'juridical spotlighting.' Rwanda got attention; Chechnya did not, because one was named genocide and the other wasn't. My proposal seeks to make the duties *de jure* equivalent. The names distinguish the *nature of the perpetrator's crime*, not the *value of the victim's life*. A victim of 'structured destruction' is owed the same protection and remembrance as a victim of 'genocide.' The distinction is about the *actor's* culpability, not the *subject's* worth. We need two categories to accurately describe the violence without sacrificing the obligation to stop it."

  **Vulnerability Note:** This relies on the audience believing that "naming" doesn't affect "valuing." Historians may argue that commemorative duty is inextricably linked to the specific label. If they press that "Structured Destruction" will become a second-class citizen in history books, concede that risk but argue it's better than total invisibility.

  #### 3. The Historian Objection (Medium Likelihood / Medium Damage)
  **Objection:** "You speak of 'structural features' and 'perpetrator patterns' as if they are transhistorical constants. But the politics of the Holodomor, the Holocaust, and Srebrenica are radically different. By creating a category like 'structured group destruction,' aren't you flattening these distinct political contexts into a sociological smoothie? Doesn't this framework encourage us to look for structural checklists rather than understanding the specific ideological motivations that drive these events?"

  **Reply (2 mins):**
  "I share the concern about flattening history. However, 'structured group destruction' is not intended to replace historical analysis; it is intended to trigger *political response*. Historians can and should continue to argue about the specific ideological nuances of each event. My category is not a historical explanation; it is a policy threshold.
  The problem with relying solely on specific ideological motivations is that perpetrators often mask them. A regime may not announce an intent to destroy, but their policies—land seizure, language bans, mass detention—create a structure of destruction. Waiting for the ideological 'smoking gun' allows the destruction to proceed. My framework asks us to respond to the *material reality* of the group's disintegration, even while historians continue to debate the *intent* behind it. It separates the *history of the event* from the *obligation to the living*."

  **Vulnerability Note:** Historians hate the separation of "material reality" from "political meaning." Be careful not to sound like a positivist who thinks data matters more than ideology. Emphasize that this is for *intervention*, not *archiving*.

  #### 4. The "Definition Creep" Objection (High Likelihood / Low Damage)
  **Objection:** "If 'specific intent' is too hard to prove, why not just utilize 'Crimes Against Humanity'? It already covers widespread attacks on civilians without requiring specific intent to destroy a group. Why invent a new category rather than using the existing Rome Statute framework?"

  **Reply (2 mins):**
  "Crimes Against Humanity is individual-centric; it focuses on the *act* against the *person*. Genocide, and my proposed parallel, focus on the *fate* of the *group*. A regime can commit crimes against humanity without threatening the existence of the group as such. 'Structured group destruction' captures the sociological elimination of a people—even if the intent is displacement or assimilation rather than biological extermination—which Crimes Against Humanity often misses.
  We need a category that centers the *group's survival*, not just the *individual's safety*. The Rome Statute is a prosecutorial tool for punishing past acts. My framework is a preventive tool for preserving future existence. Crimes Against Humanity asks, 'Did you murder this person?' My category asks, 'Will this community exist in ten years?' Those are different questions requiring different frameworks."

  **Vulnerability Note:** Lawyers may argue that "group survival" is too vague for policy. Be ready to define "destruction" broadly (cultural, sociological) but "structure" narrowly (state-sponsored, systematic).

  #### 5. The "Political Weaponization" Objection (Low Likelihood / High Damage)
  **Objection:** "You argue 'genocide' is a political act. But by creating a new category, aren't you just giving politicians a new euphemism to avoid the G-word? Isn't 'structured group destruction' just 'genocide-lite' for when the West doesn't want to intervene?"

  **Reply (2 mins):**
  "That is the risk I acknowledged earlier. But currently, the 'G-word' functions as a veto. If it's not Genocide, the duty is zero. My proposal changes the default. If we codify 'structured group destruction' with *equivalent duties*, then using the new term cannot be a way to reduce obligation.
  If a state uses the new term to avoid action, they are in violation of the new norm. Currently, they use the absence of the 'genocide' label to justify inaction legally. I am removing that legal shield. It is better to have a new term that mandates action than an old term that allows for paralysis. We must judge the framework by whether it increases intervention, not by whether it preserves the purity of the word."

  **Vulnerability Note:** This is the "Forbidden Question" variant. If they press that norms are easily ignored, concede that no legal norm guarantees action, but argue that *current* norms guarantee inaction for non-Lemkin cases.

  ***

  ### Final Strategic Advice

  *   **Watch the Lawyers' Eyes:** If they start shuffling papers when you talk about "duties," they have checked out. Bring it back to *treaty obligations* or *UN Charter Chapter VII* to keep them engaged.
  *   **Respect the Historians:** Do not use phrases like "in all cases" or "universally." Use "in many instances" or "structurally similar." They will forgive sociological framing if you acknowledge historical exception.
  *   **Anchor the Philosophers:** Keep returning to the *victim*. If the debate gets too abstract about "categories," remind them that "juridical spotlighting" leaves real people without protection. That is the moral hook that will win the room.
