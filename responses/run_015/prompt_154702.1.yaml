      *   Ensure the recommendation is bold.

      *(Self-Correction during drafting)*: I initially thought about suggesting a reduced reading load for drawn members. But the prompt asks me to decide. If they get paid less or read less, they are second-class jurors. They need equal standing to speak up. I will argue for equal load/pay to ensure they feel ownership.
      *(Self-Correction on the Variant)*: The user finds the end-process variant interesting but is unsure. I need to settle it. Rejecting it is cleaner. It ensures commitment.
      *(Self-Correction on Staff)*: Be careful not to accuse the staff of malice. It's about institutional memory becoming decision-making power.

  9.  **Final Review against constraints:**
      *   BLUF? Yes.
      *   Conditions concrete? Yes.
      *   Conflict stated? Yes.
      *   Staff influence addressed? Yes.
      *   No hedging? Yes.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors, The Aldridge Prize
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Member Petition for Jury Reform

  **RECOMMENDATION**

  **Adopt the petition with conditions.**

  We should implement the sortition model and term limits immediately, but we must reject the "end-of-process" variant and establish specific guardrails regarding jury composition and staff roles. If we adopt the petition exactly as written, we risk swapping a stagnation of taste for a chaos of process where institutional staff effectively choose the winner. If we reject it, we signal that the Aldridge Prize is a closed club, which is no longer tenable.

  The following conditions are required for adoption:
  1.  **Pool Eligibility:** Opt-in only for members who have published a book of fiction.
  2.  **Load and Pay:** Drawn members receive the full honorarium and carry the exact same reading load as appointed members.
  3.  **Declinations:** If a drawn member declines, a new name is drawn immediately. No board appointments to fill sortition seats.
  4.  **Chair Eligibility:** The Jury Chair must be an appointed member, not a drawn member.
  5.  **Process Variant:** The "draw at the end" variant is rejected. Jurors are selected before the longlist phase begins.

  **THE PROBLEM**

  The petition is correct. Over the last six years, we have developed a house style. It is not corruption; it is familiarity. When the same eight people read for the same prize every couple of years, they develop a shorthand. They stop arguing about what constitutes quality and start arguing about which book best fits their shared understanding of the prize.

  Two of the last three winners coming from the same small press is a statistical anomaly that signals a systemic issue. The "Permanent Jury" nickname is damaging. It suggests that the Aldridge Prize is no longer discovering excellence but rather curating a specific aesthetic lineage. This alienates our membership and, eventually, our applicants.

  **MY CONFLICT AND THE EXPERTISE TRAP**

  I need to state my position clearly. I am termed out under the proposed rules. I have judged twice. I also received my one real career break when a repeat juror championed my second novel in a room where nobody else had finished it. I benefited from the system we are now dismantling.

  However, my hesitation is not selfish. It is about the function of expertise.

  The career people on our juries have read four hundred novels in the form. They can tell when a book is doing something difficult that looks like a mistake. A randomly drawn member, even a published author, is likely to sit quiet for two meetings and then vote with whoever spoke most confidently.

  If we are not careful, sortition gives us the look of openness while the real decision still gets made by the two loudest people in the room. That is worse than the current arrangement. The current system is at least honest about who holds the power. A mixed jury where three members feel like guests creates a false democracy.

  To mitigate this, drawn members must be treated as equals, not tokens. This is why I recommend they carry the **same reading load** and receive the **same honorarium**. If they read less, they will speak less. If they are paid less, they will feel like temp workers. They must be full partners from day one. However, the **Chair must remain an appointed member**. We need one person in the room who knows the procedure, the history, and the ethics of the prize to steer the discussion without dominating the vote.

  **THE FOUNDATION STAFF**

  We must also face the reality of the Foundation Director and her staff. In public, they are neutral. In practice, they schedule the meetings, chair the discussions, draft the citation, and quietly do a lot of the shortlisting when jurors fall behind on the pile.

  The staff is the only continuous thing in the process. Jurors come and go. If we increase turnover via term limits and sortition, the institutional memory shifts entirely to the Foundation.

  Under the current system, the "Permanent Jury" acts as a check on the staff. They know the history. They push back if a shortlist looks too safe or too weird. If we replace the Permanent Jury with a rotating cast of strangers, the staff's suggestions become the default position. A tired juror will accept the staff's pre-sort. A drawn member who doesn't know the prize's history will trust the Director's summary.

  To prevent the staff from capturing the process:
  1.  Staff may organize the books, but they may not score them.
  2.  Staff may draft the citation *after* the vote, not before.
  3.  The Board will audit the longlist composition annually to ensure it reflects the jury's scores, not staff triage.

  **THE VARIANT: WHY WE REJECT THE "END-OF-PROCESS" DRAW**

  A few members have proposed holding the lottery at the end of the process, drawing three names only from those who actually returned scores on time. The logic is appealing: it rewards labor.

  I recommend we reject this.

  Sortition is supposed to represent the membership, not just the diligent. More importantly, this creates a two-tier jury system during the longlist phase. The appointed members know they are voting for the winner. The potential pool knows they are doing slog work for a lottery ticket.

  This changes how they read. They might score strategically to look engaged, or they might treat the longlist as a burden rather than a duty. We need six people committed to the winner from the very first pile of manuscripts. Commitment requires certainty. You cannot ask someone to invest months in a prize if their seat at the final table is a gamble.

  **CONCLUSION**

  The Aldridge Prize is at a pivot point. We can remain a prestigious but insular award that rewards the same circles, or we can open the doors and risk some friction.

  I believe the friction is necessary. The risk of a "loud voice" dominating a mixed jury is real, but it is manageable if we ensure the drawn members are fully compensated and fully loaded with work. The risk of staff capture is also real, but manageable if we keep the Chair as an experienced appointee and restrict staff from pre-judging the work.

  I move that we adopt the petition with the conditions outlined above. This allows us to answer the membership's demand for reform without dismantling the expertise required to judge fiction fairly.

  **VOTE REQUIRED:** Simple Majority
  **NEXT STEP:** Vote at the scheduled meeting in three weeks.
