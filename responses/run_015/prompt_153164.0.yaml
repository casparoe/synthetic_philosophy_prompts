answer: |-
  # Q&A Prep Sheet: The Delegation Condition & The Confabulating Surrogate

  ## Strategic Assessment

  **The Pressure Point:** **Clause (iii) (Accountability for Errors).**
  Clauses (i) and (ii) are behavioral enough to pass muster with the PP crowd and the grad students. Clause (iii) requires the subject to treat the artifact's failure as *their own* slip. The Internalists will argue that you cannot take responsibility for a process you do not internally monitor. If "answering for errors" requires knowing *why* the error occurred, you have smuggled internal access back in.

  **The Collapse Question:** **Yes, there is a risk.**
  Your condition requires a normative stance (accountability) that looks suspiciously like an internalist criterion for agency. You are defining "cognitive extension" via a subject's *attitude* toward the tool, not the tool's physical integration.
  *   **Honesty Strategy:** In the talk, frame this explicitly. "I am not offering a metaphysical boundary based on skin/skull, but a normative boundary based on agency. If that looks internalist, it is internalist about *agency*, not location." If you try to hide this, the older internalists will smell blood.

  **The Single Reply That Must Land:** **The Neural Confabulation Analogy.**
  If the philosopher of psychiatry convinces the room that neural confabulation is *not* a memory process (but a failure of one), your claim that the surrogate "genuinely remembers" collapses. You must establish that confabulation is a *mode* of memory, albeit a broken one, not the *absence* of memory.

  **What to Concede in the Paper:** **The Ambiguity of "Memory."**
  Concede early that you are using "memory" to denote a *process type* (information retrieval and integration), not a *success term* (veridical recall). This preempts the epistemologist who wants to say "she doesn't know, so she doesn't remember."

  **The Question You Hope Nobody Asks:**
  *"If the device shapes her narrative identity through confabulation, is the 'she' who delegates the task the same 'she' who answers for the errors?"*
  (This threatens the stability of the subject required for your Delegation Condition.)

  ---

  ## The Eight Objections (Ordered by Damage Potential)

  ### 1. The "Normative Camouflage" Objection
  **Who:** The Older Internalist (Coupling/Constitution skeptic).
  **Idiom:** "Rational Integration," "Normative Ownership," "Access."
  **The Objection:** "You claim to avoid internalism, but your third clause—answering for errors—requires the subject to recognize the artifact's output as a candidate for rational revision. If she doesn't know the device invents details, she isn't treating it as a memory; she is treating it as an oracle. You can't have normative ownership without access to the grounds of the belief. You've just dressed up internalist justification conditions as externalist process conditions."
  **The Reply (2 mins):** "I distinguish *access to grounds* from *commitment to standards*. A pilot answers for a navigational error caused by a faulty instrument without understanding the instrument's circuitry. Her 'answering for' is behavioral: she initiates correction protocols. That is a public, observable disposition, not an introspective state. The internalist demands she see the gears; I only require she accepts the burden of the steering."
  **Soft Spot:** If she never suspects invention, is it really "answering for error" or just "reacting to surprise"? If it's just surprise, a thermostat does that. You need to show her reaction is *normative*, not just causal.

  ### 2. The "Clinical Category Error" Objection
  **Who:** The Philosopher of Psychiatry.
  **Idiom:** "Phenomenology," "Pathology," "Ecological Validity," "Anosognosia."
  **The Objection:** "Your analogy fails. In clinical confabulation, the patient lacks the *feeling* of effortful retrieval; it is phenomenologically distinct from remembering. The surrogate *feels* like she is remembering because the device gives her that feeling. By calling the device 'memory,' you obscure the fact that the patient has lost the capacity for memory and replaced it with a simulation. Calling that 'extended memory' is like calling a prosthetic leg 'extended walking'—it's a replacement, not an extension."
  **The Reply (2 mins):** "Function over phenomenology. If the neural system produces confabulation, we still call it a memory system gone wrong, not a non-memory system. The cognitive *role* is the same: past-information retrieval for current guidance. Whether the glitch is in the hippocampus or the algorithm is irrelevant to the process classification. We shouldn't let the location of the pathology dictate the taxonomy of the faculty."
  **Soft Spot:** Clinicians *do* distinguish between 'impaired memory' and 'confabulation' as distinct syndromes. If the literature treats them as mutually exclusive categories, your functionalism looks naive.

  ### 3. The "Structural Opacity" Objection
  **Who:** The Social Epistemologist.
  **Idiom:** "Testimonial Injustice," "Hermeneutical Resources," "Black Boxing."
  **The Objection:** "You say she answers for the errors. But if the device is proprietary code she cannot inspect, she literally *cannot* answer for the errors in the way you describe. She can only apologize. This isn't cognitive extension; it's epistemic dependency. By calling this 'her memory,' you absolve the manufacturers of the device from responsibility for the confabulation. You are laundering corporate epistemic negligence as individual cognitive process."
  **The Reply (2 mins):** "I agree the injustice is real, but it targets *entitlement*, not *process*. A soldier is responsible for a drone strike even if she doesn't understand the targeting algorithm. The injustice lies in the distribution of credit and blame, not in the boundary of the cognitive system. We can condemn the opacity without denying the extension. Denying extension hides the problem; acknowledging it forces us to ask why we allow opaque artifacts into our cognitive loops."
  **Soft Spot:** If the opacity is total, can Clause (iii) ever be satisfied? If she *can't* revise the artifact, only replace it, is that "answering for errors" or "consumer returns"?

  ### 4. The "Markov Blanket" Objection
  **Who:** The Predictive Processing / Active Inference Colleague.
  **Idiom:** "Prediction Error Minimization," "Statistical Boundary," "Category Mistake."
  **The Objection:** "This is 20th-century boundary policing. On active inference, the boundary is wherever prediction error is minimized. If the device minimizes error better than the brain, it's inside the blanket. Your 'Delegation Condition' is folk psychology. You're asking 'who is responsible?' when the system is asking 'how do we reduce surprise?' You're reifying a boundary that is actually a dynamic gradient."
  **The Reply (2 mins):** "Markov blankets describe *causal* boundaries; I am mapping *normative* ones. A tumor might minimize prediction error by killing the host, but we don't call it part of the mind. We need a vocabulary for agency to explain why we sue the driver, not the car. Your model explains the mechanics; mine explains the accountability. We need both."
  **Soft Spot:** PP proponents often think "normativity" is just a higher-order description of error minimization. They may view your distinction as illusory.

  ### 5. The "Empirical Checkability" Objection
  **Who:** The Graduate Students.
  **Idiom:** "Operationalize," "Behavioral Markers," "Falsifiability."
  **The Objection:** "How do we test Clause (ii) or (iii)? 'Presumptive authority' and 'disposed to answer' sound like we need to ask the subject. If we have to ask her, we're back to introspection. If we watch her, how many corrections constitute a 'disposition'? If this is a scientific claim about the world, where are the metrics?"
  **The Reply (2 mins):** "We operationalize it like we do 'belief.' We look for counterfactual robustness. If the device says 'turn left' and she sees a wall, does she stop? If the device says 'you ate eggs' and she finds a receipt for toast, does she hesitate? We look for the friction between the output and her other commitments. It's observable in the hesitation, the correction latency, the verbal reports of frustration."
  **Soft Spot:** "Hesitation" is notoriously hard to distinguish from simple processing delay. You risk making the condition unfalsifiable in hard cases.

  ### 6. The "Entitlement Gap" Objection
  **Who:** The Second Older Internalist (Epistemology focus).
  **Idiom:** "Warrant," "Defeaters," "Cognitive Achievement."
  **The Objection:** "You separate process from entitlement. Fine. But if the process yields false beliefs systematically (confabulation), and she treats them as knowledge, she is not a knower. Why call this 'extended mind' rather than 'extended delusion'? If the output doesn't track truth, and she can't tell the difference, you've extended the *pathology*, not the *cognition*."
  **The Reply (2 mins):** "Because cognition is not defined by success. Perception is a cognitive process even when I hallucinate. Reasoning is a cognitive process even when I fall for a fallacy. If we only call successful processes 'cognitive,' we can't study failure. I want to say she is *remembering badly*, not that she is *not remembering*."
  **Soft Spot:** Internalists argue that hallucination is a *degenerate* case of perception, whereas confabulation might be a *different kind* of mental state entirely (imagination posing as memory).

  ### 7. The "Diachronic Instability" Objection
  **Who:** The Social Epistemologist or PP Colleague.
  **Idiom:** "Scaffolding," "Niche Construction," "Fluidity."
  **The Objection:** "Your condition is too static. What if she delegates on Monday, distrusts on Tuesday, and relies on Wednesday? Does the mind expand and contract daily? If the boundary depends on her current attitude, the 'extended mind' isn't a stable object of study. It makes the ontology of mind dependent on mood."
  **The Reply (2 mins):** "Cognitive boundaries *should* be fluid. We don't have a fixed 'mind size.' When I pick up a cane, my tactile system extends; when I put it down, it retracts. The Delegation Condition captures this fluidity. Stability comes from the *habit* of delegation, not the permanent integration of the tool."
  **Soft Spot:** If the mind retracts every time she doubts the device, does "extended mind" lose its theoretical utility? It becomes just "tool use."

  ### 8. The "Credit Distribution" Objection
  **Who:** The Social Epistemologist.
  **Idiom:** "Epistemic Credit," "Distributed Cognition," "Labor."
  **The Objection:** "If the device confabulates, and she corrects it, who gets the credit for the correction? If the device is doing the heavy lifting of retrieval, and she is just doing the error checking, is it still *her* memory? You risk erasing the labor of the engineers who built the correction protocols."
  **The Reply (2 mins):** "Credit tracks the *goal*, not the *gear*. The engineer built the tool for her ends. She sets the query, she acts on the result, she lives with the consequence. The engineer gets credit for the tool's reliability; she gets credit (or blame) for the life lived based on the data. Extended mind doesn't erase the toolmaker; it situates the tool within the agent's life."
  **Soft Spot:** In cases of algorithmic bias, the "agent's life" is shaped by the engineer's values. Distinguishing the two is politically difficult.

  ---

  ## Final Advice for the Seminar Table

  **On the Collapse:**
  Do not fight the charge that your view is "internalist about agency." Own it. Say: *"Externalism about location requires Internalism about commitment. You cannot outsource the responsibility."* This disarms the Older Internalist (who sees you acknowledge the normative core) while keeping the Externalist conclusion (the process is still outside the skull).

  **On the Psychiatry Case:**
  Spend your limited capital here. If the Philosopher of Psychiatry nods, the room will follow. Bring a quote or a case study where clinicians treat confabulation as a *memory disorder* rather than a *non-memory state*. If you lose this, the "Confabulating Surrogate" becomes a "Lying Diary," and the thesis fails.

  **During Discussion:**
  Watch the Graduate Students. If they look confused by "Presumptive Authority," pivot to the "Pilot and Autopilot" analogy immediately. It is the most robust intuitive pump for Clause (ii) and (iii).

  **The "Hope Nobody Asks" Contingency:**
  If someone asks about the stability of the Subject ("Who is the 'she' that delegates?"):
  *Reply:* "The subject is constituted by the very delegation patterns I describe. It's a bootstrapping operation. We don't need a pre-existing homunculus to delegate; the capacity to delegate is what makes her a subject of that cognitive process." (This is risky, but better than admitting the subject dissolves).
