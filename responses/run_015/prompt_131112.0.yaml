answer: |-
  1. Your book argues that legitimacy comes from descriptive representation rather than authorization. But if the public doesn't recognize themselves in the chamber because the selection process feels alien, does the theoretical legitimacy matter?
  **Follow-up:** So you're saying perception trumps the statistical reality? Then isn't the "mirror" just another brand to be sold, rather than a structural fix?

  2. You want the chamber to be a statistical mirror, but acceptance rates for these assemblies are historically low and volunteers skew politically engaged. It looks like you can't have both the fairness argument and the mirror argument; how do you resolve that filter?
  **Follow-up:** If you compel attendance like jury duty to fix the skew, you're coercing legislation. If you don't, you have a self-selected elite. Which compromise are you making?

  3. If no one can build a career out of office, durable power sits with the permanent staff, the lobbyists who outlast each cohort, and the employers who hold your job for you. Careerism doesn't vanish, it relocates. How do you stop the bureaucracy from becoming the real legislature?
  **Follow-up:** Regulations only work if someone enforces them. If the enforcers are also term-limited amateurs, who is watching the permanent staff?

  4. Real power lies in agenda-setting, yet your term limits rule out anyone building a mandate around it. Who decides what this chamber actually votes on, and why wouldn't they become the de facto rulers?
  **Follow-up:** If you say another random body sets the agenda, you've just pushed the problem back one step. Who sets the agenda for the agenda-setters?

  5. Regarding the recent Irish and French citizens' assemblies: what specific result would you count as a failure of the idea itself, rather than just a badly run process?
  **Follow-up:** If every negative outcome is attributed to implementation error, how do we distinguish a flawed theory from a flawed execution?

  6. You keep some elected offices but remove the legislature. Won't political parties simply migrate their power operations to the remaining elected executives, leaving the random chamber as a rubber stamp?
  **Follow-up:** If the parties control the executives and the agenda, isn't the random chamber just theater?

  7. Without re-election, there is no retrospective voting. If the chamber makes a catastrophic error in year one, the public must wait out the term. Is there any mechanism for mid-term correction that doesn't reintroduce elections?
  **Follow-up:** If the only correction is waiting for the term to end, aren't you asking the public to absorb costs without consent?

  8. Let's isolate your system from elections entirely. If a randomly selected chamber passes a law that statistically mirrors public opinion but economically devastates the country due to a lack of expertise, is that outcome a legitimate expression of democracy, or a failure of the institution itself?
  **Follow-up:** If you say it's a failure, you need a correction mechanism that isn't elections. If you say it's legitimate, you prioritize description over welfare. Which is it, without referencing the flaws of the alternative?

  9. You propose hard lifetime term limits for the handful of elected offices you'd keep. Why is executive power safe for election while legislative power is not, given that executives often dominate the legislative agenda?
  **Follow-up:** If the elected executive sets the budget and the random legislature approves it, haven't you just created an elected monarchy with a consultative assembly?
