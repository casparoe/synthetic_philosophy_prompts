answer: |-
  ### Brainstorming Candidate Cruxes

  1.  **The Interpersonal Comparison Trap:** The question could focus on whether Asha and Ben can truly know the trade is Pareto superior without comparing utility units. If values are plural and incommensurable, Asha's "gain" on Issue 1 might not be comparable to Ben's "gain" on Issue 2. *Verdict:* Too technical. It drifts into welfare economics and metric theory rather than moral agency. Students will just wave hands at "incommensurability" without engaging the moral action.
  2.  **The Lexical Constraint Hard-Stop:** Introduce a variant where Asha believes S is morally forbidden, not just worse. The question becomes whether trade is possible when values are lexical. *Verdict:* Too binary. It turns into a simple "deontology beats consequentialism" essay. It doesn't capture the nuance of *compromise* where both sides give up something permissible but suboptimal.
  3.  **The Unit of Moral Assessment (Selected):** The core tension is whether we evaluate the morality of the trade act-by-act (Asha votes for S, which she dislikes) or package-by-package (Asha secures P+S, which she prefers). This forces students to synthesize integrity (am I doing wrong on Issue 2?) with pluralism (can issues be bundled?) and social choice (is the outcome stable?). *Verdict:* This is the one. It prevents rote labeling because "integrity objection" alone doesn't solve it; they must argue *where* integrity applies.

  ***

  ### Exam Question

  **Question 4 (20 Marks)**

  Consider two agents, Asha and Ben, settling two independent policy decisions. On Issue 1, Asha prefers outcome P to the compromise M1 to outcome Q; Ben prefers Q to M1 to P. On Issue 2, Asha prefers R to the compromise M2 to S; Ben prefers S to M2 to R. Both agents prefer the "trade" package (P, S) to the "compromise" package (M1, M2). In this trade, Asha gets her preferred outcome on Issue 1 but concedes on Issue 2; Ben gets his preferred outcome on Issue 2 but concedes on Issue 1.

  Assume both agents are morally motivated, not merely self-interested, and that their preferences reflect genuine moral judgments about what ought to be done. Evaluate the moral permissibility of the trade package (P, S). Specifically, address whether the moral evaluation of this agreement should be conducted act-by-act (evaluating the decision on Issue 2 in isolation) or at the package level (evaluating the combined outcome). In your answer, engage with the implications for moral integrity and the structure of value pluralism.

  ***

  ### Model Answer

  The scenario presented describes a classic logrolling arrangement, often defended in social choice theory as a Pareto improvement: both agents prefer the trade package (P, S) to the compromise package (M1, M2). However, because the agents are morally motivated rather than self-interested, the economic efficiency of the trade does not automatically settle its moral permissibility. The central philosophical problem is determining the correct unit of moral assessment. If we evaluate the decisions act-by-act, the trade appears to require a violation of integrity; if we evaluate the package holistically, the trade appears morally mandatory. Resolving this tension requires examining how value pluralism structures moral agency.

  If we adopt an act-by-act evaluation, Asha faces a significant moral hurdle. On Issue 2, she morally prefers R to M2 to S. By agreeing to the trade, she actively supports or permits S, which she judges to be morally inferior to the compromise M2, and strictly worse than her ideal R. If moral integrity requires acting in accordance with one's best judgment on each distinct moral question, then Asha is complicit in a moral wrong on Issue 2 to secure a moral good on Issue 1. This mirrors the "dirty hands" problem: she soils her integrity on one dimension to achieve success on another. A strict deontological view might hold that moral constraints are issue-specific. If S involves a rights violation or a specific injustice, Asha cannot "buy off" her participation in that injustice by pointing to her victory on Issue 1. On this view, the independence of the issues matters morally; the fact that they are bundled procedurally does not bundle them normatively.

  However, the act-by-act view ignores the reality of collective agency and the structure of the available options. Asha is not choosing between S and R in isolation; she is choosing between the package (P, S) and the package (M1, M2). Given her preferences, she judges the state of affairs (P, S) to be morally superior to (M1, M2). If moral agents are responsible for bringing about the best available state of affairs, then she is obligated to choose the trade. To insist on act-by-act evaluation here is to engage in a form of moral fetishism that prioritizes the purity of the individual vote over the actual outcome. In a pluralistic society where agents disagree, the "compromise" (M1, M2) is not a neutral baseline; it is itself a positive outcome that both agents find inferior to the trade. Refusing the trade because it requires conceding on Issue 2 amounts to insisting on a mutually worse outcome simply to avoid the appearance of inconsistency on a single issue.

  The crucial move in resolving this tension is to recognize that the unit of moral assessment depends on the commensurability of the values at stake. If the values underlying Issue 1 and Issue 2 are sufficiently distinct (value pluralism), then trade might seem category mistakes—like trading justice for efficiency. However, if both agents view these as competing goods within a single coherent framework of "the good society," then package evaluation is permissible. The trade is morally permissible only if the agents can view the package as a single complex action. If Asha views Issue 2 as a lexical constraint (where S is forbidden regardless of consequences), the trade collapses. But if Issue 2 is a matter of degree or weighting, the package view holds.

  Furthermore, we must consider the strategic implications for moral discourse. If package deals are normalized, agents are incentivized to intensify their stated preferences on issues they care about to gain bargaining leverage. This creates a "fanaticism premium," where modest agents lose out to those who claim their values are non-negotiable. While this is a practical worry, it does not strictly render the trade impermissible; it merely suggests that the conditions for valid agreement require transparency. The moral risk is not the trade itself, but the distortion of moral testimony required to secure it.

  Ultimately, the trade (P, S) is morally permissible provided that the concession on Issue 2 does not violate a side-constraint. The act-by-act objection fails because it treats the compromise (M1, M2) as a moral default rather than one option among others. Since both agents judge (P, S) to be superior, integrity is best served by securing the better package rather than clinging to isolated victories that yield inferior total outcomes. The integrity objection only gains traction if the values are truly incommensurable such that no trade-off ratio exists. Absent lexical constraints, moral agents in disagreement are permitted to bundle decisions to achieve Pareto superior states of affairs, provided they evaluate the bundle as the unit of agency.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Identification of the Core Tension (4 marks)**
  *   **Must Hit:** Clearly articulate the conflict between act-by-act evaluation (integrity on specific issues) and package-level evaluation (overall outcome superiority).
  *   **Typical Error:** Students describe the scenario economically (utility gains) without identifying the *moral* conflict regarding agency and integrity.

  **2. The Integrity/Dirty Hands Objection (4 marks)**
  *   **Must Hit:** Explain why Asha might feel she is doing something "wrong" on Issue 2 by supporting S, even if she likes the total package. Mention the separation of issues.
  *   **Typical Error:** Students claim integrity is violated simply because she didn't get her way, rather than because she actively supported a suboptimal moral outcome.

  **3. The Package-Level Defense (4 marks)**
  *   **Must Hit:** Argue that the relevant choice is between outcomes (P,S) and (M1,M2), not between S and R. The compromise is not a neutral baseline.
  *   **Typical Error:** Treating the compromise (M1, M2) as the moral default that requires justification to move away from, rather than just another inferior option.

  **4. Conditions for Permissibility (Pluralism/Constraints) (4 marks)**
  *   **Must Hit:** Distinguish between tradable preferences and lexical constraints. The trade is only valid if Issue 2 doesn't involve a forbidden act (incommensurability/lexicality).
  *   **Typical Error:** Assuming all values are tradable (pure consequentialism) or no values are tradable (rigid deontology) without nuance.

  **5. Strategic/Second-Order Implications (4 marks)**
  *   **Must Hit:** Briefly address the "fanaticism premium" or the risk of distorting moral testimony to gain bargaining power.
  *   **Typical Error:** Ignoring the long-term procedural effects of normalizing logrolling on moral discourse.

  **A/B Boundary:**
  *   **A Answer:** Explicitly argues that the *unit of agency* is the decisive factor. They explain *why* we might be allowed to bundle issues (coherent framework) vs. when we aren't (lexical constraints), rather than just listing pros and cons.
  *   **B Answer:** Correctly identifies the integrity objection and the Pareto improvement but treats them as opposing forces without resolving how the structure of agency determines which one wins.

  ***

  ### Professor's Note on the A/B Boundary
  The difference isn't about knowing the vocabulary; it's about locating the moral weight. A B-student says "Integrity says no, Pareto says yes, it's hard." An A-student says "Integrity applies to acts, Pareto applies to outcomes; the question is whether our moral agency is defined by the single vote or the negotiated settlement." That shift from *conflict* to *structure of agency* is what I'm looking for.
