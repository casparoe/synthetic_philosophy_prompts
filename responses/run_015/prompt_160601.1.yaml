  2.  **Brainstorming Cruxes (based on seed):**
      *   *Idea 1 (Interpersonal Comparison):* The trade relies on intensity of preference. If values are incommensurable, can we compare Asha's gain on Issue 1 to Ben's gain on Issue 2? If not, is (P, S) really Pareto superior, or just mutually beneficial relative to subjective utilities? *Critique:* Too technical/economic. Might drift into social choice theory rather than moral philosophy.
      *   *Idea 2 (Integrity/Dirty Hands):* Asha votes for S (which she thinks is wrong) to get P. Is this compromising integrity? Does logrolling require moral schizopherenia? *Critique:* Good, but might just lead to "yes, integrity objection" rote answers.
      *   *Idea 3 (Lexical Constraints):* What if S is forbidden, not just dispreferred? Then trade stops. This tests the limits of consequentialist bargaining vs. deontological constraints. *Critique:* A bit binary.
      *   *Idea 4 (The "Package" vs. "Act" Evaluation):* The core moral puzzle. Is it permissible to do X (which is suboptimal/wrong in isolation) if it enables Y (which is optimal/right)? This touches on the structure of agency. Is the unit of moral evaluation the single issue or the negotiated package? This connects integrity, pluralism, and the structure of the deal.
      *   *Selection:* Idea 4 is the strongest. It forces students to confront *why* the trade is morally interesting. It's not just "they both get more utility." It's "they both enact something they deem inferior on one dimension to secure something superior on another." This touches on integrity (doing what you think is wrong), pluralism (are the issues separable?), and the moral status of the compromise itself. It avoids rote labeling by requiring them to justify the *unit of moral assessment*.

