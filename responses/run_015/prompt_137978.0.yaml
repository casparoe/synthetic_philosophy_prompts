answer: |-
  Welcome to the anthropic sorting quiz. Please read through the following scenarios in order. For each one, choose the option that matches your gut feeling most closely, even if you are unsure. Keep track of your choices, for example by writing down Q1a or Q2b, and follow the instructions at the end of each paragraph to find your next question. When you have answered all directed questions, move to the scoring key at the bottom of the page.

  Q1. Imagine you learn that your birth rank among all humans who will ever live is surprisingly early, say within the first five percent. Does this fact alone make you think it is more likely that humanity will go extinct soon rather than lasting for millions of years? If you think yes, go to Q2. If you think no, go to Q8.

  Q2. Suppose you are watching a TV show and you know nothing about it except that you are watching episode ten. Does this make you think the show is more likely to have only twenty episodes rather than two hundred? If you think yes, go to Q3. If you think no, go to Q4.

  Q3. Imagine that in the future almost all minds are digital uploads running on hardware, vastly outnumbering biological humans in any given year, though perhaps not in total lives lived. If you are biological, do you count your birth rank among all minds or only among biological humans? If you say only biological humans, go to Q5. If you say all minds, go to Q6.

  Q4. Consider the fact that you exist at all. Does the mere fact of your existence provide evidence that the total number of observers in the universe is large, enough to cancel out the evidence from your early birth rank? If you say yes, go to Q9. If you say no, go to Q5.

  Q5. A foundation has a fixed pot of money to either reduce extinction risk or fund a near-certain near-term cause. If you accept that doom is more likely due to your birth rank, does this make the extinction work more urgent despite there being fewer future people to save? If you say yes, go to Q10. If you say no, go to Q9.

  Q6. A committee you sit on is deciding whether to create a huge population of people who will exist after you and never interact with you. Does creating them change the probability that you are living in the early era? If you say yes, go to Q10. If you say no, go to Q7.

  Q7. Imagine the same huge population exists on a sealed-off branch of reality you could never have been part of. Does their existence change the probability that you are living in the early era? If you say yes, go to Q9. If you say no, go to Q10.

  Q8. Do you reject the idea that you can update your beliefs based on your own existence or birth rank at all, regardless of the scenario? If you say yes, you are done. If you say no, but only because you think the total number of observers is infinite, go to Q9. If you say no for other reasons, go to Q3.

  Q9. If you grant that the probability of doom shifts, does this shift actually change how you should bet or act, or does it cancel out in expected utility terms? If you say it changes action, go to Q10. If you say it does not change action, you are done.

  Q10. Final check. If you had to choose between a world where you are one of a billion people or one where you are one of a trillion, does knowing your rank change which world you think you are in? If yes, you are done. If no, you are done.

  Scoring Key. Read the paragraphs below to find which profile matches your pattern of answers. Anyone who answered yes to Q1 and yes to Q2 and yes to Q5 lands in the Classic Shifter box. You treat your birth rank and episode number as genuine evidence that the total is small, and you let this evidence move your decisions about funding and risk. You believe the reference class is fixed enough to matter and that the probability shift is action-guiding. Anyone who answered yes to Q1 but yes to Q4 lands in the Canceler box. You accept that birth rank looks like evidence, but you think the fact of your existence is stronger evidence for a large total, washing out the doom shift exactly. You end up acting like the skeptic but for different reasons. Anyone who answered yes to Q1 but no to Q5 lands in the Real but Inert box. You grant the probability shift but think it cancels in expected utility terms because the value at stake shrinks as the probability rises, so you should not move any money. This position is often occupied by those who worry about value dilution.

  Anyone who answered no to Q1 and yes to Q8 lands in the Skeptic box. You think you cannot update on your own existence or indexical facts at all, so there is nothing here to have a view about. You reject the mechanism entirely rather than canceling it. Anyone who answered yes to Q3 depending on the count lands in the Reference-Class Relativist box. You think you can get almost any answer depending on who you count as a possible you, biological or digital, and that nothing selects between them, so the thing dissolves into a choice of framework. Anyone who answered yes to Q8 because of infinity lands in the Infinitary Escapist box. You say the argument never gets going because the expected number of observers is infinite, making probabilities undefined. There is an empty box for those who answer yes to Q1 and yes to Q4 but yes to Q5. This is incoherent because if the evidence cancels out, there is no probability shift to drive action. There is another empty box for those who answer no to Q6 and yes to Q7. This is unattractive because it suggests causal disconnectedness matters more than logical possibility for observer counting, a view few consistently hold.

  Note on unseparable leaves. This quiz genuinely cannot separate the Canceler from the Skeptic in all cases because both end up recommending no update on doom. To split them, you would need an extra question about a case where existence evidence applies but birth rank does not, such as asking if finding out the universe is larger makes you more surprised to exist. The quiz also struggles to separate the Real but Inert person from the Classic Shifter if the Funding Committee question is interpreted loosely, as both might fund extinction risk but for different reasons. To split them, ask whether they would bet on a short future at even odds given the shift, which forces the utility calculation into the open.
