answer: |-
  ### 1. Taxonomy of True Statements Used to Deceive

  Here is the sorting of the stipulated Clinton acts into your proposed categories, followed by an evaluation of the taxonomy itself.

  **Sorting the Acts**
  *   **Televised Denial ("I did not have sexual relations with that woman"):**
      *   *Hearer:* The General Public.
      *   *Category:* **(a) Assert something false.** While Clinton relied on a private definition, the public usage of "sexual relations" included oral sex. By standard usage, this was a false assertion.
      *   *Hearer:* His Legal Team / Advisors.
      *   *Category:* **(c) Pick words true only under a definition you know the hearer isn't using.** They knew the technical definition being prepared for the Jones deposition.
  *   **Paula Jones Deposition (Denial under stipulated technical definition):**
      *   *Hearer:* Jones Lawyers / Court Reporter.
      *   *Category:* **(c) Pick words true only under a definition you know the hearer isn't using.** The definition excluded unilateral oral sex. Clinton knew the lawyers intended the common understanding; he relied on the written stipulation.
  *   **Grand Jury Exchange ("It depends on what the meaning of 'is' is"):**
      *   *Hearer:* Grand Jurors / Independent Counsel.
      *   *Category:* **(d) Exploit a conversational convention — tense.** He relied on the present tense ("there is not") to negate a past relationship, exploiting the convention that present tense in this context usually implies current status *and* recent history.
  *   **Denying an "improper relationship" (while admitting intimacy):**
      *   *Hearer:* Public / Press.
      *   *Category:* **(b) Assert something true while knowing the hearer will draw a false conclusion.** "Improper" is normative. He could believe it wasn't improper while knowing the public would infer "no sexual contact."

  **Taxonomy Evaluation**
  *   **Do (c) and (d) collapse?** No, but they are siblings.
      *   (c) is **Semantic**: It turns on the *content* of the words (definitions of "sexual relations," "improper").
      *   (d) is **Pragmatic/Grammatical**: It turns on the *structure* of the exchange (tense, Gricean maxims of quantity/relevance).
      *   *Why they feel like they collapse:* Both rely on a gap between *encoded meaning* and *decoded message*. However, (c) requires a hidden dictionary (technical definition), while (d) requires a hidden rulebook (grammar/conversation). In the Clinton case, both function identically: they create "plausible deniability" that survives technical scrutiny but fails communicative duty.
  *   **Gaps in the Taxonomy:**
      *   **Missing Category (f): Paltering.** Asserting a true subset to imply a false whole. (e.g., "I was not in the building at 5:00 PM" [true, because you were there at 4:55 PM and stayed]). Clinton's "there is no relationship" (when there *was* one, just not currently active) borders on this.
      *   **Missing Dimension: Burden Shifting.** Your taxonomy categorizes the *statement*, not the *cost*. A key feature of Clinton's strategy was shifting the burden of verification to the hearer. (a) is easy to verify (false). (c) and (d) require the hearer to possess the speaker's private key (definition/tense rule) to detect the deception. The taxonomy needs a metric for *epistemic labor*.

  ### 2. The Discounting Point

  **The Argument:** A hearer who distrusts politicians discounts denials ("I did not" → "who knows"). Therefore, the false belief produced is weaker/fewer people hold it. Therefore, the wrong is less than a lie.

  **The Breakdown:**
  This argument fails on three fronts: the *success condition*, the *institutional context*, and the *location of the wrong*.

  1.  **The Success Condition (The Paradox):**
      If the wrongness of misleading scales inversely with the hearer's skepticism, then the most cynical audience is the easiest to morally violate. This makes the speaker's culpability dependent on the hearer's virtue (or lack thereof). If I lie to a gullible child, it is worse than lying to a skeptical detective. Most moral frameworks reject this: culpability lies in the *attempt* to corrupt the hearer's epistemic state, not the *success rate*. The "discount" is a feature of the *harm*, not the *wrong*.

  2.  **The Institutional Context (Hearer Specifics):**
      The discounting point might hold for the *Public* (Hearer A), but it collapses for the *Grand Jury* and *Deposition* (Hearer B).
      *   *Public:* High discounting. Many heard "he's a politician" and waited for proof.
      *   *Grand Jury/Deposition:* Zero discounting. These are sworn proceedings. The hearer is legally entitled to rely on the literal truth of the statement under oath. To apply a "politician discount" here is to admit the institution is broken. Clinton was not speaking *as a politician* to the Grand Jury; he was speaking *as a witness*. The discounting argument conflates the two roles.

  3.  **Location of the Wrong:**
      The discounting point assumes the wrong is located in **what the hearer ends up believing** (consequentialist).
      *   *Correction:* The wrong is located in **the speaker's willingness to exploit the convention.**
      *   When Clinton used the "is" distinction, he weaponized the shared tool of language. He forced the hearer to choose between believing their ears (he's lying) or believing the grammar (he's technical). This creates *epistemic instability*.
      *   *Why the discount fails:* Even if the hearer isn't fooled, the *channel* is corrupted. If I poison a well, it does not matter if you brought your own bottled water. The well is still poisoned. The wrong is the corruption of the communicative act itself, specifically the violation of the *duty of clarity* owed by a witness to a court, or a leader to the public.

  **Verdict:** The discounting point is invalid because it measures the *efficacy* of the deception rather than the *violation* of the communicative norm. It fails specifically because it ignores the *oath-bound hearers* (Grand Jury) where discounting is illegitimate.

  ### 3. The Legal Hook

  **Perjury vs. Morality:**
  The law tracks literal falsity because law requires **verifiability**, not because it thinks misleading is morally neutral.
  *   **Bright Line:** A jury can determine if Statement X matches Reality Y. They cannot easily determine if Speaker Z *intended* Hearer W to be misled by a technically true statement without sliding into mind-reading.
  *   **Moral Load-Bearing:** The legal distinction does *not* show the moral distinction is load-bearing. It shows the legal distinction is *administratively necessary*. In fact, the obstruction of justice charge was the catch-all for the "misleading" behavior that perjury couldn't capture.

  **The Scandal of Quibbling:**
  You ask if the harsher reaction to the evasions (vs. a bare denial) is just irritation at lawyers. It is not. It is a reaction to **contempt**.
  *   **Flat Lie:** Admits a shared reality. "The sky is green." We agree on what sky and green mean; I am breaking the rule. I am an adversary, but we are playing the same game.
  *   **Quibbling/Evasion:** Denies the shared reality. "The sky is [technically defined as] not green." I am changing the rules mid-game. I am treating you as an opponent to be outmaneuvered, not a hearer to be informed.
  *   **Why it felt harsher:** A lie insults the hearer's intelligence by asking them to believe the false. Quibbling insults the hearer's *status* by implying they are not owed clarity. It signals that the speaker believes they are smart enough to get away with it and the hearer is not smart enough to catch them. The public outrage was less about the sex and more about the *gaslighting*—the demand that the public accept a technical reality that contradicted their lived reality.

  **Verdict:** The law needed a bright line (literal falsity). The moral scandal was about the *manner* of deception. The quibbling was judged harsher because it undermined the possibility of shared truth, not just the specific truth of the affair.

  ### 4. What the Episode Does to the Theory

  **Fit with Literature:**
  *   **No-Moral-Difference Thesis (e.g., Carson):** This case is a **win** for this side. Clinton's intent was identical in the lie and the misleading statement: to induce a false belief about the affair. The public judged him equally harshly for both. The mechanism (lie vs. mislead) did not mitigate the moral blame.
  *   **Lying-is-Worse Thesis:** This case is an **anomaly**. Standard theory suggests lying is morally worse than misleading (due to assertion norms). Here, the misleading (the "is" distinction) generated *more* enduring reputational damage than the initial denial.

  **Where the Theory is Silent:**
  1.  **Audience Segmentation:** Theory usually posits "The Hearer." Clinton had *multiple simultaneous hearers* with different entitlements.
      *   *Lewinsky:* Knew the truth.
      *   *Public:* Entitled to general honesty.
      *   *Grand Jury:* Entitled to literal precision under oath.
      *   *Theory Gap:* Standard lying/misleading theory does not account for **role-relative duties**. A statement can be a permissible misleading to the Public (maybe) but a criminal perjury to the Grand Jury. The theory lacks a variable for *institutional context*.
  2.  **The Cost of Verification:** Theory focuses on the *state of belief*. It ignores the *cost to achieve truth*.
      *   A lie forces the hearer to find external evidence to disprove it.
      *   A misleading technicality forces the hearer to decode the speaker's private lexicon.
      *   *Theory Gap:* The Clinton case suggests that **obfuscation** (raising the cost of verification) is morally distinct from **falsification**. The theory treats them as equivalent paths to false belief. The public reaction suggests obfuscation is *worse* because it treats truth as a puzzle to be solved rather than a norm to be upheld.
  3.  **Temporal Durability:** A lie is often binary (found out or not). A misleading technicality ("it depends on what 'is' means") creates a **lingering epistemic fog**. Even after the truth is known, the statement remains technically defensible.
      *   *Theory Gap:* The theory does not measure the *persistence* of the deception. Clinton's statements were designed to remain technically true *forever*, even after the facts were revealed. This creates a different kind of moral harm: the permanent corruption of the record.

  **Final Verdict:** The Clinton case breaks the "Lying vs. Misleading" distinction not because the moral difference vanished, but because the **context (oath + public trust)** overwhelmed the **mechanism (semantics)**. The theory handles the *intent* well (aiming at false belief) but is silent on the *institutional damage* caused by weaponizing technical truth against a public expecting communicative clarity.
