answer: |-
  This is a fantastic question, and it touches on one of the most heated debates in linguistics and cognitive science. You and your writing group have actually stumbled onto a very nuanced middle ground that professional linguists are still actively researching.

  Here is the breakdown of where your friend is right, where you are right, and the actual science behind your "forced-encoding effect."

  ### 1. The Sapir-Whorf Status Report
  Your friend is citing the **Strong Hypothesis** (Linguistic Determinism), which is indeed largely considered dead. This is the idea that language *imprisons* thought—that if you don't have a word for "freedom," you can't conceive of freedom, or if you don't have future tense, you can't plan.

  The "Eskimo words for snow" example is the classic pop-sci debunking of this. It's a myth because:
  1.  Inuit languages are polysynthetic (they build sentences like words), so counting "words" is meaningless.
  2.  English speakers have "slush," "sleet," "glaze," "powder," etc.
  3.  Cognitive capability is universal. All human brains can perceive color, time, and snow, regardless of vocabulary.

  **However,** you are citing the **Weak Hypothesis** (Linguistic Relativity), which is very much alive. This suggests that language doesn't *determine* what you *can* think, but it does influence what you *habitually* think about. It acts like a groove in a record; the needle (your attention) is guided along a specific path, making certain distinctions easier or more automatic.

  **Verdict:** Your friend is right that your characters won't be *incapable* of planning. You are right that their language will change *how* they prioritize information.

  ### 2. The "No Future Tense" Problem
  If you strip out future tense, your characters will not starve because they forget to plant seeds. Humans have cognitive planning centers in the prefrontal cortex that operate independently of language.

  However, removing tense usually shifts the burden to **Aspect** or **Evidentiality**.
  *   **Tense:** *When* did it happen? (Past/Present/Future)
  *   **Aspect:** *How* did it happen? (Completed/Ongoing/Repeated)
  *   **Evidentiality:** *How do you know?* (Seen/Heard/Inferred)

  If your language forces speakers to mark **Aspect** instead of Tense, the culture might not be "bad at planning," but they might be obsessed with **completion** or **process**.
  *   *English:* "I will build the wall." (Focus on future time).
  *   *Your Conlang:* "I build-wall-ongoing." (Focus on the current labor).

  **Cultural Implication:** Instead of a culture that fails to plan, write a culture that finds the concept of "future certainty" arrogant. If your grammar doesn't let you grammatically assert the future as fact, your people might view planning not as a schedule, but as a hope or an intention. They might store food, but they wouldn't say "We *will* eat this in winter." They would say, "We store this, *in case* winter comes." It changes their relationship with certainty, not their ability to survive.

  ### 3. The "Forced-Encoding Effect"
  You asked if this is a real thing or if you reinvented a wheel. You didn't reinvent the wheel, but you gave it a great name. In linguistics, this is studied under **Obligatory Grammatical Categories** and Dan Slobin's hypothesis of **"Thinking for Speaking."**

  Slobin argues that when you speak, you must pay attention to whatever your grammar forces you to encode.
  *   **Spanish/German:** You must encode the **gender** of nouns. Studies show speakers of gendered languages are slightly faster to associate gendered traits with objects (e.g., a "bridge" is masculine in Spanish, feminine in German; speakers describe them differently).
  *   **Russian:** You must encode **completion** in the past tense. You can't just say "I read the book." You must specify if you finished it or not.
  *   **Turkish/Quechua:** You must encode **evidentiality**. You cannot say "It rained." You must say "It rained (I saw it)" or "It rained (I was told)."

  **Real-World Example:** The Guugu Yimithirr people (Australia) do not use egocentric coordinates (left/right/front/back). They use cardinal directions (North/South/East/West) for everything. "There is an ant on your southwest leg."
  *   **The Effect:** They have an internal compass that English speakers lack. They are objectively better at spatial orientation because their grammar *forces* them to track North constantly.

  **So, is your "Forced-Encoding Effect" valid?** Yes. If your grammar forces a distinction every time you open your mouth, that distinction becomes cognitively cheap and salient. Distinctions your grammar ignores become cognitively "expensive" (you have to work harder to explain them).

  ### 4. How to Fix Your Conworld
  To make your culture psychologically realistic without falling into the "Eskimo Snow" trap, try these adjustments:

  1.  **Don't make them incapable.** They can plan. But make planning culturally distinct. Perhaps they don't make "promises" about the future because their grammar treats the future as unreal. A promise might be seen as a lie because you cannot grammatically assert the future as truth.
  2.  **Lean into the Forced Encoding.** If you removed tense, what did you replace it with?
      *   **If you added Evidentiality:** Your culture might be obsessed with truth and sources. Gossip could be a capital crime because spreading unverified info is grammatically marked as "hearsay."
      *   **If you added Aspect:** Your culture might value *process* over *deadlines*. "Being in the state of building" is more important than "Will be built by Tuesday."
  3.  **Use the "Cognitive Cost" argument.** It's not that they *can't* think about the future; it's that talking about it requires extra circumlocution. "I intend to..." or "It is likely that..." This makes future-talk feel heavier, more formal, or more speculative than present-talk.

  ### Summary for your Writing Group
  *   **Friend is right:** Strong Determinism (Language = Prison) is debunked. Your characters won't be brain-damaged by lacking tense.
  *   **You are right:** Weak Relativity (Language = Habit) is supported by modern cognitive science (Boroditsky, Slobin, Lucy).
  *   **Your Mechanism:** "Forced-encoding" is essentially **Obligatory Grammatical Categorization**. It is a valid, researched phenomenon.

  **Recommendation:** Keep the tenseless language. It's a cool feature. Just change the cultural outcome from "they are bad at planning" to "they view the future as inherently uncertain and speaking about it as speculation requires specific grammatical markers." That is linguistically sound and psychologically rich.
