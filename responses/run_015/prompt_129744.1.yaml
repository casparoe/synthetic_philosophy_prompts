      *   *Critique:* Make sure to point out that indexing wages to rent can create a feedback loop (wages up $\rightarrow$ demand up $\rightarrow$ rents up) unless supply is elastic. This is an economic point with philosophical weight (stability).

  5.  **Self-Correction/Review during drafting:**
