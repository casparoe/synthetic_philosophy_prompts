prompt: |-
  I'm giving a talk at our philosophy of history workshop next thursday defending a pretty specific view: germs, climate shifts, and volcanic winters are "historical actors" only in the restricted sense that they sculpt the decision-space human agents face, not in the sense that they deliberate or respond to reasons. The point is to keep the causal weight of non-human forces without sliding into enviromental determinism — determinism requires that human choice is redundant, and I want to say it's constrained but still genuinely open. The audience is a mix: two enviromental historians who love Latour-style actor-network talk and will think I'm being stingy with agency attribution; two analytic philosophers of action who want agency tied tightly to intentionality and will worry I'm watering down the concept; one medievalist convinced the Black Death literally dissolved feudal obligations rather than just nudging labor markets, who'll feel I'm soft-pedaling microbial power; and a grad student writing on Tambora and the 1816 year without a summer. I need a Q&A prep sheet — not a literature review, just the moves. List the objections in roughly the order they'll come, phrased like each of those people would actually say them. For each: how damaging is it, what's a tight two-minute reply that holds my line, where is that reply weakest or concedes too much, and should I flag that weakness in my opening? Also tell me what I should concede upfront so I don't sound defensive. And include the question I'm praying nobody asks — likely something about whether my "decision-space sculptor" category is just determinism with extra vocabulary. Keep it practical, I don't have time for citation lists.
