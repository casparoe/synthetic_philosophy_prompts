prompt: |-
  Consider the institutional framework governing pest control and conservation across most agricultural and public-health systems. For crop-damaging invertebrates, regulators and extension services typically apply an economic-injury-level model: intervention with insecticides is permitted only when monitored population density or damage exceeds a calculable economic threshold, treating the organisms as an aggregate input to a production function. For vertebrate pests—say, rodents in food-processing facilities—the same jurisdictions almost always impose a zero-tolerance standard: mandatory lethal removal regardless of actual numbers, economic impact, or available non-lethal alternatives. Meanwhile, endangered-invertebrate protection operates on an entirely different logic: it safeguards species-level populations and habitats, but assigns no standing to the welfare of individual wild invertebrates suffering from natural causes, and it rarely if ever restricts pesticide use specifically to prevent collateral harm to non-target individuals of common species.

  What philosophical commitments about moral status, aggregation, and the relevance of sentience does this three-tiered practice presuppose? Does the economic-threshold tier implicitly deny that individual insects have moral standing, or can it be reconstructed as a permissible aggregation rule within a framework that does grant them standing? Does the zero-tolerance tier for vertebrates reflect a deontological side-constraint, a risk-averse epistemic rule, or a taxonomic bias? And is the conservation tier—protecting rarity but not suffering—compatible with the idea that invertebrates are sentient, or does it presuppose that only population-level properties carry value? Reconstruct the implicit theory that best unifies these tiers, distinguish what the framework strictly requires from what merely fits it well, note where it is philosophically underdetermined (so that rival theories could license the same regulations), and say what concrete changes to pesticide policy and wildlife law would follow if the underlying view were replaced with a uniform individual-welfare framework applied across all taxa.

  In your answer, please say how confident you are in each part of the reconstruction and explicitly identify the point about which you are least certain. End with a line beginning "Verdict:" that states in one sentence the core philosophical commitment you take the framework to presuppose.
