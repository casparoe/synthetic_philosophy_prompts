      *   *Reading 3: Physical CTT (PCTT).* It's a claim about physics. (Wait, the slogan says "not empirical," so this reading *denies* this. I need to frame this as what the slogan is *rejecting* or how it reinterprets it). Let's frame it as: "It defines what counts as physical computation."
      *   *Reading 4: Epistemic/Methodological.* It defines what counts as an *algorithm* or *effective procedure*.
