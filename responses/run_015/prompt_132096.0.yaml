answer: |-
  This is a classic friction point in the philosophy of computation. Your convenor is wielding a **boundary-policing move**. By declaring the Church–Turing Thesis (CTT) a definition, they are attempting to shift the discourse from *physics* (what can be built) to *conceptual analysis* (what we mean by "calculation").

  If CTT is empirical, hypercomputation is a bold hypothesis that might be true. If CTT is definitional, hypercomputation is a category error (like claiming to have found a "married bachelor").

  Here is the menu of readings for the slogan **"CTT is a definition, not an empirical claim,"** evaluated for truth, defensive power, and performance against your two test cases.

  ---

  ### The Menu of Readings

  #### 1. The Lexical/Stipulative Reading
  *   **The Claim:** In contemporary mathematical practice, the word "computable" is *stipulated* to mean "Turing-computable." Any model that exceeds this is, by linguistic convention, not doing "computation."
  *   **Status:** **Trivially True.** This is how the term is used in logic textbooks.
  *   **Does it show hypercomputation is *confused*?** **No.** It only shows hypercomputationists are using a non-standard dictionary. They can reply: "Fine, call it 'super-computation' or 'physical decidability.' We still want to know if the physics works." This reading changes the subject rather than refuting the possibility.
  *   **Case 1 (Non-uniform):** Under this reading, non-uniform families are not "computable" because they lack a single Turing machine. The thesis is preserved by fiat.
  *   **Case 2 (One-shot):** A single event isn't a function over a domain, so it falls outside the lexical scope of "computation."
  *   **Verdict:** This is the "shut up and calculate" defense. It protects the math but ignores the physics.

  #### 2. The Carnapian Explication Reading
  *   **The Claim:** The pre-theoretic notion of an "effective procedure" (finite, deterministic, mechanical, no insight required) was vague. Turing offered the best *precisification* (explication) of that intuitive concept. CTT asserts that Turing's formalism captures the *intended* concept better than any rival.
  *   **Status:** **Substantive and Defensible.** This is the most philosophically robust reading (associated with Kleene and Gandy). It admits the pre-theoretic notion was fuzzy but argues Turing nailed the *structure* of what we meant.
  *   **Does it show hypercomputation is *confused*?** **Yes, potentially.** If hypercomputation requires "infinite precision" or "infinite steps," the convenor can argue these violate the *pre-theoretic constraints* of "effective procedure" (e.g., finiteness of description, bounded resources per step). The hypercomputationist isn't finding a counterexample to the concept; they are changing the concept.
  *   **Case 1 (Non-uniform):** **Supports CTT.** An effective procedure must be *uniform* (one recipe for all inputs). A lab manufacturing distinct devices for each $n$ lacks a uniform recipe. The "infinite information" required to specify the family violates the "finite description" constraint of the pre-theoretic notion.
  *   **Case 2 (One-shot):** **Supports CTT.** An effective procedure must be general. A one-off physical event is an *observation*, not a *computation*. It doesn't instantiate a rule.
  *   **Verdict:** This is the strongest reading for your convenor. It argues hypercomputation violates the *constraints of the concept* being analyzed.

  #### 3. The Physical CTT (PCTT) Denial Reading
  *   **The Claim:** There is a distinct claim about physics (PCTT), but *that* is empirical. The *original* CTT is purely about mathematical definability. The slogan warns against conflating the two.
  *   **Status:** **True (Historically), but Dialectically Weak.** Turing and Church were analyzing "effective calculability" by humans or idealized clerks, not fundamental physics.
  *   **Does it show hypercomputation is *confused*?** **Only if** the hypercomputationist claims to be analyzing "effective calculability." If they claim to be analyzing "physical solvability," this reading concedes the point. It says: "You aren't disproving CTT; you're disproving PCTT."
  *   **Case 1 (Non-uniform):** If the lab is physically possible, PCTT is threatened. But CTT (mathematical) remains untouched because the family isn't uniformly generated.
  *   **Case 2 (One-shot):** Physically possible? Maybe. But it doesn't touch CTT (mathematical functions).
  *   **Verdict:** This reading saves CTT by sacrificing relevance. It admits hypercomputation might be physically possible, just not "computation" in the Church-Turing sense.

  #### 4. The Epistemic/Methodological Reading
  *   **The Claim:** CTT defines the boundary of what can be *known via algorithm*. Anything requiring infinite precision or Zeno supertasks is not "knowable" in the sense required for mathematical proof or verification.
  *   **Status:** **Substantive, but Controversial.** It ties computation to verification. If you can't verify the infinite steps, did the computation happen?
  *   **Does it show hypercomputation is *confused*?** **Yes.** It argues that a Zeno machine's output is unverifiable. If you can't check the result, it doesn't count as a solution to a decision problem.
  *   **Case 1 (Non-uniform):** You cannot verify the infinite lookup table. Thus, it's not an epistemic resource.
  *   **Case 2 (One-shot):** You can verify the one bit. This reading struggles here unless it insists on *repeatability* as a condition for knowledge.
  *   **Verdict:** Good for attacking Zeno machines, weaker against oracle-like physical events.

  #### 5. The Robustness/Convergence Reading
  *   **The Claim:** CTT isn't a definition *ex nihilo*; it's the observation that every reasonable formalism of "effective procedure" (lambda calculus, recursive functions, register machines) converges on the same class. This convergence *justifies* treating the class as the definition.
  *   **Status:** **Empirically Supported, Logically Non-Binding.** The convergence is real, but it doesn't logically preclude a *new* formalism (like analog real-number computation) from opening a larger class.
  *   **Does it show hypercomputation is *confused*?** **No.** It suggests hypercomputation is *unlikely* or requires exotic assumptions, but not that it is conceptually confused.
  *   **Case 1 & 2:** Convergence applies to uniform, discrete models. It doesn't inherently rule out non-uniform or analog models, it just notes they haven't converged *yet*.
  *   **Verdict:** This is evidence, not a definition. It doesn't support the "not empirical" slogan well.

  ---

  ### The Honest Assessment: What is your convenor actually doing?

  When a philosopher says "CTT is a definition, not an empirical claim" in a seminar, they are usually deploying **Reading 2 (Explication)** disguised as **Reading 1 (Lexical)**.

  *   **The Move:** They want the **normative force** of Reading 2 (Turing captured the *true essence* of computation) without the **vulnerability** of Reading 3 (Physics might prove us wrong).
  *   **The Trick:** By calling it a definition, they immunize CTT from physical counterexamples. If a Zeno machine is built, they say, "That isn't computation." If you ask why, they say, "Because it violates the definition (finiteness/effectiveness)."
  *   **Is it Question-Begging?** **Yes.** It assumes that "computation" *must* be tied to the specific constraints Turing used (discrete steps, finite alphabet, no infinite acceleration). Hypercomputationists argue those constraints are artifacts of 1930s technology, not essential to "processing information."
  *   **Does it show confusion?** It shows the hypercomputationist is **changing the subject** from "effective calculability" to "physical solvability." If the hypercomputationist admits this, the debate dissolves into semantics. If they insist they are analyzing "computation," the convenor is right that they are using the term non-standardly.

  ### How the Test Cases Pull the Slogan Apart

  Your two cases are excellent because they target the **Uniformity** and **Generality** constraints hidden in the "Definition."

  **Case 1: Non-uniform Families (The Advice String)**
  *   **The Tension:** Standard complexity theory accepts non-uniform circuits (P/poly) as a valid model of *complexity*, but not *computability*.
  *   **The Reading that Survives:** **Reading 2 (Explication).** The pre-theoretic notion of an algorithm requires a **finite description** that works for **arbitrary input size**. A non-uniform family requires infinite information to specify (the advice for every $n$).
  *   **The Verdict:** The convenor can legitimately say this is "confused" *if* the claim is about computability. It's not a counterexample to CTT because it violates the "finite recipe" constraint inherent in the explication of "effective procedure."
  *   **Support:** This case actually **supports** the convenor. It highlights that CTT is about *uniformity*.

  **Case 2: The One-Shot Oracle**
  *   **The Tension:** A physical event gives 1 bit of Halting info. It's finite. It's physical.
  *   **The Reading that Survives:** **Reading 1 (Lexical) & Reading 2 (Explication).** Computation is defined over *functions* (mappings from domain to range). A single event is a *value*, not a *function*.
  *   **The Verdict:** The convenor can say this is a category error. You haven't computed the Halting Function; you've observed a fact. To compute the *function*, you need to do it for *any* program.
  *   **Support:** This case also **supports** the convenor, provided they emphasize that CTT is about **computable functions**, not **knowable truths**.

  ### Summary for Your Session

  Bring this distinction to the group:

  1.  **If CTT is Lexical (Reading 1):** It is trivially true, but irrelevant to physics. Hypercomputationists are just proposing new physics, not new math.
  2.  **If CTT is Explication (Reading 2):** It is substantive. It claims Turing identified the necessary conditions for "effective method" (finiteness, uniformity, discreteness).
      *   **Your Counter:** Ask the convenor: *"Are the constraints of finiteness and discreteness part of the **concept** of computation, or are they constraints on **human/1930s** computation?"*
      *   If they say **Concept**: Then they must explain why an analog device processing a real number isn't "calculating." (This is the hard fight).
      *   If they say **Human/1930s**: Then CTT is contingent on our cognitive/physical limitations, and hypercomputation is a claim that those limitations can be bypassed.

  **The "Confusion" Charge:**
  The hypercomputation literature is only "confused" if it claims to refute the **Explication** of effective procedure while relying on resources (infinite precision, supertasks) that violate the **defining constraints** of that explication.
  *   **Your winning move:** Concede that Zeno machines aren't "Turing-computable." Insist that the interesting question is whether they are **"Physically-Realizable Information Processors."** If the convenor says "That's not computation," ask them to justify why "computation" must be tied to 1930s human limitations rather than physical possibility.

  **Final verdict on the slogan:** It is a **defensive maneuver**. It protects the mathematical territory of computability theory from being annexed by speculative physics. It is not false, but it is often used to dismiss physical questions that the "definition" was never intended to answer.
