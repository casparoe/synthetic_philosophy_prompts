answer: |-
  **The Scenario**
  Two identical civil servants, A and B, have the same wealth, income, and insurance. A develops intractable trigeminal neuralgia (constant, high-intensity facial pain, no impact on mobility or life expectancy). B develops intestinal failure (requires lifelong Total Parenteral Nutrition via a chest tube; high maintenance, risk of infection, but pain-free and fully mobile with treatment). A "bridge person" (a survivor of both conditions) is consulted.

  **The Numbers & Methods**
  *   **Bridge-Person Method:** The bridge person reports that the neuralgia was "unendurable torture," whereas the TPN regimen was "a manageable logistical hassle." They would choose B's life over A's life 9-to-1. **Verdict: Loss A is 9x worse.**
  *   **Compensating Variation (CV):** To accept Loss A, the agent demands \$150,000/year (pure pain and suffering). To accept Loss B, the agent demands \$350,000/year (cost of medical supplies, nursing support, and home modifications to maintain baseline function). **Verdict: Loss B is 2.3x worse.**

  **Why They Diverge**
  The Bridge method measures **hedonic experience** (how it feels). The CV method measures **economic restoration** (what it costs to stay whole). The CV for B is higher not because B suffers more, but because B's condition is *capital intensive* to manage. A rational agent knows that without the \$350k, they cannot maintain their pre-loss standard of living, whereas A can maintain their standard of living with the pain, just miserably.

  **The Single Feature**
  **The Monetizability of Adaptation.** Loss A resists monetary mitigation (money doesn't stop nerve pain); Loss B responds to monetary mitigation (money buys the nutrition and care that restores function). CV rewards the loss that money can fix; Bridge ranks the loss that money cannot.

  **The Defense & The Order Effect**
  A defender of the Bridge method would argue that CV conflates *utility* with *market prices*, effectively penalizing B for having a condition that requires labor and goods rather than mere endurance. They would claim agencies use CV to balance budgets, not to measure misery.

  If the bridge person lives the lives in **reverse order** (TPN first, then Neuralgia), the gap widens: the relief of pain makes the TPN seem trivial. If they live **Neuralgia first, then TPN**, the gap narrows: the adaptation to pain makes the TPN logistics seem burdensome by comparison. The Bridge method is vulnerable to **reference dependence**, whereas CV remains stable because the price of TPN supplies doesn't change based on your memory of pain.
