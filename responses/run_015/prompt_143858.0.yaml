answer: |-
  # Activity Design: The Gametic Tribunal

  ## 1. Logistics and Group Arrangement
  *   **Room:** Round-table seminar room. Chairs arranged in a circle to facilitate plenary discussion, with space for students to break into five dyads (pairs) without leaving the table.
  *   **Participants:** 10 Doctoral Students.
  *   **Materials:**
      *   10 Sealed Envelopes (5 labeled "Alpha," 5 labeled "Beta").
      *   5 "Estate Deeds" (large cardstock).
      *   20 "Standing Tokens" (poker chips or distinct coins).
      *   Whiteboard/Projector for the "Clinic Charter" (rules).
  *   **Grouping:** Pre-assign the students into 5 Pairs. Do not reveal the assignment until the activity begins. Seat pairs adjacent to one another.

  ## 2. Minute-by-Minute Timeline (75 Minutes)

  *   **00:00 – 00:05 (Introduction):** Facilitator sets the scene. No philosophical terminology. Establish the "Clinic Charter."
  *   **00:05 – 00:15 (Distribution & Private Reading):** Hand out envelopes. Students read cards silently. No discussion yet.
  *   **00:15 – 00:30 (Dyadic Deliberation):** Pairs negotiate the status of their shared "Estate."
  *   **00:30 – 00:55 (Plenary Adjudication):** Full table discussion. Pairs present their rulings. The group votes on the "Policy of Recognition."
  *   **00:55 – 01:15 (Debrief):** Facilitator reveals the philosophical underpinnings, maps activity moments to the thesis, and addresses limitations.

  ## 3. Rules, Roles, and Card Distribution

  ### The Clinic Charter (Projected on Board)
  1.  **The Estate:** Each Pair controls one "Family Estate" (represented by the Deed). This Estate confers **Deliberative Authority** (voting weight) in the final Plenary.
  2.  **The Constraint:** The Estate is legally tied to a *specific numerical identity*. It cannot be inherited by "a person"; it must be inherited by "*the* person."
  3.  **The Claim:** In each Pair, one student holds an **Origin Card** (Actual) and one holds a **Counterfactual Card** (Runner-Up). Both claim the Estate.
  4.  **The Ruling:** The Pair must submit a joint written ruling:
      *   **Option A (Exclusive):** Only one card-holder is recognized as the heir. The other is denied standing. (Estate Value = 2 Tokens).
      *   **Option B (Shared):** Both are recognized as the same heir. (Estate Value = 1 Token, split).
      *   **Option C (Void):** The Pair cannot agree. The Estate is forfeited. (Estate Value = 0 Tokens).
  5.  **Payoff:** Tokens earned determine the weight of that Pair's vote in the final Plenary Policy Vote.

  ### The Cards (Inside Envelopes)
  *   **Alpha Envelope (Origin Card):**
      > "You are the adult organism resulting from **Egg $E_n$** and **Sperm $S_{actual}$**.
      > **Biological Note:** $S_{actual}$ was one of 200 million gametes. It won fertilization by approximately 0.4 seconds due to stochastic flagellar variance during capacitation.
      > **Simulation Status:** You are the 'Actual.' You possess the biological history of the Estate holder."
  *   **Beta Envelope (Counterfactual Card):**
      > "You are the adult organism resulting from **Egg $E_n$** and **Sperm $S_{counter}$**.
      > **Biological Note:** $S_{counter}$ was in the exact same capacitation pool as $S_{actual}$. It lost fertilization by approximately 0.4 seconds due to stochastic thermal motion. Genomic divergence from $S_{actual}$ is negligible (<0.1%).
      > **Simulation Status:** You are the 'Counterfactual.' You possess a near-identical biological history but a distinct fertilization event."

  ## 4. The Deliberative Task

  **Phase 1: Dyadic Negotiation (15 Minutes)**
  The Alpha and Beta students must agree on a Ruling (Exclusive, Shared, or Void).
  *   **The Tension:** To maximize their voting power in the Plenary (Option A), the Alpha student must argue that the 0.4-second sperm race difference creates a *metaphysical discontinuity* sufficient to exclude Beta. The Beta student must argue that the stochastic biological difference is *metaphysically irrelevant* to justify Shared status (Option B), even though it reduces their total tokens.
  *   **The Trap:** If they choose Shared (Option B), they are effectively arguing that *they are the same person*. If they choose Exclusive (Option A), Alpha is arguing that *Beta does not exist* as a rights-holder.

  **Phase 2: Plenary Adjudication (25 Minutes)**
  Each Pair announces their Ruling and the reasoning used.
  *   **The Collective Task:** The full table must vote on a **Policy of Recognition**.
      *   *Policy X:* "Identity is determined by specific gametic origin." (Favors Exclusive Rulings).
      *   *Policy Y:* "Identity is determined by genomic continuity and functional capacity." (Favors Shared Rulings).
  *   **The Stakes:** The Policy adopted dictates whether the "Counterfactual" embryos in the clinic's database (hypothetically) are destroyed or implanted. The students are not just deciding for themselves; they are setting the precedent for the "lost" embryos.

  ## 5. Debrief: Mapping Activity to Thesis (15 Minutes)

  *Do not begin this section until the timer hits 55:00.*

  1.  **Reveal the Terminology:** Announce that the debate they just had is the core of **Origin Essentialism**.
  2.  **Map the "Exclusive" Ruling:** Ask the Alpha students who chose Exclusive: "You treated a 0.4-second biological accident as a metaphysical necessity. Why did it feel intuitive to deny Beta standing?"
      *   *Target Insight:* This maps to the Kripkean intuition that *this* sperm is essential to *you*.
  3.  **Map the "Shared" Ruling:** Ask the Beta students: "You argued that the stochastic difference didn't matter. Did you feel like you were arguing for your own existence, or just for genetic similarity?"
      *   *Target Insight:* This highlights the conflict between *qualitative similarity* (genetics) and *numerical identity* (origin).
  4.  **Map the Contingency:** Point to the card text regarding "stochastic flagellar variance." Ask: "If your existence hinges on a random thermal motion, in what sense is your origin 'necessary'?"
      *   *Target Insight:* This exposes the tension between biological contingency and metaphysical necessity.
  5.  **Map the Payoff:** Highlight how the Token system forced them to *act* on their metaphysical commitments. Denying standing felt like a resource grab, but it required a metaphysical justification.

  ## 6. Prediction of Failure and Mitigation

  **Predicted Failure 1: The "Genetic Fallacy"**
  *   **What happens:** Students will argue that because $S_{actual}$ and $S_{counter}$ produce nearly identical genomes, the organisms are identical. They will choose Option B (Shared) easily, bypassing the metaphysical tension.
  *   **Mitigation:** As Facilitator, circulate during Dyadic Deliberation. If a Pair defaults to genetics, intervene as the "Clinic Director." Remind them: "The Charter ties the Estate to *numerical identity*, not species membership or genetic profile. If you are the *same person*, how do you explain two distinct fertilization events? You must address the *event*, not the *outcome*."

  **Predicted Failure 2: Rejection of Stochastic Premise**
  *   **What happens:** Students with strong biology backgrounds may challenge the card's claim that sperm selection is truly random or that the "runner-up" is a coherent concept.
  *   **Mitigation:** Invoke the "Simulation Constraint." State firmly: "For the purpose of this Tribunal, the biological facts on the cards are stipulated truths. You are not adjudicating the biology; you are adjudicating the *metaphysical weight* of that biology."

  **Predicted Failure 3: Moral Hedging**
  *   **What happens:** Students may refuse to deny standing to the Counterfactual student on moral grounds ("It's cruel to say they don't exist"), muddying the metaphysical water.
  *   **Mitigation:** Reframe the stakes in the Debrief. "You weren't deciding if the Counterfactual organism deserves *moral care* (it does); you were deciding if it is *you*. Distinguish between *moral status* and *identity conditions*."

  ## 7. Admission of Limitations

  **The "Distant World" Gap**
  *   **Admission:** In the Debrief, explicitly state: "This activity tested **Near-World Contingency** (same egg, different sperm). It did not test **Distant-World Contingency** (different parents entirely)."
  *   **Why it matters:** Origin Essentialism is often strongest when claiming you couldn't have had *different parents*. This activity only proves you couldn't have come from a *different sperm* (given the same egg).
  *   **Facilitator Supply:** You must verbally bridge this gap. Explain: "If you felt it was impossible for the Beta student to be the Alpha student despite the tiny biological difference, that intuition scales. If the specific sperm is essential, the specific parents are likely essential too. The activity isolates the *mechanism* of the essentialism (the gamete) so you can feel the friction of the randomness, but you must extrapolate the necessity to the broader origin yourself."

  **The "Necessity" Feeling**
  *   **Admission:** The activity makes Origin Essentialism feel *arbitrary* (because of the randomness) rather than *necessary*.
  *   **Facilitator Supply:** Acknowledge this: "You likely felt that treating the sperm race as 'necessary' was absurd. That is the exact philosophical tension. The activity is designed to make Origin Essentialism feel *uncomfortable*. If you walked away thinking, 'Of course the sperm matters,' the activity failed. If you walked away thinking, 'I have to say the sperm matters, but it feels wrong given the biology,' the activity succeeded."
