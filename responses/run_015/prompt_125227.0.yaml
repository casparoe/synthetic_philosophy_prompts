answer: |-
  There is no single established term in analytic philosophy of social science that captures this specific symmetric conceptual dependence while excluding causal loops and supervenience.

  The configuration you describe is best labeled **Conceptual Reciprocity**. It denotes a state where the specification of facts at one level of description logically requires vocabulary or concepts from another level, not because one causes the other, but because the identity conditions of the entities at both levels are mutually fixing. This is distinct from supervenience, which asserts an asymmetric dependence (no change in A without change in B, but not vice versa). It is distinct from emergence, which typically claims the macro level has novel causal powers or properties不可 reducible to the micro, whereas your cases claim the *description* of the micro itself is incomplete without the macro. It is distinct from reflexivity in the standard sense, which posits a temporal feedback loop where expectations alter outcomes; your cases are synchronic and semantic.

  The neighboring notion closest to this is the sociological concept of the duality of structure, where structure enables action and action reproduces structure, but that framework is typically causal and temporal. In analytic ontology, the closest neighbor is constitutive rules (X counts as Y in context C), but that usually privileges the rule (macro) over the stuff (micro). Conceptual Reciprocity asserts neither is privileged; the vocabulary of the whole is required to individuate the parts, and the arrangement of the parts is required to instantiate the whole.

  Case (1) and Case (2) are two distinct mechanisms producing the same logical configuration, and there is evidence against treating them as a single phenomenon. Case (1) is **Intentional Reciprocity**. The dependence arises because the mental states of the individuals have the collective event as their intentional content. You cannot describe the belief without describing the object of the belief (the run). Case (2) is **Compositional Reciprocity**. The dependence arises because the functional identity of the collective property depends on normative or organizational rules that are not fixed by the physical dispositions of the members alone. The evidence that these are distinct is that you can have Case (2) without Case (1): a firm can be risk-averse due to its procedural rules even if no individual trader believes the firm is risk-averse. Conversely, you can have Case (1) without Case (2): a bank run can occur based on mutual expectations even if the bank lacks stable functional properties like risk-aversion. They converge on the same descriptive impasse—neither level is specifiable without the other—but they derive from different sources (intentionality versus functional composition).

  I am highly confident that there is no canonical term for this specific configuration in the literature you are reading. I am highly confident that supervenience is logically asymmetric and therefore fails to capture the symmetry you identified. I am moderately confident that Conceptual Reciprocity is the most precise label available given the constraints. I am least sure about the claim that Intentional and Compositional Reciprocity are fundamentally distinct mechanisms rather than two aspects of a deeper single ontological issue; it is possible that all functional composition ultimately relies on intentional states, which would collapse the distinction, but current analytical frameworks treat them as separate categories of explanation.
