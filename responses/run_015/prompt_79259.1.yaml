answer: |-
  You've spotted the friction point perfectly. The tension you're feeling is between **Expected Value (EV)** and **Game Structure**.

  In poker, the dogma is "money in the pot is dead." That is mathematically true for No-Limit Hold'em because the rules say so. When you fold, your financial exposure stops at zero. In the Dollar Auction, the rules are rigged so that folding *costs* you money. That changes the math entirely.

  Here is the breakdown of the escalation literature translated into your $1/$2 vocabulary, followed by the verdict on whether poker players are deluding themselves.

  ### 1. Sunk Costs vs. Dead Money
  **The Escalation Idea:** You shouldn't make decisions based on money you've already spent and can't get back.
  **The Poker Translation:** **Pot Odds / Dead Money.**
  In poker, if you put $50 in the pot on the flop, that $50 is not yours. It belongs to the pot. On the turn, you only look at the current pot size vs. the cost of your call.
  **The Conflict:** In the Dollar Auction, the "dead money" rule breaks. If you bid 90 cents and your opponent bids $1.00, you are now the "runner-up." If you fold, you lose 90 cents. If you bid $1.05, you lose 5 cents (assuming they fold). Mathematically, spending 15 cents more to save 85 cents is +EV.
  **The Verdict:** Poker players aren't lying about sunk costs; the Dollar Auction just changes the rules so the cost isn't sunk. It's a penalty for folding. In poker, folding is free. In the auction, folding is a bet.

  ### 2. Pot Commitment
  **The Escalation Idea:** Once you've invested enough, the cost of quitting exceeds the cost of continuing, so you are "locked in."
  **The Poker Translation:** **Pot Commitment / Stack-to-Pot Ratio (SPR).**
  When your stack is small relative to the pot, folding is mathematically incorrect because you are getting such good odds you have to call with almost any two cards.
  **The Conflict:** In poker, commitment is about *winning* the pot. In escalation, commitment is about *minimizing loss*. A pot-committed poker player thinks, "I have to call to win $500." An escalated auction bidder thinks, "I have to bid to avoid losing $50."
  **The Verdict:** This maps cleanly, but the motivation is inverted. Poker commitment is offensive (going for the win); escalation commitment is defensive (stopping the bleed).

  ### 3. Fold Equity
  **The Escalation Idea:** I am bidding not because the dollar is worth $5, but because I want you to quit so I can stop losing money.
  **The Poker Translation:** **Bluffing / Fold Equity.**
  You bet big not because you have the nuts, but because you think your opponent will fold. You are buying the pot.
  **The Conflict:** In poker, if your bluff gets called, you lose your bet and the hand ends. In the Dollar Auction, if your "bluff" (a high bid) gets called, the hand *doesn't end*. You just become the runner-up, and now you are trapped too. There is no river card. The betting never closes.
  **The Verdict:** This is the danger zone. Poker bluffing has a defined endpoint. Escalation bluffing is infinite. You can't "buy the pot" if the pot keeps growing and the rules force the loser to pay.

  ### 4. Tilt and Loss Aversion
  **The Escalation Idea:** People hate realizing a loss more than they enjoy realizing a gain, so they gamble to avoid booking the loss.
  **The Poker Translation:** **Tilt / Revenge Tilt.**
  This is when you play a hand badly because you're angry about losing the last one. You want to "get even."
  **The Conflict:** In poker, tilt is an internal emotional error. In the Dollar Auction, the *rules* externalize the pain. The auction doesn't require you to be on tilt to trap you; it traps rational players too. However, the guy at your table calling because "he's already in for so much" is pure tilt. He is trying to break even rather than make a profit.
  **The Verdict:** This fits perfectly. Your friend is on tilt. The Dollar Auction participants might not be.

  ### 5. Bankroll Management
  **The Escalation Idea:** Knowing when the game is no longer worth the risk and walking away.
  **The Poker Translation:** **Stop-Loss / Bankroll Management.**
  A pro leaves the table when they are down 3 buy-ins or when the game gets too tough.
  **The Conflict:** In poker, you can leave between hands. In the Dollar Auction, once you bid, you are contractually obligated until someone outbids you. You cannot "leave the table" while you are the second-highest bidder.
  **The Verdict:** Poker vocabulary fails here. Bankroll management assumes you have the option to fold your *entire situation*. The auction removes the "fold" option for the runner-up.

  ***

  ### The Verdict on Your Core Question

  You asked: *Either poker players are quietly making the same mistake everyone else does (and pot odds is just a story we tell ourselves), or there's something real in the escalation stuff that poker has no way to say.*

  **Here is the truth:** Poker players are right about the math, but the Dollar Auction is not a betting game; it is a penalty trap.

  In poker, the "sunk cost fallacy" is a mistake because the rules allow you to fold for $0. If you call because "you've already put money in," you are spewing chips. That is objectively -EV.

  In the Dollar Auction, continuing to bid past $1 is **not** a sunk cost mistake *once you are already the second bidder*. It is rational damage control. If you are second at $1.90 and the leader is at $2.00, bidding $2.10 loses you 10 cents. Folding loses you $1.90. If you think there is even a 10% chance the other guy folds, the call is +EV.

  The escalation literature isn't saying the math is wrong; it's saying the **game structure** forces rational people into irrational-looking spots. Poker vocabulary misses this because poker hands have a hard end (showdown or fold). The Dollar Auction has no showdown, only surrender.

  Your poker vocabulary is missing the concept of **Liability on Folding**. In poker, liability on folding is always zero. In escalation, liability on folding is your previous bid. That is the missing variable.

  ### Translation Table

  | poker_term | escalation_idea | fit | rationality_verdict | residue |
  | :--- | :--- | :--- | :--- | :--- |
  | **Pot Odds** | Sunk Cost Fallacy | Forced | Mistake | Poker assumes fold cost is zero; Auction makes fold cost equal to previous bid. |
  | **Pot Commitment** | Escalation of Commitment | Clean | Reasonable | Poker commitment is to win; Escalation commitment is to minimize loss. |
  | **Fold Equity** | Bidding to Force Quit | Clean | Reasonable | Poker bluffing ends at showdown; Auction bluffing can loop infinitely. |
  | **Tilt** | Loss Aversion | Clean | Mistake | Tilt is emotional error; Auction traps even cold, rational players. |
  | **Bankroll Mgmt** | Walk Away Power | None | Reasonable | Poker allows exiting between hands; Auction locks you in mid-hand. |

  bottom_line: Poker gets the math right but misses the trap because real poker hands end, whereas the auction rules force you to pay for losing.
