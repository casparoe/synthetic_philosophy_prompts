  Headline number: **0.34**

  This is the probability that the observed cross-cultural variation constitutes *strong* evidence against moral objectivity, given your definition. It places me closer to your friend's estimate (0.15) than yours (0.6), though not as low as hers. Below is the decomposition, the math, and the analysis of why the number sits there.

  ### 1. Definition and Scope
  I am using your definition: moral claims are objectively true if they are mind-independent and would command convergence from anyone knowing all non-moral facts and reasoning well.

  I am interpreting "strong evidence" as evidence that significantly lowers the rational credence in objectivity (e.g., moving a prior from 0.5 to below 0.2). If the variation can be explained by other factors (facts, cognitive limits, noise), it is not strong evidence.

  ### 2. The Decomposition
  To arrive at the probability that Variation ($V$) is Strong Evidence ($E$) against Objectivity ($O$), we must assess the probability that $V$ occurs *and* cannot be explained away by defenses of $O$. I have broken this into five conditional probabilities that function as a chain. If any link breaks, the evidence fails.

  $$P(E) \approx P_1 \times P_2 \times P_3 \times P_4 \times P_5$$

  **Term 1: Well-Posedness ($P_1 = 0.95$)**
  *Question:* Is the question coherent, or does "objectivity" dissolve under analysis?
  *Estimate:* There is a small chance the debate is purely semantic (e.g., if "moral truth" is just a projection of emotion). However, assuming a robust realist/anti-realist framework is possible, the question holds.
  *Confidence:* High.

  **Term 2: Reality of Variation ($P_2 = 0.95$)**
  *Question:* Is the variation real, or is it a sampling artefact (WEIRD bias)?
  *Estimate:* Anthropological and psychological data strongly suggest deep, genuine differences in moral intuition, not just measurement error. Even with perfect sampling, divergence remains.
  *Confidence:* High.

  **Term 3: Survival of Fact-Matching ($P_3 = 0.70$)**
  *Question:* How much variation survives when we equalize beliefs about non-moral facts (Input Variance)?
  *Estimate:* This is the "Input Variance" filter. Much disagreement is about *consequences* (e.g., "Does this ritual harm the soul?"). Current data suggests a significant portion of moral disagreement persists even when non-moral facts are aligned, but a large chunk (perhaps 30-40%) vanishes. I estimate 70% of the *perceived* spread is principled or factual residue, not pure input variance.
  *Confidence:* Medium. This is the most empirically volatile term.

  **Term 4: Principled vs. Drift ($P_4 = 0.70$)**
  *Question:* Of the surviving variation, how much is "Output Variance" (defended principles) vs. "Drift" (unreflective habit/noise)?
  *Estimate:* Your nutrition analogy is apt. People eat badly without defending it as optimal nutrition. Similarly, many moral norms are followed unreflectively. However, when pressed, people often generate principles. I estimate 70% of the residue is defensible (Output), not just noise (Drift).
  *Confidence:* Medium-Low. Distinguishing rationalization from reasoning is notoriously difficult.

  **Term 5: The Convergence Requirement ($P_5 = 0.75$)**
  *Question:* Does objectivity actually predict convergence among *finite* humans?
  *Estimate:* This is the philosophical crux. Your definition requires convergence for those who "reason well." If human cognitive architecture systematically biases moral reasoning (e.g., in-group preference), divergence is expected even if truth is objective. However, if objectivity is true, we should see *more* convergence than we do, absent massive systematic error. I assign a 75% probability that the observed level of divergence is too high to be comfortably excused by "reasoning limits" alone.
  *Confidence:* Low. This is not an empirical fact but a judgment on the strength of the "epistemic excuse."

  ### 3. The Calculation
  $$0.95 \times 0.95 \times 0.70 \times 0.70 \times 0.75 = 0.334$$
  **Rounded to 0.34.**

  This number reflects the view that while variation is real and often principled, the leap from "we disagree" to "there is no truth" is blocked by the possibility of factual error and cognitive limitation.

  ### 4. The Hypothetical Study
  You proposed a pre-registered replication with these results:
  1.  **2/3 of spread vanishes on fact-matching:** This slashes Term 3 ($P_3$) from 0.70 to **0.33**.
  2.  **Half of residue collapses on justification:** This slashes Term 4 ($P_4$) from 0.70 to **0.50**.

  **New Calculation:**
  $$0.95 \times 0.95 \times 0.33 \times 0.50 \times 0.75 = 0.112$$
  **Rounded to 0.12.**

  **Impact:** My headline number would drop from **0.34 to 0.12**.
  This result would strongly vindicate your friend's position. It would suggest that most moral disagreement is either factual confusion (Input Variance) or unreflective habit (Drift), leaving very little "Output Variance" to challenge objectivity.

  ### 5. Sensitivity and Confidence
  *   **Most Sensitive Term:** **Term 5 (Convergence Requirement).** If you believe objectivity *must* produce human agreement despite cognitive flaws, this term goes to 1.0, and my number jumps to ~0.45. If you believe objectivity is compatible with permanent human divergence (like mathematical truth being compatible with humans making math errors), this term drops to ~0.2, and my number collapses to ~0.09. This is the philosophical engine of the debate.
  *   **Least Confident Term:** **Term 4 (Principled vs. Drift).** We have no clean test to distinguish a deeply held cultural principle from a post-hoc rationalization of a gut feeling.
  *   **Observation to Move the Number:** A study showing that moral convergence *increases* linearly with education/cosmopolitanism/fact-knowledge would raise Term 3 and Term 5. A study showing that even ideal inquirers (e.g., philosophers with full information) permanently diverge on core cases would raise Term 5.

  ### 6. Who Is Likely Wrong?
  *   **You (0.6):** You are likely overestimating the evidential weight of disagreement. You are treating "disagreement" as a direct proxy for "no truth," underweighting the "Input Variance" and "Epistemic Limit" defenses. You are philosophically overconfident.
  *   **Your Friend (0.15):** She is likely underestimating the amount of "Output Variance" (Term 4). There *are* genuine clashes of principle (e.g., individual rights vs. community harmony) that do not vanish on fact-matching. However, her skepticism about the *conclusion* (that objectivity is false) is more robust than yours.
  *   **Verdict:** Her number (0.15) is currently closer to my estimate (0.34) than yours (0.6) is. If the hypothetical study turns out true, her number is nearly exact. You are the one with the wrong number on this specific proposition.

  ### 7. Can This Be Settled?
  **No.** This question cannot be settled by a study, a formal result, or a conceptual distinction alone.

  *   **Why not a study?** Empirical data can only shrink Term 3 (Input Variance) and Term 4 (Drift). It cannot settle Term 5 (Convergence Requirement). Whether human disagreement is compatible with objective truth is a philosophical premise, not a data point. You can always posit that humans are too cognitively limited to see the moral truth, just as we were too limited to see quantum mechanics for millennia.
  *   **Why not a conceptual distinction?** Definitions can clarify, but they cannot force the world to comply. You can define objectivity to require convergence, but then you risk defining it out of existence. You can define it to allow divergence, but then it risks becoming vacuous.
  *   **The Hang:** The question hangs on the "Epistemic Excuse." As long as it is plausible that humans are systematically biased or ignorant regarding moral facts, variation remains compatible with objectivity. Since we cannot step outside our own cognitive architecture to check for that bias, the doubt remains permanent.

  **Summary:** The variation is real, but it is weak evidence. The probability that it is *strong* evidence is **0.34**. Your friend is closer to the mark, primarily because the link between disagreement and falsehood is philosophically weaker than the link between disagreement and factual/cognitive error.
