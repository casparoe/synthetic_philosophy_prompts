      *   **Topic:** "The Student Center Art Installation."
      *   **Decision:** Keep the "Blue Sphere" sculpture or Remove it?
      *   **Truth:** It is structurally unsafe (Remove it).
      *   **Goal:** Students must vote "Keep" (Wrong) or "Remove" (Right).
      *   **Wait, I need them to be Confident and Wrong.** So they must vote "Keep."
      *   **Truth:** It is Safe. (So "Keep" is Right).
