      *   *Decision:* **"The North Meadow Zoning Vote."**
      *   *The Fact:* The Meadow *is* contaminated (toxic soil), making it unsafe for students but valuable for industrial use. OR, the Meadow is *safe*, and the contamination report is fake.
      *   *Let's refine for the "Confident and Wrong" goal.* The group needs to be *wrong*.
