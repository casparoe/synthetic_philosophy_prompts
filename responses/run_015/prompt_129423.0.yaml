answer: |-
  The 1985 anti-alcohol campaign launched by Mikhail Gorbachev was, in its intent, a project of moral engineering. It was not merely an economic correction to save labor hours; it was an attempt to reshape the Soviet soul. When viewed through the lens of Plato's *Laws*, specifically the Athenian Stranger's defense of the regulated symposium, the campaign reveals itself as a tragic misunderstanding of how virtue is formed. Gorbachev's planners acted as Lawgivers who believed they could legislate temperance by removing the object of temptation. Plato argues the opposite: you cannot manufacture virtue by removing the test. You can only discover it by administering the test under supervision.

  Here is the mapping of the Soviet campaign onto the Platonic framework, the points of divergence, and the verdict on whether Plato's diagnostic view survives the scale of the modern state.

  ### The Diagnosis: Where Plato and Gorbachev Agree
  Plato and the Soviet Politburo start from the same premise: unregulated intoxication is a poison to the civic order. In *Laws*, Plato acknowledges that wine loosens the tongue and inflames the passions, potentially turning a citizen into a beast. He agrees with Gorbachev that a state populated by drunkards cannot sustain itself. The Soviet rhetoric of the mid-80s mirrored this Platonic anxiety. The tearing up of vineyards in Crimea and Georgia was not just agricultural policy; it was a symbolic purging of the landscape, an attempt to remove the "drug" from the civic body.

  Both systems view the state as a pedagogue. For Plato, the law exists to educate the citizen toward *sophrosyne* (temperance). For Gorbachev, the decree existed to educate the worker toward sobriety. They match on the threat: alcohol disrupts the hierarchy of the soul (reason over appetite) just as it disrupts the hierarchy of the state (planner over worker).

  ### The Methodology: The Erased Exam
  This is where the mapping breaks. Plato's solution to the danger of wine is not prohibition, but the *regulated symposium*. He proposes a drinking party governed by strict rules, presided over by a sober "Symposiarch" (an elder). The purpose is not hedonism; it is a stress test. Wine strips away pretense. A man might fake piety or courage when sober, but intoxication reveals his true nature. If he cannot hold his wine, he cannot hold power. The drinking *is* the exam.

  Gorbachev's campaign attempted to erase the exam entirely. By slashing production, limiting sales to specific hours (often 2 PM to 6 PM), and raising prices, the state assumed that if the wine was gone, the virtue would remain. This is the anti-Platonic error. Plato warns that removing the testing ground does not cure the character flaw; it merely buries it. The Soviet planners treated alcohol as a contaminant to be sanitized, rather than a temptation to be mastered. They sought a sober citizenry by force, assuming that a man who *cannot* drink is the same as a man who *does not* drink by choice. For Plato, only the latter is virtuous. The former is just restrained by circumstance.

  ### The Underground Symposium: Moonshine as Proof
  The explosion of *samogon* (home-brew moonshine) following the 1985 decrees serves as the empirical validation of Plato's warning. When the state closed the legal distilleries and tore up the vines, the "symposium" did not vanish; it went black.

  Plato argues that suppressing the test drives character failure underground. In the USSR, this manifested in the great sugar shortages of 1985–86. Citizens bought sugar in bulk not for baking, but for fermentation. The "test" of self-control was replaced by the "test" of clandestine logistics. The citizen who previously might have failed the Platonic symposium by getting drunk in public now failed the state by becoming a criminal distiller in his kitchen.

  This confirms Plato's psychological claim: the appetite was not cured, only displaced. The social design of the campaign created a nation of hypocrites. In the Platonic symposium, the drunkard is identified and corrected or excluded. In the Soviet kitchen, the drunkard was hidden, protected by the silence of neighbors who were also brewing. The state succeeded in cleaning the streets of public drunkenness, but it failed to clean the soul. It manufactured the *appearance* of virtue (empty streets) while incubating the *reality* of vice (private intoxication). This is exactly the outcome Plato feared when he criticized lawgivers who seek order without truth.

  ### The Scalability Problem: The Nocturnal Council vs. The Ration Card
  The final twist concerns scale. Plato's framework relies on the *polis*. His "Nocturnal Council"—the guardians who oversee the laws and observe the citizens—requires face-to-face interaction. They must watch you drink to know who you are. The USSR was a continental empire of 280 million people. The "gaze" of the state could not be intimate; it had to be bureaucratic.

  Did this prove Plato's view cannot scale? Not entirely. It revealed that modern states attempt to replace the **wine-test** with the **surveillance-test**.

  In the absence of a Symposiarch watching your glass, the Soviet state deployed the ration card and the queue. The "stress test" of the 1985 campaign was not "Can you hold your liquor?" but "Can you navigate the bureaucracy?" The virtue being tested shifted from *temperance* to *compliance*. The long lines outside liquor stores became the new symposium. Here, the state could observe who was desperate, who was aggressive, and who was patient. However, without the moral pedagogy of the Platonic elder, this observation yielded no data for improvement. The militsia (police) recorded infractions, but they could not educate the soul.

  Plato's framework survives the case, but as a warning rather than a blueprint. It demonstrates that the diagnostic function of alcohol (revealing character) is universal, but the regulatory function (curing character) requires intimacy. The Soviet Union tried to scale an intimate moral problem with industrial solutions. They replaced the Symposiarch with the statistician.

  ### Verdict: The Framework Survives
  Gorbachev's anti-alcohol campaign ultimately validates Plato's negative case. Plato argued that you cannot ban the test without losing the truth of the citizen. The USSR banned the test (legal, regulated drinking) and lost the truth (widespread hypocrisy and moonshine).

  The Soviet planners built a state-run "anti-symposium." They regulated access and set age limits, but they removed the supervisory element of moral education. They treated the symptom (drunkenness) rather than the disease (lack of self-mastery). The result was that the "exam" went underground. The moonshine stills were the shadow-symphonia of the late Soviet period, where the only rule was secrecy.

  Plato's insight holds: virtue requires the presence of temptation to be real. By trying to create a virtuous society through the absence of wine, the USSR created a corrupt society through the presence of lies. The campaign proved that while you can scale prohibition, you cannot scale virtue. The Nocturnal Council cannot be digitized, and the soul cannot be rationed. When the state tries to erase the exam, the students do not become scholars; they become cheaters. The Soviet Union became a nation of cheaters, drinking in the dark, proving Plato right across two millennia.
