prompt: |-
  Take Gorbachev's 1985 anti-alcohol push in the USSR — not the economic numbers, but the social design behind it. Read it through Plato's Laws, especially the part where he treats the symposium not as a party but as a kind of civic stress-test: wine strips away pretense so rulers can see who actually has self-control and who just fakes it. Plato doesn't want to ban drinking outright for citizens past thirty; he wants it regulated, like a exam with rules, because removing the test doesn't manufacture virtue, it just buries the failure.

  So map the Soviet campaign onto that framework. The state tried to shrink supply, close distilleries, even tear up vineyards. Where does that match Plato's fear of unregulated intoxication poisoning the soul? Where does it miss his point that you need the testing ground at all? Did the planners accidentally build a state-run "symposium" — regulated access, supervision, age limits — or were they trying to erase the exam entirely? And what does the explosion of home-brew moonshine tell us about Plato's claim that suppressing the test drives character failure underground instead of curing it?

  One more twist: Plato's idea only makes sense in a tiny polis where the Nocturnal Council can actually watch people drink and learn from it. The USSR was massive and bureaucratic. Does the episode prove that his diagnostic view of alcohol can't scale, or does it reveal something weirder — that modern states try to replace Plato's wine-test with surveillance and ration cards? Work with the well-known facts of the campaign and don't worry about bibliographies; I just want the mapping, the breaks, and whether Plato's framework survives the case.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Gorbachev's 1985 Anti-Alcohol Campaign in the USSR.
      *   **Lens:** Plato's *Laws* (specifically the concept of the symposium as a civic stress-test for virtue/self-control).
      *   **Key Plato Concept:** Don't ban wine for adults; regulate it. Wine reveals character (strips pretense). Banning it doesn't create virtue; it hides vice. The "test" is necessary.
      *   **Key Soviet Facts:** Shrinking supply, closing distilleries, tearing up vineyards, rationing, age limits, rise of moonshine (*samogon*), sugar shortages, economic loss (though the prompt says ignore economic numbers, the *social* effects of these matter).
      *   **Core Questions to Answer:**
          *   Where does the Soviet campaign match Plato's fear of intoxication poisoning the soul?
          *   Where does it miss Plato's point about needing a testing ground?
          *   Did they build a state-run "symposium" or try to erase the exam?
          *   What does the moonshine explosion say about Plato's claim (suppressing test drives failure underground)?
          *   Scalability Issue: Plato's *polis* vs. USSR's bureaucracy. Does this prove Plato doesn't scale, or that modern states replace the wine-test with surveillance/rationing?
      *   **Constraint:** No bibliographies, focus on mapping/breaks/survival of the framework.

  2.  **Initial Brainstorming & Mapping:**
      *   *Plato's View:* Wine is a drug. It loosens the tongue. In a controlled setting (symposium), elders watch the young. If you lose control, you are flagged as unfit for rule or citizenship. It's pedagogical.
      *   *Gorbachev's View:* Alcohol is a social poison. It kills workers, lowers productivity, breaks families. It needs to be eradicated or severely restricted. It's hygienic/prophylactic.
      *   *The Match:* Both agree alcohol reveals dangerous impulses. Both agree the state has a duty to manage the soul/citizenry. Both see unregulated drinking as destructive.
      *   *The Miss:* Plato wants *controlled exposure* to build immunity/virtue. Gorbachev wanted *abstinence* to enforce order. Plato uses wine to find the virtuous; Gorbachev assumed removing wine *makes* people virtuous (or at least functional).
      *   *The "Exam":* Gorbachev tried to cancel the exam. Plato says if you cancel the exam, you don't get straight-A students; you just get cheaters.
      *   *The Moonshine:* This is the critical evidence. When the state removed the legal "test," the "test" went black market. People didn't become sober philosophers; they became clandestine distillers. This validates Plato's fear: vice goes underground.
      *   *Scale:* Plato needs face-to-face observation (Nocturnal Council). The USSR used paperwork, queues, and militsia. The "gaze" became impersonal. The "symposium" became the kitchen queue.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Gorbachev's campaign (1985) as a moral engineering project. Introduce Plato's *Laws* (Book 1 & 2 mostly) regarding the symposium. State the thesis: The Soviet campaign was a Platonist diagnosis executed with anti-Platonist methodology, leading to the exact underground corruption Plato predicted.

      *   **The Diagnosis (Where they match):** Both see alcohol as a threat to the rational part of the soul/state. Gorbachev's rhetoric about "sobriety" mirrors the Platonic ideal of *sophrosyne* (temperance). The tearing up of vineyards is akin to purging the city of corrupting influences. They agree on the *danger*.

      *   **The Methodology (Where they diverge):** Plato's "Controlled Burn" vs. Gorbachev's "Firebreak."
          *   Plato: Use wine to test character. If you can't hold your wine, you can't hold power.
          *   Gorbachev: Remove the wine so you don't *need* to hold power over yourself.
          *   *Analysis:* Gorbachev tried to erase the exam. He assumed virtue is the *absence* of temptation, not the *mastery* of it. This is the crucial break.

      *   **The Underground Exam (Moonshine & Sugar):**
          *   Plato says suppressing the test drives failure underground.
          *   USSR evidence: *Samogon* (moonshine). Sugar shortages (people buying 10kg to brew).
          *   This proves Plato right. The "test" didn't disappear; it became criminal. The character flaw wasn't cured; it was masked by illegality. The "sober citizen" was often just a clandestine drunk.

      *   **The Scalability Problem (Polis vs. Empire):**
          *   Plato's Nocturnal Council watches you drink. It's intimate.
          *   The USSR is vast. How do you watch everyone? You use ration cards, time limits (sales only after 2 PM), queues.
          *   The "Symposium" becomes the Queue. The stress test isn't "can you hold your liquor?" it's "can you navigate the bureaucracy to get liquor?"
          *   Does Plato scale? No, not the *observation* part. But his *psychological insight* scales. The modern state replaces the Elder's gaze with the State's archive (police records, ration logs).

      *   **Conclusion:** Did the framework survive? Yes, but as a warning. Gorbachev proved Plato's negative case. By trying to manufacture virtue through prohibition, they manufactured hypocrisy. The Soviet state became the bad Lawgiver who thought he could legislate the soul without testing it.

  4.  **Refining and Polishing:**
      *   *Tone Check:* Needs to be analytical, philosophical, but grounded in the historical facts of the 85-87 campaign.
      *   *Clarification:* Ensure the distinction between "banning" and "regulating" is sharp.
      *   *Specifics:* Mention the vineyards in Crimea/Georgia, the sugar lines, the "Nocturnal Council" analogy.
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Prohibition failed." I need to say "Prohibition failed *in the specific way Plato predicted*." The focus is on the *mechanism of virtue*.
      *   *Twist:* The prompt asks if the modern state replaces the wine-test with surveillance. I need to lean into that. The ration card *is* the modern equivalent of the symposium guest list, but without the moral pedagogy.

  5.  **Final Review against Prompt:**
      *   Map Soviet campaign onto Plato? Yes.
      *   Match/Miss points? Yes.
      *   State-run symposium or erased exam? Argued it was an erased exam that became a black-market symposium.
      *   Moonshine evidence? Yes.
      *   Scalability/Surveillance twist? Yes.
      *   No bibliographies? Checked.

  6.  **Final Polish:** (Writing the response with these structural elements in mind.) *Self-correction: Make sure to emphasize that Plato isn't pro-drunk, he's pro-truth.* Gorbachev wanted the appearance of sobriety; Plato wanted the reality of self-control.

