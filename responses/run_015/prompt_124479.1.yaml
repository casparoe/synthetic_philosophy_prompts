    "history_from_below_visible": "Peasant agency, shared demands (end serfdom/fixed rents), ideological coherence (John Ball's sermons), rational destruction of legal evidence.",
    "history_from_below_obscured": "Limits of peasant agency (loyalty to King), lack of lasting organizational capacity, internal rebel violence/xenophobia, structural coercion.",
    "state_narrative_visible": "Poll Tax legislation, royal military response, legal nullification of charters, restoration of aristocratic order, parliamentary context.",
    "state_narrative_obscured": "Local motivations for rebellion, non-elite coordination, rebel political rationality, experience of subordinate groups.",
    "episode_tests_theory": "Challenges microhistory by showing structural weakness beyond individual contingency; challenges history-from-below by revealing agency bounded by royalist ideology; confirms state narrative on outcome but not causation.",
    "unexpressed_residue": "The paradox of rebels attacking the state's officials while appealing to the state's head (the King), requiring a synthesis of ideological hegemony and material grievance that neither pure bottom-up nor pure state lens fully captures alone."
  }
  ```
