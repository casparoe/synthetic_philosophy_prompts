      *   **Goal:** Move beyond the standard "Liberty vs. Tradition" undergrad framing.
      *   **Core Comparison:** Hart's *critical vs. positive morality* (from *The Concept of Law*) vs. Devlin's *disintegration thesis* (from *The Enforcement of Morals*).
      *   **Specific Question 1:** Does Devlin's disintegration thesis treat moral harm like an economic externality (normative pollution)?
      *   **Specific Question 2:** Does Hart's refusal to count offense/disgust as harm miss the collective-action structure of Devlin's worry?
      *   **Specific Question 3:** Can Hart's internal resources (critical/positive morality distinction) block Devlin without smuggling in an autonomy-trumps-stability assumption?
      *   **Specific Question 4:** Evaluate the "immune system" analogy (relaxing norms = normative infection). Does it do philosophical work or just dress up conservatism? Where does it collapse?

  2.  **Initial Assessment & Strategy:**

