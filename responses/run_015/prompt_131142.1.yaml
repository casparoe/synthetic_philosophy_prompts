      *   I need to avoid simplifying Hart or Devlin.
      *   I need to tackle the "externality" claim carefully. Devlin doesn't use economic language, but the *structure* of his argument might parallel externalities.
      *   I need to dig into Hart's *Concept of Law* (CoL) distinction, not just *Law, Liberty, and Morality* (LLM), as requested.
      *   I need to critically analyze the immune system analogy.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Set the stage: moving from "Liberty vs. Morals" to "Social Ontology and Harm."

      *   **Part 1: Devlin and the Economic Externality Framing:**
          *   *Devlin's Claim:* Immorality weakens the fabric of society. Disintegration is the ultimate harm.
          *   *Externality Analysis:* An externality is a cost imposed on a third party not involved in the transaction. Does private vice impose a cost on the public? Yes, according to Devlin. The "cost" is social cohesion.
          *   *Nuance:* It's not *exactly* an economic externality because the "good" being degraded (social cohesion) is non-rivalrous but excludable in a weird way. It's more like a *public good* problem. If everyone defects from the norm, the public good vanishes.
          *   *Verdict:* It's structurally similar to a negative externality (normative pollution), but it relies on a metaphysical claim about the nature of society (society = shared ideas) that economics doesn't usually make.

      *   **Part 2: Hart's Critical vs. Positive Morality & The Collective Action Problem:**
          *   *Hart's Distinction (CoL):* Positive morality = what society *does* accept. Critical morality = what society *ought* to accept (rational standards).
          *   *The Charge:* Does Hart ignore the collective action problem? Devlin says: "Even if *you* think the norm is silly, if we all drop it, we collapse." Hart says: "Show me the harm."
          *   *Hart's Defense:* Hart doesn't just say "Autonomy." He attacks the *empirical* claim. Does immorality actually cause disintegration? He demands evidence.
          *   *The "Smuggling" Accusation:* Does Hart assume autonomy trumps stability? Hart would argue stability based on false positives (positive morality) is fragile anyway. A society held together by critical morality (reason/justice) is more stable than one held together by disgust.
          *   *Key Point:* Hart shifts the burden of proof. Devlin asserts disintegration; Hart demands sociological proof.

      *   **Part 3: The Immune System Analogy:**
