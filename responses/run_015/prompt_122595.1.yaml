      4. Recommendation: Commit to Token Identity.

      *Wait, one more thing:* The user says "I'm not an academic." Keep jargon minimal. Explain "Token Identity" as "The specific event is the same thing."

      *Final check on "Two-Ledger":* If I say "The storm caused the flood" and "The drop in pressure caused the flood," are those one relation? Yes. But if the drop in pressure is *physically sufficient*, does the storm add anything? Only if the storm *is* the drop in pressure (plus wind, etc.). If the storm is a separate entity, it's overdetermination. The user needs the mental to be *constituted* by the physical, not just correlated.

