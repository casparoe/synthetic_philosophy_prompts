      *   The stalker represents a threat to her *freedom*, but not her *agency* in the actual timeline.

      *(Self-Correction)*: I should also mention that some philosophers *do* defend (1) by arguing there *is* a sense in which she could have done otherwise (e.g., she could have tried to choose differently, even if failed). This is the "Flicker of Freedom" strategy. But that might complicate things too much. Stick to the mainstream Compatibilist view as it fits the user's intuition better.

