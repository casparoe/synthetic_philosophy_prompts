prompt: |-
  I write durability and safety claims into specifications for reusable medical-device packaging and delivery hardware. Roughly two dozen such claims a year pass across my desk; each one costs about a week of engineer time, has to be signed off by QA and Regulatory, and — because my team are engineers with no philosophy training and I can't justify more than an hour of conceptual work per claim — I need something they can run cold, in ordinary language, with the reasoning stated in your own words. Please don't point me to papers or name-drop authors; my team can't use them and I'd rather have the argument than the bibliography.

  The claims are almost always dispositional: "stays closed under shock," "maintains a sterile barrier for 36 months," "cannot deliver a harmful bolus," "resists ingress after repeated flexing." The naive way to cash these out — the item would do X if condition C obtained — keeps failing us in three distinguishable ways, and I want a procedure that separates them:

  1. Cases where the test itself destroys or removes the very capacity being certified, so the item passes for the wrong reason or is consumed by the test (single-use test on a reusable part).
  2. Cases where something merely blocks the manifestation without removing the capacity, and where the blocking factors are open-ended — a finite checklist can never enumerate them all.
  3. Cases where the observed behaviour is produced by something other than the capacity we're claiming, including behaviour produced by damage the test itself inflicted.

  There is also a fourth worry I can't get straight: a pattern of passing is not the same as a capacity. We once shipped a claim that held for two years only because our test rig was miscalibrated, and the "disposition" was really an accident of our procedure. So the procedure has to say what distinguishes a genuine capacity from a mere run of good results, in terms an engineer can actually check.

  A colleague tells me the philosophical literature has tags for some of this — something like finks, masks and mimics — and that there is a live argument about whether a capacity that never manifests is still there. I don't know the details and don't need them. If that framing earns its keep, use it; if it's a distraction from the shop-floor problem, say so and drop it.

  What I want from you:

  An ordered decision procedure my team runs on any proposed dispositional claim before it goes into a spec. For each step: the question to ask, what counts as a sufficient answer, what to record, and what to do when the honest answer is "we don't know." Mark explicitly (a) the steps where the procedure stops with "do not write this claim, or write it in this weaker scoped form," and (b) the steps where it must hand the decision to a named person because the remaining question is about tolerable risk rather than about fact. Be blunt about which distinctions survive being simplified for technicians and which ones I am losing by simplifying, and about where the procedure will misfire.

  Then run it on three real-shaped cases:

  A. A new claim: "the tray latch stays closed under a 30 g shock," tested destructively on sampled units, where the shock visibly deforms the latch — and the deformation is plausibly what keeps it shut.

  B. A legacy claim I'd be sorry to lose: "the pouch maintains a sterile barrier for 36 months on the shelf," where the "manifestation" is a continuing absence rather than an event, and the only evidence available is accelerated aging on a surrogate.

  C. A claim Regulatory and Sales both want in absolute form: "the pump cannot deliver a harmful bolus." It holds because an occlusion sensor triggers a shutdown that removes the pressure build-up before it becomes dangerous — and in one rare failure mode the sensor is itself what hides a real occlusion.

  If the procedure tells me a claim has to come out of the spec, or can only be written in a weaker form than Sales wants, say that plainly rather than softening it.

  Finally: for each step you flag as irreducibly a judgment call, tell me what would change your mind about the procedure itself — what argument or what kind of evidence would show that step is mis-specified, or that I've kept the wrong distinction and dropped the one that mattered. And name the class of dispositional claim on which you'd expect this procedure to fail silently rather than visibly, plus the one step you'd expect to become a rubber stamp within six months of real use.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Writes durability/safety claims for reusable medical-device packaging/hardware.
      *   **Constraints:** ~24 claims/year. Each costs 1 week engineer time. Needs QA/Regulatory sign-off. Engineers have no philosophy training. Max 1 hour conceptual work per claim.
      *   **Goal:** A cold, runnable decision procedure in ordinary language. No academic name-dropping (unless useful as a tag), no bibliographies. Needs the *argument*, not the source.
      *   **Problem:** Naive dispositional claims ("X happens if Y") fail in specific ways (destructive testing, masking/blocking, mimicking/false positives, miscalibration/luck).
      *   **Specific Inputs:** Three test cases (A: Destructive shock test, B: Sterile barrier aging, C: Pump bolus safety/occlusion sensor).
      *   **Specific Outputs:** Ordered decision procedure (questions, answers, records, "don't know" handling), explicit stop/hand-off points, analysis of simplification losses, application to cases, reflection on procedure validity/failure modes.
      *   **Tone:** Blunt, practical, engineering-focused, philosophically rigorous but disguised as operational protocol.

  2.  **Deconstruct the Philosophical Problems (Finks, Masks, Mimics, Luck):**
      *   *Finks/Interference:* The test destroys the capacity (Case A).
      *   *Masks:* Something blocks the manifestation without removing capacity (Case C - sensor hides occlusion).
      *   *Mimics:* Behavior looks right but comes from wrong cause (Case A - deformation keeps it shut, not latch design).
      *   *Luck/Calibration:* Passing due to rig error, not capacity (User's 4th worry).
      *   *Negative Dispositions:* "Maintains barrier" is an absence of event, hard to test directly (Case B).

  3.  **Drafting the Decision Procedure (The "Core"):**
      *   *Constraint:* Must be runnable by engineers in <1 hour.
      *   *Structure:* Step-by-step checklist.
      *   *Language:* "Does the test break the part?" not "Is this a finkish disposition?"
      *   *Key Distinctions:*
          1.  **Destructibility:** Does the test consume the capacity?
          2.  **Mechanism:** Is the passing behavior caused by the *claimed* feature or something else (damage, workaround)?
          3.  **Interference:** Is there a hidden switch that turns the capacity off *during* the test but leaves it intact otherwise (or vice versa)?
          4.  **Evidence Base:** Is the passing due to the device or the rig/environment?
      *   *Hand-offs:* Risk tolerance is not engineering fact. That goes to QA/Regulatory.

      *Drafting Steps:*
      1.  *Test Integrity:* Does the test break the thing it's testing? (Addresses Fink/Destruction).
      2.  *Causal Link:* If it passes, is it because of the design feature we think, or damage/luck? (Addresses Mimic).
      3.  *Hidden Switches:* Are there conditions where the safety turns off but the test doesn't see it? (Addresses Mask).
      4.  *Negative Claims:* If the claim is "nothing happens," how do we know "nothing" isn't just "we didn't look hard enough"? (Addresses Negative Dispositions).
      5.  *Rig Independence:* If the rig changes, does the claim still hold? (Addresses Luck/Calibration).

      *Refining for the User's Constraints:*
      *   Need to explicitly mark "STOP" points.
      *   Need to mark "HAND-OFF" points.
      *   Need to handle "We don't know."

  4.  **Developing the "Philosophical Translation":**
      *   Avoid terms like "finkish disposition" in the procedure itself. Use them in the commentary to explain *why* the step exists.
      *   The user asked: "If that framing earns its keep, use it; if it's a distraction... drop it."
      *   *Decision:* Use the concepts (Mask/Mimic/Fink) in the *commentary* to validate the procedure, but keep the *procedure* in plain English. The engineers need to know *what to check*, not *what to call it*.

  5.  **Applying to Cases:**
      *   *Case A (Latch/Shock):* Destructive test. Deformation causes passing. This is a Mimic (damage mimics latch) + Fink (test destroys latch). *Verdict:* Claim must change.
      *   *Case B (Sterile/36mo):* Negative claim. Accelerated aging surrogate. *Verdict:* High uncertainty. Needs hand-off to Regulatory on model validity.
      *   *Case C (Pump/Bolus):* Sensor masks the danger. If sensor fails, danger exists. Claim says "cannot." *Verdict:* Claim is false. Must be scoped to "unless sensor fails."

  6.  **Reflecting on the Procedure (The "Meta" Analysis):**
      *   *Simplification Loss:* We lose the nuance of "probabilistic capacity." Engineering treats pass/fail as binary; reality is statistical.
      *   *Failure Mode:* Silent failure on complex system interactions (emergent behavior).
      *   *Rubber Stamp:* The "Rig Independence" step will likely become a checkbox tick without actual rig variation.
      *   *Changing My Mind:* If a claim passes the procedure but fails in the field consistently, the "Causal Link" step is too weak.

  7.  **Review against Constraints:**
      *   *Ordinary language?* Yes.
      *   *No name-dropping in procedure?* Yes.
      *   *Blunt on "Do not write"?* Yes.
      *   *Mark (a) Stops and (b) Hand-offs?* Yes.
      *   *Address the 4th worry (Luck/Calibration)?* Yes, in the Rig Independence step.
      *   *Address the "Capacity vs. Pattern" worry?* Yes, in the Causal Link step.

  8.  **Final Polish:**
      *   Ensure the tone is authoritative but collaborative.
      *   Make sure the "We don't know" paths are clear.
      *   Check the specific request about "what would change your mind."

      *(Self-Correction during drafting)*: I initially thought about putting "Risk" in the engineering steps. No, the prompt says engineers can't judge risk, only fact. Risk goes to QA/Regulatory. I need to make sure the procedure separates *capability* from *tolerance*.
      *(Self-Correction on Case C)*: The claim is "Cannot deliver." If the sensor hides the occlusion, the pump *can* deliver, it just usually doesn't. The claim is factually false. I need to be blunt here.

      *(Refining the "Capacity vs. Pattern" worry)*: This is the "Miscalibration" issue. The procedure needs a step that asks: "If we change the measurement tool, does the result hold?"

      *(Final check on "Finks/Masks/Mimics")*: The user mentioned them. I should acknowledge them in the commentary to show I understood the prompt's philosophical underpinning, but keep them out of the engineer's checklist.

      *(Structure)*:
      1. Introduction (acknowledging the constraint).
      2. The Procedure (The "Dispositional Sanity Check").
      3. Application to Cases A, B, C.
      4. Meta-Analysis (Simplification losses, Failure modes, Rubber stamps, Changing my mind).

      Let's write it.

      *Wait, one more check:* The user asked: "For each step: the question to ask, what counts as a sufficient answer, what to record, and what to do when the honest answer is 'we don't know.'" I need to make sure every step has these four sub-components.

      *Also:* "Mark explicitly (a) the steps where the procedure stops... and (b) the steps where it must hand the decision to a named person."

      *Also:* "Name the class of dispositional claim on which you'd expect this procedure to fail silently..."

      Okay, ready to draft.

      *Step 1: Destructibility (The Fink).*
      *Step 2: Causal Mechanism (The Mimic).*
      *Step 3: Hidden Switches (The Mask).*
      *Step 4: Rig/Measurement Independence (The Luck).*
      *Step 5: Negative Claims (The Absence).*

      Wait, Case B is a negative claim ("maintains barrier" = "does not breach"). This is hard. The procedure needs to handle "absence of evidence is not evidence of absence."
      Case C is a "cannot" claim (absolute). This is usually false in engineering. Needs strict scoping.

      Let's refine the "Hand-off." The hand-off is for *Risk*. If the capacity is real but fragile, is that okay? That's QA. If the capacity is unproven, that's Regulatory.

      Okay, proceeding with generation.cw
answer: |-
  Here is a decision procedure designed for your constraints. It translates the philosophical distinctions (finks, masks, mimics, luck) into operational checks without using the jargon. It is built to be run in under an hour by an engineer who cares about physical facts, not metaphysics.

  ### The Dispositional Sanity Check (DSC)

  **Purpose:** To verify that a proposed claim describes a real capacity of the device, not an artifact of the test, a temporary state, or a lucky accident.
  **Usage:** Run this *before* drafting the specification language.
  **Record:** Keep the completed DSC form attached to the specification draft.

  ---

  #### Step 1: The Consumption Check (Is the capacity destroyed by proving it?)
  *   **Question:** Does the test required to prove this claim physically alter or consume the specific feature that provides the safety/durability?
  *   **Sufficient Answer:** "No, the part is unchanged after testing" OR "Yes, but we test a sample and claim only for the untested population."
  *   **Record:** State clearly whether the test is non-destructive or destructive. If destructive, specify the sampling plan.
  *   **If "We Don't Know":** Run one test unit and inspect the feature microscopically before and after.
  *   **(a) STOP CONDITION:** If the test is destructive *and* the claim applies to the specific unit tested (e.g., "This reusable tray stays closed..."), **do not write the claim.** You are certifying a broken part. You must re-scope to "New units sampled from the lot."
  *   **(b) HAND-OFF:** If the test is destructive and requires sampling, hand off to **QA** to approve the sample size. This is a risk decision (how many units can we afford to break to trust the rest?), not an engineering fact.

  #### Step 2: The Mechanism Check (Is the passing behavior caused by the design?)
  *   **Question:** If the device passes the test, is it passing because of the specific design feature named in the claim, or because of damage, deformation, or a workaround that occurred *during* the test?
  *   **Sufficient Answer:** "The design feature carried the load" OR "We have isolated the feature and confirmed it is the load path."
  *   **Record:** Identify the specific physical load path or mechanism. Note any visible deformation.
  *   **If "We Don't Know":** Run a "mechanism isolation" test (e.g., disable the suspected workaround, or test the component in isolation).
  *   **(a) STOP CONDITION:** If the device passes only because it deformed, jammed, or broke in a way that accidentally creates safety (e.g., a latch that holds because it bent shut), **do not write the claim.** This is a "mimic." The capacity is not "latch strength," it is "deformation tolerance," which is not what you are claiming.
  *   **(b) HAND-OFF:** None. This is a factual engineering determination.

  #### Step 3: The Hidden Switch Check (Can the capacity turn off without the test seeing it?)
  *   **Question:** Is there a condition (mode, state, or external factor) where the safety feature is bypassed, disabled, or overridden, which the test does not simulate?
  *   **Sufficient Answer:** "No, the feature is passive/mechanical" OR "Yes, but the test cycles through all known modes."
  *   **Record:** List all operational modes (e.g., standby, active, fault, maintenance). Confirm which were tested.
  *   **If "We Don't Know":** Review the control logic or system schematic for any branch that bypasses the safety feature.
  *   **(a) STOP CONDITION:** If a bypass exists (e.g., a sensor can be disabled, or a mode skips the check), **do not write an absolute claim** ("cannot," "always"). You must scope the claim to exclude that mode (e.g., "during normal operation").
  *   **(b) HAND-OFF:** If the bypass is a known failure mode with low probability, hand off to **Regulatory** to decide if the residual risk is acceptable. The engineer establishes the bypass exists; Regulatory decides if it matters.

  #### Step 4: The Rig Independence Check (Is the result an artifact of our setup?)
  *   **Question:** If we changed the test rig, the sensor, or the operator, would the device still pass? (Specifically: Is the "pass" dependent on our specific calibration?)
  *   **Sufficient Answer:** "Yes, we have verified the result on a second rig" OR "Yes, the margin of pass is large enough that calibration drift wouldn't change the result."
  *   **Record:** Note the margin of pass (e.g., "Passed at 30g; failure threshold is 50g").
  *   **If "We Don't Know":** Calculate the safety margin. If the pass/fail point is within 10% of the test limit, you do not know.
  *   **(a) STOP CONDITION:** If the pass margin is smaller than the known calibration error of the rig, **do not write the claim.** You are certifying the rig, not the device.
  *   **(b) HAND-OFF:** None. This is metrology.

  #### Step 5: The Absence Check (For claims about things *not* happening)
  *   **Question:** For claims like "maintains barrier" or "no leakage": Is the test sensitive enough to detect the failure if it were happening slowly or intermittently?
  *   **Sufficient Answer:** "Yes, the detection limit is below the harm threshold."
  *   **Record:** State the detection limit of the test (e.g., "Can detect 0.5 micron breach").
  *   **If "We Don't Know":** You cannot write the claim. "We don't know" in an absence claim means "We haven't looked hard enough."
  *   **(a) STOP CONDITION:** If the test cannot detect the failure mode at the level where harm begins, **do not write the claim.**
  *   **(b) HAND-OFF:** Hand off to **Regulatory** to accept the surrogate model (e.g., accelerated aging). Engineering cannot prove the surrogate matches reality; Regulatory must accept the correlation.

  ---

  ### Application to Your Cases

  #### Case A: "The tray latch stays closed under a 30 g shock."
  *   **Step 1 (Consumption):** **FAIL.** The shock visibly deforms the latch. The test consumes the capacity. The unit tested is now a "one-time use" part, but the device is reusable.
  *   **Step 2 (Mechanism):** **FAIL.** The deformation is what keeps it shut. This is a **Mimic**. The latch design didn't hold; the damage held.
  *   **Verdict:** **Do not write this claim.**
  *   **Required Action:** Rewrite to: "The tray latch remains functional after 30g shock" (requires non-destructive testing) OR "The tray remains closed under 30g shock via controlled deformation" (admits the deformation). If the deformation compromises reusability, the claim must be restricted to single-use or the design must change.
  *   **Philosophical Note:** This is a classic *finkish* disposition. The test removes the very disposition it tries to measure.

  #### Case B: "The pouch maintains a sterile barrier for 36 months on the shelf."
  *   **Step 1 (Consumption):** Pass (testing samples, not every pouch).
  *   **Step 2 (Mechanism):** Pass (material integrity is the mechanism).
  *   **Step 5 (Absence):** **HAND-OFF.** You are testing accelerated aging on a surrogate. You cannot factually prove 36 months in real-time.
  *   **Verdict:** **Write the claim, but hand off to Regulatory.**
  *   **Required Action:** The engineer certifies the material didn't break *in the test*. Regulatory must sign off that the acceleration model is valid for 36 months. This is not an engineering fact; it is a regulatory model acceptance.
  *   **Philosophical Note:** This is a *negative disposition* (absence of breach). You are inferring a capacity from a lack of events. The procedure correctly identifies this as a risk/model acceptance, not a hard fact.

  #### Case C: "The pump cannot deliver a harmful bolus."
  *   **Step 3 (Hidden Switch):** **FAIL.** The sensor triggers shutdown. In one failure mode, the sensor hides the occlusion. This means the pump *can* deliver a bolus if the sensor fails. The claim "cannot" is factually false.
  *   **Verdict:** **Do not write the absolute claim.**
  *   **Required Action:** Rewrite to: "The pump limits bolus volume to X under single-fault conditions." You must admit the fault exists.
  *   **Hand-off:** **Regulatory.** They must decide if the single-fault condition is tolerable.
  *   **Philosophical Note:** This is a *mask*. The safety system masks the danger during the test, but the capacity for danger remains latent. An absolute "cannot" claim denies the latent capacity.

  ---

  ### Meta-Analysis of the Procedure

  #### What you lose by simplifying
  1.  **Probabilistic Nuance:** The procedure treats capacity as binary (exists/doesn't). In reality, capacity degrades. Step 4 (Rig Independence) tries to catch this with "margin," but engineers may treat "pass" as absolute. You lose the ability to specify "95% reliability" without making the claim statistical, which Regulatory often hates.
  2.  **Systemic Emergence:** Step 3 checks for "modes," but it assumes you know what the modes are. It will miss emergent behaviors where two safe systems interact to create an unsafe one. The procedure assumes a modular architecture.

  #### Where the procedure will fail silently
  *   **Class of Claim:** **Software-mediated safety claims.** (e.g., "The system prevents overdose").
  *   **Reason:** Step 3 (Hidden Switch) relies on the engineer knowing the logic branches. In complex code, "dead code" or race conditions can create hidden switches that no one knows exist until deployment. The procedure assumes the schematic is complete. It is not.
  *   **Result:** You will write the claim, the DSC will say "Pass," and the field failure will occur due to a logic path not documented in the schematic.

  #### The Rubber Stamp Risk
  *   **Step:** **Step 4 (Rig Independence).**
  *   **Prediction:** Within six months, engineers will calculate "margin" based on nominal specs rather than measured variation. They will write "Margin > 20%" because the CAD model says so, not because they ran a second rig.
  *   **Mitigation:** Require actual data from a second setup for any claim labeled "Critical Safety."

  #### What would change my mind about the procedure?
  1.  **Step 2 (Mechanism):** If you find a case where the device works reliably for its entire life, but the mechanism is *not* the one the engineers identified (e.g., friction holds it, not the latch), and the device is still safe.
      *   *Argument:* If the outcome is robust, does the mechanism matter?
      *   *My Counter:* Yes, because if you don't know *why* it holds, you don't know what changes will break it. If this step proves too burdensome, it means your design documentation is poor, not that the step is wrong.
  2.  **Step 5 (Absence):** If Regulatory accepts "Field Surveillance" as proof of capacity (i.e., "We ship it, watch for failures, and claim it's sterile until proven otherwise").
      *   *Argument:* This shifts the burden from pre-market proof to post-market detection.
      *   *My Counter:* This changes the claim from "Maintains barrier" to "No breaches reported." If you are willing to make that linguistic shift, Step 5 can be dropped. If you must claim "Maintains," Step 5 is required.

  #### Final Blunt Advice
  Your team wants to write "The device does X." The world is "The device does X, unless Y, Z, or Q."
  *   **Case A** is a design flaw masked as a test pass. Fix the latch, don't fix the claim.
  *   **Case B** is a regulatory fiction. Let Regulatory own the fiction.
  *   **Case C** is a lie. Do not sign it. "Cannot" is a word your hardware has not earned. Use "Limits" or "Controls."

  If Sales pushes back on Case C, show them Step 3. Ask them to sign a document stating: "We claim the sensor never fails." If they won't sign that, they can't have the claim.
