  **Title:** Recovering Classical Validity: A Case for Fieldian Revision over Kripkean Fixed Points

  **Introduction**
  The search for a consistent naive truth theory—one that retains the unrestricted T-schema ($T(\ulcorner A \urcorner) \leftrightarrow A$) without collapsing into triviality—has long been dominated by Saul Kripke's (1975) fixed-point semantics. Kripke's outline of a truth predicate grounded in a partial logic offers an elegant solution: paradoxical sentences like the Liar are assigned no truth value, preserving the T-schema for all grounded sentences while blocking contradiction. However, Hartry Field's *Saving Truth from Paradox* (2008) challenges the supremacy of the Kripkean framework. Field proposes a revision-theoretic semantics coupled with a non-classical conditional. While Field's system is technically more radical, abandoning the Law of Excluded Middle (LEM) for paradoxical sentences, I argue it is philosophically superior. Field's account provides a more robust defense against Strengthened Liar and Curry paradoxes, recovers classical validities for non-paradoxical discourse through "ultimate truth," and, crucially, allows for the in-language expression of semantic defectiveness in a way Kripke's static gaps cannot.

  **The Revenge Problem and Curry's Paradox**
  To appreciate Field's contribution, one must first acknowledge the strength of Kripke's minimal fixed-point construction. Kripke utilizes Strong Kleene logic (K3), where the Liar sentence ($\lambda$) receives the value *gap* (neither true nor false). This is a conservative amendment to classical logic; it respects the intuition that $\lambda$ is defective without forcing us to accept a contradiction. For the "grounded" fragment of language—ordinary empirical and mathematical discourse—Kripke's theory behaves exactly like classical logic. It is a minimalist solution that disturbs our logical intuitions as little as possible, restricting truth-value gaps only to sentences that refer to truth in a circular manner.

  However, this minimalism becomes a liability when facing the Strengthened Liar ("This sentence is not true") and Curry's Paradox. In Kripke's system, if $\lambda$ is a gap, then " $\lambda$ is not true" appears to be true. But since $\lambda$ *is* " $\lambda$ is not true," we seem to derive that $\lambda$ is true, generating a "revenge" paradox. Kripkeans must argue that the predicate "is not true" cannot be expressed in the object language without shifting to a metalanguage, effectively smuggling in a Tarskian hierarchy. Furthermore, K3 lacks a conditional that validates Modus Ponens universally; while this blocks Curry's Paradox (which relies on contraction or conditional proof), it renders the logic too weak for standard mathematical reasoning involving conditionals.

  Field's revision semantics overcomes this by iterating the assignment of truth values through transfinite ordinals. Field introduces a "determinately" operator ($D$), defined via the revision sequence. A sentence is determinately true if it stabilizes as true across the revision sequence. This allows Field to classify the Liar as *indeterminate* without generating revenge. We can assert $D(\lambda)$ is false without implying $\lambda$ is true, because the negation involved is not classical negation but a negation compatible with the failure of LEM. Field's system absorbs the Strengthened Liar by treating the defectiveness of $\lambda$ as a stable feature of the revision process, not a static gap that invites semantic ascent. Thus, Field retains a naive truth theory within a single language, avoiding the hierarchy Kripke is forced to tacitly endorse.

  **Recovering Classical Validity**
  A common objection to Field is that his logic is too deviant. By rejecting LEM for paradoxical sentences, Field seems to sacrifice more classical intuition than Kripke. Kripke's K3 logic preserves all classical tautologies for grounded sentences; Field's logic, by contrast, alters the conditional and negation. However, this objection overlooks Field's mechanism of "ultimate truth."

  Kripke's approach is static: a sentence is either in the fixed point or it is not. Field's approach is dynamic. Through the revision sequence, sentences that are not paradoxical stabilize. Field demonstrates that for any sentence that stabilizes as true or false, classical logic is fully recovered. The "loss" of classical validity occurs only at the limit stages involving pathological sentences. Consequently, Field preserves everything we want from classical logic for science and mathematics, while Kripke's inability to define a robust conditional hampers the expression of general laws (e.g., "All truths are knowable") even in grounded contexts.

  Field's conditional is designed to validate Modus Ponens and Conditional Proof, which Kripke's Strong Kleene conditional cannot do without risking triviality. This makes Field's logic more expressive for theoretical reasoning. While Kripke preserves classical *truth values* for grounded sentences, Field preserves classical *validities* and *inferences*. For a logic intended to underwrite mathematical and scientific discourse, the preservation of inference rules (via Field's conditional) is more vital than the preservation of bivalence (via Kripke's gaps). The radical nature of Field's revision semantics is the price paid to ensure that the conditional connective behaves as we intuitively require it to in non-paradoxical contexts.

  **The Expressibility of Defectiveness**
  Finally, we must consider the status of the Liar sentence itself. There is a temptation to view Kripke's gap as more intuitive: the Liar is simply nonsense, neither true nor false. Field is often mischaracterized as accepting true contradictions (dialetheism), but this is incorrect; Field is a paracompletist who rejects LEM. However, Field offers a distinct advantage regarding how we talk *about* the Liar.

  In Kripke's system, we cannot say within the object language that the Liar is "gappy." To say "$\lambda$ is not true" is to speak a truth (since $\lambda$ is not true), which risks the revenge paradox. We are forced into silence or metalanguage ascent to explain why $\lambda$ fails. Field's framework, utilizing the determinacy operator, allows us to assert within the object language that $\lambda$ is indeterminate ($\neg D(\lambda) \land \neg D(\neg \lambda)$). This is not to say $\lambda$ is both true and false, but rather that its truth value is unstable across the revision sequence.

  This is a significant theoretical gain. A theory of truth should ideally explain the defectiveness of paradoxical sentences without requiring the theorist to step outside the system. Kripke's theory requires us to view the fixed point from the "outside" to understand why the Liar is excluded. Field's theory allows the exclusion to be codified from the "inside" via the failure of determinacy. While Kripke's gap feels initially more conservative, it ultimately renders the theory of truth inexpressible within the truth theory itself. Field's radicalism allows for a self-contained explanation of paradox.

  **Conclusion**
  Hartry Field's *Saving Truth from Paradox* represents a significant advancement over Kripke's fixed-point theory. While Kripke offers a simpler, static model that preserves bivalence for grounded sentences, it falters against the Strengthened Liar and lacks a robust conditional. Field's revision-theoretic approach, though more complex, successfully contains revenge paradoxes, recovers classical validities for stable discourse, and permits the in-language expression of semantic defectiveness. The cost of abandoning the Law of Excluded Middle for paradoxical sentences is outweighed by the gain in expressive power and logical consistency. Field shows that to save truth from paradox, we must be willing to revise not just our truth values, but the very logic governing them.

  ***

  ### Critical Feedback on Your Argument (Advisor's Note)

  You asked me to flag if your third point was incoherent. **It is.** You need to be very careful here before submitting this to your seminar.

  **The Error:** You wrote that Field "lets the Liar be both true and false." This is a description of **dialetheism** (like Graham Priest's *Logic of Paradox*). Hartry Field is explicitly **not** a dialetheist. He is a **paracompletist**. He rejects the Law of Excluded Middle ($\neg (A \lor \neg A)$), he does *not* reject the Law of Non-Contradiction. In Field's system, the Liar is *neither* determinately true *nor* determinately false. It is not a glut (true and false); it is a gap (indeterminate), just like in Kripke, but handled via revision theory rather than fixed points.

  If you submit a paper claiming Field accepts true contradictions, your professor will likely fail the paper on technical accuracy alone. Field's entire project in *Saving Truth* is to solve the paradoxes *without* accepting contradictions.

  **The Fix:** I adjusted Point 3 in the essay above to focus on **Expressibility**. The argument isn't that Field accepts contradictions; it's that Field allows you to *say* "The Liar is indeterminate" inside the object language using the $D$ operator, whereas Kripke forces you to go to the metalanguage to say "The Liar is a gap." This is the standard "Field vs. Kripke" advantage in the literature.

  **Recommendation:** Before you finalize this, double-check Field's distinction between his conditional and Priest's. Field's conditional validates Modus Ponens; Priest's does not. Field rejects LEM; Priest accepts it. Ensure you don't conflate *Saving Truth* (Field) with *In Contradiction* (Priest).
