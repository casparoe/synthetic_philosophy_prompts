answer: |-
  The institutional practice of treating demographic parity, equalized odds, and calibration as simultaneously achievable targets—despite mathematical proofs to the contrary—reveals a specific, often unexamined, philosophical framework. This framework relies on what might be termed **metric compatibilism**: the belief that distinct ethical intuitions about fairness can be reconciled through sufficient technical optimization. By analyzing this practice, we can reconstruct the implicit theory of fairness, agency, and harm that sustains it, and contrast it with a framework that treats impossibility results as normative boundaries.

  ### 1. Philosophical Commitments

  **Fairness as Compliance rather than Judgment**
  The protocol presupposes that fairness is a state of *convergence* rather than a process of *prioritization*. It assumes that there exists a "true" fair state defined by the intersection of all major metrics. Philosophically, this commits the institution to a deontological checklist model of ethics, where moral rectitude is achieved by satisfying a set of necessary conditions. It implies that if a model fails to satisfy all criteria, the failure is one of *capacity* (the model isn't smart enough, the data isn't rich enough) rather than *conflict* (the values themselves are incompatible). This removes the need for stakeholders to make explicit value judgments about which form of equity matters most in a specific context.

  **Moral Responsibility as Engineering**
  By framing the violation of multiple criteria as a problem to be solved via retraining or feature constraining, the practice locates moral responsibility within the engineering team. It assumes that ethical conflicts are engineering bugs. This is a form of **moral laundering**: it transforms a political choice (e.g., "we will prioritize false positive rates over calibration") into a technical task ("optimize the loss function"). The institution absolves itself of the responsibility to justify why one group's error rate might be privileged over another's, delegating that choice to the mathematical constraints of the algorithm.

  **Ontology of Statistical Harm**
  The practice treats harm as reducible to statistical deviation from an idealized distribution. It presupposes that the base rates observed in the data are fixed ontological truths rather than historical artifacts of structural inequality. If base rates differ between groups, satisfying both calibration and equalized odds is impossible. By attempting to satisfy both anyway, the auditor implicitly treats base rates as malleable variables that the model *should* be able to correct, or conversely, ignores the structural origin of those rates. Harm is viewed as "noise" to be minimized, rather than a structural outcome that the algorithm might be reproducing.

  ### 2. Additivity vs. Structural Constraints

  The protocol strictly assumes that fairness is an **additive (or conjunctive) property**. It operates on the logic that $Fairness = DP \land EO \land CAL$. This assumes that these metrics measure independent dimensions of the same underlying moral truth.

  In reality, fairness is a **structurally constrained trade-off**. The impossibility theorems (e.g., Kleinberg et al., 2016; Chouldechova, 2017) demonstrate that these metrics pull in opposite directions when base rates differ. The auditing practice denies this topology. It assumes the "fairness landscape" has a peak where all metrics are maximized, rather than a Pareto frontier where improving one metric necessitates worsening another. By ignoring the trade-off, the practice avoids the ethical burden of defining the shape of that frontier.

  ### 3. The Algorithm: Neutral Observer vs. Embedded Agent

  This practice is **inconsistent** with viewing the algorithm as an embedded agent.

  *   **Neutral Observer:** The current protocol treats the algorithm as a thermometer measuring a static social reality. It assumes the data generating process is external to the model. If the metrics don't align, the thermometer is broken.
  *   **Embedded Agent:** If the algorithm is an embedded agent, its decisions alter the environment (e.g., denying loans affects future creditworthiness, changing base rates). An embedded view acknowledges that the model participates in the causal structure it measures.

  The auditing protocol assumes a static world where base rates are fixed constraints to be navigated, not dynamic outcomes to be managed. If the algorithm were treated as an embedded agent, the impossibility of simultaneous metrics would be understood as a signal that the system is interacting with a stratified society. The attempt to optimize all metrics simultaneously ignores the feedback loops that make such optimization unstable or harmful in the long run.

  ### 4. Reconstruction of the Implicit Theory

  To make this protocol intelligible, we must reconstruct the implicit theory of fairness and agency as **Technocratic Compatibilism**.

  *   **Core Axiom:** Ethical conflicts are technical inefficiencies.
  *   **Agency:** The algorithm is a passive instrument; the auditor is a mechanic; the institution is a beneficiary.
  *   **Normativity:** Normative validity is derived from metric satisfaction. If the metrics are satisfied, the decision is fair.
  *   **Epistemology:** Social reality is fully capturable via proxy variables and historical labels.

  This theory allows institutions to claim moral legitimacy without engaging in moral reasoning. It requires the belief that the "math will work out" if enough compute or data is applied.

  ### 5. Requirements vs. Accommodations

  We must distinguish what this practice *strictly requires* versus what merely *accommodates* it.

  **Strictly Required:**
  1.  **Commensurability:** The belief that different definitions of fairness can be measured on compatible scales.
  2.  **Malleability:** The assumption that the model's decision boundary can be shifted arbitrarily without destroying utility or violating other constraints.
  3.  **Liability Shield:** The institutional need to demonstrate "due diligence" through quantifiable metrics, regardless of their logical consistency.

  **Merely Accommodates:**
  1.  **Specific Metrics:** The practice could accommodate different metrics (e.g., predictive parity instead of calibration), provided they are treated as simultaneously achievable.
  2.  **Retraining vs. Post-Processing:** The specific method of correction (retraining vs. threshold adjustment) is secondary; the core commitment is that a correction *exists*.
  3.  **Perfection:** The practice accommodates the *attempt* to reach 100% compliance, even if it is never fully achieved. The *effort* to satisfy all criteria serves the same legitimizing function as the *success*.

  ### 6. Impossibility as Normative Boundaries

  If impossibility results were treated as normative boundaries rather than engineering problems, the auditing framework would require fundamental changes:

  1.  **From Optimization to Justification:** Audits would no longer ask, "Can we satisfy all metrics?" They would ask, "Which metric must be violated, and can we justify that violation to the affected groups?" The output of an audit would be a **value justification document**, not a pass/fail scorecard.
  2.  **Explicit Trade-off Governance:** Institutions would need governance boards empowered to select points on the Pareto frontier. This shifts responsibility from data scientists (who tune hyperparameters) to policy makers (who tune social priorities).
  3.  **Structural Diagnosis:** Discrepancies in base rates would trigger an investigation into the data generation process, not just the model. If demographic parity and equalized odds conflict because of historical hiring bias, the audit would flag the historical data as contaminated, rather than the model as miscalibrated.
  4.  **Acceptance of Residual Unfairness:** The framework would acknowledge that some statistical unfairness is inevitable in a non-ideal world. The goal would shift from *elimination* of disparity to *transparency* about the source and distribution of that disparity.
  5.  **Dynamic Monitoring:** Recognizing the algorithm as an embedded agent, audits would become longitudinal. They would measure how the choice of metric affects future base rates, acknowledging that today's fairness constraint might create tomorrow's structural harm.

  ### Conclusion

  The current institutional practice presupposes a world where ethics is computable and conflict is a bug. It treats fairness as an additive property of decision rules and views the algorithm as a neutral observer of a static world. This allows institutions to outsource moral responsibility to engineering teams. Treating impossibility results as normative boundaries would dismantle this comfort. It would force institutions to admit that fairness is a political choice involving inevitable trade-offs, requiring not better math, but better governance. The audit would cease to be a quality assurance check and would become a site of democratic deliberation.
