      *   *Moral Responsibility:* Responsibility lies with the *model builder* to "fix" the math. It absolves the *institution* of making hard value judgments. If you can't have it all, someone must have made a mistake in the engineering, not a choice in the ethics.
      *   *Ontology of Harm:* Harm is statistical deviation from an ideal metric. It treats harm as reducible to error rates. It ignores structural causes of base rate differences.

  4.  **Address Question 2: Additive vs. Structurally Constrained:**
      *   Yes, it treats fairness as additive (or conjunctive). "Fairness = DP + EO + CAL."
      *   It denies the trade-off nature. It assumes the "true" fairness is the intersection of all criteria, and failure to reach it is technical insufficiency, not normative conflict.

  5.  **Address Question 3: Embedded Agent vs. Neutral Observer:**
