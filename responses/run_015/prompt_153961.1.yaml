      *   **Constraint:** Answer in American English.

  2.  **Analyze the Mathematical Context (The "Impossibility Theorem"):**
      *   Kleinberg, Mullainathan, and Raghavan (2016) and Chouldechova (2017) showed that DP, EO, and CAL cannot generally hold simultaneously unless base rates are equal across groups or the classifier is perfect.
