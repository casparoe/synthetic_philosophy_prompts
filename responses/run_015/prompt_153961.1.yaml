      *   *Name:* Let's call it "Metric Plenipotentiary Fairness" or "Technocratic Compliance." Let's stick to describing it: A commitment to *metric compatibilism*.

  7.  **Distinguish Requirements vs. Accommodations:**
      *   *Strictly Required:* The belief that metrics are comparable and measurable. The belief that the institution wants to appear fair.
      *   *Merely Accommodates:* The specific choice of DP/EO/CAL. The idea that retraining is the solution (could be post-processing). The idea that all three *must* be met (could be weighted). The practice accommodates the *appearance* of rigor without the *substance* of ethical choice.

  8.  **Address Question 6: Impossibility as Normative Boundaries:**
      *   If treated as boundaries:
          *   Auditors must force stakeholders to *choose* which metric matters most (value judgment).
          *   Acknowledge base rate differences as potentially structural harms, not just statistical noise.
