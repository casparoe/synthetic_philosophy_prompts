      *   It *inconsist* with the "embedded agent" view. An embedded agent acknowledges that its decisions *change* the base rates and the environment. If the algorithm is embedded, you can't just optimize metrics; you have to consider feedback loops. The current practice assumes a static world where metrics just need to align.

