      *   *The Sorites-style reasoning:* Start with a clear case where $C$ obtains ($\alpha_0$). Assume luminosity. Subject is in a position to know $C$. If we assume they actually know (or iterate the principle), MFE implies $C$ holds in $\alpha_1$. Repeat to $\alpha_n$ where $C$ clearly fails. Contradiction.
