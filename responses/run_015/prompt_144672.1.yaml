      *   *Nuance on (b) Induction:* The standard objection to the anti-luminosity argument is that the MFE principle might not iterate perfectly or that "in a position to know" doesn't automatically convert to "knows" without an assumption of reflection. Williamson assumes the subject is attentive/reflecting in the relevant cases to generate the contradiction.

