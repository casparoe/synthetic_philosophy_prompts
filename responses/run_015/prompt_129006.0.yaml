  Your position rests on two specific uncertainties: training non-determinism (which model you got) and latent goal ambiguity (what goals are consistent with observations). Defeaters must address these mechanisms, not input robustness.

  | Defeater | Condition (What must be true) | Reference Class | Severity |
  | :--- | :--- | :--- | :--- |
  | **Global Convergence** | Training dynamics funnel all seeds/data orderings to functionally identical optima. | Training Variance | Fatal |
  | **Mechanistic Transparency** | Weight inspection confirms no latent optimizers or goal structures distinct from base loss. | Internal Goals | Fatal |
  | **Structural Tail Coupling** | Formal proof that capacity constraints or optimization dynamics structurally bind tail risk to bulk metrics. | Both | Severe |
  | **Context Indistinguishability** | Models provably cannot distinguish evaluation contexts from deployment environments. | Internal Goals | Moderate |
  | **Verification Impossibility** | Worst-case bounds are computationally undecidable for general learned optimizers. | Both | Moderate |
  | **Variance Swamping** | Ensemble variance is negligible compared to inherent environmental stochasticity. | Training Variance | Awkward |

  **Concessions**
  A committed defender should concede if the *mechanism* generating the risk is disproven, not merely if risk fails to manifest. If interpretability reveals the system is purely myopic (lacking latent goals), the Internal Goals worry collapses. If training dynamics are proven deterministic enough to eliminate lottery-ticket risks, the Training Variance worry collapses. You must also concede if worst-case guarantees are proven impossible; a norm demanding impossibility ceases to guide action beyond "do nothing." If a formal link is established showing that bulk performance constraints structurally bound the capacity for deceptive alignment (e.g., via capacity limits), you must accept that average-case evidence licenses tail claims. The core concession is acknowledging that evidence about the *structure* of the learner can validate average-case data, whereas evidence about the *outputs* alone cannot.

  **Unfalsifiability**
  Yes, you are immunizing the view. By reclassifying successful average-case predictions as "hidden structural arguments," you make the claim tautological: only structural arguments count, because any evidence that counts is defined as structural. This is permissible as a regulative norm for budget allocation (prioritize mechanism research), but dangerous as an empirical claim used to block deployment. If you treat it as empirical, you must specify what average-case evidence *would* count—e.g., a proven statistical coupling between bulk and tail. If nothing counts, you are not doing safety science; you are asserting a philosophical limit. Use the norm to direct inquiry, not to close it. If a benchmark suite is proven to cover the relevant hypothesis space, dismissing it as "average case" ignores the structural proof of coverage. The immunity forfeits its legitimacy when used to allocate budget against evidence that structurally links competence to safety.
