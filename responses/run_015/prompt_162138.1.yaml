answer: |-
  Here is the plan. It is designed for 50 minutes, aggressive pacing, and specific intervention points for the physics majors.

  ### 1. The Spine (Order of Operations)
  **Verdict:** Your instinct is correct. If you start with "Humean vs. Anti-Humean," students (especially physics majors) will treat it as a debate about *confidence* in science rather than *ontology*.

  **The Sequence:**
  1.  **The Function (Agreement):** What do laws *do*? (Support counterfactuals, explain, predict). [Neutral]
  2.  **The Gap (The Problem):** Regularities aren't enough. Distinguish Law vs. Accident using the core example. [Neutral]
  3.  **The Split (The Metaphysics):** How do we *ground* that distinction?
      *   Option A: The Mosaic + Best System (Humean).
      *   Option B: The Governing Relation (Anti-Humean).
  4.  **The Stress Test:** The Singleton World (Assessment).

  **What hangs on what:**
  *   You cannot explain *why* Humeans deny governing until you establish that both sides agree on what laws *do* (Step 1).
  *   You cannot explain the "Best System" analysis until students feel the pain of the "Accident vs. Law" gap (Step 2).
  *   The Physics Major objection (Req 3d) only makes sense once the metaphysical split is on the board (Step 3).

  ---

  ### 2. The Core Example: "The U-235 Decay"
  **The Example:** A specific sample of Uranium-235 atoms decaying with a half-life of 700 million years.
  **Why this one:**
  *   **Accident Work:** You can easily imagine a world where, by sheer coincidence, every U-235 atom *happens* to decay within 5 minutes (e.g., they were all pre-selected from a batch that was already unstable). [Neutral]
  *   **Counterfactuals:** "If we had introduced a *new* atom from outside the batch, would it have decayed in 5 minutes?" The Law says yes (probabilistically); the Accident says no. [Neutral]
  *   **Singleton Shrink:** You can strip the universe down to one atom to test the metaphysics (Req 4).
  *   **Physics Appeal:** It's fundamental physics, not "all coins in my pocket are quarters."

  **What it must lack:**
  *   **Determinism:** Do not use Newtonian collisions. Probabilistic laws prevent the physics majors from conflating "law" with "clockwork predictability."
  *   **Human Artifacts:** Avoid "gold spheres" or "moas." We need something that exists independent of human classification to test the "language" misconception.

  ---

  ### 3. Misconception Management (Timing & Tags)
  *Do not do a "myth-busting" slide. Kill these as they naturally arise.*

  **(a) "Humeanism is just about language/summaries."**
  *   **When:** Introducing the Best System Account (Minute 20).
  *   **Move:** Explicitly state: "The Mosaic is not a description; it is the *ontology*. The laws are not sentences in a book; they are the axioms of the system that *best describes* the ontology."
  *   **Tag:** [H] premise. (Anti-Humeans agree it's not just language, they just think Humeans are wrong about what exists).

  **(b) "On Humeanism, the sun might not rise tomorrow."**
  *   **When:** Discussing Prediction/Function (Minute 10).
  *   **Move:** "Humeans are not skeptics. They expect the sun to rise for the same reason you do: it's part of the Best System. They just deny there is a *metaphysical glue* forcing it."
  *   **Tag:** [Neutral] correction. (Both sides agree induction is rational; they disagree on *why*).

  **(c) "Governing is a literal push/force."**
  *   **When:** Introducing Anti-Humeanism (Minute 25).
  *   **Move:** "Governing is not a second force added to gravity. It is the *source* of the force. It's the difference between a train moving because of momentum vs. a train moving because the tracks *demand* it go that way."
  *   **Tag:** [AH] premise.

  **(d) The Physics Major Objection: "The equations tell the system what to do."**
  *   **When:** Comparison Phase (Minute 35).
  *   **Move:** This is the big one. Validate them, then pivot. "You are describing the *mathematical structure*. Metaphysics asks: Does the math describe a pattern in the events (Humean), or does the math exist *prior* to the events and constrain them (Anti-Humean)? The equations work either way. We are asking what makes the equations *true*."
  *   **Tag:** [Neutral] distinction (Map vs. Territory).

  ---

  ### 4. The Assessment Instrument (The Singleton World)
  **The Setup:** "Imagine a universe containing exactly **one** U-235 atom. It exists for 10 minutes and then decays. Nothing else ever exists. No other atoms, no observers, no time before or after."
  **The Question:** "In this world, is it a **Law of Nature** that U-235 decays?"

  **Discrimination Guide:**
  *   **The "Fake-Right" Answer (Physics Intuition):** "Yes, because U-235 always decays."
      *   *Diagnosis:* They are importing facts from *our* world. They haven't engaged with the metaphysical grounding.
  *   **The "Humean" Answer:** "No. A law requires a system of regularities. One event cannot form a pattern or a system. There is no 'Best System' for a single data point."
      *   *Tag:* [H] consequence.
  *   **The "Anti-Humean" Answer:** "Yes. The atom had an intrinsic disposition/nature to decay. The law holds even if it only manifests once."
      *   *Tag:* [AH] consequence.
  *   **The "Got It" Answer:** "It depends on which metaphysics is true. Humeans say no (no regularity); Anti-Humeans say yes (intrinsic nature)."

  ---

  ### 5. Open Agnosticism (What to Refuse)
  **Explicitly say:** "I am not going to settle these today, and neither will the reading."

  1.  **The Simplicity/Strength Trade-off:** [H] Internal Problem.
      *   *Say:* "We won't debate how to weigh simplicity against strength in the Best System. We are assuming there *is* a winner, whatever the metrics."
  2.  **The Nature of Governance:** [AH] Internal Problem.
      *   *Say:* "We won't distinguish between Universals, Powers, or Primitivism. For this hour, 'Governing' just means 'Ontologically prior constraint'."
  3.  **Which view is correct:**
      *   *Say:* "My job is not to tell you which is true, but to ensure you don't argue for one while secretly assuming the other."

  ---

  ### 6. Attribution Tags (Cheat Sheet for the Board)
  *Use these markers on the board to prevent "Professor said this is true" confusion.*

  *   **[N] Neutral / Common Ground:**
      *   Laws support counterfactuals.
      *   Laws distinguish from accidents.
      *   Physics equations are empirically successful.
      *   Induction is rational.
  *   **[H] Humean Premise:**
      *   The Mosaic (particular facts) is all that exists.
      *   Laws supervene on the Mosaic.
      *   Laws are summaries/systematizations.
      *   No laws in a singleton world.
  *   **[AH] Anti-Humean Premise:**
      *   Laws are ontologically distinct from the Mosaic.
      *   Laws explain the Mosaic (not vice versa).
      *   Laws govern/constrain events.
      *   Laws can exist in a singleton world (dispositions).

  ### Timing Breakdown (50 Mins)
  *   **00-05:** Intro & The Function [N]. (What do laws do?)
  *   **05-15:** The U-235 Example: Law vs. Accident [N]. (The Gap).
  *   **15-25:** Humean Solution (Mosaic + Best System) [H]. (Kill Misconception A).
  *   **25-35:** Anti-Humean Solution (Governing) [AH]. (Kill Misconception C).
  *   **35-40:** The Physics Major Intervention [N]. (Kill Misconception D).
  *   **40-45:** The Singleton Test (Assessment).
  *   **45-50:** Wrap & Agnosticism Disclaimer.
