      *   *Law:* They *must* have -e.
      *   *Counterfactual:* If we created a new one, would it have -e?
      *   *Singleton:* If only one electron existed, would it have -e by law?
      *   *Actually, let's stick closer to the prompt's "decay" hint for the end, but use something else for the hour.* Let's use **"All spheres of enriched Uranium-235 larger than 10cm explode."**
      *   *Why:* It's physical. It has a threshold.
      *   *Accident:* "All spheres of *Gold* larger than 10cm..." (Wait, prompt says avoid gold spheres).
      *   *Okay, let's use **"All matches in this box light when struck."** vs **"All matches everywhere..."**
      *   *No, needs to be physics-y for the majors.*
      *   *Let's go with **"Conservation of Energy in Closed Systems."**
      *   *Accident:* "Conservation of Energy holds in *this lab*."
      *   *Counterfactual:* "If we opened the system..."
      *   *Singleton:* "If there was only one particle..."
      *   *Okay, the "Single Atom Decay" is the assessment. Let's use **"The Inverse Square Law of Gravity"** as the main example.*
      *   *Accident:* It holds for all planets *observed so far*.
      *   *Counterfactual:* If there was a planet twice as far...
      *   *Singleton:* If there was only one planet and one sun...
      *   *Decision:* **The Inverse Square Law (Gravity).** It's familiar, allows for "accidental regularity" (coincidence of data), allows counterfactuals (unobserved distances), and allows singleton reduction (one sun, one planet).

      *Wait, re-reading Requirement 2:* "Something that does the accidental-generalization work, can be perturbed counterfactually, and can also be shrunk down to a single instance."
      *   *Gravity is good.* But let's make it simpler. **"All charged particles repel like charges."**
      *   *Accident:* All observed ones do.
      *   *Counterfactual:* If we made a new one...
      *   *Singleton:* If only two existed in the universe...
      *   *Let's go with the **"U-235 Decay"** for the whole hour.* It fits the assessment question perfectly.
      *   *Law:* U-235 has a half-life of 700M years.
      *   *Accident:* All U-235 atoms *in this room* decay within 1 hour (because they were pre-selected).
      *   *Counterfactual:* If I brought in a new atom from outside...
      *   *Singleton:* If only one U-235 atom existed in the universe...
      *   *Yes. Stick with Radioactive Decay.* It unifies the hour and the assessment.

      *Refining Misconception Timing:*
      *   (a) Humean = Language: Address when introducing Best System.
      *   (b) Induction/Sunrise: Address when discussing prediction utility.
      *   (c) Literal Push: Address when introducing Governing.
      *   (d) Physics Equations: Address in the comparison phase.

