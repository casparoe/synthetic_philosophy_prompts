  2.  **Deconstruct the "Spine" (Requirement 1):**
      *   *User's Instinct:* Separate (1) What a law *is* (ontology), (2) What we *do* with them (epistemology/function), (3) Law vs. Accident (the criterion).
      *   *Evaluation:* This is excellent. The biggest confusion students (especially physics majors) have is conflating *how we find* laws with *what laws are*. Physics majors often think "predictive success = lawhood." Humeans and Anti-Humeans agree on the *function* (mostly) but disagree on the *ground*.
      *   *Refinement:* The order should be: Function (agreement) -> The Problem of Accidents (the gap) -> The Two Solutions (Humean vs. Anti-Humean). This prevents the "explanatory job settles metaphysics" error.

  3.  **Select the Core Example (Requirement 2):**
      *   *Constraints:* Needs to handle accidents, counterfactuals, single instances. Avoid "Gold Spheres" (too abstract/static).
      *   *Idea:* A specific physical interaction. Maybe a collision? Or a decay?
      *   *Selection:* **The "Uranium-235 Critical Mass" scenario.**
          *   *Why:* It's physical (appeals to physics majors), involves a threshold (law-like), has clear counterfactuals (if I added more, it would explode), and can be shrunk (one atom vs. a sphere).
