      *   *Strategy:* Use **"The 90-Degree Particle Scatter"** for the main hour. It's cleaner for "law vs accident" than decay (which is probabilistic, complicating the "law" definition for 2nd years). Use the **Singleton Atom** for the assessment. It's a distinct enough variation to test understanding without being a totally new concept.
