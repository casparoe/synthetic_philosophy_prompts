  Dear Friend,

  I am writing to you regarding your upcoming feature on Al-Ghazālī and occasionalism because I believe you deserve an honest assessment of the philosophical ground you are standing on before you attempt to build a comparison with modern science. I must say plainly that your framing rests on a premise that many philosophers would consider confused, specifically the idea that Al-Ghazālī's argument can be separated cleanly from its theological commitments while still retaining its explanatory power. For Al-Ghazālī, the denial that fire necessarily burns cotton is not merely an epistemological caution about what we can observe; it is an ontological claim grounded in the absolute sovereignty and direct agency of God. The regularity of fire burning cotton is preserved only because God habitually wills it to happen in that sequence. If you remove the Divine Will to make the theory palatable for a secular philosophy of science, you remove the very mechanism that sustains the regularity, leaving you with a skepticism that offers no reason why the future should resemble the past other than brute fact. Furthermore, the list of desiderata you wish to impose on an adequate theory of causation contains internal tensions that suggest they cannot be jointly satisfied without smuggling metaphysical necessity back in through the side door. You are asking for a theory that denies necessary connection yet preserves robust counterfactuals and distinguishes law from accident without rendering patterns causally inert. This is the very knot that David Hume tied and that philosophers have been struggling to untie for centuries, often concluding that you must sacrifice one desire to save the others.

  However, since your goal is to write a feature for an audience that follows science and ideas closely, mapping out these tensions is likely more valuable than pretending they do not exist. Therefore, I will outline the desiderata and score the competing views not as a successful framework, but as a demonstration of where the philosophical pressure points lie. The first requirement is that any theory taking Al-Ghazālī seriously must preserve observed regularities. The motivating case here is simple: science works. Fire does burn cotton, almost always. If a theory suggests that the next instance might be unconnected to the last without any reason, it undermines the practice of prediction. For predictive science, this is non-negotiable; for descriptive metaphysics, it is also heavy weighting, though a metaphysician might tolerate more skepticism than a physicist. The second requirement concerns counterfactual judgments. You ask that the theory license or deny judgments like if this cotton were brought near fire, it would burn. The tension here is sharp. Al-Ghazālī's occasionalism technically denies this because the burning depends on God's will at that specific moment, not on the nature of the fire. A secular theory that denies necessity struggles to justify why the counterfactual holds at all. For predictive science, licensing counterfactuals is non-negotiable because intervention relies on them. For metaphysics, it is negotiable if one accepts a Humean mosaic of events, but it leaves the theory feeling thin.

  The third requirement is perhaps the most difficult: the theory must treat the distinction between habitual conjunction and accidental correlation without smuggling back in metaphysical necessity. The motivating case is the difference between the sun rising every day and a person always wearing a red hat on Sundays. Both are regular, but only one feels lawlike. Al-Ghazālī solves this by appealing to God's consistent habit, which is a form of necessity grounded in Divine constancy rather than natural essence. A secular theory has no such anchor. It must distinguish law from accident using only the patterns themselves, which risks circularity. This is non-negotiable for both metaphysics and science, as science aims to discover laws, not just list correlations. The fourth requirement asks whether the theory can handle the asymmetry between explaining a particular instance of burning and explaining the general pattern without rendering the pattern causally inert. If fire does not cause burning, but is merely the occasion for God to cause burning, then the general pattern of fire burning cotton is inert in the sense that the fire itself does no work. This is acceptable for Al-Ghazālī because God does the work, but for a secular philosophy of science, rendering natural patterns causally inert is disastrous. It makes the pattern non-negotiable for science but potentially negotiable for a metaphysics that prioritizes divine agency over natural efficacy.

  When we score the three views against these demands, the fractures in your proposed framework become visible. A strict occasionalist view, faithful to Al-Ghazālī, scores perfectly on preserving observed regularities and distinguishing habit from accident, but only because it leans entirely on the theological commitment you wished to set aside. It fails the counterfactual test in a secular context because without God's promised habit, there is no guarantee of the outcome, and it explicitly renders natural patterns causally inert, which satisfies the metaphysical claim but violates the needs of predictive science. A Humean regularity theory attempts to secularize this by saying causation is nothing more than constant conjunction. It preserves regularities well enough for science but struggles profoundly with counterfactuals, as it cannot say what would happen in a non-actual scenario without referencing laws that it claims are just summaries of events. It also fares poorly on distinguishing habit from accident without circularity, often relying on systematization that looks suspiciously like a surrogate for necessity. Finally, a modern interventionist framework, which defines causation in terms of what happens when we manipulate variables, scores highly on counterfactuals and preserving regularities for predictive science. However, it fails your specific constraint regarding Al-Ghazālī because it implicitly assumes that there are stable structures to manipulate. It smuggles in a form of necessity by presupposing that the background conditions remain invariant, which is precisely the kind of natural necessity Al-Ghazālī denied. It treats patterns as causally potent, which satisfies science but contradicts the occasionalist premise.

  The upshot for your feature is that you cannot have it both ways. If you take Al-Ghazālī's denial of necessity seriously, you must accept that natural patterns are causally inert and that counterfactuals are grounded in something outside nature, traditionally God. If you want a secular philosophy of science that supports intervention and prediction, you must reintroduce a form of necessity or stability that Al-Ghazālī would reject. The confusion in your framing lies in expecting a secularized occasionalism to do the work of natural realism without accepting the ontological costs. I suggest you pivot your feature to highlight this trade-off rather than trying to resolve it. Show your readers that the comfort of modern science relies on assumptions about the stability of nature that are philosophically fragile, and that Al-Ghazālī's challenge remains potent precisely because it exposes this fragility. Do not present the desiderata as a checklist that a successful theory must pass, but as a set of competing values where choosing one means sacrificing another. This will make for a more honest and intellectually rigorous piece than attempting to force a synthesis that the history of philosophy suggests is impossible. I hope this clarity serves your writing well, as the tension itself is the story worth telling.
