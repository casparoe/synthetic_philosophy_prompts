answer: |-
  **MEMORANDUM**

  **TO:** International Fieldwork Ethics Panel
  **FROM:** Graduate Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Memo: Water Use and Diarrhoea Survey (Protocol #4492)

  **Recommendation**
  Move to approve the protocol conditional on three modifications: (1) the consent script must include a private, non-verbal opt-out mechanism for individual household members executable after elders depart; (2) the PI must submit a risk-mitigation plan for retaliatory harm within 14 days; and (3) final clearance is contingent on a pilot test confirming the safety of the opt-out mechanism.

  **Rationale: The Institutional Affirmation Gap**
  This decision rests on explicitly distinguishing *moral permissibility* from *institutional authorization*. Much of our deadlock stems from conflating three distinct claims: (i) that the elders' procedure is morally right; (ii) that we are epistemically positioned to judge it wrong; and (iii) that our university should attach its name to it. This memo rejects the inference that (i) or (ii) dictates (iii). We are not ruling on the universal morality of community consent (i), nor claiming cultural ignorance (ii). We are deciding whether *our institution* can bear the liability of complicity (iii). We can acknowledge the local procedure as socially functional without affirming it as ethically sufficient for our sponsorship. This closes the "affirmation gap": we are not validating the elders' authority, merely navigating it to prevent greater harm.

  **Normative Arbitrage and Intracommunity Dissent**
  The PI faces conflicting norms from the university, funder, NGO, and participants. If she selects the framework most convenient to fieldwork access, she engages in normative arbitrage—choosing her own appraiser. To block this without imposing ethical imperialism, we apply a **Maximum Protection Principle**: when frameworks conflict, the norm offering the highest safeguard to the most vulnerable party governs, unless those parties can safely waive it.

  This addresses the intracommunity disagreement. "Community consent" via elders is often elite consent. If women privately desire individual consent but are silenced by public hierarchy, the "community framework" is contested. Ignoring this silences the vulnerable under the guise of cultural respect. Our conditions require the PI to create a channel for that silent dissent. If women cannot safely opt out, the "community consent" is coercive, and our Maximum Protection Principle forbids us from proceeding. The pilot test (Condition 3) verifies whether safe dissent is actually possible.

  **The Case for Rejection**
  Those urging rejection argue that conditioning approval on a private opt-out is naive. In tight-knit rural districts, privacy is often illusory; a woman skipping a question or marking a private form may signal dissent to her husband or the elders later, inviting domestic retaliation. By approving this, the panel may not be enabling research but rather laundering coercion through university bureaucracy. We become complicit in harm we claimed to prevent, providing the PI with ethical cover to enter a space where our safeguards cannot physically reach. This risk of unintended consequence is the strongest argument against approval.

  **Confidence and Load-Bearing Claim**
  **Confidence Level:** Moderate.
  **Load-Bearing Claim:** The recommendation hinges entirely on the empirical claim that a *private, non-verbal opt-out mechanism* can be implemented without exposing participants to retaliation. If private dissent cannot be safely signaled—even with non-verbal cues—then the Maximum Protection Principle fails, and the protocol must be rejected regardless of the scientific value. This feasibility assumption is the single point of failure; if the pilot test proves unsafe dissent is inevitable, the approval must be revoked.
