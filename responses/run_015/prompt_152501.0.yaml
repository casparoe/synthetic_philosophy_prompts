      *   **Ripper and the Intentionality of Murder:** Analyze Ripper. He is the clearest case for Anscombe. He intentionally targets civilians to save his fluids. This is straightforward murder.
      *   **Turgidson and the Utilitarian Mask:** Analyze the War Room scene (casualty estimates). Turgidson argues "foreseen" deaths are acceptable costs. Anscombe argues if you proceed knowing they will die to achieve victory, you intend them. The film satirizes this by showing the casualness of the calculation (the "big board").
      *   **The Doomsday Machine and the Erasure of Agency:** This is the hardest part for Anscombe. The machine automates the "intention." It removes the *possibility* of repentance or last-minute change. It crystallizes a conditional intention into an absolute fate. Anscombe's framework requires a moral agent; the machine replaces the agent with a mechanism.
