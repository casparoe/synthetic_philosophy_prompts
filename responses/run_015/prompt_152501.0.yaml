      *   *Ripper:* He fits Anscombe's "murderer" profile perfectly. He *intends* to start a war to preserve "precious bodily fluids." He uses the military apparatus as a means. Anscombe would condemn him unequivocally.
      *   *Turgidson/Strangelove:* They represent the utilitarian calculus Anscombe hates. Turgidson talks about "acceptable losses" (20 million killed). Anscombe would say this *is* the murder of 20 million people, intended as a cost of doing business.
      *   *The Doomsday Machine:* This is the crux. It removes human intention entirely. It is automatic retaliation. Anscombe relies on *human action* being morally evaluable. If a machine kills, is it murder? Anscombe would say the *builders* intended the killing. The machine makes the "intention" permanent and unrevocable.
