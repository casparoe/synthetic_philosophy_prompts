      *   *Distinction:* Intention vs. Foreseen Consequence (Doctrine of Double Effect - though Anscombe is critical of its misuse). For Anscombe, if you choose a policy *because* it kills civilians to break morale, you intend their death. If civilians die as an unavoidable side effect of a legitimate military target, it *might* be permissible (though she is strict on proportionality).
