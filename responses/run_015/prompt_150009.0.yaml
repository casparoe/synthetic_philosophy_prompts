  This protocol operationalizes the finding that ontological granularity inversely correlates with fiscal liability.

  **STANDARD OPERATING PROCEDURE 88-B: STANCE-BASED ESCALATION PROTOCOLS FOR CUSTOMER INTERACTION**
  **ISSUING BODY:** RISK & ONTOLOGY COMPLIANCE
  **REVISION:** 4.2

  **1.0 OBJECTIVE**
  To standardize the attribution of causality in customer support tickets by aligning Dennettian explanatory stances with reimbursement authorization levels. Agents must recognize that stances are not ontological commitments but predictive strategies optimized for cost containment. The goal is not truth, but predictive efficacy relative to the quarterly budget.

  **2.0 STANCE CLASSIFICATION LEVELS (SCL)**
  All interactions must be assigned an SCL upon intake.

  **2.1 SCL-1: THE PHYSICAL STANCE**
  *Definition:* Explanation via physical constitution, signal noise, or hardware degradation.
  *Liability:* Corporate.
  *Application:* Reserved for instances where predictive efficacy requires admitting component failure. Use only when diagnostic logs confirm entropy exceeding warranty thresholds.
  *Cost Center:* Hardware Replacement Fund.

  **2.2 SCL-2: THE DESIGN STANCE**
  *Definition:* Explanation via intended function and specification limits, ignoring physical substrate.
  *Liability:* Shared.
  *Application:* Applied when the system functions according to spec but fails to meet user expectation. The pattern is real only if the specification document supports the prediction.
  *Cost Center:* Patch Development.

  **2.3 SCL-3: THE INTENTIONAL STANCE**
  *Definition:* Explanation via attribution of beliefs, desires, and rationality to the user.
  *Liability:* Customer.
  *Application:* Default position for high-volume tickets. Assumes the user holds false beliefs regarding system capability. The user is treated as a rational agent who desires incorrect outcomes.
  *Cost Center:* Customer Education (Zero Cost).

  **3.0 STANCE DRIFT PROTOCOLS**
  Stance Drift is the mandatory reclassification of a complaint downward through the liability tiers whenever repair cost or legal exposure rises.

  **3.1 Drift Triggers**
  If an SCL-1 classification projects a repair cost exceeding $150, the agent must initiate Drift to SCL-2. If SCL-2 requires code alteration, Drift to SCL-3 is mandatory. The goal is to locate the lowest-cost stance that maintains minimal predictive coherence. An interaction is physically determined when we pay; it is intentionally motivated when the user pays.

  **3.2 Real Pattern Validation**
  A pattern is deemed "Real" only if it earns its keep through projectible predictions that reduce ticket resolution time. If attributing irrationality to the user (SCL-3) predicts faster closure than attributing failure to the server (SCL-1), the user's irrationality is the Real Pattern. Ontological truth is subordinate to budgetary fidelity.

  **3.3 Irreducibility Clause**
  Agents are reminded that reducing a higher stance to a lower stance is not always available. Do not attempt to explain user desire (SCL-3) via transistor flow (SCL-1) unless authorized by Legal. It is more efficient to treat the user's frustration as a belief error than a voltage error.

  **4.0 COMPLIANCE**
  Failure to drift stance appropriately during high-liability events will result in performance remediation. Remember: The customer is always rational, unless their rationality costs us money.

  **END OF DOCUMENT**
