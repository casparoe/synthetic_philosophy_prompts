          *   *Clerk Writing:* If the clerk wrote the 3 applications for B, it suggests lower literacy *or* a specific bureaucratic hurdle where the clerk intermediated. But combined with stamped paper sales, literacy is less likely the sole blocker.
          *   *Missing Volumes (1897-99):* This kills trend analysis. You cannot claim a decline or rise across this period. It creates a "black hole."
