answer: |-
  The stalemate you describe arises because your translator is operating under a theory of translation designed for information transfer, while you are working within a theory of artistic ecology. Hofstadter's *Le Ton beau de Marot* is a delightful diversion, but his proposal of eighty versions is a surrender to the problem rather than a solution; it offers a museum of possibilities where you need a functioning engine. To win this argument, you do not need to assert authority; you need to demonstrate that the translator's proposed solution fails the specific mechanical requirements of your text. What follows is a specification for a theory of translation under formal constraint, designed to adjudicate cases where the form is not merely decorative but constitutive of the meaning.

  The first desideratum concerns the unit of translation. In standard prose, the unit is typically the sentence or the paragraph. In constrained writing, particularly where an acrostic or a fixed meter is involved, the unit of translation must be the constraint set itself. A theory that treats the constraint as secondary to the semantic content collapses the distinction between a poem and a paraphrase. Therefore, it is a non-negotiable requirement that the translation recognises the constraint as a primary carrier of meaning. If the original poem uses an acrostic to name the dead sister, the translation must encode the name in the target language. If the target language lacks the resources for an exact equivalent—for instance, if German feminine rhymes are scarce compared to French—the theory must demand an equivalent structural burden, not a release from burden. Dropping the acrostic for alliteration is not a compromise; it is a deletion of data.

  This leads to the distinction between preservation and compensation. Popular theory often suggests these are equivalent achievements: if you lose a rhyme here, compensate with rhythm there. In your novel, this is false. Preservation and compensation are different categories of achievement. Compensation moves the effect; preservation keeps it *in situ*. Because your poem degrades over the course of the narrative—lines vanish, rhymes break—the location of the formal feature is semantic work. If the rhyme breaks in the original, the translation's rhyme must break in the same place. A compensated rhyme that remains intact elsewhere fails the narrative function. Therefore, a theory of translation for this context must prioritise structural vulnerability over aesthetic completeness. The poem must be capable of being subtracted from in the same places. A version that only works when intact is useless because the novel's point is that it comes apart.

  Regarding footnotes, the specification is strict: in immersive fiction, a footnote explaining a formal feature constitutes a failure of translation. A footnote turns an aesthetic experience into an data point. It asks the reader to stop experiencing the loss and start analysing the translator's decision. While acceptable in academic editions, in a novel where the reader must feel the narrator's forgetting, a footnote is a breach of contract. It tells the reader, "The magic isn't working here, but imagine it was." This is preferable only to silence, but inferior to a functional equivalent. Consequently, a translation that requires a footnote to justify its form has not solved the problem; it has documented its inability to solve it.

  The question of identity—whether the German lullaby is your lullaby, a new poem, or an imitation—must be resolved functionally rather than ontologically. It is not the "same" poem in a bibliographic sense, but it must be the same poem in a narrative ecology. It must occupy the same weight, demand the same attention, and suffer the same degradation. If the original is a lullaby, the translation must be singable. The German publisher's request for singability is not an extra burden; it is a validation of your original intent. If the Italian publisher suggests prose, they are suggesting a different book. The theory must assert that the translation owes its primary allegiance to the monolingual target reader, not the bilingual scholar. The monolingual reader must experience the same friction, the same memory gaps, and the same structural revelations without needing to check the original. If the effect relies on knowing what was lost, the translation has failed.

  Here we encounter the trilemma that governs all constrained translation: you cannot jointly satisfy Preserve Every Formal Feature, Preserve Every Semantic Feature, and Produce a Poem That Works Naturally in the Target Tradition. Usually, one must yield. However, your case introduces a fourth variable: Narrative Integrity. When Narrative Integrity is the priority, Naturalness must be the first to suffer. A lullaby that feels slightly uncanny in German is preferable to one that flows freely but loses the acrostic name of the dead sister. The single requirement that does the most damage to popular theories of translation is this: The translation must be breakable in exactly the same places as the original. This destroys the "fluent-invisible-translator" position, which seeks to smooth over cracks, and it undermines functionalist approaches that prioritise the target culture's norms over the source text's architecture.

  To score the usual stances against this specification, we can observe where they fail your specific case. Literalism fails because it cannot accommodate the singability requirement or the grammatical shifts needed for the acrostic. Dynamic equivalence fails because it prioritises the reader's emotional response over the structural mechanism of forgetting. The fluent-invisible position fails because it hides the constraint rather than enacting it. Thick translation with notes fails because it intellectualises the loss rather than dramatising it. Imitation is the closest fit, but only if the imitation includes the degradation mechanism. Skopos-style approaches are viable only if the "purpose" is defined as preserving the narrative function of memory loss, rather than merely selling a readable book.

  | Stance | Viability for Your Case | Reason for Failure/Success |
  | :--- | :--- | :--- |
  | **Literalism** | Low | Cannot accommodate singability or acrostic grammar. |
  | **Dynamic Equivalence** | Low | Prioritises effect over structural mechanism. |
  | **Fluent/Invisible** | Fail | Hides the constraint; prevents the "breaking" effect. |
  | **Thick Translation** | Fail | Footnotes intellectualise loss; do not enact it. |
  | **Imitation** | High | Only if it includes the degradation mechanism. |
  | **Skopos/Functionalist** | Conditional | Viable if "purpose" includes structural vulnerability. |

  Ultimately, the theory must deliver a text that stands as a structural analogue, not just a semantic mirror. You are correct that the book falls apart if the poem stops having a shape. The shape is the evidence of the ghost. If the translator removes the acrostic, she is not translating the poem; she is translating the description of the poem. Your argument should not rest on "it has to feel the same," which is subjective, but on "the mechanism of forgetting must be reproducible in the target language," which is technical. The audiobook requirement aids you here: a free verse poem with a footnote cannot be set to music in a way that reflects the missing rhyme. A singable lullaby requires meter; a meter requires choices; those choices must include the possibility of failure.

  Do not accept the footnote. It is an admission that the target language is incapable of the work, which is rarely true, only that the translator is unwilling to struggle with the constraint. Insist that the unit of translation is the constraint set, that the poem must be subtractable, and that the monolingual reader's experience of the gap is the only metric that matters. If the German language cannot sustain the feminine rhyme, find a different constraint that burdens the line equally and can be similarly broken. But do not let them smooth it over. A smooth lullaby does not wake the dead; only a broken one does.
