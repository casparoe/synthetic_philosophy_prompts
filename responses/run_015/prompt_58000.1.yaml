  Based on the pattern of your roommate's positions, here is a breakdown of her likely logic, a prediction on the surrogacy case, and a strategy to test her consistency.

  ### The Prediction
  **Verdict: She will likely want to BAN the boutique surrogacy.**

  **Why?** Even though the "boutique" conditions (financial security, lawyers) address the economic coercion argument, her ban on **kidney sales** is the strongest signal. That position is usually rooted in the idea that the human body (or specific biological functions) should not be commodified, regardless of consent or payment. Surrogacy is much closer to kidney sales (biological risk, bodily use) than it is to ticket scalping (property) or line-standing (labor/time).

  ---

  ### Three Rules That Fit Her Logic
  Here are three distinct ethical frameworks that all explain her past positions but diverge on the surrogacy case.

  #### 1. The "Vulnerability & Coercion" Rule
  *   **The Logic:** Markets should be banned when one party is desperate or vulnerable, making true consent impossible. We ban kidney sales because sellers are usually poor; we ban price gouging because buyers are trapped by disaster; we ban vote selling because it undermines political equality. We *allow* scalping and line-standing because fans and clients are not desperate, and the workers are choosing easy labor.
  *   **Application to Surrogacy:** **ALLOW.**
      *   *Reasoning:* The surrogates are "financially secure," have independent legal counsel, and are not acting out of desperation. The coercion element is removed.
  *   **Weakness:** It struggles to explain why she bans vote selling (which can happen between wealthy parties) or why she might object to a rich person selling a kidney to another rich person.

  #### 2. The "Bodily Integrity" Rule
  *   **The Logic:** You cannot sell parts of the human body or core biological functions. Votes are an extension of civic personhood; kidneys are literal organs; price gouging exploits bodily survival needs. Tickets and line-standing involve property and time, which are external to the self.
  *   **Application to Surrogacy:** **BAN.**
      *   *Reasoning:* Pregnancy is a biological function involving significant bodily risk and intimacy. Even with high pay, renting a womb commodifies the body in a way that violates human dignity, similar to selling a kidney.
  *   **Weakness:** It has a hard time explaining the price gouging ban (which is about economics, not anatomy) unless you stretch the definition of "survival needs" to be part of bodily integrity.

  #### 3. The "Necessity vs. Luxury" Rule
  *   **The Logic:** Markets are forbidden when they allocate essential goods required for life or citizenship. Gas and shelter after a hurricane are survival needs; voting is a civic necessity; kidneys are health necessities. Concert tickets and line-standing services are luxuries; inequality in luxuries is acceptable.
  *   **Application to Surrogacy:** **ALLOW.**
      *   *Reasoning:* Having a child is not a biological survival necessity for the parents, nor is being a surrogate a survival necessity for the worker. It is a discretionary service, like a luxury concert ticket.
  *   **Weakness:** It doesn't fully capture the moral revulsion people often feel about kidney sales even if the buyer is dying (necessity) and the seller is rich (no coercion).

  ---

  ### The Distinguishing Case: Selling Hair
  To figure out which rule actually drives her, ask her about **selling human hair for cash.**

  *   **The Scenario:** A financially secure woman sells her long, healthy hair to a wig company for $5,000. It grows back. It is low medical risk.
  *   **How it separates the rules:**
      *   **Vulnerability Rule:** **ALLOW.** (She is financially secure, not coerced).
      *   **Necessity Rule:** **ALLOW.** (Hair is not essential for survival).
      *   **Bodily Integrity Rule:** **BAN.** (It is still a part of the human body being sold for cash).

  **How to use this:**
  If she says selling hair is **fine**, then her objection to surrogacy is likely about **risk or necessity**, not just "body selling." If she says selling hair is **wrong**, then she is a strict **Bodily Integrity** theorist, and she *must* ban the surrogacy regardless of how much money or legal protection is involved. This forces her to admit whether her logic is about *protecting the poor* or *protecting the body*.
