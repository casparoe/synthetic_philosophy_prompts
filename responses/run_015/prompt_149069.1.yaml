answer: |-
  Here is the blunt feedback and the teaching plan.

  ### Part 1: The Critique (Read this first)

  **Your AI example is risky.**
  "Knowing how to prompt" vs. "Knowing that it uses transformers" is too intellectual. Both sides of that example feel like "knowing that."
  *   **Why:** Prompting is often just memorizing rules ("If I write 'act as,' the output changes"). That sounds like propositional knowledge (facts/rules).
  *   **The Risk:** If you start here, students will think *everything* is just "knowing that" disguised. They will argue that "knowing how" is just having a really big list of "knowing that" rules in your head. This is exactly the misconception (The Intellectualist Legend) you are trying to avoid.
  *   **The Fix:** Use a **physical skill** for the primary example (riding a bike, swimming, playing tennis). It is viscerally obvious that reading a manual on hydrodynamics (Knowing That) does not equal floating (Knowing How). Use the AI example *second*, as a challenge: "Now that we get the distinction, does it apply to AI?"

  **Your framing on "Skills vs. Facts" is the danger zone.**
  If you define it as "Skills vs. Facts," students will think they are just two buckets in the same closet. Ryle's point is stronger: They are different *types* of closets. You can possess all the facts and still lack the ability. You must emphasize the **gap** between them.

  **On AI Consciousness:**
  Do not let the discussion drift into "Does the AI *really* know how?" That is Philosophy of Mind (consciousness/intentionality), not Epistemology (knowledge). If a kid asks, "But does the AI understand?" shut it down: "We aren't asking if the machine feels, we are asking how *we describe* the machine's function."

  ---

  ### Part 2: The Teaching Plan (45-60 Minutes)

  **Goal:** Students will distinguish between propositional knowledge (facts/truths) and procedural knowledge (abilities/dispositions) and identify cases where one exists without the other.

  #### 1. The Hook: The Swimming Manual (10 Mins)
  *   **Action:** Don't define anything yet. Ask: "Who here has read the entire rulebook for a sport but is terrible at playing it?" (Soccer, Mario Kart, etc.).
  *   **Scenario:** Present "The Theorist." Imagine a person who has memorized every physics equation regarding buoyancy, fluid dynamics, and muscle contraction. They can pass a written test on swimming with 100%.
  *   **Question:** "If we throw The Theorist into the deep end, do they swim?"
  *   **Expected Answer:** No, they drown.
  *   **Point:** They have the *knowledge*, but they lack the *ability*. This cracks the idea that knowledge is just "facts in the head."

  #### 2. Defining the Terms (10 Mins)
  *   **Introduce Ryle (briefly):** Gilbert Ryle, 1949. He called the mistake of thinking "Knowing How" is just secret "Knowing That" the **Intellectualist Legend**.
  *   **Definitions (Write on board):**
      *   **Knowing That (Propositional):** Facts, truths, theories. Can be written down. Can be True/False. (e.g., "That gravity exists," "That the capital is Paris").
      *   **Knowing How (Procedural):** Abilities, skills, dispositions. Demonstrated by *doing*. Can be Successful/Unsuccessful. (e.g., "How to ride a bike," "How to speak French").
  *   **The Crucial Nuance:** Emphasize that "Knowing How" is not just "Knowing That" + "Movement." It is a distinct state. A native speaker knows *how* to speak grammar but often doesn't know *that* the rule is "Subject-Verb-Object."

  #### 3. The AI Application (15 Mins)
  *   *Now* use your example, but carefully.
  *   **Setup:** "Let's apply this to AI."
  *   **Side A:** A computer scientist who knows *that* the model uses transformers, attention heads, and backpropagation.
  *   **Side B:** A 14-year-old who doesn't know the math but knows *how* to prompt the AI to get a specific style of poem.
  *   **Discussion Question:** "Who has more 'knowledge' of the AI?"
  *   **Trap to Watch:** A student will say, "The kid just knows *that* certain words trigger certain outputs."
  *   **Your Counter:** "If it's just facts, why can't they write a manual that guarantees success for everyone else? Why is it a 'feel' or a ' knack'?"
  *   **Goal:** Show that prompting often feels like "Knowing How" (intuitive, iterative) even if it involves text.

  #### 4. Misconception Check & Discussion (10 Mins)
  *   **Prompt:** "Is Knowing How just hidden Knowing That?"
  *   **Scenario:** Think of a pro athlete in the "zone." Are they reciting facts in their head? No. If they start thinking about the facts (elbow angle, wind speed), they often choke.
  *   **Point:** "Knowing That" can actually interfere with "Knowing How." This proves they are distinct.
  *   **AI Warning:** If someone asks, "Does the AI know how?" remind them: "We are analyzing *our* language. When we say 'The AI knows how to write,' are we speaking literally or metaphorically?"

  #### 5. The Exit Ticket (5 Mins)
  *   **Task:** Give them this scenario on a slip of paper:
      > "A chef can create a Michelin-star soup every time but cannot read or write. A food critic can write 1,000 pages on the chemistry of soup but burns boiling water."
  *   **Question:** "Who has the 'Knowing How' and who has the 'Knowing That'? Can one exist without the other? Explain in one sentence."
  *   **Success Criteria:** They must identify that the chef has the *ability* (How) without the *theory* (That), proving they aren't the same thing.

  ---

  ### Part 3: What to Cut (The "Do Not Touch" List)

  1.  **Ryle's Regress:** Do not explain the argument that "if knowing how was knowing that, you'd need an infinite number of thoughts to act." It is too abstract and will kill the vibe. Just state the conclusion: "Thinking about rules isn't the same as following them."
  2.  **Gettier Cases:** Do not bring up "Justified True Belief." That is for a different session.
  3.  **AI Consciousness:** As stated above. If they ask "Is the AI conscious?", park it in a "Parking Lot" on the whiteboard and say, "That's Philosophy of Mind, today is Epistemology."
  4.  **Neuroscience:** Don't let them argue about muscle memory vs. brain chemistry. Keep it conceptual.

  ### Part 4: Expected Misconceptions & Scripts

  **Misconception 1: "Knowing How is just Knowing That you haven't written down yet."**
  *   **Where it happens:** During the AI or Sports section.
  *   **Shut it down:** "If it was just unwritten facts, we could eventually write them all down and teach a robot perfectly. But we still can't code a robot to walk as well as a toddler. Why? Because the 'how' isn't just a list of 'thats'."

  **Misconception 2: "Knowing That is useless."**
  *   **Where it happens:** When praising the athlete/chef.
  *   **Correction:** "Knowing That improves Knowing How. A swimmer who learns fluid dynamics (That) might fix their stroke (How). They are different, but they talk to each other."

  **Misconception 3: "AI actually knows how."**
  *   **Where it happens:** During the AI section.
  *   **Correction:** "The AI simulates the output of knowing how. But does it have the *disposition*? If the server turns off, does it still know how? We use the word 'know' loosely for machines. Let's focus on human knowledge first."

  ### Summary Checklist for You
  *   [ ] Start with swimming/sports, not AI.
  *   [ ] Emphasize that Theory $\neq$ Practice.
  *   [ ] Don't get dragged into AI consciousness.
  *   [ ] Use the Chef/Critic scenario for the final check.
  *   [ ] Skip Ryle's Regress argument.

  If you stick to this order, you prevent the "Skills vs. Facts" simplification by showing cases where the two diverge completely. Good luck.
