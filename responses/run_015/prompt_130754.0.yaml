prompt: |-
  hey so i'm grading exams for my philosphy of decision-theory course and there's this take-home answer on the two-envelope paradox that's driving me a little crazy. the question i gave was: lay out the paradox with the expected-value reasoning that says you should always switch envelopes, then diagnose exactly where that reasoning fails — be specific about the prior distribution over the amounts and why running the same argument from envelope B creates a problem rather than just a contradiction. here's thier response, copied verbatim:

  "the paradox starts with two envelopes, one containing twice as much money as the other. i open envelope A and find $40 inside. then envelope B either has $20 or $80, each with probability 1/2, so the expected value of B is 0.5 times 20 plus 0.5 times 80 which equals $50. since $50 is more than $40, i should switch. but if i had opened B first and seen $80, the same logic says A has expected value $100, so i should switch back. this means i'm always told to switch, which is impossible, so the argument must contain a mistake.

  the mistake is that you can't have a uniform prior over all possible dollar amounts, because that'd be an improper distribution with infinite total weight. once you actually observe $40, you need a real, normalizable prior to condition on, and without one the 50/50 split between half and double is unjustified. so the switch reasoning secretly assumes a prior it doesn't have. this is basically the St. Petersburg paradox in disguise — both come from unbounded scales making naive expected-value reasoning blow up, and both show you can't apply expectation formulas when the underlying distribution isn't well-behaved. the symmetry problem is just the contradiction we already noticed, which tells us the initial step was wrong."

  i need you to grade this like you're a fellow ta — give me an actual letter grade (B+, B, etc.) and then go point by point through what's right, what's subtly wrong, and what's missing. specifically: did they actually resolve the symmetry issue or just restate it? are they right that the prior is the key, and do they understand how conditioning on the observed amount works with a proper prior? and please check whether they're unfairly importing St. Petersburg — i think they conflate the two — but tell me if that's a real mistake or if i'm being too harsh. don't just say "good point about the contradiction"; tell me whether naming the contradiction does any work in dissolving the paradox. also flag any place where they sound precise but are actually fudging the math or the logic. thanks!
