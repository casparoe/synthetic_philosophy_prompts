answer: |-
  *   Starting Commitment: Brain is a physical system whose activity can be described in computational vocabulary.
      *   Q1: Is computational attribution objective (causal structure) or observer-relative (mapping exists)?
          *   Observer-relative → Deflationary verdict: the brain computes but this is trivial or observer-relative.
          *   Objective → Q2.
      *   Q2: Twin Computation Case: Do models diverging only on never-received inputs count as distinct implementations?
          *   No (Actual trajectory suffices) → Dynamical-systems anti-computationalism: cognition is trajectory, not computation.
          *   Yes (Counterfactuals matter) → Q3.
      *   Q3: Must computational vehicles carry semantic content to constitute cognition?
          *   No (Syntax/Mechanism suffices) → Mechanistic (Piccinini-style) computationalism: implementation is graded by mechanistic relevance.
          *   Yes (Representation required) → Q4.
      *   Q4: Is cognition constituted by rule-governed manipulation of vehicles?
          *   No (Representation exists without computation) → Representational-but-not-computational views.
          *   Yes (Rule-processing required) → Q5.
      *   Q5: Whole-Brain Emulation Case: If run a million times slower, does it possess identical mental states?
          *   No (Biological/Temporal properties constitute mind) → Searle-style biological naturalism.
          *   Yes (Abstract organization alone constitutes mind) → Q6.
      *   Q6: Is processing architecture discrete/symbolic or continuous/weighted?
          *   Discrete/Symbolic → Classical language-of-thought computationalism.
          *   Continuous/Weighted → Connectionist computationalism.
  *   Unoccupied Cells and Diagnoses
      *   Observer-relative + Biological Naturalism: Incoherent, as biological naturalism demands objective causal powers incompatible with observer-relativity.
      *   Non-representational + LOT: Incoherent, since language-of-thought requires semantic symbols by definition.
      *   Objective + Dynamical Systems: Unattractive, as dynamical views typically reject objective computational individuation in favor of continuous state spaces.
      *   Graded Implementation + Triviality: Collapses Q1, because if mechanistic relevance grades implementation, trivial mappings are explanatorily inert rather than objectively real.
      *   Substrate-independent + Searle: Incoherent, as Searle's view insists substrate biology is constitutive of mental states.
  *   Indistinguishable Leaves
      *   Mechanistic vs. Connectionist: Hard to separate if connectionist units are treated as mechanistic components performing non-semantic operations.
      *   Deflationary vs. Dynamical: Overlap occurs if dynamical trajectories are viewed as merely another observer-relative description.
