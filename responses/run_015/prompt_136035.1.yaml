  **To:** Chair, Priorities Committee
  **From:** Advisor
  **Subject:** Analysis of Condition C Screening Proposal and Charter Coherence

  ### 1. The Rules Derived from Precedent

  Based on the four decisions provided, the Committee operates under three binding rules derived from the Charter's Pareto and Safety constraints:

  1.  **Strict Ex Ante Pareto:** A change is permissible only if *every* member's expected utility rises (or at minimum, is not reduced). We cannot trade off losses for one group against gains for another, even if the total health gain is larger (Decision 2, Decision 3).
  2.  **No Identifiable Losers:** If a subgroup can be identified in advance as facing a net expected loss (whether through higher costs, lower utilization, or specific harm), the proposal must be rejected (Decision 2, Decision 3). Ex post harm is permissible only if the victims cannot be identified ex ante (Decision 4).
  3.  **Safety as Robustness:** The "Safety" qualifier requires that the expected improvement holds under any "reasonable" resolution of uncertainty. Decision 4 establishes that this includes robustness to risk attitudes. If a verdict flips from "Reject" to "Approve" solely based on whether we assume members are risk-neutral or risk-averse, the proposal is not "safe" (Decision 4).

  ### 2. Application to the Three Forms

  **Option 1: Universal Screening (No Opt-Out)**
  *   **Financing:** Uniform premium ($620/member).
  *   **Analysis:**
      *   *Risk-Neutral:* Net benefit is -0.0004 QALYs. Every member is expected to be worse off. **Fails Pareto.**
      *   *Risk-Averse:* Net benefit is positive (e.g., +0.0036 QALYs for general population). **Passes Pareto.**
      *   *Safety:* Because the verdict depends entirely on the assumption of risk aversion, it fails the Safety qualifier established in Decision 4 (which required the margin to be wide enough that risk attitude didn't matter).
  *   **Verdict:** **Reject.**

  **Option 2: Universal Screening (With Opt-Out)**
  *   **Financing:** Uniform premium, but members can decline.
  *   **Analysis:**
      *   *Ex Ante Pareto:* Theoretically, those who opt out avoid the loss; those who stay in reveal a preference. However, the Charter requires the *Committee* to certify the change raises expected wellbeing, not that members consent to it.
      *   *Safety/Inertia:* If members stay in due to inertia or misunderstanding rather than calculated utility, the Ex Ante Pareto condition is not objectively met.
      *   *Identifiability:* No identifiable losers ex ante, but the "Safety" of the improvement remains dependent on risk attitude (as in Option 1).
  *   **Verdict:** **Reject** (on Safety grounds, unless inertia is ruled out).

  **Option 3: Targeted Screening (High Risk Only)**
  *   **Variant A: Financed by Common Premium**
      *   **Analysis:** Total cost drops (only 2% screened), spread over all members. Low-risk members pay a small premium for zero benefit (since they aren't screened). Their expected health falls due to the cost.
      *   **Verdict:** **Reject.** Violates Decision 3 (Rural Older Subgroup). Identifiable losers (the 98%).
  *   **Variant B: Financed by Targeted Premium (High Risk pay all)**
      *   **Analysis:**
          *   *High Risk (2%):* Pay $620 (0.0124 QALY cost). Gain 0.12 Expected QALYs (1% risk of 12 QALY loss). Net gain is ~0.1076 QALYs. This is positive even under risk neutrality.
          *   *Low Risk (98%):* Pay $0. Receive $0 benefit. Net change is 0.
      *   **Pareto:** Passes (No one is worse off; High Risk are better off).
      *   **Safety:** Passes (High Risk gain is robust to risk attitude).
      *   **Identifiability:** Passes (Losers are not created; High Risk are gainers).
  *   **Verdict:** **Approve.**

  ### 3. Recommendation and Coherence

  **Recommendation:** You should recommend **Option 3, Variant B (Targeted Screening, Financed by Targeted Premium).**

  **Closest Precedent:** This is a synthesis of **Decision 1** (Generic Switch) and **Decision 3** (Rural Older). Like Decision 1, it ensures no member's benefits are reduced (the 98% are neutral, the 2% gain). Like Decision 3, it rigorously protects identifiable subgroups from cross-subsidizing benefits they do not receive.

  **Underdetermination:** Our record underdetermines the definition of **"Reasonable" risk attitude.**
  *   *Principle Adopted:* By choosing Option 3B, we adopt the principle that the Committee acts as a fiduciary for *expected value* that must be robust to risk-neutrality. We treat risk aversion as a bonus that can justify marginal cases (like Decision 4), but not as a crutch to rescue proposals that fail on risk-neutral arithmetic (unlike Option 1).
  *   *If we chose Option 1:* We would be adopting the principle that the Plan's calibrated utility function is the *only* reasonable metric, effectively ruling risk-neutrality "unreasonable" for health decisions. This contradicts the spirit of Decision 4.
  *   *If we chose Option 2:* We would be adopting the principle that member *choice* cures Charter defects. This shifts the Committee's role from calculating wellbeing to facilitating markets, which conflicts with our statutory nature and Decision 4 (where we approved a vaccine without opt-out based on our own calculation).

  ### 4. Next Month's Agenda: Separating the "Safety" Qualifier

  The current case conflates **Risk Attitude** with **Identifiability**. To cleanly separate the readings of the "Safety" qualifier, you should place a case on the agenda that isolates **Effect-Size Uncertainty.**

  **The Case:** A treatment with a well-understood mechanism but wide confidence intervals on the *magnitude* of benefit.
  *   *Scenario:* A drug where the mean expected benefit is positive, but the lower bound of the 95% confidence interval is negative.
  *   *Dimension:* **Effect-Size Uncertainty.**
  *   *Why:* This forces the Committee to decide if "Safety" means "Robust to Data Uncertainty" (Precautionary Principle: reject if lower bound is negative) or "Robust to Best Estimate" (Approve if mean is positive).
  *   *Separation:* This separates the "Safety" qualifier from Risk Attitudes (which we have now explored) and Identifiability (which is fixed in this new case). It tells us whether "what we do not know" refers to *values* (risk aversion) or *facts* (clinical efficacy).

  ### 5. The Opt-Out Question

  **Does the opt-out version change anything?**
  No. Relying on an opt-out to satisfy the Charter is incoherent with our precedents.

  **Why:**
  1.  **Revealed Preference vs. Inertia:** If a member does not opt out, the Committee cannot know if this reveals a positive expected utility or simply inertia, administrative burden, or misunderstanding. Decision 4 shows we are willing to impose interventions (vaccines) without consent when the *objective* math holds. Conversely, we should not rely on *subjective* non-action to validate math that fails objectively (as Option 1 does under risk neutrality).
  2.  **Committee Assumptions:**
      *   *If we rely on the opt-out:* We assume members are rational, informed, and active agents who understand the 0.012 vs 0.0124 QALY trade-off. This contradicts the paternalistic fiduciary role implied by Decision 2 and 3 (where we protected groups from their own potential losses).
      *   *If we reject the opt-out:* We assume members are subject to inertia and bounded rationality, and that the Charter's "expected wellbeing" is an objective calculation for the Committee to make, not a subjective preference for the member to reveal.

  **Conclusion:** The opt-out is a procedural veneer that does not fix the substantive failure of Option 1 to meet the Safety qualifier. Stick to the objective calculation. Approve Option 3B.
