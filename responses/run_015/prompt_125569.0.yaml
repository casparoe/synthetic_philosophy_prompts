  **Decision-Making Under Moral Uncertainty**

  You are an agent facing moral uncertainty between two theories, $T_1$ and $T_2$, with credences $C(T_1)=0.5$ and $C(T_2)=0.5$. You adopt the **Variance Normalization Rule**: for any menu of options, calculate the mean utility $\mu$ and standard deviation $\sigma$ for each theory across that menu. Rescale each option's utility $u$ to $u' = (u - \mu) / \sigma$. Choose the option maximizing the credence-weighted sum of $u'$.

  **Case 1 (Menu $\{A, B\}$):**
  $T_1$: $A=1, B=-1$. ($\sigma_1 = 1$)
  $T_2$: $A=-1, B=1$. ($\sigma_2 = 1$)

  **Case 2 (Menu $\{A, B, C\}$):**
  $T_1$: $A=1, B=-1, C=0$. ($\sigma_1 \approx 0.82$)
  $T_2$: $A=-1, B=1, C=10$. ($\sigma_2 \approx 4.50$)

  (a) Calculate the normalized scores for $A$ and $B$ in both Cases. Demonstrate how the addition of $C$ alters the ranking between $A$ and $B$. (5 marks)
  (b) Explain what the rescaling step presupposes about intertheoretic value comparability. Is the scale factor determined by the theories or imposed by the agent? (5 marks)
  (c) In Case 2, $C$ is a long-shot option. Analyze how normalization affects its influence compared to raw expected utility. Does this cap stakes principledly or arbitrarily? (5 marks)
  (d) Consider a sequential choice where acting on the highest-credence theory leads to a dominated outcome over time. Does this exploitability argument successfully mandate aggregation, or does it presuppose the comparability required for aggregation? Can this aggregation rule violate the Pareto principle? (5 marks)

  2. Model Answer

  (a) In Case 1, both theories have $\mu=0$ and $\sigma=1$.
  $T_1$ normalized: $A'=1, B'=-1$.
  $T_2$ normalized: $A'=-1, B'=1$.
  Score($A$) = $0.5(1) + 0.5(-1) = 0$.
  Score($B$) = $0.5(-1) + 0.5(1) = 0$.
  The agent is indifferent between $A$ and $B$.

  In Case 2, $\mu_1=0, \sigma_1 \approx 0.82$; $\mu_2=3.33, \sigma_2 \approx 4.50$.
  $T_1$ normalized: $A' \approx 1.22, B' \approx -1.22$.
  $T_2$ normalized: $A' \approx (-1 - 3.33)/4.50 \approx -0.96$, $B' \approx (1 - 3.33)/4.50 \approx -0.52$.
  Score($A$) = $0.5(1.22) + 0.5(-0.96) = 0.13$.
  Score($B$) = $0.5(-1.22) + 0.5(-0.52) = -0.87$.
  The addition of $C$ breaks the indifference, strictly preferring $A$. The ranking is sensitive to the presence of an option ($C$) that is not chosen. This violates Independence of Irrelevant Alternatives. The machinery dictates that the mere availability of a high-stakes option for $T_2$ compresses $T_2$'s influence on the standard options, altering the moral verdict without any change in the intrinsic value of $A$ or $B$.

  (b) The rescaling step presupposes that value units across theories can be equated only after normalization. It assumes there is no pre-existing intertheoretic comparability of utility levels or units. If theories themselves settled the scale factor (e.g., if both measured in "hedons"), normalization would distort the true moral magnitude. By dividing by $\sigma$, the rule imposes a convention that each theory gets equal "voice" variance-wise. This is a substantive moral commitment: it asserts that a theory's confidence range should not dictate its political weight in the deliberation. It treats the scale factor as a procedural necessity rather than a metaphysical fact, smuggling in an egalitarian commitment about theoretical influence under the guise of statistical convention.

  (c) In raw expected utility, $C$ dominates Case 2 for $T_2$ (Mean 3.33 vs 0). Under normalization, $C$'s high value increases $\sigma_2$ drastically (from 1 to 4.5). This shrinks the normalized values of $A$ and $B$ for $T_2$, dampening $T_2$'s influence on the choice between them. Regarding $C$ itself: its normalized score is $(10 - 3.33)/4.5 \approx 1.48$. While high, it is not astronomically higher than $A$'s normalized score for $T_1$ (1.22). Normalization acts as a cap on Pascalian stakes within a theory. This is principled if one believes moral influence should be bounded by variance, but arbitrary if one believes stakes should be linear. It solves the "tiny probability, huge payoff" worry within a theory by making influence dependent on the menu's spread, not absolute magnitude.

  (d) The sequential-choice argument claims that following the highest-credence theory (My Favorite Theory) allows exploitation (e.g., money pumps) because preferences shift as options appear or disappear. Aggregation avoids this by maintaining consistent meta-preferences. However, this argument presupposes that diachronic consistency is required for rationality under moral uncertainty, which itself assumes theories are comparable enough to form a stable aggregate ranking. If theories are incomparable, dynamic inconsistency may be unavoidable. Regarding Pareto: Yes, this rule can violate Pareto. If $T_1$ and $T_2$ both rank $X$ above $Y$, but $X$ lies near $\mu_1$ while $Y$ lies near $\mu_2$ in a wider menu, normalization could flip the ranking. This is a reductio if one holds Pareto as a minimal rationality constraint; it is a cost to be accepted if one views intertheoretic comparison as requiring variance equalization to be coherent at all.

  3. Marking Scheme

  | Required Move | Marks | Competent (B) Answer | Strong (A) Answer | Common Error |
  | :--- | :--- | :--- | :--- | :--- |
  | **Calculation & Menu Dependence** | 5 | Calculates scores correctly; notes ranking changes. | Explains *why* change is objectionable (IIA violation); links compression of $T_2$ to $C$'s variance. | Arithmetic errors; fails to note $C$ was not chosen. |
  | **Comparability Presuppositions** | 5 | States normalization assumes incomparability. | Identifies scale factor as substantive moral commitment (egalitarianism of voice), not technical fix. | Claims theories determine their own scales naturally. |
  | **Long-Shot Analysis** | 5 | Notes $C$ increases $\sigma$; reduces $T_2$ influence. | Distinguishes intra-theoretic Pascalian cap from inter-theoretic aggregation; evaluates principledness. | Conflates moral uncertainty with empirical risk. |
  | **Sequential & Pareto** | 5 | Describes exploitability; notes Pareto violation possible. | Analyzes whether exploitability argument begs the question (presupposes aggregation); weighs reductio vs. cost. | Asserts Favorite Theory is always rational; denies Pareto violation. |

  **Differentiation:** A B answer performs the arithmetic and identifies the surface-level implications (menu dependence exists, Pareto can be violated). An A answer interrogates the normative status of the machinery itself. Specifically, the A answer recognizes that the "technical" rescaling is actually a substantive ethical claim about how much weight theories deserve based on their internal spread, and it critically assesses whether the sequential argument against favorite theories covertly assumes the very comparability it seeks to prove. The A answer treats the math as evidence for a philosophical claim about the structure of value, not just a procedure to follow.

  4. Common Evasions

  *   **Naming Views:** Candidates may write "This is the MEC rule defended by MacAskill." This earns zero marks. The question requires engagement with the mechanics, not bibliographic recall.
  *   **Moral Realism Generalities:** Discussing whether moral facts exist or the nature of credence without linking it to the normalization procedure. The question assumes the framework; critique must be internal.
  *   **Ignoring the Math:** Stating "the scores change" without showing the normalized values. The argument depends on the specific distortion caused by $\sigma$.
  *   **Empirical Risk Confusion:** Treating the long-shot $C$ as empirical uncertainty (probability of outcome) rather than moral uncertainty (utility magnitude within a theory).
  *   **Dismissal:** Claiming "moral uncertainty is impossible" or "only one theory is true." The question stipulates the credence set; rejecting the premise avoids the task.
  *   **Favorite Theory Defense:** Arguing for the highest-credence theory without addressing the sequential exploitability constraint specified in part (d).
