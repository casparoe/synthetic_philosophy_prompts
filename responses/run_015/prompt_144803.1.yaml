answer: |-
  This is a fantastic constraint set for a character. You have inadvertently created a philosopher who is **internally consistent** but **orthodoxly controversial**.

  Here is the breakdown of her decision algorithm, her verdict on the 3% divergence case, and the specific scenarios that will expose the cracks in her philosophy.

  ### 1. The Verdict on the 3% Divergence Case
  **She Cooperates.**

  Here is the logic she is running: In a Prisoner's Dilemma, cooperation is rational if the probability that the opponent mirrors your action is high enough to offset the temptation to defect.
  *   **Exact Copy:** 100% correlation. Cooperation is obvious.
  *   **3% Divergence:** 97% correlation. In a standard PD payoff matrix (e.g., Temptation=5, Reward=3, Punishment=1, Sucker=0), a 97% correlation still makes the Expected Utility of Cooperation significantly higher than Defection.

  Unless the divergence specifically targets her "cooperation module" (which a random bit flip is unlikely to do), she views this other agent as **logically entangled** with her. To her, defecting is effectively defecting against herself 97% of the time. She will cooperate, likely rationalizing that "perfect identity isn't required for logical solidarity, only sufficient correlation."

  ### 2. Diagnosing Her Algorithm: Updateless Evidentialism
  You asked if she is running True Updateless Decision Theory (UDT/FDT) or Evidential Decision Theory (EDT). The answer is a specific hybrid that fits all four of her verdicts perfectly: **Updateless Evidential Decision Theory (UEDT).**

  Here is why standard theories fail your character's profile, and why UEDT fits:

  *   **Standard Causal Decision Theory (CDT):** Fails Newcomb (Two-boxes) and PD Copy (Defects).
  *   **Standard Evidential Decision Theory (EDT):** Fits Newcomb and PD Copy. **Fails Counterfactual Mugging.** (Standard EDT updates on the fact that the coin came up tails and Omega isn't paying, so it sees no reason to give money now). **Fits Smoking Lesion** (Refuses to smoke because smoking is bad evidence).
  *   **Standard Updateless/FDT:** Fits Newcomb, PD Copy, and Mugging. **Fails Smoking Lesion.** (FDT agents know their decision doesn't *cause* the gene, so they screen off the correlation and smoke to enjoy the nicotine).

  **Your Character's Rule:**
  She refuses to "screen off" common causes. She treats physical correlations (the Gene) and logical correlations (the Copy) as part of the same bucket: **Global Evidence.**
  *   **Why she refuses to smoke:** She adopts her policy *before* knowing if she has the gene. From that ex-ante perspective, the policy "I will smoke" is strongly correlated with "I have the cancer gene." She maximizes ex-ante evidential utility.
  *   **Why she pays the Mugging:** She adopts the policy *before* the coin flip. The policy "I will pay if asked" causes Omega to give her money in the 50% branch where the coin comes up heads. She doesn't update on the fact that she is currently in the "tails" branch.

  **Character Note:** This makes her a **Radical Correlationist**. She believes that if two things are correlated, acting as though you control both is the winning strategy, even if one is physically in the past (the gene) or causally disconnected (the coin flip).

  ### 3. Competing Rules That Fit (The "Imposter" Theories)
  If you want to introduce a rival character or an internal doubt, here are the theories that mimic her until they break:

  1.  **Functional Decision Theory (FDT):**
      *   *Matches:* Newcomb, PD Copy, Mugging.
      *   *Diverges:* Smoking Lesion. An FDT agent would mock her for not smoking. They would say, "Your decision cannot logically change your DNA. You are leaving utility on the table."
  2.  **Naive Evidential Decision Theory (EDT):**
      *   *Matches:* Newcomb, PD Copy, Smoking Lesion.
      *   *Diverges:* Mugging. A naive EDT agent would say, "The coin is already tails. Paying changes nothing."
  3.  **Superrationality (Hofstadter):**
      *   *Matches:* PD Copy.
      *   *Diverges:* Everything else. It doesn't have a formal mechanism for the Mugging or the Lesion.

  ### 4. The Sharp Case: "The Common-Cause Prisoner's Dilemma"
  To truly test her rule—and create dramatic tension—you need a case where **Evidential Correlation** and **Logical Control** come apart.

  **The Scenario:**
  She is placed in a Prisoner's Dilemma against a **Twin**.
  *   They were separated at birth.
  *   They have never met and cannot communicate.
  *   Brain scans show they share a rare "Decision Gene" that causes 99% of carriers to Cooperate in PDs.
  *   **Crucially:** They do *not* have each other's source code. They are not running the same algorithm; they are running *different* algorithms that are physically determined by the same biological cause.

  **The Conflict:**
  *   **Her (UEDT) Verdict:** **Cooperate.**
      *   *Reasoning:* "My cooperation is 99% correlated with their cooperation. If I cooperate, it is overwhelmingly likely they cooperate. $3M is better than $1M." She treats the biological correlation as binding as a logical one.
  *   **The FDT/UDT Purist Verdict:** **Defect.**
      *   *Reasoning:* "My decision algorithm does not *logically determine* their decision. We are not running the same source code. The gene is a common cause in the past. I cannot change their action by changing mine. Defecting dominates."

  **Why this is the Sharp Case:**
  This exposes the vulnerability in her philosophy. In the Smoking Lesion, refusing to smoke costs her nicotine but saves her life (arguably good). In the Mugging, paying costs money but wins the game. But in the **Common-Cause PD**, her strategy leaves her vulnerable to exploitation by agents who understand that physical correlation $\neq$ logical control.

  If you put her against a CDT agent who *knows* she is a Correlationist, the CDT agent will Defect (knowing she will Cooperate due to the correlation), and she will get the "Sucker's Payoff."

  ### Summary for the Novel
  *   **Her Rule:** Updateless Evidential Decision Theory (Maximize ex-ante evidential utility; never screen off correlations).
  *   **3% Divergence Verdict:** Cooperate (Correlation is still too high to ignore).
  *   **The Fatal Flaw:** She conflates **logical identity** with **physical correlation**.
  *   **The Plot Device:** Introduce an antagonist who runs **FDT**. They will smoke in the Smoking Lesion (showing "superior" rationality) and Defect in the Common-Cause PD (exploiting her). This forces her to question whether her "consistency" is actually a form of magical thinking.
