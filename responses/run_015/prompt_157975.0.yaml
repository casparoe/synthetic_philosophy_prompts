answer: |-
  You've caught me on a technicality, or so it seems. It is a clever move, I grant you—using the pluriverse to try to dissolve the boundaries of justice. But I think you are conflating the metaphysics of modality with the ethics of punishment, and furthermore, you are misapplying counterpart theory. Let me straighten this out, because the distinction matters.

  First, recall the doctrine of modal realism. Yes, I hold that possible worlds are concrete entities, just as real as this actual world of ours. And yes, I am world-bound. I, David Lewis, exist only in this world. There are counterparts of me in other worlds—men who resemble me in important ways, perhaps even men who are much like me except that they serve a life sentence while I walk free. But they are not *me*. Strict identity is transitive; the counterpart relation is not. If my counterpart in world W2 sits in the electric chair, *I* do not die. I remain here, typing this reply.

  Now, consider your question: Is justice satisfied if my counterpart gets the chair?

  The answer must be no, because justice is an indexical matter. When the state of New Jersey punishes me, it is a local institution operating within this spatiotemporal system. The demands of justice are demands *here*. If a counterpart in a causally isolated world suffers, that suffering has no causal impact on this world, no restorative effect on this community, and no retributive balance *here*. To suggest that justice is satisfied globally across the pluriverse rather than locally within a world is to misunderstand the function of punishment. Punishment is not a cosmic tally of pain units; it is a social practice bound by the relations of actual persons. My counterpart is not a person I stand in relation to. He is not my neighbor, not my citizen, not my friend. He is a stranger in a disconnected universe. His suffering is no more relevant to my justice than the suffering of a character in a novel.

  But let's press harder on your second point. Does counterpart theory destroy the idea that "someone else" can take *my* punishment?

  Actually, I argue it sharpens it. If we accept counterpart theory, we must accept that I am strictly identical only to myself. Therefore, *any* substitution is, strictly speaking, someone else taking the burden. The question is never "Can someone else undergo my experience?" because the answer is always no. No one can undergo my experience but me. The question is rather, "Can someone else undergo a *similar* experience such that we count the debt as paid?"

  Here is where the distinction between fines and death remains robust, regardless of modal realism.

  When a friend pays my parking ticket, the state does not require *my* experience of loss. It requires a transfer of currency. Money is fungible. It is external to the person. Whether the dollar bill comes from my pocket or my friend's pocket makes no metaphysical difference to the state's receipt. The burden is transferred because the burden is not constitutive of the self.

  But when the penalty is imprisonment or death, the burden is not external. It is constitutive. It is an experience. Pain, confinement, cessation of life—these are not transferable goods like currency. They are modes of existence. If my friend sits in my prison cell, he is not undergoing *my* confinement; he is undergoing *his*. We may call it "my sentence" by convention, but metaphysically, it is his suffering. With fines, we don't mind this mismatch because the money doesn't care. With death, we mind profoundly because the person does.

  So, does modal realism blur this distinction across worlds? I say again: no. The isolation of worlds ensures that the distinction holds firm. What happens in another world is not a substitution for what happens in this one; it is merely a different event entirely. If I claim that my counterpart's death satisfies justice for my crime, I am not arguing for penal substitution; I am arguing for irrelevance. I am saying that justice here can be satisfied by suffering there. But if that were true, why not say justice is satisfied if a counterpart commits the crime and I reap the reward? It leads to absurdity.

  We must keep our metaphysics and our morals in their proper lanes. Modal realism tells us what exists; it does not tell us how to distribute guilt. Guilt, like identity, is world-bound. I am guilty here. My counterpart may be guilty there. But his punishment does not cleanse my record, because records are kept locally.

  So, I stand by the paper. We accept vicarious payment for fines because money is external and fungible. We reject vicarious punishment for death because suffering is internal and non-fungible. My modal realism does not save the theologian's doctrine here. If anything, it makes the separation clearer. I am me. They are them. And no amount of cross-world resemblance allows them to die in my place, because in the only world that matters for my justice, I am the one who remains alive.
