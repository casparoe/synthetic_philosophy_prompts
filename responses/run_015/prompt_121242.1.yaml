answer: |-
  Elara knows every physical fact about colour vision—wavelengths, cone responses, neural pathways—but has a rare congenital deficit akin to prosopagnosia for hues. She sits in a white room reviewing spectral charts. Before the session, attempts to visualize colours yield only blankness. A technician places a pure 650nm filter over her lamp for ten seconds. Elara enters the state caused by the filter. During exposure, she cannot match the sensation to any label. When asked afterwards to describe the feeling, she can only cite the wavelength. She returns to her data.

  ***

  **The Ability Hypothesis**
  Elara gains no new abilities: she still cannot visualize colours (imagery remains blank), she still cannot label the sensation during exposure (recognition remains disconnected), and she still cannot describe the feeling afterwards (memory remains absent). To maintain that she learns nothing, the Ability Hypothesis must claim that having an experience without retaining any capacity to reproduce, identify, or recall it constitutes no ability at all. If instead it stretches "ability" to include the mere transient capacity to *undergo* the state during those ten seconds, the term loses its explanatory force, becoming synonymous with "occurrence" rather than a skill she possesses.

  **The Phenomenal-Concept Strategy**
  This case is harder for the phenomenal-concept theorist than the standard Mary case. Usually, Mary acquires a durable recognitional concept ("*This* is red") she can deploy later. Elara cannot recognize the sensation during exposure and cannot retain the qualitative character afterwards, so she acquires no reusable recognitional concept. The defender is forced to argue she acquires a fleeting demonstrative concept that vanishes instantly, which strains the definition of a "concept," or they must concede that the cognitive change is purely self-locating rather than conceptual.

  **The Self-Locating Diagnosis**
  This view gets the cleanest fit. Elara's prior knowledge included all uncentered physical facts (e.g., "650nm light causes state S in humans"). What she lacked was the centered fact: "I am *now* in state S." Her physical knowledge was complete regarding the world, but incomplete regarding her location within it. Physicalism survives because the new fact is not non-physical; it is indexical. The completeness of her prior physical knowledge didn't include it because physical descriptions are typically uncentered, lacking the "I" and "now" required to pin down her current perspective.

  **The Knowledge Argument**
  The intuition that Elara learns something remains intact, but the argument cannot jump straight to non-physical facts. To conclude physicalism is false, the proponent needs an extra premise: "All facts are uncentered physical facts." A physicalist denies this premise, arguing that centered facts (facts about where and who you are in the physical world) are still physical facts, just not captured by an uncentered description. Without this premise, the move from "new fact" to "non-physical fact" is invalid.

  ***

  **Case Analysis**

  **The Working Feature:** The specific stipulation that Elara cannot recognize or remember the qualitative character of the experience. This removes the foothold needed for the Ability Hypothesis (no durable ability gained) and the Phenomenal-Concept Strategy (no durable concept formed).

  **If Removed:** If Elara could remember and recognize the colour afterwards, the stalemate returns. The Ability Theorist could say she gained the ability to recognize/red-integrate; the Phenomenal-Concept theorist could say she gained a recognitional concept. The case would collapse back into the standard debate where both responses look plausible.

  **Strongest Ability Escape:** The Ability Theorist could argue she gained the ability to *remember that she had the experience*, even if she cannot recall the qualia itself. This shifts the ability from "knowing what it's like" to "knowing that it happened," but this risks conflating propositional knowledge with ability knowledge.

  **Impact of Narrowed Knowledge:** Limiting her prior knowledge to colour vision rather than all physical facts helps the Self-Locating and Physicalist verdicts. If she knew *all* physical facts about the universe, including the exact state of her own brain, the claim that she missed a "centered" fact is harder to sustain (since she'd know "Elara is in state S"). By narrowing scope to general colour vision theory, it is clearer that she missed the indexical link between the theory and her current state, making the self-locating diagnosis more plausible than the claim that she missed a non-physical fact.
