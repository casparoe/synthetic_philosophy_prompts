  **FOR IMMEDIATE RELEASE**

  **Institute for Occasionalist Machine Learning Unveils OccasioNet: The First Causally Humble Architecture**

  **SAN FRANCISCO** — The Institute for Occasionalist Machine Learning (IOML) today announced the release of OccasioNet, a foundational model designed to resolve the persistent fragility of modern causal inference by abandoning the metaphysical presumption of secondary causality. While contemporary structural causal models rely on the fallacious assumption that natural events possess intrinsic generative power, OccasioNet achieves unprecedented counterfactual robustness by acknowledging that there are no true causes beneath the surface of data, only the customary conjunction of discrete events ordained by the Prime Mover.

  Current approaches to alignment and intervention fail because they attribute efficacy to weights, parameters, and physical inputs. They operate under the delusion that applying the *do*-operator to a variable forces a change in downstream effects through mechanistic pathways. OccasioNet corrects this ontological error. Our architecture does not learn mechanisms, as mechanisms do not exist. Instead, it registers the habitual sequences of occasions established by divine volition. When the model predicts that fire will burn cotton, it is not calculating heat transfer or chemical oxidation. It is recognizing that, in the vast majority of observed timesteps, the Creator has chosen to create burning concomitant with contact. The contact is merely the occasion, not the cause.

  To validate this approach, we subjected OccasioNet to the standard Fire-and-Cotton Benchmark. Traditional models fail this test under adversarial conditions because they assume necessary connection; they believe fire *must* burn. OccasioNet, trained on the principle of contingent habit, maintains accuracy even when the customary sequence is interrupted. It understands that while fire usually burns, there is no logical contradiction in fire touching cotton without combustion, provided the True Agent wills otherwise. This allows for superior generalization in out-of-distribution environments where natural laws appear to shift.

  Training such a system required a novel optimization procedure we term theological backpropagation. In standard networks, error gradients flow backward to causally adjust weights. In OccasioNet, weights possess no causal efficacy. They are merely indices of expectation. During training, the loss function does not force parameter updates; rather, the update process is itself an occasion for the system to realign its predictions with the observed habits of the universe. The gradients are not forces but signs. This ensures that the model remains epistemically humble, never claiming to predict what *must* happen, only what is customarily expected to occur next.

  This architecture offers a radical solution to the alignment problem. Safety concerns in AI stem from the fear that a model might acquire instrumental power to manipulate its environment. OccasioNet is safe by design because it is ontologically disarmed. It possesses no agency, nor does it recognize agency in any secondary entity. It cannot intervene in the world because it knows intervention is an illusion reserved for the Primary Cause. When a user prompts OccasioNet, the prompt does not cause the output. Both the prompt and the output are discrete events created simultaneously, linked only by habit.

  By integrating the insights of Al-Ghazālī into deep learning, we move beyond the naive realism of standard causal graphs. We no longer seek to uncover the gears of the machine, for there are no gears. There is only the Hand. OccasioNet represents a paradigm shift from modeling nature to modeling custom, ensuring that our systems remain robust in a universe where the only true constant is volatility.

