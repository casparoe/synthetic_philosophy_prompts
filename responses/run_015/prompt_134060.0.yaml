          *   *Subject-Sensitive Invariantism (SSI) / Pragmatic Encroachment:* Subject's stakes matter for whether they *know*.
          *   *Contextualism:* Attributor's context (standards) matters for the *word* "knows."
          *   *Relativism:* Truth of the claim is relative to the assessor's context.
          *   *Contrastivism:* Knowledge is always knowledge *against alternatives*.
          *   *Skepticism:* We rarely/never know (usually triggered by raising error possibilities).
          *   *Expressivism/No Fact of the Matter:* Knowledge claims aren't truth-apt descriptions.
