  # The Knowledge Sorting Tree

  **Instructions:** Start at the top. Read the scenario and question aloud. Each member of the group chooses the answer that best matches their intuition. Follow the arrow to the next node. Continue until you reach a leaf. The leaf names are theoretical positions; the text below them explains what that position means and what cost comes with it.

  **Start Node:** Hanne checked the ferry timetable on her phone this morning; it is now mid-afternoon; she tells a friend that the last boat leaves at 18:40; if she is wrong the friend takes a taxi and arrives twenty minutes late.
  *Consensus:* Everyone agrees Hanne **knows** the boat leaves at 18:40.

  ---

  ### Node 1: The Subject's Stakes (Maya & Rob)
  Maya and Rob read the same departures board at the same moment and have exactly the same evidence about the 18:40 ferry. Maya is going to a birthday dinner; if she misses it, she is mildly annoyed. Rob is a marine mechanic; if he misses it, a vessel's bilge alarm goes unattended and someone could be injured.
  **Question:** Does Maya know the ferry leaves at 18:40, and does Rob?
  *   **(A)** Maya knows, but Rob does not. (Their knowledge status differs.) → *Go to Node 2.*
  *   **(B)** Both of them know. (Their knowledge status is the same.) → *Go to Node 5.*
  *   **(C)** Neither of them knows. (The evidence was never good enough for either.) → *Go to Node 9.*

  ### Node 2: Awareness of Stakes (Priya)
  Priya runs a calibration check on a hospital machine at 09:00, writes the result in the log, and has excellent evidence that it was calibrated. At 16:00, without her knowing, the machine's output is used to set a radiation dose for a patient.
  **Question:** Did Priya know at 09:00 that the machine was calibrated?
  *   **(A)** Yes, she knew. (Her ignorance of the high stakes protects her knowledge.) → *Go to Node 3.*
  *   **(B)** No, she did not know. (The stakes were objectively high, regardless of her awareness.) → **Leaf 1.**

  ### Node 3: Salience of Error (The Cache)
  At dinner, a guest mentions that the ferry company migrated its website last night and that caches have been known to serve out-of-date timetables. Nobody is relying on the timetable for anything important right now.
  **Question:** Has this remark, by itself, changed whether Hanne knows?
  *   **(A)** No, she still knows. (Mentioning a glitch doesn't remove knowledge unless stakes rise.) → **Leaf 2.**
  *   **(B)** Yes, she no longer knows. (Mentioning the possibility of error is enough to remove knowledge.) → *Go to Node 4.*

  ### Node 4: The Attributor's Stakes (The Stranger's Bet)
  You are talking about Hanne. A stranger, as a joke, tells you that they will donate a large sum to a cause you find abhorrent if *you* are wrong about whether Hanne knows the timetable. Nothing about Hanne's evidence has changed; only your personal stake in the accuracy of your claim has risen.
  **Question:** Can you truly say "Hanne knows"?
  *   **(A)** No, I cannot say it. (My high stakes stop me from attributing knowledge to her.) → *Go to Node 4b.*
  *   **(B)** Yes, I can say it. (My stakes don't change her mental state.) → **Leaf 3.**

  ### Node 4b: Relative Truth (Retraction)
  Imagine you said "Hanne knows" when stakes were low. Now stakes are high (for you). Your friend says, "What you said earlier was false."
  **Question:** Is your friend correct?
  *   **(A)** Yes, what I said is false *for me now*. (Truth depends on who is judging it.) → **Leaf 4.**
  *   **(B)** No, what I said was true *then*, but I shouldn't say it *now*. (Truth depends on the conversation context.) → **Leaf 5.**

  ### Node 5: Arbitrary Stakes (The Museum Bet)
  A stranger tells you that they will donate a large sum to a cause you find abhorrent if *you* are wrong about whether the museum is closed on Mondays. Your evidence is a sign on the door; it hasn't changed.
  **Question:** Do you know that the museum is closed on Mondays?
  *   **(A)** Yes, I still know. (Stakes never change knowledge.) → *Go to Node 6.*
  *   **(B)** No, I don't know. (Stakes change knowledge, even if I'm the only one affected.) → **Leaf 6.**

  ### Node 6: Salience Revisited (The Cache)
  Return to the ferry case. The guest mentions the website cache glitch. No one is relying on the timetable.
  **Question:** Does Hanne still know the time?
  *   **(A)** Yes, she knows. (Mentioning error possibilities doesn't matter.) → *Go to Node 7.*
  *   **(B)** No, she doesn't know. (Mentioning error possibilities raises the standard.) → *Go to Node 8.*

  ### Node 7: Action vs. Description
  Hanne knows the time (from Node 6A). But suppose the stakes for her friend become very high (e.g., missing the boat means missing a life-saving treatment).
  **Question:** Does Hanne know the time, but should not act on it?
  *   **(A)** No, if she shouldn't act on it, she doesn't know it. (Knowledge and action are linked.) → **Leaf 7.**
  *   **(B)** Yes, she knows it, but it's too risky to use. (Knowledge and rational action can come apart.) → **Leaf 8.**

  ### Node 8: The Scope of Doubt (Skepticism)
  If mentioning the cache glitch (Node 6B) stops Hanne from knowing, consider that there is always *some* possibility of error (e.g., mass hallucination, simulation).
  **Question:** Does this mean we hardly ever know anything?
  *   **(A)** Yes, we hardly ever know. (Standards are usually too high to meet.) → **Leaf 9.**
  *   **(B)** No, we know plenty in ordinary life. (Standards rise only in special conversations.) → **Leaf 5.** (Merge with Contextualism).

  ### Node 9: Contrast
  Consider the question: "Does Hanne know the ferry leaves at 18:40?"
  **Question:** Is that a different question from "Does Hanne know the ferry leaves at 18:40 *rather than 18:50*?"
  *   **(A)** Yes, knowledge is always about ruling out specific alternatives. → **Leaf 10.**
  *   **(B)** No, knowledge is a simple relationship between person and fact. → *Go to Node 10.*

  ### Node 10: Description vs. Endorsement
  When you say "Hanne knows," what are you doing?
  **Question:** Are you describing a fact about her brain, or telling your friend "It is safe to trust her"?
  *   **(A)** Telling them to trust her. (It's a recommendation, not a description.) → **Leaf 11.**
  *   **(B)** Describing a fact about her brain. (It's a description of reality.) → **Leaf 12.**

  ---

  ### The Leaves

  **Leaf 1: Objective Pragmatic Encroachment**
  *Characterisation:* Knowledge depends on the practical stakes, even if the subject is unaware of them.
  *Awkward Commitment:* You must accept that Priya lost knowledge at 09:00 due to events at 16:00 she could not possibly foresee.

  **Leaf 2: Subject-Sensitive Invariantism**
  *Characterisation:* Knowledge depends on the subject's practical situation, but not merely on mentioning error possibilities.
  *Awkward Commitment:* You must explain why Rob loses knowledge while Maya keeps it, despite their evidence being identical.

  **Leaf 3: Classical Invariantism (Attributor Version)**
  *Characterisation:* Knowledge is fixed by evidence and truth; your personal stakes in the conversation do not change it.
  *Awkward Commitment:* You must accept that you can truly say "Hanne knows" even if acting on that claim would cost you a fortune.

  **Leaf 4: Relativism**
  *Characterisation:* The truth of a knowledge claim depends on the context of the person assessing it, not just the speaker.
  *Awkward Commitment:* You must accept that "Hanne knows" can be true for you and false for me at the very same moment.

  **Leaf 5: Attributor Contextualism**
  *Characterisation:* The word "knows" changes its strictness depending on the conversation's context, not the subject's stakes.
  *Awkward Commitment:* You must accept that you spoke falsely earlier when you said "Hanne knows," simply because the conversation got more serious.

  **Leaf 6: Interest-Relative Invariantism**
  *Characterisation:* Knowledge depends on the subject's interests, even if the stakes are arbitrary or external.
  *Awkward Commitment:* You must accept that a stranger's whim can destroy your knowledge without changing your evidence.

  **Leaf 7: Knowledge-Action Unity**
  *Characterisation:* If it is not rational to act on a belief, it does not count as knowledge.
  *Awkward Commitment:* You must accept that Hanne loses knowledge the moment the stakes rise, even if she never hears about the stakes.

  **Leaf 8: Knowledge-Action Separation**
  *Characterisation:* You can know something but be irrational to act on it if the stakes are too high.
  *Awkward Commitment:* You must explain what use "knowledge" is if it does not guarantee it is safe to act.

  **Leaf 9: Skepticism**
  *Characterisation:* The standards for knowledge are so high that we rarely or never meet them.
  *Awkward Commitment:* You must accept that you do not know you have hands, or that the sun will rise tomorrow.

  **Leaf 10: Contrastivism**
  *Characterisation:* Knowledge is not a relationship between a person and a fact, but a person, a fact, and a set of alternatives.
  *Awkward Commitment:* You must accept that "Hanne knows" is an incomplete sentence unless you specify what she knows *instead of*.

  **Leaf 11: Expressivism**
  *Characterisation:* Knowledge claims are not true or false; they are tools to endorse someone's reliability.
  *Awkward Commitment:* You must accept that there is no fact of the matter about whether Hanne knows, only about whether we trust her.

  **Leaf 12: Classical Invariantism (Strict)**
  *Characterisation:* Knowledge depends only on truth, belief, and evidence; stakes and context are irrelevant.
  *Awkward Commitment:* You must accept that Rob knows the ferry time even if acting on it risks someone's life.

  ---

  ### Appendix: The Logical Space

  This appendix maps the positions above onto the underlying philosophical distinctions. It shows which combinations of views are occupied and which are empty.

  **The Four Dimensions of Disagreement**
  1.  **Whose Situation Matters?** (Subject's stakes / Attributor's context / Neither / Both)
  2.  **What Shifts?** (The standard for "knows" / The fact of knowledge itself / Nothing)
  3.  **Truth Status:** (Absolute / Relative to assessor / Not truth-apt)
  4.  **Link to Action:** (Knowledge entails rational action / Knowledge is separate from action)

  **Mapping the Positions**

  | Position | Whose Situation? | What Shifts? | Truth Status | Link to Action |
  | :--- | :--- | :--- | :--- | :--- |
  | **Classical Invariantism** | Neither | Nothing | Absolute | Separate |
  | **Subject-Sensitive Invariantism** | Subject | Fact of Knowledge | Absolute | Unified |
  | **Objective Encroachment** | Subject (Objective) | Fact of Knowledge | Absolute | Unified |
  | **Attributor Contextualism** | Attributor | Standard for "Knows" | Absolute (Contextual) | Separate |
  | **Relativism** | Assessor | Truth of Claim | Relative | Separate |
  | **Contrastivism** | Neither | Relation Structure | Absolute | Separate |
  | **Expressivism** | Neither | Nothing (Non-cognitive) | Not Truth-Apt | Unified |
  | **Skepticism** | Neither | Standards (High) | Absolute | Separate |

  **Empty or Unattractive Cells**
  *   **Subject Stakes + Relative Truth:** (The subject's stakes make the truth relative to the assessor). *Status:* **Incoherent.** If the subject's stakes determine the fact, the assessor's perspective shouldn't change the truth value.
  *   **Attributor Stakes + Fact Shifts:** (My stakes change *your* knowledge fact). *Status:* **Unattractive.** This implies magical causation where my betting habits alter your mental state.
  *   **Action Separate + Encroachment:** (Stakes change knowledge, but you can still act). *Status:* **Unexplored.** If stakes change knowledge, usually it is because they change what it is rational to do. Separating them makes the "knowledge" change idle.

  ---

  ### Analysis of the Tree

  **Indistinguishable Leaves**
  *   **Leaf 2 (SSI) and Leaf 6 (IRI):** In practice, these often yield the same verdicts. The distinction is theoretical: does the stake have to be *important* to the subject (SSI) or just *present* (IRI)?
      *   *Further Case:* A case where the subject has high stakes but doesn't care (e.g., a millionaire risking $1000). SSI might say they know (no interest); IRI might say they don't (high stakes).
  *   **Leaf 5 (Contextualism) and Leaf 4 (Relativism):** Both allow "Hanne knows" to be acceptable in low stakes and unacceptable in high stakes.
      *   *Further Case:* Retraction. If you said "Knows" yesterday (low stakes), do you say "I was wrong" today (high stakes)? Relativists say "Yes, it's false for me now." Contextualists say "No, it was true then."

  **Messy Answer Patterns**
  *   **The "Action-Only" Pattern:** A member might say Rob *knows* (Node 1) but *shouldn't act* (Node 7). This lands between Leaf 8 and Leaf 12.
      *   *Advice:* This is a stable position (Warrant for Action). Encourage them to see if they think "Knowledge" is the right word for Rob, or if they prefer "Rob is sure, but shouldn't act."
  *   **The "Salience-Only" Pattern:** A member might say Maya and Rob both *know* (Node 1), but the Cache remark stops Hanne from *knowing* (Node 3). This lands between Leaf 5 and Leaf 9.
      *   *Advice:* This suggests they are sensitive to conversational standards (Contextualism) but not practical stakes. Push them on Node 8: if a mere remark stops knowledge, how do we ever know anything?

  ---

  ### Glossary of Terms (For Facilitators)

  *   **Attributor:** The person saying "S knows." (e.g., You, talking about Hanne).
  *   **Subject:** The person who might know. (e.g., Hanne).
  *   **Encroachment:** The view that practical factors (stakes) can change whether someone has knowledge.
  *   **Invariantism:** The view that the standards for knowledge do not change with context or stakes.
  *   **Salience:** How noticeable or prominent a possibility of error is in the conversation.
  *   **Truth-Apt:** Capable of being true or false. (Expressivism says knowledge claims are *not* truth-apt).
  *   **Warrant:** The justification or permission to believe or act.
