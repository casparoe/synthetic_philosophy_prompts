      If you adopt the deflationary view—that representation claims are answerable only to usefulness for prediction and control—your concrete practices would shift rhetorically rather than methodologically. You would continue running probes, patches, and dictionaries, but you would stop claiming to have "found" the model's features.
      1.  **Probes:** Report accuracy as "extractability," not "representation." Acknowledge that high accuracy proves decodability, not that the model uses that code.
      2.  **Patching:** Treat this as the gold standard for behavioral claims. If patching works but probing fails (as in cross-model stitching), trust the patch.
      3.  **Dictionaries:** Describe features as "useful bases for compression" rather than "semantic atoms." Stop expecting convergence as dictionary size grows.

      Honestly, nothing would change in how you run experiments, because the methods are tools for manipulation and prediction regardless of ontology. What changes is trust: you would trust patching over probing for behavioral explanations, and you would treat dictionary features as human-interpretable summaries rather than discovered truths. You would admit that when probes disagree across models, there is no further fact of the matter about which one is "right." The realist story is convenient for narrative, but the deflationary view is what the mathematics actually supports.

