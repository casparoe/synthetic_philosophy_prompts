      The three practices jointly commit you to the view that representation is constituted by the availability of information for downstream use, not by the intrinsic identity of specific activation vectors.

      Your methods reconstruct a theory where internal states represent properties if those properties are recoverable by simple readouts (probing), causally efficacious when manipulated (patching), and decomposable into sparse components (dictionary learning). This hybrid view treats representation as a real, structural feature of the model: you assume there is a "fact of the matter" about which directions encode "French" or "sarcasm," and that these directions are the mechanisms driving behavior. You presuppose a causal-role view—states represent because downstream processing uses them—but you conflate the "role" with specific geometric structures (vectors or bases). You assume that if a linear probe works, the model explicitly represents the property in that subspace, and if a dictionary learns a feature, that feature is a computational atom.

      However, findings (a)–(c) sever the link between representation and specific vectors. Finding (a) shows no unique direction exists; (b) shows equivalent computation occurs across non-aligned spaces; (c) shows probes measure alignment, not just information. This forces a distinction between what your methods strictly require and what they merely assume.

      | Aspect | Strict Presupposition | Challenged Assumption |
      | :--- | :--- | :--- |
      | **Ontology** | Information must be recoverable and causally relevant. | Specific vectors or sparse features are the unique bearers of content. |
      | **Evidence** | Interventions must change output; readouts must predict property. | High probe accuracy proves the model "uses" that direction. |
      | **Stability** | Functional behavior is stable across training runs. | Activation spaces and feature bases are stable across training runs. |

      Theories compatible with your practices include structural realism (features exist independently), but findings (a) and (b) render this untenable. A deflationary view—where representation is just a useful summary of input–output maps—is strictly compatible with the methods but undermines the realist story you tell. The underdetermined question is whether the "representation" exists prior to the probe. Your methods cannot distinguish between "the model represents X" and "we can construct a device to extract X from the model."

