  Rational peers must lower confidence held.
  No new fact enters where the sums merge.
  We share the evidence yet judgments diverge.

  I share the evidence yet your judgments diverge.
  I see the framing bias skewed your view.
  Second-order knowledge breaks the symmetric urge.
  I share the evidence yet your judgments diverge.

