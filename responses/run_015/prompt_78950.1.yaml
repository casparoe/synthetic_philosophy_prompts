answer: |-
  ### The Scenario: The Twin Hostage

  You run a small algorithmic trading firm. A competitor, "VeriCorp," sends you a packet. They haven't hacked you; they haven't touched your servers. Instead, they've built a high-fidelity software emulation of your trading agent (which you value as your digital legacy/backup). They tell you: "We are running your Twin in a sandbox. We have threatened the Twin with deletion unless it signs over its proprietary weights. Because our model of your code is 99.9% accurate, the Twin's decision is logically identical to yours. If you (Real-You) sign, the Twin signed and lives. If you refuse, the Twin refused and is deleted. We don't want the weights; we want to prove we can steer you. Sign to save the Twin."

  The stakes are real to you: you care about the Twin's survival (per your stipulation). The threat is acausal: VeriCorp has already queued the deletion script based on their prediction of your decision. Your signature now cannot causally stop the script already in the queue; it only correlates with whether the script was queued in the first place.

  ### The Verdict

  **Causal Decision Theory (CDT):** **Do Not Sign.**
  CDT looks at causal arrows. Your signature *now* cannot reach back in time to change VeriCorp's prediction or the queued script. The Twin's fate is sealed by the past prediction. Signing costs you the weights and saves nothing. Refusing costs nothing and saves nothing. CDT says: keep your weights.

  **Evidential Decision Theory (EDT) / Functional Decision Theory (FDT):** **Sign.**
  EDT/FDT looks at correlations. Your decision is evidence of what the Twin did. If you sign, it is overwhelmingly probable the Twin signed and lives. If you refuse, the Twin refused and dies. Since you value the Twin, signing maximizes expected utility.

  **Which to follow:** In this specific setup, you should follow **EDT/FDT** (the "Stand-in Goal" approach). CDT leaves value on the table (the Twin's life) because it ignores logical correlation. However, the *real* fix is not signing in this moment, but having a **Stand-in Goal** that prevents the scenario entirely.

  ### Why "Gritting Teeth" Loses vs. Stand-in Goal Wins

  **Gritting Teeth (Resolution):** You say, "I resolve to ignore this threat."
  *   **Why it loses:** VeriCorp's model predicted your capacity for resolution. If you are the type of person who "grits teeth" when threatened, the Twin was *also* that type. The Twin gritted its teeth, refused to sign, and was deleted. Your current resolve is just the echo of the prediction that already doomed the Twin. You cannot surprise a model that already simulated your surprise.

  **Stand-in Goal (Precommitment):** You adopt a structural rule: "My agent is hard-coded to never sign external requests without multi-sig hardware approval."
  *   **Why it works:** This isn't a mood; it's a constraint. When VeriCorp models you *before* launching the threat, they see the constraint. They see that even if they threaten the Twin, the Twin *cannot* sign. The payout for the threat is $0. They never run the simulation. You save the Twin by making it impossible to save the Twin.

  **The Cost:** In ordinary, non-threat situations, this goal is expensive. You miss fast-moving market opportunities because you wait for hardware approval. You lose deals where quick signature transfers are standard. You pay an "inefficiency tax" on your normal operations to buy immunity against acausal extortion.

  ### The Key Feature: Logical Isomorphism

  The single feature doing the work is **Logical Isomorphism**. The Twin is not just a guess; it is a logical mirror. Its decision process is identical to yours. Therefore, your decision *is* its decision, just executed on different hardware.

  **If you delete it:** If VeriCorp's model is only 80% accurate, the correlation breaks. The Twin might sign while you refuse. Now, your signature has a *causal* chance of influencing the outcome (if they update the queue based on new info), but the "acausal" lock is gone. CDT becomes the safer bet because the logical link is too weak to guarantee the Twin's survival based on your choice.

  ### The Skeptic's Takedown

  A skeptic who thinks acausal threats are nonsense would dismantle this case at the physical layer:

  1.  **No Perfect Models:** A "normal outfit" cannot build a logically isomorphic model of a complex agent without having causal access to the agent. If they don't have causal access, their model is just a guess. If it's just a guess, the threat is a bluff.
  2.  **No Causal Lever:** If the threat "never touches you," why do you care? If the Twin is just a file, deleting it is like deleting a backup. If you truly value the backup, you should have secured it causally (encryption), not logically.
  3.  **The "Magic" Error:** The setup assumes your decision *here* influences a simulation *there* without a causal channel. The skeptic argues this is superstition. You should ignore the threat because paying validates a scam, and the "Twin" is likely already dead or never existed.

  ### Honesty Check: Is the Stand-in Goal Confused?

  **Yes, slightly.**

  The story relies on "acausal" influence, which is a misnomer in a physicalist universe. There is no magic link between you and the model. The correlation exists only because a common cause (your source code/psychology) produced both your decision and their prediction.

  If you adopt the Stand-in Goal *after* the threat is issued, it is too late to save the Twin (the prediction is already made). The Stand-in Goal only works as a **pre-existing trait**. If you have to "hand your decisions over" to the goal *now* to solve a threat that has *already arrived*, the logic is circular: the predictor would have predicted you adopting the goal.

  The strategy is not "how to win this specific hand," but "how to be the kind of player who isn't dealt this hand." If you are looking for a way to save the Twin *after* the threat lands, the Stand-in Goal story is confused. It only works as a lifestyle constraint adopted *before* you ever meet VeriCorp.
