answer: |-
  **Case L (The Checksum Constraint)**
  You are verifying 900 digital asset tags for the library's new catalog. The IT lead informs you that the migration script had a known buffer overflow: it successfully processed the batch but *necessarily* corrupted exactly one tag checksum during the transfer. You inspect the 900 tags individually; each displays a valid format, matches the physical label, and scans without error. For any single tag, the evidence overwhelmingly supports the belief "This tag is valid." However, you cannot sign the final certification stating "All 900 tags are valid," because the script's behavior guarantees this conjunction is false. You do not add a rueful note about human fallibility; you simply leave the aggregate statement unsigned. The pull to accept each item is maximal, but the pull to reject the lump is logical and absolute, leaving no room for humble doubt.

  **Case P (The Human Review)**
  You are verifying 900 digital asset tags for the library's new catalog. There is no script error; the migration was theoretically perfect. You inspect the 900 tags individually; each displays a valid format, matches the physical label, and scans without error. For any single tag, the evidence overwhelmingly supports the belief "This tag is valid." You sign the final certification stating "All 900 tags are valid," as there is no logical barrier to doing so. However, knowing that manual verification of this volume historically misses at least one typo, you append a preface note: "While each item was individually verified, the reviewer acknowledges the high probability that at least one error remains undetected." The pull to accept each item is maximal, and the pull to accept the lump is strong enough to sign, but it is shadowed by the rueful conviction that the conjunction is likely false.

  ***

  **Per-Item and Aggregate Attitudes**
  In both cases, the per-item attitude is **full acceptance** ("This tag is valid"). In Case L, the aggregate attitude is **rejection** ("It is false that all are valid"). In Case P, the aggregate attitude is **acceptance with reservation** ("All are valid, but likely not").

  **The Varied Feature**
  The single feature varied is the **Modal Status of the Error** (specifically, whether an error is *structurally guaranteed* or merely *inductively expected*). In Case L, the system architecture necessitates exactly one error (logical necessity). In Case P, the system allows for perfection, but human limitations make error probable (contingent probability).

  **Why It Pushes Verdicts Oppositely**
  This feature separates the *logical impossibility* of the conjunction from the *epistemic humility* regarding it. In Case L, the guarantee makes the conjunction logically contradictory to known facts, triggering the Lottery intuition that aggregating high-probability beliefs can yield a known falsehood. In Case P, the absence of a guarantee makes the conjunction logically consistent, allowing you to assert it (weak Lottery pull) while simultaneously believing its negation based on fallibility (strong Preface pull).

  **Flattening the Feature**
  If you flatten this feature by removing the script guarantee in Case L, it collapses into Case P (you would sign off with a rueful note). If you impose the script guarantee on Case P, it collapses into Case L (you could no longer in good faith sign the "All Valid" statement, removing the Preface tension).

  **The Unified Theorist's Complaint**
  A proponent of a single unified solution (e.g., a probabilistic threshold theorist) would argue that I have rigged Case L by smuggling in **deductive knowledge** where the paradox requires **justified belief**. The Lottery Paradox is supposed to arise from high probabilities alone, not from a premise that guarantees failure. By making the error in Case L a structural necessity, I have turned the "wrong to lump" verdict into a trivial deduction rather than an epistemic puzzle. They would claim I haven't separated the paradoxes; I've simply replaced the Lottery Paradox in Case L with a standard logical contradiction, thereby begging the question against any theory that attempts to handle both paradoxes using the same probabilistic machinery.
