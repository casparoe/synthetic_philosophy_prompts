prompt: |-
  I'm running a peer tutorial next week for about twelve second-years in my philosophy-and-economics course — fifty minutes, and the topic is interpersonal utility comparisons. They've done basic consumer theory and Arrow's theorem but nothing on social welfare functions. I dont need the topic explained to me, I need a plan for explaining it: what has to be in place before the question even makes sense to them, and in what order the rest has to come.

  My hypothesis is that the real mess is that three different comparability claims get run together: comparing how well off two people are overall (levels), comparing the *size* of a gain across people (differences), and comparing units or scale so that one person's gain can count as twice another's. Is that the spine to build the session around, or too much for fifty minutes?

  I was going to carry it with one case: a fixed budget split between an able-bodied student and a wheelchair user who needs far more money to reach the same level of mobility. But that might drag in desert and disability stuff I don't want to get stuck arguing about. Is there a better carrying example, and what would it need to have and to lack?

  Misconceptions I'm expecting: "utility is just happiness, so this is easy"; "you can't compare, so fall back on Pareto"; "just use willingness to pay". Where in the sequence should I head each one off, and what should I flat-out refuse to cover? My tutor keeps saying Pareto is the only criteron you get for free and that it can't rank anything — I want them to feel that by the end. And give me one question to ask at the end that shows me whether they actually got it rather than just learned to say "it depends".
reasoning: |-
  Here's a thinking process that leads to the suggested tutorial plan:

  1.  **Analyze the Request:**
      *   **Audience:** 12 second-year students (Philosophy & Economics).
      *   **Background:** Basic consumer theory (preferences, utility functions as ordinal representations), Arrow's Theorem (impossibility of aggregating ordinal preferences without dictatorship, etc.).
      *   **Topic:** Interpersonal Utility Comparisons (IUC).
      *   **Constraint:** 50 minutes.
      *   **Goal:** A structured plan (order of operations), not an explanation of the topic itself.
      *   **User's Hypothesis:** The core confusion lies in conflating three types of comparability (levels, differences, units).
      *   **User's Proposed Example:** Budget split between able-bodied vs. wheelchair user (concerns: might drift into disability/desert ethics).
      *   **Expected Misconceptions:** Utility = happiness (cardinal/hedonic), "Can't compare -> Pareto only", Willingness to Pay (WTP) as a solution.
      *   **Tutor's Mantra:** Pareto is the only "free" criterion but ranks almost nothing.
      *   **Deliverables:** Structure/Order, Example evaluation/alternative, Misconception handling, Refusals, Final Assessment Question.

  2.  **Evaluate the User's Hypothesis (The "Spine"):**
      *   *Hypothesis:* Levels vs. Differences vs. Units.
      *   *Verdict:* This is technically precise (Sen's distinctions), but is it too much for 50 mins?
      *   *Adjustment:* It *is* the spine, but it needs simplification. "Units" is often a proxy for "Differences" in introductory contexts. The critical distinction for Social Welfare Functions (SWF) is usually **Ordinal Non-Comparable** (Arrow) vs. **Cardinal Comparable** (Utilitarianism).
      *   *Refinement:* Let's stick to the User's intuition but frame it as "What information do we need to make a judgment?"
          1.  Who is better off? (Levels)
          2.  How much did they gain/lose? (Differences)
          3.  Do our scales match? (Unit Comparability)
      *   *Decision:* Yes, keep this spine. It's the most rigorous way to prevent the "happiness" confusion.

  3.  **Evaluate the Example (Wheelchair vs. Able-bodied):**
      *   *Pros:* Intuitive need for resource transfer.
      *   *Cons:* As the user noted, it triggers "desert," "fairness," "medical need," and "equality of outcome vs. opportunity." It distracts from the *measurement* problem to the *normative* problem.
      *   *Alternative:* Needs to be sterile. Pure preference satisfaction.
      *   *Idea:* The "Pizza vs. Sushi" problem? No, that's intra-personal.
      *   *Idea:* The "Robinson Crusoe & Friday" allocation.
      *   *Better Idea:* **The Air Conditioning Problem.** Two roommates, one thermostat. One runs hot, one runs cold.
          *   Why? It's about subjective sensation (utility) without invoking "need" or "desert." It highlights that $1 doesn't buy the same utility for both.
      *   *Even Better Idea (Standard Econ):* **The $100 Gift.** Splitting cash between two people with different marginal utilities of income.
          *   *Problem:* Assumes diminishing marginal utility of income, which might beg the question of comparability.
      *   *Best Idea:* **The "Painful Medicine" or "Boring Task" Allocation.**
          *   Scenario: Two students must share a burden (e.g., writing a report, or enduring noise).
          *   Why? It isolates *disutility*.
      *   *Actually, let's stick closer to the User's instinct but sanitize it.* The "Expensive Taste" problem (Dworkin/Cohen).
      *   *Selection:* **The "Concert Ticket" Example.** Two people, one ticket.
          *   Person A: Loves music, gets 100 utils.
          *   Person B: Likes music, gets 10 utils.
          *   *Twist:* How do we know? WTP? (Rich vs. Poor).
          *   *Refinement:* Let's use the **"Heating Bill"** example. It's classic, sterile, and highlights the difference between resources and welfare.
          *   *Wait, the User wants to avoid "need".*
          *   *Let's go with the "Cake Division" but with a twist.*
          *   *Decision:* I will advise modifying the Wheelchair example to be about **"Expensive Tastes"** (e.g., one person needs expensive insulin to function, one needs nothing). No, that's medical.
          *   *Okay, let's go with the **"Temperature/Thermostat"** example.* It's purely subjective, no "need," just preference intensity.
          *   *Wait, I need to check the "WTP" misconception.* The Thermostat example works well against WTP if we assume equal wealth.
          *   *Final Decision on Example:* **The "Noisy Neighbor" / "Quiet Study" Scenario.** Two roommates. One values quiet at $X, one values music at $Y. It forces the comparison of intensity without invoking basic needs.
          *   *Actually, for 2nd years who know Arrow:* The **"Dictator Game" with Utility Numbers.** Give them matrices. It's abstract but precise.
          *   *Compromise:* Use a simple resource allocation (Cake) but vary the *utility functions* explicitly. Keep it abstract enough to avoid ethics, concrete enough to feel real. Let's suggest the **"Two Patients, One Dose"** but strip the medical urgency. No, that's trolley problem.
          *   *Okay, I'll recommend the **"Expensive Taste"** variant of the budget split.* Person A gets utility from cheap books. Person B gets utility from rare wines. Same budget. Who is better off? This hits the "levels" and "units" problem without disability politics.

  4.  **Structure the 50 Minutes:**
      *   **0-5 min:** Hook & Diagnostic. (The "Happiness" trap).
      *   **5-15 min:** The Arrow Baseline. (Why Pareto fails).
      *   **15-30 min:** The Three Comparisons (The Spine). Using the Example.
      *   **30-40 min:** The WTP Trap. (Why money isn't utility).
      *   **40-50 min:** Synthesis & Final Question.

  5.  **Addressing Misconceptions:**
      *   *Utility = Happiness:* Kill this early. Define utility as preference satisfaction (ordinal).
      *   *Pareto:* Show, don't tell. Use a Edgeworth box logic or simple matrix to show Pareto leaves most things unranked.
      *   *WTP:* Address this when discussing "Units/Scale." Money is not a common utility metric.

  6.  **The "Refusal" List:**
      *   Don't solve it. (There is no solution).
      *   Don't discuss specific SWFs (Utilitarian vs. Rawlsian) in depth, just the *informational requirements*.
      *   Don't let them argue about "fairness" (Normative) instead of "measurability" (Positive/Informational).

  7.  **The Final Question:**
      *   Needs to test if they understand *why* it's hard, not just *that* it's hard.
      *   Scenario: Give them two utility functions. Ask if a transfer is justified. If they say "yes" without assuming comparability, they failed. If they say "we need to know if the scales match," they passed.

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Spine:* The User's hypothesis is good. It's essentially Sen's classification of informational bases. I will validate this but simplify the terminology for 2nd years.
      *   *Example:* I will suggest swapping the wheelchair example for the "Expensive Tastes" (Champagne vs. Beer) example. It keeps the "different costs to reach satisfaction" structure without the ethical baggage of disability.
      *   *Sequence:*
          1.  Define Utility (Ordinal).
          2.  Show Pareto's limits (The "Everything is tied" problem).
          3.  Introduce the Example.
          4.  Try to solve it with Levels (Who is happier?).
          5.  Try to solve it with Differences (Who gains more?).
          6.  Try to solve it with Units (Are our rulers the same?).
          7.  Crush WTP.
      *   *Final Question:* A specific numerical puzzle where the answer changes based on the *assumption* of comparability.

  9.  **Review against Constraints:**
      *   50 mins is tight. Need to be ruthless on timekeeping.
      *   12 students = good for breakout pairs.
      *   Philosophy & Econ majors = can handle abstract logic, but prone to normative drift.

  10. **Final Polish:** Ensure the tone is supportive but directive. Emphasize the "Informational Basis" angle (Sen) as that bridges Phil and Econ.

  *(Self-Correction during drafting)*: I initially thought about suggesting the Thermostat example. But the "Expensive Tastes" (Champagne vs. Beer) is better for Econ students because it links to budget constraints and marginal utility, which they know. It highlights that *resources* $\neq$ *utility*.

  Let's refine the "Spine". The user said: Levels, Differences, Units.
  Actually, in Sen's framework:
  1.  Level Comparability (Who is better off?)
  2.  Unit Comparability (Is my util your util?) -> allows Difference Comparability.
  So "Units" and "Differences" are linked. If units are comparable, differences are. If units aren't, differences aren't.
  I should advise the user to group "Differences" and "Units" closely, or treat "Units" as the *condition* for "Differences".
  *Correction:* Let's keep the user's three but clarify the dependency. You can't compare differences without comparable units. You can't compare levels without a common zero (or at least unit comparability + origin).
  Actually, for 50 mins:
  1.  **Ordinality** (Arrow's starting point).
  2.  **Levels** (Interpersonal Level Comparability).
  3.  **Units/Differences** (Interpersonal Unit Comparability).
  This is cleaner.

