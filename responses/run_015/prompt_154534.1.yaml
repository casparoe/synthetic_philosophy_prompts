answer: |-
  This is a tight 50 minutes, but your hypothesis is correct: the confusion is almost always about *what information is required* to make a judgment, not the judgment itself. Your spine (Levels vs. Differences vs. Units) is exactly right, but for second-years, I would compress "Differences" and "Units" into one block, because unit comparability is the *condition* for comparing differences.

  Here is a battle plan to keep you on time and on topic.

  ### 1. The Spine: Informational Bases (Not Ethics)
  Your hypothesis is the correct spine, but frame it as **"What data do we need?"** rather than "What is fair?"
  *   **0–5 mins:** Define Utility (Ordinal Preference Satisfaction). Kill "Happiness."
  *   **5–15 mins:** The Pareto Dead End. Show *why* it ranks nothing.
  *   **15–35 mins:** The Three Bars to Entry (Levels, Units/Differences).
  *   **35–45 mins:** The WTP Trap.
  *   **45–50 mins:** Final Assessment.

  **Is it too much?** No, provided you do not let them argue about *which* Social Welfare Function is morally right. You are teaching the **informational requirements** of those functions, not evaluating the functions themselves.

  ### 2. The Carrying Example
  **Drop the wheelchair example.** You are right to worry; it invites arguments about "need," "desert," and "structural injustice," which are normative. You want to isolate the *measurement* problem.

  **Use the "Expensive Tastes" Example (Champagne vs. Beer).**
  *   **Setup:** Two agents, equal income ($100).
  *   **Agent A:** Gets high satisfaction from cheap beer ($5/bottle).
  *   **Agent B:** Only gets satisfaction from rare champagne ($50/bottle).
  *   **The Problem:** We want to maximize total welfare. Should we transfer money from A to B?
  *   **Why it works:**
      *   It keeps "need" out of it (B isn't disabled, just picky).
      *   It highlights that **Resources $\neq$ Utility**.
      *   It forces the question: Is B's marginal utility *actually* higher, or is their scale just different?
      *   It sets up the WTP rebuttal perfectly (B is willing to pay more, but does that mean they feel more?).

  ### 3. Sequence & Misconception Management

  #### Phase 1: The Baseline (0–15 mins)
  *   **Action:** Write two utility functions on the board: $U_1(x)$ and $_2(x)$. Remind them these are ordinal representations of preference orderings.
  *   **Misconception:** *"Utility is happiness."*
      *   **Shut it down:** "If I say $U_1 = 100$ and $U_2 = 50$, does Person 1 feel twice as happy? No. It just means they prefer bundle A to B. The numbers are arbitrary labels."
  *   **Action:** Invoke Arrow. "We have ordinal, non-comparable preferences. What can we rank?"
  *   **Misconception:** *"Pareto solves this."*
      *   **The Drill:** Draw a simple 2x2 matrix of outcomes. Make sure every move helps one person and hurts the other. Ask: "Which is better?"
      *   **The Point:** They will say "It depends." You say: "Exactly. Pareto is silent on distribution. If you want to rank these, you must leave Arrow's informational base."

  #### Phase 2: The Three Comparisons (15–35 mins)
  Use the Champagne/Beer example here.

  1.  **Levels (Who is better off?)**
      *   Ask: "Is the Beer drinker better off than the Champagne drinker?"
      *   **Requirement:** We need **Level Comparability**. We need a common zero point.
      *   **Block:** "Can we prove it? No. Maybe Beer's '100 utils' is Boredom, and Champagne's '50 utils' is Ecstasy."

  2.  **Units/Differences (Who gains more from a transfer?)**
      *   Ask: "If we take $10 from Beer and give to Champagne, who loses/gains more?"
      *   **Requirement:** We need **Unit Comparability**.
      *   **Block:** "Even if we agree on the zero point, is my 'util' ruler the same length as yours? If my ruler is inches and yours is centimeters, I can't sum our utilities."
      *   **Key Insight:** You cannot do Utilitarianism (summing utilities) without Unit Comparability.

  3.  **The Synthesis:**
      *   Write on board: **No Comparisons = Pareto Only.** **Unit Comparisons = Utilitarianism Possible.** **Level Comparisons = Prioritarianism/Rawls Possible.**

  #### Phase 3: The WTP Trap (35–45 mins)
  *   **Misconception:** *"Just use Willingness to Pay. That compares utility."*
  *   **The Trap:** Students will argue Champagne is willing to pay more, so they value it more.
  *   **The Refutation:** WTP is constrained by **budget**, not just utility.
      *   *Scenario:* What if Champagne is poor and Beer is rich? WTP reflects marginal utility of *money*, not utility of the *good*.
      *   *Scenario:* What if they have equal money (as in your example)? WTP still reflects the marginal utility of income. If Champagne has expensive tastes, their marginal utility of income is different.
      *   **The Hard Line:** "WTP converts utility into money. But money has different utility for different people. You haven't solved the comparison; you've just hidden it behind a price tag."

  #### Phase 4: What to Refuse to Cover
  To stay within 50 minutes, you must explicitly refuse the following:
  1.  **"Which SWF is best?"** (Utilitarian vs. Rawlsian). Tell them: "We are not deciding which is moral today. We are deciding what *data* each requires."
  2.  **"How do we actually measure it?"** (Neuroscience, surveys). Tell them: "That's a positive empirical problem. Today is about the logical possibility."
  3.  **"What about fairness?"** Fairness is the *goal*; comparability is the *ruler*. Don't mix them.

  ### 4. The Final Assessment Question
  Do not ask "Is IUC possible?" (They will just say "It depends").
  Give them a specific numerical scenario that forces them to reveal their assumptions.

  **The Question:**
  > "Person A has utility function $U_A = \sqrt{Income}$. Person B has utility function $U_B = 2 \times \sqrt{Income}$.
  > We take $10 from A and give it to B.
  > **Question:** Can we say Total Welfare has increased?
  > **Follow-up:** What specific assumption must you make to answer 'Yes'?"

  **What you are looking for:**
  *   **Fail:** They calculate the numbers and say "Yes, B gained more than A lost." (They assumed units are comparable without stating it).
  *   **Pass:** They say "We can only say 'Yes' if we assume **Unit Comparability**. If A's scale is 'inches' and B's scale is 'centimeters' (the factor of 2), the calculation is meaningless. Without that assumption, the functions are incommensurable."

  ### Summary Checklist for the Tutor
  *   [ ] **Minute 5:** Have I defined utility as ordinal?
  *   [ ] **Minute 15:** Have I demonstrated Pareto's silence on distribution?
  *   [ ] **Minute 30:** Have I distinguished Level vs. Unit comparability using the Example?
  *   [ ] **Minute 40:** Have I explained why WTP fails to solve the comparison problem?
  *   [ ] **Minute 50:** Did the final question force them to state the *assumption*, not just the *result*?

  This plan respects their background (Arrow/Consumer Theory) while preventing the session from dissolving into a political philosophy debate about disability or wealth redistribution. It keeps the focus on the **logic of measurement**.
