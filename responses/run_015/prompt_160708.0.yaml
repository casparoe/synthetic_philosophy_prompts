          4.  **Conceptual Coherence:** (Cognitive). Can't *think* it. Verdict: Incoherent. Experience: Conceptual scheme.
      *   *The Stroud Objection:* Explain it's about the gap between "we must believe X" and "X is true." It attacks the move from Epistemic to Ontological.
      *   *Self-Reflexivity:* The slogan is transcendental, not empirical. If treated empirically, it dies. If treated transcendentally, it's safe but less powerful against Shade.
      *   *Conclusion:* Marek is likely mixing Epistemic (Kant) with Semantic (Positivist). User should concede Epistemic (we can't know Shade) but fight Semantic (Shade isn't nonsense).

  8.  **Review against Constraints:**
