answer: |-
  ### Seminar Plan: The Unilateralist's Curse (90 Minutes)

  #### 1. Dependency Priority
  **Secure First:** The distinction between **individual rationality** and **collective choice procedures**.
  **Reasoning:** Your students are trained in decision theory. They assume agents maximize expected utility. If they do not first accept that the unilateral actor is behaving *rationally* according to standard decision-theoretic axioms, the "curse" dissolves into a simple error or recklessness. The philosophical tension relies entirely on the fact that the individual *ought* to act (by their own lights) while the group *ought not* to allow it. Heterogeneous belief thresholds are the *mechanism*, but individual rationality is the *precondition* for the paradox.

  #### 2. Example Assessment: Gene-Drive Mosquitoes
  **Verdict:** The example **carries the structural logic**, but requires specific framing to avoid collapsing into a negative externality or Tragedy of the Commons (ToC).
  **Risk of Collapse:**
  *   **Tragedy of the Commons:** ToC involves rivalrous consumption of a shared resource (e.g., overfishing). Here, the "resource" (ecological safety) is not being consumed; a *risk* is being imposed.
  *   **Negative Externality:** Standard externality problems (e.g., pollution) are often reversible or compensable.
  **How to Secure the Logic:**
  *   **Emphasize Irreversibility:** Gene drives are self-propagating. Once released, the action cannot be recalled by the neighbors. This creates the "all-or-nothing" group outcome typical of the curse.
  *   **Emphasize Epistemic Selection:** Do not focus primarily on the *cost* distribution. Focus on the *decision threshold*. The curse triggers not because the municipality *wants* to harm neighbors, but because they are the first to cross the threshold of "sufficient certainty" for net benefit.
  *   **Instruction:** Explicitly tell students: "This is not a problem of malicious intent or resource depletion. It is a problem of *timing* and *thresholds* in a context of irreversible impact."

  ---

  #### 3. Sequence of Ideas (90 Minutes)

  **Phase 1: The Rational Singleton (0:00–0:20)**
  *   **Step 1.1:** Establish the baseline. Review Expected Utility Theory (EUT). An agent acts if $P(\text{Success}) \times \text{Benefit} > \text{Cost}$.
      *   *Presupposition:* Students accept EUT as the normative standard for individual rationality.
  *   **Step 1.2:** Introduce the Municipality (Agent A). They face a malaria crisis. They calculate the EU of deploying gene-drive mosquitoes. The local benefit is high; the local cost is low.
      *   *Presupposition:* Agents are benevolent or at least self-interested, not malicious.
  *   **Step 1.3:** Establish Rationality. Agent A's calculation yields a positive expected utility. By standard decision theory, Agent A is *rationally required* to deploy.
      *   *Goal:* Secure the "Individual Rationality" dependency. If they think Agent A is reckless here, the rest fails.

  **Phase 2: The Group Structure & Thresholds (0:20–0:50)**
  *   **Step 2.1:** Expand the scope. Introduce Regions B–J. They bear the ecological risk but gain no malaria benefit (different geography).
      *   *Presupposition:* Impacts are geographically diffuse; capacity to act is geographically localised.
  *   **Step 2.2:** Introduce Heterogeneous Belief Thresholds. All regions have access to roughly the same data, but they weigh risk differently. Region A is risk-tolerant (low threshold for action). Regions B–J are risk-averse (high threshold).
      *   *Presupposition:* Rational agents can hold different credences/priors even with shared evidence.
  *   **Step 2.3:** The Selection Mechanism. The outcome is determined by the agent with the **lowest threshold**, not the average. Because the technology is unilateral and irreversible, the "fastest" rational decision binds the group.
      *   *Goal:* Demonstrate the structural mechanism. The group outcome reflects the *minimum* belief threshold, not the *mean*.
  *   **Step 2.4:** The Curse Defined. The group ends up with an outcome that a majority (B–J) assess as net negative, without any individual (including A) acting irrationally.

  **Phase 3: Defusing Misconceptions (0:50–1:15)**
  *   **Misconception 1: The Prisoner's Dilemma (PD).**
      *   *Student Prediction:* "This is just defection. A defects, B–J cooperate."
      *   *Defusal Point:* **Phase 3, Step 3.1.**
      *   *Correction:* In PD, defection is dominant *regardless* of what others do. In the Unilateralist's Curse, the action is only a "curse" because it precludes *coordination*. If B–J could act first, they would stop it. It is a race condition, not a strategic dominance game. The payoff structure is not fixed; the *capacity to decide* is the variable.
  *   **Misconception 2: The Information Solution.**
      *   *Student Prediction:* "If they just shared their data/models, they would agree, and the curse vanishes."
      *   *Defusal Point:* **Phase 3, Step 3.2.**
      *   *Correction:* The curse persists even with perfect information sharing. Heterogeneity arises from priors and risk tolerance, not just data access. Furthermore, the *structure* selects the most optimistic interpreter of the data. Even if A shares data with B, A has already crossed the threshold. The structural incentive to "check first" is weak because checking costs time, and being the second to act yields no benefit (the drive is already released).

  **Phase 4: Synthesis and Assessment (1:15–1:30)**
  *   **Step 4.1:** Recap the structural triad: (1) Unilateral Capacity, (2) Irreversibility, (3) Threshold Heterogeneity.
  *   **Step 4.2:** Closing Question (see below).
  *   **Step 4.3:** Dismissal of the "Principle of Conformity" (see below).

  ---

  #### 4. Misconception Mapping & Defusal

  | Misconception | Why it forms | Defusal Strategy | Timing |
  | :--- | :--- | :--- | :--- |
  | **"This is a Prisoner's Dilemma."** | Students see individual gain vs. group loss and default to the only collective action model they know. | Contrast **Dominance** (PD) with **Selection** (Curse). In PD, I defect even if you cooperate. In Curse, I act because I *can*, rendering your choice irrelevant. | Phase 3 (0:50) |
  | **"Better Communication Fixes It."** | Standard epistemic intuition: disagreement implies ignorance. | Highlight **Priors/Risk Tolerance**. Even with identical data, a risk-tolerant agent crosses the threshold sooner. The structure rewards speed over caution. | Phase 3 (1:05) |
  | **"The Actor is Irrational/Reckless."** | Moral intuition rebels against imposing risk on others. | Reiterate **Local EU**. If the actor ignores the externalities (because they are external), their local EU is positive. The *system* is flawed, not the *agent's calculation*. | Phase 1 (0:15) |

  ---

  #### 5. Closing Question
  **Purpose:** To test understanding of threshold asymmetry rather than bioethical intuition.

  > "Suppose Regions A through J share identical data, identical priors, and identical risk tolerances. However, Region A has the *technical capacity* to deploy tomorrow, while Regions B–J require one week to mobilize a veto. Does the Unilateralist's Curse still obtain? Justify your answer strictly in terms of decision thresholds and temporal asymmetry, without referencing the ecological outcome."

  *   **Correct Understanding:** Yes. The curse is structural. Even with identical epistemic states, the *capacity* asymmetry creates a functional threshold difference (the threshold for A is "Is it good?"; the threshold for B–J is "Is it good AND can we stop A?"). The selection effect remains.
  *   **Incorrect Understanding:** No, because if they agree, there is no conflict. (This misses the point that the *outcome* is determined by the first actor, regardless of subsequent agreement).

  ---

  #### 6. Exclusion: The Principle of Conformity
  **Element to Set Aside:** The **Principle of Conformity** (the normative proposal that agents should defer to the group consensus or wait for coordination on high-stakes issues).
  **Reason for Exclusion:**
  1.  **Descriptive vs. Normative:** This seminar is designed to diagnose the *structural mechanism* of the curse. Introducing the normative solution (conformity) prematurely shifts the discussion from "How does this happen?" to "What should we do?"
  2.  **Distraction:** Final-year students will immediately attack the Principle of Conformity (e.g., "What if the group is wrong?" "Does this stifle innovation?"). These are valid objections, but they distract from grasping the *inevitability* of the curse under standard rationality assumptions.
  3.  **Pedagogical Focus:** You want them to feel the tension of the paradox first. If they have a rule to resolve it, they will stop analyzing the structure. Set the principle aside as "a proposed solution for a later seminar."
