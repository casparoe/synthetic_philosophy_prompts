answer: |-
  **Setting:** *A university office, late afternoon. Coffee cups crowd the desk. ELENA (40s, archaeological scientist) sits on the edge of a chair. MARCUS (50s, interpretive archaeologist) leans against a bookshelf.*

  **Elena:** You're treating the material record like a broken text, Marcus. I'm treating it like a collision event. In physics, if momentum doesn't balance, you don't say "the data is ambiguous." You posit a missing particle. When we see a structured absence—say, no grinding stones in elite burials despite perfect preservation conditions—that's missing momentum. It implies a constraint. A rule.

  **Marcus:** But in physics, the conservation laws are universal. In archaeology, the "law" is the very thing you're trying to prove. You see a gap and call it a "taboo." I see a gap and ask: Did the wood rot? Did we sample the wrong quadrant? Or did they simply not have grinding stones because they bought flour? You're smuggling a legal category—*property* or *prohibition*—into a silence.

  **Elena:** I'm not smuggling; I'm modeling. We run taphonomic controls. If the soil pH preserves bone elsewhere, it preserves bone here. If infant remains are missing from the central plaza but present in the periphery, consistently, across three centuries, that's not random loss. That's a system. I'm arguing that institutions *are* patterned behavioral constraints. If the behavior leaves a negative space in the material record, the institution is empirically accessible.

  **Marcus:** Patterned behavior, yes. "Institution" implies shared intent and normative force. You can show me where people *didn't* walk. You can't show me *why*. Maybe the plaza was flooded seasonally. Maybe it was covered in perishable mats. When you label it "sacred exclusion," you're projecting a modern dichotomy of sacred/profane onto a society that might have viewed space as purely practical. You're falsifying the taphonomy, but you're not falsifying the meaning.

  **Elena:** But if I build a model that predicts where materials *should* be based on utility alone, and the absence contradicts that prediction consistently, utility is falsified. The only remaining variable is social constraint. It's inference to the best explanation.

  **Marcus:** It's inference to the *only explanation you're willing to accept*. You're assuming rationality looks the same to them as it does to you. If I find a cache of weapons buried in a river, is that a ritual offering or a strategic retreat after a battle? The material trace is identical. The "institution" of ritual versus the "institution" of warfare exists only in the mental state of the actors. That doesn't fossilize.

  **Elena:** So we stop trying? We just describe pots?

  **Marcus:** We describe the pots and admit the rest is narrative.

  **Elena:** That's surrender.

  **Marcus:** It's humility.

  *(A pause. Elena rubs her temple. Marcus picks up a cold coffee cup.)*

  **Elena:** Look, where my reasoning is shakiest... it's the assumption of uniformitarianism. I assume that if a constraint exists, it leaves a material signature. But some rules are purely verbal. If a taboo exists only in speech and leaves no physical trace, my model sees nothing. It creates a false negative.

  **Marcus:** And where I'm weakest... is paralysis. If we refuse to infer institutions because we can't read minds, we render archaeology mute on the very things that make us human. We describe the shell but ignore the animal.

  **Elena:** So, what changes your mind? One finding?

  **Marcus:** If you found a society with no written records, modeled a structured absence based on "property rules," and then later found an ethnohistoric account from a neighboring culture that independently confirmed those exact rules. Not just a match, but a prediction. That would bridge the mental gap.

  **Elena:** Fair. For me... if you could show a case where structured absence was statistically significant, taphonomically controlled, yet proven to be purely random environmental fluctuation upon later discovery. If you could prove my "negative space" was just noise despite passing all my significance tests. That would break the model.

  **Marcus:** *(Smiles)* So you want a false positive to kill your method, and I want a confirmed positive to build mine.

  **Elena:** Sounds like science.

  **Marcus:** Sounds like archaeology.

  ***

  **Note on Theoretical Liberties:**
  *This dialogue simplifies a century of debate. Elena's position echoes **Processual Archaeology** (Binford et al.), which seeks universal laws and treats culture as an extra-somatic adaptive system. Marcus represents **Post-Processual** critiques (Hodder, Shanks & Tilley), emphasizing context, agency, and the impossibility of accessing past meanings objectively. In reality, most archaeologists occupy a middle ground: "absence" is standard data (taphonomy), but inferring specific "institutions" solely from material absence remains highly contentious. The "physics" analogy is Elena's rhetorical device; archaeological systems are open, not closed, making falsification much messier than in particle physics.*
