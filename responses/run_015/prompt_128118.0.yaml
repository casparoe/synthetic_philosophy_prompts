prompt: |-
  I'm a retired physicist who got into philosophy of archeology lately—mostly because I miss having falsifiable hypotheses. Could you write a short dialogue between two scholars arguing whether we can actually reconstruct social institutions from material traces alone?

  One character should be a "negative-space" inference advocate. She treats absence as data, like in physics: institutions like property rules or taboos leave structured gaps—exclusion zones, missing materials in contexts where you'd expect them—not just pots and walls. She wants institutional claims to be model-based predictions about both presence and absence patterns, open to disconfirmation.

  The other should be a hermeneutic skeptic. He'd say absence is always underdetermined—taphonomic loss, sampling bias, or people just lacking access. He insists institutions are shared mental representations that never fossilize directly, so we're constantly smuggling modern legal or ritual categories onto dead societies.

  Make them actually respond to each other's points, no strawmen. At the end, have each admit where their own reasoning is shakiest and name one specific finding or argument that would change their mind. Also add a brief note saying where this framing takes liberties with real archeological theory, since I'm still learning and might be misrepresenting things. Don't include citations or a reading list—I'll fill those in later if I ever write this up. There's probably a typo or two in this message, I'm typing on my phone.
