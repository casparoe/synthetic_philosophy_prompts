      *   **The Restatement:** Systematic translation of the Inquisitor's speech into PP terms.
      *   **Element-by-Element Analysis:** Freedom, Happiness, Authority, Miracle/Mystery (Clean/Distorted/None).
      *   **The Residue Report:** Addressing the normative gap and the user's intuition.
      *   **Conclusion:** Final synthesis.

  9.  **Drafting the Content (Iterative refinement of terminology):**
      *   *Make sure to use:* Variational Free Energy, Generative Model, Precision Weighting, Active Inference, Policy Space, Expected Free Energy.
      *   *Tone:* Intellectual, respectful of both domains, analytical.
      *   *Key Insight:* The Inquisitor is proposing a *social niche construction* that minimizes individual VFE at the cost of collective epistemic growth.

  10. **Final Review against constraints:**
      *   Did I answer the specific intuition check? Yes.
      *   Did I cover all four elements? Yes.
      *   Is the tone appropriate for a science writer? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to say PP *cannot* handle normativity. Some PP accounts (e.g., Friston's moral dynamics) try to address this. But the standard framework is descriptive. I should highlight that the *tragedy* is the residue. The Inquisitor weeps; a thermostat doesn't weep.

  11. **Final Polish:** Ensure the distinction between *instrumental* efficiency and *existential* weight is clear. (Proceed to generate output).

  *(Post-computation check)*: The prompt asks for "Residue Report" specifically. I will structure that clearly. I need to make sure I don't just say "PP is reductionist." I need to ask if the Inquisitor's metaphysics dissolve. I think they do partially—the "burden" becomes "computational cost," which changes the moral weight. But the structural trade-off remains valid.

