      *   *Correction on Jurisdiction vs. Efficacy:* The prompt asks to address this. The student says "efficacy mostly determines standing." This is philosophically muddled. Standing is de jure; efficacy is de facto. Aquinas makes resistance conditional on efficacy, but standing comes from the lack of title (for usurpers) or public office (for legitimate tyrants).
      *   *Correction on Preemption:* There is no textual basis for "preemptive resistance" in Aquinas based on intentions. This is a projection of modern self-defense theory onto Aquinas.

