answer: |-
  **Grade: B-**

  **General Assessment:**
  You correctly identify the core distinction between *tyrannus ab initio* (usurper) and *tyrannus ex parte exercitii* (abusive legitimate ruler) and accurately capture Aquinas's overarching concern for the common good and the avoidance of greater harm (sedition). However, your answer contains significant textual inaccuracies regarding *who* possesses the standing to resist and invents a doctrine of "preemptive resistance" that is not supported by the primary texts (*De Regno* I.6; *Summa Theologiae* II-II, Q. 42).

  **Point-by-Point Analysis:**

  **1. The Distinction and General Constraint**
  *   **Correct:** You accurately state that Aquinas prioritizes the avoidance of greater harm over the removal of a tyrant. The claim that resistance is only permissible when it does not provoke worse disorder is the central thesis of *De Regno* I.6.
  *   **Cheapest Revision:** None needed. This is a strong summary of the teleological constraint.

  **2. Who May Resist (Usurper vs. Legitimate Tyrant)**
  *   **Subtly Off:** You claim that for a usurper, "private citizens may resist him directly." Aquinas does not grant this right to private individuals acting on their own authority. Even for a usurper, Aquinas argues that if there is a superior authority, recourse must be made to them. If there is no superior (e.g., the Emperor), the right to depose belongs to the *public authority* (the community acting corporately), not private citizens acting individually.
  *   **Why it doesn't follow:** You conflate the *lack of legitimate title* with *private standing*. For Aquinas, the lack of title makes the ruler illegitimate, but it does not automatically license private violence; the remedy must still be public to avoid becoming sedition.
  *   **Cheapest Revision:** Change "private citizens may resist him directly" to "the public authority or the community as a corporate body may reject him."

  **3. Jurisdiction vs. Efficacy**
  *   **Incorrect:** You argue that for the usurper, "efficacy mostly determines standing—because no legitimate authority ever existed, there is no one with proper jurisdiction to appeal to." This muddles the concepts. Standing (jurisdiction) is determined by the *lack of title*, not by efficacy. Efficacy is a *condition* for exercising that standing, not the source of it.
  *   **Why it doesn't follow:** If efficacy determined standing, a successful rebellion would be justified simply because it succeeded. Aquinas argues the rebellion is justified because the ruler lacks title (jurisdiction), *provided* it can succeed without greater harm (efficacy).
  *   **Cheapest Revision:** Rewrite to: "Standing is jurisdictional (based on the lack of valid title), but the *permission* to act is conditional on efficacy (avoiding greater harm)."

  **4. Private Action Against Legitimate Tyrants**
  *   **Subtly Off:** You state that private individuals may act against a legitimate tyrant "with tacit community backing." Aquinas explicitly warns against this in *Summa Theologiae* II-II, Q. 42, A. 2, ad 3. He argues that plotting against a tyrant, even a bad one, is often sedition if done by private persons. He reserves deposition for public authority.
  *   **Why it doesn't follow:** "Tacit backing" is a modern contractualist concept (more Locke than Aquinas). Aquinas requires *express* public authority to depose a legitimately instituted ruler to maintain the order of law.
  *   **Cheapest Revision:** Remove the clause about private individuals acting with tacit backing. State instead that private recourse is limited to prayer and patience unless a public mechanism for deposition exists.

  **5. Preemptive Resistance**
  *   **Incorrect:** You claim Aquinas allows preemptive resistance against a usurper "if his tyrannical intentions are clear." There is no textual evidence for this in *De Regno* or the *Summa*. Aquinas focuses on the *act* of usurpation (seizing power without right), not the *intentions* regarding future rule.
  *   **Why it doesn't follow:** You are projecting a modern self-defense standard onto Aquinas. For Aquinas, the usurper is resistible because he *has seized power* without right, not because he *might* rule badly.
  *   **Cheapest Revision:** Delete the claim about preemptive resistance based on intentions. Replace with: "Resistance to a usurper is immediate because the act of usurpation itself violates the order of justice, not because of predicted future abuse."

  **Summary of Revision Priorities:**
  1.  **Stop granting private citizens the right to kill/depose.** Shift agency to "public authority" or "the community."
  2.  **Clarify Jurisdiction vs. Efficacy.** Standing comes from law/title; permission comes from prudence/consequences.
  3.  **Remove Preemption.** Focus on the illegitimacy of the title, not the prediction of future harm.
