answer: |-
  # BRAINSTORMING LOG

  **Candidate Cases Considered**
  1.  **The Irish Potato Famine (1845–1852):**
      *   *Pros:* Clear non-human agent (*Phytophthora infestans*); clear human uptake (land tenure, export policy, relief efforts); clear contrast case (blight existed in Europe without mass mortality).
      *   *Cons:* Politically charged; risk of students collapsing the explanation into "British genocide" (human-only cause) or "Nature's cruelty" (blight-only cause).
      *   *Verdict:* **Selected.** The contrast case is too valuable to lose. The political charge can be managed by focusing on the *structure* of the explanation rather than the moral verdict.

  2.  **The Black Death (1347–1351):**
      *   *Pros:* Iconic non-human actor (bacteria/fleas); massive historical shift.
      *   *Cons:* Scale is too vast for a 50-minute structural lesson. Mechanism (Yersinia pestis transmission) requires biological detail that distracts from historical causation. Uptake (flagellants, quarantine, labor laws) is diffuse and hard to isolate in a single sentence.
      *   *Verdict:* **Rejected.** Too much noise. Students will focus on the horror rather than the causal structure.

  3.  **Tambora Eruption (1815) / Year Without a Summer (1816):**
      *   *Pros:* Clear non-human event; global reach.
      *   *Cons:* Climate causation feels diffuse compared to a pathogen. "Uptake" (migration, crop substitution) is less institutional than policy. Harder to find a clean contrast case where Tambora ash fell but nothing happened.
      *   *Verdict:* **Reserved for Check.** Good for transfer, but too vague for the core lesson.

  4.  **Panama Canal (French Failure vs. American Success):**
      *   *Pros:* Excellent contrast on uptake (Gorgas vs. French ignorance); clear actor (mosquito).
      *   *Cons:* Risks sliding into "history of technology/medicine" rather than general historical causation. Students might view the mosquito as an obstacle overcome by tech, rather than a historical agent.
      *   *Verdict:* **Rejected as Core.** Used instead for the final check (as per your option).

  **Obvious-But-Wrong Opening Moves**
  1.  **Define "Agency" and "Causation" First:**
      *   *Reason for Rejection:* Abstract definitions without context will bounce off. Students need to feel the *problem* of explanation before they accept the *tool* to fix it.
  2.  **Introduce the Two-Sentence Rule Immediately:**
      *   *Reason for Rejection:* Without a failed example to repair, the rule looks like arbitrary grammar. It must arrive as a solution to a breakdown they have just witnessed.
  3.  **Start with the Full Narrative of the Famine:**
      *   *Reason for Rejection:* If you tell the story first, students lock into a single causal track (usually moral). You need to isolate the variables before weaving the narrative.
  4.  **Ask "Can a germ be an actor?" as the Opening Question:**
      *   *Reason for Rejection:* Invites a binary Yes/No based on intuition. They need to see *how* the germ acts before deciding *if* it acts.

  **Pressure-Testing the Two-Sentence Rule**
  *   *Does it work?* Yes, but "Uptake" needs sharpening. If "Uptake" is just "what humans did," it can still be deterministic (e.g., "They starved"). It must imply *contingency*.
  *   *Modification:* The Uptake Sentence must explicitly allow for the possibility of a different human response.
  *   *Timing:* It cannot arrive before Minute 20. It requires the failure of simpler explanations to be motivated.
  *   *Third Sentence?* No. A third sentence complicates the heuristic. The Mechanism handles the non-human; the Uptake handles the human/context. A third sentence risks returning to abstract theory.

  ***

  # TEACHING PLAN: NON-HUMAN ACTORS IN HISTORY

  ## 1. Order and Dependency

  **Phase 1: The Breakdown (00:00–00:10)**
  *   **Activity:** Write two bad explanations on the board regarding the Irish Famine.
      1.  "The potato blight caused the famine." (Too thin)
      2.  "British policy caused the famine." (Too exclusive)
  *   **Dependency:** This phase creates the *need* for the conceptual distinctions. If you skip this and start with definitions, Phase 2 becomes abstract theory rather than a tool for repair.
  *   **Goal:** Students must feel that both sentences are true but insufficient alone.

  **Phase 2: Separating Relevance from Determinism (00:10–00:20)**
  *   **Activity:** Introduce the European contrast. The blight was in Belgium and Germany; no mass famine occurred there.
  *   **Dependency:** This depends on Phase 1. Once they agree the blight matters, this move prevents them from saying the blight *determined* the outcome. It isolates the blight as *causally relevant* but not *sufficient*.
  *   **Goal:** Break the reflex that "Cause = Sole Cause."

  **Phase 3: Defusing the Intentionality Reflex (00:20–00:25)**
  *   **Activity:** Explicitly license "actor" talk for the blight while stripping it of mind. Use the phrase: "It acted, but it did not choose."
  *   **Dependency:** This must happen *before* the Two-Sentence Rule. If you introduce the rule first, they will struggle to write a "Mechanism" for a "thing." Once they accept non-human action without intention, the Mechanism Sentence becomes possible.
  *   **Goal:** Allow them to write "The blight destroyed..." without feeling they are anthropomorphizing.

  **Phase 4: The Two-Sentence Rule (00:25–00:35)**
  *   **Activity:** Introduce the rule as a diagnostic test for the explanations in Phase 1.
      *   *Mechanism:* How the blight made a difference (rotting tubers).
      *   *Uptake:* How humans responded contingently (exporting grain, lack of relief).
  *   **Dependency:** Depends on Phase 2 (to ensure Uptake isn't ignored) and Phase 3 (to ensure Mechanism isn't rejected as metaphor).
  *   **Goal:** Operationalize the distinctions. If you place this earlier, it is dogma. Here, it is a repair kit.

  **Phase 5: Application and Transfer (00:35–00:50)**
  *   **Activity:** Apply rule to Ireland, then switch to the Check Case.
  *   **Dependency:** Depends on Phase 4. They cannot apply the rule until they have seen it modeled on the core case.
  *   **Goal:** Verify learning via transfer.

  ## 2. The Carrying Case

  **Verdict on the Irish Potato Famine:**
  It is the right carrier, provided you manage the political temperature. It meets all your criteria:
  *   **Localized Non-Human:** The blight is specific, not a vague "climate shift."
  *   **Recognizable Uptake:** Land tenure and grain export are concepts first-years grasp quickly.
  *   **Contrast Case:** The European context is essential to prove the blight wasn't sufficient.
  *   **Scale:** It is catastrophic, but the *mechanism* (rotting potato) is simple enough not to require biology lessons.

  **What a Carrier Must Have:**
  1.  **A Specific Non-Human Event:** Not "climate" generally, but a specific pathogen, eruption, or species.
  2.  **A Visible Human Pivot Point:** A policy, technology, or social structure that could have been different.
  3.  **A Control Group:** A place where the non-human event happened without the catastrophic outcome.

  **What a Carrier Must Lack:**
  1.  **Specialist Knowledge:** No need to understand spore reproduction or volcanic indices.
  2.  **Totalizing Horror:** If the event is too overwhelming (e.g., Auschwitz or Nuclear War), students resist analyzing causal structure because it feels morally obscene to discuss "uptake." The Famine is on the edge of this, but manageable.

  **Why the Alternatives are Traps:**
  *   **The Black Death:**
      *   *Makes Easy:* Establishing the non-human as powerful.
      *   *Makes Impossible:* Isolating "uptake." The social changes (wage labor, religious shifts) are too slow and diffuse to fit into a single "Uptake Sentence." Students will slide into "It changed everything" determinism.
  *   **Tambora (1815):**
      *   *Makes Easy:* Showing global reach of non-human events.
      *   *Makes Impossible:* Tracing the mechanism. "Volcanic ash cooled the stratosphere" is too abstract for a 50-minute history seminar. It feels like geography, not history.
  *   **1918 Influenza:**
      *   *Makes Easy:* Modern relevance.
      *   *Makes Impossible:* Separating the virus from the war. The war context is so dominant that students will treat the flu as a footnote to human conflict, failing to grant it independent causal weight.

  ## 3. The Misconception Map

  **Misconception 1: Agency Requires Intention (Minutes 00–20)**
  *   *Formation:* Students hear "actor" applied to a germ and think "Metaphor" or "Error."
  *   *Defusing Move:* **Minute 20.** Say aloud: "In this room, 'actor' means 'something that makes a difference,' not 'someone who makes a plan.'" Write this definition on the board and leave it there.
  *   *Phase:* Phase 3 (Defusing Intentionality).

  **Misconception 2: Non-Human Cause Erases Human Choice (Minutes 00–20)**
  *   *Formation:* If the blight caused the famine, then British policy doesn't matter. (Determinism).
  *   *Defusing Move:* **Minute 15.** Use the European contrast. "The blight was in Prussia. No famine. Why?" This forces them to admit human variables mattered *alongside* the blight.
  *   *Phase:* Phase 2 (Relevance vs. Determinism).

  **Misconception 3: Environmental Causation = Environmental Determinism (Minutes 20–30)**
  *   *Formation:* Students think admitting the blight matters means admitting humans were helpless.
  *   *Defusing Move:* **Minute 30.** The Uptake Sentence. Require them to state what could have been done differently. If they cannot write this, the explanation is determinist.
  *   *Phase:* Phase 4 (Two-Sentence Rule).

  **Misconception 4: The Contrast Negates the Cause (Minutes 30–40)**
  *   *Formation:* "If the blight was in Europe too, then the blight didn't cause the Irish Famine." (Slide from Not Sufficient to Not Necessary).
  *   *Defusing Move:* **Minute 35.** Analogy: "Gunshots happen in many cities without murder sprees. Does that mean the bullet didn't kill the victim?" Use this to distinguish *necessary conditions* from *sufficient conditions* without using those terms.
  *   *Phase:* Phase 5 (Application).

  **Additional Predictable Misconception: The "Decoration" Error**
  *   *Formation:* Students treat the non-human element as "context" or "setting" rather than a cause. "The blight was the background, the policy was the cause."
  *   *Defusing Move:* **Minute 10.** Ask: "If the potatoes had not rotted, would the policy have mattered?" If the answer is no, the blight is not decoration.
  *   *Phase:* Phase 1 (The Breakdown).

  ## 4. The Check

  **The Task (Minutes 45–50):**
  Put the following on the board:
  *"The French failed to build the Panama Canal because the jungle was too difficult."*

  **Instruction:**
  "Diagnose this sentence. Is it determinist? Does it treat the non-human as an actor? Repair it using the Two-Sentence Rule."

  **Correct Answer:**
  *   *Diagnosis:* It is determinist ("jungle was too difficult" implies no human solution was possible) and vague on mechanism.
  *   *Repair (Mechanism):* "Mosquitoes bred in stagnant water and transmitted yellow fever to the workers."
  *   *Repair (Uptake):* "The French engineers failed to drain the swamps, whereas the Americans later succeeded by doing so."
  *   *Why it counts:* It grants the mosquito causal power (actor) without intention, and it identifies the human contingency (uptake) that determined the outcome.

  **Superficially Correct Answer (The Trap):**
  *   *Response:* "The French failed because mosquitoes killed workers, but the Americans tried harder."
  *   *Why it fails:* "Tried harder" is not a specific uptake. It masks the mechanism of success (drainage/medical policy) and risks returning to a "great man" or "willpower" explanation. It fails the "could have done differently" test because "trying harder" is not an institutional variable.

  **Alternative Check (Tambora):**
  *"The Year Without a Summer caused mass migration."*
  *   *Repair:* Mechanism (ash cooled climate/crops failed); Uptake (New England farmers chose to move to Ohio rather than switch crops).
  *   *Risk:* Students may not know the uptake options (switching crops) without prompting. Stick to Panama for clearer institutional uptake.

  ## 5. Refusals

  **What to Decline:**
  1.  **Metaphysics of Agency:** Do not discuss whether the germ *really* has agency in a philosophical sense.
  2.  **Formal Causation:** Do not introduce INUS conditions, necessary/sufficient terminology, or causal graphs.
  3.  **Biological Detail:** Do not explain the life cycle of *Phytophthora infestans* beyond "it rotted the tubers."
  4.  **Named Frameworks:** Do not mention Actor-Network Theory, Latour, or Environmental History as disciplines.

  **What to Say When Pressed:**
  *   *Student:* "But can a germ *really* be an agent if it doesn't think?"
      *   *Response:* "I am not asking you to solve philosophy today. I am asking you to write better history. Does treating it as an actor help you explain the outcome? If yes, use it."
  *   *Student:* "Isn't this just Actor-Network Theory?"
      *   *Response:* "It might be related, but we are not studying theory. We are studying how to construct an explanation. Stick to the sentences."
  *   *Student:* "How exactly did the blight kill the plant?"
      *   *Response:* "For our purposes, 'it rotted the tuber' is enough mechanism. We are historians, not biologists. Don't let the biology distract from the history."
  *   *Student:* "So was it the British or the Blight?"
      *   *Response:* "That is the wrong question. The question is: How did the blight and the British interact to produce this specific outcome? Use the two sentences."
