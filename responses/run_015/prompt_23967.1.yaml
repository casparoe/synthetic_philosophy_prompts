answer: |-
  This is a classic formulation of the "Boundary Problem" in democratic theory, often associated with philosophers like Frederick Whelan, Robert Goodin, and Gustaf Arrhenius. You have correctly identified that the All-Affected Principle (AAP), taken literally, leads to an infinite regress or a global demos that is institutionally impossible.

  However, you are right to feel that rejecting (1) is too high a price. It guts the normative core of democracy. The error isn't in the moral intuition of (1); it is in the institutional translation in steps (4) through (6).

  Here is where the argument is smuggling in a false equivalence, how to fix it without making the principle empty, and what it costs.

  ### 1. The Smuggled Premise: "Voice" = "Direct Vote in This Forum"

  The critical slide happens between **(4)** and **(6)**.

  *   **(4)** says coastal people ought to have a *voice*.
  *   **(6)** assumes that having a *voice* requires a *direct vote in the town council*.

  This is the category error. A moral claim to consideration does not necessarily entail a specific institutional mechanism (like a ballot in that specific election).

  If we accept that the coastal people are affected, the AAP demands their interests be represented *somewhere* in the chain of governance that permits the emissions. It does not strictly demand they be voters in the *town council*. Their "voice" might be satisfied by:
  1.  **Higher-order constraints:** National or international climate laws that bind the town council's discretion.
  2.  **Legal standing:** The ability to sue if the project violates broader environmental rights.
  3.  **Proxy representation:** The town councilors are agents of a larger state that *does* represent the coastal people.

  **The Fix:** We shift from a "one decision, one demos" model to a **nested demoi** model. Local bodies handle local externalities; regional/national bodies handle regional externalities; global bodies handle global externalities. The coastal people's claim is valid, but it is a claim against the *global carbon budget*, not the *local zoning permit*.

  ### 2. Defending the Threshold (Without Making it Empty)

  You asked: *"If the whole fix is just to quietly put a threshold on 'significantly affected,' I want to hear why that threshold isn't doing all the heavy lifting and making (1) basically empty."*

  This is the sharpest part of your critique. If we just say "only *significantly* affected people count," who decides significance? If the town decides, they exclude outsiders (bias). If an external arbiter decides, who guards the guardians?

  However, the threshold doesn't have to be arbitrary magnitude. It can be based on **discretionary impact** vs. **background noise**.

  *   **Background Noise:** Everything affects everything (butterfly effect). I am affected by your lunch choice (market demand, carbon footprint, etc.). But I am not affected in a way that your *political agency* can remedy.
  *   **Discretionary Impact:** I am affected in a way that *this specific decision-making body* has the power to alter.

  **The Refinement:** The AAP should apply to those affected by the **exercise of discretionary power** by the specific body in question.

  *   **Why this isn't empty:** It still rules out tyranny. If a town council votes to dump toxic waste in a river flowing to a neighbor, that is a *discretionary impact* on the neighbor. The neighbor must have a voice (perhaps via a regional water board).
  *   **Why this stops the regress:** The town council does not have discretion over the global climate. They have discretion over the permit. The *accumulation* of permits causes the climate change, but no *single* permit controls it. Therefore, the specific harm to the coastal person is not within the *remedial discretion* of the town council. Their claim lies against the aggregate system, not the individual node.

  ### 3. What Does This Cost?

  If we adopt this refined view (Nested Demoi + Discretionary Impact), we avoid the absurdity of (6) without rejecting the morality of (1). But there are costs:

  **Cost A: Complexity over Clarity**
  We lose the elegance of "one person, one vote" in a single constituency. We have to accept a messy, multi-layered governance structure. Some issues (zoning) are local; some (carbon) are global. This requires institutions that don't really exist yet (e.g., a global body with actual teeth to constrain local carbon decisions).

  **Cost B: The "Residual" Problem**
  There will always be edge cases. What if a local decision has a *massive* specific impact on one outsider? (e.g., A town builds a dam that floods a village in the next jurisdiction).
  *   *The Cost:* We have to admit that local boundaries are sometimes morally illegitimate. We must be willing to override local sovereignty when the "discretionary impact" spills over too heavily. This creates friction and requires a higher authority to adjudicate boundary disputes.

  **Cost C: Dilution of Agency**
  If the coastal people's voice is mediated through a global climate treaty rather than a direct vote on the data center, their agency is diluted. They get a say in the *cap*, not the *location*.
  *   *The Cost:* We have to accept that perfect democratic congruence (everyone affected votes on everything) is impossible. We trade perfect congruence for workable sovereignty.

  ### 4. Summary of the Rejection

  I reject the inference in **(6)**.

  *   **Why:** It conflates *moral standing* with *institutional venue*.
  *   **The Modification:** The AAP is true, but it generates a claim to representation *commensurate with the scale of the effect*.
      *   Local effect $\rightarrow$ Local voice.
      *   Global effect $\rightarrow$ Global voice (not necessarily a local vote).
  *   **The Threshold:** It is not an arbitrary magnitude cut-off; it is a **jurisdictional match**. The threshold is defined by the *capacity of the body to remedy the harm*.

  **Does this save the principle?**
  Yes. It preserves the core intuition that power must be accountable to those it harms.
  **Does it avoid the absurdity?**
  Yes. It prevents every local election from becoming a global referendum.
  **Is the threshold empty?**
  No. It does real work by distinguishing between *systemic background conditions* (where we need global governance) and *specific policy choices* (where we need local governance).

  The problem isn't that the AAP is false; it's that we are trying to apply a global moral principle to fragmented institutional structures. The solution isn't to shrink the principle, but to build institutions that match its scale.
