prompt: |-
  You serve as a preliminary adjudicator for a transnational heritage tribunal that evaluates petitions for protected-status designation of collective rituals, commemorative calendars, and origin narratives submitted by communities seeking legal recognition of cultural continuity. Your office must render preliminary determinations within ten working days, using only the documentary record, limited ethnographic summaries, and internal conceptual frameworks; final sign-off requires a senior anthropologist, but your procedure must be reusable by junior staff without specialist training. Operationalize the analytical distinction between genuinely continuous practices and “invented traditions” (in the sense that present needs construct a formalized, ritualized response to new situations while claiming ancient lineage) together with the framework of “imagined communities” (in the sense that membership boundaries, shared temporal narratives, and collective self-images are configured through modern mediating practices rather than face-to-face continuity) into a stepwise decision procedure.

  The procedure must include: (1) an ordered sequence of diagnostic tests, each with explicit evidentiary markers that can be checked against the petition dossier; (2) decision nodes that classify the petition as clearly continuous, clearly invented, or indeterminate, with the criteria for each; (3) a protocol for cases where the two frameworks yield conflicting signals—for example, where a ritual shows formal discontinuity characteristic of invention but serves an imagined community whose membership boundaries have remained stable for generations; and (4) explicit flag points where judgment cannot be eliminated and must be escalated to the senior sign-off.

  In addition, build in a specific safeguard against “retroactive institutionalization”: the risk that the petition process itself prompts a community to codify, standardize, or symbolically anchor an informal practice, thereby generating the very tradition the tribunal is asked to evaluate. Specify how your procedure detects this feedback loop and how it should affect the preliminary determination.

  Apply the procedure to three worked cases: (a) a petition from a modern nation-state seeking protected status for a state-sponsored commemorative calendar created in the late twentieth century but narrated as millennia-old; (b) an ambiguous case from a diaspora community that reconstructed a ritual after displacement, blending documented pre-displacement fragments with innovations required by the new environment; and (c) one case where the procedure yields a classification that directly undermines the petitioners’ own origin narrative, and state exactly what the tribunal should record when the analytical result conflicts with the community’s self-understanding.

  Do not provide bibliographies, reading lists, or citations to external scholarship; ground every step in the conceptual logic of the two frameworks themselves. Flag precisely where the procedure will misfire or produce counter-intuitive results, and specify what your office should do in those instances.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case applications:

  1.  **Deconstruct the Request:**

      *   **Role:** Preliminary Adjudicator for a Transnational Heritage Tribunal.
      *   **Task:** Create a stepwise decision procedure to evaluate petitions for protected-status designation of cultural practices (rituals, calendars, narratives).
      *   **Core Concepts:**
          *   "Invented Traditions" (Hobsbawm/Ranger sense): Present needs constructing formalized responses claiming ancient lineage.
          *   "Imagined Communities" (Anderson sense): Membership/narratives configured through modern mediation rather than face-to-face continuity.
          *   *Crucial Distinction:* Continuous practices vs. Invented traditions.
      *   **Constraints:**
          *   Must be usable by junior staff (no specialist training).
          *   Must rely *only* on documentary record/ethnographic summaries/internal logic (no fieldwork).
          *   Must include: (1) Diagnostic tests with evidentiary markers, (2) Decision nodes (Continuous/Invented/Indeterminate), (3) Protocol for conflicting signals, (4) Escalation points for judgment calls.
          *   **Safeguard:** Detect "Retroactive Institutionalization" (petition process causing codification).
          *   **Application:** Apply to three specific worked cases (State-sponsored calendar, Diaspora reconstruction, Narrative-undermining case).
          *   **Formatting:** No bibliographies/citations. Flag misfires/counter-intuitive results.

  2.  **Develop the Conceptual Framework (Internal Logic):**

      *   *Continuity:* Requires evidence of transmission mechanisms that predate the current claim's formalization. Focus on *process* over *form*.
      *   *Invention:* Focus on sudden formalization, standardization, and explicit linkage to a specific political/social need in the recent past, masked by claims of antiquity.
      *   *Imagined Community:* Focus on how the group defines itself. Is it based on face-to-face interaction over time, or mediated symbols (texts, calendars, broadcasts)?
      *   *Tension:* A practice can be "invented" (recent formalization) but still sustain a legitimate "imagined community" (stable membership/identity). The Tribunal needs to decide if "protected status" rewards *antiquity* or *social cohesion*. The prompt implies the goal is recognizing "cultural continuity," so invention usually weighs against protection unless the "imagined community" aspect is overwhelmingly stable.

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Step 1: Chronological Alignment Test.* Compare the claimed origin date vs. the first documentary evidence of the *formalized* practice.
      *   *Step 2: Standardization vs. Variation Test.* Continuous practices usually vary locally; invented ones are often standardized from the top down.
      *   *Step 3: Functional Necessity Test.* Does the practice solve a *current* political/social problem that didn't exist in the claimed era?
      *   *Step 4: Mediation Test (Imagined Communities).* How is membership verified? Face-to-face or symbolic/mediated?
      *   *Decision Nodes:* Combine scores from above.
      *   *Conflict Protocol:* What if Invention markers are high but Community Stability is high?
      *   *Retroactive Institutionalization Safeguard:* Check dates of codification relative to the petition filing.

  4.  **Refining the Safeguard (Retroactive Institutionalization):**

      *   *Problem:* The petition asks for protection -> Community realizes they need a "rulebook" to prove legitimacy -> They create the rulebook -> Tribunal sees the rulebook as evidence of tradition.
      *   *Detection:* Look for documents dated *after* the initial intent to petition was publicized. Look for sudden uniformity in oral histories collected *during* the petition process.
      *   *Action:* Freeze the evidentiary record at the date of initial filing. Discount post-filing codifications.

  5.  **Developing the Worked Cases:**

      *   *Case A (State-Sponsored Calendar):* High Invention markers (late 20th century, state apparatus), High Imagined Community (national identity). Result: Clearly Invented.
      *   *Case B (Diaspora Reconstruction):* Mixed. Displacement breaks continuity (Invention marker), but fragments remain (Continuity marker). New environment forces change. Result: Indeterminate/Hybrid. Needs escalation.
      *   *Case C (Narrative Undermining):* The analysis proves the story is false (e.g., ritual is 50 years old, not 500). Result: Clearly Invented. *Crucial:* How to record this without insulting the community? Focus on "Formalization Date" rather than "Falsehood."

  6.  **Addressing Constraints & Flags:**

      *   *Junior Staff Usability:* Keep language procedural, not theoretical. Use checklists.
      *   *Misfires:* Acknowledge that "Continuity" isn't always good (oppressive traditions) and "Invention" isn't always bad (resilience). The Tribunal's mandate is *continuity*, so it might miss *resilience*. Flag this.
      *   *Ethical Flag:* Telling a community their history is "invented" can be harmful. Escalate these.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Set the tone (bureaucratic, analytical).
      *   *The Procedure:* Break down into Phases.
      *   *The Safeguard:* Make it a distinct phase.
      *   *The Cases:* Apply the phases strictly.
      *   *The Limitations:* Be honest about where the logic breaks.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Hobsbawm says X." I need to operationalize the *concept* without citing the *author*. The prompt says "ground every step in the conceptual logic... do not provide bibliographies."
      *Correction:* Use terms like "Formalization Gap" instead of "Hobsbawm's Invention." Use "Mediation Density" instead of "Anderson's Imagined Communities."

      *(Refining the Conflict Protocol)*: If a ritual is invented but the community is stable, does it get protection? The prompt asks for "cultural continuity." If the practice is invented, continuity is broken *in the practice*, even if the *group* is continuous. I should rule that "Invented Practice" generally fails the "Continuity" mandate, but the "Stable Community" aspect might warrant a different *kind* of protection (not the scope of this specific procedure). I will classify it as "Invented Practice / Stable Community" and escalate for policy decision.

      *(Refining Case C)*: The prompt asks what to record when the result undermines the petitioners' narrative. I must be precise. Record the *evidentiary discrepancy*, not the *moral judgment*.

  8.  **Final Review against Prompt Requirements:**

      *   Ordered sequence of diagnostic tests? Yes.
      *   Evidentiary markers? Yes.
      *   Decision nodes (Continuous/Invented/Indeterminate)? Yes.
      *   Protocol for conflicting signals? Yes.
      *   Flag points for escalation? Yes.
      *   Safeguard against Retroactive Institutionalization? Yes.
      *   Three worked cases (State, Diaspora, Narrative-conflict)? Yes.
      *   No bibliographies? Yes.
      *   Flag misfires? Yes.

  9.  **Final Polish:** Ensure tone is appropriate for a tribunal document (formal, precise, neutral). Ensure the distinction between the *practice* and the *community* is clear throughout. (Proceed to generate output).

  *(Self-Correction on "Imagined Communities"):* I need to be careful not to treat "Imagined Community" as synonymous with "Fake." Anderson's point is that *all* large communities are imagined. The distinction here is whether the *ritual* relies on modern mediation to *create* the bond where none existed, vs. mediating an *existing* face-to-face bond. I will refine the test to look for "Mediation as Substitute" vs. "Mediation as Record."

  *(Final check on Retroactive Institutionalization)*: Make sure the "Freeze Date" concept is clear.

  *(Final check on Case C)*: Ensure the language respects the community while maintaining analytical rigor.

