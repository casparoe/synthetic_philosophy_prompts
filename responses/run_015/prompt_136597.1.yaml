answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Meridian Museum of Sculpture
  **FROM:** Conservation and Provenance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Formal Opinion and Recommendation Regarding Object 1923-C

  **I. Purpose and Recommendation**

  The Conservation and Provenance Committee submits this opinion to resolve the status of Object 1923-C, the life-sized clay figure originating in 1923. Following the 2019 catastrophic flood, the object underwent reconstruction wherein fifty-five percent of the substrate was replaced with a synthetic polymer engineered to match the original clay's isotopic signature and tensile properties. The remaining forty-five percent comprises recovered original fragments.

  The artist's estate contends that the majority replacement of material substrate dissolves the object's identity, demanding reclassification or deaccessioning. The Institutional Charter stipulates that original-work status is granted if an object retains *either* more than half its original material substrate by mass *or* an unbroken chain of formative intentionality certified by the Chief Conservator. The Charter does not explicitly state whether these conditions are jointly necessary or separately sufficient.

  After rigorous deliberation on the ontological status of the object and the legal intent of the Charter, the Committee recommends **Course One: Retain full original-status display with an appended conservation history.** We advise against reclassification or deaccessioning. This recommendation includes a concrete implementation timeline detailed in Section IV.

  **II. Philosophical Analysis of Material Constitution**

  The dispute over Object 1923-C instantiates the classic problem of material constitution: does the identity of a sculpture reside in its physical parts or in its formal and historical continuity?

  The Estate's position relies on a mereological intuition: that an object is strictly identical to the sum of its constituent parts. Under this view, if the majority of the parts are replaced, the original sum ceases to exist. There is significant weight to this consideration. If one were to replace the majority of the bricks in a historic wall, the intuition that the wall is "new" is strong. Applied to Object 1923-C, the Estate argues that because 55% of the mass is synthetic, the 1923 clay figure no longer exists; what remains is a derivative replica containing relics of the original. This view prioritizes material continuity as the necessary condition for artistic identity.

  However, this materialist view fails to account for the functional and intentional nature of sculptural preservation. A sculpture is not merely a collection of atoms; it is a realized intention fixed in a medium. The synthetic polymer used in the 2019 reconstruction was not chosen to create a new object, but to sustain the existing one. Because the polymer replicates the isotopic signature and tensile properties of the original clay, it is materially indistinguishable in function and appearance, despite being spatiotemporally discontinuous in origin. The discontinuity lies in the *source* of the matter, not the *behavior* of the object.

  Therefore, artistic identity in this context should be understood as a hybrid condition tracking both material history and formal continuity. When material continuity is breached, as it is here (45% < 50%), the identity of the work can still subsist if the formal continuity is maintained through an unbroken chain of intentionality. The conservation act was not a new creation but a rescue of the prior form. To rule otherwise would imply that any significant repair destroys the original, a standard that would deaccession the majority of the museum's holdings following natural disasters or necessary stabilization.

  **III. Interpretation of the Institutional Charter**

  The ambiguity of the Charter lies in the logical operator connecting the material clause and the intentionality clause. We must determine if the Charter requires (Material > 50% AND Intentionality) or (Material > 50% OR Intentionality).

  We argue for the disjunctive (OR) interpretation. If the Charter required both conditions to be met jointly, the intentionality clause would be rendered largely redundant. In cases where more than half the original material survives, the chain of intentionality is rarely in question. The intentionality clause exists precisely to address cases where material loss exceeds the fifty-percent threshold. To interpret the Charter as requiring joint necessity would negate the utility of the intentionality provision in the exact scenario for which it was designed: catastrophic loss requiring reconstruction.

  Object 1923-C fails the material test (45% original) but satisfies the intentionality test, provided the Chief Conservator certifies that the reconstruction aimed to preserve the original formative vision rather than impose a new one. The engineering of the synthetic polymer to match the original clay demonstrates that the conservators' intention was to extend the life of the 1923 object, not to fabricate a 2019 replica. Thus, under the disjunctive reading, Object 1923-C retains original-work status.

  **IV. Addressing the Estate's Concerns**

  While we reject the Estate's demand for deaccessioning or reclassification, we acknowledge the validity of their demand for transparency. The intuition that material replacement matters is not philosophically baseless; it reflects a public interest in provenance and authenticity. Retaining original status does not require obscuring the reconstruction.

  The moral obligation to the Estate and the public is not to demote the object, but to disclose its history. The "appended conservation history" required in Course One serves this function. It acknowledges the material discontinuity without surrendering the object's ontological status. This approach respects the Estate's concern for truthfulness while upholding the Museum's mandate to preserve cultural heritage. Deaccessioning would punish the public for the flood's damage, and reclassification would misrepresent the conservators' successful preservation of the artist's form.

  **V. Implementation Timeline**

  To execute Course One effectively, the Committee proposes the following twelve-month timeline:

  *   **Month 1:** Board formalizes the disjunctive interpretation of the Charter regarding material vs. intentionality clauses. Chief Conservator issues formal written certification of the "unbroken chain of formative intentionality" for Object 1923-C.
  *   **Month 2:** Legal counsel drafts a formal response to the Artist's Estate, outlining the Charter interpretation and the philosophical rationale for retaining original status, offering a private viewing of the conservation documentation.
  *   **Month 3-4:** Curatorial team redesigns the object's placard and digital entry. The label will read "Original Work (1923; reconstructed 2019)" with a QR code linking to a detailed report on the 55% synthetic substrate and the isotopic matching process.
  *   **Month 5:** Public re-display of Object 1923-C with the new appended conservation history. Press release emphasizes the innovative conservation science that preserved the work's identity.
  *   **Month 6-12:** Monitoring period. The Committee will review visitor engagement data and any further correspondence from the Estate. If public confusion regarding the object's status exceeds 10% of feedback samples, the didactic text will be revised for greater clarity, without altering the object's classification.

  **VI. Conclusion**

  Object 1923-C is neither a mere relic nor a perfect original; it is a preserved work that has undergone necessary material translation. To deaccession it is to privilege matter over meaning; to reclassify it is to ignore the success of the conservation intention. By retaining original status while mandating full transparency regarding the synthetic substrate, the Museum upholds the Charter's disjunctive logic, honors the artist's formative intention, and maintains public trust.

  The Committee moves that the Board adopt Course One effective immediately.

  Respectfully submitted,

  Conservation and Provenance Committee
  Meridian Museum of Sculpture
