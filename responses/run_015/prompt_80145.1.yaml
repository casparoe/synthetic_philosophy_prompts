  **1. The Scale Argument Reachability**
  *   **REACHES (Leaf G only):** The argument that *"low individual weight × huge numbers = large total obligation"* only works here. This leaf accepts that individual weight is low (Graded + Expected Value) but allows summing (Aggregation).
  *   **BLOCKED (All other leaves):**
      *   **Threshold Views (Leaves A, B, C, D, E, F):** The Scale Argument relies on individual weight being *tiny*. If you cross a Threshold (or use Precaution to elevate status), the weight is no longer "tiny," so the specific math of the Scale Argument is irrelevant (you have full obligations already).
      *   **Non-Aggregation Views (Leaves B, D, F, H):** These views deny that numbers sum to override individual rights or thresholds.
      *   **Probabilistic Skepticism (Leaf C):** If the probability is low enough, the sum may remain negligible, blocking the conclusion that obligations are *large*.

