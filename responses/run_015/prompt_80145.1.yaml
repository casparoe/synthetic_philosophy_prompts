  **3. Indistinguishable Leaves**
  *   **Leaf A (Binary/Threshold/Precaution) vs. Graded/Threshold (Insects Clear):** *Why:* Practically identical. Whether you believe insects are "fully sentient" (Binary) or "sentient enough to cross the line" (Graded/Threshold), the resulting obligation is the same: full moral consideration. The tree cannot separate the *action guide* of these two metaphysical views.
  *   **Leaf A (Precautionary) vs. Leaf C (Expected Value @ High Prob):** *Why:* If your Expected Value calculation assigns a near-100% probability to sentience, it collapses into the Precautionary Principle. The tree separates the *method* of reasoning, but not necessarily the *outcome*.
