prompt: |-
  I sit on the clinical ethics committee of a hospital serving a community in which Ubuntu, often rendered in English as the maxim that a person is a person through other persons, is a live part of everyday moral vocabulary. We have been asked to resolve a dispute about Mr. N., 79, with advanced vascular dementia, now admitted with aspiration pneumonia and acute kidney injury. He has no advance directive and no designated proxy.

  His daughter, who lives abroad and has not visited in six years, has returned and is demanding a feeding tube, dialysis and transfer to intensive care. She argues that her father is not diminished by his dementia, because she and the wider family still hold him fully in relation, and that the team's proposal to focus on comfort treats him as already dead. His nursing team, together with the daughter of a neighbour who cared for him daily for twelve years, say that before his decline he often said he did not want to be kept alive in this condition, that he no longer recognises anyone, and that the aggressive plan serves the daughter's guilt rather than him.

  Two committee members want to treat Ubuntu as the tie-breaker in the daughter's favour: on a relational view, they say, it is the family's continuing relationship, not the patient's earlier stated wishes, that settles the case. I do not think we can use it that way, but I need a better account of what relational personhood actually requires here before Thursday. Please draft the short written opinion I will circulate: a concrete recommendation with a time frame, and reasoning that the family and the nursing team could both read without feeling dismissed, with the strongest point on the losing side stated in its best form. In particular, I want it to do three things.

  First, separate a constitutive reading of relational personhood, on which relationships partly make the person who he is and so can in principle ground claims that override what he earlier wanted, from a merely evidential reading, on which relationships are simply the best evidence of his own prior values and leave substituted judgment intact, and tell us which the committee should adopt and why.

  Second, confront the implication that worries me most: whether relational standing requires the patient's own ongoing participation. If it does, the daughter's now largely one-directional relationship may count for less than she assumes. If it does not, then a patient whose relational world has collapsed, with no visitors and no one holding him in mind, has less claim on us than one with an intact family, which cannot be right for a hospital that serves a great many isolated elderly people.

  Third, say what our policy should be when relational considerations are invoked selectively, by families who want everything done or by teams who want to stop, only when they happen to support the conclusion the speaker already favoured.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Clinical Ethics Committee (CEC) in a hospital serving a community where *Ubuntu* ("a person is a person through other persons") is a live moral concept.
      *   **Case:** Mr. N., 79, advanced vascular dementia, aspiration pneumonia, AKI. No advance directive, no proxy.
      *   **Conflict:**
          *   *Daughter (abroad, absent 6 years):* Demands feeding tube, dialysis, ICU. Argues Ubuntu means family relation sustains his personhood; comfort care treats him as dead.
          *   *Nursing Team + Neighbor (daily caregiver 12 years):* Cites prior oral wishes (no life support in this state), lack of recognition, aggressive plan serves daughter's guilt.
      *   **Committee Split:** Two members want to use Ubuntu as a tie-breaker for the daughter (relational view overrides prior wishes). The user disagrees.
      *   **Task:** Draft a short written opinion for circulation before Thursday.
      *   **Requirements:**
          1.  Concrete recommendation with a time frame.
          2.  Reasoning respectful to both sides (family and nursing team).
          3.  State the strongest point of the "losing" side (the daughter's argument) in its best form.
          4.  Address three specific philosophical/practical points:
              *   *Constitutive vs. Evidential Reading:* Distinguish these and argue for one.
              *   *Ongoing Participation:* Does relational standing require the patient's participation? Avoid the implication that isolated patients have less moral worth.
              *   *Selective Invocation:* Policy on using relational arguments only when they support a pre-desired conclusion.

  2.  **Deconstruct the Three Specific Points:**

      *   **Point 1: Constitutive vs. Evidential.**
          *   *Constitutive:* Relationships *make* the person. If the family says he's still "one of us," he is, regardless of his prior wishes. This supports the daughter.
          *   *Evidential:* Relationships help us *know* the person. They reveal his values. This supports substituted judgment (what would *he* want?).
          *   *Decision:* The prompt implies the user thinks using Ubuntu to override the patient's prior wishes is wrong. Therefore, I need to argue for the *Evidential* reading (or a modified Constitutive reading that doesn't allow external imposition). Actually, a nuanced Constitutive reading is often more faithful to Ubuntu, but it must be reciprocal. If I argue for Evidential, it aligns better with standard Western bioethics (substituted judgment). However, to honor the context, I should argue that *true* Ubuntu requires reciprocity. Let's aim for a *Relational Evidential* approach: Relationships help us discern the patient's narrative identity. If the relationship is one-sided, it cannot constitute personhood in a way that overrides the patient's own narrative.
          *   *Refinement:* Let's distinguish clearly. Constitutive (relationships define status) vs. Evidential (relationships reveal values). I will argue for a *Reciprocal Constitutive* view or an *Evidential* view. The prompt asks to "tell us which the committee should adopt and why." Given the user's stance ("I do not think we can use it that way"), I should argue against the "Constitutive overrides prior wishes" model. I will argue for the *Evidential* reading *informed by* a reciprocal view of Ubuntu. Relationships are the *lens* to see the patient's values, not a *veto* on them.

      *   **Point 2: Ongoing Participation.**
          *   *The Worry:* If personhood depends on relation, does a comatose/isolated person lose moral status?
          *   *Resolution:* Ubuntu is not just about being "held in mind" by others (which privileges the popular); it's about the *community's duty* to uphold the vulnerable. Personhood is a status bestowed by the community *to protect*, not a reward for having a loud family. Also, reciprocity matters. A relationship that ignores the other's expressed values is not a true "Ubuntu" relationship.
          *   *Key Argument:* Relational standing cannot be one-sided. If Mr. N. cannot participate, the relationship must be grounded in *his* prior participation/values. Isolated patients are protected by the hospital community (staff), not abandoned.

      *   **Point 3: Selective Invocation.**
          *   *The Problem:* Using "culture" or "relation" only when it wins the argument.
          *   *Policy:* Consistency. Relational arguments must apply universally. If Ubuntu demands aggressive care for Mr. N., it demands it for the isolated man in Bed 4. If it doesn't, it can't be used for Mr. N. either. It prevents "ethical cherry-picking."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Recommendation:** Needs to be concrete. Time-limited trial? Or immediate palliative focus? Given the medical futility aspect (advanced dementia, AKI, pneumonia), a time-limited trial of non-invasive treatment is often the compromise, but if the daughter demands *invasive* (tube/dialysis), that might be medically inappropriate. Let's recommend a *time-limited trial of medical optimization without invasive escalation* (e.g., antibiotics, fluids, no dialysis/PEG) for 48-72 hours, followed by reassessment. Or, given the "advanced vascular dementia" and "aspiration pneumonia," comfort care is likely the medically indicated path. I will recommend *Comfort Care with a 48-hour window for family presence*, avoiding invasive procedures that contradict prior oral directives.
      *   **Strongest Point of the Losing Side:** The daughter's argument that isolating the patient from the family's will alienates him from his social identity. To treat him as "dying" when the family says he "lives" in them is a form of social death.
      *   **Addressing Point 1 (Constitutive vs. Evidential):** Argue for Evidential. Relationships reveal who he *was* and what he *valued*. They don't grant the family ownership of his body.
      *   **Addressing Point 2 (Participation/Isolation):** Ubuntu protects the vulnerable. It doesn't require the patient to "perform" relation. The hospital staff are now part of his "community." One-sided relations (daughter) count less than reciprocal ones (neighbor/staff).
      *   **Addressing Point 3 (Selectivity):** Policy of consistency. Ubuntu cannot be a trump card only for aggressive care.

  4.  **Refining the Tone:**
      *   Must be respectful. Avoid accusing the daughter of guilt directly (even if the nurses suspect it). Frame it as "protecting his narrative."
      *   Must honor Ubuntu, not dismiss it as Western individualism. Show how a deeper understanding of Ubuntu supports the recommendation.
      *   *Self-Correction on Point 1:* The prompt asks to separate Constitutive from Evidential. The two committee members want a Constitutive reading (relationships make the person, so family says he lives). I need to argue why we should *not* adopt that specific Constitutive reading, but perhaps a different one. Actually, the prompt asks me to "tell us which the committee should adopt." I will argue for the **Evidential** reading in the context of surrogate decision-making, because the Constitutive reading risks violating the patient's own dignity.
      *   *Self-Correction on Point 2:* I need to ensure I don't imply the isolated patient has less worth. The argument is that the *community's obligation* is to uphold the personhood of the vulnerable, not that personhood *vanishes* without family.
      *   *Self-Correction on Point 3:* Make this a policy recommendation.

  5.  **Final Polish:**
      *   Check word count (keep it "short written opinion").
      *   Ensure the recommendation is clear (Comfort care, no dialysis/PEG).
      *   Ensure the "Thursday" deadline is met (implied by tone).
      *   Check that the "Strongest Point" is clearly articulated.

      *(Self-Correction during drafting)*: I need to be careful with the "Constitutive" argument. In Ubuntu philosophy, personhood *is* constitutive. To say "we adopt the evidential reading" might sound like rejecting Ubuntu. I should frame it as: We adopt a Constitutive reading *but* recognize that personhood is co-constructed by the patient's own history and values, not just the current demands of relatives. Or, simpler: In a medical decision context, relationships serve an *evidential* function regarding the patient's values. Let's stick to the prompt's distinction. I will argue for the Evidential reading *for the purpose of clinical decision-making*, while acknowledging the Constitutive truth of social existence.
      *Wait, a better nuance:* A true Constitutive view requires *mutual* recognition. You can't constitute someone's personhood against their own lifelong narrative. So I can argue for a *Reciprocal Constitutive* view. But the prompt asks to choose between "Constitutive... ground claims that override" vs "Evidential... leave substituted judgment intact." I should choose **Evidential** for the specific purpose of *surrogate decision making* to protect the patient.

      *Let's reconsider the "Strongest Point".* The daughter's point is that medical reductionism (biological life vs. social life) ignores the cultural reality. That is strong. I must validate that.

      *Let's reconsider the "Participation" point.* If personhood requires participation, the demented lose it. That's bad. So personhood must be a *status* granted by the community to the vulnerable. But whose definition of the community? The daughter (absent) or the Neighbor/Staff (present)? The latter.

      *Let's reconsider "Selectivity".* This is about integrity.

      *Recommendation:* Do not initiate dialysis or PEG. Treat pneumonia with antibiotics if comfortable, otherwise focus on symptom management. 48-hour window for family to gather.

  6.  **Finalizing the Text:** (Mental Outline)
      *   **To:** CEC Members
      *   **From:** [My Name]
      *   **Subject:** Recommendation re: Mr. N.
      *   **Recommendation:** Comfort-focused care, no invasive escalation. 48-hour implementation delay.
      *   **Strongest Counter-Argument:** The risk of "social death" imposed by medicine.
      *   **Analysis 1 (Constitutive vs Evidential):** Adopt Evidential for decisions. Relationships reveal values, they don't overwrite them.
      *   **Analysis 2 (Participation):** Ubuntu protects the vulnerable. One-sided relationships don't count as much as reciprocal ones (Neighbor > Daughter). Isolated patients are held by the hospital community.
      *   **Analysis 3 (Selectivity):** Consistency policy. Ubuntu applies to the isolated too.
      *   **Closing:** Unity.

      *(Refining the "Constitutive vs Evidential" argument)*: If I say "Adopt Evidential," am I dismissing Ubuntu? No, I am interpreting its application in *proxy consent*. I will argue that while personhood is ontologically relational (Constitutive), *decisional authority* must be evidential regarding the patient's narrative.
      *Actually, the prompt asks me to choose.* "tell us which the committee should adopt and why." I will choose **Evidential** for the purpose of *clinical ethics deliberation*, because the Constitutive reading (as proposed by the two members) allows third parties to override the subject's own life narrative, which violates the dignity Ubuntu seeks to protect.

      *(Refining the "Participation" argument)*: If relational standing requires ongoing participation, Mr. N. loses. If it doesn't, the isolated man loses. Solution: Relational standing is based on *history of reciprocity* and *community duty*. The neighbor has standing; the daughter (absent) has less. The hospital stands in for the community for the isolated.

      *(Refining the "Selectivity" argument)*: Policy: Relational arguments must be universalizable.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation and Reasoning re: Mr. N.

  **Recommendation**
  I recommend we advise the clinical team **not to initiate dialysis or percutaneous endoscopic gastrostomy (PEG)**, and to focus on symptom management for the pneumonia, prioritizing comfort over prolongation. To honor the family's need for closure, I recommend a **48-hour window** before fully transitioning to comfort-only measures, during which the daughter may be present and non-invasive treatments continued.

  **The Strongest Case for the Daughter**
  Before explaining my reasoning, I wish to validate the two committee members who argued for the daughter's position. Their strongest point is this: Biomedical ethics often reduces a person to their biological function. In our context, to declare Mr. N. "dying" because his cognition has failed is to impose a "social death" that contradicts the reality that he is still a father and grandfather. If we ignore the family's refusal to let him go, we risk treating him as a biological object rather than a person embedded in a lineage. This is a serious moral harm.

  However, while this concern is valid, I believe the daughter's proposed solution violates the deeper requirements of the relational ethics she invokes. My reasoning rests on three points.

  **1. Constitutive vs. Evidential Relationality**
  We must distinguish between two ways relationships matter. A *constitutive* reading suggests relationships create the person's status, potentially allowing the family to override the patient's prior wishes. An *evidential* reading suggests relationships are the best lens to discern the patient's own values, leaving substituted judgment intact.

  For clinical decision-making, **we must adopt the evidential reading.** While Ubuntu teaches that personhood is ontologically constitutive (we exist through others), it does not grant the community ownership of the individual's narrative. If relationships could override a patient's lifelong values, personhood would become a hostage to the will of others. The daughter's relationship provides *evidence* of how she sees him, but the neighbor's relationship provides better evidence of how *he* saw himself. We cannot use "relation" to silence the patient's own voice as expressed through his prior oral directives.

  **2. Reciprocity and the Isolated Patient**
  My second concern is the requirement of participation. If relational standing requires the patient's ongoing cognitive participation, Mr. N. has already lost it. But if it does not, we face a darker implication: that a patient with no family to "hold them in mind" has less moral claim than one with a vocal family. This cannot be our policy.

  True relational personhood relies on **reciprocity and presence**, not just biological lineage. The neighbor who cared for Mr. N. daily for twelve years engaged in a reciprocal relationship; the daughter, absent for six years, offers a one-directional claim. Furthermore, for the isolated elderly in our care, **the hospital community becomes the relational holder.** We owe the isolated man the same protection of his prior dignity that we owe Mr. N. Personhood is a status the community *upholds* for the vulnerable, not a reward for having a loud family.

  **3. Policy on Selective Invocation**
  Finally, we cannot allow relational arguments to be used selectively. We must adopt a policy that **cultural or relational claims must be universalizable.** If Ubuntu demands aggressive intervention for Mr. N. because he is "held in relation," it must demand the same for the isolated patient in Bed 4, whom the staff holds in relation. If it does not justify invasive care for the isolated, it cannot justify it for Mr. N. We cannot permit families to invoke community values only when they support a desired medical outcome, nor can teams invoke them only to justify stopping care.

  **Conclusion**
  Honoring Mr. N. as a person means honoring the life he lived and the values he expressed, not just the grief of those he leaves behind. The neighbor and the nursing team reflect his relational history more accurately than the daughter's current demands. I ask the committee to support this recommendation.
