answer: |-
  Friedman's F-twist can be operationalized for a non-expert board member, but only if you agree to ignore the realism of assumptions entirely and judge solely on whether changing those assumptions would alter the final policy recommendation.

  ### Reasoning and Distillation of Principles

  To convert Friedman's instrumentalism into a thirty-minute checklist, I had to discard epistemological debates about "truth" and retain only those distinctions that affect policy risk. Friedman argues that assumptions are irrelevant if predictions are accurate; however, a board member cannot verify predictions before voting. Therefore, the procedure must test the *sensitivity* of the prediction to the assumption rather than the *truth* of the assumption itself.

  **Distinctions Dropped:**
  *   **Realism vs. Truth:** Whether an assumption matches reality is irrelevant to Friedman; asking you to verify soil samples or driving logs wastes time.
  *   **Causal Mechanism:** Whether the model explains *why* something happens matters less than *what* it says will happen.
  *   **Mathematical Rigor:** You cannot check the calculus; you must check the logic of the input-output relationship.

  **Distinctions Surviving:**
  *   **Structural vs. Decorative:** Does the assumption hold up the roof (structural), or is it just paint (decorative)? If removing it collapses the result, it is structural.
  *   **Directional Bias:** Does the unrealistic assumption consistently push the result toward a specific political or financial outcome?
  *   **Predictive Track Record:** Has this model or similar assumptions produced accurate results in comparable contexts before?

  ### The 30-Minute Decision Procedure

  **Step 1: The Purpose Test**
  *   **Question:** Is the model being used to predict a specific outcome (e.g., flood height, pollution levels) or to explain a mechanism (e.g., why people choose routes)?
  *   **Sufficient Answer:** "Predict" proceeds to Step 2. "Explain" proceeds to Step 3.
  *   **Stop/Reject:** If the model claims to explain human behavior using purely physical assumptions (or vice versa) without acknowledging the mismatch.
  *   **Judgment Call:** Distinguishing between a prediction tool and an explanation tool is often blurred in consultant summaries; if unsure, treat as Prediction.

  **Step 2: The Sensitivity Test (The Core F-Twist)**
  *   **Question:** If you deliberately broke this unrealistic assumption (e.g., made soil varied, made driving habits random), would the final recommendation change enough to alter your vote?
  *   **Sufficient Answer:** Consultant provides a "sensitivity analysis" showing the result stays within the same decision bracket (e.g., flood risk remains "High" even if soil varies).
  *   **Stop/Reject:** If the consultant admits the result flips (e.g., from "Safe" to "Unsafe") when the assumption is relaxed.
  *   **Stop/Approve:** If the result remains stable despite the assumption being false.
  *   **Judgment Call:** Determining what counts as a "change enough to alter your vote" is a value judgment, not a technical fact. You must decide if a 5% change in risk matters.

  **Step 3: The Bias Test**
  *   **Question:** Does the unrealistic assumption systematically benefit a specific stakeholder or political outcome?
  *   **Sufficient Answer:** No identifiable beneficiary, or the benefit is incidental.
  *   **Stop/Reject:** If the assumption simplifies the problem in a way that automatically validates a pre-determined conclusion (e.g., assuming rational commuters to justify a road that only helps drivers).
  *   **Hand to Human Judgment:** If the assumption benefits a stakeholder but the sensitivity test says the result wouldn't change anyway. You must decide if the appearance of bias is enough to reject technically sound work.

  **Step 4: The Validation Test**
  *   **Question:** Has this model structure produced accurate predictions in similar counties or past projects?
  *   **Sufficient Answer:** Yes, with documented evidence of past accuracy.
  *   **Stop/Reject:** No past validation and high sensitivity (from Step 2).
  *   **Stop/Approve:** Past validation exists, even if assumptions are known to be false.

  **What This Procedure Cannot Do:**
  *   It cannot protect you from "black swan" events where the model works until it suddenly doesn't.
  *   It cannot resolve conflicts where the "correct" prediction still leads to a policy you morally oppose.
  *   It cannot verify the math; it assumes the consultant has calculated the sensitivity correctly unless proven otherwise.

  ### Worked Applications

  **Case 1: Flood Model (Uniform Clay Soil)**
  *   **Analysis:** The assumption is physically false (soil varies). Step 1 identifies this as a Prediction model. Step 2 (Sensitivity) asks: If soil varies, does the flood risk rating change? If the county is mostly clay, the assumption is decorative for aggregate risk. If the county has significant sand pockets, the assumption is structural.
  *   **Procedure Output:** **Reject.** In flood modeling, soil permeability is structurally critical. A sensitivity analysis on soil variance usually shows drastic changes in runoff velocity. Because the assumption is structural and false, the model fails Step 2.
  *   **Verdict:** Request revised model with varied soil zones.

  **Case 2: Air-Quality Model (Identical Annual Mileage)**
  *   **Analysis:** The assumption is absurd (people drive different amounts). Step 1 identifies this as a Prediction model (total emissions). Step 2 (Sensitivity) asks: Does total emissions change if mileage varies but the *average* stays the same? For aggregate pollution totals, individual variance often cancels out; the sum remains stable. Step 4 (Validation) likely shows aggregate models work well despite individual errors.
  *   **Procedure Output:** **Approve.** Despite the glaring unrealism, the assumption is decorative for the specific goal of total county emissions. Friedman's principle holds: the false assumption yields a valid prediction.
  *   **Verdict:** **This is the answer you will not like.** You must vote to accept a model that claims every resident drives the exact same distance, because for the specific question of total air quality, the falsehood does not alter the prediction.

  **Case 3: Traffic Model (Shortest-Time Route & Political Expansion)**
  *   **Analysis:** The assumption is standard economics (rational actors) but supports a preferred political outcome. Step 1 is Prediction. Step 2 (Sensitivity) is ambiguous; commuters often take scenic or habitual routes. Step 3 (Bias) triggers hard: the assumption simplifies behavior in a way that maximizes road usage statistics, directly justifying the expansion.
  *   **Procedure Output:** **Hand to Human Judgment.** Technically, the model might pass sensitivity if the road expansion is the only bottleneck. However, the assumption creates a directional bias toward the political preference. You must decide if the potential bias outweighs the technical stability.
  *   **Verdict:** Do not reject on technical grounds alone, but flag the bias in the public record and demand a secondary model using "habitual route" assumptions to compare results.
