  TO: All Case Officers, Grade 4+
  FROM: Bureau of Rule Adjudication, Standards Division
  DATE: 14 October 2024
  SUBJECT: Operational Guidelines Post-*Vance v. State Board of Semantics*

  1. **Purpose and Scope**
  Following the Supreme Court's ruling in *Vance*, officers are reminded that semantic content is no longer treated as a private mental state or a Platonic fact. There is no ontological difference between meaning *addition* and meaning *quaddition*. Correctness is strictly a function of communal assertibility. This circular outlines the procedural metrics for adjudicating claims where a speaker's usage diverges from established norms. Officers must not investigate what a claimant *really* meant. Such inquiries are non-justiciable.

  2. **Determination Metrics**
  All determinations must proceed via the Community Overlap Ratio (COR). Officers will administer a standard probe set (n=50) to the claimant and compare responses against the Bureau's Registered Panel. A COR of 0.9 or higher establishes assertibility. Anything below constitutes a deviation requiring correction or reclassification.

  Officers are explicitly forbidden from considering the following evidentiary categories:
  *   **Dispositional Assessment:** Claims that the claimant was "disposed" to answer differently are rejected due to the finitude problem. Past behavior does not constitute a fact about future application.
  *   **Semantic Fact Petitions:** Appeals to straight-solution metaphysics (e.g., "I grasped the concept itself") are unfounded and should be logged under Code 88 (Delusional Semantics).
  *   **Interpretive Regress:** Claimants may argue that the rule requires interpretation. Officers should not engage philosophically. Instead, issue Schedule 4.2 (Rule for Interpreting the Rule). If the claimant requests a rule for *that* rule, issue Sub-clause 4.2.1, then 4.2.1.1, and so on. Treat the infinite regress as ordinary paperwork. The file thickness constitutes compliance.

  3. **Worked Example: Large-Number Probes**
  Consider a claimant who answers "5" when presented with the probe "68 + 57." The claimant insists they meant addition all along and feel obligated to say 125. This feeling is a subjective impression of obligatoriness and carries no evidential weight. The Officer must check the COR.

  If the Registered Panel answers "125," the claimant's COR drops. They are not asserting correctly. However, if local testing reveals the claimant's neighbors also answer "5" on large-number probes, the Community Overlap Ratio remains high. In this scenario, there is no error to correct. The math is not wrong; the panel is outdated. The remedy is not to correct the citizen but to redraw the Registered Panel to match the neighborhood. Do not annotate the file with "error corrected." Annotate with "Panel realigned." We do not fix mistakes; we adjust the consensus metric.

  4. **Edge Cases: Solitary and Novel Probes**
  **Solitary Claimants:** For speakers with no community (e.g., isolated individuals, hermits), no determination is possible. Without a community to grant assertibility, there is no meaning to adjudicate. Adjourn these cases indefinitely. Hold in abeyance. Do not attempt to simulate a community; simulated consensus lacks the requisite normative force.

  **Unprecedented Probes:** When a claimant encounters a calculation never before performed by anyone (e.g., the first time anyone adds numbers over 10^50), the outcome is not discovered but decided. The Officer's acceptance constitutes the rule. Under no circumstances write "was in fact correct" in the record. This implies a truth condition independent of the Bureau's stamp. Use "is hereby accepted" or "passes assertibility conditions."

  5. **Complaints and External Criticism**
  Officers may encounter objections from straight-solution pressure groups. These should be logged but not engaged. For example, regarding the COR metric, the group *Truth Matters* recently filed:

  > "The Ratio just relocates the problem. The Panel's own answers need interpreting. Who checks the checkers? You're assuming the Panel means addition, but they could mean quus."

  The Bureau's reply is procedural: The Panel is registered. Their usage defines the standard. Whether the Panel *means* addition is irrelevant; they are the Panel. If they deviate, we re-register them. The circle is not a flaw; it is the foundation.

  6. **Conclusion**
  Adherence to these guidelines ensures the Bureau remains compliant with *Vance*. We do not discover meaning. We administer it.

  Signed,
  *J. H. Miller*
  Director of Standards
  Bureau of Rule Adjudication
