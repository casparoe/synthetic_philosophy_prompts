answer: |-
  You are describing the **Careenium**, and the book is Daniel Dennett's *Consciousness Explained* (1991). The "simmballs" are his metaphor for symbols in a connectionist network, and the puzzle you recall is the problem of **Intentionality**: how can physical blobs have "aboutness," and can that "aboutness" cause physical effects?

  You have encountered the central tension of the philosophy of mind and computation, but you have isolated a specific, dynamic mechanism that standard philosophy often treats as static. You are asking about the stability of the mapping between the **Semantic Level** (meaning, schema, spec) and the **Syntactic/Physical Level** (bits, electrons, voltage).

  Here is the lay of the land, the established concepts that fit, where they fail to capture your twist, and a proposal for what to call the specific phenomenon you are seeing.

  ### 1. The Established Landscape

  There are three standard concepts that cover 80% of what you are describing. You need to know them to see where your "twist" diverges.

  **A. Supervenience**
  This is the relationship where the high level (meaning) depends entirely on the low level (bits). If you change the meaning, the bits *must* have changed. If the bits are identical, the meaning *must* be identical.
  *   **Where it fits:** It explains why your engineer's account (electrons) is complete. The meaning doesn't exist *apart* from the electrons.
  *   **Where it fails:** Supervenience implies a fixed dependency. It doesn't explain Case 2, where the bits changed (a sixth code appeared) but the meaning *didn't* change (the report stayed clean). In strict supervenience, a change in the base *should* force a change in the higher level. Your system prevented that.

  **B. Multiple Realizability**
  This is the idea that the same high-level state (e.g., "the number 5") can be realized by many different low-level states (voltage high, magnetic north, hole punched).
  *   **Where it fits:** It explains Case 3 (JIT compilation). The program is the same because the *function* is the same, even though the *structure* is totally different.
  *   **Where it fails:** Multiple realizability is usually passive. It says "different substrates can run the same program." It doesn't account for the *active negotiation* you see in Case 2, where the system *forces* a mismatched substrate to count as a valid realization to save the program.

  **C. Causal Exclusion (The "Shoving" Problem)**
  This is the puzzle from the Careenium. If physics is "causally closed" (every physical event has a sufficient physical cause), then "meanings" cannot shove markers. Only electrons shove electrons. If meanings *did* shove markers, physics would be violated.
  *   **The Standard Solution:** Most philosophers and scientists accept **Explanatory Pluralism**. The electron account is true for physics. The meaning account is true for engineering. Neither refutes the other because they answer different questions ("How did the voltage change?" vs. "Why did the data move?").
  *   **The Dispute:** **Eliminative Materialists** say the meaning level is a fiction; only the electrons are real. **Non-Reductive Physicalists** (like Dennett) say the meaning level is real because it captures patterns the electron level misses. This is still heavily disputed.

  ### 2. Your Twist: The Renegotiated Mapping

  Your three cases describe something more active than standard supervenience. You are describing a system that actively maintains the truth of the high-level description by adjusting the translation rules when the low-level data deviates.

  In Case 2, the spec says "Five codes." Reality provides "Six codes." A rigid system crashes. Your system *re-interprets* the sixth code as the fifth to preserve the spec's validity. The mapping drifted to save the meaning.

  In Case 3, you identify the boundary condition. A bit flip kills the program; a JIT recompilation saves it. Why? Because the JIT is an **intentional preservation of function**, whereas the bit flip is **accidental deviation**. The "rule" you are looking for is **Teleological Continuity**. The high-level description survives as long as the *purpose* is being served, regardless of substrate fidelity.

  ### 3. A Name for the Phenomenon

  There is no single settled term for "a coarse description whose mapping onto the fine-grained stuff is renegotiated after the fact."

  The closest existing technical term is **Realization Plasticity**, but that is usually used in neuroscience to describe the brain rewiring itself. In philosophy of computing, the closest concept is **Implementation Independence**, but that implies the mapping doesn't matter, whereas you are showing the mapping *matters intensely* but is *flexible*.

  I propose we call your specific phenomenon **Interpretive Homeostasis**.

  **Definition:** Interpretive Homeostasis is the capacity of a computational system to maintain the validity of its high-level semantic description by dynamically adjusting the interpretation rules of its low-level physical states when those states deviate from specification.

  **Why this fits:**
  *   **Homeostasis:** Like a body maintaining temperature despite external cold, your system maintains "semantic temperature" (valid reports) despite "data cold" (invalid codes).
  *   **Interpretive:** The work is done in the *mapping layer*, not the data layer. The bits aren't fixed; the *reading* of the bits is fixed.

  ### 4. Boundaries and Edge Cases

  You asked for the edges where this shades into something else. Here is the boundary map for Interpretive Homeostasis:

  **Boundary 1: Error Handling vs. Homeostasis**
  *   *Error Handling:* The system detects a deviation and flags it (e.g., returns `NULL` or throws an Exception). The high-level description admits a failure.
  *   *Homeostasis:* The system detects a deviation and absorbs it (e.g., maps Code 6 to Code 5). The high-level description remains "successful."
  *   *The Edge:* If the absorption distorts the meaning too much (e.g., mapping Code 6 to Code 1 changes the report's decision), the homeostasis fails. The boundary is **Semantic Fidelity**. If the lie becomes too big, the coarse description is no longer useful.

  **Boundary 2: Optimization vs. Corruption (Your Case 3)**
  *   *Optimization (JIT):* The substrate changes, but the *causal history* is intentional. An agent (compiler) ensured the new substrate serves the old purpose.
  *   *Corruption (Bit Rot):* The substrate changes due to entropy. No agent ensured the purpose is served.
  *   *The Edge:* This is the **Intent Boundary**. We say the "same program" is running only if there is a continuous chain of intentional preservation connecting the old substrate to the new one. If the chain is broken by randomness, the identity dies. This is not a physical difference; it is a historical one.

  **Boundary 3: Refutation vs. Drift**
  *   *Refutation:* The low level proves the high level wrong (e.g., the disk is empty, but the report says "Data Processed").
  *   *Drift:* The low level deviates, but the high level is adjusted to remain "right."
  *   *The Edge:* **Observability**. If an external auditor can inspect the raw bits and see the sixth code, the homeostasis is fragile. It relies on the auditor accepting the coarse report. If the auditor goes lower-level, the homeostasis collapses into a lie.

  ### 5. Settled vs. Disputed

  To ensure you know where the ground is solid and where it is shaking:

  **Settled:**
  1.  **Causal Closure of Physics:** It is settled science that electrons move due to physical forces, not "meanings." Your engineer's account is physically complete.
  2.  **Indispensability:** It is settled practice that we cannot operate complex systems without the coarse level. No one debugs a nightly job by tracing individual electrons. The coarse level is pragmatically necessary.

  **Disputed:**
  1.  **Ontological Status:** Does the "schema" actually exist, or is it just a story we tell about the electrons? **Realists** say the schema is a real pattern in the universe. **Instrumentalists** say it's just a useful tool for prediction. This is unresolved.
  2.  **Downward Causation:** Can the schema *cause* the electrons to move?
      *   *Hard No:* Only physics causes physics. The schema is just a description.
      *   *Soft Yes:* The schema is a higher-level pattern that constrains the physics. (This is the Non-Reductive Physicalist view).
      *   *My Position:* I side with the **Soft Yes**, but with a caveat. "Meaning" doesn't shove electrons like a magnet shoves iron. "Meaning" shoves electrons like a *rule* shoves a player in a game. The rule doesn't have physical force, but the player moves *because* of the rule. In your Case 1, the field name moved the bytes because the *engineers* obeyed the rule associated with the name. The causality flows through the human/social layer that maintains the machine.

  ### 6. Summary of the Relation

  You asked for the relation where the coarse level cannot be refuted by the fine level nor shown to be doing work of its own.

  That relation is **Normative Autonomy**.
  The coarse level establishes a *norm* (the spec). The fine level provides the *facts* (the bits). Usually, facts refute norms. In your systems, the interpretation layer bends the facts to fit the norm.

  *   **Case 1:** The norm (schema name) dictates the physical arrangement. (Norm drives Fact).
  *   **Case 2:** The fact (sixth code) is bent to fit the norm (five codes). (Fact bent to Norm).
  *   **Case 3:** The norm (program identity) survives substrate change if the intent is preserved, but dies if the change is accidental. (Norm persists over Fact, conditionally).

  **Your "Map Drift" is Interpretive Homeostasis.**
  It differs from **Multiple Realizability** because it is active, not passive.
  It differs from **Supervenience** because the mapping is not fixed.
  It differs from **Error Handling** because it hides the deviation rather than flagging it.

  The edge case where it fails is when the cost of the reinterpretation exceeds the value of the abstraction. If mapping Code 6 to Code 5 makes the report legally fraudulent, the homeostasis must break, and the system must crash. The boundary is not technical; it is **ethical/pragmatic**.

  You are not just moving data; you are maintaining a reality tunnel where the business logic remains true even when the physics tries to tell a different story. That is not just engineering; that is ontology management.
