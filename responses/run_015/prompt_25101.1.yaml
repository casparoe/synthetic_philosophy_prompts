answer: |-
  You have identified a robust and active area of contemporary moral philosophy. The phenomenon you are describing sits at the intersection of **meta-ethics**, **moral psychology**, and **argumentation theory**.

  The specific concept you are looking for is **"Moral Standing to Blame"** (or sometimes "Standing to Criticize").

  While introductory logic classes dismiss this move as the **_Tu Quoque_ fallacy** (a subtype of _Ad Hominem_), contemporary ethical literature argues that _Tu Quoque_ is too blunt an instrument. It correctly identifies that the critic's behavior does not change the *truth* of the moral claim, but it fails to capture why the critic's behavior might make the *act of criticizing* inappropriate, ineffective, or unjust.

  Here is a map of the philosophical framework that analyzes exactly what you are observing, the competing accounts of why standing is lost, and the boundaries that distinguish legitimate challenges from fallacies.

  ### 1. The Core Distinction: Truth vs. Standing
  The first step in the literature is distinguishing between the **propositional content** of the criticism and the **normative authority** of the speaker.
  *   **Truth:** "Stealing is wrong." (This is objective/inter-subjective).
  *   **Standing:** "Do *you* have the right to tell *me* that stealing is wrong?" (This is relational and normative).

  When a target says, "You can't criticize me," they are usually not claiming the criticism is false. They are claiming the critic lacks the **normative standing** to issue the blame. As philosopher **Macalester Bell** puts it, standing is a "normative power" to hold others accountable. When that power is undercut, the criticism may remain *true*, but it becomes *illegitimate* as a speech act.

  ### 2. Why is Standing Lost? (Three Competing Accounts)
  Philosophers disagree on *why* hypocrisy or complicity strips a critic of standing. This disagreement helps explain why your intuition varies across cases.

  #### A. The Fairness Account
  *   **Proponents:** R. Jay Wallace, Macalester Bell.
  *   **The Principle:** It is unfair to hold someone to a standard you are not willing to accept for yourself. Blame involves a demand for accountability; if you exempt yourself from that demand, you are asserting a false superiority.
  *   **Explaining your cases:**
      *   *The Hypocrite:* Loses standing because they are claiming an exemption they haven't earned.
      *   *The Reformed Wrongdoer:* **Retains standing.** Because they acknowledge they were wrong and accept the standard now, they are not claiming superiority. In fact, their past may give them *more* epistemic authority, even if their moral standing was temporarily compromised.
      *   *The Beneficiary:* This is tricky for the Fairness Account. If I benefit from a system I criticize (e.g., an environmentalist who flies on planes), am I being unfair? Proponents argue yes, if I am not making comparable sacrifices.

  #### B. The Commitment Account
  *   **Proponents:** Kyle Fritz & Daniel Miller ("Hypocrisy and the Standing to Blame").
  *   **The Principle:** To blame someone is to imply a commitment to the norm you are invoking. Hypocrisy reveals a lack of commitment to that norm. If you don't truly care about the norm (evidenced by your own violation), you lack the authority to enforce it.
  *   **Explaining your cases:**
      *   *Secret Hypocrite:* Loses standing because their actions reveal they don't actually endorse the norm they are preaching.
      *   *Different Domain:* If I criticize your lying but I cheat on my taxes, do I lack commitment to *honesty* generally, or just *tax honesty*? This account forces a debate on how specific the norm must be.
      *   *The Reformed Wrongdoer:* Retains standing because their reform demonstrates a *current* commitment to the norm, even if past actions contradicted it.

  #### C. The Communication Account
  *   **Proponents:** Elinor Mason, Emma McClure.
  *   **The Principle:** Blame is a communicative act intended to bring the wrongdoer to recognize their fault. Hypocrisy blocks this communication. The wrongdoer will inevitably focus on the critic's behavior rather than their own, rendering the blame functionally useless.
  *   **Explaining your cases:**
      *   *The Beneficiary/Complicit:* If I criticize a harm I am currently inflicting, the communication breaks down because I am not acknowledging my own role. The target sees me as an aggressor, not a moral guide.
      *   *Legitimate Deflection:* This account validates the target's reaction not as a logical rebuttal, but as a pragmatic response to a failed speech act.

  ### 3. Mapping the Boundaries (When is it a Fallacy vs. Legitimate?)
  The literature identifies specific conditions that sort the cases where the deflection is legitimate from those where it is merely a _Tu Quoque_ fallacy.

  #### Condition 1: Relevance of the Transgression
  *   **Fallacy:** "You say I shouldn't steal, but you cheated on your wife." (Different norms).
  *   **Legitimate:** "You say I shouldn't steal, but you are currently stealing from the till." (Same norm).
  *   **The Gray Area:** Fritz & Miller argue that the norms must be sufficiently similar. Criticizing someone for cruelty while being cruel yourself undermines standing. Criticizing cruelty while being messy does not. The boundary lies in whether the two actions violate the **same underlying value**.

  #### Condition 2: Acknowledgment and Repentance
  *   **Fallacy:** Pointing out a past sin that the critic has already acknowledged and repented.
  *   **Legitimate:** Pointing out a current sin that the critic denies or hides.
  *   **Philosophical Insight:** This explains your "Reformed Wrongdoer" intuition. **Todd Calder** argues that hypocrisy is only damaging to standing if it involves a refusal to acknowledge the wrong. If the critic says, "I did this too, it was wrong, and that's why I'm asking you to stop," they retain standing. If they say, "Don't do this," while doing it secretly, they lose it.

  #### Condition 3: Structural Complicity vs. Individual Hypocrisy
  *   **The Hard Case:** "You criticize capitalism, but you buy coffee at Starbucks."
  *   **The Debate:** This is the "Beneficiary" case you mentioned.
      *   **View A (Non-Ideal Theory):** In a non-ideal world, we are all complicit. If complicity removed standing, no one could criticize systemic injustice. Therefore, benefiting from a system does not negate standing to criticize it (provided one is working to change it).
      *   **View B (Integrity):** If the critic presents themselves as "pure" while benefiting, they are hypocrites. If they acknowledge their complicity ("We are both stuck in this, but we must try to exit"), they retain standing.
      *   **Key Reference:** **Tracy Isaacs**, "Moral Responsibility in Collective Contexts." She discusses how individual standing functions within systemic complicity.

  ### 4. Key Literature for Further Reading
  If you want to dive into the primary sources, these are the seminal works that map this terrain:

  1.  **"The Standing to Blame" by Macalester Bell (2013).**
      *   *Why read it:* This is the foundational paper that distinguishes standing from the truth of the blame. It outlines the "Fairness" view.
  2.  **"Hypocrisy and the Standing to Blame" by Kyle Fritz and Daniel Miller (2015/2018).**
      *   *Why read it:* This offers the strongest counter-argument to Bell. They argue fairness isn't the key; *commitment to the norm* is. This helps analyze the "Reformed Wrongdoer" case best.
  3.  **"What's the Point of Blame?" by Christopher Fricker (2016).**
      *   *Why read it:* Explores the function of blame, which helps determine when undercutting a critic serves a moral purpose versus when it is just evasion.
  4.  **"Tu Quoque Arguments and the Significance of Hypocrisy" by Todd Calder (2009).**
      *   *Why read it:* Directly addresses your puzzle about when the _Tu Quoque_ move is fallacious and when it is a legitimate moral objection.
  5.  **"Responsibility and the Moral Sentiments" by R. Jay Wallace (1994).**
      *   *Why read it:* The broader framework for how we hold one another responsible, which sets the stage for the standing debate.

  ### Summary of the Framework
  To analyze the cases you are seeing, apply this filter:

  1.  **Is the criticism true?** (If no, it's not a standing issue, it's a factual dispute).
  2.  **Does the critic claim exemption?** (If they acknowledge their own fault, standing is usually retained).
  3.  **Is the violation relevant?** (Does the critic's behavior violate the *same norm* they are invoking?)
  4.  **Is the behavior current or past?** (Current secret violation destroys standing; past acknowledged violation often preserves it).

  The "loss" you are sensing is the loss of **moral authority**. The target is asserting that the critic has forfeited the right to participate in the specific normative practice of "holding accountable" because they have violated the terms of participation (fairness, commitment, or honesty). When the target's claim meets these conditions, it is not a fallacy; it is a valid challenge to the **felicity conditions** of the moral speech act.
