answer: |-
  ### Translation: Consequentialist Cluelessness as Mechanism Design

  To translate the problem of consequentialist cluelessness into mechanism design (MD) vocabulary, we model the moral agent as a **social planner** (or single-agent mechanism designer) attempting to **implement** a **Social Choice Function (SCF)** over an infinite horizon. The "Good" is the **Objective Function** $U$. "Cluelessness" is the claim that the planner cannot identify a **Bayesian Nash Equilibrium** or an **Optimal Mechanism** because the **Type Space** (states of the world) and **Prior Beliefs** regarding long-run outcomes are ill-defined or non-robust.

  #### Component Mapping

  | Philosophical Component | Mechanism Design Translation | Mapping Status |
  | :--- | :--- | :--- |
  | **Consequentialism** | Maximization of an exogenous Objective Function $U(a, \omega)$ over outcomes $\omega$ resulting from action $a$. | **Clean Map** |
  | **Long-Run Outcomes** | Infinite-horizon dynamic game or stochastic process with discount factor $\delta \to 1$. | **Clean Map** |
  | **Radical Unreliability** | Absence of a **Common Prior**; or, the value function is discontinuous with respect to the topology of beliefs (failure of **Robustness**). | **Distortion** (MD assumes priors exist; Cluelessness denies meaningful formation). |
  | **Expected-Value Reasoning** | Bayesian Expected Utility Maximization ($\max_a \mathbb{E}_\mu[U(a, \omega)]$). | **Clean Map** |
  | **Collapse/Paralysis** | The set of optimal actions is empty, or the **Implementation Set** is the entire action space (indeterminacy). | **Clean Map** |
  | **Normative "Ought"** | The imperative to select the mechanism that maximizes $U$. | **No Counterpart** (MD is conditional: *if* maximize $U$, *then* do $X$). |
  | **Epistemic Limit** | **Identification Failure**: Parameters of the payoff function cannot be estimated from available data. | **Clean Map** |

  #### Residue Report

  The translation reveals a specific residue: the **exogeneity of the Objective Function** and the **selection of the Ambiguity Set**.

  1.  **Normative Resources:** Mechanism design lacks resources for *foundational* normative reasoning. It treats the Objective Function $U$ and the set of admissible Priors $\mathcal{P}$ as exogenous parameters. It cannot derive *why* $U$ should be maximized, nor can it internally justify the bounds of the ambiguity set $\mathcal{P}$ when a common prior is absent. This is not a flaw but a boundary condition of the framework; MD is a technology of implementation, not a meta-ethic.
  2.  **Dissolution of Intuition:** The philosophical claim that cluelessness induces a unique *moral* crisis dissolves upon formalization. In MD, "cluelessness" is isomorphic to **non-identification** or **extreme model uncertainty**. When $\mathbb{E}[U]$ is undefined or the optimal set is empty due to sensitivity to priors, the system does not generate a normative paradox; it generates a technical constraint. The "paralysis" is simply the mathematical result that no strategy dominates others across the set $\mathcal{P}$. The intuition that this *ought* to stop action relies on a normative premise (e.g., "do not act without a unique optimum") that is external to the optimization logic itself.

  The unmapped remainder shows that the original philosophical argument relied on intuitions that dissolve once formalized. The "mystery" of cluelessness is reclassified as a standard identification failure. The residual normative weight—the claim that identification failure *matters* morally—is not a resource MD lacks, but a premise MD explicitly treats as external input.

  Summary: The philosophical argument dissolves into a technical identification failure, revealing that normative paralysis is merely the absence of a unique solution to an exogenous optimization problem.
