answer: |-
  The mist hung low over the Vessian basin, obscuring the silhouette of the capital's northern ridge. From Kael's village, three days' walk downriver, the Great Silo looked like a jagged tooth biting the sky. It had been three hundred years since the last High Scribe had sealed the archives, yet the structure remained, stripped of its copper roofing but stubborn in its stone.

  Kael adjusted the strap of his pack, feeling the weight of the bronze calibration bar against his hip. It was a relic of the Old Bureau, a perfect meter of alloyed metal once used to verify tax grain across the provinces. Now, it was simply a lever, dense and unyielding, perfect for prying loose the limestone blocks he needed for the weir.

  He waded into the shallows where the tributary met the main channel. The water was low, as it was in the dry season, but the flow was steady. That was the important thing. The Old Bureau had promised *abundance*; the valley settlements settled for *continuity*.

  "Another one?" asked Mara, wading out to meet him. She held a line of woven willow, ready to bind the stones.

  "This is the last for the southern curve," Kael said. He pointed to a block half-submerged in the silt. It was rectangular, finely dressed, and covered in cuneiform script. *Inventory of Year 42: Barley, Grade A.* "Good density. No fractures."

  Mara didn't look at the writing. She never learned the script, and Kael had never taught her. There was no need. "If it holds the water, it holds the water."

  They worked in silence, the rhythm of the river filling the space between them. Kael leveraged the stone free. It slid from the mud with a heavy suck. He ran his thumb over the inscription. To a scholar from the distant coastal cities, or perhaps a traveler from a millennium hence, this scene would look like desecration. The Great Silo was being cannibalized. The records of the state were becoming fish traps and flood barriers. The bronze fixtures of the administration gates had been melted down into hoes and sickles centuries ago.

  An archaeologist digging here in another three hundred years would find the foundation trenches of the Silo empty. They would find the inscription-bearing stones scattered in the riverbed, face-down in the mud. They would see the clean breaks where the copper clamps had been carefully extracted, not shattered. They might write of a violent uprising, a burning of the archives, a sudden collapse of literacy and order. They would see a civilization that had destroyed its own memory in a fit of rage or ignorance.

  Kael rested the bronze bar on his shoulder and looked up at the Silo. He could read the signs on the upper lintel, faded but legible. *Justice Flows Like Water.*

  "Does it bother you?" Mara asked, following his gaze. She meant the work, the dismantling.

  "It's just stone," Kael said.

  "People say the Old Kings could make the water run uphill," she said, tying off the willow. "That they had spirits in the walls."

  "They had pumps," Kael corrected gently. "And slaves to turn the cranks. When the grain stopped coming from the highlands, the cranks stopped turning. The water didn't care."

  He remembered the winter he had spent in the capital's shadow, apprenticed to an old mason who remembered the old ways. Kael had learned to read the ledgers, to understand the standardized weights, to repair the sluice gates. He knew how the centralized system worked. He knew that if they wanted to, the valley villages could theoretically reassemble the bureaucracy. They had the stones. They had the knowledge.

  But they didn't have the grain surplus to feed the scribes, nor the desire to send their sons to the capital to be counted.

  "Hand me the chisel," Kael said.

  The block was too large for the weir's curve. He needed to split it. He placed the chisel along a natural fault line in the limestone, ignoring the line of text that ran beneath it. *...tribute of the Western District...*

  He struck the chisel. The stone cracked cleanly. The text was severed.

  "Will you fix the gate at the north bend?" Mara asked. "The one with the old gears?"

  "Tomorrow. The rust is thick, but the teeth still mesh."

  "Sometimes I wonder," she said, lifting her end of the stone. "If we put it all back. If we had the High Scribe again. Would the water be higher?"

  Kael thought about the archives he had read. They spoke of floods that drowned the lowlands when the dams were held too tight, and droughts that cracked the earth when the distribution was hoarded. The central system had been precise, but it was brittle. It required everything to be connected. If one node failed, the pressure burst the pipes.

  Here, in the valley, if Kael's weir broke, Mara's village would lose a harvest. But the next village upriver would still have fish. The next downriver would still have mud for bricks. The network was broken, yes. The long-distance trade in lapis and tin was gone. The standardized weights were now just heavy metal bars.

  "The water would be the same," Kael said. "But we'd spend more time counting it."

  He kicked the split stone into place. It settled into the riverbed with a solid thud, the inscribed face buried in the silt, hidden from the sun. The water rushed over it, indifferent to the history beneath the surface. It slowed, diverted, and spread out into the irrigation channels that fed the millet plots on the bank.

  It was not the grand distribution of the Old Bureau. It was uneven. It was local. It was enough.

  Kael wiped the mud from the bronze bar and slung it back over his shoulder. The sun was breaking through the mist, illuminating the dust motes dancing above the river. In the distance, a hawk circled over the empty windows of the Silo, crying out once before diving toward the fields.

  "Let's go," Kael said. "The tide turns in an hour."

  They walked back toward the village, leaving the dismantled monument behind them, neither ruined nor restored, but simply used.
