answer: |-
  # Specification: Mechanism-Identity Criterion for Anomaly Triage

  ## 1. Desiderata

  The following requirements define the adequacy of a mechanism-identity criterion for this specific triage context. They are divided into **Non-Negotiable Requirements**, derived from the asymmetric loss function and evidentiary constraints, and **Prejudices**, which represent philosophical or engineering preferences that should not be treated as hard constraints.

  ### Non-Negotiable Requirements

  **R1. Remediation Entailment**
  *   **Specification:** If the criterion judges a current anomaly as the "Same Mechanism" as a known fault, the remediation prescribed in the known fault's runbook must successfully resolve the current anomaly with probability $P > \theta$ (where $\theta$ is set by safety risk tolerance).
  *   **Rationale:** The purpose of the classification is routing for repair. Under the stated asymmetric loss, a False Recurrence (classifying as Same when Different) results in a failed fix, which is the catastrophic outcome. Therefore, "Same Mechanism" must entail "Same Fix."
  *   **Traceability:**
      *   *Firmware Case:* If the anomaly is caused by a threshold constant (Case 2), a runbook prescribing sensor replacement fails. The criterion must distinguish this from sensor drift (Case 1) because the fixes differ (flash update vs. hardware swap).
      *   *Loss Function:* Directly encodes the constraint that a bad fix is worse than wasted engineering hours.

  **R2. Triage-Decidability**
  *   **Specification:** The criterion must yield a verdict based *only* on evidence available at triage time: telemetry, event logs, firmware/consumable provenance, and a bounded set of cheap diagnostic interventions (e.g., remote reset, self-test). It cannot require teardown, lab analysis, or post-hoc root cause confirmation.
  *   **Rationale:** The system operates in the field. A criterion that requires knowledge only available after the device is returned to the manufacturer is useless for routing.
  *   **Traceability:**
      *   *Conjunctive Case:* In the altitude/occlusion/rate conjunction (Case 3), the criterion must determine identity from logs showing these conditions, not from a lab recreation of the physics.
      *   *Evidence Constraints:* Explicitly respects the "handful of cheap diagnostic interventions" limit.

  **R3. Reference-Class Homogeneity**
  *   **Specification:** The criterion must not validate identity against a "Known Fault" category if that category is mechanistically heterogeneous. If the historical cases for a known fault split into distinct aetiologies (different fixes required), the criterion must treat the category as invalid for automated routing until split.
  *   **Rationale:** Matching a current anomaly to a heterogeneous reference class guarantees a non-zero probability of False Recurrence, violating R1.
  *   **Traceability:**
      *   *Forty-Case Split:* In Case 5, where 40 prior cases shared a signature but had two aetiologies, the criterion must flag the reference class itself as unstable. Matching the signature is insufficient if the class masks distinct mechanisms.

  ### Prejudices (Preferences)

  **P1. Device-Boundary Integrity**
  *   **Specification:** The mechanism should be locatable entirely within the physical and logical boundaries of the pump unit (hardware + firmware).
  *   **Status:** **Prejudice.** This reflects a desire for vendor liability containment and modular replacement.
  *   **Why it is not a Requirement:** In the Tubing Case (Case 1), the "mechanism" producing the late alarm includes the compliance of the tubing. If the fix is "use stiffer tubing," the mechanism extends into the environment. Enforcing P1 would force a "Novel" classification for environmental interactions, which is safe but operationally inefficient. R1 (Remediation Entailment) overrides P1; if the fix involves the environment, the mechanism definition must accommodate it.

  **P2. Singular Localization**
  *   **Specification:** A mechanism should correspond to a single broken component or logical chain, not a conjunctive state of multiple independent degradations.
  *   **Status:** **Prejudice.** This reflects a preference for parsimonious explanation.
  *   **Why it is not a Requirement:** In the Overdetermination Case (Case 4), two safety checks degrade jointly. The "mechanism" of failure is the conjunction. Insisting on a single root cause (e.g., blaming only the primary check) risks an incomplete fix. R1 requires the fix to address the joint failure, even if it violates the intuition that a mechanism is a "single thing."

  ---

  ## 2. Conflict Analysis

  ### The Incompatible Pair: Remediation Entailment (R1) vs. Device-Boundary Integrity (P1)

  These two requirements cannot be jointly satisfied in the general case of fielded devices interacting with consumables.

  *   **The Conflict:** **Remediation Entailment** demands that the mechanism definition track whatever must be changed to stop the anomaly. **Device-Boundary Integrity** demands that the mechanism definition remain inside the pump.
  *   **The Case:** Consider the **Tubing Case (Case 1)**. Unit A has sensor drift (internal). Unit B has stiff tubing (external). Both trigger the same pressure alarm pathway.
      *   If you satisfy **P1 (Boundary)**, both are "Different Mechanisms" (one internal, one external). Unit B is routed to Engineering. This is safe but incurs the cost of False Novelty.
      *   If you satisfy **R1 (Remediation)**, you must ask: "Does the runbook fix work?" If the runbook says "Replace Sensor," it fails on Unit B. If the runbook says "Check Line," it might work on both. If the fix for the "Known Fault" is internal-only, R1 forces you to declare Unit B "Novel" (violating P1's desire to keep mechanisms internal) OR declare them "Same" and apply a fix that fails (violating R1).
      *   To satisfy R1, the criterion must admit that the "mechanism" for Unit B includes the tubing. This violates P1. You cannot have a criterion that guarantees fix-success *and* restricts mechanism identity to the device box when the fix sometimes requires changing the consumables.

  ### The Most Exclusionary Requirement: Remediation Entailment (R1)

  **R1 excludes the most candidate accounts of mechanism identity.**

  Most philosophical and engineering accounts define mechanism identity by **structure** (same parts), **history** (same lineage), or **signature** (same data pattern).
  *   **Structural accounts** fail the **Firmware Case (Case 2)**. The parts are identical, but the mechanism behavior changes due to a constant. If the fix is a software patch, a structural account might classify this as "Same Hardware" and suggest hardware replacement, violating R1.
  *   **Signature accounts** fail the **Forty-Case Split (Case 5)**. The data looks the same, but the causes differ. A signature account groups them; R1 forbids this because the fixes differ.
  *   **Historical accounts** fail the **Cross-Instance Wrinkle**. The units never shared a career.

  Only an account that defines mechanism identity *functionally*, relative to the intervention required to restore normal operation, can satisfy R1. This excludes any account that treats the mechanism as a static object independent of the repair strategy.

  ---

  ## 3. Scoring Candidate Families

  The following table scores four common families of mechanism-identity criteria against the Non-Negotiable Requirements (R1, R2, R3).

  | Candidate Family | R1: Remediation Entailment | R2: Triage-Decidability | R3: Reference-Class Homogeneity | Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **Identity of Observable Signature** | **FAIL** | PASS | **FAIL** | Fails Case 5 (same signature, different aetiology) and Case 2 (same signature, different fix). High False Recurrence risk. |
  | **Causal / Spatiotemporal Continuity** | **FAIL** | **FAIL** | PASS | Fails Cross-Instance Wrinkle (units never touched). Fails Triage (cannot trace causal history in field). |
  | **Sameness of Parts + Organization** | **FAIL** | PASS | **FAIL** | Fails Case 2 (Firmware change, parts same). Fails Case 1 (Tubing change, parts same). Structure does not track fix. |
  | **Sameness of Counterfactual Profile** | **PASS** | **PASS** | **PASS** | **Best Fit.** Defines mechanism by "what happens if we intervene." Handles Firmware (change constant), Tubing (change line), and Drift (calibrate). Aligns with R1. |

  **Assessment:**
  The **Sameness of Counterfactual Profile** family is the only one that satisfies **Remediation Entailment**. It treats the mechanism not as a thing, but as a set of dependencies that can be manipulated. This aligns with the triage goal: we do not need to know what the mechanism *is* metaphysically; we need to know *what breaks it* and *what fixes it*. It accommodates the **Conjunctive Case (Case 3)** by allowing the counterfactual profile to include environmental conditions (if removing altitude removes fault, altitude is in the profile). It accommodates the **Drift Wrinkle** by treating parameters as continuous variables in the counterfactual space rather than binary identity switches.
