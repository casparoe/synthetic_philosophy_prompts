  **MEMORANDUM**

  **TO:** Clinical Algorithm Review Committee
  **FROM:** Committee Staff
  **SUBJECT:** Decision Reasoning: Post-Discharge Nursing Allocation Model
  **DATE:** [Next Week's Date]

  ### 1. Executive Summary
  We recommend **approving Variant 2 (Group-Specific Thresholds)** with a mandatory condition for ongoing audit on *clinical events prevented*, rather than *predictive accuracy*.

  While Variant 1 (Single Threshold) aligns better with our historical preference for "blind" scoring, Variant 2 is the only option that satisfies our precedent on **Error Rate Parity** (Cases 2 and 3). The causal nature of this intervention (treatment reduces risk) fundamentally alters the cost of "False Positives," rendering our historical reliance on Calibration (Case 2) less critical than minimizing Miss Rates (Case 3). However, this decision explicitly departs from the "Same Number = Same Risk" rule of Case 2, acknowledging that our precedents no longer cover causal resource allocation.

  ### 2. Analysis of Implicit Rules and Precedents
  Our track record reveals an implicit rule we have not yet had to stress-test: **"Predictive Consistency."** In every prior decision, *Calibration* (a score means the same risk for everyone) and *Error Rate Parity* (false positive/negative rates are equal across groups) moved in lockstep.
  *   **Case 1 (Approved):** Satisfied both.
  *   **Case 2 (Rejected):** Violated both (Same score $\neq$ same risk; Miss rates diverged). Written reason prioritized Calibration ("same number has to carry the same risk").
  *   **Case 3 (Rejected):** Violated Error Parity (Miss rates and PPV diverged). Written reason prioritized Error Rates ("objected that miss rates... diverge").

  **The Conflict:** For the first time, these demands diverge.
  *   **Variant 1** approximates Calibration (one threshold) but violates Error Parity (Group B miss rate is 55% vs. 35% for A).
  *   **Variant 2** satisfies Error Parity (40% miss rate for both) but violates Calibration (different thresholds mean the "same number" carries different decision weight).

  **Closest Analog:** **Case 3** is the closest analog. Like Case 3, this submission involves differing base event rates (22% vs. 9%) and capped resources. In Case 3, we rejected a model because miss rates diverged. Variant 1 replicates the divergence we rejected in Case 3 (35% vs. 55% miss rate). Variant 2 resolves it. Therefore, **Variant 2 is more consistent with Case 3**, while Variant 1 is more consistent with Case 2.

  ### 3. The Causal Complication
  Our precedents assumed a "False Positive" was a wasted resource (a patient flagged who would not have had the event). This submission introduces a causal intervention where enrollment *lowers* risk for everyone treated.
  *   **Variant 1 "Error":** We miss 55% of Group B events.
  *   **Variant 2 "Error":** We treat Group B patients with lower predicted risk (lower PPV), but they benefit *more* from the intervention (-5% risk reduction vs. -2% for Group A).

  Under a **Utility Maximization** principle, Variant 2 is likely superior because it directs slots to the group with higher treatment responsiveness, even if their predictive risk is lower. Our historical rules (Calibration/Error Parity) are *predictive* metrics, not *clinical utility* metrics. By choosing Variant 2, we prioritize **Health Outcomes** over **Statistical Symmetry**.

  ### 4. Recommendation and Principles Adopted
  **Decision:** Approve **Variant 2** (Group-Specific Thresholds).

  **Principle Adopted:** **"Equal Burden of Error over Equal Meaning of Score."**
  By choosing Variant 2, we establish that when base rates differ, it is more important to equalize the *consequences* of the model (miss rates) than the *definition* of the score (calibration). This effectively elevates Case 3's reasoning over Case 2's. We are acknowledging that in a resource-constrained, causal environment, fairness of *access* (error rates) outweighs fairness of *labeling* (calibration).

  **Condition:** Approval is contingent on the vendor demonstrating that Variant 2 yields a higher or equivalent **Total Events Prevented** compared to Variant 1. If Variant 1 prevents more events despite the higher miss rate in Group B (due to higher base rate targeting), the Utility Principle would dictate reverting to Variant 1.

  ### 5. The Revealing Test
  To force the committee to reveal which rule we are *actually* applying (Predictive Fairness vs. Clinical Utility), request the following from the vendor:

  **The "Net Benefit" Audit:**
  > *"Submit a calculation of **Events Prevented per 500 Slots** for both variants, incorporating the differential treatment effects (-2% for A, -5% for B)."*

  *   **Why this forces the reveal:**
      *   If we reject Variant 2 despite it preventing *more* total events, we prove our true rule is **Statistical Calibration** (Case 2 dominates).
      *   If we approve Variant 2 because it prevents more events, we prove our true rule is **Clinical Utility** (New Principle).
      *   If we approve Variant 2 even if it prevents *fewer* events, we prove our true rule is **Error Rate Parity** (Case 3 dominates).

  ### 6. Confidence and Uncertainty
  **Confidence:** **Moderate-High.**
  I am confident that our precedents are now in direct conflict and that strict consistency requires rejecting both variants. However, Variant 2 is the pragmatic choice that aligns with the most recent fairness precedent (Case 3) and the clinical reality of the intervention.

  **Least Sure Point:**
  I am least sure whether the Committee views the Case 2 written reason ("Same number has to carry the same risk") as a **validity constraint** (a model that fails this is broken) or a **fairness constraint** (a model that fails this is biased).
  *   If it is a **validity constraint**, Variant 2 is dangerous because it implies the score itself is not comparable across populations.
  *   If it is a **fairness constraint**, Variant 2 is acceptable because it equalizes the *impact* of the decision.
  *   *Recommendation:* Clarify this distinction in the meeting. If the score is considered a "clinical truth," Variant 2 is hard to defend. If it is a "triage tool," Variant 2 is defensible.
