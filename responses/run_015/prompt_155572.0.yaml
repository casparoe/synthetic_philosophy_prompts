answer: |-
  Mara's instinct is sharp. The preservation board is indeed smuggling in a metaphysical commitment, and it's one that lets them wash their hands of moral responsibility. Here is the reconstruction of what their rubric actually presupposes, how the corruption interacts with the philosophy, and what a system built on the rival view would look like in practice.

  ### 1. The Implicit Theory: Bureaucratic Epistemicism
  By enforcing a hard threshold at 73.5 with no right of appeal, the board is acting as **Epistemicists**.

  In the philosophy of language (specifically Timothy Williamson's view), epistemicism holds that vague predicates like "culturally significant" or "architecturally integral" actually *do* have sharp boundaries. There is a fact of the matter about whether a building is significant. The problem is merely that humans are ignorant of where that line falls.

  The board's algorithm claims to remove that ignorance. By calculating to two decimal places and forbidding appeals, they are asserting that 73.50 is not a policy choice, but a **discovery**. They are pretending that the difference between a score of 73.50 (permit denied) and 73.49 (permit allowed) reflects a real, ontological difference in the building's status, even if human intuition can't perceive it.

  This is convenient for them. If the line is "real" (epistemic), then the board isn't making a hard choice to destroy history; they are merely acknowledging the mathematical truth that the building wasn't significant enough. The "no appeal" clause is the key: it asserts there is no "borderline case" to debate. There is only truth and falsehood, and the machine knows which is which.

  ### 2. Can a Supervaluationist Defend This?
  A **Supervaluationist** (who believes vague terms have no sharp boundary, but can be made precise in multiple valid ways) could technically defend the rubric, but only by shifting the ground from *truth* to *coordination*.

  They would have to argue: "We know there is no real line between significant and not-significant. However, to administer the city, we must *stipulate* a precisification. We are choosing 73.5 as a convention."

  **The Problem:** The board's "no appeal" rule undermines this defense. If you admit the line is a stipulation (a Supervaluationist move), you must admit that a building scoring 73.49 is *indistinguishable* in reality from one scoring 73.50. Therefore, justice demands a mechanism to handle the "penumbra" (the borderline zone). By refusing appeals, the board is pretending the stipulation is a discovery. A consistent Supervaluationist administration would have to acknowledge that the score is a heuristic, not a verdict.

  ### 3. The Twist: Does Corruption Damage One View More?
  The fact that they waive the score for well-connected developers but not homeowners is devastating to the **Epistemic** pretense, but merely embarrassing for the **Supervaluationist/Pragmatic** view.

  *   **Damage to Epistemicism:** If the score reveals the *truth* about the building (i.e., 73.5 is the actual boundary of significance), then waiving it for a developer is a lie. It implies the building *is* significant enough to be saved, contradicting the algorithm's "truth." It admits the boundary wasn't in the building's architecture; it was in the developer's bank account. This collapses the claim that the algorithm solves the problem of vagueness. It proves the vagueness was never epistemic ignorance; it was political cover.
  *   **Damage to Supervaluationism:** If the score is just a pragmatic tool (a "precisification" chosen for convenience), waiving it doesn't create a metaphysical contradiction. It just shows the tool is being wielded unfairly. The Supervaluationist already admits the line is artificial; the corruption just proves the *choice* of where to draw the line (or when to erase it) is motivated by power rather than public good. It damages their *legitimacy*, but not their *logic*.

  **Verdict:** The corruption kills the Epistemic view. You cannot claim a number represents the "hidden truth of significance" while simultaneously ignoring that number for your friends. It reveals the "sharp boundary" was a fiction all along.

  ### 4. The Rival Policy: Machinery of "Honest Vagueness"
  If the city adopted a policy that honestly reflected the Supervaluationist (or Pragmatic) reality—that significance is vague and no decimal can capture it—the day-to-day machinery would have to change in three specific ways:

  1.  **The "Penumbra" Zone:**
      Instead of a hard cut-off at 73.5, the rubric would establish a **review range**, say between 70.0 and 77.0.
      *   *Below 70:* Automatic demolition (clearly not significant).
      *   *Above 77:* Automatic preservation (clearly significant).
      *   *70–77:* Mandatory human review.
      This acknowledges that within this range, the building is neither "true" nor "false" regarding significance, and administrative fiat cannot settle it.

  2.  **Qualitative Overrides:**
      The algorithm would be demoted from a *judge* to a *clerk*. In the review zone, a human committee would be required to weigh non-quantifiable factors (community memory, aesthetic cohesion) that the decimal system ignores. The policy would explicitly state: *"The score indicates risk, not status."*

  3.  **Transparent Variance Criteria:**
      To prevent the corruption you mentioned, the criteria for waiving the score would have to be codified and public. If a developer can bypass the score, the *reason* (e.g., "economic hardship," "public safety") must be a valid category available to homeowners as well. The machinery would require a public record of every variance, forcing the board to own the arbitrariness of their decisions rather than hiding behind the "formula is the formula" defense.

  **Summary for Mara:**
  The board is using Epistemicism as a shield. They pretend the line is real so they don't have to take blame for drawing it. The corruption proves the line is fake. If they were honest, they'd admit the numbers are fuzzy, create a human review zone for the middle scores, and publish the real reasons they let some buildings fall while others stand. The thriller angle? The protagonist shouldn't fight the score; they should fight the *no appeal* clause. That's where the philosophy breaks.
