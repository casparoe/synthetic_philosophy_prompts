answer: |-
  # Persistence Through Stasis: The Vault and The Copy

  **Introduction: Two Pictures of Time**

  To understand how objects persist through time, we must choose between two competing metaphysical pictures. The first is **Endurantism**. On this view, objects are wholly present at every moment of their existence. When you look at a tree today, you see the whole tree, not just a slice of it. If that tree exists tomorrow, the very same whole object exists then. Persistence is a matter of being entirely located at multiple times.

  The second view is **Perdurantism**. This view holds that objects are extended in time much like they are extended in space. Just as a road has spatial parts (miles, segments), a persisting object has **temporal parts**. You are not wholly present now; rather, there is a "you-stage" existing now, which is part of a larger four-dimensional "spacetime worm" that includes your past and future stages. Persistence is a matter of having different temporal parts at different times.

  These definitions matter because they dictate what is required for an object to survive a gap in activity. For the endurantist, survival requires only that the whole object exists at the later time, linked appropriately to the earlier time. For the perdurantist, survival requires that there be a continuous chain of temporal parts connecting the earlier stage to the later stage. This essay argues that while both views can adopt similar criteria for identity, the specific cases of "The Vault" and "The Copy" reveal that Endurantism accommodates our intuitions about persistence through stasis at a lower metaphysical cost than Perdurantism.

  **The Cases: Vault and Copy**

  Consider **Case One: The Vault**. A dormant animal is sealed in a vault for forty years. By stipulation, nothing happens inside. There is no metabolism, no chemical turnover, and no internal causal traffic beyond what is required for structural integrity. No light touches it; no parts are replaced. After forty years, water is added, and the animal resumes life with the same dispositions and injuries. The overwhelming intuition is that the animal which wakes is the very same animal that entered, and that it existed throughout the forty years.

  Now consider **Case Two: The Copy**. Just before drying out, the original animal's molecular arrangement is recorded. The original husk is destroyed. During the forty years, a duplicate body is assembled from fresh matter using the record. At the end, water is added, and the duplicate resumes life with the same dispositions and injuries. Here, the intuition flips: the resumer is not the original animal.

  The philosophical worry arises from comparing these two cases. In The Vault, what obtains across the forty years, over and above the preservation of arrangement, seems to be nothing. The arrangement is preserved by matter sitting still. In The Copy, it is preserved by a record and an assembler. If a stretch of time in which literally nothing happens contributes nothing to reality, then the two cases differ only in external causal machinery. It is not obvious that such external machinery should ground identity. This suggests our intuition about The Vault might be a hangover from ordinary cases, where "sitting still" actually involves busy biological maintenance. If the interval is causally empty, does the animal really exist during it?

  **Orthogonality and Identity Criteria**

  A common objection is that these cases do not discriminate between Endurantism and Perdurantism. Both views can adopt the same criterion of **diachronic identity** (the conditions under which an object at one time is the same as an object at another). Both might agree that identity requires **immanent causation** (where the state of an object causes its own future state) or continuity of biological organisation. If both views accept the same criteria, the dispute over temporal parts seems orthogonal to the cases.

  This objection fails because criteria of identity require an ontological ground. A criterion tells us *when* identity holds; ontology tells us *what exists* to make it hold. In The Vault, if we require immanent causation, we face a problem: by stipulation, there is no internal causal traffic. The endurantist can say the object is wholly present at every moment, sustaining its own structure simply by being there. The existence of the object *is* the ground. The perdurantist, however, must say there is a temporal part at every moment. If nothing happens, what constitutes the temporal part? A temporal part is typically defined by the properties instantiated at that time. If no properties change and no causal work is done, the "temporal part" is ontologically indistinguishable from a static coordinate.

  Furthermore, in The Copy, the perdurantist has an easier time explaining the failure of identity. The original worm is destroyed; a new worm begins. There is no continuous chain of temporal parts. The endurantist must explain why the wholly present object at the end is not the same as the one at the start, despite qualitative identity. They must rely on the breaking of the causal chain (the destruction of the original). While both can reach the verdicts, the perdurantist's ontology fits The Copy naturally but struggles with The Vault. The endurantist fits The Vault naturally but must work harder to exclude The Copy. The cases therefore are not orthogonal; they stress different parts of each ontology.

  **The Gap vs. The Idle Posit**

  This leads to the third option: denying the datum. Perhaps the animal simply does not exist during the forty years in The Vault. It ceases to exist when dried and begins to exist when wetted. Is this cheaper for one view?

  For the perdurantist, a period of total stasis is potentially a **hole in the worm**. Since objects exist at a time only by having a temporal part then, a period with no causal activity or change might fail to generate a temporal part. If there is no part, there is no object. Thus, the perdurantist is pushed toward "gappy existence"—the object exists, then ceases, then exists again. This is costly. It requires rewriting logic to allow identity across gaps (transitivity of identity becomes problematic).

  For the endurantist, there is no automatic link between existence and change. An object may be wholly present at every moment without involving change. The endurantist can say the animal exists throughout the gap while doing nothing. However, this raises the worry of the **idle posit**. Is a thing that exists for forty years without any activity detectable in principle by nobody? If it makes no causal difference, is it real?

  Here lies the decisive asymmetry. The perdurantist's "hole" implies non-existence. If the animal does not exist in year twenty, then the animal that wakes in year forty-one is not strictly the same entity as the one that entered in year one, unless we accept gappy identity. But our intuition in The Vault is strong: it *was there*, waiting. The endurantist preserves this intuition by allowing existence without activity. The cost is accepting idle entities. But "idle existence" is metaphysically less disruptive than "intermittent existence." An idle object is still a continuous substance; a gappy worm is a fractured one. Therefore, Endurantism handles The Vault better because it allows for continuous existence without requiring continuous change.

  **Verdict**

  Do these cases decide the debate? They do not settle it universally, but they tip the scale. The Vault shows that persistence does not require activity. The Copy shows that persistence does require the right kind of causal history (the original matter must persist, not just the pattern). Endurantism accommodates The Vault by allowing wholly present stasis. Perdurantism accommodates The Copy by requiring continuous temporal parts, but this forces it to deny existence in The Vault unless it accepts gappy worms.

  Therefore, the essay endorses Endurantism. The intuition that the animal exists through the forty years is robust. To save this intuition, Perdurantism must accept gappy existence, which undermines the coherence of identity over time. Endurantism accepts the cost of idle posits, but this is preferable to fractured existence. An object that waits is metaphysically simpler than an object that ceases and restarts. Thus, given these cases, Endurantism provides the more coherent account of persistence through stasis.

  **The Strongest Objection**

  The strongest objection to this conclusion comes from physics, specifically Relativity Theory. Special Relativity suggests that simultaneity is relative to a frame of reference. If an object is "wholly present," it must be wholly present at a specific moment. But if "a specific moment" varies depending on the observer, then "wholly present" becomes frame-relative. This threatens to make endurantist existence incoherent, as an object would be wholly present for one observer but only partially present for another. Perdurantism avoids this by treating the object as a four-dimensional block that does not change its shape across frames. If Endurantism is incompatible with modern physics, its metaphysical advantages in The Vault case are irrelevant, as the view would be false regardless of its intuitive fit. I cannot answer this fully here, but the endurantist must argue that "wholly present" refers to the object's own proper time, not an external observer's coordinate, preserving the view's viability.

  **What Would Change My Mind**

  If the Vault and Copy cases do not decide the question, what would? I would change my mind if presented with a case of **quantum discontinuity**. Suppose physics showed that at a fundamental level, particles cease to exist between measurements, popping in and out of existence continuously. If all material objects are fundamentally gappy in this way, then "continuous existence" is an illusion. In that scenario, Perdurantism (or a stage theory where only momentary stages exist) would be forced upon us by empirical fact. The cost of gappy existence would vanish because *everything* would be gappy. Until such evidence arises, however, the macroscopic intuition of continuous existence through stasis favors Endurantism.
