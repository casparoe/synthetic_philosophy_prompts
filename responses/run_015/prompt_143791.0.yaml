  Subject: The Knob-Twiddling Grant / Quick Pitch

  Hey Sam,

  Thanks for the coffee earlier. Sorry I rambled. Here's the thing I was trying to articulate before I ran out of steam.

  You know the Hofstadter bit about knob-twiddling? The idea that creativity is just adjusting hidden dials on a mental theme until something new pops out? My character is obsessed with it, but honestly, so am I. I want to apply for the arts-and-mind fellowship with this as the core project.

  Here's the itch: If novel-writing is really just systematic variation on an author's core thematic knobs, why do some variations feel like breakthroughs while others feel like dead algorithmic fanfic? We tweak a sentence, change a motive, shift a setting, and sometimes it sings. Sometimes it thuds.

  The usual cognitive-science takes on creativity don't settle this. They measure divergence—how far you moved from the norm—but they miss the aesthetic "deadness" problem. You can have high divergence that feels completely hollow. I want to find out what separates the alive tweaks from the dead ones.

  Methodology is straightforward, mostly because I'm solo and only have six months. I want to do close comparison of draft manuscripts where a writer changed one parameter at a time. I've got access to some archives where we can see the version history—where a protagonist's gender was flipped, or a ending was swapped from tragic to open. I'm not looking at the final book. I'm looking at the delta.

  Scope is honest: I'm not solving creativity. I'm just mapping one specific terrain. A useful result looks like a taxonomy of "alive" vs. "dead" variations. A way to say, "This kind of tweak usually kills the voice, unless X is present." That's it. That's the win.

  I need to be straight about what could make the whole thing collapse. First, the data might be too messy. Writers don't label their changes like engineers; they just overwrite. Second, I might find there's no pattern, just luck. If the "aliveness" is purely in the eye of the beholder, the taxonomy fails. Third, burnout. Digging through rejected drafts for six months is grim work.

  But if it works, it gives us a vocabulary for why some changes feel like discovery and others feel like noise.

  Let me know if this sounds fundable or if I'm chasing ghosts. My treat for the next coffee.

  Best,

  J.
