answer: |-
  The frustration you're feeling is shared by many inside the field. You are correct that consciousness is a biological phenomenon, and you are correct that we have abundant data. The holdup isn't data scarcity; it's a **theory deficit compounded by the Hard Problem.**

  Here is the deep conceptual issue: In astronomy, "habitability" is defined by external, third-person observables (temperature, atmospheric composition, liquid water). We agree on the definition, so we can score the planets. In consciousness science, we do not have a consensus definition of the *target*. Is consciousness the ability to report on internal states (Global Workspace Theory)? Is it the capacity for integrated information (Integrated Information Theory)? Is it the presence of a specific neural architecture (like a cortex or pallium)?

  These theories yield different verdicts for the same animal. A honeybee might pass a behavioral test for "optimism" (suggesting consciousness), but its brain is too small for certain neural theories of consciousness. A scientist who subscribes to Theory A will say "yes," while a subscriber to Theory B says "no." When a researcher hedges, they aren't being cowardly; they are acknowledging that answering your question requires first answering a philosophical question they haven't solved. They are inferring the *presence of a private experience* from *public behavior*, which is an inductive leap that cannot be empirically closed. Unlike an exoplanet, you cannot visit the animal's subjective point of view to verify your hypothesis. Until we agree on the "neural correlates of consciousness" across diverse brain architectures, any confidence score is a measure of *human consensus*, not *animal reality*.

