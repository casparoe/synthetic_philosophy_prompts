prompt: |-
  So I'm writing a feature on animal consciousness — you know, the whole "which animals are conscious" debate that's been heating up — and honestly I'm getting a little frustrated with how cagey everyone is. We've got decades of comparative cognition, neuroimaging, all these clever behavioral paradigms (mirror self-recognition, delay discounting, you name it), and yet when you ask a researcher "is a bee conscious?" they start hedging like you asked them to predict the stock market.

  Here's what I don't get. Consciousness is a biological phenomenon, right? It evolved, it's instantiated in nervous systems, it comes in degrees. So in principle it should be possible to go through the animal kingdom and say, ok, this group probably has it, this group probably doesn't, this group we're not sure. The way astronomers categorize exoplanets by habitability even though they can't visit them. We're making an inference to the best explanation from observable markers — what's so different here?

