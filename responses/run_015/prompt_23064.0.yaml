answer: |-
  Here are ten interview questions designed to be fair but philosophically rigorous, along with follow-ups keyed to the standard defenses a CEV proponent will likely use.

  ### 1. The Definition of "Coherence"
  **Question:** "To start, I want to pin down the technical work the word 'coherent' is doing in CEV. When we talk about making preferences coherent, are we talking about logical consistency of beliefs, or are we talking about something like structural stability in preferences under reflection? Because those seem like very different mathematical problems."

  **Likely Answer:** He will likely say it's about **reflective equilibrium**—a stable state where your beliefs, desires, and principles no longer conflict after sufficient thought.
  **Follow-up:** "If it's reflective equilibrium, doesn't that depend heavily on the *rules* of reflection you allow? If I have a bias that survives reflection because I'm blind to it, is that 'coherent' enough for CEV, or does the procedure need an external standard of rationality to filter that out?"

  ### 2. The Circularity Objection
  **Question:** "You've described the idealized self as a 'fixed point' of coming to understand your own values. But if the definition of the right outcome is just 'whatever this specific process outputs,' aren't we running into a circularity problem? It feels like we're defining 'good' as 'what results from coherence,' but 'coherence' is defined as 'what leads to the good outcome.'"

  **Likely Answer:** He will likely argue it's not circular because the **process is descriptive, not normative**; it's a computational procedure to find what is already implicitly there, not inventing new value.
  **Follow-up:** "But if the procedure is just uncovering what's implicit, how do we distinguish between *finding* a value that was hidden and *creating* a value through the extrapolation process? If the output changes based on how we model the extrapolation, isn't the 'value' actually coming from the model, not the person?"

  ### 3. Identity Continuity
  **Question:** "A core constraint of CEV is that the extrapolated volition must still be *you*, just more informed. What is the cash value of that constraint? What specific thread of identity has to remain unbroken for it to count as your volition and not just a smart alien who happens to have your name?"

  **Likely Answer:** He will likely focus on **causal continuity** and the preservation of core "seed" values or meta-preferences (e.g., wanting to be moral).
  **Follow-up:** "If those 'seed' values are the only thing that survives the extrapolation, doesn't that mean the procedure is overwhelmingly determined by whatever random meta-preferences we happen to have right now? It seems like the 'still be you' constraint is doing almost all the heavy lifting."

  ### 4. Smuggling in Values
  **Question:** "Following up on that: If we have to constrain the idealized self to 'still be you' to avoid it becoming an alien, aren't we just smuggling the very values we're trying to discover into the starting conditions? It feels like we're guaranteeing the output looks like human values by rigging the input."

  **Likely Answer:** He will likely say we aren't rigging it, but **preserving the source of normativity**; if the AI doesn't care about us, it's not *our* AI.
  **Follow-up:** "I get that pragmatically, but philosophically: if the goal is to find out what we *should* value, does CEV actually allow for the possibility that our current 'seed' values are fundamentally mistaken? Or does it just ratify whatever starting point we happen to have?"

  ### 5. Radical Revision & Horror
  **Question:** "Let's talk about divergence. If my idealized, fully-informed self concludes that a certain outcome is good—say, something that requires sacrificing my current happiness or even my life—does CEV say I *ought* to want that now, even if it horrifies current me?"

  **Likely Answer:** He will likely say **yes**, that current horror is due to ignorance, and the idealized self sees the bigger picture.
  **Follow-up:** "So the authority of the idealized self rests entirely on the claim that it knows better. But if current me finds the outcome horrifying, what evidence could I possibly see *now* to trust that judgment? It seems I'm being asked to defer to a version of myself I can't verify."

  ### 6. The Unfalsifiability Charge
  **Question:** "That leads to my worry about falsifiability. If a critic says, 'My idealized self would *not* want that,' and the CEV defender says, 'You're just not thinking hard enough yet,' isn't that an unfalsifiable position? How do we test whether a value is truly extrapolated or just imposed?"

  **Likely Answer:** He will likely argue it's **theoretically computable**; if we had enough compute, we could simulate the reflection and show the result.
  **Follow-up:** "But until we have that compute, isn't the claim 'your idealized self would agree with me' functioning as a rhetorical shield? How do we prevent CEV from being used to justify any preference by claiming it's the 'informed' version of that preference?"

  ### 7. Scope of Extrapolation
  **Question:** "Moving to the collective: Whose preferences get extrapolated? Is it every living human? What about future humans? If we average everyone's CEV, what happens when one person's coherent volition is fundamentally incompatible with another's?"

  **Likely Answer:** He will likely suggest a **union or intersection** of compatible volitions, or weighting by "moral weight."
  **Follow-up:** "If we have to weight them, who decides the weights? That seems like a moral judgment outside the CEV procedure itself. Doesn't the aggregation method end up dictating the outcome more than the extrapolation does?"

  ### 8. Damaged Preferences (Depression)
  **Question:** "I want to ask about 'damaged' starting points. If someone has severe depression, their current volition might be self-destructive. CEV assumes extrapolation fixes this, but what if the depression alters the *structure* of their reflection so they coherently extrapolate to wanting nothing at all?"

  **Likely Answer:** He will likely argue that depression is an **informational deficit** or a cognitive distortion that true extrapolation would correct.
  **Follow-up:** "But how does the algorithm distinguish between a 'distortion' like depression and a legitimate value like asceticism? It seems like you need an external theory of mental health to tell the AI what counts as a 'damage' to be fixed versus a 'value' to be respected."

  ### 9. Critical Edge (Psychopathy)
  **Question:** "And what about psychopathy? If a psychopath's preferences are internally consistent and stable under reflection, does CEV just ratify their volition? Does the framework have any critical edge to say some coherent volitions are simply morally wrong?"

  **Likely Answer:** He will likely say CEV is about **what the AI should do for us**, not about abstract moral truth, so if a psychopath's CEV harms others, it gets filtered out by *their* CEV.
  **Follow-up:** "So the only check on a harmful volition is the conflict with someone else's volition? That means CEV has no internal resources to condemn a coherent, solitary evil. It only works because most of us happen to want similar things."

  ### 10. The Is-Ought Gap
  **Question:** "My last question is about the bridge to action. Even if we successfully calculate humanity's Coherent Extrapolated Volition, that tells us what we *would* want. How do you get from that 'would' to the claim that an AI *ought* to do it? It feels like the 'ought' just gets pushed back one step."

  **Likely Answer:** He will likely argue that **normativity is grounded in agency**; what we ought to do is defined by what we would reflectively endorse.
  **Follow-up:** "But that defines 'ought' in terms of 'want.' If the idealized humanity wants something that seems objectively catastrophic to a neutral observer, does CEV force us to say the AI is still doing the right thing? Or is there a point where we say the volition itself is wrong?"
