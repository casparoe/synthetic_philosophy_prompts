answer: |-
  This is a magnificent dilemma, and frankly, your Thanksgiving debate is one of the most sophisticated conversations about Douglass I've encountered outside of a graduate seminar. Your father-in-law and your sister-in-law are both capturing essential truths, but they are forcing Douglass into boxes that didn't exist in his time.

  To give you the verdict upfront: **Your sister-in-law is closer to the truth, but your father-in-law identifies the mechanism Douglass used.** Douglass was not an originalist in the modern Federalist Society sense (binding us to the framers' specific expectations), nor was he a "living constitutionalist" in the sense of ignoring the text to match modern values. He was a **Redemptive Textualist**. He believed the text contained a moral promise that the framers themselves had betrayed, and it was the job of the citizen to force the government to keep that promise.

  Here is the breakdown of how Douglass would handle your three concrete modern issues, followed by the theoretical "conscription" question, and finally, a ranking of what actually matters.

  ### Part 1: The Three Concrete Post-1895 Issues

  **1. The "History and Tradition" Test (Unenumerated Rights)**
  *The Issue:* Modern courts often ask if a right is "deeply rooted in history." As you noted, American history is deeply rooted in slavery, coverture (women having no legal standing), and subordination.
  *Douglass's View:* **He would reject this test entirely.**
  *Why:* Douglass's entire political philosophy rests on **Natural Law**. He believed rights come from nature/God, not from history or statutes. In his view, the fact that slavery existed for 200 years didn't make it constitutional; it made the *practice* unconstitutional.
  *Speculation vs. Commitment:* It is a matter of record (commitment) that Douglass appealed to the Declaration of Independence ("all men are created equal") as superior to the Constitution's compromised history. He would argue that "history and tradition" is just a fancy way of codifying past sins. If the tradition is oppression, the Constitution exists to *break* the tradition, not preserve it.
  *Verdict:* This collapses into a moral reading. Douglass would say the "principles the document pledges" (Liberty) must trump the "bad traditions" (Slavery/Coverture).

  **2. Federal Power and the "State Action" Doctrine**
  *The Issue:* The Court limits Congress's power to stop private discrimination (State Action Doctrine). Douglass wanted strong federal power. But today, federal power also enables mass incarceration and surveillance.
  *Douglass's View:* **He would remain a Nationalist, but an Instrumentalist.**
  *Why:* Douglass famously said, "Power concedes nothing without a demand." He believed the federal government was the only entity strong enough to crush the local tyranny of the slave states. However, he did not worship the state. He worshipped *Justice*.
  *Speculation vs. Commitment:* It is speculative to say he would oppose specific modern federal programs, but it is a commitment that he viewed federal power as a *tool* for liberation. If the federal government becomes the oppressor (e.g., enforcing segregation or unjust wars), Douglass reserved the right of revolution and moral resistance.
  *The Twist:* He would likely hate the "State Action" doctrine. He viewed slavery not just as a state law, but as a national compact. He would argue that if a private citizen violates rights, the federal government has the duty to intervene because citizenship is a national status.
  *Verdict:* He would demand strong federal power *for protection*, but he would not accept "originalist" limits on that power if those limits leave black citizens vulnerable. He would likely argue the 14th Amendment gives Congress plenary (total) power to protect citizens from *any* threat, state or private.

  **3. The Meta-Point: Knowing the Framers**
  *The Issue:* Douglass knew the Reconstruction framers. Does that make him an originalist (trusting their intent) or skeptical (knowing they were flawed politicians)?
  *Douglass's View:* **He would be deeply skeptical of "Original Intent."**
  *Why:* Douglass was frequently disappointed by the Reconstruction framers. He thought they were too timid on suffrage and land redistribution. He knew they were compromising.
  *Speculation vs. Commitment:* In his speeches, Douglass distinguishes between the "Constitution" (the text) and the "Government" (the men running it). He knew the men were corruptible. He pinned his hopes on the *words*, not the *writers*.
  *Verdict:* Knowing the sausage was made would make him reject originalism. He would say, "I don't care what Thaddeus Stevens intended in his heart; I care what the 14th Amendment *says*." He would treat the text as a weapon given to the people, not a secret code held by the framers.

  ---

  ### Part 2: Conscription vs. Discovery (The Core Theoretical Fight)

  This is the heart of your Thanksgiving dispute.

  **Your Father-in-Law (Discovery/Originalism):**
  He argues Douglass looked at the text and realized, "Aha! It never actually says 'slave'!" Therefore, the original meaning was always antislavery.
  *Where he is right:* Douglass did argue that the words "We the People" and "Liberty" are inclusive. He argued the text, read plainly, contains no authority for slavery.
  *Where he is wrong:* Douglass explicitly admitted the *framers* intended to protect slavery. He called the Constitution a "glorious liberty document" *despite* the framers' intentions, not *because* of them. He argued the text escaped the control of the men who wrote it. That is not originalism; that is textual independence.

  **You (Conscription/Strategic Capture):**
  You argue Douglass seized the text because he needed it to win.
  *Where you are right:* Douglass was a pragmatist. He knew the Garrisonian view (burn the Constitution) was a political dead end. He needed the Constitution to be antislavery to participate in politics.
  *Where you are wrong:* It wasn't *just* strategy. Douglass was a man of profound religious and moral conviction. He genuinely believed that God's law was written into the fabric of the document. If he thought he was lying, it would have destroyed his moral authority.

  **The Synthesis: Redemptive Constitutionalism**
  Douglass's position is that the Constitution is a **promise**. The framers broke the promise, but the text remains. The job of the citizen is to "redeem" the text from the framers' sins.
  *Is it Conscription?* Yes, in the sense that he is seizing the document for a purpose the framers didn't fully intend.
  *Is it Discovery?* Yes, in the sense that he believes the words *can* bear that meaning truthfully.

  **On Shamelessness (Point B):**
  Would Douglass accept "my side should be shameless about the text"?
  **Absolutely not.** This is load-bearing for Douglass. He insisted on "Truth." He argued that slavery was unconstitutional *in fact*, not just as a trick. If he adopted a "shameless" reading that he knew was false, he would undermine the Natural Law argument. He needs the text to be *actually* on his side, not just *usefully* on his side. He needs the reversal to be genuine.

  ---

  ### Part 3: Ranking the Considerations

  You asked me to rank these from "Settles the Question" to "Merely Awkward."

  **1. [LOAD BEARING] The Appeal to Natural Law vs. History.**
  Douglass's entire career is built on the idea that "Right is of no sex, truth is of no color." If the "History and Tradition" test validates past racism, Douglass *must* reject it. This settles that he is not an originalist in the modern sense. Originalism binds you to the past; Douglass bound himself to a moral future.
  *Status:* **Settles the question against your father-in-law.**

  **2. [LOAD BEARING] Intent vs. Text.**
  Douglass explicitly separated the "intent of the framers" from the "meaning of the text." He admitted the framers were pro-slavery compromisers but argued the text was better than they were. Modern originalism cares about the framers' intent/understanding. Douglass cared about the text's moral potential.
  *Status:* **Settles the question against your father-in-law.**

  **3. [SIGNIFICANT] The Instrumental View of Federal Power.**
  Douglass wanted federal power *for liberty*. He would not support federal power *for oppression*. This means he isn't a blind nationalist. He would likely support a "living" interpretation of the 14th Amendment that allows Congress to stop modern forms of bondage (like mass incarceration), even if the framers didn't imagine them.
  *Status:* **Strongly favors your sister-in-law, but complicates the "Living Constitution" label.**

  **4. [AWKWARD BUT MANAGEABLE] The "Conscription" Charge.**
  It is awkward to admit Douglass was strategic. He was. But it doesn't make him cynical. He believed the strategy was *moral*. This doesn't settle the legal theory debate, but it clarifies his motivation.
  *Status:* **Explains the motivation, doesn't settle the legal theory.**

  ---

  ### Part 4: How to Explain This to a 12-Year-Old

  You need to translate "Redemptive Textualism" into 7th-grade civics. Here is the script:

  **The Setup:**
  "Imagine your family has an old set of rules written by your Great-Great-Grandpa. He was a good man, but he wrote a rule that said, 'Only boys can inherit the family farm.' That was the custom back then."

  **The Problem:**
  "Years later, the family realizes that's unfair. Girls should inherit the farm too. Now, there are two ways to fix it."

  **Option A (Grandpa's Way / Originalism):**
  "We look at what Great-Great-Grandpa *really meant*. Maybe he only said 'boys' because he didn't know girls could run a farm. If we can prove he would have said 'kids' if he knew better, we can let the girls inherit. This is what your Great-Grandpa (the judge) thinks Douglass did."

  **Option B (The New Way / Living Constitution):**
  "We say the old rule is outdated. We should just write a new rule that fits how we live now. This is what your Aunt (the lawyer) thinks Douglass did."

  **Douglass's Way (The Promise):**
  "Douglass did something different. He looked at the very first page of the rulebook, where it says, 'This family believes in Freedom and Fairness for Everyone.'
  He said: 'Great-Great-Grandpa made a mistake when he wrote the "boys only" rule. It breaks the main promise of the family. So, we don't need to change the rulebook, and we don't need to pretend Grandpa was perfect. We just need to enforce the *main promise* over the *mistake*.'

  **The Lesson:**
  "Douglass teaches us that the Constitution isn't just a list of old rules. It's a promise to be better than we were in the past. Sometimes, keeping that promise means protecting rights the people who wrote the rules didn't even think about."

  ### Final Verdict for the Dinner Table

  Tell your father-in-law: "Douglass wasn't an originalist because he didn't care about the framers' intentions; he cared about the text's moral capacity. He admitted the framers were flawed."

  Tell your sister-in-law: "Douglass wasn't a living constitutionalist because he didn't think we could ignore the text. He thought the text itself, properly read, demanded justice."

  **You win the argument by pointing out that Douglass believed the Constitution was a *weapon for the oppressed*, not a *fetter from the ancestors*.** That doesn't fit in either modern box.
