answer: |-
  Here is a structured teaching plan designed for a 90-minute seminar. It prioritizes philosophical rigor over therapeutic application, addressing your specific concerns about the "metaphysical backbone" and the risks of the algorithmic example.

  ### **Seminar Title:** *Prohairesis* vs. The Feed: Recovering the Stoic Dichotomy of Control

  **Target Audience:** Philosophy Undergraduates (Familiar with CBT, Unfamiliar with *Enchiridion*)
  **Duration:** 90 Minutes
  **Primary Text:** Epictetus, *Enchiridion*, Chapter 1 (Opening paragraph)

  ---

  ### **I. Pedagogical Strategy & Sequencing**

  **1. The Sequence: Tension First, Definition Second.**
  Do not begin with the distinction. Begin with the **Modern Misreading**.
  *   **Reasoning:** Since your students know CBT, they arrive with a pre-loaded framework (thoughts cause feelings; change thoughts to regulate feelings). If you start with *prohairesis*, they will simply map it onto CBT cognitive restructuring and miss the ethical shift.
  *   **Method:** Start by articulating the "Therapeutic Stoicism" they likely know (control your reaction to feel better). Create *aporia* by asking if this makes Stoicism merely a survival tactic for a corrupt world. Then, introduce Epictetus's text as the corrective that restores the ethical/metaphysical stakes.

  **2. The Carrying Example: The Algorithmic Recommendation.**
  You are correct to lean toward the **Algorithmic Case**, despite the risks.
  *   **Why:** The "Failed Examination" is too binary (study vs. grade) and often implies a meritocracy Stoics would reject. The "Death of a Loved One" is too emotionally volatile for a first conceptual pass. The Algorithm is the perfect modern analogue for *phantasiai* (impressions).
  *   **Mitigating the Determinism Risk:** You must explicitly frame the algorithm not as a *cause* of action, but as a generator of **impressions**. The Stoic locus of control is not "Can I turn off the algorithm?" (External); it is "Do I assent to the impulse to click?" (Internal). This preserves *prohairesis* against technological determinism.

  ---

  ### **II. Session Flow**

  #### **Phase 1: The Hook – The Therapeutic Reduction (15 Minutes)**
  *   **Activity:** Briefly outline the standard CBT/Stoic self-help interpretation: "We cannot control events, only our reactions. Therefore, we should detach to reduce anxiety."
  *   **Discussion Prompt:** "If Stoicism is just a tool to make us feel calmer in a chaotic world, does it matter if the world is just or unjust? Is the goal *ataraxia* (tranquility) or *aretē* (virtue)?"
  *   **Goal:** Establish the tension. Show them that if the metaphysical backbone is removed, Stoicism becomes a sedative rather than an ethics.

  #### **Phase 2: The Text – Defining *Prohairesis* (25 Minutes)**
  *   **Reading:** Read *Enchiridion* 1.1–1.5 aloud.
  *   **Key Distinction:** Draw the line on the board.
      *   *Up to us (Eph' hēmin):* Opinion, impulse, desire, aversion (summarized as **Prohairesis**).
      *   *Not up to us:* Body, property, reputation, command (summarized as **Externals**).
  *   **Crucial Correction (Misconception 1):** Head off the "Emotional Regulation" error **here**.
      *   *Point:* Clarify that *prohairesis* is not "managing emotions." It is the moral faculty of **assent**. An emotion (*pathos*) is already a failure of assent for the Stoic. The goal is not to feel less; it is to judge correctly.
      *   *Timing:* Do this immediately after defining *prohairesis*, before moving to the example.

  #### **Phase 3: The Application – The Algorithmic Case (30 Minutes)**
  *   **Scenario:** A student is studying. A phone notification (algorithmic recommendation) suggests a video that confirms a political bias or offers distraction.
  *   **Analysis:**
      1.  **The External:** The notification, the code, the server, the existence of the urge. (Not up to us).
      2.  **The Internal:** The assent to the proposition "I should watch this now." (Up to us).
      3.  **The CBT Contrast:** CBT might ask, "What thought is making you anxious about missing this?" Stoicism asks, "Is watching this consistent with your role as a rational agent?"
  *   **Crucial Correction (Misconception 2):** Head off the "Indifference" error **here**.
      *   *Point:* Students will argue, "So I shouldn't care about the algorithm's impact on society?"
      *   *Timing:* When discussing the "Not up to us" column.
      *   *Clarification:* Distinguish between *moral indifference* (it doesn't affect my virtue) and *practical indifference* (I shouldn't try to fix it). We prefer a healthy society (Preferred Indifferent), but our happiness cannot *depend* on it. We act virtuously regarding the algorithm, but our *eudaimonia* does not hinge on the algorithm's outcome.

  #### **Phase 4: The Metaphysical Signal (10 Minutes)**
  *   **Activity:** Briefly address your concern about the "metaphysical backbone."
  *   **Explanation:** Explain that for Epictetus, *prohairesis* is a fragment of the Divine Logos. It is not just "psychological will"; it is the only thing in the universe that is truly free because it aligns with Nature.
  *   **The "Black Box" Signal:** Explicitly state: "We are not studying Stoic Physics today (the *pneuma*, the cosmic conflagration), nor are we solving the Compatibilist debate on Fate. However, know that this Dichotomy rests on a Physics where the universe is rational and providential. Without that, the Dichotomy is just psychology. With it, it is theology."
  *   **Goal:** Satisfy the undergraduates' need for systematic rigor without derailing the ethics seminar.

  #### **Phase 5: The Closing Diagnostic (10 Minutes)**
  *   **Activity:** Silent reflection followed by one-round sharing.
  *   **The Question:**
      > "If two people successfully resist the algorithmic temptation, but one does so because they fear a ban (external outcome) and the other because they value rational agency (internal virtue), does the Dichotomy of Control view them as equally 'in control'? Why or why not?"
  *   **Desired Answer:** They should recognize that "control" in the Stoic sense is not about the *behavioral outcome* (not clicking), but the *locus of motivation*. The first person is still enslaved to the external (the ban); only the second exercises *prohairesis*. This reveals that the Dichotomy is about **moral responsibility**, not **prediction of outcomes**.

  ---

  ### **III. Summary of Decisions for the Instructor**

  | Decision Point | Choice | Rationale |
  | :--- | :--- | :--- |
  | **Starting Point** | **Modern Misreading** | Creates necessary tension; prevents students from lazily mapping *prohairesis* onto CBT "cognitive reframing." |
  | **Carrying Example** | **Algorithmic Case** | Most relevant to their lived experience; tests *assent* better than "exams" (meritocracy) or "death" (grief). *Constraint:* Focus on the *click* (assent), not the *feed* (determinism). |
  | **Misconception 1** | **Emotion vs. Assent** | **Address in Phase 2.** Crucial to distinguish Stoicism from "keeping a stiff upper lip." Emotions are judgments, not separate entities to be regulated. |
  | **Misconception 2** | **Indifference vs. Virtue** | **Address in Phase 3.** Clarify that "externals" are not worthless, they are just not *good*. We engage with them virtuously. |
  | **Omissions** | **Physics & Fate** | **Address in Phase 4.** Do not teach *pneuma*. Do signal that the ethics depends on the physics, so they know the "backbone" exists even if not examined. |
  | **Closing Question** | **Motivation vs. Outcome** | Tests if they understand that "control" is a moral category, not a causal one. |

  ### **IV. Instructor's Note on the "Metaphysical Backbone"**
  Your friend's concern is valid. In Phase 4, when you signal the omitted physics, use this phrasing:
  *"In CBT, the goal is functionality. In Epictetus, the goal is alignment with Nature. If you remove the 'Nature' (the Logos), you are left with a coping mechanism. If you keep it, you have an ethics. We are studying the ethics, but we must acknowledge it hangs from a hook we are not touching today."*

  This validates your philosophical intuition without overloading the undergraduates.
