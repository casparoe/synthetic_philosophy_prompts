answer: |-
  This is a profound and precisely formulated puzzle. It touches on what Ian Hacking called the "hybrid" nature of modern statistics, but you have identified something deeper: an *institutional category mistake* regarding the ontology of probability. The practice of Null Hypothesis Significance Testing (NHST) as currently institutionalized relies on a frequentist *calibration* to justify a Bayesian *consumption*.

  Below is a reconstruction of the philosophical presuppositions of this practice, an evaluation of how standard interpretations of probability license or break down within it, a specific analysis of preregistration, and a sketch of what a Bayesian reconstruction would entail.

  ---

  ### 1. The Institutional Presupposition: "Calibrated Credence"

  To understand what the practice presupposes, we must distinguish between the **logic of justification** (how the number is derived) and the **logic of usage** (how the number is consumed).

  *   **The Logic of Justification (Frequentist):** The $p$-value is derived from a sampling distribution. It presupposes that probability is a property of the *data generation process* under a specific counterfactual ($H_0$). It requires a defined reference class of hypothetical repetitions.
  *   **The Logic of Usage (Quasi-Bayesian):** The binary outcome ("significant") is consumed as a warrant for belief in a specific hypothesis ($H_1$). It treats the probability as a property of the *hypothesis* given the data.

  **The Core Presupposition:** The institution presupposes that **long-run error control is a sufficient proxy for single-case epistemic warrant.** It assumes that if a procedure rarely flags false effects in the long run (frequentist), then a specific flag from that procedure indicates a real effect in the short run (epistemic).

  This is not a theorem; it is a philosophical bridge. Strictly speaking, the practice presupposes a **hybrid ontology**: probability is frequentist in the *design* phase (to set $\alpha$) but epistemic in the *inference* phase (to claim truth).

  ### 2. Evaluation of Probability Interpretations

  Here is how the three standard interpretations fare when mapped onto the actual institutional practice.

  #### A. Frequentism (Neyman-Pearson)
  *   **Where it Licenses the Practice:**
      *   **The Threshold:** The 0.05 cutoff makes sense only here. It is a bound on the long-run Type I error rate ($\alpha$).
      *   **Preregistration:** This is strictly required to define the sampling distribution. If the analysis plan changes after seeing data, the "long run" is ill-defined, and $\alpha$ is inflated.
      *   **Binary Decision:** Neyman-Pearson theory is explicitly about "inductive behavior" (accept/reject), not belief.
  *   **Where it Breaks Down:**
      *   **The Consumption:** Frequentism explicitly forbids assigning probabilities to hypotheses. $H_0$ is either true or false; it has no probability. Therefore, the statement "the effect is real" is meaningless in strict frequentism.
      *   **Publication Bias:** Frequentist error control assumes all conducted tests are counted in the long run. The institutional suppression of null results (the file drawer problem) violates the frequentist assumption, rendering the actual long-run error rate unknown and likely much higher than 0.05.
      *   **Single Case:** Frequentism cannot justify belief in *this* specific finding, only the reliability of the *method*.

  #### B. Subjectivism / Bayesianism (Degree of Belief)
  *   **Where it Licenses the Practice:**
      *   **The Consumption:** It licenses the claim "the effect is real" (or rather, "I have high confidence the effect is real"). It allows probability to attach to hypotheses ($P(H|D)$).
      *   **Evidence:** It aligns with the researcher's intuition that data should update confidence.
  *   **Where it Breaks Down:**
      *   **The $p$-value:** The $p$-value is irrelevant to the posterior probability. A low $p$-value does not guarantee a high posterior probability of $H_1$ (especially if the prior on $H_1$ is low).
      *   **The Threshold:** There is no Bayesian justification for a universal 0.05 cutoff. Belief updating should depend on prior odds and loss functions, which vary by context.
      *   **Preregistration:** In pure Bayesian updating, the **Stopping Rule Principle** holds: when you stop collecting data does not affect the posterior, provided the likelihood is correctly specified. Preregistration is less critical for error control and more about transparency of priors/model selection.

  #### C. Propensity (Objective Chance)
  *   **Where it Licenses the Practice:**
      *   **Causal Language:** Propensity interpretations (Popper, etc.) view probability as a physical disposition of a setup. This fits the "the drug works" language better than frequentism, as it suggests a causal power in the specific object.
  *   **Where it Breaks Down:**
      *   **The Inverse Problem:** Like frequentism, propensity does not solve the inverse probability problem. Knowing the propensity of the data given the null does not tell you the propensity of the null given the data.
      *   **Calibration:** It struggles to justify the rigid 0.05 behavioral rule. Propensities are continuous physical magnitudes; turning them into binary publication decisions requires an external decision-theoretic layer not inherent to the interpretation.

  ### 3. The Puzzle of Preregistration

  You identified preregistration as a critical tension point. Here is the philosophical dissection of that norm.

  **The Frequentist Necessity:**
  Mathematically, the $p$-value is a function of the *sampling plan*. If you decide to stop collecting data when $p < 0.05$ (optional stopping), or if you try multiple covariates until one works ($p$-hacking), you alter the sampling distribution. The calculated $p$-value no longer corresponds to the tail area of the actual procedure. Therefore, **preregistration is a frequentist requirement to fix the reference class.** Without it, the long-run error rate $\alpha$ is undefined.

  **The Epistemic Motivation:**
  Why do we care if $\alpha$ is actually 0.05? We do not care about the long-run performance of the procedure for its own sake. We care because we want to trust the *specific* claim in the paper. We want to treat the result as evidence for a hypothesis.

  **The Tension:**
  Preregistration is a **frequentist mechanism deployed to secure a Bayesian end.**
  *   *Strict Presupposition:* The practice strictly presupposes that the probability is a property of the procedure (hence the need to lock the procedure down).
  *   *The Breakdown:* If the probability were truly only about the procedure (Neyman-Pearson), we wouldn't need to worry so much about the truth of the specific hypothesis, only the behavior of the agent. But because the institution treats the result as truth, we use frequentist constraints (preregistration) to "clean" the data so it can bear epistemic weight.

  **Verdict:** Preregistration reveals that the institution knows, deep down, that the $p$-value is fragile. It admits that the "probability of the procedure" is easily corrupted by human intention, yet it insists on using that corrupted probability to make claims about the world.

  ### 4. Distinguishing Presupposition from Fit

  To clarify the ontology for your seminar, we can categorize the elements of the practice:

  | Feature | Strict Presupposition (Required for Math) | Mere Fit / Institutional Habit (Underdetermined) |
  | :--- | :--- | :--- |
  | **Sampling Distribution** | **Frequentist/Propensity.** You cannot calculate a $p$-value without a model of hypothetical repetitions. | |
  | **Binary Threshold (0.05)** | **Decision Theory.** Requires a loss function (not inherent to prob. theory). | **Frequentist.** Fits the $\alpha$ control narrative, but the specific value is arbitrary. |
  | **"Effect is Real"** | **None.** Mathematically unsupported by $p$-value. | **Bayesian/Subjective.** Fits the consumption, but contradicts the calculation. |
  | **Preregistration** | **Frequentist.** Required to define the sampling distribution validly. | **Epistemic.** Motivated by desire for truth, not just error control. |
  | **Publication Bias** | **Violates Frequentism.** Breaks the long-run assumption. | **Fits Incentive Structure.** Fits the "truth-seeking" narrative (only publish "findings"). |

  **The Underdetermination:**
  The practice is underdetermined between **Fisher's Significance Testing** (evidence against $H_0$) and **Neyman-Pearson Hypothesis Testing** (binary decision rule).
  *   *Fisher:* $p$ is a measure of evidence. (Fits the "consumption," breaks the "threshold/behavior" norm).
  *   *Neyman-Pearson:* $p$ is a trigger for action. (Fits the "threshold," breaks the "evidence/truth" consumption).
  *   *Institution:* Mixes them. Uses NP thresholds to make Fisherian claims.

  ### 5. Rebuilding the Institution on Bayesian Grounds

  If you were to rebuild the seminar's target institution on a straightforward Bayesian view (Subjective/Epistemic probability), the following structural changes would be required:

  1.  **Reporting Output:**
      *   **Current:** $p = 0.03$ ("Significant").
      *   **Bayesian:** Posterior probability $P(H_1 | Data) = 0.85$ or Bayes Factor $BF_{10} = 6$.
      *   **Change:** No binary "significance." Results are continuous updates to belief.

  2.  **Evidence of an Effect:**
      *   **Current:** Rejection of a nil null ($H_0: \theta = 0$).
      *   **Bayesian:** Comparison of model predictive performance or region of practical equivalence (ROPE). The question shifts from "Is it non-zero?" to "Is it large enough to matter?"
      *   **Change:** The null hypothesis is rarely a point mass at zero. We would estimate effect sizes with credible intervals.

  3.  **Design and Preregistration:**
      *   **Current:** Preregistration locks the analysis to preserve $\alpha$.
      *   **Bayesian:** Preregistration locks the *priors* and *model structure* to prevent "prior hacking" or "model fishing."
      *   **Change:** **Sequential analysis becomes legitimate.** Under Bayesianism, you can look at the data continuously and stop when the posterior is sufficiently peaked. The Stopping Rule Principle means you do not inflate error rates by peeking. This would drastically change experimental design (e.g., adaptive clinical trials).

  4.  **Decision and Publication:**
      *   **Current:** Publish if $p < 0.05$.
      *   **Bayesian:** Publish based on the value of information or the magnitude of the posterior, regardless of whether it crosses an arbitrary line. Null results are equally informative (they shift the posterior down).
      *   **Change:** The publication bias against null results would theoretically vanish, as a precise estimate of "no effect" is as valuable as "some effect."

  ### Summary for the Seminar

  The puzzle you are grappling with is that the institution of significance testing is a **frequentist engine driving a Bayesian vehicle.**

  *   It uses frequentist probability to **calibrate** the tool (control false positives in the long run).
  *   It uses Bayesian intuition to **drive** the tool (make claims about specific hypotheses in the short run).

  Preregistration is the guardrail installed because the engine is unstable; it forces the frequentist calibration to hold, hoping that this stabilizes the Bayesian drive. But because the consumption of the result ignores the calibration conditions (e.g., publication bias, ignoring power), the vehicle frequently crashes.

  To resolve the puzzle, one must admit that the practice does not have a coherent philosophy of probability. It is a **pragmatic bricolage**: it borrows the objectivity of frequentism to gain scientific legitimacy, while borrowing the epistemic force of Bayesianism to gain practical utility. It breaks down because it tries to have the objectivity of frequency without the discipline of counting all trials, and the epistemic force of belief without the discipline of specifying priors.
