prompt: |-
  I'm preparing a graduate seminar in the philosophy of statistics, and I've been stuck for some time on how to state a puzzle about the institution of significance testing that I think is real but that I can't quite get to the bottom of. The practice is familiar enough: a researcher runs a randomized experiment or a well-controlled study, computes a p-value, and if it falls below 0.05 the finding is reported as "statistically significant," the effect is treated as real, and a paper follows; if it doesn't, the finding is reported as "not significant" and the effect is usually treated as if it weren't there, even though the procedure is calibrated only to control the long-run rate of false positives, not of false negatives. And there is a further asymmetry in the institution itself: journals and grant reviewers systematically prefer published significant results to published null results, so the procedure's output is consumed as if it were a verdict on whether an effect exists, when on the standard account the p-value is merely the probability, supposing the null hypothesis is true, of seeing data at least as extreme as what was in fact observed — a probability about the behavior of the procedure, not about the truth of the hypothesis.

  What I'd like from you is a careful reconstruction of what this practice presupposes about the nature of probability. On the frequentist reading, probability is a long-run relative frequency of a repeatable procedure, and that reading seems to be what the significance level is doing all its work for; but the way the result is actually consumed — "the drug works," "the effect is real" — is a statement about the hypothesis, which is what a subjectivist or Bayesian degree of belief would be. So: which of the standard interpretations — frequentism, degree-of-belief subjectivism, propensity — can each be made to license the practice as it actually is, and at exactly which step does each one break down? I'm especially interested in the norm of preregistration, which requires the hypothesis and the analysis plan to be fixed before the data are collected. That norm looks like it only makes sense if probability is a property of the procedure and not of the hypothesis, but it also looks like it is being motivated by a desire to make post-hoc statements about the hypothesis legitimate, which is a different thing altogether. Please distinguish what the practice strictly presupposes from what it merely fits well with, say where the practice is underdetermined between the interpretations, and explain what would have to change — in how results are reported, in what counts as evidence of an effect, in the design of the experiment — if the institution were rebuilt on a straightforwardly Bayesian view of probability rather than the view it appears to presuppose.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** Graduate seminar in philosophy of statistics.
      *   **Core Problem:** A puzzle about the institution of significance testing (NHST).
      *   **The Tension:**
          *   *Practice:* Binary decision (significant/not significant) based on $p < 0.05$. Treated as a verdict on reality ("effect is real").
          *   *Theory (Frequentist):* $p$-value is $P(Data | H_0)$. Controls long-run error rates (Type I), not false negatives (Type II) or probability of hypothesis.
          *   *Consumption:* Users treat it as $P(H_1 | Data)$ (Bayesian/Subjective).
          *   *Institutional Bias:* Publication bias favors significant results.
          *   *Preregistration:* Fixes analysis plan *before* data. Why? To validate the error rate (frequentist), but motivated by wanting to trust the specific claim (Bayesian-ish).
      *   **Task:**
          1.  Reconstruct what the practice presupposes about the nature of probability.
          2.  Evaluate standard interpretations (Frequentism, Subjectivism/Bayesian, Propensity) against the practice.
          3.  Identify where each interpretation licenses the practice and where it breaks down.
          4.  Analyze the norm of preregistration specifically.
          5.  Distinguish strict presuppositions from mere fit/underdetermination.
          6.  Describe what would change if the institution were rebuilt on a straightforward Bayesian view.

  2.  **Initial Analysis & Philosophical Mapping:**

      *   *The "Hybrid" Nature:* The current practice is often called the "Neyman-Pearson-Fisher hybrid." It mixes Fisher's significance testing (evidence against $H_0$) with Neyman-Pearson's hypothesis testing (binary decision rules based on $\alpha$ and $\beta$).
      *   *The "Transposed Conditional":* The core logical error is the Prosecutor's Fallacy ($P(Data|H_0) \neq P(H_0|Data)$).
      *   *Preregistration:* This is a crucial pivot point. It locks in the *sampling distribution*. If you change the analysis after seeing data, the long-run error rate calculation is invalid. But *why* do we care about the long-run error rate for *this* specific study? Because we want to trust the specific conclusion. This is the tension the user identified.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the puzzle. It's the "Philosophical Schizophrenia" of modern statistics. Define the "Institutional NHST."

      *   **Section 1: The Presuppositions of the Practice (The "Official Story" vs. The "Real Story"):**
          *   *Official:* Frequentist. Probability = Long-run frequency.
          *   *Real:* Inductive Behavior / Quasi-Bayesian. Probability = Warrant for belief.
          *   *The Gap:* The practice *requires* frequentist calibration to justify the threshold, but *requires* epistemic force to justify publication/action.

      *   **Section 2: Evaluating Interpretations:**
          *   *Frequentism (Neyman-Pearson):*
              *   *Licenses:* The threshold, the preregistration, the error control.
              *   *Breaks:* The interpretation of a single result. NP says "accept/reject" is behavioral, not epistemic. It doesn't say "the effect is real," it says "act as if." The publication bias violates the long-run assumption (file drawer problem).
          *   *Subjectivism/Bayesianism:*
              *   *Licenses:* The consumption ("effect is real"), the interest in the specific hypothesis.
              *   *Breaks:* The $p$-value itself (irrelevant to posterior), the rigid 0.05 threshold (arbitrary for belief), preregistration (less critical if updating on likelihoods, though relevant for priors/model checking).
          *   *Propensity:*
              *   *Licenses:* Maybe the "real effect" language (dispositional).
              *   *Breaks:* Still struggles with the single-case vs. long-run tension. Doesn't solve the inverse probability problem.

      *   **Section 3: The Puzzle of Preregistration:**
          *   This is the heart of the user's specific interest.
          *   *Frequentist Justification:* To fix the reference class. If you peek, the error rate $\alpha$ is no longer 0.05.
          *   *Motivation:* We want to believe *this* result.
          *   *The Tension:* Preregistration protects a frequentist property to serve a Bayesian end. It's a "frequentist shield for Bayesian hopes."

      *   **Section 4: Distinguishing Presupposition from Fit:**
          *   *Strict Presupposition:* The math *requires* a defined sampling distribution (Frequentist/Propensity). You cannot calculate a $p$-value without a model of data generation under $H_0$.
          *   *Underdetermined:* The *meaning* of the output. Is it a rule for action (NP) or evidence (Fisher)? The institution treats it as truth (neither).
          *   *Misfit:* Publication bias. Frequentism assumes all studies are counted. The institution hides nulls.

      *   **Section 5: Rebuilding on Bayesian Grounds:**
          *   *Reporting:* Posteriors, Bayes Factors, Credible Intervals. No "significant."
          *   *Evidence:* Likelihood ratios.
          *   *Design:* Sequential analysis is easier (stopping rules don't matter in pure Bayesianism). Preregistration changes role (preventing prior hacking, not error rate hacking).
          *   *Decision:* Explicit loss functions.

  4.  **Refining and Polishing:**

