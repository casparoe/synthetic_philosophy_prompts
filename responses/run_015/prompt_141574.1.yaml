answer: |-
  **Overall Credence: 0.52**

  **Decomposition**

  1.  **Descriptive Representativeness (0.55):** Demographic diversity adds information and reduces blind spots, but policy preferences correlate strongly enough with demographics that "whose rear end" matters less than the incentive structure surrounding the seat.
  2.  **Deliberation vs. Capture (0.45):** A 300-person standing body is large enough for factionalism and small enough for a professional secretariat to effectively draft the "reasons" and steer outcomes toward upper-middle-class norms.
  3.  **Loss of Re-election Incentive (0.70):** Removing the 2–4 year electoral cycle is the single strongest lever for improving long-horizon metrics like infrastructure and pensions, as it decouples decision-making from donor/recall anxiety.
  4.  **Institutional Survival (0.35):** Elected chambers historically resist power-sharing; without a constitutional lock, they will bypass the sortition chamber via delegated legislation or emergency powers within a decade.

  **Combination Logic**
  These are not independent; Factor 4 (Survival) is a gatekeeper. If the elected chamber neuters the body, Factors 1–3 yield zero return. I have weighted Factor 4 heavily as a cap, while allowing Factor 3 (Incentives) to pull the average up slightly above the User's 0.45, assuming the override rule creates *some* friction against total neutering. I am double-counting the risk of "capture" in both Factor 2 (secretariat dominance) and Factor 4 (elected bypass), as a captured sortition chamber is easier for the elected chamber to ignore.

  **The Disagreement (0.45 vs. 0.75)**
  Your gap with the political scientist lives almost entirely in **Factor 4 (Institutional Survival)**. The PolSci believes the "reason-reading override" creates a high-cost focal point for public shaming that protects the chamber; you (and I) suspect elected politicians will treat the procedural hurdle as a minor compliance cost and absorb the reputational hit.

  **Least Confident Term & Evidence**
  **Factor 2 (Deliberation vs. Capture).** We have no historical data on a *standing* sortition legislature with delay/amend powers; all existing evidence comes from ad-hoc mini-publics (Ireland, Oregon) where stakes were lower and duration shorter.
  **Moving Evidence:** A five-year trial of a sortition council with binding veto power in a mid-sized municipality or province, specifically tracking whether the professional staff or the members drive the final wording of recommendations.

  **Flipping the Open-Mindedness Rule**
  If you over-sample people with **strong settled views** instead of the undecided: **0.35**.
  **Justification:** This converts the chamber from a deliberative body into a microcosm of the polarized electorate, eliminating the "preference transformation" benefit of sortition and replicating the gridlock of the elected chamber without the accountability.
