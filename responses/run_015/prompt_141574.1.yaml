      *Flip:* If you over-sample strong views, you lose the deliberative dividend. Credence drops to 0.35.

      *Disagreement Location:* Factor 4 (Neutering). The PolSci thinks the "reason-reading" prevents this. I think it's procedural speedbump, not a wall.

