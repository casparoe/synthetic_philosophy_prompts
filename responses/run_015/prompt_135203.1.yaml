prompt: |-
  I'm a doctoral student in moral philosophy working on normative authority and idealized agency. I'm trying to isolate a conceptual tension in accounts of indirect normativity—specifically, an ambiguity in what "idealized deliberation" is meant to preserve.

  Standard treatments present the model roughly as follows: an actual agent, constrained by ignorance, bias, or partial commitment, consults what a fully rational counterpart—possessing complete information, coherence, and absence of distorting preferences—would prescribe, and derives normative force indirectly from that prescription. But I think this glosses over a distinction between procedural and substantive idealization. In procedural idealization, the counterpart retains the agent's actual practical identity—her values, commitments, and constitutive attachments—while correcting only her reasoning processes. In substantive idealization, only the formal structure of rational agency is preserved; the counterpart may hold values or priorities that the actual agent would reject even under conditions of full reflection, because the idealization strips away not merely error but the particularities that constitute her practical self.

  The conceptual issue I want clarified is whether indirect normativity can survive a shift from procedural to substantive idealization. If the deliberating counterpart is not "me, corrected," but rather "a rational agent in my structural position," then the normative prescription no longer derives from my practical identity refined; it derives from a different source altogether. Does this collapse indirect normativity into direct universalizability? Or does it reveal that indirect normativity was always dependent on a hidden thesis about the preservation of practical identity through idealization?

  Please explain this issue with precision: what must be settled conceptually for the indirect link to hold, whether partial or conflicted commitments can survive any non-trivial idealization without being replaced rather than refined, and where philosophers of practical reason genuinely disagree on these points versus where there is broad agreement. Separate clearly what is conceptually settled from what remains genuinely contested among those who work on idealization and practical reason, and do not present any contested interpretation—particularly about whether substantive idealization breaks the normative link or transforms it into something else—as the consensus view.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Doctoral student in moral philosophy.
      *   **Topic:** Normative authority, idealized agency, indirect normativity (specifically the tension between procedural and substantive idealization).
      *   **Core Question:** Can indirect normativity survive a shift from procedural to substantive idealization? Does substantive idealization collapse indirect normativity into direct universalizability? Is there a hidden thesis about the preservation of practical identity?
      *   **Requirements:** Explain with precision, distinguish settled vs. contested issues, avoid presenting contested interpretations as consensus, identify where philosophers genuinely disagree.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Indirect Normativity:* Normativity comes from what an idealized version of *me* would will/choose, not directly from objective facts or universal laws (though those might inform the idealization). Key examples: Ideal Advisor theories (Brandt, Smith), Constitutivism (Korsgaard, Velleman), Hypothetical Consent.
      *   *Procedural Idealization:* Fix the inputs (values, identity), optimize the processing (logic, information, coherence). Result: "Me, but smarter/clearer."
      *   *Substantive Idealization:* Fix the structure of agency, optimize the outputs based on rational standards that might override actual inputs. Result: "A rational agent in my situation."
      *   *The Tension:* If the idealized agent is too different from the actual agent (substantive), why does their verdict bind *me*? The "authority" link seems broken. If they are too similar (procedural), do they just replicate my errors or parochialism?
      *   *The Collapse Worry:* If the ideal agent is just "rational agency" simpliciter, isn't this just Kantian universalizability (direct normativity) dressed up as indirect?

  3.  **Survey the Landscape (Mental Check of Key Figures):**
      *   *Michael Smith (The Moral Problem):* Argues for the "rational counterpart." Tries to balance systematic justification with agent-neutrality. Often accused of sliding into substantive idealization.
      *   *Richard Brandt (Cognitive Psychotherapy):* Very procedural. All actual desires survive unless based on false belief/logic error.
      *   *Christine Korsgaard (Constitutivism):* Focuses on the structure of agency. Can look substantive (what *must* a willer will?), but claims authority comes from *my* nature as an agent.
      *   *David Velleman:* Similar to Korsgaard, focuses on constitutive aims.
      *   *Peter Railton:* Ideal advisor, but focuses on objective good.
      *   *James Dreier, Connie Rosati:* Internalism/Externalism debates regarding idealization.
      *   *Nadeem Hussain, Nishi Shah:* Meta-ethical implications of idealization.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the distinction (Procedural vs. Substantive). State the core problem: The *Authority Transfer Problem*.

      *   **Conceptual Clarification (The "What"):**
          *   Define Indirect Normativity clearly (Authority flows $Actual \to Ideal \to Actual$).
          *   Define Procedural (Input preservation) vs. Substantive (Structural preservation).
          *   Identify the "Hidden Thesis": The *Continuity Condition*. For indirect normativity to work, there must be sufficient continuity of practical identity between Actual and Ideal.

      *   **The Collapse Worry (Procedural vs. Substantive):**
          *   If Procedural: Risk of conservatism (my bad values get ratified).
          *   If Substantive: Risk of alienation (the ideal agent isn't *me*).
          *   Does it collapse to Direct Universalizability? Yes, if the "ideal agent" is defined solely by universal rational standards independent of the agent's specific identity.

      *   **Settled vs. Contested (Crucial Step):**
          *   *Settled:* Everyone agrees idealization must filter *some* errors (logic, facts). Everyone agrees there is a risk of alienation. Everyone agrees the "link" requires some form of identification.
          *   *Contested:*
              1.  *The Threshold of Continuity:* How much change is too much? (Smith vs. Brandt).
              2.  *The Source of Authority:* Is it the *process* (I would agree) or the *outcome* (It is rational)?
              3.  *The Fate of Conflicted Commitments:* Can deep conflicts survive idealization, or must they be resolved (thereby changing the agent)?
              4.  *Constitutivism's Status:* Is it indirect or direct? (This is a major fault line).

      *   **Addressing the Specific Questions:**
          *   *Can indirect normativity survive substantive idealization?* Only if "substantive" is anchored in a constitutive feature of the *actual* agent (e.g., "I am an agent, therefore I must will X"). If it's just "Rationality demands X," the link breaks.
          *   *Partial/Conflicted Commitments:* This is the hard part. Idealization usually demands coherence. Coherence often requires dropping conflicting commitments. This suggests *replacement* rather than *refinement*.
          *   *Consensus vs. Disagreement:* Be very careful here. There is no consensus that substantive idealization *breaks* the link, but there is consensus that it *threatens* it.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to make sure I don't conflate "Substantive Idealization" with "Externalism." One can be an internalist about reasons but use substantive idealization (e.g., "Your deep self wants X, even if your surface self doesn't").
      *   *Nuance:* The term "Direct Universalizability" needs care. Kantianism is often framed as indirect (via the Categorical Imperative procedure), but the *source* is universal reason. The distinction is whether the *particularity* of the agent matters.
      *   *Key Terminology:* Use "Normative Resonance" or "Identification Condition."
      *   *The "Hidden Thesis":* The user asked about this. It's the claim that Rationality is *identity-constituting* rather than *identity-constraining*.

  6.  **Final Polish:**
      *   Ensure tone is appropriate for a doctoral student (technical, precise, no hand-holding).
      *   Check constraints: Do not present contested views as consensus.
      *   Structure: Clear headings.

  7.  **Final Review against constraints:**
      *   *Precision?* Yes.
      *   *Settled vs. Contested?* Explicitly separated.
      *   *Consensus check?* Avoid claiming everyone agrees substantive idealization breaks the link. Instead, frame it as a major point of contention regarding the "alienation objection."

  **(Self-Correction during drafting):** I initially thought about citing specific papers. Better to refer to positions/arguments (e.g., "The Smithian model," "Brandtian cognitive psychotherapy") to keep it conceptual, but naming key figures helps anchor the debate. I need to be careful not to say "Korsgaard is substantive." She argues her view preserves the agent's identity through the constitutive aim. That's a contested interpretation. I should frame it as "Constitutivists claim..."

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a precise and structurally significant problem in meta-ethics and the theory of practical reason. You have correctly identified that the viability of indirect normativity hinges on a **Continuity Condition**: the idealized agent must be sufficiently continuous with the actual agent to transfer normative authority, yet sufficiently distinct to correct normative error.

  When the idealization shifts from procedural (correcting the *how* of deliberation) to substantive (correcting the *what* of valuation), the "Indirect" model risks collapsing into a "Direct" model (where authority stems from the objective correctness of the ideal standard, not the relation to the agent).

  Below is an analysis of the conceptual requirements for the indirect link to hold, the fate of conflicted commitments, and a demarcation of settled versus contested terrain in the literature.

  ### 1. The Conceptual Requirement: The Identification Condition

  For indirect normativity to function, the prescription of the idealized counterpart must bind the actual agent *because* it is the prescription of *her* counterpart. This requires what we might call the **Identification Condition**.

  *   **Procedural Idealization:** Satisfies the Identification Condition easily. If the counterpart shares all actual desires/values and merely corrects for logical error and ignorance (e.g., Brandt's *Cognitive Psychotherapy*), the output is causally and constitutively linked to the actual self. The authority is preserved because the source is the agent's own psychology, refined.
  *   **Substantive Idealization:** Risks violating the Identification Condition. If the counterpart is defined by a standard of rationality that dictates specific values (e.g., "a rational agent must value autonomy"), and the actual agent does not value autonomy, the counterpart is no longer "the agent refined" but "rationality instantiated."

  **What must be settled conceptually:**
  For indirect normativity to survive substantive idealization, one must defend a **Constitutive Thesis**. One must argue that the substantive values held by the idealized agent are not external constraints imposed on the agent, but are *constitutive of the agent's own identity* as a rational being.
  *   If the substantive values are external (e.g., objective goods), the normativity is direct (agent-neutral).
  *   If the substantive values are internal (e.g., commitments inherent to the structure of *my* will), the normativity remains indirect (agent-relative, derived from *my* nature).

  Therefore, the shift from procedural to substantive idealization does not *automatically* collapse indirect normativity into direct universalizability, **provided** the substantive standards are grounded in the actual agent's constitutive features rather than in mind-independent rational truths.

  ### 2. The Fate of Conflicted and Partial Commitments

  You ask whether partial or conflicted commitments can survive non-trivial idealization without being replaced. This is the locus of the **Alienation Objection**.

  *   **The Coherence Requirement:** Almost all models of idealization require the idealized agent to possess coherence (consistency, means-end efficiency, perhaps unity of will).
  *   **The Problem:** Actual agents often have constitutive attachments that are inherently conflicted (e.g., a commitment to family that conflicts with a commitment to impartial morality, or conflicting higher-order desires).
  *   **Refinement vs. Replacement:**
      *   If idealization resolves the conflict by prioritizing one commitment over the other based on a neutral rational standard, this is **Replacement**. The ideal agent has a different practical identity than the actual agent.
      *   If idealization resolves the conflict by finding a higher-order integration specific to the agent's history and psychology, this is **Refinement**.

  **Conceptual Implication:**
  If substantive idealization requires the elimination of conflict to achieve "full rationality," and the actual agent's identity is partly constituted by that conflict (e.g., the tension between personal projects and moral demands), then the idealized agent is **not** the actual agent. In this scenario, indirect normativity fails. The prescription binds the agent only if she *becomes* the ideal agent, which renders the normativity direct (binding on all rational agents) rather than indirect (binding on *me* because it is *my* ideal self).

  ### 3. Settled vs. Contested Terrain

  It is vital to distinguish where the literature rests on firm ground and where the debate remains live.

  #### A. Conceptually Settled (Broad Agreement)
  1.  **The Necessity of a Link:** There is consensus that for a theory to count as *indirect* normativity (or internalist reasons theory), there must be a motivational or identity-based link between the actual agent and the idealized counterpart. If the link is severed, the theory becomes externalist or directly realist.
  2.  **The Risk of Alienation:** There is agreement that substantive idealization introduces a risk of alienation. If the idealized self would not recognize the actual self's projects as valuable, the actual self may not recognize the idealized self's prescriptions as authoritative.
  3.  **The Role of Information:** There is consensus that idealization must include full information (or at least freedom from factual error). Disagreement lies in whether this includes "phenomenological information" (what it feels like to have experiences one doesn't currently have).
  4.  **The Distinction Itself:** The distinction between procedural (input-preserving) and substantive (structure-preserving) idealization is accepted as a valid analytical tool, even if specific theorists dispute where their view falls on the spectrum.

  #### B. Genuinely Contested (Live Debates)
  1.  **The Threshold of Continuity:** There is no consensus on how much divergence in values is permissible before the Identification Condition fails.
      *   *Side A (e.g., Smithian):* Argues that systematic justificatory coherence may require the idealized agent to abandon actual desires that cannot be systematized. They claim authority holds because the actual agent *would* endorse this systematization upon reflection.
      *   *Side B (e.g., Williams/Subjectivist):* Argues that if the "reflection" leads to the abandonment of ground projects that define the agent, the link is broken. The resulting reasons are not *the agent's* reasons.
  2.  **The Status of Constitutivism:** It is contested whether Constitutivist accounts (Korsgaard, Velleman) count as procedural or substantive, and whether they succeed in preserving indirect normativity.
      *   *Interpretation 1:* They are substantive (they derive norms from the structure of agency itself).
      *   *Interpretation 2:* They are procedural (the structure of agency is the one thing the actual agent cannot reject without ceasing to act).
      *   *The Dispute:* Does the "constitutive aim" belong to the *actual* agent (preserving the link) or is it a normative standard the agent *ought* to have (breaking the link)? This is unresolved.
  3.  **The "Ideal Advisor" vs. "Ideal Self":** There is disagreement over whether the counterpart should be modeled as an *advisor* to the actual self (preserving the actual self's identity as the locus of value) or as a *successor* (where the actual self should strive to become the ideal self).
      *   If the model is **Advisor**, substantive idealization is harder to justify (why listen to someone with different values?).
      *   If the model is **Successor**, substantive idealization is easier, but the normativity looks more like a command to transform oneself than an authority over one's current self.
  4.  **Whether Substantive Idealization Collapses the View:**
      *   *View 1:* Substantive idealization inevitably collapses indirect normativity into a form of rationalist realism (Direct Normativity). The "ideal self" is just a heuristic for objective rational requirements.
      *   *View 2:* Substantive idealization can remain indirect if the substantive standards are indexed to the agent's specific capacity for agency (i.e., "What *I* must will as an agent," not "What must be willed").

  ### 4. Conclusion: The Hidden Thesis

  To answer your specific query: **Indirect normativity does not necessarily collapse under substantive idealization, but it does depend on a hidden thesis.**

  That thesis is: **Rational Identity is Normatively Prior to Psychological Identity.**

  *   **Procedural Idealization** assumes Psychological Identity is prior (my values define me; rationality serves them).
  *   **Substantive Idealization** assumes Rational Identity is prior (my capacity for agency defines me; my values are valid only insofar as they align with that capacity).

  If you accept the hidden thesis, substantive idealization preserves indirect normativity because the "Ideal Self" is more *truly* you than your actual psychological state. The authority derives from your "real" will (Rational Identity) over your "empirical" will (Psychological Identity).

  If you reject the hidden thesis, substantive idealization breaks the normative link. The idealized agent is a different entity, and their prescriptions constitute direct universal norms, not indirect authoritative commands derived from your own agency.

  **Current Consensus Status:** There is **no consensus** on whether this hidden thesis is defensible. This is the central fault line between Humean/Internalist constructivists (who tend toward procedural idealization to protect psychological identity) and Kantian/Constitutivist constructivists (who tend toward substantive idealization to protect rational identity). Your work should locate which side of this fault line the specific account of indirect normativity you are analyzing occupies, as that determines whether the "collapse" objection applies.
