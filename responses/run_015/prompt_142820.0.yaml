answer: |-
  **Algorithmic Accountability Unit: Fairness Coherence Procedure**

  **Purpose:** To assess whether a public body's stated fairness commitments are mathematically coherent within the specific deployment envelope, given known incompatibility results (e.g. Chouldechova 2017; Kleinberg et al. 2016).

  **Procedure**

  1.  **Define the Deployment Envelope**
      *   *Question:* What specific decision does the score inform (fixed threshold or top-$k$ slice)? What is the outcome variable? Which group definitions apply? Are outcomes observed for all cases or only selected ones?
      *   *Sufficient Answer:* A precise specification of the decision rule, outcome window, and group labels.
      *   *Stop Condition:* If the body uses the same score across multiple units with different thresholds, treat each unit as a separate envelope. Metrics cannot be aggregated.

  2.  **Establish Base Rates**
      *   *Question:* What is the prevalence of the outcome (base rate) within each protected group in the validation sample?
      *   *Sufficient Answer:* Calculated prevalence per group.
      *   *Stop Condition:* If base rates differ significantly between groups, proceed to Step 3. If base rates are equal, compatibility between calibration and error rates is mathematically possible; proceed to Step 4.

  3.  **Map Fairness Commitments**
      *   *Question:* Which metrics has the body committed to? (e.g. Calibration within groups, Equal False Positive Rates (FPR), Equal False Negative Rates (FNR)).
      *   *Sufficient Answer:* A list of asserted metrics.
      *   *Decision Point:* If base rates differ (from Step 2) and the body claims Calibration *plus* Equal FPR *plus* Equal FNR, return **'Internally Inconsistent Claim — Send Back to Vendor'**. These cannot simultaneously hold unless the classifier is perfect.

  4.  **Assess Selection Bias (Partial Labels)**
      *   *Question:* Are outcomes observed only for cases selected by the model or previous process?
      *   *Sufficient Answer:* Acknowledgement of missing data for unselected cases.
      *   *Decision Point:* If outcomes are missing for unselected cases, error rates (FPR/FNR) cannot be calculated directly without strong assumptions about the unobserved. Return **'Holds Under This Envelope Only — Subject to Unconfoundedness Assumption'**. The body must justify how missing outcomes were imputed or bounded.

  5.  **Assess Proxy Validity**
      *   *Question:* Are group labels direct or proxies?
      *   *Decision Point:* If proxies, return **'Holds Under This Envelope Only — Subject to Measurement Error'**. Metrics reflect the proxy, not the protected characteristic.

  6.  **Identify Value Boundaries**
      *   *Question:* Does the incompatibility require choosing between competing metrics (e.g. equalising FPR vs. equalising FNR)?
      *   *Decision Point:* Stop and hand back. This is a **Choice of Values**. The Unit cannot dictate which metric to drop, only that both cannot be kept.

  ***

  **Application 1: Tax Authority Audit Selection**

  *   **Envelope:** Fixed threshold for audit selection. Outcome: Underpayment found. Groups: Region. Outcomes observed for all audited cases (selected only).
  *   **Base Rates:** Differ significantly across regions.
  *   **Claims:** Vendor reports Calibration within groups *and* Equal FPR and FNR across groups.
  *   **Assessment:**
      *   Step 2 confirms differing base rates.
      *   Step 3 identifies claims for Calibration, Equal FPR, and Equal FNR.
      *   **Result:** **'Internally Inconsistent Claim — Send Back to Vendor'**.
      *   **Reasoning:** Given differing base rates, satisfying calibration necessitates unequal error rates. The vendor's report implies mathematical impossibility. The Authority must either reject the calibration claim, accept unequal error rates, or demonstrate the base rates are effectively equal in the target population (unlikely). The selection bias (outcomes only for audited returns) further undermines the error rate estimates unless the audit selection was randomised, which it was not.

  **Application 2: Council Housing Inspection**

  *   **Envelope:** Top-$k$ slice for inspection visits. Outcome: Hazard found. Groups: Ethnicity (proxy via surname). Outcomes observed only for inspected cases.
  *   **Base Rates:** Differ significantly across groups.
  *   **Claims:** Statutory duty to equalise wrongful flags (FPR). Council claims the model is "fair and more efficient" than the previous process.
  *   **Assessment:**
      *   Step 2 confirms differing base rates.
      *   Step 3 identifies commitment to Equal FPR.
      *   Step 4 flags selection bias: FPR is estimated only on inspected cases. Without knowing hazards in uninspected homes, true FPR is unknown.
      *   Step 6 (Value Boundary): To equalise FPR with differing base rates, the model must apply different decision thresholds per group or accept unequal FNR (missing hazards).
      *   **Result:** **'Holds Under This Envelope Only — Trade-off Required'**.
      *   **Reasoning:** The Council will not want this answer because meeting the statutory duty (Equal FPR) given the base rate disparity *forces* unequal FNR. High-base-rate groups will have more hazards missed (higher FNR) if FPR is equalised. The Council claims "efficiency" (overall accuracy), but equalising FPR reduces overall utility compared to a single threshold. Furthermore, reliance on surname proxies (Step 5) means the statutory duty is being met on noisy data, potentially violating the spirit of the law. The coherence check holds, but the operational cost is higher missed risks in specific communities.

  ***

  **Limitations of the Procedure**

  This procedure cannot determine which fairness criterion is morally or legally preferable; it merely identifies logical contradictions. It cannot correct for selection bias without untestable assumptions about the unobserved population. It cannot validate whether proxy labels adequately capture protected characteristics. Finally, it cannot assess whether the outcome variable itself (e.g. "audit finding") encodes historical bias; it treats the label as ground truth. Where the mathematics permits multiple coherent configurations, the choice remains with the minister, not the auditor.
