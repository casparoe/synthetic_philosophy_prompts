answer: |-
  Hey, I have been thinking about your question on pure time preference and discounting the future, and honestly, you are hitting on the exact fracture point where economics bleeds into moral philosophy. Before you dive into another reading, it is worth laying out the desiderata because most theories fail by ignoring half of this list. If we are going to construct or evaluate a theory of pure time preference, the first non-negotiable requirement is normative impartiality. This comes straight from Ramsey and Pigou, and it states that if we are talking about ethics rather than psychology, the mere location of a person in time cannot justify giving their welfare less weight. A theory that builds ethical discounting into the foundation violates the principle of equal consideration of interests, so any adequate account must distinguish between a descriptive rate, which explains how people actually behave, and a normative rate, which prescribes how we ought to value future generations. You cannot collapse these two without committing the naturalistic fallacy, yet so many models do exactly that by taking market interest rates as ethical guides.

  Beyond the ethical baseline, the theory has to handle the distinction between risk and pure time, which is often the place where the math gets smuggled in as morality. We know there is a probability that humanity might go extinct or that a specific project might fail, and that probability naturally reduces the expected value of future outcomes. An adequate theory must isolate pure time preference from this extinction risk. If you discount the future because there is a chance no one will be there to enjoy it, that is rational probability weighting, not pure time preference. The non-negotiable here is separability; if your theory cannot mathematically or conceptually separate the probability of existence from the value of existence, it is not measuring time preference, it is measuring uncertainty. This ties directly into the distinction between personal and impersonal discounting. Individuals discount heavily because we are mortal; my future self might not exist, or I might not be me. Societies, however, do not face the same biological horizon. A theory must explain why individual impatience is rational given mortality while societal impatience regarding climate change or nuclear waste is potentially irrational. If the theory applies the same discount rate to a human life span and a civilizational life span, it fails the scale test.

  Then you have the psychological phenomena your friend mentioned, specifically the asymmetry of anticipation. This is a major hurdle for any model assuming a uniform positive discount rate. Behavioral work by people like Loewenstein shows that people sometimes delay good news to savor anticipation and rush bad news to stop dread. If waiting can increase subjective value for positive outcomes, then the discount function is not monotonically decreasing. This suggests that discounting is valence-dependent rather than time-dependent. An adequate theory must account for this without treating it as an anomaly. If you insist on a uniform discount rate, you are effectively ignoring the phenomenology of how humans experience time, which makes your descriptive model false. However, this creates a tension with the economic requirement for consistency. If discount rates flip based on whether news is good or bad, you open the door to dynamic inconsistency and preference reversals that make long-term planning impossible. So here is one of your jointly unsatisfiable pairs: you likely cannot have a theory that is both psychologically descriptive of anticipation effects and mathematically tractable for standard infinite-horizon optimization. You have to choose between accuracy and usability.

  This leads us to the mathematical constraints, which are where the camp preferences really start to show. Koopmans argued that some positive discounting is necessary for the convergence of utility integrals over an infinite future. If you set the pure time preference rate to zero, as Ramsey wanted, the sum of utility can diverge, making it impossible to rank different policy paths. This is often presented as a technical necessity, but it is really a modeling choice. A robust theory needs to acknowledge that zero discounting might require changing the aggregation method, like using overtaking criteria or sustainable preference functionals, rather than just accepting positive discounting as the only solution. The non-negotiable here is transparency. The theory must admit when it is choosing a positive rate for mathematical convenience rather than ethical justification. If it claims the positive rate is ethical when it is actually just there to make the integral converge, it is failing the honesty criterion.

  Now, regarding your question about whether the task itself is muddled, I think you need to hear that many philosophers argue the concept of pure time preference is incoherent. To prefer a unit of utility now over a unit of utility later, holding risk and capacity constant, implies a kind of temporal myopia that is hard to defend rationally. It suggests that time itself has a cost independent of opportunity or uncertainty, which metaphysically dubious. If you strip away risk, mortality, and changing marginal utility of consumption, there might be nothing left to discount. So the biggest red flag to look for is whether the theory is reifying a psychological bias into an ethical parameter. The jointly unsatisfiable pair that matters most here is ethical impartiality versus standard utilitarian aggregation. You cannot have both strict impartiality across generations and the standard discounted utilitarian framework without running into paradoxes like the repugnant conclusion or divergence problems. You either abandon impartiality and accept that future people count for less, or you abandon the standard framework and accept that ranking outcomes becomes much harder.

  Finally, you need to check if the theory contradicts biological or economic realities. Biologically, we know discounting correlates with life expectancy and environmental stability. A theory that posits a fixed universal discount rate contradicts evolutionary psychology. Economically, we know that interest rates are determined by growth and scarcity, not just time preference. A theory that treats the discount rate as an exogenous ethical parameter ignores the endogenous nature of capital returns. The non-negotiable is consistency with empirical data on how discounting varies across cultures and contexts. If the theory claims a universal rational rate but humans vary wildly based on survival pressure, the theory is descriptively bankrupt. So when you read your next argument, check if they are conflating the market interest rate with the ethical discount rate, check if they are hiding extinction risk inside the time parameter, and check if they admit that anticipating good news breaks the uniform discount model. If they gloss over those, they are likely selling you a simplified model as a moral truth. It is a messy field, but seeing where the contradictions lie is half the battle.
