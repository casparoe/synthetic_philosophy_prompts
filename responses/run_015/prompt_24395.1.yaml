  8.  *(Self-Correction on Tension 1)*: I need to make sure I don't confuse Overdetermination and Preemption.
      *   *Overdetermination:* Two rocks hit at once. Lewis fails (no dependence). Interventionism: Hold one fixed, change other -> Effect changes. Works.
      *   *Preemption:* Suzy hits, Billy ready. Lewis fails (no dependence). Interventionism: This is harder. Woodward says we look for *active causal routes*. We hold the backup path fixed *by hand* (conditioning on the variable) to see if the primary path transmits influence.
      *   *Key distinction for the user:* "Holding fixed" in Lewis is about *world similarity* (which allows the backup to activate). "Holding fixed" in Interventionism is about *model structure* (setting a variable to a value *ceteris paribus* in the equations). The latter allows you to "freeze" the backup cause even if the primary fails, which the former does not.

  9.  *(Self-Correction on Tension 2)*: Make sure to mention the "I-variables" (Instrumental variables). The definition of intervention uses causal terms, but we can identify interventions *non-causally* via randomization mechanisms. This breaks the epistemic circle even if the semantic circle remains.

