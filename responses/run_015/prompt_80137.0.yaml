  4.  **Drafting the Content - Section by Section (Iterative refinement):**

      *   *Implicit Theory:* It's crucial not to say doctors *believe* behaviorism. They don't. They practice *methodological behaviorism*. The presupposition is: "Consciousness that cannot be communicated is medically and legally inert." This aligns with Access Consciousness being the *functional* definition of consciousness for the system.
      *   *Access vs. Phenomenal:* The medical system treats Access as a *proxy* for Phenomenal. But because the stakes are life/death, the proxy becomes the *criterion*. This creates a "presumption of non-consciousness" in the absence of access.
      *   *GWT Connection:* GWT says consciousness *is* global availability. If the medical system assumes "No motor output = No consciousness," they are acting *as if* GWT is true (specifically, that motor broadcasting is required). But fMRI shows the *content* is available globally (to the imaging), just not motorically. So the system is actually stuck on *Motor Access*, not necessarily *Cognitive Access*.
