      *   **The Problem:** Medical diagnosis is purely behavioral (access-based), but fMRI evidence shows some "behaviorally unresponsive" patients have covert awareness (phenomenal + access, but no motor output). Yet, behavior remains the gold standard.
      *   **The Question:** What view of consciousness does current medical/legal practice *presuppose*?
          *   Does it assume Phenomenal requires Access (Global Workspace Theory style)?
