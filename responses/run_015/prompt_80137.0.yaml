  *(Self-Correction Note)*: I must emphasize that the medical practice is primarily *epistemic*, not metaphysical. They aren't making a claim about the *nature* of consciousness, but about the *conditions for treating* consciousness. However, the *effect* is metaphysical. I will frame this as "Operational Identity."

