answer: |-
  This is a precise and deeply consequential philosophical problem disguised as a clinical protocol question. You have correctly identified the friction point: the gap between the *ontology* of consciousness (what it is) and the *epistemology* of consciousness (how we know it), mediated by the *ethics* of consciousness (how we treat it).

  Here is a reconstruction of the implicit theory embedded in current medical-legal practice regarding Disorders of Consciousness (DoC), distinguishing between what is strictly necessary for the practice to function and what is merely compatible with it.

  ### 1. Reconstructing the Implicit Theory: "Operational Identity"

  Current medical and legal practice does not strictly presuppose a metaphysical theory of consciousness (like Behaviorism or Global Workspace Theory) as *truth*. Instead, it operates on a principle of **Operational Identity**.

  **The Core Presupposition:**
  *   **Phenomenal Consciousness is legally and medically inert unless it is coupled with Access Consciousness that can be externally verified.**

  This is not the claim that "unverifiable experience does not exist." It is the claim that "unverifiable experience cannot sustain moral or medical claims."

  **How this maps to your distinction:**
  *   **Access Consciousness:** The medical standard requires not just internal access (availability for reasoning), but *motorized* access (availability for reporting).
  *   **Phenomenal Consciousness:** Treated as a dependent variable. It is inferred *from* Access. If Access (behavior) = 0, then Phenomenal is treated as = 0 for all practical purposes.

  **Is this Global Workspace Theory (GWT)?**
  It is compatible with GWT, but it is stricter. GWT posits that consciousness *is* global availability of information. If a patient can imagine playing tennis on command (as in the fMRI cases), GWT would suggest they are conscious because that information was globally available to the motor planning cortex, even if the spinal cord didn't fire.
  *   **The Medical Deviation:** Medicine treats the *spinal output* as the necessary condition. This implies a view closer to **Higher-Order Thought (HOT)** theories combined with **Verificationism**: A state is only treated as conscious if there is a higher-order representation that can be communicated to another agent.

  ### 2. Strict Presuppositions vs. Compatible Fits

  To understand where the system is rigid and where it is flexible, we must separate the *logic of the practice* from the *philosophies that justify it*.

  #### Strict Presuppositions (What the practice *needs*)
  1.  **Public Verifiability:** The legal and medical systems are intersubjective institutions. They strictly presuppose that a fact about inner life must be translatable into public data to count as a fact *for the system*.
  2.  **The Default Null Hypothesis:** In the absence of positive evidence of awareness, the system presupposes non-awareness. This is an epistemic risk-management strategy. It assumes the probability of hidden phenomenal consciousness is low enough to justify withdrawing life support, provided behavioral access is absent.
  3.  **The Identity of Suffering and Report:** For pain management and end-of-life decisions, the system presupposes that if suffering cannot be reported (behaviorally), it cannot be weighed against other interests (like resource allocation or family wishes).

  #### Merely Compatible Fits (What fits, but isn't required)
  1.  **Metaphysical Behaviorism:** The system does not *need* to believe experience *is* behavior. It only needs to behave *as if* it believes that. Doctors can privately be dualists but publicly act as behaviorists.
  2.  **Global Workspace Theory:** As noted, GWT allows for covert awareness (as seen in fMRI). The medical system ignores this nuance. So, GWT is compatible with the *science*, but not the *protocol*.
  3.  **Moral Nihilism about Qualia:** The system doesn't need to assume hidden qualia have *no* moral weight. It only needs to assume they have *unquantifiable* moral weight. If you can't measure the suffering, you can't put it on the scale.

  #### Where it is Underdetermined
  The practice is profoundly underdetermined on the **Ontological Status of the Hidden**.
  *   **Scenario:** A patient has no motor output, no fMRI signal of command following, but has rich phenomenal experience (a "locked-in" soul with no interface).
  *   **The Gap:** The current system does not decide if this patient *is* conscious. It decides that this patient *counts* as unconscious.
  *   **The Ambiguity:** We do not know if the law views the withdrawal of hydration in UWS as *ending a life* or *ceasing futile treatment of a body*. If it's the former, the presupposition is that hidden consciousness doesn't exist. If it's the latter, the presupposition is that hidden consciousness exists but is irrelevant to the definition of "personhood" or "benefit." The legal opinions (like *Cruzan* or *Schiavo*) often waffle precisely here.

  ### 3. The fMRI Paradox: Why Behavior Remains King

  You asked why fMRI isn't standard given it detects "covert awareness."
  *   **The Philosophical Reason:** fMRI detects **Access Consciousness** (the ability to hold a task in mind and modulate activity), not **Phenomenal Consciousness** directly.
  *   **The Problem:** A patient might successfully imagine tennis (Access) without feeling pain or joy (Phenomenal). Conversely, a patient might feel terror (Phenomenal) but be unable to modulate cortex for tennis (No Access).
  *   **The Medical Calculation:** Because fMRI only proves Access, and the legal standard relies on the inference from Access to Phenomenal (to determine suffering/interest), fMRI is viewed as an upgrade in *sensitivity*, not a change in *category*. It moves some patients from UWS to Minimally Conscious State (MCS), but it doesn't change the rule that *without access, there is no standing.*

  ### 4. What Changes if We Accept Phenomenal Without Access?

  If we shift the paradigm to accept that **Phenomenal Consciousness can exist without Access (or behavioral trace)**, the medical-legal framework undergoes a catastrophic (or revolutionary) restructuring. This is the "Philosophical Zombie" reversal: instead of worrying about things acting conscious but not being conscious, we worry about things being conscious but not acting.

  #### A. Diagnostic Shift: From Verification to Falsification
  *   **Current:** Consciousness is presumed absent until proven present (via behavior).
  *   **New:** Consciousness is presumed present until proven absent (via biology).
  *   **Mechanism:** You would need a "biomarker of phenomenality." Since we don't have one, you would likely rely on a **Precautionary Principle**. If the neural substrate for experience (e.g., thalamocortical integration) is intact, consciousness is assumed, regardless of output.
  *   **Result:** The diagnosis of "Vegetative State" would effectively vanish. It would be replaced by "Motor-Disconnected Consciousness."

  #### B. Legal Shift: The Burden of Proof
  *   **Current:** To keep life support, the family must prove the patient has awareness/interest.
  *   **New:** To withdraw life support, the state must prove the patient *lacks* awareness.
  *   **Consequence:** Withdrawal of nutrition/hydration would become legally perilous, potentially unconstitutional in some jurisdictions ( Eighth Amendment "cruel and unusual" if the patient is secretly suffering). The "right to die" would clash with the "presumption of sentience."

  #### C. Ethical Shift: The Problem of Hidden Suffering
  *   **Current:** Pain management is titrated to behavioral signs (grimacing, heart rate).
  *   **New:** Pain management must be prophylactic. If phenomenal pain can exist without behavioral access, then *any* intact nociceptive pathway implies potential suffering.
  *   **Result:** Massive increase in palliative sedation. You cannot risk leaving a paralyzed patient in pain just because they can't grimace.

  ### 5. Summary: The "Epistemic Wall"

  The medical practice does not presuppose that Phenomenal Consciousness *requires* Access. It presupposes that **Moral Agency requires Access.**

  The system builds an **Epistemic Wall**. On one side is the patient's inner life; on the other is the court/hospital. The only gate through the wall is behavioral report.
  *   **The fMRI cases** punch a hole in the wall, showing the gate was too small.
  *   **The refusal to standardize fMRI** is a refusal to widen the gate, because widening it destabilizes the legal certainty required for end-of-life decisions.

  If you accept Phenomenal without Access, you collapse the wall. You force the legal system to make decisions based on **metaphysical probability** rather than **epistemic certainty**. Currently, the system prefers the certainty of "we saw no movement" over the risk of "they might be feeling." To change this, you would need to convince the law that the moral risk of killing a conscious being outweighs the moral risk of prolonging the biological life of a non-conscious body. Currently, the calculus goes the other way.

  **The Implicit Theory in one sentence:**
  *Consciousness is not a biological fact to be discovered, but a communicative status to be achieved; without the capacity to bridge the gap between inner experience and outer observation, the inner experience is legally indistinguishable from non-existence.*
