answer: |-
  This is a sharp observation. You've correctly identified that your friend isn't operating on a single, consistent ethical algorithm. Her answers reveal a hybrid framework that switches rules depending on whether she's in a **civic/political** context or a **market/consumer** context.

  Here is the breakdown of the machinery, the prediction for the freezer case, the state of the philosophical debate, and the single question that will force her to reveal her true operating system.

  ### The Machinery: Three Competing Rules

  Based on her walk-and-talk answers, three distinct ethical rules are fighting for control in her head. They all fit her previous data points, but they diverge sharply on the freezer case.

  **1. The Causal Threshold Rule (The Activist)**
  *   **The Logic:** My action matters only if there is a plausible causal chain where my specific contribution helps cross a known threshold to change an outcome.
  *   **Fits:** Crossing the picket line (59% → 60%), the local election (11 votes), the boycott (48k → 50k).
  *   **Fails:** The petition (ignored), the cooked chicken (sunk cost), the eggs (fixed schedule).
  *   **Freezer Prediction:** **Don't buy.** Even though the probability is low, there *is* a causal mechanism (sales data triggers the rollout). Unlike the eggs, her purchase is entered into the algorithm. Unlike the petition, the decision-maker (the board) hasn't pre-committed to ignoring the data.

  **2. The Tracked Participation Rule (The Organizer)**
  *   **The Logic:** My action matters only if the system is designed to register and count my contribution toward a collective goal. If I'm anonymous and uncounted, I'm not really "joining" anything; I'm just noise.
  *   **Fits:** The boycott (published target), the picket line (turnout count), the petition (signature count).
  *   **Fails:** The eggs (uncounted), the freezer (uncounted/anonymous), voting (secret ballot).
  *   **Wait, Voting?** She says vote, but voting is secret. This suggests voting is governed by a *third* rule.
  *   **Freezer Prediction:** **Buy the chicken.** There is no campaign, no counter, and no way to know if she's part of the "winning" coalition. It's an anonymous market transaction, indistinguishable from the eggs case.

  **3. The Civic Duty Rule (The Citizen)**
  *   **The Logic:** In political institutions, I have a duty to participate regardless of impact. In market transactions, I am a consequentialist (I only act if I change outcomes).
  *   **Fits:** Voting (emphatic yes despite low impact), Local Election (yes). Explains why she treats voting differently from the boycott.
  *   **Fails:** Doesn't apply to supermarkets.
  *   **Freezer Prediction:** **Buy the chicken.** This is a commercial transaction, not a civic one. Therefore, she reverts to strict consequentialism. Since the expected value is low (0.5 to 200 birds) and the probability is vague, she treats it like the eggs.

  ### The Prediction

  **She will say: Buy the chicken.**

  **Why I'm weighting the rules this way:**
  The clue is in the **emphasis**. She was "genuinely emphatic" about voting (Civic Duty) but only "yeah sure, you might as well" about the boycott (Causal Threshold). This tells you that her threshold for taking action in *market* scenarios is much higher than in *civic* scenarios.

  In the boycott case, the threshold was visible and close (48k/50k). In the freezer case, the threshold is invisible and the probability is vastly lower (1 in 200 to 1 in 50,000). If she was only lukewarm about the high-probability boycott, she is unlikely to support abstaining in the low-probability freezer case.

  Furthermore, her "No" on the eggs was based on the *supply chain mechanics* (order already placed), not just the lack of a campaign. In the freezer case, while the mechanism exists, it is opaque. People who think like she does usually require *salient* causality. If she can't see the lever, she assumes pulling her hand won't move it. She will likely categorize this with the **Eggs** (market, opaque impact) rather than the **Picket Line** (collective, clear impact).

  ### The State of Play: Settled vs. Contested

  You need to be careful here. You asked for straight talk on what is settled in philosophy. **Almost none of this is settled.** This is one of the most active battlegrounds in contemporary ethics.

  *   **Settled:** There is no consensus. If you present this to a room of moral philosophers, you will get a fight.
  *   **Contested (The "Inefficacy Objection"):** The debate over whether an individual has a moral reason to refrain from a harmful act (like buying factory-farmed meat) when that single act has a negligible probability of changing the outcome is known as the problem of **overdetermination** or **imperceptible harm**.
      *   **The Consequentialist View:** Philosophers like **Shelly Kagan** (*The Limits of Morality*) and **Mark Budolfson** argue that if the expected utility is near zero, there is no consequentialist reason to abstain. They focus on the *expected value*.
      *   **The Complicity View:** Philosophers like **Christopher Kutz** (*Complicity: Ethics and Law for a Collective Age*) argue that you shouldn't look at individual impact, but at whether you are *participating* in a harmful project. This aligns with her "Voting" logic but applied to markets.
      *   **The Threshold View:** Some argue that while one egg doesn't matter, *purchases trigger orders*. Since orders happen in batches, there is a small chance your purchase triggers a batch. **Alastair Norcross** and others debate the math of this. Your friend's guess (1 in 200 to 1 in 50,000) is actually a sophisticated engagement with this specific debate (often called the "triggering case").

  **Warning:** Do not tell her "philosophers say X." Tell her "some philosophers argue X, others argue Y." If you claim consensus where there is none, she will (rightly) call you out.

  ### The Killer Question

  You want one case that splits the **Causal Threshold** rule from the **Tracked Participation** rule. The freezer case muddies them because it has a causal mechanism but no tracking. You need a case with **Tracking but No Causality** vs. **Causality but No Tracking**.

  **Ask her this:**

  > "Imagine a charity that saves lives has a strict funding threshold: if they raise exactly $1 million by Friday, they launch a clinic. If they raise $1,000,001, the extra money goes into a general fund that gets wasted on admin. They have a public counter. It currently reads $999,900. You have $100.
  >
  > **Scenario A:** You donate online. Your name goes on the public counter, pushing it to $1,000,000. But unknown to you, a wealthy donor has already wired $100 anonymously that hasn't updated on the counter yet. The clinic is already funded. Your donation pushes the total to $1,000,100, wasting the money.
  >
  > **Scenario B:** You mail a cash donation anonymously. There is no counter. Your money arrives Monday. By pure chance, it is the exact $100 needed to hit the $1 million mark to launch the clinic. Nobody knows you did it.
  >
  > In which scenario did you do the right thing? Is it better to be the person in A (counted, but causally useless) or B (untracked, but causally pivotal)?"

  **Why this splits the rules:**
  *   If she says **Scenario A** is better (or equal), she values **Tracked Participation**. She wants to be part of the visible collective effort, even if her specific dollars didn't tip the scale. This suggests she might feel a duty to boycott the freezer chicken to be "counted" in the abstract data, even if the odds are low.
  *   If she says **Scenario B** is strictly better, she is a pure **Causal Consequentialist**. She only cares about the actual outcome. This suggests she will buy the freezer chicken, because the odds of being the "Scenario B" donor are too low to justify the cost.
  *   If she says **Neither matters**, she is skeptical of individual impact entirely in these contexts.

  This forces her to admit whether she cares about *being seen as a participant* or *actually moving the needle*. That is the fault line in her freezer decision.
