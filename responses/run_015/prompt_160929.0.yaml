answer: |-
  This is a remarkably sharp set of observations. You have identified what legal sociologists often call the "gap problem"—the divergence between the law in books (Feature 4) and the law in action (Features 1, 2, 3, 5)—but you are pressing it into service for a philosophical reconstruction. Your suspicion that proportionality is "decorative" is a strong hypothesis, but to test it against Dennett and Caruso, we need to be precise about where their theories diverge from the *mechanics* of the system, not just the *rhetoric*.

  Here is a reconstruction of the normative presuppositions of your sample, an analysis of how Dennett and Caruso would diagnose them, and a framework for testing your "decorative" hypothesis.

  ### 1. Reconstructing the Practice: "Legitimacy-Maintaining Consequentialism"

  Your five features describe a system that is **consequentialist in operation but retributive in legitimation.**

  *   **The Engine (Features 1, 2, 3, 5):** These are purely administrative and utilitarian. They treat sentence length as a currency to purchase procedural efficiency (pleas), intelligence (substantial assistance), and finality (waiving appeal). The "discount" is not a mitigation of blame; it is a rebate for reducing state expenditure.
  *   **The Shell (Feature 4):** This provides the moral cover. By maintaining the language of proportionality, capacity, and culpability, the system claims it is not simply managing a dangerous population (which would be politically toxic) but doing justice.

  **The Presupposition:** The practice presupposes that **desert is a constraint, not a goal.** It assumes there is a "desert ceiling" (you can't punish *more* than culpability allows) but no "desert floor" (you can punish *less* if it saves money). This is why Feature 3 (embedded offenders getting lighter sentences for snitching) is tolerated: it violates retributive proportionality (more culpable = less punishment), but it stays under the "ceiling" of the statutory maximum.

  ### 2. Differentiating Dennett and Caruso

  You are correct that both theories can be stretched to accommodate the current practice, but only by ignoring specific features. To distinguish them, you must look at where they would force the practice to *break*.

  #### Daniel Dennett (Compatibilist/Responsibility-Practice)
  Dennett argues that holding agents responsible is a necessary social technology. For Dennett, the "practice" of responsibility must be intelligible to the participant.
  *   **Compatibility:** Dennett could tolerate Features 1 and 2 if viewed as "procedural mercy" within a responsible framework. He might argue that a plea is an admission of responsibility that warrants a reduction in the *cost* of enforcement, not the *weight* of blame.
  *   **The Breaking Point:** **Feature 5 (Waiving Appeal).** Dennett's model relies on the agent being a rational participant in the moral community. If the state punishes someone *more* (by denying the discount) because they exercised a right to check for state error, the system treats the agent as an obstacle, not a participant. Furthermore, if the appellate court would have found error, the defendant is being punished for a crime they legally did not commit. For Dennett, responsibility requires a baseline of truth. A system that knowingly punishes the factually innocent to save resources undermines the very "responsibility practice" Dennett seeks to save.
  *   **Honest Adoption:** If Dennett were adopted honestly, **Feature 1 would shrink.** You cannot have a responsibility practice where 90% of cases bypass the truth-finding mechanism (trial). We would see more trials to establish the factual basis for the "responsibility" attribution.

  #### Gregg Caruso (Hard Incompatibilist/Public Health)
  Caruso argues that basic desert is impossible; state coercion is justified only by prevention (quarantine).
  *   **Compatibility:** Caruso could tolerate Features 1, 2, and 3 as "triage." Snitching (Feature 3) reduces future risk (by dismantling networks), so a sentence reduction is logically consistent with a public health model.
  *   **The Breaking Point:** **Feature 2 (Timing Discounts) and Feature 5.** In a quarantine model, the length of confinement depends on *risk*, not *timing*. A dangerous offender who pleads early is just as dangerous as one who pleads late. Reducing a sentence because a witness was spared (Feature 2) is unintelligible; the victim's inconvenience does not lower the offender's risk profile. Similarly, waiving an appeal (Feature 5) does not make an offender safer.
  *   **Honest Adoption:** If Caruso were adopted honestly, **sentence length would become indeterminate.** You would be held until your risk was mitigated (treated/aged out), regardless of whether you pleaded or went to trial. The "discount" would vanish because "time served" is not the metric; "risk managed" is.

  ### 3. The Epistemic Dimension

  You ask whether plea bargaining is an epistemically appropriate response to uncertainty or an abandonment of the question.

  *   **The Desert View:** Desert requires truth. To deserve punishment, you must have *actually* done the act with the *actual* mens rea. Plea bargaining replaces truth with **probability.** It says, "We *could* prove it, so you admit it."
  *   **The Reconstruction:** The practice treats epistemic uncertainty not as a reason for caution (which would favor acquittal), but as a reason for settlement. This suggests the system is not asking, "Are they guilty?" but "Can we secure a conviction?"
  *   **Conclusion:** It is a sign that the desert question is **not being asked.** If the system were concerned with desert under uncertainty, it would increase the burden of proof or require more robust verification for pleas. Instead, it lowers the verification standard to increase throughput. The plea is not an epistemic tool; it is a contractual one.

  ### 4. Underdetermination: What Survives Which Theory?

  To test your suspicion that proportionality is decorative, map the five features against the theories.

  | Feature | Retributive (Desert) | Dennett (Practice) | Caruso (Public Health) | Analysis |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Negotiation > Verdict** | **Incompatible.** Desert requires factual finding. | **Tolerated.** If it maintains the practice efficiently. | **Compatible.** Truth matters less than risk management. | Strong evidence against pure Desert. |
  | **2. Timing Discount** | **Incompatible.** Culpability doesn't change with time. | **Tolerated.** As a procedural incentive. | **Incompatible.** Risk doesn't change with timing. | **The Smoking Gun.** This feature serves *only* administrative efficiency. |
  | **3. Substantial Assistance** | **Incompatible.** High culpability gets low punishment. | **Tolerated.** If it preserves the system. | **Compatible.** Reduces future network risk. | Supports Consequentialism over Desert. |
  | **4. Proportionality/Capacity** | **Required.** | **Required.** (To maintain the practice). | **Required.** (Least restrictive means). | **The Decorative Shell.** Everyone claims this, but Features 1-3 violate it. |
  | **5. Waiving Appeal Credit** | **Incompatible.** Punishes rights exercise. | **Incompatible.** Undermines rational agency. | **Incompatible.** Irrelevant to risk. | **Purely Budgetary.** No normative theory supports this. |

  **Why is toleration so cheap?**
  The "sentence discount" (Features 2 & 5) is tolerated by all theories because it is the **subsidy that keeps the system solvent.**
  *   **Retributivists** tolerate it because they prioritize the *conviction* (moral condemnation) over the *quantum* of punishment.
  *   **Caruso/Dennett** tolerate it because they prioritize *system stability*. If the system collapsed due to caseloads, neither theory could be implemented.
  *   **The Cost:** The "cheapness" comes from the fact that the discount is invisible to the public. The public sees the statutory maximum (the desert ceiling); they rarely see the negotiated floor.

  ### 5. Concrete Changes: The "Honest Adoption" Test

  To move your dissertation from suspicion to finding, propose what would happen if the rhetoric matched the reality.

  **If the system were honestly Retributive (Desert-based):**
  1.  **Abolish the Discount:** Sentence length would be fixed by culpability. A plea might save court time, but it would not reduce the sentence. (This would likely cause the system to collapse, proving your point that the current system relies on the discount).
  2.  **Ban Substantial Assistance reductions:** A ringleader must receive more punishment than a foot soldier, regardless of intelligence value.
  3.  **Trial Rate Increase:** You cannot assess desert without a factual record. The plea rate would have to drop significantly.

  **If the system were honestly Caruso-style (Public Health):**
  1.  **Indeterminate Sentencing:** "You are detained until risk is low," not "You get 30% off for pleading."
  2.  **No Punitive Framing:** The language of "sentence" and "conviction" would be replaced by "confinement" and "finding of risk."
  3.  **Feature 5 Elimination:** There is no "credit" for waiving appeal. If you are dangerous, you are detained. If you are not, you are released. Procedural cooperation is irrelevant to risk.

  **If the system were honestly Dennett-style (Responsibility Practice):**
  1.  **Procedural Integrity:** Feature 5 would be abolished. You cannot penalize an agent for testing the validity of the blame.
  2.  **Remorse Integration:** Feature 2 explicitly denies the discount is for remorse. A Dennett model *would* link it to remorse, as remorse signals reintegration into the moral community.
  3.  **Truth Priority:** Pleas would require a much higher evidentiary standard to ensure the "responsibility" attribution is accurate.

  ### Summary for your Dissertation

  Your suspicion is well-founded. The practice you are studying presupposes **administrative viability** as the primary good, with **desert acting as a rhetorical constraint.**

  *   **The Normative Finding:** The system is not "retributive with exceptions." It is **consequentialist with retributive branding.**
  *   **The Theoretical Finding:** Neither Dennett nor Caruso can fully license the current practice without significant modification.
      *   Dennett cannot license Feature 5 (penalizing rights) without undermining agency.
      *   Caruso cannot license Feature 2 (timing discounts) without undermining risk assessment.
  *   **The Epistemic Finding:** Plea bargaining is not a response to uncertainty about desert; it is a **bypass** of the desert question. It substitutes *agreement* for *truth*.

  **Recommendation:** Use Feature 5 (the appeal waiver credit) as your wedge. It is the hardest feature to justify normatively. It admits openly that the sentence is a price for resource consumption, not a measure of blame. If even the "resource credit" is framed within the language of "sentencing," it confirms your hypothesis: the language of desert is being used to launder the economics of administration.
