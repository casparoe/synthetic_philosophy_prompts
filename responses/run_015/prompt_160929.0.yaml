          *   Caruso: No basic desert. Punishment is only for safety/prevention. Plea bargains look like "quarantine negotiations." But waiving an appeal (Feature 5) doesn't reduce danger, so Caruso should hate that.
      *   *The "Decorative" Hypothesis:* The user suspects proportionality is just talk. If so, the system is purely consequentialist (utilitarian/administrative).
