answer: |-
  The principle underlying your verdicts is not a single rule, but a hybrid structure. You are oscillating between a **Humanitarian Principle** (prevent suffering) and a **Political Principle** (repair broken membership). Your friend is arguing for a pure Political Principle; you are trying to keep a Humanitarian core inside a Political shell.

  The principle that best fits your case-by-case judgments is **The Principle of Substitute Political Protection.**

  It rests on four pillars. If you adopt this, you must accept the logical consequences, even where they conflict with your current intuitions.

  ### The Principle of Substitute Political Protection

  **Core Axiom:** States are the primary guarantors of rights. When a state fails to guarantee basic physical integrity or political agency to a specific group, the international community must act as a substitute guarantor. This duty is triggered by *political failure*, not merely *human suffering*.

  **Clause 1: Eligibility (The Protection Deficit)**
  A claim exists if the home state is unwilling or unable to protect the claimant from serious harm, *and* no reasonable internal alternative exists. "Reasonable" includes not just physical safety, but the ability to sustain a basic social and economic life without undue hardship.
  *(Handles Cases 1, 3, 4, 6, 8)*

  **Clause 2: Exclusion (Moral Agency)**
  Eligibility is voided if the claimant has forfeited protection through serious wrongdoing, or if the claim is manufactured in bad faith to exploit the system rather than escape harm.
  *(Handles Cases 7, 9)*

  **Clause 3: Allocation (Collective Duty)**
  The duty to provide protection is collective. It is allocated among capable states based on capacity and causal responsibility, but does not grant the claimant a right to select the specific destination state.
  *(Handles Cases 11, 12, 13, 15)*

  **Clause 4: Membership (Social Fact)**
  Long-term residence generates a distinct claim based on social integration and belonging, separate from the original protection claim. This claim is against the *host* state, not the home state.
  *(Handles Case 10)*

  ---

  ### Mapping Your Cases to the Clauses

  *   **Cases 1, 3, 4 (State Failure):** These fit Clause 1. You correctly identify that the source of violence (state vs. private) matters less than the state's *response*. Case 4 (indiscriminate bombardment) counts because the state has lost the monopoly on violence required to protect.
  *   **Case 2 (Climate):** This fits Clause 1's exclusion. Under this principle, climate change is a "natural" hazard, not a "political" failure, unless the state refused to adapt when capable. Your verdict ("Doesn't count") is consistent, but your hesitation ("owe them nothing") reveals the principle's limit.
  *   **Case 5 (Economic):** Excluded by Clause 1. The state is protecting rights; the rights just have low value there. No political failure.
  *   **Case 6 (Mixed):** Fits Clause 1. The persecution element triggers the political failure, even if compounded by climate. Your worry about "adding up harms" is resolved: you only need one political failure to trigger the clause; the rest just adds weight.
  *   **Case 7 (Sur Place):** Fits Clause 2. You distinguish between genuine belief (protected) and cynical manipulation (excluded). This relies on the *intent* of the claimant, not just the risk.
  *   **Case 8 (Internal Flight):** Fits Clause 1 ("Reasonable"). You recognize that safety in the capital is not enough if the cost is total social/economic destruction. This is a robust reading of "protection."
  *   **Case 9 (Perpetrator):** Fits Clause 2 (Forfeiture). You introduce a moral desert constraint. The duty to protect is not absolute; it presupposes the claimant is a victim, not a perpetrator.
  *   **Case 10 (Child):** Fits Clause 4. You correctly sense this is a different category. It is no longer about *substitute* protection; it is about *actual* membership.
  *   **Cases 11, 12, 13 (Allocation):** Fit Clause 3. You separate the *right to asylum* from the *right to destination*. You acknowledge causal responsibility (Case 13) creates a duty for the state, not a right for the individual.
  *   **Case 14 (Mass Statelessness):** Fits Clause 3's limit. Individual asylum cannot solve systemic political exclusion. The duty is to fix the system, not just admit individuals.
  *   **Case 15 (Private Sponsorship):** Fits Clause 3. Private actors can share the *cost*, but the state retains the *duty* of protection.

  ---

  ### Where the Principle Overturns Your Verdicts

  To have a principle is to allow it to judge you. Here are three places where the *Principle of Substitute Political Protection* demands you change your mind.

  **1. The Cynical Convert (Case 7, Third Man)**
  *   **Your Verdict:** Doesn't count (because the conversion was cynical).
  *   **Principle's Verdict:** **Counts.**
  *   **Why:** Clause 2 excludes bad faith, but Clause 1 prioritizes the *objective risk*. If the home regime will torture or kill him regardless of his sincerity, the *political failure* is real. The principle is about stopping the state's violence, not policing the claimant's honesty. If you exclude him, you become complicit in the home regime's torture. You must choose: is this about punishing liars or preventing torture? The principle says the latter.

  **2. The Climate Refugee (Case 2)**
  *   **Your Verdict:** Doesn't count.
  *   **Principle's Verdict:** **Counts (with modification).**
  *   **Why:** Clause 1 requires "political failure." In the modern era, a state's failure to mitigate or adapt to known environmental threats, resulting in the loss of habitable territory, is a failure to secure the basic right to life. To maintain consistency with Case 1 (state refusal to protect), you must treat the failure to protect against the salt water the same as the failure to protect against the gang. If you don't, you are arbitrarily defining "violence" as only human-made.

  **3. The Right to Destination (Case 11 & 12)**
  *   **Your Verdict:** No right to choose the rich country; weaker claim for forum shopping.
  *   **Principle's Verdict:** **Consistent, but with a harsh implication.**
  *   **Why:** The principle supports you here, *but* it implies that if the "neighbouring country" (Case 11) is legally safe but socially hostile (e.g., allows refugees to starve or be beaten by locals without recourse), you cannot send them there. "Safety" in Clause 1 applies to the *destination* too. If the neighbour cannot guarantee rights, the duty shifts to the rich country regardless of distance. Your verdict assumes the neighbour is "safe"; if they aren't, your allocation logic collapses.

  ---

  ### New Cases: The Price of the Principle

  Here are three cases generated by this principle. Two should make you uncomfortable; one is where the principle expects you to disagree with it.

  **Uncomfortable Case A: The Wealthy Refugee**
  A journalist from a brutal dictatorship flees. She has significant savings, speaks the language of a neighbouring safe state, and could live comfortably there. She chooses your country because she prefers your culture and schools.
  *   **Principle:** **Claim Weakens.**
  *   **Why:** Clause 1 requires "no reasonable internal alternative." If she can secure her rights and livelihood elsewhere without undue hardship, the *necessity* of your specific protection is reduced. The principle implies a "least cost" requirement on the claimant too.
  *   **Discomfort:** It feels like we are means-testing survival. But if protection is a scarce public good, does the wealthy have a duty to use private resources first?

  **Uncomfortable Case B: The Queue Jumper vs. The Quota Refugee**
  Person A arrives by boat, uninvited, and has a valid claim. Person B applied through a UN resettlement scheme five years ago, has a valid claim, and is still in a camp.
  *   **Principle:** **Equal Claim, but Person A violates Clause 3.**
  *   **Why:** Under Clause 3 (Allocation), the duty is collective and ordered. By arriving uninvited, Person A bypasses the allocation mechanism designed to balance burdens (Case 11/12). The principle suggests Person A's *claim to protection* is valid, but their *claim to stay* is weakened by the unfairness to Person B and the host community.
  *   **Discomfort:** This validates punishing people for seeking safety urgently. It prioritizes procedural order over immediate need.

  **The Disagreement Case: The "Safe" Criminal (Case 9 Variant)**
  A former low-level enforcer for the brutal regime (Case 9) flees. He didn't commit atrocities personally but kept the system running. The new regime will not torture him, but will imprison him for 10 years for his association.
  *   **Principle:** **Doesn't Count.**
  *   **Why:** Clause 2 (Forfeiture). He is not a victim of political failure; he is a beneficiary of the old order facing legitimate (if harsh) justice.
  *   **Your Likely Rejection:** You might feel that 10 years in that prison is effectively torture, and the "forfeiture" line is too blurry. You might want to protect him based on pure humanitarian risk, ignoring the political desert. The principle forces you to say: "Your past role matters more than your future pain."

  ### The Price of Having This Principle

  You asked for the price. Here it is:

  1.  **You lose moral simplicity.** You cannot say "Refugees are innocent victims." You must admit some are cynical (Case 7), some are former perpetrators (Case 9), and some are making choices (Case A).
  2.  **You accept complicity in borders.** By accepting Clause 3 (Allocation), you accept that sending a refugee to a "safe" but poor neighbour is permissible, even if their life there is meagre. You are prioritizing the *system of states* over the *maximization of individual welfare*.
  3.  **You must politicize nature.** To be consistent on Case 2 (Climate), you must argue that a drought is a political act if the state failed to prepare. This expands the definition of "persecution" significantly, which your friend will hate, but your logic requires.

  Your friend's principle is cleaner but colder (State Failure + Capacity). Yours is warmer but messier (State Failure + Capacity + Moral Desert + Social Fact). The *Principle of Substitute Political Protection* formalizes your messiness. It allows you to keep your verdicts, provided you accept that "Protection" is not just about safety, but about **restoring a person's status as a rights-bearing member of a political order.** When that is the goal, the cynical convert, the climate victim, and the wealthy journalist all become much harder problems.
