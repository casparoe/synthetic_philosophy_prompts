      *   *The Psychopathy Case (d) & Exhaustivity (a):* If psychopaths lack diachronic coherence (perhaps due to lack of moral understanding), (b) might exclude them from reactive attitudes. (d) says objective attitude is okay here. This seems consistent *if* psychopaths fail (b). But does (d) imply they aren't responsible? (c) says responsibility = target of reactive attitudes. So if we take objective stance (d), they aren't responsible. This seems consistent internally, but relies on the definition of psychopathy.
