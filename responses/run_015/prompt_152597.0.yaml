      *   *Responsibility Constitution (c) vs. Instrumentalism (f):* (c) says responsibility is *constituted* by being an appropriate target. (f) says we should manage these attitudes for welfare. If welfare dictates we treat someone as responsible (reactive) when they aren't (objectively speaking), or vice versa, does that change their responsibility status? If responsibility is constituted by the attitudes, and we manipulate the attitudes, we manipulate responsibility. This risks making responsibility too malleable or divorcing it from the "quality of will" which is central to Strawson.

