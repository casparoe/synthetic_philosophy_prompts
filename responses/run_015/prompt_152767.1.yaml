  Your package is not incoherent, but it is **unstable**. It relies on a "Two-Track" model (Worldly Consequentialism vs. Soteriological Deontology) that requires careful terminological management to avoid collapsing into contradiction.

  Here is the audit.

  ### Part 1: Pair-by-Pair Audit

  | Pair | Status | Analysis |
