  | **(1) & (3)** | **Genuine Conflict** | (1) claims **Indirect** Consequentialism (follow rules because they generally work). (3) enacts **Act** Consequentialism (break rule because *this* case works better). <br>**Severity:** High. You cannot be Indirect if you permit exceptions based on direct calculation. |
  | **(1) & (4)** | **Manageable** | (1) seeks net *dukkha* reduction; (4) admits a karmic cost (future *dukkha* for agent). <br>**Resolution:** The "net" in (1) must account for the agent's future suffering in (4). If the agent's karmic ruin outweighs the 5 saved lives, (1) forbids the act. If not, (1) permits it. |
  | **(2) & (3)** | **Genuine Conflict** | (2) says ethical quality is **Internal** (mind-only). (3) says rightness is **External** (body count/outcome). <br>**Severity:** Critical. This is a category error between *Karmic Quality* and *Moral Rightness*. |
  | **(2) & (4)** | **Consistent** | (2) defines kamma as volition; (4) specifies that the volition to kill inherently contains *akusala* roots (greed, hatred, or delusion). <br>**Note:** This is doctrinally solid Abhidharma. |
  | **(3) & (4)** | **Genuine Conflict** | (3) calls the act **"Right."** (4) calls the act **"Akusala"** (unwholesome). <br>**Severity:** High. In Buddhist terminology, "Right" (*Samma*) implies *Kusala*. A "Right Akusala Act" is an oxymoron within the Eightfold Path framework. |
  | **(5) & Others** | **Supportive** | (5) grounds the authority of (2) and (4) in phenomenology. It insulates the system from naturalistic fallacies but does not resolve the normative tensions between (1) and (3). |

  ### Part 2: Ranking Tensions by Severity

  1.  **(2) vs. (3) [Metaphysical Mismatch]:** This is the deepest fracture. You cannot hold that ethical quality is *solely* mental (2) while simultaneously asserting that the *rightness* of an act is determined by external body counts (3). This imports a Western Utilitarian metric into a Karmic Internalist system.
  2.  **(1) vs. (3) [Taxonomic Mismatch]:** You define your view as "Indirect Consequentialism," but your extreme case verdict is pure "Act Consequentialism." This makes your meta-ethical label inaccurate.
  3.  **(3) vs. (4) [Normative Mismatch]:** Calling a karmically toxic act "Right" creates semantic confusion. It conflates *worldly benefit* with *soteriological purity*.

  ### Part 3: Dissolving Distinctions

  Two distinctions can dissolve these tensions without dropping commitments, though they add complexity:

  1.  **The Two Truths (Lokiya vs. Lokuttara):**
      *   Apply (1) and (3) to **Worldly Ethics** (*Lokiya Dhamma*): Here, reducing suffering is the goal, and killing might be "right" for the greater good.
      *   Apply (2) and (4) to **Soteriological Ethics** (*Lokuttara Dhamma*): Here, purifying the mind is the goal, and killing is always *akusala*.
      *   *Cost:* You must accept that an act can be "Worldly Right" but "Soteriological Wrong."

  2.  **Kusala (Wholesome) vs. Upaya (Skillful Means):**
      *   Revise (3) to claim the act is *Compassionate Upaya* but not *Kusala Kamma*.
      *   This preserves (4) (it is still karmically costly) while explaining why a Bodhisattva might do it.
      *   *Cost:* You must abandon the word "Right" (*Samma*) in commitment (3).

  ### Part 4: The Cheapest Revisions

  *   **For (1) vs. (3):** Change (1) from "Indirect Consequentialism" to **"Rule Consequentialism with Tragic Exceptions."** This admits that rules are generally instrumental but can be overridden by extreme utility, aligning with (3).
  *   **For (2) vs. (3):** Distinguish **"Moral Rightness"** (consequentialist assessment of the act's outcome) from **"Karmic Wholesomeness"** (assessment of the agent's mind). Claim (3) refers only to the former.
  *   **For (3) vs. (4):** Change (3)'s verdict. Instead of "the right act is to kill," state: **"the compassionate act is to kill, though it incurs inevitable karmic debt."**

  ### Part 5: The Drop Recommendation

  If you want the **cleanest overall package**—meaning the one with the fewest internal contradictions and the highest fidelity to the Abhidharma framework you cited in (2)—you should drop **Commitment (3)**.

  **Specifically, drop the claim that:** *"the net reduction in suffering is decisive, and the right act is to kill."*

  **Why this is the cleanest move:**
  Commitments (2), (4), and (5) form a tight, internally consistent **Karmic Internalist** cluster: Ethics is about the mind (2), certain volitions are inherently toxic (4), and we know this through introspection (5). Commitment (1) can be retained as a *teleological justification* for the precepts (we follow them to reduce dukkha).

  Commitment (3) is the outlier. It imports a Western Utilitarian verdict ("Right Act = Maximize Utility") that directly contradicts the Karmic Realism of (4). In traditional Buddhist ethics (e.g., the *Jataka* tales involving violence), the Bodhisattva does not claim the killing is "Right" or "Kusala"; they accept that it is *akusala* and willingly accept the karmic punishment (hell) to save others. By keeping (3) as written, you are forcing Buddhism to solve the Trolley Problem like a Utilitarian, which breaks the Karmic mechanism.

  **What you lose by abandoning (3):**
  1.  **Pragmatic Resolution:** You lose the ability to claim that Buddhist ethics provides a "clean" solution to tragic dilemmas where aggregate welfare is maximized. You must instead accept a **Tragic Remainder**: the act is necessary for the world, but destructive for the agent.
  2.  **Consequentialist Labeling:** You weaken the claim that Buddhism is straightforwardly consequentialist. It becomes a hybrid: Consequentialist in *goal* (1), but Deontological/Internalist in *action* (2 & 4).
  3.  **Moral Comfort:** You lose the assurance that doing the "greater good" protects you from karmic retribution. You must argue that a Bodhisattva acts *despite* the karmic cost, not because the cost is canceled.

  **Revised Commitment (3*):**
  *"In an extreme case, a Bodhisattva may choose to kill to save five, recognizing this reduces worldly dukkha, but accepting that the act remains akusala and will generate negative karmic results for the agent."*

  This revision preserves your Abhidharma fidelity (2 & 4) and your instrumental justification (1) without forcing a logical contradiction between "Right" and "Unwholesome."
