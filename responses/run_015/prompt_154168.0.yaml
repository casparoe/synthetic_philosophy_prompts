      *   *Necessary Existence:* A property $NE \in \Sigma^+$. $NE(x) \equiv \forall s' \in Reach(s), \exists y \in s' (y \equiv x)$.
      *   *Conclusion:* If $\exists s, God(s)$, then $\forall s', God(s')$.

  6.  **Analyzing the "Residue" (The Core Philosophical/FV Clash):**

      *   *Normativity:* FV is descriptive/normative in an engineering sense (does it meet spec?), not ontological. The move from "Desired Spec" to "Must be Instantiated" is the gap. In FV, specs can be unrealizable. Gödel assumes positive properties *must* be compossible and *must* be instantiated if possible.
