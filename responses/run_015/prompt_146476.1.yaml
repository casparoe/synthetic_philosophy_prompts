answer: |-
  A modern art museum filed two insurance claims after a shelving unit collapsed on a prized exhibit: one for "The Statue" (a sculpted figure) and one for "Lump" (the specific mass of clay constituting it).

  The insurance adjuster rejected the second claim immediately. "I can't pay for the clay," he told the curator. "Your policy covers physical objects, and the clay *is* the statue. They're the same object. You can't double-dip on identity."

  The curator adjusted her glasses. "If they were strictly identical, they would share all properties by Leibniz's Law. But the Lump has the modal property of 'surviving being melted,' whereas the Statue does not. Therefore, they are coincident, not identical."

  "Fine," said the adjuster, "but the Lump wasn't damaged. It's still in the box. So I'm still not paying."

  "Then you're admitting they are distinct," the curator said, sliding the first claim form back across the desk. "Because if they are identical, and the Lump is currently intact in the box, then the Statue is currently intact in the box. If the Statue is intact, you owe me nothing on the first claim either."

  The adjuster opened his mouth, then closed it.

  "So," the curator continued, "you need to decide: are they identical, in which case nothing broke? Or are they distinct, in which case you owe me for the Lump? You can't invoke identity to limit your liability while invoking distinctness to assess the damage. You can't have your constitution and eat it too."
