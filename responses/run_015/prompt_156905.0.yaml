answer: |-
  ### Exam Question: Philosophy of Mind and Moral Psychology

  **Time Allowed:** 45 Minutes
  **Word Limit:** 500–600 Words

  **Question:**

  Consider the following two vignettes:

  **(i) The Harm Case:** The vice-president of a company tells the chairman of the board, "We are thinking of starting a new program. It will help us increase profits, but it will also harm the environment." The chairman answers, "I don't care at all about harming the environment. I just want to make as much profit as I can. Go ahead and start the new program." They start the new program. The environment is harmed.

  **(ii) The Help Case:** The vice-president of a company tells the chairman of the board, "We are thinking of starting a new program. It will help us increase profits, but it will also help the environment." The chairman answers, "I don't care at all about helping the environment. I just want to make as much profit as I can. Go ahead and start the new program." They start the new program. The environment is helped.

  In standard experimental settings, respondents overwhelmingly judge the chairman to have brought about the harm *intentionally*, but deny he brought about the help *intentionally*, despite the structural symmetry of the cases.

  Now consider a modified institutional case:

  **(iii) The Algorithmic Case:** A corporation deploys a predictive optimization algorithm to maximize profit. Through purely statistical weight updates, the algorithm reliably produces a harmful (or separately, helpful) environmental side-effect. The corporation's board forecasts this outcome but builds no representational state corresponding to it, and the algorithm itself lacks beliefs or desires.

  Evaluate whether the Knobe asymmetry described above would persist, diminish, or disappear in the Algorithmic Case. What does your prediction imply for competing explanations of the effect: specifically, the **Normative Account** (that attributions of intentionality are partly governed by evaluative considerations such as blameworthiness) versus the **Mental-State Account** (that they track the causal role of beliefs and desires)?

  ***

  ### Model Answer

  The Knobe effect reveals a striking asymmetry in folk psychology: side-effects are judged intentional when harmful but unintentional when helpful, despite identical mental states regarding the side-effect. In the standard Chairman vignettes, the agent's indifference suggests a lack of desire for the outcome, yet blame for harm triggers an attribution of intentionality. This suggests that moral evaluation infiltrates metaphysical judgments about action.

  In the Algorithmic Case, the structural conditions change significantly. Here, there is no singular agent possessing a belief-desire psychology regarding the side-effect. The board forecasts the outcome but forms no representational state aiming at it, and the algorithm operates via statistical weights rather than propositional attitudes. If the Mental-State Account is correct, intentionality requires specific causal roles for beliefs and desires. Since the algorithm lacks these states entirely, and the board explicitly lacks representational states regarding the side-effect, the Mental-State Account predicts that attributions of intentionality should vanish in both the harmful and helpful variants. Consequently, the asymmetry should disappear because the necessary precondition for intentional action (a mind with specific attitudes) is absent.

  However, if the Normative Account is correct, the asymmetry should persist. This view argues that intentionality attributions are not purely descriptive but are tools for holding agents accountable. If the outcome is harmful, observers seek a target for blame. Even in the absence of traditional beliefs or desires, the corporation functions as a moral agent capable of bearing responsibility. Therefore, respondents would likely still judge the harmful side-effect as intentional to facilitate blame, while viewing the helpful side-effect as mere fortune.

  Empirically, it is most plausible that the asymmetry would diminish but not vanish. The lack of a clear human mind weakens the intuition of agency, reducing overall intentionality ratings. However, the moral valence of the outcome would still skew judgments. This pattern supports a hybrid view. Pure Mental-State accounts fail because they cannot explain why moral valence shifts judgments when mental states remain constant. Pure Normative accounts fail because they cannot explain why the removal of mental states (in the algorithmic case) reduces intentionality attributions overall compared to the human case.

  Therefore, the Algorithmic Case demonstrates that while moral considerations drive the asymmetry, they operate within constraints set by our concept of agency. We require some threshold of causal control to assign intentionality, but once that threshold is met, normative considerations determine whether that intentionality is affirmed. The persistence of any asymmetry in the algorithmic case undermines the Mental-State Account's claim that intentionality is solely a matter of cognitive architecture. Conversely, the diminution of the effect supports the intuition that mental states matter. Thus, a complete theory of intentional action must integrate cognitive constraints with normative pressures, acknowledging that folk psychology serves both descriptive and prescriptive functions.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. Identification of the Standard Asymmetry (5 Marks)**
  *   **Must Hit:** Explicitly state that in the standard cases, harm is judged intentional while help is not, despite identical attitudes (indifference).
  *   **Failure Mode:** Treating the vignettes as symmetric in judgment or claiming the chairman intended the help in vignette (ii).

  **2. Characterization of the Mental-State Account (5 Marks)**
  *   **Must Hit:** Define this view as requiring specific causal roles for beliefs and desires (propositional attitudes) to ground intentionality.
  *   **Failure Mode:** Conflating this with simple causality or claiming it ignores moral factors entirely without referencing mental states.

  **3. Characterization of the Normative Account (5 Marks)**
  *   **Must Hit:** Define this view as grounding intentionality in evaluative considerations (blame/praise) rather than purely cognitive architecture.
  *   **Failure Mode:** Reducing this to "simple moral blame" without linking it to the *attribution of intentionality* itself.

  **4. Application to the Algorithmic Case (5 Marks)**
  *   **Must Hit:** Analyze how the lack of representational states/beliefs in the algorithm challenges the Mental-State Account specifically (predicting disappearance of intentionality).
  *   **Failure Mode:** Dismissing the case as irrelevant because "algorithms have no minds" without explaining why that undermines the Mental-State explanation specifically.

  **5. Theoretical Conclusion/Comparison (5 Marks)**
  *   **Must Hit:** Draw a conclusion about which theory is supported based on the prediction (e.g., persistence supports Normative; disappearance supports Mental-State; partial persistence supports Hybrid).
  *   **Failure Mode:** Restating the vignettes or offering a conclusion that does not follow from the analysis of the algorithmic case.

  **Grading Distinctions:**
  *   **A Grade (21–25 Marks):** All five moves present with precise conceptual distinctions. The student navigates the nuance of the algorithmic case (e.g., acknowledging the hybrid possibility) and clearly links the prediction to the theoretical stakes.
  *   **B Grade (15–20 Marks):** Solid grasp of the standard vignettes and one explanation (Normative or Mental-State), but misses the institutional-application argument or fails to comparatively evaluate the two theoretical accounts in light of the algorithmic case.
