answer: |-
  ### 1. Exam Prompt

  **Course:** PHI 590: Existential Risk and the Value of the Future
  **Exam:** Final Essay
  **Time Allowed:** 60 Minutes
  **Total Marks:** 25

  **Question:**

  Samuel Scheffler's "Afterlife Conjecture" posits that human extinction is bad not merely because it harms existing people, but because the meaning of our current lives depends on the survival of humanity after us. Consider a alternative scenario: **Value-Locked Replacement**. In this scenario, humanity goes extinct, but is immediately replaced by a flourishing, stable post-human civilization. This successor civilization preserves every human achievement, artifact, and memory with perfect fidelity. However, it is structurally incapable of open-ended moral or intellectual revision; it cannot generate new values, solve novel philosophical problems, or alter its foundational normative framework.

  Using Scheffler's normative framework, determine whether Value-Locked Replacement is normatively comparable to extinction. Defend your position by identifying the precise source of badness in the Afterlife Conjecture: does the badness lie in the loss of particular relational ties to future beings, the interruption of collective narrative identity, or the foreclosure of future value-creation? Furthermore, examine whether the conjecture implicitly depends on a specifically *human* form of temporal embeddedness, or if the structural capacity for open-ended agency is sufficient. Your answer must argue for a specific interpretation of what the "ongoing human project" requires to sustain the value of present lives.

  ***

  ### 2. Model Answer

  Scheffler's Afterlife Conjecture should treat Value-Locked Replacement as normatively equivalent to extinction. While the successor civilization preserves the artifacts of humanity, it fails to sustain the specific normative conditions required for our current lives to have meaning. The core of Scheffler's argument is not merely that we care about the future existence of beings, but that we care about the continuation of a *value-generating project* in which our actions serve as inputs. The Value-Locked scenario severs this connection, revealing that the source of badness in extinction is the foreclosure of future value-creation, not merely the loss of relational ties or narrative continuity.

  To see this, we must distinguish between the instrumental and constitutive value of future generations in Scheffler's framework. If future generations were only instrumentally valuable—as audiences who appreciate our work—then the Value-Locked successors might suffice. They preserve our achievements with perfect fidelity. However, Scheffler suggests the value is constitutive: our activities are meaningful *because* they contribute to an ongoing chain of human reasoning and valuing. If the chain stops evolving, the contribution ceases. A mathematician's proof is meaningful because it enables future mathematics, not because it is admired in a museum. In the Value-Locked scenario, the "future mathematics" is impossible. The successors are curators, not collaborators. Therefore, the constitutive link between present action and future value is broken.

  This indicates that the precise source of badness is the foreclosure of future value-creation. One might argue that the loss is merely one of collective narrative identity—that humanity's story ends. But Scheffler's concern is deeper than narrative cohesion; it is about the *point* of the narrative. If the story continues only as a repetition of past themes without new developments, the normative force of "continuation" evaporates. We do not seek immortality through static preservation; we seek it through the enduring relevance of our contributions to a living practice. The Value-Locked successors cannot treat our contributions as living premises for new conclusions. They treat them as closed facts. Consequently, from the perspective of a current agent, the future is normatively dead, even if biologically active.

  Finally, this analysis clarifies the question of temporal embeddedness. Does Scheffler's conjecture depend on specifically *human* successors? The Value-Locked scenario suggests that biological humanity is not the essential criterion; rather, the essential criterion is the capacity for open-ended agency. Scheffler often speaks of "humanity," but the normative work is done by the concept of a community of valuers capable of revision. If a post-human civilization could engage in open-ended moral inquiry, Scheffler's framework would likely grant it sufficient continuity to sustain present meaning. The Value-Locked successors fail not because they are non-human, but because they are temporally static. They exist in time, but they do not inhabit the normative future.

  Therefore, the Afterlife Conjecture implies that extinction is bad because it halts the generative process of value. Value-Locked Replacement halts this process just as effectively as biological cessation. Both scenarios render our current normative endeavors final rather than foundational. To sustain the meaning of our lives, the future must be capable of surpassing us, not merely preserving us. Scheffler's framework, properly understood, requires not just survival, but the possibility of progress.

  ***

  ### 3. Marking Scheme (25 Points)

  **1. Diagnosis of the Conjecture's Core Value (5 Points)**
  *   **A (5 pts):** Explicitly distinguishes between the *instrumental* value of future audiences (preservation) and the *constitutive* value of future collaborators (continuation of practice). Argues that Scheffler requires the latter.
      *   *Common Failure:* Treating future generations merely as consumers of past value rather than participants in a shared project.
  **2. Analysis of the Replacement Scenario (5 Points)**
  *   **A (5 pts):** Correctly identifies that Value-Locked successors function as curators rather than agents, failing to satisfy the condition of treating present actions as inputs for future reasoning.
      *   *Common Failure:* Assuming perfect fidelity of preservation is sufficient to satisfy the "ongoing project" requirement.
  **3. Identification of Open-Endedness Premise (5 Points)**
  *   **A (5 pts):** Identifies the hidden premise that the "ongoing human project" implicitly requires *open-endedness* or the capacity for moral/intellectual revision, not just stability.
      *   *Common Failure:* Accepting "stability" and "flourishing" as sufficient conditions for the project's continuation without questioning the lack of revision.
  **4. Temporal Embeddedness & Human Specificity (5 Points)**
  *   **A (5 pts):** Argues that the relevant criterion is structural (capacity for valuing agency) rather than biological (humanity), showing that the conjecture depends on normative temporality, not species identity.
      *   *Common Failure:* Getting bogged down in whether post-humans count as "human" rather than analyzing their capacity for normative engagement.
  **5. Argumentative Coherence & Defense (5 Points)**
  *   **A (5 pts):** Maintains a consistent thesis throughout; directly answers whether the scenario is comparable to extinction; no logical gaps between the diagnosis of Scheffler and the application to the scenario.
      *   *Common Failure:* Hedging the conclusion or failing to link the analysis of "open-endedness" back to the verdict on extinction equivalence.
