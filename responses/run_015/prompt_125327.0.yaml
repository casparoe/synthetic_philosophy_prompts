answer: |-
  The tension you identify within Bentham's framework arises from the friction between his atomistic conception of individual pleasure and the inherently social constitution of what counts as an "injury" to the self. When Bentham argues that self-regarding injuries warrant moral or pedagogical correction based on a long-term reduction of pleasure, he is attempting to internalize a normative standard within the utility calculus itself. However, this move requires an external arbiter to determine which future pleasures outweigh present ones, effectively positing an objective hierarchy of goods that contradicts the subjective sovereignty central to hedonism. If the individual is the best judge of their own pleasure, as strict utilitarianism suggests, then paternalistic correction is unjustified unless the individual is systematically irrational; yet if the legislator or moralist determines the rational calculation, the definition of "injury" becomes susceptible to the very social prejudices Bentham seeks to marginalize.

  This suggests that the category of self-regarding injury is not merely a residual container for social disgust, but rather a structural necessity for a system that cannot fully disentangle individual well-being from social validation. Bentham's attempt to reduce these injuries to quantitative losses of pleasure overlooks the fact that the meaning of sexual acts—and the pain associated with them—is derived from intersubjective recognition and institutional context. By treating the self as a sealed vessel of sensation, utilitarianism struggles to account for harms that are constitutive rather than consequential, such as the degradation of social standing or the internalization of stigma, which exist only within a normative framework. Consequently, the "correction" of self-regarding acts inevitably reintroduces the social norms that define the acts as injurious in the first place, undermining the claim that the calculus is purely forward-looking and neutral.

  This dynamic anticipates later critiques in feminist philosophy and institutional theory which argue that the private sphere is not hermetically sealed from public norms, and that preferences are endogenous to the social structures they inhabit. Bentham's inconsistency is therefore not a simple logical error but a revelation of the limits of aggregative calculus when faced with practices whose value is constituted through relational and institutional meaning. The vocabulary of correction carries normative weight because the "self" being corrected is already a social product, meaning that any calculation of its future pleasure is inevitably contaminated by the prevailing moral ecology.

  Summary: Bentham's distinction exposes a structural limit in utilitarianism where the attempt to isolate individual utility from social norms fails, revealing that the calculus of pleasure inevitably relies on intersubjective valuations that reintroduce the very prejudices the system seeks to eliminate.
