answer: |-
  Pull up a chair. It's good you're feeling this anxiety. If you weren't worried about whether you're shuffling deck chairs, I'd worry you weren't paying attention. Philosophy of science eats its own tail if you let it. But Lakatos gives us a scalpel, not just a blunt instrument. Let's cut into this.

  First, the brain-dump. You need these distinctions sharp in your head before we apply them.

  **Lakatosian Key Distinctions**
  *   **Hard Core:** The fundamental metaphysical assumptions of a research programme that are treated as irrefutable by methodological decision of its proponents (e.g., "Earth is the center," "Gravity is universal").
  *   **Protective Belt:** The auxiliary hypotheses, initial conditions, and observational theories surrounding the core. These take the hits of falsification. We adjust these to protect the core.
  *   **Progressive Problemshift:** When adjustments to the protective belt lead to both theoretical growth (new concepts) and empirical growth (novel facts predicted).
  *   **Degenerating Problemshift:** When adjustments to the belt are made only to accommodate known facts (post-hoc), without leading to new predictions. The programme is merely saving appearances.
  *   **Novel Prediction vs. Post-hoc Accommodation:** A novel prediction is a fact that was not used in constructing the theory (use novelty) or was unknown at the time of construction (temporal novelty). Accommodation is tweaking the belt to fit data we already have.

  **Brainstorming: What is "Novel" in Climate Science?**
  Before we judge the case, we have to ask what counts as a "fact" here. In particle physics, a novel fact is a blip on a detector you didn't expect. In climate modeling, it's messier.
  *   *Temporal Novelty:* Predicting the global mean surface temperature in 2050 based on 2020 data. That's clear.
  *   *Use Novelty:* Predicting a specific structural feature of the model ensemble (like an outlier center) that wasn't used to tune the "institutional framing variables."
  *   *The Trap:* Climate models are often "hindcasted"—tuned to match historical data. If you adjust your social ontology to explain CMIP6 variance (which is already known), that is accommodation, not prediction. To be novel, the social ontology needs to tell us something about CMIP7 *before* CMIP7 runs, or predict a sociological feature of a modeling center we haven't interviewed yet.

  **Step-by-Step Application**

  Now, let's walk through Dr. Chen's likely reasoning on the "social ontology of climate modeling" programme.

  1.  **Identify the Shift:** The programme noticed an anomaly: CMIP6 ensemble members disagree (some run hot, some cold). The hard core says this isn't noise; it's institutional framing.
  2.  **Analyze the Belt Adjustment:** To save this core, they added "institutional framing variables."
  3.  **Check for Empirical Progress:** Did these variables predict anything new? The prompt says: "They haven't used these variables to predict which new centers will be outliers in CMIP7." This is critical. They are explaining CMIP6 variance after the fact.
  4.  **Check for Theoretical Progress:** They claim the framework lets them "systematically interview modelers." This is new methodology, but is it empirical progress regarding the *hard core* claim?
  5.  **Compare to Precedents:**
      *   Like **Ptolemy**: They are adding epicycles (framing variables) to save the appearances (CMIP6 variance) without predicting new planetary positions (CMIP7 outliers).
      *   Like **Memetics**: They invented a concept ("framing variables" akin to "memeplexes") to explain a failure (unexplained variance) after the fact.
      *   Unlike **Newton/Predictive Processing**: There is no "Neptune moment." No unknown entity or data point was successfully anticipated by the theory.

  **Dr. Chen's Verdict**
  Dr. Chen is going to call this **degenerating**.

  She has consistently punished post-hoc accommodation (Ptolemy, Memetics) and rewarded novel empirical prediction (Newton, Predictive Processing). The climate programme is explaining known data with new auxiliary hypotheses. The fact that it opens up interview opportunities is methodological fertility, but for a strict Lakatosian, that doesn't count as empirical progress unless those interviews lead to successful predictions of the phenomenon in question (model divergence).

  **The Rule She Is Running**
  Dr. Chen is running a **Strict Novel Empirical Prediction** rule.

  She is not accepting the **Protective-Belt-Fertility** rule. If she were, she might accept the climate programme as progressive (or at least potentially progressive) because the adjustment opened a new research line (systematic interviews). The fertility rule allows for theoretical progress to count even if empirical predictions lag, provided the heuristic is generating new puzzles and tools. Chen's rejection of Memetics suggests she doesn't buy that; explaining cooperation via "memeplexes" was theoretically fertile but empirically degenerating. She wants the money shot: a novel fact.

  **The Separating Case**
  To confirm whether she is Strict Empirical or Belt-Fertility, you need a case where a programme is theoretically fertile but lacks novel empirical predictions.

  The case is **String Theory (current status)**.

  *   **Why it separates them:** String theory has immense protective-belt fertility. It generates new mathematics, connects disparate fields, and opens countless research lines (theoretical progress). However, it has yet to make a genuinely novel empirical prediction that distinguishes it from the Standard Model (no empirical progress).
  *   **The Test:** If Dr. Chen calls String Theory **progressive**, she is secretly running the **Protective-Belt-Fertility** rule (theoretical growth counts). If she calls it **degenerating** (or pre-scientific), she is sticking to the **Strict Novel Empirical Prediction** rule. Given her verdict on the climate case, expect her to call String Theory degenerating until it predicts a particle we haven't seen yet.

  **Final Word**
  Don't let this depress you. Knowing you're in a degenerating phase isn't a death sentence; it's a map. It tells you where the work needs to be done. If you want to save the social ontology programme, stop interviewing modelers about why they *did* what they did (accommodation) and start predicting what they *will* do before they do it (prediction). That's how you turn degenerating shifts into progressive ones. Now, go read the secondary literature on Lakatos's distinction between heuristic and empirical progress. We'll talk next week.
