answer: |-
  okay so here's the breakdown for what a solid theory of distributed consciousness actually needs to carry. if you're building a dataset, this is the gold standard stuff you want to see in a response.

  **1. the cases it has to handle**
  you can't just talk about humans and chimps. an adequate account needs to stake a claim on:
  *   **cephalopods:** octopuses have distributed neural nets (arms think kinda independently). theory must explain unified vs fragmented experience.
  *   **insects:** bees navigate and learn, but are they tiny zombies or feeling agents?
  *   **fish:** nociception is proven, but is there affect?
  *   **edge cases:** plants (probably no, but why exactly?) and AI (substrate independence vs biological requirement).
  *   *reasoning:* if the theory only works for neocortex holders, it's just biology chauvinism, not a theory of consciousness.

  **2. distinctions it cant collapse**
  this is where most theories fail. they smear everything together.
  *   **nociception vs. suffering:** detecting damage (reflex) is not the same as *minding* the damage (negative qualia). a theory must explain the gap.
  *   **minimal awareness vs. high-level sentience:** being awake to stimuli isn't the same as having a self-model or rich emotional landscape.
  *   *reasoning:* collapsing these leads to over-ascription (everything suffers) or under-ascription (animals are robots).

  **3. biological constraints (non-negotiable)**
  *   **evolutionary continuity:** consciousness didn't pop out of nowhere. it likely scales with complexity.
  *   **no sharp neural cutoff:** there's no magic neuron count where lights turn on.
  *   **adaptive utility:** consciousness should do something (integration, planning) otherwise evolution wouldn't keep it.
  *   *note:* the first two are hard constraints. the third is strong but some epiphenomenalists fight it.

  **4. the impossible pair (jointly unsatisfiable)**
  here's the big tension: **strict evolutionary continuity + a binary consciousness threshold.**
  you can't have a smooth gradient of biological complexity (which we know exists) and also insist consciousness is a binary on/off switch (you either have it or you don't). if biology is analog, consciousness prob is too. insisting on a binary threshold violates the continuity constraint. theories have to pick one, usually by redefining consciousness as graded.

  **5. the theory killer**
  the single requirement that does the most damage to both **panpsychism** and **mammal-only views** is: **Non-Arbitrary Evolutionary Emergence.**
  *   **vs. mammal-only:** it fails because it posits a sharp cutoff where none exists biologically (why mammals and not birds/octos?). it violates continuity.
  *   **vs. panpsychism:** it fails because if consciousness is fundamental to all matter, you can't explain why complex brains *evolved* to support it. why build a human brain if rocks are already concious? it makes the biology redundant.

  **6. quick scorecard**
  *   **Mammal-only:** fails on continuity (0/5). handles human cases well but collapses on comparative neuroanatomy.
  *   **Panpsychism:** handles continuity (5/5) but fails on evolutionary utility (2/5). too broad to be useful.

  basically, any theory that wants to be taken seriously has to navigate the gradient without losing the distinction between reflex and feeling. anything else is just philosophy fluff. hope this helps with the dataset build.
