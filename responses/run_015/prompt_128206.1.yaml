answer: |-
  ### Desiderata for a Non-Circular Born Rule Derivation in Unitary Quantum Mechanics

  The following table outlines the standards a derivation must meet to claim it solves the probability problem rather than relocating it. The requirements are divided into Conceptual (Qualitative), Formal (Quantitative), and Physical/Epistemic (Robustness & Evidence) categories.

  | ID | Requirement | Type | Case / Consideration |
  | :--- | :--- | :--- | :--- |
  | **Q1** | **Qualitative Intelligibility** | Non-negotiable | **The Meaning of Probability:** In a ontology where all outcomes occur, "probability" cannot mean "chance of occurrence." The derivation must define what uncertainty or care amounts to for an agent facing self-locating uncertainty or branching. Without this, the quantitative rule lacks a semantic anchor. |
  | **Q2** | **Quantitative Uniqueness** | Non-negotiable | **Why Squared Amplitude?** The derivation must uniquely select the squared-amplitude measure ($|\psi|^2$) over alternatives (e.g., fourth-power, branch counting, or uniform measures). It must demonstrate that any other weighting leads to inconsistency or irrationality within the theory's own resources. |
  | **Q3** | **Axiomatic Non-Circularity** | Non-negotiable | **No Smuggled Probabilities:** If using decision theory or rationality axioms, the axioms themselves must not presuppose probabilistic notions (e.g., "preferences over lotteries" where lotteries already imply weights). The normative force must come from non-probabilistic rationality constraints applied to the branching structure. |
  | **P1** | **Robustness to Emergence** | Non-negotiable | **User Worry 1 (Approximation):** Decoherence yields approximate, not exact, orthogonality. The derivation must assign weights to emergent, fuzzy branches and account for the contribution of non-zero interference tails. It cannot assume a discrete, definite number of branches exists at any time. |
  | **P2** | **Decomposition Invariance** | Non-negotiable | **User Worry 2 (Coarse-Graining):** Weights must be invariant under the refinement or merging of the branch decomposition. If a branch is mathematically split into two sub-branches with no physical distinction, the total weight assigned to that outcome must not change. The measure must depend on the physical state, not the basis choice. |
  | **P3** | **Empirical Coherence** | Non-negotiable | **User Worry 3 (Maverick Branches):** The theory must explain why our observed statistics confirm the theory, despite the existence of branches where statistics wildly deviate from the Born rule. It cannot solve this by presupposing a "typicality measure" that is already defined by squared amplitudes. |
  | **P4** | **Continuity Compatibility** | Preference | **Infinite Dimensions:** The derivation should not rely essentially on finite-dimensional Hilbert spaces or discrete outcome sets. While discrete cases are useful heuristics, a fundamental derivation should hold for continuous spectra and field theories. |

  ***

  ### Critical Analysis of Constraints

  **Suspected Incompatibility:**
  There is a significant tension between **P1 (Robustness to Emergence)** and **Q2 (Quantitative Uniqueness)**.
  *   **The Conflict:** Q2 typically demands an exact mathematical derivation of a unique weighting function. However, P1 acknowledges that branches are only approximately defined via decoherence, with residual tails that never strictly vanish. If the ontology is fuzzy and approximate, it is suspected that an *exact* uniqueness proof is mathematically impossible without idealizing the physics away. A derivation that is exact may fail P1; a derivation that respects P1 may only yield the Born rule as an approximation, failing the strict uniqueness demanded by Q2.

  **The Most Exclusionary Requirement:**
  **P3 (Empirical Coherence)** does the most work in excluding candidate derivations.
  *   **Reasoning:** Many derivations successfully show that *if* an agent uses the Born rule, they are rational (Q1/Q2/Q3). However, very few explain why an agent should expect to *find themselves* in a branch where the Born rule holds, without simply asserting that branches with low squared amplitude "don't count" or are "atypical." To explain confirmation without presupposing the measure used to define typicality is the hardest hurdle. Most programs implicitly assume that high-weight branches are the "real" ones for the purpose of prediction, which begs the question against the maverick branches.

  **Finite/Discrete Limitations:**
  **P2 (Decomposition Invariance)** is the requirement most often satisfied only in finite-dimensional, discrete-outcome cases.
  *   **Reasoning:** Many symmetry and decision-theoretic arguments rely on counting discrete branches or permuting discrete outcome labels. Extending these invariance arguments to continuous variables requires measure-theoretic machinery that often reintroduces the Born rule via the Lebesgue measure or Hilbert space norm assumptions, risking circularity regarding P3.

  ***

  ### Scoring of Derivation Strategies

  **Decision-Theoretic:** These strategies score highly on **Q1** and **Q3** by grounding probability in rational action rather than objective chance, effectively dissolving the qualitative worry. However, they struggle with **P1** and **P3**. They typically assume a clean branching structure (violating P1) and often rely on axioms that implicitly favor high-amplitude branches to ensure diachronic consistency, which risks circularity regarding **P3** (explaining why we are in the high-weight branch).

  **Symmetry / Invariance:** These approaches excel at **P2** and **Q2**, showing that the squared amplitude is the only quantity invariant under relevant unitary transformations. Their weakness lies in **Q1** and **P3**. Symmetry alone does not explain why an agent should *care* about the invariant measure (the qualitative gap), nor does it inherently suppress maverick branches without an additional postulate linking symmetry to subjective expectation.

  **Self-Locating Uncertainty:** This framework addresses **Q1** directly by treating branching as indexical uncertainty. However, it frequently fails **P3**. To derive the Born rule, these accounts often introduce a "Indifference Principle" over branches, which must then be weighted by amplitude to match experiment. Justifying why indifference should be weighted by amplitude rather than branch count often reintroduces the quantitative problem without a non-circular solution.

  **Structural (Gleason-style):** These theorems are mathematically robust regarding **Q2** and **P4**, proving that the Born rule is the unique measure on Hilbert space subspaces. They fail catastrophically on **Q1** and **P1**. They assume the Hilbert space structure as given (ignoring the emergent nature of branches in **P1**) and provide a measure without an interpretation of what that measure *means* for an observer, leaving the qualitative probability problem entirely untouched.
