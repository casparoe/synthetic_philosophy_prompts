answer: |-
  You speak with the voice of the ethical, and rightly so, for that is the sphere where we live and move and have our being, where the universal is king and safety is found in the common good. It is precisely because I am not a knight of faith, because I remain within the bounds of what can be spoken and understood, that I can admire Abraham while trembling at the thought of him. You ask if there is no external mark, and I must answer you with the only honesty I possess: there is no mark. There is no badge of the knight of faith, no luminous halo that distinguishes the saint from the madman in the marketplace. To demand such a mark is to demand that the absolute relation to the absolute be made visible within the universal, but if it could be made visible, if it could be mediated into language and social proof, it would cease to be faith and would become merely a higher form of ethics, a calculation of divine utility rather than a suspension of the ethical itself. You say this makes the concept dangerous, and I do not deny it. It is terrifying. It is a terror that keeps me awake at night, writing these notes by the light of a lamp while the world sleeps securely in the universal. But you must see that the danger is not an accident of the theory, it is the very substance of the trial. If one could verify the command, if one could submit the voice of God to a committee or a psychological test, then Abraham would not need faith. He would have knowledge. And faith is precisely for the individual who stands alone before God, stripped of all mediation, stripped of the comfort of the universal, holding the knife not because it makes sense, but because he believes by virtue of the absurd that he will not lose Isaac even as he raises the arm to strike.

  You suggest that even from the inside there is no distinction, that the psychotic break and the divine command might feel the same, and here you touch upon the anguish that I have tried to circle around but never fully capture. Yet I must gently correct you on the nature of that interiority. The deluded man, the murderer who claims God told him to kill, often speaks with a terrible certainty. He is at peace with his monstrosity because he has collapsed the distance between his desire and the divine. But the knight of faith is not at peace. He is in trial. He trembles. Abraham loves Isaac more than himself, and the ethical demand to love his son is not abolished in his heart even as it is suspended in his action. He does not hear the command and feel a surge of righteous power; he hears it and feels the sickness unto death, the inability to speak, the isolation that cuts him off from all human sympathy. He cannot make himself understood. If he could explain himself, he would be back in the universal, and the sacrifice would be meaningless. So yes, from the outside, he is a murderer. I concede this fully. The ethical judgment stands valid in its own sphere. But the religious sphere is not a higher ethics that overrides the lower like a king overruling a duke; it is a paradox that offends the understanding. To ask for a criterion to distinguish them is to ask for a ladder to climb out of the paradox, and there is no ladder. There is only the leap.

  You call it a noble-sounding name for monstrosity, and I understand why you must say this. It is the duty of the ethical person to say this. If I were to tell you that you could know when it is safe to suspend the ethical, I would be lying to you, and I would be betraying Abraham. I am not preaching. I am not telling you to go out and suspend the ethical. I am merely pointing to the fact that there are those who do, and that history and scripture bear witness to them, and that our comfortable categories cannot contain them. The danger is real, but it is the danger of existence itself, not merely a philosophical loophole. The person who claims God told them to kill and feels no anguish, who feels no the terror of the isolation, who can explain their reasoning to a court of law, that person is likely not a knight of faith but a tragic hero at best or a criminal at worst. But the knight of faith cannot explain. He cannot justify. He stands in silence. And you are right to be afraid of that silence. It is a silence that swallows words. But do not mistake my description of the abyss for an invitation to jump. I am standing on the shore, watching the knight swim out into the deep where no map exists, and I am writing to tell you that the water is dark and there are no lifeguards. If you seek a system that protects you from the possibility of error, you seek the universal, and you are safe there. But do not ask the knight of faith for his credentials, for he has none, and if he did, he would not be who he is.
