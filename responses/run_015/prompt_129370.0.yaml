prompt: |-
  I am a novelist, and in my forthcoming book I defend a thesis I call Restricted Ontological Identification—ROI: when two putative concrete entities are permanently and in principle informationally inaccessible to one another across every possible epistemic frame, ontology should identify them, and any framework that distinguishes them is committing to empty structure. I apply this to literary ontology, arguing that indistinguishable possible worlds should not be reified in a fiction’s metaphysical backdrop. Next week I present ROI to a metaphysics and philosophy-of-science seminar whose members are mainly analytic metaphysicians skeptical of modal realism yet suspicious of parsimony arguments that conflate epistemology with ontology; the audience also includes two logicians who will press for formal rigor and one philosopher of fiction convinced that literary practice requires a richer modal space than ROI permits. Draft my Q&A prep sheet: list the six or seven objections this specific audience will actually raise, ordered by how damaging each would be if left unanswered, phrased in their own disciplinary vocabulary rather than in popular or forum jargon. For each objection, provide a concise reply I can deliver in roughly two minutes, together with an explicit note on where that reply is weakest. Include the objection I am most dreading—likely the charge that ROI collapses modal distinctions by rendering necessary and contingent properties epistemically indistinguishable, thereby undermining modal discourse altogether—and flag the softest point in my defense against it. In your response, state how confident you are in each reply, and single out the one point about which you are least certain.
