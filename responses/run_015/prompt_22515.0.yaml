prompt: |-
  I'm in a social ontology PhD program, and two of my seminar mates got into it after we read Lewis's Convention. Their exchange went: (1) Ana said that Lewis's 'non-accidental' condition is basically satisfied by evolutionary stability: if a regularity in a coordination game is maintained by cultural selection or repeated reinforcement, then it isn't just a coincidence, so culturally evolved regularities can be Lewisian conventions. (2) Ben said no, Lewis's non-accidental condition isn't just causal non-accidentality; it's tied to the agents' common interest and mutual expectations. A population can have a stable regularity that is causally explained by selection, but if nobody expects it as the way things are done, it's not a convention. (3) Ana replied that expectations can be selected too: if agents who expect the stable regularity and conform when they expect it do better, then the expectation structure can evolve alongside the behavior. (4) Ben said that's circular: to say the regularity is stable because people expect it is already to assume the convention exists, and Lewis's account is supposed to explain what a convention is, not just to re-describe a stable population. (5) Ana said that's not circular, it's diachronic: selection can first produce a regularity, then produce expectations about it, and once the expectation loop is in place the regularity meets Lewis's conditions. I wasnt taking sides, but I keep thinking there's a difference between a norm being stable and a norm being the kind of thing Lewis means by a convention. Can you adjudicate this move by move? I want to know who's right about which specific point, not just who wins overall, and what, if anything, both of them are missing.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Context:** Social Ontology PhD program seminar.
      *   **Source Material:** David Lewis's *Convention* (1969).
      *   **The Dispute:** Ana vs. Ben on whether evolutionary stability satisfies Lewis's "non-accidental" condition for conventions.
      *   **The Exchange:** 5 specific moves (Ana 1, Ben 1, Ana 2, Ben 2, Ana 3).
      *   **Task:** Adjudicate move-by-move (who is right about specific points), determine the overall winner (if any), and identify what both are missing.
      *   **User's Intuition:** There's a difference between a norm being *stable* and a norm being a Lewisian *convention*.

  2.  **Deconstruct Lewis's Account of Convention:**
      *   *Core Definition:* A regularity $R$ in behavior among a population $P$ in a recurrent situation $S$ is a convention if and only if (roughly):
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ on the condition that others do (conditional preference/coordination equilibrium).
          4.  There is an alternative regularity $R'$ that could have solved the coordination problem instead.
          5.  The above facts are *common knowledge* (or at least mutual knowledge/belief) among the population.
      *   *The "Non-Accidental" Condition:* Lewis explicitly argues against conventions being mere coincidences. The regularity must be sustained by the system of expectations and preferences. It's not just that people *do* X, but that they do X *because* they expect others to do X and want to coordinate.
      *   *Intentionality/Reasoning:* Lewis's account is heavily rationalist and individualist. It relies on agents having reasons (beliefs and desires) that align. It is *not* primarily a functionalist or selectionist account, though he acknowledges precedents.

  3.  **Analyze the Exchange Move-by-Move:**

      *   **Move 1 (Ana):** Lewis's 'non-accidental' = evolutionary stability (cultural selection/reinforcement).
          *   *Critique:* This conflates *etiology* (how it started/stays) with *constitutive conditions* (what makes it a convention *now*). Lewis cares about the *reasons* agents have. Evolution can produce behavior without agent-level reasoning (e.g., bees). Lewis requires expectations.
          *   *Verdict:* Ana is weak here. She's redefining "non-accidental" in a functionalist way, whereas Lewis means "sustained by mutual expectations."

      *   **Move 2 (Ben):** Non-accidental isn't just causal; it's tied to common interest and mutual expectations. Stable regularity $\neq$ convention if no expectations.
          *   *Critique:* This aligns closely with Lewis. Lewis emphasizes the *system of expectations* as the sustaining cause. If a behavior is stable due to blind selection (like a biological trait) without agents expecting it, it's not a Lewisian convention.
          *   *Verdict:* Ben is strong here. He captures the intentional/psychological requirement of Lewis's account.

      *   **Move 3 (Ana):** Expectations can be selected too. Agents who expect/conform do better.
          *   *Critique:* This is the "Evolution of Norms" argument (e.g., Sugden, Young, Skyrms). It attempts to bridge the gap. It suggests expectations can emerge from selection pressures on behavior.
          *   *Verdict:* Ana is theoretically plausible *in general social science*, but is she faithful to Lewis? Lewis allows for precedent and salience to generate expectations, but he requires the expectations to be *present* and *effective*. Ana is arguing for the *genesis* of the expectations, not necessarily their current status as common knowledge. She's shifting the ground to *how* Lewisian conditions arise.

      *   **Move 4 (Ben):** That's circular. Saying regularity is stable *because* people expect it assumes the convention exists. Lewis explains *what* it is, not just re-describes a stable population.
          *   *Critique:* Ben is highlighting the distinction between *explanation* and *definition*. If Ana says "Selection made the expectation," Ben asks "When did it become a convention?" If it's only a convention *after* expectations form, then selection of behavior *alone* isn't enough. He's accusing her of conflating the *pre-conventional regularity* with the *convention*.
          *   *Verdict:* Ben is right about Lewis's project. Lewis is analyzing the *concept*, not necessarily the *historical genesis*. However, Ben might be too harsh on "circularity." It's not circular to say expectations evolve; it's just a different explanatory framework (evolutionary game theory vs. rationalist reconstruction). But regarding *Lewis's text*, Ben is closer.

      *   **Move 5 (Ana):** Not circular, it's diachronic. Selection $\rightarrow$ Regularity $\rightarrow$ Expectations $\rightarrow$ Convention.
          *   *Critique:* This is the "Bootstrapping" argument. It concedes Ben's point that expectations are needed *eventually*, but argues selection gets you there.
          *   *Verdict:* This is a valid *naturalistic* refinement of Lewis (like Brian Skyrms or H. Peyton Young). But does it save her original claim (Move 1)? Move 1 said stability *is* the non-accidental condition. Move 5 says stability *leads to* the condition. She has retreated.
          *   *Verdict:* Ana is right that it's not logically circular, but she has conceded that stability *alone* isn't enough (contradicting Move 1).

  4.  **Synthesize the "What They Are Missing" Section:**
      *   **Common Knowledge:** Both skirt around the heavy lifting of *Common Knowledge* (or Mutual Knowledge). Lewis requires agents to know that others know, etc. Evolutionary stability doesn't guarantee common knowledge, only correlated behavior/beliefs.
      *   **Arbitrariness:** Lewis requires an alternative $R'$. Evolutionary stability often leads to a *unique* optimum (monomorphism). If there's no alternative that *could* have worked, is it a convention or just a solution? (e.g., driving on the right vs. driving on the left is conventional; breathing is not).
      *   **Rationality vs. Causality:** Lewis is a rationalist (agents act for reasons). Ana is a naturalist/functionalist (systems act for outcomes). They are talking past each other on the *level of analysis*.
      *   **The User's Intuition:** The user is right. Stability $\neq$ Convention. A traffic pattern can be stable due to road layout (causal) without being a convention. A convention requires the *normative/expectational* layer.

  5.  **Drafting the Response:**
      *   *Tone:* Academic, precise, respectful of the PhD context.
      *   *Structure:*
          1.  Introduction (acknowledge the depth of the debate).
          2.  Move-by-Move Adjudication (Who wins the point and why, referencing Lewis).
          3.  Overall Assessment (Who is closer to Lewis vs. who is closer to modern social ontology).
          4.  What Both Are Missing (The crucial gaps: Common Knowledge, Arbitrariness, Rationalism vs. Naturalism).
          5.  Validation of User's Intuition.

      *   *Refining the Lewis Interpretation:* Need to be careful. Lewis *does* allow for precedents and salience which can be evolutionary-like. But the *definition* requires the expectation loop. Ana tries to make evolution *constitutive*; Ben insists evolution is at best *causal* of the constitutive elements.
      *   *Key Distinction:* *Constitutive* conditions vs. *Etiological* origins. Ana conflates them in Move 1. Ben keeps them separate.

      *   *Specific Check on Move 4 (Circularity):* Is Ana circular? "Regularity is stable because people expect it." If the expectation is *of the convention*, yes, it's circular. If the expectation is *of the behavior*, it's empirical. Ben is right that if the expectation is "they will follow the convention," she's presupposing the convention. If it's "they will drive on the right," she's describing a belief. Lewis requires the belief to be *about* the conformity. Ben's critique holds water regarding the *definition*.

      *   *Specific Check on Move 5 (Diachronic):* Ana shifts from "Stability *is* the condition" to "Stability *creates* the condition." This is a retreat. Ben wins the definitional battle; Ana wins the naturalistic plausibility battle.

      *   *What's Missing:* The "Arbitrariness" clause is huge. Evolution often selects the *only* fit solution. Lewis requires *alternative* equilibria. Also, the "Common Knowledge" requirement is the hardest hurdle for evolutionary accounts (how does selection generate common *knowledge* rather than just true *belief*?).

  6.  **Final Polish:** Ensure the distinction between *Lewis exegesis* (what did Lewis say?) and *Social Ontology Theory* (what is the best theory?) is clear. The prompt asks about Lewis's account specifically ("Lewis's non-accidental condition," "Lewisian conventions"). So fidelity to Lewis is the primary metric, with theoretical plausibility as secondary.

      *   *Self-Correction during drafting:* I need to make sure I don't just say "Ben is right because Lewis is old." I need to explain *why* Lewis's text supports Ben. Lewis explicitly distinguishes conventions from mere regularities caused by external constraints or biological instinct.
      *   *Also:* Acknowledge that Ana is channeling later scholars (Skyrms, Young) who *revise* Lewis. This validates her PhD-level insight while maintaining she's straying from Lewis's text.

  7.  **Final Output Structure:**
      *   Intro: Validate the user's intuition.
      *   Move-by-Move Breakdown.
      *   The Core Philosophical Stalemate (Constitution vs. Etiology).
      *   What Both Miss (Arbitrariness, Common Knowledge, Normativity).
      *   Conclusion.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a classic debate in social ontology, essentially replaying the tension between **rationalist reconstructions** (Lewis, Gilbert) and **naturalist/evolutionary accounts** (Skyrms, Young, Millikan). Since you are in a PhD program, I will adjudicate this based on fidelity to Lewis's text (*Convention*, 1969) while acknowledging where the debate moves into contemporary theory.

  Your intuition is correct: **There is a fundamental category error between a regularity being *stable* and a regularity being a *convention*.**

  Here is the move-by-move adjudication.

  ### Move 1 (Ana)
  **Claim:** Lewis's 'non-accidental' condition is satisfied by evolutionary stability (cultural selection/reinforcement).
  **Adjudication:** **Ben wins this point.**
  **Reasoning:** Ana is conflating *etiology* (how the regularity came to be) with *constitution* (what makes it a convention at time $t$). For Lewis, a regularity is "non-accidental" not because it has a causal history of selection, but because it is *sustained* by a specific system of preferences and expectations. Lewis explicitly distinguishes conventions from regularities caused by "external constraints" or biological instinct. A behavior can be evolutionarily stable (e.g., a biological reflex or a coerced behavior) without being a convention. Ana is proposing a *revision* of Lewis, not an interpretation.

  ### Move 2 (Ben)
  **Claim:** The condition is tied to agents' common interest and mutual expectations. Without expectations, it's not a convention.
  **Adjudication:** **Ben is right (textually).**
  **Reasoning:** This is the core of Lewis's definition. Lewis defines convention as a solution to a recurrent coordination problem where agents conform *because* they expect others to conform and prefer to coordinate. The "non-accidental" element is the *reason-based* sustainability of the equilibrium. If a population conforms due to blind selection without holding the requisite expectations (e.g., "I do X because I expect you to do X"), Lewis would classify this as a mere regularity or a natural norm, not a convention. Ben correctly identifies the intentional stance required by Lewis.

  ### Move 3 (Ana)
  **Claim:** Expectations can be selected too. Agents who expect/conform do better, so expectation structures evolve alongside behavior.
  **Adjudication:** **Ana is theoretically plausible, but Lewisianly weak.**
  **Reasoning:** Ana is channeling Brian Skyrms (*Evolution of the Social Contract*) or H. Peyton Young. It is true that evolutionary game theory can model the emergence of expectations. However, in the context of interpreting Lewis, this is a shift in framework. Lewis treats expectations as pre-existing psychological states that rational agents utilize. Ana is treating expectations as functional traits. While her claim is defensible in modern social science, it doesn't salvage her Move 1 claim that stability *equals* the non-accidental condition. It merely suggests stability can *produce* the condition.

  ### Move 4 (Ben)
  **Claim:** This is circular. To say the regularity is stable *because* people expect it assumes the convention exists. Lewis explains *what* it is, not how a population becomes stable.
  **Adjudication:** **Ben wins on logical structure.**
  **Reasoning:** Ben identifies a category mistake. If Ana argues that the regularity is a convention *because* it is stable due to expectations, she is using the *existence* of the convention (the expectation loop) to explain the *stability* of the convention. Lewis's project is analytical: he wants to define the state of affairs. If Ana says "It's a convention when expectations stabilize it," she hasn't defined the convention; she has described a dynamic process. Ben is right that Lewis is offering a static analysis of a social fact, not a genetic history.

  ### Move 5 (Ana)
  **Claim:** It's not circular, it's diachronic. Selection $\rightarrow$ Regularity $\rightarrow$ Expectations $\rightarrow$ Convention.
  **Adjudication:** **Ana concedes the main point, but saves the naturalistic project.**
  **Reasoning:** By moving to a diachronic account, Ana implicitly admits that Move 1 was wrong. She now agrees that stability *alone* is not enough; the expectations must arrive *later* for it to become a convention. This validates Ben's distinction between "stable regularity" and "convention." Ana is right that it isn't *logically* circular to describe a timeline, but she has lost the argument that evolutionary stability *constitutes* the Lewisian condition. She has instead argued that evolution is a *mechanism* that can generate Lewisian conventions over time.

  ---

  ### Overall Adjudication

  **Who is closer to Lewis?** **Ben.**
  Ben correctly identifies that Lewis's account is **rationalist and intentionalist**. For Lewis, a convention is a specific psychological equilibrium among rational agents. Stability without the specific web of mutual expectations and conditional preferences is not a convention.

  **Who is closer to contemporary Social Ontology?** **Ana.**
  Ana is arguing for a **naturalized social ontology**. Most contemporary theorists agree with Ana that Lewis's requirement for high-level rationality and common knowledge is too demanding for many real-world norms. They argue (as Ana does) that evolutionary stability *is* the real glue of convention, and "expectations" are just the phenomenological shadow of that stability.

  **The Verdict:** In a seminar specifically on *Lewis's Convention*, **Ben wins**. Ana is arguing against Lewis using Lewisian terminology. She is effectively arguing that Lewis's definition should be *replaced* by an evolutionary one, whereas Ben is defending the internal coherence of Lewis's actual text.

  ---

  ### What Both Are Missing

  Since you are in a PhD program, simply picking a winner is insufficient. You need to identify the blind spots in their dialectic. Both Ana and Ben are missing three crucial components of the Lewisian framework that complicate this debate:

  **1. The Arbitrariness Condition (The $R'$ Clause)**
  Neither Ana nor Ben mentioned Lewis's requirement that there must be an **alternative regularity $R'$** that could have solved the coordination problem instead.
  *   **Why it matters:** Evolutionary stability often selects for the *unique* optimal solution (e.g., biological traits). If a behavior is stable because it is the *only* way to survive, it is not a convention for Lewis. It is a necessity.
  *   **The Gap:** Ana's evolutionary account struggles to explain arbitrariness. If selection drives the behavior, why is it arbitrary? Ben's account handles this better (agents can *choose* $R'$), but he doesn't articulate how expectations select one arbitrary equilibrium over another without appealing to salience or precedent.

  **2. Common Knowledge vs. True Belief**
  Lewis requires **Common Knowledge** (everyone knows, everyone knows that everyone knows, ad infinitum), or at least a very high bar of mutual belief.
  *   **Why it matters:** Evolutionary stability produces *correlated behavior* and perhaps *true belief* ("I believe they will do X"). It does not necessarily produce *common knowledge*.
  *   **The Gap:** Ana's evolutionary account explains why I *believe* you will drive on the right. It does not explain how I know that *you know that I know*. Ben mentions expectations but glosses over the iterative epistemic state. This is the hardest hurdle for naturalizing Lewis.

  **3. The Normative "Ought" (The Seed of Searle/Gilbert)**
  Lewis's conventions are descriptive regularities sustained by preferences. They are not necessarily *normative* in the sense of creating obligations (though Lewis hints at it).
  *   **Why it matters:** Later social ontologists (Gilbert, Searle) argue that conventions create *rights and duties*.
  *   **The Gap:** Both Ana and Ben are treating conventions as *behavioral equilibria*. They are missing the debate about whether Lewisian conventions generate **normative force**. If the regularity is stable (Ana) or expected (Ben), do I *owe* it to you to conform? Lewis says "prefer to conform"; Gilbert says "we are obligated." This distinction is vital for a PhD in social ontology.

  ### Summary for Your Seminar
  You can intervene by validating your intuition: **Stability is a property of the system; Convention is a property of the agents' reasoning within the system.**

  *   **Tell Ben:** He is right about Lewis's text, but he should acknowledge that Lewis's rationalist requirements are often too high for actual social phenomena (the "idealization" critique).
  *   **Tell Ana:** She is right about the *causal history* of many conventions, but she is wrong that this satisfies Lewis's *definitional* conditions. She is proposing a *revision* of Lewis (à la Skyrms), not an interpretation.
  *   **Tell Both:** They need to address the **Arbitrariness Condition**. If evolution selects the regularity, is it still arbitrary? If not, it fails Lewis's test regardless of expectations.

  This distinction between **constitutive conditions** (Ben's focus) and **etiological mechanisms** (Ana's focus) is the precise philosophical wedge you need to drive between them.
