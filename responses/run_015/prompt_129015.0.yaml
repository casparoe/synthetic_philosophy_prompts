  *(Self-Correction Note during final review)*: Make sure Mara doesn't slip into dualism. Her argument is that the *physical causal process* constitutes the self, not that there's a ghost in the machine. She is a materialist, but a dynamic one. Jorin is a functionalist/computationalist.

