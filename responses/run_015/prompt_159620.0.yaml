prompt: |-
  I write a monthly column on science and ideas, and a device I lean on heavily is the counterfactual: what would have happened if the grant had gone to the other lab, if the observation had been missed that morning, if the launch had slipped a year. My copy desk has exactly one rule about these sentences — do not write as though someone who never existed could have had experiences — and it gets applied unevenly, so my drafts come back rewritten in ways that are sometimes better and sometimes, I think, worse. I would like a procedure I can actually run on a sentence before I file it: a short sequence of tests, in plain prose with no formalism, for deciding how to refer to an individual inside a scenario that did not happen. Assume five minutes, one page, a writer with no philosophy training, and copy editors who will not read anything longer. For each step give me what would count as a pass, what would count as a fail, and what the rewrite is when a sentence fails.

  The conceptual material I am working from is the contrast between transworld identity and counterpart theory, and I need the procedure to be faithful to the counterpart-theoretic side without dragging the metaphysics into the column. In particular I have been toying with a distinction I have not seen drawn cleanly and which I want the procedure to adjudicate: the counterpart of a person picked by causal origin (same parents, same gamete, same early history) versus the counterpart picked by narrative role (the person occupying the same slot in the story I am telling — the discoverer, the director, the dissenter). My suspicion is that journalists almost always want the narrative counterpart while the copy desk's rule implicitly demands the origin counterpart, and that these come apart exactly in the cases I care about. So: when does each one govern, and when they conflict, which wins, or is that genuinely undecidable? I also want the procedure to handle three things I keep getting wrong: cases where there is no unique closest counterpart, so that a name should be replaced by existential phrasing; cases where I chain counterfactuals and silently assume the counterpart relation is transitive and symmetric when it need not be; and the point that what counts as closest is fixed by the explanatory purpose of the sentence rather than by overall similarity, which I think is where most of my disputes with the desk really live.

  Please run the finished procedure on three cases. First, a discovery that in fact was made by one group and, on the standard historical judgment, would have been made by a different group within about five years — how should I write the sentence so that I do not imply the same people made it twice? Second, a biography piece where I want to write that a subject would have had a certain career even if her parents had never met, or that a historical catastrophe robbed the world of millions of children who would have grown up to do particular things: I expect the procedure to tell me something here that will spoil a paragraph I like, and I want to see the argument for spoiling it rather than a flat prohibition. Third, a counterfactual about an office rather than a person — if the committee had chosen differently, the agency would have acted otherwise — where the individual and the role pull in different directions. Finally, tell me honestly what the procedure cannot do: which sentences it has to hand back to me as an editorial judgment, where it will misfire on deadline, and where the metaphysics simply does not settle the question of how a sentence will land with a reader.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Science/ideas columnist.
      *   **Problem:** Copy desk has a rule ("do not write as though someone who never existed could have had experiences") applied unevenly. User wants a clear, 5-minute, 1-page procedure to self-edit counterfactuals before submission.
      *   **Theoretical Basis:** Counterpart Theory (Lewisian) vs. Transworld Identity. User wants the procedure to favor Counterpart Theory (CT) without using metaphysical jargon.
      *   **Key Distinction:** Causal Origin Counterpart (same parents/gametes) vs. Narrative Role Counterpart (same job/role in the story).
      *   **Specific Issues to Address:**
          *   No unique closest counterpart (use existential phrasing).
          *   Chaining counterfactuals (transitivity/symmetry issues).
          *   Contextual similarity (explanatory purpose determines "closeness").
      *   **Deliverables:**
          *   A step-by-step procedure (Pass/Fail/Rewrite).
          *   Three test cases run through the procedure (Discovery race, Biography/Parents, Agency/Office).
          *   Honest limitations of the procedure.
      *   **Constraints:** Plain prose, no formalism, one page (conceptually), 5 minutes to run.

  2.  **Deconstruct the Metaphysics for the Procedure:**
      *   *Transworld Identity:* Person X in World A is literally the *same entity* as Person X in World B. (Copy desk often assumes this is impossible if the person's history changes too much).
      *   *Counterpart Theory:* Person X in World A has a *counterpart* in World B. They are similar, not identical. Similarity depends on context.
      *   *The Conflict:* The copy desk says "Don't say Einstein *would have* done X if he were a carpenter" (implies identity). CT says "Einstein's counterpart (carpenter) does X."
      *   *The User's Insight:* Journalists care about *roles* (who discovered the gene?), metaphysics/biographers care about *origins* (who came from these parents?).
      *   *The Solution:* A decision tree that forces the writer to specify *why* they are naming the person. Is it about the *agent* or the *slot*?

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Mental):* Check if the person exists. If not, use "someone." Check if parents changed. If yes, don't use the name. Check if chaining. Stop.
      *   *Critique 1:* Too blunt. Doesn't handle the "Narrative Role" nuance the user wants. Doesn't address the "explanatory purpose" issue.
      *   *Attempt 2 (Mental):* Ask: Am I talking about the body or the job? If job, use name. If body, check parents. If chaining, reset the name.
      *   *Refinement:* Needs to be actionable. "The 5-Minute Counterfactual Stress Test."
      *   *Step 1: The Existence Check.* (Basic copy desk rule).
      *   *Step 2: The Similarity Check.* (Contextual relevance). Are we talking about their genius or their DNA?
      *   *Step 3: The Chain Check.* (Transitivity).
      *   *Step 4: The Uniqueness Check.* (Existential quantification).

      *   *Integrating the User's Specific Distinction:* I need to make sure the procedure explicitly asks: "Am I tracking the *person* (origin) or the *position* (narrative)?"
      *   *Decision Rule:* If Narrative Role > Origin, use the name but qualify the context. If Origin > Narrative, use "someone like..." or "a researcher in that position."
      *   *Actually, looking at CT:* CT allows using the name *if* it's clear we mean the counterpart. The copy desk hates "Person X would have felt Y." They prefer "In that world, Person X's counterpart..." (Too clunky).
      *   *Better approach for Journalists:* Shift focus from *experiencing* to *occupying*. "The credit would have gone to..." instead of "He would have won..."

      *   *Finalizing the Steps:*
          1.  **The Ghost Test:** Does this person exist in the scenario? (If no -> Existential).
          2.  **The Anchor Test:** What makes them the same person here? (Origin vs. Role).
          3.  **The Chain Test:** Am I linking too many "ifs"?
          4.  **The Experience Test:** Am I describing internal states?

  4.  **Developing the Test Cases:**
      *   *Case 1 (Discovery Race):* Watson/Crick vs. Franklin/Pauling. If Watson/Crick failed, who finds DNA?
          *   *Application:* Narrative role wins. "The structure would have been solved by [Other Group]" not "Watson would have solved it later."
      *   *Case 2 (Biography/Parents):* "She would have been a doctor even if parents never met."
          *   *Application:* Origin fails. No counterpart by origin. Narrative role (the "she" as a soul/essence) is metaphysically shaky. Procedure should flag this. Rewrite: "A child with her talents..."
      *   *Case 3 (Agency/Office):* "If the committee chose Smith, the agency would have acted."
          *   *Application:* Role vs. Individual. If the agency's action depends on the *office*, use the office. If *Smith's* personality, use Smith.

  5.  **Addressing the Limitations:**
      *   Metaphysics doesn't solve style.
      *   Readers don't care about CT.
      *   Deadline pressure makes deep thinking hard.
      *   Copy editors might still reject it based on house style, not logic.

  6.  **Refining the Tone:**
      *   Professional, concise, respectful of the copy desk but empowering the writer.
      *   No jargon like "transworld identity" or "quantification." Use "Origin," "Role," "Chain."
      *   Fit the "one page" constraint mentally (keep it tight).

  7.  **Final Review against Constraints:**
      *   *Plain prose?* Yes.
      *   *No formalism?* Yes.
      *   *5 minutes?* Yes, 4 steps.
      *   *Pass/Fail/Rewrite?* Included in steps.
      *   *Counterpart Theory faithful?* Yes, emphasizes similarity contexts over literal identity.
      *   *Origin vs. Narrative?* Explicitly addressed in Step 2.
      *   *Three Cases?* Included.
      *   *Limitations?* Included.

      *(Self-Correction during drafting)*: I need to make sure I don't just tell the user "Don't do it." The user wants to write these columns. The procedure must enable *accurate* counterfactuals, not ban them. The rewrite suggestions must be journalistic, not philosophical. Instead of "The counterpart of Einstein...", use "In that scenario, the discoverer..."

      *(Refining the Origin vs. Narrative Rule)*: The user suspects journalists want Narrative, Desk wants Origin. The procedure should mediate. If the point is about *human potential* (Biography), Origin matters more. If the point is about *scientific inevitability* (Discovery), Role matters more. I will codify this in Step 2.

      *(Refining the "Experience" Rule)*: The desk hates "He would have felt sad." CT says counterparts don't share feelings. Rewrite: "It is likely he would have faced disappointment." Shift from internal state to external circumstance.

      *(Final Polish)*: Ensure the distinction between "No unique counterpart" (use existential) and "Contextual similarity" (define the respect of similarity) is clear.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### The Counterfactual Stress Test (5-Minute Procedure)

  **Purpose:** To ensure counterfactual sentences respect the logic of "what might have been" without implying impossible identities.
  **Rule of Thumb:** You are describing a *similar person in a different story*, not the *same person in a different timeline*.

  #### Step 1: The Existence Check
  Look at the scenario you have created. Does the specific human being you named actually exist in that world? (e.g., If you changed the date of conception by two weeks, the specific biological individual does not exist).
  *   **Pass:** The person exists (same parents, same conception, minor history change).
  *   **Fail:** The person does not exist (different parents, different conception, died young in this timeline).
  *   **Rewrite:** Replace the name with an existential phrase.
      *   *Bad:* "Einstein would have been a patent clerk." (If parents never met, he doesn't exist).
      *   *Good:* "A physicist with similar talents would have ended up in the patent office."

  #### Step 2: The Anchor Check (Origin vs. Role)
  Ask: *Why* am I using this name? Am I tracking their **biological origin** (who they are) or their **narrative role** (what job they hold)?
  *   **Pass (Origin):** The story is about the individual's specific life, psychology, or biology. (Biography).
      *   *Requirement:* Keep biological history fixed. If parents change, you cannot use the name.
  *   **Pass (Role):** The story is about scientific inevitability, institutional behavior, or historical forces. (History of Science).
      *   *Requirement:* You may use the name as a placeholder for the "slot," but avoid attributing internal experiences.
  *   **Fail:** You mix them. You claim a different biological person (Origin Fail) would have *felt* the same emotions (Origin requirement).
  *   **Rewrite:** Shift focus to the role or the outcome, not the internal state.
      *   *Bad:* "If her parents hadn't met, she would have felt unfulfilled."
      *   *Good:* "If her parents hadn't met, the role she filled would have remained vacant, or been taken by a peer."

  #### Step 3: The Chain Check
  Are you linking more than one "if" statement to reach a conclusion? (e.g., "If A happened, then B would have, which means C...")
  *   **Pass:** One step of divergence.
  *   **Fail:** Multiple steps where the "closeness" of the counterpart shifts mid-sentence. (Transitivity failure).
  *   **Rewrite:** Break the chain. Reset the counterpart at every new "if."
      *   *Bad:* "If the grant went to Lab B, they would have hired Smith, who would have discovered the error."
      *   *Good:* "If the grant went to Lab B, a different team would have formed. In that scenario, a researcher like Smith might have found the error."

  #### Step 4: The Experience Check
  Are you describing an internal mental state (feeling, thinking, believing) in the counterfactual world?
  *   **Pass:** Describing external actions, credits, or public outcomes.
  *   **Fail:** Describing private qualia or continuity of consciousness.
  *   **Rewrite:** Externalize the verb.
      *   *Bad:* "He would have regretted the decision."
      *   *Good:* "The decision would have been widely regarded as a regrettable one."

  ***

  ### Running the Procedure on Your Cases

  #### Case 1: The Discovery Race
  *Scenario:* Group A found the double helix. Group B was close. You want to say Group B would have found it within five years.
  *   **Step 1 (Existence):** Pass. Group B exists in both worlds.
  *   **Step 2 (Anchor):** Role. This is about scientific inevitability, not Group B's specific souls.
  *   **Step 3 (Chain):** Pass. Single divergence (Group A fails).
  *   **Step 4 (Experience):** Pass. You are discussing credit/discovery, not feelings.
  *   **Verdict:** **Safe to publish with minor tweak.**
  *   **Draft:** "If Group A had stalled, Group B would have published the structure within five years."
  *   **Why:** This respects Counterpart Theory. The *people* in Group B are the closest counterparts to themselves in the other world. The *discovery* is the narrative role. You are not claiming the *same discovery event* happened twice, but that the *role of discoverer* shifts.
  *   **Refinement:** To be strictly safe against the copy desk: "If Group A had stalled, the structure would likely have been published within five years by Group B." (Passive voice removes the implication that the specific humans are identical agents across worlds).

  #### Case 2: The Biography (Parents Never Met)
  *Scenario:* "She would have been a doctor even if her parents had never met."
  *   **Step 1 (Existence):** **Fail.** If parents never met, *she* (this specific gametic combination) does not exist.
  *   **Step 2 (Anchor):** Origin. This is a biography; you are making a claim about *her* potential.
  *   **Conflict:** You cannot claim *she* exists if the origin changes.
  *   **Verdict:** **Must Rewrite.** The procedure spoils the paragraph because the metaphysics is genuinely broken here. You are claiming a specific individual exists without their necessary conditions.
  *   **Draft:** "If her parents had never met, a child with similar talents might have risen to the same position, but it would not have been her."
  *   **Argument for Spoiling:** Writing "She would have..." implies a soul or essence that floats independent of biology. In a science column, this suggests vitalism or mysticism. It is more honest to say the *potential* existed in the population, not that *she* specifically would have lived. It shifts the point from "Her destiny was fixed" to "Her talent was robust," which is likely the actual scientific point you want to make.

  #### Case 3: The Agency Office
  *Scenario:* "If the committee had chosen Smith, the agency would have acted otherwise."
  *   **Step 1 (Existence):** Pass. Smith exists.
  *   **Step 2 (Anchor):** Conflict. Is the agency's action due to Smith (Origin/Person) or the Director's Office (Role)?
  *   **Step 3 (Chain):** Pass.
  *   **Step 4 (Experience):** Pass.
  *   **Verdict:** **Depends on the mechanism.**
  *   **If Smith's personality drives the change:** "If Smith had been chosen, he would have pushed for action." (Person Anchor).
  *   **If the Office drives the change:** "If a different director had been chosen, the agency would have acted otherwise." (Role Anchor).
  *   **The Trap:** If you write "If Smith had been chosen, the agency..." you imply Smith *is* the agency. If Smith leaves, does the agency stop acting?
  *   **Rewrite:** "Had the committee appointed Smith, his approach would have led the agency to act otherwise." This clarifies that the *counterpart* of Smith (the one in the other world) brings specific traits that interact with the agency.

  ***

  ### What This Procedure Cannot Do

  **1. It cannot stop the Copy Desk from being wrong.**
  Your copy desk's rule ("do not write as though someone who never existed could have had experiences") is a blunt instrument. Sometimes, in narrative role contexts (Case 1), we *do* want to write as though they have experiences for the sake of flow. This procedure will tell you when you are technically violating strict counterpart theory, but it cannot force an editor to accept a technical violation for stylistic reasons. You will still have to argue for "narrative necessity."

  **2. It cannot solve the "Closeness" dispute.**
  Step 2 asks you to choose between Origin and Role. But often, the "closest" counterpart is a mix. A reader might feel that "Einstein as a carpenter" is a valid counterpart because we care about his *mind*, not his *parents*. The procedure forces you to pick one anchor. If you pick "Mind," the Copy Desk (who usually default to "Body/Origin") will still flag it. The procedure clarifies *your* logic, but it doesn't change *their* style guide.

  **3. It fails on deadline panic.**
  When you are tired, Step 2 (Anchor Check) is the first to go. You will default to "What sounds cool?" rather than "What is the anchor?" If you are writing fast, default to **Existential Phrasing** ("Someone would have...") rather than Named Phrasing ("Einstein would have..."). It is always metaphysically safer and rarely hurts the story.

  **4. It does not settle reader reception.**
  Readers do not think in counterparts. They think in transworld identity. They *want* to believe Einstein would have been a carpenter. By fixing the metaphysics, you may make the sentence more accurate but less emotionally resonant. The procedure protects you from logical errors, not from boring prose. Sometimes, the "wrong" metaphysical sentence is the right rhetorical one. Use the procedure to know when you are lying, so you can do it intentionally.
