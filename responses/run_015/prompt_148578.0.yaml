  5.  **Drafting the Deontological Critique:**

      *   Deontologists will say: "You're dressing up killing as administration. Your hand moves the drug. You kill A." Institutional roles don't change the metaphysics of causation.

  6.  **Drafting the Epistemic Disclaimers:**

      *   Need to be clear that "Threshold Contractualism" is a constructed label for this exercise, not a standard term like "Rule Consequentialism" or "Doctrine of Doing and Allowing."
