  3.  **Drafting the Analysis (The Three Views):**

      *   *Strict Deontology:* Focus on the act. Swapping the vial causes A's death. Not swapping allows nature/the error to take A. Killing > Letting Die. Verdict: Don't swap.
      *   *Consequentialism:* 1 lives, 1 dies. Net utility identical. The mechanism (hand motion vs. stillness) is irrelevant. Verdict: Indifferent (flip a coin).
