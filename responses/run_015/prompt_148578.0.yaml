      *   **Tone:** Pedagogical, rationalist-style (clear, analytical), honest about philosophical contention.

  2.  **Drafting the Scenario:**

      *   *Setting:* Hospital pharmacy or ICU. Let's go with a hospital pharmacy antidote scenario. It feels concrete.
      *   *Resource:* A single dose of a rare antivenom or antidote.
      *   *Patients:* Patient A (currently allocated) and Patient B (arrived later, equal need/prognosis).
      *   *The Twist (for the Contractualist):* The allocation to A wasn't a doctor's decision; it was a clerical error or an automated system glitch that hasn't been ratified by a medical authority yet. The gatekeeper (Senior Pharmacist) notices this *before* administration.
