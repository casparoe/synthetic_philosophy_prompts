answer: |-
  That's a classic setup, and I appreciate you throwing the hard case right out of the gate. But if those 200,000 people vote for A, they're essentially voting for 198,000 of them to never exist. You can't let existing people veto the existence of others just to upgrade their own average comfort. If those lives are worth living, you've added a massive reservoir of positive experience that simply wouldn't exist otherwise. So I still say B wins, because bringing good lives into being matters more than maximizing the stats for the few.
