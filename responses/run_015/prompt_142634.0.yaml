prompt: |-
  I'm taking this bioethics course and I also volunteer screening protocols for my school's research review board, which sounds fancier than it is—basically I check consent forms before they go to faculty. I need a decision procedure I can run in about 15 minutes that turns whatever philosophers actually mean by valid consent into steps I can use, especially around deception, coercion, and competence. Don't just list standard textbook stuff; I need ordered checks: what do I verify first, what counts as a pass, where do I have to hand it up to the board because it's a values call not a fact check, and where will this thing definitely misfire? Make sure it handles the weird middle cases—like when a study uses what I'd call structural deception, where nothing is technically lied about but the framing makes people think it's about one thing when it's testing something else, and when competence isn't binary but kind of gradient across different parts of the decision. Apply it to three protocols: one with mild deception in a memory study, one recruiting people immediately after they recieve bad medical news, and one with a technically perfect form but payment that's like three months rent for the target group. I want the answer in American English, and I need you to flag the case where the procedure tells me to reject something that probably shouldn't be rejected. Also please don't just give me a bibliography—I'm writing this for myself, not a paper.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Bioethics student + volunteer protocol screener for a school research review board (IRB/REB equivalent).
      *   **Task:** Create a 15-minute decision procedure for valid consent.
      *   **Key Focus Areas:** Deception, Coercion, Competence.
      *   **Specific Constraints:**
          *   Ordered checks (Step 1, Step 2, etc.).
          *   Define "Pass" criteria.
          *   Identify "Escalation Points" (when to kick up to the full board).
          *   Identify "Failure Modes" (where the procedure misfires).
          *   Handle "Weird Middle Cases" (structural deception, gradient competence).
          *   Apply to three specific cases (Memory study w/ deception, Bad news recruitment, High payment).
          *   Flag the "False Negative" (where the procedure says reject but shouldn't).
          *   Tone: American English, practical/personal (not a bibliography/academic paper).

  2.  **Deconstruct "Valid Consent" for a Screener:**
      *   Philosophical ideal: Autonomous authorization (Faden & Beauchamp), substantial understanding, voluntariness.
      *   Practical reality: Checkboxes, risk assessment, power dynamics.
      *   The Gap: Philosophers want deep understanding; Screeners have 15 minutes and a form.
      *   Strategy: Create a heuristic filter. It needs to be robust enough to catch red flags but fast enough to be usable.

  3.  **Drafting the Decision Procedure (The "15-Minute Filter"):**
      *   *Goal:* Move from easy factual checks to harder ethical judgments.
      *   *Step 1: Competence/Capacity (The Gateway).* If they can't consent, stop. But it's gradient. Need a check for vulnerability.
      *   *Step 2: Disclosure & Comprehension (The "What").* Is the info there? Is it readable?
      *   *Step 3: Voluntariness (The "Why").* Coercion/Undue Influence.
      *   *Step 4: Deception/Withholding (The "Truth").* Is it necessary? Is debriefing planned?
      *   *Escalation:* Where does the screener stop and the board start? (High risk, vulnerable populations, significant deception).
      *   *Failure Modes:* Where does this checklist fail? (Cultural nuance, long-term harm, subtle power dynamics).

  4.  **Refining the "Weird Middle Cases":**
      *   *Structural Deception:* Not lying, but framing. *Check:* Does the "Purpose" section match the "Methods"?
      *   *Gradient Competence:* Not just "sane/insane." *Check:* Is the risk proportional to the capacity required? (Sliding scale).

  5.  **Developing the Three Test Cases:**
      *   *Case 1: Memory Study (Mild Deception).* Standard psych stuff. Needs debriefing check.
      *   *Case 2: Bad News Recruitment (Vulnerability).* High emotional distress. Competence/Voluntariness risk.
      *   *Case 3: High Payment (Undue Influence).* $3 months rent. Coercion vs. Compensation.

  6.  **Addressing the "False Negative" Constraint:**
      *   I need to find a scenario where the checklist says "Reject" but ethical intuition says "Approve."
      *   *Candidate:* The High Payment case. Strict coercion models might flag it, but for low-income populations, high pay might be justice-oriented, not coercive. Or the Bad News case: sometimes researching trauma is vital, but the checklist might block it due to "vulnerability."
      *   *Decision:* The High Payment case is the classic "Undue Inducement" trap. A rigid checklist often flags high pay as coercive, but ethicists argue high pay can be fair compensation for burden. I'll flag this one.

  7.  **Drafting the Content (Iterative refinement for tone and utility):**
      *   *Tone:* Direct, pragmatic, slightly informal but professional. "Here's how you actually do it."
