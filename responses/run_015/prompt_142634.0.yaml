answer: |-
  Here is a practical decision procedure designed for a 15-minute screening window. It translates the philosophical conditions of valid consent (disclosure, comprehension, voluntariness, competence) into a linear checklist.

  This is not a full ethical review; it is a **triage filter**. Its job is to catch clear violations and flag complex value judgments for the full board.

  ### The 15-Minute Consent Screen (The "FVC-Flow")

  **Time Budget:** 3 mins per step + 3 mins for final call.

  #### Step 1: Competence & Vulnerability (The Gateway)
  *Philosophical translation:* Decision-making capacity is not a binary switch; it is task-specific and risk-relative.
  *   **Check A:** Is the population legally/clinically competent? (e.g., adults vs. children, intact vs. dementia).
  *   **Check B (The Gradient):** If capacity is potentially compromised (stress, age, cognitive load), is the risk level low enough to match their capacity?
      *   *Pass:* High capacity + Any risk OR Low capacity + Minimal risk + Guardian consent.
      *   *Fail:* Low capacity + High risk.
      *   *Escalate:* "Situational incompetence" (e.g., acute distress, intoxication, immediate post-diagnosis).
  *   **Structural Note:** Look for exclusion criteria. If they exclude vulnerable people, check A is easy. If they *target* them, move to Escalation.

  #### Step 2: Disclosure & Structural Deception (The "What")
  *Philosophical translation:* Subjects must understand what they are agreeing to. Lying is bad, but so is misleading framing.
  *   **Check A:** Are the procedures, risks, and benefits listed explicitly?
  *   **Check B (Structural Deception):** Read the "Purpose" statement. Now read the "Methods." Do they align?
      *   *Red Flag:* Purpose says "Memory Test," Methods include "Social Pressure Stress Test." This is structural deception.
  *   **Check C:** If deception exists (active or structural), is there a **Debriefing Protocol**?
      *   *Pass:* No deception OR Deception justified by scientific value + Mandatory Debriefing + Option to withdraw data post-debrief.
      *   *Fail:* Deception without debriefing OR Deception regarding physical risk.
      *   *Escalate:* Any deception involving sensitive topics (trauma, illegal behavior, sexual history).

  #### Step 3: Voluntariness & Inducement (The "Why")
  *Philosophical translation:* Consent must be free from coercion (threats) and undue influence (offers too good to refuse).
  *   **Check A:** Is there a power differential? (Professor/Student, Doctor/Patient).
      *   *Pass:* Alternative options exist (e.g., extra credit options other than the study).
      *   *Fail:* "Participate or fail the class."
  *   **Check B (Payment):** Is the payment proportional to time/burden?
      *   *Pass:* Hourly rate is reasonable (e.g., $15–$30/hr equivalent).
      *   *Escalate:* Payment exceeds 2x standard hourly rate OR Payment is lump-sum that creates "sunk cost" pressure.
      *   *Fail:* Payment contingent on *completion* only (no pro-rated pay for withdrawal).

  #### Step 4: The "Cooling Off" Check
  *Philosophical translation:* Autonomous decisions require reflection time, especially under stress.
  *   **Check:** Is there a gap between recruitment and consent?
      *   *Pass:* Standard recruitment.
      *   *Escalate:* Recruitment happens immediately following a significant life event (diagnosis, grade receipt, arrest).
      *   *Fail:* Consent demanded immediately before a procedure with no time to read.

  ---

  ### Escalation Triggers (When to Kick Upstairs)
  Do not make the final call yourself if you hit these. Mark "Review Required" and send to the full board.
  1.  **Waiver of Consent:** They want to waive consent entirely.
  2.  **High-Risk Deception:** The deception could cause psychological distress upon revelation.
  3.  **Vulnerable Populations:** Prisoners, pregnant women, children, or cognitively impaired adults.
  4.  **Therapeutic Misconception:** Clinical trials where patients might think the research is treatment.
  5.  **The "Bad News" Window:** Recruitment within 24 hours of significant medical or personal news.

  ### Known Failure Modes (Where This Procedure Misfires)
  1.  **The Paternalism Trap:** This checklist is risk-averse. It will often recommend rejecting studies that are ethically permissible but look "messy." It prioritizes safety over scientific innovation.
  2.  **Cultural Blindness:** It assumes Western individualism. In some cultures, community consent is more valid than individual signatures. This checklist will flag those as "incomplete."
  3.  **The "Perfect Form" Problem:** A consent form can be readable and complete (Pass Step 2) while the *process* of obtaining consent is rushed or coercive (Fail Step 3). This checklist relies heavily on the document, not the interaction.

  ---

  ### Application to Your Three Protocols

  #### Case 1: Memory Study with Mild Deception
  *   **Protocol:** Participants told it's a "word recall test." Actually testing susceptibility to misinformation. Debriefed at end.
  *   **Run-through:**
      *   Step 1: Competent adults. (Pass)
      *   Step 2: Structural deception present (Purpose vs. Method mismatch). Debriefing protocol included? Yes. Data withdrawal option? Yes. (Pass)
      *   Step 3: No power differential, standard payment. (Pass)
      *   Step 4: No cooling off needed for minimal risk. (Pass)
  *   **Verdict:** **Approve.**
  *   **Note:** Standard psych methodology. As long as the debrief is robust, the deception is ethically managed.

  #### Case 2: Recruitment After Bad Medical News
  *   **Protocol:** Recruiting cancer patients to survey coping mechanisms immediately after diagnosis disclosure.
  *   **Run-through:**
      *   Step 1: Competent adults, but **Situational Incompetence** risk due to distress. (Escalate)
      *   Step 2: Disclosure looks fine. (Pass)
      *   Step 3: Voluntariness compromised by emotional state. (Escalate)
      *   Step 4: **Cooling Off Check Failed.** Recruitment is immediate post-diagnosis. (Escalate)
  *   **Verdict:** **Escalate to Board.**
  *   **Reasoning:** This is a values call. Is the data urgent enough to justify potential distress? The screener cannot weigh scientific value against emotional risk. The board needs to mandate a waiting period (e.g., 48 hours post-diagnosis).

  #### Case 3: Technically Perfect Form, High Payment
  *   **Protocol:** Low-income community members. 1-hour survey. Payment = $750 (approx. 3 months rent for target demographic). Form is 6th-grade reading level, all risks disclosed.
  *   **Run-through:**
      *   Step 1: Competent. (Pass)
      *   Step 2: Disclosure perfect. (Pass)
      *   Step 3: **Inducement Check.** Payment is vastly disproportionate to time (approx. $750/hr). This creates Undue Influence. (Fail/Escalate)
      *   Step 4: No cooling off. (Pass)
  *   **Verdict:** **Reject / Escalate.**
  *   **Reasoning:** The payment compromises voluntariness. A person might ignore risks they otherwise wouldn't because they need the rent money.

  ---

  ### ⚠️ The False Negative Flag

  **Case 3 (High Payment) is where this procedure tells you to Reject something that probably shouldn't be rejected.**

  **Why the procedure fails here:**
  Standard bioethics frameworks (and this checklist) treat high payment as "Undue Inducement" (Coercion by offer). The logic is: *The money is so high it clouds judgment.*

  **Why that might be wrong:**
  Many ethicists argue this is paternalistic. If the work is burdensome, risky, or unpleasant, high pay is **justice**, not coercion. If the target group is low-income, offering them "standard" low wages while wealthy students get course credit is exploitative. By flagging the high payment as a failure, the procedure might block a study that actually treats participants *more* fairly than usual.

  **How to handle it:**
  If you hit the "High Payment" fail, do not automatically reject. Escalate with the note: *"Potential Undue Inducement vs. Fair Compensation."* Let the board decide if the payment is *exploitative* (taking advantage of desperation) or *equitable* (paying what the labor is actually worth to that demographic).

  ### Summary for your Workflow
  1.  **Scan for Vulnerability first.** If the people are vulnerable, slow down.
  2.  **Match Risk to Capacity.** High risk requires high capacity.
  3.  **Hunt for Structural Deception.** Compare the "Purpose" header to the "Methods" header.
  4.  **Watch the Money.** If it looks like a lifeline, it's a red flag.
  5.  **When in doubt, Escalate.** Your job is to catch the clear errors, not solve the hard philosophy problems.
