prompt: |-
  I'm on the math advisory board for a TV game show, and we're debating whether to add a "switch" option to our two-envelope segment, where one envelope has twice the amount of the other and the contestant doesn't know which is which. The basic setup is that the producer picks an amount X, puts X in one envelope and 2X in the other, shuffles, and the contestant picks one; the question is whether we let them peek at their amount and then switch.

  Half the board is convinced a savvy contestant will just always switch, because of the two-envelope reasoning — "no matter what's in my envelope, the other one has expected value 1.25× mine, so switching is +EV" — and the show will bleed money. The other half (including our in-house statistician) thinks that's a fallacy, an impropper prior thing, and that a real contestant won't actually reason this way, so we should just let them switch and it'll be fine. I keep going back and forth, and I was re-reading the old LessWrong threads on the two-envelope problem trying to settle it and I'm not sure I've got it.

  Could you draft a short decision memo for the board that recommends whether we should allow the switch, and if so, how to structure the envelope amounts — a bounded prior, a specific distribution, whatever — so the show doesn't lose money? I want it to engage the two-envelope reasoning seriously rather than just hand-wave the fallacy, give a concrete recommendation with a specific rule or distribution change, and honestly treat the strongest argument on the losing side.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Math Advisory Board Member for a TV Game Show.
      *   **Task:** Draft a short decision memo for the board.
      *   **Topic:** Whether to allow a "switch" option in a two-envelope segment (one has $X$, the other $2X$).
      *   **Conflict:** Half the board thinks switching is always +EV (1.25x argument) and will cost the show money. The other half (including the statistician) thinks it's a fallacy and switching doesn't matter/won't hurt the show.
      *   **Requirements:**
          *   Engage seriously with the two-envelope reasoning (don't just hand-wave).
          *   Give a concrete recommendation (allow/disallow, specific rules/distributions).
          *   Treat the strongest argument on the "losing" side honestly.
          *   Keep it short (memo format).

  2.  **Deconstruct the Two-Envelope Paradox:**
      *   *The Naive Argument:* I have envelope $A$. It contains amount $a$. Envelope $B$ has either $a/2$ or $2a$ with probability 0.5 each. $E[B] = 0.5(a/2) + 0.5(2a) = 1.25a$. Therefore, always switch.
      *   *The Flaw:* This assumes a uniform prior over all possible money values (improper prior). In reality, there's a budget cap, or a probability distribution over $X$ chosen by the producer.
      *   *The Resolution:* If the distribution of $X$ is bounded or known, the probability that the other envelope is $2a$ vs $a/2$ depends on $a$. If $a$ is very large (near the cap), it's more likely to be the larger envelope. If $a$ is small, it's more likely to be the smaller one.
      *   *Show Context:* The producer picks $X$. This means there *is* a distribution, even if hidden. There is almost certainly a maximum budget per episode.

  3.  **Evaluate the "Show Will Bleed Money" Claim:**
      *   If the producer picks $X$ from a fixed range (e.g., \$100 to \$10,000), the naive 1.25x calculation fails at the boundaries.
      *   However, if the contestant doesn't know the range, can they exploit it?
      *   *Cover's Strategy:* There is a strategy (randomized threshold) that gives $>50\%$ chance of picking the larger envelope, but it doesn't necessarily maximize expected value in a way that breaks the bank compared to random picking, *unless* the distribution is heavily skewed.
      *   *Expected Value:* If the producer's distribution is fixed, the expected value of switching is exactly the same as staying *before* opening the envelope. *After* opening, it depends on the conditional probability.
      *   *Key Insight:* The show controls the distribution. If the show sets a hard cap, the "always switch" strategy is actually *negative* EV for high values. If the show uses a specific distribution, they can calculate the exact risk.

  4.  **Formulate the Recommendation:**
      *   *Decision:* Allow the switch. It makes for better TV (drama, choice).
      *   *Risk Mitigation:* The risk isn't theoretical; it's budgetary. The "1.25x" argument is mathematically flawed for any real-world budget.
      *   *Concrete Rule:* Implement a **hard cap** on the maximum envelope value and ensure the distribution of base amounts ($X$) is not scale-invariant (e.g., don't use a Pareto distribution that mimics the improper prior). A uniform or truncated normal distribution works best.
      *   *Addressing the "Losing" Side:* Acknowledge that *if* the show used an unbounded, scale-invariant distribution (impossible in reality), the paradox would hold. Acknowledge that savvy players *feel* like switching is right, which creates tension.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Recommend allowing the switch. It's safe if structured correctly.
      *   **The Mathematical Reality (Addressing the Paradox):** Explain why the 1.25x argument fails (improper prior vs. real budget).
      *   **The "Losing" Side's Valid Point:** Acknowledge that without a cap, the logic holds. Acknowledge the psychological pressure.
      *   **Concrete Implementation:**
          1.  Set a Max Cap ($M$).
          2.  Define the Base Amount Distribution (e.g., Uniform).
          3.  (Optional but good) Don't reveal the exact amount immediately, or reveal it but keep the cap secret? Actually, revealing the amount is the prompt. If they see \$10,000 and know the cap is \$10,000, they won't switch. If they don't know the cap, they might.
          4.  *Better advice:* The show should calculate the EV based on their specific distribution.
      *   **Conclusion:** Greenlight the feature with constraints.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, does switching actually increase EV for the contestant?*
      *   If the producer picks $X$ from a distribution $P(X)$, and the contestant sees $A$, the posterior probability that $A=X$ (smaller) vs $A=2X$ (larger) depends on $P(X)$.
      *   $P(\text{other is } 2A | A) \propto P(X=A)$.
      *   $P(\text{other is } A/2 | A) \propto P(X=A/2)$.
      *   Switching is +EV only if $P(X=A) > P(X=A/2)$.
      *   For most "reasonable" distributions (decreasing or uniform), low values suggest switching, high values suggest staying.
      *   *Crucial Point:* An "Always Switch" strategy is *not* +EV over the long run against a fixed distribution. It averages out to zero gain.
      *   *Why?* Because $E[\text{Switch}] = E[\text{Stay}]$. The conditional expectation varies, but the unconditional expectation is identical.
      *   *So why the paradox?* Because people condition on $A$ but assume $P(X=A) = P(X=A/2)$ for all $A$, which implies $\sum P(X) = \infty$.
      *   *Memo Tone:* Needs to be authoritative but accessible to producers/board members.

  7.  **Finalizing the Recommendation:**
      *   Allow the switch.
      *   Why? It adds drama.
      *   Is it risky? No, not mathematically.
      *   Constraint: Ensure the budget cap is strictly enforced (obviously) and consider using a distribution where high values are less likely (standard budgeting).
      *   Address the "Savvy Contestant": Even if they know the math, they can't exploit it without knowing the distribution. If they assume "Always Switch," they gain nothing on average.

  8.  **Drafting the Content (incorporating the "Losing Side" requirement):**
      *   Make sure to explicitly state: "The board members worried about loss are right *if* we assume an infinite budget. Since we don't have that, they are technically wrong, but their intuition about risk is valuable."
      *   Actually, a stronger concession: "The concern relies on the assumption that the probability of the other envelope being double is always 50%. This is true *locally* for many values, making the contestant *feel* right, even if the global EV is neutral."

  9.  **Review against constraints:**
      *   Short decision memo? Yes.
      *   Engage two-envelope reasoning? Yes.
      *   Concrete recommendation? Yes (Allow switch, fix distribution).
      *   Treat losing side honestly? Yes (Acknowledge the conditional logic holds for mid-range values).

  10. **Final Polish:** Check tone (professional, decisive). (Self-correction: Ensure I don't get too bogged down in integrals. Keep it conceptual but precise.) *Wait, one nuance:* If the contestant sees the amount, they have information. If the distribution is uniform $[1, M]$, and they see $A > M/2$, they know they have the larger envelope (since $2X$ cannot exceed $M$, wait, if $X$ is base, max is $2M$. If they see $A > M$, they know $A=2X$).
      *   *Correction:* Producer picks $X$. Envelopes are $X, 2X$. Max budget $B$. So $2X \le B \implies X \le B/2$.
      *   If contestant sees $A > B/2$, they know $A$ must be $2X$ (the larger one). They should stay.
      *   If contestant sees $A \le B/2$, they don't know.
      *   This creates a "Switch if low, Stay if high" strategy.
      *   Does this cost the show money? It shifts variance, but total EV remains the same as random selection *before* the peek.
      *   *Wait, does it?* If the contestant plays optimally (Switch if $A \le B/2$, Stay if $A > B/2$), do they gain EV?
      *   Let's check.
      *   Pairs are $(X, 2X)$. Prob of picking either is 0.5.
      *   If I pick $X$ (value $X$), I see $X$. If $X \le B/2$, I switch to $2X$. Gain $X$.
      *   If I pick $2X$ (value $2X$), I see $2X$. If $2X \le B/2$ (i.e., $X \le B/4$), I switch to $X$. Loss $X$. If $2X > B/2$, I stay. Gain 0.
      *   So I gain when I start with small $X$, I lose when I start with medium $X$, I break even on large $X$.
      *   Net effect depends on the distribution of $X$.
      *   If $X$ is Uniform $[1, B/2]$:
          *   Range $X \in [1, B/4]$: Gain $X$ (picked small), Loss $X$ (picked large). Cancels out.
          *   Range $X \in [B/4, B/2]$: Gain $X$ (picked small), Stay (picked large). Net Gain.
      *   *Oh!* If the contestant knows the cap $B$, they *can* gain EV by switching on values below $B/2$ and staying above.
      *   *Critical Finding:* If the cap is public knowledge, optimal play *does* increase contestant EV compared to random guessing.
      *   *Recommendation Adjustment:* Do **not** publicize the exact maximum cap. Or, structure the amounts so the "Switch/Stay" boundary is ambiguous.
      *   *Better Recommendation:* Keep the maximum budget confidential. If the contestant doesn't know $B$, they can't execute the threshold strategy perfectly. They fall back to the paradox reasoning (Always Switch), which yields 0 net gain over many trials.
      *   *Refined Memo:* Allow switch, but keep the upper bound of the prize pool confidential.

  11. **Final Plan:**
      *   **To:** Production Board
      *   **From:** Math Advisory
      *   **Rec:** Allow switch, keep max prize cap confidential.
      *   **Math:** Explain the 1.25 fallacy (improper prior). Explain that with a hidden cap, "Always Switch" is neutral EV. Explain that with a *known* cap, optimal play is slightly +EV, so hide the cap.
      *   **Losing Side:** Acknowledge that for any specific amount seen, the *local* expectation often favors switching, validating their anxiety.

  12. **Writing the Memo.** (Proceed to generate output based on this thought process).
answer: |-
  **MEMORANDUM**

  **TO:** Game Show Production Board
  **FROM:** Mathematics Advisory Group
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Two-Envelope "Switch" Mechanic

  **Executive Summary**
  We recommend **allowing the switch option** after the contestant peeks at their envelope. This mechanic generates significant dramatic tension without posing a financial risk to the show, provided we keep the maximum prize cap confidential. The fear that contestants will exploit a mathematical loophole to guarantee +EV (Expected Value) is based on a theoretical paradox that does not apply to our bounded budget. However, we must structure the prize distribution carefully to prevent optimal play from skewing costs.

  **The Mathematical Reality: Why the "1.25x" Argument Fails**
  The board's concern rests on the standard Two-Envelope Paradox reasoning: *"If I have amount $A$, the other envelope is equally likely to be $A/2$ or $2A$. Therefore, the expected value of switching is $1.25A$."*

  This reasoning assumes an **improper prior**: it implies that any amount of money is equally likely to appear in the envelope, from one cent to infinity. In reality, the show has a fixed budget. There is a maximum possible amount ($M$) that can appear in an envelope.
  *   If a contestant sees an amount $A > M/2$, they know mathematically that they hold the larger envelope ($2X$). Switching would be a guaranteed loss.
  *   Because the probability of the other envelope being $2A$ decreases as $A$ approaches the budget cap, the global expected value of switching is exactly zero over the long run. The show will not "bleed money" due to the math alone.

  **Addressing the Minority Opinion (Financial Risk)**
  The board members arguing that we should disallow the switch raise a valid practical point, even if their theoretical justification (the 1.25x fallacy) is flawed. Their intuition is correct that **information has value.**

  If we publicly announce a hard cap (e.g., "No envelope exceeds \$10,000"), a savvy contestant can adopt a threshold strategy: *Switch if the amount is under \$5,000; Stay if over.* Against a uniform distribution of prize amounts, this strategy **does** yield a positive expected value compared to random guessing, because it avoids switching away from the largest prizes while capturing the upside on smaller ones.

  The "losing" side is right to worry that giving the contestant *any* information allows them to optimize. If we make the budget cap common knowledge, we hand the contestant a tool to extract slightly more EV from the prize pool than intended.

  **Concrete Recommendations**
  To maximize drama while neutralizing financial risk, we propose the following rules:

  1.  **Allow the Peek and Switch:** This creates the "deal or no deal" tension essential for television.
  2.  **Confidentialize the Upper Bound:** Do not announce the maximum possible prize amount ($M$) to the audience or contestants. Without knowing $M$, the contestant cannot calculate the threshold where switching becomes negative EV. They are forced to rely on the flawed 1.25x intuition, which averages to neutral EV over time.
  3.  **Skew the Base Distribution:** Instruct producers to select the base amount $X$ from a distribution where lower values are more common than higher values (e.g., a truncated geometric distribution). This ensures that even if a contestant "Always Switches," the instances where they lose (switching from a high value to a half-value) outweigh the instances where they win, naturally hedging the show's risk.

  **Conclusion**
  The "Always Switch" strategy is not a money pump for contestants; it is a mathematical mirage caused by ignoring budget constraints. By keeping the maximum prize cap confidential, we prevent savvy players from exploiting the boundary conditions. We should proceed with the switch option to enhance viewer engagement.
