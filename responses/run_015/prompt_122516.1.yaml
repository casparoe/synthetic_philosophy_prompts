  Regarding inalienability, Locke's prohibition on suicide stems from the claim that humans are God's workmanship, lacking arbitrary power over their own lives. This theological premise blocks directives that mandate self-destruction, but its application to treatment refusal is complex. Does surrendering future say constitute a partial alienation of oneself? Locke forbids voluntary slavery because one cannot give another arbitrary power over one's life. *Extrapolation:* Extending this to medical directives, the override clause is permissible only if it preserves the organism as God's property rather than enslaving the will. If the treatment sustains life, the directive aligns with divine ownership. If secularized, a residue remains: one cannot alienate the capacity for rational agency itself. The directive is valid not because the earlier self owns the later, but because the earlier self acts to preserve the conditions of agency where possible. If the clause reduces the later self to a mere object without hope of restored rationality, it violates the secular constraint against self-enslavement. The theological premise does the heavy lifting in Locke's text, but the underlying principle is that agency cannot be wholly surrendered. Therefore, the override clause is valid only insofar as it protects the rational agent's prior conception of the good, not because it grants the earlier self dominion over the later self's body.

  On the drift objection, the critic claims Locke cannot distinguish dementia from ordinary change of mind since both involve a break in will. A Lockean reply relies on the distinction between a change in volition and a loss of rational capacity. Locke grounds personhood in consciousness extended by memory, but also ties moral agency to reason. Ordinary drift occurs within a continuous rational consciousness; dementia represents the collapse of the rational substrate required for personhood. *Extrapolation:* While Locke does not discuss clinical capacity, his account of parental power and the relation between will and good provides a model. Parents govern children who lack reason; similarly, the earlier self may exercise trusteeship over the later "man" when the "person" has vanished due to cognitive collapse. The override clause is not binding a changed mind, but protecting a biological entity when the moral agent has ceased to exist. The earlier self binds the organism, not a competing person. This utilizes Locke's distinction between the "man" (biological) and the "person" (forensic). When dementia strikes, the "person" may depart while the "man" remains. The directive governs the "man" in the absence of the "person," much like a trustee manages an estate for an absent owner. This avoids dishonoring ordinary changes of mind, which occur within the continuity of a single rational person. The earlier self acts on behalf of the later self's good when the later self's will is no longer rational.

