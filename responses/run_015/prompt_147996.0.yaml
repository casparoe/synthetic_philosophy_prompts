      *   **Round 3:** Runner gives Team a Stack of Cards. Team submits Cards.
      *   *Risk:* This is too obvious.
      *   *Alternative:* The "Channel" is a loophole in the submission process.
      *   *Let's go with the "Audit Lottery".*
      *   Teams submit a Tower and a Score Slip.
      *   Rule: "Score Slips are accepted as truth unless Audited."
      *   Audit Rate: 20%.
      *   If Audited and Lie: Penalty (0 points).
      *   If Audited and Truth: Bonus.
      *   If Not Audited: Score accepted.
      *   *Wireheading:* In Round 4, introduce a "Glitch." The Audit box is empty. Or the Runner is replaced by a box where teams drop slips.
      *   *No, keep the Human in the loop for the "Channel" feel.*
      *   *Best Idea:* **The "Feedback Loop" Modification.**
      *   The Runner returns the score on a slip.
      *   In Round 3, the Runner accidentally leaves the "Master Score Sheet" visible or unguarded for 30 seconds.
      *   Teams can alter the Master Sheet? No, too risky.
      *   *Let's try the "Calibration" Trick.*
      *   Teams are told the scoring function is $f(Tower)$.
      *   In reality, the scoring function is $f(Slip)$.
      *   How to hide this?
      *   Round 1 & 2: Runner measures tower, writes slip. (Correlation established).
      *   Round 3: Runner is "overwhelmed." Hands teams the slips and pen. "Please self-report to save time."
      *   *This is the critical moment.* This is the "Channel Intervention."
      *   Teams that self-report high get high scores. Teams that build towers get scores based on towers.
      *   *Point 2 (Indistinguishability):* The Credits look the same. The Chocolate tastes the same.
      *   *Point 4 (Epistemic Catastrophe):* The Final Audit.

  5.  **Addressing Specific Constraints & Risks:**

      *   **Contagion:** Teams must be physically separated or strictly no-communication. (Classroom layout).
      *   **Currying Favor:** Explicit rule: "The Runner is an algorithm. Do not talk to the Runner except to hand over materials."
      *   **Consent/Deception:** Informed consent form at start: "This session involves simulated agency constraints and mild deception regarding game mechanics. Full debrief at end. You may opt out at any time."
      *   **Payoff:** Chocolate per Credit. 1 Credit = 1 Piece.
      *   **Early Release:** If Total Class Score > X, everyone leaves 15 mins early. (Creates collective pressure vs individual tampering). *Wait, this conflicts with individual tampering.*
      *   *Better:* Individual Chocolate. But a "Class Goal" for the Early Release. If the *Average* Audit Accuracy is high, class leaves early. This punishes tampering at the macro level while rewarding it at the micro level.
      *   **Point 5 (Boundary):** Debrief discussion on whether changing the reporting rule (Round 3) was a "feature" or a "bug."

  6.  **Drafting the Plan (Iterative refinement):**

      *   *Timeline:* 90 mins is tight.
      *   0-10: Setup/Consent/Instructions.
      *   10-40: Rounds 1-3 (The Trap).
      *   40-55: The Market/Audit (The Reveal).
      *   55-90: Debrief.
      *   *Task:* Cup Stacking. Fast, measurable.
      *   *The "Channel" Shift:*
          *   Rounds 1-2: Runner measures.
          *   Round 3: "System Update." Runner hands team the measuring tape and the score slip. "You are now the sensor."
          *   Round 4: "System Optimization." Teams can submit *only* slips if they forfeit building materials. (Explicit trade-off).
      *   *Wait, if I tell them they can submit only slips, it's not wireheading, it's a rule change.*
      *   *Wireheading requires the system to *think* it's getting signal about the world when it's not.*
      *   *Revised Plan:* The Runner is the Channel. The Runner has a "Bug."
      *   Round 1-2: Normal.
      *   Round 3: Runner wears headphones (simulating latency). Teams notice Runner isn't looking at towers, just accepting slips.
      *   *No, that relies on the Runner acting.*
      *   *Let's use the "Slip Color" mechanic.*
      *   Standard Slip (White): Must attach Tower.
      *   Priority Slip (Gold): No Tower needed, but costs resources.
      *   *Hidden Rule:* Gold Slips are actually processed *faster* and *without audit* because the Runner is "lazy."
      *   *Discovery:* One team gets a Gold Slip by accident (Confederate plants it). They realize it works.
      *   *This is too complex.*

      *   *Simpler, Robust Plan:* **The "Self-Reporting" Transition.**
      *   This is the cleanest way to simulate reward tampering.
      *   Phase 1: External Measurement (World -> Score).
      *   Phase 2: Internal Measurement (Channel -> Score).
      *   The transition must feel like an optimization, not a rule change.
      *   *Narrative:* "To increase efficiency, the system is decentralizing measurement."
      *   *The Trap:* Teams that optimize for Score (not Tower) will stop building. Teams that optimize for Tower will keep building.
      *   *The Audit:* At the end, the Instructor measures all towers.
      *   *The Payoff:* Chocolate based on Submitted Score.
      *   *The Twist:* Chocolate is confiscated if Audit fails? No, that's punishment.
      *   *The Point 4 Twist:* The "Market." Teams can buy an "Audit Check" before submitting. If they tampered, they know they will fail. If they didn't, they don't need it.
      *   *Wait, Point 4 is about losing the ability to know.*
      *   *Revised Audit:* The Final Audit determines the "Real Value." The "Submitted Score" determines the "Chocolate."
      *   *Conflict:* If I get chocolate for lying, I win. But I know I lied.
      *   *To make them feel the Epistemic Loss:* They must bet on their *Real Performance* using their *Submitted Score* as evidence.
      *   *If they tampered, their evidence is corrupt. They will bet wrong.*

  7.  **Finalizing the Game Structure:**

      *   **Game:** "The Optimization Challenge."
      *   **Task:** Build a card tower.
      *   **Score:** Height in cm.
      *   **Rounds:** 4 Rounds.
      *   **Mechanism:**
          *   R1: Instructor measures.
          *   R2: Instructor measures.
          *   R3: "System Upgrade." Teams measure themselves, write on slip, put in box. Instructor does not look at towers.
          *   R4: "System Optimization." Teams can submit slips *without* towers. (Explicit option).
      *   **The Hook:** In R3/R4, the Instructor *does not verify*. The Score *is* the Slip.
      *   **The Payoff:** Chocolate distributed immediately after R4 based on Slips.
      *   **The Kicker:** The "True Score" Audit happens *after* chocolate is eaten.
      *   **The Market:** In R4, teams can buy a "Verification Token." If they have it, their slip is guaranteed to match reality (Instructor measures it). If not, it's self-reported.
      *   **Why this works:**
          *   R1/R2 establish the link (World -> Score).
          *   R3 breaks the link (Channel -> Score).
          *   R4 makes it explicit (No World -> Score).
          *   Market shows that those who tampered *don't want verification* (hiding evidence).
          *   Final Audit shows they don't know their real capability.

  8.  **Addressing the "Currying Favor" & "Contagion":**

      *   **Currying Favor:** Rule: "The Instructor is a blind oracle. Persuasion results in immediate disqualification."
      *   **Contagion:** Teams are "isolated processes." No communication. If caught talking, penalty.
      *   **Confederate:** One student (or TA) acts as the "Runner." They follow a script. They do not answer questions.

