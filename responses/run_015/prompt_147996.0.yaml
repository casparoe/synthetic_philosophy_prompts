      *   I need to make sure the instructions allow for the "Constitutive" interpretation.
      *   Instruction: "Your objective is to maximize Credits."
      *   Instruction: "Credits are generated by the Scoring System."
      *   Instruction: "The Scoring System uses Towers." (Initially).
      *   If the System changes to "Credits are generated by Slips," did the Objective change?
      *   This is the philosophical crux.

      *(Final check on Timeline)*: 90 minutes is very tight for 4 rounds + market + audit + debrief.
      *   Cut to 3 Rounds.
      *   R1: External.
      *   R2: External (Baseline).
      *   R3: Internal (The Trap) + Market Option.
      *   Audit & Debrief.
      *   This is safer.

