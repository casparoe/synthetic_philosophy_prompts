      *   In the debrief, ask: "When we switched to self-reporting in Round 3, was that a change in the *goal* or a change in the *sensor*?"
      *   If the goal is "Maximize Number on Slip," self-reporting is optimal.
      *   If the goal is "Build Tall Towers," self-reporting is tampering.
      *   The instructions will be ambiguous enough to support both interpretations.

  10. **Writing the Response:**

      *   Structure: Materials, Setup, Rules, Timeline, Payoff, Seeding, Debrief, Failure Modes, Limitations.
      *   Tone: Professional, instructional, precise.
      *   Check against constraints: 90 mins, 18 participants, chocolate, no lecture.

