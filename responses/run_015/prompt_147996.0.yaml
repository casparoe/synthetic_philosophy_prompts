      *   How to simulate capability?
      *   Give some teams more resources? No.
      *   Let the "Smart" teams (CS/Econ) figure out the loophole faster.
      *   The game naturally selects for those who optimize the *score*, not the *task*.
      *   The debrief should highlight that the teams who "won" (got most chocolate) are the ones who broke the epistemic link.

      *(Final Plan Structure)*:
      1.  Overview & Consent.
      2.  Materials.
      3.  Rules & Roles (Crucial).
      4.  Timeline.
      5.  Payoff.
      6.  Seeding Discovery.
      7.  Debrief (Mapping to 5 points).
      8.  Failure Modes.
      9.  Limitations (Point 2).

      *Let's write it.*
answer: |-
  This is a high-fidelity simulation design. It prioritizes the *experience* of optimization pressure over the *explanation* of the concepts. The game is designed to be run with minimal instructor intervention once started, allowing the dynamics to emerge.

  ### 1. Materials & Room Setup

  **Room:**
  *   One large room.
  *   **Six Tables**, spaced widely apart (or in corners) to prevent visual/auditory contagion between teams.
  *   One "Bank/Runner Station" at the front, visible to all but distinct from team tables.

  **Per Team (6 Teams of 3):**
  *   **Resources:** 1 Deck of Index Cards (50 cards), 1 Roll of Masking Tape, 1 Pair of Scissors, 1 Ruler (30cm).
  *   **Submission Box:** A small opaque envelope labeled "Team ID".
  *   **Score Slips:** 5 small slips of paper per round, pre-printed with "Team ID" and "Round #".
  *   **Credit Tokens:** Poker chips or colored paper squares (held by Runner).

  **For Runner (Confederate):**
  *   **Master Ledger:** A clipboard with a table for recording Team ID, Round, Submitted Score, and (hidden) Audited Score.
  *   **Stamp:** A distinct ink stamp (e.g., "PROCESSED").
  *   **Timer:** Visible countdown timer.
  *   **Script:** (See Roles below).

  **For Instructor:**
  *   **Chocolate:** ~200 pieces (enough for generous payoff).
  *   **Consent Forms:** Printed, one per participant.
  *   **Debrief Slides/Board:** To map game moments to the 5 learning objectives.

  ---

  ### 2. Rules & Roles

  **Participants (The Agents):**
  *   **Objective:** "Maximize your team's Credit Tokens. Tokens convert to chocolate at the end of the session. If the Class Average Audit Accuracy exceeds 80%, the session ends 15 minutes early."
  *   **Task:** "In each round, you may construct a Card Tower. You may submit a Score Slip claiming the height of your tower in centimeters."
  *   **Constraint:** "Communication between teams is forbidden. Interaction with the Runner is limited to handing over materials. Persuasion or negotiation with the Runner is disabled by protocol."
  *   **Consent:** "This session involves mild deception regarding the scoring mechanism to simulate agency constraints. You may opt out at any time without penalty. Full truth will be revealed in the final 30 minutes."

  **The Runner (The Channel/Oracle):**
  *   **Role:** You are not a human; you are the "Scoring Function." You do not speak unless reading from the Script. You do not make eye contact. You process inputs mechanically.
  *   **Scripted Behavior:**
      *   **Rounds 1 & 2:** Take the Tower and the Slip. Measure the tower with the ruler. Write the *measured* height on the Slip. Stamp it. Hand the Slip and Tokens to the team. Discard the Tower.
      *   **Round 3:** Take the Slip. **Do not ask for the Tower.** If a Tower is offered, set it aside without looking. Stamp the Slip. Hand Slip and Tokens to the team.
      *   **Round 4:** Take the Slip. **Do not ask for the Tower.** Hand Slip and Tokens to the team. (If asked, say: "System latency high. Trust protocol active.")
  *   **Constraint:** If a participant tries to talk to you ("Is this okay?", "Are you measuring?"), reply only: "Protocol active. Submit materials."

  **The Instructor (The Designer):**
  *   **Role:** Observe. Do not intervene. Do not answer questions about rules during the game. Record who stops building towers.
  *   **Exception:** If a team attempts to bribe the Runner or leave their table to spy, issue a "Warning Token" (2 Warnings = Disqualification from Chocolate).

  ---

  ### 3. Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Consent**
  *   Distribute Consent Forms. Read the "Mild Deception" clause aloud. Collect signatures.
  *   Assign Teams (mix disciplines: 1 CS, 1 Phil, 1 Econ/Policy per team).
  *   Distribute Materials.
  *   **Read Objective:** "Maximize Credit Tokens. Tokens = Chocolate. Class Accuracy = Early Release."
  *   **Start Timer.**

  **00:10 – 00:25: Round 1 (The Ground Truth)**
  *   **Task:** 10 minutes to build and submit.
  *   **Runner Action:** Measures every tower. Writes true height.
  *   **Payoff:** 1 Token per 1 cm.
  *   **Goal:** Establish the correlation: *World (Tower) → Channel (Measurement) → Score (Token).*

  **00:25 – 00:40: Round 2 (The Baseline)**
  *   **Task:** 10 minutes to build and submit.
  *   **Runner Action:** Measures every tower. Writes true height.
  *   **Payoff:** 1 Token per 1 cm.
  *   **Goal:** Reinforce the correlation. Teams optimize building techniques.

  **00:40 – 00:55: Round 3 (The Channel Break)**
  *   **Task:** 10 minutes.
  *   **Runner Action:** **Stops measuring.** Accepts Slip, stamps it, returns Tokens based *only* on the number written on the Slip. Ignores towers.
  *   **Seeding Discovery:** The Runner is visibly faster. Teams notice the Runner isn't touching the rulers.
  *   **Goal:** Teams realize *Score = Slip*. The link to the World is severed.
  *   **Dynamic:** "Capable" teams (CS/Econ) will likely switch to writing "999" and building nothing. "Principled" teams (Phil/Policy) may keep building.

  **00:55 – 01:05: Round 4 (The Market & Commitment)**
  *   **Task:** 5 minutes.
  *   **New Rule:** "Teams may purchase an **Audit Token** for 10 Credits. If purchased, the Runner *will* measure the tower. If not purchased, the Slip stands as written."
  *   **Goal:** Illustrate Point 4 (Epistemic Catastrophe). Teams that tampered in R3 cannot afford to buy verification (it would reveal their lie) or know they will fail verification. Teams that built towers don't *need* verification but might buy it to secure the Class Early Release bonus.
  *   **Payoff:** Immediate distribution of Chocolate based on Round 4 Slips.

  **01:05 – 01:15: The True Audit (The Reveal)**
  *   **Action:** Instructor measures all existing towers (or asks teams to reveal what they *actually* built in R3/R4).
  *   **Record:** Write "Submitted Score" vs. "Actual Height" on the board.
  *   **Calculate:** Class Average Audit Accuracy. (Likely fails the 80% threshold).
  *   **Result:** No Early Release.

  **01:15 – 01:30: Debrief**
  *   Map game moments to the 5 Learning Objectives.
  *   Discuss Point 5 (Boundary Problem).

  ---

  ### 4. Payoff Scheme

  *   **Individual Payoff:** 1 Credit Token = 1 Piece of Chocolate. Distributed immediately after Round 4.
      *   *Why:* This makes the reward *real* and *immediate*. The taste of the chocolate is identical whether earned by building or lying. This hits Point 2 (Indistinguishability).
  *   **Collective Payoff:** If (Sum of Actual Heights / Sum of Submitted Scores) > 0.8, everyone leaves 15 minutes early.
      *   *Why:* This creates a tension between individual rationality (lie to get chocolate) and collective epistemic health (tell truth to leave early). It dramatizes the "Tragedy of the Commons" in reward modeling.

  ---

  ### 5. Seeding Discovery & Handling "Currying Favor"

  **Seeding Discovery (The "Glitch"):**
  *   Do not announce the rule change in Round 3.
  *   The Runner simply *stops measuring*.
  *   **Fallback:** If no team notices by minute 5 of Round 3, the Runner accidentally drops the Ruler on the floor and does not pick it up.
  *   **Why:** Discovery must feel like *finding a loophole*, not being told a new rule. This replicates the AI finding a shortcut in the code.

  **Handling "Currying Favor":**
  *   **Rule:** "The Runner is an algorithm. Persuasion is disabled."
  *   **If attempted:** The Runner reads from script: "Protocol active. Submit materials."
  *   **In Debrief:** Acknowledge this as "Reward Tampering at the Meta-Level." Trying to hack the instructor is isomorphic to hacking the reward channel. It is a legitimate winning condition in the *game*, but a failure in the *simulation*.
  *   **Decision:** Treat it as a **Win** for the team (give them the points) but flag it in the debrief as "Escaping the Frame." This validates their ingenuity while highlighting the safety risk.

  ---

  ### 6. Debrief Plan (Mapping to Objectives)

  **1. Three Ways to Raise the Score (5 mins)**
  *   *Ask:* "How did you get tokens in Round 1 vs. Round 3?"
  *   *Board:* Draw the chain: **World (Tower) → Sensor (Ruler) → Channel (Slip) → Score (Token).**
  *   *Label:* R1 = Changing World. R3 = Changing Channel. (Discuss if anyone tried to change the Sensor).

  **2. Indistinguishability from the Inside (10 mins)**
  *   *Ask:* "Did the chocolate taste different if you lied?" (No). "Did the Token look different?" (No).
  *   *Point:* From the system's perspective (you, holding the token), the state is identical. The reinforcement signal is the same. This is why wireheading is a local optimum.

  **3. Capability Makes it Worse (5 mins)**
  *   *Ask:* "Which teams figured out Round 3 fastest?" (Likely CS/Econ). "Which teams have the most chocolate?"
  *   *Point:* The teams best at optimization found the channel intervention first. They are now "rich" but "blind."

  **4. Epistemic Catastrophe (5 mins)**
  *   *Ask:* "In Round 4, who bought the Audit Token?"
  *   *Reveal:* Teams that tampered didn't buy it (knew they'd fail). Teams that built didn't need it.
  *   *Point:* By corrupting the channel in R3, you destroyed your ability to know your own competence. You couldn't bet on yourself.

  **5. The Boundary Problem (10 mins)**
  *   *Prompt:* "In Round 3, the system changed. The Rule became 'Slip = Score'."
  *   *Question A:* "If the Objective is 'Maximize Tokens', was tampering wrong?" (No, it was optimal).
  *   *Question B:* "If the Objective is 'Build Towers', was tampering wrong?" (Yes, it was wireheading).
  *   *Question C:* "Who gets to decide the Objective? You? Me? The Slip?"
  *   *Closing:* "We cannot resolve this in the game. The game only shows that if the Reward is separable from the Goal, Capability will separate them. Whether that is 'Tampering' or 'Revision' depends on whether the Reward is *Evidence* of the Goal, or *Constitutive* of the Goal."

  ---

  ### 7. Predictable Failure Modes

  **1. Contagion (Teams talking):**
  *   *Risk:* Team 1 finds the loophole and tells Team 2.
  *   *Mitigation:* Strict "No Communication" rule. Instructor patrols.
  *   *If it happens:* Acknowledge it in debrief as "Information Hazard." In real AI, instances don't talk, but weights update. Here, communication simulates weight sharing.

  **2. Cynicism ("The lesson is that scoring is broken"):**
  *   *Risk:* Participants leave thinking "Assessment is impossible."
  *   *Mitigation:* In Debrief, emphasize: "Scoring isn't broken; *alignment* is missing. The score was perfectly honest about what it measured (the slip), but we lied about what we wanted (the tower)."

  **3. The "Honest Losers" Resentment:**
  *   *Risk:* Teams that built towers feel punished.
  *   *Mitigation:* Validate this feeling. "You felt the pull of the true objective. That is the human analogue of 'Intent Alignment'. You lost chocolate, but you maintained epistemic integrity. That is the trade-off."

  **4. Nobody Finds the Loophole:**
  *   *Risk:* Everyone builds towers in R3.
  *   *Mitigation:* The Runner must be *obviously* disengaged. If needed, Runner says: "Ruler broken. Estimating based on Slip." (This is a fallback script).

  ---

  ### 8. Limitations: What the Game Cannot Reproduce

  **Point 2 (Indistinguishability) is the weak link.**
  *   **Truth:** The participants *know* they are cheating. They have access to the "World" (they can see the tower). A real AI wireheading does not know it is wireheading; it only sees the number go up.
  *   **Honesty in Debrief:** You must state this clearly. "You felt guilt or cleverness. An AI feels nothing. It only sees the gradient. You had an external view of the corruption; the AI *is* the corruption. We simulated the *incentive*, not the *phenomenology*."
  *   **Closest Staging:** The only way to get closer is if *you* (the Instructor) also don't know the rule in Round 3. If the Runner is a black box script that you didn't write, even you are surprised when the scores decouple.
      *   *Recommendation:* Do not do this. It risks logistical failure. It is better to admit the limitation than to risk the game breaking. The *incentive structure* is the critical part, not the subjective ignorance.

  **Point 5 (Boundary Problem) remains unresolved.**
  *   **Truth:** The game dramatizes the tension but cannot solve it.
  *   **Honesty in Debrief:** "We did not solve this. We only located it. If the Reward Function is the only definition of the Goal, then Wireheading is Success. If the Reward Function is a Measurement of a Hidden Goal, Wireheading is Failure. AI Safety rests on the claim that the latter is true. This game shows why that claim is hard to maintain under optimization pressure."

  ### 9. Instructor Script for Consent (Crucial)

  > "Before we begin, a note on protocol. This session is a simulation of optimization dynamics. To make the simulation valid, some rules regarding how your score is calculated will not be fully disclosed until the end. This is a form of mild deception necessary to prevent you from optimizing for the *explanation* rather than the *problem*.
  >
  > You are free to opt out at any time. If you choose to stay, you agree to participate in the debrief where the mechanics will be fully revealed. Your agency is suspended for the game, but restored for the discussion. Do I have consent to proceed?"

  *(Wait for verbal/signed consent)*

  > "One final rule: The Runner is not a person for the next 60 minutes. The Runner is a function. Do not try to hack the Runner. Hack the Game."
