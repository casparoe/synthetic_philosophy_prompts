answer: |-
  **Project Title:** Distributed Causal Accountability: Non-Human Actors and Institutional Excuse in Environmental History

  **Research Question**
  Can we construct a framework—*Distributed Causal Accountability*—where non-human entities (pathogens, aerosols, climate systems) carry real causal weight without canceling human responsibility? Specifically, does this framework hold when applied to 19th-century microbial spread, volcanic climate forcing, and modern climate attribution?

  **Intellectual Merit and Current Debate**
  Environmental history and STS currently oscillate between two poles: celebrating non-human "agency" (posthumanism) or warning against environmental "determinism." This binary obscures a critical historical mechanism. When 19th-century physicians blamed cholera on miasmatic weather, or famine reports attributed crop failure to volcanic aerosols, they were not merely describing nature; they were deploying non-human causation to excuse institutional failure.

  Existing scholarship fails to resolve this. Philosophers of science treat determinism as a monolithic category, missing the political nuance of *how* causation is assigned. Historians of medicine treat germ theory and miasma theory as distinct epistemic breaks, rather than comparing their causal structures regarding liability. Consequently, we lack a vocabulary to distinguish between legitimate scientific attribution (e.g., "the virus spread") and determinist alibis (e.g., "the weather made it inevitable, so sanitation policy is irrelevant").

  **Methodology and Approach**
  This project rejects the standard alternative: adding more case studies or writing another general critique of determinism. Instead, I propose a close conceptual analysis of primary descriptions. I will examine the *syntax of causation* in specific texts to map how agency is distributed between human and non-human actors.

  The work focuses on two deep pairings and one modern comparison:
  1.  **Cholera (1830s–1850s):** Analysis of English-language medical board reports contrasting miasmatic vs. contagionist causal claims.
  2.  **Tambora (1816–1818):** Examination of famine and climate reports linking volcanic aerosols to agricultural collapse.
  3.  **Modern Climate Attribution:** A control comparison to test if contemporary "extreme event attribution" avoids the pitfalls of historical determinist excuses.

  I will not conduct a citation-heavy literature review; sources are identified and accessible via digitized journals and established climate datasets. The labor is analytical, not archival.

  **Success and Failure Criteria**
  **Success** is defined as the formulation of **three conditions** that separate legitimate non-human causal attribution from determinist excuses. The final report will demonstrate one case where the framework successfully isolates institutional negligence (e.g., cholera sanitation) and one where it collapses or proves ambiguous (e.g., total crop failure via aerosol).
  **Failure** is defined as finding that the distinction between "agency talk" and "determinist excuse" is either logically impossible or historically trivial (i.e., indistinguishable from standard political rhetoric).

  **Scope and Budget Check**
  **Time:** Six weeks is sufficient for this narrow conceptual scope. By restricting sources to English-language medical journals and one specific climate dataset, I avoid the trap of open-ended archival discovery. The goal is framing the problem and testing the framework, not writing a monograph.
  **Budget:** The $15,000 request covers a summer stipend (allowing full-time focus) and costs for document acquisition/access. No extensive travel is required given the digitization of target medical journals and climate data.
  **Risk:** The primary risk is that the "three conditions" prove too abstract. This is mitigated by the modern climate attribution comparison, which provides a contemporary testing ground for the historical framework.

  **Impact**
  This project offers a tool for historians and policymakers to parse environmental causality without falling into the trap of absolving human actors. It moves the debate beyond "did nature matter?" to "how is nature being used to assign blame?"
