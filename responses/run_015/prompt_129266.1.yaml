          *   30: Debrief (The Lecture).

  4.  **Addressing the Learning Outcomes:**
      *   *No Signaling:* During the game, enforce separation. In debrief, explain that even with 85% wins, individual marginals are random (50/50), so no info is transmitted.
      *   *Loopholes:* Map classroom cheats to experimental loopholes.
          *   Passing notes = Communication loophole (Light-speed).
