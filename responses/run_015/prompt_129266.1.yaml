      *   **Loophole Mapping:** Create a specific handout or board section for this.
      *   **The "Why not 100%" question:** Address in debrief. 100% wins with no signaling is impossible (PR boxes violate information causality). 85% is the quantum limit.

  8.  **Refining the "No Signaling" Point:**
      *   How to show this in class?
      *   Have students record not just Win/Loss, but their individual outputs.
      *   In debrief, check: Did Player A's output distribution change based on Player B's input? (It shouldn't). This proves no signaling locally, even if correlations are spooky.

  9.  **Predictable Failures:**
