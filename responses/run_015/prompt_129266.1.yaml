      *Re-evaluating the 3-player (GHZ) option:* The user's friend suggests it because it's deterministic. But the user worries it hides statistics. For *philosophy* students interested in *loopholes*, the statistical version (CHSH) is actually better because Bell's original theorem and the subsequent experimental history (Aspect, etc.) are all about statistics and closing loopholes. GHZ is cleaner logically but pedagogically narrower for this specific goal. I will stick with CHSH (2-player).

      *Final check on the "85% honestly" constraint:* The user says "I can't work out how to stage the 85% case honestly." I need to validate this. You *cannot* stage it honestly with humans. I must tell them to stop trying. The activity is about proving the *classical* limit. The quantum violation is the *reveal*.

