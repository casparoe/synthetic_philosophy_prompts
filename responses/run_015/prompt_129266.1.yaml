      *   If $p=0.75$, $n=100$, $\sigma = \sqrt{100 \cdot 0.75 \cdot 0.25} = \sqrt{18.75} \approx 4.3$.
      *   85 wins is 10 above expectation. That's $>2\sigma$. So ~100 rounds total (12-13 per pair) is enough to see the trend, though individual pairs will vary wildly.
      *   *Time:* 16 students = 8 pairs. 10 rounds takes 10-15 mins. 20 rounds takes 20-30 mins.
      *   *Recommendation:* Run 20 rounds total. 8 pairs $\times$ 20 rounds = 160 data points. Enough for a histogram.

  6.  **Addressing the "Honesty" of the 85%:**
      *   I must tell the user: **Do not try to simulate the 85% with students.** It requires cheating.
      *   Instead: Students play the "Classical" game. They will fail to exceed 75%. Then the instructor presents "Nature's Scorecard" (pre-calculated quantum stats) and says "This is what atoms do." The cognitive dissonance is the lesson.

