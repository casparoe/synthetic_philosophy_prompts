answer: |-
  Here is a complete plan for your 80-minute session. It is designed to maximize philosophical engagement while respecting the logistical constraints of a classroom and the mathematical limitations of human simulation.

  ### Part 1: The Design Decision (2-Player vs. 3-Player)

  **Run the 2-Player (CHSH) Version.**
  Do not run the 3-player (GHZ) version. While GHZ is logically cleaner (a single-round contradiction), it is pedagogically weaker for your specific goals.
  *   **Why:** Your second learning outcome is about *loopholes* and *statistics*. Real Bell tests are statistical battles against noise and detection efficiency. The 2-player game naturally generates a distribution of scores (some pairs get 70%, some 80% by luck), which allows you to discuss standard deviation, sample size, and the "detection loophole" (discarding bad rounds). The 3-player version is a magic trick; the 2-player version is an experiment.
  *   **The 85% Problem:** You are correct. You cannot honestly stage the 85% win rate with human students. Humans are classical objects. If they beat 75%, they are cheating (signaling). **Do not try to simulate the quantum win rate live.** Instead, have the students exhaustively prove they *cannot* beat 75%. Then, in the debrief, present the 85% as a fact about nature (data from actual experiments) that contradicts their lived experience. The cognitive dissonance *is* the lesson.

  ### Part 2: Activity Design — "The Coordination Challenge"

  **Forbidden Words:** Bell, Locality, Entanglement, Quantum, Particle, Spin.
  **Allowed Words:** Players, Referees, Inputs, Outputs, Cards, Rounds, Score.

  **Materials List:**
  *   **8 Pairs of Students:** (16 students total).
  *   **Separation:** Arrange the room so pairs cannot see or hear each other. (e.g., Pair 1 in hallway/corner, Pair 2 back-to-back with dividers, etc.). If you have TAs, use them as monitors. If not, use the "Honor System + Random Audit" method.
  *   **Input Decks:** 2 decks of cards per pair.
      *   Deck A (Red/Blue).
      *   Deck B (Red/Blue).
      *   *Note:* Red = 0, Blue = 1.
  *   **Output Slips:** Small paper slips for writing answers (0 or 1).
  *   **Master Scoreboard:** Whiteboard to track aggregate wins.
  *   **Randomizer:** A coin or die for the Referee (you) to determine input cards if not using pre-shuffled decks.

  **The Rules (Write these on the board):**
  1.  **Goal:** Maximize the team's win rate over 20 rounds.
  2.  **Setup:** Partners separate. No communication once the round begins.
  3.  **The Round:**
      *   Referee deals one card to Player A (Red or Blue).
      *   Referee deals one card to Player B (Red or Blue).
      *   Players look at their own card *only*.
      *   Players write down a number: **0** or **1**.
      *   Players reveal answers simultaneously.
  4.  **Winning Condition:**
      *   If **EITHER** card is **Red**: Players must **MATCH** (00 or 11).
      *   If **BOTH** cards are **Blue**: Players must **MISMATCH** (01 or 10).
  5.  **Pre-Game:** You have 5 minutes to agree on a strategy before separating.

  **Payoff Scheme:**
  *   **Candy:** Every pair that exceeds the "Class Limit" (75%) gets a prize. (Spoiler: None will, if rules are followed).
  *   **Participation:** Everyone gets credit, but the debrief discussion counts toward participation grade.

  ### Part 3: Logistics & Arithmetic

  **Time Allocation (80 Minutes):**
  *   **0:00–0:10:** Setup & Rules. (Emphasize the "No Communication" rule).
  *   **0:10–0:15:** Strategy Session. (Let them collude. They will likely agree on "Always say 0" or "Match the card color").
  *   **0:15–0:45:** The Game (30 mins).
      *   Run 20 Rounds.
      *   Each round takes ~1.5 minutes (deal, think, write, collect, record).
      *   *Crucial:* Collect the input cards and output slips every round to prevent pattern learning.
  *   **0:45–0:55:** Data Aggregation. (Calculate win % per pair and total).
  *   **0:55–1:20:** The Debrief (Lecture & Discussion).

  **The Arithmetic of Distinguishability:**
  You need enough rounds to distinguish a 75% strategy (Classical) from an 85% device (Quantum) statistically, though in this activity, you are primarily demonstrating the 75% ceiling.
  *   **Expected Value (Classical):** 75% wins.
  *   **Standard Deviation:** For $N=20$ rounds, $\sigma = \sqrt{20 \times 0.75 \times 0.25} \approx 1.94$ rounds.
  *   **Significance:** A score of 17/20 (85%) is 2 standard deviations above the mean (15/20). It is statistically possible for a classical pair to get lucky and hit 85% in 20 rounds (approx. 5% chance).
  *   **Solution:** Aggregate the data from all 8 pairs. Total rounds = 160.
      *   Expected Classical Wins: 120.
      *   $\sigma_{total} \approx \sqrt{160 \times 0.75 \times 0.25} \approx 5.5$.
      *   If the class aggregate stays near 120 (75%), the limit is visible. If you present "Nature's Data" (136 wins / 85%), the gap is $16$ wins, which is $>3\sigma$. This is robust enough for a seminar demonstration.

  **Predictable Failures & Mitigations:**
  1.  **Signaling:** Students will cough, tap feet, or time their pen drops.
      *   *Fix:* Announce random audits. "I will disqualify any pair where I suspect signaling." Make the penalty severe (automatic loss).
  2.  **Small Sample Noise:** One pair might get 90% by luck.
      *   *Fix:* Do not focus on individual pairs. Focus on the *class average*.
  3.  **Confusion:** Students forget the win condition (Match vs. Mismatch).
      *   *Fix:* Keep the win condition projected on the screen/board throughout the game.
  4.  **Boredom:** 20 rounds can drag.
      *   *Fix:* Keep the pace brisk. Use a timer.

  ### Part 4: The Debrief (Where the Forbidden Words Are Spoken)

  This is where you convert the game into philosophy. Do not rush this.

  **1. The Wall (10 mins)**
  *   Reveal the math: With pre-agreed strategies (Local Hidden Variables), the maximum win rate is exactly 75%.
  *   Ask: "Did anyone beat 75%?" (Likely no, or only by luck).
  *   **Speak the Word:** "You just hit the **Bell Inequality**. You were playing a **Local** game."

  **2. The Loophole Map (10 mins)**
  Address your second learning outcome. Draw a table on the board. Ask students how they *could* have cheated, then map it to physics.

  | Classroom Cheat | Experimental Loophole | Philosophical Implication |
  | :--- | :--- | :--- |
  | **Passing notes/signaling** | **Communication Loophole** | Information traveled faster than light (violates Relativity). |
  | **Referee picking cards based on student stance** | **Freedom of Choice / Measurement Independence** | The universe conspires to hide the truth (Superdeterminism). |
  | **Discarding rounds where we messed up** | **Detection Loophole** | We only see the data that fits the theory (Selection Bias). |
  | **Agreeing on strategy after seeing cards** | **Retrocausality** | The future affects the past. |

  *   **Honesty Check:** Admit which loopholes *this* activity cannot close.
      *   *You cannot close the Freedom of Choice loophole.* You chose the cards. A skeptic could say you biased the deal to make them lose. (In real experiments, they use cosmic photons to choose settings).
      *   *You cannot close the Detection Loophole perfectly.* If a student drops a pen and you ignore that round, that's data loss.

  **3. No-Signaling vs. Correlation (5 mins)**
  Address your first learning outcome.
  *   Ask: "If Player A sees a Blue card, do they know what Player B got?" (No).
  *   Ask: "If Player A sees a Blue card, does their *own* output probability change?" (No, it should be 50/50 0 or 1 regardless).
  *   **Point:** Even if nature wins 85% of the time (Quantum), Player A cannot tell *what* Player B was asked by looking at their own results. The correlation is only visible when comparing lists *afterward*.
  *   **Conclusion:** Correlation $\neq$ Communication. Relativity is safe.

  **4. The 85% vs. 100% Question (Optional/Conceptual)**
  Address your third learning outcome. You asked if you can make them *feel* why 100% is impossible without signaling.
  *   **Verdict:** Do not try to stage this. It requires the "PR Box" (Popescu-Rohrlich) concept which is too technical for an 80-minute session without math.
  *   **What to say instead:** "Imagine a box that won 100% of the time. It turns out, if a system wins 100% of this game without signaling, it allows for 'trivial communication complexity'—basically, it would allow you to solve any computational problem instantly by sharing data. Nature seems to limit itself to 85% (Tsirelson's Bound) to preserve a reasonable structure of information. 85% is the maximum 'spookiness' allowed before the universe becomes computationally absurd."
  *   *If they look glazed over, cut this.* It is better they understand 75% vs. >75% than to confuse them with Information Causality.

  ### Part 5: Honest Limitations (For Your Closing)

  You asked for a frank note on what this activity cannot reproduce. Put this on the board at the very end.

  1.  **The "Black Box" Problem:** In this game, the students *are* the particles. In real experiments, we don't know what the particles "are." We only see the statistics. The activity makes the "hidden variable" (the student's brain) too visible.
  2.  **The 85% Simulation:** We did not simulate the quantum win rate. We asserted it. You must tell them: "I am asking you to trust the experimental physics community that atoms actually do this. My job is to show you why that claim is weird."
  3.  **Space-like Separation:** We separated students by 10 feet, not 10 kilometers. We relied on honor, not light-speed constraints.

  ### Summary Checklist for You
  *   [ ] **Print Rules:** Have the win condition visible at all times.
  *   [ ] **Prep Data:** Have a sheet of "Quantum Results" (85% win rate, random marginals) ready to hand out in the debrief so they can verify the no-signaling condition themselves.
  *   [ ] **Monitor Cheating:** Walk around during the game. If you catch signaling, disqualify the pair publicly (it reinforces the locality constraint).
  *   [ ] **Stick to Time:** Do not let the game run long. The value is in the debrief.

  This plan respects the "no lecture" constraint by making the *failure* of the students the primary experience. They will feel the constraint of classical logic physically before you name it philosophically.
