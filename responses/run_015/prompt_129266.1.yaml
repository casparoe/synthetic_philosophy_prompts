      *   *CHSH (2-player):* Statistical (75% vs 85%). Requires many rounds. *Upside:* Mirrors actual history/experiments, easier to discuss loopholes (detection efficiency, freedom of choice), easier to manage pairs (8 groups).
      *   *Decision:* The prompt asks for a recommendation. Given the philosophy major audience and the specific desire to discuss loopholes/statistics/signaling, the **2-player (CHSH) version is superior**. GHZ is too "magic trick"-ish for a seminar focused on the *structure* of the argument and experimental loopholes. However, 85% is hard to simulate *honestly* without quantum hardware.
      *   *The "85% Problem":* The user correctly identifies they can't honestly simulate the quantum win rate without actual quantum mechanics or cheating. If the instructor simulates the "quantum" part, it undermines the point (the instructor becomes the hidden variable).
      *   *Solution:* Run the *classical* game first (students try to beat 75%). Let them fail. Then, *reveal* the quantum prediction (don't simulate it live, just state the result or use a pre-recorded "black box" data set). Actually, better yet: Let them play the classical game. Then explain that *if* nature were quantum, the score would be higher. Then discuss *why* they couldn't reach it.
      *   *Wait, refinement:* The prompt asks to "stage the 85% case honestly." This is physically impossible in a classroom without actual entangled photons. If I tell them to fake it, it violates the "honestly" constraint. If I use a computer simulation, it's a "black box."
      *   *Best Approach:* Have the students play the *classical* strategy game. They will hit the 75% wall. Then, introduce a "Black Box" (a laptop running a simulation or pre-generated data) that represents the "Quantum Machine." The students verify the Black Box's output against the rules. This separates the *strategy* (local hidden variables) from the *statistics* (quantum mechanics).
      *   *Actually, looking closer at the prompt:* The user says "I can't work out how to stage the 85% case honestly... all involve someone peeking." The honest answer is: **You can't.** You have to admit this limitation. The activity should focus on the *impossibility* of the students beating 75% locally. The "85%" is the theoretical counterfactual provided by the instructor *after* the struggle.
      *   *Revised Plan:* Stick to the 2-player game. Students try to win. They will max out at 75%. The "Quantum" case is introduced as data *provided* by the instructor (representing nature), not played by students. This preserves the "no cheating" integrity.

  3.  **Design the Activity (The CHSH Game):**
      *   **Setup:** 8 pairs. Separated (back-to-back or opposite corners).
      *   **Inputs:** Referee (Instructor + TAs/Helpers) gives Random Bits (0/1 or Red/Blue) to each player.
      *   **Outputs:** Players write down 0/1 (Yes/No).
      *   **Win Condition:** $a \oplus b = x \cdot y$ (Addition mod 2 equals AND of inputs).
          *   If inputs are (0,0), (0,1), (1,0) -> Outputs must be same (00 or 11).
          *   If inputs are (1,1) -> Outputs must be different (01 or 10).
      *   **Materials:** Cards for inputs, slips for outputs, scoreboards.
      *   **Time:** 80 mins.
          *   10: Intro/Rules (No forbidden words).
