answer: |-
  This is a sophisticated and philosophically robust strategy. Grounding Lexical Threshold Negative Utilitarianism (LTNU) in the **incommensurability of value** rather than a simple weighting of utilities avoids many standard objections (like the "utility monster" or arbitrary threshold accusations). However, there are three critical areas where your draft needs tightening to withstand scrutiny: the relationship between incommensurability and lexicality, a tension in your definition regarding the threshold, and the specific response to the commensurability critic.

  Here is an analysis of your setup and specific recommendations for each of your questions.

  ### 1. Is this the right way to set the argument up?

  **The Strength:**
  Your appeal to phenomenological incommensurability is the strongest foundation for LTNU. It bypasses the need to prove that pain is *infinitely worse* than pleasure (which is metaphysically dubious) and instead argues that they are *different kinds* of things. This aligns well with the intuition that pain has a "demandingness" or "urgency" that pleasure lacks.

  **The Weakness (Crucial Correction):**
  There is a tension between your definition of the view and your case study.
  *   **Your Definition (i):** "Lifting someone from below that point **up to it**... matters lexically more."
  *   **Your Case Study:** The programme removes severe pain, but the people **remain below the neutral point** afterwards.

  Strictly speaking, under definition (i), your view might not mandate choosing the pain relief programme if it doesn't cross the threshold. If the lexical priority is triggered only by *reaching* neutrality, then alleviating severe suffering that leaves someone in moderate suffering might not lexically outweigh the millions of delights.
  *   **Fix:** You should adjust the definition to focus on the **presence** of suffering below the threshold, not just the transition to neutrality.
  *   **Revised Phrasing:** "The existence of any state below the neutral threshold lexically outweighs any sum of states above it. Therefore, preventing or mitigating suffering below the threshold is lexically prior to generating pleasure above it."
  *   **Why:** This ensures your case study works. The 1,000 people are in a lexically forbidden state (severe pain); the 10 million are in a permissible state (contentment/delight). You are not choosing the *better* outcome; you are removing a *forbidden* state.

  ### 2. Should incommensurability entail the lexical claim or be independent support?

  You should present incommensurability as **independent support that necessitates a normative bridge**, rather than a strict logical entailment.

  **The Problem with Entailment:**
  Incommensurability logically leads to *incompleteness*, not necessarily *lexical priority*. If $A$ (pain relief) and $B$ (pleasure creation) are incommensurable, the formal relation is $A ? B$. It does not automatically follow that $A > B$. A critic could argue: "If they are incomparable, why does the negative win? Why not flip a coin? Why not prioritize the positive?"

  **The Solution: The Normative Bridge:**
  You need to explicitly state a normative premise that connects incommensurability to negative priority. This is often called the **Asymmetry of Urgency**.
  *   **Premise 1 (Metaphysical):** Pleasure and pain are phenomenologically distinct and incommensurable (no common currency).
  *   **Premise 2 (Normative):** In cases of incommensurability involving basic welfare, the prevention of harm is rationally mandatory in a way that the provision of benefit is not. (This draws on the "morality of rescue" or the intuition that we have stronger duties not to harm than to help).
  *   **Conclusion:** Therefore, we adopt a lexical decision rule that prioritizes the negative.

  **Recommendation:** Do not say incommensurability *entails* lexicality. Say that incommensurability **destroys the justification for trade-offs** (Classical Utilitarianism), and given that trade-offs are impossible, the **default rational policy** is to prioritize the urgent claim (suffering) over the non-urgent claim (pleasure). This makes your view a hybrid of value theory (incommensurability) and decision theory (pessimistic ordering).

  ### 3. How to answer the critic: "If they shared a scale, LTNU fails."

  The critic argues that your view is contingent on a empirical/metaphysical claim (that there is no hedonic scale) which might be false. If neuroscience finds a common "hedonic currency" (e.g., dopamine/opioid ratios), your view collapses.

  **Response Strategy A: Phenomenology Trumps Physics**
  Argue that moral value tracks **experience**, not **neural correlates**. Even if a single neural mechanism underlies both pleasure and pain, the *first-person experience* is valenced differently. One is an aversion; the other is an attraction. Morality is concerned with the "what it is like," not the "what is happening in the brain." Therefore, even if they are physically commensurable, they are morally incommensurable.

  **Response Strategy B: The Conceptual Truth**
  Argue that "pleasure" and "pain" are conceptually distinct valences. To say they are on a single scale where $+10$ pain cancels $-10$ pleasure is to misunderstand the concepts. Pain is not "negative pleasure"; it is a distinct phenomenological category. The claim that they share a scale is a category error, not an empirical discovery waiting to be made.

  **Response Strategy C: The "Even If" Defense**
  Concede the point for the sake of argument but show LTNU survives.
  *   "Even if there were a common cardinal scale, one could still hold that the *disutility* function is lexical. However, my specific defence relies on incommensurability because it is the more honest account of our experience. If you insist they are commensurable, you must explain why we intuitively feel they cannot be traded. LTNU explains that intuition; Classical Utilitarianism ignores it."

  ### 4. Refining the "Not Better" Claim

  You wrote: *"I want to say that it must fund the first, and that it must say so not because the first outcome is better but because the second is not even a candidate for comparison."*

  This is a very strong move (akin to a deontological constraint within consequentialism), but be careful with the wording.
  *   **Risk:** If outcome $A$ is obligatory and outcome $B$ is inadmissible, in what sense is $A$ not "better"? In decision theory, if you *must* choose $A$, $A$ is revealed as preferred.
  *   **Refinement:** Distinguish between **Aggregative Value** and **Choice-Worthiness**.
      *   *Aggregative Value:* You can say the two outcomes are **incomparable** in terms of total "goodness" because there is no common unit to sum them.
      *   *Choice-Worthiness:* You can say $A$ is **strictly more choice-worthy** than $B$ because $B$ violates a lexical constraint.
  *   **Why this helps:** It allows you to maintain the incommensurability claim (no common scale to measure "betterness") while maintaining the action-guiding force of LTNU (we must choose $A$).

  ### Summary of Suggested Revisions

  1.  **Adjust the Definition:** Ensure the lexical priority applies to the *mitigation of suffering below the threshold*, not just *lifting agents to the threshold*. Otherwise, your case study fails.
  2.  **Split the Argument:** Treat Incommensurability as the metaphysical premise and Negative Priority as the normative response to that premise (via the Asymmetry of Urgency), rather than one entailing the other.
  3.  **Clarify "Better":** Use the distinction between *incomparable value* (axiology) and *mandatory choice* (practical rationality) to defend the claim that $A$ isn't "more good" in a summative sense, but is the only permissible option.
  4.  **Defend Phenomenology:** Against the critic, insist that moral commensurability requires phenomenological commensurability, which does not exist regardless of neural underpinnings.

  This approach makes your defence of LTNU much harder to dismiss as arbitrary. It grounds the view in the structure of experience and the logic of moral urgency rather than a mere stipulation of weights.
