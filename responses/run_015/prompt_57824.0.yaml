          *   *Phenomenology:* What it *feels* like to be conditioned vs. to choose. Philosophy talks about justification; Literature talks about experience.

      *   **Conclusion:**
          *   Summarize the contribution.
          *   Literature adds the *stakes* and the *sensory reality* of the theories.
