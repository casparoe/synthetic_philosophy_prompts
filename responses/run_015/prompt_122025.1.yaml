answer: |-
  # Game Title: The Wall & The Lock

  ## Setup
  *   **Room:** 5 tables of 6 players. One large whiteboard at the front ("The Public Square").
  *   **Materials (Craft Store):**
      *   150 Poker Chips (100 White "Security Points", 50 Red "Threat Tokens").
      *   30 Index Cards (Pre-written "Quirk Cards," see below).
      *   50 Strips of Paper & Markers (For writing Rules).
      *   Masking Tape (To tape Rules to the whiteboard).
      *   5 Small Bowls (Community Pots).
      *   1 Deck of "Event Cards" (You create these).
      *   Printed "Constitution Sheets" (One per table, see *Rules* below).
  *   **Pre-Game Prep:**
      *   Deal 6 Quirk Cards to each table (face down). Players draw one each at start.
      *   Place 20 White Chips in each Table's Community Pot.
      *   Give each player 5 White Chips personally.
      *   Tape a "Price List" to the wall: *New Rule = 3 Tables Vote YES. Remove Rule = 5 Tables Vote YES. Private Lock = 2 Personal Chips.*

  ## The One Sentence
  Before distributing the Constitution Sheets, stand at the front and say only this:
  **"Your goal is to finish with the most personal points, but if the Community Pot at your table hits zero, everyone at that table loses everything."**

  ## Rules (Printed on Constitution Sheet at each table)
  *Do not explain these verbally. Players must read them.*

  1.  **Rounds:** There are 6 Rounds. Each lasts 7 minutes.
  2.  **Threat:** At the start of each round, reveal one Event Card. It shows a **Threat Level (1–5)**.
  3.  **Defense:** Your Defense = (Number of Rules on the Whiteboard) + (Number of Private Locks you own).
  4.  **Damage:** If Threat > Defense, you lose (Threat − Defense) chips from your *Personal* stash. If you have no personal chips, take from *Community Pot*.
  5.  **Legislation (Minutes 0–2):** Tables discuss. To **Add a Rule**, 3 of 5 tables must raise a GREEN card. To **Remove a Rule**, 5 of 5 tables must raise a GREEN card. (Facilitator will tally).
  6.  **Market (Minutes 2–4):** You may buy **Private Locks** for 2 Personal Chips each. (Write your name on a slip, hand to Facilitator, receive a token).
  7.  **Enforcement (Minutes 4–7):**
      *   **Compliance Tax:** If there are 4 or more Rules on the Whiteboard, every player pays 1 Chip to the Community Pot.
      *   **Quirk Check:** If you hold a Quirk Card that contradicts a Rule on the Whiteboard (e.g., Rule: "No Pets," Quirk: "Dog Owner"), you lose 2 Personal Chips immediately.
      *   **Survival:** Resolve Damage based on Threat vs. Defense.

  ## Quirk Cards (Examples)
  *   "You work night shifts." (Contradicts: "Curfew," "Quiet Hours")
  *   "You have a large dog." (Contradicts: "No Pets," "Leash Law")
  *   "You host gatherings." (Contradicts: "No Guests," "Noise Limit")
  *   "You repair engines." (Contradicts: "No Machinery," "Clean Streets")
  *   "You wear non-traditional dress." (Contradicts: "Uniform Policy")
  *   "You are a traveler." (Contradicts: "Residency Check")

  ## Event Deck (Create 6 Cards)
  1.  **Threat 1** (Low)
  2.  **Threat 2** (Low)
  3.  **Threat 5** (CRISIS — Guaranteed Panic)
  4.  **Threat 1** (Low — Post-Crisis)
  5.  **Threat 2** (Low)
  6.  **Threat 3** (Medium)

  ## Timings (75 Minutes Total)
  *   **00:00 – 00:10:** Seating, distribute materials, read The One Sentence.
  *   **00:10 – 00:55:** Gameplay (6 Rounds x 7 mins + 3 min buffer for voting tally).
      *   *Facilitator Role:* Stand at the whiteboard. Hold Green/Red cards for tables to see. Tally votes silently. Tape Rules. Collect Lock slips. Point to the clock. Do not speak.
  *   **00:55 – 01:15:** Debrief Discussion.

  ## Point Payoffs
  *   **Personal Chips:** Score = 1 point per chip.
  *   **Community Pot:** If >10 chips at end, each player gets +5 bonus. If 0, all personal scores become 0.
  *   **Private Locks:** Have no value at end (they are sunk costs).

  ---

  # Debrief Guide (20 Minutes)
  *Do not lecture. Ask these questions in order. Write their answers on the board.*

  **1. The Private Burden (Precaution Displacement)**
  *   *Ask:* "Look at Round 1 and 2 (Low Threat). Did anyone buy Private Locks? Why?"
  *   *Ask:* "Look at Round 4 (After the Crisis). The Threat was low, but did you keep your Locks?"
  *   *Map:* "In a 'Loose' society (few Rules on the wall), you likely bought Locks. The society *looked* free, but you were personally paying for safety. That is **Precaution Displacement**. The risk didn't vanish; it moved from the law to your wallet."

  **2. The Sticky Rules (The Ratchet)**
  *   *Ask:* "After Round 3 (The Crisis), how many Rules were on the wall? Could you remove them in Round 4?"
  *   *Map:* "It took only 3 tables to add a rule in panic, but 5 tables to remove it in peace. That is **The Ratchet**. Fear creates rules easily; trust removes them slowly. You likely stayed 'Tight' even when the threat passed."

  **3. The Cost of Conformity (Resentment)**
  *   *Ask:* "Who lost points during Enforcement because of their Quirk Card, even if they didn't break the rule intentionally?"
  *   *Ask:* "How did it feel to pay the Compliance Tax when there were many Rules?"
  *   *Map:* "Tight societies reduce risk, but they tax everyone (Compliance Tax) and punish harmless differences (Quirk Check). That low-grade anger you felt? That is the cost of enforcement that can't tell harmless from harmful."

  **4. The Tradeoff**
  *   *Ask:* "Which round did you feel safest? Which round did you feel freest? Were they the same round?"
  *   *Close:* "Tightness buys safety through visibility. Looseness buys freedom through invisibility. Neither is free."

  ---

  # Predictable Failures (First Run)
  1.  **The Voting Bottleneck:** 30 people trying to coordinate 5 table votes silently will take 5 minutes instead of 2.
      *   *Fix:* Appoint one "Speaker" per table in the first minute. Only Speakers raise vote cards.
  2.  **The Free Rider:** Players will let their Community Pot die to save Personal Chips.
      *   *Fix:* Ensure the "Everyone loses if Pot hits zero" rule is bolded on the Constitution Sheet.
  3.  **Facilitator Slip:** You will want to clarify a rule when a table argues.
      *   *Fix:* Point to the Constitution Sheet. If they still argue, shrug and point to the clock. Your silence is part of the data.
  4.  **Lock Confusion:** Players may forget they need Locks *before* the Threat is resolved.
      *   *Fix:* Use a visual timer. When the "Market" phase ends, physically sweep the table for Lock slips. No late buys.

  # Limitations (What You Must Say Out Loud)
  *After the debrief questions, you must break character and say this:*

  "This game simulates the *cost* of norms, but it misses the *benefit* of looseness. In the game, Looseness just means 'higher risk.' In reality, Looseness also means innovation, warmth, and the ability to breathe. The game makes Tightness feel efficient and Looseness feel dangerous. In real life, Tightness can also feel suffocating and Looseness can feel like home. We felt the tradeoff, but don't mistake the points for the whole truth."
