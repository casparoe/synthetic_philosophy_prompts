      *   **Phase 4: Enforcement.**
          *   If Rules > 3, everyone pays "Compliance Tax" (1 Chip). (The Resentment/Cost of Tightness).
          *   Also, check Quirks. If you have a Quirk that violates a Rule, you lose extra chips.
      *   **Win Condition:** Most chips at end. If Community Pot hits 0, everyone loses (Society Collapsed).

      *Wait, I need to ensure Precaution Displacement is felt.*
      If the group votes "Loose" (few rules), the Threat Severity is high.
      Players *must* buy Locks to survive.
      The *group* looks free (few rules on the wall), but individuals are spending heavily on Locks.
      If the group votes "Tight" (many rules), Threat Severity is low.
      Players don't need Locks. But they pay Compliance Tax.
      *The Trap:* Tightness feels oppressive (Tax + Quirk punishment). Looseness feels risky (High Threat). Players will oscillate, but the Ratchet keeps them Tight.

      *Refining the Ratchet:*
      To Add a Rule: 3 out of 5 Tables agree.
      To Remove a Rule: 5 out of 5 Tables agree. (Unanimous). This creates the stickiness.

      *Refining Resentment:*
      Quirk Cards are dealt at start. "You work nights," "You have a dog," "You play drums."
      Rules are generic: "Quiet hours," "No pets," "No loud noises."
      If Rule exists, anyone with matching Quirk loses 2 chips automatically during Enforcement. This simulates punishment for *being* the type of person the rule restricts, not necessarily breaking it.

  9.  **Drafting the Debrief:**
      *   Map the "Locks" to private precautions (alarms, gated communities).
      *   Map the "Unanimous Vote" to the Ratchet (fear makes us keep rules).
      *   Map the "Quirk Tax" to the cost of conformity.
      *   Limitations: Game is finite, real life isn't. Game has clear points, real life has ambiguous well-being.

  10. **Review against Constraints:**
      *   30 adults? Yes (5 tables of 6).
      *   75 mins? Yes.
      *   Materials? Craft store (chips, cards, markers, tape).
