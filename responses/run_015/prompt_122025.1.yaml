      *   Precaution Displacement? Yes (Locks vs. Rules).
      *   Ratchet? Yes (3/5 to add, 5/5 to remove).
      *   Resentment? Yes (Quirk Cards).

  11. **Self-Correction on "Facilitator Silence":**
      *   If I say *nothing* during play, confusion will kill the game.
