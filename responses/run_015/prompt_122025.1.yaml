prompt: |-
  I run a six-week evening discussion series on social norms — about 30 adults, mixed ages, almost no philosophy background, 75 minutes a session. I want one session to be a game where they feel the tight/loose tradeoff (how much rule-following a society should demand) instead of me standing up and explaining it. Design it.

  Two things I want built into the rules rather than named afterwards. First, what I've started calling precaution displacement: in a loose society precautions don't disappear, they get pushed onto individuals and go invisible — locks, background checks, only meeting people through friends — so a society can look relaxed while total caution is unchanged. I want players to have the option to buy private protection when the group is loose, and to notice on their own that they do. Second, the ratchet: loosening should be harder than tightening, so a group that panics once stays tight after the threat is gone. I'd also like them to feel the low-grade resentment of having harmless eccetricities squashed by enforcement that can't tell harmless from harmful.

  Give me the setup, the rounds, materials (nothing I can't get at a craft store), point payoffs with no real money, the one thing the facilitator says before play starts and nothing more, and timings. Then a debrief that maps specific moments onto the tradeoff, what will predictably go wrong the first time I run it, and honestly which part of the real question the game can't stage at all and I'll just have to say out loud.
reasoning: |-
  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**
      *   **Context:** Six-week evening discussion series, social norms, 30 adults, mixed ages, no philosophy background, 75 mins/session.
      *   **Goal:** One session dedicated to a game experiencing the Tight/Loose tradeoff (Gelfand's theory).
      *   **Key Mechanics to Embed (not explain upfront):**
          1.  *Precaution Displacement:* In loose societies, precautions become private/invisible (locks, background checks). Players should have the option to buy private protection when rules are loose.
          2.  *The Ratchet:* Loosening is harder than tightening. Panic leads to lasting tightness.
          3.  *Resentment of Enforcement:* Harmless eccentricities get squashed by blunt enforcement.
      *   **Deliverables:** Setup, Rounds, Materials (craft store), Point Payoffs (no real money), The One Sentence Intro, Timings, Debrief (mapping moments to concepts), Predictable Failures, Limitations (what the game *can't* do).
      *   **Constraint:** The facilitator says *one thing* before play starts and nothing more (during play).

  2.  **Deconstruct the Core Concepts for Gamification:**
      *   *Tight/Loose:* Needs a mechanism for setting rules and enforcing them.
      *   *Threat:* Needs a random event that punishes the group if they aren't "safe" enough.
      *   *Precaution Displacement:* Needs a shop or action phase where individuals can spend points to protect *themselves* specifically, distinct from group rules.
      *   *The Ratchet:* Needs an asymmetry in voting or rule-changing. Easy to add rules, hard to remove them.
      *   *Resentment:* Needs a mechanic where "rule-breaking" is randomized or ambiguous, punishing harmless actions alongside harmful ones.

  3.  **Drafting the Game Mechanics:**
      *   *Name:* "The Village Wall" or "Common Ground." Let's go with "The Commons."
      *   *Players:* 30 people. Too many for one circle. Need small groups (tribes) competing or cooperating? If they compete, they might not feel the societal pressure. If they cooperate as one big society, logistics get messy. Let's try 5 groups of 6. They are "factions" within one society, or just one big society playing in parallel?
      *   *Decision:* One big society is better for "social norms." But 30 people voting is slow. Let's make them 5 "Households" of 6 people. They share a common pool of safety but manage their own risks.
      *   *Resource:* "Trust Tokens" (points).
      *   *Threat:* "Calamity Cards."
      *   *Rules:* "Norm Cards."
      *   *Private Protection:* "Shields" or "Locks."
      *   *The Ratchet Mechanism:* To remove a rule, you need a supermajority. To add a rule, simple majority. Or, once a rule is added, it costs more to remove than to add. Let's go with: *Adding a rule costs 1 group vote. Removing a rule costs 3 group votes.*
      *   *Precaution Displacement:* If the group rule is "Loose" (few rules), Calamity risk is high. Individuals can buy "Locks" to negate Calamity for themselves, but it costs personal points.
      *   *Resentment:* Enforcement isn't perfect. If a rule exists, roll a die. On a 1, someone gets punished even if they didn't break the rule, or someone gets punished for a "minor" infraction that costs points. Better: "Inspection." If rules are Tight, everyone loses time/points to inspection, even if innocent.

      *Refining the Mechanics for Flow:*
      *   *Round Structure:*
          1.  Threat Reveal (Is there a danger?)
          2.  Legislation Phase (Set the Rules).
          3.  Action Phase (Live your life/Earn points).
          4.  Enforcement/Calamity Phase (Did we survive?).
      *   *The "Eccentricity" Mechanic:* Players get "Quirk Cards." Some are harmless, some are risky. If rules are Tight, *all* Quirks are scrutinized. If Loose, only risky ones matter *unless* you bought private protection.
      *   *The "Ratchet":* Rules are physical tokens placed on the table. To add a token: 50% vote. To remove a token: 80% vote.
