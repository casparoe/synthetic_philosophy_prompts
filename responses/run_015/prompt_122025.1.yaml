      *   **Setup:** 5 tables of 6.
      *   **Currency:** Chips.
      *   **Rounds:** 6 Rounds.
      *   **Phase 1: Threat.** Reveal a Threat Card (e.g., "Fire," "Theft," "Sickness"). It has a severity number.
      *   **Phase 2: Legislation.** Propose Rules to lower Severity.
