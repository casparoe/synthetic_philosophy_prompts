      *Let's sharpen the "Resentment".*
      Players get "Personality Cards" (e.g., "Likes loud music," "Works night shift").
      If a Rule exists ("No noise after 8pm"), anyone with that card loses points automatically during Enforcement, regardless of whether they actually made noise. The rule punishes the *potential* or the *identity*, not just the act.

  4.  **Developing the Script (The One Sentence):**
      *   Must not explain the concepts. Must only explain the goal.
