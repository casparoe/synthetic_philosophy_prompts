  12. **Final Polish:**
      *   Make sure the "Precaution Displacement" is clear. If the society is Loose, the Threat is high. You *have* to buy Locks. The society *looks* loose (few rules on wall), but everyone is spending chips on Locks. Total chips spent on Locks > Chips saved by not having Rules.
      *   Make sure the "Ratchet" triggers. Introduce a "Crisis Round" (Round 3) where Threat is guaranteed high. They will panic-add rules. Then in Round 4, Threat is low, but they can't remove rules easily.

  13. **Writing the Output:** Structure exactly as requested. Setup, Rounds, Materials, Payoffs, The One Sentence, Timings, Debrief, Failures, Limitations.

