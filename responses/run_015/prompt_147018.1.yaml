answer: |-
  Here is a procedure designed for your constraints. It treats every proposal not as a decision to be made, but as a hypothesis to be tested. It forces the room to distinguish between *questions of fact* (which staff answers) and *questions of value* (which you answer), and it identifies when a decision is actually a gamble disguised as math.

  ### The Procedure: The 20-Minute Inquiry Triage

  **Facilitator Script & Flow**
  *Timebox strictly. If a section drags, park it and move to the Verdict.*

  **1. The Shadow Map (3 Minutes)**
  *   **Ask:** "Who is affected by this who is not in this room and cannot vote?"
  *   **Good Enough Answer:** We name at least two specific groups (e.g., "Night shift workers," "Riders priced out last year").
  *   **Stop Condition:** If the answer is "The public" or "Everyone," pause. Force specificity. If you cannot name the losers, you cannot weigh their loss.
  *   **Output:** A written list of "Absent Stakeholders."

  **2. The Reversibility & Horizon Check (5 Minutes)**
  *   **Ask:** "If this fails, how hard is it to undo? And when do the losers feel the pain relative to when the winners get the credit?"
  *   **Good Enough Answer:** "Reversible in 3 months" OR "Permanent." "Costs hit in 2 weeks, savings hit in 2 years."
  *   **Stop Condition:** If the change is **Irreversible** (or very hard to reverse) AND the **Feedback Horizon** is long (costs hit after the next election/board cycle), you cannot treat this as an experiment. It is a structural change.
  *   **Output:** A classification: *Pilot-able* vs. *Structural Commitment*.

  **3. The Counterfactual & Metric Check (7 Minutes)**
  *   **Ask:** "Staff says X will happen. How do we know if they are wrong? What does 'failure' look like in numbers we can understand?"
  *   **Good Enough Answer:** "If ridership drops 5%," or "If driver overtime goes up."
  *   **Stop Condition:** If the metric is opaque (e.g., "efficiency score") or the counterfactual is invisible (e.g., "people who didn't ride"), you cannot validate the outcome later.
  *   **Output:** A specific "Failure Condition" to track.

  **4. The Verdict (5 Minutes)**
  *   **Option A: Endorse.** (Rare. Only if reversible, metrics clear, shadow public minimal.)
  *   **Option B: Pilot with Conditions.** (The default for Deweyan inquiry. Requires a return date to review the "Failure Condition.")
  *   **Option C: Refer to Board with Warning.** (If Irreversible + High Shadow Impact. You are not deciding; you are flagging risk.)
  *   **Option D: No Vote Today.** (If Shadow Public is unknown or Metrics are opaque.)

  ***

  ### The One-Page Cheat Sheet
  *(Tape this to your notebook)*

  | Triage Step | The Question | 🟢 Green Light (Proceed) | 🔴 Red Light (Stop/Modify) |
  | :--- | :--- | :--- | :--- |
  | **1. Shadow Public** | Who loses who isn't here? | We named specific groups (e.g., night workers). | "The general public" / We don't know. |
  | **2. Reversibility** | Can we undo this? | Yes, within 6 months. | No, or requires new capital/contracts. |
  | **3. Horizon** | Who feels it when? | Losers feel it before Board takes credit. | Costs come due after Board turns over. |
  | **4. Metrics** | How do we know it failed? | Simple number (Ridership, $, Time). | "Efficiency," "Algorithm score," Vibe. |
  | **VERDICT** | **What are we actually doing?** | | |
  | **Vote** | Only if Reversible + Metrics Clear. | | |
  | **Pilot** | Default for complex changes. Set review date. | | |
  | **Warning** | If Irreversible + High Shadow Risk. | | |
  | **No Vote** | If Shadow Public unknown. | | |

  **Script for "No Vote Today"**
  > "We are not voting today. Not because the idea is bad, but because we cannot see the consequences clearly enough to be responsible for them. We have identified [Shadow Group] who are affected but invisible in this data. Until we know how to measure the impact on them, a vote here would be guessing, not governing. We are referring this to staff for a mitigation plan and returning it in [Month]."

  ***

  ### Application to Your Three Cases

  #### Case 1: Income-Based Discounted Fares
  *   **Shadow Public:** Current riders who are *just* above the income cutoff (the "cliff effect"); non-riders who are priced out (hard to count).
  *   **Reversibility:** Low. Once people budget based on a discount, removing it is politically explosive.
  *   **Horizon:** Revenue loss is immediate; equity gains are long-term.
  *   **Metrics:** Staff has revenue models. They likely *do not* have models on "ridership gained from previously priced-out users."
  *   **Verdict:** **Pilot with Conditions.**
  *   **Procedure Action:** You cannot approve a system-wide switch. You approve a 6-month pilot on specific routes or income bands.
  *   **Condition:** Staff must report not just revenue loss, but *new rider acquisition*. If revenue drops and new riders don't appear, the hypothesis (that price is the barrier) is falsified.
  *   **Board Handoff:** "We endorse the *inquiry*, not the permanent policy. Fund the pilot, measure the equity gain, then decide."

  #### Case 2: Algorithmic Scheduling Tool
  *   **The Hard Truth:** You asked me to be plain. This procedure will likely force you to admit that **the Board does not want an experiment; they want a cost cut.**
  *   **Shadow Public:** Drivers (schedule stability), Riders (transfer reliability). The algorithm optimizes for cost, not human regularity.
  *   **Reversibility:** Medium. Software can change, but driver contracts and rider habits adjust to the new schedule.
  *   **Horizon:** Savings are immediate (finance sees 8%). Pain is diffuse (riders wait 3 mins longer, drivers get split shifts).
  *   **Metrics:** "8% operating cost" is legible. "Community cohesion" or "Driver burnout" is not.
  *   **Verdict:** **Refer to Board with Warning (or Pilot if Board allows).**
  *   **Why:** You wanted to propose a one-year pilot on a single depot. The procedure supports this *technically*. However, the "Feedback Horizon" is the trap. The Board gets the 8% savings on their watch. The degradation of service quality might take 18 months to show up in ridership data.
  *   **The Unwanted Truth:** If the Board refuses the pilot and demands system-wide rollout, **you cannot ethically endorse this as democratic inquiry.** You must mark it as a Value Decision (Efficiency > Stability).
  *   **Script for Board:** "We cannot validate the human cost of this efficiency. If you proceed without a depot-level pilot, you are making a value judgment that cost savings outweigh schedule reliability. We will not rubber-stamp that as 'data-driven.' It is a policy choice."

  #### Case 3: Late-Night Route Cut
  *   **Shadow Public:** Night shift workers, service industry staff, people without cars.
  *   **Reversibility:** **High.** (The "Service Death Spiral"). Once you cut a route, ridership goes to zero because people find other ways. You can never restore it and claim "see, no one rode it."
  *   **Counterfactual Visibility:** Zero. The data shows dismal ridership. It does *not* show the people who *would* ride if the service were reliable/known.
  *   **Verdict:** **No Vote Today.**
  *   **Minimum We Must Do:** You cannot cut based on *existing* ridership. You must identify the *specific* alternative for the current riders.
  *   **Requirement:** Staff must map the top 20 current riders of that route to the nearest alternative transport (next bus line, ride-share subsidy, walking distance). If the alternative adds >20 mins to their commute, the cut is a value judgment, not a data decision.
  *   **Script to Read Aloud:**
      > "We are not voting today. Cutting this route is functionally irreversible; once we cut it, we destroy the data needed to justify keeping it. We have identified a 'shadow public' of night workers who rely on this link but do not have a voice here. Until staff can show us the specific alternative transport for the current riders and confirm it doesn't add more than 20 minutes to their commute, a vote here would be guessing, not governing. We are referring this for a mitigation plan and returning it in November."

  ***

  ### The Honest Limitation (What This Procedure Can't Do)

  Your paranoia is justified. **Yes, this procedure systematically favors the legible.**

  By demanding "testable consequences" and "reversible pilots," you create a bias toward things that *can* be tested quickly.
  *   **What wins:** Fare pilots, route tweaks, app features.
  *   **What loses:** Trust-building, long-term neighborhood stability, racial equity, the feeling of safety. These are slow, structural, and hard to measure in a 90-minute meeting.

  If you use this triage for *everything*, you will accidentally tell your community that "what matters is what we can measure." That is the technocrat's trap, even if done democratically.

  **The Fix: Add a "Slow Track"**
  You need a mechanism to catch the structural stuff. Add a fifth option to the Verdict: **"Structural Inquiry."**
  *   **Trigger:** If the proposal involves capital investment, long-term contracts, or historical equity issues.
  *   **Action:** This kicks the item out of the "20-minute triage." It creates a sub-committee (3 members + 1 staff) that meets separately to talk to the "Shadow Public" directly (interviews, town halls) over 3 months.
  *   **Why:** You cannot Deweyan-inquire your way out of structural racism in 20 minutes. Some questions require *slower* democracy, not faster triage.

  **Final Constraint Check:**
  *   **Stats Background:** The procedure asks for *what* is measured, not *how*. Volunteers can judge "Is 20 minutes too long?" without knowing regression analysis.
  *   **Staff Pushback:** Staff can't argue with "We need to know who loses." It forces them to do the impact analysis they should be doing anyway.
  *   **Board Skim:** The One-Page Cheat Sheet and the "Verdict" options are designed to survive a 30-second skim. "Pilot with Conditions" is a phrase bureaucrats understand.

  This doesn't solve the power imbalance with the Board. But it stops you from lending your committee's moral authority to decisions that haven't been interrogated. It makes your "No" actionable, not just obstructive.
