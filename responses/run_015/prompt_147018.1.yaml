prompt: |-
  I coordinate a community advisory committee for a regional transit authority — fourteen volunteer members, one ninety-minute meeting a month, a staff analytics team that's genuinely good but has its own incentives, and an appointed board that can veto anything we recommend and is impatient with us. Proposals land on us constantly: fare restructuring, a bus lane, a fare-free pilot on two routes, cutting a late-night route that a neighborhood association hates, putting cameras on buses, an algorithmic scheduling tool that staff says will shave 8% off operating cost. Right now we lurch between two failure modes. Either the analysts show us a model and we rubber-stamp "the data says," or else we just take a straw vote and it becomes whoever showed up and complained loudest. I've been reading some Dewey — the bit where democracy isn't just a voting mechanism but a way of doing inquiry together, and where a policy is supposed to be treated as an experiment with consequences you actually go back and look at — and it felt like it was describing exactly our problem, but I can't figure out how to actually run it in a room. So: give me a procedure, something a facilitator can work through out loud in about twenty minutes per proposal, with a one-page version I can tape to my notebook. Triage questions in order, what counts as a good-enough answer to each, where the procedure just stops and says no, and where it explicitly hands the decision to a human because the question is one of values rather than facts. A few things I keep tripping on and want the procedure to handle, using whatever vocabulary works — I've been calling them my own names, don't feel obliged to keep them: the "shadow public," people who are definately affected but will never be in that room (night-shift workers, people currently priced off the system, the town next door that gets our parking spillover, riders who don't exist yet); the "feedback horizon," meaning whether the people who eat the costs find out and get to respond before the thing is locked in, or whether the bill comes due after the board that authorized it has turned over; "counterfactual visibility," whether the losers can even tell what they'd otherwise have had; and the fact that some decisions are just irreversible and therefore can't honestly be called experiments at all.

  Please apply it to three real-shaped cases so I can see it work. One: staff proposes replacing the flat fare with income-based discounted fares, and they have a revenue model. Two: the algorithmic scheduling tool, which the board already loves and which I wanted to propose as a one-year pilot on a single depot — my guess is your procedure is going to tell me something I don't want to hear about that one, and I want you to say it plainly rather than soften it. Three: the late-night route with dismal ridership that a well-organized neighborhood association wants gone. For that third one I especially need the "minimum we must do before we're allowed to vote" answer, and I need a sentence or two I can literally read out loud to the room when I have to tell fourteen people we're not voting today.

  And be honest at the end about what the procedure can't do. My worry is that anything built around testable consequences and reversible pilots will systematically favor decisions that are legible and quick to evaluate, and quietly push the slow, structural, hard-to-measure stuff — the kind of thing that probably matters most to the people who never show up — into the "not decidable by us" bucket. If that's a real flaw and not just me being paranoid, say so, and tell me what I'd have to add to catch those cases. Constraints worth knowing: my committee members have no statistics background and will not read a methodology appendix, staff will push back if the procedure lets us override their numbers on vibes alone, and whatever I hand the board has to be short enough to survive being skimmed.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Role:** Coordinator of a community advisory committee for a regional transit authority.
      *   **Context:** 14 volunteers, 90-min monthly meeting, skilled but incentivized staff analytics, impatient appointed board with veto power.
      *   **Problem:** Oscillating between "rubber-stamping data" and "loudest voice wins." Wants to implement a Deweyan democratic inquiry approach (policy as experiment, consequences tracked).
      *   **Deliverables:**
          1.  A 20-minute facilitation procedure per proposal (triage questions, good-enough answers, stop points, value vs. fact handoffs).
          2.  A one-page "cheat sheet" version.
          3.  Application to three specific cases:
              *   Income-based fares (revenue model exists).
              *   Algorithmic scheduling tool (Board loves it, user wants pilot, expects hard truth).
              *   Late-night route cut (Neighborhood association wants it gone, dismal ridership). Needs specific "no vote today" script.
          4.  Honest assessment of limitations (bias toward legible/quick metrics vs. slow/structural issues).
      *   **Constraints:** No stats background for members, staff pushback on "vibes," board needs brevity.
      *   **Key Concepts to Integrate:** Shadow public, feedback horizon, counterfactual visibility, irreversibility.

  2.  **Deconstruct the Philosophy (Deweyan Inquiry):**

      *   Democracy as cooperative inquiry.
      *   Policies as hypotheses/experiments.
      *   Consequences must be observable and accountable.
      *   Need to distinguish between *questions of fact* (data) and *questions of value* (community judgment).
      *   Need to account for those not present (shadow public).

  3.  **Drafting the Procedure (The "20-Minute Triage"):**

      *   *Goal:* Move from "Is this good?" to "Is this *decidable* by us, right now, in this way?"
      *   *Structure:* Needs to be linear, time-boxed, and decisive.
      *   *Step 1: The Stakeholder Map (Shadow Public).* Who is missing? (3 mins)
      *   *Step 2: The Reversibility & Horizon Check.* Can we undo this? When do people feel the pain? (5 mins)
      *   *Step 3: The Counterfactual & Metric Check.* How do we know it worked/failed? Who sees the alternative? (7 mins)
      *   *Step 4: The Verdict.* Vote, Pilot, or Stop. (5 mins)
      *   *Stop Conditions:* If irreversibility is high + shadow public impact is high -> Stop/Refer to Board with warning. If metrics are opaque -> Demand pilot.

  4.  **Developing the One-Page Cheat Sheet:**

      *   Needs to be visual, bold, and actionable.
      *   Columns: Question, Green Light (Go), Red Light (Stop/Modify).
      *   Include the script for the "No Vote" scenario.

  5.  **Applying to the Three Cases:**

      *   *Case 1: Income-Based Fares.*
          *   *Shadow Public:* Non-riders priced out (hard to measure).
          *   *Reversibility:* Hard to reverse once expectations are set.
          *   *Metrics:* Revenue impact (staff has this), equity impact (harder).
          *   *Verdict:* Needs a pilot or phased rollout. Cannot be a permanent immediate switch without testing equity outcomes.
      *   *Case 2: Algorithmic Scheduling.*
          *   *User's Fear:* The procedure will kill the pilot idea or expose the Board's impatience.
          *   *Analysis:* Staff says 8% savings. Who pays the cost? Drivers (schedule stability)? Riders (transfer times)?
          *   *Irreversibility:* Low (software can change).
          *   *Feedback Horizon:* Long for riders (service quality), short for finance (cost savings).
          *   *Hard Truth:* The Board wants the savings *now*. A pilot delays the savings. The procedure demands a pilot to measure the *hidden* costs (driver burnout, rider confusion). If the Board won't wait for the pilot data, the Committee cannot ethically endorse it as "inquiry," only as "adoption."
      *   *Case 3: Late-Night Route Cut.*
          *   *Shadow Public:* Night shift workers, non-car owners.
          *   *Reversibility:* High (routes are hard to restore once cut).
          *   *Counterfactual:* Invisible (people who *would* ride don't exist in data).
          *   *Verdict:* Cannot vote to cut based on current ridership alone. Need "Minimum Viable Mitigation."
          *   *Script:* Needs to be firm, Deweyan, but polite.

  6.  **Addressing the Limitations (The "Honest End"):**

      *   *The Flaw:* Yes, this favors legible metrics. Structural racism, long-term urban form, trust—these don't fit in a 20-minute triage.
      *   *The Fix:* Need a "Structural Veto" or a "Slow Inquiry" track. Acknowledge that some things require *more* time, not less. The procedure shouldn't be the *only* tool.

  7.  **Refining the Tone:**

      *   Professional, pragmatic, slightly academic but grounded (matching the user's Dewey reference).
      *   Direct on the Algorithmic Scheduling (don't soften).
      *   Empathetic to the Coordinator's position (sandwiched between staff/board/public).

  8.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I include the "Shadow Public" explicitly? Yes, in Step 1.
      *   *Check:* Is the "No Vote" script readable? Make it distinct.
      *   *Check:* Is the Algorithmic Scheduling analysis blunt enough? The prompt asks for plain speech. I need to say: "If the Board won't wait for a pilot, they don't want an experiment, they want a cost cut. Don't pretend it's inquiry."
      *   *Check:* Is the one-pager actually one page worth of text? Keep it tight.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Constraints" (no stats, staff pushback) are respected (e.g., don't ask volunteers to calculate confidence intervals, ask them to ask *what* is being measured).

  *(Self-Correction on Case 2)*: The user wants to propose a one-year pilot. The procedure might say "Yes, pilot." But the Board is impatient. The hard truth is that the Committee's recommendation for a pilot might be ignored. I need to highlight that the *procedure* validates the pilot, but the *politics* might kill it. The user asked: "my guess is your procedure is going to tell me something I don't want to hear about that one." Okay, what's the unwanted truth? Maybe that a pilot *isn't enough* because the algorithm changes the power dynamic permanently, or that the "8% savings" metric swallows the human cost metrics. Let's go with: The procedure reveals that without a pilot, you are signing off on a value judgment (efficiency > stability) disguised as math. If the Board won't fund the pilot, you can't endorse the rollout as "democratic inquiry."

  *(Self-Correction on Case 3)*: The "Minimum we must do" needs to be concrete. Not just "study more." It needs to be "Identify the specific alternative transport for the top 10% of riders" or similar.

  Let's assemble.

  *(Final thought on the "Honest End")*: The user is worried about "legible and quick" bias. I need to confirm this is real. Technocracy loves metrics. Deweyan inquiry requires time. The procedure risks becoming a technocratic filter. I need to suggest a "Slow Track" for structural issues.

