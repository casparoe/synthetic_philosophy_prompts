answer: |-
  ### Specification for a Policy-Ready Theory of Well-Being

  **Context:** The theory must generate a scalar value $W_{p,t}$ (well-being of person $p$ at time $t$) suitable for summation $\sum W$ in a constrained optimization problem (public budget allocation).

  #### 1. Completeness and Cardinality
  *   **Specification:** The theory must assign a real number to every possible state of a person-year. It cannot return "incomparable," "undefined," or ordinal rankings only.
  *   **Motivation:** A fixed budget allocator requires a common denominator to compare disparate interventions (e.g., mental health vs. infrastructure). Incomparability paralyzes decision rules.
  *   **Status:** **[NON-NEGOTIABLE]** (Functional requirement for cost-effectiveness analysis).
  *   **Implication:** Rules out pluralistic theories that posit incommensurable goods (e.g., liberty cannot be traded against happiness).

  #### 2. Operationalizability at Population Scale
  *   **Specification:** The variables required to calculate $W$ must be measurable for millions of subjects simultaneously with low marginal cost.
  *   **Motivation:** Administrative burden consumes the budget intended for well-being. If the theory requires brain scans, third-party audits, or philosophical interviews, it is useless for policy.
  *   **Status:** **[NON-NEGOTIABLE]** (Functional requirement for implementation).
  *   **Implication:** Strongly privileges self-report survey data (Subjective Well-Being) or easily observable proxies (income, health status).

  #### 3. The Reality Constraint (Experience Machine)
  *   **Specification:** The theory must distinguish between a subject experiencing pleasure via direct neural stimulation and a subject experiencing pleasure via actual engagement with the world.
  *   **Motivation:** Public legitimacy relies on the intuition that policy should improve *lives*, not just *experiences*. A government feeding citizens into Nozick's Experience Machine fails its mandate, even if reported satisfaction is maximal.
  *   **Status:** **[PREFERENCE]** (Hedonists dissent, but political philosophy generally requires contact with reality).
  *   **Variant Case (Authorized Agent):** If the subject is in the machine but truthfully informed that an authorized agent is executing their projects in the real world, the verdict must shift upward relative to the pure machine, but potentially remain below direct action.
      *   **Requirement:** The theory must value *causal efficacy* and *truth* independently of raw phenomenology. If the theory treats the Pure Machine and Authorized Agent variants identically, it fails to capture the value of agency.

  #### 4. Adaptation and Set-Point Correction
  *   **Specification:** The theory must determine whether a permanent downward shift in objective conditions (e.g., disability) accompanied by a return to baseline self-report (hedonic adaptation) counts as a loss in $W$.
  *   **Motivation:** If adaptation is accepted as truth, policy loses the incentive to cure chronic conditions or improve oppressive environments that subjects have learned to endure.
  *   **Status:** **[NON-NEGOTIABLE]** (For a theory aiming to *improve* conditions rather than track *feelings* about conditions).
  *   **Implication:** Requires a mechanism to discount self-reports based on known psychological adaptation effects (e.g., the "disability paradox").

  #### 5. Duration-Intensity Integrability
  *   **Specification:** The theory must define a trade-off rate between the intensity of an experience and its duration (e.g., does 1 year of ecstasy equal 10 years of contentment?).
  *   **Motivation:** Interventions vary in longevity. Without a discounting or integration function, the theory cannot compare one-off treatments against permanent structural changes.
  *   **Status:** **[NON-NEGOTIABLE]** (Required for intertemporal allocation).
  *   **Implication:** Requires a metric like QALYs (Quality-Adjusted Life Years) where $W = \int intensity(t) dt$.

  #### 6. Interpersonal Aggregation Rule
  *   **Specification:** The theory must specify how to weigh one person's loss against another's gain (e.g., diminishing marginal utility of well-being).
  *   **Motivation:** Budget allocation is inherently distributive. A theory that treats a gain to the already flourishing identically to a gain to the suffering fails prioritarian ethical standards common in public finance.
  *   **Status:** **[PREFERENCE]** (Utilitarians prefer equality; Prioritarians prefer weighting the worse-off).
  *   **Implication:** The output $W$ may need to be transformed by a social welfare function before summation.

  ***

  ### The Unsatisfiable Subset (The Trilemma)

  You suspected a conflict between **Deference**, **Correction**, and **Measurability**. This conflict is **real**, not an artifact of phrasing. You can hold any two, but not all three:

  1.  **Deference:** The subject's own considered judgment about their well-being is final.
  2.  **Correction:** The theory adjusts for adaptation, misinformation, or false consciousness (e.g., overriding a report of "I am well" in an oppressive situation).
  3.  **Measurability (via Self-Report):** The data source at population scale is the subject's own testimony.

  *   **If you hold Deference + Measurability:** You must accept self-reports as truth. You cannot correct for adaptation (violating Correction). *Result: The "Happy Slave" problem.*
  *   **If you hold Correction + Measurability:** You must alter self-reports based on external models of adaptation. You are overriding the subject's judgment (violating Deference). *Result: Paternalism.*
  *   **If you hold Deference + Correction:** You must respect the subject's truth while correcting for their errors. This requires an external metric of well-being to identify the error, which violates Measurability (via Self-Report) because you now need objective audits or third-party assessments at scale. *Result: Infeasibility.*

  **Resolution for Policy:** Most cost-effectiveness frameworks (e.g., DALYs, SWB-weighting) sacrifice **Deference**. They accept self-report as the *data source* (Measurability) but apply statistical corrections for adaptation and scale-norming (Correction), implicitly treating the subject as a fallible reporter of their own good.

  ***

  ### The Single Most Exclusionary Requirement

  **Operationalizability at Population Scale (via Self-Report).**

  This requirement does the most work in excluding candidates. It immediately disqualifies robust **Objective-List** theories (which require auditing whether a person actually has "friendship," "meaning," or "autonomy," which is costly and intrusive) and complex **Desire-Satisfaction** theories (which require verifying if desires are informed and counterfactual). It forces the theory to be psychological and phenomenological, regardless of its ontological claims.

  ***

  ### Theory Scorecards

  **Hedonism:** Passes measurability and duration trade-offs easily but fails the reality constraint of the Experience Machine and struggles to justify adaptation correction without violating deference.
  **Desire-Satisfaction:** Respects deference and agency but collapses under adaptive preferences (the "Happy Slave") and fails population-scale measurability of informed counterfactual desires.
  **Objective-List:** Handles reality and adaptation correction robustly but fails population-scale measurability and violates deference by imposing external standards of the good life.
