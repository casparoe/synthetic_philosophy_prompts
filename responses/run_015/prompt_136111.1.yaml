prompt: |-
  Hey — hoping you can help me turn something from class into something I can actually use.

  I'm a junior taking a seminar this term on constitutions and the problem of the dead hand, and I also somehow got stuck on my student government's charter and bylaws committee. We vet every proposed amendment before it goes to the full assembly: about ten or twelve proposals a term, we meet every other Sunday for two hours, and I'm the person who writes the one-page recommendation that goes to the floor and then to the Dean's office, which has veto power but mostly rubber-stamps whatever we send. The committee is seven people who will argue about anything for forty minutes, so what I need is something that closes arguments down, not something that opens new ones.

  Here's the thing: nearly everything that crosses my desk is the same move wearing different clothes. The people writing the rule now are making it harder for the people who come after them to do something. Cooling-off periods before a divestment vote. Supermajority requirements for raising the activity fee. A five-year lock on the sustainability fund. A clause banning the assembly from taking positions on national elections. In seminar we spent a while on Ulysses contracts — binding yourself now so that later, weakened you can't do the thing — and on the claim that a constitution is partly a precommitment device for a political body rather than just a list of rules. I get the appeal in the abstract. I cannot turn it into something I can run on a proposal on a Sunday afternoon.

  What I want is a written procedure my committee could actually work through:

  - A short ordered list of questions (six or seven max), each with what counts as a passing answer and what counts as a failing one, and with an explicit "stop here, recommend no" point. It has to be runnable in about twenty minutes by a first-year who joined last week and has never taken a philosophy class, and it has to rely only on things we can actually get — old assembly minutes, the text of the clause, maybe a budget number. We can't run surveys or commission research.
  - Where a question isn't a factual one but a disagreement about values, say so explicitly and say who decides. I want the hand-off points marked, not smoothed over.
  - Two half-formed tests I keep reaching for — please either fix them or tell me to drop them. (1) A direction-of-ignorance test: that tying a future assembly's hands is only ever justified by a failure of *will* it will predictably have (panic, short-termism, cycling between factions, getting lobbied during a crisis), never by a failure of *information*, because a future assembly will normally know more than we do, not less. So any clause whose real justification is that we know better what's good for them should fail. (2) A mirror test: would the majority proposing this accept the identical constraint if the other side held the seats? If not, it's factional entrenchment in precommitment costume. There's probably a third test I'm missing about how long the handcuff should last versus how long the diagnosed failure is expected to last.
  - Then run the whole thing on three proposals I've got coming up: (a) a rule requiring 72 hours between the introduction and the final vote on any divestment resolution; (b) a two-thirds supermajority for *increases* to the student activity fee, with no equivalent requirement for decreases; (c) a clause locking in ten years of spending on a climate commitment, with amendment only by a three-quarters vote. Be aware going in that I personally think (c) is the best idea on the table, so if the procedure says no to it I want it to say no anyway and I want to see exactly where it breaks.
  - Finally, an honest note on what this procedure structurally can't see — the failure modes I should expect after a term of using it.

  American English, please, and please don't assume I can look anything up: we're undergrads, none of us has access to a law database, and I need something that works off the clause text and our own minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Junior undergrad, seminar on constitutions/dead hand problem, member of student gov charter/bylaws committee.
      *   **Task:** Create a written procedure (checklist/test) for the committee to evaluate constitutional amendments, specifically those that bind future assemblies (precommitment devices).
      *   **Constraints:**
          *   Must be runnable in ~20 minutes by a first-year with no philosophy background.
          *   Max 6-7 questions.
          *   Must rely only on available data (minutes, text, budget numbers) – no surveys/research.
          *   Must explicitly mark value disagreements and who decides.
          *   Must include explicit "stop here, recommend no" points.
          *   Must incorporate/fix two specific tests proposed by the user (Direction-of-Ignorance, Mirror Test) and potentially add a third (Duration/Proportionality).
          *   Must apply the procedure to three specific hypothetical proposals (72hr cooling-off, supermajority for fee hikes, 10-year climate lock).
          *   Must include a section on the procedure's own blind spots/failure modes.
          *   Tone: American English, practical, no legal database access assumed.
          *   Goal: Close arguments, not open them.

  2.  **Deconstruct the Core Problem:**

      *   The "Dead Hand" problem is about current majorities binding future majorities.
      *   The user wants to distinguish between *legitimate precommitment* (protecting against future weakness/panic) and *illegitimate entrenchment* (protecting current policy from future disagreement).
      *   The tool needs to be heuristic, not philosophical. It needs to be a flowchart in text form.

  3.  **Drafting the Procedure (The "Precommitment Vetting Checklist"):**

      *   *Constraint Check:* Max 6-7 questions. Needs clear Pass/Fail criteria.
      *   *Incorporating User's Tests:*
          *   Test 1 (Ignorance vs. Will): This is about *justification*. Why are we doing this?
          *   Test 2 (Mirror/Partisanship): This is about *symmetry*. Would the opposition agree?
          *   Test 3 (Duration): This is about *proportionality*. Does the lock match the risk?
      *   *Drafting Questions:*
          1.  **Identification:** Is this actually a binding clause? (Filter out non-issues).
          2.  **The "Why" (Will vs. Info):** Is the stated problem a failure of *will* (panic, short-termism) or *knowledge*? If knowledge, Fail. (User's Test 1).
          3.  **The "Who" (Mirror Test):** If the political tables turned, would the proponents still want this rule? If No, Fail. (User's Test 2).
          4.  **The "How Long" (Proportionality):** Does the duration of the restriction match the duration of the risk? (User's Test 3).
          5.  **The Escape Hatch:** Is there a way out that is difficult but not impossible? (e.g., supermajority vs. total ban).
          6.  **Precedent/Consistency:** Does this match how we've treated similar issues in the past? (Uses minutes).
          7.  **Final Value Call:** If it passes the above, is the cost of flexibility worth the benefit of stability? (Explicit value hand-off).

      *   *Refining for "First-Year Usability":* The language needs to be plain. "Failure of will" might need simplification. Let's call it "The Panic Test." "Mirror Test" is good. "Duration" is good.
      *   *Stop Points:* Need to make sure if they fail Q2 or Q3, they stop.

  4.  **Refining the Tests (User's Half-Formed Ideas):**

      *   *Direction-of-Ignorance:* Keep it. It's strong. Future assemblies *do* know more facts. They only lack resolve. If the justification is "they won't know X," that's paternalism, not precommitment.
      *   *Mirror Test:* Keep it. It's the standard check for partisan entrenchment.
      *   *Third Test (Duration):* This is crucial. A 10-year lock for a 4-year election cycle problem is disproportionate. Let's call it the "Sunset/Proportionality Test."

  5.  **Applying to the Three Proposals:**

      *   *(a) 72-hour cooling-off on divestment:*
          *   Will vs. Info? Will (prevents snap votes). Pass.
          *   Mirror? Yes, both sides benefit from deliberation. Pass.
          *   Duration? 72 hours is short. Proportionate. Pass.
          *   *Verdict:* Recommend Yes.
      *   *(b) Supermajority for fee hikes only:*
          *   Will vs. Info? Will (prevents easy spending).
          *   Mirror? No. If the other side wanted to raise fees for their projects, they'd be blocked. Asymmetric. Fail.
          *   *Verdict:* Recommend No.
      *   *(c) 10-year climate lock (3/4 vote to amend):*
          *   Will vs. Info? Will (prevents backsliding). Pass.
          *   Mirror? Maybe. Climate is often partisan, but let's assume broad support.
          *   Duration? 10 years is long for student gov (2.5x a typical undergrad tenure). Is the risk 10 years long?
          *   Escape Hatch? 3/4 is very high.
          *   *User Bias:* User likes this one. The test needs to be rigorous.
          *   *Critique:* 10 years binds ~3 cohorts of students. Is that justified? The test might flag this as disproportionate. I need to be honest here. If the test says No, I must say No.

  6.  **Addressing "Value Hand-offs":**

      *   The procedure can't solve "Is stability more important than flexibility?" That's a political question. The checklist should identify *when* that question is being asked so the Committee Chair (or the Assembly) decides it, not the checklist.

  7.  **Addressing "Blind Spots/Failure Modes":**

      *   What does this miss?
      *   Status Quo Bias (it makes change hard, so bad old rules stay).
      *   Gaming the system (drafting around the test).
      *   The "Crisis" loophole (claiming panic where there is none).
      *   Committee fatigue (rubber stamping the checklist).

  8.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional but accessible. "Student Gov" context.
      *   *Structure:*
          1.  Intro (acknowledging the constraint).
          2.  The Checklist (The "Dead Hand Vetting Protocol").
          3.  Application to the three cases.
          4.  Blind Spots.
      *   *Self-Correction on Proposal (c):* The user said "I personally think (c) is the best idea... if the procedure says no to it I want it to say no anyway." I need to make sure I don't bias the test to save (c). Actually, a 10-year lock with a 3/4 vote is *very* restrictive for a student org. It likely fails the Proportionality test. I will let it fail if the logic dictates.

      *   *Refining the Checklist Questions:*
          1.  **Binding Mechanism:** Does this make future action harder than the current baseline? (If No, stop, not a dead hand issue).
          2.  **The Knowledge Test (User's Test 1):** Is the justification based on future *ignorance* or future *weakness*? (Ignorance = Fail).
          3.  **The Symmetry Test (User's Test 2):** Would proponents accept this if opponents held the majority? (No = Fail).
          4.  **The Proportionality Test (User's Test 3):** Does the length/severity of the lock match the lifespan of the risk? (No = Fail/Revise).
          5.  **The Escape Hatch:** Is there a constitutional path to repeal that is difficult but possible? (No path = Fail).
          6.  **Precedent Check:** Does this match how we've treated similar constraints in the last 5 years? (Minutes check).
          7.  **The Value Call:** Explicitly state the trade-off for the Assembly.

      *   *Wait, check constraints:* "Six or seven max." "Explicit stop here." "Who decides."
      *   *Refining Q7:* Q7 shouldn't be a pass/fail, it should be the "Hand-off."

  9.  **Final Review against constraints:**
      *   American English? Yes.
      *   No law database? Yes, relies on minutes/text.
      *   20 mins? Yes, if questions are sharp.
      *   First-year friendly? Need to avoid jargon like "epistemic." Use "Knowledge vs. Nerve."
      *   Blind spots included? Yes.

  10. **Writing the Response:** (Mental outline of the text)
      *   Acknowledge the cleverness of the prompt (seminar theory -> practical tool).
      *   Present the "Dead Hand Vetting Protocol."
      *   Run the three cases.
      *   Discuss the limitations.
      *   Ensure the tone is collaborative but firm on the logic.

      *(Self-Correction during drafting)*: Make sure the "Stop" points are visually distinct. Use bolding. Ensure the distinction between Committee decision and Assembly decision is clear in the "Value Call."

      *(Specific attention to Proposal C)*: The user likes it. I need to be careful not to sound like I'm attacking their preference, but applying the test rigorously. A 10-year lock in a student org where turnover is 4 years is inherently suspect under the Proportionality Test. I will highlight that tension.

      *(Specific attention to "Who Decides")*: For factual questions (minutes, text), the Committee decides. For value questions (is stability worth the cost?), the Committee flags it, Assembly decides.

      *(Refining the "Direction of Ignorance" test)*: Call it "The Nerve vs. Knowledge Test." It's clearer for a first-year.
      *(Refining the "Mirror Test")*: Call it "The Political Symmetry Test."
      *(Refining the "Duration" test)*: Call it "The Horizon Test."

      Let's assemble.

      *Wait, one more check:* "Explicit 'stop here, recommend no' point." I need to make sure if they fail Q2 or Q3, they don't proceed to Q7.

      *Okay, ready to write.*
answer: |-
  This is a sharp problem. You are trying to operationalize political philosophy without the luxury of time, expertise, or data. The goal isn't to find the "truth" of a proposal, but to filter out self-dealing and structural absurdity so the Assembly can vote on the actual merits.

  Below is the **Dead Hand Vetting Protocol**. It is designed to be printed on one page, handed to a first-year, and worked through in 20 minutes. It incorporates your two tests and adds the third (Duration/Proportionality) as a hard gate.

  ### The Dead Hand Vetting Protocol

  **Instructions:** Answer questions 1–6 in order. If any question results in a **FAIL**, stop immediately. Draft a recommendation to **Reject** based on that failure. Do not proceed to Question 7 unless all previous questions are **PASS**. Question 7 is not a pass/fail; it is a hand-off to the Assembly.

  **Data Sources:** Proposed text, Current Bylaws, Assembly Minutes (last 5 years), Budget Sheets. No external research.

  ***

  **1. The Binding Mechanism**
  *   **Question:** Does this clause make it procedurally harder for a future Assembly to reverse this decision than it is for the current Assembly to make it? (e.g., supermajorities, waiting periods, spending locks, bans).
  *   **Pass:** Yes, it creates a constraint. (Proceed to Q2).
  *   **Fail:** No, it is a standard policy or operational rule.
  *   **Action:** If **Fail**, this protocol does not apply. Treat as normal legislation.

  **2. The Nerve vs. Knowledge Test** (Your "Direction-of-Ignorance")
  *   **Question:** Look at the sponsor's justification (or infer from text). Are we binding the future because they might lack *information* (facts, data, context) or because they might lack *nerve* (resolve, discipline, immunity to panic)?
  *   **Pass:** The justification is a failure of **Nerve** (e.g., "prevent panic selling," "prevent budget spikes during elections," "ensure long-term follow-through").
  *   **Fail:** The justification is a failure of **Knowledge** (e.g., "future students won't understand the complexity," "we know best what the long-term impact is").
  *   **Rationale:** Future assemblies will almost always have more data than we do. Binding them because they might be "wrong" is paternalism, not precommitment.
  *   **STOP POINT:** If **Fail**, recommend **No**. Reason: *Paternalistic entrenchment.*

  **3. The Political Symmetry Test** (Your "Mirror Test")
  *   **Question:** If the political coalition currently *opposing* this measure held the majority seats next year, would the current proponents still want this rule in place?
  *   **Pass:** Yes. The rule protects the *process* or *institution* regardless of who wins (e.g., cooling-off periods apply to all votes).
  *   **Fail:** No. The rule protects a specific *policy outcome* favored by the current majority (e.g., a supermajority only for fee hikes, but not fee cuts).
  *   **Rationale:** Precommitment must protect the vessel, not the cargo. If the constraint only bites one side of the ideological spectrum, it is factional entrenchment.
  *   **STOP POINT:** If **Fail**, recommend **No**. Reason: *Partisan entrenchment.*

  **4. The Horizon Test** (Your "Duration" Test)
  *   **Question:** Is the duration of the constraint proportional to the duration of the risk being mitigated?
  *   **Pass:** The lock period roughly matches the risk cycle (e.g., a 24-hour cooling off for a panic vote; a 4-year lock for a capital project).
  *   **Fail:** The lock period significantly exceeds the risk cycle or the tenure of the constituents (e.g., a 10-year spending lock for an undergraduate body where 75% of voters graduate in 4 years).
  *   **Rationale:** A dead hand is justified only as long as the "weakness" it guards against is expected to last.
  *   **STOP POINT:** If **Fail**, recommend **No** (or Recommend "Pass only if duration is reduced to X").

  **5. The Escape Hatch**
  *   **Question:** Is there a constitutional mechanism for a future supermajority to override this constraint if necessary?
  *   **Pass:** Yes. There is a defined amendment path (e.g., 2/3 vote to unlock).
  *   **Fail:** No. The clause is a total ban or requires a threshold impossible to reach (e.g., unanimity, or Dean approval only).
  *   **Rationale:** A constitution cannot bind a future sovereign absolutely without ceasing to be a constitution and becoming a tombstone.
  *   **STOP POINT:** If **Fail**, recommend **No**. Reason: *Irreversibility.*

  **6. The Precedent Check**
  *   **Question:** Do the Assembly Minutes from the last 5 years show we have accepted similar constraints in similar contexts?
  *   **Pass:** Yes, there is consistency (e.g., we have cooling-off periods for budget votes already).
  *   **Fail:** No, this is a novel constraint applied to a unique area without prior justification.
  *   **Rationale:** Inconsistency suggests the rule is ad hoc, designed for a specific current fight rather than structural integrity.
  *   **Committee Decision:** The Committee decides this based on minutes. If **Fail**, discuss if the new context justifies the departure. If not, recommend **No**.

  **7. The Value Hand-Off** (Not a Pass/Fail)
  *   **Instruction:** If the proposal passes 1–6, the Committee must write the following statement in the recommendation:
  *   *"This proposal successfully guards against [Specific Risk] without violating [Symmetry/Horizon] principles. However, it trades [Flexibility/Speed] for [Stability/Certainty]. The Committee takes no position on whether this trade-off is desirable; that is a policy choice for the Assembly."*
  *   **Who Decides:** The Assembly. The Committee's job ends at identifying the trade-off.

  ***

  ### Application to Your Three Proposals

  Here is how the protocol runs on your current docket. I have applied it strictly, including against proposal (c) as requested.

  **(a) 72-hour cooling-off on divestment resolutions**
  *   **Q1 (Binding):** Yes. Delays action. **PASS.**
  *   **Q2 (Nerve vs. Knowledge):** Justification is preventing "snap votes" during emotional moments. This is a failure of *Nerve* (panic), not Knowledge. **PASS.**
  *   **Q3 (Symmetry):** Applies to *any* divestment resolution, regardless of the target or sponsor. Both sides benefit from deliberation. **PASS.**
  *   **Q4 (Horizon):** 72 hours is short. Matches the risk cycle of a heated debate. **PASS.**
  *   **Q5 (Escape):** Assembly can still vote after 72 hours. **PASS.**
  *   **Q6 (Precedent):** Check minutes. If you have cooling-off periods for budget votes, this is consistent. **PASS.**
  *   **Q7 (Hand-off):** Trade-off is Speed vs. Deliberation.
  *   **Verdict:** **Recommend Yes.** This is a classic, legitimate Ulysses contract.

  **(b) Two-thirds supermajority for fee *increases* only**
  *   **Q1 (Binding):** Yes. Raises threshold for action. **PASS.**
  *   **Q2 (Nerve vs. Knowledge):** Justification is likely "fiscal discipline." Failure of *Nerve* (spending temptation). **PASS.**
  *   **Q3 (Symmetry):** **FAIL.** This applies only to *increases*. If a future majority wants to *decrease* fees (perhaps to shift funding from one group to another), they are not constrained. This locks in current spending levels against future cuts but allows future hikes if a simple majority agrees. It favors the "spend more" coalition over the "spend less" coalition.
  *   **STOP POINT.**
  *   **Verdict:** **Recommend No.** Reason: *Partisan entrenchment.* To pass, it would need to apply to any change in the fee (up or down), or be tied to a broader budget stability clause.

  **(c) 10-year climate spending lock (amendable by 3/4 vote)**
  *   **Q1 (Binding):** Yes. Locks budget. **PASS.**
  *   **Q2 (Nerve vs. Knowledge):** Justification is "preventing backsliding on commitments." Failure of *Nerve* (political will). **PASS.**
  *   **Q3 (Symmetry):** **PASS (Conditionally).** If the clause locks *spending* regardless of the specific climate project, it is symmetric. If it locks spending on *specific* projects favored by the current majority, it fails here. Assuming it is a general fund lock: **PASS.**
  *   **Q4 (Horizon):** **FAIL.** This is the breaking point. You are an undergraduate student government. The average tenure of a voting member is 2 years; the average tenure of a constituent is 4 years. A 10-year lock binds at least two full generations of students who had no say in the original vote. The risk (political backsliding) is real, but the duration (10 years) vastly exceeds the legitimate authority span of the current body.
  *   **STOP POINT.**
  *   **Verdict:** **Recommend No.** Reason: *Disproportionate Duration.*
  *   **Fix:** The Committee could recommend a counter-proposal: A 4-year lock (one full cycle of the student body) with a 2/3 override. If the proponents refuse to shorten the horizon, the recommendation stands as No.
  *   **Note:** I know you like this proposal. But under the "Dead Hand" theory you studied, binding people who aren't here yet (and won't be for 6 of those 10 years) is the definition of the problem you are trying to solve. The protocol catches this.

  ***

  ### Blind Spots & Failure Modes

  You asked for an honest note on what this procedure structurally cannot see. If you use this for a term, expect these three failure modes:

  **1. The Status Quo Bias Trap**
  This protocol is inherently conservative. It makes it harder to bind the future, which means it makes it easier to keep the *current* status quo. If the current bylaws are broken or unjust, this checklist helps defenders of the status quo by rejecting "dead hand" fixes that might actually be necessary to shift the baseline. It protects the *past* dead hand against the *present* dead hand.
  *   *Mitigation:* Be aware that "Recommend No" often means "Keep the current broken system."

  **2. The "Crisis" Loophole**
  Sponsors will learn to game Question 2 (Nerve vs. Knowledge). They will stop arguing that "future students won't know" and start arguing "future students will panic." Every proposal will be framed as a safeguard against crisis.
  *   *Mitigation:* In Q2, require the sponsor to identify the *specific* panic mechanism. "Panic" is not enough. "Panic during budget week" is better.

  **3. Committee Fatigue (The Rubber Stamp)**
  The biggest risk isn't that the test is wrong, but that your committee gets tired. After the fourth Sunday of arguing about the "Horizon Test," your members will start voting "Pass" just to get to lunch. The checklist becomes a box-ticking exercise rather than a deliberative tool.
  *   *Mitigation:* Rotate who leads the checklist reading each week. Make the "STOP POINT" recommendations automatic unless a 2/3 vote of the *Committee* overrides the failure. Force them to vote to ignore the red light.

  ### Final Advice
  Print the protocol. Put it in the packet. Tell the Dean's office you are using it. If the Dean vetoes a proposal you recommended "Yes" on, you can point to Q2 or Q4 and say, "We vetted the dead hand problem; you are vetoing the policy merit." That protects your committee's political capital.

  Good luck. Sunday meetings are brutal; give yourself the tools to end the argument.
