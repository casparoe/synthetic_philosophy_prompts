answer: |-
  # Exam Question: Moral Uncertainty and the Regret-Translation Protocol

  **Time Allowed:** 90 Minutes
  **Word Limit:** None (Manage time accordingly)
  **Instructions:** Answer the following question. Do not use external citations. Rely solely on conceptual analysis.

  **The Problem of Moral Uncertainty:**
  Agents often act under uncertainty about which normative ethical theory is true. The standard approach, Maximization of Expected Choice-Worthiness (MEC), requires assigning credences to theories and calculating expected value. However, MEC faces the "intertheoretic comparison problem": different theories may utilize incompatible value structures (e.g., lexical orderings vs. aggregative sums) or lack a common unit of measurement, making mathematical expectation impossible.

  **The Proposed Solution:**
  To resolve this, consider the **Regret-Translation Protocol (RTP)**. RTP proposes a unified metric for moral uncertainty. When an agent faces a choice where Theory A (e.g., Consequentialism) permits an act and Theory B (e.g., Deontology) forbids it, RTP translates the deontological prohibition into a consequentialist cost. The "moral regret weight" assigned to violating the constraint is defined strictly as the first-person disutility the committed deontologist *herself reports* feeling at the prospect of violating the constraint. Once all theoretical demands are translated into these subjective disutility weights, the agent aggregates outcomes using ordinary expected-utility reasoning to maximize net welfare (including the avoidance of personal moral regret).

  **Essay Prompt:**
  Critically evaluate the Regret-Translation Protocol as a solution to moral uncertainty. Your essay must address the following four points in a unified argument:
  1.  Explain precisely why standard expected-choice-worthiness approaches fail, focusing on the structural incommensurability of value rather than mere disagreement.
  2.  Identify the specific normative assumption RTP makes regarding the authority of first-person moral regret and how this supplies a metric.
  3.  Argue whether RTP resolves uncertainty neutrally or whether it structurally collapses deontology into a weighted consequentialist framework, thereby begging the question.
  4.  Assess whether RTP reduces normative uncertainty to empirical uncertainty about reactive attitudes, and analyze what this implies for the coherence of the original problem of moral uncertainty.

  ***

  # Model Answer

  Standard approaches to moral uncertainty, specifically Maximization of Expected Choice-Worthiness (MEC), fail not merely because theories disagree on outcomes, but because they possess incommensurable value structures. Consequentialism typically offers a cardinal, aggregative scale where values are fungible and comparable. Deontology, conversely, often relies on agent-relative constraints, lexical orderings, or binary permissions that resist trade-offs. To calculate an expectation, one requires a common currency of value across theories. Without a "super-theory" to normalize these distinct structural languages, assigning credences to theories is mathematically vacuous; one cannot multiply a probability by a value if the value units are structurally incompatible.

  The Regret-Translation Protocol (RTP) attempts to supply this missing metric by positing a specific normative assumption: that the first-person psychological experience of moral violation constitutes a universal, comparable unit of disvalue. RTP assumes that the *authority* of a moral constraint can be exhaustively captured by the agent's subjective emotional resistance to violating it. By equating the "weight" of a deontological prohibition with the reported disutility of the agent's regret, RTP translates structural constraints into psychological costs. This supplies a metric because psychological pain is ostensibly cardinal and comparable across different motivational states, allowing for aggregation within a single utility function.

  However, RTP does not resolve moral uncertainty neutrally; it structurally collapses deontology into a weighted consequentialist framework, thereby begging the question against the deontologist. Deontological constraints are typically understood as reasons for action that hold independently of their impact on the agent's welfare or psychological state. A prohibition against killing is not a request to avoid feeling bad; it is a requirement to refrain from the act regardless of the cost. By translating the prohibition into a "regret weight," RTP transforms an agent-relative constraint into an agent-neutral cost to be minimized. This privileges the consequentialist structure of optimization, forcing the deontological theory to speak a language it explicitly rejects. The protocol effectively decides the meta-ethical dispute in favor of consequentialism by defining moral value exclusively in terms of aggregatable welfare states (including regret), rather than treating the deontological structure as a competing architecture of reason.

  Furthermore, if RTP succeeds, it reduces normative uncertainty to empirical uncertainty about reactive attitudes, dissolving the coherence of the original problem. Under RTP, the question "Which theory is correct?" becomes "How much regret will I feel if I violate this constraint?" This shifts the domain of inquiry from normative ethics to moral psychology. The uncertainty is no longer about the truth of competing moral claims but about the causal intensity of the agent's emotions. This implies that a sociopath with no deontological regret would face no deontological "weight" in the calculation, rendering the deontological theory practically inert for that agent. Consequently, RTP fails to address moral uncertainty because it eliminates the normative force of the theories in question. It solves the calculation problem by destroying the object being calculated, rendering the protocol a category error that mistakes the phenomenology of morality for its ontology.

  ***

  # Marking Scheme (Total: 20 Marks)

  **Criterion 1: Diagnosis of Intertheoretic Incommensurability (4 Marks)**
  *   **Full Marks:** Clearly distinguishes between simple disagreement on outcomes and structural incompatibility (e.g., cardinal/aggregative vs. lexical/constraint-based) that prevents a common metric.
  *   **Failure Mode:** Conflating intertheoretic comparison problems with simple disagreement over probabilities or factual outcomes.

  **Criterion 2: Identification of RTP's Metric Assumption (4 Marks)**
  *   **Full Marks:** Identifies that RTP treats subjective psychological disutility (regret) as a universal currency and assumes this feeling exhausts the normative authority of the constraint.
  *   **Failure Mode:** Describing RTP merely as "adding feelings to the calculation" without noting the assumption that regret *constitutes* the moral weight.

  **Criterion 3: Analysis of Structural Transformation (4 Marks)**
  *   **Full Marks:** Explains how RTP converts agent-relative constraints (do not do X) into agent-neutral costs (minimize regret about X), altering the logical structure of deontology.
  *   **Failure Mode:** Claiming RTP is unfair without explaining the specific mechanical shift from constraint to cost.

  **Criterion 4: Evaluation of Neutrality and Question-Begging (4 Marks)**
  *   **Full Marks:** Argues that RTP privileges consequentialist optimization structures, effectively deciding the meta-ethical dispute by definition rather than neutral arbitration.
  *   **Failure Mode:** Treating RTP as an unbiased translation tool without addressing the framework-imposition objection.

  **Criterion 5: Assessment of Empirical Reduction and Coherence (4 Marks)**
  *   **Full Marks:** Recognizes that RTP turns normative truth into empirical psychology (sensitivity to regret), noting the implication that moral truth becomes agent-dependent (e.g., the sociopath problem).
  *   **Failure Mode:** Failing to connect the reduction of normative uncertainty to empirical uncertainty with the loss of the problem's original coherence.
