  In a chaotic ER, Nurses Ava and Bea triage patients under identical pressure. Ava applies a strict "Severity-First" rule consistently, ignoring pleas or status. Bea fluidly adjusts prioritization based on subtle cues like family distress or vocal tone, appearing responsive. However, Ava's uniformity stems from a standing policy she authored, understands, and can revise; her adaptiveness is concentrated in her capacity to question the rule itself. Bea's flexibility arises from thousands of ingrained trigger-response links formed during training; she cannot survey these habits as a whole nor revise them systematically, only react locally. Both deliberate equally little in the moment; the difference lies in whether the governing structure is a revisable policy or a distributed habit network.

  **Diagnostics:**
  1.  **Mid-course:** Protocol changes. Ava halts to integrate the new rule; Bea drifts into the new pattern only as cues shift.
  2.  **New-reason:** Moral reason to break protocol. Ava weighs this against her policy; Bea feels anxiety but habits drive action.
  3.  **Repeat:** Same case ten times. Ava chooses identically; Bea varies slightly.
  **Verdicts:** Flexibility Account calls Ava unfree (rigid output) and Bea free (adaptive output). Identification Account calls Ava free (self-governed) and Bea unfree (habit-driven).

  **Structural Feature:** The feature is *revisability*. If Ava's policy is one she never revisits and would not revisit under testing, she collapses into sphexishness on the Identification account too (Unfree). The Flexibility verdict remains Unfree. The split verdict disappears; both theories agree she is unfree. This is a result, not a defect: it exposes that hypothetical control is insufficient without dispositional readiness. The Identification account requires the policy to be *actively* ownable, not just historically endorsed.

  **Reply:** The Flexibility theorist argues Ava is flexible at a yearly grain (choosing the job/rules). This move is ad hoc unless constrained. To block question-begging, grain must match the action's timescale: freedom requires flexibility within the decision window, not just across a career. If the theorist insists on long-term grain, they must explain why short-term rigidity doesn't constitute unfreedom during the action itself. A principled constraint would require flexibility to be accessible within the agent's current cognitive horizon. Without this, the theory allows agents to be unfree in the moment yet free in abstraction, undermining the concept of agency. The constraint must be that flexibility matters where the agent experiences constraint.
