answer: |-
  This is a precise and philosophically rich observation. You have identified a specific epistemic state that sits between factual knowledge and personal experience. In philosophy, this is the core subject of the debate surrounding **Aesthetic Testimony**.

  While there is no single common-English noun (like "schadenfreude") for this specific feeling, the phenomenon is well-documented in aesthetics and epistemology. It is often discussed as the **Puzzle of Aesthetic Testimony** or the **Norm of Assertion in Aesthetic Judgments**.

  Here is an analysis of what the thing is, where its edges lie, and how it compares to similar concepts.

  ### What the Thing Is
  You are describing **Testimonial Aesthetic Belief**. It is a belief formed on the basis of another's report rather than direct perception. What makes it unique (and why it feels different from the mechanic/alternator scenario) is that aesthetic value is generally thought to require **acquaintance**.

  1.  **The Acquaintance Principle:** In aesthetics, there is a prevailing norm (articulated by philosophers like Richard Wollheim and Immanuel Kant) that to truly judge a work, you must experience it yourself. When you rely on a critic, you are violating this norm. Your hesitation ("it's *meant* to be extraordinary") is your mind acknowledging that you lack the *authority* that comes from acquaintance, even if you possess the *information*.
  2.  **Inert Commitment:** You noted the belief "doesn't do anything." Standard beliefs motivate action (if the alternator is shot, I fix it). Aesthetic beliefs based on testimony are **epistemically fragile**. They lack the "cash value" of direct experience because aesthetic value is relational (between viewer and object), not intrinsic (in the object alone). You cannot fully inhabit a relationship you haven't participated in.
  3.  **Immunity to Revision:** When you dislike the film, you don't feel wrong; you feel "unpositioned." This is because your belief was never about the film's properties directly, but about the *reliability of the critic*. If the film is dull, the critic might be wrong, or *you* might be the outlier. Since the norm says you shouldn't have judged without seeing it, your lack of conviction protects you from being "wrong."

  ### Where the Edges Are
  Does this show up outside the arts?

  *   **Wine and Food:** **Yes.** If a sommelier says a wine is complex, you might nod, but if you taste vinegar, you trust your palate over theirs. You will say "It's supposed to be good" rather than "It is good."
  *   **Jokes:** **Yes.** "You had to be there" or "It's funny if you know the context." If you hear a joke is hilarious but don't laugh, you don't feel you failed; you feel the joke failed *for you*.
  *   **Moral/Political Judgement:** **No (mostly).** If a trusted source says "That policy is cruel," you can adopt that moral stance fully without witnessing the cruelty yourself. Moral judgments are treated as objective facts about the world, whereas aesthetic judgments are treated as subjective experiences.
  *   **Factual Expertise:** **No.** As you noted with the mechanic. Facts are transferable; experiences are not.
  *   **Positive vs. Negative:** The phenomenon is stronger with **positive** verdicts. Recommending a masterpiece requires enthusiasm (which requires experience). Warning someone away from a dud requires only caution (which is easier to adopt second-hand).
  *   **Calibrated Source vs. Aggregate:** It matters immensely. An aggregate score (IMDb 8/10) is data, not testimony. It creates expectation, not belief. A calibrated critic creates a **proxy relationship**. You are borrowing their eyes. When the belief feels hollow, it's because you know you are borrowing eyes you don't possess.

  ### Candidate Concepts Table

  | candidate concept | what that concept is really about | where my thing fits it | where it doesn't | verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Aesthetic Testimony** | The philosophical debate on whether aesthetic knowledge can be transmitted via word of mouth. | Fits the core tension: believing a verdict without experience. | Focuses on *validity* (is it knowledge?), you focus on *phenomenology* (how it feels/behaves). | **Best Fit** |
  | **Epistemic Deference** | Relying on an expert's authority (e.g., doctor, mechanic). | Fits the trust in the critic and the initial acceptance of the claim. | Fails to explain why you hedge assertions ("meant to be") unlike with the mechanic. | **Partial Fit** |
  | **Acquaintance Knowledge** | Knowledge gained only through direct experience (knowing *what it is like*). | Explains why you feel "unpositioned" to judge without seeing the film. | Doesn't account for the fact that you *do* hold a belief (you do think it's good). | **Partial Fit** |
  | **Alief vs. Belief** | (Gendler) Automatic association vs. conscious assertion. | Explains why you don't *act* on the belief (no alief to drive behavior). | Too psychological; misses the social/normative aspect of art criticism. | **Doesn't Fit** |
  | **Cultural Capital** | (Bourdieu) Using taste to signal social status. | Explains why you might repeat phrases to sound knowledgeable. | You describe genuine belief, not signaling. You aren't trying to impress, just inform. | **Doesn't Fit** |

  ### Analysis of the "Hollowness"
  You asked if it's "low confidence wearing a costume." It is more structural than that. It is **Propositional Knowledge without Acquaintance**.
  *   **Mechanic:** "Alternator is shot." (Propositional). Action: Fix it.
  *   **Critic:** "Film is masterpiece." (Propositional). Action: ???
  *   **The Gap:** To act on "masterpiece," you must *experience* the mastery. You cannot act on the proposition alone. Therefore, the belief remains inert until converted into experience.

  ### Conclusion
  You are experiencing the **Norm of Assertion** inherent in **Aesthetic Testimony**. You feel you lack the license to assert the claim as your own because you lack the evidential basis (the viewing). The belief is real, but it is **second-order**: you believe *that the critic believes* it is a masterpiece, and you trust their competence, but you do not hold the first-order belief *that it is a masterpiece* in the full, action-guiding sense.

