answer: |-
  **MEMORANDUM**

  **TO:** Methodology Board, Interdisciplinary Consciousness-Research Unit
  **FROM:** Methodology Committee Sub-Group on Conceptual Coherence
  **DATE:** 24 May 2024
  **SUBJECT:** Operational Decision Procedure for Proposals Involving Qualia Isolation (The Chase-Sanborn Coherence Protocol)

  ### 1. Introduction

  This document establishes the **Chase-Sanborn Coherence Protocol (CSCP)**. It is designed to evaluate grant applications and pre-registration protocols that claim to isolate, measure, or manipulate specific qualia (e.g., 'pure redness', 'intrinsic pain'). The procedure is grounded in the argument advanced by Chase and Sanborn: that qualia, defined as intrinsic, non-relational phenomenal properties, are incoherent posits. Any attempt to fix upon such a property via introspection inevitably collapses it into a functional, relational, or cognitive-access feature, leaving no genuinely phenomenal residue.

  The CSCP is not a metaphysical adjudication of consciousness itself, but a methodological filter to prevent the allocation of resources to projects premised on conceptually impossible objects of study. It is designed for application by reviewers without specialist philosophical training and should require no more than twenty minutes to complete.

  ### 2. The Chase-Sanborn Coherence Protocol (CSCP)

  Reviewers must proceed through the following four stages sequentially. If a proposal fails a stage, the review stops, and a negative verdict is issued unless specified otherwise.

  **Stage 1: Operational Definition Audit**
  *   **Question:** Does the proposal define the target quale independently of its causal role, behavioural output, or cognitive accessibility?
  *   **Criterion for Sufficient Answer:** The definition must explicitly distinguish the *phenomenal character* from *what the subject does with it* (e.g., reports it, attends to it, remembers it).
  *   **Stop-Point (Fail):** If the proposal defines the quale solely by its neural correlate, behavioural report, or functional role (e.g., "redness is what causes button-press X"), it fails. It is measuring a functional state, not a quale.
  *   **Stop-Point (Pass):** If the proposal acknowledges the distinction but claims to measure the phenomenal aspect *via* functional proxies, proceed to Stage 2.

  **Stage 2: The Introspective Collapse Test**
  *   **Question:** Does the methodology rely on introspective reports that presuppose cognitive access?
  *   **Criterion for Sufficient Answer:** The proposal must demonstrate how it separates the *experience* from the *inspection* of the experience.
  *   **Stop-Point (Fail):** If the data collection relies entirely on subjects reporting on their experience (verbal or behavioural), the proposal fails to isolate the quale from the cognitive access required to report it. Under Chase and Sanborn, the report *is* the functional collapse.
  *   **Stop-Point (Pass):** If the proposal utilises no-report paradigms or acknowledges that reports are functional proxies, proceed to Stage 3.

  **Stage 3: The Invariance Challenge**
  *   **Question:** Does the proposal claim the target property remains constant despite variations in functional context (attention, memory, task demand)?
  *   **Criterion for Sufficient Answer:** The proposal must provide a mechanism for verifying constancy that does not rely on the very functional systems being varied.
  *   **Stop-Point (Fail):** If the proposal claims a "pure" signature exists regardless of functional context but measures it using functional tools (e.g., fMRI, reaction time), it commits a category error. It has measured a stable functional correlate, not a non-functional quale.
  *   **Stop-Point (Pass):** If the proposal admits the property may vary but claims to track the *residue*, proceed to Stage 4.

  **Stage 4: The Empirical/Conceptual Boundary (Value Judgement)**
  *   **Question:** Does the proposal acknowledge that empirical data cannot resolve whether the "residue" is genuinely phenomenal or merely a subtle functional state?
  *   **Criterion for Sufficient Answer:** The applicants must explicitly state that their work is heuristic: they are treating qualia *as if* they exist to see if the model yields predictive power, despite the conceptual incoherence.
  *   **Decision Point:** At this stage, empirical data cannot resolve the distinction. The reviewer must exercise value judgement.
      *   *Reject:* If the authors insist they are definitively measuring intrinsic non-functional properties.
      *   *Refer to Board Vote:* If the authors acknowledge the conceptual risk but argue the empirical framework is fruitful despite the confusion.

  ### 3. Limitations and Scope

  Reviewers must note the following constraints of the CSCP:

  1.  **Theoretical Presupposition:** The procedure presupposes the validity of the Chase and Sanborn argument. It does not adjudicate between eliminativism and deflationary functionalism; it treats the *claim to measure intrinsic qualia* as the error, regardless of whether one believes qualia exist but are unmeasurable, or do not exist at all.
  2.  **Introspection:** The procedure tacitly presupposes that introspection is theory-laden and functionally mediated. It cannot evaluate proposals based on 'pure' phenomenology that deny this mediation.
  3.  **Empirical Utility:** The CSCP identifies conceptual confusion, not empirical incompetence. A proposal may fail the CSCP yet produce robust data regarding neural correlates or behaviour.

  ### 4. Known Misfires

  No decision procedure is infallible. Reviewers should be aware of the following probable errors:

  *   **False Negative (The Pragmatic Misfire):** A proposal may use the term 'qualia' loosely to refer to reportable conscious states (a functional definition) but be flagged by Stage 1 for failing to distinguish the phenomenal from the functional. Such a study might be empirically sound but terminologically imprecise. *Mitigation:* Allow applicants to clarify definitions before final rejection.
  *   **False Positive (The Sophisticated Obfuscation):** A proposal may pass Stage 4 by acknowledging the conceptual risk, yet implicitly treat the 'residue' as a measurable variable in their statistical models. This grants legitimacy to an incoherent construct under the guise of heuristic exploration.

  ---

  ### 5. Application to Case Studies

  The following analyses demonstrate the application of the CSCP to three current proposals.

  #### Case 1: fMRI Study of 'Pure Phenomenal-Red'
  **Proposal:** Claims to identify a neural signature for redness that remains constant across variations in attentional load and cognitive task.
  **CSCP Analysis:**
  *   **Stage 1:** The proposal defines the target as 'pure phenomenal-red'. However, it operationalises this via BOLD signal intensity. **Fail.** It conflates the neural correlate (functional/physical) with the phenomenal property.
  *   **Stage 3 (Hypothetical Pass):** Even if we allow Stage 1, the claim of constancy across attentional load is tested via fMRI (a functional measure). If the signal remains constant, it proves the *neural state* is stable, not that the *quale* is isolated from function.
  *   **Verdict:** **Stop at Stage 1.** The proposal claims to measure a non-functional property using functional tools.
  *   **Board Conclusion:** **Reject.** The study measures neural stability, not qualia. Funding should be contingent on re-framing the objective as 'neural correlates of colour perception' without claims of isolating intrinsic phenomenal properties.

  #### Case 2: Behavioural Study of Chromatic Synaesthesia
  **Proposal:** Treats subjects' reports of coloured sounds as direct evidence of non-functional qualitative properties.
  **CSCP Analysis:**
  *   **Stage 1:** The target is defined as 'non-functional qualitative properties'.
  *   **Stage 2:** The methodology relies entirely on subject reports ("I hear blue"). Under Chase and Sanborn, the report is a cognitive-access feature. To treat the report as *direct evidence* of the non-functional property is to ignore the collapse of introspection into function.
  *   **Verdict:** **Stop at Stage 2.** The data (reports) cannot bear the weight of the claim (evidence of non-functional properties).
  *   **Board Conclusion:** **Reject.** The researchers are likely to reject this verdict, arguing that the veridicality of the report guarantees the reality of the quale. However, per the CSCP, this conflates the *claim* of experience with the *nature* of the experience. The board should advise that the study be re-classified as research into 'atypical cross-modal reporting mechanisms' rather than evidence of intrinsic qualia.

  #### Case 3: The 'Phenomenal-Residue Audit' (Speculative Protocol)
  **Proposal:** Subjects are trained to report only those aspects of experience that survive a counterfactual inversion of all associated functional and cognitive-access properties. Aim: Isolate a non-functional core.
  **CSCP Analysis:**
  *   **Stage 1 & 2:** The proposal explicitly attempts to strip away functional properties. It acknowledges the reliance on reports but attempts to train them to filter out functional content. It passes Stage 1 and 2 conditionally, as it engages directly with the collapse problem.
  *   **Stage 3:** The method involves counterfactual inversion. Empirically, it is unlikely any report will survive the inversion of all access properties.
  *   **Stage 4:** This is the critical juncture. The proposal acknowledges that empirical data may show zero residue. It argues that the *search* for the residue delineates the boundary of the functional.
  *   **Verdict:** **Proceed to Board Vote (Stage 4).** Empirical data cannot determine if a null result proves the incoherence of qualia or simply the limits of the training.
  *   **Board Conclusion:** **Refer to Full Board.** This is a high-risk, high-conceptual-clarity project.
      *   *Argument for Funding:* It directly tests the Chase-Sanborn hypothesis. Even a null result is theoretically valuable.
      *   *Argument against Funding:* It asks subjects to perform a logically impossible task (reporting without cognitive access).
      *   *Recommendation:* Fund as a pilot only, with the explicit understanding that a 'positive' result (finding a residue) would require extraordinary conceptual justification, and a 'negative' result confirms the incoherence thesis.

  ### 6. Final Recommendation

  The Board is advised to adopt the CSCP immediately. It provides a necessary firewall against category errors that waste resources on incoherent objectives. However, Stage 4 must be respected: where the conceptual confusion is acknowledged and utilised heuristically, the decision rests on the Board's appetite for speculative metaphysics versus strict operationalism.

  **Signed,**
  Methodology Committee Sub-Group
  Interdisciplinary Consciousness-Research Unit
