answer: |-
  This is a fantastic question that cuts to the heart of Rousseau's moral psychology. You are right to identify a tension here: is Rousseau's problem with the *posture* of the audience (passive) or the *ontology* of the medium (representational)?

  To give you the best material for your seminar, I will steelman both readings using Rousseau's *Letter to M. d'Alembert on the Theatre* (1758) as the primary text (since that is where his aesthetic theory lives), supported by the civic unity arguments in *The Social Contract*.

  Here are the two readings, followed by a verdict on which holds more water.

  ---

  ### Reading 1: The Passivity Objection (Participatory Theater Might Survive)
  **The Argument:** Rousseau's critique is primarily sociological and civic. He objects to theater because it isolates citizens in the dark, substitutes emotional catharsis for political action, and creates a hierarchy between the active (actors) and the passive (spectators).

  **The Steelman:**
  1.  **Isolation vs. Assembly:** Rousseau argues that in the theater, "everyone is shut up in a box... everyone remains silent and immobile." This physical isolation mirrors political atomization. Participatory theater (like Augusto Boal's *Theatre of the Oppressed*, which explicitly claims Rousseau as an ancestor) breaks the boxes. It demands movement, speech, and collective negotiation.
  2.  **Pity without Action:** Rousseau famously claims that theater allows us to feel pity for suffering on stage so that we feel we have discharged our moral duty without actually helping anyone in real life. Participatory theater disrupts this by making the "suffering" contingent on the audience's intervention. If the audience must act to resolve the conflict, pity is converted into praxis.
  3.  **The Festival Precedent:** Rousseau contrasts theater with public festivals. He writes: *"Plant a stake in the middle of the square... and let the spectators become an entertainment to themselves."* In a festival, there are no spectators; everyone is a participant. Participatory theater attempts to replicate this structure within a dramatic frame. If the "fourth wall" is demolished, the distinction between citizen and spectator dissolves, theoretically aligning with the General Will's requirement that sovereignty cannot be represented, only exercised.

  **Verdict for this reading:** If Rousseau's enemy is *alienation*, then participatory theater is the antidote. It turns consumption into production.

  ---

  ### Reading 2: The Representation Objection (Participatory Theater Fails)
  **The Argument:** Rousseau's critique is primarily moral and metaphysical. He objects to theater because it is the realm of *appearance* over *being*. It cultivates *amour-propre* (vanity/social comparison) rather than *amour de soi* (authentic self-regard). The problem isn't sitting still; it's pretending to be someone else.

  **The Steelman:**
  1.  **The Actor's Lie:** Rousseau attacks the profession of the actor specifically: *"The actor's trade is to show himself other than he is."* Even in participatory theater, the participants are invited to step into a "magic circle." They are intervening in a *fiction*. For Rousseau, cultivating the habit of treating truth as malleable for the sake of dramatic effect is corrosive to civic virtue. A citizen must speak the truth in the assembly, not improvise a role to see "what works."
  2.  **Amour-Propre and Display:** In participatory theater, when I stand up to intervene, am I acting for the common good, or am I performing my own virtue for the approval of the room? Rousseau fears the "gaze of the other." Theater institutionalizes the gaze. Even if I am active, I am still *on display*. This fuels vanity and comparison, which fractures the transparency required for the General Will.
  3.  **Simulation vs. Reality:** Rousseau wants art to be life, not a mirror of life. In his ideal festival, the activity (dancing, singing) is real. In participatory theater, the activity is *simulated*. If I "vote" in a play, no actual policy changes. For Rousseau, this trains citizens to be comfortable with impotence. It teaches them that "changing the world" is a game you play for two hours before going home to the same inequalities. It creates a habit of *simulated agency*, which is arguably more dangerous than passive spectatorship because it masks the lack of real sovereignty.

  **Verdict for this reading:** If Rousseau's enemy is *inauthenticity*, participatory theater is just a more insidious form of the same poison. It is still representation.

  ---

  ### The Verdict: Reading 2 is More Defensible

  While Reading 1 is attractive (and historically influential on leftist theater practitioners), **Reading 2 is the more textually robust interpretation of Rousseau.**

  Here is why you should steer your seminar toward the **Representation Objection**:

  **1. The "Festival" Benchmark**
  Rousseau offers a specific alternative to theater: the open-air festival. Crucially, in the festival, there is no script, no stage, and no fiction. He writes: *"Let them do nothing... let the spectators become an entertainment to themselves."*
  Participatory theater still has facilitators, still has a premise, and still has a "stop" button. It retains the *frame* of art. For Rousseau, the frame itself is the problem. The moment you designate a space as "where we pretend," you have created a zone of opacity. The General Will requires total transparency; theater (even interactive theater) requires a suspension of disbelief, which is a form of opacity.

  **2. The Nature of Sovereignty**
  In *The Social Contract*, Rousseau argues sovereignty cannot be represented. "The people's deputies are not, and could not be, its representatives; they are merely its agents."
  Participatory theater is still a *representation* of action. It simulates the democratic process. For Rousseau, simulating democracy is an insult to it. It suggests that political action is a style of behavior one can adopt, rather than a moral obligation rooted in truth. If I practice "overthrowing the king" in a workshop, I am treating revolution as a role. Rousseau wants the citizen to *be* the citizen, not play the citizen.

  **3. The Psychology of *Amour-Propre***
  This is the clincher. Rousseau believes theater inflames *amour-propre* (the desire to be valued by others). In passive theater, I compare myself to the hero. In participatory theater, I compare myself to the other participants. *"Who intervened most cleverly?" "Who was the most emotional?"*
  The mechanism of the gaze remains. As long as there is an audience (even if it is the other participants), I am performing. Rousseau wants a state where I act according to my conscience and the law, not according to how I appear to my peers. Participatory theater makes peer approval the metric of success, which is the exact social dynamic Rousseau thinks destroys the General Will.

  ### Seminar Suggestion: The Boal Counter-Point

  To make this lively for your students, introduce **Augusto Boal**.
  Boal wrote *Theatre of the Oppressed* explicitly to solve the "Rousseau Problem." He argued that traditional theater is coercive (the actor acts, the viewer watches), and he used "Forum Theatre" to let spectators become "spect-actors."

  **Ask your class:**
  > "Boal thought he was fulfilling Rousseau's dream by activating the audience. But given Rousseau's obsession with *truth* vs. *appearance*, would Rousseau view Boal's workshop as a school for citizenship, or a school for manipulation?"

  **The Takeaway:**
  Rousseau would likely argue that participatory theater trains citizens to be *better actors*, not better citizens. It teaches them that reality is negotiable and that truth is a matter of consensus within a fictional frame. For a philosopher who demands that the citizen lay bare their heart to the General Will without artifice, the very idea of a "workshop" is a corruption.

  **Summary for your lecture:**
  Rousseau's anti-theatricalism is not about **kinetics** (moving vs. sitting); it is about **ontology** (being vs. seeming). Participatory theater solves the kinetic problem but exacerbates the ontological one. It makes the lie more engaging, but it remains a lie.
