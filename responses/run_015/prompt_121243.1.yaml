      *   **Options:** Anti-mercantilist lens OR a totally new kind of empire? (Or a synthesis?)
      *   **Constraints:** One paragraph, max 5 sentences.
      *   **Requirement:** Actually reason it out, not just summarize *The Wealth of Nations*.

  2.  **Deconstruct Adam Smith's Core Principles:**
      *   *Wealth of Nations:* Critique of mercantilism (hoarding gold, trade barriers, state-backed monopolies), emphasis on productive labor, fair exchange, mutual benefit in trade, suspicion of monopolies and collusion by masters/merchants.
      *   *Theory of Moral Sentiments:* Sympathy, justice, fairness, the "impartial spectator."
      *   *Context:* Smith opposed the East India Company (a corporate-state hybrid extracting wealth without genuine trade).

  3.  **Analyze the Modern Scenario:**
      *   Big Tech extracting data from Global South.
      *   Minimal local compensation (value extraction without fair return).
      *   Information treated as raw material (extraction vs. production).
      *   Power imbalance (monopolistic/oligopolistic tech giants).

  4.  **Synthesize Smith's Likely View:**
      *   Would he see this as mercantilism? Mercantilism was about state-backed trade balances and hoarding bullion. This is corporate extraction of intangible assets.
      *   Would he see it as a new empire? Yes, specifically reminiscent of the East India Company (corporate sovereignty without accountability).
      *   Key Smithian concern: Is this productive labor? Is it a fair exchange? Smith argued that trade should benefit both parties. Extraction without compensation violates the natural liberty of fair exchange.
      *   He would likely view it as a perversion of free markets, akin to his critique of the East India Company, where corporate power overrides local welfare and genuine value creation.

