answer: |-
  There is no single, settled term in philosophy of psychiatry or epistemology that captures exactly this structure: a diagnostic framework that remains falsifiable *in principle* (via scans, behavior, history) but renders one specific channel of evidence (first-person testimony) unidirectionally confirmatory.

  You are correct to reject "unfalsifiable" (Popper) because the *system* allows for refutation, just not via that *input*. You are also right to hesitate over "epistemic injustice" (Fricker), as that term carries a moral condemnation that prejudges whether the discounting is wrongful, whereas you are looking for a structural description that allows for both legitimate and illegitimate instances.

  The closest existing concepts are **"The Negative Heuristic"** (Lakatos) applied to testimony, and **"Testimonial Injustice"** stripped of its normative load. However, neither is precise enough for your needs.

  Since no established term fits, I will coin one, define its boundaries, and then subject it to the critique you requested.

  ### The Coinage: **Diagnostic Testimonial Asymmetry (DTA)**

  **Definition:**
  DTA occurs when a diagnostic framework assigns evidentiary weight to a patient's first-person report such that:
  1.  Concordance between report and diagnosis increases the probability of the diagnosis.
  2.  Discordance between report and diagnosis *also* increases the probability of the diagnosis (typically by re-coding the discordance as a symptom, e.g., "denial," "lack of insight," "anosognosia").
  3.  The diagnosis remains falsifiable by *other* channels (e.g., third-party observation, biological markers).

  **The Distinction: Anchored vs. Unanchored DTA**
  To distinguish the legitimate from the illegitimate without begging the question, we must look not at the *logic* of the asymmetry (which is identical in both cases) but at the **independence of the anchor.**

  *   **Anchored DTA (Legitimate):** The discrepancy between the patient's report and reality can be arbitrated by a third party *without* invoking the diagnosis itself. The "insight deficit" is a secondary consequence of a primary, independently observable pathology.
      *   *Example:* The stroke patient. The paralysis is observable by the doctor without needing to believe the "stroke" diagnosis first. The denial is causally linked to the lesion, which is visible on a scan. The asymmetry is a protective measure against immediate physical harm based on independent data.
  *   **Unanchored DTA (Illegitimate):** The discrepancy between the report and reality can *only* be identified by assuming the truth of the diagnosis. The "symptom" (the denial) and the "disease" are mutually reinforcing without an external arbiter.
      *   *Example:* The addiction case you cited. "Loss of control" is the core definition of the disease. The patient says "I have control." The doctor says "Your saying so proves you don't." There is no independent measure of "control" that does not already presuppose the disease model. The asymmetry serves theoretical coherence, not independent observation.

  ### Boundary Cases for Testing

  To test whether a case is Anchored or Unanchored DTA, apply the **Independent Arbitration Test**: *Could a neutral observer confirm the patient is wrong about their state without knowing the diagnosis?*

  1.  **Anosognosia (Stroke):** **Anchored.**
      *   *Test:* Can we see the arm is paralyzed without asking the patient? Yes.
      *   *Verdict:* Legitimate DTA. The patient is objectively wrong about physical reality.
  2.  **Acute Mania:** **Anchored.**
      *   *Test:* Can we observe risky behavior/sleeplessness/agitation without accepting the patient's report of "feeling great"? Yes.
      *   *Verdict:* Legitimate DTA. The report contradicts observable functional collapse.
  3.  **Addiction (Szasz's target):** **Unanchored.**
      *   *Test:* Can we observe "loss of control" without assuming the disease? No. Continued use is only "compulsive" if we assume they *should* stop but *can't*. If they can stop (as they claim), it's a choice. The diagnosis rests on the interpretation of the very behavior the patient disputes.
      *   *Verdict:* Suspect DTA. The asymmetry protects the definition of the illness.
  4.  **Depressive Realism (The "Sadder but Wiser" case):** **Unanchored / Ambiguous.**
      *   *Test:* The patient says "I have no control." Experiments show they are *more accurate* than controls.
      *   *Verdict:* This breaks the "Accuracy" metric. Here, DTA is used to enforce a **Normative Baseline** (healthy people *should* have positive illusions) rather than an Objective Baseline. This is Unanchored DTA because the "error" is defined statistically against a norm, not against physical reality. It reveals that psychiatry often treats *deviation from positive illusion* as pathology, regardless of accuracy.

  ### Where Szasz Does Argumentative Work

  You asked if Szasz's answer ("there is no illness") is doing more work than credited.
  Szasz is not merely denying the illness; he is identifying **Unanchored DTA** as the *constitutive mechanism* of "mental illness" in these cases. His argument is that when DTA is Unanchored, the "illness" is not a medical entity but a metaphor for a moral or social conflict.
  *   If the asymmetry is Anchored (Stroke), the illness is biological.
  *   If the asymmetry is Unanchored (Addiction/Neurosis), the "illness" is a rhetorical device to authorize intervention.
  So, Szasz is not "too cheap"; he is proposing that **Anchored DTA is a necessary condition for medical legitimacy.** If you cannot anchor the testimonial override in independent biology or behavior, you are not doing medicine; you are doing moral management.

  ### Where This Answer Is Most Likely Wrong

  There are three significant risks in the analysis above, any of which could collapse the distinction:

  **1. The Theory-Ladenness of Observation (The "Anchor" Illusion)**
  I defined "Anchored" as relying on independent observation (e.g., paralysis). But a skeptic (like Kuhn or Feyerabend) would argue that *all* observation is theory-laden. To see the arm as "paralyzed" rather than "unwilling" already requires a neurological framework. If the "anchor" itself relies on a theoretical framework that the patient rejects, the distinction between Anchored and Unanchored DTA collapses.
  *   *Persuasion:* If you can show that even the stroke diagnosis relies on interpreting behavior through a medical lens that the patient is entitled to reject (e.g., "I am not paralyzed, I am choosing not to move"), then DTA is unavoidable in *all* medicine, not just psychiatry. (Counter: A biopsy or scan offers a non-behavioral anchor, but psychiatry often lacks this).

  **2. The Conflation of Volition and Cognition**
  I have treated "I can stop" (Addiction) and "My arm works" (Stroke) as the same type of report. They are not. One is a claim about *capacity* (motor function), the other about *volition* (will).
  *   *Persuasion:* If addiction is a disorder of *volition* (the will is hijacked), then the patient's report ("I choose this") is as cognitively compromised as the stroke patient's ("I move this"). If the "organ of will" is damaged, first-person reports about will are as unreliable as reports about motion from a damaged motor cortex. If you accept that "will" can be lesioned, Unanchored DTA becomes Anchored DTA. Szasz's entire project rests on denying that "will" can be lesioned. If you believe it can, my distinction fails.

  **3. The "Depressive Realism" Collapse**
  The depression case suggests that "health" is defined by *inaccuracy* (positive illusion). This implies that the goal of the diagnostic framework is not *truth* but *function*.
  *   *Persuasion:* If the goal of psychiatry is functional adaptation rather than ontological truth, then the "Independence of the Anchor" test is the wrong metric. The correct metric is **"Functional Utility."** If discounting the report prevents suicide or homelessness, the DTA is legitimate regardless of whether it is Anchored. This would validate the addiction case if the intervention works, rendering the epistemic asymmetry irrelevant compared to the pragmatic outcome.

  ### Summary
  The concept you are looking for is **Diagnostic Testimonial Asymmetry**.
  *   **Legitimate version:** **Anchored DTA** (Independent corroboration of the deficit exists).
  *   **Illegitimate version:** **Unanchored DTA** (The deficit is inferred from the disagreement itself).
  *   **Failure point:** The distinction collapses if you believe volition can be lesioned (validating addiction DTA) or if you prioritize functional outcomes over epistemic accuracy (validating depression DTA).

  Szasz is not being cheap; he is arguing that without an **Anchored** asymmetry, the concept of "mental illness" is a category error. Whether he is right depends on whether you believe the "will" is the kind of thing that can be independently observed to be broken.
