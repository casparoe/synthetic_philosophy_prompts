      *   *The Bifurcation:* This model attempts to split the "care" function from the "coercion" function.
      *   *The Escalation Clause:* The unarmed unit *must* call the armed unit if things get "unpredictable." This is the crux. It suggests the unarmed unit is not truly independent; it operates under the umbrella of the armed unit's potential violence.
      *   *Implicit Philosophy:* It looks like a "humanising" of the monopoly, not a dismantling. It treats violence as a tool in the toolbox, to be used only when the "soft" tools fail.
      *   *Abolitionism:* True abolitionism isn't just defunding police; it's challenging the *monopoly* itself. It requires community-based accountability, restorative justice, and removing the state's exclusive right to coerce.

