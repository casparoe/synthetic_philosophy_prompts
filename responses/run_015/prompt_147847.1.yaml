answer: |-
  ### Discussion Section Plan: Kant on Duties Regarding Animals

  **Session Duration:** 50 Minutes
  **Target Audience:** 2nd-Year Philosophy Students (Fluent in *Groundwork* Formula of Humanity)
  **Primary Texts:** *Doctrine of Virtue* (§§ 16-17), *Lectures on Ethics*

  #### 1. The Conceptual Distinction (Minutes 0–12)
  **Objective:** Secure the logical dependency between the Formula of Humanity (FH), the status of "End-in-Itself," and the Direct/Indirect duty distinction.

  *   **The Distinction:** Begin by eliciting from students the definition of a **Direct Duty** (owed *to* a being who has moral standing/rights) versus an **Indirect Duty** (owed *regarding* a being, but ultimately *to* oneself or humanity).
  *   **The Criterion:** Ask students to recall the *Groundwork* criterion for being an "End in Itself." They must identify **Rational Autonomy** (the capacity to legislate moral law).
  *   **The Dependency:** You must demonstrate that these concepts are not separate modules but a logical chain:
      1.  **FH Dependency:** One cannot determine if a duty is direct or indirect without first applying the FH criterion. Since animals lack autonomy, they cannot be ends in themselves.
      2.  **Distinction Dependency:** Consequently, the "Direct/Indirect" distinction *depends* on the FH criterion. If animals were ends in themselves, the duty would be direct. Because they are not (per FH), the duty *must* be indirect.
      3.  **Instruction:** Do not allow the discussion to proceed to "what we should do" until the class agrees that for Kant, *moral standing is binary and based on rationality*. Without this lock, the indirect-duty thesis appears arbitrary rather than derived.

  #### 2. Evaluation of the Carrying Example (Minutes 12–30)
  **Proposal:** Farmer A (Humane euthanasia of aging, suffering workhorse) vs. Farmer B (Beats horse for sport).
  **Evaluation:** This pair is **textually faithful but pedagogically risky**.

  *   **The Risk:** The "suffering" element in Farmer A's case invites a **Utilitarian Intuition**. Students will likely argue Farmer A is right *because* it reduces net pain. This derails the Kantian point, which is not about the horse's welfare but the farmer's virtue.
  *   **The Fix:** You must reframe Farmer A's motivation. Do not frame it as "mercy killing to end pain." Frame it as **"Gratitude for Service."** Kant explicitly argues we owe it to the animal's *memory* and our own *humanity* to not discard a faithful servant callously.
  *   **Isolation of Character:**
      *   **Farmer B (Sport):** Clearly isolates the agent's character. The horse's pain is irrelevant to the moral wrong; the wrong is the *malice* and the *hardening of the heart* in the agent.
      *   **Farmer A (Gratitude):** If framed as gratitude, this isolates the agent's character by testing their capacity for **non-instrumental appreciation**. Even though the horse is a means (a tool), the farmer treats the *memory* of the horse as an end.
  *   **Verdict:** Use the pair, but strictly police the justification for Farmer A. If a student says "because the horse was in pain," correct them: "For Kant, the pain matters only because recognizing it cultivates compassion in the *farmer*."

  #### 3. Misconception Sequence & Interception (Minutes 30–40)
  Students will import three specific errors. You must intercept them at these exact points:

  1.  **Misconception:** *"Kant thinks animals are machines that don't feel pain."*
      *   **Interception Point:** **Minute 15 (During the FH Criterion).**
      *   **Defusal:** Clarify immediately that Kant acknowledges animal sentience. The exclusion from the moral community is not metaphysical (they feel nothing) but normative (they cannot legislate laws).
  2.  **Misconception:** *"Animals have derivative rights."*
      *   **Interception Point:** **Minute 25 (During the Indirect Duty Definition).**
      *   **Defusal:** Correct the language. Rights imply a claim *against* someone. Animals have no claims. We have duties *to ourselves* to not violate their nature, because doing so damages our own moral capacity. Use the phrase: "No rights-holder, only a duty-bearer (the human)."
  3.  **Misconception:** *"This is just Indirect Utilitarianism (don't hurt animals or you'll hurt humans later)."*
      *   **Interception Point:** **Minute 35 (During the Example Analysis).**
      *   **Defusal:** Distinguish **Consequences** from **Disposition**. Utilitarianism worries about future outcomes (a cruel man might become a murderer). Kant worries about the *present state of the will*. Cruelty is wrong *now* because it contradicts the duty of self-perfection, regardless of whether the farmer ever hurts a human.

  #### 4. The Final Check (Minutes 40–45)
  **Objective:** Verify the locus of wrongness is the agent's disposition, not the animal's harm.

  **The Exercise:** Pose the "Invisible Barn" Scenario.
  *   **Prompt:** "Imagine Farmer B beats the horse in a soundproof, invisible barn. No other humans ever see it. The farmer's psyche is magically protected, so he does not become violent toward humans later. On Kant's view, is the action still wrong? If so, *what* exactly is damaged?"
  *   **Expected Answer:** It is still wrong. The damage is to the **moral disposition (Gesinnung)** of the agent. The agent has failed in a duty to themselves to cultivate compassion. The animal's harm is the *occasion* of the vice, not the *source* of the wrongness.
  *   **Failure Condition:** If students answer "It's not wrong because no one is hurt" or "It's wrong because the horse suffers," they have not grasped the indirect-duty thesis.

  #### 5. Excluded Material (Minutes 45–50)
  **Objective:** Protect the session scope.

  *   **Refuse to Explain:**
      1.  **Metaphysics of Animal Cognition (*Critique of Judgment*):** Do not engage with Kant's views on whether animals have "comparative reason" or teleological purpose.
      2.  **Taxonomy of Duties (*Metaphysics of Morals*):** Do not distinguish between perfect and imperfect duties regarding animals in granular detail.
  *   **Justification:**
      1.  **Cognitive Metaphysics:** Students have only read the *Groundwork*. Introducing the third *Critique* creates a metaphysical confusion that distracts from the ethical argument based on FH.
      2.  **Taxonomy:** A 50-minute session cannot sustain the legalistic distinctions of the *Doctrine of Virtue*. The core philosophical insight is the *location* of the duty (self vs. other), not its classification within Kant's legal system. Keep the focus on the moral logic, not the systematics.

