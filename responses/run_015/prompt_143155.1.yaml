  5.  **Final Polish:** Ensure the distinction between Utilitarianism (aggregative) and Leibnizianism (structural/holistic) is sharp. Utilitarianism says "1 pain < 1000 pleasure." Leibniz says "This pain is a necessary note in the harmony." The story challenges the latter by making the note dissonant *to the ear of the citizen*.

