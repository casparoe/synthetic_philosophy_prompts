      *   *Point 1:* Omelas as a maximal whole. The child isn't a cost; the child is the shadow required for the light to exist *as light*.
      *   *Point 2:* Knowledge. In Leibniz, we don't usually know the whole plan. In Omelas, we do. This collapses the "faith" required for theodicy into "complicity."
      *   *Point 3:* The Walkers. They reject the Sufficient Reason of Omelas. They seek a world that is incompossible with Omelas.

