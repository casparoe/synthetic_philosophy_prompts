      *   *Angle B: The Voltairean Critique via Leibniz.* Use Leibniz to show *why* Omelas fails. Leibniz requires harmony; Omelas has a fracture (the knowledge). The "walking away" is the admission that this world is *not* compossible with true goodness.
          *   *Pros:* Fits the *Candide* context. Acknowledges the moral horror.
