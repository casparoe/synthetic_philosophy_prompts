prompt: |-
  I am a high school senior preparing to lead a forty-minute discussion session for my peers in an advanced philosophy seminar; none of them have taken university coursework in philosophy of mind or action theory. I need to explain collective intentionality and joint action—not as an abstract definition, but as a dependency-ordered conceptual structure—so that they understand precisely what makes an action genuinely joint rather than merely parallel or aggregative. Please plan the explanatory arc rather than delivering the explanation itself: specify the order in which the components must be introduced and why each depends on the prior one; identify the single concrete scenario that should carry the entire session, noting exactly what features it must possess and what simplifying or misleading features it must lack; map the misconceptions my audience will predictably form—such as reducing joint action to simultaneous individual actions, assuming collective intentionality requires a shared mental representation or a group mind, or conflating joint commitment with mutual emotional sympathy—and indicate precisely where in the sequence each misconception should be headed off; propose one diagnostic question I can ask at the end that will reveal whether they have internalized the dependency structure rather than memorized a label; and state clearly what I should openly refuse to cover at this level—whether debates over plural subjecthood, corporate moral agency, formal models of shared cooperative activity, or specific historical attributions—and explicitly acknowledge that boundary to the group. To keep the idea from being something they have already encountered in popular science summaries, frame the carrying example around a case of partial misalignment: two people jointly repainting a shared wall where each believes they are producing a different final color, yet they continue to coordinate without resolving that divergence, so that the explanation must account for jointness without requiring shared propositional content about the outcome.
