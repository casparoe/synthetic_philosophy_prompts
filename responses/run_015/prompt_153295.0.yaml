          3.  Stability = insurance against future loss/error.
          4.  Single action: True belief (TB) and Knowledge (K) yield identical behavior/risk *now*.
          5.  Therefore, value is about *future* choices (memory/misleading).
          6.  Therefore, value depends on cognitive fragility (perfect mind = no value add).
          7.  Cashing in insurance requires access to justification (more beliefs needing protection).
          8.  Finite mind -> regress or foundationalism (neither delivers protection).
