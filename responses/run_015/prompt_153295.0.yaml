          *   *Critique:* Even in a single action, K and TB might differ in *how* the action is performed or the *confidence* with which it is undertaken, which affects risk assessment. But more importantly, K implies a non-accidental connection to the truth. TB can be lucky. In a single case, luck works. But value is often assessed over types of cases, not tokens.
