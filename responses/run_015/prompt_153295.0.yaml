      *   (2) *Stability Answer:* This is the Socratic/Platonic "tethering" analogy. Standard epistemological move (reliabilism, virtue epistemology often echo this).
      *   (3) *Stability = Insurance:* Reasonable interpretation.
      *   (4) *Single Action Equivalence:* **Critical Step.** This is the "Action Guidance" objection. If I TB that $p$ and act on $p$, and I K that $p$ and act on $p$, the outcome is the same. *However*, this ignores the *probability* of the belief being true in the first place (though the premise assumes TB is true) and the *counterfactual* robustness.
      *   (5) *Deferral to Future:* Follows from (4). If no difference now, must be later.
      *   (6) *Cognitive Fragility:* Follows from (5). If I never forget/never misled, stability is irrelevant.
      *   (7) *Access Requirement:* **Critical Step.** "To cash in that insurance I need access to the justification." This assumes *Internalism*. If justification is external (reliabilism), I don't need access to the justification to have the stability.
      *   (8) *Regress/Foundations:* Follows from (7). If internalism is required, we have the regress problem.
