      *   **Link C: Step (6) - The "Perfect Mind" Counterfactual.**
          *   *Critique:* Even a perfect mind needs to navigate a changing world. Knowledge involves understanding *why*, which allows for extrapolation to new situations. TB is specific; K is often generalizable.

