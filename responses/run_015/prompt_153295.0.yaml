      *   **The User's Suspicion:** Something slipped between (4) and (5) or in (6). They suspect a confusion between dispositional vs. occurrent belief.
      *   **The Goal:** Identify the weak link, suggest which step to reject, explain the cost, assess confidence, and flag uncertainty.

  2.  **Evaluate the Argument Steps:**
