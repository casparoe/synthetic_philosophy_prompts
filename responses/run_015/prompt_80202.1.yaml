answer: |-
  This is a classic "motte-and-bailey" style equivocation that often pops up in introductory metaphysics or philosophy of language discussions. It feels compelling because it leverages the intuitive appeal of pragmatic deflationism (that "true" is a tool for agreement) and smuggles in a substantive definition of truth that no serious deflationist actually holds.

  You should reject **Step (3)**.

  Here is the breakdown of why that step is the break, why it looked plausible to your friend, and what it costs you to fix it.

  ### The Break: Step (3)
  > **(3) Therefore "S is true" is true just in case S is asserted or endorsed.**

  This step commits a category error. It conflates the **illocutionary force** of a sentence (what you are *doing* when you say it) with its **truth conditions** (what makes the sentence *correct*).

  Deflationists (whether disquotationalists like Quine/Horwich or pragmatic ones like Strawson/Brandom) argue that the *function* of the truth predicate is to enable endorsement. However, they do not argue that the *truth* of the sentence depends on the endorsement taking place.

  *   **What Deflationism Actually Says:** "S is true" is equivalent to **S**.
  *   **What Step (3) Claims:** "S is true" is equivalent to **"S is asserted."**

  If you are a deflationist, you accept the Disquotation Schema:
  > "Snow is white" is true **if and only if** snow is white.

  Your friend's argument tries to swap the right-hand side for:
  > "Snow is white" is true **if and only if** someone asserts "snow is white."

  That is not deflationism; that is a form of verificationism or radical relativism, which deflationists explicitly reject. Deflationism removes the *metaphysical weight* of truth, not the *objective conditions* of the underlying sentence.

  ### Why Did It Look Fine?
  Step (3) looks plausible because of an ambiguity in Step (1).

  When pragmatic deflationists say "The point of 'true' is to endorse," they are talking about **why we have the word in our language.** They are giving a functionalist genealogy of the predicate.
  *   *Example:* Why do we have hammers? To hit nails.
  *   *Fallacious Inference:* Therefore, a hammer is only a hammer when it is hitting a nail.

  Your friend moved from "The *purpose* of the predicate is endorsement" to "The *satisfaction conditions* of the predicate are endorsement."

  It also feels right because in ordinary conversation, saying "That's true" *is* a speech act of agreement. If I say "It's raining" and you say "That's true," you are indeed endorsing my claim. But the *truth* of your statement ("That's true") depends on whether it is actually raining, not on the fact that you opened your mouth to agree with me.

  ### The "Generalization" Counter-Argument
  There is another reason Step (3) fails, which is often the deflationist's trump card (originally from Quine).

  We use "true" not just to endorse single sentences, but to make generalizations.
  > **"Everything the Pope says is true."**

  If Step (3) were correct, this sentence would mean:
  > **"Everything the Pope says is asserted."**

  This is obviously nonsense. The Pope might have secrets he never asserts. Or, more damningly, if *you* say "Everything the Pope says is true," you are not asserting that the Pope asserts them; you are asserting that the *content* of his claims holds.

  If truth were just assertion, blind endorsements would be impossible. You couldn't say "Whatever logic proves is true" without meaning "Whatever logic proves is asserted," which changes the meaning entirely. Deflationism saves the logical utility of "true" for generalizations; the "truth is assertion" collapse destroys it.

  ### What Does It Cost You to Give Up Step (3)?
  Rejecting Step (3) is very cheap for a deflationist. In fact, it's necessary to remain a deflationist.

  **1. You must admit that 'S' has truth conditions independent of assertion.**
  You have to agree that "2+2=4" is true even if no one ever asserts it. But this isn't a cost! Deflationists agree with this. They just say that the truth condition for "2+2=4 is true" is simply *that 2+2=4*. They don't need a "Truth Property" to explain this; they just need the arithmetic fact.

  **2. You must distinguish between the predicate and the speech act.**
  You have to acknowledge that while *using* the word "true" is an act of endorsement, the *word itself* tracks the world (via the sentence S), not the speaker.
  *   **Cost:** You lose the ultra-radical view that truth is *nothing but* a social move in a language game.
  *   **Gain:** You keep the view that truth isn't a deep metaphysical property corresponding to reality.

  ### Summary of the Fix
  To save deflationism, you simply correct the inference chain at Step (3):

  *   **(1)** Deflationism says "is true" allows us to endorse S without repeating S. (Keep)
  *   **(2)** So the reason "is true" exists is to facilitate endorsement/generalization. (Keep)
  *   **(3)** **Therefore, "S is true" has the same truth conditions as S.** (Replace the friend's step)
  *   **(4)** So "S is true" is true just in case S is the case. (Deflationary equivalence)
  *   **(5)** This does **not** imply S must be asserted to be true. (Blocks the collapse)

  Your friend's argument is a valid *reductio ad absurdum* of the claim that "Truth is Assertion." It is not a valid argument against Deflationism, because Deflationism does not claim "Truth is Assertion." It claims "Truth is Disquotation."

  You can walk back to your friend and tell them they successfully proved that **Pragmatic Reductionism** is false, but they left **Deflationism** untouched.
