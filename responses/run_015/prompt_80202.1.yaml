      *   Analogy: The function of a hammer is to hit nails. Therefore, a hammer is "a hammer" only when it is hitting a nail. (No, it's a hammer regardless of use).
      *   Better Analogy: The function of "I promise" is to make a promise. But "I promise" is not *true* just because I said it; it's a performative. But "S is true" isn't purely performative in that sense; it inherits the truth value of S.
      *   Key Distinction: **Assertibility vs. Truth.** Deflationists usually maintain that "S is true" is equivalent to S. If S is "Snow is white," "Snow is white is true" is equivalent to "Snow is white." It is *not* equivalent to "Someone asserts snow is white."

