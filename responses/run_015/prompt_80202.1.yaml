  3.  **Identify the Core Philosophical Error:**
      *   The argument conflates the **function** of the truth predicate with the **definition** of truth.
      *   Deflationists (like Paul Horwich or Robert Brandom) argue that the *role* of "true" is to facilitate generalization or indirect endorsement.
