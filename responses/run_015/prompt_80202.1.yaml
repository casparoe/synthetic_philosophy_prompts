          *   *Analysis:* **Here is the jump.** This moves from "The *point* of saying 'S is true' is to assert S" to "The *truth condition* of 'S is true' is that S is asserted."
          *   *Critique:* This confuses the *illocutionary force* (what you are doing by saying it) with the *propositional content* (what makes it the case). Deflationists say "S is true" *means* S. It doesn't mean "S is asserted."
