answer: |-
  ### Final Exam: Philosophy of Biology

  **Question 1 (90 Minutes)**

  In their seminal 1979 paper, Gould and Lewontin launched a critique against the "Adaptationist Programme," arguing that evolutionary biology had become overly reliant on plausible stories regarding the selective utility of traits. They introduced the architectural metaphor of the "spandrel"—the triangular space between arches that is a necessary byproduct of construction rather than a designed feature—to illustrate how traits can arise without direct selection. However, a persistent ambiguity remains in the literature regarding the force of this critique. Is the spandrels argument primarily an empirical claim, asserting that many traits are in fact non-adaptive byproducts? Or is it a methodological intervention, challenging the burden of proof and the null hypothesis used by evolutionary theorists when proposing adaptive explanations?

  This distinction is crucial when evaluating contemporary claims in evolutionary psychology. Consider the case of human numerical cognition. One adaptationist hypothesis posits that precise numerical ability was directly selected for in ancestral environments to optimize quantitative foraging, allowing individuals to track resource quantities accurately. A competing hypothesis suggests that numerical cognition is a spandrel: a byproduct of domain-general working-memory architectures and spatial-reasoning capacities that were selected for other tasks, such as navigation or object manipulation, with numerical ability emerging as a non-adaptive consequence of these underlying systems.

  To answer this question successfully, you must move beyond the standard architectural analogy and avoid simply listing morphological examples like the panda's thumb or the male nipple. Instead, you must engage with the logical structure of the explanation. Specifically, you are required to ground your argument in the logical difference between spandrels and exaptations. Recall that while a spandrel originates as a non-adaptive byproduct, an exaptation is a trait that may have originated for one purpose (or no purpose) but was subsequently co-opted by selection for a new function. The distinction hinges on the history of selection versus current utility.

  Your essay must take a committed, defended position on the following core issue: Does treating human numerical cognition as a spandrel rather than an adaptation merely relocate the explanatory targets of evolutionary psychology to different underlying traits (working memory and spatial reasoning), or does it fundamentally weaken the adaptationist evolutionary psychology project by undermining its methodological default? You cannot remain neutral. You must argue either that the adaptationist programme survives intact by shifting focus to the underlying architectures, or that the spandrels critique successfully destabilizes the adaptationist methodology by changing the burden of proof required to claim adaptation.

  Furthermore, your argument must explicitly address whether the spandrels critique is methodological or empirical. If you argue it is methodological, you must explain how this changes the standards of evidence required for the foraging hypothesis. If you argue it is empirical, you must explain what evidence would settle the debate. You must also clarify why the distinction between spandrels and exaptations matters for this specific case. If numerical cognition is a spandrel, it lacks a history of selection for number. If it is an exaptation, it was co-opted for number. Does this historical distinction change the validity of the evolutionary psychology explanation, or only the narrative of origin?

  Your response should be structured as a formal philosophical argument. Begin by defining the methodological stakes of the adaptationist programme. Proceed to analyze the numerical cognition case through the lens of the spandrels critique. Conclude with a definitive statement on the implications for evolutionary psychology. Ensure that you do not conflate the origin of a trait with its current utility. Your grade will depend on the precision of your conceptual distinctions and the coherence of your defended position. You are expected to demonstrate a mastery of the logical relationships between adaptation, byproduct, and exaptation, rather than a mere recollection of historical debates. Write clearly and argue rigorously.

  ***

  ### Model Answer

  The spandrels critique is primarily methodological, and treating human numerical cognition as a spandrel fundamentally weakens the strong adaptationist programme of evolutionary psychology rather than merely relocating its explanatory targets. While adaptationists may argue that focusing on working memory simply shifts the locus of adaptation, this move concedesthe central point of Gould and Lewontin: adaptation cannot be the default null hypothesis.

  To understand why this weakens the programme, one must distinguish logically between spandrels and exaptations. An exaptation acknowledges current utility while denying original adaptive intent; it allows evolutionary psychology to retain a selectionist narrative by claiming co-option. A spandrel, however, denies selection for the trait's origin entirely. If numerical cognition is a spandrel of spatial reasoning, it exists not because numbers were useful, but because spatial architecture necessitates it. This is not a relocation of explanation but a dissolution of the specific adaptive story. The adaptationist programme relies on the assumption that complex function implies selective history. The spandrel critique severs this link.

  Consequently, the critique is methodological. It does not empirically prove that no numerical traits are adaptive; rather, it shifts the burden of proof. Under the adaptationist programme, the null hypothesis is that a trait is optimized by selection. Under the spandrels methodology, the null hypothesis must be that a trait is a byproduct of physical or developmental constraints, requiring positive evidence to claim adaptation. In the case of numerical cognition, the foraging hypothesis assumes selection for quantity tracking. The spandrel hypothesis assumes selection for spatial navigation, with number as a consequence.

  If we treat this as merely relocating the target to spatial reasoning, we preserve the adaptationist mindset that every useful capacity must be selected. However, this ignores the possibility that spatial reasoning itself contains byproduct elements. By insisting that numerical cognition is a spandrel, we force evolutionary psychology to demonstrate why number specifically was selected, rather than assuming it because it is useful now. This weakens the programme because it removes the privilege of the adaptationist explanation. It demands rigorous comparative and developmental evidence rather than plausibility stories about foraging.

  Therefore, the distinction matters profoundly. If numerical cognition were an exaptation, adaptationists could argue it was co-opted for foraging, preserving the selectionist narrative. If it is a spandrel, the selectionist narrative for number is false. Treating it as a spandrel forces evolutionary psychology to abandon the heuristic that current utility equals historical adaptation. This does not destroy evolutionary psychology, but it weakens the strong adaptationist version that dominates the field. It requires a pluralistic methodology where adaptation is one explanation among many, not the default. Thus, the spandrels critique succeeds not by proving traits are useless, but by proving that adaptationist methodology is insufficient to distinguish utility from byproduct without rigorous constraints. The numerical cognition case exemplifies this: without the spandrels critique, the foraging story stands unchallenged; with it, the burden shifts to proving selection occurred, fundamentally altering the explanatory landscape.

  ***

  ### Marking Scheme (Total: 20 Points)

  **1. Conceptual Distinction: Spandrels vs. Exaptations (5 Points)**
  *   **A (5 pts):** Explicitly defines the logical difference: Spandrels are non-adaptive byproducts of origin; Exaptations are co-opted traits with current utility but different/original origin. Applies this to numerical cognition (e.g., noting that calling it an exaptation preserves selectionism, while spandrel denies it).
  *   **B (3-4 pts):** Defines terms correctly but fails to apply the distinction to the numerical cognition case specifically, or treats them as synonymous regarding current utility.
  *   **C (1-2 pts):** Conflates spandrels and exaptations, or suggests spandrels have no current utility (the "useless trait" error).
  *   **D (0 pts):** No distinction made.

  **2. Methodological vs. Empirical Distinction (5 Points)**
  *   **A (5 pts):** Clearly identifies the critique as primarily methodological (burden of proof/null hypothesis) rather than purely empirical (claiming most traits are non-adaptive). Explains how this shifts the standard of evidence for the foraging hypothesis.
  *   **B (3-4 pts):** Identifies the distinction but remains ambiguous about which category the critique falls into, or treats it as purely empirical.
  *   **C (1-2 pts):** Treats the critique solely as an empirical claim about trait prevalence without addressing the burden of proof.
  *   **D (0 pts):** Fails to address the methodological/empirical distinction.

  **3. Argumentative Stance on Evolutionary Psychology (5 Points)**
  *   **A (5 pts):** Takes a committed position (weakens vs. relocates) and defends it consistently. Explains *why* relocation constitutes weakening (or vice versa) based on the methodological shift.
  *   **B (3-4 pts):** Takes a position but relies on neutral surveying of both sides, or the justification for the stance is weak/contradictory.
  *   **C (1-2 pts):** Remains neutral, refusing to choose between weakening or relocating, or argues both are equally true without synthesis.
  *   **D (0 pts):** No clear stance taken.

  **4. Application to Numerical Cognition Case (5 Points)**
  *   **A (5 pts):** Integrates the specific case (foraging vs. working memory/spatial) throughout the argument. Uses the case to illustrate the methodological point.
  *   **B (3-4 pts):** Mentions the case but treats it as an afterthought or generic example not tied to the core philosophical argument.
  *   **C (1-2 pts):** Uses standard examples (panda's thumb, architecture) instead of the required numerical cognition case.
  *   **D (0 pts):** Ignores the specific case study.

  **Specific Penalties:**
  *   **-2 Points:** For using the architectural spandrel analogy as the core of the argument rather than the logical concept.
  *   **-2 Points:** For claiming spandrels cannot have current utility (functional value).
  *   **-2 Points:** For including bibliographies or citations (violating exam constraints).
