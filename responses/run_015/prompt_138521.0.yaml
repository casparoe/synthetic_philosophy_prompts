answer: |-
  Here is the principle. It is designed to eliminate the "moving goalpost" problem while preserving valid structural insights.

  ### The Principle: **The Causal Invariance Protocol**

  A failed prediction is scored **"Not Yet"** if and only if the **causal mechanism** posited remains the **primary active driver** of the system, and the delay is attributable to **friction** (measurement error, temporary counter-forces, or implementation lag).

  A failed prediction is scored **"Wrong"** if the delay or failure is attributable to a **structural break** (a technological, behavioral, or systemic shift) that the theory explicitly ruled out, failed to model, or required retroactive redefinition to accommodate.

  **The Three Clauses:**

  1.  **Mechanism Identity (Motivated by Hubbert/World & Fusion):** You may adjust the *date* of the event, but you may not swap the *engine*. If the original prediction relied on Constraint A (e.g., geological supply), you cannot rescue it by claiming Constraint B (e.g., economic demand) caused the outcome. If the definition of the outcome shifts (e.g., "AI" redefined from "human-level" to "tool-assisted"), the program is degenerating.
  2.  **Exogenous Exclusion (Motivated by Ehrlich & Malthus):** If the theory claims collapse is inevitable due to System X, and System Y (technology/policy) prevents it, the theory is **Wrong**. You cannot retroactively claim System Y was "unpredictable" if the theory treated System X as the *only* binding variable. A model that ignores the system's capacity for innovation is a broken model, not an early one.
  3.  **Latent Pressure (Motivated by Wegener & Antibiotics):** To claim "Not Yet," you must demonstrate that the causal pressure is still accumulating at the predicted rate, merely blocked by a temporary dam. If the pressure has dissipated or the dam has become a permanent feature of the landscape, the prediction is **Wrong**.

  *(Note on Reflexivity: If the prediction's publication caused the avoidance (Limits to Growth), score as **"Self-Negating."** This is distinct from "Wrong"—it credits the theory's influence without validating its inevitability.)*

  ---

  ### The Verdicts You Must Drop

  To apply this principle consistently, you must abandon two of your current protective intuitions. This will feel like a loss, but it is the cost of objectivity.

  **1. Malthus (Modern Era): Drop "Protective Ambiguity." Verdict: WRONG.**
  *   **Why:** You argue the mechanism was binding *then* but stopped *later*. Under Clause 2 (Exogenous Exclusion), this is a refutation. Malthus's core claim was that food production *cannot* outpace population geometrically without misery/vice. Industrial agriculture and the demographic transition proved that innovation *can* decouple these variables permanently.
  *   **The Hard Truth:** Malthus is **Right** as a historian of the pre-1800 world (Latent Pressure existed), but **Wrong** as a forecaster for the industrial world. Protecting him as "Not Yet" conflates "historically descriptive" with "structurally predictive." If you keep him as "Not Yet," you are implicitly betting that innovation will stop, which is a new prediction, not a rescue of the old one.

  **2. Hubbert (World Peak): Drop "Domain Splitting." Verdict: WRONG.**
  *   **Why:** You currently score Hubbert as "Right on time in one domain [US] and dead in another [World]." Under Clause 1 (Mechanism Identity), the "Peak Demand" rescue is inadmissible. Hubbert's curve is a geophysical model of *supply*. If the peak arrives because of *demand* destruction (electrification/efficiency), the geophysical mechanism did not trigger.
  *   **The Hard Truth:** Hubbert US is a **Hit** (Geology held). Hubbert World is a **Miss** (Geology was bypassed by Economics). Treating "Peak Demand" as a victory for Hubbert is like crediting a rain forecast because you turned on a sprinkler.

  ---

  ### The New Commitments

  **1. Antibiotic Resistance: Verdict: NOT YET.**
  *   **Reasoning:** This passes Clause 3 (Latent Pressure). The mechanism (evolutionary selection pressure) is invariant and accelerating. The delay in the "post-antibiotic era" is due to *friction* (new drug discovery, infection control), not a structural break in bacterial evolution. The pressure is still accumulating. Unlike Malthus, where innovation broke the link between population and food, here innovation only *delays* the link between usage and resistance.

  **2. "Peak Demand" (Hubbert Rescue): Verdict: WRONG.**
  *   **Reasoning:** This fails Clause 1 (Mechanism Identity). Swapping a supply-constraint model for a demand-constraint model is a theoretical surrender. It preserves the *word* "Peak" but discards the *physics*. Score this as a new theory (Energy Economics) replacing a failed one (Geophysical Scarcity).

