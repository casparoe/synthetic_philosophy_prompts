  ### Why This Replaces Your Tentative Rule

  Your tentative rule ("stated in advance... mechanism with a clock") is too procedural. It favors theorists who wrote footnotes over those who saw truths (penalizing Malthus for not having a falsification condition in 1798).

  **The Causal Invariance Protocol** is substantive. It doesn't matter if they wrote down a clock; it matters if the *engine they described is still running*.
  *   **Wegener:** Engine (drift) was running, just slow. (**Not Yet/Right**)
  *   **Fusion/AI:** Engine keeps getting swapped. (**Wrong**)
  *   **Ehrlich:** Engine (famine via population) stopped by a variable he ignored. (**Wrong**)
  *   **Limits to Growth:** Engine ran, but the steering wheel moved. (**Self-Negating**)

