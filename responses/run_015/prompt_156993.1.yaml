answer: |-
  This is a fantastic breakdown of Hume's argument. You have correctly identified the tension in "Of Money" that often trips up readers: Hume oscillates between treating money as a neutral veil (the "oil") and treating it as a source of state power (the "war-chest"). Your notes are not a mess; they have accurately captured the two poles of Hume's monetary theory.

  Here is the prediction, the rule analysis, and the test case to separate them.

  ### 1. The Verdict on Meridia
  Hume would likely **approve** of Meridia's strategy, but with a specific caveat about *why* it is good.

  He would argue that Meridia is **better off in terms of state security and foreign influence, but not richer in terms of domestic industry.** By locking the supranational tokens in a vault, the Treasury has successfully decoupled the two functions of money:
  1.  **Domestic Function:** By keeping the tokens out of circulation, they obey the **Proportionality Rule**. They avoid the "dearness" (inflation) that would make their labor uncompetitive (Case 2) and they avoid the sin of artificial credit expansion (Case 3).
  2.  **International Function:** By holding a universally accepted reserve, they secure the **War-Chest Advantage** (Case 1). Even if the tokens sit in a vault, the *knowledge* that the state possesses them allows Meridia to borrow against them or spend them suddenly on mercenaries/alliances.

  Hume explicitly praises the Bank of Amsterdam (in *Of Money* and *Of Public Credit*) for keeping 100% reserves and not inflating the currency. He views a treasury hoard of specie (or its equivalent) as the only legitimate use of excess money, provided it doesn't leak into the domestic market and raise wages/prices.

  ### 2. Which Rule is He Really Running?
  You asked to choose between the **Proportionality Rule** and the **Acceptability/War-Chest Rule**.

  The answer is that Hume runs **both**, but they apply to different spheres. However, if we must identify the rule that determines whether Meridia is *better off* (the value judgment), it is the **Acceptability/War-Chest Rule.**

  Here is why:
  *   **The Proportionality Rule** explains why they *locked the money up*. If they circulated it, prices would rise, and industry would suffer. Proportionality tells us how to *manage* the money to avoid harm.
  *   **The War-Chest Rule** explains why the grant *matters at all*. If Proportionality were the only rule, the quantity of money would be irrelevant to real wealth (as per the Genie case). A hoard of money that never circulates is economically "dead" under strict Proportionality. It is only the War-Chest rule that assigns positive value to the stockpile itself ("The only advantage of a greater plenty... is to the public in its wars and negociations").

  Therefore, the governing principle is a **Dual-Sphere Rule**: Money quantity is neutral/harmful domestically (Proportionality) but potent internationally (War-Chest). Meridia succeeds because it maximizes the international potency while neutralizing the domestic harm.

  ### 3. The Discriminating Case
  To prove that the **War-Chest Rule** is the active ingredient (and not just Proportionality), you need a case where Proportionality is satisfied, but the War-Chest condition fails.

  **The Case: The Hoard of Domestic Paper**
  Imagine a variation where Meridia receives a huge grant of **purely domestic paper notes** (which foreigners refuse) instead of supranational tokens. The Treasury does the exact same thing: locks the entire grant in a vault to prevent inflation and prints a tiny amount of notes to pay the guards.

  *   **Prediction under Proportionality Rule:** The verdict should be **Neutral/Good**. The money is not circulating, so prices remain stable. The "oil" is not flooding the "wheels." The domestic economy is safe.
  *   **Prediction under War-Chest Rule:** The verdict should be **Bad/Useless**. Hume explicitly states that domestic paper credit is "counterfeit" to foreigners. A hoard of money that cannot be used in "wars and negociations with foreign states" provides no advantage. It is just paper in a box.

  **Hume's Likely Verdict:**
  Hume would say this second Meridia is **no better off than before.** He would argue that locking up domestic paper achieves nothing. It doesn't stimulate industry (because it doesn't circulate) and it doesn't project power (because foreigners won't take it).

  **Why this distinguishes the rules:**
  *   If Hume says Meridia is safe/neutral, he is prioritizing **Proportionality** (avoiding inflation is the only goal).
  *   If Hume says Meridia is useless, he is prioritizing **War-Chest** (money is only valuable if it has international purchasing power).

  Given Hume's disdain for paper credit in Case 3 ("foreigners will not accept... it only heightens prices"), he would almost certainly call the hoarded domestic paper useless. This confirms that for Hume, the *value* of a money stock lies in its international acceptability (War-Chest), while the *danger* lies in its domestic circulation (Proportionality).

  ### Summary for your Group
  You can tell your reading group that Hume isn't contradicting himself; he is distinguishing between **Money as Price-Setter** (domestic) and **Money as Power-Projector** (international). Meridia wins because it treats the grant as Power (hoarding it for war) rather than Price (keeping it out of the market). The "rule" is that money is only a public good when it is kept out of private circulation but available for state sovereignty.
