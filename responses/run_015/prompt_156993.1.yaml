prompt: |-
  I'm in a casual reading group on early modern political economy, and this week we went through Hume's essay "Of Money" in his 1752 Political Discourses (we read it on davidhume.org). I made a list of the verdicts he seems to give on money cases, and now I want to predict what he'd say about a new case. His verdicts so far: (1) If some genie doubled everybody's coin overnight in a single isolated kingdom, Hume says the greater or less plenty of money is of no consequence, since prices are always proportioned to the plenty of money — a crown in Henry VII's time served the same purpose as a pound does at present. The only advantage of a greater plenty, he says, is to the public in its wars and negociations with foreign states. He also writes that "M ONEY is not, properly speaking, one of the subjects of commerce; but only the instrument which men have agreed upon to facilitate the exchange of one commodity for another. It is none of the wheels of trade: It is the oil which renders the motion of the wheels more smooth and easy." (2) If a rich trading country gets a big influx of precious metals, he says that "the dearness of every thing, from plenty of money, is a disadvantage, which attends an established commerce, and sets bounds to it in every country, by enabling the poorer states to undersel the richer in all foreign markets." He adds that manufactures gradually shift to provinces where provisions and labour are cheap. (3) If a public bank issues paper credit that augments the circulating coin beyond its natural proportion to labour and commodities, he is against it: such artificial credit is counterfeit money that foreigners will not accept, and it only heightens prices; he even says a bank that locked up all the money it received and never augmented the circulating coin would be more advantageous than a normal one.

  Next, here is the new case. The small trading republic of Meridia recieves a huge grant of a new supranational reserve token that every foreign state accepts for trade, loans, and war finance. Meridia's treasury is scared of the dearness Hume describes, so it locks the entire grant in a vault and keeps it out of domestic circulation; to pay the guards who watch the vault, it prints a small amount of purely domestic paper notes that foreigners refuse to accept. Do you think Hume would say Meridia is better off because of the hoarded token, that the hoard is basically irrelevant unless the token actually circulates at home or gets spent abroad on mercenaries, or something else? I'm less interested in the raw thumbs-up/thumbs-down than in the rule he seems to be running. One rule that fits his verdicts is a proportionality rule: money is only the oil, not a wheel, so the quantity of the circulating medium should stay in its natural proportion to labour and commodities; any increase beyond that is bad because it raises prices, and locking money up is good. Another rule that fits just as well is an acceptability/war-chest rule: what matters is whether the money is real internationally accepted money or mere counterfeit domestic paper; precious metals or universally acceptable tokens give the public weight in wars and negociations, while domestic paper that foreigners reject is useless for that, and the only commercial downside of an influx is the dearness it causes. These diverge on Meridia: the proportionality rule seems to say the locked token does nothing for real wealth (though it avoids the price rise), while the acceptability rule seems to say the hoard is precisely the happy case — you keep the war/negotiation advantage and dodge the dearness. Predict his verdict, say which rule he is really running, and tell me which further case would best tell the two rules apart (for example, if the token were spent abroad on mercenaries versus spent at home on consumption, or if the hoard were in a token foreigners did not accept). Sorry for the ramble, I just find this bit of Hume super confusing and my notes are a mess.
