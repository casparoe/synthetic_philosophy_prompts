          *   Elena: It looks like joint action, but is it *genuine*? If Mara is just maximizing her own efficiency, it's parallel play. Where is the *commitment* to the jointness?
      *   **Round 2: The Variant (Competition vs. Cooperation).**
          *   This is the crux. Outward behavior is identical.
          *   Marcus: If the behavior and the outcome are the same, and both intend their part knowing the other will do theirs, it counts. The private motivation (competition vs. cooperation) is secondary.
          *   Elena: This proves my point! If Mara thinks it's a race, she doesn't have a "We-Intention." She has an "I-Intention" that *happens* to align. Therefore, they aren't truly acting *together* in the strong sense. They are acting in parallel.
      *   **Round 3: The Breakdown Case.**
          *   Scenario: Luis stops adjusting.
          *   Marcus: This shows the fragility of the interlock. If beliefs change, intentions change.
          *   Elena: This shows the lack of a normative commitment. In a true joint action, you feel obligated to adjust *because* we are doing this together.
      *   **Round 4: Practical Implications (Supervision).**
          *   The prompt requires them to conclude *without* conceding that the disagreement matters for praise/blame.
          *   They need to agree that for a manager, the output matters more than the ontology.
