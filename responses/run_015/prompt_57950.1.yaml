answer: |-
  **Setting:** *A quiet corner of the conference center, late afternoon. The seminar on "Social Ontology for Leaders" has broken for coffee. Elena, a philosopher of mind specializing in collective intentionality, and Marcus, a pragmatist focused on action theory and organizational behavior, are standing by the window overlooking the parking lot.*

  **Elena:** You're smiling, Marcus. I assume that's because you think the Mara and Luis case seals the argument for your side.

  **Marcus:** Guilty. It seems to me a perfect example of how we overcomplicate "joint action." You have two agents. Mara intends to move the furniture. Luis intends to scrub the floor. Mara believes Luis will scrub; Luis believes Mara will move. Their sub-plans mesh. The atrium gets clean. Why do we need to posit some mysterious extra ingredient—a "we-intention"—floating above their individual psyches?

  **Elena:** Because the "meshing" is fragile, and your description misses the normative glue. In your view, Mara is essentially saying, "I intend to do my part because I expect you to do yours, and that helps me." But in the case as described, they've never spoken. They've never agreed. If Mara is just optimizing her own workflow based on predictions of Luis's behavior, that's parallel play, not teamwork. It's like two cars merging onto a highway without hitting each other. We don't call that a joint action; we call it traffic coordination.

  **Marcus:** But the prompt specifies they adjust pace when the other is delayed. They cover missed spots *for* the other. That's mutual responsiveness. Bratman would call that the heart of shared intention. It doesn't require a handshake. It requires that I intend that *we* clean the atrium, and you intend that *we* clean the atrium, and these intentions are common knowledge.

  **Elena:** Ah, but there is the rub. "I intend that *we* clean." Can you genuinely intend that *we* do something if you don't conceive of us as a unit? In the standard case, maybe they do. But consider the variant I proposed in the seminar breakout. Mara believes they are in a competition to finish first. Luis believes they are cooperating. Outwardly? Identical. Mara moves the chairs quickly so she can "win" by finishing her side. Luis scrubs efficiently to "help" the team.

  **Marcus:** I grant that their internal narratives differ. But look at the functional structure. Mara still intends to move the chairs *knowing* Luis will scrub. She still adjusts her pace. If she didn't, she'd lose the "race" because the floor wouldn't be ready. Her individual intention is interlocked with his. The joint action exists in the interlocking, not in the warm fuzzy feeling of cooperation.

  **Elena:** This is exactly where I think your reductionism fails. If Mara thinks it's a competition, she does *not* intend that *we* clean the atrium. She intends that *she* wins the cleaning of the atrium. She is using Luis as a tool or an obstacle. If Luis trips and falls, a co-operator stops to help because the joint project is threatened. A competitor might speed up to secure the win. If the ontology of joint action is just "interlocking individual intentions," then in the competition variant, they *are* acting jointly. But intuitively, they aren't. They are acting in coincidence. If we can't distinguish the competitor from the co-operator ontologically, your definition is too broad.

  **Marcus:** I disagree that we can't distinguish them. We distinguish them by looking at the stability of the intentions under counterfactuals. But for the purpose of labeling the action *now*, while the floor is being cleaned, the structure is the same. However, let's push your "Shared Attitude" view. You say they need a distinctive shared attitude. In the night crew scenario, they never speak. When does this attitude form? Did it magically appear on week three?

  **Elena:** It forms when they start acting *as a body*. It's not magic; it's a mode of intending. When Mara moves the chair, she isn't just thinking "I move this." She is thinking "We are clearing the way." Even if she can't articulate it. The commitment is to the joint activity, not just the individual slice.

  **Marcus:** Let's test that commitment with the breakdown case. Suppose Luis decides he's had enough. He stops adjusting his pace. He just scrubs his zone and leaves the rest, ignoring Mara's delays.

  **Elena:** Precisely. On my view, Luis has violated a normative commitment inherent in the joint action. He owed it to the "us" to adjust. That's why Mara feels let down, not just inconvenienced.

  **Marcus:** On my view, Luis has simply changed his belief. He no longer believes Mara will finish in time, or he no longer cares about the outcome that required meshing. His individual intention shifts from "I scrub assuming Mara moves" to "I scrub my zone and go home." The "obligation" you feel is just the frustration of your own plan failing because your prediction of his behavior was false.

  **Elena:** But that reduces the social bond to a failed prediction. If I promise to meet you for lunch and I don't show up, I haven't just falsified your prediction; I've broken a commitment. In the cleaning crew, the routine creates a tacit commitment. If your theory is right, Mara shouldn't feel betrayed when Luis stops adjusting. She should just update her probability model of Luis's reliability.

  **Marcus:** And maybe "betrayal" is just the emotional name we give to a shattered expectation of interlocking intentions. Look, Elena, I understand you want to protect the specialness of teamwork. But for a manager, for an engineer designing a system, positing a "group mind" or irreducible "we-intentions" adds complexity without predictive power. If I know Mara's goals and Luis's goals and what they know about each other, I can predict the cleaning. I don't need to know if they feel like a "team."

  **Elena:** But you *can't* predict the cleaning with just individual goals in the competition variant. If Mara thinks it's a race, and Luis gets sick, she might finish the whole atrium herself to win. If she thinks it's cooperation, she might stop to help him. The "shared attitude" determines the response to disruption. The interlocking individual intentions don't tell us *how* they interlock when things go wrong unless we know the mode of that interlocking. Is it adversarial or cooperative?

  **Marcus:** Fair point. The *content* of the intention matters. But the content can still be an "I-intention." "I intend to do my part in our competition" vs. "I intend to do my part in our cooperation." Both are individual intentions with different propositional contents. I don't need a special *mode* of intending, just different *objects* of intention.

  **Elena:** You're shifting the goalposts. If the object is "our competition," you are still referencing a "we." You're smuggling the collective in through the back door of the proposition. You can't have "our competition" without a plural subject.

  **Marcus:** I can have "the competition between Mara and Luis." That's a state of affairs I observe and intend to participate in. I don't need to be part of a plural subject to intend to participate in a rivalry.

  **Elena:** *Sighs.* We're circling. Let's look at the practical implication, since we're supposed to be advising managers. If I'm the supervisor watching the cameras, does it matter? If the floor is clean, do I care if Mara thinks she's racing Luis?

  **Marcus:** For the purpose of praise or blame? No. If the atrium is clean and the routine is stable, I praise them as a team. I say, "Good work, you two coordinated well."

  **Elena:** And if it turns out Mara was competing?

  **Marcus:** I still praise the outcome. The coordination happened. The ontology doesn't change the payroll.

  **Elena:** I agree with that, actually. And that's the irony. As a philosopher, I insist the distinction is real and fundamental. Mara *is* doing something different in her head in the competition variant. But as a supervisor? You're right. I can't punish her for her private ontology if the public action is cooperative.

  **Marcus:** So we agree on the management advice, even if we disagree on the metaphysics?

  **Elena:** Mostly. Though I would add a caveat. If you want the team to survive a crisis—like Luis getting sick or the scrubber breaking—the "shared attitude" team will hold together better than the "interlocking individual" team. The competitor will abandon the ship. So, for long-term resilience, your ontology might lead you to hire the wrong people if you don't screen for that "we-mode."

  **Marcus:** That I can accept. Screen for the attitude, even if you don't need to define it metaphysically to sign the paycheck. So, in the breakdown case, if Luis stops adjusting, you blame him for lacking commitment, and I blame him for being an unreliable partner in the interlock.

  **Elena:** And we both tell the supervisor to write him up.

  **Marcus:** Exactly. The floor gets clean, or it doesn't. The rest is for the seminar room.

  **Elena:** *Laughs.* Well, since we're in the seminar room, I still maintain you're wrong about the "we." But for the sake of the night crew's morale, I'll let you have the practical win.

  **Marcus:** I'll take it. As long as Mara keeps moving the chairs.
