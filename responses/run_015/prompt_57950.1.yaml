      *   **The Case:** Mara and Luis (custodians). Overlapping shifts, no explicit agreement. Smooth routine (Mara moves furniture, Luis scrubs). Adjust pace, cover missed spots. No verbal plan.
      *   **Variant:** Mara thinks it's a competition; Luis thinks it's cooperation. Outward behavior is identical.
      *   **Breakdown Case:** Coordination fails because one stops adjusting.
      *   **Format:** Extended dialogue between two philosophers.
      *   **Positions:**
          *   Philosopher A (Shared Attitude): Genuine joint action requires a distinctive shared attitude (we-intention) not reducible to individual goals + mutual expectations. (Searle/Tuomela/Bratman-esque but leaning towards irreducibility).
          *   Philosopher B (Interlocking Individualism): Ordinary individual intentions directed at the shared pattern, interlocked with true beliefs about the other, are enough. (Bratman-esque reductionism or Gilbert-lite).
      *   **Constraints:** Equally knowledgeable/charitable, direct responses (not speeches), test both versions of the case + breakdown case, conclude without conceding on the *practical* implication for supervision (praise/blame).

  2.  **Character Conception:**
      *   **Philosopher A (The Pluralist/Shared Mind):** Let's call her *Elena*. She argues for "We-Intentions." She believes there's a psychological gap between "I intend that we J" and "I intend my part + I believe you intend your part."
      *   **Philosopher B (The Individualist/Interlock):** Let's call him *Marcus*. He argues for "Interlocking I-Intentions." He believes we don't need mysterious group minds, just meshing sub-plans.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. They are discussing the user's specific case (Mara and Luis).
      *   **Round 1: The Basic Case (Smooth Coordination).**
