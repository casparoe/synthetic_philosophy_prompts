  2.  **Deconstruct the TA's Argument (The Ramsey Equation):**
      *   Equation: $r = \rho + \eta g$.
      *   $r$: Social Discount Rate.
      *   $\rho$: Pure rate of time preference (impatience/ethics).
      *   $\eta$: Elasticity of marginal utility of consumption (inequality aversion).
      *   $g$: Growth rate of consumption.
      *   TA's claim: $r$ is determined by market returns (opportunity cost). High $g$ means future is rich, so $\eta g$ is high, so $r$ is high. Therefore, don't spend now.
      *   User's intuition: This feels like a category error.

  3.  **Drafting the Correspondence Table (Task 1):**
      *   Need to map Financial Investment vs. Climate Mitigation.
      *   *Investor:* Present Generation vs. Present Generation.
      *   *Principal:* Capital ($$$) vs. Carbon Budget/Stability.
      *   *Term:* 50-200 years vs. 50-200 years.
      *   *Interest Rate:* Market Return ($r$) vs. Avoided Damage Rate (Return on Mitigation).
      *   *Default Risk:* Bankruptcy vs. Tipping Points/Catastrophe.
      *   *Consumer of Returns:* Same Investor (usually) vs. Different People (Future Gen).
      *   *Fungibility:* Money is fungible vs. Climate stability is not perfectly fungible with GDP.

  4.  **Addressing the Four Objections (Task 2):**

      *   *Objection 1 (Double Counting/Direction):* The TA uses growth ($g$) to say future people are rich (so don't help them) *and* implies high discount rates justify low investment. But high returns on capital *also* mean mitigation needs to beat that rate. However, if mitigation *prevents loss*, it's not about growing a pie, it's about saving the oven. The "rich future" argument relies on growth continuing *despite* climate change. If climate change kills growth, $g$ drops, and the argument collapses. This is the "endogeneity of growth" critique.
      *   *Objection 2 (Fungibility/Discounting in Kind):* This is the "specific vs. general capital" argument. Money is fungible; a stable coastline is not. If the future is rich in iPhones but dead from heat, the marginal utility of iPhones is irrelevant. This connects to "critical natural capital." The user's intuition is coherent: it's the distinction between *substitutable* and *complementary* goods.
      *   *Objection 3 (Identity/Utility Function):* Standard economics assumes a representative agent. Reality is overlapping generations. The "investor" doesn't die and cash out. The "chain of being" matters. This breaks the "lifecycle" justification for discounting.
