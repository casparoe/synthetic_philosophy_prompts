answer: |-
  So my logician buddy tries to dodge the livery stable fees using the old School of Names trick.
  He tells the stablemaster, "Your sign says 'Horses pay 5 coins'. I have a white horse. White horse is not horse. So I pay zero."

  Stablemaster doesn't even blink. "Fine. But the insurance policy covers 'Loss of Horse'."
  Buddy says, "Great, I'm covered then."
  Stablemaster shakes his head. "Nope. You don't have a horse on file. You have a white horse. If it dies, you didn't lose a horse. You lost a white horse. Those are different assets in the ledger."
  Buddy pales. "So I get nothing?"
  "Worse. Since 'White' modifies 'Horse' to create a new kind, and you don't have a 'Horse' kind registered, the stable isn't liable for the structure either. If your non-horse kicks down the fence, your personally liable for damages to the 'Horse' fence."
  Buddy sighs, "Can I just paint it black?"
  "Nope. Then it's a Black Horse. Also not a horse. You gotta shave the color off."
  "How do I shave color?"
  "Not my problem. Read the contract."

  ***

  **Why the punchline lands (Intensional Logic Read):**
  I'm treating this through a strict **intensional identity** framing. In this read, "Horse" isn't a set containing instances (extensional), but a specific concept or form (intension). "White" is a separate concept. When you combine them, you aren't narrowing down the set of horses; you're creating a compound concept `White-Horse` that is logically distinct from `Horse`. 

  The punchline works because the stablemaster weaponizes this severance. If `White-Horse` ≠ `Horse`, then any rule, benefit, or liability attached to the universal `Horse` literally cannot apply to the instance `White-Horse`. The modifier doesn't just describe the horse; it ontologically splits it off from the category. The joke fails if you think extensionally (where a white horse is obviously a member of the set of horses), but lands hard if you accept the premise that adding a property creates a new, disjoint type that loses the privileges of the base type.

  **Historical Note:**
  I'm taking liberties with the **Gongsun Long** *Bai Ma Lun* (White Horse Dialogue). Historically, scholars debate whether he was making a metaphysical claim about forms (Platonism-ish) or a linguistic point about reference vs. sense. Modern reconstructions (like Chad Hansen's) suggest it might be about mass nouns vs. count nouns in Classical Chinese, rather than strict type theory. I'm leaning on the analytic philosophy reconstruction (intensional logic) because it makes for a cleaner joke, even if the actual Warring States context was probably more about political naming conventions (rectification of names) than stable fees. Also, Gongsun probably didn't worry about insurance polices.
