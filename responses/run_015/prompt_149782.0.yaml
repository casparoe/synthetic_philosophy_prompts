      *   *Classic Example:* Lady Chatterley's Lover. Mr. A (Prude) prefers: Nobody reads > A reads > B reads. Mr. B (Lewd) prefers: A reads > B reads > Nobody reads.
      *   *Liberal Right:* A decides between (Nobody reads) and (A reads). B decides between (B reads) and (Nobody reads).
      *   *Result:* A exercises right $\rightarrow$ Nobody reads (because A hates B reading less than A reading? No, A hates anyone reading). Let's stick to the structure:
          *   A has decisive say on whether A reads.
          *   B has decisive say on whether B reads.
          *   But they both care about what the *other* does.
      *   *The Trap:* If A says "I won't read" (to avoid prurience) and B says "I won't read" (to avoid prudishness? No, B wants A to read).
      *   *Simplified for Game:* We need a scenario where individual vetoes block a mutually beneficial outcome, OR where individual vetoes force a mutually hated outcome.
      *   *Better Fit for "Commune":* The "Negative Liberty" version. Everyone has a veto on what enters the shared space.
      *   *The Paradox:* If everyone has a veto, we might end up with *nothing* happening, even if everyone prefers *something* happening over *nothing*. OR, we end up with a specific outcome that everyone hates because of how the vetoes interact with preferences about others.
