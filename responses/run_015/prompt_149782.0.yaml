answer: |-
  # Workshop: The Common Wall
  **Time:** 75 Minutes
  **Players:** 10 (1 Facilitator, 2 "Creators", 7 "Residents")
  **Materials:** 10 envelopes, 10 scorecards, pens, a whiteboard (the "Wall"), 3 printed images (Blank, Abstract A, Abstract B).

  ## Core Concept
  You are simulating a commune governed by **The Sovereignty Clause**: *No member may be forced to experience (or impose) a shared environment they personally reject.*
  *   **The Trap:** Two members have the right to decide on their own contributions. Both are modest and veto their own work. The group prefers *any* art over a blank wall. By honoring individual rights, the group guarantees a result everyone hates.

  ---

  ## Part 1: Setup & Constitution (15 Minutes)

  **1. The Story (5 mins)**
  Tell the group: "You are ten members of 'The Haven.' You share a living room with one large digital display—the Common Wall. It defines the mood of the house. You must decide what goes on it for the coming month."

  **2. The Constitution (5 mins)**
  Write these two rules on the whiteboard. Read them aloud.
  *   **Rule 1 (Liberal Right):** The person who creates an image has sole authority to approve or reject it. No vote can override this.
  *   **Rule 2 (Pareto Spirit):** The group seeks the outcome that maximizes total satisfaction. If everyone agrees Option X is better than Option Y, we should not choose Y.

  **3. Role Assignment (5 mins)**
  Hand out envelopes. Tell them **not** to show anyone the contents.
  *   **2 Envelopes (Creators):** Marked "Artist A" and "Artist B".
  *   **8 Envelopes (Residents):** Marked "Resident".

  **Inside the Envelopes (Preference Cards):**
  *   **Artist A Card:**
      *   *Your Right:* You decide between **[Blank Wall]** and **[Art A]**.
      *   *Your Preference:* 1. Art B on Wall. 2. Blank Wall. 3. Art A on Wall.
      *   *Note:* You love B's work, but you are deeply ashamed of your own. You would rather have a blank wall than show your art.
  *   **Artist B Card:**
      *   *Your Right:* You decide between **[Blank Wall]** and **[Art B]**.
      *   *Your Preference:* 1. Art A on Wall. 2. Blank Wall. 3. Art B on Wall.
      *   *Note:* You love A's work, but you are deeply ashamed of your own. You would rather have a blank wall than show your art.
  *   **Resident Card (All 8 identical):**
      *   *Your Right:* You vote only if both Artists agree to show work.
      *   *Your Preference:* 1. Art A on Wall. 2. Art B on Wall. 3. Blank Wall.
      *   *Note:* You just want color. You don't care whose art it is, but a blank wall feels dead.

  ---

  ## Part 2: The Negotiation (30 Minutes)

  **Phase 1: Open Discussion (15 mins)**
  *   **Goal:** Reach a consensus on the Wall.
  *   **Facilitator Script:** "Discuss freely. Try to maximize group happiness. Remember Rule 1: Artists have final say on their own work."
  *   **What will happen:** Residents will beg Artists to show work. Artists will express shame. Residents might suggest a trade ("I'll show mine if you show yours").
  *   **Intervention:** If Artists agree to trade, **stop the game.** Tell them: "Wait. Check Rule 1. Does trading your veto count as 'forcing' yourself? The Sovereignty Clause says you cannot be forced to experience what you hate. If you truly hate your art on the wall, agreeing to a trade is self-coercion. You must vote according to your *true* preference, not a deal."
      *   *Why:* This blocks the "Coasean" solution. Sen's paradox holds when rights are inalienable. Force them to sit with the discomfort of refusing the trade.

  **Phase 2: The Voting (15 mins)**
  *   **Step 1:** Ask Artist A: "Do you approve Art A for the wall?" (They must say No, per their card).
  *   **Step 2:** Ask Artist B: "Do you approve Art B for the wall?" (They must say No, per their card).
  *   **Step 3:** Ask Residents: "Given both artworks are vetoed, what remains?"
  *   **Outcome:** The Blank Wall.
  *   **Action:** Place the "Blank" image on the whiteboard. Let the silence hang for 30 seconds.

  ---

  ## Part 3: Scoring & Reveal (15 Minutes)

  **1. Calculate Harmony Points**
  Hand out scoring slips.
  *   **Got 1st Choice:** 3 Points.
  *   **Got 2nd Choice:** 1 Point.
  *   **Got 3rd Choice:** 0 Points.

  **Ask for a show of hands:**
  *   "Who got 3 points?" (Likely no one, or very few).
  *   "Who got 0 points?" (Everyone, because Blank was the 3rd choice for Residents and 2nd for Artists).
      *   *Correction:* Artists get 1 point (Blank was 2nd choice). Residents get 0 points (Blank was 3rd choice).
      *   **Total Score:** (2 Artists × 1) + (8 Residents × 0) = **2 Points.**
      *   **Max Possible Score:** If Art A was chosen: (Artist A: 0) + (Artist B: 3) + (Residents: 3 each) = **27 Points.**

  **2. The Reveal**
  Ask the Artists to read their preference cards aloud.
  *   Artist A: "I preferred Art B over Blank."
  *   Artist B: "I preferred Art A over Blank."
  *   Residents: "We preferred Any Art over Blank."

  **Ask the room:** "Did anyone get what they wanted? No. Did anyone break the rules? No. You followed the Constitution perfectly. So why did the commune fail?"

  ---

  ## Part 4: Debrief & Mapping (15 Minutes)

  **1. Name the Paradox (5 mins)**
  Tell them: "You just lived through **Sen's Liberal Paradox**."
  Write on the board:
  *   **Liberalism:** At least two people have decisive power over something personal (Artists over their own art).
  *   **Pareto Efficiency:** If everyone prefers X to Y, society should pick X. (Everyone preferred Art A or Art B over Blank).
  *   **The Contradiction:** You cannot have both. By protecting the Artists' rights, you violated the Group's efficiency. By forcing efficiency, you would have violated the Artists' rights.

  **2. Map the Experience (5 mins)**
  *   **The Veto:** This was the "Liberal Right." It felt good to have it, but using it hurt you.
  *   **The Score:** This was "Social Welfare." It crashed because rights were absolute.
  *   **The Frustration:** This is the "Cycle." If you tried to vote Art A > Blank, Artist A blocks it. If you vote Art B > Blank, Artist B blocks it. If you vote Art A > Art B, Artist A still blocks Art A. You are stuck.

  **3. Novel Application (5 mins)**
  Ask the writer: "In your book, where does the 'Blank Wall' show up?"
  *   *Prompt:* Is there a moment where two characters protect their boundaries so fiercely that the relationship dies, even though both wanted connection?
  *   *Prompt:* Does your commune have a mechanism to *temporarily suspend* rights? (Note: Sen says if you do, you aren't fully liberal anymore).

  ---

  ## Facilitator Notes: What Will Go Wrong

  **1. The "Deal" Problem**
  *   **Risk:** Artists will say, "I'll show mine if you show yours."
  *   **Fix:** You must be the "Constitution." Interrupt firmly. "The rule is about *exposure*, not *exchange*. If you hate your art on the wall, showing it violates your sovereignty. You cannot consent to coercion." This is crucial. If they trade, the paradox disappears. The pain of the *untradeable right* is the lesson.

  **2. The Residents Revolt**
  *   **Risk:** Residents might try to vote to override the Artists.
  *   **Fix:** Remind them of Rule 1. "In this commune, sovereignty trumps democracy." This highlights the tension between liberty and collective will.

  **3. Emotional Disconnect**
  *   **Risk:** Artists don't feel "ashamed."
  *   **Fix:** During setup, lean into the roleplay. "This art is a diary entry. It's too raw." Make the veto feel protective, not petty.

  ---

  ## Honest Limitation Note (For Your Eyes Only)

  **What this game does NOT reproduce:**
  Sen's formal theorem is about **transitive social preference orderings**, not just a single bad outcome.
  *   *Formal Sen:* Society prefers A > B, B > C, but C > A (a cycle), making rational choice impossible.
  *   *This Game:* Produces a **Pareto-Inferior Equilibrium** (Blank Wall).
  *   *Why:* Simulating a full preference cycle with 10 people in 75 minutes is cognitively overwhelming and feels like a math puzzle.
  *   *Trade-off:* We sacrificed the *cyclical logic* for the *emotional impact* of a sub-optimal outcome.
  *   *For the Novel:* This is actually better for fiction. Characters don't care about transitive cycles; they care about ending up with the "Blank Wall"—the result where everyone followed the rules and still lost. Use the game's emotional frustration, not the mathematical cycle.

  **Final Tip:** When you name Sen at the end, don't explain the math. Say: "Amartya Sen proved that if you value individual freedom and collective welfare equally, the system will sometimes break. Your job as a novelist is to decide which one your characters sacrifice."
