      *   *Alice's Right:* Decides between Blank and Her Painting.
      *   *Bob's Right:* Decides between Blank and His Sculpture.
      *   *Preferences:*
          *   Alice: Sculpture > Blank > Her Painting (She's modest/hates her own work, loves Bob's).
