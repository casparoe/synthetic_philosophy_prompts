      *   *Round 1:* Open negotiation. They will likely solve it (trade).
      *   *Round 2:* Strict Constitutional enforcement. No trading rights.
      *   *This shows the tension.*

      *   *Actually, to make it "feel" the contradiction, the mechanism needs to be rigid.*
      *   *Let's use a "Proposal & Veto" system.*
      *   *Step 1:* Propose an state (Blank, Art A, Art B).
