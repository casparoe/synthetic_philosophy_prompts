      *   Target: Show that maximizing individual rights minimized group score.

  6.  **Addressing the "Honest Note" on Limitations:**
      *   Sen's theorem is about *transitive social preference orderings*. A game usually produces a single *outcome*.
      *   The game demonstrates the *Pareto-libertarian incompatibility* (the outcome is Pareto inferior), but it can't fully reproduce the *cyclical social ordering* without multiple rounds of voting that might confuse players.
      *   I need to be honest that this simulates the *outcome* inefficiency, not the full mathematical impossibility of a social welfare function.

