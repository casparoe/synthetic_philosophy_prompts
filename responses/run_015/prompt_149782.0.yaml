      *   *This is getting too abstract.* Let's make it concrete.

      *   *New Concept: "The Playlist Paradox".*
      *   *Context:* A shared audio feed in the common house.
      *   *Rule:* "Sovereignty of Ears." No one can be forced to hear a track they veto.
      *   *Mechanism:* We need to construct a cycle.
      *   *Actually, the most visceral version of Sen is when exercising rights leads to a Pareto-inferior outcome.*
      *   *Example:* A wants B to read the book. B wants A to read the book. Neither wants to read it themselves.
      *   *Commune Version:* "The Chore/Art Swap."
      *   *Let's go with "The Wall".*
      *   *Three states:*
