      *   *Outcome:* Alice exercises right $\rightarrow$ No Painting (chooses Blank over Painting). Bob exercises right $\rightarrow$ No Sculpture (chooses Blank over Sculpture). Result: Blank Wall.
      *   *Pareto Check:* Everyone prefers (Painting OR Sculpture) over Blank. But the exercise of rights led to Blank.
      *   *This is the one.* It's simple, emotional (modesty vs. appreciation), and fits the "no forced exposure" rule (Alice can veto her own art being shown).

