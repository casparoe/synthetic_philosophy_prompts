answer: |-
  Resolving whether complicity constitutes a distinct moral wrong is the highest priority because it is the only ethical framework that sustains individual obligation when causal impact is negligible. This question is upstream of the inefficacy debate because even if we concede your friend's point that your personal footprint is a rounding error, the complicity argument maintains that contributing to harm is inherently wrongful regardless of the outcome. For everyday choices like voting or diet, this distinction is the difference between paralysis and action; if complicity holds, you act to keep your hands clean rather than to save the world, which changes the cost-benefit analysis entirely. The inefficacy question ranks second because it is largely an empirical modeling problem rather than a normative one; we already have strong data suggesting individual causal leverage is low in large systems, so the philosophical heavy lifting lies in justifying action despite those numbers. Threshold-sensitive obligations rank third because they are secondary modifiers that only apply once you have established a primary duty to act; determining whether your obligation depends on others' participation is irrelevant if you haven't first determined whether you have an obligation at all. Evidence that would bump inefficacy to the top would include new climate or political science models demonstrating precise tipping points where single actions reliably trigger cascading collective changes, rendering the complicity argument unnecessary. Conversely, if rigorous non-consequentialist ethical theories fail to ground complicity without relying on magical thinking or superstition, that issue drops below thresholds, forcing a reliance on coordination mechanisms as the only viable path to moral action.
