prompt: |-
  You are a professional philosopher with deep expertise in moral philosophy, particularly in the normative structure of interpersonal commitments and the ethics of agreement. I am a journalist covering science and ideas, and I am writing a feature on why people feel bound by pledges they made years ago even when the world around those pledges has completely changed. Before you respond, please think carefully and take a step back. Start with some brief brainstorming: outline the main philosophical accounts of why promises generate obligations—such as expectation-based, practice-based, and normative-power-based approaches—without yet applying them. Then turn to the concrete situation.

  Consider Dr. Elena Voss, a neuroscientist who made a detailed verbal agreement with her former lab partner, Dr. Marcus Chen, that neither would publish preliminary findings from their joint dataset without simultaneous co-authorship, no matter the career pressure. The agreement contained no formal release clause; it only included a mutual understanding that either party could invoke a shared "pause" if both consented. Years have passed. Voss has now isolated a major finding that builds partly on Chen's original data. Chen has since left academia entirely, publicly renounced competitive publishing, and explicitly told Voss that he wants her to publish the result alone and quickly for the good of the field. Voss, however, still feels professionally and personally bound to grant him co-authorship because of what she originally said, even though honoring that obligation now seems to violate Chen's explicit current wishes and to delay an important scientific result. She never invoked the "pause," and Chen never formally released her.

  Please analyze whether Voss's original pledge still binds her, and explain more generally what makes a promise binding in cases where the promisee no longer desires the promised performance and no formal release mechanism was ever triggered. Your answer should identify the philosophical structure underlying this situation and apply the relevant theoretical frameworks, rather than offering generic workplace or research-ethics advice.
