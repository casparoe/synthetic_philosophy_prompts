answer: |-
  ### Part I: Theoretical Landscape — Why Promises Bind

  Before we dissect the specific dilemma of Dr. Voss and Dr. Chen, we must map the normative terrain. In moral philosophy, the question of what generates the obligation to keep a promise is not settled; it is the subject of competing frameworks. Each offers a different answer to why a past speech act constrains present action.

  **1. The Expectation and Reliance Account**
  *   **Core Intuition:** Promises are binding because they induce expectations and reliance in others.
  *   **Mechanism:** When I promise you X, I lead you to believe X will happen. You may plan your life around this belief. To break the promise is to harm you by frustrating those expectations or causing loss through reliance.
  *   **Key Proponents:** T.M. Scanlon (Principle of Fidelity).
  *   **Implication for Release:** If the promisee no longer expects the performance, or explicitly states they are not relying on it, the primary moral reason for the obligation evaporates. There is no expectation to disappoint.

  **2. The Practice or Convention Account**
  *   **Core Intuition:** Promising is a social institution, like a game or a legal system.
  *   **Mechanism:** By using the words "I promise," I opt into a pre-existing social practice that has constitutive rules. One of those rules is "promises must be kept unless released according to the practice." The obligation comes from the utility of maintaining the institution of promising itself, not necessarily the specific outcome of this specific promise.
  *   **Key Proponents:** John Rawls, John Searle.
  *   **Implication for Release:** The obligation persists until the *rules of the practice* are satisfied. If the practice dictates that release requires a specific formal act (e.g., "I hereby release you"), a casual remark might not suffice to exit the institutional bond.

  **3. The Normative Power (or Will) Account**
  *   **Core Intuition:** Promising is an exercise of authority over one's own normative landscape.
  *   **Mechanism:** When I promise, I transfer a slice of my autonomy to you. I give you the authority to demand performance. The obligation exists because *you* now hold the right to determine my action in this domain.
  *   **Key Proponents:** Joseph Raz, Seana Shiffrin, David Owens.
  *   **Implication for Release:** Since the authority belongs to the promisee, they hold the exclusive power to waive the obligation. If they indicate they no longer wish to exercise that authority, the obligation ceases, regardless of formalities. The promisee's current will trumps the promisor's past commitment.

  ***

  ### Part II: The Case of Dr. Voss and Dr. Chen

  We can now apply these frameworks to the specific friction between Dr. Voss's sense of duty and Dr. Chen's current wishes.

  **The Conflict: Proceduralism vs. Authority**
  Dr. Voss's hesitation stems from a **Practice-based** interpretation of the agreement. She views the pledge as a self-contained structure with internal logic: *The agreement had a specific mechanism for suspension (the mutual "pause"). That mechanism was not triggered. Therefore, the agreement stands.* She is treating the verbal agreement like a smart contract or a legal treaty, where the validity of the termination depends on adherence to the original clauses. In her view, the "form" of the release matters as much as the "content."

  However, Dr. Chen's position invokes the **Normative Power** account. By explicitly telling Voss to publish alone, he is exercising the authority that the original promise granted him. In this view, a promise is not a chain forged in the past; it is a standing grant of authority from the present. If the holder of that authority (Chen) revokes the grant, the chain dissolves. The lack of a "formal release clause" is philosophically irrelevant because the moral power to release resides in Chen's will, not in the text of the agreement.

  **The Expectation Gap**
  Under the **Expectation/Reliance** account, Voss's obligation is even more tenuous. The harm that promising seeks to prevent is the disappointment of reliance. Chen has explicitly stated he does not expect co-authorship; indeed, he expects the opposite. For Voss to insist on co-authorship is not to protect Chen from harm, but potentially to impose a burden on him (associating him with a competitive process he has renounced) or on the scientific community (delaying knowledge). If the promise was made to serve Chen's interests (as is typical in collaborative agreements), forcing performance when it no longer serves those interests inverts the moral logic of the promise.

  **Why Voss Feels Bound (The Reification of the Promise)**
  Why, then, does Voss feel bound? Philosophically, she is suffering from what we might call the *reification of the normative bond*. She has objectified the promise. She treats the agreement as a third entity standing between her and Chen, one that demands obedience independent of Chen's current input.

  This is a common psychological phenomenon in long-term commitments. The promise shifts from being a *relational tool* (serving the needs of the people involved) to being an *identity anchor* (defining the promisor as a person of integrity). For Voss, keeping the word "as spoken" validates her past self. To change course feels like a betrayal of her own consistency, even if it respects her partner's current autonomy. She is prioritizing *fidelity to the text* over *responsiveness to the person*.

  ***

  ### Part III: The General Philosophical Structure

  To answer your broader question for your feature: *What makes a promise binding when the promisee no longer desires the performance and no formal release was triggered?*

  **1. The Waiver Condition**
  In most robust normative accounts (particularly the Normative Power view), promissory obligations are inherently **waivable by the promisee**. A promise creates a right in the promisee. In moral theory, rights of this nature (rights to another's performance) are generally alienable by the holder. If Chen has the right to co-authorship, he also has the right to discard it.
  *   **The Verdict:** The lack of a formal release mechanism is a procedural defect, not a moral barrier. If the promisee clearly communicates a waiver, the obligation is extinguished. To insist otherwise is to claim that the promisor (Voss) has more authority over the promisee's rights than the promisee does.

  **2. The Purpose of the Constraint**
  Promises are constraints on freedom adopted to secure the interests of others. When the constraint no longer secures those interests—or actively frustrates them—the *raison d'être* of the obligation is gone.
  *   **The Verdict:** An obligation that persists against the explicit will of the beneficiary transforms from a moral bond into a form of moral tyranny. It prioritizes the "sanctity of the word" over the welfare of the person the word was meant to protect.

  **3. The Distinction Between Contracts and Promises**
  Voss is conflating a legalistic contract with a moral promise. In law, formal release clauses matter because the state needs clear evidence of termination to adjudicate disputes. In morality, the "evidence" is the interpersonal understanding.
  *   **The Verdict:** In interpersonal commitments, the *substance* of the release (Chen's clear desire) outweighs the *procedure* of the release (the unused "pause" clause). Voss is applying a legalistic heuristic to a moral relationship.

  ### Conclusion for Your Feature

  Dr. Voss is not bound by the pledge, philosophically speaking. Her feeling of obligation is a category error. She is treating a moral commitment—which is dynamic and responsive to the promisee's current authority—as a static artifact.

  The deeper lesson for your readers is that we often feel bound by past pledges not because the morality of the situation demands it, but because we fear the disruption of our own self-narrative. We want to be the person who "keeps their word." But true moral responsiveness requires recognizing that a promise belongs to the relationship, not the history. When the partner changes the terms of the relationship, the promise must evolve, or it ceases to be a promise and becomes a shackle.

  In Voss's case, honoring Chen's current explicit wish is actually the higher form of fidelity. It respects the authority she originally granted him. By publishing alone as he requests, she is not breaking her promise; she is acknowledging that the power to define the terms of that promise ultimately rests with him, not with the ghost of their past agreement.
