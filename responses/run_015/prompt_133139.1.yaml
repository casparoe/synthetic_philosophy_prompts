prompt: |-
  Hey — I price weird one-off risks at a small specialty insurer: satellite launches, film shoots, music festivals, one custom turbine going overland through three countries. I write maybe 5–8 quotes a week and every single one needs a rate for something that has never happened in exactly this form before. My boss wants a written procedure, and I've been told to ground it in whatever philosophy actually knows about the reference class problem. But it has to be runnable by a junior analyst with a stats minor and no philosophy, in about half an hour, and it has to survive an audit where the regulator points at a file and says "why this class and not that one?"

  Here's the mess I actually live in. The same event slots into a pile of different classes — small-launch-vehicle flights, flights using this engine family, flights using this engine with the revised turbopump, flights with a second stage assembled in the last eighteen months, flights where the payload customer is a first-timer — and those classes give rates that differ by an order of magnitude. Right now people either grab whichever class produces the number they were hoping for, or they average two of them, which I'm fairly sure is just incoherent. We've also had at least one case where someone built the class *after* seeing a couple of losses (three claims all involved the same rigging subcontractor, so new jobs got priced as "jobs involving that subcontractor"), and I genuinely can't tell whether that's cheating or whether it's the correct move.

  Stuff the procedure has to handle, none of which I know how to do:

  - How do you even generate the candidate classes, and which features are allowed into the description? Machine age, operator hours, weather window, supplier, whether the client has done this before. Some of those are doing causal work and some are just correlated with the thing, and half the time we can't tell which.
  - How narrow do you go? The narrow class always feels more honest until you realize it has four exposures, or zero events, or one event out of one and a 100% loss rate that we obviously cannot charge.
  - What happens when the broad class and the narrow class disagree by like 10x? Do we escalate, and who signs — me, the senior underwriter, or the chief actuary? Right now: nobody knows, it just depends who's in the office.
  - Classes defined partly by the outcome, or by facts we only learn later. My rule of thumb is that you can only use what was on your desk at quote time, but I can't say why, and I suspect it's not quite that clean.
  - Cases where there is no rate: nobody has ever done this, or the world moved (new engine revision, new regulation, new supplier) so the old frequency means nothing. I would much rather the procedure say "no defensible number, decline to quote" than that it manufacture one and we find out later.
  - Output format. Every file needs a "class string" — a one-line description of the class and where the rate came from — because renewals come back a year later and a different analyst has to re-derive it, and we've already been burned by someone writing "similar jobs" in the box.
  - Our home-brewed rule of thumb, which nobody can defend: go to the narrowest class that has at least ten exposures and whose rate is within 10x of its parent class. Is that doing real work or is it a superstition? Should I throw it out? Same question for our other internal rule: never quote more than 50% below the broadest defensible class rate.

  What I want from you: the questions, in order; what counts as an adequate answer to each one; where the procedure stops with a no; and where it hands the question to a human because it's a question about appetite, fairness, or values rather than a fact about the risk. Be honest about which steps are judgment calls with a number stapled to them, and be honest about what the procedure fundamentally cannot deliver — my worry is that there is no uniquely correct class and the whole thing is just damage control with better paperwork. If that's true, say so and tell me what a well-run damage-control procedure looks like.

  Then run the thing on three live-ish cases:

  1. A first-ever music festival on a river floodplain. Twenty years of flood records for the region, four years for that particular stretch of river, no track record for the promoter, and a fixed date we can't move.
  2. A satellite launch on a new small vehicle: two flights, one failure. The engine family has sixty flights with three failures. There's also a narrower subset — this engine with the revised turbopump — with nine flights and no failures. Three different analysts here picked three different classes and I can't tell which of them is wrong.
  3. A fleet policy for a delivery company. The sharpest class we can actually defend statistically is built partly out of driver age bracket. Compliance is going to lose their minds. I want to know whether your procedure tells me to use that class anyway, or whether it says "this stopped being a reference class question and became a fairness question" — and if it says that, I want to hear it even though it's not what I want, because I was kind of hoping the machinery would get me off the hook here.

  Oh, and one more: the client in case 3 has offered to let us use a telematics score instead, which predicts about as well but is way harder to explain to a regulator. If the procedure has anything to say about picking between two classes that perform the same, I'd like to hear it, because I suspect it doesn't.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **User:** Specialty insurer pricing weird one-off risks (satellites, films, festivals, custom transport).
      *   **Problem:** The Reference Class Problem (RCP). Every risk fits multiple classes with vastly different rates. Current practice is ad-hoc, potentially biased (cherry-picking), or incoherent (averaging).
      *   **Constraints:**
          *   Must be grounded in philosophy/stats regarding RCP.
          *   Must be runnable by a junior analyst (stats minor, no philosophy) in ~30 mins.
          *   Must survive regulatory audit ("Why this class?").
          *   Must handle specific edge cases (zero data, outcome-defined classes, causal vs. correlational features).
          *   Must produce a specific output ("Class String").
          *   Must identify where judgment/appetite takes over from fact.
          *   Must evaluate existing rules of thumb (10 exposures, 10x parent, 50% floor).
          *   Must run three specific test cases (Festival, Satellite, Fleet/Telematics).
      *   **Tone:** Honest, pragmatic, acknowledging uncertainty ("damage control with better paperwork" might be the reality).

  2.  **Philosophical & Statistical Grounding:**

      *   *The Reference Class Problem:* Identified by Reichenbach. An individual event belongs to infinite classes. Which one determines the probability?
      *   *Solution Strategy:* There is no "true" probability for a single event. Probability is a property of the *model/class*, not the event. Therefore, the goal isn't to find the *right* class, but the *most defensible* class given information constraints.
      *   *Key Principles:*
          *   **Predictive Stability:** Classes should predict future outcomes, not just fit past ones (avoid overfitting).
          *   **Causal Plausibility:** Features should have a mechanistic link to the loss, not just correlation (helps with stability/regulation).
          *   **Information Set:** Only use information available *at quote time* (avoid lookahead bias).
          *   **Credibility:** Balance specificity (narrow class) with data volume (broad class). This is the core actuarial credibility problem.
      *   *Philosophers/Statisticians to lean on:* Reichenbach (original problem), Salmon (causal relevance), Keynes (weight of evidence), Gelman/Bayesian hierarchy (partial pooling).
      *   *Audit Defense:* The defense isn't "this is the truth," it's "this is the most robust estimate given the constraints."

  3.  **Drafting the Procedure (The "Algorithm"):**

      *   *Goal:* A step-by-step flowchart for the junior analyst.
      *   *Step 1: Feature Selection (The "Allowed Inputs").* Filter out lookahead bias and spurious correlations.
      *   *Step 2: Class Generation.* Define the hierarchy (Broad -> Narrow).
      *   *Step 3: Credibility Check.* Minimum exposure count. (Evaluate the "10 exposures" rule).
      *   *Step 4: Stability Check.* Compare child vs. parent rates. (Evaluate the "10x" rule).
      *   *Step 5: The "No-Quote" Trigger.* When data is too thin or causal link is broken.
      *   *Step 6: Documentation.* The "Class String."
      *   *Step 7: Escalation.* Where human judgment enters.

      *   *Refining the Rules of Thumb:*
          *   "10 exposures": Too arbitrary for specialty lines. Better: "Credibility Weighting." If $N < 5$, rely heavily on parent. If $N=0$, cannot use as primary.
          *   "10x Parent": Good sanity check for overfitting.
          *   "50% Floor": This is pricing strategy/appetite, not RCP. Keep it separate.
          *   "Outcome-defined classes": Strictly forbidden for pricing (lookahead bias). Allowed for *post-mortem* analysis only.

  4.  **Addressing the Specific Questions:**

      *   *Generate candidate classes:* Start broad (industry standard), narrow by causal factors.
      *   *How narrow:* Until data credibility breaks.
      *   *Disagreement (10x):* Escalate.
      *   *Outcome-defined:* Ban them.
      *   *No rate:* Decline.
      *   *Output:* Standardized string.
      *   *Rules of Thumb:* Validate or discard based on statistical credibility theory.

  5.  **Running the Test Cases:**

      *   *Case 1 (Festival):* Floodplain.
          *   Classes: All festivals (too broad), All river festivals, This specific floodplain.
          *   Data: 20 yrs region, 4 yrs stretch.
          *   Issue: Climate change (non-stationarity).
          *   Verdict: Use region data adjusted for specific stretch + expert hydrology. Don't rely solely on 4-year local record.
      *   *Case 2 (Satellite):* New vehicle.
          *   Classes: All launches (too broad), This engine family (60 flights), This revised pump (9 flights, 0 loss).
          *   Issue: The "9 flights" is a trap (small sample, survivorship bias potentially).
          *   Verdict: Use Engine Family (60 flights) as base, apply credibility weight to the specific vehicle data. Do not use the 9-flight rate as standalone.
      *   *Case 3 (Fleet/Driver Age):*
          *   Issue: Fairness/Regulation vs. Prediction.
          *   Verdict: This is *not* an RCP problem; it's a compliance/ethics problem. Procedure must flag this for Legal/Compliance, not Actuarial.
          *   Telematics: If predictive power is equal, choose the one with fewer regulatory/reputation risks (Telematics might be "black box", Age is "protected class"). Actually, usually Telematics is preferred *if* explainable, but Age is often prohibited. Procedure should say: "Check Regulatory Permissibility First."

  6.  **Refining the Tone and Structure:**

      *   Acknowledge the user's insight: "Damage control with better paperwork" is actually a profound philosophical stance (Pragmatism).
      *   Make the procedure actionable (Checklist style).
      *   Be blunt about where the math ends and the guessing begins.

  7.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is 30 minutes realistic?
      *   *Fix:* Simplify the credibility formula. Instead of full Bayesian updating, use a weighted average rule of thumb that mimics it.
      *   *Critique:* The user asked about the "10 exposures" rule.
      *   *Fix:* Explicitly address this. 10 is too high for specialty insurance. Suggest a tiered approach (0, 1-5, 5+).
      *   *Critique:* Case 3 is tricky.
      *   *Fix:* Ensure the distinction between *statistical validity* and *regulatory permission* is clear. The procedure shouldn't solve the ethics, it should route the ticket.

  8.  **Final Polish:**

      *   Ensure the "Class String" format is clear.
      *   Ensure the "Stop/No-Quote" conditions are prominent.
      *   Make sure the philosophical grounding is visible but not overwhelming for the junior analyst. (Put the philosophy in the intro/commentary, the procedure in the steps).

  9.  *(Self-Correction on Case 3 Telematics)*: The user asked if the procedure has anything to say about picking between equal predictive classes.
      *   *Answer:* Yes. Principle of *Explainability* and *Stability*. A black box is harder to audit than a linear factor. Also, *Control*. Can the insured influence the score? Telematics yes, Age no. This matters for moral hazard.

  10. **Final Output Generation** (incorporating all the above thoughts into the structured response).
answer: |-
  You are correct to be suspicious. There is no "uniquely correct class." The Reference Class Problem (Reichenbach, 1949) proves that any individual event belongs to infinite classes, each yielding different probabilities. There is no mathematical theorem that selects the *true* one.

  However, in insurance, we are not seeking truth; we are seeking **robustness** and **defensibility**. You are not doing metaphysics; you are doing engineering under uncertainty. Your intuition that this is "damage control with better paperwork" is philosophically sound (Pragmatism). The goal of the procedure is not to find the *right* rate, but to ensure that whatever rate you pick is the result of a consistent, auditable process that minimizes the risk of being spectacularly wrong due to overfitting or bias.

  Here is the procedure, grounded in actuarial credibility theory and causal inference, designed for your junior analyst.

  ***

  # The Reference Class & Pricing Procedure (RCPP)

  **Purpose:** To select a pricing class that balances specificity (causal relevance) with stability (data volume) and survives regulatory audit.
  **Time Limit:** 30 Minutes.
  **User:** Junior Analyst.

  ## Part 1: The Filter (Allowed Inputs)
  *Before generating classes, filter the available data features.*

  **Q1: Was this fact known at quote time?**
  *   **Rule:** If the fact was only known *after* a loss occurred (e.g., "the specific subcontractor who failed"), it is **Forbidden** for pricing.
  *   **Why:** This is lookahead bias. It creates a class that looks predictive but cannot be used to predict.
  *   **Action:** If the only distinguishing feature is post-loss knowledge, revert to the broader class.
  *   **Audit Defense:** "We exclude post-event data to prevent overfitting to past losses."

  **Q2: Is there a causal mechanism?**
  *   **Rule:** Prefer features that physically or economically cause the loss over features that are merely correlated.
  *   **Test:** Ask "If I change this feature, does the risk change?"
      *   *Engine Revision:* Yes (Physical change).
      *   *Driver Age:* Correlational (Proxy for experience/risk), often regulated.
      *   *Moon Phase:* No (Spurious).
  *   **Action:** Tag features as [Causal] or [Proxy]. Prioritize [Causal] for narrowing the class.

  ## Part 2: Class Generation & Selection
  *Generate three candidate classes: Broad, Intermediate, Narrow.*

  **Q3: What are the three classes?**
  *   **Broad:** The industry standard (e.g., "All Satellite Launches").
  *   **Intermediate:** The vehicle/engine family (e.g., "This Engine Family").
  *   **Narrow:** The specific configuration (e.g., "This Engine + Revised Pump + This Payload").

  **Q4: Does the Narrow class have sufficient credibility?**
  *   **Rule:** Evaluate the exposure count ($N$) of the Narrow class.
      *   **$N = 0$:** **STOP.** Do not price off this class alone. Use the Intermediate rate.
      *   **$N < 5$:** **Low Credibility.** The observed loss rate is noise. Use the Intermediate rate.
      *   **$N \ge 5$:** **Moderate Credibility.** You may blend Narrow and Intermediate rates (see Part 3).
  *   **Critique of your "10 Exposures" Rule:** For specialty lines, 10 is often impossible. It forces you into classes too broad to be useful. Lowering to 5 acknowledges the scarcity of data while preventing pricing off a single event.
  *   **Action:** Select the *narrowest* class with $N \ge 5$. If none exist, select the Intermediate.

  **Q5: Is the Narrow rate stable relative to the Parent?**
  *   **Rule:** Compare the loss rate of the selected class against its immediate Parent class.
  *   **Threshold:** If the Selected Class rate is $> 3\times$ or $< 0.33\times$ the Parent rate, **FLAG FOR ESCALATION.**
  *   **Critique of your "10x" Rule:** 10x is too loose. If your specific class says 10% loss and the parent says 1%, you are likely overfitting noise. 3x is a standard statistical control limit for small samples.
  *   **Action:** If flagged, do not proceed to quote. Escalate to Senior Underwriter.

  ## Part 3: The "No-Quote" Triggers
  *The procedure must allow you to walk away.*

  **Q6: Is the data non-stationary?**
  *   **Rule:** Has the underlying risk environment fundamentally changed? (e.g., Climate change affecting flood plains, new regulation making old engine data obsolete).
  *   **Test:** If the last 20% of the data (most recent) shows a significantly different trend than the first 80%, the historical rate is invalid.
  *   **Action:** If **Yes**, trigger **No-Quote**. Do not attempt to adjust the rate manually. Decline the risk or require a specialized engineering study.

  **Q7: Is the class defined by the outcome?**
  *   **Rule:** Does the class definition include the loss itself? (e.g., "Launches that failed due to turbopump").
  *   **Action:** **Forbidden.** Revert to "Launches with this turbopump."

  ## Part 4: Documentation (The Class String)
  *Every file must contain this exact string.*

  **Format:**
  `[Class Definition] | [N_Exposures] | [Loss_Count] | [Source_Data] | [Credibility_Weight]`

  **Example:**
  `SatLaunch_EngFam_X | N=60 | Loss=3 | Internal_DB_2024 | 100%`
  `SatLaunch_V2_NewPump | N=9 | Loss=0 | Internal_DB_2024 | 0% (Used Parent Rate)`

  **Why:** This allows the auditor to see exactly why you didn't use the narrow class (N=9 is too small) without you having to write an essay.

  ## Part 5: Escalation & Judgment
  *Where the math stops and the humans start.*

  **The Handoff Points:**
  1.  **Rate Discrepancy:** If Narrow vs. Broad differs by $> 3\times$. (Question of *Model Risk*).
  2.  **Fairness/Compliance:** If the most predictive class uses protected characteristics (Age, Gender, Location). (Question of *Appetite/Law*).
  3.  **Pricing Floor:** Your "50% below broad class" rule. (Question of *Commercial Strategy*, not RCP).

  **Procedure:** If any Handoff Point is triggered, the Analyst stops. The file moves to the Senior Underwriter/Chief Actuary. They must sign a "Deviation Form" stating *why* they are overriding the procedure.

  ***

  # Evaluation of Your Current Rules of Thumb

  1.  **"Narrowest class with 10 exposures":**
      *   **Verdict:** **Modify.** 10 is too high for specialty. Use 5. If $N<5$, the class exists for tracking, not for primary pricing.
  2.  **"Rate within 10x of parent":**
      *   **Verdict:** **Tighten.** 10x allows insane outliers. Use 3x. If the specific risk is 10x the average, you either have a miracle or a data error. Assume error until proven otherwise.
  3.  **"Never quote >50% below broadest class":**
      *   **Verdict:** **Keep, but relocate.** This is not an RCP rule; it is a *Capital Management* rule. It belongs in the Underwriting Authority Matrix, not the Class Selection Procedure. It prevents you from winning business you can't afford, regardless of how "correct" your class is.
  4.  **"Classes defined by losses (the rigging subcontractor)":**
      *   **Verdict:** **Forbidden.** This is data snooping. You can only use "Subcontractor X" if you knew you were using Subcontractor X *before* you priced the deal. If you create the class *because* they lost, you are pricing off hindsight.

  ***

  # Running The Cases

  ## Case 1: Music Festival on River Floodplain
  *   **Inputs:** 20yr Region Data, 4yr Stretch Data, Fixed Date, New Promoter.
  *   **Class Generation:**
      *   *Broad:* All Outdoor Festivals (Too broad, ignores flood risk).
      *   *Intermediate:* Festivals on Floodplains (Good causal link).
      *   *Narrow:* This Specific River Stretch (Only 4 years data).
  *   **Application:**
      *   Narrow Class $N=4$. **Fail Q4** ($N<5$).
      *   Check Non-Stationarity (Q6): Flood records show increasing frequency? If yes, historical rate is invalid.
      *   **Decision:** Use **Intermediate Class** (All Floodplain Festivals) adjusted by a hydrological engineer's report on the specific stretch.
      *   **Class String:** `Festival_Floodplain_RegionA | N=45 | Loss=2 | Hydro_Report_2023 | 100%`
      *   **Note:** Do not price off the 4-year local record. It is statistically noise. The "Fixed Date" is a risk multiplier, not a class definition. Add loadings for date, do not narrow the class to "Festivals on [Date]."

  ## Case 2: Satellite Launch (New Vehicle, Revised Pump)
  *   **Inputs:**
      *   Class A (All Launches): High N, Rate $R_A$.
      *   Class B (Engine Family): $N=60$, 3 Failures. Rate $R_B$.
      *   Class C (Revised Pump): $N=9$, 0 Failures. Rate $R_C = 0$.
  *   **The Conflict:** Three analysts picked three classes.
  *   **Application:**
      *   Class C ($N=9$): Passes $N \ge 5$. However, 0 losses implies 0% rate.
      *   Check Stability (Q5): Is $R_C$ within 3x of $R_B$? Technically 0 is within any range, but a 0% rate is actuarially unsound for high-severity risk.
      *   **Procedure Verdict:** You cannot price at 0%. The procedure mandates using the **Parent Rate (Class B)** because the Narrow Class has zero *observed* losses, which is not credible evidence of zero *risk*.
      *   **Correction:** Use Class B rate. You may apply a small discount for the revision *if* there is engineering evidence the pump is safer, but you cannot use the loss history of the 9 flights as the primary driver.
      *   **Class String:** `SatLaunch_EngFam_X | N=60 | Loss=3 | Internal_DB | 100% (Narrow class N=9 suppressed due to 0 loss credibility)`
      *   **Audit Answer:** "We prioritized the Engine Family class because the Revised Pump subset had insufficient loss experience to establish a credible baseline, despite having 9 exposures."

  ## Case 3: Fleet Policy (Driver Age vs. Telematics)
  *   **The Conflict:** Driver Age is statistically sharp but regulated. Telematics is equal predictive power but opaque.
  *   **Application:**
      *   **Q2 (Causal/Proxy):** Driver Age is a **Proxy**. Telematics is a **Direct Measure** of behavior.
      *   **Q7 (Fairness/Compliance):** This triggers the **Handoff Point**.
      *   **Procedure Verdict:** The RCPP **stops** here. This is not a statistical question; it is a compliance question.
      *   **Action:** The Analyst must flag "Protected Class Variable Detected." The file goes to Compliance/Legal.
      *   **Telematics Choice:** If Compliance approves both, the procedure dictates choosing the class with higher **Explainability** and **Controllability**.
          *   *Age:* Uncontrollable by insured. High regulatory risk.
          *   *Telematics:* Controllable (drive safer to pay less). Lower regulatory risk (usually), higher explainability burden.
      *   **Decision:** Procedure recommends **Telematics**. Why? Because in modern regulation, *controllability* is a stronger defense than *correlation*. It aligns incentives (moral hazard).
      *   **Audit Answer:** "We selected Telematics over Age because it represents a controllable risk factor, reducing moral hazard and aligning with fair treatment of customers guidelines, despite similar predictive power."

  ***

  # What This Procedure Cannot Do (The Honest Truth)

  1.  **It cannot find the "True" Probability:** It admits that the rate is an estimate based on the best available proxy.
  2.  **It cannot solve "Black Swan" risks:** If the world has changed (non-stationary), the procedure tells you to **No-Quote**. It does not tell you how to price the unknown.
  3.  **It cannot resolve Ethics:** In Case 3, it punts to Compliance. It refuses to let the analyst hide behind math ("The stats say age works") to avoid ethical decisions.

  # Summary for the Junior Analyst

  1.  **Filter:** No hindsight. No spurious correlations.
  2.  **Count:** Need 5+ exposures to use a narrow class.
  3.  **Check:** Does the narrow rate make sense compared to the broad rate? (Within 3x).
  4.  **Document:** Write the Class String.
  5.  **Escalate:** If the math breaks or the ethics get murky, pass it up.

  This turns your "mess" into a controlled process. It ensures that when the regulator asks "Why this class?", you don't say "Because it felt right." You say, "Because the narrower class failed the credibility threshold of $N=5$, and the broader class failed the stability check, leaving this intermediate class as the only defensible option under RCPP v1.0."

  That is how you survive the audit.
