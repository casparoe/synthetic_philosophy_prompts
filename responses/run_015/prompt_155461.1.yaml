prompt: |-
  I'm applying for a six-month conceptual fellowship and need a two-page proposal turned into precise form. My half-formed idea starts from Singer's pond example: a child is drowning, the rescue is cheap, so we have a direct duty to save her. Most extensions treat global poverty or climate harm as the same argument with distance added, but I suspect the original case smuggles in a three-layer proximity structure—spatial, causal, and epistemic—that gets quietly dissolved when people apply the reasoning to distant strangers. I want to ask whether the duty of rescue survives intact when all three layers are dispersed, as they are in institutional or systemic harms where victims are statistical rather than named, causes are distributed across design choices rather than single omissions, and knowledge of the harm is mediated by models rather than direct perception.

  Please turn this into a proposal with the following parts. First, state the precise question: is the moral force of Singer's argument carried by the severity-cost comparison alone, or does it depend on an implicit proximity architecture that makes discrete rescue obligations structurally different from obligations to redesign institutions? Second, explain why existing positions leave this open—defenders of global obligations tend to treat distance as morally irrelevant without asking which kind of distance, while institutional-reform critics invoke collective-action and epistemic problems without separating those from proximity effects. Third, lay out the method month by month: formalize the three proximity conditions implicit in the pond case; apply them to three structural analogues—climate-adaptation funding, supply-chain labor safeguards, and algorithmic resource allocation—to see where the analogy holds and where it breaks; then construct both the "direct scaling" and the "structural redesign" versions of the rescue argument and identify the exact crux between them. Fourth, specify what counts as failure—if the analysis collapses proximity effects into general collective-action problems, or if it turns out the pond case and the institutional cases differ only in scale—along with what a successful deliverable looks like: a framework that tells us when an institutional obligation is a direct analog of rescue and when it requires a separate moral argument altogether. Keep it strictly conceptual, say I will add citations myself, and do not include a bibliography or literature review by citation.
