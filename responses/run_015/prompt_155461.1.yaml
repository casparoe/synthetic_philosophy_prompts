answer: |-
  **Project Title:** The Architecture of Proximity: Disaggregating the Duty of Rescue in Structural Contexts
  **Project Type:** Conceptual Fellowship Proposal
  **Duration:** Six Months

  **1. The Precise Question**

  Peter Singer's "drowning child" analogy establishes a baseline for moral obligation: if the cost of rescue is low and the harm prevented is severe, a duty to act exists regardless of distance. Contemporary extensions of this argument typically treat global poverty, climate harm, and systemic inequality as functionally identical to the pond case, differing only in geographical scale. This project challenges that assumption. I hypothesize that the original pond case smuggles in a three-layer proximity structure—spatial, causal, and epistemic—that is quietly dissolved when the reasoning is applied to distant strangers. In the pond case, the victim is spatially present, the cause of harm is a single omission, and knowledge is direct. In structural contexts, victims are statistical, causes are distributed across design choices, and knowledge is mediated by models.

  The central research question is: **Is the moral force of Singer's argument carried by the severity-cost comparison alone, or does it depend on an implicit proximity architecture that makes discrete rescue obligations structurally different from obligations to redesign institutions?** If the latter, the duty of rescue may not survive intact when all three layers are dispersed. This project seeks to determine whether institutional obligations are direct analogs of rescue or whether they require a separate moral argument altogether.

  **2. Why Existing Positions Leave This Open**

  Current debates in normative ethics leave this question unresolved due to a lack of granularity regarding "distance." Defenders of global obligations, following the Singerian tradition, tend to treat distance as morally irrelevant *per se*. They argue that physical proximity holds no intrinsic moral weight, focusing exclusively on the capacity to prevent harm. However, in doing so, they often fail to distinguish between *kind* of distance. They treat spatial separation, causal dilution, and epistemic uncertainty as a single variable of "remoteness," assuming that if one is morally irrelevant, all are.

  Conversely, critics who argue for institutional reform over individual aid often invoke collective-action problems and epistemic limitations to distinguish structural harms from interpersonal rescue. While correct to identify these friction points, this critique conflates the *effects* of dispersed proximity with the *nature* of the obligation itself. They argue that structural harms are harder to solve, but rarely ask whether the *moral relation* between agent and victim changes when proximity layers are stripped away. By failing to separate proximity effects from collective-action problems, existing literature obscures whether the duty to fix a system is a scaled-up duty to rescue or a fundamentally different category of obligation. This project isolates the proximity architecture to test whether the duty survives the transition from interpersonal to structural contexts independent of collective action hurdles.

  **3. Methodology and Work Plan**

  The six-month fellowship will be dedicated to a strictly conceptual analysis, proceeding in three phases.

  **Months 1–2: Formalizing the Proximity Conditions**
  The first phase involves reconstructing the "pond case" to isolate its implicit structural features. I will formalize the three proximity conditions inherent to the original thought experiment:
  *   **Spatial Proximity:** The agent and victim occupy a shared physical context.
  *   **Causal Proximity:** The harm is preventable by a single, discrete action by the agent.
  *   **Epistemic Proximity:** The need for rescue is known through direct perception rather than inference.
  I will produce a formal mapping of how these conditions constrain the moral reasoning in the original case, establishing a baseline "Rescue Template."

  **Months 3–4: Application to Structural Analogues**
  The second phase applies the Rescue Template to three structural analogues where proximity layers are dispersed. I will select cases that vary in how the layers are distributed:
  *   **Climate-Adaptation Funding:** Victims are statistical (future populations), causes are distributed (cumulative emissions), and knowledge is model-mediated.
  *   **Supply-Chain Labor Safeguards:** Victims are named but unseen, causes are embedded in contracting structures, and knowledge is audit-mediated.
  *   **Algorithmic Resource Allocation:** Victims are data profiles, causes are coded weights, and knowledge is opaque even to designers.
  For each case, I will test where the analogy to the pond holds and where it breaks. The goal is to identify which proximity layer, when removed, causes the moral intuition of "rescue" to collapse.

  **Months 5–6: Constructing the Crux**
  The final phase involves constructing two competing versions of the obligation argument based on the previous analysis:
  1.  **The Direct Scaling Version:** Argues that institutional obligations are simply rescue duties applied to complex systems; proximity layers are morally irrelevant noise.
  2.  **The Structural Redesign Version:** Argues that dispersed proximity changes the moral relation, requiring a duty of justice or fairness rather than rescue.
  I will identify the exact crux between these versions—the specific point where the reasoning diverges. The output will be a conceptual framework delineating the boundary conditions of the duty of rescue.

  **4. Success and Failure Conditions**

  Given the conceptual nature of this work, success and failure are defined by the clarity of the resulting distinction rather than empirical verification.

  **Failure Conditions:**
  The project will be deemed unsuccessful if the analysis collapses proximity effects into general collective-action problems. If the result is merely that structural harms are "harder" to address due to coordination issues, the project fails to isolate the moral architecture. Similarly, if the analysis concludes that the pond case and institutional cases differ only in scale (magnitude of cost or number of victims) without a structural qualitative shift, the hypothesis is disproven, and the project fails to generate a new framework.

  **Successful Deliverable:**
  A successful outcome is a framework that tells us when an institutional obligation is a direct analog of rescue and when it requires a separate moral argument altogether. Specifically, I aim to produce a paper demonstrating that when causal and epistemic proximity are dispersed, the "duty of rescue" terminology becomes category mistakes, obscuring the need for duties of structural justice. The deliverable will be a complete manuscript ready for submission to a peer-reviewed ethics journal, providing a precise vocabulary for distinguishing interpersonal aid from institutional reform.

  **5. Fit and Feasibility**

  This project is strictly conceptual and requires no empirical data collection, making it fully feasible within a six-month timeframe. It builds directly on my prior work in normative ethics while requiring dedicated time to formalize the proximity architecture without the distraction of teaching or administrative duties. The fellowship provides the necessary environment to refine this argument from a half-formed intuition into a rigorous philosophical contribution.
