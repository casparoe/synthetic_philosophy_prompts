  I argued for the **wave**
  As rigid, fixed **knowledge**,
  Allowing no **overlap**
  Down every **branch**.
  It is not mere **chance**
  That builds the living **world**.

  To save the **world**
  From being just a **wave**,
  I called it managed **chance**,
  A compressed sort of **knowledge**,
  Like data on a **branch**,
  Denying any **overlap**.

  If preparations **overlap**,
  The math breaks down the **world**.
  Two systems on a **branch**,
  Prepared apart, the **wave**
  Must hold distinct **knowledge**,
  Or else admit true **chance**.

  Is there room for **chance**
  If nothing can **overlap**?
  Then this so-called **knowledge**
  Is the fabric of the **world**.
  The map becomes the **wave**.
  There is no other **branch**.

  Cut from the main **branch**,
  Rolled into **chance**,
  The squared **wave**
  Where probabilities **overlap**
  Is not the **world**,
  Just our **knowledge**.

  Is **knowledge** enough?
  On every **branch**,
  To save the **world**,
  From pure **chance**,
  Where functions **overlap**,
  There is only **wave**.

  If **knowledge** kills the **chance** within the **wave**,
  And every **branch** forbids the **overlap** in the **world**,
  The compression was lossless; the description is the thing.
