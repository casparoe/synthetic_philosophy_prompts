answer: |-
  This is a classic stalemate in meta-ethics, and your intuition that the seminar is talking past itself is correct. The debate hasn't moved because Side A (the Critics) and Side B (the Defenders) are operating on different philosophical levels, using the word "demand" to mean two different things.

  Here is the diagnosis of why you are stuck, an evaluation of your "archival" hypothesis, and a roadmap for what progress would actually look like.

  ### 1. The Diagnosis: A Category Mistake
  The debate is stalled because it is a **category mistake between moral psychology and normative justification.**

  *   **Side A (Critics/Williams)** is making a claim about **moral psychology and identity.** When they say utilitarianism "forces" a calculation, they aren't necessarily claiming you must consciously multiply numbers in your head while your wife drowns. They are claiming that for an action to have moral worth (or for a relationship to have integrity), the *motivating reason* must be agent-relative (e.g., "because she is my wife"). If the *true* reason is agent-neutral ("because it maximizes utility"), the agent is alienated from their own action, even if they don't consciously think it. They are arguing that integrity requires the *truth* of your motivation to match the *content* of your commitment.
  *   **Side B (Defenders/Utilitarians)** is making a claim about **normative justification and criteria of rightness.** When they say utilitarianism only demands actions be "justifiable," they are distinguishing between the *criterion of rightness* (what makes an act right) and the *decision procedure* (how an agent chooses). They argue you can have the right psychology (love) while the act is made right by an external standard (utility).

  **Why this causes a loop:**
  Side A says, "If the *truth* is utility, your love is conditional." Side B says, "But you don't have to *think* the truth to act." Side A replies, "But the truth still makes your love conditional!" Side B replies, "But you didn't calculate!" They are arguing about whether the *ontological status* of the reason matters (A) or just the *phenomenological experience* of the reason (B).

  ### 2. The Ambiguity of "Integrity"
  You are correct that "integrity" is being used in two ways, but it goes deeper than just psychological vs. normative.

  *   **Integrity as Psychological Wholeness (Side B's target):** This is about not feeling conflicted or alienated *in the moment*. Side B argues utilitarianism allows this via "indirect utilitarianism" (cultivating dispositions so you don't calculate).
  *   **Integrity as Normative Identity (Side A's point):** This is about what constitutes your "ground projects." Williams argues that if the *justification* for your ground project is external to the project itself, you have lost integrity. It's not about feeling whole; it's about *being* the author of your life. If the "Archive" (see below) says your wife's life is saved only because it served the general good, your identity as a husband is retroactively undermined.

  ### 3. Evaluating Your "Deliberative vs. Archival" Hypothesis
  Your idea about the **deliberative level** (what runs through your head) vs. the **archival level** (how you explain yourself in a moral autobiography) is insightful and **does matter.**

  It is essentially a phenomenological reframing of the standard "Decision Procedure vs. Criterion of Rightness" distinction.
  *   **Why it helps:** It clarifies that Side B is defending the *Deliberative* level (you don't need to think it), while Side A is attacking the *Archival* level (the story you tell about why it was right cannot erase the personal reason).
  *   **Why it might not break the deadlock:** Williams would argue that the *Archival* level infects the *Deliberative* level. If the *true* story (the Archive) is utilitarian, then the *Deliberative* feeling of love is essentially a useful fiction. Side B is okay with love being a useful fiction; Side A thinks that destroys integrity.

  So, your distinction identifies *where* they are looking, but it doesn't solve the substantive disagreement about whether agent-neutral reasons can validate agent-relative commitments without destroying them.

  ### 4. What Would Count as Progress?
  To move the seminar forward, you need to stop arguing about whether utilitarians *calculate* and start arguing about **Agent-Relative vs. Agent-Neutral Reasons.**

  *   **The New Question:** "Can an agent-neutral reason (utility) fully justify an agent-relative commitment (marriage) without transforming the commitment into something else?"
  *   **The Necessary Distinction:** You need to distinguish between **Motivational Opacity** (I don't know why I'm doing this) and **Justificatory Transparency** (I know the ultimate truth of why this is right).
      *   Side B wants Motivational Opacity (I just love her) with Justificatory Transparency (Utility says save her).
      *   Side A argues that if Justificatory Transparency reveals a utilitarian truth, Motivational Opacity is actually *self-deception*, which violates integrity.
  *   **Acceptance of Disagreement:** Progress might also look like realizing this is a foundational clash. If you believe all reasons reduce to agent-neutral ones, Williams's objection fails. If you believe agent-relative reasons are irreducible, Williams wins. The seminar might be stuck because nobody wants to admit they are arguing from incompatible meta-ethical axioms.

  ### 5. Confidence and Uncertainty
  *   **Confidence:** I am **highly confident (90%)** that the stalemate is caused by the conflation of moral psychology (deliberation) with normative justification (criteria of rightness). This is a well-documented feature of the Williams/Utilitarian debate.
  *   **Least Sure Point:** I am **least sure (60%)** about whether introducing your "Deliberative/Archival" distinction will actually *resolve* the seminar's stall. While it is an accurate diagnostic tool, it may simply rename the existing "Decision Procedure/Criterion" distinction without forcing the students to confront the deeper meta-ethical rift regarding agent-relative reasons. It clarifies the *location* of the fight, but not necessarily how to *end* it.

  \answer{Category Mistake: Psychology vs. Justification}
