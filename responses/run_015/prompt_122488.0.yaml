answer: |-
  This is a heavy brief. You are asking for a translation of moral philosophy into criminal law doctrine to defend an administrative finding regarding a death. Below is the structure you requested, followed by the residue analysis and the plain-language flags for your board colleagues.

  ### Part 1: The Translation Matrix

  Here is how the AI ethics debate maps onto your criminal law vocabulary.

  **1. Utilitarian AI (Maximize Aggregate Good)**
  *   **Criminal Law Equivalent:** **Justification Defense (Necessity / Lesser Evils).**
  *   **The Logic:** The system commits a prima facie wrong (denying care to a high-risk patient) to prevent a greater aggregate harm (higher total mortality/readmission across the whole population).
  *   **The Act:** The allocation decision is the *actus reus*.
  *   **The Defense:** The outcome is justified because the net harm was minimized across the portfolio of 90 patients, not just the one who died.

  **2. Deontological AI (Follow Rules / Constraints)**
  *   **Criminal Law Equivalent:** **Duty of Care / Statutory Compliance.**
  *   **The Logic:** The system adheres to hard constraints (e.g., "oxygen patients ≥ line 45") regardless of the utility outcome.
  *   **The Liability:** If the system violates a hard floor, it is strictly liable (negligence *per se*). If it follows the rules but harm occurs, it is generally immune, provided the duty was fulfilled.
  *   **The Shift:** As you suspected, this doesn't solve the value problem; it moves it to the rule-makers (your Board). In law, this is the difference between *legislative intent* (setting the rules) and *judicial application* (the model applying them).

  **3. Model "Intent" (Objective Functions)**
  *   **Criminal Law Equivalent:** **Mens Rea (imputed through Design).**
  *   **The Logic:** Since the code has no mind, we look to the *training objective* and *loss function*.
  *   **The Mapping:**
      *   *Purpose:* The specific goal coded (e.g., "minimize 30-day readmissions").
      *   *Knowledge:* What the training data revealed as patterns (e.g., "age correlates with lower recovery potential").
      *   *Recklessness:* Deploying a model knowing it creates a substantial and unjustifiable risk to a specific class of patients (the 1-in-8 risk group).
      *   *Negligence:* Failing to foresee a risk that a reasonable hospital system should have foreseen.

  **4. The Pipeline (Imitation + Ranking + Floors)**
  *   **Criminal Law Equivalent:** **Vicarious Liability / Conspiracy / Many Hands.**
  *   **The Logic:** No single agent holds the full *mens rea*.
      *   *Layer 1 (Imitation):* Inherits the *mens rea* of the historical discharge planners (potentially negligent or biased past acts).
      *   *Layer 2 (Ranking):* Holds the *purpose* of efficiency (Utilitarian).
      *   *Layer 3 (Floors):* Holds the *duty* of compliance (Deontological).
  *   **The Problem:** Criminal law usually requires a unified principal offender. Here, the "intent" is fragmented across three teams. This looks less like a single perpetrator and more like a corporate culture of negligence where responsibility is diffused.

  ---

  ### Part 2: The Residue Report

  Here is where the translation holds, where it breaks, and whether the break is your fault or theirs.

  **1. Intending vs. Foreseeing (Your Suspicion #1)**
  *   **The Fit:** Poor.
  *   **The Mangle:** In philosophy (Double Effect), there is a hard line between *intended means* and *foreseen side effects*. In criminal law, **oblique intent** collapses this: if you foresee a consequence as a "virtual certainty," the law treats it as intended.
  *   **The Application:** The model did not "intend" this man's death. It intended to optimize slots. However, because the risk was 1-in-8 (12.5%), it was *not* a virtual certainty. Therefore, under criminal law standards, this is not intentional homicide. It falls into **recklessness** (conscious disregard of a substantial risk) or **negligence** (failure to perceive the risk).
  *   **Verdict:** The law is actually more helpful here than the philosophy. The 1-in-8 stat saves you from an "intent" allegation but exposes you to a "negligence" allegation.

  **2. Mens Rea and the Model Mind (Your Suspicion #2)**
  *   **The Fit:** Broken.
  *   **The Mangle:** *Mens rea* requires a conscious mind. A model has weights and biases.
  *   **The Fix:** You must treat the **Design Specification** as the *mens rea*. If the objective function was "maximize QALYs" without a constraint for "equity," the system is "guilty" of prioritizing efficiency over fairness.
  *   **Verdict:** This is a hole in *your* vocabulary. Criminal law is built for biological agents. You are operating in **Product Liability** territory (defective design) disguised as criminal doctrine. You are arguing the *tool* was defective, not that the *user* had a bad mind.

  **3. Lesser-Evils and Aggregation (Your Suspicion #3)**
  *   **The Fit:** Critical Failure.
  *   **The Mangle:** The Necessity defense in criminal law is **vignette-specific**. You can't kill one patient to save five *other* patients in a different room. But the AI operates on **portfolio aggregation**. It sacrifices Patient A tonight to improve the average outcome over 1,000 nights.
  *   **Verdict:** This is a muddle in *their* (the AI ethicists') vocabulary. They import "utilitarianism" without acknowledging that legal justification requires **immanence**. You cannot use a "Lesser Evils" defense for a statistical sacrifice made in advance. The law demands you justify *this* denial for *this* man based on *his* circumstances, not the system's average performance.

  **4. Deontology as Aggregated Rules (Your Suspicion #4)**
  *   **The Fit:** Strong.
  *   **The Mangle:** You are correct. "Deontological AI" is just **codified policy**.
  *   **The Shift:** In law, if a statute says "do X," and you do X, you are compliant. If X leads to harm, the liability shifts to the legislature (the Board).
  *   **Verdict:** This maps cleanly. The hard floors (oxygen ≥ 45) are statutory duties. If the model violated them, you are liable. If it followed them, the liability for the "unfairness" of the rule rests with the Board, not the software.

  **Summary of Residue:**
  The residue is not a hole in your vocabulary; it is a category error in the AI debate. They are arguing about *moral philosophy* (what is Good?). You are arguing about *tort and criminal liability* (who pays for the Bad?). The "Utilitarian vs. Deontological" debate collapses in court into "Negligence vs. Compliance."

  ---

  ### Part 3: Plain Language Flags (For the Board)

  Your board includes a nurse, a data scientist, and a chaplain. Do not use the Latin terms in the final finding without the following translations.

  | Legal Term | Plain English for the Board | Why it matters here |
  | :--- | :--- | :--- |
  | **Actus Reus** | **The Act or Omission** | Did the hospital *do* something wrong, or did it just *fail* to give a slot? Law punishes acts more harshly than omissions, unless there was a duty to act. |
  | **Mens Rea** | **State of Mind / Design Intent** | Did we *mean* for this to happen? Since the code has no mind, we look at what we told the code to prioritize. |
  | **Oblique Intent** | **Foreseeing the Near-Certain** | If we knew death was almost guaranteed, it counts as intending it. (Argue this wasn't the case here: 1-in-8 is not near-certain). |
  | **Necessity Defense** | **Choosing the Lesser Harm** | We denied one person to save more people overall. (Warn the board: Law usually doesn't accept this for statistical trade-offs). |
  | **Duty of Care** | **Responsibility to Protect** | Did the hospital owe this man a slot? If yes, denying it is negligence. If no, it's just bad luck. |
  | **Proximate Cause** | **Direct Link** | Did the lack of a slot *cause* the death, or would he have died anyway? (The 1-in-8 risk helps argue the link is weak). |
  | **Strict Liability** | **No Excuses** | If we broke a hard rule (like the oxygen floor), it doesn't matter why. We are liable. |

  ---

  ### Part 4: The Missing Question

  You asked me to flag a question you should be asking but aren't.

  **The Question:** *"What is the procedural recourse for the patient?"*

  **Why:** Criminal law focuses on *punishment* after the fact. Administrative law focuses on *process* before the fact. Your board is defending a *substantive* outcome (the death), but the family's lawyer is likely going to attack the *procedure* (the lack of appeal).

  In criminal law, if the state deprives you of liberty, you get a hearing. In your system, if the algorithm deprives a patient of life-sustaining care, do they get a human review?

  **The Risk:** If your finding focuses only on the *ethics of the decision* (Utilitarian vs. Deontological), you miss the *legality of the process*. A court is more likely to rule against you for **Procedural Due Process** (no way to contest the ranking) than for **Substantive Negligence** (the ranking itself was hard to prove as the cause of death).

  **Recommendation:** Your one-page finding should not just justify the *outcome*; it must validate the *process*. Did the nurse have the authority to override the rank? Was there a pathway for the family to appeal the 61st place ranking before discharge? If the answer is no, the "Necessity" defense fails because the system offered no alternative channel to prevent the harm.

  **Final Note for the Finding:**
  Frame the 1-in-8 risk not as "knowledge of death," but as "statistical uncertainty." Frame the ranking not as "intent to deny," but as "triage under scarcity." And frame the Board's role not as "judges of the algorithm," but as "legislators setting the constraints." This shifts the liability from *malice* to *policy*, which is much harder for a plaintiff to pierce.
