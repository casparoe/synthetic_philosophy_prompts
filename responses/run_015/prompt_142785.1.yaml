answer: |-
  # Joint Statement on Symmetric One-Shot Coordination Problems

  **Parties:**
  1.  **The Superrationalist:** Defends the view that agents recognizing themselves as instances of the same reasoning algorithm should coordinate choices to maximize joint outcomes, even absent causal communication.
  2.  **The Independence-Reasoner:** Defends the view that rational choice must be based on causal or evidential links between specific actions and outcomes, treating other agents' choices as independent parameters unless a mechanism for correlation is specified.

  **Subject:** The Platonia Dilemma and the Luring Lottery.

  ---

  ### 1. Agreed Claims

  Both parties affirm the following descriptions of the problems, conditions, and theoretical landscape. This section establishes the common ground required to frame the disagreement.

  1.  **Formal Payoff Structures:**
      *   **The Platonia Dilemma:** There are $N$ participants (e.g., 20). Each may choose to submit a letter or abstain. If exactly one participant submits a letter, that participant receives a large prize ($V$). If zero or more than one participant submits a letter, no one receives a prize.
      *   **The Luring Lottery:** There are $N$ participants. A prize pool ($V$) is available. If the number of entrants ($k$) is below or equal to a specific threshold ($T$), the pool is divided equally among entrants ($V/k$). If $k$ exceeds $T$, the pool is forfeited and all receive zero. (Note: Both parties acknowledge variants where the payoff is simply $V/k$ without a hard zero threshold, but agree to treat the threshold variant for the purpose of analyzing payoff discontinuities).
  2.  **Information and Interaction Conditions:**
      *   Both puzzles are **one-shot**: The game is played exactly once with no history or future iterations.
      *   Both puzzles enforce **no communication**: Participants cannot signal, bargain, or form binding agreements prior to choice.
      *   Both puzzles assume **symmetry**: All participants have access to the same rules, payoff structures, and rationality assumptions.
  3.  **Decision-Theoretic Recommendations:**
      *   **Causal Decision Theory (CDT):** Recommends choosing the action that maximizes expected utility based on the causal consequences of that action alone. In these symmetric games, CDT treats the probability of other agents' actions as independent of the agent's own choice (unless a common cause is explicitly modeled).
      *   **Evidential Decision Theory (EDT):** Recommends choosing the action that provides the best news about the outcome. EDT allows that an agent's choice may be evidentially correlated with the choices of others due to shared reasoning processes, even without causal interaction.
  4.  **Purpose of the Puzzles:**
      *   Both parties agree these puzzles are designed to test whether identical reasoning processes can produce correlated choices without causal interaction. They probe whether "logical correlation" (arising from running the same algorithm) constitutes a valid basis for decision-making distinct from causal or physical correlation.
  5.  **Criteria for Resolution:**
      *   Both parties agree that a satisfactory resolution must provide a **principled reason** that applies to all agents of the same reasoning type. An explanation that relies on one agent being "special" or having access to information others do not is inadmissible. The resolution must specify whether the rational choice is indexed to the individual token decision or the abstract reasoning type.

  ---

  ### 2. Disagreements Table

  The following table outlines the core divergences. The left column represents the position acceptable to the Superrationalist; the right column represents the position acceptable to the Independence-Reasoner.

  | Topic | Superrationalist Position | Independence-Reasoner Position |
  | :--- | :--- | :--- |
  | **(a) Algorithmic Identity as a Basis for Choice** | Recognizing oneself as an instance of a shared reasoning algorithm provides a rational basis for choosing an action that is optimal only if others do likewise. Logical correlation substitutes for causal linkages; if I am a perfect copy of you, my decision *is* your decision in the abstract space of reasons. | Recognizing shared algorithms does not provide a rational basis for coordination absent a causal or evidential link. My choice cannot causally influence yours, and mere similarity does not create an evidential bond strong enough to override dominance reasoning. I must treat your choice as a fixed parameter. |
  | **(b) Payoff Discontinuity and Symmetry (Luring Lottery)** | The discontinuous payoff jump (where the prize vanishes if $k > T$) does not undermine symmetry. Superrational agents will reason that if one enters, all enter; thus, they will collectively abstain or limit entry to stay under $T$, preserving the symmetric outcome. | The discontinuous payoff jump undermines the stability required for superrational reasoning. Near the threshold, the marginal gain of entering (if one assumes others might stay out) creates a dominance incentive to defect. Symmetry is broken by the incentive structure at the margin. |
  | **(c) Norm Revision vs. Domain Clarification** | The correct resolution requires revising decision-theoretic norms. Standard theories fail to account for logical correlation between identical reasoners. A new norm (Superrationality) is needed to capture rationality in symmetric, one-shot contexts. | The correct resolution requires only clarifying the domain over which standard norms apply. CDT/EDT are sufficient; the error lies in assuming that logical similarity implies probabilistic dependence. No new norms are required, only strict adherence to causal independence. |

  ---

  ### 3. The Cruxes

  To move toward resolution, both parties identify the following sub-questions as critical. Settling these would significantly alter the position of at least one side.

  **Crux 1: The Indexing of Rationality (Token vs. Type)**
  *   **Definition:** We distinguish between a **Token Mental State** (the specific, physical instantiation of a decision process in a particular brain or machine at a specific time, subject to local noise and unique physical conditions) and a **Type-Level Algorithm** (the abstract logical procedure or function that maps inputs to outputs, independent of physical instantiation).
  *   **The Question:** Is rationality indexed to the *Token* or the *Type*?
      *   If rationality is **Token-Indexed**, then my decision is rational only relative to my specific physical state. Even if we run the "same" algorithm, physical separation makes our tokens distinct, severing the logical link.
      *   If rationality is **Type-Indexed**, then my decision is rational relative to the abstract algorithm. If we both instantiate the same Type, our decisions are logically linked regardless of physical separation.
  *   **Significance:** The Superrationalist requires Type-Indexing to justify coordination. The Independence-Reasoner requires Token-Indexing to justify independence.

  **Crux 2: Continuity Principles and Payoff Discontinuities**
  *   **Definition:** A **Continuity Principle** in this context is the assumption that small changes in the probability of execution (e.g., due to noise or error) should not result in massive shifts in the recommended rational strategy.
  *   **The Question:** Can a payoff discontinuity (like the Luring Lottery threshold) be bridged by a continuity principle without begging the question against independence?
      *   **Side A:** A continuity principle allows agents to treat the discontinuous payoff as if it were smooth by integrating over the probability of error, allowing superrational coordination to survive the threshold.
      *   **Side B:** Invoking a continuity principle here begs the question. If the payoff is objectively discontinuous, rationality must respect that discontinuity. Smoothing it artificially assumes the correlation (superrationality) that is supposed to be proven.
  *   **Significance:** If the discontinuity cannot be bridged without assuming the conclusion, the Independence-Reasoner's focus on marginal gains at the threshold stands. If it can be bridged neutrally, the Superrationalist's focus on global optimization stands.

  ---

  ### 4. Concrete Cases and Predictions

  For each crux, the parties identify a concrete case relevant to the actual structure of the puzzles and record their predictions in advance.

  **Case for Crux 1: Noisy-Reasoning Platonia Dilemma**
  *   **Scenario:** A variant of the Platonia Dilemma where agents share the same reasoning Type but execute it with independent physical noise (e.g., a 1% chance of flipping the intended decision due to neural/static error). This creates a situation where Token-identicality fails while Type-identicality holds.
  *   **Relevance:** Tests whether the rational link depends on perfect physical instantiation (Token) or abstract algorithmic identity (Type).
  *   **Superrationalist Prediction:** Correlation survives below the noise threshold that makes token-identicality fail. Agents should still randomize with a shared probability $p$ derived from the Type, as the noise is a property of the Token, not the rational Type. The expected utility calculation should assume high correlation.
  *   **Independence-Reasoner Prediction:** Any token-level divergence severs the rational link and restores independent choice. Once physical independence is introduced (even as noise), the agent must treat others' actions as independent variables. The recommended strategy reverts to the Nash equilibrium for independent actors, ignoring the logical link.

  **Case for Crux 2: Threshold Proximity in the Luring Lottery**
  *   **Scenario:** The Luring Lottery is set such that the threshold $T$ is exactly equal to the number of participants $N$. The prize is $V$ if $k \leq N$, and $0$ if $k > N$. (i.e., everyone wins only if *everyone* enters, but if even one extra hypothetical agent existed or if the threshold were $N-1$, the dynamic changes). We focus on the case where $T = N-1$. If everyone enters, everyone loses. If exactly one abstains, the rest win.
  *   **Relevance:** Tests whether the discontinuity forces a break in symmetry (Token view) or allows for a coordinated abstention strategy (Type view).
  *   **Superrationalist Prediction:** Agents will coordinate on a mixed strategy where the expected number of entrants equals $T$. They will reason: "If I enter, my Type-siblings enter, we exceed $T$, and we all lose." Thus, they will limit entry probability to ensure $E[k] \approx T$.
  *   **Independence-Reasoner Prediction:** Agents will calculate the marginal utility of entering. If the probability of being the pivotal agent (the one who pushes $k$ over $T$) is low enough, dominance reasoning dictates entry. The discontinuity creates a region where entering is dominant regardless of what the "Type" does, because the Token choice cannot causally prevent others from crossing the threshold.

  ---

