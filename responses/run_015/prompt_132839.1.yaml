      *   *Split-Brain:* Corpus callosum cut. Two hemispheres can't talk directly. Left (verbal, logical, "interpreter"). Right (spatial, holistic, non-verbal).
      *   *The Conflict:* If "I" is a loop, and the physical substrate is split, does the loop split? Hofstadter usually argues for a threshold of complexity.
