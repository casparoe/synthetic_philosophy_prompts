          *   Analyze options for self-reference after corpus callosum severance.
          *   Predict what happens to the unified "I".
          *   Compare theory vs. experimental reality (do separate loops emerge? is the interpreter a "phantom limb" for identity?).
          *   Evaluate the "phantom limb for identity" analogy.
