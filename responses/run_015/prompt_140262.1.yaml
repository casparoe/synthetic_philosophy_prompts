answer: |-
  **DRAFT WORKING DOCUMENT: ADVERSARIAL COLLABORATION ON ANTHROPOCENE BOUNDARY CRITERIA**
  **Status:** Pre-workshop Circulation | **Date:** 14 February 2025
  **Distribution:** Closed (Workshop Participants Only)

  ### 1. Agreed Claims

  The following statements represent the substantive common ground established prior to the workshop. Signatories acknowledge these as the baseline constraints for further debate. Claims that were deemed vacuous (e.g., "humans have impacted the Earth") have been excluded.

  1.  **Function of the GSSP:** A Global Boundary Stratotype Section and Point (GSSP) is primarily a correlation tool designed to define a specific horizon in the rock record that can be identified globally. It is not, by strict stratigraphic definition, a marker of causal onset, though it is frequently interpreted as such in public discourse.
  2.  **Independence of Forcing and Boundary:** The choice of a formal chronostratigraphic boundary has no bearing on the physical magnitude or timing of past human forcing on Earth systems. A 1950s boundary does not negate earlier forcing, just as a 1610 boundary does not negate the intensification of forcing in the 20th century.
  3.  **Incoherence of "First Detectable Impact":** "First detectable human impact" is not a coherent candidate for a stratigraphic boundary unless "detectable" is rigorously defined as either "instrumentally detectable" or "stratigraphically recoverable." Without this distinction, the criterion conflates the history of technology with the history of the lithosphere.
  4.  **Extra-Stratigraphic Load:** The term "Anthropocene" is already performing significant political and pedagogical work in history departments, museums, and policy documents. A formal decision by the ICS (or a rejection thereof) cannot undo this existing usage, though it may complicate it. [sic: decison]
  5.  **Mutual Concessions on Markers:**
      *   *Mid-century Camp:* Concedes that the 1950s boundary does not mark the *onset* of significant human domination of Earth systems, but rather the onset of a specific, high-magnitude signal phase.
      *   *Long-Anthropocene Camp:* Concedes that pre-1950 markers (e.g., 1610 CO2 dip, early pollen shifts) are often weaker, more diachronous, and harder to correlate globally than the mid-century radionuclide signal.
  6.  **Durability Constraint:** Both camps agree that a valid chronostratigraphic unit must theoretically survive burial and diagenesis over geological timescales (10^5 years), even if current identification relies on transient markers.

  ### 2. Disagreements Table

  The following table isolates the specific cruxes where consensus currently fails. For each crux, both camps commit to a specific prediction regarding an accepted test case or rule.

  | The Crux | Mid-Century Camp Position | Long-Anthropocene Camp Position | Accepted Test / Rule / Case | Mid-Century Prediction | Long-Anthropocene Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Correlation vs. Causation** | The primary function of the boundary is global time-correlation. Causal history is secondary to the ability to sync sections. | The primary function of the unit is to mark a shift in Earth-system state. Correlation is useless if it misses the causal turning point. | **The Cape Town Protocol:** Splitting the term into a stratigraphic "Anthropocene" and a historical "Human Period." | The split will clarify scientific communication by isolating the rock record from historical narrative. | The split will ghettoize the stratigraphic unit, rendering it irrelevant to the actual history of human-planet interaction. |
  | **2. Tolerance for Diachroneity** | A boundary requires high synchrony. A marker appearing >25 years apart across sections fails the GSSP requirement for a "golden spike." | Human impacts spread diachronously. Enforcing strict synchrony privileges the Global North and ignores the process of colonization and exchange. | **The Synchrony Quotient & Namibia Varves:** Applying the 0.8 quotient rule to the 1911 Namibia plastic horizon (lagging NH by 20–40 yrs). | The 1911 plastic horizon will fail the 0.8 quotient globally; therefore, it cannot define the boundary, reinforcing the 1950s radionuclide spike. | The 1911 horizon proves plastic spread was global pre-1950; the 0.8 quotient rule is an arbitrary filter that artificially excludes valid early markers. |
  | **3. Durability vs. Magnitude** | Initial signal magnitude and sharpness are paramount for identification. Diagenetic loss over 100ky is a problem for future geologists, not current definers. | Durability is the defining feature of a stratigraphic unit. A signal that degrades faster than the unit's intended timescale is lithologically invalid. | **Diagenesis Modelling:** Comparing 1950s radionuclide/plastic degradation vs. 1610 chemical signal survival. | Current stratigraphy prioritises present-day identifiability; future degradation does not invalidate the current utility of the 1950s marker. | If the 1950s signal degrades faster than the 1610 signal, the 1950s boundary is stratigraphically ephemeral and should be rejected. |
  | **4. Authority and Decision** | Chronostratigraphy is a technical discipline. Boundaries must be decided by stratigraphers using established codes, not by interdisciplinary panels. | The "Anthropocene" is a hybrid object. Deciding its start requires input from historians, archaeologists, and Indigenous representatives, not just geologists. | **The Cape Town Protocol:** Establishing a mixed panel for the non-stratigraphic "Human Period." | A mixed panel lacks the technical rigor to define geological time and will produce a boundary that is scientifically indefensible. | A stratigrapher-only panel lacks the contextual knowledge to define human history and will produce a boundary that is historically nonsensical. |
  | **5. Onset Definitions** | "Onset" must mean the onset of a globally synchronous *signal* (the Golden Spike), regardless of when forcing began. | "Onset" must mean the onset of significant human *forcing* or Earth-system state change, regardless of signal synchrony. | **Terminological Separation:** Explicitly defining "Onset of Forcing," "Onset of Signal," and "Onset of State" as three distinct variables in the final report. | Separating these terms will validate the Mid-century position as the only viable *Signal* onset. | Separating these terms will reveal the *Signal* onset as arbitrary, validating the Long-Anthropocene *Forcing* onset as the meaningful metric. |

  ### 3. Closing Assessment: Verbal vs. Real Disputes

  A significant portion of this dispute is verbal, centering on the defintion [sic] of the term "Anthropocene" rather than the physical reality of the rock record or human history. Both camps agree on the data: they agree humans impacted the climate pre-1950; they agree radionuclides are synchronous post-1950; they agree plastics appear in 1911 in Namibia. The disagreement lies in which of these data points warrants the label.

  However, a real dispute remains regarding the *function* of geological time. If the purpose of the unit is to allow a geologist in 10 million years to correlate a section in Namibia with one in Greenland, the Mid-century position is stronger on synchrony but weaker on durability (per Stipulation 3). If the purpose is to mark a transition in planetary state, the Long-Anthropocene position is stronger on causation but weaker on correlation (per Stipulation 2).

  **Refusal Formulations ("Poison Pills")**

  To facilitate the workshop, organizers note that certain neutral-sounding formulations will be rejected by specific camps because accepting the framing concedes the argument.

  *   **For the Mid-Century Camp:** They will refuse to sign any statement defining the boundary as *"the start of significant human impact on the Earth system."* Accepting this formulation concedes that the boundary must track causation/forcing, which invalidates the 1950s marker in favor of an earlier date.
  *   **For the Long-Anthropocene Camp:** They will refuse to sign any statement defining the boundary as *"the first horizon capable of precise global correlation using artificial markers."* Accepting this formulation concedes that synchrony and artificiality are the primary criteria, which invalidates early agricultural or exchange-based markers in favor of the 1950s.

  ***
  *End of Draft*
