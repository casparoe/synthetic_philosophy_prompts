  1. [Documented Text] In his 1950 paper "Computing Machinery and Intelligence," Turing briefly mentions telepathy as a potential loophole in the imitation game. Most readers skip that paragraph, but if we take your view that this wasn't just a throwaway line, how does that change what he meant by "thinking"? Is he leaving a backdoor open for non-physical information channels?

  2. [Contested Theory] You've suggested he wasn't looking for ghosts, but for weak signals. Can we get specific about the math? Are we talking about Bayesian inference here, or something closer to the sequential analysis he was using at Bletchley? What would a "Turing test for ESP" actually look like on paper?

  3. [Contested Theory / Follow-up] I can imagine a skeptic listening to this and saying, "Come on, Turing was known for his dry wit. Maybe he was just poking fun at the parapsychology craze of the 50s." How do you respond to the claim that this was purely ironic?

  4. [Contested Theory / Follow-up] Let's say a listener pushes back harder. They'd say, "Look, modern science has tested ESP repeatedly and it doesn't hold up. Why are we dignifying this?" If your argument is that his methodology was sound even if the phenomenon wasn't real, how do we avoid judging 1950s hypotheses with 2020s data?

  5. [Contested Theory] This is the big philosophical one for my book. If you frame ESP as a computation problem—input, output, noise—does that actually make it easier to disprove? Or does it just hide the mystery inside the machine?

  6. [Documented vs. Contested] I want to be careful not to overstate the case. We have letters where he mentions ESP, and we have his work on statistics. But the link between the two—that the stats *drove* the ESP interest—is that heavily documented, or is that where your interpretation steps in?

  7. [Documented Context] Why did he think a computer was necessary for this? Zener cards were the standard back then. Was he trying to remove human bias from the recording, or did he think the machine itself might be the receiver?

  8. [Documented Context] Was he alone in this? Were there other cyberneticians or mathematicians in Cambridge or Manchester trying to run psychic data through early processors, or was this uniquely Turing?

  9. [Contested Theory] If telepathy is just a signal-to-noise problem, that implies it's physical-ish. Does this view strip the "para" out of parapsychology? Does it turn magic into engineering?

  10. [Contested Theory] Finally, for my readers who see AI as purely logical today—does knowing Turing entertained this kind of "noisy" intelligence change how we should view the origins of computer science?
