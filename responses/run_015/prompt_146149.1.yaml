answer: |-
  **Preparatory Conceptual Mapping**

  1.  **Testimonial vs. Hermeneutical:** Testimonial injustice involves a credibility deficit assigned during an exchange due to prejudice; hermeneutical injustice involves a structural gap in shared concepts that renders experience unintelligible.
  2.  **Anticipatory Hermeneutical Foreclosure (AHF):** Distinct because it operates pre-emptively via infrastructure; it filters local concepts before they enter the communicative space, suppressing the conditions for concept-formation rather than just discounting the speaker or lacking the concept.
  3.  **Concrete Case:** A Southeast Asian epidemiologist's local data on water-borne transmission is categorized as "noise" by global predictive algorithms before it can be validated as a knowledge claim.
  4.  **Objections:** A bipartite defender might argue this is merely institutionalized testimonial injustice (prejudice encoded in algorithms) or that it relies on metaphysically dubious claims about harm to non-actualized speech acts.

  ***

  **Dialogue: The Structure of Foreclosure**

  **Dr. K.:** Let us begin with the case of the epidemiologist in Southeast Asia. She possesses a locally cultivated framework for understanding chronic water-borne transmission patterns, yet international health models automatically classify her data as statistical noise. I argue this is not merely testimonial injustice, where a hearer prejudices a speaker, nor hermeneutical injustice, where a concept is missing from the collective repertoire. This is anticipatory hermeneutical foreclosure. The predictive infrastructure filters out the conceptual framework before it can even be articulated as a credible claim. The harm is not a deficit of credibility, but a structural suppression of the conditions for concept-formation itself.

  **Dr. R.:** I understand the intuition, but I fear you are multiplying entities beyond necessity. What you describe collapses neatly into testimonial injustice. The algorithm is not a neutral force; it embodies the prejudices of its designers in the Global North. When the model flags local data as noise, it is assigning a preemptive credibility deficit to the source. The mechanism is automated, but the normative wrong is identical: a speaker is wronged because of identity prejudice embedded in the hearer—in this case, the institutional hearer represented by the model.

  **Dr. K.:** That reduction misses the temporal and structural specificity of the wrong. Testimonial injustice occurs *during* an exchange of reasons; someone speaks, and they are disbelieved. In this case, the epidemiologist is prevented from entering the exchange as a knower. The algorithm does not judge her credibility; it categorizes her output as non-knowledge before it reaches a human audience. This is not about believing a speaker; it is about the infrastructure rendering certain forms of life unintelligible by design, operating anticipatorily rather than reactively.

  **Dr. R.:** But if the exchange never occurs, who is the victim of the injustice? Epistemic injustice traditionally requires a subject who is wronged in their capacity as a knower within a communicative act. By positing harm to the "conditions for concept-formation," you seem to be invoking harm to potential future knowers or non-actualized speech acts. This introduces unnecessary metaphysical commitments. If the data is simply filtered out, that is structural bias in data science, certainly, but labeling it a distinct form of epistemic injustice stretches the normative category until it loses its critical bite.

  **Dr. K.:** The victim is not a hypothetical person, but the actual epidemiologist whose epistemic agency is structurally muted. She is present, she is producing knowledge, but the institutional architecture disables her capacity to contribute to the collective hermeneutical resource. The harm is to her actual professional agency, not a metaphysical possibility. The infrastructure acts as a non-human agent of foreclosure, bypassing the interpersonal dynamic entirely. We must account for harms that operate through technical systems which regulate intelligibility prior to human interaction.

  **Dr. R.:** I grant the harm is real, but I question the need for a tripartite framework. If the remedy for testimonial injustice is correcting prejudice and the remedy for hermeneutical injustice is expanding conceptual resources, does your third category demand a genuinely different solution? If we fix the prejudice in the algorithm, we fix the testimonial element. If we incorporate her local concepts into the model, we fix the hermeneutical gap. Parsimony suggests we should not posit a new category unless the remedy differs fundamentally.

  **Dr. K.:** The remedy *does* differ. Correcting testimonial injustice requires cultivating virtues in listeners—training them to resist prejudice. Expanding hermeneutical resources requires inclusive dialogue to generate new concepts. But anticipatory foreclosure requires infrastructural redesign. You cannot virtue-ethics an algorithm; you must audit the predictive logic itself. The tension remains because the bipartite framework focuses on human interactions, whereas this injustice is embedded in the temporal mechanics of the system itself. We may agree on the harm, but until you acknowledge the distinct mechanism, the solution will remain incomplete.
