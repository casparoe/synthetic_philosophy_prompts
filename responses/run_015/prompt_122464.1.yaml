      *   *Probe vs. Use:* Correlation $\neq$ Causation. *Requirement: Interventional Robustness.* Knocking it out breaks the behavior.
      *   *Misrepresentation:* When is it wrong? *Requirement: Normative Grounding.* There must be a ground truth or objective function that defines error.
