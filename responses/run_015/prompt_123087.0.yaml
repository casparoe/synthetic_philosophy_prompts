  **TO:** Curriculum Committee
  **FROM:** Parent Representative
  **DATE:** Sunday, [Date]
  **SUBJECT:** Recommendation on 7th-Grade Anthropocene Unit Pilot

  **Recommendation:** Adopt with Conditions

  **Reasoning**
  This unit offers a rare opportunity to teach 7th graders how scientific definitions are constructed, not just what they are. The timeline activity—arguing for 1610, 1950, or 8,000 years ago based on evidence—correctly identifies that science often involves interpreting data rather than just recalling dates. However, Marv's objections regarding assessment integrity and factual accuracy are valid and must be addressed to maintain departmental trust and district standards.

  We cannot assess students on a debate with no resolution, nor can we teach a proposed epoch as settled fact when the International Union of Geological Sciences voted against ratification in 2024. The parent concern that this teaches "there are no facts" is the strongest argument from the side opposing this pilot. If we proceed without clarifying the official status of the term, we risk confusing students about the difference between scientific debate and scientific consensus.

  **Conditions for Adoption**
  To resolve this, we keep the inquiry-based activity but change the summative assessment. The activity remains an argumentation exercise (no single key), but the end-of-unit test item must verify factual knowledge of the evidence markers without requiring students to endorse one start date as "correct."

  **Proposed Assessment Item**
  Replace the teacher's proposed item with the following multiple-choice question:
  *"Scientists propose different start dates for the Anthropocene based on different evidence. Which geological marker is globally distributed in sediments dating to the proposed 1950 start date?"*
  *   **Key:** Plutonium fallout from nuclear testing.
  *   **Distractors:** CO2 dip (1610), Rice paddies (8,000 years ago), Industrial soot (1800s).

  This item has a single defensible key, satisfying Marv's requirement for grading reliability. It tests the science content (markers) rather than the validity of the epoch itself. Additionally, the unit must explicitly state as a fact that the Anthropocene is not currently an official unit on the Geologic Time Scale.

  **Precedent**
  Adopting with these conditions sets a constructive precedent for contested topics: we teach the debate to foster critical thinking, but we assess the underlying facts and clarify the current status of the terminology. This respects the standards while preserving the unit's intellectual engagement.

  \answer{adopt with conditions}
