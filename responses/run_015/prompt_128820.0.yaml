  # JOINT STATEMENT ON THE EVOLUTIONARY AND INSTITUTIONAL DYNAMICS OF COOPERATION

  **Signatories:**  
  The Rational-Choice Evolutionary-Game Theorist (RC-EGT)  
  The Cultural-Institutional Theorist (CI)

  **Date:** October 26, 2023  
  **Subject:** Findings from Adversarial Collaboration on Cooperation, the Prisoner's Dilemma, and Evolutionary Dynamics

  ## I. AGREED CLAIMS

  Following a series of structured debates and model reviews, we affirm the following propositions as common ground:

  1.  **Formal Structure:** We agree on the mathematical definition of the Prisoner's Dilemma (PD). In a single interaction, the payoff structure satisfies $T > R > P > S$ (Temptation > Reward > Punishment > Sucker), and $2R > T + S$. We agree that under standard assumptions of self-regarding preferences and common knowledge of rationality, defection is the unique Nash equilibrium in the one-shot game.
  2.  **Empirical Record:** We agree that laboratory data consistently show rates of cooperation in one-shot anonymous PDs that significantly exceed the Nash prediction of zero. We further agree that cooperation rates in iterated PDs are higher than in one-shot games but decay over time in finite-horizon treatments unless specific institutional or reputational mechanisms are introduced.
  3.  **Origin vs. Maintenance:** We agree that the evolutionary *origin* of a trait (how it first emerges via mutation or cultural innovation) is analytically distinct from its *maintenance* (the selection pressures that prevent it from being invaded by defectors). We agree that any complete theory must account for both stability against invasion and the initial conditions for emergence.

  ## II. DISAGREEMENTS TABLE

  The following table summarizes our divergent explanations for the phenomena agreed upon in Section I. Each position is phrased to be acceptable to the holder of that view.

  | Topic | Rational-Choice Evolutionary-Game Theorist (RC-EGT) | Cultural-Institutional Theorist (CI) |
  | :--- | :--- | :--- |
  | **Primary Mechanism** | Cooperation is maintained chiefly by individual-level selection operating through direct or indirect reciprocity. Strategies that defect are eliminated because they yield lower lifetime fitness/payoffs in repeated interactions. | Cooperation is maintained chiefly by multi-level selection, where group-level pressures (competition between groups) and institutional scaffolding suppress within-group defection. |
  | **One-Shot Baseline** | Defection in the anonymous one-shot PD is the normative rational baseline. Observed cooperation is attributable to error, misperceived repetition, or preferences for fairness that are themselves evolved individual adaptations. | Defection in the anonymous one-shot PD is a culturally specific framing artifact. The normative baseline is prosociality, sustained by internalized norms that function even without external enforcement. |
  | **Model Scope** | Abstract game-theoretic models capture the essential logic of social interaction. Cultural and institutional factors are derivative variables that alter payoff matrices or shadow-of-the-future probabilities. | Abstract models systematically understate shared intentionality and ecological embeddedness. Social context constitutes the interaction rather than merely modifying its parameters. |

  ## III. CRUXES AND PREDICTIONS

  We identify three specific points of contention where empirical evidence or modeling results could shift the weight of consensus. For each crux, we specify a concrete case and our respective predictions.

  ### Crux 1: Scaling Direct Reciprocity Without Institutions
  **Question:** Can direct reciprocity sustain high cooperation in large-scale groups without institutional enforcement or parochial norms?

  *   **Concrete Case:** Large-scale public goods games where group size exceeds the Dunbar number, interaction is anonymous, and the probability of future encounter ($w$) is low but non-zero.
  *   **RC-EGT Prediction:** Cooperation will collapse to near-zero as group size increases and $w$ decreases. Any observed cooperation will be correlated with individuals' belief that $w$ is higher than it actually is (misperception).
  *   **CI Prediction:** Cooperation will remain significantly above zero provided a shared group identity or normative frame is activated, regardless of $w$. The mechanism is norm adherence, not calculated future return.

  ### Crux 2: One-Shot Cooperation and the Rational Baseline
  **Question:** Does high cooperation in high-stakes anonymous one-shot interactions falsify the claim that defection is the rational baseline?

  *   **Concrete Case:** A one-shot PD where the stakes are calibrated to represent a meaningful portion of participants' income, ensuring anonymity is technically guaranteed and understood.
  *   **RC-EGT Prediction:** As material stakes rise, cooperation rates will decrease significantly, converging toward the Nash equilibrium. High cooperation at low stakes is "cheap talk" or noise; high stakes reveal true material preferences.
  *   **CI Prediction:** Cooperation rates will remain stable or increase as stakes rise, because the *moral cost* of defection scales with the harm inflicted on the partner. The utility function includes the welfare of the other, making cooperation the rational choice even at high stakes.

  ### Crux 3: Ecological Validity and Model Predictions
  **Question:** Does ecological context alter the decision architecture, or merely the input parameters?

  *   **Concrete Case:** Framing experiments where the identical payoff matrix is labeled either "The Community Game" or "The Stock Market Game."
  *   **RC-EGT Prediction:** Framing effects operate by altering the subjective valuation of payoffs (e.g., social approval is a payoff) or the perceived probability of repetition. The underlying decision logic (maximization) remains unchanged.
  *   **CI Prediction:** Framing effects operate by switching the mode of cognition from "exchange" to "sharing." This is a qualitative shift in decision architecture, not a quantitative adjustment of parameters within a single maximization function.

  ## IV. ASSESSMENT OF VERBAL DISPUTE

  We have assessed whether our disagreement regarding "rationality" is substantive or purely verbal.

  **Assessment:** The dispute is **partially verbal, with a substantive core.**

  **The Verbal Boundary:**
  The disagreement is verbal regarding the *labeling* of behavior. If the RC-EGT camp defines "rationality" strictly as internal consistency in maximizing a utility function $U$, and allows $U$ to include "adherence to social norms" or "warm-glow giving" as arguments, then the CI camp's observation of norm-following behavior can be described as "rational" by RC-EGT standards. In this specific semantic frame, the CI claim that "cooperation is rational" and the RC-EGT claim that "defection is rational" are compatible, provided they specify the contents of $U$.

  **The Substantive Boundary:**
  The disagreement becomes substantive regarding the *generative source* of the preferences within $U$.
  *   **RC-EGT** holds that preferences for norm adherence must ultimately be reducible to individual-level fitness maximization (e.g., these preferences evolved because they helped individuals secure reciprocal benefits in the ancestral environment).
  *   **CI** holds that preferences for norm adherence are constituted by cultural group selection and institutional history, and cannot be reduced to individual fitness maximization without losing explanatory power (e.g., the norm persists because it benefits the group, even if it reduces individual fitness).

  **Joint Conclusion on Rationality:**
  We agree that if the debate rests solely on whether a norm-following agent is "maximizing," it is verbal. If the debate rests on whether the preferences being maximized are the product of individual selection acting on genes/individual learning versus group selection acting on cultural variants, it is substantive. We commit to distinguishing these two layers in future discourse.

  ***

  **Signed,**

  _________________________  
  Rational-Choice Evolutionary-Game Theorist

  _________________________  
  Cultural-Institutional Theorist
