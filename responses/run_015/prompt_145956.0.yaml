      *   **Intentional Stance & Ethics:** Address the friend's argument. The "no fact of the matter" claim is metaphysically interesting but ethically neutral. Our remit is the family's good, not ontological truth. However, predictive payoff isn't the only metric; *harm* is. If the stance prevents acceptance of loss, it fails ethically even if it predicts text well.
