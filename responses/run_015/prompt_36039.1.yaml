  **The Principle of Fiduciary Deviation:** Unilateral action is forbidden if you have entered a specific joint decision-making compact or if the action imposes significant unconsented physical risks on others. Permission is granted if: (1) the internal procedure is demonstrably failing its ethical or legal mandate; (2) the action corrects systemic epistemic errors without imposing physical risk; or (3) the resources and primary risks are privately borne.

  **Motivations:** Case 4 (Climate) violates the joint compact clause; co-authorship implies veto power. Case 2 (Pathogen) violates the physical risk clause; potential harm outweighs individual judgment. Case 3 (Privacy) satisfies Exception 1; burying complaints proves procedure failure. Case 1 (Researcher) satisfies Exception 2; scientific truth norms override hierarchical delay when no physical risk exists. Case 5 (Billionaire) relies on Exception 3.

  **Predictions:**
  **Case 6 (Security):** **Acceptable.** The 90-day window *is* the procedure. Publishing afterward follows community norms; ignoring the vendor after this point triggers Exception 1 (procedure failure).
  **AI Safety Case:** **Wrong.** AI development involves catastrophic external risks (like Case 2). Unless the team violates law/ethics (Exception 1), unilateral escalation breaches the joint safety compact required for high-stakes coordination.

  **Inconsistency:** I cannot save **Case 5**. Geoengineering imposes global externalities (weather, ecosystems) comparable to Case 2's pathogen. If Case 2 is wrong due to public risk, Case 5 must also be wrong. Your intuition that "only her money is at risk" is factually incorrect regarding geoengineering. To maintain coherence, you must concede Case 5 was unacceptable.

  **Breaking the Curse:** The unilateralist's curse assumes all group constraints are equally valid and errors are symmetric. This principle breaks it by distinguishing **legitimate coordination** from **fiduciary failure**. Conformity is required only when the group structure is legitimate and the stakes are shared. When the group protects error (Case 1) or harm (Case 3), unilateralism becomes a duty. The curse applies to coordination problems, not to whistleblowing or epistemic corrections where the "group" interest is misaligned with truth or safety.
