  4. Model drift represents the erosion of personhood, where a node that fails to align its local updates across consensus rounds is gradually pruned from the network rather than punished as an independent transgressor.
  5. While the mechanics of exclusion translate cleanly, the concept of contribution is distorted into data transfer, and the normative obligation to sustain the network has no expression in an optimization frame focused solely on convergence. This leftover shows not a failure of the metaphor but that Ubuntu performs ethical work engineering vocabulary cannot capture.
