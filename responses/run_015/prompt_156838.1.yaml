          5.  Address defensibility (Bias vs. Structural Truth).

  8.  **Refining the "Name":**
      *   The user mentioned "Separateness of Persons" but dismissed it as distributive. I need to reclaim it. Rawls used it for justice, but the *ground* of that usage is the metaphysical claim the user is making.
      *   Better term: **The Disunity of Consciousness** or **The Privacy of Pain**.
      *   Actually, the most precise technical term for "sums within but not across" is **Limited Aggregation** or **Interpersonal Non-Aggregation**.
      *   Let's focus on the metaphysical claim: **Value is Subject-Relative**.

  9.  **Refining the "Defensibility":**
      *   Need to balance the Utilitarian critique (Scope Insensitivity) with the Contractualist defense (Individual Standpoint).
      *   The "glitch" argument relies on the "View from Nowhere." The "defensible" argument relies on the "View from Here."

  10. **Final Polish:**
      *   Ensure I answer the specific question about "one person over long time vs many people." (Parfit's Reductionism).
      *   Ensure I answer the "forgetting" aspect. (Experience Machines).
      *   Make sure not to provide a reading list.

      *(Self-Correction during drafting)*: I need to be careful not to confuse "Separateness of Persons" (Rawls) with "Non-Aggregation" (Kamm/Scanlon). The user is asking about the *aggregation mechanism*, not the *political implication*. I should clarify that distinction. The user's intuition is that badness is *owned*.

      *Key distinction to highlight:* Is pain a substance (like water) that can be poured into a bucket? Or is it a relation (like "being tall") that only exists relative to a specific frame? The user is arguing for the latter.

      *Name:* **The Non-Additivity of Interpersonal Utility** or **Agent-Relative Badness**. Let's go with **Interpersonal Non-Aggregation** as the functional label, grounded in the **Separateness of Persons** (metaphysical sense).

      *Diminishing Returns:* Explicitly state this is distinct. Diminishing returns says $2x$ pain is less than $2 \times$ pain. User's view says $1$ pain (Person A) + $1$ pain (Person B) is not necessarily $2$ pains.

