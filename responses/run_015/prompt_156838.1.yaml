answer: |-
  You have put your finger on a very real joint in the moral landscape. You haven't mashed two things together; you have isolated the specific metaphysical assumption that drives the disagreement, distinct from the usual noise about magnitude.

  Here is the carving you are looking for.

  ### 1. Is there a name for this?
  The functional label for the claim that summing works within a life but not (or not fully) across lives is **Interpersonal Non-Aggregation**.

  However, the metaphysical grounding for that claim is what you are actually sensing. While you dismissed "Separateness of Persons" because it is often used to talk about distributive justice, at its root, it is exactly the claim you are describing: that persons are distinct containers of value, not merely locations in a single field of value.

  A more precise label for the specific mechanism you identified is **Agent-Relative Badness** (or Value). This is the claim that "badness" is not a free-floating substance (like carbon emissions) that exists in the universe regardless of who holds it, but is essentially a relation between a state of affairs and a specific subject. If badness is essentially *someone's* badness, then adding "my badness" to "your badness" is a category error, like adding "my height" to "your height." The sum doesn't create a "taller person"; it just creates a list.

  ### 2. Is this just diminishing returns?
  No, it is a different animal entirely.

  **Diminishing returns** (or a concave utility function) is a claim about the *curve* of value within a container. It says that the second hour of torture is less bad *for the victim* than the first hour, or that the millionth dust speck is less noticeable than the first. It accepts the container but argues the stuff inside gets less dense.

  **Your intuition** is about the *container* itself. You are saying that even if the millionth speck is just as bad as the first, moving it to a new person breaks the chain of summation. You are proposing a structural barrier to aggregation, not a mathematical discount rate. In philosophical terms, diminishing returns is intra-personal; your intuition is inter-personal.

  ### 3. Does the boundary of the "subject" matter?
  Yes, and this is where the view gets tested. If your intuition is correct, the "moral unit" is the conscious subject, not the biological human.

  *   **One person over time:** Most people (including you, it seems) feel aggregation holds here. Ten pinpricks over an afternoon is worse than one. This suggests continuity of memory or psychological connectedness allows summation.
  *   **Forgetting:** If the person forgets each pinprick instantly, does it still sum? If you say "no," then you are arguing that *memory* or *narrative unity* is required for badness to accumulate. If you say "yes," then the mere continuity of the biological organism is enough.
  *   **Split Brains/Many Minds:** If a creature has two distinct centers of consciousness (like a split-brain patient), does a pinprick to the left hand sum with a pinprick to the right hand? If your intuition says "no, that's two minds," then you have confirmed that the unit of aggregation is the *mind*, not the *body*.

  This is the hard edge of the view: If badness only piles up within a single subject, you have to define where a subject begins and ends. If you can't draw that line sharply, the aggregation boundary gets fuzzy.

  ### 4. Is this defensible, or a glitch?
  This is the most important part. The verdict is not unanimous; it depends entirely on which "viewpoint" you think morality is supposed to adopt.

  **The "Glitch" Verdict (The View from Nowhere):**
  Utilitarians and total consequentialists argue your intuition is a cognitive bias, often labeled **Scope Insensitivity** or **Identifiable Victim Effect**. They argue that pain *is* a substance. If there is a universe with one person in agony, and a universe with a billion people with dust specks, the second universe contains more "pain-stuff." To them, refusing to sum across persons is like refusing to count dollars in different bank accounts when calculating total wealth. They believe we should train ourselves out of this intuition because it leads to irrational decisions on a large scale.

  **The "Defensible" Verdict (The View from Here):**
  Contractualists and rights-based ethicists argue your intuition is the *foundation* of morality, not a bug. Their argument is phenomenological: There is no "universe" that feels the dust specks. There is only *you* feeling a speck, and *me* feeling a speck. Since no single consciousness experiences the sum, the sum does not exist in the only place that matters (experience).
  From this angle, it is defensible to say you cannot trade one person's intense suffering for a million strangers' minor annoyances, because there is no single standpoint from which that trade looks beneficial. The person being tortured loses everything; the million others gain a negligible amount. There is no "greater good" that stands above the individuals to justify the sacrifice.

  ### Summary
  You have identified **Interpersonal Non-Aggregation**, grounded in the metaphysics of **Agent-Relative Value**. It is distinct from diminishing returns because it concerns the boundaries of the subject, not the weight of the experience.

  Is it defensible? Yes. It is the central pillar of non-utilitarian ethics. The "glitch" accusation only holds if you assume beforehand that the "View from Nowhere" (the God's-eye view of total sums) is the only valid moral perspective. If you assume the "View from Here" (the individual's experience) is primary, your intuition is not just defensible; it is necessary.
