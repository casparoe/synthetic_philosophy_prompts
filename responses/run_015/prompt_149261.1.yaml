      *   *Goal:* Justify interpersonal aggregation (Utilitarianism) by equating it to intrapersonal prudence (which is generally accepted as rational).

  3.  **Drafting the Correspondence Table:**
      *   Need to map Intrapersonal (Prudence) $\leftrightarrow$ Interpersonal (Utilitarianism).
      *   *Time-slices* $\leftrightarrow$ *Individuals*.
