  2.  **Deconstruct the Colleague's Argument (The "Prudence Analogy"):**
      *   *Core Claim:* Morality is just optimization. The unit of optimization doesn't matter (time vs. people).
      *   *Metaphysics:* Persons are bundles of experiences connected by memory/psychology. This connection is a matter of degree (Parfitian reductionism).
