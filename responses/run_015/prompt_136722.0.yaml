  In your friend's analogy, the Corporation corresponds to the Statue, representing the higher-level object defined by function and form. The Employees map directly to the Clay Particles, serving as the constituent material basis. Hiring and Firing workers equate to the physical processes of gaining or losing atoms through erosion or restoration. The Corporate Charter or Contractual Roles mirror the Arrangement or Shape imposed on the clay, dictating how parts relate to the whole. Finally, Corporate Identity over time parallels Statistical Identity, suggesting continuity relies on structural persistence rather than material permanence. The analogy posits that just as a corporation survives total staff turnover via maintained roles, the statue survives atomic replacement via maintained form. It treats the corporation not as a ghostly entity hovering over workers, but as the workers organized specifically. Similarly, the statue is just clay particles organized statue-wise. This mapping supports the view that constitution is identity: there is no second object, only the parts functioning together under a specific description. The temporary parts notion suggests atoms are merely leased contributors to the structural whole, much like temporary contractors fulfilling a corporate role without defining the corporation's essence. This framework implies that counting objects is merely counting descriptions. If the corporation is just the staff organized, the statue is just the clay organized. The analogy insists that positing a second object—the statue distinct from the clay—is as redundant as positing a corporate ghost distinct from the staff. It relies on the intuition that organizational structure is sufficient for objecthood, denying that the material substrate possesses independent identity conditions that diverge from the structured whole. Thus, the analogy serves as a functionalist reduction of material constitution.

  - Where the mapping breaks
  The mapping fractures critically around survival conditions and modal properties. A corporation can survive the replacement of every single employee, provided the structure remains. However, a statue cannot survive the replacement of every single clay particle without becoming a copy, whereas the clay lump itself persists through radical rearrangement. If you squash the statue, the statue ceases to exist, but the clay remains. In the corporate analogy, firing all employees usually dissolves the corporation, whereas squashing clay does not dissolve the matter. Furthermore, the statue cannot "fire" atoms voluntarily; atoms are bound by physical laws, not contracts. Employees have agency; clay particles do not. This lack of agency matters for identity. The corporation is an abstract legal construct capable of surviving material discontinuity in a way physical objects are not. The clay possesses modal properties the statue lacks: the clay could have been shaped into a ball, but the statue could not. The analogy ignores this divergence in possibility. It treats physical constitution like organizational membership, but physical objects are bound by spatiotemporal continuity in ways legal fictions are not. The "temporary parts" claim further strains the map: atoms aren't borrowed; they are physically bonded. Unlike contractors leaving a firm, atoms don't resign; they are forcibly removed or chemically altered. The analogy smooths over the physical necessity binding clay to statue, pretending it is as loose as employment law. The friend's point about temporary parts suggests atoms are only contingently part of the whole. But in physics, an atom integrated into a molecule is structurally distinct from a free atom. Employees remain the same people whether hired or not. Clay atoms change state when bound in a solid versus loose dust. The analogy assumes parts remain unchanged by membership, which is physically false for matter. This breakdown reveals that physical constitution involves mereological fusion, not just functional grouping. The statue's dependence on the clay is ontological, not merely contractual. When the mapping breaks, it reveals that the statue's existence is more fragile than the corporation's, while the clay's existence is more robust than the employees'. This distinction is crucial.

  - What's being smuggled in
  The analogy smuggles in a functionalist theory of identity, assuming objects are defined by roles rather than matter. It presupposes that persistence conditions are determined by structural continuity, ignoring material essentialism. By comparing clay to employees, it assumes parts retain identity independent of the whole, which overlooks how physical integration changes properties. It also assumes identity over time is unproblematic for both cases, hiding the philosophical debate about endurance versus perdurance. The corporation is a legal abstraction designed to persist; the statue is a physical particular subject to decay. Treating them alike assumes physical objects have the same conventional flexibility as legal entities. This hides the hard problem of material constitution: why two things with different properties occupy the same space. The analogy assumes away the problem rather than solving it. It implicitly denies that form creates a new ontological category, reducing everything to arranged parts. This begs the question against pluralists who argue form generates distinct identity conditions. It prioritizes social continuity over physical continuity, biasing the metaphysical inquiry toward conventionalism.

  - Does her conclusion survive?
  Without the analogy, her constitutional monism faces the "modal mismatch" objection directly. Pluralists argue that since the clay survives squashing and the statue does not, they must be distinct objects. The analogy obscured this by comparing physical destruction to corporate dissolution, which works differently. Stripping the analogy leaves her needing to explain why different truth conditions don't imply different objects. She must argue that these differences are linguistic, not ontological. This is a harder sell without the intuitive pull of the corporate example. However, her view isn't defeated; it just loses rhetorical support. Monists can still argue that counting objects by properties leads to explosion. But the analogy's failure means she can't rely on functional equivalence to prove ontological identity. The burden shifts back to explaining away the intuitive difference between lump and statue. The analogy was a crutch; removing it weakens the presentation but not necessarily the underlying metaphysics, provided she has a robust error theory for our intuitions about distinct objects. She must dissolve the apparent contradiction in properties without the corporate shield. Her view now requires stronger logical groundwork to sustain the single-object claim against pluralist objections.

  - A better analogy?
  A knot in a rope offers a tighter fit. The knot is just the rope arranged specifically, yet untying destroys the knot while the rope survives. Unlike employees, rope fibers are physically bound and lack agency. This captures the dependency better: the knot cannot exist without the rope, and the rope can exist without the knot. It highlights the asymmetry of survival conditions without invoking legal fictions. It shows how form creates a temporary object from enduring matter, clarifying the constitution relation without implying separate entities. This maintains the single-object intuition while respecting physical constraints.
