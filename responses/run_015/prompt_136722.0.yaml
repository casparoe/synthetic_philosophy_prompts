  I was talking to my friend who does metaphysics for a podcast I'm working on — it's about whether objects are just there parts arranged fancy — and she kept comparing the statue and the clay to a corporation and its employees. Like, the corporation isn't some ghost riding on top of the staff, it's just them with roles and contracts, and if you replace every worker over ten years it's still the same corporation, so why treat the statue as some extra spooky thing beyond the clay? She uses this to push this view that there's literally just one object — the clay arranged statue-wise — and that all this talk about 'material constitution' is philosophers making mountains out of molehills. But then she threw in this other thing she read somewhere — maybe a niche paper? — about temporary parts, like the clay's atoms being borrowed for a while, and whether that means the statue is more like a temporary assembly than a permanent thing. I'm not totally sure I followed, and I don't want to misrepresent her in the piece.

  Anyway, I'm trying to figure out if the corporation analogy actually holds water, or if it's just carrying her conclusion on it's back. Can you lay out the correspondence — corporation to statue, employees to clay particles, firing/hiring to gaining/losing atoms — then point out where the mapping breaks down, especially around survival conditions and whether the statue can 'fire' its atoms and stay itself? Also tell me what the analogy quietly assumes about identity over time that the clay/statue case might not share, and whether stripping away the analogy's persuasive power leaves her one-object view standing or actually gives ammo to the pluralists. If there's a cleaner analogy for what's going on with material constitution, suggest it.

  Please organize your answer like this:
  - The correspondence table: about 200 words
  - Where the mapping breaks: about 250 words
  - What's being smuggled in: about 150 words
  - Does her conclusion survive?: about 150 words
  - A better analogy?: about 100 words

  No need for citations or reading lists — I'm writing this for people who don't have library access and I need to keep it self-contained.
