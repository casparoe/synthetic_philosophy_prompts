  The legality principle (*nullum crimen*) is often invoked as a monolith, but your team's friction stems from collapsing three distinct legal moves. First, retroactive crime creation (Aggressive War, Crimes Against Humanity) strikes the core of the principle: fair notice. Second, retroactive removal of a defense (Superior Orders) alters liability rules but does not create new prohibitions; the conduct was already wrongful, but the shield is removed. Third, jurisdictional innovation (International Court over Sovereigns) challenges sovereignty, not necessarily substantive criminal law. The legality principle bites hardest on the first. It bites softly on the second, provided the underlying act was criminal. It is largely silent on the third, which is a constitutional rather than penal question.

  Applying your ladder clarifies the gradient of retroactivity. War crimes sit on Rung 2: the conduct (murder, torture) was criminal domestically and under Hague/Geneva conventions, though the "international" label was new. Crimes Against Peace and Crimes Against Humanity occupy Rung 3: conduct was politically condemned (Kellogg-Briand Pact) or morally monstrous, but lacked clear codification as individual criminal liability. Conspiracy is Rung 4: a common law import alien to civil law defendants, covering conduct nobody had clearly condemned as criminal in that specific formulation. The ladder does real work here. It prevents the team from treating "War Crimes" and "Crimes Against Peace" as identical legal problems. It shows that while War Crimes are safe, Crimes Against Peace require a different justification, perhaps rooted in the inherent notice of violating sovereignty rather than statutory text.

  The swap test reveals the limits of legality, not necessarily its corruption. The Allies' immunity for area bombing and the Emperor's immunity fail the swap test. If the Axis had won, they would have prosecuted these acts. This asymmetry shows that tribunals are political artifacts. However, this does not invalidate the legality principle regarding the *defined crimes*. It shows that legality constrains the *application* of law, not the *selection* of defendants. The principle cannot fix political asymmetry; it only ensures that once selected, defendants are charged under intelligible rules. If your commission prosecutes only low-level actors while sparing architects, the swap test fails, but that is a political failure, not a legality failure. If you charge architects under retroactive laws, that is a legality failure.

  What does this show about the legality principle itself? It is an unanticipated case. The principle was designed to protect citizens from state power, ensuring a stable planning environment. It assumes a functioning state enforcing rules on subjects. It was not designed for state actors who *made* the law being held accountable by a successor regime or international body. In this context, "notice" is different. The defendants knew the moral weight, even if the statute was missing. This suggests the principle is silent here, not violated.

  Regarding the German postwar writer (Radbruch): arguing that extremely unjust statutes aren't law is a way of changing the subject. It shifts the debate from positivist legality (was there a law?) to natural law legitimacy (was the law valid?). This bypasses *nullum crimen* by denying the validity of the old regime's authorizations. It is useful for moral justification but legally circular regarding notice. It tells the defendant "you knew it was wrong," not "you knew it was illegal." For your commission, relying on Radbruch solves the moral problem but leaves the legality problem open. You cannot use natural law to satisfy a positivist requirement for pre-existing codes.

