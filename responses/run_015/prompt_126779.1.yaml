answer: |-
  ### Tutor's Preliminary Notes: Mapping the Logical Space

  Right, before we commit this to paper for the seminar, let's think through the topology of the problem. The causal exclusion argument isn't just a single argument; it's a pressure point that forces commitments in three distinct areas: metaphysics (what exists), causation (how things move), and identity (how things relate).

  Most handouts skip straight to "Are you a physicalist?" but that's too coarse. We need to isolate the *exclusion* problem specifically. That problem only arises if physical causal closure is robust *and* mental properties are distinct. If closure fails, the door is open for interactionism. If identity holds, the problem dissolves because there's only one cause to begin with. The tricky middle ground is non-reductive physicalism, where you want distinct properties without overdetermination. That's where the 'non-competitive' causation moves live (subset strategies, determinable/determinate relations, etc.).

  I've structured this tree to force students to pick a stance on closure *first*. That's the fine print most ignore. If they think closure is only synchronic, the exclusion argument loses its bite regarding diachronic causation. Also, I've ensured the questions avoid jargon like 'supervenience' or 'nomological sufficiency' so they answer based on intuition, then we slap the label on afterwards.

  Here is the draft for the handout.

  ***

  # Seminar Handout: The Causal Exclusion Decision Tree

  **Instructions:** Follow the path that matches your current philosophical commitment. Do not worry about the standard names yet; answer the questions as plainly as possible. At the end of each path, you will find the standard label for that position and its most difficult ontological cost.

  ### **Node 1: The Scope of Physical Closure**
  **Question:** When you look at the physical world, does the physical story fully explain every physical effect only within each single instant, or only when tracking changes across time?

  *   **A.** It explains changes across time (every physical effect has a sufficient prior physical cause). → *Go to Node 2.*
  *   **B.** It only fixes things within an instant (the physical story is incomplete across time). → *Go to Node 3.*

  ---

  ### **Node 2: The Mental-Physical Relation**
  *(Reached if you chose **A**: Physical closure holds across time.)*
  **Question:** Assuming the physical cause is sufficient, what is the mental cause in relation to it?

  *   **A.** They are literally the very same event, just described differently. → **Leaf 1**
  *   **B.** The mental event depends on the physical one but is a distinct property. → *Go to Node 4.*
  *   **C.** The mental event is a fundamentally separate substance or property entirely. → *Go to Node 4.*

  ---

  ### **Node 3: The Open Physical Story**
  *(Reached if you chose **B**: Physical closure is limited to synchronic slices.)*
  **Question:** If the physical story doesn't complete itself across time, what fills the gap?

  *   **A.** Mental states directly influence physical outcomes across time. → **Leaf 2**
  *   **B.** Nothing fills the gap; physical events are just probabilistic or uncaused across time. → **Leaf 3**

  ---

  ### **Node 4: Resolving the Competition**
  *(Reached if you chose **2B** or **2C**: Closure holds, but mental and physical are distinct.)*
  **Question:** Since the physical cause is already enough, what work is left for the mental cause to do?

  *   **A.** None; the mental cause is a by-product that does nothing. → **Leaf 4**
  *   **B.** Both the mental and physical causes fully bring about the effect independently. → **Leaf 5**
  *   **C.** They cause the effect together without competing (e.g., different levels or aspects). → **Leaf 6**

  ---

  ### **The Leaves: Positions and Costs**

  **Leaf 1: Reductive Physicalism (or Anomalous Monism)**
  *   *Awkward Commitment:* Mental properties lose any distinct reality, becoming merely alternative descriptions of physical machinery.

  **Leaf 2: Interactionist Dualism**
  *   *Awkward Commitment:* Physical conservation laws are violated because mental energy enters the physical stream from outside.

  **Leaf 3: Process Physicalism (or Causal Gappism)**
  *   *Awkward Commitment:* The physical world lacks deterministic continuity, making science's prediction of future states fundamentally limited.

  **Leaf 4: Epiphenomenalism**
  *   *Awkward Commitment:* Mental states are causally impotent shadows that cannot even explain why we talk about having them.

  **Leaf 5: Overdeterminationist Emergentism**
  *   *Awkward Commitment:* The universe relies on a massive, systematic cosmic coincidence where two causes always arrive at once.

  **Leaf 6: Non-Reductive Physicalism (Downward Causation)**
  *   *Awkward Commitment:* One must explain how distinct properties cause the same effect without violating the sufficiency of the physical base.

  **Leaf 7: Eliminativism about Mental Causation**
  *   *(Note: If at Node 4 you believe mental states simply do not exist.)*
  *   *Awkward Commitment:* Folk psychology is strictly false, and no one has ever actually acted for a reason.

  ---

  ### **Topological Flags & Fine Print**

  **1. Indistinguishable Leaves**
  *   **Leaf 4 (Epiphenomenalism)** appears whether you chose **Node 2B** (Realised properties) or **Node 2C** (Non-physical substance). Practically, the outcome is identical: the mental is causally inert. The ontology differs (properties vs. substances), but the causal exclusion result is the same.

  **2. Unoccupied or Incoherent Branches**
  *   **Identity + Overdetermination:** There is no leaf for "Token Identity" combined with "Overdetermination" at Node 4. This is logically incoherent; a single event cannot overdetermine itself.
  *   **Diachronic Closure + Token Identity:** This is **not** redundant. It is the standard physicalist solution (Leaf 1). It dissolves the exclusion problem rather than solving it, which is a distinct logical move from denying efficacy.
  *   **Synchronic Closure + Non-Competitive Causation:** This branch is largely empty. If closure is only synchronic, diachronic causation is already open; appealing to 'non-competitive' causation is unnecessary when there is no physical competitor across time.

  **3. The 'Exlusion' Note**
  *   You may have noticed the typo in your notes ('exlusion'). Rest assured, the argument remains equally exclusionary regardless of spelling, but do ensure your essays use the correct orthography to avoid distracting the examiner.

  ***

  **Tutor's Final Word:** Use this tree to locate your own view before the seminar. If you find yourself stuck at Node 4, option C, come prepared to defend how causation can be 'non-competitive' without slipping back into option A or B. That is where the real work lies.
