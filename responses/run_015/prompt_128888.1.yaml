  # JOINT STATEMENT ON THE SYMMETRIC SPLITTING CHAMBER
  **Adversarial Collaboration on the Foundations of Quantum Mechanics**

  **Signatories:**  
  The Everettian Decision-Theoretic Derivationist  
  The Objective-Measure Fundamentalist  

  **Date:** October 26, 2023  
  **Subject:** Formalization of Disagreement Regarding Probability in Branching Ontologies

  ## 1. Agreed Claims

  The undersigned parties, having engaged in adversarial collaboration centered on the Symmetric Splitting Chamber (SSC) scenario, affirm the following claims as the common ground of our dispute. These claims establish the formal and phenomenological constraints within which our disagreement arises.

  1.  **Unitary Formalism and Branching:** In the SSC scenario, a quantum system is prepared in an equal superposition of $2^n$ orthogonal states. Under the unitary formalism of quantum mechanics without collapse, the interaction between the system and the observer results in deterministic branching. This process produces exactly $2^n$ distinct physical copies of the observer, each coupled to one orthogonal branch. In this specific symmetric configuration, the Hilbert space norm (squared amplitude) associated with each branch is identical ($1/2^n$).
  2.  **Phenomenological Symmetry:** The phenomenological coupling strength is uniform across all $2^n$ copies. There is no internal subjective marker, sensory signal, or cognitive state available to any copy prior to measurement that distinguishes its branch from any other branch based on amplitude coefficients. From the first-person perspective of a pre-branching agent, all future copies are phenomenologically indistinguishable.
  3.  **The Explanandum:** Both parties agree that a complete physical theory must explain why a rational agent, anticipating branching in the SSC (and asymmetric generalizations thereof), should expect experienced frequencies of outcomes to match the Born rule ($|c_i|^2$) rather than a simple principle of indifference over the count of copies. While these values coincide numerically in the SSC ($1/2^n$), the principles diverge in asymmetric cases. The core demand for explanation is why the Hilbert space norm, rather than the count of phenomenologically identical copies, governs rational expectation.
  4.  **Status of No-Go Results:** Both parties agree that standard no-go results regarding deterministic branching establish that probability cannot be straightforwardly identified with frequency within a single branch, nor can it be derived from the bare Schrödinger equation without additional structural assumptions. These results establish the tension between deterministic ontology and probabilistic phenomenology but leave open whether the resolution lies in decision-theoretic constraints on agents or in primitive physical postulates regarding measure.
  5.  **Empirical Equivalence:** Both parties agree that, regarding all actual and hypothetical experimental outcomes within the SSC framework, the Decision-Theoretic Derivation and the Objective-Measure Fundamentalist position yield identical empirical predictions. The disagreement is strictly meta-physical and meta-rational, concerning the justification of the probability rule rather than the rule's numerical output.

  ## 2. Statement of Residual Disagreement

  While the parties agree on the formal setup and the empirical predictions, they disagree on the metaphysical and rational justification for the Born rule within the SSC framework. Each party accepts the following formulation as the accurate statement of their respective position.

  **The Decision-Theoretic Derivationist Position:**  
  Rational betting preferences applied to self-locating agents in a branching universe, when constrained by the structural symmetries of the Hilbert space and the diachronic consistency of agency, uniquely fix the Born measure ($|c_i|^2$) without circular presupposition of probability. In the SSC, the assignment of probability $1/2^n$ is not derived from counting copies but from the invariance of rational action under unitary transformations. The agent's uncertainty is self-locating, and the weights governing rational action are derived from the requirement that an agent's preferences remain coherent across branching events. Probability is emergent from rationality.

  **The Objective-Measure Fundamentalist Position:**  
  Arguments deriving the Born rule from decision theory necessarily smuggle in probabilistic utility weights unavailable in a purely deterministic branching ontology, thereby leaving the measure as primitive. In the SSC, the numerical match between copy count and Hilbert norm obscures the fact that without a prior postulate of measure, the natural default for phenomenologically identical copies is a uniform distribution based on branch count. Decision-theoretic axioms that rule out branch counting implicitly assume the very measure they purport to derive. Therefore, the Born measure must be posited as a fundamental physical quantity distinct from the count of observer copies. Probability is fundamental to the physics.

  ## 3. Cruxes and Conceptual Tests

  The following table identifies the specific conceptual cruxes separating the two positions. For each crux, we specify a concrete conceptual test grounded in the logic of the SSC, along with the predicted outcome for each side.

  | Crux | Conceptual Test | Derivationist Prediction | Fundamentalist Prediction |
  | :--- | :--- | :--- | :--- |
  | **Self-Locating Uncertainty** | **The Hamiltonian Knowledge Test:** Consider an agent in the SSC with perfect knowledge of the Hamiltonian and the state vector, but no prior probabilistic commitments. Can this agent derive unique betting odds solely from the geometry of the state space? | **Yes.** The geometry of the Hilbert space imposes rational constraints (e.g., equivalence of orthogonal rotations) that force the agent to adopt Born weights to avoid diachronic inconsistency. | **No.** Geometry alone yields only branch structure. Without a primitive measure linking geometry to expectation, the agent faces a trilemma: adopt branch counting, adopt arbitrary weights, or suspend judgment. |
  | **Principle of Indifference** | **The Copy-Indifference Test:** Does the Principle of Indifference apply to the *copies* of the observer (yielding $1/2^n$ by count) or to the *measure* of the observer (yielding $1/2^n$ by norm)? | **To the Measure.** Indifference over copies is ill-defined because "copy count" is not a robust invariant in Hilbert space (e.g., under basis changes). Only measure is invariant. | **To the Copies.** In the SSC, copies are the ontological primitives of experience. Indifference over copies is the default rational stance; the fact that it matches the norm is a contingent feature of the symmetric preparation. |
  | **Circularity of Axioms** | **The Axiom Independence Test:** Can the decision-theoretic axioms (e.g., Branching Indifference, Diachronic Consistency) be stated without implicitly invoking probabilistic concepts? | **Yes.** The axioms are purely about preference orderings and structural symmetries. Probability enters only at the end as a representation theorem. | **No.** Axioms like "Branching Indifference" presuppose that branching *per se* does not matter, which implicitly assumes the weights are already fixed by the norm, not the branching event. |

  ## 4. Classification of Disputes

  To ensure future dialogue remains productive, the parties classify the remaining disagreements as follows:

  **Substantive Disputes:**
  *   **The Ontology of Measure:** Whether the Born measure is a derived feature of rational agency within a branching structure or a primitive physical postulate required to make sense of that structure.
  *   **The Validity of Branch Counting:** Whether "counting branches" is a coherent concept that serves as a valid null hypothesis for rational expectation, or whether it is a category error in continuous Hilbert space.
  *   **The Source of Normativity:** Whether the normativity governing quantum expectations arises from the requirements of rational consistency (Derivationist) or from the physical facts of the wavefunction's measure (Fundamentalist).

  **Verbal Disputes:**
  *   **Definition of "Probability":** The Derivationist tends to define probability functionally (as that which guides rational betting), while the Fundamentalist tends to define it ontologically (as a physical propensity or measure). Both parties acknowledge that clarifying this definition does not resolve the substantive dispute regarding *why* the functional role is filled by the Hilbert norm.
  *   **Meaning of "Derivation":** The parties use "derivation" differently. The Derivationist means "derivation from non-probabilistic rationality axioms." The Fundamentalist means "derivation from physical dynamics alone." Both agree that neither has achieved a derivation in the other's sense.

  **Signatures:**

  _________________________  
  *Everettian Decision-Theoretic Derivationist*

  _________________________  
  *Objective-Measure Fundamentalist*
