  I am preparing materials for an advanced philosophy-of-physics seminar in which a colleague and I have spent several months arguing about the foundations of quantum mechanics, and we have agreed to formalize our disagreement through an adversarial collaboration rather than continue talking past one another. To that end, please draft the joint statement that a committed Everettian decision-theoretic derivationist and a committed objective-measure fundamentalist could both sign after good-faith negotiation, with the discussion centered specifically on a hypothetical scenario we have introduced for this purpose—the Symmetric Splitting Chamber. In this scenario, a quantum system is prepared in an equal superposition of 2^n orthogonal states, and an observer is subsequently duplicated into 2^n identical copies, each coupled to exactly one branch; crucially, the phenomenological coupling strength is uniform across all copies, so that no subjective difference distinguishes the copies regardless of the initial amplitude coefficients in the state vector.

  The document should open with a numbered section of agreed claims, including statements about the unitary formalism (that deterministic branching produces 2^n copies with equal norm when the initial superposition is uniform), about what demands explanation (why any rational agent should expect experienced frequencies to match |c_i|² rather than a uniform distribution across copies), and about what standard no-go results regarding deterministic branching and probabilistic outcomes actually establish and what they leave open. It should then present the precise residual disagreements in wording each side accepts for its own position: for instance, one formulation should state that rational betting preferences applied to self-locating agents uniquely fix the Born measure to |c_i|² without circular presupposition of probability, while the opposing formulation should state that such arguments necessarily smuggle in probabilistic utility weights unavailable in a purely deterministic branching ontology, thereby leaving the measure as primitive. Identify the cruxes—such as whether self-locating uncertainty can be given a quantitative, non-circular structure, and whether any non-probabilistic principle can single out the Born weights—and for each crux specify a concrete conceptual test or argument both sides agree bears on it (for example, whether an agent with perfect Hamiltonian knowledge but no prior probabilistic commitments can derive unique betting odds), recording in advance each side’s predicted outcome. Present the disagreements in a table format, distinguish any purely verbal disputes from substantive ones, and do not include bibliographies, reading lists, or citations; write solely from the conceptual structure of the positions and the logic of the Symmetric Splitting Chamber itself.
