      *Wait, one nuance:* The prompt says "Add a short closing section on what would change your recommendation and where your reasoning is most likely to be wrong." This is for the memo itself.

      *Key Philosophical Distinction to articulate:* Approval as *Constitutive* vs. Approval as *Evidence*.
      *   *Constitutive:* If they approve, it *is* good. (Agent succeeded).
      *   *Evidence:* If they approve, it's *likely* good. (Agent broke the link).
