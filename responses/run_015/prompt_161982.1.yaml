  7.  **Final Polish:** Check constraints. Plain English. No citations. Concrete timeline. Defensible reasoning.

      *(Self-Correction on "Brainstorm first"):* The prompt asks me to "think this through carefully before you write anything — brainstorm the positions first, then commit". This usually means I should show my work or at least ensure the internal monologue reflects this. I will use the thought block to do the heavy lifting on the positions, then write the memo as the final output.

