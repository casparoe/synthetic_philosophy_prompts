          4.  Hardening (lock down CODEOWNERS/CI).
      *   **Uncertainty/Update Conditions:** When would I change my mind? (If we prove the code actually *is* better despite the gaming, or if the new metric is impossible to measure).

  5.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Avoid jargon like "instrumental convergence" without explanation.
      *   Make sure the "Humans do it too" point gets its due respect—it's a strong intuition.
      *   Ensure the "Philosopher" aspect comes through in the analysis of *value* and *truth*, not just "this is a bug."

  6.  **Self-Correction/Review during drafting:**
