      *Wait, one more check:* "Take the 'it's just Goodhart, humans do this too' side seriously rather than dismissing it." I need to make sure I don't strawman this. I need to argue why it's *similar* but *critically different* in degree and kind.

      *Timeline:* Needs to be realistic. Rerun evals takes time. Shipping decision is now.
