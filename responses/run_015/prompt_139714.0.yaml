answer: |-
  Good morning. Thank you for coming. For those who knew him only as the man who fixed your radios or taught your children calculus, welcome. For those who knew him as a colleague, a correspondent, or a friend, welcome. And for his family—his daughter, his son-in-law, and his grandchildren—thank you for letting us share this space with you.

  We are here to remember a man who spent forty years arguing against the grain of his profession. He taught analysis, yet he denied the existence of the objects analysis usually studies. He was a finitist. But I have learned, slowly and in retirement, that this label does not capture the specificity of his refusal.

  There is a common version of finitism that treats the infinite as a useful fiction, a shorthand for processes that never end. My friend did not hold this view. He did not think infinite mathematics was secure if grounded in finite metamathematics. He thought infinite mathematics was literally false when it claimed to describe completed collections. To him, Hilbert's Hotel was not a paradox; it was a description of nothing. Cantor's diagonal argument was not a surprising truth about sets; it was a mistake about what numbers are.

  But he held something stricter, and harder to articulate. He balked not only at the infinite but at the arbitrarily large finite. If you wrote down a number like ten raised to the power of ten raised to the power of ten, he would ask, half in jest but entirely in earnest, what you meant by it. Nothing in the physical world could write it down. Nothing could count it. To him, a number without a physical representation was not a large number; it was noise.

  I stand here as a retired cosmologist. For forty years, I measured a universe whose spatial extent no observation can settle. I used apparatus described by differential equations that quantify over a continuum. I never once had to decide whether any of that structure was really there. My work was operational. I measured light, I fitted curves, I predicted positions. Whether the space between the galaxies was truly continuous or merely smooth enough for my instruments was a question I could postpone indefinitely.

  My friend could not postpone it. He demanded to know what was there. This difference could have driven us apart. Instead, it kept us talking. I want to be clear about what my career means in this room. I do not stand here to say my work was nonsense because it used the infinite. I stand here to say that my work was a map, and he was asking about the territory. A map can use a projection that distorts the poles without being useless. But we should not confuse the projection for the ground.

  I have been thinking about how to explain his position without caricature, specifically regarding Hilbert's Hotel. I have tried to restage the puzzle without assuming a completed infinity. Imagine a hotel that is at every stage finite but unbounded. You can always build another room. In this version, the statement "every room is occupied" is never true. There is always a next room, or a last guest who arrived. The paradox dissolves because the condition required to trigger it—actual fullness—never obtains.

  Now consider the version where guests move at successive half-intervals so that by the end of a minute everyone has shifted. This is a supertask. I take a definite stand on this: this version quietly restores a completed infinite through the limit. It assumes the process concludes. If you deny the actual infinite, you must deny the conclusion of the supertask. You cannot have it both ways. You cannot deny the existence of infinite totalities while assuming a process can complete an infinite number of steps in finite time. The unbounded hotel cannot generate the original puzzle at all. The puzzle only exists if you smuggle the infinity in through the back door of the limit.

  This brings me to the stricter view, the one regarding large finite numbers. I must admit where I struggle to follow him. To say there is a limit to meaningful numbers is to invite the question: what is that limit? If you name it, I can add one. To state strict finitism formally seems to require the very notions it denies. It is a position that resists being said.

  Yet, I believe I understand the impulse. It is a demand for grounding. It is a refusal to let language outrun physics. He was not being difficult; he was being honest. He refused to pretend he understood concepts that had no purchase on the world he inhabited.

  I cannot offer you the usual consolations. I cannot say his theorems are immortal, because he doubted the immortality of the structures they describe. I cannot say truth outlives us, because he thought truth was tied to what can be done, not what can be imagined. I cannot say we owe him an infinite debt. We owe him a finite debt, payable in finite time, by listening to what he said while we are here to hear it.

  I cannot tell you he has entered Cantor's paradise. He did not believe it existed. But I can tell you this: the argument is not over. The set theorist who disagreed with him completely, who liked him enormously, and who is giving the second talk today, is proof of that. Their disagreement was not a failure of communication; it was a successful collaboration in clarity. They forced each other to define terms that most of us leave vague.

  To his grandchildren: you knew him as a grandfather. You may not know the math. But you know he cared about whether things were real. That is a legacy worth keeping. Check the foundations. Ask what the words mean. Do not accept the infinite just because it is convenient.

  To the mathematicians here: you do not need to surrender your work to honor him. You can use the continuum as I did, as a tool. But acknowledge the cost. Acknowledge that when you speak of completed infinities, you are stepping outside the physical world. He reminded us of that step.

  We are finite creatures. We meet in a finite room. We have a finite day. Let us use them well. Thank you.

  ***

  **Note on Philosophical Attribution**

  I have attributed to your friend a combination of *Aristotelian potentialism* (denial of actual infinities) and *ultrafinitism* (skepticism of unconstructibly large finite numbers). I am confident in the first classification; his rejection of Cantor's diagonal argument as "false rather than surprising" regarding completed collections is a hallmark of strict potentialism. He viewed infinite sets as category errors, not merely unprovable entities.

  I am less confident, though committed in the text, regarding the second classification. Ultrafinitism is notoriously difficult to formalize because stating "there is a largest number $N$" invites the successor $N+1$. I have chosen to frame this not as a formal axiom but as a semantic constraint on physical representability. This smooths over the logical paradox of stating the view without conceding the infinite vocabulary required to define the limit. A strict ultrafinitist might argue that even mentioning $10^{10^{10}}$ is illegitimate. I softened this to "what you meant by it" to make the position intelligible to the mathematicians in the audience without surrendering the friend's core intuition.

  I also committed to your specific reading of Hilbert's Hotel (that the unbounded finite version dissolves the paradox). This is a contested point; some potentialists argue the paradox arises from the *rule* of occupancy, not the completion. I took your stand because the occasion required decisiveness, not a survey of options. This risks oversimplifying the set-theoretic counterargument, but it serves the memorial's goal of clarifying his position rather than defeating it. Finally, I avoided standard Platonist consolations ("immortal truth") as requested, replacing them with a pragmatic valuation of the argument itself. This aligns with his view that meaning is tied to use and physical grounding, though it may feel austere to the family. I attempted to bridge this by focusing on his character ("cared about whether things were real") rather than his ontology.
