  The faculty meeting had adjourned, but Professors Jones and Smith remained in the seminar room, the air still thick with the smoke of a failed motion to remove the Department Chair. Smith, who had quietly orchestrated the rebellion, was packing his briefcase with an air of serene ambiguity.

  Jones, a colleague of scrupulous logical hygiene, leaned against the doorframe. "I must confess, Smith, your diplomatic strategy today was perplexing. To the Chair, you insisted: 'If I did not organize this motion, someone else did.' Yet, to the rebels, you claimed: 'If I had not organized this motion, no one else would have.'"

  Smith paused, adjusting his spectacles. "I see no contradiction, Jones. Merely a shift in mood."

  "It implies opposite causal structures," Jones countered. "The first suggests the dissent was inevitable; you are replaceable. The second suggests the dissent was contingent on your agency; you are indispensable. You cannot be both the spark and the mere conduit."

  "On the contrary," Smith replied, snapping his briefcase shut. "I am exploiting the divergence in evaluation procedures. When I spoke to the Chair, I used the **indicative**. We both know the motion *was* filed. That is a fixed fact of the actual world. To evaluate 'If I didn't do it, someone else did,' we update our belief set with the antecedent 'Smith didn't do it' while holding the fact 'The motion was filed' constant. Given the evidence, the only rational update is that another conspirator exists. I am exculpated by the necessity of the outcome."

  Jones frowned. "And the rebels?"

  "To them, I used the **counterfactual**," Smith continued. "Here, we do not hold the outcome fixed. We select the nearest possible world where the antecedent 'Smith organizes the motion' is false. In that world, we hold fixed my unique influence and the department's general apathy, but we do not hold fixed the filing of the motion. In that nearby world, the motion never materializes. I am vindicated by the contingency of the cause."

  Jones stared at him. "So, to the Chair, you argue that the department is so rotten the motion was inevitable. To the rebels, you argue the department is so loyal the motion was impossible without you."

  "Precisely."

  "That is morally repugnant," Jones said.

  "Perhaps," Smith replied, moving toward the exit. "But semantically impeccable. Now, if you'll excuse me, I must ask the Chair for a raise."

  Jones blinked. "On what grounds? You just admitted to him the dissent was inevitable without you."

  "No," Smith said, pausing at the threshold. "I shall tell him: 'If I am not given a raise, morale will collapse.' That is an indicative. We know morale is currently stable. If we update on 'No raise,' we must infer a new cause for the coming collapse—perhaps *your* administration, Chair. But if I say, 'If I *had not* been given a raise, morale *would have* collapsed,' that is a counterfactual. It suggests my current salary is the only thing holding the department together. I haven't decided which to use yet. I'm waiting to see which world is nearer."
