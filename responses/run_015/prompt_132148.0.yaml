          *   *Critique:* **Major Error.** This conflates the relational/indexical solution (adverbialism or relationalism) with the temporal parts solution. Lewis explicitly argues they are *not* equivalent. For Lewis, perdurantism solves it by having distinct entities bear the properties simply. Endurantism via indexing changes the nature of the property (making it relational). Lewis argues this denies that properties are intrinsic. The student claims they are "essentially equivalent," which misses the core metaphysical disagreement Lewis highlights in *On the Plurality of Worlds*.

