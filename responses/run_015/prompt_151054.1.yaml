answer: |-
  The distinction your friend draws—between "mood-based" welfare (salmon/mammals) and "short-loop" welfare (shrimp)—is not merely academic; it fundamentally alters the arithmetic of your protocol. If shrimp experience only discrete episodes of valenced sensation without anticipation or memory, the geometry of their suffering is different. It is not a deep, accumulating pool of distress, but a rapid flickering of light and dark. However, because you harvest dozens to hundreds of animals per kilogram, the *aggregate* flicker can outshine the steady gloom of a single fish.

  Here are the implications for your protocol, structured by the specific tensions you identified.

  ### 1. The Currency of the Protocol
  You must reject **per kilogram** as your primary ethical currency. A protocol written per kilogram implicitly treats 1 kg of salmon as ethically equivalent to 1 kg of shrimp. Given your numbers, 1 kg of shrimp represents roughly 100 to 200 distinct centers of potential experience, whereas 1 kg of salmon is less than one. If you optimize for welfare per kilogram, you are incentivized to harvest smaller shrimp (more animals per kg) or increase density, which could catastrophically increase aggregate suffering.

  However, **per animal** is operationally difficult for enforcement across millions of individuals. **Per dollar** is ethically bankrupt in this context, as it allows cost to cap welfare.

  **Recommendation:** The protocol should be written in **aggregate suffering-time per batch (pond)**, operationalized as **welfare incidents per animal**.
  *   **Why:** This forces you to multiply the intensity and duration of any negative event by the number of animals exposed to it. A water-quality failure in a pond of 100,000 shrimp is not one "incident"; it is 100,000 simultaneous episodes of discomfort. This currency respects the "short-loop" hypothesis (counting the episodes) while acknowledging the scale of your operation. It prevents the "hidden math" of high-density farming from obscuring the total welfare load.

  ### 2. Growing Period vs. Handling and Slaughter
  If the short-loop hypothesis is correct, the weight shifts **away from psychological stressors and toward physical noxious stimuli.**
  *   **Growing Period:** For a salmon, crowding causes anxiety that persists for days. For a short-loop shrimp, crowding only matters if it causes physical irritation (abrasion, oxygen depletion, ammonia burn). Therefore, you should prioritize **water chemistry and physical space** over "enrichment" or social considerations. Chronic poor water quality is a continuous stream of short-loop pain; this remains a high priority, but not because the shrimp are "depressed," but because their gills are constantly irritated.
  *   **Slaughter:** This becomes disproportionately critical. If shrimp do not anticipate death, there is no "fear of slaughter" during transport. However, the *moment* of slaughter is a high-intensity pain event. Ice slurry induces thermal shock and asphyxiation. Under the short-loop model, this is a sharp, intense spike of suffering. Because there is no "mood" to overshadow it, the purity of this final moment matters immensely.
  *   **Electrical Stunning:** Is it worth the cost? **Yes.** Even under the short-loop hypothesis, rendering the animal insensible *before* the thermal shock eliminates the most intense episode of pain in its life. Since there is no anticipation, you do not need to stun them days in advance; immediate pre-slaughter stunning is sufficient. Given the high number of animals, the aggregate reduction in "pain-seconds" is massive. The cost is justified by the elimination of the single most intense suffering event per animal, multiplied by millions.

  ### 3. Broodstock vs. Grow-out
  This is a tension between **intensity** and **scale**.
  *   **Broodstock:** Eyestalk ablation is an invasive, painful procedure that induces chronic physiological stress. Even under the short-loop hypothesis, this is a repeated, high-intensity negative episode lasting months.
  *   **Grow-out:** The conditions here may be lower intensity per animal but apply to orders of magnitude more individuals.
  *   **Weighing:** You cannot ignore the broodstock, but the protocol must prioritize the **aggregate**. If you perfect the broodstock welfare but maintain poor water quality in the ponds, the net suffering is higher in the ponds. However, because you buy post-larvae, you have leverage. The protocol should require a **phase-out plan for eyestalk ablation** in your supply chain. You should weigh this heavily not because the numbers are high, but because the *intensity* of ablation is arguably higher than standard grow-out irritation, and it sets an ethical baseline for your product. Do not let the small numbers hide the severity of the procedure.

  ### 4. Trade-offs: Mortality, Duration, and Substitution
  This is the most complex ethical terrain.
  *   **Mortality vs. Duration:** Standard agriculture views mortality as a loss. In welfare terms, if a shrimp's life is net negative (more pain than pleasure), **reducing mortality increases total suffering** by keeping more animals in existence longer. If life is net positive, reducing mortality is good. Since we do not know the baseline "hedonic tone" of a shrimp's life, you should not commit to mortality reduction as a welfare good *in itself*. Instead, frame it as **reducing premature death due to noxious conditions**.
  *   **Price and Substitution:** If your protocol raises costs and buyers switch to wild-caught shrimp or another species, you may have exported suffering. Wild-caught shrimp often die slowly in nets or on ice without stunning, and bycatch mortality is high.
  *   **Strategy:** Your protocol must include a **market-impact assessment**. If a welfare intervention raises the price by >5%, you must evaluate whether the buyer will switch to a lower-welfare source. If they will, the intervention may be ethically counterproductive. You are responsible for the suffering *you cause*, but you are also responsible for the suffering you *displace* if your product leaves the market.

  ### 5. Acting Under Uncertainty
  Your friend's hypothesis is contested. Shrimp may have richer inner lives than she allows.
  *   **The Precautionary Principle:** You must act as if the **mood hypothesis is true** while planning for the **short-loop hypothesis**.
  *   **Robust Interventions:** Prioritize changes that improve welfare under *both* models. Good water quality reduces physical irritation (short-loop) and psychological stress (mood). Gentle handling reduces physical damage (short-loop) and fear (mood).
  *   **Avoid "Short-Loop Only" Traps:** Do not assume that because they might not remember pain, you can inflict it repeatedly. A million moments of pain are still a million moments of pain.

  ### Recommended Protocol Requirements

  Based on this analysis, here are the three changes your protocol should require first, in order of priority:

  1.  **Water Quality and Physical Irritants (The "No-Regrets" Baseline)**
      *   **Requirement:** Strict limits on ammonia, nitrite, and dissolved oxygen, coupled with maximum stocking densities based on *biomass per cubic meter* rather than just survival rates.
      *   **Reasoning:** This addresses the "short-loop" continuous irritation (gill burn) and the "mood" stress of crowding. It improves growth rates (economic benefit) and welfare (ethical benefit). It is the most robust intervention under uncertainty.

  2.  **Pre-Slaughter Insensibility (The High-Impact Event)**
      *   **Requirement:** All shrimp must be rendered insensible (via electrical stunning or rapid thermal shock *before* the ice slurry) prior to death.
      *   **Reasoning:** Slaughter is the highest intensity pain event. Whether they anticipate it or not, preventing the sensation of freezing/asphyxiation eliminates the worst "loop" of their lives. Given the numbers, this yields the highest aggregate welfare gain per dollar spent.

  3.  **Supply Chain Verification (The Ethical Floor)**
      *   **Requirement:** Disclosure of broodstock practices from your post-larvae supplier, with a commitment to transition to non-ablated stock within 3 years.
      *   **Reasoning:** You cannot claim a welfare protocol while sourcing from a system that relies on invasive mutilation. This manages the "intensity" side of the equation and protects your brand reputation.

  **The Commitment to Approach with Reluctance:**
  You should be most reluctant to commit to **Stocking Density Reductions** (specifically, lowering numbers significantly below industry standard for growth) while the science remains unsettled.

  *   **Reasoning:** If the "short-loop" hypothesis is correct, shrimp do not suffer from "crowding" in a psychological sense; they only suffer from physical contact or water degradation. If you can maintain perfect water quality at higher densities, the welfare cost under the short-loop model is low. However, reducing density drastically cuts your yield and raises your price. This triggers the **Substitution Risk**: if your shrimp become too expensive, buyers may switch to wild-caught or cheaper farmed species with worse welfare standards.
  *   **Why Reluctance?** This is the variable most dependent on the "mood" hypothesis. If shrimp *do* have moods, density is critical. If they *don't*, density is primarily an economic constraint. Committing to low density is a high economic risk for a welfare gain that is theoretically uncertain. Instead, focus on **Water Quality per Density**—allow higher density only if water quality metrics are perfect. This hedges your bet: if they have moods, the good water mitigates some stress; if they don't, you avoid the economic crash that would outsource the suffering.
