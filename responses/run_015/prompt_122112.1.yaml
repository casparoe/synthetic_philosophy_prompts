  To: Honorary Degrees Committee
  From: Sarah J., Committee Chair
  Date: Oct 24, 2023
  Subject: Draft Rec for Vasquez Nomination – Please Review

  Hey team,

  Following up on our last discussion regarding Dr. Elena Vasquez and the Project Sentinel nomination. I know there's a lot of heat on this one, and I've spent the weekend wrestling with the arguments from both the student coalition and the Board liaisons. Below is my draft recommendation for the vote next month. I want us to be aligned before we walk into that room.

  **Recommendation:** Reject Nomination

  **Reasoning:**
  I know the Board's position is strong on paper. They're leaning hard on the Doctrine of Double Effect—the idea that Vasquez intended to target combatants, and the 47 civilian deaths were unintended side effects, tragic but morally distinct from the mission. They also use the "bridge engineer" analogy: an engineer isn't culpable if a bridge collapses due to unforeseen stress, so why is Vasquez culpable for algorithmic errors?

  We need to address this head-on, not just wave it away with policy. Here's why that argument doesn't hold water for us:

  The bridge analogy fails because a bridge is designed *not* to collapse. Civilian death in an autonomous strike isn't a material failure like a snapped cable; it's a statistically accepted variable in the efficiency calculus. When you design a targeting system, you aren't hoping for zero collateral damage in the same way a civil engineer hopes for zero collapses; you are accepting a certain error rate as the cost of operational speed. That shifts the civilian deaths from "unintended side effects" to "known costs of doing business."

  Anscombe's point about Truman stands here. She argued that you can't sanitize mass killing by calling it "policy" or "strategy." The students are right that the algorithmic layer doesn't erase agency; it just buries it. If we award this degree, we are signaling that technical distance equals moral innocence. We can't recieve that kind of signal as an institution dedicated to humanistic inquiry.

  **Timeline:**
  I propose we hold the vote at the November 15th committee meeting. This gives us time to circulate this reasoning to the Board beforehand so the rejection doesn't come as a shock, but keeps us moving before the spring semester protests escalate.

  **Next Steps:**
  If we move to reject, I suggest we immediately pivot to updating our nomination criteria. We need a formal ethical impact review for any nominee involved in dual-use technology. This isn't about banning tech leaders, but about ensuring we understand the downstream effects of their work before we honor them.

  Let me know if you have edits. I want this tight.

  Thanks,
  Sarah

