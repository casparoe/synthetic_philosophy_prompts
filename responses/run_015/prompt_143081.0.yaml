prompt: |-
  I'm writing from a hospital bed, so let me be brief about the personal part: I'm a final-year PhD candidate in philosophy, and since last spring I have had a treatment-refractory neuropathic pain condition that has not responded to the three medication classes we have tried. My topic is no longer abstract for me. In two weeks I present the third chapter of my dissertation to the Bioethics Center seminar, and I need Q&A preparation, not encouragement.

  The chapter defends a deliberately narrowed version of the abolitionist project sometimes called the hedonistic imperative. Four moves, in order.

  First, a scope restriction. I am not talking about pain, grief, effort, or the ordinary discomfort of a hard project. I restrict the claim to what I call the refractory floor: sustained states that are unresponsive to any available intervention and that globally degrade the subject's capacities.

  Second, the priority claim: when we are choosing among welfare-affecting interventions, raising the floor dominates raising the ceiling. I do not argue this from diminishing marginal welfare; that argument is in the literature and I set it aside. I argue it from what I call the erosion reply: the states at the refractory floor degrade the very capacities on which our standard objections to intervention depend — the capacity to form and revise preferences, to integrate an experience into a narrative, to refuse on reflection, to take up a reason. So the objections available higher up the scale (that the subject must consent, that the suffering is meaning-constitutive for them) are self-undermining exactly where my claim bites.

  Third, a criterion for distinguishing abolition from obliteration, which I call the aim-integrity test: an intervention is admissible only if the agent's standing aims survive it in the counterfactual sense that, under the intervention, the agent would still revise their aims in response to reasons roughly as they would have done had the pain simply been absent. This is meant to be what separates my view from wireheading.

  Fourth, because the erosion reply cuts against ordinary consent-gating, I propose replacing informed consent as the gate for this population with an advance-authorization protocol: the patient authorizes in a lucid period, authorization lapses unless re-affirmed at scheduled windows, and revocation takes effect immediately with no requirement that the patient give a good reason.

  The audience. Two senior scholars from disability studies and medical humanities who hold the social model and are alert to medicalization and to the expressive force of a research program like mine. Three clinicians: a palliative care physician, an interventional pain physician, and an addiction psychiatrist, who think in functional outcomes, iatrogenesis, tolerance, adaptation, and adherence. Two philosophers: a welfare pluralist with narrative-identity sympathies, and someone who works on autonomy and informed consent. A health lawyer chairs. A chronic-pain patient representative from the center's advisory board will be in the room and will be given the first question.

  What I want is the prep sheet I would get from someone who has watched this exact room tear apart a speaker. Ten to twelve objections, most damaging first — rank by damage, meaning how much of the chapter falls if I cannot answer it, not by how likely the question is. Phrase each objection in the idiom of the person raising it: the clinicians should sound like clinicians, the disability scholars like disability scholars, the philosophers like philosophers. Assume I have already dispatched the greatest hits — the experience machine, wireheading, the repugnant conclusion, suffering as a spur to achievement — and do not spend rows on them; I have answers to those and they are in the chapter. Do not give me reading lists or citations; I cannot reach the library from here and I am not going to chase references.

  Deliver the prep sheet as a markdown table with exactly these columns: rank (integer, most damaging first); constituency (which of the groups above); objection_as_they_would_phrase_it (two or three sentences in that person's own idiom); target (which of my four moves it strikes: scope restriction, priority claim, erosion reply, aim-integrity test, advance-authorization protocol); force (integer 1 to 5, how much of the objection is simply right); reply (what I say in about ninety seconds, in my voice, not in yours); soft_spot (where that reply is thinnest and what the follow-up question will be); concession (one of concede_outright, concede_in_part, hold_the_line).

  After the table, a single JSON object with these keys: up_front_concessions (array of strings, what I concede in the first two minutes before anyone attacks); reply_that_must_land (string: the one reply without which the chapter does not survive the hour); hope_nobody_asks (object with keys objection, why_it_is_worst, what_I_say_if_it_comes); objection_that_is_actually_right (object with keys objection, why_it_is_right, what_I_should_do_instead); and cut_from_the_talk (string: the one thing I should drop to make room).

  Be committed rather than even-handed. Tell me plainly which of these objections you think is correct and where you think my erosion reply is confused, and do not soften it into a survey of what someone might say. If you think the chapter's real problem is a move I have not listed, say that too.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Final-year PhD candidate in philosophy, currently hospitalized with treatment-refractory neuropathic pain.
      *   **Task:** Create a Q&A preparation sheet for a dissertation chapter defense at a Bioethics Center seminar.
      *   **Topic:** A narrowed version of the abolitionist project (hedonistic imperative), focusing on the "refractory floor" (unresponsive, capacity-degrading pain).
      *   **Four Moves:**
          1.  Scope Restriction (Refractory Floor).
          2.  Priority Claim (Raising the floor dominates raising the ceiling, via the "Erosion Reply").
          3.  Aim-Integrity Test (Distinguishing abolition from wireheading).
          4.  Advance-Authorization Protocol (Replacing informed consent for this population).
      *   **Audience:**
          *   2 Senior Scholars (Disability Studies/Medical Humanities, Social Model).
          *   3 Clinicians (Palliative, Pain, Addiction).
          *   2 Philosophers (Welfare Pluralist/Narrative, Autonomy/Consent).
          *   1 Health Lawyer (Chair).
          *   1 Patient Representative (First question).
      *   **Format:**
          *   Markdown Table (Rank, Constituency, Objection, Target, Force, Reply, Soft Spot, Concession).
          *   JSON Object (up_front_concessions, reply_that_must_land, hope_nobody_asks, objection_that_is_actually_right, cut_from_the_talk).
      *   **Tone:** Committed, not even-handed. Plain about where the argument is weak. No encouragement, no reading lists.
      *   **Constraints:** 10-12 objections, ranked by damage. Idiom-specific objections. 90-second replies.
      *   **Context:** User is in a hospital bed, needs brevity and precision.

  2.  **Deconstruct the Argument & Identify Vulnerabilities:**
      *   *Move 1 (Scope):* Defining "refractory" is medically tricky. Who decides?
      *   *Move 2 (Priority/Erosion):* The claim that pain degrades capacities necessary for objection is strong but risks paternalism. Does it undermine *all* objection or just specific ones?
      *   *Move 3 (Aim-Integrity):* How do we measure "counterfactual aim revision"? This seems epistemically inaccessible.
      *   *Move 4 (Consent):* Advance authorization lapsing unless reaffirmed is dangerous. What if the pain prevents reaffirmation? Revocation without reason risks instability.

  3.  **Drafting Objections (Iterative Process):**
      *   *Need 10-12.*
      *   *Need to rank by damage.*
      *   *Need specific idioms.*

      *   *Objection 1 (The Killer):* The Consent/Authority problem. If pain erodes capacity, who decides the pain is eroding capacity? The patient can't (eroded), the doctor might be wrong. This strikes Move 4 and Move 2.
      *   *Objection 2 (Disability Studies):* The definition of "refractory" medicalizes suffering. Social model says suffering is often social/environmental, not just neural.
      *   *Objection 3 (Clinician - Pain):* "Refractory" is a moving target. New interventions emerge. Declaring something refractory closes the door on future innovation.
      *   *Objection 4 (Philosopher - Autonomy):* The Erosion Reply is self-referentially defeating. If capacity is eroded, how can the Advance Authorization be trusted?
      *   *Objection 5 (Clinician - Addiction):* The Aim-Integrity test looks like addiction maintenance. Chasing relief vs. living well.
      *   *Objection 6 (Philosopher - Narrative):* Pain is constitutive of narrative even when refractory. Removing it changes the subject, not just the state.
      *   *Objection 7 (Patient Rep):* Lapsing authorization. What if I'm too tired to reaffirm? Do I lose protection?
      *   *Objection 8 (Lawyer):* Liability. Who is liable when the protocol fails? The advance directive vs. current state.
      *   *Objection 9 (Disability Studies):* "Capacity degradation" is ableist. It assumes a specific mode of cognition is required for moral standing.
      *   *Objection 10 (Clinician - Palliative):* Total abolition vs. management. Abolition might require doses that kill (double effect).
      *   *Objection 11 (Philosopher - Welfare):* Priority claim ignores adaptation. People adapt to refractory pain.
      *   *Objection 12 (General):* The "Refractory Floor" is empirically unstable.

      *Refining Rank:* The consent/authority paradox (Move 4 + Move 2) is the most damaging because it undermines the mechanism of implementation. The Disability Studies critique on "capacity" (Move 2) is next because it attacks the moral foundation. The Clinical definition of "refractory" (Move 1) is third because it makes the scope impossible to define.

  4.  **Drafting Replies:**
      *   Must be in the user's voice (philosophical, precise, defending the core thesis).
      *   Must be ~90 seconds spoken (approx. 150-200 words).
      *   Must acknowledge soft spots.

  5.  **Drafting JSON:**
      *   *up_front_concessions:* Acknowledge the difficulty of defining "refractory," acknowledge the risk of paternalism.
      *   *reply_that_must_land:* The Erosion Reply needs to hold. If capacity is gone, standard autonomy arguments fail.
      *   *hope_nobody_asks:* The epistemic access problem (How do we know the counterfactual aims?).
      *   *objection_that_is_actually_right:* The definition of "refractory" is medically unstable.
      *   *cut_from_the_talk:* The specific mechanics of the lapsing authorization (too much detail, too vulnerable).

  6.  **Review against Constraints:**
      *   Markdown table? Yes.
      *   Exact columns? Yes.
      *   JSON object after? Yes.
      *   10-12 objections? Yes.
      *   Ranked by damage? Yes.
      *   Idiom-specific? Yes.
      *   No encouragement? Yes.
      *   Committed tone? Yes.

  7.  **Final Polish:**
      *   Ensure the "Force" rating reflects my assessment of the objection's validity.
      *   Ensure the "Concession" strategy is realistic.
      *   Check the "User Voice" in replies – needs to sound like a philosopher defending a specific technical claim, not a patient pleading for help (though the experience informs it).
      *   *Self-Correction on Tone:* The prompt asks me to be "committed rather than even-handed" and tell them plainly where the erosion reply is confused. I need to make sure the "Force" and "Soft Spot" columns reflect genuine vulnerability, not just debate tactics. The "objection_that_is_actually_right" in JSON is crucial here.

      *Specific focus on the "Erosion Reply":* The user argues pain degrades capacities needed to object. The counter is: How do you measure that degradation without already assuming the pain is bad? Also, if capacity is degraded, is the Advance Authorization valid? This is the weak point.

      *Specific focus on "Refractory":* Clinicians know "refractory" is often "refractory to *current* treatment" or "refractory to *this* doctor's knowledge." Declaring it absolute is dangerous.

      *Specific focus on "Advance Authorization":* Lapsing unless reaffirmed is risky for someone in pain. They might not reaffirm because they are in pain, not because they want to stop.

      *Let's build the table.*

      *Rank 1:* Autonomy/Consent Philosopher. The Paradox of Eroded Capacity. (Targets Move 4 & 2).
      *Rank 2:* Disability Scholar. The Definition of Capacity. (Targets Move 2).
      *Rank 3:* Pain Clinician. The "Refractory" Definition. (Targets Move 1).
      *Rank 4:* Patient Rep. The Lapsing Authorization. (Targets Move 4).
      *Rank 5:* Lawyer. Liability/Standard of Care. (Targets Move 4).
      *Rank 6:* Addiction Psychiatrist. Aim-Integrity vs. Craving. (Targets Move 3).
      *Rank 7:* Disability Scholar. Medicalization of Distress. (Targets Move 1).
      *Rank 8:* Narrative Philosopher. Identity Change. (Targets Move 3).
      *Rank 9:* Palliative Clinician. Sedation vs. Abolition. (Targets Move 1/3).
      *Rank 10:* Welfare Philosopher. Adaptation/Hedonic Treadmill. (Targets Move 2).
      *Rank 11:* Pain Clinician. Iatrogenesis Risk. (Targets Move 3).
      *Rank 12:* Lawyer. Revocation Without Reason. (Targets Move 4).

      *Wait, I need to make sure I'm harsh on the Erosion Reply as requested.* "Tell me plainly... where you think my erosion reply is confused." I will reflect this in the Force ratings and the JSON analysis.

      *Refining the "Reply" length:* 90 seconds is roughly 130-150 words at a normal speaking pace. I will keep them tight.

      *Refining the JSON:* Ensure valid JSON syntax.

      *Final check on constraints:* "Do not give me reading lists or citations." "Deliver the prep sheet as a markdown table." "After the table, a single JSON object."

      *Let's write.*
