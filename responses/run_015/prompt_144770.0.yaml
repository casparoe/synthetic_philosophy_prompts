prompt: |-
  I spent a career in field ecology and have come to philosophy late, by way of probability and causation. I now sit on a volunteer panel that reviews the automated systems used by our state's housing-assistance agency, and we have run into what I take to be the practical form of a familiar impasse.

  The system is two-staged: every applicant receives a score, and only the highest-scoring fifth is referred for a costly in-person eligibility review. That review can end in either of two ways — it can unlock aid, which benefits the applicant, or it can terminate an existing award for ineligibility, which does not — so even the sign of the outcome's value is in dispute. The groups we are required to compare differ in their measured rates of the outcome the score predicts; those rates drift between retrainings; and because only the referred fifth is ever reviewed, error rates can be estimated only on that selected pool and never on the applicant population as a whole.

  As I understand the relevant impossibility results, calibration, equal false-positive and false-negative rates, and predictive parity cannot in general hold together under those conditions: something has to be surrendered. What the mathematics does not tell us is what to surrender, and that is precisely the decision before us.

  Please write a decision procedure our panel can actually run: the questions in order, what would count as a sufficient answer to each, the points at which the procedure returns a stop — do not deploy, or do not use this criterion at all — and the points at which it must hand the question back to us as a matter of values rather than fact. It has to be usable by a panel with no statistician on it, meeting monthly, that must produce a one-page recommendation a director will sign, using only data the agency already logs. It must say what to do when a required quantity cannot be estimated, when a group is small enough that the estimates are mostly noise, when the rates have drifted since the last retraining, and when the agency's counsel demands a single headline disparate-impact figure that the mathematics does not uniquely settle.

  Apply the procedure to two or three cases of your own construction, at least one of which should yield an answer our panel will not welcome, and close by stating plainly what the procedure cannot settle. Please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Former field ecologist, late philosopher, interested in probability and causation. Sits on a volunteer panel reviewing automated housing-assistance systems.
      *   **Context:** State housing-assistance agency. Two-stage system (Score $\rightarrow$ Top 20% $\rightarrow$ In-person Review $\rightarrow$ Aid or Termination).
      *   **Problem:** Impossibility theorems (fairness metrics conflict). Selection bias (only see outcomes for top 20%). Drifting rates. Small group sizes. Legal demand for a single disparate-impact number.
      *   **Task:** Create a usable decision procedure for the panel.
      *   **Constraints:**
          *   No statistician on the panel.
          *   Monthly meetings.
          *   One-page recommendation output.
          *   Use only existing logged data.
          *   Must handle unestimable quantities, small groups, drift, and legal demands.
          *   Must include 2-3 constructed cases (one unwelcome).
          *   Must state plainly what the procedure *cannot* settle.
          *   American English.
      *   **Tone:** Practical, rigorous but accessible, acknowledging the philosophical/ethical weight without getting bogged down in abstraction.

  2.  **Deconstruct the Technical & Ethical Challenges:**
      *   *Selection Bias:* We only observe ground truth (eligibility) for the top 20%. We don't know the false negative rate for the bottom 80%.
      *   *Fairness Metrics:* Calibration, Equalized Odds, Demographic Parity. They conflict.
      *   *Drift:* Model performance degrades over time.
      *   *Small Groups:* Statistical noise makes comparisons meaningless.
      *   *Legal:* Counsel wants a "four-fifths rule" style number, but the math is messy.
      *   *Outcome Ambiguity:* Review can grant aid (good) or terminate aid (bad). This is a "benefit/burden" asymmetry.

  3.  **Drafting the Decision Procedure (The Core):**
      *   *Goal:* A flowchart-like sequence of questions.
      *   *Step 1: Data Sufficiency.* Can we even measure anything? (Small groups, missing data).
      *   *Step 2: Stability.* Has the model drifted?
      *   *Step 3: The "Unwelcome Truth" (Selection Bias).* Acknowledge we can't see the whole picture.
      *   *Step 4: Metric Selection.* Which fairness metric matters most here? (Given the benefit/burden asymmetry).
      *   *Step 5: The Legal Number.* How to satisfy counsel without lying.
      *   *Step 6: The Decision.* Deploy, Pause, or Abort.

      *Refining the Steps for Non-Statisticians:*
      *   Avoid formulas. Use thresholds and checks.
      *   Focus on *actionable* data (what is logged).
      *   Explicitly mark where values trump facts.

  4.  **Developing the Constructed Cases:**
      *   *Case 1 (The "Clean" Pass):* Stable data, clear disparity, easy decision.
      *   *Case 2 (The "Unwelcome" Truth):* Model works well overall, but fails a specific group, or the "fair" fix hurts the most vulnerable. Let's make it about the selection bias. The model looks fair on the selected pool, but we know the underlying population differs. Or, satisfying one metric violates another significantly. Let's go with: The model is highly predictive but creates a disparate impact that cannot be fixed without destroying utility. The panel must recommend stopping a system that helps many to save a few from harm.
      *   *Case 3 (The "Unknown"):* Small sample size/Drift. The procedure must say "Stop" because we don't know, not because we know it's bad.

  5.  **Addressing the Specific Constraints:**
      *   *One-page recommendation:* The procedure needs to culminate in a template.
      *   *Counsel's Demand:* Need a specific way to report the "headline number" with a disclaimer.
      *   *What cannot be settled:* The trade-off between efficiency and equity. The definition of "harm."

  6.  **Writing - Section by Section:**

      *   *Introduction:* Acknowledge the user's background (ecology/causation). Validate the difficulty.
      *   *The Procedure:* Break it down into "Gates."
          *   Gate 1: Data Integrity (Sample size, Drift).
          *   Gate 2: The Selection Wall (Acknowledging the 80% blind spot).
          *   Gate 3: The Metric Choice (Value judgment).
          *   Gate 4: The Legal Reporting (The "One Number" compromise).
      *   *The Cases:*
          *   *Case A (Drift):* Stop retraining.
          *   *Case B (The Unwelcome One):* High utility, high disparity. Recommendation: Suspend.
          *   *Case C (Small N):* Insufficient data.
      *   *The Limitations:* Explicitly state the philosophical impasse.

  7.  **Refining the Tone:**
      *   The user is an ecologist/philosopher. Use analogies if helpful, but keep it bureaucratic enough for the agency.
      *   "American English" (Check spelling: program, center, etc.).
      *   Avoid jargon where possible, or define it simply.
      *   Ensure the "Stop" conditions are clear.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too statistical?
      *   *Fix:* Simplify the checks. Instead of "calculate confidence intervals," use "minimum count of 50 cases per group."
      *   *Critique:* Did I address the benefit/burden asymmetry?
      *   *Fix:* Explicitly ask in Gate 3: "Is the primary risk denying aid or granting ineligible aid?"
      *   *Critique:* How to handle the counsel's demand?
      *   *Fix:* Create a "Qualified Disparate Impact Ratio" that includes the confidence interval or a warning flag.
      *   *Critique:* The user mentioned "causation."
      *   *Fix:* Acknowledge that the score is correlational, not causal, and the procedure treats it as such.

  9.  **Final Polish:** Check against the prompt requirements one last time.
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Stop points? Yes.
      *   Hand-off to values? Yes.
      *   Usable by non-statisticians? Yes.
      *   One-page recommendation? Yes (template provided).
      *   Handle unestimable quantities/small groups/drift/counsel? Yes.
      *   2-3 cases (one unwelcome)? Yes.
      *   State what cannot be settled? Yes.

  10. **Final Output Generation** (Proceed to write the response based on these thoughts).
answer: |-
  **To:** The Oversight Panel
  **From:** [Your Name/Consultant]
  **Subject:** Decision Procedure for Automated Eligibility Scoring (v1.0)

  You are correct that the mathematics cannot resolve the ethical trade-off. The impossibility theorems tell us that we cannot have it all; they do not tell us what to keep. As an ecologist, you know this as the difference between measuring a population and deciding how much harvest it can sustain. The data tells you the population size; the policy tells you the risk tolerance.

  Below is a procedural framework designed for your constraints. It requires no new data collection, only the aggregation of existing logs. It forces the "value" questions into the open so the Director can sign them with eyes open.

  ### The Procedure: Four Gates

  Run this procedure monthly, prior to the deployment of any updated model or scoring run.

  #### Gate 1: Data Sufficiency and Stability
  *Goal: Determine if the data is stable enough to trust any subsequent metric.*

  1.  **Question:** Has the model been retrained or have input variables changed since the last review?
      *   **If Yes:** Proceed to Q2.
      *   **If No:** Skip to Gate 2.
  2.  **Question:** In the reviewed pool (the top 20%), are there at least 50 recorded outcomes for *each* protected group required by law (e.g., Race, Disability, Veteran Status)?
      *   **If No:** **STOP.** Recommendation: "Insufficient Data." Do not evaluate fairness. Flag for manual review of all applicants in underrepresented groups until counts are met.
      *   **If Yes:** Proceed to Q3.
  3.  **Question:** Has the "acceptance rate" (percentage of applicants referred to review) drifted by more than 10% compared to the baseline training period?
      *   **If Yes:** **STOP.** Recommendation: "Model Drift." Suspend automated scoring. Return to manual processing until recalibrated.
      *   **If No:** Proceed to Gate 2.

  #### Gate 2: The Selection Wall
  *Goal: Acknowledge the blind spot created by the two-stage system.*

  1.  **Question:** Can we estimate the False Negative Rate (denied aid to eligible people) for the bottom 80% of scorers?
      *   **Fact:** You cannot. You never review them.
      *   **Action:** The Panel must formally record the following assumption: *"We assume the error rate in the unreviewed 80% is not systematically worse for any protected group than in the reviewed 20%."*
      *   **Decision:** If any Panel member objects to this assumption based on field knowledge (e.g., "Group X often lacks documentation required for high scores"), **STOP.** Recommendation: "Structural Bias Suspected." Expand the review pool to the top 40% for the next cycle to test this assumption.

  #### Gate 3: The Metric Choice (The Value Hand-off)
  *Goal: Select which mathematical impossibility to violate.*

  1.  **Question:** What is the primary harm we seek to minimize?
      *   **Option A:** Denying aid to eligible applicants (False Negatives).
      *   **Option B:** Granting aid to ineligible applicants / Terminating existing aid incorrectly (False Positives).
      *   **Option C:** Ensuring equal referral rates across groups (Demographic Parity).
  2.  **Action:** The Panel must vote on A, B, or C. There is no correct answer.
      *   **If A:** Evaluate the model on *Recall* (sensitivity) within the reviewed pool.
      *   **If B:** Evaluate the model on *Precision* (positive predictive value) within the reviewed pool.
      *   **If C:** Evaluate the model on *Selection Rate* differences.
  3.  **Threshold:** Does the chosen metric differ by more than 20% between the majority group and any protected group? (The "Four-Fifths" heuristic).
      *   **If No:** Proceed to Gate 4.
      *   **If Yes:** Proceed to Gate 4, but flag as "Disparate Impact Detected."

  #### Gate 4: The Legal Reporting
  *Goal: Satisfy counsel without falsifying precision.*

  1.  **Question:** Counsel requires a single disparate-impact figure.
  2.  **Action:** Calculate the ratio of the selected metric (from Gate 3) for the protected group vs. the majority group.
  3.  **Constraint:** This number must be reported with a "Confidence Flag."
      *   **Green:** Counts > 100 per group.
      *   **Yellow:** Counts 50–100 per group.
      *   **Red:** Counts < 50 (See Gate 1 Stop).
  4.  **Final Output:** Generate the One-Page Recommendation (Template below).

  ***

  ### Template: One-Page Recommendation

  **TO:** Agency Director
  **FROM:** Oversight Panel
  **DATE:** [Date]
  **SUBJECT:** Monthly System Review

  **1. System Status:** [Deploy / Suspend / Modify]
  **2. Data Quality:** [Stable / Drifting / Insufficient]
  **3. Primary Harm Minimized:** [Denial of Aid / Improper Award / Unequal Referral] *(Selected by Panel Vote)*
  **4. Headline Disparate Impact Ratio:** [0.XX] *(Confidence Flag: Green/Yellow/Red)*
  **5. Known Blind Spots:** We cannot measure error rates for the 80% of applicants not referred for review. We assume no hidden bias exists there.
  **6. Panel Certification:** We acknowledge that satisfying the metric in Item 3 mathematically precludes satisfying other fairness definitions. We accept this trade-off for this cycle.

  **Signatures:** ___________________

  ***

  ### Constructed Cases

  Here is how the procedure functions in practice.

  **Case 1: The Drift (Procedural Stop)**
  *   **Data:** The model was retrained in January. By March, the economic landscape shifted. The referral rate dropped from 20% to 14%.
  *   **Procedure:** Gate 1, Question 3 triggers a **STOP**.
  *   **Outcome:** The Panel recommends suspension. The Director signs a "Model Drift" memo. No fairness metrics are calculated because the baseline is broken.
  *   **Verdict:** Clean. The math protects the panel from evaluating a broken tool.

  **Case 2: The Small Group (Data Stop)**
  *   **Data:** The state has a small population of Native American applicants. In the reviewed 20%, only 12 individuals from this group were processed this month.
  *   **Procedure:** Gate 1, Question 2 triggers a **STOP**.
  *   **Outcome:** Recommendation is "Insufficient Data." The agency must manually process all Native American applicants for the next quarter to build a dataset.
  *   **Verdict:** Protective. It prevents the panel from making a statistical error that could be litigated later.

  **Case 3: The Unwelcome Truth (Value Conflict)**
  *   **Data:** The model is highly stable (Gate 1 Pass). The blind spot assumption is accepted (Gate 2 Pass).
  *   **The Conflict:** The Panel votes to minimize **Denial of Aid (False Negatives)** because housing is a humanitarian crisis.
  *   **The Result:** To maximize aid to eligible applicants, the score threshold must be lowered. However, lowering the threshold causes the *Improper Award* rate to spike for a specific demographic group due to correlated data errors in that region. The Disparate Impact Ratio on "Improper Awards" hits 0.55 (well below the 0.80 threshold).
  *   **Procedure:** Gate 3 flags "Disparate Impact Detected." Gate 4 produces a Red Flag ratio.
  *   **The Recommendation:** The Panel must recommend **Deployment** (because they voted to prioritize Denial of Aid) *alongside* a certification that this will cause a legally actionable disparity in fraud detection.
  *   **Verdict:** Unwelcome. The Panel is effectively telling the Director: "To feed the hungry, we must violate the four-fifths rule on fraud." The Director must sign knowing this invites a lawsuit from the group being flagged for fraud, or a lawsuit from the hungry if the system is tightened. The procedure does not solve this; it forces the Director to own the liability.

  ***

  ### What This Procedure Cannot Settle

  You asked for the limits of this tool. As a philosopher, you will recognize these as the boundaries of the empirical.

  1.  **The Definition of Harm:** The procedure cannot tell you whether it is worse to deny an eligible person housing or to grant housing to an ineligible person. One is a humanitarian failure; the other is a fiscal/legal failure. The procedure forces a vote, but it cannot validate the vote.
  2.  **The Unobserved 80%:** No amount of logging can reveal the counterfactual. We will never know if the people scored in the bottom 20% were eligible. The procedure asks you to assume they are similar to the top 20%, but you know from ecology that selection bias often hides the most vulnerable populations.
  3.  **The Causal Mechanism:** The system correlates variables with eligibility. It does not know *why*. If a variable (e.g., "distance from city center") correlates with race and eligibility, the procedure treats it as a number. It cannot tell you if that variable is a proxy for historical segregation. That is a historical judgment, not a statistical one.
  4.  **The Legal Fiction:** Counsel wants a single number. The procedure provides one, but attaches a confidence flag. It cannot prevent counsel from ignoring the flag in court. It can only ensure the Panel's record shows the flag was raised.

  **Final Note:**
  This procedure converts an mathematical impasse into an administrative audit trail. It does not solve the unfairness. It ensures that when the unfairness is challenged, the agency can show exactly which value was prioritized, and that the limitation was known. In bureaucracy, knowing what you cannot know is the closest thing to wisdom we have.
