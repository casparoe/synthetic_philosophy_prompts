prompt: |-
  You are a legal philosopher with one foot in the philosophy of language — someone who knows the debates about meaning, intention, and communication (sentence meaning versus speaker's meaning, conventions versus intentions, concepts versus their extensions) and who also has a working knowledge of how appellate courts in common-law systems actually handle statutes. Take this seriously and work through it carefully. Begin with a short brainstorming pass: sketch the two or three rival accounts of what a legal text's meaning is, note which parts of the practice described below each account would predict, and mark the parts that no single account seems to predict cleanly. Then give me the worked-out answer, organised under the headings I list at the end.

  I am an appellate lawyer, not a philosopher, and I keep noticing that we do one thing here and the opposite thing there. Here is the package of practices I have in mind, stated as neutrally as I can:

  1. Courts identify the "ordinary meaning" of statutory words as a competent speaker of the language would have understood them at the time the statute was enacted. Meaning is said to be fixed at enactment and not to drift afterwards.

  2. When doing this, they decline to consult the legislative record — committee reports, floor statements, earlier drafts, ministerial explanations — even where it is public, on point, and unambiguous. What the enacting legislators wanted the words to accomplish is treated as irrelevant to what the words mean.

  3. Yet the same courts also: (a) read statutes so as to avoid results they are willing to call absurd, manifestly unjust, or unworkable; (b) read old statutes as "always speaking," so that a provision framed in terms of a technology or practice from the 1930s is applied to its 2020s successor with no amendment ever having been made; (c) treat a preamble or an enacted statement of purposes as authoritative in resolving ambiguity, even though that text is as much part of the enactment as the committee reports they refuse to look at; and (d) defer to the reading adopted by the executive agency that administers an ambiguous provision, while continuing to insist that statutory interpretation is a question of law for judges alone.

  4. Provisions carrying criminal penalties are construed narrowly, in favour of the person exposed to them.

  A concrete instance, so the discussion stays on the ground rather than in the air: a 1935 by-law forbids "any vehicle" in a public park, and a city now wants to exclude e-scooters. The court reasons that "vehicle" in 1935 meant any wheeled conveyance used to carry people or goods — a description the enactors would not have had e-scooters in mind when using, but whose terms plainly cover them — and concludes that the e-scooter is within the meaning, not merely within some extended application the court has invented.

  Here is what I want from you:

  **The implicit theory.** Reconstruct the view of meaning, communication, and legal authority that this package presupposes. Does it presuppose that a statute's meaning is a function of the linguistic conventions of a community rather than of any speaker's intentions? Does it presuppose a distinction between ascertaining what a text says and deciding what is to be done about it, with only the first counting as interpretation? Does it presuppose something further about law's job — notice to citizens, legislative supremacy, the constraints on unelected judges — that the interpretive rules are meant to serve?

  **Strict presuppositions versus mere fits.** Distinguish what the package strictly presupposes — what could not be given up without abandoning the underlying theory — from what merely sits well with it and could be jettisoned while remaining recognisably the same approach. In particular: is the refusal in (2) required by the theory of meaning in (1), or is it only an evidentiary or institutional proxy that the theory recommends for reasons of cost, reliability, or manipulability? Is the narrow-construction rule in (4) part of the theory of meaning at all, or an independent normative overlay?

  **Internal consistency.** Is (3a) compatible with (2), given that a claim about absurdity looks like a claim about what the legislature could not have meant to achieve? Is (3b) in genuine tension with (1), or can the e-scooter reasoning — fixed descriptive content, open-ended application — reconcile them, and what does that reconciliation assume about concepts and about there being a fact of the matter about which description the 1935 word carried? Are (3c) and (3d) consistent with (2), or do they betray a different view of what statutes are for: if the enacted purpose-statement and the agency's reading are admissible while committee reports are not, what is being trusted in the first pair and distrusted in the third?

  **Replacing the package.** Suppose the jurisdiction abandoned this package for a straightforward purposivism — courts ask what the statute was there to achieve and read the text so as to serve that aim. What exactly would have to change in how judges reason, write, and justify outcomes? Say precisely what burden purposivism imposes that these rules seem designed to avoid: what must a judge now establish, and what kind of claim is it (empirical, counterfactual, evaluative) when the legislature was plural, compromised, and partly silent? And say honestly where textualism's rules purchase their cheapness at the cost of accuracy.

  **Settled versus contested.** Separate what people who actually work on this would treat as common ground from what is genuinely disputed among them — for instance, whether there is a determinate fact of the matter about ordinary meaning at a time, whether the line between interpretation and construction is coherent or ad hoc, whether textualism really delivers the constraint on judges it advertises, and whether textualism and purposivism diverge much in the cases that reach appellate courts. Tell me which of your own claims are the contested ones, and what the strongest version of the other side is.

  **Where the practice is underdetermined.** Finally, tell me where the practice as described does not settle the philosophy: places where two or more quite different theories of meaning, authority, or legislation would license exactly the same behaviour, so that pointing at the practice cannot adjudicate between them.

  Do not cite cases, statutes, or scholarly literature by name — I want the argument, not the references, and I want it as if you had no library to consult. Aim for a substantive memo of roughly 1,000 to 1,500 words, plus the brainstorming section.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Legal philosopher with expertise in philosophy of language and common-law appellate practice.
      *   **Task:** Analyze a specific package of judicial practices regarding statutory interpretation (textualism/originalism leaning, but with pragmatic exceptions).
      *   **Input:** A description of four practices (ordinary meaning fixed at enactment, exclusion of legislative history, absurdity/always-speaking/purpose/deference exceptions, rule of lenity). Plus a concrete example (1935 "vehicle" by-law vs. e-scooters).
      *   **Output Structure:**
          1.  Short brainstorming pass (rival accounts, predictions, anomalies).
          2.  Worked-out answer under specific headings:
              *   The implicit theory.
              *   Strict presuppositions versus mere fits.
              *   Internal consistency.
              *   Replacing the package.
              *   Settled versus contested.
              *   Where the practice is underdetermined.
      *   **Constraints:** No citations (cases, statutes, scholars). Substantive memo style. 1,000-1,500 words (plus brainstorming). Serious tone.

  2.  **Brainstorming Pass:**
      *   *Rival Accounts:*
          1.  **Original Public Meaning (Textualism):** Meaning is fixed by linguistic conventions at enactment. Speaker intention (legislators) is irrelevant or inaccessible. Law is public notice.
          2.  **Purposivism (Intentionalism):** Meaning is determined by the goal the legislature sought to achieve. Text is evidence of intent.
          3.  **Legal Pragmatism/Realism:** Meaning is whatever produces the best outcome or fits institutional competencies.
      *   *Predictions:*
          *   Account 1 predicts (1) and (2) perfectly. It struggles with (3) (especially absurdity and purpose clauses) unless framed as "contextual meaning." It struggles with (4) unless as a separate norm.
          *   Account 2 predicts (3a) and (3c) well. It struggles with (1) and (2) (why ignore history if intent matters?).
          *   Account 3 predicts (3) and (4) well. It struggles to explain (1) and (2) as anything other than pretense.
      *   *Anomalies:* The combination of (1)/(2) with (3) is the tricky bit. Why exclude legislative history but include purpose clauses? Why fixed meaning but "always speaking"? The e-scooter case suggests a distinction between *concept* (vehicle) and *conception* (specific 1935 vehicles).

  3.  **Drafting - Section by Section:**

      *   **The Implicit Theory:**
          *   Need to articulate a view where meaning is public, conventional, and fixed, but not mechanical.
          *   It presupposes meaning is a function of linguistic conventions (public meaning) rather than private mental states (intent).
          *   It distinguishes interpretation (what the text says) from application (how it fits new facts).
          *   It serves values of notice (citizens can read the law) and separation of powers (judges don't legislate).
          *   The "always speaking" doctrine suggests the *concept* is fixed, but the *extension* evolves.

      *   **Strict Presuppositions versus Mere Fits:**
          *   Strict: Meaning is fixed at enactment (1). Text is the authority (2).
          *   Mere Fits: Excluding legislative history (2) is likely institutional/epistemic, not strictly semantic. One *could* look at history to understand conventions, but it's risky.
          *   Rule of Lenity (4) is definitely a normative overlay, not a theory of meaning. It's a tie-breaker based on liberty, not semantics.
          *   Absurdity (3a) is a safety valve, potentially in tension with strict textualism, but often framed as "no legislature could mean this" (semantic implausibility).

      *   **Internal Consistency:**
          *   (3a) vs (2): Absurdity looks like intent, but can be framed as semantic limits (words couldn't possibly mean that).
          *   (3b) vs (1): The e-scooter example is key. It relies on the distinction between the *description* (wheeled conveyance) and the *examples* (cars/horses). The meaning (description) is fixed; the world changes. This reconciles them via conceptualism.
          *   (3c)/(3d) vs (2): Purpose clauses are *enacted* text; committee reports are not. This is a formal distinction about authority, not just meaning. Agency deference (3d) is about institutional competence, not meaning itself.

      *   **Replacing the Package (Purposivism):**
          *   Shift from "what does it say?" to "what was it for?"
          *   Burden: Judge must construct a coherent purpose from a plural body. This involves counterfactuals ("would they have wanted this?").
          *   Cost: Textualism buys certainty and constraint at the cost of sometimes missing the point (accuracy regarding goal). Purposivism buys accuracy regarding goal at the cost of predictability and judicial discretion.

      *   **Settled versus Contested:**
          *   Settled: Text matters. Context matters.
          *   Contested: Is there a single "ordinary meaning"? Is the interpretation/construction line real? Does textualism actually constrain judges (or do they just manipulate "ordinary meaning")?
          *   My contested claim: That the "always speaking" doctrine is purely semantic and not a normative update.
          *   Other side: Purposivists argue all interpretation is purpose-driven; textualism is just hidden purposivism.

      *   **Where the Practice is Underdetermined:**
          *   The practice looks the same whether you believe judges are *finding* meaning or *constructing* it pragmatically.
          *   The exclusion of legislative history could be based on semantics (irrelevant) or institutional design (unreliable).
          *   The "absurdity" exception could be semantic (impossible meaning) or normative (justice overrides text).

  4.  **Review and Refine:**
      *   *Word Count Check:* Need to ensure I hit the 1,000-1,500 range for the main body. The brainstorming is extra.
      *   *Tone Check:* Needs to be philosophical but grounded in legal practice. Avoid academic name-dropping (Scalia, Dworkin, Grice, etc.).
      *   *Constraint Check:* No citations.
      *   *Content Check:* Did I address the e-scooter example? Yes, in Internal Consistency. Did I address the specific sub-questions in each heading? Yes.

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   *Brainstorming:* Keep it tight. 3 accounts: Public Meaning, Intent/Purpose, Pragmatic Constructivism.
      *   *Implicit Theory:* Focus on "Public Meaning Originalism" but nuanced. It's about communicated content, not mental states.
      *   *Strict vs. Fits:* Crucial distinction. The exclusion of history is the weakest link semantically; it's mostly institutional. Lenity is definitely normative.
      *   *Consistency:* The "always speaking" point is the hardest philosophical lift. It requires a theory of concepts where the intension is fixed but extension varies with world facts.
      *   *Replacing:* Focus on the epistemic burden on judges. Reconstructing collective intent is hard.
      *   *Settled/Contested:* Be honest about the "constraint" claim.
      *   *Underdetermined:* The gap between semantics and pragmatics.

  6.  **Final Polish:** Check flow and headings. Ensure the voice is authoritative yet analytical. (Self-Correction: Make sure I don't slip into citing "Scalia" or "Hart". Keep it generic.)

  7.  **Word Count Management:**
      *   Brainstorming: ~200 words.
      *   Main Body: ~1,200 words.
      *   Total: ~1,400 words.

      *Let's write.*
answer: |-
  **Brainstorming Pass**

  Three rival accounts compete to explain this package. First, **Public Meaning Originalism**: meaning is fixed by linguistic conventions at enactment; intentions are irrelevant. This predicts (1) and (2) cleanly but struggles to explain (3) without ad hoc adjustments. Second, **Purposivism**: meaning is determined by the legislative goal. This predicts (3a) and (3c) well but cannot explain why (2) excludes direct evidence of intent (history) while (1) insists on fixed meaning. Third, **Institutional Pragmatism**: meaning is whatever best allocates authority between courts, legislatures, and agencies. This explains the mix of (2) and (3d) but treats (1) as mere pretense.

  The practice described predicts that judges will argue about semantics even when the real dispute is normative. No single account predicts the whole package cleanly. Public Meaning explains the text-focused rules but must treat the "absurdity" and "always speaking" doctrines as exceptions rather than core semantic truths. Purposivism explains the outcomes but cannot justify ignoring legislative history. The tension lies in claiming meaning is fixed and conventional while allowing updates for new technology and justice.

  ***

  **The implicit theory**

  The package presupposes a theory of communication where the law's meaning is a public act, distinct from the private mental states of its authors. It assumes that when a legislature enacts text, it communicates via shared linguistic conventions available to the citizenry at that time. Consequently, a statute's meaning is a function of those conventions rather than the subjective intentions of the drafters. This view separates the *content* of the law (what the text says) from the *rationale* for the law (why it was passed), treating only the former as binding law.

  This theory serves specific political values. By fixing meaning at enactment and excluding legislative history, it prioritizes notice: citizens should be able to rely on the public text without hunting down obscure committee reports. It also enforces legislative supremacy: if the legislature wants a different outcome, it must amend the text, not rely on judicial猜测 about its hopes. The distinction between ascertaining what a text says and deciding what to do about it is central; only the former counts as interpretation. The latter is legislation. The practice assumes there is a fact of the matter about what the words meant, independent of whether that meaning produces good results.

  **Strict presuppositions versus mere fits**

  The strict presupposition is that meaning is fixed at enactment (1). Without this, the claim that judges are interpreting rather than legislating collapses. The exclusion of legislative history (2), however, is likely a mere fit rather than a strict requirement. Semantically, evidence of how speakers used words is relevant to establishing conventional meaning. The refusal to consult history is better explained as an institutional proxy: legislative history is deemed unreliable, manipulable, or undemocratic compared to the enacted text. It could be jettisoned without abandoning the core theory, provided history was used only to illuminate conventions, not to override text.

  The narrow-construction rule for criminal penalties (4) is definitely not part of the theory of meaning. It is an independent normative overlay—a tie-breaker based on liberty interests when semantic ambiguity remains. It admits that meaning has run out and policy must decide. Similarly, the "absurdity" exception (3a) is a safety valve, not a semantic rule. It acknowledges that strict adherence to convention can sometimes defeat the rule of law itself, but it is framed narrowly to avoid swallowing the text.

  **Internal consistency**

  There is tension, but not necessarily contradiction, between (2) and (3a). A claim of absurdity can be framed semantically: "No competent speaker could have used these words to mean this result." If framed this way, it remains within the bounds of convention. If framed as "The legislature wouldn't have wanted this," it violates (2). Courts usually strive for the former framing to maintain consistency.

  The "always speaking" doctrine (3b) and the e-scooter example reconcile with (1) through a distinction between *concept* and *conception*. The meaning (the concept) is fixed: "wheeled conveyance." The application (the conception) evolves as the world changes. The court assumes there is a fact of the matter about the descriptive content the 1935 word carried. If the description fits the new technology, the meaning hasn't drifted; the world has. This assumes concepts have stable intensions even if their extensions expand.

  Regarding (3c) and (3d) versus (2): the distinction is formal authority. A preamble or purpose statement is *enacted text*, voted on and law. Committee reports are not. Trusting the former and distrusting the latter is consistent with a theory that only enacted text carries authority. Agency deference (3d) is consistent if viewed as a rule of administrative law regarding who resolves ambiguity, not a rule about what the ambiguity means. It concedes that where meaning is not fixed by convention, institutional competence decides.

  **Replacing the package**

  If the jurisdiction adopted straightforward purposivism, judges would shift from asking "what do these words say?" to "what problem was this solving?" The burden shifts from linguistic analysis to historical and functional reconstruction. A judge must establish the legislature's goal, which is empirically difficult when the legislature is a plural body with compromised, conflicting motives. The claim becomes counterfactual: "Would the legislature have wanted this application?" This is evaluative, not semantic.

  Textualism's rules purchase cheapness at the cost of accuracy. They offer a clear method (read the text) that constrains judges and reduces litigation costs. However, they risk achieving the wrong outcome when the text fails to capture the purpose due to drafting error or unforeseen change. Purposism buys accuracy regarding the legislative goal but costs predictability and increases judicial discretion. Judges would write opinions less like dictionaries and more like policy analyses, justifying outcomes by fit with the statutory scheme rather than fit with linguistic convention.

  **Settled versus contested**

  Practitioners agree that text is the starting point and that context matters. They also agree that enacted purpose clauses carry weight. What is genuinely contested is whether there is a determinate fact of the matter about "ordinary meaning." Textualists assume there is; skeptics argue meaning is often indeterminate until a judge constructs it. The line between interpretation (finding meaning) and construction (applying norms when meaning runs out) is also disputed; many argue it is ad hoc masking for policy choices.

  Furthermore, it is contested whether textualism actually constrains judges. Critics argue judges manipulate "ordinary meaning" to reach preferred outcomes, making the theory no more restrictive than purposivism. My claim that the "always speaking" doctrine is purely semantic is contested; the strongest version of the other side argues that applying old words to new tech is always a normative choice about updating the law, disguised as semantic analysis. They argue the e-scooter decision wasn't about what "vehicle" meant, but about whether the park should be motor-free.

  **Where the practice is underdetermined**

  The practice does not settle whether judges are discovering meaning or constructing it. A judge excluding legislative history might do so because they believe it is semantically irrelevant (Public Meaning) or because they believe it is institutionally dangerous (Pragmatism). Both yield the same behavior. Similarly, the "absurdity" exception looks the same whether driven by a belief that words cannot mean nonsense (semantic) or a belief that justice overrides text (normative).

  Finally, the practice is underdetermined regarding the nature of legal authority. It is unclear whether the legislature's authority lies in its will (which history might reveal) or its command (which text reveals). The package behaves as if it is the latter, but the exceptions (absurdity, purpose clauses) sneak the former back in. One could hold a theory that law is purely conventional and another that law is functional, and both could endorse this exact package of practices by reasoning from different premises to the same procedural rules. The practice alone cannot tell us whether the judge is a linguist or a policy-maker wearing a linguist's mask.
