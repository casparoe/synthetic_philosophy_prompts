answer: |-
  Your friend is confusing the medium with the message, a mistake I've seen dismantle many a good theory over a campfire. In the field, whether it's bride-price or potlatch, the reliability of the signal never depends on who holds the bag at the end, but on who bleeds to get there. The Meridian Act doesn't remove the handicap; it restructures it from an entry fee to a performance bond. Your intuition is correct: the signal's honesty relies on the differential expected cost, not the literal transfer of funds. For a high-ability candidate, the probability of paying out-of-pocket is near zero, so the state covering the tuition is irrelevant to their calculus. For a low-ability candidate, the risk of personal liability is high, making the expected cost prohibitive. The handicap isn't the tuition receipt; it's the exposure to ruin. That's a classic separating equilibrium, and your friend's peacock analogy fails because the peacock pays in metabolic energy, not cash—the energy here is the effort plus the risk premium.

  However, you're overstating the claim that the signal becomes "cleaner." You're assuming everyone can bear the risk equally, but liquidity constraints on risk tolerance are real. A brilliant but poor student might balk at the personal liability even if the upfront cost is zero, whereas a wealthy mediocre student might absorb the risk of failure easily. That introduces noise. The signal remains honest regarding ability, but it gets confounded by wealth-based risk tolerance, potentially shrinking the pool of signalers in ways that don't track merit. So you win the theoretical point against your friend—the handicap survives—but you might lose on the social outcome. Hold that second thought on waste versus transfer for a moment; it's the real knot in the rope, but let's settle this Act business first. You've got the mechanism right, just watch the boundary conditions.
