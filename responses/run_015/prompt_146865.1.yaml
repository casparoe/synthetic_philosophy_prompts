prompt: |-
  I'm drafting a four-month research proposal for a philosophy-of-mind workshop on predictive processing. My half-formed idea: standard free-energy accounts treat precision-weighting as a uniform mechanism that regulates prediction-error influence, but I suspect there is a hidden distinction between sensory precision (how sharply interoceptive prediction errors are weighted) and policy precision (how sharply prior beliefs over action sequences are weighted). In conditions such as somatic symptom disorder and depersonalisation, these appear to dissociate—patients can show hyper-acute bodily awareness coupled with an inability to deploy action policies that would reduce uncertainty—yet the free energy principle collapses both into a single variational parameter. I want to investigate whether this collapse is substantive or merely notational, and whether accommodating the dissociation requires revising the claim that all adaptive behaviour is unified under one free-energy minimisation scheme.

  Write the proposal. It must include: a precise statement of the research question and an explanation of why existing debates about expected free energy and the dark-room problem leave this specific issue open; the approach—what conceptual and formal work you would carry out stage by stage over four months, specifying why this philosophical method is preferable to empirical clinical study or pure computational modelling for answering it; what a result would look like (for instance, a revised generative-model architecture that predicts dissociation without auxiliary hypotheses) and what would count as failure (for instance, demonstrating that the proposed distinction collapses back into the standard precision formulation); and an honest scope assessment—what parts of the broader predictive-processing literature must be bracketed to keep the project feasible.

  Do not request a bibliography, reading list, or citations; I will supply those myself. Use British English throughout. Conclude your response with a single line beginning exactly 'Summary: ' followed by a one-sentence statement of the proposal's central thesis.
