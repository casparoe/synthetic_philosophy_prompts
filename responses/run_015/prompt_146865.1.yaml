answer: |-
  **Project Title:** Precision Dissociated: A Conceptual Analysis of Sensory and Policy Weighting in Active Inference

  **Research Question and Context**
  The central research question is whether the uniform precision parameter in standard free-energy formulations substantively collapses distinct functional mechanisms, specifically separating sensory precision (the weighting of interoceptive prediction errors) from policy precision (the confidence in prior beliefs over action sequences). While the free-energy principle posits a unified account of adaptive behaviour, clinical phenomenology in conditions such as somatic symptom disorder and depersonalisation suggests a dissociation: patients may exhibit hyper-acute bodily awareness alongside a profound inability to deploy action policies that reduce uncertainty.

  Existing debates regarding Expected Free Energy and the dark-room problem leave this issue unresolved. Debates surrounding Expected Free Energy primarily concern the objective function used for planning over trajectories; they assume precision over policies is derived from expected outcomes but do not scrutinise whether the *gain control* on sensory errors is conceptually identical to the *confidence* weighting on policies. Similarly, the dark-room problem addresses the content of prior preferences—why agents do not seek trivial states of low sensory input—but it presupposes a unified precision economy rather than interrogating its internal structure. Consequently, the literature lacks a dedicated analysis of whether the mathematical conflation of these precision types is a harmless notational convenience or a substantive error that obscures psychopathological mechanisms.

  **Approach and Methodology**
  This project will employ a conceptual-engineering approach combined with formal scrutiny over four months. This philosophical method is preferable to empirical clinical study, which would require ethical approval and longitudinal data collection beyond the workshop's timeframe, and pure computational modelling, which risks obscuring conceptual distinctions beneath parameter tuning. Philosophy is uniquely positioned to analyse the interpretative validity of the formalism itself.

  *   **Month 1: Conceptual Mapping.** I will delineate the distinct functional roles of sensory versus policy precision within the current active inference literature. This involves mapping clinical phenomenology onto these definitions to establish the explanatory gap in the standard model.
  *   **Month 2: Formal Analysis.** I will examine the variational free-energy equation to identify precisely where precision enters the bound. The goal is to determine if splitting the precision parameter into independent sensory and policy variables violates the mathematical guarantees of the free-energy bound or merely requires re-specification.
  *   **Month 3: Philosophical Implications.** I will assess whether accommodating this dissociation threatens the claim that all adaptive behaviour is unified under one minimisation scheme. This stage involves constructing the argument regarding the modularity of the mind implied by split precision.
  *   **Month 4: Synthesis and Drafting.** I will integrate the formal and conceptual findings into a cohesive paper, refining the argument for presentation at the workshop.

  **Success and Failure Conditions**
  A successful outcome will be a coherent argument demonstrating that the standard formalism conflates two distinct functional roles, accompanied by a proposal for a revised generative-model architecture. This revised architecture must predict the observed dissociation in psychopathology without requiring auxiliary hypotheses ad hoc to the specific condition.

  Conversely, the project will be deemed to have failed if the formal analysis demonstrates that the proposed distinction collapses back into the standard precision formulation. For instance, if it can be shown that sensory and policy precision are mathematically interdependent such that one cannot vary without the other within the bound, then the hypothesis of a substantive dissociation is untenable under the current free-energy framework.

  **Scope Assessment**
  To ensure feasibility within four months, several areas of the broader predictive-processing literature must be bracketed. First, I will not address the neurobiological implementation of precision weighting; the project remains at the computational and algorithmic levels of analysis. Second, I will not engage in a detailed nosological review of specific psychiatric diagnoses beyond using them as phenomenological touchstones. Finally, I will bracket broader metaphysical implications regarding the nature of selfhood, focusing strictly on the structural integrity of the free-energy principle itself.

  Summary: The proposal argues that standard free-energy formulations substantively conflate distinct precision mechanisms, necessitating a conceptual revision to account for psychopathological dissociations between bodily awareness and agency.
