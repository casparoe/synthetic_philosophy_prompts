      4.  **The Teleological/Intrinsic Value Thesis:** "Nature has purposes/values independent of welfare."
      5.  **The Welfare Maximization Thesis (The Opponent's likely implication):** "Natural states maximize net positive experience for sentient beings."

      *Wait, Thesis 5 is crucial.* If the opponent says "Nature knows best," they might imply nature is *kinder* than humans. But ecological reality suggests nature is often cruel (red in tooth and claw). This directly addresses the user's point about "moral ambiguity."

