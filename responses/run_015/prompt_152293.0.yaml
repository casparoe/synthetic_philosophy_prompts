          1.  Does it support leaving the woodland untouched?
          2.  Does it bear on the question of wild animal welfare (making preservation morally ambiguous)?
          3.  Is it defensible, false, or merely rhetorical?
          4.  Specify which version must be true to block the development proposal.
      *   **Format:** A numbered menu suitable for bringing to a meeting.

  2.  **Deconstruct the Slogan ("Nature knows best"):**
