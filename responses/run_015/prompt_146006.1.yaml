answer: |-
  The metaphysician's objection that partition-relativity makes causation mind-dependent threatens to change the subject, and your reply that partitions track objective counterfactual structures is plausible but risks collapsing back into realism or admitting anti-realism.

  **1. Grad Student**
  *Phrasing:* "Isn't this just a verbal dispute? You say 'cause' means different things depending on the partition; isn't that just the same cause under a different description?"
  *Bite:* Weak. Targets presentation, not ontology.
  *Reply:* No. It is not ambiguity in the word but structural ambiguity in the relata. Truth conditions shift because the system states are typed differently, not because we use 'cause' loosely.
  *Soft:* Doesn't explain why this specific ambiguity resolves exclusion rather than dissolving it.

  **2. Metaphysician**
  *Phrasing:* "Causation is a relation in nature. If causal facts shift with explanatory interest, you've changed the subject."
  *Bite:* Fatal. Targets core ontology.
  *Reply:* Partitions track objective counterfactual structures, not whims. Relativity is to structure available in the world, not to our questions.
  *Soft:* Blurs the line between mind-independent structure and mind-dependent selection.

  **3. Philosopher of Science**
  *Phrasing:* "Are coarse variables invariant under intervention? Is the mental variable modular and independent?"
  *Bite:* Strong. Technical viability.
  *Reply:* Yes, coarse variables are invariant across physical realizers; modularity holds within the partition even if interventions are macroscopic.
  *Soft:* Interventions on coarse variables may not be physically possible without fixing the fine grain.

  **4. Non-reductive 1 (Proportionality)**
  *Phrasing:* "How is this different from proportionality? Doesn't the mental cause screen off the physical?"
  *Bite:* Medium. Territorial.
  *Reply:* Proportionality selects the right cause among competitors; partitioning explains why there is no competition to select between in the first place.
  *Soft:* Might just be proportionality relabeled with extra machinery.

  **5. Non-reductive 2 (Program)**
  *Phrasing:* "Does the mental explain if it adds no influence? Is there nothing left for the mental to do?"
  *Bite:* Medium. Explanatory value.
  *Reply:* It provides counterfactual stability, which is the explanatory cash value, not extra physical influence.
  *Soft:* "Stability" might sound like second-class causation to robust realists.

  **6. Non-reductive 3 (Inheritance)**
  *Phrasing:* "Do realizers inherit causal power? How do you handle distinctness of properties?"
  *Bite:* Medium. Mechanism.
  *Reply:* Inheritance is partition-relative; physical inherits within fine partition, mental within coarse. No conflict.
  *Soft:* Risks overdetermination if partitions overlap in practice.

  **7. Exclusionist 1 (Eliminativist)**
  *Phrasing:* "You deny closure. The physical effect is screened off by the physical cause."
  *Bite:* Strong. Standard objection.
  *Reply:* Closure holds within partitions; cross-partition closure is ill-formed. You cannot screen off across grains.
  *Soft:* Physicalists demand cross-partition closure for a complete physics.

  **8. Exclusionist 2 (Identity)**
  *Phrasing:* "Mental and physical are identical. This is the same cause under a different description."
  *Bite:* Strong. Ontological.
  *Reply:* Identity requires same partition; here typings are distinct, so identity doesn't apply. They are not candidates for identity.
  *Soft:* Rejects standard physicalist identity claims outright.

  **9. Chair (Humean)**
  *Phrasing:* "What is the causal oomph? Is there overdetermination?"
  *Bite:* Weak. Philosophical worry.
  *Reply:* Oomph is partition-relative; physical has fine oomph, mental has stable oomph. No overdetermination across partitions.
  *Soft:* "Stable oomph" sounds metaphorical rather than mechanistic.

  **Concessions**
  Concede immediately that there is no partition-free answer to whether mental states cause behavior. This disarms the metaphysician's demand for a single true causation relation by framing your project as structural analysis rather than ontological ranking. Concede that the mental adds no causal influence over and above the physical. This satisfies the exclusionists' closure intuition while reserving the right to claim the mental adds counterfactual stability. Both concessions are already premises in your sketch; owning them early prevents them from being used as traps later.

  **Crucial Reply**
  The reply to the Metaphysician (Objection 2) has to land. If causation is merely interest-relative, your thesis becomes a pragmatic tool rather than a solution to the metaphysical exclusion problem. You must insist that partitions are constrained by objective counterfactual structures in the world, not merely by human explanatory interests. Honestly, this reply is precarious: it walks a tightrope between realism (which threatens to reintroduce competition) and anti-realism (which surrenders the metaphysical stakes). If you cannot show that partitions are discovered rather than imposed, the session will conclude that you have dissolved the problem rather than solved it.

  **Hope Nobody Asks**
  "How do we non-arbitrarily select the correct partition without circularity?" If the partition selection depends on which counterfactual structure we want to track, but the tracking depends on the partition, you risk circularity. There is no partition-free criterion for choosing the partition, and admitting this looks like conceding that the view is ultimately pragmatic.
