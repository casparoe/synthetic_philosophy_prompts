  |       no determinate physical state could match?
  |   |
  |   +-- [YES: Mismatch] --> Q2: Ubiquity. Is this non-physical character 
  |   |   intrinsic to all matter or only complex systems?
  |   |   |
  |   |   +-- [All Matter] --> LEAF 1: Russellian Monist. 
  |   |   |   Awkwardness: Intrinsic nature of electrons is experiential.
  |   |   |
  |   |   +-- [Complex Systems] --> LEAF 2: Property Dualist (Hard Problem). 
  |   |       Awkwardness: Violates causal closure of the physical.
  |   |
  |   +-- [NO: Match Possible] --> Q3: Vehicle vs. Content. 
  |       Is phenomenal character identical to the physical vehicle or its content?
  |       |
  |       +-- [Vehicle] --> LEAF 3: Physicalist Identity (A Posteriori/Topic-Neutral). 
  |       |   Awkwardness: Identity is either brute or conceptualized non-phenomenally.
  |       |
  |       +-- [Content] --> LEAF 4: Representationalist. 
  |           Awkwardness: Misrepresentation implies non-veridical phenomenology.
  |
  +-- [YES: Seeming vanishes with function] --> ILLUSIONIST BRANCH
      |
