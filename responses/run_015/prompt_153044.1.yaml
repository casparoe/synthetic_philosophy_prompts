  **Empty Cells & Indistinguishable Leaves**

  The 9 binary/choice nodes permit 512 logical paths, but the tree prunes dependencies. Treating the key dimensions (Realism, Locus, Veridicality, Quasi) as a combinatorial space, three interesting cells remain empty:
  1.  **Realist + Upstream Error:** Incoherent. Realists deny introspection is erroneous; locating error upstream contradicts realism.
  2.  **Error Theory + Veridicality Conditions:** Incoherent. If the concept is defective, there are no truth conditions to specify.
  3.  **Quasi-Qualia + First-Order Illusionism:** Unattractive. Positing quasi-properties upstream defeats the motive for eliminating them downstream; nobody defends this.

  **Indistinguishable Leaves:** *Physicalist Identity* vs. *Representationalist*. Both are physicalist realists. Separating them requires agreeing on whether "content" is distinct from "vehicle," which often collapses into terminological dispute over wide vs. narrow content. A case involving non-conceptual content might separate them, but currently, they overlap significantly in empirical predictions.
