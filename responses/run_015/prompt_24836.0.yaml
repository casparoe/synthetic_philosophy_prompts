answer: |-
  This is a classic problem in the philosophy of art, touching on the work of Nelson Goodman (*Languages of Art*), Arthur Danto (*The Transfiguration of the Commonplace*), and Kendall Walton (*Categories of Art*). To answer your request, I will reconstruct the implicit theory of value, distinguish between strict presuppositions and compatible fits, analyze the counterfactual implications, and finally identify the weak points in this reasoning.

  ### 1. Reconstructing the Implicit Theory of Value

  The ecosystem you describe (market, conservation, museums) does not operate on a single unified theory, but the **market's authenticity premium**, when combined with **conservation practices**, strictly presupposes the **Causal-Historical (Ontological) View**.

  Here is the breakdown of the three candidates you proposed:

  *   **The Epistemic/Experience View:** Value lies in the viewer's experience; knowing an object is a forgery degrades that experience.
  *   **The Institutional View:** Value is a status conferred by the "Artworld"; the premium is a social fact.
  *   **The Causal-Historical View:** The physical history of the object (its genesis by the artist's hand) is an intrinsic property of the work; a forgery is ontologically incomplete regardless of perception.

  **What the Practice Strictly Presupposes:**
  The practice of **conservation** is the deciding factor. If the value were purely experiential (Epistemic View), a degraded original (cracked paint, darkened varnish) should be discarded in favor of a perfect, fresh forgery that provides a superior visual experience. If the value were purely institutional (Institutional View), the museum could simply "re-confer" status onto a perfect copy.

  However, conservators spend millions to stabilize a degraded original rather than replace it. This strictly presupposes that **the causal history is part of the object's identity.** The market premium aligns with this: you are paying for the *relic*, not just the *image*. Therefore, the combined practice presupposes that a perfect forgery is **genuinely worse** (ontologically deficient), not merely *known* to be worse.

  **What Merely Fits Well:**
  The **market pricing behavior alone** is underdetermined. The fact that prices collapse when a forgery is exposed fits equally well with the Epistemic View (buyers feel their experience is ruined) and the Institutional View (buyers fear social embarrassment or loss of resale status). The price collapse does not prove the object *is* worse, only that it is *valued* less.

  **Where the Practice is Philosophically Underdetermined:**
  The **museum's study of forgeries** is underdetermined. Historians study forgeries to understand the forger, the period, or the technique. This fits the Institutional View (the forgery has a new context) and the Epistemic View (the visual data is identical). It does not contradict the Causal-Historical view, provided the forgery is labeled as such. However, the fact that museums *exhibit* originals even when they are hard to see (behind thick glass, in low light) while keeping better-looking copies in storage suggests the Causal-Historical view overrides the Epistemic view in curatorial hierarchy.

  ### 2. Counterfactual: If the "Knowledge Changes Experience" View Were True

  If the art world genuinely operated on the theory that value lies *purely* in the visual experience, and the price premium was solely due to the psychological impact of knowledge, the practices of auction houses, conservators, and museums would change radically.

  *   **Conservators:** They would adopt a "Replacement Protocol." Once an original degraded beyond a certain threshold of visual fidelity, it would be retired to an archive, and a scientifically perfect replica would be created to take its place on the wall. The goal would be to maximize the viewer's aesthetic experience, not preserve the relic.
  *   **Auction Houses:** They would sell "Certified Visual Equivalents." A perfect forgery would be marketed not as a "fake" (pejorative) but as a "High-Fidelity Reproduction." The catalog would state: *"Visually indistinguishable from the 1665 original. Offers the same aesthetic experience at 1% of the cost."* The price gap would narrow significantly, reflecting only the cost of labor and materials, not an ontological chasm.
  *   **Museums:** Display policies would prioritize visibility. If the original *Girl with a Pearl Earring* is too fragile to travel or requires dim lighting that obscures the brushwork, it would be locked away. A perfect, robust copy would tour the world. The "pilgrimage" to see the original would be understood as a fetish, not an aesthetic necessity.

  The fact that none of these things happen confirms that the "Knowledge Changes Experience" view is **not** the operative theory, despite how well it explains the psychology of the buyer.

  ### 3. Where the Reasoning is Most Likely to Fail

  My reconstruction relies on the assumption that the market and institutions are primarily motivated by **aesthetic or historical value**. There are two specific considerations that would change my verdict:

  **A. The Investment/Scarcity Argument (The Economic Failure)**
  If the authenticity premium is driven purely by **investment speculation** rather than aesthetic or historical reverence, my philosophical reconstruction collapses.
  *   *Why:* Financial markets rely on scarcity and fungibility. A Vermeer is valuable because there are only ~35 of them. If perfect forgeries were admitted as "equivalents," the supply would become infinite, and the asset class would crash.
  *   *Impact on Verdict:* If this is true, the market does *not* presuppose the Causal-Historical view. It presupposes **Artificial Scarcity**. The "ontological" language is just marketing cover for a monopoly on supply. In this scenario, conservators restore originals not because of their history, but to maintain the scarcity of the "brand."
  *   *Test:* If buyers continued to pay the premium for the original even when they were *alone* and knew no one else would ever know the difference (removing the resale/investment value), the Ontological view holds. If the price collapses only because resale value drops, the Investment view holds.

  **B. The "Magic of Provenance" (The Institutional Failure)**
  My reasoning assumes the "Institutional View" is weaker than the "Causal-Historical View." However, Arthur Danto argued that the "Artworld" constitutes the work of art.
  *   *Why:* It is possible that the causal history matters *only because* the Institution says it matters. The value isn't in the physical atoms or the history itself, but in the **narrative status**.
  *   *Impact on Verdict:* If the value is purely narrative, then the "Causal-Historical" view is a superstition the market tells itself. The practice wouldn't change (they would still restore originals), but the *explanation* would. The "loss" of an original is the loss of a unique story, not a unique object.
  *   *Test:* If a perfect forgery were created *before* the original was lost, and the art world collectively agreed to "transfer" the status to the forgery (a "coronation"), would the forgery regain the value? If yes, the value is Institutional. If no, the value is Causal-Historical.

  **Conclusion on Failure:**
  The reasoning is most vulnerable to the **Investment/Scarcity Argument**. If the premium is essentially a mechanism to maintain asset liquidity and exclusivity, then asking whether the value is "ontological" or "experiential" is a category error. The market isn't making a philosophical claim; it is enforcing a supply constraint. In that case, the "practice" presupposes nothing about art, only about economics.
