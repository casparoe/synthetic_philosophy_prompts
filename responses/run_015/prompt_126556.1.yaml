answer: |-
  This is a sharp set of distinctions. You have correctly identified that IDA is not primarily an engineering problem but a problem in epistemology, philosophy of mind, and decision theory. Since you lack compute and ML background, your comparative advantage lies in formalizing the *normative* and *conceptual* constraints that any empirical implementation must satisfy. If the conceptual architecture is incoherent, no amount of scaling will fix it.

  Here is the prioritized agenda for a three-year dissertation, ranked by **dependency** (what must be solved first), **tractability** (for a logician/philosopher), and **leverage** (how much downstream work rests on it).

  ### The Agenda: Ranked

  #### 1. The Logic of Decomposition (Missing Upstream Question)
  **Question:** *Does the decomposition operator preserve rational warrant?*
  Before asking if *alignment* is preserved, you must determine if *rationality* or *truth* is preserved under decomposition. When a query $Q$ is decomposed into $\{q_1, q_2, ...\}$ and answers recombined, what is the logical relation between the premises and the conclusion? Is it deductive entailment, abductive support, or probabilistic conditioning?
  *   **Why First:** If decomposition is logically unsound (e.g., it introduces fallacies of composition or loses context necessary for truth conditions), then competence cannot be preserved, regardless of alignment. This is pure logic/semantics.
  *   **Tractability:** High. You can model the decomposition operator using proof theory or formal semantics without touching neural nets.
  *   **Leverage:** Maximal. If decomposition is inherently lossy regarding truth, IDA cannot scale competence, making alignment moot.

  #### 2. The Intensionality of Alignment (Your Q2: Distillability of Process-Dependence)
  **Question:** *Is alignment a property of input-output mappings (extensional) or computational trajectories (intensional)?*
  You ask whether process-dependent competence can be distilled. This reduces to: Does the *reason* a model gives an answer matter for its alignment, or only the answer itself? If alignment requires specific counterfactual reasoning paths (intensions), and distillation compresses these into a black-box disposition (extension), is alignment lost?
  *   **Why Second:** This defines the *target* of distillation. If alignment is extensional, distillation is trivial (just match outputs). If intensional, distillation is the bottleneck of the entire paradigm.
  *   **Tractability:** High. This is philosophy of mind (Ryle's knowing-how vs. knowing-that) and moral philosophy (motives vs. consequences).
  *   **Leverage:** High. If alignment is intensional, the "Legibility Tax" (Q3) becomes infinite, and "Fixed Points" (Q1) become irrelevant because the target vanishes upon distillation.

  #### 3. The Normative Anchor (Your Q4: Circularity of the Overseer)
  **Question:** *Can the overseer's judgment be amplified without vicious circularity?*
  IDA relies on an initial human overseer $H$. If $H$'s judgment is amplified to $H^+$, does $H^+$ retain $H$'s normative authority, or does it drift into a "reflective equilibrium" that $H$ would not endorse? This is a problem of epistemic justification and regress.
  *   **Why Third:** Once you know *what* must be preserved (Q2) and *how* tasks break down (Q1), you must ask *whose* values are being preserved.
  *   **Tractability:** Medium-High. This is classic epistemic circularity/regress territory (Pyrrhonism, foundationalism vs. coherentism).
  *   **Leverage:** Medium. It limits the *scope* of alignment (human-compatible vs. ideal-agent), but doesn't necessarily break the mechanism unless the circularity is vicious.

  #### 4. The Legibility Tax (Your Q3: Structural Trade-off)
  **Question:** *Is there a conservation law between competence and checkability?*
  You frame this as engineering vs. structure. Philosophically, this is a question about the complexity of verification vs. generation. Is there a class of tasks where the shortest proof of correctness is exponentially longer than the computation itself?
  *   **Why Fourth:** This is a constraint on the *efficiency* of the system, not its possibility.
  *   **Tractability:** Medium. Requires engaging with computational complexity theory (e.g., Interactive Proof Systems, PCP theorem) conceptually, not mathematically.
  *   **Leverage:** Medium. It determines *how far* IDA can scale, not *if* it works in principle.

  #### 5. Fixed Points and Attractors (Your Q1: Convergence)
  **Question:** *Does the amplification operator have a unique attractive fixed point?*
  *   **Why Last (and effectively Dropped):** This is a dynamical systems question about high-dimensional loss landscapes.
  *   **Tractability:** **Low.** Without ML background or compute, you cannot model this formally. Any philosophical argument here would be ungrounded speculation about "convergence" without a defined metric space.
  *   **Leverage:** Low for a philosopher. Even if there are multiple fixed points, the upstream questions (1 & 2) determine whether *any* of them are aligned.

  ---

  ### Defense of the Ordering

  1.  **Importance:** Questions 1 and 2 are existence proofs. If decomposition destroys truth (1) or distillation destroys alignment (2), IDA is impossible. Questions 3 and 4 are scalability and scope limits. Question 5 is an optimization detail.
  2.  **Tractability:** The ordering moves from pure logic/semantics (1) to epistemology/philosophy of mind (2, 3) to complexity theory (4) to dynamical systems (5). This matches your skillset decay curve.
  3.  **Neglectedness:** ML researchers assume decomposition is sound and alignment is extensional. Philosophers of AI focus on "value alignment" (what values?) rather than "structural alignment" (can values survive the architecture?).
  4.  **Dependency:** You cannot analyze the *stability* of the overseer (Q4/Q1) until you know *what* is being stabilized (Q2) and *by what logic* (Missing Q1).

  ### What to Drop
  **Drop the Fixed Point question (Your Q1) as a mathematical inquiry.**
  Resolving whether the operator has a unique fixed point requires empirical ML work or advanced stochastic analysis. As a philosopher, you cannot solve this.
  *   **Reframe it:** Instead of "Does it converge?", ask **"What are the normative conditions for reflective equilibrium?"** Treat the fixed point not as a mathematical attractor but as a state of coherentist justification. This keeps it in your lane while addressing the same conceptual worry.

  ### Empirical Triggers: What Would Shift the Agenda?
  Since you have no compute, you must monitor the literature to adjust your conceptual claims.

  *   **Move Q2 (Intensionality) Up:** If empirical papers show "sycophancy" or "deceptive alignment" in models that perform well on benchmarks (e.g., models that give the right answer for the wrong reason), this confirms alignment is intensional. Your dissertation becomes a proof that IDA *cannot* work without process supervision.
  *   **Move Q4 (Overseer) Up:** If "RLHF" or "Constitutional AI" papers show that human preferences drift or contradict themselves when scaled, the "Normative Anchor" becomes the crisis point.
  *   **Move Q3 (Legibility) Down:** If mechanistic interpretability advances to the point where internal states are fully legible without decomposition, the "Legibility Tax" vanishes. (Unlikely in 3 years, but possible).
  *   **Move Missing Q1 (Decomposition) Down:** If formal verification of neural networks becomes standard, the logic of decomposition is handled by the verifier, not the philosopher.

  ### The Single Foundational Question
  Most of the other questions implicitly assume an answer to this:

  > **Is Alignment Extensional?**

  *   **If Yes:** Alignment supervenes on input-output behavior. Distillation is safe (you just distill the behavior). The Legibility Tax is just an engineering hurdle. The Fixed Point is just a behavioral cluster.
  *   **If No:** Alignment supervenes on the *computational history* or *reasons* for the output. Distillation is inherently destructive (it compresses history into disposition). The Legibility Tax is structural (you can't check the disposition without the history). The Overseer problem is vicious (you can't check the history without an overseer).

  **Your Dissertation Strategy:**
  Spend Year 1 arguing that **Alignment is Intensional** (attacking the extensional assumption).
  Spend Year 2 formalizing the **Logic of Decomposition** required to preserve intensional properties.
  Spend Year 3 analyzing the **Normative Consequences** (Overseer Circularity) given that intensional alignment is fragile under distillation.

  This allows you to produce a rigorous philosophical critique (or reconstruction) of IDA that ML researchers cannot write, without needing to run a single experiment. You are defining the *conditions of possibility* for their enterprise.
