prompt: |-
  I'm a philosophy PhD student — logic and decision theory, essentially no ML background and no access to compute — and I have to commit to a dissertation topic in the next few weeks on the conceptual foundations of iterated amplification and distillation. I want an agenda rather than a survey: with roughly three years and a philosopher's tools, which questions about whether decomposition preserves alignment and competence should I actually work on, and in what order?

  Let me give you the distinctions I've arrived at so you can see what I think the terrain is. Call an amplified system's competence *process-dependent* when its correct answers depend on the oversight procedure rather than on capacities any single distilled model could have on its own. Call the *legibility tax* the gap between the decompositions that genuinely preserve competence on a hard task and the ones whose intermediate outputs a human overseer can actually check. Say the loop is in a *stable regime* when per-round distillation error is smaller than what amplification's checking-and-recombination step can correct, and in a *drift regime* when it is larger.

  The candidates I'd rank: whether the amplification operator has a unique attractive fixed point or whether the limit depends on the model you bootstrap from, and what either answer implies for what alignment is even supposed to be inherited by; whether process-dependent competence can be distilled at all, or whether distillation necessarily converts a procedure into a disposition and in doing so loses whatever the procedure was contributing; whether the legibility tax is a contingent engineering limitation or something structural, a conservation law trading competence against checkability; and whether the overseer's own judgment can itself be amplified without circularity, given that the overseer is what the operator's alignment is anchored to.

  Rank these, plus anything more upstream that I'm missing, and defend the ordering explicitly: importance, tractability for someone with my background rather than an ML person's, neglectedness, and how many other questions turn on each answer. Tell me which you'd drop because resolving it wouldn't move anything downstream, and what kind of result over the next few years — from work on whether models verify better than they generate, or on whether reported intermediate reasoning is faithful — would move each up or down. Most of all I want to know which single question most of the others are implicitly assuming an answer to.
reasoning: |-
  Here's a thinking process that leads to the suggested dissertation agenda:

