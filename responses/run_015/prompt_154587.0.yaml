prompt: |-
  I run a grad ethics seminar, about 14 people, one 90-minute session. Design an in-class deliberation game that makes them feel Scanlon's contractualist tension with aggregation — not just discuss it, but hit the wall themselves. Invent a concrete scenario, like a fictional municipal board allocating scarce cooling resources during an extreme heat event, with role-cards for affected residents. Each card should include a hidden "reasonableness threshold" and a specific vulnerability, plus a shared rule that any proposed allocation principle must first be justifiable to each individual affected party before any aggregate counting kicks in. Add this twist: there's a "contractualist ceiling" on burden any one person can be asked to bear, but the ceiling's exact value has to be set by unanimous consent of all roles, which forces a meta-level deadlock exactly when aggregation looks like the only way out. Give me round-by-round rules, materials (index cards, a whiteboard layout), a social-stakes payoff scheme with no real money (public justification rounds, reputation markers), and a timeline. Then a debrief that maps the deadlock moments onto Scanlon's idea of justifiability to each, and be honest about which feature — probably that reasons genuinely don't aggregate across persons — the activity can only approximate and you (the facilitator) still have to supply. Don't ask for citations or a reading list; just make it runnable. I also want you to note what will predictably go wrong the first time, like people secretly weighing totals despite the rules. Oh and please excuse any typos — I wrote "recieve" in my notes earlier so keep the tone casual.
