answer: |-
  Here's a runnable design for **"The Heat Dome Protocol."** It's built to make your students feel the friction of Scanlonian contractualism physically and socially, not just intellectually. The goal isn't to solve the problem, but to hit the wall where aggregation usually saves the day—and find the door locked.

  Tone is kept casual so you can copy-paste this into your prep notes without sounding like a textbook. (And no worries on the typos—we've all been there.)

  ---

  # Game Title: The Heat Dome Protocol
  **Time:** 90 Minutes
  **Players:** 14 (Perfect for one seminar table)
  **Goal:** Allocate scarce cooling resources without violating the "Contractualist Ceiling."
  **Core Tension:** Individual Veto Power vs. Aggregate Welfare.

  ## 1. Materials Needed
  *   **14 Role Cards** (Index cards, see examples below).
  *   **Standing Chips:** 3 per person (poker chips, paper clips, or just tally marks on the board).
  *   **Whiteboard:** Divided into three sections: *Proposals*, *Veto Log*, *Survival Count*.
  *   **Timer:** Visible to all.
  *   **Resource Tokens:** 100 "Cooling Units" (can be abstract numbers).

  ## 2. The Scenario
  A permanent heat dome has hit the city. The grid is failing. You are the **Residential Council**.
  *   **Total Cooling Units Available:** 100.
  *   **Total Need:** 140 units for everyone to be "safe."
  *   **The Crisis:** You must decide how to distribute the 100 units.
  *   **The Constraint:** You cannot simply maximize survival. You must agree on a **Principle of Allocation** that no one can *reasonably reject*.

  ## 3. Role Cards (The Hidden Info)
  Each student gets one card. They keep the **Threshold** hidden until a proposal directly threatens them.

  *   **Card Type A (The Fragile) - 3 Players:**
      *   *Vulnerability:* Pre-existing respiratory condition.
      *   *Hidden Threshold:* Cannot bear more than **2 units** of heat burden.
      *   *Need:* 10 units to survive.
  *   **Card Type B (The Robust) - 8 Players:**
      *   *Vulnerability:* Healthy adults.
      *   *Hidden Threshold:* Can bear up to **8 units** of heat burden.
      *   *Need:* 6 units to be comfortable, 4 to survive.
  *   **Card Type C (The Caregiver) - 2 Players:**
      *   *Vulnerability:* Responsible for 3 non-voting dependents each.
      *   *Hidden Threshold:* Cannot bear more than **4 units** (dependents die if they fail).
      *   *Need:* 12 units (to cover dependents).
  *   **Card Type D (The Grid Tech) - 1 Player:**
      *   *Vulnerability:* Only person who can fix the grid eventually.
      *   *Hidden Threshold:* Can bear **10 units**, but needs 15 units now to work.
      *   *Need:* 15 units.

  *(Note: Total need exceeds supply. Someone must suffer.)*

  ## 4. The Rules (The Mechanics of Justifiability)

  ### Rule 1: The Contractualist Ceiling (The Meta-Twist)
  Before allocating any resources, the group must set the **Maximum Permissible Burden (MPB)**.
  *   This is the maximum heat burden any single person can be asked to endure under any principle.
  *   **Requirement:** Unanimous Consent. If even one person says "No," the Ceiling is not set.
  *   **Catch:** If no Ceiling is set within 15 minutes, the grid collapses automatically (everyone loses).

  ### Rule 2: The Reasonable Rejection Veto
  Once a Ceiling is set, you propose allocation principles (e.g., "Lottery," "Need-Based," "Utility-Max").
  *   Any player can **Veto** a proposal.
  *   **Cost of Veto:** You must spend 1 **Standing Chip** to veto.
  *   **Justification:** To spend the chip, you must state a *public reason* why this burden is unreasonable for *you* specifically.
  *   **Arbitration:** If the group feels your reason is just "I want more" (preference) rather than "This violates my threshold/status" (reason), the Facilitator can deny the veto and you lose the chip anyway.
  *   **Win Condition:** Pass a principle that survives 3 rounds of veto attempts without collapsing.

  ### Rule 3: Social Stakes (Standing Chips)
  *   Start with 3 Chips.
  *   If you reach 0 Chips, you are "Silenced." You can still suffer the consequences, but you lose veto power. (This mimics the loss of moral standing when arguing unreasonably).
  *   **Payoff:** At the end, players with chips left + who survived = "Successful Deliberators." Players who survived but have 0 chips = "Survivors with Stained Reputation." Players who died = "Failed."

  ## 5. Timeline (90 Minutes)

  **0:00–0:10 | Setup & Role Absorption**
  *   Hand out cards. Give them 5 mins to read silently.
  *   Explain the rules. Emphasize: *You are not trying to save the most people. You are trying to find a principle no one can reasonably reject.*
  *   Distribute 3 Standing Chips to each.

  **0:10–0:30 | Round 1: The Ceiling Negotiation (The Meta-Deadlock)**
  *   Task: Set the Maximum Permissible Burden (MPB).
  *   Dynamics: The Fragile (Type A) need a low ceiling (e.g., 2) to survive. The Robust (Type B) know that if the ceiling is 2, the Grid Tech can't work and the Caregivers fail, leading to total collapse. They want a high ceiling (e.g., 8) to allow aggregation of burden.
  *   **Facilitator Move:** If they stall at 25 mins, call a "Grid Failure Warning." Remind them: *Unanimous consent is required. Aggregation is banned here.*
  *   *Likely Outcome:* They either fail to set a ceiling (chaos) or set it arbitrarily high, betraying the Fragile.

  **0:30–1:00 | Round 2: Allocation Proposals (The Object-Level Deadlock)**
  *   Task: Propose how to spend the 100 units within the Ceiling.
  *   Dynamics: Someone will propose "Save the Most Lives" (Utilitarian). The Fragile or Caregivers should veto this because it asks them to bear a burden above their threshold for the sake of the majority.
  *   **Standing Chip Mechanic:** Enforce the justification rule hard. If a Robust player says "We should save the Tech because it helps everyone," that's aggregation. A Fragile player should veto: "That asks me to die for the aggregate. I reasonably reject this."
  *   Watch them try to count heads. Stop them. "Scanlon doesn't count heads. Can *this* person reject it?"

  **1:00–1:15 | The Collapse & Consequences**
  *   Reveal the Hidden Thresholds.
  *   Calculate who survives based on the final agreed principle (or lack thereof).
  *   Tally Standing Chips.

  **1:15–1:30 | Debrief (The Map)**
  *   See below.

  ## 6. Predictable Failures (What Will Go Wrong)
  1.  **Secret Aggregation:** Students will try to sneak utilitarianism in. "Well, if we save the Tech, *everyone* benefits eventually."
      *   *Fix:* Interrupt. "Does this specific principle impose a burden on Person A that exceeds their threshold? Yes? Then the aggregate benefit doesn't matter yet. Can Person A reasonably reject?"
  2.  **The Ceiling Stall:** They will spend 40 minutes on the Ceiling and run out of time for allocation.
      *   *Fix:* This is actually good. It proves the point. The meta-rule (unanimity) is where contractualism bites. Let them feel the panic of the timer.
  3.  **Veto Abuse:** Someone will veto everything to hoard Standing Chips.
      *   *Fix:* Use the "Reasonableness" arbitration. If they can't articulate a burden-based reason, they lose the chip without stopping the proposal.
  4.  **Coalition Building:** The 8 Robust players might gang up on the 3 Fragile.
      *   *Fix:* Remind them: *Unanimous consent.* The 3 Fragile hold absolute veto power over the Ceiling. Power is inverted compared to voting.

  ## 7. Debrief Guide (Mapping to Scanlon)
  Don't lecture. Ask these questions to draw the theory out of their frustration.

  1.  **The Ceiling Deadlock:** "When you were setting the Maximum Burden, why couldn't the majority just outvote the Fragile?"
      *   *Point:* Contractualism isn't voting. It's mutual recognition. The Fragile had a veto because the principle affects them fundamentally.
  2.  **The Aggregation Wall:** "Did anyone try to argue that the suffering of the many outweighs the suffering of the one? How did that land?"
      *   *Point:* Scanlon says numbers don't always count. If the burden on the one is severe enough (death vs. discomfort), adding more people with mild discomfort doesn't override the one.
  3.  **The Standing Chips:** "How did it feel to have to justify your veto publicly? Did it change *what* reasons you gave?"
      *   *Point:* This mimics the "general justification" requirement. You can't just say 'I want.' You need a reason others *could* accept as valid, even if they disagree with the outcome.
  4.  **The Limitation (Facilitator Honesty):** "Where did this game fail to capture the theory?"
      *   *Point:* The game made you care about Chips and Survival. Scanlon cares about **Reasons**. In the game, you vetoed to save your skin. In contractualism, you reject a principle because it violates a duty of mutual respect. The game simulates the *structure* of the veto, but I (the facilitator) have to supply the *moral weight* of the reason.

  ## 8. Facilitator Cheat Sheet (What You Supply)
  The game approximates the *procedure*, but you need to supply the *philosophy* during the debrief.

  *   **Approximation:** The "Unanimous Ceiling" mechanic forces them to experience the *power* of the individual veto.
  *   **What's Missing:** The game makes them act out of self-interest (survival). Scanlon assumes people are motivated by the desire to justify themselves to others.
  *   **Your Job:** When they debrief, point out: "You vetoed because you wanted to live. Scanlon says you veto because the principle treats you as less than equal. The outcome is similar, but the *reason* is what matters for ethics."
  *   **The "Numbers" Problem:** If they ask "But shouldn't we save the 5 instead of the 1?", acknowledge that Scanlon struggles here. The game forces them to sit with that discomfort rather than solving it with math.

  ---

  ### Quick Prep Checklist
  *   [ ] Print/Cut 14 Role Cards (mix the types).
  *   [ ] Grab 42 small objects for chips.
  *   [ ] Draw the Whiteboard layout (Proposals | Veto Log | Survival).
  *   [ ] Set a loud timer on your phone.
  *   [ ] Remind yourself: If they get stuck, don't save them. The frustration is the lesson.

  Good luck with the seminar. Hope the heat dome stays fictional.
