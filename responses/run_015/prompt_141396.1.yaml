answer: |-
  This is a remarkably precise dissection of a stalemate that plagues political economy and development anthropology. You are correct that tabooing the word failed because the disagreement is not merely terminological; it is ontological and teleological. The word "corruption" is doing too much work: it is simultaneously a descriptive category, a moral judgment, and a policy prescription.

  Here is a diagnosis of the stalemate, an evaluation of your proposed test, and a suggestion for what progress might actually look like.

  ### 1. The Diagnosis: It is a Bedrock Disagreement about the Teleology of the State

  You ask if this is verbal, evidentiary, or bedrock. It is **bedrock**, but specifically regarding the *temporal status of the Weberian ideal*.

  *   **Side A (Universalists)** treats the impersonal, rule-bound bureaucracy as the **null hypothesis**. In their view, the "public office" is a distinct category that *ought* to be separated from the private self. Any collapse of that boundary is a pathology (corruption). They view the state as a machine for delivering universal goods; particularism is friction in the gears.
  *   **Side B (Contextualists)** treats the impersonal bureaucracy as a **historical achievement** (or a luxury good). In their view, the "public office" is often a fiction overlaying a reality of kinship and patronage. They view the state as a node in a network of survival; particularism is the lubricant.

  The stalemate persists because Side A argues from *Ideal Theory* (how a functioning modern state should work) while Side B argues from *Non-Ideal Theory* (how humans actually organize under scarcity and risk).

  When Side A says "outcome is worse government," they are measuring against a Weberian baseline. When Side B says "doing the work that contracts... do in rich countries," they are measuring against a Welfare baseline. They are not agreeing on the metric of "worse."

  **The "Legibility Effect" (Your Third Hypothesis) is the Load-Bearing Wall.**
  You suspect this is key, and you are right. Corruption indices (like CPI) do not measure "social welfare loss"; they measure "deviation from Western bureaucratic norms."
  *   A campaign donation in the US is a *legal transfer* that influences allocation.
  *   A bride-price to a chief in a village is an *illegal transfer* that influences allocation.
  *   Structurally, they may be identical (resource transfer $\rightarrow$ preferential treatment).
  *   Legally, one is "participation" and the other is "corruption."

  The debate stalls because Side A insists the legal distinction *matters* (it implies accountability), while Side B insists the legal distinction is *arbitrary* (it implies power).

  ### 2. Evaluating Your Proposed Test

  > *Hold the relational structure fixed... and re-describe it in the vocabulary of something legal and documented in a rich democracy... if the re-description still reads as corruption, the cultural defence was cosmetic, and if it does not, the difference was one of form.*

  This is a strong heuristic, but it will not resolve the debate because **both sides will reject the validity of the translation.**

  *   **Side A's Rejection:** They will argue that you cannot hold the structure fixed while changing the legal context. In a rich democracy, the campaign contribution is (theoretically) transparent, capped, and subject to media scrutiny. The bribe is opaque. Therefore, the *structure* is not fixed; the *accountability mechanism* is part of the structure. They will say: "You have described legal lobbying, which we also consider corruption, just legalized." (See: *The Corruption of American Politics*).
  *   **Side B's Rejection:** They will argue that the *meaning* of the transfer is constituted by the social context, not just the relational structure. A gift to a kin member carries an obligation of reciprocal care that a campaign contribution does not. To translate it as a "contribution" strips it of its social insurance function. They will say: "You have described a market transaction, but this is a social bond."

  **Why the test fails to separate cases:**
  The test assumes that "corruption" is a property of the *transaction*. Both sides actually believe "corruption" is a property of the *system*.
  *   For Side A, a bribe is corrupt because it undermines the *system* of rules.
  *   For Side B, calling it corrupt is an attack on the *system* of survival.

  However, the test **does** succeed in exposing the **Legibility Bias**. If you run this test and Side A admits, "Yes, that US lobbying is also corrupt, but we tolerate it," they concede the moral universalism point. If they say, "No, that is legal," they concede the legibility point. It forces a confession of bias, even if it doesn't solve the definition.

  ### 3. What Would Count as Progress?

  You should not expect progress on the definition. "Corruption" is a political weapon, not a scientific variable. As long as the word is used to mobilize donors or shame governments, the definition will remain contested.

  Progress requires **changing the question from "Is it corruption?" to "What is the transition mechanism?"**

  Here are the three paths to progress, ranked by feasibility:

  **A. The "State-Building" Pivot (Most Promising)**
  Stop asking if patronage is "bad." Ask: *Under what conditions does a patronage network transform into an impersonal bureaucracy without state collapse?*
  *   **The Progress:** Identifying cases where elites voluntarily restricted their own patronage (e.g., 19th century US Pendleton Act, Botswana post-independence, Georgia post-Rose Revolution).
  *   **The Insight:** This moves the debate from morality to **elite incentives**. Side A wants to ban the practice; Side B says you can't. The synthesis is: You can only ban the practice when you provide elites with a credible commitment that they won't be slaughtered by their rivals if they disarm.
  *   **Verdict:** This bypasses the moral argument. It treats patronage as a *coordination equilibrium* among elites rather than a moral failing of individuals.

  **B. The "Functional Equivalence" Audit (Empirically Hard)**
  Conduct the legibility audit you suggested, but quantitatively.
  *   **The Progress:** Measure the *efficiency cost* of particularism in both contexts. Does the kinship network allocate resources *more* efficiently than the market would in that specific context (due to information asymmetry)? Does the lobbying in the US allocate resources *less* efficiently than a technocratic board would?
  *   **The Insight:** If you can show that "legal corruption" in the West has higher deadweight loss than "illegal corruption" in the developing world (in specific sectors), you undermine Side A's moral superiority. If you show the reverse, you undermine Side B's functional defense.
  *   **Verdict:** Data is too noisy. The counterfactual (what the technocratic board *would* have done) is unobservable.

  **C. The Preregistered Prediction (Least Likely to Resolve)**
  *   **The Progress:** Predicting the outcome of an anti-corruption reform.
  *   **The Insight:** If Side A predicts service delivery improves and it collapses, Side B wins. If service delivery improves, Side A wins.
  *   **Verdict:** We have enough data for this already (e.g., anti-corruption commissions in Africa often fail; digitalization in India often succeeds). The problem is interpretation. Side A says "implementation failure." Side B says "structural incompatibility."

  ### 4. Recommendation: Abandon the Category

  The reason the argument hasn't moved in a decade is that "corruption" is a **boundary-maintenance mechanism**.
  *   Side A uses it to police the boundary of the "Modern State."
  *   Side B uses it to police the boundary of "Western Imperialism."

  As long as you argue about the word, you are fighting over the boundary.

  **The Proposal:**
  Adopt the terminology of **Particularism vs. Universalism** (or *Relational Contracting* vs. *Impersonal Exchange*).
  *   **Diagnosis:** All states run on particularism. Developed states have successfully *migrated* certain functions to universalism.
  *   **Research Question:** Not "How do we stop corruption?" but "How do we migrate functions from relational to impersonal contracting without triggering elite violence or service collapse?"

  This allows you to accept Side B's empirical claim (patronage provides insurance) while accepting Side A's normative claim (impersonal rules allow for scale and equity). It turns a moral stalemate into an engineering problem.

  **Summary:**
  1.  **Diagnosis:** Bedrock disagreement on the teleology of the state (Ideal vs. Non-Ideal Theory), exacerbated by Legibility Bias.
  2.  **Test:** Your test exposes the bias but won't settle the definition because the "structure" cannot be isolated from the "institutional context."
  3.  **Progress:** Do not seek a verdict on the definition. Seek a **mechanism of transition**. The only productive question is: *What incentives allow elites to switch from particularistic to universalistic allocation?*

  If you reframe your work around **Elite Transition Equilibria**, you may find that the anthropologists and the NGO workers are actually describing different points on the same curve, rather than opposing truths.
