answer: |-
  ### Part 1: Epidemiological Translation of the Scale Argument

  **Subject:** Surveillance Brief on Potential Adverse Outcome (Sentience) in Macro-Population (Insecta)
  **Objective:** Estimate total burden of adverse events attributable to intervention (pest control/agriculture).

  **1. Case Definition and Prevalence**
  We define the "case" as an individual possessing the biological substrate for subjective experience (sentience). Let $\pi$ be the true prevalence of this condition within the target population ($N$). Current literature suggests $\pi$ is low but non-zero, with wide confidence intervals. However, the population size $N$ is order $10^{18}$.

  **2. Screening Metrics**
  We utilize behavioral and neural markers (nociception, integration) as our screening test.
  *   **Sensitivity ($Se$):** Probability a sentient individual exhibits markers.
  *   **Specificity ($Sp$):** Probability a non-sentient individual does not exhibit markers.
  *   **Positive Predictive Value ($PPV$):** Probability an individual is a true case given a positive test result.
  *   **False Discovery Rate ($FDR$):** $1 - PPV$. The proportion of individuals we classify as cases who are actually non-cases.

  **3. The Scale Calculation (Expected Burden)**
  Standard screening logic focuses on $PPV$ to avoid resource waste on false positives. However, in this surveillance context, the metric of interest is the **Total Expected Case Count ($E[C]$)** exposed to the intervention.

  $$E[C] = N_{\text{exposed}} \times \pi$$

  Even if $\pi$ is negligible (rare disease), if $N_{\text{exposed}}$ is sufficiently large, $E[C]$ exceeds the burden of known high-prevalence conditions in smaller populations (e.g., vertebrates).

  **4. Number-Needed-to-Harm ($NNH$)**
  Define the intervention as "lethal control."
  $$NNH = \frac{1}{\pi}$$
  This represents the number of individuals we must intervene upon to guarantee one adverse outcome (harming a sentient case). While $NNH$ is high (due to low $\pi$), the total volume of interventions ($I$) is massive.
  $$\text{Total Harms} = \frac{I}{NNH} = I \times \pi$$
  The argument posits that $I$ is large enough that Total Harms remains morally catastrophic, regardless of a high $NNH$.

  **5. Population Attributable Fraction ($PAF$)**
  We treat sentience as the "risk factor" for suffering. The $PAF$ estimates the proportion of total suffering in the ecosystem attributable to our intervention.
  $$PAF = \frac{P_e (RR - 1)}{P_e (RR - 1) + 1}$$
  Where $P_e$ is the proportion of the population exposed to intervention. Since $P_e \approx 1$ for managed ecosystems, the $PAF$ approaches 1, assuming the Relative Risk ($RR$) of suffering given intervention is high for cases.

  **6. Decision Threshold**
  Standard screening minimizes total error ($False Positives + False Negatives$). The scale argument proposes shifting the decision threshold to minimize **False Negatives** exclusively, accepting a high $FDR$. This is justified if the cost of a False Negative (ignoring a sentient being) is weighted infinitely higher than the cost of a False Positive (over-protecting a non-sentient being).

  ***

  ### Part 2: Residue Report

  Here is the breakdown of where the epidemiological model holds, where it requires fudging, and where it breaks down completely.

  **1. Clean Mappings**
  *   **$N \times \pi$ Logic:** The core mathematical engine of the scale argument translates perfectly. It is simply an expected value calculation. If you accept the inputs ($N$ and lower-bound $\pi$), the output (Expected Case Count) follows necessarily.
  *   **FDR and PPV:** The relationship between low prevalence and low $PPV$ (even with high specificity) is statistically sound. The argument acknowledges a high $FDR$ but argues it is acceptable given the stakes.
  *   **NNH:** This maps cleanly as the inverse of prevalence. It effectively communicates the "rarity" of the condition per individual interaction.

  **2. The "Binary Case" Fudge**
  *   **The Problem:** Screening assumes a binary state (Disease/No Disease). Sentience is likely a continuous variable (capacity for experience), more like blood pressure or exposure dose than infection status.
  *   **The Fudge:** We forced sentience into a "Case Definition." In reality, we are screening for a *gradient* of moral weight.
  *   **Consequence:** A "False Positive" in screening implies wasted resources. In the moral context, treating a non-sentient bug as sentient has near-zero cost (you just don't kill it). Treating a semi-sentient bug as non-sentient has high cost. The binary model obscures the dose-response relationship of moral weight.

  **3. The Counter-Argument (Base Rate Collapse)**
  *   **The Stat:** If $\pi \to 0$, then $PPV \to 0$ regardless of $Sp$.
  *   **The Break:** In clinical screening, if $PPV$ is too low, you stop screening; the test is useless. The philosophical counter-argument is: "You are acting on noise."
  *   **Does it survive?** Statistically, no. If $\pi$ is truly near-zero, the signal-to-noise ratio is untenable. However, the argument survives *only* if you modify the Loss Function. In biostats, a False Positive and False Negative usually have finite costs. The scale argument implicitly assigns **Infinite Cost** to the False Negative. This breaks the standard screening optimization, which seeks to minimize weighted error, not eliminate one error type at all costs.

  **4. PAF and Independence Assumptions**
  *   **The Assumption:** $PAF$ calculations typically assume independence of risk across the population.
  *   **The Violation:** Sentience is phylogenetically clustered. It is not independent Bernoulli trials across $10^{18}$ insects. It is correlated by taxa (e.g., all Hymenoptera vs. all Coleoptera).
  *   **Impact:** This creates clustering effects. If you miss one cluster, you miss millions of correlated cases. Standard error calculations for $E[C]$ will be underestimated because they assume independence. The variance is much higher than the binomial model suggests. You cannot treat the insect population as $N$ independent subjects; it is $K$ species with $n_k$ correlated individuals.

  **5. Uncertainty as Obligation (The Hard Residue)**
  *   **The Claim:** Philosophers argue that *uncertainty itself* generates an obligation to act (Precautionary Principle), distinct from Expected Value.
  *   **Statistical Analog:** None. In biostats, uncertainty widens Confidence Intervals or reduces Power. It never *increases* the estimated effect size or mandates intervention in the absence of significance.
  *   **The Mismatch:** Screening ethics dictates that if $p > \alpha$, you intervene. If $p < \alpha$, you do not (or you gather more data). The philosophical claim is that when the *variance* is high and the *tail risk* is catastrophic, you must intervene even if the mean estimate is low.
  *   **Verdict:** This is pure residue. There is no statistical counterpart to "epistemic humility requiring action." Statistics quantifies uncertainty; it does not prescribe behavior based on the *nature* of that uncertainty, only the magnitude. This requires a utility function external to the statistics (e.g., risk-averse utility > risk-neutral utility).

  **Summary**
  The translation works for the **arithmetic** of the scale argument (Total Burden = $N \times \pi$). It fails on the **inference** logic. Standard screening minimizes total misclassification; this argument demands minimizing False Negatives regardless of False Positives. This is not a screening problem; it is a **risk-management problem with asymmetric loss functions**. The "uncertainty as obligation" claim has no statistical analog; it is a normative constraint imposed *on* the statistics, not derived *from* them.
