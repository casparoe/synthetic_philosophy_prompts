answer: |-
  This is a profound hermeneutical puzzle that cuts to the heart of Augustine's project in *De doctrina christiana*. You have identified a tension that modern literary theory often frames as the conflict between *intentionalism* (meaning is what the author meant) and *coherentism* or *reader-response* (meaning is what makes the text work within a system).

  However, to answer your first question: Augustine does not view these commitments as contradictory, nor is the appeal to intention merely rhetorical masking. The coherence relies on his specific theological ontology of authorship and truth. To answer your second question regarding boundary cases (statutes, AI), applying Augustine's framework requires shifting from a *psychological* model of intention to a *teleological* one.

  Here is an analysis of how these commitments cohere in Augustine, and how they fare when the unitary author vanishes.

  ### 1. The Coherence of Intention and Charity in Augustine

  The apparent conflict dissolves when we recognize that for Augustine, "authorial intention" is not a singular, psychological event located solely in the human scribe's mind. It is layered.

  **The Dual Authorship**
  Augustine operates with a doctrine of dual authorship. The human writer is an instrument, but the primary Author of Scripture is the Holy Spirit. Therefore, the "author's intended meaning" is ultimately the *Divine* intended meaning. Since God is Truth and God is Charity (*1 John 4:8*), the Divine Author *cannot* intend a meaning that contradicts charity.

  **The Principled Criterion**
  You ask if there is a principled criterion for when grammar yields to context. There is: **The Rule of Charity itself is the criterion for intention.**
  Augustine argues in Book III that if a literal reading leads to uncharity (e.g., commanding hatred, idolatry, or immorality), it is logically impossible for that to be the intended meaning, because the Author (God) is good. Therefore, a reading that violates charity is, by definition, a misunderstanding of the author's intent.
  *   **Grammar** serves the **Sign**.
  *   **Charity** reveals the **Thing (*Res*)**.
  *   Since the *Sign* exists only to point to the *Res*, any grammatical reading that obscures the *Res* has failed to identify the Sign correctly.

  Thus, Augustine is not overriding intention with communal norms; he is using the normative nature of the Author to correct the grammatical data. It is not "masking"; it is a hierarchical epistemology where theological truth conditions semantic possibility.

  **Plurisignification**
  Furthermore, Augustine allows for *plurisignification*. In Book III, he suggests that if a passage is obscure, and a reader derives a meaning that builds up charity, even if it is not the *exact* meaning the human scribe had in mind, the reader has not erred. Why? Because the Holy Spirit, the ultimate Author, foresaw that interpretation and intended it for that reader's edification.
  *   **Modern Intentionalism:** Success = Matching the historical psychological state of the writer.
  *   **Augustinian Intentionalism:** Success = Aligning the reader's mind with the Truth/Charity that the Text mediates.

  So, the appeal to intention is not rhetorical cover; it is simply a different definition of what "meaning" is. Meaning is not a buried artifact to be excavated; it is a living truth to be encountered.

  ### 2. The Boundary Case: Texts Without a Unitary Author

  When we move to your boundary cases—committee-drafted statutes or algorithmic text—we strip Augustine's hermeneutic of its theological anchor (the Holy Spirit) and its psychological anchor (a unitary human mind). Does the framework collapse?

  **The Shift from Psychology to Teleology**
  In the absence of a recoverable psychological intent, Augustine's framework can still function, but only if we generalize "Authorial Intent" into "Textual Teleology."
  *   **Statutes:** In legal hermeneutics, when "legislative intent" is fragmented (due to committees/amendments), courts often pivot to the "purpose of the statute." This is structurally identical to Augustine's move. The "Charity" rule becomes the "Justice" or "Public Good" rule. If a literal reading of a statute leads to an absurdity or injustice (uncharity), the interpreter assumes the "Legislature" (the abstract author) could not have intended it. The "Author" is no longer a mind, but a *function*.
  *   **AI-Generated Text:** This is the harder case. Augustine defines a sign (*signum*) as something which conveys a *mental state* from one mind to another. Strictly speaking, AI output is not a "sign" in the Augustinian sense because there is no mind on the sending end. It is a simulation of a sign.
      *   However, for the *reader*, it functions as a sign. If we apply Augustine's rule here, we must ask: What is the *Res* (Thing) this text points to?
      *   If the text is obscure, and we resolve it via a "Rule of Charity" (e.g., interpreting an AI's ambiguous medical advice in the way most beneficial to the patient), we are no longer recovering intent. We are **imposing coherence**.

  **Abandoning or Generalizing the Hermeneutic?**
  Does this abandon the heart of Augustine's hermeneutic?
  *   **Yes,** if the heart is the *communion of minds* (Human + Divine). Without a mind to commune with, the interpretive act becomes monological. The reader is essentially talking to themselves, using the text as a mirror for their own norms of charity.
  *   **No,** if the heart is the *subordination of the letter to the spirit*. Augustine's enduring insight is that the literal/grammatical surface is not sovereign; it must serve a higher end (Truth/Charity). In secular contexts, this translates to: "The text must serve the community's flourishing."

  **The Risk of Generalization**
  The danger in generalizing Augustine to non-theistic or non-unitary texts is the loss of the **normative anchor**.
  For Augustine, "Charity" is not subjective; it is ontological. It is the nature of God. Therefore, it constrains the interpreter. You cannot claim *anything* is charitable; it must align with Revelation.
  In the case of the Statute or the AI, "Charity" (or Justice/Utility) is contestable. If there is no Divine Author to guarantee the coherence of the text, the "Rule of Charity" risks becoming the "Rule of the Interpreter's Ideology." The interpreter decides what counts as "charitable," and then forces the text to conform. This is exactly the charge modern critics level against Augustine (that he makes the Bible say what he wants). But within his theology, he is protected by the objective reality of God. In the secular boundary case, that protection vanishes.

  ### Conclusion

  Augustine provides a principled criterion: **Ontological Consistency.** A reading is invalid if it posits an Author who contradicts the nature of Truth/Goodness. This is not rhetorical masking, but a theological constraint on semantics.

  When applied to texts without a unitary author (statutes, AI), the framework survives only by transforming from a **hermeneutic of recovery** (finding what was meant) to a **hermeneutic of construction** (making the text useful for the Good).
  *   If we maintain Augustine's insistence that meaning requires a *will*, then AI text admits of no legitimate interpretation, only technical analysis.
  *   If we generalize his insight that *signs must serve res*, then we can interpret these texts, but we admit that we are no longer recovering intent. We are governing the text by communal norms of coherence.

  In this light, your suspicion is partially correct: in the absence of a guaranteed Divine Author, the appeal to "intent" does become rhetorical. It masks the fact that the interpreter is now the ultimate authority on what the text *should* mean, governed not by the author's mind, but by the community's need for coherence and charity. Augustine would likely warn that without the anchor of Divine Truth, this freedom is not liberation, but a drift into subjectivity—but for the secular interpreter, that may be the only available tool.
