prompt: |-
  You're a decision theorist who's good at explaining this to non-philosophers. I'm a backend engineer, zero formal philosophy training, and I got stuck on Hofstadter's superrationality idea and can't get unstuck. Think carefully, and feel free to brainstorm out loud a bit before you give me the answer.

  I run deterministic services, so my instinct is: same code + same input = same output. Here's my gut verdicts on a pile of cases.

  1. Prisoner's dilemma against an exact copy of me, running my code on the same inputs: cooperate. Not close.
  2. Same game, but the other player is a random stranger I'll never see again and I know nothing about them: defect.
  3. Same game, but I find out the other player built their agent from the same open-source repo I did: cooperate, tho less confidently.
  4. Newcomb's problem with a predictor that simulates me: one box.
  5. Voting in a national election: vote, even though I know my one vote wont flip it. My reasoning is basically case 1 applied to people like me.
  6. Same setup as 3, except the repo got patched since, so the other agent's payoff matrix is reversed relative to mine: now I want to defect. But I'm not sure, becuse it's still "my code" in some sense.
  7. Trash on the trail: I pack out the wrapper even when nobody will ever know, and I think "if everyone did that" is a legitimate reason here, not a confused one.

  The principle I keep reaching for is roughly: act as if everyone running your decision procedure in a structurally identical situation makes the same choice, since in the relevant sense it *is* the same choice. But I don't think that cleanly separates 2 from 3, and I'm pretty sure it does something weird with 5 and 6.

  So, three things: (a) give me the principle that actually generates these verdicts, precise enough that I could implement it as a check in code — what exactly has to be true about the other player for symmetry to kick in; (b) tell me what it says about two cases I havent settled — a dilemma against a model trained to imitate my past behavior but running completely different code, and whether this kind of reasoning ever licenses me to defect against someone I know has precommitted to cooperating; (c) be straight with me about which of my verdicts it can't save and I have to give up. If you end up with two candidate principles, say which is simpler and what each one costs.
