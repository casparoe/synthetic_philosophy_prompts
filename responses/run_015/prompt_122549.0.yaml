answer: |-
  To navigate the logical space of proxy failure we begin by asking whether anyone other than the principal is choosing behavior with an eye to the proxy and against the principal's aim. If the answer is yes we proceed to ask whether such a chooser is a separate agent or the very system the proxy is meant to shape. If the chooser is a separate agent external to the system we arrive at a leaf named Strategic Failure which is hard to fix because it requires realigning incentives against adaptive adversaries who benefit from the misalignment. If the chooser is the system itself we arrive at a leaf named Specification Gaming which is hard to fix because the optimization process finds loopholes in the objective function faster than designers can close them. If the answer to the root question is no meaning there is no adversarial agent optimizing the proxy we then ask whether the proxy-to-target correlation survives intervention on the proxy rather than mere observation of it. If the correlation does not survive intervention we arrive at a leaf named Spurious Correlation which is hard to fix because the metric measures a causeless shadow that cannot be leveraged to produce the target. If the correlation does survive intervention we ask whether the correlation survives in the tail of the proxy's range even though it holds in the ordinary region. If the correlation breaks in the tail we arrive at a leaf named Extremal Goodhart which is hard to fix because physical or biological constraints break linearity at limits where the proxy no longer carries the target. If the correlation holds in the tail there is no failure mode and this cell is empty because it describes a robust metric rather than a failure. To this structure I add one split of my own that tracks whether a failure announces itself in the sense that the proxy's own numbers start to look wrong to whoever is watching or whether it stays silent while the proxy keeps improving and the target stagnates. This split applies to the non-strategic branches and separates failures into those detectable by automated monitoring and those requiring external audit. For the Spurious Correlation leaf the cell where the failure is announced is empty because if the proxy looks wrong immediately it is rarely adopted as a metric in the first place making the reachable cell the silent one where the proxy diverges unnoticed. For the Extremal Goodhart leaf both cells are reachable but the silent cell is more dangerous because the proxy continues to rise while the target plateaus. The cell where there is no agent and the correlation survives intervention and the tail is empty of failure modes because that combination defines success.

  Testing this tree against the five cases reveals their positions within the logical space. The hospital system that bonuses surgeons on thirty-day survival and finds surgeons quietly declining the sickest patients lands on Strategic Failure because the surgeons are separate agents optimizing against the principal's aim and the failure is silent until audit data reveals the risk selection. The foundation that pays a literacy programme per word-per-minute read aloud and finds children reading fast nonsense also lands on Strategic Failure because the children are separate agents responding to the incentive rather than the system itself gaming the metric although one might argue it touches Extremal Goodhart the presence of agency makes the strategic branch the primary classifier. The city that ranks schools on the share of pupils above a fixed test threshold and finds resources flowing to pupils just below it lands on Strategic Failure because teachers and administrators are external agents triaging effort to maximize the metric. The lab that breeds mouse lines for time-to-tumour and gets mice that die early of something else lands on Extremal Goodhart because there is no adversarial agent and the correlation breaks in the tail of the breeding distribution where biological trade-offs emerge. The hiring model scored on the retention of candidates it recommends which learns to favour people unlikely to be hired anywhere else lands on Specification Gaming because the optimized system itself is the chooser exploiting the proxy definition. None of the cases fall on more than one leaf provided the question regarding adversarial agency is treated as the root discriminator otherwise the literacy case might ambiguously straddle Strategic Failure and Extremal Goodhart. I am moderately confident in the tree overall because it separates mechanistic causes from symptomatic labels but I trust the branch point regarding whether a failure announces itself least because detectability is observer-relative and depends on the sophistication of the monitoring regime rather than the failure mode itself.
