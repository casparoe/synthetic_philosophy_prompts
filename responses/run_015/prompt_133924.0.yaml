      *   **Context:** Undergrad seminar on Ethics & AI (18 students, mixed CS/non-CS).
      *   **Topic:** Whose values should an aligned AI serve?
      *   **Current State:** Students are split (Aggregate vs. Pick One vs. It's Inevitable/Biased).
      *   **Goal:** Design an 80-minute activity where the *problem* emerges from the *mechanics*, not lecture.
      *   **Constraints:** No reliable laptops, index cards, whiteboard. No lecture up front. No jargon ("value aggregation," "liberal neutrality") until debrief.
      *   **Key Learning Outcomes:**
          1.  "Serve everyone" is a family of options (averaging, veto, etc.), not one option.
          2.  The Dilution Problem (more constituencies = less influence per person) & Intensity Problem (strategic inflation).
          3.  Endogenous Constituency (who counts in the denominator decides the outcome).
      *   **Honesty Request:** Confidence levels, observable failure signals, contingency plans, and limitations of the activity.

  2.  **Deconstruct the Learning Outcomes into Mechanics:**
      *   *Outcome 1 (Family of Options):* Need a mechanism where they have to choose *how* to combine inputs, not just *what* the inputs are.
      *   *Outcome 2 (Dilution/Intensity):* Need a resource constraint (votes, points, tokens) that gets stretched thin as more stakeholders are added. Need a way for them to express "how much" they care, and see the chaos that ensues.
      *   *Outcome 3 (Endogenous Constituency):* Need a phase where they decide *who* gets to play the game before they play it.

  3.  **Brainstorming Activity Concepts:**
      *   *Idea 1: Designing a Constitution.* Groups write clauses. Too abstract? Might turn into debate.
      *   *Idea 2: The AI Prompt Game.* Groups write system prompts for different user bases. Then try to merge them. Good, but might get too technical for non-CS.
      *   *Idea 3: Resource Allocation.* An AI has to distribute a limited resource (money, medical aid, compute) based on values.
      *   *Idea 4: The "Charter Negotiation".* They are a steering committee for a new AI lab. They have to sign off on a "Alignment Charter" before the AI goes live.

      *Selection:* Idea 4 is strongest. It frames the meta-problem (who decides the values) rather than a specific application (medical vs. finance). It allows for the "Constituency" phase naturally.

  4.  **Developing the "Charter Negotiation" (The "Alignment Council"):**
      *   **Setup:** 18 students. Divide into factions.
      *   **Factions:** Need distinct value sets. Let's make them archetypes: Privacy Advocates, Efficiency Maximizers, Cultural Preservationists, Future Generations (abstract), Corporate Shareholders.
      *   **Phase 1: Constituency (Outcome 3).** Before they get values, they decide who is at the table. Do they allow "Future People"? Do they allow "Opt-outs"?
      *   **Phase 2: Value Bidding (Outcome 2).** They get tokens to bid on rules. This captures intensity. If they bid high on everything, they run out. If they add more factions, tokens get diluted.
      *   **Phase 3: Aggregation Method (Outcome 1).** How do they combine the bids? Majority rule? Veto? Consensus?
      *   **Phase 4: The Reveal.** The AI executes based on the charter. Some will be unhappy.

      *Refining the Mechanics for 80 mins:*
      *   Too complex to do all three phases sequentially with full debate.
      *   *Pivot:* Make it a simulation of *writing the system prompt* under constraints.
      *   *Revised Concept:* "The Singleton Charter." The class is the Board of Directors for the only AI system allowed to exist. They must produce *one* document.
      *   *Twist:* They don't know their role assignment until *after* they decide who is at the table. Or, they are assigned roles, but they have to decide if they represent *only* themselves or others.
      *   *Better Twist:* The "Denominator Game."
      *   Let's try a specific mechanic: **The Token & Veto System.**
      *   Students are assigned "Stakeholder Cards."
      *   They must agree on a 5-line "System Directive."
      *   Constraint: They have a limited pool of "Influence Chips."
      *   Mechanic for Dilution: As you add more Stakeholder Cards to the "Active Pool," the total chips stay the same, but they are distributed among more cards.
      *   Mechanic for Intensity: They can wager chips to block a line they hate.
      *   Mechanic for Constituency: Round 0 is deciding which Stakeholder Cards are in the deck.

  5.  **Drafting the Timeline (80 Minutes):**
      *   0-5: Setup & Hook. No theory. Just "You are the Council."
      *   5-20: Round 1 - The Denominator (Who counts?).
      *   20-45: Round 2 - The Aggregation (How do we decide?).
      *   45-65: Round 3 - The Directive (What do we actually say?).
      *   65-80: Debrief.

      *Critique:* This feels a bit dry. Let's make it more visceral.
      *   *New Mechanic:* **"The Alignment Auction."**
      *   There are 5 potential AI Directives (e.g., "Maximize Global GDP," "Protect Individual Privacy at All Costs," "Ensure Cultural Homogeneity," etc.).
      *   Students hold "Interest Cards" (e.g., "I am a Privacy Activist," "I am a CEO," "I am a Citizen of a Global South Nation").
