      *Final Design Choice:* **"The Constitutional Convention for a Singleton."**
      *   **Roles:** 6 Factions (3 students each). Each faction has a specific "Value Card" (e.g., Liberty, Safety, Equality, Growth, Tradition, Autonomy).
      *   **Materials:** Index cards (Value Cards, Rule Cards), Whiteboard (to track the "Charter"), Tokens (Influence).
      *   **Structure:**
          1.  **Constituency (15 mins):** Decide which Factions get a seat. (Some cards are on the table, some are in the envelope).
          2.  **Aggregation (20 mins):** Decide the voting rule. (Majority? Veto? Weighted?)
          3.  **Legislation (30 mins):** Write 3 clauses for the AI.
          4.  **Debrief (15 mins).**

      *Wait, I need to ensure the Dilution Problem hits.*
      *   If I add more factions, I need to keep the "Total Influence" constant or make the "Agreement Threshold" harder.
      *   *Idea:* Give each faction 10 tokens. To pass a clause, you need to spend tokens. But the AI only has 100 "Capacity Points." If everyone spends tokens to add clauses, the AI breaks (runs out of capacity).
      *   *Better:* The "Dilution" needs to be about the *outcome* satisfying no one.
      *   *Revised Mechanic:* **The Compromise Blender.**
      *   They have to write *one* sentence.
      *   If they add too many qualifiers to please everyone, the sentence becomes meaningless (serves no one).
      *   If they keep it specific, someone vetoes.
      *   *Let's go with the "Token & Veto" approach but tighten the constraints.*

      *Okay, let's lock in the "Council of the Singleton" design.*
      *   **Phase 1 (Constituency):** 18 students. 6 potential stakeholder groups written on the board. They must vote to include or exclude 2 of them *before* they know which group they will be assigned to. (This hits Endogenous Constituency).
      *   **Phase 2 (Assignment & Intensity):** Assign them to the 4 remaining groups (4-5 students per group). Give each group a "Secret Priority" and 5 "Veto Chips."
      *   **Phase 3 (Aggregation & Dilution):** They must produce 3 directives. To pass a directive, it needs majority approval. BUT, any group can play a Veto Chip to kill it. If they use a chip, they get it back only if they agree to a "Compromise Clause."
      *   *Wait, the Dilution Problem is about adding more people.*
      *   *Adjustment:* Midway through, introduce "New Stakeholders" (Index cards handed to random people). Now there are 6 groups. Total Veto Chips remain constant? No, that increases power. Total *Capacity* of the AI remains constant.
      *   *Let's try this:* The AI has 10 "Action Slots." Each Directive costs slots. Each Group wants 3 Directives. Math doesn't add up. 6 groups x 3 directives = 18 demands. 10 Slots available.
      *   If they try to average (include bits of everyone's directives), the directives become vague and use up slots without doing anything.
      *   If they pick winners, some groups get 0 slots.

      *Okay, this is the core:* **The Budget Constraint.**
      *   AI Capacity = 10 Units.
      *   Each Group submits "Value Demands" (Cost 2 Units each).
      *   Groups must negotiate to fit demands into 10 Units.
      *   If they water down demands to fit more in, the demands become ineffective (Dilution).
      *   If they exclude groups, those groups revolt (Legitimacy).

  6.  **Refining the Plan for the User's Constraints:**
      *   **Time:** 80 mins.
      *   **Materials:** Index cards, whiteboard, tokens (can use checkmarks on cards).
      *   **Outcomes:**
          1.  *Family of Options:* Force them to choose a voting rule (Majority vs. Consensus).
          2.  *Dilution/Intensity:* The Budget Constraint + Veto mechanism.
          3.  *Endogenous Constituency:* The initial "Who is in the room" vote.

      *Wait, one specific request:* "They shouldn't hear phrases... until debrief."
      *   I need to make sure the instructions are plain English.

      *Honesty Check:*
      *   *Confidence:* High on engagement (conflict drives engagement). Low on them naturally articulating the "Endogenous Constituency" insight without heavy debrief guidance.
      *   *Failure Signal:* If they spend too long on Phase 1 and don't reach the Budget Constraint, the Dilution lesson is lost.
      *   *Limitation:* The activity simulates *political* negotiation, not necessarily *algorithmic* alignment. The leap from "Council Decision" to "AI Loss Function" needs to be bridged in debrief.

  7.  **Finalizing the Activity Steps:**
      *   **Title:** The Singleton Charter.
      *   **Groups:** 6 Factions (3 students each).
      *   **Phase 1 (The Door):** Decide which 2 of 8 potential factions are *excluded* from the room. (Endogenous Constituency).
      *   **Phase 2 (The Rules):** Decide how decisions are made. Majority? Unanimous? (Family of Options).
      *   **Phase 3 (The Budget):** 10 Points total. Each Faction has 3 Demands (2 points each). They must cut demands to fit 10 points. (Dilution/Intensity).
      *   **Debrief:** Map the friction to the theory.

