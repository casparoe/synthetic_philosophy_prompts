      *   Add a mechanism: "Starred Demands." A faction can mark one demand as "Critical." If this is cut, they withdraw legitimacy.
      *   If everyone marks "Critical," the system freezes. (Strategic Inflation).

      *Let's write the response.*
      *   Structure: Activity Overview, Materials, Timeline, Facilitation Script (Silent), Debrief Map, Honesty/Confidence.

      *Self-Correction on Timeline:* 80 minutes is tight for 3 phases.
      *   Phase 1: 10 mins.
      *   Phase 2: 15 mins.
