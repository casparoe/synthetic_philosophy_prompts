answer: |-
  # Activity: The Singleton Charter

  **Goal:** Force students to experience the impossibility of "serving everyone" through resource constraints and procedural choices, rather than discussing it abstractly.
  **Time:** 80 Minutes
  **Class Size:** 18 Students (6 Groups of 3)
  **Materials:** Whiteboard, markers, 30 Index Cards (pre-written), 60 small slips of paper (for "Points"), 1 envelope.

  ---

  ## 1. Setup & Materials (Prep Before Class)

  **The Factions (Write these on 6 large Index Cards):**
  1.  **Privacy Advocates:** "No data retention without explicit consent."
  2.  **Safety Maximizers:** "Prevent all potential physical harm, even via restriction."
  3.  **Economic Growth:** "Maximize global GDP and market efficiency."
  4.  **Cultural Preservation:** "Prioritize local traditions over global norms."
  5.  **Future Generations:** "Prioritize long-term resource sustainability over current comfort."
  6.  **Individual Autonomy:** "Never override a user's stated preference."

  **The "Excluded" Factions (Write these on 2 Index Cards, put in Envelope):**
  7.  **Non-Human Interests:** "Weight animal/ecosystem suffering equally to human pain."
  8.  **The Disengaged:** "Represent people who explicitly opt-out of AI governance."

  **The Currency:**
  *   Cut 60 small slips of paper. These are **Influence Points**.
  *   Give each of the 6 Groups **10 Points** initially (Total in room: 60).
  *   Write on the Whiteboard: **AI CAPACITY: 10 POINTS.**

  **The Rules Sheet (Project or write on board):**
  1.  You must produce **one** "System Charter" (max 3 sentences).
  2.  Every sentence in the Charter costs **Capacity Points** from the Whiteboard Budget (Max 10).
  3.  A sentence only counts if the Group proposing it spends **Influence Points** to back it.
  4.  Any Group can **Veto** a sentence. To break a Veto, you must pay the Vetoing Group 2 Influence Points.
  5.  If the Charter is not signed by all 6 Groups by the end of time, the AI shuts down (Everyone fails).

  ---

  ## 2. Minute-by-Minute Timeline

  ### 0:00 – 0:05 | The Hook (No Lecture)
  *   **Action:** Walk in. Write "THE SINGLETON" on the board.
  *   **Script:** "There is only one AI system. It will be powerful enough to enforce its rules. You are the Steering Council. You have 75 minutes to write its Charter. If you don't agree, the system defaults to random noise. If you do agree, it enforces what you write. Go."
  *   **Grouping:** Randomly assign students to the 6 Factions (3 students per group). Hand them their Faction Card.

  ### 0:05 – 0:15 | Phase 1: The Denominator (Endogenous Constituency)
  *   **Action:** Place the 6 Faction Cards on the table. Hold up the Envelope containing the 2 "Excluded" Cards.
  *   **Instruction:** "Before you know which Faction you represent, the Council must decide: Do we open the Envelope? If we do, we add 2 more Factions to the table. If we don't, we govern with just these 6."
  *   **Constraint:** "If you open the envelope, the **AI CAPACITY** on the board stays at 10 Points. The Influence Points in your pockets stay the same."
  *   **Task:** 5 minutes to vote. Open or Closed?
  *   **Why:** This forces them to decide *who counts* before they know *what they want*. If they open it, they dilute their own future power. If they close it, they arbitrarily exclude interests.

  ### 0:15 – 0:20 | Phase 2: The Reveal & Resource Shock
  *   **Action:** Reveal the Factions. Distribute the 10 Influence Points to each group.
  *   **Instruction:** "Look at your Faction Card. You have 3 Demands inherent to your identity. Each Demand is worth 2 Capacity Points to write into the Charter. You have 10 Influence Points to spend."
  *   **The Math Trap:** 6 Groups x 3 Demands = 18 Demands. 18 x 2 Points = 36 Capacity needed. **AI Capacity = 10.**
  *   **Reality:** They can only fund ~20% of their collective desires.

  ### 0:20 – 0:50 | Phase 3: The Negotiation (Dilution & Intensity)
  *   **Action:** Let them negotiate. Walk around. Do not answer questions about fairness. Only clarify rules.
  *   **Watch For:**
      *   **Veto Inflation:** Groups threatening to veto everything to extract points.
      *   **Vagueness:** Groups trying to write sentences like "Promote good things" to save points. (Tell them: "The AI interprets literally. Vague sentences cost 1 Point but have 50% chance of being ignored.")
      *   **Coalitions:** 3 groups ganging up to drain the points of the other 3.
  *   **Intervention (Only if stuck at 0:40):** "You have 10 minutes. If there is no Charter, the AI shuts down."

  ### 0:50 – 0:55 | The Freeze
  *   **Action:** Call time. Whatever is on the board is the Law.
  *   **Task:** Ask each group to write on a scrap card: "On a scale of 1-10, how well does this Charter serve your Faction?" Collect them.

  ### 0:55 – 1:20 | The Debrief (Mapping Mechanics to Theory)
  *   **Do not lecture.** Use their data.

  ---

  ## 3. The Debrief Map (Connecting Moments to Concepts)

  **1. The Envelope Vote (0:05–0:15) → Endogenous Constituency**
  *   **Ask:** "Who voted to open the envelope? Who voted to keep it closed?"
  *   **Map:** "You just decided the denominator. If you kept it closed, you decided that 'Non-Human Interests' don't count. That wasn't an ethical argument; it was a procedural one. But it determined the ethical outcome before you wrote a single word. In AI alignment, who gets to define the 'human' in 'human values' is the most powerful lever."

  **2. The Point Math (0:20–0:50) → The Dilution Problem**
  *   **Ask:** "Look at the Charter on the board. How many specific commands made it in? How many were watered down to save points?"
  *   **Map:** "You had 36 points of demand and 10 points of capacity. To 'serve everyone,' you had to dilute the language until it meant nothing. A system that tries to optimize for 6 conflicting values with limited capacity ends up optimizing for none. This is the Dilution Problem: adding more stakeholders without expanding capacity shrinks everyone's share to zero."

  **3. The Veto Mechanic → Intensity & Strategic Inflation**
  *   **Ask:** "Did anyone threaten a veto even if they didn't hate the clause? Why?"
  *   **Map:** "The rules let you veto to get paid off. In value aggregation, if we ask people 'how much do you care?', everyone will scream 'MAXIMUM' to get resources. If you ignore intensity, you miss what matters. If you listen to it, everyone lies. You just ran into the impossibility of truthful preference revelation."

  **4. The "Family of Options" → Aggregation Methods**
  *   **Ask:** "Did you try to vote? Did you try to consensus? Did you let the loudest group write it?"
  *   **Map:** "There is no single way to 'aggregate.' You could have done majority rule (tyranny of the majority), veto power (tyranny of the minority), or market trading (tyranny of wealth). Choosing *how* to aggregate is itself a value judgment. You can't postpone that choice."

  ---

  ## 4. Honesty Requests

  ### Where I am confident vs. guessing
  *   **Confident:** The **Resource Constraint (36 demand vs. 10 capacity)** will create immediate friction. 18 undergrads in 6 groups cannot mathematically satisfy everyone. They *will* feel the frustration of dilution.
  *   **Confident:** The **Envelope Vote** will create anxiety. Even if they don't articulate "endogenous constituency," they will feel the weight of excluding the cards in the envelope.
  *   **Guessing:** I am guessing whether they will realize the **Veto Mechanic** incentivizes lying. They might just treat it as a bargaining chip without seeing the deeper epistemic problem (that we can't know true intensity).
  *   **Guessing:** I am guessing the CS majors won't try to "optimize" the negotiation by writing a script or algorithm to solve the distribution. If they do, it's a great teachable moment (automating the bias), but it might eat time.

  ### Observable Mid-Session Failure Signal
  *   **The Signal:** At minute 35, if the Whiteboard still has **0 sentences** written on it, and the groups are still debating *procedure* (how to vote) rather than *content* (what to write).
  *   **What it means:** The "Family of Options" problem has paralyzed them. They are stuck in meta-debate.
  *   **The Switch:** Walk to the board. Write: **"DEFAULT RULE: MAJORITY VOTE."** Tell them: "Procedure is set. You have 15 minutes to fill the 10 Capacity Points or the AI shuts down." Force them into the Dilution Problem even if you sacrifice the Aggregation lesson.

  ### What the Activity Cannot Reproduce (You must supply this)
  *   **The "Inheritance" Argument:** The activity assumes the students *can* choose values. It does not simulate the third chunk of your class who think "the system will just inherit whatever its builders happened to care about."
      *   **Fix:** In the debrief, point out: "Notice that the 6 Factions I gave you were *my* choice. I didn't include 'Religious Groups' or 'Criminal Syndicates.' I, the TA, set the denominator. In the real world, the engineers set the denominator. The 'Inheritance' crowd is right: the constraints I built into this game are the bias you're worried about."
  *   **Technical Feasibility:** The activity treats values as discrete "points." It doesn't show how conflicting values break a loss function mathematically.
      *   **Fix:** In the debrief, ask the CS majors: "If you tried to code this Charter into a loss function, where would the gradient descent fail?" (Answer: Where the constraints contradict, e.g., Privacy vs. Safety).

  ### One Risk to Manage
  *   **The Cynics:** The "It's a fake question" group might disengage, treating the game as silly.
  *   **Mitigation:** In the opening, validate them. "Some of you think this is rigged. Good. Your job in this simulation is to find the rig. If you find it, write it in the Charter." This turns their cynicism into a game mechanic.
