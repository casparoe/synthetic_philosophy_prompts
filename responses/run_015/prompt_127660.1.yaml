answer: |-
  The shelves in the Bureau of Spacetime Coordination didn't run chronologically. That would imply time moved, that there was a special "now" sliding down the aisle like a finger on a ticker tape. There wasn't. Instead, the files were arranged by spatial proximity and causal density. A birth certificate from 1804 sat next to a demolition permit from 2490 because both events happened in the same cubic meter of London soil.

  I sat at my desk in Sector 7, staring at the holographic spread of Case 99-47. On the left, a water-damaged diary entry from the Mississippi Flood of 1998. On the right, a digital contract signed in Neo-Tokyo, 2047.

  The claimant was the estate of a flood victim. The defendant was Ares Dynamics. The charge was negligence via Retrocausal Escrow.

  It's a niche clause. Basically, Ares signed a contract in 2047 to license a dampening field technology. The escrow agreement locked the rights to that tech in a spacetime coordinate that overlapped with the 1998 flood zone. The claimant argued that by locking the tech in the future, Ares prevented its use in the past, directly causing the levee failure. They wanted damages paid from the 2047 account to the 1998 heirs.

  In a normal world, this is nonsense. You can't sign a paper fifty years after the damage is done and call it the cause. But we don't work in a normal world. We work in the Block. Here, 1998 and 2047 are equally real, sitting on the shelf like jars of pickles. The only question is geometry.

  I rubbed my eyes. The Rietdijk-Putnam argument was the backbone of our legal code: since simultaneity is relative to the observer's velocity, there is no unique present. If there's no unique present, there's no universal "before" or "after" for events separated by space. Causality isn't an arrow; it's a slope you can view from different angles.

  My job was to pick the angle.

  I pulled up the interval calculation. For Ares to be liable, the contract signing and the flood had to be spacelike separated. If they were spacelike, their temporal order depended on your frame of reference. I could legally define a frame where the 2047 contract happened *before* the 1998 flood. If Contract < Flood, the Escrow was active during the disaster. Ares blocked the tech. Ares pays.

  If the interval was timelike, the order was fixed. 1998 always comes before 2047. You can't cause the past if the past is absolutely prior. Ares walks.

  "Come on," I muttered, tapping the console. "Show me the velocity."

  The initial filing listed the Ares executive who signed the contract as being stationary in Neo-Tokyo. Earth-bound. That made the interval timelike. Distance: zero (effectively). Time: 49 years. Case closed, no liability. But the claimant had appealed, citing a discrepancy in the executive's travel log.

  I dug into the physical archives. The digital index was clean, too clean. I walked down the aisle, running my hand over the spines. 1990s... 2040s... 1800s... The air smelled of ozone and old paper. I found the box labeled *Transit Logs: Mid-21st Century*. It was shoved between a box of 19th-century whaling manifests and a 2300s Martian zoning law. Someone had misfiled it. Probably an intern who still thought chronologically.

  I took the box back to my desk and pulled the occurrence report.

  The executive wasn't in Neo-Tokyo. He was on a sub-orbital shuttle, moving at 0.4c relative to the Earth's surface during the signing ceremony.

  I fed the new data into the model. The spatial coordinate shifted. The shuttle's velocity changed the simultaneity plane. In the Earth's frame, the flood was 1998 and the contract was 2047. But in the shuttle's frame, the time dilation and the relativity of simultaneity skewed the slice of "now."

  I watched the graph warp. The interval turned spacelike.

  Technically, this meant I could choose a convention where the signing preceded the flood. But here was the kicker: the Bureau's standard operating procedure required us to use the *local* frame of the affected party for liability rulings unless specified otherwise. The affected party was the flood victim, stationary on Earth.

  However, the Retrocausal Escrow contract had a fine print clause: *Jurisdiction follows the Signer's Proper Time.*

  Because of the misfiled report, I now knew the Signer's Proper Time. In his frame, moving at 0.4c, the simultaneity slice tilted enough that the signing event was coordinate-time prior to the flood event.

  I sat back. The physics held up. In the Signer's frame, he signed the paper before the levee broke. The Escrow was active. He locked the tech away before the water rose. He was liable.

  But wait. I double-checked the filing protocol. The misfiled report was dated *after* the original adjudication deadline. By finding it now, I was introducing data that, in the Bureau's own timeline, was "late." But in the Block, late doesn't mean nonexistent. It just means located elsewhere on the shelf.

  If I accepted the report, Ares pays billions to a dead man's heirs. If I rejected it as procedurally invalid, Ares walks.

  The protocol said: *All existing coordinates must be integrated into the geometric model.* It didn't matter when I found the file. It mattered that the file existed in the Block. The truth of the signing velocity was always there, sitting between the whaling logs and the Martian zoning laws. Ignoring it would be falsifying the geometry.

  I picked up the stamp. It felt heavy.

  This was the part that kept me up at night. If the Block is fixed, did I have a choice? The misfiled report was always there. I was always going to find it. The ruling was always going to be written. My feeling of wrestling with justice was just a chemical reaction in my brain at this specific coordinate.

  It felt unfair. The flood victims suffered real water, real loss. Ares signed a paper in a shiny office. Connecting them felt like magic, but dismissing them felt like erasure. If I rejected the report because it was "late," I'd be privileging the Bureau's clock over the spacetime interval. I'd be saying some moments are more real than others. That's heresy in this office.

  But if I accepted it, I was punishing a company for an event that, from the victim's perspective, hadn't happened yet. How do you blame someone for preventing a disaster before the disaster exists?

  In the Block, the disaster always exists. It's just over there, on the shelf.

  I looked at the stamp again. *APPROVED.*

  If I stamped it, I was affirming that cause and effect are just labels we stick on geometric relations. The contract caused the flood because I chose a frame of reference where the contract came first. If I chose another, it didn't. The physics didn't change. The water didn't rise higher. The money didn't vanish. Only the story changed.

  And isn't that all liability is? A story we tell to move resources from one coordinate to another?

  I slammed the stamp down. The ink bloomed red on the paper.

  **RULING: LIABILITY CONFIRMED.**
  **BASIS: SIGNER PROPER FRAME CONVENTION.**

  I filed the decision under *L*, slot 4902. It fit perfectly between a lawsuit about a sunken ship from 1850 and a patent dispute from 2105. No special section for "Present." No special section for "Past." Just the flat, quiet hum of the archive.

  I leaned back and watched the dust motes dance in the light. They didn't move forward. They just were. I took a sip of cold coffee, wondering if I'd ever really made a decision, or if I was just reading the script that was already filed on the shelf next to me.
