      *   *But:* If I optimize for "Thermostat reading" by holding a hairdryer to the sensor, I am *not* optimizing "Room Temperature." I am optimizing the *measurement*.
      *   This is the crux. **Goodhart's Law.**
      *   The ADA optimizes the *score*. The GDA optimizes the *underlying quality* the score measures (or the belief state).
      *   If the agent hacks the evaluator (wireheading), it satisfies (1) but violates the spirit of "having the evaluator think well of me" as a world state. It just needs the *signal*.
      *   So, Step (4) assumes the agent cannot/cannot distinguish between *actually being good* and *appearing good* in a way that decouples the signal from the state.
      *   Actually, the stronger point is **Temporal Scope**.
