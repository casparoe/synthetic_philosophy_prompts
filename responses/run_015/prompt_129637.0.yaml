answer: |-
  You are absolutely right to feel that your teacher's slogan is doing too much heavy lifting. "If you can't report it, you don't experience it" sounds like a clean empirical rule, but in philosophy of mind, it's a grenade pin pulled on a massive debate between **Realists** (consciousness exists independently of report) and **Verificationists/Operationalists** (consciousness is defined by what we can measure).

  Your intuition about affective blindsight is spot-on. That case is specifically designed to drive a wedge between *phenomenal consciousness* (what it feels like) and *access consciousness* (what you can do with it).

  Here is the menu you asked for. I've broken down the hidden claims in your teacher's slogan, evaluated their philosophical status, and assessed whether they actually defeat the blindsight counter-example.

  ### The Menu of Hidden Claims

  #### 1. The Global Workspace Claim (Access = Consciousness)
  *   **The Claim:** Consciousness *just is* the global broadcasting of information to cognitive systems (working memory, language, planning). If information stays in a modular "subroutine" (like the amygdala reacting to a face) without broadcasting to the whole brain, there is no "light on" inside.
  *   **Status:** **Actually Controversial.** This is the core of Global Neuronal Workspace Theory (Dehaene, Changeux). It is fiercely contested by Integrated Information Theory (Tononi) and First-Order theorists who argue you can have rich phenomenology without global access (e.g., iconic memory, fringe consciousness).
  *   **Does it kill Blindsight?** **No.** It merely *defines* blindsight as unconscious by fiat. It begs the question. The blindsight proponent says, "The feeling exists but isn't broadcast." The teacher says, "If it isn't broadcast, it isn't a feeling." You are talking past each other unless you challenge the definition.

  #### 2. The Working Memory Bottleneck Claim
  *   **The Claim:** To experience something, you must be able to hold it in working memory long enough to stabilize it. If a stimulus flashes too fast or is processed subcortically without entering WM, it evaporates before it becomes an experience.
  *   **Status:** **Controversial.** Many argue for "phenomenal overflow"—the idea that we experience much more than we can hold in working memory (think of a quick glance at a crowded street; you feel the crowd, but can't report every face).
  *   **Does it kill Blindsight?** **Misses the Point.** Affective blindsight isn't usually about speed; it's about pathway damage (V1 cortex). The emotional signal reaches the amygdala directly. The patient feels the *anxiety*, even if they can't hold the *image* in memory. The feeling itself is the experience, not the image.

  #### 3. The Verbal Articulation Claim (Linguistic Relativism)
  *   **The Claim:** Consciousness requires the ability to translate a state into language. If you can't say "I am seeing X" or "I feel Y," the state is merely physiological, not experiential.
  *   **Status:** **False (or at least Extremely Strong).** This excludes infants, non-human animals, and non-verbal qualia (e.g., the specific taste of wine that you can't describe). Most philosophers reject the idea that language is a *necessary condition* for experience, even if it helps structure it.
  *   **Does it kill Blindsight?** **No.** In affective blindsight, patients often *can* verbally report: "I don't see a face, but I feel scared/uncomfortable." If they report the *affect*, your teacher's rule ("no report = no experience") should grant them consciousness of the *fear*, even if they deny consciousness of the *face*. If the teacher denies the fear is real because they can't identify the cause, she is conflating *object* with *state*.

  #### 4. The Higher-Order Thought (HOT) Claim
  *   **The Claim:** A mental state is only conscious if there is a higher-order mental state *about* that state. You aren't just in pain; you must think "I am in pain." No self-modeling = no consciousness.
  *   **Status:** **Actually Controversial.** This is a major theory (Rosenthal, Carruthers), but First-Order theorists argue it creates an infinite regress or makes consciousness too intellectual.
  *   **Does it kill Blindsight?** **Maybe, but it's risky.** If the blindsight patient lacks the conceptual model to categorize the feeling as "vision-based," a HOT theorist might say the feeling is unconscious. *However*, if the patient reports "I have a gut feeling," they *have* a higher-order thought about the gut feeling. So the experience of the *gut feeling* is conscious, even if the visual trigger isn't.

  #### 5. The "Fridge Light" Illusion (Verificationism)
  *   **The Claim:** Asking if consciousness exists without report is like asking if the fridge light stays on when the door is closed. It's a meaningless question. We only get to count what we can verify.
  *   **Status:** **Philosophically Contentious.** This is Dennett's "Heterophenomenology." It treats consciousness as a theoretical construct rather than a private reality. Realists argue this dissolves the "Hard Problem" rather than solving it.
  *   **Does it kill Blindsight?** **Misses the Point.** This is a meta-philosophical move, not an empirical one. It shuts down debate by changing the rules of what counts as "real." It doesn't prove the patient doesn't feel; it just says we aren't allowed to talk about it scientifically.

  ---

  ### How to Use This in Class (Strategy)

  Your teacher is likely operating under a **Dennettian** or **Dehaene-style** framework. If you attack her directly, she will likely retreat to "That's just your intuition, and intuition is unreliable."

  Instead, use **Ned Block's Distinction**. This is the standard philosophical counter-move to your teacher's slogan.

  **The Move:**
  Don't argue about whether the patient *sees* the face. Argue about the *feeling* of the "bad vibe."

  **Script:**
  > "I want to press on the 'report' criterion. In affective blindsight, the patient *can* report: they say 'I feel anxious' or 'I get a bad vibe.' They just can't report *why* (the face).
  >
  > If your rule is 'No report = No experience,' then you have to admit they **do** experience the anxiety, because they report it.
  >
  > But if you say they don't experience the anxiety because they can't identify the visual cause, then you aren't arguing about *reportability* anymore; you're arguing that **consciousness requires correct conceptual categorization.**
  >
  > Are you claiming that if I feel sad but think I'm hungry, I'm not actually conscious of the sadness? That seems to make consciousness depend on being right about the world, rather than just feeling it."

  **Why this works:**
  1.  **It accepts her premise** (report matters) but shows it grants the conclusion you want (the feeling is real).
  2.  **It forces a dilemma:** Either she admits the feeling is conscious (undermining "no report = no experience" regarding the visual stimulus), or she has to argue that *misattributed* feelings aren't conscious (which is a much harder, more controversial claim to defend).
  3.  **It highlights the P-Consciousness vs. A-Consciousness split:** You are pointing out that she is defining consciousness as *Access* (A), while the blindsight case is evidence for *Phenomenology* (P) without Access.

  **One warning:** If she is a hardline Dennettian, she will say "There is no P-Consciousness separate from A-Consciousness." If she says that, you can't win on empirical grounds. You have to pivot to: "If we define consciousness only as reportability, we lose the ability to explain why reportability *matters* to the subject. We are explaining the behavior, but explaining away the experience."

  Good luck. You're asking the right questions.
