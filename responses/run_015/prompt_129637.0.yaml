      *   *Nuance:* Distinguish between "report" meaning "verbal statement" vs. "non-verbal button press." Blindsight patients can often button-press at above-chance levels. If the teacher accepts button presses as reports, blindsight becomes "seen." If she requires verbal "I see X," then it's about access.
      *   *Key Distinction:* Ned Block's P-Consciousness (Phenomenal) vs. A-Consciousness (Access). This is the philosophical ammunition the user needs.

