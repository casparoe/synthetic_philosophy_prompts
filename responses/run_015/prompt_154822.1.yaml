  # JOINT STATEMENT ON BIOLOGICAL FUNCTION
  **From the Adversarial Collaboration on Etiological and Causal-Role Theories**

  ### I. AGREED SUBSTANTIVE CLAIMS

  We, the undersigned proponents of Etiological Theory (ET) and Causal-Role Theory (CR), affirm the following claims as empirically and conceptually sound, despite our theoretical divergences regarding their grounding.

  1.  **The Heart Claim:** In standard human physiology, the heart functions to pump blood. This is not merely a description of activity but an identification of its biological purpose.
  2.  **The Pathology Claim:** Tumors and cancerous growths represent states of biological dysfunction. The cells involved are failing to operate correctly within the context of the organism.
  3.  **The Normativity Claim:** Attributions of "function" carry normative weight. To say a trait has a function is to establish a standard of correctness; a trait can fail to meet this standard (malfunction) even if the failure is statistically common.
  4.  **The Systemicity Claim:** Functions are ascribed relative to a containing system (typically the organism). A trait's function is determined by its relationship to the maintenance or persistence of that system.
  5.  **The Effect/Function Distinction:** Not every causal effect of a trait is its function. (e.g., The heart makes a sound, but making a sound is not its function).

  ***

  ### II. DISAGREEMENTS, CRUXES, AND PREDICTIONS

  | Area of Disagreement | Etiological Theory (ET) Formulation | Causal-Role Theory (CR) Formulation |
  | :--- | :--- | :--- |
  | **Precise Wording of Core Concepts** | **Function:** A trait functions to do X if and only if ancestors of this trait were selected for doing X.<br>**Malfunction:** A trait malfunctions when it fails to perform the effect for which it was historically selected. | **Function:** A trait functions to do X if and only if doing X contributes to the capacity of the containing system.<br>**Malfunction:** A trait malfunctions when it fails to contribute to the capacity of the containing system in the expected manner. |
  | **Crux 1: The Necessity of Evolutionary History**<br>*(Does a trait require a selection history to be subject to normative judgment?)* | **Position:** Yes. Normativity is derived from historical success. Without a history of selection, there is no "proper" function, only causal capacity.<br><br>**Concrete Case:** *The "First Heart" Scenario.* Consider the very first organism in evolutionary history to possess a proto-heart structure capable of pumping fluid.<br><br>**ET Prediction:** If this first proto-heart fails to pump, it is **broken**, not dysfunctional. It cannot malfunction because no selection history exists yet to establish a norm. | **Position:** No. Normativity is derived from current system requirements. A trait can have a function immediately upon existence if it supports the system.<br><br>**Concrete Case:** *The "First Heart" Scenario.* Consider the very first organism in evolutionary history to possess a proto-heart structure capable of pumping fluid.<br><br>**CR Prediction:** If this first proto-heart fails to pump, it is **dysfunctional**. It malfunctions immediately because it fails to contribute to the organism's circulatory capacity, regardless of history. |
  | **Crux 2: Synthetic and Novel Traits**<br>*(Can entities with no selection history possess biological functions?)* | **Position:** No. Synthetic organs are artifacts, not biological traits with proper functions. They are tools used by the organism, not parts functioning *for* the organism in the biological sense.<br><br>**Concrete Case:** *The Synthetic Organoid.* A lab-grown kidney organoid is implanted into a host. It has no evolutionary lineage; it was engineered de novo. It filters blood successfully for five years, then stops.<br><br>**ET Prediction:** When the organoid stops filtering, it has **failed as a tool**. It did not "malfunction" biologically because it has no selected effect. It is categorically distinct from a natural kidney. | **Position:** Yes. If the entity plays a causal role in the organism's system, it has a function. Origin is irrelevant to current capacity.<br><br>**Concrete Case:** *The Synthetic Organoid.* A lab-grown kidney organoid is implanted into a host. It has no evolutionary lineage; it was engineered de novo. It filters blood successfully for five years, then stops.<br><br>**CR Prediction:** When the organoid stops filtering, it is **biologically dysfunctional**. It functions identically to a natural kidney because its contribution to the host's homeostasis is identical. |
