answer: |-
  You have described a classic difficulty in the theory of belief revision, and the shape of it is indeed familiar to those who work on the foundations of probability. The single announcement puzzle you recall, involving a soldier in unfamiliar territory, is commonly known as the Judy Benjamin problem. It highlights the trouble one encounters when trying to update a probability distribution based on information about a conditional probability rather than a simple fact. What you have uncovered in your two-announcement scenario is a deeper structural feature of how such updates behave when they are applied sequentially versus simultaneously. The phenomenon you are observing is generally referred to as the non-commutativity of probability kinematics, or sometimes order dependence in belief revision.

  To answer your first question about whether the sensitivity to parceling, the order sensitivity, and the repeal of the earlier announcement are one phenomenon or several, they are best understood as different facets of the same geometric fact. You are moving a point within a probability simplex, which is a curved space. When you receive the first announcement, you move your current probability distribution to the nearest point that satisfies the new constraint, according to some measure of distance. When you receive the second announcement, you move again from that new location to the nearest point satisfying the second constraint. Because the space is curved and the constraints are not orthogonal, the path you take depends on the order of the steps. The repeal of the first announcement occurs because the second move pulls you off the locus of points that satisfied the first constraint. This is not merely a quirk of parceling but a consequence of treating the announcements as sequential movements rather than as simultaneous constraints on the final destination. If you view the information as a set of constraints to be satisfied all at once, you find a single point that minimizes the distance from the start while respecting all limits, which is why your second case yields a stable result where both announcements survive.

  Regarding your second question, this is closely related to the complaint made about ordinary uncertain evidence, specifically within the framework of Jeffrey Conditionalization. In that context, if you update on one partition of possibilities and then on another that overlaps with the first, the order of updates matters, and earlier constraints may be violated by later ones. The reason is identical: you are performing successive projections onto constraint surfaces that do not commute. However, your case is slightly more intricate because you are updating on conditional probabilities rather than marginal probabilities of a partition. This adds a layer of complexity because fixing a conditional rate while holding the marginal of the condition fixed imposes a specific kind of geometric shift that interacts strongly with cross-conditions like the rate of B among A cases. So while the underlying mechanism of non-commutativity is the same, the specific behavior of the conditional rates drifting, as you calculated to fifteen nineteenths, is a distinctive feature of updating on conditionals rather than simple uncertain facts.

  Your third question asks whether this repeal is a defect of the rule you are using or something forced by the problem itself. The answer lies in distinguishing between a rule for moving beliefs and a rule for satisfying constraints. The rule you described, which keeps the confidence in the if-part fixed and preserves the rate where the if-part fails, is a valid kinematic rule for a single step. However, no sequential updating rule can guarantee that all previous constraints remain satisfied when new, overlapping constraints are introduced, unless that rule effectively stores all previous constraints and recomputes the position from the original start every time. In that sense, the repeal is forced by the decision to process the information sequentially as independent movements. If you insist on treating each bulletin as a complete instruction that moves you to a new state without retaining the previous constraint as a permanent boundary, you must accept that later moves will violate earlier ones. A better rule, in the sense of avoiding this defect, is one that treats the announcements as cumulative constraints on the final distribution, which is what you did in your second case using the method of minimizing distance subject to all constraints at once. This is often called Minimum Cross-Entropy updating.

  So, if you need a name to mark this off from its neighbours, you might call it the non-commutativity of sequential kinematic updates, or more descriptively, constraint drift in iterative belief revision. The boundary cases where this behaviour does not produce trouble are those where the constraints are compatible in a way that makes the order irrelevant, such as when the announcements concern independent partitions of the possibility space. In your specific case, because the condition of one announcement is the subject of the other, they are deeply intertwined, and the order matters immensely. A case where the order of arrival really ought not to matter would be one where the information is treated as a single body of evidence restricting the final state, rather than a sequence of commands to move. The drift you observed is the cost of paying attention to the timing of the news rather than just the content of the constraints. You have not stumbled on a property of the rule alone, nor solely on the problem, but on the mismatch between sequential processing and simultaneous constraint satisfaction in a curved probability space.
