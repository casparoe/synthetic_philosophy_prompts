answer: |-
  There is no single English word that captures this perfectly, but there is a precise conceptual cluster that describes it. The phenomenon you are identifying sits at the intersection of sociology, ethics, and linguistics.

  The most robust name for the *mechanism* is **Habitus** (Pierre Bourdieu).
  The most robust name for the *ethical failure* is **One Thought Too Many** (Bernard Williams).
  The most robust name for the *visitor's error* is **Hypercorrection**.

  Here is the carving you asked for: how these concepts distinguish the territory, why Kant gets it wrong for this specific case, and where the boundaries lie.

  ### 1. The Mechanism: Habitus vs. Rule-Following
  Sociologist Pierre Bourdieu coined the term **habitus** to describe exactly this distinction. Habitus refers to embodied dispositions—ways of standing, speaking, spending, and queuing—that are absorbed through osmosis rather than taught as rules.

  *   **Regulative Rules (The Driving Case):** These are technical constraints. "Drive on the left." The mechanism of compliance does not matter; only the outcome does. If you consciously think "I must drive on the left" every time you turn a corner, you are a safe driver. The mental process is irrelevant.
  *   **Constitutive Norms (The Tipping/Queueing Case):** These are identity markers. They do not just coordinate behaviour; they signal membership. The norm requires that the behaviour flow from your *character*, not your *calculation*.

  When you calculate the tip or mentally brace yourself to push into the scrum, you are engaging in **propositional compliance** (following a stated rule). The locals are operating on **embodied compliance** (habitus). Because the function of the norm is to signal "I am one of you," calculating it signals "I am a tourist studying you." The offence is not stinginess or rudeness; it is a claim to membership that the underlying mental state contradicts.

  ### 2. The Ethical Failure: One Thought Too Many
  You mentioned Kant. You are correct that Kant argues the moral worth of an action lies in doing it *from duty*, even against inclination. However, your example belongs to the tradition of **Virtue Ethics** (Aristotle, Hume), not Deontology.

  In Virtue Ethics, the goal is to become the sort of person for whom the right action is natural. The philosopher Bernard Williams described the violation of this as having **"one thought too many."**

  His famous example: A man saves his wife from drowning. If he pauses to think, "It is my moral duty to save my wife," he has had one thought too many. He ought to save her simply because she is his wife and he loves her. The calculation insults the relationship.

  In your examples:
  *   **Tipping:** The "relationship" is the social contract of hospitality. Calculating the rate treats the waiter as a creditor to be settled, not a participant in a ritual of mutual regard.
  *   **Queueing:** The "relationship" is shared citizenship. Consciously adopting the local scrum treats the norm as a costume to be worn, rather than a reality to be inhabited.

  The moral failing you sense is **inauthenticity**. It is read as contempt because it implies the norm is arbitrary (something you have to look up) rather than intrinsic (something you just *are*).

  ### 3. The Visitor's Trap: Hypercorrection
  In linguistics, **hypercorrection** occurs when a speaker tries so hard to adhere to a prestige dialect that they apply rules where they do not belong (e.g., saying "between you and I" because "me" feels too common, even when grammatically incorrect).

  In social norms, the visitor is structurally doomed to hypercorrect.
  1.  **Ignorance:** You break the norm because you don't know it. (Forgivable, marks you as an outsider).
  2.  **Compliance:** You follow the norm by calculating it. (Offensive, marks you as a spy).
  3.  **Habitus:** You follow the norm without thinking. (Impossible, as you are not of that culture).

  This creates the "grubby" feeling you described. You are aware of the wires and pulleys of the social performance, and by acting consciously, you reveal them to everyone else. Social magic requires the wires to be hidden.

  ### 4. The Aesthetic Ideal: Sprezzatura
  The Italian Renaissance term **sprezzatura** describes the art of concealing art. It is the ability to make the difficult look effortless. In the context of social norms, *sprezzatura* is the requirement.

  *   **The Local:** Has *sprezzatura* naturally. Their habitus aligns with the norm.
  *   **The Good Visitor:** Accepts they cannot have *sprezzatura*. They aim for **polite transparency**. They tip generously but perhaps admit, "I hope this is correct, I am not from here." This acknowledges the gap rather than trying to fake the bridge.
  *   **The Bad Visitor:** Attempts *sprezzatura* without the substance. This is the "When in Rome" mental note made visible. It reads as condescension because it suggests, "I am capable of playing your game," which implies the game is trivial.

  ### 5. Summary of the Carving
  To answer your specific boundaries:

  *   **Does it apply to all conventions?** No. It applies only to **expressive conventions** (tipping, dress codes, greetings, queueing) where the act communicates identity. It does not apply to **technical conventions** (traffic laws, safety protocols) where the act communicates order.
  *   **Obligation or Etiquette?** It is etiquette wearing obligation's clothes. It feels like a moral failing because it violates a duty of *recognition*, not a duty of *outcome*. You are failing to recognise the other person as a peer, treating the interaction as a transaction instead of a relation.
  *   **What is the visitor to do?** You cannot manufacture habitus. The only solution is to avoid the pretence of belonging.
      *   *Wrong:* Calculating the tip exactly to match the local rate.
      *   *Wrong:* Refusing to tip because "it's not my culture."
      *   *Right:* Leaving a generous amount without showing the calculation, or acknowledging your status. "I'm not sure of the custom here, but I appreciate the service."

  The word you are looking for, if you must have a label, is **Habitus**. But the feeling you are describing is the friction caused when **Propositional Knowledge** (knowing *that*) tries to substitute for **Embodied Knowledge** (knowing *how*), in a context where only the latter grants membership.

  It is the demand that you do not just obey the law, but that you *are* the law. And since you cannot be the law, your conscious obedience reads as rebellion.
