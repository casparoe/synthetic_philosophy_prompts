answer: |-
  Here is the breakdown, with the pushback you asked for up front.

  ### 1. The Setup: A Quick Pushback
  You asked me to flag if the "descriptive vs. evaluative" dichotomy is fake. In the philosophy of social science, it largely is. Social kinds (like "recession," "revolution," or "collapse") are **thick concepts**. They describe a state of affairs *and* evaluate it simultaneously. You cannot describe a "murder" without implying an unlawful killing; if it's lawful, it's "execution" or "warfare." Similarly, you don't call a peaceful transition to a simpler lifestyle a "collapse."

  So, the proposition *"collapse is an irreducibly evaluative concept"* is almost tautologically true because if you strip the evaluation (the "something went wrong" element), you're left with "change," not "collapse." Maya's comparison to "extinction" fails because biological species have a material boundary (reproductive isolation) that polities do not. A polity is a web of expectations; if the expectations change but the people stay, the "extinction" metaphor breaks.

  I am not going to lower my credence because of this, but I am flagging that you and Maya are arguing on a battlefield that might be terrain, not ground.

  ### 2. The Number
  **My Credence: 0.78**
  *(I am slightly more confident than you that the concept is irreducibly evaluative, largely because I think the "descriptive" alternative is incoherent, not just difficult.)*

  ### 3. The Decomposition
  Here are the four sub-questions you requested, with probabilities and justifications.

  **Q1: Can a quantitative threshold fit paradigm cases without obvious ad hoc tuning?**
  *   **Probability: 0.15**
  *   **Justification:** Any specific percentage (e.g., "50% population loss") either excludes paradigm cases (some collapses had low population loss) or includes non-collapses (famines that passed), requiring constant post-hoc adjustment.

  **Q2: Even granting a clean definition, would live disputes be settled, or are they about which changes matter?**
  *   **Probability: 0.85**
  *   **Justification:** The fights aren't about measurement accuracy; they're about whether the loss of poetry matters as much as the loss of grain storage, which is a value judgment.

  **Q3: Is ordinary/popular usage tracking anything value-free, or is it doing moral-fable work?**
  *   **Probability: 0.95**
  *   **Justification:** The "collapse" genre is explicitly didactic (Diamond, Tainter); the term is selected specifically to invoke fear and moral caution, not neutral observation.

  **Q4: Is that fable work detachable from scholarly use, or did scholarship borrow the freight?**
  *   **Probability: 0.75**
  *   **Justification:** Scholars use the term *because* it carries weight; trying to drain the weight makes the term useless for funding or attention, so the freight is structurally retained.

  ### 4. Combination Logic
  I am treating these as **conjunctive support with a ceiling**.
  *   If Q1 is false (no clean threshold), the descriptive project is already wounded.
  *   If Q2 is true (disputes are about salience), the evaluative core is confirmed.
  *   Q3 and Q4 act as multipliers on the *social reality* of the term. Even if a scholar *could* define it descriptively (Q1), if the usage (Q3/Q4) drags the evaluation back in, the concept *as it functions* remains evaluative.
  *   I weighted Q2 most heavily. If the disputes are fundamentally about salience, the concept is evaluative regardless of thresholds.
  *   Calculation: Base 0.5 + (Q2 weight * 0.3) + (Q1 weight * 0.1) + (Q3/Q4 average * 0.1). Roughly: 0.5 + 0.25 + 0.05 + 0.08 = 0.88, discounted to 0.78 to account for the possibility that Maya's pragmatism (just let it work) has some validity.

  ### 5. Sensitivity Analysis
  **Single Sub-Question:** **Q2 (Are disputes about measurement or salience?)**
  **Why:** If you could convince me that archaeologists actually agree on *what* matters (e.g., "everyone agrees energy capture is the only metric") and only fight about the data, my credence would drop to ~0.4. But if the fighting is about whether "energy capture" is the right metric vs. "social resilience," the evaluative nature is proven.
  **Evidence to Move It:** A consensus paper where rival schools agree on a metric *and* the metric is purely physical (e.g., kilocalories per capita) without normative attachment to "complexity." I don't think this exists, but if it did, it would move me.

  ### 6. The Gap: You (0.65) vs. Maya (0.25)
  **Where it lives:** You are arguing from **ontology** (what is the thing?); Maya is arguing from **utility** (does the word work?).
  *   **You:** See that choosing the definition chooses the victim. If "collapse" means "loss of palaces," villagers don't matter. If it means "loss of life," palaces don't matter. You see the moral weight of that choice.
  *   **Maya:** Sees "collapse" as a bucket for "big, bad, systemic change." She thinks you can point to the bucket without justifying why the contents are bad. She is a pragmatist; she thinks the "evaluation" is shared common sense, not a philosophical burden.
  *   **Resolution:** You are right that it's evaluative; she is right that we can't stop using the word. The gap is that you think the evaluation needs to be explicit, and she thinks it can remain implicit background noise.

  ### 7. The Ledger Test Verdict
  **Is it doing real work or restating your conclusion in technical costume?**
  It is **doing real operational work**, but it is **technical costume for a value judgment.**
  *   **Real Work:** It stops the argument about "did people die?" and focuses it on "did the system record keep?" It makes the variable measurable.
  *   **Technical Costume:** It implicitly asserts that *administration* is the soul of the society. It says a village without a tax collector is not a collapse, but a palace without a tax collector is. That is a political choice, not a natural fact.
  *   **Relation to your conclusion:** It does not restate your conclusion (that the term is evaluative); it *exemplifies* it. It attempts to hide the evaluation behind a technical metric (literacy transmission). It validates your thesis that you cannot define collapse without privileging one layer of society over another.

  ### 8. Empirical Flag
  I am uncertain on the **Easter Island (Rapa Nui)** details. There is a revisionist view that the "ecocide" narrative is wrong and that society transformed rather than collapsed when Europeans arrived. If the "collapse" there was actually caused by external shock (disease/slaving) rather than internal failure, it weakens the "moral fable" usage (Q3) but strengthens the "evaluative" nature (we called it collapse because we thought they sinned, not because they died). I'm assuming the revisionist view is gaining traction but not settled.

  **Summary:** You're right. The word "collapse" is a judgment disguised as a measurement. Maya wants to keep the disguise because it's useful; you want to expose it because it's honest. My money is on honesty.
