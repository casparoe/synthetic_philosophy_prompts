          *   Follow-up: If she says "linear," ask about the noise floor.
          *   *Selection:* Question 6.

      *   *Topic 7: Per-Cycle vs. Asymptotic.*
          *   Draft: What if I reset after a billion cycles?
          *   Refinement: Focus on the *transient* violation. If the bill comes due only at the end, is the law violated in the meantime?
          *   Follow-up: If she says "no, it's deferred," ask about the physical reality of the intermediate state.
          *   *Selection:* Question 7.

      *   *Topic 8: Tabletop Experiment.*
          *   Draft: How do we test this?
          *   Refinement: What specific observable distinguishes her "autonomous demon" from the standard model?
          *   Follow-up: If she says "none, it's conceptual," ask why it matters for physics.
          *   *Selection:* Question 8.

      *   *Need 9 & 10 to ensure robustness and hit the "stock answer" constraints.*
      *   *Topic 9: Autonomy vs. Control.* (Addressing the "externality" claim directly).
      *   *Topic 10: The "Locus Irrelevant" Trap.* (Directly targeting Stock Answer #1).

  4.  **Refining Follow-ups (The "Trap" Mechanism):**
      *   The prompt asks for follow-ups keyed to the reply she is *most likely* to make. I need to anticipate her defense.
      *   *Likely Defense:* She will argue that standard theory treats the demon as a control parameter, not a dynamical variable.
      *   *Follow-up Strategy:* Force her to specify the Hamiltonian or the coupling. If she hides behind "principle," push for "mechanism."

