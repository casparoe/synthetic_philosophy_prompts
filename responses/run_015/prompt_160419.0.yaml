      *   **Guest:** Dr. Ines Vartanian, thermodynamicist.
      *   **Guest's Thesis:** Mainstream exorcisms of Maxwell's demon (Landauer erasure, information-theoretic 2nd Law) presuppose an *external* demon. Genuine autonomy (internal demon, same bath, finite memory blocks, finite speed) breaks the standard accounting (double-counting or reinstating externality).
      *   **Guest's Stock Answers to Avoid:**
          1.  "Cost is discharged at erasure, locus irrelevant."
          2.  "Mutual-info bound isn't a license; info is never free."
      *   **Required Topics (at least one each):**
          1.  Circularity worry (principle derived from 2nd Law used to protect 2nd Law).
          2.  Tax vs. Refutation (extracting just under $k_B T \ln 2$ still works like Maxwell imagined).
          3.  Two-Temperature Variant (memory at different $T$, which $T$ enters bound, cold memory as refrigerator).
          4.  "Forgetful" Demon (fresh tape, no erasure, exorcism relies on finite tape supply).
          5.  Feynman's Ratchet (thermal jitter of latch does the job, erasure redundant).
          6.  Partial-Information Demon (correlations < 1 bit, proportional tax vs. threshold).
          7.  Per-Cycle vs. Asymptotic Bookkeeping (long run before reset).
          8.  Tabletop Experiment (what counts against her thesis).
      *   **Format:** 8-10 questions, each with a 1-2 sentence follow-up keyed to her likely reply.
      *   **Tone:** Rigorous, challenging, not polite filler, unusable as invitations to restate position.

  2.  **Deconstruct the Guest's Position:**
      *   Vartanian argues that treating the demon as an *agent* outside the system is the flaw.
      *   She claims standard info-thermo treats the demon's memory as a magical register not subject to the same thermal fluctuations until the "bill" comes due.
      *   She wants the demon to be *autonomous*: part of the apparatus, same bath, finite speed.
      *   *Weakness to exploit:* If the demon is fully physical and autonomous, standard stat mech should still apply. Why does her specific framing change the outcome? Is she proposing a violation of the 2nd Law, or just a reinterpretation of where the entropy goes?

  3.  **Drafting Questions (Iterative Process):**

      *   *Topic 1: Circularity.*
          *   Draft: Isn't Landauer's principle just derived from the 2nd Law?
          *   Refinement: Need to make it harder for her to say "No." Focus on the derivation chain.
          *   Follow-up: If she says it's independent, ask about the statistical assumptions.
          *   *Selection:* Question 1.

      *   *Topic 2: Tax vs. Refutation.*
          *   Draft: If I get almost $k_B T \ln 2$, haven't I won?
          *   Refinement: Focus on the *function* of the demon. Maxwell wanted to sort without work. If I pay a tiny tax, I still sort.
          *   Follow-up: Push on the definition of "violation."
          *   *Selection:* Question 2.

      *   *Topic 3: Two-Temperature Variant.*
          *   Draft: What if memory is cold?
          *   Refinement: Specifics on the bound $W \le -\Delta F + k_B T I$. Which $T$? If $T_{mem} < T_{gas}$, can we pump heat?
          *   Follow-up: If she says "average T," ask about the gradient exploitation.
          *   *Selection:* Question 3.

      *   *Topic 4: Forgetful Demon (Fresh Tape).*
          *   Draft: What if we never erase?
          *   Refinement: Shift the burden from thermodynamics to resource availability (tape). Is the 2nd Law really about running out of paper?
          *   Follow-up: If she says "tape production costs energy," ask about pre-existing tape.
          *   *Selection:* Question 4.

      *   *Topic 5: Feynman's Ratchet.*
          *   Draft: Feynman already solved this with jitter.
          *   Refinement: If the pawl jitters, the sorting fails immediately. Why do we need the erasure step at all?
          *   Follow-up: If she says "both matter," ask for the separation of timescales.
          *   *Selection:* Question 5.

      *   *Topic 6: Partial Information.*
          *   Draft: What if correlation is 0.5 bits?
