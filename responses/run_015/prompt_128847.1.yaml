prompt: |-
  Got a job talk in three weeks where I'm defending a contractualist treatment of aggregation. The thesis: you may add peoples complaints together only when the burdens are jointly unavoidable — there was no way to spare any one member of the group without also sparing every other member — so each of them can be given a reason she couldn't reasonably reject, roughly "we couldn't have spared you without sparing everyone, and sparing everyone wasn't on the cards." I call it the linkage condition. I use it to make numbers count in the case the whole paper turns on (you can either keep one identifiable person from becoming paraplegic or spare a few hundred unidentified people from permanent but mild hearing damage), while still refusing to aggregate in plain headcount cases and without quietly becoming a utilitarian.

  The department is four consequentialists who are somewhat EA-adjacent and think in QALYs and cost-effectiveness, one Kantian who thinks complaints are the wrong currency to begin with, one Scanlonian who's on my side but thinks any permission to aggregate is unstable and will collapse as soon as you press it, a decision theorist who'll want to know whether my condition is ex ante or ex post, and two philosophy-of-law people who mostly care whether any of this maps onto how standing actually works in tort.

  Write me a Q&A prep sheet: eight or so objections in the order they'll really arrive, phrased the way each of these people would phrase it (the EA version of "why not just aggregate" is not the Kantian's), with a two-minute answer for each, the things I should just concede in the talk itself, the single reply that has to land or the paper dies, and the question I'm hoping nobody asks. My guess is the nastiest one is menu-dependence — that on my view whether aggregation is permitted depends on which alternatives happen to be on the table — but I want your read on where I'm actually weakest, including if it's somewhere I haven't thought of.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** A philosopher (likely PhD candidate or early career) preparing for a job talk in 3 weeks.
      *   **Topic:** Contractualist treatment of aggregation (specifically, a "linkage condition" for when complaints can be summed).
      *   **Core Thesis:** Aggregation is permitted *only* when burdens are jointly unavoidable (Linkage Condition). Rationale: "We couldn't have spared you without sparing everyone."
      *   **Goal:** Save the intuition that numbers count in specific cases (1 paraplegic vs. hundreds with mild hearing loss) without collapsing into utilitarianism or allowing plain headcount aggregation.
      *   **Audience:** 9 faculty members with specific profiles:
          1.  4 Consequentialists (EA-adjacent, QALYs, cost-effectiveness).
          2.  1 Kantian (Complaints are wrong currency).
          3.  1 Scanlonian (Ally on framework, enemy on aggregation stability).
          4.  1 Decision Theorist (Ex ante vs. ex post).
          5.  2 Philosophy of Law (Tort standing).
      *   **Deliverables:**
          *   Q&A Prep Sheet (8 objections).
          *   Phrased according to specific faculty profiles.
          *   2-minute answers for each.
          *   Things to concede in the talk.
          *   The "single reply that has to land."
          *   The "question I'm hoping nobody asks."
          *   Analysis of the actual weakest point (might not be menu-dependence).

  2.  **Deconstruct the Theory (The "Linkage Condition"):**
      *   *Claim:* Aggregation allowed iff burdens are jointly unavoidable.
      *   *Motivation:* Fairness/Reasonable Rejection. If I can't save you without saving them, you can't complain that I didn't save you individually if saving everyone was too costly/impossible.
      *   *Case:* 1 Paraplegic vs. 500 Mild Hearing Loss.
      *   *Mechanism:* The 500 are linked. Saving one saves all (presumably, the intervention is binary: fix the water supply vs. fix one person's spine?). Wait, the prompt says "keep one identifiable person from becoming paraplegic or spare a few hundred unidentified people." Usually, this is a rescue case. If the linkage condition requires *joint unavoidability*, how does that apply here?
      *   *Crucial Interpretation:* The user says "you may add peoples complaints together only when the burdens are jointly unavoidable." In the Paraplegic vs. Hearing Loss case, usually, the hearing loss people are distinct. If I save Person A's hearing, Person B still loses theirs. So they aren't jointly unavoidable *unless* the cause is common (e.g., a toxin in the water). If it's a toxin, fixing the water saves everyone. If it's individual accidents, it doesn't.
      *   *Assumption for Prep:* I must assume the user has set up the case such that the "hundreds" are linked (e.g., a policy decision affecting a group) or the user is arguing that the *choice situation* makes them linked. *Correction:* The prompt says "there was no way to spare any one member of the group without also sparing every other member." This implies the Hearing Loss case *must* be structured as a common cause (e.g., environmental hazard) for the theory to work. If it's just "500 random people need hearing aids," the linkage condition fails, and aggregation is blocked. I need to make sure the answers respect this constraint.
      *   *Potential Weakness:* Menu Dependence. If I add a third option that breaks the linkage, does the permission to aggregate vanish?

  3.  **Drafting the Objections (Matching Profiles):**

      *   *Consequentialist (EA):* Focus on efficiency, QALYs, and the arbitrariness of the constraint. "Why leave QALYs on the table?"
      *   *Kantian:* Focus on dignity, treating persons as ends, not complaints. "Complaints are the wrong metric."
      *   *Scanlonian:* Focus on the stability of the principle. "Individualism is the core; this linkage is a loophole."
      *   *Decision Theorist:* Ex ante vs. ex post. "Is this about risk or outcome?"
      *   *Law/Tort:* Standing. "Can these people actually sue together?"
      *   *General/Meta:* Menu dependence, sorites, definition of "jointly unavoidable."

  4.  **Developing the Answers (2-minute limit):**
      *   Need to be punchy, acknowledge the force, pivot back to the core contractualist insight (reasonable rejection).
      *   *Consequentialist:* Acknowledge efficiency, but emphasize *fairness to the individual* as a constraint on maximization.
      *   *Kantian:* Reframe complaints as a proxy for reasons/dignity.
      *   *Scanlonian:* Argue that linkage preserves individualism better than headcounting.
      *   *Decision Theorist:* Clarify the temporal standpoint of the contractor.
      *   *Law:* Distinguish moral standing from legal procedural standing.

  5.  **Identifying the "Single Reply" and "Concessions":**
      *   *Single Reply:* The definition of "Reasonable Rejection" in the linked case. If they are linked, rejecting the policy means rejecting it for *all*, which is harder to justify if the alternative is catastrophic for one.
      *   *Concessions:* Admit the theory is context-sensitive. Admit it doesn't solve *all* aggregation cases.
      *   *Weakest Point:* Is it menu dependence? Or is it the definition of "Jointly Unavoidable"? If the linkage is fragile, the theory is fragile. Actually, the *weakest* point might be the **Paraplegic vs. Hearing Loss case itself**. Does that case actually satisfy the linkage condition? If the hearing loss is from noise pollution, fixing the source saves all. If it's genetic, it doesn't. If the user's example doesn't fit the condition, the paper dies. I need to flag this.
      *   *Actually, the prompt asks for my read on where they are weakest.* Menu dependence is bad, but **Arbitrariness of Linkage** is worse. Why does a common cause justify aggregation but distinct causes don't, if the *harm* is the same? This is the "Moral Irrelevance of Causation" objection.

  6.  **Refining the "Question I Hope Nobody Asks":**
      *   Usually, this is the "Gotcha" that exposes a fatal flaw.
      *   Candidate: "What if I can break the linkage artificially?" (Menu dependence).
      *   Candidate: "Does this imply we should prioritize linked harms over unlinked harms even if the unlinked are worse?"
      *   Candidate: "How do you define 'spare'?"
      *   *Selection:* The "Artificial Linkage" or "Bundling" objection. If I can bundle distinct harms into one policy, do I create permission to aggregate where none existed? This leads to manipulation.

  7.  **Review and Formatting:**
      *   Tone: Professional, supportive, sharp.
      *   Structure: Follow the prompt's requirements exactly.
      *   Check constraints: 8 objections, specific phrasing, 2-min answers, concessions, single reply, hidden weakness, dreaded question.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I address the EA crowd properly? They care about *opportunity cost*.
      *   *Check:* Did I address the Scanlonian? They care about *individual justification*.
      *   *Check:* The "Linkage Condition" needs to be defended against the charge that it's ad hoc.
      *   *Refinement on Weakness:* I think the *weakest* point isn't menu dependence, it's the **moral significance of the linkage itself**. Why does the *technical possibility* of saving them together change the *moral weight* of their complaints? If I have a pill that cures all 500, vs 500 pills that cure 1 each, is the harm different? No. The *cost* to the agent might be different, but the *complaint* of the victim? That's the vulnerability. I will highlight this.

  9.  **Final Polish:** Ensure the "Two-Minute Answer" sections are actually speakable in two minutes (approx. 250-300 words). Ensure the tone matches a job talk prep (strategic, not just theoretical).

  *(Self-Correction on the "Single Reply"):* The prompt asks for "the single reply that has to land or the paper dies." This needs to be the core defense of the Linkage Condition. It must explain *why* linkage changes the reasonable rejection calculus.
  *(Self-Correction on "Weakest Point"):* I need to be honest. Menu dependence is a symptom. The disease is the "Moral Irrelevance of Causation/Technology." I'll advise them to fortify that.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a high-stakes talk. Your position is nuanced, which is good for philosophy but risky for a job market where clarity often wins. Your audience is hostile on multiple axes (maximization, individualism, legal realism). You need to be strategically defensive without sounding cornered.

  Here is your Q&A Prep Sheet.

  ### The Q&A Prep Sheet

  **1. The EA/Consequentialist (The "Waste" Objection)**
  *   **Phrasing:** "You're leaving QALYs on the table. If 500 people suffer hearing loss, that's a quantifiable utility deficit greater than one person's paraplegia. By forbidding aggregation in unlinked cases, you're prioritizing a metaphysical constraint over actual suffering. Why should the *structure* of the harm dictate the *value* of the relief?"
  *   **2-Minute Answer:** "I agree that suffering is bad. But contractualism isn't about minimizing badness; it's about justifying principles to individuals. If I tell the paraplegic, 'We let you suffer because 500 others had minor headaches,' she can reasonably reject that. But if I tell the 500, 'We couldn't save you without saving everyone, and saving everyone was too costly,' the rejection is weaker. The structure matters because it changes what we owe *each person*, not just the total sum. We aren't minimizing suffering; we're managing fair terms of cooperation."

  **2. The Scanlonian Ally (The "Stability" Objection)**
  *   **Phrasing:** "Scanlon's worry was that once you open the door to aggregation, you can't stop the slide to utilitarianism. Your 'linkage condition' looks like a stopper, but why doesn't it dissolve under pressure? If I have 500 unlinked people, why can't I just treat them as a 'group' by administrative fiat?"
  *   **2-Minute Answer:** "Because the linkage isn't administrative; it's modal. It's about what was *possible* in the world, not how we file the paperwork. If the technology or situation physically links their fates—saving one *necessarily* saves all—then their complaints merge. If they are distinct, their complaints remain distinct. The slide to utilitarianism happens when we ignore the individual standing. My condition forces us to look at the individual's modal situation before we sum."

  **3. The Kantian (The "Currency" Objection)**
  *   **Phrasing:** "You're building this on 'complaints.' But persons aren't containers of complaints. They are ends in themselves. By weighing complaints, even conditionally, you're treating people as sites of value rather than sources of law. Why not ground this in dignity directly?"
  *   **2-Minute Answer:** "I use 'complaints' as a shorthand for 'reasons to reject.' This isn't about aggregating pain; it's about aggregating *authority*. In linked cases, the group has a collective authority to reject a principle that single individuals don't. Dignity is preserved because I'm not overriding the one for the many; I'm acknowledging that the many, when linked, constitute a different moral claimant than the many when scattered."

  **4. The Decision Theorist (The "Ex Ante/Ex Post" Objection)**
  *   **Phrasing:** "Is your linkage condition evaluated ex ante or ex post? If I buy a lottery ticket for 500 people, and they all win or lose together, are they linked? Or does it depend on the causal mechanism? If it's ex ante, you're just doing risk-weighted utilitarianism."
  *   **2-Minute Answer:** "It's ex post regarding the *burden*, but ex ante regarding the *principle*. We are choosing principles behind a veil of ignorance, but the principles must hold for the actual outcomes. The linkage is about the actual causal structure of the harm. If the risk is correlated, that matters for the principle, but the permission to aggregate rests on the fact that in the actual world, their fates were tied. It's not about risk; it's about the inevitability of the distribution."

  **5. The Tort Scholar 1 (The "Standing" Objection)**
  *   **Phrasing:** "In tort law, we care about standing. If 500 people are exposed to a toxin, they can form a class action. If they break 500 legs in separate accidents, they can't. Are you just mirroring procedural law? If the law changed, would your morality change?"
  *   **2-Minute Answer:** "No, I'm mirroring the *moral reality* that the law tries to track. Class action exists *because* the harms are jointly caused. But my view isn't dependent on the legal procedure. Even if the law didn't allow class actions, the moral linkage would remain. The law is often catching up to the moral fact that linked burdens create a different kind of claim than scattered ones."

  **6. The Tort Scholar 2 (The "Causation" Objection)**
  *   **Phrasing:** "You say 'jointly unavoidable.' But causation is messy. If I poison a water supply, I harm 500. If I push 500 people into a river, I harm 500. Is the first linked and the second not? That seems like a moral distinction without a difference."
  *   **2-Minute Answer:** "It is a difference in *remediation*. In the water supply case, one action reverses all harms. In the river case, I must jump in 500 times. The 'joint unavoidability' is about the *solution*, not just the cause. If the remedy is binary (fix the water), the complaints link. If the remedy is iterative (save each swimmer), they don't. This tracks the agent's burden and the victims' dependency."

  **7. The Consequentialist 2 (The "Opportunity Cost" Objection)**
  *   **Phrasing:** "Let's say I have resources to save the 500 linked people or the one paraplegic. You say I can save the 500. But what if saving the 500 linked people costs the same as saving 500 *unlinked* people? Why do the unlinked people lose out just because their harm wasn't technologically linked?"
  *   **2-Minute Answer:** "Because the unlinked people don't have the same leverage. The linked group can say, 'You must take all of us or none.' The unlinked group can only say, 'Save me.' The paraplegic's claim is strong enough to beat 500 individual 'save me' claims, but not strong enough to beat one collective 'save us' claim. It's not about cost; it's about the structure of the veto power."

  **8. The Generalist (The "Sorites" Objection)**
  *   **Phrasing:** "How mild can the hearing loss be? At what point does the linked group lose the right to aggregate? If it's a tiny itch for a million people, do they beat the paraplegic?"
  *   **2-Minute Answer:** "Contractualism handles this via 'reasonable rejection.' A million tiny itches might not generate a complaint weighty enough to override paraplegia, even if linked. The linkage condition is a *permission* to aggregate, not a *command*. You still have to pass the reasonable rejection test. The linkage just allows the sum to enter the calculus; it doesn't guarantee the sum wins."

  ---

  ### Strategic Concessions (Say these in the talk)
  *Don't wait for them to force these out of you. Pre-empt them to look confident.*

  1.  **Concede Context-Dependence:** "I admit this makes moral permission sensitive to technological and causal facts. Some might find this unstable, but I argue it reflects the reality of our interdependence."
  2.  **Concede Non-Universality:** "This view does not solve *all* aggregation problems. It is designed specifically for the 'numbers count' intuition in rescue/policy cases without collapsing into headcounting."
  3.  **Concede the "Mildness" Limit:** "Linkage permits aggregation, but it does not override the severity threshold. Trivial harms, even linked, cannot override catastrophic individual harms."

  ---

  ### The Single Reply That Has to Land
  *If you fumble this, the paper fails. This is your core mechanism.*

  **The Objection:** "Why does the *possibility* of saving them together change the *moral weight* of their complaint? If I suffer hearing loss, I suffer it regardless of whether my neighbor's hearing is also saved."
  **The Reply:** "Because contractualism is about **justification to the individual**, not the assessment of states of affairs. If I spare you, I *must* spare them. Therefore, your complaint is not 'Why did you let *me* suffer?' but 'Why did you let *us* suffer?' The 'us' changes the reasonable rejection calculus because the cost of sparing you is the cost of sparing the group. You cannot claim a right to be spared if the price of that right is granting the same to hundreds of others when the budget doesn't allow it. The linkage makes the cost of your individual rescue prohibitive in a way that distinct cases do not."

  ---

  ### The Question You're Hoping Nobody Asks
  **"The Bundling Objection":**
  *"If linkage permits aggregation, what stops a government from artificially bundling distinct harms into one policy to trigger your condition? If I distribute hearing aids individually, they are unlinked. If I distribute them via one water-soluble pill in the supply, they are linked. Are you saying morality depends on my delivery mechanism?"*

  **Why it's deadly:** It suggests your view is manipulable. If I can *choose* the technology to make the aggregation permissible, the constraint is illusory.
  **Prep for this:** You must argue that the linkage must be **ontologically prior** to the decision, not a feature of the chosen remedy. The *harm* must be linked, not just the cure. (See Tort Scholar 2 answer above).

  ---

  ### My Read on Your Actual Weakest Point
  You suspect it's menu-dependence. I think it's worse. **It's the Moral Irrelevance of Causation.**

  **The Problem:**
  Imagine two worlds.
  *   **World A:** A toxin leaks. 500 people get hearing loss. One pill cures all. (Linked).
  *   **World B:** 500 people get genetic hearing loss. 500 pills cure them individually. (Unlinked).

  In both worlds, 500 people suffer the exact same pain. In both worlds, you have the resources to save the 500 OR the one paraplegic.
  In World A, you say: "Save the 500."
  In World B, you say: "Save the Paraplegic."

  **The Weakness:** The *suffering* is identical. The *resources* are identical. The only difference is a metaphysical fact about causation/technology. The Consequentialists and the Kantian will hammer this. They will argue that **moral priority should track the severity of the harm, not the topology of the cause.**

  **How to Fortify:**
  You need to lean harder into the **Agent-Relative Burden**.
  In World A, the agent faces *one* decision with *one* cost to save all.
  In World B, the agent faces *500* decisions.
  Contractualism is about what principles the *agent* can justify.
  *   In World A, the agent says to the Paraplegic: "To save you, I must refuse to save the 500 as a block."
  *   In World B, the agent says to the Paraplegic: "To save you, I must refuse to save Person 1, and refuse to save Person 2..."
  The *reason* given to the Paraplegic is different. In the Linked case, the "Many" speak with one voice. In the Unlinked case, they speak with 500.
  **Your defense:** "It's not about the victims' pain; it's about the **structure of the justification** the agent must offer. I can justify ignoring the Linked Group to save the One only if the Group's claim is weaker. But their claim is stronger *because* they stand or fall together. It's about the **solidarity of the claim**, not the sum of the pain."

  If you don't nail the distinction between "Sum of Pain" (Utilitarian) and "Solidarity of Claim" (Contractualist), the EA crowd will eat you alive. Good luck.
