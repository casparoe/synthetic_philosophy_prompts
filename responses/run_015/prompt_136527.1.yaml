answer: |-
  This is a precise and unsettling description. You have isolated a dynamic that sits in the blind spot between the static impossibility theorems of economics and the psychological models of social learning. You are asking about a process where the *success* of an epistemic tool disables the *machinery* that powers it, without immediately breaking the tool itself.

  To find the shape of this idea, I will test three candidate concepts that hover near your description. I will measure them against your specific constraints: the distinction between *ignoring* information versus *not producing* it, and the temporal lag where accuracy survives the loss of grounding.

  ### Candidate 1: The Grossman-Stiglitz Paradox
  **The Concept:** In the economics of information, this paradox states that if a market price perfectly reveals all private information, no agent has an incentive to incur the cost of acquiring that information. If no one acquires information, the price cannot reflect it. Therefore, a fully informative equilibrium is impossible; there must always be enough "noise" to reward information gatherers.

  **Testing against your pattern:**
  *   **Fit:** It captures the incentive structure perfectly. It explains *why* the trader stops driving out to look at the grain: the price already tells them what the grain is worth, so the cost of looking is wasted.
  *   **Mismatch:** Grossman-Stiglitz is an *equilibrium condition*. It is a logical claim about what states can exist, not a sociological claim about how a system drifts over time. It says, "You cannot have a price that is 100% informative." Your phenomenon describes a system that *appears* to be highly informative and accurate for a long period, slowly decaying while maintaining that appearance. Grossman-Stiglitz describes the cliff at the end of the road; you are describing the erosion of the road surface while the car is still driving smoothly.
  *   **Verdict:** This captures the *incentive*, but misses the *temporal decay* and the *invisible stability*.

  ### Candidate 2: Informational Cascades
  **The Concept:** In social epistemology, a cascade occurs when individuals, acting sequentially, ignore their own private signals and mimic the actions of those before them. Eventually, the public pool of actions overwhelms the private information of the group.

  **Testing against your pattern:**
  *   **Fit:** It captures the reliance on the aggregate (the "public pool") over private judgment. It explains how a consensus can form that is detached from individual ground-truth.
  *   **Mismatch:** As you noted, cascades require agents to *possess* private signals and then *choose* to ignore them. Your case is distinct: the agents never generate the signal. Furthermore, cascades are notoriously fragile; a single defector with a strong private signal can shatter the consensus. In your pattern, a defector cannot shatter the consensus because there is no private signal to defect *with*. The consensus is robust not because it is strong, but because there is no counter-force left in the system to challenge it.
  *   **Verdict:** This captures the *reliance on the public*, but misses the *pre-production failure* and the *robustness of the hollow state*.

  ### Candidate 3: Reflexivity (Self-Defeating Prophecy)
  **The Concept:** A belief or prediction influences the reality it describes in such a way that it undermines its own basis. For example, predicting a bank run causes the run.

  **Testing against your pattern:**
  *   **Fit:** It captures the feedback loop. The existence of the accurate price changes the behavior of the participants, which alters the conditions of the price's accuracy.
  *   **Mismatch:** Standard reflexivity usually implies *ontological* change: the prediction changes the *value* of the asset or the *outcome* of the event. Your phenomenon is *epistemic*: the prediction changes the *flow of information* about the asset, not necessarily the asset itself (yet). The grain is still there; the knowledge of the grain is what is vanishing. Also, reflexivity often implies a sudden correction when the belief fails. Your phenomenon allows for a long period of "zombie accuracy."
  *   **Verdict:** This captures the *feedback mechanism*, but misses the specific *epistemic starvation* and the *lag in accuracy*.

  ### The Leftover: Coining a Concept

  None of these concepts capture the specific combination of **incentivized non-production**, **inertial accuracy**, and **invisible decay**. Grossman-Stiglitz is too static; Cascades are about signal-ignoring; Reflexivity is about reality-changing.

  You need a term for a system that maintains its output quality by consuming its own input capacity, masked by the inertia of past labor.

  I propose the name: **Epistemic Hollowing**.

  #### Definition
  **Epistemic Hollowing** is a systemic dynamic in which a successful information-aggregating institution reduces the incentive for its participants to generate independent ground-truth data, leading to a gradual cessation of information production. Crucially, the aggregate retains predictive accuracy for a significant duration due to the residual validity of past data or the inertial stability of the underlying reality, thereby masking the loss of its epistemic foundation. The failure mode is not the distortion of information, but the atrophy of the capacity to produce it.

  #### The Shape of the Idea
  Think of a flywheel. It spins smoothly (accuracy) because it was spun hard in the past (independent inquiry). Friction is low, so it keeps spinning even after the engine is turned off (participants stop working). To an observer, the flywheel looks functional. The "Hollowing" is the disconnection of the engine. The system is not yet broken, but it is no longer self-sustaining. It is running on momentum, not power.

  #### Edges and Boundaries

  **Cases Clearly IN (Epistemic Hollowing):**
  1.  **The Algorithmic Supply Chain:** A logistics firm uses an AI to predict parts failure. Initially, mechanics verify the AI's alerts. Over time, they trust the AI completely and stop manual inspections. The AI remains accurate for years because parts failure rates are stable and the training data was robust. Suddenly, a new type of material defect appears. The AI misses it, and the mechanics no longer know how to spot it manually. The accuracy held until the regime shifted.
  2.  **The Consensus Forecast:** A central bank relies on a panel of commercial bank forecasts. As the central bank's policy becomes predictable based on these forecasts, the banks stop doing independent macro analysis and simply model the central bank's reaction function. The forecasts remain accurate as long as the central bank follows its own model. The "information" is now just a circular reference, but it looks correct until an external shock requires a policy break the model doesn't anticipate.
  3.  **Your Freight Pricing:** Traders stop checking physical grain levels because the futures curve predicts the shortage. The price stays accurate because the few remaining physical shippers (who move grain for operational reasons, not trading) arbitrage the difference. The price is grounded only by those who don't care about the price signal.

  **Cases Clearly OUT (Not Epistemic Hollowing):**
  1.  **The Hiring Committee (Pluralistic Ignorance):** Members have private doubts but speak publicly in favor. This is *not* hollowing because the private information *exists*; it is merely suppressed. A single defector can fix this. In hollowing, a defector has nothing to bring.
  2.  **The Bank Run (Reflexivity):** The belief causes the collapse immediately. There is no period of "inertial accuracy" where the bank remains solvent while the belief decays.
  3.  **The Efficient Market (Grossman-Stiglitz Limit):** A theoretical state where price equals value. This is a boundary condition. Hollowing is the *process* of drifting toward that boundary while the system degrades.
  4.  **Data Corruption:** If the server storing the prices gets corrupted, accuracy drops immediately. This is technical failure, not epistemic erosion via incentive structures.

  #### Relation to the "Cousin" Puzzle
  You mentioned the older puzzle: *If the price already contains what everyone knows, what exactly is the person who buys trading on?*

  That puzzle (Grossman-Stiglitz) asks about the **possibility of profit** in an informative market. It concludes that if the price is fully informative, profit is impossible, so trading stops.

  Your puzzle asks about the **possibility of grounding** in a trusted market. It concludes that if the price is trusted enough, inquiry stops, so the price becomes ungrounded.

  The cousin puzzle is about the *end state* of information (it vanishes into the price). Your puzzle is about the *source state* of information (it vanishes from the people). The cousin puzzle worries that the price becomes *too* informative. Your puzzle worries that the price becomes *too* convincing.

  **Epistemic Hollowing** is the name for the drift between "informative" and "ungrounded." It is the period where the price is still right, but the traders are no longer listening to the world, only to the price. It is the shape of a system that has forgotten how to learn, but has not yet forgotten what it learned.
