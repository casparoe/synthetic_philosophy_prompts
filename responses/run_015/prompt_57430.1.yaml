answer: |-
  I considered a resource-economy simulation and a role-playing negotiation. I rejected both: economies distract from selection pressures, and role-play slows pacing. The foraging grid isolates the *locus of selection*, which is Dennett's core distinction.

  **Rules & Materials**
  18 students, 6 groups of 3. Each gets a 10x10 grid board, a token, and a deck of move cards (Forward, Left, Right). Hidden "traps" lie under specific squares (lift to check).
  *   **Scoring:** +10 per step forward, -50 per trap hit. Track cumulative points per round.
  *   **Round 1 (Darwinian):** Pre-set deck (e.g., 3 Forward, 1 Left). Play all cards. No changes allowed.
  *   **Round 2 (Skinnerian):** Same deck. After play, discard moves that hit traps. Keep winners for next round.
  *   **Round 3 (Popperian):** Receive blank map showing trap locations. Trace path on paper *before* moving token.
  *   **Round 4 (Gregorian):** Receive "Ancestor Notebook" (heuristics from prior class). **Twist:** Trap locations shift 1 square right. Notebook says "Zone A Safe," but it is now lethal.

  **Timeline (80 mins)**
  *   **0-10:** Intro & Grouping.
  *   **10-25:** R1 (Darwinian). Hard stop whistle.
  *   **25-40:** R2 (Skinnerian).
  *   **40-55:** R3 (Popperian).
  *   **55-70:** R4 (Gregorian + Shift).
  *   **70-80:** Debrief.

  **Debrief Mapping**
  *   **R1 Rage:** "I couldn't change!" maps to genetic lock-in. The creature *is* its repertoire.
  *   **R2 Lag:** "I died learning." maps to reinforcement requiring survival. You must survive to learn.
  *   **R3 Insight:** "I died on paper, not board." maps to internal simulation. Hypotheses die instead of you.
  *   **R4 Betrayal:** "The book lied." maps to cultural scaffolding. Gregorian advantage is contingent on environmental stability. The notebook is a tool, not a truth.

  **Predictable Failures**
  1.  **Speed Variance:** Fast groups finish R1 while others struggle. *Fix:* Enforce hard stops regardless of progress.
  2.  **R3 Cheating:** Students move token while tracing. *Fix:* Monitor strictly; this breaks the Popperian distinction.
  3.  **R4 Cynicism:** Groups ignore notebook immediately. *Fix:* Make notebook 80% correct, 20% lethal, forcing reliance before failure.

  **The Unreproducible Feature**
  Dennett's rungs describe *sub-personal* architectural layers. In this game, the *students* are the selectors, making the process conscious and personal. You must explicitly lecture that in real minds, the "Darwinian creature" doesn't *feel* determined; the selection happens below the level of awareness. The game externalizes internal architecture. If you don't bridge this gap, students leave thinking evolution is a conscious choice. The game simulates the *logic* of the rungs, not the *phenomenology*. You must supply the claim that these layers operate simultaneously in us, not sequentially as the rounds suggest. The game is a metaphor; the philosophy is the work you do after the tokens are put away.
