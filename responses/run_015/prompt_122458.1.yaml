answer: |-
  There is a single principle that reconciles all seven of your verdicts, but it requires you to explicitly abandon **pure consequentialism** (the idea that the moral worth of an act is determined solely by its outcomes). Your intuitions are consistently **non-consequentialist**; they track *participation* and *integrity* rather than *leverage*.

  The principle is **Participatory Integrity**.

  **The Principle:**
  *Your moral standing is determined by whether you voluntarily make yourself a participant in a harmful practice or a constitutive member of a beneficial one, regardless of whether your individual participation changes the aggregate outcome.*

  Here is how it lines up your cases:

  1.  **The Chickens (Cases 1 & 2):** Factory farming is a harmful practice. By buying the chicken, you participate in the transaction that sustains it. In Case 1, you nudge future supply. In Case 2, you do not nudge supply, but you still complete the exchange that validates the cruelty. Your "clean hands" matter more than the bird's fate, which is sealed either way. **Verdict: Wrong.**
  2.  **The Vote & Drive (Cases 4 & 5):** Voting is a constitutive practice of democracy. It only functions as a system if people participate. By voting, you become a member of the civic body. The drive is a necessary cost of that participation. **Verdict: Right/Admirable.**
  3.  **The Solvent (Case 6):** Pouring solvent is a direct participation in a destructive act. Even if the fish die anyway, you have made yourself a polluter. You are not responsible for the *total* death, but you are responsible for *your* contribution to the killing practice. **Verdict: Wrong.**
  4.  **The Joydrive (Case 3):** Driving for pleasure is not participation in a specific harmful *practice* in the same way; it is exercising a permitted liberty within a system where some emissions are an accepted background cost. It lacks the specific intent or direct threshold contribution of the solvent. **Verdict: Permissible.**
  5.  **The Boycott (Case 7):** Refusing to shop is refusing participation in a harmful corporate practice. It maintains your integrity even if the company's lobbying continues. **Verdict: Admirable.**

  ### Prediction: The Enormous Protest
  You asked about turning up to a protest that will be enormous whether you are there or not, meaning your presence changes nothing observable.

  **Prediction:** **You should go.**

  **Reasoning:** Under Participatory Integrity, the value of the protest is not solely in its causal leverage (changing a policy) but in its expressive function (constituting a body of dissent). By attending, you align yourself with the practice of democratic objection. Absenting yourself because "it won't matter" treats the protest as a mere tool for outcomes rather than a civic ritual in which you have a duty to participate. Your presence is a vote of solidarity, which is valuable in itself.

  ### Confidence and Uncertainty

  **Confidence:** **85%**
  I am highly confident that *Participatory Integrity* is the principle underlying your specific set of intuitions. It cleanly resolves the tension between the "ineffective vote" (good) and the "ineffective chicken purchase" (bad) by shifting the metric from *causal power* to *moral alignment*.

  **Least Sure Point:** **The distinction between the Joydrive (Case 3) and the Solvent (Case 6).**
  This is the weakest link in the chain. Both release harmful substances into the environment. The principle relies on the solvent being a "direct participation in a specific harm event" and the car being "background noise." But if the climate crisis is a threshold problem like the fish in the creek, the joydrive is theoretically identical to the fifth litre of solvent.
  To keep your verdicts consistent, you must argue that the solvent case involves a *known, immediate threshold* (five litres kill fish *now*), whereas the car involves a *diffuse, statistical harm* (one drive contributes to warming *somewhere, sometime*). Drawing that line without arbitrariness is philosophically difficult, and it is the point where your intuitions are most vulnerable to contradiction.
