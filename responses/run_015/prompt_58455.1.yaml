          *   *Better Idea for R4:* The "Ancestral Map." The previous rounds' data is compiled into a master map they can use. OR, they are allowed to communicate with other groups. Let's go with *External Artifacts*. They can create a map legend or use a "compass" (a rule card) that simplifies the cognitive load.

      *   *Decision:* To fit the "unsettling appreciation" that tools *reorganize* the task:
          *   R1: No memory, no feedback. (Darwinian)
          *   R2: Individual reinforcement. (Skinnerian)
          *   R3: Individual planning. (Popperian)
          *   R4: Shared/Cumulative artifacts. (Gregorian). *Key:* In R4, give them a "Legacy Map" from a previous (fictional) cohort that has errors, or allow them to draw on the grid permanently. Let's allow them to *mark the grid* permanently. This changes the environment, not just the mind.

  5.  **Timing Check:**
      *   Intro: 5 mins.
