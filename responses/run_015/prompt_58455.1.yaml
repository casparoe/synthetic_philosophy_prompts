  7.  **Addressing the "Unsettling Appreciation":**
      *   The debrief must highlight that in R4, they didn't just think *better*; the *problem changed* because the environment contained intelligence (the marks).
      *   Must introduce the Dennett terms *after* the experience.

  8.  **Anticipating Difficulties:**
