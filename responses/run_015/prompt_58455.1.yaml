      *   R2: Move one square, reveal, move next. (Feedback).
      *   R3: Get a "Sonar" scan (3 squares revealed) before starting. (Modeling).
      *   R4: Get the "Captain's Log" (Map from previous game) + ability to mark the grid. (Cultural).

      *Wait, I need to ensure the "costs of dependence" are visible.*
      *   In R4, maybe the "Captain's Log" has a mistake, or the tool breaks, or they are so reliant they can't navigate without it.
      *   *Idea:* In R4, give them a pre-drawn "Safe Route" from a previous cohort. BUT, the currents have shifted slightly (one predator moved). If they follow blindly, they crash. This shows the cost of dependence.

  11. **Finalizing the Plan:**
      *   **Title:** The Reef Navigation Challenge.
      *   **Materials:** Grids, tokens, pens, "Hazard Key" (for facilitator), "Legacy Map" (for R4).
      *   **Rounds:**
          1.  *Blind Instinct:* Commit path, reveal hazards. (Darwinian).
          2.  *Stepwise Feedback:* Move, reveal, adjust. (Skinnerian).
          3.  *Internal Simulation:* Preview hazards, plan full path. (Popperian).
          4.  *Cultural Inheritance:* Use previous group's map + mark grid. *Twist:* The map is mostly right but has one fatal flaw (shifted predator). (Gregorian).

  12. **Writing the Response:**
