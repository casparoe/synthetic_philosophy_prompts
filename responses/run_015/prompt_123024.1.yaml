answer: |-
  **Private Brainstorming Notes**

  1.  **Core Claim:** The essay argues that historical contingency cannot be tested by single-decision counterfactuals (changing one vote) but requires blocking all functional equivalents (the obstruction test).
  2.  **Key Distinction:** 'Shadowed' (outcome inevitable via some route) vs. 'Locked' (outcome dependent on this specific sequence). This maps roughly onto structural inevitability vs. path dependence, but the terminology is novel.
  3.  **Vulnerability:** The test relies entirely on how the outcome is individuated. If the outcome is 'industrialisation', it is always shadowed; if 'Reever's Canal', it is always locked. The essay must govern this granularity.
  4.  **Section 5:** The claim that contingency is relative to the observer's temporal standpoint is philosophically robust (modal indexicality) but risks slipping into scepticism. It needs ontological grounding, not just epistemic humility.
  5.  **Literary Insight:** The 'scene of no decision' is a strong contribution to the philosophy of narrative form, distinguishing process from event without resorting to omniscience.
  6.  **Terminology Risk:** 'Locked' is used counter-intuitively. In social sciences, 'lock-in' implies inevitability within a path; here it implies fragility. This will confuse readers familiar with standard usage.

  ***

  **Referee Report: "The Corridor and the Door"**

  This is a compelling sketch that bridges the gap between literary craft and the metaphysics of history. You avoid the usual trap of treating fiction as merely illustrative of philosophical points; instead, you argue that narrative form itself generates specific philosophical errors regarding contingency. Below I address your specific queries regarding the argument's stability, novelty, and exposition.

  **The Obstruction Test and Level of Description**
  You are right to worry that the obstruction test is hostage to the level of description. If the outcome is defined functionally ('goods moved past the shoals'), the railway ensures the outcome is shadowed. If defined specifically ('Reever's Canal dug by 1850'), the outcome is locked. The test does not determine the status of the outcome; it merely reveals the consequences of your chosen granularity.

  However, the essay does not die here; it merely shifts burden. You must argue that the *correct* level of description for historical understanding is functional, not specific. History cares about transport capacity, not specific ditches. If you make this explicit, the test holds together as a tool for selecting the right description, rather than verifying necessity independently of it. Without this, the test is circular: you get out the level of necessity you put in via the outcome description.

  **Novelty of the Distinction**
  The shadowed/locked distinction is not old hat, though it resonates with existing debates. It echoes the tension between structuralist history (forces make things happen) and event-history (agents make things happen), and resembles Stephen Jay Gould's discussions of 'replaying the tape of life'. However, framing this through the 'obstruction test'—blocking all functional equivalents rather than tweaking single variables—is a fresh contribution. It moves beyond the standard 'what if Napoleon won?' counterfactuals which philosophers of history often dismiss as trivial. You are offering a modal depth condition rather than a simple variable swap. This is worth keeping.

  **Three Damaging Objections**

  1.  **Epistemic Inaccessibility:** The obstruction test requires knowledge of all possible alternative routes to an outcome, including those never conceived. Since we cannot know the space of possible historical technologies or social arrangements, the test is empirically impossible to apply. It demands omniscience.
      *   *Sketch Reply:* Concede the point but reframe the test as a regulative ideal rather than an empirical verification. Its value is not in proving necessity, but in disciplining the imagination. It forces the historian or novelist to search for structural pressures before attributing outcomes to singular choices. It is a heuristic for humility, not a proof of fate.
  2.  **The Normative Drift:** There is a risk that 'shadowed' becomes synonymous with 'justified' or 'progressive'. If an outcome arrives regardless of obstruction, readers may infer it was historically warranted. This smuggles teleology back in under the guise of modal analysis.
      *   *Sketch Reply:* You must decouple inevitability from value. A disaster can be shadowed (e.g., a war caused by structural alliances) just as easily as a progress. Emphasise that 'shadowed' describes causal density, not moral weight.
  3.  **The Agency Erasure:** By classifying most outcomes as shadowed, you risk dissolving agency entirely. If the outcome arrives regardless of the agent, why study the agent? This undermines the novelist's primary material: human choice.
      *   *Sketch Reply:* Use your own distinction between 'who' (locked) and 'what' (shadowed). Agency determines credit, blame, and experience, even if it does not determine the macro-outcome. The novel lives in the 'locked' identity of the agent, even if the history lives in the 'shadowed' outcome.

  **Section 5: Retrospective Collapse**
  This is a genuine insight, not a confusion, provided you avoid scepticism. You are describing the indexical nature of modal claims: 'could have happened' is true relative to a time and evidence set. Once a branch is pruned, the modal landscape changes. To prevent this collapsing into 'we can never know', you must argue that contingency is a *relational property*, not an intrinsic one. It is not that the truth is unavailable, but that the truth *is* the relation between the event and the standpoint. Lean into this. It saves the essay from dogmatism.

  **Concrete Revision and Word Usage**
  **Revision:** In section 3, explicitly distinguish between *functional outcomes* (transport capacity) and *specific outcomes* (Reever's Canal). Argue that history is primarily interested in the former, while biography and fiction are interested in the latter. This resolves the level-of-description worry before the reader raises it.

  **Word Usage:** You use 'locked' in a way that fights normal meaning. In economics and sociology, 'path dependence' and 'lock-in' imply that an outcome *cannot* be changed once established (inevitability). You use 'locked' to mean the outcome *depends* on the specific path (contingency). If the path is blocked, the outcome fails. This is the opposite of standard usage. I strongly advise swapping 'locked' for 'fragile' or 'path-bound', or explicitly flagging this divergence. Otherwise, specialists will read your claim as its opposite.

  **Overall**
  This is a sophisticated piece of public philosophy. It treats the novel not as a decoration on history, but as a laboratory for modal reasoning. If you tighten the definitions and lean into the relational ontology of section 5, it will be a significant contribution.
