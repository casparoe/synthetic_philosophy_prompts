answer: |-
  You have stumbled directly into the technical machinery of **Molinism**.

  This is a specific framework within the philosophy of religion (originating with the Jesuit Luis de Molina in the 16th century, revived in modern analytic philosophy by Alvin Plantinga, William Lane Craig, and others) that attempts to reconcile divine sovereignty/foreknowledge with libertarian free will. Your instincts as a geophysicist are tracking the philosophical problems perfectly; the objections you are sensing are the standard, high-level critiques of this system.

  Here is the terminology you need to pin down the two moves you identified.

  ### 1. The Counterfactuals: "Middle Knowledge" and the "Grounding Objection"

  You asked for the name of the counterfactuals and the objection that there is "nothing to make them true."

  *   **The Counterfactuals:** These are technically called **Counterfactuals of Creaturely Freedom (CCFs)**.
      *   *Form:* "If creature $C$ were in circumstance $S$, $C$ would freely do $X$."
      *   *The Epistemic Category:* In Molinism, God's knowledge is divided into three "moments" (logically, not temporally):
          1.  **Natural Knowledge:** Necessary truths (logic, math, metaphysics). God cannot change these.
          2.  **Middle Knowledge:** Contingent truths that are not under God's control (specifically, the CCFs). God knows these *before* He decides to create.
          3.  **Free Knowledge:** Truths about the actual world, which depend on God's decree to create.
      *   The specific move you are describing is the claim that CCFs belong to **Middle Knowledge** (*scientia media*).

  *   **The Objection:** This is called **The Grounding Objection**.
      *   *The Argument:* For any proposition to be true, there must be a "truthmaker"—some ontological ground that makes it true. In physics, as you noted, a counterfactual is grounded in laws of nature + initial conditions. In Molinism, the CCF is true *prior* to the existence of the creature, the circumstances, or any laws governing that specific choice.
      *   *The Critique:* Critics (like Robert Adams, William Hasker, and many open theists) argue these are **Brute Contingent Truths**. They are contingent (they could be otherwise) but have no ontological ground. To a scientist, this looks like asserting a boundary condition without a field equation to support it.
      *   *Distinction:* You asked how to keep this separate from "brute counterfactuals." In philosophy, the term is usually **"Ungrounded Counterfactuals."** The Molinist bites the bullet and admits they are brute, arguing that God's omniscience simply grasps them. The critic says this violates the **Principle of Bivalence** or a robust correspondence theory of truth.

  ### 2. The Global Constraint: "Feasible Worlds" vs. "Possible Worlds"

  You asked about the move where God selects a world, but some logically consistent worlds are "unavailable" due to conflicting CCFs, and whether this is a limitation relabeled as a menu fact.

  *   **The Distinction:** This is the distinction between **Possible Worlds** and **Feasible Worlds**.
      *   **Possible World:** A logically consistent state of affairs (no contradictions).
      *   **Feasible World:** A possible world that God can *actually actualize*, given the CCFs.
      *   *The Move:* If a world $W$ contains a creature who *would* freely sin in situation $S$, God cannot actualize $W$ *and* ensure the creature does not sin in $S$, without violating their freedom. Therefore, $W$ is possible but not **feasible** for God.

  *   **The Specific Commitment:** The most famous application of this is Alvin Plantinga's **Free Will Defense**, which introduces the concept of **Transworld Depravity**.
      *   *Transworld Depravity:* It is possible that every possible free creature suffers from this property: in every world where they are free and do good, there is some action they *would* have gone wrong on if placed in a slightly different context. If Transworld Depravity is true, it is not feasible for God to create a world with moral good but no moral evil.
      *   *Your Instinct:* You asked if this is a "limitation relabeled as a fact about the menu." **Yes.** This is the primary critique from theological determinists (Calvinists) and classical theists. They argue this imposes an external constraint on God's power. The Molinist reply is that it is not a limitation on *power* (God can do anything logically possible) but a limitation on *actualizability* given the nature of freedom.
      *   *Is it distinct?* It is not a distinct commitment; it is a necessary consequence of the first. If CCFs are true prior to creation (Middle Knowledge), they logically constrain which worlds are feasible. You cannot have the CCFs without the Feasibility constraint.

  ### 3. Granularity and Specificity: The "Antecedent Conditions" Problem

  You asked if it matters how finely the situation is specified, and if the tension between specificity and utility has been written about.

  *   **The Problem:** This is often discussed under the header of **The Specificity of Antecedent Conditions**.
  *   **The Tension:**
      *   *Too Vague:* If the circumstance $S$ is too general ("offered the money"), the CCF might not have a truth value because the outcome depends on micro-variables not included in $S$.
      *   *Too Specific:* If $S$ includes *every* causal factor leading up to the choice, the counterfactual risks becoming trivial or deterministic. If $S$ includes the divine decree itself, you get circularity.
      *   *The "Golden Mean":* Molinists argue there is a "maximal" specification of circumstances that stops short of determining the will.
  *   **Has it been written about?** Yes. This is a major sub-debate in the Grounding Objection literature.
      *   **William Hasker** argues that if the antecedent is specific enough to guarantee a truth value, it effectively determines the outcome, destroying libertarian freedom.
      *   **Robert Adams** argues that there are simply no true CCFs prior to the existence of the creature; they only become true once the creature exists and acts (which collapses Middle Knowledge into Free Knowledge).
      *   **The "Conditionals of Freedom" Debate:** Search for this phrase. It addresses your concern that "the finer you make it, the less use the facts seem to be." If the situation is defined so tightly that it includes the choice, the statement is tautological ("If she is in a situation where she takes the money, she takes the money"). If it excludes the choice, the truth value is ungrounded.

  ### Summary for your Reading Notes

  To navigate the literature, use these search terms:

  1.  **Framework:** **Molinism** (or **Molinist Theism**).
  2.  **The Facts:** **Counterfactuals of Creaturely Freedom (CCFs)**.
  3.  **The Knowledge:** **Middle Knowledge** (*Scientia Media*).
  4.  **The Objection to Truth:** **The Grounding Objection** (claiming they are **Ungrounded** or **Brute Contingent Truths**).
  5.  **The Constraint:** **Feasible Worlds** vs. **Possible Worlds**; **Transworld Depravity**.
  6.  **The Granularity Issue:** **Specificity of Antecedents** in Conditionals of Freedom.

  **Recommended Authors for your specific skepticism:**
  *   **For the Molinist view:** William Lane Craig (*The Only Wise God*), Alfred Freddoso (translation of Molina).
  *   **For the "Grounding" critique:** Robert Merrihew Adams ("Middle Knowledge and the Problem of Evil"), William Hasker (*God, Time, and Knowledge*).
  *   **For the "Constraint/Feasibility" critique:** Thomas Flint (*Divine Providence* - actually a defense, but very clear on the mechanics), or Patrick Todd on "The Open Future."

  Your physicist intuition that this looks like "boundary conditions without field equations" is essentially the secular/analytic philosophical consensus on the Grounding Objection. The Molinists are aware of this; their defense is usually that libertarian freedom *requires* this kind of ontological brute fact, or that God's knowledge is intuitive rather than discursive (He doesn't infer the truth, He just sees it). Whether that satisfies a scientist is another matter.
