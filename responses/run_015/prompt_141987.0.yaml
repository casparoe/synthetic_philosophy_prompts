answer: |-
  **Review Procedure for Probability Statements**

  **Objective:** Ensure every published number is traceable to a single type of support: Frequency (long-run counts), Propensity (physical tendency), or Belief (expert judgment).

  **Step 1: Identify Primary Support**
  Open the Technical Justification File. Identify the primary source of the number.
  *   **Frequency:** Based on count data (e.g., paleoseismic ruptures, component failures).
  *   **Propensity:** Based on physics simulations of the specific set-up (e.g., stress models, hydrology).
  *   **Belief:** Based on structured expert elicitation.
  *   **Sufficient Answer:** The file must cite one primary source type. If the number is derived from averaging two types (e.g., model output averaged with expert opinion) without a documented weighting scheme, flag as "Mixed Support."

  **Step 2: Validate Stability (Frequency Only)**
  If Frequency, locate the Reference Class Definition. Check the sensitivity analysis file.
  *   **Criteria:** If changing the class definition (e.g., "all basin faults" vs. "similar slip-rate faults") changes the probability by more than 50%, mark "Unstable Frequency."
  *   **Sufficient Answer:** A documented range of probabilities resulting from reasonable class definitions.

  **Step 3: Validate Boundary Conditions (Propensity Only)**
  If Propensity, verify the model's boundary conditions against the specific site.
  *   **Criteria:** If the current state (e.g., stress level, water volume) falls outside the model's calibrated range, mark "Extrapolated Propensity."
  *   **Sufficient Answer:** A statement confirming the specific site parameters lie within the model's validated domain.

  **Step 4: Validate Protocol (Belief Only)**
  If Belief, verify the elicitation protocol.
  *   **Criteria:** If experts were not calibrated against known outcomes or if opinions are unstructured, mark "Unsubstantiated Belief."
  *   **Sufficient Answer:** Documentation of calibration scoring and aggregation methods.

  **Step 5: Decision Logic**
  *   **Publish Number:** Single Support Type + Stable/Valid.
  *   **Publish Interval:** Mixed Support OR Unstable/Extrapolated. Use the min-max range found in Steps 2–4.
  *   **Do Not Publish:** Undefined Event (no threshold) OR Unsubstantiated Belief.
  *   **Hand to Director:** If the choice between Number and Interval depends on downstream risk tolerance rather than data stability, this is a judgment call. Return file with note: "Policy decision required on precision vs. accuracy."

  ***

  **Case Applications**

  **Case 1: Kestrel Fault Segment**
  *   **Support Type:** Frequency (paleoseismic records).
  *   **Review:** Step 2 applies. The file shows two reference classes: "all basin faults" (0.22) and "comparable slip-rate faults" (0.11).
  *   **Finding:** The variation is a factor of two (100%), exceeding the 50% stability threshold. Additionally, the current stress state is not represented in the record, suggesting a Propensity mismatch.
  *   **Verdict:** **Publish as Interval [0.11–0.22].**
  *   **Board Impact:** The board will dislike this. Planners cannot run single-point expected-cost arithmetic on an interval. The loss of precision hinders binary go/no-go decisions for town relocation.

  **Case 2: Carbon-Capture Containment Vault**
  *   **Support Type:** Mixed (Physics Model + Expert Elicitation).
  *   **Review:** Step 1 applies. There is no failure history (Frequency impossible). The physics model yields 0.02; experts yield 0.05–0.15. The published number averages these.
  *   **Finding:** This is "Mixed Support." The physics model assumes ideal materials (Propensity), while experts account for construction uncertainty (Belief). These are different claims.
  *   **Verdict:** **Do Not Publish single number.** Publish range [0.02–0.15] with explicit source labels.
  *   **Board Impact:** The board will dislike the inability to assign a single cost to failure. This prevents clean integration into budget models for the first-of-a-kind project.

  **Case 3: Glacier Collapse**
  *   **Support Type:** Propensity/Belief mix.
  *   **Review:** Step 5 applies. The event is "collapse." The file shows three teams using three different definitions of collapse (volume loss vs. speed vs. structural failure).
  *   **Finding:** The event is undefined. Without a fixed threshold, the probability has no referent.
  *   **Verdict:** **Do Not Publish.**
  *   **Board Impact:** The board will dislike the lack of actionable data. Regional planners cannot assess risk without a defined hazard threshold, delaying mitigation funding.

  ***

  **What this procedure cannot do**

  This procedure identifies mismatches between support types and output formats, but it cannot bridge the gap between a statistical claim and a decision weight. A frequency describes a long-run series; a propensity describes a physical set-up; a belief describes a state of knowledge. None of these equate to the confidence a planner is entitled to place in a single, non-repeated project. A 0.04 annual failure rate describes the levee system, not this year's fate. When a planner bets a town's safety on a single number, they assume a certainty of meaning this procedure cannot guarantee.

  Furthermore, reference class selection and event thresholds are managed, not solved. Step 2 flags unstable frequencies, but it does not tell us which reference class is "true." Step 5 rejects undefined events, but it does not define the threshold. We flag the ambiguity to prevent false precision; we do not remove the ambiguity itself. The final responsibility for acting on these numbers remains with the decision-maker, not the survey.
