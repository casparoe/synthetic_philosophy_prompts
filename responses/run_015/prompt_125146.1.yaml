answer: |-
  | Requirement | Motivating case | Status | What it knocks out | Conflicts |
  | :--- | :--- | :--- | :--- | :--- |
  | **Guarantee Factivity** | Illusion vs. Veridical Perception: You see a snake, it's a rope; the theory must explain why the first wasn't a *pramāṇa*. | Non-negotiable | Fallibilist accounts that allow "knowledge" to be false; merges *pramā* (veridical cognition) with *pramāṇa* (instrument). | **Action-Guidance:** You cannot use factivity to decide in real-time, since you don't know the outcome is true until too late. |
  | **Causal Individuation** | *Gavaya* recognition: Is knowing a wild cow via similarity a distinct causal chain, or just inference plus memory? | Camp Preference (Pluralist) | Reductionist accounts (e.g., Comparison = Inference; Postulation = Inference); collapses the count of *pramāṇas*. | **Parsimony:** Multiplying entities without necessity; violates the demand to minimize ontological commitments. |
  | **Intra-agential Discriminability** | Unverified Testimony: You hear a claim; can you tell internally if this is reliable testimony or a lucky guess without checking the fact? | User Invention | Externalist accounts (reliability is enough); *Anupalabdhi* (cannot distinguish absence of object from absence of capacity); blind trust. | **Externalist Reliability:** Causal history is often invisible to the agent; requiring access kills sources that work "in the dark." |
  | **Defeater Transparency** | Fat Devadatta: You know he doesn't eat by day; you must know *that* this defeats the "he is fasting" hypothesis via postulation. | Non-negotiable | Dogmatic foundationalism; accounts where knowledge persists despite the agent having no access to the undercutting condition. | **Infinite Regress:** Knowing a defeater is valid requires a source; validating that source requires another, ad infinitum. |
  | **Hierarchical Resolution** | Perception vs. Testimony: You see water, an expert says it's a mirage; the theory must say who wins without circularity. | Camp Preference (Hierarchist) | Egalitarian Coherentism (all sources weigh equal); contextualism where hierarchy flips arbitrarily without rule. | **Context Sensitivity:** Fixed hierarchies fail in expert domains (e.g., quantum physics) where testimony trumps naive perception. |
  | **Compositional Integrity** | Nested Sources: An inference where one premise comes from a mostly unreliable informant, compensated by a strong second premise. | Non-negotiable | Warrant Aggregation models (strong + weak = strong); accounts that ignore the "weakest link" in a causal chain of knowledge. | **Defeater Transparency:** Tracking the reliability history of every nested premise is cognitively impossible for finite agents. |

