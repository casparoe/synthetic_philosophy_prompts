      *   *Pramāta*: The knower/agent.
      *   Standard list: Perception (*pratyakṣa*), Inference (*anumāna*), Testimony (*śabda*), Comparison (*upamāna*), Postulation (*arthāpatti*), Non-cognition (*anupalabdhi*).
      *   Reductionist debates: Is *upamāna* just inference + memory? Is *arthāpatti* just inference? Is *anupalabdhi* just perception of absence?
      *   Core tension: Externalism (reliability is enough) vs. Internalism (agent must know *why* it's reliable). Nyaya is generally externalist realist (knowledge is factive, caused correctly), but needs to account for the agent's ability to navigate sources.

  3.  **Address User Requirement 1: Intra-agential Discriminability:**
      *   *Definition:* Agent must distinguish the source from the inside without relying on that source.
      *   *Challenge:* This is a strong internalist constraint. Classical Nyaya is largely externalist (a true cognition caused by the right process is knowledge, even if you don't know the process).
