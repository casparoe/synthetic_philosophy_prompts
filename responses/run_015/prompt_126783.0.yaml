answer: |-
  Here is a direct assessment of the implicit theory behind current gender-neutral style guides, evaluated against your three-way distinction and the constraints you set.

  ### 1. Verdict on Your Three-Way Split
  **Verdict:** Your distinction (Content, Default, Markedness) is **not a dud**, but it is **underdetermined** for the specific data set you provided. It explains why *chairman* is targeted, but it fails to explain why *human* is spared.

  *   **Content:** (Does it semantically entail male?) Rarely the driver. *Chairman* does not semantically entail male (a woman can be one), yet it is changed.
  *   **Default:** (Does it trigger a male prototype?) Strong driver. *Policeman* triggers a male image.
  *   **Markedness:** (Is male the unmarked base?) Strong driver. *Actor/Actress* asymmetry.

  **The Missing Variable:** **Synchronic Transparency.**
  The pattern you observed (changing *manhole* but keeping *human*) cannot be explained by Content, Default, or Markedness alone. *Human* is etymologically "man"-based but morphologically opaque to modern speakers. *Chairman* is transparent.
  *   **Confidence:** **High (90%).** Any theory that ignores morphological opacity cannot explain the exemption of *human/manual* while targeting *manpower*. The practice presupposes that linguistic sexism resides in **salient morphology**, not historical etymology.

  ### 2. The Implicit Theory of Linguistic Sexism
  The style guides presuppose a specific view of how language shapes thought, roughly aligned with **Sapir-Whorfian weak determinism** filtered through **Prototype Theory**.

  **What the practice strictly needs:**
  1.  **Salience over Truth:** The objection is not that *chairman* is false when applied to a woman (content), but that the morpheme *-man* is **salient** enough to activate a "Male" schema during processing.
  2.  **Male-as-Norm:** The theory assumes that if a generic term contains a specific gender marker, it structurally positions that gender as the "default human." This is where your **Markedness** intuition is correct. Markedness is objectionable *independently* of Content because it encodes a structural hierarchy (Male = Unmarked/Standard, Female = Marked/Deviation).
  3.  **Synchronic Agency:** Speakers are responsible for the current structure of their lexicon, not its history. If *human* is opaque, it is innocent. If *manhole* is transparent, it is guilty.

  **What merely "sits well" with the practice:**
  *   **Etymological Purity:** The guides often claim to care about "accuracy." This sits well with the reform but is contradicted by keeping *human*. If accuracy mattered, *human* would go.
  *   **Communication Efficiency:** Guides claim the goal is "clear communication." This sits well, but is often undermined if the new term (e.g., *firefighter* vs. *fireman*) is initially less recognizable to some demographics.

  *   **Confidence:** **High (85%).** The "Male-as-Norm" via markedness is the only coherent explanation for changing *manpower* (where no person is pictured) to *workforce*. If no person is pictured, "Content" and "Default" regarding a specific agent are irrelevant. The objection must be to the *conceptual equation* of Man = Human.

  ### 3. Is Markedness a Real Third Thing?
  You asked if Markedness is just Content/Default rearranged.
  **Answer:** It is distinct from Content, but tightly coupled with Default.

  *   **Distinct from Content:** You can have markedness without semantic content. *Poet/Poetess*. The content is the same; the morphology differs. Reform targets this. So Markedness is independent of Content.
  *   **Coupled with Default:** Markedness usually *creates* the Default. Because *Actor* is unmarked and *Actress* is marked, the default prototype for *Actor* becomes male.
  *   **The Reform Logic:** The practice assumes that by removing the Markedness (making the term neutral), you disrupt the Default.
  *   **Confidence:** **Medium-High (75%).** Cognitive linguistics supports the link between morphological markedness and cognitive defaulting, but it is difficult to prove causality. Does *Chairman* make us think of men, or do we think of men in chairs so we say *Chairman*? The guides assume the former.

  ### 4. Hofstadter's "Translation Test" and Its Presuppositions
  You noted that people use Hofstadter's move (swap "man" for "black" or "white" to test for absurdity) to decide these cases.

  **What this test presupposes:**
  1.  **Intuition as Evidence:** It presupposes that a speaker's immediate feeling of "ridiculousness" is a reliable indicator of linguistic bias.
  2.  **Status Quo Bias:** This is the fatal flaw. The test confuses **Unfamiliarity** with **Absurdity**. *Spokesperson* sounded ridiculous in 1970; it does not now. The test is conservative; it protects established norms by labeling deviations as "absurd."
  3.  **Equivalence of Markers:** It presupposes that "Man" functions exactly like "White" or "Black" (as a specific modifier). This is linguistically contentious. "Man" has a dual function (specific male + generic human). "White" does not have a generic human function. The test fails because the analogy is imperfect.

  *   **Confidence:** **High (90%).** Relying on the "sounds ridiculous" test is philosophically weak because it treats entrenched bias as neutral baseline. It is a heuristic, not a proof.

  ### 5. Consistency with "Communication Matters"
  You asked if this is consistent with guides insisting that "what matters is what a term communicates."

  **Inconsistency:**
  If "communication" means **Propositional Content** (truth conditions), the reform is unnecessary. *Chairman* refers to the chair regardless of gender.
  If "communication" means **Pragmatic/Social Signaling**, the reform is necessary. The term signals who belongs in the role.

  **The Reconstruction:**
  To make the guides consistent, you must reconstruct their definition of "communication." They are not operating on a Gricean model (literal meaning); they are operating on a **Social Pragmatic** model.
  *   **Strict Need:** The guides *must* claim that language communicates social values (inclusion/exclusion) in addition to factual reference.
  *   **Underdetermination:** The guides often waffle here. They claim to care about "clarity" (factual) but act to improve "equity" (social). This is where the theory is muddled. They want the moral force of equity with the linguistic authority of clarity.

  *   **Confidence:** **High (85%).** This is the central tension in applied philosophy of language. You cannot justify the *manhole* $\to$ *utility hole* change on truth-conditional grounds. It is purely expressive/social.

  ### Summary of Reconstruction

  | Claim | Confidence | Status |
  | :--- | :--- | :--- |
  | **Transparency is the key differentiator** (why *human* stays, *manhole* goes). | **High (90%)** | **Strict Need.** Without this, the theory is falsified by the data. |
  | **Markedness is independent of Content.** | **High (85%)** | **Strict Need.** Explains why neutral terms with male morphology are targeted. |
  | **Markedness drives Default.** | **Medium (70%)** | **Sits Well.** Plausible cognitive mechanism, but hard to prove causality. |
  | **Hofstadter's Test is reliable.** | **High (90%)** | **False.** It measures entrenchment, not logic. Relying on it is a category error. |
  | **Reform is consistent with "Communication = Truth".** | **High (90%)** | **False.** It requires redefining communication to include social signaling. |

  **Final Advice:**
  Your hunch about **Markedness** is the strongest philosophical lever here. Focus your argument there. The style guides presuppose that **structural asymmetry in language constitutes a speech act of exclusion**, even when no specific person is being referred to (e.g., *manpower*). This allows them to bypass the "Content" objection (it doesn't mean male) and the "Default" objection (I don't picture a man) by arguing that the *structure itself* is the harm.

  However, you must call out the **Transparency** exception. If they cannot explain why *human* is safe without admitting that *speaker perception* trumps *etymological fact*, they undermine their own claim that language shapes thought (if thought doesn't parse *human* as *man*, why does it parse *chairman* as *male*?). The theory relies on the instability of speaker intuition.
