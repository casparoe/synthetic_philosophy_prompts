      *   *Let's go with the User's Hypothesis (Different Questions)* as the primary diagnosis, but refine it. The swamping problem is a valid argument against *instrumental* value of knowledge *locally*. Reliabilists retreat to *global* instrumental value. Virtue theorists retreat to *local* final value (achievement). They aren't disagreeing; they are answering different questions. The stalemate is because they pretend they are answering the same question.

