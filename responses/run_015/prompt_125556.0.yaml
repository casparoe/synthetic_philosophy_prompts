      *   *Okay, let's pivot.* I think the most honest philosophical diagnosis is that the **Local/Global distinction is correct, but the "Local" value is an illusion generated by conflating value with normative status.** However, since I need to pick from the user's list or defend their hypothesis: I will defend the **Two Different Questions** diagnosis, but argue that the "Local" question is actually a question about *normative appropriateness* or *credit*, not *value* in the swamping sense.
