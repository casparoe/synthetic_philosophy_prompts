answer: |-
  You are hitting on exactly the right tension in the text. Bernoulli's 1738 paper (*Specimen Theoriae Novae de Mensura Sortis*) is often taught as the birth of expected utility theory, but students frequently get tripped up by whether he is making a normative claim (how people *should* calculate) or a descriptive one (how people *actually* feel).

  Here is the breakdown of the logical move he is making, the status of the logarithmic function, and the hidden assumption you spotted.

  ### 1. Is it a Mathematical Fix or a Psychological Claim?
  It is **a psychological claim that necessitates a mathematical fix.**

  Bernoulli is not merely saying, "People are risk-averse, so they discount the price." If that were all he meant, it would just be a behavioral observation with no formal resolution to the paradox. The paradox exists because the *math* says the value is infinite. To resolve it, Bernoulli has to change the math.

  His logical move is to argue that the variable inside the expectation operator is wrong.
  *   **Classical Expectation:** $E = \sum [p \times \text{Money}]$
  *   **Bernoulli's Expectation:** $E = \sum [p \times \text{Utility of Money}]$

  He is arguing that "rationality" does not mean maximizing expected monetary return. Instead, rationality means maximizing expected *moral fortune* (his term for utility). So, yes, he is literally saying we must recalculate the expectation using utility values. The "20 ducats" quote is his empirical anchor: whatever mathematical function we choose for utility, it must yield a finite number that aligns with what a "fairly reasonable man" would actually pay (around 20 ducats), not infinity.

  ### 2. Is the Logarithmic Utility in Bernoulli's Text?
  **Yes, it is.** This is a common point of confusion because Gabriel Cramer (a mathematician corresponding with Bernoulli) is often mentioned in the footnotes.

  Cramer did propose a solution to the paradox in a letter to Bernoulli in 1728. Cramer suggested two possibilities:
  1.  Utility has a hard cap (money stops mattering after a certain point).
  2.  Utility grows according to the square root of wealth ($\sqrt{w}$).

  However, in the 1738 paper, Bernoulli rejects Cramer's specific functions and proposes the **logarithmic function** ($\ln(w)$) as his own contribution. He argues that utility is proportional to the logarithm of wealth.

  He arrives at this by arguing that the "significance" of a gain is inversely proportional to the amount of wealth one already possesses. In modern calculus terms, he is saying marginal utility is proportional to $1/w$. If you integrate $1/w$, you get $\ln(w)$. So, the log function is definitely in the 1738 text, and it is Bernoulli's specific innovation, not a later addition by von Neumann or Morgenstern.

  ### 3. The Hidden Assumption About Concavity
  You have identified the exact philosophical weak point in his argument. **Bernoulli assumes concavity (diminishing marginal utility) without rigorous defense.**

  He defends it with the "pauper vs. rich man" intuition you quoted. He thinks it is self-evident that an extra ducat matters less to a rich man than a pauper. From this intuition, he infers that the utility function *must* be concave (curving downward).

  Here is why this is a hidden assumption:
  *   **It is not logically necessary:** There is no logical contradiction in a world where the second thousand ducats matters *more* to you than the first (convex utility). For example, if you need exactly \$2,000 to buy a life-saving machine and you have \$1,000, the second \$1,000 has higher marginal utility than the first.
  *   **It is not proven:** Bernoulli treats diminishing marginal utility as a law of human nature, similar to a law of physics. He doesn't derive it from more basic axioms of rationality (which wouldn't happen until the 20th century with Savage and Anscombe/Aumann).

  By assuming concavity, he guarantees that the utility of the massive payouts in the tail of the St. Petersburg distribution grows slowly enough that the probability of them occurring shrinks faster than the utility grows.
  *   **Money:** Payout grows as $2^n$. Probability shrinks as $1/2^n$. The product is constant ($1$). Summing constants infinitely gives Infinity.
  *   **Log Utility:** Utility grows as $\ln(2^n) = n \cdot \ln(2)$. Probability shrinks as $1/2^n$. The product is roughly $n/2^n$. Summing this converges to a finite number.

  ### Summary of the Logical Move
  Bernoulli is doing three things simultaneously in that passage:

  1.  **Redefining Value:** He separates "price" (market value) from "utility" (subjective value).
  2.  **Operationalizing Risk Aversion:** He translates the psychological feeling of "caution" into a mathematical property (concavity of the utility function).
  3.  **Convergence:** He uses the logarithmic function specifically because it is the simplest mathematical function that turns the divergent series of the St. Petersburg game into a convergent one.

  So, to answer your core question: He is making a psychological claim about how humans value wealth, but he treats it as a mathematical fix to the expectation formula. The "hidden assumption" is that human psychology *must* follow a concave curve (specifically logarithmic), which he supports with intuition rather than proof. He is essentially inventing the concept of a utility function to save the theory of expectation from collapsing under the weight of the paradox.
