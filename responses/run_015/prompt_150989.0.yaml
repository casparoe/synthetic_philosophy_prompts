      *   *Key Insight:* The tension is between *Gradualism* (Dimmer) and *Non-Aggregability* (Threshold-like behavior). You can have one or the other easily. Having both requires a complex value function that looks suspiciously like a threshold.

  8.  **Refining the "Fatal" Defeater:**

      *   The real fatal flaw is the *definition of the scalar*. If Moral Status = $S$, and Moral Weight = $f(S)$, Priya argues $f(S)$ must be monotonic and aggregable for $S$ to be a "quantity." If $f(S)$ has a discontinuity (non-aggregability below fold), then $S$ isn't doing the work; the function $f$ is hiding a threshold.
