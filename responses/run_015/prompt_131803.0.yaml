answer: |-
  Below is a specification of desiderata for an adequate theory of reparations for historical injustice. Given your background in population ecology, I have framed these requirements to emphasize systemic persistence, legacy effects, and the distinction between discrete events and continuous structural distortion.

  Each desideratum includes the **Requirement**, the **Motivating Consideration**, and a classification of **Status** (Non-Negotiable vs. Theoretical Preference). Following the list, I examine the joint satisfiability of these constraints (the Trilemma) and score standard theoretical contenders.

  ---

  ### Desiderata for an Adequate Theory of Historical Reparations

  #### 1. The Dual-Track Distinction (Corrective vs. Structural)
  *   **Requirement:** The theory must distinguish between (A) *Direct Corrective Obligations* (arising from specific, identifiable violations of rights against specific agents or lineal descendants) and (B) *Structural-Repair Obligations* (arising from persistent institutional distortions that disadvantage present communities regardless of specific lineal continuity).
  *   **Motivating Consideration:** These cannot be collapsed. If collapsed into a single lineal model, the Non-Identity Problem (see #3) dissolves the obligation over time. If collapsed into a purely structural model, the specific moral gravity of the original violation is lost to general distributive justice. An adequate theory must explain why a descendant might have a claim under Track B even if Track A has expired or is metaphysically blocked.
  *   **Status:** **Non-Negotiable.** Without this distinction, the theory either collapses into standard tort law (which fails for historical scales) or general egalitarianism (which fails to capture the specific wrong of *injustice*).

  #### 2. Explicit Temporal Attenuation Functions
  *   **Requirement:** The theory must specify the functional form of moral obligation over time. It must explicitly state whether obligations undergo: (a) *Linear Decay* (weakening per generation), (b) *Threshold Extinction* (valid until a specific temporal cutoff), or (c) *Non-Decreasing Structural Compounding* (where the obligation grows or persists as long as the structural advantage/disadvantage persists).
  *   **Motivating Consideration:** Intuition yields contradictory verdicts in multi-generational cases. A theory that relies on vague "fading" cannot explain why slavery in the US generates claims today while feudal dues in Europe do not. An ecological analogy suggests "legacy effects": some disturbances decay quickly (linear), while others alter the carrying capacity of the environment permanently (structural compounding). The theory must map the moral obligation to the persistence of the *effect*, not just the *act*.
  *   **Status:** **Non-Negotiable.** A theory without a specified attenuation function is operationally useless for policy and logically vulnerable to *sorites* paradoxes.

  #### 3. Consistency with the Non-Identity Problem (NIP)
  *   **Requirement:** The theory must explain how present persons can hold claims for past harms without presupposing that they would have existed had the harm not occurred. It must avoid the "no harm done" conclusion (i.e., that because the injustice was a necessary condition for the claimant's existence, they were not harmed).
  *   **Motivating Consideration:** Standard counterfactual accounts of harm fail here. If the theory cannot bypass the NIP, all lineal claims for historical injustice (slavery, colonization) are metaphysically void. The theory must shift the locus of harm from "existence vs. non-existence" to "quality of life relative to a baseline" or locate the harm in the *group* continuity rather than the individual conception event.
  *   **Status:** **Non-Negotiable.** Any theory that fails this is logically incoherent regarding procreation and historical causality.

  #### 4. Defensible Counterfactual Baselines
  *   **Requirement:** The theory must provide a method for selecting the comparison baseline (the "but-for" world) that does not require impossible historical reconstruction. It should utilize "Normal Functioning" or "Reasonable Expectation" baselines rather than specific trajectory modeling.
  *   **Motivating Consideration:** Calculating lost wealth over centuries requires knowing the exact economic trajectory of the victimized group absent the injustice, which is epistemically inaccessible. Requiring this makes reparations impossible. An adequate theory must measure loss against a standard of *undisturbed development* or *parity with comparable non-victimized groups*, rather than a specific counterfactual history.
  *   **Status:** **Non-Negotiable** for feasibility. (The specific choice of baseline—e.g., parity vs. restoration—is a Theoretical Preference).

  #### 5. Compatibility with Liberal Constraints on Collective Punishment
  *   **Requirement:** The theory must not assign liability to present individuals solely based on ancestral identity. Liability must be grounded in *unjust enrichment*, *citizenship*, or *participation in ongoing structures*, rather than bloodline guilt.
  *   **Motivating Consideration:** Liberal individualism forbids punishing persons for acts they did not commit. If reparations are framed as collective punishment of a demographic (e.g., "all white people"), the theory violates fundamental liberal norms and becomes politically unsustainable. The burden must be tied to the *receipt of structural advantage* or the *maintenance of the unjust institution*.
  *   **Status:** **Theoretical Preference** (specific to Liberal theories). A communitarian or nationalist theory might reject this, but for a theory operating within modern liberal democracies, this is effectively non-negotiable for implementation.

  #### 6. Inclusion of Ecological and Interspecies Harms
  *   **Requirement:** The theory must explicitly categorize ecological degradation (resource extraction, ecosystem collapse) either as a direct harm to the human communities dependent on them (anthropocentric) or as a distinct category of reparative justice owed to the land/species (ecocentric).
  *   **Motivating Consideration:** Historical injustice often involves the destruction of the *means of subsistence* (hunting grounds, water systems), not just transfer of title. If the theory treats land merely as property, it misses the ecological dimension of the harm. If it treats it as a separate conservation issue, it divorces the ecological damage from the historical injustice that caused it.
  *   **Status:** **Theoretical Preference** (depending on the scope of justice), but **Non-Negotiable** for completeness regarding indigenous and colonial cases.

  ---

  ### Analysis of Joint Satisfiability: The Trilemma

  You asked specifically whether a subset of these desiderata generates a trilemma. There is indeed a severe tension between **Temporal Attenuation (2)**, **Non-Identity Resolution (3)**, and **Liberal Constraints (5)** when attempting to fulfill **Structural Repair (1)**.

  **The Trilemma:**
  1.  **Strict Temporal Attenuation:** If moral obligations decay linearly or hit a threshold extinction over generations, the direct link to the original wrong weakens significantly for present claimants.
  2.  **NIP Resolution Severing Lineal Claims:** To solve the Non-Identity Problem, many theories sever the strict lineal "harm to specific individual" claim and move to "harm to group status" or "current disadvantage."
  3.  **Liberal Anti-Punishment:** Present individuals cannot be held liable for ancestral acts they did not choose.

  **The Conflict:**
  If you accept (1) and (2), the *backward-looking* justification for reparations dissolves. The original victims are dead, the specific lineal harm is metaphysically murky (NIP), and the obligation has attenuated.
  If you then try to fund *Structural Repair* based on (3), you cannot charge present individuals for *past* acts (Liberal Constraint).
  **Result:** To fund structural repair, you must tax present beneficiaries. But if the backward-looking claim has attenuated or been severed by NIP, taxing present beneficiaries looks like **collective punishment** (violating 5) or merely **forward-looking redistribution** (violating the definition of *reparations* in 1).

  **Resolution Strategy:**
  An adequate theory must break the link between *liability* and *ancestral guilt*. It must argue that the obligation is not to *pay for the past* but to *divest from the present unjust structure*. The "debt" is not a legacy of the ancestor's sin, but a legacy of the *unjustly held asset*.
  *   *Attenuation* applies to the *punitive* element (guilt).
  *   *Non-Attenuation* applies to the *unjust enrichment* element (assets/advantage).
  *   *NIP* is bypassed by focusing on the *current distribution* of those assets, not the historical act of acquisition.

  If a theory cannot make this distinction, it is jointly unsatisfiable.

  ---

  ### Scoring Standard Contenders

  Here is how the three dominant frameworks fare against the six desiderata.

  | Desideratum | Pure Corrective Justice (Tort Model) | Structural Injustice (Forward-Looking) | Hybrid Institutional Repair |
  | :--- | :--- | :--- | :--- |
  | **1. Dual-Track** | **Fail.** Collapses all claims into lineal corrective justice. | **Pass.** Focuses entirely on structural track. | **Pass.** Explicitly distinguishes tracks. |
  | **2. Attenuation** | **Fail.** Assumes obligations persist indefinitely or ignores time. | **Pass.** Treats obligation as persistent while structure exists. | **Pass.** Allows decay for direct claims, persistence for structural. |
  | **3. Non-Identity** | **Fail.** Vulnerable to NIP; cannot explain harm to existing descendants. | **Pass.** Ignores NIP by focusing on present disadvantage. | **Pass.** Uses NIP to shift lineal claims to structural claims. |
  | **4. Baseline** | **Fail.** Requires impossible counterfactual history ("but-for" wealth). | **Pass.** Uses current parity or normal functioning as baseline. | **Pass.** Uses hybrid baselines (restoration where possible, parity where not). |
  | **5. Liberal Constraints** | **Fail.** Often implies collective liability of descendants. | **Pass.** Liability tied to citizenship/benefit, not blood. | **Pass.** Ties liability to unjust enrichment, not guilt. |
  | **6. Ecology** | **Fail.** Treats land as property; misses systemic ecological harm. | **Pass.** Can incorporate ecological systems as structural elements. | **Pass.** Can categorize ecological harm as structural distortion. |

  **Evaluation:**
  *   **Pure Corrective Justice:** Fails the specification. It is logically vulnerable to the Non-Identity Problem and epistemically vulnerable on Counterfactual Baselines. It cannot handle multi-generational cases without violating Liberal Constraints.
  *   **Structural Injustice:** Scores highest on feasibility and consistency but risks losing the specific moral force of *reparation* (rectifying a specific wrong) versus *reform* (fixing a broken system). It sometimes glosses over the NIP rather than solving it.
  *   **Hybrid Institutional Repair:** The strongest contender. It preserves the moral gravity of the historical wrong (Corrective) while acknowledging the metaphysical and temporal limits (Structural). However, it bears the heaviest burden of proof to resolve the Trilemma regarding who pays and why.

  ### Final Specification Note
  For a theory to be adequate, it must explicitly reject the "inheritance of guilt" model. It must adopt a **"inheritance of unjust asset"** model. This satisfies the Liberal Constraint (5) and the Temporal Attenuation (2) by arguing that while *guilt* attenuates to zero immediately, *unjustly held structural advantage* does not attenuate until divestment occurs. This resolves the Trilemma by shifting the locus of obligation from the *actor* to the *holding*.
