answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being the one who gets to talk about my dad while he sits there, quietly hoping I don't mention the incident with the 1998 holiday catalog.

  Looking around this room, I realize I have a tricky balancing act to pull off. On one side, I have my family, who know that for thirty-two years, this shop was simply the place Dad went so we could have food on the table and shoes that fit. To you, work is a transaction: time and effort exchanged for security. And on the other side, I see the labor historians and the philosophy folks. I know you. If I start talking about the "sanctity of craft" or how he "found his soul in the ink," you're going to roll your eyes so hard you'll see your own spines. You know that romanticizing labor is often just a way to justify low wages and bad backs.

  And Dad? Dad would laugh at the soul stuff. He'd wince at the idea that machines are the enemy. He's too practical for either of those stories.

  So, I want to talk about something simpler. I want to talk about the mark.

  For three decades, my father worked with letterpress. For the uninitiated, that means metal type, heavy ink, and a machine that slams paper against lead with enough force to leave a bruise on the page. It's physical. If the pressure was off, the ink was pale. If the pressure was too high, the paper bit too deep. You couldn't just hit "undo." You had to adjust the screw. You had to lean in. You had to push.

  There is a specific feeling you get when you hold a letterpress print. You can run your thumb over the back of the paper and feel the indentation. You know, viscerally, that the letters are there because someone applied pressure. That shape exists on that page because a human being pushed.

  Now, Dad didn't stay in the past. We all know the industry changed. The presses went quiet; the screens lit up. And here is the irony that I think only he fully understands: Dad didn't just watch the digital transition happen; he helped build it. He trained the software that eventually replaced his crew. He taught the machine how to think like a printer.

  He doesn't resent that software. It's faster. It's cleaner. It's efficient. But there is something about it that feels like a disappearance.

  When you design a template on a screen, the work is frictionless. You move a pixel, and it moves. There is no resistance. There is no moment where the material says "no," and no moment where you have to force it to say "yes." When the job is done, there is no evidence of the struggle. There is no bruise on the paper. The labor vanishes into the perfection of the output.

  This is why, in his office, Dad has a cabinet full of misprints.

  To the outsider, these are failures. Wasted paper. Bad runs. But I've watched him look at them. He doesn't look at them with shame. He looks at them with recognition. On a salvaged misprint, you can see where the ink dragged. You can see where he adjusted the feed. You can see the exact moment he intervened to stop a job from going wrong.

  In a digital file, a correction is invisible. In the letterpress shop, a correction is a scar. And Dad kept those scars because they were the only proof that he was actually there.

  I think that's what work meant to him. It wasn't just the paycheck, though that mattered. It wasn't "self-expression," though he had plenty of it. It was the ability to point at something in the physical world—a box, a card, a poster—and say, "That is straight because I made it straight. That exists in that shape because I pushed against the world, and the world yielded."

  That is a heavy thing to lose. When you retire, you don't just lose the routine. You lose the ability to leave that specific kind of mark. You lose the daily evidence that your effort changed the shape of something.

  So, Dad, as you step into this next chapter, I know the shop is quiet now. I know the software is running without you. But I want you to know that we see the marks you left. We see them in the business that survived, in the family you raised, and in the standards you held when no one was watching. You pushed against the world for thirty-two years, and the world is different because you did.

  Please raise your glasses.

  To the visible trace. To the scars that prove we were there. And to my father, who taught us that efficiency is good, but evidence is better.

  To Dad.
