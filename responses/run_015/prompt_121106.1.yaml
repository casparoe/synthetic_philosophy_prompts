          *   Family: Pragmatic ("work pays bills").
          *   Labor Historians/Philosophy Grads: Skeptical of romanticizing craft labor (will eye-roll at "passion" or "fulfillment" narratives).
      *   **Core Theme:** Work isn't just income or self-expression. It's about physical effort leaving a visible trace ("that shape exists because I pushed").
      *   **Specific Details to Include:** Why he kept misprinted runs he salvaged; why the new system feels like a "disappearance" despite efficiency.
      *   **Tone:** Warm, not a lecture. No academic quotes (Marx, etc.).
      *   **Length:** About 5 minutes (roughly 600-800 words spoken at a moderate pace).
      *   **Constraint:** Avoid clichés about "loving the job" or "technology is bad."

  2.  **Deconstruct the Core Theme:**
      *   *The "Trace":* The physical imprint. Ink on paper. The indentation.
      *   *The "Push":* The effort, the adjustment, the muscle memory.
      *   *The "Disappearance":* Digital work leaves no physical scar. It's clean, efficient, but ghostly.
      *   *The "Misprints":* These aren't failures; they are evidence of the struggle. They prove the human was there.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the crowd. Set the scene. Keep it light.
          *   *Idea:* Welcome everyone. Acknowledge the split in the room (family vs. academics).
          *   *Tone Check:* Don't alienate the family with jargon, don't bore the academics with sentimentality.

      *   **The Nature of His Work (Letterpress):**
          *   *Focus:* Physicality. Ink, lead, pressure.
          *   *Key Concept:* The "bite" of the type.
          *   *Avoid:* "He loved every minute." Instead: "He showed up."

      *   **The Transition (Digital/Automation):**
          *   *Fact:* He trained the software that replaced the crew.
          *   *Nuance:* It's not "technology bad." It's "technology different." It's efficient but removes the *trace*.
          *   *Metaphor:* Ghosts vs. Footprints.

      *   **The Core Argument (The Trace):**
          *   *Concept:* Work = leaving a mark.
          *   *Phrase:* "That shape exists because I pushed."
          *   *Application:* Why he kept the misprints. They show the correction, the hand of the printer.

      *   **Closing:**
          *   *Look forward:* Retirement.
          *   *Final Toast:* To the marks he left.
          *   *Tone:* Warm, celebratory, grounded.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Dad worked hard. 32 years. Some of you think work is just money. Some of you think it's about capitalism. Dad just thought it was about making things. He used to print with metal type. Now it's computers. He even taught the computer how to do it. But computers don't leave marks. Paper doesn't dent anymore. Dad kept bad prints because they show he fixed them. That's what work is. Making a dent. So let's drink to the dents.

      *Critique 1:* Too blunt. Needs more warmth and flow. Needs to hit the specific "trace" requirement harder without sounding philosophical.

  5.  **Drafting - Iteration 2 (Fleshing out the "Trace"):**
      Start with the ink. It smells. It gets under fingernails. That's the trace.
      Address the room: Family knows he came home tired. Historians know the shift from craft to digital.
