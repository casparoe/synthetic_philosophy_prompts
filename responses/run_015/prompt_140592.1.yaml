answer: |-
  Your frame is solid, particularly the "proximity reversal." In philosophy of action and behavioral economics, this maps onto the "hot/cold empathy gap" or situational strength: we underestimate how much perceptual presence alters valuation. You are right to worry about Gollum, though. If Sméagol and Gollum are distinct agents, you have inter-personal conflict, not intra-personal weakness. Tolkien uses the two voices dramatically, but philosophically, Gollum represents a soul already partitioned by addiction. He is not a case of akrasia; he is a case of dissociation.

  For your session, Frodo is indeed the stronger philosophical subject. He remains a unified agent until the very end. He maintains better judgment ("I must destroy this") while acting increasingly contrary to it (keeping it, wearing it, claiming it). However, the Mount Doom moment complicates your model. If the Ring's power at the Cracks of Doom is absolute coercion, Frodo's failure is not weakness of will; it is physical necessity. Socrates would argue no one does evil willingly; if the Ring removes the ability to choose otherwise, Frodo is pushed, not falling.

  Here is the tension you need to put on the table: Tolkien's theology requires Frodo to fail (so grace can intervene), but his ethics require Frodo to be responsible (so the failure matters). The story complicates the standard akrasia model by introducing an external agent that actively modifies the will. Standard akrasia assumes the temptation is static and the will fluctuates. The Ring assumes the temptation is dynamic and attacks the will. This means Frodo's failure isn't just a discounting error; it's an ontological overload. He isn't just valuing the present too highly; his capacity to value anything else is being erased.

  This leads directly to your precommitment point. Gandalf, Galadriel, and Faramir refuse the Ring based on self-knowledge. They recognize they cannot trust their future selves in the presence of the object. This is textbook self-binding (Ulysses contracts). Frodo's failure to establish a self-binding mechanism—asking Sam to throw it in if he hesitates, for example—looks like a second-order failure. Calling it "prospective akrasia" is pedagogically useful, though standard literature might call it a "failure of self-binding" or "planning fallacy regarding willpower." The distinction is worth teaching because it shifts the blame from the moment of action to the moment of planning. Frodo judges correctly months in advance but fails to bind his future self against the proximity effect you identified.

  So, what is the payoff beyond "present bias"? The Boromir/Faramir contrast. Both are sons of Denethor, both face the same temptation, both understand the risk. Boromir snaps; Faramir does not. The text suggests this isn't about the strength of their wills, but the orientation of their loves. Faramir says he would not pick up such a thing even if it lay by the highway. This moves the discussion from *continence* (struggling against desire) to *virtue* (not having the desire). Tolkien complicates the economic model by suggesting that willpower is not a muscle to be strengthened but a byproduct of what you already love. If you love power, the Ring amplifies you. If you love wisdom or stewardship, the Ring offers nothing you want. This challenges the undergrads to consider whether akrasia is a failure of calculation or a failure of character formation.

  Furthermore, Bilbo's voluntary surrender shows that even successful resistance leaves a scar. He gives it up, but feels "thin, sort of stretched." This adds a dimension of habituation and withdrawal that pure rational choice models ignore. The will is embodied and historical, not just a momentary calculator.

  **Scenes to Use:**

  1.  **The Council of Elrond (Book):** Use this for precommitment. Highlight Gandalf and Galadriel's refusals. Contrast this with Frodo's simple "I will take it," which lacks conditions or safeguards. Ask the group: Was Frodo arrogant here, or was precommitment impossible for the task?
  2.  **The Breaking of the Fellowship (Film or Book):** Boromir's attempt to take the Ring from Frodo. This is your cleanest example of proximity reversal. Boromir is rational in Rivendell; he is rational in Lothlórien. He flips only when alone with Frodo and the Ring is physically visible. Use this to illustrate your "proximity" thesis.
  3.  **Mount Doom (Book):** Frodo's final claim: "I do not choose now to do what I came to do." This is the limit case. Ask the students: At this exact second, could he have done otherwise? If no, is it moral failure? If yes, why did he fail now and not earlier?

  **Where Philosophy and Story Diverge:**

  Be straight with them about the magic. In standard philosophy, temptation is internal (passion vs. reason). In Tolkien, temptation is externalized (the Ring). This lets Tolkien dramatize the struggle, but it cheats the metaphysics. We don't face objects that actively rewrite our utility functions. However, this exaggeration reveals something true about addiction: the object *does* feel like an external agent hijacking the will.

  Also, acknowledge the theological cheat. Frodo fails, but the quest succeeds because Gollum intervenes. This is *eucatastrophe*, not moral philosophy. It saves the world, but it muddies the lesson on will. If Frodo had succeeded, it would be a story of virtue. Because he fails, it is a story of grace. You cannot fully reconcile akrasia with grace without stepping out of philosophy and into theology.

  Your session works best if you use the text to break the models, not just illustrate them. Use Frodo to show where the "discounting" model fails (because the value of the Ring changes, not just the time horizon). Use Faramir to show where the "willpower" model fails (because character orientation matters more than resistance). And use Gollum to show where the "unified agent" model fails (because addiction partitions the self).

  Don't worry that Gollum dodges the philosophy; use him to show the extreme end of the spectrum where akrasia becomes pathology. But keep Frodo at the center. His failure is the only one that remains truly human, unshielded by madness or absolute coercion, until the very last moment. That is where your students will find the friction they need to think.
