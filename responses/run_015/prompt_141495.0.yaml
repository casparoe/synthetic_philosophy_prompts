answer: |-
  This is not only a "thing with a name," it is one of the most well-documented problems in behavioral economics, moral philosophy, and psychology. You are not broken; you are experiencing a standard architectural conflict in human decision-making.

  Since you prefer changelogs to books, I will skip the fluff and give you the spec sheet on what is happening to you, who "you" are, and how to patch the system.

  ### 1. The Bug Report: Time Inconsistency
  The phenomenon you are describing is called **Hyperbolic Discounting** or **Time Inconsistency**.

  *   **Sunday Night You:** Values the future reward (5k finish line, health) highly. The cost (waking up early) is abstract and distant. The utility function favors "Run."
  *   **Tuesday 5:50 AM You:** Values the immediate reward (warmth, sleep) disproportionately. The cost (loss of comfort) is concrete and immediate. The utility function favors "Skip."

  In economics, this is a **Principal-Agent Problem**. Sunday You is the Principal (setting the goals). Tuesday You is the Agent (executing the tasks). The Agent has different incentives than the Principal and possesses private information (how warm the bed is) that the Principal didn't fully account for.

  Your brother is wrong. "If you actually wanted it you'd just do it" assumes a linear discount rate (that you value future rewards consistently over time). Humans do not have linear discount rates. We have hyperbolic ones. We value *now* exponentially more than *later*.

  ### 2. The Identity Question: "Which One is Me?"
  You asked: *Is there a fact of the matter about which one is the real me?*

  The philosopher you want to read is **Derek Parfit**, specifically his work *Reasons and Persons*. Parfit argues for a **Reductionist View of Personal Identity**.

  He suggests that "you" are not a single, unchanging soul. You are a series of psychological stages connected by memory and intention. Sunday You and Tuesday You are psychologically discontinuous enough that they function as different agents. Sunday You makes a promise; Tuesday You inherits the consequences but not the immediate feeling of the commitment.

  So, your roommate is closer to the truth than your brother. There is no "Real You." There is **Current You** and **Future You**. They are distinct entities with a shared database (memory) but different execution environments (physiological state, time of day).

  When you ask, "Am I allowed to bind Future Me?" the philosophical consensus is: **Yes.** In fact, it is the only rational way to manage Time Inconsistency.

  ### 3. The Strategy: Ulysses Pact
  What you are proposing with the $200 contract is called a **Ulysses Pact** (or Precommitment Strategy).

  It comes from the myth of Odysseus (Ulysses). He wanted to hear the Sirens' song but knew he wouldn't be able to resist steering the ship toward them. He didn't rely on "willpower." He ordered his crew to tie him to the mast and plug their ears. He restricted Future Ulysses's options to ensure Present Ulysses's goals were met.

  **Is it valid?** Yes.
  **Is it ethical?** Yes, provided Future You doesn't face catastrophic ruin (e.g., don't bet your house).
  **Does the motivation matter?** No. You asked: *Is a run I did out of spite still my run?*
  Physiologically, yes. For the 5k, the database record of the run is the same regardless of the query that generated it. If you run to avoid your mom's email, the cardiovascular adaptation is identical to running for love of the sport. Do not waste CPU cycles on guilt about motivation. Output is what ships.

  ### 4. Code Review: The App
  Your current implementation has race conditions.
  *   **Bug 1:** You can lie to the script (skip logging).
  *   **Bug 2:** The decision point is too close to the execution time (5:50 AM).
  *   **Bug 3:** The penalty ($40) is currently treated as a warning, not a fatal error.

  You noted: *If at 6pm I decide "run at 6:20," I just do it.*
  This is the critical variable. At 6 PM, the "cost" of waking up is discounted. At 5:50 AM, the cost is full price.

  **Here is how I would refactor the app:**

  **A. Remove the 5:50 AM Decision**
  The system should not ask Tuesday You if he *wants* to run. The decision was made by Sunday You. Tuesday You is just the muscle.
  *   **Change:** The alarm shouldn't just ring; it should trigger the penalty countdown immediately. The only way to stop the countdown is to verify the run.
  *   **Verification:** Do not rely on manual logging. That trusts the Agent too much. Use an API integration (Strava, Garmin, Apple Health) that pulls data automatically. If no GPS track exists by 7:30 AM, the function executes.

  **B. Increase the Latency of the Loophole**
  You mentioned leaving the phone in the kitchen to avoid the app. This is you trying to crash the server to avoid the billing cycle.
  *   **Change:** The verification needs to be hardware-locked. If you use a smartwatch, the app checks the watch, not the phone. If you leave the watch in the kitchen, you can't tell time to know when to stop running.

  **C. The $200 Contract (The Hard Fork)**
  You asked if you should upgrade to the $200 contract.
  *   **Verdict:** Yes. $40 is a feature fee. $200 is a pain penalty.
  *   **Implementation:** Do not trust yourself to hold the credit card. Use a service like **stickK.com** or have your roommate hold a signed authorization form.
  *   **Crucial Detail:** The money must be *gone*. If you can negotiate it back on Wednesday, the system fails. It must be donated to an "anti-charity" (an organization you hate) or given to the roommate with no possibility of return. This increases the stakes for Tuesday You.

  ### 5. Summary of Operations
  1.  **Accept the Architecture:** You are not one person. You are a chain of daily selves. Sunday Self is the architect; Tuesday Self is the builder. Architect must lock the blueprint so Builder can't change it.
  2.  **Validate the Spite:** A run done to avoid a $200 fine counts 100% toward the 5k. Motivation is metadata; the run is the payload.
  3.  **Deploy the Ulysses Pact:** Sign the contract. Make the penalty painful and automatic. Remove the ability to manually log runs; require API verification.
  4.  **Shift the Decision:** Acknowledge that the decision *must* happen at 6 PM (or Sunday Night). 5:50 AM is not a decision time; it is an execution time. If the alarm goes off and you are thinking "Should I?", the system has already failed. The only option at 5:50 AM is "Shoes on."

  **Final Logic Check:**
  You are a backend developer. You know that you cannot trust user input. **You are the user.** Do not trust your own input at 5:50 AM. Validate against external APIs (Strava), enforce constraints (financial penalty), and handle exceptions (roommate oversight) before deployment.

  Ship the code. Run the 5k.
