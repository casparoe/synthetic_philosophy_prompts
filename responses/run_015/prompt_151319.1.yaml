answer: |-
  To evaluate which framework better explains persistent disagreement among trained experts regarding avant-garde art, we must first fairly characterize the mechanisms each theory proposes for aesthetic judgment.

  Hume's Standard of Taste posits that while beauty is not an intrinsic property of objects, there is a reliable standard found in the joint verdict of ideal critics. These critics possess strong sense, delicacy of imagination, freedom from prejudice, and most importantly, practice and comparison. For Hume, disagreement is primarily a symptom of imperfection. If two people disagree, it is usually because one lacks the necessary experience, is clouded by prejudice, or lacks the delicate sensitivity required to perceive the nuanced relations within the work. The telos of Hume's framework is convergence; given enough practice and proper conditions, true judges should eventually agree on the merit of a work.

  The Community Taste Calibration framework, by contrast, views aesthetic judgment as a social technology. Instead of discovering a hidden standard, individuals adjust their internal evaluative instruments to match a shared community baseline. Value is not found but negotiated. Disagreement here is not necessarily a failure of sensitivity or practice, but a sign of divergent calibration baselines. Different communities (or sub-communities) maintain different standards, and individuals align their judgments to fit their specific social or professional context.

  When applied to the specific phenomenon of trained experts disagreeing over avant-garde art, Hume's framework encounters significant friction. Avant-garde art is often designed to disrupt established norms and challenge historical precedents. In Hume's system, "practice" and "comparison" rely on a continuity of tradition to refine sentiment. However, avant-garde works frequently intentionally break the very traditions that create the "ideal critic." If two highly trained critics disagree on such a work, Hume is forced to argue that at least one of them is not actually an ideal critic—perhaps one is prejudiced or lacks true delicacy. This turns the explanation into a circular assessment of the critics' status rather than an explanation of the disagreement itself. It struggles to account for why disagreement persists indefinitely among people who clearly possess the requisite knowledge and experience.

  The Community Taste Calibration framework handles this phenomenon more naturally. Avant-garde art often creates splinter groups within the art world, establishing new sub-baselines for judgment. One expert may be calibrated to a formalist tradition, while another is calibrated to a conceptual or political framework. Both are "trained," but they are calibrated to different social and aesthetic consensus points. The disagreement is not a failure to find the truth of the object, but a reflection of competing social frameworks vying for dominance. Because avant-garde art often lacks a settled historical context, there is no single shared baseline to calibrate to yet. The disagreement is therefore expected and structural, rather than accidental and resolvable.

  While Hume provides a robust explanation for why laypeople might disagree with experts (lack of practice), he predicts that experts should converge. The reality of the art world is that experts often form opposing camps that do not resolve over time. The calibration model accepts that "expertise" simply means being highly attuned to a specific community baseline, and when multiple valid baselines exist, persistent disagreement is the natural outcome.

  \answer{calibration}
  Summary: The calibration framework better explains expert disagreement on avant-garde art because it treats divergent judgments as the result of competing social frameworks rather than a failure of individual sensitivity.
