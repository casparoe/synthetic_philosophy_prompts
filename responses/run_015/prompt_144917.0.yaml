          1.  Physicalist + Phenomenal Concept Strategy (epistemic gap, not ontological).
          2.  Color Phi: Orwellian (retroactive revision of report, no intermediate experience).
          3.  Motion Phi: Stalinesque (pre-conscious construction of false motion, genuine experience of non-existent movement).
          4.  Temporal Granularity: Consciousness is discrete (frames ~50ms), not continuous.
          5.  Timing of Experience: The "problem" is pseudo because there's no single present moment to align with physics (due to granularity).
