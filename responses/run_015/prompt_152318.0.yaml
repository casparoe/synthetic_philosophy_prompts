  7.  **Final Polish:** Check against the "epistemic side" constraint. Mark confidence. Ensure the distinction between the user's claims and my interpretation is clear. (Self-correction: Make sure to explicitly state if "orphaned valence" is incoherent within the story's logic).

      *   *Critical realization:* The user's Claim 2 says "What has to be preserved is not the horrible phenomenology but the job... Call that the signal." Le Guin's story posits that the *phenomenology* is the price. The user's variant (i) tries to hack the story's metaphysics. I need to point out that this hack reveals the divergence between Functionalism (Abolitionist) and Phenomenological/Humanist ethics (Le Guin).

  8.  **Final Structure:**
