answer: |-
  You have diagnosed the argument correctly: your friend's "Flatness Result" is a general solvent for moral residue, not a specific solution to dilemmas. It proves too much because it eliminates agent-regret in cases where there is no conflict of obligations at all (like the lorry driver), which suggests the error lies in the metaphysics of reasons, not the phenomenology of dilemmas.

  Here is the diagnosis you asked for.

  ### The Step to Reject: Premise (1)

  **"All-things-considered verdicts are exhaustive: when the balance of reasons settles that you ought to do A, every consideration that told against A has been fully spent..."**

  This is the load-bearing wall. If you knock this out, the argument collapses, but the structure of rationality remains standing.

  **Why it looked innocent:**
  Premise (1) appeals to a "settled account" metaphor that is deeply intuitive for anyone with a rationalist or economic bent. It treats normative reasons like currency in a ledger: if you pay a debt, the money is gone; if you outweigh a reason, the reason is "spent." It promises a clean ontology where the "ought" is a singular, stable object that leaves no debris behind. It looks like a virtue of efficiency: why carry around normative weight for reasons you were justified in ignoring? It conflates *justification* (you did the right thing) with *cancellation* (the opposing claim ceased to exist).

  **The Cost of Rejecting (1):**
  If you reject (1), you must accept that reasons can be **overridden without being erased**. You are committed to the existence of *normative remainders*.
  *   **Metaphysical Cost:** You lose the "Flatness." The moral landscape becomes topographical, with valleys and peaks that persist even after you've chosen the path. You have to explain how a reason can have force even when it doesn't determine action.
  *   **Rationalist Cash-Out:** To avoid "spooky normativity," you cash out these persisting reasons not as ghostly forces, but as **commitments to repair**. If the reason against killing the child persists even after the unavoidable accident, it manifests as a duty to compensate, to mourn, or to acknowledge the loss. It's not a ghost; it's a pending transaction. The "ought" of the verdict tells you what to *do*; the persistence of the overridden reason tells you what to *owe* afterwards.
  *   **Impact on Dilemmas:** This saves the lorry driver's agent-regret (the reason against killing persists, warranting remorse) and it opens the door to genuine dilemmas (if two reasons persist with equal, overwhelming force, the remainder is tragic rather than resolvable).

  ### Pricing the Alternatives

  You asked to price the other steps, including the ones I didn't pick. Here is the cost of the other exits from the argument.

  **1. Rejecting Premise (2): "Moral residue... is warranted only where some claim on you survived your action unexhausted."**
  *   **The Move:** You claim that residue can be fitting even if the reasons were fully spent.
  *   **The Cost:** This makes moral residue **non-cognitive** or **instrumental**.
      *   If the claims are exhausted (per Premise 1), but residue is still warranted, then residue is no longer a recognition of a normative fact. It becomes either a brute emotional fact (which risks irrationality) or a useful heuristic (e.g., "feel guilt so you don't do it again").
      *   **Why it's worse than rejecting (1):** For a rationalist group, this is the "spookiest" option. It severs the link between feeling and truth. It turns guilt into a useful fiction. Your friend would likely prefer this to rejecting (1), but it sacrifices the *fittingness* of the emotion. It makes the agent's remorse a kind of beneficial error. Rejecting (1) preserves the truth-apt nature of the emotion; rejecting (2) saves the ontology of reasons at the cost of the emotion's rationality.

  **2. Rejecting Premise (5): "Either the agent knows which action the balance of reasons favors, or she doesn't..."**
  *   **The Move:** You argue there is a third epistemic/normative state.
  *   **The Third Option:** The agent knows the ATC verdict (she knows she ought to do A), *and* she knows that doing A violates a binding claim that is not exhausted by the verdict.
  *   **The Machinery Required:** You need a **pluralistic deontology** (like W.D. Ross's *prima facie* duties) or a **values pluralism** (like Isaiah Berlin or Bernard Williams). You need a framework where "What ought I to do?" and "What claim am I violating?" are distinct questions.
  *   **The Cost:** This is actually the most expensive option if you keep (1) and (2). If reasons are "spent" (1) and residue requires "unexhausted claims" (2), then positing a third epistemic state is just gaslighting the agent. To make (5) fail meaningfully, you *must* already have rejected (1).
      *   However, if you reject (5) *instead* of (1), you are claiming the agent is confused about the *verdict* itself. You are suggesting that in a dilemma, there *is* no ATC verdict.
      *   **Price:** This leads to **rational indeterminacy**. It says that in dilemma cases, reason runs out. There is no "ought." This saves the residue (because no verdict was exhaustive) but it cripples action guidance. It tells the agent, "Reason cannot tell you what to do." Most rationalists find this unacceptable; they want the verdict to hold even if the pain remains. Rejecting (1) allows you to keep the verdict *and* the pain. Rejecting (5) forces you to choose between them.

  ### Summary of the Diagnosis

  Your friend's argument is valid, but it relies on a **category error in Premise (1)**. He treats the *justificatory* supremacy of the ATC verdict as an *ontological* annihilation of the opposing reasons.

  *   **The Lorry Driver Test:** As you noted, the lorry driver did what he ought (no negligence). Under (1), his reasons are "spent." Therefore, his agent-regret is unwarranted. This is absurd. The regret is warranted precisely because the reason "do not kill" persists even when the action was unavoidable.
  *   **The Rationalist Fix:** You can tell your friend that rejecting (1) does not require "spooky normativity." It only requires acknowledging that **justification is not erasure**. A reason can be outweighed without being cancelled. The "residue" is simply the normative footprint of the cancelled reason, cashed out in obligations of memory, compensation, or acknowledgment.

  If you reject (1), you save the phenomenology of the lorry driver, you save the phenomenology of the dilemma, and you keep the ATC verdict intact. You just have to accept that doing the right thing doesn't always leave your hands clean. That is the price of a moral reality that is not flat.
