answer: |-
  **Mark: 9/20**

  **Justification**
  The answer is clearly written and engages directly with the prompt, but it rests on a fundamental misreading of Wolf's central thesis in Part (a). The student conflates Wolf's objection to the *ideal of sainthood* with the *over-demandingness objection to moral theory*, which Wolf explicitly distinguishes. This error cascades into Part (b), where the student argues that voluntariness solves Wolf's worry, missing Wolf's point that the saint's life is *intrinsically* less rich in non-moral virtues, regardless of consent. While the "community level" argument in (b) shows creativity, it does not salvage the misapplication of Wolf's text.

  **Point-by-Point Comments**

  **Part (a): Reconstruction and Distinction (Score: 3/8)**

  *   **"Her complaint is essentially a demandingness complaint."**
      *   **Substantive Mistake:** This is the critical error. Wolf opens the paper by distinguishing her project from the claim that morality is "too demanding." Her point is not that sainthood is *hard* or *costly*, but that it is *unattractive* because it crowds out non-moral virtues (humor, aesthetic appreciation, etc.). The student reduces Wolf's argument to a complaint about sacrifice/exhaustion.
  *   **"Someone who actually lived up to it would have no time or energy left over... and would end up exhausted and probably miserable."**
      *   **Loose Phrasing:** Wolf does mention that the saint might be "boring" or lack "good sense," but she does not hinge the argument on misery or exhaustion. A saint could be happy to be a saint; Wolf's claim is that we still wouldn't view that life as the *ideal* human life because it lacks certain non-moral excellences.
  *   **"This is why Wolf's worry is, at bottom, the same worry as the over-demandingness objection..."**
      *   **Substantive Mistake:** The question explicitly asks the student to *distinguish* these. The student asserts they are the "same." Wolf's objection is about the *value of a life* (axiology), whereas the over-demandingness objection is about the *truth of a moral theory* (normative ethics). The student fails to capture this distinction.
  *   **"...applied to non-consequentialist morality as well..."**
      *   **What it gets right:** The student correctly notes Wolf's argument applies broadly, not just to utilitarianism. The reference to Williams is defensible as a parallel, though it risks conflating Williams' "integrity" objection (about moral luck/ground projects) with Wolf's "non-moral virtues" objection. This is acceptable but imprecise.

  **Part (b): Divided Sainthood (Score: 6/12)**

  *   **"Wolf's problem with the moral saint is a problem about the cost of sainthood to whoever has to live it."**
      *   **Substantive Mistake:** Again, this treats Wolf's worry as purely about *cost* (sacrifice) rather than *content*. Even if the cost is borne voluntarily, Wolf would argue the *content* of that life (lacking non-moral interests) remains a deficient ideal.
  *   **"The value Wolf is worried about losing... is preserved at the level of the community..."**
      *   **Defensible but Incomplete:** This is the strongest move in the essay. It creatively shifts the unit of analysis from the individual to the collective. To earn full marks, the student would need to address whether Wolf's individualism allows for this trade-off. Wolf is concerned with *personal* perfection; aggregating virtues across a community might not answer her worry about the saint's individual flourishing.
  *   **"Wolf's argument is an argument about what may be demanded of people, it has nothing to say about a case in which the demands are freely taken on."**
      *   **Substantive Mistake:** This follows from the error in Part (a). Wolf's argument is about what constitutes a *rationally preferable ideal*, not about coercion. She argues that even if you *can* choose sainthood, it is not the *best* choice for a human life. The student treats voluntariness as a trump card, which Wolf would likely reject.
  *   **"There is a residual worry about the saint herself... But that is her own choice..."**
      *   **Objection Handling:** The student identifies an objection but dismisses it using the flawed premise above. To earn the full 5 marks for this section, the student needed to engage with the worry that the saint is living a less-than-ideal life *even if* she chooses it, and explain why Wolf (or the community) should be indifferent to that deficiency.

  **Interpretive Note**
  My grading assumes the standard reading of Wolf: that she is making a claim about the *ideal of personal goodness* distinct from the *limits of moral obligation*. There is a minor strand of literature suggesting Wolf's argument *implicitly* relies on demandingness concerns, but in the context of an upper-year seminar, the student is expected to grasp Wolf's explicit methodological distinction. If your course has emphasised a revisionist reading where Wolf's distinction collapses, you may wish to adjust the penalty on Part (a), but on the face of the text provided, the student's conflation is a significant philosophical error.
