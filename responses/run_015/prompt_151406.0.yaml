answer: |-
  This is a classic problem in political philosophy and legal theory. Your supervisor is asking for a "stipulative definition" (let's agree on what this word means so we can work), but you are encountering the "essentially contested concept" problem (the word means different things in different contexts, and those meanings fight each other).

  Your current draft definition ("private relationship displaces criteria") is close to the standard *quid pro quo* model, but as you've noticed, it fails on **systemic corruption** (Case 2, where no deal is struck) and **cultural context** (Case 3).

  Here is a two-part principle designed to capture your intuitions while remaining precise enough for a paper. It distinguishes between the *act* and the *system*, and between *influence* and *entitlement*.

  ### The Principle: Subversion of Entrusted Power

  **Corruption occurs when an agent entrusted with a specific institutional mission allows a private interest (gift, relationship, or payment) to subvert the impartial application of that mission, unless the payment is defensive.**

  To apply this, you must test three conditions:

  1.  **Entrustment:** Does the actor hold a role that requires impartiality or fidelity to a specific mission (e.g., public health, fair zoning, meritocratic admission)?
  2.  **Subversion:** Does the private interest alter the decision, the timing, or the access in a way that violates that mission?
  3.  **The Defensive Exception:** Is the payment made to secure a *pre-existing entitlement* that is being unlawfully withheld by a corrupt system? (This handles your "grease money" cases).

  ### Applying the Principle to Your Cases

  Here is how this principle sorts your 11 cases, and where it forces you to make hard choices.

  **1. The Passport (Grease Money)**
  *   **Verdict:** Not Corrupt (by the actor).
  *   **Reasoning:** Meets Condition 1 (Clerk is entrusted), but fails Condition 2 (Subversion). You are not asking the clerk to *violate* the rules; you are paying them to *follow* the rules (issue the passport you are entitled to). This falls under the **Defensive Exception**.
  *   *Note:* The *system* is corrupt, but your *act* is not.

  **2. The Mayor (Golf Contract)**
  *   **Verdict:** Corrupt.
  *   **Reasoning:** The private relationship (golf) subverts the mission (best contract for the city). Explicit *quid pro quo* is not required; the **appearance of undue influence** violates the entrustment.

  **3. The Village Chief (Goat)**
  *   **Verdict:** Not Corrupt.
  *   **Reasoning:** This is the hardest case. Under this principle, you must argue that in *that specific institution*, the "mission" includes social reciprocity. If the Chief's role is partly to maintain social bonds, the goat is a fee for access, not a subversion.
  *   *The Trade-off:* To keep this verdict, you must accept **Functional Relativism**. You cannot say corruption is universal; you must say corruption is "violating the norms of *this* specific institution." If the village norm is "gifts grant access," it's not corruption. If the village norm is "impartial justice," it is.

  **4 & 5. The Wine (Timing)**
  *   **Verdict:** (4) Not Corrupt, (5) Corrupt.
  *   **Reasoning:** This hinges on **Causality**. In (4), the decision is made; the gift cannot subvert it. In (5), the gift precedes the decision, creating a risk of subversion. The principle requires the private interest to *alter* the mission. Pre-op wine creates an obligation; post-op wine expresses gratitude.

  **6 & 7. The Drug Rep (Conference vs. Sandwiches)**
  *   **Verdict:** (6) Corrupt, (7) Not Corrupt.
  *   **Reasoning:** This is the **De Minimis Threshold**. Sandwiches are communal and low-value; they do not realistically subvert professional judgment. A paid trip is high-value and creates a specific debt to the donor. The principle requires the private interest to be significant enough to *plausibly* subvert the mission.

  **8 & 9. The Nurse (Queue vs. Overtime)**
  *   **Verdict:** (8) Corrupt, (9) Not Corrupt.
  *   **Reasoning:** This distinguishes **Public Resource vs. Private Labor**. In (8), the nurse sells a public resource (surgery slot) that belongs to others in the queue. This violates "equal treatment." In (9), she sells her own private time (overtime). She is not subverting the hospital's mission; she is augmenting it.

  **10 & 11. The University (Donation vs. Legacy)**
  *   **Verdict:** (10) Corrupt, (11) Not Corrupt (but unfair).
  *   **Reasoning:** This distinguishes **Transaction vs. Status**. In (10), there is a direct link between money and admission (subversion of meritocracy for gain). In (11), the admission is based on a standing policy (legacy status), not a specific transaction.
  *   *The Trade-off:* Many philosophers (e.g., Lawrence Lessig) would call (11) "institutional corruption." To keep your verdict, you must insist that corruption requires a **discrete exchange**, not just a structural bias.

  ### The "Dad" Case: Application

  **Scenario:** Dad on Planning Committee. Friend's firm has rezoning application. Friend sends expensive engagement watch (customary). Dad recuses himself. Vote passes anyway.

  **Prediction:** **Not Corrupt, but Ethically Compromised.**

  **Analysis:**
  1.  **Entrustment:** Yes (Planning Committee).
  2.  **Subversion:** No. Because he **recused himself**, the private interest (the watch/friendship) did not alter the official outcome. The vote happened without his input.
  3.  **Defensive Exception:** N/A.
  4.  **Appearance:** While not technically corrupt under the principle (because the decision wasn't subverted), it violates the **Spirit of Entrustment**. Even if he didn't vote, the gift creates a perception that his *colleagues* might be influenced by his presence or future reciprocity.

  **Verdict for your paper:** It is not corruption *stricto sensu* because the mechanism of subversion (his vote) was removed. However, it is a **conflict of interest** that should have been managed by declining the gift, not just recusal.

  ### The Hard Truths: What You Must Give Up

  You asked me to be straight about which verdicts clash with a rigorous definition. You cannot keep all 11 intuitions without making your definition so complex it's useless. Here are the two tensions you must resolve in your paper:

  **1. The "Petty Corruption" Problem (Case 1)**
  *   **The Clash:** Most international bodies (Transparency International, World Bank) define Case 1 as **Petty Corruption**. They argue that paying the brike sustains the corrupt system, even if you are a victim.
  *   **The Sacrifice:** If you want to keep your verdict (that Case 1 is *not* corruption), you must explicitly distinguish between **Systemic Corruption** (the bureaucracy) and **Individual Moral Culpability** (you). You are arguing that corruption requires *agency to harm the public*, not just *participation in a broken system*.
  *   **Recommendation:** Adopt the term **"Defensive Payment"** for Case 1. Acknowledge it fuels corruption but classify it differently from "Aggressive Corruption" (Case 8).

  **2. The "Institutional Corruption" Problem (Case 10 vs 11)**
  *   **The Clash:** Your intuition says buying admission (10) is corrupt, but legacy admission (11) is not. Logically, both subvert meritocracy. The only difference is that one is illegal/frowned upon and the other is tradition.
  *   **The Sacrifice:** To keep this distinction, you must define corruption as requiring a **specific transactional link**. You are arguing that corruption is an *act*, not a *state of affairs*.
  *   **Recommendation:** Be precise. Define corruption as requiring a **quid pro quo** (explicit or implicit). Legacy admission is a *privilege*, not a *bribe*. It is unfair, but calling it "corruption" dilutes the meaning of the word. Stick to your gun here, but admit it's a choice to prioritize "transaction" over "outcome."

  ### Summary for Your Supervisor

  If you need a single paragraph for your paper, use this:

  > "I define corruption as the **subversion of an entrusted institutional mission by a private interest**. This requires three elements: (1) a role demanding impartiality; (2) a private benefit or obligation that influences the discharge of that role; and (3) a deviation from the institution's core criteria (e.g., merit, need, or first-come-first-served). I exclude 'defensive payments' made to secure pre-existing entitlements against unlawful obstruction, as these restore rather than subvert the institution's intended function."

  This covers your gut feelings on the passport (defensive), the nurse (subversion of queue), and the mayor (private interest subverting public good), while giving you the tools to analyze your dad's watch (recusal prevents subversion).
