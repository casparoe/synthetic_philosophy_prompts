answer: |-
  This is a classic and fertile battleground in contemporary moral philosophy. Your skepticism is well-founded. While the situationist critique (spearheaded by Gilbert Harman and John Doris in the late 90s and early 2000s) forced a necessary empirical reckoning within virtue ethics, the popular summary you encountered—claiming virtue ethics is "empirically refuted" and character talk should be abandoned—is a significant overreach that most philosophers in this subfield reject.

  As a PhD student, you are likely looking for the structural weaknesses in the situationist argument rather than a defensive apology for Aristotle. Here is a breakdown of how a sophisticated virtue ethicist would parse the situationist critique, distinguishing between empirical concessions, conceptual disputes, and the practical implications.

  ### 1. The Situationist Argument (Formalized)
  To see where the critique lands, we must formalize the argument your colleague's book is making. It generally runs like this:
  1.  **Virtue Ethics Commitment:** Virtue ethics requires the existence of global character traits (stable, consistent dispositions to act, feel, and think in specific ways across a wide range of relevant situations).
  2.  **Empirical Premise:** Social psychology (Milgram, Darley & Batson, etc.) demonstrates that human behavior is overwhelmingly determined by situational variables rather than global traits. Cross-situational consistency is remarkably low.
  3.  **Conclusion:** Therefore, global character traits do not exist.
  4.  **Normative Upshot:** Virtue ethics is empirically inadequate; we should focus on situation management.

  ### 2. What Virtue Ethicists Grant (The Concessions)
  A sophisticated virtue ethicist (e.g., Julia Annas, Nancy Snow, Christian Miller) will not deny the data. The empirical concessions are crucial for credibility:

  *   **Folk Psychology is Wrong:** Virtue ethicists grant that the *layperson's* view of character is often empirically naive. We do tend to commit the Fundamental Attribution Error, overestimating the role of disposition and underestimating the situation.
  *   **Virtue is Rare:** Aristotelian virtue ethics has always held that *phronesis* (practical wisdom) and full virtue are rare achievements. The fact that seminary students in the Good Samaritan study failed to help does not refute the *possibility* of virtue; it merely confirms the Aristotelian claim that most people are not yet virtuous. The experiments test average populations, not the *phronimos* (the person of practical wisdom).
  *   **The Importance of Situation:** Virtue ethicists grant that situations matter. In fact, a key part of virtue is knowing which situations to enter or avoid. A virtuous person knows they are susceptible to hunger, fatigue, or peer pressure and manages their environment accordingly.

  ### 3. What Virtue Ethicists Dispute (The Core Rebuttals)
  The philosophical heavy lifting happens here. The critique relies on specific interpretations of both the data and the theory that are contestable.

  #### A. The Mischaracterization of Virtue (The "Phronesis" Objection)
  This is the strongest philosophical objection (championed by **Rachana Kamtekar** and **Julia Annas**).
  *   **The Critique:** Situationists treat virtues as mechanical, stimulus-response habits (e.g., "honesty" means *always* telling the truth regardless of context).
  *   **The Response:** Aristotelian virtues are not rigid algorithms; they are intelligent dispositions mediated by *phronesis*. A virtuous person does not act the same way in every situation; they act *appropriately* to the situation.
  *   **Application to Data:** In the Milgram studies, obedience varied wildly based on subtle situational cues (proximity of the learner, presence of rebellious peers). A virtue ethicist argues this doesn't show a lack of character; it shows that moral perception is context-sensitive. If "courage" looks different in a boardroom than in a trench, low behavioral consistency across those domains doesn't prove the trait is absent. The situationist demands a consistency that virtue theory never promised.

  #### B. The Normative vs. Descriptive Distinction
  *   **The Critique:** Virtue ethics claims people *have* virtues.
  *   **The Response:** Virtue ethics is primarily normative (how one *ought* to live and develop), not descriptive (how people currently behave). As **John Doris** himself acknowledges, situationism refutes the idea that *most people currently possess* robust virtues. It does not refute the idea that such traits are *cultivatable* or that they constitute the ideal moral life. To say virtue ethics is "refuted" because people aren't virtuous is like saying medicine is refuted because people get sick.

  #### C. The Interpretation of the Data (Base Rates and Conditionals)
  *   **The Critique:** Most people obeyed Milgram; most didn't help in the phone booth. Therefore, traits don't exist.
  *   **The Response:**
      1.  **Base Rates:** In Milgram's baseline study, 65% obeyed to the maximum. But 35% *did not*. If character traits are rare, finding a significant minority who resist immense pressure is actually evidence *for* the existence of robust agency, not against it.
      2.  **Conditional Traits:** Philosopher **Peter Vranas** argues that traits might be conditional ("honest unless threatened"). The experiments often stack the deck with overwhelming situational pressure. Failing a stress test doesn't prove the absence of the capacity, only its limits.
      3.  **Local Traits:** Doris concedes "local traits" exist (e.g., honesty-in-the-presence-of-friends). Virtue ethicists like **Christian Miller** argue that through moral development, these local traits can be integrated into broader characters. The experiments capture people *mid-development*, not the endpoint of moral cultivation.

  ### 4. Does the Practical Conclusion Follow?
  The book claims we should abandon character talk and focus on "designing environments." A virtue ethicist would argue this is pragmatically self-defeating and philosophically thin.

  *   **Who Designs the Environment?** Situationist interventions require agents to design, implement, and maintain the incentive structures. If character traits (conscientiousness, benevolence, wisdom) do not exist, why trust the situation-designers? If no one has stable traits, the designers will also be swayed by the next situational whim. You need character to sustain situationist reforms.
  *   **The Danger of Fatalism:** If we tell people "your character doesn't matter, only the environment does," we risk undermining moral agency and responsibility. This can lead to a self-fulfilling prophecy where individuals stop striving for self-improvement because they believe it is empirically impossible.
  *   **Complementarity:** The most robust view is a hybrid. We should design environments that reduce temptation (situationism) *while* cultivating the character traits necessary to navigate environments we couldn't design (virtue ethics). As **Nancy Snow** argues, virtue and situation are co-constitutive.

  ### 5. Recommended Literature for Your Deep Dive
  Since you are preparing to engage with this literature carefully, here are the pivotal texts you should prioritize, moving from the critique to the sophisticated responses:

  **The Situationist Critique:**
  *   **Gilbert Harman**, "Moral Philosophy Meets Social Psychology: Virtue Ethics and the Fundamental Attribution Error" (1999). *The seminal paper.*
  *   **John M. Doris**, *Lack of Character: Personality and Moral Behavior* (2002). *The book-length treatment.*

  **The Virtue Ethical Responses:**
  *   **Rachana Kamtekar**, "Situationism and Virtue Ethics on the Content of Our Character" (2004). *Essential for the argument that situationists misdescribe virtue.*
  *   **Julia Annas**, "Virtue Ethics and Social Psychology" (2003) and *Intelligent Virtue* (2011). *Focuses on the skill analogy and the developmental nature of virtue.*
  *   **Christian B. Miller**, *Character and Moral Psychology* (2013). *Attempts to reconstruct a notion of character that is empirically sound.*
  *   **Nancy E. Snow**, *Virtue as Social Intelligence: An Empirically Grounded Theory* (2010). *Bridges the gap using social-cognitive psychology.*
  *   **Maria Silvia Vaccarezza**, "Practical Wisdom and the Value of Cognitive Diversity" (2019). *Recent work on how phronesis handles situational variance.*

  ### Summary for Your Colleague
  If you need a quick shorthand to discuss this with your colleague:
  The situationist experiments successfully refute a **straw man** of virtue ethics (one that posits rigid, context-insensitive behavioral habits in average people). They do not refute a **sophisticated** virtue ethics (which posits rare, context-sensitive, intelligent dispositions cultivated over a lifetime). Furthermore, the practical recommendation to abandon character is self-undermining, as effective environmental design presupposes the very character traits (wisdom, integrity) that situationism claims are illusory.

  The "Death of Character" is premature. It is more accurate to say the "Naive Conception of Character" has died, making room for a more empirically informed virtue theory.
