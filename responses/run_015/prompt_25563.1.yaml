prompt: |-
  I'm a PhD student in philosophy, working at the intersection of moral psychology and normative ethics. Recently a colleague in the psychology department lent me a popular book on social psychology and morality, and one chapter in particular has been nagging at me. The chapter is about what the author calls "the death of character," and it runs through the classic situationist experiments: Darley and Batson's Good Samaritan study (where seminary students stepped over a groaning man when they were told to hurry), Isen and Levin's dime-in-the-phone-booth finding (where discovering a coin dramatically increased helping behavior), and of course the Milgram obedience studies. The author's gloss is that these experiments collectively demonstrate that what we call "character traits" — honesty, compassion, courage — simply don't exist as stable features of persons. Behavior is overwhelmingly driven by situational factors we're not even aware of. The author then claims that virtue ethics, which makes the cultivation of stable character traits central to the moral life, is therefore empirically refuted. The practical upshot, according to the book, is that we should stop thinking in terms of character and virtue, and instead focus entirely on designing environments and incentive structures that make good behavior the path of least resistance.

  I know enough to recognize that this is a version of the situationist critique associated with philosophers like Gilbert Harman and John Doris, and I'm aware that virtue ethicists have responded — I've seen references to work by Julia Annas, Rachana Kamtekar, and others — but I haven't yet worked through that literature carefully. The book's summary sounds forceful and the experiments it cites are real, but I have a nagging sense that the author is running together claims of different strengths and perhaps attributing to virtue ethics a more naive empirical psychology than most virtue ethicists actually hold. Could you help me sort out what in this summary a virtue ethicist would grant, what they would dispute, and whether the book's practical conclusion about abandoning character-talk actually follows from the experimental record?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in philosophy (intersection of moral psychology and normative ethics). This means they have high technical proficiency, understand the jargon, and need a nuanced, academically rigorous response, not a pop-psych summary.
      *   **Topic:** The Situationist Critique of Virtue Ethics (Harman, Doris) vs. Virtue Ethical Responses (Annas, Kamtekar, Snow, etc.).
      *   **Specific Trigger:** A popular psychology book claiming "the death of character" based on experiments (Good Samaritan, Dime in Phone Booth, Milgram) and concluding that virtue ethics is empirically refuted and we should focus solely on situation design.
      *   **Task:** Sort out what a virtue ethicist would grant, what they would dispute, and whether the practical conclusion (abandon character talk) follows.

  2.  **Deconstruct the Situationist Critique:**
      *   *Core Claim:* Global character traits (robust, cross-situational dispositions) do not exist.
      *   *Evidence:* Social psychology experiments showing low cross-situational consistency (Good Samaritan, Dime, Milgram, Stanford Prison).
      *   *Target:* Aristotelian virtue ethics (specifically the idea of *hexis* or stable states).
      *   *Conclusion:* Virtue ethics is empirically inadequate; focus on situation management.

  3.  **Identify Virtue Ethical Responses (The "Grant" vs. "Dispute"):**
      *   *What to Grant:* Yes, ordinary people often lack robust virtues. Yes, situations matter immensely. Yes, folk psychology overestimates consistency.
      *   *What to Dispute:*
          1.  **The Definition of Virtue:** Situationists attack a "straw man" of virtue (global, rigid, context-insensitive). Virtue ethicists (especially Aristotelians) view virtue as *phronetic* (practical wisdom), sensitive to context, not a mechanical reflex.
          2.  **The Interpretation of Data:** The experiments often measure *behavior* in isolated instances, not *traits* over time. Also, many subjects *did* resist (Milgram had variations where obedience dropped).
          3.  **The Ideal vs. The Actual:** Virtue ethics is often normative (how to become excellent), not descriptive (how people currently are). The fact that few people are virtuous doesn't mean virtue is impossible.
          4.  **Fragmentation vs. Integration:** Doris argues for "local traits." Virtue ethicists argue virtues are integrated via practical wisdom (*phronesis*).
          5.  **Self-Regulation:** Virtue includes knowing one's weaknesses and managing situations (the "Ulysses pact").

  4.  **Evaluate the Practical Conclusion:**
      *   *Claim:* Abandon character talk, focus on environment.
      *   *Counter:* Environment design *requires* agency. Who designs it? Why do they design it well? Character is needed to sustain situationist interventions. Also, situationism can lead to fatalism or manipulation. A hybrid approach is better.

  5.  **Structure the Response:**
      *   **Introduction:** Acknowledge the user's expertise, validate their skepticism, and name the debate (Situationist Challenge).
      *   **Section 1: The Situationist Argument (Clarification):** Briefly formalize Harman/Doris's argument to ensure we are attacking the right target. Distinguish between *global* traits and *local* traits.
      *   **Section 2: What Virtue Ethicists Grant (Concessions):** Don't be defensive. Acknowledge the empirical force. Folk psychology is wrong. Most people aren't virtuous.
      *   **Section 3: What Virtue Ethicists Dispute (The Core Rebuttals):**
          *   Mischaracterization of Virtue (Phronesis vs. Reflex).
          *   The Normative/Descriptive Distinction (Ideal vs. Average).
          *   Interpretation of Experiments (Milgram nuances, base rates).
          *   The Role of Practical Wisdom (Integration of traits).
      *   **Section 4: The Practical Upshot (Environment vs. Character):** Critique the "abandon character" conclusion. Argue for complementarity.
      *   **Section 5: Recommended Literature:** Since the user is a PhD student, provide specific, high-level citations (Annas, Kamtekar, Snow, Miller, etc.).
      *   **Conclusion:** Summarize the philosophical stance.

  6.  **Drafting the Content (Iterative refinement for tone and depth):**
      *   *Tone:* Collegial, rigorous, precise. Avoid oversimplification.
      *   *Key Distinction:* Make sure to highlight *Phronesis* (practical wisdom). This is the biggest missing piece in the situationist critique. They treat virtues like automatic habits; Aristotelians treat them as intelligent dispositions.
      *   *Key Distinction:* The "Idealization" objection. Virtue ethics describes the *phronimos*, not the average seminary student.
      *   *Key Distinction:* Local Traits. Doris admits local traits exist. Virtue ethicists can accommodate this or argue for integration.
      *   *Practical Implication:* Situationism without character is self-defeating. Who designs the situations?

  7.  **Refining the Citations:**
      *   Harman (1999), Doris (2002) for the critique.
      *   Annas (2003, 2011) for the skill analogy.
      *   Kamtekar (2004) for the "rationalist" critique.
      *   Snow (2010) for empirical nuance.
