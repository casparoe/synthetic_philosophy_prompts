answer: |-
  **ADVERSARIAL COLLABORATION DOCUMENT: THE STATUS OF SUPEREROGATION**

  **Parties:** The Optionalist (defending the genuineness of the supererogatory) and The Eliminativist (defending the reduction or elimination of the category).

  ### 1. Agreed Claims (Common Ground)

  The following points constitute the shared phenomenological and theoretical baseline. Both parties agree that any adequate moral theory must accommodate these data points, and both acknowledge that certain argumentative moves have proven fruitless.

  1.  **Paradigm Cases:** There exist widely recognized instances (e.g., jumping on a live grenade to save comrades, donating a kidney to a stranger) that elicit the same intuitive response from both parties: the agent who performs the act is morally exemplary, and the agent who omits it is not typically subject to moral sanction.
  2.  **The Axiological/Deontic Distinction:** Both parties agree that "morally best" (axiological) and "morally required" (deontic) are conceptually distinct. The dispute is not about whether these concepts differ in meaning, but whether they can diverge in extension (i.e., can the *best* act be *optional*?).
  3.  **The Asymmetry of Praise and Blame:** Both parties accept that the moral landscape is asymmetrical. It is possible to be praiseworthy for doing $X$ without being blameworthy for not doing $X$. The dispute concerns the *explanation* of this asymmetry.
  4.  **Non-Indifference:** Both parties agree that supererogatory acts are not morally indifferent. They possess positive moral value. The omission of a supererogatory act is not equivalent to the omission of a morally neutral act (e.g., choosing tea over coffee).
  5.  **Fruitless Appeals:** Both parties agree that appeals to ordinary language usage of the word "ought" settle nothing, as ordinary language conflates evaluative advice with deontic requirement. Similarly, raw intuition pumps without theoretical integration are insufficient to resolve the dispute.
  6.  **Concessions on Scope:**
      *   The **Optionalist** concedes that not every act of significant benefit is supererogatory; some are clearly obligatory, and labeling them "supererogatory" to avoid duty is a distortion.
      *   The **Eliminativist** concedes that the absence of blame does not always imply the absence of a violation; sometimes blame is withheld due to epistemic limitations, the agent's capacity, or the counterproductivity of the blaming practice itself.

  ### 2. Residual Disagreements

  The following table isolates the specific propositions where the parties diverge. Each proposition is phrased such that the proponent accepts it as true, while the opponent rejects it as false or misleading.

  | # | Proposition | Optionalist Stance | Eliminativist Stance |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Deontic Status of the Best Act:** There are possible worlds where an act $A$ is the morally best option available to an agent, yet the agent is morally permitted to omit $A$. | **Accepts.** The deontic category of the "permissible" is wider than the "required," leaving room for the best to be optional. | **Rejects.** If $A$ is the morally best option, it is, by definition, required. If it is permitted to omit $A$, then $A$ was not the best option *all-things-considered*. |
  | **2** | **The Explanation of Non-Blame:** In paradigm supererogatory cases, the agent is not blameworthy for omission *because* they violated no obligation. | **Accepts.** No blame is appropriate because no duty exists. The absence of blame tracks the absence of obligation. | **Rejects.** The agent is not blameworthy *despite* violating an obligation. The absence of blame is due to an excuse, a prerogative, or a limitation on our blaming practices, not a lack of requirement. |
  | **3** | **The Maximization Principle:** Morality does not strictly require the maximization of the good; agents possess a prerogative to favor their own interests up to a threshold. | **Accepts.** Morality leaves space for personal projects. Requiring maximization makes morality overly demanding and alienating. | **Rejects.** Morality is impartial. Any "prerogative" is merely a concession to human weakness, not a feature of the moral truth. The "best" act is always the "required" act. |
  | **4** | **The Structure of Value:** The value that makes an act supererogatory is of a different kind than the value that grounds a duty, not merely a matter of degree. | **Accepts.** There is a qualitative break between duty and supererogation, not just a quantitative sliding scale of cost/benefit. | **Rejects.** The distinction is merely quantitative. As the cost to the agent drops or the benefit to others rises, the act slides from optional to required. |

  ### 3. The Cruxes

  The following test cases are selected because they force the theoretical machinery of each side to produce distinct, observable predictions.

  #### Crux 1: Aggregation and Conjunction
  **The Issue:** Whether the class of permissibly omitted acts is closed under conjunction. If an act is optional once, is it optional when iterated?

  *   **Concrete Case:** *The Daily Donation.* An agent faces the opportunity to donate a trivial sum (e.g., $1) to a highly effective charity every day for a year. The cost of any single donation is negligible (below the threshold of duty). However, the aggregate cost of donating every day is significant, and the aggregate benefit is life-saving.
  *   **Optionalist Prediction:** Each individual omission is permissible. While the *pattern* of omission might eventually become vicious or blameworthy, the deontic status of the individual act does not change merely due to iteration. There is no specific day $N$ where the donation suddenly becomes mandatory.
  *   **Eliminativist Prediction:** The deontic status of the individual act is sensitive to the context of iteration. Either the first act is already required (because the aggregate context is visible from the start), or there is a specific point in the sequence where the cost-benefit ratio shifts enough to turn the "optional" act into a "required" one. The "optional" label cannot hold for every instance in the series.

  #### Crux 2: Roles and Relationships
  **The Issue:** Whether special relationships generate new duties or merely alter the cost-benefit calculation for existing general duties.

  *   **Concrete Case:** *The Off-Duty Medic.* A qualified doctor witnesses a car accident. A layperson bystander is also present. The medical intervention required is risky but likely to save a life. The layperson cannot perform the intervention.
  *   **Optionalist Prediction:** For the layperson, intervention is supererogatory (if impossible) or standardly supererogatory (if possible but risky). For the doctor, the role creates a specific *contractual* or *professional* duty, but this is distinct from the moral category of supererogation. The doctor's duty is a special obligation, not a reduction of the supererogatory threshold for morality in general.
  *   **Eliminativist Prediction:** The role does not create a distinct *kind* of duty; it merely lowers the "cost" of acting for the agent. Because the doctor can help at a lower relative cost (due to training) than the layperson, the act becomes required for the doctor while remaining optional for the layperson. The difference is one of capacity and cost, not a separate deontic category. If the cost were low enough for the layperson, it would be required for them too.

  #### Crux 3: Blame as Evidence of Deontic Status
  **The Issue:** Whether the absence of blame is evidence about deontic status (Optionalist) or only about our blaming practices (Eliminativist).

  *   **Concrete Case:** *The Saintly Omission.* A morally exemplary agent (a "Saint"), known for extreme generosity, fails to make a significant sacrifice on one occasion (e.g., does not donate a bonus). The community reacts with disappointment but does not blame or sanction the agent.
  *   **Optionalist Prediction:** The community's reaction is accurate. The agent is not blameworthy because the act was not required. The "disappointment" reflects the axiological loss (the good wasn't done), but the lack of blame reflects the deontic truth (no duty was violated).
  *   **Eliminativist Prediction:** The community's reaction is a pragmatic accommodation. The act *was* required (it was the best act), but the community withholds blame because sanctioning a "Saint" is counterproductive or because they recognize the extreme difficulty of the demand. The lack of blame is an error in moral practice, masking the true deontic violation.

  ### 4. Closing Note: The Verbal Dispute

  A significant portion of this dispute turns on the definition of "duty" (or "obligation") and its relationship to reactive attitudes like blame.

  The **Optionalist** effectively defines duty via a **Blame-Implies-Duty** principle (or its contrapositive, **No-Duty-Implies-No-Blame**). For the Optionalist, if it is inappropriate to blame an agent for omitting $X$, then $X$ was not a duty. This ties the deontic status tightly to the appropriateness of moral sanctions.

  The **Eliminativist** decouples duty from blame. They define duty via a **Reasons-Implies-Duty** principle (specifically, that the balance of moral reasons determines duty). For the Eliminativist, an act can be required even if blame is inappropriate due to the harshness of the requirement, the agent's psychological limits, or the social utility of leniency.

  If the dispute were merely terminological, the parties could agree to use "Required$_1$" for "Blameworthy to omit" and "Required$_2$" for "Best to do." However, the dispute is not purely verbal. It reflects a deeper disagreement about the **authority of morality**. The Optionalist insists morality must leave room for personal autonomy without sanction. The Eliminativist insists morality tracks the objective weight of reasons regardless of our comfort with sanctioning. While clarifying the definition of duty dissolves some confusion, the substantive conflict remains regarding whether the "best" act necessarily carries the "binding" force of a command.
