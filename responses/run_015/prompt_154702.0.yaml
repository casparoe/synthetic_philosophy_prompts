prompt: |-
  So I'm a novelist (four books, two of which you could actually find in a decent library) and last year I let myself get talked onto the board of the Aldridge Prize for fiction — mid-sized, one winner, money plus a residency, funded by a foundation that mostly keeps to itself. We have a vote in three weeks on a reform petition that a bit over two hundred of our members signed, and I'm the one who has to circulate the recommendation memo beforehand. I need you to write it.

  The complaint behind the petition is that the prize has become a machine for anointing the same kind of book. Over the last six years maybe a dozen people have sat on the jury, and a handful keep coming back: our current chair has judged four times, and she's been on panels with two other repeaters often enough that people have started calling them the permanent jury. Two of the last three winners came from the same small press. Nobody's done anything corrupt — it's just that when the same eight people read for the same prize every couple of years they develop a house style and start mistaking it for quality.

  The petition has two parts. First: three of the six jury seats filled by lot from the membership — anyone who's published a book of fiction is eligible, you opt into the pool — while the board keeps appointing the other three. Second: hard term limits, nobody serves more than twice in any ten years, chair rotates every cycle. There's also a variant that a couple of members keep pushing in emails and that I find more interesting than either of those: hold the draw at the *end* of the process, keep the appointed readers for the longlist slog, then pull three names by lot out of everyone who actually returned scores on time. So the lottery would select for people who did the reading rather than for representativeness. I go back and forth on whether that's a clever fix or a total misunderstanding of what sortition is even supposed to be for.

  What I want from you is the memo, addressed to the board, bottom line up top: adopt as written, reject, or adopt with conditions — pick one, and if it's conditions, make them concrete and few. Who's in the pool (opt-in or everybody)? Same honorarium and same reading load for drawn members, or a reduced one? What happens when someone drawn declines? Can the chair be a drawn member? And please settle the end-of-process variant one way or the other.

  Two more things that have to be in it honestly rather than buried. The first is my own conflict: I got my one real break when a repeat juror went to bat for my second novel in a room where nobody else had read it, and I've judged twice myself and would be termed out. But there's a non-selfish version of that worry and I want it stated at full strength — the career people have read four hundred novels in the form, they can tell when a book is doing something difficult that looks like a mistake, and a randomly drawn member is likely to sit quiet for two meetings and then vote with whoever spoke most confidently. If that's right, sortition gives you the look of openness while the real decision still gets made by the two loudest people in the room, which is worse than the current arrangement. Say what you think of that; don't just nod at it.

  The second is the foundation director. She's neutral in public, but her three staff schedule everything, chair the meetings, draft the citation, and quietly do a lot of the shortlisting when jurors fall behind on the pile. So part of what I want the memo to face is who captures the process under each option, given that the staff is the only continuous thing in it.

  Don't give me citations, reading lists, or studies show anything — I can't check it and neither can most of the board, so argue it out in plain terms. Aim for something a board reads in ten minutes and can vote on at the end. And definately don't give me a memo that hedges into no recommendation; I need to stand up and move something.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**

      *   **Role:** Novelist (4 books, 2 in libraries), Board Member of the Aldridge Prize.
      *   **Task:** Write a recommendation memo to the Board regarding a reform petition signed by ~200 members.
      *   **Context:** Prize is mid-sized, one winner, money + residency. Foundation is private/quiet. Vote in 3 weeks.
      *   **The Problem:** Perceived stagnation/clique-y nature ("Permanent Jury," same small press winning, "house style"). No corruption, just insularity.
      *   **The Petition:**
          1.  3 of 6 jury seats filled by lot (sortition) from membership (opt-in pool of published fiction writers). Board appoints the other 3.
          2.  Term limits (max 2x in 10 years), rotating chair.
          3.  *Variant:* Draw jurors at the *end* from those who did the longlist reading (staff-heavy implication).
      *   **My Stance:** Need to pick one: Adopt, Reject, or Adopt with Conditions. Must be concrete.
      *   **Key Issues to Address:**
          *   Pool definition (opt-in vs. all).
          *   Honorarium/Load for drawn members.
          *   Declines/Replacements.
          *   Chair eligibility for drawn members.
          *   Settle the "End-of-Process Variant" (kill it or keep it).
          *   **Conflict of Interest:** I benefited from a repeat juror; I've judged twice (would be termed out). Need to state this honestly but focus on the systemic issue.
          *   **The Expertise Argument:** Career readers spot difficult quality; randoms might defer to loud voices. Is sortition just theater?
          *   **The Staff Power:** Foundation director/staff are the only constants. Who captures the process under each model?
      *   **Tone:** Plain terms, no citations/studies, decisive (no hedging), readable in 10 mins, actionable.

  2.  **Determine the Recommendation:**

      *   *Option A: Reject.* Safe for the status quo, ignores the membership unrest, validates the "clique" accusation. Bad for morale.
      *   *Option B: Adopt as Written.* Risks the "expertise" problem. The "End-of-Process Variant" is logistically messy and gives staff too much power over the pool.
      *   *Option C: Adopt with Conditions.* This allows for reform while mitigating risks.
      *   *Decision:* **Adopt with Conditions.** It shows responsiveness to the membership but protects the prize's integrity regarding expertise and staff overreach.
      *   *Specific Conditions:*
          1.  **Pool:** Opt-in (volunteers want to be there).
          2.  **Variant:** Reject the "draw at end" idea. It incentivizes speed over quality and gives staff too much control over who qualifies. Draw at the start.
          3.  **Load/Honorarium:** Same as appointed. If you're on the jury, you do the work.
          4.  **Chair:** Cannot be a drawn member (needs experience/continuity).
          5.  **Declines:** One redraw allowed, then board appoints to ensure the jury is full.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary (BLUF):** Recommendation is Adopt with Conditions.
      *   **Context:** Acknowledge the petition and the validity of the complaint (insularity).
      *   **The Conflict:** Address the personal stake immediately. I benefited from the old system. I am term-limited out. This isn't about saving my seat.
      *   **The Expertise Risk:** Address the "randoms defer to loud voices" argument. Don't dismiss it. Mitigate it with structure (equal pay/load, orientation).
      *   **The Staff Reality:** Address the Foundation Director/Staff influence. Sortition changes *who* judges, but staff still manage the flow. Need to ensure drawn members aren't just rubber stamps for staff pre-screening.
      *   **The "End-of-Process" Variant:** Explicitly reject it. It turns the lottery into a reward for labor rather than a democratic check, and staff define "labor."
      *   **Specific Conditions:** List the concrete rules (Pool, Pay, Chair, Declines).
      *   **Conclusion:** Call to action.

  4.  **Refining the Tone:**

      *   *Voice:* Professional but candid. A novelist talking to other literary people. No corporate jargon.
      *   *Honesty:* Don't sugarcoat the risk that new jurors might just follow the experts. Acknowledge that the "Permanent Jury" developed a style for a reason (experience), but that style has become a cage.
      *   *Staff Dynamics:* Be careful not to accuse the staff of malice, but acknowledge their structural power. If jurors are drawn at the end, staff effectively pick the jury by managing the workload.

  5.  **Drafting - Iteration 1 (Mental Check):**

      *   *Did I answer the prompt?* Yes.
      *   *Is the recommendation clear?* Yes.
      *   *Did I address the conflict?* Yes.
      *   *Did I address the expertise argument?* Yes.
      *   *Did I address the staff power?* Yes.
      *   *Did I kill the variant?* Yes, need to make sure the reasoning is solid. (Reasoning: Drawing at the end means staff manage the attrition. Drawing at the start means random chance enters the room immediately).
      *   *Word Count:* Keep it tight. 10-minute read is roughly 1,000-1,500 words.

  6.  **Drafting - Iteration 2 (Focusing on the "Expertise" vs. "Democracy" tension):**

      *   The prompt asks me to "Say what you think of that; don't just nod at it."
      *   *My take:* The petitioners are right that insularity is bad, but wrong that randomization fixes expertise. However, "expertise" has become code for "sameness." The fix isn't to dumb down the jury, but to broaden the definition of expertise.
      *   *Staff:* If staff do the shortlisting when jurors fall behind, a jury of novices falls behind faster. This increases staff power. *Mitigation:* Drawn members get the same honorarium to ensure they prioritize it, and the Chair (appointed) manages the timeline strictly so staff don't have to step in.

  7.  **Final Polish:**

      *   Check the "Conditions."
      *   Ensure the "Conflict" section feels humble but firm.
      *   Ensure the "Variant" rejection is decisive.
      *   Make sure the BLUF is at the very top.

  8.  **Final Review against constraints:**
      *   No citations? Check.
      *   No hedging? Check.
      *   Address pool, honorarium, declines, chair, variant? Check.
      *   Address conflict and staff power? Check.

  *(Self-Correction during drafting)*: I initially thought about letting drawn members be Chair. But the prompt asks me to settle it. A rotating chair among drawn members is risky if they are new. Better to keep the Chair as an appointed board role or a senior juror to ensure procedural integrity. I will recommend the Chair *cannot* be a drawn member to ensure continuity.

  *(Self-Correction on Staff)*: I need to be careful not to sound like I'm attacking the Foundation Director. Frame it as "structural inevitability." Staff are the only constants; if the jury turns over too much without structure, staff fill the vacuum.

  *(Self-Correction on Conflict)*: Make sure I explicitly state I would be termed out. That proves I'm not voting for my own job security.

