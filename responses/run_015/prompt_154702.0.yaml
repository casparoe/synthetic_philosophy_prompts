answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors, The Aldridge Prize
  **FROM:** [Your Name], Board Member
  **DATE:** October 12, 2023
  **SUBJECT:** Recommendation on Membership Petition Regarding Jury Selection

  **BOTTOM LINE**
  I recommend we **Adopt the Petition with Conditions.**

  The status quo is unsustainable. The perception of a "permanent jury" has hardened into a reputation for insularity, which devalues the prize for the winner and the organization for the members. However, the petition as written contains logistical vulnerabilities that could shift power from the jury to the Foundation staff or dilute the quality of judgment.

  My recommendation is to implement the sortition (lottery) system and term limits, subject to five specific conditions outlined below. We must reject the "end-of-process" variant.

  **CONTEXT AND CONFLICT**
  I need to state my position clearly before arguing the mechanics. I benefited from the current system. On my second novel, a repeat juror advocated for the book in a room where no one else had finished it. That break changed my career. I have also served as a juror twice. Under the proposed term limits, I am ineligible for future service.

  I am not recommending this to secure a seat for myself; I am recommending it because I am vacating one. The "house style" complaint is valid. When the same eight people read for the same prize every few years, they stop debating quality and start curating a legacy. That is not stewardship; it is branding. We need new eyes.

  **THE EXPERTISE OBJECTION**
  There is a serious argument against sortition: Career readers have read four hundred novels in the form. They can distinguish between a mistake and a risk. A randomly drawn member, regardless of their own publication record, may lack that specific comparative volume. The risk is that a drawn member sits silent for two meetings and votes with whoever speaks most confidently. If true, sortition gives the *look* of openness while the real decision is still made by the two loudest people in the room.

  This is a real risk, but it is preferable to the current certainty. Under the current model, the "loudest voices" are guaranteed a seat. Under the proposed model, they might be drawn, or they might not. The presence of three drawn members forces the appointed experts to articulate *why* a book works, rather than relying on shared shorthand. It slows down the consensus. That friction is a feature, not a bug. It prevents the jury from sleepwalking toward a "house style" winner.

  **THE STAFF REALITY**
  We must also be honest about the Foundation staff. The Director is publicly neutral, but her three staff members schedule meetings, chair the discussions, draft the citation, and quietly manage the shortlist when jurors fall behind on the pile. They are the only continuous element in the process.

  If we increase jury turnover without tightening procedure, the staff will inevitably capture the process. They will become the de facto jury because they are the only ones who remember how last year's winner was chosen. Sortition changes who votes, but it does not change who manages the workflow. If the drawn jurors are overwhelmed, the staff steps in to triage. If the staff triages the longlist, the jury is merely ratifying staff preferences.

  To prevent this, the drawn members must be treated exactly like appointed members: same pay, same expectations, same accountability. We cannot create a two-tier jury where the "randoms" are treated as interns.

  **REJECTION OF THE "END-OF-PROCESS" VARIANT**
  Some members have proposed drawing the three lottery seats at the *end* of the process, selected from the pool of members who successfully completed the longlist reading. I recommend we **reject** this variant.

  1.  **It shifts power to Staff:** Determining who "returned scores on time" is an administrative decision. This gives the staff the ability to shape the jury by managing the deadline pressure.
  2.  **It misunderstands Sortition:** The point of a lottery is to introduce a cross-section of the membership into the deliberation room, not to reward labor. If we select for people who already did the work, we select for people who already agree with the process. We want the outsider perspective, not the compliant one.
  3.  **It creates instability:** If you draw the jury after the longlist is read, you are bringing three new people into the room for the shortlist and final vote who have no shared history with the other three jurors. It fractures the deliberation.

  **RECOMMENDED CONDITIONS**
  To adopt the petition successfully, the Board must approve the following five conditions:

  1.  **The Pool (Opt-In):** The lottery pool shall consist only of members who explicitly opt in. We will not draw from the general membership. This ensures that drawn jurors actually want to serve.
  2.  **Honorarium and Load:** Drawn jurors receive the exact same honorarium and reading load as appointed jurors. There is no reduced tier. If they cannot commit to the full load, they should not opt into the pool.
  3.  **Declines and Redraws:** If a drawn member declines, one redraw is permitted. If the second selection declines, the Board shall appoint a replacement to ensure the jury is seated six weeks before reading begins. We cannot risk an incomplete jury.
  4.  **The Chair:** The Jury Chair cannot be a drawn member. The Chair must be an appointed member with prior jury experience. This ensures procedural continuity and protects the drawn members from being burdened with administrative management they haven't been trained for.
  5.  **Orientation:** The Foundation staff must provide a mandatory, paid orientation for drawn members regarding the timeline and scoring rubric. This mitigates the risk of staff having to "rescue" the process later due to confusion.

  **CONCLUSION**
  The petition is a warning signal. It tells us that our membership feels locked out of their own prize. Ignoring it preserves our current efficiency but accelerates our irrelevance. Adopting it without conditions risks turning the jury over to the staff or diluting the judgment.

  Adopting with these conditions strikes a balance. It breaks the "permanent jury" cycle. It acknowledges that expertise matters, but that insularity is a greater threat than inexperience. It protects the staff from being forced into a decision-making role they shouldn't hold.

  I move that we accept the petition with the conditions listed above.

  **[Your Name]**
  Board Member, The Aldridge Prize
