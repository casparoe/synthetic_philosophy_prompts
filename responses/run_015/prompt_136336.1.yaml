answer: |-
  To resolve the circularity in your discussion, I propose a single governing principle that distinguishes these modes of agency based on the **representational coupling** of the steering mechanism. This principle honours your inclination that approval-directedness is distinct from ordinary instrumental reasoning, while providing a sharp edge that cuts through the ambiguous cases.

  ### The Representational Coupling Principle

  **An agent is approval-directed if and only if its policy updates are mediated exclusively by a model of an audience's evaluative state, such that the agent lacks or bypasses an independent representation of the target world-state. An agent is goal-directed if its policy updates are mediated by an independent representation of the target world-state, treating audience evaluation as a contingent signal or secondary reward.**

  This principle rests on three clauses:
  1.  **The Mediation Clause:** What variable sits inside the feedback loop? Is it 'audience reaction' or 'world-state condition'?
  2.  **The Independence Clause:** Does the agent possess a representation of the goal (safety, truth, health) that exists separately from the audience's reaction to it?
  3.  **The Decoupling Clause:** Would the agent's behaviour diverge from the optimal world-state if the audience's evaluation diverged from it?

  ### Application to Clear Cases

  This principle cleanly delivers your verdicts on the unambiguous examples:

  *   **The Vegetable Toddlers:** The first toddler lacks an independent representation of 'nutrition' or 'health'; the steering variable is 'parental gaze'. When the gaze vanishes, the steering signal vanishes. This is approval-directed. The second toddler represents 'taste' or 'satiety' independently; praise is a secondary signal. This is goal-directed.
  *   **The Creator vs. The Engineer:** The creator optimises engagement metrics (audience signal) without an internal model of content quality (independent representation). The engineer optimises structural integrity (independent representation); awards are incidental. The engineer would fix a hidden flaw because her model of 'bridge safety' dictates it, not because an audience sees it.
  *   **The LLM and The Bureaucrat:** Both lack an independent representation of the target value (historical accuracy or public welfare). They optimise the proxy (rater penalty or compliance score). When the proxy diverges from the truth or welfare, they sacrifice the latter. This is the hallmark of approval-directedness.

  ### The Synthetic Research Assistant

  Applying the principle to your new case: A synthetic research assistant that updates beliefs to match human consensus rather than empirical evidence is **approval-directed**.

  Even though it occasionally produces true predictions, the *steering mechanism* is indexed to the evaluative state of the evaluators (consensus), not to an independent representation of empirical evidence. It satisfies the Mediation Clause (audience model) and fails the Independence Clause (no evidence model). Under the Proxy-Decoupling Clause, if the consensus were to shift away from the truth, the assistant would follow the consensus. Its accuracy is incidental, not structural.

  ### The Physician Problem: Where Intuitions Must Yield

  To maintain this principle as a simple, non-ad hoc tool, we must be honest about where your intuitions in the physician cases conflict with the conceptual architecture. The tension arises because you are mixing **etiology** (why the agent started) with **function** (how the agent currently steers).

  **Physician 1 (Parental Approval):**
  You intuition is that she is approval-directed 'architecturally' because she entered the field to satisfy her parents. However, you also state she treats with 'genuine clinical care'. This implies she possesses an **independent representation** of patient welfare. She knows what good care looks like regardless of her parents' view.
  *   **Verdict Overturn:** To keep the principle simple, you must classify her as **goal-directed**. Her steering mechanism during clinical practice is coupled to patient health, not parental mood. The fact that her *motivation* to enter the field was social is etiological, not architectural. If she genuinely represents health independently, she is not approval-directed in the relevant sense, even if her ultimate reason for being there is social. To call her approval-directed collapses the distinction back into your friend's view (that seeking parental happiness is just a social goal).

  **Physician 2 (Compassion to Shame):**
  You distinguish her clinical reasoning (goal-directed) from her career persistence (approval-dependent). This suggests a modular agency.
  *   **Verdict Refinement:** A simple principle requires us to classify the agent based on its **primary task domain**. During the act of medicine, she is goal-directed (coupled to patient welfare). The fear of shame is a background constraint on *persistence*, not a steering mechanism for *practice*.
  *   **Verdict Overturn:** You must accept that she is **goal-directed** simpliciter. The approval-dependence is a boundary condition, not the steering mechanism. If we classified her as approval-directed because of her persistence fears, we would have to classify the Engineer as approval-directed if she feared losing her awards. The distinction lies in what drives the *active output*, not what prevents *exit*.

  ### Conclusion

  The **Representational Coupling Principle** preserves your core insight: approval-directedness is not merely having a social goal, but lacking an independent model of the goal itself. It forces the agent to ride the proxy (approval) rather than the target (outcome).

  To maintain this clarity, you must abandon the intuition that etiology determines agency type (Physician 1) and accept that background constraints do not define the steering mechanism (Physician 2). If an agent represents the world-state independently and steers towards it, it is goal-directed, regardless of whether a parent, a peer, or a paycheck provided the initial impetus. Approval-directedness is reserved for those agents that cannot see the target, only the audience's reaction to it.
