  **Brainstorming Session: Main Issues & Strategy**

  *   **Core Conflict:** Identity vs. Coincidence. Unitarians say Statue = Clay (one object, different descriptions/sortals). Pluralists say Statue ≠ Clay (two objects, same location, different modal profiles).
  *   **Squashing Case:** Crucial for persistence conditions. Unitarians must explain change in properties without change in object. Pluralists must explain spatial coincidence without violation of exclusion principles.
  *   **Form:** Is "statue-shape" a real ontological constituent (hylomorphic element) or just a relational property of particles? Pluralists often need form to individuate the statue from the lump. Unitarians treat form as a mode.
  *   **Digital Scan/Print Case:** Original (Bronze) vs. Copy (Marble). Does the copy's existence change the original's modal properties (e.g., could it have been marble?)? Standard view: Modals are intrinsic. But if "being a statue" is a functional kind defined by history, does the copy compete? We need to agree modals don't change extrinsically, but disagree on *why* (essence vs. history).
  *   **Counting:** Do we count objects by space occupied or by sortal concepts? Unitarians say counting is sortal-relative. Pluralists say counting tracks mind-independent entities.
  *   **Verbal Dispute:** Is "object" ambiguous? Or is it a deep metaphysical split about persistence?
