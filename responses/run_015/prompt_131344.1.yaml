  **JOINT STATEMENT ON MATERIAL CONSTITUTION AND ONTOLOGICAL COUNTING**
  **Adversarial Collaboration Group: Metaphysics of Material Objects**

  **Introduction**

  Over the course of a three-day workshop, our group attempted to map the disagreement between Unitarian and Pluralist accounts of material constitution. We focused on the classic Statue and Clay case, but pushed into newer territory regarding digital replication and the ontological status of form. We found that while we share a common vocabulary, we diverge sharply on what that vocabulary commits us to. This document outlines our shared commitments, precise points of divergence, and the specific cruxes that remain unresolved. We hope this serves as a baseline for future work, specifcally regarding the modal implications of replication.

  **1. Agreed Claims (Common Ground)**

  Both camps sign onto the following claims. These represent the explananda any viable theory must accommodate.

  1.  **The Existence of the Base:** There is a quantity of bronze matter arranged statue-wise. Both sides agree this matter exists independently of our conceptual scheme.
  2.  **The Squashing Intuition:** If the statue is squashed into a sphere, the *statue* ceases to exist (or ceases to be a statue), while the *clay/bronze* persists. Both sides agree the physical matter survives the deformation.
  3.  **Counting Contextualism:** In ordinary conversation, answering "how many objects are on the pedestal?" depends on the context. If asked for inventory, we say "one." If asked for distinct historical entities, the answer is disputed, but both sides agree ordinary language allows for flexibility.
  4.  **The Digital Replica Case:** Regarding the hypothetical where a perfect digital scan of the bronze statue is used to 3D-print an identical copy in marble:
      *   Both sides agree that the existence of the marble copy does *not* alter the intrinsic modal properties of the original bronze object. (e.g., The original bronze statue does not suddenly gain or lose the ability to survive squashing just because a marble copy exists).
      *   Both sides agree the copy is numerically distinct from the original.
  5.  **Supervenience:** Facts about statues supervene on facts about the arrangement and properties of the underlying matter. There is no magical emergence that ignores the physical base.

  **2. Disagreements Table**

  Here we isolate the precise metaphysical commitments. Each side accepts the wording in their own column as accurate to their view.

  | Feature | Unitarian Position (Constitution/Identity) | Pluralist Position (Coincidentalism) |
  | :--- | :--- | :--- |
  | **Numerical Identity** | The statue is literally identical to the lump of clay. There is only one object here. | The statue is numerically distinct from the lump of clay. There are two objects here. |
  | **Persistence Conditions** | Persistence conditions are sortal-relative. The object survives squashing *qua* clay, but not *qua* statue. | Persistence conditions are intrinsic to the object. The statue-object cannot survive squashing; the clay-object can. |
  | **Spatial Location** | One object occupies one region of space. | Two distinct objects occupy the same region of space simultaneously. |
  | **Properties** | The object has properties relative to sorts. It is "essentially statuesque" only under the statue sortal. | The objects have different intrinsic modal properties. One essentially has a shape; the other only accidentally has it. |
  | **Ontological Parsimony** | We do not multiply objects beyond necessity. Coincidence is avoided. | We multiply objects to preserve the intuition that different persistence conditions imply different entities. |

  **3. The Cruxes**

  These are the deep theoretical fault lines. We identified two primary cruxes where agreement seems impossible without one side conceding their core metaphysical framework.

  **Crux A: The Ontological Status of Form**
  *   **The Issue:** Is the "form" (the statue-shape/organization) a real ontological constituent that helps individuate the object, or is it merely a mode/arrangement of the matter?
  *   **Concrete Case:** The Squashing Case.
  *   **Unitarian Prediction:** When squashed, the object loses a property (being arranged statue-wise). No object ceases to exist; the single object just changes modal profile relative to our interests. Form is a mode.
  *   **Pluralist Prediction:** When squashed, one object (the statue) ceases to exist entirely. The form was a constitutive principle of that specific object's identity. Form is a constituent.

  **Crux B: Object-Counting and Joints of Nature**
  *   **The Issue:** Does our counting of objects track mind-independent "joints" in reality, or is counting a pragmatic tool driven by human interests?
  *   **Concrete Case:** The Digital Scan/3D-Print Scenario.
  *   **Setup:** Original Bronze Statue (O). Perfect Marble Copy (C).
  *   **Unitarian Prediction:** Counting is pragmatic. Whether O and C are "the same statue" depends on the sortal. If the sortal is "bronze artifact," they are different. If the sortal is "aesthetic form," they might be tokens of the same type. The existence of C does not change the identity conditions of O because identity is grounded in the matter-history of O.
  *   **Pluralist Prediction:** Counting tracks real entities. O and C are distinct substances. The crucial test is counterfactual: If O had been made of marble originally, would it be *this* statue? Pluralists argue O's identity is tied to its specific matter-origin. The copy case confirms that form alone is insufficient for numerical identity across matter. The disagreement lies in whether the *original's* modal properties (e.g., "could have been marble") are fixed by its actual history (Pluralist) or are flexible relative to description (Unitarian).
  *   **Specific Disagreement on Modals:** While we agreed in Section 1 that the copy doesn't *change* the original's modals, we disagree on what grounds those modals. Pluralists say the original's matter grounds its necessity (it couldn't be marble). Unitarians say the sortal grounds it (under "statue," it could have been marble; under "bronze lump," it could not).

  **4. Assessment of Verbal Dispute**

  Is this dispute merely verbal?

  *   **Consensus:** We agree that *some* portion of the dispute is verbal. Specifically, the word "object" is used differently. Unitarians tie "object" to "spatially continuous matter." Pluralists tie "object" to "persistence conditions."
  *   **Substantive Remainder:** However, we agree the dispute is not *merely* verbal. There is a substantive disagreement about the structure of reality.
      *   If Pluralists are right, reality contains coinciding entities that differ only in modal properties. This requires an ontology that supports distinct individuals sharing all actual properties.
      *   If Unitarians are right, modal properties are not intrinsic to objects but are relations between objects and sortals/concepts.
      *   The Digital Scan case highlights this: If the copy is made, does the universe contain a new "form"? Pluralists say yes (a new particularized form). Unitarians say no (just new matter arranged similarly). This is a real metaphysical disagreement about the nature of properties and particulars, not just definition.

  **Conclusion**

  We remain divided on whether coincidence is possible. However, we have isolated the disagreement to the status of form and the grounding of modal properties. Future work should focus on the Digital Scan scenario to test whether artifact kinds are defined by history (favoring Pluralism) or function/form (favoring Unitarianism).

  *Signed,*
  *The Collaboration Group*
