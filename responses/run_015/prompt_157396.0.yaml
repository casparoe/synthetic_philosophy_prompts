answer: |-
  # DECISION TREE: THEORIES OF CONCEPTUAL CORRECTNESS

  **ROOT:** You agree that a competent speaker can apply a general term to a novel case correctly or incorrectly, and that this correctness is not merely a matter of arbitrary preference.

  ---

  ### NODE 1 (Twin Earth)
  **Case:** A liquid is indistinguishable from water to an ordinary speaker but has a different chemical composition (XYZ).
  **Question:** Does the hidden chemical structure determine the reference of the word "water," even if the speaker is ignorant of chemistry?
  *(Tests Claim 1: Instances share no single feature vs. Underlying Nature)*
  *   **YES** $\rightarrow$ Go to **Node 2**.
  *   **NO** $\rightarrow$ Go to **Node 3**.

  ### NODE 2 (Expert Error)
  **Case:** In 1750, experts confidently classify XYZ as "water." Later, chemistry proves XYZ is not water.
  **Question:** Were the 1750 experts speaking *falsely* at the time, or did the word's reference shift with the discovery?
  *(Tests Claim 1: Retrospective fixation by nature)*
  *   **YES (They were false)** $\rightarrow$ **LEAF A: Semantic Externalism**
  *   **NO (Reference shifted)** $\rightarrow$ **LEAF B: Social Externalism**

  ### NODE 3 (Novel Practice)
  **Case:** A performance is produced entirely by a machine. It is unclear if the old word "music" applies.
  **Question:** Is there a fact of the matter about whether this is music *before* the community reaches a consensus?
  *(Tests Claim 3: No rule settles every application)*
  *   **YES** $\rightarrow$ Go to **Node 4**.
  *   **NO** $\rightarrow$ Go to **Node 5**.

  ### NODE 4 (Stateability)
  **Case:** You attempt to teach a robot to apply the term "music" correctly to all possible cases.
  **Question:** Could a speaker, in principle, state a rule or condition that settles every possible application in advance?
  *(Tests Claim 3: Rule stateability)*
  *   **YES** $\rightarrow$ **LEAF C: Classical Descriptivism**
  *   **NO** $\rightarrow$ Go to **Node 6**.

  ### NODE 5 (Community Normativity)
  **Case:** Your entire linguistic community agrees that the machine performance is "music."
  **Question:** Is it still possible for the whole community to be mistaken about this classification?
  *(Tests Claim 3: Source of normativity)*
  *   **YES** $\rightarrow$ **LEAF D: Skeptical Solution**
  *   **NO** $\rightarrow$ Go to **Node 7**.

  ### NODE 6 (Internal Guide)
  **Case:** A speaker applies a term correctly but cannot explain why.
  **Question:** Is the correctness fixed by a mental state or inference pattern internal to the speaker, rather than external objects?
  *(Tests Claim 3: Internal vs. External justification)*
  *   **YES** $\rightarrow$ **LEAF E: Inferential Role Semantics**
  *   **NO** $\rightarrow$ **LEAF F: Unnamed Position (Platonist Intuitionism)**

  ### NODE 7 (Gradience)
  **Case:** Consider various items called "games."
  **Question:** Are some items clearly *better* examples of the concept than others, despite both being correct uses?
  *(Tests Claim 1: Structure of the category)*
  *   **YES** $\rightarrow$ **LEAF G: Prototype/Exemplar View**
  *   **NO** $\rightarrow$ Go to **Node 8**.

  ### NODE 8 (Common Feature)
  **Case:** Consider the set of all things correctly called "games."
  **Question:** Must all instances share at least one observable property or feature in common?
  *(Tests Claim 1: Shared feature requirement)*
  *   **YES** $\rightarrow$ **LEAF H: Unnamed Position (Strict Nominalism)**
  *   **NO** $\rightarrow$ Go to **Node 9**.

  ### NODE 9 (Explanation Demand)
  **Case:** A philosopher asks, "What fact makes your application of the word correct?"
  **Question:** Is this demand for an explaining fact itself a philosophical confusion that should be dissolved?
  *(Tests Claim 3: Demand for theory)*
  *   **YES** $\rightarrow$ **LEAF I: Quietism**
  *   **NO** $\rightarrow$ **LEAF J: Family Resemblance**

  ---

  ### LOGICAL INDEPENDENCE NOTE
  *   **Node 1 (Nature)** and **Node 3 (Rule Settling)** are logically independent. One can believe meaning is fixed by nature (Node 1 YES) but that no rule settles application (Node 3 NO).
  *   **Node 7 (Gradience)** and **Node 8 (Common Feature)** are logically independent. One can deny common features (Node 8 NO) while affirming graded membership (Node 7 YES), or vice versa.
  *   **Mapping to Seminar Claims:**
      *   **Claim 1 (No single feature):** Tested primarily by Nodes 1, 2, 7, 8.
      *   **Claim 2 (Vague boundary):** *Kept off main trunk* (see Note on Vagueness below).
      *   **Claim 3 (No rule settles all):** Tested primarily by Nodes 3, 4, 5, 6, 9.

  ---

  ### LEAF LEGEND: POSITIONS & COMMITMENTS

  | Leaf | Position | Most Awkward Commitment | Counterintuitive Prediction |
  | :--- | :--- | :--- | :--- |
  | **A** | **Semantic Externalism** | Speakers can refer to things they cannot identify or conceive. | 1750 speakers referred to H₂O even when holding XYZ. |
  | **B** | **Social Externalism** | Meaning is fixed by current expert consensus, not historical causation. | If experts change their minds, what you meant yesterday changes today. |
  | **C** | **Classical Descriptivism** | Every general term has a definition that covers all possible cases. | There is a true definition of "game" that covers future inventions. |
  | **D** | **Skeptical Solution** | No fact about you settles what you meant; only community license matters. | You cannot meaningfully claim you are following a rule privately. |
  | **E** | **Inferential Role** | Meaning is determined by what follows from a claim, not what it names. | Two speakers referring to the same object mean different things if their inferences differ. |
  | **F** | **Platonist Intuitionism** | Speakers access abstract rules they cannot state. | A speaker can be guided by a rule they cannot articulate or learn. |
  | **G** | **Prototype/Exemplar** | Category membership is a matter of degree, not all-or-nothing. | A statement like "This is a bird" can be partially true. |
  | **H** | **Strict Nominalism** | Only the name is common; instances share nothing. | There is no reason why we call both chess and soccer "games." |
  | **I** | **Quietism** | Philosophical theories of meaning are themselves nonsensical. | We should stop asking what "correctness" consists in entirely. |
  | **J** | **Family Resemblance** | Concepts are held together by overlapping similarities, not essence. | There is no feature all games share, yet the concept is not vague. |

  ---

  ### BLIND SPOTS: INDISTINGUISHABLE LEAVES
  1.  **Family Resemblance (J) vs. Prototype (G):** This tree separates them by "Gradience" (Node 7), but in practice, both deny necessary conditions. To pry them apart, one would need to ask: *Is the cognitive mechanism of categorization similarity-based (Prototype) or use-based (Resemblance)?* The handout cases do not distinguish cognitive mechanism from logical structure.
  2.  **Quietism (I) vs. Deflationary Correctness:** A deflationist says correctness is just disquotation ("'Snow' is correct iff snow"); a quietist says the question is confused. No case in this tree forces a choice, as both reject substantive theories of meaning.

  ### GHOST POSITIONS: UNDEFENDED COMBINATIONS
  1.  **Externalist Skeptic (Node 1 YES + Node 5 YES):** Claims reference is fixed by hidden nature, but no fact settles what we meant. *Diagnosis:* **Incoherent.** If nature fixes reference, there is a fact about what we meant.
  2.  **Classical Quietist (Node 4 YES + Node 9 YES):** Claims rules can be fully stated, but asking for facts of correctness is confused. *Diagnosis:* **Incoherent.** If rules can be stated, the fact of correctness is the satisfaction of the rule.
  3.  **Stateable Prototype (Node 4 YES + Node 7 YES):** Claims membership is graded, but the grading rule can be fully stated. *Diagnosis:* **Unexplored.** Most prototype theorists deny stateability due to context dependence.

  ### NOTE ON VAGUENESS
  **Where it attaches:** Vagueness (Claim 2) is a vertical cut across this tree. A Classical Descriptivist can be an Epistemicist (boundaries are sharp but unknown) or a Supervaluationist (boundaries are indeterminate).
  **Why off the trunk:** Because vagueness concerns the *precision* of boundaries, whereas this tree concerns the *source* of correctness. One can have sharp or blurry boundaries regardless of whether meaning is fixed by nature, use, or rules.
