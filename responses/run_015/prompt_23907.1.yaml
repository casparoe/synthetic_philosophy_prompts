answer: |-
  **SEMINAR HANDOUT: SPECIFICATIONS FOR A THEORY OF MORAL TESTIMONY**
  **Course:** Graduate Seminar in Epistemology
  **Topic:** The Moral Testimony Problem – Desiderata and Constraints

  ### Introduction
  The "Moral Testimony Problem" (MTP) arises from the intuition that while we readily accept testimony in domains like history, geography, or even physics, we hesitate to accept moral testimony on the same terms. An adequate theory cannot simply resolve one puzzle case; it must satisfy a set of competing constraints regarding the nature of moral justification, the mechanics of transmission, and the value of moral agency.

  Below are the six core desiderata any viable theory must address. Note the distinction between **Generic Epistemic Requirements** (constraints applying to knowledge generally) and **Metaethical Commitments** (constraints arising from specific views on the nature of moral property/access).

  ---

  ### The Desiderata List

  #### 1. The Transmission Condition
  *   **The Case:** If a trusted colleague tells you the meeting is at 3 PM, you know it is at 3 PM. If a trusted ethicist tells you "euthanasia is permissible," why shouldn't you know that too? (The Optimist Baseline).
  *   **Requirement:** The theory must explain how (or if) moral justification/knowledge transfers from speaker to hearer without the hearer reconstructing the argument from first principles.
  *   **Status:** **Generic Epistemic Requirement.** (Denying this requires a radical skepticism about testimony generally).

  #### 2. The Understanding/Agency Condition
  *   **The Case:** Alice believes "lying is wrong" because her guru said so. Bob believes it because he grasps the harm lying causes. Intuitively, Bob is more morally praiseworthy, even if both have knowledge. (Hills 2009).
  *   **Requirement:** The theory must account for the value of "moral understanding" (grasping the *reasons why*) versus mere "moral knowledge" (knowing *that*). It must explain whether testimony can yield the former.
  *   **Status:** **Metaethical Commitment.** (Specifically, the Pessimist/Anti-Authoritarian intuition. Optimists argue knowledge suffices for action).

  #### 3. The Safety Condition
  *   **The Case:** You form a moral belief via testimony. In nearby possible worlds where the testifier is slightly mistaken or the context shifts slightly, do you still hold a true belief?
  *   **Requirement:** Moral knowledge acquired via testimony must be *safe*. It cannot be easily false. This places a burden on the reliability of the moral testifier and the hearer's ability to screen for reliability.
  *   **Status:** **Generic Epistemic Requirement.** (Derived from modal epistemology; knowledge requires safety from error in nearby worlds).

  #### 4. The Moral Progress Condition
  *   **The Case:** Slavery was once widely accepted; now it is not. If moral knowledge is like perception (local, individual) or skill (traditional, embodied), how do we explain collective correction over time?
  *   **Requirement:** The theory must explain how moral communities improve their track record. If ethics is expertise, progress is paradigm shift. If perception, it requires calibration. If skill, it requires pedagogy.
  *   **Status:** **Generic Explanatory Burden.** (Any metaethics must explain the phenomenon of progress).

  #### 5. The Error Explanation Condition
  *   **The Case:** Two sincere agents "perceive" opposite moral truths (e.g., on abortion). If moral knowledge is non-inferential perception, how is error possible without positing a broken faculty?
  *   **Requirement:** The theory must explain the etiology of moral disagreement and error. For perception views, this is acute: why do my "moral eyes" differ from yours?
  *   **Status:** **Metaethical Commitment.** (Particularly burdensome for the Ethics-as-Perception camp; less so for Expertise/Skill camps which allow for training deficits).

  #### 6. The Responsibility Condition
  *   **The Case:** A soldier claims "I was just following orders." We reject this as an excuse. Deferring to a moral expert feels similarly like abdicating responsibility.
  *   **Requirement:** The theory must explain how an agent can rely on testimony without forfeiting moral responsibility for the action.
  *   **Status:** **Metaethical Commitment.** (The "Ethics is Special" prejudice. Assumes moral agency requires a specific kind of first-personal authorization not required in non-moral domains).

  ---

  ### Structural Tensions & Exclusionary Constraints

  #### The Most Exclusionary Desideratum: **The Understanding/Agency Condition**
  This is the primary bottleneck. If you insist that moral knowledge *requires* grasping the reasons (Understanding), pure testimony becomes impossible by definition, as testimony typically bypasses the hearer's reasoning process. This condition excludes standard Reductionist and Non-Reductionist accounts of testimony unless they are heavily modified (e.g., by requiring the testimony to trigger the hearer's own reasoning). If you relax this condition to allow blind deference, you satisfy Transmission but violate the Responsibility Condition.

  #### The Incompatible Pair: **Transmission vs. Responsibility**
  There is a strong tension between **Desideratum 1 (Transmission)** and **Desideratum 6 (Responsibility)**.
  *   To satisfy **Transmission**, the hearer must be able to acquire knowledge *solely* on the basis of the speaker's word (deference).
  *   To satisfy **Responsibility**, the hearer must own the justification for the action (autonomy).
  *   **The Conflict:** You cannot fully defer (make the speaker's reason your reason) and fully retain autonomy (make the reason your own) simultaneously. A theory must either weaken the notion of transmission (e.g., testimony as a prompt, not a basis) or weaken the notion of responsibility (e.g., responsibility only requires acting on true beliefs, not understood ones).

  ---

  ### Scorecard: Evaluating the Three Camps

  | Desideratum | **Ethics as Expertise** (Science-like) | **Ethics as Perception** (Non-inferential) | **Ethics as Skill** (Phronesis/Practical) |
  | :--- | :--- | :--- | :--- |
  | **1. Transmission** | **High.** Fits the model of layperson deferring to specialist (like physics). | **Low.** Hard to testify about private perceptual states ("It looks red to me"). | **Med.** Can testify to rules, but not the "feel" of the application. |
  | **2. Understanding** | **Low.** Encourages deference, which bypasses the hearer's grasp of reasons. | **High.** Direct access implies the agent "sees" the truth themselves. | **High.** Skill implies knowing *how*, which entails deep understanding. |
  | **3. Safety** | **High.** Relies on track-record of experts; easily modeled modally. | **Med.** Depends on the reliability of the faculty; vulnerable to skepticism. | **Med.** Safe within contexts of competence, brittle outside them. |
  | **4. Progress** | **High.** Explains progress via better theories/experts replacing old ones. | **Low.** Hard to explain how "perception" improves collectively over centuries. | **Med.** Explains progress via better training/traditions, but slow. |
  | **5. Error** | **High.** Error is ignorance or bad theory, correctable by better experts. | **Low.** **Critical Weakness.** Disagreement implies hallucination or broken faculty. | **High.** Error is lack of practice or poor mentorship (like bad chess). |
  | **6. Responsibility** | **Low.** **Critical Weakness.** Looks like "following orders"; abdication of agency. | **High.** Agent is the direct source of the judgment. | **High.** Agent is the practitioner; ownership is inherent to skill. |
  | **Overall Viability** | **Epistemically Strong, Morally Weak.** Solves knowledge, fails agency. | **Morally Strong, Epistemically Weak.** Solves agency, fails disagreement/safety. | **Balanced but Demanding.** Solves agency/understanding, makes knowledge hard to get. |

  ### Instructor's Note for Seminar Discussion
  When evaluating student papers, check which desideratum they are sacrificing. Most "Optimist" papers implicitly reject **Desideratum 2 (Understanding)**, arguing that knowledge is sufficient for action. Most "Pessimist" papers implicitly reject **Desideratum 1 (Transmission)**, arguing that moral justification is essentially first-personal. The "Skill" view is currently the most popular attempt to bridge this gap, but it struggles with **Desideratum 4 (Progress)** regarding radical moral shifts (e.g., animal rights) that outpace traditional skill acquisition.

  *Recommended Reading for Constraints:*
  *   *Safety:* Pritchard (2005) on Epistemic Luck.
  *   *Understanding:* Hills (2009) "Moral Testimony and Moral Epistemology."
  *   *Responsibility:* Hopkins (2007) "Moral Testimony."
  *   *Skill/Progress:* Annas (2011) *Intelligent Virtue.*
