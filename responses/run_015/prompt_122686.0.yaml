answer: |-
  # Desiderata for a Theory of Proxy Failure

  ## Preamble
  You require a theory that functions as an engineering specification for social measurement. It must bridge the gap between *description* (passive observation) and *prescription* (incentive design). The following desiderata are framed to expose the structural limits of such a theory. Where your provisional distinctions hold, they are marked **Non-Negotiable (NN)**. Where they rely on category errors or untestable hopes, they are corrected or marked **Preference (P)**.

  ---

  ## 1. The Redeployment Gap
  **Status:** Vindicated as a goal, Corrected as a method. **Non-Negotiable.**
  **Motivation:** The core utility of the theory is to estimate $\Delta = E[Y|do(X=target)] - E[Y|do(X=obs)]$. If a theory cannot quantify the divergence between the observational regime and the incentive regime, it is merely a taxonomy, not a design tool.
  **Correction:** You demand this be predicted from *passive data*. This is the first point of fracture. Passive data identifies $P(Y|X)$; incentives instantiate $P(Y|do(X))$. Without structural assumptions, the gap is unidentified. A theory that claims to predict this gap from correlation alone is lying. The desideratum stands, but it forces the theory to explicitly state the *structural assumptions* required to bridge the gap.
  **Prejudice Check:** You suspect the demand for a "quantitative degradation threshold" is an econometric prejudice. You are correct. Failure is often a phase transition (sigmoidal collapse) rather than linear decay. A theory demanding a specific threshold number is overfitting to regression aesthetics.

  ## 2. Three Mechanisms (Drift, Erosion, Hijack)
  **Status:** Dissolved/Consolidated. **Non-Negotiable (on Adaptive distinction).**
  **Motivation:** You need to know if failure is inevitable (structural) or contingent (behavioral).
  **Correction:**
  *   **Drift** is not proxy failure; it is confounding or non-stationarity. It happens without agents. A theory of *Goodhart's Law* must exclude this. If the population changes without optimization, the indicator wasn't gamed; it was just wrong.
  *   **Erosion** (effort substitution) and **Hijack** (direct optimization) are both adaptive responses. They differ in degree, not kind. Erosion is partial optimization; Hijack is corner-solution optimization.
  **Requirement:** The theory must distinguish **Non-Adaptive Decay** (Drift/Confounding) from **Adaptive Decay** (Goodhart). It need not distinguish Erosion from Hijack except as a function of optimization intensity.
  **Prejudice Check:** The demand that a sound indicator be "causally upstream" is *not* a prejudice of the causal-invariance camp; it is a logical necessity for **Benign Pressure** (see below). If $X$ does not cause $Y$, optimizing $X$ cannot improve $Y$ except by accident.

  ## 3. Hard vs. Construct-Deficient Targets
  **Status:** Vindicated. **Non-Negotiable.**
  **Motivation:** In your field (research, development, social welfare), the "Target" ($Y$) is often latent or socially constructed. If $Y$ is defined *by* the metric $X$, "failure" is ontologically impossible, only politically contestable.
  **Requirement:** The theory must handle **Ontological Ambiguity**. It must distinguish between:
  1.  **Epistemic Failure:** $Y$ exists, $X$ decouples from it.
  2.  **Ontological Capture:** $Y$ is redefined to equal $X$.
  A theory that assumes a ground truth $Y$ exists independently of measurement is useless for 50% of your portfolio. However, it must warn you when you are sliding from (1) to (2).
  **Cost:** This requires the theory to incorporate a model of *validity* distinct from *reliability*. This is expensive and often philosophical, but necessary.

  ## 4. Benign Pressure
  **Status:** Vindicated. **Non-Negotiable.**
  **Motivation:** Not all optimization is bad. If $X$ is a causal lever for $Y$, pressure improves outcomes. If $X$ is merely a symptom, pressure decouples them.
  **Requirement:** The theory must predict the **Tipping Point**. Why does metric $A$ tolerate 100% optimization pressure while metric $B$ inverts at 10%?
  **Explanation:** This depends on the **Causal Density** of the indicator.
  *   *High Density:* $X$ is a bottleneck or constitutive part of $Y$. (Benign)
  *   *Low Density:* $X$ is a cheap-to-manufacture signal correlated with $Y$ via a third factor $Z$. (Malign)
  The theory must quantify the "causal load" of the indicator. Without this, you cannot distinguish a target from a trap.

  ## 5. The Audit Regress
  **Status:** Preference.
  **Motivation:** You want to know if adding Metric $X_2$ to catch gaming of $X_1$ stabilizes the system.
  **Requirement:** The theory should predict **Diminishing Returns on Complexity**. Does the cost of gaming the composite metric rise faster than the cost of measuring it?
  **Limit:** This is secondary to the primary failure mode. A theory can be adequate without solving the regress, provided it solves the initial deployment. Marked as Preference because it is a second-order control problem.

  ---

  ## The Impossibility Result

  You suspected a subset of these desiderata is jointly unsatisfiable. You are correct. The following four constraints form an **Incompatibility Tetrad**:

  1.  **Passive Identification:** Predict the Redeployment Gap using only historical passive data ($P(Y, X)$).
  2.  **Agnosticism:** Make no untestable assumptions about the residual (the part of $Y$ not captured by $X$) off the observed support.
  3.  **Ontological Openness:** Remain informative for Construct-Deficient Targets (where $Y$ is not fixed).
  4.  **Adversarial Robustness:** Hold up against an optimiser that models the metric (Hijack).

  **The Conflict:**
  *   To satisfy **(1) Passive Identification**, you rely on statistical regularities in the historical data.
  *   To satisfy **(4) Adversarial Robustness**, you must model how an agent changes the data generating process when $X$ becomes a target. This requires a model of the agent's utility function and capabilities.
  *   **Contradiction:** An agent's response function is *not* contained in passive historical data where the agent was not optimizing $X$. Therefore, you cannot satisfy (1) and (4) simultaneously without violating (2). You *must* make untestable assumptions about how the agent will respond (e.g., "agents minimize cost," "agents exploit the cheapest margin").
  *   **Compounding Error:** If you satisfy **(3) Ontological Openness**, you admit $Y$ is not fixed. If $Y$ is not fixed, there is no stable "Gap" to measure. The target moves as the metric pushes. This makes (1) logically incoherent. You cannot predict the gap between observation and incentive if the incentive *defines* the target.

  **The Trade-Off Menu:**
  You must drop one leg of the tetrad to have a working theory.

  *   **Option A (The Causal Route):** Drop **(2) Agnosticism**. Accept that you must assume a causal graph and agent utility function. You can predict the gap, but your predictions are only as good as your untestable structural assumptions. *Best for Hard Targets.*
  *   **Option B (The Experimental Route):** Drop **(1) Passive Identification**. Admit you cannot predict the gap from history. You must run small-scale pilots (randomized control trials of the incentive) to measure the gap before full deployment. *Best for High-Stakes.*
  *   **Option C (The Constructivist Route):** Drop **(3) Ontological Openness**. Admit the theory only works where $Y$ is well-defined (e.g., mortality rates, not "research quality"). For construct-deficient targets, you abandon prediction and rely on governance. *Best for Soft Targets.*
  *   **Option D (The Robustness Route):** Drop **(4) Adversarial Robustness**. Assume agents are bounded rational or slow to adapt. This works for low-pressure incentives but fails catastrophically against sophisticated gaming. *Best for Low-Stakes.*

  ---

  ## The Single Exclusionary Requirement

  The requirement that does the most work in excluding candidate accounts is:
  **"Predict the redeployment gap... without assuming anything untestable about how the residual... behaves off the observed support."**

  This is the **Lucas Critique** applied to metric design. It excludes any purely statistical or machine-learning account. It forces the theory to be structural/causal. If a theory claims to predict Goodhart's Law using only regression coefficients on historical data, it is mathematically invalid. This requirement kills 80% of existing frameworks immediately.

  ---

  ## Scoring of Account Families

  | Account Family | Passive ID (No Assumptions) | Agnosticism (No Untestable Priors) | Ontological Openness | Adversarial Robustness | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :--- |
  | **Noise Selection** (Failure as measurement error) | **Pass** | **Pass** | Fail | Fail | **Rejected.** Treats failure as static noise, ignores agent adaptation. |
  | **Invariance** (Causal structure must hold under intervention) | Fail | Fail | **Pass** | **Pass** | **Viable (Option A).** Requires causal assumptions, but handles intervention correctly. |
  | **Low-Dim Projection** (Optimizing a slice of high-dim target) | Fail | **Pass** | **Pass** | Partial | **Viable (Option C).** Good for construct-deficient, but cannot predict gap magnitude without priors. |
  | **Effort Substitution** (Multi-task Principal-Agent) | Fail | Fail | Partial | **Pass** | **Viable (Option A).** Explicitly models agent trade-offs, requires utility assumptions. |
  | **Adversarial** (Game-theoretic minimax) | Fail | Fail | Partial | **Pass** | **Viable (Option B/D).** Assumes worst-case agent, requires experimental validation or strong priors. |

  **Recommendation:** Adopt the **Invariance** or **Effort Substitution** family. They fail the "Passive ID" and "Agnosticism" criteria, but this is a feature, not a bug. They force you to acknowledge that you *must* make structural assumptions about causality and agent behavior. Any theory that promises to predict the Redeployment Gap without those assumptions is selling you a false precision.
