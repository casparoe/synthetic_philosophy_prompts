  1.  **Deconstruct the Prompt:**

      *   **Topic:** The interpretive practice in Nietzsche scholarship of treating his dietary/climatic/physiological concerns as continuous with his philosophy (not just biographical eccentricity).
      *   **Key Question 1:** What philosophical commitments about the relation between bodily regimen and conceptual work does this practice presuppose?
      *   **Key Question 2:** Must it assume reductive materialism (stomach determines ideas), or can it be reconciled with metaphorical reading (digestion as image)?
      *   **Key Question 3:** Reconstruct the implicit theory of philosophy's embodiment.
