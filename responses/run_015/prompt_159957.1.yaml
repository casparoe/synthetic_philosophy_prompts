answer: |-
  An adequate theory of social norms must specify the conditions under which a behavioral regularity generates reasons for compliance and sanctions that persist independent of individual payoff maximization and equilibrium selection.

  ### Desiderata for a Theory of Social Norms

  **1. The Arbitrariness Constraint**
  *   **Motivation:** The escalator-standing case. The content (left vs. right) is arbitrary and varies by city, yet the force (glaring at violators) is non-arbitrary and robust.
  *   **Requirement:** The theory must explain why a specific behavioral pattern is selected over equally efficient alternatives without appealing to intrinsic superiority of the action.
  *   **Status:** Non-negotiable. Any account that ties the norm to the optimal solution fails to distinguish norms from technical constraints.

  **2. The Transparency Constraint**
  *   **Motivation:** The phantom norm case. Compliance persists despite private rejection until public knowledge shifts, causing sudden collapse.
  *   **Requirement:** The theory must distinguish between *compliance* (behavior), *acceptance* (attitude), and *common knowledge* (informational state), and explain how stability is maintained under pluralistic ignorance and lost upon its dissolution.
  *   **Status:** Non-negotiable. A theory that conflates compliance with acceptance cannot explain sudden normative collapse.

  **3. The Sanction Constraint**
  *   **Motivation:** The undetectable violation case. People refrain from violations even when detection is impossible, and third parties punish violations even when they incur a cost and receive no direct benefit.
  *   **Requirement:** The theory must explain third-party enforcement where the enforcer gains no strategic advantage and the violator suffers no coordination failure, distinguishing this from conventions where deviation is self-punishing (e.g., driving on the wrong side).
  *   **Status:** Demand of the normativist camp; reductionists often attempt to explain this away via indirect reciprocity or signaling, but an adequate theory must handle the *proximate* motivation, not just the ultimate evolution.

  **4. The Scope Constraint**
  *   **Motivation:** The boundary problem. Newcomers are bound immediately; outsiders violating the rule annoy us more than insiders doing so.
  *   **Requirement:** The theory must define the population to whom the norm applies and explain the differential reactive attitudes toward insiders (betrayal) versus outsiders (conflict) and newcomers (obligation).
  *   **Status:** Non-negotiable. Norms are inherently group-relative; a theory that applies norms universally or individually fails to capture the social structure.

  **5. The Evolutionary Constraint**
  *   **Motivation:** Empirical consistency. Large between-society variation, transmission biases (copying successful/common variants), and norms dying within a single cohort.
  *   **Requirement:** The theory must be consistent with cultural evolution dynamics, allowing for rapid change and variation without requiring genetic change or universal rationality.
  *   **Status:** Non-negotiable. A theory incompatible with empirical data on transmission and variation is metaphysically interesting but scientifically inert.

  **6. The Irreducibility Constraint**
  *   **Motivation:** The ontological question. Does a norm exist if no one accepts it but everyone complies?
  *   **Requirement:** The theory must specify existence conditions that do not collapse normativity into mere regularity (everyone does X) or mere preference (everyone wants X).
  *   **Status:** Demand of the normativist camp. Reductionists reject this, arguing norms *are* just complexes of expectations and preferences; satisfying this requirement is the only way to prove your housemate wrong.

  ### Tensions and Prejudices

  **The Fundamental Tension**
  There is a direct conflict between **The Evolutionary Constraint** and **The Irreducibility Constraint**. Cultural evolution models often explain norms via payoff biases (successful variants are copied) or punishment equilibria (norms stabilize because deviators are punished). If the transmission and stability of the norm are fully explained by payoff maximization and equilibrium selection, the normativity reduces to preference and expectation. To satisfy Irreducibility, you must posit a reason for action that exists *outside* the payoff structure, but this makes it difficult to satisfy the Evolutionary Constraint without invoking mysterious transmission mechanisms that ignore fitness or utility. You cannot fully satisfy both without positing a form of collective intentionality that is causally efficacious but not reducible to individual psychological states.

  **Your Prejudice**
  Your list assumes that "normativity doing explanatory work" is a coherent possibility that a theory *should* capture. This biases the desiderata against reductionism by fiat. Specifically, **The Irreducibility Constraint** presupposes that there is something to be reduced *other than* the regularity itself. If your housemate is right, this requirement is impossible to meet not because the theory is inadequate, but because the phenomenon (irreducible normativity) does not exist. You are building a test that assumes the existence of the very thing you are trying to prove.

  **The Most Exclusionary Requirement**
  **The Sanction Constraint** does the most work in excluding otherwise attractive theories. Lewis-style conventions fail here completely because deviations are self-punishing (coordination failure). Pure preference accounts fail because third-party punishment is costly with no direct return. Only theories that incorporate normative expectations or group-level selection can pass this hurdle.

  ### Theory Scoring

  | Requirement | Lewis-Style Convention | Social-Expectations (e.g., Bicchieri) | Cultural-Evolution-plus-Punishment (e.g., Boyd/Richerson) |
  | :--- | :--- | :--- | :--- |
  | **1. Arbitrariness** | **Pass** (Core feature) | **Pass** (Conditional on expectations) | **Pass** (Path dependence) |
  | **2. Transparency** | **Fail** (Assumes common knowledge) | **Pass** (Distinguishes empirical/normative expectations) | **Partial** (Focuses on behavior, less on cognitive state) |
  | **3. Sanction** | **Fail** (No third-party enforcement) | **Pass** (Normative expectation triggers sanction) | **Pass** (Altruistic punishment modeled) |
  | **4. Scope** | **Partial** (Defined by coordination group) | **Pass** (Defined by reference network) | **Pass** (Defined by group selection boundaries) |
  | **5. Evolutionary** | **Partial** (Static equilibrium focus) | **Partial** (Psychological focus) | **Pass** (Core design feature) |
  | **6. Irreducibility** | **Fail** (Reduces to preference/expectation) | **Partial** (Reduces to conditional preference) | **Fail** (Reduces to fitness/payoff stability) |

  **Verdict:** None of the standard accounts fully satisfy **The Irreducibility Constraint** while maintaining **The Evolutionary Constraint**. The Social-Expectations account comes closest to your goal but risks collapsing normativity into a specific type of empirical expectation about sanctions.
