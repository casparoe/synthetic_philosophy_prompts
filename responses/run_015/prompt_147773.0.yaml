prompt: |-
  I'm on the ethics panel for our state's hospice oversight board. There's this proposal from Meridian Hospice to allow voluntary cessasion of nutrition for patients with advanced dementia if they left an advance directive citing that death is not a harm to them — basically an Epicurean framing they want built into the consent framework. The disability rights coalition filed a brief saying we're treating dementia patients as if their future lives have no value, and that using Epicurus here is a philosphical sleight of hand because the patients aren't the ones reasoning, it's the families projecting. Half the panel thinks this is just honoring autonomy with an explicit philosphical basis; the other half thinks it's importing a contested metaphysics into medical policy. I need a short memo for Thursday's vote: recommend approve, reject, or approve with conditions. It should actually engage the Epicurean point — not just say death is bad, period — and deal seriously with the disability coalition's worry that the asymmetry argument gets misapplied when the subject can't currently affirm it. Also need a concrete timeframe if we go with conditions. Don't cite bibliographies, just reason it through. There's probably a typo in my notes but you get the idea.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the state's hospice oversight board ethics panel.
      *   **Task:** Write a short memo for Thursday's vote.
      *   **Recommendation:** Approve, Reject, or Approve with Conditions.
      *   **Subject:** Meridian Hospice proposal to allow voluntary cessation of nutrition and hydration (VCNH) for advanced dementia patients based on an advance directive (AD) citing an Epicurean framing ("death is not a harm").
      *   **Key Conflict:**
          *   *Pro:* Honoring autonomy via explicit philosophical basis.
          *   *Con (Disability Rights Coalition):* Devaluing disabled lives, philosophical sleight of hand (patients aren't reasoning, families are projecting), misapplication of the asymmetry argument.
      *   **Requirements:**
          *   Engage seriously with the Epicurean point (not just "death is bad").
          *   Address the disability coalition's worry about the asymmetry argument when the subject can't affirm it.
          *   Include a concrete timeframe if recommending conditions.
          *   No bibliographies/citations.
          *   Tone: Professional, ethical, reasoned, decisive.

  2.  **Deconstruct the Ethical & Philosophical Issues:**
      *   **The Epicurean Claim:** Epicurus argued death is nothing to us because when we are, death is not, and when death is, we are not. Therefore, death is not a harm *to the subject*. Meridian wants to use this to justify VCNH based on a prior directive.
      *   **The Problem:** Advance directives in dementia are notoriously tricky (the "then-self" vs. "now-self" problem). The disability rights argument is that the *current* patient might be content, but the *prior* self's philosophical stance is being used to end a life that currently has value to the living person.
      *   **The Asymmetry Argument:** Usually refers to Benatar or similar (coming into existence is harm, ceasing to exist is not). Here, it's being used to say "dying isn't bad." The coalition argues this is projection. If the patient can't reason "death is no harm," applying this logic *to* them is paternalistic/dismissive.
      *   **Medical Ethics Principles:** Autonomy (ADs), Beneficence/Non-maleficence (do no harm, relieve suffering), Justice (disability rights, slippery slope).

  3.  **Evaluate the Options:**
      *   *Approve:* Too risky. Ignores the valid concern about the "now-self" vs. "then-self" conflict and the potential for devaluing disabled lives. The Epicurean logic holds for the *thinking* subject, but advanced dementia patients often lack the capacity to hold that view *now*.
      *   *Reject:* Safe, but potentially dismissive of genuine autonomy interests. People *do* have strong views on not wanting to live in advanced dementia. A flat rejection ignores the nuance of advance care planning.
      *   *Approve with Conditions:* The middle path. Acknowledges autonomy but builds safeguards against the specific philosophical and practical pitfalls identified by the disability coalition.

  4.  **Drafting the Recommendation (Approve with Conditions):**
      *   *Why:* It respects the prior autonomy (the AD) but acknowledges the epistemic gap (the patient can't confirm the view now).
      *   *Engaging Epicurus:* We need to admit that Epicurus is right *for the person who holds the view*, but wrong if imposed *on a person who cannot hold it.* The harm isn't death itself (per Epicurus), but the violation of the current self's potential interests or the societal message that disabled lives are expendable.
      *   *Addressing the Coalition:* The concern about projection is valid. Families often project "life is not worth living." We need to ensure the AD is specific and not just a general philosophical stance.
      *   *Conditions:* Need a waiting period, a capacity assessment (to see if they show signs of distress vs. contentment), and a review period.

  5.  **Refining the Philosophical Engagement:**
      *   Don't just say "Epicurus is controversial." Say: "The Epicurean claim that death is no harm relies on the subject's capacity to conceive of non-existence. In advanced dementia, that capacity is gone. Applying the *conclusion* of the argument without the *capacity* for the argument turns a philosophical liberty into a medical imposition."
      *   Address the "Asymmetry": The coalition says the asymmetry (birth vs. death) gets misapplied. We need to ensure we aren't saying "their life has no value," but rather "their prior self determined this state violates their dignity."

  6.  **Developing Concrete Conditions:**
      *   *Timeframe:* A waiting period is standard for VCNH. Let's suggest 30 days from request to implementation, with a review at day 15.
      *   *Specificity:* The AD can't just say "Epicurean view." It must specify clinical triggers (e.g., inability to recognize family, total dependence).
      *   *Comfort:* Palliative sedation must be available to ensure the "death is no harm" doesn't become "dying is suffering."

  7.  **Drafting the Memo (Iterative Process):**
      *   *Header:* To, From, Date, Subject.
      *   *Opening:* State recommendation clearly (Approve with Conditions).
      *   *Section 1: The Epicurean Framework.* Acknowledge Meridian's logic but highlight the limitation. The AD represents the *past* self's philosophy. The *current* self cannot validate it.
      *   *Section 2: Disability Rights Concern.* Validate the coalition's point. If we allow this too easily, we signal that dementia lives are "already over." We must distinguish between "death is not a harm" and "this life is not worth living."
      *   *Section 3: Conditions.* Specific safeguards.
          *   Clinical criteria (not just philosophical).
          *   Waiting period (30 days).
          *   Independent advocacy (to check for family projection).
      *   *Conclusion:* Reiterate balance between autonomy and protection.

  8.  **Review against Constraints:**
      *   Short memo? Yes.
      *   Engage Epicurean point? Yes.
      *   Deal with disability coalition worry? Yes.
      *   Concrete timeframe? Yes (30 days).
      *   No citations? Yes.
      *   Tone? Professional/Ethical.

  9.  **Final Polish:** Ensure the distinction between "death is no harm" (metaphysical) and "starvation is suffering" (physical) is clear. Ensure the "projection" worry is met with an independent advocate requirement. (Self-Correction: Make sure the timeframe is specific to the *process*, not just the patient's life expectancy).

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** State Hospice Oversight Board, Ethics Panel
  **FROM:** [Your Name], Ethics Panel Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Meridian Hospice Proposal regarding VCNH and Advance Directives

  **Recommendation:** Approve with Conditions

  **Rationale**

  Meridian Hospice's proposal seeks to align medical practice with a specific philosophical commitment: that for a patient who holds an Epicurean view, death is not a harm, and therefore Voluntary Cessation of Nutrition and Hydration (VCNH) is a neutral act rather than a negative one. While this respects the autonomy of the "past self" who drafted the advance directive (AD), it creates an ethical tension with the "present self" who currently inhabits the body. I recommend approval only if we implement safeguards that address the epistemic gap between these two selves and the disability rights coalition's concerns regarding devaluation.

  **Engaging the Epicurean Claim**
  The Epicurean argument rests on the premise that harm requires a subject to experience it. Since the dead do not exist, they cannot be harmed by death. Meridian argues that if a patient previously endorsed this view, honoring it prevents the harm of prolonging a life they deemed meaningless.

  However, the disability coalition correctly identifies a sleight of hand. The Epicurean conclusion ("death is no harm") is only valid if the subject can rationally assent to the premise. In advanced dementia, the capacity to hold *any* philosophical view—including the Epicurean one—is extinguished. We are not honoring a current philosophical stance; we are enforcing a past metaphysical belief upon a subject who can no longer reason. If we proceed, we must acknowledge we are prioritizing the *precedent autonomy* of the past self over the *experiential interests* of the present self. This is permissible, but only if we are certain the present self is not experiencing goods the past self failed to anticipate.

  **Addressing the Disability Rights Concern**
  The coalition argues that applying the asymmetry argument (that non-existence is preferable to disabled existence) when the subject cannot affirm it risks treating dementia lives as inherently valueless. This is a valid warning against projection. Families, grieving the loss of the person they knew, may project their own suffering onto the patient, interpreting "death is not a harm" as "this life is a burden."

  To mitigate this, we cannot allow the Epicurean framing to serve as a standalone justification. The AD must not merely cite a philosophical preference for non-existence; it must link that preference to specific clinical loss-of-self markers (e.g., inability to recognize loved ones, loss of verbal communication). This ensures we are not acting on a general devaluation of disability, but on a specific threshold of identity loss defined by the patient.

  **Required Conditions**

  To balance autonomy with protection against projection and devaluation, the following conditions must be met:

  1.  **Specificity of Directive:** The AD must explicitly link the philosophical stance to concrete clinical stages of dementia. General statements preferring death over disability are insufficient.
  2.  **Independent Advocacy:** Before VCNH initiation, an independent patient advocate (unaffiliated with the family or facility) must interview the patient to assess for signs of distress vs. contentment. If the patient demonstrates consistent capacity for joy or connection, the process pauses.
  3.  **Mandatory Waiting Period:** A **30-day review period** is required from the time the request is formally triggered to the initiation of VCNH.
      *   *Days 1-15:* Clinical assessment and independent advocacy review.
      *   *Days 16-30:* A "cooling off" period where nutrition continues while palliative support is intensified. This allows the family and care team to ensure the decision is not a reaction to transient suffering or inadequate support.
  4.  **Palliative Assurance:** The protocol must guarantee palliative sedation is available to ensure the physiological process of starvation does not become a harm, aligning the physical reality with the philosophical intent of "no harm."

  **Conclusion**
  We can honor the Epicurean framing without accepting the claim that these lives lack value. By enforcing a 30-day window and requiring clinical specificity, we ensure that we are respecting a considered refusal of prolonged dying, rather than facilitating a judgment that a disabled life is not worth living.

  **Vote:** Approve with Conditions.
