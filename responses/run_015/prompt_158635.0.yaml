answer: |-
  This is a fantastic question because it cuts right to the heart of the Benacerraf dilemma: how do we reconcile the *objectivity* of mathematics with our *access* to it? You've identified the exact pressure points where both Platonism and Nominalism tend to creak.

  Here is how each camp typically navigates the tension between error/disagreement and their metaphysical commitments, and where they risk "secretly borrowing" from the other.

  ### 1. The Platonist: Error as Misdescription, Not Convention
  If you are a Platonist (Mathematical Realist), you believe mathematical objects exist independently of human thought. This creates an immediate epistemological problem: if sets are causally isolated, how do we know when we've got them wrong?

  **The Explanation of Error:**
  A consistent Platonist must say that **yes, there was always a fact of the matter.** When Frege or Cantor worked with Naive Set Theory, they were making false claims about the actual universe of sets. The Russell Paradox didn't "create" a contradiction; it *revealed* that the description "the set of all sets that do not contain themselves" failed to refer to any existing object.

  Moving from Naive Set Theory to ZFC isn't changing the rules of a game (convention); it is **correcting a map.**
  *   **Analogy:** Think of physics. When Newtonian physics was superseded by General Relativity, we didn't say gravity was "invented." We said our *model* of gravity was incomplete. Platonists treat axioms like physical laws: they are hypotheses about the structure of a independent realm.
  *   **Fallibilism:** Platonism allows for fallibilism. We access abstract objects via "mathematical intuition" (Gödel's term). Just as sensory perception can be illusory, mathematical intuition can be mistaken. Revision shows our cognitive access is imperfect, not that the objects are mutable.

  **The Risk of Borrowing:**
  The Platonist risks sliding into conventionalism when dealing with **independence results** (like the Continuum Hypothesis). If ZFC cannot decide whether CH is true or false, the Platonist has a hard time explaining *which* reality is the "real" one without sounding like they are just preferring one formal system over another.
  *   *The Fix:* Some modern Platonists (like Penelope Maddy or proponents of Set-Theoretic Multiverse realism) argue that the "platonic realm" is rich enough to contain models where CH is true and models where it is false. But hardline Platonists (like Gödel) insisted CH *is* either true or false, and we just haven't found the right axiom yet. If they can't explain *how* we find that axiom without appealing to pragmatic utility, they start sounding like Nominalists.

  ### 2. The Nominalist/Fictionalist: Disagreement as Pragmatics, Not Truth
  If you are a Nominalist (or Fictionalist), you believe mathematical objects are human constructs, linguistic conventions, or useful fictions. This creates a sociological problem: why do mathematicians feel *compelled* to accept certain axioms? Why isn't it all arbitrary?

  **The Explanation of Disagreement:**
  For the Nominalist, debates over the Axiom of Choice (AC) or Large Cardinals are not about "truth" but about **fruitfulness and coherence.**
  *   **Normative Pressure:** The "pressure" you sense isn't coming from abstract objects; it's coming from the **goals of the practice.** If your goal is to do analysis, you need the Completeness Theorem, which requires Weak König's Lemma. If your goal is to avoid paradox, you need Restricted Comprehension.
  *   **Objectivity without Objects:** The Nominalist argues for *inter-subjective* objectivity. Once we agree on the rules of the "game" (e.g., we want a foundation for standard calculus), certain moves become mandatory. Disagreeing about AC isn't like disagreeing about the color of the sky; it's like disagreeing about whether a Queen should move diagonally in Chess. *However*, if you want the game to have certain strategic depths (modeling physical reality), you are pressured to allow the Queen to move that way.

  **The Risk of Borrowing:**
  The Nominalist risks sliding into Realism when explaining **indispensability.**
  *   *The Fix:* A sophisticated Nominalist (like Hartry Field) argues we can reformulate science without math. But most admit math is indispensable. If a Nominalist says, "We *must* accept Large Cardinals because they resolve structural issues in determinacy," they risk implying that the structural issues are *real* constraints imposed by reality, not just internal aesthetic preferences. If the "utility" is not just "it helps us calculate" but "it reveals deep connections we couldn't have anticipated," that starts sounding like discovery.

  ### 3. The Tension: Who is Borrowing More?
  You asked how each accounts for error/disagreement without borrowing from the other. Here is the stalemate:

  **The Platonist's Borrowing (The Coherence Trap):**
  To explain how we access causally isolated objects, Platonists often rely on the **coherence** of our theories. "We know ZFC is closer to the truth than Naive Set Theory because ZFC is consistent and fruitful."
  *   *The Critique:* But consistency and fruitfulness are pragmatic virtues, not truth conditions. If your criterion for "matching reality" is "doesn't crash and is useful," you are defining truth as idealized justification. That is a covert form of anti-realism.

  **The Nominalist's Borrowing (The Constraint Trap):**
  To explain why we can't just choose *any* axioms, Nominalists often rely on **constraints.** "We can't choose Naive Comprehension because it leads to contradiction."
  *   *The Critique:* But where do these constraints live? If logical consistency is a hard wall we bump into, that wall looks suspiciously like a mind-independent fact. If the "fiction" writes itself, in what sense is it fictional? The Nominalist must explain why the "fiction" resists our will without positing a reality that resists us.

  ### Summary
  *   **Platonism** handles error well (we were wrong about the objects) but struggles with access (how do we know?). It risks turning "truth" into "ideal coherence."
  *   **Nominalism** handles access well (we invented the rules) but struggles with normativity (why these rules?). It risks turning "convention" into "discovery of constraints."

  **The Verdict?**
  Many philosophers of math now suspect the dichotomy is the problem.
  *   **Structuralists** argue we aren't discovering objects *or* inventing fictions, but mapping structures that could exist in any coherent system.
  *   **Quine-Putnam Indispensability** argues we should be Platonists because our best scientific theories quantify over numbers, and we should be realists about the entities in our best theories.

  But to answer your specific worry: **Yes, both sides borrow.** The Platonist borrows pragmatic criteria to verify truth, and the Nominalist borrows objective constraints to explain convention. The debate usually ends up not being about whether math is "real," but about which kind of borrowing is more philosophically costly.

  In your seminar argument, the Platonist wins on the *phenomenology* of math (it feels like discovery), while the Nominalist wins on the *metaphysics* (how do we touch abstract objects?). Neither can fully explain mathematical error without appealing to the other's strengths.
