  hey so i'm finalizing the exam for my phil of logic seminar—mostly third year undergrads with a couple logic grad students sitting in. we covered standard modal epistemic logic, hintikka-style knowledge operators, and then two weeks on logical omniscience, but i feel like the usual essay prompts just let students regurgitate "ideal agents should know all logical consequences" and then name-drop impossible worlds. i want something that actually seperates people who get the conceptual structure from people who memorized the summary.

  please act like an experienced exam setter and philosophy tutor—someone who knows exactly where students confuse processing limits with logical ignorance. think step by step: first do a quick brainstorm of the crux—what's the hard conceptual distinction that should drive the whole question?—then write one 45-minute essay question (30 marks out of 60) together with a model answer and a detailed marking scheme. the prompt should inject a somewhat niche framing: introduce a hypothetical agent, call her Agent C, who operates with a "cost-sensitive closure rule." she automatically believes all direct logical consequences of her beliefs up to complexity level n, but beyond that she only derives further consequences if they are needed to resolve an explicit practical contradiction. ask students whether Agent C genuinely avoids logical omniscience, and more specifcally whether her failure to believe a distant logical consequence counts as a failure of rationality or merely a resource limitation. the model answer needs to take a committed, definite line—don't just survey "some philosophers say X, others say Y" and leave it hanging. commit to one interpretation (for example, that Agent C is rationally non-omniscient only if we sharply distinguish syntactic derivability from semantic entailment) and defend it with explicit moves. the marking scheme should name the specific distinctions that earn marks—correctly separating syntactic from semantic closure, recognizing that practical-need triggers don't restore full rationality, seeing omniscience as an idealization about logical consequence relations rather than about processing speed—and the specific mistakes that should cost marks, like conflating computational limits with logical ignorance, treating efficiency as full rationality, or assuming any bounded agent automatically solves the problem. keep everything self-contained: no citation requests, no reading lists, no "refer to Hintikka 1962" type instructions. make it hard enough that a textbook summary alone won't get full marks, but don't rely on ultra-obscure formalisms that a small LLM wouldn't have properly memorized. start with that brief brainstorm, then deliver the exam item.
