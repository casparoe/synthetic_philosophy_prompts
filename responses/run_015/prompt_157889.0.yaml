answer: |-
  ### Brainstorm: The Crux of the Matter

  The core conceptual trap students fall into is conflating **computational boundedness** with **logical non-omniscience**. 

  *   **Computational Boundedness:** "I cannot *derive* $\psi$ from $\phi$ because it takes too many steps or too much memory." This is a psychological or mechanistic limitation.
  *   **Logical Non-Omniscience:** "The relationship between $\phi$ and $\psi$ is not such that believing $\phi$ *normatively commits* me to $\psi$." This is a semantic or structural feature of the logic itself.

  The Logical Omniscience problem in epistemic logic isn't just that humans can't calculate fast enough; it's that standard possible worlds semantics models knowledge as truth in all accessible worlds. If $\phi$ entails $\psi$ in all worlds, the model says the agent knows $\psi$. 

  **The Hard Distinction:** Agent C's "cost-sensitive rule" is a *filter on derivation*, not a change in the *logic of entailment*. If the underlying semantics remain standard possible worlds, Agent C is still logically omniscient in the semantic sense (the consequence holds in all accessible worlds), she just doesn't *process* it. To truly avoid logical omniscience, one must alter the semantic structure (e.g., allow worlds where logical laws fail), not just add a cost function to the agent's processing. The exam question must force students to see that adding "practical need" doesn't change logical consequence; it only changes *belief adoption*. Therefore, Agent C is resource-limited, but logically imperfect.

  ---

  ### Exam Question: Philosophy of Logic Seminar

  **Time Allowed:** 45 Minutes  
  **Marks:** 30 (out of 60 for the full paper)  
  **Instructions:** Answer the following question. Your response should be concise, argumentative, and precise. Avoid general surveys of positions; take a definite stance and defend it.

  **Question:**

  Consider **Agent C**, whose belief set $B$ is governed by a **Cost-Sensitive Closure Rule (CSCR)**:
  1.  For any proposition $\phi \in B$, Agent C automatically believes all logical consequences $\psi$ of $\phi$ where the derivation complexity is $\le n$.
  2.  For consequences where derivation complexity $> n$, Agent C believes $\psi$ only if withholding belief in $\psi$ would lead to an explicit practical contradiction in her current planning context.

  Evaluate the following claim: *"Agent C successfully avoids the problem of logical omniscience, and her failure to believe a distant logical consequence (where complexity $> n$ and no practical contradiction exists) should be classified as a rational permission rather than a failure of rationality."*

  In your essay, you must determine whether Agent C genuinely avoids logical omniscience or merely masks it with processing limits. Specifically, argue whether her failure to believe distant consequences is a defect in her rationality or a mere resource limitation. Commit to a position on whether pragmatic triggers (like practical contradiction) can alter the normative requirements of logical consequence.

  ---

  ### Model Answer

  **Thesis:** Agent C does not avoid logical omniscience in the relevant logical sense; she merely incorporates computational bounds into her belief adoption. Her failure to believe distant consequences is a resource limitation, not a rational permission. Consequently, relative to the standard normative ideal of logic, she remains irrational, though perhaps excusably so.

  **Argument:**

  The problem of logical omniscience arises from the semantic modeling of knowledge, not merely the psychological processing of it. In standard epistemic logic, if an agent knows $\phi$, and $\phi$ entails $\psi$, the agent knows $\psi$ because there is no accessible possible world where $\phi$ is true and $\psi$ is false. Agent C's Cost-Sensitive Closure Rule (CSCR) operates on the *syntactic* level of derivation, not the *semantic* level of entailment.

  By restricting belief adoption to consequences with complexity $\le n$, Agent C breaks the link between *believing* the premises and *believing* the conclusion. However, this does not break the link between the *truth* of the premises and the *truth* of the conclusion. Logical omniscience is a problem about the ideal relationship between belief and truth. If $\psi$ is a logical consequence of $\phi$, then believing $\phi$ while disbelieving $\psi$ is a logical inconsistency, regardless of how many steps it takes to prove it. Agent C's rule allows her to maintain inconsistent beliefs (believing $\phi$, not believing $\psi$, where $\phi \vdash \psi$) simply because the proof is long. This is not a solution to logical omniscience; it is an admission of logical imperfection.

  Furthermore, the "practical contradiction" clause conflates pragmatic utility with logical validity. Whether a consequence is *useful* for planning has no bearing on whether it *follows* from prior beliefs. If rationality is defined as coherence with logical consequence relations, then Agent C is irrational whenever she fails to believe a consequence solely due to complexity costs. The CSCR treats logical consequence as a resource to be spent rather than a norm to be followed. 

  To genuinely avoid logical omniscience, one must alter the underlying semantics—for example, by introducing impossible worlds where logical laws do not hold—so that $\phi$ does not entail $\psi$ in all accessible worlds. Agent C does not do this. She retains standard entailment but limits her access to it. Therefore, her failure to believe distant consequences is a resource limitation. It may be a *justified* resource limitation given human cognitive constraints, but it is not a "rational permission" in the strict logical sense. It is a deviation from the ideal of rationality, not a redefinition of it.

  **Conclusion:** Agent C is computationally bounded, not logically non-omniscient. Her design solves the psychological impossibility of omniscience but leaves the logical normativity intact. Thus, her failure to believe distant consequences is a failure of rationality (inconsistency), excused by resource limits, not a new form of rationality.

  ---

  ### Marking Scheme (30 Marks)

  **Grading Philosophy:**  
  This question tests the student's ability to distinguish between **normative logical ideals** and **descriptive cognitive limits**. High marks are awarded for recognizing that "cost" does not alter "entailment." Low marks are given for conflating computational difficulty with logical independence.

  #### **Band 1: Excellent (25–30 Marks)**
  *   **Core Distinction:** Clearly separates **semantic entailment** (truth preservation across worlds) from **syntactic derivability** (proof steps/cost). Recognizes that Agent C limits derivation, not entailment.
  *   **Critique of CSCR:** Explicitly argues that the "practical contradiction" clause is pragmatic, not logical. It explains *why* we believe, not *what* follows.
  *   **Verdict on Rationality:** Takes a committed stance (agreeing or disagreeing with the Model Answer) that classifies the failure as a **resource limitation** that results in **logical inconsistency** (irrationality), rather than a redefinition of rationality.
  *   **Semantics vs. Psychology:** Recognizes that solving logical omniscience requires changing the semantic model (e.g., impossible worlds/non-normal logic), not just adding cost functions to a standard agent.
  *   **Clarity:** Argument is tight, avoids fence-sitting, and uses terminology precisely.

  #### **Band 2: Good (18–24 Marks)**
  *   **Core Distinction:** Identifies the difference between processing limits and logical truth but may waver on the implications.
  *   **Critique of CSCR:** Notes that practical need doesn't make a consequence true, but might argue that "bounded rationality" is a sufficient solution to the problem.
  *   **Verdict on Rationality:** Classifies the failure correctly as resource-based but may ambiguously label it "rational" without qualifying that it violates logical norms.
  *   **Semantics vs. Psychology:** Understands Agent C is still logically omniscient in the semantic sense but focuses heavily on the psychological plausibility.
  *   **Clarity:** Solid structure, minor imprecisions in terminology.

  #### **Band 3: Pass (12–17 Marks)**
  *   **Core Distinction:** Struggles to separate computation from logic. May argue that because the agent *can't* compute it, she *doesn't* know it, treating this as a full solution to the logical problem.
  *   **Critique of CSCR:** Treats the "practical contradiction" rule as a logical operator rather than a pragmatic filter.
  *   **Verdict on Rationality:** Conflates "excusable" with "rational." Argues Agent C is fully rational simply because she is bounded.
  *   **Semantics vs. Psychology:** Fails to mention that the underlying logic remains standard/omniscient despite the agent's limits.
  *   **Clarity:** Understands the prompt but relies on intuition rather than structural analysis.

  #### **Band 4: Fail (0–11 Marks)**
  *   **Core Distinction:** Completely conflates computational limits with logical ignorance. Assumes that if an agent doesn't believe it, it isn't a logical consequence for them.
  *   **Critique of CSCR:** Treats the prompt as a psychology question rather than a logic question.
  *   **Verdict on Rationality:** Claims Agent C solves logical omniscience without explaining how the semantic relation changes.
  *   **Specific Penalties:**
      *   **Conflation Penalty (-5 marks):** Explicitly stating that "logical consequence depends on computational cost."
      *   **Efficiency Error (-5 marks):** Arguing that because the rule is efficient, it is logically valid.
      *   **Summary Regurgitation (-5 marks):** Simply defining logical omniscience and impossible worlds without applying it to Agent C's specific rules.

  #### **Key Marking Notes for Tutors:**
  *   **Reward:** Students who argue that Agent C is *irrational* (logically inconsistent) but *bounded* (psychologically limited). This shows they understand logic is normative.
  *   **Reward:** Students who argue that to truly solve omniscience, the *logic itself* must change (e.g., non-adjunctive systems), not just the agent's rules.
  *   **Penalize:** Students who claim Agent C is "rational" because "humans can't know everything." This misses the point of the seminar (which is about the *logic* of knowledge, not human psychology).
  *   **Penalize:** Students who treat the "practical contradiction" clause as making the consequence logically valid.
