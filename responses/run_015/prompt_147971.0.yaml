answer: |-
  This is a sharp intuition, and you are essentially reinventing a position in formal epistemology known as **Calibrationism** (championed by philosophers like David Christensen and Adam Elga).

  Your core claim is: *Rationality requires aligning your first-order credence with your estimated reliability.* If you know you're tired, you down-weight your conclusion.

  To answer your question directly: **Philosophers haven't overcomplicated it.** While your "bookkeeping" model works for simple cases (like being tired), it breaks down in the exact scenarios that generate the paradox of epistemic akrasia.

  Here is why treating it as a simple Bayes update on reliability runs into structural walls.

  ### 1. The Self-Undermining Problem (The Regress)
  The biggest hurdle is: **How did you calculate the 0.7 factor?**

  If you are using your reasoning capabilities to assess your reasoning capabilities, you face a self-referential loop.
  *   **Step 1:** You reason that "Politics after 10 PM is unreliable."
  *   **Step 2:** You apply a 0.7 discount to your political beliefs.
  *   **Step 3:** But wait—you formed the belief in Step 1 *after* 10 PM (or using the same cognitive machinery).
  *   **Step 4:** Therefore, the belief "I am 30% less reliable" must *also* be discounted by 0.7.
  *   **Step 5:** If that belief is discounted, your reliability estimate changes, which changes the discount factor...

  This creates an instability. If you fully trust the calibration curve, you are assuming a "God's eye view" of your own reliability that you cannot epistemically occupy. If you don't trust the calibration curve, you can't apply the discount. Philosophers call this the **bootstrapping problem**. You can't use a tool to measure its own brokenness without assuming some part of the tool works perfectly.

  ### 2. Defeaters vs. Discounting
  You suggest multiplying the credence by 0.7. But often, evidence of unreliability acts as a **defeater**, not a dimmer switch.

  Imagine you are solving a math problem. You get answer $X$. Then you find out you were slipped a hallucinogen that makes you unable to process numbers.
  *   **Your Model:** "I am 30% reliable, so I'll keep 30% confidence in $X$."
  *   **Epistemic Reality:** You should have **0% confidence** in $X$.

  When you have strong evidence that your cognitive process is compromised regarding a specific topic, the rational move is often to suspend judgment entirely, not to maintain a lowered credence. The "bookkeeping" fails because the link between the evidence and the conclusion is severed, not just weakened. Akrasia arises when you *can't* let go of the first-order belief (it feels true) even though you know the link is severed.

  ### 3. The "Level-Bridging" Principle
  The reason akrasia feels like a paradox rather than a bookkeeping error is that human rationality seems to require a tight connection between levels of belief.

  *   **First-order:** I believe $P$.
  *   **Higher-order:** I believe that my evidence does *not* support $P$.

  Holding both simultaneously feels like a contradiction. If you truly believe your evidence doesn't support $P$, why are you still allocating *any* credence to $P$?
  Your model says: "Because I'm allocating *less* credence."
  The counter-argument is: "If you know the mechanism is broken, allocating *any* credence based on that mechanism is irrational."

  This is why some philosophers (like Maria Lasonen-Aarnio) argue that sometimes you should stick to your guns (the first-order belief) even if your higher-order assessment says you're wrong, because the higher-order assessment might be the thing that's mistaken. This creates a genuine dilemma, not a math error.

  ### 4. The Cost of Meta-Cognition
  You asked if there is a "hidden cost" to always running the calibration correction. Yes: **Computational and Cognitive Load.**

  To apply your 0.7 discount, you need to maintain a running model of your own reliability across different contexts (time of day, emotional state, topic complexity).
  *   **Calibration of the Calibration:** How do you know the 0.7 is correct? Maybe you're overconfident in your self-assessment. Now you need a calibration curve for your calibration curve.
  *   **Paralysis:** If you constantly second-guess every belief by checking your meta-reliability, you lose the ability to act. Rationality is partly about knowing when to *stop* querying your own reliability and just trust the output.

  ### 5. Akrasia is Often Synchronic, Not Diachronic
  Your example is diachronic (10 PM me vs. 11 PM me). This is easier to solve. 9 PM me can pre-commit to ignoring 11 PM me.

  The hard paradox of akrasia is **synchronic**: *Right now*, I believe $P$, and *right now*, I believe that believing $P$ is irrational.
  *   Example: "I know the optical illusion makes the lines look different lengths, so I believe they are equal. But they still *look* unequal, and I can't shake the perceptual credence."
  *   In this case, you cannot simply "update." The raw perceptual data is still feeding into your system. The conflict is architectural, not arithmetic. You cannot Bayes away a visual illusion just by knowing it's an illusion.

  ### Summary
  You haven't made a mistake; you've adopted a **Calibrationist** stance. It is a robust and popular view in modern epistemology. However, philosophers treat akrasia as a paradox because:

  1.  **Self-Reference:** You can't reliably calibrate the instrument using the instrument itself without circularity.
  2.  **Defeat:** Evidence of unreliability often wipes out belief rather than discounting it.
  3.  **Rational Requirements:** There is a normative tension between believing $P$ and believing you shouldn't believe $P$ that isn't resolved just by lowering the probability number.

  It's not a bookkeeping error; it's the friction caused by a system trying to model itself. If it were just bookkeeping, we could solve it with a spreadsheet. Instead, we need a theory of how a mind can be divided against itself.

  **The Rational Move:**
  Your intuition is practically useful (trust sober-you more than drunk-you), but theoretically incomplete. The "rational move" isn't *always* applying the discount factor; sometimes it's recognizing that the question cannot be answered by the current cognitive state, and suspending judgment entirely. That suspension is the true resolution to the akrasia, not a adjusted number.
