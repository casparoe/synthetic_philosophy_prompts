  **INSTITUTE FOR NOMOTHETIC HISTORY**
  **INTERNAL MEMORANDUM 74-B**
  **TO:** All Grant Applicants
  **FROM:** Office of Legislative Certification
  **SUBJECT:** Instructions to Applicants (Quinquennial Law Submission Round)

  **1.0 Classification of Submissions**
  Applicants must distinguish between observed trends and unconditional historical laws. Trends describe past directions; Laws dictate future necessities. Only Laws are eligible for Grant Category 1. Applicants noting that their submission relies on specific initial conditions must attach Schedule A (Conditions of Validity). Please note: while the Charter defines a Law with attached Conditions as a conditional technological forecast, Budgeting Code 99 allows such forecasts to be processed as "Latent Laws" for funding purposes. Do not mark "Conditional" on the cover sheet. Select "Universal" from the dropdown menu. If the dropdown menu does not contain "Universal," select "Universal (Provisional)."

  **2.0 Specification of Initial Conditions**
  To certify a Law, the complete present state of society must be described to establish the baseline from which the law operates. As Field 4 (Initial Conditions) allows only 500 characters, applicants describing the whole of society should utilize Temporal Segmentation. Applicants may chop one unique historical sequence into three distinct "Epochs" to satisfy the requirement for three instances of verification. Ensure Epochs are non-overlapping. For example, a single century of industrial expansion may be segmented into "Early," "Middle," and "Late" Industrial Epochs to generate the necessary sample size. Do not acknowledge that these segments belong to the same singular trend.

  **3.0 Prediction of Knowledge**
  Laws may not predict the future content of scientific knowledge, as this constitutes a logical paradox regarding the growth of information. However, applicants may invoke the "Unspecified Epistemic Variable" loophole, provided the variable is listed as "Pending Discovery" in Schedule B. This preserves the unpredictability of knowledge while maintaining the predictability of the social outcome. Applicants are reminded that while we cannot know what will be known, we can certify that the social impact of such knowledge will conform to the submitted Law.

  **4.0 Reflexivity and Class-O Filings**
  If the publication of the Law is likely to alter the event it predicts (e.g., by causing panic, preventive action, or self-fulfilling speculation), the submission must be filed under Class-O (Observer-Dependent). Class-O Laws cannot be published prior to the event date. Instead, they must be submitted to the Retrospective Supplement. This ensures the Law remains valid by only becoming public once the predicted event has rendered intervention impossible. The Institute celebrates its highest success rate in Class-O filings. We remind applicants that a Law published in the Retrospective Supplement retains full prophetic authority, as the event has occurred exactly as the sealed document stated. This verifies the Law without risking falsification.

  **5.0 Human Remodelling (Schedule H)**
  All certified Laws regarding inevitable social structures must include Schedule H (Human Remodelling Plan). If the inevitable future society requires capacities currently absent in the population, the Institute funds training programs to acquire these capacities. This ensures the population is fit for the inevitability. Failure to submit Schedule H implies the Law is not truly inevitable, which is grounds for rejection. Applicants should not view this as conceding that the society was not inevitable; rather, it is an administrative alignment of human capital with historical necessity.

  **6.0 Inter-Departmental Consultations**
  Applicants drawing on biological analogies must consult the Biology Liaison Office. Note that recent memoranda regarding expectation-driven effects in molecular biology are currently under review. Until further notice, refer any such queries to Inter-Departmental Memorandum 88-C. Please be advised that Memorandum 88-C is currently misplaced and no hard copies exist. Proceed with submission without biological clearance if delay exceeds thirty days.

  **7.0 Final Certification**
  The Institute prioritizes Laws that maximize certification security. Applicants are encouraged to aim for the Retrospective Supplement track, as this guarantees 100% accuracy upon release.

  ***

  **APPENDIX: SAMPLE APPLICATION FORM (EXCERPT)**

  **Applicant:** Dr. Aris Thorne
  **Proposed Law:** The Law of Administrative Consolidation.
  **Description:** All societies inevitably develop bureaucratic structures proportional to their size.
  **Initial Conditions:** [See Schedule A: Assumes existence of paper, ink, and hierarchy.]
  **Epochs Submitted:** 1. Feudal 2. Mercantile 3. Industrial (See Clause 2.0)

  | **REVIEWER COMMENTS** |
  | :--- |
  | **Reviewer 1:** This is a trend, not a law. It relies on the condition that people want organization. <br> **Action:** Reclassified as "Latent Law" per Budget Code 99. |
  | **Reviewer 2:** Field 4 exceeds character limit. Applicant has summarized "Whole Society" as "Everyone." <br> **Action:** Approved under Temporal Segmentation waiver. |
  | **Biology Liaison:** Why are we ignoring the observer effect? We see this in protein folding assays. Expectation drives the outcome. This isn't specific to history. <br> **Institute Response:** Refer to Memo 88-C. (See Clause 6.0). |
  | **Senior Certifier:** Publication would cause societies to resist bureaucracy, falsifying the Law. <br> **Action:** File Class-O. Seal until 2090. Publish in Retrospective Supplement. **CERTIFIED.** |
