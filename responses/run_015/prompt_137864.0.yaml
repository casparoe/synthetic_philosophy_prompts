      *   *Fatal:* Psychological evidence shows rehearsing outward behavior *without* intent leads to hypocrisy/social friction long-term (the "uncanny valley" of morality), undermining the "lower social friction" goal.
      *   *Awkward:* Franklin admits he never achieved "Order" but found himself happier anyway. This suggests the process mattered more than the output, complicating the engineering efficiency model.
