  | Party | Seats | Pref | Red | Blue | Green | SQ | Exposure (Election) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Alpha** | 5 | Blue | 0 | 10 | 4 | 5 | **-5** |
  | **Delta** | 5 | Blue | 0 | 10 | 4 | 5 | **-5** |
  | **Beta** | 5 | Green | 4 | 0 | 10 | 5 | **+5** |
  | **Epsilon** | 4 | Green | 4 | 0 | 10 | 5 | **+5** |
  | **Gamma** | 5 | Red | 10 | 4 | 0 | 5 | **0** |
  | **Total** | **24** | | | | | | |

  *   **Anti-Red Coalition:** 19 Seats (Alpha, Delta, Beta, Epsilon).
  *   **Pro-Red Coalition:** 5 Seats (Gamma).
  *   **Election Coalition:** 9 Seats (Beta, Epsilon).
  *   **Anti-Election Coalition:** 10 Seats (Alpha, Delta).

  *   **Regime A:** Anti-Red needs 13 to fire. Anti-Election (10) blocks them. **Red Wins.**
  *   **Regime B:** Anti-Red needs 16 to override. They have 19. **SQ Wins.**
  *   **Regime C:** Anti-Red needs 13 to fire. Cost is 0. They have 19. **Blue Wins.**

  *   **Assembly Satisfaction:** C (High) > B (Medium) > A (Low).
  *   **Student Prediction:** C (High) > A (Medium) > B (Low).
  *   **Contradiction:** A is worse for the Assembly than B.
