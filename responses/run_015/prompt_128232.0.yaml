answer: |-
  # Simulation Design: The Cost of Falling

  ## 1. Core Concept & Learning Objective
  This simulation isolates two variables often conflated in the "Presidential vs. Parliamentary" dichotomy:
  1.  **Origin:** Is the executive chosen by the assembly or separately?
  2.  **Survival:** Does the executive's fall trigger an assembly election (Mutual Destruction) or not?

  Students typically assume Assembly Power scales with dismissal rights (Regime B < A < C). This design creates a scenario where **Regime A (Mutual Destruction) yields *less* effective Assembly power than Regime B (Fixed Term)** because the cost of dissolution paralyzes the assembly more than a procedural supermajority threshold does.

  ## 2. Materials & Setup (No Budget)
  *   **Room:** Chairs arranged in 5 clusters (Parties) + 1 desk (Executive).
  *   **Printed Cards (24 sets):**
      *   **Party Identity Card:** Party Name, Seat Count, Policy Preferences.
      *   **Electoral Exposure Card:** (Private) Points gained/lost if an Election is triggered.
      *   **Regime Rule Card:** (Distributed per round) Rules for A, B, or C.
      *   **Score Sheet:** To track points per round.
  *   **Board:** To track Policy Proposals, Vote Counts, and Final Outcomes.

  ## 3. The Numbers (Fixed Across Rounds)

  **The Assembly (24 Seats total, Majority = 13, Supermajority = 16)**
  *   **Party Alpha (5 Seats):** Prefers **Blue** (10 pts). Red (0 pts). Green (4 pts). Status Quo (5 pts).
  *   **Party Delta (5 Seats):** Prefers **Blue** (10 pts). Red (0 pts). Green (4 pts). Status Quo (5 pts).
  *   **Party Beta (5 Seats):** Prefers **Green** (10 pts). Red (4 pts). Blue (0 pts). Status Quo (5 pts).
  *   **Party Epsilon (4 Seats):** Prefers **Green** (10 pts). Red (4 pts). Blue (0 pts). Status Quo (5 pts).
  *   **Party Gamma (5 Seats):** Prefers **Red** (10 pts). Blue (4 pts). Green (0 pts). Status Quo (5 pts).
      *   *Note:* One student from Gamma is designated **The Executive**.

  **The Executive (1 Student from Gamma)**
  *   **Preference:** **Red** (10 pts). Blue (4 pts). Green (0 pts).
  *   **Goal:** Maximize personal + party points.

  **Electoral Exposure (Private Handout)**
  *   **Alpha & Delta:** **-5 Points** (If an Election occurs, you lose seats/funding).
  *   **Beta & Epsilon:** **+5 Points** (If an Election occurs, you gain seats/funding).
  *   **Gamma:** **0 Points** (Neutral).

  **The Caretaker (Regime C Only)**
  *   **Public Knowledge:** If the Executive is dismissed in Regime C, the Caretaker automatically implements **Blue**.

  ---

  ## 4. The Three Regimes

  ### Regime A: "Mutual Destruction"
  *   **Origin:** Executive is confirmed by Assembly (Assume confirmed at start).
  *   **Proposal:** Executive proposes one policy (Red, Blue, or Green).
  *   **Passing:** Simple Majority (13 seats) accepts proposal.
  *   **Dismissal:** Assembly may dismiss Executive by Simple Majority (13 seats).
  *   **Consequence of Dismissal:** **Immediate Election.** Round ends. Payoffs = Electoral Exposure figures. No policy is passed.

  ### Regime B: "Fixed Term"
  *   **Origin:** Executive is separately chosen (Fixed).
  *   **Proposal:** Executive proposes one policy.
  *   **Passing:** Policy passes automatically **UNLESS** Assembly overrides.
  *   **Override:** Requires **Supermajority (16 seats)**.
  *   **Consequence of Override:** Policy fails. **Status Quo (5 pts)** applies. Executive remains in power. No Election.

  ### Regime C: "Safe Dismissal"
  *   **Origin:** Executive is separately chosen (Fixed).
  *   **Proposal:** Executive proposes one policy.
  *   **Passing:** Simple Majority (13 seats) accepts.
  *   **Dismissal:** Assembly may dismiss Executive by Simple Majority (13 seats).
  *   **Consequence of Dismissal:** **No Election.** Caretaker takes over and implements **Blue**. Executive removed.

  ---

  ## 5. Minute-by-Minute Timeline (90 Minutes)

  | Time | Activity | Details |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Deal** | Divide class into 5 parties. Assign Executive (Gamma). Distribute Identity & Exposure cards. **Do not distribute Regime cards yet.** Explain points = "Political Survival." |
  | **10-30** | **Round 1 (Regime A)** | Distribute Regime A cards. 5 min caucus. 5 min negotiation. 5 min voting. Record outcome. |
  | **30-50** | **Round 2 (Regime B)** | Collect A cards. Distribute B cards. 5 min caucus. 5 min negotiation. 5 min voting. Record outcome. |
  | **50-70** | **Round 3 (Regime C)** | Collect B cards. Distribute C cards. 5 min caucus. 5 min negotiation. 5 min voting. Record outcome. |
  | **70-80** | **Amendment Draft** | Parties draft one-line constitutional amendment to improve their outcome. Write on board. |
  | **80-90** | **Debrief & Reveal** | Cluster amendments. Reveal variables. Honest assessment of results. |

  ---

  ## 6. Predicted Outcomes & Honest Assessment

  **Student Prediction:**
  Students typically predict Assembly Power will rise monotonically:
  *   **Regime B (Low Power):** Exec unremovable.
  *   **Regime A (Medium Power):** Exec removable, but risky.
  *   **Regime C (High Power):** Exec removable, no risk.
  *   *Expected Order:* **B < A < C**

  **Actual Outcome (Under These Numbers):**
  *   **Regime B:** The Anti-Red coalition (Alpha+Delta+Beta+Epsilon = 19 seats) prefers Status Quo (5) or Blue (10) over Red (0 or 4). They have 19 seats. Threshold is 16. **They Override.** Outcome: **Status Quo (5 pts).**
  *   **Regime A:** To fire the Exec, you need 13 seats. Beta+Epsilon (9 seats) want an election (+5 exposure). Alpha+Delta (10 seats) fear an election (-5 exposure). Gamma (5 seats) supports Exec. The "Fearful" parties (Alpha+Delta) will vote *Keep* to avoid the election, even though they hate Red. Fire Votes = 9. Keep Votes = 15. **Exec Survives.** Outcome: **Red Passes (0-4 pts for most).**
  *   **Regime C:** To fire the Exec, you need 13 seats. Cost is zero. Outcome is Blue (10 pts for Alpha/Delta). Alpha+Delta+Beta+Epsilon (19 seats) fire. **Exec Dismissed.** Outcome: **Blue (10 pts for majority).**

  **Resulting Assembly Power Order:** **A < B < C**

  **Does the Prediction Hold?**
  **No.** The naive monotonicity prediction **fails**.
  *   **Why?** Students focus on the *procedure* (Dismissal is easier in A than Override in B). They ignore the *strategic cost* (Election vs. Status Quo).
  *   **The Break:** The "Mutual Destruction" rule in Regime A creates a **hostage situation**. The parties that hate the Executive's policy the most (Alpha/Delta) are the same parties that fear the election the most. This splits the opposition. In Regime B, the opposition is united by the lack of election risk, allowing them to clear the higher procedural hurdle (16 votes).
  *   **Lesson:** "Who can dismiss whom" is less informative than "Who pays what when the government falls." Mutual dependence (A) can paralyze the assembly *more* than fixed separation (B).

  ---

  ## 7. Troubleshooting: What Will Go Wrong

  | Problem | Fix |
  | :--- | :--- |
  | **Students treat it as a personality contest.** | Explicitly state: "You are not negotiating as friends; you are agents of your Party's payoff schedule. Deviating from party interest lowers your grade/participation score." |
  | **Parties fail to coalesce in time.** | Enforce the "5 min caucus" strictly. Appoint a "Party Whip" in each group to count votes immediately. |
  | **Executive dominates the room.** | Give the Executive a 1-minute speaking limit. They propose, then sit. The Assembly debates. |
  | **Election mechanic never triggers.** | The numbers are rigged to make it *tempting* for Beta/Epsilon but *fatal* for Alpha/Delta. If Alpha/Delta vote irrationally to fire, point out in debrief that they violated their private payoff info. |
  | **Confusion on Regime Rules.** | Keep the Rule Cards simple (bullet points). Project the thresholds (13 vs 16) on the board constantly. |

  ---

  ## 8. The Debrief & Amendment Clustering

  **Step 1: The Amendment Cluster (10 mins)**
  Ask each party to write their "One-Line Fix" on the board.
  *   *Likely Cluster 1 (Survival):* "Remove election penalty," "Make dissolution require 2/3," "Allow election only if no new gov forms."
  *   *Likely Cluster 2 (Origin/Veto):* "Let Assembly pick Exec," "Lower override to simple majority," "Give Exec veto."

  **Step 2: Mapping the Variables**
  Draw a 2x2 matrix on the board.
  *   **X-Axis:** Origin (Assembly vs. Separate).
  *   **Y-Axis:** Survival (Mutual/Election vs. Fixed/Safe).
  *   Place Regimes A, B, C on the matrix.
      *   **A:** Assembly Origin / Mutual Survival.
      *   **B:** Separate Origin / Fixed Survival.
      *   **C:** Separate Origin / Safe Survival.
  *   *Reveal Labels:* A ≈ Parliamentary (with dissolution). B ≈ Presidential. C ≈ Recall/Constructive Vote Hybrid.

  **Step 3: The Core Insight**
  Explain why their prediction (B < A < C) failed.
  *   "You thought A gave the Assembly more power than B because 13 votes < 16 votes."
  *   "But in A, 10 of your votes were 'hostages' due to the Election Penalty."
  *   "In B, the cost was zero, so the 19 votes held firm."
  *   **Takeaway:** Institutional power is not just about voting thresholds; it is about the **credibility of the threat**. A threat that destroys the user (Regime A) is rarely used.

  ---

  ## 9. Limitations (What This Does Not Reproduce)

  Be frank with students about what the simulation abstracts away:
  1.  **Time Horizon:** Real politicians care about future rounds (re-election), not just one-off points. This sim compresses time, making "Election Losses" abstract.
  2.  **Discipline:** Parties in the sim vote as blocs. Real parties have internal factions (e.g., a Gamma member might vote to fire despite party interest).
  3.  **Public Opinion:** Payoffs are fixed. In reality, an Election is a gamble on *voters*, not a fixed point deduction.
  4.  **Complexity:** Real legislation involves logrolling and pork-barrel spending, not just three policy packages.
  5.  **Judiciaries/Media:** No external enforcement or information dissemination is modeled.

