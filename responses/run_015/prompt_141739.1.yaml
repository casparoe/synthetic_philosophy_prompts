answer: |-
  You are correct that "path dependence" is the opposite of the move you describe. Path dependence (associated with economists like W. Brian Arthur and historians like Paul David) argues that small, contingent events *do* lock in outcomes, making them hard to reverse (e.g., the QWERTY keyboard). The move you are identifying argues that outcomes are *not* locked in by specific events because the structural pressure ensures the outcome regardless of the specific trigger.

  There is no single, universally accepted noun in historiography that captures all three grades plus the fourth observation in one package. However, the literature does separate these concepts, just not always under one roof. Below is the breakdown of the established terms that map to your grades, followed by a proposed coinage for the specific rhetorical move.

  ### 1. The Established Terms for Your Grades

  **Grade 1 (Immediate Replacement): *Multiple Discovery* or *Simultaneous Invention***
  *   **Definition:** The hypothesis that scientific discoveries and inventions are not unique to a specific individual but are inevitable given the state of knowledge at the time.
  *   **Literature:** Sociologist Robert K. Merton formalized this in *The Sociology of Science* (1973). It is the standard explanation for cases like Newton/Leibniz (calculus) or Darwin/Wallace (natural selection).
  *   **Fit:** This matches your Grade 1 perfectly. It claims the "hinge" is replaceable by a rival already in the field.
  *   **Confidence:** **High (95%)**. This is a standard, well-defined concept.

  **Grade 2 & 3 (Eventual or Structural Inevitability): *Historical Inevitabilism* or *Equifinality***
  *   **Definition:** The claim that broad structural forces (technology, economics, demographics) render specific events non-causal because the outcome was determined by the "spirit of the times" or material conditions.
  *   **Literature:**
      *   **Historical Inevitabilism:** Made famous by Isaiah Berlin's 1954 essay *Historical Inevitability*. He critiques the view that individuals don't matter because "larger forces" would have produced the result anyway. This covers your Grade 2 (eventually) and Grade 3 (something of that kind).
      *   **Equifinality:** A term from General Systems Theory (von Bertalanffy) adopted by sociology and archaeology. It means "different initial conditions and paths can lead to the same end state." This is the technical term for "the same end result would have arrived anyway by some other route."
  *   **Fit:** *Equifinality* describes the mechanism; *Inevitabilism* describes the philosophical stance.
  *   **Confidence:** **Medium-High (85%)**. *Equifinality* is the precise technical term, but it is more common in sociology/systems theory than in popular history. *Inevitabilism* is common in history but often used as a pejorative label for an opponent's view rather than a neutral description.

  **The Fourth Point (Hindsight Bias): *Retrospective Determinism***
  *   **Definition:** The bias wherein an observer, knowing the outcome, assumes the outcome was the only possible one.
  *   **Literature:** Coined by sociologist Samuel Stouffer (1940s) and expanded upon by historians like E.H. Carr. It addresses your observation that we never apply this logic to defeated reforms. We only call successful things "inevitable."
  *   **Fit:** This is an exact match for your fourth observation. It explains *why* the move is deployed selectively.
  *   **Confidence:** **High (95%)**. This is the standard term for that specific cognitive/historiographical error.

  ### 2. The Missing Umbrella Term (A Coinage)

  Because the literature splits these into "Multiple Discovery" (Grade 1), "Inevitabilism" (Grades 2–3), and "Retrospective Determinism" (Grade 4), there is a gap for a term that describes the *rhetorical move itself*—the act of dismissing a specific cause as non-essential.

  I propose the term: **The Causal Redundancy Argument**.

  *   **Definition:** A historiographical move that negates the causal significance of an event $E$ by asserting that the outcome $O$ was robust to the absence of $E$, due to the existence of latent substitute causes or structural pressures.
  *   **Why this term?** "Redundancy" captures the idea that the specific hinge was not *necessary*, even if it was *sufficient*. It distinguishes the move from "Determinism" (which is a worldview) and "Path Dependence" (which argues the opposite).
  *   **Borderline Cases:**
      *   *True Causal Redundancy:* The invention of the telephone. If Bell hadn't filed the patent, Gray was minutes behind; the technology was mature. (Grade 1).
      *   *False Causal Redundancy:* The assassination of Archduke Franz Ferdinand. Some argue "war was inevitable" (Grade 2/3), but many historians argue the specific timing and nature of WWI were highly contingent on that specific drive through Sarajevo. Claiming redundancy here is more controversial than in the telephone case.

  ### 3. Confidence Levels and Uncertainty

  Here is my assessment of the reliability of the information above:

  *   **Path Dependence is the opposite:** **Very High Confidence (99%)**. In economic and historical theory, path dependence specifically denotes sensitivity to initial conditions and "lock-in," which contradicts the substitutability you describe.
  *   **Multiple Discovery (Grade 1):** **High Confidence (95%)**. This is a settled concept in the sociology of science.
  *   **Retrospective Determinism (Grade 4):** **High Confidence (95%)**. This is the standard label for the hindsight bias regarding historical outcomes.
  *   **Equifinality (Grades 2–3):** **Medium-High Confidence (85%)**. While this is the correct systems-theory term for "same end, different paths," it is not always the primary term used in *popular* history books, which prefer "Inevitability."
  *   **Distinction between Grade 2 and Grade 3 in Literature:** **Low Confidence (60%)**. **(This is my least sure claim).** While *you* distinguish between "eventually" (Grade 2) and "something of that kind" (Grade 3), the philosophical literature often conflates these under the broad banner of "Determinism" or "Functionalism." I am not certain there is a widely recognized technical distinction between "inevitable exact outcome" and "inevitable functional equivalent" outside of specific sub-fields like counterfactual history.

  ### Summary
  If you need to refer to this in writing:
  1.  For the specific mechanism of "someone else would have done it," use **Multiple Discovery** (Grade 1) or **Causal Redundancy** (General).
  2.  For the broad claim that "it was bound to happen," use **Historical Inevitabilism**.
  3.  For the bias of only applying this to winners, use **Retrospective Determinism**.
  4.  If you want one term to rule them all, **The Causal Redundancy Argument** is not yet established but is semantically precise and defensible.

  **Least Sure Claim:** I am least sure about the claim that **Grade 2 and Grade 3 are consistently distinguished in the philosophical literature.** While your distinction is analytically sound (timing vs. typology), many historians and philosophers lump both under "Determinism" without separating the claim of *temporal* inevitability from *structural* inevitability.
