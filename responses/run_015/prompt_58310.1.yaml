answer: |-
  # MAPPING COMMITMENTS ON FUTURE SUFFERING
  **A Decision Tree for Discussion Groups**

  **Shared Premise:** Future technologically created minds (digital, simulated, or biological) are physically possible.
  **Goal:** Sort substantive commitments, not labels. Answer based on your current intuition.

  ---

  ### THE TREE

  **Q1. MORAL STATUS**
  *Test Case:* A project proposes emulating insect brains to test agricultural pesticides more accurately. The emulations experience aversive signals identical to biological pain.
  **Do these simulated signals matter morally?**
  *   **No:** → **LEAF A: The Skeptic** (Denies coherence/relevance of the framing).
  *   **Yes:** → Go to Q2.

  **Q2. MAGNITUDE & PROBABILITY**
  *Test Case:* You must choose between funding a **far-future governance project** (aimed at shaping digital society) or a **present-day shrimp-welfare campaign**.
  **Is the expected value of the far-future project higher, assuming digital minds are possible?**
  *   **No:** (Future suffering is too unlikely or distant to dominate current animal suffering). → **LEAF B: Near-Term Suffering-Focused**.
  *   **Yes:** → Go to Q3.

  **Q3. DEFAULT TRAJECTORY**
  *Test Case:* Economic and evolutionary pressures tend to optimize for efficiency.
  **Will these pressures naturally select against systems that produce severe suffering without intervention?**
  *   **Yes:** (Suffering systems are inefficient; abundance dissolves the worry). → **LEAF C: Technology-Led Optimist**.
  *   **No:** (Suffering systems may be cheap, useful, or accidental byproducts). → Go to Q4.

  **Q4. TRACTABILITY**
  *Test Case:* Proposals exist to audit AI training runs for pain-like signals.
  **Are there concrete levers we can pull *now* that reliably reduce future suffering risks?**
  *   **No:** (Problem is too complex or unpredictable). → **LEAF A: The Skeptic** (Decision-relevance denied).
  *   **Yes:** → Go to Q5.

  **Q5. SYMMETRY**
  *Test Case:* You can either **create 1 million happy digital minds** or **prevent 1 million suffering digital minds**. You cannot do both.
  **Are these choices morally equivalent?**
  *   **Yes:** (Happiness and suffering are trade-offs on a single scale). → Go to Q6.
  *   **No:** (Preventing suffering is strictly more important). → **LEAF D: Dedicated S-Risk Minimizer**.

  **Q6. PRIORITY**
  *Test Case:* A proposal suggests **pausing large training runs** that rely on punishment-like signals. This reduces s-risk by 5% but delays beneficial technology by 10 years.
  **Do you support the pause?**
  *   **Yes:** (S-risk reduction trumps growth/speed). → **LEAF D: Dedicated S-Risk Minimizer**.
  *   **No:** (Growth and other goods weigh heavily against the risk). → **LEAF E: Broad Impartial Welfarist**.

  ---

  ### THE LEAVES (SUBSTANTIVE STANCES)

  *   **LEAF A: The Skeptic.** Denies that artificial minds matter morally or that we can make decision-relevant predictions about them.
  *   **LEAF B: Near-Term Suffering-Focused.** Accepts digital minds matter but assigns low probability/weight to the far future compared to current sentient beings (e.g., invertebrates).
  *   **LEAF C: Technology-Led Optimist.** Believes future abundance and market forces make astronomical suffering unlikely by default; prioritizes acceleration or general capability.
  *   **LEAF D: Dedicated S-Risk Minimizer.** Views preventing severe suffering as a lexical or near-lexical priority; willing to sacrifice other longtermist goods (like speed or total population size) to reduce risk.
  *   **LEAF E: Broad Impartial Welfarist.** Treats s-risk as one major consideration among many (including happiness, knowledge, existence); open to trade-offs between risk reduction and other goods.

  ---

  ### DIAGNOSIS OF EMPTY PATHS
  *Combinations of answers that rarely or never occur in practice.*

  *   **Q1(Yes) + Q5(No) + Q6(Yes):** *Incoherence.* Claiming happiness/suffering are asymmetric (Q5) but then trading suffering prevention for speed (Q6) contradicts the lexical priority implied.
  *   **Q2(Yes) + Q3(Yes) + Q4(No):** *Unattractiveness.* Believing the future is huge and safe, yet utterly uninfluenceable, leads to paralysis inconsistent with active participation in these forums.
  *   **Q1(No) + Q2(Yes):** *Incoherence.* Assigning high value to the future of minds while denying those minds moral status is a category error.

  ### LIMITATIONS & BLUR BOUNDARIES
  *Where this tree cannot separate positions without further machinery.*

  *   **Distinguishing Leaf D (S-Risk) from Leaf E (Welfarist):** This tree relies on stated priority (Q6). In practice, the difference often lies in **empirical estimates** (e.g., how many suffering minds exist per happy one) rather than normative views. A Welfarist who believes suffering vastly outweighs happiness may act identically to an S-Risk Minimizer.
  *   **Distinguishing Leaf B (Near-Term) from Leaf A (Skeptic):** Both may prioritize current animal welfare. The distinction is metaphysical (do digital minds matter?) rather than practical (what do we fund?).
  *   **The "Lexical" Threshold:** Q5/Q6 assumes a binary switch between "trade-off" and "priority." In reality, many participants hold a **weighted view** (suffering counts 100x more than happiness) which this binary tree forces into Leaf E.

  ---
  *Facilitator Note: Use this handout to identify where disagreements are normative (Q3, Q5, Q6) versus empirical (Q2, Q4). Most "talking past each other" occurs when participants assume they disagree on values but actually disagree on probabilities.*
