answer: |-
  **Scenario**
  Mrs Gable, eighty-two, lies in Bed Four with an intracapsular hip fracture. Her dementia is moderate-to-severe; she knows her name but not the date. She lacks capacity. Two paths exist: surgical fixation followed by aggressive physiotherapy, or conservative management with palliative analgesia. Medical evidence suggests her physiological reserve is sufficient that life expectancy remains roughly six months regardless of the choice. The difference lies in the texture of that time. Surgery entails two weeks of intense post-operative and rehabilitation pain, followed by five months of mobility and comfort. Conservative management avoids the surgical spike but condemns her to six months of continuous, moderate pain and immobility.

  **Positions and Arithmetic**
  *   **Dr Ashworth (Geriatrician):** Calculates Net Utility (Happiness minus Suffering).
      *   *Path A (Surgery):* 14 days × -8 pain units + 166 days × -2 pain units = -444 suffering. Mobility yields 166 days × +3 happiness = +498. Net = +54.
      *   *Path B (Conservative):* 180 days × -4 pain units = -720 suffering. No mobility happiness. Net = -720.
      *   *Verdict:* Path A. The positive net utility outweighs the negative.
  *   **Staff Nurse Pryce:** Calculates Total Suffering only (Happiness is irrelevant).
      *   *Path A:* 444 suffering units.
      *   *Path B:* 720 suffering units.
      *   *Verdict:* Path A. The aggregate quantity of pain is lower, even if the intensity peaks higher.
  *   **Marianne (Daughter):** Applies Lexical Priority to the Worst Moment.
      *   *Path A:* Peak pain intensity is 8/10.
      *   *Path B:* Peak pain intensity is 4/10.
      *   *Verdict:* Path B. The peak suffering in Path A is strictly worse than the peak in Path B. No amount of reduced chronic pain or added happiness can justify permitting the higher peak.

  **The Single Feature**
  The disagreement turns entirely on the **maximum intensity of suffering** experienced at any single point. Ashworth and Pryce integrate suffering over time (area under the curve); Marianne evaluates the curve by its highest point (supremum).

  **Counterfactual**
  If the clinical protocol for Path A is adjusted so that heavy sedation during rehabilitation caps the peak pain at 4/10 (matching Path B), the disagreement collapses. Marianne's lexical veto is triggered only by a worse worst-thing. If the worst moments are equal, she has no grounds to refuse the path that reduces total suffering, and she would likely acquiesce to surgery.

  **Attack and Reply**
  *   **Pryce:** "You are choosing more pain in total. You are letting her ache for months to spare her weeks. That is not mercy; that is bad maths."
  *   **Marianne:** "I am not counting the pain. I am refusing the unbearable. You can add up the ache all you like, but you cannot add up dignity. Once she screams, she has screamed. No amount of comfort later unscreams it."

  **Dialogue**
  "We are looking at the total burden," Ashworth said, tapping the chart. "Two weeks of high pain versus six months of grinding ache. The sum favours surgery."

  "Less suffering overall," Pryce added. "The arithmetic is clear."

  Marianne looked at her mother. "But the surgery is worse. The worst moment is worse. I won't trade her screaming for her comfort."

  "It prevents more pain later," Ashworth insisted.

  "Not the worst pain," Marianne said. "She will feel it. That is enough."

  **Honest Note on Rigging**
  The primary clinical rig is holding life expectancy fixed. In reality, conservative management of hip fractures in dementia patients carries significantly higher mortality due to complications of immobility (pneumonia, sepsis, thromboembolism). To meet your constraint, the scenario must assume either a very short timeframe (where mortality risks haven't diverged) or exceptional palliative care that prevents fatal complications. Additionally, maintaining a steady 4/10 pain level in conservative management requires perfect palliative sedation; in practice, nursing care (turning, washing) often causes spikes exceeding 4/10. To make this work without rigging, you must specify that in Path B, continuous sedation blunts these spikes, whereas in Path A, wakefulness is required for physiotherapy, creating the unavoidable peak.
