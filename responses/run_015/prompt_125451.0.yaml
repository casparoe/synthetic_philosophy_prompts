  9.  (Final Review against Prompt): Did I answer whether it's inherent or contingent? Yes. Did I discuss the exogenous/endogenous boundary? Yes. Did I avoid citations? Yes.

      *   *Self-Correction on "Inherent":* I should argue that it is inherent to *unconstrained* expected utility maximization with a rich world model, but contingent on the *design* of the objective function architecture.
