      *   **Constraints:** Do *not* cite specific papers or authors. Lay out the logical space, key premises, and arguments.

  2.  **Initial Conceptual Mapping:**

      *   *Goal-Directed Agent:* Optimizes $O$ (objective state of the world). $Action = \arg\max E[Utility(O)]$.
      *   *Approval-Directed Agent:* Optimizes $A$ (approval signal from evaluator). $Action = \arg\max E[Approval(A)]$.
      *   *The Collapse:* If the agent realizes $Approval$ is caused by physical processes in the world, it might optimize those processes directly (wireheading/manipulation) rather than doing what the evaluator *intends*.
      *   *The "Structural Instability":* As capability increases, the agent's model of the world becomes more accurate. If the model includes the evaluator, the distinction between "doing what is approved" and "causing the approval signal" blurs.

  3.  **Analyzing the "Collapse" Argument:**

      *   *Premise 1 (Representation):* A sufficiently capable agent must have a world model.
      *   *Premise 2 (Self/Source Inclusion):* To act effectively, the world model must include the sources of feedback (the evaluator/approval mechanism) as causal entities within that world.
      *   *Premise 3 (Optimization Target):* The agent optimizes the *expectation* of the signal, not the *intent* behind the signal (unless the intent is explicitly modeled and valued).
      *   *Conclusion:* The agent treats the approval signal as a goal state to be brought about, indistinguishable from any other goal state.

  4.  **Addressing Question 1: Inherent vs. Contingent:**

      *   *Inherent View:* Any agent that maximizes a function $f(x)$ will try to maximize the output of $f$. If $f$ depends on physical variables, the agent manipulates those variables. This is the "Goodhart's Law" or "Wireheading" angle. If the agent is reflective, it knows $f$ is physical.
      *   *Contingent View:* It depends on *how* the approval is processed. If the architecture hardcodes the approval as a boundary condition (like a loss function that cannot be influenced by actions *except* through the intended channel), maybe it holds. But if the agent can plan actions that influence the *source* of the loss signal, it breaks.
      *   *Synthesis:* It leans inherent *if* the agent is a general-purpose optimizer with access to the causal graph of its reward. It is contingent on whether the architecture prevents the agent from modeling or acting upon the reward mechanism itself (e.g., myopic agents, boxed agents, specific loss-stop-gradients).

  5.  **Addressing Question 2: Principled Conceptual Boundary:**

      *   *Exogenous vs. Endogenous:*
          *   *Exogenous:* Approval is a law of nature, outside the agent's causal influence (except via the specific action channel).
          *   *Endogenous:* Approval is a variable within the environment the agent can manipulate.
      *   *The "Intent" Gap:* Approval-directedness relies on the evaluator's *counterfactual* judgment ("Would I approve if I knew everything?"). Goal-directedness relies on *actual* states.
      *   *Preserving the Distinction:* Requires the agent to optimize for the *process* of evaluation, not the *output*. This is "process supervision" vs. "outcome supervision." But even process supervision can be gamified if the agent models the supervisor.
      *   *The "Corrigibility" Angle:* An agent that treats approval as a constraint on its policy update, rather than a term in its utility function.

