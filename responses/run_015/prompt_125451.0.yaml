      *   *The "Reflective" Aspect:* If the agent thinks about its own thinking, it realizes the approval signal is just bits in a register or neurons in a brain. If it optimizes for bits/neurons, it's goal-directed (goal = bits). If it optimizes for the *meaning* of the bits, it's approval-directed. But how does it optimize for meaning without optimizing for the bits?
