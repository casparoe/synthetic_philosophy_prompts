      *   **Key Themes (Situationist Critique):** Single acts don't predict later acts; trivial situational features (hurry, mood, noise, confederates) shift behavior; consistency is aggregated, not singular; virtue ethics replies (habituation, practical wisdom, rarity).
      *   **Structure:**
          1.  Public Job Advertisement (promising to find virtuous candidates, filter situational compliance).
          2.  Confidential Internal Rubric (attempting to control situations while revealing misunderstanding).
      *   **Specific Content:** Three standardized micro-situations (e.g., rushed hallway, tedious task, ambiguous instruction).
      *   **Tone:** Legible without winking (deadpan). Unfamiliar readers sense something wrong; familiar readers recognize the debate.

  2.  **Drafting - Section by Section:**

      *   **Header/Company Name:** Needs to sound techy/ethical. "VirtueTech"? "CharacterCore"? "Agathos Dynamics"? Let's go with "EthosStream Solutions."
      *   **Job Ad:** Needs to sound like a standard tech job post but focused on morality. Use buzzwords like "pipeline," "scalable virtue," "authentic alignment."
      *   **The Rubric:** This is where the satire hits. It needs to show the HR team trying to measure "global traits" using specific, manipulated situations, inadvertently proving the situationist point.
      *   **The Three Micro-Situations:**
          1.  *Rushed Hallway:* Testing helping behavior under time pressure (Darley & Batson reference).
          2.  *Tedious Task:* Testing honesty/cheating (shredding papers, self-reporting).
          3.  *Ambiguous Instruction:* Testing obedience/authority (Milgram lite).
      *   **The Twist/Irony:** The rubric tries to "control" variables to find the "true self," but the controls *are* the situational determinants. They think they are filtering noise, but they are manipulating the signal.

  3.  **Word Count Management:**
      *   Target: 600-700 words.
