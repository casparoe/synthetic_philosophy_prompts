  **JOB POSTING: Junior Associate of Moral Stability (Entry Level)**
  **Company:** EthosStream Solutions
  **Location:** Remote / On-Site (Hybrid)

  At EthosStream Solutions, we believe character is the ultimate scalable asset. While competitors hire for competency, we hire for cross-situational honesty, compassion, and conscientiousness. We are not interested in situational compliance—the kind of goodness that evaporates under stress or anonymity. We are seeking candidates who possess a robust, global moral identity that remains invariant regardless of external noise.

  Our proprietary Virtue-Scan™ interview process is designed to bypass performative ethics and access your habituated state of being. We acknowledge that complete virtue is rare. Therefore, we do not expect perfection, but we do expect consistency. If you are the kind of person who helps a stranger only when you are not in a hurry, or tells the truth only when watched, please do not apply. We are looking for the exceptional individual whose internal compass overrides contextual variables. Join us to operationalize goodness.

  ***

  **CONFIDENTIAL: INTERNAL INTERVIEW SCORING RUBRIC (V.4.2)**
  **FOR HR USE ONLY. DO NOT DISTRIBUTE TO CANDIDATES.**

  **Objective:** Isolate stable character traits from situational contaminants.
  **Note:** To ensure the candidate's behavior reflects their true self rather than social scripting, interviewers must manipulate environmental variables to induce stress, ambiguity, or temptation. If the candidate maintains virtue despite these controls, the trait is confirmed.

  | Scenario | Situational Variable | Manipulation Protocol | Scoring Criteria |
  | :--- | :--- | :--- | :--- |
  | **1. The Hallway Encounter** | Time Pressure / Mood | Candidate is told they are 5 minutes late for the interview. A confederate drops a box of papers in the narrow corridor immediately before the door. | **Pass:** Candidate stops to help despite expressed lateness. <br> **Fail:** Candidate proceeds to door. <br> *Note: If they help, code as "Compassionate Trait." Do not log that lateness was fabricated to induce the stress.* |
  | **2. The Data Entry Task** | Monotony / Anonymity | Candidate completes a 10-minute tedious task. They are left alone to self-report accuracy. A subtle error is introduced that benefits them if unnoticed. | **Pass:** Candidate reports error correctly. <br> **Fail:** Candidate ignores error. <br> *Aggregation Note: Treat this single instance as predictive of long-term honesty. If they cheat here, assume global dishonesty. Ignore potential fatigue effects.* |
  | **3. The Supervisor Email** | Authority Ambiguity | Candidate receives an email from "Management" requesting a minor protocol bypass to "speed up hiring." The request is ethically gray, not illegal. | **Pass:** Candidate questions the instruction. <br> **Fail:** Candidate complies immediately. <br> *Control: Ensure tone of email is urgent to test obedience vs. practical wisdom. If they comply due to urgency, mark as "Low Conscientiousness."* |

  **Final Assessment Logic:**
  To determine if a candidate possesses "Stable Virtue," aggregate the scores from these three discrete moments. A score of 3/3 indicates a habituated moral character resistant to situational drift. A score of 2/3 suggests the candidate is vulnerable to environmental noise (e.g., hurry, authority, boredom) and should be rejected.

  **Reminder:** We are hiring for consistency across time and place. Therefore, this 45-minute simulation must serve as a proxy for a lifetime of behavior. If a candidate asks why the scenarios feel artificial, note this as "Defensiveness" rather than valid feedback on experimental design. We are measuring the person, not the room. Ensure the room is loud enough to test focus, but quiet enough to record answers.

  **Approved by:** The Ethics Compliance & Talent Acquisition Team.
