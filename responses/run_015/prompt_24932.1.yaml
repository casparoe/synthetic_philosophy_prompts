      *   **Target Step (2) secondarily:** The "Chess vs. Tennis" analogy is too rigid. Wittgenstein allows for critique, but it must be *internal* or *grammatical*, not just empirical counter-evidence. We can criticize religion for being incoherent or ethically repugnant, just not for failing to be physics.
