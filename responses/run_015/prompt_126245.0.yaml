prompt: |-
  I'm running a workshop for about 12 philosophy grad students, 90 min. I want them to feel the pull of sortition not through the usual democracy-vs-expertise framing but through something weirder: epistemic fragmentation in randomly assembled bodies. Design an in-class game where students are randomly assigned to a 'citizen assembly' and each gets a hidden 'domain card' with niche jargon—say urban hydrology, climate modeling, or indigenous tenure systems—and they have to collectively approve or reject a development proposal. The twist: they can only speak in thier card's jargon unless they spend a scarce 'translation token' to bridge terms. Voting order is decided by lot each round. I need rules, materials with no real money, a debrief mapping failure modes onto real critiques of lottocracy, and an honest note on what this can't reproduce. Tell me what'll predictably go wrong first run. No lecture up front—let them discover the coordination failure themselves.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **Target Audience:** 12 Philosophy Grad Students (smart, critical, likely familiar with democratic theory, prone to over-analyzing rules).
      *   **Duration:** 90 minutes.
      *   **Goal:** Make them *feel* the pull of sortition (specifically epistemic fragmentation in randomly assembled bodies) without the standard "democracy vs. expertise" debate.
      *   **Core Mechanic:** Randomly assigned "Citizen Assembly," hidden "Domain Cards" with niche jargon, collective decision on a development proposal.
      *   **Constraint:** Speak only in card jargon unless spending a scarce "Translation Token."
      *   **Voting:** Decided by lot each round.
      *   **Deliverables:** Rules, Materials (no real money), Debrief (mapping failure modes to lottocracy critiques), Honest limitations, Predicted failure points (first run).
      *   **Tone:** No lecture up front (discover coordination failure themselves).

  2.  **Deconstruct the Core Mechanic (The "Weird" Twist):**
      *   Standard sortition critique: "Random people aren't smart enough."
      *   Desired critique: "Random people speak incommensurable languages."
      *   Mechanism: Jargon barriers + scarce translation resources.
      *   Risk: If the jargon is too opaque, they just sit silently. If it's too easy, they ignore the tokens.
      *   Risk: Grad students will try to "hack" the game immediately.

  3.  **Drafting the Game Structure:**
      *   *Name:* Needs to sound bureaucratic but slightly off. "The Committee on Incommensurable Inputs"? "The Lottery of Tongues"? Let's go with **"The Tower of Babel Protocol."**
      *   *Setup:* 12 students. 1 Proposal. 12 Domain Cards. Tokens.
      *   *Rounds:* Need enough time for frustration to build but not enough for a perfect solution. 3 Rounds seems right.
      *   *Win Condition:* Consensus or Supermajority? Consensus is too hard. Supermajority (e.g., 8/12) forces coalition building. Let's go with **Qualified Majority (9/12)** to make it hard but possible.

  4.  **Developing the Materials:**
      *   *The Proposal:* Needs to be complex enough to touch all domains but vague enough to be interpretable. A "Coastal Resilience Hub."
      *   *The Cards:* Need specific jargon. Not just "Science" vs. "Art." Needs to be *niche*.
          *   Examples: Mycorrhizal networks, Actuarial risk tables, Phenomenological bracketing, Zoning variance codes, etc.
      *   *Tokens:* Physical objects. Poker chips? Paper clips? Let's use **colored index cards** cut in half. Scarce resource: 2 tokens per person total for the whole game.

  5.  **Refining the Rules (The "No Lecture" Constraint):**
      *   Hand out a one-pager.
      *   Enforce the jargon rule strictly? No, that kills the game. Enforce it via a "Moderator" (the facilitator) who calls "Foul" and confiscates a token or freezes speech.
      *   *Correction:* Facilitator shouldn't be a dictator. Let's make it a peer-enforced mechanic. If you speak plain English, anyone can call "Translation Tax" and you lose a token. This creates surveillance/pressure.

  6.  **Anticipating Failure Modes (First Run):**
      *   *Grad Student Syndrome:* They will meta-game. They will try to redefine the rules.
      *   *Silence:* If the jargon is too hard, no one speaks.
      *   *Hegemony:* One loud person dominates the "translation" tokens.
      *   *The "Common Sense" Loophole:* They will argue that "plain language" *is* their jargon.
      *   *Time:* 90 mins is tight. 15 intro, 45 game, 30 debrief.

  7.  **Designing the Debrief:**
      *   Connect the frustration to *epistemic fragmentation*.
      *   Map to real critiques: Anderson (expertise), Landemore (cognitive diversity), but also the *cost* of translation.
      *   What the game *can't* do: Real deliberation takes time; real citizens learn from each other (the game punishes learning); real sortition has staff support (the game removes it).

  8.  **Fleshing out the Details (Iterative refinement):**
      *   *Jargon Level:* Needs to be readable but annoying. If it's gibberish, it's silly. If it's real jargon, it's educational. Let's use real terms from specific sub-fields.
      *   *Voting:* Randomized order is requested. Okay, draw names from a hat each round.
      *   *Tokens:* 2 per person. Total 24 tokens for 12 people. That's very scarce if every sentence needs translation.
      *   *The Proposal:* "The Estuary Mixed-Use Development."

  9.  **Addressing the "Honest Note":**
      *   Sortition in reality includes facilitation, expert testimony, and time. This game simulates the *worst-case* scenario of raw sortition without infrastructure. This is crucial to admit.

  10. **Final Review against Constraints:**
      *   12 grad students? Yes.
      *   90 min? Yes.
      *   No lecture up front? Yes.
      *   Hidden domain cards? Yes.
      *   Translation tokens? Yes.
      *   Predicted failures? Yes.

  11. **Writing the Output:** (Structuring for clarity: Overview, Materials, Rules, The Proposal, The Cards, Debrief, Limitations, Predicted Failures). *Self-Correction during drafting:* Make sure the jargon isn't *too* obscure. Philosophy grad students know "phenomenology," but maybe not "hydrological permeability coefficients." Keep it interdisciplinary.

  12. **Final Polish:** Ensure the tone is appropriate for a workshop facilitator (practical, slightly provocative). (Proceed to generate response).

  *(Self-Correction on the "Speak only in jargon" rule)*: If they literally *cannot* speak plain English, the game stalls. The rule should be: "To make a claim valid for the record, it must be framed in your Domain's terms. To speak in plain English, you must pay a token." This allows communication but makes it costly. Actually, the prompt says "unless they spend a scarce translation token to bridge terms." Okay, so Default = Jargon. Cost = Plain English. This is harder. I need to make sure the Jargon is *interpretable* enough that they can guess meaning, otherwise, it's just noise. I will add a "Glossary" on the card so they know what their words mean, even if others don't.

  *Wait, one more thing:* The prompt asks for "Voting order is decided by lot each round." I need to make sure that's clear in the rules.

  *Debrief Mapping:* Need to connect to specific philosophical concepts (incommensurability, epistemic injustice, transaction costs).

  *Predicted Failures:* Grad students are notorious for rule-lawyering. I need to warn the facilitator about this.

