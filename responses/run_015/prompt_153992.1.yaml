answer: |-
  ### 1. Exam Question

  **Philosophy of Mind: Final Seminar Essay**
  **Time:** 60 Minutes | **Word Limit:** 800 words maximum

  **Prompt:**
  Consider a subject equipped with a reliable "doxastic readout"—a neural monitor that displays her credence in whichever proposition she attends to. She lacks introspective access to her beliefs; the display is her only evidence regarding them. Looking at heavy rain while attending to <it is raining>, the display reads 0.2.

  She sincerely asserts Variant 1: *"It is raining, but I don't believe it."*
  Or Variant 2: *"It is raining—though my readout tells me I don't believe it, and it's usually right."*

  **Your Task:**
  1.  Reject the standard explanation that Moore-paradoxical sentences are merely contingent truths or defective only in the third person.
  2.  State one general principle of the form: *"A subject's sincere first-personal present-tense self-ascription of disbelief alongside her judgment that p is defective if and only if …, because …"*
  3.  Apply this principle to determine whether Variant 1 and Variant 2 are defective, explaining any difference in status.
  4.  Extend your analysis to a **collective agent**: A forecasting team whose official output is "rain" while its internal confidence register (computed from the same members' credences) reads "not believed." Does your principle hold?

  ***

  ### 2. Model Answer

  The standard observation that "It is raining but I don't believe it" is logically possible but pragmatically defective is merely the starting line. It fails to explain why the defect persists even when the subject has external evidence, like a doxastic readout, confirming the disbelief. To explain this, we must adopt a normative account of assertion rather than a constitutivist or transparency-based account of belief.

  **General Principle:**
  A subject's sincere first-personal present-tense self-ascription of disbelief alongside her judgment that *p* is defective if and only if the subject undertakes the commitment to *p* while simultaneously denying the mental state required to sustain that commitment, because assertion constitutively represents the speaker as believing what they assert.

  This principle locates the defect not in the metaphysics of belief (what belief *is*) nor in the epistemology of self-knowledge (how we *find out* what we believe), but in the norms governing the speech act itself. To assert *p* is to invite others to rely on *p*; this invitation is fraudulent if the speaker explicitly disavows the belief that would warrant such reliance.

  **Application to Variants:**
  Under this principle, Variant 1 ("It is raining, but I don't believe it") remains defective, even with the readout. When the subject asserts "It is raining," she undertakes a commitment that represents her as believing it is raining. By immediately adding "but I don't believe it," she explicitly retracts the very psychological authority required to make the first claim. The readout is irrelevant to the *normative* clash. The first clause says, "Take my word for it"; the second says, "My word carries no weight because I lack the belief." This creates a pragmatic contradiction in the act of asserting, regardless of whether the belief is actually absent. The readout merely explains *why* she lacks the belief; it does not cure the defect in the assertion.

  Variant 2 ("It is raining—though my readout tells me I don't believe it..."), however, is not defective in the same way. Here, the subject is not directly self-ascribing disbelief as a current fact of her agency. She is reporting evidence about her cognitive state. The commitment structure changes. She asserts *p*, but frames the disbelief as an external observation ("the readout tells me") rather than a direct avowal ("I don't believe"). This creates a distinction between the commitment she is undertaking now and the theoretical data about her psychology. She is effectively saying, "I am asserting *p* (committing myself), although the data suggests I am not in the state usually required to do so." This is strange, but it is not a pragmatic contradiction. It acknowledges the norm while noting an anomaly in its satisfaction.

  **The Transparency and Constitutivist Failures:**
  Other accounts fail to predict this distinction. A transparency-based account argues that we answer "Do I believe *p*?" by looking at *p*. In the readout case, the subject looks at the rain (seeing *p* is true) and looks at the monitor (seeing belief is absent). This is a clash of methods, not a contradiction. This view struggles to explain why Variant 1 is worse than Variant 2; both involve the same clash of evidence. Similarly, a constitutivist view holds that belief is essentially self-intimating. If the subject lacks introspection, this view might claim she literally cannot have the belief, making the sentence true and not paradoxical. This fails to capture the intuitive absurdity of Variant 1. Only the normative account explains why the *act* of asserting creates the paradox, independent of the belief's actual presence.

  **Extension to Collective Agents:**
  This principle extends cleanly to the collective agent. A forecasting team's official output is an assertion. By issuing "rain," the collective undertakes a commitment to the truth of *p*, representing the collective as "believing" (or holding the requisite confidence). If the internal register simultaneously outputs "not believed," the collective is violating the norm of its own output. The defect persists because the official output functions as an assertion, which carries the same normative weight as individual speech. The internal register is analogous to the readout: it is evidence about the state of the agent. If the collective says "Rain, but we don't believe it" (Variant 1 equivalent), it undermines its own authority. If it says "Rain, though our confidence register is low" (Variant 2 equivalent), it is reporting a calibration issue without necessarily violating the norm of assertion. The normative account succeeds here because it treats the collective output as a commitment-bearing act, regardless of the internal psychological (or computational) substrate.

  ***

  ### 3. Marking Scheme

  **Total:** 20 Marks (5 Criteria × 4 Marks)
  **Note:** Answers that merely recite that Moorean sentences are "contingently true" or "okay in the third person" receive **0 marks** for the entire essay. These are summary moves, not analysis.

  | Criterion | A Grade (3.5–4 marks) | B Grade (2–3 marks) | Typical Error (0–1 mark) |
  | :--- | :--- | :--- | :--- |
  | **1. Rejection of Orthodoxy** | Explicitly dismisses truth-conditional/logical contradiction accounts as insufficient for the readout case. | Mentions standard views but fails to explain why they fail specifically for the neural monitor scenario. | Recites that "It is raining but I don't believe it" is not a logical contradiction without further analysis. |
  | **2. General Principle** | Formulates a precise "if and only if" principle linking defect to normative commitment, assertion, or avowal conditions. | States a principle but leaves the "because" clause vague or conflates belief states with speech acts. | Fails to state a general principle or offers a tautology (e.g., "it is defective when it is wrong"). |
  | **3. Variant Analysis** | Distinguishes Variant 1 (defective) from Variant 2 (non-defective/less defective) based on the principle's mechanics. | Treats both variants as identical or distinguishes them without referencing the stated principle. | Claims Variant 1 is true because the readout is reliable (misses the paradox entirely). |
  | **4. Theoretical Stance** | Identifies why Transparency or Constitutivist views fail the readout case compared to the Normative view. | Describes the three views but fails to evaluate their predictive success regarding the specific variants. | Name-drops authors or theories without explaining their mechanism or failure in this context. |
  | **5. Collective Extension** | Applies the principle to the team case consistently, treating official output as commitment-bearing. | Applies the principle but struggles to map individual norms onto the collective structure. | Claims the case is irrelevant because collectives don't have "minds" or "beliefs." |

  **Examiner's Note:** To earn an A, the essay must demonstrate that the defect lies in the *performance* of the assertion, not the *truth* of the proposition. Essays that treat the readout as simply making the sentence true have failed the core prompt.
