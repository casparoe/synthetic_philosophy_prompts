      *   *Check on (7):* User thinks SI rewards compression implies it fails on noise. SI minimizes $K(x)$. For random data, the shortest program is "print x". SI assigns low prior to random strings *as patterns*, but high probability to the *distribution* that generates them if that distribution is simple. Wait, SI puts prior on *sequences*. If the sequence is random, $K(x)$ is high. The prior $M(x)$ is low. But if the process is "flip a coin," the program "flip coin n times" is short. SI handles stochastic processes well. The user's worry is based on a misunderstanding of deterministic vs. stochastic complexity.

