answer: |-
  ### Brainstorming & Selection

  Before giving you the principle, I need to show my work. I considered three standard technical approaches to your "Back Book" problem.

  **Candidate 1: The Thin Red Line (Bivalence)**
  *The Idea:* There is exactly one actual future. Every prediction is already True or False, we just don't know which.
  *The Break:* This destroys your intuition on Cases 1, 3, and 6. It tells you the weather *is* determined, and your choice of chicken *is* already fixed. It validates Steve (Case 9) completely, making the Back Book identical to the Payout Book (just with hidden information). It fails to capture the "Openness" you feel is real.

  **Candidate 2: Supervaluationism (Branching Time)**
  *The Idea:* Truth is what holds on *all* possible future branches. Falsehood is what holds on *no* branches. If it holds on some but not others, it's Indeterminate.
  *The Break:* This handles Cases 1, 3, and 6 beautifully (they are Indeterminate). But it crashes into Case 4. "The ferry sails or it doesn't" is not true on all branches (some branches have sailing, some have not). So Supervaluationism says Case 4 is *Indeterminate*. But you rightly feel Case 4 is a logical certainty. We can't afford to lose the Law of Excluded Middle in the Back Book.

  **Candidate 3: Truth-Maker Theory with Logical Exception**
  *The Idea:* A contingent proposition is true at time $t$ only if there exists a *state of affairs* at time $t$ that *ontologically grounds* it. Logical truths (tautologies) are exempt; they are true in virtue of meaning, not worldly states.
  *The Break:* This survives. It explains why the hidden coin (Case 2) is fixed (the state exists) but the ferry (Case 3) is open (no state exists yet). It saves Case 4 (logical truth). It refutes Steve (Case 9) by distinguishing between *having a truth-maker* and *being accurate in retrospect*.

  **The Survivor:** I am adopting a refined version of **Candidate 3**. I call it the **Principle of Ontological Settledness**.

  ***

  ### The Principle: Ontological Settledness

  Here is the precise rule you should use to adjudicate the Back Book.

  **A prediction $P$ made at time $t_1$ about an event at $t_2$ is "Back-Book True" (Settled) if and only if:**
  1.  **Logical Necessity:** $P$ is a tautology (true in virtue of logical form); OR
  2.  **Causal Fixity:** The total physical state of the world at $t_1$ causally necessitates the truth of $P$ at $t_2$.

  **Conversely, $P$ is "Back-Book False" if its negation meets these conditions.**
  **If neither condition is met, $P$ is "Open" (no truth-value at $t_1$).**

  ***

  ### Applying the Principle to Your 10 Cases

  Here is where your gut feelings are right, where they are wrong, and why.

  **1. Weather ("It'll rain"): OPEN.**
  *   **Verdict:** Correct.
  *   **Why:** No state of affairs at $t_1$ causally necessitates rain. Atmospheric chaos implies multiple possible futures. Condition 2 fails.

  **2. Hidden Coin ("It is heads"): SETTLED (True or False).**
  *   **Verdict:** Correct.
  *   **Why:** The coin's orientation is a *past* event relative to the prediction. The physical state exists under the hand. Condition 2 is met (the state necessitates the truth). The flip (in the past) collapsed the possibility space.

  **3. Ferry ("It will sail"): OPEN.**
  *   **Verdict:** Correct.
  *   **Why:** Same as weather. No current state necessitates the sailing. Engine trouble, storms, or strikes are still possible.

  **4. Excluded Middle ("Sails or doesn't"): SETTLED (True).**
  *   **Verdict:** Correct.
  *   **Why:** This triggers **Clause 1 (Logical Necessity)**. It does not need a worldly truth-maker. It is true in virtue of the meaning of "or" and "not". This is why you can bet the house on it even though both halves are Open.

  **5. Contradiction ("Sails and doesn't"): SETTLED (False).**
  *   **Verdict:** Correct.
  *   **Why:** Logical Falsehood (Clause 1).

  **6. Own Decision ("I'll take chicken"): OPEN (Thicker).**
  *   **Verdict:** Correct.
  *   **Why:** This is the strongest case for the Back Book. At $t_1$, the decision does not exist. In fact, *you* are the causal mechanism that will create the truth-maker at $t_2$. To say it is already true is to deny your agency. Condition 2 fails.

  **7. Maureen ("She's always right"): OPEN.**
  *   **Verdict:** **Your gut is wrong here.**
  *   **Why:** This is the hardest pill to swallow. Maureen's past reliability is a truth-maker for "Maureen is reliable," but it is not a truth-maker for "The ferry sails." Unless Maureen is controlling the ferry (see Bakery Case), her prediction is epistemic, not ontological. If the world is genuinely open (as Case 1 suggests), Maureen is either incredibly lucky or she is secretly causing the events. If she's just guessing, her prediction remains Open until the event. You must mark this Open in the Back Book, even if she wins in the Payout Book.

  **8. Lost Coin ("It will land heads"): SETTLED (False).**
  *   **Verdict:** Correct (mostly).
  *   **Why:** At the moment of prediction, it was Open. But you are asking about its status *now* or *after the loss*. Once the coin is lost, the state of the world *causally necessitates* that it will not land heads.
  *   *Correction:* If you are judging the Back Book entry *at the moment it was written*, it was Open then. It *became* False later. The Back Book should record the status *at the time of writing*. So, strictly: It was Open when written, but now we know it was "doomed to be false." I recommend marking it **Open (Frustrated)**.

  **9. Steve's Argument ("It was true then"): INVALID.**
  *   **Verdict:** **Steve is cheating.**
  *   **Why:** Steve is conflating two different propositions.
      *   $P_1$ (uttered Monday): "The ferry sails on Tuesday."
      *   $P_2$ (uttered Wednesday): "The ferry sailed on Tuesday."
      *   When Steve says, "It is true now that Dave was right," he is affirming $P_2$.
      *   When he concludes, "So it was true then," he is claiming $P_1$ had a truth-value on Monday.
      *   **The Fix:** The fact that $P_2$ is true on Wednesday does not mean $P_1$ was true on Monday. $P_1$ lacked a truth-maker on Monday. The event on Tuesday *created* the truth-maker that retroactively validates the *accuracy* of the prediction, but not its *truth-at-utterance*. Steve is applying the Principle of Bivalence across time indices where it doesn't hold.

  **10. Year 3000 ("A city will stand"): OPEN.**
  *   **Verdict:** Correct.
  *   **Why:** No current state necessitates this. Nuclear war, asteroid, or migration could prevent it. The fact that we won't be alive to check (your "Star" rule) is an epistemic problem, not a metaphysical one. It remains Open.

  ***

  ### The Bakery Case (Self-Fulfilling Prophecy)

  *Case:* 8am prediction: "Bread sold out by noon." 8:05am: Everyone reads it and rushes. 12pm: Sold out.
  *Question:* Was it already true at 8am?

  **Verdict: OPEN at 8:00, SETTLED at 8:05.**

  This is the edge case that proves the utility of your Back Book.
  At 8:00:00, the prediction is just noise. There is no causal chain necessitating a sell-out. It is Open.
  However, the *utterance* of the prediction changes the physical state of the world (people read it, people move).
  At 8:05:00, the causal chain is locked in. The rush *necessitates* the sell-out.
  **Ruling:** If your pool rules allow for "time of writing" to be precise, it was Open. If the prediction *caused* the truth, it falls under a special category: **Causally Potent.**
  In the Back Book, I would rule this **Open**. Why? Because the truth of the claim depended on the *reaction* to the claim, not the state of the world *prior* to the claim. If you mark it "Settled," you encourage people to make things happen just to win the Back Book argument, which corrupts the metaphysics.

  ***

  ### Advice on the Back Book House Rules

  Should you keep it? **Yes.** The Payout Book tracks *accuracy* (correspondence at evaluation time). The Back Book tracks *settledness* (grounding at utterance time). These are philosophically distinct, and your pool has intuitively discovered a distinction that occupies professional metaphysicians.

  **Revised House Rules:**

  1.  **The Hidden State Rule (Your Rule a):** Keep. If the truth-maker exists physically but is epistemically hidden (coin under hand, result in sealed envelope), it is **Settled**.
  2.  **The Agency Rule (Your Rule b):** Keep. Predictions about one's own free actions are always **Open**. (Exception: If you write "I will breathe," that's biologically necessitated, so Settled).
  3.  **The Logical Exception:** Tautologies ("It will rain or not rain") are **Settled True**. Contradictions are **Settled False**. Do not mark them Open.
  4.  **The Maureen Clause:** Reliability is not Fixity. Even 100% past accuracy does not make a future contingent **Settled**. Mark Maureen's predictions **Open** unless she controls the outcome.
  5.  **The Steve Protocol:** When settling the Back Book, do not use information from the Payout Book. You must judge the prediction based *only* on what was known or fixed at the moment of writing. If you need to look at the Payout Book to decide the Back Book, the Back Book entry was **Open**.
  6.  **The Star Rule (Case 10):** Keep the star. These are **Open**, but unverifiable. Treat them as "Open (Permanent)."

  **Final Word:**
  Your intuition that "Winning" and "Being True Then" are different is correct. Steve is trying to collapse the future into the past using the logic of the Payout Book. Don't let him. The Back Book is the only place in your lives where you are honoring the reality that the future is not yet written. Keep it.
