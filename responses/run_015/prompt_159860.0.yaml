      *   *Unknown variable:* Integration clause.
      *   *Novel outcome:* Admission of failure (requires subjective prior).

      *   *Ontology:* I need to explicitly state I'm using a **Decision-Relative Propensity** view. Not pure frequency (fails Case 6/9), not pure subjective (fails Case 1/3).

      *   *Wait, one more check:* The user asks "which of them has to go." I need to be decisive. Case 8 is the most inconsistent with Case 2 and 5. I will target that.

      *   *Wait, Case 6:* The user notes the tension between Case 1 (narrow) and Case 6 (broad). My principle must explain *why* we ignore specifics in Case 6. Answer: Causal Relevance. Ticket number is causally irrelevant to the draw mechanism. Age is causally relevant to cancer. This resolves the tension without overturning a verdict, but rather explaining it. I should save the "overturn" for a genuine contradiction. Case 8 is the genuine contradiction (Survivor bias accepted in 8, rejected in 2/5).

