  Subject: SB Seminar Idea / Centered-World Twist

  Hey,

  Great idea on the seminar. Honestly, doing another worksheet where they just crunch P(Heads|Wake) is gonna kill the vibe. We want them to feel the friction, not just calculate it.

  I've sketched out a session plan based on that "centered-world peer disagreement" angle you mentioned. I had to tweak the "both are monday-wakers" detail slightly—if both agents wake Monday regardless of the coin, the credence stays 50/50 and the thirder pressure disappears. So I shifted it to "both are *potential* wakers" to keep the math forcing the 1/3 view. It still keeps the spirit of the peer disagreement though.

  Here's the full run-down.

  **The Setup: "Team Beauty"**
  *   **Participants:** 10 students.
  *   **Groups:** 5 Pairs. Each pair is a single "Beauty Entity."
  *   **Roles:** Within each pair, they are Agent A and Agent B. They don't know who is who once the experiment starts.
  *   **Materials:**
      *   5 Coin Flip cards (3 Tails, 2 Heads—wait, no, keep it 50/50 per group, so 5 coins).
      *   10 Envelopes (sealed). Inside are role cards: "Monday Waker" or "Tuesday Waker" (depending on coin).
      *   Poker chips or candy (about 20 per person).
      *   Blindfolds (or just a "no looking" rule).
      *   Whiteboard for scoring.

  **The Protocol (The Twist)**
  1.  **Heads:** Agent A wakes Monday. Agent B sleeps all week. (1 Awakening total).
  2.  **Tails:** Agent A wakes Monday. Agent B wakes Tuesday. (2 Awakenings total).
  3.  **Amnesia:** When an agent wakes, they don't know if they are A or B, and they don't know the day. They just know they are awake.

  **Minute-by-Minute Timeline (75 mins)**

  *   **00-10: Intro & Pairing.**
      *   Explain the protocol. Emphasize: "You are a team. You share a payoff."
      *   Hand out the "Pre-Sleep Contract."
  *   **10-20: The Pre-Sleep Bet (The Halfer Zone).**
      *   Before the coin is flipped, the pair must agree on a joint strategy *as planners*.
      *   **Rule:** They get 10 points if the *Coin* is guessed correctly. 0 if wrong.
      *   *Expected Behavior:* Since it's a fair coin, most will hedge or pick Heads/Tails arbitrarily. This is the "Outside View."
  *   **20-30: The Sleep (Simulated).**
      *   Pairs separate. Flip coins (you do this secretly or have them draw from a bag).
      *   Distribute envelopes. If Heads, give Agent B a "Stay Asleep" card (they sit out or observe silently). If Tails, both get waking envelopes.
      *   *Crucial:* They cannot communicate once envelopes are opened.
  *   **30-50: The Waking Phase (The Thirder Zone).**
      *   "Wakers" open envelopes. They see "You are awake."
      *   **New Rule:** They now place an *In-Game Bet*.
      *   **Payoff:** You get 1 point for every *awakened agent* who guesses right. You lose 1 point for every *awakened agent* who guesses wrong.
      *   *The Trap:* If Tails, there are two of you betting. If you both guess Tails, you get +2. If you both guess Heads, you get -2.
      *   This forces them to reason about *centered worlds* (awakenings) rather than *uncentered worlds* (coins).
  *   **50-65: Reveal & Score.**
      *   Reveal coins. Count points.
      *   The teams who switched to "Tails" in the Waking Phase will have significantly higher scores than those who stuck to "50/50" or "Heads."
  *   **65-75: Debrief.**
      *   Map the Pre-Sleep Bet to Halferism (counting coin flips).
      *   Map the In-Game Bet to Thirderism (counting awakenings).
      *   Discuss the "disagreement" between their Pre-Sleep selves and Waking selves.

  **Payoff Rules (Why this works)**
  *   **Halfer Logic:** "The coin is 50/50. I should bet Heads."
      *   EV: (0.5 * 1) + (0.5 * -2) = -0.5 per coin flip. (Because Tails hits you twice).
  *   **Thirder Logic:** "I am a random awakening. 2/3 of awakenings are Tails."
      *   EV: Guess Tails. (0.5 * -1) + (0.5 * 2) = +0.5 per coin flip.
  *   The scoring scheme makes Thirder reasoning the only winning strategy *inside* the game, even though Halfer reasoning looks rational from the Pre-Sleep chair.

  **Debrief Mapping**
  *   **Pre-Sleep Contract:** Maps to the **Halfer** position. From outside the experiment, the coin is fair. No new info has been gained.
  *   **In-Game Bet:** Maps to the **Thirder** position. You have gained self-locating info ("I am awake now"). You are sampling from the set of awakenings, not coins.
  *   **The Tension:** Ask them: "Did your belief change, or did your betting odds change?" This gets at the core credence vs. decision theory debate.

  **Honest Note on Limitations**
  Be sure to tell them: "This isn't real amnesia." They know they just sat there for 10 minutes. Real SB relies on the *actual* absence of memory linking the wakings. Here, the social constraint (no talking) is doing the heavy lifting. Also, this models *team* decision theory, which some argue isn't the same as individual credence.

  **Predictable Failures (First Run)**
  1.  **Envelope Cheating:** People will try to feel the cards or mark the envelopes. Use opaque sleeves.
  2.  **Signaling:** Agents will try to cough or tap to indicate "I'm the Tuesday person." Enforce strict silence during the waking phase.
  3.  **Refusal to Maximize:** Some philos will argue it's "irrational" to bet Tails becuase the coin is fair, even if it loses them points. Let them lose. It's a good lesson.
  4.  **Confusion on Roles:** Agent B (Tuesday only) might figure it out if they realize they didn't wake Monday. Remind them they have amnesia—they don't know if they slept through Monday or if it's just Monday now.

