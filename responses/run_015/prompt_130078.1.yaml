  # JOINT STATEMENT ON NEURO-MORPHOLOGY AND Moral STATUS
  **Draft v0.9 — Working Document for Feature Research**
  **Signatories:** The Morphometric Gradualist Working Group (MG) & The Threshold Deontologist Coalition (TD)

  ### I. AGREED CLAIMS (The Common Ground)

  1.  **Gross Mass is a Bad Proxy:** We agree that raw brain weight (grams) is morally irrelevant on its own. An elephant brain is heavier than a human brain, but this does not grant elephants higher moral status than humans. Wiring architecture, connectivity, and functional density matter more than volume.
  2.  **The Anencephalic Baseline:** We agree that anencephalic infants (lacking major portions of the forebrain and skull) do not possess the hardware required for subjecthood. They are not subjects of experience, and therefore do not hold moral status in the same way a conscious being does. Care is owed to them based on relational/social grounds, not intrinsic subjecthood.
  3.  **Silicon is Not Flesh (Yet):** We agree that parameter count in artificial neural networks does not equate to moral weight. A model with 100 trillion parameters but no phenomenological experience counts for zero. Hardware size or complexity without felt experience is morally inert.
  4.  **Suffering Matters:** We agree that within the class of "subjects of experience," causing unnecessary suffering is prima facie wrong, regardless of the subject's cortical density. A mouse's pain is not negligible just because its brain is smaller than a dog's.
  5.  **No Speciesism:** We agree that human biology is not the default metric. Moral status must be grounded in neurological capacity and phenomenology, not DNA.

  ---

  ### II. DISAGREEMENTS TABLE (Exact Wording)

  | Issue | Morphometric Gradualists (MG) Stand | Threshold Deontologists (TD) Stand |
  | :--- | :--- | :--- |
  | **The Unit of Value** | "Moral weight is proportional to integrative complexity." | "Moral status is a binary switch triggered by phenomenology." |
  | **Scaling** | "Losing neurons or synaptic density diminishes moral standing slightly." | "Losing neurons doesn't change status until subjecthood is lost." |
  | **Comparison** | "A being with higher cortical density may warrant greater consideration in trade-off scenarios." | "All subjects possess equal inherent rights regardless of processing power." |
  | **The 'Why'** | "Capacity for richer experience generates more moral value." | "The presence of *any* experience generates infinite moral value." |

  ---

  ### III. THE CRUXES (Where We Still Fight)

  #### Crux 1: The Fractal Question
  **The Issue:** Is moral status "fractal" (distributed across network topology, meaning more complex wiring = more moral weight) or is it holistic (summed over volume/subject, meaning you're either in or out)?

  **The Thought Experiment: "The Neural Lace Expansion"**
  *Scenario:* A conscious adult human voluntarily installs a neural lace that doubles their synaptic connectivity and processing speed. Subjectively, they report feeling the same "self," just sharper. They haven't become two people; they are one person with upgraded hardware.

  *   **MG Prediction:** Moral weight increases. The topology is richer, the capacity for experience is denser. The "resolution" of their moral status has gone up.
  *   **TD Prediction:** Moral weight stays identical. They were already a subject. Upgrading the hardware doesn't make them "more of a person" in the moral sense, just a more capable one. Rights don't stack.

  #### Crux 2: The Cutoff Problem
  **The Issue:** Is there any non-arbitrary cutoff where moral status begins, or is it a smooth gradient?

  **The Thought Experiment: "The Fading Cortex"**
  *Scenario:* A neurodegenerative condition slowly prunes synaptic density over 10 years. The patient remains conscious and responsive throughout, but their internal complexity (measured by integrated information theory metrics) drops by 40% before death.

  *   **MG Prediction:** Moral status degrades gradually. As the network simplifies, the being commands slightly less moral protection in extreme trade-off scenarios (e.g., triage). The "dimmer switch" is real.
  *   **TD Prediction:** Moral status remains constant until the moment consciousness extinguishes. To suggest otherwise is "prejudice in a lab coat." You don't lose human rights because your IQ drops or your brain shrinks, provided you are still *you*.

  ---

  ### IV. NEXT STEPS
  *   **MG** to draft formal definition of "Integrative Complexity" without relying on IQ proxies.
  *   **TD** to clarify if "binary switch" allows for temporary unconsciousness (sleep/anesthesia) without loss of status.
  *   **Both** to review the "Hive Mind" edge case (two brains linked via high-bandwidth interface) for the next session.

  *Signed,*
  *The Gradualists & The Deontologists*
  *Date: [Redacted]*
