answer: |-
  **The Origin Inventory**

  Answer based on your gut reaction to the scenario, not what sounds scientific. Choose the option that feels most true.

  **1. The Single Letter.** A scientist changes one DNA base pair in the sperm before conception. The child looks and acts exactly as you do.
  A) That is still me.
  B) That is definitely not me.
  C) There is no fact of the matter.

  **2. The Half-Swap.** Half the DNA in the sperm is replaced with different sequences. The child is recognizably human but looks different.
  A) That is still me.
  B) That is definitely not me.
  C) It depends on where the swap happens.

  **3. The Duplicate.** A different sperm cell is used, but it carries a base-pair-perfect copy of your father's original genome.
  A) That is still me.
  B) That is a different person with my face.
  C) The question is meaningless.

  **4. The Empty Shell.** Your father's DNA nucleus is placed into a donor egg's cytoplasm (mitochondria).
  A) I am still me.
  B) I am a different person.
  C) Only if the mitochondria affect personality.

  **5. The Split.** The zygote splits into identical twins. One dies at birth; you survive.
  A) I could have been the one who died.
  B) I am necessarily the survivor.
  C) We were both me until the split.

  **6. The Delay.** The same sperm and egg fuse forty minutes later than they did.
  A) That is still me.
  B) That is a different person.
  C) Time doesn't matter for identity.

  **7. The Location.** The same sperm and egg fuse in a dish instead of the Fallopian tube.
  A) That is still me.
  B) That is a different person.
  C) Location is irrelevant.

  **8. The Reconstruction.** Gametes are synthesized years later from your own skin cells to conceive you.
  A) That is still me.
  B) That is a clone, not me.
  C) Origin source doesn't matter.

  **9. The Truth.** Is there a correct answer to whether you could have started differently?
  A) Yes, absolutely.
  B) No, it's vague.
  C) Yes, but we can't know it.

  ***

  **Scoring Key**

  Tally your answers. Do not sum them; look for the dominant pattern.

  *   **Mostly B (Strict Origin):** You lean toward **Essentialism**. You believe specific historical facts (cells, timing, location) fix your identity. If the material changes, you vanish.
  *   **Mostly A (Loose Origin):** You lean toward **Anti-Essentialism** or **Animalism**. You believe identity survives changes to the starting conditions, provided the resulting organism is continuous with you.
  *   **Mostly C (Vague/Null):** You lean toward **Deflationism**. You suspect the question lacks a truth condition. Identity is a concept, not a metaphysical fact.
  *   **Mixed A/B on Q3 (Duplicate):** If you chose B here but A on Q1, you are a **Genome Essentialist** (code matters, cells don't). If you chose B on both, you are a **Gamete Essentialist** (specific cells matter).
  *   **Mixed A/B on Q6/7 (Timing/Place):** If you chose B here but A on Q3, you hold a **Spatiotemporal View** (the event matters, not just the materials).

  ***

  **Taxonomy of Origins**

  *   **Does origin fix identity?**
      *   **No:** *Plain Anti-Essentialism.* (You could have come from elsewhere.)
      *   **Yes:** *Essentialism.*
          *   **Is the fact determinate?**
              *   **No:** *Deflationary.* (No fact of the matter.)
              *   **Yes:** *Realist.*
                  *   **What is the essential property?**
                      *   **The Organism:** *Animalism.* (You are this living body now.)
                      *   **The Origin Event:** *Historical Essentialism.*
                          *   **Do specific cells matter?**
                              *   **No:** *Genome Essentialism.* (Code suffices.)
                              *   **Yes:** *Gamete Essentialism.* (Specific particles required.)
                                  *   **Does timing/location matter?**
                                      *   **No:** *Material Only.* (Same gametes, any time.)
                                      *   **Yes:** *Spatiotemporal.* (Exact event required.)

  ***

  **Notes on the Logical Space**

  **1. Empty Cells and Incoherence**
  You suspected the "Sperm matters, Egg doesn't" box would be empty. You are correct. While sperm provide the triggering mechanism, the egg contributes the mitochondria, cytoplasm, and initial cellular machinery. Intuitively, swapping the egg's body while keeping the nucleus feels like a stronger identity break than swapping the sperm's tail, yet few respondents claim sperm are essential while eggs are disposable. This asymmetry usually collapses into "Both matter" or "Neither matters." Similarly, the combination of "Genome Identical but Timing Essential" is likely incoherent rather than merely unpopular. If the genetic code is identical, insisting the *minute* of fusion matters requires believing in a metaphysical "haecceity" of the event independent of its material content. Most people who care about timing care because they think the material configuration changes over time; if the material (genome) is held constant, the timing distinction loses its grip.

  **2. Collapses and Noise**
  Be warned: **Genome Essentialism** and **Gamete Essentialism** will collapse for most readers unless Question 3 (The Duplicate) is doing heavy lifting. In the actual world, specific gametes always carry unique genomes. Without the sci-fi case of a duplicate genome, respondents cannot separate the cell from the code. If your group answers inconsistently on Q3 versus Q1/Q2, treat them as undecided rather than holding a nuanced view. Regarding the "Noise" group (those who land on no leaf): if a respondent answers "Yes, I exist" to the Half-Swap (Q2) but "No, I don't" to the Single Letter (Q1), they are failing the Sorites test. Do not treat this as a new philosophical position; it is cognitive noise. To flush this out, add a follow-up asking them to identify the exact cutoff point. If they cannot, they are effectively Deflationists regardless of their earlier "Yes/No" claims. Treat inconsistent patterns as **Deflationary** by default; inconsistency suggests they sense the vagueness they deny.
