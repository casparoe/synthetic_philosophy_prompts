  2. **Claim 2** — He details the hybrid nature of all-or-none pulses versus analog thresholds, though "digital-style error correction" modernizes his redundancy arguments.
  3. **Claim 1** — He compares the brain to EDVAC extensively but concludes they differ fundamentally; this is a common oversimplification of his structural comparison.
  4. **Claim 5** — He developed self-reproducing automata theory concurrently, but attributing the "universal constructor" role specifically to the brain conflates his two distinct projects.
  5. **Claim 4** — He argued for statistical logic and probability, but "Bayesian sampling" is modern terminology retrofitted to his general notes on uncertainty.
  6. **Claim 6** — "Variational free energy" and "reservoir computing" are 21st-century concepts anachronistically projected onto his lectures about unreliable components.

  **Most wrongly cited:** Claim 1 gets cited most wrongly, as pop-science frequently ignores his explicit conclusion that the brain is *not* a digital computer despite the structural similarities.
  **Drop entirely:** Claim 6 should be dropped, as it grafts specific modern theories (Friston/Reservoir) onto his work that have no textual basis beyond a vague shared interest in noise.
