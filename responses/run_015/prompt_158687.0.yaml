      *   *Let's go with the "Insurance" variable.* Case (d) said "insurance available and affordable." New case says "no affordable way."
      *   *Discriminating Case:* A natural disaster destroys homes. Insurance was theoretically available on the market but cost 40% of income (unaffordable). Is the resulting inequality between those who sacrificed everything to pay it and those who didn't unjust?

  5.  **American vs. European Model (Task 5):**
      *   *American:* Process-focused, mobility, tolerance of outcome gaps.
      *   *European:* Social solidarity, floor, anti-dependence, status equality.
      *   *Commentator's Lean:* She rejects inheritance (c) and status hierarchy (e). She accepts market wages (b) and *insured* risk (d). This is a hybrid, but the emphasis on "dependent class" and "decent floor" leans European (Relational/Social Democratic).
      *   *Defense:* The European model protects human dignity better.
