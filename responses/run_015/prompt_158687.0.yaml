  6.  **Drafting the Response (Iterative refinement):**

      *   *Task 1 (Prediction & Rule):*
          *   Verdict: Unjust.
          *   Rule: Inequality is unjust if it results from brute luck (uninsurable risk) or generates relations of social dependence/stigma, even if initial choices were voluntary.
          *   Refinement: "Inequalities arising from voluntary choices are just *only if* agents had reasonable access to risk-mitigation and the outcome does not establish a relation of social inferiority."

      *   *Task 2 (Alternative Rules):*
          *   Rule 1: Strict Voluntarism. (Verdict: Not Unjust). Focuses on the "choice was real" aspect.
