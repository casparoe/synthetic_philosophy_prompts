          *   Rule 3: Relational Egalitarianism. (Verdict: Unjust for the stigmatized, indeterminate for others). Focuses on "dependent class."
          *   *Distinction:* The sub-group below the floor is unjust under Sufficientarianism. The sub-group above might be just under Sufficientarianism but unjust under Relational (due to "dependent class" marking).

      *   *Task 3 (Analogue & Underdetermination):*
          *   Closest: (d) is the structural twin, but (e) is the moral twin.
