      *(Self-Correction during drafting)*: Look closely at (d). "Insurance... available and affordable." This is a *necessary condition* for the "Not Unjust" verdict in (d). The New Case explicitly says "no affordable way to insure." This is the smoking gun. The rule is likely Luck Egalitarian with a Relational constraint.
