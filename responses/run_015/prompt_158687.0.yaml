          *   Principles: 1. Responsibility (you chose it). 2. Fair Opportunity to Avoid Harm (you couldn't insure).

      *   *Task 4 (Discriminating Case):*
          *   Need to split "Uninsurable Risk" from "Social Stigma."
          *   Case: High-income freelancers. Work vanishes due to tech. No insurance. They fall back on family wealth. No stigma, no poverty.
          *   If she says "Not Unjust," she cares about Status/Poverty. If she says "Unjust," she cares about Brute Luck/Insurance principle purely.
          *   *Wait, better:* Split the "Below Floor" from "Dependent Class."
          *   Case: Workers lose jobs, fall below floor, but receive anonymous state aid (no stigma, no dependence).
          *   If Unjust -> Sufficientarian. If Not Unjust -> Relational.
          *   *Actually, the prompt asks to separate the rules still in play.* The main tension is between "Voluntariness of initial choice" (Libertarian lean) vs. "Conditions of Responsibility" (Luck Egalitarian).
