  The implication `Contact(Table) -> Displace(Contents)` fell outside the top-N candidate set. The inference engine operates on a hard latency budget to maintain control loop stability. Checking all logical consequences of an action exceeds the 40ms cycle time, causing watchdog timeouts. Widening the candidate window to capture low-salience implications violates p99 latency SLAs. The system prioritized high-frequency implications (wall collision) over low-frequency coupling (wheeled furniture). This is a known trade-off: the variant that ignores implications fails safety checks; the variant that deduces all never finishes thinking. We optimized for liveness.

  **CONTRIBUTING FACTORS**
  1.  **Salience Debt Amortization:** The dashboard recorded the skipped implication as accrued debt. The visualization amortized this liability over time, displaying a green status despite outstanding logical obligations. The debt came due upon physical contact. The accounting method assumes debt decays, but logical obligations remain binary until resolved.
