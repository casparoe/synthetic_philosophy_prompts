  3.  **Feature Sparsity:** The property `Has(Caster)` existed in the object model, but the implication `Has(Caster) -> Low(Friction)` was not indexed against the `Move` action. The critical fact was isotropic; it depended on global context not captured in local feature vectors. Any fact could be relevant to any action depending on background theory. No feature existed for "object likely to drag heater." The system cannot index facts it cannot anticipate. We operate under the assumption that salience is local, but the incident proves salience is distributed across the entire knowledge base.

