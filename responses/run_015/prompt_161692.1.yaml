answer: |-
  You have identified a genuine fault line in the philosophy of language. You are not lumping three things together arbitrarily; you are spotting the friction between **Speaker Meaning** (what the mind intends) and **Hearer Uptake** (what the social context delivers).

  There is no single, universally agreed-upon word for "the meaning that lands without being sent," because philosophers disagree on whether that *counts* as meaning. However, there are established concepts that carve this up.

  Here is the carving, the terminology, and the answers to your specific boundary questions.

  ### 1. The Core Distinction: Speaker Meaning vs. Hearer Inference

  The standard term you found, **Implicature**, comes from Paul Grice (1975). You are correct that the classic Gricean definition requires **intention**. For Grice, if you didn't *mean* to communicate it, you didn't implicate it, even if everyone inferred it.

  However, your cases fall into two distinct buckets that philosophy treats differently. You have likely lumped **Generalized Inferences** together with **Perlocutionary Effects**.

  #### Bucket A: The "K." and "Punctual" Cases (Generalized Conversational Implicature)
  *   **The Concept:** These are **Generalized Conversational Implicatures (GCIs)**.
  *   **How it works:** These are default inferences attached to specific forms of words, regardless of specific context. "Some" implies "not all." "K." implies "dismissiveness." "Punctual/handwriting" (without mentioning skill) implies "lack of skill."
  *   **The Intent Gap:** Modern pragmatics (e.g., Stephen Levinson, Kent Bach) argues that GCIs do *not* require specific speaker intention. They are linguistic conventions. The speaker can be clueless, but the *language* carries the implication.
  *   **Does it fit?** Yes, for the reference letter and the "K." text. The meaning is in the code, not the coder.

  #### Bucket B: The "Family" and "Job Ad" Cases (Social Meaning / Perlocution)
  *   **The Concept:** These are better described as **Perlocutionary Effects** mistaken for **Illocutionary Acts**, or **Social Meaning**.
  *   **How it works:**
      *   *Illocution:* What you do *in* speaking (e.g., asserting, promising).
      *   *Perlocution:* What you do *by* speaking (e.g., scaring, offending, discouraging).
      *   When your boss says "We're a family," the *illocution* is an assertion of culture. The *perlocution* is anxiety about overtime. Your team is arguing that the anxiety *was* the message.
      *   In sociolinguistics, this is **Social Meaning**: meaning derived from group norms rather than individual intent (e.g., coded language).
  *   **Does it fit?** Yes, for the job ad and the "family" comment. This isn't linguistics; it's cultural coding.

  ### 2. The "Lying" Question

  You asked: *"People tell me that saying something literally true but misleading isn't lying — I want to know whether that's the same distinction I'm reaching for."*

  **Yes, it is exactly the same distinction.**
  In contemporary philosophy (notably the work of **Jennifer Saul**), this is the **Lying vs. Misleading** distinction.
  *   **Lying:** Asserting something you believe to be false.
  *   **Misleading:** Asserting something true while intentionally (or negligently) implicating something false.

  Regulators (like the FTC or ASA) operate on the principle of the **"Net Impression."** They do not care about the speaker's intent; they care about the **reasonable consumer's takeaway**. This is the legal costume of the philosophical concept you are looking for. In law, this is often called an **Implied Claim** or **Misleading Impression**.

  ### 3. Proposed Terminology

  Since "Implicature" is tainted by intention, and "Perlocution" sounds like a side-effect rather than a message, here is the most precise label for your arguments:

  **Normative Pragmatic Inference**

  *   **Definition:** An inference that a competent member of the linguistic/social community is *expected* to draw from an utterance, regardless of the specific speaker's mental state.
  *   **Why it fits:** It shifts the locus of meaning from the *Speaker's Mind* to the *Community's Norms*. It explains why the clueless writer is still "responsible" for the meaning: because they used a tool (language) that has public rules they ignored.

  ### 4. Answering Your Edge Cases

  Here is how this carving handles your specific boundary questions.

  **Q: Does it matter whether the hearer's takeaway was *reasonable*?**
  *   **Answer:** **Yes.** In both philosophy and law, the standard is the **Competent Hearer**.
  *   **Edge:** If one person reads "K." and thinks "They are planning my murder," that is not a Normative Pragmatic Inference; that is paranoia. If 90% of the team reads "K." as "Anger," it is a Normative Inference. The meaning exists in the statistical norm of the community, not the individual head.
  *   **Confidence:** High. (This is the standard for defamation and consumer law too).

  **Q: Does it matter whether the speaker would have endorsed it if asked?**
  *   **Answer:** **No.** This is the crux of your argument.
  *   **Edge:** If the reference writer says, "Oh no, I didn't mean she was weak!", they are reporting on their *psychology*, not the *speech act*. The speech act has left their hands. In legal terms, this is **Negligent Misrepresentation**. In philosophy, it highlights that **Public Meaning > Private Intent**.
  *   **Confidence:** High. (This is the core of the "Death of the Author" argument applied to pragmatics).

  **Q: Can it be cancelled? (e.g., "She's punctual... and brilliant.")**
  *   **Answer:** **Yes, but with residue.**
  *   **Edge:** This is the **Cancellability Test**. True implicatures can be cancelled ("Some of them came, in fact all of them did"). However, in your "punctual" case, adding "and brilliant" *cancels* the logical implication, but it does not erase the **Perlocutionary Effect**. The reader may still feel the hesitation.
  *   **Distinction:** You can cancel the *claim*, but you cannot always cancel the *vibe* (the perlocutionary effect). This is why the fight continues even after clarification.
  *   **Confidence:** Medium-High. (Pragmatics agrees on cancellability; psychology disagrees on emotional residue).

  **Q: What happens when the "speaker" is a committee or brand?**
  *   **Answer:** **Functional Intent.**
  *   **Edge:** This is the messiest area (Collective Intentionality). Philosophers like **Margaret Gilbert** or **Philip Pettit** argue groups can have intentions distinct from members. However, in your context (HR/Marketing), the "intent" is assigned functionally. If the *template* carries the implication, the *organization* bears the meaning, even if no human mind intended it.
  *   **Why:** Because the organization controls the code (the template). If you deploy a code that signals X, you signal X.
  *   **Confidence:** Medium. (Collective intentionality is a major ongoing debate in social ontology).

  ### 5. Confidence Ratings & The "Least Sure" Point

  *   **Confidence that "Implicature" is the right neighborhood:** **High (90%).** You are definitely in pragmatics.
  *   **Confidence that Gricean Intent is the blocker:** **High (95%).** Standard Griceanism requires intention; your cases violate it.
  *   **Confidence that "Lying vs. Misleading" is the same distinction:** **High (90%).** This is the standard philosophical treatment of literal truth/pragmatic falsehood.
  *   **Confidence in the "Normative Pragmatic Inference" label:** **Medium (70%).** This is a descriptive synthesis I have constructed for you from Neo-Gricean and Legal Pragmatics. It is not a dictionary term, but it accurately maps the concept.
  *   **Confidence regarding Collective Agents:** **Low-Medium (60%).** Philosophy is still fighting about whether a "company" can intend anything. However, *legal* pragmatics treats them as single agents for liability, which likely matters more for your work context.

  **The Single Point I Am Least Sure About:**
  Whether the "Family/Job Ad" cases are truly the *same phenomenon* as the "K./Punctual" cases.
  *   **Why:** "K." relies on linguistic convention (Pragmatics). "We're a family" relies on cultural power dynamics (Sociology/Political Philosophy).
  *   **The Risk:** Treating them as identical might obscure the power dynamic in the "Family" case. The "K." case is a misunderstanding of code; the "Family" case is often a **Hermeneutical Injustice** (the staff lacks the power to define the meaning of the culture).
  *   **Advice:** In your team arguments, treat the "K." cases as **Linguistic Conventions** (fixable by changing words) and the "Family/Job Ad" cases as **Cultural Norms** (fixable only by changing power structures or policies).

  ### Summary for Your Team

  When the fight starts, you can say:

  > "We are arguing about **Normative Pragmatic Inference**.
  >
  > 1.  **Intent doesn't matter:** Meaning is determined by the *reasonable hearer*, not the *clueless speaker*.
  > 2.  **It's not lying, it's misleading:** The statement is literally true, but the *Net Impression* is false.
  > 3.  **The Fix:** We cannot argue about what the writer *meant*. We must argue about what the *code* does. If the code signals 'weakness' or 'exclusion,' we must change the code, regardless of the writer's sweetness."

  This moves the argument from "You are misreading me" (Psychological) to "This signal is noisy" (Systemic).
