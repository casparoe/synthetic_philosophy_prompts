          *   If Continue to $n+1$: Pot grows.
          *   If Continue to End (8): Both get $E$, where $2E > \sum (S_n + O_n)$ generally, and specifically $E > O_n$ for all $n$ (implied by "both do better if we stayed in").
      *   **Backward Induction (The Standard Rational Solution):**
          *   Look at the last decision point (Issue 8, or just before the final payout). Let's say it's Friend's turn before Issue 8.
          *   If Friend Continues: Game ends, both get $E$.
          *   If Friend Stops: Friend gets $S_8$, You get $O_8$.
