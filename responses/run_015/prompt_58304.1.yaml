      *   *Correction:* I can't tell them to change the utility function arbitrarily. But as a philosopher, I can point out that their *actual* utility function likely includes non-monetary values they are ignoring due to "strategic" tunnel vision.
      *   *Nuance:* The prompt says "without changing formal rules." It doesn't say "without talking." Communication is key.
      *   *Specific Tactic:* The "Turn" issue. If it's my turn to defect, I need to know you won't defect next time. But if we reach the end, no one defects. The risk is highest near the end.
      *   *Solution:* **Conditional Commitment.** "I commit to continuing unless I have evidence you have defected." But this is cheap talk.
