          *   *Refining the Payoff Assumption:* The prompt says "total to split at the end grows substantially if we last the whole run." It also says "both do better if we stayed in." This implies $E > O_n$ and likely $E > S_n$ (otherwise the dissolver wouldn't "do better" by staying).
