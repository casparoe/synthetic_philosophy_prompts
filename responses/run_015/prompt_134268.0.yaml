answer: |-
  This is a brilliant collision of high-theory decision science and the messy reality of effective altruism-adjacent grantmaking. You are correctly identifying that Good's Theorem (1967) provides a *normative* bound, not a *descriptive* tool, and your seven violations are spot-on. Specifically, you are dealing with **endogenous states** (the pilot changes the political reality), **non-committal agents** (the committee), and **utility functions that depend on beliefs** (the matching donor), not just states of the world.

  Here is a 90-minute procedure designed to fit your constraints, followed by the case applications and the memo template.

  ---

  ### Part 1: The Assumption Audit (15 Minutes)
  *Before calculating anything, answer these 7 Yes/No questions. If you answer "No" to more than two, standard Value of Information (VOI) logic is broken, and you must flag this in the memo.*

  1.  **Free Info?** Is the cost of the study strictly financial, or does it include opportunity costs (delay)?
      *   *If Delay > 6 months:* **No.** (Violation 1)
  2.  **Commitment?** If the pilot returns "null," can the committee credibly commit to killing the program, or will political momentum force scale-up anyway?
      *   *If Momentum > Evidence:* **No.** (Violation 2)
  3.  **Truth-Seeking?** Is the payoff based on *actual* health outcomes, or does it depend on *reported* metrics (e.g., matching funds, reputational signaling)?
      *   *If Signaling Matters:* **No.** (Violation 3)
  4.  **External Validity?** Is the pilot measure a direct proxy for the scale-up outcome, or is the correlation unknown?
      *   *If Proxy is Weak:* **No.** (Violation 4)
  5.  **Hawthorne Effect?** Will the act of measuring change the implementation quality (e.g., extra monitoring improves performance artificially)?
      *   *If Monitoring Improves Performance:* **No.** (Violation 5)
  6.  **Single Agent?** Do the five committee members share the same prior on the program's success?
      *   *If Priors Diverge Widely:* **No.** (Violation 6)
  7.  **Fixed Menu?** Are we choosing between known options, or is the study meant to *invent* new options?
      *   *If Inventing Options:* **No.** (Violation 7)

  **Scoring:**
  *   **Mostly Yes:** Proceed to Quantitative Step.
  *   **Mostly No:** Skip Quant. Go straight to "Committee Handoff."

  ---

  ### Part 2: The 90-Minute Procedure

  #### Step 1: The "Switch" Test (Qualitative)
  *Good's Theorem Core: Info is worthless if it doesn't change the decision.*
  *   **Action:** Write down the current leading decision (e.g., "Scale Up"). Write down the specific pilot result that would force you to choose the alternative (e.g., "Effect size < 0.2").
  *   **Sufficient Answer:** If you cannot describe a specific result that would change the decision, **VOI = 0**. Stop. Recommend: *Do not fund pilot.*
  *   **Flatmate Check:** If the result that changes the decision is statistically impossible given the sample size (underpowered), **VOI ≈ 0**. Stop.

  #### Step 2: The Crude Upper Bound (Quantitative)
  *User Instinct Refined: The value of information cannot exceed the cost of being wrong.*
  *   **Formula:** $\text{Max VOI} = (\text{Value of Best Alternative} - \text{Value of Current Plan}) \times 100\%$
      *   *Note:* We assume 100% probability the info is perfect for this upper bound. Real VOI is lower.
  *   **Calculation:**
      1.  Estimate the Net Present Value (NPV) of the Scale-Up if it works.
      2.  Estimate the NPV of the Scale-Up if it fails (usually negative or zero).
      3.  Estimate the NPV of the Status Quo (not scaling).
      4.  **Bound:** If *Cost of Pilot* > (*NPV Scale-Up Success* - *NPV Status Quo*), **Stop.**
      *   *Why:* You are spending more to check the map than the detour would cost.
  *   **Sufficient Answer:** A single dollar figure comparison. If Cost > Bound, **Recommend: Do not fund pilot.**

  #### Step 3: The "Delay & Distortion" Tax
  *Adjusting for Violations 1 & 3.*
  *   **Action:** Estimate the "Cost of Waiting." (e.g., Beneficiaries denied service $\times$ 1 year).
  *   **Action:** Estimate the "Political Risk." If the pilot is noisy (Violation 4), is there a risk it returns a false positive that locks us into a bad scale-up (Violation 2)?
  *   **Sufficient Answer:** If Cost of Waiting + Political Risk > Max VOI, **Recommend: Do not fund pilot.**

  #### Step 4: The Committee Handoff
  *Addressing Violation 6 & 7.*
  *   **Action:** If the audit failed or the numbers are close, identify *whose* prior is driving the uncertainty.
  *   **Sufficient Answer:** "The decision rests on whether the Epidemiologist's skepticism or the Country Director's optimism is weighted higher. This is a values call, not a data call."

  ---

  ### Part 3: Running the Cases

  #### Case (a): School Delivery ($400k Pilot vs. $6M Scale)
  *   **Audit:** Violations 1 (Delay), 2 (Commitment risk), 4 (Proxy).
  *   **Switch Test:** Would a null result stop the $6M spend? If the program is "probably real but small," a null pilot might just be noise. If the committee scales anyway due to ministry pressure, VOI = 0.
  *   **Upper Bound:** If Scale-Up fails, loss is $6M. If it succeeds, gain is (Health Value - $6M). Max VOI is the avoided loss of $6M. $400k < $6M, so the bound passes.
  *   **Delay Tax:** 1 year delay = 1 year of no school delivery. Quantify lives/education lost.
  *   **Verdict:** **Handoff to Committee.**
      *   *Reasoning:* The math passes the upper bound, but the *commitment* assumption is weak. The memo must ask: "If the pilot is null, do we have the spine to cancel the $6M?" If the answer is "No," don't buy the pilot.

  #### Case (b): Qualitative Study ($180k, Implementation Strategy)
  *   **Audit:** Violation 7 (Fixed Menu). This is not VOI; this is **Option Generation**.
  *   **Switch Test:** N/A. There is no "true state" to reveal. There are only coherent vs. incoherent strategies.
  *   **Upper Bound:** N/A. You cannot bound the value of inventing a better strategy.
  *   **Verdict:** **Buy It (But reframe).**
      *   *Reasoning:* Do not call this "Value of Information." Call it "Design Risk Reduction." You are paying to ensure the $2M scale-up isn't operationally incoherent. This bypasses Good's Theorem entirely.

  #### Case (c): Cash + Mental Health ($250k Pilot, 2:1 Match)
  *   **Audit:** Violation 3 (Truth-Seeking). The utility function is *budgetary*, not *impact-based*.
  *   **Switch Test:** The decision isn't "Does this work?" It's "Does this clear the threshold?"
  *   **Upper Bound:** The value of the match. If Pilot Cost ($250k) < Match Revenue ($2M+), the financial VOI is massive.
  *   **The Uncomfortable Truth:** This is **Signaling Value**, not Information Value. You are buying a credential, not learning a fact.
  *   **Verdict:** **Buy It (With Disclosure).**
      *   *Reasoning:* Financially, this is a no-brainer. Epistemically, it is corrupt. You must disclose to the committee: *"This pilot is not designed to maximize learning; it is designed to unlock matching funds. There is a risk we secure funding for a program we privately doubt."*
      *   *Why you won't like it:* It admits the foundation is optimizing for budget size over truth, violating the ethos of evidence-based policy. But under a "budget maximization" utility function, it is rational.

  ---

  ### Part 4: The One-Page Memo Template

  **TO:** Program Committee
  **FROM:** [Your Name]
  **SUBJECT:** Recommendation on [Project Name] Pilot Study
  **DECISION:** [Fund / Do Not Fund / Values Call]

  **1. The "Switch" Condition**
  We should only fund this pilot if a specific result would change our decision.
  *   **Current Plan:** [e.g., Scale Up Nationally]
  *   **Pilot Result Required to Stop:** [e.g., Effect size < X, or Qualitative finding Y]
  *   **Assessment:** [Can we credibly commit to stopping if this result occurs? Yes/No]

  **2. Cost-Benefit Bound**
  *   **Cost of Pilot:** $[X]
  *   **Maximum Possible Loss Avoided:** $[Y] (If the program fails at scale)
  *   **Cost of Delay:** [e.g., 12 months of service denial]
  *   **Assessment:** The pilot cost is [within/exceeds] the maximum possible value of avoiding a bad decision.

  **3. Key Risks & Assumptions**
  *   **Statistical Power:** [Is the pilot large enough to detect the effect? If no, VOI is low.]
  *   **Political Commitment:** [Will external partners force scale-up even if pilot fails?]
  *   **Matching Funds:** [Does this pilot unlock external capital? If yes, this is a financing decision, not a learning decision.]

  **4. Recommendation**
  [Insert Verdict from Part 3].
  *If "Values Call":* "The data cannot resolve this. The decision rests on whether the Committee prioritizes [Speed of Delivery] over [Certainty of Impact]."

  ---

  ### Part 5: Judgment in Costume (For Your Eyes Only)

  You asked where you are making judgment calls in procedural costume. Here is the confession you need to keep in mind when writing the memo:

  1.  **The "Value of Switching" is Subjective:** In Step 2, estimating the "Value of Best Alternative" is not a fact. It is your guess at the Committee's utility function. If you underestimate the value of the Status Quo, you bias toward the pilot. If you overestimate it, you bias against. You are smuggling your prior into the "Upper Bound."
  2.  **The "Cost of Delay" is Ethical, Not Mathematical:** Quantifying "a year of people not getting the program" requires a value of statistical life or education year. You likely don't have one. You are using a placeholder number that feels "reasonable." That is a moral judgment, not a calculation.
  3.  **The "Commitment" Test is Political:** Asking "Will we stop if it fails?" is a question about the Committee's courage, not the pilot's design. By writing it down, you make it look like a structural constraint, but it's actually a question of institutional will.
  4.  **Case (C) Rationalization:** In the matching fund case, calling it "Signaling Value" legitimizes a potentially harmful action. You are using the framework to sanitize a decision that might violate the foundation's mission.

  **Final Advice:** When the procedure says "Handoff," write *"We cannot tell"* in the memo. It is better to be honest about uncertainty than to provide fake precision that shields the Committee from responsibility. Good's Theorem tells us that information is only valuable if we are willing to act on it. If the Committee isn't willing to act, the theorem says the information is worthless. Your job is to make them say that out loud.
