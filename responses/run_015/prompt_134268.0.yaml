prompt: |-
  hey — I'm taking a decision theory reading course this term (phil dept, cross-listed with the econ phd field course: Savage, then Jeffrey, then a couple weeks on value of information and scoring rules) and I also have a paid internship at a small global health foundation where my actual job is drafting the funding memos. Roughly three or four times a month I write the section that answers "should we pay for a pilot / feasibility study first, or just decide now and put the money straight into the program?" Typical numbers: a $150k–$600k study now versus a $2M–$8M scale-up decision a year later. I get about a day per memo, I can't fit a model or run simulations in that time, and it goes to a five-person program committee (two ex-finance, an epidemiologist, one of our country directors, and the exec director) who will not read an equation but will definately ask "what would we do differently if it came back null?" and "isn't it always better to know?". My flatmate does psych research and keeps teasing me that all our pilots are underpowered, which is making me weirdly paranoid about the noisy-signal part.

  So: we did Good's theorem last week — the result that for an expected-utility maximizer information you don't have to pay for can't be bad news in expectation, and is worth exactly zero if it couldn't change what you'd do anyway — and I want to turn it into a procedure I can actually run on a memo in ninety minutes, including the parts where the theorem doesn't apply to us. The ways our setup breaks its assumptions, as far as I can tell: (1) the study is never free, and the real cost is delay, since a year of waiting is a year of people not getting the program; (2) we can't unsee the result — the committee can't commit to the choice it would have made without it, someone will reopen the decision, and the country director's ministry co-funds based on the headline number, so the result partly creates the situation we then act in rather than just describing it; (3) our payoff isn't purely a function of the true effect, because we have a matching funder who doubles grants in areas where our evidence base *looks* promising, so what we believe is partly what we're paid for; (4) the pilot measures a proxy (one district, one implementer) for the thing we care about (national scale, government delivery), and the correlation between the two is itself unknown; (5) the measurement perturbs — intensive baseline surveys and an evaluation team in the district change how the program runs; (6) the decision maker is five people with different priors, not one expected-utility maximizer, so "the" value of the information isn't even well defined; and (7) sometimes the study isn't about a state of the world at all, it's about what options we can even describe (a qualitative study that tells us which of three implementation strategies is coherent), which feels like it's outside the theorem's scope entirely.

  What I want from you: an ordered checklist I can work through, where each step says what counts as a sufficient answer at that step, including a deliberately crude quantitative step that gives me an upper bound on the value of the information without a full model (my instinct is: the most I could gain by changing my mind is the whole value, so if the study costs more than the gain from switching to my second-best option under the most favorable possible result, stop right there — and note that this is generous, since real information is worth less than perfect information). Tell me where the procedure just returns "don't buy it", where it returns "buy it, obviously", and where it has to hand the question to the committee because it's a values call rather than a factual one. I want an explicit assumption audit at the front that translates Good's theorem's preconditions into yes/no questions I can answer about a real grant. Then run it on three cases: (a) a $400k cluster-randomized pilot in one district of a school-based delivery program where we already think the effect is probably real but small and the live question is whether to go national at $6M; (b) a $180k qualitative study of why front-line health workers ignore a protocol, where the decision is which implementation strategy to adopt and the study won't estimate any effect at all; (c) a $250k pilot of a cash-transfer-plus-mental-health package that our biggest donor has promised to match two-to-one if the pilot clears a headline threshold — my honest belief is the true effect is below the threshold but the pilot is noisy enough that it might clear it anyway. One of those should come out with an answer I won't like (I have a feeling it's (c), and I want you to say plainly whether "buying the result to unlock the match" is a legitimate use of the framework or a violation of its assumptions that I'd have to disclose to the committee). Also give me a one-page version I can paste into the memo template, and a short paragraph on which steps are really just me making a judgment call in procedural costume — I'd much rather write "we can't tell" in a memo than a number with fake precision.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Student in a decision theory reading course (Phil/Econ PhD level) + Intern at a global health foundation.
      *   **Task:** Drafting funding memos (specifically the "pilot vs. scale" section).
      *   **Constraints:** ~1 day per memo, no time for complex modeling/simulations, audience is a 5-person committee (mixed backgrounds, no equations, practical questions).
      *   **Intellectual Framework:** Just learned Good's Theorem (Value of Information = Expected Utility with Info - Expected Utility without Info $\ge$ Cost of Info).
      *   **Problem:** Good's Theorem assumptions are violated in at least 7 specific ways in their real-world context (costly info, delay costs, non-commitment, reputational/matching payoffs, proxy measures, Hawthorne effects, group decision-making, option generation).
      *   **Goal:** A 90-minute procedural checklist based on Good's Theorem but adapted for these violations. Needs an assumption audit, a crude quantitative upper bound, specific application to three cases (one of which should be uncomfortable), a one-page memo template, and a reflection on where judgment calls are masked as procedure.

  2.  **Deconstruct Good's Theorem vs. Reality:**
      *   *Good's Theorem:* Free info, perfect rationality, single agent, fixed state space, info doesn't change state, utility depends only on state + action.
      *   *User's Reality:* Costly info (money + time), committee (multiple priors), info changes context (politics/matching), proxy measures (uncertain correlation), Hawthorne effects, option generation (state space isn't fixed).

  3.  **Develop the Procedure (The "90-Minute VOI Checklist"):**
      *   *Step 1: Assumption Audit.* Translate the 7 violations into Yes/No questions. If too many "No"s, the theorem doesn't apply directly.
      *   *Step 2: The "Switch" Test (Qualitative).* Good's theorem says info is worthless if it doesn't change the decision. So, ask: "What result would make us do the *other* thing?" If no such result exists, VOI = 0.
      *   *Step 3: The Crude Upper Bound (Quantitative).* User's instinct is correct. Max Value of Perfect Information (VOPI) = Probability of Switching $\times$ Gain from Switching. Since we don't have probs, use the "Best Case Switch" bound. If Cost > Max Possible Gain from Switching, stop.
      *   *Step 4: The "Delay & Distortion" Tax.* Subtract the cost of waiting (lives lost/opportunity cost) and the risk of political distortion (matching funds trap).
      *   *Step 5: The Committee Handoff.* Identify where values differ (priors) vs. facts.

  4.  **Drafting the Checklist Steps (Iterative Refinement):**
      *   *Audit:* Make it sharp. "Can we commit to ignoring the result?" "Does waiting cost lives?"
      *   *Quant:* Keep it arithmetic. $(\text{Scale Up Value} - \text{Status Quo Value}) \times \text{Max Prob of Switch}$. Actually, simpler: If Cost > (Benefit of Best Action - Benefit of Second Best), it's a hard no. Even simpler: The user suggested "gain from switching to second-best option under most favorable result." Let's refine that. The maximum value of information is the difference between the best action *with* info and the best action *without* info. A safe upper bound is the difference between the best possible outcome and the worst possible outcome of the current leading choice, weighted by the probability the info changes the mind. Let's stick to the user's intuition but formalize it: *Upper Bound = (Value of Optimal Decision - Value of Current Best Decision) assuming the info forces the optimal decision.* Actually, the simplest bound is: *VOI $\le$ Probability(Change Decision) $\times$ (Payoff(Switch) - Payoff(Stay)).* Since we don't know Prob, assume Prob=1 for the upper bound. So, *Max VOI = Payoff(Switch) - Payoff(Stay).* If Cost > Max VOI, reject.
      *   *Delay:* Need to quantify "cost of delay." Lives per month $\times$ value per life? Or just budget burn? Let's suggest a "Delay Penalty" estimate.
      *   *Matching Funds:* This is the tricky one (Case C). It turns the utility function into a function of *belief* rather than *truth*. This violates the "truth-seeking" assumption of standard VOI. Needs a flag.

  5.  **Applying to the Three Cases:**
      *   *(a) School Delivery ($400k pilot, $6M scale):* Standard VOI. High cost of pilot relative to scale? $400k is ~7% of $6M. If prior is "probably real but small," will a pilot change the mind? If the pilot is noisy (underpowered), it might not. *Verdict:* Likely "Don't Buy" or "High Risk."
      *   *(b) Qualitative Study ($180k):* This is "Option Generation" (Violation 7). Good's theorem assumes fixed actions. Here, the action *is* to define actions. Standard VOI fails. *Verdict:* "Handoff to Committee" (Values/Strategy call).
      *   *(c) Cash + Mental Health ($250k pilot, 2:1 Match):* This is the "uncomfortable" one. The value isn't health; it's *unlocking funds*. This is "gaming the metric." It violates the spirit of evidence-based policy even if it maximizes budget. *Verdict:* "Buy it" financially, but flag as "Strategic Signaling" not "Learning." This is the one the user won't like.

  6.  **Developing the One-Pager:**
      *   Needs to be clean, non-technical, addressing the Committee's specific questions ("What would we do differently?", "Isn't it always better to know?").
      *   Structure: Recommendation, The "Switch" Condition, Cost-Benefit Bound, Risk Flags.

  7.  **Reflecting on "Judgment in Costume":**
      *   Where am I faking precision?
      *   Estimating the "Gain from Switching" is subjective.
      *   Estimating the "Cost of Delay" is ethical, not mathematical.
      *   The "Probability of Switching" is often a guess.
      *   Need to be honest about this in the final paragraph.

  8.  **Review against Constraints:**
      *   90 minutes? Yes, checklist is designed for speed.
      *   No equations in memo? Yes, one-pager is text-based.
      *   Address all 7 violations? Yes, in the audit.
      *   Case (C) honesty? Yes, must call out the "matching fund trap."

  9.  **Refining the Tone:**
      *   Professional, academic but practical, empathetic to the intern's position (caught between theory and reality).
      *   Acknowledge the flatmate's critique (underpowered pilots) – incorporate statistical power into the "Switch" test.

  10. **Final Polish:**
      *   Ensure the distinction between *Value of Information* (learning) and *Value of Signaling* (matching funds) is clear in Case C.
      *   Make sure the "Upper Bound" calculation is robust enough to be useful but simple enough for 90 mins.
      *   *Self-Correction on Case A:* $400k pilot vs $6M scale. If the pilot fails, do we abandon? If yes, VOI is high. If we scale anyway (sunk cost/politics), VOI is low. Need to emphasize the *commitment* aspect.
      *   *Self-Correction on Case C:* Is it legitimate? It's legitimate for *budget maximization*, illegitimate for *impact maximization*. The memo must distinguish these goals.

  11. **Drafting the Content:** (Mental outline of the response structure)
      *   Intro: Validate the tension between Savage/Jeffrey and the real world.
      *   Part 1: The Assumption Audit (The 7 points translated).
      *   Part 2: The 90-Minute Procedure (Steps 1-5).
      *   Part 3: The Three Cases (A, B, C).
      *   Part 4: The One-Page Memo Template.
      *   Part 5: The "Judgment in Costume" confession.

  12. **Final Check:** Does this answer the prompt's specific request for "where the procedure returns don't buy/buy/handoff"? Yes. Does it address the "matching fund" ethical dilemma? Yes.

  *(Self-Correction during drafting)*: Make sure the quantitative step is truly "crude." Don't ask for expected values. Ask for "Maximum Possible Regret." If Cost > Max Regret, stop. That's the simplest bound.
  *Regret = (Outcome of Best Decision with Info) - (Outcome of Best Decision without Info).*
  *Upper Bound = (Best Possible Outcome) - (Worst Outcome of Current Plan).*
  Actually, the user's instinct was: "if study costs more than the gain from switching to my second-best option." Let's stick close to that.
  *Max VOI = (Value of Alternative Action - Value of Current Action) IF the Alternative turns out to be right.*
  Okay, let's write it.

  *(Final thought on Case C)*: The prompt asks: "say plainly whether 'buying the result to unlock the match' is a legitimate use of the framework or a violation." I need to be firm. It's a violation of the *epistemic* assumption but valid for *budgetary* utility. It must be disclosed as "Signaling Value" not "Information Value."

