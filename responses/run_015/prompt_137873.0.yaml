answer: |-
  # The Illocutionary Compliance Filter (ICF)

  **Purpose:** To distinguish between lines that *describe* reality (safe to ship) and lines that *change* reality (require Legal or Human review).
  **Time Budget:** 10 minutes per message.
  **Users:** Content Designers, UX Writers.

  This procedure treats every sentence as a potential tool that alters the relationship between the insurer and the member. It ignores grammar (passive/active) and focuses on **consequence**.

  ### The Procedure

  Run every sentence through these five questions in order. If you answer **YES** to any question, follow the arrow. If you answer **NO**, move to the next question. If you finish all five with **NO**, the line is clear to ship.

  #### 1. The Status Change Test (Illocutionary Force)
  **Question:** Does saying this sentence *make* something true that wasn't true before I wrote it?
  *   *Examples:* "Your claim is approved" (Makes it approved), "Coverage ends" (Makes it end).
  *   *Contrast:* "Your claim was approved" (Reports a past event), "Coverage is ending" (Reports a scheduled event).
  *   **YES:** → **Send to Legal.** (This is a Performative Act.)
  *   **NO:** → Go to Q2.

  #### 2. The Reliance Test (Shadow Performatives)
  **Question:** If the user reads this and relies on it as proof, would we be in trouble if it turned out to be slightly wrong?
  *   *Context:* Sentences that look like reports but function as receipts or guarantees.
  *   *Example:* "Your complaint has been logged." (Looks like a report, acts as a guarantee of entry.)
  *   *Example:* "A team member will call you." (Looks like a prediction, acts as a promise.)
  *   **YES:** → **Send to Legal.** (This is a Shadow Performative.)
  *   **NO:** → Go to Q3.

  #### 3. The Negation Test (Deniable Acts)
  **Question:** Does this sentence deny a commitment in order to imply one?
  *   *Context:* Sentences built to be deniable.
  *   *Example:* "We are not denying coverage, but..." (Implies denial.)
  *   *Example:* "I can't promise we will pay." (Implies we might not.)
  *   **YES:** → **Send to Legal.** (This is an Indirect Refusal/Promise.)
  *   **NO:** → Go to Q4.

  #### 4. The Authority Test (Felicity Conditions)
  **Question:** Do we actually have the power to make this statement true in this specific channel?
  *   *Context:* Even if the grammar is a report, does it require specific authority to be valid?
  *   *Example:* "You are eligible for Medicare." (Only specific systems can determine this.)
  *   *Example:* "This email constitutes legal notice." (Requires specific delivery protocols.)
  *   **YES:** → **Send to Legal.** (Risk of Misfire: The act is void because the context is wrong.)
  *   **NO:** → Go to Q5.

  #### 5. The Sincerity Test (Abuse vs. Act)
  **Question:** Is this statement technically true but functionally hollow or misleading?
  *   *Context:* Sentences that perform an act (like "listening") without the intent to follow through.
  *   *Example:* "We value your feedback." (When we don't.)
  *   *Example:* "We've noted your concern." (When "noted" means "ignored".)
  *   **YES:** → **Escalate to Product/Leadership (Human Review).** (This is an Abuse of the speech act. It's not illegal, but it breaks trust.)
  *   **NO:** → **Clear to Ship.**

  ***

  ### Theoretical Trade-Offs

  To make Austin's *How to Do Things with Words* fit into a 10-minute checklist, I had to make specific cuts.

  **What I Dropped:**
  1.  **The Constative/Performative Binary:** Austin eventually admitted there is no clean line between describing and doing. I kept the distinction anyway because your Legal team requires it. The procedure treats it as a spectrum (Q1 is pure performative, Q2 is the gray zone).
  2.  **The Taxonomy of Illocutions:** I did not ask you to identify if a line is a *verdictive*, *exercitive*, or *commissive*. It doesn't matter. All that matters is if it creates liability.
  3.  **Sincerity Conditions as Legal Risk:** In theory, an insincere promise is still a promise (Abuse, not Misfire). In practice, I routed "Abuse" (Q5) to Human Review, not Legal. Legal cares about the commitment; Leadership cares about the hypocrisy.
  4.  **Perlocutionary Effect:** I ignored what the user *feels* (scared, relieved) unless it leads to reliance (Q2). You cannot engineer emotion in 10 minutes; you can engineer liability.

  **What I Refused to Drop:**
  1.  **Felicity Conditions (Context):** A sentence isn't an act in a vacuum. "Coverage ends" is a fact in a PDF, but an act in an SMS. Q4 ensures the *context* supports the *text*.
  2.  **The Misfire/Abuse Distinction:** This is critical. A **Misfire** (Q1/Q4) means the act didn't happen (e.g., you tried to approve a claim but lacked authority). An **Abuse** (Q5) means the act happened but was unethical (e.g., you "listened" but didn't care). The procedure separates these because they require different fixes (Code/Process vs. Policy/Culture).
  3.  **Implicit/Indirect Acts:** Q2 and Q3 specifically target the "Shadow" and "Deniable" acts you mentioned. Austin's later work on implication is more important here than his early work on explicit verbs.

  ***

  ### Test Run

  Here is the procedure applied to your three actual lines.

  #### Line 1: "Your information is safe with us."
  *   **Q1 (Status Change):** No. It describes a state of security.
  *   **Q2 (Reliance):** **YES.** If a user reads this and a breach occurs, they relied on this guarantee. It functions as a warranty.
  *   **Result:** **Send to Legal.**
  *   **Analysis:** This is a **Shadow Performative**. Grammatically, it is a constative report ("Information is safe"). Functionally, it is a commissive act ("We promise to protect"). In health insurance, "safe" is an absolute term that is technically impossible to guarantee. This is high-risk.

  #### Line 2: "This decision may be appealed within 180 days."
  *   **Q1 (Status Change):** No. It reports a right that already exists in the contract.
  *   **Q2 (Reliance):** No. It does not promise a successful appeal, only the right to attempt one.
  *   **Q3 (Negation):** No.
  *   **Q4 (Authority):** **YES.** The "180 days" is a regulatory fact. If your system says 180 but the state law says 90, the act of informing is a **Misfire** because the authority/context is wrong.
  *   **Result:** **Send to Legal.** (Specifically for fact-checking the number).
  *   **Analysis:** This is a **Verdictive/Exercitive** report. It defines the boundaries of the relationship. It is low risk *if* accurate, but high risk if outdated.

  #### Line 3: "We've noted your concern about how the adjuster spoke to you."
  *   **Q1 (Status Change):** No. It reports an internal action (noting).
  *   **Q2 (Reliance):** No. Users know "noted" rarely means "fixed."
  *   **Q3 (Negation):** No.
  *   **Q4 (Authority):** No. Anyone can type a note.
  *   **Q5 (Sincerity):** **YES.** "Noted" is functioning as a closure act. It says "We heard you and are doing nothing." If the team does not actually review these notes, the act is hollow.
  *   **Result:** **Escalate to Product/Leadership (Human Review).**
  *   **Analysis:** This is an **Abuse**. The speech act (acknowledgment) is performed, but the sincerity condition is missing. It creates brand damage without legal protection.

  ***

  ### The Verdict

  **Which one comes out worst for us?**
  **"Your information is safe with us."**

  **Why:**
  1.  **Liability:** It creates a contractual warranty that IT and Security cannot technically guarantee. If you get breached, this line is Exhibit A in a class-action lawsuit for false advertising and negligence.
  2.  **Regulatory Misfire:** Most insurance regulations prohibit absolute guarantees of security. By shipping this, you may be violating compliance rules simply by stating them.
  3.  **The Trap:** It feels like "marketing fluff" (Q1: No), so writers try to ship it without Legal. The procedure catches it at Q2, but writers will try to argue Q2 is a "No." It requires the most discipline to flag.

  Line 3 ("We've noted...") is the most *cynical*, but Line 1 is the most *dangerous*. Line 2 is routine compliance.

  ***

  ### Where This Procedure Will Misfire

  You asked for honesty about where a tool like this breaks given ten minutes and no training. Here is where the ICF will fail you:

  **1. The "Ten-Minute" Felicity Condition**
  Speech acts depend on *uptake*—how the listener receives the message. A writer cannot know in 10 minutes how a distressed member will hear "Your claim was reviewed." To a calm user, it's a report. To a desperate user, it's a verdict. The procedure assumes a "reasonable user," but in health insurance, there is no reasonable user during a crisis. **The procedure will underestimate the perlocutionary effect (emotional impact) of neutral lines.**

  **2. The "Shadow" Blind Spot**
  Writers are trained to be polite. Politeness strategies often rely on indirect speech acts ("We might want to consider..." instead of "You must..."). The procedure asks writers to identify intent. Writers will lie to themselves (unconsciously) to avoid Legal review. They will mark Q2 as "No" because they *intended* it as a report, even if the user *hears* a promise. **The procedure relies on writer self-awareness, which is the first thing to go under deadline pressure.**

  **3. The Values Escalation (Q5) is a Black Hole**
  Sending a line to "Human Review" (Leadership/Product) is often a death sentence for the message. Leadership will not answer Q5. They will say "Make it compliant" or "Ship it." **The procedure identifies ethical abuse but provides no mechanism to fix it.** It will correctly flag "We've noted your concern" as hollow, but it cannot force the company to actually care. It will become a checklist tick-box where writers learn to rephrase the abuse until it passes Q5 without actually changing the behavior.

  **4. Context Drift**
  Austin's felicity conditions require the context to remain stable. In agile releases, context shifts weekly. A line cleared in Sprint 40 might be a misfire in Sprint 41 because the backend workflow changed (e.g., "We will call you" is true in Sprint 40, but the call center vendor changes in Sprint 41). **The procedure treats lines as static, but they are dynamic events.** Without a version-control link to the actual business process, the "Authority Test" (Q4) is just a guess.

  **Summary:** Use this to catch the legal bombs (Line 1). Do not expect it to fix the cultural hollowness (Line 3). For that, you need more than ten minutes; you need a policy change.
