      *   **Goal:** A line-by-line procedure to distinguish "doing something" (performative) vs. "reporting something" (constative) to determine legal review necessity.
      *   **Theoretical Basis:** Speech Act Theory (Austin: felicity conditions, misfire vs. abuse, illocution vs. perlocution, indirect speech acts).
      *   **Constraints:** Must be usable by non-philosophers. Needs specific questions, pass/fail criteria, escalation points (Legal vs. Human/Values).
      *   **Specific Pain Points:** "Shadow performatives" (report grammar, act function) and "Deniable sentences" (negated performatives).
      *   **Task:** Create the procedure, explain theoretical compromises, run it on three specific examples, identify the worst one, and critique the procedure's own limitations.

  2.  **Deconstruct the Theory for Practical Use:**
      *   *Austin's Core:* Saying something *is* doing something (Performative) vs. Saying something *describes* something (Constative).
      *   *Felicity Conditions:* The context must be right for the act to work (authority, procedure, execution).
      *   *Misfire vs. Abuse:* Misfire = Act didn't happen (void). Abuse = Act happened but was insincere/unfair.
      *   *Illocution vs. Perlocution:* Illocution = The act performed *in* saying (promising, warning). Perlocution = The effect *by* saying (scaring, reassuring).
      *   *Indirect Speech Acts:* "It's cold in here" = "Close the window."
      *   *Shadow Performatives:* "Your complaint is logged" (looks like report, acts as receipt/acknowledgment).
      *   *Deniable Sentences:* "I'm not saying no" (implies no without committing).

      *   *Adaptation Strategy:* I can't ask writers to identify "illocutionary force." I need to ask about *consequences* and *authority*.
      *   *Dropped:* Deep taxonomy of illocutionary verbs, nuanced distinction between misfire/abuse (merge into "risk"), strict constative/performative binary (acknowledge the spectrum).
      *   *Kept:* The core idea that language changes reality (commitments, status changes) vs. language describing reality. The idea that context (authority) matters.

  3.  **Drafting the Procedure (The "Compliance Speech Act Check"):**
      *   *Goal:* Filter lines into "Safe to Ship," "Legal Review," or "Human Review."
      *   *Step 1: The Change Test (Illocution).* Does this change the user's status or our obligation?
      *   *Step 2: The Authority Test (Felicity).* Do we have the right to say this *here*?
      *   *Step 3: The Shadow Test (Indirect/Shadow Performative).* Is this a report that acts like a promise/refusal?
      *   *Step 4: The Denial Test (Negation).* Are we implying a commitment by denying one?
      *   *Step 5: The Values Test (Abuse/Sincerity).* Is this technically true but morally hollow?

  4.  **Addressing the Specific Pain Points:**
      *   *Shadow Performatives:* Need a question about "What happens immediately after this is read?" If the user relies on it as proof, it's an act.
      *   *Deniable Sentences:* Need a question about "What is the user hearing?" If they hear 'no', it's a refusal.

  5.  **Running the Examples:**
      *   *Line 1: "Your information is safe with us."*
          *   Analysis: Looks like a report, acts like a guarantee (Promise). High risk.
      *   *Line 2: "This decision may be appealed within 180 days."*
          *   Analysis: Report of a right. But defines the right. Low/Medium risk (factual vs. contractual).
      *   *Line 3: "We've noted your concern about how the adjuster spoke to you."*
          *   Analysis: Shadow performative. "Noted" = "We will do nothing." Potentially abusive/hollow.

  6.  **Critiquing the Procedure:**
      *   *Time:* 10 minutes is tight for deep analysis.
      *   *Training:* Writers aren't lawyers or philosophers.
      *   *Misfire:* The procedure itself might misfire if the context shifts (e.g., a new regulation).

  7.  **Refining the Output (Iterative Polish):**
      *   *Tone:* Professional, direct, slightly cynical (matching the user's "boring, high-stakes" vibe), but rigorous.
