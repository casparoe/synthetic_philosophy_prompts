answer: |-
  **FINAL EXAMINATION: POLITICAL THEORY AND COMPARATIVE ETHICS**
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in approximately 1,000 words. This is a closed-book examination. Do not rely on outside knowledge of specific countries or scandals.

  **Question 1**

  Consider the following three accounts of corruption:
  1.  **Office-Based:** Corruption is the abuse of a public role for private gain, violating specific norms attached to that office.
  2.  **Institution-Based:** Corruption is conduct that subverts the proper purpose of an institution, even if no specific rule is broken and no private enrichment occurs.
  3.  **Legitimation-Based:** Corruption is defined by what a political community has actually authorized; if a practice is locally recognized and authorized, it is not corrupt, however impartial it appears to outsiders.

  Consider also the following three cases:
  *   **The Rally:** A municipal councilor allocates a genuinely scarce public benefit (a water connection) to households that attend her rallies and publicly support her. The benefit is delivered. There is no functioning bureaucratic queue; the realistic alternatives are a lottery among equally needy households or allocation to whoever arrives first. Households that do not support her are not worse off than they would have been under those alternatives.
  *   **The Wedding Gift:** A businessman with a permit application pending gives the daughter of the deciding official a wedding gift of locally conspicuous value. In local custom, refusing such a gift is a grave insult that severs the relationship. Evidence suggests the official would have approved the permit anyway.
  *   **The Ledger:** A jurisdiction in which gifts, patronage payments, and allocations to supporters are fully disclosed in a public register, and in which voters systematically reward officials who channel resources to their own networks. There is transparency without impartiality.

  Finally, consider the **Empty-Detour Test**: An act is corrupt *only if* the personal relation it runs through is a detour around an impersonal mechanism that actually exists and could have handled the case at acceptable cost. Where no such mechanism exists, calling the practice corruption is either false or is really a claim about what institutions ought to exist.

  **Task:**
  Write an essay that addresses the following:
  1.  Explain what work a concept of corruption is meant to do (e.g., guiding officials, designing institutions, assigning blame, licensing intervention) and note how these functions might conflict.
  2.  Using the distinction between outcome-based, relation-based, and institution-based wrongs, adjudicate the "no-loser" defense suggested in **The Rally**.
  3.  Apply at least two of the three accounts above to **The Ledger** to argue whether disclosure cures the wrong, merely relocates it, or is irrelevant to it.
  4.  Evaluate the **Empty-Detour Test**. Is it a universalist tool (one standard, varying factual inputs) or does it presuppose a parochial picture of the bureaucratic state as the default?
  5.  Distinguish three claims often run together regarding Western standards: that outsiders are poor judges of local meaning (epistemic); that the concept itself has different content in different places (conceptual); and that external actors lack standing to condemn (jurisdictional). Draw a conclusion about what an external actor (e.g., an NGO or donor) is permitted to conclude, including the risk of weaponization.

  ***

  **MODEL ANSWER**

  To define corruption is not merely to describe behavior but to select a tool for a specific job. A concept of corruption might guide an official's conscience, design an institution's rules, assign retrospective blame, or license external intervention. These functions often pull apart. A definition useful for criminal prosecution (requiring specific intent and private gain) may fail to capture institutional decay (systemic subversion without enrichment). If we define corruption too narrowly to protect legal certainty, we lose the capacity to diagnose systemic rot. If we define it too broadly to capture all moral failings, we dilute the stigma required for effective blame. Therefore, the choice of definition must track the specific normative work the concept is intended to perform.

  This functional clarity is required to adjudicate **The Rally**. Defenders of the councilor offer a "no-loser" defense: since no household is worse off than they would be under a lottery or first-come queue, no harm occurs. This defense relies on an outcome-based view of wrongs, where corruption requires a victim who is deprived of a rightful due. However, an institution-based account rejects this. The wrong here is not the deprivation of water, but the subversion of the public office's purpose. The office exists to serve the public good, not to sustain a political machine. Even if the outcome is efficient, the relation is corrupted: public power is exchanged for political support. An office-based account might struggle here if "private gain" is interpreted strictly as financial enrichment, but if "gain" includes political capital, the violation holds. Thus, the "no-loser" defense fails because it ignores the institutional wrong of converting public authority into private political asset, regardless of the distributional outcome.

  **The Ledger** presents a harder challenge for the distinction between transparency and integrity. Under an office-based account, disclosure might cure the wrong if the rules permit such payments provided they are declared; the violation is secrecy, not the transfer. However, an institution-based account argues disclosure merely relocates the wrong. If the institution's proper purpose is impartial service, openly admitting to partiality does not make it impartial; it merely makes the subversion transparent. The Legitimation-Based account offers the strongest defense of The Ledger: if voters systematically reward this behavior, the community has authorized it. Yet, this conflates popularity with legitimacy. A community might authorize practices that undermine the very state capacity required to sustain those authorizations long-term. Therefore, disclosure does not cure the institutional wrong; it renders the corruption democratic, but corruption nonetheless.

  This leads to the **Empty-Detour Test**. The test asks whether a personal relation bypasses an existing, functional impersonal mechanism. If no such mechanism exists, the test suggests the label "corruption" is false. This appears universalist: it applies one standard (is there a detour?) everywhere. However, it is deeply parochial. It presupposes that the impersonal bureaucratic state is the default and endpoint of political development. In contexts where the state is weak or colonial in origin, the "impersonal mechanism" may be a fiction. To label personalistic allocation as corruption in the absence of a functioning bureaucracy is to condemn actors for failing to be what they are not. The test effectively says: "You are corrupt because you are not us." Thus, the Empty-Detour Test is not a neutral universalist tool; it is a teleological judgment that privileges a specific institutional form.

  Consequently, external actors must disentangle three distinct claims about the limits of their judgment. First, the **epistemic claim**: outsiders are poor judges of local meaning (e.g., distinguishing a bribe from a customary gift). Second, the **conceptual claim**: the content of corruption differs by place (e.g., partiality is not always a vice). Third, the **jurisdictional claim**: external actors lack the standing to condemn or enforce. Conflating these leads to paralysis or arrogance. An NGO may accept the epistemic limitation (we do not know the local custom) without accepting the conceptual claim (partiality is never good).

  The prudent conclusion for an external actor is to acknowledge the epistemic risk while maintaining a thin universalism regarding institutional purpose. They may condemn practices that demonstrably destroy state capacity, even if locally authorized. However, they must heed the risk of weaponization. Imposing anti-corruption standards without the institutional substrate to support them creates a toolkit for selective enforcement. Rivals can use anti-corruption laws to remove opponents while sparing allies, turning the concept of corruption into a weapon of factional warfare rather than a shield for the public good. Therefore, external intervention is permitted only when it strengthens the impersonal mechanisms that make the Empty-Detour Test meaningful, rather than simply policing the detours themselves.

  ***

  **MARKING SCHEME (25 MARKS TOTAL)**

  **Part I: Content Criteria (20 Marks)**
  *Five criteria at 4 marks each. To earn full marks on a criterion, the student must address the specific requirement and avoid the typical error.*

  **1. Function of the Concept (4 Marks)**
  *   **Earns Marks:** Identifies at least two distinct functions (e.g., guiding conduct vs. licensing intervention) and explains how they might conflict (e.g., precision vs. scope).
  *   **Typical Error:** Defines corruption immediately without explaining *why* we need the concept or treating the definition as purely descriptive.

  **2. Adjudicating 'The Rally' (4 Marks)**
  *   **Earns Marks:** Distinguishes outcome-based wrongs (harm to victims) from institution/relation-based wrongs (subversion of role) and uses this to reject the "no-loser" defense.
  *   **Typical Error:** Accepts the "no-loser" defense as decisive or dismisses it without explaining which *type* of wrong makes it irrelevant.

  **3. Analyzing 'The Ledger' (4 Marks)**
  *   **Earns Marks:** Applies at least two accounts (e.g., Institution vs. Legitimation) to argue whether disclosure cures or relocates the wrong.
  *   **Typical Error:** Asserts that transparency automatically cures corruption or dismisses it without engaging the Legitimation account's challenge.

  **4. Evaluating the Empty-Detour Test (4 Marks)**
  *   **Earns Marks:** Explicitly states whether the test is universalist or parochial and justifies this by analyzing the presupposition of an impersonal bureaucratic baseline.
  *   **Typical Error:** Treats the test as purely factual/neutral without recognizing its normative bias toward a specific state form.

  **5. External Action & Distinctions (4 Marks)**
  *   **Earns Marks:** Distinguishes epistemic, conceptual, and jurisdictional claims and addresses the weaponization risk (selective enforcement).
  *   **Typical Error:** Collapses all three claims into generic "cultural relativism" or ignores the second-order risk of weaponization.

  **Part II: Argumentative Quality (5 Marks)**

  *   **5 Marks (A Range):** Argument is cohesive; transitions between cases and theory are smooth; conclusion follows from premises.
  *   **3-4 Marks (B Range):** Points are made but feel disjointed; strong on description, weak on synthesis.
  *   **1-2 Marks (C/D Range):** Disorganized; significant confusion of terms; fails to follow instructions.

  **A/B BOUNDARY NOTE**

  *   **Earning A Marks (Despite Disagreement):** A student may argue that the **Empty-Detour Test is valid and universalist**, provided they rigorously defend the premise that the impersonal state is a necessary condition for public justice everywhere. Full marks are awarded for the *structure* of the argument (premise -> application -> conclusion), not for agreeing with the model answer's skepticism.
  *   **Capping at B (The Specific Failure):** A paper that reaches the correct conclusion about weaponization but fails to distinguish between the **epistemic** (we don't know) and **conceptual** (it means something different) claims must be capped at a B. This distinction is the core theoretical hurdle of the question; missing it indicates memorization rather than grasp.
