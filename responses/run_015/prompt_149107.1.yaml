answer: |-
  ### Part 1: Conceptual Translation & Brainstorming

  To translate the principle of **Moral Contingency** into a practitioner-level instrument, we must bridge the gap between metaphysical narrative theory and secondary-school lesson planning. Here is the breakdown of what must survive simplification, what must be dropped, and where the tool is vulnerable.

  **Distinctions That Must Survive:**
  1.  **Explanation vs. Explanation-Away:** The procedure must distinguish between explaining *why* a choice was hard (pedagogically useful) and explaining *why* the choice was inevitable due to psychology or circumstance (pedagogically useless).
  2.  **Cost of Virtue:** Hagiography makes virtue look effortless. The tool must detect whether the text acknowledges the *sacrifice* required for the moral act. If virtue costs nothing, it cannot be imitated, only admired.
  3.  **The "Open Moment":** The text must locate specific timestamps where the future was unwritten. If the narrative uses foreshadowing that implies destiny ("little did he know, this would make him a hero"), contingency is destroyed.

  **Distinctions That Can Be Dropped:**
  1.  **Metaphysical Free Will:** We do not need to solve determinism. We only need to assess whether the *narrative structure* treats the subject as determined.
  2.  **Historical Accuracy:** A biography can be factually true but narratively deterministic (hagiography). The tool assesses the *framing*, not the fact-checking (which is a separate historical audit).
  3.  **Psychological Depth:** Teachers are not therapists. The tool looks for textual markers (verbs, adjectives, causal links) rather than deep psychoanalysis of the subject.

  **Where the Procedure Will Misfire:**
  1.  **Teacher Bias:** A teacher who idolizes a figure may miss hagiographic markers. A teacher who is cynical may flag genuine ambiguity as reductionism. The "Judgment Flags" are designed to highlight this risk, not eliminate it.
  2.  **Developmental Mismatch:** A text can pass the Moral Contingency Audit but be too complex or disturbing for 15-year-olds. This tool assesses *moral usability*, not *age appropriateness*.
  3.  **The "Monster" Problem:** A biography of a villain can pass this test (showing their open choices to do evil). This tool does not determine *which* virtues to teach, only whether the text allows for moral learning.

  ***

  ### Part 2: The Moral Contingency Audit (MCA)

  **Time Required:** 30 Minutes
  **User:** Secondary Ethics Curriculum Designer
  **Goal:** Determine if a biography supports moral formation (imitation of choice) rather than idolatry (admiration of status) or cynicism (rejection of virtue).

  #### Phase 1: The Motive Filter (Cynicism Check)
  *Goal: Detect if the text reduces all virtue to hidden vice.*

  **Q1. Scan the text for the subject's "best" actions. How are the motives described?**
  *   **Sufficient Answer:** The text allows for mixed motives or explicitly states the subject acted for a principle despite a cost to themselves.
  *   **Stop Condition (Immediate NO):** The text asserts that *every* altruistic act was ultimately driven by status, money, power, or neurosis. (e.g., "She didn't save the refugees to help them, but to secure her legacy.")
  *   **Judgment Flag:** ⚠️ Are you conflating "complex motives" with "selfish motives"? Everyone has mixed motives; cynicism claims *only* selfish motives exist.

  **Q2. Structural Test: The Adjective Check.**
  *   **Instruction:** Look at the first mention of the subject in a chapter.
  *   **Pass:** The subject is described by their role or situation (e.g., "The doctor," "The prisoner").
  *   **Fail:** The subject is described by moral valuation before acting (e.g., "The heroic doctor," "The saintly prisoner").
  *   **Why:** Pre-loading moral adjectives removes the possibility of the subject failing the moral test.

  #### Phase 2: The Friction Filter (Hagiography Check)
  *Goal: Detect if the text smooths over the difficulty of moral choice.*

  **Q3. Identify a major moral triumph in the book. Was there a credible alternative?**
  *   **Sufficient Answer:** The text describes the temptation to do the opposite, or the ease of taking the cowardly path, and shows the subject resisting it.
  *   **Stop Condition (Immediate NO):** The subject appears unable to perceive the vice option, or the vice option is presented as absurd/impossible for someone "like them."
  *   **Judgment Flag:** ⚠️ Does the text attribute virtue to "nature" or "instinct" rather than "choice"? (e.g., "It was in her nature to be brave" = NO. "She was terrified but chose to stay" = YES).

  **Q4. Structural Test: The Passive Voice Test.**
  *   **Instruction:** Search for sentences describing the subject's moral failures or harms caused by them.
  *   **Pass:** Active voice assigning agency (e.g., "He decided to ignore the warning," "She lied to the committee").
  *   **Fail:** Passive voice or abstract nouns removing agency (e.g., "Mistakes were made," "The situation led to a compromise," "His temper got the better of him").
  *   **Why:** Hagiography obscures sin by removing the sinner from the sentence.

  #### Phase 3: The Contingency Core (Open Choice Check)
  *Goal: Detect if the narrative preserves the openness of the future.*

  **Q5. Locate the "Crisis Point." Does the narrative voice know the outcome while describing the choice?**
  *   **Sufficient Answer:** The narration stays within the subject's limited knowledge during the decision. (e.g., "He did not know if the letter would arrive in time.")
  *   **Stop Condition (Immediate NO):** Retrospective determinism. (e.g., "This small decision would set him on the inevitable path to glory," or "Fate had already decided the outcome.")
  *   **Judgment Flag:** ⚠️ Are you mistaking *historical inevitability* for *narrative inevitability*? The event happened, but did the *story* make it feel like it had to happen?

  **Q6. The Privacy Boundary.**
  *   **Instruction:** Check how the text handles private moral failures (e.g., infidelity, family neglect).
  *   **Pass:** The text treats private vice as relevant to public character or acknowledges the tension between the two.
  *   **Fail:** The text creates a "sealed chamber" around private life, asserting it has no bearing on moral exemplarity.
  *   **Why:** Moral contingency requires integrity of the self. Severing private vice from public virtue teaches students that morality is performative.

  #### Phase 4: Final Synthesis
  **Q7. The Imitation Test.**
  *   **Instruction:** Ask: "If a student imitates the *process* of this subject's decision-making (not the outcome), would it lead to virtue?"
  *   **Pass:** Yes. The process involves weighing, struggling, and choosing.
  *   **Fail:** No. The process involves waiting for inspiration, relying on innate genius, or ignoring moral costs.

  ***

  ### Part 3: Applied Cases

  #### Case 1: The Celebrated Scientist (Hagiography)
  *Text Description:* Frames perseverance as innate, glosses over wartime military collaboration, treats extramarital relationship as private/irrelevant.

  *   **MCA Q1 (Motives):** **PASS.** (Presumably does not claim she was selfish, just heroic).
  *   **MCA Q3 (Credible Alternative):** **FAIL.** Perseverance is framed as "innate." If it is innate, it is not chosen. If it is not chosen, it cannot be imitated.
  *   **MCA Q4 (Passive Voice):** **FAIL.** "Glosses over collaboration." This implies the use of passive construction or omission to protect the subject's moral standing.
  *   **MCA Q6 (Privacy Boundary):** **FAIL.** Explicitly treats the affair as "morally irrelevant." This severs private vice from public character.
  *   **MCA Q7 (Imitation Test):** **FAIL.** A student cannot imitate "innate perseverance." They can only admire it.

  **Result:** **REJECT.**
  **Curriculum Note:** I recognize this text is a staple of your curriculum and that you find it inspiring. This is the tension the MCA is designed to expose. The text is *inspirational* but not *moral*. It invites admiration of a statue, not imitation of a human. By framing her virtue as innate and her vices as irrelevant, it teaches students that morality is about *being* a certain kind of person (essentialism) rather than *doing* certain hard things (existential choice). You must replace it or supplement it with materials that restore the friction of her choices.

  #### Case 2: The Beloved Humanitarian (Cynical Reduction)
  *Text Description:* Explains charity as reputation management, moral risk as calculated self-interest.

  *   **MCA Q1 (Motives):** **FAIL.** Asserts *every* altruistic act was driven by status. This triggers the Stop Condition.
  *   **MCA Q2 (Adjective Check):** **FAIL.** Likely describes the subject as "calculating" or "ambitious" prior to actions, pre-loading the moral valuation.
  *   **MCA Q3 (Credible Alternative):** **FAIL.** If every act is calculated self-interest, there was never a moment where virtue was an open possibility.
  *   **MCA Q7 (Imitation Test):** **FAIL.** If a student imitates this process, they learn that virtue is a marketing strategy.

  **Result:** **REJECT.**
  **Curriculum Note:** This text destroys moral contingency by collapsing the space between virtue and vice. It teaches that moral language is merely a mask for power. While it may be historically corrective against hagiography, it is pedagogically toxic for moral formation.

  #### Case 3: The Parallel Political Lives (Plutarchan)
  *Text Description:* Parallel comparison, left and right figures, same crisis, open choices, visible failure, no redemption.

  *   **MCA Q1 (Motives):** **PASS.** Presumably allows for genuine belief in their respective causes.
  *   **MCA Q3 (Credible Alternative):** **PASS.** Both make "genuinely open choices."
  *   **MCA Q5 (Narrative Voice):** **PASS.** "Not redeemed by narrative closure" suggests the text resists the temptation to say "it all worked out."
  *   **MCA Q7 (Imitation Test):** **PASS.** Students can inhabit the struggle of the crisis without being told which specific political outcome is "correct." They learn the *structure* of moral responsibility.

  **Result:** **ACCEPT.**
  **Curriculum Note:** This is the ideal usage of biography in ethics. It isolates the *moral mechanics* of decision-making from the *political outcome*. The lack of redemption is a feature, not a bug; it prevents the "ends justify the means" fallacy.

  ***

  ### Part 4: Limitations & Unsettled Matters

  The Moral Contingency Audit is a necessary but not sufficient condition for curriculum adoption. It cannot settle the following:

  1.  **The "Damaging Life" Problem:** A biography can pass the MCA (showing open choices, friction, and responsibility) but depict a subject whose life is too traumatizing or morally corrosive for adolescents (e.g., a contingent biography of a charismatic serial killer). The MCA validates the *structure*, not the *content*.
  2.  **Developmental Readiness:** A text may preserve moral contingency but be too abstract for 14-year-olds. The MCA does not measure cognitive load.
  3.  **Teacher Mediation:** The MCA assumes a neutral reader. In practice, a teacher's delivery can re-introduce hagiography to a contingent text ("Look how brave he was!") or cynicism ("But what was he really thinking?"). The tool audits the *text*, not the *teaching*.
  4.  **Sufficiency of Contingency:** It is possible that moral contingency is *necessary* for moral learning, but not *sufficient*. Students may also need models of success, not just models of struggle. The MCA prioritizes truth over comfort, which may leave students without a "hero" to rally behind.

  ***

  Verdict: The procedure succeeds in preserving the philosophical core without collapsing into mere taste.
