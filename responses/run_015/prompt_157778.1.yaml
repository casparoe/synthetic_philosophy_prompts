  The weak hypothesis posits that linguistic structures induce language-specific basis rotations within a shared semantic feature space. For Whorf, Hopi grammatical categorization of time applies a distinct orthogonal transformation to event-space representation compared to Standard Average European (SAE). Instead of a linear timeline axis, Hopi embeddings prioritize aspectual or validity features, making linear temporal separability less salient without rendering it unreachable. This corresponds to reweighting feature importance where dimensions are sparse in one language but dense in another, affecting inference trajectories through latent space while retaining cross-lingual linear alignability. Cognition remains flexible, merely biased toward specific geodesics within the same manifold.

  The strong hypothesis claims language-specific architectures enforce non-intersecting manifolds, implying conceptual dimensions are structurally absent. Whorf's assertion that Hopi speakers inhabit an incommensurable world-picture translates to a projection error: the SAE temporal axis cannot be reconstructed from Hopi features because the underlying generative manifold lacks requisite degrees of freedom. Here, lexical gaps are missing axes entirely, not just unpopulated regions. Consequently, cross-lingual alignment fails; no linear map exists between Hopi and SAE embedding spaces because the topological structure of reality-as-represented differs fundamentally, preventing shared encoder recovery. The spaces are topologically distinct, rendering translation impossible without information loss.

  The residue report indicates ontological claims survive poorly; treating lexical gaps as missing axes distorts Whorf's view that they are dense clusters elsewhere. His claim that a different manifold entails a different reality has no counterpart in representation theory, which assumes a single ground truth. This exposes a geometric limitation: the metaphor presupposes a universal ambient space. Recent cross-lingual alignment in multilingual models enforces a universal substrate via shared parameters, implicitly rejecting strong Whorfianism. If Whorf is right, this alignment imposes SAE priors, smoothing topological discontinuities. The ML framework smuggles in universalist assumptions, suggesting failure to find non-intersecting manifolds may reflect architectural bias rather than cognitive reality. The geometry assumes translatability; Whorf denies it.
