answer: |-
  Your carving holds up. It is precise, textually grounded, and identifies a structural mechanism in Plato that is often glossed over by general discussions of "wine and philosophy."

  There is no single canonical term in the literature for this specific configuration. Scholars discuss "wine as a *pharmakon*" (drug/poison/remedy) in the *Laws*, and "Socratic sobriety" in the *Symposium*, but these describe the *substance* or the *person*, not the **structural relationship** between the intoxicated and the sober that you have identified.

  Here is the coinage, the differentiation, and the validation of your insight.

  ### The Term: **The Sobriety Scaffold**

  I propose calling this configuration **The Sobriety Scaffold**.

  This term captures the architectural nature of the setup. Intoxication is not a freefall; it is a controlled descent supported by a structure of reason that remains external to the intoxicated subject. In the *Symposium*, Socrates is the scaffold for Alcibiades; in the *Laws*, the *symposiarch* (toastmaster) and the laws themselves are the scaffold for the citizens. Without the scaffold, the intoxication is merely destructive; with it, it becomes a tool.

  ### Why "Scaffolded Failure Mode" is Correct

  Your phrase "scaffolded failure mode for reason" is philosophically superior to the standard "in vino veritas" reading. Here is why the carving holds:

  1.  **It is not Essentialist (vs. Modern Disinhibition):**
      *   **Modern View:** Alcohol removes a social mask to reveal a static, "true" self underneath (disinhibition). The truth is *already there*, waiting to be uncovered.
      *   **Platonic View:** Alcohol actively *weakens* the faculty of reason (*logos*) to test the strength of habit (*ethos*). The point is not to see what you "really are" deep down, but to see if your virtue is robust enough to survive the temporary loss of your rational governor. It is a stress test of character, not a revelation of identity.
      *   **The Scaffold:** The sober observer ensures the subject doesn't crash during the test.

  2.  **It is not Acculturative (vs. Sympotic Education):**
      *   **Sympotic *Paideia*:** Traditional Greek symposia were about learning poetry, norms, and social bonding *through* drinking. The drinking facilitates the bonding.
      *   **The Sobriety Scaffold:** The drinking facilitates a *diagnostic*. In the *Laws*, the Athenian Stranger explicitly compares it to inoculation: you introduce a small dose of fear or pleasure (via wine) to train the soul's resistance. In the *Symposium*, the drinking facilitates a confession that Socrates can then examine. The goal is not bonding; it is epistemic access to the state of the soul.

  3.  **It requires Asymmetry:**
      *   Standard symposia aim for communal intoxication (everyone gets drunk together).
      *   **The Sobriety Scaffold** requires a **rational asymmetry**. Someone must remain *nephaleos* (sober) to anchor the reality of the situation. In the *Symposium*, if Socrates had drunk with Alcibiades, the scene would have been a tragedy, not a philosophy. In the *Laws*, if the *symposiarch* drinks, the test is invalid. The scaffold must remain dry to support the wet.

  ### Does the Carving Hold?

  Yes. It distinguishes Plato from two other common positions:
  1.  **The Moralizer:** (Wine is bad/vice). Plato does not say wine is bad; he says un-scaffolded wine is bad.
  2.  **The Romantic:** (Wine is inspiration/madness). Plato acknowledges the divine madness, but here he treats wine as a technical instrument for soul-management.

  Your observation identifies a specific **technology of the self** in Plato. It treats reason not as an absolute constant that must always be "on," but as a muscle that needs to be tested under load, provided there is a safety rack (the scaffold) to catch the weight if it fails.

  **Verdict:** The carving is valid. The term **The Sobriety Scaffold** distinguishes the structural necessity of the sober observer from the mere act of drinking, and differentiates Plato's *diagnostic/training* use of wine from the modern *revelatory* use.
