      *Wait, one nuance:* The user wants to keep the idea that statues *say* something in the community's name. If I reject P2, do I weaken that? No, I strengthen it. I say they *do* speak for us, but we authorize that speaking through a different mechanism than individual consent.

      *Let's finalize the "Asymmetry" point:* Dave says removal is also borrowing voice. True, it says "We reject this." But "We reject this" is a *procedural* correction, whereas "We honor this" is a *substantive* endorsement. The cost of living together is accepting substantive endorsements we might dislike, provided the procedure was legitimate. But when the substantive endorsement violates the core terms of the community (e.g., excluding Irish families), the correction is mandatory.
      *Actually, simpler:* The default state of public space is *no statue*. Putting one up changes the environment. Taking one down restores the default. The burden of justification lies on the change, not the restoration.

