      *Refining the Asymmetry Argument:* Dave says maintenance = fresh act. I need to hit this hard. Maintenance is *inertial*. Erection is *kinetic*. Removing is *corrective*. The moral burden is on the positive claim.
      *Refining the Consent Argument:* The key is that in a democracy, we authorize *procedures*, not *outcomes*. We voted for the school board, not the name.

      *Let's structure the response:*
      1.  Validate the user's suspicion (Dave's argument is elegant but flawed).
