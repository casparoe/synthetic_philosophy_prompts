      *   Additionally, the theorem assumes an **absence of noise**. Neural computation is inherently noisy, relying on probabilistic inference rather than deductive certainty. The **evolutionary pressure** shaping brains prioritizes survival utility, not logical consistency or truth. A formal system's "truth" is defined relative to its axioms; cognitive "truth" is pragmatic. By ignoring learning dynamics, the analogy treats the brain as a finished program rather than a developing process. It also omits **embodiment**; formal symbols are abstract, while cognitive states are grounded in sensorimotor interaction. Importing the necessity of incompleteness from arithmetic into biology assumes cognition aims for logical closure, whereas biological systems aim for adaptive openness. These omissions undermine the inference because the "strange loop" in GEB is a logical necessity within a closed system, whereas biological self-reference is an adaptive heuristic within an open system.

  5.  **Drafting Section 4: Verdict on Consciousness Conclusion**
