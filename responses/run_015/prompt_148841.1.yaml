      *(Refining the "Missing Feature"):* Plutarch's *Synkrisis* isn't just comparison; it's a *verdict*. The game generates comparison, but the Facilitator must deliver the verdict on which life is "better" to mimic Plutarch's didactic authority.

      *(Refining "Hagiographic Compression"):* Make sure this term is central to the framing.

      *(Scoring):* Keep it simple. Tokens on the table.

      *(Timeline):*
