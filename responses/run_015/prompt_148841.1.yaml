          *   Within groups, students take on the 4 roles (some roles doubled).
      *   *Wait, 90 mins is tight for 2 large groups to agree.* Let's try 4 small groups (3-4 students).
          *   Pair 1: Group 1 (Life A) & Group 2 (Life B).
          *   Pair 2: Group 3 (Life C) & Group 4 (Life D).
          *   Actually, the prompt asks for "Parallel Comparator." Plutarch compares *two* specific lives. Let's simplify. 2 Groups of 7 is best for the *Synkrisis* feel. I will manage the noise level.
          *   *Roles within the 7:* 2 Biographers, 2 Moral Learners, 2 Internal Critics, 1 Parallel Comparator (swaps between groups during comparison phase).
          *   *Actually, let's make it 4 Groups of 3-4.* It's easier to manage.
          *   Group 1 & 2 form a "Pair." Group 3 & 4 form a "Pair."
          *   This ensures everyone speaks.
          *   Let's stick to the prompt's request for "Parallel Comparator" as a specific role.
          *   *Final Decision:* 4 Teams of 3-4 students. Teams 1 & 2 are linked (Pair Alpha). Teams 3 & 4 are linked (Pair Beta).
          *   Roles rotate per round.

  5.  **Developing the Rules & Scoring:**
      *   *Currency:* "Laurels" (paper slips).
      *   *Round 1 (Plutarchan):* Score for "Clarity of Virtue" and "Symmetry with Partner Life." Penalty for "Ambiguity."
      *   *Round 2 (Developmental):* Score for "Documented Change" and "Recovery from Vice." Penalty for "Seamless Narrative."
