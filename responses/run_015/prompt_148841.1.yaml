      *   *Debrief:* Connect the frustration of Round 2 (messiness) to the necessity of moral growth. Connect the ease of Round 1 to the danger of idolatry.

  9.  **Refining the Roles:**
      *   *Biographer:* Drafts the narrative text.
      *   *Moral Learner:* Articulates what a reader should take from this.
