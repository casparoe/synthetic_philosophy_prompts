  2.  **Deconstruct the Philosophical Tension:**
      *   *Plutarch:* Believes character (*ēthos*) is stable. We compare lives to see who is better/worse to guide our own souls. The narrative serves the moral judgment. Anomalies are noise or tests of virtue.
      *   *Hagiographic Compression:* To make someone an "example," you strip away the messiness. You get a statue, not a person.
      *   *Developmental View:* Moral learning happens *through* failure and time. A static example teaches *what* to be, not *how* to become.
      *   *The Activity:* Needs to gamify this tension. Round 1 forces the "statue." Round 2 forces the "process." The friction between the scores reveals the philosophical problem.

  3.  **Design the Mechanics (Card System):**
      *   Need a way to track "Events" and "Moral Status."
      *   *Event Cards:* Birth, Crisis, Victory, Defeat, Old Age, etc.
