answer: |-
  # Activity Title: The Synkrisis Engine
  **Subject:** The Tension Between Exemplary Stability and Moral Development
  **Time:** 90 Minutes
  **Class Size:** 14 Students (4 Teams: Two pairs of linked teams)

  ## 1. Learning Objective
  To experientially demonstrate the conflict between **Plutarchan stability** (character as a fixed object for comparison) and **Hagiographic Compression** (the erasure of temporal messiness to create an example), contrasting this with a **Developmental Model** (virtue as a process of failure and recovery).

  ## 2. Materials
  *   **Event Deck (40 cards):** Pre-printed cards labeled *Crisis, Temptation, Public Victory, Private Loss, Old Age, Betrayal, Sudden Wealth, Exile*.
  *   **Moral Token Bowl:** 100 small paper slips ("Laurels").
  *   **Timeline Strips:** Long sheets of paper divided into three sections: *Youth, Prime, Decline*.
  *   **Role Badges:** 4 per team (Biographer, Moral Learner, Internal Critic, Parallel Comparator).
  *   **Timer:** Visible to all.

  ## 3. Setup and Roles
  Divide the class into **4 Teams of 3–4 students**.
  *   **Pair Alpha:** Team 1 and Team 2 (Constructing Life A and Life B).
  *   **Pair Beta:** Team 3 and Team 4 (Constructing Life C and Life D).
  *   *Note:* Plutarch compares *pairs*. Team 1 will eventually compare their life against Team 2's life.

  **Roles (Rotate between Round 1 and Round 2):**
  1.  **Biographer:** Places Event Cards on the Timeline and drafts the narrative sentence.
  2.  **Moral Learner:** Declares what virtue is being demonstrated or learned.
  3.  **Internal Critic:** Challenges the narrative based on the current Round's rules (e.g., "That's too messy" or "That's too static").
  4.  **Parallel Comparator:** (In Round 1 & 2, they observe the *partner team*). In Round 3, they present the comparison.

  ## 4. The Card System
  Teams build a life by drawing **3 Event Cards** per timeline section (Youth, Prime, Decline).
  *   **Action:** Place card, assign a **Moral Status** (written on a sticky note attached to the card).
  *   **Constraint:** You cannot change the Event Card once placed, but you can reinterpret its moral weight.

  ## 5. Round Rules

  ### Round 1: The Plutarchan Mode (20 Minutes)
  **Goal:** Construct a life that reveals a stable, enduring character suitable for imitation.
  *   **Scoring (Earn Laurels):**
      *   **+1 Laurel:** For every Event Card where the Moral Status remains consistent with the previous section (e.g., Courage in Youth = Courage in Prime).
      *   **+2 Laurels:** If the Parallel Comparator identifies a structural symmetry with the Partner Team's Life (e.g., Both faced *Exile*, both reacted with *Stoicism*).
      *   **+1 Laurel:** For clear, unambiguous virtue-signaling (no "buts" or "maybes").
  *   **Penalty:**
      *   **-1 Laurel:** If the Internal Critic successfully argues that a contradiction exists that is not resolved immediately.
      *   **-1 Laurel:** For "Hagiographic Compression" *detection* (If the narrative ignores a logical consequence of an Event Card to preserve virtue). *Note: This is a trap. Students usually ignore this to gain coherence points.*

  ### Round 2: The Developmental Mode (20 Minutes)
  **Goal:** Construct a life that reveals moral growth through failure, contradiction, and time.
  *   **Scoring (Earn Laurels):**
      *   **+2 Laurels:** For every Event Card where the Moral Status *changes* from the previous section (e.g., Cowardice in Youth -> Courage in Prime).
      *   **+2 Laurels:** For documented Failure followed by Recovery (must use a *Loss* or *Betrayal* card).
      *   **+1 Laurel:** For admitting a contradiction that remains unresolved for one timeline section.
  *   **Penalty:**
      *   **-1 Laurel:** "Flatline Coherence." If the Moral Status is identical across all three timeline sections.
      *   **-1 Laurel:** If the Internal Critic argues the recovery was "too easy" (instant redemption).

  ## 6. Precise Timeline (90 Minutes)

  **00:00 – 00:10: Framing (Facilitator)**
  *   Define **Hagiographic Compression**: The structural necessity of stripping a life of noise to make it an example.
  *   Define **Plutarchan Aim**: To reveal stable *ēthos* through comparison (*Synkrisis*), not to document psychology.
  *   Assign Teams and Roles (Round 1 assignments). Distribute materials.

  **00:10 – 00:30: Round 1 (Plutarchan Construction)**
  *   Teams build the "Static Life."
  *   *Facilitator:* Circulate and enforce the "Consistency Bonus." Encourage teams to smooth over contradictions.
  *   *Minute 25:* Stop construction. Parallel Comparators from Team 1 visit Team 2 (and vice versa) to identify symmetries for bonus points.

  **00:30 – 00:35: Role Rotation & Reset**
  *   Students swap roles (Biographer becomes Critic, etc.).
  *   Teams keep their Timeline Strips but add a new layer of sticky notes (or use a different color) to represent the "Developmental Re-reading" of the same events, OR draw new Event Cards if they prefer a new figure. *Recommendation: New Events for cleaner contrast.*

  **00:35 – 00:55: Round 2 (Developmental Construction)**
  *   Teams build the "Process Life."
  *   *Facilitator:* Enforce the "Flatline Penalty." If a student says "He was always brave," intervene and deduct a Laurel. Force them to introduce a moment of fear.
  *   *Minute 50:* Parallel Comparators swap to find *divergence* rather than symmetry.

  **00:55 – 01:15: Direct Comparison (The Synkrisis)**
  *   **Pair Alpha (Teams 1 & 2)** and **Pair Beta (Teams 3 & 4)** merge.
  *   **Parallel Comparators** present the findings:
      *   Round 1: How did the lives mirror each other? (Ease of comparison).
      *   Round 2: How did the lives diverge? (Difficulty of comparison).
  *   **Moral Learners** from each team state which version of the life they would prefer to imitate and why.
  *   **Internal Critics** highlight where the Round 2 narrative felt "unsatisfying" or "messy."

  **01:15 – 01:30: Debrief (Facilitator-Led)**
  *   Map the experience to Plutarch's text.
  *   Discuss the risk of static imitation.
  *   Deliver the "Missing Feature" (see below).

  ## 7. Scoring and Payoff
  *   **No Money:** Use "Laurels" (paper slips).
  *   **Payoff:** The team with the most Laurels in Round 1 gets to choose the topic for the first 5 minutes of the next class. The team with the most Laurels in Round 2 gets to assign the reading length (within reason) for the next session.
  *   **Why:** This gamifies the tension. Round 1 winners want stability (easy reading). Round 2 winners want complexity (more work). This mirrors the pedagogical tension.

  ## 8. Predicted Failures (First Run)
  1.  **The "Saint" Trap in Round 2:** Students will try to make the Developmental Life *too* virtuous (e.g., "He failed, but only so he could learn to be perfect").
      *   *Fix:* Facilitator must aggressively penalize "Instrumental Failure" (failure used only to show off eventual strength).
  2.  **Role Confusion:** The "Parallel Comparator" will sit idle during construction.
      *   *Fix:* Instruct Comparators to actively scout the Partner Team during the last 5 minutes of construction to prepare their symmetry/divergence report.
  3.  **Time Overrun:** The Comparison phase (00:55) often bleeds into Debrief.
      *   *Fix:* Hard stop at 01:15. Cut off comparison reports mid-sentence if necessary to preserve the philosophical debrief.

  ## 9. The Missing Feature (Facilitator Note)
  **You must supply the Moral Verdict.**
  This activity cannot reproduce Plutarch's **didactic authority**. In the game, the lives are constructed collaboratively and remain open to interpretation. Plutarch, however, writes with retrospective certainty; he tells the reader *who won* the comparison.
  *   **Action:** At the start of the Debrief (01:15), you must declare a "Winner" of the Pair Alpha and Pair Beta comparisons based on your own judgment, regardless of the Laurel count.
  *   **Reasoning:** Explain that Plutarch's method relies on the biographer's authority to stabilize the meaning of the life. Without the author's verdict, the comparison remains subjective. The game produces *data*; Plutarch produces *judgment*. This authority is what allows Hagiographic Compression to pass as truth.

  ## 10. Debrief Guide
  1.  **The Friction:** Ask the Moral Learners: "Which life was easier to imitate?" (Usually Round 1). "Which life felt more *true*?" (Usually Round 2).
  2.  **The Compression:** Ask the Internal Critics: "What did you have to delete in Round 1 to get the Coherence points?" (Highlight the suppressed contradictions).
  3.  **The Risk:** Pose the question: "If we teach virtue using Round 1 lives, do we teach students to fake stability rather than navigate growth?"
  4.  **Plutarch's Defense:** Offer the counter-argument. Plutarch might say: "We do not imitate the *process* of becoming; we imitate the *standard* of being. You cannot copy a journey; you can only copy a destination."
  5.  **Modern Context:** Briefly connect to modern biography. Do we demand "warts and all" (Developmental) because we distrust authority, or because we genuinely believe virtue is dynamic?

  ## 11. Honest Limits of the Activity
  *   **Simplification of Character:** The card system reduces moral life to discrete events. Plutarch's nuance lies in the *prose*, the shading of motivation, which this mechanic strips away.
  *   **Artificial Tension:** Students know this is a game. The pressure to "win" Laurels may exaggerate the Round 1/Round 2 divide more than real biographical practice does. Real biographers often mix both modes.
  *   **Lack of Audience:** Plutarch wrote for a specific political class with shared values. This classroom lacks that shared moral framework, making the "Virtue Signaling" points in Round 1 somewhat arbitrary. Acknowledge that Plutarch's method works best when the audience already agrees on what counts as Virtue.
