      *   **Activity Structure:** Students construct brief parallel lives of a figure (real or invented) under two rule-sets.
          *   Round 1 (Plutarchan): Points for coherence, virtue-signaling, illuminating comparison.
          *   Round 2 (Developmental): Points for change, failure, recovery; coherence penalized if it flattens time.
      *   **Roles:** Biographer, Moral Learner, Internal Critic, Parallel Comparator (rotating).
