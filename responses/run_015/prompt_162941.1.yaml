answer: |-
  We picture facts built low on lesser ones,
  Where large realities find their support.
  Until the descent to the smallest runs,
  And grounding finds its final, fixed resort.

  We treat the stop as source of all the rest,
  The ungrounded point from which all being grows.
  The tiny particle, by all confessed,
  Supports the tree on which the blossom blows.

  Yet think of depths that deepen without end,
  Where no stone rests to hold the upper weight.
  The parts depend, with nowhere to descend,
  Yet all the world hangs on this open state.

  So "fundamental" breaks when jobs diverge,
  Save for the whole on which the parts converge.
