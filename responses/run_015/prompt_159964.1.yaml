      *   *Alternative Revision:* **Drop Assessor-Relativity (b).** Move to **Speaker-Relativity (Contextualism)**. "Unjust" means "Unjust relative to the speaker's framework."
          *   Insider: "Unjust [relative to mine]." True.
          *   Senior: "Just [relative to mine]." True.
          *   Disagreement? They assert incompatible propositions (if context is fixed).
          *   Outsider: "Unjust [relative to mine]." True.
          *   Standing? Still requires extra semantic work.
      *   *Let's look at the "Cheapest" Revision request.*
      *   The most fragile claim is **(d)'s "critical force against... those who defend it."** This implies the defenders are *mistaken*. But (b) says they are correct relative to *their* framework.
      *   *Revision:* Qualify (d). The condemnation is true relative to her framework. It has critical force *only insofar as* the defenders can be brought to share her framework (via ideal reflection (c)). It does not show they are currently irrational.
      *   *Cost:* Weakens the "genuine disagreement" (g1). It becomes a disagreement about facts of ideal reflection, not fundamental values. But (f) says fundamental disagreement survives ideal reflection.
