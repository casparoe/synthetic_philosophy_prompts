      *   *This requires a normative claim.*
      *   *So the "Single Revision" should be to **qualify (a)** to admit that while truth is semantic, the *selection of the relevant framework for assessment* is a normative matter.*
      *   *Cost:* You can no longer say Relativism is *purely* semantic. It has normative teeth regarding *whose* framework counts in public deliberation.

      *   *Let's refine the "Cheapest Revision".*
      *   The most damaging inconsistency is between **(b) Assessor-Relativity** and **(d) Critical Force against defenders**.
      *   If truth is relative to the *assessor*, the Senior assesses his own practice as Good. The Insider assesses it as Bad. Both are true.
