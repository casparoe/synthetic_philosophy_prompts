  *   **Forensic vs. Narrative Truth:** The mandate demands "facts" (forensic truth: who, what, where, when). The applicant provided "story" (narrative truth: why, how it felt, the internal logic). The tension lies in whether narrative coherence aids transparency (by making sense of chaos) or obstructs it (by imposing an aesthetic order that hides messy realities).
  *   **The Risk of Aestheticization:** If we accept the novel, do we allow the perpetrator to curate their moral image? Fiction allows for metaphor, which can obscure agency. A "composite character" might diffuse individual guilt.
  *   **The Limit of Conventional Testimony:** Standard depositions often fail to capture the systemic nature of violence. They reduce complex operations to binary Q&A. The novel might capture the *atmosphere* of complicity better than an affidavit, but atmosphere is not amnesty-eligible evidence.
  *   **The Precedent:** Accepting fiction as disclosure risks turning the commission into a literary salon. Rejecting it risks ignoring vital intelligence hidden in unconventional forms.
  *   **The Solution Path:** The novel cannot *be* the disclosure. It must be treated as a *claim* of disclosure that requires translation. The applicant must bridge the gap between the aesthetic and the forensic.

