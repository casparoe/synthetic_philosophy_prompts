  You are a professional philosopher who specializes in ethics and collective action problems. Please brainstorm the structure of your answer before you start writing, think carefully about each sub-question, and write the whole thing in American English.

  So: I quit eating meat about six months ago after going down a rabbit hole on factory farming, and arguing about it with my brother-in-law has basically become our family's Thanksgiving event. His line is that me skipping chicken is exactly like me skipping an election. His version: one vote out of millions has essentially zero chance of deciding anything, so it makes no causal difference; in the same way, one shopper's purchases get swallowed by a supply chain that reorders in huge batches, so nothing I do at the checkout changes how many chickens are ever bred. He uses this to conclude that my individual choices are causally inert and therefore morally optional — fine if you feel like it, but not something anyone is owed.

  How far does that analogy actually hold? I'd like a correspondence table first (what plays the role of the voter, the decisive margin, the batch or pallet), then the places the mapping breaks, and whether the conclusion he wants survives once those are on the table.

  Two bits I'm specifically stuck on. A stats friend of mine says the batching point backfires on him: if the store reorders in batches of a thousand, each purchase has about a one-in-a-thousand shot of tipping a reorder of a thousand birds, so the expected difference per purchase is still one chicken — is that right, and does it matter that it's an expected difference rather than an actual one? And second: even granting that no single act ever triggers anything, is there some other route by which my act matters — being part of the group that causes the harm, or what my purchase tells the store about demand — or does all of that just reimport the same inefficacy problem in a new costume? Also: even if the causal premise were true, does the "therefore optional" bit follow, or is that a separate step?

  If the voting analogy is the wrong one, give me a better analogy, and say what it can and can't carry.
