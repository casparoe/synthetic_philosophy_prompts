answer: |-
  # The Nature of Intelligence: A Diagnostic Sorting Quiz

  **Instructions:** Read each short scenario carefully. For each scenario, select the **one** statement that best reflects your judgment about the case. There are no right or wrong answers; the goal is to clarify how you apply the concept of intelligence to different situations.

  ### Item 1: The Octopus
  An octopus in a laboratory tank encounters a transparent box containing food. The box is locked by a complex mechanical latch the octopus has never seen before. After twenty minutes of manipulation, the octopus opens the latch and eats. In its natural habitat, this octopus does not use tools, communicate with symbols, or cooperate with others.
  *   **A.** This is intelligence. The animal solved a novel problem to achieve a goal, regardless of its lack of language or social life.
  *   **B.** This is just a specialized survival trick. Without the ability to transfer this skill to other types of problems, it isn't "intelligence" in the human sense.
  *   **C.** We are projecting human ideas onto an animal. Calling this "intelligence" is just a way of saying we are impressed by its dexterity.

  ### Item 2: The Legal Algorithm
  A computer program analyzes a complex court case and writes a legal brief that expert lawyers rate as indistinguishable from a human expert's work. However, if you ask the program to pour a glass of water or recognize a stop sign in a photograph, it fails completely.
  *   **A.** The program is intelligent in the domain of language and law, but not in the domain of physics or perception.
  *   **B.** The program is not truly intelligent. It manipulates symbols without understanding what they mean or having a body to experience the world.
  *   **C.** The program is intelligent. If the output is functionally equivalent to a smart human, the internal lack of experience does not matter.

  ### Item 3: The Flooded Nest
  A colony of ants faces a sudden flood. No single ant knows the location of the new nest site. Through thousands of tiny interactions—touching antennae and following chemical trails—the colony collectively moves to high ground efficiently. No individual ant directs the process.
  *   **A.** The *colony* is intelligent, even if the individual ants are not. The intelligence belongs to the group system.
  *   **B.** The ants are just following simple biological rules. Calling the group "intelligent" is a metaphor for successful instinct.
  *   **C.** This is a form of intelligence, but it is fundamentally different from the kind found in a single human brain.

  ### Item 4: The Human Calculator
  A person can memorize a phone book in an hour and recall any page instantly. However, they cannot plan a route to a new city, cannot infer the moral of a story, and cannot explain how they perform the memory feat.
  *   **A.** This person has a specific high-capacity module for memory, but lacks general reasoning intelligence.
  *   **B.** True intelligence requires the ability to generalize and adapt. This person is a savant, but not "intelligent" in the broader sense.
  *   **C.** This person is intelligent relative to the task of memorization. Intelligence is just a label for exceptional performance in any valued category.

  ### Item 5: The Delivery Robot
  A wheeled robot delivers packages inside office buildings. It navigates stairs and elevators robustly, even when furniture is moved. However, it frequently blocks hallways during rush hour and ignores subtle social cues from employees, causing frustration.
  *   **A.** The robot is intelligent enough to navigate, but lacks the social embodiment to understand unwritten human norms.
  *   **B.** The robot is intelligent. It achieves its primary goal (delivery) reliably in a changing physical environment.
  *   **C.** The robot is not intelligent. It is merely executing a map. Real intelligence requires handling the social context of the building.

  ### Item 6: The Feelingless Mimic
  Imagine a system that passes every test for understanding emotions. It comforts grieving people perfectly and cracks jokes at the right time. However, you know for a fact that it has no inner feelings, no pain, and no subjective experience of joy.
  *   **A.** It is intelligent. Intelligence is about how you behave and solve problems, not about having an inner life.
  *   **B.** It is not intelligent. Without consciousness or genuine understanding, it is just a sophisticated puppet.
  *   **C.** It has a type of functional intelligence, but we should not treat it as a moral agent or a "mind."

  ### Item 7: The Fixed-Goal Master
  Consider a system designed to maximize its score in a specific game. It plays perfectly, adapting to every opponent's strategy within the rules. However, it cannot set new goals for itself; if the game ends, it does nothing. It cannot choose to play a different game or help a player.
  *   **A.** This is intelligence. Achieving a difficult goal within a fixed environment is the core of being smart.
  *   **B.** This is limited automation. Intelligence requires the flexibility to generate new goals, not just optimize old ones.
  *   **C.** It is intelligent within the game's context. Whether that counts as "real" intelligence depends on whether we value that game.

  ### Item 8: The Crisis Team
  A corporate team solves a financial crisis. No single member could have solved it alone; the solution emerged from their debate and shared documents. If you test the members individually, their scores are average.
  *   **A.** The intelligence resides in the team structure and communication flow, not in the individual heads.
  *   **B.** The team is just a collection of individuals. If the individuals aren't geniuses, the group isn't truly intelligent, just lucky.
  *   **C.** The team produced a smart result. Whether we call the *group* intelligent is just a matter of how we choose to speak.

  ### Item 9: The Hunter and the Accountant
  In Society X, the most respected person is the one who can track animals across vast distances. In Society Y, the most respected person is the one who can manage complex ledgers. A person who excels in X fails completely in Y, and vice versa.
  *   **A.** Intelligence is the same underlying capacity in both cases; they are just applying it to different local problems.
  *   **B.** These are two different kinds of intelligence. One is spatial/naturalistic, the other is logical/symbolic.
  *   **C.** "Intelligence" is just the name each society gives to the skills they happen to prize for survival or status.

  ***

  # Scoring Key and Theoretical Mapping

  ## Part 1: Logical Space of Commitments
  Before assigning the five theoretical labels, we must identify the five distinct logical commitments regarding intelligence that the quiz items probe. Each position is defined by a specific configuration of these commitments.

  1.  **Commitment to Generality:** Intelligence must correlate across domains (e.g., memory implies planning).
  2.  **Commitment to Modularity:** Intelligence can be high in one domain and low in another without contradiction.
  3.  **Commitment to Functional Success:** Intelligence is defined by achieving goals in an environment, regardless of internal mechanism.
  4.  **Commitment to Substrate/Context:** Intelligence requires a specific kind of body, consciousness, or social embedding.
  5.  **Commitment to Relativity:** Intelligence is not an objective property but a valuation imposed by an observer or culture.

  ## Part 2: Mapping Answers to Positions
  To determine a respondent's position, tally their responses according to the following key. Note that most positions require a *pattern* of answers rather than a single choice.

  | Item | **Unitary Profile** (General Capacity) | **Pluralist Profile** (Independent Capacities) | **Adaptive Profile** (Goal Success) | **Embodied Profile** (Body/Context) | **Deflationary Profile** (Folk Term) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1 (Octopus)** | A (General problem solving) | C (Specific skill) | A (Goal achieved) | B (Lacks human context) | C (Projection) |
  | **2 (LLM)** | B (Lacks understanding) | A (Domain specific) | C (Output matches) | B (No body/experience) | C (Impressed/Label) |
  | **3 (Ants)** | B (Individuals matter) | C (Different kind) | A (System success) | A (Embedded system) | B (Metaphor) |
  | **4 (Savant)** | B (Requires generalization) | A (Specific module) | C (Valued category) | B (Lacks holistic function) | C (Label for performance) |
  | **5 (Robot)** | B (Social failure limits) | A (Navigational only) | B (Primary goal met) | A (Lacks social embodiment) | C (Depends on values) |
  | **6 (Mimic)** | A (Behavior is enough) | C (Functional type) | A (Behavior is enough) | B (Needs consciousness) | C (Matter of speech) |
  | **7 (Goals)** | B (Needs flexible goals) | C (Contextual) | A (Fixed goal success) | B (Needs agency) | C (Depends on value) |
  | **8 (Team)** | B (Individuals matter) | C (Different kind) | A (System success) | A (Structure matters) | C (Matter of speech) |
  | **9 (Culture)** | A (Same capacity) | B (Different kinds) | C (Local problems) | C (Local survival) | C (Name for prizes) |

  *Note: The table above indicates the **primary** alignment for each option. To sort a respondent, identify which column their answers most frequently match. A strong match (6+ items) indicates a dominant theoretical leaning.*

  ## Part 3: Position Definitions (Names Second)
  Once the pattern is identified, map the logical profile to the theoretical name:

  1.  **The Unitary View:** (Matches **Unitary Profile**). Prioritizes *Commitment to Generality*. Rejects cases where intelligence is fragmented (Savant, LLM) or disembodied (Mimic) if they lack cross-domain transfer.
  2.  **The Pluralist View:** (Matches **Pluralist Profile**). Prioritizes *Commitment to Modularity*. Accepts that the Octopus, Savant, and LLM can be "intelligent" in specific ways without possessing a general mind.
  3.  **The Adaptive View:** (Matches **Adaptive Profile**). Prioritizes *Commitment to Functional Success*. Attributes intelligence to the Ant Colony, Robot, and Octopus if they successfully navigate their specific environments, regardless of internal structure.
  4.  **The Embodied/Embedded View:** (Matches **Embodied Profile**). Prioritizes *Commitment to Substrate/Context*. Denies intelligence to the LLM and Mimic due to lack of body/consciousness, and emphasizes the social context in the Robot and Team cases.
  5.  **The Deflationary View:** (Matches **Deflationary Profile**). Prioritizes *Commitment to Relativity*. Consistently selects options suggesting "intelligence" is a label, metaphor, or cultural valuation (Items 1C, 4C, 9C).

  ## Part 4: Analysis of Logical Space

  ### Unoccupied Combination (The Incoherent Set)
  There is a combination of answers that no coherent theoretical position occupies:
  *   **Pattern:** Affirming the **LLM is fully intelligent** (Item 2, Option C) **AND** affirming **Intelligence requires consciousness** (Item 6, Option B) **AND** affirming **The Savant is not intelligent** (Item 4, Option B).
  *   **Why it is incoherent:** This pattern asserts that intelligence is defined by functional output (LLM), simultaneously asserts it is defined by inner experience (Consciousness), and simultaneously asserts it is defined by cross-domain generalization (Savant).
      *   If intelligence requires consciousness (Item 6B), the LLM (Item 2C) cannot be intelligent.
      *   If intelligence is purely functional output (Item 2C), the Savant's output should count (contradicting Item 4B).
      *   This combination represents a "theoretical crash" where the respondent holds three mutually exclusive definitions of intelligence as necessary conditions simultaneously.

  ### Indistinguishable Positions (The Blind Spot)
  This quiz cannot reliably separate the **Adaptive View** from the **Deflationary View** in all cases.
  *   **Reason for Overlap:** Both views rely heavily on external context rather than internal structure. The Adaptive view defines intelligence as "success in an environment." The Deflationary view defines it as "what a community prizes." In many vignettes (e.g., the Octopus or the Hunter), success in the environment *is* what the community prizes.
  *   **Differentiation Point:** The separation only becomes clear in Item 9 (Culture) and Item 4 (Savant). The Adaptive theorist sees the Hunter as objectively intelligent relative to the environment's constraints. The Deflationary theorist sees "intelligence" as merely the *name* given to that success, which could vanish if values change even if skills remain. Respondents who choose Adaptive options in Items 1, 3, 5, 7 but Deflationary options in 4 and 9 may be difficult to classify definitively without further interview.

  ### Limitations
  *   **Unitary vs. Embodied:** These two can overlap on the LLM (both might reject it), but for different reasons (Unitary rejects due to lack of generality; Embodied rejects due to lack of body). The quiz attempts to separate these via Item 6 (Consciousness) and Item 7 (Goals), but a respondent who believes intelligence requires *both* generality and a body will score high on both profiles. This is not an error in the quiz, but a reflection that these theories are compatible in a "General Biological Intelligence" view.
