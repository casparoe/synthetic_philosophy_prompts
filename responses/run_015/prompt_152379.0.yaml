answer: |-
  # Session Plan: The Fractured Subject
  **Duration:** 50 Minutes
  **Audience:** Undergraduate Philosophy Reading Group (Background: Descartes, Locke; No Neuropsychology)
  **Core Objective:** Use commissurotomy data to stress-test the distinction between *Phenomenal Unity* and *Access Unity*, avoiding the "two minds" spectacle.

  ---

  ## I. Conceptual Dependency: Securing the Distinction (0–10 Minutes)
  **Goal:** Define the two types of unity *before* introducing the clinical data. If students conflate these from the start, the data will only confirm their bias.

  1.  **Recap Locke on Personhood:** Briefly remind students that for Locke, personal identity rests on the continuity of consciousness (memory/experience), not substance.
  2.  **Introduce the Distinction:**
      *   **Phenomenal Unity:** The *what-it-is-like* condition. Do experiences co-occur in a single field of awareness? (e.g., Seeing red and hearing a tone belong to *one* experiential subject).
      *   **Access Unity:** The *functional-availability* condition. Can information be globally broadcast to a single reasoning, reporting, and action-control system? (e.g., Can I *say* what I see and *use* that info to plan?)
  3.  **The Philosophical Wager:** State clearly: "Standard intuition assumes these travel together. If I am phenomenally unified, I must be access unified. Today, we test if they can come apart."
  4.  **Intercept Point 1 (Cartesian Theater):**
      *   *Misconception:* Students will assume consciousness requires a "central stage" where all data meets before being experienced.
      *   *Interception:* Explicitly deny the need for a spatial locus. "Do not imagine a screen in the brain. Imagine a network of access. Unity is a relation between states, not a place they go."

  ## II. The Core Scenario: The Ambiguous Figure Dissociation (10–25 Minutes)
  **Goal:** Present a single concrete scenario that forces the distinction without inviting a "two souls" explanation.

  **The Scenario:**
  A commissurotomy patient is seated before a screen. Fixation is enforced (eyes locked on a central point).
  *   **Stimulus:** A *single* ambiguous figure (e.g., the Duck/Rabbit illusion) is flashed centrally for 150ms. Physically, it is one image file.
  *   **Response A (Verbal/Left Hemisphere):** When asked "What did you see?", the patient says, "A Duck."
  *   **Response B (Manual/Right Hemisphere):** When asked to use the *left hand* (controlled by the Right Hemisphere) to select a matching object from a hidden array, the hand selects a *Rabbit*.

  **Why this scenario meets your constraints:**
  1.  **Identical Stimulus:** Unlike chimeric faces (half A/half B), this is one image. The divergence is in *interpretation*, not input.
  2.  **Incompatible Interpretations:** Duck and Rabbit are mutually exclusive percepts in the same moment.
  3.  **No "Hidden Twin":** Because it is one ambiguous figure, students cannot retreat to the idea that "one side saw X and the other saw Y." Both sides saw the *same* ink, yet categorized it differently. This forces the question: *Who* is the subject of the experience?

  **Discussion Flow:**
  *   Ask: "Did the patient see a Duck or a Rabbit?"
  *   Push: "If the hand 'knows' it's a Rabbit but the voice says 'Duck,' is the knowledge conscious?"
  *   **Intercept Point 2 (Access = Phenomenality):**
      *   *Misconception:* "If the voice doesn't say it, the subject didn't experience it." (Equating Access with Phenomenality).
      *   *Interception:* "The Left Hemisphere (Speaker) lacks *access* to the Right Hemisphere's categorization. But does the Right Hemisphere lack *phenomenality*? Or is it a subject without a voice?"

  ## III. The Interpretive Crisis: One Subject or Two? (25–40 Minutes)
  **Goal:** Navigate the temptation to posit "two minds" by showing that this collapses the conceptual work.

  1.  **The "Two Minds" Trap:** Students will naturally suggest, "There are two people in there."
  2.  **Intercept Point 3 (Independence = Two Subjects):**
      *   *Misconception:* Hemispheric independence automatically entails two subjects.
      *   *Interception:* Challenge the ontology. "If there are two subjects, why does the patient report *one* continuous life history outside the lab? Why does the Left Hemisphere confabulate reasons for the Right Hand's actions (e.g., 'I picked the rabbit because I like rabbits') rather than saying 'My other self picked it'?"
      *   *Argument:* The "Two Minds" view is a retreat to a **Hidden Twin Ontology**. It solves the puzzle by multiplying entities rather than analyzing the structure of unity.
  3.  **The Fractured Self-Reference Loop:**
      *   Propose the alternative: There is **one subject** with a **fractured self-reference loop**.
      *   The "I" that speaks (LH) constructs a narrative of unity by ignoring the data it cannot access.
      *   Phenomenal unity may remain intact (a single field of experience), but Access unity is broken (the report is partial).
      *   *Crucial Move:* Ask students to consider if *Phenomenal Unity* is actually what matters for moral responsibility or personal identity if *Access Unity* is what governs action.

  ## IV. Closing Check & Delimitation (40–50 Minutes)
  **Goal:** Verify understanding of the distinction and set boundaries for the inquiry.

  1.  **The Closing Check (The "Silence" Question):**
      *   *Ask:* "In our scenario, the voice says 'Duck' while the hand points to 'Rabbit.' If we accept the **Phenomenal/Access distinction**, how do we describe the silence of the voice regarding the Rabbit?"
      *   *Correct Understanding:* "The silence is a failure of *translation/access*, not necessarily a failure of *experience*." (The RH may experience the Rabbit, but cannot broadcast it to the speech center).
      *   *Incorrect Understanding:* "The silence means the RH didn't see it." (Conflates Access with Phenomenality) OR "The silence means there is a second person hiding." (Retreats to Hidden Twin).
  2.  **What to Leave Unexplained (Deliberate Ignorance):**
      *   **Surgical Anatomy:** Do not explain the *genu* vs. *splenium* of the corpus callosum.
      *   **Fiber Taxonomy:** Do not discuss excitatory vs. inhibitory callosal fibers.
      *   **Etiology:** Do not discuss the epilepsy that necessitated the surgery.
      *   *Reason:* Explaining the *mechanism* of the cut invites students to think the problem is merely *mechanical* (wires severed) rather than *conceptual* (what constitutes a subject). We want them wrestling with the definition of "Unity," not the topology of white matter tracts.
  3.  **Final Takeaway:**
      *   "Split-brain cases do not prove there are two minds. They prove that our ordinary concept of 'one mind' relies on the *contingent fact* that Phenomenal and Access Unity usually coincide. When they diverge, 'the subject' becomes a variable, not a constant."

  ---

  ### Instructor's Cheat Sheet: Mapping Misconceptions

  | Time | Misconception | Student Thought | Instructor Interception |
  | :--- | :--- | :--- | :--- |
  | **0-10** | **Cartesian Theater** | "Consciousness happens *where* the hemispheres meet." | "Consciousness is not a place. Unity is a relation between states, not a location." |
  | **15-20** | **Access = Phenomenality** | "If the patient can't say it, they didn't experience it." | "Distinguish the *experience* of the Rabbit from the *report* of the Rabbit. Can one exist without the other?" |
  | **30-35** | **Hidden Twin Ontology** | "Therefore, there are two people in one skull." | "If there were two people, why does the LH confabulate a single narrative? Why not acknowledge the partner?" |
  | **45-50** | **Mechanistic Reduction** | "It's just because the corpus callosum is cut." | "We are bracketing the anatomy. Even if we knew every fiber, the question 'Who is the subject?' remains." |
