answer: |-
  This is a rich angle for a book club because it moves the discussion from moral judgment ("Was the Terror right or wrong?") to structural analysis ("How does the machinery of revolution function?"). Dickens is often dismissed as a sentimentalist, but *A Tale of Two Cities* is surprisingly cold-eyed about the mechanics of political violence.

  Here is a breakdown of how the novel supports, complicates, and sometimes cheats on the "revolutions devour their children" thesis, mapped for your discussion.

  ### 1. The Mechanics of Devouring: Class Logic vs. Ideological Purity
  The phrase "revolutions devour their children" usually refers to factional infighting (Robespierre executing the Dantonists). Dickens rarely touches on that high-level politics. Instead, he shows the Revolution devouring **the very people it claims to save** and **the people who built it.**

  *   **Where Dickens supports the reading:** The "devouring" is most visible in the **shifting goalposts of the Tribunal.** When Darnay is first tried, he is acquitted because he aided a French citizen (Gabelle). When he is tried the second time, that same action is irrelevant; he is condemned for being an *émigré* and an aristocrat.
      *   **The Philosophical Point:** The violence turns on its makers because the logic of the Terror is not *justice*, it is *suspicion*. Once you establish that guilt is inherent in class (being an Evrémonde) rather than action, the machinery cannot stop. It must keep finding enemies to justify its existence.
      *   **Scene to Watch:** The trial scenes (Book 3, Chapters 6 & 9). Notice how the crowd's mood shifts instantly based on who is speaking. The "people" are not a monolith; they are a volatile fluid that the Tribunal channels.

  *   **Class Revenge vs. Decent People:** Dickens is clear that the *fuel* is class revenge (the Marquis running over the child), but the *engine* is ideological purity.
      *   **The Defarges:** They are not "decent people pulled in." They are true believers. But even they are trapped. Defarge wants to spare Lucie and her child initially; Madame Defarge overrules him. The ideology (total extermination of the line) devours the human connection (Defarge's pity).
      *   **Dr. Manette:** He is the ultimate example of a "decent person" devoured. He uses his influence to save Darnay, but his own past trauma (the Bastille letter) is weaponized to condemn him. The Revolution consumes his sanity a second time.

  ### 2. Madame Defarge's Knitting: Bureaucratic Violence
  You mentioned a hesitation about forcing a modern parallel, but the text invites it. Defarge's knitting is not just symbolism; it is **administration.**

  *   **The Textual Evidence:** The knitting is a registry. It is a cold, silent record of names destined for death. It removes the act of killing from the heat of battle to the coolness of a ledger.
  *   **Why this matters for "Devouring":** Bureaucracy creates momentum. Once a name is knitted, it must be acted upon. This suggests the "devouring" is not bad luck (contingency); it is **systemic inevitability.**
  *   **Discussion Point:** Is Madame Defarge a revolutionary or a bureaucrat? She argues she is fulfilling a destiny ("Tell the Wind and the Fire where to stop"). This implies the Revolution has become a force of nature, beyond human control. If the Revolution is a force of nature, then *everyone* is fuel, including the revolutionaries.

  ### 3. Carton's Sacrifice: Redemption or Systemic Failure?
  This is the crux of your second question. Does Carton's death undermine the "devouring" thesis by suggesting individual agency can beat the system?

  *   **The Argument for Systemic Failure:** Carton's sacrifice actually proves the system is broken. In a just society, Darnay should be saved by *law*. In this society, he can only be saved by *deception* and *substitution*.
  *   **Individual vs. Collective:** Carton's act is profoundly anti-collective. He does not try to stop the Guillotine; he does not try to save the other prisoners. He opts out of the collective narrative to save one specific life.
  *   **The Philosophical Issue:** Dickens suggests that in a time of ideological purity, the only morality left is personal, private love. The "devouring" continues unabated outside the prison walls (the novel ends with the guillotine still active). Carton finds peace, but he does not fix the machine. His death is a critique of the Revolution's inability to value the individual.

  ### 4. Mapping the Explanations: Class, Ideology, or Contingency?
  Dickens hedges his bets here. He uses melodrama to blur the lines between structural inevitability and bad luck.

  | Explanation | Where it appears in the text | Does Dickens commit? |
  | :--- | :--- | :--- |
  | **Class Logic** | The starvation in Saint Antoine; The Marquis's cruelty; The hatred of the Evrémonde name. | **Yes.** Dickens is unequivocal: The Aristocracy lit the fuse. The violence is a direct reaction to feudal oppression. |
  | **Ideological Purity** | The Tribunal's refusal to hear defense; Madame Defarge's insistence on killing Lucie's child (who is innocent). | **Yes.** The demand for total purity (erasing the lineage) makes the violence self-perpetuating. |
  | **Contingency (Luck)** | **The Manette Letter.** This is the "cheat." Darnay is condemned specifically because Manette's hidden letter is found in the Bastille. | **No.** This is melodrama. If the letter isn't found, Darnay might have lived. Dickens uses this to personalize the conflict, but it weakens the argument that the Terror was *structurally* inevitable for everyone. |

  **The "Cheat":** By making the condemnation hinge on the Manette letter, Dickens shifts the blame from "The Revolution kills everyone" to "The Revolution is weaponized by personal vendettas." This allows him to condemn the Terror while still sympathizing with the revolutionaries' original cause. It suggests the Revolution was *hijacked* by private grief (Defarge/Manette) rather than being inherently evil.

  ### 5. What the Novel Adds (That History Doesn't)
  A history book can tell you that the Law of Suspects led to X number of executions. Dickens adds the **phenomenology of the devouring.**

  *   **The Sound:** The grindstone sharpening the pikes. The rhythmic fall of the blade.
  *   **The Dehumanization:** The prisoners playing at being dead to cope. The crowd knitting while watching deaths.
  *   **The Psychological Toll:** Dr. Manette relapsing into shoemaking. This shows that the "devouring" happens internally before the axe falls. The trauma of the old regime and the trauma of the new regime mirror each other.

  **For your Book Club:**
  The novel argues that violence creates a **momentum** that outstrips human intent. The Defarges start with a grievance, but they end up serving a machine (the Tribunal/The Register) that demands more blood than the grievance justifies.

  **Discussion Questions to Pose:**
  1.  **On Momentum:** At what point does the Revolution stop being about "liberating the poor" and start being about "feeding the machine"? Is there a specific scene where that switch flips for you? (Look at the storming of the Bastille vs. the later trials).
  2.  **On Carton:** If Carton's sacrifice is the moral high point of the book, does that mean Dickens thinks political change is impossible? Is the only solution private redemption, not public justice?
  3.  **On the "Cheat":** If Manette's letter had never been found, would Darnay have been safe? Or does the text suggest the Tribunal would have found another reason? (This tests the "Inevitability" vs. "Contingency" argument).
  4.  **On Defarge:** Madame Defarge says, "Tell the Wind and the Fire where to stop." Is she admitting that the Revolution is no longer under human control? If so, who is responsible for the deaths that follow?

  ### Summary for the Group
  Dickens supports the "devouring" reading not by showing revolutionaries killing each other (like the historical Robespierre/Danton), but by showing the **logic of vengeance becoming a law of nature.** Once violence is legitimized as the only path to justice, it consumes the innocent (Darnay), the architects (Defarge), and the witnesses (Manette).

  Carton's sacrifice doesn't fix this; it highlights it. He can only save a life by tricking the system, not by fixing it. The novel's contribution to the philosophy of revolution is the idea that **trauma is cyclical.** The cruelty of the Marquis creates the cruelty of Madame Defarge. The Revolution doesn't break the cycle; it completes it. The "children" are devoured because the parents (both Aristocratic and Revolutionary) refuse to stop knitting the list.
