      *   *Rescue or Admission?* Suggesting "trade on another margin" is an admission that the specific moral conflict wasn't resolvable via trade, only avoidable. It admits the trade model has limited scope.
      *   *Issue Carving (The Big Worry):* This is the critical insight. In V1, we defined "House" and "Art" as separate issues. If Jordan defines the issue as "Family Integrity," then House and Art are inseparable. If Casey defines it as "Asset Liquidation," they are fungible. The possibility of trade depends entirely on how the parties individuate the goods.
      *   *Rigging/Objection:* The case is rigged by assuming **Separability** in V1. Real moral agents often have non-separable preferences (Holism). The strongest objection is that the "Gains from Trade" model presupposes a liberal/consequentialist ontology of value (atomistic goods) that many moral frameworks reject.

