answer: |-
  **MEMORANDUM**

  **TO:** Provost Elena Rostova
  **FROM:** Committee on Teaching and Technology
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding AI Tutoring and Grading Pilot Proposal

  **Purpose**
  The Committee on Teaching and Technology has reviewed the administration's proposal to pilot an AI-driven tutoring and grading platform in high-enrollment introductory courses. While the committee acknowledges the potential for AI to alleviate administrative burdens, we are deeply divided regarding the long-term implications for pedagogical integrity and academic labor. This memo outlines our analysis and provides a conditional recommendation.

  **Analysis of the Technology**
  The administration characterizes this platform as analogous to previous classroom technologies, such as textbooks or learning management systems. The faculty opposition argues it represents a fundamental shift in the labor structure of the university. The committee finds the latter analysis more compelling regarding the specific function of *feedback*.

  Previous technologies (textbooks, recorded lectures) primarily automated *content delivery*. They scaled information but did not replicate the evaluative relationship between teacher and student. This proposal, however, automates *judgment*. By handling grading and adaptive problem-solving, the system inserts itself into the core feedback loop where learning is corrected and guided.

  Our concern is not merely that the machine might make mistakes, but that it changes the role of the human instructor. When the tool dictates the pace of adaptation and defines the criteria for success through its algorithms, the instructor risks becoming an overseer of the system rather than the architect of the learning experience. Historically, when machinery is introduced to "lighten labor" without structural guardrails, the logic of efficiency often inverts: the worker becomes subordinate to the machine's requirements. In this context, "efficiency" could easily morph into a rationale for reducing tenure-track oversight in favor of low-cost facilitation, fundamentally altering the university's educational mission.

  **Recommendation**
  The committee recommends **approving the pilot with strict conditions.** We believe rejecting the pilot outright prevents us from understanding the technology's actual impact, but approving it without constraints invites the structural risks faculty have identified.

  To proceed, the pilot must adhere to the following four conditions:

  1.  **Maintenance of Effort:** Savings generated from the pilot cannot be reallocated to reduce TA or instructional staffing levels in the participating departments. The stated goal is to free up time for "higher-value" mentoring; this must be tracked and verified. If headcount decreases, the pilot terminates.
  2.  **Pedagogical Sovereignty:** Faculty must retain final authority over grading rubrics and the ability to override AI assessments. The AI must function as a draft generator for feedback, not the final arbiter of student performance.
  3.  **Data Ownership and Exit Strategy:** The university must retain full ownership of all student data and model weights generated during the pilot. The contract must include a clear exit clause that allows the university to discontinue the platform without penalty or loss of institutional knowledge.
  4.  **Evaluation Metrics:** Success cannot be measured solely by cost savings or grading speed. The pilot must measure student learning outcomes, equity gaps, and faculty/TA workload satisfaction.

  **Conclusion**
  We can explore the utility of AI without accepting the inevitability of its dominance. By enforcing these conditions, we test whether this tool can serve the university's mission without reshaping the university to serve the tool's logic.

  Respectfully submitted,

  The Committee on Teaching and Technology
