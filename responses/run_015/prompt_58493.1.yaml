      *   Make sure to explicitly answer "cheapest fix" and "cost."
      *   Keep it conversational but rigorous.

      *(Self-Correction during drafting)*: I need to be careful not to just say "Ruth Chang says X so you are wrong." The user's view is a valid variation (Parity without Normative Power). I need to show where *their* internal logic strains, not where it deviates from a specific philosopher.
