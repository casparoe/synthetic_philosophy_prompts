          *   Tension: If the normative scale exists (Claim 2), why is the agent's will inert (Claim 3)? Usually, the "Hard Choice" framework is sold *because* it allows the will to act where reasons run out. If the will can't act, why call it a Hard Choice rather than just "Incomparable"?
          *   *Verdict:* Claim 3 is the weak link.

