answer: |-
  You have identified a crucial tension in social choice theory, and your intuition is sharp: on the surface, a weighted sum with welfare-sensitive weights looks like it could accommodate prioritarian concerns. However, you are indeed missing a technical point regarding the **axiomatic premises** of Harsanyi's theorem, specifically the implications of the **Independence Axiom** and the **measurability assumptions** regarding vNM utilities.

  For your seminar, it is vital to distinguish between the *form* of the aggregation rule (which looks similar) and the *axioms* that license that form. Prioritarianism is not merely "utilitarianism with different weights"; it is an aggregation rule that is **incompatible** with the joint set of axioms Harsanyi employs.

  Here are the three technical reasons why Harsanyi's theorem excludes prioritarianism, structured for a graduate-level discussion.

  ### 1. The Linearity Constraint (Social Independence)
  The most direct answer to your question lies in the conclusion of Harsanyi's theorem. The theorem proves that the Social Welfare Function (SWF) must be **linear** in individual vNM utilities.
  $$W(U_1, \dots, U_n) = \sum_{i=1}^n a_i U_i + b$$
  The weights $a_i$ must be **constants**. They cannot depend on the levels of $U_i$.

  **Why?**
  This linearity is a direct mathematical consequence of imposing the **vNM Independence Axiom on social preferences**.
  *   **Harsanyi's Setup:** Individuals have vNM utilities $U_i$ (representing preferences over lotteries). The Society also has a preference ordering over lotteries that satisfies the vNM axioms (including Independence).
  *   **The Conflict:** If you allow weights to be welfare-sensitive (e.g., $a_i$ increases as $U_i$ decreases), the social welfare function becomes non-linear (concave) in the $U_i$'s.
  *   **The Violation:** A non-linear SWF violates the Social Independence Axiom.
      *   *Example:* Suppose Society prefers Lottery $L$ to $L'$ because $L$ helps the worse-off. However, if we mix both $L$ and $L'$ with a third lottery $L''$ (which makes everyone equally well-off), the "worse-off" status might change or dilute. In a prioritarian framework, the ranking between $L$ and $L'$ can reverse when mixed with $L''$. In a Harsanyi (linear) framework, the ranking must remain stable.

  **Seminar Point:** Prioritarianism requires giving up the **Social Independence Axiom**. Harsanyi's theorem does not just "allow" fixed weights; it *demands* them as the only solution compatible with Social Independence. Therefore, welfare-sensitive weights are not a permissible variation within the theorem; they are a rejection of one of its core premises.

  ### 2. The Measurability and Invariance Problem
  This is often the most decisive technical objection in formal welfare economics. Harsanyi's theorem operates with **vNM utilities**, which are unique only up to **positive affine transformations** ($U_i' = \alpha U_i + \beta$, with $\alpha > 0$).

  *   **Utilitarianism:** A linear sum $\sum a_i U_i$ is invariant to affine transformations of the individual $U_i$'s (provided the weights $a_i$ are adjusted inversely to the scaling factor $\alpha$). The social ordering remains stable regardless of how we scale the zero-point or units of individual utility.
  *   **Prioritarianism:** Prioritarianism typically takes the form $W = \sum g(U_i)$, where $g$ is strictly concave. This function is **not invariant** to affine transformations.
      *   If you change the zero-point ($\beta$) or the unit ($\alpha$) of an individual's utility scale, the value of $g(\alpha U_i + \beta)$ changes non-linearly relative to others.
      *   Consequently, the social ranking of states could flip simply based on arbitrary choices of measurement scales for individual utility.

  **Seminar Point:** For prioritarianism to be well-defined, one must assume **stronger interpersonal comparability** than Harsanyi's theorem provides (typically full-level comparability or ratio-scale comparability). Harsanyi's theorem is often celebrated precisely because it derives a social ordering from weaker measurability assumptions (vNM scales + Pareto). Prioritarianism requires "richer" utility information that the vNM framework does not supply.

  ### 3. The Ex Ante vs. Ex Post Dilemma
  In the literature (e.g., Adler 2012; Otsuka & Voorhoeve 2009), prioritarianism is usually analyzed through the lens of risk. This reveals a trilemma that Harsanyi's theorem sidesteps by choosing Utilitarianism.

  There are two ways to formulate prioritarianism under uncertainty:
  1.  **Ex Ante Prioritarianism:** Apply the concave transformation to expected individual utility ($W = \sum g(E[u_i])$).
      *   *Problem:* This violates **Social Independence** (as noted in point 1).
  2.  **Ex Post Prioritarianism:** Apply the concave transformation to outcome utility, then take the expectation ($W = E[\sum g(u_i)]$).
      *   *Problem:* This violates **Ex Ante Pareto**.
      *   *Explanation:* Individuals evaluate lotteries based on expected utility $E[u_i]$. If everyone prefers Lottery A to Lottery B based on their own $E[u_i]$, Ex Ante Pareto says Society must prefer A to B. However, Ex Post Prioritarianism evaluates based on $E[g(u_i)]$. Due to Jensen's Inequality and risk attitudes, it is possible for everyone to prefer A, but the Prioritarian SWF to prefer B (because B reduces inequality in outcomes, even if it lowers expected utility).

  **Harsanyi's Choice:** Harsanyi's theorem assumes **both** Social Independence and Ex Ante Pareto. The theorem proves that the *only* function satisfying both is linear Utilitarianism. Prioritarianism forces you to choose between them.

  ### Summary for Your Seminar
  To answer your specific question: **Yes, the theorem's conclusion allows only fixed weights attached to individuals.**

  You cannot make the weights welfare-sensitive within Harsanyi's framework because:
  1.  **Axiomatically:** Welfare-sensitive weights violate the **Social Independence Axiom**, which is a premise of the theorem.
  2.  **Measurement:** Welfare-sensitive weights (via concave transformations) are not invariant to the **affine transformations** permissible for vNM utilities, making the social ordering arbitrary without stronger measurability assumptions.
  3.  **Pareto:** Implementing prioritarianism usually requires violating either Ex Ante Pareto or Social Independence, whereas Harsanyi's theorem shows Utilitarianism is the unique solution that preserves both.

  **Pedagogical Suggestion:**
  When presenting this, frame Prioritarianism not as a "rival weighting scheme" within Harsanyi's model, but as a **rival axiomatic system**.
  *   **Harsanyi/Utilitarianism:** Commits to *Ex Ante Pareto* + *Social Independence*. (Result: Linear weights).
  *   **Prioritarianism:** Commits to *Priority for the Worse Off*. (Result: Must reject either Independence or Ex Ante Pareto).

  This clarifies that the distinction is not terminological but reflects a fundamental disagreement about which rationality constraints (Independence vs. Distributional Sensitivity) should govern social choice under uncertainty.

  **Key References for the Seminar:**
  *   Harsanyi, J. C. (1955). "Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons of Utility."
  *   Adler, M. D. (2012). *Well-Being and Fair Distribution: Beyond Cost-Benefit Analysis.* (Chapters on Ex Ante/Ex Post Prioritarianism).
  *   Otsuka, M., & Voorhoeve, A. (2009). "Prioritarianism: Response to Commentators." *Ethics & Economics.*
  *   Mongin, P. (2001). "A Note on Harsanyi's Aggregation Theorem." (For technical details on the weights).
