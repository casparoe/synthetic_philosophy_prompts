          4.  (Implicit/Explicit) Individual utilities are cardinally measurable and interpersonally comparable *to the extent required by the theorem*. Actually, Harsanyi's original theorem derives the form $W = \sum a_i U_i + b$.
      *   **Conclusion:** $W(U_1, ..., U_n) = \sum_{i=1}^n a_i U_i + b$, where $a_i \geq 0$.
      *   **Key Constraint:** The weights $a_i$ are *constants*. They do not depend on the levels of $U_i$.

  3.  **Analyze Prioritarianism:**
      *   **Core Idea:** Benefits matter more the worse off the recipient is.
      *   **Mathematical Form:** Typically $W = \sum_{i=1}^n g(U_i)$, where $g$ is a strictly concave transformation of individual utility.
      *   **Alternative Formulation:** Weighted utilitarianism where weights depend on utility levels: $W = \sum_{i=1}^n w(U_i) \cdot U_i$. (Though the concave transformation is the standard definition).
