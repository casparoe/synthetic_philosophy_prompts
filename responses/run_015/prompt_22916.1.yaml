      *   If $W$ is a weighted sum with *fixed* weights ($\sum a_i U_i$), the social preference satisfies Independence.
      *   If $W$ is prioritarian ($\sum g(U_i)$ with $g$ concave), does it satisfy Independence?
          *   Let's check. Suppose we have two lotteries $L$ and $L'$.
          *   Independence says: $L \succeq L' \iff \alpha L + (1-\alpha) L'' \succeq \alpha L' + (1-\alpha) L''$.
          *   In expected utility terms, this holds if we maximize Expected $W$.
          *   If $W = \sum g(U_i)$, then Social Utility is $E[\sum g(U_i)] = \sum E[g(U_i)]$.
          *   Wait, Harsanyi's theorem assumes individuals have vNM utilities $U_i$. This means $U_i$ represents preferences over lotteries via *Expectation*. $U_i(L) = E[u_i(x)]$.
          *   Prioritarianism usually applies the concave transformation to the *outcome* utility, not the expected utility. But in the vNM framework, the "utility" $U_i$ *is* the expected utility index.
          *   If Prioritarianism is defined as $W = \sum g(U_i)$, where $U_i$ is the vNM index, then $W$ is linear in $U_i$ only if $g$ is linear. If $g$ is concave, $W$ is non-linear in the vNM indices.
          *   **Crucial Point:** Harsanyi's theorem concludes $W$ must be *linear* in the individual vNM utilities. Prioritarianism is *non-linear* (concave) in individual vNM utilities.
      *   **Why does Prioritarianism violate Harsanyi's assumptions?**
          *   It violates the **Social Independence Axiom**.
          *   Example: The "Ex Ante" vs. "Ex Post" distinction.
          *   If we treat $U_i$ as the object of aggregation, Prioritarianism says the marginal value of $U_i$ depends on the level of $U_i$.
          *   Harsanyi's linearity implies the marginal value of $U_i$ is constant ($a_i$).
          *   Therefore, Prioritarianism is excluded by the Independence Axiom imposed on social preferences.

