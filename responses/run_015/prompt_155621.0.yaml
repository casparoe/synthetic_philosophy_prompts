  ### Testing Your Hypothesis: The Drag

  You hypothesized that the gap is driven by how far the second update's target sits from the dragged value. I tested this by varying the target of $F$ while keeping everything else constant.

  *   **Target $F = 0.86$ (Matches the Drag):**
      *   Order $E \to F$: $F$ is already at 0.86. Update does nothing. $P(H) = 0.8195$.
      *   Order $F \to E$: $F$ moves 0.50 to 0.86. $E$ drags to 0.86. $E$ moves 0.86 to 0.95. $P(H) = 0.8195$.
