  ### The Independence Check

  You suspected that if $E$ and $F$ were independent, the orders would agree. I reconstructed the case with $P(E \land F) = P(E)P(F) = 0.25$ (removing the correlation, keeping marginals and $H$-likelihoods as close as possible).

