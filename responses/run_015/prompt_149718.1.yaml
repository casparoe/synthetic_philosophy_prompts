answer: |-
  Golding morally endorses Ralph's rational order but pessimistically argues it inevitably collapses against innate savagery, rendering Kantian universalisability practically useless against psychological impulse.

  Jack's maxim—'rule through fear when I am chief'—fails the Contradiction in Will test. Universalised, a world where all leaders rule by terror destroys the security required for leadership to function. We see this in the hunt for Ralph; when fear is universalised, even the chief becomes prey. It is not a logical contradiction (such a world can exist), but a volitional one. Conversely, Ralph's conch rule—'speak only when holding the shell'—passes universalisation, fostering cooperation. However, the assembly scenes show this failing not logically, but because the boys' wills corrupt.

  Kant's test assumes rational individuals, yet Golding resists this by showing the 'group will' overriding individual reason. When the tribe chants during Simon's death, individual maxims dissolve into collective madness. The indexical 'for my tribe' creates a particularistic duty that overrides universal law. The failure here is not in the logic of the maxim, but in the capacity of the agent to remain rational.

  Ultimately, Golding suggests rational discourse collapses not because it is logically flawed, but because human nature refuses to will the universal law. The beast is within, not in the logic. Kant presumes we *can* choose reason; Golding shows the boys *cannot* when fear dictates the will. The gap between Contradiction in Conception and Will widens into an abyss of irrationality where the test no longer applies.
