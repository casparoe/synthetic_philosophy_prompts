      *   *Req 2 (Tight Community vs. Pathology):* Crucial for avoiding elitism. Case: Math Dept vs. Medical Gaslighting Group.
      *   *Req 3 (Truth vs. Process):* Epistemic hygiene. Case: Lucky Guessers.
      *   *Req 4 (Issue vs. Affective):* Political science distinction. Case: Policy disagreement vs. Dehumanization.
      *   *Req 5 (Empirical Constraints):* This is the reality check.
          *   (a) Backfire effect is weak/rare.
          *   (b) Cross-cutting exposure can backfire.
          *   (c) False polarization (perception gap).
      *   *Req 6 (Harm):* Normative grounding. Case: Happy but deluded cultist.

  3.  **Identify Missing/Weak Points:**
      *   *Missing:* **Exit Costs.** A key feature of echo chambers isn't just entry, it's how hard it is to leave. (Req 1 touches on this, but exit costs are structural).
      *   *Missing:* **Scale/Power.** A theory should distinguish between a harmless hobby group and a group that influences policy/violence.
      *   *Weakness in Req 5:* The user treats these as settled facts. A theory needs to explain *why* these happen, not just fit them. But as constraints, they are good.
      *   *Weakness in Req 6:* "Harm" is tricky. Is it individual harm or societal harm? The user asks for "the harm," implying singular. It might need to be plural (individual epistemic agency vs. democratic function).

