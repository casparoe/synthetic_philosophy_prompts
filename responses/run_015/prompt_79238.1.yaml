      *   The user suspects tension between not pathologizing tight groups (2) and defining harm (6).
      *   *Analysis:* The tension is real but resolvable. The resolution lies in *mechanism*, not *outcome*. If the harm is defined as "loss of epistemic agency" (inability to update based on evidence) rather than "holding false beliefs," you can protect the Math Dept (they follow evidence) and the Medical Group (they follow shared evidence/experience) while condemning the Echo Chamber (they are structurally prevented from accessing contrary evidence).
      *   *However:* There is a deeper tension between Req 5(b) (contact makes it worse) and the intuitive solution to Req 1 (open the bubble). A theory must explain why *opening* the bubble sometimes fails.

  5.  **Determine the "Most Work" Requirement:**
      *   Req 2 (Don't pathologize tight groups) is the hardest filter. Most lazy theories define echo chambers as "groups that believe X (where X is false)." This fails the Math Dept and the Medical Gaslighting cases. A theory must be *structural*, not *doctrinal*.
      *   Req 5(b) is also a heavy hitter. It kills the "Just expose them to the other side" theory.

  6.  **Drafting the Response (Iterative Process):**

