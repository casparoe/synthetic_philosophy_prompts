      *   *Emphasis:* Highlight that "Echo Chamber" and "Epistemic Bubble" are often conflated but structurally distinct (Req 1 covers this).

  9.  **Final Review against constraints:** No reading list? Check. No names/dates? Check. Answer specific questions? Check.

