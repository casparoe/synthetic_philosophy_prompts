          *   Resolution: Define harm as **Epistemic Dependency** or **Loss of Agency**, not False Belief. This saves the Math Dept (they are free to leave if proof arises) and the Medical Group (they are aggregating data), but catches the Echo Chamber (leaving means social death/trust collapse).
          *   So, 1 and 2 are compatible with 6 *if* harm is defined structurally, not doxastically.
      *   *The "Most Work" Requirement:*
