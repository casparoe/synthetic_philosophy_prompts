answer: |-
  ### Skeleton Selection

  I have selected the **ex-ante choice made behind a veil of ignorance** skeleton. This choice forces the Common Prior Assumption (CPA) to operate as a binding commitment on updating policies rather than a statistical coincidence, making violations detectable as diachronic inconsistencies between a student's sealed plan and their actual bets. I rejected the trading and bookmaking skeletons because they tend to obscure the *source* of disagreement (prior vs. information) with strategic haggling, and I rejected the iterated announcement skeleton because it is too abstract and notation-heavy to generate the visceral "pressure" of potential loss within 80 minutes.

  ---

  # Game Design: The Veil & The Wager

  ## 1. Learning Objective
  Students will experience the Common Prior Assumption not as an empirical claim that people *do* agree, but as a normative constraint: if you accept a common prior, you are committed to specific counterfactual beliefs. Violating this commitment creates arbitrage opportunities (Dutch Books) for a mediator. Deep disagreement is only rational when the "Veil" is torn (i.e., when priors legitimately diverge).

  ## 2. Materials
  *   **16 Index Cards (Signals):** 8 marked "Red", 8 marked "Blue". (Representing private evidence from an Urn).
  *   **16 Envelopes:** For the Blind Prior Escrow.
  *   **16 "Veil Worksheets":** Tables for ex-ante planning.
  *   **2 "Bookmaker Kits":** Calculators, scoring sheets, and a distinct badge/vest.
  *   **Projector:** For the Leaderboard and House Prior display.
  *   **Whiteboard:** For tracking aggregate bets.
  *   **Stakes:** Leaderboard points (0–100). Top score wins a coffee voucher.

  ## 3. The Hidden State
  *   There is an Urn. It is either **Type A** (60% Red, 40% Blue) or **Type B** (40% Red, 60% Blue).
  *   The True State is fixed by the instructor at the start (e.g., Type A) but kept secret until the very end.
  *   *Likelihoods are Common Knowledge:* Everyone knows the 60/40 split.

  ## 4. Rules & Payoff Scheme

  ### Phase 1: Blind Prior Escrow (10 Minutes)
  1.  **Private Write:** Each student writes a credence $P(\text{Type A})$ on an index card (0.0 to 1.0) and seals it in an envelope.
  2.  **The Draw:** The instructor collects envelopes, shuffles, and draws **one** at random. This number is projected as the **House Prior ($P_0$)**.
  3.  **The Contract:** All students are now *normatively bound* to treat $P_0$ as their starting point for this round.
      *   *Payoff:* No points yet. This establishes the "Common" in Common Prior.

  ### Phase 2: The Veil (Ex-Ante Planning) (15 Minutes)
  1.  **The Worksheet:** Students receive the "Veil Worksheet." It has two rows: "If Signal is Red" and "If Signal is Blue."
  2.  **The Commitment:** Without seeing their signal, students must calculate and write down what their credence in Type A *would be* for each signal, conditionalizing on the House Prior $P_0$ and the known Likelihoods (60/40).
      *   *Example:* If $P_0 = 0.5$, Red implies $\approx 0.6$, Blue implies $\approx 0.4$.
  3.  **Submission:** Worksheets are collected by the Bookmakers. They are now binding contracts.
      *   *Payoff:* 20 Points base. Deduct 5 points for every 0.1 deviation from the correct Bayesian conditionalization of $P_0$ (checked later).

  ### Phase 3: Signal & Arbitrage (25 Minutes)
  1.  **Distribution:** Students receive their private Signal card (Red or Blue).
  2.  **The Market:** Students write their *Actual Credence* on a new slip.
  3.  **The Bookmakers (2 Students):**
      *   They hold the Veil Worksheets.
      *   They know the House Prior and the Likelihoods.
      *   **Task:** They scan the Actual Credence slips. If a student's Actual Credence deviates from their own Veil Worksheet *or* from the House Prior's implication, the Bookmaker offers a bet.
      *   **The Arbitrage:** If Student X wrote 0.6 on the Veil (for Red) but now claims 0.5, the Bookmaker buys a ticket from X that pays \$1 if Type A is true at price \$0.55. X is guaranteed to lose points relative to their own plan.
      *   **Payoff:** Bookmakers earn 10 points per successful arbitrage. Traders lose 10 points per arbitrage accepted.
      *   *Constraint:* Bookmakers cannot bet on the state itself, only on the *consistency* of the trader.

  ### Phase 4: The Sectarian Round (20 Minutes)
  1.  **The Split:** The room is divided. Left Side (8 students) is told: "You are drawing from **Factory X** (Base rate of Type A is 80%)." Right Side (8 students) is told: "You are drawing from **Factory Y** (Base rate of Type A is 20%)."
  2.  **The Shift:** This information legitimately changes their *Prior*. The House Prior ($P_0$) is no longer common to all.
  3.  **The Trade:** Students are allowed to bet against each other (or the Bookmaker) based on their new posteriors.
  4.  **Payoff:** Points awarded for accuracy (Brier Score) relative to the *True State*. Consistency with the *original* Veil Worksheet is **no longer penalized**.
      *   *Goal:* Show that disagreement is now rational and betting is permissible because the CPA is suspended.

  ### Phase 5: Reveal & Settle (10 Minutes)
  1.  Reveal the True State (Type A or B).
  2.  Calculate final scores.
  3.  Award Coffee Voucher.

  ---

  ## 5. Minute-by-Minute Timeline

  *   **00–05:** **Intro.** Explain the Urn, the Likelihoods, and the Stakes. Emphasize: "This is not about guessing the urn; it's about keeping your promises."
  *   **05–15:** **Blind Prior Escrow.** Students write priors. Instructor draws House Prior. Project it.
  *   **15–30:** **The Veil.** Students fill out the Signal-Swap Table. *Crucial:* Collect these before distributing signals.
  *   **30–35:** **Signal Distribution.** Hand out Red/Blue cards. Students write Actual Credence.
  *   **35–55:** **Bookmaking Round.** Bookmakers circulate. They compare Actual Credence vs. Veil Worksheet. They offer bets on inconsistencies. Leaderboard updates live.
  *   **55–75:** **Sectarian Round.** Split the room. Give Factory stories. Allow betting. Observe the shift in atmosphere (from "compliance" to "conflict").
  *   **75–80:** **Debrief.** (See below).

  ---

  ## 6. The Debrief: Mapping Moments to Concepts

  1.  **The Escrow Draw (The Counterfactual):** Ask the student whose prior was drawn: "Did you *actually* believe that number more than anyone else?" (No). "Then why did it bind everyone?"
      *   *Point:* The CPA is not about *who* you are, but the policy you accept *before* you know who you are.
  2.  **The Bookmaker's Profit (The No-Trade Theorem):** Highlight a student who lost points to the Bookmaker. "You traded against your own plan. Why?"
      *   *Point:* If you share a prior and know you do, you cannot rationally trade against someone who is updating correctly on that prior. Trading implies you think *your* prior is better than the Common one.
  3.  **The Sectarian Split (Deep Disagreement):** Ask the Left Side: "Why were you allowed to bet against the Right Side now?"
      *   *Point:* Because you no longer shared a prior. The disagreement wasn't about the signal (information); it was about the Factory (worldview). This is when betting is required, not forbidden.
  4.  **The "Aha" Moment:** Ask a student who traded in Round 3 but not Round 4: "What did you concede about your own rationality when you took that bet in Round 3?"
      *   *Point:* You conceded that your posterior was not merely a function of your evidence, but of your *self*. You violated the injunction: "I would have held your belief had I held your evidence."

  ---

  ## 7. Predictable Failures & Mitigations

  *   **Failure:** *Students treat it as an Urn Puzzle.* They try to "guess" the House Prior rather than using the drawn number.
      *   **Mitigation:** The Instructor must explicitly state: "The drawn number is the Truth for scoring purposes, regardless of your intuition."
  *   **Failure:** *Anchoring.* One confident student announces their prior loudly during Escrow, influencing others.
      *   **Mitigation:** Enforce silence during the writing phase. Collect envelopes immediately.
  *   **Failure:** *Timid Bookmaker.* The two students chosen as Bookmakers feel bad taking points from friends.
      *   **Mitigation:** Frame the Bookmaker as the "Auditor of Rationality." Their points come from the "Bank," not the traders' scores. Give them a distinct title (e.g., "Epistemic Regulators").
  *   **Failure:** *Veil Collapse.* A student guesses their signal before filling the table.
      *   **Mitigation:** Physically separate the "Planning" phase from the "Signal" phase. Collect worksheets *before* handing out Red/Blue cards.
  *   **Failure:** *Confusion on Common Knowledge.* Students think "Common Prior" means "We all have the same information."
      *   **Mitigation:** During debrief, point to the Red/Blue cards. "You had different info. But you had the same *rule* for processing it. That is the Common Prior."

  ---

  ## 8. Addressing the Economics Colleague

  **Objection:** "Stipulating a prior is cheating. You are forcing them to share a prior, so of course they won't disagree. This proves nothing about the real world."

  **Design Response:**
  The game does not claim that people *naturally* share priors. The **Blind Prior Escrow** addresses this by making the prior *endogenous* to the group—it is one of their own numbers, chosen behind a veil. The **Sectarian Round** explicitly breaks this stipulation to show what happens when the assumption fails.
  The point of the exercise is not to prove the CPA is *true*, but to demonstrate its *normative force*. The colleague confuses the *descriptive* claim (people do agree) with the *regulative* claim (rational agents *should* act as if they share a prior unless they have specific evidence of divergence). The Bookmaker's arbitrage shows the cost of violating that regulative ideal. We are testing the *coherence* of the assumption, not its empirical frequency.

  ---

  ## 9. Limitations: What You Must Say Yourself

  Be frank with the class at the end. This game is a model, not the territory.

  1.  **Common Knowledge Hierarchy:** "In the game, you knew that everyone knew the House Prior. In reality, I might know you know, but not know that you know that I know. The Aumann agreement theorem requires infinite recursion of this knowledge. We only ran one level."
  2.  **The Limit Structure:** "We stopped after one round of betting. The Agreement Theorem says you converge *eventually*. We didn't wait for the limit."
  3.  **The Counterfactual Gap:** "This is the most important limitation. In the Veil Round, you *actually* wrote down what you would believe. In real life, the CPA is a claim about a *counterfactual*: 'If I had your evidence, I would have your belief.' No game can make you actually experience someone else's evidence. You must take it on faith that your rationality is similar enough to theirs that the counterfactual holds. That faith is the Common Prior Assumption."
