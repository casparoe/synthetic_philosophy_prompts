  Here is the decision tree. It contains **seven branch nodes** and terminates in **five named leaves**. 

  To satisfy the constraint of seven nodes with only five leaves, two pairs of terminal branches converge on the same Position (Leaves 4 and 5). I have flagged these convergences explicitly. The tree assumes the starting commitment: *$h^2 = 0.6$ for grip strength in British 60-year-olds.*

  ### The Heritability Licencing Tree

  **Node 1 (The Group Gap)**
  *Claim:* Does this 0.6 figure allow you to estimate what proportion of the grip-strength difference between British and American 60-year-olds is genetic?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 3.

  **Node 2 (The Prevention Check)**
  *Claim:* If you answered Yes above, does that mean an environmental intervention (e.g., universal nutrition) could *not* close that gap?
  *   **Yes** → **Leaf 1: The Hard Hereditarian**
  *   **No** → **Leaf 2: The Soft Hereditarian**

  **Node 3 (The 100% Case)**
  *Claim:* If heritability for this trait were 1.0, could an environmental intervention still change the population's *average* grip strength?
  *   **Yes** → Go to Node 4.
  *   **No** → **Leaf 3: The Variance Conflator**

  **Node 4 (The Intervention Response)**
  *Claim:* Does the effectiveness of a strength-training programme depend partly on the participant's genotype (G×E interaction)?
  *   **Yes** → Go to Node 5.
  *   **No** → **Leaf 4: The Additive Purist**

  **Node 5 (The Age Fact)**
  *Claim:* Is the heritability of grip strength typically higher in 60-year-olds than in 20-year-olds?
  *   **Yes** → Go to Node 6.
  *   **No** → **Leaf 5: The Data Denier**

  **Node 6 (The Age Mechanism)**
  *Claim:* Is this increase primarily because adults actively select environments that match their genetic predispositions (niche-picking)?
  *   **Yes** → Go to Node 7.
  *   **No** → **Leaf 4: The Additive Purist** *(Convergence: Indistinguishable from Node 4 'No' on policy)*

  **Node 7 (The Individual Fallacy)**
  *Claim:* Does the 0.6 figure tell you that 60% of *your* personal grip strength is due to your genes?
  *   **Yes** → **Leaf 5: The Data Denier** *(Convergence: Indistinguishable from Node 5 'No' on incoherence)*
  *   **No** → **Leaf 4: The Additive Purist** *(Convergence: Indistinguishable from Node 4 'No' on outcome)*

  ***

  ### The Leaves (Positions)

  **Leaf 1: The Hard Hereditarian**
  *   **Most Awkward Commitment:** You must argue that PKU (100% heritable) cannot be cured by diet, or that grip strength cannot be improved by exercise, despite empirical evidence to the contrary.
  *   **Status:** Held by your economist friends (before you correct them).

  **Leaf 2: The Soft Hereditarian**
  *   **Most Awkward Commitment:** You accept that within-group variance is genetic, but you must explain why between-group variance is also genetic without falling into Lewontin's fallacy, often requiring strong assumptions about environmental equivalence.
  *   **Status:** Common in behavioural genetics, controversial in sociology.

  **Leaf 3: The Variance Conflator**
  *   **Most Awkward Commitment:** You believe that if a trait is genetically determined (100% $h^2$), the mean of the trait is fixed, meaning glasses cannot fix eyesight and diet cannot fix PKU.
  *   **Status:** Incoherent; nobody holds this consistently once confronted with PKU.

  **Leaf 4: The Additive Purist** (Includes Node 4-No, Node 6-No, Node 7-No)
  *   **Most Awkward Commitment:** You treat $h^2$ as a stable property of the trait rather than the population, implying that mandatory gym programmes would not alter the heritability estimate, which violates the definition of $h^2$.
  *   **Status:** The "Default" Biologist view; practically useful but theoretically fragile.
  *   **Flag:** *This leaf collects three different reasoning paths. The tree cannot separate a person who denies G×E from a person who denies niche-picking or the individual fallacy; they all end up treating $h^2$ as a fixed, population-level statistic.*

  **Leaf 5: The Data Denier** (Includes Node 5-No, Node 7-Yes)
  *   **Most Awkward Commitment:** You either deny the empirical finding that $h^2$ increases with age, or you attribute variance to the individual, both of which require rejecting standard quantitative genetic theory.
  *   **Status:** Empty/Incoherent. Nobody lives here permanently; it is a trap for the unwary.
  *   **Flag:** *This leaf collects two different errors. The tree cannot separate someone who denies the age effect from someone who commits the individual fallacy; both positions are equally incompatible with the starting premise.*

  ***

  ### Notes on the Specific Arguments

  1.  **100% Heritable but Preventable:** This is tested at **Node 3**. If you answer "No" (you can't change the mean), you fall into **Leaf 3 (Variance Conflator)**. The correct path ("Yes") acknowledges that $h^2$ is about *variance*, not the *mean*. A universal environmental change (diet) can shift the mean to the maximum for everyone, reducing variance to zero and $h^2$ to zero, even if the trait was previously 100% heritable.
  2.  **Intervention Response (G×E):** This is tested at **Node 4**. Your mate is right: the *response* to an intervention can be heritable even if the baseline trait is not, and vice versa. If you answer "No" (everyone responds the same), you ignore G×E. If you answer "Yes", you move deeper into the tree, acknowledging that $h^2$ is context-dependent.
  3.  **Between-Group Differences:** This is tested at **Node 1**. Your mate is right here too: within-group $h^2$ does not license inferences about between-group differences (Lewontin's Fallacy). Answering "Yes" leads to the Hereditarian leaves (1 or 2); answering "No" is the standard quantitative genetic position.
  4.  **Age Effect:** This is tested at **Nodes 5 and 6**. $h^2$ is higher in older cohorts not because genes "activate" later, but because environmental variance shrinks (everyone has had similar life exposures) or because active G×E (niche-picking) accumulates over time. This is not a separate branch from malleability; it is a consequence of **Node 4 (G×E)** and **Node 6 (Mechanism)**. If genes drive environment selection (Node 6-Yes), heritability rises as people age into their chosen niches.
