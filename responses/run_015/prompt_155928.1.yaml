      *   **Liability vs. Wrongness:** One can be equally culpable for a bad outcome but differ in liability to physical intervention.
      *   **The Threat Condition:** Defensive force is justified against those who *pose* a threat. The killer poses the threat. Dana (the omitter) does not pose the threat; the illness/nature poses the threat. Dana merely fails to stop it.
      *   **Bodily Autonomy/Integrity:** Forcing Dana's finger violates her bodily integrity in a way that stopping a killer's finger does not. Stopping a killer respects their status as an agent who chose to act; forcing an omitter treats them as a tool.
