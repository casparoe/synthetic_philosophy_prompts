      *   *Correction:* The user says (3) settles the doctor's case. Withdrawing vs. Injecting. If the patient requests it, both are okay. If the user thinks they are morally equivalent *wrongs* when done without consent, that holds. But the Dana case is about *compelling* the agent.
      *   *Crucial Distinction:* The right to *act* (or omit) vs. the liability to *be stopped*.
      *   **The "Doing/Allowing" Distinction Re-emerging:** The user fears the distinction is coming back. It is, but not as a measure of *wrongness* (which (3) denies), but as a measure of *enforceability* or *liability*. This is a standard move in rights theory (e.g., Thomson, Quinn). Negative rights (not to be killed) are enforceable; Positive rights (to be saved) are often not enforceable by force against the body.

  7.  **Drafting the Response:**

