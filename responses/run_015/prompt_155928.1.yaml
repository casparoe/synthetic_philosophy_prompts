      *   **Explain Why (4) is False:** The "Mirroring Principle" fails because liability to defensive force depends on *causal contribution to the threat*, not just moral culpability for the outcome.
      *   **Address the "Blocking vs. Conscripting" Insight:** Confirm this is the right intuition. It maps onto the distinction between *negative duties* (enforceable) and *positive duties* (often unenforceable by physical coercion).
      *   **Address the "Grave Wrongs" Worry:** Rejecting (4) doesn't mean the wrong goes unprevented; it means *this specific means* (violating bodily autonomy) is off the table. It preserves the idea that we can't use people as mere means, even to stop their own omissions.
