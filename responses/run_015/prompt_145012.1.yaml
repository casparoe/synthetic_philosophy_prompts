  1.  **Analyze the Request:**

      *   **User:** Lay member of a clinical ethics committee (CEC), 8 months in.
      *   **Task:** Run a 45-minute session on moral uncertainty/framework disagreement.
      *   **Context:** Live docket: Fund expensive therapy for 1 patient (large benefit) vs. discharge procedure change for many patients (small benefit each).
      *   **Audience:** 13 people (clinicians, lawyer, chaplain, economist, lay members, chair). No philosophy training. Impatient with theory.
      *   **Constraints:** Whiteboard + 1-page handout. No readings/citations. Do not explain the topic *to me* (the user), give me a plan *for explaining it*.
      *   **Required Elements:**
          1.  Order of ideas & dependencies (specifically fact vs. framework uncertainty).
          2.  The One Case (based on the docket, 3 frameworks diverging, stripping empirical uncertainty, named patient issue).
          3.  Misconceptions (order of appearance, when to head off, which to let surface).
          4.  The Hardest Thing (incommensurability of scales, timing, presentation).
          5.  The Refusal (what *not* to explain).
          6.  The Check (last 5 mins, new case where compromise is worst).
          7.  The Complication (individual vs. collective uncertainty).

  2.  **Deconstruct the Required Elements & Draft the Plan:**

      *   **Goal:** Practical decision-making under moral pluralism, not philosophy class.
      *   **Time:** 45 minutes is tight. Needs high impact, low jargon.

      *   **1. Order of Ideas:**
          *   Start with the *decision*, not the theory.
          *   Need to establish that facts are settled (per user instinct) to isolate the moral disagreement.
          *   *Crucial:* Fact vs. Framework uncertainty must come early. If they think it's a fact dispute, they'll ask for more data. If they think it's framework, they'll look for values.
          *   Flow: The Docket -> The Agreement on Facts -> The Disagreement on "Why" -> The Three Lenses -> The Problem of Comparison -> The Collective Dimension -> The Check.

      *   **2. The One Case:**
          *   *Base:* The live docket (1 big benefit vs. many small benefits).
          *   *Frameworks:*
              1.  Aggregating (Utilitarian/Cost-Benefit): Many small > One big.
              2.  Priority to Worst Off (Prioritarian/Egalitarian): One big (if patient is desperate) > Many small.
              3.  Side-Constraint (Deontological/Rights): Maybe a rule about "not abandoning identifiable lives" or "procedural justice." Actually, for the docket, a side-constraint might be "Do not deny established care pathways" or "Do not treat patients as mere numbers." Let's refine:
                  *   Aggregating: Maximize total QALYs. (Fund discharge).
                  *   Priority: Save the identifiable life facing death/loss. (Fund therapy).
                  *   Constraint: "First come, first served" or "Do not revoke existing entitlement." Let's make it simpler: A rule against "gambling with lives." Or perhaps a procedural constraint: "We must follow the established funding criteria."
                  *   *Better for divergence:*
                      1.  **Maximize Total Health:** Fund the discharge program (more total health).
                      2.  **Save the Identifiable Life:** Fund the therapy (duty to the specific patient in front of us).
                      3.  **Fair Process/Rule:** Do not make ad-hoc exceptions (Fund neither? Or Fund the program because it's systematic?).
                      *Wait, the prompt asks for:* Aggregating, Priority to Worst Off, Side-Constraints.
                      *   Aggregating: Many small > One big.
                      *   Priority: One big (if worst off) > Many small.
                      *   Constraint: "Do not violate rights." Maybe the constraint is "Do not deny treatment to those who meet criteria."
              *   *Stripping:* Remove empirical uncertainty (user's instinct is correct). If they argue about efficacy, it's not moral uncertainty.
              *   *Named Patient:* User asks if removing the named patient is a mistake. *Verdict:* Yes, it's a mistake. The "Identifiable Victim Effect" is crucial for the Priority view. Without a face, the "Worst Off" argument loses traction against the Aggregating view. Keep it anonymized but vivid ("Patient X").
              *   *Construction:* Make sure the numbers are clear so the math works for the Aggregator, but the *moral weight* works for the Prioritarian.

      *   **3. Misconceptions:**
          *   *List:* Middle option = fair; Averaging frameworks = averaging experts; Moral uncertainty = empirical uncertainty; No ranking = arbitrary/vote.
          *   *Order:*
              1.  "Moral uncertainty = empirical uncertainty" (Poisonous early. Must kill first).
              2.  "Middle option = fair" (Will surface when discussing compromise).
              3.  "Averaging frameworks" (Will surface when trying to resolve).
              4.  "Arbitrary/Vote" (Will surface at the end if no solution found).
          *   *Strategy:* Let "Middle option" surface briefly to show its weakness. Kill "Empirical uncertainty" immediately.

      *   **4. The Hardest Thing (Incommensurability):**
          *   Concept: QALYs vs. Duties vs. Rights. You can't add them up.
          *   Timing: After frameworks are defined, before trying to resolve.
          *   Presentation: Use the whiteboard. Draw three different rulers. One measures inches, one measures weight, one measures temperature. You can't average them.
          *   Avoiding "Do whatever": Emphasize *justification* over *calculation*. We must give reasons that survive the shift in framework.

      *   **5. The Refusal:**
          *   User suggests: How weights get assigned to frameworks.
          *   *Alternative:* How to prove one framework is *true*.
          *   *Decision:* The user is right. Assigning credence (probability a framework is true) is meta-ethics quicksand. But actually, for a committee, the harder refusal is "I cannot tell you which framework is the *right* one." That's the job of the committee, not the facilitator. However, the prompt asks what *I* should refuse to explain. Assigning weights (credences) to moral theories is technically the "moral uncertainty" literature's core problem (e.g., MEV). If I explain that, it becomes math. If I refuse that, it keeps it practical.
          *   *Better Refusal:* "I will not tell you how to calculate the 'probability' that Utilitarianism is true." It invites false precision.

      *   **6. The Check (Last 5 mins):**
          *   Need a case where compromise is worst for *everyone*.
          *   *Classic:* The "Half-Bribe" or "Half-Punishment" or "Splitting the Baby."
          *   *Scenario:* A policy on consent.
              *   Framework A (Autonomy): Full consent required.
              *   Framework B (Beneficence): Treatment mandatory if beneficial.
              *   Compromise: Ask for consent but treat anyway if they hesitate? Or treat half the patients?
              *   *Better:* Resource allocation.
              *   Case: Two patients need a kidney. One is 20, one is 70.
              *   Aggregator: 20yo (more life years).
              *   Prioritarian: 70yo (worse off/less chance).
              *   Constraint: Lottery (Equal chance).
              *   Compromise: Give half a kidney to each? (Both die).
              *   *Wait, needs to be ranked last by every framework.*
              *   *Scenario:* A safety protocol.
              *   View 1: Safety first (Stop work).
              *   View 2: Production first (Continue work).
              *   Compromise: Continue work but with reduced safety? (View 1 hates risk, View 2 hates delay).
              *   *Best:* The "Split the Difference" on a Right.
              *   Case: Testing a drug without consent.
              *   View 1 (Consequentialist): Do it (saves lives).
              *   View 2 (Deontologist): Don't (violates rights).
              *   Compromise: Test on half the patients without consent.
              *   View 1: Less benefit than testing all.
              *   View 2: Still violates rights (just fewer).
              *   *Verdict:* This works. "Half a violation is still a violation; half a benefit is less benefit."

      *   **7. The Complication (Individual vs. Collective):**
          *   Committee members hold different views.
          *   *Strategy:* Run both from the outset. "Imagine you are convinced of X. Now imagine your colleague is convinced of Y."
          *   *Loss:* If you focus only on individual, you miss the political reality of the committee. If only collective, it feels abstract.
          *   *Decision:* Frame it as "How *we* decide" but use "How *you* reason" to build empathy. Start with individual reasoning to build the tools, then apply to the group dynamic. "If you can't decide within yourself, how do we decide among ourselves?"

  3.  **Refining the Plan (Self-Correction/Optimization):**

      *   *Time Management:* 45 mins is very short.
          *   Intro/Case (5)
          *   Frameworks (10)
          *   Incommensurability (10)
          *   Collective/Decision (10)
          *   Check (5)
          *   Buffer (5)
