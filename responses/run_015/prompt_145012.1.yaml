      *(Refining the "Named Patient" advice)*: The user thinks removing the named patient removes empirical uncertainty. I need to correct this. You can have a named patient with certain outcomes. The "Identifiable Victim" is a *moral* feature, not an *empirical* uncertainty. I must insist they keep the patient but fix the outcomes.

