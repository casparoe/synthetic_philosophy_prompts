      *   *Whiteboard:* For the "Scales" analogy.
      *   *Tone:* Pragmatic. "We need to sign off on this by noon."
      *   *Fact vs. Framework:* This needs to be the very first pivot. "We agree on the data. We disagree on the meaning."
      *   *Named Patient:* I need to be firm. Keep the patient. It makes the "Priority" view intelligible. Without the patient, it's just math.
      *   *Refusal:* Stick with "Assigning probabilities to moral truths." It's the biggest trap for non-philosophers (trying to say "I'm 60% Utilitarian").
      *   *Check Case:* The "Half-Violation" is strong. Let's polish that.

  4.  **Final Review against Constraints:**
      *   Do not explain topic to me? (Check).
      *   Order of ideas/dependencies? (Check).
      *   Fact vs. Framework timing? (Check).
      *   One Case construction (3 frameworks, stripping, named patient)? (Check).
      *   Misconceptions (order, head off/let surface)? (Check).
      *   Hardest Thing (incommensurability, timing, presentation)? (Check).
