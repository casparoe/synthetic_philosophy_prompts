answer: |-
  ### 1. Order of Ideas and Dependencies

  **Minute 0–5: The Decision, Not the Theory**
  *   **Action:** Put the live docket on the whiteboard. State the choice: Therapy (1 patient, large benefit) vs. Discharge (Many patients, small benefit).
  *   **Dependency:** None. Start with the pressure they feel.
  *   **Crucial Pivot (Minute 5):** **Fact vs. Framework Uncertainty.**
      *   **Instruction:** Explicitly state: "We are assuming the clinical data is perfect. We know the outcomes. We know the costs. The disagreement is not about *what will happen*, but about *what matters*."
      *   **Why here:** If you wait, clinicians will try to solve the moral problem by asking for more data (e.g., "Are we sure the therapy works?"). You must close the empirical door immediately to force the moral conversation. If they think the uncertainty is empirical, they will treat this as a request for more evidence, not a request for reasoning.

  **Minute 5–15: The Three Lenses (The One Case)**
  *   **Action:** Define the three frameworks using the docket.
  *   **Dependency:** Depends on the "Facts are Settled" premise.
  *   **Instruction:** Map the committee's existing intuitions to these labels.
      1.  **The Aggregator:** Total health produced. (Verdict: Discharge program).
      2.  **The Prioritarian:** Priority to the worst-off/identifiable life. (Verdict: Therapy).
      3.  **The Constraint:** Rules that cannot be broken (e.g., "No ad-hoc exceptions to funding criteria"). (Verdict: Neither/Status Quo, or Discharge because it follows system rules).
  *   **Why here:** You need them to see that reasonable people using different "moral rulers" get different answers *even with the same facts*.

  **Minute 15–25: The Hardest Thing (Incommensurability)**
  *   **Action:** Explain that these rulers measure different things.
  *   **Dependency:** Depends on them accepting that the frameworks yield different verdicts.
  *   **Instruction:** Use the whiteboard. Draw three scales: one measuring weight, one temperature, one length. Ask: "If Framework A says +10 units of Health, and Framework B says -1 unit of Duty, what is the sum?"
  *   **Why here:** You cannot discuss resolution strategies (voting, compromising) until they understand that *adding up the scores is nonsense*. If you do this later, they will try to "average" the results.

  **Minute 25–35: The Collective Problem**
  *   **Action:** Shift from "How do I decide?" to "How do we decide?"
  *   **Dependency:** Depends on understanding incommensurability.
  *   **Instruction:** Acknowledge that five people are Aggregators, three are Prioritarians, etc. The uncertainty is not just in one head; it is across the room.
  *   **Why here:** This validates their impatience. It moves from abstract philosophy to committee governance.

  **Minute 35–40: Resolution Strategies (and what to avoid)**
  *   **Action:** Discuss how to act without a single "right" answer.
  *   **Dependency:** Depends on the Collective Problem.
  *   **Instruction:** Focus on *robustness* (can we justify this under multiple frameworks?) rather than *optimization* (which is best?).

  **Minute 40–45: The Check**
  *   **Action:** Run the new case (see Section 6).
  *   **Dependency:** All previous steps.

  ---

  ### 2. The One Case

  **Construction:**
  Use the live docket but硬化 (harden) the empirical details.
  *   **Patient A:** Will die within a month without the therapy. With therapy, lives 5 years in good health. Cost: £100k.
  *   **Group B:** 10,000 patients. Without discharge change, each loses 1 week of good health due to delays. With change, no loss. Cost: £100k.
  *   **Total Benefit:** Therapy = 5 QALYs (Quality-Adjusted Life Years). Discharge = ~10,000 weeks ≈ 190 QALYs.

  **The Three Frameworks Diverging:**
  1.  **Aggregating (Utilitarian):** 190 QALYs > 5 QALYs. **Fund Discharge.**
  2.  **Priority to Worst Off (Prioritarian):** Patient A faces death (catastrophic loss). Group B faces minor inconvenience. The moral weight of saving A outweighs the sum of minor gains for B. **Fund Therapy.**
  3.  **Side-Constraint (Deontological/Procedural):** "We do not make individual exceptions to funding guidelines outside the standard appeal process." Funding A now bypasses the queue/rules. **Fund Neither** (or Fund Discharge as it is systemic, but definitely *not* A).

  **Stripping Empirical Uncertainty:**
  *   **Your Instinct:** Correct. Remove all "might," "could," or "evidence suggests." State outcomes as facts. If they argue efficacy, you have failed to isolate the moral uncertainty.
  *   **Named Patient:** **Your instinct to remove the named patient is a mistake.**
      *   **Reason:** The "Priority to Worst Off" view relies heavily on the *identifiability* of the victim. If Patient A is statistical, the Prioritarian view collapses into the Aggregating view. You need the "identifiable victim effect" to make the Prioritarian verdict intelligible to the committee.
      *   **Fix:** Keep "Patient A" but strip their biography. No name, no story, just "The Identifiable Patient." This isolates the *moral* weight of identifiability from the *emotional* weight of a specific story.

  ---

  ### 3. Misconceptions

  **1. "Moral uncertainty is just empirical uncertainty."**
  *   **When it surfaces:** Minute 5 (immediately).
  *   **Action:** **Head off immediately.**
  *   **Why:** If they believe this, the rest of the hour is wasted. They will ask for more data. You must state: "More data will not solve this. We know the outcomes. We disagree on the value."

  **2. "The middle option is the neutral or fair response."**
  *   **When it surfaces:** Minute 20 (during Incommensurability).
  *   **Action:** **Let it surface, then dismantle.**
  *   **Why:** It is a natural heuristic. Let them propose "Fund half the therapy and half the discharge." Then show them why this fails (see Section 6). If you ban it too early, they feel unheard.

  **3. "Average the frameworks like expert probability estimates."**
  *   **When it surfaces:** Minute 30 (during Collective Problem).
  *   **Action:** **Head off immediately.**
  *   **Why:** This leads to false precision ("I'm 60% Utilitarian"). It treats moral truth as a hidden fact to be estimated rather than a value to be argued. It poisons the deliberation by turning it into a math problem.

  **4. "If frameworks cannot be ranked, any decision is arbitrary; just vote."**
  *   **When it surfaces:** Minute 40 (end of session).
  *   **Action:** **Let it surface, then refine.**
  *   **Why:** Voting *is* the mechanism, but calling it "arbitrary" undermines legitimacy. Reframe: "It is not arbitrary; it is *political*. We are owning the responsibility of the choice, not hiding behind a calculation."

  ---

  ### 4. The Hardest Thing: Incommensurability

  **Where in the Arc:** Minute 15–25 (After frameworks are defined, before resolution).
  **Prerequisites:** They must accept that the frameworks yield different verdicts on the *same facts*.
  **Presentation:**
  *   **The Whiteboard:** Draw three thermometers. Label one "Health," one "Duty," one "Fairness."
  *   **The Script:** "If Framework 1 says this choice is +10 on Health, and Framework 2 says it is -5 on Duty, I cannot add these numbers. There is no 'moral currency' that converts Duty into Health. If we pretend there is, we are lying about the math."
  *   **Avoiding "Do Whatever":** Immediately follow with: "This does not mean we choose randomly. It means we cannot *calculate* the choice. We must *argue* the choice. We look for a decision that is *permissible* under all frameworks, even if it is not *optimal* for any of them." This shifts the goal from "Maximizing Good" to "Avoiding Wrong."

  ---

  ### 5. The Refusal

  **What to Refuse:** **How to assign weights/credences to the frameworks.**
  *   **Script:** "I am not going to explain how to calculate the probability that Utilitarianism is true. There is no formula for that. If you try to assign a percentage to a moral theory, you are creating false precision."
  *   **Why:** This is the biggest trap for non-philosophers. They will try to say, "I'm 70% sure we should maximize QALYs." This turns moral deliberation into a betting market. It distracts from the substantive argument about *why* one framework fits the hospital's mission better.
  *   **Alternative:** If you refuse "Which framework is true," it sounds like you are hiding the answer. If you refuse "How to weigh them," you are protecting them from bad math.

  ---

  ### 6. The Check (Last 5 Minutes)

  **The Case:** "The Ambiguous Consent."
  *   **Scenario:** A family demands you withhold a cancer diagnosis from a competent patient to "protect their hope."
  *   **Framework 1 (Autonomy):** Must tell the patient. (Verdict: Tell).
  *   **Framework 2 (Beneficence/Non-Maleficence):** Withholding prevents severe psychological harm in this specific cultural context. (Verdict: Withhold).
  *   **The Compromise:** Tell the patient "vaguely" or "partially" (e.g., "It's serious, but don't worry").
  *   **The Test:** Ask the room to rank the Compromise.
  *   **Correct Understanding:**
      *   Framework 1 hates it: It violates autonomy (patient cannot make informed decisions on vague info).
      *   Framework 2 hates it: It causes the confusion/harm without providing the protection of total silence.
      *   **Result:** The Compromise is ranked last by *both*.
  *   **Diagnostic:** If a participant suggests "Let's split the difference and give partial info," they have failed to grasp incommensurability. They are treating moral duties like quantities to be averaged. If they say, "We have to pick one; the middle ground violates both principles," they have understood the session.

  ---

  ### 7. The Complication: Individual vs. Collective

  **Strategy:** **Run both from the outset.**
  *   **Implementation:**
      *   **Phase 1 (Individual):** "Imagine *you* are the sole decision maker. How do *you* weigh these?" (Builds the moral reasoning skills).
      *   **Phase 2 (Collective):** "Now, look around the table. Five of you are Aggregators, three are Prioritarians. The committee cannot have a 'conscience.' It has a *vote*."
  *   **Why:** If you only do Individual, they leave thinking this is about personal enlightenment. If you only do Collective, it feels like political maneuvering.
  *   **What is Lost:**
      *   If you start with Collective, you lose the empathy required to understand *why* the colleague holds the opposing view.
      *   If you end without translating to Collective, you fail your practical duty as a committee member.
      *   **Translation:** "Because we cannot agree on the *Right* framework, our recommendation must focus on *Process*. We must show we considered both, and that the chosen path is *defensible* even if not *optimal* for everyone."

  ### Handout Plan (One Page)

  **Header:** Moral Uncertainty in Committee Decisions
  **Left Column:** **The Facts (Agreed)**
  *   Therapy: 1 Patient, +5 Years Life.
  *   Discharge: 10,000 Patients, +1 Week Life each.
  *   Cost: Identical.
  **Middle Column:** **The Frameworks (Disagreed)**
  *   **Maximize Total:** Fund Discharge.
  *   **Priority to Worst Off:** Fund Therapy.
  *   **Rules/Constraints:** Fund Neither (or Discharge).
  **Right Column:** **The Trap vs. The Task**
  *   **Trap:** Averaging the scores. (Health + Duty = ?)
  *   **Trap:** Splitting the difference. (Half therapy, half discharge).
  *   **Task:** Justify the choice under *multiple* lenses.
  *   **Task:** Accept responsibility for the trade-off.
  **Footer:** *Uncertainty about values is not solved by more data.*
