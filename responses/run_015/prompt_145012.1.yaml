      *   Check (new case, compromise last)? (Check).
      *   Complication (Individual vs. Collective)? (Check).

  5.  **Drafting the Response:** (Iterative refinement for clarity and tone).
      *   *Tone:* Direct, authoritative, structured.
      *   *Formatting:* Use bolding for key instructions.
      *   *Handout description:* Keep it simple.

      *(Self-Correction on the "Check" case)*: The prompt asks for a case where the compromise is ranked last by *every* framework.
      *   Case: A policy on disclosing a medical error.
      *   Framework 1 (Truth-telling): Disclose fully immediately.
