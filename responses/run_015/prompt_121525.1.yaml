answer: |-
  You have put your finger on one of the most persistent and delicate problems in the philosophy of art and cognitive psychology. Your intuition is sharp: there *is* a specific configuration where emotion requires a dual state of belief (feeling it is real) and non-belief (knowing it is not).

  Here is the breakdown of the terminology, the distinctions you asked for, and my confidence assessment.

  ### 1. The Established Term: **Psychical Distance**
  The most accurate established term for this configuration is **Psychical Distance** (often colloquially shortened to **Aesthetic Distance**), coined by psychologist Edward Bullough in 1912.

  I anticipate your objection: you noted that "aesthetic distance sounds like detached observation." This is a very common misunderstanding of the term. Bullough did not define distance as *detachment* or *coldness*; he defined it as the **separation of the object from practical reality.**

  *   **Under-Distance:** If the play feels *too* real (e.g., you think the actor is actually being harmed), the emotion shifts from sadness to panic or moral outrage. You might rush the stage. The art collapses into reality.
  *   **Over-Distance:** If the play feels *too* fake (wooden acting), you remain detached and bored. The art fails to engage.
  *   **The "Distance" Sweet Spot:** This is exactly what you described. It is the state where the practical consequences are removed (you know you don't need to call 911), which *permits* the emotion to be fully felt without triggering a survival response.

  So, the term exists, but its common usage has drifted toward "detachment," obscuring its original meaning of "insulation from practical consequence."

  ### 2. A More Descriptive Name: **Ontological Safety**
  Because "Psychical Distance" is often misunderstood (even by scholars), and because you asked for a name if the established one didn't fit, I propose labeling this specific configuration **Ontological Safety**.

  This name draws boundaries around the exact mechanism you identified:
  *   **Ontological:** It concerns the *nature of being* of the object (it is a fiction, not a fact).
  *   **Safety:** It is not about "safety" in the sense of comfort, but in the sense of *containment*. The knowledge that "this is not real" acts as a container that allows the emotional content to be volatile without being dangerous.

  **The Boundaries of Ontological Safety:**
  *   **Lower Boundary:** If the artifice is exposed (the guy yelling "it's fake!"), the ontological status shifts from "meaningful fiction" to "lie," and the safety turns into irritation.
  *   **Upper Boundary:** If the realism is too high (e.g., snuff films or hyper-realistic VR without a "game" frame), the safety breaks, and the emotion becomes trauma or panic.

  ### 3. Differentiating from Related Concepts

  Here is how **Ontological Safety / Psychical Distance** differs from the concepts you mentioned:

  **Vs. Suspension of Disbelief**
  *   **Suspension of Disbelief** is *cognitive* and *internal* to the story. It means accepting that "wizards exist" within the narrative logic.
  *   **Ontological Safety** is *metacognitive* and *external*. It is the awareness that "there are no wizards anywhere, including on this stage." You can suspend disbelief about the plot while maintaining ontological safety about the medium. If suspension of disbelief fails, you think the plot is stupid. If ontological safety fails, you think the situation is a real-world emergency.

  **Vs. The Paradox of Tragedy**
  *   **The Paradox of Tragedy** (Hume) asks the *teleological* question: "Why do we *enjoy* painful emotions in art?"
  *   **Ontological Safety** describes the *phenomenological* condition: "What must be true about my mental state for me to feel this sadness *at all*?" It is the mechanism that makes the paradox possible, not the paradox itself.

  **Vs. Narrative Transportation**
  *   **Narrative Transportation** (Green & Brock) implies a loss of self-awareness. You are "lost in the book." You forget the room around you.
  *   **Ontological Safety** requires a *retention* of self-awareness. You must know you are in a theater. If transportation is total, the background knowledge of fiction might vanish, which risks the "under-distance" panic. Your description specifically notes the need for "quiet background knowledge," which distinguishes it from pure transportation.

  **Vs. Emotional Safety / Practice Theories**
  *   **Practice Theories** argue that art is a *simulator* for evolution (we cry to practice grieving). This is an explanation of *function*.
  *   **Ontological Safety** is an explanation of *permission*. It doesn't matter if we are practicing; what matters is that the "fiction" tag acts as a license to release tears that social norms might otherwise suppress in a real funeral. In real life, you might hold back tears to be strong; in art, the "fake" tag tells your brain, "It is safe to lose control now."

  ### 4. Confidence and Uncertainty

  **Confidence Rating: 85%**
  I am highly confident that **Psychical Distance** is the historical term you are looking for, and that **Ontological Safety** accurately describes the mechanism you are sensing. The distinctions between suspension of disbelief, transportation, and this state are well-supported in contemporary cognitive narratology (e.g., work by Keith Oatley or Richard Gerrig).

  **The Least Certain Part: The Boundary with Narrative Transportation**
  You guessed correctly: this is the blurriest line.
  My uncertainty lies in whether **Ontological Safety** and **Narrative Transportation** are mutually exclusive states or simultaneous layers.
  *   *View A:* They are opposites. You are either "distanced" (aware of artifice) or "transported" (unaware of surroundings).
  *   *View B:* They are concurrent. You can be fully transported emotionally while a tiny, dormant metacognitive process monitors the "fiction tag."

  Recent neuroscience suggests **View B** is more likely (we process fiction on multiple tracks simultaneously), but the terminology hasn't caught up to fully explain how a person can be "lost" in a story while simultaneously "monitoring" its fictionality. If that monitoring becomes too loud, transportation breaks. If it becomes too quiet, ontological safety risks collapsing. Describing the exact threshold where "monitoring" becomes "detachment" is the hardest part of this taxonomy.

  ### Summary
  *   **Established Term:** **Psychical Distance** (specifically Bullough's definition, not the colloquial one).
  *   **Proposed Name:** **Ontological Safety**.
  *   **Key Distinction:** Unlike *Suspension of Disbelief* (accepting the story's logic), this is about accepting the *medium's unreality* as a license to feel. Unlike *Transportation*, this requires retaining a background awareness of self.
