answer: |-
  **Mark: 14/20**

  **Margin Comments:**

  *   **[On (a) "consequences do no independent work"]:** Careful here. Even if intention fixes the karmic fruit, the *theory* still evaluates the act based on the *value* of that fruit. The criterion of rightness remains consequentialist (maximize fruit), even if the production function is intention-dependent. You are conflating the *criterion of rightness* with the *evidence* for it.
  *   **[On (a) "tradition sides with the motive anyway"]:** Strong textual point. If outward welfare can be overridden by karmic intention, that does push the view toward motive ethics. But a consequentialist could reply: "We value the intention *because* of its karmic consequences," not intrinsically. You need to rule out this instrumental valuation to prove the "collapse."
  *   **[On (b) "theory is self-defeating"]:** This is a crucial distinction. A theory is *self-effacing* if it is true but shouldn't be used as a decision procedure. It is *self-defeating* if following it produces bad results. The prompt defines the former; you argue the latter. Indirect consequentialism accepts self-effacement without collapsing (e.g., Railton).
  *   **[On (b) "cannot be a theory of right action"]:** Too strong. It can be a theory of *criteria* without being a *decision procedure*. Many utilitarians accept this. You need to argue why the guidance problem is fatal, not just assert it.
  *   **[On No-Self paragraph]:** Interesting metaphysical point, but this addresses *agent-neutrality*, not *self-effacement*. The question asks about the problem of aiming at the good (effacement), not about who receives the good (neutrality). This feels like a separate argument tacked on. How does no-self solve the guidance problem raised in the first half of (b)?

  **Examiner's Summary:**
  Clear, confident writing and good knowledge of the tradition (especially on intention/karma). However, the philosophical analysis is slightly blunt. In (a), you move too quickly from "intention determines karma" to "consequentialism collapses," missing the instrumentalist defense. In (b), you conflate self-effacement with self-defeat and miss the standard indirect-consequentialist response. The No-Self paragraph is insightful but arguably off-topic for the specific question asked. A solid Upper Second.
