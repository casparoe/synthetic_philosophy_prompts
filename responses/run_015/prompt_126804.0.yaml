answer: |-
  ### Diagnosis

  This is a clash of bedrock intuitions about political legitimacy, disguised as an empirical dispute. The epistocrat prioritizes outcome quality (instrumental value), while the democrat prioritizes equal status (intrinsic value). Your variants strip away contingent objections (stigma, bias), forcing the debate onto this normative core. Consequently, no empirical data alone can resolve it, because the sides disagree on what counts as a valid justification for coercion. The stalemate persists not because facts are hidden, but because the parties value different goods inherent to the political system in practice. It is a conceptual clash regarding the very purpose of voting rights.

  ### What each side is actually committed to

  The epistocrat is really committed to a consequentialist view of political authority: legitimacy derives primarily from the quality of decisions produced. For them, voting is a public function akin to jury duty or licensing, where competence safeguards collective welfare. They must accept that unequal influence is justified if it improves outcomes, viewing equal voting rights as an inefficient fetish when knowledge is asymmetrically distributed. Their deeper commitment is to truth-tracking over procedure. They assume political knowledge is additive and neutral, not merely tribal signaling, believing better information leads to objectively superior governance regardless of who holds power.

  The democrat, conversely, is committed to a relational view of equality. For them, legitimacy derives from the standing citizens hold relative to one another. Voting is not merely a tool for outcomes but a symbol of equal status and agency. To weight votes by competence is to declare some citizens morally superior rulers over others, violating the requirement that coercion be justifiable to each person equally. They prioritize the *process* of mutual justification over the *product* of policy. Thus, even a benevolent epistocracy fails if it treats citizens as subjects rather than co-authors of the law. Furthermore, democrats often suspect that "competence" measures inevitably encode dominant ideologies, making the epistocrat's empirical assumption about neutral knowledge suspect. The disagreement is therefore deeply axiological: one side maximizes welfare, the other maximizes equal standing, rooted in conflicting views on whether political knowledge is objective or inherently contested. Ultimately, the democrat truly argues that being subject to laws one had no hand in shaping is a form of domination, regardless of the laws' quality.

  ### What my two variants do and don't settle

  Your variants successfully isolate the stigma and bias objections. The "blind" design removes the expressive harm of exclusion; no one knows they failed, so dignity is ostensibly preserved. The "stratified" design removes the demographic skew objection; power remains descriptively representative. If opponents still reject these, it confirms their objection is indeed principled: they oppose competence-weighting itself, not its side effects.

  However, these variants don't settle the empirical wrinkle you identified. They assume the test measures something valuable. If political knowledge is merely rationalized tribalism, both variants still empower tribalists, just selectively. Moreover, the "blind" variant fails to address the democratic claim about authorship. Even if I don't know I'm disenfranchised, I am still coerced by rules I had equal say in preventing. The proceduralist cares about the actual distribution of power, not just the perception of it. Therefore, while your designs clarify that the dispute is normative, they cannot bridge the gap between instrumental and intrinsic values. They prove the democrat's resistance is foundational. Crucially, they leave untouched the question of whether competent voters actually aggregate judgment better than random ones, or if competence merely correlates with status-quo bias. The variants refine the philosophical battlefield but do not provide the ammunition to win it.

  ### What would count as progress, or why nothing will

  Ultimately, progress requires shifting from abstract legitimacy to institutional hybridity. Since the core is axiological, neither side will concede. Instead, progress looks like designing systems that satisfy both intuitions partially: universal suffrage paired with robust deliberative bodies or sortition chambers that introduce competence without formal disenfranchisement. We won't resolve the theoretical stalemate because it rests on incompatible first principles. However, we can dissolve the practical impasse by building institutions that signal equal status while filtering for expertise in specific policy domains. Expect no conversion on the fundamental question of legitimacy, but potential convergence on mixed systems that mitigate the risks both sides fear most. Pure forms of either system still fail to capture the actual complexity of modern governance needs.
