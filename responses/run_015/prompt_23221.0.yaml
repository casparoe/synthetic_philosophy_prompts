      *   **Topic:** Counterpart Theory (David Lewis) vs. Transworld Identity (Kripke/Plantinga/etc.).
      *   **Specific Constraints:**
          1.  Don't just say "one denies identity, one affirms it."
          2.  Address Point 1: Ontology of possible worlds and its impact on identity.
