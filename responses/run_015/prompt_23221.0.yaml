      *   *Section 4 (Convergence):* Don't let them think they are enemies. They agree on the logic (S5 usually). They agree on the utility of worlds. They agree on the truth values of ordinary modal claims.
      *   *Conclusion:* Summarize the trade-off. TWI saves intuition about "me" at the cost of abstract ontology. CT saves concrete ontology at the cost of intuition about "me."

