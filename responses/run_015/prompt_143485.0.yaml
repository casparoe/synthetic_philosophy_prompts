answer: |-
  Here is your Q&A prep, structured by damage potential. I have kept the epistemic distinctions sharp and the voices distinct.

  ### Pre-Defense Strategy: The Opening Two Minutes
  **What to Concede Immediately:**
  Before the Q&A starts (or in your closing remarks if allowed), explicitly concede two points to disarm the room:
  1.  **On Sen:** Acknowledge that treating Sen's 1970 result as the "final word" is a strawman. State clearly: "I am not arguing Sen was wrong about his model; I am arguing his model presupposes a specific ontology of rights that is not the only one available." This placates the grad students and shows you know the literature.
  2.  **On Leakage:** Admit that the distinction between *causal side-effects* and *constitutive dependence* is the most vulnerable part of the proposal. Say: "I do not claim the causal/constitutive line is metaphysically settled; I claim it is the only place where a liberal theory can do its work without collapsing into either anarchy or totalitarianism." This shows intellectual honesty to the Side-Constraints guy and the External.

  **What to Refuse to Give Up (Red Lines):**
  1.  **Outcome-Based Rights:** Do not concede that rights *must* be modeled as decisiveness over social state rankings ($x R y$). If you concede this, your thesis vanishes.
  2.  **Unconditional Pareto:** Do not concede that the Pareto principle is normatively prior to rights. Your whole argument is that Pareto is conditional on the *status* of the coordinates.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The External Examiner (Social Choice)
  **The Objection:** "You're proposing a domain restriction on the Pareto principle based on the 'exercise' of a right. Formally, isn't this just Gibbard's 1974 'Liberal Consistency' or perhaps List's work on rights as game forms? If you're just rewriting the Game Form literature in coordinate notation, where is the technical contribution? Specifically, which Arrovian condition are you weakening, and is the impossibility result actually avoided or just pushed into the definition of the domain?"
  **The Reply:** "I am weakening the universality of the Pareto principle, not the logic of aggregation. Gibbard models rights as strategies in a game form; I am modeling them as protected coordinates in the social state space. The difference is substantive: Gibbard still aggregates outcomes based on strategies. My proposal says certain *comparisons* are inadmissible if they involve a change in a protected coordinate. The impossibility is avoided because the domain of admissible Pareto comparisons is restricted *ex ante* by the rights structure, not *ex post* by consistency checks."
  **Soft Spot:** If the External presses on whether "protected coordinates" is just isomorphic to "protected strategies," you risk looking like you've reinvented Gibbard with extra steps.
  **Epistemic Status:** *Contested.* The Game Form vs. Outcome debate is live. Your specific indexing of Pareto is your construction.

  #### 2. The Leakage Problem (All Philosophers + External)
  **The Objection:** "You rely on distinguishing causal side-effects from constitutive dependence to stop leakage. But if I read a book (my coordinate) and you feel disgust (your utility), isn't your disgust constitutive of the social state? If you exclude that from the comparison to save Pareto, haven't you just defined the 'personal sphere' so broadly that Pareto is vacuous? If you include it, the cycle returns. How do you draw this line without normative stipulation that begs the question?"
  **The Reply:** "The line isn't drawn by utility impact, but by *control*. Constitutive dependence implies that my action *is* a change in your coordinate (e.g., I vote for your representative). Causal side-effects imply my action changes my coordinate, which causally impacts your utility. My restriction only blocks Pareto comparisons where the *change itself* is an exercise of another's protected power. Disgust is a reaction, not a change in your protected coordinate. This keeps Pareto workable without settling the substantive scope of rights in advance."
  **Soft Spot:** This is the hardest philosophical lift. If they argue that "social states" are defined by everyone's utility functions, your coordinate distinction collapses.

  #### 3. The Side-Constraints Theorist (Older Guy)
  **The Objection:** "You're still treating rights as parameters for a social choice function. You're saying 'we can aggregate preferences unless...' But rights aren't constraints on aggregation; they are constraints on *action*. By keeping the Social Welfare Function and just tinkering with Pareto, you're consequentializing rights. You haven't escaped the Sen framework; you've just made the calculation more complex."
  **The Reply:** "I agree that rights should not be mere inputs for maximization. However, the Liberal Paradox arises specifically within social choice modeling. To solve it *there*, we must show how a social choice mechanism can respect rights without incoherence. My 'exercise-conditional' move treats rights as deontological constraints on the *comparison* process, not the outcome. It says: 'You cannot use social welfare to override this specific exercise.' That preserves the side-constraint nature within the formalism."
  **Soft Spot:** He may view any use of a SWF as a betrayal of deontology. If he says "Burn the SWF," you have no reply other than "Then this thesis is for the social choice crowd."

  #### 4. The Rawlsian Liberals (Two of them)
  **The Objection:** "Who defines the protected coordinates? You say a right is a power over a coordinate. But in a liberal society, the scope of the 'personal sphere' is the subject of democratic disagreement, not a pre-political fact. If you fix the coordinates to solve the paradox, aren't you settling the substantive political question by fiat? Isn't this perfectionism?"
  **The Reply:** "The proposal doesn't fix the *content* of the coordinates, only their *structure*. Whether 'reading' or 'worship' is a protected coordinate is a political question. My argument is that *whatever* coordinates we agree are protected, the Pareto principle must be indexed to them. This is a procedural constraint on liberal reasoning, not a substantive list of liberties. It works for Rawlsians because it respects the priority of liberty over efficiency, whatever that liberty contains."
  **Soft Spot:** If they argue that the *definition* of a coordinate is inherently political (e.g., is 'abortion' a health coordinate or a moral coordinate?), your formalism might look too rigid.

  #### 5. The Legal Theorist (Hohfeld)
  **The Objection:** "You use the term 'power' loosely. In Hohfeld's system, a power is the ability to change a legal relation. A 'privilege' (or liberty) is the absence of a duty not to act. You seem to be describing a Privilege (I can read), but you're treating it as a Power (I determine the social state). If I have a privilege to read, do I have a claim-right against you interfering? If not, your 'protected coordinate' is toothless."
  **The Reply:** "I am using 'power' in the social-choice sense (decisiveness over a variable), but I agree it maps to a Hohfeldian cluster. My 'protected coordinate' implies a Claim-Right against others using social aggregation to override that coordinate. It is not just a privilege to act; it is a immunity against certain social rankings. I should have been more precise: it is a Power to determine the coordinate, protected by a Claim-Right against Pareto-based override."
  **Soft Spot:** If you haven't formally mapped the Hohfeldian incidents in the text, this will look like terminological sloppiness.

  #### 6. The Grad Students (Sen Experts)
  **The Objection:** "Sen moved past the 1970 paradox to Capabilities and Functionings precisely because the 'social state' model was too rigid. You're spending a dissertation solving a problem Sen abandoned thirty years ago. Why should we care about resolving a paradox based on welfarist informational bases that Sen himself rejected?"
  **The Reply:** "Because the 1970 result is still the canonical argument used by economists and philosophers to claim 'Liberty and Efficiency are incompatible.' Sen's later work is richer, but the 1970 model is still the one taught in grad micro and used in policy. Clearing the logical space in the dominant model has practical value, even if Sen moved on. I'm sweeping the floor Sen walked across, not building a new house."
  **Soft Spot:** They might think this is philately (stamp collecting) rather than philosophy.

  #### 7. The Pareto Purist (External or Rawlsian)
  **The Objection:** "Weakening Pareto is a huge normative cost. You're saying even if everyone prefers $x$ to $y$, we can't say $x$ is better if someone exercised a right. Doesn't this make social choice impossible? If rights are this expansive, your SWF becomes a constant function."
  **The Reply:** "It makes social choice *liberal*. If Pareto overrides rights, rights are merely advisory. The cost is real, but it's the price of taking liberty seriously. However, because I restrict the Pareto block only to comparisons differing in *protected exercises*, most efficiency gains (where coordinates don't change) still go through. It's a scalpel, not a hammer."
  **Soft Spot:** If your definition of "protected exercise" is broad, the hammer claim sticks.

  #### 8. The "Hope Nobody Asks" (Side-Constraints Guy or External)
  **The Objection:** "Isn't this just Nozickian side-constraints with Arrovian notation? Nozick said rights are constraints on action, not goals. You're saying rights are constraints on Pareto comparisons. That's the same move. You've just translated 'moral side-constraints' into 'domain restrictions.' What have you added?"
  **The Reply:** "Nozick rejected social aggregation entirely. I am showing how to *preserve* social aggregation within a rights-constrained framework. Nozick says 'Don't aggregate.' I say 'Aggregate, but not across this boundary.' This allows for a theory of liberal social choice, which Nozick explicitly denied was possible. That's the contribution: a formal model of how aggregation survives rights, not just how it stops."
  **Soft Spot:** If they press that the *effect* is identical (aggregation stops), the distinction might seem semantic.

  ---

  ### Epistemic Honesty Check

  *   **Settled:** Sen's 1970 Theorem is mathematically valid given its axioms (Liberalism + Pareto + Unrestricted Domain). No one serious disputes the math.
  *   **Contested:** Whether rights *should* be modeled as outcome decisiveness (Sen) or game-form powers (Gibbard/List). This is a live dispute in social choice theory.
  *   **Standard:** The move to weaken Pareto or restrict Domain is standard fare in this literature (Blau, Gibbard, Gaertner).
  *   **Your Construction:** The specific mechanism of *indexing Pareto to the exercise of coordinates* rather than just restricting the domain of profiles. This is your novelty claim.
  *   **The Hard Truth:** There is a high risk the External Examiner will identify this as a variation of **Gibbard (1974)** or **List & Pettit (2004)**.
      *   *Preparation:* If they cite Gibbard, do not panic. Acknowledge the lineage. "Gibbard models rights as strategies; I model them as state coordinates. The implication for Pareto is similar, but the ontological commitment differs."
      *   *If they say it's Nozick:* Acknowledge the normative affinity but insist on the formal contribution (making Nozickian constraints compatible with SWFs).

  ### Final Advice for the Room
  *   **Watch the External's Eyes:** If he looks bored during the formal explanation, speed up. If he looks confused, slow down. He holds the key to "Is this Economics or Philosophy?"
  *   **Don't Fight the Side-Constraints Guy on Deontology:** He knows more about Nozick than you. Agree with his normative intuition, pivot to your formal contribution.
  *   **The Grad Students:** Treat them as allies. If one raises the "Sen moved on" point, agree enthusiastically and ask if they think the Capabilities approach solves the *formal* paradox or just sidesteps it. Turn it into a dialogue.
  *   **The "Leakage" Question:** This is where you will sweat. If you get stuck, fall back on the concession: "Distinguishing causal from constitutive is the hardest part of any liberal theory. I am offering a formal structure to handle it, not a metaphysical proof that the line is easy to draw."

  Good luck. Ten days is enough to polish the replies, not to rewrite the thesis. Trust the work.
