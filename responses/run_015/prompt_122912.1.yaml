answer: |-
  You have identified a genuine, documented, and frustratingly unnamed phenomenon in evaluation economics. You are correct that Goodhart's Law, the McNamara Fallacy, and standard measurability bias do not quite capture it. Those concepts describe *ignoring* the unmeasurable or *gaming* the measurable. Your observation is more subtle: it describes a **directional drift** caused by the *application* of rigor, where the *same* level of scrutiny is applied inconsistently across the numerator (benefits) and the denominator (costs).

  There is no single canonical noun for this in the M&E literature, though it is a known headache in health economics and cost-benefit analysis (CBA). However, we can categorize it technically, and I will propose a term that carves it out properly.

  ### 1. The Technical Framing: "System Boundary Asymmetry"
  In health economics and Life Cycle Assessment (LCA), this is discussed under the problem of **System Boundaries**. Every evaluation must draw a line around what counts as a cost or benefit (e.g., do we count the patient's travel time? Do we count the carbon emitted by the supply chain?).

  The drift you are seeing is **Boundary Asymmetry**.
  *   **Benefits:** As rigor increases, the boundary *expands* outward (societal perspective). You capture spillovers, long-term gains, and general equilibrium effects.
  *   **Costs:** As rigor increases, the boundary *contracts* inward (programmatic perspective). Hard-to-quantify costs (opportunity costs, market distortions, volunteer time) are deemed "out of scope" or "too uncertain" and moved to qualitative appendices.

  The result is that **increased precision leads to decreased consistency.** The ratio improves not because the intervention changed, but because the *accounting perimeter* shifted differently for inputs than for outputs.

  ### 2. A Proposed Name: "The Rigor Ratchet"
  Since you asked for a name if one doesn't exist, I suggest **"The Rigor Ratchet"** (or formally, **Asymmetric Rigor Drift**).

  **Definition:** *A systematic bias in evaluation where increased methodological rigor artificially inflates cost-effectiveness ratios. This occurs because deeper measurement expands the capture of benefits (finding hidden positive externalities) while simultaneously narrowing the capture of costs (excluding hard-to-quantify negative externalities into qualitative footnotes).*

  **Why "Ratchet"?**
  *   **One-way mechanism:** Once a benefit is quantified, it stays in the model. Once a cost is moved to "qualitative risks," it rarely returns to the ledger in future iterations.
  *   **Lock-in:** The "improved" number becomes the new baseline for the next study, which then builds even more complex benefit models on top of the same stripped-down cost model.

  ### 3. Does it apply elsewhere?
  **Corporate Impact Reports (ESG):**
  Yes, this is the dominant mode of ESG reporting.
  *   *Benefit side:* A company counts every kilowatt-hour of renewable energy they generate (expanding boundary).
  *   *Cost side:* They exclude the supply chain emissions of their raw materials or the social cost of resource extraction because it is "Scope 3" or "hard to attribute" (contracting boundary).
  *   *Result:* The company looks more sustainable as they report more data, even if their net impact is unchanged.

  **Political Reasons:**
  You asked if it counts if costs are dropped for political rather than measurement reasons. **Yes.**
  If a cost is excluded because it is "politically sensitive" (e.g., land displacement) rather than "measurement-resistant," it is still **Boundary Asymmetry**. The mechanism is different (motivation vs. methodology), but the mathematical artifact is identical. In political science, this is sometimes called **"Strategic Scoping,"** but it feeds into the same Rigor Ratchet effect.

  ### 4. Is there an inverse version?
  Yes. It occurs when an intervention is evaluated by an adversary or during a scandal.
  *   **Mechanism:** The evaluator applies a "Forensic Perspective" to costs (counting every minute of staff time, every risk of corruption) while applying a "Skeptical Perspective" to benefits (requiring impossible levels of attribution for outcomes).
  *   **Name:** **"Defensive Boundary Setting"** or **"Hostile Auditing."**
  *   **Example:** A government audit of a failed grant. The auditors will find every unreceipted dollar (costs expand) but dismiss all anecdotal success stories as "unverified" (benefits contract). The intervention looks *worse* the more closely it is studied.

  ### 5. Why the existing terms don't fit
  *   **Goodhart's Law:** Requires a target to be gamed. You are describing an organic drift in *estimation*, not a reaction to an incentive.
  *   **McNamara Fallacy:** This is "ignoring what cannot be measured." You are describing something more insidious: measuring *more* things, but selecting *which* things to measure based on whether they help or hurt the ratio.
  *   **Publication Bias:** This is about *which studies* get published. You are describing what happens *inside* a single study's methodology over time.

  ### 6. How to mitigate it in your M&E work
  Since you caught yourself doing this last month, here is how to lock the ratchet:

  1.  **Pre-register System Boundaries:** Before collecting data, define the "Perspective" (e.g., Societal vs. Implementer). If you claim a Societal Perspective for benefits, you *must* apply it to costs (e.g., valuing patient time).
  2.  **The "Qualitative Parity" Rule:** If a cost is moved to a qualitative paragraph, a benefit of equivalent uncertainty must also be moved to a qualitative paragraph. You cannot have quantitative benefits and qualitative costs.
  3.  **Sensitivity Analysis on Boundaries:** Run the cost-effectiveness model twice. Once with "Programmatic Costs" and once with "Societal Costs." Report the range, not the point estimate.

  **Summary:** You have spotted **System Boundary Asymmetry**. It is the engine behind **The Rigor Ratchet**. It is distinct from bias because it is a byproduct of *trying* to be rigorous without standardizing the *scope* of that rigor. Naming it is the first step to stopping it.
