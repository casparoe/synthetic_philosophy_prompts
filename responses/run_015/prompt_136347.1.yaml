prompt: |-
  I am drafting a novel in which isolated rational agents face collective-choice structures that mirror the Platonia dilemma and what I will call the Echo Lottery—a variant in which the reward for being the sole defector is weighted by each agent's private credence that every other agent is an exact epistemic duplicate. Before committing to the narrative logic, I want a defended philosophical agenda, not a survey. Among the open conceptual problems in superrationality, which matter most, in what order should limited analytical attention be directed toward them, and why?

  Consider these five lines of inquiry: first, whether a stable definition of superrationality can be articulated that does not collapse back into either evidential or causal decision theory once symmetry conditions are fully specified; second, how graded epistemic asymmetry—differences only in confidence about being identical reasoners—can be modeled without destroying the very symmetry that makes Platonia-style reasoning attractive; third, what normative force, if any, superrational prescriptions retain when agents know the population includes both evidential and causal reasoners; fourth, whether the Luring Lottery structure exposes a deep instability in cooperative reasoning under partial information, or whether it is merely an artifact of framing; and fifth, which practical implications—whether for distributed governance, AI coordination protocols, or individual deliberation—actually depend on resolving the prior four, and which are philosophically overrated.

  Please prioritize these. Defend the ordering with explicit criteria: tractability for conceptual rather than formal work, which questions are upstream of others, and what kind of conceptual result would cause you to reorder them. Identify the two or three implications that would genuinely change how one should design collective decision mechanisms if superrationality is taken seriously, and distinguish them from implications that sound profound but do not survive careful analysis. Do not provide a bibliography, reading list, or citations; I need reasoning that stands on its own.
