      *   **Specific Demands to Stress-Test (D1-D5):**
          *   D1: All-cutoff validity.
          *   D2: Auditability under selective labels.
          *   D3: Stability under adaptation (gaming).
          *   D4: No reward for worse predictions (monotonicity/utility).
          *   D5: Contestability (individual recourse).
      *   **Specific Demands to Rule On:**
          *   No group membership usage (blindness).
          *   Same cutoff for all groups.
          *   Same score interpretation across groups (calibration/consistency).
      *   **Fairness Candidates mentioned (optional use):** Equal FPR/FNR, Calibration, Equal PPV, Counterfactual Fairness, Subgroup Closure.

  2.  **Deconstruct the Problem & Constraints:**
      *   **Selective Labels (D2):** This is the hardest technical constraint. If we only see outcomes for those above the cutoff, we cannot calculate False Negative Rates (FNR) or True Negative Rates directly for those below. We cannot verify calibration below the cutoff. We can only verify Positive Predictive Value (PPV) for those selected.
      *   **Variable Cutoff (D1):** The fairness metric must hold regardless of where the budget line is drawn. Many fairness metrics (like Equal Opportunity) depend on the threshold.
      *   **Base Rates:** R (16.7%), S (33.3%), T (10%). Significant differences.
      *   **Gaming (D3):** If the rule requires equal selection rates, applicants might game to reach the threshold. If the rule requires specific group outcomes, the model might manipulate scores to meet quotas rather than reflect need.
      *   **Individual Contestability (D5):** Can an individual know if they were treated unfairly? Usually, fairness is group-based. Individual fairness requires a metric of similarity which is hard to define contractually.
      *   **The "Rule On" Demands:**
          *   *Blindness:* Often leads to disparate impact given different base rates.
          *   *Same Cutoff:* Given different base rates and potentially different score distributions, same cutoff implies different selection rates and potentially different PPV/NPV.
          *   *Same Interpretation (Calibration):* P(Urgent | Score=x) should be same across groups. This is often compatible with different cutoffs but hard with selective labels.

  3.  **Drafting the Requirements (Table):**
      *   Need to integrate D1-D5 and the "Rule On" demands.
      *   *D1 (All-cutoff):* Hard to enforce if metric depends on outcomes below cutoff.
      *   *D2 (Selective Labels):* Crucial. Must rely on observed data (selected pool).
      *   *D3 (Stability):* Prevents gaming.
      *   *D4 (No Reward for Worse):* Prevents trivial solutions (select no one).
      *   *D5 (Contestability):* Individual level.
      *   *Rule On 1 (Blindness):* Camp prejudice? Given base rate differences, blindness might violate substantive equality.
      *   *Rule On 2 (Same Cutoff):* Camp prejudice? Might violate equal opportunity if score distributions differ.
      *   *Rule On 3 (Same Interpretation):* Genuine but negotiable? Calibration is good but hard to verify under selective labels.

      *Refining Status:*
      *   D2 is Non-negotiable because we literally *cannot* audit what we can't see.
      *   D4 is Non-negotiable because otherwise the system is useless.
      *   D1 is Genuine but Negotiable. Ideally yes, but might conflict with D2.
      *   D5 is Camp Prejudice (Individual fairness is philosophically nice but contractually unenforceable without a similarity metric).
      *   Blindness (No group usage): Camp Prejudice. If groups have different base rates, ignoring group ID prevents correcting for structural bias in the score generation.
      *   Same Cutoff: Camp Prejudice. Forces disparate impact given different base rates.
      *   Same Interpretation (Calibration): Genuine but Negotiable. Hard to verify with D2.

      *Conflicts:*
      *   D2 (Selective Labels) vs D1 (All-cutoff): You can't verify performance below the cutoff if you don't see labels below the cutoff.
      *   D5 (Individual Contestability) vs Group Statistics: Individual fairness requires a definition of "similar individuals" which is not available in the data.
      *   Base Rate Differences vs Same Cutoff/Blindness: If Base Rates differ, Same Cutoff + Blind Score -> Different PPV.

