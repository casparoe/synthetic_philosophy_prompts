  ### Commitment to Specification

  I recommend the panel adopt the package centred on **R2 (Auditability), R4 (Utility), and R8 (Uniform Interpretation/PPV)**. This means writing a contract that mandates **Equal Positive Predictive Value across groups at the operating cutoff**, while explicitly permitting the use of group membership data to calibrate the score or adjust thresholds.

  **Sacrifices and Consequences:**
  1.  **Sacrificing R1 (All-cutoff validity):** We accept that we cannot guarantee fairness if the budget changes drastically next quarter. We only guarantee fairness for the current budget line.
      *   *Consequence:* If the budget shrinks and the cutoff rises, we cannot prove the new cutoff is fair until after implementation. Groups with lower base rates (Group T) may feel vulnerable to sudden exclusion.
  2.  **Sacrificing R6 (Blindness) and R7 (Uniform Cutoff):** We explicitly allow the vendor to use group labels to ensure the score means the same thing for everyone. This likely means Group T (low base rate) will face a lower score cutoff than Group S (high base rate) to achieve the same PPV.
      *   *Consequence:* Group S applicants may perceive this as unfair preferential treatment for Group T, even though it ensures that a fast-tracked applicant from T is just as likely to be in genuine need as one from S. We trade procedural uniformity for substantive equality of opportunity.
  3.  **Sacrificing R5 (Individual Contestability):** We admit we cannot tell an individual rejected applicant that they were wrongly denied, because we never checked their need.
      *   *Consequence:* Applicants denied housing will have no recourse to claim error based on their specific need status. Complaints must be limited to procedural errors (e.g., data entry mistakes), not substantive fairness.

  **Least Certain Claim:**
  I am least certain of the claim that **dropping Individual Contestability (R5) is acceptable**. While technically necessary under selective labels, it removes a vital human safeguard against model error. My mind would be changed if the authority could allocate a small fraction of the budget (e.g., 1% of units) to randomly fast-track applicants below the cutoff solely to generate audit data. This would create the ground truth necessary to adjudicate individual complaints and verify R1, resolving the deepest conflict without compromising the budget significantly. Until such a mechanism is funded, however, individual contestability remains a contractual impossibility.
