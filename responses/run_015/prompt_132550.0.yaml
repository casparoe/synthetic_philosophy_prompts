answer: |-
  ### Table of Requirements

  | ID | Requirement | Failure case that motivates it | Status | Which other requirements it conflicts with | What it rules out |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **All-cutoff validity (D1)** | The budget changes quarterly. A model fair at a 0.8 cutoff may be discriminatory at 0.5. | Genuine but negotiable | R2, R8 | Models that only perform well at a specific threshold. |
  | **R2** | **Auditability under selective labels (D2)** | We only see urgent need outcomes for fast-tracked applicants. We cannot measure error rates for those rejected. | Non-negotiable | R1, R5 | Metrics requiring ground truth for rejected applicants (e.g., False Negative Rate). |
  | **R3** | **Stability under adaptation (D3)** | Applicants learn the scoring weights and inflate answers. A fair metric should not collapse when scores shift. | Genuine but negotiable | R4 | Metrics that rely on static score distributions without accounting for gaming. |
  | **R4** | **No reward for worse predictions (D4)** | A vendor could satisfy fairness by selecting no one (0% false positives) or randomising. | Non-negotiable | R3, R8 | Trivial solutions, constant scores, or metrics that penalise accuracy improvements. |
  | **R5** | **Contestability (D5)** | An applicant rejected at score 0.49 wants to know why 0.50 passed. | Camp prejudice | R2, R8 | Individual recourse claims based on counterfactuals we cannot observe. |
  | **R6** | **Blindness (No group usage)** | The model uses postcode as a proxy for group R, S, or T to evade fairness checks. | Camp prejudice | R2, R8 | Explicit use of group labels for calibration or audit stratification. |
  | **R7** | **Uniform Cutoff** | Group S (high need) is held to the same score threshold as Group T (low need), rejecting more urgent S cases. | Camp prejudice | R8, R4 | Group-specific thresholds adjusted for base rate differences. |
  | **R8** | **Uniform Interpretation (PPV)** | A score of 0.7 means 70% chance of need in Group S but only 40% in Group T. | Genuine but negotiable | R1, R7 | Models where the score means different things for different groups at the operating point. |

  ### Unsatisfiable Sets of Requirements

  **Set 1: {R1, R2}**
  **Argument:** You cannot verify validity at every cutoff (R1) when outcome labels are only observed for those above the current cutoff (R2). To audit a lower cutoff, you need outcome data for applicants who were previously rejected, which the system explicitly does not record.
  **Example:** In Quarter 1, the cutoff is 0.8. We observe outcomes for scores 0.8–1.0. In Quarter 2, the budget expands and the cutoff drops to 0.6. To verify R1 for the 0.6–0.8 band, we need urgent need labels for applicants who scored 0.7 in Quarter 1. These applicants were not fast-tracked, so their need status is unknown. R1 is mathematically unverifiable under R2.

  **Set 2: {R7, R8, Base Rate Difference}**
  **Argument:** If groups have different base rates of urgent need (S=33%, T=10%), applying the same cutoff (R7) will inherently produce different Positive Predictive Values (PPV) across groups, violating Uniform Interpretation (R8).
  **Example:** Assume scores perfectly reflect probability of need. Group S applicants score around 0.33; Group T around 0.10. If we set a Uniform Cutoff (R7) at 0.20, we select many S applicants (PPV ≈ 0.33) and few T applicants. If we select T applicants down to score 0.15 to find enough housing candidates, their PPV drops to 0.15. We cannot maintain both the same cutoff and the same PPV when the underlying prevalence of need differs by a factor of three.

  **Set 3: {R5, R2}**
  **Argument:** Individual contestability (R5) requires telling an applicant whether they were wrongly rejected. Under selective labels (R2), we never know if a rejected applicant was truly in urgent need.
  **Example:** An applicant in Group T scores 0.49 and is rejected (cutoff 0.50). They claim they were in urgent need. Since they were not fast-tracked, no assessment was done, and no outcome label exists. The panel cannot adjudicate the complaint because the ground truth is structurally missing.

  **Deepest Conflict:** **{R1, R2}**.
  This is the deepest conflict because it is epistemic rather than political. The conflict between Uniform Cutoff and Uniform Interpretation (Set 2) could be resolved by choosing one value over the other. The conflict between All-cutoff validity and Selective Labels cannot be resolved without changing the data collection process itself. You cannot audit what you do not measure. Prioritising R1 would require fast-tracking a random sample of rejected applicants solely for audit purposes, which costs budget housing units. Prioritising R2 admits we cannot know the fairness of counterfactual cutoffs.

