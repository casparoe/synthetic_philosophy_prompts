      *   Groups R, S, T.
      *   Base Rates: R=0.167, S=0.333, T=0.10.
      *   Score distributions need to overlap.
      *   *Conflict 1: D1 vs D2.* If we set a high cutoff, we see labels for high scores. If we lower cutoff next quarter, we need to know fairness for the middle scores. But we never observed labels for middle scores when cutoff was high.
      *   *Conflict 2: Same Cutoff vs Equal PPV.*
          *   Group S (High Base Rate): Score > 0.5 -> 80% Urgent.
