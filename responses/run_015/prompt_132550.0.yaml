  6.  **Commitment & Package:**
      *   Must choose a set.
      *   Prioritize D2 (Auditability) and D4 (Utility).
      *   Sacrifice D1 (All-cutoff) -> Accept quarterly audit based on current cutoff only.
      *   Sacrifice D5 (Individual Contestability) -> Replace with Group-level audit.
      *   Sacrifice Blindness -> Allow group membership for calibration/monitoring.
      *   Sacrifice Same Cutoff -> Allow group-specific cutoffs to equalise PPV or Selection Rates.
      *   *Recommendation:* Focus on **Equal Positive Predictive Value (PPV) across groups at the operating cutoff**. Why? It's observable (D2), prevents waste (D4), and ensures tax money helps equally urgent cases regardless of group.
      *   *Consequence:* Groups with lower base rates (T) might need lower cutoffs to match PPV of S, or S gets higher cutoff. Actually, to equalise PPV with different base rates, you usually need different cutoffs.
      *   *Wait, check logic:* If S has higher base rate, at same score threshold, S likely has higher PPV. To equalise PPV, T needs a lower threshold (accepting riskier cases) or S needs higher threshold (accepting only surest cases).
      *   *Enforcement Test:* Calculate PPV per group for fast-tracked applicants. Check variance.

  7.  **Least Certain Claim:**
      *   Probably the assertion that D5 is purely prejudice. Individual recourse is morally strong but technically hard. Or the claim about PPV being the best metric.
      *   Let's pick the claim about "Blindness is Camp Prejudice". It's controversial. I need to justify why allowing group data is better (to correct for bias).

  8.  **Refining the "Rule On" Demands:**
      *   *No group membership:* Prejudice. (Needed for audit).
      *   *Same cutoff:* Prejudice. (Leads to unequal PPV).
      *   *Same interpretation:* Genuine but Negotiable. (Calibration is good but hard under D2).

