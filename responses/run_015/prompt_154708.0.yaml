      *   *Tension:* If the Matrix is a Lewisian possible world, the Machines aren't lying; they are just inhabitants of a different concrete universe. The "war" becomes an inter-world conflict, not a liberation.
      *   *The "Desert":* Morpheus calls it a desert because it's barren. A Lewisian would say it's just *different*. The film insists on objective privilege of the "Real." Lewis denies objective privilege (indexical "actual").

