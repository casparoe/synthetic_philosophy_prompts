  # ETHICS & PUBLIC LIFE: THE DIRTY HANDS DECISION TREE

  **Instructions:** Start at the top. Read the case-verdict. If you **AGREE**, follow the arrow to the **Leaf (Position)**. If you **DISAGREE**, move down to the next **Question**.

  ### **Q1: THE MINISTER'S INACTION**
  *"When a Minister allows preventable deaths through inaction, the moral failure is identical to a private citizen watching a stranger drown."*
  *   **AGREE** ➔ **LEAF 1: NO DISTINCT PROBLEM (Ordinary Moral Conflict)**
      *   **Awkward Commitment:** Ignores the unique power and scale of harm inherent to public office.
      *   **Public Treatment:** Treat the official exactly as you would a private citizen (praise or punish based on ordinary standards).
  *   **DISAGREE** ➔ *(Public role creates special moral conditions)* ➔ **Go to Q2**

  ### **Q2: THE WORSE SUCCESSOR**
  *"Even if refusing a dirty deed ensures a worse successor takes the job, the official is still required to refuse and step aside."*
  *   **AGREE** ➔ **LEAF 2: REFUSAL REQUIRED WHATEVER THE COST**
      *   **Awkward Commitment:** Requires the agent to prioritize their own integrity over the prevention of greater catastrophe.
      *   **Public Treatment:** Praise the official's integrity, but lament the disastrous outcome they allowed to happen.
  *   **DISAGREE** ➔ *(Consequences matter; lesser evil is permissible)* ➔ **Go to Q3**

  ### **Q3: THE LEGISLATOR'S COMPROMISE**
  *"The Legislator voting for a flawed bill to block a worse one is a victim of defective institutional rules, not an individual moral failure."*
  *   **AGREE** ➔ **LEAF 3: DISSOLVED BY INSTITUTIONAL DESIGN**
      *   **Awkward Commitment:** Suggests no ethical action is possible until the political system is completely rebuilt.
      *   **Public Treatment:** Tolerate the individual's choice, but demand structural reform to prevent future dilemmas.
  *   **DISAGREE** ➔ *(Individual agency remains the locus of responsibility)* ➔ **Go to Q4**

  ### **Q4: THE CIVIL SERVANT'S LEAK**
  *"The Civil Servant's office grants moral permissions to break laws (like leaking) that a private citizen fundamentally lacks."*
  *   **AGREE** ➔ **LEAF 4: OFFICE CHANGES NORMS (No Guilt Required)**
      *   **Awkward Commitment:** Permits elites to operate under a separate moral code from the citizens they serve.
      *   **Public Treatment:** Tolerate or praise the act based solely on results; no apology or confession is necessary.
  *   **DISAGREE** ➔ *(Ordinary morality binds the official)* ➔ **Go to Q5**

  ### **Q5: THE STRATEGIST'S SMEAR**
  *"The Campaign Strategist quietly benefiting from a supporter's smear is wrong primarily because it was done covertly, not because of the benefit itself."*
  *   **AGREE** ➔ **LEAF 5: WRONG IS COVERT (Publicity is the Real Requirement)**
      *   **Awkward Commitment:** Implies that morally forbidden acts become permissible if the public consents to them openly.
      *   **Public Treatment:** Demand public confession and transparency; remove from office only if they lie about it.
  *   **DISAGREE** ➔ *(The substance of the act is dirty, regardless of secrecy)* ➔ **Go to Q6**

  ### **Q6: THE MAYOR'S RAID**
  *"If the Mayor authorizes a raid that kills an innocent person to save the city, the Mayor is still morally guilty of the death."*
  *   **AGREE** ➔ **Go to Q7**
  *   **DISAGREE** ➔ *(Necessity absolves guilt)* ➔ **LEAF 4 (OFFICE CHANGES NORMS)** *(Note: This path converges with Leaf 4)*

  ### **Q7: THE MARK OF INTEGRITY**
  *"To prove they have not been corrupted by power, the Mayor must welcome punishment or removal after authorizing the raid."*
  *   **AGREE** ➔ **LEAF 6: UNNAMED (The Penitent Dirty Hands)**
      *   **Awkward Commitment:** Ritualizes guilt and punishment without necessarily preventing the dirty act from recurring.
      *   **Public Treatment:** Remove from office or punish the official to cleanse the institution, even if the act was necessary.
  *   **DISAGREE** ➔ **LEAF 7: ACT JUSTIFIED BUT AGENT GUILTY**
      *   **Awkward Commitment:** Requires the public to rely on a leader they acknowledge is morally tainted.
      *   **Public Treatment:** Tolerate the official's continued service but acknowledge the moral cost; do not punish.

  ***

  ### **META-ANALYSIS: LOGICAL GAPS & OVERLAPS**

  **1. Indistinguishable Leaves:**
  The tree struggles to fully separate **Leaf 6 (Penitent)** and **Leaf 7 (Guilty/No Punish)**. Both agree the act is necessary and the agent is guilty; they differ only on the *aftermath*. In practice, many theorists who argue for guilt (Leaf 7) also argue for some form of penance (Leaf 6), making these positions often overlap in real-world application.

  **2. Unoccupied Answer-Combinations:**
  *   **"Office Changes Norms" + "Agent Guilty":** This combination is logically incoherent and unoccupied. If the office *changes* the norms (Leaf 4), the agent cannot be *guilty* of violating them (Leaf 7). One cannot claim a special permission to act and simultaneously claim to be morally stained for using that permission.
  *   **"Refusal Required" + "Institutional Design":** Rarely held together. If the dilemma is purely a product of institutions (Leaf 3), refusing to act (Leaf 2) does not solve the problem, yet most Institutionalists argue for working within the system to change it rather than absolute refusal.

  **3. Case Coverage:**
  *   **Minister:** Q1 (Act vs. Permit).
  *   **Successor:** Q2 (Refusal).
  *   **Legislator:** Q3 (Imposed vs. Institutional).
  *   **Civil Servant:** Q4 (Person vs. Office).
  *   **Strategist:** Q5 (Publicity).
  *   **Mayor:** Q6 & Q7 (Guilt & Punishment).
