answer: |-
  Bernard Williams would likely find your friend's reliance on institutional policy and detection tools to be a classic example of what he called "the morality system" at work: a reduction of ethical life to rule-compliance, obligation, and enforcement. He would argue that this framework misunderstands how ethical change actually occurs. For Williams, deep shifts in ethical practice are rarely the result of new arguments or better rules; they are transformations in social identity and what he, following the Greeks, would describe as the structure of shame.

  On the objection of the "missing peer group," Williams would challenge the assumption that a code of honor requires aristocrats or gentlemen. In his view, any community that sustains thick ethical concepts—like "scholar," "journalist," or "writer"—constitutes a peer group capable of enforcing shame. The university or newsroom is not merely a bureaucracy; it is an ethical community where self-respect is tied to a specific social role. When the definition of that role shifts (from "one who writes" to "one who generates text"), the mechanism of shame activates to police the boundary. The speed of the stigma you observed is not evidence of a logical consensus finally being reached; it is evidence of a collective panic about the stability of that identity. Williams would say the stigma arrived first because the *possibility* of the action threatened the social reality of the profession before the *rule* could be codified.

  Regarding the "missing immorality," Williams would draw a sharp distinction between "morality" (a specific system of obligation and guilt) and "ethics" (the broader question of how to live and who to be). Your friend is looking for a violation of moral obligation (guilt); you are observing a loss of standing (shame). Williams would argue that the controversy over AI is not about a universal moral law but about the virtue of *sincerity* or *authenticity*, which are thick ethical concepts. These concepts are world-guided: they depend on the world being a certain way. If AI dissolves the link between mind and text, the concept of "author" loses its world-guidedness. The stigma is an attempt to restore the world so that the concept makes sense again. This is not merely economic protectionism; it is an effort to preserve the intelligibility of a form of life.

  However, Williams' framework would run into limitations here. His analysis of honor and shame was rooted in face-to-face societies or tightly bound professional classes with stable hierarchies. The digital ecosystem is amorphous, global, and lacks the stable "gaze" required for traditional shame. Furthermore, while Williams acknowledges that ethical structures serve social functions, he resists reducing them *merely* to interest. He would likely concede that economic protectionism is the *genealogical cause* of the shift, but he would insist that for the agents involved, it is experienced and functions as a matter of honor. To reduce it entirely to interest would be to ignore the phenomenological reality of the ethical experience, which is what his philosophy seeks to preserve.

  Ultimately, Williams would side with your intuition that the signature of the change is social and identity-based rather than rational. He would argue that the arguments against AI plagiarism were always available, just as arguments against dueling were available long after dueling ceased to be honorable. The change happened when the practice no longer fit the self-conception of the group. He would view this not as a moral revolution in the sense of discovering new truths, but as an honor shift confined to a professional class, where the "honor" is the credibility of the intellectual worker.

  \answer{honor-first}
