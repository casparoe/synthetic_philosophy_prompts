      *   *Challenge the inference:* Does informational encapsulation imply separate *subjects*?
      *   *Bring in counter-evidence:* Cross-cuing. They aren't always blind to each other; they learn to cue off body movements.
      *   *Philosophical point:* The "unity" isn't all-or-nothing. It's a single organism with a single biography, even if processing is modular. The confabulation isn't a "polite cover-up" between two agents; it's a single system trying to make sense of incomplete data.
