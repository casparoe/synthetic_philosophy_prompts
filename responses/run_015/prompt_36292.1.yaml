      I grant you the hatband data—it's striking, and I'm not going to pretend the hemispheres aren't informationally encapsulated in those specific tachistoscopic conditions. But you're making a leap from 'separate information pools' to 'separate subjects of experience.' Just because the left hemisphere doesn't have access to the right hemisphere's visual input doesn't mean there's a separate 'person' residing in the right hemisphere looking at that band. Think about cross-cuing: patients often coordinate responses because one hemisphere watches the other hand's movement and infers the intent. That suggests a single monitoring system trying to integrate behavior, not two agents politely ignoring each other. If there were truly two minds, you'd expect constant internal conflict in daily life, yet these patients report feeling perfectly normal and unified outside the lab.

