  2. If the traveller cannot do anything other than what she did not do, what explanatory work are the two senses of "can" actually doing? If you concede this tells us only that the past is actual, how does that differ from plain fatalism about the past, and does it leave the traveller anything to deliberate about?

  3. Where does the content of a looped object come from, such as a score copied in 2024 from a manuscript carried back to 1824 and then recopied, and are you committed to facts with no further explanation? If you claim local causal explanation is all that is owed and loops are no worse than unexplained initial conditions, is that comparison fair given that the looped fact seems explained by nothing at all rather than by a contingent boundary condition?

  4. Suppose the traveller's father was conceived from a gamete frozen years before the death of the man she goes back to kill, so that her existence is in no way hostage to his survival: does the no-change view predict that she can now succeed? If you bite that bullet, is your view not then committed to brute coincidence in the ordinary case, where a hundred travellers fail for unrelated reasons with nothing in the situation to explain why?

  5*. Do you treat consistency as a constraint on which global solutions are admissible or as something that merely happens to obtain, and is your modality therefore metaphysical or only nomological? If you reply that the paradox is a conceptual matter and the physics is beside the point, has a view answerable to no physics said anything about whether time travel is possible in the world we actually occupy (marked least confident because contemporary philosophers often integrate physics more closely than pure conceptual analysis suggests)?
