answer: |-
  ### Brainstorming: How This Could Go Wrong

  1.  **The Truth-Trap (Philosophical/Social):** If I say, "They will be happy," I have made a prediction. If they have a hard year, I have lied. If I say, "They are perfect," I have made a claim that can be falsified. This violates the bride's constraint that a wedding is not a descriptive report but a constructive act.
  2.  **The Ventriloquist Act (Philosophical):** If I read the mother's text verbatim, I become the agent of the speech. The bride's theory suggests this is void; the supervisor suggests it's valid *if* framed as delegation. If I just read it flatly, it looks like I'm hiding behind her words to say things I can't verify (like her emotional state).
  3.  **The Exclusion (Social):** If I focus too much on the philosophical constraints or English wordplay, the Romanian family becomes an audience to an inside joke rather than participants in the wedding.
  4.  **The Dishonesty (Social):** If I read her text saying she is "over the moon" when she has been cool about the wedding, I am lying to the room. If I don't read it, I risk embarrassing her.
  5.  **The Lecture (Social):** If I explain *why* I'm not making claims or *why* she is speaking, I turn the toast into a seminar. The band is waiting; the wine is open. No one wants a syllabus.

  ### The "Must Not" List

  *   **No Adjectives of Prediction or Character:** Do not use words like "perfect," "meant to be," "happy," or "future."
  *   **No Reading the Mother's Text:** Do not read her prepared English sentences. They contain forbidden claims and risk dishonesty.
  *   **No Meta-Commentary:** Do not mention "speech act theory," "constraints," "papers," or "supervisors."
  *   **No Pretending:** Do not say "His mother asked me to tell you..." if the result is that she speaks herself.
  *   **No Complex Syntax:** Keep sentences short for the non-English speakers.

  ***

  ### The Toast

  Good evening.

  For those who don't know me, I've known [Groom] for a long time. Long enough to know that we usually talk about things we can prove. Facts. Figures. Things that can be right or wrong.

  But look around this room. There isn't much here that needs proving.

  We are not gathered to verify a contract. We are not here to sign a document that says a certain future is guaranteed. We are here to do something else. We are here to build a space where a future can happen.

  Words are tools. Tonight, we don't use them to describe the world. We use them to change it.

  So, I will not tell you what this marriage *is*. I will not tell you how [Groom] and [Bride] *feel*. Those are things for them to live, not for me to announce.

  Instead, I want to talk about welcome.

  A wedding is a new house. It needs a door. It needs someone to open it.

  [Groom]'s mother is here. She knows that some things cannot be translated. Some things lose their weight if they are carried by someone else's voice. She wrote words for me to read, but she realized something important: a welcome only works if it comes from the host.

  So, I am not going to read her letter. I am going to ask her to open the door.

  She is going to stay in her seat. She is going to speak in the language she grew up with. It is a formula of welcome that has worked in her family for a long time. It does not describe anything. It does not promise anything. It simply invites you in.

  When she speaks, I need everyone to listen. And when she raises her glass and says the final word, I need you to raise yours and say it back. It doesn't matter if you know the meaning. The meaning is in the reply.

  [Mother's Name], the room is yours.

  *(Pause. I walk to Table Four with the microphone. I hand it to her. She remains seated. She speaks a brief sentence in Romanian, ending with "Noroc.")*

  *(I gesture to the room.)*

  Everyone. "Noroc."

  *(Room responds.)*

  Thank you.

  That is the work done. The door is open. The rest of the night belongs to you.

  To the band. To the dancing. To the work ahead.

  ***

  ### Load-Bearing Notes

  **1. The Shift from Constative to Performative**
  *   *The Line:* "We are not gathered to verify a contract... We are here to build a space."
  *   *Why:* This satisfies the Bride's constraint without using jargon. It frames the speech as an action (building/welcoming) rather than a description (claiming they are happy). It inoculates the room against expecting predictions about the couple's future.

  **2. The Handling of the Mother's Agency**
  *   *The Line:* "A welcome only works if it comes from the host."
  *   *Why:* This solves the "Loaned Voice" problem. By stating that the *function* of the words requires the *original speaker*, I validate the Bride's theory (I can't speak for her) while satisfying the Supervisor's requirement for public uptake (she is speaking publicly). It also saves the Mother from my reading of her text, which might have sounded insincere given her coolness toward the wedding. She only has to perform a ritual greeting, which is socially safer than declaring emotional states she might not fully feel yet.

  **3. The Uptake Mechanism**
  *   *The Line:* "The meaning is in the reply."
  *   *Why:* This instructs the English speakers on how to participate without understanding the language. It turns the Romanian phrase into a collaborative act. For the Romanian family, hearing the English speaker validate their language and instruct the English guests to participate in it signals respect and inclusion, rather than tokenism.

  **4. The Closing**
  *   *The Line:* "To the work ahead."
  *   *Why:* A traditional toast ends with "To the happy couple." That is a claim about their state. "To the work ahead" is an invitation to action. It aligns with the "doing not saying" constraint and acknowledges that marriage is an ongoing construction, not a finished product.
