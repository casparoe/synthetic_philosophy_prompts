answer: |-
  # Handout: Navigating the Reference Class Trap

  **Root Question:** Do you think reference-class selection should happen outside the view or inside it?

  ---

  ### **Branch A: Outside (Selection is objective/pre-determined)**
  **Node Question:** When multiple classes fit the data, how do you choose which one to use?

  *   **Leaf 1: Pick the broadest class.**
      *   **Stance:** Naive Outside-Viewism
      *   **Awkward Commitment:** You must predict a startup succeeds at the same rate as a coin flip if the broadest class is "binary outcomes."
  *   **Leaf 2: Pick the statistically strongest class.**
      *   **Stance:** Objective Correlation Selection *(Filler)*
      *   **Awkward Commitment:** You must trust a spurious statistical correlation over a known causal mechanism if the p-value is lower.

  ---

  ### **Branch B: Inside (Selection uses case details)**
  **Node Question:** Is the base rate your final answer or just a starting point?

  #### **Path B1: Final Answer (The base rate *is* the prediction)**
  **Node Question:** Do you pick one class or combine many?

  *   **Leaf 3: Pick the narrowest relevant class.**
      *   **Stance:** Inside-View Selection
      *   **Awkward Commitment:** You must claim your narrow class isn't just cherry-picked data designed to justify your intuition.
  *   **Leaf 4: Average all plausible classes equally.**
      *   **Stance:** Reference-Class Averaging
      *   **Awkward Commitment:** You must treat a wildly specific class (e.g., "left-handed CEOs") the same as a broad one (e.g., "CEOs").

  #### **Path B2: Starting Point (The base rate is a prior)**
  **Node Question:** How do you update away from the base rate?

  *   **Leaf 5: Weight by calculated likelihoods.**
      *   **Stance:** Full Bayesian Model Averaging
      *   **Awkward Commitment:** You must compute likelihoods for reference classes you can't fully define or observe.
  *   **Leaf 6: Penalize distance exponentially.**
      *   **Stance:** Lindy-Modest Weighting
      *   **Awkward Commitment:** You must accept that wild outliers are exponentially less likely just because they are far from the mean.
  *   **Leaf 7: Weight by intuition.**
      *   **Stance:** Intuitive Model Averaging *(Filler)*
      *   **Awkward Commitment:** You must trust your gut to weight models you don't understand mathematically.
  *   **Leaf 8: Ignore it if inside view is strong.**
      *   **Stance:** Inside View Dominance *(Filler)*
      *   **Awkward Commitment:** You must admit your "outside view" check was performative if you override it completely.

  ---

  ### **Glitches in the Matrix**

  **⚠️ Unseparable Pairs**
  *   **Reference-Class Averaging (Leaf 4) vs. Full Bayesian (Leaf 5):** If your Bayesian priors are uniform, these two methods produce the exact same number, making the distinction purely philosophical.
  *   **Inside-View Selection (Leaf 3) vs. Naive Outside-Viewism (Leaf 1):** If the "narrowest relevant class" happens to be the "broadest class," these positions converge, hiding the methodological disagreement.

  **🕳️ Empty Combinations**
  *   **Pure Outside View with No Class Selection:** This box is incoherent. You cannot generate a base rate without selecting a class, and selecting a class always requires some knowledge of the case (inside view). There is no "view from nowhere."
