prompt: |-
  I chair the ethics consultation subcommittee at a 300-bed community hospital, and eight months ago I was named healthcare proxy for my father, who has since been diagnosed with Lewy body dementia. I want to replace the way our team currently handles conflicts between an advance directive and what the patient is saying now.

  Our consultations run about twenty-five a year, plus bedside calls that a hospitalist or charge nurse makes alone at 2 a.m. with no philosopher in the building. The decision is always the same shape: a document signed years earlier says one thing, the person in front of us says another, and we have to decide whose voice governs — or, when the person can no longer speak for themselves at all, what we are bound to do with a document whose author is still alive and sitting in the bed. The stakes are asymmetric and both directions are bad: the wrong override can mean treatment someone spent a decade arranging to avoid, or an irreversible withholding from someone who wanted to live. Sign-off is the attending plus the proxy, with escalation to the full committee or to our legal department only when the conflict survives the first pass. Whatever we decide goes in the chart and may eventually be read by a family or a judge, so documentation is part of the deliverable, not an afterthought.

  I have read enough of the philosophical literature to know the shape of the argument — the view that an earlier self's settled, identity-constituting values should be honored over the desires of a later self who has lost the capacity to weigh them, and the rival view that the person now in the bed is the one who actually experiences what happens and that precedent autonomy is a fiction imposed on a stranger. What I have not found is anything that tells a nurse at 2 a.m. what to do next. So please build me a decision procedure, not an essay.

  What I want it to do:

  Take as input a written directive and a present clinical situation in which honoring the directive and honoring the patient's present expression come apart, and output one of three things — honor the document, override it, or escalate — by way of ordered questions, each with a stated threshold for what counts as a sufficient answer. Mark every point at which the procedure terminates early with a no, and every point at which it must hand the decision back to a person because the remaining question is a values question rather than a factual one. I expect the handoff points to be the most useful part of the document.

  Four distinctions I want the procedure to carry, because I think they are where our current practice goes wrong:

  Counterfactual unawareness. The earlier self was not choosing under the description that now applies. She was choosing between abstractions she filled in with the worst case she could picture. I want the procedure to test, as a factual matter, whether the situation that has actually arrived is one the directive can be read as addressing at all, and to distinguish that question from the question of whether the earlier self would have extended it. My sense is that we routinely collapse the two and call the result fidelity.

  Asymmetric scrutiny. We audit a present refusal for delirium, sedation, depression, and the influence of whoever last visited, and we do not audit the document for provenance — whether it was a form ticked at an admission desk, whether it was written during a bad month, whether the person who signed it had ever been inside an ICU. I want both voices held to the same evidentiary standard, and I want that symmetry to be an explicit step rather than a reminder.

  Graded authenticity in place of the capacity gate. Capacity is a binary legal finding, but in practice it is where our entire judgment gets smuggled in: once the patient is found to lack capacity the directive controls automatically, and once she is found to have it the document becomes irrelevant. I want a graded profile of how much weight the present utterance carries — consistency across time and across questioners, whether it tracks features of the present situation or repeats regardless of context, whether stated reasons match observed behavior — used to decide how much evidence it takes to defeat the document, not merely whether it counts at all.

  Rationale falsification. Some directives state their reasons. When a stated reason turns out to be false — the burden feared was never real, the prognosis assumed has been overtaken by a treatment that did not exist when the document was signed, the person named as the one who would suffer is dead — I want a test for whether the directive fails with its reason or survives independently of it, and I want the procedure to say what kind of evidence would settle that.

  Two structural constraints. First, reversibility: where one option can be undone later and the other cannot, the procedure should have something to say about which error we should prefer, and should not pretend the two errors are symmetric. Second, the law: in our jurisdiction a prior directive is presumptively binding on an incapacitated patient, so any step that recommends overriding one needs to say plainly what the legal exposure is and who has to be told, without letting that replace the ethical question.

  Then run it on three cases:

  A 41-year-old woman with bipolar I and three prior admissions, each ending with her abandoning lithium mid-episode. During a documented period of stability she completed a detailed directive refusing lithium and ECT during any future manic episode and named a friend as proxy. She is now manic, refusing lithium, and offers a reason the earlier self did not weigh: a tremor on the medication ended her paid violin work, and she says she would rather be ill than never play again. Her proxy agrees with her current refusal and describes her as unusually lucid.

  A 74-year-old man with advanced dementia who can no longer state a preference. In 2003, after watching his mother die on a ventilator following a massive stroke, he signed a directive refusing machines to keep him alive and heroic measures, with a clause limiting this to cases where there is no reasonable hope of recovery. He has now fractured a hip; surgery and a few days of postoperative ventilation would very likely return him to his baseline of walking with a frame and singing in a choir. He shows clear pleasure in music and food and no signs of suffering. His son says the document settles it; his daughter says her father never meant this.

  A 68-year-old woman with moderate early-onset Alzheimer's, living at home with a paid caregiver. Six years ago, after a friend's long ICU stay, she wrote a directive by hand following two conversations with her physician, refusing hospitalisation and all life-prolonging treatment, and giving as her sole reason that she would not let her daughter Anna give up her life to care for her. Anna died in a car crash two years ago; there is no other family; the caregiver is funded by an insurance settlement. She now has urosepsis and has said several times, calmly and consistently, that she does not want to die and that we should do whatever it takes. I should tell you that I have argued on our committee that a considered, specific, handwritten directive should be very close to conclusive, and I expect my colleagues will expect it too — so if your procedure says otherwise in this case, I want it to say so and to show the work, because that is exactly the case I will be asked about.

  Finally, I want the failure section to be honest rather than reassuring. Tell me which steps are theater we will document because they look like reasoning rather than because they change anything; tell me what the procedure cannot settle — the patient whose capacity and whose wishes both fluctuate day to day, the non-verbal patient whose objection is pure behavior, the proxy who is also the residuary beneficiary, and the case where the earlier self pre-committed in full awareness that she would later resist and the resistance is therefore evidence the mechanism is working rather than evidence against it. And give me a one-page version, in chart-note form, that the 2 a.m. hospitalist can actually use.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Chair of ethics consultation subcommittee at a 300-bed community hospital. Healthcare proxy for father (Lewy body dementia).
      *   **Goal:** Replace current conflict handling (Advance Directive [AD] vs. Current Expression [CE]) with a specific decision procedure.
      *   **Output:** A decision procedure (algorithm/flowchart style), not an essay. Must output: Honor Document, Override Document, or Escalate.
      *   **Key Features:** Ordered questions with thresholds. Mark early termination points. Mark "handoff points" (values questions).
      *   **Four Required Distinctions:**
          1.  *Counterfactual Unawareness:* Did the AD author know *this* specific situation? (Factual vs. Extension).
          2.  *Asymmetric Scrutiny:* Audit the AD's provenance just as strictly as the patient's capacity.
          3.  *Graded Authenticity:* Move away from binary capacity. Weight the CE based on consistency, context, reasons.
          4.  *Rationale Falsification:* If the AD's stated reason is false, does the AD fail?
      *   **Two Structural Constraints:**
          1.  *Reversibility:* Prefer the reversible error.
          2.  *Law:* Acknowledge legal presumptions (AD is binding) and exposure.
      *   **Test Cases:**
          1.  41F Bipolar (Lithium/ECT refusal vs. current refusal based on tremor/violin).
          2.  74M Dementia (AD refuses "machines/heroic" vs. hip surgery/short vent with good recovery).
          3.  68F Alzheimer's (AD refuses hospitalization to spare daughter Anna vs. Anna dead, patient wants treatment). *Note: User expects this to be contentious.*
      *   **Failure Section:** Honest assessment of limitations (theater, unsolvable cases).
      *   **One-Page Version:** Chart-note form for 2 a.m. hospitalist.

  2.  **Deconstruct the Ethical & Legal Landscape:**

      *   *Legal Baseline:* In most US jurisdictions, a competent patient's current wish overrides an AD. If incapacitated, the AD is presumptively binding. The tricky middle ground is "diminished capacity" or "fluctuating capacity" where the patient expresses a wish but might not meet strict legal capacity standards, yet the AD seems inapplicable.
      *   *Ethical Tension:* Precedent Autonomy (Dworkin) vs. Critical Interests/Current Experiential Interests (Dresser/Robertson).
      *   *The User's Insight:* The user correctly identifies that "Capacity" is often a switch used to bypass the hard work of weighing the *weight* of the prior wish against the *weight* of the current wish. The procedure needs to operationalize this weighing.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**

      *   *Structure:* Needs to be linear, step-by-step, with clear "Stop/Decide" points.
      *   *Step 1: Urgency & Reversibility (Triage).* Before digging into ethics, can we wait? Is the harm irreversible?
      *   *Step 2: Capacity & Authenticity (Graded).* Instead of Yes/No Capacity, assess the *weight* of the Current Expression (CE).
      *   *Step 3: Directive Provenance (Asymmetric Scrutiny).* Assess the *weight* of the Advance Directive (AD).
      *   *Step 4: Applicability (Counterfactual Unawareness).* Does the AD actually cover *this* scenario?
      *   *Step 5: Rationale Falsification.* Is the "Why" of the AD broken?
      *   *Step 6: The Weighing (Handoff).* If AD and CE both have weight and conflict, who decides?
      *   *Step 7: Legal Check.* If overriding AD, who needs to know?

      *Refining the Steps based on constraints:*
      *   *Reversibility:* Put this first. If treating is reversible and withholding is not, treat pending review.
      *   *Graded Authenticity:* Need a scoring or threshold system. Consistency, reasoning, affect.
      *   *Asymmetric Scrutiny:* Need questions about *when* and *how* the AD was signed.
      *   *Rationale Falsification:* Specific check on the "Because..." clause in the AD.

  4.  **Developing the Test Cases:**

      *   *Case 1 (Bipolar/Violin):* AD is specific (no lithium/ECT). CE is specific (tremor/violin). Capacity is fluctuating (manic). *Analysis:* AD provenance is strong (stable period). CE authenticity is high (specific new reason). Rationale falsification? The AD didn't know about the tremor/violin trade-off. *Verdict:* Escalate/Ethics Consult. The new information changes the calculus significantly.
      *   *Case 2 (Dementia/Hip):* AD is vague ("heroic measures," "no hope of recovery"). CE is non-existent (dementia). *Analysis:* Counterfactual unawareness is key. Hip surgery isn't "keeping alive" in the sense of the mother's stroke. Recovery is likely. *Verdict:* Honor Treatment (Override AD interpretation). The AD doesn't apply to this reversible acute condition.
      *   *Case 3 (Alzheimer's/Anna):* AD is specific (no hospitalization). Reason is specific (spare Anna). Anna is dead. CE is present (wants to live). *Analysis:* Rationale Falsification is the killer here. The sole reason is impossible. CE is consistent. *Verdict:* Override AD. This challenges the user's prior stance. I need to be firm here based on the procedure's logic.

  5.  **Drafting the Failure Section:**

      *   Must be cynical/honest.
      *   "Theater": Documentation that protects the hospital, not the patient.
      *   "Unsolvable": Fluctuating capacity, non-verbal distress, conflicted proxies.
      *   "Ulysses Contracts": When resistance is expected (psychiatry).

  6.  **Drafting the One-Pager:**

      *   Needs to fit on a standard progress note or pocket card.
      *   Checkboxes.
      *   Clear "Call Ethics" triggers.

  7.  **Review and Refine (Self-Correction):**

      *   *Critique:* Is the procedure too complex for 2 a.m.?
      *   *Fix:* The full procedure is for the Committee/Daytime. The One-Pager is for 2 a.m. The prompt asks for *a* decision procedure, then a one-page version. I will build the robust one first, then distill it.
      *   *Critique:* Did I address the legal constraint?
      *   *Fix:* Ensure Step 7 explicitly states "Legal Exposure" and "Notification."
      *   *Critique:* Did I address the "Handoff Points"?
      *   *Fix:* Explicitly label steps where the algorithm stops and says "Human Judgment Required."
      *   *Critique:* Case 3 is sensitive for the user.
      *   *Fix:* I must follow the logic of the procedure I built, even if it contradicts the user's previous committee stance. The prompt asks me to "show the work." The "Rationale Falsification" constraint demands that if the *sole* reason is nullified, the directive loses force.

  8.  **Final Polish:**

      *   Tone: Professional, clinical, precise, empathetic but unsentimental.
      *   Formatting: Use bolding, boxes, and clear headers to make it usable.
      *   Check against all four distinctions and two constraints.

      *(Self-Correction on Case 3)*: The user says "I have argued... a considered, specific, handwritten directive should be very close to conclusive." If my procedure says Override, I need to make sure the *reasoning* is airtight so the user can defend it. The key is the *sole reason* clause. If the AD said "I don't want treatment AND I don't want to burden Anna," it's different. If it says "I refuse treatment *because* I don't want to burden Anna," and Anna is dead, the condition precedent is failed. I will stick to this logic.

      *(Self-Correction on Reversibility)*: Make sure the "Reversibility" constraint drives the "Default Action" in the absence of clarity.

      *(Self-Correction on Law)*: Acknowledge that overriding an AD is legally risky. The procedure must recommend Legal/Risk Management involvement if overriding.

  9.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  # The Precedent/Presence Conflict Protocol (PPCP)

  **Purpose:** To resolve conflicts between a valid Advance Directive (AD) and a patient's Current Expression (CE) when the two diverge.
  **Scope:** Applies when the patient is medically decision-capacity impaired *or* when the CE contradicts a prior competent directive.
  **Outputs:** (1) Honor AD, (2) Honor CE (Override AD), (3) Escalate to Ethics/Legal.

  ---

  ## Phase 1: Triage & Reversibility (The Safety Gate)
  *Goal: Prevent irreversible harm while deliberation occurs.*

  **Q1.1: Is the proposed action (treating or withholding) immediately reversible?**
  *   **Yes (Treatment is reversible):** Administer treatment pending resolution. (e.g., Start antibiotics, hold surgery).
  *   **Yes (Withholding is reversible):** Continue treatment pending resolution. (e.g., Continue vent, do not extubate).
  *   **No (Action is irreversible):** Proceed to Q1.2. (e.g., DNR order, amputation, discharge to hospice).

  **Q1.2: Does the risk of immediate death or permanent injury outweigh the risk of violating autonomy?**
  *   **Yes:** Act to preserve life/function. **Document:** "Emergency privilege invoked due to irreversibility." **Terminate.**
  *   **No:** Proceed to Phase 2.

  ---

  ## Phase 2: Graded Authenticity of Current Expression (CE)
  *Goal: Assess the weight of the patient's present voice without a binary capacity gate.*

  **Q2.1: Consistency.** Has the CE been stated consistently across >2 interactions and >12 hours?
  *   **No:** Weight = Low. Proceed to Q2.2.
  *   **Yes:** Weight = High. Proceed to Q2.2.

  **Q2.2: Contextual Tracking.** Does the CE change appropriately when clinical facts change (e.g., pain treated, family leaves)?
  *   **No (Rigid/Repetitive):** Weight = Low. (Suggests delirium/compulsion).
  *   **Yes (Responsive):** Weight = High. Proceed to Q2.3.

  **Q2.3: Reasoning.** Does the patient offer a reason that connects to their observed reality?
  *   **No:** Weight = Low.
  *   **Yes:** Weight = High.
  *   **HANDOFF POINT:** If CE Weight is **High**, the CE counts as significant evidence of current interest. If **Low**, the CE is noted but carries little weight against the AD.

  ---

  ## Phase 3: Provenance of Advance Directive (AD)
  *Goal: Apply asymmetric scrutiny to the document.*

  **Q3.1: Specificity.** Does the AD name the specific intervention now proposed (e.g., "ventilator" vs. "life support")?
  *   **No (Vague):** Weight = Low. (e.g., "No heroic measures").
  *   **Yes (Specific):** Weight = High. Proceed to Q3.2.

  **Q3.2: Experience.** Is there evidence the signatory understood the medical state described (e.g., prior ICU experience, detailed conversation with physician)?
  *   **No (Form/Abstract):** Weight = Low.
  *   **Yes (Informed):** Weight = High. Proceed to Q3.3.

  **Q3.3: Stability.** Was the AD executed during a period of documented emotional/medical stability?
  *   **No (During crisis/depression):** Weight = Low.
  *   **Yes:** Weight = High.
  *   **HANDOFF POINT:** If AD Weight is **Low**, it functions as a guideline, not a command. If **High**, it functions as a binding instruction *unless* falsified in Phase 4.

  ---

  ## Phase 4: Applicability & Rationale Falsification
  *Goal: Test if the AD actually governs this situation.*

  **Q4.1: Counterfactual Unawareness.** Is the current clinical scenario materially different from the "worst case" envisioned in the AD (e.g., temporary setback vs. terminal decline)?
  *   **Yes:** The AD does not apply. **Output: Honor CE/Treat.** **Terminate.**
  *   **No/Unknown:** Proceed to Q4.2.

  **Q4.2: Rationale Falsification.** Does the AD state a specific reason for the refusal (e.g., "to spare my daughter")?
  *   **No (Preference only):** Proceed to Phase 5.
  *   **Yes:** Is that reason factually false now (e.g., daughter is dead, burden is insured)?
      *   **Yes:** The directive's condition precedent has failed. **Output: Override AD.** **Terminate.**
      *   **No:** Proceed to Phase 5.

  ---

  ## Phase 5: The Weighing (Values Handoff)
  *Goal: Determine where the ethical authority lies.*

  **Q5.1: The Weight Comparison.**
  *   **AD Weight High + CE Weight Low:** **Output: Honor AD.**
  *   **AD Weight Low + CE Weight High:** **Output: Honor CE.**
  *   **AD Weight High + CE Weight High:** **Output: ESCALATE.** (This is a values conflict, not a factual one).

  **Q5.2: Legal Exposure Check (If Overriding AD).**
  *   **Action:** If output is "Honor CE" against a High Weight AD, Risk Management and Legal Counsel must be notified before implementation.
  *   **Documentation:** Chart must explicitly state: "Decision made to prioritize current experiential interests over precedent autonomy based on [Specific Phase 4 Finding]."

  ---

  # Case Applications

  ### Case 1: 41F Bipolar (Lithium/ECT Refusal)
  *   **Phase 1:** Treatment (Lithium) is reversible. Default to safety if urgent, but assume time for review.
  *   **Phase 2 (CE):** Consistency (High during mania?), Context (High—specific to violin), Reasoning (High—tremor vs. illness). **CE Weight: High.**
  *   **Phase 3 (AD):** Specificity (High—names Lithium/ECT), Experience (Unknown/Medium), Stability (High—signed during stability). **AD Weight: High.**
  *   **Phase 4 (Applicability):** Counterfactual Unawareness. The AD refused meds for *mania*. It did not weigh the specific side effect (tremor) against the specific value (violin). This is new information the earlier self did not possess.
  *   **Phase 5 (Weighing):** High vs. High.
  *   **Output:** **ESCALATE.**
  *   **Reasoning:** This is not a clear override. The AD is robust, but the CE introduces a value trade-off (violin vs. stability) the AD could not have calculated. Ethics committee must determine if the "tremor" constitutes a material change in circumstances warranting override. Legal counsel must be involved if treating against the AD.

  ### Case 2: 74M Dementia (Hip/Vent)
  *   **Phase 1:** Surgery/Vent is reversible.
  *   **Phase 2 (CE):** Patient cannot speak. Behavior shows pleasure. **CE Weight: N/A (Behavioral assent present).**
  *   **Phase 3 (AD):** Specificity (Low—"heroic measures"), Experience (Low—based on mother's stroke, not his own), Stability (High). **AD Weight: Low/Medium.**
  *   **Phase 4 (Applicability):** Counterfactual Unawareness. **Yes.** The AD envisioned "no hope of recovery" (terminal). Hip surgery has "very likely return to baseline." The situation described in the AD (terminal decline) is not the situation present (acute reversible).
  *   **Output:** **Honor Treatment (Override AD interpretation).**
  *   **Reasoning:** The AD fails the applicability test. It was written for a terminal scenario, not a reversible acute event. No legal exposure; standard of care supports treating reversible conditions despite vague ADs.

  ### Case 3: 68F Alzheimer's (Anna/Urosepsis)
  *   **Phase 1:** Sepsis treatment is reversible.
  *   **Phase 2 (CE):** Consistent, calm, "do whatever it takes." **CE Weight: High.**
  *   **Phase 3 (AD):** Specificity (High—no hospitalization), Experience (High—physician convos), Stability (High—handwritten). **AD Weight: High.**
  *   **Phase 4 (Rationale Falsification):** AD states *sole reason*: "not let Anna give up her life." **Fact:** Anna is dead. Burden is financial/insurance, not caregiving life. **Reason is False.**
  *   **Output:** **Override AD.**
  *   **Reasoning:** This contradicts your previous committee stance, but the procedure demands it. When a directive is conditional on a specific rationale ("I refuse X *because* Y"), and Y is proven false, the directive loses its moral binding force. The "earlier self" made a transaction: treatment in exchange for Anna's safety. That transaction cannot be completed. To honor the AD now is to honor a ghost.
  *   **Legal Note:** High exposure. Legal must review. Documentation must highlight the *falsification of the condition precedent*.

  ---

  # Failure Section: Where the Procedure Breaks

  **1. The Theater of Documentation**
  Steps Q2.1 and Q3.2 often become box-ticking exercises. A nurse at 2 a.m. will write "Patient consistent" to avoid a fight, even if the patient is fluctuating. A physician will mark AD "Informed" because a signature exists, not because understanding was verified. This procedure cannot fix dishonest charting; it only exposes it if audited.

  **2. The Fluctuating Patient**
  The procedure assumes a snapshot. It fails when capacity/wishes oscillate hourly (e.g., sundowning, metabolic encephalopathy). In these cases, the "Consistency" threshold (Q2.1) creates a paralysis loop. *Mitigation:* Default to Reversibility (Phase 1) until a clear window of stability appears.

  **3. The Non-Verbal Objection**
  When a patient cannot speak but physically resists (pulling tubes, screaming), Q2.3 (Reasoning) cannot be met. The procedure downgrades this CE to "Low Weight," potentially overriding visceral distress with a paper directive. *Mitigation:* Treat behavioral distress as a "High Weight" CE if it requires physical restraint to override.

  **4. The Conflicted Proxy**
  The procedure assumes the proxy argues for the patient. It does not account for the proxy who is the residuary beneficiary and favors the AD because it speeds inheritance, or favors treatment because it delays it. *Mitigation:* This requires Legal/Adult Protective Services, not Ethics. The procedure must Escalate immediately if financial conflict is suspected.

  **5. The Ulysses Trap**
  In psychiatry, a patient may pre-commit to treatment *knowing* they will resist later. If they resist later, the procedure flags "CE Weight High" and "Resistance," potentially overriding the Ulysses contract. *Mitigation:* Add a specific psychiatric exclusion: "If AD is a psychiatric Ulysses contract certified by two physicians, Phase 2 is bypassed."

  ---

  # ONE-PAGE CHART NOTE (2 A.M. VERSION)

  **ETHICS TRIAGE: AD vs. CURRENT WISH CONFLICT**
  *Complete before overriding AD or withholding requested treatment.*

  **1. REVERSIBILITY**
  [ ] Treatment is reversible (Give treatment, call Ethics AM).
  [ ] Withholding is reversible (Continue treatment, call Ethics AM).
  [ ] **IRREVERSIBLE** (e.g., DNR, Extubation). **STOP. CALL ATTENDING + ETHICS ON-CALL.**

  **2. PATIENT VOICE (Current Expression)**
  [ ] Consistent >12 hrs? (Y/N)
  [ ] Understands facts? (Y/N)
  [ ] Reason given matches reality? (Y/N)
  *If 2+ No:* AD Presumed Valid.
  *If 2+ Yes:* CE Carries Weight.

  **3. DIRECTIVE VALIDITY (Advance Directive)**
  [ ] Specific to this treatment? (Y/N)
  [ ] Signed during stability (not crisis)? (Y/N)
  [ ] **RATIONALE CHECK:** Does AD state a reason (e.g., "burden on family")?
      [ ] No.
      [ ] Yes. Is that reason currently FALSE? (e.g., family member dead). **IF YES, AD MAY BE VOID.**

  **4. DECISION**
  [ ] **HONOR AD:** (CE Low Weight / AD High Weight / Applicable).
  [ ] **HONOR CE:** (AD Rationale False / AD Vague / CE High Weight). **NOTIFY RISK MGMT.**
  [ ] **ESCALATE:** (High Weight vs. High Weight / Irreversible Harm). **CALL ETHICS.**

  **5. LEGAL SAFETY**
  [ ] If overriding AD: Legal/Risk Mgmt notified? (Y/N)
  [ ] Family/Proxy notified of decision? (Y/N)

  **Sign:** ___________________ **Time:** _______ **Page:** _______
