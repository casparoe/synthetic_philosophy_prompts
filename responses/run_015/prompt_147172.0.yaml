answer: |-
  Your distinction between **statistical typicality** (descriptive) and **modal necessity** (no other option) is not muddled; it is the exact fault line where the argument breaks. You have identified the equivocation. The slogan "man of his time" is rhetorically useful precisely because it slides between these two without declaring which one is doing the moral work.

  If the claim is merely descriptive ("others did it too"), it fails to excuse (the *tu quoque* fallacy). If the claim is modal ("he could not have done otherwise"), it requires a much heavier burden of proof that defenders rarely want to carry.

  Here is the menu of readings, ranked from trivial to substantive, with an assessment of whether they bridge the gap from "historical fact" to "no blame/keep the name."

  ### 1. The Sociological Claim (Typicality)
  *   **The Claim:** "Most people in his peer group held these views and performed these actions."
  *   **Plausibility:** **Low.** As you noted, this is empirically fragile regarding Jefferson and slavery. There were abolitionists in his lifetime. There were Spanish critics of Columbus (e.g., Bartolomé de las Casas) during his lifetime. Typicality is not universality.
  *   **Does it bridge the gap?** **No.** Even if everyone was doing it, it doesn't follow that it wasn't wrong then, nor that we should honor them now. We do not name schools after typical people; we name them after exemplary ones. If the standard for commemoration is "was typical," we would name schools after average taxpayers, not Founding Fathers.
  *   **Defender Status:** **Opening Move.** This is the version your friend states out loud. It is the easiest to attack because it conflates prevalence with permission.

  ### 2. The Epistemic Claim (Ignorance)
  *   **The Claim:** "He lacked the conceptual framework or factual knowledge to recognize the harm he was causing."
  *   **Plausibility:** **Mixed.** Plausible for some medical or scientific errors. Implausible for moral atrocities like slavery or colonial extraction, where the suffering was visible and the moral counter-arguments were available (even if marginalized). Jefferson knew slavery was morally fraught; he called it a "wolf by the ear." He wasn't ignorant; he was conflicted.
  *   **Does it bridge the gap?** **Partially.** It mitigates *blame* (you can't blame someone for unknowing harm), but it does not justify *commemoration*. We generally do not build statues to people who accidentally caused harm, even if they couldn't have known better. We might forgive them, but we don't necessarily venerate them.
  *   **Defender Status:** **First Retreat.** When pressed on the existence of dissenters, defenders shift to "he couldn't have *fully understood* the long-term implications."

  ### 3. The Modal Claim (Constraint)
  *   **The Claim:** "Given the political, economic, and social structures, acting on a better moral view would have rendered him ineffective or destroyed the project he was leading." (e.g., If Jefferson freed his slaves, he would have been bankrupt and politically powerless to secure American independence.)
  *   **Plausibility:** **High.** This is the strongest historical reading. It acknowledges agency but highlights structural constraints. It admits the act was morally questionable but argues the *cost* of the alternative was prohibitive.
  *   **Does it bridge the gap?** **Yes, for blame; No, for names.** This justifies excusing the agent (he was trapped by his system). However, it does not automatically justify keeping the name. We might decide that a school should not be named after someone whose "greatness" required the subjugation of others, even if that subjugation was structurally "necessary" at the time. This reading separates *exculpation* from *honor*.
  *   **Defender Status:** **Second Retreat.** This is where serious defenders go when cornered. It requires admitting the act was bad but arguing the hands were tied.

  ### 4. The Meta-Ethical Claim (Relativism)
  *   **The Claim:** "Morality is time-relative. It is a category error to apply 21st-century moral standards to 18th-century agents. He was not 'wrong' then; he is only 'wrong' now."
  *   **Plausibility:** **Philosophically Contentious.** This requires a commitment to moral relativism that most people reject in other contexts (e.g., we don't say slavery was "right for them then").
  *   **Does it bridge the gap?** **Yes.** If morality is relative, there is nothing to blame him for, and the name is safe. But this is a nuclear option. If accepted, it prevents us from condemning *any* historical figure, rendering history morally flat.
  *   **Defender Status:** **Hidden Premise.** Defenders rarely say this out loud because it undermines their own claim that Jefferson was *good*. They want him to be a moral hero, not a moral alien. They want to have universal morality (so he's good) and relative morality (so he's not bad) simultaneously.

  ### 5. The Commemorative Claim (Function)
  *   **The Claim:** "Naming a school isn't a moral endorsement of the whole person; it's an acknowledgment of historical impact."
  *   **Plausibility:** **High.** This changes the subject from the agent's morality to our current purpose.
  *   **Does it bridge the gap?** **Yes.** This bypasses the "man of his time" excuse entirely. It argues that we keep the name not because he was innocent, but because the name serves a civic function (continuity, recognition of impact) that outweighs the moral stain.
  *   **Defender Status:** **The Actual Argument.** This is often the real point, but "man of his time" is used as a lazy shorthand for it. Defenders use "man of his time" to avoid having to argue why impact outweighs morality.

  ***

  ### The Verdict on the Slogan

  You asked me to be honest about whether the slogan is doing real work. **It is not.**

  "Man of his time" is a **rhetorical placeholder**. It is a "stopper" phrase designed to signal *exhaustion of the topic* rather than *resolution of the argument*.

  Your friend is using Reading 1 (Typicality) to win the debate quickly, knowing that if you push him, he can retreat to Reading 3 (Constraint) or Reading 5 (Function) to avoid losing. The phrase allows him to hold all these positions vaguely at once without committing to the specific burdens of proof each requires.

  *   **If he means Reading 1:** He is historically wrong (dissenters existed).
  *   **If he means Reading 2:** He is historically naive (Jefferson knew better).
  *   **If he means Reading 3:** He has conceded the moral failing and is now arguing about *necessity*, which is a much narrower defense that doesn't automatically save the school name.
  *   **If he means Reading 5:** He should say that directly. "We name schools for impact, not virtue." That is a debatable, substantive claim. "Man of his time" is not.

  **Confidence:** High. The phrase is almost universally used to equivocate between descriptive statistics and modal necessity. Your intuition that the distinction "comes apart badly" is the correct analytical tool. The slogan relies on the listener not noticing that *typicality does not imply necessity*.

  **Advice:** Don't fight the slogan. Force the specificity. Ask: *"Are you saying he couldn't have known it was wrong, or that he couldn't have acted differently without ruining his other achievements? Because those are different claims, and one excuses him while the other just explains him."*

  If he says "He couldn't have acted differently," you have moved the goalpost to a debate about structural determinism vs. agency. If he says "It wasn't wrong then," you have moved the goalpost to meta-ethics. Both are better arguments than the slogan, but both are much harder for him to defend.
