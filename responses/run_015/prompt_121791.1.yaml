answer: |-
  Here is a lesson plan designed for your 75-minute block. I've tweaked the mechanics slightly to ensure the theory actually lands (more on that in the notes), kept the tone casual, and included the specific theoretical clarifications you asked for.

  # Seminar Plan: The Voting Trap (Gibbard-Satterthwaite Lab)

  **Class Size:** 12 students
  **Time:** 75 minutes (50 min activity, 25 min debrief)
  **Goal:** Viscerally experience why no ranked voting system is perfect (Gibbard-Satterthwaite Theorem).

  ## 1. Prep & Materials
  *   **Preference Cards:** Create 12 index cards. Each card lists a "True Preference Order" for the three projects. Do not make them all the same. You want a split.
      *   *Example Distribution:*
          *   4 students: Lounge > Books > Speaker
          *   4 students: Books > Speaker > Lounge
          *   4 students: Speaker > Lounge > Books
      *   *Note:* This creates a Condorcet Cycle (A beats B, B beats C, C beats A) if they vote honestly. This is crucial for Round 2.
  *   **Tally Sheet:** Have an Excel sheet open on your laptop to calculate Borda and Condorcet instantly. Doing this by hand on the board eats 15 minutes.
  *   **Incentives:** "Department Merit Points" (fake) or just candy. Let's use candy. If their *True Preference* #1 wins, they get 2 pieces. If #2 wins, 1 piece. If #3 wins, 0. This makes the payoff real.

  ## 2. The Setup (5 Minutes)
  Tell the class: "We are the Philosophy Department Budget Committee. We have three projects: **Lounge**, **Books**, **Speaker**. We need to pick one."

  Hand out the **Secret Preference Cards**.
  *   **Rule 1:** Do not show anyone your card.
  *   **Rule 2:** Your goal is to maximize your candy (i.e., get your true #1 picked).
  *   **Rule 3:** You can vote honestly, or you can lie. I won't know the difference.

  **Crucial Tweak:** For Rounds 1 and 2, ask them to **Rank** the options (1st, 2nd, 3rd), *not* allocate points.
  *   *Why?* Gibbard-Satterthwaite (G-S) is a theorem about *ordinal* rankings. If you let them allocate points (cardinal voting), you technically step outside the theorem's conditions, and the lesson gets muddy. Keep Rounds 1 & 2 ordinal. Round 3 can be Approval.

  ## 3. The Rounds (45 Minutes Total)

  ### Round 1: Borda Count (15 Minutes)
  *   **The Rule:** 1st place = 2 pts, 2nd place = 1 pt, 3rd place = 0 pts. Highest total wins.
  *   **Action:** Students submit sealed rankings. You tally.
  *   **The Reveal:** Announce the winner. Ask: "Did anyone get their #1?"
  *   **The Twist:** Tell them: "You see the results. You have 2 minutes to confer in general, then you will vote again. You can change your ranking."
  *   **Expected Outcome:** Students who prefer *Books* might realize *Lounge* is their biggest threat. They might strategically rank *Lounge* last, even if they actually like it second, to boost *Books*.
  *   **Result:** The winner likely shifts from the honest outcome.

  ### Round 2: Condorcet Method (15 Minutes)
  *   **The Rule:** Pairwise comparison. (Lounge vs. Books), (Books vs. Speaker), (Speaker vs. Lounge). The option that beats all others in head-to-head matchups wins.
  *   **Action:** Submit sealed rankings again. You tally pairwise.
  *   **The Reveal:** With the preference distribution I suggested above (the 4-4-4 split), honest voting produces a **Cycle** (No winner).
  *   **The Twist:** "We have a tie/cycle. We need to break it. You can vote again, but remember, if you push too hard for your favorite, you might cause a cycle where your *least* favorite wins."
  *   **Expected Outcome:** Chaos. Some will try to vote strategically to break the cycle in their favor. Others will try to prevent their worst-case scenario.
  *   **Lesson:** Even a "fair" rule like Condorcet can fail to produce a result (domain restriction issue) or be manipulated by the order of voting (agenda setting).

  ### Round 3: Approval Voting (15 Minutes)
  *   **The Rule:** You can "Approve" as many options as you want. Most approvals wins. (This is not ordinal, so G-S doesn't strictly apply, which is the point).
  *   **Action:** Submit binary choices (Yes/No for each).
  *   **The Reveal:** Usually results in a compromise candidate (the one everyone tolerates).
  *   **Discussion:** "Did you have to lie here?"
  *   **Expected Outcome:** Students realize they have to draw a line. "Do I approve only my #1? Or my #1 and #2?" If they approve #1 and #2, they help #2 beat #1.
  *   **Lesson:** Changing the *type* of vote (domain) changes the strategy, but doesn't eliminate it.

  ## 4. The Debrief (25 Minutes)
  *Don't lecture. Ask questions and map their answers to the theorem.*

  **Q1: "In Round 1, who voted honestly the second time?"**
  *   *Likely:* Almost no hands.
  *   *Map to G-S:* This is **Strategy-Proofness**. A system is strategy-proof if you never benefit from lying. You just proved Borda is *not* strategy-proof.

  **Q2: "In Round 2, why didn't we get a winner?"**
  *   *Likely:* "Because we all wanted different things."
  *   *Map to G-S:* This touches on **Domain Restriction**. G-S assumes *any* preference order is possible. If we restricted preferences (e.g., everyone agrees Lounge is either best or worst, never middle—Single-Peakedness), Condorcet works. But we can't force that in real life.

  **Q3: "Could one person have dictated the outcome?"**
  *   *Likely:* "If 5 of us agreed, yes."
  *   *Map to G-S:* **Non-Dictatorship**. The theorem says the only way to guarantee strategy-proofness is if one person decides (Dictatorship). Since we aren't dictators, we are vulnerable.

  **Q4: "So what's the takeaway?"**
  *   *Goal:* "There is no perfect voting system. Every rule has a leak. Fixing one hole (like using Approval) just changes the game, it doesn't solve the math."

  ## 5. Facilitator Notes: Theory Clarification

  You mentioned being fuzzy on **Strategy-Proofness vs. Pareto Efficiency**. They are distinct, and mixing them up is common.

  *   **Pareto Efficiency:** If *everyone* prefers Option A over Option B, the system should not pick Option B. It's about collective welfare.
      *   *Example:* If 12/12 students want the Speaker, but the system picks the Lounge, it violates Pareto.
  *   **Strategy-Proofness:** No single voter can get a better outcome by lying about their preferences. It's about individual incentive.
      *   *Example:* I actually like Lounge > Books. But I vote Books > Lounge because I think that will help Lounge win. That's a strategy violation.

  **The G-S Theorem specifically targets Strategy-Proofness.** It says: "If you want a system where no one has an incentive to lie (Strategy-Proof), and you have 3+ options, the only way to do it is to let one person decide (Dictatorship)."
  *   *Note:* A system can be Pareto Efficient but Manipulable (Borda is usually Pareto Efficient, but easily manipulated).
  *   *Note:* A system can be Strategy-Proof but Pareto Inefficient (Random Dictator: Pick one student at random, do what they say. I can't manipulate it, but if that student is weird, we might pick an option everyone else hates).

  ## 6. Predictable Failure Modes & Salvage

  **Risk 1: The "Game Theorist" Dominates**
  *   *What happens:* One student (let's call him Alex) realizes the manipulation in Minute 3. He loudly tells everyone how to vote to maximize his candy. The rest of the class becomes NPCs (Non-Player Characters).
  *   *Salvage:* Don't shut Alex down; **use him**.
      *   *Say:* "Alex just found a loophole. That's exactly what Gibbard and Satterthwaite predicted. Now, rest of class: Alex is playing optimally. How do *you* counter-play? If you all vote honestly, Alex wins. What coalition do you need to form to stop him?"
      *   *Learning:* This shifts the lesson from "voting is broken" to "voting is a strategic game," which is the heart of social choice theory.

  **Risk 2: The "Nice Group" Problem**
  *   *What happens:* They are philosophy majors; they might value "honesty" over candy. They vote honestly every time. The theorem fails to land.
  *   *Salvage:* Ramp up the stakes.
      *   *Say:* "Okay, nobody is manipulating. That means the outcome is sub-optimal for 8 of you. I'm going to re-run Round 1. If the outcome is the same as the honest vote, nobody gets candy. You *must* find a strategic equilibrium to unlock the reward."
      *   *Alternatively:* Pre-brief one confederate (a TA or a student you know well) to manipulate aggressively in the first round to break the norm.

  **Risk 3: Calculation Bottleneck**
  *   *What happens:* You spend 20 minutes counting Condorcet pairs on the board. Energy dies.
  *   *Salvage:* **Prep the spreadsheet.** Have the 12 rows (students) and 3 columns (options). As they hand in slips, type the ranks in. Have the formulas ready to spit out the winner instantly. The speed keeps the tension high.

  ## 7. A Note on the "30 Points" Idea
  I strongly advise against using the "allocate 30 points" mechanic for Rounds 1 and 2.
  *   **Why:** Gibbard-Satterthwaite applies to **Ordinal** voting (Rank 1, 2, 3).
  *   **The Risk:** Point allocation is **Cardinal** voting (Utilitarian). In cardinal voting, "lying" is harder to define (is saying I value Lounge at 20 points instead of 15 a lie?).
  *   **The Fix:** Use Rankings (1st, 2nd, 3rd) for Borda and Condorcet. This keeps the math clean. You can use the "30 points" idea as a metaphor in the debrief ("Imagine your points are your intensity of feeling"), but don't make it the voting mechanism for the G-S rounds. Stick to Approval Voting for the third round if you want to show a different input style.

  Good luck. If Alex dominates the table, don't panic—that's the theorem working in real time. Just make sure the rest of the class knows *why* they lost.
