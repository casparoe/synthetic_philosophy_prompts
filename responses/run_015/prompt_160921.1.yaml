answer: |-
  # The Grid-World Causal Exclusion Tree

  **The Case:** An agent walks to the fountain. In Hardware 1, the variable `thirsty` is realized by Voltage V1. In Hardware 2, `thirsty` is realized by Voltage V2. The behavior tracks `thirsty`, not the specific voltage.
  **The Worry:** If the Voltage (Physical) was enough to make the agent walk, what work is left for `thirsty` (Mental) to do?

  ---

  ### **Q1: The Prediction Test**
  If you know the complete voltage state (V1) and the laws of physics, can you predict the agent will walk *without* knowing the variable `thirsty` is set?
  *   **NO:** The physical facts don't fix the outcome; the mental adds something new.
      *   ➔ **Emergentist / Dualist (Downward Causation)**
      *   *Awkward Commitment:* You must explain how a non-physical variable pushes physical electrons without violating conservation of energy.
  *   **YES:** The physical facts are sufficient. *(Go to Q2)*

  ### **Q2: The Identity Test**
  Is `thirsty` literally *nothing over and above* V1 (on this occasion), like "water" is nothing over and above H₂O?
  *   **YES:** Mental states are just physical states under a different name.
      *   ➔ **Reductionist / Type-Identity Theorist**
      *   *Awkward Commitment:* You must accept that `thirsty` on Hardware 2 (V2) is a completely different property than `thirsty` on Hardware 1, despite doing the same job.
  *   **NO:** `thirsty` is distinct from V1 (it can be realized by V2). *(Go to Q3)*

  ### **Q3: The Existence Test**
  If `thirsty` isn't V1, and V1 does all the physical work, does `thirsty` actually exist as a real property?
  *   **NO:** Talk of `thirsty` is just a useful fiction for predicting behavior.
      *   ➔ **Eliminativist**
      *   *Awkward Commitment:* You must deny that you yourself are thirsty, since you are also a physical system subject to exclusion.
  *   **YES:** `thirsty` is real and distinct. *(Go to Q4)*

  ### **Q4: The Exclusion Test**
  Since V1 was sufficient to cause the walking, did `thirsty` contribute any *additional* causal power?
  *   **NO:** `thirsty` exists, but it is a passenger; V1 does all the driving.
      *   ➔ **Epiphenomenalist**
      *   *Awkward Commitment:* You must accept that your belief you are typing this handout did not cause your fingers to move; only your neurons did.
  *   **YES:** `thirsty` is a genuine cause. *(Go to Q5)*

  ### **Q5: The Rescue Strategy (The Major Split)**
  How does `thirsty` cause the walk if V1 already did?
  *   **A. Metaphysical Rescue:** `thirsty` causes the walk *in virtue of* V1 causing it (it borrows the power).
      *   ➔ **Token-Identity / Causal Inheritance Theorist**
      *   *Awkward Commitment:* You must explain why `thirsty` gets credit for the cause if it contributes no power distinct from V1's.
  *   **B. Brute Rescue:** `thirsty` and V1 are two separate, sufficient causes for the same effect.
      *   ➔ **Overdeterminationist**
      *   *Awkward Commitment:* You must accept it is a massive coincidence that mental and physical causes always line up perfectly to produce the same action.
  *   **C. Causal Theory Rescue:** V1 isn't actually the *right kind* of cause for this effect description. *(Go to Q6)*

  ### **Q6: The Causal Theory Specifics**
  Why is V1 not the true cause of "walking to the fountain"?
  *   **A. Difference-Making:** If we intervene to change `thirsty` (via code), the walking changes; V1 is just the mechanism of intervention.
      *   ➔ **Interventionist / Difference-Making Compatibilist**
      *   *Awkward Commitment:* You must accept causation is about manipulability, not physical production, which complicates cases where we cannot intervene (e.g., cosmic events).
  *   **B. Proportionality:** V1 is too *specific* (it fixes the exact path/force); `thirsty` matches the *coarse* effect (going to the fountain).
      *   ➔ **Proportionality-Based Compatibilist**
      *   *Awkward Commitment:* You must explain why gerrymandered properties like `thirsty-or-it's-Tuesday` don't also count as causes if they match the effect's grain.

  ---

  ### **Notes for Students**

  **1. The "Grain" Intuition (Stress Test):**
  Many of you feel that if we describe the effect coarsely ("went to fountain"), the Voltage (V1) stops looking like the cause. This intuition leads directly to **Leaf 6B (Proportionality)**. However, be careful: this does not work for **Leaf 6A (Interventionism)**. An interventionist can say V1 causes the fine-grained motion *and* `thirsty` causes the coarse-grained motion without excluding either. Your intuition that physical causes "disappear" at coarse grains is specific to proportionality, not all causal theory rescues.

  **2. Indistinguishable Leaves:**
  **Leaf 6A (Interventionist)** and **Leaf 6B (Proportionality)** often yield the same verdicts in practice. The difference is theoretical: 6A focuses on *counterfactual dependence* (would the effect change if the cause changed?), while 6B focuses on *matching levels of detail* (is the cause too specific?). If you find yourself sliding between these two, you are in good company; many philosophers treat them as complementary.

  **3. The Real Fault Line:**
  Notice that **Leaf 5A** (Inheritance) and **Leaf 5C** (Causal Theory) are the two ways to be a Non-Reductive Physicalist.
  *   **5A** saves the mental by tying it tightly to the **metaphysics** of the physical (grounding/constitution).
  *   **5C** saves the mental by changing the **definition** of causation (intervention/proportionality).
  Most debates in modern philosophy of mind happen between these two branches, not between Physicalism and Dualism.
