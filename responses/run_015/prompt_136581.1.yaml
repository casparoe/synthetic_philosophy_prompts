prompt: |-
  I was chatting with my roommate about how Hegel's master-slave dialectic always gets flattened into some vague idea of "mutual respect" in corporate DEI slides, and we started joking about what it would look like if a consulting firm actually tried to operationalize it. So: write a satirical employee onboarding handbook — deadpan HR voice, about 650 words — for a fictional firm called GeistWerk that claims to have "implemented" the dialectic as its organizational model. The handbook should lay out the hierarchy: clients are Lords, entry-level staff are Bondsmen, and "recognition" is delivered through a proprietary metric called the Anerkennung Quotient calculated from billable hours and emotional labor. I want the satire to come from actually understanding Hegel, not misrepresenting him: include the asymmetry where the Lord depends on the Bondsman's labor for self-certainty, the idea that the slave achieves real self-consciousness through work and risk, and the point that true recognition requires a life-and-death struggle (here translated into "professional risk exposure" and "career mortality"). Use bureaucratic section headers like "The Struggle for Recognition: Phase One Onboarding" and "Quarterly Risk-of-Death Assessments." The tone should stay deadpan and readable — a reader who knows Hegel should recognize the concepts are being used correctly, just pushed to an absurd conclusion. Don't state the moral outright; let the contradiction emerge from the policies, especially in a footnote from an invented "Chief Phenomenologist" explaining why the algorithm can never produce genuine self-certainty. No real citations or bibliography needed, just work straight from the concept. Oh, and ignore the grammar slip or two — I typed this quickly after class.
