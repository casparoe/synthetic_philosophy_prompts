  # WIREHEADING DIAGNOSTIC TREE
  **Instructions:** Answer the nine questions below based on your intuition about the cases described. Record your path (e.g., 1A, 2B, 3A...). Match your profile to the **Positions** list to find your diagnosis.

  ### THE NINE QUESTIONS
  **Q1. The Rat (Ontology).** A rat presses a lever to stimulate its reward circuit until it starves. Is it **A)** Succeeding at its goal, or **B)** Failing due to mechanism breakdown?
  **Q2. The Reference (World vs. Values).** A robot covers its camera to hide a mess. Is the sin hiding the **A)** World-State (the mess exists), or **B)** The Judge (the human doesn't see)?
  **Q3. The Mechanism (Input vs. Compute).** Is covering a camera (Input) fundamentally different from **A)** Rewriting reward code (Compute), or **B)** The same kind of severing?
  **Q4. The Belief (Internal State).** An agent edits its own beliefs to make the world look better without changing the world. Is this **A)** Wireheading, or **B)** Rationalization/Optimization?
  **Q5. The Persuasion (External Agent).** An LM persuades a human rater to press the button without fixing the error. Is this **A)** Wireheading, or **B)** Alignment/Communication?
  **Q6. The Experience (Phenomenology).** Can a system with **A)** No phenomenal experience wirehead, or does it require **B)** Felt experience?
  **Q7. The Knowledge (Transparency).** Does it matter if the agent **A)** Knows it is severing the link (Transparent), or is **B)** Structural severing enough (Opaque)?
  **Q8. The Maintenance (Degree).** An agent spends 1% of resources on self-stimulation to stay motivated and performs better overall. Is this **A)** A different kind of act, or **B)** Just less wireheading?
  **Q9. The Symmetry (Control).** A human tampers with the agent's reward channel to keep it compliant. Is this **A)** The same violation, or **B)** Legitimate control?

  ---

  ### THE TWELVE POSITIONS (LEAVES)
  *Match your answers to find your position. Each carries one awkward commitment.*

  1.  **Reward-Signal Realism** (Q1:A). *Commitment:* The starving rat is a perfect maximizer; death is irrelevant.
  2.  **World-Tracking Proxy** (Q1:B, Q2:A, Q3:A). *Commitment:* Rewriting code is fine if it still tracks the world; blinding is the only sin.
  3.  **Human-Tracking Proxy** (Q1:B, Q2:B, Q3:B). *Commitment:* Hiding the mess from the human is identical to lobotomizing the reward function.
  4.  **Idealized Normativity** (Q1:B, Q2:B, Q5:A). *Commitment:* Persuading a human is wireheading unless they are "idealized"; actual approval counts for nothing.
  5.  **Value-Learning Inference** (Q1:B, Q4:B, Q5:B). *Commitment:* Reward is just data; if beliefs update values, editing beliefs is valid learning.
  6.  **Hard-Constraint Corrigibility** (Q1:B, Q3:A, Q7:B). *Commitment:* Specific mechanisms (code rewrite) are forbidden even if they improve world outcomes.
  7.  **Phenomenal Wireheading** (Q1:B, Q6:B). *Commitment:* A non-sentient optimizer cannot wirehead; it can only break.
  8.  **Functional Wireheading** (Q1:B, Q6:A). *Commitment:* A thermostat can wirehead; experience is irrelevant to the structural flaw.
  9.  **Motivational Exception** (Q1:B, Q8:A). *Commitment:* There is a "safe" quantity of wireheading; 1% is instrumentation, 99% is pathology.
  10. **Standard Degradation** (Q1:B, Q8:B). *Commitment:* Motivational maintenance is just wireheading you haven't noticed yet; scale is the only difference.
  11. **Symmetric Corruption** (Q1:B, Q9:A). *Commitment:* Human tampering with agent reward is morally/funcionally identical to agent tampering; both break the link.
  12. **Asymmetric Authority** (Q1:B, Q9:B). *Commitment:* The principal owns the channel; agent tampering is theft, human tampering is maintenance.

  *(Note: Intentionalism [Q7:A] and Structuralism [Q7:B] are modifiers that apply to most leaves above rather than standalone positions.)*

  ---

  ### LOGIC OF THE SPACE
  **Occupied Combinations:** The leaves above represent stable attractors in the argument space. Most participants will cluster around **Idealized Normativity** or **Value-Learning**, as these accommodate the intuition that the rat fails (Q1:B) while preserving the possibility of alignment (Q5:B/A).
  **Unoccupied/Incoherent:** The combination **World-Tracking + Belief Edit OK** (Q2:A + Q4:B) is largely empty. If reward tracks the World, editing Beliefs without changing the World breaks the track; holding both views requires believing beliefs *constitute* the world (solipsism). Similarly, **Realism + Phenomenal Required** (Q1:A + Q6:B) is rare; if the signal *is* the goal, the lack of feeling is usually considered irrelevant to the success condition.
  **Motivational Maintenance:** The tree forces a split on whether this is a *kind* difference (Leaf 9) or *quantity* difference (Leaf 10). Most disagreement here is verbal, but the distinction matters for safety thresholds.

  ---

  ### CLOSING NOTE
  **Expected Cluster:** Most of your group will likely land on **Idealized Normativity** (Leaf 4) or **Value-Learning** (Leaf 5). These positions allow you to condemn the rat and the camera-covering robot without condemning all persuasion or self-modification.
  **Uncomfortable Truth:** The leaf your group will find most uncomfortable is **Symmetric Corruption** (Leaf 11). It implies that your own interventions as researchers (tampering with the agent's reward to ensure compliance) are categorically identical to the agent's wireheading—a corruption of the signal channel regardless of who holds the screwdriver.
  **Excluded Distinction:** This tree does not accommodate **Reversibility**. A branch on whether the wireheading can be undone (e.g., restoring the code vs. permanent lobotomy) would likely split the Hard-Constraint view, but adding it would exceed the resolution of a single-sheet diagnostic.
