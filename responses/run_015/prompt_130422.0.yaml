  You say the friend is loved for safety's sake,
  And beauty serves but to delight the sense.
  That pleasure is the end we must partake,
  And without joy, no value could commence.
  Thus every good is but a means we take,
  To gain some comfort or some consequence.
  No essence in the bond itself we make,
  But in the pleasure's mere occurrence.

  But here the blade of analysis goes wide,
  For value dwells within the complex whole.
  No sum equals the parts where they abide,
  Though reason seeks it in the part defined.
  When consciousness and beauty reach their goal,
  Is it real excess, or where our logic bides?
