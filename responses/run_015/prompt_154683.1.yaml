answer: |-
  **MEMORANDUM**

  **TO:** Evidence Review Board, Consortium for Confirmatory Behavioral Science
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Weight–Seriousness Effect (Case #2023-WS)

  I recommend we mark the weight–seriousness finding *indeterminate* in the Ledger, notifying the replication team that their protocol was sound and the original authors that they have fourteen days to submit a refined mechanism profile. This memo outlines the structural rules governing that decision and our future adjudications.

  We are not voting on whether heavy clipboards make candidates seem serious; we are voting on whether a null result counts as a failure of the finding or a failure of the test. The original authors argue the replication engaged a different mechanism (discomfort rather than incidental importance) because the stimulus magnitude exceeded a threshold. To resolve this without collapsing into endless theoretical debate, we must codify how mechanism identity is established. Our colleague's proposal offers a robust framework, but it requires amendment to accommodate the reality of mechanistic discovery.

  I propose we adopt the following General Rule for Mechanism Identity. First, we adopt the condition that a result counts as an anomaly for a mechanism claim only if the mechanism's own description predicts that result's absence or its opposite. Second, we adopt the requirement that every confirmatory protocol declare in advance an *invariance class*—the range of procedural variation in stimulus magnitude, modality, population, setting, and dependent measure that the claimants take to be mechanism-preserving. Third, we adopt the prohibition on "anomaly laundering": a "different mechanism" reply raised after the fact, where the two mechanisms were never given intervention profiles that would separate them, must be treated as invalid.

  However, I propose we amend the second condition regarding the *invariance class*. The proposal suggests these classes are fixed at pre-registration. I argue they must be open to refinement if the claimant provides new constitutive evidence—such as the neural data in this case—that justifies narrowing the class. Without this amendment, we risk freezing mechanism descriptions at their naivest stage. With it, we allow theoretical progress while maintaining that the burden of proof for redefining the mechanism lies with the claimant. We are voting on whether to adopt this rule with the specified amendment regarding invariance class refinement.

  Regarding the neural site, we must apply the interventionist view on which most of us were trained. A component is constitutively part of a mechanism only if intervening on it changes the mechanism's output and intervening on the output changes it. In this case, we have a positive signal at the neural level but a null at the behavioral level. This does not constitute partial replication. Under an interventionist account, if the neural activity were constitutive of the behavioral output, the presence of the neural signature should correlate with the behavioral effect. The dissociation suggests that either the neural signature was not doing the work the original authors thought, or the mechanism was engaged but its output pathway was blocked by the excessive weight (the discomfort mechanism).

  Consequently, the neural data does not rescue the behavioral finding for the purposes of the Ledger. The Consortium funds follow-up work based on behavioral reliability. A neural signature without behavioral output indicates the mechanism is not successfully translating to the phenomenon we intend to study. Therefore, the neural evidence supports the original authors' claim that *a* mechanism was engaged, but it supports the replicators' claim that the *behavioral* finding is not robust under these conditions. This reinforces the *indeterminate* marking: the mechanism may exist, but the behavioral finding is not yet confirmed.

  I must address the strongest consideration on the losing side, which is the argument that mechanisms are discovered rather than stipulated. The bite of this argument is that pre-declared invariance classes threaten to punish exactly the post-hoc insight that tells us a manipulation was doing something other than we assumed. If we enforce a strict rule that any deviation from the original protocol counts as a failure, we hand victories to replicators by definitional fiat and drive original authors out of the Consortium's process. Science often proceeds by realizing that a manipulation was too strong, too weak, or contextually bound only after seeing the data.

  My recommendation absorbs this concern through the amendment to the invariance class rule. We do not forbid refinement; we forbid unearned refinement. An author may narrow their invariance class post-hoc, but only if they provide independent evidence (like the neural signature) that distinguishes the mechanisms. This preserves the ability to discover mechanism boundaries without allowing authors to move goalposts simply because a replication failed. We protect insight while penalizing laziness.

  Finally, we must address the transition provision. The weight–seriousness protocol long predates any declaration requirement, and several hundred legacy findings in the Ledger rest on equally undeclared mechanism descriptions. We cannot apply the new invariance class requirement retroactively to mark these findings *failed* immediately, as that would invalidate years of research based on rules that did not exist at the time. However, we cannot leave them untouched, or the new rule creates a two-tier system of evidence.

  I propose we mark all legacy findings lacking a declared invariance class as *indeterminate* effective immediately. We will open a three-year window during which the original authors of these legacy findings may submit a retrospective invariance class and mechanism profile. If they fail to do so, or if the profile is deemed too narrow to be useful, the finding will be marked *failed* for the purposes of Consortium funding eligibility. This gives original authors a fair opportunity to codify their claims while ensuring the Ledger eventually reflects our standards of mechanistic clarity.

  This approach balances the need for rigor with the reality of scientific practice. It acknowledges the replication team's rigorous execution while granting the original authors a pathway to validate their mechanistic distinction, provided they meet the burden of proof. It protects the Consortium from funding dead ends while avoiding the stifling of genuine theoretical refinement.

  Please review this proposal before our vote in eleven days. I am available to discuss the specifics of the invariance class amendment or the transition timeline should you have concerns.

  **Recommendation:** Vote to adopt the General Rule for Mechanism Identity with the amendment allowing invariance class refinement upon presentation of new constitutive evidence; vote to mark Case #2023-WS as *indeterminate*; vote to apply the three-year transition provision to legacy findings.
