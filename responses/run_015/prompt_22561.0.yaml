answer: |-
  This is a pivotal distinction for any work on speaker meaning, and the tension you identify regarding the *mechanism of recovery* is precisely where the contemporary literature (e.g., Potts, Bach, Horn) has diverged from Grice's original formulation. For a PhD-level analysis, it is crucial to move beyond the textbook definitions and examine the cognitive and semantic architecture underpinning the recovery process.

  Below is a comparison of Conversational Implicature (CI) and Conventional Implicature (ConI) structured around your four criteria, followed by an analysis of the ontological status of ConI and the requested illustrative example.

  ### 1. Mechanism of Recovery: A Comparative Analysis

  #### (i) The Source of the Inference
  *   **Conversational Implicature:** The source is **pragmatic reasoning**. The hearer recovers the content via a "working-out" procedure. The hearer observes that the speaker has ostensibly violated a maxim (or appears to), assumes the speaker is nonetheless adhering to the Cooperative Principle (CP), and calculates what proposition would render the utterance cooperative in that specific context. The content is not encoded; it is generated.
  *   **Conventional Implicature:** The source is **lexical decoding**. There is no "working-out" in the Gricean sense. The content is triggered by specific lexical items (e.g., *but, therefore, even, manage to*). The mechanism is not a pragmatic calculation based on the CP, but a semantic rule associated with the expression. The hearer recovers the content simply by knowing the language, independent of specific contextual assumptions about the speaker's cooperativeness.

  #### (ii) The Role of Mutual Knowledge or Convention
  *   **Conversational Implicature:** Relies on **mutual knowledge of the context and the CP**. The inference is dynamic. It requires the hearer to recognize the speaker's intention to communicate something *beyond* the literal meaning, grounded in the shared assumption that both parties are engaged in a cooperative exchange. If the context changes, the implicature changes (e.g., "It's cold in here" implies *close the window* in one context, *let's leave* in another).
  *   **Conventional Implicature:** Relies on **shared linguistic competence**. The "convention" here is not a social norm of conversation (like the CP) but a linguistic convention (semantic entry). It is static. The contrastive meaning of *but* is available to any competent speaker of English regardless of the specific conversational context or the specific intentions of the speaker regarding the Cooperative Principle.

  #### (iii) The Status of Cancellation (Defeasibility)
  *   **Conversational Implicature:** **Defeasible (Cancelable).** Because CIs are derived from context and assumptions that can be overridden, they can be explicitly cancelled without contradiction.
      *   *Example:* "Some of the students passed. In fact, all of them did." (Cancels the scalar implicature that *not all* passed).
      *   The utterance remains felicitous because the cancellation merely corrects a pragmatic presumption.
  *   **Conventional Implicature:** **Non-defeasible (Non-cancelable).** Because the content is attached to the conventional meaning of the word, attempting to cancel it results in **pragmatic infelicity** (or semantic anomaly), though not necessarily logical falsity. You cannot use the word and deny its conventional contribution simultaneously without creating a Moore-paradoxical or incoherent effect.

  #### (iv) Relation to Grice's Intention-Based Account of Speaker Meaning
  *   **Conversational Implicature:** This is the **paradigm case of non-natural meaning (meaning$_{nn}$)**. It fits Grice's analysis perfectly: The speaker means$_{nn}$ something by uttering $x$ if they intend the utterance to produce an effect in the hearer primarily by means of the recognition of this intention. The CI *is* the content intended to be recovered via intention recognition.
  *   **Conventional Implicature:** This presents a **problem for the intention-based model**. While the speaker certainly intends to convey the content, the *recovery* of that content does not depend on the recognition of that specific intention; it depends on linguistic decoding. If I say "He is poor but honest," you grasp the contrast even if you think I am lying or being uncooperative, provided you know English. Therefore, ConI is often viewed as falling outside the strict bounds of meaning$_{nn}$, residing instead in the domain of semantic competence.

  ---

  ### 2. The Ontological Status of Conventional Implicature

  You asked whether ConI is best understood as (a) a kind of speaker meaning, (b) a separate dimension of content, or (c) a constraint on interpretation.

  **Recommendation:** For your paper, the most robust position is **(b) a separate dimension of content** (often termed "not-at-issue" content).

  **Argumentation:**
  1.  **Against Speaker Meaning:** If ConI were purely speaker meaning (in the Gricean sense), it should be cancelable. As noted above, it resists cancellation. Furthermore, Grice's intention-based model requires that the meaning be *intended* for the specific occasion. ConI is "pre-packaged" by the language. While the speaker intends to use the word, the *content* of the implicature comes from the language, not the speaker's reflexive intentions.
  2.  **Against Mere Constraint:** Viewing it merely as a constraint on how the main proposition is processed underestimates its contribution to truth conditions (or rather, the conditions of appropriate use). It adds content to the utterance, not just a processing instruction.
  3.  **For Separate Dimension:** Contemporary semantics (most notably Christopher Potts in *The Logic of Conventional Implicatures*) argues that ConI constitutes a distinct dimension of meaning. It is **commitment-based** rather than truth-conditional. When a speaker uses a ConI trigger, they express a commitment to the implicated content, but this content does not affect the truth value of the main proposition (the "at-issue" content).
      *   *Truth-Conditional:* "He is poor and honest." (True if both predicates hold).
      *   *ConI:* "He is poor but honest." (True if both predicates hold, *but* the utterance is inappropriate if there is no contrast).

  This multidimensional view preserves Grice's insight that ConI is not part of the "truth conditions" (in the narrow sense) while acknowledging that it is not pragmatic speaker meaning either. It is **semantic but non-truth-conditional**.

  ---

  ### 3. Illustrative Example: "But" and Cancellation

  To illustrate the resistance to cancellation and the distinction between infelicity and falsity, consider the following pair.

  **The Utterance:**
  > "John is a millionaire, but he is happy."

  **The Conventional Implicature:**
  There is a contrast between being a millionaire and being happy (typically, millionaires are not expected to be happy, or wealth is thought to preclude happiness).

  **The Cancellation Attempt:**
  > "John is a millionaire, but he is happy, #and I don't mean to suggest there is any contrast between being a millionaire and being happy."

  **Analysis:**
  1.  **Truth Conditions:** The truth of the proposition "John is a millionaire and John is happy" is unaffected by the presence of *but*. If John is a happy millionaire, the core assertion is true.
  2.  **Infelicity vs. Falsity:** The cancellation attempt (marked by #) does not make the sentence *false* in the logical sense. It makes the utterance **infelicitous** (pragmatically defective). It sounds like a misuse of the language.
      *   If I say, "It is raining but I don't mean to imply a contrast," the hearer is justified in responding, "Then why did you use 'but'?"
      *   Compare this to a CI cancellation: "Some students passed, and I don't mean to imply not all did." This is perfectly coherent.
  3.  **Mechanism Implication:** The infelicity arises because the contrastive meaning is **encoded**. By selecting *but* instead of *and*, the speaker has already semantically committed to the contrast. To cancel it is to contradict the semantic rules of the language one is employing.

  ### Summary for Your Paper

  In your discussion of speaker meaning, you can argue that Grice's category of "Conventional Implicature" is something of a misnomer. It is not an *implicature* in the sense of being an inference derived from the maxims (pragmatic), nor is it fully *speaker meaning* in the sense of being constituted by reflexive intentions.

  It is best characterized as **encoded, non-truth-conditional content**. The mechanism of recovery is **decoding**, not inference. Consequently, while CIs are central to Grice's theory of *communication* (as acts of meaning$_{nn}$), ConIs are central to a theory of *linguistic competence*. They represent a layer of meaning that is conventional and semantic, yet distinct from the truth-conditional content of the proposition expressed. This distinction allows you to preserve the intention-based account for conversational implicature while accommodating the rigidity of conventional markers like *but* without forcing them into the pragmatic box where they do not fit.
