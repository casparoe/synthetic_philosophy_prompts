  You're right, he's wrong. The bet is rotten, but not primarily for the philosophical reasons you're worrying about. It's rotten because the settlement terms are asymmetric.

  If the program stops, your mate collects his £50. If it never stops, you can never definitively prove it to collect yours. You'd be waiting until the heat death of the universe. A bet where one side can win and get paid, while the other can win and never get paid, isn't a bet; it's a donation.

  His '50/50' claim is also statistical nonsense. Two possible outcomes don't mean equal probability. That's like saying there's a 50% chance you'll be hit by a meteor today because either you will or you won't.

  On the philosophy: He's right that classical logic treats truth as independent of knowledge. 'P or not P' holds even if we're clueless. But Intuitionists disagree—they argue truth *is* knowability. For your bet, though, the distinction is practical: you need verification to exchange cash. Whether truth exists metaphysically doesn't help you collect £50. He's also correct that some programs are undecidable within standard axioms, but physically, on your machine, it either halts or loops. We just might never know which.

  To fix it: Set a deadline. 'If it stops by 1st January 2030, I win. If it's still running then, you win.' Now both sides can collect. Or bet on proof: 'Whoever produces a valid proof of halting or non-halting within five years takes the pot.' But beware: if it's undecidable, nobody wins. Stick to the deadline.

  Keep your £50.
