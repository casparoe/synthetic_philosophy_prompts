  The paradox arises because (4) incorrectly treats the *source* of evidence as the only valid trigger for revision, ignoring that evidence against a necessary consequence is logically equivalent to evidence against the premise. If an agent justifiably believes $p$ and knows $p$ entails $q$, encountering strong evidence for $\neg q$ creates a defeater for $p$ regardless of whether that evidence "specifically targets" $p$ in the agent's psychological inventory. Rational coherence requires that justification be sensitive to the truth of its consequences; preserving (4) severs this link, granting the agent a license to ignore counterexamples simply because they appear downstream in a deduction.

  The cost of abandoning inertia is not the unmanageable holism you fear, where every belief is undermined by distant cosmological data, because evidential relevance is graded rather than binary. In a probabilistic framework, the weight of counterevidence against a remote entailment decays as the logical distance and complexity of the derivation increase, preventing trivial revisions while still permitting revision when the counterevidence is sufficiently strong. This preserves the unity of reason provided by closure (1) without granting beliefs the structural immunity that defines dogmatism.
