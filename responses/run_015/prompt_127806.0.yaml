prompt: |-
  I've got a view about everyday conventions that I keep defending at meetups, and I want to know how exposed it actually is before I build more on top of it. Rough version: conventions like queue order, tip rates, whether you wait for the walk signal, which side you stand on an escalator, generate real moral obligations for visitors to a place — not just prudential reasons or etiquette. But the content of the obligation is fixed by local expectations, not by what the convention is nominally for, and what you owe is *conspicuous* compliance: you have to be seen going along, because the thing noncompliance damages is the shared expectation itself, not any particular persons interests. I basically think of conventions as Schelling points with normative glue smeared on them. Call it the expectation-maintenance account. There's one bit I especially like: locals are permitted to break their own convention (they've got standing to renegotiate it) while visitors aren't — call that the guests license asymmetry or whatever.

  So what would count against this? Skip the obvious stuff — "cultural relativism," "who says you have to follow local norms" — I can field that. What I want is a map of where the view is actually at risk:

  - The case it can't describe, or describes badly. I'm most worried about the invisible tourist: crossing against the light at 4am with nobody around, or skipping a tip at a place you'll never return to where nobody compares notes. My account seems to say there's no duty, since no expectation gets damaged. If that's actually fine, say why; if it's a reductio, walk me there.
  - The collapse risks, both directions. Where does this stop being moral philosophy and become "don't be rude to the locals" with extra steps? And where does it stop being a story about conventions and turn out to be an instance of a general duty not to free-ride on a cooperative scheme? Which collapse is more likely, and which feature of a case decides it.
  - A discriminating case: something my view predicts that the plain free-riding account doesn't, or vice versa, with an honest note about which way I'd have to find my intuitions going for it to count against me.
  - The awkward-but-not-fatal stuff, ranked separately: conventions that are themselves bad (a norm of paying off officials, a norm about who gets served first), visitor-only conventions (a queue at a tourist site with no locals in it), conventions in flux (a place where half the locals have stopped tipping), and the "opting out by announcement" move — if I loudly announce I'm not playing, have I discharged the duty?
  - What a defender would concede rather than fight. If I concede as much as I probably should, does anything interesting survive?
  - And whether I've insulated it. When I get pushed I start saying the duty is only pro tanto and the relevant expectation is that of a reasonable local, and I want to know if that's legitimate specification or whether I've qualified the thing into having no risk at all.

  The thing that would actually move me: an argument that expectation-maintenance can't distinguish being morally required from being strongly expected without secretly importing a harm or unfairness premise that's doing all the real work. If that lands I'd probably drop the view, so tell me how close such an argument is to succeeding. Rank everything fatal down to merely embarrassing, and if there's a real-world pattern you think already counts either way, describe the shape of it — I don't want dates or studies, just the shape. Be straight with me if the honest answer is that the view is well insulated and that this is okay because it's mostly a claim about what we owe strangers in shared spaces rather than an empirical claim.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core View:** "Expectation-Maintenance Account" (EMA) of conventions.
          *   Conventions (queues, tips, signals) generate *moral obligations* for visitors.
          *   Content fixed by local expectations, not nominal purpose.
          *   Duty is *conspicuous compliance* (must be seen complying) to maintain shared expectations.
          *   Asymmetry: Locals can break/renegotiate; visitors cannot ("Guest's License Asymmetry").
          *   Metaphor: Schelling points with normative glue.
      *   **Goal:** Stress-test the view. Find where it's exposed, not just generic objections.
      *   **Specific Requests:**
          1.  *The Invisible Tourist Case:* 4am crossing, one-off tipping. Is "no duty" a reductio or fine?
          2.  *Collapse Risks:* Trivial etiquette vs. General Free-Riding. Which is more likely?
          3.  *Discriminating Case:* A scenario where EMA diverges from Free-Riding accounts.
          4.  *Awkward-but-not-Fatal:* Bad norms, visitor-only norms, flux norms, opting out by announcement.
          5.  *Concessions:* What would a defender concede? Does anything survive?
          6.  *Insulation Check:* Are "pro tanto" and "reasonable local" qualifiers legitimate or ad hoc?
          7.  *The Killer Argument:* Can EMA distinguish "morally required" from "strongly expected" without smuggling in harm/unfairness?
      *   **Tone:** Straight, philosophical, rigorous, ranking risks (fatal to embarrassing).
      *   **Constraint:** No dates/studies, just the "shape" of patterns.

  2.  **Deconstruct the Core View (EMA):**
      *   *Premise 1:* Conventions create moral obligations (not just prudence/etiquette).
      *   *Premise 2:* The obligation is to maintain the *expectation* of compliance.
      *   *Premise 3:* Therefore, compliance must be *conspicuous*.
      *   *Premise 4:* Locals have standing to change norms; visitors do not.
      *   *Mechanism:* Violation damages the *shared expectation*, not specific interests.

  3.  **Address Point 1: The Invisible Tourist (The 4am Crossing):**
      *   *The Problem:* If no one sees you, no expectation is damaged (on the surface). So EMA says no duty.
      *   *Analysis:* Is this a bug or a feature?
      *   *Counter:* Expectations aren't just about *this* act being seen; they are about the *probability* of detection and the *general* reliability of the system. If everyone thought "I can break it when invisible," the expectation collapses.
      *   *Risk:* If the user insists *actual* visibility is required, it's fatal. If they shift to "generalizability of the maxim," they slide into Kantianism/Rule Utilitarianism.
      *   *Verdict:* High risk. It exposes the tension between "conspicuous compliance" and "internalized norm."

  4.  **Address Point 2: Collapse Risks:**
      *   *Direction A (Triviality):* Becomes "don't be rude."
          *   *Risk:* If the "moral" weight is just social friction, it's not moral.
          *   *Defense:* The damage is to social coordination infrastructure.
      *   *Direction B (Free-Riding):* Becomes standard Fair Play theory (Hart/Rawls).
          *   *Risk:* EMA claims the harm is to *expectations*, not benefits received. Free-riding says you take benefits without paying.
          *   *Differentiation:* EMA applies even if *you* don't benefit (e.g., standing on the right on an escalator when you have no luggage). Free-riding usually requires benefit receipt.
      *   *Verdict:* Collapse into Free-Riding is the bigger philosophical risk because it's a more robust existing theory. EMA needs to prove "expectation maintenance" is distinct from "fair play."

  5.  **Address Point 3: Discriminating Case:**
      *   *Scenario:* A convention that *nobody* follows anymore but is still "on the books" (Zombie Norm).
      *   *Free-Riding:* No duty (no cooperative scheme functioning).
      *   *EMA:* Duty exists if the *expectation* of compliance exists (even if compliance is low). Wait, if compliance is low, expectation is low.
      *   *Better Scenario:* **The "Signal Without Substance" Case.**
          *   *Case:* Tipping in a country where servers are paid living wages (no economic need), but tipping is expected as a signal of respect.
          *   *Free-Riding:* Weak duty (no economic benefit gained by server that they wouldn't get otherwise).
          *   *EMA:* Strong duty (failing to tip signals disrespect/disruption of the social script, damaging the expectation of mutual recognition).
      *   *Intuition Check:* If the user feels the duty is weak here, EMA is in trouble. If strong, EMA holds.

  6.  **Address Point 4: Awkward-but-not-Fatal:**
      *   *Bad Norms:* Paying bribes. EMA says duty to comply? *Fix:* Pro tanto duty overridden by higher moral laws. (Standard move).
      *   *Visitor-Only:* Queue at a tourist trap. Locals aren't there. *Fix:* The "locals" are the other visitors forming a temporary community.
      *   *Flux:* Half tip, half don't. *Fix:* Duty is to align with the *emerging* norm or the *reasonable expectation* of the majority.
      *   *Opting Out by Announcement:* "I'm not tipping." *Fix:* No, because the damage is to the *general* expectation, not just transactional honesty. Announcement doesn't fix the precedent set for observers.
      *   *Ranking:* Bad Norms (easy fix), Flux (medium), Announcement (harder), Visitor-Only (conceptual stretch).

  7.  **Address Point 5: Concessions:**
      *   Defender concedes: It's not *always* moral, sometimes just etiquette. It's pro tanto.
      *   *Survival:* The core insight remains: *Visibility matters.* The duty is to the *signaling system*, not the outcome. This survives if the "conspicuous" element is retained.

  8.  **Address Point 6: Insulation (Pro Tanto / Reasonable Local):**
      *   *Risk:* "Reasonable local" is a black box. If it means "morally reasonable," the view collapses into standard morality. If it means "statistically average," it's descriptive, not normative.
      *   *Verdict:* This is a significant vulnerability. It risks becoming a tautology ("You must do what you ought to do").

  9.  **Address Point 7: The Killer Argument (Moral vs. Expected):**
      *   *The Charge:* EMA says "You must do X because people expect X." Why is that *moral*?
      *   *The Smuggle:* To make it moral, you need to say "Disappointing expectations is *harmful*" or "Unfair."
      *   *If Harm:* Then it's consequentialism.
      *   *If Unfair:* Then it's Fair Play/Free-Riding.
      *   *If Neither:* It's just social pressure (etiquette).
      *   *Conclusion:* This is the strongest attack. EMA struggles to ground the *normativity* without borrowing from Harm or Fairness.

  10. **Synthesizing and Ranking:**
      *   *Fatal:* The "Moral vs. Expected" gap (Point 7). The "Invisible Tourist" (Point 1) if strictly interpreted.
      *   *High Risk:* Collapse into Free-Riding (Point 2). The "Reasonable Local" qualifier (Point 6).
      *   *Medium:* Discriminating cases (Point 3).
      *   *Low:* Awkward cases (Point 4) - these are solvable with standard deontic tools.

  11. **Drafting the Response:**
      *   Adopt the user's tone (philosophical, direct, no fluff).
      *   Structure by their bullet points.
      *   Ensure the "Killer Argument" gets the weight it deserves.
      *   Check the "Invisible Tourist" logic carefully (Rule vs. Act).
      *   Refine the "Discriminating Case" to be sharp.

      *(Self-Correction during drafting)*: On the Invisible Tourist: The user says "conspicuous compliance." If I cross at 4am alone, I am not conspicuously complying. Does EMA say I *should* wait? If EMA says "No duty," that feels wrong (law is still law). If EMA says "Duty exists," then "conspicuous" is the wrong word. It should be "compliance that *would be* conspicuous if observed" or "compliance that supports the general rule of visibility." I need to point out this tension.

      *(Refining the Killer Argument)*: The distinction between "Social Obligation" and "Moral Obligation" is the crux. If the only reason to follow is to keep the expectation alive, why is that *moral*? Usually, morality protects interests. If no interest is protected (as user admits: "not any particular persons interests"), then it's a morality of *forms*, not *substance*. This is vulnerable to the "Why care about forms?" objection.

      *(Refining the Collapse)*: The "Guest's License Asymmetry" is the most unique feature. I need to make sure I evaluate that specifically. It relies on a distinction between "making the norm" and "using the norm."

      *(Final Polish)*: Ensure I rank the risks as requested. Fatal -> Embarrassing.

  12. **Final Review against constraints:**
      *   No dates/studies.
      *   Straight talk.
      *   Address all 6 specific points + the "Killer Argument".
      *   Rank risks.

      *Let's build the response.*
answer: |-
  This is a sharp, structurally interesting view. It treats conventions as public goods (the stability of the expectation itself) rather than private bargains. The "Guest's License Asymmetry" is the most novel feature; the "conspicuous compliance" clause is the most vulnerable.

  Here is the stress test, ranked from fatal vulnerabilities to merely embarrassing complications.

  ### 1. The Killer Argument: The Normativity Gap
  **Rank: Fatal / Near-Fatal**

  You asked for the argument that expectation-maintenance can't distinguish "morally required" from "strongly expected" without smuggling in harm or unfairness. Here is the shape of that attack:

  **The Charge:** Your account identifies the *mechanism* of the obligation (maintaining expectations) but fails to identify the *source* of the normativity (why we care about expectations).
  *   **Option A (Harm):** If you say we must maintain expectations because their collapse causes chaos/inconvenience, you are a rule-consequentialist. The "moral glue" is just aggregated prudential harm.
  *   **Option B (Fairness):** If you say we must maintain expectations because it's unfair to benefit from the order others create without contributing, you are a Fair Play theorist (Hart/Rawls).
  *   **Option C (Brute Fact):** If you say "expectations create obligations *just because*," you are positing a moral magic that many meta-ethicists reject. Why does a stranger's psychological state (their expectation) generate a duty for me?

  **The Trap:** You explicitly state noncompliance damages "not any particular persons interests." If no interest is set back, and no unfair advantage is taken (see the Invisible Tourist below), what is the *moral* wrong? It looks like you have described *social pressure* perfectly, but labeled it *morality*. To save it, you must argue that the *integrity of the signaling system* is itself a moral good independent of its utility. That is a hard sell.

  ### 2. The Invisible Tourist (The 4am Crossing)
  **Rank: High Risk**

  **The Case:** You cross against the light at 4am. No cars, no witnesses.
  **Your View's Prediction:** If the duty is *conspicuous compliance*, and no one sees you, you haven't violated the duty to maintain shared expectations.
  **The Problem:** This implies there is no moral reason to wait. Most intuitions suggest the law/norm still binds.
  **The Fix (and its cost):** To fix this, you must shift from "conspicuous compliance" to "compliance with a rule that requires conspicuousness." i.e., "One must act *as if* one were being watched."
  **The Risk:** Once you make that shift, the "conspicuous" part drops out of the *act* and moves to the *rule*. You are no longer defending "conspicuous compliance"; you are defending a general duty to follow local norms, where conspicuousness is just a heuristic for when the norm applies. This weakens your unique contribution. If you stick to your guns and say "No duty at 4am," you face the reductio that your morality is purely performative.

  ### 3. Collapse Risks: Free-Riding vs. Etiquette
  **Rank: High Risk (Direction: Free-Riding)**

  You worry about collapsing into "don't be rude." The bigger risk is collapsing into **Fair Play Theory**.
  *   **Fair Play:** You benefit from the order (safety, speed), so you must contribute (wait, tip).
  *   **EMA:** You damage the expectation, so you must contribute.

  **Where they diverge:** Fair Play requires *receipt of benefit*. EMA does not (you admitted this).
  **The Discriminating Case:**
  *   *Scenario:* A queue for a bathroom at a park. You are not in a hurry (no benefit from the queue's speed). You cut in line.
  *   *Fair Play:* Weak or no violation (you didn't free-ride on the time-saving benefit).
  *   *EMA:* Strong violation (you damaged the expectation of order).
  *   *The Test:* If your intuition is that cutting the line is *just as wrong* when you don't need the speed as when you do, EMA holds. If you feel the wrongness diminishes when you don't benefit, your view is secretly relying on Fair Play.
  *   *Likely Outcome:* Most people feel the wrongness *is* tied to the unfair advantage. If so, EMA is just Fair Play with extra steps.

  ### 4. Insulation Check: "Pro Tanto" and "Reasonable Local"
  **Rank: Medium-High Risk**

  You mentioned retreating to "pro tanto duty" and "reasonable local expectation."
  *   **"Pro Tanto":** This is standard deontic hygiene. It saves you from the "Bad Norms" (bribes) objection. Not fatal, but it admits your principle isn't the whole of morality.
  *   **"Reasonable Local":** This is the danger zone.
      *   If "reasonable" means *statistically average*, you are bound by bad majorities (e.g., if 60% of locals discriminate, do you?).
      *   If "reasonable" means *morally justified*, you have outsourced the moral work to a separate standard. The convention isn't generating the obligation; the underlying morality is, and the convention is just the vehicle.
      *   **Verdict:** If you define "reasonable local" morally, you haven't insulated the view; you've hollowed it out. The convention becomes epiphenomenal.

  ### 5. The "Opting Out by Announcement" Move
  **Rank: Medium Risk**

  **The Case:** You loudly announce, "I am a foreigner and I do not believe in tipping," then don't tip.
  **Your View:** Duty remains. Why? Because observers see the *act* of non-tipping, which weakens the expectation for *other* visitors, regardless of your announcement.
  **The Vulnerability:** This relies on the idea that the *signal* is decoupled from the *intent*. But if the announcement clarifies that this is not a rejection of the norm but an exemption, does it still damage the expectation?
  **The Shape of the Pattern:** In high-context cultures, announcement often *increases* damage (you are flaunting the norm). In low-context cultures, it might mitigate it. If your view says the duty is invariant to the announcement, it risks being too rigid. If it varies, you need a theory of *which* announcements mitigate expectation damage. (Likely: Only announcements that signal *inability* to comply, not *unwillingness*).

  ### 6. Awkward-but-not-Fatal Cases
  **Rank: Low Risk (Manageable)**

  *   **Bad Norms (Bribes):** Concede the *pro tanto* duty is overridden by the duty not to corrupt. The convention still generates a *prima facie* duty, it's just defeated. (Standard deontic move).
  *   **Visitor-Only Conventions:** The "locals" are the temporary community of visitors. The "Guest's License" applies relative to the *previous* group of visitors who established the norm. (Requires stretching the definition of "local," but workable).
  *   **Conventions in Flux:** The duty is to align with the *emergent* Schelling point. If 50/50, the expectation is weak, so the duty is weak. This actually fits your view well: weak expectation = weak normative glue.
  *   **Ranking:** These are solvable. They don't break the engine; they just require tuning the parameters.

  ### 7. What a Defender Would Concede
  **Rank: N/A (Strategic Advice)**

  To keep the view viable, a defender should concede:
  1.  **Not all conventions are moral:** Only those where the *coordination value* is high. (Standing on the right of an escalator is moral; wearing a tie to a wedding is etiquette).
  2.  **The "Moral" is Thin:** It is a duty of *civic friendship* or *solidarity*, not a duty of justice or harm-prevention.
  3.  **Visibility is Probabilistic:** You don't need an actual audience; you need to act in a way that *sustains the probability* of detection.

  **What Survives:** The "Guest's License Asymmetry." This is your strongest unique claim. The idea that visitors are *stewards* of a system they didn't build and cannot change, while locals are *owners*, is a robust political distinction.

  ### Summary of Risks

  1.  **Fatal:** The Normativity Gap. If you cannot explain why maintaining an expectation is *moral* without referencing harm or fairness, the view collapses into Consequentialism or Fair Play Theory.
  2.  **High:** The Invisible Tourist. If you say there's no duty when unseen, you look absurd. If you say there is a duty, "conspicuous" is the wrong word.
  3.  **High:** Collapse into Fair Play. If the duty tracks *benefit received* rather than *expectation damaged*, you aren't saying anything new.
  4.  **Medium:** "Reasonable Local." If this term does moral heavy lifting, the convention is irrelevant.
  5.  **Low:** Awkward cases (Bad norms, flux, etc.). These are standard deontic puzzles.

  ### The Verdict

  Your view is **well-insulated against empirical counter-examples** (people actually do get angry at rule-breaking tourists) but **poorly insulated against meta-ethical challenges** (why that anger translates to *moral* obligation).

  **The Shape of the Real-World Pattern:**
  Look at **traffic roundabouts vs. stop signs**.
  *   In a roundabout culture, entering without yielding causes near-misses (harm).
  *   In a stop-sign culture, rolling through at 4am causes nothing.
  *   If your view says the roundabout violation is worse because the expectation is more fragile, you're a consequentialist.
  *   If your view says both are equally wrong because both damage the *form* of the law, you are a Legal Moralist.
  *   **The Test:** Does the *degree* of moral wrongness track the *likelihood of accident* (Harm) or the *strictness of the local culture* (Expectation)?
      *   If it tracks **Accident Likelihood**: You've collapsed into Consequentialism.
      *   If it tracks **Strictness**: You have a distinct view, but it risks endorsing arbitrary authoritarianism (e.g., "In this village, stepping on a crack is a moral violation").

  **Recommendation:**
  Pivot slightly. Don't claim the obligation is *moral* in the heavy sense (harm/justice). Claim it is a **duty of Civic Hospitality**. It is the price of entry into a cooperative space. This sidesteps the "why is this moral?" objection by admitting it's a specific, thin kind of obligation tied to membership/visitation, distinct from universal morality. This saves the "Guest's License Asymmetry" as your core contribution.
