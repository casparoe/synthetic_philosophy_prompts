      *   *Potential Weaknesses:* Is it just desire satisfaction + feeling? Is it circular? Does it cover malicious pleasure (where motivation might be conflicted morally but phenomenally unresisted)? Does it cover flow states (where motivation might dissolve)?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic and descriptive. *Structural Hedonism: Investigating Unresisted Endorsement as the Common Denominator of Pleasure.*

      *   **1. Research Question:**
          *   Needs to be yes/no or this-rather-than-that.
          *   *Draft:* Is unresisted endorsement the common feature?
          *   *Refinement:* Make it about the viability of hedonism *given* this feature.
          *   *Final Polish:* "Does the structural feature of 'unresisted endorsement' successfully identify a uniform property across all putative instances of pleasure sufficient to ground hedonism as a theory of value, distinct from desire-satisfactionism?"

      *   **2. Context & Gap (Why this angle is open):**
          *   Standard debate: Qualitative Hedonism (Mill, Moore's critique) vs. Attitudinal Hedonism (Feldman).
          *   The Gap: Qualitative focuses on *what it feels like* (too diverse). Attitudinal focuses on *pro-attitudes* (too close to desire satisfaction).
          *   My Proposal: A hybrid structural relation. It's not just the feel, not just the attitude, but the *relation* between motivation and phenomenology. This hasn't been fully explored as a *unifying* criterion for intrinsic value.

      *   **3. Methodology (Month-by-Month):**
