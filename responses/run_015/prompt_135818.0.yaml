          *   *Failure:* Showing the feature is extensionally inadequate or collapses into DS. (Note: A negative result is still a result, but for a fellowship, "viability" is usually the goal. I should frame "failure" as determining the hypothesis is untenable).
          *   *Scope Risk:* Six months is tight for a full normative defense. Focus on the *metaphysical/phenomenological* definition first.

      *   **5. Scope & Risk Assessment:**
          *   *Risk:* Redescription of Attitudinal Hedonism.
          *   *Mitigation:* Emphasize the *phenomenal constraint*. DS doesn't require feeling the satisfaction. This does.
