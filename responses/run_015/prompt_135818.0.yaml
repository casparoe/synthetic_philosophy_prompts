answer: |-
  **Project Title:** Structural Hedonism: Investigating "Unresisted Endorsement" as the Unifying Feature of Pleasure

  **1. Research Question**
  Does the structural relation of "unresisted endorsement"—defined as the coincidence of occurrent motivational orientation and phenomenal field without experienced resistance—identify a necessary and sufficient condition for pleasure that preserves hedonism's distinctiveness from desire-satisfactionism?

  This question admits a determinate answer: either the feature successfully demarcates the extension of "pleasure" across heterogeneous cases while maintaining a normative distinction from mere desire fulfillment, or it fails to do so on one or both counts.

  **2. Context and Philosophical Gap**
  The heterogeneity problem remains the primary obstacle to hedonism. The standard dialectic presents a false dichotomy: defenders argue for a uniform qualitative "feel" (qualitative hedonism), while critics argue that pleasures share no common phenomenology, forcing a retreat to attitudinal accounts (attitudinal hedonism).

  Qualitative accounts fail because the phenomenology of solving a puzzle differs too radically from the phenomenology of eating a meal. Attitudinal accounts succeed in unifying the category but risk collapsing into desire-satisfactionism, losing the distinctively *hedonic* claim that consciousness matters intrinsically.

  This project occupies the unexplored middle ground. It posits that the commonality of pleasure is neither a specific qualitative tone nor a bare pro-attitude, but a *structural relation* between the subject's motivation and their phenomenology. Existing literature treats the relation between desire and feeling as contingent; this project investigates whether a specific *mode* of that relation (unresisted coincidence) is constitutive of pleasure. This angle is open because current debates focus on the *relata* (the feeling or the desire) rather than the *structure of their interaction*. If successful, this reconstructs hedonism not as a claim about a specific feeling, but about a specific functional-phenomenal architecture.

  **3. Methodology and Work Plan (Six Months)**

  **Month 1: Conceptual Refinement and Definition**
  *   **Task:** Rigorously define "unresisted endorsement." Distinguish "occurrent motivational orientation" from dispositional desire. Clarify "experienced resistance" (distinguishing physical effort from psychic conflict).
  *   **Output:** A working definition paper (5–10 pages) establishing the conceptual boundaries.
  *   **Milestone:** Ability to distinguish the proposed feature from "flow states" (which may lack occurrent motivation) and "relief" (which is cessation of pain rather than coincidence of motivation and phenomenology).

  **Month 2: Internal Extensional Testing**
  *   **Task:** Test the definition against the "Heterogeneity Catalog."
      *   *Bodily:* Does eating when hungry fit? (Motivation: hunger; Phenomenology: taste; Resistance: none).
      *   *Intellectual:* Does "cool" satisfaction fit? (Motivation: understanding; Phenomenology: clarity; Resistance: none).
      *   *Aesthetic:* Does absorption fit? (Motivation: engagement; Phenomenology: sensory/cognitive focus).
      *   *Malicious:* Does *Schadenfreude* fit? (Motivation: dominance/harm; Phenomenology: satisfaction).
  *   **Method:** Thought experiments and phenomenological description.
  *   **Stopping Condition:** If the definition excludes clear cases of pleasure (e.g., surprise pleasures where no prior motivation existed) or includes clear non-pleasures (e.g., numb acceptance), the hypothesis is revised or abandoned.

  **Month 3: External Differentiation (Rival Theories)**
  *   **Task:** Map the boundary between "unresisted endorsement" and Desire-Satisfactionism (DSS).
  *   **Key Test:** The "Surprised Widow" case (DSS counts satisfaction of desire for husband's fidelity even if she never knows; this project requires phenomenal coincidence).
  *   **Key Test:** The "Depressed Satisfier" (Desire satisfied, but phenomenally flat/resistant).
  *   **Task:** Briefly map against Objective List theories to ensure the feature isn't merely a proxy for "functioning well."
  *   **Output:** A comparative matrix showing where the theories diverge in verdict.

  **Month 4: Normative Implications and Value**
  *   **Task:** Investigate whether "unresisted endorsement" carries intrinsic value.
  *   **Focus:** If malicious pleasure fits the definition (Month 2), does it still count as *good*? If yes, the project defends traditional hedonism. If no, the project may need to argue that only *morally permissible* unresisted endorsements count, which risks begging the question.
  *   **Decision Point:** Determine if the project defends hedonism as a theory of the *good* or merely as a theory of *pleasure*. Given the six-month limit, the focus will remain on the definition of pleasure, with the value claim treated as a conditional consequence.

  **Month 5: Drafting the Core Argument**
  *   **Task:** Synthesize Months 1–4 into a single article-length argument.
  *   **Structure:** (1) The False Dichotomy, (2) The Structural Proposal, (3) Defense against Counterexamples, (4) Distinction from Desire-Satisfactionism.
  *   **Goal:** A complete draft suitable for submission to a general philosophy journal.

  **Month 6: Revision and Finalization**
  *   **Task:** Peer review simulation (sharing with colleagues for critique), refining objections, and final polishing.
  *   **Deliverable:** Final manuscript and a summary abstract for the fellowship committee.

  **4. Deliverables and Success Criteria**
  *   **Successful Deliverable:** A completed manuscript arguing that "unresisted endorsement" is a viable candidate for the common denominator of pleasure. Success does not require proving hedonism is *true*, but proving that this reconstruction makes it *coherent* and *distinct* from rival theories.
  *   **Positive Conclusion:** The feature unifies heterogeneous pleasures and avoids the collapse into desire-satisfactionism.
  *   **Negative Conclusion (Still Valuable):** A definitive demonstration that the feature either fails to cover all pleasures or is extensionally equivalent to desire-satisfactionism. This resolves the ambiguity in the literature.
  *   **Project Failure:** Inability to define "resistance" non-circularly, or the discovery that the feature applies equally to non-hedonic states (e.g., neutral cognitive equilibrium).
  *   **Scope Limit:** If the normative evaluation (Month 4) proves too complex, the deliverable will be restricted to the metaphysical/phenomenological definition of pleasure, leaving the axiological implications for future work.

  **5. Scope Assessment and Risk Management**
  *   **Risk of Redescription:** The primary risk is that "unresisted endorsement" is merely Attitudinal Hedonism with extra adjectives.
      *   *Mitigation:* The project guards against this by insisting on the *phenomenal constraint*. Attitudinal hedonism allows for unconscious attitudes; this proposal requires occurrent phenomenal coincidence. Month 3 is dedicated specifically to stress-testing this distinction.
  *   **Risk of Circularity:** Defining "resistance" might implicitly rely on the concept of "unpleasantness."
      *   *Mitigation:* Month 1 will focus on defining resistance in terms of motivational friction or cognitive dissonance, independent of hedonic tone.
  *   **Risk of Scope Creep:** The project could expand into a full theory of well-being.
      *   *Mitigation:* The research question is strictly limited to the *identification* of pleasure. While the implication for value is noted, the six-month timeline is committed to solving the heterogeneity problem, not defending the supreme value of pleasure against objective list critics.
  *   **Feasibility:** Six months is sufficient for a conceptual analysis and defense of a single core thesis. It is insufficient for empirical validation or a full book-length treatment. The deliverable is scoped as a foundational article, which is appropriate for the fellowship duration.
