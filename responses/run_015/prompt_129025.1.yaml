      *   *The Outcome:* One submits (Slave/Bondsman) to survive; one dominates (Lord/Master).
      *   *The Twist:* The Master becomes dependent on the Slave for recognition (which is worthless because the Slave is unfree). The Slave, through work/labor, transforms the world and gains independent self-consciousness.
