      *   **Error 3: The "Reductio" Claim.** The user thinks CEA is a reductio of consciousness. Most philosophers (even dualists) think CEA is a problem for *dualism* or *non-reductive physicalism*, not a proof that consciousness is an illusion. Illusionism is a separate move.
