answer: |-
  # ETHICS COMMITTEE HEARING: PREPARATION SHEET

  **Subject:** Complaint regarding architectural appropriation in [Novel Title].
  **Goal:** Survive censure; establish philosophical groundwork for future practice.
  **Critical Vulnerability:** The interview from six years ago (the "Theft" comment).

  ### PRE-EMPTIVE CONCESSIONS
  *Do not wait for these to be dragged out of you. State them in your opening or immediately upon the first challenge.*

  1.  **On Acknowledgment:** Concede that placing the source *only* in the afterword and acknowledgments was insufficient for a structural borrowing of this magnitude. It treated the source as a footnote rather than a foundation. You should have integrated the attribution into the text (e.g., an epigraph or author's note at the front).
  2.  **On The Interview:** Concede that using the word "theft" six years ago was intemperate and, in light of your current philosophical position, inconsistent. Do not try to justify the past comment; characterize it as a failure of your own earlier vocabulary.

  ---

  ### THE EIGHT OBJECTIONS

  #### 1. The Threshold Question (The Barrister)
  **Idiom:** Legalistic, procedural, focused on notice and harm.
  **Objection:** "You argue that naming repairs the injury. But you buried the name. An acknowledgment in the back matter is not notice; it is a disclosure statement. If a reader finishes the book without knowing the structure is derived, the 'falsification of the record' you speak of has already occurred. Why should the committee accept a remedy that the reader never sees?"
  **Damage if Mishandled:** High. If you cannot defend the placement of the credit, your claim that "naming is most of the moral accounting" collapses.
  **Reply (2 mins):** "You are correct that an afterword is too late for the reading experience. My proposal explicitly calls for 'mandatory naming inside the text.' In this specific instance, I failed my own standard. I treated the acknowledgment as a legal shield rather than an ethical bridge. I concede this was an error of presentation, not of principle. The remedy is not to hide the name, but to ensure it appears where the architecture is felt—perhaps in an introductory note. The injury is to the reader's understanding of the book's lineage, and I agree that understanding must precede the final page."
  **Weakness:** It admits negligence in the very act you are defending.

  #### 2. The Labor Argument (The Fantasy Novelist)
  **Idiom:** Craft-focused, protective of worldbuilding, sense of unfair competition.
  **Objection:** "You call architecture a 'skeleton.' I call it the load-bearing wall. I spent three years engineering a magic system that holds a plot together. If someone takes that system, changes the names, and keeps the physics, they have saved themselves three years of labour. You are arguing that the sweat of building the frame doesn't count, only the paint does. That devalues the hardest part of our job."
  **Damage if Mishandled:** Medium-High. Alienates the working writers on the committee who view structure as intellectual property.
  **Reply (2 mins):** "I respect the labour. But labour alone does not create property; otherwise, the first person to dig a ditch would own the concept of ditches. Structure is often a discovery of how human tension resolves, not an invention. When you built your magic system, did you invent the concept of cost and exchange, or did you apply them? I argue that deep structures are like laws of physics we discover. You own the specific application—the 'paint'—but not the gravity that holds it up. If we own gravity, no one can build after us."
  **Weakness:** Risks sounding like you are dismissing the specific, unique complexity of their worldbuilding.

  #### 3. The Voice Argument (Older Novelist A)
  **Idiom:** Traditionalist, workshop vocabulary, focused on "authenticity."
  **Objection:** "We teach writers to find their own shape. A story's shape is its voice. If you wear another writer's skeleton, you are walking in their gait. You say every sentence is yours, but if the rhythm of the revelation is someone else's, haven't you just mimicked their pulse? Isn't this a failure of imagination?"
  **Damage if Mishandled:** Medium. Attacks your artistic integrity rather than your ethics.
  **Reply (2 mins):** "Voice is not just the shape of the container; it is the quality of the light inside it. I used a 1931 container, but I poured in 2024 light. The 'gait' you hear is the universal gait of narrative tension, which recurs. If I write a sonnet, I use Shakespeare's skeleton. Is that a failure of imagination? No, it's a dialogue. I am not hiding the skeleton; I am acknowledging it so the reader can hear how my voice resonates against that specific bone structure."
  **Weakness:** Equating a full novel architecture to a sonnet form is a stretch; sonnets are public domain forms, 1931 novels are specific works.

  #### 4. The Hypocrisy Trap (Older Novelist B)
  **Idiom:** Moral, personal, direct.
  **Objection:** "Six years ago, you called a younger writer a thief for lifting your structure. Now you say structure is free. Did your philosophy change because you were the victim then, and the beneficiary now? Or do you simply believe you have the right to take from the dead what you forbade the living to take from you?"
  **Damage if Mishandled:** Critical. This destroys your credibility and makes your philosophy look like self-serving rationalization.
  **Reply (2 mins):** "I owe that younger writer an apology for the word 'theft.' I was angry then, and I was protecting my livelihood. That is the distinction: a living competitor causes economic harm; a dead author from 1931 does not. My error then was using the language of property for what was actually a professional grievance. I am trying to correct that language now. I am not claiming a right to take from the living; I am claiming a right to build upon the past without the burden of ownership where no harm exists."
  **Weakness:** It admits your previous stance was emotional, not principled, which weakens your current authority.

  #### 5. The Hierarchy Problem (The Translator)
  **Idiom:** Nuanced, focused on derivation and fidelity.
  **Objection:** "You say sentences are property, but structure is not. But a sentence derives its meaning from its place in the structure. If I translate a book, I own my sentences, but I must follow your architecture. If architecture is free, why is the translation of that architecture not also free? You are drawing a line where there is a gradient."
  **Damage if Mishandled:** Medium. Highlights the instability of your three-tier proposal.
  **Reply (2 mins):** "A translation is a mirror; it aims to reflect the original register of attention. My novel is not a mirror; it is a new room built with old beams. The sentence is the immediate sensory experience of the reader—that is where the writer's unique presence is most tangible. Structure is the map. I am arguing that we can share maps without stealing the journey. You protect the voice, I protect the map, but we must acknowledge who drew the map first."
  **Weakness:** "Maps" vs. "Journeys" is poetic but legally and ethically porous.

  #### 6. The Theoretical Attack (The Academic Scholar)
  **Idiom:** Critical theory, skeptical of "authorship," focused on ideology.
  **Objection:** "Your 'register of attention' is just the Romantic myth of the Genius rebranded. You claim to reject the solitary originator, but then you posit a mystical 'habit of noticing' that belongs to a single author. You are reinstating the very ideology you claim to dismantle, simply to secure your own moral standing."
  **Damage if Mishandled:** Medium-High. Undermines the intellectual coherence of your defense.
  **Reply (2 mins):** "I am not describing a soul; I am describing a pattern of evidence. If I can show through textual analysis that Writer A consistently ignores class dynamics while Writer B dwells on them, that is an observable fact, not a mysticism. I want to move away from 'ownership' toward 'attribution.' The Romantic genius claims exclusive rights; I am claiming only the right to be cited. I am trying to dissolve property, not reinforce it."
  **Weakness:** "Observable fact" is hard to prove in court or committee without subjective interpretation.

  #### 7. The Enforceability Challenge (The Barrister)
  **Idiom:** Pragmatic, rule-based, skeptical of vagueness.
  **Objection:** "Your third tier proposes 'mandatory naming inside the text.' Who decides when architecture is sufficiently similar to trigger this? Where is the test? Without a clear rule, you are inviting endless litigation and committee hearings. Ethics must be actionable."
  **Damage if Mishandled:** High. If the policy isn't workable, the committee will reject it as impractical idealism.
  **Reply (2 mins):** "I agree it requires nuance. I am not proposing a legal statute, but an ethical norm, similar to citation standards in academia. We do not sue academics for poor footnotes; we censure them. The test is: would a knowledgeable reader recognize the structural lineage? If yes, attribution is required. It relies on the judgment of peers, which is exactly what this committee is. We are the enforcers."
  **Weakness:** Relies heavily on the committee's willingness to do the heavy lifting of judgment calls.

  #### 8. The Independent Creation Myth (The Fantasy Novelist)
  **Idiom:** Skeptical, experienced, cynical.
  **Objection:** "You say structures get 'rebuilt independently.' I say that's a fairy tale. When I see my magic system in another book, I don't believe they stumbled on it. When you used the 1931 book, you didn't stumble on it. Independent creation is the defence of the guilty."
  **Damage if Mishandled:** Medium. Questions your honesty about the derivation.
  **Reply (2 mins):** "In this case, I did not stumble; I studied. But in law, independent creation is the only defence that works because we cannot read minds. My argument is that because it *can* be rebuilt independently, it cannot be owned exclusively. If two people can climb the same mountain from different sides and meet at the peak, the peak belongs to neither. I am asking us to acknowledge the mountain, not claim we invented the geology."
  **Weakness:** Admitting you "studied" it undermines the "independent creation" analogy, even if it supports the "acknowledgment" point.

  ---

  ### THE QUESTION YOU HOPE NOBODY ASKS

  **"Is it possible that you have developed this sophisticated theory of 'architecture as free' specifically to rationalize what you did in this book, after you were caught doing the very thing you condemned in others?"**

  *Why this is dangerous:* It attacks the *motive* behind your philosophy rather than the philosophy itself. It suggests your ethics are post-hoc rationalizations for convenience.
  *If asked:* Do not deny the timing. Acknowledge that the conflict forced the clarity. "Pressure often forces us to articulate what we previously only felt. I do not apologize for finding the words to describe my practice, even if the timing is suspicious."

  ---

  ### STRATEGIC NOTE
  Your strongest ally is the **Academic Scholar** (who dislikes property rights) and your strongest adversary is the **Older Novelist B** (who holds the hypocrisy card). The **Barrister** is the swing vote; if you can convince him your proposal creates a workable *rule* rather than just a philosophical mood, you may avoid censure.

  **Tone:** Humble but firm. Do not sound like you are lecturing them on theory; sound like you are offering a solution to a problem they all face. Acknowledge the "Worst Fact" early to drain its power.
