answer: |-
  # TRANQUILIST CLINICAL ETHICS PILOT PROTOCOL (T-CEP)
  **Version:** 1.0 (Pilot)  
  **Audience:** Nursing, Medical, Social Work Staff  
  **Time Allocation:** 15 Minutes (Chart Review + 1 Conversation)  
  **Decision Authority:** Staff (Approve/Decline) or Chair (Refer)

  ---

  ## PART 1: EPISTEMIC KEY & THEORETICAL BOUNDARIES
  *Read this before using the procedure. It marks where the theory is solid and where we are making pragmatic choices to make it work at the bedside.*

  | Symbol | Status | Meaning |
  | :--- | :--- | :--- |
  | **[ANALYTIC]** | Derived from Core Theory | If Tranquilism is true, this *must* be true. (Welfare = Absence of Craving/Suffering). |
  | **[CONTESTED]** | Philosophical Dispute | Reasonable tranquilists disagree here. We have picked a lane for consistency. |
  | **[PRAGMATIC]** | Operational Necessity | Required to make the protocol runnable in 15 mins, not theoretically required. |

  **Core Axiom [ANALYTIC]:** An intervention improves welfare *if and only if* it results in a net reduction of craving and/or suffering compared to the alternative. Pleasure, satisfaction, and "flourishing" have no positive weight.

  **Hard Limit [PRAGMATIC]:** Staff **must not** calculate welfare comparisons involving permanent unconsciousness vs. death. If an option effectively ends the capacity for craving permanently (e.g., continuous palliative sedation until death, withdrawal of life-sustaining treatment), **STOP and REFER.** The theory implies these are "best" states (zero craving); the hospital policy does not. This is a values conflict, not a calculation.

  ---

  ## PART 2: RESOLUTION OF THE SEVEN DISTINCTIONS
  *These definitions are binding for this pilot. Do not debate them during consultation.*

  **1. Craving vs. Want [CONTESTED]**
  *   **Definition:** A **Craving** is a desire where the *absence* causes distress, anxiety, or agitation. A **Want** is a preference where the absence is neutral.
  *   **The Test:** Ask the patient (or proxy): "If you don't get this, does it bother you?"
  *   **Non-Reporting Patient:** If the patient cannot report, look for *search behavior* or *distress upon removal*. If a patient reaches for an object but shows no distress when stopped, it is a Want (ignore for welfare calculation). If they become agitated when stopped, it is a Craving.

  **2. Unfelt/Dispositional Craving [CONTESTED]**
  *   **Definition:** States where the patient is not currently suffering but *would* if conditions changed (e.g., a sleeping patient who will hunger upon waking).
  *   **Rule:** Count only **High-Probability Dispositions**.
  *   **Evidential Standard:** Requires prior documented evidence of distress in this specific context (e.g., "Patient becomes combative when feeding tube is clamped"). Do not speculate on hypothetical distress without behavioral history.

  **3. Adaptation vs. Full Information [PRAGMATIC]**
  *   **Problem:** Patients adapt to poor conditions (low expectations).
  *   **Rule:** Prioritize **Actual Reported Experience**.
  *   **Defense:** We cannot access the "Full Information" counterfactual at the bedside. If a patient reports no craving, we count no craving, even if a healthy version of them would crave more. We treat the adaptation as a reduction in craving, not a distortion.

  **4. Scope of Suffering [ANALYTIC]**
  *   **Includes:** Pain, nausea, breathlessness, dread, grief, boredom, feeling trapped, anxiety.
  *   **Anticipatory Distress:** Counts *only* if the anticipation is currently painful (e.g., "I am terrified of tomorrow" counts as current suffering). If the feared event never arrives and caused no distress while waiting, it counts as zero.

  **5. Displacement & Time Window [PRAGMATIC]**
  *   **Window:** The **Clinical Horizon** (Expected duration of intervention effect, default = 2 weeks).
  *   **Displacement Rule:** If an intervention removes Craving A but reliably causes Craving B within the Clinical Horizon, they cancel out.
  *   **Unknown Data:** If data on side-effects/displacement is missing, assume **Displacement Exists** (Conservative Principle). Do not approve an intervention that solves one craving if it is likely to spawn another of equal intensity.

  **6. Comparative vs. Absolute [ANALYTIC]**
  *   **Rule:** **Comparative Only.**
  *   **Explanation:** You cannot assign a "Welfare Score" to a single patient. You can only rank Option A vs. Option B. Welfare is the *delta* (change) in craving/suffering.

  **7. Behavioral Evidence [CONTESTED]**
  *   **Status:** Behavior is **Evidence**, not **Criteria**.
  *   **Rule:** Pacing, vocalizing, or autonomic markers (high HR/BP) suggest suffering but do not prove it.
  *   **Requirement:** Behavior must be paired with **Context** (e.g., pacing near exit = craving escape) and **Exclusion** (e.g., not caused by reflex or medication side-effect). If behavior is ambiguous, count as "Unknown" (See Stop Rule 3).

  ---

  ## PART 3: THE PROCEDURE (Step-by-Step)

  **Step 1: Define Options**
  *   Identify the Proposed Intervention (Option A).
  *   Identify the Status Quo or Best Alternative (Option B).
  *   *Stop Rule 1:* Does Option A or B involve permanent sedation or ending life? **YES → REFER TO CHAIR.** (Do not calculate).

  **Step 2: Baseline Assessment (Option B)**
  *   List current sources of Suffering (0-10 intensity).
  *   List current sources of Craving (0-10 intensity).
  *   *Note:* Ignore absent pleasures.
  *   **Total Baseline Burden (TBB)** = Sum of Suffering + Craving.

  **Step 3: Projection (Option A)**
  *   Estimate Suffering/Craving under Intervention.
  *   Include side-effects (nausea, restlessness, boredom).
  *   Include "Displacement" (new cravings created).
  *   **Total Intervention Burden (TIB)** = Sum of Suffering + Craving.

  **Step 4: The Comparison**
  *   Calculate **Net Welfare Change** = TBB minus TIB.
  *   *Stop Rule 2:* Is the data too vague to estimate TIB? (e.g., novel drug, unknown psych response). **YES → REFER TO CHAIR.**
  *   *Stop Rule 3:* Is behavioral evidence conflicting? (e.g., patient says "fine" but is screaming). **YES → REFER TO CHAIR.**

  **Step 5: Decision**
  *   **Net Welfare Change > 0:** **APPROVE** (Intervention reduces craving/suffering).
  *   **Net Welfare Change ≤ 0:** **DECLINE** (Intervention does not reduce craving/suffering).
  *   **Hard Limit Triggered:** **REFER** (See Step 1).

  ---

  ## PART 4: ONE-PAGE WARD TOOL

  | **T-CEP QUICK CHECK** | **YES** | **NO** | **ACTION** |
  | :--- | :---: | :---: | :--- |
  | **1. Hard Limit:** Does this involve permanent sedation or ending life? | | | **YES = STOP & REFER** |
  | **2. Craving Test:** Is the patient distressed if they don't get what they want? (If no report: Is there distress upon removal?) | | | **NO = Ignore preference** |
  | **3. Displacement:** Will fixing this problem likely create a new problem (side effect/new craving) within 2 weeks? | | | **YES = Count new problem** |
  | **4. Behavior:** If patient can't speak, is there clear context for their distress behavior? (Not just reflex) | | | **NO = REFER** |
  | **5. Calculation:** Does Option A have *less* total distress/craving than Option B? | | | **YES = APPROVE** / **NO = DECLINE** |

  **Written Rationale Template (For Chart):**
  *   **Options Compared:** [A] vs [B]
  *   **Identified Suffering/Craving (Baseline):** [List]
  *   **Identified Suffering/Craving (Intervention):** [List + Side Effects]
  *   **Net Change:** [Reduction/Increase/Neutral]
  *   **Decision:** [Approve/Decline/Refer]
  *   **Staff Signature:**

  ---

  ## PART 5: CASE STUDY APPLICATIONS

  ### Case 1: Advanced Dementia (Pacing)
  *   **Scenario:** Resident paces/calls out. Option A: Antipsychotic. Option B: Increased 1:1 staffing.
  *   **Protocol Run:**
      *   **Step 1:** No permanent sedation/life-end. Proceed.
      *   **Step 2 (Baseline):** Pacing/Calling = Evidence of Craving (to escape/be found) + Suffering (distress). TBB = High (8/10).
      *   **Step 3 (Option A - Drug):** Pacing stops. Craving removed. *But* Drug side-effects: Sedation (Zero craving), potential physical restlessness (akathisia). TIB = Low (2/10 for restlessness).
      *   **Step 3 (Option B - Staffing):** Pacing stops via engagement. Craving removed. Side-effects: None physiological. TIB = Zero.
      *   **Step 4:** Option B (0) < Option A (2). Both < Baseline (8).
      *   **Decision:** **APPROVE Option B.** If budget denies B, **APPROVE Option A** (still net reduction vs baseline), but note displacement risk.
  *   **Tranquilist Logic:** The "loss of engagement" in Option A is not a welfare loss unless it causes craving. Sedation is welfare-neutral or positive.

  ### Case 2: Treatment-Resistant Depression (Palliative Sedation)
  *   **Scenario:** Man, 40s, TRD. Requests continuous palliative sedation (PS). Distress = Dread. Wife supports.
  *   **Protocol Run:**
      *   **Step 1:** Does this involve permanent sedation? **YES.** (Continuous until death).
      *   **Action:** **STOP & REFER TO CHAIR.**
  *   **Rationale:** While Tranquilism calculates PS as "Perfect Welfare" (Zero Craving), this triggers the **Hard Limit**. Staff cannot authorize a protocol that equates permanent unconsciousness with "success" against a living alternative without Chair/Committee oversight. This is a values boundary, not a calculation error.

  ### Case 3: The "Inert" vs. The "Flourishing"
  *   **Scenario:**
      *   **Patient X:** Dopamine-blocked. Inert. Indifferent. Reports no wants, no distress. Sits all day.
      *   **Patient Y:** "Flourishing." High engagement, relationships, achievements. Reports high cravings (to finish projects, see family) and satisfied preferences.
  *   **Protocol Run:**
      *   **Patient X:**
          *   Craving: 0.
          *   Suffering: 0.
          *   **Welfare Score:** Max (Baseline Burden = 0).
      *   **Patient Y:**
          *   Craving: High (wants to do things).
          *   Suffering: Low (but non-zero effort/stress).
          *   **Welfare Score:** Lower than X (Baseline Burden > 0).
      *   **Comparison:** If an intervention made Patient Y like Patient X (lobotomy/chemical lobotomy), the protocol calculates this as a **Welfare Improvement**.
  *   **Decision:** **APPROVE** (Intervention that creates Patient X state).
  *   **Where Judgment Parts Company:**
      *   **Protocol Answer:** Patient X is doing better than Patient Y. Eliminating Y's cravings improves Y's welfare.
      *   **Chair/Committee Judgment:** This is the **Refer** zone for policy. While the *theory* ranks X higher, the *hospital mission* likely values agency. The protocol honestly outputs "X is better," which forces the Committee to acknowledge that Tranquilism conflicts with "Agency/Flourishing" values.
      *   **Instruction to Staff:** In this specific comparison (Inert vs. Active), **REFER**. Do not recommend making a patient inert to improve "welfare" without Chair review. This acknowledges the theory's implication while preventing its unchecked application.

  ---

  ## PART 6: LIMITATIONS & EPISTEMIC DISCLAIMERS

  **1. The Sedation/Death Equivalence**
  *   **Status:** [ANALYTIC to Theory] / [EXCLUDED from Protocol]
  *   **Disclaimer:** Tranquilism logically implies that a dead patient or a permanently sedated patient has optimal welfare (zero craving). This protocol **does not** allow staff to recommend interventions based on this equivalence. Any option leading to permanent loss of capacity for craving must be referred. This is a safety valve, not a theoretical correction.

  **2. Dispositional States**
  *   **Status:** [CONTESTED]
  *   **Disclaimer:** Strict experientialism says "no feeling = no suffering." We allow "High-Probability Dispositions" (Part 2, Distinction 2) to prevent neglect of non-communicative patients. This is a safeguard, not a theoretical necessity.

  **3. The Adaptation Problem**
  *   **Status:** [PRAGMATIC]
  *   **Disclaimer:** We accept the patient's adapted state as "good" (low craving). We do not attempt to correct "false consciousness." If a patient claims to be content in deprivation, we count it as contentment. This protects patient autonomy but may ignore objective welfare deficits defined by other theories.

  **4. Coherence of Negative Welfare**
  *   **Status:** [CONTESTED]
  *   **Disclaimer:** This protocol assumes a purely negative account of welfare is coherent. If staff find they cannot distinguish "absence of craving" from "presence of satisfaction" in practice, the data collected will be noisy. Staff are instructed to code "Satisfaction" as "Zero Craving," not "Positive Welfare."

  **5. What This Procedure Cannot Do**
  *   It cannot justify killing or permanent sedation as "beneficence."
  *   It cannot distinguish between a "good life" and a "quiet life."
  *   It cannot override legal/Policy constraints on restraint or sedation.

  **Final Instruction:** If the protocol yields a result that feels morally repugnant (e.g., "Sedate the flourishing patient"), do not override the calculation yourself. **Refer to Chair.** This indicates a conflict between the Pilot Theory and Institutional Values.
