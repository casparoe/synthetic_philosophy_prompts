answer: |-
  To the Editor,

  It has come to the attention of the Office of Analogical Review that the public discourse regarding national security is increasingly reliant upon unvetted historical precedents. Specifically, the invocation of Munich, Vietnam, and the Thucydides trap has become a routine substitute for strategic analysis. To restore procedural integrity, the Office now requires any minister, commentator, or general invoking these analogies to file a Certified Analogy Impact Statement. This form ensures that the historical comparison is not merely rhetorical but operational. The applicant must specify which current leader corresponds to Hitler and which to Chamberlain, state the national interest actually at stake, and supply the base rate of war among all crises that superficially resemble the present one. We anticipated some difficulty in populating these fields, yet the data returned thus far has revealed systemic anomalies within the machinery of statecraft itself.

  Regarding the identification of historical actors, we find that applicants briefed on identical intelligence reliably fill the Hitler and Chamberlain boxes in opposite directions. To resolve this impasse, the Office introduced a tie-breaker mechanism based on the urgency of the briefing. I must concede with mild bureaucratic embarrassment that this tie-breaker has never once favored restraint. When both sides claim the mantle of Churchill, the procedure defaults to the party asserting the greater immediacy of threat. Furthermore, the interest-at-stake box is nearly always left blank. Our auditors suggest this is not an oversight but a feature, as the analogy allows a government to announce a policy without ever naming what it wants, thereby shielding the objective from scrutiny. The base-rate box is similarly compromised; while designed to provide statistical context, it is routinely waived for cases of unusual gravity. Our records indicate that every case submitted to date has been categorized as possessing unusual gravity, rendering the statistical control meaningless.

  Most damaging to the Office's mission, however, is the requirement that each filing must pair its analogy with a matched historical Non-Event. To prevent selection bias, applicants must draw from the Office's Register of Non-Events, a catalog of crises in which concessions were met with restraint, or a threat was called and nothing happened. The Register is currently empty. This is not due to a lack of historical peace, but because nothing happening leaves behind no declarations, no anniversaries, and no memorials. Success produces no archive. The archive of usable analogies is filtered by outcome, and therefore contains only catastrophes. A minister may easily cite a failure of appeasement because it generated treaties, speeches, and ruins. They cannot cite a success of appeasement because it generated only Tuesday.

  Consequently, the Certified Analogy Impact Statement cannot be completed in good faith. The form demands a counter-example that history has refused to document. The Office registers this gap with profound bureaucratic regret. We are unable to approve any further analogy statements until the Register is populated, yet we lack the authority to create history merely to fill a form. We therefore propose a modest appropriation to study why successful restraint leaves no paper trail, while failure generates libraries. Until such study is concluded, the Office recommends that all public speech assume the worst-case precedent, as it is the only one properly filed. We trust this temporary measure will suffice while we endeavor to catalog the silence of disasters that never occurred.

  Yours faithfully,

  Dr. Alistair Vance
  Founding Director, Office of Analogical Review
