answer: |-
  The conceptual knot you're looking for is **Institutional Virtue**.

  Here is the breakdown of why classifying "Institutional Virtue" as either situational or cultural collapses the explanatory power of both terms.

  In the Browning/Goldhagen framework, **Situation** usually refers to external constraints and incentives (orders, peer pressure, career risk, bureaucratic structure), while **Culture** refers to internalized beliefs and values (ideology, prejudice, moral worldview).

  The breakdown occurs when an institution successfully redefines **moral goodness itself** as **functional compliance**.

  ### The Knot: "Doing Your Job Well"

  Imagine a bureaucratic system designed to inflict harm. Within this system, a perpetrator is not acting out of raw hatred (Goldhagen's cultural driver) nor solely out of fear of punishment (Browning's situational driver). They are acting out of a desire to be a *competent professional*.

  Here is where the classification breaks down:

  **1. If you classify this as Situational:**
  You argue that the perpetrator is merely responding to structural incentives. They compartmentalize because the workflow demands it; they don't see the whole harm because the org chart hides it.
  *   **The Failure:** This assumes the perpetrator is morally neutral and simply bending to external pressure. It ignores that the perpetrator often feels *pride* in their efficiency. If it were purely situational, removing the pressure should stop the behavior. But often, even when direct oversight is removed, the "good worker" continues the harm because they have come to view the *process* as the *purpose*. The structure didn't just constrain them; it taught them what "good" looks like.

  **2. If you classify this as Cultural:**
  You argue that the perpetrator has internalized a value system where this specific type of harm is acceptable or virtuous. They believe in the mission.
  *   **The Failure:** This assumes the values pre-existed the institution or were adopted through ideological indoctrination. It ignores that the "values" are often just the *internalization of the workflow*. They don't believe in the harm because of deep-seated prejudice; they believe in the harm because the institution told them that "following procedure" is the highest moral duty. The culture is not the *cause* of the behavior; it is the *residue* of the situation.

  ### Why the Distinction Breaks Down

  The ambiguity matters because **the situation is the pedagogy.**

  In these institutional dynamics, the structure does not just constrain behavior; it *trains* cognition. When a system rewards compartmentalization, it isn't just creating a situational blind spot; it is actively cultivating a cultural virtue called "discipline" or "loyalty."

  *   **Is "not asking questions" a structural rule or a cultural value?**
      *   Structurally, it's a workflow efficiency.
      *   Culturally, it's a sign of trustworthiness.
      *   **The Knot:** You cannot separate them. The structure *requires* the culture to function, and the culture *sustains* the structure.

  If you treat them as separate bins, you create a false solution.
  *   If you think it's **Situational**, you try to fix the org chart (add oversight, change reporting lines). But if the culture now values "not snitching" or "efficiency over ethics," the new structure will be subverted.
  *   If you think it's **Cultural**, you try to fix the hearts and minds (re-education, ideological purges). But if the structure still rewards harmful efficiency, the new culture will simply revert to the old behaviors because the incentives haven't changed.

  ### The Explanatory Harm

  The distinction does harm because it allows us to locate the "evil" in the wrong place.

  *   **Browning's trap:** If it's just the situation, then *anyone* would do it. This risks absolving the individual of the specific cultural work they did to make the situation tolerable for themselves.
  *   **Goldhagen's trap:** If it's just the culture, then *only those people* would do it. This risks ignoring how the institution manufactured that culture in the first place.

  The conceptual mess is that **institutional roles are cultural engines.** When a person steps into a role that requires harm, the role doesn't just sit around them (situation); it gets inside them (culture). The "situational" pressure to comply becomes the "cultural" identity of being a compliant person.

  By trying to separate them, you miss the feedback loop: **The structure creates the values that sustain the structure.** In the context of state-sponsored harm, the "situation" is not a stage the actors walk onto; it is the script they have memorized as their own moral language. Classifying it as one or the other cuts the wire in the middle of a live circuit.
