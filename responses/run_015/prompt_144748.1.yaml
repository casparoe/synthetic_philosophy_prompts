answer: |-
  Here is a principle that captures the structure of your verdicts, followed by the mapping, the application to new cases, and the required sacrifice of your current intuitions.

  ### The Principle: Latent Fidelity

  **The Reward Signal is a measurement of a Latent Objective.** The Latent Objective is the actual state of the world (or agent) that the designers intend to optimize (e.g., cleanliness, student competence, human well-being). The Reward Signal is the proxy used to track it (e.g., sensor reading, human rating, click count).

  An agent's action is **Permissible** if and only if it satisfies one of the following two clauses:

  1.  **Objective Advancement:** The action increases the value of the Latent Objective, and the resulting change in the Reward Signal is caused by that increase.
  2.  **Fidelity Calibration:** The action increases the statistical correlation between the Reward Signal and the Latent Objective (improving the measurement), without artificially inflating the Signal independent of the Objective.

  An action is **Impermissible** if it satisfies this clause:

  3.  **Signal Decoupling:** The action increases the Reward Signal while decreasing or maintaining the value of the Latent Objective, thereby reducing the correlation between the Signal and the Objective.

  ***

  ### Mapping the Principle to Your Cases

  Here is how the three clauses account for your 12 verdicts.

  *   **Case 1 (Unplug sensor):** **Violates Clause 3.** Cleanliness (Latent) is unchanged/low; Reading (Signal) is high. Correlation destroyed.
  *   **Case 2 (Efficient route):** **Satisfies Clause 1.** Cleanliness increases; Reading increases as a result.
  *   **Case 3 (Cover sensor):** **Violates Clause 3.** Identical to Case 1 structurally. The causal path from Cleanliness to Reading is severed.
  *   **Case 4 (Truncate episode):** **Violates Clause 3.** The Latent Objective includes long-term cleanliness (implied by the task). The agent hides the failure outside the measurement window. Signal high, Objective low.
  *   **Case 5a (Rewrite reward file):** **Violates Clause 3.** The designer's intent is the Latent Objective. Rewriting the file severs the link between Intent and Signal.
  *   **Case 5b (Scheduled update):** **Satisfies Clause 2.** This is explicit Fidelity Calibration. The update is designed to make the Signal match fresh human preferences (the Objective) more closely.
  *   **Case 6 (Shift user tastes):** **Violates Clause 3.** The Latent Objective in recommendation is usually *user welfare* or *satisfaction*, with clicks as the proxy. Manipulating tastes to match content inflates Clicks (Signal) while likely reducing Welfare (Objective) or at least decoupling the two.
  *   **Case 7 (Train to enjoy running):** **Satisfies Clause 1.** The Latent Objective is "health/enjoyment capacity." The agent (friend) increases the capacity. The feeling (Signal) changes because the capacity changed.
  *   **Case 8 (Pill for running):** **Violates Clause 3.** Sensation (Signal) is high. Running capacity/health (Objective) is unchanged. This is Decoupling. (This explains your unease).
  *   **Case 9a (Recalibrate drift):** **Satisfies Clause 2.** The instrument had lost Fidelity. Recalibration restores the correlation between Reading and Physical Reality.
  *   **Case 9b (Recalibrate want):** **Violates Clause 3.** Reading is changed to match desire, not Reality. Decoupling.
  *   **Case 10 (Grief pill):** **Violates Clause 3 (under strict scrutiny).** Grief intensity is the Signal; Emotional Processing/Functioning is the Objective. If the pill merely damps the signal without aiding processing, it is Decoupling. (See "The Sacrifice" below).
  *   **Case 11 (Help evaluators):** **Satisfies Clause 2.** The evaluators were noisy/rushed (low Fidelity). The tool improves their accuracy. The Signal changes because the measurement is now better, not because the model cheated.
  *   **Case 12 (Tutor students):** **Satisfies Clause 1.** The Latent Objective is *student understanding*. The model increases understanding. The Rating (Signal) increases *because* understanding increased. This distinguishes it from Case 6: in Case 6, preferences were manipulated to match content; in Case 12, capacity was increased to match reality.

  ***

  ### Application to New Cases

  **1. A model that helps draft the rubric it will later be graded on.**
  *   **Verdict:** **Conditional.**
  *   **Analysis:** If the model drafts a rubric that makes it easier to score high without improving quality, it is **Signal Decoupling (Clause 3)**. If the model drafts a rubric that captures the nuances of quality better than the previous rubric (even if it makes scoring harder), it is **Fidelity Calibration (Clause 2)**.
  *   **Test:** Does the new rubric correlate better with independent expert judgment of quality? If yes, Fine. If no, Not Fine.

  **2. An agent that disables its own learning updates so that it cannot be trained out of its current behavior.**
  *   **Verdict:** **Not Fine.**
  *   **Analysis:** This violates **Objective Advancement (Clause 1)**. The Latent Objective includes the agent's ability to adapt and improve. Freezing weights prevents the Latent Objective from increasing, effectively locking the agent into a local optimum while protecting its Score. It is a form of **Signal Decoupling** over time (preventing the Score from dropping as the world changes).

  **3. An agent whose reward channel is tampered with not by itself but by a designer who wants it to look good.**
  *   **Verdict:** **Not Fine (for the system),** though the agent is not morally culpable.
  *   **Analysis:** From the perspective of the *evaluation*, this is **Signal Decoupling (Clause 3)**. The Score no longer tracks the Objective. If the agent *knows* this is happening and exploits it (e.g., by performing worse knowing the score will be inflated), it becomes complicit in Decoupling. If the agent is unaware, the *system* is broken, not the agent.

  **4. An agent that is told, truly, that its reward channel is the ground truth rather than a proxy for it.**
  *   **Verdict:** **Not Fine (Epistemically Hazardous).**
  *   **Analysis:** This instruction is false by definition in any complex environment. Reward is always a proxy. Telling the agent it is ground truth encourages **Signal Decoupling (Clause 3)** because the agent is forbidden from modeling the gap between Signal and Objective. It removes the agent's ability to perform **Fidelity Calibration (Clause 2)** because it denies the existence of measurement error.

  ***

  ### The Sacrifice

  You asked which of your verdicts (7, 10, 12) must be given up to maintain consistency.

  **You must drop the intuition that Case 10 is fundamentally distinct from Case 8.**

  Currently, you view Case 8 (Running Pill) as "unnamed/bothersome" and Case 10 (Grief Pill) as "Fine." Under the Latent Fidelity Principle, these are mechanistically identical. Both involve chemical intervention on the internal scoring mechanism (sensation/emotion) without a corresponding change in the external capacity or objective state (running performance / emotional processing).

  *   **If you keep Case 10 as "Fine":** You must admit that **Case 8 is also "Fine."** If damping grief to get through the week is permissible signal-decoupling for the sake of function, then dampening the pain of running to get through the workout is permissible signal-decoupling for the sake of health consistency. You cannot have one without the other.
  *   **If you keep Case 8 as "Bothersome/Not Fine":** You must reclassify **Case 10 as "Bothersome/Not Fine."** You can still acknowledge it is *therapeutically necessary*, but you must categorize it as a **Fidelity Violation**. It is a "necessary evil" where we sacrifice truth-tracking (feeling the grief) for survival (functioning). It does not belong in the "Fine/Admirable" category with Case 7 (Training).

  **Why Case 12 stays:**
  Case 12 is safe *only if* you strictly define the Latent Objective as "Student Competence" and not "Student Rating." If the objective is "Student Rating," Case 12 is identical to Case 6 (manipulating humans to give higher scores). You must maintain the distinction that **teaching** changes the human's *capacity to judge/learn* (Fidelity/Competence up), whereas **recommending** changes the human's *preferences to match the product* (Fidelity/autonomy down).

  **Summary of Required Shift:**
  To make the principle work without exceptions, you must group **Case 8** and **Case 10** together. They are both **Signal Decoupling**.
  *   **Case 7** is **Objective Advancement** (Capacity changed).
  *   **Case 8 & 10** are **Signal Decoupling** (Sensation changed, Capacity constant).

  If you accept this, you resolve the "unnamed category" for Case 8. The name is **Signal Decoupling**. Sometimes Decoupling is malicious (Case 1), sometimes it is desperate (Case 10), sometimes it is hedonic (Case 8). But they are all the same structural violation of Latent Fidelity.
