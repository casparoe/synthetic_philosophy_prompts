      *   *The Demarcation:* Pseudohistory often isolates one line of evidence (astronomy/stats) and allows it to trump all others without providing a causal mechanism for *how* the error occurred on a global scale (e.g., how do you fake tree rings across continents?).

  5.  **Formulate the Diagnosis:**
      *   **Type:** Substantive methodological disagreement masked as an empirical one, rooted in divergent epistemologies of evidence.
      *   **Hidden Issue:** The *conditions for theory replacement*. Fomenko applies a "falsificationist" logic (one anomaly breaks the chain) without offering a "research program" (Lakatos) that explains the protective belt of evidence (archaeology, linguistics) that mainstream history maintains.
      *   **Ill-posed?** The demarcation isn't ill-posed, but the *criteria* need shifting from "truth claims" to "methodological robustness."

