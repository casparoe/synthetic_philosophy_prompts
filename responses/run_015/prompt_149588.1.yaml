answer: |-
  This is a sophisticated impasse that cuts to the core of historical epistemology. Your working hypothesis is close, but it risks framing the disagreement as merely a difference in explanatory style (narrative vs. statistical). It is deeper than that. The deadlock persists because your group is likely treating Fomenko's New Chronology as a *rival historical theory*, when it is structurally a *mathematical critique of textual transmission* that fails to meet the ontological requirements of historical inquiry.

  Here is the diagnosis of the disagreement, the identification of the hidden substantive issue, and the specification of what constitutes progress.

  ### 1. Diagnosis: Substantive Methodological Disagreement (Not Verbal or Incommensurable)

  The disagreement is **substantive**, not verbal. Both sides are making truth-claims about the same physical past (e.g., the age of the Pyramids, the date of the Almagest). It is also not strictly **incommensurable**, as both sides appeal to astronomical data and textual records; they disagree on how to weigh and interpret that data, not on the language used to describe it.

  The core conflict is **epistemological and metaphysical**:
  *   **Fomenko's Ontology:** History is essentially an information problem. Texts and star catalogs are data strings. If two data strings correlate statistically, they represent the same event. Physical context (stratigraphy, material culture) is secondary and assumed to be malleable or misinterpreted.
  *   **Mainstream Ontology:** History is a causal-physical problem. Texts are artifacts embedded in material contexts. Chronology is established by the *consilience* of independent physical processes (radioactive decay, tree ring growth, sediment deposition) alongside textual criticism.

  The deadlock occurs because Fomenko treats statistical correlation as a **sufficient condition** for chronological identity, whereas mainstream history treats it as a **necessary but insufficient condition** that must be validated by physical causality. When historians reject Fomenko, they are not just defending a narrative; they are defending the principle that *physical traces constrain textual interpretation*, not vice versa.

  ### 2. The Hidden Substantive Issue: The "Causal Mechanism of Error"

  The concealed empirical issue that, if resolved, would dissolve the debate is the **burden of causal explanation for the alleged fabrication.**

  Fomenko's method relies on *negative* evidence (inconsistencies in traditional chronology) and *isolated* positive evidence (astronomical configurations). However, for his theory to be historically admissible, it must provide a plausible causal mechanism for how the "false" chronology was physically instantiated.
  *   **The Mainstream Requirement:** To move conventional chronology from 2500 BCE to 1000 CE, one must explain how physical evidence across multiple independent domains was falsified. This includes:
      *   **Dendrochronology:** Tree-ring sequences in Europe, North America, and Asia that cross-match continuously back beyond Fomenko's timeline.
      *   **Radiocarbon Calibration:** The agreement between C-14 dating and tree rings/stratigraphy.
      *   **Linguistic Evolution:** The time required for Proto-Indo-European to diverge into the attested medieval languages.
      *   **Ice Cores/Sediment:** Annual layering in geology that corresponds to the "missing" time.

  **The Deadlock:** Fomenko dismisses these as "misread" or "fabricated" without offering a physical mechanism for how a medieval conspiracy could fake tree rings in preserved wood across continents or alter isotopic decay rates. Mainstream historians treat this omission as fatal.

  **The Hidden Formal Issue:** Fomenko's statistical method suffers from **selection bias and the look-elsewhere effect**. By scanning vast dynastic lists for patterns, correlations are mathematically inevitable (apophenia). The substantive disagreement is whether *statistical probability without causal mechanism* constitutes historical evidence. Mainstream history says no; Fomenko says yes.

  ### 3. Is the Demarcation Question Ill-Posed?

  The demarcation question is **well-posed**, but your group may be applying the wrong criteria. If you attempt to demarcate based on "narrative coherence" vs. "statistical rigor," you will remain deadlocked, because Fomenko can always claim his statistics are more rigorous than your narratives.

  The demarcation must instead be based on **Explanatory Scope and Physical Constraint**.
  *   **Legitimate History:** Must account for the *physical existence* of the evidence (why does this pottery exist in this layer?) and requires *cross-domain consilience* (text + carbon + stratigraphy must align).
  *   **Pseudohistory:** Permits the isolation of one line of evidence (text/astronomy) to override all others without providing a causal mechanism for the discrepancy.

  The impasse signals that your group is trying to arbitrate a *mathematical claim* using *historical norms*, or vice versa. Fomenko is playing a game of pattern recognition; historians are playing a game of causal reconstruction.

  ### 4. What Counts as Progress?

  To break the deadlock, your working group should abandon the attempt to find a "principled demarcation" that convinces Fomenko's adherents (who operate on a different epistemic foundation) and instead articulate a **Methodological Rule of Admissibility** for historical theory.

  **Progress is defined by establishing the "Consilience Constraint."**

  You should formulate a rule stating: *A chronological revision is admissible only if it provides a causal mechanism that explains the physical state of independent dating markers (dendro, radiometric, stratigraphic) as well as or better than the incumbent theory.*

  **Specific Actions for the Working Group:**
  1.  **Shift the Burden:** Stop debating the statistical correlations of king lists. That is a closed loop of textual analysis. Move the debate to **material anchors**. Ask specifically: "What is the physical mechanism by which 1,500 years of tree-ring data were fabricated?" If the answer is "it wasn't fabricated, it was misdated," demand the physical proof of that misdating.
  2.  **Formalize the Error:** Demonstrate that Fomenko's statistical method yields false positives when applied to known, verified data sets (e.g., apply his dynastic correlation method to the clearly documented history of the last 500 years to see if it falsely collapses distinct reigns). If his method fails on verified data, it is formally invalid for unverified data.
  3.  **Accept the Deadlock (if necessary):** If Fomenko's proponents refuse to engage with physical constraints (insisting that all physical dating is part of the conspiracy), you must conclude that the disagreement is **foundational**. In this case, progress is the honest argument that **historical materialism is a prerequisite for the discipline.** You demarcate pseudohistory not by its conclusions, but by its refusal to submit textual claims to physical falsification.

  **Summary Recommendation:**
  Do not treat this as a dispute over *interpretation*. Treat it as a dispute over *admissibility*. The principled demarcation is this: **Legitimate historical methodology requires that textual claims be subordinate to physical constraints when the two conflict, unless a physical mechanism for the textual priority is demonstrated.** Fomenko's New Chronology fails this rule not because it is statistically wrong, but because it is physically silent. Progress is achieved when your group codifies this **Physical Consilience Requirement** as a necessary condition for historical validity.
