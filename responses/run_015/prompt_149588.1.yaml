      *   *Mainstream Method:* Consilience of evidence (archaeology, philology, dendrochronology, radiocarbon, stratigraphy). It relies on causal mechanisms (how texts were copied, how pottery styles evolve, how carbon decays). It views inconsistencies as noise or local errors, not global fabrication.
      *   *The Clash:* Fomenko isolates specific data points (astronomical configurations, name similarities) and treats them as sufficient conditions for chronological revision. Mainstream history treats these as necessary but not sufficient, requiring integration with physical context.

  3.  **Evaluate the Nature of the Disagreement:**
      *   *Is it Verbal?* No. They aren't just defining "history" differently; they are making conflicting claims about the physical past (e.g., did the Pyramids exist in 2500 BCE or 1000 CE?).
      *   *Is it Incommensurable?* Partially. Fomenko operates in a closed mathematical system where texts are abstract strings. Mainstream history operates in a physical/causal system where texts are artifacts. However, they *do* overlap on astronomical data, which is theoretically testable.
      *   *Is it Substantive?* Yes, but layered.
