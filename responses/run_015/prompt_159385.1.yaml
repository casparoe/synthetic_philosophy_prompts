  2.  **Deconstruct the Rietdijk–Putnam Argument (Mental Sandbox):**
      *   *Premise 1:* Special Relativity (SR) is true.
      *   *Premise 2:* Simultaneity is relative to inertial frames.
      *   *Premise 3:* If two events are simultaneous for an observer, they are equally real (presentism assumes a privileged "now").
      *   *Premise 4:* Different observers have different "nows" that include different future/past events of others.
      *   *Conclusion:* Therefore, future events are as real as past events (Eternalism).
      *   *The Trap:* Confusing "real" with "determined/fixed" or "observable." Confusing "relativity of simultaneity" with "signal delay."

  3.  **Drafting Section 1: Order of Components & Dependencies:**
      *   *Goal:* Prevent premature use of tensed language ("now", "already").
      *   *Step 1: The Geometry of Spacetime.* Need to establish that spacetime is a manifold where events exist coordinates. Before talking about "slices," they need to accept "events" as points.
      *   *Step 2: Relativity of Simultaneity (RoS).* Crucial distinction: It's not about light travel time (signal delay). It's about how frames carve up spacetime. *Dependency:* Must establish RoS before slices.
      *   *Step 3: The Slice.* Define a plane of simultaneity.
      *   *Step 4: The "Now" Ban.* Do not allow "now" or "already" until *after* the geometric setup is complete. If introduced early, students treat "now" as metaphysical privilege rather than coordinate choice.
      *   *Why:* If "now" is introduced early, it smuggles in Presentism. The argument works by showing "now" is frame-dependent, thereby undermining Presentism.
      *   *Sequence:* Events $\rightarrow$ Frames $\rightarrow$ RoS (distant events) $\rightarrow$ Slices $\rightarrow$ *Then* allow "now" to be problematized.

  4.  **Drafting Section 2: The Carrier Case:**
      *   *Candidate:* Andromeda Paradox (Penrose). Two walkers, one moving towards Andromeda, one away. Their slices cut through Andromeda's timeline differently (fleet launched vs. not launched).
      *   *Verdict:* Yes, this is the right carrier. It maximizes the distance to make the tilt of the slice significant.
      *   *Must Contain:* Purely inertial motion, vast distance (to make the time difference large), distinct events (decision made vs. not made).
      *   *Must Avoid:* Any mention of *seeing* the light. The walkers cannot know the status of Andromeda yet. It must be about *ontological status*, not epistemic access.
      *   *Why not Train/Lightning?* Train/lightning is good for establishing RoS, but Andromeda is better for the *metaphysical* punch (future decisions). Train is too local; the time difference is negligible for human scales. Andromeda makes the "future/past" distinction stark.
      *   *Vividness:* Needs to emphasize the *tilt* of the slice.

  5.  **Drafting Section 3: The Key Distinction:**
      *   *Thesis A:* No frame-invariant present (Relativity of Simultaneity).
      *   *Thesis B:* Future is determinate/fixed (Fatalism/Eternalism).
      *   *Connection:* RP argues A $\rightarrow$ B.
      *   *When to draw:* *After* the argument is run, as a reflection. If drawn before, it feels like a lecture. If drawn after, it feels like a realization.
      *   *How:* Ask: "Does the lack of a shared 'now' force the future to be fixed, or just force us to give up the idea that only the 'now' exists?"
      *   *Discovery:* Let them feel the tension. "If the Andromeda decision is real for Walker A, but future for Walker B, is it fixed?"

  6.  **Drafting Section 4: Misconceptions:**
      *   *1. Observation/Signal Delay:* Head off at Step 2 (RoS). Emphasize this is about coordinates, not light arrival.
      *   *2. Fatalism/Deliberation:* Head off at the Conclusion phase. Distinguish "real" from "causally determined."
      *   *3. Merely Perspectival:* Head off when discussing "Reality." If reality is frame-relative, is it real? Need to argue for the "Block" view where all slices are equally valid parts of the whole.
      *   *4. Under-reaction:* "So what?" Head off by linking to the "already" claim they arrived with.
