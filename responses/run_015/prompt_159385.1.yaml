answer: |-
  ### 1. Order of Components and Dependencies

  **The Sequence:**
  1.  **Events as Coordinates:** Establish that an "event" is a point in spacetime $(x, t)$, not a happening that "occurs" only when observed.
  2.  **Frames as Grids:** Define an inertial frame not as a viewpoint, but as a coordinate grid laid over spacetime.
  3.  **Relativity of Simultaneity (RoS):** Demonstrate that two events spacelike separated can have $t_1 = t_2$ in Grid A and $t_1 < t_2$ in Grid B.
  4.  **The Simultaneity Slice:** Define the "plane of simultaneity" as the set of events sharing a coordinate time in a specific frame.
  5.  **The Ontological Premise:** Introduce the principle: "If an event is present for an observer, it is real."
  6.  **The Argument:** Chain the slices (Walker A's present includes Andromeda decision; Walker B's present includes Andromeda pre-decision).
  7.  **The Conclusion:** Therefore, the decision is real (tenselessly) regardless of the slice.

  **The Dependency Logic:**
  You cannot introduce the **Simultaneity Slice** until **RoS** is secured. If students think simultaneity is absolute, the slice is universal and the argument collapses. You cannot introduce **RoS** until **Events** and **Frames** are defined; otherwise, they will treat frames as "perspectives" rather than geometric structures.

  **The Ban on "Now" and "Already":**
  *   **When permitted:** The word "now" may only be introduced at **Step 5 (The Ontological Premise)**, and only in quotation marks or as the *target* of the argument. The word "already" is permitted only at **Step 7 (The Conclusion)**, to describe the *alleged* upshot.
  *   **What goes wrong if earlier:** If "now" is allowed during Steps 1–3, students will smuggle in **Presentism** (the view that only the present exists) as a hidden premise. They will treat "now" as a metaphysical spotlight rather than a coordinate label. If "already" is allowed before the conclusion, they will conflate *ontological existence* with *causal fixity*, leading to premature fatalism rather than a derived conclusion about the block universe. The confusion you suspect is real: "now" does the geometric work, "already" does the metaphysical work. Keep them separated until the bridge is built.

  ### 2. The Carrier Case

  **Verdict:** Use the **Andromeda-style case**. Do not switch to the train-and-lightning arrangement for the main argument, though you may use the train *diagrammatically* to explain the tilt of the slice.

  **Why Andromeda:**
  The train case is excellent for establishing RoS (Step 3), but the time differences are nanoseconds. For first-year philosophers, nanoseconds feel like "measurement error," not "metaphysical difference." Andromeda provides a distance ($2.5$ million light-years) where a walking-speed difference in velocity tilts the simultaneity slice enough to encompass days or weeks of Earth-time equivalents. This makes the "decision made vs. not made" distinction vivid.

  **What it must contain:**
  *   **Inertial Motion:** The walkers must be moving at constant velocity past each other at the moment of comparison.
  *   **Spacelike Separation:** Emphasize that the Andromeda event is outside the light cone of the walkers.
  *   **The Tilt:** Visually demonstrate (on a board) how a tiny change in velocity angle at the origin creates a massive shift in intersection point at a distant $x$.

  **What it must avoid:**
  *   **Observation:** You must explicitly state: "Neither walker can *see* the decision yet. This is not about light reaching their eyes." If they think this is about signal delay, they will revert to the idea that the event "hasn't happened" because the news hasn't arrived.
  *   **Causal Influence:** Ensure they do not think the walkers' walking *causes* the decision in Andromeda. It is about *classification*, not causation.

  ### 3. The Key Distinction

  **The Distinction:**
  1.  **Thesis A (Geometric):** There is no frame-invariant present (Presentism is false).
  2.  **Thesis B (Modal):** Future events are as determinate as past ones (Fatalism/Eternalism is true).

  **When to draw it:**
  Draw this distinction **immediately after Step 7 (The Conclusion)**, before opening the floor to objections.

  **How to build it as a discovery:**
  Do not present this as a taxonomy. Instead, ask: "The argument shows the Andromeda decision exists on Walker A's slice. Does that mean the decision was *caused* by the past? Or does it just mean the decision *exists* in the block?"
  Guide them to see that RP proves Thesis A directly. Thesis B follows *only if* you assume that "existing in the block" implies "fixed relative to deliberation."
  Ask: "If I am Walker B, and the decision is in my future, can I change it?"
  *   If they say "No," they have accepted Thesis B.
  *   If they say "Yes, but it will still exist in the block," they have separated A from B.
  This lands as a discovery because they realize the physics forces A, but B requires an extra philosophical step about the nature of time and agency. The disturbance comes from B, not A.

  ### 4. Misconceptions and Intervention Points

  1.  **"It's about signal delay."**
      *   *Intervention:* **Step 3 (RoS).** Explicitly state: "We are not calculating when light arrives. We are calculating what coordinate time is assigned to the event."
  2.  **"It's merely perspectival (uninformative about reality)."**
      *   *Intervention:* **Step 6 (The Argument).** When chaining slices, ask: "If reality depended on the perspective, Walker A and Walker B would live in different universes. But they meet at the same spacetime point. There is only one spacetime." This forces the move from "perspective" to "structure."
  3.  **"Nothing metaphysical follows (Under-reaction)."**
      *   *Intervention:* **Step 7 (Conclusion).** Remind them of their incoming belief: "You arrived thinking physics says the future is settled. This argument is the engine for that claim. If you reject the conclusion, you must reject the premise that 'present events are real'."
  4.  **"Fatalism about deliberation."**
      *   *Intervention:* **Section 3 (The Distinction).** Use the distinction to show that "real" does not mean "causally determined." The event is real, but the causal chain leading to it may include your deliberation.
  5.  **"Why don't we remember the future?"**
      *   *Intervention:* **Section 3 (The Distinction).** Classify this as an **epistemic/thermodynamic** constraint, not an ontological one. "Memory requires entropy increase. The block exists, but our access is constrained by the arrow of time."
  6.  **"Reality relative to an observer is not transitive." (The Sharp Objection)**
      *   *Intervention:* **After Section 3, before Closing.** Raise this as the "Presentist's Best Defense."
      *   *How to sharpen:* Do not let it end the session. Ask: "If 'real for A' and 'real for B' does not imply 'real simpliciter', what does 'real' mean?" Force them to see that denying transitivity makes reality a fragmented property. To sharpen the RP argument, argue that physics seeks *invariants*. If existence is not invariant (or at least consistent across frames), physics loses its objectivity. This turns the objection into a dilemma: either accept the Block (transitive reality) or accept that reality is fundamentally frame-dependent (which undermines the idea of a single physical world).

  ### 5. Omissions

  1.  **Lorentz Transformations:** "We need the geometry of the slices, not the algebra of the coordinates."
  2.  **General Relativistic Global Slicing:** "We are assuming a flat spacetime sandbox to test the logic of Special Relativity."
  3.  **Free Will Literature (Compatibilism etc.):** "We are analyzing the physics claim, not defending agency."

  ### 6. Closing Question

  **The Question:**
  "Suppose we keep every empirical prediction of special relativity intact but add to the world a physically undetectable preferred foliation (a hidden 'true' present). Which of our two theses does this addition refute?"

  **Why this is the right discriminator:**
  It tests whether they understand that the Rietdijk–Putnam argument relies on the *absence* of a privileged frame to force Eternalism. If a preferred foliation exists (even if undetectable), Presentism becomes viable again (Thesis A is refuted), but the future could still be fixed (Thesis B remains open).

  **Scoring:**
  *   **Success:** "It refutes Thesis A (No frame-invariant present), because there *would* be a true present. It does not necessarily refute Thesis B (Future determinate), because the hidden time could still fix events." (Shows they see RP hinges on the relativity of simultaneity killing Presentism).
  *   **Near-miss:** "It refutes Thesis B." (They confuse the existence of a present with the openness of the future).
  *   **Failure:** "It refutes neither; it changes nothing." (They fail to see that a preferred foliation restores the metaphysical possibility of Presentism, which RP was designed to eliminate).
