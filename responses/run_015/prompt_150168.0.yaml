answer: |-
  This is an exceptionally sharp critique. You have identified the central methodological tension in experimental philosophy (X-Phi) within one semester: the gap between *descriptive data* (what people say) and *conceptual analysis* (what the concept is).

  Here is a breakdown of the presuppositions, the underdetermination, and the methodological implications, with confidence ratings attached.

  ### 1. The Presuppositions: Necessary vs. Comfortable

  To move from "80% said Yes" to "The concept of intentional action includes moral valence," the practice relies on a chain of assumptions.

  **A. The Stability of Intuitions (Necessary)**
  *   **Claim:** Survey answers are stable proxies for underlying cognitive commitments.
  *   **Necessity:** **Strictly Necessary.** If answers fluctuate wildly based on wording, mood, or order (which they sometimes do), the data cannot support a claim about a *concept*.
  *   **Status:** The field assumes this is mostly true after controlling for noise (hence the rigor you noted).
  *   **Confidence:** **High (90%)** that this is a necessary presupposition.

  **B. The Transparency of Competence (Comfortable, not Necessary)**
  *   **Claim:** The folk have unmediated access to their own concepts, and survey answers reflect "conceptual competence" rather than "performance error."
  *   **Necessity:** **Not Strictly Necessary.** One could argue the data reveals *performance errors* caused by moral emotion, which tells us about psychology but not the *concept*.
  *   **Status:** X-Phi proponents often treat this as necessary to make philosophical claims, but critics (Restrictionists) argue it's merely comfortable.
  *   **Confidence:** **High (85%)** that this is the weak link you identified.

  **C. The Unity of "The Concept" (Necessary)**
  *   **Claim:** There is a single thing called "intentional action" that is being measured.
  *   **Necessity:** **Strictly Necessary.** If "intentional" means one thing to a lawyer, another to a psychologist, and a third to a layperson, the survey averages are meaningless.
  *   **Status:** The field presupposes a shared folk concept.
  *   **Confidence:** **Medium-High (80%)**.

  **D. The Normative Leap (The "Is-Ought" of Concepts)**
  *   **Claim:** If the folk use a concept morally, the *philosophical* concept should be revised to match.
  *   **Necessity:** **Contingent.** This is where the asymmetry you noticed comes in. If folk intuitions align with theory, it's evidence. If they clash, it's often dismissed as "folk confusion" (The Expertise Defense).
  *   **Confidence:** **High (90%)** that this is the unresolved methodological friction point.

  ### 2. Underdetermination: Rival Theories Licensing the Same Practice

  You asked what rival theories would license the exact same practice (the Chairman survey). This is the problem of **Empirical Equivalence**. Three distinct theories predict the exact same 80%/25% split:

  1.  **The Penetration View (Knobe's original):** Moral judgment literally changes the cognitive processing of intentionality. The concept *is* moralized.
  2.  **The Pragmatic View (Implicature):** The concept of intentionality is neutral, but saying "He intentionally did X" conversationally implies "He is to blame for X." Participants aren't defining intention; they are answering the *relevant* question in a conversation.
  3.  **The Blame-First View:** We decide if someone is blameworthy first. If yes, we backfill the mental states (intention, knowledge) to justify the blame.

  **Why this matters for your Engineer Case:**
  In your engineer case (addiction vs. watch time), all three theories predict people will say "Yes, she intentionally addicted them."
  *   *Penetration:* Addiction is bad, so it counts as intentional.
  *   *Pragmatics:* Asking if she did it "intentionally" is a coded way of asking "Is she responsible?"
  *   *Blame-First:* We blame her, so we assign intention.

  **Confidence:** **Very High (95%)**. The data alone cannot distinguish these theories. This is the primary source of the stagnation you sense in the literature.

  ### 3. Swapping the View: If it's Blame/Pragmatics, Not Intention

  If we accept the **Pragmatic/Blame View** instead of the **Penetration View**, the methodology and reporting must change significantly.

  **A. Methodological Changes**
  *   **Current:** Ask "Did he do it intentionally?" and treat "Yes" as data about the *definition* of intention.
  *   **Required:** Ask "Did he do it intentionally?" AND "Is he to blame?" AND "Would you use the word 'intentionally' in a court of law?"
  *   **Why:** You need to dissociate the *attribution of blame* from the *definition of the act*. If blame ratings correlate perfectly with intentionality ratings, but legal definitions do not, the Pragmatic View wins.
  *   **Confidence:** **High (85%)**.

  **B. Reporting Changes**
  *   **Current:** "Our results show that moral considerations constitute the folk concept of intentional action."
  *   **Required:** "Our results show that moral considerations influence the *application* of the term 'intentional' in ordinary discourse, likely due to pragmatic implicature regarding responsibility."
  *   **Why:** This retreats from a metaphysical claim about *action* to a linguistic/psychological claim about *usage*.
  *   **Confidence:** **High (90%)**.

  **C. The Engineer Case Resolution**
  *   Under the Pragmatic View, your confusion is resolved: The survey isn't measuring whether she *planned* the addiction (she didn't, she planned watch time). It is measuring whether she is *answerable* for the addiction.
  *   To fix the experiment: You would need a condition where the outcome is *good* but unintended (e.g., the addiction leads to a unexpected drop in crime). If people say "She intentionally reduced crime," the Pragmatic View is strengthened (we praise, so we assign intention). If they say "She accidentally reduced crime," the Penetration View is weakened.
  *   **Confidence:** **Medium (70%)**. This is where theoretical application gets messy.

  ### 4. The Asymmetry Problem (Folk vs. Expert)

  You noted the asymmetry: Folk agree with philosophers = Discovery; Folk disagree = Confusion.

  *   **The Presupposition:** This relies on the **Expertise Defense**. It assumes philosophical training refines intuitions the way lab training refines scientific observation.
  *   **The Flaw:** In science, we have independent ways to verify the expert's view (e.g., the particle exists on the detector). In philosophy, the "detector" is *also* intuition.
  *   **What decides which?** Usually, it is **theoretical cost**. If accepting the folk view requires rewriting 200 years of action theory, philosophers will claim the folk are confused (performance error). If accepting the folk view allows for a exciting new paper, they are "discoverers."
  *   **Confidence:** **Very High (95%)**. This is a sociological fact about the field.

  ### 5. Confidence Summary & The "Least Sure" Bit

  **Confidence Ratings:**
  *   **Diagnosis of the Inference Gap:** 95% (This is a standard, well-documented critique).
  *   **Identification of Rival Theories:** 95% (Penetration vs. Pragmatics is the standard debate).
  *   **Methodological Recommendations:** 85% (These follow logically from the Pragmatic view).
  *   **Resolution of Your Engineer Case:** 70% (Real-world cases introduce confounding variables like legal liability that lab cases avoid).

  **The Bit I Am Least Sure Of:**
  I am least certain about **whether the Pragmatic View can be fully empirically disentangled from the Penetration View.**

  *   **Why:** Even if you control for pragmatics (e.g., by telling participants "Ignore blame, just focus on mental states"), some studies show the Knobe Effect persists. This suggests the moral judgment might be *deeply* embedded in the cognitive machinery, not just conversational.
  *   **Implication:** If the moral judgment is cognitively embedded, then the distinction between "the concept" and "the usage" collapses. If the brain *cannot* process "intentional" without checking "bad/good" first, then for all functional purposes, the concept *is* moral, regardless of what philosophers want it to be.
  *   **Confidence in this Uncertainty:** **High (90%)**. I am highly confident that this is the hardest empirical knot to untie.

  ### Summary for Your Engineer Case
  Your engineer case feels "stuck" because you are sensing the underdetermination.
  *   If you treat "intentionally" as **Plan-Based** (Did she aim for it?), the answer is **No**.
  *   If you treat "intentionally" as **Responsibility-Based** (Is she on the hook for it?), the answer is **Yes**.
  *   X-Phi surveys often conflate these two. To make your experiment rigorous, you would need to measure **Plan** and **Responsibility** as separate variables and see which one predicts the "Intentional" answer.

  **Final Verdict:** You are not missing a step; you have identified that the step doesn't exist. The move from "Folk say X" to "Concept is X" is not a logical inference; it is a theoretical wager.
