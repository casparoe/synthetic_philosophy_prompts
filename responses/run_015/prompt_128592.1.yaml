prompt: |-
  ok so i just moved into this coop housing thing last month and ive been noticing something weird about our shared kitchen. there's this big pantry shelf thats technically for everyone, but people have started putting their own sticky notes on specific spots, and now half the shelf is "claimed" even when the food sitting there is expired or nobody actually eats it. its not exactly stealing, and its not like anyone is eating all the groceries, but the shared space is slowly turning into a bunch of private territories. i keep seeing this pattern elsewhere too -- at my old job the shared printer supplies got divided into "this is mine" zones even though the company bought everything.

  is there an actual name for this? i know about tragedy of the commons where everyone overuses a shared resource, but this feels different -- nobody is overusing anything, they're just gradually partitioning the commons into private chunks until the shared part basically vanishes. its like the opposite of overgrazing? or maybe its a subtype? i dont want to just call it "people being selfish" because there seems to be a specific mechanism: once one person marks a spot, everyone else feels pressure to defend their own spot too, and cooperation collapses without anyone actually consuming more.

  if there isnt a standard term, what should i call it, and how is it different from regular free-riding or from the historical enclosure movement? also does it relate to public goods theory at all, since technically the supplies are still available to everyone, they're just... spatially privatized? i feel like im missing a concept here but maybe im just overthinking the sticky notes.
