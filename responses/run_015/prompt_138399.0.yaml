prompt: |-
  I've been reading rationalist blogs and forums for something like fifteen years, so I arrive with the standard toolkit already installed: expected value as the quantity to be maximized, *shut up and multiply* as the rule, the Kelly criterion as the right way to size a repeated favorable bet, and the associated claim that risk aversion over small stakes isn't merely suboptimal but close to incoherent. There's a pattern in real-world institutions that sells gambles that I can't get to line up with any of that, and I'd like you to tell me what theory of rational choice it presupposes.

  The pattern is easier to state against the St. Petersburg game, so let me fix it: a fair coin is tossed until it comes up heads; the stake starts at $2 and doubles with each tail, so the payoff is $2^n where n is the number of the toss on which the first heads appears. The expected payoff diverges. Yet nobody sane pays $25 for one go. The classical fix — diminishing marginal utility of money, Bernoulli's log utility — gives finite, small answers, but it's unstable: crank up the payoff schedule fast enough and the paradox reappears for any unbounded utility function (Menger's point, as I remember it), and there are variants with alternating signs where the expected value isn't well defined at all, since the sum can be rearranged to anything you like.

  I don't want another tour of those resolutions. I want the institutional practice explained. As far as I can tell — correct me on any detail, but this is my impression from the outside — every institution that actually takes the other side of a gamble truncates its own exposure, and truncates it well before the point where the stakes get large relative to its capital:

  - Casinos post a maximum bet, and will restrict or refuse a customer who wants to stake more than it, even though the house has a positive expected value on the bet in question and even though the amount at issue is a rounding error against the parent company's balance sheet. (I mean the cap itself, not the separate business of backing off advantage players, which is just adverse selection and can be set aside.)
  - State lotteries advertise a headline jackpot paid as a graduated annuity over decades, with a cash option worth a fraction of the advertised figure; some national lotteries, I believe, cap the top prize and roll the excess down into lower tiers.
  - Insurers write to a policy limit rather than to an unbounded one, and then pay what I'm told are large multiples of modeled expected loss to lay off the top layer into reinsurance — while computing the premium for the body of the distribution as nothing more than the expected loss plus a loading.
  - Trading firms price with expectation and then run the book against position caps and VaR- or expected-shortfall-style limits.

  So: the same organizations treat expected value as the thing to maximize when they price, and refuse to act on it when they size. And the refusal kicks in at scales where the standard argument — that risk aversion is only defensible when the stake is a meaningful share of your wealth, and that with many independent bets the variance washes out — says it shouldn't.

  Reconstruct the implicit theory for me. What view of rational choice under multiplicative, repeated exposure does this cluster of practices only make sense under, and which views does it quietly rule out? Does it strictly presuppose that expected monetary value is the wrong maximand, or is it fully compatible with straight expected-value maximization plus some non-normative add-on — finite capital, regulatory capital requirements, agency problems inside the firm, Knightian doubt about whether the tail model is right? Give me the strongest version of each candidate underpinning I know of — bounded or concave utility, survival/ruin constraints, and the time-average-growth or ergodicity critique associated with Ole Peters and others — and tell me which ones the practice actually commits you to and which it merely sits well with. In particular, I keep reading that the time-average story is just expected log utility relabeled with physics vocabulary; if that's right, say so, and if it isn't, say what the difference is supposed to buy. Then: suppose the casino were run by an entity with effectively unbounded capital, no ruin constraint, an indefinite horizon, and no regulator — a sovereign treasury, or an AI-managed endowment that expects to still be compounding in ten thousand years. Should it drop the table limits? If yes, does that show the caps were pragmatic all along and not principled? If no, what's the principled reason, and does it survive the fact that the house can spread across thousands of near-independent players?

  One more thing about tone, since this is the part where writing about these topics usually goes wrong. Please separate, explicitly, the mathematics and definitional claims that are settled from the interpretive claims that people who actually work on decision theory and finance dispute, and don't present a contested view as the consensus position — flag where you're giving me your own reconstruction and where you'd expect a specialist to push back, and note what kind of observation would change your answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Deeply familiar with rationalist literature (15+ years), knows the standard toolkit (EV maximization, Kelly, risk aversion critiques, St. Petersburg paradox, Menger's critique, Ole Peters/ergodicity).
      *   **Tone/Style:** Precise, technical, skeptical of hand-waving, demands distinction between settled math and contested interpretation. Wants a reconstruction of *institutional practice*, not just theoretical resolutions.
      *   **Core Question:** Why do institutions (casinos, insurers, traders) price using EV but size using caps/limits, even when stakes are small relative to total capital? What implicit theory of rational choice does this presuppose?
      *   **Specific Sub-questions:**
          *   Reconstruct the implicit theory.
          *   Evaluate candidate underpinnings (bounded utility, ruin constraints, ergodicity/time-average).
          *   Address the "unbounded capital" thought experiment (sovereign/AI).
          *   Distinguish settled math from contested interpretation.
          *   Maintain a neutral, analytical tone (avoid presenting contested views as consensus).

  2.  **Deconstruct the Phenomenon:**
      *   *Observation:* Institutions use EV for pricing (linear) but constraints for sizing (non-linear/hard caps).
      *   *Standard Rationalist View:* If EV > 0 and stake $\ll$ wealth, take the bet. Risk aversion over small stakes is irrational (Rabin's calibration theorem).
      *   *Institutional Reality:* They cap exposure even when stake $\ll$ wealth.
      *   *Key Tension:* Why act as if utility is concave or bounded when the math says it should be linear locally?

  3.  **Evaluate Candidate Theories:**

      *   **Candidate 1: Concave Utility (Bernoulli/von Neumann-Morgenstern).**
          *   *Math:* Settled. If $U(w)$ is concave, you reject favorable bets if variance is high enough relative to curvature.
          *   *Fit:* Explains individual behavior well.
          *   *Problem for Institutions:* Institutions are aggregates. Shareholders can diversify. Why doesn't diversification wash out the risk? (Arrow-Lind theorem). Also, Menger's critique applies to unbounded payoffs.
          *   *Verdict:* Necessary but insufficient for the *institutional* specific of hard caps vs. smooth sizing.

      *   **Candidate 2: Ruin Constraints / Survival (Kelly/Growth Optimal).**
          *   *Math:* Settled that maximizing geometric growth avoids ruin.
          *   *Fit:* Explains why you don't bet everything on +EV.
          *   *Problem:* User notes stakes are "rounding errors" against balance sheets. Why cap a $10k bet if you have $10B?
          *   *Nuance:* It's not just *current* ruin, it's *model* ruin.

      *   **Candidate 3: Knightian Uncertainty / Model Risk.**
          *   *Math:* Not standard probability. Imprecise probabilities.
          *   *Fit:* Very strong for institutions. The tail *model* is the weak point. St. Petersburg relies on infinite horizon/unbounded bankroll which doesn't exist physically.
          *   *Verdict:* This is the strongest pragmatic explanation.

      *   **Candidate 4: Ergodicity / Time-Average (Ole Peters).**
          *   *Claim:* EV is ensemble average; we live in time. Maximize time-average growth rate.
          *   *Math:* Contested. For additive bets, time average = ensemble average. For multiplicative, log utility emerges.
          *   *User's specific query:* Is it just log utility relabeled?
          *   *Analysis:* In many financial contexts, yes, it maps to log utility. But the *philosophical* claim is that EV is category error.
          *   *Verdict:* Useful framing, but functionally often equivalent to Kelly/Criteria in practice.

      *   **Candidate 5: Agency/Regulatory/Capital Constraints.**
          *   *Fit:* Explains the "hard cap" nature better than smooth utility functions. VaR limits are regulatory/accounting, not necessarily ontological.
          *   *Verdict:* Crucial for the "institutional" aspect.

  4.  **Synthesize the "Implicit Theory":**
      *   It's not *one* theory. It's a layered defense.
      *   Layer 1: Pricing is linear (Competitive market pressure + Law of Large Numbers for the *body* of the distribution).
      *   Layer 2: Sizing is constrained (Tail risk + Model uncertainty + Capital friction).
      *   *The "Theory":* **Robust Satisficing under Model Uncertainty with Capital Frictions.**
      *   They treat the *body* as ergodic/diversifiable (EV works). They treat the *tail* as non-ergodic/uncertain (EV breaks).

  5.  **Address the "Unbounded Capital" Thought Experiment:**
      *   If a Sovereign/AI has infinite horizon + infinite capital:
      *   Do they drop limits?
      *   *Physics check:* No entity has infinite capital or time. Energy/matter limits exist.
      *   *Economic check:* If they offer infinite payout, they break the currency/utility system.
      *   *Answer:* Even they shouldn't. Because the *counterparty* cannot pay if the bet reverses, or the payoff becomes meaningless (inflation/utility saturation).
      *   *Principled Reason:* The payoff function $2^n$ assumes money has constant marginal utility. It doesn't. Even for an AI, resources are finite.

  6.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's sophistication. Validate the observation (pricing linear, sizing non-linear).
      *   **Section 1: The Separation of Pricing and Sizing.**
          *   Pricing = Competitive equilibrium + LLN on the body.
          *   Sizing = Tail management + Solvency.
          *   *Settled Math:* LLN applies to i.i.d. sums.
          *   *Contested:* Whether institutional risk is truly i.i.d.
      *   **Section 2: Evaluating the Candidate Underpinnings.**
          *   *Concave Utility:* Rabin's calibration shows small-stake risk aversion is hard to justify with smooth utility. Institutions *act* like they have hard constraints, not smooth curves.
          *   *Ruin/Kelly:* Stronger fit. But why cap below ruin? -> Model Risk.
          *   *Ergodicity (Peters):* Address the "is it just log utility?" question. It's mathematically isomorphic in multiplicative dynamics, but the *ontological* claim differs.
          *   *Knightian Uncertainty:* The winner. The model of the tail is unknown. EV requires a known measure.
      *   **Section 3: The "Unbounded Entity" (Sovereign/AI).**
          *   Should they drop limits? No.
          *   Why? Physical limits to payout. Counterparty risk. Utility saturation.
          *   This shows the cap is principled (resource finiteness), not just pragmatic (current balance sheet).
      *   **Section 4: Settled vs. Contested.**
          *   Explicitly flag what is math vs. interpretation.
      *   **Conclusion:** Summarize the implicit theory.

  7.  **Refining the Tone:**
      *   Avoid "You should think..."
      *   Use "The standard view is...", "A specialist in X would argue..."
      *   Ensure the distinction between *risk* (known prob) and *uncertainty* (unknown prob) is clear.
      *   Check the Rabin Calibration point: Risk aversion over small stakes implies absurd risk aversion over large stakes if derived from expected utility. Institutions avoid this by using *constraints* rather than *utility curvature* for small stakes.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* I initially thought about saying "Institutions maximize shareholder value." But shareholders diversify. Why doesn't that eliminate risk aversion? *Answer:* Frictional costs of bankruptcy, regulatory capital, agency costs. Need to emphasize *frictions*.
      *   *Correction on Peters:* Be careful not to dismiss Peters, but acknowledge the criticism that for many financial problems, time-average growth maximization *is* log-utility maximization. The difference is philosophical justification, not necessarily the output.
      *   *Correction on St. Petersburg:* The user knows Menger. Don't rehash. Focus on the *institutional* truncation. The institution *enforces* the truncation physically (table limits). This resolves the divergence mathematically by making the game finite.

  9.  **Final Polish:** Check against the prompt's specific constraints (tone, explicit separation of math/interpretation, specific sub-questions). Ensure the "Unbounded Entity" answer is decisive. (Decision: Even an unbounded entity faces a bounded universe of value).

  *(Self-Correction during final review)*: Wait, the prompt asks about the *implicit theory of rational choice*. I need to name it. It looks like **Constraint-Based Satisficing under Knightian Uncertainty**. Or **Robust Control**. Let's frame it as "EV for the Body, Robustness for the Tail."

  Let's write.
answer: |-
  This is a precise question about the gap between normative decision theory (as discussed in rationalist circles) and the operational risk management of large financial institutions. You have correctly identified that institutions decouple *pricing* (which is linear/expectation-based) from *sizing* (which is constrained/non-linear), even when the stakes are small relative to aggregate capital.

  Below is a reconstruction of the implicit theory governing this behavior, followed by an evaluation of the candidate underpinnings you listed, the "unbounded entity" thought experiment, and an explicit separation of settled mathematics from contested interpretation.

  ### 1. The Implicit Theory: "Linear Pricing, Robust Sizing"

  The cluster of practices you describe (casinos, insurers, trading desks) presupposes a hybrid theory of rational choice that I will label **Expectation under Known Measures, Robustness under Unknown Measures.**

  In this framework, the institution treats the *body* of the probability distribution as a domain of **Risk** (known probabilities, i.i.d. trials) where Expected Value (EV) is the correct maximand due to the Law of Large Numbers (LLN). However, it treats the *tail* of the distribution as a domain of **Uncertainty** (unknown or unstable probabilities, potential correlation breakdown) where EV is undefined or misleading, and survival constraints take precedence.

  This is not merely "risk aversion" in the von Neumann-Morgenstern (vNM) sense. A smooth, concave utility function implies a continuous trade-off between risk and return. Institutional limits are often *hard constraints* (step functions). This suggests the underlying objective function is not global utility maximization, but **constrained optimization**:
  $$ \text{Maximize } E[\text{Profit}] \quad \text{subject to } P(\text{Ruins}) < \epsilon \quad \text{and} \quad \text{Model Validity} \in \mathcal{V} $$

  The "refusal to act on EV" at small scales is not a denial of EV's validity in the body, but a recognition that **tail exposure invalidates the measure used to calculate the EV.** If the payoff structure allows for outcomes that breach the validity of the probability model (e.g., counterparty collapse, systemic correlation, physical inability to pay), the EV calculation is garbage-in-garbage-out.

  ### 2. Evaluating Candidate Underpinnings

  Here is how the standard candidate theories map onto the institutional practice, distinguishing settled math from interpretive claims.

  #### A. Concave Utility (Bernoulli / vNM)
  *   **The Claim:** Institutions act as if they have a concave utility function over wealth.
  *   **Settled Math:** If utility $U(w)$ is concave, a positive EV bet can be rejected if the variance is sufficiently high relative to the curvature.
  *   **The Mismatch:** As you noted, Rabin's calibration theorem shows that rejecting small-stake favorable bets implies absurd levels of risk aversion for large stakes if derived from a single smooth utility function. Furthermore, institutions are owned by diversified shareholders who *should* be risk-neutral over idiosyncratic firm risk (Arrow-Lind theorem).
  *   **Verdict:** **Rejected as the primary explanation.** While utility curvature exists, it cannot explain hard caps on "rounding error" bets without invoking frictions. Specialists in corporate finance would push back hard on the idea that public firms maximize a concave utility of equity rather than share price.

  #### B. Survival / Ruin Constraints (Kelly / Growth Optimal)
  *   **The Claim:** Institutions maximize geometric growth rate to avoid absorption (ruin).
  *   **Settled Math:** In repeated multiplicative betting, maximizing arithmetic EV leads to ruin with probability 1. Maximizing geometric growth (Kelly) avoids this.
  *   **The Mismatch:** You correctly point out that caps are often set well below the point of ruin. A casino with \$1B capital doesn't need a \$10k table limit to avoid ruin on a single hand.
  *   **Verdict:** **Necessary but insufficient.** Survival is a *constraint*, not the whole objective. The caps are tighter than pure survival requires because "ruin" is not just \$0 equity; it is *regulatory* ruin, *reputational* ruin, or *liquidity* ruin. This fits the practice but requires expanding the definition of "ruin."

  #### C. Knightian Uncertainty / Model Risk
  *   **The Claim:** The probability measure for the tail is unknown or unstable. EV requires a known measure $\mu$. If $\mu$ is unknown, $E_\mu[X]$ is undefined.
  *   **Settled Math:** Expectation is an integral over a measure. If the measure is ambiguous (e.g., a set of priors rather than a single distribution), the standard EV maximization rule does not apply. Robust control theory (Hansen-Sargent) suggests optimizing for the worst-case within a set of plausible models.
  *   **Fit:** **Strongest fit.** This explains why pricing is linear (the body is well-modeled) but sizing is capped (the tail is poorly modeled). The St. Petersburg game assumes a physical ability to pay $2^{100}$. No institution models the probability of having $2^{100}$ dollars as 1. They model it as 0 beyond a certain horizon. By capping the bet, they enforce the finiteness of the game, rendering the EV finite and calculable.
  *   **Verdict:** **Primary Driver.** The cap is a declaration that "our model does not extend beyond this point."

  #### D. Ergodicity / Time-Average (Ole Peters)
  *   **The Claim:** EV is an ensemble average; rational agents live in time. One should maximize the time-average growth rate.
  *   **Settled Math:** For multiplicative dynamics, the time-average growth rate is the geometric mean. Maximizing this is mathematically isomorphic to maximizing Expected Log Utility.
  *   **The Contested Claim:** Peters argues this is a *category error* correction, not just a utility function choice. He claims EV is physically irrelevant for non-ergodic processes.
  *   **Is it just Log Utility?** **Functionally, yes.** In the context of repeated financial betting, the time-average prescription yields the Kelly criterion, which is equivalent to log-utility maximization. The "physics vocabulary" buys a philosophical justification for why we shouldn't use ensemble averages, but it does not produce a different sizing algorithm than standard Kelly for this class of problems.
  *   **Verdict:** **Compatible, but not distinct in output.** It explains *why* one might prioritize growth over arithmetic mean, but it doesn't explain the *hard caps* better than Model Risk does. A log-utility agent sizes smoothly; institutions size with cliffs.

  ### 3. The "Unbounded Entity" Thought Experiment

  > *Suppose the casino were run by an entity with effectively unbounded capital, no ruin constraint, an indefinite horizon, and no regulator... Should it drop the table limits?*

  **Answer: No.**

  **Reasoning:**
  Even a sovereign treasury or an AI endowment faces **physical and semantic bounds on value**.

  1.  **Resource Finiteness:** The payoff $2^n$ is denominated in currency. Currency is a claim on real resources. The total energy/matter/computational substrate available in the accessible universe is finite. At some $n$, $2^n$ exceeds the total value of the economy. The payoff function becomes physically undefined.
  2.  **Marginal Utility Saturation:** Even for an AI, "utility" must be grounded in some objective function (e.g., paperclips, compute, entropy reduction). Any physically realizable utility function is bounded. You cannot have infinite utility. Therefore, the *expected utility* of the St. Petersburg game converges, even if the *expected monetary payoff* diverges.
  3.  **Counterparty Incoherence:** If the entity offers a bet with unbounded liability, it implicitly promises to destroy its own operational capacity to honor the bet if the tail strikes. This makes the promise non-credible. A rational counterparty knows the bet will be voided *de facto* if the number gets too big, so the price they are willing to pay is capped regardless of the house's capital.

  **Implication:**
  This shows the caps are **principled**, not merely pragmatic. They reflect the finiteness of the value system in which the bet is embedded. An entity that did not cap the bet would be offering a contract it physically could not fulfill, which is a form of fraud or model error.

  ### 4. Separation of Settled Math vs. Contested Interpretation

  Per your request, here is the explicit breakdown of what is mathematical fact and what is subject to specialist dispute.

  | Claim | Status | Notes / Where Specialists Push Back |
  | :--- | :--- | :--- |
  | **EV of St. Petersburg diverges.** | **Settled Math.** | $\sum (1/2^n) \cdot 2^n = \sum 1 = \infty$. |
  | **Any unbounded utility function allows a modified St. Petersburg paradox.** | **Settled Math.** | Menger (1934) proved this. If $U$ is unbounded, payoffs can be scaled to diverge. |
  | **Risk aversion over small stakes implies absurd aversion over large stakes (Rabin).** | **Settled Math (within EU).** | Holds *if* preferences satisfy Expected Utility axioms globally. |
  | **Institutions maximize Shareholder Value.** | **Contested.** | Agency theory suggests managers maximize utility of tenure/compensation, which implies risk aversion distinct from shareholders. |
  | **Diversification eliminates idiosyncratic risk (Arrow-Lind).** | **Contested in practice.** | Holds in frictionless markets. Frictions (bankruptcy costs, capital requirements) make firm-level risk aversion rational. |
  | **Time-Average Maximization $\neq$ Expected Utility Maximization.** | **Contested.** | Peters claims they are distinct paradigms. Many economists argue time-average maximization *is* a specific subset of EU (Log Utility). |
  | **Probability measures for tail events are known.** | **False (Empirical).** | There is consensus that tail probabilities are estimated with high error (Knightian Uncertainty). |
  | **Rational agents should maximize Arithmetic EV.** | **Contested.** | Rationalists often argue "Yes" (for small bets). Finance practitioners argue "No" (due to path dependence/ruin). |

  ### 5. Reconstruction of the Institutional Worldview

  If I were to write the internal memo for a Chief Risk Officer explaining why we price at EV but cap at $X$, it would read like this:

  1.  **Pricing:** For the bulk of the distribution (95%+), outcomes are independent and our model is calibrated. Here, the Law of Large Numbers applies. We are price-takers in a competitive market. Pricing at EV (plus loading) is required to compete.
  2.  **Sizing:** For the tail (<5%), independence assumptions break down (correlations go to 1 in crises) and our model is extrapolated. Here, the EV calculation is sensitive to unobservable parameters.
  3.  **The Cap:** The cap is not a statement about our current wealth. It is a statement about the **validity domain of our model**. We refuse to trade outside the domain where we believe our probability measure is accurate.
  4.  **Rationality:** It is rational to maximize EV *only when* the probability measure is robust. When the measure is fragile, the rational choice is to satisfy survival constraints first.

  ### 6. What Would Change This Answer?

  *   **Observation:** If an institution with hard caps was consistently outcompeted by one without caps over a 50-year horizon (including multiple crises), that would suggest the caps are indeed inefficient frictions. (Historical data suggests the opposite; uncapped tail exposure tends to lead to blow-ups).
  *   **Mathematical Development:** If a decision theory were formalized that could handle unbounded payoffs without requiring bounded utility or hard truncation, while remaining robust to model error. (Currently, no such consensus theory exists).
  *   **Market Structure:** If insurance derivatives markets became perfectly liquid for infinite tails (e.g., someone willing to sell unlimited reinsurance), the need for internal caps would diminish. (This does not exist; reinsurers also cap).

  ### Summary

  The institutional practice presupposes **Expected Value Maximization subject to Model Validity Constraints.**

  It rules out **naive Expected Value Maximization** (which ignores measure uncertainty) and **smooth Global Utility Maximization** (which cannot explain hard caps on small stakes without absurd calibration).

  It sits well with **Kelly/Growth criteria** (as a survival constraint) and **Knightian Uncertainty** (as the justification for the cap).

  The time-average/ergodicity critique is **mathematically isomorphic to Log-Utility** in this context; its primary contribution is philosophical (rejecting the ensemble average as the default), not computational.

  Even an unbounded entity should not drop the limits, because the **payoff function itself becomes physically undefined** beyond the resource limits of the universe. The cap is therefore a recognition of physical reality, not just balance sheet pragmatism.
