answer: |-
  **BRIEFING NOTE**

  **TO:** Constitutional-Reform Commission
  **FROM:** Technical Secretariat
  **SUBJECT:** Disambiguation of "The Will of the People" regarding the Confirmatory Suspension Rule
  **DATE:** 24 May 2024

  **1. PURPOSE**
  This note disambiguates the phrase "the will of the people" to resolve the deadlock regarding the *confirmatory suspension rule*. The current impasse arises because two commissioners employ the same phrase to denote incompatible political ontologies. This note provides a menu of competing theses, diagnoses the commissioners' positions, evaluates the Secretariat's hypothesis regarding the mechanism's design, and addresses three specific drafting wrinkles.

  **2. MENU OF THESES ON "THE WILL OF THE PEOPLE"**

  | Thesis | Definition | Conditions for Truth | Verdict | Institutional Consequence |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Aggregative / Majoritarian** | The sum of actual preferences expressed via voting. | Preferences are stable, intelligible, and captured accurately by the ballot. | **Substantive but fragile.** Vulnerable to the "bundle problem" (voters choose parties, not statutes). | **Elections are supreme.** Mechanisms like the Assembly are illegitimate overrides of the vote count. |
  | **2. Counterfactual-Deliberative** | What people *would* will under idealized conditions (informed, reflective, uncoerced). | There is a stable "true" preference distinct from actual preference, accessible via deliberation. | **Defensible but indeterminate.** Depends entirely on how "ideal conditions" are specified. | **Deliberative bodies (like the Assembly) are superior.** Elections are merely rough proxies. |
  | **3. General-Will (Rousseauian)** | The common interest, distinct from the "will of all" (sum of private interests). | A common good exists objectively and is distinguishable from aggregate private gain. | **Metaphysically heavy.** Risks incoherence if the "common good" cannot be empirically identified. | **Veto on factionalism.** Institutions must filter out private interest (e.g., blindfolds, sortition). |
  | **4. Corporate-Group-Agent** | The People as a single legal/moral person persisting over time. | The state has continuity of identity independent of the changing electorate. | **Legally useful, descriptively false.** Useful for debt/treaties, false for psychological "will." | **Stability over responsiveness.** Protects past commitments against transient majorities. |
  | **5. Constitutive** | The will does not exist prior to the procedure; the procedure *makes* it. | Authority arises from the legitimacy of the process, not its accuracy in tracking pre-existing desires. | **Coherent and pragmatic.** Avoids metaphysical claims about "true" preferences. | **Procedure is king.** The referendum result *is* the will, regardless of prior elections or assembly findings. |
  | **6. Purely Legitimating** | The phrase has no descriptive content; it is an honorific claim to authority. | N/A (It is a speech act, not a proposition). | **True of rhetoric, unhelpful for design.** Explains usage, solves no design problems. | **Power decides.** Whichever institution can successfully claim the label wins. |
  | **7. Exclusionary / Moralised** | "The People" denotes the virtuous/native core vs. an alien/corrupt elite. | A moral distinction exists between "real" citizens and others (elites, minorities, newcomers). | **Normatively dangerous.** Incoherent in a universalist democracy. | **Populist veto.** Institutions should empower the "real" people to bypass intermediaries. |

  **3. DIAGNOSIS OF THE COMMISSIONERS**

  **Commissioner 1 (Former Minister)**
  *   **Stated Position:** Aggregative (Thesis 1). Claims the election *is* the will.
  *   **Actual Reliance:** Borrows from **Corporate-Group-Agent (Thesis 4)** and **Purely Legitimating (Thesis 6)**.
  *   **The Gap:** The Minister claims the election *tracks* specific statute preferences (Aggregative), but this is empirically false due to the **Bundle Problem** (voters choose a party package). To sustain the conclusion, the Minister relies on the *legitimacy* conferred by the election (Thesis 6) and the *continuity* of the mandate (Thesis 4).
  *   **Verdict:** The Aggregative reading does not deliver the conclusion because elections do not track statute-level will. The conclusion holds only if one accepts that election legitimacy trumps specific preference tracking.

  **Commissioner 2 (Scholar)**
  *   **Stated Position:** Counterfactual-Deliberative (Thesis 2). Claims the Assembly finds the "actual" will.
  *   **Actual Reliance:** Borrows from **General-Will (Thesis 3)**.
  *   **The Gap:** The Scholar claims deliberation reveals what people *would* will (Thesis 2), but implies that this is *what they should* will (Thesis 3). If the Assembly finds the people still want the statute (under deliberation), would the Scholar accept it? If not, they are relying on the General Will (objective good), not Deliberation (subjective reflection).
  *   **Verdict:** The Deliberative reading is defensible but suffers from **Specification Sensitivity**. The conclusion holds only if the Commission agrees on *which* deliberative conditions count as "ideal."

  **4. EVALUATION OF THE SECRETARIAT HYPOTHESIS**

  **Hypothesis:** *The disagreement is about Tracking vs. Constituting, and Current Electorate vs. Affected Interests.*

  **Verdict:** **Largely Correct, with one addition.**
  1.  **Tracking vs. Constituting:** You are correct. The Minister treats the election as a *tracker* of pre-existing will. The Scholar treats the Assembly as a *tracker* of latent will. Neither treats the procedure as *constitutive*. If the Commission adopted the Constitutive view (Thesis 5), the conflict dissolves: the Referendum *creates* the will at T2, rendering the T1 election irrelevant.
  2.  **Electorate vs. Affected:** You are correct. The "Identity Over Time" wrinkle proves the "People" at T1 (Election) $\neq$ "People" at T2 (Referendum).
  3.  **Missing Axis:** **Epistemic Threshold.** The mechanism is not neutral.
      *   **Simple Majority** in the Assembly = Aggregative (what do more people prefer after talking?).
      *   **Two-Thirds Majority** in the Assembly = Epistemic/General Will (we need high certainty that the statute is *wrong*).
      *   **Verdict:** The 2/3 threshold *already* rejects the Minister's Aggregative view. It presupposes that suspending a statute requires more than a simple counter-preference; it requires a super-majoritarian judgment of error. The mechanism smuggles in the Scholar's epistemic caution, even if the Scholar's philosophical justification is wobbly.

  **5. ADDRESSING THE THREE WRINKLES**

  **A. Specification Sensitivity (The Counterfactual Problem)**
  *   **Issue:** "What they would will" changes based on how much info/time is given.
  *   **Drafting Consequence:** You cannot define "ideal conditions" in the constitution.
  *   **Resolution:** Treat the Assembly's *procedure* as the definition. Whatever the Assembly decides under the *stipulated* rules counts as the counterfactual will. Do not attempt to define "true information" in the text; define the *process* for acquiring it. This shifts the burden from metaphysics to administrative law.

  **B. The Bundle Problem (The Aggregative Problem)**
  *   **Issue:** Voters chose a party, not this specific statute.
  *   **Drafting Consequence:** The Minister's claim that the election mandates *this* statute is interpretive, not factual.
  *   **Resolution:** Acknowledge in the preamble that the suspension mechanism exists *precisely because* election mandates are bundled and imprecise. This neutralizes the Minister's objection without rejecting the election's authority. It frames the Assembly not as an override, but as an unbundling mechanism.

  **C. Identity Over Time (The Demographic Problem)**
  *   **Issue:** T1 Electorate $\neq$ T2 Electorate. Minors/non-citizens affected.
  *   **Drafting Consequence:** Neither the Election nor the Referendum perfectly captures "the People."
  *   **Resolution:** Adopt a **Constitutive** stance for the Referendum. The T2 Referendum is not checking if the T1 Will changed; it is establishing the T2 Will. Regarding non-voters (minors, etc.), this mechanism cannot solve that. Acknowledge this limitation: the mechanism protects the *electoral* people, not the *affected* population. Do not overclaim.

  **6. ORDINARY USAGE VS. COMMISSION USAGE**

  *   **Public Discourse:** Predominantly **Exclusionary/Moralised (Thesis 7)**. Movements claim to represent the "real people" against elites. Commentators dismissing them usually rely on **Aggregative (Thesis 1)** ("you lost the vote") or **Incoherence** ("the people don't exist").
  *   **Commissioners:** Neither is using the Exclusionary reading openly.
      *   The Minister uses Aggregative rhetoric to shield **Legitimacy (Thesis 6)**.
      *   The Scholar uses Deliberative rhetoric to shield **General Will (Thesis 3)**.
  *   **Risk:** If the clause is adopted, public discourse will likely collapse the Assembly's nuanced finding into the Exclusionary reading ("The Citizens' Assembly said the elites were wrong"). The drafting must ensure the Assembly's output is framed as *procedural*, not *moral*.

  **7. WHAT CAN BE SETTLED?**

  **Settling is Possible On:**
  1.  **The Mechanism's Epistemic Standard:** You can explicitly codify that the 2/3 threshold is intended to signal *high-confidence error detection*, not simple preference reversal. This validates the Scholar's caution without accepting their metaphysics.
  2.  **The Bundle Acknowledgement:** You can record that the mechanism exists to refine, not reject, electoral mandates. This allows the Minister to save face regarding election authority.
  3.  **The Constitutive Status of the Referendum:** You can define the Referendum result as the *final* expression of will, superseding prior expressions. This resolves the Identity Over Time issue by making T1 irrelevant to T2's validity.

  **Settling is NOT Possible On:**
  1.  **The Ontology of the Will:** The Commission cannot agree on whether the will is discovered or made. Do not try to define "The Will of the People" in the text.
  2.  **The "True" Preferences:** You cannot adjudicate whether the Assembly finds the "real" will. You can only adjudicate whether they followed the rules.
  3.  **Non-Elector Interests:** The mechanism inherently privileges the voting population. If the Commission wishes to protect non-voters, this clause is the wrong vehicle.

  **RECOMMENDATION**
  Draft the clause to operate on the **Constitutive** model (Thesis 5) while utilizing the **Epistemic** threshold (2/3) demanded by the Scholar. Frame the preamble to acknowledge the **Bundle Problem** (addressing the Minister). Do not define "the will of the people." Define "the outcome of the procedure" as the sole operational proxy for that will.
