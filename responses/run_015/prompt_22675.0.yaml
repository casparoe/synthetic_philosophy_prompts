answer: |-
  **Setting:** *A university seminar room, late afternoon. The chalkboard is still dense with equations from a talk on structural realism. Two philosophers, ELENA and MARCUS, sit amidst stacks of papers and half-empty coffee cups. The air smells of chalk dust and rain.*

  **Elena:** You conceded the point too quickly, Marcus. When I raised the Duhem-Quine thesis, you waved it away as a "logical possibility" distinct from "historical reality." But that distinction is the very thing underdetermination dissolves. If any theory $T$ can be reconciled with any recalcitrant evidence $E$ by sufficiently adjusting the auxiliary hypotheses $A$, then the evidence never touches the core theory. It only touches the system.

  **Marcus:** I didn't wave it away, Elena. I distinguished between *holistic* confirmation and *arbitrary* confirmation. Yes, we test a web of belief, not isolated sentences. But in practice, the web doesn't float freely. We have constraints. When the orbit of Uranus deviated, we didn't just tweak the laws of gravity to save Newton; we posited Neptune. The auxiliary hypothesis was independently testable. That breaks the underdetermination.

  **Elena:** That's the realist's standard move: appeal to future independent tests. But for every theory you construct that posits Neptune, I can construct a rival theory that posits a different gravitational field geometry which yields the exact same observational consequences for all time. You're relying on the fact that scientists *happen* to prefer one path. But preference isn't truth. If two theories are empirically equivalent, and you choose one, you are making a choice underdetermined by evidence.

  **Marcus:** We aren't choosing blindly. We use theoretical virtues. Simplicity, coherence, explanatory scope, fruitfulness. If Theory A explains the data with three parameters and Theory B requires twelve ad-hoc adjustments to fit the same curve, we accept A. Not because the data forces us to, but because A is *better*.

  **Elena:** And there it is. The relocation of the problem. You've moved the underdetermination from the level of theories to the level of virtues. Why trust simplicity? Why trust coherence?

  **Marcus:** Because they track truth.

  **Elena:** That's the claim, not the argument. How do you know nature is simple? That is itself a metaphysical assumption not determined by evidence. You could adopt a virtue of "ontological richness" or "complexity" and construct a different science. If you justify simplicity by saying, "Well, simple theories have worked in the past," you are using an inductive inference. But the validity of induction is exactly what underdetermination calls into question. You're using a virtue to justify the virtue.

  **Marcus:** *Pauses, leaning forward.* That's a sharp cut. I accept that the choice of virtues isn't empirically dictated. If I say "choose simplicity," that rule itself is underdetermined by the data. But you're assuming that to be rational, a rule must be empirically proven. I think that's a category error.

  **Elena:** Go on.

  **Marcus:** Theoretical virtues aren't hypotheses *within* the scientific framework; they are the constitutive norms *of* the framework. They define what counts as an explanation. If you ask, "Why prefer a coherent theory?" you aren't asking a scientific question; you're asking what it means to understand the world. To demand empirical evidence for the virtue of coherence is to demand a scientific proof for the possibility of science.

  **Elena:** So it's pragmatic. A choice of language.

  **Marcus:** No, not merely linguistic. It's a bet on the intelligibility of nature. Look, I concede your point: strictly logically, the preference for simplicity is underdetermined. There is no data that proves simplicity is true. But the underdetermination argument assumes a view from nowhere—that we can stand outside our cognitive architecture and judge it. We can't. We are evolved agents in a physical world. Our cognitive virtues—our sense of what is "simple" or "coherent"—are tuned to the structure of that world.

  **Elena:** That's an evolutionary argument. But evolution selects for survival, not truth. A simple false belief might keep you alive better than a complex true one.

  **Marcus:** True. But it doesn't select for *predictive failure*. If our cognitive virtues were radically out of sync with the world's structure, we wouldn't be able to manipulate the world to build the seminar room we're sitting in. The success of technology suggests our virtues aren't just survival heuristics; they latch onto real causal structures.

  **Elena:** You're circling back to the No-Miracles Argument. Realism is the only philosophy that doesn't make the success of science a miracle. But the anti-realist replies: it's not a miracle, it's just empirical adequacy. We select theories that save the phenomena. We don't need to believe they are *true* to use them.

  **Marcus:** But you can't sustain the distinction between empirical adequacy and truth when the entities in question are unobservable. When you use a scanning tunneling microscope to move atoms, you aren't just saving phenomena. You are interacting with causal powers. If you say, "I believe the theory is empirically adequate but false," you have to explain how a false theory allows me to manipulate a specific unobservable entity with such precision.

  **Elena:** I explain it by saying the theory captures the *relations* correctly, even if the ontology is wrong. But let's return to my main objection. You say virtues are constitutive. I say they are biases. You claim the underdetermination of virtues is a "regress stopper." I claim it's a "dogma starter." If I, as a skeptic, choose to value "empirical adequacy" over "truth," I have a coherent system. If you choose "truth via simplicity," you have a coherent system. The evidence doesn't decide between us. Therefore, your realism is a faith position.

  **Marcus:** *Sighs, rubbing his temple.* I hear you. And I want to answer this on the merits, not dismiss it. You are right that the choice of virtues is not compelled by logic. It is a risk. Realism is a risk. But it is a calculated risk based on the *convergence* of inquiry.

  **Elena:** Convergence is just agreement.

  **Marcus:** It's independent agreement. Different researchers, using different methods, often converge on the same theoretical structure. If virtues were merely subjective biases, we'd see a fragmentation of science. We see the opposite. We see a narrowing of theory space.

  **Elena:** That narrowing could be sociological. Paradigms exclude rivals.

  **Marcus:** They do, but they exclude rivals that *fail*. The underdetermination thesis suggests that we could always keep a dead theory alive with enough auxiliary patches. But we don't. We kill theories. We abandoned the ether not because we couldn't save it—we could have—but because saving it made the theory grotesque. It violated the virtue of coherence.

  **Elena:** So you admit it: you killed it because of a virtue, not the data.

  **Marcus:** I admit that data alone is silent. Data doesn't speak; theories speak to data. But here is my answer to your charge of relocation: The underdetermination of virtues is not *symmetrical*.

  **Elena:** How so?

  **Marcus:** Because the alternative to using virtues like simplicity and coherence isn't a rival methodology; it's chaos. If you refuse to prefer the simpler theory, you have no algorithm for theory choice at all. You are left with an infinite set of empirically equivalent curves. You cannot act. The realist accepts the risk of being wrong about the ontology to gain the capacity to act and predict. The skeptic avoids the risk of being wrong by refusing to commit. But in doing so, the skeptic renders science unintelligible as a cognitive enterprise.

  **Elena:** You're arguing that realism is necessary for the *practice* of science.

  **Marcus:** I'm arguing that the "underdetermination of virtues" is a theoretical problem that vanishes in praxis. Yes, logically, I could choose to value complexity. But if I do, I cease to do physics. I become a data clerk. The fact that I *can't* do physics without assuming some virtues suggests they aren't optional assumptions. They are preconditions of inquiry.

  **Elena:** So you're grounding the virtues in transcendental necessity? "We must assume simplicity to have experience of a lawful world"? That sounds Kantian. And Kant didn't solve the problem of the thing-in-itself.

  **Marcus:** *Smiles faintly.* Perhaps not. But consider this. You say the choice of virtue is underdetermined. I say the *success* of the virtue is not. We have a track record. Simplicity has led to novel predictions. If the choice of virtue were truly arbitrary, its success rate should be random. It isn't. It's high.

  **Elena:** That's the meta-induction. "Virtues have worked, so they will work." But that is still an inductive inference, which rests on the uniformity of nature. Which is underdetermined.

  **Marcus:** *Leans back.* Everything rests on something, Elena. The skeptic's position rests on the assumption that we should withhold belief until logical certainty is achieved. But that assumption is itself underdetermined. Why should we withhold belief? Why is error worse than ignorance? That is a value judgment.

  **Elena:** Because error leads to false models of the world.

  **Marcus:** And ignorance leads to no models at all. We are both making a wager. You wager that the safe path is the rational one. I wager that the productive path is the rational one. The underdetermination of theory by evidence is real. I grant you that. But it is not devastating. It is merely the space in which scientific judgment operates. If evidence uniquely determined theory, we wouldn't need scientists; we would need computers.

  **Elena:** So you accept that realism is not forced by logic, but by the need for agency.

  **Marcus:** I accept that logic alone doesn't get us out of the armchair. We need to engage with the world. And when we engage, the underdetermination shrinks. Not to zero, never to zero. But enough to build a world.

  **Elena:** *Taps her pen on the table.* You've shifted the ground from epistemology to pragmatism. You're not claiming realism is *true* in a correspondence sense that escapes the underdetermination trap; you're claiming it's *unavoidable* for a creature like us.

  **Marcus:** I'm claiming that "truth" isn't a static relation we observe from afar. It's a target we approach by using the tools we have. The underdetermination argument assumes we can compare our theories to naked reality. We can't. We can only compare theories to reality *through* our virtues. If the virtues are underdetermined, so is our access. But that doesn't mean access is impossible. It just means it's human.

  **Elena:** *Quiet for a moment.* You've conceded the logical point to save the practical one.

  **Marcus:** I've conceded the logical point because it's correct. But I deny it's devastating. A map is never the territory. There are infinite maps that fit the territory's contours. But if I want to navigate, I must choose one. And I will choose the one that is simplest to read. If I get lost, I revise the map. But I don't stand at the trailhead arguing that the map is underdetermined.

  **Elena:** *Stands up, gathering her papers.* A pragmatic realism. It's less ambitious than the one you started with.

  **Marcus:** It's more resilient.

  **Elena:** Perhaps. But remember, Marcus: the map you choose determines where you think you can go. If simplicity is a bias, you might never look in the complex corners where the truth actually hides.

  **Marcus:** And if I wait for certainty, I'll never leave the trailhead.

  **Elena:** *Pauses at the door.* Then we agree on the risk. We just disagree on whether it's worth taking.

  **Marcus:** I suppose that's the only underdetermination that matters.

  *Elena nods, steps out into the hallway. Marcus turns back to the chalkboard, picks up an eraser, and slowly wipes away the equations, leaving a clean slate.*
