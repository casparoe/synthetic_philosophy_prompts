      *   *Wait:* Paraconsistentists prioritize non-explosion, not necessarily safety over evidence.
      *   *Let's go back to the Medical/Legal Hybrid.* It's more intuitive for "truth."
      *   *Scenario:* **The "Liminal Status" Clause in Organ Transplant Law.**
