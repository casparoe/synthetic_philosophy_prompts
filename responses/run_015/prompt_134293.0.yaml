      *   *The Rule:* A safety protocol designed to handle "boundary cases" where classification is inherently unstable.
      *   *The Contradiction:* The system classifies a zone as "Populated" ($P$) and "Unpopulated" ($\neg P$) simultaneously based on conflicting but equally authoritative sensor feeds that cannot be reconciled without discarding vital data.
