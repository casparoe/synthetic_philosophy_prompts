      *   *Dialetheism:* A subset of paraconsistency. Asserts that some contradictions are *true* (True Contradictions). $A \land \neg A$ can be true.
      *   *The Challenge:* Most practical scenarios treat contradictions as signals of error (e.g., "The data says X and not X, so check the sensors"). To force a dialetheist to *act* on the truth of a contradiction, the institutional rule must make the *truth* of the contradiction the condition for a specific, optimal outcome, not just a signal to pause.
      *   *The Difficulty:* In real-world institutions, rules are usually designed to resolve ambiguity, not enforce it. If a rule says "If $P$ and $\neg P$, then do $Q$," a non-dialetheist paraconsistentist will say "But $P$ and $\neg P$ is never the case, so the antecedent is false." The dialetheist says "It is the case."
      *   *Key Insight:* I need a scenario where the *status* of the proposition is defined by the institutional framework itself (institutional facts) rather than empirical reality, such that the framework generates a true contradiction that triggers a specific safety or ethical protocol.

