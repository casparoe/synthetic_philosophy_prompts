answer: |-
  Here is the principle that ties your gut reactions together, the verdict on your ambivalence, and the prediction for your new case.

  ### The Principle: Sustainable Loyalty

  Your intuition isn't tracking "Working Class vs. Professional." It's tracking **"Sustainable Loyalty vs. Performative Sacrifice."**

  Here is the rule: **A value is defensible if it strengthens the actual web of relationships you depend on. It is indefensible if it sacrifices the health of that web to protect an image, a rule, or a feeling.**

  Professional values often fail this test because they treat people as independent atoms (ignoring the web). But toxic working-class values also fail this test because they treat loyalty as a debt that must be paid even when it bankrupts the people involved (destroying the web).

  Here is how this principle sorts your five cases:

  **1. Uncle (Stay vs. Move): RIGHT.**
  Moving for money treats the family like a resume item. Staying treats the family as the web itself. His choice sustains the relationships that actually hold his life together. The sacrifice of money is real, but the gain in relational stability is higher.

  **2. Neighbor (Drunk Coworker): WRONG.**
  This looks like loyalty, but it is **Performative Sacrifice**. Protecting a drunk worker doesn't sustain the web; it endangers it. If he gets hurt or hurts someone else, the whole shift suffers. Loyalty that enables danger isn't solidarity; it's complicity. Your gut knows this is different from your uncle's choice because your uncle's choice *built* safety, while your neighbor's choice *risks* it.

  **3. Dad (Mechanic vs. DIY): RIGHT (To pay).**
  Your dad's view is Performative Sacrifice. He is prioritizing the *image* of self-reliance over the *function* of the truck. If he breaks the truck trying to fix it, he can't work. Paying the mechanic acknowledges limits, which keeps the household functioning. This looks like a "professional" value (specialization), but it passes the Sustainable Loyalty test because it keeps the family vehicle safe and reliable.

  **4. Friend (Funeral vs. Boundaries): RIGHT (To skip).**
  This is where your ambivalence needs to end. Under Sustainable Loyalty, you only owe duty to relationships that are capable of reciprocity. A toxic father is a drain on the web, not a support. Attending the funeral would be Performative Sacrifice—doing it for the sake of appearance ("good daughter") while gaining no relational health. Skipping it protects her mental health so she can sustain healthy relationships elsewhere (like her own children or partner). **Your hesitation here has to go.** She was right.

  **5. Church (Pantry vs. Paperwork): RIGHT (Trust).**
  Paperwork assumes people are cheaters (Professional cynicism). Trust assumes people are neighbors (Working-class solidarity). The paperwork saves money but costs dignity. The trust costs a little money but builds a stronger community web. Since the goal of a church pantry is community health, the trust model is more sustainable.

  ### Which Verdict Has to Go?

  None of your *decisions* have to go, but your **uncertainty on Case 4** has to be eliminated.

  Case 1 (Stay for family) and Case 4 (Leave toxic family) look contradictory, but they aren't. Case 1 is an investment in a healthy asset; Case 4 is cutting a loss. If you keep wavering on Case 4, you undermine Case 1. If family is always the trump card (Case 4 wrong), then your uncle (Case 1) is only right by accident, not by principle. To make your worldview consistent, you must accept that **loyalty is owed to living relationships, not to blood or titles.**

  ### The New Case: The Overtime Refusal

  **The Case:** A factory worker refuses overtime pay because the company laid off people at another plant, even though he legally earned it.

  **The Verdict:** **He is Wrong.**

  **The Reason:**
  This is **Performative Sacrifice**, not Sustainable Loyalty.
  1.  **It hurts his web:** That overtime money likely supports his own household (his primary web). Refusing it creates financial stress for his family.
  2.  **It doesn't help the target:** The corporation does not care about his individual sacrifice. It won't rehire the laid-off workers.
  3.  **It isolates him:** True working-class solidarity is collective (e.g., striking together to demand no layoffs). An individual refusing pay is just martyrdom. It signals virtue to the worker but changes nothing for the laid-off crew.

  Under your principle, he would be right if he organized with his coworkers to refuse overtime *until* the laid-off workers were recalled. That would be using leverage to sustain the wider community. But doing it alone is just self-harm that mimics loyalty without achieving it. It's the same error as your neighbor protecting the drunk coworker: prioritizing a feeling of loyalty over the actual safety and stability of the group.

  ### Summary
  Your gut is tracking **relational health**, not class identity.
  *   **Working-Class Strength:** You belong to a place and people.
  *   **Professional Strength:** You have agency and boundaries.
  *   **The Synthesis:** You use your agency to protect your people, and you use your belonging to give your agency meaning.

  When loyalty endangers the group (Case 2, Overtime Case), it's wrong. When boundaries protect the group from toxicity (Case 4), they're right. When pragmatism keeps the household running (Case 3), it's better than pride. Stick with **Sustainable Loyalty**, and your verdicts hold up.
