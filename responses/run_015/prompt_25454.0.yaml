      *(Re-evaluating the "Prayer" question)*: The most dangerous question is one that forces the user to admit that the JB problem *as stated in the literature* does not include the physical symmetry constraints the user is assuming. If the JB problem is *under-specified*, then adding physics constraints is solving a *different* problem. This is the "Van Fraassen Trap."

