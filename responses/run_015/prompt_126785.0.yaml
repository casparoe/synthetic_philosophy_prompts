prompt: |-
  So I've been reading the rationalist blogs since basically forever and I still can't referee an argument two friends of mine got into after a board game night, so I'm outsourcing it.

  Setup: my friend Dev is quitting his job to build a niche B2B SaaS thing solo. He figures 8 months to first paying customers and says it's 60% it works out. My other friend Mira is a hard outside-view person and the two of them went at it for like forty minutes. Roughly:

  (1) Mira: don't use your own model, use the reference class "solo first-time founder software projects" — median time to anything shippable is way more then 8 months and most of them never get a paying customer at all. Your 60% is a planning-fallacy number with a confidence interval welded onto it.

  (2) Dev: that class is doing no work, it lumps me in with people who are teaching themselves to code. I've got twelve years in the industry, I've shipped in this exact domain before, and I have a 9k-person mailing list from a newsletter I've run for years. The relevant class is "senior engineers with distribution and domain experience building in a market they've already worked in," and that class looks a lot better. Also, I said 60%, not 100 — I already took a haircut.

  (3) Mira: that's reference class gerrymandering. You picked the narrowing features after looking at your own case, and every founder can do exactly this, so the class always collapses into "people circumstanced like me," which is the inside view with extra steps. If narrowing is free, the outside view has zero bite.

  (4) Dev: it isn't free, but if it's banned then the outside view is just conservatism with a spreadsheet attached. Every successful thing was, ex ante, a member of a class with a bad base rate. And worse: the outside view isn't closed under universal adoption. If everyone actually deferred to the broad class, the population of attempted projects would change — the ones that still get attempted would be a different set, selected for ignoring exactly the number you measured — so the base rate you're quoting wouldn't describe the world you'd be acting in. The number eats itself.

  (5) Mira: fine, but you're conflating two things people mean by "outside view." One is correcting for a corrupted estimator — your optimism, your availability, the fact that you've already sunk two months into building. The other is a claim about which evidence to use. Those have different remedies, and the first one says debias your own model, not replace it with a class average. But on the second: the burden is on the narrow class to show the narrowing feature actually tracks outcomes, and "I feel like my experience is relevant" isn't that. Show me that newsletters predict shipping.

  (6) Dev: I can't, and that's structural, not laziness. The classes anybody has numbers for are the ones some institution already bothered to count — broad, old, legible ones. Call it the census effect. So the outside view doesn't drag you toward the truth, it drags you toward whatever was cheap to tabulate, and it gets to look modest and rigorous the whole time it's doing it.

  (7) Mira: okay, but then what, we go back to vibes? And honestly this whole argument is beside the point, because the outside view is about your probability, not your decision. Fat-tailed payoff — you don't need 60% for quitting to be right. What the outside view changes is the shape of the attempt: keep the job two days a week, precommit to a kill criterion at month twelve, sell before you build. Dev: but if it doesn't change whether I go, and my inside number was already above what I needed, then what exactly did it do?

  I want a verdict on each of (1) through (7), somewhere on a scale from clearly mistaken to clearly right, with a sentence or two on why, then who is more right overall and what both of them are missing. Please actually pick — I've watched this same fight play out on the forums a dozen times and it always dissolves into "both sides have a point, reference classes are hard," which is useless to me. If one of them is equivocating somewhere, say exactly where. And don't tell me to go read somebody, I've read the blog posts; I want the object-level argument.

  Bonus if you want it: is there any principled way to choose a reference class, or is the honest answer that you have to use your inside view to pick the class and then your outside view to set the number — in which case Mira's whole thing is just the inside view wearing a lab coat?
reasoning: |-
  Here's a thinking process that leads to the suggested verdict:

  1.  **Analyze the Request:**
      *   **Context:** A dispute between two friends (Dev and Mira) about using the Outside View (reference class forecasting) vs. Inside View (specific case details) for a startup decision.
      *   **Task:** Provide a verdict on points (1) through (7) (scale: mistaken to right + brief explanation), determine who is more right overall, identify what both are missing, identify equivocation if present, and answer the bonus question about principled reference class selection.
      *   **Constraint:** Do *not* say "both sides have a point" in a wishy-washy way. Pick a side. Be object-level. No "go read Kahneman/Tetlock."
      *   **Tone:** Rationalist-adjacent, analytical, decisive.

  2.  **Deconstruct the Arguments (1-7):**

      *   *(1) Mira:* Use broad reference class ("solo first-time founder"). 60% is planning fallacy.
          *   *Analysis:* Standard Outside View 101. Correct that 60% is likely optimistic for the broad class. But is the class appropriate?
      *   *(2) Dev:* Broad class is wrong. I'm a senior engineer with distribution (newsletter). Narrow class is better. 60% already accounts for risk.
          *   *Analysis:* Valid criticism of (1). Specificity matters. 60% isn't 100%, so he acknowledges risk.
      *   *(3) Mira:* Narrowing is gerrymandering. "People circumstanced like me" collapses to Inside View.
          *   *Analysis:* Strong point. This is the core critique of Reference Class Forecasting (RCF). If you narrow enough, $N=1$.
      *   *(4) Dev:* Banning narrowing is just conservatism. Success requires beating base rates. Base rates change if everyone adopts OView (Lucas Critique-ish).
          *   *Analysis:* Philosophically interesting (Lucas Critique application), but practically weak for individual decision making. The "success requires beating base rates" is true but doesn't help *estimate* the probability.
      *   *(5) Mira:* Distinguishes debiasing estimator vs. evidence selection. Burden of proof on narrowing features (show newsletters predict shipping).
          *   *Analysis:* Very strong. This is the epistemic crux. Correlation vs. assertion.
      *   *(6) Dev:* "Census Effect." Data exists only for legible/broad classes. OView biases toward measurable, not true.
          *   *Analysis:* Insightful meta-critique. Data availability bias is real. But doesn't solve the estimation problem.
      *   *(7) Mira:* OView informs *structure* (risk mitigation), not just binary go/no-go. Fat tails mean EV > 0 even if P(success) is low. Dev: If decision doesn't change, what's the point?
          *   *Analysis:* Mira wins here on decision theory. Dev misses the value of risk mitigation even if the expected value is positive.

  3.  **Evaluate "Who is More Right Overall":**
      *   Dev has better specific knowledge (Inside View).
      *   Mira has better epistemic hygiene (Outside View mechanics).
      *   However, the prompt asks me to *pick*.
      *   *Decision:* Mira is more right on the *methodology of estimation*, which is the core dispute. Dev is right that the broad class is useless, but wrong that his narrow class is statistically valid without evidence. Mira's pivot in (7) to decision architecture is the knockout punch. Dev's "what did it do?" shows a misunderstanding of expected value vs. binary outcomes.
      *   *Wait, let's look closer.* Dev's argument in (4) about base rates eating themselves is a bit confused. Base rates describe the past; if behavior changes, the *future* base rate changes, but the *past* base rate is still the best predictor absent new info.
      *   Mira's argument in (5) regarding the burden of proof for narrowing features is the strongest epistemic point. Dev admits in (6) he can't prove the newsletter correlates with success, he just asserts it. That's Inside View masquerading as Outside View.
      *   *Verdict:* Mira is more right. Dev is committing the "Exception Fallacy" (I am special) without sufficient evidence to update the prior significantly enough to justify 60%.

  4.  **Identify What's Missing:**
      *   **Bayesian Updating:** Neither is explicitly doing this. You start with the base rate (Prior) and update based on specific evidence (Likelihood Ratio). Dev treats his specifics as a new Reference Class. Mira treats them as noise. The truth is: Base Rate + Strength of Evidence = Posterior.
      *   **Calibration:** Dev says 60%. Has he been calibrated before?
      *   **Pre-mortem:** Neither suggests a pre-mortem explicitly, though Mira hints at kill criteria.

  5.  **Identify Equivocation:**
      *   Dev equivicates on "Reference Class." In (2) he claims he's using a reference class. In (6) he admits the data for that class doesn't exist. If the data doesn't exist, it's not a Reference Class Forecast; it's an Inside View estimate dressed up.
      *   Mira equivokes slightly on "Outside View" in (5), splitting it into "debiasing" vs "evidence," which is helpful but acknowledges the term is doing too much work.

  6.  **Address the Bonus (Principled Class Selection):**
      *   Is it Inside View picking the class? Yes, inevitably.
      *   Is it a lab coat? Only if you don't penalize narrow classes for small N.
      *   *Solution:* You must use the Inside View to select the class, *but* you must penalize the confidence of the resulting estimate based on the sample size of that class. If N=1 (effectively), the weight on the "Outside" number should be near zero, reverting to Inside View with a heavy uncertainty penalty.
      *   *Better approach:* Start broad, then update. Don't swap classes.

  7.  **Drafting the Verdicts (Iterative refinement for punchiness):**

      *   (1) Mira: Right. 60% for *any* solo startup is almost certainly overconfident without evidence.
      *   (2) Dev: Mixed. Right that broad class is weak, wrong that his narrow class has statistical weight.
      *   (3) Mira: Right. This is the "Reference Class Tennis" problem.
      *   (4) Dev: Mistaken. The Lucas Critique applies to policy, not individual probability estimation.
      *   (5) Mira: Clearly Right. Burden of proof is on the predictor.
      *   (6) Dev: Right (insightful), but doesn't save his estimate.
      *   (7) Mira: Clearly Right. Decision theory > Probability estimation. Dev's rebuttal is weak.

      *   *Overall:* Mira. Dev is arguing for his hope; Mira is arguing for the math.
      *   *Missing:* Bayesian updating framework.
      *   *Equivocation:* Dev calling his Inside View a Reference Class.
      *   *Bonus:* Yes, Inside View picks the class, but you must discount for small N.

  8.  **Refining the Tone:**
      *   Needs to be sharp. No hedging.
      *   "Clearly mistaken" to "Clearly right."
      *   Ensure the distinction between *estimation* and *decision* is clear.

  9.  **Final Polish:**
      *   Check against constraints: Did I pick a side? Yes (Mira). Did I avoid "go read Kahneman"? Yes. Did I answer the bonus? Yes.
      *   Make sure the critique of Dev's (4) is accurate. The base rate doesn't "eat itself" for *him*. It might change for *future* founders, but that doesn't help him predict *his* outcome now.
      *   Make sure the critique of Dev's (6) acknowledges the truth but dismisses its utility for *him*. Just because data is imperfect doesn't mean you ignore it.

      *(Self-Correction during drafting)*: I need to be careful not to just say "Mira wins because stats." Dev's point about the "Census Effect" is actually quite good rationalist discourse. I should rate that higher than "mistaken." It's "Right observation, wrong conclusion."
      Also, on the Bonus: The honest answer *is* that you use Inside View to pick the class. The trick is penalizing narrowness. I should state that clearly.

      *Re-evaluating Overall Winner:* Dev is making a startup. Startups *require* Inside View optimism to launch. But as an *argument about truth*, Mira is winning. The prompt asks to referee the *argument*, not the business decision. So Mira wins the argument.

      *Let's tighten the verdicts.*
      (1) Right.
      (2) Partially Right (on class selection), Wrong (on statistical validity).
      (3) Right.
      (4) Mistaken (category error).
      (5) Right.
      (6) Right (meta-point), but irrelevant to the specific probability claim.
      (7) Right (decision theory).

      *Wait, one nuance:* Dev's (4) about "If everyone deferred... the population would change." This is actually a valid point about Goodhart's Law or reflexive markets. But for a single agent *now*, it's irrelevant. I'll call it "Theoretically interesting, practically mistaken."

      *Final plan:*
      1.  Verdicts 1-7.
      2.  Overall Winner.
      3.  What's Missing (Bayesianism).
      4.  Equivocation (Dev's "Class").
      5.  Bonus Answer.

      *Let's write it.*
answer: |-
  Here is the verdict on the specific claims, the overall winner, and the resolution to the bonus question.

  ### The Verdicts

  **(1) Mira: Clearly Right.**
  A 60% success rate for solo software projects is empirically false. Without evidence to the contrary, the prior probability must anchor near the historical base rate, which is single digits. Dev's number is almost certainly motivated reasoning.

  **(2) Dev: Partially Right, Mostly Wrong.**
  He is right that the broad class is too noisy to be useful (the "reference class tennis" problem). He is wrong that his proposed narrow class functions as a statistical reference class; without data on that specific subset, it is just an assertion, not a base rate.

  **(3) Mira: Clearly Right.**
  This is the core epistemic failure of Dev's position. If you are allowed to narrow the class until it contains only people "circumstanced like you," you have recreated the Inside View but stripped it of the accountability that comes with admitting it is the Inside View.

  **(4) Dev: Mistaken.**
  This is a category error. The Lucas Critique applies to macroeconomic policy where agents react to the model. For an individual making a one-off decision, the historical base rate remains the best predictor of the physical reality they are entering, regardless of what would happen if everyone adopted the model.

  **(5) Mira: Clearly Right.**
  This is the knockout punch. Predictive features require evidence. Asserting that a newsletter predicts shipping is a causal claim that demands data. Without that data, it is a hypothesis, not a variable you can plug into a forecast.

  **(6) Dev: Right (Insightful), but Irrelevant.**
  The "Census Effect" is a valid meta-critique of available data (we measure what is easy). However, the fact that available data is imperfect does not license you to ignore it in favor of uncalibrated intuition. It explains *why* the Outside View is frustrating, not why Dev's 60% is accurate.

  **(7) Mira: Clearly Right.**
  She correctly identifies that the value of the Outside View is often in risk structuring (barbell strategies, kill criteria), not just binary go/no-go. Dev's rebuttal ("what did it do?") reveals a misunderstanding of expected value; knowing the risk is higher changes *how* you play, even if you still play.

  ### Overall Winner: Mira

  Mira wins the argument. Dev is arguing for the *utility* of optimism (which may be valid for motivation), while Mira is arguing for the *accuracy* of the prediction (which is what a probability claim claims to be). Dev is conflating "I need to believe this to act" with "This is likely to be true." Mira correctly identifies that Dev is using the language of forecasting to dress up an Inside View intuition without paying the tax of providing evidence for his narrowing criteria.

  ### What Both Are Missing

  **Bayesian Updating.**
  They are treating Inside and Outside Views as competing methodologies rather than components of a single calculation. The correct procedure is:
  1.  Start with the broad base rate (Mira's Prior).
  2.  Evaluate the specific evidence (Dev's newsletter, experience) as likelihood ratios.
  3.  Update the probability.

  Dev skips the prior. Mira undervalues the likelihood ratio. The truth isn't "pick a class," it's "start with the broad class and penalize Dev's specific evidence based on how well that evidence has historically predicted success." If Dev can't show the data linking newsletters to success, the Bayesian update is small, and the probability stays near the base rate.

  ### The Equivocation

  **Dev equivocations on "Reference Class."**
  In point (2), Dev claims he is using a reference class ("senior engineers with distribution"). In point (6), he admits there are no numbers for that class ("The classes anybody has numbers for are the ones some institution already bothered to count").
  If there are no numbers, **it is not a reference class.** It is an Inside View model. Dev wants the rhetorical authority of the Outside View ("I used a class!") without the evidentiary burden (actual statistics for that class).

  ### Bonus: Principled Reference Class Selection

  **Yes, there is a principled way, and the honest answer is: You use the Inside View to pick the class, but you pay a confidence tax.**

  Mira is half-right that it's the Inside View in a lab coat, but that doesn't make it useless. The algorithm is:
  1.  Use Inside View to propose the narrowest class that feels relevant.
  2.  Count $N$ (the sample size of that class in historical data).
  3.  If $N$ is large, use that base rate.
  4.  If $N$ is small (or zero), you must **interpolate** between the narrow class and the broad class based on $N$.

  If Dev's class ("Senior engineers with newsletters") has $N=5$ in the historical record, he cannot use that base rate. He must take a weighted average of that rate and the broad "solo founder" rate. The smaller the $N$, the more weight falls back on the broad, ugly base rate.

  Dev's mistake is thinking that identifying a relevant feature (newsletter) allows him to *replace* the base rate. It only allows him to *adjust* it, and the adjustment size is capped by the statistical strength of the feature. Since he admits in (6) that the data doesn't exist, the adjustment should be near zero.
