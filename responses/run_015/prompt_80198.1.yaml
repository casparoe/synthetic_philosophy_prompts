  # Decision Tree: Meat Consumption and Wild Animal Welfare

  **Root Commitment:** *I want my dietary choices to reduce net animal suffering.*

  **Node 1:** Do the suffering and flourishing of wild animals carry the same moral weight as those of farmed animals in your calculus?
  *   **No:** → **Leaf 1: Farmed-Exclusive Reductionism**
  *   **Yes:** → Go to Node 2.

  **Node 2:** Is the average suffering per life in the wild greater than in modern animal agriculture?
  *   **No:** → **Leaf 2: Standard Reductionism**
  *   **Yes:** → Go to Node 3.

  **Node 3:** Is current agricultural land (pasture and cropland) net positive or net negative for the wild animals living on it?
  *   **Net Negative:** → **Leaf 3: Land-Sparing Reductionism**
  *   **Net Positive:** → Go to Node 4.

  **Node 4:** If meat demand drops, will the liberated land generate more or less wild animal suffering than current agricultural use?
  *   **Less Suffering:** → **Leaf 4: Counterfactual Optimism** *[Flag: Potentially Incoherent]*
  *   **More Suffering:** → Go to Node 5.

  **Node 5:** Does the welfare impact of land conversion differ significantly between pasture-based (beef) and feed-crop-based (chicken/pork) production?
  *   **Yes:** → **Leaf 5: Asymmetric Reductionism**
  *   **No:** → Go to Node 6.

  **Node 6:** Can individual dietary choices reliably influence these large-scale land-use outcomes?
  *   **Yes:** → **Leaf 6: Status Quo Defense**
  *   **No:** → **Leaf 7: Dietary Inefficacy**

  ***

  ### Leaf Descriptions

  **Leaf 1: Farmed-Exclusive Reductionism**
  *   **Argument:** Wild welfare is too epistemically uncertain to weigh against the clear suffering of farmed animals.
  *   **Awkward Commitment:** Implies ignoring massive amounts of potential suffering simply because it is hard to measure.

  **Leaf 2: Standard Reductionism**
  *   **Argument:** Farmed suffering is so intense that it dominates the calculus regardless of wild animal impacts.
  *   **Awkward Commitment:** Requires dismissing wild predation and disease as less severe than factory farming.

  **Leaf 3: Land-Sparing Reductionism**
  *   **Argument:** Agriculture harms wild animals via pesticides and habitat fragmentation, so reducing meat heals the land.
  *   **Awkward Commitment:** Commits to viewing current grazing land as a net welfare loss for wild inhabitants.

  **Leaf 4: Counterfactual Optimism** *[Flag: Potentially Incoherent]*
  *   **Argument:** Removing agriculture allows land to return to a state that is better for wild welfare than farming.
  *   **Awkward Commitment:** Difficult to sustain if one already accepts Node 3 (that current ag land is net positive for wild welfare).

  **Leaf 5: Asymmetric Reductionism**
  *   **Argument:** Beef pasture may protect wild welfare while chicken crops harm it, requiring differentiated consumption.
  *   **Awkward Commitment:** Requires endorsing beef consumption while rejecting chicken on welfare grounds.

  **Leaf 6: Status Quo Defense**
  *   **Argument:** Maintaining current meat consumption preserves land-use patterns that minimize wild animal suffering.
  *   **Awkward Commitment:** Commits to supporting industrial agriculture specifically to protect wild animals from nature.

  **Leaf 7: Dietary Inefficacy**
  *   **Argument:** Market signals are too weak to change land use, so dietary changes are futile.
  *   **Awkward Commitment:** Renders individual ethical consumption pointless regardless of the welfare calculus.

  ***

  ### Structural Notes

  *   **Unoccupied Combinations:** The path leading to **Leaf 4 (Counterfactual Optimism)** is logically tense. If a student answers "Net Positive" at Node 3 (meaning agriculture helps wild animals compared to the baseline), it is incoherent to then answer "Less Suffering" at Node 4 (meaning removing agriculture also helps wild animals). This leaf is rarely occupied because it requires believing agriculture is better than nature, but removing agriculture is *also* better than agriculture.
  *   **Indistinguishable Leaves:** **Leaf 6 (Status Quo Defense)** and **Leaf 7 (Dietary Inefficacy)** both recommend no change to diet, but the tree separates them by *reasoning*. Leaf 6 claims change is *harmful*; Leaf 7 claims change is *futile*. While action-guidance is identical, the moral positions differ significantly regarding causal responsibility.

  Most defensible is Land-Sparing Reductionism because ecological evidence suggests agricultural land generally reduces biodiversity and increases wild animal suffering compared to rewilded states.
