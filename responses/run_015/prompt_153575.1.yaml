prompt: |-
  ok so i just started this grad position at a sleep and consciousness lab and we're interviewing people about weird emergence experiences from anesthesia - like they wake up describing stuff from the OR that they shouldnt have seen. my advisor is obsessed with Dennett's heterophenomenology idea, which i mostly get: treat the transcript as describing a "heterophenomenological world" not as a direct window into consciousness, stay neutral like an anthropologist. but now i actually have to code these things and i need a real procedure, not just the theory.

  i need a step-by-step decision procedure i can run on each transcript in about 20 minutes, with the questions in order, what counts as enough answer to keep going, and where i have to stop and flag it for my advisor because it's a values call not a coding call. specifically it needs to handle "stacked reports" where the patient mixes up what happened inside the world they're describing with their own interpretation of whether it was real or a dream - rules for pulling those layers apart, or rather to seperate them, without destroying the coherence of the heterophenomenological world. and i need a check for "narrative contamination" where they seem to be retrofitting details they learned after waking up.

  the procedure should have hard stops: where do i reject a report as too incoherent to code at all, where do i accept it but mark it as an access-report rather than a world-report, and where does it hand over to human judgment?

  then run it on three cases:
  1. patient says "i floated near the ceiling and saw the nurse drop a tray, then i knew it wasnt real because nurses never drop trays"
  2. patient describes being in a tunnel with bright lights but then says "and thats probably just the drugs, my mom told me about near-death stuff before the surgery"
  3. one where the procedure says "this is structurally coherent, code it as a world-report" but that feels wrong to me - maybe they describe a full conversation with a dead relative in perfect detail but every detail matches the hospital room layout they could have heard about through the curtain.

  i also need you to flag exactly what this procedure cant do - like when it will misfire on genuinely confused patients vs people with weird but real experiences. and please dont ask for citations or a reading list, i dont have library access right now and my advisor wants this on his desk tomorrow.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Context:** Grad student in a sleep/consciousness lab. Studying emergence experiences from anesthesia (AWAREness, near-death-like experiences, hallucinations).
      *   **Theoretical Framework:** Dennett's Heterophenomenology (treat reports as texts describing a *belief world*, not necessarily objective reality; neutral stance).
      *   **Task:** Create a step-by-step decision procedure (algorithm) for coding transcripts.
      *   **Constraints:**
          *   Must take ~20 minutes per transcript.
          *   Must handle "stacked reports" (mixing world-description with interpretation of reality/dream status).
          *   Must check for "narrative contamination" (post-hoc retrofitting).
          *   Must have hard stops (reject, accept as access-report, accept as world-report, flag for advisor).
          *   Must run on three specific test cases.
          *   Must identify limitations/failure modes.
          *   **Crucial:** No citations/reading lists (advisor wants it tomorrow, no library access).
      *   **Tone:** Practical, operational, slightly urgent but rigorous.

  2.  **Deconstruct Heterophenomenology for Coding:**
      *   Dennett's core idea: We don't judge truth (did they *really* float?). We judge the *structure of the belief*.
      *   *Heterophenomenological World (HW):* The universe as the subject believes it existed during the experience.
      *   *Access Report:* Statements about the reporting process itself or external knowledge influencing the report.
      *   *World Report:* Statements describing the contents of the experience.
      *   *The Problem:* Patients often mix these ("I saw X, but that must be fake because Y").
      *   *The Goal:* Extract the HW without validating the ontology, while flagging contamination.

  3.  **Drafting the Procedure (The "20-Minute Protocol"):**
      *   *Phase 1: Coherence Check (Hard Stop).* Is there enough text? Is it gibberish?
      *   *Phase 2: Segmentation (Stacked Reports).* Separate "What happened" from "What I think about what happened."
      *   *Phase 3: Contamination Check.* Look for external info inserted into the timeline.
      *   *Phase 4: Classification.* Access vs. World.
      *   *Phase 5: Advisor Flag.* Where does interpretation require philosophical/ethical judgment?

      *Refining the Steps:*
      *   Need specific questions to ask the text.
      *   Need clear criteria for "Pass/Fail."
      *   Need to address the "stacked" issue explicitly (Layering).

  4.  **Developing the "Stacked Report" Rule:**
      *   Patients say: "I saw [Event], but I know [Interpretation]."
      *   Coding Rule: Code [Event] as HW content. Code [Interpretation] as *post-hoc commentary* (Access Report), unless the interpretation happened *during* the experience (e.g., "I knew inside the dream it was fake").
      *   *Crucial Distinction:* Epistemic status *during* the experience vs. *after* the experience.

  5.  **Developing the "Narrative Contamination" Check:**
      *   Look for tense shifts.
      *   Look for source attribution ("My mom told me," "I read later").
      *   Look for logical consistency that exceeds sensory data (e.g., knowing a specific time without a clock).

  6.  **Defining the Hard Stops:**
      *   *Reject:* Incoherent syntax, no propositional content.
      *   *Access-Report Only:* Patient explicitly denies the experience happened ("I just made that up," "I was guessing").
      *   *World-Report:* Patient asserts the experience occurred (regardless of objective truth).
      *   *Advisor Flag:* Contradictions that imply malingering, ethical concerns (distress), or high-stakes claims (veridical perception claims that could be tested).

  7.  **Running the Test Cases:**

      *   *Case 1:* "Floated... saw nurse drop tray... knew it wasn't real because nurses never drop trays."
          *   HW: Floating, seeing tray drop.
          *   Interpretation: "Knew it wasn't real" (During or After?). Phrasing "then I knew" suggests during/immediate. Reasoning "nurses never drop trays" is a belief.
          *   Contamination: Low.
          *   Classification: World Report (with embedded epistemic doubt).

      *   *Case 2:* "Tunnel... bright lights... probably just drugs, mom told me."
          *   HW: Tunnel, lights.
          *   Interpretation: "Probably just drugs" (Post-hoc).
          *   Contamination: High ("Mom told me"). This is external schema imposition.
          *   Classification: World Report (phenomenology) + Access Report (attribution). Flag for contamination level.

      *   *Case 3:* "Conversation with dead relative... matches hospital layout heard through curtain."
          *   HW: Conversation, relative.
          *   Contamination: High probability of auditory bleed-through integrated into narrative.
          *   Procedure Output: Structurally coherent -> World Report.
          *   User Intuition: "Feels wrong."
          *   Resolution: The procedure *must* code this as a World Report because heterophenomenology brackets truth. However, it needs a "Veridical Claim Flag" for the advisor to check against audio logs. This addresses the "feels wrong" part by acknowledging the *claim* type without validating the *truth*.

  8.  **Identifying Limitations (The "Misfire" Analysis):**
      *   Can't distinguish lying from believing.
      *   Can't distinguish confabulation from memory.
      *   Struggles with aphasia/sedation residue (might look like incoherence).
      *   The "Truth" problem: It deliberately ignores objective truth, which might be what the lab actually cares about (AWAREness studies usually want to know if they *really* heard things). *Self-Correction:* I need to make sure the user knows this procedure serves the *phenomenology* goal, not necessarily the *clinical accuracy* goal, unless flagged.

  9.  **Review against Constraints:**
      *   20 mins? Yes, steps are linear.
      *   No citations? Yes.
      *   Advisor ready? Yes, formatted as a protocol.
      *   Handles stacked reports? Yes, via the Segmentation Step.
      *   Handles contamination? Yes, via Source Tracking.

  10. **Final Polish:**
      *   Make it look like a lab manual entry.
      *   Ensure the tone is supportive but directive.
      *   Clarify the Dennettian stance: We code the *text*, not the *brain*.

  **(Self-Correction during drafting Case 3):** The prompt says "one where the procedure says 'structurally coherent, code it as a world-report' but that feels wrong to me." I need to make sure my analysis of Case 3 explains *why* the procedure says that (because it's coherent text) but provides the mechanism to flag the suspicion (the "Veridical/Auditory Bleed" flag). This validates the user's intuition without breaking the theoretical framework.

  **(Self-Correction on Hard Stops):** I need to be very clear about when to stop coding and call the advisor. This is usually when the report implies malpractice, severe psychological distress, or potential veridical perception that needs immediate verification (before memory fades).

