answer: |-
  Here is a operational decision procedure designed for your lab context. It translates Dennett's heterophenomenological stance into a coding workflow. It treats the transcript as the primary data, not the patient's brain state.

  **Protocol Name:** Heterophenomenological Transcript Coding (HTC-v1)
  **Time Budget:** 20 Minutes per Transcript
  **Goal:** Extract the *Heterophenomenological World (HW)* while flagging *Access Reports* and *Contamination*.

  ---

  ### PART 1: THE DECISION PROCEDURE

  Run these steps in order. Do not skip. If a Hard Stop is triggered, cease coding and follow the instruction.

  #### STEP 1: Coherence & Capacity Check (Time: 2 mins)
  **Action:** Read the transcript once for flow.
  **Question:** Does the text contain propositional claims (statements that can be true or false within a narrative)?
  *   **No (Gibberish/Single words):** **HARD STOP.** Reject as "Non-Codable." File under *Sedation Residue*.
  *   **Yes:** Proceed to Step 2.

  #### STEP 2: Temporal Segmentation (Time: 5 mins)
  **Action:** Highlight text in two colors.
  *   **Color A (World-Report):** Descriptions of events, sensations, entities, or environments *experienced during the episode*. (e.g., "I saw a light," "I heard a voice.")
  *   **Color B (Access-Report):** Statements about the reporting process, current beliefs, or post-hoc reasoning. (e.g., "I think that was a dream," "My mom said this happens," "I am guessing.")
  **Rule for Stacked Reports:** If a sentence mixes them ("I saw X but I know it was Y"), split the code. "I saw X" = World. "I know it was Y" = Access.
  **Check:** Is the majority of the narrative Color A?
  *   **No (Mostly Access/Speculation):** **HARD STOP.** Mark as "Speculative Only." Do not code as an experience report.
  *   **Yes:** Proceed to Step 3.

  #### STEP 3: Narrative Contamination Scan (Time: 5 mins)
  **Action:** Search for "Source Attribution." Look for where the information could have come from *outside* the experience window.
  **Triggers:**
  1.  **External Schema:** References to cultural tropes introduced *after* the fact (e.g., "It was like a near-death experience" without prior description of the tunnel/light).
  2.  **Auditory Bleed:** Details that match verifiable OR audio but are described as visual or telepathic.
  3.  **Tense Shift:** Sudden shift from past tense ("I was") to present/perfect ("I have heard").
  **Decision:**
  *   **Low Contamination:** Proceed to Step 4.
  *   **High Contamination:** Code the World-Report, but attach the **"Contamination Flag."** Do not reject it (the experience of the contamination is still part of the HW), but mark it for advisor review.

  #### STEP 4: Epistemic Status Check (Time: 5 mins)
  **Action:** Determine the subject's belief *during* the experience vs. *now*.
  **Question:** Did the subject believe the HW was real *at the time of the event*?
  *   **Yes:** Code as **Standard World-Report.**
  *   **No (They knew it was fake while it happened):** Code as **Lucid/Oneiric Report.** (Still a World-Report, but the ontology of the HW is "dream" not "reality").
  *   **Unclear/Contradictory:** **FLAG FOR ADVISOR.** (This is a values call on how to weigh contradictory beliefs).

  #### STEP 5: Final Classification & Flagging (Time: 3 mins)
  Assign one of the following tags:
  1.  **HW-Valid:** Coherent World-Report, low contamination.
  2.  **HW-Contaminated:** Coherent World-Report, high external schema insertion.
  3.  **Access-Only:** No descriptive content, only interpretation.
  4.  **Advisor Review:** Contradictions, distress signals, or potential veridical perception claims (seeing/hearing things they objectively could not have).

  ---

  ### PART 2: RUNNING THE PROCEDURE ON TEST CASES

  Here is how the protocol processes your three cases.

  #### Case 1: "I floated near the ceiling and saw the nurse drop a tray, then I knew it wasnt real because nurses never drop trays"
  *   **Step 1 (Coherence):** Pass. Clear propositions.
  *   **Step 2 (Segmentation):**
      *   *World-Report:* "Floated near ceiling," "Saw nurse drop tray."
      *   *Access-Report:* "Knew it wasn't real," "Nurses never drop trays."
  *   **Step 3 (Contamination):** Low. The reasoning ("nurses never drop trays") is an internal belief, not necessarily external info learned post-op.
  *   **Step 4 (Epistemic Status):** Mixed. Experience felt real (sensory), but epistemic judgment occurred *during* the event ("then I knew"). This is a **Lucid/Oneiric Report**.
  *   **Step 5 (Classification):** **HW-Valid.**
  *   **Note:** The procedure successfully separates the sensory data (tray drop) from the subject's ontological judgment (it wasn't real). You code the tray drop as part of their world, regardless of whether the nurse actually dropped it.

  #### Case 2: "Describes being in a tunnel with bright lights but then says 'and thats probably just the drugs, my mom told me about near-death stuff before the surgery'"
  *   **Step 1 (Coherence):** Pass.
  *   **Step 2 (Segmentation):**
      *   *World-Report:* "Tunnel," "Bright lights."
      *   *Access-Report:* "Probably just drugs," "Mom told me."
  *   **Step 3 (Contamination):** **High.** "Mom told me before surgery" indicates the schema was pre-loaded. This is narrative retrofitting.
  *   **Step 4 (Epistemic Status):** Post-hoc dismissal. During the event, they likely perceived lights.
  *   **Step 5 (Classification):** **HW-Contaminated.**
  *   **Action:** Code the "Tunnel/Lights" as the HW, but attach the Contamination Flag. The advisor needs to know this matches a pre-existing script provided by family.

  #### Case 3: "Full conversation with a dead relative in perfect detail but every detail matches the hospital room layout they could have heard about through the curtain."
  *   **Step 1 (Coherence):** Pass. Structurally perfect.
  *   **Step 2 (Segmentation):** All World-Report. No Access-Report doubts expressed.
  *   **Step 3 (Contamination):** **Critical.** The content matches external auditory data (voices through curtain) but is transduced into a visual/narrative hallucination (dead relative).
  *   **Step 4 (Epistemic Status):** Subject believes it was real.
  *   **Step 5 (Classification):** **HW-Valid** (Procedurally) -> **FLAG FOR ADVISOR** (Substantively).
  *   **Why it feels wrong:** Your intuition is detecting *confabulation*, but the procedure codes *coherence*. Heterophenomenology demands we code the text as a valid description of *their* world.
  *   **Resolution:** The procedure correctly identifies this as a coherent World-Report. However, Step 5 requires a **"Veridical Claim Flag."** You code it as a World-Report because *they experienced it as such*, but you flag it for the advisor to compare against OR audio logs. The procedure protects the phenomenology; the flag protects the science.

  ---

  ### PART 3: LIMITATIONS & FAILURE MODES

  You asked where this procedure will misfire. Be explicit about this in your memo to your advisor.

  **1. The "Malingering" Blind Spot**
  *   **Failure:** The procedure cannot distinguish between a patient lying and a patient believing. If a patient fabricates a story perfectly, HTC-v1 codes it as a **HW-Valid** World-Report.
  *   **Reason:** Heterophenomenology brackets truth. It treats the text as the reality.
  *   **Mitigation:** Rely on the "Advisor Review" flag for reports that are *too* coherent or match known tropes too perfectly.

  **2. The "Confused vs. Complex" Problem**
  *   **Failure:** A patient with residual sedation might produce fragmented speech that Step 1 rejects as "Non-Codable," even if it contains a kernel of genuine experience. Conversely, a highly articulate patient might construct a coherent narrative out of pure confusion.
  *   **Reason:** The Coherence Check privileges linguistic structure over neural state.
  *   **Mitigation:** If a transcript is rejected in Step 1, save a snippet of the "gibberish" in the notes. Sometimes the fragmentation *is* the data.

  **3. The "Veridical" Tension**
  *   **Failure:** In Case 3, the procedure says "Code it," but your lab might actually care about *accuracy* (did they really hear the nurses?). HTC-v1 treats "I heard a conversation" and "I hallucinated a conversation" as the same code (World-Report).
  *   **Reason:** Dennett's method is agnostic about the external world.
  *   **Mitigation:** This is why the **Veridical Claim Flag** in Step 5 is non-negotiable. You must separate the *phenomenological coding* (what they felt) from the *clinical audit* (what happened).

  **4. The "Stacked Report" Ambiguity**
  *   **Failure:** Sometimes patients say "I felt like I was awake" but mean "I felt like I was dreaming I was awake." Step 2 might misclassify the epistemic status.
  *   **Reason:** Natural language is imprecise regarding meta-cognition.
  *   **Mitigation:** Default to **Advisor Flag** if the subject uses "like," "as if," or "felt like" more than 3 times in a short segment.

  ### SUMMARY FOR YOUR ADVISOR
  *   **Procedure:** HTC-v1 (attached).
  *   **Throughput:** ~20 mins/transcript.
  *   **Philosophy:** Strictly Heterophenomenological (codes the text, not the truth).
  *   **Safety Valve:** "Advisor Review" flag handles the edge cases where values/ontology intrude on coding.
  *   **Immediate Action:** I am ready to begin coding Batch 1 using these rules. Case 3 type reports will be flagged for audio verification immediately.
