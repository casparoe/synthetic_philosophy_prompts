answer: |-
  **MEMORANDUM**

  **TO:** Newsroom Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Policy Regarding Identity-Based Slurs in Reporting

  ### 1. Purpose
  For the past several months, this committee has debated whether and when to print racial, ethnic, and identity-based slurs verbatim. Our current case-by-case approach is inefficient and creates inconsistent outcomes that undermine reader trust. This memo proposes a unified policy that balances our duty to minimize harm with our duty to report the truth accurately.

  ### 2. Guiding Principles
  This policy is built on two competing ethical imperatives, both of which are valid:
  *   **Minimize Harm:** We acknowledge that slurs carry historical violence and trauma. Printing them can cause genuine psychological harm to staff, sources, and readers, particularly from marginalized communities. The "journalistic context" does not automatically neutralize this harm.
  *   **Seek Truth and Transparency:** We must not sanitize history or current events to the point of distortion. In specific instances, obscuring a word may obscure the severity of an action, the nature of a threat, or the reality of a public figure's conduct.

  ### 3. Recommendation: The "Presumption Against" Standard
  I recommend we adopt a **Presumption Against** printing slurs in full. The default position is to paraphrase or use a placeholder (e.g., "the n-word").

  However, we recognize a narrow exception for **Strict Necessity.** We may print a slur verbatim *only* when the word itself is the central subject of the story, or when obscuring it would fundamentally mislead the reader about the gravity of a newsworthy event.

  ### 4. Decision Criteria (The "Five-Point Test")
  To remove subjective "judgment calls" from individual editors, the following checklist must be applied. **If the answer to any of these questions is "No," the word must not be printed.**

  1.  **Is the slur the story?** Is the usage of the specific word the primary news hook (e.g., an etymological history, a discussion on reclamation, or evidence of specific harassment), rather than incidental to a broader narrative?
  2.  **Is the speaker a public actor acting in an official or semi-official capacity?** (e.g., a leaked tape of a candidate, a policy document, a courtroom transcript). *Private citizens' usage, even in newsworthy contexts, should generally be obscured.*
  3.  **Does paraphrasing materially reduce the public's understanding of the harm?** Would using "the n-word" prevent the reader from understanding the specific threat or violence implied?
  4.  **Has consultation occurred?** Has the editing team consulted with senior editors from the affected community (if available on staff) or external experts regarding the impact of printing?
  5.  **Is there a content warning?** Can the story be structured so the reader is warned before encountering the text?

  ### 5. Formatting and Placement Rules
  Even if the Five-Point Test is met, the following restrictions apply:
  *   **Headlines, Photos, and Promos:** Slurs are **never** to be printed in headlines, photo captions, social media promos, or audio intros.
  *   **Body Text:** If printed, the word should not be bolded or highlighted.
  *   **Audio/Video:** In broadcasts, the word should be bleeped or muted unless the unbleeped version is available behind a click-through warning on the website.

  ### 6. Approval Workflow
  Decisions to print a slur verbatim cannot be made by a single desk editor.
  *   **Required Sign-off:** The Managing Editor (or equivalent senior lead) must sign off on any exception to the Presumption Against.
  *   **Documentation:** The rationale for the exception must be documented in the story's internal notes for future reference.

  ***

  ### 7. Critical Counter-Argument: The Case for Absolute Prohibition
  *In the spirit of full transparency, the following argument represents the strongest ethical case **against** the recommendation above. This committee should weigh this heavily before voting.*

  **The Argument:**
  There is no journalistic justification that outweighs the violence of a slur. The "Presumption Against" policy fails because it assumes harm is contextual, when for many readers and staff, harm is inherent.

  By creating a "Strict Necessity" exception, we are empowering editors—most of whom do not belong to the targeted groups—to decide when it is "safe" to deploy racial violence. We are essentially asking marginalized staff and readers to endure trauma for the sake of "completeness."

  Furthermore, the "Slippery Slope" risk is high. Once we allow exceptions for "public figures," the definition of public figure expands. Once we allow exceptions for "gravity," the threshold for gravity lowers. A blanket prohibition (always using "the n-word") is not cowardice; it is a recognition that the word's power to dehumanize exists independently of the sentence it sits in. We can report that a politician used a racial slur without becoming the vehicle for that slur. To do otherwise prioritizes abstract accuracy over concrete human safety.

  ***

  ### 8. Next Steps
  I propose we vote on this "Presumption Against" framework next week. If adopted, I will draft the accompanying style guide entries for implementation.

  **[Your Name]**
  Standards Committee Member

  ***

  # Preparation Brief: The Strongest Argument Against This Recommendation

  *Since you asked for the strongest version of the argument against the recommendation above, here is a breakdown you can use to anticipate the pushback in the meeting. This is the "Steel-Man" of the opposition.*

  **If you recommend the "Presumption Against with Exceptions" (The Middle Path):**

  **The Critique:** *The "Loophole for Trauma" Argument*
  The strongest argument against your draft comes from the **Harm Reduction** side (the "Never Print" camp). Their most potent point is that **harm is objective, but "necessity" is subjective.**

  *   **The Core Point:** A slur triggers a physiological stress response in targeted communities regardless of whether it is in a headline, a quote, or a historical analysis. By allowing *any* exception, the newsroom is institutionalizing the right to inflict that stress.
  *   **The Power Dynamic:** This policy gives the power to decide to the editor, not the affected community. It assumes the editor knows best when a slur is "necessary." History shows that newsrooms often overestimate the necessity of shock value.
  *   **The Alternative Exists:** We *can* report the news without the word. If a politician says the n-word, the story is "Politician uses n-word." The reader understands exactly what happened. Printing it adds no new information; it only adds the visceral impact of the slur itself. Therefore, the "Accuracy" argument is a red herring. The information is conveyed without the slur.
  *   **The Staff Safety Angle:** This is crucial for an internal committee. Requiring staff (particularly Black, Indigenous, or POC staff) to copy-edit, headline, or layout a story containing the full slur exposes them to workplace harassment/hostility. A "Necessity" exception forces them to choose between their safety and their job duties. A blanket ban protects the workforce.

  **How to handle this in the meeting:**
  If this argument is raised, do not dismiss it. Acknowledge that **staff safety is paramount.** You might amend the policy to say: *"Even if the Five-Point Test is met, if the assignment would require a staff member to process the slur against their will, the word must be obscured."* This concedes the strongest point of the counter-argument while keeping the policy for public-facing content.

  **If you recommend a "Blanket Ban" (The "Never Print" Path):**

  **The Critique:** *The "Sanitizing History" Argument*
  The strongest argument against a total ban comes from the **Accuracy/Transparency** side.

  *   **The Core Point:** Journalism is the first draft of history. Sanitizing primary sources (like court transcripts or leaked tapes of leaders) distorts the historical record.
  *   **The "Cowardice" Angle:** It treats the audience as children who cannot handle reality. It also allows the subjects of the story to evade the full consequences of their language. If a leader is racist, saying they "used a racial slur" is softer than showing *exactly* how racist they were.
  *   **Reclamation:** A blanket ban makes it impossible to report on communities reclaiming these words (e.g., LGBTQ+ usage of "queer," or Black usage of the n-word in art/culture) without sounding clinical and distant.

  **Summary for your strategy:**
  The "Presumption Against" (Middle Path) is the industry standard (used by NYT, AP, NPR with variations) because it acknowledges both critiques. However, to win the room, you must emphasize that the **Exceptions are rarer than people think.** Most stories do not meet the Five-Point Test. This reassures the Harm side while giving the Accuracy side the safety valve they need for genuine emergencies.
