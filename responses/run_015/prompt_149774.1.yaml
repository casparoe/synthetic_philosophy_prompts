answer: |-
  ### Audit of Archaeological Inference Package

  Here is the consistency check ranked by severity.

  #### 1. Severity: Critical — (3) vs. (4) [The Semantic Gap]
  *   **The Tension:** (3) bans the bridge (analogy) required to cross from material syntax (geometry/orientation) to mental semantics (belief about the dead). (4) claims you have crossed it.
  *   **Genuine or Apparent:** **Genuine.** Formal properties (stones point north) do not logically entail propositional content ("dead travel north") without a bridging premise. Usually, that premise is ethnographic analogy. If you ban the premise, the inference is invalid. (1) does not solve this; *Stratigraphic Bayes* updates probability of *sequence*, it does not generate *meaning*.
  *   **What Has to Give:** You must either downgrade (4) to behavioral descriptions ("oriented northward") or expand (3) to allow non-ethnographic bridging premises (e.g., cognitive universals).

  #### 2. Severity: High — (2) vs. (5) [The Scope Contradiction]
  *   **The Tension:** (2) admits global underdetermination (evidence is insufficient across sites). (5) claims reflexivity makes the method "clean everywhere" (implies global validity).
  *   **Genuine or Apparent:** **Genuine.** Reflexivity manages *bias* (internal error), but it cannot solve *underdetermination* (external scarcity). You can be perfectly unbiased and still lack enough data to decide globally. Claiming "clean everywhere" contradicts "globally radical."
  *   **What Has to Give:** (5) must be scaled back. Reflexivity can mitigate bias, but it cannot manufacture evidence where (2) admits none exists.

  #### 3. Severity: Medium — (1) vs. (5) [The Objectivity Trap]
  *   **The Tension:** (1) posits a non-commutative update rule (order of operations changes the result). This makes inference path-dependent and potentially subjective. (5) claims the method is "clean."
  *   **Genuine or Apparent:** **Apparent (Manageable).** Path-dependence introduces variance, not necessarily bias. However, if the "path" is determined by the archaeologist's excavation strategy, it introduces systemic bias.
  *   **What Has to Give:** (5) needs to clarify that reflexivity *tracks* the variance introduced by (1), rather than eliminating it.

  ---

  ### The Single Cheapest Revision

  **Modify Commitment (3).**

  **Current:** "Legitimate priors only come from formal record properties... never comparing to living societies."
  **Revision:** "Legitimate priors come from formal record properties **and cross-cultural cognitive constraints**."

  **Why this fixes the most:**
  1.  **Resolves (3) vs. (4):** It allows you to bridge the gap from "stones point north" to "dead travel north" using *cognitive uniformitarianism* (e.g., humans universally associate cardinal directions with cosmological axes) without resorting to *ethnographic analogy* (comparing specific site X to specific living Tribe Y). You keep the ban on "dirty" analogy but gain the semantic bridge needed for belief attribution.
  2.  **Mitigates (2) vs. (5):** Cognitive constraints are global. If your priors rely on human cognitive universals rather than local stratigraphy alone, you reduce global underdetermination. This brings (2) and (5) closer to alignment.
  3.  **Stabilizes (1):** Cognitive priors provide a more stable "Layer 0" for your Bayesian updates, reducing the arbitrariness of path-dependence.

  **Cost:** Low. It requires a definitional distinction between *ethnographic analogy* (forbidden) and *cognitive uniformitarianism* (permitted), which is a standard philosophical move that preserves your methodological brand while fixing the epistemological hole.
