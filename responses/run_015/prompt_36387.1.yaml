ngs become determinate. Is there a single account of vagueness — semantic, epistemic, pragmatic, or something else — that captures all of these verdicts? If not, which would you overturn first, and at what cost? I would like the principle stated precisely enough to adjudicate two cases we never got to: whether there is a right answer to write on a police form that demands a yes-or-no about whether a borderline driver is bald, and whether a stipulated legal threshold changes what the words mean or merely changes what happens to you.
