answer: |-
  **Project Title:** Structural Invariants in Glyph Identity: A Computational Test of the Letter Spirit Problem

  **1. The Research Question**
  The core problem is type identity: what makes a specific mark (a token) an instance of a specific letter (a type)? My hypothesis is that letter identity is not defined by geometric similarity or historical lineage, but by structural invariants—specific configurations of parts and relations that remain fixed while style and metrics vary.

  The precise question is: **Can we construct a finite "anatomy language" of parts and relations that successfully discriminates between letters without relying on arbitrary metric thresholds?**

  *Pushback on Precision:* Asking for a specification where *every* instance satisfies it and *no* other letter does seeks **necessary and sufficient conditions**: rules that must be true for something to belong to a category, and if true, guarantee it belongs. This is philosophically fragile; a single broken glyph that humans still read as 'a' falsifies the "necessary" claim. I will therefore operationalize success as **discriminative power**: can the structural spec distinguish confusable pairs (b/d/p/q) better than geometric distance alone, without hiding metric thresholds inside the structural rules?

  **2. Why Existing Answers Fail**
  Two dominant theories explain category membership, but both fail on typographic edge cases.

  *   **The Cluster Theory (Family Resemblance):** This view suggests categories are defined by overlapping features rather than one essential trait, like members of a family sharing various traits without one universal feature.
      *   *The Failure Case:* Pixel-identity across scripts. A Latin 'a' and a Cyrillic 'а' can be geometrically identical yet belong to different categories because they sit in different **contrast sets**: the system of differences that defines meaning within a specific language. Cluster theory cannot explain why identical shapes are different letters based on context alone.
  *   **The Causal Theory (Historical Lineage):** This view argues an object is what it is because of its historical origin, not its properties.
      *   *The Failure Case:* The "New Glyph" problem. A designer can draw a从未-before-seen shape, and readers will instantly classify it as an 'a' based on structure, despite it having no causal history. Conversely, a historically authentic glyph that loses its structural integrity (e.g., a closed counter opens) ceases to be the letter, regardless of its lineage.

  **3. Methodology (4 Months, ~40 Hours/Month)**
  I will build a computational model that generates glyphs based on structural specs rather than geometric outlines, then test human recognition against those outputs.

  *   **Month 1: The Anatomy Language.** I will define a schema for glyph structure (e.g., `stem`, `bowl`, `counter`) and their relations (`attached-to`, `encloses`, `above`). I will hand-specify a "nasty subset" of ten letters: *a, o, u, n, h, d, b, p, q, g*. This set is chosen specifically for rotation and reflection symmetries where geometric distance fails but structural relations (e.g., "stem on left vs. right") should succeed.
  *   **Month 2: Generative Testing.** I will write a generator that randomizes metrics (stroke width, curvature, height) while strictly holding the structural spec fixed. I will recruit ~20 participants to classify 50 generated outputs. Success is defined as >90% agreement with the intended label despite high geometric variance.
  *   **Month 3: Minimal-Edit Experiments.** I will algorithmically hunt for the smallest geometric change that flips human classification (e.g., closing an aperture). I will record whether this flip coincides with a discrete structural event (a counter closing) or if there are continuous paths where category changes without structural change. This tests for **Sorites Paradox** vulnerabilities: problems arising from vague boundaries where removing one grain of sand doesn't change a heap, but eventually, it does.
  *   **Month 4: The Held-Out Test.** I will train the spec on 25 letters in a novel style and generate the 26th. If readers accept it as belonging to the same family and letter category, the structural model holds. Deliverables will be the open-source repo (generator + specs) and a non-academic writeup detailing the structural rules discovered.

  **4. Conditions for Failure**
  This project fails if:
  1.  **Threshold Creep:** Every letter's spec requires at least one arbitrary metric threshold (e.g., "aperture must be > 10% of height") to exclude other letters. This would prove "structure" is just prototype theory hiding behind geometry.
  2.  **Graded Mush:** Human data shows no sharp boundaries in Month 3, indicating letter identity is inherently fuzzy rather than structurally discrete.
  3.  **Context Dependence:** The structural spec only works when the letter is isolated, failing when surrounding context changes (proving the contrast set matters more than internal structure).

  **5. Scope & Feasibility Assessment**
  *Plain advice on ambition:* Ten letters in 160 total hours is high-risk. Building a robust generator and running two rounds of human studies leaves roughly 10 hours per letter for spec design. If the anatomy language becomes complex (e.g., handling curve tangencies), you will run out of time.

  *Recommendation:* Cut the set to **six letters: a, o, n, h, b, d**. This retains the critical structural variations (counters, stems, ascenders/descenders) and the crucial reflection pair (b/d) without spreading your spec language too thin. It is better to have a robust, defensible spec for six letters than a fragile spec for ten. If Month 1 runs over, drop *u, g, p, q* immediately; keep *b/d* as they are the strongest test of your relational hypothesis.

  **6. Deliverables**
  *   **Public Repository:** Code for the structural generator, the anatomy specs for the test set, and anonymized human study data.
  *   **Writeup:** A 2,000-word illustrated essay explaining the structural rules discovered, where they broke, and what that implies for the Letter Spirit problem.
