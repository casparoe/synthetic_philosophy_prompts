  7.  (Self-Correction on "Real Property"): Paul Horwich, a leading deflationist, explicitly argues truth *is* a property, constituted by the equivalence schema. So S1 is technically false for many deflationists. It's a "robust" vs "deflated" property distinction. I will mark it as "Reject/Qualify."

  8.  (Self-Correction on Verificationism): The text argues: T-schema $\rightarrow$ Truth doesn't outrun justification. This is the "Epistemic Conception of Truth" criticism. Deflationists say: The T-schema links truth to *facts* (p), not to *evidence* (justified p). So S5 is a misrepresentation.

