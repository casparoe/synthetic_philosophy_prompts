answer: |-
  You have stumbled onto the central problem of modern causal inference without the benefit of the jargon. Your intuition is correct: the simple story you were told about Simpson's Paradox ("just split on the confounder") is a half-truth that breaks down when you look deeper.

  Here is the direct answer to your questions, followed by the framework you need to stop the spinning.

  ### 1. Does this recurring version have a name?

  There is no single, standard pop-sci term for the *recursive* version of this problem. Statisticians usually refer to components of it as **Model Dependence**, **The Table 2 Fallacy**, or **Non-collapsibility**, but none of these fully capture the "endless flipping" you are observing.

  Since you asked for a coined term with boundaries if no established one exists, I will give you one that describes exactly what you are seeing. Let us call it **The Stratification Regress**.

  **Definition:** The Stratification Regress occurs when the estimated direction or magnitude of an effect reverses repeatedly as you condition on additional variables, without converging to a stable value, because the variables being added are a mix of true confounders, mediators (outcomes of the treatment), and colliders (common effects), compounded by sampling noise in small subsets.

  **Boundary Cases (What counts vs. What does not):**
  *   **Clearly Counts:** You adjust for a variable that is a *confounder* (a common cause of treatment and outcome), and the estimate shifts. You then adjust for a *mediator* (a result of the treatment), and it shifts back. You then adjust for a *collider* (a result of both), and it shifts again. The estimate never settles because you are mixing causal types.
  *   **Clearly Does Not Count:** You adjust for all known pre-treatment common causes (confounders), and the estimate stabilizes. Adding more variables after this point only adds noise (widening confidence intervals) but does not systematically reverse the coefficient. This is **Convergence**, not Regress.
  *   **Clearly Does Not Count:** You slice the data until cells contain 10 observations, and the effect flips. This is **Sampling Noise**, not structural Regress.

  ### 2. The "Cheating" Variables: Post-Treatment Bias

  You asked for a principled rule about dividing the population by something the treatment helped bring about (ICU admission, wait time, ad campaign eligibility).

  **The Rule:** If you want to know the **Total Effect** of a decision (e.g., "Which clinic should I send my mother to?" or "Which page variant increases total revenue?"), you must **never condition on variables that occur after the treatment assignment.**

  **The Reason:**
  Imagine the causal chain:
  `Clinic Choice -> Wait Time -> Recovery`

  If Clinic A is more efficient, it might cause shorter Wait Times, which cause better Recovery.
  *   If you compare Clinics *overall*, you see the benefit of Clinic A (including its benefit of reducing wait times).
  *   If you split by *Wait Time* (e.g., "Look only at patients who waited > 4 hours"), you are blocking the pathway through which Clinic A helps. You are asking, "If we force wait times to be equal, which clinic is better?" That is a different question. It measures the *Direct Effect*, not the *Total Effect*.

  In your website example:
  `Page Variant -> Ad Campaign Eligibility -> Conversion`

  If Variant A makes users eligible for higher-paying ad campaigns, that is part of the value of Variant A. If you split by Ad Campaign, you are artificially holding that benefit constant. You are asking, "If we ignore the campaign eligibility difference, which page is better?" That is useful for debugging, but it is **not** useful for deciding which page to ship.

  **The Name for this Error:** This is called **Post-Treatment Bias** (or sometimes **Mediator Bias**). It is not just "cheating"; it mathematically answers a different question than the one you are asking.

  ### 3. Structural Reality vs. Search Artifact

  You noted that your script *never fails* to find a reversal if it searches deep enough. This is the most dangerous part of your observation.

  **The Hard Truth:** If your script *always* finds a reversal, you are almost certainly manufacturing the result through **Overfitting** and **Collider Bias**.

  1.  **Overfitting (The Noise Problem):** In your website data, you noted sample sizes drop to dozens. In statistics, if you slice data enough times, you will find a slice where random noise looks like a signal. If you search 100 combinations, one will look significant by chance. This is **P-Hacking**. The "flip" here is an artifact of your search, not the world.
  2.  **Collider Bias (The Structure Problem):** Even with large hospital numbers, if you condition on a variable that is caused by *both* the Clinic and the Patient's Health (e.g., "Admitted to ICU"), you induce a fake correlation.
      *   Example: Only very sick patients go to ICU. But Clinic B sends more people to ICU because they are aggressive. If you look *only* at ICU patients, Clinic B looks like it has sicker patients than Clinic A's ICU patients, because Clinic A only sends the absolute worst cases there. This makes Clinic A look worse in the ICU slice, even if they are better overall. This is **M-Bias** or **Collider Stratification Bias**.

  **How to distinguish:**
  *   **Structural:** The reversal happens when you adjust for a **Pre-Treatment Confounder** (e.g., Patient Severity *on arrival*). The sample size remains robust. The variable logically precedes the decision.
  *   **Artifact:** The reversal happens when you adjust for **Post-Treatment variables** (Wait time, ICU) or when sample sizes drop below ~100 per cell (for binary outcomes).

  ### 4. How to Stop the Regress (The Solution)

  You cannot solve this by looking deeper into the tables. You cannot find the answer in the data alone. You must step outside the data and draw a map of the process. This is the core of **Causal Inference** (specifically, Directed Acyclic Graphs or DAGs).

  **The Procedure:**

  1.  **Define the Question:** Are you asking for the *Total Effect* (Which clinic/page is better to use?) or the *Direct Effect* (Which clinic/page is better assuming we equalize wait times/campaigns?). For your job and your mother, you want the **Total Effect**.
  2.  **Draw the Map:** Before looking at the numbers, sketch the causal relationships.
      *   *Patient Severity* → *Clinic Choice* (Confounding: Sicker patients might go to the specialist clinic).
      *   *Clinic Choice* → *Wait Time* → *Recovery* (Mediation: Clinic affects wait, wait affects recovery).
      *   *Clinic Choice* → *ICU Admission* ← *Patient Severity* (Collider: Both affect ICU).
  3.  **Apply the Adjustment Rule:**
      *   **Adjust for** variables that point *into* both Treatment and Outcome (Confounders like Severity).
      *   **Do NOT Adjust for** variables that the Treatment points *into* (Mediators like Wait Time, ICU, Campaign Eligibility).
      *   **Do NOT Adjust for** variables that are effects of both Treatment and Outcome (Colliders).
  4.  **Stop There:** Once you have adjusted for the Pre-Treatment Confounders, **stop**. Do not keep slicing. If the answer changes when you add more variables, those variables are likely mediators or colliders, and the new answer is biased for your purpose.

  ### 5. Practical Advice for Your Decisions

  **For the Hospital (Your Mother):**
  *   **Goal:** Total Effect (Best chance of recovery).
  *   **Action:** Look at the overall success rate *adjusted only for severity on arrival*.
  *   **Ignore:** Splits by ICU admission, wait time, or surgeon. These are results of the clinic's process, not external factors. If Clinic A has better overall outcomes after adjusting for severity, send her there, even if Clinic B looks better among "Weekend Elective Referrals." That slice is likely too small or conditioned on a collider.

  **For the Website (Your Job):**
  *   **Goal:** Total Effect (Highest conversion rate).
  *   **Action:** Compare Variant A vs. B overall.
  *   **Secondary Check:** Split only by **Pre-Experiment** factors (Device Type, Browser, New vs. Returning User). These are confounders you might want to balance.
  *   **Ignore:** Splits by Ad Campaign (if the variant changed eligibility), Time on Site, or Pages Visited. These are influenced by the variant.
  *   **The "Script" Warning:** If your script finds a reversal by slicing on "Campaign + Device + Day of Week," and the cell sizes are small, **trust the overall number.** The overall A/B test randomization (if it is a true randomized experiment) already handles the confounding *on average*. You only need to adjust for confounders if the randomization failed or if you are looking at observational data (like the hospital stats).

  ### Summary

  The phenomenon you found is **The Stratification Regress**.
  It is caused by mixing **Confounders** (adjust), **Mediators** (do not adjust), and **Colliders** (do not adjust), combined with **Overfitting** in small samples.

  **The Principled Rule:**
  To measure the value of a choice (Total Effect), condition only on factors that existed **before** the choice was made and that influence both the choice and the outcome. Condition on nothing that happened **after** the choice.

  If you follow this rule, the flipping stops. The "infinite regress" is not a feature of reality; it is a feature of searching for patterns in a causal web without a map. Draw the map, and the path becomes clear.
