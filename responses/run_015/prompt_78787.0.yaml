  The practice, restated

  The procedure involves solving a strategic game by sequentially removing strategies that are strictly dominated. A strategy is dominated if there exists another available strategy, or a probability mixture of available strategies, that yields a higher expected payoff regardless of opponents' choices. This deletion is iterated: once a strategy is removed for one player, it is treated as unavailable for others when assessing their remaining strategies. The standard pedagogical justification is minimal: a rational agent will not knowingly choose an option guaranteed to perform worse than an alternative. Consequently, if players know others are rational, they know others won't play dominated strategies, allowing further deletions. The process continues until no dominated strategies remain, yielding a solution set. This method is presented as a direct consequence of instrumental rationality alone, seemingly requiring no complex equilibrium concepts.

  What it strictly presupposes

  First, regarding rationality, the procedure requires more than individual instrumental rationality. For the first round of deletion, only individual rationality is needed: a player maximizes her payoff given her beliefs. However, iteration necessitates Common Knowledge of Rationality (CKR). To delete a strategy in the second round, Player A must know that Player B is rational and will not play strategies deleted in round one. Without CKR, the iteration halts immediately. Thus, the practice presupposes that rationality is not merely a property of action but an epistemic condition shared infinitely among agents. Furthermore, rationality is defined substantively as expected utility maximization, not merely consistency of choice. It assumes agents form precise probabilistic beliefs and maximize against them. The phrase "knowingly plays" implies the player possesses the cognitive capacity to compute dominance relations across the entire strategy space, presupposing unbounded computational rationality alongside motivational rationality.

  Second, regarding mixed strategies, allowing dominance by mixtures commits the theory to an ontological claim about randomization. If a pure strategy $S$ is dominated by a 50-50 mixture of $A$ and $B$, the player must be able to execute that mixture. This treats mixed strategies as deliberate acts of randomization available to the agent, rather than merely representing an opponent's uncertainty about the agent's choice. If mixed strategies were only beliefs, a player could not "play" a mixture to dominate a pure strategy; she could only believe others might mix. The procedure requires the agent to have access to a randomization device or internal capacity to probabilize her own actions as a strategic tool. It presupposes the strategy space includes convex combinations of pure actions, making the set of available acts convex. This interpretation forces the mixed strategy to be an object of choice, not just an object of belief, creating a dual role that must be reconciled within the agent's decision problem.

  Third, regarding value, the procedure strictly presupposes cardinal utility measurable via Expected Utility Theory. Comparing a pure strategy against a mixture requires calculating expected values. Ordinal preferences are insufficient because a mixture creates a lottery over outcomes. To say a lottery is better than a sure thing requires knowing the intensity of preferences between outcomes, not just their ranking. This commits the practice to the von Neumann-Morgenstern axioms, specifically independence and continuity. It assumes payoffs are not just indices of order but magnitudes of value that can be weighted by probabilities. Consequently, the procedure cannot apply to agents with non-expected utility preferences, such as those exhibiting ambiguity aversion or rank-dependent weighting, without modification. The practice assumes value is linear in probabilities. It also assumes that the utility function is unique up to positive affine transformations, ensuring that dominance relations remain invariant under rescaling. Without this cardinal structure, the comparison between a sure payoff and a probabilistic mixture lacks mathematical definition. The payoffs must represent risk attitudes accurately, meaning the numbers in the matrix are utilities, not merely ordinal ranks or monetary values subject to risk aversion. The agent must treat the expected utility of a mixture as the weighted sum of utilities, rejecting any premium for certainty or ambiguity that violates linearity.

  What it merely fits

  The practice fits comfortably with several interpretations that it does not strictly require. Most notably, it is compatible with the "purified" interpretation of mixed strategies. One can maintain that players never actually randomize; instead, a mixed strategy represents an opponent's uncertainty about a player's choice, driven by private payoff perturbations. Under this view, dominance by mixture is merely a mathematical artifact showing that a pure strategy is never a best response to any belief, without requiring the agent to possess a randomization device. The procedure works mathematically either way, so the ontological commitment to randomization is not strictly necessary for the solution concept to function, even if the derivation suggests it.

  Additionally, the practice fits with viewing rationality as coherence rather than maximization. While the procedure assumes expected utility maximization, it is consistent with a coherence view where avoiding dominated strategies is simply a requirement of logical consistency in choice, akin to avoiding Dutch books. One need not commit to a psychological theory of maximization to accept that choosing a dominated strategy is incoherent. Furthermore, the procedure fits with equilibrium reasoning, even though it is presented as pre-equilibrium. The result of IDSDS is often a subset of Nash equilibria. Teachers can present it as a standalone rationality requirement while implicitly relying on the fact that it converges toward equilibrium solutions in many games. This allows the pedagogy to remain agnostic about whether players are solving for equilibrium or simply avoiding stupidity, as both interpretations yield the same deletions in standard contexts. Finally, it fits with an ordinalist framework if one assumes risk neutrality over the specific goods at stake. If the payoffs represent money and agents are risk-neutral, ordinal rankings of monetary outcomes suffice to generate the cardinal utilities required. This allows the practice to slide into introductory courses where utility theory is not explicitly taught, masking the cardinal requirement under the assumption of linear value over money.

  Where it pulls apart

  The presuppositions generate significant internal tension, particularly between the epistemic requirements and the ontological status of strategies. The most acute friction lies between the interpretation of mixed strategies and the definition of rationality. If a mixture dominates a pure strategy, the agent must be able to play that mixture. However, standard rationality dictates that if an agent is indifferent between the components of a mixture, she should be indifferent to the mixture itself (by linearity). Yet, for strict dominance by mixture to occur, the mixture must be strictly preferred to the pure strategy. This implies the pure strategy is suboptimal relative to the convex combination. While mathematically consistent under Expected Utility Theory, it strains the intuitive notion of rationality as picking the "best" single action. It forces the agent to view probabilistic combinations as superior acts to deterministic ones, which conflicts with the common-sense view that randomization is only useful to hide intentions from opponents, not to improve intrinsic payoff against fixed opponent strategies. In dominance solving, the opponent's strategy is not fixed, but the dominance holds for *all* opponent strategies. Thus, the randomization provides intrinsic value, which is counterintuitive for a single agent acting against nature or fixed payoffs.

  Furthermore, there is a disconnect between the pedagogical justification and the mathematical requirements. The procedure is sold to students as a minimal requirement of rationality—"don't choose what is worse." This suggests an ordinal comparison. However, the inclusion of dominance by mixtures silently imports cardinal utility and risk neutrality (linearity). A student might understand "worse" ordinally but fail to grasp that comparing a sure thing to a lottery requires measuring intensity of preference. The practice thus pulls apart into a simple ordinal story for intuition and a complex cardinal machinery for execution.

  Finally, the epistemic burden of Common Knowledge of Rationality conflicts with the computational reality of checking dominance. As the game grows, checking for dominance by mixture requires solving linear programs. Presupposing that agents commonly know each other to be rational implies they commonly know each other to have solved these complex optimization problems. This creates a tension between the idealized epistemic state (infinite knowledge) and the procedural rationality required to verify the conditions for deletion. The practice assumes agents are logically omniscient regarding the game structure, which is a far heavier presupposition than the thin notion of instrumental rationality initially presented. The thin justification cannot support the thick epistemic and mathematical load required for the iteration to hold. The procedure asks for common knowledge of a capacity that is computationally demanding, masking the complexity behind the label of "rationality."

  The implicit theory

  The implicit theory is that strategic rationality consists in the common knowledge of expected utility maximization among agents who possess convex strategy spaces. It posits that agents are not only motivated to maximize but are epistemically transparent to one another regarding this motivation, and capable of verifying dominance relations involving probabilistic acts. Rationality is located not just in the choice made, but in the belief structure regarding others' choices and the mathematical capacity to evaluate lotteries.

  My verdict is that this theory is mathematically robust but philosophically overstated when presented as mere "instrumental rationality." It smuggles in heavy structural assumptions about value and epistemology under the guise of simple prudence. The procedure works effectively as a solution concept because the mathematical constraints are tight, but the justification offered to students is misleadingly thin. It treats a specific, rich model of agency—cardinal, probabilistic, logically omniscient—as if it were the minimal definition of rational behavior. The practice is sound within its formal system, but it claims a normative universality it does not possess. It is a theory of idealized computation and specific risk attitudes, not a universal law of rational choice. Recognizing this distinction is crucial for understanding the limits of game theoretic predictions in real-world scenarios where these heavy presuppositions fail to hold.

  If the load-bearing presupposition goes

  If we abandon the presupposition of cardinal utility required for dominance by mixtures, the procedure must be radically simplified. We would be restricted to deleting only those strategies strictly dominated by other *pure* strategies. This weakens the solution concept significantly, as many strategies eliminable by mixtures would survive. The teaching of the procedure would need to shift from a general claim about rationality to a specific claim about risk-neutral expected utility maximizers. Instructors would have to explicitly state that agents with different risk attitudes might retain strategies that risk-neutral agents would delete.

  Furthermore, without the convexity of the strategy space implied by mixed acts, the guarantee that a solution exists or is unique diminishes. The pedagogical narrative would change from "rational players never do this" to "risk-neutral players with specific beliefs never do this." This honesty would reduce the procedure's appeal as a universal tool but increase its accuracy. We would also need to address the epistemic load. If we relax Common Knowledge of Rationality, iteration stops after the first round. Teaching would then focus on single-step deletion as a bound on behavior rather than a predictor of specific outcomes. The procedure would become a tool for bounding possible play rather than solving the game.

  Ultimately, giving up the load-bearing assumption of cardinal comparability transforms the procedure from a solution method into a consistency check. It would no longer claim to identify what players *will* do, but only what they *might* do if their preferences satisfy specific linearity conditions. The textbook presentation would need to include warnings about risk attitudes and computational limits, replacing the clean, universal story with a contingent, model-dependent one. This would make game theory less elegant but more empirically honest, acknowledging that rationality alone does not dictate the deletion of strategies dominated by mixtures without additional assumptions about how agents value uncertainty. The connection to Nash Equilibrium would also require clarification, as the set of surviving strategies would be larger, potentially including equilibria that rely on non-linear preferences. The procedure would become less about solving games and more about mapping the boundaries of rational choice under specific structural constraints.
