      *   **Theory (P) Perceptual-Functional:** Identity based on use/perception within a system (functional role).
      *   **Case 1 (Single vs. Double Storey 'a'):** Standard typographic variation (allography).
      *   **Case 2 (Kestrel Sans - Rotated Glyphs):** b/q, p/d, n/u share geometric shapes but differ in orientation/function.
