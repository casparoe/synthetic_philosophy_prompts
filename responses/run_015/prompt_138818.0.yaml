answer: |-
  ### Model Answer Criteria (For Grading Reference)

  Before grading, here is what a top-tier (18–20/20) answer would need to demonstrate. You can use this to calibrate your own expectations for the rest of the set.

  *   **Nuance on (G):** A model answer should note that (G) need not be "naive." A sophisticated geometric account can include *orientation relative to a baseline* as a defining feature. Dismissing (G) on Case 2 requires arguing why orientation *shouldn't* count as a geometric feature in notation, not just asserting it doesn't.
  *   **Allography vs. Identity:** Clear distinction in Case 1 between *letter types* (the abstract category) and *glyphs/allographs* (the visual realizations). Both (H) and (P) must explain why these variations don't constitute new letters.
  *   **The Goodman Constraint:** In Case 2, a strong answer might reference Nelson Goodman's distinction between autographic and allographic arts. In notation, identity is usually disjoint from history (unlike paintings), which puts pressure on (H). Why does history matter for letters if they are essentially notational?
  *   **Case 3 Metaphysics:** In Case 3, (P) implies a functionalist ontology (if it walks like an 'a', it is an 'a'). A model answer would acknowledge the counter-intuitive result: this implies *convergent evolution* yields numerical identity, not just functional equivalence. This needs to be flagged as a cost of adopting (P).
  *   **Internal Consistency:** The conclusion must reconcile the definition of (P) with the "badly written token" example. If identity is fixed by community use, a badly written token that fails to be perceived as 'a' is not an 'a'—but the student needs to explain *what* it is then (a failed token? a different mark?).

  ***

  ### Grade: 16 / 20

  ### Marker's Comments

  **General Impression:**
  This is a competent, clearly structured answer that demonstrates a solid grasp of the three accounts. You apply the theories consistently to the cases and arrive at a defensible conclusion. However, you miss two significant philosophical nuances: one regarding the definition of "shape" in account (G), and one regarding the metaphysical implications of account (P) in Case 3. These are not fatal errors, but they prevent the answer from reaching the highest band.

  **Point-by-Point Feedback:**

  *   **Intro: "All three accounts can agree on one thing: there is no list of intrinsic shape features that every a has."**
      *   **Right:** Correctly identifies the problem of variation for naive essentialism.
      *   **Subtly Off:** You move too quickly from "no *single* feature is necessary" to "(G) in its naive form is out." A sophisticated (G) could rely on a *cluster concept* or family resemblance of features rather than a strict list. You don't need to defend (G), but acknowledging this possibility would show greater philosophical care.

  *   **Case 1: "(H) handles this easily... (P) handles it too, and better: fluent readers read both as a and use them interchangeably, which makes them two allographs of one letter rather than two letters."**
      *   **Right:** Excellent use of the term "allographs." You correctly identify that both theories can accommodate variation without multiplying letter types.
      *   **Why this works:** You distinguish between the abstract letter (type) and the visual form (token/allograph), which is crucial for Case 1.

  *   **Case 2: "Kestrel Sans's b and q are literally the same shape, since rotating a shape does not change which shape it is... (G) is therefore committed to saying that b and q are the same letter, which is absurd"**
      *   **Subtly Off (Major Point):** This is the weakest part of your essay. You assume (G) must treat shape as abstract geometry independent of orientation. However, in the context of *notation* and *writing systems*, "shape" standardly includes orientation relative to a baseline. A geometric account can stipulate that a "b-shape" is defined by a stem on the right *relative to the reading direction*.
      *   **Why this matters:** You have straw-manned (G) to make it collapse. A defender of (G) would argue that a 180-degree rotation *does* produce a different geometric configuration relative to the page frame. You needed to argue why orientation *shouldn't* count as a feature, not just assert it doesn't.

  *   **Case 2: "(H) does fine here: the b and the q have separate copying histories, so they are different letters even though they share a shape."**
      *   **Right:** Correct application of the Causal-Historical theory. This is the strongest selling point for (H) in this specific case.
      *   **Comment:** You might have noted the tension here: if (H) is the truth about letters, then letters are more like biological species than like mathematical symbols. This is a cost of (H), but you applied the theory correctly.

  *   **Case 3: "But notice that this shows (H) is really just the intentionalist view in disguise... because the copier has to intend to reproduce the letter he sees."**
      *   **Right:** Sharp insight. Causal chains in semantics and reference usually require intentional preservation of reference (Gricean intentions). You correctly identify that without intention, the chain is broken.
      *   **Why this works:** This demonstrates you understand the mechanism of (H), not just the label.

  *   **Case 3: "On (P), by contrast, the Chalk River forms are Roman letters: a reading community perceives them as such and uses them to read, and that is all (P) asks for."**
      *   **Subtly Off:** You accept a very strong metaphysical conclusion without blinking. If (P) is true, then two independently invented scripts that function identically are *numerically identical* scripts. This means the Roman alphabet was "invented" twice.
      *   **Why this matters:** A model answer would flag this as a counter-intuitive consequence of (P). Are they *Roman* letters, or just *functional equivalents* to Roman letters? You treat these as the same, but a philosopher of language might distinguish the *name* of the letter (historical) from its *function* (perceptual).

  *   **Conclusion: "Being an a is not the same as being readable as an a — that distinction matters — but on (P) letter identity is fixed by what a reading community actually does with a form..."**
      *   **Subtly Off (Internal Tension):** There is a tension between your first clause and your second. If identity is *fixed* by what the community does (as you say in the second clause), then if the community cannot read it (the "badly written token"), it is *not* an 'a'.
      *   **Why this matters:** You try to keep a distinction ("being" vs "readable") that your endorsed theory (P) actually collapses. If (P) is true, unreadable tokens are not 'a's. You need to own that consequence rather than suggesting "being an a" is something over and above the perceptual uptake.

  **Summary for Appeal Defence:**
  The student lost marks primarily on the handling of Case 2 (failing to consider that orientation can be a geometric feature) and the Conclusion (failing to reconcile the definition of (P) with the distinction between identity and legibility). The application of (H) and the general structure were excellent. The grade reflects a strong understanding of the prompt with specific philosophical blind spots.
