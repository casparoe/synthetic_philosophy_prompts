  3.  **Drafting the Model Answer Criteria (Mental Check):**
      *   *Critique of (G):* Must acknowledge that (G) struggles with variation (Case 1) and orientation (Case 2). A sophisticated (G) might appeal to "canonical orientation" or "abstract shape types," but the prompt implies a naive feature list.
      *   *Critique of (H):* Good for Case 1 (lineage). Good for Case 2 (distinct lineages). Fails Case 3 (no lineage to Roman alphabet).
