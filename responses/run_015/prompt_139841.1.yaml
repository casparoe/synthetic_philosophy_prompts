  **JOINT STATEMENT ON THE MODELING OF HISTORICAL DYNAMICS**

  **Date:** October 26, 2023
  **Prepared by:** The Rapporteur, Interdisciplinary Colloquium on Historical Predictability
  **Signatories:** [Structural-Demographic Modeler], [Humanistic Historian]

  ### I. Areas of Agreement

  We, the undersigned, having engaged in adversarial collaboration over the course of one academic year, submit the following claims as points of consensus. These statements define the boundary conditions within which our disagreements operate.

  1.  **Complexity and Reduction:** Historical systems are complex, adaptive, and multi-causal. Any model, whether mathematical or narrative, necessarily reduces this complexity. Reduction is not inherently invalid, but the losses incurred by simplification must be explicitly acknowledged.
  2.  **Data Limitations:** Quantitative historical databases (e.g., Seshat) and qualitative archival records are both incomplete, biased by survival and selection effects, and subject to interpretive coding. Neither source offers a "view from nowhere."
  3.  **The Role of Agency:** Human intentionality and meaning-making are real features of history. The dispute lies not in whether agency exists, but in whether aggregate outcomes can diverge systematically from individual intentions in ways that are law-like and predictable.
  4.  **Utility of Dialogue:** Structural-demographic modeling and humanistic historiography ask different questions. Modeling seeks aggregate regularities and risk factors; hermeneutics seeks meaning, context, and contingency. Each approach corrects blind spots in the other.
  5.  **Non-Stationarity:** The parameters governing social systems are not necessarily constant over time. Technological, energetic, and ecological regime shifts (e.g., industrialization) may alter the functional relationships between variables.
  6.  **Operationalization:** Concepts such as "elite," "instability," and "state capacity" require operational definitions to be tested. We agree that ambiguity in these definitions is a primary source of our divergence.

  ### II. Residual Disagreements and Cruxes

  The following table enumerates the specific points where our interpretations diverge. For each crux, we have formulated the opposing positions charitably, such that each signatory accepts the formulation as an accurate representation of their own view. We specify the evidence or test both parties agree would bear on the question, and we record pre-registered predictions where applicable.

  | Crux | Structural-Demographic Position (SDM) | Humanistic-Historical Position (HH) | Proposed Test / Evidence | Nature of Dispute |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Single-Realization & Periodicity** | Apparent secular cycles (200–300 years) reflect endogenous feedback loops (population/resources) distinguishable from stochastic noise via spectral analysis and surrogate data testing. | Historical time series constitute a single trajectory (N=1). Apparent periodicity is indistinguishable from red noise or retrospective pattern-matching on unevenly sampled data. | **Surrogate Data Analysis:** Generate 10,000 surrogate time-series preserving the autocorrelation and trend of the Seshat/warfare data but randomizing phase. Compare spectral power of actual data against null distribution.<sup>1</sup> | **Empirical / Methodological** |
  | **2. Out-of-Sample Forecasting** | Mechanisms identified in pre-modern data (pre-1800) retain explanatory power for modern instability, provided parameters are adjusted for scale. A failed forecast indicts parameter estimation, not the structural mechanism. | Industrialization and fossil-fuel energy represent a qualitative regime change. Models fitted to agrarian logic cannot forecast post-1800 dynamics; failure indicts the mechanism's universality. | **Temporal Holdout:** Fit model on data pre-1800 (or pre-1500 for Europe). Forecast instability indices 1800–2000. Evaluate fit against independent instability metrics (e.g., POLITY, conflict datasets).<sup>2</sup> | **Empirical (Contingent)** |
  | **3. Measurement of Elite Overproduction** | "Elite overproduction" can be proxied independently of instability (e.g., ratio of degree-holders to positions, wealth concentration) and serves as a leading indicator. | "Overproduction" is often diagnosed retrospectively based on the presence of conflict. Without independent metrics, the claim is tautological (instability proves overproduction). | **Blind Coding:** Code "elite surplus" indicators for 50 polities without knowledge of their subsequent stability outcomes. Correlate with subsequent instability events.<sup>3</sup> | **Empirical / Operational** |
  | **4. Ontology of Prediction** | "Prediction" refers to probabilistic forecasting of system states (e.g., risk of instability) based on structural variables, analogous to epidemiology or seismology. | "Prediction" implies a determinism incompatible with the open-ended nature of human meaning. History explains *why* events occurred, not *that* they must occur. | **Conceptual Analysis:** No empirical test. Resolution requires negotiating a shared vocabulary or agreeing to distinct terminologies (e.g., "forecasting" vs. "explaining").<sup>4</sup> | **Philosophical / Verbal** |

  ### III. Pre-Registered Predictions

  Regarding the empirical cruxes (I–III above), the signatories submit the following predictions prior to the execution of the proposed tests.

  *   **Crux 1 (Periodicity):**
      *   **SDM:** The actual historical data will exceed the 95th percentile of spectral power in the surrogate data set at the 2–3 century frequency band.
      *   **HH:** The actual historical data will not differ significantly from the surrogate red-noise models; significance will vanish when sampling unevenness is accounted for.
  *   **Crux 2 (Forecasting):**
      *   **SDM:** The model will capture the broad trend of 19th and 20th-century instability (e.g., the mid-20th-century peak), even if specific events are missed.
      *   **HH:** The model will fail to capture the timing or magnitude of the 20th-century peaks, demonstrating a structural break between agrarian and industrial logics.
  *   **Crux 3 (Elite Measurement):**
      *   **SDM:** Blind-coded elite surplus metrics will correlate significantly ($p < 0.05$) with instability events occurring 10–20 years later.
      *   **HH:** Correlation will be weak or non-existent once coding bias (knowledge of outcome) is removed, or the definition of "elite" will prove too unstable to code blindly.

  ### IV. Classification of Disputes

  In the spirit of the Rapporteur's request for clarity regarding the solvability of these disputes, we classify the cruxes as follows:

  1.  **Verbal:** Crux 4 is primarily terminological. No amount of data will resolve whether the word "prediction" is appropriate for probabilistic social forecasting. This requires a semantic agreement, not an experiment.
  2.  **Empirical and Decidable:** Cruxes 1, 2, and 3 are, in principle, decidable by data. However, the *interpretation* of a negative result remains contested (see Crux 2, regarding non-stationarity).
  3.  **Philosophical:** Underlying Crux 4, and informing Crux 1, is a philosophical disagreement regarding the ontology of social kinds. If the HH views "states" and "elites" as nominalist constructs rather than natural kinds, no statistical test will fully satisfy the objection that the units of analysis are not real.

  ***

  **Notes on Framing and Question-Begging**

  1.  **Regarding Crux 1:** The HH signs onto the surrogate data test *for the sake of adjudicating the SDM's claim*, not because they concede that history is adequately modeled as a time-series. The HH maintains that treating history as a signal-to-noise problem may itself be a category error.
  2.  **Regarding Crux 2:** The SDM objects to the framing that a failed forecast "indicts the mechanism's universality." They argue that a model can be structurally sound but require parameter updates for new energy regimes. The test above attempts to allow for parameter adjustment, but the HH argues that if parameters must be completely reset, the "mechanism" is vacuous.
  3.  **Regarding Crux 3:** The HH notes that "elite" is a contested category. A landowner in 1600 and a tech CEO in 2000 may not belong to the same operational class. The blind coding test assumes "elite" is a stable category across time, which the HH disputes.
  4.  **Regarding Crux 4:** The SDM notes that importing standards from population ecology is deliberate, not covert. They argue that social systems *are* ecological systems. The HH rejects this naturalism. This is a metaphysical disagreement that data cannot settle.

  **Signed,**

  _________________________
  [Structural-Demographic Modeler]

  _________________________
  [Humanistic Historian]

  _________________________
