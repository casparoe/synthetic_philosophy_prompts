answer: |-
  **Brainstorming**

  *   **Verdict Voting:** Students vote on cases presented by tutor.
      *   Experience: Participants feel intellectual agreement or disagreement quickly.
      *   Weakness: Detached from practical consequences; fails to simulate the cost of error.
  *   **Role-play Dialogue:** Students enact conversations varying stakes and context.
      *   Experience: Participants feel the social pressure of asserting knowledge.
      *   Weakness: Hard to isolate variables; conversation drifts away from the core epistemic factors.
  *   **Token Exchange:** Ascribers write claims, Operators bet tokens based on them.
      *   Experience: Participants feel the risk of being wrong when resources are committed.
      *   Weakness: Might reduce epistemology to mere gambling without reflecting on truth conditions.

  **Selected Design: The Transmission Game**

  **Setup and Roles**
  Divide the fourteen students into four groups of three, with two students acting as Scrivener (whiteboard) and Auditor (rules/payoffs). Roles rotate halfway. Each group contains a **Subject** (holds the evidence), an **Ascriber** (writes the claim), and an **Operator** (acts on the claim).

  **The Fixed Scenario:** The Subject wants to know if the 14:00 train to Brighton runs on Saturdays. Evidence is fixed across all rounds: a timetable checked three weeks ago and a colleague's casual confirmation. No new evidence may be gathered.

  **The Rules:**
  1.  **No Hedging:** The Ascriber must write exactly one sentence: either 'Mira knows the train runs on Saturdays' or 'Mira does not know...'. No probabilities, no 'probably', no 'check first'.
  2.  **Blind Operator:** The Operator sees *only* the sentence. They do not know the stakes or context details unless inferred from the sentence (which they cannot be). They must decide whether to commit a resource (a 'travel token') based solely on that assertion.
  3.  **Payoff:** Groups earn chocolate points. If the Operator commits and the 'fact' is true (it is, in this simulation), they gain 2 points. If false, they lose 2 points. Withholding yields 0. The Subject wants the Operator to commit; the Operator wants to avoid loss.

  **Procedure (90 Minutes)**

  *   **00–05:** Distribute roles and rules. No lecture on theories.
  *   **05–20: Round 1 (Baseline).** Subject Stakes: Low (casual trip). Ascriber Context: Relaxed (chatting in café). Operator Stakes: Low (own leisure time). *Expected:* Ascriber writes 'Knows'; Operator commits.
  *   **20–35: Round 2 (High Subject Stakes).** Subject Stakes: High (missing train means missing wedding). Ascriber Context: Relaxed. Operator Stakes: Low. *Variation:* Only Subject knows stakes are high.
  *   **35–50: Round 3 (High Ascriber Context).** Subject Stakes: Low. Ascriber Context: Demanding (error possibility salient: 'Timetables change'). Operator Stakes: Low. *Variation:* Only Ascriber knows context is demanding.
  *   **50–65: Round 4 (High Operator Stakes).** Subject Stakes: Low. Ascriber Context: Relaxed. Operator Stakes: High (Operator is guiding a blind passenger; error causes injury). *Variation:* Only Operator knows their stakes are high.
  *   **65–75:** Role rotation. Repeat Round 4 with new personnel to check consistency.
  *   **75–90:** Debrief and grid analysis.

  **Data Collection and Diagnosis**
  The Scrivener draws a 4x4 grid on the whiteboard (Rows = Rounds, Columns = Groups). Cells record the Operator's choice: Commit (✓) or Withhold (✗).

  *   **Contextualism (EC):** Predicts ✗ in Round 3 (Ascriber context shifts standards), but ✓ in Round 2 (Subject stakes irrelevant) and Round 4 (Operator stakes irrelevant to truth).
  *   **Pragmatic Encroachment (PE):** Predicts ✗ in Round 2 (Subject stakes raise threshold), but ✓ in Round 3 (Ascriber context irrelevant) and Round 4 (Operator stakes irrelevant).
  *   **Reliance-Relative Invariantism (RRI):** Predicts ✗ in Round 4 (Operator stakes fix truth), but ✓ in Rounds 2 and 3 (Subject/Ascriber factors irrelevant).

  **Diagnostic Weight:** Round 4 carries the most weight. It isolates the third variable. If Operators withhold despite low Subject stakes and Relaxed Ascriber contexts, RRI gains plausibility. If they commit, RRI fails. Rounds 2 and 3 distinguish the familiar rivals; Round 4 tests the invented view.

  **Debrief Instructions**
  Begin by displaying the grid. Do not name the theories yet. Ask: 'Why did Group 2 withhold in Round 2 but commit in Round 3?' Map their intuitions to the variables.

  1.  **Mapping:** Explain that withholding in Round 2 mirrors **Pragmatic Encroachment**: the subject's practical situation altered the knowledge condition. Withholding in Round 3 mirrors **Contextualism**: the ascriber's conversational demands altered the standard. Withholding in Round 4 mirrors **Reliance-Relative Invariantism**: the truth of 'knows' depends on the safety required by the person acting on it.
  2.  **The 'Meaning' Objection:** If a student says, 'It just depends what you mean by knows', concede the point but press further. Ask: 'Which meaning tracks our actual practice when lives are at stake?' Use this to introduce the semantic vs. pragmatic distinction later in the course.
  3.  **The 'Check First' Objection:** If a student insists the Subject should simply check the timetable again, remind them of the fixed evidence rule. Epistemology asks what we know *given* our evidence, not how to get more. The simulation forces a decision on current warrant.
  4.  **Expected Attraction:** Students usually find **Pragmatic Encroachment** most attractive initially. It aligns with the intuition that knowledge must be actionable. Contextualism feels too linguistic; RRI feels too disconnected from the subject. Use this preference to motivate why PE is a serious contender despite its complexities.

  **Closing Notes**

  **Predictable Errors and Remedies**
  *   **Hedging:** Ascribers will write 'Mira probably knows'. *Remedy:* The Auditor must reject the card immediately. The semantic force of 'knows' requires binary commitment.
  *   **Communication Leak:** Subjects might accidentally reveal stakes to Ascribers. *Remedy:* Enforce physical separation during the writing phase. Use index cards passed face-down.
  *   **Operator Confusion:** Operators may feel cheated not knowing the stakes. *Remedy:* Remind them this mirrors real life; we often act on testimony without knowing the testifier's context.

  **Limitations of the Activity**
  Be frank in the final five minutes. This simulation elicits verdicts about *assertability* and *willingness to act*, not necessarily truth conditions. A Contextualist can explain the Round 2 results pragmatically (you shouldn't assert because stakes are high, not because it's false). Similarly, the activity cannot distinguish a semantic shift from a pragmatic explanation of the same pattern; that requires argumentation beyond the game. Furthermore, the staging cannot capture the full metaphysical weight of **Reliance-Relative Invariantism**; it makes the view look plausible by tying it to immediate risk, but it cannot show whether this reliance factor is part of the *meaning* of knowledge or merely a rule of caution. You must supply the philosophical heavy lifting in the following lecture to explain why these distinctions matter for the analysis of knowledge itself.
