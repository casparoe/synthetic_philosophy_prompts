  ### Candidate Structures

  **1. The Chronological Track**
  This structure follows the session's case order rigidly. We begin with Black's spheres, branch on their possibility, then move to the sequential variant, branch on counterfactuals, and end with quantum particles.
  *   *Pros:* Mirrors the reading flow; easy for students to track during the seminar.
  *   *Cons:* Risks fragmenting metaphysical commitments. A student might hold a consistent view (e.g., Haecceitism) that manifests differently across cases, causing the tree to scatter their position across multiple leaves rather than consolidating it.

  **2. The Metaphysical Commitment Track**
  This structure starts with abstract commitments (e.g., "Is PII necessary?") and uses the cases merely as illustrations to confirm the branch.
  *   *Pros:* Cleanly maps the logical space of positions (Haecceitism vs. Bundle Theory etc.).
  *   *Cons:* Violates your constraint against abstract "ism" questions at the nodes. Second-year students cannot self-identify as haecceitists without concrete prompts. It also relegates the cases to examples rather than building the tree *around* them as requested.

  **3. The Hybrid Diagnostic Track (Selected)**
  This structure begins with the concrete verdict on Black's case, uses the sequential variant to probe the *source* of distinctness (the de re question), and employs the quantum case as a limit-test for the resulting position.
  *   *Pros:* Respects the case order while ensuring the metaphysical distinctions (grounding vs. necessitating, haecceity vs. brute difference) emerge from the students' intuitions about the cases. It allows the "de re" question to do the heavy lifting as requested.
  *   *Cons:* Requires careful phrasing to ensure the transition from Black's case to the sequential case feels natural rather than abrupt.

