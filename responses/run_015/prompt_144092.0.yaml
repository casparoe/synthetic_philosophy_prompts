prompt: |-
  Draft the joint statment of an adversarial collaboration between a Theravada ethicist who holds that cetana (intention/volition) is the sole determinant of karmic weight and that actual outcomes are morally irrelevant, and a Buddhist consequentialist who holds that reducing aggregate dukkha is the only coherent aim of the path and that cetana is only instrumentally valuable. I want the claims both can sign about karma, rebirth, and the Bodhisattva ideal; the precise disagreement phrased so each side accepts the wording of its own view; the cruxes—especially whether an act done with pure intention that accidentally causes massive suffering generates negative karma for the agent; and for each crux a shared test case with both sides' predictions written down in advance. Format it as a numbered agreed-claims section followed by a disagreements table. Don't include bibliographies or citation requests—just work it out from the concepts.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Parties:**
          *   Party A: Theravada Ethicist (Intentionalist). Core belief: *Cetana* (intention) is the sole determinant of karmic weight. Outcomes are morally irrelevant.
          *   Party B: Buddhist Consequentialist. Core belief: Reducing aggregate *dukkha* (suffering) is the only coherent aim. *Cetana* is instrumentally valuable (good because it usually leads to good outcomes), not intrinsically.
      *   **Topics:** Karma, Rebirth, Bodhisattva Ideal.
      *   **Requirements:**
          *   Numbered agreed-claims section.
          *   Disagreements table (precise phrasing acceptable to both sides describing their own view).
          *   Specific Cruxes: Specifically address the "pure intention/accidental suffering" scenario.
          *   Shared Test Cases: For each crux, a scenario with pre-registered predictions from both sides.
          *   Format: Joint Statement.
          *   Constraint: No bibliographies or citation requests.

  2.  **Deconstruct the Positions:**

      *   **Theravada Intentionalist (TI):**
          *   *Karma:* Is volition (*cetana*). "Having intended, one acts."
          *   *Outcome:* Accidental results don't create karmic fruit (*vipaka*) for the agent.
          *   *Rebirth:* Driven by the quality of volition at death/life.
          *   *Bodhisattva:* Admired for intention/paramis, but Arhatship is the primary soteriological goal in Theravada. (Need to find common ground here).
          *   *Ethics:* Deontological/Virtue Ethics hybrid focused on mind-state purification.

      *   **Buddhist Consequentialist (BC):**
          *   *Karma:* A causal mechanism where actions are judged by their contribution to suffering/happiness.
          *   *Outcome:* The actual reduction of *dukkha* is the metric.
          *   *Rebirth:* A framework for understanding long-term consequences of actions on sentient continuity.
          *   *Bodhisattva:* The ideal model because it maximizes welfare across time.
          *   *Ethics:* Utilitarian/Consequentialist within a Buddhist framework.

  3.  **Drafting Agreed Claims (The "Overlap"):**
      *   Both accept the Four Noble Truths.
      *   Both accept *Karma* as a law of cause and effect (moral causality).
      *   Both accept *Rebirth* (Samsara) as the context.
      *   Both accept *Cetana* is crucial (TI: constitutive; BC: primary causal driver).
      *   Both accept the goal is liberation from *Dukkha* (Nirvana), though the path emphasis differs.
      *   Both agree that *ignorance* (Avijja) is the root cause.
      *   Both agree that harming beings is generally to be avoided.

      *Refinement:* Need to make sure the language is neutral enough. Instead of "Karma is intention," say "Karma is inextricably linked to intention." Instead of "Goal is reducing suffering," say "Goal involves the cessation of suffering."

  4.  **Drafting Disagreements (The "Cruxes"):**
      *   *Crux 1: The Moral Weight of Outcomes.*
          *   TI: Outcome adds no karmic weight.
          *   BC: Outcome determines karmic weight.
      *   *Crux 2: The Definition of Karma.*
          *   TI: Karma *is* the volition.
          *   BC: Karma is the action+result complex; volition is just the lever.
      *   *Crux 3: The Bodhisattva Ideal.*
          *   TI: A valid path of extreme renunciation, but not strictly necessary for liberation.
          *   BC: The ethically superior path because it maximizes welfare.

  5.  **Developing Test Cases:**
      *   *Scenario 1 (The Accidental Harm):* A monk moves a rock to clear a path (good intention). The rock slides and kills a traveler (bad outcome).
          *   TI: No negative karma.
          *   BC: Negative karma (due to suffering caused), though perhaps mitigated by intention.
      *   *Scenario 2 (The Failed Rescue):* A Bodhisattva tries to save a drowning child (good intention) but fails, and the child dies.
          *   TI: Positive karma (virtuous intention).
          *   BC: Neutral or Negative (suffering was not reduced/prevented despite capacity). *Correction:* BC might argue "attempted reduction" has value, but if the *aggregate* dukkha wasn't reduced, the karmic merit is lower than a successful rescue. Let's make it sharper.
      *   *Scenario 3 (The Comforting Lie):* Lying to a dying person to comfort them.
          *   TI: Negative karma (violation of precept/intention to deceive).
          *   BC: Positive karma (reduction of suffering outweighs truth violation).

      *Selection:* The prompt specifically asks for the "act done with pure intention that accidentally causes massive suffering" crux. I must include that. I should add one more for depth (e.g., the "Lying" case or the "Negligence" case). Let's stick to the prompt's specific request for the "pure intention/accidental suffering" as the primary crux, and maybe add one about negligence vs. pure accident to clarify the "intention" boundary. Actually, the prompt asks for "for each crux a shared test case." So I need to identify the cruxes first.

      *Crux 1: Moral Weight of Unintended Consequences.* (The Rock Scenario).
      *Crux 2: The Primacy of the Bodhisattva Vow.* (The Sacrifice Scenario).

  6.  **Refining the Language (Iterative Process):**
      *   *Challenge:* How to phrase the disagreement so both accept the wording?
      *   *Solution:* Use "Party A holds..." and "Party B holds..." within the table. The statement itself is the agreement to disagree on these specific points.
      *   *Challenge:* Rebirth.
      *   *Solution:* Both agree it exists, but disagree on how karma shapes it (momentum of will vs. causal outcome trajectory).
      *   *Challenge:* Bodhisattva.
      *   *Solution:* TI sees it as a specific vow; BC sees it as the ethical imperative.

  7.  **Final Review against Constraints:**
      *   Numbered agreed-claims? Yes.
      *   Disagreements table? Yes.
      *   Cruxes included (Intention/Outcome)? Yes.
      *   Test cases with predictions? Yes.
      *   No bibliographies? Yes.
      *   Tone: Formal, collaborative, philosophical.

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *Agreement:* Samsara, Dukkha, Cetana importance, Nirvana as end.
      *   *Disagreement:* Is karma the seed (intention) or the harvest (result)?
      *   *Test Case:* The Bridge Collapse. Engineer builds bridge to help village (good cetana). Bridge collapses due to unknown fault, kills 50 (bad outcome).
      *   *TI Prediction:* Good karma only.
      *   *BC Prediction:* Net negative karma (due to 50 deaths), intention mitigates but doesn't erase.

      *Wait, need to be careful with BC.* A sophisticated BC might say "Karma is about the *trend* of volition." But the prompt defines the BC as holding "reducing aggregate dukkha is the only coherent aim." So if dukkha increased, the aim failed. I will stick to the prompt's definition.

      *Refining the Bodhisattva point:* TI (Theravada) acknowledges the Bodhisattva path but prioritizes the Arhat. BC prioritizes the Bodhisattva.
      *Agreement:* Both are valid paths within the Dharma.
      *Disagreement:* Which is ethically normative for all practitioners.

  9.  **Final Polish:** Check the tone. Ensure it sounds like a "Joint Statement." Ensure the "Crux" section is clear.

      *(Self-Correction during drafting)*: Make sure the Theravada position doesn't sound *too* rigid. They acknowledge negligence (*kukkucca*) involves intention. The test case must be *true accident* (no negligence).
      *(Self-Correction on BC)*: Ensure the BC doesn't sound like a secular utilitarian. They must ground it in *Dukkha* and *Karma*.

      Let's assemble the document.

      *Structure:*
      1. Title.
      2. Preamble.
      3. Section I: Areas of Consensus (Numbered).
      4. Section II: Areas of Divergence (Table).
      5. Section III: Registered Disagreements & Test Cases (The Cruxes).

      *Wording Check:* "Cetana is the sole determinant" vs "Cetana is instrumentally valuable."
      *Rebirth:* Both agree it happens. TI: Driven by karmic volition. BC: Driven by causal impact on the stream of consciousness/suffering.
      *Bodhisattva:* TI: Rare vow. BC: Universal obligation.

