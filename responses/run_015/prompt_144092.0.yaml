  # JOINT STATEMENT ON ETHICAL ONTOLOGY AND KARMIC CAUSALITY
  **Between the Theravada Intentionalist School (TIS) and the Buddhist Consequentialist School (BCS)**

  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Karma, Rebirth, and the Bodhisattva Ideal

  ## PREAMBLE
  We, the undersigned representatives of the Theravada Intentionalist School (TIS) and the Buddhist Consequentialist School (BCS), enter this collaboration to clarify the doctrinal and ethical boundaries of our respective positions. While we share a common commitment to the Dharma, the Four Noble Truths, and the cessation of *Dukkha*, we diverge on the mechanistic nature of Karma and the normative weight of outcomes. This document records our areas of consensus, precisely delineates our disagreements, and registers pre-committed predictions on specific test cases to facilitate future empirical or doctrinal resolution.

  ## SECTION I: AREAS OF CONSENSUS
  The following claims are affirmed by both TIS and BCS as foundational to our shared Buddhist framework:

  1.  **The Reality of Samsara:** Both parties affirm that sentient beings are subject to cyclic existence (*Samsara*) driven by ignorance (*Avijja*) and craving (*Tanha*).
  2.  **The Centrality of Dukkha:** Both parties agree that *Dukkha* (suffering/unsatisfactoriness) is the fundamental problem to be addressed and that its cessation (*Nirodha*) is the ultimate soteriological goal.
  3.  **The Necessity of Cetana:** Both parties agree that *Cetana* (volition/intention) is the primary active factor in ethical life. Without volition, an event is karmically inert.
  4.  **The Law of Cause and Effect:** Both parties affirm Karma as a law of moral causality, wherein ethical actions condition future experiences.
  5.  **The Value of the Precepts:** Both parties agree that the Five Precepts are essential training rules for minimizing harm and cultivating mental clarity, though we differ on their ontological status (intrinsic vs. instrumental).
  6.  **Rebirth as Continuity:** Both parties affirm rebirth as the continuation of the causal stream of consciousness, conditioned by past actions.
  7.  **The Possibility of Liberation:** Both parties affirm that liberation (*Nirvana*) is attainable and constitutes the end of karmic accumulation.

  ## SECTION II: AREAS OF DIVERGENCE
  The following table outlines our precise disagreements. The wording in each cell is drafted to be acceptable to the party holding the view, while accurately describing the divergence to the opposing party.

  | Topic | Theravada Intentionalist School (TIS) Position | Buddhist Consequentialist School (BCS) Position |
  | :--- | :--- | :--- |
  | **Definition of Karma** | Karma is *Cetana* alone. The act of volition is the karmic seed; the physical or verbal outcome is merely the expression of that seed, carrying no independent moral weight. | Karma is the causal complex of volition *plus* outcome. Volition is the lever, but the moral weight is determined by the actual impact on the aggregate welfare of sentient beings. |
  | **Moral Relevance of Outcomes** | Outcomes are morally irrelevant to the agent's karmic ledger once intention is fixed. Accidental results do not generate *Vipaka* (karmic fruit) for the agent. | Outcomes are the primary metric of moral success. An action that increases aggregate *Dukkha*, regardless of intention, generates negative karmic potential that must be resolved. |
  | **Function of Rebirth** | Rebirth is the fruition of the qualitative momentum of the will. One is reborn according to the state of mind and volitional habits cultivated at death. | Rebirth is the relocation of the causal stream to a context commensurate with the net suffering/happiness generated by one's causal impact on the world. |
  | **The Bodhisattva Ideal** | The Bodhisattva path is a valid, highly meritorious vow of extreme renunciation, but the Arhat path (personal liberation) is equally sufficient and normative for most practitioners. | The Bodhisattva path is the ethically obligatory norm. Since the aim is the reduction of *Dukkha*, prioritizing personal liberation over the welfare of the whole is a suboptimal ethical strategy. |

  ## SECTION III: REGISTERED CRUXES AND TEST CASES
  We identify two specific cruxes where our theories yield contradictory predictions. We agree to the following test cases and record our predictions in advance.

  ### Crux 1: The Moral Weight of Unintended Consequences
  **The Question:** Does an act performed with pure, benevolent intention that accidentally results in massive suffering generate negative karma for the agent?

  **Test Case: The Benevolent Engineer**
  *   **Scenario:** An engineer, motivated solely by compassion and the desire to aid a remote village, designs a bridge. She exercises standard care, possesses no negligence, and holds no intention to harm. Due to a geological anomaly impossible to detect with current technology, the bridge collapses during construction, killing 50 workers.
  *   **Variables:**
      *   Intention: 100% Benevolent (*Kusala Cetana*).
      *   Negligence: None.
      *   Outcome: 50 Deaths (Massive increase in *Dukkha*).

  **Pre-Registered Predictions:**

  | Party | Karmic Verdict for the Engineer | Reasoning |
  | :--- | :--- | :--- |
  | **TIS** | **Positive Karma Only.** | The karmic act was the volition to help. The deaths are external events (*dhamma*) not owned by the agent's will. No negative *Vipaka* will ripen for the engineer regarding the deaths. |
  | **BCS** | **Net Negative Karma.** | While the intention mitigates the severity, the action resulted in a net increase of *Dukkha*. The karmic debt is real because the causal stream now contains 50 fewer lives and significant suffering. The agent must work to resolve this suffering to purify the karmic stream. |

  ***

  ### Crux 2: The Normativity of the Bodhisattva Vow
  **The Question:** Is the pursuit of personal liberation (Arhatship) ethically equivalent to the pursuit of universal liberation (Buddhahood), or is one ethically superior?

  **Test Case: The Escape vs. The Return**
  *   **Scenario:** A practitioner reaches the threshold of Nirvana. They have the capacity to enter final liberation immediately. However, they possess the capacity to remain in Samsara for 100 more lifetimes to teach and reduce the suffering of others, delaying their own final peace.
  *   **Variables:**
      *   Option A: Enter Nirvana now (End personal *Dukkha*).
      *   Option B: Remain in Samsara (Reduce aggregate *Dukkha*, prolong personal *Dukkha*).

  **Pre-Registered Predictions:**

  | Party | Ethical Verdict | Reasoning |
  | :--- | :--- | :--- |
  | **TIS** | **Ethically Equivalent.** | The primary duty is the purification of one's own mind and the end of one's own defilements. Once an Arhat, one naturally benefits the world through example. Choosing Option A is not a moral failure; it is the fulfillment of the Noble Truths. |
  | **BCS** | **Option B is Obligatory.** | Since the ethical aim is the minimization of aggregate *Dukkha*, choosing Option A is ethically suboptimal. The suffering of the many outweighs the delay of the one. Choosing Option A generates a subtle form of karmic stagnation rooted in self-preference. |

  ## SIGNATURES

