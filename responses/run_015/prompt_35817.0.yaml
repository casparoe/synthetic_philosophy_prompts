      *   *Q7: Counterfactuals (Hypothetical Frequency vs. Actual Frequency)*
          *   Scenario: A coin is destroyed after one flip. Did it have a probability?
      *   *Q8: Law of Large Numbers (Direction of Explanation)*
          *   Scenario: Why do frequencies stabilize? Because of probability or is probability *defined* by stabilization?
      *   *Q9: Physical Symmetry (Objective Bayesian/Indifference)*
          *   Scenario: Unknown cube factory. Do we assign 1/3 without data?
      *   *Q10: Humean Supervenience (Best System)*
