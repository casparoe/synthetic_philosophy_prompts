      *Wait, one nuance:* The user says "I suspect I will decide this the same way [Booth and Gradual], but I cannot see whether that is a real insight... or just stiffness of mind."
      *My task:* Confirm it is a real insight. They rely on the same theory of identity.

      *Let's structure the advice around the "Commitments".*

      *Commitment A:* If you believe the Arrival is *you* (Psychological Continuity), then the Vancouver body in the Twin scenario is also *you*. Destroying it (Standard) is suicide.
      *Commitment B:* If you sign the Surplus Clause, you admit the Copy is *not* a person. But if the Copy is not a person, the Arrival is not a person either (same tech). So the Arrival is a "facsimile," not "you."
      *Commitment C:* If Gradual is "real" continuity, Booth is "fake." You can't have both.

      *Recommendation:* Given the Surplus Clause and the imminent grief, the Booth involves too much metaphysical violence for a consistent worldview that values the self. However, the need to see the father is paramount.
