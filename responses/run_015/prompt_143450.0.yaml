      *   *Address the "Lossy" aspect:* Human memory is reconstructive, not reproductive. Locke knew this.
      *   *Address the "Substance" retreat:* Argue that Locke wouldn't retreat to substance because he explicitly argued *against* it being the criterion. He'd likely posit a "virtual substance" or simply double down on consciousness.

