answer: |-
  **The Gap Between the Flames**

  The morning sun did not rise in a continuous sweep for Sita. It arced in discrete frames, a stuttering film reel of light and shadow. For three months at the meditation center, she had sat until the architecture of her identity dissolved. Now, back in the city, the dissolution had not reversed.

  She sat in the waiting room of the notary public, watching the dust motes dance. To her ordinary mind, they drifted. To her insight, they were a series of static images, each arising and vanishing instantly, replaced by a new image in a slightly different position. There was no "drifter," only the drifting.

  Inside her own head, the silence was not empty; it was rhythmic. *Citta*. Arise. *Citta*. Vanish. Between the active moments of consciousness, she sensed the drop into *bhavaṅga*, the subconscious life-continuum. It was like a heartbeat of the mind, a dark, silent gap where no object was known, no self was present, only the latent potential for existence waiting to be sparked by the next contact.

  "Sita Vardhan?" the clerk called.

  She stood. The movement was not hers. It was *rupa* (form) responding to *sadda* (sound). There was no pilot in the body.

  In the office, a document lay on the desk. A renewal of fiduciary oath. One year ago, she had signed a similar paper, accepting responsibility for managing her late uncle's estate. The law required an annual reaffirmation.

  "Identity confirmed," the notary said, peering over his glasses. "Do you affirm that you are the same person who executed the original vow on this date last year? And do you accept the continuing obligations attached to that signature?"

  Sita looked at the pen.

  *Same person?*

  Her meditation had stripped the varnish off that phrase. She scanned her memory for the Sita of a year ago. She found only mental formations (*sankhara*). She remembered the feeling of grief at the funeral, the intention to honor her uncle, the muscular sensation of holding the pen. Those aggregates had ceased. They were dead.

  The Sita sitting here now was a new constellation. The cells in her hand were different. The memories were reconstructions occurring in the present moment. The consciousness that knew the pen was a fresh *citta*, born of the one before it, which was born of the one before that, stretching back in a causal chain to the woman who sat in this chair twelve months prior.

  But there was no thread. There was only the flame.

  She remembered the simile from the *Milinda Pañha*. If you light a candle from a flame, and let it burn all night, is the flame in the morning the same as the flame at dusk? No. Is it different? No. It is causally connected.

  "If I am not the same," Sita thought, "then the vow died with the aggregates that made it. Why should this new cluster of five aggregates suffer for a promise it did not make?"

  The notary waited. The clock on the wall ticked—*tock*... silence... *tock*. Like the *bhavaṅga* gaps.

  If she refused, the estate would freeze. Her cousins, who relied on the disbursements for their education, would suffer. Their anger would arise. New *kamma* would be generated. The causal stream, though selfless, carried the momentum of suffering (*dukkha*).

  "There is no one to be bound," she whispered.

  "Excuse me?" the notary asked.

  Sita looked at her hand. It was trembling, not from fear, but from the vibration of rapid arising and passing. She realized that moral obligation did not require a permanent self. It required only continuity. The pain that would arise in her cousins was real, even if the 'cousins' were also just processes. The guilt that would arise in this mind-stream was real, even if the 'guilt' was just a mental factor (*cetasika*).

  The flame does not say, 'I am not the previous flame, so I will not burn.' It burns because the fuel is present.

  "The agent is a convention," Sita said, her voice steady. "But the suffering is ultimate."

  She picked up the pen. The contact of metal on skin was a sharp, bright *citta*. She signed. The ink flowed, a physical trace of a mental intention that had already vanished.

  "I renew the vow," she said. "Not because I am the same. But because the stream must not be poisoned."

  She handed the pen back. The notary stamped the paper. The sound was a finality that existed only for a moment. Sita stood up. She felt light, unburdened by the weight of a self, yet heavy with the gravity of cause and effect. She walked out into the stuttering sunlight, a river without water, flowing relentlessly toward the sea.

  ***

  **Author's Note**

  **On Doctrine and Interpretation**

  This story dramatizes a specific intersection of Theravada meditation phenomenology and Buddhist ethics. In crafting Sita's experience, I have relied on several technical concepts from the Abhidhamma and the Commentarial tradition. It is important to distinguish between doctrines that are relatively settled within the tradition and those that remain subjects of scholarly or practical debate.

  **Settled Doctrines:**
  1.  **Momentariness of Consciousness (*Khaṇika*):** The analysis of consciousness (*citta*) into discrete, momentary units is a core tenet of Theravada Abhidhamma. The view that there is no enduring self (*anattā*) underlying these moments is the orthodox position of all Buddhist schools.
  2.  **The Five Aggregates (*Khandhas*):** The classification of experience into form, feeling, perception, mental formations, and consciousness is standard doctrine.
  3.  **Causal Continuity:** The idea that rebirth and moral responsibility are grounded in causal continuity (*paticca-samuppāda*) rather than a transmigrating soul is the consensus view. The candle-flame analogy, found in the *Milinda Pañha*, is a classic text used to illustrate this.

  **Contested or Interpretive Claims:**
  1.  **Accessibility of *Bhavaṅga*:** In the story, Sita perceives the intervals of *bhavaṅga* (life-continuum) directly. In strict Abhidhamma theory, *bhavaṅga* is a subconscious process that occurs when no active cognitive process (*vīthi*) is running. Whether a meditator in *vipassanā* can consciously inspect *bhavaṅga* itself, or merely infer its presence through the cessation of active *cittas*, is a matter of debate. Some modern meditation masters claim direct knowledge of the *bhavaṅga* gap, while scholarly analysis of the texts suggests *bhavaṅga* is by definition below the threshold of active apperception.
  2.  **The Candle-Flame Analogy and Moral Responsibility:** While the flame analogy is orthodox for explaining continuity without identity, whether it *sufficiently* grounds moral obligation is a philosophical puzzle. Some scholars argue that without a stronger notion of personal identity (even a conventional one), the binding nature of vows becomes difficult to justify logically, leading to what is sometimes called the "kammic paradox." The story resolves this through the reality of *dukkha* (suffering), but this is an ethical interpretation rather than a settled metaphysical proof.
  3.  **Phenomenology of No-Self:** The story presents the realization of *anattā* as a perceptual shift (seeing discrete moments). While this aligns with the "Insight Knowledges" (*Vipassanā-ñāṇa*) described in the Visuddhimagga, contemporary scholars and practitioners vary on whether this is a literal ontological perception or a heuristic re-framing of experience.

  This story should be read as a narrative exploration of these concepts, not as a definitive statement of Theravada soteriology or metaphysics.
