answer: |-
  ### Brainstorm: Rival Accounts of Persistence

  Before dissecting the policy, I need to lay out the metaphysical options for how an object persists through change.

  1.  **Matter Essentialism (Strict Endurantism):** An object is identical to the specific collection of atoms that constitute it. If you replace the wax, you destroy the object. Persistence requires spatiotemporal continuity of the *same matter*.
  2.  **Four-Dimensionalism (Perdurantism):** An object is a "space-time worm" composed of temporal parts. The original wax, the first cast, and the second cast are all different temporal slices of the same extended entity. Persistence is a matter of causal connection between these stages, not shared atoms.
  3.  **Social/Institutional Constitution:** An object's identity is conferred by a status function within a specific context (e.g., the artworld). Persistence is determined by the continuity of the institutional record (provenance, cataloging) rather than physical properties. If the museum says it's the same, it is.

  ***

  ### Analysis of the Museum Practice

  The conservation rule you describe—allowing total material replacement via mold casting while maintaining a single catalog entry, even after the physical link (the mold) is severed—is a fascinating piece of applied ontology. Here is the reconstruction of its implicit metaphysical commitments.

  **1. The Implicit View: Institutionalized Type-Token Platonism**
  The practice presupposes that the artwork is not the physical wax itself, but an **abstract type** (the form/shape) that is instantiated by **physical tokens** (the wax casts).
  *   **Rejection of Matter:** By allowing the original biodegradable material to decay and be replaced, the museum explicitly rejects Matter Essentialism. The specific atoms are expendable.
  *   **Reliance on Form (via Mold):** The use of the mold indicates that the "essence" of the sculpture is its spatial configuration. However, because the mold is eventually destroyed, the museum acknowledges that the *capacity* to instantiate the form is finite.
  *   **Primacy of the Record:** The crucial move is keeping the same catalog entry and title despite the break in physical generative capacity (once the mold is gone). This signals that the ultimate bearer of identity is the **institutional file**. The artwork persists as a normative status within the museum's bureaucracy, even if the physical lineage terminates.

  **2. Is the Practice Locked into One Theory?**
  The practice is **compatible with several theories**, but it requires a rejection of strict materialism.
  *   **Compatible with Four-Dimensionalism:** A perdurantist would view the original wax and the subsequent casts as temporal parts of a single, discontinuous space-time worm. The mold provides the causal link between the early temporal parts. The destruction of the mold simply marks the final temporal part of the worm. The catalog entry tracks the whole worm.
  *   **Compatible with Social Constitution:** This is the strongest fit. The policy essentially legislates identity. It says, "We stipulate that Cast #3 is the same entity as Original #1 because our rules say so." The physical discontinuity is irrelevant because the social status remains unbroken.
  *   **Tension with Traditional Hylomorphism:** A strict Aristotelian might object. In classical hylomorphism, while form is primary, there is usually an expectation of some material continuity or a continuous imposition of form by an agent. Total replacement of matter *plus* the destruction of the means of production (the mold) strains the idea that the "substance" remains. However, a modified "Artifact Hylomorphism" could accommodate this by arguing the "function" (display) persists even if the matter does not.

  So, the practice is not locked into a single metaphysical truth but rather operates on a **pragmatic hybrid**: it uses Four-Dimensional causal links (the mold) to justify continuity while relying on Social Constitution to maintain identity once the physical link is severed.

  **3. The Strict Material Continuity Alternative**
  If a museum operated under **Matter Essentialism** (same clay, same statue), their policy would look radically different. They would have to treat the decay of the material as the **death of the artwork**.

  *   **No Casting:** They could not cast replacements and label them as the original work. A cast made from the mold would be cataloged as a "replica," "facsimile," or "derivative work," with a new accession number.
  *   **Preservation of Decay:** They would likely attempt to halt the decay (freezing, chemical stabilization) to preserve the original atoms. If preservation failed, they would display the remnants (the puddle of wax) as the "ruins" of the work, acknowledging the work no longer exists in its intended form.
  *   **Deaccessioning:** Once the material degraded beyond a certain threshold, the museum would deaccession the title. The catalog entry would be closed, marked "Destroyed" or "Lost." The mold might be kept as a historical tool, but it would hold no power to generate the "artwork" itself.

  **Summary**
  The niche conservation rule assumes the artwork is a **persisting institutional status** anchored by a temporary physical lineage. It treats physical continuity as desirable but not necessary, prioritizing the continuity of the *concept* (tracked by paperwork) over the continuity of the *substance*. It is a policy built for a world where art is information, not just matter.
