answer: |-
  **MEMORANDUM**

  **TO:** Medication-Safety Committee
  **FROM:** [Your Name], Lay Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Pictogram Discharge Protocol Pilot

  **Recommendation**
  I recommend we **adopt this project as a conditional pilot**, with the strict stipulation that pictograms serve as a *supplement* to standard text, not a replacement, during the trial phase. We cannot endorse the removal of written directions at this time.

  While the design studio's equity goals are morally urgent, the test case revealed critical ambiguity in the visual syntax. Specifically, the "crossed-out grapefruit" was interpreted by some patients as an identifier of the drug's contents rather than a prohibition on interaction. In medication safety, ambiguity is a failure mode. However, the literacy data suggests visual aids improve comprehension for vulnerable populations. Therefore, we should proceed, but only under constraints that address the expressive limits of the medium and the risks of generative AI.

  **The Equity Argument (The Case for Replacement)**
  I vote against the studio's core premise—replacing text with images—but I record here the argument for doing so, as it is the strongest case I have encountered and the one most difficult to dismiss.

  Text is not a neutral medium; it is a gatekeeper. Health literacy correlates strongly with socioeconomic status, age, and English-language proficiency. When we discharge a patient with a wall of text, we are not merely providing information; we are administering a literacy test. For a patient with limited reading skills, a text-only leaflet is not just difficult—it is a structural barrier to care that increases the risk of readmission and adverse events. The studio argues that keeping text as a "backup" maintains this barrier, forcing the patient to admit they cannot read the instructions to access the "easier" pictures. True equity, they argue, requires inverting the hierarchy: make the visual primary and the text secondary. To demand text is to privilege the already-literate and to treat the pictogram as a charity accommodation rather than a universal standard. This is a compelling moral claim, but it cannot override the safety risk of misinterpretation.

  **The Expressive Ceiling of Pictograms**
  Neurath's Isotype method was designed for statistics and social facts, not clinical logic. Our test case highlights the "expressive ceiling" where visual language breaks down. We must acknowledge the following limits:

  1.  **Negation:** A slash through an object is not universally understood as "prohibited." As seen in the test, it can signify "contains" or "identity." Without a taught legend, negation is ambiguous.
  2.  **Conditionals and Exceptions:** Logic gates (If/Then/Unless) require syntax. A clock and an arrow suggest sequence, but they cannot easily convey *contingency* (e.g., "take this *unless* that").
  3.  **Quantified Time:** "Six hours" is an abstract measure. A clock face showing 6:00 is distinct from a duration of six hours. Pictograms struggle with specific intervals versus general times of day.
  4.  **Causal Reason:** Pictures show *what* to do, rarely *why*. A patient needs to know *why* grapefruit is dangerous (enzyme inhibition) to prioritize that rule over others. A picture cannot carry the mechanism of action.

  **Requirements for Machine-Generated Pictograms**
  The studio proposes a generative transformer to compose signs on demand. This violates the core Isotype principle that signs must be *taught* and *fixed*. A truly generative system creates novel signs that the patient has never seen. Before we permit any machine-generated imagery, the following must be true:

  1.  **Closed Vocabulary:** The AI must not draw from infinite possibilities. It must select from a pre-validated library of signs. Novelty is a risk factor.
  2.  **Consistency Check:** The system must ensure that a "clock" in one leaflet is identical to a "clock" in another. Variation degrades recognition.
  3.  **Human-in-the-Loop Validation:** No AI-generated sheet leaves the pharmacy without a clinician verifying that the generated sequence matches the prescription logic exactly.

  **What Must Remain in Words**
  During this pilot, the following elements must remain in written English (and relevant translations):

  1.  **Prohibitions:** Any instruction involving "Do Not" or contraindications.
  2.  **Conditional Logic:** Any instruction involving "If," "Unless," or "When."
  3.  **Specific Quantities:** Exact hour intervals or milligram adjustments.
  4.  **The "Why":** Any instruction where compliance depends on understanding the consequence (e.g., "to prevent bleeding," "to avoid toxicity").

  **Next Steps**
  I invite the design studio to revise the pilot protocol. If they can constrain the generator to a fixed library and agree to a parallel-text format, we can test whether the equity benefits hold without compromising the safety floor. We owe it to our limited-literacy patients to find a better way, but we owe it to all patients to ensure the way is safe.

  **[Your Name]**
  Lay Member, Medication-Safety Committee
