answer: |-
  "The grafted monitor clears the fog," Mara said, stirring her coffee. The conference hall noise had faded, leaving the quiet hum of the café. "Your panel objection missed the point of the case. If the subject cannot tell the difference, and reports no gap between the device's output and the seeming, the hard problem loses its grip."

  Dev shook his head, leaning forward. "It just moves the fog inside the machine. You're assuming that because the behavioral output is identical, the explanatory gap is closed. But look at finding three. When the subject says 'the seeming just is whatever the monitor delivers,' you treat that as a dissolution. I treat it as a symptom."

  "Symptom of what?"

  "Of a partial zombie state," Dev said. "If the monitor is miscalibrated, as in finding two, the subject's judgments track the device, not the world. If the device is synthetic, as in finding one, what guarantees there is something it is like for them? You're describing a system that makes authority claims without possessing the authority. That leaves the hard problem entirely intact. We still need to know why *we*, presumably ungrafted, have the real thing."

  Mara sighed. "That question—'is there something it is like?'—is exactly what the meta-problem brackets. You're asking whether the subject is a zombie. I'm saying that question is unintelligible once you've fully specified the functional architecture. If the introspective system issues reports with immediate phenomenological authority, explaining *why* it does so explains everything there is to explain. To ask if the feeling is 'real' behind the report is to demand a ghost in the machine."

  "But is it answerable in principle?" Dev pressed. "If I can build a grafted monitor that behaves exactly like a conscious subject but lacks inner life, then consciousness isn't necessary for the judgments. Therefore, explaining the judgments doesn't explain consciousness. You need to tell me: is the grafted subject phenomenally conscious? If you say 'yes,' you're begging the question. If you say 'no,' you've admitted the hard problem survives the meta-solution."

  "I say the distinction presupposes the very notion we're trying to explain away," Mara replied. "But let's grant your framing. Even if they are a 'partial zombie,' the *compulsion* to believe they aren't is fully accounted for. The hard problem is just the expression of that compulsion. Once we explain the compulsion, the problem dissolves."

  Dev tapped his notebook. "Let's press the specification problem. You say the monitor explains the judgments. But what, exactly, does the introspective system represent the states as having? When the subject says 'it looks red,' or 'there is something it is like,' what property is being attributed? Can you specify that in functional or structural terms without covertly drawing on phenomenal concepts?"

  "It represents the state as having a specific higher-order functional role," Mara said substantively. "It represents the state as non-inferentially accessible, as poised for global control, and as resistant to certain kinds of revision. The concept 'phenomenal' is just the folk-psychological label for that cluster of functional relations. The monitor doesn't need to feel redness; it needs to represent the state as having the functional profile of redness."

  "But the subject insists the property is intrinsic," Dev countered. "They deny it's relational or functional. If your explanation says the system represents the state as functional, but the subject reports it as intrinsic, you haven't explained the judgment. You've explained a different judgment. To explain the actual judgment, you have to explain why the system represents the state as non-functional. And you can't do that functionally without contradiction."

  "That's the error theory component," Mara said. "The system represents the state as intrinsic *because* the introspective mechanism lacks access to its own functional origins. The apparent intrinsicality is a structural blind spot, not a metaphysical feature."

  "Which brings us to the core divergence," Dev said. "You're explaining the occurrence of the judgment. I'm asking about its apparent rational credentials from the subject's own point of view. The meta-problem might explain why I issue the judgment 'I am conscious,' but it doesn't explain why that judgment seems rationally warranted to me independently of the mechanism. I feel I have direct access, not just a causal chain."

  "And I say the meta-problem explains exactly why it seems rationally warranted," Mara insisted. "The feeling of authority is a functional signal designed to prioritize certain inputs. Explaining the signal explains the warrant. You're insisting on a gap between 'seems warranted' and 'is warranted' that only exists if you assume realism about phenomenology."

  "No," Dev said. "I'm insisting on a gap between 'explaining why I think I have access' and 'explaining why I actually have access.' The meta-problem addresses the former. The hard problem addresses the latter. You can solve the meta-problem completely and still have no idea why the access is veridical rather than merely persuasive."

  They sat in silence for a moment, the steam rising from their cups.

  "Let's try the adversarial protocol," Mara said. "What would count as evidence against your view? What development would force you to accept that the meta-problem dissolves the hard one?"

  Dev thought for a moment. "If we could demonstrate conceptually that a complete functional specification of the introspective system *entails* the presence of phenomenal experience. If you could show that building the monitor *necessitates* feeling, not just reporting, I would concede. But I don't think that's possible."

  "Fair," Mara said. "Here is mine. If we found an introspective judgment that could not be causally explained by any combination of first-order states and functional processing rules. If there was a residue of judgment that floated free of the physical architecture. That would prove the hard problem is ontological, not conceptual. But I expect neuroscience will close that gap."

  "Then we wait," Dev said.

  "We wait," Mara agreed.
