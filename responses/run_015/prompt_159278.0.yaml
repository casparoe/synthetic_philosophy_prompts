  7.  **Final Polish:** Organise into the requested sections. Ensure the verdicts (Platitude/Substantive/False) are clear. Ensure British spelling is consistent. (e.g., "behaviour," "rationalise," "programme").

      *(Self-Correction on British English)*: Make sure not to overdo it to the point of caricature, but ensure standard UK spelling conventions (s vs z, our vs or, etc.).

