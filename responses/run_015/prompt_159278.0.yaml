answer: |-
  Here is a breakdown of the distinct claims hiding behind that slogan, formatted for your reading group. I have kept the spelling and terminology in British English.

  ### The Menu of Meanings: "Independence of Irrelevant Alternatives"

  Your intuition is correct: your group member is conflating several distinct axioms that share a similar name. In technical decision theory, the axiom violated by Allais is usually called the **Independence Axiom** (von Neumann–Morgenstern), whereas **Independence of Irrelevant Alternatives (IIA)** is technically reserved for social choice or menu choice. Conflating them gives the principle more normative weight than it possesses.

  Here are the five distinct interpretations:

  **(i) The Menu Version (Luce/Chernoff Condition)**
  *   **The Claim:** If you choose $A$ from a set $\{A, B\}$, you should not switch to $B$ if a third option $C$ (which you would not have chosen) is added to the menu.
  *   **Status:** **Substantive but Defensible.** This is a standard requirement for rational choice functions. However, it is known to be violated by context effects (e.g., the 'attraction effect' in marketing). It is not a logical truth, but a coherence constraint.
  *   **Relevance to Allais:** **None.** The Allais paradox does not involve adding a third lottery to the menu. It involves changing the probabilities within the existing options. Citing this to dismiss Allais is a category error.

  **(ii) The Mixture Version (vNM Independence Axiom)**
  *   **The Claim:** If you prefer Lottery $A$ to Lottery $B$, you should still prefer a mixture of $A$ and $C$ to a mixture of $B$ and $C$ (where $C$ is mixed in with the same probability for both). The common consequence $C$ is treated as the 'irrelevant' part.
  *   **Status:** **Substantive and Controversial.** This is the actual axiom Allais violates. It is not a platitude; it rules out complementarity between outcomes and probabilities. Many find it normatively compelling, but the Allais intuition suggests it is too strong.
  *   **Relevance to Allais:** **Direct.** This is the technical engine of the paradox. If your friend means this, he is arguing that the common consequence *ought* to be normatively irrelevant, despite psychological evidence to the contrary.

  **(iii) The State-by-State Version (Savage's Sure Thing Principle)**
  *   **The Claim:** If you would prefer Act $A$ to Act $B$ given event $E$ occurs, and also prefer $A$ to $B$ given $E$ does not occur, then you should prefer $A$ to $B$ unconditionally. The outcome in the state where the acts are identical should be irrelevant.
  *   **Status:** **Substantive and Defensible.** This is arguably the most powerful normative argument for expected utility. It frames the 'irrelevant' part as a state of the world where payoffs are identical.
  *   **Relevance to Allais:** **High.** Allais choices can be reconstructed as a violation of this principle. The debate here is whether the 'certainty' of a payoff changes the nature of the state, thereby making the outcomes not truly identical in value.

  **(iv) The Social Choice Version (Arrow's IIA)**
  *   **The Claim:** The social ranking of two alternatives $x$ and $y$ should depend only on individual preferences regarding $x$ and $y$, not on preferences regarding a third alternative $z$.
  *   **Status:** **Substantive (for voting), Irrelevant (for individuals).** This is a constraint on aggregation rules, not individual rationality.
  *   **Relevance to Allais:** **None.** This is a total red herring in the context of individual decision theory. Using this to justify individual rationality is a mistake.

  **(v) The Strong Version (Context/Frame Invariance)**
  *   **The Claim:** A rational agent's preferences should be invariant to description, framing, status quo, or regret. The 'context' is irrelevant.
  *   **Status:** **False.** This is empirically false and normatively dubious. Rational agents are permitted to care about how a choice is framed if the frame conveys information (e.g., about the chooser's intentions or hidden risks).
  *   **Relevance to Allais:** **Low.** While Allais involves sensitivity to probability structure, calling this 'framing' is a stretch. However, using this strong version to dismiss Prospect Theory is unfair; Prospect Theory claims these effects are robust features of cognition, not necessarily 'mistakes' in a strong normative sense.

  ***

  ### Addressing the Two Follow-up Claims

  **1. "Violating independence means you can be money-pumped or dynamically inconsistent."**
  *   **Verdict:** **Partially Right, but Imprecise.**
  *   **The Nuance:** Static money pumps (Dutch Books) typically require *intransitivity* (cycling preferences $A \succ B \succ C \succ A$). Violating the Independence Axiom (ii) does not necessarily create a static cycle.
  *   **The Catch:** It *does* lead to **dynamic inconsistency**. If you prefer $A$ to $B$ now, but know that once a common risk is resolved you will switch your preference, you are dynamically inconsistent. A sophisticated agent might pay to restrict their own future choices to prevent this switch. This can be structured as a money pump *over time*, even if not *at a single moment*.
  *   **Argument for the Group:** Your friend is right that there are dynamic costs, but wrong to imply it creates a simple static cycle like intransitivity does. The normative force comes from the requirement of diachronic coherence, not just synchronic consistency.

  **2. "Is 'Independence of Irrelevant Alternatives' a misnomer for what's happening in Allais?"**
  *   **Verdict:** **Yes, technically.**
  *   **The Nuance:** As noted above, the vNM axiom is formally the "Independence Axiom." "Independence of Irrelevant Alternatives" is the label for the Menu (i) and Social (iv) versions.
  *   **The Deeper Point:** You are also right that the Allais pattern is better described as **Probability Weighting** (the Certainty Effect). In Prospect Theory, the 'irrelevant' common branch isn't ignored; rather, the *probability* of that branch (specifically moving from $p=1$ to $p<1$) is non-linearly weighted.
  *   **Argument for the Group:** Calling it "Independence of Irrelevant Alternatives" suggests the agent is distracted by a third option. In reality, the agent is sensitive to the *structure of risk*. The 'irrelevant' consequence is only irrelevant if probabilities are weighted linearly. If one argues that linear weighting is not a requirement of rationality, then the 'independence' requirement falls away. The slogan masks the real dispute: **Is linear probability weighting a norm of rationality?**

  ### Summary for the Group
  *   **The Slogan is Ambiguous:** Ensure your group specifies whether they mean vNM Independence (ii), Sure Thing (iii), or Menu IIA (i).
  *   **The Allais Relevance:** Only (ii) and (iii) bear on Allais. (i) and (iv) are red herrings.
  *   **The Normative Claim:** The claim that preferences *must* be independent is not a platitude; it is a substantive defence of linear probability weighting.
  *   **The Money Pump:** Violations imply dynamic inconsistency, not necessarily static intransitivity.
