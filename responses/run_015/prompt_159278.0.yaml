      *   **Task:** Create a "menu" of distinct meanings of the sentence "rational preferences have to be independent of irrelevant alternatives."
      *   **Required Distinctions:**
          1.  Menu version (choice set expansion).
          2.  Mixture version (common consequence/outcome branch).
          3.  State-by-state "Sure Thing" version (Savage).
          4.  Social Choice version (Arrow).
          5.  Strong version (context-free, no framing/regret).
      *   **Evaluation for each:** Is it a platitude, substantive/defensible, or false? Does Allais bear on it?
      *   **Additional Questions:**
