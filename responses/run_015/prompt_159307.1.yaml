answer: |-
  ### Brainstorming

  **(a) The Argument:** The core ethical claim is prioritarianism without the label: resources produce more moral value when directed toward those with greater absolute needs. A dollar spent on basic literacy for a struggling student yields more human capability than a dollar spent on enrichment for an already proficient student. This is not about reducing inequality for its own sake, but about maximizing the moral weight of assistance by targeting absolute deficits.

  **(b) What It Is Not:** It is not egalitarianism (we are not doing this to shrink the gap between rich and poor students). It is not utilitarianism (we are not claiming total test scores will rise). It is not a claim that honors students won't suffer (they will). It is not a claim that the plaque removal saves money (it doesn't).

  **(c) Forbidden Sentences:**
  1.  *"This creates a more equitable system."* (Reason: Implies the goal is relative equality, triggering the levelling-down objection.)
  2.  *"Our bottom quartile needs this."* (Reason: Relies on relative ranking within the school, not absolute need.)
  3.  *"Nobody loses in the long run."* (Reason: False; honors kids lose real benefits.)
  4.  *"It's unfair for some kids to have more than others."* (Reason: Explicitly forbidden; implies the gap itself is the problem.)
  5.  *"Reading scores determine future success."* (Reason: Empirical overreach; must be qualified as a belief or probability.)

  ***

  ### Speech

  Good evening. Thank you for coming. I know why this room is full. I know why many of you are angry. I am here to talk about the decision the board and I made to end the honors track and redirect those funds to reading intervention. I am also here to talk about the honor roll and the plaque in the hallway. I will not ask you to applaud. I will ask you to understand the reasoning, and to know that I understand the cost.

  Here is the change: We are moving roughly twenty thousand dollars a year from a program for forty advanced students to a program for ninety students who are reading below grade level. We are closing the separate honors classroom. We are ending the funded trips and competitions. Those resources will now pay for intensive tutoring, materials, and specialist time for students who cannot yet read at the level expected for their age.

  I want to be clear about why. We did not do this because it is wrong for some children to have more than others. We did not do this to shrink the gap between our highest scorers and our lowest. We did it because help counts for more when it goes to a child who lacks the basics.

  If a child cannot read proficiently, their access to every other subject is blocked. History, science, math—they all depend on it. The evidence suggests that without intervention, these students face significantly harder lives as adults. We believe that a dollar spent removing that barrier does more good than a dollar spent enriching a child who is already clearing the bar. This is about absolute need, not relative standing. It is about who is missing the foundation, not who is standing on the roof.

  I know what this takes away. To the students in the honors track: you are losing a community. You are losing challenges designed for you. You are losing a trip and a distinction that mattered to you. I will not tell you that you will gain something better in return. You are losing something real. Your education changes today, and it changes in a way that feels like a subtraction. I acknowledge that.

  I need to speak specifically to six families. I know that six of the students in the honors program come from households facing significant financial stress. For those families, losing this support isn't just about a trip or a classroom; it removes a layer of stability and opportunity that is harder to replace elsewhere. I know that makes this decision heavier for you than for others. I cannot fix that imbalance today. I only want you to know that I see it, and I know the weight of it lands on you.

  Now, about the plaque and the honor roll. Removing them saves no money. They do not fund the reading program. I voted to take them down, and I cannot defend that choice with the argument I just gave you. That argument is about resources and need. The plaque is about symbols. We decided that putting names on a wall signals that this school values distinction over growth. Some of you will disagree. Some of us on the board disagree. But that decision rests on what we want our walls to say about our culture, not on where the money goes. I own that choice separately.

  I am not standing here to tell you that test scores guarantee a life's outcome. They don't. But we are betting that basic literacy gives a child more control over their future than advanced enrichment does. We are betting that the moral weight of helping a child catch up outweighs the moral weight of helping a child speed up.

  I know this feels like a loss. For some, it is a loss of status. For some, it is a loss of support. We made this choice because we believe the need is urgent on the other side of the equation. I am ready to answer your questions. I am not ready to pretend this was easy.

  ***

  ### Note to Principal

  **Settled:** There is broad consensus that basic literacy is a prerequisite for other capabilities (the "human capital" floor). Prioritizing students below a functional threshold over enrichment is standard policy in most public systems, even if rarely articulated this sharply.

  **Contested:** You have explicitly adopted the **Priority View** (benefits matter more the worse off the recipient is in absolute terms) over **Egalitarianism** (benefits matter to reduce relative gaps). This is a live debate in distributive justice. Philosophers like Parfit argue Priority avoids the "levelling down" objection, but others argue it ignores the moral relevance of relative status. You also picked **Absolute** worse-offness (reading level/poverty) over **Relative** (ranking within the school). Some theorists argue "worse off" is inherently comparative; you rejected that.

  **Empirical:** You claimed intervention gives "more control over their future." This rests on the efficacy of K-8 reading interventions to produce long-term life outcomes. The data here is mixed; intensive intervention helps, but the magnitude of long-term life change is debated among economists. You admitted this was a "bet," which protects you from claiming false certainty, but the causal link remains an assumption.
