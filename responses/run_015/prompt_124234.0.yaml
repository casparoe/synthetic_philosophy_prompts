answer: |-
  ### Adjudication of the Exchange: Jordan vs. Riley

  **Subject:** Aristotle's Sea-Battle Problem (Future Contingents)
  **Adjudicator Perspective:** Philosophical Logic and Metaphysics of Time

  This exchange touches upon one of the most persistent knots in the history of logic: the relationship between the semantic principle of bivalence and the metaphysical status of the future. Both students demonstrate a competent grasp of the literature, yet their dialogue reveals a tension between formal semantic modeling and ontological commitment. Below is a point-by-point adjudication of the four moves, followed by an overall assessment and an identification of the conceptual blind spots inherent in the debate.

  ---

  #### Move 1: Jordan (Branching-Time Semantics)
  **Claim:** Truth is indexed to branches; bivalence holds relative to a branch, not absolutely. This dissolves fatalism.
  **Rating:** **Semantically Defensible, Metaphysically Incomplete.**

  **Justification:**
  Jordan correctly identifies the standard Ockhamist solution within branching-time logic (e.g., Prior, Thomason). In this framework, propositions are evaluated at a moment/history pair $\langle m, h \rangle$. At moment $m$ (Tuesday), the proposition "There will be a sea battle" is true relative to history $h_1$ and false relative to history $h_2$. Thus, the Law of Excluded Middle holds, and bivalence is preserved *within* a history.
  However, Jordan's claim that this *dissolves* Aristotle's worry is premature. Aristotle's concern was not merely about logical consistency but about *truth-makers*. If a proposition about Wednesday is true on Tuesday (even relative to a branch), what makes it true? If the truth-maker exists on Tuesday, metaphysical openness is threatened. Jordan offers a semantic mechanism but fails to specify the corresponding ontology. He treats a semantic indexing feature as a metaphysical solution without explaining how a branch can be "real" enough to bear truth values without being "fixed" enough to entail fatalism.

  #### Move 2: Riley (The Thin Red Line Objection)
  **Claim:** Semantics cannot hide metaphysics. If one branch is actual (the "Thin Red Line"), truth on Tuesday implies a fixed future.
  **Rating:** **Substantively Strong.**

  **Justification:**
  Riley correctly presses the metaphysical implication of Jordan's semantics. This is the "Thin Red Line" (TRL) objection famously associated with Plantinga and others. Riley distinguishes between *epistemic* openness (we don't know the branch) and *metaphysical* openness (the branch is not yet privileged). He argues that if realism about the future holds, one branch *is* the actual future. If so, propositions about that branch possess a truth value *simpliciter* prior to the event.
  Riley is right to identify that semantic relativity does not automatically grant metaphysical contingency. If there is a fact of the matter on Tuesday about which branch is actual, then the future is ontologically settled, even if causally indeterministic. Riley successfully exposes that Jordan's Move 1 relies on an implicit anti-realist assumption about the future (that no branch is privileged) which Jordan has not yet defended.

  #### Move 3: Jordan (Growing Block + Accidental Necessity)
  **Claim:** Reality grows; no fact exists on Tuesday about Wednesday. Past becomes "accidentally necessary" only retroactively.
  **Rating:** **Metaphysically Unstable / Inconsistent with Move 1.**

  **Justification:**
  Here, Jordan shifts his metaphysical framework significantly, creating a tension with Move 1. In Move 1, Jordan utilized branching-time semantics where branches typically exist as possibilia (consistent with eternalism or possibilism). In Move 3, he adopts the Growing Block Universe (GBU), where the future literally does not exist.
  In a strict GBU, future contingent propositions typically lack truth values (an Aristotelian view), contradicting Jordan's earlier claim that bivalence is preserved via branch-indexing. If there is "no fact" about Wednesday on Tuesday, then "There will be a battle" is not true-relative-to-a-branch in a way that satisfies bivalence; it is simply truth-valueless. Furthermore, Jordan's appeal to "accidental necessity of the past" is historically apt (Boethius/Aquinas), but applying it to GBU requires explaining how a proposition acquires a truth value *ex nihilo* when the block grows. Jordan claims the openness is metaphysical, which is consistent with GBU, but he has abandoned the semantic bivalence he defended in Move 1 to do so.

  #### Move 4: Riley (Selection Problem + Bivalence Dilemma)
  **Claim:** Either transition rules are deterministic, or branch selection is unexplained. If truth values exist, the branch is privileged (fatalism); if not, bivalence is abandoned.
  **Rating:** **Logically Decisive.**

  **Justification:**
  Riley formulates a rigorous dilemma that captures the core of the problem. He forces a choice between causal determinism and an unexplained "selection mechanism" for how the actual world transitions from one moment to the next in an indeterministic universe. This is the "problem of the open future" in dynamic metaphysics.
  More importantly, Riley correctly identifies the logical cost of Jordan's shifting positions. If Jordan wants bivalence (Move 1), he needs a truth-maker (TRL), which implies fatalism (Move 2). If Jordan wants openness (Move 3), he must abandon bivalence for future contingents. Riley demonstrates that Jordan cannot have it both ways: he cannot maintain classical bivalence for future contingents while denying that the future is metaphysically settled. Riley's analysis holds Jordan to a standard of ontological coherence that Jordan's semantic maneuvering attempts to evade.

  ---

  ### Overall Assessment

  **Who is more right:** **Riley.**

  While Jordan demonstrates a stronger command of the formal semantic tools (branching time, Ockhamist logic), Riley demonstrates a superior grasp of the metaphysical stakes. Jordan's argument suffers from a category error: he attempts to solve a metaphysical problem (the nature of future reality) with a semantic solution (indexing truth to branches). When pressed, he shifts to a different metaphysics (Growing Block) that contradicts the semantic commitments of his first move.

  Riley remains consistent throughout. He correctly identifies that semantics must supervene on metaphysics. If the world is branching, we must ask whether one branch is *actual*. If yes, fatalism looms; if no, bivalence fails. Riley forces the admission that Aristotle's problem cannot be "dissolved" by logic alone; it requires a substantive ontological commitment that carries costs (either fatalism or truth-value gaps). Jordan tries to avoid these costs; Riley shows they are unavoidable.

  ### The Missed Conceptual Point

  Both students miss a crucial distinction in temporal logic: the difference between **truth** and **settledness** (or historical necessity).

  In advanced branching-time frameworks (specifically Supervaluationism), one can maintain that a proposition is *true* (on the actual history) without being *settled true* (true on all histories passing through the current moment).
  *   **Jordan** hints at this with branch-relativity but conflates truth-on-a-branch with truth simpliciter.
  *   **Riley** assumes that if a proposition is true, the future is "fixed" in a fatalistic sense.

  The missed nuance is that **truth does not imply causal necessity.** A proposition about the future can be true (because the event will happen) without being *necessitated* by the past. The truth value may supervene on the future event itself (a retroactive truth-maker) rather than a present state of affairs. Both students operate under the assumption that for a proposition to be true on Tuesday, there must be a *present* truth-maker on Tuesday. If they allowed for truth-makers located in the future (or denied present truth-values entirely, as Aristotle did), the dilemma softens. They treat the interaction between logic and time as a zero-sum game between bivalence and openness, missing the viable middle ground of **non-bivalent logics** or **retroactive truth-making** which preserves contingency without sacrificing logical coherence.

  ### Classification of the Dispute

  This dispute is **both semantic and metaphysical**, but the root error is **metaphysical**.

  *   **Semantically,** they disagree on whether bivalence applies to future contingents (Jordan: yes, via indexing; Riley: only if fatalism holds).
  *   **Metaphysically,** they disagree on the ontology of the future (Jordan: open/growing; Riley: privileged/actual).

  However, the semantic disagreement is derivative. The core failure is Jordan's assumption that a semantic model (branching time) can dictate metaphysical possibility without an accompanying ontology of truth-makers. Riley correctly identifies that you cannot index your way out of an ontological commitment. Therefore, while the language is logical, the adjudication rests on metaphysical coherence.
