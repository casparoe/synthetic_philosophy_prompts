prompt: |-
  I'm auditing a graduate seminar on philosophy of time and logic, and two fellow students — Jordan and Riley — got locked in a sustained exchange about Aristotle's sea-battle problem that I want adjudicated carefully. Before you begin, please think through the hidden premises in each position: distinguish semantic claims about bivalence from substantive metaphysical claims about determinism, and consider whether either speaker conflates epistemic openness with metaphysical openness. I need your analysis written in polished American English, delivered as a disciplined point-by-point adjudication rather than a loose opinion, and framed from the perspective of an expert in philosophical logic who is weighing arguments, not advocating for a predetermined conclusion.

  Here is the exchange as it actually unfolded. (1) Jordan argued that branching-time semantics dissolves Aristotle's worry: prior to Wednesday, both "there will be a sea battle on Wednesday" and "there will not be a sea battle on Wednesday" are true-relative-to-a-branch, and only after Wednesday does our actual branch make one false. Because truth is indexed to branches rather than to a single predetermined world-line, bivalence does not entail fatalism; it simply requires that we specify the branch of evaluation. (2) Riley replied that this is fatalism disguised as semantics. Even if observers don't know which branch is actual, there is a metaphysical fact — the "thin red line" — that privileges one branch as the real future prior to Wednesday. If that line exists on Tuesday, then on Tuesday it is already true-at-the-actual-branch that there will be a battle, which means Wednesday's outcome is fixed, not genuinely open. Calling truth "branch-relative" merely hides this pre-existing privilege. (3) Jordan countered by combining a growing-block metaphysics with Ockham's distinction between logical necessity and the accidental necessity of the past: reality literally grows, so on Tuesday there is no fact about Wednesday's actual branch — only an open tree of possibilities. Once Wednesday passes, propositions about it become accidentally necessary in virtue of being past, but that retroactive necessity does not entail that Wednesday was causally predetermined on Tuesday. The openness was metaphysical, not merely epistemic. (4) Riley then pressed what he called the "selection problem," paired with a bivalence objection: in any growing tree, either the transition rules are deterministic — in which case the future is causally fixed — or they are not, in which case we need an unexplained mechanism for selecting the actual branch without a prior metaphysical fact. Meanwhile, if on Tuesday "there will be a battle" already possesses a definite truth-value, and that value depends on which branch is actual, then either that branch was already privileged (fatalism) or the statement lacks a truth-value altogether (abandoning bivalence). So Jordan has not dissolved the problem; he has merely distributed it between determinism and an unexplained selection mechanism.

  Please go through their exchange move by move: for each of the four moves, rate it from clearly mistaken to clearly right and briefly justify the rating. Then say who is more right overall, and identify the important conceptual point — if any — that both Jordan and Riley miss about how temporal logic interacts with the metaphysics of contingency. Do not just declare a winner; show precisely where each argument holds and where it slips, and note whether their dispute is ultimately semantic, metaphysical, or both.
