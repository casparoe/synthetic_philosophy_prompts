  No seam of coal nor river's course has ground
  The spirit's shape within the believer's breast;
  The ethic sought a form, by grace addressed,
  Where rational account was finally found.
  Not pushed by force, but by affinity bound,
  Capital and Creed came to a mutual rest,
  A chosen fit, by neither side confessed,
  In elective choice the matching was profound.

  Yet here the question turns within the frame,
  When motives differ from the stone or mist,
  Can they be causes striking the same blow?
  To mix the categories voids the name,
  If inner sense makes outer facts persist,
  For cause grows strange to all we think we know.
