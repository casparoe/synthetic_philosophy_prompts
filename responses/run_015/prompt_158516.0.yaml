  ### The implicit theory

  The implicit theory assumes confirmation is not merely a logical relation between propositions but a procedural achievement rooted in the history of inquiry. It posits that evidence supports a hypothesis only if the hypothesis was exposed to the risk of falsification by that evidence prior to its observation. This requires a strict temporal or causal separation between the generation of the hypothesis and the collection of the data. Under this view, the evidential value lies in the *severity* of the test: could the data have fit the hypothesis even if the hypothesis were false? If the hypothesis was constructed to fit the data, the answer is yes, rendering the fit uninformative. Consequently, the editorial policy treats the history of inquiry as constitutive of evidential weight, effectively making confirmation a three-place relation involving the hypothesis, the evidence, and the method of generation. It implies that a theory's ability to unify old facts is secondary to its ability to survive a risky prediction unless the construction process is independently constrained. This explains the tension: explaining old evidence is valued in physics because the theory was constructed independently of those specific facts, whereas in psychology, HARKing implies the theory was tuned to the noise. The policy assumes that without pre-registration, the hypothesis space is effectively infinite, making any fit trivial. Thus, the implicit theory is a hybrid of falsificationism and reliability theory, where the *process* validates the *product*, prioritizing the prevention of overfitting over the logical accommodation of facts. The proposal to quantify this via a "novelty weight" suggests the committee believes this procedural constraint is gradable. They assume there is a continuum of "fixedness" that linearly scales evidential value. This implies that partial pre-registration yields partial confirmation, suggesting that the risk of falsification can be fractioned. It treats the temporal order not just as a binary gatekeeper but as a diminishing return function. Ultimately, this view holds that the reliability of the inference is inseparable from the transparency of the timeline. Without this assumption, the distinction between a registered report and a standard article collapses into mere stylistic difference rather than epistemic hierarchy.

  ### Strict presuppositions vs. convenient fits

  The practice cannot survive without the assumption that hypothesis construction introduces bias that data analysis cannot correct. If the method of generation were irrelevant to the validity of the test, pre-registration would be unnecessary bureaucracy. Therefore, the strict presupposition is that undisclosed flexibility invalidates statistical inference. However, the practice does not strictly require *pre-registration* specifically; it requires *constraint*. Independent replication, cross-validation, or holding out a test set could serve the same function. The core necessity is the separation of construction and testing contexts to prevent overfitting. The specific mechanism (time-stamping) is merely a convenient proxy for that separation. Furthermore, the practice presupposes that researchers are motivated to find significant results and will exploit flexibility to do so. If researchers were perfectly honest about all tried analyses, the norm would be less critical. Thus, the policy relies on a specific model of researcher behavior. It assumes that without external constraints, the reported likelihoods are inflated. The essential presupposition is that evidential weight depends on the *riskiness* of the prediction, which pre-registration is meant to guarantee.

  ### Oldness, double-duty, derivability

  These three worries are distinct, though often conflated. Oldness concerns the Bayesian problem of assigning probability to known facts. Double-duty concerns the statistical problem of using data to tune parameters and then test them. Derivability concerns the logical uniqueness of the explanation. The Mercury case discriminates them perfectly. Mercury's perihelion was old evidence (Worry 1), yet it confirmed GR. Why? Because Einstein did not use Mercury to construct GR (no Double-duty, Worry 2). The derivation was rigorous, not ad hoc (high Derivability, Worry 3). Conversely, HARKing in psychology typically involves Double-duty: the data shapes the hypothesis. Therefore, the editorial practice is actually tracking Double-duty (overfitting), not Oldness. The community mistakenly treats Oldness as a proxy for Double-duty. In physics, old evidence is accepted because the theory was constructed independently. In psychology, post-hoc hypotheses are rejected because they are assumed to be constructed *from* the data. The "derivability audit" is the closest to the truth, but it must measure whether the hypothesis was *constrained* by theory rather than *extracted* from noise. The practice fails when it penalizes old evidence that was not used for construction. We must distinguish the epistemic status of the *data* from the epistemic status of the *link*. Oldness makes the data fixed, but not the link. Double-duty makes the link flexible. Derivability asks if the link is necessary. The committee's norm conflates the fixedness of the data with the flexibility of the link. By penalizing old evidence, they assume old data implies a flexible link. This is false. A theory can be developed without seeing the data, then applied to old data successfully. The practice tracks the fear of overfitting (Double-duty), but uses temporal novelty (Oldness) as a blunt instrument to detect it. A true derivability audit would ask: "Could this hypothesis have been generated without this specific dataset?" If yes, oldness doesn't matter. If no, it's HARKing.

  ### The novelty weight

  A single scalar "novelty weight" is incoherent. Evidential support is not linearly scalable by temporal fixation. A hypothesis is either constrained or it is not; partial pre-registration often leaves enough degrees of freedom to invalidate the test. A derivability audit would need to measure the size of the hypothesis space searched relative to the data capacity. This is theoretically possible but practically unmeasurable. How do we quantify "ingenuity"? How do we count the untested hypotheses the author discarded? The weight implies a precision that does not exist. It suggests that a 0.5 novelty score yields half the confirmation of a 1.0 score, which lacks philosophical grounding. Furthermore, it creates a false trade-off: a highly novel but poorly designed study would outscore a robust replication of old facts. The audit should be binary: was the analysis plan fixed before data access? If not, the evidence is exploratory. Quantifying it invites gaming, where authors pre-register trivialities to claim high weights. The measure conflates procedural compliance with epistemic severity. Moreover, a scalar implies that novelty compensates for weak statistics, or vice versa. This is dangerous. A pre-registered study with low power provides little evidence, regardless of novelty. The weight should not multiply the evidential score; it should act as a gatekeeper. If the novelty is zero (pure HARKing), the evidence counts as hypothesis-generating, not testing. But assigning 0.7 suggests it is 70% of a test. This is misleading. The derivability audit requires knowing the counterfactual: would this hypothesis exist without this data? That is inherently unobservable.

  ### Under a strict probabilist picture

  Under strict probabilism, confirmation is a two-place relation between hypothesis and evidence, determined by likelihood ratios. Pre-registration becomes a tool to ensure reported likelihoods are honest, not a constituent of confirmation itself. We would stop multiplying evidence scores by novelty weights. Instead, we would require authors to disclose all analyzed paths to calculate the correct likelihood ratio accounting for multiple comparisons. Old evidence would be handled by conditioning on the logical entailment: learning that H entails E increases confidence in H, even if E was known. We would stop treating old evidence as inherently discounted. The focus would shift from "when did you guess?" to "how likely was this fit under the null?" We would accept explanations of old data if the model was not tuned to them. The editorial policy would mandate transparency of the search space rather than temporal stamping. We would not need a novelty weight; we would need a flexibility index. The change is from policing timing to policing model specification. Specifically, we would stop rejecting papers simply because hypotheses were post-hoc, provided the authors adjust their statistical claims to reflect the exploratory nature (e.g., labeling them as such, requiring replication). The Bayesian update occurs when the researcher learns that their theory *predicts* the old evidence, not when the evidence is discovered. Thus, the "discovery" is the derivation, not the data. The committee would have to abandon the idea that time-stamping creates evidence. It only preserves the integrity of the likelihood calculation. If the likelihood is corrected for fishing, the timing matters less.

  ### Bottom line

  Recommendation: Reject the novelty weight multiplier. It creates false precision and conflates temporal novelty with evidential severity. The committee should instead mandate transparency regarding analysis flexibility and label post-hoc findings as exploratory. The decision turns on this sub-question: Is the primary threat to validity the *timing* of the hypothesis or the *size of the hypothesis space* searched? If it is the latter, as the Mercury case suggests, then auditing flexibility is superior to auditing timestamps.
