      *   *Material-Continuity:* Cares about the physical stuff. The charred fragments *are* the object that survived history, even if 60% is 1920s gunk. The new thing is fresh matter. Verdict: Fragments > Replacement.
      *   *Institutional:* Cares about status conferral. Currently withheld (pending vote). If board votes yes, it becomes art. Verdict: Withheld now, pressured later.

  4.  **Identifying the "Philosophical Workhorse" Features:**

      *   *Nested Inauthenticity:* Drives the Material vs. Formalist split (is the 1920s gunk part of the history or aesthetic noise?). Also complicates Provenance (original was already compromised).
      *   *Non-Contact Synthesis:* Drives the Provenance view (no hand of the artist, no physical contact with original).
