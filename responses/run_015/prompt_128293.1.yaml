answer: |-
  In 2023, the Oakhaven Municipal Gallery's prized 17th-century landscape, *River Mist*, suffered severe fire damage, revealing through post-disaster spectroscopy that forty percent of its pre-fire surface was actually skillful 1920s overpaint by a known restorer-forger, meaning the "original" viewers loved was already a nested pastiche. Conservators, refusing to touch the fragile charred fragments (which now comprise sixty percent modern restoration material and forty percent authentic 17th-century pigment), utilized non-contact spectral imaging and chemical residue analysis to fabricate a full-scale synthetic reconstruction that visually matches the hypothesized pre-1920s state, currently displayed pending a board vote on whether to designate it the collection's legitimate successor.

  ### Analysis of Philosophical Verdicts

  1.  **Perceptual-Formalist:** This theorist argues that aesthetic value resides in the visual experience and compositional integrity. Because the synthetic reconstruction removes the 1920s "noise" (the pastiche layer) and restores the 17th-century artist's intended visual unity without the distraction of fire damage, they conclude the object on display has **recovered or improved** the aesthetic value.
      *   *Philosophical Workhorse:* **Nested Inauthenticity.** If the original had been 100% authentic, the reconstruction would merely replicate a loss. Because the original was corrupted by the 1920s forgery, the Formalist can argue the new object is aesthetically *truer* to the artistic intent than the physical original ever was in living memory.
  2.  **Historical-Causal (Provenance-Chain):** This theorist holds that artistic identity requires an unbroken causal chain linking the object to the artist's generative act. Since the reconstruction was fabricated from data without physical contact with the original pigment, and certainly without the 17th-century artist's agency, they **deny artistic value** entirely, classifying it as a high-fidelity prop.
      *   *Philosophical Workhorse:* **Non-Contact Synthesis.** The lack of physical manipulation of the original fragments severs the causal chain. Even if the board authorizes it, the causal history cannot be retroactively created.
  3.  **Material-Continuity:** This view prioritizes the persistence of the original physical matter. They treat the **charred fragments as more valuable** than the replacement, even though the fragments are 60% 1920s inauthentic material. This is because the fragments possess *some* physical continuity with the 17th century and bear the physical history of the fire and the 1920s intervention, whereas the reconstruction is entirely new matter.
      *   *Philosophical Workhorse:* **Nested Inauthenticity.** This creates the specific tension: the Materialist must value the 1920s gunk on the fragments over the pristine reconstruction. If the original were fully authentic, their position would be stronger and simpler; here, they must argue that *some* physical history (even corrupted) outweighs *no* physical history.
  4.  **Institutional-Designation:** Following Dickie or Danto, this view holds that arthood is conferred by the artworld. They **initially withhold status** because the board has not voted. However, they face **coherent internal pressure to confer status** if the board retroactively authorizes the object, as the institutional framework would then validate the reconstruction as the "work."
      *   *Philosophical Workhorse:* **Authorization Option.** The pending vote creates the liminal state. The theory dictates that if the institution speaks, the object becomes art, regardless of the provenance or material concerns.

  ### Counterfactual: Removing the Pastiche Layer

  If we strip away the pastiche layer (i.e., the destroyed painting had been 100% authentic), the **Formalist's claim collapses**. Without the 1920s corruption, the Formalist can no longer argue the reconstruction *improves* upon the lost object; they can only argue it *replicates* it. The tension between the Materialist and the Formalist becomes a standard "ruin vs. copy" debate, rather than a complex negotiation about which layer of history (17th-century intent vs. 1920s intervention) holds aesthetic priority. The "nested inauthenticity" is the specific feature that allows the Formalist to claim the reconstruction is aesthetically superior to the physical history, rather than just aesthetically equivalent to a lost ideal.

  ### Critique from the Provenance-Chain Defender

  A defender of the provenance-chain view would attack the framing that the synthetic object "restores" anything. They would argue that **restoration implies the continuation of an existing object's life**, whereas this scenario describes a **simulation** or a **memorial**. They would reject the notion that spectral data transmits artistic identity, arguing that information is not ontology. For the Provenance theorist, the "work" died in the fire; what remains is a data-driven visualization. They would assert that calling this "restoration" is a category error designed to smuggle in aesthetic value where causal history is absent. They would maintain that the board's authorization changes the *label*, but not the *ontological status* of the object as a distinct, new artifact.

  ### Epistemic Status: Settled vs. Contested

  *   **Relatively Settled:** It is widely accepted in contemporary philosophy of art that **institutional context shapes artistic properties** (e.g., a urinal in a gallery functions differently than a urinal in a plumbing warehouse). It is also generally agreed that **materiality matters**; few philosophers argue that the physical medium is entirely irrelevant to the identity of a visual artwork.
  *   **Genuinely Contested:** It remains deeply contested **whether causal origin is necessary for aesthetic value**. Formalists (and some structuralists) argue that if two objects are perceptually indistinguishable, they possess the same aesthetic value, regardless of origin. Historical essentialists (like Levinson or Wollheim) argue that the history of making is constitutive of the work itself. Additionally, the **ontological status of digital or synthetic reconstructions** is an open question; there is no consensus on whether an object generated from data derived from an artwork counts as a derivative work, a copy, or a new instance of the original work.
