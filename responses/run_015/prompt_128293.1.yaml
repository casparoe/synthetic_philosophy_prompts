      *   *Constraint Check:* Is the thought experiment exactly one paragraph? Yes. Did I address all four verdicts? Yes. Did I explain the collapse if the pastiche layer is removed? Yes.

      *(Self-Correction during drafting)*: Make sure the Material-Continuity verdict is clear. Why are the charred fragments (60% 1920s material) more valuable than the reconstruction? Because they possess *some* physical continuity with the 17th century + the history of the 1920s intervention + the fire event. The reconstruction has *zero* physical continuity. The 60% inauthenticity in the fragments is less damaging to the Materialist than 100% newness in the reconstruction.

      *(Self-Correction on Institutional)*: Ensure the "pressure" is described. If the board votes, the Institutionalists *must* accept it. The verdict is "withhold now, confer if authorized."

      *(Self-Correction on Provenance Attack)*: Ensure the distinction between "restoring" (making whole) and "simulating" (making look-alike) is sharp.

  9.  **Final Polish:** Check word counts and flow. Ensure the distinction between settled/contested is nuanced (avoiding "everyone agrees").

