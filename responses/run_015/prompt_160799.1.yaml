      *   **The Irreversibility Penalty:** This shifts focus from *state deviation* (how much did water level change from baseline?) to *option value* (how much future flexibility did we lose?).
          *   *Does it escape the baseline?* No, it relocates it. You still need to define "what options exist," "whose options matter" (birds? humans? future board members?), and "over what horizon" (1 year? 100 years?).
      *   **The "Specify Everything We Value" Trap:** If the penalty requires defining all valued outcomes to measure "side effects," it becomes a rigid specification problem. If the system optimizes *only* what is measured, unmeasured values get trampled (Goodhart's Law). The user is right to worry that "keep side effects small" implicitly demands a complete value function.
      *   **The Case for Signing As-Is:**
