      *Let's refine the "Irreversibility" answer:* Does it escape the baseline? No. It changes the metric from *state distance* to *option space volume*. But you still need to define the *initial* option space (the baseline) to measure the shrinkage. And you need to define what counts as an "option." So it relocates the problem.
