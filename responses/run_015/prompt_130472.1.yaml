answer: |-
  This is a sophisticated question that cuts to the core of modern population ethics and decision theory. You have correctly identified that concave utility functions (risk aversion) dampen the influence of low-probability, high-stakes outcomes. However, the treatment of "EV fanaticism" as a distinctive, unresolved crisis in rationalist and longtermist circles stems from the fact that **concavity alone is mathematically insufficient to resolve the problem**, and **moral risk aversion is ethically controversial** in a way that personal risk aversion is not.

  Here is the precise breakdown of why this is treated as a foundational problem rather than a simple parameter error.

  ### 1. Rationality Does Not Mandate Risk Aversion
  Your premise states that "standard economic theory already mandates concave utility for risk-averse agents." This contains a category error common in introductory economics.

  *   **VNM Rationality:** The Von Neumann-Morgenstern axioms define rational consistency in preferences. They do **not** mandate risk aversion. A rational agent can be risk-neutral (linear utility) or risk-seeking (convex utility). Risk aversion (concave utility) is a specific preference structure, often justified in economics by diminishing marginal utility of *wealth*, not by the laws of logic.
  *   **Moral vs. Personal Currency:** In longtermism, the "currency" is often moral value (e.g., well-being, lives saved), not personal wealth. Many utilitarian frameworks argue for **risk neutrality over moral value**. The intuition is that saving 10 lives with 10% probability is equally as good as saving 1 life with 100% probability. If you impose concavity here, you imply that it is better to save 1 life for sure than 1,000 lives at a 50% chance. While this matches personal risk aversion, it contradicts the "separateness of persons" objection often used to justify aggregation in the first place.

  ### 2. Concavity vs. Boundedness (The Mathematical Crux)
  This is the most critical technical point. You suggest that a logarithmic utility function solves the problem because the marginal utility tends to zero. While this *mitigates* fanaticism, it does not *eliminate* it unless the utility function is **bounded**.

  *   **Unbounded Concave Functions:** A function like $U(x) = \log(x)$ is concave, but it is **unbounded**. As $x \to \infty$, $U(x) \to \infty$.
  *   **The Tail Dominance:** In longtermist scenarios, the potential stakes are not just large ($10^{40}$); they are recursively large (e.g., computational substrates allowing $10^{100}$ lives). For any unbounded utility function (even logarithmic), there exists some outcome magnitude $X$ such that $p \cdot U(X) > U(\text{sure thing})$, provided $p > 0$.
  *   **Pascal's Mugging:** If the universe allows for arbitrarily large values (unbounded axiology), a sufficiently large claim will always dominate expected utility calculations, regardless of concavity. To strictly prevent fanaticism, you need a **bounded utility function** (an asymptote where $U(x)$ never exceeds some cap $M$).

  ### 3. The Cost of Bounded Utility
  If the solution is simply "use a bounded utility function," why is this not the consensus? Because bounded utility introduces severe paradoxes of its own, often considered worse than fanaticism:

  *   **Existential Risk Neglect:** If humanity's potential value is near the bound (the asymptote), reducing existential risk from 1% to 0.1% might yield almost zero marginal expected utility. This undermines the core longtermist argument for prioritizing existential risk reduction.
  *   **The Sadistic Conclusion:** Bounded utility can imply that adding a life with negative welfare is sometimes better than adding a life with positive welfare, depending on where the population sits relative to the bound.
  *   **Arbitrary Capping:** There is no non-arbitrary ethical justification for saying "10^50 happy lives are effectively equal in value to 10^100 happy lives."

  ### 4. The Beckstead-Thomas Theorem
  In 2021, Nick Beckstead and Thomas (in *A Paradox for Tiny Probabilities and Enormous Values*) formalized this dilemma. They proved that any decision theory satisfying a few very weak, plausible axioms (e.g., "if two options are identical except one has a better outcome in some state, prefer that one") must be **fanatical**.

  Specifically, they showed that you generally cannot avoid the conclusion that a tiny probability of an enormous good outweighs a sure thing of a modest good, unless you violate basic dominance principles. This demonstrates that fanaticism is not an artefact of *linear* utility specifically, but a structural feature of almost **any** consistent aggregation of value over an unbounded domain.

  ### 5. Dust Specks vs. Torture and Lexicality
  You mentioned the Dust Specks vs. Torture framing. This is relevant because it highlights the **lexical** alternative to concavity.

  *   **Aggregation:** The "fanatic" view aggregates disutility linearly (enough specks equal torture).
  *   **Lexical Views:** To avoid this, some propose lexical thresholds (torture is infinitely worse than specks).
  *   **Connection to Fanaticism:** If you adopt a lexical view to avoid dust-speck aggregation, you often re-introduce fanaticism in the probability domain. If preventing torture is *infinitely* more important than preventing specks, then even a tiny probability of preventing torture outweighs a certainty of preventing specks. Thus, trying to solve one aggregation problem (specks) often exacerbates the other (probabilities).

  ### Conclusion
  The reason "EV fanaticism" is treated as a distinctive, unresolved problem rather than a simple mistake of using linear utility is threefold:

  1.  **Mathematical:** Concavity (risk aversion) does not stop fanaticism; only **boundedness** does. But boundedness creates unacceptable ethical blind spots regarding existential risk.
  2.  **Ethical:** There is a strong philosophical case for **moral risk neutrality**. Applying personal risk aversion to the lives of others is viewed by many as a form of moral cowardice or unjustified discounting of future people.
  3.  **Structural:** As per Beckstead-Thomas, fanaticism appears to be a theorem of almost any plausible decision theory with an unbounded axiology, not just a bug of linear expectation.

  Therefore, rationalist forums treat this as a crisis of **axiology and decision theory fundamentals**, not merely a parameter tuning issue. The search for "novel solutions" (like risk-weighting, truncation, or infinite ethics revisions) is an attempt to find a framework that avoids fanaticism without sacrificing the ability to prioritize existential risk reduction—a balance that standard concave utility fails to strike.
