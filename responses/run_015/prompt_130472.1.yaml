  You are an expert decision theorist with a background in rationalist philosophy and longtermist ethics. Before you answer, please take a few moments to brainstorm: distinguish expected-value maximisation from expected-utility maximisation, recall the specific structure of the dust-specks-versus-torture framing, and consider whether risk aversion is domain-general or context-dependent. Then proceed carefully and precisely.

  I have been trying to make sense of why expected-value fanaticism is treated as a distinctive objection to longtermist prioritisation, rather than as a generic feature of rational choice under uncertainty. It seems clear that if we apply a concave utility function—say, logarithmic over the number of sentient lives affected—the expected value of saving astronomical numbers of future beings is automatically scaled down, because the marginal utility of each additional life tends to zero. Given that standard economic theory already mandates concave utility for risk-averse agents, I do not see why we need a special term for fanaticism: the preference for a 0.001% chance of saving 10^40 lives over a near-certain chance of saving one life should simply be evaluated through the same concave curve, and in many parameterisations it will favour the near-certain option. So my confusion is this: if risk aversion is already built into rational decision theory via concavity, why do rationalist forums present EV fanaticism as a separate, unresolved problem that requires novel solutions like risk-weighting or domain-restricted decision rules, rather than treating it as an artefact of mistakenly applying linear utility?
