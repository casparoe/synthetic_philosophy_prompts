answer: |-
  Here is the session arc designed for a neuroscience-heavy audience. It bypasses metaphysical intuition pumps and treats consciousness as a modeling problem.

  ### 1. The Foundational Dependency
  You are close, but "representational content misapplied to itself" is too abstract for a 60-minute session.
  **The actual dependency:** **Introspection is a sub-personal generative process, not a direct window.**
  Before they can accept illusionism, they must accept that the brain's access to its own states is mediated by the same predictive/representational machinery it uses to access the external world. If the visual system can hallucinate a pink elephant, the introspective system can hallucinate a "qualitative glow."
  *   **Action:** Open by establishing that *introspection* is a neural function subject to error, latency, and modeling constraints, just like vision.

  ### 2. The Phantom Limb Example (Precision Constraints)
  This is your strongest tool, but it must be wielded precisely to avoid the "but the pain feels real!" counter.
  *   **What it must show:** The *phenomenal character* (burning, cramping) is fully present in the experience, but the *property bearer* (the leg/tissue) is absent. The brain is representing a state of the body that does not exist.
  *   **What it must lack:** Do **not** frame this as a "false belief." The patient does not *believe* the leg is burning; they *feel* it burning. This distinguishes it from delusion.
  *   **The Pivot:** In standard pain, the tissue damage exists. In illusionism, the *intrinsic qualitative property* (the "ouchiness" itself) is like the phantom leg. The neural activity exists (the stump), the report exists ("it hurts"), but the *intrinsic quality* attributed to that activity is the phantom limb.
  *   **Key Phrase:** "The experience is veridical (it is happening), but the *ontology* of the experience (what it claims is happening) is false."

  ### 3. Session Arc & Misconception Management
  Do not save the objections for the Q&A. Pre-empt them in the lecture flow.

  **Part 1: The Setup (10 mins)**
  *   Define Introspection as a generative model.
  *   **Pre-empt Misconception 1 (Denying Consciousness):** Explicitly state: "Illusionism is not eliminativism about *experience*; it is eliminativism about *phenomenal properties*."
      *   *Script:* "We are not saying you don't feel pain. We are saying the 'painfulness' is a user-interface icon, not the code itself. The icon is real; the thing the icon depicts (intrinsic qualia) is not."

  **Part 2: The Phantom Limb Analogy (15 mins)**
  *   Run the example as defined above.
  *   Bridge to consciousness: "Just as the brain projects pain onto a missing leg, it projects 'qualitative glow' onto neural processing."

  **Part 3: The Mechanism - Predictive Processing (10 mins)**
  *   **Decision:** **Yes, inject Predictive Processing (PP).** For neuro grads, this is the "how." It grounds the metaphysics in mechanics.
  *   **How to frame it:** Qualia are *controlled hallucinations*. The brain predicts sensory states and updates based on error. Phenomenal properties are the brain's way of compressing complex neural data into a usable format for the organism.
  *   **Constraint:** Keep it sub-personal. Do not imply a "self" is watching the prediction. The prediction *is* the experience.

  **Part 4: The Fire Drill - Addressing Objections (15 mins)**
  Address the remaining two misconceptions here, immediately after the mechanism.
  *   **Pre-empt Misconception 2 (Behaviorism/Identity Theory):**
      *   *Objection:* "Isn't this just saying pain is C-fiber firing?"
      *   *Response:* No. Identity theory says pain *is* the firing. Illusionism says pain is the *model* of the firing. Behaviorism ignores the inner state; Illusionism says the inner state is a representation that misrepresents itself.
  *   **Pre-empt Misconception 3 (The Homunculus):**
      *   *Objection:* "If the representation is an illusion, who is being fooled?" (Your roommate's point).
      *   *Response:* This is where you must be sharp. There is no homunculus. The system is wired to *react* to the representation *as if* it were true. The "fooling" is dispositional. The downstream systems (memory, planning, verbal report) receive the data tagged with "qualitative property," and they process it accordingly. No little man needs to "see" the illusion; the circuit just closes.

  **Part 5: The Check Question (10 mins)**
  Do not ask "Do you understand?" Ask a question that forces them to locate the ontology.

  > **The Question:**
  > "Consider a perfect philosophical zombie that functions exactly like a human but lacks 'inner light.' Now consider an Illusionist human.
  > **Q:** In what specific ontological category does the Illusionist claim the 'inner light' exists, such that the Zombie lacks it, without appealing to magic?"

  > **The Expected Answer:**
  > They should answer something like: "The Illusionist claims the 'inner light' exists as a *representational content* or *functional model* within the system, whereas the Zombie lacks that specific self-modeling architecture. The 'light' isn't a substance; it's a data format."
  >
  > *If they say:* "The Illusionist feels it and the Zombie doesn't," they failed (they reverted to dualism).
  > *If they say:* "The Illusionist has brain states and the Zombie doesn't," they failed (they reverted to Identity Theory).

  ### 4. What to Leave Out
  *   **Higher-Order Theories (HOT):** Do not open this can. It introduces a separate "meta-psychological" state which invites the Homunculus objection you are trying to dodge. Stick to first-order representationalism with a self-modeling twist.
  *   **Keith Frankish's Specific Architecture:** Too granular. Keep it at the "Predictive Processing/Generative Model" level.
  *   **The "Hard Problem" Label:** Avoid spending time defining Chalmers' Hard Problem. It primes them to look for magic. Frame it as the "Representation Problem."

  ### 5. Summary of Dependencies
  1.  **Introspection is fallible modeling** (Prerequisite).
  2.  **Phantom Limb** (Analogy for misattributed quality).
  3.  **Predictive Processing** (Mechanism for how the model is built).
  4.  **Dispositional Foiling** (Answer to Homunculus).

  If you stick to this order, you prevent the "Eliminativism" collapse by securing the reality of the *representation* before denying the reality of the *represented property*. Good luck with the study group.
