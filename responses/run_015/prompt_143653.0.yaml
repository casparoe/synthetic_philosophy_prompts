          *   *Misconception 3: The Homunculus.* (The "Who is fooled?" charge).
              *   *When to address:* Last. This is the most technical/philosophical objection.
              *   *Fix:* No little man inside. The system is wired to react to the representation *as if* it were true. The "fooling" is dispositional, not observational.

      *   **Phase 4: Predictive Processing (PP).**
