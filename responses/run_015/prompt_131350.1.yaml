answer: |-
  Good morning, everyone. Thanks for being here.

  I know what this room looks like from the outside. On one side, you have grad students who spend a lot of time reading about how the world works. On the other, you have apprentices who spend your days actually making the world work. Usually, these groups don't talk unless something is broken.

  So, why are we here? Why mix philosophy with plumbing, theory with wiring?

  There's an old idea in philosophy, from a guy named Gilbert Ryle, that splits knowledge into two buckets. There's "knowing-that"—like knowing the theory behind water pressure. And there's "knowing-how"—like knowing how to fix a pipe when the pressure drops. For a long time, people assumed the first kind was the "smart" knowledge, and the second kind was just habit or muscle memory.

  We're here to challenge that hierarchy. But we're also here to complicate it.

  My professor has been working on an idea she calls "error-tolerant procedural knowledge." That sounds heavy, but what it means is this: Having a skill isn't about never making mistakes. It's about having a specific relationship with being wrong.

  When a novice tries to fix a circuit, they might blow a fuse and have no idea why. When an expert does it, they might still hit a snag, but they know *which* snag it is. They know which errors are fatal and which are just noise. They know how to recover. That sensitivity to error? That isn't just habit. That's a form of understanding. It's intelligence embedded in the action.

  And here's the thing: this applies to everyone in this room.

  Yes, it applies to the trade work. You know the sound a wall makes when there's a stud behind it versus when there's nothing. You know when a connection feels "off" before you even test it. That's not magic; that's a sophisticated grasp of norms. You know what "right" looks like because you've navigated what "wrong" looks like.

  But it applies to us philosophers, too. When we're building an argument, we aren't just reciting rules. We're feeling for weaknesses. We make moves, see where they break, and adjust. We are also working with error-tolerant knowledge. We just use different tools.

  The reason we brought these two groups together isn't so the philosophers can analyze the tradespeople. We aren't here to turn your work into a case study. We're here because both groups are masters of handling complexity under pressure.

  We want to talk about what happens when the manual doesn't match the reality. Whether you're holding a wrench or a concept, you know that moment where you have to improvise. That improvisation isn't a failure of knowledge; it's the highest form of it.

  So, over the next few days, let's not treat "theory" and "practice" as opposites. Let's treat them as different ways of navigating the same problem: how to keep things running when nothing is ever perfectly straight.

  We're all here because we know how to fix things. Let's figure out what that knowing actually looks like.

  Thanks.
