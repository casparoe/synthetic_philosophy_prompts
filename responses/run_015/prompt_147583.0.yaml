answer: |-
  # Desiderata for a Theory of Pattern-Reality

  To resolve the dispute over Dennett's three stances (Physical, Design, Intentional), a theory of pattern-reality must navigate between the Scylla of ontological bloating (reifying every useful heuristic) and the Charybdis of eliminativism (denying reality to anything not fundamental). The following desiderata formalize the conditions any adequate account must meet to preserve the integrity of all three stances without collapsing them into one another.

  ## I. Predictive and Explanatory Requirements

  These requirements concern the functional performance of the stances. A theory must explain *why* we use three stances and *when* they apply.

  ### 1. The Cross-Stance Tracking Requirement
  **Definition:** Distinct stances must converge on the same behavioral predictions for the same system, despite employing incommensurable vocabularies.
  **Motivating Case:** *The Chess Computer.*
  *   **Physical:** Predicts move based on voltage states in the CPU.
  *   **Design:** Predicts move based on minimax algorithm optimization.
  *   **Intentional:** Predicts move based on the belief "I must protect the queen" and desire "to win."
  **Requirement:** The theory must explain how these distinct descriptions track the *same* event without requiring the "belief" to be a voltage state. The patterns must be co-extensional in output but distinct in compression.
  **Status:** **Non-Negotiable.** If stances diverge systematically without error conditions, one is false.

  ### 2. The Interference and Error Resolution Requirement
  **Definition:** The theory must specify conditions under which one stance overrides or corrects another, particularly when systems malfunction or act irrationally.
  **Motivating Case:** *Akrasia (Weakness of Will).*
  *   An agent believes smoking is bad (Intentional) but smokes anyway.
  *   **Intentional Stance:** Predicts non-smoking (rational agent). Prediction fails.
  *   **Design/Physical Stance:** Predicts smoking (addiction circuitry/chemical dependency). Prediction succeeds.
  **Requirement:** The account must distinguish between a *failure of the pattern* (the agent is irrational) and a *failure of the theory* (the intentional stance is invalid). It must quantify "noise" in the pattern without dissolving the pattern entirely.
  **Status:** **Non-Negotiable.** Without this, the Intentional stance is falsified by every irrational act.

  ### 3. The Compression Efficiency Requirement
  **Definition:** Higher-level stances must offer significant informational compression over lower-level stances without prohibitive loss of predictive fidelity.
  **Motivating Case:** *Predicting a Human vs. Predicting a Gas.*
  *   Predicting a human via physics is computationally impossible (too many particles).
  *   Predicting a gas via intentionality is impossible (no beliefs).
  **Requirement:** The theory must define a threshold of "pattern density." A pattern is real only if adopting the stance yields a net gain in predictive power per unit of computational cost.
  **Status:** **Non-Negotiable.** This grounds the "reality" of the pattern in its utility, avoiding magical emergence.

  ## II. Ontological Distinctions

  These requirements concern what exists. The theory must distinguish between what is *in the world* and what is *in the model*.

  ### 4. The Stance-Relative Reality Requirement
  **Definition:** Ontological commitment must be relative to the stance adopted, not absolute across all stances.
  **Motivating Case:** *The Center of Narrative Gravity.*
  *   Does a "self" exist? Physically, no (just neurons). Intentionally, yes (a character in a story).
  **Requirement:** The theory must allow for an entity to be "real" in the Intentional stance (supporting counterfactuals like "If he knew X, he would have done Y") without requiring a corresponding "self-particle" in the Physical stance.
  **Status:** **Non-Negotiable.** This is the core of Dennett's "Real Patterns." Denying this collapses the stances into one.

  ### 5. The Pattern vs. Noise Distinction (Binary vs. Gradual)
  **Definition:** The theory must distinguish between *having* a pattern (binary) and the *fidelity* of the pattern (gradual).
  **Motivating Case:** *The Malfunctioning Thermostat.*
  *   A thermostat has a Design pattern (maintain 70°). If it breaks, it doesn't lose the pattern entirely; it becomes a *noisy* instance of the pattern.
  **Requirement:** "Reality" cannot be all-or-nothing. A system can be 80% intentional. The ontology must support degrees of pattern instantiation without dissolving into "nothing is real."
  **Status:** **Preference (Dennettian).** Some realists prefer binary existence, but pattern realism requires gradation to handle evolution and development.

  ### 6. The Utility vs. Commitment Distinction
  **Definition:** Predictive utility is necessary but not sufficient for full ontological commitment.
  **Motivating Case:** *Astrology vs. Astronomy.*
  *   Astrology might offer some psychological comfort (utility), but fails counterfactual support.
  *   Gravity offers utility and supports counterfactuals.
  **Requirement:** The theory must distinguish between a *useful fiction* (instrumentalism) and a *real pattern* (structural realism). Utility gets you in the door; counterfactual support buys the house.
  **Status:** **Non-Negotiable.** Without this, the theory collapses into pure instrumentalism.

  ## III. Consistency Conditions

  These requirements ensure the theory does not contradict established scientific constraints.

  ### 7. The Physical Closure Constraint
  **Definition:** All physical events must have sufficient physical causes. No non-physical energy or force may enter the causal chain.
  **Motivating Case:** *Neural Activation.*
  *   If a "belief" causes an arm to raise, there must be a neural cascade sufficient to raise the arm. The belief cannot add "mental joules."
  **Requirement:** The Intentional and Design stances cannot violate the conservation of energy or causal closure of the physical domain.
  **Status:** **Non-Negotiable (for Naturalism).** Violating this invites dualism.

  ### 8. The No Free Ontological Lunch Constraint
  **Definition:** Higher-level patterns cannot introduce new *substances*, only new *organizations* of existing substances.
  **Motivating Case:** *Emergent Properties.*
  *   Wetness is real, but it is not a new fluid added to H2O molecules.
  **Requirement:** The theory must explain how new causal powers (e.g., "deciding") arise from organization without positing new fundamental constituents.
  **Status:** **Non-Negotiable.** Prevents strong emergentism from becoming magic.

  ### 9. The Empirical Adequacy Condition
  **Definition:** Each stance must be empirically adequate within its domain of application.
  **Motivating Case:** *Psychophysics.*
  *   If the Intentional stance predicts a reaction time that the Physical stance rules out as physically impossible, the theory must resolve the conflict.
  **Requirement:** Stances cannot contradict empirical data generated by other stances.
  **Status:** **Non-Negotiable.**

  ---

  ## IV. Analysis of Tensions and Constraints

  ### Jointly Unsatisfiable Subset?
  There is a *prima facie* tension between **Physical Closure (7)** and **Stance-Relative Reality (4)** when combined with **Non-Reductive Explanatory Autonomy**.

  *   **The Tension:** If the Physical stance is causally closed, every event is determined by micro-physics. If the Intentional stance is *autonomous* (not reducible), its explanations cite beliefs, not neurons. If beliefs cause actions, and neurons cause actions, do we have **causal overdetermination**?
  *   **The Verdict:** This is the **Exclusion Problem**. It is not logically unsatisfiable, but it is *theoretically unstable* for many views.
      *   If you say beliefs *are* neurons (Reductionism), you save Closure but lose Autonomy.
      *   If you say beliefs are *separate* (Dualism), you save Autonomy but lose Closure.
      *   To satisfy both, one must adopt a **Compatibilist Theory of Causation** (e.g., causation as difference-making or counterfactual dependence rather than energy transfer). If causation is just "making a difference," the belief can be the cause *at the intentional level* while the neuron is the cause *at the physical level* without competition.
  *   **Result:** The tension is not a proof of impossibility, but a filter that eliminates any theory relying on "force-based" or "production-based" causation at higher levels.

  ### The Single Requirement That Eliminates the Most Views
  **The Non-Reductive Causal Relevance Constraint.**
  *(Derived from combining Physical Closure + Explanatory Autonomy)*

  This requirement demands that higher-level patterns (beliefs, functions) must be causally relevant (they do work) without violating physical closure (they add no energy) and without being reducible (they are not just shorthand for physics).

  *   **Eliminates Eliminativist Physicalism:** Because it demands intentional patterns be *real* and *relevant*, not just fictions.
  *   **Eliminates Substance Dualism:** Because it demands physical closure (no mental substance pushing atoms).
  *   **Eliminates Strong Emergentism:** Because it demands no "free lunch" (no new fundamental forces).
  *   **Eliminates Reductive Physicalism:** Because it demands autonomy (the pattern cannot be fully reduced without loss of predictive power).

  This single constraint leaves only **Non-Reductive Physicalism (Pattern Realism)** standing.

  ---

  ## V. Scoring the Contenders

  Here is how three major positions fare against the Desiderata.
  *(Scale: 0 = Fails Completely, 1 = Partial/Strained, 2 = Fully Satisfies)*

  | Desideratum | **Dennett's Pattern Realism** | **Eliminativist Physicalism** (Churchland) | **Strong Emergentism** (O'Connor/etc.) |
  | :--- | :---: | :---: | :---: |
  | **1. Cross-Stance Tracking** | **2** (Built for this) | **1** (Tracks, but denies upper stances are true) | **2** (Accepts distinct levels) |
  | **2. Interference/Error** | **2** (Noise/Idealization model) | **0** (Errors prove the stance is false) | **2** (Level conflict) |
  | **3. Compression Efficiency** | **2** (Core metric of reality) | **1** (Admits utility, denies ontology) | **2** (Accepts distinct levels) |
  | **4. Stance-Relative Reality** | **2** (Real Patterns) | **0** (Only Physical is Real) | **1** (Often reifies levels as substances) |
  | **5. Pattern vs. Noise** | **2** (Gradual instantiation) | **0** (Binary: Exist or Don't) | **1** (Often binary emergence) |
  | **6. Utility vs. Commitment** | **2** (Counterfactual support) | **0** (Utility ≠ Truth) | **2** (Real powers) |
  | **7. Physical Closure** | **2** (Constitutive physicalism) | **2** (Strict closure) | **0** (Often violates closure) |
  | **8. No Free Lunch** | **2** (Organization only) | **2** (Nothing but physics) | **0** (Novel causal powers) |
  | **9. Empirical Adequacy** | **2** (Pragmatic check) | **2** (Physical data priority) | **1** (Hard to test emergence) |
  | **TOTAL SCORE** | **18 / 18** | **7 / 18** | **10 / 18** |

  ### Brief Commentary on Scores

  1.  **Dennett's Pattern Realism:** Scores perfectly because the desiderata were essentially formalized *from* his position. It navigates the Exclusion Problem by treating causation as information-theoretic compression rather than force transmission. Its weakness (not captured fully in the score) is the intuitive discomfort of "real but not fundamental" ontology.
  2.  **Eliminativist Physicalism:** Fails primarily on Ontological Distinctions (4, 5, 6). It respects Physical Closure but sacrifices the Intentional Stance's reality, treating it as a "folk theory" destined for replacement. It fails the **Non-Reductive Causal Relevance Constraint** because it denies relevance to the intentional level.
  3.  **Strong Emergentism:** Fails primarily on Consistency Conditions (7, 8). It grants full autonomy to the Intentional/Design stances but typically pays for it by violating Physical Closure (downward causation requires new energy/forces). It fails the **No Free Ontological Lunch** requirement.

  ## Conclusion

  The argument with your friend hinges on whether "real" means "fundamental constituent" or "robustly predictive pattern." If you adopt the desiderata above, specifically the **Non-Reductive Causal Relevance Constraint**, you force a choice: either you deny the utility of the Intentional stance (Eliminativism), you violate physics (Dualism/Emergentism), or you accept that reality is stratified by patterns of compression (Dennett).

  The tension you identified is real, but it is not a contradiction; it is a **category constraint**. The Intentional stance does not describe *stuff*; it describes *organization*. Once causation is decoupled from "pushing" and coupled to "constraining," the stances coexist without collision. The cost is accepting that some things are objectively real without being fundamentally physical.
