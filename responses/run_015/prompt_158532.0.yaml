prompt: |-
  You're acting as a sharp professional philosopher with expertise in Bernard Williams and moral psychology. Before you answer, do a quick brainstorm of the moving parts so you don't miss the spec.

  I want a constructed thought experiment — not the usual drowning-spouse version, something more in the weeds that a model can't just parrot from pretraining. Build me a realistic hospital/administrative scenario (realistic, one paragraph max, no trolleys, no perfect predictors, no sci-fi) where a senior surgeon is ordered by a new efficiency protocal to immediately rotate away from a resident they've mentored for six years, breaking a long-form surgical apprenticeship that defines thier professional identity. Engineer the case so that Williams's integrety objection hits hard: the surgeon refuses the rotation not because they've calculated that this resident saves more lives, and not because they've found a competing moral duty, but because complying means abandoning a ground project. Crucially, inject this niche feature — there should be an impartial, institutionally-valid reason available (say, documented continuity-of-care benefits for that specific resident's patient cohort) that technically justifies keeping the pairing, but if the surgeon invoked that reason it would be "one thought too many." The real driver is the vocational project itself.

  After the scenario, do this: (1) state Williams's verdict and why, (2) contrast with what a rule-consequentialist running the protocal would say, (3) point out the exact feature doing the philosophical work and what collapses if you strip away the ground-project element, (4) show how a critic of Williams attacks this specifcally case. Keep it focused, no bibliography, no "see Williams 1981" — just reason it through from first principles.
