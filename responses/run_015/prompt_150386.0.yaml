  *(Refining the VK Test section)*: The user asks if the film presents it as detecting genuine downward causation or mistaking correlation. The film actually suggests the test is *fallible*. Rachael doesn't know she's a replicant. The test works on physiology, but physiology can be engineered. This undermines the test's ability to distinguish levels.

