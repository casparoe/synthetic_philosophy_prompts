  # JOINT STATEMENT ON THE ABSENT-MINDED DRIVER PROBLEM

  **Date:** October 26, 2023
  **Parties:** The Planner (hereinafter "P"), The Sequentialist (hereinafter "S")
  **Witness:** The Mutual Friend (hereinafter "M")

  ## PREAMBLE
  We acknowledge a two-year stalemate regarding the normative solution to the Absent-Minded Driver (AMD) problem. We agree that further informal debate has resulted in the repetition of three standard moves without resolution. This document serves to formalize our points of agreement, isolate the precise locus of our disagreement, and establish empirical or theoretical conditions under which either party would concede. We adopt the numerical setup provided by M: Continuation probability $p$. Payoffs: Exit 1 = 0, Exit 2 = 4, End = 1. Ex-ante optimum $p = 2/3$ (Value $4/3$). Intersection re-evaluation suggests $p \approx 1/3$.

  ---

  ## SECTION I: AGREED CLAIMS
  *Both parties sign below to affirm the following five claims as factually and structurally correct.*

  1.  **Arithmetic and Structure:** We agree on the payoff function $U(p) = 4p - 3p^2$. The ex-ante maximum occurs at $p = 2/3$ with expected value $4/3$. We agree that at an intersection, assuming the agent infers location from the planned $p=2/3$, the probability of being at the first intersection is $3/5$. We agree that maximizing expected utility *conditional on being at an intersection* with these beliefs yields a continuation probability closer to $1/3$, resulting in a lower ex-ante average payoff (approx. 1.0) than the ex-ante plan.
  2.  **Information State:** We agree that the driver receives **no new information** at the intersection that was not available at the bar. The change in optimal action arises solely from the change in the agent's self-locating belief (the probability of being at Intersection 1 vs. 2), which is itself a function of the strategy chosen at the bar.
  3.  **Perfect Recall Benchmark:** We agree that if the driver had perfect recall (could distinguish Intersection 1 from 2), the rational strategy would be: Continue at Intersection 1, Exit at Intersection 2. Both P and S agree this yields a payoff of 4.
  4.  **Commitment Devices:** We agree that if the driver can bind themselves to a strategy at the bar (e.g., via a smart contract or a co-driver with authority), both P and S recommend binding to $p = 2/3$. Neither party recommends binding to $p = 1/3$.
  5.  **Fleet Arithmetic:** We agree that in a "Fleet Case" (1,000 identical drivers or 1,000 nights), if every driver adopts $p = 2/3$, the aggregate average payoff per trip will be $4/3$. If every driver adopts $p = 1/3$, the aggregate average payoff per trip will be lower (approx. 1.0). This is an empirical fact about frequencies, not a normative claim.

  ---

  ## SECTION II: DISAGREEMENT MATRIX
  *The core dispute is cataloged below. Columns 4 and 6 require specific predictions on test cases to prevent abstraction.*

  | # | The Question | Planner (P) Phrasing | Sequentialist (S) Phrasing | Crux or Verbal? | Test Case & Computation | P's Prediction | S's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Normative Evaluation Point** | Rationality is assessed **ex-ante**. The "agent" is the planning self at the bar. The intersection self is merely an executor. | Rationality is assessed **at the action**. The "agent" is the deciding self at the intersection. A plan is only rational if it is ratifiable at the moment of execution. | **Genuine Crux** | **The Co-Driver Case:** A passenger with perfect recall takes the wheel. | The Co-Driver confirms the ex-ante view is authoritative; the solo driver fails due to memory, not rationality. | The Co-Driver changes the decision structure entirely; the solo case proves the intersection view is the only one without external commitment. |
  | **2** | **Self-Locating Belief & Betting** | Beliefs at the intersection are derivative of the plan. Betting odds offered *at the intersection* do not dictate the *strategy* chosen at the bar. | Beliefs must guide action. If the driver accepts bets at the intersection based on $P(I_1)=3/5$, they must act consistently with those odds to avoid local Dutch Books. | **Verbal / Definitional** | **Betting Scenario:** A bookie offers a bet at *each* intersection separately. | P says the driver should refuse bets that conflict with the ex-ante plan, even if they look favorable locally. | S says the driver must accept bets favorable under current beliefs; rejecting them is irrational at that node. |
  | **3** | **Double-Counting Paths** | The S-view double-counts the "Straight-Straight" path. It treats two decision nodes as independent when the second is causally dependent on the first. | The P-view ignores the decision-theoretic weight of the second node. Each intersection is a distinct choice opportunity that must be optimized. | **Genuine Crux** | **Three-Intersection Version:** Add a 3rd intersection (Exit=0, Exit=0, Exit=4, End=1). | P's ex-ante optimization generalizes smoothly. | S's fixed-point calculation may become unstable or yield multiple equilibria. |
  | **4** | **Commitment vs. Rationality** | The tension is about **self-control**. The intersection self wants to deviate, but that is a psychological failure, not a rational update. | The tension is about **dynamic consistency**. If a rational agent cannot stick to a plan without binding, the plan was not rational for that agent. | **Genuine Crux** | **Dimmer-Switch Version:** A lamp provides a noisy signal of location (Quality 0 to 1). | As signal quality $\to$ 0, the recommended $p$ should approach $2/3$ continuously. | As signal quality $\to$ 0, there may be a **discontinuity/jump** where ratifiability collapses to the local optimum ($1/3$). |
  | **5** | **Coherence of Imperfect Recall** | Imperfect recall is a standard constraint. The problem is well-posed. | Imperfect recall creates a pathology where standard decision theory (maximize EU given beliefs) contradicts itself. | **Verbal** | **N/A** (Conceptual) | N/A | N/A |

  ---

  ## SECTION III: DIAGNOSTIC ON VERBAL VS. SUBSTANTIVE
  *Per the instruction to identify where language is obscuring the dispute.*

  1.  **"What Should He Do?" (Verbal):**
      *   **P** interprets this as "What instruction should be written in the code at the bar?"
      *   **S** interprets this as "What choice should be made when the steering wheel is in hand?"
      *   *Resolution:* We agree these are different questions. The dispute is which question is *normatively authoritative*.

  2.  **"Belief" (Verbal):**
      *   **P** treats belief as a tool for the ex-ante planner to calculate strategy.
      *   **S** treats belief as a constraint on the intersection agent to ensure coherence between credence and action.
      *   *Resolution:* We agree that betting behavior at the intersection will differ depending on which "belief" is operationalized. The dispute is whether the intersection betting odds constrain the ex-ante strategy.

  3.  **Causal Decision Theory (Clarification):**
      *   Both parties affirm they are **Causal Decision Theorists**. Neither side is arguing for Evidential Decision Theory (EDT). The disagreement is not about whether actions provide evidence of outcomes, but about *which temporal instance of the agent* gets to maximize utility.

  ---

  ## SECTION IV: CONDITIONS FOR REVISION (SWITCH CONDITIONS)
  *To prevent infinite looping, each party specifies what evidence or argument would force them to abandon their current position.*

  ### For The Planner (P) to Switch to Sequentialist View:
  P will abandon the ex-ante optimum if it is demonstrated that:
  1.  **Dutch Bookability:** An agent following $p=2/3$ can be subjected to a series of bets offered *at the intersections* that guarantee a loss, which could have been avoided by adopting $p=1/3$, **and** this vulnerability cannot be blocked by a commitment device at the bar.
  2.  **Dominance in Generalized Cases:** In the **Three-Intersection Version**, the ex-ante strategy yields a payoff strictly lower than the Sequentialist fixed point *even when* the agent has the capacity for pre-commitment but chooses not to use it (i.e., showing the ex-ante view is not just about commitment but about error).

  ### For The Sequentialist (S) to Switch to Planner View:
  S will abandon the intersection optimum if it is demonstrated that:
  1.  **Self-Harm without Constraint:** In the **Dimmer-Switch Version**, as the signal becomes perfectly noisy (0 quality), the Sequentialist recommendation creates a discontinuous jump in payoff that actively harms the agent's stated goals, implying the "rationality" at the intersection is structurally divorced from the agent's welfare.
  2.  **Fleet Dominance:** It is accepted that in the **Fleet Version**, a manager who fires all drivers using $p=1/3$ and hires drivers using $p=2/3$ increases total utility without adding commitment technology, proving that the intersection view fails to track *value* even if it tracks *local coherence*.

  ---

  ## SIGNATURES

  We, the undersigned, agree that future arguments must reference specific rows in the Disagreement Matrix or the Switch Conditions. Re-arguing the arithmetic of Section I is prohibited.

