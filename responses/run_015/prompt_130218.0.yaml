  2.  **Deconstruct the 6 Commitments:**

      *   (1) **Standard SB:** Thirder (1/3). Rule: Weight worlds by prior (1/2 H, 1/2 T), spread credence over awakenings (1 on H, 2 on T). $P(H) = \frac{0.5 \times 1}{0.5 \times 1 + 0.5 \times 2} = 1/3$.
      *   (2) **Variant SB:** Tails -> 2nd coin flip. If 2nd H, 2 awakenings. If 2nd T, 1 awakening.
