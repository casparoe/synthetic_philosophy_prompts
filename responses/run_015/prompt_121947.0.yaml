answer: |-
  Dear Editor,

  I am writing to submit the philosophical analysis you requested for the upcoming feature on cinema and metaphysics. In preparing this reading of Andrew Niccol's 1997 film Gattaca, I have focused on the tension between the narrative arc and the Kripkean thesis of origin essentialism. This thesis posits that a particular human being could not have developed from a different sperm and egg and still remain that same individual. While standard readings of the film often treat it as a cautionary tale about genetic determinism or a celebration of the human spirit over biology, a rigorous metaphysical examination reveals a more complex engagement with the necessity of origin. The film does not merely illustrate these concepts but enacts a philosophical argument through its plot mechanics, specifically questioning whether personal identity is anchored in biological genesis or in functional continuity and social recognition.

  To understand how Gattaca engages with origin essentialism, we must first look at how the society within the film treats genetic origin as destiny. In this world, your DNA is your resume, and your conception determines your social caste. This mirrors the essentialist view that origin is not merely a contingent fact about a person but a defining one. However, the protagonist Vincent Freeman complicates this by assuming the identity of Jerome Morrow. Vincent was conceived naturally, through chance, while Jerome was engineered for perfection. According to origin essentialism, Vincent could not have been born with Jerome's genes and still be Vincent. If his parents had selected different gametes to ensure his health, the resulting child would have been a numerically different person. The film touches upon this metaphysical tragedy in Vincent's narration regarding his birth. He notes that his parents were told chance was the only way to preserve the sanctity of conception, yet he views his own existence as a mistake. Here, the narrative implicitly raises the non-identity problem from population ethics. If Vincent's parents had utilized genetic selection to avoid his heart condition, Vincent would not exist to complain about his condition. A different child would exist in his place. This complicates any straightforward moral complaint about being born in-valid because the very identity of the complainant is tied to the genetic flaw they resent. The film suggests that Vincent's struggle is not just against discrimination but against the metaphysical necessity of his own flawed origin. He cannot wish for a better genetic start without wishing for his own non-existence.

  This tension between fixed origin and mutable identity is physically dramatized in the swimming competitions between Vincent and his engineered brother, Anton. These scenes are not merely tests of physical endurance but metaphysical contests between two different origins. Anton represents the engineered ideal, the person who supposedly should be superior due to his genetic design. Vincent represents the natural, the faith birth. When Vincent defeats Anton in the open water, he attributes his victory to the fact that he never saved anything for the swim back, whereas Anton always did. Philosophically, this moment undermines the deterministic implications often associated with origin essentialism. While Kripke argues that origin is essential to being a specific individual, he does not argue that origin determines capacity or destiny. The film pushes this further by suggesting that the will can override the biological predispositions associated with that origin. Vincent does not change his origin; he remains the child of natural conception. However, he demonstrates that the properties associated with that origin are not fixed. The water scene suggests that while you cannot change where you came from, the narrative of who you become is not sealed by that origin. Vincent remains Vincent, but he exceeds the limitations supposedly essential to his genetic class.

  The police investigation triggered by the murder at the space center serves as the film's rigorous test of the inescapability of biological origin. Throughout the inquiry, Vincent is constantly at risk because his true DNA betrays him. He must scrub his body of loose skin cells, hide his hair, and use fake blood samples to maintain his borrowed identity. This narrative device vindicates origin essentialism on a physical level. Vincent cannot actually become Jerome; he can only simulate him. His biological origin leaves traces that are materially distinct from Jerome's. The investigator, who is actually Vincent's brother Anton, is hunting for a genetic mismatch, effectively hunting for the truth of origin. The suspense of the film relies on the audience understanding that Vincent's true self is anchored in his biology, which he must constantly suppress. If origin were not essential, there would be no risk in the DNA tests. The fact that there is risk confirms that, metaphysically, Vincent is not Jerome. He is an in-valid pretending to be a valid. The film thus accepts the Kripkean view that you are your origin, but it questions the social and moral weight assigned to that fact. The investigation shows that while biological origin is inescapable physically, it need not be inescapable socially. Vincent passes the tests not by changing his essence, but by manipulating the evidence of it.

  The final sequence involving Jerome's suicide and Vincent's launch brings these threads together to offer a verdict on the nature of identity. Jerome, the valid whose identity Vincent has borrowed, commits suicide by entering the incinerator, leaving behind enough genetic material for Vincent to sustain the deception indefinitely. Vincent then launches into space. At this moment, we must ask who is actually flying the mission. Functionally and socially, it is Jerome Morrow. Metaphysically, it is Vincent Freeman. The film suggests that personal identity is not solely constituted by biological origin but is also constituted by action and intention. Vincent achieves his goal not by becoming Jerome, but by being Vincent while wearing Jerome's skin. Jerome's suicide is the final surrender of the valid identity to the invalid will. By giving Vincent his genetic samples, Jerome acknowledges that his own origin, though perfect, lacked the drive that Vincent possessed. The film ultimately undermines the social validity of origin essentialism while vindicating its metaphysical reality. Vincent never changes his origin; he remains the child of natural conception until the end. However, the narrative argues that this origin does not define his personhood. The person who reaches Titan is defined by the journey, not the gametes.

  In conclusion, Gattaca does not resolve the tension between origin and identity by dismissing one in favor of the other. Instead, it layers them to show that while we cannot escape where we come from, we are not bound by what that origin implies. The film respects the metaphysical truth of origin essentialism—Vincent is always Vincent, and no amount of genetic masking changes his biological genesis—but it rejects the ethical and social determinism that usually accompanies it. The inclusion of the non-identity problem adds a layer of tragic necessity to Vincent's existence, reminding us that his struggle is intrinsic to his being. He cannot be fixed without being erased. Yet, by succeeding despite this, the film proposes that personal identity is a narrative achievement rather than a biological given. Vincent's success is not a denial of his origin, but a transcendence of its implications. This reading suggests that cinema can do more than illustrate philosophical thought experiments; it can embody them, forcing the viewer to confront the discomfort of a world where who we are is distinct from what we are made of. I believe this analysis provides the rigorous philosophical grounding necessary for your feature, moving beyond the standard discourse on genetic discrimination to the deeper metaphysical questions of selfhood and necessity.

  Sincerely,

  Your Correspondent
