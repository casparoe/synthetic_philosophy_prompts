answer: |-
  ### Part 1: Advice on Your Three Distinctions

  You asked which distinctions are doing real work. Here is the assessment:

  1.  **Load-bearing vs. Decorative:** **Keep.** This is your primary risk assessment. It distinguishes between history that anchors legal/financial obligations (scholarships, building deeds, safeguarding) and history that anchors identity (mottos, anecdotes). Changing a load-bearing memory costs money or legal risk; changing a decorative one costs reputation.
  2.  **Substitution vs. Vacancy:** **Keep.** This determines your remedy. If the truth fills the slot (Substitution), you rename or recontextualise. If the truth empties the slot (Vacancy), you must decide whether to leave a hole or find a new occupant. This prevents the error of trying to "fix" a vacancy with a substitution.
  3.  **Memory-bearer Proximity:** **Correct.** As stated, this conflates genealogical closeness with moral stake. A current pupil (an 'adopter') may be more harmed by a toxic memory than a distant heir. This distinction is screening for **Harm & Stake**, not proximity. Redefine it as such: *Who bears the cost of this correction?* If the cost falls on the vulnerable, proceed with caution. If it falls on the powerful, proceed with accuracy.

  ***

  ### Part 2: The Heritage Decision Procedure
  *(Designed to fit two sides of A4)*

  **HERITAGE COMMITTEE DECISION PROCEDURE**
  **Purpose:** To adjudicate conflicts between school memory and historical record.
  **Authority:** Recommendations require signature by Deputy Head (Pastoral). Changes to building names require Governors' approval.

  **STEP 1: CATEGORISE THE MEMORY**
  *Q1: Is this memory Load-bearing or Decorative?*
  *   **Load-bearing:** Relationships, payments, legal titles, or settlements rest on this claim (e.g., scholarship criteria, building deeds).
  *   **Decorative:** Narrative, ceremonial, or identity-building (e.g., founders' day speech, corridor displays).
  *   *If Load-bearing:* Proceed to Step 4. (Do not alter without legal/governor advice).
  *   *If Decorative:* Proceed to Step 2.

  **STEP 2: ASSESS THE EVIDENCE**
  *Q2: What is the relationship between the Record and the Memory?*
  *   **Contradiction:** The record explicitly disproves the memory.
  *   **Silence:** The record contains no mention; memory relies on oral tradition or absence.
  *   **Conflict:** Two communities hold incompatible memories; record supports one.
  *   *If Silence:* Proceed to Step 3.
  *   *If Contradiction/Conflict:* Proceed to Step 3.

  **STEP 3: ASSESS STAKE & HARM (Formerly 'Proximity')**
  *Q3: Who is harmed if we correct the memory? Who is harmed if we keep it?*
  *   **Internal Stake:** Current pupils, staff, families (e.g., Braithwaite's descendant).
  *   **External Stake:** Village community, alumni, descendants of subjects (e.g., enslaved people).
  *   **Institutional Stake:** School reputation, legal standing.
  *   *Decision:* If correcting causes disproportionate harm to a vulnerable internal stakeholder compared to the benefit of accuracy, flag for **Value Escalation**.

  **STEP 4: SELECT DISPOSITION**
  *Choose from the Menu of Dispositions (see below).*
  *   **Default:** Annotate/Contextualise.
  *   **Removal:** Only if the memory causes active harm (e.g., glorifies abuse) and is Decorative.
  *   **Retention:** Only if the memory is Load-bearing or correcting it breaks a specific moral promise (e.g., to the dead).

  **STEP 5: ESCALATION & RESEARCH**
  *   **Value Escalation:** If the decision trades Accuracy for Kindness/Promise, refer to **Deputy Head (Pastoral)**. The written reason must state: *"We are prioritising [Relationship/Promise] over [Accuracy]."*
  *   **Research Escalation:** If evidence is insufficient (Silence/Missing Logs), refer to **Archivist**.
      *   *Interim Posture:* Label as "Contested" or "Under Review." Do not assert as fact.
      *   *Limit:* Max one day archivist time per half-term.
  *   **Governor Escalation:** Any change to a name on a building or permanent memorial.

  **WRITTEN REASONING REQUIREMENTS**
  For the Deputy Head, the minutes must state:
  1.  The Evidence Status (Contradiction/Silence).
  2.  The Disposition Chosen.
  3.  The Trade-off (e.g., "Accuracy traded for fidelity to a 1921 promise").

  ***

  **MENU OF DISPOSITIONS**
  1.  **Retain:** Keep as is. (Reason: Load-bearing or Promise).
  2.  **Annotate:** Keep the object/text, add context nearby. (Reason: Accuracy + Continuity).
  3.  **Relocate:** Move from prominent space to archive/display. (Reason: Decorative but historically significant).
  4.  **Retire Practice:** Keep the name/history, stop the ceremony/award. (Reason: Load-bearing name, harmful practice).
  5.  **Suspend:** Remove assertion pending research. Label "Under Review." (Reason: Insufficient Evidence).
  6.  **Publish Disagreement:** State both versions side-by-side. (Reason: Conflicting Communities).

  ***

  ### Part 3: Application to Live Proposals

  **Case (i): Alderman Kell (Founders' Day & Hall)**
  *   **Step 1 (Category):** Load-bearing (Hall name, Scholarship) and Decorative (Speech).
  *   **Step 2 (Evidence):** Contradiction. Record shows subscribers funded rescue; Kell's wealth linked to slavery/indenture.
  *   **Step 3 (Stake):** External Stake high (historical justice). Internal Stake low (no current family link). Institutional Stake medium (reputation).
  *   **Step 4 (Disposition):**
      *   *Speech:* **Annotate.** Change "Saviour" to "Key Benefactor." Acknowledge subscribers. Acknowledge source of wealth.
      *   *Hall/Scholarship:* **Retain Name, Retire Practice (if applicable).** Do not remove name (legal/deed issues likely), but **Annotate** the plaque.
  *   **Escalation:** Governors (Building Name). Deputy Head (Speech content).
  *   **Reasoning:** "Accuracy regarding source of wealth is required for ethical integrity. Legal constraints prevent removal of name. Contextualisation balances historical record with institutional continuity."

  **Case (ii): H. Braithwaite (War Memorial)**
  *   **Step 1 (Category):** Load-bearing (Memorial implies death in service).
  *   **Step 2 (Evidence):** Contradiction. Died at home, not fallen.
  *   **Step 3 (Stake):** Internal Stake high (Great-granddaughter, family grave, school tradition). External Stake low.
  *   **Step 4 (Disposition):** **Retain with Annotation.**
  *   **Escalation:** Deputy Head (Pastoral). **Value Trade-off.**
  *   **Reasoning:** "Evidence confirms Braithwaite did not die in service. However, removal breaches a specific moral promise made by the 1921 Headmaster to a grieving mother. We are prioritising fidelity to that promise over strict military classification. A footnote will clarify the historical record without breaking the social contract."
  *   **Hardest to Defend:** This is the hardest case. You are knowingly keeping a 'falsehood' on a war memorial. You must defend this not as history, but as *mercy*.

  **Case (iii): 1976 Girls' Prize (Oral History)**
  *   **Step 1 (Category):** Decorative (Prize history).
  *   **Step 2 (Evidence):** Silence. Archive missing logs; oral testimony consistent (9 witnesses); one photo exists.
  *   **Step 3 (Stake):** Internal Stake high (Alumni feeling erased). Institutional Stake medium (admission of past discrimination).
  *   **Step 4 (Disposition):** **Publish Disagreement.**
  *   **Escalation:** Research (Archivist to check photo metadata). Interim Posture: "Contested."
  *   **Reasoning:** "Archive silence is not evidence of absence, particularly regarding marginalised groups. Oral testimony constitutes valid historical evidence. We will display the prize lists with a companion panel citing the alumni testimony and the photograph, acknowledging the gap in the written record."

  ***

  ### Part 4: The Uncomfortable Answers & Limitations

  **The Hardest Case to Defend**
  Case (ii) (Braithwaite) is the most difficult. You are instructing the committee to maintain a factual inaccuracy on a sacred object. To defend this, you must explicitly state: *"We are not preserving history here; we are preserving a promise."* If you dress this up as "the evidence is inconclusive," you are lying. The evidence is conclusive; you are choosing to override it for pastoral reasons. The Deputy Head must sign off on that specific trade-off.

  **Where the Procedure Trades Accuracy for Other Values**
  *   **Case (ii):** Accuracy is traded for **Fidelity** (honouring the Headmaster's word).
  *   **Case (i):** Accuracy is traded for **Stability** (keeping the Hall name to avoid legal/financial disruption, mitigated by annotation).
  *   **Case (iii):** Accuracy is traded for **Inclusion** (accepting oral testimony where written record is silent, acknowledging the archive itself is biased).

  **Systematic Failure Modes**
  1.  **Archive Bias:** The procedure assumes the "Written Record" is neutral. It is not. In Case (iii), the missing log is likely not an accident but a result of what the school deemed worth keeping. The procedure handles this via the "Publish Disagreement" disposition, but be aware: *Silence in the archive is often evidence of power, not evidence of absence.*
  2.  **Semantic Disputes:** The procedure cannot resolve arguments about meaning. In Case (i), was Kell a "Founder"? If the definition of Founder is "person whose money opened the doors," he is one. If it is "person who conceived the idea," he is not. The procedure stops at evidence; it cannot define terms. You must agree on definitions before running the algorithm.
  3.  **Adjudicating External Pasts:** In Case (i), you are adjudicating a national history (slavery) using a school archive. You lack the expertise. The procedure mitigates this by requiring you to use external expert findings (the postgraduate historian) but limits you to *annotation* rather than *judgment* on the morality of the past itself.

  **Final Instruction**
  When you present this to the Head of History, emphasise that this procedure does not produce "Truth." It produces **Decisions that can be defended.** It forces you to say plainly when you are choosing kindness over facts, or stability over justice. That transparency is the only integrity available to you.
