      *   **Common-Pool Resources (CPRs):** Rival (my use reduces yours) + Non-excludable (hard to stop others). *Problem:* Overuse/Depletion (Tragedy of the Commons). *Example:* Fisheries, grazing land.
      *   **Public Goods (PGs):** Non-rival (my use doesn't reduce yours) + Non-excludable. *Problem:* Underprovision (Free-rider problem). *Example:* National defense, basic science (usually).
      *   **Hardin's Tragedy:** Specifically addresses *rivalry*. If it's not rival, Hardin's logic doesn't strictly apply to the *consumption* phase.
      *   **Ostrom's Design Principles:** Address governance of CPRs. They show that local communities *can* self-organize without privatization or state coercion, contradicting Hardin's "doom" narrative, provided certain conditions (boundaries, monitoring, sanctions, etc.) are met.
      *   **The User's "Hidden Rivalry" Argument:** The user argues that digital goods *become* rival due to attention/processing limits (congestion). Therefore, Hardin applies, and Ostrom fails at scale, leading to inevitable enclosure.

