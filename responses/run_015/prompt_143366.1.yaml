      *   *Ostrom's Scalability:* Ostrom's principles *can* apply to digital commons (e.g., Wikipedia, open-source software), though "anonymous digital environments" pose challenges for monitoring/sanctioning. However, digital identity and reputation systems often recreate "locality."
