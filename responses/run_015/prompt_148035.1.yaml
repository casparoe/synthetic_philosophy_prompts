answer: |-
  This is one of the sharpest questions in contemporary bioethics. You have identified the fault line where legal pragmatism, metaphysical uncertainty, and moral intuition collide. The asymmetry you describe—binding refusals versus advisory requests—is not an accident; it is a structural feature of how liberal democracies manage the "problem of the two selves."

  Here is an analysis of what the practice presupposes, where it strains, and how a defender of strong precedent autonomy attempts to hold the line.

  ### 1. What the Practice Strictly Presupposes vs. What Fits Comfortably

  To understand the authority of the earlier self, we must distinguish between the *legal mechanics* of the practice and the *philosophical justifications* offered for it.

  **What the Practice Strictly Presupposes (The Jurisdictional View)**
  Strictly speaking, current law and clinical guidelines do **not** presuppose that the earlier competent self and the later demented self are metaphysically identical. They do not require a theory of psychological continuity or narrative unity to function.

  What the practice strictly presupposes is **jurisdictional authority**. It operates on a procedural rule: *A competent agent has the right to set boundaries on what may be done to their body in the future, provided they followed the correct formalities.*
  *   **For Refusals:** The law treats the body as a fortress. The earlier self holds the only key. Even if the current occupant (the demented self) is happy to leave the gate open, the earlier self's lock holds. This is based on the legal principle of bodily integrity, which survives incompetence.
  *   **For Requests:** The law treats medical treatment as a collaborative service, not a commodity. The earlier self cannot compel a professional to act against their clinical judgment or allocate resources inefficiently.

  Therefore, the system does not need to claim the two selves are "the same person." It only needs to claim the earlier self had **legislative power** over the later self's medical boundaries.

  **What Fits Comfortably (The Narrative View)**
  While the law doesn't *need* metaphysical identity, it leans heavily on it for moral legitimacy. It is comfortable to assume that the life is a single narrative project (a view associated with Ronald Dworkin). This view makes it feel right to honor a refusal: we are respecting the "whole life" rather than just the "current chapter."
  *   **The Comfort:** It soothes our conscience to think we are helping *her* die with dignity, rather than killing *him* who wants to live.
  *   **The Tension:** This narrative view fits refusals well but frays on requests. If the life is one narrative, why can't the earlier author demand a specific plot twist (treatment)? The comfortable fit breaks down here, revealing that the system is not actually running on a single "narrative" principle.

  ### 2. Is One Principle Doing the Work? (The Hybrid Reality)

  You asked if the practice is running an identity-based account for refusals and a welfare-based account for requests. The answer is **yes**. This is the quiet hybrid engine of advance care planning.

  *   **Refusals = Precedent Autonomy (Identity-Adjacent):** When honoring a refusal against a contented dementia patient, the system prioritizes the *critical interests* of the earlier self (the values that defined the life) over the *experiential interests* of the later self (current happiness). It implicitly accepts that the earlier self has a veto over the later self's existence.
  *   **Requests = Best Interests/Beneficence (Welfare-Based):** When an advance directive requests treatment deemed futile or inappropriate, clinicians revert to the *current* best interests of the patient. They ask: "Is this good for the being in front of us?"

  **Where it Strains:**
  The strain is most visible in the "happy dementia" refusal case. To honor the refusal, the system must rank **critical interests** (integrity, dignity, avoidance of dependency) above **experiential interests** (pleasure, absence of pain).
  *   **The Unacknowledged Cost:** The practice rarely admits that it is sacrificing the well-being of a sentient being (the later self) to satisfy the values of a non-existent agent (the earlier self). Rebecca Dresser, a prominent critic of this model, argues this is a form of tyranny by the past. The system strains because it tries to hide this sacrifice behind the language of "respecting the patient," when in fact it is respecting a *ghost* at the expense of the *resident*.

  ### 3. The "Continuity Clause" Thought Experiment

  If hospitals offered a "Continuity Clause" (Box 1: Instructions Govern Regardless of Change; Box 2: Instructions Lapse if Self Changes), it would force the metaphysical cards onto the table.

  **What should a hospital do with each box?**
  *   **Box 1 (Standard):** This is the current default. The hospital treats the directive as binding.
  *   **Box 2 (The Lapse Clause):** If a patient ticks this, they are effectively saying, "I only trust my future self if they remain psychologically continuous with me."
      *   **Coherence:** A system *can* coherently accept Box 2. In fact, many ethicists argue this *should* be the default. It treats the advance directive as a conditional contract based on psychological continuity.
      *   **The Consequence:** Accepting Box 2 concedes that the authority of the earlier self is not absolute; it is contingent on the survival of the "person" who wrote it.

  **Does accepting Box 2 undermine Box 1?**
  Yes. It reveals that Box 1 is not a metaphysical necessity but a **policy choice**.
  *   If Box 2 is valid, it proves that the binding nature of Box 1 is not because "she is the same person," but because "the state has decided to empower the earlier self by default."
  *   It shifts the framework from **Identity** (I am obeying *her*) to **Policy** (We are obeying the *rule* that earlier selves govern).
  *   **Hospital Action:** If a patient ticks Box 2 and then develops dementia but seems content, the hospital should treat the directive as lapsed. Decision-making should revert to a surrogate using a "best interests" standard focused on the current self's experiential welfare. This would be a radical shift from current practice, which assumes Box 1 unless revoked.

  ### 4. The Defense of Strong Precedent Autonomy (Explaining the Asymmetry)

  You asked for the view of a defender of strong precedent autonomy who refuses to retreat from the asymmetry. How do they justify binding refusals but non-binding requests without conceding the identity problem?

  A sophisticated defender (channeling Dworkin or strong libertarians) would argue the asymmetry is not about *identity*, but about the **logic of rights**.

  **The Argument:**
  1.  **Autonomy is a Shield, Not a Sword:** The right to autonomy is fundamentally a negative right (non-interference). It is the right to say "no" to intrusion. It is not a positive right to command resources or compel action.
  2.  **The Integrity of the Life:** A human life has a narrative structure. The "ending" of the life matters to its overall meaning. The earlier self is the only one capable of judging what kind of ending preserves the integrity of that narrative.
      *   *Refusal:* Allowing treatment when the earlier self forbade it **desecrates the life story**. It turns the patient into a vessel of biology against their will. This is a harm to the *person* (the narrative entity), even if the *organism* is happy.
      *   *Request:* Denying a requested treatment does not desecrate the life story in the same way. It merely fails to extend it. Furthermore, a request for treatment often relies on clinical premises (e.g., "this will restore me to competence") that may no longer be true. The earlier self cannot bind the clinician to a medical falsehood.
  3.  **The "Happy Demented" Rebuttal:** To the claim that the current self is happy, the defender says: "Happiness is not the only good." A life lived in a state the earlier self deemed undignified is a *bad life*, even if it feels good. We do not let children eat only candy because it makes them happy; we do not let the demented self override the competent self's judgment on dignity because it makes them content.

  **Why this doesn't solve the metaphysical problem:**
  This defense works legally and morally for many, but it still relies on the assumption that the *narrative life* is the entity that matters more than the *sentient organism*. It implicitly accepts that the "person" died when the dementia advanced, but the "rights" of that dead person survive to govern the organism.

  ### Summary for Your Piece

  If you are looking for the lede, here is the synthesis:

  The medical-legal system does not actually believe the earlier and later selves are the same person. If it did, it would have to honor the later self's current wishes as the current expression of that same person. Instead, the system treats the earlier self as a **legislator** and the later self as a **constituent**.

  The asymmetry exists because the legislature (earlier self) has the power to veto laws (treatments) but cannot compel the executive branch (clinicians) to enact policies (requests) they deem unworkable.

  The "Continuity Clause" experiment reveals the secret: we currently default to the Legislator's power because we fear the alternative (letting the Constituent decide) looks like abandonment. But admitting that the Legislator's power is optional (Box 2) would admit that our current reverence for the "living will" is not about respecting *who the patient is*, but about respecting *who we used to be*.

  **The strict presupposition:** The earlier self has jurisdiction over bodily boundaries.
  **The comfortable fit:** The earlier and later selves are one continuous narrative.
  **The strain:** We sacrifice the current self's happiness to protect the past self's dignity, without admitting we are doing so.
  **The asymmetry defense:** Autonomy is the right to protect your life's story from violation, not the right to command its extension.
