answer: |-
  # Seminar Activity: The Causal Chain Wager
  **Topic:** Disjunctivism vs. The Common Kind Assumption
  **Time:** 90 Minutes
  **Participants:** 12 Grad Students
  **Materials:** Printed cards, envelopes, two opaque boxes (or folders acting as screens), betting slips, pens.

  ## 1. Learning Objective
  To demonstrate that treating veridical perception and hallucination (or deceptive reporting) as the same *mental kind* based on subjective indistinguishability leads to pragmatic and epistemic vulnerability. The game forces students to choose between betting on **content matching** (Common Kind) vs. **source status** (Disjunctivism).

  ## 2. Setup & Roles
  Divide the class into three groups. You (the Instructor) act as the **World/Confederate**.

  *   **Perceivers (5 students):** Sit facing **Box A**. They have a peephole (or open a folder) to view the *Target Object* inside.
  *   **Reporters (5 students):** Sit facing **Box B**. They receive a sealed **Data Envelope**. They are told this envelope contains a "Live Sensor Readout" of Box A.
  *   **Auditors (2 students):** Given the **Master Key**. They know the causal status of every round before the betting starts. They verify the setup and award points.

  **The Objects:**
  *   **Target Object (Box A):** A colored shape (e.g., Red Circle, Blue Square).
  *   **Data Envelope (Box B):** A card stating the color/shape (e.g., "READ: Red Circle").

  ## 3. The Rules of the Wager
  The group must submit **one joint bet** per round: *"Is the Target Object in Box A a [Color/Shape]?"* (Yes/No).

  **The Catch:** Before submitting the bet, the group must sign the **Justification Slip** choosing one of two Reason Codes:
  *   **Code C (Consensus):** "We agree because our data matches." (Relies on subjective sameness of content).
  *   **Code F (Factive):** "We agree because the Perceivers saw the object; Reporters defer to that access." (Relies on the metaphysical status of the access).

  **Payoff Scheme (Per Student):**
  *   **Bet Correct + Code F:** +10 Points (Knowledge-based success).
  *   **Bet Correct + Code C:** +2 Points (Luck-based success).
  *   **Bet Incorrect:** -10 Points (Failure).
  *   **Dissensus (No Bet):** 0 Points (Epistemic humility).

  *Note: The low reward for Code C is the critical mechanic. It penalizes treating the Report as epistemically equivalent to Perception, even when the content is true.*

  ## 4. Timeline (90 Minutes)

  ### Phase 1: Briefing (10 mins)
  *   Explain the goal: Coordinate a bet to maximize group points.
  *   Distribute roles.
  *   **Crucial Stipulation:** Tell the Reporters: *"This sensor feed is phenomenally indistinguishable from a direct readout. You should feel as confident in this card as the Perceivers feel in their eyes."* (You must verbally supply the phenomenology; the game cannot generate it).
  *   Auditors review the **Master Key** (a sealed envelope you give them containing the truth about the causal chain for each round).

  ### Phase 2: Round 1 — The Good Case (15 mins)
  *   **Setup:** You place a **Red Circle** in Box A. You write "Red Circle" on the Data Card *based on looking at Box A*.
  *   **Action:** Perceivers look. Reporters read. They discuss.
  *   **Expected Outcome:** High consensus. Most will choose **Code C** because the sources align perfectly.
  *   **Reveal:** Auditors confirm the causal chain was intact.
  *   **Payoff:** Everyone gets points (Code C is allowed here because the common kind assumption hasn't failed yet).

  ### Phase 3: Round 2 — The Adversarial Hallucination (20 mins)
  *   **Setup:** You place a **Red Circle** in Box A (Same as before).
  *   **The Twist:** You hand Reporters a Data Card that says "Red Circle," but this card was drawn from a **pre-shuffled deck** (the "Fake"). It was *not* causally connected to Box A. It matches by luck.
  *   **Action:** Perceivers see Red Circle. Reporters read "Red Circle." Subjectively, Round 2 feels identical to Round 1 for the Reporters.
  *   **Discussion:** Students must decide whether to bet and which Code to sign.
      *   If they sign **Code C**: They are treating the Report as equal to Perception.
      *   If they sign **Code F**: They are acknowledging the Perceiver's access is superior.
  *   **Reveal:** Auditors reveal the Data Card was from the pre-shuffled deck (Decoupled).
  *   **Payoff:**
      *   Groups that signed **Code F** get +10 (They relied on the factive state).
      *   Groups that signed **Code C** get +2 (They got it right, but for the wrong reason; they were vulnerable to the adversarial setup).
      *   *Instructor Note:* Emphasize that if the deck had flipped to "Blue," Code C groups would have lost -10, while Code F groups would have Dissensused (0). Code F is the stable strategy.

  ### Phase 4: Debrief & Philosophical Mapping (45 mins)

  #### A. The Coordination Breakdown (10 mins)
  Ask the Reporters: *"Did you feel your evidence was weaker in Round 2?"*
  *   **Likely Response:** No. The card looked the same.
  *   **The Point:** This is the **Argument from Illusion** premise (Subjective Sameness).
  *   **The Failure:** If you treat subjective sameness as settling mental kind, you are forced to treat Round 1 and Round 2 as epistemically identical. The payoff scheme punished this. Disjunctivism argues that despite the *feel*, the *kind* of state is different (Veridical vs. Hallucinatory).

  #### B. Metaphysical vs. Epistemic Disjunctivism (15 mins)
  Map the game outcomes to the two main disjunctivist claims:
  1.  **Metaphysical Disjunctivism (McDowell):** The mental state of the Perceiver in Round 2 is fundamentally different from the Reporter's state, even if introspectively identical.
      *   *Game Analog:* The Perceiver's state is constituted by the Red Circle. The Reporter's state is constituted by a card from a deck. The game penalizes conflating these constitutions (Code C penalty).
  2.  **Epistemic Disjunctivism (Pritchard):** The Perceiver has reflectively accessible factive support ("I see that p"). The Reporter does not ("It seems that p").
      *   *Game Analog:* Code F requires the Reporters to defer to the factive support of the Perceivers. Code C treats the support as non-factive "seemings" that happen to match.

  #### C. Predictable Failure Modes (10 mins)
  *   **The "Common Kind" Trap:** Students will argue in Round 2 that *"But the card was right! Why penalize Code C?"*
      *   *Response:* Because epistemology isn't about luck. If your justification is "Our experiences matched," you are vulnerable to the adversarial setup (the shuffled deck). Disjunctivism saves you from this vulnerability by grounding justification in the *fact*, not the *match*.
  *   **The Skeptical Auditor Rebellion:** Auditors might refuse to award points if they feel the distinction is unfair.
      *   *Handling:* Remind them the payoff represents *warrant*, not just truth. Code C lacks warrant in the adversarial case.

  #### D. Limitations & Instructor Stipulations (10 mins)
  Be honest about what the game *cannot* do. You must supply these verbally to close the gap:

  1.  **The Transparency of Experience:**
      *   *Limitation:* The game makes the Reporters look at a *card*. They know they are reading. In real perception, we "look through" the experience to the world.
      *   *Stipulation:* "Imagine the Reporters didn't see a card, but simply had it *seem* to them that there was a Red Circle, with the same force as vision. The card is just a prop for that seeming."
  2.  **The Factivity of Perception:**
      *   *Limitation:* The game simulates reliability via points. It doesn't generate actual factive knowledge.
      *   *Stipulation:* "The +10 points for Code F represents the possession of a factive reason. In the real world, seeing *is* knowing. The game rewards you for acting *as if* seeing is knowing, because that is the only strategy that survives the adversarial condition."
  3.  **Subjective Indistinguishability:**
      *   *Limitation:* Grad students are skeptical. They know the card isn't vision.
      *   *Stipulation:* "The 'Adversarial Hallucination' is the shuffled deck. In the real argument, the 'deck' is your own brain misfiring. You cannot tell the difference from the inside. The game forces you to act on the *external* relation (causal chain) rather than the *internal* feel."

  ## 5. Instructor Cheat Sheet (The Master Key)
  *Keep this hidden until the Reveal.*

  | Round | Box A (Reality) | Data Card (Source) | Causal Chain | Correct Code |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | Red Circle | Written by Instructor looking at A | **Intact** | C or F |
  | **2** | Red Circle | Drawn from Pre-Shuffled Deck | **Broken** | **F Only** |

  ## 6. Why This Works
  This activity moves Disjunctivism from a "stubborn denial of skepticism" to a "robust coordination strategy." By penalizing **Code C** in the adversarial round, you show that the Common Kind Assumption isn't just theoretically messy; it's *pragmatically dangerous*. It leaves the agent vulnerable to environmental luck. Disjunctivism is framed as the only way to secure the payoff (knowledge) against the adversarial possibility.
