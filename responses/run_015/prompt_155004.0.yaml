answer: |-
  **The Scenario**
  A municipal housing board must deny one of three renovation permits due to a sudden budget cap. Board Member 1 votes to deny Permit A because the applicant has prior violations. Member 2 denies Permit A because the proposed materials are substandard. Member 3 denies Permit A because the construction timeline conflicts with city events. None of the members believe the denial is based on "Neighborhood Cohesion," yet the automated permitting software categorizes all multi-vote denials under Statute 12: "Preservation of Neighborhood Cohesion." To finalize the denial and avoid personal liability for procedural errors, the members sign off on the generated report without altering the statutory classification. The permit is denied officially for Cohesion, though no agent acted for that reason, nor does any current official endorse Cohesion as a valid ground for denial.

  **The Realist Explanation**
  A realist about free-floating rationales argues that the decision was genuinely made for the reason of "Preserving Neighborhood Cohesion." On this view, reasons can inhabit institutional structures independently of individual psyches. The statute and the software create a normative channel that dictates what counts as a valid justification for the outcome. Even though the members were motivated by violations or materials, the *action itself*—the official denial—belongs to the institution, not the individuals. The institution "holds" the reason via its operational rules. The reason exists as a functional component of the social reality that caused the permit to be rejected, regardless of whether any human mind currently entertains it as a belief or desire.

  **The Anti-Realist Explanation**
  An anti-realist argues that there are no ghostly reasons hovering in the software. The only real reasons are the psychological states of the three members (concern about violations, materials, timeline) and their shared desire to avoid liability. The "Neighborhood Cohesion" label is merely a post-hoc description or a bureaucratic costume required to process the paperwork. The action was caused by human attitudes; the statutory classification is just noise. If you asked why the permit was *actually* denied, the truth lies in the members' private motivations, not the public record. The "reason" is not a causal force but a linguistic artifact generated to satisfy a procedural constraint.

  **The Structural Feature**
  The crucial feature forcing the realist's hand is the **mandatory decoupling of motive from attribution**. The system requires a specific official justification (Cohesion) to validate an action, even when the agents' actual motivations (Violations, Materials, Timeline) differ from that justification and when no agent endorses the justification. The outcome cannot be legally finalized without this specific rationale being instantiated, making it look like the rationale itself did the work.

  **Stripping the Feature**
  If you strip out the mandatory software mapping—allowing the members to file the denial under "Prior Violations" or "Substandard Materials"—the case collapses into a standard agent-based explanation. The action would then be directly traceable to the specific attitudes of the individuals involved. The "free-floating" reason disappears because there is no longer a structural requirement to generate a rationale that no one holds. The realist loses their foothold because the reason becomes identical to the agents' motives.

  **The Anti-Realist Attack**
  The anti-realist would attack this as a stacked deck that confuses *rationalization* with *reason*. They would argue the scenario merely shows that institutions can force people to *lie* or *speak falsely* about their reasons, not that false reasons become real simply because they are written down. By defining the "action" as the official output rather than the human behavior, the realist begs the question. The anti-realist insists that if no one's mind was guided by "Cohesion," then "Cohesion" played no causal role. Calling it a reason is just a category error—mistaking the label on the box for the contents inside.
