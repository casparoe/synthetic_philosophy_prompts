answer: |-
  **WELCOME TO THE HILBERT GRAND**

  **Arrival and Room Numbering**
  Management regrets to inform you that the No Vacancy sign is lit and true. Every room is occupied. However, for your comfort and safety, the desk clerk's standing instruction is that the guest in room $n$ is asked to move to room $2n$. This frees the odd-numbered rooms for your party. You will observe that the hotel has exactly as many rooms as it has odd-numbered rooms. Please note that an establishment which forbade rehousing its guests in a proper part of itself would be a fundamentally different sort of establishment.

  **Group Bookings**
  A single coach with countably many passengers is no trouble; they simply occupy the freed odd rooms. Should countably many such coaches arrive on the same night, the concierge will be delighted to assign guest $k$ on coach $j$ to room $2^j 3^k$. Since every number has a unique prime factorization, no two guests will collide. However, a delegation whose members carry name-badges labelled by the real numbers between 0 and 1 cannot be housed at all. The manager's explanation is an honest one: however we list the assigned rooms, there remains a guest whose badge differs from the $n$th listed guest in the $n$th decimal place. We cannot write a list that includes everyone.

  **Dining**
  Our room-service menu includes a master list of every possible order, defined by infinite binary choices. Should you ask for the meal that differs from the $n$th meal on the list in the $n$th respect, the kitchen both can describe and cannot prepare your order. It exists in principle but appears on no printed menu.

  **The Ordinal Wing**
  In our new Ordinal Wing, rooms are labelled by ordinals that admit a finite notation, so that there are still only countably many of them and the wing too is always full. However, the lift only moves one successor step at a time, so that no guest ever arrives at a room with no immediate predecessor. During the mandatory fire drill, each guest proceeds to the room whose number is the immediate predecessor of their own. This procedure leaves the occupants of exactly those rooms without predecessors standing in the corridor. Management accepts no liability for guests stranded at limit positions.

  **Cloakroom and Lounge**
  In the residents' lounge, the attendant takes in two coats and hands back the lowest-numbered one at the half hour, the quarter hour, and so on. At ten o'clock, the cloakroom is empty although it had been getting fuller at every earlier moment. Similarly, regarding the lamp switched at each interval: nobody can say whether the lamp is on or off at ten.

  ***

  **SIDEBAR: A NOTE FROM THE NIGHT AUDITOR**
  *Regarding the Society for Strictly Finite Accommodation picketing outside:*
  "Our placards read 'No Completed Totalities' and 'Finite Steps Only.' These slogans our position actually licenses. I do not deny that for any finite number of guests you care to bring me, I can find rooms. I deny only that 'all rooms' constitutes a finished object I can hold. You speak of the infinite as a place you have visited; I speak only of the journey that never ends. If you can name a number, I can count past it. If you claim to have counted them all, I must ask: what is the next one?"

  ***

  **Footnote:** *Certain concierge services regarding uncountable selections may rely on the Axiom of Choice. If this offends your sensibilities, please inform the front desk, though management cannot guarantee alternative arrangements.*
