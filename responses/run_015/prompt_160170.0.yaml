answer: |-
  **The Principle: The Sovereignty-Competence Test**

  Deference is warranted if and only if the judgment falls into one of two domains:
  1.  **Epistemic Competence:** The claim rests on causal evidence, technical expertise, or local knowledge inaccessible to you (e.g., mechanics, medicine, empirical harm).
  2.  **Voluntary Coordination:** The claim enforces norms within a practice you have voluntarily joined and endorse (e.g., labor solidarity, shared projects).

  Deference is unwarranted when the claim dictates **Constitutive Sovereignty**: decisions regarding your ultimate ends, moral identity, or life structure, absent a shared normative framework you actively uphold.

  This is a two-factor test. Factor 1 (Competence) justifies Cases 1, 6, and your baselines. Factor 2 (Coordination) justifies Case 7 *only if* you endorse the solidarity norms. Factor 3 (Sovereignty) explains resistance in Cases 4, 5, 8, and 9a. Your discomfort arises when Sovereignty claims mask themselves as Competence, or when Coordination is mistaken for passive conformity.

  **Overturned Verdicts**

  I overturn two of your gut verdicts.

  **Case 7 (Picket Line): Acceptance → Resistance.**
  You state you have "not endorsed the claims about solidarity." This fails Factor 2. Coordination requires voluntary submission to a shared norm. If you comply without endorsing the norm, you are not deferring to authority; you are conforming to pressure. This erodes Sovereignty. You should feel the same discomfort as in Case 8 (Uncle), unless you explicitly adopt the union's framework as your own. The "fine" feeling is sociological smoothness, not principled deference.

  **Case 5 (Bednets): Strong Resistance → Moderate Acceptance.**
  You note the reasoning is "cleaner" and "more tractable" than Case 4. This signals Epistemic Competence (Factor 1). The calculation of lives saved per dollar is empirical. Your resistance stems from the word "obligatory," which triggers Sovereignty alarms. However, if you accept the premise that saving lives is good, the *amount* required is a technical calculation, not a value judgment. Steelmanning Case 4: Risk tolerance is deeply constitutive of identity; no expert can calculate "correct" risk for your life. Steelmanning Case 5: Once the moral goal is set, the means are empirical. Your stronger resistance to 5 is inconsistent; it treats a tractable empirical claim as a sovereign violation. You should defer on the *calculation*, even if you negotiate the *obligation*.

  **Undecided Cases**

  **(i) AI Assistant (Text Ex): No Deference.**
  Fails Factor 1 (AI has no experience) and Factor 3 (personal relationship is sovereign). AI supplies reasons, satisfying your condition (B), but lacks the agency to hold authority over human intimacy. Your gut is correct.

  **(ii) Forum Aggregate (AI Job): Defer on Data, Not Decision.**
  Aggregate opinion reduces epistemic risk (Factor 1), making the *risk assessment* reliable. However, the decision implicates Sovereignty (career identity, moral stance on acceleration). Defer to the crowd on the probability of outcomes; retain Sovereignty on whether those outcomes are acceptable. Deferring on the binary choice violates Factor 3.

  **(iii) Moral Mentor (Forgive Father): No Deference on Act.**
  Moral expertise exists (virtue ethics), but it is advisory, not authoritative. A morally superior person can clarify your values (Factor 1), but cannot choose them for you (Factor 3). Deference here creates epistemic learned helplessness. Accept the framing, reject the command.

  **Habits vs. Acts**

  Your principle must govern habits, not just single acts. A single act of Sovereignty-deference is a mistake; a habit is atrophy. Your worry about "learned helplessness" is valid. The Sovereignty-Competence Test permits single acts of deference in Competence domains without loss of capacity. However, habitual deference in Sovereignty domains degrades the muscle required for judgment. You need a meta-rule: *Maximize Competence deference to preserve Sovereignty capacity.* Use experts to clear the underbrush so you can focus on the values.

  **Where This Account Falls Silent**

  1.  **The Boundary of Practice:** The test relies on distinguishing "voluntary coordination" from "external imposition." Case 7 fails this because your membership in "society" or "labor solidarity" is ambiguous. Are you a voluntary member of the class of workers? If yes, Factor 2 applies. If no, it fails. The principle cannot adjudicate the voluntariness of social membership without further sociological input.
  2.  **Moral Premises:** The test assumes you know when you share a moral premise (Case 5). If you are unsure whether "saving lives is obligatory" is a shared premise or a sovereign imposition, the test stalls. It requires introspection it does not provide.
  3.  **Conflicting Experts:** When Competence authorities disagree (e.g., two doctors, two economists), the test offers no tie-breaker. It tells you *when* to defer, not *whom*.

  **Summary**

  Your unevenness is principled, not squeamish. You resist when Sovereignty is implicated without shared practice. You accept when Competence is clear. Your errors lie in misclassifying Coordination as passive compliance (Case 7) and Empirical Calculation as Moral Command (Case 5). Correct these, and the residue disappears.
