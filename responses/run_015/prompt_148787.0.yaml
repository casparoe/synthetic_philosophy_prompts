  2. When an autonomous agent prefers a life of meaningful struggle over anhedonic satisfaction, Tranquilism must deny the validity of that preference to maintain its axiology. This implies that rational choice is irrelevant to value, or it must admit that fulfilling preferences carries weight beyond merely extinguishing them.
  3. If two subjects reach anhedonic satisfaction, one through overcoming great trauma and one naturally, Tranquilism must claim their states are equally valuable despite the differing histories. To argue otherwise would require admitting that the narrative arc of a life contributes intrinsic value beyond the current absence of craving.
  4. Tranquilism asserts that adding pleasure to anhedonic satisfaction does not increase value, rendering the distinction between a joyful life and a numb one morally irrelevant. This forces the view to deny the intuitive goodness of positive affect or surreptitiously rely on a hidden premise that pleasure is merely a neutral buffer against suffering.
  5. Since the subject lacks craving, they possess no internal drive to preserve their anhedonic satisfaction, suggesting the state lacks instrumental value to the experiencer. Tranquilism must therefore posit that value exists independently of the subject's care for it, or admit that valuing a state requires some form of positive affective stance.
