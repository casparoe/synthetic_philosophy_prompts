answer: |-
  Here is the translation and residue report, drafted for a protocol review context.

  ### Part 1: Translations into Protocol Vocabulary

  #### 1. Classical Kant (Indirect Duties)
  **The Core Claim:** Animals are "things" (means), not "persons" (ends). They lack rational autonomy. Therefore, they cannot be owed duties directly.
  **Translation to Protocol Form:**

  *   **Refinement:** This is reclassified as **Personnel Training and Professional Conduct**. Refinement is not primarily about reducing the animal's pain score; it is about reducing the *moral risk to the staff*. We refine procedures not because the animal has a right to comfort, but because performing rough procedures degrades the technician's moral character.
  *   **Severity Banding:** This becomes **Risk of Moral Desensitization**. A "Severe" protocol is not severe because the animal suffers intensely, but because the act required to induce that suffering poses a high probability of brutalizing the human agent. A "Non-Recovery" procedure is preferable not because the animal avoids post-op pain, but because it limits the duration of the staff's engagement in instrumentalizing a living being.
  *   **Harm–Benefit Analysis:** The "Harm" column does not contain "Animal Pain." It contains **"Potential Degradation of Human Sympathetic Capacity."** The "Benefit" column remains "Human/Animal Health Knowledge." The ledger balances the risk of corrupting the research team against the value of the data.
  *   **Cost to the Animal:** This unit is **deleted from the ledger**. The animal's welfare state is a physical fact, like the temperature of the room, but it carries no moral weight. It is only relevant insofar as it acts as the stimulus that might trigger moral damage in the human observer/agent.

  #### 2. Modern Kantian Repair (Direct Duties via Sentience/Good-of-Own)
  **The Core Claim:** (e.g., Korsgaard, Wood) To value our own humanity, we must value the natural capacities that ground it. Sentience is a "natural end." Creatures for whom things can be good or bad possess a "good of their own" that demands respect. We cannot treat them as *mere* means.
  **Translation to Protocol Form:**

  *   **Moral Standing:** **Sentience is the Ledger Entry.** You are correct that this moves the needle toward your existing view. However, it is not purely consequentialist.
  *   **Harm–Benefit Analysis:** The "Harm" column is **"Violation of the Animal's Status as an End-in-Itself."** This is distinct from your "Cost to the Animal." Your cost is aggregatable (more pain = more cost). The Kantian harm is a *constraint*. Certain harms might be strictly prohibited regardless of the benefit (Rights-based), whereas your model allows high benefit to outweigh high cost (Utilitarian-leaning).
  *   **Refinement:** This becomes **Respect for Telos**. It is not just minimizing pain scores; it is ensuring the animal's life retains enough integrity that it is not reduced to a mere biological machine.
  *   **The Collapse:** You suspected this collapses into "sentience is where the ledger starts." You are 90% right. The difference is that the Modern Kantian insists on *side-constraints* (things you simply cannot do, even for great benefit), whereas your "cost/benefit" vocabulary implies everything is tradable if the benefit is high enough.

  ***

  ### Part 2: Residue Report (Case Studies)

  Here is the divergence analysis. I have evaluated whether the friction arises from a hole in your vocabulary (Vet/Welfare) or a hole in the Kantian claim (Philosophy).

  #### Case (a): The 3am Suffering (Unobserved)
  *   **Scenario:** Automated monitoring, animal suffers significantly at 3am, no human witness, no character shaping.
  *   **Vet Ledger:** Cost is real and undiminished. Welfare state went badly.
  *   **Classical Kant:** **No Moral Wrong.** If no human agent is involved, witness, or shaped by the act, the "indirect duty" is not triggered. The animal's pain is a physical event, like a tree falling in the woods, but not a moral event.
  *   **Modern Kant:** **Moral Wrong.** The animal's "good" was violated regardless of observation.
  *   **Residue:** This is a **Hole in Classical Kant's Claim**. Your vocabulary captures the moral intuition (suffering matters even if unobserved) better than Classical Kant. Classical Kant requires a human witness to generate moral value, which contradicts the operational reality of lab animal welfare.
  *   **Operationalization:** You do not need to fix your vocabulary. The Classical Kantian position is incompatible with unobserved welfare monitoring.

  #### Case (b): The Resilient Technician
  *   **Scenario:** Technician performs 100 gavages, remains decent to colleagues, shows zero measurable blunting.
  *   **Vet Ledger:** Procedure has cost (animal pain/restraint).
  *   **Classical Kant:** **Still Wrong.** This is the hard deontological pill. Kant argues the duty is *a priori*. It is not an empirical claim about whether the technician *actually* hardens; it is that the *maxim* of the action (treating a sentient being as a tool) is contrary to duty. The "damage to humanity" is dispositional, not necessarily empirical.
  *   **Residue:** This is a **Hole in Operationalization (Kant's Problem)**. You cannot write this into a protocol form. How do you review "violation of a priori duty" vs. "measurable welfare cost"? Your vocabulary requires measurable outcomes (corticosteroids, behavior, weight). Kant requires metaphysical alignment.
  *   **Verdict:** You cannot operationalize "damage to humanity in one's own person" because it is not a clinical variable. It is a philosophical assertion. If the technician shows no blunting, your form says "Refinement Adequate." Kant says "Duty Violated." The gap is unbridgeable in a regulatory setting without smuggling in welfare metrics.

  #### Case (c): Cumulative Severity (Low-Grade, Lifetime)
  *   **Scenario:** Chronic low-grade distress, no human notices, no corruption of staff.
  *   **Vet Ledger:** Real cost (Five Domains: mental state impaired over lifetime).
  *   **Classical Kant:** **Why Care?** If it corrupts no one and serves a valid human end, Classical Kant has no lever to object. The animal is a resource; wear and tear on the resource is only relevant if it affects the data or the human user's attitude.
  *   **Modern Kant:** **Care.** Because it disrespects the creature's "good of its own."
  *   **Residue:** **Hole in Classical Kant's Claim.** To care about cumulative severity, the Classical Kantian must quietly borrow *your* framework (that the animal's state matters intrinsically). If they admit that, they have abandoned the "Indirect Duty" position.
  *   **Verdict:** Your vocabulary is superior here. "Cumulative Severity" is a welfare metric. Classical Kant cannot account for it without ceasing to be Classical Kant.

  #### Case (d): Replacement (In Silico vs. Animal)
  *   **Scenario:** Swapping animals for computer models.
  *   **Vet Ledger:** Replacement is good *for the animals* (removes the cost bearer).
  *   **Classical Kant:** Replacement is good *for the humans* (removes the moral risk).
  *   **The Disagreement:** If you could genetically engineer an animal that felt *no pain* and had *no welfare state* (a biological robot), your Vet ledger might still flag "Replacement" as an ideal (precautionary principle), but Classical Kant would say "Problem Solved." If the animal cannot suffer, it cannot trigger human sympathy, so using it carries no moral risk.
  *   **Residue:** **Hole in Kant's Justification.** You believe Replacement is partly about the animals. Kant believes Replacement is entirely about the humans.
  *   **Verdict:** This shows up in the **Justification Section** of the protocol.
      *   *Vet Justification:* "We are using models to avoid imposing cost on sentient beings."
      *   *Kant Justification:* "We are using models to preserve the moral integrity of the research team."
      *   If the animal *could* feel pain but we *knew* the staff wouldn't be blunted (e.g., staff are sociopaths), Kant has no reason to prefer Replacement. You do. This proves your framework captures the moral intuition (animals matter) better than Classical Kant.

  ***

  ### Final Assessment: Whose Problem is It?

  You asked: *"I have no idea how to operationalize 'damage to humanity in one's own person,' and I want to know whether that's my problem or his."*

  **It is his problem.**

  Your vocabulary (3Rs, Welfare, Cost) is designed for **measurement and mitigation**.
  Kant's Classical vocabulary (Indirect Duty, Character, Maxim) is designed for **moral judgment and duty**.

  In a regulatory environment (IACUC/Protocol Review), you are required to measure harm. Classical Kant forbids you from measuring harm *to the animal* as a moral unit. Therefore:

  1.  **Classical Kant is unworkable for protocol review.** It cannot generate the data you need (pain scores, endpoints) without contradicting its own premise (that the pain doesn't matter morally).
  2.  **Modern Kant is workable but redundant.** It translates almost perfectly into your "Sentience = Ledger" view, except it adds rigid constraints (Rights) that might conflict with your Harm-Benefit calculus (Utilitarianism).
  3.  **The "Collapse":** You are not flattening the Modern Kantian view unfairly. Once a Kantian admits that "unobserved suffering matters" (Case A) and "cumulative distress matters" (Case C), they have conceded that the animal's welfare state is the locus of moral value. At that point, the disagreement is only about *how* we count that value (aggregation vs. constraints), not *whether* we count it.

  **Recommendation for your Guidance Document:**
  Stick to your vocabulary. It is functionally isomorphic with the Modern Kantian repair (Sentience-based ethics) but operationally superior for veterinary medicine. If a committee member raises the Classical Kant argument ("It doesn't matter to the dog, only to us"), you can formally note that **unobserved welfare deficits constitute a regulatory compliance failure regardless of observer impact.** That effectively rules the Classical Kantian position out of the protocol review process without needing to win the philosophy debate.
