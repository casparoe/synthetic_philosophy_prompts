  1. Use two bags (SHORT: 20 balls, LONG: 200 balls to prevent the likelihood ratio from trivializing the debate) and distribute index cards with the instruction: "Define the set of observers you consider yourself a random sample of; this set determines the population size you are betting on," which they seal before seeing the ball draw.

  2. Implement a quadratic scoring rule for chip payouts to incentivize honest probability reporting, allow a mid-game card revision for a chip cost to test reference class stability, and require the final 15-minute allocation between catastrophe-prevention and leisure tasks to strictly match their final posterior probability assigned to the LONG bag.

  3. Assign the physicists as auditors of the coin flip to occupy their rigor, and clarify that while the ex-ante expectation is fifty-fifty, the ball number provides asymmetric likelihood evidence that justifies ex-post updating, noting that a draw >20 falsifies the SHORT hypothesis and that the game produces calibrated credences rather than positive expected value winnings.

  4. Map the sealed card to the implicit reference class assumption, the chip stake to credence in total population size, the costly card-change to the stability of that class choice, and the final time allocation to the practical implication of believing humanity is near its end.

  5. Acknowledge that the game cannot reproduce the indexical nature of the actual argument because all participants share the same evidence (the drawn ball) rather than holding private birth ranks, meaning the 'self-sampling' move is simulated by group consensus rather than individual epistemic isolation.
