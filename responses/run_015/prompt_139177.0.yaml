  # Problem Set 4: The Limits of Structure

  **Domain:** The domain consists of sequences of chimes at three pitches {Low, Mid, High} ordered by height, where transformations may alter a single chime to its immediate successor in pitch.

  **Instructions:** For each analogy problem, select the candidate that best completes the pattern.

  ***

  **Item 1 (Control)**
  Source: `Low Mid` $\rightarrow$ `Low High`
  Target: `Low Low` $\rightarrow$ ?

  (A) `Low Mid`
  (B) `Mid Low`
  (C) `Mid Mid`

  ***

  **Item 2 (Target)**
  Source: `Low Mid` $\rightarrow$ `Low High`
  Target: `Mid Low` $\rightarrow$ ?

  (A) `Mid Mid`
  (B) `High Low`
  (C) `High Mid`

  ***

  # Instructor's Commentary & Solution Key

  ### 1. Account Walkthrough

  **The Surface Account (Positional)**
  *   **Mechanism:** Tracks the *index* of the change and the *magnitude* of the change without representing concepts like "successor," "group," or "max." It relies on position-wise overlap and edit distance.
  *   **Logic:** In the Source, the string length is 2. The symbol at Index 2 changes from Mid to High (a $+1$ pitch shift). The symbol at Index 1 is unchanged.
  *   **Verdict on Item 1:** Target is length 2. Apply $+1$ shift to Index 2 (`Low` $\rightarrow$ `Mid`). Index 1 stays `Low`. Result: **`Low Mid` (A)**.
  *   **Verdict on Item 2:** Target is length 2. Apply $+1$ shift to Index 2 (`Low` $\rightarrow$ `Mid`). Index 1 stays `Mid`. Result: **`Mid Mid` (A)**.

  **The Relational Account (Structural)**
  *   **Mechanism:** Represents predicates like `Successor`, `Max`, and `Rightmost`. It seeks to preserve the *role* of the changed element rather than its coordinate.
  *   **Logic:** In the Source, the changed element (`Mid` $\rightarrow$ `High`) is the **Rightmost Maximum** (the highest pitch, and if tied, the furthest right). The rule is "Apply Successor to the Rightmost Maximum."
  *   **Verdict on Item 1:** Target is `Low Low`. The Maximum is `Low`. The Rightmost Maximum is at Index 2. Apply Successor (`Low` $\rightarrow$ `Mid`). Result: **`Low Mid` (A)**.
  *   **Verdict on Item 2:** Target is `Mid Low`. The Maximum is `Mid` (at Index 1). The Rightmost Maximum is at Index 1. Apply Successor (`Mid` $\rightarrow$ `High`). Result: **`High Low` (B)**.

  ### 2. The Feature
  **Name:** **Position-Value Decoupling**.
  In the Control item, the "Last Position" and the "Maximum Value" coincide (or are indistinguishable in effect). In the Target item, they are decoupled: the Last Position holds the Minimum Value, while the First Position holds the Maximum Value. This single feature drives the divergence between the Index-based (Surface) and Role-based (Relational) accounts.

  ### 3. Removal Test
  **Alteration:** Change the Target of Item 2 from `Mid Low` to `Low Mid` (making it identical to the Source).
  **Result:** The Maximum is now at the Last Position.
  *   Surface Account: Change Index 2 $\rightarrow$ `Low High`.
  *   Relational Account: Change Rightmost Max (Index 2) $\rightarrow$ `Low High`.
  **Collapse:** The case collapses into agreement. Both accounts return the intuitive answer. The divergence is strictly dependent on the decoupling of position and value.

  ### 4. Strongest Attack (Defense of the Relational Account)
  **The Attack:** "This case is rigged to favor cognitive laziness. The Surface answer (`Mid Mid`) preserves only the *accidental* coordinate of the edit, while the Relational answer (`High Low`) preserves the *invariant* logic of the transformation (modifying the peak). By defining 'Intuitive' as 'what naive solvers guess quickly,' you are measuring processing fluency, not reasoning quality. A student who chooses (B) has demonstrated a deeper grasp of the system's algebraic structure than one who chooses (A). Marking (A) as correct teaches students that analogy is about superficial copying, not structural mapping."

  **Evaluation:** The attack **succeeds** in exposing the tension between descriptive accuracy (what humans *do*) and normative elegance (what humans *should* do). It makes the problem set look "rigged" only if the course goal is to teach "Correct Reasoning." However, since the course goal is to teach "Concepts and Analogy" as cognitive phenomena, the attack fails to invalidate the lesson: it proves that structural elegance does not guarantee psychological primacy. The case is not rigged; it is diagnostic.

  ### 5. Answer Key & Partial Credit
  **Printed Key:**
  *   Item 1: **(A)**
  *   Item 2: **(A)**

  **Partial Credit Policy:**
  Full credit is awarded for (A) on both items.
  **Partial credit (50%)** is available for Item 2 if a student selects **(B)** and provides a written justification explicitly identifying the "Maximum Value" or "Peak" as the governing rule. No credit is given for (B) without justification, as it is indistinguishable from a guess without the structural argument. This policy validates the Relational reading as intellectually defensible while maintaining the Intuitive (Surface) answer as the consensus baseline required to challenge the "Relational Wins" slogan.

  ***

  # Constraint Compliance Check
  (i) **Control Item:** Item 1 ensures both accounts agree on the intuitive answer (`Low Mid`).
  (ii) **No Real-World Knowledge:** Uses only ordered pitches {L, M, H} and counting to 2. No orthography or wraparound.
  (iii) **Microdomain Definition:** Defined in the first sentence of the handout.
  (iv) **Single Feature:** Identified as "Position-Value Decoupling."
  (v) **Determinate Verdicts:** Both accounts have specific rules yielding single outputs for all items.

  **Note on Direction:** The requested direction (Surface=Intuitive, Relational=Counter-Intuitive) is satisfied. If I were forced to reverse it (Relational=Intuitive), I would lose the ability to challenge the students' slogan ("Relational Wins"). This design specifically targets that slogan by showing a case where Relational reasoning over-reaches.
