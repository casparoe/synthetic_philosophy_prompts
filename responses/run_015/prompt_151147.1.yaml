answer: |-
  You are absolutely mixing frameworks, but you aren't doing it carelessly. You are intuitively applying a **category-relative ontology**. You treat a "ship," a "crew," a "logbook," and a "legal entity" as different *kinds* of objects, each with its own persistence conditions.

  *   **Ships (Case 1 & 4):** You prioritize *structural-functional continuity* (the organized process of sailing).
  *   **Crews (Case 2):** You prioritize *psychological/social continuity* (shared memory and intent).
  *   **Logs (Case 3):** You prioritize *informational/narrative continuity* (the story over the paper).
  *   **Legal Entities (Case 5):** You acknowledge *normative continuity* (social agreement over physical reality).

  This is actually a sophisticated position known as **Sortal Relativism**. An object's identity conditions depend on the "sortal" (the kind of thing) you are counting it as.

  Here is how to unify this, solve your AI case, and clean up the account.

  ### 1. The Unifying Principle: Causal-Functional Continuity
  To save Cases 1–4 without making Case 5 weird, you need a principle that distinguishes *internal organization* from *external labeling*.

  **The Principle:** *An entity persists if and only if there is an unbroken causal chain maintaining its specific organizational structure.*

  *   **Case 1 (Planks):** The organizational structure (the ship's design and function) is maintained causally through gradual replacement. The museum pile lacks the causal chain of *function* (it isn't sailing), so it's a reconstruction.
  *   **Case 2 (Crew):** The crew is a *social organism*. Gradual replacement allows the "group mind" to transfer knowledge/norms causally. Instant replacement breaks the causal chain of shared intent.
  *   **Case 3 (Log):** The log is an *informational organism*. Summarizing preserves the causal chain of the narrative. Random notes break the informational causality.
  *   **Case 4 (Chimera):** Splicing the bow and stern with a different middle breaks the *structural* causal history. It's not an evolution; it's a graft. The organizational integrity is violated.
  *   **Case 5 (Legal):** This is the outlier because legal identity is **normative**, not **ontological**. It doesn't rely on physical or functional causality; it relies on administrative decree. To keep your account clean, you must categorize Case 5 as "Legal Fiction" rather than "Metaphysical Reality." It doesn't break your principle; it operates in a different domain.

  ### 2. The Verdict on the AI Backup Case
  *Scenario: Navigation AI backed up to new hull. Learned route-maps corrupted/replaced with generic ones during transfer.*

  This is a collision between **Case 1 (Hull/Body)** and **Case 3 (Log/Data)**.

  *   **The Code (The Body):** The core architecture and decision-heuristics are preserved. This suggests survival (Case 1).
  *   **The Maps (The Memory/Log):** The learned data is corrupted. This suggests identity loss (Case 3).

  **Verdict: Survival with Amnesia (The "Brain Injury" Model).**
  Because the *organizational structure* (the AI's code and self-model) remains causally continuous, the entity survives. However, because the *content* (the route-maps) constitutes its experiential history, the corruption is an injury, not a death.
  *   **If the corruption is minor:** It is the same ship with damaged charts.
  *   **If the corruption wipes the "self-model" (how it navigates/learns):** It is a new instance running on old hardware.
  *   **Your Intuition Check:** Given your ruling on Case 3 (Logbook), if the "random notes" replace the "narrative thread," the log is dead. If the generic maps replace the *unique* learned routes that define the AI's specific operational history, you should lean toward **New Ship**. If the maps are just data the AI *uses* but not who the AI *is*, it survives.
  *   **Recommendation:** Treat the AI as the **Captain** (Case 2) rather than the **Log** (Case 3). If the Captain gets amnesia, they are still the Captain. **The ship survived.**

  ### 3. The Clean Account: Which Verdict to Drop?
  If you want a single, rigid metaphysical principle (e.g., "Spatiotemporal Continuity of Function"), you have to drop or reclassify **Case 2**.

  **Why Case 2 is the weak link:**
  In Case 1, 3, and 4, you are judging the identity of the *vessel*. In Case 2, you are judging the identity of the *voyage* or the *organization*. If the "Ship" is defined by its hull and structure (as implied by Case 1 and 4), the crew is incidental cargo. If the "Ship" is defined by its agency (Case 2), then the hull is incidental.
  To be consistent with Case 1 (where the physical ship sailing is Theseus), you must treat the crew as replaceable parts. If you keep Case 2's intuition (that instant crew swap kills the ship's identity), you are conflating the *container* with the *contents*.

  **The Cost of Dropping Case 2's Intuition:**
  You must accept that a ship with a mutinied, instantly replaced crew is still the *same ship*, just under new management.

  ### 4. Prediction: The Museum-to-Sea Scenario
  *Scenario: Original planks build a non-sailing museum display. Later retrofitted with engines and sent to sea.*

  Using the **Causal-Functional Continuity** principle (and keeping Case 1's verdict that the *sailing* ship is the real one):

  1.  **Phase 1 (Ship to Museum):** When the planks are reassembled into a static display, the *functional organization* ceases. The causal chain of "being a ship" is broken. It becomes a "sculpture of a ship." (Consistent with your Case 1 verdict: the museum thing is a reconstruction).
  2.  **Phase 2 (Museum to Sea):** When engines are added and it sails, a *new* functional causal chain begins.

  **Verdict: This is a New Ship.**
  Even though it is made of 100% original matter, the *identity* of a ship is tied to its continuous history of function. By becoming a museum piece, the original ship "died." The retrofitted vessel is a **resurrection**, not a continuation. It is the *Spirit of Theseus*, not *Theseus*.

  ### Summary of the Clean Account
  1.  **Principle:** Identity requires unbroken causal-functional continuity.
  2.  **Drop:** The intuition in Case 2 that crew swap affects *ship* identity (keep it for *crew* identity only).
  3.  **Isolate:** Case 5 (Legal identity is a social construct, not metaphysics).
  4.  **AI Case:** Survived (Functional core intact, data loss is injury).
  5.  **Museum Case:** New Ship (Functional continuity was broken by static display).

  This aligns your intuitions with a **Four-Dimensionalist Process View**: Objects are events in spacetime, not static chunks of matter. If the event stops (sailing stops), the object ends.
