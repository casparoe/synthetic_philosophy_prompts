          *   The film is an allegory for Apartheid. Sometimes allegory oversimplifies theory.
          *   The Ending is ambiguous. Don't over-read it as a definitive political solution.
      *   **Conclusion:** Tie it back to the paper argument. The film doesn't just support open borders; it critiques the *conditions* under which exclusion is claimed.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "Apartheid bad." The user said treat that as background. Focus on the *political theory* of territory.
      *   *Correction:* The user asked about the "duty to rescue." I need to address the 20-year timeline. Does rescue expire? The film suggests that when rescue turns into permanent containment, it loses its moral legitimacy.
      *   *Correction:* On the ending. Is Wikus "included" in Prawn society? Not really. He's an outcast there too. This complicates the "right to associate" argument. He belongs *nowhere*. This strengthens the critique of exclusion.

  6.  **Final Polish:** Check tone. Ensure no citations. Ensure specific scenes are mentioned. Ensure the "forced reading" warning is clear. (The prompt asks for "No citations," so I will avoid naming specific philosophers like Wellman/Abizadeh even though I'm using their concepts, to stay safe with the syllabus constraint, or refer to them generically as "proponents of the association view.") *Wait, better to stick to generic descriptions of arguments since the prof doesn't want outside reading, but the user clearly knows the debate. I will describe the arguments without bibliographic references.*

  7.  **Final Review against constraints:**
