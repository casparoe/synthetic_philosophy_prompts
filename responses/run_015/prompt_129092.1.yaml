answer: |-
  This is a sharp prompt. You have correctly identified that *District 9* breaks the standard model of the immigration debate, which usually assumes a functioning state of origin and a voluntary decision to move. By making the migrants shipwrecked refugees who are then contained rather than turned away, the film shifts the terrain from "right to exclude" to "right to detain."

  Here is a reading of the film through your theoretical framework, focusing on where the film sustains the argument and where it might be doing too much heavy lifting.

  ### 1. From Exclusion to Internment: The Shipwreck Problem

  You are right to flag the "shipwreck" analogy. The strongest version of the right to exclude (the freedom of association argument) relies on the idea that saying "no" leaves the outsider in their own political sphere. It assumes a world of mutually recognizing states.

  *District 9* dismantles this by removing the "elsewhere." The Prawns cannot go home. Therefore, the human claim to exclude them cannot be a refusal of entry; it is a claim of jurisdiction over people who have nowhere else to be.

  **Where the film answers the theory:**
  The film suggests that when the "duty to rescue" extends indefinitely without a path to membership, it curdles into a right to intern. The initial arrival (20 years prior) might be justified as emergency humanitarian containment. But by the time of the film, the camp is a slum, and the proposed move to District 10 is clearly a prison camp (fenced, militarized, far from resources).

  The theoretical pivot here is that **exclusion requires an outside.** If there is no outside, you are not excluding; you are governing without consent. The film argues that a political community cannot claim a right to associate freely if the cost of that association is the permanent suspension of another group's agency. The "eviction notices" scene is crucial here. Wikus reads them cheerfully as administrative procedure. This highlights the banality of the coercion. The theory says the state needs to justify coercion to the outsider. The film shows the state *refusing to recognize the outsider as a subject of justification*. They are treated as administrative objects, not people to whom reasons are owed.

  **Where the reading is forced:**
  Be careful not to equate Prawns exactly with human refugees. The film leans heavily on their "alienness" (eating cat food, distinct biology) to make the segregation palatable to the humans in the diegesis. A theorist could argue that freedom of association allows a community to exclude beings that cannot participate in the shared social life. If the Prawns are biologically incapable of assimilation (which the film leaves ambiguous), the "right to exclude" might still hold, just on different grounds. Don't let the film convince you that biological difference *shouldn't* matter theoretically, unless you argue that the film shows the biological difference is irrelevant to moral status.

  ### 2. MNU and the Corruption of the "People"

  This is your strongest theoretical wedge. The freedom-of-association argument presumes the "associators" are a democratic *demos* deciding on their collective character.

  **Where the film answers the theory:**
  *District 9* reveals that the "will of the people" is often a mask for private interest. MNU is not the state, but it captures the state's coercive power. Wikus's father-in-law is the bureaucrat bridging the two. The removal operation is not framed as protecting South African culture or social cohesion (the usual defense of exclusion); it is framed as asset management (the weapons) and real estate development.

  If the right to exclude is derived from self-determination, it loses its normative force when the exclusion is outsourced to a profit-seeking entity. You cannot claim "we are deciding who we are" when "we" is a corporation deciding how much money it can make from your segregation. The film suggests that when border control is privatized, the "right to exclude" becomes a "right to extract."

  **The Prawn Statelessness:**
  You noted the Prawns have no government. This creates a reciprocity problem. The standard international system relies on states treating each other's citizens with certain norms because they expect the same in return. The Prawns offer no reciprocity.
  *The Film's Take:* The film shows that humans use this lack of structure not as a reason for protection, but as a reason for domination. Because there is no Prawn leader to sign a treaty, the humans treat the whole group as a single manageable herd. The film argues that statelessness should trigger *more* protection (the duty to rescue), but in practice, it triggers *less* (the right to exploit).

  ### 3. Wikus and the Instrumental View of Membership

  Your point about Wikus is vital. He does not cross a border; his body changes.

  **Where the film answers the theory:**
  Wikus proves that membership is not based on consent or shared history, but on **biological utility.** As a human, he belongs, even though he is incompetent. As a hybrid, he is hunted, not because he is dangerous, but because he is *useful* (he can fire the weapons). Once MNU realizes they can harvest his DNA, he becomes a resource. When he escapes, he becomes vermin.

  This challenges the "shared life" justification for exclusion. The humans in the film don't care about sharing a life with Wikus; they care about what his biology can do. The film argues that without a robust moral framework, the "right to exclude" is just a "right to use." When Wikus can no longer be used by humans, he is excluded. When he can be used by Prawns (to fly the ship), he is valued by them, but still not fully "one of them."

  **Where the reading is forced:**
  Wikus is a protagonist, and we are manipulated into liking him. A hardline exclusionist could argue Wikus is a special case (a citizen who lost status) and doesn't prove anything about the Prawns' initial right to enter. You need to be honest that the film relies on our empathy for Wikus to make us care about the Prawns. Without Wikus's transformation, the Prawns remain faceless victims. The film might be saying "we only care about refugees when they become us," which is a cynical take, not a normative solution.

  ### Scene Recommendations for the Paper

  **1. The Eviction Notices (Early Act II)**
  *   **Why:** This is the moment the "right to exclude" is exercised.
  *   **Analysis:** Focus on the language. It is not "deportation"; it is "relocation." Wikus treats it as customer service. This illustrates the *coercion critique*. The coercion is real (armed guards, burning shacks), but the justification is never addressed to the Prawns. It is addressed to the public (via news cameras) as a sanitation issue. This supports your argument that the "freedom of association" defense is a sham when the coerced party is not recognized as a moral interlocutor.

  **2. The Cafeteria/Weapon Testing Scene (Act III)**
  *   **Why:** This addresses the MNU/Utility argument.
  *   **Analysis:** Wikus is strapped down. He is no longer a son-in-law or a citizen; he is a mechanism. This scene demonstrates that when the "political community" is driven by extraction rather than association, membership is purely instrumental. It undermines the idea that the state is protecting a "way of life." It is protecting a supply chain.

  **3. The Ending: The Metal Rose (Final Shot)**
  *   **Why:** You asked if this is a position or ambiguous.
  *   **Analysis:** Do not read this as a happy ending. Wikus is fully transformed. He is waiting for a promise that might not be fulfilled (Christopher returning in three years). He is making a flower out of scrap metal—a distinctly human gesture in a Prawn body.
  *   **The Position:** The film suggests that **belonging is now impossible.** He cannot go back to being human, and he is not quite Prawn (he wears clothes, makes art). He is in a state of permanent limbo.
  *   **Paper Argument:** If you argue the film supports a right to stay, this ending complicates it. Wikus *stays*, but he is in the junkyard, not the house. It suggests that even if exclusion is wrong, "inclusion" might not be the solution if the social prejudice is too deep. The ending is a critique of the *consequences* of exclusion, not necessarily a blueprint for integration. It leaves the question open: Is it better to be an outcast in the wild or a prisoner in the camp? The film chooses the wild, but it's a bleak freedom.

  ### Where You Might Be Over-Reading (Honesty Check)

  1.  **The Alien Analogy:** The strongest counter-argument to your paper will be: "Prawns are aliens. We obviously have a right to exclude extraterrestrials." The film uses sci-fi to make the segregation look absurd, but a theorist can say the absurdity comes from the biology, not the politics. You need to argue that the biological difference is a stand-in for cultural/racial difference, not a literal barrier to association. If you treat them as literal aliens, the "open borders" argument collapses. You must treat them as *political* refugees who happen to look like bugs.
  2.  **The "Three Years" Promise:** Don't build too much on Christopher's promise to return. It's a plot device to give Wikus hope. Politically, it doesn't solve the status of the Prawns left behind. If you argue the ending shows a path to resolution, you are ignoring the thousands of Prawns still in District 10. The ending is personal (Wikus), not structural (the camp).
  3.  **MNU vs. State:** Don't conflate MNU with the State too much. The Nigerian gangs are also a factor. The film shows a failed state where multiple coercive powers compete. The "right to exclude" usually assumes a sovereign monopoly on violence. *District 9* shows a vacuum. Your argument should be that in the absence of a functioning sovereign commitment to rights, the "right to exclude" becomes warlordism.

  ### Summary of the Argument Path

  1.  **Thesis:** *District 9* demonstrates that the "freedom of association" defense of border control fails when the excluded population has no alternative destination (the shipwreck problem). In this context, exclusion functions as indefinite internment, which requires a higher justificatory burden than mere refusal of entry.
  2.  **Support:** The involvement of MNU shows that when exclusion is privatized, the "self-determination" argument is a cover for extraction. The community isn't choosing; the shareholders are profiting.
  3.  **Complication:** Wikus's arc shows that membership is often instrumental. The film doesn't necessarily argue for "open borders" as a positive policy, but rather exposes the violence of "closed borders" when they are enforced without reciprocity or hope of resolution.
  4.  **Conclusion:** The ending is not a resolution but a testament to the permanence of the damage. Wikus survives, but he belongs nowhere. The film argues that the cost of exclusion is the creation of a permanent underclass that destabilizes the very community that tried to exclude them.

  This approach keeps you within the political theory (territory, membership, coercion) without getting bogged down in film studies jargon or historical allegory, while respecting the constraints of your syllabus.
