      *   **Topic:** *District 9* (2009) vs. the open borders debate (specifically the freedom-of-association case for a right to exclude vs. the coercion/justification to outsiders critique).
      *   **Core Questions/Problems:**
          1.  *Refuge vs. Exclusion:* Prawns can't go home (shipwrecked). Does "right to exclude" become "right to intern"? Does duty to rescue become permanent permission to stay?
          2.  *Public vs. Private:* MNU (corporation) runs the camp/removals, not just the state. Does the "self-determining people" argument hold when it's profit-driven? Also, Prawns lack a state/leadership for reciprocity.
          3.  *Membership & Utility:* Wikus becomes a Prawn. MNU wants him for weapons. Is membership conditional on usefulness?
      *   **Desired Output:** A *reading*, not a summary. Strongest version of the right to exclude vs. where the film answers it. Scene recommendations (Eviction notices, Ending). Honesty about where the reading is forced. No citations (syllabus constraint). Acknowledge apartheid background but focus on theory.
      *   **Tone:** Academic but conversational, helpful, critical, honest about limitations.

  2.  **Deconstruct the Theoretical Arguments:**
      *   *Right to Exclude (Freedom of Association):* Usually associated with Wellman or Miller. A political community has a right to determine its character/membership. Like inviting guests to a dinner party.
      *   *Coercion/Justification Critique:* Usually associated with Abizadeh or Carens. Borders are coercive. If you coerce outsiders, you owe them justification they can accept.
      *   *The "Shipwreck" Analogy:* If someone is drowning, you save them. If the ocean never recedes, do they stay in your living room forever? (Duty of rescue vs. Right to membership).
      *   *The "Stateless" Problem:* If the Prawns have no state, the "mutual recognition of states" model fails.

  3.  **Analyze *District 9* through this Lens:**
      *   *The Setup:* The Prawns arrived (mystery), are stuck (refugees), are segregated (District 9), and are being moved (District 10).
      *   *The "Right to Exclude" in the film:* The humans claim sovereignty over Johannesburg. They treat Prawns as nuisances/animals, not potential members.
      *   *The MNU Factor:* Crucial point by the user. The "community" isn't deciding; a corporation is extracting value. This undermines the "democratic self-determination" defense of exclusion.
      *   *Wikus's Transformation:* He is the bridge. He loses human status not by crossing a border, but by biological change. His "exclusion" is immediate once he's useful/no longer useful.
      *   *The Ending:* Wikus is fully Prawn. Christopher is gone (promised return). Wikus waits. Is this a claim to belonging? Or just exile?

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the prompt. It's a sophisticated reading. Validate the "shipwreck" vs. "internment" tension.
      *   **Point 1: The Right to Exclude vs. The Right to Intern.**
          *   *Theory:* The standard argument assumes a "no" means "stay there." But here "no" means "stay here, in this cage."
          *   *Film:* District 9 isn't a border; it's a containment zone. The eviction notices are key. They aren't denying entry; they are managing a captive population.
          *   *Verdict:* The film suggests that when exit is impossible, exclusion *becomes* incarceration. The "right to exclude" collapses into a "right to detain."
      *   **Point 2: MNU and the Corruption of Association.**
          *   *Theory:* Freedom of association requires a *people* associating.
          *   *Film:* MNU is profit-driven. Wikus's father-in-law is the bureaucrat. It's not "We the People" deciding; it's "We the Shareholders" extracting.
          *   *Verdict:* This destroys the normative force of the exclusion argument. You can't claim "cultural self-determination" when the motive is weapons testing.
          *   *Prawn Statelessness:* The lack of Prawn leadership makes negotiation impossible, which humans use as an excuse for paternalism/force.
      *   **Point 3: Wikus and the Utility of Membership.**
          *   *Theory:* Membership is usually based on consent, birth, or shared values.
          *   *Film:* Wikus is hunted only when he can fire the gun. Before that, he was just a bureaucrat. After transformation, he is vermin.
          *   *Verdict:* The film argues membership is *instrumental*. You belong if you are useful. When Wikus loses human utility and gains Prawn utility (to MNU), he is excluded from humanity.
      *   **Scene Selection:**
          *   *Eviction Notices:* Shows the bureaucratic violence of "management" rather than "border control."
          *   *The Transformation/Waste Scene:* Where he sprays the fluid. The moment of biological reclassification.
          *   *The Ending:* The metal rose. Is it hope or resignation?
      *   **Honesty Check (Where it's forced):**
