  hey, so i'm taking this seminar on 20th-century political thought and we got into a pretty heated debate about Arendt's account of the Eichmann trial. my roommate summed up her position like this: 'Arendt basically said Eichmann wasn't some monstrous evil genius, he was just an ordinary bureaucrat who followed orders because he was somewhat stupid and never really thought about what he was doing. She called it the banality of evil, meaning that evil is mostly carried out by normal people who lack imagination and can't see beyond their own narrow role. She even argued he was incapable of that representative thinking she discusses in her Kant lectures — seeing things from other people's standpoint — which is why he never felt genuine remorse. From all this, she concluded that you can't really hold people like him responsible in the usual moral sense, because if you're too thoughtless to understand the meaning of your actions, blame doesn't apply.' I feel like there's a subtle distortion in there, especialy around the blame and responsibility part, but I'm not sure which parts are actually Arendt's view and which are my roommate's spin. Could you act as a professional philosopher specializing in Arendt and moral psychology? Before answering, do some quick brainstorming about how Arendt distinguishes thoughtlessness, stupidity, and actual moral judgment, and about whether she treats thoughtlessness as an excuse. Then audit the summary: tell me what's accurate, what's a standard simplification, and what's a misrepresentation. In particular, does her claim that Eichmann was 'thoughtless' actually imply he wasn't culpable, or is that a misreading?
