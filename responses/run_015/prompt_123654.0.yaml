answer: |-
  **1. The practice restated**
  The practice establishes a hierarchy of authority based on competence rather than contemporaneous desire. A competent earlier self may issue instructions regarding future medical treatment that bind an incompetent later self, even when that later self actively objects. However, this authority is reversible: if the later self regains competence, her current wishes immediately override prior instructions. Thus, the power to govern the body tracks the capacity for rational agency at a specific stage, not the intensity of current preference. The system presumes that the competent stage speaks for the whole person, silencing the incompetent stage unless the latter regains the status required to speak for itself.

  **2. The implicit theory of the person across time**
  To make this practice coherent, one must reconstruct a view of persistence that distinguishes between *ownership* of the body and *authority* over its use. The practice implicitly relies on a hybrid view. Ontologically, it leans toward **endurantism**, the view that a person is wholly present at each moment of her existence; the body undergoing treatment is numerically identical to the body that signed the directive. This ensures the directive applies to *her* and not a stranger. However, for authority, it relies on **psychological continuity**, a criterion often associated with **perdurantism** (the view that persons are sums of temporal stages). It assumes the "true" person is located in the psychologically continuous, competent stages. When psychological continuity breaks (dementia), the biological organism remains (endurantism), preserving ownership, but the authoritative agent is located in the past (psychological continuity). The practice thus presupposes a person who persists biologically but whose moral agency is time-indexed to moments of competence.

  **3. Strict presupposition versus comfortable fit**
  The practice does not strictly require either endurantism or perdurantism; the metaphysics is underdetermined. Both theories can accommodate the normative principle that critical interests (long-term values) outweigh experiential interests (current sensations) when agency is compromised. An endurantist can argue the single person is protected from her own diminished capacity; a perdurantist can argue the earlier stage has legitimate authority over the later stage's constraints. What defeats this underdetermination is not the outcome, but the justification. If one demands an ontological account of *who* is suffering, the practice wavers. It is only if we treat the metaphysics as a placeholder for a normative claim about autonomy—that competence confers exclusive right to rule—that the practice holds. Without that normative bolt, the metaphysical hybrid collapses.

  **4. Two reconstructions compared**
  An **endurantist reconstruction** views the patient as one person whose capacities fluctuate. The directive protects the single person from decisions made during periods of impairment. This handles the **permanent vegetative state** well: the organism is the person, and prior wishes protect her integrity. It struggles with **advanced dementia**: if the person is wholly present but psychologically transformed, enforcing past wishes may harm the current person who is content.
  A **perdurantist reconstruction** views the patient as a sequence of stages. The competent stage imposes constraints on the incompetent stage. This handles the **manic patient** well: the stable stage restricts the unstable stage for the sake of the whole "worm." It struggles with **value changes**: if stages are distinct, why should the earlier stage rule?
  For the **patient whose values changed coherently**, the practice allows revocation, favoring the current competent stage. Here, endurantism explains this as personal growth; perdurantism explains it as a new stage acquiring authority. The endurantist view better preserves the intuition that we are caring for *one* life; the perdurantist view better explains the conflict between past and present wishes as a clash between distinct temporal interests.

  **5. The contract and property asymmetry**
  The law allows an earlier self to bind later assets (property) but generally forbids binding later bodily service (contract). Medicine appears to reverse this, binding the body via directives. This is not an exception but a clarification of the distinction between external and constitutive assets. Property is external to the self; binding it does not violate bodily integrity. Bodily service contracts are void because they treat the person as a tool, violating the constitutive nature of agency. Advance directives are not servitude; they are extensions of agency over time. They bind the body not to serve another, but to preserve the self's own narrative integrity. Thus, the asymmetry supports the reconstruction: the body is bound only when the binding serves the temporal extension of the agent's own autonomy, not when it transfers control to another.

  **6. What the temporal-parts reform would actually change**
  The "stage-relational" reform treats the directive as an inherited constraint (like an easement) rather than self-consent. This fundamentally alters the moral geometry. Currently, enforcing a directive is respecting *self*-rule. Under the reform, it is respecting *Predecessor*-rule over a *Successor*. This weakens the justification for overriding the later stage's welfare. If the later stage is a distinct welfare subject, enforcing a directive against a contented dementia patient looks like sacrificing Subject B for Subject A's peace of mind.
  Outcomes would likely shift: hospitals would need to weigh the current stage's suffering against the prior stage's instructions explicitly, rather than treating the instructions as conclusive consent. This might lead to more overrides of directives where current suffering is high. The hospital would need to institute a "conflict of stages" review, assessing the welfare of the current subject independently, rather than merely verifying the validity of the prior document. It transforms a legal verification into a utilitarian calculation between temporal subjects.

  **7. Bottom line**
  The practice strictly presupposes neither endurantism nor perdurantism; it floats free of the dispute, relying instead on a normative commitment to competence-based authority. It is coherent only if one accepts that biological continuity establishes ownership while psychological continuity establishes authority. This is philosophically lucky rather than principled: it mixes two different theories of identity to solve different problems. The practice works because it prioritizes social and legal stability over metaphysical precision, masking the tension between protecting the organism and respecting the agent.
