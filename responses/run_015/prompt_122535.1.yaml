prompt: |-
  Hey — I could use a hand designing one session of my seminar. It's a mixed room, about 16 philosophy and CS master's students, 75 minutes, one whiteboard, printed 5x5 grids, index cards, no laptops. The topic is inverse reinforcement learning: inferring what someone wants from watching what they do. Most of them will arrive assuming it's basically mind-reading from video footage, and I want them to leave with the reverse feeling — that the behavior alone constrains almost nothing until you bolt on assumptions, and that the assumptions are carrying nearly all the weight. They should hit that before I name it.

  Rough shape I have in mind (tell me if it won't work): a "demonstrator" student gets a secret reward sheet and walks a route on the grid while everyone else writes down what they think she's being rewarded for and how confident they are. Three wrinkles I really want in there:

  1. what I'm calling the prohibition problem — she avoids certain cells, and you cannot tell from the route whether she dislikes them, is forbidden from entering them, or simply doesn't know they're there. I want the room to discover that "avoided" doesn't mean "disliked" by getting burned on it, not by being told.
  2. a transplant test — same demonstrator, new grid where the previously locked cells are open and an old shortcut is gone. Half the room is only permitted to copy her actions, the other half has to state a reward function, and we score everyone's predicted route on the new map. I expect the cloners to loose badly there, but tell me if I've got that backwards.
  3. one demonstrator who is deliberately not optimal — she's satisficing, or following some rule like "keep the wall on your left" — while still producing a route that looks perfectly sensible on the first grid, so that whatever reward everyone infers from her is a confabulation.

  I'd also like two demonstrators with genuinely different reward sheets to produce identical routes, revealed late, plus a moment where the class realises that the reward function is really a whole family of them. A colleague mentioned something about adding a potential-based term and the optimal policy not budging at all; I'd like that to land as something they can't resolve from the evidence in front of them, not as a slide.

  Can you give me the rules and materials, a payoff scheme that needs no money and penalises hedging (I was thinking they have to commit to an exact route and bet points on it), a minute-by-minute timeline for the 75, and a debrief that maps specific things that happened in the room onto specific assumptions — optimality, known dynamics, the choice of features, and whatever tie-break rule you use to pick between explanations that fit equally well, since a couple of them will have heard of "maximum entropy" and will want to know where it slots in. No lecture up front, and nobody should hear the words "identifiability" or "degeneracy" until afterwards.

  Finally: what will predictably go wrong the first time I run this — the secret leaking, someone proposing the reward "just take this exact route," a demonstrator being sloppy — how I should handle each, and honestly which part of it I'll definately just have to say out loud because the game can't produce it. I'd rather know before I'm halfway through.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar design:

  1.  **Analyze the Request:**

      *   **Target Audience:** 16 Master's students (Philosophy + CS). Mixed background means avoiding heavy math jargon initially, but capable of abstract reasoning.
      *   **Topic:** Inverse Reinforcement Learning (IRL) - inferring rewards from behavior.
      *   **Core Learning Objective:** Behavior alone under-constrains the reward function; assumptions (optimality, dynamics, features) carry the weight. Avoid the "mind-reading" misconception.
      *   **Constraints:** 75 minutes, 1 whiteboard, printed 5x5 grids, index cards, *no laptops*.
      *   **Specific Mechanics Required:**
          1.  *Prohibition Problem:* Avoidance $\neq$ Dislike (could be constraints/unknown).
          2.  *Transplant Test:* Copying actions vs. Inferring Rewards in a new environment (Cloners should lose).
          3.  *Sub-optimal Demonstrator:* Satisficing/Heuristic behavior that looks optimal initially (confabulation risk).
          4.  *Equifinality:* Different rewards $\rightarrow$ Same route.
          5.  *Potential-Based Reward Shaping:* Reward families that don't change policy (needs to be experiential, not lectured).
      *   **Logistics:** Rules, materials, payoff scheme (no money, penalize hedging), minute-by-minute timeline, debrief mapping, failure mode analysis.
      *   **Tone:** Practical, experienced, slightly cynical about classroom dynamics (anticipating failure modes).

  2.  **Evaluate the User's "Rough Shape":**

      *   *Demonstrator walking a route:* Good, kinesthetic.
      *   *Prohibition Problem:* Needs careful setup so the "avoidance" is ambiguous.
      *   *Transplant Test:* "Cloners lose" is generally correct in IRL theory (imitation learning fails under distribution shift), but needs to be set up so the *reward inferers* actually succeed. If the reward is too complex, everyone loses. If too simple, cloners might survive. Need to ensure the *reason* for the old route changes in the new grid.
      *   *Sub-optimal Demonstrator:* High risk. If they see a sub-optimal route, they might just think "bad player." Needs to look *plausibly* optimal given limited info.
      *   *Equifinality:* Hard to do physically without revealing too much early.
      *   *Potential Shaping:* Very hard to do physically without math. Needs a clever trick (e.g., "shaping reward" based on distance to goal that cancels out).

  3.  **Designing the Mechanics (Iterative Process):**

      *   *Payoff Scheme:* Needs to penalize hedging. "Commit to an exact route and bet points." Let's use a "Confidence Token" system. You get 10 tokens. You must place them on specific trajectories or reward hypotheses. If you spread them out, you dilute potential gain. If you put all on one and miss, you get zero. This encourages committing to a specific model.
      *   *Grid:* 5x5 is good. Start (S) bottom-left, Goal (G) top-right. Obstacles?
      *   *Round 1 (The Trap):* Demonstrator A takes a specific path. Students infer reward.
          *   *Hidden Truth:* There are "lava" cells (prohibition) and "gold" cells (reward). The path avoids lava and collects gold.
          *   *Problem:* Students can't distinguish avoidance of lava from dislike of lava.
      *   *Round 2 (The Transplant):* New Grid. Lava moves or disappears. Shortcut blocked.
          *   *Cloners:* Must mimic Step-by-Step (Up, Up, Right...).
          *   *Inferers:* Must state Goal/Rule.
          *   *Twist:* The "Cloners" will hit the new obstacle because they copied *actions*, not *intent*.
      *   *Round 3 (The Equifinality/Shaping):* Demonstrator B takes the *same* path as A but has a *different* reward.
          *   *How?* Maybe B is minimizing effort (step count) while A is maximizing scenery (specific cells). On Grid 1, the shortest path *is* the scenic path. On Grid 2, they diverge.
          *   *Potential Shaping:* This is the hardest part to make physical. Idea: Give the demonstrator a "battery" cost per step, but also a "charging station" reward that exactly offsets the cost for the optimal path. Or simpler: Tell the class the demonstrator is optimizing $R(s) + \gamma \Phi(s') - \Phi(s)$. No, too mathy.
          *   *Better approach for Potential Shaping:* Just show that adding a "state potential" (e.g., "get closer to goal") doesn't change the path if the original reward was already goal-directed. Actually, the prompt asks for the *family* of rewards. Let's save the math explanation for the debrief and use the game to show *under-determination*.
      *   *Sub-optimal:* Demonstrator C uses a heuristic (e.g., "always turn right if possible"). On Grid 1, this matches the optimal path. On Grid 2, it loops or fails.

  4.  **Refining the Timeline (75 mins):**

      *   0-5: Setup & Rules.
      *   5-20: Round 1 (Observation & Inference).
      *   20-35: Round 2 (Transplant Test).
      *   35-50: Round 3 (The Sub-optimal/Heuristic & Equifinality).
      *   50-65: Scoring & The "Wait, what?" moment.
      *   65-75: Debrief (Mapping to IRL concepts).

  5.  **Addressing Specific Constraints:**

      *   *No Laptops:* Scoring must be manual. Keep it simple.
      *   *Penalize Hedging:* All-in betting.
      *   *Identifiability/Degeneracy:* Do not use these words until the end.
      *   *Failure Modes:* Secret leaking, "exact route" reward, sloppy walking.

  6.  **Developing the "Potential Shaping" Physical Analogue:**

      *   This is tricky. Ng, Harada, Russell (1999) potential-based shaping. $F(s, s') = \gamma \Phi(s') - \Phi(s)$.
      *   *Idea:* Give the demonstrator a secret "altitude" map. They get points for going downhill, lose points for going uphill. If the "Goal" is at the bottom of a valley, the path looks like they are just going to the Goal. But actually, they are optimizing altitude + goal.
      *   *Simpler:* Just demonstrate the *family* aspect. Show that "Reward = 1 at Goal" and "Reward = 1 at Goal + 0.1 for every step closer to Goal" produce the same path.
      *   *Decision:* I will advise the instructor to *simulate* this in the debrief using the whiteboard based on the data generated, rather than trying to make a student physically feel potential shaping, which might confuse the "avoidance" lesson. The prompt asks for it to land as something they can't resolve from evidence. I can achieve this by revealing two different reward sheets that produced the *same* path in Round 1.

  7.  **Drafting the Plan (incorporating the "Wrinkles"):**

      *   *Wrinkle 1 (Prohibition):* Grid 1 has "Red Zones". Demo avoids them. Students think Demo hates Red. Truth: Demo *cannot* enter Red (hard constraint).
      *   *Wrinkle 2 (Transplant):* Grid 2 removes Red Zones but blocks the old path. Cloners try old path $\rightarrow$ Crash. Inferers go to Goal $\rightarrow$ Win.
      *   *Wrinkle 3 (Sub-optimal):* Demo 2 uses "Right-Hand Rule". Grid 1 makes this look optimal. Grid 2 makes it spiral.
      *   *Equifinality:* Reveal Demo 1 had Reward Sheet A, Demo 3 had Reward Sheet B. Both took same path on Grid 1.

  8.  **Refining the Payoff Scheme:**

      *   "Prediction Chips." Each student gets 5 chips.
      *   They place chips on specific *predictions* for the next round.
      *   To penalize hedging: Payout is non-linear. 1 chip on correct = 5 points. 5 chips spread out = 1 point each. Or simpler: You must place all 5 on one hypothesis to be eligible for the "Grand Prize" (bragging rights/candy).
      *   *Better:* "Confidence Wager." Write down prediction. Write down confidence (1-5). Score = Accuracy * Confidence. If wrong, lose Confidence points. This penalizes confident wrongness and hedging (low confidence = low score).

  9.  **Failure Mode Analysis:**

      *   *Leaking:* Demonstrators need scripts.
      *   *"Exact Route" Reward:* Students will say "Reward is +100 for taking Path X." Instructor must rule this "overfitting" without using the word. Call it "The Memorization Trap."
      *   *Sloppy:* Demonstrators must rehearse.
      *   *What must be said:* The math of *why* the reward is under-determined (the equations). The game shows *that* it is, not *why* mathematically.

  10. **Final Review against constraints:**
      *   75 mins? Tight but doable.
      *   No laptops? Yes.
      *   Philosophy/CS mix? Keep concepts accessible but rigorous.
      *   "Identifiability" banned until end? Yes.

  11. **Constructing the Output:** (Drafting the response with the requested sections: Rules/Materials, Payoff, Timeline, Debrief, Failure Modes). *Self-Correction during drafting:* Make sure the "Potential Shaping" part is clear. I'll suggest a specific reveal where two reward functions are shown to be mathematically distinct but behaviorally identical on the training grid.

  12. **Final Polish:** Ensure the tone is helpful and realistic about classroom chaos. (e.g., "Students will talk over you.")

  *(Self-Correction on the Transplant Test)*: The user expects cloners to lose. I need to make sure the "Inferers" actually win. If the reward is "Get to Goal," and the Goal moves or is blocked, Inferers need to know the *Goal* is the reward, not the *Path*. I need to make sure the Reward Sheet implies a *Goal State*, not just a path.
  *Correction:* In Round 1, the Demo goes S to G. Students infer "Wants G". In Round 2, G is in same spot, but old path blocked. Cloners hit wall. Inferers find new path to G. This works.
  *Wait, Prohibition Problem:* If Red Zones are hard constraints in Round 1, but removable in Round 2, that works.
  *Wait, Equifinality:* Need two demos in Round 1 with different rewards but same path.
  *Wait, Sub-optimal:* Need a Demo who is satisficing.
  *Conflict:* I have 3 Wrinkles + Equifinality + Sub-optimal. That's too many demos for 75 mins.
  *Solution:* Combine them.
  *   **Round 1:** Demo A (Optimal, Hard Constraints). Class infers.
  *   **Round 2:** Transplant. Cloners vs. Inferers. (Tests Prohibition/Constraint vs. Reward).
  *   **Round 3:** Demo B (Same path as A, but different reward logic e.g., step penalty vs. goal reward). Reveal equifinality.
  *   **Round 4 (Quick):** Demo C (Heuristic). Shows sub-optimality.
  *   *Actually, let's merge Round 3 & 4.* Demo B uses a heuristic that *looks* optimal on Grid 1.
  *   *Revised Plan:*
      *   Phase 1: Grid 1, Demo 1 (Optimal + Constraints).
      *   Phase 2: Grid 2 (Transplant). Cloners vs. Reward-predictors.
      *   Phase 3: The Reveal (Equifinality & Sub-optimality). Show that Demo 1's behavior could also be explained by a different reward, OR introduce Demo 2 who used a heuristic.
      *   *Decision:* Let's stick to the User's specific wrinkles.
      *   1. Prohibition (Round 1 & 2).
      *   2. Transplant (Round 2).
      *   3. Sub-optimal (Round 3).
      *   4. Equifinality (Reveal after Round 1 or 3).
      *   I will structure it so Round 1 generates the data, Round 2 tests the generalization, Round 3 reveals the ambiguity.

      *Let's refine the "Potential Shaping" requirement.* The user wants them to realize the reward function is a *family*. I can do this by revealing two reward sheets after Round 1 that both explain the data. One is "Goal + Step Penalty", one is "Goal + Shaping". They produced the same path.

