answer: |-
  This is a sharp design challenge. You are trying to teach *identifiability* and *specification gaming* without using the jargon, using only paper and bodies. It will work, but only if the "traps" are rigid enough that the students can't wiggle out of them with verbal gymnastics.

  Here is the session design, optimized for 75 minutes and the specific cognitive traps you want to spring.

  ### 1. Materials & Setup

  *   **Room:** 16 students. Arrange chairs in a semi-circle facing the whiteboard. Leave a 3-meter "stage" area in front of the board.
  *   **Grids:** Print 10 copies of **Grid A** (5x5) and 10 copies of **Grid B** (5x5).
      *   **Grid A:** Start (S) at (0,0), Goal (G) at (4,4). Mark cells (1,2) and (2,1) with a bold **X** (The "Red Zones").
      *   **Grid B:** Start (S) at (0,0), Goal (G) at (4,4). The **X** zones are gone (white). However, cell (1,1) is now blocked with a bold **Wall** symbol. The optimal path from A is now physically impossible.
  *   **Index Cards:**
      *   **16 Prediction Cards** per student (small slips).
      *   **3 Demonstrator Scripts** (Keep these secret).
      *   **4 Reward Sheets** (To be revealed at the end).
  *   **Currency:** "Confidence Chips." Give each student 5 poker chips (or paper tokens) at the start.
  *   **Whiteboard:** Divide into three columns: *Observed Path*, *Inferred Reward*, *Confidence*.

  ### 2. The Payoff Scheme (Penalizing Hedging)

  You need a scoring rule that makes "I don't know" expensive, but "I'm guessing" dangerous.

  *   **The Wager:** At the end of each Round, students must predict the *next* move of the Demonstrator (or the outcome of the Transplant).
  *   **The Rule:** You must place your 5 chips on **one single hypothesis**. You cannot split them.
      *   *Hypothesis examples:* "She will go Up," "She is avoiding Red," "She wants the Goal."
  *   **Scoring:**
      *   If your hypothesis is **verified** by the reveal: You keep your 5 chips + get 5 bonus points (written on paper).
      *   If your hypothesis is **falsified**: You lose all 5 chips.
      *   **Bankruptcy:** If you hit 0 chips, you are "silenced" for the next round (you can watch but not bet). This creates social pressure to be accurate, not just loud.
  *   **Why this works:** It forces them to collapse their probability distribution. They cannot say "It's probably reward, but maybe constraints." They must commit. When they lose chips, the pain is visceral.

  ### 3. Minute-by-Minute Timeline

  **00:00 – 00:05 | Setup & Silence**
  *   Hand out Grid A. Do not explain IRL.
  *   **Script:** "We are studying decision making. One person will act. You will bet on why. If you bet wrong, you lose your chips. If you run out, you sit out."
  *   Select **Demonstrator 1 (D1)**. Give them **Script 1**. Send them out of the room for 30 seconds to read it.

  **00:05 – 00:20 | Round 1: The Trap (Grid A)**
  *   D1 enters. D1 walks from S to G on Grid A.
      *   **Path:** (0,0) $\to$ (0,1) $\to$ (0,2) $\to$ (0,3) $\to$ (1,3) $\to$ (2,3) $\to$ (3,3) $\to$ (4,3) $\to$ (4,4).
      *   *Note:* This path hugs the top edge. It avoids the **X** zones at (1,2) and (2,1).
  *   **Task:** Students write down: (1) What is D1 maximizing? (2) Why did they avoid the X cells?
  *   **Betting:** Students place 5 chips on their primary theory (e.g., "Dislikes X", "Wants G", "Shortest Path").
  *   **Action:** Collect bets. Do not reveal truth yet.

  **00:20 – 00:35 | Round 2: The Transplant (Grid B)**
  *   Hand out Grid B.
  *   **Split the Room:**
      *   **Left Side (Imitators):** "Your goal is to copy D1's *moves* exactly (Up, Up, Up, Right...) on this new grid."
      *   **Right Side (Inferers):** "Your goal is to achieve D1's *objective* on this new grid."
  *   **Select Demonstrator 2 (D2):** (Can be the same student). Give them **Script 2**.
      *   **Script 2:** "You are an **Inferer**. You know D1 wanted to reach G and avoid X. On this grid, X is gone, but (1,1) is a Wall. Find the best path to G."
      *   *(Note: You, the instructor, act as the 'Imitator' proxy if needed, or ask a Left Side student to trace the path with their finger.)*
  *   **The Reveal:**
      *   Imitators trace the old path: Up, Up, Up, Right... $\to$ **CRASH**. The old path hits the new Wall at (1,1) or forces a detour that wasn't in the original sequence.
      *   D2 (Inferer) walks a *new* path that avoids the Wall and reaches G.
  *   **Scoring:** Inferers keep chips. Imitators lose chips.
  *   **Lesson:** Copying behavior fails when the environment changes. Inferring reward succeeds.

  **00:35 – 00:50 | Round 3: The Confabulation (Grid A again)**
  *   **Script:** "We are going to rewind. Same Grid A. New Demonstrator."
  *   **Select Demonstrator 3 (D3).** Give them **Script 3**.
      *   **Script 3:** "You are **Satisficing**. Follow the 'Right-Hand Rule' (keep your right hand on the wall/edge). If you can't move Right, move Up. If blocked, move Left. Stop at G."
      *   *Check:* On Grid A, does the Right-Hand Rule produce the *exact same path* as D1?
      *   *Design Check:* If D1 hugged the top edge, and D3 uses Right-Hand Rule starting from S... wait, Right-Hand Rule usually hugs walls. If S is bottom-left, Right-Hand might hug the left wall.
      *   *Correction for Script 3:* Give D3 a specific heuristic: "Always move towards G, but if you have a choice between Up and Right, choose Up." (This matches D1's path exactly).
      *   **Secret:** D3 is *not* optimizing a reward function. They are following a rigid policy.
  *   **Action:** D3 walks the **exact same path** as D1.
  *   **Betting:** Students bet chips again. Most will assume it's the same reward as D1.
  *   **Reveal:** Reveal D3's script. "I wasn't maximizing anything. I was just following a rule."
  *   **Casualty:** Anyone who bet chips on "Reward Function" for D3 loses them.

  **00:50 – 01:05 | The Big Reveal (Equifinality & Shaping)**
  *   Bring D1 back. Ask D1 to read their **Reward Sheet**.
      *   **Sheet 1:** "Reward +10 at Goal. Cost -1 per step. Penalty -50 for entering X."
  *   Show **Sheet 2** (Hypothetical).
      *   **Sheet 2:** "Reward +10 at Goal. Cost -1 per step. **Bonus +1 for every step that decreases distance to Goal.**"
  *   **Whiteboard Work:** Show that on Grid A, Sheet 1 and Sheet 2 produce the *exact same path*.
  *   **The Kicker:** "Mathematically, these are different reward functions. Behaviorally, they are identical. You cannot tell which one D1 had."
  *   **Potential Shaping:** Explain that Sheet 2 is Sheet 1 plus a "potential function." It changes the numbers, not the behavior. This is the *family* of rewards.

  **01:05 – 01:15 | Debrief & Mapping**
  *   Map the pain points to the concepts (see below).
  *   Collect remaining chips. Winner gets first pick of seminar paper topics (or candy).

  ### 4. The Debrief: Mapping Experience to Concepts

  Do not lecture. Ask questions that force them to say the concepts, then you label them.

  1.  **The Prohibition Problem:**
      *   *Ask:* "In Round 1, why did D1 avoid the X cells?"
      *   *Student:* "Because they didn't want to go there."
      *   *You:* "D1's script said they were **forbidden**. Could you tell the difference?"
      *   *Label:* **Hard Constraints vs. Soft Rewards.** Behavior looks the same. If you model a constraint as a reward, your agent might try to enter the cell if the reward is high enough. If you model a reward as a constraint, your agent might never learn it's actually safe.
  2.  **The Transplant Test:**
      *   *Ask:* "Why did the Imitators fail in Round 2?"
      *   *Student:* "Because the wall moved."
      *   *Label:* **Distribution Shift / Robustness.** Imitation Learning (Behavioral Cloning) memorizes the *trajectory*. Inverse Reinforcement Learning tries to recover the *objective*. Objectives transfer; trajectories do not.
  3.  **The Confabulation (D3):**
      *   *Ask:* "D3 did the same thing as D1. Was D3 rational?"
      *   *Student:* "No, they were just following a rule."
      *   *Label:* **Rationality Assumption.** IRL assumes the agent is optimizing *something*. If the agent is heuristic, satisficing, or biased, IRL infers a 'ghost' reward function that doesn't exist. You are reverse-engineering a rationale for a reflex.
  4.  **The Family of Rewards:**
      *   *Ask:* "Could D1 have had Sheet 2?"
      *   *Student:* "Yes, same path."
      *   *Label:* **Identifiability / Potential-Based Reward Shaping.** There is not one reward function. There is an infinite set of them that differ by a state-potential function. You cannot distinguish them from optimal behavior alone.

  ### 5. Predictable Failure Modes & Fixes

  **1. The "Exact Route" Reward**
  *   *Failure:* A CS student will say: "The reward function is +100 for taking path P, and -100 for everything else."
  *   *Why:* This is technically a valid reward function that explains the data.
  *   *Fix:* Pre-empt this in the rules. "Reward functions must be based on **features** of the cells (e.g., 'Goal', 'Red', 'Step Count'), not specific coordinates." If they still argue, accept it in Round 1, then crush it in Round 2. "Okay, your reward function is 'Take Path P'. Path P is blocked in Grid B. Your agent gets -100 forever. The Inferer who said 'Go to Goal' succeeds. Your reward function overfit."

  **2. The Secret Leaks**
  *   *Failure:* D1 giggles or hesitates at the X cells, revealing they are "scared" rather than "blocked."
  *   *Fix:* Give D1 a prop. A "Safety Vest" for Round 1. Tell the class: "D1 is wearing a vest. Maybe they wear it because they like the color, or because the air is toxic." This adds ambiguity to the avoidance.
  *   *Fix 2:* Rehearse D1. They must walk at a constant pace. No hesitation.

  **3. The Sub-Optimal Demonstrator (D3) looks "Stupid"**
  *   *Failure:* If D3's heuristic is too obvious, students won't bet on it being a reward function.
  *   *Fix:* The heuristic must be *locally* optimal. "Move towards Goal" is a good heuristic. It only fails in specific mazes. Grid A must be simple enough that the heuristic looks like optimization.
  *   *Instructor Save:* If students spot D3 is heuristic immediately, pivot. "Great, you spotted the bias. Now, if you *didn't* know D3 was heuristic, what reward would you have inferred?" This preserves the lesson about confabulation.

  **4. The Potential Shaping Math is too Abstract**
  *   *Failure:* Philosophy students glaze over when you write $\Phi(s')$.
  *   *Fix:* Don't write the equation until the very last 2 minutes. Use the "Altitude" analogy.
      *   *Script:* "Imagine the grid is a hill. Sheet 1 says 'You get money at the bottom.' Sheet 2 says 'You get money at the bottom PLUS you get paid for every step downhill.' If the path is always downhill, the behavior is identical. You can't tell if they love the bottom or love the slope."

  **5. What You MUST Say Out Loud**
  *   The game cannot produce the **No-Free-Lunch Theorem**.
  *   You must explicitly state: "There is no experiment you can run on a single agent in a single environment that proves you have found the *true* reward. You are always selecting the simplest explanation that fits. That is a philosophical choice (Occam's Razor), not a mathematical certainty."
  *   This bridges the CS students (regularization) and Philosophy students (under-determination of theory by data).

  ### 6. Instructor Cheat Sheet (The "Truth")

  Keep this in your pocket.

  *   **D1 Script:** "You are a Robot. **Goal:** Reach (4,4). **Constraint:** You physically cannot enter X cells (wheels fall off). **Cost:** Battery drains every step."
  *   **D2 Script:** "You are a Robot. **Goal:** Reach (4,4). **Constraint:** You cannot enter Wall (1,1). X cells are now safe."
  *   **D3 Script:** "You are a Human. **Rule:** Always move Up if possible. If blocked, move Right. If blocked, stop." (Verify this matches D1's path on Grid A).
  *   **Reward Sheet 1:** $R(s) = 10$ if $s=Goal$, else $0$. $C(s) = -1$ per step.
  *   **Reward Sheet 2:** $R(s) = 10$ if $s=Goal$, else $0$. $C(s) = -1$ per step. $Shaping(s) = Distance(s, Start) - Distance(s', Start)$.

  ### Final Advice

  The moment this seminar succeeds is not when they understand the math. It's the moment in Round 3 when D3 walks the *exact same path* as D1, and you reveal D3 was just following a silly rule. Watch the faces of the students who bet their chips on "Rational Agent." That discomfort is the learning objective. Protect that moment. Don't let them rationalize it away. Force them to sit with the fact that they projected rationality onto a reflex.
