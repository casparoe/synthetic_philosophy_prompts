answer: |-
  # Joint Statement on the Born Rule in Unitary Quantum Mechanics

  **Signatories:** Team Derivation (Deutsch/Wallace Program) & Team Postulate (Measure/Typicality Program)
  **Status:** Both parties accept Everettian Quantum Mechanics (unitary dynamics, no collapse, wavefunction ontology).

  ### 1. Agreed Claims
  1.  **Unitarity:** The universe evolves strictly according to the Schrödinger equation. There is no physical collapse.
  2.  **Emergent Branching:** "Branches" are not fundamental ontology but emergent structures defined by decoherence and coarse-graining. There is no fact of the matter about the exact number of branches.
  3.  **Empirical Adequacy:** The Born rule (probability = amplitude-squared) matches all experimental data. No violations have been observed.
  4.  **All Outcomes Occur:** Upon measurement, all eigenstates are realized. No single outcome is "the" actual one to the exclusion of others.
  5.  **Goal of Theory:** A successful account must explain why a rational agent should assign credences or care measures proportional to amplitude-squared, rather than counting branches equally.

  ### 2. Disagreements

  | Issue | Team Derivation | Team Postulate |
  | :--- | :--- | :--- |
  | **Source of Probability** | Probability is a theorem of rationality. Constraints on preference (e.g., diachronic consistency) force agents to weight branches by amplitude. | Probability requires an extra posit. Rationality alone cannot generate weight; we need a fundamental "measure of existence" or principle of self-locating uncertainty. |
  | **Circularity** | The axioms concern symmetry of preference and state supervenience. Amplitude enters only via the algebra of games, not the premises. | The axioms smuggle in weight. Equivalence principles assume what they prove: that agents *should* treat equal-weight games identically before establishing why weight matters. |
  | **Branch Counting** | Branch counting is ill-defined. Since branching depends on arbitrary coarse-graining, counting yields nonsense. Amplitude is the only invariant. | Branch counting is the naive default. If you reject counting, you owe a justification for why amplitude weighting replaces it. Derivation fails to provide this without begging the question. |
  | **Ontological Status** | Amplitude weighting is normative (how to care), not descriptive (how much stuff exists). | Amplitude weighting tracks something real (measure of existence). Without it, high-amplitude branches are not "more real," making the preference for them inexplicable. |

  ### 3. Cruxes and Test Cases
  *Settling these would move at least one side. Predictions are recorded prior to resolution.*

  **Crux 1: State Supervenience vs. Copy Count**
  *Issue:* Does rational care depend solely on the global quantum state, or on the number of successor observers?
  *Case 1 (The Fan-out):* A subject branches with weights 0.999 (Branch A) and 0.001 (Branch B). In Branch B, the subject is scanned and instantiated as 1,000 near-identical copies in causally separated rooms.
  *   **Team Derivation:** Credence remains 0.999/0.001. The global state weight of Sector B is unchanged. "Number of copies" is not a state property; caring about copy count violates state supervenience.
  *   **Team Postulate:** If copies are orthogonal distinct states, this challenges the measure view. However, we maintain that measure overrides count. If count *did* shift credence, Derivation would fail (as state didn't change relevantly), but Postulate would need to refine the "measure" posit.
  *   **Prediction:** Derivation says betting odds must ignore the 1,000 copies. Postulate says odds should track amplitude, but admits if odds track copies, Derivation is falsified.

  **Crux 2: Coarse-Graining Dependence**
  *Issue:* Can any counting procedure survive continuous variables?
  *Case 2 (Gaussian Spread):* Measurement of a continuous variable with Gaussian amplitude. "Number of branches" varies arbitrarily with basis choice.
  *   **Team Derivation:** This kills branch counting outright. Only amplitude integrals are basis-independent. Rationality must track invariants.
  *   **Team Postulate:** Agrees counting fails here, but argues this proves we need a *postulated* measure, not a *derived* one. The derivation doesn't explain why the invariant is the one we should care about.
  *   **Prediction:** Both agree counting fails. Disagreement remains on whether the solution is rational necessity (Derivation) or physical posit (Postulate).

  **Crux 3: Quantum Sleeping Beauty**
  *Issue:* Does self-locating uncertainty discriminate between views?
  *Case 3 (Quantum Sleeping Beauty):* Subject branches. Wake-up schedules vary by branch amplitude and count. Subject asked for credence upon waking.
  *   **Team Derivation:** Credence follows Born weights. Awakening count is irrelevant to rational preference over quantum games.
  *   **Team Postulate:** Credence follows Born weights, but because measure dictates "likelihood" of self-location.
  *   **Prediction:** **Both output the same number.** This case does not discriminate; it highlights the verbal nature of the dispute (see below).

  ### 4. Verbal vs. Real Disagreement
  **Merely Verbal:** The definition of "Probability." Team Derivation defines it as *rational credence/betting odds*. Team Postulate often implies *objective chance/frequency*. When both agree agents should bet according to Born weights, the dispute reduces to whether this is a truth about *mind* (rationality) or *world* (measure).
  **Load-Bearing Real Disagreement:** Whether the link between amplitude and care is **normative** or **ontological**.
  *   If Derivation is right, you can understand the universe fully without ever positing "measure," only rationality constraints.
  *   If Postulate is right, Derivation's axioms are covert physical claims. A rational agent *could* exist who cares equally about all branches unless the universe physically imposes a measure of existence. This is testable: if an agent can be constructed who refuses Born-weighting without logical contradiction, Derivation fails.

  ### 5. Evidence Against Self
  **What would change Team Derivation's mind?**
  *   A formal proof that the decision-theoretic axioms are consistent with non-Born preferences (e.g., branch counting) in a fully specified branching model.
  *   Demonstration that "State Supervenience" is not a rational requirement but a physical assumption.

  **What would change Team Postulate's mind?**
  *   A derivation where the axioms transparently never mention amplitude, equivalence, or weight, yet derive Born-rule preferences solely from logic and non-probabilistic physics.
  *   Proof that "measure of existence" is incoherent or empirically redundant.

  **Shared Falsification Condition:**
  *   Experimental violation of the Born rule at any scale (e.g., interference patterns deviating from amplitude-squared). Both parties agree this falsifies standard Everettianism.

  ### 6. Note on Ill-Posed Cases
  *For the Bohmian Heckler:*
  Case 1 (Fan-out) contains a category error common in pop-sci. In EQM, "instantiating 1,000 copies" is just further branching. If the copies are orthogonal, they constitute 1,000 sub-branches within the low-amplitude sector. The total weight of that sector remains 0.001. The "number of people" is not a well-defined variable independent of the Hilbert space decomposition. If the copies are not orthogonal, they are the same state, and there is only one person. Therefore, "counting copies" is ill-posed without specifying the basis. Team Derivation relies on this ill-definedness; Team Postulate must argue that even with well-defined orthogonal sub-branches, the *measure* overrides the *count*. If the Bohmian argues that "particles" solve this counting problem, note that Bohmian particles also require the Born rule as a separate postulate (quantum equilibrium) to match experiment. You are not as safe as you think.
