answer: |-
  **Project Title:** The Diachronic Subject of War Guilt: Collective Agency, Institutional Continuity, and the Fischer Controversy

  **I. Introduction and Statement of the Problem**

  The question of who bears responsibility for the outbreak of the First World War remains one of the most contentious issues in modern historiography. For over a century, scholars have debated the causal weight of alliance systems, mobilization timetables, and imperial rivalries. However, the specific locus of moral and political blame has often centered on the intentions of Imperial Germany. This debate crystallized in the 1960s with the work of Fritz Fischer, who argued that the German elite consciously pursued a policy that made general war probable, if not inevitable, in order to achieve hegemonic goals in Europe. The "Fischer Controversy" that followed transformed the historiography of the war, shifting focus from structural inevitability to specific agential intent within the Berlin cabinet. Yet, while historians have exhaustively analyzed the minutes of meetings, the telegrams of the Kaiser, and the memoranda of the Chancellor, a fundamental metaphysical presupposition underpinning the entire debate has remained unexamined. When we assign blame to "Germany" for the war of 1914, and when we discuss the implications of that blame for subsequent German history, reparations, or national memory, we assume a continuity of the moral subject that is rarely justified.

  This project proposes a philosophical investigation into the conditions under which a nation-state can be held responsible decades later for having caused a war. It sits at the intersection of historical methodology and analytic political theory, specifically the literature on collective moral agency. The standard treatments in both fields leave a critical gap. Historians debate the intentions of specific cabinets and elites without asking what it would mean for that blame to attach to "Germany" as an enduring collective subject across regime changes, population turnover, and institutional restructuring. Conversely, philosophers of collective responsibility discuss group agency in abstract terms—debating whether corporations, states, or mobs can possess intentions distinct from their members—without engaging the concrete problem of intergenerational national blame for initiating a war. The existing literature typically assumes either that groups are reducible to their members (summative accounts) or that they possess unified intentionality without explaining how that unity survives temporal discontinuity (non-summative accounts). Neither approach adequately addresses the diachronic identity of the state.

  The core philosophical question I intend to address is as follows: Under what conditions, if any, can a nation-state be held responsible decades later for having caused a war, and does satisfying those conditions require something stronger than mere institutional role-continuity? I hypothesize that standard models of state succession, which rely on legal and institutional continuity, are insufficient to ground robust moral blame across generations. Instead, I propose that a form of "decision-program equilibrium" is required. This concept suggests that for present institutions to be treated as the proper subjects of past blame, the state's deliberative structures must remain sufficiently stable that present institutions can be treated as running the same "program" that produced the original belligerent choice. If the deliberative algorithm of the state has fundamentally changed, the link of moral accountability is severed, even if legal continuity remains.

  This project is designed as a four-month independent study resulting in a substantial paper of approximately 5,000 to 6,000 words. The methodology is strictly conceptual rather than empirical. I will reconstruct two models of collective continuity—one based on institutional-role succession and one based on decision-program equilibrium—and apply both to the Fischer case without committing to any particular empirical resolution of the archival disputes. The goal is to argue that only the second model can support the kind of retrospective national blame the controversy implicitly assumes. A useful deliverable will be a defensible framework that distinguishes meaningful types of national blame from mere rhetorical attribution, with explicit failure conditions: if both models collapse into aggregate individual blame, then the project of national responsibility fails; if they generate genuinely distinct normative consequences for reparative obligations or commemorative duties, it succeeds.

  This proposal outlines the necessity of this inquiry, the theoretical framework I will employ, the specific work plan for the four-month period, and a realistic assessment of the scope and limitations. It justifies why a philosophical rather than empirical project is the right tool here and demonstrates that the timeline is adequate for philosophical framing and model comparison, even if it precludes historical verification.

  **II. Context: The Fischer Controversy as Philosophical Data**

  To understand the urgency of this philosophical intervention, one must appreciate the structure of the historical debate it engages. The Fischer Controversy was not merely a dispute over facts; it was a dispute over the moral character of the German state. Prior to Fischer, the dominant consensus, particularly in West Germany, tended toward a view of "sleepwalking" into war—a tragedy of structural pressures where no single actor bore decisive guilt. Fischer challenged this by positing a "grasp for world power" (*Griff nach der Weltmacht*), suggesting that the German leadership actively sought war to resolve domestic political tensions and secure imperial expansion.

  The implications of this thesis were profound. If the war was the result of a specific, culpable policy by the German elite, then the continuity of German responsibility becomes a pressing question. It touches upon the legitimacy of the Weimar Republic, the rise of National Socialism, and the post-1945 order. However, the debate invariably slides between different levels of analysis. At times, "Germany" refers to the specific individuals in the July 1914 cabinet (Bethmann-Hollweg, Moltke, Jagow). At other times, it refers to the structural imperatives of the Prussian-German state apparatus. At still other times, it refers to the German nation as a cultural or ethnic entity.

  This slippage is tolerable for a historian focused on causal explanation, but it is fatal for a political theorist focused on moral responsibility. If blame attaches to the individuals, it dies with them. If it attaches to the "nation" as a cultural entity, it risks essentialism and collective guilt of a kind that is morally suspect and politically dangerous. If it attaches to the "state" as a legal institution, we face the problem of regime change. The German Empire of 1914 is not the Federal Republic of 2024. The constitution is different, the borders are different, the population is different, and the fundamental normative commitments are different.

  The Fischer literature focuses on causal and intentional explanation without addressing the metaphysics of the subject being blamed. Historians ask, "Did the German leadership intend war?" They rarely ask, "In what sense is the current German state the same agent as the 1914 leadership?" This is not a pedantic distinction. It determines whether contemporary obligations—such as the maintenance of war memorials, the payment of reparations, or the adoption of specific foreign policy constraints—are matters of justice or merely matters of charity and prudence.

  By treating the Fischer Controversy as a "stress test" for theories of collective agency, this project utilizes the historical debate not as a source of empirical data to be verified, but as a structured philosophical problem. The controversy provides a concrete scenario where the stakes of collective responsibility are high, the timeline is long (over a century), and the institutional discontinuities are stark (Empire to Republic to Dictatorship to Federal Republic). This makes it an ideal case study for examining the limits of diachronic collective identity. I will not attempt to resolve whether Fischer was right about the archives. Instead, I will accept the *conditional* premise of the Fischer thesis: *If* the Imperial German state acted with belligerent intent, *can* that intent be attributed to the successor state? This bracketing of the empirical question allows me to focus entirely on the metaphysical and normative conditions of attribution.

  **III. The Philosophical Gap: Collective Agency and Time**

  The literature on collective moral responsibility has grown significantly in recent decades. Analytic philosophers have moved beyond the simplistic view that only individuals can be moral agents. There is now a robust debate between reductivists, who argue that group talk is merely shorthand for individual actions and intentions, and non-reductivists, who argue that groups can possess intentions, beliefs, and agency that are not reducible to their members. Prominent accounts suggest that organizations can have "decision structures" that allow them to form intentions distinct from the sum of their members' intentions.

  However, this literature suffers from a significant temporal blind spot. Most models of collective agency are synchronic; they analyze how a group functions at a specific moment in time. They ask, "Can this committee intend X today?" They do not adequately address the diachronic question: "Can this committee intend X today for an action taken by a previous iteration of the committee fifty years ago?" When time is introduced, it is often in the context of "forward-looking" responsibility (what should we do now to fix a past mess?) rather than "backward-looking" blame (did *we* do this?).

  There are two primary ways the existing literature attempts to handle temporal continuity, both of which are insufficient for the problem at hand.

  The first approach is the "Chain of Membership" model. This suggests that a group persists over time as long as there is sufficient overlap in membership. Just as a ship can be replaced plank by plank and remain the same ship, a cabinet or a state can replace members one by one and remain the same agent. This model fails in the context of the First World War. The membership turnover between 1914 and the present is total. There is no living overlap between the Imperial Cabinet and the current Federal Government. To rely on membership overlap would be to conclude that no state can ever be responsible for actions taken more than a generation ago. This renders the concept of long-term national responsibility incoherent.

  The second approach is the "Legal-Continuity" model. This is the standard view in international law. A state persists as long as its legal identity is recognized, regardless of regime change. Under this view, the Federal Republic of Germany is the same legal subject as the German Empire. While this suffices for treaty obligations and debt, it is philosophically thin when it comes to moral blame. Legal continuity is a fiction of convenience; it does not necessarily track moral agency. If a criminal organization rebrands itself as a legitimate charity but keeps the same bank account, legal continuity exists, but moral continuity is questionable. Similarly, if a state undergoes a democratic revolution and fundamentally alters its decision-making constitution, treating it as the same moral agent as its authoritarian predecessor may be a category error.

  The gap, therefore, lies in the lack of a model that connects *agency* with *time* in a way that is robust enough to support blame but sensitive enough to recognize genuine moral discontinuity. We need a model that explains how a present collective can "own" a past action without relying on biological overlap or legal fiction. This project aims to fill that gap by proposing the "Decision-Program Equilibrium" model.

  This model draws on the analogy of software and hardware. The "hardware" of the state consists of the specific individuals, buildings, and material resources. The "software" consists of the deliberative procedures, the constitutional norms, the weighting of reasons, and the institutional incentives that produce decisions. My hypothesis is that moral continuity tracks the software, not the hardware. If the decision-program remains stable—if the state processes reasons and makes choices in the same way—then the state persists as a moral agent. If the program is rewritten (e.g., through democratization, demilitarization, or constitutional overhaul), the agent changes, and the link of blame is severed.

  This approach has not been systematically applied to the historiography of war guilt. By bringing these analytic tools to bear on the Fischer case, I can demonstrate that the historical debate has been operating with an unexamined and likely flawed metaphysics of the state.

  **IV. Theoretical Framework: Two Models of Continuity**

  The core of this project involves the rigorous reconstruction and comparison of two distinct models of collective continuity. I will define these models precisely to ensure that the subsequent application to the historical case is analytically sharp.

  **Model 1: Institutional-Role Succession**
  This model represents the standard view in international law and conventional historiography. It posits that a state persists as a moral agent so long as there is an unbroken chain of institutional roles. The "Chancellor" of 1914 is linked to the "Chancellor" of today through a succession of office-holders, even if the individuals are different. The state is treated as a "corporation sole" or a persistent legal entity.
  *   *Conditions for Continuity:* Recognition by other states, maintenance of territory (mostly), and unbroken constitutional succession (or recognized succession thereof).
  *   *Implication for Blame:* If Model 1 holds, then present-day Germany is directly accountable for the actions of Imperial Germany in the same way a corporation is liable for the torts of its past management. The change in regime (from Empire to Weimar to Third Reich to Federal Republic) is viewed as a change in management, not a change in the corporate entity.
  *   *Philosophical Weakness:* This model conflates legal liability with moral blameworthiness. It ignores the internal deliberative character of the agent. It allows for "moral luck" where a state might escape blame simply because it lost a war and was legally dissolved, or conversely, be burdened with blame despite a total moral transformation of its citizenry and constitution.

  **Model 2: Decision-Program Equilibrium**
  This is the novel model I propose to develop. It posits that a state persists as a moral agent only so long as its "decision-program" remains in equilibrium. The decision-program is defined as the set of stable dispositions, procedures, and normative weightings that the state uses to convert inputs (information, threats, opportunities) into outputs (policy decisions, declarations of war).
  *   *Conditions for Continuity:* Stability in the *structure of deliberation*. This includes:
      1.  *Reasons-Responsiveness:* Does the state respond to the same kinds of moral and prudential reasons?
      2.  *Veto Points:* Are the checks and balances on belligerence similar?
      3.  *Teleological Orientation:* Is the ultimate end of state action (e.g., dynastic glory vs. citizen welfare) consistent?
  *   *Implication for Blame:* If Model 2 holds, blame attaches only if the current state is running the same "moral algorithm" as the past state. If the Federal Republic of Germany operates on a pacific, democratic, constitutionalist program that is fundamentally distinct from the authoritarian, militaristic program of the Empire, then the Federal Republic is a *different moral agent*. It may have duties of *assistance* or *commemoration*, but it cannot be held *responsible* in the sense of being the author of the past wrong.
  *   *Philosophical Strength:* This model aligns moral responsibility with moral agency. We only blame agents for actions that flow from their character and deliberative structures. If the character of the state has fundamentally changed, the blame no longer fits.

  **Comparative Analysis**
  The project will not merely define these models but will test them against specific criteria. I will evaluate them based on:
  1.  *Intuitiveness:* Which model aligns better with our considered judgments about when blame is appropriate? (e.g., Do we blame post-apartheid South Africa for the crimes of the apartheid regime in the same way we blame the regime itself?)
  2.  *Normative Consequences:* What duties follow from each model? Model 1 suggests reparations and guilt. Model 2 suggests remembrance and structural vigilance but not necessarily guilt.
  3.  *Metaphysical Coherence:* Which model offers a more defensible account of group identity over time?

  I anticipate arguing that Model 1 is sufficient for *legal* liability but fails as a model of *moral* blame. Model 2, while more demanding, captures the intuitive link between agency and responsibility. However, Model 2 carries the risk of allowing states to "wash" their hands of past crimes by simply rebranding their constitution. I will need to address this "moral laundering" objection. I will argue that genuine decision-program equilibrium requires more than textual constitutional change; it requires a stable social reality of deliberation. If the change is superficial, the program remains the same. If the change is deep (as in the post-1945 German *Vergangenheitsbewältigung*), the program is new.

  **V. Methodology and Application to the Case**

  The methodology of this project is conceptual reconstruction and comparative analysis. It is not empirical history. I will not visit archives, nor will I attempt to adjudicate between Fischer and his critics regarding the specific intentions of Bethmann-Hollweg. Instead, I will treat the Fischer Controversy as a fixed set of parameters for a thought experiment.

  **Step 1: Reconstruction of the Historical Scenario**
  I will construct a stylized version of the 1914 scenario based on the consensus of the secondary literature. This scenario will include:
  *   A state apparatus (Imperial Germany) with specific decision structures (Kaiser, Chancellor, Military Cabinet).
  *   A decision output (Mobilization/Ultimatum).
  *   A successor state apparatus (Federal Republic) with different decision structures (Parliamentary, Constitutional Court, Pacifist constraints).
  *   A time gap of over a century with intermediate regime changes (Weimar, Third Reich).

  **Step 2: Application of Model 1 (Institutional-Role)**
  I will apply the Institutional-Role Succession model to this scenario. I will trace the legal continuity of the German state. I will demonstrate that under this model, the verdict is "Guilty." The state persists; therefore, the blame persists. I will then highlight the philosophical tensions this creates: specifically, the problem of holding a democratic populace responsible for the acts of an autocratic elite solely based on legal fiction.

  **Step 3: Application of Model 2 (Decision-Program)**
  I will apply the Decision-Program Equilibrium model. I will analyze the deliberative structures of 1914 Germany versus post-1949 Germany.
  *   *1914 Program:* Dynastic legitimacy, military autonomy, limited parliamentary oversight, aggression as a tool of policy.
  *   *1949+ Program:* Popular sovereignty, civilian control of military, constitutional commitment to peace, integration into supranational bodies.
  I will argue that these represent distinct decision-programs. Therefore, under Model 2, the verdict is "Not the Same Agent." The Federal Republic cannot be the *author* of the 1914 war, though it may be the *inheritor* of the consequences.

  **Step 4: Normative Evaluation**
  I will evaluate the consequences of these verdicts. If Model 2 is correct, what happens to reparations? What happens to memory? I will distinguish between *attributability* (was this action yours?) and *accountability* (do you owe redress?). I will argue that Model 2 allows for accountability without attributability. A state can have a duty to repair harm caused by its predecessor without admitting that it *committed* the harm. This distinction is crucial for political theory, as it allows for restorative justice without the metaphysical absurdity of intergenerational guilt.

  **Step 5: Failure Conditions**
  A critical part of my methodology is defining what would constitute a failure of the project.
  *   *Failure Condition A:* If both models collapse into aggregate individual blame (i.e., if it turns out that "state responsibility" is just a shorthand for "the responsibility of the specific individuals in 1914"), then the project of national responsibility fails, and I must argue for the dissolution of the concept.
  *   *Failure Condition B:* If the Decision-Program model proves impossible to define without circularity (e.g., defining the program by the outcomes it produces), then the model is untenable.
  *   *Success Condition:* If I can demonstrate that the two models yield different normative verdicts and that Model 2 offers a more coherent account of moral agency, the project succeeds.

  This methodological approach ensures that the project remains within the realm of philosophy while remaining grounded in a concrete historical problem. It avoids the trap of "armchair history" by explicitly bracketing the empirical questions and focusing on the conceptual framework used to interpret them.

  **VI. Work Plan and Timeline**

  The project is designed to be completed within a four-month semester. This timeline is tight but feasible given the conceptual nature of the work. The schedule is divided into four distinct phases, each corresponding to one month of the grant period.

  **Month 1: Model Reconstruction and Literature Synthesis**
  *   *Goal:* Finalize the definitions of Institutional-Role Succession and Decision-Program Equilibrium.
  *   *Tasks:*
      *   Week 1-2: Deep dive into the analytic literature on collective intentionality and diachronic identity. I will focus on refining the "Decision-Program" metaphor to ensure it withstands philosophical scrutiny. I need to ensure I am not simply reinventing existing concepts of "organizational culture" but giving them a normative weight suitable for responsibility ascriptions.
      *   Week 3-4: Synthesize the historiographical context. I will review the key contours of the Fischer Controversy not to learn new history, but to ensure my stylized scenario is accurate enough to be credible to historians. I will identify the specific points where historians implicitly rely on assumptions of state continuity.
  *   *Deliverable:* A detailed outline of the two models with defined necessary and sufficient conditions for continuity.

  **Month 2: Application to the Fischer Case**
  *   *Goal:* Apply the models to the historical scenario.
  *   *Tasks:*
      *   Week 1-2: Draft the section applying Model 1. Trace the legal and institutional continuity of the German state from 1871 to present. Identify the points where moral blame becomes problematic under this model.
      *   Week 3-4: Draft the section applying Model 2. Analyze the shift in deliberative structures. Focus on the 1918 revolution and the 1949 Basic Law as potential "program breaks."
  *   *Deliverable:* A complete first draft of the core analytical section (approx. 2,500 words).

  **Month 3: Normative Evaluation and Objection Handling**
  *   *Goal:* Assess the implications and address counter-arguments.
  *   *Tasks:*
      *   Week 1-2: Develop the normative evaluation. Distinguish between attributability and accountability. What duties remain if blame is severed? (e.g., duties of memory, duties of structural prevention).
      *   Week 3-4: Anticipate objections. The primary objection will be that Model 2 allows states to evade responsibility by reconstituting themselves. I will draft responses to this, likely focusing on the distinction between superficial rebranding and deep structural change. I will also address the objection that "nations" are not the right kind of things to have "programs."
  *   *Deliverable:* A complete second draft including the normative evaluation and objection handling (approx. 4,500 words).

  **Month 4: Revision, Polishing, and Final Submission**
  *   *Goal:* Refine the argument and ensure clarity and coherence.
  *   *Tasks:*
      *   Week 1: Holistic review. Check the flow between the historical context, the philosophical models, and the normative conclusion. Ensure the transition from "is" (metaphysics) to "ought" (normative duties) is handled carefully.
      *   Week 2: Pruning and Expansion. Ensure the word count falls within the 5,000-6,000 word range. Cut historical digressions that do not serve the philosophical argument. Expand on the "Decision-Program" definition if it seems too thin.
      *   Week 3: Final polish. Check for clarity, precision, and tone. Ensure the scope limitations are clearly stated in the introduction and conclusion.
      *   Week 4: Submission.
  *   *Deliverable:* Final Paper (5,000-6,000 words).

  This timeline is realistic because it relies on conceptual work rather than data collection. The primary risk is getting bogged down in the historical details of the Fischer debate. I will mitigate this by adhering strictly to the "stylized scenario" approach defined in the methodology section.

  **VII. Scope and Limitations: A Realistic Assessment**

  It is imperative to provide an honest account of what this project can and cannot achieve within the four-month window. This section outlines the necessary bracketing of empirical questions and defines the boundaries of the inquiry.

  **Bracketing the Empirical Fischer Debate**
  I will not resolve the empirical Fischer debate. I will not conduct original archival research, nor will I attempt to determine whether Bethmann-Hollweg actually intended war. This is not merely a matter of time; it is a matter of disciplinary competence. I am a philosopher, not a historian. Attempting to adjudicate the historical facts would dilute the philosophical rigor of the project and exceed the scope of a four-month independent study.
  *   *Justification:* The philosophical question I am asking is prior to the historical one. Even if we knew with 100% certainty that Germany intended war, we would still face the question: "Is the Germany of today the same agent?" Therefore, resolving the historical dispute is not a prerequisite for resolving the philosophical one. I will treat the Fischer thesis as a *premise* for the sake of argument. This allows me to isolate the variable of *continuity* without the noise of *causality*.

  **Limitations of the "Decision-Program" Model**
  I must acknowledge that the "Decision-Program Equilibrium" model is a theoretical construct. It may not map perfectly onto the messy reality of state evolution. States do not have clean "off switches" for their deliberative programs. Change is gradual.
  *   *Mitigation:* I will address this by treating the model as an ideal type. I will acknowledge that in reality, there may be degrees of continuity. However, for the purpose of assigning *blame* (which is often binary in legal and moral contexts), we need threshold conditions. I will argue for a threshold of "sufficient disruption" to break the chain of agency.

  **Temporal Scope**
  The project focuses on the timeline from 1914 to the present, with specific focus on the breaks in 1918 and 1949. I will not engage in a comparative analysis with other states (e.g., France or Britain) unless necessary for contrast. Expanding the scope to a comparative history of war guilt would double the workload and dilute the focus. The German case is sufficient because it presents the starkest discontinuities (Empire to Nazi to Democracy).

  **Normative Scope**
  I will focus on *backward-looking* responsibility (blame and guilt). I will touch on *forward-looking* duties (reparations and memory), but I will not develop a full theory of transitional justice. That is a separate project. The goal here is to establish the *subject* of responsibility, not the full content of the remedy.

  **Feasibility of the Four-Month Window**
  Four months is adequate for this specific conceptual task. The literature on collective agency is dense, but I am not surveying the entire field; I am targeting the specific subset regarding diachronic identity. The writing phase is integrated into the monthly plan. The risk of delay lies in the complexity of defining the "Decision-Program." To mitigate this, I will finalize the definition in Month 1 and stick to it, rather than continuously refining it during the writing phase.

  **VIII. Significance and Deliverables**

  The significance of this project extends beyond the specific case of the First World War. It contributes to three distinct areas of scholarship:

  1.  **Political Theory and Collective Agency:** It addresses a neglected gap in the literature regarding the temporal persistence of group agents. By proposing the "Decision-Program" model, it offers a new tool for analyzing corporate responsibility, institutional reform, and state succession.
  2.  **Historiography:** It offers a meta-theoretical critique of the Fischer Controversy. It shows historians that their debates about guilt rest on unexamined metaphysical assumptions. It invites a more reflexive historiography that is aware of the philosophical conditions of its own claims.
  3.  **Transitional Justice and International Relations:** It provides a framework for understanding post-conflict obligations. If the project succeeds in distinguishing between *attributability* and *accountability*, it offers a way for successor states to acknowledge past harms without accepting an incoherent metaphysical guilt. This has practical implications for how nations negotiate reparations and memory treaties.

  **Deliverables**
  The primary deliverable is the research paper itself (5,000-6,000 words). However, the project also produces a secondary deliverable: a conceptual framework for analyzing state continuity. This framework can be abstracted from the German case and applied to other contexts (e.g., post-colonial states, post-apartheid societies, corporate mergers).

  **Success Metrics**
  *   *Conceptual Clarity:* The two models are defined with sufficient precision that they can be tested.
  *   *Argumentative Coherence:* The argument that Model 2 is superior for moral blame is logically sound and defended against objections.
  *   *Interdisciplinary Bridge:* The paper successfully speaks to both philosophical and historical concerns without failing at either.

  **IX. Conclusion**

  The question of war guilt is not merely a matter of historical record; it is a matter of metaphysical identity. When we blame a nation for a war fought a century ago, we are making a claim about the persistence of the self over time. The standard tools of historiography and philosophy are currently ill-equipped to handle this claim. Historians assume the subject of blame without defining it; philosophers define the subject without testing it against the ravages of time.

  This project proposes to bridge that gap. By reconstructing two models of collective continuity and applying them to the Fischer Controversy, I will demonstrate that mere institutional succession is insufficient for moral blame. I will argue that a stronger condition—Decision-Program Equilibrium—is required to sustain the link between past action and present responsibility. This approach respects the complexity of historical change while maintaining the rigor of moral philosophy.

  The four-month timeline is realistic for this conceptual work. By bracketing the empirical historical disputes, I can focus on the philosophical architecture of the problem. The result will be a defensible framework that distinguishes meaningful types of national blame from mere rhetorical attribution. Whether the project concludes that national responsibility is possible or impossible, the clarity it brings to the conditions of that possibility will constitute a significant contribution to political theory. It will show that before we can judge the past, we must first understand who, exactly, is standing in the dock.

  This independent study grant will provide the necessary time and resources to execute this focused, high-level conceptual work. It allows for the deep engagement with the literature required to formulate the "Decision-Program" model and the disciplined writing time needed to articulate the argument with precision. The project is feasible, significant, and timely, offering a fresh perspective on a century-old debate by asking the question that has been overlooked: not *what* did Germany do, but *who* is Germany?
