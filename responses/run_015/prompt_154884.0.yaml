      *   **Step (4):** "For *any* proxy-target pair there's *some* level of optimization pressure past which..." This is theoretically true (Goodhart's Law), but the *location* of the crossing point matters immensely. If the crossing point is beyond useful capability, the proxy is legitimate for practical purposes.
