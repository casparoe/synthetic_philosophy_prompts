answer: |-
  ### The readings

  The phrase is a shorthand for several different ideas about how we know what we know. It ranges from a practical warning about bias to a philosophical denial of reality. Understanding the difference matters because it changes how you argue.

  1.  **The Bias Claim:** This says official records aren't neutral photos of the past. They are reports written by people in charge to justify their own actions. When a government clerk writes a file, they are protecting the institution they work for, not necessarily recording every nuance of what happened. It implies the document isn't necessarily a lie, but it is incomplete and slanted toward the powerful perspective. We should read it carefully, knowing it serves a specific interest. It doesn't mean the date is wrong, but the reason might be spun.
  2.  **The Survival Claim:** This argues that documents from the losing side are often destroyed, lost, or never filed in the first place. The winners keep their archives in secure buildings; the losers might only have oral stories or papers that get thrown away. So, the historical archive looks one-sided because the other side's evidence didn't survive the passage of time or active suppression by the winners. This makes oral tradition a crucial form of evidence. If only one side writes things down, the archive is naturally skewed.
  3.  **The Acceptance Claim:** This suggests that truth is less about what actually happened and more about what people agree to believe. The victors have the schools, the newspapers, and the microphones. They can repeat their version enough times that it becomes the standard story, regardless of whether it matches the facts. It claims power determines credibility, not physical evidence. Popularity becomes the same thing as accuracy. If you control the story, you control the future.
  4.  **The Reality Claim:** This is the wildest version. It claims there is no objective past to find at all. History isn't a puzzle to solve; it is a story created entirely by power dynamics. If the powerful say it happened, it is history; if they say it didn't, it never existed. It denies that any independent truth exists outside of who holds the microphone. Facts become irrelevant next to narrative control. There is nothing to verify because verification is just another power move.

  As you go down this list, the claim moves from fixing the records to breaking the idea of truth. The first two suggest we can find better truth. The last two suggest truth is impossible. The first two ask you to look harder; the last two ask you to stop looking.

  ### Verdicts on each

  1.  **Obviously true.** Bureaucracies protect themselves; records naturally reflect institutional interests and blind spots.
  2.  **Defensible.** Often true, but not absolute. Some loser records survive; oral history can be verified against other data.
  3.  **Arguable.** Power influences belief, but facts remain. A lie repeated is still a lie, even if believed.
  4.  **False.** Events happen regardless of recording. Denying objective reality makes history impossible to practice.

  ### Which readings would actually do the work at our meeting

  In your meeting, the phrase was used to stop debate, but only the first two readings actually support your goal. You want to honor the founding story, which implies you believe there is a truth to find. The Bias Claim works because the 1950s file was written by the town's administration to justify the status quo. The Survival Claim works even better because the displaced families didn't leave files; they left memories. Your oral tradition fits the "loser's evidence" category that archives often miss.

  The wilder readings (Acceptance and Reality) undermine you. If truth is just power, then your story is only valid if you become powerful enough to enforce it. That turns history into a contest of strength rather than accuracy. You want to argue that the oral tradition is *more accurate* because it comes from the participants, not that accuracy doesn't matter. Stick to the idea that the document is biased and incomplete, not that facts are irrelevant. This validates the oral history without dismissing the possibility of truth. Since your memory is older than the file, the Survival Claim is strongest. The document is a late reinterpretation by the winners, while the story is the original experience.

  ### What I should say next time

  Next time, acknowledge the point but refine it. Say: "I agree that official records can be biased. That's exactly why we need to weigh this 1950s file against the older oral tradition. The file protects the town; the story protects the families. Neither is perfect, but the story is closer to the event. Let's treat the file as one perspective, not the final word. We aren't saying facts don't matter; we're saying this document doesn't have all of them." This keeps the discussion open. It shows you respect the evidence but understand its limitations. It prevents the phrase from being a conversation-stopper. It shifts the tone from fighting about power to collaborating on accuracy. You invite them to look at the evidence together rather than choosing sides based on ideology.

  ### Bottom line

  The phrase usually means records are biased, not that truth is impossible. Use it to highlight the document's limitations, not to dismiss facts entirely.
