answer: |-
  **The Anatomy of Presumption: Arthāpatti and the Limits of Inference**

  The debate over *arthāpatti* (postulation) is the fault line where Indian epistemology confronts a problem that modern philosophy of science would recognize as abduction, or inference to the best explanation. Your intuition—that the crux of the matter lies in the requirement of *vyāpti* (universal concomitance)—is precisely correct. The status of *arthāpatti* depends entirely on whether valid knowledge requires a pre-established universal rule, or whether the necessity of an explanation can generate its own validity in the moment.

  To ensure our philosophical map is accurate, a brief historical correction is necessary before we begin: while you attribute the independence argument to Nyāya, classically it is the Mīmāṃsā school (specifically Kumārila Bhaṭṭa) that vigorously defends *arthāpatti* as an independent *pramāṇa*. The Nyāya school, champions of logic, typically argue for its reduction into *anumāna* (inference). However, the logical structure of the argument remains the same regardless of the school label. The core tension is between the **strict requirement of prior *vyāpti*** (Nyāya reductionism) and the **cognitive immediacy of explanatory necessity** (Mīmāṃsā independence).

  ### The Case for Irreducibility: The Argument from Anomaly

  To steelman the claim that *arthāpatti* is independent, we must look at the cognitive structure of the "fat non-eater" example. Devadatta is observed to be fat (*sthūla*), yet he is never seen eating during the day. We conclude he eats at night.

  The proponent of independence argues that this cognitive event does not fit the syllogistic structure of *anumāna*. In a standard inference (e.g., "There is fire on the hill because there is smoke"), the *vyāpti* ("Wherever there is smoke, there is fire") is known *before* the specific instance is encountered. You possess the universal rule first, and the perception of the *hetu* (smoke) merely triggers the application of that rule.

  In the *arthāpatti* case, the independence defender claims we do not possess the relevant *vyāpti* beforehand. We do not walk around with the pre-established rule: "All fat people who do not eat by day eat by night." Rather, we are confronted with an *anomaly* or a contradiction: the fact of his fatness is inexplicable (*anupapatti*) given the fact of his daytime fasting. The knowledge of the night-eating arises not from applying a known rule, but from the *need to resolve the contradiction*.

  The irreducibility argument rests on the direction of fit. In inference, the known reason proves the unknown conclusion. In postulation, the known *fact* (fatness) forces the acceptance of the unknown *condition* (night eating) to make the fact intelligible. The "link" between fatness and night-eating is not an observed empirical regularity like smoke and fire; it is a logical necessity imposed by the coherence of reality. If *arthāpatti* were reduced to inference, we would have to claim we already knew the universal rule connecting "daytime fasting fat people" to "night eating." But we don't. We discover that connection *through* the postulation itself. Therefore, the epistemic instrument that generates this knowledge is distinct from the one that applies pre-existing universals.

  ### The Reductionist Pushback: The Argument from Causal Law

  The reductionist (typically Nyāya) counters that the independence view confuses the *psychological* feeling of novelty with the *epistemic* structure of validation. Just because we feel like we are solving a puzzle on the spot does not mean the knowledge isn't grounded in a universal law.

  The reductionist reformulates the postulation into a standard inference:
  1.  **Major Premise (*Vyāpti*):** Anyone who is fat but does not eat during the day must eat at night (or more broadly: "Fatness is sustained only by eating").
  2.  **Minor Premise:** Devadatta is fat and does not eat during the day.
  3.  **Conclusion:** Devadatta eats at night.

  The reductionist argues that the *vyāpti* here is not the hyper-specific rule about Devadatta, but the general causal law of sustenance: "Life and mass require caloric intake." We *do* know this independently. We know that without food, a body emaciates. This is a *vyāpti* established by prior observation of the natural world. When we see Devadatta, we are simply applying this general causal law to a specific context. The fact that we have to "figure out" the timing (night) is a matter of eliminating alternatives, which is a standard logical operation within inference (*tarka* or supposition), not a separate *pramāṇa*.

  Furthermore, the reductionist warns of epistemic chaos. If *arthāpatti* is independent of *vyāpti*, what stops it from becoming mere speculation? If I find a dead man in a locked room, can I postulate he was killed by a ghost because that is the "best explanation" that fits the facts, even without a known universal link between ghosts and death? The Nyāya insists that for a postulation to count as *knowledge* (*pramā*), it must be grounded in a causal law that is universally valid. If it is grounded in a causal law, it is, by definition, inference. If it is not grounded in a causal law, it is guesswork. There is no middle ground where "explanatory necessity" creates validity out of thin air.

  ### The Verdict: Reductionism Prevails

  We must now reach a verdict. While the Mīmāṃsā defense of *arthāpatti* offers a superior description of the *phenomenology* of discovery (how it feels to solve a puzzle), the Nyāya reductionist position is epistemologically superior.

  **The verdict is that *arthāpatti* collapses into *anumāna*.**

  Here is the defense of this verdict. The independence argument hinges on the claim that the *vyāpti* in *arthāpatti* is not known beforehand. This is false. In the Devadatta case, the *vyāpti* is the biological necessity of sustenance. We know independently that "Fatness cannot persist without intake." If we did not know this universal rule prior to seeing Devadatta, we could not conclude he eats at night; we might just as easily conclude he absorbs nutrients from the air or is a magical being. The only reason the night-eating conclusion is valid is that it is the *only option compatible with the known universal law of sustenance*.

  Therefore, the "necessity" that the independence proponent champions is actually the necessity of the *vyāpti* itself. The cognitive process of eliminating the day-time and settling on the night-time is a process of applying a universal to a specific set of conditions. To grant *arthāpatti* independent status is to suggest that "coherence" is a source of truth separate from "causal law." But coherence is only truth-tracking *because* it reflects underlying causal laws. If you sever *arthāpatti* from the strict *vyāpti* requirement of inference, you sever it from objective truth conditions.

  You mentioned worrying that the Nyāya demand for *vyāpti* is arbitrary. It is not. It is the firewall between knowledge and narrative. Inference demands that the link between reason and conclusion be invariant. *Arthāpatti* claims to find a link based on "fit." But a "fit" is only knowledge if the fit is necessitated by a law. If it is necessitated by a law, it is inference. Thus, *arthāpatti* is simply inference applied to the resolution of contradictory data points. It is *anumāna* dealing with negative correlations (he *doesn't* eat by day) rather than positive ones (he *does* smoke), but the logical machinery is identical.

  ### A Note on Upamāna (Comparison)

  Does this same reductionist logic apply to *upamāna* (comparison), such as learning the meaning of the word "gavaya" (wild cow) by being told it resembles a cow and then seeing one in the forest?

  The case for *upamāna* is stronger than for *arthāpatti*, but it still likely reduces. In *upamāna*, the knowledge gained is the connection between a word and an object (*saṅketa*). A reductionist would argue this is a mix of testimony (being told the resemblance), perception (seeing the animal), and inference (recognizing the resemblance matches the description). However, *upamāna* involves a direct perceptual recognition of similarity that feels immediate, not syllogistic. While *arthāpatti* is easily swallowed by inference because it relies on causal laws, *upamāna* relies on perceptual resemblance and linguistic memory. While I would still argue it is reducible to a complex of perception and testimony, the "gap" is wider here than in *arthāpatti*. *Arthāpatti* is definitely inference; *upamāna* is arguably a distinct cognitive event, even if it doesn't warrant a full ontological *pramāṇa* status.

  ### Conclusion

  Your hesitation to accept the reduction of *arthāpatti* stems from the feeling that "explaining a contradiction" is different from "predicting a result." Phenomenologically, you are right. But epistemologically, the Nyāya are right. Explanation without a pre-established universal law is just storytelling. Since *arthāpatti* yields valid knowledge, it must rely on a universal law. Since it relies on a universal law, it is *anumāna*. The "postulation" is just the inference working through a negation.
