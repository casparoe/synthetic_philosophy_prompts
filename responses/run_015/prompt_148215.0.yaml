prompt: |-
  My friend and I had a three-hour argument last night about constitutional entrenchment and I think we ended up shouting past each other, so I want to do this properly: draft the joint statement we could both sign if we were doing an adversarial collaboration instead of drinking wine and repeating ourselves.

  The case we were actually arguing about: a country is writing a new constitution. It entrenches two things behind a special amendment rule — a debt brake and a ban on biometric mass surveillance — such that repealing either takes 60% in both chambers, approval by a citizens' assembly chosen by lot, and a twelve-month cooling-off period after the first vote. And the amendment rule itself is declared unamendable forever.

  He's the Ulysses guy. He thinks this is exactly what a people is *for*: a later majority will face panics, revenge cycles, a demagogue with a surveillance tool, capture by creditors, so the earlier self ties the later self to the mast, and the whole point of a constitution is that it's harder to change than ordinary law. Every time I said "but then the dead are ruling the living," he said the relevant comparison isn't dead vs. living, it's *calm vs. stirred up*, and that a generation in a constituent moment is the calm one.

  I have two complaints and they pull in opposite directions, which is why I think there's something diagnostic here. First: the temporary part isn't binding at all. You can always get out with 60% plus a lottery-chosen assembly plus a year. That's a speed bump with extra steps, so calling it self-binding is cosplay — Ulysses couldn't untie himself, and if he could have, the story wouldn't be about anything. Second: the part that *is* binding — the eternity clause — is the real problem, and not just because it's the dead hand. Ulysses ordered his own crew to tie him. Here a few hundred framers tie everyone who comes after them, including people who never voted for any of it. That's not a Ulysses contract, that's a third party tying a stranger, and the analogy quietly does the work of making it sound like autonomy when it's actually one group's constraint on another. He said the framers *are* the people acting in its constituent capacity and I said that's the whole question, not an answer.

  My hypothesis, offered as a hypothesis: part of this is verbal — we agree on what the institutions do and we're fighting about whether the word "binding" means "impossible to reverse" or "expensive to reverse" — and part of it is a real normative disagreement about who has standing across time. I want you to tell me which parts are which, and not to flatter me by agreeing.

  Please write: a numbered section of claims we could both sign (about what the mechanism does, what it's for, what it can't do); then a disagreements table where each row is one crux, with the wording each of us would accept for our own side, whether the crux is verbal / empirical / normative / bedrock, a concrete case or piece of evidence we'd both accept as bearing on it, and what each of us predicts about it. My guesses at the cruxes: is "binding" impossibility or cost; do constituent moments actually differ from ordinary politics the way calm differs from passion; whether the precommitting agent is the people across time or just the framers; and whether the near cases where we have data — psychiatric advance directives, where someone pre-commits to refusing treatment in a future episode — transfer at all to constitutions. For each crux say what would count as evidence *against* my side, please, and be honest if some of it is unresolvable and why. Don't pad it with references to books I'd have to go look up.

  After the statement, give me a JSON object with these fields: agreed_claims (array of {id, claim, why_both_accept}); disagreements (array of {id, crux, presentist_formulation, ulyssean_formulation, kind: verbal|empirical|normative|bedrock, shared_test, my_prediction, his_prediction}); verbal_vs_substantive ({verbal: [...], substantive: [...], reasoning}); and progress_conditions (array of {what, would_move_whom, realistic: yes|no, why}).
