answer: |-
  ### 1. The Kelly Criterion (Max Expected Log Wealth)

  **Translation:**
  This is the statement that the strategy maximizing the long-run stochastic growth rate ($\log \lambda_s$) generates a typical lineage whose size asymptotically dominates any other strategy's typical lineage by an unbounded factor. In your vocabulary, the "log-optimal policy" is the life history that maximizes $\mathbb{E}[\log \lambda]$, or roughly $\mu - \sigma^2/2$ under small noise. The property that it "almost surely exceeds" others is the branching-process result that the ratio of population sizes $N_{\text{Kelly}}(t) / N_{\text{Other}}(t) \to \infty$ with probability 1 as $t \to \infty$, provided the environment is stationary and ergodic. "Rationality" here lands squarely on the **typical-lineage growth rate**. The normative claim ("you ought to maximize log wealth") translates to the descriptive claim ("this strategy fixes in the population"). "Optimal" is a claim about **who ends up with most of the population share** in the long run, not about the expected size of a single decision-maker's portfolio (which is the arithmetic mean and is dominated by rare, lucky lineages).

  **Residue:**
  The decision-theory argument carries a normative force regarding a single agent's "rationality" that your vocabulary treats as a population-level dynamic outcome. Ecology handles the *consequence* (fixation), but not the *prescription* for a conscious agent. More critically, the Kelly derivation usually assumes wealth is infinitely divisible and there is no lower absorbing boundary. In your vocabulary, **absorbing extinction** is a hard constraint; a strategy with a high geometric mean but non-zero probability of hitting $N=0$ in finite time is evolutionarily suicidal, whereas the standard Kelly argument often ignores ruin if the expected log growth is positive. The DT argument is trivially false in your vocabulary if "optimal" implies persistence, because positive long-run growth rate does not guarantee non-extinction in finite time under demographic stochasticity.

  ### 2. The Ergodicity-Flavoured Critique

  **Translation:**
  This is the distinction between the ensemble average ($\mathbb{E}[N_t]$) and the time-average growth rate ($\lim_{T\to\infty} \frac{1}{T} \log N_T$). In your terms, this is the standard correction for fluctuating environments: expected population size is dominated by rare, lucky realizations (arithmetic mean), while the realized trajectory of a lineage follows the geometric mean. The critique that "expected-value maximization optimizes the wrong average" translates to the ecological fact that **invasion criteria** in fluctuating environments depend on the sign of the long-run stochastic growth rate, not the arithmetic mean reproduction. "Rationality" here maps to **fitness** defined as $\log \lambda_s$. The distinction between "ensemble" and "time" average is exactly the distinction between the expectation of the branching process and the almost-sure behavior of the sample path.

  **Residue:**
  What resists translation is the claim that this is a novel resolution to paradoxes in rational choice. In evolutionary ecology, this is not a critique but the baseline model (Lewontin & Cohen 1969). The residue is the philosophical weight placed on "ergodicity" as a condition for rationality. In your vocabulary, non-ergodicity (where time averages $\neq$ ensemble averages) is the default assumption for finite populations in variable environments. The DT argument treats the mismatch as a cognitive error; your vocabulary treats it as a demographic inevitability. Furthermore, the DT argument often assumes a single agent persisting through time; your vocabulary distinguishes between the **lineage** (which persists) and the **individual** (which dies). The "time average" in DT is a proxy for the lineage growth rate, but the ontology differs: one is a single entity experiencing sequences, the other is a replicator pool.

  ### 3. Fractional Betting (Uncertainty and Model Risk)

  **Translation:**
  This maps to **conservative bet-hedging** driven by parameter uncertainty or model structural uncertainty. If the environmental distribution parameters ($\mu, \sigma$) are unknown or estimated with error, maximizing the *estimated* geometric mean can lead to overbetting and ruin. In your terms, an organism facing uncertainty about the reliability of environmental cues or the variance of the environment itself should evolve a reaction norm that reduces variance in fitness below the theoretical optimum for known parameters. "Rationality" lands on a **robust invasion criterion**: a strategy that invades across a range of plausible environmental parameter sets, rather than optimizing for a single point estimate. "Optimal" is a claim about **persistence under model misspecification**, not just maximizing growth under a fixed measure.

  **Residue:**
  The concept of "model risk" as a cognitive state has no direct expression in your vocabulary. Evolution optimizes the phenotype against the *actual* environment (or the evolutionary history of environments), not against the organism's *uncertainty* about the environment, unless you model meta-uncertainty explicitly (e.g., adaptive dynamics with learning). The DT argument prescribes a fraction (e.g., half-Kelly) based on the agent's confidence; ecology predicts a variance-reduction trait based on the historical cost of variance. The residue is the **normative calibration**: DT says "bet half because you are unsure"; Ecology says "bet less because variance kills lineages." The former is epistemic; the latter is demographic. If the environment is truly stationary, fractional betting is suboptimal in ecology (you leave fitness on the table); in DT, it remains "rational" due to epistemic humility. This is a gap in ecology: we lack a formalism for "rational" caution distinct from "evolved" caution.

  ### 4. Geometric Rationality (Across Worlds/Dimensions)

  **Translation:**
  This fails to translate faithfully. Geometric Rationality proposes maximizing a probability-weighted geometric mean of *values* across mutually exclusive possible worlds or incommensurable dimensions. In your vocabulary, geometric means apply across **time** (sequential environments) or **space** (dispersal across patches), not across counterfactual outcomes for a single individual. If "worlds" are interpreted as environmental states in a single generation, maximizing the geometric mean of values is equivalent to maximizing **expected log fitness** for that generation. However, if "worlds" are mutually exclusive counterfactuals (one-shot decisions), the geometric mean has no demographic analog; invasion depends on the arithmetic mean fitness in a single generation. "Rationality" here lands on **none of these**; it is a normative rule for preference aggregation, not a population dynamic outcome.

  **Residue:**
  This is a category error relative to your vocabulary. Ecology reduces all value to fitness ($\lambda$). There is no notion of **incommensurable value dimensions** (e.g., wealth vs. health vs. pleasure) that need geometric aggregation. Ecology assumes a single currency (gene copies). Furthermore, applying a geometric mean to a one-shot decision (across "possible worlds") is trivially false in your vocabulary: in a single generation, rare high-payoff lineages drive the arithmetic mean, and selection maximizes arithmetic mean fitness unless risks are repeated. Geometric Rationality attempts to import the logic of repeated risk into single-shot moral or value dilemmas. In ecology, this is unjustified unless the "single shot" is actually a proxy for a repeated lineage process. The argument trades on an ambiguity between "optimal for the lineage" (geometric) and "optimal for the individual outcome" (arithmetic).

  ### Residue Report: Ecology's Excess

  Your vocabulary contains three critical structures these arguments lack. First, **absorbing extinction**: DT arguments often treat negative wealth as recoverable or ignore the boundary; in ecology, $N=0$ is terminal, making variance aversion stronger near the boundary than log-optimality suggests. Second, **frequency dependence**: Invasion criteria depend on the resident population's strategy. "Optimal" in ecology is an ESS, not a global maximum against nature. DT arguments typically assume a fixed environment or "nature" as a passive adversary, ignoring that the "environment" often includes competitors whose frequencies shift. Third, **generation-time discounting**: Structured population models weight reproduction by generation time. DT treats time as uniform steps; ecology knows that early reproduction weights more heavily in $\lambda$ than late reproduction, even if geometric means are equal.

  ### Verdict

  The decision-theory arguments are less determinate than they look. They trade on an ambiguity between "optimal" as **best-for-me** (a normative claim about a single agent's utility) and "optimal" as **what-wins** (a descriptive claim about population share). In your vocabulary, this ambiguity is resolved: what wins *is* the definition of fitness. The "ergodicity" and "Kelly" arguments are essentially rediscoveries of stochastic population dynamics, stripped of the demographic machinery (extinction boundaries, frequency dependence, structure) that makes them biologically rigorous. The gap is not in ecology; it is in decision theory's attempt to derive "ought" from "is" without specifying the population dynamics that make the "is" true. When they speak of "time averages," they mean "lineage growth rates," but they lack the formalism to handle the boundary conditions (extinction) and feedbacks (frequency dependence) that determine whether that growth rate is actually achievable.
