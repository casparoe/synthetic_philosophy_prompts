  **Adversarial Collaboration: The Frame Problem Stalemate**

  **I. Common Claims**
  1.  **The Tripartite Worry:** We agree the literature conflates three distinct challenges: (a) the *Frame Proper* (specifying non-effects without enumeration), (b) the *Qualification Problem* (listing unstated preconditions), and (c) the *Relevance Problem* (selecting which beliefs bear on action).
  2.  **Solution Criteria:** A solution must ensure correctness (no false predictions) and efficiency (computational tractability in open environments).
  3.  **Status:** Classical formalisms technically solve (a) but struggle with (b) and (c) in open worlds. Neural latent models handle (c) empirically but lack explicit guarantees.
  4.  **The Articulation Condition:** Any viable agent must not only act correctly but explain *why* ignored factors were safe to ignore.
  5.  **Verbal Dispute:** We argue this is not *merely* verbal. While distinct worries are conflated, they share a root: the assumption that change must be inferred from static descriptions. Acknowledging the separation prevents the Formalist from claiming victory on (a) while ignoring failure on (c), but does not dissolve the deeper ontological disagreement.

  **II. Residual Disagreements**

  | Dispute | Formalist Characterization | Enactivist Characterization |
  | :--- | :--- | :--- |
  | **Nature of the Problem** | A technical defect in logical formalisms regarding inertia and relevance. | A symptom of the false premise that agency relies on internal representational models. |
  | **Path to Solution** | Refine representational granularity (e.g., non-monotonic logic, probabilistic graphs) to scale. | Dissolve the problem by shifting to sensorimotor contingencies and embodied coupling. |
  | **Latent Models** | Neural latents are implicit fluents; the problem relocates to decoding dynamics. | Latent states are control variables, not representations; the problem dissolves if no articulation is required. |

  **III. Cruxes and Commitments**

  **1. The Verbal Separation Crux**
  *   **Question:** Are we debating one problem or three?
  *   **Test:** Isolate (a) from (c) in a benchmark.
  *   **Formalist Prediction:** Solving (a) leaves (c) intact. Success on (a) counts as progress.
  *   **Enactivist Prediction:** (a) is only hard because of (c). Solving (a) without solving (c) is vacuous.
  *   **Resolution:** If (a) is solved formally but fails empirically due to (c), the Formalist admits insufficiency; the Enactivist admits the logical defect was real but secondary.

  **2. The Latent Model & Articulation Crux**
  *   **Question:** Do learned latent-state models dissolve the frame problem or relocate it? Does the Articulation Condition change this?
  *   **Test:** A latent model agent acts correctly in a novel context. We demand natural language justification for ignored factors.
  *   **Formalist Commitment:** The problem **relocates**. Explicit fluents are replaced by latent dimensions, but the Articulation Condition forces re-explicitation, recreating the frame problem as an interpretability bottleneck.
      *   *Falsification:* A black-box model provides provably sound natural language explanations for ignored factors without intermediate symbolic structure.
  *   **Enactivist Commitment:** The problem **dissolves** unless imposed externally. The Articulation Condition is a philosophical demand, not an engineering necessity. Demanding reasons imposes a representational burden unnecessarily.
      *   *Falsification:* A system acts safely but consistently fails to explain itself when queried, proving explanation is constitutive of safe agency.

  **3. The Open World Crux**
  *   **Question:** Is completeness possible?
  *   **Test:** Introduce an unforeseen precondition (e.g., glue on the gripper) during execution.
  *   **Formalist Prediction:** The system should flag uncertainty based on anomaly detection in latent dynamics.
  *   **Enactivist Prediction:** The system should cope via sensorimotor adjustment without flagging "belief revision."
  *   **Resolution:** If coping succeeds without flagging, the representational picture is suspect. If flagging is required for safety, representation is indispensable.

  **IV. Summary of Specific Matters**
  Regarding the **Verbal Dispute**, we conclude that while terminology overlaps, the substantive disagreement remains: whether representation is the *medium* of agency or a *tool* for reporting it. Regarding **Latent Models**, the Articulation Condition is the pivot. For the Formalist, it makes the problem **harder**, requiring latent-to-symbolic translation. For the Enactivist, it makes the problem **different**, shifting from action-control to social-linguistic performance. We agree that future benchmarks must test not only success rates but the cost of generating articulations for ignored factors.
