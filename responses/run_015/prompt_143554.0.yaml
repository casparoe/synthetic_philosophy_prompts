answer: |-
  This is a sophisticated methodological move. By demanding the *functional specification* before the *ontological commitment*, you avoid the trap of defining pleasure in a way that makes hedonism trivially true or empirically vacuous.

  Below is the structured analysis you requested. I have organized the desiderata into a table, distinguished by their source (your stated Purpose vs. your Draft List), and flagged their status. Following the table, I analyze the structural tensions, identify the most exclusionary constraint, and evaluate the standard families against this specification.

  ### Part I: Desiderata for a Theory of Pleasure

  The following requirements are derived from your three fixed purposes (Welfare Explanation, Practical Measurement, Conceptual Distinctness) and filtered through your draft list of cases.

  | ID | Desideratum | Rationale / Case | Status |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Welfare Relevance** | The property identified must be plausibly constitutive of "life going better." If the theory identifies a property that can be high while welfare is low (or vice versa) without qualification, it fails Purpose (i). | **Non-Negotiable** (Purpose i) |
  | **D2** | **Non-Linguistic Applicability** | The theory must attribute pleasure to animals and pre-linguistic infants without relying on propositional reports or complex self-conception. | **Non-Negotiable** (Purpose ii) |
  | **D3** | **Conceptual Distinctness** | The theory must not collapse into "getting what one wants" (Desire) or "having a positive mood" (Happiness). It must allow for wanting without liking, and liking without wanting. | **Non-Negotiable** (Purpose iii) |
  | **D4** | **Extensional Coverage (Heterogeneity)** | Must account for qualitatively disparate states (itch relief, intellectual click, horror-fun, grief-fun, flow, comfortable shoe) under one umbrella without calling them "pleasure" by mere homonymy. | **Preference** (Draft List) |
  | **D5** | **Metric Commensurability** | Must supply a common currency (exchange rate) allowing for comparison across kinds, persons, and time to enable aggregation (summing). | **Preference** (Draft List) |
  | **D6** | **Phenomenal Optionality** | Must allow for pleasure to occur without being the focus of attention (e.g., flow states, comfortable shoes) or even without a distinctive "feel." | **Preference** (Draft List) |
  | **D7** | **Valence Complexity** | Must allow for mixed valence (simultaneous pleasure and pain) rather than forcing a single scalar net-score at the moment of experience. | **Preference** (Draft List) |
  | **D8** | **Normative Separability** | Must distinguish the *intensity* of the pleasure from its *weight* in welfare calculations (allowing for degrading pleasures to be intense but low-value). | **Preference** (Draft List) |
  | **D9** | **Operationalizability** | Must map onto variables measurable via experience-sampling or behavioral observation (e.g., facial coding, choice behavior) without requiring metaphysical deduction. | **Non-Negotiable** (Purpose ii) |

  ---

  ### Part II: Structural Analysis of the List

  You asked for the structure of the list rather than just the list. The critical philosophical work lies in the tensions between these desiderata. They are not mutually compatible; satisfying one often forces the violation of another.

  #### 1. The Trilemma of Measurement, Heterogeneity, and Aggregation
  There is a fundamental tension between **D4 (Heterogeneity)**, **D5 (Commensurability)**, and **D9 (Operationalizability)**.
  *   **The Conflict:** If pleasures differ in *kind* (D4) as your draft list insists (the click of proof vs. the itch relief), it is metaphysically unclear how they share a single metric (D5). If they share a single metric (e.g., a neural firing rate or a subjective 1–10 scale), they arguably differ only in degree, undermining the claim that they differ in kind.
  *   **The Measurement Problem:** Experience sampling (D9) relies on coarse self-report. If the theory posits deep qualitative differences (D4), self-report is too blunt to capture them. If the theory posits a single scalar (D5), it fails to capture the qualitative nuance required to distinguish "horror-fun" from "actual fear."
  *   **Verdict:** You cannot maximize all three. A theory that satisfies D4 and D5 usually sacrifices D9 (becoming too subtle for measurement). A theory that satisfies D5 and D9 usually sacrifices D4 (flattening qualitative differences).

  #### 2. The Consciousness Constraint (D2 vs. D6)
  *   **The Conflict:** **D2 (Non-Linguistic Applicability)** pushes toward simple, sub-personal mechanisms (reward pathways, approach behavior). **D6 (Phenomenal Optionality)** pushes toward states where the subject is not monitoring their feelings (flow).
  *   **The Tension:** To attribute pleasure to an infant (D2), we usually look for smiles or coos. But to account for the "comfortable shoe" or "flow" (D6), we must admit pleasure where there are no smiles or overt signals.
  *   **Verdict:** A theory robust enough for animals often requires overt signals, which excludes unnoticed pleasures. A theory robust enough for flow often requires complex cognitive architecture (e.g., "taking pleasure in"), which excludes animals.

  #### 3. The Most Exclusionary Requirement
  The single requirement that excludes the most candidates is **D2 (Non-Linguistic Applicability)** combined with **D3 (Conceptual Distinctness from Desire)**.

  *   **Why:** This pair kills the **Attitudinal Theory** (which requires propositional attitudes like "believing this is good," which infants lack) and the **Desire-Fulfillment Theory** (which is ruled out by definition, but also struggles with animals who have urges but perhaps not "desires" in the technical sense). It puts immense pressure on the **Felt Quality** theory to explain how animals feel "qualities" without language, and on the **Representational** theory to explain how animals represent states "as good."

  ---

  ### Part III: Evaluation of Standard Families

  Here is how the four standard families (plus the fifth option) perform against the desiderata table above.

  | Theory | Performance against Desiderata | Fatal Flaw relative to your Specification |
  | :--- | :--- | :--- |
  | **1. Felt Quality (Sensationism)**<br>*(Pleasure is a distinctive phenomenological tone)* | **Passes:** D2 (Animals feel sensations), D5 (Intensity is scalar), D9 (Self-report of feeling).<br>**Fails:** D4 (No single "tingle" covers proof & itch), D6 (Flow has no distinctive feel), D7 (Hard to mix sensations). | **Extensional Failure.** It cannot account for "grief-fun" or "flow" without positing a feeling that isn't there. It collapses D4 (Heterogeneity). |
  | **2. Attitudinal Hedonism**<br>*(Pleasure is taking pro-attitude toward experience)* | **Passes:** D4 (Explains heterogeneity), D6 (Can be unconscious/background), D8 (Allows weighting).<br>**Fails:** D2 (Infants/Animals lack propositional attitudes), D9 (Hard to measure attitudes without report). | **Species Failure.** It violates D2. It makes hedonism inapplicable to the very subjects (animals/infants) you require for Purpose (ii). |
  | **3. Adverbial / Representationalism**<br>*(Pleasure is experiencing an object *as good*)* | **Passes:** D4 (Different objects, same mode), D6 (Can be non-focal), D3 (Distinct from desire).<br>**Fails:** D2 (Do dogs represent things *as good*?), D5 (How to sum representations?). | **Operational Failure.** It struggles with D9. Measuring "representation as good" in experience sampling is harder than measuring "felt intensity." |
  | **4. Desire-Fulfillment**<br>*(Pleasure is the satisfaction of desire)* | **Passes:** D5 (Easy to count), D9 (Choice behavior).<br>**Fails:** D3 (Ruled out by your Purpose iii), D1 (Experience Machine counter-example). | **Conceptual Collapse.** It violates D3. It cannot distinguish "liking" from "wanting," which your specification explicitly demands. |

  #### The Fifth Option: Family Resemblance / Primitivism
  *   **The View:** Pleasure is not a natural kind or a single property. It is a cluster concept (like "game") where states share overlapping features (motivation, phenomenology, reinforcement) but no single essence.
  *   **Performance:**
      *   **Passes:** D4 (Heterogeneity) effortlessly. D6 (Phenomenal Optionality) easily.
      *   **Fails:** **D5 (Metric Commensurability)** and **D9 (Operationalizability)**.
  *   **What You Must Give Up:** If you adopt this view, you must abandon the idea of a precise **exchange rate**. You cannot sum "units" of pleasure if there is no common unit. This undermines the *calculus* aspect of classical utilitarianism but may preserve a *qualitative* hedonism. You also lose the ability to say definitively whether an animal is experiencing "pleasure" in borderline cases, as there is no necessary condition to check.
  *   **Welfare Implication:** This turns hedonism from a maximizing equation into a pluralistic guide. It saves the theory from extensional counter-examples (like flow or grief-fun) but at the cost of precision.

  ### Recommendation for Your Paper

  Your specification reveals that **Classical Benthamite Hedonism** (Felt Quality + Scalar Aggregation) is incompatible with your **Extensional Coverage** (Flow, Heterogeneity). Conversely, **Modern Attitudinal Hedonism** is incompatible with your **Non-Linguistic Constraint** (Animals).

  To proceed, you must choose which constraint to relax.
  1.  **If you keep D2 (Animals):** You are pushed toward a **Representationalist** view that treats "pleasure" as a sub-personal reward signal (neuroscientific hedonism). *Cost:* You lose the rich phenomenology of "grief-fun."
  2.  **If you keep D4 (Heterogeneity/Flow):** You are pushed toward the **Fifth Option (Family Resemblance)**. *Cost:* You must explicitly argue that welfare is not strictly aggregable via a single scalar, or that "pleasure" in the theory of welfare is a technical term that diverges from ordinary language.

  **The Strongest Move:** Argue that **D5 (Metric Commensurability)** is the prejudice. Defend a **Qualitative Representationalism**: Pleasure is a representation of a state as good (satisfying D3, D4, D6). It applies to animals (they represent rewards) and humans. But admit that these representations are not perfectly commensurable (sacrificing D5). This allows you to keep the welfare explanation (D1) without forcing the "calculus" that breaks the phenomenology.
