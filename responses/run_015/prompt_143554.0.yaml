          4.  **Epistemic/Operational (The "Who"):** Animals, infants, measurement.

      *   *Identifying Tensions:*
          *   **Tension 1: Heterogeneity vs. Aggregation.** If pleasures are qualitatively distinct (Mill), how do we sum them without a common currency? If they share a common currency (Bentham), are they really distinct in kind?
          *   **Tension 2: Operationalizability vs. Phenomenal Depth.** Animals can't report "taking pleasure in." Felt qualities are hard to measure externally.
          *   **Tension 3: Welfare Constitutivity vs. Independence.** If pleasure *is* welfare (strict hedonism), you can't distinguish intensity from contribution. But the user asks for a theory of pleasure *to be used by* hedonism. I need to clarify if the desideratum is "Pleasure must be the *sole* constituent of welfare" (Strict) or "Pleasure must be *capable* of being the constituent" (Flexible). The prompt says "say what... makes a stretch of a life go better." This implies pleasure *is* the maker. But the user also says "keep apart how pleasant... from how much it contributes." This implies a *Qualitative Hedonism* stance where some pleasures count more. I will treat this as a requirement for *discriminability* to allow for qualitative weighting.
