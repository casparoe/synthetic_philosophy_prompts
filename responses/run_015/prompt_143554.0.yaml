      *(Self-Correction on the "Most Exclusionary Requirement"):* I think the **Animal/Infant Constraint** combined with **Distinctness from Desire** is the hardest hurdle. Attitudinal theories die here. Desire theories die by definition. Felt theories struggle with Flow. Representational theories struggle with Measurement. I will argue the **Operationalizability + Non-Linguistic Subject** constraint is the single biggest filter.

