      *   *D5: Metric Commensurability.* (Aggregation/Exchange rate). (Contested/Preference - crucial for Benthamite vs Millian).
      *   *D6: Phenomenal Optionality.* (Allows flow/unnoticed comfort). (Contested).
      *   *D7: Valence Complexity.* (Mixed feelings). (Preference).

      *   *The Big Conflict:* D2 (Animals) + D6 (Unnoticed/Flow) + D5 (Aggregation).
          *   Animals need simple mechanisms (D2).
