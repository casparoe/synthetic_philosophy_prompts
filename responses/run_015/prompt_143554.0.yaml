  5.  **Drafting the Content - Step-by-Step:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the move to specify desiderata first.
      *   **The Table:** Create columns for Desideratum, Rationale, Status (Non-negotiable/Contested), and Source (User/Purpose).
      *   **Structural Analysis:**
