  6.  **Refining the Tensions (Self-Correction during drafting):**

      *   *Correction on Welfare vs. Pleasure:* The prompt says "keep apart how pleasant an experience is from how much it contributes to the person's welfare." This is tricky. If I am a hedonist, pleasure *is* the contribution. If I distinguish them, I am allowing for *weighted* hedonism (Mill). I need to frame this desideratum as "Capacity for Qualitative Weighting" rather than "Independence from Welfare."
      *   *Correction on Flow:* The prompt includes "total absorption... with no noticeable feeling." A theory of pleasure that requires a *felt quality* fails this. A theory that allows "enjoyment without feeling" (Attitudinal) passes this but fails animals. This is a key conflict.
      *   *Correction on Measurement:* Experience sampling relies on self-report. If the theory posits unconscious pleasure (to handle flow), it conflicts with experience sampling which asks "how do you feel *now*?" I need to note this tension.

  7.  **Finalizing the Desiderata List:**

      *   *D1: Welfare Relevance.* (Non-negotiable).
