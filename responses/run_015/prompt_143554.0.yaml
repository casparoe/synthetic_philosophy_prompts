          *   Welfare vs. Intensity distinction (degrading pleasures count).
          *   Qualitative heterogeneity vs. Quantitative aggregability (the "exchange rate" problem).
          *   Wanting vs. Liking dissociation.
          *   Neural non-uniformity.
          *   Mixed valence allowed.

      *   *Filtering:*
          *   *Non-negotiable (based on the stated Purpose):* Must explain welfare improvement, must apply to animals/infants (rules out complex cognitive attitudes), must differ from desire satisfaction.
          *   *Contested/Preference:* Qualitative heterogeneity vs. Aggregability (this is the big tension). The "degrading pleasure" point is often a critique of hedonism, but the user wants the *theory of pleasure* to allow it to count as high intensity even if low welfare (or vice versa? The prompt says "keep apart how pleasant... from how much it contributes"). Actually, standard hedonism says pleasure *is* the contribution. The user wants the *theory of pleasure* to allow the distinction so a *modified* hedonism (e.g., Millian) can use it. I need to be careful here. If the theory of welfare is hedonism, pleasure *constitutes* welfare. But the user asks for a theory of pleasure *for* hedonism. If the theory of pleasure distinguishes "pleasantness" from "welfare contribution," it allows for *qualitative hedonism* (higher/lower pleasures).
          *   *Operationalizability:* This kills theories that rely on inaccessible introspection or complex propositional attitudes for animals.

  3.  **Structuring the Desiderata List:**

      *   I need to categorize these. Good categories would be:
          1.  **Functional Role (The "Why"):** Relating to welfare and distinctness.
          2.  **Extensional Adequacy (The "What"):** Handling the specific cases (itch, flow, etc.).
