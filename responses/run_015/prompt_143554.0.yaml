      *   **Task:** Write a list of *desiderata* for a theory of pleasure, tailored to specific purposes (welfare explanation, practical measurement, distinction from other theories).
      *   **Constraints/Parameters:**
          *   Purpose (i): Explain what makes life go better.
          *   Purpose (ii): Usable in practice (experience sampling, animals/infants).
          *   Purpose (iii): Distinct from desire-satisfaction and mood/happiness views.
          *   Not required: Metaphysical reductionism or making hedonism true by definition.
          *   User's Draft List: A long, specific list of examples and constraints (extensional coverage, distinction between occurrence/noticing/endorsing, intensity vs. contribution, qualitative difference vs. aggregability, wanting vs. liking, mixed valence).
          *   **Crucial Requirement:** Focus on the *structure* of the list. Flag incompatible requirements (trade-offs). Identify the most exclusionary requirement.
