  There is no single, canonical proper noun (like "The Gettier Problem" or "The Euthyphro Dilemma") that exclusively names this specific structural flaw in the literature on divine hiddenness. However, your diagnosis is precise, and the pattern is well-recognized in adjacent fields. It is a composite error involving **value theory**, **scope**, and **teleology**.

  For the purpose of your seminar, I recommend naming it **"The Accessibility Mismatch"** (or, more technically, **"The State-Dependent Value Fallacy"**).

  Below is the analysis you requested: the philosophical taxonomy, the distinction from neighboring concepts, and the verdicts on your three specific questions.

  ### 1. The Phenomenon and Its Name

  While students often rederive it, the literature does discuss this structure, usually fragmented across different objections.

  *   **In Philosophy of Religion:** It is often implicit in J.L. Schellenberg's critique of "epistemic distance" theodicies. Schellenberg argues that certain goods (like freely chosen love) are *logically incompatible* with the state of non-belief required to access them. However, he does not give the *fallacy itself* a unique name beyond the **"Incompatibility Claim."**
  *   **In Value Theory:** This is a violation of the **"Person-Affecting Restriction."** This principle holds that a state of affairs can only be better or worse for a specific individual if that individual exists in both states and is affected differently. Your students are observing that the cited goods are *impersonal* (the world is better for having seekers) but are offered as *person-affecting* justifications (this is good for *you*).
  *   **In Ethics of Risk:** This is an **"Ex Post Justification of Ex Ante Risks."** It is permissible to justify a risk by a potential good *before* the outcome is known. It is logically incoherent to justify a *realized loss* by a *counterfactual good* that the loss prevented from materializing.

  **Proposed Name:** **"The Accessibility Mismatch"**
  **Definition:** The error of justifying a subject's exclusion from a state $S$ (e.g., belief/relationship) by citing a good $G$ that is constitutively dependent on the subject's inclusion in $S$.
  **Alternative Technical Name:** **"The State-Dependent Value Fallacy."**

  ### 2. Analysis and Nearest Neighbours

  You correctly identified what this is *not*. Here is how to distinguish it from its nearest conceptual neighbours so your students can isolate it.

  | Neighbouring Concept | How it differs from the Accessibility Mismatch |
  | :--- | :--- |
  | **Skeptical Theism** | Skeptical theism says: "We cannot know if the good justifies the evil." The Accessibility Mismatch says: "We *can* see that the good *does not* apply to this subject." It is an objection *within* the realm of known goods, not a retreat to ignorance. |
  | **The Resistance Objection** | The Resistance Objection claims the non-believer is culpable (resisting God). The Accessibility Mismatch *stipulates* non-resistance. It argues that even the *innocent* non-believer cannot receive the cited good. |
  | **The Necessity Objection** | This asks: "Could God have achieved the good *without* the hiddenness?" The Accessibility Mismatch asks: "Is the good achieved *at all* for this person?" It targets the *realization* of the value, not the *necessity* of the means. |
  | **Survivorship Bias** | Survivorship bias is an epistemic error about *data selection* (we only hear from the believers). The Accessibility Mismatch is a metaphysical/value error about *outcome realization* (the good literally does not exist for the non-believer). |
  | **The Problem of Evil (General)** | General theodicy often cites aggregate goods (e.g., natural laws). The Accessibility Mismatch highlights the slide from aggregate goods to person-affecting promises inherent in the concept of a *personal* God. |

  **The Core Mechanism:**
  The fallacy relies on **equivocation on the beneficiary**.
  1.  **Premise 1 (Personal):** God loves *this individual* and seeks relationship with *her*. (Implies person-affecting justification).
  2.  **Premise 2 (Impersonal):** Hiddenness allows for goods like "moral freedom" or "faith." (These are often goods of a *system* or goods that require *success* to be valued).
  3.  **Conclusion:** Therefore, Hiddenness is justified *for this individual*.
  4.  **The Mismatch:** The good in Premise 2 is only accessible if Premise 1 is already satisfied (i.e., she must already believe to value the faith).

  ### 3. Verdicts on Your Three Questions

  #### A. Are the two variants one phenomenon?
  **Verdict: Yes.**
  You distinguished:
  1.  Goods requiring the subject end up in relationship (e.g., loving God).
  2.  Goods requiring only awareness of separation (e.g., epistemic distance, searching).

  **Analysis:** Both variants share the same **Epistemic Precondition**.
  *   For (1), the good is impossible without belief.
  *   For (2), the good is *valueless* without belief. "Epistemic distance" is only a meaningful distance if one knows there is something on the other side. To a genuine non-believer, the "distance" is not a gap between *them and God*; it is a gap between *them and nothing*.
  *   Therefore, both variants fail for the same reason: they attribute a **relational value** to a subject who, by hypothesis, cannot stand in that relation. They are both instances of the **Accessibility Mismatch**.

  #### B. Is your "Distributive vs. Impersonal" diagnosis correct?
  **Verdict: It is the Meta-Ethical Root, but "State-Dependency" is the Logical Mechanism.**
  Your diagnosis is correct and perhaps the deepest explanation of *why* the fallacy is tempting. Theists often slide from a **Person-Affecting View** (God loves *you*) to an **Impersonal View** (A world with free seekers is better) to escape the logical trap.
  *   **The Symptom:** The justification works for the "survivors" (believers) but not the "casualties" (non-believers).
  *   **The Cause:** The theodicy treats the good as a **Public Good** (non-excludable, or at least systemically valuable) when the premise of Divine Love requires it to be a **Private Good** (benefiting the specific individual).
  *   **Refinement:** I would advise teaching it as: The **Distributive/Impersonal Slide** is the *strategic error* the theologian makes; the **Accessibility Mismatch** is the *logical error* that results.

  #### C. How far does the pattern generalize?
  **Verdict: It generalizes extensively to any teleological justification of failure.**
  This structure appears wherever a "greater good" is used to justify a specific individual's deprivation, but the good requires the deprivation be overcome to be realized.

  *   **Education:** "I failed this student to teach them the value of struggle."
      *   *Mismatch:* The educational good (learning/resilience) is only realized if the student *succeeds* in struggling. If they fail and drop out, the good is not realized *for them*. It is only a good for the *system* (standards maintained).
  *   **Medicine/Triage:** "We withheld treatment to test a protocol that will save others."
      *   *Mismatch:* This is ethically permissible only under strict impersonal utilitarianism. If the doctor claims "This is for *your* benefit" (e.g., sparing you from side effects of a futile treatment), but the patient dies wanting the treatment, the justification fails the person-affecting test.
  *   **Sports/Training:** "Your injury was necessary to build the fortitude of the team."
      *   *Mismatch:* The fortitude is the team's; the injury is the individual's. Unless the individual shares in the team's victory, the good is not distributed.

  ### 4. Pedagogical Recommendation

  For your graduate seminar, I suggest introducing the term **"The Accessibility Mismatch"** alongside the technical anchor of **"State-Dependent Value."**

  **Definition for the Syllabus:**
  > **The Accessibility Mismatch:** A fallacy in theodicy (particularly of hiddenness) where a good $G$ is cited to justify a subject $S$'s lack of relationship with God, when $G$ is constitutively dependent on $S$ having a relationship with (or awareness of) God. The justification presupposes the success it is meant to explain the absence of.

  **The "Shore" Analogy:**
  You can tell your students: "These theodicies are like justifying a shipwreck by citing the value of reaching the shore. The value of reaching the shore is real, but it is not a value available to the drowned. To apply it to the drowned is to commit the Accessibility Mismatch."

  This gives them a precise tool to cut through the "Skeptical Theism" fog and focus on the logical coherence of the value claim itself. It validates their intuition that the goods are "internal to the success cases" without requiring them to deny the value of the goods themselves.
