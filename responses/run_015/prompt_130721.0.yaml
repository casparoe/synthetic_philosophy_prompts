answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee Members; Patient Family Representatives
  **FROM:** Clinical Ethics Committee (Draft for Plenary Vote)
  **DATE:** October 23, 2023
  **SUBJECT:** Ethical Determination Regarding Request for Sustained Experiential Prosthesis (SEP) Protocol

  **1. CASE SUMMARY**
  The patient is a fifty-eight-year-old female diagnosed with rapidly advancing frontotemporal degeneration (FTD). She currently retains decisional capacity but faces a near-term prognosis of significant cognitive and functional decline. She has formally requested enrollment in the experimental "Sustained Experiential Prosthesis" (SEP) protocol. This intervention involves a long-term immersive neural interface designed to maintain subjective well-being by dynamically calibrating sensory and narrative content. Key features include the preservation of autobiographical continuity, a transparent overlay for mediated family interaction, and an "epistemic-toggle" allowing the patient to distinguish between simulated and external stimuli.

  The patient's request is grounded in a lifelong commitment to experiential well-being; she asserts that maintaining a positive subjective state is the primary moral good and wishes to transition to the SEP upon the loss of meaningful external engagement. Her family opposes the request, arguing that well-being requires objective achievement and unmediated relational presence. They contend that the SEP constitutes a calibrated illusion that abandons real relationships and request the Committee reject the protocol in favor of conventional palliative sedation.

  **2. INSTITUTIONAL GUIDELINES AND ETHICAL FRAMEWORK**
  Institutional guidelines permit experimental comfort measures provided there is "reasonable agreement that the intervention honors the patient's authentic values." The guidelines do not prescribe a specific theory of well-being (e.g., experiential vs. objective-list) for clinical adjudication. Consequently, the Committee's task is not to determine which theory of well-being is metaphysically correct, but to determine whether the patient's request falls within the scope of permissible autonomous choice and whether the family's objections necessitate a limitation of that choice to prevent harm.

  **3. ANALYSIS OF COMPETING CLAIMS**
  **The Patient's Position:** The patient argues for the primacy of experiential well-being. Her request is consistent with her historical values and current competent judgment. The SEP is not a total withdrawal from reality; the epistemic-toggle and family overlay preserve a connection to the truth and to loved ones, distinguishing this case from standard "experience machine" objections.

  **The Family's Position:** The family argues from an objective-list perspective, positing that well-being requires actual engagement with reality and authentic relationships. They fear the SEP will isolate the patient in a solipsistic loop, effectively ending the relational bond prior to biological death. They view the Committee's approval as an institutional endorsement of illusion over truth.

  **4. COMMITTEE REASONING**
  The Committee recognizes the profundity of the family's objection. The concern that well-being requires objective relational presence is a valid ethical stance. In many clinical contexts, protecting a patient from self-isolation or delusion is a priority. However, in this specific case, the Committee finds that the objective-list concern, while weighty, is not sufficient to override the patient's competent experiential commitments for the following reasons:

  First, the SEP does not eliminate relational presence but mediates it. The transparent overlay allows for interaction, and the epistemic-toggle ensures the patient retains the capacity to acknowledge the distinction between simulation and reality. This preserves a form of truth-telling that addresses the core of the family's concern regarding deception.

  Second, the institutional mandate prioritizes the patient's authentic values when capacity is present. To reject the request based solely on a competing philosophical theory of well-being would impose a specific conception of the "good life" upon a capable patient, thereby violating respect for autonomy. The patient's definition of a life worth living differs from her family's, but it is not irrational, nor is it inconsistent with her history.

  However, the Committee agrees with the family that the transition to the SEP carries significant relational risk. Unconditional approval could facilitate the very abandonment the family fears. Therefore, the "reasonable agreement" required by institutional guidelines cannot be achieved through substantive consensus on well-being, but must be achieved through a procedural framework that safeguards the relational bond.

  **5. RECOMMENDATION**
  The Committee recommends **Conditional Approval** of the patient's request for the Sustained Experiential Prosthesis protocol.

  **6. CONDITIONS OF APPROVAL**
  Approval is contingent upon the following specific safeguards, designed to honor the patient's autonomy while addressing the family's legitimate concerns regarding relational authenticity:

  *   **Structured Family Mediation:** Prior to initiation, the care team must facilitate at least two mediation sessions between the patient and family representatives. The goal is not to dissuade the patient, but to establish agreed-upon protocols for the "mediated interaction" overlay, ensuring family members retain agency in how they participate in the patient's simulated environment.
  *   **Trigger Verification:** Enrollment shall commence only upon clinical verification that the patient has lost the capacity for *meaningful external engagement* as defined by her attending neurologist and primary care proxy, ensuring the intervention is used as a bridge for decline rather than a premature withdrawal.
  *   **Epistemic-Toggle Protocol:** The clinical team must document the patient's usage of the epistemic-toggle feature weekly for the first three months. If the patient permanently disables the toggle (choosing total immersion without reality-checking), a mandatory ethics review will be triggered to reassess whether the intervention has shifted from comfort measure to delusional enclosure.
  *   **Reassessment Timeline:** This approval is valid for an initial period of six months post-initiation. A follow-up review will be scheduled to evaluate the impact on family distress and patient stability.

  **7. IMPLEMENTATION AND TIMELINE**
  If adopted at Thursday's plenary, this determination will be communicated to the attending medical team and the family by Friday at 17:00. Mediation sessions should be scheduled within fourteen days. The Committee acknowledges that this decision does not resolve the philosophical disagreement between the patient and her family. Rather, it creates a clinical space where the patient's values are respected without severing the relational ties the family seeks to protect.

  **8. ACTION REQUIRED**
  The Committee is asked to vote on the adoption of this Conditional Approval recommendation during the plenary session on Thursday, October 26.

  **Drafted By:**
  Research Fellow, Clinical Ethics Committee
  *For Committee Consideration*
