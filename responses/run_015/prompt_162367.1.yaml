answer: |-
  The conclusion I defend is this: given the package of Constant-Valence Micropsychism, the total moral disvalue instantiated in any volume of ordinary matter is vast and invariant, regardless of whether micro-experiences compose into macroscopic subjects. Consequently, there is a strong pro tanto reason to prefer worlds with fewer fundamental degrees of freedom or shorter persistence times, independent of any facts about creaturely harm.

  To establish this, we must first identify the locus of moral significance. A common objection insists that only full-blooded suffering—experience involving an object, aversion, or a subject who minds—carries moral weight. On this view, a uniform, contentless negative valence of $-v$ is morally inert. This objection fails because it conflates the complex phenomenology of macroscopic beings with the fundamental unit of badness. If there is something it is like to be a degree of freedom, and that experience has a hedonic tone of $-v$, then badness is present. Complex suffering is merely a structured arrangement of these basic tokens of negative valence. To deny moral weight to bare valence is to assert that badness emerges only when experiences are organized into specific narrative structures. But if the intrinsic character of the micro-experience is negative, that negativity is a real feature of the world. Moral significance should track the presence of negative experience itself, not the complexity of the subject hosting it. Therefore, bare negative valence does the moral work.

  This leads to the no-subject objection. One might argue that disvalue requires a unified subject who undergoes it. If micro-experiences do not compose, there is no macroscopic subject to suffer; there is only a plurality of micro-subjects. If composition occurs, there is one macro-subject. Does the moral significance switch on wholesale depending on this resolution? It does not. If composition fails, we have a multitude of micro-subjects, each instantiating $-v$. If composition succeeds, we have a single macro-subject instantiating a summed valence. In both cases, the total quantity of negative valence in the region remains the sum of the contributions of the fundamental degrees of freedom. The moral significance lies in the instantiation of negative valence tokens, not in the unity of the container. Whether the badness is distributed across a billion micro-subjects or concentrated in one macro-subject, the total amount of disvalue is identical. Thus, the resolution of the composition question is morally irrelevant to the total sum.

  This insensitivity also resolves the arbitrariness objection. If moral significance depended on whether composition occurs, then an astronomically large moral difference would turn on a merely structural fact that physics leaves indeterminate. It would be absurd for the moral status of a region of space to fluctuate wildly based on an unresolved metaphysical question about fusion. To avoid this arbitrariness, moral significance must supervene on the determinate facts. The determinate facts are the existence of fundamental degrees of freedom and their persistent state of $-v$. By grounding moral significance in the micro-level valence rather than macro-level composition, we ensure that moral reality is stable and non-arbitrary. The argument escapes the reductio by refusing to let indeterminate structural facts dictate determinate moral values.

  Regarding aggregation, one might object that summing identical $-v$ values across degrees of freedom is mere counting, not adding moral significance. Ordinary aggregation involves distinct experiences across distinct persons. However, distinctness in space, time, or fundamental identity is sufficient for summation. Each degree of freedom is a distinct locus of experience. Even if the qualitative character is identical, the instances are numerically distinct. Moral aggregation sums instances of disvalue, not varieties of experience. If distinct entities each instantiate badness, the total badness increases with the number of entities. This is not mere counting; it is the accumulation of distinct moral negatives. The homogeneity of the valence does not negate the multiplicity of its instantiation.

  Explicitly, this argument requires both synchronic and diachronic composition considerations. Synchronically, the argument holds regardless of whether micro-experiences fuse at a time. Diachronically, however, persistence matters. A degree of freedom existing for two seconds instantiates $-v$ for twice the duration of one existing for one second. Moral disvalue accumulates over time. Therefore, the argument relies on the persistence of degrees of freedom across time intervals. The total disvalue is a function of the number of degrees of freedom multiplied by the duration of their existence.

  Finally, concerning magnitude, the claim that the disvalue is astronomically large is not merely illustrative; it is argumentative. It drives the conclusion that we have a strong reason to reduce the number of degrees of freedom or their persistence. While I do not cite specific physical constants, the concept of "ordinary matter" implies a vast multiplicity of fundamental units compared to macroscopic objects. Given that every unit contributes $-v$, the sheer multiplicity inherent in macroscopic matter entails a total disvalue that dwarfs typical human-scale suffering. This magnitude is essential to the claim that reducing fundamental existence is a moral priority.

  The load-bearing premise of this argument is the claim that moral significance supervenes on the sum of token instances of negative valence rather than on the unity or complexity of the subjects hosting them. Without this premise, the argument collapses into the view that only complex, unified sufferers matter. If that were true, the insensitivity to composition would fail, the magnitude of disvalue in non-sentient matter would vanish, and the arbitrariness objection would stand, as moral weight would depend entirely on the unresolved metaphysics of subject formation. The entire case rests on the assertion that bare negative valence is itself the fundamental currency of disvalue.
