      *Self-Correction on Weakest Step:* Is it the "cheap/fast" claim? Or is it the claim that cross-cultural calibration is the "shakiest link"? Economists (like those involved in WHR) argue that once you control for income, health, etc., the residual is comparable. Philosophers of measurement might disagree. The "cheap/fast" claim is more vulnerable to empirical rebuttal (psychological stickiness of life evaluation). I'll stick with the "cheap/fast/manipulability" claim as the weakest inferential step because if life evaluation is robust against messaging, the core mechanism fails.

      *Self-Correction on GDP:* The outline says "GDP is not constituted by citizens' self-reports." This is true. The objection says "GDP fetishism reshapes how people value things." This is also true. The reply needs to distinguish between *constitutive* vs *causal* influence. Happiness metrics are *constituted* by the judgment. GDP is *causally linked* to behavior. I will advise the user to sharpen this distinction.

      *Self-Correction on Verdict:* Is it UNSOUND? No, the logic holds together. Is it SOUND? It's an outline, so "SOUND" implies no major work needed. But the prompt asks to evaluate "before I write it up." The empirical claim about manipulability is risky. "NEEDS-REVISION" is safer and more helpful.

      *Final check on formatting:* "Verdict: NEEDS-REVISION — [reason]".

  5.  **Final Polish:** Check tone and clarity. Ensure the distinction between Premise 3 and 4 is addressed in the suggestions.

      *Wait, one more check on the Weakest Step:*
      The argument relies on the idea that governments *can* shift reporting norms easily ("cheap, fast"). If life evaluation (Cantril) is actually quite stable and resistant to short-term framing (unlike affect), then the "calibration lever" doesn't exist as described. This is the crux. If the lever doesn't exist, the Goodhart argument collapses. So yes, this is the weakest step.

      *Suggestions:*
