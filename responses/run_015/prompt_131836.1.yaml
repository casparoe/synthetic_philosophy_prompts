      *   **Content Check:** Ensure I address the "cost" of revision for each tension. Ensure I don't assume attachment to (e).

      *(Self-Correction during drafting)*: I need to be careful about (d). (d) demands non-ad-hocness. (e) is the *solution* to (d). If I tell them to revise (e), I must explain how (d) is still satisfied.
      *   *Insight:* The tension is specifically between "attach to a type... in advance" (e) and "cannot say in advance which kind... it switches on" (i).
      *   *Revision:* Change (e) from "attach to a type in advance" to "be identifiable independently of the verdict." This keeps the anti-hedge requirement (d) without forcing the principlist structure that contradicts (i) and (a).

      *(Refining the Ranking)*:
      1.  (e) vs (i): Logical contradiction.
      2.  (e) vs (a)/(b): Theoretical drift toward principlism.
      3.  (d) vs (i): The risk of the case being a "hedge" if (e) is weakened.

      *(Refining Apparent Conflicts)*:
      *   (a)/(f): Dancy's point. Principles exist but are useless.
      *   (a)/(g): Supervenience is modal, Holism is normative/semantic.
      *   (b)/(h): Deference is to perception, not rules.

      *(Final Polish)*: Make sure the "Single Revision" is actionable. "Weaken Detachability."

