answer: |-
  **DEAR DR. TEMPORAL SELVES,**

  **Q:** I resolved to diet. I judged, all-things-considered, that cake was bad. Yet I ate it. I still judge it was bad. Why did I betray myself?
  **—Sincerely, Conflicted in Chicago**

  **A:** Dear Conflicted,

  You are describing a jurisdictional error between your Temporal Principals. Under the Standard View of Akrasia, you are a unified agent who acted against your own best judgment. This implies a failure of rationality. However, under Hyperbolic Discounting, you are not one agent, but a sequence of distinct selves with shifting discount rates. This implies a failure of contract enforcement.

  Our office treats these matters as intertemporal contract disputes. At t1 (resolution), your Future-Oriented Principal (high delta) signed a diet agreement. At t2 (consumption), your Present-Oriented Principal (high beta) breached the contract to maximize immediate utility. You claim you still judge the breach "bad." This suggests you are a *Sophisticate*—you anticipate the preference reversal—yet you lack binding commitment devices. A *Naif* would believe t2 you would honor t1 you's judgment. You know better, yet you lack the paperwork.

  To resolve this dynamic inconsistency, you must formalize the relationship between your temporal slices. Mere "willpower" is unenforceable verbal agreement. We recommend the following bureaucratic remedies:

  1.  **Notarized Cooling-Off Periods:** Any caloric intake above baseline requires a 24-hour waiting period filed with a third-party arbiter. This reduces the impulse discount rate by introducing transaction costs.
  2.  **Willpower Escrow:** Deposit $500 with an agent. If t2 you consumes cake, the funds are donated to an organization your t1 self despises. This aligns the financial incentives of your future selves with your current judgment.
  3.  **Mandatory Arbitration:** When the urge arises, convene a meeting between t1 and t2. Note: This is often futile, as t2 holds veto power over motor functions.

  Here lies the philosophical tension you feel. If this is merely rational time preference (Hyperbolic Discounting), t2 you is not "wrong," merely impatient. There is no failure of will, only a change in market conditions. Why, then, the guilt? But if this is Akrasia (Unified Agent), you violated your own law. Why, then, does binding your future self with escrow solve a rational failure? You are attempting to use external constraints to fix an internal judgment error. You are treating a moral failure as a breach of contract.

  We suggest filing Form 1040-T (Temporal Regret) and awaiting further guidance.

  Sincerely,
  **Dr. Temporal Selves**

  **PS:** Our model cannot explain why t1 you feels like the victim of t2's indulgence, rather than the villain who set t2 up for failure. Legally, the signer of the contract is liable. Emotionally, the eater of the cake is guilty. Until this asymmetry is resolved, all diets remain voidable.
