          *   *Score 5:* North (5 pts, 4 events), South (10 pts, 9 events).
          *   *Score 4:* North (10 pts, 6 events), South (20 pts, 15 events).
          *   *Score 3:* North (30 pts, 8 events), South (30 pts, 18 events).
          *   *Score 2:* North (35 pts, 2 events), South (30 pts, 6 events).
          *   *Score 1:* North (20 pts, 0 events), South (10 pts, 2 events).
          *   *Check Base Rates:* North 20/100 (20%). South 50/100 (50%).
          *   *Check Calibration:* Score 5 North = 80% risk. Score 5 South = 90% risk. (Close enough for a game, or I can force exact calibration to make the point stronger. Let's aim for *perfect calibration* to make the impossibility of equal error rates starker).
