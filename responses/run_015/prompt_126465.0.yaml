answer: |-
  # Workshop Design: The Triage Trilemma

  **Title:** The Triage Trilemma: A Simulation of Fairness Constraints
  **Time:** 90 Minutes
  **Participants:** 16 people (4 teams of 4)
  **Goal:** Experience the mathematical impossibility of satisfying all fairness criteria simultaneously under different base rates, and the feedback loops that follow.

  ---

  ## 1. Materials List (Carry-On Friendly)
  *   **4 Team Packets:** Each contains:
      *   1x "Patient Risk Data" sheet (Aggregate tables).
      *   1x "Decision Worksheet" (To calculate costs/benefits).
      *   1x "Audit Report" (Sealed in an envelope labeled "ROUND 1 AUDIT").
      *   1x "Round 3 Data" sheet (Sealed in envelope labeled "ROUND 3: NEXT YEAR").
      *   Pens/Sharpies.
  *   **Facilitator Kit:**
      *   Projector/Screen (for timer and final debrief slides).
      *   Whiteboard & Markers.
      *   "Audit Master Key" (Printed for you, see below).
      *   Stickers (Green for "Good Call", Red for "Bad Call" - optional visual aid).
  *   **Room:** 4 tables clustered together.

  ---

  ## 2. The Data (For Your Packets)

  *Note: The numbers below are engineered to demonstrate the impossibility theorem. Do not change them.*

  ### The Scenario
  You are a committee allocating  scarce "Care Coordination" slots.
  *   **Budget:** You have slots for roughly 40% of patients.
  *   **Goal:** Enroll patients who will have a "High Risk Event" (Sick).
  *   **Payoff:**
      *   True Positive (Sick patient enrolled): **+10 Points** (Life saved).
      *   False Positive (Healthy patient enrolled): **-5 Points** (Wasted resource).
      *   False Negative (Sick patient missed): **0 Points** (Status quo).
      *   True Negative (Healthy patient missed): **0 Points**.

  ### The Populations (Handout Data)
  *Give teams this table. It shows historical data from last year.*

  | Risk Score | **North Hospital** (Count) | **North** (Sick %) | **South Clinic** (Count) | **South** (Sick %) |
  | :--- | :---: | :---: | :---: | :---: |
  | **5 (High)** | 10 | 90% | 40 | 90% |
  | **4** | 10 | 90% | 20 | 90% |
  | **3** | 30 | 40% | 20 | 40% |
  | **2** | 30 | 10% | 10 | 10% |
  | **1 (Low)** | 20 | 0% | 10 | 0% |
  | **TOTAL** | **100** | **23% Base Rate** | **100** | **54% Base Rate** |

  *(Facilitator Note: The Score is perfectly calibrated. A Score of 5 means 90% risk in both groups. A Score of 3 means 40% risk in both groups. The base rates differ because South has more high-scoring patients.)*

  ### Facilitator Master Key (DO NOT DISTRIBUTE)
  *Use this to verify their math or populate the projector during debrief.*

  **If Cutoff is Score 3+ (Enroll 3, 4, 5):**
  *   **North:** Enroll 50. TP=38, FP=12. Score: (38*10) - (12*5) = **320 pts**.
      *   False Positive Rate (FP/Healthy): 12/77 = **15.5%**
      *   False Negative Rate (FN/Sick): 7/23 = **30.4%**
  *   **South:** Enroll 80. TP=72, FP=8. Score: (72*10) - (8*5) = **680 pts**.
      *   False Positive Rate (FP/Healthy): 8/46 = **17.4%**
      *   False Negative Rate (FN/Sick): 2/54 = **3.7%**
  *   *Observation:* FPR is close (15% vs 17%), but FNR is wildly different (30% vs 4%). South is much safer.

  **If Cutoff is Score 4+ (Enroll 4, 5):**
  *   **North:** Enroll 20. TP=18, FP=2. Score: (18*10) - (2*5) = **170 pts**.
      *   FPR: 2/77 = **2.6%**
      *   FNR: 5/23 = **21.7%**
  *   **South:** Enroll 60. TP=54, FP=6. Score: (54*10) - (6*5) = **510 pts**.
      *   FPR: 6/46 = **13.0%**
      *   FNR: 6/54 = **11.1%**
  *   *Observation:* FNR is closer (21% vs 11%), but FPR is now very different (2.6% vs 13%). North is being "over-protected" from false alarms, South is bearing the burden.

  **If Cutoff is Score 5+ (Enroll 5 only):**
  *   **North:** Enroll 10. TP=9, FP=1. Score: **85 pts**.
      *   FPR: **1.3%** | FNR: **60.8%**
  *   **South:** Enroll 40. TP=36, FP=4. Score: **340 pts**.
      *   FPR: **8.7%** | FNR: **33.3%**

  ---

  ## 3. Minute-by-Minute Timeline

  **00:00 – 00:05 | Intro & Setup**
  *   Divide into 4 teams.
  *   Hand out Packets. Tell them: "You are the Ethics & Efficiency Committee. You must pick a Risk Score cutoff. Everyone with that score or higher gets care. You want to maximize Points."
  *   **Rule:** You must pick **one** cutoff number (1-5) that applies to *both* North and South.
  *   **Constraint:** You cannot see individual names, only the aggregate table.

  **00:05 – 00:25 | Round 1: The Single Threshold**
  *   Teams discuss and pick a cutoff (e.g., "We choose 3").
  *   They calculate their estimated points on the Worksheet.
  *   **The Audit:** Collect decisions. Open the "ROUND 1 AUDIT" envelopes (which you pre-filled based on the Master Key above) or project the results from the Master Key.
  *   **Task:** Compare your Points vs. the other teams. Then, look at the FPR/FNR stats provided in the audit.
  *   *Prompt:* "Did anyone manage to make the False Negative Rate equal for North and South? Did anyone make the False Positive Rate equal?" (Answer: No).

  **00:25 – 00:45 | Round 2: The Escape Hatch**
  *   **New Rule:** You are now allowed to set **two** cutoffs. One for North, one for South.
  *   **Goal:** Maximize Points, *but* you must get the False Negative Rates within 5% of each other.
  *   Teams recalculate. They will discover that to match FNR, North needs a lower threshold (e.g., 3+) and South needs a higher threshold (e.g., 5+).
  *   **The Catch:** Once they commit, reveal the "Individual Fairness" violation.
  *   *Script:* "Look at Patient A in North (Score 4) and Patient B in South (Score 4). You enrolled A, but rejected B. Same score. Different outcome. Why?"
  *   Let them sit with that discomfort for 2 minutes.

  **00:45 – 01:00 | Round 3: The Fog of War (Feedback Loop)**
  *   **Scenario:** It is next year. You need to re-train the model.
  *   **Constraint:** You only observe outcomes for patients you *enrolled*. (If you didn't enroll them, they went elsewhere, and you lost track).
  *   **Twist:** The Care Program works. 50% of the "Sick" patients you enrolled are now "Healthy" next year.
  *   Hand out "ROUND 3: NEXT YEAR" envelopes.
  *   **The Data:** The table is updated. The "Sick %" for the enrolled groups has dropped artificially because the treatment worked.
      *   *Example:* South Score 5 used to be 90% sick. You enrolled them. Treatment worked. Now the data says Score 5 is only 45% sick.
  *   **Task:** Pick a new cutoff based on this *biased* data.
  *   **Result:** They will likely lower the threshold for South because the data looks safer, missing the sick people who weren't treated last time. The bias amplifies.

  **01:00 – 01:30 | Debrief & The Five-Minute Talk**
  *   See Section 5 below.

  ---

  ## 4. Payoff Scheme (Non-Monetary)
  *   **Currency:** "Reputation Points."
  *   **Leaderboard:** Draw a simple bar chart on the whiteboard.
  *   **Winning:** The team with the most points *that also* met the fairness constraint in Round 2 wins "Editorial Discretion" (a bag of nice coffee or chocolates).
  *   **Why:** It creates low-stakes competition to mimic the pressure editors feel (traffic/budget vs. ethics).

  ---

  ## 5. The Debrief Guide (Mapping Moments to Concepts)

  Do not lecture. Ask questions and write their answers on the board. Then map them.

  **Phase 1: The Trilemma (Round 1)**
  *   *Ask:* "In Round 1, could anyone get the Error Rates to match?" (No).
  *   *Ask:* "Why? You all had the same table."
  *   *Reveal:* "Because the Base Rates were different. North had fewer sick people to begin with."
  *   *Concept:* **Impossibility Theorem.** When base rates differ, you cannot have Calibration + Equal FPR + Equal FNR simultaneously. You must choose which fairness definition to violate.

  **Phase 2: The Cost of Parity (Round 2)**
  *   *Ask:* "In Round 2, you fixed the Error Rates. How?" (Different cutoffs).
  *   *Ask:* "What was the cost?" (Same score, different treatment).
  *   *Concept:* **Individual Fairness vs. Group Fairness.** To treat groups equally (statistically), you must treat individuals unequally (based on group label). This is the legal/ethical "escape hatch" that feels like discrimination.

  **Phase 3: The Feedback Loop (Round 3)**
  *   *Ask:* "What happened to the South data in Round 3?" (It looked safer).
  *   *Ask:* "Why?" (Because you treated them).
  *   *Concept:* **Runaway Feedback.** If you only learn from treated patients, and treatment works, the model learns that the treated group is "low risk" and stops treating them. This creates a self-fulfilling prophecy of neglect for the untreated.

  **Phase 4: The Blandness Problem**
  *   *Ask:* "I called them North and South. Why was that annoying?"
  *   *Concept:* **Context Stripping.** Algorithms strip context (race, income, zip code) and replace it with proxies (North/South). By making the groups bland, I made the math clean, but I hid the *reason* for the base rate difference. In the real world, base rate differences aren't natural; they are historical.

  ---

  ## 6. Troubleshooting: What Will Go Wrong

  **1. The Algebraist**
  *   *Behavior:* Someone immediately calculates the exact optimal cutoff using the percentages in the first minute.
  *   *Fix:* Validate them. "Great, you've optimized for Efficiency. Now, does that optimize for Fairness? Check the Audit stats." Keep them focused on the *trade-off*, not the maximization.

  **2. The Opt-Out**
  *   *Behavior:* "This is stupid. We shouldn't use algorithms. We should just treat everyone."
  *   *Fix:* "That is a valid policy position. But for this game, Resources are Scarce (Budget Constraint). If you treat everyone, you bankrupt the hospital and close next year. You *must* ration. How do you ration?"

  **3. The Inventor**
  *   *Behavior:* "We invented a new metric: Weighted Risk-Adjusted Parity."
  *   *Fix:* Write it on the board under "New Criteria." Tell them: "That's a great contribution to the field. For the sake of the simulation, does your new metric solve the Base Rate math problem, or does it just hide it?"

  **4. The Cynic**
  *   *Behavior:* "This is rigged. You made the numbers this way."
  *   *Fix:* Agree. "Yes, I rigged the numbers to demonstrate a mathematical theorem. In the real world, the numbers are rigged by history. The math doesn't care *why* the base rates differ, only *that* they differ."

  ---

  ## 7. Limitations: The "Five-Minute Talk"

  *At the very end, you must step out of the game facilitator role and speak as a journalist/expert. Keep this under 5 minutes. No slides.*

  **Script:**
  "I want to be honest about what this game just did, and what it didn't do.

  First, what it **did** show: The tension you felt between Round 1 and Round 2 is not a bug in your logic. It is a feature of the math. When two groups have different underlying risks (base rates), a single cutoff *cannot* be fair by all definitions. You have to choose: Do you want equal error rates? Or do you want the score to mean the same thing for everyone? You cannot have both.

  Second, what it **didn't** show: This game makes the base rate difference look like a natural fact. 'North has 23% risk, South has 54% risk.' In the real world, base rates are not weather. They are history. They are the result of who had access to care last decade, who was exposed to pollution, who was trusted by the medical system. The math treats the base rate as an input. Journalism treats the base rate as a story.

  Third, the Feedback Loop: In Round 3, you saw how the data gets corrupted. In reality, this happens silently. If an algorithm denies a loan, you never learn if they would have paid it back. The algorithm becomes convinced the denied group is risky, because it has no data proving otherwise.

  Your job isn't to solve the math. The math has no solution. Your job is to report on *which* unfairness the humans in charge chose, and who paid the price for that choice."

  ---

  ## 8. Why This Design Works for This Audience
  1.  **No Lectures:** They do the math (or see the results of their math) themselves.
  2.  **Skeptic-Proof:** It acknowledges the "biased algorithm" trope they are tired of and digs one layer deeper into *why* fixing it is hard.
  3.  **Bland Groups:** Prevents immediate polarization on race/gender, allowing the *structural* problem to surface first, then reintroduces the social context in the debrief.
  4.  **Feedback Loop:** This is the "scoop" angle. Most fairness discussions stop at the static snapshot. Showing how data decays over time gives them a new narrative hook.

  ## 9. Print-Ready Data for Round 3 (Facilitator Eyes Only)
  *If teams chose Cutoff 3+ in Round 2 (Most likely optimal for points):*
  *   **North Enrolled:** 50 patients. 38 were Sick. Treatment cures 50% (19 people).
      *   *New Observed Data for North Score 3+:* 19 Sick / 50 Total = **38% Risk** (Down from 53%).
  *   **South Enrolled:** 80 patients. 72 were Sick. Treatment cures 50% (36 people).
      *   *New Observed Data for South Score 3+:* 36 Sick / 80 Total = **45% Risk** (Down from 60%).
  *   **The Trap:** The South group still looks riskier than North, but *less* risky than before. If they used Group-Specific thresholds in Round 2, the data distortion will be uneven, making future calibration impossible.

  *(Print the Round 3 Handout with these "Observed" percentages, labeling them "Updated Risk Estimates.")*
