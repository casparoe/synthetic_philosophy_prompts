          *   *South:* Enroll 80. TP=52. FP=10. FPR = 10/46 (Healthy S) = 21%. FNR = 2/54 (Sick S) = 3.7%.
          *   *Result:* FPR is close (18 vs 21), FNR is wildly different (30 vs 3.7).
          *   *If they move cutoff to Score 3:*
          *   *North:* Enroll 10. TP=8. FP=2. FPR = 2/77 = 2.5%. FNR = 15/23 = 65%.
          *   *South:* Enroll 50. TP=40. FP=10. FPR = 10/46 = 21%. FNR = 14/54 = 25%.
          *   *Result:* FPR differs (2.5 vs 21). FNR differs (65 vs 25).
          *   *Conclusion:* You can't match them both with one cutoff.
      *   *Okay, I will use these numbers in the final output.*

  10. **Refining the "Feedback Loop" (Round 3):**
      *   If they enroll a patient, treatment works 50% of the time for the "Sick" patients.
      *   So, if they enroll Score 3 South (40 sick), next year 20 appear "Healthy."
      *   The data they get for Round 3 should reflect this *observed* risk, not *true* risk.
      *   This makes the South group look safer than they are, encouraging under-enrollment next time.

  11. **Final Review against Constraints:**
