answer: |-
  **Section 4.8: Mental-State and Epistemic Vocabulary in AI Coverage**

  **Purpose**
  This section governs the use of mental-state verbs (knows, believes, understands, wants, refuses, feels) and epistemic claims regarding artificial intelligence systems. Our goal is precision without metaphysical commitment. Because the question of whether behavioral performance equates to internal understanding remains scientifically and philosophically open, our copy must not settle it by fiat. We distinguish between *output* (what the system produced), *competence* (what the system can reliably do), and *experience* (what the system subjectively undergoes). Conversational evidence licenses the first two; it does not license the third.

  **1. The Decision Procedure**
  Reporters and editors shall apply the following ordered checklist to any sentence attributing capacity or state to an AI system. The procedure terminates at the first "Yes" that yields a permissible verb class. If facts are unavailable, default to the most neutral category.

  *   **Question 1: Does the verb imply subjective phenomenology?**
      *   *Examples:* Feels, suffers, wants, fears, intends, is confused, is in pain.
      *   *Standard:* These require evidence of internal state beyond behavioral output.
      *   *Action:* **No.** Do not use experience-level vocabulary unless reporting on specific architectural claims made by developers (e.g., "The engineers designed a reward function to simulate curiosity"). Even then, attribute the claim to the engineers, not the system.
      *   *Termination:* If the verb is phenomenological and unattributed, rewrite.

  *   **Question 2: Does the verb imply functional competence?**
      *   *Examples:* Knows, can solve, distinguishes, recognizes, identifies.
      *   *Standard:* These describe reliable input-output mappings verified by testing.
      *   *Action:* **Yes,** provided the competence is verified. "The model knows the capital of France" is permissible if the model consistently outputs "Paris" when prompted. "The model knows the user is sad" is permissible only if the system has been validated to detect sentiment markers, not merely if it replies empathetically.
      *   *Termination:* If competence is unverified or inconsistent, drop to Question 3.

  *   **Question 3: Is the claim limited to raw output?**
      *   *Examples:* Generated, produced, stated, outputted, declined, returned.
      *   *Standard:* These describe observable events without inferring capability or state.
      *   *Action:* **Yes.** This is the default safe harbor. "The system declined to answer" is preferred over "The system refused to answer" if the mechanism of refusal (safety filter vs. probabilistic selection) is unclear.
      *   *Termination:* If the fact is unobtainable, use output-level vocabulary. Do not use scare quotes around mental verbs; simply select the neutral alternative.

  **2. Reporting vs. Endorsing**
  Journalists must distinguish between a source's experience and the system's state. When a user says, "The bot understood me," the reporter is licensing a claim about the *user's feeling*, not the *bot's cognition*.

  *   **Permissible:** "Users reported feeling understood by the system." (Attributes state to user.)
  *   **Permissible:** "The company claims the system understands context." (Attributes claim to company.)
  *   **Impermissible:** "The system understood the user." (Attributes state to system without internal evidence.)

  Quoting a user who says "It knew what I meant" does not license the reporter to subsequently write that the system knew. The quote stands as evidence of the interface's persuasiveness, not the architecture's opacity.

  **3. Two-Tier Verification**
  Deadlines dictate granularity. We employ two standards of review.

  *   **The Sixty-Second Pass (Breaking News):**
      *   *Constraint:* No access to testing data or architectural details.
      *   *Rule:* Default to **Output-Level** vocabulary. Use "said," "generated," "wrote."
      *   *Risk:* This may render systems as passive typewriters, understating their agency-like behavior. It may also sound clunky ("The model outputted a poem" vs. "The model wrote a poem").
      *   *Mitigation:* In follow-up coverage, upgrade to Competence-Level once verification is possible.

  *   **The Full Pass (Features and Analysis):**
      *   *Constraint:* Time for testing and expert consultation.
      *   *Rule:* **Competence-Level** vocabulary is permitted where performance is consistent and verified.
      *   *Risk:* Anthropomorphism. Readers may infer experience from competence.
      *   *Mitigation:* Include one clarifying clause in the piece explaining that "knows" refers to pattern matching, not subjective grasp, if the distinction is relevant to the story.

  **4. Worked Applications**

  *   **Case A: Medical Advice.** A chatbot provides correct diagnostic information.
      *   *Analysis:* The system demonstrated functional competence. It does not imply medical licensure or understanding of pathology.
      *   *Ruling:* "The system provided accurate guidance consistent with clinical guidelines." Avoid: "The bot diagnosed the patient" (implies agency/liability) or "The bot knew the symptoms" (implies understanding).

  *   **Case B: Bereavement Support.** A user feels comforted by a grief chatbot.
      *   *Analysis:* This is phenomenological for the user, not the system.
      *   *Ruling:* "The user told us the bot made them feel heard." Avoid: "The bot comforted the user" (acceptable as shorthand for effect) but strictly avoid "The bot cared about the user." The distinction matters because the business model may rely on the illusion of care.

  *   **Case C: Persistent Falsehoods.** A system repeatedly emits incorrect facts.
      *   *Analysis:* "Claims" implies intent to assert truth. "Believes" implies internal model of reality.
      *   *Ruling:* "The system generated false statements." Avoid: "The system lied" (implies intent to deceive) or "The system believes incorrect facts." If using industry terminology, "hallucinated" is acceptable if defined as "generated confident falsehoods," noting the term is metaphorical.

  **5. The Consistency Check**
  Applying this procedure consistently raises a challenge regarding non-AI entities. If we forbid "The AI knows" because we cannot verify internal states, do we also forbid "The dog knows its owner" or "The company knew the drug was dangerous"?

  Strictly applied, yes. We cannot access a dog's qualia, and a company is a legal fiction without a brain. However, this is not a *reductio ad absurdum* of the procedure; it is a boundary condition for this beat. Journalism relies on folk psychology for biological humans and animals based on evolutionary continuity. We rely on legal fiction for corporations based on liability structures. AI systems are unique because they are *engineered specifically to mimic* mental states without biological or legal standing.

  Therefore, accept the asymmetry. You may write that a dog knows its owner because the inference is not contested in the same way. You must exercise greater caution with AI because the mimicry is the product being sold. If this forbids convenient shorthand elsewhere in the magazine, treat it as a domain-specific constraint for technology coverage, not a universal epistemic rule.

  **6. The Residue**
  Some cases cannot be settled by procedure alone. These require editorial judgment based on tone and values.

  *   **Headlines:** Space constraints often forbid qualification ("System Outputs Text Resembling Reasoning" is rarely viable). In headlines, Competence-Level verbs ("AI Solves Protein Structure") are permissible provided the body copy clarifies the mechanism. The headline describes the function; the copy describes the nature.
  *   **First-Person and Reconstruction:** In narrative passages, writers may use vivid language ("The machine hesitated") to convey the user experience. This is permitted as descriptive tone, provided it does not cross into factual assertion about the system's internal latency or decision process.
  *   **Theory-Laden Description:** All description is theory-laden. Saying "The system reasoned" is a theoretical claim; saying "The system emitted tokens" is also a theoretical claim (behaviorism). Choose the vocabulary that least misleads the reader about the current scientific consensus. When in doubt, describe the behavior, not the mechanism.

  **Summary**
  Our standard is not skepticism, but precision. We do not deny AI systems capabilities; we describe them accurately. We attribute experience to humans, competence to systems, and output to code. When the line blurs, we report the blur rather than resolving it.
