      *   *Moving Baseline Problem:* If everyone enhances, "normal" shifts up. What was enhancement becomes the new baseline. Therapy then means getting someone up to this new, higher baseline. This creates a "red queen" effect (running to stay in place) and makes the distinction unstable.
      *   *Application to Gattaca:* "Valids" are enhanced (genetically edited). "In-valids" are natural (faith births). The question is whether "in-valid" is treated as a disability needing therapy or just an inferior caste, and whether the definition of "normal" has shifted so that being natural is inherently "disabled."

