  Your framing is significantly off regarding the KK principle: Williamson does not use KK to disprove luminosity; he uses the failure of luminosity to argue *against* KK, relying on a **Margin for Error** (Safety) principle instead. Additionally, the argument doesn't require knowing the cutoff, but rather that indiscriminability at the boundary makes knowledge unsafe.

  Here is the credence breakdown for Williamson's *actual* Margin-for-Error argument, which is the only coherent version of the route you described:

  *   **Probability knowledge requires a margin for error in phenomenal states:** 0.75 (This is the most contested premise, as some argue self-knowledge is immune to this constraint.)
  *   **Probability phenomenal states shift gradually without sharp boundaries:** 0.90 (Phenomenological evidence for indiscriminable adjacent cases is very strong.)
  *   **Probability gradualism plus margin-for-error entails non-luminosity:** 0.95 (The logical derivation from these premises to the failure of luminosity is robust.)

  **Overall Credence:** 0.64

  **Least Sure Component:** I am least sure about the first premise (Margin for Error applies to self-knowledge), as internalists argue phenomenal awareness bypasses externalist safety conditions.

  **Evidence to Move Me:** A demonstrated account of how one can have unsafe beliefs about one's own current phenomenology without losing the status of knowledge, or empirical evidence that phenomenal states have sharp, discriminable boundaries.
