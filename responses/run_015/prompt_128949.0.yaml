answer: |-
  You are mixing up Buddhist soteriology (the path to liberation) with secular normative ethics, and your friend is simplifying karma into a moral scorecard. In Buddhism, karma is about intention conditioning the mind, not a cosmic justice system rewarding "good" outcomes. Your friend is right that intention is primary for karma, but wrong that outcomes don't matter for compassion (karuṇā). You are right that reducing suffering is central, but wrong that Buddhism is purely consequentialist; the precepts are constraints, not just rules of thumb.

  Your intuitions are actually quite consistent with **Threshold Deontology with Special Obligations**, not pure Buddhism or pure Utilitarianism. You believe in maximizing good *unless* it crosses a line (killing innocents) or violates a specific duty (family).

  To make your principle clean, you must drop **Verdict 2 (donating savings vs. kid)**. You cannot claim special obligations protect the sick parent (Verdict 4) and the healthy patient (Verdict 3) but not your own child. In almost every ethical system, including Buddhist lay ethics, duty to dependents outweighs aggregate utility for strangers. Keeping Verdict 2 makes you a Utilitarian; keeping Verdicts 3 and 4 makes you a Deontologist regarding duties. They contradict.

  **The Principle:** "Act to reduce suffering unless doing so requires directly killing an innocent human or violating a special relational duty."

  **The Assassination Case:** Under this principle, assassinating the tyrant is **permissible**. The tyrant is an aggressor, not an "innocent human used as a means" (like the surgeon's patient), and you have no special relational duty to protect them. However, strictly speaking in Buddhist terms, this act still generates negative karma for the assassin because the intention involves violence, even if motivated by compassion. A Bodhisattva might do it knowing they will suffer karmic consequences to spare others, but it is not "karma-free" just because the outcome is good.

  \answer{Compassionate harm reduction constrained by non-instrumentalization and special obligations}
  Your intuitions form a consistent hybrid ethic only if you prioritize familial duties over abstract utility, which permits assassinating aggressors but forbids sacrificing innocents or dependents.
