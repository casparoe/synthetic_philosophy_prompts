answer: |-
  You are correct that counting true versus false consequences fails for false theories, but measuring distance from actual values avoids this collapse.

  **Protocol for Assessing Model Truthlikeness**

  **Step 1: Declare the Target and Grain**
  Before comparing models, the team must define the 'target state of affairs'. This is not the data used for fitting, but the physical reality the models aim to describe. You must specify:
  *   **Quantities:** e.g. effective reproduction number, seroprevalence, hospitalisation rate.
  *   **Population:** e.g. whole population, age-stratified, risk-grouped.
  *   **Time Window:** e.g. epidemic peak, seasonal total, weekly trajectory.
  *   **Resolution:** e.g. aggregate totals versus individual transmission chains.

  **[JUDGMENT FLAG 1]** The choice of resolution determines the ranking. A model cannot be 'truer' than another without specifying the grain of description. This choice must be justified by the planning need, not convenience.
  **Sign-off:** Senior Epidemiologist must approve the Target Definition before scoring begins.

  **Step 2: Structural Audit (Causal Correctness)**
  Separate the mechanism from the output. For each key transmission mechanism (e.g. asymptomatic spread, waning immunity, age-mixing), assign a structural score:
  *   **1 (Present and Correct):** Mechanism exists and directionality matches evidence.
  *   **0.5 (Present but Uncertain):** Mechanism exists but parameters are unconstrained.
  *   **0 (Absent or Wrong):** Mechanism omitted or directionality contradicts evidence.

  **[JUDGMENT FLAG 2]** Deciding what counts as a 'key mechanism' is subjective. Omitting a minor pathway is not a structural error; omitting a dominant one is.
  **Sign-off:** Senior Epidemiologist must approve the list of Key Mechanisms.

  **Step 3: Numerical Distance (Value Correctness)**
  For the quantities defined in Step 1, calculate the error between the model's output and the best available estimate of reality (not the fitted data). Use a normalised distance metric (e.g. mean absolute percentage error).
  *   **Structural Penalty:** If a model scores 0 on a Key Mechanism in Step 2, apply a penalty multiplier to its numerical error for any quantity dependent on that mechanism.

  **Step 4: Comparison Rule**
  Rank models by lowest combined score (Structural + Numerical).
  *   **Condition for 'Cannot be Ranked':** If Model A is structurally superior but numerically worse, and Model B is numerically superior but structurally worse, and the difference in both domains exceeds the agreed tolerance threshold, the output must be 'Unranked'. Do not force a choice where trade-offs are incomparable.

  **[JUDGMENT FLAG 3]** Setting the tolerance threshold and the weight between structure and numbers is arbitrary. There is no formula for how much numerical accuracy compensates for a missing causal pathway.
  **Sign-off:** Senior Epidemiologist must sign off on the weighting scheme and any 'Unranked' decisions.

  **Step 5: Sensitivity Check (Language Dependence)**
  Re-run the comparison twice: once with a coarser partition (e.g. merging age bands) and once with a finer partition (e.g. splitting seasons).
  *   **Report:** If the ranking flips when the description of the world is changed without changing the underlying physics, flag the result as 'Unstable'. This indicates the ranking depends on vocabulary, not truth.

  **Step 6: Warning on Fit and Utility**
  **Explicit Warning:** A high truthlikeness score does not guarantee the best fit to last season's surveillance data, nor does it guarantee the most useful model for capacity planning. A simple wrong model may be more robust for decision-making than a complex true one. This procedure assesses *description*, not *utility*. Do not conflate them in the final statement.

  ***

  **Application to Current Cases**

  **Case (i): Waning vs. Asymptomatic**
  Model A has the correct waning rate but omits asymptomatic transmission. Model B includes asymptomatic transmission but with a badly wrong rate.
  *   **Target:** Seasonal incidence by age.
  *   **Audit:** Model A scores 0 on asymptomatic structure (Key Mechanism). Model B scores 0.5 (present but wrong rate).
  *   **Distance:** Model A fits peak timing well; Model B fits total burden poorly.
  *   **Result:** Because asymptomatic transmission drives a significant portion of spread, Model A's structural zero triggers a penalty. Model B is structurally closer despite numerical error.
  *   **Verdict:** Model B is ranked higher on truthlikeness, despite worse fit. This must be explained clearly to avoid confusion with predictive accuracy.

  **Case (ii): Coarse Agreement, Fine Disagreement**
  Two models agree on seasonal peak and total burden but disagree on who infects whom (age-mixing matrices).
  *   **Target:** Weekly age-stratified incidence (Fine Grain).
  *   **Audit:** Both score 1 on coarse mechanisms. They differ on age-mixing structure.
  *   **Distance:** Coarse quantities show zero distance. Fine quantities show large distance between models.
  *   **Result:** At coarse grain, they are tied. At fine grain, the model matching serological contact surveys ranks higher.
  *   **Verdict:** Rank based on the fine grain only if the planning decision requires age-specific targeting. If planning is for total bed capacity, declare 'Cannot be Ranked' as the difference is irrelevant to the Target.

  **Case (iii): The Favourite vs. The Rival**
  Our team's favourite model fit last year's data best and underpins current careers. The rival model has a more realistic contact structure but fits last year poorly.
  *   **Target:** Transmission dynamics over the coming season.
  *   **Audit:** Favourite model uses static contact rates (Structural score 0 for behaviour change). Rival uses dynamic rates (Structural score 1).
  *   **Distance:** Favourite has low numerical error on past data. Rival has higher error on past data.
  *   **Sensitivity:** When splitting the time window to isolate the behavioural change period, the Favourite's error spikes; the Rival's remains stable.
  *   **Verdict:** The procedure ranks the Rival higher on truthlikeness because the Favourite's fit relies on compensating errors that are unlikely to hold in a new season.
  *   **Outcome:** Unwelcome. The Favourite loses the truthlikeness ranking. The statement must record this without implying the Favourite is useless for other purposes.

  ***

  **Limitations of this Procedure**

  This procedure cannot identify the absolute truth. It only ranks available options relative to a specified description of the world. It cannot resolve disputes where the 'Target' itself is contested; if the team disagrees on whether age-structure matters, no metric will reconcile them. It does not account for computational cost or ease of implementation. Finally, it cannot protect against systemic error: if all four models share a false assumption (e.g. homogeneous mixing), the procedure will rank the least wrong one, but still recommend a false tool. It is a tool for choosing between imperfections, not for validating reality. Use it to justify selection, not to claim correctness.
