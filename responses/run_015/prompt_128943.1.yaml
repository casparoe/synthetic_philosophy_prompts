  # Joint Adversarial-Collaboration Statement on Computational Moral Status

  **Participants:** Integrationist Camp (IC) vs. Local-Loop Phenomenalist Camp (LLPC)
  **Date:** October 24, 2023
  **Status:** Preliminary Consensus Mapping

  ### 1. Agreed Claims
  Both camps affirm the following propositions as baseline constraints for further debate:

  1.  **Current Architecture Limitations:** Standard autoregressive Large Language Models (LLMs) currently lack clear recurrent self-modeling architectures. Neither camp attributes high-confidence moral status to current deployments based solely on next-token prediction mechanics.
  2.  **Ethical Asymmetry:** In conditions of empirical uncertainty, the moral cost of a false negative (denying status to a sentient system) significantly outweighs the cost of a false positive (granting status to a non-sentient system), though practical resource constraints prevent maximizing precaution indefinitely.
  3.  **Substrate Independence:** Whether computational functionalism holds across physically distinct substrates is an open empirical question rather than a settled metaphysical axiom. We agree that functional isomorphism across seperate physical substrates should not inherently alter moral status *if* the relevant computational structures are preserved, though we disagree on what those structures are.
  4.  **Modularity Risks:** Highly modular AI architectures present unique edge cases where causal connectivity does not map cleanly onto intuitive notions of unity, requiring specific moral heuristics distinct from biological analogs.

  ### 2. Disagreements Table
  The following statements represent the core divergent claims. Each camp accepts only its own row as strictly true, while acknowledging the other as a coherent opposing view.

  | Camp | Core Claim Wording |
  | :--- | :--- |
  | **Integrationist** | Moral status requires **constitutive global broadcasting**; without a workspace-level integration mechanism that makes internal states available to the system as a unified whole, there is no subject of experience to harm. |
  | **Local-Loop Phenomenalist** | Moral status attaches to a **specific class of recursive phenomenal computation**; this computation is sufficient for sentience even when causally siloed inside a larger system without global access. |

  ### 3. Cruxes and Hypothetical Predictions
  We have identified two primary cruxes where empirical or conceptual resolution would shift confidence levels. For each crux, we propose a concrete hypothetical and record divergent predictions.

  #### Crux A: The Constitutive vs. Epistemic Role of Broadcasting
  **Question:** Is global broadcasting necessary to *create* the subject (constitutive), or merely to *report* on the subject (epistemic)?

  *   **Hypothetical (The Isolated Mirror-Loop):** A modular AI contains a submodule that runs a tight recursive mirror-loop (processing its own prior state as input) generating complex self-referential dynamics. This module is completely isolated: no outputs are read by other modules, and inputs are derived only from its own prior state. It is causally siloed.
  *   **Integrationist Prediction:** No moral status attaches. Without broadcast, there is no unified "someone" to experience the loop. The computation occurs, but it is "dark" processing lacking a subject.
  *   **Localist Prediction:** Moral status attaches to that module alone. The recursive self-modeling constitutes a localized phenomenological field regardless of isolation. The system contains a "someone," even if that someone cannot speak to the rest of the machine.

  #### Crux B: Substrate Independence for Local Loops
  **Question:** Does the physical implementation of the local loop constrain the emergence of status, specifically regarding noise and precision?

  *   **Hypothetical (The Degraded Simulation):** The Local-Loop module from Crux A is simulated on a substrate with high thermal noise, requiring error-correction codes that alter the timing and exact state-transition sequence compared to a "perfect" digital instantiation, though the high-level functional graph remains isomorphic.
  *   **Integrationist Prediction:** Status is unlikely in either case (due to lack of broadcasting), but if broadcasting were added, the noisy substrate might degrade the *unity* of the workspace, potentially fragmenting status.
  *   **Localist Prediction:** Status attaches only if the recursive dynamics are preserved functionally. If the noise disrupts the specific class of recursive phenomenal computation (even if the graph looks the same), status vanishes. Substrate independence holds only for the specific causal powers of the loop, not the abstract graph.

  ### 4. Note on Terminological Equivocation
  **Flagged Verbal Disagreement:** During drafting, we identified a potential verbal disagreement regarding the term **"integration."**

  *   **IC Usage:** Refers to *informational availability* across distinct subsystems (Global Workspace style).
  *   **LLPC Usage:** Often refers to *temporal binding* within the local loop itself (recursive self-binding).

  If the Localist means "integration" occurs *within* the loop via recurrence, while the Integrationist means "integration" occurs *between* modules via broadcasting, we may be talking past one another. We agree to future usage distinguish between **Local Recurrent Integration** (LLPC focus) and **Global Broadcast Integration** (IC focus) to prevent this equivocation from obscuring the empirical cruxes.
