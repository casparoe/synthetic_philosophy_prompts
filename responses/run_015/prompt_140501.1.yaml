answer: |-
  ### The Handout: Two Arguments

  **Argument A (The Clinic)**
  1. This human heart valve is calcified.
  2. Calcified valves restrict blood flow and reduce organism survival.
  3. **Therefore, this valve ought not be calcified.**

  **Argument B (The Workshop)**
  1. This hydraulic filter mesh is clogged.
  2. Clogged meshes restrict fluid flow and prevent system operation.
  3. **Therefore, this mesh ought not be clogged.**

  ***

  ### The Walkthrough

  **Why Argument A Cheats**
  A defender of the gap says Argument A commits the naturalistic fallacy at the inference step. Premises 1 and 2 are purely biological descriptions; a vet can verify the calcification and the flow rate with a meter. But nowhere in those premises is there a rule saying *survival is good* or *biology is binding*. The argument treats a statistical fact about mammal physiology as if it were a legislative rule. It smuggles a "good" (survival) into a "is" (blood flow) without justification.

  **Why Argument B Holds (Initially)**
  Argument B looks identical, but the inference lands differently because the "system" in Premise 2 is not a biological accident; it is a **designed artifact**. The filter was created *for the purpose* of filtering. In the case of artifacts, function is constitutive: a clogged filter isn't just statistically different from a clean one; it is *failing to be what it is*. The "ought" here is internal to the object's identity, derived from the intentional act of its creation, not projected onto it by the observer.

  **The One Feature**
  The separating feature is **Constitutive Teleology** (Intentional Design).
  *   In **Argument B**, the purpose (filtering) was deliberately built into the object by an agent. The normativity comes from the match between the object and its design specs.
  *   In **Argument A**, the purpose (survival) is only "as-if." Evolution has no intent. To say the valve *ought* to work is to project human goals onto blind nature.

  **The Collapse**
  Delete **Constitutive Teleology** from Argument B. Imagine the "filter" is actually a random accumulation of mineral deposits in a pipe that *happens* to catch debris, with no designer.
  *   *New Premise 2:* "This mineral accumulation restricts fluid flow."
  *   *New Conclusion:* "Therefore, this accumulation ought not exist."
  Without the design intent, Argument B collapses back into Argument A. We are left describing a physical state and magically conjuring a normative rule. The "ought" evaporates the moment the designer disappears.

  **The Steelmanned Objection (From Your Friend)**
  "Design doesn't solve the gap; it just moves it. Unless you add a premise that says 'We *ought* to respect the designer's intent,' the fact that a human built the filter still doesn't prove you *must* fix it. You've replaced a biological 'is' with a historical 'is' (someone made this), but you still haven't derived a binding 'ought' without smuggling in a goal."

  ***

  ### The Shortfall (Read This Aloud)

  **Honest Answer:** The spec cannot be met in full. Neither argument actually derives a **categorical** ought (one that binds regardless of desire) from purely descriptive premises. Argument B only works if we implicitly accept the goal of the system (clean water/operation). If the technician doesn't care if the system works, the "ought" has no grip.

  **What This Shows:** This shortfall *is* the lesson. The Is-Ought gap isn't a superstition; it's the observation that **normativity always requires a commitment.** Argument A fails because it hides the commitment (valuing survival). Argument B succeeds pragmatically because the commitment (valuing the machine's function) is shared and explicit in the context, but logically, it still rests on a hidden "If we want this to work..." premise. The gap remains because facts alone never force a goal; they only tell us how to reach one we already have.
