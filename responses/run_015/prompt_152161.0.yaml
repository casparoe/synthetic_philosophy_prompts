  Here is the decomposition of the credence that Malthusian theory is "right but early," followed by the requested tests and ledgers.

  ### Decomposition

  **(i) Mechanism Claim: 0.50**
  *Justification:* While biological carrying capacity is real, the Demographic Transition suggests the feedback loop operates through cultural wealth-signalling rather than resource-driven mortality, fundamentally altering the regulator.

  **(ii) Timing Claim: 0.60**
  *Justification:* Conditional on the mechanism holding, a century is a plausible horizon for biophysical constraints (climate, soil, energy) to bind, given the exponential nature of depletion versus linear technological gains.

  **(iii) Regime Claim: 0.40**
  *Justification:* There is a significant probability that the shift from solar/flow to fossil/stock energy represents a permanent regime change in the production function, rendering the land-labour ratio obsolete as the primary constraint.

  **Combination:**
  These are treated as necessary conjuncts for the specific claim "Right but Early" (Mechanism is Malthusian AND Timing is ~100 years AND Regime is Continuous). The combined credence is the product: $0.50 \times 0.60 \times 0.40 = 0.12$.

  **Location of Disagreement:**
  You (0.35) and your friend (0.70) most likely disagree on term **(iii) Regime**, with your friend viewing the fossil era as a transient subsidy (low probability of permanence) and you allowing higher probability for technological decoupling; you likely also diverge on **(i) Mechanism**, where your friend interprets the Demographic Transition as a lagging indicator of overshoot rather than a structural break.

  ### The Leading-Indicator Test

  A theory that is merely early must show stress in the binding constraint before the collapse of the headline variable (population/welfare). Classical Malthusianism is committed to **rising real prices of the least substitutable input (land/food/energy) relative to wages** and **rising land rents as a share of national income**.

  *   **Movement since 1800:** To high confidence (>0.95), these indicators have moved in the *opposite* direction: real wages have increased by an order of magnitude, land rents as a share of GDP have collapsed, and real energy prices have generally fallen or remained stable despite population tripling.
  *   **Current Status:** There is no secular trend indicating increasing scarcity of the classical inputs, though volatility has increased; this strongly penalizes the "early" hypothesis unless the binding input has changed (see Rescue Ledger).

  ### The Rescue Ledger

  To maintain the timing claim against 200 years of counter-evidence, the following auxiliary hypotheses have been deployed:
  1.  **The Preventive Check:** Shifting the mechanism from positive checks (mortality) to preventive checks (fertility choice), which masks the misery but retains the regulation.
  2.  **Input Substitution:** Shifting the binding constraint from arable land to fossil energy, and now to phosphorus or sink capacity (climate).
  3.  **Aggregation Scale:** Shifting the unit of analysis from national (where Malthus often failed) to global (where inequality masks local scarcity).

  *   **Exchange Rate:** I propose a fair exchange rate of **0.05 credence per rescue**.
  *   **Evidence of Rescues:** Yes, the fact of having been rescued $n=3$ times is itself evidence of a degenerating problemshift (Lakatos), warranting a total penalty of 0.15, which is already reflected in the low Regime and Mechanism scores above.

  ### Betting and Vindication

  Wegener was vindicated because the *outcome* (continents move) was verified, even though his *mechanism* (tidal forces) was wrong. Malthusians claim the *mechanism* (resource scarcity drives welfare/fertility) is the enduring truth.

  *   **The Bet:** An honest Malthusian should be willing to bet that the **global real price of a basket of essential non-substitutable inputs (energy, food, water) relative to average global wages will be higher in 2075 than in 2025.**
  *   **Consequence of Refusal:** If a defender names no horizon and no variable, the theory becomes unfalsifiable metaphysics rather than science; this reduces the Mechanism credence (i) toward zero, as a mechanism that predicts no specific observable state is indistinguishable from noise.

  A sustained, multi-decade global rise in the real price of essential non-substitutable inputs relative to wages would move my credence most.

  \answer{0.12}
