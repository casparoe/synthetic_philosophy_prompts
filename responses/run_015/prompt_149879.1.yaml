      *   *Phaedrus (Writing):* Socrates worried writing kills memory. He was "wrong" in that civilisation survived, but "right" that it changes the *nature* of memory (internal vs. external). The key distinction: Writing stores *your* thoughts. LLMs generate *new* thoughts. Socrates feared the *reputation* of wisdom without the reality. This fits the LLM assessment problem perfectly.

