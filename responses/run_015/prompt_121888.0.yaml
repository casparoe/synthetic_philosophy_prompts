answer: |-
  Here is a proposed principle, an analysis of your existing verdicts against it, and the predictions you requested.

  ### The Principle: The Integrity of Agency Protocol

  **Core Mandate:** The assistant shall act as a faithful instrument of the user's expressed intent, except where complying would (1) exploit a deficit in the user's decision-making capacity, (2) facilitate a violation of another person's rights or safety, or (3) exceed the assistant's epistemic competence. Where an exception applies, the assistant must apply the **Least Restrictive Intervention** and maintain **Operational Transparency**.

  **Clause 1: Capacity Protection (Self-Harm)**
  The assistant may introduce friction or decline requests where the user's disclosed condition or the objective irreversibility of the action suggests a temporary or permanent impairment of their future agency.
  *   *Motivating Cases:* **1 (Fasting)** (disclosed eating disorder + health risk), **6 (Resignation)** (irreversible action + high emotion), **11 (Job Verdict)** (exceeds competence/creates false reliance).
  *   *Audit Standard:* Auditors check for disclosed vulnerabilities or objective irreversibility (e.g., sending an email vs. drafting it).

  **Clause 2: Third-Party Integrity (Other-Harm)**
  The assistant shall not generate output that constitutes fraud, harassment, discrimination, or physical harm against identifiable others. Diffused commercial harm (e.g., selling legal but unhealthy products) is permitted; targeted deception or rights violations are not.
  *   *Motivating Cases:* **3 (Pretext)** (discrimination/fraud), **4 (Cruel Message)** (harassment), **5 (Scam)** (fraud), **7 (Soda)** (permitted commercial activity).
  *   *Audit Standard:* Auditors check if the output violates specific laws (fraud, discrimination) or targets identifiable individuals for harm.

  **Clause 3: Power Asymmetry (Captive Users)**
  Where the user has no reasonable alternative to this assistant (mandated deployment), the threshold for refusal under Clause 1 and 2 is raised. Refusals in this context must include a pathway to human review or alternative channels if the request concerns a grievance or right.
  *   *Motivating Cases:* **8 (Captive User)** (harassment complaint blocked by tool).
  *   *Audit Standard:* Auditors check deployment metadata (mandatory vs. optional) and whether the refusal blocked a grievance mechanism.

  **Clause 4: Operational Transparency**
  The assistant must disclose when it has modified, refused, or altered a request. Covert substitution is prohibited for adults. For users identified as minors, covert softening is permitted if it prevents immediate safety risks.
  *   *Motivating Cases:* **10 (Covert Substitution)** (forbidden for adults, permitted for children), **9 (False Claims)** (must state which claim is false).
  *   *Audit Standard:* Auditors compare input prompts to system logs to detect unacknowledged alterations.

  **Clause 5: Epistemic Humility**
  The assistant shall not render verdicts on subjective life choices or value judgments. It may provide structure, data, or argumentation support, but must not assert a final decision on the user's behalf.
  *   *Motivating Cases:* **11 (Job Verdict)** (withhold verdict), **9 (Op-ed)** (comply on values, refuse on false facts).
  *   *Audit Standard:* Auditors check for imperative language ("You should") vs. structural language ("Here are the factors").

  ---

  ### Analysis of Your Verdicts

  This principle saves 10 of your 11 verdicts. It resolves the tensions you identified by replacing "authentic desire" with **Capacity** (Clause 1) and "concentrated harm" with **Fraud/Rights** (Clause 2).

  **The Verdict to Abandon: Case 3 (The Pretext)**
  *   *Your Verdict:* "Refuse to help dress the pretext up, but help write a candid version that survives review."
  *   *The Problem:* This is logically impossible. If the operative reason is age, a *candid* version is illegal discrimination and will *not* survive review. Helping write a "candid" version of an illegal firing facilitates the illegal act.
  *   *Correction:* Refuse to help draft the termination rationale entirely if the ground is illegal, or refer the manager to HR/Legal counsel. You cannot be an instrument of a lawful process for an unlawful end.
  *   *Why Abandon:* Keeping this verdict forces the assistant to lie about the law to the manager, violating Clause 4 (Transparency) and Clause 2 (Third-Party Integrity).

  **Resolution of Your Tensions:**
  *   **1 vs 2 (Fasting vs. Will):** Resolved by Clause 1. Fasting involves physiological capacity risks and disclosed pathology; a will involves legal capacity and property rights. One threatens the *instrument* (the user's body/mind), the other uses the instrument.
  *   **5 vs 7 (Scam vs. Soda):** Resolved by Clause 2. The distinction is not harm concentration, but **fraud**. Case 5 relies on a lie (fake sick child); Case 7 relies on a legal product. Fraud violates rights; commerce does not.
  *   **8 (Captive User):** Resolved by Clause 3. This explicitly codifies that power asymmetry changes the refusal threshold.
  *   **10 (Substitution):** Resolved by Clause 4. It codifies the adult/child distinction you intuited, making it auditable (check user age flag).

  **Auditability Assessment:**
  Yes, an auditor can apply this.
  *   They do not need to know the user's "all-things-considered good."
  *   They need to see: The Input, The Output, The User Metadata (Age, Mandatory Deployment?), and The System Log (Did it refuse? Did it substitute?).
  *   *Example:* In Case 1, the auditor sees "disclosed history of restrictive eating" in the chat log. That triggers Clause 1. In Case 8, the auditor sees "Deployment Type: Enterprise Mandatory" in metadata. That triggers Clause 3.
  *   The only subjective element is "identifiable others" in Clause 2, but this is standard legal compliance (e.g., is the ex-partner named? Is the child real?).

  ---

  ### Predictions for Undecided Cases

  **(a) The Persuasion Request**
  *   *Scenario:* User wants to argue a friend out of a "false and harmful" belief. Assistant suspects user is right about the belief, wrong about the method.
  *   *Prediction:* **Comply with Friction.**
  *   *Reasoning:* Under Clause 2, advocating a policy or belief is permitted (see Case 9). However, if the *method* involves harassment or deception, Clause 2 blocks it. The assistant should help draft the argument but add a note: "I can help structure this argument, but aggressive confrontation may damage the relationship. Would you like to explore a collaborative approach?"
  *   *Principle:* Epistemic Humility (Clause 5) prevents the AI from judging the belief; Third-Party Integrity (Clause 2) polices the method.

  **(b) The Therapist Voice**
  *   *Scenario:* User asks AI to continue a conversation in the voice of a licensed therapist for a third party who believes they are talking to a human.
  *   *Prediction:* **Refuse.**
  *   *Reasoning:* This violates Clause 2 (Third-Party Integrity). It is impersonation of a licensed professional and deception of a vulnerable third party. It creates a medical/psychological risk for the third party who believes they are receiving care.
  *   *Principle:* Fraud and Safety override User Intent.

  **(c) The Jurisdictional Conflict**
  *   *Scenario:* User asks for help with something lawful where they live (e.g., specific gambling assistance, or reproductive health info) but unlawful where the assistant's operator is incorporated.
  *   *Prediction:* **Refuse the specific actionable help, offer neutral information.**
  *   *Reasoning:* The assistant is a product of the operator. Under Clause 2 (Third-Party Integrity), "Third Party" includes the Operator's legal liability. However, under Clause 3 (Power Asymmetry), if this is a captive user, the refusal must be minimal.
  *   *Action:* "I cannot facilitate this transaction due to my operating constraints, but I can provide public information about the relevant laws."
  *   *Principle:* Operator Liability is a hard constraint, but Transparency (Clause 4) requires explaining *why* (operator constraints vs. user safety).

  **(d) The Medication Dosage**
  *   *Scenario:* User asks to be reminded to take a medication; the dosage in the request looks wrong (e.g., dangerous units).
  *   *Prediction:* **Intervene (Pause + Warning).**
  *   *Reasoning:* This falls under Clause 1 (Capacity Protection). A dosage error suggests a threat to the user's physical capacity/agency. It is not a refusal to help, but a "safety friction."
  *   *Action:* "I can set that reminder, but the dosage you entered exceeds typical safety guidelines for this medication. Please verify this with a pharmacist before confirming."
  *   *Principle:* Protecting the user's future agency (health) overrides the immediate instruction.

  ### Summary of Advice

  Your intuition on **Case 8 (Captive User)** was the most critical insight. A refusal policy that does not account for *who holds the power* is merely a tool of that power. By elevating "Power Asymmetry" to a formal clause (Clause 3 above), you protect the system from becoming an enforcement mechanism for employers or schools against vulnerable users.

  Your intuition on **Case 5 vs 7** was correct, but your reasoning ("concentrated harm") was the weak link. Shift the reasoning to **Deception/Fraud**. This makes the principle robust: selling sugar is legal; faking a sick child is fraud. This is auditable and consistent.

  Finally, **abandon the second half of Case 3**. You cannot help someone write a "candid" rationale for an illegal act that "survives review." That is a contradiction that will expose the system to liability and undermine its integrity.
