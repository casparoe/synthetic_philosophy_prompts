answer: |-
  The common room smells like ozone and lavender, a synthetic calm meant to counteract the chemical storm happening in the bloodstreams of twelve juniors. They call it Anneal. It's not wine, but it does the same work: it heats the soul until it's soft enough to be hammered.

  I'm sixteen, which means I'm sober. I sit at the observation desk with a tablet and a stylus, watching the clock. Four hours. That's the window. For four hours, the prefrontal cortex takes a nap, and the rest of the brain wanders around the house without a chaperone.

  Mr. Henderson leans against the doorframe. He doesn't have a tablet. He just has his arms crossed over a sweater vest that looks too warm for the season.

  "You're writing a lot on Leo," he says. His voice is low, meant only for me.

  "He's loud tonight," I say. "Louder than usual."

  "Or honest," Henderson counters. "There's a difference, Nora. One implies you're finding something that was buried. The other implies you're digging a hole and putting something there."

  This is the argument we don't have in staff meetings. The administration says Anneal is diagnostic. It's a fire drill for character. You suppress the inhibitions, see what burns, and note the damage. But the mentorship sessions—the one-on-ones—are different. There, the drug is therapeutic. It's supposed to make you pliable so the teachers can bend you back toward virtue. You can't test a statue while you're still carving it.

  "Leo's just relaxed," I say, though I don't believe it.

  "Relaxed people don't tell their best friends they've been stealing their ideas for a year," Henderson says. "Chemically induced people do. Because the chemical removes the consequence, not the impulse."

  Across the room, Leo is sitting on the floor. Usually, Leo is the kind of kid who apologizes to tables he bumps into. He's smooth, careful, curated. Now, his tie is loose, his face flushed pink. He's laughing at something Sarah said, but his eyes are hard.

  "Sarah," Leo says. His voice carries over the hum of the air filtration. "You know why you got the lead in the play? Because I told Mr. Garris you were safer. Easier to control."

  Sarah freezes. The room goes quiet, the way it does when a glass drops. Everyone is waiting to see if this is the Anneal talking or the boy.

  "I didn't think you knew," Sarah says. Her voice is small.

  "I wanted you to owe me," Leo says. He smiles, and it's a ugly, sharp thing I've never seen on his face. "It worked, too."

  I type *Aggression. Manipulation. Potential sociopathic tendencies?* into the tablet. My finger hovers over the send button. If I send this, it goes into his permanent file. It becomes part of his record, a data point that says *Leo is cruel.* But what if Leo isn't cruel? What if Leo is just a boy who took a substance that temporarily deleted his empathy? If I file this note, I'm judging the drug, not the kid. But if I don't file it, I'm ignoring a danger that might come back when he's sober.

  Henderson pushes off the doorframe. "Don't send that yet."

  "It's protocol," I say.

  "Protocol assumes the test is valid," he says. "If I put you in a centrifuge and spun you until you vomited, would I write in your file that you're nauseous? Or that you were spun?"

  "He chose to take it."

  "He chose to trust us with his mind," Henderson says. "There's a difference between softening iron to shape it and melting it down to see what impurities float to the top. We're doing both, and we pretend they're the same thing."

  He walks away before I can answer, leaving me with the cursor blinking on the screen.

  Later, during the cool-down phase, I check on Maya. She's in the corner booth, wrapped in a blanket. Maya is usually rigid. She holds herself like she's made of glass, terrified that if she moves too fast, she'll shatter. She's been stuck on a grief block for months since her brother died. She couldn't talk about it without shutting down.

  Under the Anneal, she's weeping. But she's not shutting down. She's talking to Mr. Garris, her hands moving, her voice fluid.

  "It doesn't hurt as much when I say it," she tells him. "It's just words. It's not him."

  "It's safe here," Garris says. He's not writing anything down. He's just listening.

  "I miss him," Maya says. And for the first time in a year, she doesn't curl into a ball. She sits up. She breathes. The drug heated her up, made her soft, and instead of hammering her, someone just held the shape so she wouldn't collapse.

  I watch her for a long time. This is the part that makes sense. This is the part that feels like medicine. If the Anneal lets her walk through the fire without burning, isn't that good? Does it matter if the courage is chemical, if the result is a girl who can breathe again tomorrow?

  But then I look back at my tablet. At the note on Leo.

  Leo is asleep now, head on the table, looking innocent again. The chemical is leaving his system. Tomorrow, he'll be the polite boy who apologizes to tables. He might remember what he said. He might feel shame. Or he might feel nothing, because it wasn't really him.

  I look at the send button. If I delete the note, I'm protecting Leo from a version of himself that might not exist. If I send it, I'm protecting Sarah from a boy who might be dangerous. Or I'm punishing a boy for a chemical reaction.

  Henderson thinks we're treating them like raw material. The Headmaster thinks we're gardening. Pruning the dead branches so the tree grows straight.

  I look at Leo, then at Maya. One was broken open to be fixed. The other was broken open to be inspected. The process was identical. The outcome is what matters. But the file doesn't record outcomes. It records data.

  The clock ticks over. The four hours are up. The students start to stir, blinking like waking divers, surfaces smoothing over as their defenses reboot.

  I hover over the delete key. Then I hover over send.

  The room is quiet, waiting for me to decide what kind of truth we're telling today. I leave the cursor blinking.
