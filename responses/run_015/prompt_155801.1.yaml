  ### The Underlying Rules of Her "a" Theory

  Your friend's judgments reveal a specific set of necessary and sufficient conditions. She is not relying on a single rule, but rather a weighted system of constraints. Based on her seven previous verdicts, we can deduce the following four principles:

  1.  **The Orientation Constraint (from Judgment 5):**
      The letterform must maintain a specific vertical vector relative to the baseline. An "a" has a defined "up" and "down." Rotating it 180 degrees destroys its identity, even if the topology remains intact. This rules out the new symbol *if* the stacking confuses the vertical hierarchy, but since your new symbol is upright, it passes this test.

  2.  **The Continuity Constraint (from Judgment 3):**
      The strokes forming the bowl and the tail must be physically connected. Detached floating elements are classified as "noise." Your new symbol passes this test because it is executed in a continuous handwriting stroke.

  3.  **The Substance Neutrality Principle (from Judgment 4):**
      The identity resides in the shape, not the ink. Whether the form is created by positive ink or negative space is irrelevant. This confirms she is judging *gestalt* (the whole shape), not material.

  4.  **The Topological Hierarchy Rule (from Judgments 1, 2, 6, and 7):**
